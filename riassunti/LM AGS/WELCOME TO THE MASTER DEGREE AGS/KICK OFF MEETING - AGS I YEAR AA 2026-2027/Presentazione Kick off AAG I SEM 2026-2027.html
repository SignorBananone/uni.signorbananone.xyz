  &lt;/div&gt;

  &lt;h3&gt;Open Badge TRANSET: organizzazioni in transizione&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Open Badge&lt;/b&gt;: un attestato digitale verificabile (un&#x27;immagine con dentro i metadati: chi lo rilascia, per cosa, con quali criteri) da mostrare su CV e LinkedIn. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Segue lo standard internazionale Open Badges di 1EdTech, nato in Mozilla (&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1edtech.org&lt;/a&gt;).&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;TRANSET&lt;/b&gt; riconosce un percorso multidisciplinare sulla &lt;b&gt;transizione ecologica, digitale e sociale&lt;/b&gt;. Fa parte del progetto con cui il Dipartimento è stato riconosciuto &lt;b&gt;Dipartimento di Eccellenza 2023-2027&lt;/b&gt; dal MUR &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;
    &lt;p style=&quot;font-weight:500;margin-bottom:.4rem&quot;&gt;Simulatore: hai i requisiti per il badge?&lt;/p&gt;
    &lt;label class=&quot;note&quot; for=&quot;tEv&quot;&gt;Eventi TRANSET frequentati: &lt;b id=&quot;tEvV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tEv&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;
    &lt;label class=&quot;note&quot; for=&quot;tPr&quot;&gt;Presenza media registrata a ciascun evento: &lt;b id=&quot;tPrV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tPr&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
    &lt;label class=&quot;note&quot; for=&quot;tWd&quot;&gt;Parole del diario riflessivo: &lt;b id=&quot;tWdV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tWd&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:.6rem&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;tChk&quot; font-size=&quot;13&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;tOut&quot; class=&quot;out&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Le regole dello slide 21, in tre passi: &lt;b&gt;1)&lt;/b&gt; partecipa ad almeno 5 eventi o attività TRANSET del calendario pubblicato; &lt;b&gt;2)&lt;/b&gt; registra la presenza (form, firma al desk o report online), che deve coprire il 75% della durata; &lt;b&gt;3)&lt;/b&gt; completa il percorso con un diario riflessivo individuale di 800-1.000 parole. A cosa serve: portfolio di competenze, CV e LinkedIn, networking con docenti, imprese e professionisti.&lt;/p&gt;

  &lt;details&gt;&lt;summary&gt;Gli eventi TRANSET dell&#x27;autunno 2026 (slide 22)&lt;/summary&gt;&lt;div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;Settembre&lt;/b&gt;: «Populismi, genere e rappresentanze: c&#x27;è ancora spazio per i corpi intermedi?», a partire dal libro &lt;i&gt;Disintermediare stanca&lt;/i&gt; di Francesco Seghezzi. I &lt;span class=&quot;term&quot;&gt;corpi intermedi&lt;/span&gt; sono le organizzazioni che stanno fra cittadino e Stato: sindacati, associazioni di categoria.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Settembre&lt;/b&gt;: «Mercato, relazioni e valore d&#x27;impresa: come si orienta la governance?», presentazione di &lt;i&gt;Governance Under Influence: The Role of Political Connections in the ESG Transition&lt;/i&gt;. Il tema è legato direttamente a governance e sostenibilità.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Ottobre&lt;/b&gt;: «Giovani, maschilità e politica», con i primi risultati del progetto MEN4DEM.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Novembre&lt;/b&gt;: «Il sapere che conta», libro della Prof.ssa Annamaria Lusardi (Stanford University) sull&#x27;&lt;span class=&quot;term&quot;&gt;alfabetizzazione finanziaria&lt;/span&gt; (financial literacy).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Novembre&lt;/b&gt;: «Contrastare la violenza: dal risentimento di genere alla trasformazione pro-sociale».&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Dicembre&lt;/b&gt;: «Binance Tour», con Gian Luca Comandini, sull&#x27;alfabetizzazione finanziaria nella vita quotidiana.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Dicembre&lt;/b&gt;: «Maschilità nella società digitale».&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Dicembre&lt;/b&gt;: «Progetto continuità» (la descrizione è tagliata nella slide).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Lo slide 23 contiene un QR code, probabilmente quello del calendario o della registrazione: inquadralo dalla slide originale.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;PhD Day 2026 · Poster Gallery&lt;/h3&gt;
  &lt;p&gt;Il &lt;b&gt;25 settembre 2026&lt;/b&gt; la Scuola di Alta Formazione Dottorale ha presentato le ricerche di dottorandi e dottorande. Per AGS conta soprattutto il dottorato in &lt;b&gt;Management, Accounting and Finance&lt;/b&gt;, con temi come &lt;i&gt;shareholder activism and M&amp;amp;A&lt;/i&gt; e l&#x27;accesso al mercato dei mutui &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;. Serve a vedere che cosa si studia «dopo» la magistrale e a trovare idee per la tesi.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shareholder activism&lt;/b&gt;: quando gli azionisti usano il loro peso (voto, proposte, pressione pubblica) per cambiare le scelte del management. &lt;b&gt;M&amp;amp;A&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;mergers and acquisitions&lt;/span&gt;): fusioni e acquisizioni di imprese.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Hai frequentato 5 eventi TRANSET al 75% e scritto un diario di 700 parole. Ottieni il badge?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;No, il diario è troppo corto&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;No, servono 10 eventi&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Esatto: il diario deve essere di 800-1.000 parole.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Quanti CFU vale un CREO lab e in che semestre si svolge?&lt;/summary&gt;&lt;div&gt;6 CFU, nel II semestre. Ci sono 4 laboratori, due in italiano e due in inglese.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è un Open Badge e perché è utile?&lt;/summary&gt;&lt;div&gt;È un attestato digitale con metadati verificabili su chi lo rilascia e con quali criteri. Si può mostrare su CV e LinkedIn per documentare competenze che il voto di laurea non mostra.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part mat&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Rules of conduct · Thesis · Contacts · slide 26-36&lt;/span&gt;
  &lt;h2&gt;Regole, tesi e a chi rivolgersi&lt;/h2&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;A lezione&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rispetta orari e &lt;span class=&quot;term&quot;&gt;rules of conduct&lt;/span&gt; (regole di comportamento).&lt;/li&gt;&lt;li&gt;Se frequenti in presenza, segui le regole di sicurezza.&lt;/li&gt;&lt;li&gt;Leggi con attenzione le &lt;span class=&quot;term&quot;&gt;guidelines&lt;/span&gt; e il &lt;span class=&quot;term&quot;&gt;vademecum&lt;/span&gt; con le scadenze.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Agli esami&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;È &lt;b&gt;obbligatorio iscriversi agli appelli, o cancellarsi, entro le scadenze&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Rispetta le procedure.&lt;/li&gt;&lt;li&gt;Studia &lt;b&gt;tutti&lt;/b&gt; i libri e i riferimenti indicati.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Non rispondere con elenchi puntati: «it is not a slide!»&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;«Do not answer using lists»: la differenza in pratica&lt;/h3&gt;
  &lt;p&gt;All&#x27;esame scritto la domanda chiede di ragionare: collegare concetti, spiegare cause e conseguenze. Un elenco mostra che ricordi le parole, non che hai capito. Prova a confrontare due risposte alla stessa domanda.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;swap&quot;&gt;
    &lt;p style=&quot;font-weight:500&quot;&gt;Domanda: «Why do political connections matter for corporate governance?»&lt;/p&gt;
    &lt;div class=&quot;swap&quot;&gt;&lt;button class=&quot;b pri&quot; data-v=&quot;0&quot;&gt;Risposta a elenco ✗&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;1&quot;&gt;Risposta argomentata ✓&lt;/button&gt;&lt;/div&gt;
    &lt;div data-p=&quot;0&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;access to credit&lt;/li&gt;&lt;li&gt;board composition&lt;/li&gt;&lt;li&gt;ESG&lt;/li&gt;&lt;li&gt;risks&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;Le parole chiave ci sono, ma mancano i legami: il docente non capisce se hai capito il meccanismo.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-p=&quot;1&quot; hidden style=&quot;margin-top:.8rem&quot;&gt;&lt;p&gt;Political connections shape governance because they change the incentives of those who control the firm. A connected board may obtain preferential access to credit, which lowers the cost of capital in the short run; however, this advantage can weaken monitoring and accountability towards minority shareholders. In the ESG transition, such ties may also influence which sustainability strategies are pursued, so the “G” ends up conditioning the “E” and the “S”.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Ogni frase è collegata alla precedente («because», «however», «so»): è questo il ragionamento che l&#x27;esame vuole vedere. Esempio costruito per questa pagina sul tema del libro citato nello slide 22.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Suggestions for thesis&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--sal)&quot;&gt;&lt;h4 style=&quot;color:var(--sal)&quot;&gt;Sì&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cerca un relatore (&lt;span class=&quot;term&quot;&gt;thesis supervisor&lt;/span&gt;) &lt;b&gt;con il giusto anticipo&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Quando contatti un docente, presenta un &lt;b&gt;progetto di tesi&lt;/b&gt;: tema, &lt;span class=&quot;term&quot;&gt;research question&lt;/span&gt; (la domanda di ricerca a cui la tesi risponde), titolo provvisorio.&lt;/li&gt;&lt;li&gt;Leggi la guida alla tesi e controlla le scadenze su &lt;a href=&quot;https://ls-ags.unibg.it/en/how/how-graduate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/how/how-graduate&lt;/a&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--mat)&quot;&gt;&lt;h4 style=&quot;color:var(--mat)&quot;&gt;No&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;Niente email «generiche»&lt;/b&gt; inviate a tutti i docenti per chiedere se sono disponibili come relatori.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;Un messaggio uguale per tutti fa capire che non hai ancora un&#x27;idea: chi riceve una proposta precisa la valuta molto più volentieri.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Who should you contact…&lt;/h3&gt;
  &lt;p&gt;Le slide propongono una scala in tre gradini: si parte dal più vicino al problema e si sale solo quando serve. I canali sono due, &lt;b&gt;email&lt;/b&gt; e &lt;b&gt;appointments&lt;/b&gt; (ricevimento su appuntamento) &lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;. Scegli una situazione per vedere a chi rivolgerti.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 360 300&quot; role=&quot;img&quot; aria-label=&quot;Scala dei contatti in tre livelli&quot;&gt;
      &lt;g id=&quot;lad&quot;&gt;
        &lt;g data-l=&quot;0&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;40&quot; font-weight=&quot;600&quot; fill=&quot;var(--acc)&quot;&gt;1 · Course professor&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;60&quot; font-size=&quot;12&quot;&gt;chiarimenti, problemi in aula,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;informazioni sull&#x27;insegnamento&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;1&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;110&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;140&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink2)&quot;&gt;2 · Specific professors / tutors&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;referenti study plan e internship,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;relatore di tesi, tutor del corso&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;2&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;210&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;240&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;3 · MD President&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;260&quot; font-size=&quot;12&quot;&gt;problemi trasversali,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;276&quot; font-size=&quot;12&quot;&gt;segnalazioni particolari&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;0&quot;&gt;Non ho capito un argomento della lezione&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;Non so quale esame alternativo scegliere nello study plan&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;Voglio fare un&#x27;internship presso un&#x27;azienda&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;Ho un dubbio sulla mia bozza di tesi&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;2&quot;&gt;Un problema riguarda più insegnamenti insieme&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;2&quot;&gt;Devo fare una segnalazione particolare sul corso&lt;/button&gt;
      &lt;p class=&quot;note&quot; id=&quot;ladOut&quot; style=&quot;margin-top:.6rem&quot;&gt;Clicca una situazione.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Non ti sei cancellato da un appello a cui non vai. Cosa dicono le regole?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Non importa&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;Iscrizione e cancellazione vanno fatte entro le scadenze: è obbligatorio&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;Basta avvisare il giorno dopo&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Sì: «compulsory to register / to unsubscribe by the deadlines» (slide 28).&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa porti al primo incontro con un possibile relatore?&lt;/summary&gt;&lt;div&gt;Un progetto di tesi: tema, research question, titolo provvisorio e possibilmente un&#x27;idea di metodo e di fonti. Non un&#x27;email generica sulla disponibilità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A chi scrivi per primo se un problema riguarda un solo insegnamento?&lt;/summary&gt;&lt;div&gt;Al docente del corso (course professor). Al Presidente del corso ci si rivolge per i problemi trasversali o per segnalazioni particolari.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ fonti ============ --&gt;
&lt;section class=&quot;part acc&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;✦&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Testi, norme, standard e siti citati nelle slide (o necessari per capirle). Per ognuno trovi che cosa contiene e perché conta per te. &lt;b&gt;Tutte le schede sono &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/b&gt;: i dati vengono da ricerche web dell&#x27;ottobre 2026, non dalle slide.&lt;/p&gt;

  &lt;h3&gt;Siti del corso e dell&#x27;ateneo (citati nelle slide)&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it: sito del corso AGS&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Presentazione del corso (2 anni, 120 ECTS, in inglese, curricula AIB e AG4S), study plan, regolamenti per coorte, guida alla laurea, contatti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il riferimento ufficiale per scadenze e regole. Le slide vi rimandano più volte (slide 8, 9, 30, 35).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://dipsa.unibg.it/en/international/partners-and-networks/bauhaus4eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BAUHAUS4EU, pagina DiPSA&lt;/a&gt; · &lt;a href=&quot;https://www.bauhaus4.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bauhaus4.eu&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Alleanza di 10 università europee coordinata dalla Bauhaus-Universität Weimar e cofinanziata da Erasmus+ (European Universities initiative). Si ispira ai valori del New European Bauhaus: sostenibilità, inclusione, bellezza. Bergamo lancia nel 2026-27 SLC, EBC e il primo Regional Living Lab.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte dei bandi BIP, COIL e RLL dello slide 20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://cyfe.unibg.it/it/formazione/creo-lab&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CREO Lab · CYFE, Università di Bergamo&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Laboratori interdisciplinari su innovazione, gestione dell&#x27;incertezza e lavoro in team (gruppi di circa 5 persone), coordinati dal Center for Young and Family Enterprise. Nella stessa offerta ci sono anche Start Cup Bergamo, hackathon e mentoring.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega come funziona l&#x27;attività da 6 CFU dello slide 19.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.dundee.ac.uk/postgraduate/accounting-finance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Dundee: MSc Accounting &amp;amp; Finance&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Master di un anno su international financial reporting, corporate finance e governance, international finance, risk management e strategy, con esenzioni da esami ACCA.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il II anno del double degree (slide 15). Costi e requisiti vanno controllati sul sito ufficiale e nel bando.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme e standard&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow%20up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide (2015)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Guida approvata nel Processo di Bologna: 60 crediti per anno a tempo pieno, un carico di lavoro di 1.500-1.800 ore, cioè 25-30 ore per credito, e il legame fra crediti e &lt;span class=&quot;term&quot;&gt;learning outcomes&lt;/span&gt; (risultati di apprendimento).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega che cosa significano «3 ECTS», «6 CFU» e i 120 ECTS della magistrale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://erasmus-plus.ec.europa.eu/programme-guide/erasmusplus-programme-guide&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Erasmus+ Programme Guide (Commissione europea)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Il testo ufficiale con le regole di tutte le azioni Erasmus+: mobilità per studio, BIP, alleanze universitarie. La versione 2026 è del 12.11.2025, in 24 lingue.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base normativa degli scambi dello slide 16 e dei BIP dello slide 20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unimi.it/en/international/study-abroad/blended-intensive-programmes-bip&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Blended Intensive Programmes (BIP)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Formato Erasmus+: da 5 a 30 giorni in presenza più una parte virtuale, almeno 3 ECTS, almeno 3 atenei di 3 paesi. La pagina è di un altro ateneo, ma le regole sono le stesse.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è uno dei formati dei European BAUHAUS Courses.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;COIL · Collaborative Online International Learning&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Modello di scambio virtuale nato al SUNY COIL Center (dal 2006): classi di paesi diversi co-progettano un lavoro comune online, di solito per 5-15 settimane.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;altro formato dei European BAUHAUS Courses (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unitn.it/sites/default/files/2025-01/Convenzione%20ODCEC%20TN%20e%20UniTN_%2005.03.2020.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Convenzione quadro MUR-CNDCEC (esempio di accordo locale)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Accordo del 2014 previsto dall&#x27;art. 43 del D.Lgs. 139/2005, attuato con convenzioni fra singoli atenei e Ordini. Insieme all&#x27;art. 6, c. 4, del DPR 137/2012 permette di svolgere 6 mesi di tirocinio nell&#x27;ultimo anno di laurea e prevede l&#x27;esonero dalla prima prova scritta dell&#x27;esame di Stato.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega lo slide 18. Il link porta all&#x27;accordo di Trento come esempio; per Bergamo chiedi ai coordinatori dell&#x27;internship.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dipartimenti di eccellenza (MUR)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Programma della Legge 232/2016 (art. 1, cc. 314-337): ogni cinque anni finanzia i 180 migliori dipartimenti delle università statali, con 271 milioni di euro l&#x27;anno, selezionati anche in base alla VQR (valutazione della qualità della ricerca).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega il logo «Dipartimento di Eccellenza 2023-2027» dello slide 21 e da dove vengono progetti come TRANSET.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open Badges (1EdTech)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Standard per credenziali digitali verificabili, nato in Mozilla e gestito da 1EdTech dal 2017. La versione 3.0 è allineata ai W3C Verifiable Credentials.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il formato del badge TRANSET da aggiungere a CV e LinkedIn.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Libri e progetti presentati negli eventi TRANSET&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://aisberg.unibg.it/handle/10446/311807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bellavite Pellegrini, Pellegrini, Roncella: &lt;i&gt;Governance Under Influence&lt;/i&gt; (Palgrave Macmillan, 2026)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Primo di due volumi su come le connessioni politiche influenzano la corporate governance in Italia, Francia, Germania e Regno Unito, dalla caduta del Muro alla crisi dei debiti sovrani. Fra gli effetti studiati c&#x27;è l&#x27;accesso preferenziale al credito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il più vicino ai contenuti del corso, perché unisce governance ed ESG.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.prnewswire.com/it/comunicati-stampa/unopera-fondamentale-per-il-nostro-benessere-finanziario-il-sapere-che-conta-di-annamaria-lusardi-302149809.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annamaria Lusardi: &lt;i&gt;Il sapere che conta&lt;/i&gt; (Mondadori, 2024)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Guida in sette capitoli all&#x27;ABC della finanza personale: risparmio, investimenti, inflazione, tassi d&#x27;interesse. L&#x27;autrice è economista a Stanford e dal 2017 al 2023 ha diretto il Comitato italiano per l&#x27;educazione finanziaria.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: la &lt;i&gt;financial literacy&lt;/i&gt; è la base per leggere i numeri anche fuori dal bilancio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://static.francoangeli.it/fa-contenuti/area_pdfdemo/1496.2_demo.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Francesco Seghezzi: &lt;i&gt;Disintermediare stanca&lt;/i&gt; (FrancoAngeli, 2026)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Saggio su come la spinta alla disintermediazione in mercati, politica e lavoro alimenti il populismo e metta in crisi i corpi intermedi. Contiene cinque casi nazionali: Austria, Francia, Italia, Polonia, Spagna.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: riguarda il tema stakeholder e rappresentanza, vicino all&#x27;accountability verso la società.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.uu.se/en/department/government/news/archive/2025-02-28-uppsala-university-partner-in-the-horizon-europe-funded-research-project-men4dem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MEN4DEM: Masculinities for the Future of European Democracy&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Progetto di ricerca Horizon Europe avviato nel 2025, coordinato dall&#x27;Università di Amsterdam con sei atenei partner. Studia il rapporto tra modelli di maschilità e democrazia in Europa.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base dell&#x27;evento di ottobre (slide 22) ed è un esempio di progetto europeo di ricerca.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;span&gt;Le parti segnate &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; vengono da ricerche web, con il link indicato.&lt;/span&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // barra di avanzamento e nav attiva
  var bar=document.getElementById(&#x27;bar&#x27;),links=[].slice.call(document.querySelectorAll(&#x27;nav.top a&#x27;));
  var secs=links.map(function(a){return document.querySelector(a.getAttribute(&#x27;href&#x27;))});
  function onScroll(){
    var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    bar.style.width=(max&gt;0?h.scrollTop/max*100:0)+&#x27;%&#x27;;
    var cur=0;secs.forEach(function(s,i){if(s&amp;&amp;s.getBoundingClientRect().top&lt;120)cur=i});
    links.forEach(function(a,i){a.classList.toggle(&#x27;on&#x27;,i===cur)});
  }
  addEventListener(&#x27;scroll&#x27;,onScroll,{passive:true});onScroll();

  // linguette
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var tabs=t.querySelectorAll(&#x27;[role=tab]&#x27;),pans=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    tabs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,i===j)});
      pans.forEach(function(p,j){p.hidden=i!==j});
    })});
  });

  // passi
  document.querySelectorAll(&#x27;[data-steps]&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.st&#x27;),d=s.querySelector(&#x27;.dots&#x27;),i=0,pv=s.querySelector(&#x27;[data-prev]&#x27;),nx=s.querySelector(&#x27;[data-next]&#x27;);
    st.forEach(function(){d.appendChild(document.createElement(&#x27;i&#x27;))});
    function go(n){i=Math.max(0,Math.min(st.length-1,n));
      st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});
      d.querySelectorAll(&#x27;i&#x27;).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j&lt;=i)});
      pv.disabled=i===0;nx.disabled=i===st.length-1;}
    pv.addEventListener(&#x27;click&#x27;,function(){go(i-1)});nx.addEventListener(&#x27;click&#x27;,function(){go(i+1)});go(0);
  });

  // domande a scelta
  document.querySelectorAll(&#x27;[data-mc]&#x27;).forEach(function(m){
    var fb=m.querySelector(&#x27;.fb&#x27;);
    m.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      m.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;)});
      if(b.hasAttribute(&#x27;data-ok&#x27;)){b.classList.add(&#x27;ok&#x27;);fb.textContent=&#x27;✓ &#x27;+fb.getAttribute(&#x27;data-fb&#x27;);}
      else{b.classList.add(&#x27;ko&#x27;);fb.textContent=&#x27;✗ Non proprio: riprova.&#x27;;}
    })});
  });

  // ruota dell&#x27;anno
  var W=document.getElementById(&#x27;wheel&#x27;);
  if(W){
    var segs=[
      {a:0,b:105,c:&#x27;var(--acc)&#x27;,t:&#x27;I semestre: lezioni&#x27;,d:&#x27;Da metà settembre a dicembre. Per il 2026-27: dal 14 settembre al 19 dicembre 2026, con alcune sospensioni (vedi sotto).&#x27;},
      {a:105,b:150,c:&#x27;var(--ard)&#x27;,t:&#x27;Sessione invernale&#x27;,d:&#x27;Gennaio-febbraio: esami del I semestre. Il calendario segna il 1° appello intorno al 7 gennaio e il 2° intorno al 26 gennaio 2027.&#x27;},
      {a:150,b:240,c:&#x27;var(--acc)&#x27;,t:&#x27;II semestre: lezioni&#x27;,d:&#x27;Da fine febbraio a fine maggio. Il calendario indica l’inizio il 15 febbraio e la fine il 28 maggio 2027, con le prove intermedie il 22-23 aprile e le vacanze di Pasqua.&#x27;},
      {a:240,b:300,c:&#x27;var(--ard)&#x27;,t:&#x27;Sessione estiva&#x27;,d:&#x27;Giugno-luglio: esami. Il calendario mostra il 3° appello a fine maggio-inizio giugno e il 4° a fine giugno.&#x27;},
      {a:300,b:330,c:&#x27;var(--rule)&#x27;,t:&#x27;Pausa estiva&#x27;,d:&#x27;Agosto: niente lezioni né esami.&#x27;},
      {a:330,b:360,c:&#x27;var(--ard)&#x27;,t:&#x27;Sessione di settembre&#x27;,d:&#x27;Da fine agosto a fine settembre: un’altra sessione d’esame (il 5° appello è intorno al 27 agosto 2027).&#x27;}
    ];
    function pt(r,deg){var a=(deg-90)*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)]}
    segs.forEach(function(s){
      var R=160,r=105,p1=pt(R,s.a+1),p2=pt(R,s.b-1),p3=pt(r,s.b-1),p4=pt(r,s.a+1),lg=(s.b-s.a)&gt;180?1:0;
      var p=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;path&#x27;);
      p.setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+p1+&#x27; A&#x27;+R+&#x27; &#x27;+R+&#x27; 0 &#x27;+lg+&#x27; 1 &#x27;+p2+&#x27; L&#x27;+p3+&#x27; A&#x27;+r+&#x27; &#x27;+r+&#x27; 0 &#x27;+lg+&#x27; 0 &#x27;+p4+&#x27;Z&#x27;);
      p.setAttribute(&#x27;fill&#x27;,s.c);p.setAttribute(&#x27;class&#x27;,&#x27;seg&#x27;);p.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);p.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);p.setAttribute(&#x27;aria-label&#x27;,s.t);
      function show(){document.getElementById(&#x27;wheelInfo&#x27;).innerHTML=&#x27;&lt;h4&gt;&#x27;+s.t+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+s.d+&#x27;&lt;/p&gt;&#x27;;
        W.querySelectorAll(&#x27;.seg&#x27;).forEach(function(x){x.style.opacity=x===p?1:.45})}
      p.addEventListener(&#x27;click&#x27;,show);p.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();show()}});
      W.appendChild(p);
    });
    var mn=[&#x27;set&#x27;,&#x27;ott&#x27;,&#x27;nov&#x27;,&#x27;dic&#x27;,&#x27;gen&#x27;,&#x27;feb&#x27;,&#x27;mar&#x27;,&#x27;apr&#x27;,&#x27;mag&#x27;,&#x27;giu&#x27;,&#x27;lug&#x27;,&#x27;ago&#x27;];
    mn.forEach(function(m,i){var q=pt(176,i*30+15),t=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;text&#x27;);
      t.setAttribute(&#x27;x&#x27;,q[0]);t.setAttribute(&#x27;y&#x27;,q[1]+4);t.setAttribute(&#x27;text-anchor&#x27;,&#x27;middle&#x27;);t.setAttribute(&#x27;font-size&#x27;,&#x27;11&#x27;);t.setAttribute(&#x27;fill&#x27;,&#x27;var(--ink2)&#x27;);t.textContent=m;W.appendChild(t)});
  }

  // cursore delle date
  var day=document.getElementById(&#x27;day&#x27;);
  if(day){
    var start=new Date(2026,8,14);
    function D(y,m,d){return Math.round((new Date(y,m-1,d)-start)/864e5)}
    var R=[ // priorità: le prime vincono
      [D(2026,10,21),D(2026,10,23),&#x27;sosp&#x27;,&#x27;Lezioni sospese: sedute di laurea (Final Dissertations)&#x27;],
      [D(2026,11,16),D(2026,11,17),&#x27;sosp&#x27;,&#x27;Lezioni sospese: mid-term exams&#x27;],
      [D(2026,12,7),D(2026,12,8),&#x27;sosp&#x27;,&#x27;Festività: lezioni sospese&#x27;],
      [D(2026,12,20),D(2027,1,6),&#x27;sosp&#x27;,&#x27;Vacanze di Natale&#x27;],
      [D(2027,4,22),D(2027,4,23),&#x27;sosp&#x27;,&#x27;Prove intermedie del II semestre (indicativo)&#x27;],
      [D(2027,3,25),D(2027,3,30),&#x27;sosp&#x27;,&#x27;Vacanze di Pasqua (indicativo)&#x27;],
      [D(2026,9,14),D(2026,12,19),&#x27;lez&#x27;,&#x27;I semestre: lezioni&#x27;],
      [D(2027,1,7),D(2027,2,13),&#x27;esa&#x27;,&#x27;Sessione invernale d’esami&#x27;],
      [D(2027,2,15),D(2027,5,28),&#x27;lez&#x27;,&#x27;II semestre: lezioni (indicativo)&#x27;],
      [D(2027,5,31),D(2027,7,31),&#x27;esa&#x27;,&#x27;Sessione estiva d’esami (indicativo)&#x27;],
      [D(2027,8,24),D(2027,9,30),&#x27;esa&#x27;,&#x27;Sessione di fine agosto-settembre (indicativo)&#x27;]
    ];
    var col={lez:&#x27;var(--acc)&#x27;,esa:&#x27;var(--ard)&#x27;,sosp:&#x27;var(--ocr)&#x27;,x:&#x27;var(--rule)&#x27;};
    var lab={lez:&#x27;lezioni&#x27;,esa:&#x27;esami&#x27;,sosp:&#x27;sospensione&#x27;,x:&#x27;nessuna attività&#x27;};
    function state(n){for(var i=0;i&lt;R.length;i++)if(n&gt;=R[i][0]&amp;&amp;n&lt;=R[i][1])return R[i];return [0,0,&#x27;x&#x27;,&#x27;Nessuna lezione né sessione d’esame in calendario&#x27;]}
    var strip=document.getElementById(&#x27;strip&#x27;),N=381,w=760/N,html=&#x27;&#x27;;
    for(var n=0;n&lt;N;n++){html+=&#x27;&lt;rect x=&quot;&#x27;+(n*w).toFixed(2)+&#x27;&quot; y=&quot;6&quot; width=&quot;&#x27;+(w+.3).toFixed(2)+&#x27;&quot; height=&quot;24&quot; fill=&quot;&#x27;+col[state(n)[2]]+&#x27;&quot;/&gt;&#x27;}
    html+=&#x27;&lt;line id=&quot;cur&quot; x1=&quot;0&quot; x2=&quot;0&quot; y1=&quot;0&quot; y2=&quot;36&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
    [&#x27;set&#x27;,&#x27;ott&#x27;,&#x27;nov&#x27;,&#x27;dic&#x27;,&#x27;gen&#x27;,&#x27;feb&#x27;,&#x27;mar&#x27;,&#x27;apr&#x27;,&#x27;mag&#x27;,&#x27;giu&#x27;,&#x27;lug&#x27;,&#x27;ago&#x27;,&#x27;set&#x27;].forEach(function(m,i){
      var dd=D(i&lt;4?2026:2027,((8+i)%12)+1,1);if(dd&lt;0)dd=0;html+=&#x27;&lt;text x=&quot;&#x27;+(dd*w+2)+&#x27;&quot; y=&quot;44&quot; font-size=&quot;9&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+m+&#x27;&lt;/text&gt;&#x27;});
    strip.innerHTML=html;
    var cur=document.getElementById(&#x27;cur&#x27;);
    function upd(){var n=+day.value,dt=new Date(start.getTime()+n*864e5),s=state(n);
      var wd=dt.getDay();
      document.getElementById(&#x27;dayOut&#x27;).textContent=dt.toLocaleDateString(&#x27;it-IT&#x27;,{weekday:&#x27;long&#x27;,day:&#x27;numeric&#x27;,month:&#x27;long&#x27;,year:&#x27;numeric&#x27;});
      var extra=(wd===0&amp;&amp;s[2]===&#x27;lez&#x27;)?&#x27; · domenica: niente lezioni&#x27;:&#x27;&#x27;;
      document.getElementById(&#x27;dayState&#x27;).innerHTML=&#x27;&lt;span class=&quot;pill&quot; style=&quot;background:&#x27;+col[s[2]]+&#x27;;color:var(--paper)&quot;&gt;&#x27;+lab[s[2]]+&#x27;&lt;/span&gt; &#x27;+s[3]+extra;
      cur.setAttribute(&#x27;x1&#x27;,n*w);cur.setAttribute(&#x27;x2&#x27;,n*w);}
    day.addEventListener(&#x27;input&#x27;,upd);upd();
  }

  // cursore ECTS
  var e=document.getElementById(&#x27;ects&#x27;);
  if(e){function u(){var v=+e.value;document.getElementById(&#x27;ectsOut&#x27;).textContent=v+&#x27; ECTS ≈ &#x27;+(v*25)+&#x27;–&#x27;+(v*30)+&#x27; ore di lavoro&#x27;;
    document.getElementById(&#x27;ectsBar&#x27;).setAttribute(&#x27;width&#x27;,Math.max(8,v/120*600))}
    e.addEventListener(&#x27;input&#x27;,u);u();}

  // simulatore TRANSET
  var tE=document.getElementById(&#x27;tEv&#x27;);
  if(tE){var tP=document.getElementById(&#x27;tPr&#x27;),tW=document.getElementById(&#x27;tWd&#x27;),g=document.getElementById(&#x27;tChk&#x27;);
    function t(){var e=+tE.value,p=+tP.value,w=+tW.value;
      document.getElementById(&#x27;tEvV&#x27;).textContent=e;document.getElementById(&#x27;tPrV&#x27;).textContent=p+&#x27;%&#x27;;document.getElementById(&#x27;tWdV&#x27;).textContent=w;
      var c=[[&#x27;≥ 5 eventi&#x27;,e&gt;=5,Math.min(1,e/5)],[&#x27;presenza ≥ 75%&#x27;,p&gt;=75,Math.min(1,p/75)],[&#x27;diario 800-1.000&#x27;,w&gt;=800&amp;&amp;w&lt;=1000,w&gt;1000?1:Math.min(1,w/800)]];
      var h=&#x27;&#x27;;c.forEach(function(x,i){var X=i*200+5;
        h+=&#x27;&lt;rect x=&quot;&#x27;+X+&#x27;&quot; y=&quot;30&quot; width=&quot;185&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;var(--rule)&quot;/&gt;&#x27;;
        h+=&#x27;&lt;rect x=&quot;&#x27;+X+&#x27;&quot; y=&quot;30&quot; width=&quot;&#x27;+(185*x[2]).toFixed(1)+&#x27;&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;&#x27;+(x[1]?&#x27;var(--sal)&#x27;:&#x27;var(--ocr)&#x27;)+&#x27;&quot;/&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+X+&#x27;&quot; y=&quot;20&quot; fill=&quot;&#x27;+(x[1]?&#x27;var(--sal)&#x27;:&#x27;var(--ink2)&#x27;)+&#x27;&quot;&gt;&#x27;+(x[1]?&#x27;✓ &#x27;:&#x27;○ &#x27;)+x[0]+&#x27;&lt;/text&gt;&#x27;;
        if(i===2&amp;&amp;w&gt;1000)h+=&#x27;&lt;text x=&quot;&#x27;+X+&#x27;&quot; y=&quot;62&quot; font-size=&quot;11&quot; fill=&quot;var(--mat)&quot;&gt;oltre 1.000: accorcia&lt;/text&gt;&#x27;;});
      g.innerHTML=h;
      var ok=c.every(function(x){return x[1]});
      document.getElementById(&#x27;tOut&#x27;).textContent=ok?&#x27;Badge TRANSET ottenibile ✓&#x27;:&#x27;Mancano ancora dei requisiti&#x27;;}
    [tE,tP,tW].forEach(function(x){x.addEventListener(&#x27;input&#x27;,t)});t();}

  // elenco contro risposta argomentata
  var sw=document.getElementById(&#x27;swap&#x27;);
  if(sw){sw.querySelectorAll(&#x27;[data-v]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    sw.querySelectorAll(&#x27;[data-v]&#x27;).forEach(function(x){x.classList.toggle(&#x27;pri&#x27;,x===b)});
    sw.querySelectorAll(&#x27;[data-p]&#x27;).forEach(function(p){p.hidden=p.getAttribute(&#x27;data-p&#x27;)!==b.getAttribute(&#x27;data-v&#x27;)});})});}

  // scala dei contatti
  var lad=document.getElementById(&#x27;lad&#x27;);
  if(lad){var names=[&#x27;il docente del corso (course professor)&#x27;,&#x27;un docente referente o tutor specifico (study plan, internship, relatore)&#x27;,&#x27;il Presidente del corso (MD President)&#x27;];
    document.querySelectorAll(&#x27;.ladder [data-to]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var k=b.getAttribute(&#x27;data-to&#x27;);
      lad.querySelectorAll(&#x27;[data-l]&#x27;).forEach(function(gg){gg.style.opacity=gg.getAttribute(&#x27;data-l&#x27;)===k?1:.3});
      document.querySelectorAll(&#x27;.ladder [data-to]&#x27;).forEach(function(x){x.classList.toggle(&#x27;pri&#x27;,x===b)});
      document.getElementById(&#x27;ladOut&#x27;).innerHTML=&#x27;→ Rivolgiti a &lt;b&gt;&#x27;+names[k]+&#x27;&lt;/b&gt;, via email o su appuntamento.&#x27;;})});}
})();
&lt;/script&gt;
