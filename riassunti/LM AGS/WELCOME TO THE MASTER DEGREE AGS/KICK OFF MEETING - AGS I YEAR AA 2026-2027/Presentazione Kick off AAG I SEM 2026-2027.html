    &lt;a href=&quot;#s7&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;25&quot; y=&quot;268&quot; width=&quot;190&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--mat-bg)&quot; stroke=&quot;var(--mat)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--mat)&quot;&gt;7 · Regole e tesi&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;313&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;esami, tesi, contatti&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sal&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Introduction · slide 1-4, 8, 10-12&lt;/span&gt;
  &lt;h2&gt;Il corso, le persone, dove trovare le informazioni&lt;/h2&gt;
  &lt;p&gt;Il kick-off è un incontro di orientamento, non una lezione di contenuto: serve a farti partire con il piede giusto. Prima di tutto conviene capire le tre parole del titolo, perché ritornano in tutti gli esami del corso.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Accounting&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Accountability&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Governance&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sustainability&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt; (ragioneria, contabilità): il sistema che misura, registra e comunica i fatti economici di un&#x27;organizzazione, ad esempio con il bilancio. Risponde alla domanda «quanto vale e come va questa azienda?».&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Esempio: il bilancio di un&#x27;impresa di Bergamo che mostra ricavi, costi e debiti dell&#x27;anno.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt; (responsabilità di rendere conto): l&#x27;obbligo di spiegare e giustificare a qualcuno (soci, finanziatori, cittadini, comunità) come si sono usate le risorse e quali risultati si sono ottenuti. L&#x27;accounting è uno degli strumenti per farlo, ma non l&#x27;unico.&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Esempio: un ospedale pubblico che pubblica i risultati e i costi dei servizi per rendere conto alla Regione e ai cittadini.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Governance&lt;/b&gt; (governo dell&#x27;impresa): le regole, gli organi e i meccanismi con cui un&#x27;organizzazione viene diretta e controllata: consiglio di amministrazione, controlli, rapporti con gli azionisti e con gli altri &lt;span class=&quot;term&quot;&gt;stakeholder&lt;/span&gt; (i portatori di interesse).&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;È la «G» dell&#x27;acronimo &lt;span class=&quot;term&quot;&gt;ESG&lt;/span&gt; (Environmental, Social, Governance), che torna in uno dei libri presentati negli eventi TRANSET (sezione 6).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sustainability&lt;/b&gt; (sostenibilità): la capacità di creare valore nel tempo tenendo conto degli effetti ambientali e sociali, non solo di quelli economici. Nel nome del corso compare accanto ad accounting e governance: si studia come misurare, governare e rendicontare anche questi effetti.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il corso in breve&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Che cos&#x27;è&lt;/h4&gt;&lt;p&gt;Laurea magistrale (&lt;span class=&quot;term&quot;&gt;Master Degree&lt;/span&gt;) in Accounting, Governance and Sustainability del &lt;span class=&quot;term&quot;&gt;Department of Management&lt;/span&gt; (Dipartimento di Scienze Aziendali, DiPSA). &lt;span class=&quot;src&quot;&gt;slide 10-11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Struttura&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;2 anni, 120 ECTS, in inglese, con due curricula: &lt;i&gt;Accounting for International Business&lt;/i&gt; (AIB) e &lt;i&gt;Accounting and Governance for Sustainability&lt;/i&gt; (AG4S). &lt;a href=&quot;https://ls-ags.unibg.it/en/course/all-you-need-know-about-course&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Accesso&lt;/h4&gt;&lt;p&gt;Lo slide 12 la presenta come «corso di Laurea Magistrale ad accesso libero», cioè senza numero chiuso, erogato in lingua inglese.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The team&lt;/h3&gt;
  &lt;p&gt;Slide 3 presenta chi coordina il corso. La figura principale è la &lt;b&gt;Prof.ssa Silvana Signori&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Master Degree Coordinator&lt;/span&gt; (o &lt;span class=&quot;term&quot;&gt;President&lt;/span&gt;, o &lt;span class=&quot;term&quot;&gt;Program Director&lt;/span&gt;: le slide usano tutti e tre i termini). La affiancano i due &lt;span class=&quot;term&quot;&gt;Vice Coordinators&lt;/span&gt;, &lt;b&gt;Prof. Matteo Molinari&lt;/b&gt; e &lt;b&gt;Prof. Daniele Gervasio&lt;/b&gt;. A loro si aggiungono altre figure &lt;span class=&quot;src&quot;&gt;slide 34-36&lt;/span&gt;:&lt;/p&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Coordinatori dell&#x27;internship:&lt;/b&gt; Prof. Daniele Gervasio e dott. Roberto Aprile.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Coordinatrice dei programmi internazionali:&lt;/b&gt; Prof.ssa Viviana Meschitti.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Tutor del corso&lt;/b&gt; (consigli e supporto): Tahmineh Beheshti.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;note&quot;&gt;Gli indirizzi email sono sulle slide 34-36 e sul sito del corso.&lt;/p&gt;

  &lt;h3&gt;Dove trovare le informazioni&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 800 210&quot; role=&quot;img&quot; aria-label=&quot;Tre livelli di siti, dal più generale al più specifico&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;780&quot; height=&quot;170&quot; rx=&quot;16&quot; fill=&quot;var(--sal-bg)&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;48&quot; font-weight=&quot;600&quot; fill=&quot;var(--sal)&quot;&gt;Ateneo · unibg.it / en.unibg.it&lt;/text&gt;
    &lt;text x=&quot;30&quot; y=&quot;68&quot; font-size=&quot;12&quot;&gt;regole generali, Sportello internet, eLearning, servizi&lt;/text&gt;
    &lt;rect x=&quot;200&quot; y=&quot;85&quot; width=&quot;575&quot; height=&quot;95&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sal)&quot;/&gt;
    &lt;text x=&quot;220&quot; y=&quot;110&quot; font-weight=&quot;600&quot; fill=&quot;var(--sal)&quot;&gt;Dipartimento · dipsa.unibg.it/en&lt;/text&gt;
    &lt;text x=&quot;220&quot; y=&quot;128&quot; font-size=&quot;12&quot;&gt;agenda, summer school, opportunità internazionali&lt;/text&gt;
    &lt;rect x=&quot;470&quot; y=&quot;125&quot; width=&quot;295&quot; height=&quot;45&quot; rx=&quot;10&quot; fill=&quot;var(--sal)&quot;/&gt;
    &lt;text x=&quot;485&quot; y=&quot;146&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Corso · ls-ags.unibg.it/en&lt;/text&gt;
    &lt;text x=&quot;485&quot; y=&quot;162&quot; font-size=&quot;11&quot; style=&quot;fill:var(--paper)&quot;&gt;study plan, tesi, contatti&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Tre livelli, uno dentro l&#x27;altro: parti dal sito del corso e risali al dipartimento e all&#x27;ateneo quando serve &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;alert&quot;&gt;&lt;b&gt;Da fare subito:&lt;/b&gt; sulla piattaforma &lt;span class=&quot;term&quot;&gt;eLearning&lt;/span&gt; di unibg.it iscriviti allo spazio «LM AGS – Accounting, Governance and Sustainability (the full Master Degree program)». È «STRONGLY RECOMMENDED», perché lì passano tutti gli aggiornamenti sulle opportunità del corso &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;. Gli studenti internazionali trovano anche un video, &lt;a href=&quot;https://www.youtube.com/watch?v=YnayuFAeJ38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&lt;i&gt;Guide for foreign students&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra accounting e accountability?&lt;/summary&gt;&lt;div&gt;L&#x27;accounting è lo strumento di misura e comunicazione (contabilità, bilancio). L&#x27;accountability è il dovere di rendere conto a qualcuno di come hai usato le risorse. Si può fare accounting senza vera accountability, ad esempio con numeri corretti ma che nessuno è tenuto a spiegare a chi ne è interessato.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Dove ricevi gli aggiornamenti sulle opportunità del corso?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Solo via email personale&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;Nello spazio eLearning «LM AGS»&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;Sul sito del MUR&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Esatto: lo slide 12 raccomanda con forza di iscriversi a quello spazio eLearning.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Quale sito apri per primo se cerchi le istruzioni sul piano di studi?&lt;/summary&gt;&lt;div&gt;Il sito del corso, ls-ags.unibg.it/en (sezione &lt;i&gt;course/study-plan&lt;/i&gt;). Le date generali sono invece nell&#x27;agenda del Dipartimento.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part ocr&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Academic calendar · Timetable · slide 5-7&lt;/span&gt;
  &lt;h2&gt;Come è fatto l&#x27;anno accademico&lt;/h2&gt;
  &lt;p&gt;L&#x27;attività didattica è divisa in &lt;b&gt;due semestri&lt;/b&gt;. Ogni semestre di lezioni è seguito da una &lt;span class=&quot;term&quot;&gt;exam session&lt;/span&gt; (sessione d&#x27;esame, cioè un periodo in cui si fanno solo esami). In ogni sessione ci sono uno o più &lt;span class=&quot;term&quot;&gt;appelli&lt;/span&gt;, le singole date in cui puoi sostenere un esame.&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
  &lt;figure class=&quot;cal-svg&quot;&gt;
  &lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Ruota dell&#x27;anno accademico: clicca un settore&quot;&gt;
    &lt;g transform=&quot;translate(180,180)&quot; id=&quot;wheel&quot;&gt;&lt;/g&gt;
    &lt;text x=&quot;180&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;20&quot;&gt;a.a.&lt;/text&gt;
    &lt;text x=&quot;180&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;20&quot;&gt;2026-27&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Ruota ridisegnata dallo slide 5: in terracotta le lezioni, in blu-ardesia gli esami, in grigio la pausa estiva. Clicca un settore.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;div class=&quot;card&quot; id=&quot;wheelInfo&quot; style=&quot;min-height:9rem&quot;&gt;&lt;h4&gt;Clicca un settore della ruota&lt;/h4&gt;&lt;p class=&quot;note&quot;&gt;Qui compare cosa succede in quel periodo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin-top:1rem&quot;&gt;&lt;b&gt;Mid-term exam&lt;/b&gt; (prova intermedia, «PROVE INTERMEDIE» nel calendario): una verifica a metà corso. Durante quei giorni le lezioni si fermano. Di solito alleggerisce l&#x27;esame finale, ma le regole le decide ciascun docente.&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il primo semestre, giorno per giorno&lt;/h3&gt;
  &lt;p&gt;Trascina il cursore su una data per vedere se ci sono lezioni. Le date del primo semestre vengono dallo slide 7. Quelle successive le ho lette sul calendario dello slide 6 e sono &lt;b&gt;indicative&lt;/b&gt;: verificale sempre nella &lt;i&gt;Department agenda&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;
    &lt;label for=&quot;day&quot; class=&quot;note&quot;&gt;Data&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;day&quot; min=&quot;0&quot; max=&quot;380&quot; value=&quot;0&quot;&gt;
    &lt;div class=&quot;out&quot; id=&quot;dayOut&quot;&gt;—&lt;/div&gt;
    &lt;div id=&quot;dayState&quot; style=&quot;margin-top:.4rem&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 760 46&quot; style=&quot;width:100%;margin-top:.8rem&quot; id=&quot;strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin:.3rem 0 0&quot;&gt;Barra: un anno da metà settembre 2026 a fine settembre 2027. Terracotta = lezioni, ardesia = esami, ocra = sospensioni, grigio = altro.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details class=&quot;ocr&quot;&gt;&lt;summary&gt;Le sospensioni del I semestre, una per una&lt;/summary&gt;&lt;div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;21-23 ottobre 2026&lt;/b&gt;: lezioni sospese per le &lt;span class=&quot;term&quot;&gt;Final Dissertations&lt;/span&gt; (le sedute di laurea). Alcune lezioni potrebbero essere recuperate in altre date.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;16-17 novembre 2026&lt;/b&gt;: sospensione per le &lt;span class=&quot;term&quot;&gt;mid-term exams&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;7-8 dicembre 2026&lt;/b&gt;: festività (Sant&#x27;Ambrogio e Immacolata).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;20 dicembre 2026 – 6 gennaio 2027&lt;/b&gt;: vacanze di Natale.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Le note in fondo al calendario (slide 6) aggiungono che chi si laurea nella sessione di luglio 2027 deve chiudere gli esami entro il 26/6/2027.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Quando finiscono le lezioni del I semestre 2026-27?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;31 ottobre&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;19 dicembre&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;31 gennaio&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Sì: dal 14 settembre al 19 dicembre 2026 (slide 7).&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra «sessione» e «appello»?&lt;/summary&gt;&lt;div&gt;La sessione è il periodo dedicato agli esami (gennaio-febbraio, giugno-luglio, fine agosto-settembre). L&#x27;appello è la singola data d&#x27;esame dentro una sessione: per ogni insegnamento ce ne sono più di uno.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quante sessioni d&#x27;esame ci sono in un anno, secondo lo slide 5?&lt;/summary&gt;&lt;div&gt;Tre: gennaio-febbraio (dopo il I semestre), giugno-luglio (dopo il II semestre) e fine agosto-fine settembre (sessione di recupero).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part sal&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Study plans · Italian course · slide 9, 14&lt;/span&gt;
  &lt;h2&gt;Crediti ECTS e piano di studi&lt;/h2&gt;
  &lt;p&gt;Le slide parlano di «3 ECTS credits», «6 CFU» e di uno &lt;span class=&quot;term&quot;&gt;study plan&lt;/span&gt; da presentare, ma non spiegano cosa siano. Partiamo dalle basi.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;ECTS&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;European Credit Transfer and Accumulation System&lt;/span&gt;): l&#x27;unità europea che misura il &lt;span class=&quot;term&quot;&gt;workload&lt;/span&gt;, cioè il lavoro dello studente (lezioni, studio individuale, progetti, esami). In Italia lo stesso credito si chiama &lt;b&gt;CFU&lt;/b&gt;, credito formativo universitario: &lt;i&gt;1 CFU = 1 ECTS&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;60 ECTS = un anno a tempo pieno &amp;nbsp;·&amp;nbsp; 1 ECTS ≈ 25-30 ore di lavoro &lt;span class=&quot;ext&quot; style=&quot;vertical-align:middle&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il rapporto viene dall&#x27;&lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow%20up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide 2015&lt;/a&gt;: un anno vale 1.500-1.800 ore. In Italia un CFU vale per legge 25 ore.&lt;/p&gt;

  &lt;div class=&quot;slider&quot;&gt;
    &lt;label for=&quot;ects&quot; class=&quot;note&quot;&gt;Crediti di un&#x27;attività&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;ects&quot; min=&quot;1&quot; max=&quot;120&quot; value=&quot;6&quot;&gt;
    &lt;div class=&quot;out&quot; id=&quot;ectsOut&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 40&quot; style=&quot;width:100%;margin-top:.5rem&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;12&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect id=&quot;ectsBar&quot; x=&quot;0&quot; y=&quot;12&quot; width=&quot;30&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;line x1=&quot;300&quot; y1=&quot;6&quot; x2=&quot;300&quot; y2=&quot;34&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;304&quot; y=&quot;38&quot; font-size=&quot;10&quot; fill=&quot;var(--ink2)&quot;&gt;60 = 1 anno&lt;/text&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Prova: 3 (Italiano al I anno), 6 (un CREO lab), 120 (tutta la magistrale).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lo study plan: cosa, quando, come&lt;/h3&gt;
  &lt;div class=&quot;alert&quot;&gt;&lt;b&gt;Finestra:&lt;/b&gt; dal &lt;b&gt;28 ottobre&lt;/b&gt; al &lt;b&gt;20 novembre 2026&lt;/b&gt; devi compilare e presentare il tuo study plan &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;. Istruzioni: &lt;a href=&quot;https://ls-ags.unibg.it/en/course/study-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/course/study-plan&lt;/a&gt;.&lt;/div&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · Capisci che cosa scegli&lt;/h4&gt;&lt;p&gt;Lo study plan è l&#x27;elenco ufficiale degli insegnamenti che sosterrai nei due anni. Lo slide 9 indica tre livelli di scelta:&lt;/p&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Curriculum&lt;/span&gt;: il percorso (dal sito: AIB oppure AG4S).&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Alternative choices&lt;/span&gt;: insegnamenti da scegliere fra due o più opzioni previste dal regolamento.&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Free choices&lt;/span&gt;: crediti a scelta libera, solo al II anno.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · Leggi le istruzioni&lt;/h4&gt;&lt;p&gt;Apri la pagina &lt;i&gt;study-plan&lt;/i&gt; del sito del corso e il regolamento della tua coorte (l&#x27;anno in cui ti sei immatricolato), così sai quali combinazioni sono permesse.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · Entra nello Sportello&lt;/h4&gt;&lt;p&gt;Percorso indicato sullo slide 9: &lt;b&gt;sito Unibg → Dashboard (Sportello) → Study plan (piano di studio)&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · Compila e presenta entro il 20 novembre&lt;/h4&gt;&lt;p&gt;«Fulfil and present»: non basta compilarlo, va anche confermato e presentato. Se hai dubbi, scrivi ai docenti referenti dello study plan (vedi la scala dei contatti nella sezione 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;b&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;b pri&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Italian course for non-Italian speakers&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Corso di italiano: 3 ECTS al primo anno, esame completo da 6 ECTS al secondo&quot;&gt;

    &lt;text x=&quot;337&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;completi corso + esame&lt;/text&gt;

  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Un laboratorio da 6 CFU richiede all&#x27;incirca…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;6 ore&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;60 ore&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;150-180 ore&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Giusto: 6 × 25-30 ore. Le ore includono lo studio individuale, non solo l&#x27;aula.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Quali scelte compaiono nello study plan e quale vale solo per il II anno?&lt;/summary&gt;&lt;div&gt;Curriculum, alternative choices e free choices. Le free choices (crediti a scelta libera) riguardano il II anno.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se oggi è il 26 ottobre 2026, fra quanti giorni si apre la finestra?&lt;/summary&gt;&lt;div&gt;Fra 2 giorni: apre il 28 ottobre e chiude il 20 novembre 2026.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part ard&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Partnerships · Erasmus / Extra UE · slide 13, 15-16, 20, 24&lt;/span&gt;
  &lt;h2&gt;Opportunità internazionali&lt;/h2&gt;
  &lt;p&gt;Lo slide 13 elenca le &lt;span class=&quot;term&quot;&gt;opportunities&lt;/span&gt; del corso. Questa sezione raccoglie quelle che portano all&#x27;estero o in reti europee. Quelle legate alle aziende e ai laboratori sono nelle sezioni 5 e 6.&lt;/p&gt;

  &lt;h3&gt;Erasmus &amp; Extra UE exchange&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Erasmus+&lt;/b&gt;: il programma dell&#x27;Unione europea per la mobilità di studio. Passi un periodo in un&#x27;università partner e gli esami superati lì vengono riconosciuti in ECTS. Con &lt;span class=&quot;term&quot;&gt;Extra UE&lt;/span&gt; si indicano gli accordi di scambio con atenei fuori dall&#x27;Europa.&lt;/div&gt;

  &lt;h3&gt;Double Degree Agreement · University of Dundee&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Double degree&lt;/b&gt; (doppio titolo): un accordo fra due atenei. Frequenti una parte del percorso in ciascuno e alla fine ricevi &lt;b&gt;due diplomi&lt;/b&gt;, uno per università, non un unico titolo congiunto.&lt;/div&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · I anno a Bergamo (2026-27)&lt;/h4&gt;&lt;p&gt;Segui il primo anno di AGS. Il bando premia i &lt;i&gt;best students&lt;/i&gt;, quindi conta il rendimento negli esami del I anno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · Il bando, intorno a maggio 2027&lt;/h4&gt;&lt;p&gt;«The call will be available around May 2027!» &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;. Tieni d&#x27;occhio lo spazio eLearning e il sito del corso.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · II anno in Scozia&lt;/h4&gt;&lt;p&gt;Frequenti a Dundee il &lt;i&gt;Master Degree in Accounting &amp;amp; Finance&lt;/i&gt;.&lt;/p&gt;&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Secondo il &lt;a href=&quot;https://www.dundee.ac.uk/postgraduate/accounting-finance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito di Dundee&lt;/a&gt;, è un MSc di 12 mesi su international financial reporting, corporate finance, corporate governance e risk management, con esenzioni da alcuni esami ACCA (l&#x27;associazione professionale internazionale degli accountant).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · Rientro: double diploma&lt;/h4&gt;&lt;p&gt;Al ritorno ottieni il &lt;b&gt;DOUBLE DIPLOMA&lt;/b&gt;: la laurea magistrale di Bergamo e il titolo di Dundee.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;b&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;b pri&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;BAUHAUS4EU · European University Alliance&lt;/h3&gt;
  &lt;p&gt;Una &lt;span class=&quot;term&quot;&gt;European University Alliance&lt;/span&gt; è una rete di atenei europei che costruiscono corsi e progetti comuni. Bergamo fa parte di &lt;b&gt;BAUHAUS4EU&lt;/b&gt; (&lt;a href=&quot;https://www.bauhaus4.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bauhaus4.eu&lt;/a&gt;, citato nello slide 20). Le opportunità sono di tre tipi:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;EBC&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;SLC&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;RLL&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;European BAUHAUS Courses&lt;/b&gt;, in tre formati:&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;BIP&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Blended Intensive Programme&lt;/span&gt;: una parte online e una settimana circa in presenza in un altro paese. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Le regole Erasmus+ prevedono 5-30 giorni di mobilità fisica, almeno 3 ECTS e almeno 3 atenei di 3 paesi diversi (&lt;a href=&quot;https://www.unimi.it/en/international/study-abroad/blended-intensive-programmes-bip&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;es. pagina BIP dell&#x27;Univ. di Milano&lt;/a&gt;).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;COIL&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Collaborative Online International Learning&lt;/span&gt;: classi di paesi diversi lavorano insieme online su un progetto comune. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il modello nasce al SUNY COIL Center (USA) e i moduli durano di solito 5-15 settimane (&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University at Albany&lt;/a&gt;).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Hackathon&lt;/b&gt;: maratona di lavoro di gruppo di uno o pochi giorni, in cui si risolve una sfida concreta.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Student-Led Interdisciplinary Courses&lt;/b&gt;: corsi progettati e guidati dagli studenti stessi, che mettono insieme più discipline.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Regional Living Labs&lt;/b&gt;: laboratori sul territorio in cui università, enti e cittadini lavorano su un problema reale. Il bando aperto al momento del kick-off era «&lt;i&gt;The City, the University, and the Common Good: Regenerating the Montelungo-Colleoni Complex&lt;/i&gt;», sulla rigenerazione di un ex complesso militare di Bergamo &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;«Further info will follow during the year» &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Summer and winter schools&lt;/h3&gt;
  &lt;p&gt;Sono corsi brevi e intensivi, spesso internazionali, che si tengono durante le pause. I bandi escono sui siti del Dipartimento e dell&#x27;Ateneo (&lt;a href=&quot;https://dipsa.unibg.it/en/international/international-opportunities/winter-summer-and-international-schools&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina DiPSA&lt;/a&gt;), e altre opportunità vengono comunicate durante l&#x27;anno &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Con il double degree con Dundee alla fine ottieni…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;un solo titolo congiunto&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;due diplomi&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;un certificato di frequenza&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Esatto: «double diploma», un titolo per ciascun ateneo.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra BIP e COIL?&lt;/summary&gt;&lt;div&gt;Il BIP combina una parte online con una breve mobilità fisica all&#x27;estero. Il COIL si svolge interamente online: classi di paesi diversi collaborano a distanza.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quando esce il bando per Dundee e a chi si rivolge?&lt;/summary&gt;&lt;div&gt;Intorno a maggio 2027, per i migliori studenti del I anno, che passeranno il II anno a Dundee.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part mat&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;National opportunities · Placement and internship · slide 17-18&lt;/span&gt;
  &lt;h2&gt;Aziende, placement e tirocinio&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Placement&lt;/b&gt;: i servizi che aiutano a entrare nel mondo del lavoro (offerte, colloqui, career day). &lt;b&gt;Internship&lt;/b&gt; o &lt;b&gt;stage&lt;/b&gt;: un periodo di formazione in un&#x27;organizzazione, riconosciuto in crediti.&lt;/div&gt;

  &lt;h3&gt;Strong engagement with companies&lt;/h3&gt;
  &lt;p&gt;Aziende locali, nazionali e internazionali intervengono nei corsi per raccontare la loro esperienza e offrono stage o internship &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;. Clicca un gruppo per vedere chi ne fa parte e che cosa può insegnarti.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Revisione e consulenza&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Industria&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sanità e PA&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Professioni&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Deloitte, PwC, KPMG, EY&lt;/b&gt;: le «Big Four», le quattro maggiori reti mondiali di revisione contabile (&lt;span class=&quot;term&quot;&gt;audit&lt;/span&gt;) e consulenza. Qui si vede l&#x27;accounting dal lato del controllo: verificano che i bilanci delle imprese siano attendibili.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Brembo, Sanpellegrino (gruppo Nestlé Waters), Magris, Milan Bergamo Airport (BGY)&lt;/b&gt;: imprese industriali e di servizi del territorio. Qui l&#x27;accounting serve a &lt;span class=&quot;term&quot;&gt;controlling&lt;/span&gt; (controllo di gestione), reporting e governance di gruppo, e sempre più spesso alla rendicontazione di sostenibilità.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;ASST Papa Giovanni XXIII (Ospedale di Bergamo), Regione Lombardia&lt;/b&gt;: il settore pubblico, dove l&#x27;&lt;i&gt;accountability&lt;/i&gt; verso i cittadini è centrale e l&#x27;accounting misura costi ed efficienza dei servizi.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Ordine dei Dottori Commercialisti e degli Esperti Contabili di Bergamo&lt;/b&gt; (ODCEC): l&#x27;ente che rappresenta e regola la professione a livello provinciale. Il suo ruolo nel tirocinio è spiegato qui sotto.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Placement and internship: la convenzione con l&#x27;Ordine&lt;/h3&gt;
  &lt;p&gt;Lo slide 18 dice che il programma è &lt;b&gt;coerente con l&#x27;accordo&lt;/b&gt; fra Università di Bergamo e ODCEC di Bergamo, previsto dalla Convenzione fra Ministero (MIUR, oggi MUR) e Consiglio nazionale dei Dottori commercialisti (CNDCEC). Detto così è poco chiaro, quindi ecco lo schema.&lt;/p&gt;
  &lt;figure&gt;

    &lt;rect x=&quot;80&quot; y=&quot;52&quot; width=&quot;230&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mat)&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Ministero (MIUR → MUR)&lt;/text&gt;

    &lt;rect x=&quot;490&quot; y=&quot;154&quot; width=&quot;230&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mat)&quot;/&gt;&lt;text x=&quot;605&quot; y=&quot;174&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;ODCEC di Bergamo&lt;/text&gt;

  &lt;details&gt;&lt;summary&gt;Che cosa significa in pratica? (fonte esterna)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Per diventare &lt;b&gt;dottore commercialista&lt;/b&gt; servono la laurea magistrale, un &lt;span class=&quot;term&quot;&gt;tirocinio&lt;/span&gt; (praticantato) presso un professionista e l&#x27;&lt;b&gt;esame di Stato&lt;/b&gt;. La norma (art. 6, c. 4, DPR 137/2012) permette di svolgere i &lt;b&gt;primi 6 mesi&lt;/b&gt; di tirocinio durante l&#x27;ultimo anno del corso di laurea, se esiste una convenzione quadro fra Ministero e Ordine. La convenzione del 2014 (art. 43 D.Lgs. 139/2005) prevede inoltre, per i corsi conformi, l&#x27;&lt;b&gt;esonero dalla prima prova scritta&lt;/b&gt; dell&#x27;esame di Stato.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Fonti: &lt;a href=&quot;https://www.unitn.it/sites/default/files/2025-01/Convenzione%20ODCEC%20TN%20e%20UniTN_%2005.03.2020.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;esempio di convenzione Università-ODCEC (Trento)&lt;/a&gt;; &lt;a href=&quot;https://www.fiscal-focus.it/quotidiano/altre-tematiche/infoprofessioni/tirocinio-professionale-indicazioni-del-miur-al-cndcec,3,56980&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fiscal Focus, indicazioni MIUR al CNDCEC&lt;/a&gt;. Le condizioni precise per AGS (insegnamenti richiesti, ore, curriculum) vanno verificate con i coordinatori dell&#x27;internship e sul sito del corso.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Che cos&#x27;è l&#x27;ODCEC di Bergamo?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Un&#x27;agenzia per il lavoro&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;L&#x27;Ordine provinciale dei commercialisti ed esperti contabili&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;Un ufficio del Ministero&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Corretto: è l&#x27;ordine professionale locale che firma l&#x27;accordo con l&#x27;università.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Perché conta che il corso sia «coerente» con la convenzione MUR-CNDCEC?&lt;/summary&gt;&lt;div&gt;Perché permette di anticipare una parte del tirocinio professionale durante gli studi e, nelle condizioni previste, di ottenere agevolazioni all&#x27;esame di Stato. La strada verso la professione si accorcia.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché le Big Four sono interessanti per un laureato in accounting?&lt;/summary&gt;&lt;div&gt;Perché sono i principali datori di lavoro per audit e consulenza: lì l&#x27;accounting si applica nel verificare e garantire che l&#x27;informazione di bilancio sia attendibile.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part ocr&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Creo-labs · Open Badge · Seminars · slide 19, 21-23, 25&lt;/span&gt;
  &lt;h2&gt;Laboratori, badge ed eventi&lt;/h2&gt;

  &lt;h3&gt;CREO LABS: Entrepreneurial University&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;CREO&lt;/b&gt; sta per &lt;span class=&quot;term&quot;&gt;Competencies and Resources for Entrepreneurial Orientation&lt;/span&gt;, cioè competenze e risorse per un orientamento imprenditoriale. È il progetto con cui l&#x27;ateneo vuole essere una &lt;span class=&quot;term&quot;&gt;Entrepreneurial University&lt;/span&gt;: un&#x27;università che insegna a prendere iniziative, innovare e lavorare in squadra su problemi veri.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;6 CFU&lt;/b&gt;, nel &lt;b&gt;II semestre&lt;/b&gt;&lt;/li&gt;&lt;li&gt;4 laboratori, ciascuno in una lingua&lt;/li&gt;&lt;li&gt;Per chi frequenta una laurea magistrale (o l&#x27;ultimo biennio di un ciclo unico)&lt;/li&gt;&lt;li&gt;Il poster indica le iscrizioni &lt;b&gt;entro il 10 novembre&lt;/b&gt;; il bando 2026-27 «will be open very soon»&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il progetto è coordinato dal centro di ricerca CYFE (Center for Young and Family Enterprise) e si lavora in team di circa 5 persone (&lt;a href=&quot;https://cyfe.unibg.it/it/formazione/creo-lab&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cyfe.unibg.it&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 300&quot; role=&quot;img&quot; aria-label=&quot;I quattro laboratori CREO con la lingua&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--sal-bg)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--sal)&quot;&gt;Salute&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ITA&lt;/text&gt;
      &lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--ard-bg)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ard)&quot;&gt;Sustainability&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ENG&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;150&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;Tecnologie digitali&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;216&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;e IA&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ITA&lt;/text&gt;
      &lt;rect x=&quot;165&quot; y=&quot;150&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--mat-bg)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--mat)&quot;&gt;Tourism and&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;216&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--mat)&quot;&gt;creative industries&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ENG&lt;/text&gt;
