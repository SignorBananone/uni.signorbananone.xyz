&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sal&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Introduction · slides 1-4, 8, 10-12&lt;/span&gt;
  &lt;h2&gt;The programme, the people, where to find information&lt;/h2&gt;
  &lt;p&gt;The kick-off is an orientation meeting, not a content lecture: its purpose is to get you off to a good start. First of all, it is worth understanding the three words in the title, because they recur in every exam of the programme.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Accounting&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Accountability&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Governance&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sustainability&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt; (in Italian &lt;i&gt;ragioneria, contabilità&lt;/i&gt;): the system that measures, records and communicates the economic events of an organisation, for example through the financial statements. It answers the question “what is this company worth and how is it performing?”.&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Example: the financial statements of a Bergamo company showing its revenues, costs and liabilities for the year.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt; (the responsibility to give account): the obligation to explain and justify to someone (shareholders, lenders, citizens, communities) how resources have been used and what results have been achieved. Accounting is one of the tools for doing so, but not the only one.&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Example: a public hospital that publishes the outcomes and costs of its services to give account to the Region and to citizens.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Governance&lt;/b&gt; (corporate governance): the rules, bodies and mechanisms through which an organisation is directed and controlled: the board of directors, internal controls, relations with shareholders and with other &lt;span class=&quot;term&quot;&gt;stakeholders&lt;/span&gt; (parties with an interest in the organisation).&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;It is the “G” in the acronym &lt;span class=&quot;term&quot;&gt;ESG&lt;/span&gt; (Environmental, Social, Governance), which appears in one of the books presented at the TRANSET events (section 6).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sustainability&lt;/b&gt;: the ability to create value over time while taking into account environmental and social impacts, not only economic ones. In the programme&#x27;s name it sits alongside accounting and governance: you study how to measure, govern and report on these impacts as well.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The programme at a glance&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What it is&lt;/h4&gt;&lt;p&gt;A &lt;span class=&quot;term&quot;&gt;Master Degree&lt;/span&gt; (laurea magistrale) in Accounting, Governance and Sustainability offered by the &lt;span class=&quot;term&quot;&gt;Department of Management&lt;/span&gt; (Dipartimento di Scienze Aziendali, DiPSA). &lt;span class=&quot;src&quot;&gt;slides 10-11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Structure&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;2 years, 120 ECTS, taught in English, with two curricula: &lt;i&gt;Accounting for International Business&lt;/i&gt; (AIB) and &lt;i&gt;Accounting and Governance for Sustainability&lt;/i&gt; (AG4S). &lt;a href=&quot;https://ls-ags.unibg.it/en/course/all-you-need-know-about-course&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Admission&lt;/h4&gt;&lt;p&gt;Slide 12 presents it as an “open-access Master&#x27;s degree programme”, i.e. with no cap on enrolment, taught in English.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The team&lt;/h3&gt;
  &lt;p&gt;Slide 3 introduces the people who coordinate the programme. The key figure is &lt;b&gt;Prof. Silvana Signori&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Master Degree Coordinator&lt;/span&gt; (or &lt;span class=&quot;term&quot;&gt;President&lt;/span&gt;, or &lt;span class=&quot;term&quot;&gt;Program Director&lt;/span&gt;: the slides use all three terms). She is supported by the two &lt;span class=&quot;term&quot;&gt;Vice Coordinators&lt;/span&gt;, &lt;b&gt;Prof. Matteo Molinari&lt;/b&gt; and &lt;b&gt;Prof. Daniele Gervasio&lt;/b&gt;. Other roles complete the team &lt;span class=&quot;src&quot;&gt;slides 34-36&lt;/span&gt;:&lt;/p&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Internship coordinators:&lt;/b&gt; Prof. Daniele Gervasio and Dr Roberto Aprile.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;International programmes coordinator:&lt;/b&gt; Prof. Viviana Meschitti.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Programme tutor&lt;/b&gt; (advice and support): Tahmineh Beheshti.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;note&quot;&gt;Email addresses are on slides 34-36 and on the programme website.&lt;/p&gt;

  &lt;h3&gt;Where to find information&lt;/h3&gt;
  &lt;figure&gt;

    &lt;text x=&quot;220&quot; y=&quot;110&quot; font-weight=&quot;600&quot; fill=&quot;var(--sal)&quot;&gt;Department · dipsa.unibg.it/en&lt;/text&gt;
    &lt;text x=&quot;220&quot; y=&quot;128&quot; font-size=&quot;12&quot;&gt;agenda, summer schools, international opportunities&lt;/text&gt;
    &lt;rect x=&quot;470&quot; y=&quot;125&quot; width=&quot;295&quot; height=&quot;45&quot; rx=&quot;10&quot; fill=&quot;var(--sal)&quot;/&gt;

    &lt;text x=&quot;485&quot; y=&quot;162&quot; font-size=&quot;11&quot; style=&quot;fill:var(--paper)&quot;&gt;study plan, thesis, contacts&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Three nested levels: start from the programme website and move up to the Department and the University when needed &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;.&lt;/figcaption&gt;

  &lt;div class=&quot;alert&quot;&gt;&lt;b&gt;Do this now:&lt;/b&gt; on the unibg.it &lt;span class=&quot;term&quot;&gt;eLearning&lt;/span&gt; platform, enrol in the space “LM AGS – Accounting, Governance and Sustainability (the full Master Degree program)”. It is “STRONGLY RECOMMENDED”, because all updates on the programme&#x27;s opportunities are posted there &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;. International students can also watch a video, &lt;a href=&quot;https://www.youtube.com/watch?v=YnayuFAeJ38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&lt;i&gt;Guide for foreign students&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between accounting and accountability?&lt;/summary&gt;&lt;div&gt;Accounting is the tool for measurement and communication (bookkeeping, financial statements). Accountability is the duty to give account to someone of how you have used resources. You can do accounting without genuine accountability, for example with correct figures that nobody is required to explain to those with an interest in them.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;Where do you receive updates on the programme&#x27;s opportunities?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Only by personal email&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;In the “LM AGS” eLearning space&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;On the MUR website&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Correct: slide 12 strongly recommends enrolling in that eLearning space.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Which website do you open first if you are looking for the study plan instructions?&lt;/summary&gt;&lt;div&gt;The programme website, ls-ags.unibg.it/en (section &lt;i&gt;course/study-plan&lt;/i&gt;). The general dates, by contrast, are in the Department agenda.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part ocr&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Academic calendar · Timetable · slides 5-7&lt;/span&gt;
  &lt;h2&gt;How the academic year is organised&lt;/h2&gt;
  &lt;p&gt;Teaching is divided into &lt;b&gt;two semesters&lt;/b&gt;. Each teaching semester is followed by an &lt;span class=&quot;term&quot;&gt;exam session&lt;/span&gt;, a period devoted exclusively to examinations. Each session contains one or more &lt;span class=&quot;term&quot;&gt;exam dates&lt;/span&gt; (&lt;i&gt;appelli&lt;/i&gt;), the individual dates on which you can sit an exam.&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
  &lt;figure class=&quot;cal-svg&quot;&gt;
  &lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Academic year wheel: click a segment&quot;&gt;
    &lt;g transform=&quot;translate(180,180)&quot; id=&quot;wheel&quot;&gt;&lt;/g&gt;
    &lt;text x=&quot;180&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;20&quot;&gt;A.Y.&lt;/text&gt;
    &lt;text x=&quot;180&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;20&quot;&gt;2026-27&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Wheel redrawn from slide 5: terracotta for teaching, slate blue for exams, grey for the summer break. Click a segment.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;div class=&quot;card&quot; id=&quot;wheelInfo&quot; style=&quot;min-height:9rem&quot;&gt;&lt;h4&gt;Click a segment of the wheel&lt;/h4&gt;&lt;p class=&quot;note&quot;&gt;What happens in that period will appear here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin-top:1rem&quot;&gt;&lt;b&gt;Mid-term exam&lt;/b&gt; (intermediate test, “PROVE INTERMEDIE” in the calendar): an assessment halfway through the course. Teaching stops on those days. It usually lightens the final exam, but the rules are set by each lecturer.&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The first semester, day by day&lt;/h3&gt;
  &lt;p&gt;Drag the slider to a date to see whether there are classes. The first-semester dates come from slide 7. The later ones were read from the calendar on slide 6 and are &lt;b&gt;indicative&lt;/b&gt;: always check them in the &lt;i&gt;Department agenda&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;
    &lt;label for=&quot;day&quot; class=&quot;note&quot;&gt;Date&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;day&quot; min=&quot;0&quot; max=&quot;380&quot; value=&quot;0&quot;&gt;
    &lt;div class=&quot;out&quot; id=&quot;dayOut&quot;&gt;—&lt;/div&gt;
    &lt;div id=&quot;dayState&quot; style=&quot;margin-top:.4rem&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 760 46&quot; style=&quot;width:100%;margin-top:.8rem&quot; id=&quot;strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin:.3rem 0 0&quot;&gt;Bar: one year from mid-September 2026 to the end of September 2027. Terracotta = teaching, slate = exams, ochre = suspensions, grey = other.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details class=&quot;ocr&quot;&gt;&lt;summary&gt;First-semester suspensions, one by one&lt;/summary&gt;&lt;div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;21-23 October 2026&lt;/b&gt;: classes suspended for the &lt;span class=&quot;term&quot;&gt;Final Dissertations&lt;/span&gt; (graduation sessions). Some classes may be rescheduled to other dates.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;16-17 November 2026&lt;/b&gt;: suspension for the &lt;span class=&quot;term&quot;&gt;mid-term exams&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;7-8 December 2026&lt;/b&gt;: public holidays (Saint Ambrose and the Immaculate Conception).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;20 December 2026 – 6 January 2027&lt;/b&gt;: Christmas break.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;The notes at the bottom of the calendar (slide 6) add that students graduating in the July 2027 session must complete their exams by 26/6/2027.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;When does first-semester teaching end in 2026-27?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;31 October&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;19 December&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;31 January&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Yes: from 14 September to 19 December 2026 (slide 7).&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between a “session” and an “exam date” (appello)?&lt;/summary&gt;&lt;div&gt;The session is the period devoted to exams (January-February, June-July, late August-September). The exam date is a single examination sitting within a session: each course has more than one.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How many exam sessions are there in a year, according to slide 5?&lt;/summary&gt;&lt;div&gt;Three: January-February (after the first semester), June-July (after the second semester) and late August to late September (resit session).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part sal&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Study plans · Italian course · slides 9, 14&lt;/span&gt;
  &lt;h2&gt;ECTS credits and study plan&lt;/h2&gt;
  &lt;p&gt;The slides mention “3 ECTS credits”, “6 CFU” and a &lt;span class=&quot;term&quot;&gt;study plan&lt;/span&gt; to be submitted, but do not explain what they are. Let us start from the basics.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;ECTS&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;European Credit Transfer and Accumulation System&lt;/span&gt;): the European unit that measures student &lt;span class=&quot;term&quot;&gt;workload&lt;/span&gt;, i.e. the work required of the student (lectures, independent study, projects, exams). In Italy the same credit is called &lt;b&gt;CFU&lt;/b&gt;, &lt;i&gt;credito formativo universitario&lt;/i&gt;: &lt;i&gt;1 CFU = 1 ECTS&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;60 ECTS = one full-time year &amp;nbsp;·&amp;nbsp; 1 ECTS ≈ 25-30 hours of work &lt;span class=&quot;ext&quot; style=&quot;vertical-align:middle&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The ratio comes from the &lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow%20up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide 2015&lt;/a&gt;: one year corresponds to 1,500-1,800 hours. In Italy one CFU is set by law at 25 hours.&lt;/p&gt;

  &lt;div class=&quot;slider&quot;&gt;
    &lt;label for=&quot;ects&quot; class=&quot;note&quot;&gt;Credits for an activity&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;ects&quot; min=&quot;1&quot; max=&quot;120&quot; value=&quot;6&quot;&gt;
    &lt;div class=&quot;out&quot; id=&quot;ectsOut&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 40&quot; style=&quot;width:100%;margin-top:.5rem&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;12&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect id=&quot;ectsBar&quot; x=&quot;0&quot; y=&quot;12&quot; width=&quot;30&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;line x1=&quot;300&quot; y1=&quot;6&quot; x2=&quot;300&quot; y2=&quot;34&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;304&quot; y=&quot;38&quot; font-size=&quot;10&quot; fill=&quot;var(--ink2)&quot;&gt;60 = 1 year&lt;/text&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Try: 3 (Italian in Year 1), 6 (a CREO lab), 120 (the whole Master&#x27;s degree).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The study plan: what, when, how&lt;/h3&gt;
  &lt;div class=&quot;alert&quot;&gt;&lt;b&gt;Window:&lt;/b&gt; from &lt;b&gt;28 October&lt;/b&gt; to &lt;b&gt;20 November 2026&lt;/b&gt; you must fill in and submit your study plan &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;. Instructions: &lt;a href=&quot;https://ls-ags.unibg.it/en/course/study-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/course/study-plan&lt;/a&gt;.&lt;/div&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · Understand what you are choosing&lt;/h4&gt;&lt;p&gt;The study plan is the official list of the courses you will take over the two years. Slide 9 identifies three levels of choice:&lt;/p&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Curriculum&lt;/span&gt;: the track (according to the website: AIB or AG4S).&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Alternative choices&lt;/span&gt;: courses to be selected from two or more options set out in the programme regulations.&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;term&quot;&gt;Free choices&lt;/span&gt;: elective credits, in Year 2 only.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · Read the instructions&lt;/h4&gt;&lt;p&gt;Open the &lt;i&gt;study-plan&lt;/i&gt; page of the programme website and the regulations for your cohort (the year in which you enrolled), so that you know which combinations are allowed.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · Log in to the Sportello&lt;/h4&gt;&lt;p&gt;Path given on slide 9: &lt;b&gt;Unibg website → Dashboard (Sportello) → Study plan (piano di studio)&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · Fill in and submit by 20 November&lt;/h4&gt;&lt;p&gt;“Fulfil and present”: filling it in is not enough, it must also be confirmed and submitted. If in doubt, write to the lecturers responsible for the study plan (see the contact ladder in section 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;b&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;b pri&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Italian course for non-Italian speakers&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Italian course: 3 ECTS in Year 1, full 6 ECTS exam in Year 2&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--sal)&quot;&gt;Year 1&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;attend · 3 ECTS&lt;/text&gt;
    &lt;path d=&quot;M225 65 H 450&quot; stroke=&quot;var(--sal)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
    &lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;text x=&quot;337&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;complete course + exam&lt;/text&gt;
    &lt;rect x=&quot;460&quot; y=&quot;30&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Year 2&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;full exam recognised · 6 ECTS&lt;/text&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;A 6-CFU lab requires roughly…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;6 hours&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;60 hours&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;150-180 hours&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Right: 6 × 25-30 hours. The hours include independent study, not just classroom time.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Which choices appear in the study plan, and which applies only to Year 2?&lt;/summary&gt;&lt;div&gt;Curriculum, alternative choices and free choices. Free choices (elective credits) concern Year 2.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If today is 26 October 2026, in how many days does the window open?&lt;/summary&gt;&lt;div&gt;In 2 days: it opens on 28 October and closes on 20 November 2026.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part ard&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Partnerships · Erasmus / Extra UE · slides 13, 15-16, 20, 24&lt;/span&gt;
  &lt;h2&gt;International opportunities&lt;/h2&gt;
  &lt;p&gt;Slide 13 lists the programme&#x27;s &lt;span class=&quot;term&quot;&gt;opportunities&lt;/span&gt;. This section gathers those that take you abroad or into European networks. Those related to companies and labs are covered in sections 5 and 6.&lt;/p&gt;

  &lt;h3&gt;Erasmus &amp; Extra UE exchange&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Erasmus+&lt;/b&gt;: the European Union programme for study mobility. You spend a period at a partner university and the exams you pass there are recognised in ECTS. &lt;span class=&quot;term&quot;&gt;Extra UE&lt;/span&gt; refers to exchange agreements with universities outside Europe.&lt;/div&gt;

  &lt;h3&gt;Double Degree Agreement · University of Dundee&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Double degree&lt;/b&gt;: an agreement between two universities. You complete part of the programme at each and at the end you receive &lt;b&gt;two diplomas&lt;/b&gt;, one from each university, rather than a single joint degree.&lt;/div&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · Year 1 in Bergamo (2026-27)&lt;/h4&gt;&lt;p&gt;You take the first year of AGS. The call rewards the &lt;i&gt;best students&lt;/i&gt;, so your performance in Year 1 exams matters.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · The call, around May 2027&lt;/h4&gt;&lt;p&gt;“The call will be available around May 2027!” &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;. Keep an eye on the eLearning space and the programme website.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · Year 2 in Scotland&lt;/h4&gt;&lt;p&gt;In Dundee you attend the &lt;i&gt;Master Degree in Accounting &amp;amp; Finance&lt;/i&gt;.&lt;/p&gt;&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;According to the &lt;a href=&quot;https://www.dundee.ac.uk/postgraduate/accounting-finance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dundee website&lt;/a&gt;, it is a 12-month MSc covering international financial reporting, corporate finance, corporate governance and risk management, with exemptions from some ACCA exams (ACCA being the international professional body for accountants).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · Return: double diploma&lt;/h4&gt;&lt;p&gt;On your return you obtain the &lt;b&gt;DOUBLE DIPLOMA&lt;/b&gt;: the Bergamo Master&#x27;s degree and the Dundee degree.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;b&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;b pri&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;BAUHAUS4EU · European University Alliance&lt;/h3&gt;
  &lt;p&gt;A &lt;span class=&quot;term&quot;&gt;European University Alliance&lt;/span&gt; is a network of European universities that develop joint courses and projects. Bergamo is a member of &lt;b&gt;BAUHAUS4EU&lt;/b&gt; (&lt;a href=&quot;https://www.bauhaus4.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bauhaus4.eu&lt;/a&gt;, cited on slide 20). The opportunities are of three kinds:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;EBC&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;SLC&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;RLL&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;European BAUHAUS Courses&lt;/b&gt;, in three formats:&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;BIP&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Blended Intensive Programme&lt;/span&gt;: an online component plus roughly one week of in-person activity in another country. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Erasmus+ rules require 5-30 days of physical mobility, at least 3 ECTS and at least 3 universities from 3 different countries (&lt;a href=&quot;https://www.unimi.it/en/international/study-abroad/blended-intensive-programmes-bip&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;e.g. the University of Milan BIP page&lt;/a&gt;).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;COIL&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;Collaborative Online International Learning&lt;/span&gt;: classes from different countries work together online on a joint project. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The model originated at the SUNY COIL Center (USA) and modules usually last 5-15 weeks (&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University at Albany&lt;/a&gt;).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Hackathon&lt;/b&gt;: an intensive group-work event lasting one or a few days, in which participants tackle a concrete challenge.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Student-Led Interdisciplinary Courses&lt;/b&gt;: courses designed and led by the students themselves, bringing together several disciplines.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Regional Living Labs&lt;/b&gt;: place-based labs in which universities, institutions and citizens work on a real problem. The call open at the time of the kick-off was “&lt;i&gt;The City, the University, and the Common Good: Regenerating the Montelungo-Colleoni Complex&lt;/i&gt;”, on the regeneration of a former military complex in Bergamo &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;“Further info will follow during the year” &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Summer and winter schools&lt;/h3&gt;
  &lt;p&gt;These are short, intensive courses, often international, held during the breaks. Calls are published on the Department and University websites (&lt;a href=&quot;https://dipsa.unibg.it/en/international/international-opportunities/winter-summer-and-international-schools&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DiPSA page&lt;/a&gt;), and further opportunities are announced during the year &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;With the Dundee double degree, at the end you obtain…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;a single joint degree&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;two diplomas&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;a certificate of attendance&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Correct: a “double diploma”, one degree from each university.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between a BIP and a COIL?&lt;/summary&gt;&lt;div&gt;A BIP combines an online component with a short period of physical mobility abroad. A COIL takes place entirely online: classes from different countries collaborate remotely.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;When is the Dundee call published and whom is it aimed at?&lt;/summary&gt;&lt;div&gt;Around May 2027, for the best Year 1 students, who will spend Year 2 in Dundee.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part mat&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;National opportunities · Placement and internship · slides 17-18&lt;/span&gt;
  &lt;h2&gt;Companies, placement and internship&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Placement&lt;/b&gt;: the services that help you enter the labour market (job offers, interviews, career days). &lt;b&gt;Internship&lt;/b&gt; or &lt;b&gt;stage&lt;/b&gt;: a training period within an organisation, recognised in credits.&lt;/div&gt;

  &lt;h3&gt;Strong engagement with companies&lt;/h3&gt;
  &lt;p&gt;Local, national and international companies contribute to courses by sharing their experience and offer stages or internships &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;. Click a group to see who belongs to it and what it can teach you.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Audit and consulting&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Industry&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Healthcare and public sector&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Professions&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Deloitte, PwC, KPMG, EY&lt;/b&gt;: the “Big Four”, the four largest global networks in &lt;span class=&quot;term&quot;&gt;audit&lt;/span&gt; and consulting. Here you see accounting from the assurance side: they verify that companies&#x27; financial statements are reliable.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Brembo, Sanpellegrino (Nestlé Waters group), Magris, Milan Bergamo Airport (BGY)&lt;/b&gt;: local industrial and service companies. Here accounting supports &lt;span class=&quot;term&quot;&gt;controlling&lt;/span&gt; (management control), reporting and group governance, and increasingly sustainability reporting.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;ASST Papa Giovanni XXIII (Bergamo Hospital), Regione Lombardia&lt;/b&gt;: the public sector, where &lt;i&gt;accountability&lt;/i&gt; towards citizens is central and accounting measures the costs and efficiency of services.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Ordine dei Dottori Commercialisti e degli Esperti Contabili di Bergamo&lt;/b&gt; (ODCEC, the Bergamo Order of Chartered Accountants and Accounting Experts): the body that represents and regulates the profession at provincial level. Its role in the professional traineeship is explained below.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Placement and internship: the agreement with the Order&lt;/h3&gt;
  &lt;p&gt;Slide 18 states that the programme is &lt;b&gt;consistent with the agreement&lt;/b&gt; between the University of Bergamo and the Bergamo ODCEC, provided for by the framework agreement between the Ministry (MIUR, now MUR) and the National Council of Chartered Accountants (CNDCEC). Put like that it is rather opaque, so here is a diagram.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 800 300&quot; role=&quot;img&quot; aria-label=&quot;Chain of agreements: national level, local level, student&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ah3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--mat)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;760&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--mat-bg)&quot;/&gt;
    &lt;text x=&quot;400&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;NATIONAL LEVEL · framework agreement&lt;/text&gt;
    &lt;rect x=&quot;80&quot; y=&quot;52&quot; width=&quot;230&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mat)&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Ministry (MIUR → MUR)&lt;/text&gt;

  &lt;details&gt;&lt;summary&gt;What does this mean in practice? (external source)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;To become a &lt;b&gt;chartered accountant&lt;/b&gt; (&lt;i&gt;dottore commercialista&lt;/i&gt;) you need a Master&#x27;s degree, a &lt;span class=&quot;term&quot;&gt;professional traineeship&lt;/span&gt; (&lt;i&gt;tirocinio&lt;/i&gt;, or &lt;i&gt;praticantato&lt;/i&gt;) with a practising professional, and the &lt;b&gt;State professional qualification exam&lt;/b&gt; (&lt;i&gt;esame di Stato&lt;/i&gt;). The law (art. 6(4), Presidential Decree 137/2012) allows the &lt;b&gt;first 6 months&lt;/b&gt; of the traineeship to be completed during the final year of the degree programme, provided a framework agreement exists between the Ministry and the Order. The 2014 agreement (art. 43, Legislative Decree 139/2005) also provides, for compliant programmes, an &lt;b&gt;exemption from the first written paper&lt;/b&gt; of the State exam.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Sources: &lt;a href=&quot;https://www.unitn.it/sites/default/files/2025-01/Convenzione%20ODCEC%20TN%20e%20UniTN_%2005.03.2020.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;example of a University-ODCEC agreement (Trento)&lt;/a&gt;; &lt;a href=&quot;https://www.fiscal-focus.it/quotidiano/altre-tematiche/infoprofessioni/tirocinio-professionale-indicazioni-del-miur-al-cndcec,3,56980&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fiscal Focus, MIUR guidance to the CNDCEC&lt;/a&gt;. The precise conditions for AGS (required courses, hours, curriculum) should be checked with the internship coordinators and on the programme website.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;What is the Bergamo ODCEC?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;A recruitment agency&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;The provincial Order of Chartered Accountants and Accounting Experts&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;A Ministry office&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Correct: it is the local professional body that signs the agreement with the university.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Why does it matter that the programme is “consistent” with the MUR-CNDCEC agreement?&lt;/summary&gt;&lt;div&gt;Because it allows you to complete part of the professional traineeship during your studies and, under the stated conditions, to obtain concessions in the State exam. The path to the profession becomes shorter.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why are the Big Four of interest to an accounting graduate?&lt;/summary&gt;&lt;div&gt;Because they are the main employers in audit and consulting: there, accounting is applied to verifying and providing assurance that financial reporting information is reliable.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part ocr&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Creo-labs · Open Badge · Seminars · slides 19, 21-23, 25&lt;/span&gt;
  &lt;h2&gt;Labs, badges and events&lt;/h2&gt;

  &lt;h3&gt;CREO LABS: Entrepreneurial University&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;CREO&lt;/b&gt; stands for &lt;span class=&quot;term&quot;&gt;Competencies and Resources for Entrepreneurial Orientation&lt;/span&gt;. It is the project through which the University aims to be an &lt;span class=&quot;term&quot;&gt;Entrepreneurial University&lt;/span&gt;: one that teaches students to take initiative, innovate and work in teams on real problems.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;6 CFU&lt;/b&gt;, in the &lt;b&gt;second semester&lt;/b&gt;&lt;/li&gt;&lt;li&gt;4 labs, each in one language&lt;/li&gt;&lt;li&gt;For students enrolled in a Master&#x27;s degree (or the final two years of a single-cycle degree)&lt;/li&gt;&lt;li&gt;The poster gives &lt;b&gt;10 November&lt;/b&gt; as the registration deadline; the 2026-27 call “will be open very soon”&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The project is coordinated by the CYFE research centre (Center for Young and Family Enterprise) and students work in teams of about 5 (&lt;a href=&quot;https://cyfe.unibg.it/it/formazione/creo-lab&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cyfe.unibg.it&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 300&quot; role=&quot;img&quot; aria-label=&quot;The four CREO labs and their language&quot;&gt;

      &lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--ard-bg)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ard)&quot;&gt;Sustainability&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ENG&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;150&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;Digital technologies&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;216&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;and AI&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ITA&lt;/text&gt;
      &lt;rect x=&quot;165&quot; y=&quot;150&quot; width=&quot;145&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--mat-bg)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--mat)&quot;&gt;Tourism and&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;216&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--mat)&quot;&gt;creative industries&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;ENG&lt;/text&gt;

  &lt;h3&gt;TRANSET Open Badge: organisations in transition&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Open Badge&lt;/b&gt;: a verifiable digital credential (an image with embedded metadata: who issued it, for what, and against which criteria) that you can display on your CV and LinkedIn. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;It follows the international Open Badges standard by 1EdTech, originally developed by Mozilla (&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1edtech.org&lt;/a&gt;).&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;TRANSET&lt;/b&gt; recognises a multidisciplinary pathway on the &lt;b&gt;ecological, digital and social transition&lt;/b&gt;. It is part of the project for which the MUR designated the Department a &lt;b&gt;Department of Excellence 2023-2027&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;
    &lt;p style=&quot;font-weight:500;margin-bottom:.4rem&quot;&gt;Simulator: do you meet the requirements for the badge?&lt;/p&gt;
    &lt;label class=&quot;note&quot; for=&quot;tEv&quot;&gt;TRANSET events attended: &lt;b id=&quot;tEvV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tEv&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;
    &lt;label class=&quot;note&quot; for=&quot;tPr&quot;&gt;Average recorded attendance at each event: &lt;b id=&quot;tPrV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tPr&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
    &lt;label class=&quot;note&quot; for=&quot;tWd&quot;&gt;Words in the reflective journal: &lt;b id=&quot;tWdV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tWd&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:.6rem&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;tChk&quot; font-size=&quot;13&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;tOut&quot; class=&quot;out&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;The rules on slide 21, in three steps: &lt;b&gt;1)&lt;/b&gt; take part in at least 5 TRANSET events or activities from the published calendar; &lt;b&gt;2)&lt;/b&gt; record your attendance (form, signature at the desk or online report), which must cover 75% of the duration; &lt;b&gt;3)&lt;/b&gt; complete the pathway with an individual reflective journal of 800-1,000 words. What it is for: a competence portfolio, your CV and LinkedIn, networking with academics, companies and professionals.&lt;/p&gt;

  &lt;details&gt;&lt;summary&gt;TRANSET events in autumn 2026 (slide 22)&lt;/summary&gt;&lt;div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;September&lt;/b&gt;: “Populism, gender and representation: is there still room for intermediary bodies?”, based on the book &lt;i&gt;Disintermediare stanca&lt;/i&gt; (“Disintermediation is wearing”) by Francesco Seghezzi. &lt;span class=&quot;term&quot;&gt;Intermediary bodies&lt;/span&gt; (&lt;i&gt;corpi intermedi&lt;/i&gt;) are the organisations that sit between citizens and the State: trade unions, industry associations.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;September&lt;/b&gt;: “Markets, relationships and firm value: which way is governance heading?”, presentation of &lt;i&gt;Governance Under Influence: The Role of Political Connections in the ESG Transition&lt;/i&gt;. The topic is directly linked to governance and sustainability.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;October&lt;/b&gt;: “Young people, masculinities and politics”, with the first findings of the MEN4DEM project.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;November&lt;/b&gt;: &lt;i&gt;Il sapere che conta&lt;/i&gt; (“The knowledge that counts”), a book by Prof. Annamaria Lusardi (Stanford University) on &lt;span class=&quot;term&quot;&gt;financial literacy&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;November&lt;/b&gt;: “Countering violence: from gender resentment to pro-social transformation”.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;December&lt;/b&gt;: “Binance Tour”, with Gian Luca Comandini, on financial literacy in everyday life.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;December&lt;/b&gt;: “Masculinities in the digital society”.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;December&lt;/b&gt;: “Continuity project” (the description is cut off on the slide).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Slide 23 contains a QR code, probably for the calendar or registration: scan it from the original slide.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;PhD Day 2026 · Poster Gallery&lt;/h3&gt;
  &lt;p&gt;On &lt;b&gt;25 September 2026&lt;/b&gt; the Doctoral School presented the research of its PhD students. For AGS, the most relevant is the PhD in &lt;b&gt;Management, Accounting and Finance&lt;/b&gt;, with topics such as &lt;i&gt;shareholder activism and M&amp;amp;A&lt;/i&gt; and access to the mortgage market &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;. It shows what is studied “after” the Master&#x27;s degree and is a source of ideas for your thesis.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shareholder activism&lt;/b&gt;: when shareholders use their influence (voting, proposals, public pressure) to change management&#x27;s decisions. &lt;b&gt;M&amp;amp;A&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;mergers and acquisitions&lt;/span&gt;): the combination and purchase of companies.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;You attended 5 TRANSET events at 75% and wrote a 700-word journal. Do you get the badge?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;No, the journal is too short&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;No, 10 events are required&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Correct: the journal must be 800-1,000 words long.&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;How many CFU is a CREO lab worth and in which semester does it take place?&lt;/summary&gt;&lt;div&gt;6 CFU, in the second semester. There are 4 labs, two in Italian and two in English.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is an Open Badge and why is it useful?&lt;/summary&gt;&lt;div&gt;It is a digital credential with verifiable metadata on who issued it and against which criteria. It can be displayed on your CV and LinkedIn to document competences that your final degree mark does not show.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part mat&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Rules of conduct · Thesis · Contacts · slides 26-36&lt;/span&gt;
  &lt;h2&gt;Rules, thesis and whom to contact&lt;/h2&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;In class&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Respect timetables and &lt;span class=&quot;term&quot;&gt;rules of conduct&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;If you attend in person, follow the safety rules.&lt;/li&gt;&lt;li&gt;Read the &lt;span class=&quot;term&quot;&gt;guidelines&lt;/span&gt; and the &lt;span class=&quot;term&quot;&gt;vademecum&lt;/span&gt; with the deadlines carefully.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;In exams&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;It is &lt;b&gt;compulsory to register for exam dates, or unsubscribe, by the deadlines&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Follow the procedures.&lt;/li&gt;&lt;li&gt;Study &lt;b&gt;all&lt;/b&gt; the books and references indicated.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Do not answer with bullet points: “it is not a slide!”&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;“Do not answer using lists”: the difference in practice&lt;/h3&gt;
  &lt;p&gt;In a written exam the question asks you to reason: to connect concepts and explain causes and consequences. A list shows that you remember the words, not that you have understood. Compare two answers to the same question.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;swap&quot;&gt;
    &lt;p style=&quot;font-weight:500&quot;&gt;Question: “Why do political connections matter for corporate governance?”&lt;/p&gt;
    &lt;div class=&quot;swap&quot;&gt;&lt;button class=&quot;b pri&quot; data-v=&quot;0&quot;&gt;List answer ✗&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;1&quot;&gt;Argued answer ✓&lt;/button&gt;&lt;/div&gt;
    &lt;div data-p=&quot;0&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;access to credit&lt;/li&gt;&lt;li&gt;board composition&lt;/li&gt;&lt;li&gt;ESG&lt;/li&gt;&lt;li&gt;risks&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;The keywords are there, but the links are missing: the examiner cannot tell whether you have understood the mechanism.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-p=&quot;1&quot; hidden style=&quot;margin-top:.8rem&quot;&gt;&lt;p&gt;Political connections shape governance because they change the incentives of those who control the firm. A connected board may obtain preferential access to credit, which lowers the cost of capital in the short run; however, this advantage can weaken monitoring and accountability towards minority shareholders. In the ESG transition, such ties may also influence which sustainability strategies are pursued, so the “G” ends up conditioning the “E” and the “S”.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Each sentence is linked to the previous one (“because”, “however”, “so”): this is the reasoning the exam wants to see. Example written for this page on the theme of the book cited on slide 22.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Suggestions for thesis&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--sal)&quot;&gt;&lt;h4 style=&quot;color:var(--sal)&quot;&gt;Do&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Look for a &lt;span class=&quot;term&quot;&gt;thesis supervisor&lt;/span&gt; &lt;b&gt;well in advance&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;When you contact a lecturer, present a &lt;b&gt;thesis proposal&lt;/b&gt;: topic, &lt;span class=&quot;term&quot;&gt;research question&lt;/span&gt; (the question your thesis answers), provisional title.&lt;/li&gt;&lt;li&gt;Read the thesis guide and check the deadlines at &lt;a href=&quot;https://ls-ags.unibg.it/en/how/how-graduate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/how/how-graduate&lt;/a&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--mat)&quot;&gt;&lt;h4 style=&quot;color:var(--mat)&quot;&gt;Don&#x27;t&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;No “generic” emails&lt;/b&gt; sent to all lecturers asking whether they are available as supervisors.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;A message identical for everyone signals that you do not yet have an idea: a lecturer who receives a specific proposal is far more willing to consider it.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Who should you contact…&lt;/h3&gt;
  &lt;p&gt;The slides propose a three-step ladder: start with the person closest to the problem and move up only when necessary. There are two channels, &lt;b&gt;email&lt;/b&gt; and &lt;b&gt;appointments&lt;/b&gt; (office hours by appointment) &lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;. Choose a situation to see whom to contact.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 360 300&quot; role=&quot;img&quot; aria-label=&quot;Three-level contact ladder&quot;&gt;
      &lt;g id=&quot;lad&quot;&gt;
        &lt;g data-l=&quot;0&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;40&quot; font-weight=&quot;600&quot; fill=&quot;var(--acc)&quot;&gt;1 · Course professor&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;60&quot; font-size=&quot;12&quot;&gt;clarifications, classroom issues,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;information about the course&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;1&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;110&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;140&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink2)&quot;&gt;2 · Specific professors / tutors&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;study plan and internship contacts,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;thesis supervisor, programme tutor&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;2&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;210&quot; width=&quot;340&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;28&quot; y=&quot;240&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocr)&quot;&gt;3 · MD President&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;260&quot; font-size=&quot;12&quot;&gt;cross-cutting issues,&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;276&quot; font-size=&quot;12&quot;&gt;specific reports&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;0&quot;&gt;I did not understand a topic from the lecture&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;I don&#x27;t know which alternative exam to choose in the study plan&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;I want to do an internship at a company&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;1&quot;&gt;I have a question about my thesis draft&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;2&quot;&gt;A problem affects several courses at once&lt;/button&gt;
      &lt;button class=&quot;b&quot; data-to=&quot;2&quot;&gt;I need to make a specific report about the programme&lt;/button&gt;
      &lt;p class=&quot;note&quot; id=&quot;ladOut&quot; style=&quot;margin-top:.6rem&quot;&gt;Click a situation.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;mc&quot; data-mc&gt;&lt;p&gt;You did not unsubscribe from an exam date you are not attending. What do the rules say?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;b&quot;&gt;It doesn&#x27;t matter&lt;/button&gt;&lt;button class=&quot;b&quot; data-ok&gt;Registration and cancellation must be done by the deadlines: it is compulsory&lt;/button&gt;&lt;button class=&quot;b&quot;&gt;It is enough to notify the day after&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot; data-fb=&quot;Yes: “compulsory to register / to unsubscribe by the deadlines” (slide 28).&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;What do you bring to the first meeting with a potential supervisor?&lt;/summary&gt;&lt;div&gt;A thesis proposal: topic, research question, provisional title and, ideally, an idea of method and sources. Not a generic email asking about availability.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Whom do you write to first if a problem concerns a single course?&lt;/summary&gt;&lt;div&gt;The course lecturer (course professor). The Programme President is to be contacted for cross-cutting issues or specific reports.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part acc&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;✦&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;Texts, regulations, standards and websites cited in the slides (or needed to understand them). For each one you will find what it contains and why it matters to you. &lt;b&gt;All entries are &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/b&gt;: the information comes from web searches carried out in October 2026, not from the slides.&lt;/p&gt;

  &lt;h3&gt;Programme and university websites (cited in the slides)&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it: AGS programme website&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Programme overview (2 years, 120 ECTS, taught in English, AIB and AG4S curricula), study plan, regulations by cohort, graduation guide, contacts.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the official reference for deadlines and rules. The slides refer to it several times (slides 8, 9, 30, 35).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://dipsa.unibg.it/en/international/partners-and-networks/bauhaus4eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BAUHAUS4EU, DiPSA page&lt;/a&gt; · &lt;a href=&quot;https://www.bauhaus4.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bauhaus4.eu&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;An alliance of 10 European universities coordinated by the Bauhaus-Universität Weimar and co-funded by Erasmus+ (European Universities initiative). It draws on the values of the New European Bauhaus: sustainability, inclusion, aesthetics. In 2026-27 Bergamo is launching SLC, EBC and its first Regional Living Lab.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the BIP, COIL and RLL calls on slide 20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://cyfe.unibg.it/it/formazione/creo-lab&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CREO Lab · CYFE, University of Bergamo&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Interdisciplinary labs on innovation, managing uncertainty and teamwork (groups of about 5), coordinated by the Center for Young and Family Enterprise. The same offering also includes Start Cup Bergamo, hackathons and mentoring.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains how the 6-CFU activity on slide 19 works.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.dundee.ac.uk/postgraduate/accounting-finance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Dundee: MSc Accounting &amp;amp; Finance&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A one-year Master&#x27;s covering international financial reporting, corporate finance and governance, international finance, risk management and strategy, with exemptions from ACCA exams.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is Year 2 of the double degree (slide 15). Fees and entry requirements should be checked on the official website and in the call.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Regulations and standards&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow%20up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide (2015)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Guide endorsed within the Bologna Process: 60 credits per full-time year, a workload of 1,500-1,800 hours, i.e. 25-30 hours per credit, and the link between credits and &lt;span class=&quot;term&quot;&gt;learning outcomes&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains what “3 ECTS”, “6 CFU” and the 120 ECTS of the Master&#x27;s degree mean.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://erasmus-plus.ec.europa.eu/programme-guide/erasmusplus-programme-guide&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Erasmus+ Programme Guide (European Commission)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;The official text setting out the rules for all Erasmus+ actions: study mobility, BIPs, university alliances. The 2026 version is dated 12.11.2025 and available in 24 languages.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the regulatory basis for the exchanges on slide 16 and the BIPs on slide 20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unimi.it/en/international/study-abroad/blended-intensive-programmes-bip&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Blended Intensive Programmes (BIP)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;An Erasmus+ format: 5 to 30 days in person plus a virtual component, at least 3 ECTS, at least 3 universities from 3 countries. The page belongs to another university, but the rules are the same.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is one of the formats of the European BAUHAUS Courses.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;COIL · Collaborative Online International Learning&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A virtual exchange model developed at the SUNY COIL Center (since 2006): classes from different countries co-design a joint piece of work online, usually over 5-15 weeks.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the other format of the European BAUHAUS Courses (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unitn.it/sites/default/files/2025-01/Convenzione%20ODCEC%20TN%20e%20UniTN_%2005.03.2020.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MUR-CNDCEC framework agreement (example of a local agreement)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A 2014 agreement provided for by art. 43 of Legislative Decree 139/2005, implemented through agreements between individual universities and Orders. Together with art. 6(4) of Presidential Decree 137/2012, it allows 6 months of the traineeship to be completed in the final year of the degree and provides an exemption from the first written paper of the State exam.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains slide 18. The link leads to the Trento agreement as an example; for Bergamo, ask the internship coordinators.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Departments of Excellence (MUR)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A programme established by Law 232/2016 (art. 1, paras. 314-337): every five years it funds the 180 best departments of state universities, with €271 million per year, selected partly on the basis of the VQR (research quality assessment).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the “Dipartimento di Eccellenza 2023-2027” logo on slide 21 and where projects such as TRANSET come from.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open Badges (1EdTech)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A standard for verifiable digital credentials, created by Mozilla and managed by 1EdTech since 2017. Version 3.0 is aligned with the W3C Verifiable Credentials.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the format of the TRANSET badge you can add to your CV and LinkedIn.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Books and projects presented at TRANSET events&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://aisberg.unibg.it/handle/10446/311807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bellavite Pellegrini, Pellegrini, Roncella: &lt;i&gt;Governance Under Influence&lt;/i&gt; (Palgrave Macmillan, 2026)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;The first of two volumes on how political connections influence corporate governance in Italy, France, Germany and the United Kingdom, from the fall of the Berlin Wall to the sovereign debt crisis. Among the effects examined is preferential access to credit.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the closest to the programme&#x27;s content, as it brings together governance and ESG.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.prnewswire.com/it/comunicati-stampa/unopera-fondamentale-per-il-nostro-benessere-finanziario-il-sapere-che-conta-di-annamaria-lusardi-302149809.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annamaria Lusardi: &lt;i&gt;Il sapere che conta&lt;/i&gt; (Mondadori, 2024)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A seven-chapter guide to the basics of personal finance: saving, investing, inflation, interest rates. The author is an economist at Stanford and from 2017 to 2023 directed the Italian Committee for Financial Education.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: &lt;i&gt;financial literacy&lt;/i&gt; is the foundation for reading figures beyond the financial statements, too.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://static.francoangeli.it/fa-contenuti/area_pdfdemo/1496.2_demo.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Francesco Seghezzi: &lt;i&gt;Disintermediare stanca&lt;/i&gt; (FrancoAngeli, 2026)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;An essay on how the drive towards disintermediation in markets, politics and work fuels populism and undermines intermediary bodies. It includes five national case studies: Austria, France, Italy, Poland, Spain.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it addresses stakeholders and representation, close to the theme of accountability towards society.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.uu.se/en/department/government/news/archive/2025-02-28-uppsala-university-partner-in-the-horizon-europe-funded-research-project-men4dem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MEN4DEM: Masculinities for the Future of European Democracy&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;A Horizon Europe research project launched in 2025, coordinated by the University of Amsterdam with six partner universities. It studies the relationship between models of masculinity and democracy in Europe.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it underpins the October event (slide 22) and is an example of a European research project.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;script&gt;
(function(){
  // progress bar and active nav
  var bar=document.getElementById(&#x27;bar&#x27;),links=[].slice.call(document.querySelectorAll(&#x27;nav.top a&#x27;));
  var secs=links.map(function(a){return document.querySelector(a.getAttribute(&#x27;href&#x27;))});
  function onScroll(){
    var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    bar.style.width=(max&gt;0?h.scrollTop/max*100:0)+&#x27;%&#x27;;
    var cur=0;secs.forEach(function(s,i){if(s&amp;&amp;s.getBoundingClientRect().top&lt;120)cur=i});
    links.forEach(function(a,i){a.classList.toggle(&#x27;on&#x27;,i===cur)});
  }
  addEventListener(&#x27;scroll&#x27;,onScroll,{passive:true});onScroll();

  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var tabs=t.querySelectorAll(&#x27;[role=tab]&#x27;),pans=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    tabs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,i===j)});
      pans.forEach(function(p,j){p.hidden=i!==j});
    })});
  });

  // steps
  document.querySelectorAll(&#x27;[data-steps]&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.st&#x27;),d=s.querySelector(&#x27;.dots&#x27;),i=0,pv=s.querySelector(&#x27;[data-prev]&#x27;),nx=s.querySelector(&#x27;[data-next]&#x27;);
    st.forEach(function(){d.appendChild(document.createElement(&#x27;i&#x27;))});
    function go(n){i=Math.max(0,Math.min(st.length-1,n));
      st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});
      d.querySelectorAll(&#x27;i&#x27;).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j&lt;=i)});
      pv.disabled=i===0;nx.disabled=i===st.length-1;}
    pv.addEventListener(&#x27;click&#x27;,function(){go(i-1)});nx.addEventListener(&#x27;click&#x27;,function(){go(i+1)});go(0);
  });

  // multiple-choice questions
  document.querySelectorAll(&#x27;[data-mc]&#x27;).forEach(function(m){
    var fb=m.querySelector(&#x27;.fb&#x27;);
    m.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      m.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;)});
      if(b.hasAttribute(&#x27;data-ok&#x27;)){b.classList.add(&#x27;ok&#x27;);fb.textContent=&#x27;✓ &#x27;+fb.getAttribute(&#x27;data-fb&#x27;);}
      else{b.classList.add(&#x27;ko&#x27;);fb.textContent=&#x27;✗ Not quite: try again.&#x27;;}
    })});
  });

  // year wheel
  var W=document.getElementById(&#x27;wheel&#x27;);
  if(W){
    var segs=[
      {a:0,b:105,c:&#x27;var(--acc)&#x27;,t:&#x27;1st semester: teaching&#x27;,d:&#x27;From mid-September to December. For 2026-27: from 14 September to 19 December 2026, with some suspensions (see below).&#x27;},
      {a:105,b:150,c:&#x27;var(--ard)&#x27;,t:&#x27;Winter session&#x27;,d:&#x27;January-February: first-semester exams. The calendar shows the 1st exam date around 7 January and the 2nd around 26 January 2027.&#x27;},
      {a:150,b:240,c:&#x27;var(--acc)&#x27;,t:&#x27;2nd semester: teaching&#x27;,d:&#x27;From late February to late May. The calendar gives 15 February as the start and 28 May 2027 as the end, with mid-term exams on 22-23 April and the Easter break.&#x27;},
      {a:240,b:300,c:&#x27;var(--ard)&#x27;,t:&#x27;Summer session&#x27;,d:&#x27;June-July: exams. The calendar shows the 3rd exam date in late May-early June and the 4th in late June.&#x27;},
      {a:300,b:330,c:&#x27;var(--rule)&#x27;,t:&#x27;Summer break&#x27;,d:&#x27;August: no teaching and no exams.&#x27;},
