&lt;!-- ============ 06 ============ --&gt;
&lt;section class=&quot;part tone-ochre&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Entrepreneurial University&lt;/div&gt;&lt;h2&gt;CREO-LAB: from need to project&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 17–21&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;CREO&lt;/b&gt; = &lt;i&gt;Competencies and Resources for Entrepreneurial Orientation&lt;/i&gt; (&quot;powered by CYFE&quot;). Motto: &quot;&lt;i&gt;Not just theory. Ideas, people and skills to put into action.&lt;/i&gt;&quot; CREO-LABs are &lt;b&gt;learning-by-doing&lt;/b&gt; laboratories run in &lt;b&gt;multidisciplinary teams&lt;/b&gt; (groups of students from different programmes). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The university page describes them as an entrepreneurship education pathway with faculty from all disciplinary areas (&lt;a href=&quot;https://www.unibg.it/studiare/corsi/altre-opportunita-formazione/creo-progetto-delluniversita-studi-bergamo-formazione&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it, CREO&lt;/a&gt;).&lt;/div&gt;

  &lt;h3&gt;The pathway: &quot;assess a need and find a solution&quot;&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Explore entrepreneurship in a field&lt;/h4&gt;&lt;p&gt;You start from a domain (digital, health, sustainability, tourism) and observe its actors, problems and trends.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Analyse and validate a need&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Validating&lt;/b&gt; means verifying with evidence (interviews, data, observation) that the problem really exists and matters to someone, before falling in love with a solution.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Generate an original, relevant, feasible idea&lt;/h4&gt;&lt;p&gt;The three criteria on slide 19 work together: see the diagram below.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Build a business model&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Business model&lt;/b&gt;: the logic by which an organisation &lt;b&gt;creates, delivers and captures value&lt;/b&gt; (whom it serves, what it offers, how it earns revenue, what resources it uses). The slides call for models &quot;&lt;i&gt;that create value and are potentially scalable&lt;/i&gt;&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Final project work and communication&lt;/h4&gt;&lt;p&gt;The output is a final &lt;b&gt;project work&lt;/b&gt; to be presented: this is why the skills include &quot;&lt;i&gt;the ability to communicate and develop an idea&lt;/i&gt;&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;cols&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 260&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram: original, relevant, feasible&quot;&gt;
        &lt;g opacity=&quot;.4&quot;&gt;
          &lt;circle cx=&quot;120&quot; cy=&quot;100&quot; r=&quot;78&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;100&quot; r=&quot;78&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;168&quot; r=&quot;78&quot; fill=&quot;var(--slate)&quot;/&gt;
        &lt;/g&gt;
        &lt;g style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;&lt;text x=&quot;70&quot; y=&quot;70&quot;&gt;Original&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;70&quot;&gt;Relevant&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot;&gt;Feasible&lt;/text&gt;&lt;/g&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;124&quot; r=&quot;20&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 12px var(--sans);fill:var(--ink)&quot;&gt;idea&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Original but irrelevant = a curiosity; relevant but not feasible = a dream; feasible and relevant but not original = already done.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;h4&gt;The 5 skills the lab develops&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Problem solving&lt;/li&gt;&lt;li&gt;Teamwork&lt;/li&gt;&lt;li&gt;Creativity&lt;/li&gt;&lt;li&gt;Project development&lt;/li&gt;&lt;li&gt;The ability to communicate and develop an idea&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;What does &quot;potentially scalable&quot; mean?&lt;/h4&gt;
    &lt;p style=&quot;margin-top:0&quot;&gt;A model is &lt;b&gt;scalable&lt;/b&gt; when revenues can grow much faster than costs: high fixed costs at the outset, low costs for each additional customer. Compare the average cost per customer of two models (invented figures, for teaching purposes only): a digital platform (fixed cost €20,000, €2 per customer) and a bespoke consultancy (fixed cost €500, €60 per customer).&lt;/p&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;nu&quot;&gt;Number of customers&lt;/label&gt;&lt;input id=&quot;nu&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;nuO&quot;&gt;100&lt;/output&gt;&lt;/div&gt;
    &lt;svg id=&quot;scal&quot; viewBox=&quot;0 0 520 280&quot; style=&quot;width:100%;height:auto;background:var(--card);border-radius:10px&quot; role=&quot;img&quot; aria-label=&quot;Chart of average cost per customer&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;240&quot; x2=&quot;500&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot;/&gt;
      &lt;g style=&quot;font:400 10px var(--sans);fill:var(--muted)&quot;&gt;&lt;text x=&quot;44&quot; y=&quot;244&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;134&quot; text-anchor=&quot;end&quot;&gt;€100&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;€200&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;256&quot; text-anchor=&quot;end&quot;&gt;1000 customers&lt;/text&gt;&lt;text x=&quot;50&quot; y=&quot;256&quot;&gt;0&lt;/text&gt;&lt;/g&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;130&quot; x2=&quot;500&quot; y2=&quot;130&quot; stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;
      &lt;path id=&quot;pS&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path id=&quot;pC&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;line id=&quot;vL&quot; y1=&quot;20&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;2 3&quot;/&gt;
      &lt;circle id=&quot;dS&quot; r=&quot;5&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle id=&quot;dC&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;g style=&quot;font:600 11px var(--sans)&quot;&gt;&lt;text x=&quot;380&quot; y=&quot;40&quot; fill=&quot;var(--ochre)&quot;&gt;platform (scalable)&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;56&quot; fill=&quot;var(--slate)&quot;&gt;consultancy (barely scalable)&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;res&quot; id=&quot;scR&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;4 CREO-LABs, many perspectives&lt;/h3&gt;
  &lt;div class=&quot;cols&quot; style=&quot;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Digital technologies &amp;amp; artificial intelligence&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in Italian&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Health&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in Italian&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in English&lt;/span&gt;&lt;p style=&quot;font-size:.9rem&quot;&gt;The closest to AGS topics.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Tourism &amp;amp; Creative Industries&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in English&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;6 ECTS&lt;/b&gt; · second semester · open to all Master&#x27;s programmes · in person · &lt;i&gt;challenge-based or problem-inspired&lt;/i&gt; · seminars, guest speakers, hands-on activities, team building, field experiences. Those who complete the lab receive the &lt;b&gt;&quot;CREO-LAB Entrepreneurial Mindset&quot; Open Badge&lt;/b&gt; (section 07). 2026-2027 is the &lt;b&gt;4th edition&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which three characteristics must the idea have according to CREO-LAB?&lt;/summary&gt;&lt;p&gt;Original, relevant, feasible.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why start from the need rather than from the solution?&lt;/summary&gt;&lt;p&gt;Because an idea is valuable only if it responds to a real, validated need; starting from the solution risks creating something nobody is looking for.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the chart, why does the platform become more cost-effective beyond a certain threshold?&lt;/summary&gt;&lt;p&gt;Because its high fixed cost is spread over more and more customers, while the cost per customer stays low (€2). The consultancy has a high cost per customer (€60) that does not fall. With these figures the crossover occurs at around 340 customers.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 07 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Digital credentials&lt;/div&gt;&lt;h2&gt;Open Badges and the TRANSET pathway&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 20, 22–24, 26&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Open Badge&lt;/b&gt;: a digital credential certifying a skill or participation. Unlike a PDF, it contains verifiable data: who issued it, to whom, according to which criteria and (sometimes) with what evidence. It can be displayed on a CV or on LinkedIn. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The standard is maintained by 1EdTech; version 3.0 (May 2024) makes each badge a &lt;i&gt;Verifiable Credential&lt;/i&gt; digitally signed by the issuer (&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1EdTech, Open Badges&lt;/a&gt;).&lt;/div&gt;

  &lt;p&gt;The slides feature &lt;b&gt;three&lt;/b&gt; different badges:&lt;/p&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;CREO-LAB Entrepreneurial Mindset&lt;/h4&gt;&lt;p&gt;For those who complete a CREO-LAB (sect. 06).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;TRANSET · organisations in transition&lt;/h4&gt;&lt;p&gt;A multidisciplinary pathway on the &lt;b&gt;ecological, digital and social&lt;/b&gt; transition.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Career Management Skills&lt;/h4&gt;&lt;p&gt;Linked to the Career Day (sect. 08).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;TRANSET in brief&lt;/h3&gt;
  &lt;p&gt;TRANSET stems from DipSA&#x27;s recognition by MUR as a &lt;b&gt;Department of Excellence 2023-2027&lt;/b&gt; (the logo is on slide 22). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Departments of Excellence are 180 departments of state universities selected every five years and funded for a five-year project under Law 232/2016 (&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MUR&lt;/a&gt;); DipSA&#x27;s TRANSET project focuses on social, environmental and economic sustainability (&lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/transet_15mag2025_05.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, TRANSET flyer&lt;/a&gt;).&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Simulator: are you eligible for the TRANSET Open Badge?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;te&quot;&gt;TRANSET events attended&lt;/label&gt;&lt;input id=&quot;te&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;teO&quot;&gt;3&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;tp&quot;&gt;Average attendance (% of duration)&lt;/label&gt;&lt;input id=&quot;tp&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;tpO&quot;&gt;80%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;tw&quot;&gt;Reflective journal word count&lt;/label&gt;&lt;input id=&quot;tw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;twO&quot;&gt;600&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;tR&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-bottom:0&quot;&gt;Rules from slide 22: at least &lt;b&gt;5&lt;/b&gt; events; attendance recorded (form, signature at the desk or online report) for at least &lt;b&gt;75%&lt;/b&gt; of the duration; an individual reflective journal of &lt;b&gt;800–1,000 words&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The TRANSET calendar (slide 23)&lt;/h3&gt;
  &lt;p&gt;Each event is also an opportunity to encounter concepts relevant to AGS. Open the cards:&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Sep 2026 · Populisms, gender and representation: is there still room for intermediate bodies?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Starts from the book &lt;i&gt;Disintermediare stanca&lt;/i&gt; [Disintermediation is wearing] by Francesco Seghezzi. &lt;b&gt;Intermediate bodies&lt;/b&gt;: organisations standing between the individual and the State (trade unions, trade associations, political parties). &lt;b&gt;Disintermediation&lt;/b&gt;: their progressive bypassing, for example through platforms or leaders who speak directly to citizens, which according to the event has often produced a &quot;representation gap&quot; in work and society.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Sep 2026 · Market, relationships and firm value: how is governance oriented?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Presentation of the volume &lt;i&gt;Governance Under Influence: The Role of Political Connections in the ESG Transition&lt;/i&gt;. &lt;b&gt;ESG&lt;/b&gt; = &lt;i&gt;Environmental, Social, Governance&lt;/i&gt;, the three pillars by which a company&#x27;s sustainability is assessed. &lt;b&gt;Political connections&lt;/b&gt;: ties between business and politics (former politicians on boards, relationships with institutions) that can shape strategies, sustainability and value creation. This is the topic closest to the core of the programme: the G in ESG.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Oct 2026 · Youth, masculinities and politics: being young men in a polarised world&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Data on political participation and values of young men in Italy, and preliminary results of the European project &lt;b&gt;MEN4DEM&lt;/b&gt; on the relationship between masculinities and politics.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nov 2026 · Il sapere che conta [The knowledge that matters]&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Presentation of the book by Annamaria Lusardi (Stanford University) on &lt;b&gt;financial literacy&lt;/b&gt;: the ability to understand concepts such as compound interest, inflation, risk and diversification, and to apply them in everyday choices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nov 2026 · Countering violence: from gender resentment to pro-social transformation&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;A reflection on gender resentment, the risks of its escalation, and how it can become a transformative resource if reworked through inclusive values and awareness pathways.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dec 2026 · Binance Tour&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;A public outreach event with an entrepreneur and technology communicator, again on the role of financial literacy in everyday life (the name refers to a cryptocurrency exchange platform).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dec 2026 · Masculinities in the digital society&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&quot;Online masculinities&quot;: models circulating online, their political implications and media representations, with the aim of moving beyond &quot;moral panic&quot; (an alarmist, disproportionate reaction to a social phenomenon).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dec 2026 · Continuity project&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The description is cut off on slide 23; slide 24 contains only a QR code. Check the updated calendar on the Department website.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What makes an Open Badge different from a PDF certificate?&lt;/summary&gt;&lt;p&gt;It contains verifiable metadata (issuer, criteria, recipient, any evidence) and can be shared and checked online.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;You attended 6 TRANSET events but your journal is 500 words long. Do you get the badge?&lt;/summary&gt;&lt;p&gt;No: the reflective journal must be 800–1,000 words (and recorded attendance at least 75%).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does the G in ESG stand for, and which TRANSET event addresses it directly?&lt;/summary&gt;&lt;p&gt;Governance: the rules, bodies and relationships by which a company is directed and controlled. It is addressed by the event on &quot;Governance Under Influence&quot; (September 2026).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 08 ============ --&gt;
&lt;section class=&quot;part tone-slate&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Work, schools, social enterprise&lt;/div&gt;&lt;h2&gt;Career Day, summer &amp;amp; winter schools, Enactus&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 25–28&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;div class=&quot;big&quot;&gt;26/11&lt;/div&gt;&lt;h4&gt;Unibg Career Day 2026&lt;/h4&gt;&lt;p&gt;At the &lt;b&gt;Fiera di Bergamo&lt;/b&gt; (&lt;i&gt;Bergamo Exhibition Centre&lt;/i&gt;): a direct meeting between students, graduates and companies. Portal: &lt;a href=&quot;https://www.careerdayunibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;careerdayunibg.it&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;div class=&quot;big&quot;&gt;from 8/10&lt;/div&gt;&lt;h4&gt;&quot;Waiting for Career Day&quot;&lt;/h4&gt;&lt;p&gt;Career guidance webinars to arrive well prepared: active job search, selection tools, career strategies.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Simulator: &quot;Career Management Skills&quot; badge&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;cw&quot;&gt;Webinars attended&lt;/label&gt;&lt;input id=&quot;cw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;6&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwO&quot;&gt;1&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label&gt;Career Day attendance&lt;/label&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; id=&quot;cd&quot; aria-pressed=&quot;false&quot;&gt;not yet&lt;/button&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;cR&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-bottom:0&quot;&gt;Rule from slide 26: at least &lt;b&gt;two&lt;/b&gt; &quot;Waiting for Career Day&quot; sessions &lt;b&gt;and&lt;/b&gt; the Career Day itself.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Summer and winter schools&lt;/h3&gt;
  &lt;p&gt;Short, intensive courses, often international, held in the summer or winter months. Calls are published on the department and university websites (&lt;a href=&quot;https://dipsa.unibg.it/en/international/international-opportunities/winter-summer-and-international-schools&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA page&lt;/a&gt;); further opportunities are announced during the year.&lt;/p&gt;

  &lt;h3&gt;Enactus&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Social enterprise&lt;/b&gt;: a business that uses market tools to pursue primarily a social or environmental objective, reinvesting profits in its mission. Enactus builds ideas and networks around this concept.&lt;/div&gt;
  &lt;p&gt;&quot;&lt;i&gt;Real projects. New connections. A team to grow with.&lt;/i&gt;&quot; Conditions: &lt;b&gt;no CFU&lt;/b&gt; (no credits), participation &lt;b&gt;free of charge&lt;/b&gt;, deadline &lt;b&gt;23 October&lt;/b&gt;. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Enactus is an international non-profit organisation of university teams that develop projects related to the UN Sustainable Development Goals and compete in national competitions and a &quot;World Cup&quot; (&lt;a href=&quot;https://www.polimi.it/en/students/associazioni-degli-studenti/enactus-polimi&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;e.g. Enactus Polimi&lt;/a&gt;).&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;Quick comparison: CREO-LAB awards 6 ECTS and is taught in class in the second semester; Enactus awards no credits but is an ongoing extracurricular association experience. Both work on entrepreneurial ideas, Enactus with an explicitly social focus.&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is required for the Career Management Skills badge?&lt;/summary&gt;&lt;p&gt;At least two &quot;Waiting for Career Day&quot; webinars plus attendance at the Career Day on 26 November 2026.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does Enactus award academic credits?&lt;/summary&gt;&lt;p&gt;No (&quot;No CFU&quot;); participation is free of charge.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How does a social enterprise differ from a traditional business?&lt;/summary&gt;&lt;p&gt;Its main purpose is social or environmental impact; profit is a means and is reinvested in the mission.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 09 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Towards graduation&lt;/div&gt;&lt;h2&gt;Suggestions for thesis&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 29–31&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Slide 29 offers four pieces of advice. Behind each one lies a methodological idea:&lt;/p&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;1 · At the right time&lt;/h4&gt;&lt;p&gt;Find a &lt;i&gt;thesis supervisor&lt;/i&gt; &lt;b&gt;at adequate timing&lt;/b&gt;: not at the last minute, because research and writing take months and faculty supervise several theses.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;2 · With a project&lt;/h4&gt;&lt;p&gt;When you contact the professor, &lt;b&gt;prepare and present a thesis project&lt;/b&gt;: topic, research question, provisional title &quot;and so on&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;3 · No generic e-mails&lt;/h4&gt;&lt;p&gt;Do &lt;b&gt;not&lt;/b&gt; send &quot;general&quot; e-mails to all faculty asking whether they are available: choose the person who teaches the subject closest to your topic.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;4 · Rules and deadlines&lt;/h4&gt;&lt;p&gt;Read the guidelines and check the graduation deadlines at &lt;a href=&quot;https://ls-ags.unibg.it/en/how/how-graduate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/how/how-graduate&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Research question&lt;/b&gt;: the precise question the thesis answers. It must be delimited (one phenomenon, one context, one period) and answerable with the data or methods available. It is the core of the &lt;i&gt;thesis project&lt;/i&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;✗ Generic approach&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;✓ Project-based approach&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;i&gt;&quot;Dear Professor, I am in my second year and would like to write my thesis with you. Are you available?&quot;&lt;/i&gt;, sent in copy to many faculty members.&lt;/p&gt;
      &lt;p class=&quot;ko&quot;&gt;Why it does not work: no topic, no question, no link to the professor&#x27;s course. It is exactly what the slide asks you to avoid.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;An e-mail to a single professor, attaching a one-page project outline:&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Topic&lt;/b&gt;: sustainability reporting in SMEs (illustrative example).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Research question&lt;/b&gt;: &quot;To what extent do Lombard manufacturing SMEs publish voluntary ESG disclosures, and which characteristics does this depend on?&quot;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Provisional title&lt;/b&gt;, intended method (e.g. report analysis), initial sources, graduation timeline.&lt;/li&gt;
        &lt;li&gt;Why that professor: the link with their course.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;ok&quot;&gt;Why it works: the professor can assess feasibility and relevance in a few minutes.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Choose the area&lt;/h4&gt;&lt;p&gt;Start from the courses you enjoyed, from your internship (up to 400 hours if linked to the thesis) or from an experience such as CREO-LAB or BAUHAUS4EU.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Identify the professor&lt;/h4&gt;&lt;p&gt;The one who teaches the subject closest to your topic. One, not all of them.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Write the thesis project&lt;/h4&gt;&lt;p&gt;Topic, research question, provisional title, method, first sources.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Make contact and agree&lt;/h4&gt;&lt;p&gt;Present the project and revise it with your supervisor.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Follow deadlines and guidelines&lt;/h4&gt;&lt;p&gt;On the programme website, &quot;how to graduate&quot; section.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;The meeting closes with &lt;b&gt;Questions?&lt;/b&gt; and the contacts of the Chair and the Vice-Coordinators (slide 31).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What should a thesis project contain according to the slide?&lt;/summary&gt;&lt;p&gt;At least the topic, the research question and the title (&quot;and so on&quot;: also method, sources, timeline).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is writing to all faculty members discouraged?&lt;/summary&gt;&lt;p&gt;Because a generic request does not allow the professor to assess the project and shows that no reasoned choice of supervisor has been made.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which opportunity from section 04 is directly linked to the thesis?&lt;/summary&gt;&lt;p&gt;The internship, extendable up to 400 hours when it serves to prepare the thesis.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ REFS ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot; style=&quot;color:var(--accent)&quot;&gt;Books, programmes, standards, websites&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;border-color:var(--accent)&quot;&gt;Each card indicates whether the link comes from the slides or from the web (&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Books cited in the TRANSET events&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;A. Lusardi, &lt;i&gt;Il sapere che conta&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Mondadori, 2024. Subtitle: &lt;i&gt;L&#x27;ABC della finanza per fare le scelte giuste e prendere in mano il nostro futuro&lt;/i&gt; [The ABC of finance for making the right choices and taking charge of our future]. Seven accessible chapters on saving, investment, inflation, interest rates and debt.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: a foundation in financial literacy for those who work with financial statements and financial decisions.&lt;/p&gt;&lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/lusardi_26mar2025_04.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA presentation flyer&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;F. Seghezzi, &lt;i&gt;Disintermediare stanca&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;FrancoAngeli, 2026. Subtitle: &lt;i&gt;Democrazia economica, populismo e crisi del collettivo&lt;/i&gt; [Economic democracy, populism and the crisis of the collective]. A comparison of five countries (Austria, France, Italy, Poland, Spain) on disintermediation, populism and trade unions.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the crisis of intermediate bodies, i.e. of the collective stakeholders of governance.&lt;/p&gt;&lt;a href=&quot;https://static.francoangeli.it/fa-contenuti/area_pdfdemo/1496.2_demo.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FrancoAngeli excerpt (PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;C. Bellavite Pellegrini, L. Pellegrini, A. Roncella, &lt;i&gt;Governance Under Influence&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Palgrave Macmillan, 2026 (Palgrave Studies in Impact Finance). How political connections influence corporate governance and the ESG transition in Italy, France, Germany and the United Kingdom.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the book closest to the core of AGS, namely governance and sustainability.&lt;/p&gt;&lt;a href=&quot;https://aisberg.unibg.it/handle/10446/311807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record in the UniBg institutional repository&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Programmes, projects and standards&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;ECTS Users&#x27; Guide 2015&lt;/h4&gt;&lt;p&gt;European guide to the credit system: 60 ECTS per year, 25–30 hours per credit, a workload that includes every learning activity.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains what the credits in your study plan measure.&lt;/p&gt;&lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow-up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (Council of Europe copy, PDF)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/European_Credit_Transfer_and_Accumulation_System&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;European Universities Initiative&lt;/h4&gt;&lt;p&gt;Erasmus+ initiative funding European university alliances; in July 2026, 20 new alliances were selected, bringing the total to 65.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the framework of BAUHAUS4EU.&lt;/p&gt;&lt;a href=&quot;https://education.ec.europa.eu/whats-new/news/20-european-universities-alliances-selected-for-erasmus-funding&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;BAUHAUS4EU&lt;/h4&gt;&lt;p&gt;An alliance of 10 universities and 67 associated partners, co-funded by Erasmus+; UniBg is a founding member.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: Living Labs, BIPs, COILs and hackathons all run through it.&lt;/p&gt;&lt;a href=&quot;https://dipsa.unibg.it/en/international/partners-and-networks/bauhaus4eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, BAUHAUS4EU&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Erasmus+ Blended Intensive Programmes&lt;/h4&gt;&lt;p&gt;Blended format: virtual component + physical phase of 5–30 days, minimum 3 ECTS, at least three institutions from three countries.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: 8 of the 14 European Bauhaus Courses are BIPs.&lt;/p&gt;&lt;a href=&quot;https://www.hu-berlin.de/en/university/international/going-abroad/erasmus/erasmus-europe/blended-intensive-programmes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HU Berlin, BIP&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;COIL · Collaborative Online International Learning&lt;/h4&gt;&lt;p&gt;A virtual exchange model developed at SUNY: at least two instructors from different countries co-design an online module (at least 5 weeks recommended).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the format of &lt;i&gt;Climate Adaptation&lt;/i&gt; in the catalogue.&lt;/p&gt;&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University at Albany&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Erasmus+ Traineeship&lt;/h4&gt;&lt;p&gt;Traineeships abroad of 2–12 months per study cycle, also open to recent graduates within one year of graduation (rules vary by university).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it combines mobility and internship (sect. 04).&lt;/p&gt;&lt;a href=&quot;https://www.unic.ac.cy/erasmus/traineeship-for-students/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Example of regulations (University of Nicosia)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;MIUR–CNDCEC framework agreement&lt;/h4&gt;&lt;p&gt;Conditions for starting the professional traineeship early during the Master&#x27;s degree and obtaining exemption from the first paper of the State qualifying examination.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it underpins the UniBg–ODCEC Bergamo agreement on slide 9.&lt;/p&gt;&lt;a href=&quot;https://www.unito.it/sites/default/files/convenzione_quadro_comm_esp_cont.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (UniTo copy, PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Open Badges (1EdTech)&lt;/h4&gt;&lt;p&gt;An open standard for digital credentials; since version 3.0 (2024) badges are signed Verifiable Credentials.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the value of the CREO-LAB, TRANSET and Career badges.&lt;/p&gt;&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1EdTech&lt;/a&gt; · &lt;a href=&quot;https://openbadges.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openbadges.org&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Departments of Excellence 2023-2027&lt;/h4&gt;&lt;p&gt;MUR programme (Law 232/2016) funding 180 departments of state universities for five years.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: TRANSET originates from it.&lt;/p&gt;&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MUR&lt;/a&gt; · &lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/transet_15mag2025_05.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, TRANSET&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;MEN4DEM&lt;/h4&gt;&lt;p&gt;Horizon Europe project &lt;i&gt;Masculinities for the Future of European Democracy&lt;/i&gt;: how anti-democratic masculinities spread and affect democracy.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the research behind the October TRANSET event.&lt;/p&gt;&lt;a href=&quot;https://cordis.europa.eu/project/id/101177356&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CORDIS&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;DMO · UN Tourism&lt;/h4&gt;&lt;p&gt;The role of Destination Management Organizations: from promotion to planning, coordination and stakeholder governance.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the topic of the BAUHAUS4EU student-led course.&lt;/p&gt;&lt;a href=&quot;https://www.untourism.int/archive/competitiveness-market-intelligence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Tourism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;CREO · UniBg&lt;/h4&gt;&lt;p&gt;The university&#x27;s entrepreneurship education pathway; four 6-CFU CREO-LABs, which can be included as elective or extra examinations.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: details and calls for the lab (sect. 06).&lt;/p&gt;&lt;a href=&quot;https://www.unibg.it/studiare/corsi/altre-opportunita-formazione/creo-progetto-delluniversita-studi-bergamo-formazione&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Double Degree AGS – Dundee&lt;/h4&gt;&lt;p&gt;Second year at Dundee (MSc Accounting &amp;amp; Finance), double degree, limited places.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: official conditions and calls.&lt;/p&gt;&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;--tone:var(--accent);--tone-bg:var(--accent-bg)&quot;&gt;from the slides&lt;/span&gt;&lt;h4&gt;UniBg portals&lt;/h4&gt;&lt;p&gt;&lt;a href=&quot;https://en.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;en.unibg.it&lt;/a&gt; · &lt;a href=&quot;https://www.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;www.unibg.it&lt;/a&gt; · &lt;a href=&quot;https://dipsa.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dipsa.unibg.it/en&lt;/a&gt; · &lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
