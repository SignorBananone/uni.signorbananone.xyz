*{box-sizing:border-box}

&lt;!-- ============ 01 ============ --&gt;
&lt;section class=&quot;part tone-slate&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;The programme, the people, the channels&lt;/div&gt;&lt;h2&gt;Getting oriented: who, where, how much&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 1–3 and 31&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;The Master&#x27;s degree programme in &lt;b&gt;Accounting, Governance and Sustainability&lt;/b&gt; belongs to the Department of Management (in Italian &lt;i&gt;Dipartimento di Scienze Aziendali&lt;/i&gt;, abbreviated DipSA) of the University of Bergamo. The second-year kick-off is meant to recall deadlines and opportunities, not to introduce a subject.&lt;/p&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;The programme team&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Prof. Silvana Signori&lt;/b&gt;: Chair and &lt;i&gt;Master Degree Coordinator&lt;/i&gt;, i.e. the faculty member responsible for the degree programme.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Prof. Daniele Gervasio&lt;/b&gt; and &lt;b&gt;Prof. Matteo Molinari&lt;/b&gt;: &lt;i&gt;Vice-Coordinators&lt;/i&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;Institutional contacts are on the last slide (31) and on the programme website.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Where to find information&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;University: &lt;a href=&quot;https://en.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;en.unibg.it&lt;/a&gt; and &lt;a href=&quot;https://www.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;www.unibg.it&lt;/a&gt;&lt;/li&gt;
        &lt;li&gt;Department: &lt;a href=&quot;https://dipsa.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dipsa.unibg.it/en&lt;/a&gt;&lt;/li&gt;
        &lt;li&gt;AGS programme: &lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en&lt;/a&gt;&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The concept underlying everything: the ECTS&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;ECTS&lt;/b&gt; (&lt;i&gt;European Credit Transfer and Accumulation System&lt;/i&gt;): the unit measuring the student&#x27;s &lt;b&gt;workload&lt;/b&gt;, not the number of lecture hours. In Italy it is called &lt;b&gt;CFU&lt;/b&gt; (&lt;i&gt;credito formativo universitario&lt;/i&gt;); the two terms denote the same thing. The slides use it everywhere: Italian course (3 or 6 ECTS), internship (6 ECTS), BAUHAUS4EU (3 or 6 ECTS), CREO-LAB (6 ECTS).&lt;/div&gt;
  &lt;p&gt;The slides give an implicit equivalence: &lt;b&gt;6 ECTS = 150 hours&lt;/b&gt; of internship (slide 8), i.e. &lt;b&gt;1 ECTS = 25 hours&lt;/b&gt;. The European guide indicates a range of &lt;b&gt;25–30 hours per credit&lt;/b&gt; and &lt;b&gt;60 ECTS&lt;/b&gt; for a full-time academic year &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; (&lt;a href=&quot;https://en.wikipedia.org/wiki/European_Credit_Transfer_and_Accumulation_System&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, ECTS&lt;/a&gt;; &lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow-up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide 2015&lt;/a&gt;). The workload includes lectures, independent study, projects and examinations.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calculator: how much work is an activity worth?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;ects&quot;&gt;ECTS credits&lt;/label&gt;&lt;input id=&quot;ects&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;30&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;ectsO&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;ectsR&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;ectsBar&quot; viewBox=&quot;0 0 600 40&quot; style=&quot;width:100%;height:auto;margin-top:8px&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;12&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect id=&quot;ectsFill&quot; x=&quot;0&quot; y=&quot;12&quot; width=&quot;60&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;text x=&quot;600&quot; y=&quot;9&quot; text-anchor=&quot;end&quot; style=&quot;font:500 10px var(--sans);fill:var(--muted)&quot;&gt;60 ECTS = one year&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between ECTS and CFU?&lt;/summary&gt;&lt;p&gt;None in substance: CFU is the Italian name of the credit, ECTS the name of the European system. Both measure the total workload (lectures + study + examinations), not just classroom hours.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which slide shows that 1 ECTS equals 25 hours?&lt;/summary&gt;&lt;p&gt;The internship slide: &quot;6 ECTS credits = 150 hours&quot;. 150 / 6 = 25.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Where would you look for the graduation rules: on the university, department or programme website?&lt;/summary&gt;&lt;p&gt;On the programme website, ls-ags.unibg.it (&quot;how to graduate&quot; page, slide 29): it is the most specific level.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;

&lt;!-- ============ 02 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;The first deadline&lt;/div&gt;&lt;h2&gt;Study plan: your programme of study&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 4&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Study plan&lt;/b&gt; (Italian: &lt;i&gt;piano di studi&lt;/i&gt;): the official list of the examinations you will take in order to graduate. It must be &lt;b&gt;completed and submitted&lt;/b&gt; (&quot;&lt;i&gt;you must fulfil and present your study plan&lt;/i&gt;&quot;) within the window &lt;b&gt;from 14 October to 16 November 2026&lt;/b&gt;.&lt;/div&gt;

  &lt;p&gt;The plan is built on three levels of choice, which the slides name without explaining:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Curriculum&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Alternative choices&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Free choices&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Curriculum&lt;/b&gt;: the track (specialisation) within the programme. It determines the block of core courses. For example, the &lt;i&gt;double degree&lt;/i&gt; with Dundee is linked to the &lt;i&gt;Accounting for International Business&lt;/i&gt; curriculum &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; (&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it, Double Degree&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Alternative choices&lt;/b&gt; (restricted-choice courses): the programme regulations propose a set of courses and require you to choose one or more of them. The choice is free, but &lt;i&gt;within a list&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Free choices – elective courses&lt;/b&gt; (free-choice credits, in Year II): here you can include courses from other programmes or activities such as a CREO-LAB (6 ECTS, which can be included &quot;as an elective or extra examination&quot; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;, see sect. 06) or a BAUHAUS4EU course. This is where the opportunities of sections 05–06 enter your study path.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Read the instructions&lt;/h4&gt;&lt;p&gt;At &lt;a href=&quot;https://ls-ags.unibg.it/en/course/study-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/course/study-plan&lt;/a&gt; you will find the rules and constraints for your year of enrolment.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Log in to the Sportello&lt;/h4&gt;&lt;p&gt;Indicated path: &lt;b&gt;Unibg website → Dashboard (Sportello) → Study plan (piano di studi)&lt;/b&gt;. The Sportello is the student online services portal.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Choose curriculum and alternatives&lt;/h4&gt;&lt;p&gt;Confirm your track and select the restricted-choice courses.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Add the free choices&lt;/h4&gt;&lt;p&gt;Enter the Year II electives. Check that the credits add up to the required total.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Submit by 16 November 2026&lt;/h4&gt;&lt;p&gt;A plan that is only filled in but not submitted is not enough: the slide stresses &lt;i&gt;fulfil &lt;b&gt;and&lt;/b&gt; present&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;By what date must the study plan be submitted?&lt;/summary&gt;&lt;p&gt;By 16 November 2026 (window open from 14 October).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between an alternative choice and a free choice?&lt;/summary&gt;&lt;p&gt;An alternative choice is a selection from a list set by the programme regulations; a free choice (elective) is unrestricted and may include activities such as CREO-LAB or BAUHAUS4EU courses.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the path in the portal to reach the study plan?&lt;/summary&gt;&lt;p&gt;Unibg website → Dashboard (Sportello) → Study plan (piano di studi).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 03 ============ --&gt;
&lt;section class=&quot;part tone-sage&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Language, double degree, exchanges&lt;/div&gt;&lt;h2&gt;International mobility&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 5–8&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Slide 5 lists the programme&#x27;s &lt;b&gt;opportunities&lt;/b&gt;. The first three concern the international dimension; the others are developed in the following sections.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;

      &lt;g style=&quot;font:500 12px var(--sans)&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;20&quot; y=&quot;42&quot; style=&quot;font-weight:700;fill:var(--sage)&quot;&gt;INTERNATIONAL · sect. 03&lt;/text&gt;
        &lt;text x=&quot;20&quot; y=&quot;66&quot; fill=&quot;var(--ink)&quot;&gt;Italian course (with credits)&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;86&quot; fill=&quot;var(--ink)&quot;&gt;Double Degree · Dundee&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;106&quot; fill=&quot;var(--ink)&quot;&gt;Erasmus &amp;amp; Extra UE&lt;/text&gt;
        &lt;rect x=&quot;305&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;320&quot; y=&quot;42&quot; style=&quot;font-weight:700;fill:var(--slate)&quot;&gt;WORK · sect. 04 and 08&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;66&quot; fill=&quot;var(--ink)&quot;&gt;Engagement with companies&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;86&quot; fill=&quot;var(--ink)&quot;&gt;Placement and internship&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;106&quot; fill=&quot;var(--ink)&quot;&gt;Seminars · Summer schools&lt;/text&gt;
        &lt;rect x=&quot;605&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;620&quot; y=&quot;42&quot; style=&quot;font-weight:700;fill:var(--ochre)&quot;&gt;INNOVATION · sect. 05–07&lt;/text&gt;
        &lt;text x=&quot;620&quot; y=&quot;66&quot; fill=&quot;var(--ink)&quot;&gt;BAUHAUS courses &amp;amp; initiatives&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;86&quot; fill=&quot;var(--ink)&quot;&gt;Creo-labs · Entrepreneurial Univ.&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;106&quot; fill=&quot;var(--ink)&quot;&gt;Open Badge (TRANSET, Career)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The items on slide 5 grouped into three families (a teaching grouping, not present in the slides).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Italian course&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Double Degree&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Erasmus &amp;amp; Extra UE&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;For non-native speakers of Italian the course is &lt;b&gt;strongly recommended&lt;/b&gt;.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 600 110&quot; style=&quot;width:100%;max-width:600px;height:auto&quot; role=&quot;img&quot; aria-label=&quot;3 ECTS in the first year, 6 ECTS recognised in the second&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;150&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Year I · 3 ECTS&lt;/text&gt;
        &lt;path d=&quot;M165 52 H 300&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;text x=&quot;232&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; style=&quot;font:400 11px var(--sans);fill:var(--muted)&quot;&gt;complete course + exam&lt;/text&gt;
        &lt;rect x=&quot;310&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 15px var(--sans);fill:var(--paper)&quot;&gt;Year II · full 6 ECTS exam&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;font:400 12px var(--sans);fill:var(--paper)&quot;&gt;recognised in the study plan&lt;/text&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;/svg&gt;
      &lt;p&gt;You can start as early as the first year (3 ECTS); the full 6 ECTS examination is recognised in the second year, once both the course and the exam have been completed.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Double Degree&lt;/b&gt;: an agreement between two universities whereby, by attending part of the programme at each, students obtain &lt;b&gt;two degrees&lt;/b&gt;, one from each institution.&lt;/div&gt;
      &lt;p&gt;The partner indicated in the slides is the &lt;b&gt;University of Dundee&lt;/b&gt; (Scotland). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to the UniBg pages, the second year is spent at Dundee on the &lt;i&gt;MSc in Accounting &amp;amp; Finance&lt;/i&gt;; places are few (up to 4 students in a recent call) and the track is linked to the &lt;i&gt;Accounting for International Business&lt;/i&gt; curriculum (&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;). For students already in Year II the admission call closed during Year I: check the website.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Erasmus+&lt;/b&gt;: the European Union programme for education and mobility. &lt;b&gt;Extra UE&lt;/b&gt; (non-EU) refers to the university&#x27;s bilateral agreements with universities outside the Union (the map on slide 7 shows partner institutions in North and South America, Asia, Africa and Oceania).&lt;/div&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;More than 20 English-speaking destinations&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Numerous &lt;b&gt;French-, German- and Spanish-speaking&lt;/b&gt; institutions, where examinations can often be taken in English.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;The exchange may involve study (examinations abroad, recognised in the study plan) or an internship: the latter is the &lt;i&gt;Erasmus+ Traineeship&lt;/i&gt;, explained in section 04.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;How many ECTS is the Italian course worth if you start it in Year I, and how many at the end?&lt;/summary&gt;&lt;p&gt;3 ECTS in Year I; the full 6 ECTS examination is recognised in Year II after completing both course and exam.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What do you obtain with a Double Degree?&lt;/summary&gt;&lt;p&gt;Two degrees, one from each university (here UniBg and the University of Dundee).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;At a German-speaking Erasmus institution, must you take your examinations in German?&lt;/summary&gt;&lt;p&gt;No: slide 7 specifies that at many French, German and Spanish institutions examinations can be taken in English.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 04 ============ --&gt;
&lt;section class=&quot;part tone-sage&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Professional training&lt;/div&gt;&lt;h2&gt;Internship, placement and the agreement with chartered accountants&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 8–9&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;term&quot;&gt;Internship&lt;/b&gt; (curricular internship, Italian &lt;i&gt;tirocinio curricolare&lt;/i&gt;): a period of work-based training in an organisation, included in the study plan with credits. In AGS it is &lt;b&gt;not compulsory&lt;/b&gt;, but it is an important opportunity.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;term&quot;&gt;Placement&lt;/b&gt;: the university service that supports graduates in entering the labour market (job offers, interviews, Career Day).&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;From hours to weeks: how long does an internship really last?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;ih&quot;&gt;Total hours&lt;/label&gt;&lt;input id=&quot;ih&quot; type=&quot;range&quot; min=&quot;150&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;150&quot;&gt;&lt;output id=&quot;ihO&quot;&gt;150&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;iw&quot;&gt;Hours per week&lt;/label&gt;&lt;input id=&quot;iw&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;2&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;iwO&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;height:auto&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;225&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.35&quot;/&gt;
      &lt;rect id=&quot;ihFill&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;225&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;line x1=&quot;225&quot; y1=&quot;14&quot; x2=&quot;225&quot; y2=&quot;48&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;225&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; style=&quot;font:500 11px var(--sans);fill:var(--ink)&quot;&gt;150 h = 6 ECTS&lt;/text&gt;
      &lt;text x=&quot;598&quot; y=&quot;62&quot; text-anchor=&quot;end&quot; style=&quot;font:500 11px var(--sans);fill:var(--ink)&quot;&gt;400 h (with thesis)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;12&quot; style=&quot;font:500 11px var(--sans);fill:var(--muted)&quot;&gt;0 h&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;res&quot; id=&quot;iR&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Rule from the slides: &lt;b&gt;6 ECTS = 150 hours&lt;/b&gt;, extendable &lt;b&gt;up to 400 hours&lt;/b&gt; when the internship serves to prepare the thesis. This is the natural bridge to section 09: a long internship can become the &quot;field&quot; of an empirical thesis (a company case study, an analysis of sustainability reporting, etc.).&lt;/p&gt;

  &lt;h3&gt;Erasmus+ Traineeship and internships abroad&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Erasmus+ Traineeship&lt;/b&gt;: a programme enabling &lt;b&gt;curricular&lt;/b&gt; (within the study plan) or &lt;b&gt;extracurricular&lt;/b&gt; (outside the study plan) internships in one of the programme countries, at companies or organisations active in the labour market or in the fields of education, training and youth. Participants receive a &lt;b&gt;grant&lt;/b&gt;.&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The pages of several universities indicate a typical duration of &lt;b&gt;2 to 12 months&lt;/b&gt; per study cycle, with the possibility for recent graduates to go abroad within one year of graduation if they apply while still enrolled (&lt;a href=&quot;https://www.unic.ac.cy/erasmus/traineeship-for-students/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;example: University of Nicosia&lt;/a&gt;). The exact rules are in the UniBg calls: &lt;a href=&quot;https://www.unibg.it/universita/amministrazione/concorsi-e-selezioni/bandi-tirocini-e-studio-allestero&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;calls for internships and study abroad&lt;/a&gt; (link from slide 8).&lt;/p&gt;

  &lt;h3&gt;National opportunities: the agreement with the Order&lt;/h3&gt;
  &lt;p&gt;Slide 9 states that the programme is consistent with the agreement between the &lt;b&gt;University of Bergamo&lt;/b&gt; and the &lt;b&gt;Order of Chartered Accountants and Accounting Experts of Bergamo&lt;/b&gt; (&lt;i&gt;Ordine dei Dottori Commercialisti ed Esperti Contabili&lt;/i&gt;, ODCEC), provided for by the framework agreement between the &lt;b&gt;Ministry of Education, University and Research&lt;/b&gt; (now MUR) and the &lt;b&gt;National Council of Chartered Accountants and Accounting Experts&lt;/b&gt; (CNDCEC). The slide does not explain its purpose: here is the diagram.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Chain of agreements from the national to the local level down to the student&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g style=&quot;font:500 13px var(--sans)&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;MIUR / MUR&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;ministry&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;140&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;CNDCEC&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;national council&lt;/text&gt;
        &lt;rect x=&quot;290&quot; y=&quot;80&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;Framework agreement&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;national level&lt;/text&gt;
        &lt;rect x=&quot;540&quot; y=&quot;80&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;UniBg + ODCEC BG&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;local agreement&lt;/text&gt;
        &lt;rect x=&quot;770&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;830&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; style=&quot;font-weight:700&quot;&gt;AGS student&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M220 48 Q 270 60 290 100&quot; stroke=&quot;var(--slate)&quot; fill=&quot;none&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M220 168 Q 270 156 290 118&quot; stroke=&quot;var(--slate)&quot; fill=&quot;none&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;path d=&quot;M470 108 H 536&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;path d=&quot;M720 108 H 766&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;text x=&quot;580&quot; y=&quot;170&quot; style=&quot;font:500 12px var(--sans);fill:var(--sage)&quot;&gt;→ early professional traineeship during the Master&#x27;s&lt;/text&gt;
      &lt;text x=&quot;580&quot; y=&quot;190&quot; style=&quot;font:500 12px var(--sans);fill:var(--sage)&quot;&gt;→ exemption from the first written State exam paper&lt;/text&gt;
      &lt;text x=&quot;580&quot; y=&quot;214&quot; style=&quot;font:400 10px var(--sans);fill:var(--muted)&quot;&gt;(effects: external source, see below)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;From the national to the local level. The actors come from slide 9; the effects are explained by the external sources.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The MIUR–CNDCEC framework agreements (the first signed in 2014) set the minimum conditions under which students can complete &lt;b&gt;part of the traineeship required for professional qualification&lt;/b&gt; (normally 6 months) during the final year of the Master&#x27;s degree and obtain &lt;b&gt;exemption from the first written paper&lt;/b&gt; of the State qualifying examination for Section A of the professional register, provided the programme is covered by the agreement with the local Order (&lt;a href=&quot;https://www.unito.it/sites/default/files/convenzione_quadro_comm_esp_cont.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of the framework agreement, UniTo copy&lt;/a&gt;; &lt;a href=&quot;https://www.unibocconi.it/sites/default/files/media/attachments/Regolamento_interno_UB__2016.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;example of implementing regulations&lt;/a&gt;). Current requirements and deadlines should be checked with UniBg and with ODCEC Bergamo.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Is the internship compulsory in AGS? How much is it worth?&lt;/summary&gt;&lt;p&gt;No, it is not compulsory. It is worth 6 ECTS = 150 hours, extendable up to 400 hours if linked to the thesis.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Curricular or extracurricular: what changes in the Erasmus+ Traineeship?&lt;/summary&gt;&lt;p&gt;A curricular traineeship is included in the study plan and awards credits; an extracurricular one takes place when the activity is not part of the plan. In both cases participants receive a grant.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why should an AGS student care about the agreement with ODCEC?&lt;/summary&gt;&lt;p&gt;Because it links the programme to the chartered accountancy profession: under the MIUR–CNDCEC agreements (external source) it allows students to start part of the professional traineeship early and to obtain exemption from the first written paper of the State qualifying examination.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 05 ============ --&gt;
&lt;section class=&quot;part tone-ochre&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Innovative Interdisciplinary Learning Opportunities&lt;/div&gt;&lt;h2&gt;BAUHAUS4EU: the European university alliance&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slides 10–16&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;European University Alliance&lt;/b&gt;: a stable network of universities from different countries, co-funded by the EU (&quot;&lt;i&gt;Co-funded by the European Union&lt;/i&gt;&quot;), which shares courses, mobility and projects as if it were a single European campus. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; It is part of the Erasmus+ &lt;i&gt;European Universities Initiative&lt;/i&gt;, which counted 65 alliances as of July 2026 (&lt;a href=&quot;https://education.ec.europa.eu/whats-new/news/20-european-universities-alliances-selected-for-erasmus-funding&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission&lt;/a&gt;).&lt;/div&gt;
  &lt;p&gt;&quot;&lt;i&gt;As a student at UniBg, you are part of the BAUHAUS4EU European University Alliance&lt;/i&gt;&quot;: membership of the alliance is automatic.&lt;/p&gt;

  &lt;div class=&quot;cols&quot; style=&quot;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))&quot;&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;10&lt;/div&gt;&lt;span&gt;partner universities (10 regions, 9 countries)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;67&lt;/div&gt;&lt;span&gt;associated regional partners&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;124,000&lt;/div&gt;&lt;span&gt;students&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;10,000&lt;/div&gt;&lt;span&gt;staff&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;The 10 universities of the alliance (from the map, slide 12)&lt;/summary&gt;&lt;div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Region · Country&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Università degli studi di Bergamo&lt;/td&gt;&lt;td&gt;Lombardy · Italy&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Bauhaus-Universität Weimar&lt;/td&gt;&lt;td&gt;Thuringia · Germany&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Blekinge Tekniska Högskola&lt;/td&gt;&lt;td&gt;Blekinge · Sweden&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Université de Picardie Jules Verne&lt;/td&gt;&lt;td&gt;Hauts-de-France · France&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Université Lumière Lyon 2&lt;/td&gt;&lt;td&gt;Auvergne-Rhône-Alpes · France&lt;/td&gt;&lt;/tr&gt;

    &lt;tr&gt;&lt;td&gt;University of Architecture, Civil Engineering and Geodesy&lt;/td&gt;&lt;td&gt;Yugozapaden · Bulgaria&lt;/td&gt;&lt;/tr&gt;

    &lt;tr&gt;&lt;td&gt;University of Macedonia&lt;/td&gt;&lt;td&gt;Kentriki Makedonia · Greece&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;The common method: challenge-based learning&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Challenge-based learning&lt;/b&gt;: learning by working on a real problem posed by external actors (municipalities, companies, communities), in interdisciplinary groups, with a &lt;b&gt;project work&lt;/b&gt; (PW, project report) as the final output. All BAUHAUS4EU formats require &lt;b&gt;B2&lt;/b&gt; English (upper-intermediate level of the Common European Framework of Reference) and &lt;b&gt;75% attendance&lt;/b&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Regional Living Lab&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Student-led course&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;European Bauhaus Course&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;h4&gt;Help imagine the future of UniBg&#x27;s new campus&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;The City, the University, and the Common Good: Regenerating the Montelungo-Colleoni Complex&lt;/i&gt;. A &lt;b&gt;Living Lab&lt;/b&gt; is a &quot;living&quot; laboratory: research and teaching take place in the real territory, together with those who live in it and govern it. Here the case is the urban regeneration of the Montelungo-Colleoni complex, in the centre of Bergamo, earmarked for the new campus.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;More than 20 faculty members from six departments.&lt;/li&gt;
        &lt;li&gt;Stakeholders: Municipality of Bergamo, Lombardy Region, Near sgr (the real-estate developer).&lt;/li&gt;
        &lt;li&gt;Topics: urban planning, territorial mapping, architecture, archaeology, collective memory, entrepreneurship, commercial and public functions, &lt;i&gt;photovoice&lt;/i&gt; (a participatory method in which participants document a place through photographs and discuss them).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;6 ECTS per semester&lt;/b&gt; · two semesters (one or both) · 36 contact hours · applications by &lt;b&gt;9 October&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;h4&gt;A course shaped by students, for students&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;Rethinking Destinations: Sustainable Governance, Territorial Resilience, and the Future of Place Management&lt;/i&gt;.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;DMO&lt;/b&gt; (&lt;i&gt;Destination Management Organization&lt;/i&gt;): the body that coordinates the management of a tourist destination. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to UN Tourism, the role of DMOs has shifted from marketing alone to strategic planning and stakeholder coordination (&lt;a href=&quot;https://www.untourism.int/archive/competitiveness-market-intelligence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Tourism&lt;/a&gt;).&lt;/div&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Real challenges: &lt;i&gt;overtourism&lt;/i&gt; (excessive tourist pressure), tensions with the local community, &lt;i&gt;territorial resilience&lt;/i&gt; (the capacity of a territory to absorb shocks and adapt).&lt;/li&gt;
        &lt;li&gt;Methods: group work, role-play, Living Lab.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;3 ECTS&lt;/b&gt; · one semester · 18 contact hours · applications by &lt;b&gt;9 October&lt;/b&gt;. For AGS the link is with &lt;i&gt;governance&lt;/i&gt;: who decides, and how, when many interests are at stake.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;h4&gt;A European classroom for real-world challenges&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;Migration, Transnational Landscapes, and Criminal Law&lt;/i&gt;: migration as a complex phenomenon (legal, spatial, social, humanitarian, geopolitical); migration governance, human rights, vulnerability, criminalisation, security, access to protection.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;6 ECTS per BIP&lt;/b&gt; · one semester · online and in person · &lt;b&gt;coming soon, second semester&lt;/b&gt;. Bergamo is the &lt;i&gt;host institution&lt;/i&gt;.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;BIP&lt;/b&gt; (&lt;i&gt;Blended Intensive Programme&lt;/i&gt;): an Erasmus+ format combining a virtual component with a short physical mobility. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The in-person phase lasts 5–30 days and the programme must be worth at least 3 ECTS (&lt;a href=&quot;https://www.hu-berlin.de/en/university/international/going-abroad/erasmus/erasmus-europe/blended-intensive-programmes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HU Berlin, BIP&lt;/a&gt;).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The catalogue: 14 European Bauhaus Courses&lt;/h3&gt;

    &lt;svg viewBox=&quot;0 0 300 220&quot; style=&quot;width:100%;max-width:320px;height:auto&quot; role=&quot;img&quot; aria-label=&quot;Doughnut chart: 8 BIP, 1 COIL, 5 Hackathon&quot;&gt;
      &lt;g transform=&quot;rotate(-90 110 110)&quot; fill=&quot;none&quot; stroke-width=&quot;34&quot;&gt;
        &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;60&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;215.4 377&quot;/&gt;
        &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;60&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;26.9 377&quot; stroke-dashoffset=&quot;-215.4&quot;/&gt;

      &lt;g style=&quot;font:500 13px var(--sans);fill:var(--ink)&quot;&gt;&lt;rect x=&quot;200&quot; y=&quot;70&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;81&quot;&gt;8 BIP&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;111&quot;&gt;1 COIL&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;130&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;141&quot;&gt;5 Hackathon&lt;/text&gt;&lt;/g&gt;

    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;8 BIP + 1 COIL + 5 Hackathon = 14 EBC&lt;/b&gt; (&lt;i&gt;European Bauhaus Courses&lt;/i&gt;), plus staff weeks and lectures/seminars.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;COIL&lt;/b&gt; (&lt;i&gt;Collaborative Online International Learning&lt;/i&gt;): classes from different countries work together online on a joint project. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The model originated at the State University of New York (&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UAlbany, About COIL&lt;/a&gt;). In the catalogue: &lt;i&gt;Climate Adaptation&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Hackathon&lt;/b&gt;: a short, intensive event in which teams develop solutions to a challenge (e.g. &lt;i&gt;B4EU MoveSmart&lt;/i&gt;, &lt;i&gt;Career Lab&lt;/i&gt;, &lt;i&gt;Climate Fresk&lt;/i&gt;).&lt;/p&gt;

  &lt;/div&gt;

    &lt;li&gt;&lt;i&gt;Facilitating Systemic Change for Sustainable Regions&lt;/i&gt; · &lt;i&gt;Foundations for Strategic Sustainable Development&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;Education for Inclusive Regions and Sustainable Societies&lt;/i&gt; · &lt;i&gt;Green and Inclusive Campus&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;AI Agents for Resilient Regions&lt;/i&gt; · &lt;i&gt;Climate Adaptation&lt;/i&gt; (COIL) · &lt;i&gt;Too much waste? Let&#x27;s turn it into ideas for change&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;Needfinding and Invention for Organizational Change&lt;/i&gt;&lt;/li&gt;
  &lt;/ul&gt;&lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;The map on slide 16 distinguishes Bergamo as a &lt;b&gt;host institution&lt;/b&gt; (courses hosted, in red) and as a &lt;b&gt;sending institution&lt;/b&gt; (sending students to other partners&#x27; courses, in blue). The legend uses &lt;b&gt;NUTS 2&lt;/b&gt; regions, the European statistical classification of regions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Do you need to register to be part of BAUHAUS4EU?&lt;/summary&gt;&lt;p&gt;No: every UniBg student is a member. For individual courses, however, you must apply (deadlines given on the slides).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the maximum number of ECTS you can earn from the Regional Living Lab?&lt;/summary&gt;&lt;p&gt;12: 6 ECTS per semester, attending both semesters.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between a BIP and a COIL?&lt;/summary&gt;&lt;p&gt;A BIP combines virtual activities with a short physical mobility; a COIL is entirely online, with classes from different countries collaborating.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
