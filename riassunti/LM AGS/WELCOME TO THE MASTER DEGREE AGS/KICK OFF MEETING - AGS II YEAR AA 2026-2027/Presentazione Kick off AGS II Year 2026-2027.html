&lt;!-- ============ 01 ============ --&gt;
&lt;section class=&quot;part tone-slate&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Il corso, le persone, i canali&lt;/div&gt;&lt;h2&gt;Orientarsi: chi, dove, quanto&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 1–3 e 31&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Il corso di laurea magistrale &lt;b&gt;Accounting, Governance and Sustainability&lt;/b&gt; appartiene al Dipartimento di Scienze Aziendali (in inglese &lt;i&gt;Department of Management&lt;/i&gt;, sigla DipSA) dell&#x27;Università di Bergamo. Il kick-off del secondo anno serve a ricordare scadenze e opportunità, non a introdurre una materia.&lt;/p&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Il team del corso&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Prof.ssa Silvana Signori&lt;/b&gt;: presidente e &lt;i&gt;Master Degree Coordinator&lt;/i&gt;, cioè la docente responsabile del corso di laurea.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Prof. Daniele Gervasio&lt;/b&gt; e &lt;b&gt;Prof. Matteo Molinari&lt;/b&gt;: &lt;i&gt;Vice-Coordinators&lt;/i&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;I contatti istituzionali sono nell&#x27;ultima slide (31) e sul sito del corso.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Dove si trovano le informazioni&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Ateneo: &lt;a href=&quot;https://en.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;en.unibg.it&lt;/a&gt; e &lt;a href=&quot;https://www.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;www.unibg.it&lt;/a&gt;&lt;/li&gt;
        &lt;li&gt;Dipartimento: &lt;a href=&quot;https://dipsa.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dipsa.unibg.it/en&lt;/a&gt;&lt;/li&gt;
        &lt;li&gt;Corso AGS: &lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en&lt;/a&gt;&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;I tre livelli di informazione: ateneo, dipartimento, corso&quot;&gt;

      &lt;text x=&quot;30&quot; y=&quot;46&quot; style=&quot;font:600 13px var(--sans);fill:var(--slate)&quot;&gt;ATENEO · unibg.it&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;66&quot; style=&quot;font:400 12px var(--sans);fill:var(--ink)&quot;&gt;bandi, Erasmus, tirocini all&#x27;estero, Career Day, Sportello&lt;/text&gt;

    &lt;figcaption&gt;Le informazioni sono annidate: il sito del corso è il più specifico (piano di studi, tesi, laurea), quello d&#x27;ateneo il più generale (bandi e servizi comuni). Schema ricostruito dai link citati nelle slide.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Il concetto che regge tutto: l&#x27;ECTS&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;ECTS&lt;/b&gt; (&lt;i&gt;European Credit Transfer and Accumulation System&lt;/i&gt;): unità di misura del &lt;b&gt;carico di lavoro&lt;/b&gt; dello studente, non delle ore di lezione. In Italia si chiama &lt;b&gt;CFU&lt;/b&gt; (credito formativo universitario); i due termini indicano la stessa cosa. Le slide lo usano ovunque: corso d&#x27;italiano (3 o 6 ECTS), tirocinio (6 ECTS), BAUHAUS4EU (3 o 6 ECTS), CREO-LAB (6 ECTS).&lt;/div&gt;
  &lt;p&gt;Le slide danno un&#x27;equivalenza implicita: &lt;b&gt;6 ECTS = 150 ore&lt;/b&gt; di tirocinio (slide 8), cioè &lt;b&gt;1 ECTS = 25 ore&lt;/b&gt;. La guida europea indica una forbice di &lt;b&gt;25–30 ore per credito&lt;/b&gt; e &lt;b&gt;60 ECTS&lt;/b&gt; per un anno a tempo pieno &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; (&lt;a href=&quot;https://en.wikipedia.org/wiki/European_Credit_Transfer_and_Accumulation_System&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, ECTS&lt;/a&gt;; &lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow-up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECTS Users&#x27; Guide 2015&lt;/a&gt;). Il carico comprende lezioni, studio individuale, progetti ed esami.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calcolatore: quanto lavoro vale un&#x27;attività?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;ects&quot;&gt;Crediti ECTS&lt;/label&gt;&lt;input id=&quot;ects&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;30&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;ectsO&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;ectsR&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;ectsBar&quot; viewBox=&quot;0 0 600 40&quot; style=&quot;width:100%;height:auto;margin-top:8px&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;12&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect id=&quot;ectsFill&quot; x=&quot;0&quot; y=&quot;12&quot; width=&quot;60&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;text x=&quot;600&quot; y=&quot;9&quot; text-anchor=&quot;end&quot; style=&quot;font:500 10px var(--sans);fill:var(--muted)&quot;&gt;60 ECTS = un anno&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra ECTS e CFU?&lt;/summary&gt;&lt;p&gt;Nessuna nella sostanza: CFU è il nome italiano del credito, ECTS quello del sistema europeo. Entrambi misurano il carico di lavoro complessivo (lezioni + studio + esami), non le sole ore in aula.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Da quale slide si ricava che 1 ECTS vale 25 ore?&lt;/summary&gt;&lt;p&gt;Dalla slide sul tirocinio: &quot;6 ECTS credits = 150 hours&quot;. 150 / 6 = 25.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dove cercheresti le regole per laurearti: sul sito d&#x27;ateneo, di dipartimento o del corso?&lt;/summary&gt;&lt;p&gt;Sul sito del corso, ls-ags.unibg.it (pagina &quot;how to graduate&quot;, slide 29): è il livello più specifico.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 02 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;La prima scadenza&lt;/div&gt;&lt;h2&gt;Study plan: il piano di studi&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 4&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Study plan&lt;/b&gt; (piano di studi): l&#x27;elenco ufficiale degli esami che sosterrai per laurearti. Va &lt;b&gt;compilato e presentato&lt;/b&gt; (&quot;&lt;i&gt;you must fulfil and present your study plan&lt;/i&gt;&quot;) nella finestra &lt;b&gt;dal 14 ottobre al 16 novembre 2026&lt;/b&gt;.&lt;/div&gt;

  &lt;p&gt;Il piano si costruisce su tre livelli di scelta, che le slide nominano senza spiegare:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Curriculum&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Alternative choices&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Free choices&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Curriculum&lt;/b&gt;: il percorso (indirizzo) interno al corso. Determina il blocco di esami caratterizzanti. Per esempio il &lt;i&gt;double degree&lt;/i&gt; con Dundee è collegato al curriculum &lt;i&gt;Accounting for International Business&lt;/i&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; (&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it, Double Degree&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Alternative choices&lt;/b&gt; (esami a scelta vincolata): il regolamento propone una rosa di insegnamenti e chiede di sceglierne uno o più. La scelta è libera, ma &lt;i&gt;dentro una lista&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Free choices – elective courses&lt;/b&gt; (crediti a libera scelta, al II anno): qui puoi inserire insegnamenti di altri corsi o attività come un CREO-LAB (6 ECTS, inseribile &quot;come esame a scelta o extra&quot; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;, vedi sez. 06) o un corso BAUHAUS4EU. È il punto in cui le opportunità delle sezioni 05–06 entrano nel tuo percorso.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Leggi le istruzioni&lt;/h4&gt;&lt;p&gt;Su &lt;a href=&quot;https://ls-ags.unibg.it/en/course/study-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/course/study-plan&lt;/a&gt; trovi regole e vincoli del tuo anno di immatricolazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Entra nello Sportello&lt;/h4&gt;&lt;p&gt;Percorso indicato: &lt;b&gt;sito Unibg → Dashboard (Sportello) → Study plan (piano di studi)&lt;/b&gt;. Lo Sportello è il portale dei servizi online dello studente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Scegli curriculum e alternative&lt;/h4&gt;&lt;p&gt;Conferma l&#x27;indirizzo e seleziona gli esami a scelta vincolata.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Aggiungi le free choices&lt;/h4&gt;&lt;p&gt;Inserisci gli elective del II anno. Controlla che i crediti tornino al totale richiesto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Presenta entro il 16 novembre 2026&lt;/h4&gt;&lt;p&gt;Un piano solo compilato e non presentato non basta: la slide insiste su &lt;i&gt;fulfil &lt;b&gt;and&lt;/b&gt; present&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

      &lt;text x=&quot;900&quot; y=&quot;112&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;2° semestre → CREO-LAB, European Bauhaus Course&lt;/text&gt;
      &lt;g id=&quot;today&quot; style=&quot;display:none&quot;&gt;&lt;line x1=&quot;0&quot; y1=&quot;80&quot; x2=&quot;0&quot; y2=&quot;180&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;rect x=&quot;-26&quot; y=&quot;78&quot; width=&quot;52&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;0&quot; y=&quot;91&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-weight:600&quot;&gt;oggi&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption id=&quot;countdown&quot;&gt;Date tratte dalle slide 4, 13, 14, 26, 27, 28. Il marcatore &quot;oggi&quot; usa la data del tuo dispositivo.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Entro quale data va presentato il piano di studi?&lt;/summary&gt;&lt;p&gt;Entro il 16 novembre 2026 (finestra aperta dal 14 ottobre).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra alternative choice e free choice?&lt;/summary&gt;&lt;p&gt;L&#x27;alternative choice è una scelta dentro una lista fissata dal regolamento; la free choice (elective) è a libera scelta e può includere attività come CREO-LAB o corsi BAUHAUS4EU.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il percorso nel portale per arrivare al piano?&lt;/summary&gt;&lt;p&gt;Sito Unibg → Dashboard (Sportello) → Study plan (piano di studi).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 03 ============ --&gt;
&lt;section class=&quot;part tone-sage&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Lingua, doppio titolo, scambi&lt;/div&gt;&lt;h2&gt;Mobilità internazionale&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 5–8&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;La slide 5 elenca le &lt;b&gt;opportunities&lt;/b&gt; del corso. Le prime tre riguardano la dimensione internazionale; le altre sono sviluppate nelle sezioni successive.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Le nove opportunità elencate nella slide 5, raggruppate per sezione&quot;&gt;
      &lt;g style=&quot;font:500 12px var(--sans)&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;20&quot; y=&quot;42&quot; style=&quot;font-weight:700;fill:var(--sage)&quot;&gt;INTERNAZIONALE · sez. 03&lt;/text&gt;

        &lt;rect x=&quot;305&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;

        &lt;text x=&quot;320&quot; y=&quot;66&quot; fill=&quot;var(--ink)&quot;&gt;Engagement with companies&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;86&quot; fill=&quot;var(--ink)&quot;&gt;Placement and internship&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;106&quot; fill=&quot;var(--ink)&quot;&gt;Seminars · Summer schools&lt;/text&gt;
        &lt;rect x=&quot;605&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;110&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;620&quot; y=&quot;42&quot; style=&quot;font-weight:700;fill:var(--ochre)&quot;&gt;INNOVAZIONE · sez. 05–07&lt;/text&gt;
        &lt;text x=&quot;620&quot; y=&quot;66&quot; fill=&quot;var(--ink)&quot;&gt;BAUHAUS courses &amp;amp; initiatives&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;86&quot; fill=&quot;var(--ink)&quot;&gt;Creo-labs · Entrepreneurial Univ.&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;106&quot; fill=&quot;var(--ink)&quot;&gt;Open Badge (TRANSET, Career)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le voci della slide 5 raggruppate in tre famiglie (raggruppamento didattico, non presente nelle slide).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Corso d&#x27;italiano&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Double Degree&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Erasmus &amp;amp; Extra UE&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Per chi non è di madrelingua italiana il corso è &lt;b&gt;fortemente consigliato&lt;/b&gt;.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 600 110&quot; style=&quot;width:100%;max-width:600px;height:auto&quot; role=&quot;img&quot; aria-label=&quot;3 ECTS al primo anno, 6 ECTS riconosciuti al secondo&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;150&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;I anno · 3 ECTS&lt;/text&gt;
        &lt;path d=&quot;M165 52 H 300&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;text x=&quot;232&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; style=&quot;font:400 11px var(--sans);fill:var(--muted)&quot;&gt;completi corso + esame&lt;/text&gt;
        &lt;rect x=&quot;310&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 15px var(--sans);fill:var(--paper)&quot;&gt;II anno · esame pieno 6 ECTS&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;font:400 12px var(--sans);fill:var(--paper)&quot;&gt;riconosciuto nel piano&lt;/text&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;/svg&gt;
      &lt;p&gt;Si può iniziare già al primo anno (3 ECTS); l&#x27;esame completo da 6 ECTS viene riconosciuto al secondo anno, una volta finiti corso ed esame.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Double Degree&lt;/b&gt; (doppio titolo): accordo tra due università per cui, frequentando una parte del percorso in ciascuna, si ottengono &lt;b&gt;due diplomi&lt;/b&gt;, uno per ateneo.&lt;/div&gt;
      &lt;p&gt;Il partner indicato nelle slide è la &lt;b&gt;University of Dundee&lt;/b&gt; (Scozia). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo le pagine UniBg, il secondo anno si svolge a Dundee nell&#x27;&lt;i&gt;MSc in Accounting &amp;amp; Finance&lt;/i&gt;; i posti sono pochi (fino a 4 studenti in un bando recente) e il percorso è legato al curriculum &lt;i&gt;Accounting for International Business&lt;/i&gt; (&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;). Per chi è già al II anno il bando di accesso si è chiuso al I anno: conviene verificarlo sul sito.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Erasmus+&lt;/b&gt;: il programma dell&#x27;Unione europea per istruzione e mobilità. &lt;b&gt;Extra UE&lt;/b&gt; indica gli accordi bilaterali dell&#x27;ateneo con università fuori dall&#x27;Unione (la mappa della slide 7 mostra sedi in Nord e Sud America, Asia, Africa e Oceania).&lt;/div&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Più di 20 destinazioni in lingua inglese&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Numerose sedi in lingua &lt;b&gt;francese, tedesca e spagnola&lt;/b&gt;, in cui spesso si possono sostenere esami in inglese.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;Lo scambio può riguardare lo studio (esami all&#x27;estero, riconosciuti nel piano) oppure un tirocinio: è l&#x27;&lt;i&gt;Erasmus+ Traineeship&lt;/i&gt;, spiegato nella sezione 04.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quanti ECTS vale il corso d&#x27;italiano se lo inizi al I anno, e quanti a fine percorso?&lt;/summary&gt;&lt;p&gt;3 ECTS al I anno; l&#x27;esame completo da 6 ECTS è riconosciuto al II anno dopo aver completato corso ed esame.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa ottieni con un Double Degree?&lt;/summary&gt;&lt;p&gt;Due titoli, uno per ciascuna università (qui UniBg e University of Dundee).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In una sede Erasmus di lingua tedesca devi per forza sostenere esami in tedesco?&lt;/summary&gt;&lt;p&gt;No: la slide 7 precisa che in molte sedi francesi, tedesche e spagnole si possono sostenere esami in inglese.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 04 ============ --&gt;
&lt;section class=&quot;part tone-sage&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Formazione professionale&lt;/div&gt;&lt;h2&gt;Internship, placement e convenzione con i commercialisti&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 8–9&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;term&quot;&gt;Internship&lt;/b&gt; (tirocinio curricolare): periodo di lavoro formativo in un&#x27;organizzazione, inserito nel piano con crediti. Nell&#x27;AGS &lt;b&gt;non è obbligatorio&lt;/b&gt;, ma è un&#x27;occasione importante.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;term&quot;&gt;Placement&lt;/b&gt;: il servizio d&#x27;ateneo che accompagna i laureati nell&#x27;ingresso nel mondo del lavoro (offerte, colloqui, Career Day).&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Da ore a settimane: quanto dura davvero un tirocinio?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;ih&quot;&gt;Ore totali&lt;/label&gt;&lt;input id=&quot;ih&quot; type=&quot;range&quot; min=&quot;150&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;150&quot;&gt;&lt;output id=&quot;ihO&quot;&gt;150&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;iw&quot;&gt;Ore a settimana&lt;/label&gt;&lt;input id=&quot;iw&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;2&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;iwO&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;height:auto&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;225&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.35&quot;/&gt;
      &lt;rect id=&quot;ihFill&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;225&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;line x1=&quot;225&quot; y1=&quot;14&quot; x2=&quot;225&quot; y2=&quot;48&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;225&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; style=&quot;font:500 11px var(--sans);fill:var(--ink)&quot;&gt;150 h = 6 ECTS&lt;/text&gt;
      &lt;text x=&quot;598&quot; y=&quot;62&quot; text-anchor=&quot;end&quot; style=&quot;font:500 11px var(--sans);fill:var(--ink)&quot;&gt;400 h (con tesi)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;12&quot; style=&quot;font:500 11px var(--sans);fill:var(--muted)&quot;&gt;0 h&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;res&quot; id=&quot;iR&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Regola delle slide: &lt;b&gt;6 ECTS = 150 ore&lt;/b&gt;, estendibili &lt;b&gt;fino a 400 ore&lt;/b&gt; quando il tirocinio serve a preparare la tesi. È il ponte naturale verso la sezione 09: un tirocinio lungo può diventare il &quot;campo&quot; di una tesi empirica (un caso aziendale, un&#x27;analisi di reporting di sostenibilità, ecc.).&lt;/p&gt;

  &lt;h3&gt;Erasmus+ Traineeship e tirocini all&#x27;estero&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Erasmus+ Traineeship&lt;/b&gt;: programma che permette tirocini &lt;b&gt;curricolari&lt;/b&gt; (dentro il piano di studi) o &lt;b&gt;extracurricolari&lt;/b&gt; (fuori dal piano) in uno dei Paesi del programma, presso imprese o enti attivi nel mercato del lavoro o nei settori istruzione, formazione e gioventù. I partecipanti ricevono una &lt;b&gt;borsa&lt;/b&gt; (&lt;i&gt;grant&lt;/i&gt;).&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Le pagine di diversi atenei indicano una durata tipica da &lt;b&gt;2 a 12 mesi&lt;/b&gt; per ciclo di studi, con la possibilità per i neolaureati di partire entro un anno dalla laurea se si candidano mentre sono iscritti (&lt;a href=&quot;https://www.unic.ac.cy/erasmus/traineeship-for-students/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;esempio: University of Nicosia&lt;/a&gt;). Le regole precise sono nei bandi UniBg: &lt;a href=&quot;https://www.unibg.it/universita/amministrazione/concorsi-e-selezioni/bandi-tirocini-e-studio-allestero&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bandi tirocini e studio all&#x27;estero&lt;/a&gt; (link della slide 8).&lt;/p&gt;

  &lt;h3&gt;National opportunities: la convenzione con l&#x27;Ordine&lt;/h3&gt;
  &lt;p&gt;La slide 9 dice che il programma è coerente con l&#x27;accordo tra &lt;b&gt;Università di Bergamo&lt;/b&gt; e &lt;b&gt;Ordine dei Dottori Commercialisti ed Esperti Contabili di Bergamo&lt;/b&gt; (ODCEC), previsto dalla convenzione tra &lt;b&gt;Ministero dell&#x27;istruzione, università e ricerca&lt;/b&gt; (oggi MUR) e &lt;b&gt;Consiglio nazionale dei Dottori Commercialisti ed Esperti Contabili&lt;/b&gt; (CNDCEC). La slide non spiega a cosa serva: ecco lo schema.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;

      &lt;g style=&quot;font:500 13px var(--sans)&quot;&gt;

        &lt;rect x=&quot;290&quot; y=&quot;80&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;Convenzione quadro&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;livello nazionale&lt;/text&gt;

      &lt;/g&gt;
      &lt;path d=&quot;M220 48 Q 270 60 290 100&quot; stroke=&quot;var(--slate)&quot; fill=&quot;none&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M220 168 Q 270 156 290 118&quot; stroke=&quot;var(--slate)&quot; fill=&quot;none&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;path d=&quot;M470 108 H 536&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;path d=&quot;M720 108 H 766&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;

      &lt;text x=&quot;580&quot; y=&quot;190&quot; style=&quot;font:500 12px var(--sans);fill:var(--sage)&quot;&gt;→ esonero dalla prima prova scritta dell&#x27;esame di Stato&lt;/text&gt;
      &lt;text x=&quot;580&quot; y=&quot;214&quot; style=&quot;font:400 10px var(--sans);fill:var(--muted)&quot;&gt;(effetti: fonte esterna, vedi sotto)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Dal livello nazionale a quello locale. Gli attori vengono dalla slide 9; gli effetti sono spiegati dalle fonti esterne.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Le convenzioni quadro MIUR–CNDCEC (la prima firmata nel 2014) fissano le condizioni minime perché lo studente possa svolgere &lt;b&gt;parte del tirocinio per l&#x27;abilitazione&lt;/b&gt; (di norma 6 mesi) nell&#x27;ultimo anno della magistrale e ottenere l&#x27;&lt;b&gt;esonero dalla prima prova scritta&lt;/b&gt; dell&#x27;esame di Stato per la Sezione A dell&#x27;albo, se il corso è coperto dall&#x27;accordo con l&#x27;Ordine locale (&lt;a href=&quot;https://www.unito.it/sites/default/files/convenzione_quadro_comm_esp_cont.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo della convenzione quadro, copia UniTo&lt;/a&gt;; &lt;a href=&quot;https://www.unibocconi.it/sites/default/files/media/attachments/Regolamento_interno_UB__2016.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;esempio di regolamento applicativo&lt;/a&gt;). Requisiti e scadenze attuali vanno verificati con UniBg e con l&#x27;ODCEC di Bergamo.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Il tirocinio è obbligatorio nell&#x27;AGS? Quanto vale?&lt;/summary&gt;&lt;p&gt;No, non è obbligatorio. Vale 6 ECTS = 150 ore, estendibili fino a 400 ore se legato alla tesi.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Curricolare o extracurricolare: che cosa cambia nell&#x27;Erasmus+ Traineeship?&lt;/summary&gt;&lt;p&gt;Il curricolare è inserito nel piano di studi e dà crediti; l&#x27;extracurricolare si svolge quando l&#x27;attività non è nel piano. In entrambi i casi si riceve una borsa.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché a uno studente AGS interessa la convenzione con l&#x27;ODCEC?&lt;/summary&gt;&lt;p&gt;Perché collega il percorso alla professione di dottore commercialista: in base alle convenzioni MIUR–CNDCEC (fonte esterna) consente di anticipare parte del tirocinio professionale e di ottenere l&#x27;esonero dalla prima prova scritta dell&#x27;esame di Stato.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 05 ============ --&gt;
&lt;section class=&quot;part tone-ochre&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Innovative Interdisciplinary Learning Opportunities&lt;/div&gt;&lt;h2&gt;BAUHAUS4EU: l&#x27;alleanza universitaria europea&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 10–16&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;European University Alliance&lt;/b&gt;: rete stabile di atenei di Paesi diversi, cofinanziata dall&#x27;UE (&quot;&lt;i&gt;Co-funded by the European Union&lt;/i&gt;&quot;), che condivide corsi, mobilità e progetti come se fosse un campus europeo unico. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Fa parte della &lt;i&gt;European Universities Initiative&lt;/i&gt; di Erasmus+, che a luglio 2026 contava 65 alleanze (&lt;a href=&quot;https://education.ec.europa.eu/whats-new/news/20-european-universities-alliances-selected-for-erasmus-funding&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea&lt;/a&gt;).&lt;/div&gt;
  &lt;p&gt;&quot;&lt;i&gt;As a student at UniBg, you are part of the BAUHAUS4EU European University Alliance&lt;/i&gt;&quot;: l&#x27;iscrizione all&#x27;alleanza è automatica.&lt;/p&gt;

  &lt;div class=&quot;cols&quot; style=&quot;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))&quot;&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;10&lt;/div&gt;&lt;span&gt;università partner (10 regioni, 9 Paesi)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;67&lt;/div&gt;&lt;span&gt;partner regionali associati&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;124.000&lt;/div&gt;&lt;span&gt;studenti&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;big&quot;&gt;10.000&lt;/div&gt;&lt;span&gt;staff&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il metodo comune: challenge-based learning&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Challenge-based learning&lt;/b&gt;: si impara lavorando su un problema reale posto da attori esterni (comuni, imprese, comunità), in gruppi interdisciplinari, con un &lt;b&gt;project work&lt;/b&gt; (PW, elaborato di progetto) come prodotto finale. Tutti i formati BAUHAUS4EU richiedono inglese &lt;b&gt;B2&lt;/b&gt; (livello intermedio-avanzato del Quadro comune europeo) e il &lt;b&gt;75% di frequenza&lt;/b&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Regional Living Lab&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Student-led course&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;European Bauhaus Course&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;h4&gt;Help imagine the future of UniBg&#x27;s new campus&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;The City, the University, and the Common Good: Regenerating the Montelungo-Colleoni Complex&lt;/i&gt;. Un &lt;b&gt;Living Lab&lt;/b&gt; è un laboratorio &quot;vivo&quot;: ricerca e didattica avvengono nel territorio reale, insieme a chi lo abita e lo governa. Qui il caso è la rigenerazione urbana del complesso Montelungo-Colleoni, nel centro di Bergamo, destinato al nuovo campus.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Più di 20 docenti da sei dipartimenti.&lt;/li&gt;
        &lt;li&gt;Stakeholder (portatori di interesse): Comune di Bergamo, Regione Lombardia, Near sgr (lo sviluppatore immobiliare).&lt;/li&gt;
        &lt;li&gt;Temi: urbanistica, mappatura territoriale, architettura, archeologia, memoria collettiva, imprenditorialità, funzioni commerciali e pubbliche, &lt;i&gt;photovoice&lt;/i&gt; (metodo partecipativo in cui i partecipanti documentano un luogo con fotografie e le discutono).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;6 ECTS per semestre&lt;/b&gt; · due semestri (uno o entrambi) · 36 ore in presenza · candidature entro il &lt;b&gt;9 ottobre&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;h4&gt;A course shaped by students, for students&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;Rethinking Destinations: Sustainable Governance, Territorial Resilience, and the Future of Place Management&lt;/i&gt;.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;DMO&lt;/b&gt; (&lt;i&gt;Destination Management Organization&lt;/i&gt;): l&#x27;ente che coordina la gestione di una destinazione turistica. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo UN Tourism, il ruolo delle DMO si è spostato dal solo marketing alla pianificazione strategica e al coordinamento degli stakeholder (&lt;a href=&quot;https://www.untourism.int/archive/competitiveness-market-intelligence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Tourism&lt;/a&gt;).&lt;/div&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Sfide reali: &lt;i&gt;overtourism&lt;/i&gt; (pressione turistica eccessiva), tensioni con la comunità, &lt;i&gt;territorial resilience&lt;/i&gt; (capacità di un territorio di assorbire shock e adattarsi).&lt;/li&gt;
        &lt;li&gt;Metodi: lavoro di gruppo, role-play, Living Lab.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;3 ECTS&lt;/b&gt; · un semestre · 18 ore in presenza · candidature entro il &lt;b&gt;9 ottobre&lt;/b&gt;. Per AGS il legame è con la &lt;i&gt;governance&lt;/i&gt;: chi decide e come, quando gli interessi sono molti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;h4&gt;A European classroom for real-world challenges&lt;/h4&gt;
      &lt;p&gt;&lt;i&gt;Migration, Transnational Landscapes, and Criminal Law&lt;/i&gt;: la migrazione come fenomeno complesso (giuridico, spaziale, sociale, umanitario, geopolitico); governance migratoria, diritti umani, vulnerabilità, criminalizzazione, sicurezza, accesso alla protezione.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;6 ECTS per BIP&lt;/b&gt; · un semestre · online e in presenza · &lt;b&gt;coming soon, secondo semestre&lt;/b&gt;. Bergamo è l&#x27;ateneo ospitante (&lt;i&gt;host institution&lt;/i&gt;).&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;BIP&lt;/b&gt; (&lt;i&gt;Blended Intensive Programme&lt;/i&gt;): formato Erasmus+ che unisce una parte virtuale e una breve mobilità fisica. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La fase in presenza dura 5–30 giorni e il programma deve valere almeno 3 ECTS (&lt;a href=&quot;https://www.hu-berlin.de/en/university/international/going-abroad/erasmus/erasmus-europe/blended-intensive-programmes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HU Berlin, BIP&lt;/a&gt;).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il catalogo: 14 European Bauhaus Courses&lt;/h3&gt;
  &lt;div class=&quot;cols&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 300 220&quot; style=&quot;width:100%;max-width:320px;height:auto&quot; role=&quot;img&quot; aria-label=&quot;Ciambella: 8 BIP, 1 COIL, 5 Hackathon&quot;&gt;
      &lt;g transform=&quot;rotate(-90 110 110)&quot; fill=&quot;none&quot; stroke-width=&quot;34&quot;&gt;
        &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;60&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;215.4 377&quot;/&gt;
        &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;60&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;26.9 377&quot; stroke-dashoffset=&quot;-215.4&quot;/&gt;
        &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;60&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;134.6 377&quot; stroke-dashoffset=&quot;-242.3&quot;/&gt;
      &lt;/g&gt;
      &lt;text x=&quot;110&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; style=&quot;font:500 30px var(--serif);fill:var(--ink)&quot;&gt;14&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; style=&quot;font:500 11px var(--sans);fill:var(--muted)&quot;&gt;EBC&lt;/text&gt;
      &lt;g style=&quot;font:500 13px var(--sans);fill:var(--ink)&quot;&gt;&lt;rect x=&quot;200&quot; y=&quot;70&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;81&quot;&gt;8 BIP&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;111&quot;&gt;1 COIL&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;130&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;218&quot; y=&quot;141&quot;&gt;5 Hackathon&lt;/text&gt;&lt;/g&gt;
