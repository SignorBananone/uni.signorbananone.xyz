    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;8 BIP + 1 COIL + 5 Hackathon = 14 EBC&lt;/b&gt; (&lt;i&gt;European Bauhaus Courses&lt;/i&gt;), più staff week e lezioni/seminari.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;COIL&lt;/b&gt; (&lt;i&gt;Collaborative Online International Learning&lt;/i&gt;): classi di Paesi diversi lavorano insieme online su un progetto comune. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Modello nato alla State University of New York (&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UAlbany, About COIL&lt;/a&gt;). Nel catalogo: &lt;i&gt;Climate Adaptation&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Hackathon&lt;/b&gt;: evento intensivo e breve in cui gruppi sviluppano soluzioni a una sfida (es. &lt;i&gt;B4EU MoveSmart&lt;/i&gt;, &lt;i&gt;Career Lab&lt;/i&gt;, &lt;i&gt;Climate Fresk&lt;/i&gt;).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Titoli del catalogo più vicini ai temi AGS&lt;/summary&gt;&lt;div&gt;&lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;i&gt;Facilitating Systemic Change for Sustainable Regions&lt;/i&gt; · &lt;i&gt;Foundations for Strategic Sustainable Development&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;Education for Inclusive Regions and Sustainable Societies&lt;/i&gt; · &lt;i&gt;Green and Inclusive Campus&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;AI Agents for Resilient Regions&lt;/i&gt; · &lt;i&gt;Climate Adaptation&lt;/i&gt; (COIL) · &lt;i&gt;Too much waste? Let&#x27;s turn it into ideas for change&lt;/i&gt;&lt;/li&gt;
    &lt;li&gt;&lt;i&gt;Needfinding and Invention for Organizational Change&lt;/i&gt;&lt;/li&gt;
  &lt;/ul&gt;&lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;La mappa della slide 16 distingue Bergamo come &lt;b&gt;host institution&lt;/b&gt; (corsi ospitati, in rosso) e come &lt;b&gt;sending institution&lt;/b&gt; (da cui partono studenti verso corsi altrui, in blu). La legenda usa le regioni &lt;b&gt;NUTS 2&lt;/b&gt;, la classificazione statistica europea delle regioni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Devi iscriverti per far parte di BAUHAUS4EU?&lt;/summary&gt;&lt;p&gt;No: ogni studente UniBg ne fa parte. Per i singoli corsi invece serve candidarsi (scadenze indicate sulle slide).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanti ECTS puoi ottenere al massimo dal Regional Living Lab?&lt;/summary&gt;&lt;p&gt;12: 6 ECTS per semestre, frequentando entrambi i semestri.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra un BIP e un COIL?&lt;/summary&gt;&lt;p&gt;Il BIP combina attività virtuali e una breve mobilità fisica; il COIL è interamente online, con classi di Paesi diversi che collaborano.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 06 ============ --&gt;
&lt;section class=&quot;part tone-ochre&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Entrepreneurial University&lt;/div&gt;&lt;h2&gt;CREO-LAB: dal bisogno al progetto&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 17–21&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;CREO&lt;/b&gt; = &lt;i&gt;Competencies and Resources for Entrepreneurial Orientation&lt;/i&gt; (&quot;powered by CYFE&quot;). Slogan: &quot;&lt;i&gt;Not just theory. Ideas, people and skills to put into action.&lt;/i&gt;&quot; I CREO-LAB sono laboratori di &lt;b&gt;learning by doing&lt;/b&gt; (si impara facendo) in &lt;b&gt;multidisciplinary teams&lt;/b&gt; (gruppi con studenti di corsi diversi). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La pagina d&#x27;ateneo li descrive come un percorso di formazione imprenditoriale con docenti di tutte le aree (&lt;a href=&quot;https://www.unibg.it/studiare/corsi/altre-opportunita-formazione/creo-progetto-delluniversita-studi-bergamo-formazione&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it, CREO&lt;/a&gt;).&lt;/div&gt;

  &lt;h3&gt;Il percorso: &quot;assess a need and find a solution&quot;&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Esplorare l&#x27;imprenditorialità in un campo&lt;/h4&gt;&lt;p&gt;Si parte da un ambito (digitale, salute, sostenibilità, turismo) e si osservano attori, problemi, tendenze.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Analizzare e validare un bisogno&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Validare&lt;/b&gt; significa verificare con evidenze (interviste, dati, osservazione) che il problema esiste davvero e conta per qualcuno, prima di innamorarsi di una soluzione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Generare un&#x27;idea originale, rilevante, fattibile&lt;/h4&gt;&lt;p&gt;I tre criteri della slide 19 lavorano insieme: vedi il diagramma qui sotto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Costruire un business model&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Business model&lt;/b&gt;: la logica con cui un&#x27;organizzazione &lt;b&gt;crea, consegna e cattura valore&lt;/b&gt; (chi serve, che cosa offre, come guadagna, che risorse usa). Le slide chiedono modelli &quot;&lt;i&gt;that create value and are potentially scalable&lt;/i&gt;&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Final project work e comunicazione&lt;/h4&gt;&lt;p&gt;Il risultato è un &lt;b&gt;project work&lt;/b&gt; finale da presentare: per questo tra le competenze compare &quot;&lt;i&gt;the ability to communicate and develop an idea&lt;/i&gt;&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;cols&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 260&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn: originale, rilevante, fattibile&quot;&gt;
        &lt;g opacity=&quot;.4&quot;&gt;
          &lt;circle cx=&quot;120&quot; cy=&quot;100&quot; r=&quot;78&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;100&quot; r=&quot;78&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;168&quot; r=&quot;78&quot; fill=&quot;var(--slate)&quot;/&gt;
        &lt;/g&gt;
        &lt;g style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;&lt;text x=&quot;70&quot; y=&quot;70&quot;&gt;Originale&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;70&quot;&gt;Rilevante&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot;&gt;Fattibile&lt;/text&gt;&lt;/g&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;124&quot; r=&quot;20&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 12px var(--sans);fill:var(--ink)&quot;&gt;idea&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Originale ma irrilevante = curiosità; rilevante ma non fattibile = sogno; fattibile e rilevante ma non originale = già fatto.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;h4&gt;Le 5 competenze che il lab sviluppa&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Problem solving&lt;/li&gt;&lt;li&gt;Teamwork&lt;/li&gt;&lt;li&gt;Creativity&lt;/li&gt;&lt;li&gt;Project development&lt;/li&gt;&lt;li&gt;The ability to communicate and develop an idea&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Che cosa vuol dire &quot;potentially scalable&quot;?&lt;/h4&gt;
    &lt;p style=&quot;margin-top:0&quot;&gt;Un modello è &lt;b&gt;scalabile&lt;/b&gt; quando i ricavi possono crescere molto più dei costi: tanti costi fissi all&#x27;inizio, pochi costi per ogni cliente in più. Confronta il costo medio per cliente di due modelli (numeri inventati, solo a scopo didattico): una piattaforma digitale (costo fisso 20.000 €, 2 € per cliente) e una consulenza su misura (costo fisso 500 €, 60 € per cliente).&lt;/p&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;nu&quot;&gt;Numero di clienti&lt;/label&gt;&lt;input id=&quot;nu&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;nuO&quot;&gt;100&lt;/output&gt;&lt;/div&gt;
    &lt;svg id=&quot;scal&quot; viewBox=&quot;0 0 520 280&quot; style=&quot;width:100%;height:auto;background:var(--card);border-radius:10px&quot; role=&quot;img&quot; aria-label=&quot;Grafico del costo medio per cliente&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;240&quot; x2=&quot;500&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot;/&gt;
      &lt;g style=&quot;font:400 10px var(--sans);fill:var(--muted)&quot;&gt;&lt;text x=&quot;44&quot; y=&quot;244&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;134&quot; text-anchor=&quot;end&quot;&gt;100 €&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;200 €&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;256&quot; text-anchor=&quot;end&quot;&gt;1000 clienti&lt;/text&gt;&lt;text x=&quot;50&quot; y=&quot;256&quot;&gt;0&lt;/text&gt;&lt;/g&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;130&quot; x2=&quot;500&quot; y2=&quot;130&quot; stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;
      &lt;path id=&quot;pS&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path id=&quot;pC&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;line id=&quot;vL&quot; y1=&quot;20&quot; y2=&quot;240&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;2 3&quot;/&gt;
      &lt;circle id=&quot;dS&quot; r=&quot;5&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle id=&quot;dC&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;g style=&quot;font:600 11px var(--sans)&quot;&gt;&lt;text x=&quot;380&quot; y=&quot;40&quot; fill=&quot;var(--ochre)&quot;&gt;piattaforma (scalabile)&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;56&quot; fill=&quot;var(--slate)&quot;&gt;consulenza (poco scalabile)&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;res&quot; id=&quot;scR&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;4 CREO-LAB, molte prospettive&lt;/h3&gt;
  &lt;div class=&quot;cols&quot; style=&quot;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Tecnologie digitali &amp;amp; intelligenza artificiale&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in italiano&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Salute&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in italiano&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in inglese&lt;/span&gt;&lt;p style=&quot;font-size:.9rem&quot;&gt;Il più vicino ai temi di AGS.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Tourism &amp;amp; Creative Industries&lt;/h4&gt;&lt;span class=&quot;sl&quot;&gt;in inglese&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;6 ECTS&lt;/b&gt; · secondo semestre · aperti a tutte le lauree magistrali · in presenza · &lt;i&gt;challenge-based or problem-inspired&lt;/i&gt; · seminari, ospiti, attività pratiche, team building, esperienze sul campo. Chi completa il lab ottiene l&#x27;&lt;b&gt;Open Badge &quot;CREO-LAB Entrepreneurial Mindset&quot;&lt;/b&gt; (sezione 07). Il 2026-2027 è la &lt;b&gt;4ª edizione&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali tre caratteristiche deve avere l&#x27;idea secondo il CREO-LAB?&lt;/summary&gt;&lt;p&gt;Original, relevant, feasible: originale, rilevante, fattibile.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché si parte dal bisogno e non dalla soluzione?&lt;/summary&gt;&lt;p&gt;Perché un&#x27;idea vale solo se risponde a un bisogno reale e validato; partire dalla soluzione rischia di creare qualcosa che nessuno cerca.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nel grafico, perché la piattaforma diventa più conveniente oltre una certa soglia?&lt;/summary&gt;&lt;p&gt;Perché il suo alto costo fisso si ripartisce su sempre più clienti, mentre il costo per cliente resta basso (2 €). La consulenza ha un costo per cliente alto (60 €) che non scende. Con questi numeri il sorpasso avviene intorno ai 340 clienti.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 07 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Riconoscimenti digitali&lt;/div&gt;&lt;h2&gt;Open Badge e il percorso TRANSET&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 20, 22–24, 26&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Open Badge&lt;/b&gt;: attestato digitale che certifica una competenza o una partecipazione. A differenza di un PDF, contiene dati verificabili: chi lo ha rilasciato, a chi, con quali criteri e (talvolta) quali evidenze. Si può mostrare nel CV o su LinkedIn. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Lo standard è curato da 1EdTech; la versione 3.0 (maggio 2024) rende ogni badge una &lt;i&gt;Verifiable Credential&lt;/i&gt; firmata digitalmente dall&#x27;emittente (&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1EdTech, Open Badges&lt;/a&gt;).&lt;/div&gt;

  &lt;p&gt;Nelle slide compaiono &lt;b&gt;tre&lt;/b&gt; badge diversi:&lt;/p&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;CREO-LAB Entrepreneurial Mindset&lt;/h4&gt;&lt;p&gt;Per chi completa un CREO-LAB (sez. 06).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;TRANSET · organizzazioni in transizione&lt;/h4&gt;&lt;p&gt;Percorso multidisciplinare su transizione &lt;b&gt;ecologica, digitale e sociale&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Career Management Skills&lt;/h4&gt;&lt;p&gt;Legato al Career Day (sez. 08).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;TRANSET in breve&lt;/h3&gt;
  &lt;p&gt;TRANSET nasce dal riconoscimento del DipSA come &lt;b&gt;Dipartimento di Eccellenza 2023-2027&lt;/b&gt; del MUR (il logo è sulla slide 22). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; I Dipartimenti di eccellenza sono 180 dipartimenti di università statali selezionati ogni cinque anni e finanziati per un progetto quinquennale, in base alla legge 232/2016 (&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MUR&lt;/a&gt;); il progetto TRANSET del DipSA è centrato sulla sostenibilità sociale, ambientale ed economica (&lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/transet_15mag2025_05.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, locandina TRANSET&lt;/a&gt;).&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Simulatore: hai diritto all&#x27;Open Badge TRANSET?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;te&quot;&gt;Eventi TRANSET frequentati&lt;/label&gt;&lt;input id=&quot;te&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;teO&quot;&gt;3&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;tp&quot;&gt;Presenza media (% durata)&lt;/label&gt;&lt;input id=&quot;tp&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;tpO&quot;&gt;80%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;tw&quot;&gt;Parole del diario riflessivo&lt;/label&gt;&lt;input id=&quot;tw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;twO&quot;&gt;600&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;tR&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-bottom:0&quot;&gt;Regole della slide 22: almeno &lt;b&gt;5&lt;/b&gt; eventi; presenza registrata (form, firma al desk o report online) per almeno il &lt;b&gt;75%&lt;/b&gt; della durata; diario riflessivo individuale di &lt;b&gt;800–1.000 parole&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il calendario TRANSET (slide 23)&lt;/h3&gt;
  &lt;p&gt;Ogni evento è anche un&#x27;occasione per incontrare concetti utili in AGS. Apri le schede:&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Set 2026 · Populismi, genere e rappresentanze: c&#x27;è ancora spazio per i corpi intermedi?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Parte dal libro &lt;i&gt;Disintermediare stanca&lt;/i&gt; di Francesco Seghezzi. &lt;b&gt;Corpi intermedi&lt;/b&gt;: organizzazioni tra individuo e Stato (sindacati, associazioni di categoria, partiti). &lt;b&gt;Disintermediazione&lt;/b&gt;: la loro progressiva scavalcatura, per esempio con piattaforme o leader che parlano direttamente ai cittadini, che secondo l&#x27;evento ha spesso prodotto un &quot;vuoto di rappresentanza&quot; nel lavoro e nella società.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Set 2026 · Mercato, relazioni e valore d&#x27;impresa: come si orienta la governance?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Presentazione del volume &lt;i&gt;Governance Under Influence: The Role of Political Connections in the ESG Transition&lt;/i&gt;. &lt;b&gt;ESG&lt;/b&gt; = &lt;i&gt;Environmental, Social, Governance&lt;/i&gt;, i tre pilastri con cui si valuta la sostenibilità di un&#x27;impresa. &lt;b&gt;Political connections&lt;/b&gt;: legami tra impresa e politica (ex politici nei consigli, relazioni con istituzioni) che possono orientare strategie, sostenibilità e creazione di valore. È il tema più vicino al cuore del corso: la G di ESG.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Ott 2026 · Giovani, maschilità e politica: essere giovani uomini in un mondo polarizzato&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Dati su partecipazione politica e valori dei giovani uomini in Italia e primi risultati del progetto europeo &lt;b&gt;MEN4DEM&lt;/b&gt; sul rapporto tra maschilità e politica.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nov 2026 · Il sapere che conta&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Presentazione del libro di Annamaria Lusardi (Stanford University) sull&#x27;&lt;b&gt;alfabetizzazione finanziaria&lt;/b&gt; (&lt;i&gt;financial literacy&lt;/i&gt;): la capacità di capire concetti come interesse composto, inflazione, rischio e diversificazione, e di usarli nelle scelte quotidiane.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nov 2026 · Contrastare la violenza: dal risentimento di genere alla trasformazione pro-sociale&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Riflessione sul risentimento di genere, sui rischi della sua deriva e su come possa diventare una risorsa trasformativa se rielaborato con valori inclusivi e percorsi di consapevolezza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dic 2026 · Binance Tour&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Evento divulgativo con un imprenditore e divulgatore tecnologico, di nuovo sul ruolo dell&#x27;alfabetizzazione finanziaria nella vita quotidiana (il nome richiama una piattaforma di scambio di criptovalute).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dic 2026 · Maschilità nella società digitale&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Le &quot;maschilità in rete&quot;: modelli che circolano online, loro implicazioni politiche, rappresentazioni mediali, con l&#x27;obiettivo di andare oltre il &quot;panico morale&quot; (la reazione allarmistica e sproporzionata a un fenomeno sociale).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dic 2026 · Progetto continuità&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La descrizione è tagliata nella slide 23; la slide 24 contiene solo un QR code. Controlla il calendario aggiornato sul sito del Dipartimento.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa rende un Open Badge diverso da un attestato in PDF?&lt;/summary&gt;&lt;p&gt;Contiene metadati verificabili (emittente, criteri, destinatario, eventuali evidenze) e si può condividere e controllare online.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Hai seguito 6 eventi TRANSET ma il diario è di 500 parole. Ottieni il badge?&lt;/summary&gt;&lt;p&gt;No: il diario riflessivo deve essere di 800–1.000 parole (e la presenza registrata almeno al 75%).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa significa la G di ESG e quale evento TRANSET la affronta direttamente?&lt;/summary&gt;&lt;p&gt;Governance: regole, organi e relazioni con cui un&#x27;impresa è diretta e controllata. La affronta l&#x27;evento su &quot;Governance Under Influence&quot; (settembre 2026).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 08 ============ --&gt;
&lt;section class=&quot;part tone-slate&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Lavoro, scuole, impresa sociale&lt;/div&gt;&lt;h2&gt;Career Day, summer &amp;amp; winter schools, Enactus&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 25–28&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;div class=&quot;big&quot;&gt;26/11&lt;/div&gt;&lt;h4&gt;Unibg Career Day 2026&lt;/h4&gt;&lt;p&gt;Alla &lt;b&gt;Fiera di Bergamo&lt;/b&gt; (&lt;i&gt;Bergamo Exhibition Centre&lt;/i&gt;): incontro diretto tra studenti, laureati e aziende. Portale: &lt;a href=&quot;https://www.careerdayunibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;careerdayunibg.it&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;div class=&quot;big&quot;&gt;dal 8/10&lt;/div&gt;&lt;h4&gt;&quot;Waiting for Career Day&quot;&lt;/h4&gt;&lt;p&gt;Webinar di orientamento al lavoro per arrivare preparati: ricerca attiva, strumenti di selezione, strategie di carriera.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Simulatore: badge &quot;Career Management Skills&quot;&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;cw&quot;&gt;Webinar seguiti&lt;/label&gt;&lt;input id=&quot;cw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;6&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwO&quot;&gt;1&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label&gt;Partecipazione al Career Day&lt;/label&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; id=&quot;cd&quot; aria-pressed=&quot;false&quot;&gt;non ancora&lt;/button&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;res&quot; id=&quot;cR&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-bottom:0&quot;&gt;Regola della slide 26: almeno &lt;b&gt;due&lt;/b&gt; sessioni &quot;Waiting for Career Day&quot; &lt;b&gt;e&lt;/b&gt; il Career Day stesso.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Summer and winter schools&lt;/h3&gt;
  &lt;p&gt;Corsi brevi e intensivi, spesso internazionali, nei mesi estivi o invernali. I bandi sono sui siti di dipartimento e d&#x27;ateneo (&lt;a href=&quot;https://dipsa.unibg.it/en/international/international-opportunities/winter-summer-and-international-schools&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina DipSA&lt;/a&gt;); altre opportunità vengono comunicate durante l&#x27;anno.&lt;/p&gt;

  &lt;h3&gt;Enactus&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Social enterprise&lt;/b&gt; (impresa sociale): impresa che usa strumenti di mercato per perseguire prima di tutto un obiettivo sociale o ambientale, reinvestendo gli utili nella missione. Enactus costruisce idee e rete attorno a questo concetto.&lt;/div&gt;
  &lt;p&gt;&quot;&lt;i&gt;Real projects. New connections. A team to grow with.&lt;/i&gt;&quot; Condizioni: &lt;b&gt;nessun CFU&lt;/b&gt;, partecipazione &lt;b&gt;gratuita&lt;/b&gt;, scadenza &lt;b&gt;23 ottobre&lt;/b&gt;. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Enactus è un&#x27;organizzazione internazionale non profit di team universitari che sviluppano progetti legati agli Obiettivi di sviluppo sostenibile dell&#x27;ONU e si sfidano in competizioni nazionali e in una &quot;World Cup&quot; (&lt;a href=&quot;https://www.polimi.it/en/students/associazioni-degli-studenti/enactus-polimi&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;es. Enactus Polimi&lt;/a&gt;).&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;Confronto rapido: CREO-LAB dà 6 ECTS ed è in aula nel II semestre; Enactus non dà crediti ma è un&#x27;esperienza associativa continuativa. Entrambi lavorano su idee imprenditoriali, Enactus con taglio esplicitamente sociale.&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa serve per il badge Career Management Skills?&lt;/summary&gt;&lt;p&gt;Almeno due webinar &quot;Waiting for Career Day&quot; più la partecipazione al Career Day del 26 novembre 2026.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Enactus dà crediti formativi?&lt;/summary&gt;&lt;p&gt;No (&quot;No CFU&quot;); la partecipazione è gratuita.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In che cosa un&#x27;impresa sociale differisce da un&#x27;impresa tradizionale?&lt;/summary&gt;&lt;p&gt;Il suo fine principale è un impatto sociale o ambientale; il profitto è un mezzo e viene reinvestito nella missione.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 09 ============ --&gt;
&lt;section class=&quot;part tone-brick&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot;&gt;Verso la laurea&lt;/div&gt;&lt;h2&gt;Suggestions for thesis&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot;&gt;Slide 29–31&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;La slide 29 dà quattro consigli. Dietro ognuno c&#x27;è un&#x27;idea di metodo:&lt;/p&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;1 · Al momento giusto&lt;/h4&gt;&lt;p&gt;Trova un relatore (&lt;i&gt;thesis supervisor&lt;/i&gt;) &lt;b&gt;at adequate timing&lt;/b&gt;: non all&#x27;ultimo momento, perché servono mesi per ricerca e scrittura e i docenti seguono più tesi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;2 · Con un progetto&lt;/h4&gt;&lt;p&gt;Quando contatti il docente, &lt;b&gt;prepara e presenta un thesis project&lt;/b&gt;: tema, domanda di ricerca, titolo provvisorio &quot;e così via&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;3 · Niente mail generiche&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Non&lt;/b&gt; scrivere e-mail &quot;generali&quot; a tutti i docenti chiedendo disponibilità: scegli chi insegna la materia vicina al tuo tema.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;4 · Regole e scadenze&lt;/h4&gt;&lt;p&gt;Leggi le linee guida e controlla le scadenze di laurea su &lt;a href=&quot;https://ls-ags.unibg.it/en/how/how-graduate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en/how/how-graduate&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Research question&lt;/b&gt; (domanda di ricerca): la domanda precisa a cui la tesi risponde. Deve essere delimitata (un fenomeno, un contesto, un periodo) e rispondibile con i dati o i metodi a disposizione. È il cuore del &lt;i&gt;thesis project&lt;/i&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;✗ Approccio generico&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;✓ Approccio con progetto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;i&gt;&quot;Gentile professore, sono al secondo anno e vorrei fare la tesi con lei. È disponibile?&quot;&lt;/i&gt;, inviata in copia a molti docenti.&lt;/p&gt;
      &lt;p class=&quot;ko&quot;&gt;Perché non funziona: nessun tema, nessuna domanda, nessun legame con il corso del docente. È esattamente ciò che la slide chiede di evitare.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Una mail a un solo docente, che allega una pagina di progetto:&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Tema&lt;/b&gt;: rendicontazione di sostenibilità nelle PMI (esempio illustrativo).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Research question&lt;/b&gt;: &quot;In che misura le PMI manifatturiere lombarde pubblicano informazioni ESG volontarie, e da quali caratteristiche dipende?&quot;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Titolo provvisorio&lt;/b&gt;, metodo previsto (es. analisi di report), fonti iniziali, tempi di laurea.&lt;/li&gt;
        &lt;li&gt;Perché quel docente: il legame con il suo insegnamento.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;ok&quot;&gt;Perché funziona: il docente valuta in pochi minuti fattibilità e pertinenza.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Scegli l&#x27;area&lt;/h4&gt;&lt;p&gt;Parti dagli esami che ti sono piaciuti, dal tirocinio (fino a 400 ore se legato alla tesi) o da un&#x27;esperienza come CREO-LAB o BAUHAUS4EU.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Individua il docente&lt;/h4&gt;&lt;p&gt;Quello che insegna la materia più vicina al tema. Uno, non tutti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Scrivi il thesis project&lt;/h4&gt;&lt;p&gt;Tema, research question, titolo provvisorio, metodo, prime fonti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Contatta e concorda&lt;/h4&gt;&lt;p&gt;Presenta il progetto e rivedilo con il relatore.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Segui scadenze e linee guida&lt;/h4&gt;&lt;p&gt;Sul sito del corso, sezione &quot;how to graduate&quot;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav2&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;Il meeting si chiude con &lt;b&gt;Questions?&lt;/b&gt; e i contatti della presidente e dei vice-coordinatori (slide 31).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa deve contenere un thesis project secondo la slide?&lt;/summary&gt;&lt;p&gt;Almeno il tema, la domanda di ricerca e il titolo (&quot;and so on&quot;: anche metodo, fonti, tempi).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché è sconsigliato scrivere a tutti i docenti?&lt;/summary&gt;&lt;p&gt;Perché una richiesta generica non permette al docente di valutare il progetto e mostra che non c&#x27;è stata una scelta motivata del relatore.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale opportunità della sezione 04 si collega direttamente alla tesi?&lt;/summary&gt;&lt;p&gt;Il tirocinio, estendibile fino a 400 ore quando serve a preparare la tesi.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ REFS ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kick&quot; style=&quot;color:var(--accent)&quot;&gt;Testi, programmi, standard, siti&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;src&quot; style=&quot;border-color:var(--accent)&quot;&gt;Ogni scheda indica se il link viene dalle slide o dal web (&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Testi citati negli eventi TRANSET&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;A. Lusardi, &lt;i&gt;Il sapere che conta&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Mondadori, 2024. Sottotitolo: &lt;i&gt;L&#x27;ABC della finanza per fare le scelte giuste e prendere in mano il nostro futuro&lt;/i&gt;. Sette capitoli divulgativi su risparmio, investimenti, inflazione, tassi d&#x27;interesse e debito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: base di financial literacy utile a chi lavora con bilanci e decisioni finanziarie.&lt;/p&gt;&lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/lusardi_26mar2025_04.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Locandina presentazione DipSA&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;F. Seghezzi, &lt;i&gt;Disintermediare stanca&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;FrancoAngeli, 2026. Sottotitolo: &lt;i&gt;Democrazia economica, populismo e crisi del collettivo&lt;/i&gt;. Confronto tra cinque Paesi (Austria, Francia, Italia, Polonia, Spagna) su disintermediazione, populismo e sindacati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega la crisi dei corpi intermedi, cioè degli stakeholder collettivi della governance.&lt;/p&gt;&lt;a href=&quot;https://static.francoangeli.it/fa-contenuti/area_pdfdemo/1496.2_demo.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Estratto FrancoAngeli (PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;C. Bellavite Pellegrini, L. Pellegrini, A. Roncella, &lt;i&gt;Governance Under Influence&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Palgrave Macmillan, 2026 (Palgrave Studies in Impact Finance). Come le connessioni politiche influenzano la governance d&#x27;impresa e la transizione ESG in Italia, Francia, Germania e Regno Unito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il libro più vicino al nucleo AGS, cioè governance e sostenibilità.&lt;/p&gt;&lt;a href=&quot;https://aisberg.unibg.it/handle/10446/311807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda nell&#x27;archivio istituzionale UniBg&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Programmi, progetti e standard&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;ECTS Users&#x27; Guide 2015&lt;/h4&gt;&lt;p&gt;Guida europea al sistema dei crediti: 60 ECTS per anno, 25–30 ore per credito, carico di lavoro che include ogni attività.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega che cosa misurano i crediti del tuo piano.&lt;/p&gt;&lt;a href=&quot;https://pjp-eu.coe.int/bih-higher-education/images/4.%20the%20bologna%20follow-up%20group%20(bfug)%20endorsed%20new%20(2015)%20ects%20users%27%20guide.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (copia Consiglio d&#x27;Europa, PDF)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/European_Credit_Transfer_and_Accumulation_System&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;European Universities Initiative&lt;/h4&gt;&lt;p&gt;Iniziativa Erasmus+ che finanzia le alleanze universitarie europee; a luglio 2026 ne sono state selezionate 20 nuove, per 65 alleanze in totale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la cornice di BAUHAUS4EU.&lt;/p&gt;&lt;a href=&quot;https://education.ec.europa.eu/whats-new/news/20-european-universities-alliances-selected-for-erasmus-funding&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;BAUHAUS4EU&lt;/h4&gt;&lt;p&gt;Alleanza di 10 atenei e 67 partner associati, cofinanziata da Erasmus+; UniBg è membro fondatore.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: da qui passano Living Lab, BIP, COIL e hackathon.&lt;/p&gt;&lt;a href=&quot;https://dipsa.unibg.it/en/international/partners-and-networks/bauhaus4eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, BAUHAUS4EU&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Erasmus+ Blended Intensive Programmes&lt;/h4&gt;&lt;p&gt;Formato misto: parte virtuale + fase fisica di 5–30 giorni, minimo 3 ECTS, almeno tre istituzioni di tre Paesi.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: 8 dei 14 European Bauhaus Courses sono BIP.&lt;/p&gt;&lt;a href=&quot;https://www.hu-berlin.de/en/university/international/going-abroad/erasmus/erasmus-europe/blended-intensive-programmes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HU Berlin, BIP&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;COIL · Collaborative Online International Learning&lt;/h4&gt;&lt;p&gt;Modello di scambio virtuale nato alla SUNY: almeno due docenti di Paesi diversi progettano insieme un modulo online (consigliate almeno 5 settimane).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il formato di &lt;i&gt;Climate Adaptation&lt;/i&gt; nel catalogo.&lt;/p&gt;&lt;a href=&quot;https://www.albany.edu/international/About_COIL.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University at Albany&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Erasmus+ Traineeship&lt;/h4&gt;&lt;p&gt;Tirocini all&#x27;estero di 2–12 mesi per ciclo, anche per neolaureati entro un anno dalla laurea (regole variabili per ateneo).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: unisce mobilità e tirocinio (sez. 04).&lt;/p&gt;&lt;a href=&quot;https://www.unic.ac.cy/erasmus/traineeship-for-students/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Esempio di regolamento (University of Nicosia)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Convenzione quadro MIUR–CNDCEC&lt;/h4&gt;&lt;p&gt;Condizioni per anticipare il tirocinio professionale durante la magistrale e ottenere l&#x27;esonero dalla prima prova dell&#x27;esame di Stato.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base dell&#x27;accordo UniBg–ODCEC Bergamo della slide 9.&lt;/p&gt;&lt;a href=&quot;https://www.unito.it/sites/default/files/convenzione_quadro_comm_esp_cont.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (copia UniTo, PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Open Badges (1EdTech)&lt;/h4&gt;&lt;p&gt;Standard aperto per credenziali digitali; dalla versione 3.0 (2024) i badge sono Verifiable Credentials firmate.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega che valore hanno i badge CREO-LAB, TRANSET e Career.&lt;/p&gt;&lt;a href=&quot;https://www.1edtech.org/standards/open-badges&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1EdTech&lt;/a&gt; · &lt;a href=&quot;https://openbadges.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openbadges.org&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dipartimenti di eccellenza 2023-2027&lt;/h4&gt;&lt;p&gt;Programma MUR (legge 232/2016) che finanzia per cinque anni 180 dipartimenti di università statali.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: da qui nasce TRANSET.&lt;/p&gt;&lt;a href=&quot;https://www.mur.gov.it/it/aree-tematiche/universita/programmazione-e-finanziamenti/dipartimenti-di-eccellenza&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MUR&lt;/a&gt; · &lt;a href=&quot;https://dipsa.unibg.it/sites/dip6/files/transet_15mag2025_05.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DipSA, TRANSET&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;MEN4DEM&lt;/h4&gt;&lt;p&gt;Progetto Horizon Europe &lt;i&gt;Masculinities for the Future of European Democracy&lt;/i&gt;: come le maschilità antidemocratiche si diffondono e incidono sulla democrazia.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la ricerca dietro l&#x27;evento TRANSET di ottobre.&lt;/p&gt;&lt;a href=&quot;https://cordis.europa.eu/project/id/101177356&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CORDIS&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;DMO · UN Tourism&lt;/h4&gt;&lt;p&gt;Il ruolo delle Destination Management Organization: dalla promozione a pianificazione, coordinamento e governance degli stakeholder.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il tema dello student-led course BAUHAUS4EU.&lt;/p&gt;&lt;a href=&quot;https://www.untourism.int/archive/competitiveness-market-intelligence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Tourism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;CREO · UniBg&lt;/h4&gt;&lt;p&gt;Percorso di formazione imprenditoriale d&#x27;ateneo; quattro CREO-LAB da 6 CFU, inseribili come esame a scelta o extra.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dettagli e bandi del lab (sez. 06).&lt;/p&gt;&lt;a href=&quot;https://www.unibg.it/studiare/corsi/altre-opportunita-formazione/creo-progetto-delluniversita-studi-bergamo-formazione&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Double Degree AGS – Dundee&lt;/h4&gt;&lt;p&gt;Secondo anno a Dundee (MSc Accounting &amp;amp; Finance), doppio titolo, posti limitati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: condizioni e bandi ufficiali.&lt;/p&gt;&lt;a href=&quot;https://ls-ags.unibg.it/en/study-abroad-and-opportunities/double-degree&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Siti citati nelle slide&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;--tone:var(--accent);--tone-bg:var(--accent-bg)&quot;&gt;dalle slide&lt;/span&gt;&lt;h4&gt;Portali UniBg&lt;/h4&gt;&lt;p&gt;&lt;a href=&quot;https://en.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;en.unibg.it&lt;/a&gt; · &lt;a href=&quot;https://www.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;www.unibg.it&lt;/a&gt; · &lt;a href=&quot;https://dipsa.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dipsa.unibg.it/en&lt;/a&gt; · &lt;a href=&quot;https://ls-ags.unibg.it/en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ls-ags.unibg.it/en&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;--tone:var(--accent);--tone-bg:var(--accent-bg)&quot;&gt;dalle slide&lt;/span&gt;&lt;h4&gt;Pagine operative&lt;/h4&gt;&lt;p&gt;&lt;a href=&quot;https://ls-ags.unibg.it/en/course/study-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Study plan&lt;/a&gt; · &lt;a href=&quot;https://ls-ags.unibg.it/en/how/how-graduate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;How to graduate&lt;/a&gt; · &lt;a href=&quot;https://www.unibg.it/universita/amministrazione/concorsi-e-selezioni/bandi-tirocini-e-studio-allestero&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bandi tirocini e studio all&#x27;estero&lt;/a&gt; · &lt;a href=&quot;https://dipsa.unibg.it/en/international/international-opportunities/winter-summer-and-international-schools&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summer &amp;amp; winter schools&lt;/a&gt; · &lt;a href=&quot;https://www.careerdayunibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Career Day&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;div&gt;Le etichette &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; indicano informazioni prese dal web, distinte dal contenuto delle slide.&lt;/div&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  // tabs
  $$(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var bs=$$(&#x27;[role=tab]&#x27;,t),ps=$$(&#x27;[role=tabpanel]&#x27;,t);
    bs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i)});ps.forEach(function(p,j){p.hidden=j!==i});
    })});
  });
  // steppers
  $$(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var st=$$(&#x27;.step&#x27;,s),d=$(&#x27;.dots&#x27;,s),i=0;
    st.forEach(function(_,k){var b=document.createElement(&#x27;button&#x27;);b.textContent=k+1;b.setAttribute(&#x27;aria-label&#x27;,&#x27;passo &#x27;+(k+1));b.onclick=function(){go(k)};d.appendChild(b)});
    function go(k){i=Math.max(0,Math.min(st.length-1,k));st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});$$(&#x27;button&#x27;,d).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)})}
    $(&#x27;[data-prev]&#x27;,s).onclick=function(){go(i-1)};$(&#x27;[data-next]&#x27;,s).onclick=function(){go(i+1)};go(0);
  });
  // ECTS
  var e=$(&#x27;#ects&#x27;);
  if(e){var f=function(){var v=+e.value;$(&#x27;#ectsO&#x27;).textContent=v;
    $(&#x27;#ectsR&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+v+&#x27; ECTS&lt;/b&gt; ≈ &lt;b&gt;&#x27;+(v*25)+&#x27; ore&lt;/b&gt; secondo il rapporto delle slide (25 h/ECTS) · &#x27;+(v*25)+&#x27;–&#x27;+(v*30)+&#x27; ore secondo la forbice europea · &#x27;+Math.round(v/60*100)+&#x27;% di un anno a tempo pieno.&#x27;;
    $(&#x27;#ectsFill&#x27;).setAttribute(&#x27;width&#x27;,Math.max(8,v/60*600));};e.oninput=f;f();}
  // timeline today
  var tg=$(&#x27;#today&#x27;);
  if(tg){var start=Date.UTC(2026,9,1),now=new Date(),d=(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-start)/864e5;
    if(d&gt;=0&amp;&amp;d&lt;=91){tg.setAttribute(&#x27;transform&#x27;,&#x27;translate(&#x27;+(60+d*840/91)+&#x27;,0)&#x27;);tg.style.display=&#x27;&#x27;;}
    var close=(Date.UTC(2026,10,16)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/864e5,c=$(&#x27;#countdown&#x27;);
    if(c){c.textContent+=close&gt;0?&#x27; Mancano &#x27;+close+&#x27; giorni alla chiusura del piano di studi.&#x27;:close===0?&#x27; Oggi chiude il piano di studi!&#x27;:&#x27; La finestra del piano di studi è chiusa.&#x27;;}}
  // internship
  var ih=$(&#x27;#ih&#x27;),iw=$(&#x27;#iw&#x27;);
  if(ih){var g=function(){var h=+ih.value,w=+iw.value,wk=h/w;$(&#x27;#ihO&#x27;).textContent=h;$(&#x27;#iwO&#x27;).textContent=w;
    $(&#x27;#ihFill&#x27;).setAttribute(&#x27;width&#x27;,h*1.5);
    $(&#x27;#iR&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+h+&#x27; ore&lt;/b&gt; a &#x27;+w+&#x27; h/settimana ≈ &lt;b&gt;&#x27;+wk.toFixed(1)+&#x27; settimane&lt;/b&gt; (circa &#x27;+(wk/4.33).toFixed(1)+&#x27; mesi). &#x27;+(h&gt;150?&#x27;Oltre le 150 ore: estensione possibile solo se il tirocinio prepara la tesi.&#x27;:&#x27;È la durata base da 6 ECTS.&#x27;);};
    ih.oninput=g;iw.oninput=g;g();}
  // scalability
  var nu=$(&#x27;#nu&#x27;);
  if(nu){var X=function(n){return 50+n/1000*450},Y=function(c){return 240-Math.min(c,200)/200*220},
      cS=function(n){return 20000/n+2},cC=function(n){return 500/n+60},path=function(fn){var d=&#x27;&#x27;;for(var n=10;n&lt;=1000;n+=5){d+=(d?&#x27;L&#x27;:&#x27;M&#x27;)+X(n).toFixed(1)+&#x27; &#x27;+Y(fn(n)).toFixed(1)}return d};
    $(&#x27;#pS&#x27;).setAttribute(&#x27;d&#x27;,path(cS));$(&#x27;#pC&#x27;).setAttribute(&#x27;d&#x27;,path(cC));
    var h2=function(){var n=+nu.value,s=cS(n),c=cC(n);$(&#x27;#nuO&#x27;).textContent=n;
      $(&#x27;#vL&#x27;).setAttribute(&#x27;x1&#x27;,X(n));$(&#x27;#vL&#x27;).setAttribute(&#x27;x2&#x27;,X(n));
      $(&#x27;#dS&#x27;).setAttribute(&#x27;cx&#x27;,X(n));$(&#x27;#dS&#x27;).setAttribute(&#x27;cy&#x27;,Y(s));$(&#x27;#dC&#x27;).setAttribute(&#x27;cx&#x27;,X(n));$(&#x27;#dC&#x27;).setAttribute(&#x27;cy&#x27;,Y(c));
      $(&#x27;#scR&#x27;).innerHTML=&#x27;Con &#x27;+n+&#x27; clienti: piattaforma &lt;b&gt;&#x27;+s.toFixed(0)+&#x27; €&lt;/b&gt; per cliente, consulenza &lt;b&gt;&#x27;+c.toFixed(0)+&#x27; €&lt;/b&gt;. &#x27;+(s&lt;c?&#x27;Qui la piattaforma è più efficiente: è l\&#x27;effetto della scalabilità.&#x27;:&#x27;Qui la consulenza costa meno: la piattaforma non ha ancora abbastanza clienti per ripagare il costo fisso.&#x27;);};
    nu.oninput=h2;h2();}
  // TRANSET
  var te=$(&#x27;#te&#x27;),tp=$(&#x27;#tp&#x27;),tw=$(&#x27;#tw&#x27;);
  if(te){var t=function(){var a=+te.value,b=+tp.value,c=+tw.value;$(&#x27;#teO&#x27;).textContent=a;$(&#x27;#tpO&#x27;).textContent=b+&#x27;%&#x27;;$(&#x27;#twO&#x27;).textContent=c;
    var r=[[a&gt;=5,&#x27;eventi: &#x27;+a+&#x27;/5&#x27;],[b&gt;=75,&#x27;presenza: &#x27;+b+&#x27;% (min 75%)&#x27;],[c&gt;=800&amp;&amp;c&lt;=1000,&#x27;diario: &#x27;+c+&#x27; parole (800–1.000)&#x27;]];
    $(&#x27;#tR&#x27;).innerHTML=r.map(function(x){return &#x27;&lt;span class=&quot;&#x27;+(x[0]?&#x27;ok&#x27;:&#x27;ko&#x27;)+&#x27;&quot;&gt;&#x27;+(x[0]?&#x27;✓ &#x27;:&#x27;✗ &#x27;)+x[1]+&#x27;&lt;/span&gt;&#x27;}).join(&#x27; · &#x27;)+&#x27;&lt;br&gt;&#x27;+(r.every(function(x){return x[0]})?&#x27;&lt;b&gt;Badge TRANSET ottenibile.&lt;/b&gt;&#x27;:&#x27;Badge non ancora ottenibile.&#x27;);};
    te.oninput=tp.oninput=tw.oninput=t;t();}
  // Career badge
  var cw=$(&#x27;#cw&#x27;),cd=$(&#x27;#cd&#x27;);
  if(cw){var k=function(){var n=+cw.value,on=cd.getAttribute(&#x27;aria-pressed&#x27;)===&#x27;true&#x27;;$(&#x27;#cwO&#x27;).textContent=n;cd.textContent=on?&#x27;sì, partecipato&#x27;:&#x27;non ancora&#x27;;
    $(&#x27;#cR&#x27;).innerHTML=&#x27;&lt;span class=&quot;&#x27;+(n&gt;=2?&#x27;ok&#x27;:&#x27;ko&#x27;)+&#x27;&quot;&gt;&#x27;+(n&gt;=2?&#x27;✓&#x27;:&#x27;✗&#x27;)+&#x27; webinar &#x27;+n+&#x27;/2&lt;/span&gt; · &lt;span class=&quot;&#x27;+(on?&#x27;ok&#x27;:&#x27;ko&#x27;)+&#x27;&quot;&gt;&#x27;+(on?&#x27;✓&#x27;:&#x27;✗&#x27;)+&#x27; Career Day&lt;/span&gt;&lt;br&gt;&#x27;+(n&gt;=2&amp;&amp;on?&#x27;&lt;b&gt;Badge Career Management Skills ottenibile.&lt;/b&gt;&#x27;:&#x27;Mancano ancora dei requisiti.&#x27;);};
    cw.oninput=k;cd.onclick=function(){cd.setAttribute(&#x27;aria-pressed&#x27;,cd.getAttribute(&#x27;aria-pressed&#x27;)!==&#x27;true&#x27;);k()};k();}
  // toc highlight
  var links=$$(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+x.target.id)})}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    $$(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});}
})();
&lt;/script&gt;
