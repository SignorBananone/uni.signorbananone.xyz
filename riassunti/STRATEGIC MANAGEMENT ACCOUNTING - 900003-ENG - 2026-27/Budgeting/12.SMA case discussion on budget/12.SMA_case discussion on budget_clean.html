  &lt;/svg&gt;
  &lt;figcaption&gt;I sette ruoli indicati dalle note del docente e l&#x27;informazione che ciascuno porta. Nel caso, solo finanza e commerciale hanno davvero “scritto” il budget.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budgetary slack.&lt;/b&gt; Margine di sicurezza inserito deliberatamente nel budget: costi sovrastimati o ricavi sottostimati per rendere il target più facile da raggiungere. È il rischio tipico della partecipazione quando i manager sono valutati sul rispetto del budget: chi conosce meglio la realtà ha anche l&#x27;incentivo a “proteggersi”.&lt;/div&gt;
  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Il paradosso del caso: più CarePlus punisce gli scostamenti e riduce i budget a chi risparmia, più rende razionale lo slack. La partecipazione funziona solo se l&#x27;informazione onesta non viene usata contro chi la fornisce.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · partecipazione&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa avrebbe dovuto portare l&#x27;HR nella discussione sul +20% di ore?&lt;/summary&gt;&lt;div&gt;Dati su tempi di reclutamento, turnover, durata della formazione e disponibilità effettiva di personale qualificato: cioè quante ore si possono realisticamente coprire e quando.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Participative budgeting significa che il budget lo decidono i reparti?&lt;/summary&gt;&lt;div&gt;No. I reparti contribuiscono con informazioni e proposte e negoziano i target, ma il top management mantiene il compito di fissare la direzione strategica (note del docente).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la partecipazione può generare budgetary slack?&lt;/summary&gt;&lt;div&gt;Perché chi propone il proprio target ha più informazioni del superiore e, se verrà valutato sul raggiungimento, ha l&#x27;incentivo a proporre target facili (costi gonfiati, ricavi prudenti).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 COMPORTAMENTI ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;comportamenti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;h2&gt;Quali comportamenti incoraggia il sistema?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 4 · note del docente p. 5&lt;/span&gt;
  &lt;p&gt;Tre meccanismi del caso modellano il comportamento dei manager: i &lt;strong&gt;report mensili&lt;/strong&gt;, la &lt;strong&gt;discussione degli scostamenti&lt;/strong&gt; con CEO e CFO e la &lt;strong&gt;regola di stretta del budget&lt;/strong&gt; (&lt;em&gt;budget-tightening rule&lt;/em&gt;).&lt;/p&gt;

  &lt;h3&gt;Variance: lo strumento del report mensile&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Variance = Actual − Budget&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Favourable (F).&lt;/b&gt; Lo scostamento migliora il risultato: costi effettivi sotto budget, oppure ricavi sopra budget.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unfavourable (U).&lt;/b&gt; Lo scostamento peggiora il risultato: costi sopra budget o ricavi sotto. In CarePlus si deve “spiegare” in riunione, e così nasce la paura.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Problema: un budget &lt;em class=&quot;t&quot;&gt;static&lt;/em&gt; (statico, fissato per un volume previsto) confronta i costi con un volume che non si è verificato. Un &lt;em class=&quot;t&quot;&gt;flexible budget&lt;/em&gt; (budget flessibile) ricalcola i costi “ammessi” sul volume effettivo, separando l&#x27;effetto volume dall&#x27;effetto efficienza. Prova con il customer service, che nel caso cerca di stare nel budget del costo del lavoro “anche quando i volumi di chiamate aumentano”.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;simVar&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vCall&quot;&gt;Chiamate effettive vs previste&lt;/label&gt;&lt;input id=&quot;vCall&quot; type=&quot;range&quot; min=&quot;-20&quot; max=&quot;40&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;vCallO&quot;&gt;+20%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vEff&quot;&gt;Costo per chiamata vs standard&lt;/label&gt;&lt;input id=&quot;vEff&quot; type=&quot;range&quot; min=&quot;-15&quot; max=&quot;15&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;vEffO&quot;&gt;0%&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;Ipotesi d&#x27;esempio: budget mensile 10.000 chiamate × 3 € = 30.000 € di costo del lavoro, tutto variabile.&lt;/p&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vAct&quot;&gt;36.000 €&lt;/b&gt;&lt;span&gt;costo effettivo&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vSt&quot;&gt;6.000 U&lt;/b&gt;&lt;span&gt;variance vs static budget (30.000 €)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vFl&quot;&gt;0&lt;/b&gt;&lt;span&gt;variance vs flexible budget (efficienza)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vVol&quot;&gt;6.000 U&lt;/b&gt;&lt;span&gt;parte dovuta al solo volume&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;vMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var c=document.getElementById(&#x27;vCall&#x27;),e=document.getElementById(&#x27;vEff&#x27;);
    function eu(x){return Math.round(Math.abs(x)).toLocaleString(&#x27;it-IT&#x27;)}
    function tag(x){return Math.abs(x)&lt;1?&#x27;0&#x27;:eu(x)+(x&gt;0?&#x27; U&#x27;:&#x27; F&#x27;)}
    function up(){
      var q=10000*(1+c.value/100),p=3*(1+e.value/100),act=q*p,flex=q*3,st=30000;
      document.getElementById(&#x27;vCallO&#x27;).textContent=(c.value&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+c.value+&#x27;%&#x27;;document.getElementById(&#x27;vEffO&#x27;).textContent=(e.value&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+e.value+&#x27;%&#x27;;
      document.getElementById(&#x27;vAct&#x27;).textContent=eu(act)+&#x27; €&#x27;;document.getElementById(&#x27;vSt&#x27;).textContent=tag(act-st);
      document.getElementById(&#x27;vFl&#x27;).textContent=tag(act-flex);document.getElementById(&#x27;vVol&#x27;).textContent=tag(flex-st);
      var m=document.getElementById(&#x27;vMsg&#x27;);
      if(act-st&gt;1&amp;&amp;act-flex&lt;=1){m.textContent=&#x27;Il report statico mostra uno scostamento sfavorevole, ma il manager è stato efficiente: il costo extra è dovuto solo a più chiamate. Punirlo spinge a tagliare personale mentre le chiamate crescono, cioè famiglie in attesa.&#x27;;m.style.background=&#x27;var(--brick-bg)&#x27;}
      else if(act-flex&gt;1){m.textContent=&#x27;C\&#x27;è una vera inefficienza (costo per chiamata sopra lo standard): questa è la parte da discutere col manager.&#x27;;m.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{m.textContent=&#x27;Il costo è in linea o sotto il flexible budget: nessun problema di efficienza.&#x27;;m.style.background=&#x27;var(--sage-bg)&#x27;}
    }
    [c,e].forEach(function(x){x.addEventListener(&#x27;input&#x27;,up)});up();
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;I numeri del simulatore sono inventati a scopo didattico; il caso non riporta cifre sui volumi di chiamate.&lt;/p&gt;

  &lt;h3&gt;Comportamenti positivi e negativi&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Tocca le carte per vedere da dove nasce ciascun comportamento nel caso.&lt;/p&gt;
  &lt;h4 style=&quot;color:var(--sage)&quot;&gt;Positivi&lt;/h4&gt;
  &lt;div class=&quot;flip&quot;&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Più attenzione ai costi&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;I costi diventano visibili reparto per reparto: prima il budget era un esercizio della sola finanza.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Target finanziari più chiari&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Ognuno sa quanto può spendere e quanto deve generare.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Più disciplina nella pianificazione&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Si passa dalla gestione informale a un ciclo annuale strutturato (era l&#x27;obiettivo di Emma).&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Discussioni di performance strutturate&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Le riunioni mensili creano un momento regolare per parlare dei risultati.&lt;/div&gt;&lt;/button&gt;
  &lt;/div&gt;
  &lt;h4 style=&quot;color:var(--brick);margin-top:18px&quot;&gt;Negativi&lt;/h4&gt;
  &lt;div class=&quot;flip&quot;&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Evitare gli straordinari anche se servono&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Operations approva overtime solo se “assolutamente necessario”: turni scoperti, pressione sui coordinatori.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Rinviare la formazione&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;HR sposta sessioni per restare nel budget mensile: operatori meno preparati.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Tagliare le risorse del customer service&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Meno temporanei nelle ore di punta: attese e reclami.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Firmare contratti senza conferma operativa&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Il commerciale è valutato sulla crescita dei ricavi, non sulla fattibilità.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Spendere il budget avanzato&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Per paura che le risorse inutilizzate vengano tolte (regola dei due mesi): il cosiddetto &lt;em&gt;use it or lose it&lt;/em&gt;.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Creare budgetary slack&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Chiedere più del necessario per proteggersi da scostamenti e tagli futuri.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Guardare la variance del mese, non la qualità di lungo periodo&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;È il &lt;em&gt;short-termism&lt;/em&gt; (miopia di breve periodo): il report è mensile, gli effetti sulla qualità arrivano in mesi o anni.&lt;/div&gt;&lt;/button&gt;
  &lt;/div&gt;

  &lt;h3&gt;La regola dei due mesi: un ratchet effect&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ratchet effect.&lt;/b&gt; “Effetto cricchetto”: il target di domani si basa sulla performance di oggi, quindi chi fa meglio si ritrova con un obiettivo più difficile. Il manager impara a non mostrare tutto ciò che sa fare. È esattamente la regola del CFO: due mesi sotto budget → budget ridotto.&lt;/div&gt;
  &lt;p&gt;Confronta due strategie di un manager nell&#x27;arco di sei mesi. Nella prima mostra i risparmi reali; nella seconda spende il residuo per restare a ridosso del budget.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;ratchet&quot;&gt;
    &lt;div role=&quot;group&quot; style=&quot;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-m=&quot;honest&quot; aria-pressed=&quot;true&quot;&gt;Mostra i risparmi&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-m=&quot;burn&quot; aria-pressed=&quot;false&quot;&gt;Spende il residuo&lt;/button&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 620 240&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Andamento di budget e spesa in sei mesi&quot;&gt;
      &lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;50&quot; y1=&quot;30&quot; x2=&quot;600&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;90&quot; x2=&quot;600&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;150&quot; x2=&quot;600&quot; y2=&quot;150&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;210&quot; x2=&quot;600&quot; y2=&quot;210&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;8&quot; y=&quot;34&quot;&gt;110&lt;/text&gt;&lt;text x=&quot;8&quot; y=&quot;94&quot;&gt;100&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;154&quot;&gt;90&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;214&quot;&gt;80&lt;/text&gt;&lt;/g&gt;
      &lt;g id=&quot;rBars&quot;&gt;&lt;/g&gt;
      &lt;polyline id=&quot;rLine&quot; fill=&quot;none&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;g id=&quot;rLbl&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;budget del mese&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;spesa effettiva (necessaria)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;spesa “di difesa” non necessaria&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;rMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var box=document.getElementById(&#x27;ratchet&#x27;),need=[92,93,90,91,99,97];
    function y(v){return 90-(v-100)*6}
    function run(m){
      var b=100,below=0,bars=&#x27;&#x27;,pts=[],lbl=&#x27;&#x27;,waste=0;
      for(var i=0;i&lt;6;i++){
        var x=60+i*90,spend=m===&#x27;honest&#x27;?need[i]:Math.max(need[i],b);
        pts.push((x)+&#x27;,&#x27;+y(b),(x+80)+&#x27;,&#x27;+y(b));
        bars+=&#x27;&lt;rect x=&quot;&#x27;+(x+15)+&#x27;&quot; y=&quot;&#x27;+y(need[i])+&#x27;&quot; width=&quot;50&quot; height=&quot;&#x27;+(210-y(need[i]))+&#x27;&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&#x27;;
        if(spend&gt;need[i]){bars+=&#x27;&lt;rect x=&quot;&#x27;+(x+15)+&#x27;&quot; y=&quot;&#x27;+y(spend)+&#x27;&quot; width=&quot;50&quot; height=&quot;&#x27;+(y(need[i])-y(spend))+&#x27;&quot; fill=&quot;var(--brick)&quot;/&gt;&#x27;;waste+=spend-need[i];}
        lbl+=&#x27;&lt;text x=&quot;&#x27;+(x+40)+&#x27;&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot;&gt;M&#x27;+(i+1)+&#x27;&lt;/text&gt;&#x27;;
        below=spend&lt;b?below+1:0;
        if(below&gt;=2){b=b-4;below=0;}
      }
      document.getElementById(&#x27;rBars&#x27;).innerHTML=bars;document.getElementById(&#x27;rLine&#x27;).setAttribute(&#x27;points&#x27;,pts.join(&#x27; &#x27;));document.getElementById(&#x27;rLbl&#x27;).innerHTML=lbl;
      var msg=document.getElementById(&#x27;rMsg&#x27;);
      if(m===&#x27;honest&#x27;){msg.textContent=&#x27;Mostrando i risparmi, il budget viene tagliato due volte (100 → 96 → 92). A M5 e M6 la spesa necessaria (99 e 97) supera il budget: scostamenti sfavorevoli da spiegare, pur senza aver sprecato nulla.&#x27;;msg.style.background=&#x27;var(--brick-bg)&#x27;}
      else{msg.textContent=&#x27;Spendendo il residuo il budget resta a 100 e non ci sono mai scostamenti “negativi”, ma si sprecano circa &#x27;+Math.round(waste)+&#x27; unità in sei mesi. Il sistema premia lo spreco e punisce l\&#x27;efficienza.&#x27;;msg.style.background=&#x27;var(--ochre-bg)&#x27;}
      box.querySelectorAll(&#x27;[data-m]&#x27;).forEach(function(b){b.setAttribute(&#x27;aria-pressed&#x27;,b.dataset.m===m);b.style.borderColor=b.dataset.m===m?&#x27;var(--brick)&#x27;:&#x27;&#x27;});
    }
    box.querySelectorAll(&#x27;[data-m]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){run(b.dataset.m)})});run(&#x27;honest&#x27;);
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;Simulazione didattica: la regola è quella del caso, i valori (fabbisogno mensile, taglio di 4 punti) sono inventati.&lt;/p&gt;
  &lt;blockquote&gt;The system is teaching managers to defend their budget, not to improve the service.&lt;cite&gt;Sara, HR manager, p. 2&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · comportamenti&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Costi del lavoro effettivi 33.000 €, budget 30.000 €. Scostamento? Favorevole o sfavorevole?&lt;/summary&gt;&lt;div&gt;+3.000 €, unfavourable (costo sopra budget). Prima di giudicare il manager, però, va verificato se il volume è cambiato con un flexible budget.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la regola “due mesi sotto budget → budget ridotto” produce spesa a fine mese?&lt;/summary&gt;&lt;div&gt;Perché trasforma il risparmio in una punizione futura (ratchet effect). Al manager conviene consumare il residuo (&lt;em&gt;use it or lose it&lt;/em&gt;) o rinviare spese, cioè nascondere l&#x27;informazione sull&#x27;efficienza reale.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cita due comportamenti positivi e due negativi indotti dal sistema.&lt;/summary&gt;&lt;div&gt;Positivi: maggiore attenzione ai costi; più disciplina nella pianificazione (anche: target chiari, discussioni strutturate). Negativi: rinvio della formazione; contratti firmati senza conferma operativa (anche: niente straordinari, tagli al customer service, spesa del residuo, slack, focus sul mese).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 CONTROLLABILITY ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;controllo&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;h2&gt;Che cosa è “controllabile” in un&#x27;azienda di servizi?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 5 · note del docente p. 5&lt;/span&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Controllability principle.&lt;/b&gt; Principio di controllabilità: un manager dovrebbe essere valutato solo (o soprattutto) sui risultati che può effettivamente influenzare. Se viene giudicato su fattori fuori dal suo controllo, il sistema diventa percepito come ingiusto e lo spinge a difendersi invece che a migliorare.&lt;/div&gt;
  &lt;p&gt;In CarePlus la controllabilità è difficile perché &lt;strong&gt;l&#x27;erogazione del servizio è interdipendente&lt;/strong&gt;: il risultato di ciascun reparto dipende dalle decisioni degli altri e da clienti che cambiano richieste all&#x27;ultimo minuto.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 380&quot; role=&quot;img&quot; aria-label=&quot;Rete di interdipendenze tra reparti&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;a6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;&gt;
      &lt;path d=&quot;M215 70 L345 70&quot;/&gt;
      &lt;path d=&quot;M100 90 C100 150 300 170 360 90&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;path d=&quot;M690 245 C640 160 560 110 515 90&quot;/&gt;
      &lt;path d=&quot;M470 105 L470 250&quot;/&gt;
      &lt;path d=&quot;M560 290 L630 290&quot;/&gt;
      &lt;path d=&quot;M150 290 L360 290&quot;/&gt;
      &lt;path d=&quot;M120 270 L420 100&quot; stroke-opacity=&quot;.5&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;45&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;117&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Sales&lt;/text&gt;&lt;text x=&quot;117&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;promesse ai clienti&lt;/text&gt;
      &lt;rect x=&quot;345&quot; y=&quot;45&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Costi di Operations&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;straordinari, viaggi, coordinamento&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;265&quot; width=&quot;130&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;288&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;HR&lt;/text&gt;&lt;text x=&quot;85&quot; y=&quot;305&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;assunzioni, training&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;255&quot; width=&quot;200&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Capacità &amp;amp; qualità&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;training + scheduling + staffing&lt;/text&gt;
      &lt;rect x=&quot;630&quot; y=&quot;255&quot; width=&quot;215&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;737&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer service&lt;/text&gt;&lt;text x=&quot;737&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;carico di chiamate e reclami&lt;/text&gt;
      &lt;rect x=&quot;630&quot; y=&quot;130&quot; width=&quot;215&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;737&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Clienti: cambi last-minute&lt;/text&gt;
    &lt;/g&gt;
    &lt;path d=&quot;M700 176 L560 90&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;/&gt;
    &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;&lt;text x=&quot;225&quot; y=&quot;60&quot;&gt;vende ore&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;180&quot;&gt;problemi operativi&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;282&quot;&gt;capacità di servizio&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;282&quot;&gt;genera chiamate&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Le quattro interdipendenze citate nelle note del docente: i costi dell&#x27;operations dipendono dalle promesse commerciali e dai cambi dei clienti; i risultati HR determinano la capacità di servizio; il carico del customer service dipende dai problemi operativi; la qualità dipende da formazione, scheduling e staffing.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;p&gt;Conclusione delle note: &lt;strong&gt;i manager non dovrebbero essere valutati solo su risultati influenzati da altri reparti o da vincoli esterni; i report dovrebbero distinguere fattori controllabili e meno controllabili.&lt;/strong&gt;&lt;/p&gt;

  &lt;h3&gt;Esercizio: controllabile o no?&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Per ciascuna voce scegli se, per il manager indicato, è in larga parte controllabile o solo in parte (dipende da altri o dall&#x27;esterno).&lt;/p&gt;
  &lt;div class=&quot;sorter&quot;&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;Costo degli straordinari dell&#x27;&lt;strong&gt;operations&lt;/strong&gt; dopo che il commerciale ha firmato tre nuovi contratti senza preavviso&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Solo in parte: il volume è stato deciso da sales. Paolo controlla come organizza i turni, non quante ore deve coprire.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Ore di &lt;strong&gt;idle time&lt;/strong&gt; (tempi morti) nei turni pianificati dai coordinatori&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;In larga parte controllabile da operations: dipende dalla qualità dello scheduling.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;Numero di chiamate ricevute dal &lt;strong&gt;customer service&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Solo in parte: le chiamate crescono quando ci sono problemi operativi. Controllabile è il tempo di risposta dato il volume.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Rispetto del calendario di formazione deciso da &lt;strong&gt;HR&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Controllabile da HR (purché il budget non la spinga a rinviarla).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;&lt;strong&gt;Turnover&lt;/strong&gt; dei care workers come indicatore di HR&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Solo in parte: dipende anche da turni imprevedibili (operations), pressione dei contratti (sales), mercato del lavoro.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Verifica della capacità operativa prima di firmare un contratto (&lt;strong&gt;commerciale&lt;/strong&gt;)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllabile&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Solo in parte&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Controllabile: è un comportamento del commerciale, e infatti andrebbe incentivato e misurato.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Due rimedi pratici: (1) report a due colonne, “scostamento controllabile” e “scostamento dovuto ad altri o all&#x27;esterno” (per esempio con il flexible budget visto sopra); (2) alcuni obiettivi &lt;strong&gt;condivisi&lt;/strong&gt; tra reparti (es. ore coperte con operatore formato), perché il risultato è comune.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · controllability&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Enuncia il controllability principle e spiega perché in CarePlus è difficile applicarlo.&lt;/summary&gt;&lt;div&gt;Valutare i manager su ciò che possono influenzare. Difficile perché il servizio è interdipendente: costi, capacità, reclami e qualità nascono dall&#x27;interazione di più reparti e dai clienti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se è difficile isolare la responsabilità individuale, conviene allora non valutare nessuno?&lt;/summary&gt;&lt;div&gt;No: conviene distinguere nei report la parte controllabile da quella meno controllabile e affiancare indicatori comuni a più reparti, così si responsabilizza senza punire per colpe altrui.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 MOTIVAZIONE E CULTURA ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;cultura&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;h2&gt;Motivazione e service culture&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 6 · note del docente pp. 6–7&lt;/span&gt;
  &lt;p&gt;Le note del docente sono chiare su tre punti:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Il sistema può motivare a controllare i costi, ma &lt;strong&gt;danneggia la motivazione&lt;/strong&gt; se i target sono percepiti come &lt;strong&gt;irrealistici o ingiusti&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Nei servizi i dipendenti &lt;strong&gt;sono parte dell&#x27;esperienza di servizio&lt;/strong&gt;: troppa pressione porta a stress, turnover, meno empatia e qualità più debole.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Un budget focalizzato solo sui costi può &lt;strong&gt;entrare in conflitto con una cultura&lt;/strong&gt; basata su cura, fiducia e affidabilità.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Service culture.&lt;/b&gt; Insieme di valori e comportamenti condivisi che mettono al centro il cliente e la qualità della relazione. In CarePlus coincide con la reputazione: reliability, empathy, flexibility.&lt;/div&gt;

  &lt;h3&gt;Quanto deve essere difficile un target?&lt;/h3&gt;
  &lt;div class=&quot;mine&quot;&gt;
    &lt;p&gt;Schema stilizzato (non nelle slide), coerente con il dibattito tra Laura (“growth requires pressure”) e Paolo (“pressure is not the same as planning”): la motivazione cresce con la difficoltà del target finché il target è &lt;strong&gt;accettato&lt;/strong&gt; come raggiungibile, poi crolla quando diventa irrealistico.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tD&quot;&gt;Difficoltà del target&lt;/label&gt;&lt;input id=&quot;tD&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;tDo&quot;&gt;80&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 220&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Curva motivazione-difficoltà del target&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;180&quot; fill=&quot;var(--sage-bg)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;340&quot; y=&quot;10&quot; width=&quot;110&quot; height=&quot;180&quot; fill=&quot;var(--ochre-bg)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;450&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;180&quot; fill=&quot;var(--brick-bg)&quot; opacity=&quot;.6&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;590&quot; y2=&quot;190&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;190&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;path id=&quot;tCurve&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;circle id=&quot;tDot&quot; r=&quot;7&quot; fill=&quot;var(--acc)&quot;/&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;300&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot;&gt;difficoltà percepita del target →&lt;/text&gt;&lt;text x=&quot;50&quot; y=&quot;26&quot;&gt;motivazione / sforzo&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;180&quot;&gt;facile&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;180&quot;&gt;sfidante&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;180&quot;&gt;irrealistico&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;tMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var r=document.getElementById(&#x27;tD&#x27;);
    function m(d){return d&lt;=70?20+d*1.1:Math.max(5,97-Math.pow(d-70,1.55)*1.6)}
    function X(d){return 40+d*5.5}function Y(v){return 190-v*1.75}
    var p=&#x27;&#x27;;for(var d=0;d&lt;=100;d+=2){p+=(d?&#x27;L&#x27;:&#x27;M&#x27;)+X(d).toFixed(1)+&#x27; &#x27;+Y(m(d)).toFixed(1)}
    document.getElementById(&#x27;tCurve&#x27;).setAttribute(&#x27;d&#x27;,p);
    function up(){var d=+r.value;document.getElementById(&#x27;tDo&#x27;).textContent=d;var dot=document.getElementById(&#x27;tDot&#x27;);dot.setAttribute(&#x27;cx&#x27;,X(d));dot.setAttribute(&#x27;cy&#x27;,Y(m(d)));
      var t=document.getElementById(&#x27;tMsg&#x27;);
      if(d&lt;55){t.textContent=&#x27;Target facile: poco stimolo, rischio di slack e di compiacenza.&#x27;;t.style.background=&#x27;var(--sage-bg)&#x27;}
      else if(d&lt;=74){t.textContent=&#x27;Target sfidante ma credibile: il punto in cui la pressione “spinge a migliorare”, come vuole il CFO.&#x27;;t.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{t.textContent=&#x27;Target percepito come irrealistico (es. +20% ore con +7% staff): demotivazione, stress, comportamenti difensivi, gaming dei numeri.&#x27;;t.style.background=&#x27;var(--brick-bg)&#x27;}}
    r.addEventListener(&#x27;input&#x27;,up);up();
  });&lt;/script&gt;

  &lt;h3&gt;Circolo virtuoso o vizioso?&lt;/h3&gt;
  &lt;p&gt;In un&#x27;azienda dove “le persone sono il servizio”, motivazione dei dipendenti e soddisfazione dei clienti sono legate in un ciclo. Il budget può alimentarlo in un senso o nell&#x27;altro.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;cyc&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-c=&quot;v&quot;&gt;Ciclo vizioso (CarePlus al Q1)&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-c=&quot;g&quot;&gt;Ciclo virtuoso&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 360&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Ciclo tra budget, persone e clienti&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;a7&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;180&quot; r=&quot;130&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;10&quot;/&gt;
      &lt;g id=&quot;cycN&quot; font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;/g&gt;
      &lt;text id=&quot;cycC&quot; x=&quot;300&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; style=&quot;font-family:var(--serif)&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;cycS&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var box=document.getElementById(&#x27;cyc&#x27;);
    var C={v:{c:&#x27;vizioso&#x27;,col:&#x27;var(--brick)&#x27;,bg:&#x27;var(--brick-bg)&#x27;,n:[&#x27;Tagli e target irrealistici&#x27;,&#x27;Turni imprevedibili, meno training&#x27;,&#x27;Stress e burnout&#x27;,&#x27;Turnover, meno continuità&#x27;,&#x27;Reclami, fiducia in calo&#x27;,&#x27;Ricavi sotto budget → nuovi tagli&#x27;],s:&#x27;È la sequenza descritta nella riunione di fine trimestre: costo del lavoro più alto, reclami in aumento, turnover invariato, coordinatori più stressati, ricavi sotto budget.&#x27;},
           g:{c:&#x27;virtuoso&#x27;,col:&#x27;var(--sage)&#x27;,bg:&#x27;var(--sage-bg)&#x27;,n:[&#x27;Budget realistico e condiviso&#x27;,&#x27;Turni stabili, training adeguato&#x27;,&#x27;Operatori motivati ed empatici&#x27;,&#x27;Meno turnover, più continuità&#x27;,&#x27;Famiglie soddisfatte e fedeli&#x27;,&#x27;Ricavi e margini sostenibili&#x27;],s:&#x27;Logica vicina alla service-profit chain (fonte esterna, vedi “Per approfondire”): qualità del lavoro interno → soddisfazione dei dipendenti → qualità del servizio → fedeltà dei clienti → crescita e profitto.&#x27;}};
    function run(k){var d=C[k],h=&#x27;&#x27;;d.n.forEach(function(t,i){var a=-Math.PI/2+i*Math.PI/3,x=300+130*Math.cos(a),y=180+130*Math.sin(a);var w=t.split(&#x27; &#x27;);var l1=[],l2=[];w.forEach(function(x2){(l1.join(&#x27; &#x27;).length&lt;16?l1:l2).push(x2)});
      h+=&#x27;&lt;rect x=&quot;&#x27;+(x-82)+&#x27;&quot; y=&quot;&#x27;+(y-22)+&#x27;&quot; width=&quot;164&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;&#x27;+d.bg+&#x27;&quot; stroke=&quot;&#x27;+d.col+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(y-3)+&#x27;&quot;&gt;&#x27;+l1.join(&#x27; &#x27;)+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(y+13)+&#x27;&quot;&gt;&#x27;+l2.join(&#x27; &#x27;)+&#x27;&lt;/text&gt;&#x27;;});
      document.getElementById(&#x27;cycN&#x27;).innerHTML=h;var c=document.getElementById(&#x27;cycC&#x27;);c.textContent=&#x27;ciclo &#x27;+d.c;c.style.fill=d.col;document.getElementById(&#x27;cycS&#x27;).textContent=d.s;
      box.querySelectorAll(&#x27;[data-c]&#x27;).forEach(function(b){b.style.borderColor=b.dataset.c===k?d.col:&#x27;&#x27;});}
    box.querySelectorAll(&#x27;[data-c]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){run(b.dataset.c)})});run(&#x27;v&#x27;);
  });&lt;/script&gt;
  &lt;blockquote&gt;People are not just a variable cost. They are the service.&lt;cite&gt;Sara, HR manager, p. 3&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;strong&gt;Stili di valutazione (Hopwood, 1972).&lt;/strong&gt; Studiando i manager di un&#x27;acciaieria, Hopwood distinse uno stile &lt;em&gt;budget-constrained&lt;/em&gt; (giudizio basato soprattutto sul rispetto del budget di breve periodo), uno &lt;em&gt;profit-conscious&lt;/em&gt; (budget usato in modo flessibile, guardando all&#x27;efficacia di lungo periodo) e uno &lt;em&gt;non-accounting&lt;/em&gt;. Lo stile budget-constrained era associato a più tensione e a comportamenti disfunzionali, come la manipolazione dei dati: un buon specchio delle riunioni mensili di CarePlus. Fonte: &lt;a href=&quot;https://www.jstor.org/stable/2489870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal of Accounting Research (JSTOR)&lt;/a&gt;; sintesi in &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumOtleyFakiolas2000.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · motivazione e cultura&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché la motivazione dei dipendenti pesa di più in un&#x27;azienda di servizi che in una manifatturiera?&lt;/summary&gt;&lt;div&gt;Perché il dipendente è parte del prodotto: empatia, affidabilità e continuità della relazione si producono nell&#x27;interazione con il cliente. Stress e turnover diventano subito qualità peggiore.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Laura dice “growth requires pressure”, Paolo “pressure is not the same as planning”. Chi ha ragione?&lt;/summary&gt;&lt;div&gt;Entrambi in parte: un target sfidante può motivare, ma solo se è credibile e sostenuto da un piano di risorse. Oltre quella soglia la pressione produce comportamenti difensivi e danni alla qualità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In che modo un budget “solo costi” confligge con la cultura di CarePlus?&lt;/summary&gt;&lt;div&gt;Misura e premia il risparmio ma non cura, fiducia e affidabilità, che sono i valori su cui si regge la reputazione. Le persone imparano che ciò che conta è il numero, non il cliente.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 RIPENSARE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;ripensare&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;h2&gt;Ripensare il budget di CarePlus&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;sintesi: dalle note del docente + elaborazione didattica&lt;/span&gt;
  &lt;p&gt;Il caso si chiude con Emma che vuole “ripensare il modo in cui facciamo budget”. Le slide non danno una soluzione: le proposte qui sotto mettono insieme le indicazioni delle note del docente (partecipazione, trade-off espliciti, controllabilità, attenzione alla qualità) con strumenti classici del controllo di gestione.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps-dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;1 Direzione&quot;&gt;&lt;h4&gt;1 · Il vertice fissa la direzione&lt;/h4&gt;&lt;p&gt;Priorità strategiche chiare (es. crescere nella nuova provincia &lt;em&gt;senza&lt;/em&gt; peggiorare la continuità dell&#x27;assistenza). È il ruolo che le note lasciano al top management.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;2 Domanda&quot;&gt;&lt;h4&gt;2 · Domanda e capacità insieme&lt;/h4&gt;&lt;p&gt;La previsione dei ricavi del commerciale viene verificata con operations e HR: quante ore si possono coprire con personale formato, e quando? Il revenue budget diventa un &lt;strong&gt;capacity-checked plan&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;3 Trade-off&quot;&gt;&lt;h4&gt;3 · Trade-off scritti&lt;/h4&gt;&lt;p&gt;Ogni taglio o target ambizioso è accompagnato dall&#x27;effetto atteso sulla qualità e da chi lo monitora (sezione 3). Niente tagli uniformi dell&#x27;8%: si discute dove il costo crea valore.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;4 KPI&quot;&gt;&lt;h4&gt;4 · Misurare anche la qualità&lt;/h4&gt;&lt;p&gt;Accanto ai numeri finanziari, indicatori non finanziari (vedi tabella sotto), così che “ciò che non è misurato” smetta di essere sacrificato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;5 Report&quot;&gt;&lt;h4&gt;5 · Report più giusti&lt;/h4&gt;&lt;p&gt;Flexible budget per separare volume ed efficienza; colonna controllabile / non controllabile; discussione degli scostamenti orientata a capire, non a colpevolizzare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;6 Incentivi&quot;&gt;&lt;h4&gt;6 · Incentivi coerenti&lt;/h4&gt;&lt;p&gt;Abolire la regola che taglia il budget a chi risparmia (ratchet). Valutare il commerciale anche sui contratti effettivamente erogabili; introdurre obiettivi condivisi tra reparti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;7 Revisione&quot;&gt;&lt;h4&gt;7 · Rivedere in corso d&#x27;anno&lt;/h4&gt;&lt;p&gt;Previsioni aggiornate periodicamente (&lt;em&gt;rolling forecast&lt;/em&gt;, previsione “a scorrimento” che si estende sempre di alcuni mesi in avanti) invece di difendere a ogni costo un numero fissato a ottobre.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un cruscotto bilanciato per CarePlus&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Proposta didattica: per ogni dimensione citata da Giulia e Sara un indicatore possibile e un responsabile.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dimensione&lt;/th&gt;&lt;th&gt;Indicatore possibile&lt;/th&gt;&lt;th&gt;Chi lo influenza&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Margine per contratto; costo del lavoro su flexible budget&lt;/td&gt;&lt;td&gt;Finance, tutti&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Continuity of care&lt;/td&gt;&lt;td&gt;% visite fatte dall&#x27;operatore abituale&lt;/td&gt;&lt;td&gt;Operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Responsiveness&lt;/td&gt;&lt;td&gt;Tempo medio di attesa al telefono; reclami ogni 1.000 ore&lt;/td&gt;&lt;td&gt;Customer service, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Persone&lt;/td&gt;&lt;td&gt;Turnover; ore di formazione prima del primo servizio da soli; straordinari pro capite&lt;/td&gt;&lt;td&gt;HR, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Crescita sostenibile&lt;/td&gt;&lt;td&gt;% nuovi contratti con conferma di capacità prima della firma&lt;/td&gt;&lt;td&gt;Commercial, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fiducia del cliente&lt;/td&gt;&lt;td&gt;Soddisfazione delle famiglie e dei comuni; rinnovi&lt;/td&gt;&lt;td&gt;Quality, tutti&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;strong&gt;Beyond Budgeting.&lt;/strong&gt; Un filone di pratica manageriale nato con il Beyond Budgeting Round Table (Hope, Fraser, Bunce, 1998) propone di superare il budget annuale fisso: target relativi, previsioni a scorrimento, risorse allocate quando servono, manager responsabili di risultati competitivi anziché del rispetto del budget. Utile come termine di confronto per la domanda di Emma. Fonte: &lt;a href=&quot;https://www.bbrt.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bbrt.org&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · sintesi finale&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In tre frasi: che cosa è andato storto nel budget di CarePlus?&lt;/summary&gt;&lt;div&gt;È stato costruito top-down, senza integrare i vincoli di capacità e personale. È stato usato soprattutto come strumento di pressione e valutazione su indicatori di costo, con regole che punivano l&#x27;efficienza. Non misurava qualità, continuità e fiducia, quindi le ha sacrificate.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché separare (almeno in parte) il budget come piano dal budget come metro di valutazione?&lt;/summary&gt;&lt;div&gt;Perché se lo stesso numero serve a pianificare e a giudicare, i manager hanno l&#x27;incentivo a distorcerlo (slack, gaming). Separando le funzioni si ottengono informazioni più oneste per pianificare.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Indica un indicatore non finanziario per ciascuno di: operations, HR, customer service.&lt;/summary&gt;&lt;div&gt;Operations: % visite con operatore abituale. HR: turnover o ore di formazione dei nuovi assunti. Customer service: tempo medio di attesa o reclami per 1.000 ore.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;∞&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide di questa lezione sono un caso didattico e &lt;strong&gt;non citano autori, studi, norme o siti&lt;/strong&gt;. Le schede qui sotto sono quindi &lt;strong&gt;fonti esterne&lt;/strong&gt; scelte perché trattano i concetti che il caso mette in gioco. Sono indicazioni di studio da verificare sul testo originale.&lt;/p&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Chris Argyris, &lt;em&gt;The Impact of Budgets on People&lt;/em&gt; (Controllership Foundation, 1952)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Ricerca qualitativa considerata da molti l&#x27;inizio della ricerca comportamentale in contabilità: mostra che i budget, se usati come strumento di pressione, generano tensione, ostilità e comportamenti disfunzionali. È la radice storica della tesi “i budget non sono neutrali”. Una copia è consultabile su HathiTrust.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://catalog.hathitrust.org/Record/005306296&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;catalog.hathitrust.org: scheda dell&#x27;opera&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Anthony G. Hopwood, “An Empirical Study of the Role of Accounting Data in Performance Evaluation”, &lt;em&gt;Journal of Accounting Research&lt;/em&gt;, 10 (1972), pp. 156–182&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Classifica gli stili di valutazione (budget-constrained, profit-conscious, non-accounting) e mostra che la valutazione rigida sul budget aumenta tensione e manipolazione dei dati. Collega direttamente le sezioni 5 e 7: il problema non è il budget in sé, ma il modo in cui viene usato per giudicare.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.jstor.org/stable/2489870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;jstor.org/stable/2489870&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Michael Schiff &amp;amp; Arie Y. Lewin, “The Impact of People on Budgets”, &lt;em&gt;The Accounting Review&lt;/em&gt;, 45(2), 1970, pp. 259–268&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Articolo spesso citato come riferimento per il concetto di &lt;em&gt;budgetary slack&lt;/em&gt;: i manager che partecipano alla preparazione del budget tendono a inserire margini di sicurezza. Utile per la sezione 4 (partecipazione) e per i comportamenti della sezione 5.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://scholars.duke.edu/display/pub1127261&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scholars.duke.edu: scheda bibliografica&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Steven Kerr, “On the Folly of Rewarding A, While Hoping for B”, &lt;em&gt;Academy of Management Journal&lt;/em&gt;, 18(4), 1975, pp. 769–783&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Classico sulle organizzazioni che premiano comportamenti opposti a quelli che dicono di volere. È la diagnosi del commerciale di CarePlus (premiato sui ricavi mentre si “spera” in contratti erogabili) e della regola che punisce chi risparmia.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.talkingaboutorganizations.com/e57-reward-systems-kerr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;talkingaboutorganizations.com: discussione dell&#x27;articolo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Michael C. Jensen, “Corporate Budgeting Is Broken — Let&#x27;s Fix It”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, novembre 2001, pp. 94–101&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Sostiene che legare compensi e valutazioni al raggiungimento del budget spinge i manager a “mentire”: target bassi, risultati gonfiati, spese anticipate o rinviate. Propone di sganciare i premi dal budget. È il fondamento della proposta “separare piano e valutazione” della sezione 8.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.library.hbs.edu/working-knowledge/why-corporate-budgeting-needs-to-be-fixed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School Working Knowledge: sintesi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Kenneth A. Merchant &amp;amp; Wim A. Van der Stede, &lt;em&gt;Management Control Systems: Performance Measurement, Evaluation and Incentives&lt;/em&gt; (Pearson, 4ª ed. 2017)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Manuale di riferimento sul controllo di gestione: centri di responsabilità, controllo dei risultati finanziari, uso del budget nella valutazione e un capitolo dedicato ai fattori non controllabili (controllability principle). Approfondisce le sezioni 5 e 6.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://akademika.no/okonomi-administrasjon-og-ledelse/management-control-systems/9781292110554&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda del libro (ISBN 9781292110554)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;J. L. Heskett, T. O. Jones, G. W. Loveman, W. E. Sasser Jr., L. A. Schlesinger, “Putting the Service-Profit Chain to Work”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, marzo-aprile 1994&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Introduce la &lt;em&gt;service-profit chain&lt;/em&gt;: la qualità del lavoro interno genera dipendenti soddisfatti e fedeli, che producono valore per il cliente, fedeltà e infine crescita e profitto. È la versione “virtuosa” del ciclo della sezione 7 e argomenta la frase di Sara “people are the service”.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Service%E2%80%93profit_chain&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Service–profit chain (voce introduttiva con riferimenti)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Beyond Budgeting Round Table (BBRT): i principi del Beyond Budgeting&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Rete fondata nel 1998 da Jeremy Hope, Robin Fraser e Peter Bunce. Propone dodici principi, sei di leadership e sei di processo (obiettivi relativi, previsioni a scorrimento, risorse su richiesta, controlli basati sulla trasparenza) per superare il budget annuale fisso. È un riferimento per rispondere alla domanda finale di Emma.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.bbrt.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bbrt.org&lt;/a&gt; · &lt;a href=&quot;https://www.bbrt.org/wp-content/uploads/bb_principles.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF dei principi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

(function(){
  /* tabs */
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;.tablist button&#x27;),pans=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,i===j?&#x27;true&#x27;:&#x27;false&#x27;);pans[j].hidden=i!==j;});
    });});
  });
  /* steppers */
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),dots=s.querySelector(&#x27;.steps-dots&#x27;),prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),cur=0;
    steps.forEach(function(st,i){var b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.textContent=st.dataset.label||(i+1);b.addEventListener(&#x27;click&#x27;,function(){go(i)});dots.appendChild(b);});
    function go(i){cur=i;steps.forEach(function(st,j){st.hidden=j!==i});dots.querySelectorAll(&#x27;button&#x27;).forEach(function(b,j){b.classList.toggle(&#x27;on&#x27;,j===i)});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){if(cur&gt;0)go(cur-1)});next.addEventListener(&#x27;click&#x27;,function(){if(cur&lt;steps.length-1)go(cur+1)});
    go(0);
  });
  /* flip cards */
  document.querySelectorAll(&#x27;.flip button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){b.classList.toggle(&#x27;open&#x27;);b.setAttribute(&#x27;aria-expanded&#x27;,b.classList.contains(&#x27;open&#x27;));});});
  /* people pickers */
  document.querySelectorAll(&#x27;[data-people]&#x27;).forEach(function(g){
    var btns=g.querySelectorAll(&#x27;.person&#x27;),out=g.querySelector(&#x27;.pdetail&#x27;);
    btns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){btns.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});out.innerHTML=b.querySelector(&#x27;template&#x27;).innerHTML;});});
    if(btns[0])btns[0].click();
  });
  /* sorters */
  document.querySelectorAll(&#x27;.sorter .row&#x27;).forEach(function(r){
    r.querySelectorAll(&#x27;.opts button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var ok=b.dataset.v===r.dataset.a;r.classList.toggle(&#x27;ok&#x27;,ok);r.classList.toggle(&#x27;ko&#x27;,!ok);
    });});
  });
  /* active nav */
  var links=document.querySelectorAll(&#x27;nav.top a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle(&#x27;on&#x27;,l.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)});}});},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part,header.hero&#x27;).forEach(function(s){io.observe(s)});
  }
  /* widgets registered by sections */
  (window.__w||[]).forEach(function(f){f()});
})();
