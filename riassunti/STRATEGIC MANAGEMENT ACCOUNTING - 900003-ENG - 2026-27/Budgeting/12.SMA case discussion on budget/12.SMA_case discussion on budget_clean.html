    &lt;a href=&quot;#controllo&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;470&quot; y=&quot;320&quot; width=&quot;150&quot; height=&quot;52&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;6 · Controllability&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;interdipendenza&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

    &lt;a href=&quot;#ripensare&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;440&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;470&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;8 · Ripensare il budget →&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
    &lt;a href=&quot;#fonti&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;440&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;470&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Per approfondire&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Clicca su un nodo per saltare alla sezione. Le frecce leggono il caso come una catena: il budget nasce per gestire la crescita, deve bilanciare obiettivi in conflitto, e il modo in cui misura le persone ne cambia i comportamenti e, alla fine, la cultura del servizio.&lt;/p&gt;
&lt;/div&gt;&lt;/header&gt;

&lt;!-- ============ 1 IL CASO ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
  &lt;h2&gt;Il caso: CarePlus Services Ltd.&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · pp. 1–3&lt;/span&gt;
  &lt;p&gt;CarePlus è una &lt;strong&gt;media impresa di servizi&lt;/strong&gt; che fornisce assistenza domiciliare ad anziani e persone con autonomia limitata. Ha circa &lt;strong&gt;220 dipendenti&lt;/strong&gt; (care workers, infermieri, coordinatori, amministrativi, customer service) e clienti molto diversi: famiglie private, comuni, RSA (&lt;em&gt;nursing homes&lt;/em&gt;) e fondazioni sanitarie.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Servizi offerti&lt;/h4&gt;
      &lt;ul&gt;&lt;li&gt;assistenza domiciliare diurna e notturna&lt;/li&gt;&lt;li&gt;supporto post-ospedaliero (&lt;em&gt;post-hospitalization support&lt;/em&gt;)&lt;/li&gt;&lt;li&gt;fisioterapia a domicilio&lt;/li&gt;&lt;li&gt;pacchetti di assistenza per i comuni&lt;/li&gt;&lt;li&gt;sostituzioni d&#x27;emergenza&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;La reputazione si regge su tre cose&lt;/h4&gt;
      &lt;p style=&quot;font-family:var(--serif);font-size:1.5rem;margin:.2em 0&quot;&gt;reliability · empathy · flexibility&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;affidabilità, empatia, flessibilità. Tutte e tre dipendono dalle &lt;strong&gt;persone&lt;/strong&gt; che erogano il servizio: è il filo rosso di tutto il caso.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La crescita rapida ha reso l&#x27;azienda difficile da gestire: turni complessi, famiglie che chiedono cambi all&#x27;ultimo minuto, comuni che vogliono prezzi più bassi e reportistica dettagliata, dipendenti che lamentano turni imprevedibili e pressione.&lt;/p&gt;

  &lt;h3&gt;I protagonisti&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Tocca un ruolo per leggere la sua posizione. Ognuno guarda il budget da un punto di vista diverso, ed è proprio questo il cuore della discussione.&lt;/p&gt;
  &lt;div data-people&gt;
    &lt;div class=&quot;people&quot;&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;CEO&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Emma Ricci&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Emma, CEO.&lt;/b&gt; Vuole un budget formale per «pianificare le risorse, coordinare i reparti e capire se siamo finanziariamente sostenibili». Alla fine riconosce che il budget ha migliorato la &lt;em&gt;financial discipline&lt;/em&gt; ma ha creato tensione, comportamenti difensivi e decisioni di breve periodo: «se il processo spinge i manager a difendere i numeri del reparto invece di coordinarsi attorno al cliente, dobbiamo ripensare il modo in cui facciamo budget».&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;CFO&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Lorenzo Bianchi&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lorenzo, CFO.&lt;/b&gt; Introduce il processo strutturato (revenue, staffing, training, travel &amp;amp; coordination, cash budget, budgeted income statement). Rappresenta la pressione del board sulla redditività: «Il budget non può limitarsi a riflettere i vincoli attuali. Deve spingere l&#x27;organizzazione a migliorare». Chiede tagli dell&#x27;8% ai costi discrezionali e introduce la regola che riduce il budget a chi resta sotto per due mesi.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Commerciale&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Laura&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Laura, commercial director.&lt;/b&gt; Prevede +20% di ricavi (espansione dei contratti con i comuni, domanda di post-ospedaliero, nuova provincia). «Se siamo troppo prudenti, i concorrenti prenderanno l&#x27;opportunità. Servono target sfidanti». A fine trimestre: «Se riduciamo i target ora mandiamo il messaggio sbagliato. La crescita richiede pressione». È valutata sulla crescita dei ricavi, quindi firma contratti anche senza conferma dell&#x27;operations.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Operations&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Paolo&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Paolo, operations manager.&lt;/b&gt; Gestisce i coordinatori che assegnano i care workers ai clienti; già oggi fatica a coprire sere, weekend e festivi. «Possiamo vendere più ore, ma qualcuno deve erogarle». Poi: «Ogni reparto protegge il proprio budget, ma le famiglie vivono CarePlus come un&#x27;unica azienda» e «La pressione non è la stessa cosa della pianificazione».&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;HR&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Sara&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sara, HR manager.&lt;/b&gt; Reclutare care workers qualificati è difficile, il &lt;em&gt;turnover&lt;/em&gt; (rotazione del personale: quota di dipendenti che lascia e va sostituita) è in aumento, la formazione richiede tempo e non si possono mandare persone non formate da clienti fragili. «Il sistema insegna ai manager a difendere il budget, non a migliorare il servizio». «Le persone non sono solo un costo variabile. Sono il servizio».&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Qualità&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Giulia&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Giulia, quality manager.&lt;/b&gt; «Stiamo riducendo i costi, ma alcuni risparmi possono danneggiare la qualità. Nel nostro business la qualità dipende da persone, relazioni e fiducia». E chiude: «Misuriamo i costi con grande attenzione, ma non misuriamo abbastanza cosa succede a qualità del servizio, continuità dell&#x27;assistenza e fiducia dei clienti».&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pdetail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La storia passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps-dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Prima&quot;&gt;&lt;h4&gt;Prima: un budget “della finanza”&lt;/h4&gt;&lt;p&gt;Il budget è preparato quasi solo dal reparto finanza, partendo dai &lt;strong&gt;costi dell&#x27;anno precedente più le variazioni attese&lt;/strong&gt;. È il classico &lt;em class=&quot;t&quot;&gt;incremental budgeting&lt;/em&gt; (budget incrementale: si prende lo storico e lo si aggiusta di qualche punto percentuale). I responsabili di reparto danno informazioni ma non sono davvero coinvolti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Ottobre&quot;&gt;&lt;h4&gt;Ottobre: si prepara il budget dell&#x27;anno dopo&lt;/h4&gt;&lt;p&gt;Laura propone +20% di ricavi. Paolo e Sara avvertono che mancano persone e che la formazione richiede tempo. Il CFO ricorda che il board vuole più redditività.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Approvazione&quot;&gt;&lt;h4&gt;Il budget approvato&lt;/h4&gt;&lt;p&gt;La prima versione passa “con modifiche minori”: &lt;strong&gt;+20% di ore di servizio&lt;/strong&gt; ma solo &lt;strong&gt;+7% di care workers&lt;/strong&gt;. La finanza conta di colmare il gap con scheduling migliore, meno tempi morti (&lt;em&gt;idle time&lt;/em&gt;) e coordinamento più efficiente. Le obiezioni operative sono state ascoltate, non incorporate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Tagli&quot;&gt;&lt;h4&gt;Tagli dell&#x27;8% ai costi discrezionali&lt;/h4&gt;&lt;p&gt;Customer service riduce i temporanei nelle ore di punta → attese al telefono più lunghe, più reclami. Si taglia la formazione. L&#x27;operations taglia i costi di viaggio assegnando i care workers per vicinanza geografica → si perde la &lt;strong&gt;continuità&lt;/strong&gt; con l&#x27;operatore di fiducia.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Report mensili&quot;&gt;&lt;h4&gt;Budget performance report mensili&lt;/h4&gt;&lt;p&gt;Ogni mese la finanza confronta consuntivo e budget; i manager devono spiegare gli scostamenti (&lt;em&gt;variances&lt;/em&gt;) davanti a CEO e CFO. Dopo pochi mesi i comportamenti cambiano: niente straordinari, formazione rinviata, contratti firmati senza verificare la capacità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Regola&quot;&gt;&lt;h4&gt;La regola “sotto budget = budget ridotto”&lt;/h4&gt;&lt;p&gt;Se un reparto resta sotto budget per due mesi consecutivi, il budget futuro viene ridotto. Effetto: nessuno vuole mostrare risparmi; c&#x27;è chi rinvia spese e chi spende il residuo a fine mese.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Fine Q1&quot;&gt;&lt;h4&gt;La riunione di fine trimestre&lt;/h4&gt;&lt;p&gt;Ricavi in crescita ma sotto budget; costo del lavoro sopra le attese; reclami in aumento; turnover invariato; coordinatori più stressati; alcuni contratti redditizi “sulla carta” ma ingestibili. Emma conclude che va ripensato il modo di fare budget.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · il caso&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il budget “storico” di CarePlus si chiama incrementale, e qual è il suo limite principale?&lt;/summary&gt;&lt;div&gt;Perché parte dai costi dell&#x27;anno prima e aggiunge le variazioni attese. È semplice, ma dà per scontato che la struttura di costo attuale sia corretta e non obbliga a ripensare &lt;em&gt;come&lt;/em&gt; si usano le risorse; inoltre, fatto solo dalla finanza, ignora le informazioni di chi eroga il servizio.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale numero del budget approvato rivela già il problema che esploderà a fine trimestre?&lt;/summary&gt;&lt;div&gt;+20% di ore contro +7% di care workers: ogni operatore dovrebbe produrre circa il 12% di ore in più (1,20 / 1,07 ≈ 1,12). Un&#x27;ipotesi di efficienza molto ambiziosa, in un&#x27;azienda che già non riesce a coprire tutti i turni.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Su quali tre elementi si fonda la reputazione di CarePlus, e perché contano per il budget?&lt;/summary&gt;&lt;div&gt;Reliability, empathy, flexibility. Tutti e tre dipendono dal personale: un budget che tratta le persone solo come costo da comprimere rischia di erodere proprio la fonte del vantaggio competitivo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 COSA FA IL BUDGET ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;budget&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;h2&gt;Cosa sta facendo davvero il budget?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 1 · note del docente p. 4&lt;/span&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budget.&lt;/b&gt; Piano quantitativo, di solito annuale e in termini monetari, che traduce gli obiettivi dell&#x27;azienda in risorse, ricavi e costi attesi per ciascuna area di responsabilità. Serve sia &lt;strong&gt;ex ante&lt;/strong&gt; (pianificare e coordinare) sia &lt;strong&gt;ex post&lt;/strong&gt; (confrontare consuntivo e previsione, cioè controllo).&lt;/div&gt;

  &lt;h3&gt;Il master budget che il CFO vuole introdurre&lt;/h3&gt;
  &lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;master budget&lt;/em&gt; (budget generale) è l&#x27;insieme coordinato dei budget parziali. Nel caso il CFO elenca sei pezzi: il diagramma mostra come si collegano. Tutto parte dalla previsione dei ricavi: se quella è gonfiata, l&#x27;errore si propaga ovunque.&lt;/p&gt;

    &lt;rect x=&quot;240&quot; y=&quot;121&quot; width=&quot;178&quot; height=&quot;58&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;329&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Training budget&lt;/text&gt;&lt;text x=&quot;329&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;formazione nuovi assunti&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;202&quot; width=&quot;178&quot; height=&quot;58&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;329&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Travel &amp;amp; coordination&lt;/text&gt;&lt;text x=&quot;329&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;spostamenti, coordinatori&lt;/text&gt;
    &lt;rect x=&quot;492&quot; y=&quot;115&quot; width=&quot;188&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;586&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Budgeted income&lt;/text&gt;&lt;text x=&quot;586&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;statement&lt;/text&gt;
    &lt;rect x=&quot;710&quot; y=&quot;115&quot; width=&quot;132&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;776&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Cash budget&lt;/text&gt;&lt;text x=&quot;776&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;entrate/uscite&lt;/text&gt;
    &lt;text x=&quot;100&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;punto di partenza&lt;/text&gt;
    &lt;text x=&quot;400&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;ricavi&lt;/text&gt;
    &lt;text x=&quot;250&quot; y=&quot;290&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;operating budgets&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;290&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;financial budgets&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;I budget operativi (verde) derivano dalla domanda prevista; il conto economico previsionale (&lt;em&gt;budgeted income statement&lt;/em&gt;) li riassume in un risultato; il &lt;em&gt;cash budget&lt;/em&gt; traduce tutto in flussi di cassa, utile perché i comuni spesso pagano in ritardo mentre gli stipendi escono ogni mese.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le funzioni del budget&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Il manuale elenca diverse funzioni; il caso mostra che possono entrare in conflitto tra loro. Scorri le linguette.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Planning&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Coordination&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Communication&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Control&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Motivation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Evaluation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Pianificare&lt;/strong&gt;: anticipare domanda e risorse. In CarePlus “ci obbliga a pensare ai fabbisogni di risorse” (note del docente). Ma un piano che ignora il vincolo di personale è un desiderio, non un piano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Coordinare&lt;/strong&gt; i reparti: le ore vendute dal commerciale devono essere coperte da operations, con persone reclutate e formate da HR. È esattamente ciò che è mancato: ogni reparto ha ottimizzato il proprio pezzo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Comunicare&lt;/strong&gt; obiettivi e vincoli lungo la gerarchia, in entrambe le direzioni. In CarePlus la comunicazione è stata soprattutto top-down: le informazioni di Paolo e Sara sono state ascoltate ma non usate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Controllare&lt;/strong&gt;: confrontare consuntivo e budget e analizzare gli scostamenti (&lt;em&gt;variance analysis&lt;/em&gt;). Il budget “rende visibili i costi”, ed è un merito reale riconosciuto dalle note del docente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Motivare&lt;/strong&gt;: un target sfidante ma raggiungibile può spingere a migliorare (è la tesi del CFO e di Laura). Se percepito come irrealistico o ingiusto, ottiene l&#x27;effetto opposto (cfr. sezione 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Valutare&lt;/strong&gt; la performance dei manager. È l&#x27;uso che genera più effetti collaterali: quando il budget diventa il metro con cui si giudica una persona, la persona inizia a gestire il &lt;em&gt;numero&lt;/em&gt; invece della realtà.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Intended vs actual: la risposta del docente&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 250&quot; role=&quot;img&quot; aria-label=&quot;Confronto fra ciò che il budget doveva fare e ciò che fa&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;400&quot; height=&quot;230&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;rect x=&quot;450&quot; y=&quot;10&quot; width=&quot;400&quot; height=&quot;230&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot;/&gt;
    &lt;text x=&quot;210&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; style=&quot;font-family:var(--serif)&quot;&gt;Cosa doveva fare&lt;/text&gt;
    &lt;text x=&quot;650&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; style=&quot;font-family:var(--serif)&quot;&gt;Cosa fa anche&lt;/text&gt;
    &lt;g font-size=&quot;14&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;85&quot;&gt;✓ supportare planning &amp;amp; control&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;118&quot;&gt;✓ rendere visibili i costi&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;151&quot;&gt;✓ far pensare ai fabbisogni di risorse&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;184&quot;&gt;✓ disciplina finanziaria&lt;/text&gt;&lt;/g&gt;
    &lt;g font-size=&quot;14&quot;&gt;&lt;text x=&quot;480&quot; y=&quot;85&quot;&gt;✗ diventa un pressure mechanism&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;118&quot;&gt;✗ crea paura degli scostamenti sfavorevoli&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;151&quot;&gt;✗ spinge a difendere il budget del reparto&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;184&quot;&gt;✗ decisioni di breve periodo&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M415 125 L445 125&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a2)&quot;/&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Messaggio chiave della lezione: &lt;strong&gt;i budget non sono strumenti tecnici neutrali&lt;/strong&gt;. Influenzano comportamenti, comunicazione, priorità e rapporti di potere.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Comportamenti&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Ciò che viene misurato e discusso ogni mese diventa ciò su cui le persone si concentrano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Priorità&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il costo, misurato con precisione, prevale sulla qualità, che non è misurata.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Potere&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Chi scrive il budget (finanza, commerciale) definisce il problema; chi lo subisce (operations, HR) ne paga le conseguenze.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · funzioni del budget&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In che senso un budget “non è neutrale”? Fai un esempio dal caso.&lt;/summary&gt;&lt;div&gt;Non si limita a descrivere: orienta l&#x27;attenzione e i comportamenti. Esempio: misurando il costo del lavoro del customer service ma non i tempi d&#x27;attesa, il budget ha spinto a tagliare i temporanei nelle ore di punta, con più reclami.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il revenue budget è il “primo domino” del master budget?&lt;/summary&gt;&lt;div&gt;Perché da esso derivano staffing, training, viaggi e quindi conto economico e cassa. Se la previsione dei ricavi è ottimistica e non verificata con la capacità, tutti gli altri budget poggiano su una base sbagliata.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali due funzioni del budget sono entrate più in conflitto in CarePlus?&lt;/summary&gt;&lt;div&gt;Pianificazione/coordinamento (servono informazioni oneste e condivise) contro valutazione/pressione (spinge a proteggere il proprio numero). Usare lo stesso budget per entrambe le cose crea incentivi a distorcerlo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 TRADE-OFF ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;tradeoff&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;h2&gt;Le tensioni tra crescita, controllo dei costi e qualità&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 2 · note del docente p. 4&lt;/span&gt;
  &lt;p&gt;Un &lt;em class=&quot;t&quot;&gt;trade-off&lt;/em&gt; è una scelta in cui migliorare una dimensione costa qualcosa su un&#x27;altra. Il punto del docente: &lt;strong&gt;il budgeting richiede una discussione esplicita dei trade-off, non solo la fissazione di target numerici&lt;/strong&gt;. In CarePlus i trade-off sono stati “risolti” implicitamente, scrivendo numeri che li ignoravano.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 400&quot; role=&quot;img&quot; aria-label=&quot;Triangolo delle tensioni: crescita, costi, qualità&quot;&gt;
    &lt;polygon points=&quot;430,40 120,350 740,350&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;circle cx=&quot;430&quot; cy=&quot;40&quot; r=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Crescita&lt;/text&gt;
    &lt;circle cx=&quot;120&quot; cy=&quot;350&quot; r=&quot;34&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;347&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Controllo&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;costi&lt;/text&gt;
    &lt;circle cx=&quot;740&quot; cy=&quot;350&quot; r=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;740&quot; y=&quot;355&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Qualità&lt;/text&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;text x=&quot;160&quot; y=&quot;150&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot;&gt;↔ ore +20% vs staff +7%&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;178&quot;&gt;capacità limitata di erogare&lt;/text&gt;
      &lt;text x=&quot;590&quot; y=&quot;150&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;contratti vs fattibilità ↔&lt;/text&gt;
      &lt;text x=&quot;590&quot; y=&quot;178&quot;&gt;firmare senza conferma ops&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;388&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;lavoro · formazione · viaggi · redditività&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;300&quot;&gt;customer service ↔ responsiveness&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;275&quot;&gt;training ↔ preparazione degli operatori&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;250&quot;&gt;travel ↔ continuity of care&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;325&quot;&gt;profitability ↔ burnout&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Le sei tensioni indicate dalle note del docente, collocate sui lati del triangolo. Quasi tutte stanno sul lato “costi ↔ qualità”: il risparmio è immediato e misurato, il danno arriva dopo e non è misurato.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Simulatore: l&#x27;ipotesi di produttività nascosta nel budget&lt;/h3&gt;
  &lt;p&gt;Se le ore crescono più delle persone, ogni persona deve lavorare (o essere impiegata) di più. La crescita richiesta della produttività per operatore è:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Δ produttività = (1 + g&lt;sub&gt;ore&lt;/sub&gt;) / (1 + g&lt;sub&gt;staff&lt;/sub&gt;) − 1&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Con i dati del caso: 1,20 / 1,07 − 1 ≈ &lt;strong&gt;+12,1%&lt;/strong&gt; di ore per operatore. Muovi i cursori: l&#x27;ultimo indica quanta efficienza (scheduling migliore, meno idle time) ritieni davvero realistica. Il resto del gap va coperto con straordinari, o non viene coperto.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;simCap&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gH&quot;&gt;Crescita ore di servizio&lt;/label&gt;&lt;input id=&quot;gH&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;35&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;gHo&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gS&quot;&gt;Crescita care workers&lt;/label&gt;&lt;input id=&quot;gS&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;gSo&quot;&gt;7%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gE&quot;&gt;Efficienza realistica&lt;/label&gt;&lt;input id=&quot;gE&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;15&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;gEo&quot;&gt;4%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kReq&quot;&gt;12,1%&lt;/b&gt;&lt;span&gt;ore in più richieste a ogni operatore&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kGap&quot;&gt;7,8%&lt;/b&gt;&lt;span&gt;gap scoperto dopo l&#x27;efficienza&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kOT&quot;&gt;≈ 3,1 h&lt;/b&gt;&lt;span&gt;straordinario/settimana per operatore (base 40 h, solo indicativo)&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:12px&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--rule)&quot;/&gt;
      &lt;rect id=&quot;bE&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;rect id=&quot;bG&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; fill=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;64&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;verde = coperto da efficienza · rosso = da coprire con straordinari, nuove assunzioni o servizio non erogato&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;vCap&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var h=document.getElementById(&#x27;gH&#x27;),s=document.getElementById(&#x27;gS&#x27;),e=document.getElementById(&#x27;gE&#x27;);
    function f(x){return x.toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)}
    function up(){
      var gh=+h.value/100,gs=+s.value/100,ge=+e.value/100;
      document.getElementById(&#x27;gHo&#x27;).textContent=h.value+&#x27;%&#x27;;document.getElementById(&#x27;gSo&#x27;).textContent=s.value+&#x27;%&#x27;;document.getElementById(&#x27;gEo&#x27;).textContent=e.value+&#x27;%&#x27;;
      var req=Math.max(0,(1+gh)/(1+gs)-1),gap=Math.max(0,(1+req)/(1+ge)-1),cov=Math.min(req,ge);
      document.getElementById(&#x27;kReq&#x27;).textContent=f(req*100)+&#x27;%&#x27;;document.getElementById(&#x27;kGap&#x27;).textContent=f(gap*100)+&#x27;%&#x27;;
      document.getElementById(&#x27;kOT&#x27;).textContent=&#x27;≈ &#x27;+f(gap*40)+&#x27; h&#x27;;
      var sc=600/0.35;document.getElementById(&#x27;bE&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,cov*sc));
      var bg=document.getElementById(&#x27;bG&#x27;);bg.setAttribute(&#x27;x&#x27;,Math.min(600,cov*sc));bg.setAttribute(&#x27;width&#x27;,Math.max(0,Math.min(600-cov*sc,gap*sc)));
      var v=document.getElementById(&#x27;vCap&#x27;);
      if(gap&lt;=0.005){v.textContent=&#x27;Piano coerente: la crescita delle ore è coperta da persone ed efficienza realistica.&#x27;;v.style.background=&#x27;var(--sage-bg)&#x27;}
      else if(gap&lt;0.05){v.textContent=&#x27;Gap moderato: gestibile solo se esplicitato e discusso (chi lo copre? con quali costi?).&#x27;;v.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{v.textContent=&#x27;Gap rilevante: il budget “promette” ore che nessuno può erogare. Il problema ricadrà su operations (Paolo), come accaduto nel caso.&#x27;;v.style.background=&#x27;var(--brick-bg)&#x27;}
    }
    [h,s,e].forEach(function(x){x.addEventListener(&#x27;input&#x27;,up)});up();
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;Nota sul simulatore: è un&#x27;elaborazione didattica sui due numeri del caso (+20% ore, +7% staff). Le 40 ore settimanali e la percentuale di efficienza sono ipotesi di esempio, non dati delle slide.&lt;/p&gt;

  &lt;h3&gt;I tagli dell&#x27;8%: risparmio visibile, costo nascosto&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discretionary costs.&lt;/b&gt; Costi discrezionali: spese decise periodicamente dal management senza un legame tecnico preciso con il volume prodotto (formazione, temporanei extra, alcune spese di coordinamento). Si distinguono dai &lt;em&gt;committed costs&lt;/em&gt; (impegnati, es. affitti) e dagli &lt;em&gt;engineered costs&lt;/em&gt; (legati in modo misurabile all&#x27;output, es. ore di assistenza erogate). Proprio perché “discrezionali”, sono i primi a essere tagliati, ma spesso sono investimenti in capacità e qualità.&lt;/div&gt;
  &lt;p&gt;Un taglio uniforme &lt;em&gt;across-the-board&lt;/em&gt; (uguale per tutti, qui l&#x27;8%) è semplice da comunicare ma ignora dove ogni euro crea valore. Apri ogni scheda per seguire la catena causa-effetto.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Customer service&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Training&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Travel&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Contratti&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Azione:&lt;/strong&gt; meno temporanei nelle ore di punta. &lt;strong&gt;Risparmio:&lt;/strong&gt; costo del lavoro del reparto. &lt;strong&gt;Effetto nascosto:&lt;/strong&gt; attese al telefono più lunghe → più reclami → più carico sul customer service stesso e reputazione erosa. Tensione: &lt;em&gt;reducing labor costs vs maintaining responsiveness&lt;/em&gt; (reattività verso il cliente).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Azione:&lt;/strong&gt; budget formazione ridotto, sessioni rinviate. &lt;strong&gt;Effetto nascosto:&lt;/strong&gt; nuovi assunti non pronti a lavorare da soli con clienti fragili; più errori, più stress, più turnover, quindi ancora più assunzioni da formare. Tensione: &lt;em&gt;reducing training costs vs protecting service quality&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Azione:&lt;/strong&gt; assegnazioni per vicinanza geografica. &lt;strong&gt;Risparmio:&lt;/strong&gt; tempi e costi di viaggio. &lt;strong&gt;Effetto nascosto:&lt;/strong&gt; le famiglie perdono l&#x27;operatore di cui si fidavano. La &lt;em class=&quot;t&quot;&gt;continuity of care&lt;/em&gt; (continuità dell&#x27;assistenza: stessa persona, stessa relazione nel tempo) è parte del prodotto, non un dettaglio. Tensione: &lt;em&gt;travel costs vs continuity with trusted care workers&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Azione:&lt;/strong&gt; firmare nuovi contratti per raggiungere il target di ricavi. &lt;strong&gt;Effetto nascosto:&lt;/strong&gt; contratti “profitable on paper” ma difficili da gestire; pressione sui turni; rischio di &lt;em&gt;burnout&lt;/em&gt; (esaurimento da stress cronico) per coordinatori e operatori. Tensioni: &lt;em&gt;new contracts vs operational feasibility&lt;/em&gt; e &lt;em&gt;profitability vs employee burnout&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Come discuterli nel processo di budget? Una pratica utile è rendere ogni trade-off una riga esplicita del documento: “se tagliamo X, prevediamo questo effetto su Y; lo monitoriamo con l&#x27;indicatore Z”. Così il costo nascosto diventa visibile e qualcuno ne è responsabile.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · trade-off&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Calcola la produttività implicita se le ore crescono del 20% e lo staff del 10%.&lt;/summary&gt;&lt;div&gt;1,20 / 1,10 − 1 ≈ 9,1% di ore in più per operatore. Ancora alto, ma meno del 12,1% del caso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché i tagli ai costi discrezionali sono “pericolosi” in un&#x27;azienda di servizi alla persona?&lt;/summary&gt;&lt;div&gt;Perché molti costi discrezionali (formazione, personale nelle ore di punta, tempo per la continuità) sono ciò che produce qualità. Il risparmio si vede subito nel report; il danno (reclami, turnover, reputazione) arriva più tardi e non è misurato dal budget.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Elenca le sei tensioni indicate dal docente.&lt;/summary&gt;&lt;div&gt;Ore di servizio vs staff disponibile; costo del lavoro vs reattività; formazione vs qualità; viaggi vs continuità con l&#x27;operatore di fiducia; nuovi contratti vs fattibilità operativa; redditività vs burnout.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 CHI PARTECIPA ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;chi&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;h2&gt;Chi dovrebbe partecipare al budgeting?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;domanda 3 · note del docente pp. 4–5&lt;/span&gt;
  &lt;p&gt;Ogni reparto possiede un pezzo di informazione che gli altri non hanno: si parla di &lt;em class=&quot;t&quot;&gt;information asymmetry&lt;/em&gt; (asimmetria informativa). Chi sta “vicino al lavoro” conosce vincoli e capacità reali; il vertice conosce la strategia. Un buon processo di budget mette insieme le due cose.&lt;/p&gt;

  &lt;h3&gt;Tre modi di costruire il budget&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Top-down&lt;/th&gt;&lt;th&gt;Bottom-up&lt;/th&gt;&lt;th&gt;Participative&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Chi decide&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Vertice/finanza, poi comunica i numeri&lt;/td&gt;&lt;td&gt;I reparti propongono, il vertice somma&lt;/td&gt;&lt;td&gt;Vertice fissa la direzione; reparti costruiscono e negoziano&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Pregi&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Veloce, coerente con gli obiettivi del board&lt;/td&gt;&lt;td&gt;Usa l&#x27;informazione locale&lt;/td&gt;&lt;td&gt;Informazione migliore + più &lt;em&gt;commitment&lt;/em&gt; (adesione) ai target&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Rischi&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Target irrealistici, scarsa adesione&lt;/td&gt;&lt;td&gt;Budgetary slack, poca visione d&#x27;insieme&lt;/td&gt;&lt;td&gt;Più tempo; slack se non c&#x27;è fiducia&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;CarePlus&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;È di fatto ciò che è successo&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;È ciò che suggerisce il docente&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;La conclusione delle note: un processo &lt;strong&gt;più partecipativo&lt;/strong&gt;, che però lascia al top management il compito di fissare la direzione strategica.&lt;/p&gt;

  &lt;h3&gt;Il contributo informativo di ciascun ruolo&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 420&quot; role=&quot;img&quot; aria-label=&quot;Ruoli che partecipano al budget e informazioni che portano&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;a4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;circle cx=&quot;430&quot; cy=&quot;210&quot; r=&quot;78&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;430&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; style=&quot;font-family:var(--serif)&quot;&gt;Budget&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;condiviso&lt;/text&gt;
    &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#a4)&quot; fill=&quot;none&quot;&gt;
      &lt;path d=&quot;M430 66 L430 128&quot;/&gt;&lt;path d=&quot;M640 110 L496 170&quot;/&gt;&lt;path d=&quot;M660 300 L506 240&quot;/&gt;&lt;path d=&quot;M430 352 L430 292&quot;/&gt;&lt;path d=&quot;M200 300 L354 240&quot;/&gt;&lt;path d=&quot;M220 110 L364 170&quot;/&gt;&lt;path d=&quot;M140 210 L350 210&quot;/&gt;
    &lt;/g&gt;

      &lt;rect x=&quot;600&quot; y=&quot;70&quot; width=&quot;240&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Commercial / sales&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;domanda attesa, contratti possibili&lt;/text&gt;
      &lt;rect x=&quot;620&quot; y=&quot;290&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;735&quot; y=&quot;310&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Operations&lt;/text&gt;&lt;text x=&quot;735&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;scheduling, capacità di erogazione&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;354&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;374&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;HR&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;392&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;recruiting, training, turnover&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;290&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;310&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Quality&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;standard, soddisfazione clienti&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer service&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;volumi di chiamate, reclami&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;186&quot; width=&quot;130&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Finance&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;costi, cassa, profitto&lt;/text&gt;
