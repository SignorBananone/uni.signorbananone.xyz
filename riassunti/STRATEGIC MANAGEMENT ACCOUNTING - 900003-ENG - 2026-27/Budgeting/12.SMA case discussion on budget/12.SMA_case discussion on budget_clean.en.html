  &lt;h1&gt;Rethinking the budget:&lt;br&gt;the CarePlus Services case&lt;/h1&gt;

    &lt;a href=&quot;#controllo&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;470&quot; y=&quot;320&quot; width=&quot;150&quot; height=&quot;52&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;6 · Controllability&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;interdependence&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
    &lt;a href=&quot;#comportamenti&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;640&quot; y=&quot;306&quot; width=&quot;220&quot; height=&quot;66&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;334&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;5 · Behaviours&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;354&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;variance, slack, “use it or lose it”&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
    &lt;a href=&quot;#cultura&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;428&quot; width=&quot;260&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;455&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;7 · Motivation and service culture&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;475&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;“People are the service”&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
    &lt;a href=&quot;#ripensare&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;440&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;470&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;8 · Rethinking the budget →&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
    &lt;a href=&quot;#fonti&quot;&gt;&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;440&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;470&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Further reading&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

  &lt;p class=&quot;small&quot;&gt;Click a node to jump to the section. The arrows read the case as a chain: the budget is introduced to manage growth, it must balance conflicting objectives, and the way it measures people changes their behaviour and, ultimately, the service culture.&lt;/p&gt;

&lt;!-- ============ 1 IL CASO ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
  &lt;h2&gt;The case: CarePlus Services Ltd.&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · pp. 1–3&lt;/span&gt;
  &lt;p&gt;CarePlus is a &lt;strong&gt;medium-sized service company&lt;/strong&gt; providing home care to elderly people and people with limited autonomy. It has about &lt;strong&gt;220 employees&lt;/strong&gt; (care workers, nurses, coordinators, administrative staff, customer service) and a very diverse client base: private families, municipalities, &lt;em&gt;nursing homes&lt;/em&gt; and healthcare foundations.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Services offered&lt;/h4&gt;
      &lt;ul&gt;&lt;li&gt;day and night home care&lt;/li&gt;&lt;li&gt;&lt;em&gt;post-hospitalization support&lt;/em&gt;&lt;/li&gt;&lt;li&gt;home physiotherapy&lt;/li&gt;&lt;li&gt;care packages for municipalities&lt;/li&gt;&lt;li&gt;emergency replacements&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Its reputation rests on three things&lt;/h4&gt;
      &lt;p style=&quot;font-family:var(--serif);font-size:1.5rem;margin:.2em 0&quot;&gt;reliability · empathy · flexibility&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;All three depend on the &lt;strong&gt;people&lt;/strong&gt; who deliver the service: this is the common thread running through the whole case.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Rapid growth has made the company hard to manage: complex shift schedules, families requesting last-minute changes, municipalities demanding lower prices and detailed reporting, and employees complaining about unpredictable shifts and pressure.&lt;/p&gt;

  &lt;h3&gt;The key actors&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Tap a role to read their position. Each one looks at the budget from a different perspective, and this is precisely the heart of the discussion.&lt;/p&gt;
  &lt;div data-people&gt;
    &lt;div class=&quot;people&quot;&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;CEO&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Emma Ricci&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Emma, CEO.&lt;/b&gt; Wants a formal budget to “plan resources, coordinate departments and understand whether we are financially sustainable”. In the end she acknowledges that the budget has improved &lt;em&gt;financial discipline&lt;/em&gt; but has created tension, defensive behaviour and short-term decisions: “if the process pushes managers to defend their department&#x27;s numbers instead of coordinating around the client, we need to rethink the way we budget”.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;CFO&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Lorenzo Bianchi&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lorenzo, CFO.&lt;/b&gt; Introduces the structured process (revenue, staffing, training, travel &amp;amp; coordination, cash budget, budgeted income statement). He represents the board&#x27;s pressure on profitability: “The budget cannot simply reflect current constraints. It must push the organisation to improve”. He requests 8% cuts in discretionary costs and introduces the rule that reduces the budget of any department that stays under budget for two months.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Commercial&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Laura&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Laura, commercial director.&lt;/b&gt; Forecasts +20% revenue (expansion of municipal contracts, demand for post-hospitalization care, a new province). “If we are too cautious, competitors will take the opportunity. We need challenging targets”. At the end of the quarter: “If we reduce the targets now, we send the wrong message. Growth requires pressure”. She is evaluated on revenue growth, so she signs contracts even without confirmation from operations.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Operations&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Paolo&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Paolo, operations manager.&lt;/b&gt; Manages the coordinators who assign care workers to clients; he already struggles to cover evenings, weekends and holidays. “We can sell more hours, but someone has to deliver them”. Later: “Each department protects its own budget, but families experience CarePlus as one company” and “Pressure is not the same as planning”.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;HR&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Sara&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sara, HR manager.&lt;/b&gt; Recruiting qualified care workers is difficult, &lt;em&gt;turnover&lt;/em&gt; (the share of employees who leave and must be replaced) is rising, training takes time, and untrained staff cannot be sent to vulnerable clients. “The system is teaching managers to defend their budget, not to improve the service”. “People are not just a variable cost. They are the service”.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
      &lt;button class=&quot;person&quot; type=&quot;button&quot;&gt;&lt;div class=&quot;r&quot;&gt;Quality&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Giulia&lt;/div&gt;&lt;template&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Giulia, quality manager.&lt;/b&gt; “We are reducing costs, but some savings may damage quality. In our business, quality depends on people, relationships and trust”. And she concludes: “We measure costs very carefully, but we do not measure enough what happens to service quality, continuity of care and client trust”.&lt;/div&gt;&lt;/template&gt;&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pdetail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The story step by step&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps-dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Before&quot;&gt;&lt;h4&gt;Before: a “finance-owned” budget&lt;/h4&gt;&lt;p&gt;The budget is prepared almost entirely by the finance department, starting from &lt;strong&gt;the previous year&#x27;s costs plus expected changes&lt;/strong&gt;. This is classic &lt;em class=&quot;t&quot;&gt;incremental budgeting&lt;/em&gt; (historical figures are taken and adjusted by a few percentage points). Department heads provide information but are not genuinely involved.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;October&quot;&gt;&lt;h4&gt;October: preparing next year&#x27;s budget&lt;/h4&gt;&lt;p&gt;Laura proposes +20% revenue. Paolo and Sara warn that staff are lacking and that training takes time. The CFO reminds everyone that the board wants higher profitability.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Approval&quot;&gt;&lt;h4&gt;The approved budget&lt;/h4&gt;&lt;p&gt;The first version passes “with minor changes”: &lt;strong&gt;+20% service hours&lt;/strong&gt; but only &lt;strong&gt;+7% care workers&lt;/strong&gt;. Finance expects to close the gap through better scheduling, less &lt;em&gt;idle time&lt;/em&gt; and more efficient coordination. The operational objections were heard, not incorporated.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Cuts&quot;&gt;&lt;h4&gt;8% cuts in discretionary costs&lt;/h4&gt;&lt;p&gt;Customer service reduces temporary staff at peak hours → longer phone waiting times, more complaints. Training is cut. Operations cuts travel costs by assigning care workers based on geographical proximity → &lt;strong&gt;continuity&lt;/strong&gt; with the trusted care worker is lost.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Monthly reports&quot;&gt;&lt;h4&gt;Monthly budget performance reports&lt;/h4&gt;&lt;p&gt;Every month finance compares actuals with the budget; managers must explain the &lt;em&gt;variances&lt;/em&gt; in front of the CEO and CFO. Within a few months behaviour changes: no overtime, training postponed, contracts signed without checking capacity.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Rule&quot;&gt;&lt;h4&gt;The “under budget = reduced budget” rule&lt;/h4&gt;&lt;p&gt;If a department stays under budget for two consecutive months, its future budget is reduced. Effect: nobody wants to show savings; some postpone expenses and others spend the remainder at the end of the month.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;End of Q1&quot;&gt;&lt;h4&gt;The end-of-quarter meeting&lt;/h4&gt;&lt;p&gt;Revenue is growing but below budget; labour costs are above expectations; complaints are increasing; turnover is unchanged; coordinators are more stressed; some contracts are profitable “on paper” but unmanageable. Emma concludes that the way the company budgets must be rethought.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · the case&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is CarePlus&#x27;s “historical” budget called incremental, and what is its main limitation?&lt;/summary&gt;&lt;div&gt;Because it starts from the previous year&#x27;s costs and adds the expected changes. It is simple, but it assumes that the current cost structure is correct and does not force the organisation to rethink &lt;em&gt;how&lt;/em&gt; resources are used; moreover, being prepared by finance alone, it ignores the information held by those who deliver the service.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which figure in the approved budget already reveals the problem that will erupt at the end of the quarter?&lt;/summary&gt;&lt;div&gt;+20% hours against +7% care workers: each care worker would have to deliver about 12% more hours (1.20 / 1.07 ≈ 1.12). A very ambitious efficiency assumption, in a company that already cannot cover all its shifts.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;On which three elements is CarePlus&#x27;s reputation based, and why do they matter for the budget?&lt;/summary&gt;&lt;div&gt;Reliability, empathy, flexibility. All three depend on staff: a budget that treats people merely as a cost to be squeezed risks eroding the very source of competitive advantage.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 COSA FA IL BUDGET ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;budget&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;h2&gt;What is the budget really doing?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 1 · instructor&#x27;s notes p. 4&lt;/span&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budget.&lt;/b&gt; A quantitative plan, usually annual and expressed in monetary terms, that translates the company&#x27;s objectives into expected resources, revenues and costs for each area of responsibility. It serves both &lt;strong&gt;ex ante&lt;/strong&gt; (planning and coordination) and &lt;strong&gt;ex post&lt;/strong&gt; (comparing actuals with the plan, i.e. control).&lt;/div&gt;

  &lt;h3&gt;The master budget the CFO wants to introduce&lt;/h3&gt;
  &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;master budget&lt;/em&gt; is the coordinated set of individual budgets. In the case the CFO lists six components: the diagram shows how they are linked. Everything starts from the revenue forecast: if that is inflated, the error propagates everywhere.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;CarePlus master budget flow&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;a2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; fill=&quot;none&quot; stroke-width=&quot;1.4&quot; marker-end=&quot;url(#a2)&quot;&gt;
      &lt;path d=&quot;M180 150 L238 70&quot;/&gt;&lt;path d=&quot;M180 150 L238 150&quot;/&gt;&lt;path d=&quot;M180 150 L238 230&quot;/&gt;
      &lt;path d=&quot;M418 70 L490 130&quot;/&gt;&lt;path d=&quot;M418 150 L490 150&quot;/&gt;&lt;path d=&quot;M418 230 L490 170&quot;/&gt;
      &lt;path d=&quot;M180 150 C200 20 560 10 610 110&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;path d=&quot;M680 150 L708 150&quot;/&gt;
    &lt;/g&gt;
    &lt;rect x=&quot;20&quot; y=&quot;115&quot; width=&quot;160&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Revenue budget&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;hours sold × rates&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;40&quot; width=&quot;178&quot; height=&quot;58&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;329&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Staffing budget&lt;/text&gt;&lt;text x=&quot;329&quot; y=&quot;83&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;how many people, which hours&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;121&quot; width=&quot;178&quot; height=&quot;58&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;329&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Training budget&lt;/text&gt;&lt;text x=&quot;329&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;training of new hires&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;202&quot; width=&quot;178&quot; height=&quot;58&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;329&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Travel &amp;amp; coordination&lt;/text&gt;&lt;text x=&quot;329&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;travel, coordinators&lt;/text&gt;
    &lt;rect x=&quot;492&quot; y=&quot;115&quot; width=&quot;188&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;586&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Budgeted income&lt;/text&gt;&lt;text x=&quot;586&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;statement&lt;/text&gt;
    &lt;rect x=&quot;710&quot; y=&quot;115&quot; width=&quot;132&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;776&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Cash budget&lt;/text&gt;&lt;text x=&quot;776&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;inflows/outflows&lt;/text&gt;
    &lt;text x=&quot;100&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;starting point&lt;/text&gt;
    &lt;text x=&quot;400&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;revenues&lt;/text&gt;
    &lt;text x=&quot;250&quot; y=&quot;290&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;operating budgets&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;290&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;financial budgets&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The operating budgets (green) derive from forecast demand; the &lt;em&gt;budgeted income statement&lt;/em&gt; summarises them into a result; the &lt;em&gt;cash budget&lt;/em&gt; translates everything into cash flows, which matters because municipalities often pay late while salaries go out every month.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The functions of the budget&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;The textbook lists several functions; the case shows that they can conflict with one another. Browse the tabs.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Planning&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Coordination&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Communication&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Control&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Motivation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Evaluation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Planning&lt;/strong&gt;: anticipating demand and resources. At CarePlus it “forces us to think about resource needs” (instructor&#x27;s notes). But a plan that ignores the staffing constraint is a wish, not a plan.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Coordinating&lt;/strong&gt; departments: the hours sold by the commercial function must be covered by operations, with people recruited and trained by HR. This is exactly what was missing: each department optimised its own piece.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Communicating&lt;/strong&gt; objectives and constraints along the hierarchy, in both directions. At CarePlus communication was mainly top-down: Paolo&#x27;s and Sara&#x27;s information was heard but not used.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Controlling&lt;/strong&gt;: comparing actuals with the budget and analysing deviations (&lt;em&gt;variance analysis&lt;/em&gt;). The budget “makes costs visible”, a genuine merit acknowledged in the instructor&#x27;s notes.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Motivating&lt;/strong&gt;: a challenging but achievable target can drive improvement (this is the position of the CFO and of Laura). If perceived as unrealistic or unfair, it has the opposite effect (see section 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Evaluating&lt;/strong&gt; managers&#x27; performance. This is the use that generates the most side effects: when the budget becomes the yardstick by which a person is judged, that person starts managing the &lt;em&gt;number&lt;/em&gt; instead of reality.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Intended vs actual: the instructor&#x27;s answer&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 250&quot; role=&quot;img&quot; aria-label=&quot;Comparison between what the budget was meant to do and what it actually does&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;400&quot; height=&quot;230&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;rect x=&quot;450&quot; y=&quot;10&quot; width=&quot;400&quot; height=&quot;230&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot;/&gt;
    &lt;text x=&quot;210&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; style=&quot;font-family:var(--serif)&quot;&gt;What it was meant to do&lt;/text&gt;
    &lt;text x=&quot;650&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; style=&quot;font-family:var(--serif)&quot;&gt;What it also does&lt;/text&gt;
    &lt;g font-size=&quot;14&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;85&quot;&gt;✓ support planning &amp;amp; control&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;118&quot;&gt;✓ make costs visible&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;151&quot;&gt;✓ prompt thinking about resource needs&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;184&quot;&gt;✓ financial discipline&lt;/text&gt;&lt;/g&gt;
    &lt;g font-size=&quot;14&quot;&gt;&lt;text x=&quot;480&quot; y=&quot;85&quot;&gt;✗ becomes a pressure mechanism&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;118&quot;&gt;✗ creates fear of unfavourable variances&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;151&quot;&gt;✗ pushes managers to defend their budget&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;184&quot;&gt;✗ short-term decisions&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M415 125 L445 125&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a2)&quot;/&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Key message of the lecture: &lt;strong&gt;budgets are not neutral technical tools&lt;/strong&gt;. They influence behaviour, communication, priorities and power relations.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Behaviour&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;What is measured and discussed every month becomes what people focus on.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Priorities&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Cost, measured precisely, prevails over quality, which is not measured.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;h4&gt;Power&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Those who write the budget (finance, commercial) define the problem; those subject to it (operations, HR) bear the consequences.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · functions of the budget&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In what sense is a budget “not neutral”? Give an example from the case.&lt;/summary&gt;&lt;div&gt;It does not merely describe: it directs attention and behaviour. Example: by measuring customer service labour costs but not waiting times, the budget encouraged cutting temporary staff at peak hours, leading to more complaints.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the revenue budget the “first domino” of the master budget?&lt;/summary&gt;&lt;div&gt;Because staffing, training, travel and hence the income statement and cash budget all derive from it. If the revenue forecast is optimistic and not checked against capacity, all the other budgets rest on a flawed basis.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which two functions of the budget came most into conflict at CarePlus?&lt;/summary&gt;&lt;div&gt;Planning/coordination (which requires honest, shared information) versus evaluation/pressure (which pushes managers to protect their own number). Using the same budget for both creates incentives to distort it.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 TRADE-OFF ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;tradeoff&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;h2&gt;The tensions between growth, cost control and quality&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 2 · instructor&#x27;s notes p. 4&lt;/span&gt;
  &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;trade-off&lt;/em&gt; is a choice in which improving one dimension comes at a cost in another. The instructor&#x27;s point: &lt;strong&gt;budgeting requires an explicit discussion of trade-offs, not just the setting of numerical targets&lt;/strong&gt;. At CarePlus the trade-offs were “resolved” implicitly, by writing down numbers that ignored them.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 400&quot; role=&quot;img&quot; aria-label=&quot;Triangle of tensions: growth, costs, quality&quot;&gt;
    &lt;polygon points=&quot;430,40 120,350 740,350&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;circle cx=&quot;430&quot; cy=&quot;40&quot; r=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Growth&lt;/text&gt;
    &lt;circle cx=&quot;120&quot; cy=&quot;350&quot; r=&quot;34&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;347&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Cost&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;control&lt;/text&gt;
    &lt;circle cx=&quot;740&quot; cy=&quot;350&quot; r=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;740&quot; y=&quot;355&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Quality&lt;/text&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;text x=&quot;160&quot; y=&quot;150&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot;&gt;↔ hours +20% vs staff +7%&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;178&quot;&gt;limited delivery capacity&lt;/text&gt;
      &lt;text x=&quot;590&quot; y=&quot;150&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;contracts vs feasibility ↔&lt;/text&gt;
      &lt;text x=&quot;590&quot; y=&quot;178&quot;&gt;signing without ops confirmation&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;388&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;labour · training · travel · profitability&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;300&quot;&gt;customer service ↔ responsiveness&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;275&quot;&gt;training ↔ care worker preparedness&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;250&quot;&gt;travel ↔ continuity of care&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;325&quot;&gt;profitability ↔ burnout&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The six tensions identified in the instructor&#x27;s notes, placed on the sides of the triangle. Almost all lie on the “costs ↔ quality” side: the saving is immediate and measured, while the damage comes later and is not measured.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Simulator: the productivity assumption hidden in the budget&lt;/h3&gt;
  &lt;p&gt;If hours grow faster than headcount, each person must work (or be utilised) more. The required growth in productivity per care worker is:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Δ productivity = (1 + g&lt;sub&gt;hours&lt;/sub&gt;) / (1 + g&lt;sub&gt;staff&lt;/sub&gt;) − 1&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;With the case data: 1.20 / 1.07 − 1 ≈ &lt;strong&gt;+12.1%&lt;/strong&gt; hours per care worker. Move the sliders: the last one indicates how much efficiency (better scheduling, less idle time) you consider genuinely realistic. The rest of the gap must be covered with overtime, or it is not covered at all.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;simCap&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gH&quot;&gt;Growth in service hours&lt;/label&gt;&lt;input id=&quot;gH&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;35&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;gHo&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gS&quot;&gt;Growth in care workers&lt;/label&gt;&lt;input id=&quot;gS&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;gSo&quot;&gt;7%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;gE&quot;&gt;Realistic efficiency&lt;/label&gt;&lt;input id=&quot;gE&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;15&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;gEo&quot;&gt;4%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kReq&quot;&gt;12.1%&lt;/b&gt;&lt;span&gt;additional hours required from each care worker&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kGap&quot;&gt;7.8%&lt;/b&gt;&lt;span&gt;gap left uncovered after efficiency&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;kOT&quot;&gt;≈ 3.1 h&lt;/b&gt;&lt;span&gt;overtime/week per care worker (40 h base, indicative only)&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:12px&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--rule)&quot;/&gt;
      &lt;rect id=&quot;bE&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;rect id=&quot;bG&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; fill=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;64&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;green = covered by efficiency · red = to be covered by overtime, new hires or undelivered service&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;vCap&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var h=document.getElementById(&#x27;gH&#x27;),s=document.getElementById(&#x27;gS&#x27;),e=document.getElementById(&#x27;gE&#x27;);
    function f(x){return x.toFixed(1)}
    function up(){
      var gh=+h.value/100,gs=+s.value/100,ge=+e.value/100;
      document.getElementById(&#x27;gHo&#x27;).textContent=h.value+&#x27;%&#x27;;document.getElementById(&#x27;gSo&#x27;).textContent=s.value+&#x27;%&#x27;;document.getElementById(&#x27;gEo&#x27;).textContent=e.value+&#x27;%&#x27;;
      var req=Math.max(0,(1+gh)/(1+gs)-1),gap=Math.max(0,(1+req)/(1+ge)-1),cov=Math.min(req,ge);
      document.getElementById(&#x27;kReq&#x27;).textContent=f(req*100)+&#x27;%&#x27;;document.getElementById(&#x27;kGap&#x27;).textContent=f(gap*100)+&#x27;%&#x27;;
      document.getElementById(&#x27;kOT&#x27;).textContent=&#x27;≈ &#x27;+f(gap*40)+&#x27; h&#x27;;
      var sc=600/0.35;document.getElementById(&#x27;bE&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,cov*sc));
      var bg=document.getElementById(&#x27;bG&#x27;);bg.setAttribute(&#x27;x&#x27;,Math.min(600,cov*sc));bg.setAttribute(&#x27;width&#x27;,Math.max(0,Math.min(600-cov*sc,gap*sc)));
      var v=document.getElementById(&#x27;vCap&#x27;);
      if(gap&lt;=0.005){v.textContent=&#x27;Consistent plan: the growth in hours is covered by staff and realistic efficiency.&#x27;;v.style.background=&#x27;var(--sage-bg)&#x27;}
      else if(gap&lt;0.05){v.textContent=&#x27;Moderate gap: manageable only if made explicit and discussed (who covers it? at what cost?).&#x27;;v.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{v.textContent=&#x27;Significant gap: the budget “promises” hours that nobody can deliver. The problem will fall on operations (Paolo), as happened in the case.&#x27;;v.style.background=&#x27;var(--brick-bg)&#x27;}
    }
    [h,s,e].forEach(function(x){x.addEventListener(&#x27;input&#x27;,up)});up();
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;Note on the simulator: this is a teaching elaboration based on the two figures in the case (+20% hours, +7% staff). The 40-hour week and the efficiency percentage are illustrative assumptions, not data from the slides.&lt;/p&gt;

  &lt;h3&gt;The 8% cuts: visible savings, hidden costs&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discretionary costs.&lt;/b&gt; Expenditures decided periodically by management without a precise technical link to output volume (training, extra temporary staff, some coordination expenses). They differ from &lt;em&gt;committed costs&lt;/em&gt; (e.g. rent) and from &lt;em&gt;engineered costs&lt;/em&gt; (measurably linked to output, e.g. care hours delivered). Precisely because they are “discretionary”, they are the first to be cut, yet they are often investments in capacity and quality.&lt;/div&gt;
  &lt;p&gt;A uniform &lt;em&gt;across-the-board&lt;/em&gt; cut (the same for everyone, here 8%) is easy to communicate but ignores where each euro creates value. Open each tab to follow the cause-and-effect chain.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Customer service&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Training&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Travel&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Contracts&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Action:&lt;/strong&gt; fewer temporary staff at peak hours. &lt;strong&gt;Saving:&lt;/strong&gt; the department&#x27;s labour cost. &lt;strong&gt;Hidden effect:&lt;/strong&gt; longer phone waiting times → more complaints → greater workload for customer service itself and an eroded reputation. Tension: &lt;em&gt;reducing labor costs vs maintaining responsiveness&lt;/em&gt; towards the client.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Action:&lt;/strong&gt; training budget reduced, sessions postponed. &lt;strong&gt;Hidden effect:&lt;/strong&gt; new hires not ready to work alone with vulnerable clients; more errors, more stress, more turnover, and therefore even more new hires to train. Tension: &lt;em&gt;reducing training costs vs protecting service quality&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Action:&lt;/strong&gt; assignments based on geographical proximity. &lt;strong&gt;Saving:&lt;/strong&gt; travel time and costs. &lt;strong&gt;Hidden effect:&lt;/strong&gt; families lose the care worker they trusted. &lt;em class=&quot;t&quot;&gt;Continuity of care&lt;/em&gt; (the same person, the same relationship over time) is part of the product, not a detail. Tension: &lt;em&gt;travel costs vs continuity with trusted care workers&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Action:&lt;/strong&gt; signing new contracts to reach the revenue target. &lt;strong&gt;Hidden effect:&lt;/strong&gt; contracts “profitable on paper” but hard to manage; pressure on shift schedules; risk of &lt;em&gt;burnout&lt;/em&gt; (exhaustion from chronic stress) among coordinators and care workers. Tensions: &lt;em&gt;new contracts vs operational feasibility&lt;/em&gt; and &lt;em&gt;profitability vs employee burnout&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;How should they be discussed in the budgeting process? A useful practice is to make each trade-off an explicit line in the document: “if we cut X, we expect this effect on Y; we monitor it with indicator Z”. In this way the hidden cost becomes visible and someone is accountable for it.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · trade-offs&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Calculate the implied productivity if hours grow by 20% and staff by 10%.&lt;/summary&gt;&lt;div&gt;1.20 / 1.10 − 1 ≈ 9.1% more hours per care worker. Still high, but lower than the 12.1% in the case.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why are cuts to discretionary costs “dangerous” in a personal care services company?&lt;/summary&gt;&lt;div&gt;Because many discretionary costs (training, staff at peak hours, time for continuity) are what produces quality. The saving shows up immediately in the report; the damage (complaints, turnover, reputation) arrives later and is not measured by the budget.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;List the six tensions identified by the instructor.&lt;/summary&gt;&lt;div&gt;Service hours vs available staff; labour cost vs responsiveness; training vs quality; travel vs continuity with the trusted care worker; new contracts vs operational feasibility; profitability vs burnout.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 CHI PARTECIPA ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;chi&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;h2&gt;Who should participate in budgeting?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 3 · instructor&#x27;s notes pp. 4–5&lt;/span&gt;
  &lt;p&gt;Each department holds a piece of information that the others lack: this is known as &lt;em class=&quot;t&quot;&gt;information asymmetry&lt;/em&gt;. Those “close to the work” know the real constraints and capacity; top management knows the strategy. A good budgeting process brings the two together.&lt;/p&gt;

  &lt;h3&gt;Three ways of building the budget&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Top-down&lt;/th&gt;&lt;th&gt;Bottom-up&lt;/th&gt;&lt;th&gt;Participative&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Who decides&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Top management/finance, then communicates the numbers&lt;/td&gt;&lt;td&gt;Departments propose, top management aggregates&lt;/td&gt;&lt;td&gt;Top management sets the direction; departments build and negotiate&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Strengths&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Fast, consistent with the board&#x27;s objectives&lt;/td&gt;&lt;td&gt;Uses local information&lt;/td&gt;&lt;td&gt;Better information + greater &lt;em&gt;commitment&lt;/em&gt; to targets&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Risks&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Unrealistic targets, low commitment&lt;/td&gt;&lt;td&gt;Budgetary slack, little overall view&lt;/td&gt;&lt;td&gt;More time; slack if trust is lacking&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;CarePlus&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;This is in fact what happened&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;This is what the instructor suggests&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The conclusion of the notes: a &lt;strong&gt;more participative&lt;/strong&gt; process, which nevertheless leaves top management responsible for setting the strategic direction.&lt;/p&gt;

  &lt;h3&gt;The information contribution of each role&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 420&quot; role=&quot;img&quot; aria-label=&quot;Roles participating in the budget and the information they bring&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;a4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

      &lt;rect x=&quot;620&quot; y=&quot;290&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;735&quot; y=&quot;310&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Operations&lt;/text&gt;&lt;text x=&quot;735&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;scheduling, delivery capacity&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;354&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;374&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;HR&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;392&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;recruiting, training, turnover&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;290&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;310&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Quality&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;standards, client satisfaction&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;230&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer service&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;call volumes, complaints&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;186&quot; width=&quot;130&quot; height=&quot;48&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Finance&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;costs, cash, profit&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The seven roles identified in the instructor&#x27;s notes and the information each one brings. In the case, only finance and commercial actually “wrote” the budget.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budgetary slack.&lt;/b&gt; A safety margin deliberately built into the budget: overstated costs or understated revenues to make the target easier to achieve. It is the typical risk of participation when managers are evaluated on meeting the budget: those who know the reality best also have the incentive to “protect themselves”.&lt;/div&gt;
  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;The paradox of the case: the more CarePlus penalises variances and cuts the budgets of those who save, the more rational slack becomes. Participation only works if honest information is not used against those who provide it.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · participation&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What should HR have brought to the discussion on the +20% hours?&lt;/summary&gt;&lt;div&gt;Data on recruitment lead times, turnover, training duration and the actual availability of qualified staff: in other words, how many hours can realistically be covered, and when.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does participative budgeting mean that departments decide the budget?&lt;/summary&gt;&lt;div&gt;No. Departments contribute information and proposals and negotiate targets, but top management retains responsibility for setting the strategic direction (instructor&#x27;s notes).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why can participation generate budgetary slack?&lt;/summary&gt;&lt;div&gt;Because whoever proposes their own target has more information than their superior and, if they will be evaluated on achieving it, has an incentive to propose easy targets (inflated costs, cautious revenues).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 COMPORTAMENTI ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;comportamenti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;h2&gt;Which behaviours does the system encourage?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 4 · instructor&#x27;s notes p. 5&lt;/span&gt;
  &lt;p&gt;Three mechanisms in the case shape managers&#x27; behaviour: the &lt;strong&gt;monthly reports&lt;/strong&gt;, the &lt;strong&gt;discussion of variances&lt;/strong&gt; with the CEO and CFO, and the &lt;strong&gt;budget-tightening rule&lt;/strong&gt;.&lt;/p&gt;

  &lt;h3&gt;Variance: the tool of the monthly report&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Variance = Actual − Budget&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Favourable (F).&lt;/b&gt; The variance improves the result: actual costs below budget, or revenues above budget.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unfavourable (U).&lt;/b&gt; The variance worsens the result: costs above budget or revenues below. At CarePlus it must be “explained” at the meeting, and this is where fear arises.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Problem: a &lt;em class=&quot;t&quot;&gt;static&lt;/em&gt; budget (fixed for a forecast volume) compares costs with a volume that did not materialise. A &lt;em class=&quot;t&quot;&gt;flexible budget&lt;/em&gt; recalculates the “allowed” costs on the actual volume, separating the volume effect from the efficiency effect. Try it with customer service, which in the case tries to stay within its labour cost budget “even when call volumes increase”.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;simVar&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vCall&quot;&gt;Actual vs forecast calls&lt;/label&gt;&lt;input id=&quot;vCall&quot; type=&quot;range&quot; min=&quot;-20&quot; max=&quot;40&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;vCallO&quot;&gt;+20%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vEff&quot;&gt;Cost per call vs standard&lt;/label&gt;&lt;input id=&quot;vEff&quot; type=&quot;range&quot; min=&quot;-15&quot; max=&quot;15&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;vEffO&quot;&gt;0%&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;Illustrative assumption: monthly budget of 10,000 calls × €3 = €30,000 of labour cost, all variable.&lt;/p&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vAct&quot;&gt;€36,000&lt;/b&gt;&lt;span&gt;actual cost&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vSt&quot;&gt;6,000 U&lt;/b&gt;&lt;span&gt;variance vs static budget (€30,000)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vFl&quot;&gt;0&lt;/b&gt;&lt;span&gt;variance vs flexible budget (efficiency)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;b id=&quot;vVol&quot;&gt;6,000 U&lt;/b&gt;&lt;span&gt;portion due to volume alone&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;vMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var c=document.getElementById(&#x27;vCall&#x27;),e=document.getElementById(&#x27;vEff&#x27;);
    function eu(x){return Math.round(Math.abs(x)).toLocaleString(&#x27;en-GB&#x27;)}
    function tag(x){return Math.abs(x)&lt;1?&#x27;0&#x27;:eu(x)+(x&gt;0?&#x27; U&#x27;:&#x27; F&#x27;)}
    function up(){
      var q=10000*(1+c.value/100),p=3*(1+e.value/100),act=q*p,flex=q*3,st=30000;
      document.getElementById(&#x27;vCallO&#x27;).textContent=(c.value&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+c.value+&#x27;%&#x27;;document.getElementById(&#x27;vEffO&#x27;).textContent=(e.value&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+e.value+&#x27;%&#x27;;
      document.getElementById(&#x27;vAct&#x27;).textContent=&#x27;€&#x27;+eu(act);document.getElementById(&#x27;vSt&#x27;).textContent=tag(act-st);
      document.getElementById(&#x27;vFl&#x27;).textContent=tag(act-flex);document.getElementById(&#x27;vVol&#x27;).textContent=tag(flex-st);
      var m=document.getElementById(&#x27;vMsg&#x27;);
      if(act-st&gt;1&amp;&amp;act-flex&lt;=1){m.textContent=&#x27;The static report shows an unfavourable variance, but the manager has been efficient: the extra cost is due solely to more calls. Penalising the manager encourages cutting staff while calls are rising, which means families left waiting.&#x27;;m.style.background=&#x27;var(--brick-bg)&#x27;}
      else if(act-flex&gt;1){m.textContent=&#x27;There is a genuine inefficiency (cost per call above standard): this is the part to discuss with the manager.&#x27;;m.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{m.textContent=&#x27;The cost is in line with or below the flexible budget: no efficiency problem.&#x27;;m.style.background=&#x27;var(--sage-bg)&#x27;}
    }
    [c,e].forEach(function(x){x.addEventListener(&#x27;input&#x27;,up)});up();
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;The figures in the simulator are invented for teaching purposes; the case reports no data on call volumes.&lt;/p&gt;

  &lt;h3&gt;Positive and negative behaviours&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Tap the cards to see where each behaviour originates in the case.&lt;/p&gt;
  &lt;h4 style=&quot;color:var(--sage)&quot;&gt;Positive&lt;/h4&gt;
  &lt;div class=&quot;flip&quot;&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Greater attention to costs&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Costs become visible department by department: previously the budget was an exercise for finance alone.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Clearer financial targets&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Everyone knows how much they can spend and how much they must generate.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;More discipline in planning&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;The company moves from informal management to a structured annual cycle (this was Emma&#x27;s objective).&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Structured performance discussions&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Monthly meetings create a regular occasion to discuss results.&lt;/div&gt;&lt;/button&gt;
  &lt;/div&gt;
  &lt;h4 style=&quot;color:var(--brick);margin-top:18px&quot;&gt;Negative&lt;/h4&gt;
  &lt;div class=&quot;flip&quot;&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Avoiding overtime even when needed&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Operations approves overtime only when “absolutely necessary”: uncovered shifts, pressure on coordinators.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Postponing training&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;HR reschedules sessions to stay within the monthly budget: less prepared care workers.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Cutting customer service resources&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Fewer temporary staff at peak hours: waiting times and complaints.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Signing contracts without operational confirmation&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;The commercial function is evaluated on revenue growth, not on feasibility.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Spending the leftover budget&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;For fear that unused resources will be taken away (the two-month rule): the so-called &lt;em&gt;use it or lose it&lt;/em&gt;.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Creating budgetary slack&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;Asking for more than necessary as protection against future variances and cuts.&lt;/div&gt;&lt;/button&gt;
    &lt;button type=&quot;button&quot; aria-expanded=&quot;false&quot;&gt;&lt;div class=&quot;f&quot;&gt;Focusing on the month&#x27;s variance, not long-term quality&lt;/div&gt;&lt;div class=&quot;b&quot;&gt;This is &lt;em&gt;short-termism&lt;/em&gt;: the report is monthly, while the effects on quality emerge over months or years.&lt;/div&gt;&lt;/button&gt;
  &lt;/div&gt;

  &lt;h3&gt;The two-month rule: a ratchet effect&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ratchet effect.&lt;/b&gt; Tomorrow&#x27;s target is based on today&#x27;s performance, so whoever performs better ends up with a harder objective. The manager learns not to reveal everything they are capable of. This is exactly the CFO&#x27;s rule: two months under budget → reduced budget.&lt;/div&gt;
  &lt;p&gt;Compare two strategies a manager might adopt over six months. In the first, they report the actual savings; in the second, they spend the remainder to stay close to the budget.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;ratchet&quot;&gt;
    &lt;div role=&quot;group&quot; style=&quot;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-m=&quot;honest&quot; aria-pressed=&quot;true&quot;&gt;Reports the savings&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-m=&quot;burn&quot; aria-pressed=&quot;false&quot;&gt;Spends the remainder&lt;/button&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 620 240&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Budget and spending over six months&quot;&gt;
      &lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;50&quot; y1=&quot;30&quot; x2=&quot;600&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;90&quot; x2=&quot;600&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;150&quot; x2=&quot;600&quot; y2=&quot;150&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;210&quot; x2=&quot;600&quot; y2=&quot;210&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;8&quot; y=&quot;34&quot;&gt;110&lt;/text&gt;&lt;text x=&quot;8&quot; y=&quot;94&quot;&gt;100&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;154&quot;&gt;90&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;214&quot;&gt;80&lt;/text&gt;&lt;/g&gt;
      &lt;g id=&quot;rBars&quot;&gt;&lt;/g&gt;
      &lt;polyline id=&quot;rLine&quot; fill=&quot;none&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;g id=&quot;rLbl&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;monthly budget&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;actual (necessary) spending&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;unnecessary “defensive” spending&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;rMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var box=document.getElementById(&#x27;ratchet&#x27;),need=[92,93,90,91,99,97];
    function y(v){return 90-(v-100)*6}
    function run(m){
      var b=100,below=0,bars=&#x27;&#x27;,pts=[],lbl=&#x27;&#x27;,waste=0;
      for(var i=0;i&lt;6;i++){
        var x=60+i*90,spend=m===&#x27;honest&#x27;?need[i]:Math.max(need[i],b);
        pts.push((x)+&#x27;,&#x27;+y(b),(x+80)+&#x27;,&#x27;+y(b));
        bars+=&#x27;&lt;rect x=&quot;&#x27;+(x+15)+&#x27;&quot; y=&quot;&#x27;+y(need[i])+&#x27;&quot; width=&quot;50&quot; height=&quot;&#x27;+(210-y(need[i]))+&#x27;&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&#x27;;
        if(spend&gt;need[i]){bars+=&#x27;&lt;rect x=&quot;&#x27;+(x+15)+&#x27;&quot; y=&quot;&#x27;+y(spend)+&#x27;&quot; width=&quot;50&quot; height=&quot;&#x27;+(y(need[i])-y(spend))+&#x27;&quot; fill=&quot;var(--brick)&quot;/&gt;&#x27;;waste+=spend-need[i];}
        lbl+=&#x27;&lt;text x=&quot;&#x27;+(x+40)+&#x27;&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot;&gt;M&#x27;+(i+1)+&#x27;&lt;/text&gt;&#x27;;
        below=spend&lt;b?below+1:0;
        if(below&gt;=2){b=b-4;below=0;}
      }
      document.getElementById(&#x27;rBars&#x27;).innerHTML=bars;document.getElementById(&#x27;rLine&#x27;).setAttribute(&#x27;points&#x27;,pts.join(&#x27; &#x27;));document.getElementById(&#x27;rLbl&#x27;).innerHTML=lbl;
      var msg=document.getElementById(&#x27;rMsg&#x27;);
      if(m===&#x27;honest&#x27;){msg.textContent=&#x27;By reporting the savings, the budget is cut twice (100 → 96 → 92). In M5 and M6 the necessary spending (99 and 97) exceeds the budget: unfavourable variances to explain, even though nothing was wasted.&#x27;;msg.style.background=&#x27;var(--brick-bg)&#x27;}
      else{msg.textContent=&#x27;By spending the remainder, the budget stays at 100 and there are never any “negative” variances, but about &#x27;+Math.round(waste)+&#x27; units are wasted over six months. The system rewards waste and penalises efficiency.&#x27;;msg.style.background=&#x27;var(--ochre-bg)&#x27;}
      box.querySelectorAll(&#x27;[data-m]&#x27;).forEach(function(b){b.setAttribute(&#x27;aria-pressed&#x27;,b.dataset.m===m);b.style.borderColor=b.dataset.m===m?&#x27;var(--brick)&#x27;:&#x27;&#x27;});
    }
    box.querySelectorAll(&#x27;[data-m]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){run(b.dataset.m)})});run(&#x27;honest&#x27;);
  });&lt;/script&gt;
  &lt;p class=&quot;small&quot;&gt;Teaching simulation: the rule is the one in the case; the values (monthly requirement, 4-point cut) are invented.&lt;/p&gt;
  &lt;blockquote&gt;The system is teaching managers to defend their budget, not to improve the service.&lt;cite&gt;Sara, HR manager, p. 2&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · behaviours&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Actual labour costs €33,000, budget €30,000. What is the variance? Favourable or unfavourable?&lt;/summary&gt;&lt;div&gt;+€3,000, unfavourable (cost above budget). Before judging the manager, however, it should be checked with a flexible budget whether the volume has changed.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the rule “two months under budget → reduced budget” produce end-of-month spending?&lt;/summary&gt;&lt;div&gt;Because it turns savings into a future penalty (ratchet effect). It pays the manager to use up the remainder (&lt;em&gt;use it or lose it&lt;/em&gt;) or to postpone expenses, i.e. to conceal information about actual efficiency.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Name two positive and two negative behaviours induced by the system.&lt;/summary&gt;&lt;div&gt;Positive: greater attention to costs; more discipline in planning (also: clear targets, structured discussions). Negative: postponed training; contracts signed without operational confirmation (also: no overtime, cuts to customer service, spending the remainder, slack, focus on the month).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 CONTROLLABILITY ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;controllo&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;h2&gt;What is “controllable” in a service company?&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 5 · instructor&#x27;s notes p. 5&lt;/span&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Controllability principle.&lt;/b&gt; A manager should be evaluated only (or mainly) on the results they can actually influence. If they are judged on factors beyond their control, the system is perceived as unfair and pushes them to defend themselves rather than to improve.&lt;/div&gt;
  &lt;p&gt;At CarePlus controllability is difficult because &lt;strong&gt;service delivery is interdependent&lt;/strong&gt;: each department&#x27;s results depend on the decisions of the others and on clients who change their requests at the last minute.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 380&quot; role=&quot;img&quot; aria-label=&quot;Network of interdependencies between departments&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;a6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;&gt;
      &lt;path d=&quot;M215 70 L345 70&quot;/&gt;
      &lt;path d=&quot;M100 90 C100 150 300 170 360 90&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;path d=&quot;M690 245 C640 160 560 110 515 90&quot;/&gt;
      &lt;path d=&quot;M470 105 L470 250&quot;/&gt;
      &lt;path d=&quot;M560 290 L630 290&quot;/&gt;
      &lt;path d=&quot;M150 290 L360 290&quot;/&gt;
      &lt;path d=&quot;M120 270 L420 100&quot; stroke-opacity=&quot;.5&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;45&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;117&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Sales&lt;/text&gt;&lt;text x=&quot;117&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;promises to clients&lt;/text&gt;
      &lt;rect x=&quot;345&quot; y=&quot;45&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Operations costs&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;overtime, travel, coordination&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;265&quot; width=&quot;130&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;288&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;HR&lt;/text&gt;&lt;text x=&quot;85&quot; y=&quot;305&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;hiring, training&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;255&quot; width=&quot;200&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Capacity &amp;amp; quality&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;training + scheduling + staffing&lt;/text&gt;
      &lt;rect x=&quot;630&quot; y=&quot;255&quot; width=&quot;215&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;737&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer service&lt;/text&gt;&lt;text x=&quot;737&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;call and complaint workload&lt;/text&gt;
      &lt;rect x=&quot;630&quot; y=&quot;130&quot; width=&quot;215&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;737&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Clients: last-minute changes&lt;/text&gt;
    &lt;/g&gt;
    &lt;path d=&quot;M700 176 L560 90&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;/&gt;
    &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;&lt;text x=&quot;225&quot; y=&quot;60&quot;&gt;sells hours&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;180&quot;&gt;operational problems&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;282&quot;&gt;service capacity&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;282&quot;&gt;generates calls&lt;/text&gt;&lt;/g&gt;
