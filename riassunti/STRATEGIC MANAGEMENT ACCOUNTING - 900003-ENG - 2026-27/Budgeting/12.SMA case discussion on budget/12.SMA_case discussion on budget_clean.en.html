  &lt;figcaption&gt;The four interdependencies mentioned in the instructor&#x27;s notes: operations costs depend on commercial promises and on client changes; HR outcomes determine service capacity; the customer service workload depends on operational problems; quality depends on training, scheduling and staffing.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;p&gt;Conclusion of the notes: &lt;strong&gt;managers should not be evaluated solely on results influenced by other departments or by external constraints; reports should distinguish between controllable and less controllable factors.&lt;/strong&gt;&lt;/p&gt;

  &lt;h3&gt;Exercise: controllable or not?&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;For each item, decide whether, for the manager indicated, it is largely controllable or only partly controllable (it depends on others or on external factors).&lt;/p&gt;
  &lt;div class=&quot;sorter&quot;&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;Overtime costs in &lt;strong&gt;operations&lt;/strong&gt; after the commercial function has signed three new contracts without notice&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Only partly: the volume was decided by sales. Paolo controls how he organises the shifts, not how many hours he must cover.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Hours of &lt;strong&gt;idle time&lt;/strong&gt; in the shifts planned by coordinators&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Largely controllable by operations: it depends on the quality of scheduling.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;Number of calls received by &lt;strong&gt;customer service&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Only partly: calls increase when there are operational problems. What is controllable is the response time given the volume.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Adherence to the training schedule set by &lt;strong&gt;HR&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Controllable by HR (provided the budget does not push it to postpone training).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;p&quot;&gt;&lt;div&gt;Care worker &lt;strong&gt;turnover&lt;/strong&gt; as an HR indicator&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Only partly: it also depends on unpredictable shifts (operations), contract pressure (sales) and the labour market.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; data-a=&quot;c&quot;&gt;&lt;div&gt;Checking operational capacity before signing a contract (&lt;strong&gt;commercial&lt;/strong&gt;)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot;&gt;Controllable&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;p&quot;&gt;Only partly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Controllable: it is a behaviour of the commercial function, and should indeed be incentivised and measured.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;mine&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;Two practical remedies: (1) two-column reports, “controllable variance” and “variance due to others or external factors” (for example using the flexible budget seen above); (2) some objectives &lt;strong&gt;shared&lt;/strong&gt; across departments (e.g. hours covered by a trained care worker), because the result is a joint one.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · controllability&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;State the controllability principle and explain why it is difficult to apply at CarePlus.&lt;/summary&gt;&lt;div&gt;Managers should be evaluated on what they can influence. It is difficult because the service is interdependent: costs, capacity, complaints and quality arise from the interaction of several departments and from clients.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If individual responsibility is hard to isolate, is it better not to evaluate anyone?&lt;/summary&gt;&lt;div&gt;No: it is better to distinguish in reports between the controllable and the less controllable portion, and to add indicators shared by several departments, so as to create accountability without penalising people for others&#x27; faults.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 MOTIVAZIONE E CULTURA ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;cultura&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;h2&gt;Motivation and service culture&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;question 6 · instructor&#x27;s notes pp. 6–7&lt;/span&gt;
  &lt;p&gt;The instructor&#x27;s notes are clear on three points:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;The system can motivate cost control, but it &lt;strong&gt;damages motivation&lt;/strong&gt; if targets are perceived as &lt;strong&gt;unrealistic or unfair&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;In services, employees &lt;strong&gt;are part of the service experience&lt;/strong&gt;: too much pressure leads to stress, turnover, less empathy and weaker quality.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;A budget focused solely on costs can &lt;strong&gt;conflict with a culture&lt;/strong&gt; based on care, trust and reliability.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Service culture.&lt;/b&gt; A set of shared values and behaviours that place the client and the quality of the relationship at the centre. At CarePlus it coincides with the company&#x27;s reputation: reliability, empathy, flexibility.&lt;/div&gt;

  &lt;h3&gt;How difficult should a target be?&lt;/h3&gt;
  &lt;div class=&quot;mine&quot;&gt;
    &lt;p&gt;A stylised model (not in the slides), consistent with the debate between Laura (“growth requires pressure”) and Paolo (“pressure is not the same as planning”): motivation increases with target difficulty as long as the target is &lt;strong&gt;accepted&lt;/strong&gt; as achievable, then collapses once it becomes unrealistic.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tD&quot;&gt;Target difficulty&lt;/label&gt;&lt;input id=&quot;tD&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;tDo&quot;&gt;80&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 220&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Motivation versus target difficulty curve&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;180&quot; fill=&quot;var(--sage-bg)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;340&quot; y=&quot;10&quot; width=&quot;110&quot; height=&quot;180&quot; fill=&quot;var(--ochre-bg)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;450&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;180&quot; fill=&quot;var(--brick-bg)&quot; opacity=&quot;.6&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;590&quot; y2=&quot;190&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;190&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;path id=&quot;tCurve&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;circle id=&quot;tDot&quot; r=&quot;7&quot; fill=&quot;var(--acc)&quot;/&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;300&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot;&gt;perceived target difficulty →&lt;/text&gt;&lt;text x=&quot;50&quot; y=&quot;26&quot;&gt;motivation / effort&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;180&quot;&gt;easy&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;180&quot;&gt;challenging&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;180&quot;&gt;unrealistic&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;tMsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var r=document.getElementById(&#x27;tD&#x27;);
    function m(d){return d&lt;=70?20+d*1.1:Math.max(5,97-Math.pow(d-70,1.55)*1.6)}
    function X(d){return 40+d*5.5}function Y(v){return 190-v*1.75}
    var p=&#x27;&#x27;;for(var d=0;d&lt;=100;d+=2){p+=(d?&#x27;L&#x27;:&#x27;M&#x27;)+X(d).toFixed(1)+&#x27; &#x27;+Y(m(d)).toFixed(1)}
    document.getElementById(&#x27;tCurve&#x27;).setAttribute(&#x27;d&#x27;,p);
    function up(){var d=+r.value;document.getElementById(&#x27;tDo&#x27;).textContent=d;var dot=document.getElementById(&#x27;tDot&#x27;);dot.setAttribute(&#x27;cx&#x27;,X(d));dot.setAttribute(&#x27;cy&#x27;,Y(m(d)));
      var t=document.getElementById(&#x27;tMsg&#x27;);
      if(d&lt;55){t.textContent=&#x27;Easy target: little stimulus, risk of slack and complacency.&#x27;;t.style.background=&#x27;var(--sage-bg)&#x27;}
      else if(d&lt;=74){t.textContent=&#x27;Challenging but credible target: the point at which pressure “pushes the organisation to improve”, as the CFO wants.&#x27;;t.style.background=&#x27;var(--ochre-bg)&#x27;}
      else{t.textContent=&#x27;Target perceived as unrealistic (e.g. +20% hours with +7% staff): demotivation, stress, defensive behaviour, gaming of the numbers.&#x27;;t.style.background=&#x27;var(--brick-bg)&#x27;}}
    r.addEventListener(&#x27;input&#x27;,up);up();
  });&lt;/script&gt;

  &lt;h3&gt;Virtuous or vicious circle?&lt;/h3&gt;
  &lt;p&gt;In a company where “people are the service”, employee motivation and client satisfaction are linked in a cycle. The budget can drive it in one direction or the other.&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;cyc&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-c=&quot;v&quot;&gt;Vicious circle (CarePlus at Q1)&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-c=&quot;g&quot;&gt;Virtuous circle&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 360&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Cycle between budget, people and clients&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;a7&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;180&quot; r=&quot;130&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;10&quot;/&gt;
      &lt;g id=&quot;cycN&quot; font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;/g&gt;
      &lt;text id=&quot;cycC&quot; x=&quot;300&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; style=&quot;font-family:var(--serif)&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;cycS&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;(window.__w=window.__w||[]).push(function(){
    var box=document.getElementById(&#x27;cyc&#x27;);
    var C={v:{c:&#x27;vicious&#x27;,col:&#x27;var(--brick)&#x27;,bg:&#x27;var(--brick-bg)&#x27;,n:[&#x27;Cuts and unrealistic targets&#x27;,&#x27;Unpredictable shifts, less training&#x27;,&#x27;Stress and burnout&#x27;,&#x27;Turnover, less continuity&#x27;,&#x27;Complaints, declining trust&#x27;,&#x27;Revenue below budget → further cuts&#x27;],s:&#x27;This is the sequence described at the end-of-quarter meeting: higher labour costs, rising complaints, unchanged turnover, more stressed coordinators, revenue below budget.&#x27;},
           g:{c:&#x27;virtuous&#x27;,col:&#x27;var(--sage)&#x27;,bg:&#x27;var(--sage-bg)&#x27;,n:[&#x27;Realistic, shared budget&#x27;,&#x27;Stable shifts, adequate training&#x27;,&#x27;Motivated, empathetic care workers&#x27;,&#x27;Less turnover, more continuity&#x27;,&#x27;Satisfied, loyal families&#x27;,&#x27;Sustainable revenue and margins&#x27;],s:&#x27;A logic close to the service-profit chain (external source, see “Further reading”): internal service quality → employee satisfaction → service quality → client loyalty → growth and profit.&#x27;}};
    function run(k){var d=C[k],h=&#x27;&#x27;;d.n.forEach(function(t,i){var a=-Math.PI/2+i*Math.PI/3,x=300+130*Math.cos(a),y=180+130*Math.sin(a);var w=t.split(&#x27; &#x27;);var l1=[],l2=[];w.forEach(function(x2){(l1.join(&#x27; &#x27;).length&lt;16?l1:l2).push(x2)});
      h+=&#x27;&lt;rect x=&quot;&#x27;+(x-82)+&#x27;&quot; y=&quot;&#x27;+(y-22)+&#x27;&quot; width=&quot;164&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;&#x27;+d.bg+&#x27;&quot; stroke=&quot;&#x27;+d.col+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(y-3)+&#x27;&quot;&gt;&#x27;+l1.join(&#x27; &#x27;)+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(y+13)+&#x27;&quot;&gt;&#x27;+l2.join(&#x27; &#x27;)+&#x27;&lt;/text&gt;&#x27;;});
      document.getElementById(&#x27;cycN&#x27;).innerHTML=h;var c=document.getElementById(&#x27;cycC&#x27;);c.textContent=d.c+&#x27; circle&#x27;;c.style.fill=d.col;document.getElementById(&#x27;cycS&#x27;).textContent=d.s;
      box.querySelectorAll(&#x27;[data-c]&#x27;).forEach(function(b){b.style.borderColor=b.dataset.c===k?d.col:&#x27;&#x27;});}
    box.querySelectorAll(&#x27;[data-c]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){run(b.dataset.c)})});run(&#x27;v&#x27;);
  });&lt;/script&gt;
  &lt;blockquote&gt;People are not just a variable cost. They are the service.&lt;cite&gt;Sara, HR manager, p. 3&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;strong&gt;Evaluation styles (Hopwood, 1972).&lt;/strong&gt; Studying managers in a steelworks, Hopwood distinguished a &lt;em&gt;budget-constrained&lt;/em&gt; style (judgement based mainly on meeting the short-term budget), a &lt;em&gt;profit-conscious&lt;/em&gt; style (budget used flexibly, with attention to long-term effectiveness) and a &lt;em&gt;non-accounting&lt;/em&gt; style. The budget-constrained style was associated with greater tension and dysfunctional behaviour, such as data manipulation: a close mirror of CarePlus&#x27;s monthly meetings. Source: &lt;a href=&quot;https://www.jstor.org/stable/2489870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal of Accounting Research (JSTOR)&lt;/a&gt;; summary at &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumOtleyFakiolas2000.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · motivation and culture&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does employee motivation matter more in a service company than in a manufacturing one?&lt;/summary&gt;&lt;div&gt;Because the employee is part of the product: empathy, reliability and continuity of the relationship are produced in the interaction with the client. Stress and turnover immediately translate into poorer quality.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Laura says “growth requires pressure”, Paolo says “pressure is not the same as planning”. Who is right?&lt;/summary&gt;&lt;div&gt;Both, in part: a challenging target can motivate, but only if it is credible and backed by a resource plan. Beyond that threshold, pressure produces defensive behaviour and damages quality.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How does a “costs-only” budget conflict with CarePlus&#x27;s culture?&lt;/summary&gt;&lt;div&gt;It measures and rewards savings but not care, trust and reliability, which are the values on which the company&#x27;s reputation rests. People learn that what counts is the number, not the client.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 RIPENSARE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;ripensare&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;h2&gt;Rethinking the CarePlus budget&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;synthesis: from the instructor&#x27;s notes + teaching elaboration&lt;/span&gt;
  &lt;p&gt;The case closes with Emma wanting to “rethink the way we budget”. The slides offer no solution: the proposals below combine the indications in the instructor&#x27;s notes (participation, explicit trade-offs, controllability, attention to quality) with classic management control tools.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps-dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;1 Direction&quot;&gt;&lt;h4&gt;1 · Top management sets the direction&lt;/h4&gt;&lt;p&gt;Clear strategic priorities (e.g. growing in the new province &lt;em&gt;without&lt;/em&gt; worsening continuity of care). This is the role the notes leave to top management.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;2 Demand&quot;&gt;&lt;h4&gt;2 · Demand and capacity together&lt;/h4&gt;&lt;p&gt;The commercial revenue forecast is checked with operations and HR: how many hours can be covered by trained staff, and when? The revenue budget becomes a &lt;strong&gt;capacity-checked plan&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;3 Trade-offs&quot;&gt;&lt;h4&gt;3 · Written trade-offs&lt;/h4&gt;&lt;p&gt;Every cut or ambitious target is accompanied by its expected effect on quality and by who monitors it (section 3). No uniform 8% cuts: the discussion focuses on where cost creates value.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;4 KPIs&quot;&gt;&lt;h4&gt;4 · Measuring quality too&lt;/h4&gt;&lt;p&gt;Alongside the financial figures, non-financial indicators (see table below), so that “what is not measured” stops being sacrificed.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;5 Reports&quot;&gt;&lt;h4&gt;5 · Fairer reports&lt;/h4&gt;&lt;p&gt;Flexible budget to separate volume from efficiency; controllable / non-controllable column; variance discussions aimed at understanding, not at assigning blame.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;6 Incentives&quot;&gt;&lt;h4&gt;6 · Consistent incentives&lt;/h4&gt;&lt;p&gt;Abolish the rule that cuts the budget of those who save (ratchet). Evaluate the commercial function also on contracts that can actually be delivered; introduce objectives shared across departments.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;7 Review&quot;&gt;&lt;h4&gt;7 · Revising during the year&lt;/h4&gt;&lt;p&gt;Periodically updated forecasts (&lt;em&gt;rolling forecast&lt;/em&gt;, a forecast that always extends a set number of months ahead) instead of defending at all costs a figure set in October.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A balanced scorecard for CarePlus&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;Teaching proposal: for each dimension mentioned by Giulia and Sara, a possible indicator and a responsible party.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dimension&lt;/th&gt;&lt;th&gt;Possible indicator&lt;/th&gt;&lt;th&gt;Who influences it&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Margin per contract; labour cost against flexible budget&lt;/td&gt;&lt;td&gt;Finance, everyone&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Continuity of care&lt;/td&gt;&lt;td&gt;% of visits made by the regular care worker&lt;/td&gt;&lt;td&gt;Operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Responsiveness&lt;/td&gt;&lt;td&gt;Average phone waiting time; complaints per 1,000 hours&lt;/td&gt;&lt;td&gt;Customer service, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;People&lt;/td&gt;&lt;td&gt;Turnover; training hours before the first solo assignment; overtime per capita&lt;/td&gt;&lt;td&gt;HR, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sustainable growth&lt;/td&gt;&lt;td&gt;% of new contracts with capacity confirmed before signing&lt;/td&gt;&lt;td&gt;Commercial, operations&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Client trust&lt;/td&gt;&lt;td&gt;Satisfaction of families and municipalities; renewals&lt;/td&gt;&lt;td&gt;Quality, everyone&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;strong&gt;Beyond Budgeting.&lt;/strong&gt; A strand of management practice that emerged with the Beyond Budgeting Round Table (Hope, Fraser, Bunce, 1998) proposes moving beyond the fixed annual budget: relative targets, rolling forecasts, resources allocated as needed, and managers accountable for competitive results rather than for meeting the budget. Useful as a point of comparison for Emma&#x27;s question. Source: &lt;a href=&quot;https://www.bbrt.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bbrt.org&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · final synthesis&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In three sentences: what went wrong with CarePlus&#x27;s budget?&lt;/summary&gt;&lt;div&gt;It was built top-down, without integrating capacity and staffing constraints. It was used mainly as a tool of pressure and evaluation on cost indicators, with rules that penalised efficiency. It did not measure quality, continuity and trust, and therefore sacrificed them.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why separate (at least partly) the budget as a plan from the budget as a yardstick for evaluation?&lt;/summary&gt;&lt;div&gt;Because if the same number is used both to plan and to judge, managers have an incentive to distort it (slack, gaming). Separating the functions yields more honest information for planning.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Give one non-financial indicator for each of: operations, HR, customer service.&lt;/summary&gt;&lt;div&gt;Operations: % of visits by the regular care worker. HR: turnover or training hours for new hires. Customer service: average waiting time or complaints per 1,000 hours.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;∞&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The slides for this lecture are a teaching case and &lt;strong&gt;do not cite any authors, studies, standards or websites&lt;/strong&gt;. The entries below are therefore &lt;strong&gt;external sources&lt;/strong&gt;, selected because they deal with the concepts the case brings into play. They are study suggestions to be checked against the original texts.&lt;/p&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Chris Argyris, &lt;em&gt;The Impact of Budgets on People&lt;/em&gt; (Controllership Foundation, 1952)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;A qualitative study regarded by many as the starting point of behavioural accounting research: it shows that budgets, when used as a pressure device, generate tension, hostility and dysfunctional behaviour. It is the historical root of the thesis that “budgets are not neutral”. A copy can be consulted on HathiTrust.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://catalog.hathitrust.org/Record/005306296&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;catalog.hathitrust.org: catalogue record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Anthony G. Hopwood, “An Empirical Study of the Role of Accounting Data in Performance Evaluation”, &lt;em&gt;Journal of Accounting Research&lt;/em&gt;, 10 (1972), pp. 156–182&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Classifies evaluation styles (budget-constrained, profit-conscious, non-accounting) and shows that rigid budget-based evaluation increases tension and data manipulation. It links sections 5 and 7 directly: the problem is not the budget itself, but the way it is used to judge.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.jstor.org/stable/2489870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;jstor.org/stable/2489870&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Michael Schiff &amp;amp; Arie Y. Lewin, “The Impact of People on Budgets”, &lt;em&gt;The Accounting Review&lt;/em&gt;, 45(2), 1970, pp. 259–268&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;An article frequently cited as a reference for the concept of &lt;em&gt;budgetary slack&lt;/em&gt;: managers who participate in budget preparation tend to build in safety margins. Useful for section 4 (participation) and for the behaviours in section 5.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://scholars.duke.edu/display/pub1127261&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scholars.duke.edu: bibliographic record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Steven Kerr, “On the Folly of Rewarding A, While Hoping for B”, &lt;em&gt;Academy of Management Journal&lt;/em&gt;, 18(4), 1975, pp. 769–783&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;A classic on organisations that reward behaviours opposite to those they claim to want. It is the diagnosis of CarePlus&#x27;s commercial function (rewarded on revenue while the company “hopes” for deliverable contracts) and of the rule that penalises those who save.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.talkingaboutorganizations.com/e57-reward-systems-kerr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;talkingaboutorganizations.com: discussion of the article&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Michael C. Jensen, “Corporate Budgeting Is Broken — Let&#x27;s Fix It”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, November 2001, pp. 94–101&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Argues that tying compensation and evaluation to meeting the budget pushes managers to “lie”: low targets, inflated results, expenses brought forward or postponed. Proposes decoupling rewards from the budget. It is the foundation of the proposal in section 8 to “separate planning from evaluation”.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.library.hbs.edu/working-knowledge/why-corporate-budgeting-needs-to-be-fixed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School Working Knowledge: summary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Kenneth A. Merchant &amp;amp; Wim A. Van der Stede, &lt;em&gt;Management Control Systems: Performance Measurement, Evaluation and Incentives&lt;/em&gt; (Pearson, 4th ed. 2017)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;A standard textbook on management control: responsibility centres, financial results control, the use of budgets in evaluation, and a chapter devoted to uncontrollable factors (controllability principle). It expands on sections 5 and 6.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://akademika.no/okonomi-administrasjon-og-ledelse/management-control-systems/9781292110554&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;book record (ISBN 9781292110554)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;J. L. Heskett, T. O. Jones, G. W. Loveman, W. E. Sasser Jr., L. A. Schlesinger, “Putting the Service-Profit Chain to Work”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, March–April 1994&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;Introduces the &lt;em&gt;service-profit chain&lt;/em&gt;: internal service quality produces satisfied and loyal employees, who create value for the client, loyalty and ultimately growth and profit. It is the “virtuous” version of the cycle in section 7 and supports Sara&#x27;s statement that “people are the service”.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Service%E2%80%93profit_chain&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Service–profit chain (introductory entry with references)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref ext&quot;&gt;&lt;h4&gt;Beyond Budgeting Round Table (BBRT): the Beyond Budgeting principles&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;A network founded in 1998 by Jeremy Hope, Robin Fraser and Peter Bunce. It proposes twelve principles, six on leadership and six on process (relative targets, rolling forecasts, resources on demand, controls based on transparency), to move beyond the fixed annual budget. It is a reference point for answering Emma&#x27;s final question.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.bbrt.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bbrt.org&lt;/a&gt; · &lt;a href=&quot;https://www.bbrt.org/wp-content/uploads/bb_principles.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF of the principles&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
