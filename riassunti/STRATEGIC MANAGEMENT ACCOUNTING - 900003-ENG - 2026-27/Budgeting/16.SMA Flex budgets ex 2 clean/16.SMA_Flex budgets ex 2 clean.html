&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 1 · Concetti&lt;/div&gt;
  &lt;h2&gt;Planning budget e flexible budget&lt;/h2&gt;
  &lt;p&gt;Un &lt;span class=&quot;term&quot;&gt;planning budget&lt;/span&gt; (budget di pianificazione, detto anche &lt;em&gt;static budget&lt;/em&gt;, budget statico) si prepara &lt;b&gt;prima&lt;/b&gt; del periodo, per un solo livello di attività previsto. Per Ray Company sono &lt;b&gt;9,040 labor-hours&lt;/b&gt; (ore di manodopera) ad agosto.&lt;/p&gt;
  &lt;p&gt;A fine mese le ore lavorate davvero sono state &lt;b&gt;9,520&lt;/b&gt;. Confrontare i costi reali con il planning budget mescola due cose diverse: &lt;em&gt;abbiamo lavorato di più&lt;/em&gt; e &lt;em&gt;abbiamo speso in modo diverso per ogni ora&lt;/em&gt;. Qui entra in gioco il &lt;span class=&quot;term&quot;&gt;flexible budget&lt;/span&gt; (budget flessibile): una stima di quanto &lt;b&gt;sarebbero dovuti&lt;/b&gt; costare i fattori al livello di attività &lt;b&gt;effettivo&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Planning budget&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Preparato &lt;b&gt;ex ante&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Un solo livello di attività: &lt;b&gt;quello previsto&lt;/b&gt; (9,040 h)&lt;/li&gt;&lt;li&gt;Serve a pianificare: risorse, liquidità, obiettivi&lt;/li&gt;&lt;li&gt;Per valutare il controllo dei costi è &lt;b&gt;fuorviante&lt;/b&gt; se il volume cambia&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Flexible budget&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Ricalcolato &lt;b&gt;ex post&lt;/b&gt; (o per più livelli)&lt;/li&gt;&lt;li&gt;Livello di attività &lt;b&gt;effettivo&lt;/b&gt; (9,520 h)&lt;/li&gt;&lt;li&gt;Usa le stesse cost formula del planning budget&lt;/li&gt;&lt;li&gt;È il riferimento giusto per giudicare la &lt;b&gt;spesa&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Idea chiave.&lt;/b&gt; Il flexible budget e il planning budget usano &lt;b&gt;le stesse cost formula&lt;/b&gt;; cambia solo la &lt;b&gt;q&lt;/b&gt; che ci metti dentro. Planning budget = formula × q pianificata; flexible budget = formula × q effettiva.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 200&quot; role=&quot;img&quot; aria-label=&quot;Le tre colonne del performance report&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;costi reali&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;q effettiva&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;430&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;a + b·q&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;q effettiva&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;text x=&quot;750&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;a + b·q&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;q pianificata&lt;/text&gt;
        &lt;path d=&quot;M210,85 L330,85&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M530,85 L650,85&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;270&quot; y=&quot;30&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Spending variance&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;30&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Activity variance&lt;/text&gt;
        &lt;text x=&quot;270&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;stesso volume,&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;spesa diversa&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;stessa formula,&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;volume diverso&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Lo schema del &lt;em&gt;flexible budget performance report&lt;/em&gt; usato nella slide 2: cinque colonne, tre di importi e due di variances.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché confrontare i costi reali con il planning budget non basta a valutare il responsabile di produzione?&lt;/summary&gt;&lt;div&gt;Perché il volume reale (9,520 h) è diverso da quello previsto (9,040 h). Con più ore, i costi variabili salgono per forza: una parte della differenza non dipende da come il manager ha speso, ma da quanto si è lavorato.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Cosa cambia tra planning budget e flexible budget: la formula o il volume?&lt;/summary&gt;&lt;div&gt;Solo il volume (q). Le cost formula sono le stesse.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Quale colonna del report è il “metro” giusto per giudicare quanto si è speso?&lt;/summary&gt;&lt;div&gt;Il flexible budget: dice quanto si sarebbe dovuto spendere per le ore effettivamente lavorate.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 2 · Il modello di costo&lt;/div&gt;
  &lt;h2&gt;La cost formula: a + b·q&lt;/h2&gt;
  &lt;p&gt;Ogni riga del report ha una &lt;span class=&quot;term&quot;&gt;cost formula&lt;/span&gt; (formula di costo) del tipo:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Costo = &lt;b&gt;a&lt;/b&gt; + &lt;b&gt;b&lt;/b&gt; · q&lt;/div&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;a&lt;/b&gt; = parte &lt;span class=&quot;term&quot;&gt;fixed&lt;/span&gt; (fissa) del costo: non cambia con il volume, entro il &lt;span class=&quot;term&quot;&gt;relevant range&lt;/span&gt; (intervallo di attività in cui la formula vale).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;b&lt;/b&gt; = costo &lt;span class=&quot;term&quot;&gt;variable&lt;/span&gt; (variabile) per unità di cost driver, qui &lt;b&gt;per labor-hour&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;q&lt;/b&gt; = livello di attività, il &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt; (labor-hours).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Nella slide la formula di ogni riga è scritta nelle prime colonne: importo fisso, “+”, tasso variabile, “(q)”. Molti valori mancano e vanno ricavati. I costi di Ray Company sono di tre tipi:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;solo b&lt;/span&gt; Puramente variabile&lt;/h4&gt;&lt;p&gt;Direct labor: &lt;b&gt;b·q&lt;/b&gt;, senza parte fissa. Raddoppi le ore, raddoppia il costo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;a + b&lt;/span&gt; Misto (&lt;span class=&quot;term&quot;&gt;mixed cost&lt;/span&gt;)&lt;/h4&gt;&lt;p&gt;Indirect labor, utilities, supplies, factory administration: una base fissa più una parte che cresce con le ore.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;solo a&lt;/span&gt; Puramente fisso&lt;/h4&gt;&lt;p&gt;Equipment depreciation (ammortamento impianti): $79,400 qualunque sia q. Per questo le sue variances valgono 0.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tre modi per trovare a e b&lt;/h4&gt;&lt;p&gt;Nell&#x27;esercizio, a seconda di cosa c&#x27;è in tabella, si usa:&lt;br&gt;① b = importo ÷ q (se a = 0)&lt;br&gt;② a = totale − b·q&lt;br&gt;③ b = Δcosto ÷ Δq tra due colonne (come nel &lt;span class=&quot;term&quot;&gt;high-low method&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Grafico interattivo: costo totale del reparto&lt;/h3&gt;
  &lt;p&gt;Sommando le sei cost formula (ricavate in Parte 4) il reparto ha &lt;b&gt;a = $114,168&lt;/b&gt; e &lt;b&gt;b = $20.00 per ora&lt;/b&gt;. Sposta il cursore per vedere come cambia il flexible budget con il volume.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;qr&quot;&gt;Labor-hours q:&lt;/label&gt;&lt;input id=&quot;qr&quot; type=&quot;range&quot; min=&quot;8000&quot; max=&quot;11000&quot; step=&quot;20&quot; value=&quot;9520&quot;&gt;&lt;b id=&quot;qv&quot; class=&quot;mono&quot;&gt;9,520&lt;/b&gt;&lt;/div&gt;
    &lt;svg id=&quot;chart&quot; viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Retta del flexible budget&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;&lt;small&gt;Flexible budget a q&lt;/small&gt;&lt;b id=&quot;r1&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;di cui fixed&lt;/small&gt;&lt;b&gt;$114,168&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;di cui variable&lt;/small&gt;&lt;b id=&quot;r2&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Activity variance vs 9,040 h&lt;/small&gt;&lt;b id=&quot;r3&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;La retta è il flexible budget per ogni q. Il punto ● grigio è il planning budget (9,040 h), il punto ● terracotta è il costo reale ($304,868 a 9,520 h). La distanza verticale tra punto reale e retta, a 9,520 h, è la spending variance totale ($300 U).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Nella formula $18,780 + $1.30q, quanto vale il costo a 10,000 ore?&lt;/summary&gt;&lt;div&gt;18,780 + 1.30 × 10,000 = &lt;b&gt;$31,780&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Perché l&#x27;ammortamento non ha activity variance?&lt;/summary&gt;&lt;div&gt;Perché è un costo puramente fisso (b = 0): il valore è lo stesso a 9,040 e a 9,520 ore.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Se un costo vale $4,340 a 9,040 h e $4,484 a 9,520 h, qual è b?&lt;/summary&gt;&lt;div&gt;b = (4,484 − 4,340) ÷ (9,520 − 9,040) = 144 ÷ 480 = &lt;b&gt;$0.30/h&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 3 · Le variances&lt;/div&gt;
  &lt;h2&gt;Spending variance e activity variance&lt;/h2&gt;
  &lt;p&gt;Una &lt;span class=&quot;term&quot;&gt;variance&lt;/span&gt; (scostamento) è la differenza tra due colonne del report. La richiesta dice di inserire gli importi &lt;b&gt;sempre positivi&lt;/b&gt; e di indicare il segno con una lettera: &lt;b&gt;F&lt;/b&gt; = &lt;span class=&quot;term&quot;&gt;favorable&lt;/span&gt; (favorevole), &lt;b&gt;U&lt;/b&gt; = &lt;span class=&quot;term&quot;&gt;unfavorable&lt;/span&gt; (sfavorevole), &lt;b&gt;None&lt;/b&gt; = scostamento nullo.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;v&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;v1&quot;&gt;Spending variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v2&quot;&gt;Activity variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v3&quot;&gt;F o U?&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v4&quot;&gt;Il totale&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel on&quot; id=&quot;v1&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Spending variance = Actual results − Flexible budget&lt;/div&gt;
    &lt;p&gt;Stesso volume (q effettiva), quindi la differenza dipende solo da &lt;b&gt;quanto si è pagato&lt;/b&gt; e &lt;b&gt;quanto si è consumato&lt;/b&gt; per ora: prezzi, efficienza, sprechi, risparmi. È lo scostamento che il responsabile di reparto può controllare più direttamente.&lt;/p&gt;
    &lt;p&gt;Per un costo: reale &amp;gt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;; reale &amp;lt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v2&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity variance = Flexible budget − Planning budget = b × (q&lt;sub&gt;effettiva&lt;/sub&gt; − q&lt;sub&gt;pianificata&lt;/sub&gt;)&lt;/div&gt;
    &lt;p&gt;Stessa formula, volume diverso. Dipende &lt;b&gt;solo dalla parte variabile&lt;/b&gt;: i costi fissi hanno sempre activity variance 0. Nell&#x27;esercizio Δq = 9,520 − 9,040 = &lt;b&gt;480 h&lt;/b&gt;, quindi ogni activity variance = b × 480.&lt;/p&gt;
    &lt;p&gt;Per un costo, più attività → costo più alto → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Attenzione: qui “U” non vuol dire “inefficienza”. Il costo sale perché si è lavorato di più, e spesso è un bene (più produzione).&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v3&quot;&gt;
    &lt;p&gt;Regola per le &lt;b&gt;voci di costo&lt;/b&gt;:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;U&quot;&gt;U · Unfavorable&lt;/h4&gt;&lt;p&gt;La colonna “più vicina al reale” è &lt;b&gt;più alta&lt;/b&gt; di quella con cui la confronti: si è speso, o si sarebbe dovuto spendere, di più.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;F&quot;&gt;F · Favorable&lt;/h4&gt;&lt;p&gt;La colonna “più vicina al reale” è &lt;b&gt;più bassa&lt;/b&gt;: si è speso meno.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Per i ricavi vale il contrario (più ricavi = F). In questo esercizio ci sono solo costi.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v4&quot;&gt;
    &lt;p&gt;Le due variances si sommano allo scostamento complessivo tra reale e planning budget (static budget variance):&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;(Actual − Flexible) + (Flexible − Planning) = Actual − Planning&lt;/div&gt;
    &lt;p&gt;Ray Company: $300 U + $9,600 U = &lt;b&gt;$9,900 U&lt;/b&gt; (304,868 − 294,968). Senza il flexible budget vedremmo solo “abbiamo sforato di $9,900”. Con il flexible budget scopriamo che $9,600 dipendono dalle ore in più e solo $300 dalla spesa.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Indirect labor: flexible budget $19,836, spending variance $2,572 F. Quanto vale il costo reale?&lt;/summary&gt;&lt;div&gt;F significa reale &amp;lt; flexible: 19,836 − 2,572 = &lt;b&gt;$17,264&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Utilities ha activity variance 528 U. Senza altri dati, quanto vale b?&lt;/summary&gt;&lt;div&gt;528 ÷ 480 h = &lt;b&gt;$1.10/h&lt;/b&gt;. Torna con il calcolo della Parte 4.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Un&#x27;activity variance “U” su un costo è sempre un segnale negativo?&lt;/summary&gt;&lt;div&gt;No. Dice solo che il volume è stato più alto del previsto, quindi i costi variabili sono cresciuti. Va giudicata insieme ai ricavi e all&#x27;output prodotto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 4 · L&#x27;esercizio (slide 2–3)&lt;/div&gt;
  &lt;h2&gt;Ray Company, Production Department, agosto&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Ray Company fornisce estratti del suo &lt;em&gt;Production Department Flexible Budget Performance Report&lt;/em&gt; per il mese chiuso al 31 agosto. &lt;b&gt;Richiesta 1:&lt;/b&gt; completare il report indicando ogni variance come F, U o None, con importi positivi.&lt;/p&gt;

  &lt;h3&gt;I dati di partenza&lt;/h3&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Cost formula&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Spending var.&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Activity var.&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Labor-hours (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;9,520&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;9,040&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;? (q)&lt;/td&gt;&lt;td&gt;$154,370&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;$152,320&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Indirect labor&lt;/td&gt;&lt;td&gt;? + $1.30 (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,572&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;F&lt;/td&gt;&lt;td&gt;19,836&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Utilities&lt;/td&gt;&lt;td&gt;$6,900 + ? (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,490&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;U&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;528&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;U&lt;/td&gt;&lt;td&gt;16,844&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Supplies&lt;/td&gt;&lt;td&gt;? + ? (q)&lt;/td&gt;&lt;td&gt;4,996&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;4,484&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;4,340&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Equipment depreciation&lt;/td&gt;&lt;td&gt;$79,400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td class=&quot;N&quot;&gt;None&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td class=&quot;N&quot;&gt;None&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Factory administration&lt;/td&gt;&lt;td&gt;$18,780 + $1.30 (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,180&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;F&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$304,868&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il metodo, riga per riga&lt;/h3&gt;
  &lt;p&gt;Per ogni riga si parte dalla cella “che sblocca” le altre. Scegli una voce:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;r&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;r1&quot;&gt;Direct labor&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r2&quot;&gt;Indirect labor&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r3&quot;&gt;Utilities&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r4&quot;&gt;Supplies&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r5&quot;&gt;Depreciation&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r6&quot;&gt;Factory admin.&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel on&quot; id=&quot;r1&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Costo puramente variabile: b = 152,320 ÷ 9,520 = &lt;b&gt;$16.00/h&lt;/b&gt; → formula &lt;b&gt;$16.00 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 16.00 × 9,040 = &lt;b&gt;$144,640&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Spending = 154,370 − 152,320 = &lt;b&gt;2,050 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (reale più alto).&lt;/li&gt;
    &lt;li&gt;Activity = 152,320 − 144,640 = &lt;b&gt;7,680 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (= 16 × 480).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r2&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Parte fissa: a = 19,836 − 1.30 × 9,520 = 19,836 − 12,376 = &lt;b&gt;$7,460&lt;/b&gt; → formula &lt;b&gt;$7,460 + $1.30 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Actual = 19,836 − 2,572 (F, quindi reale più basso) = &lt;b&gt;$17,264&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 7,460 + 1.30 × 9,040 = 7,460 + 11,752 = &lt;b&gt;$19,212&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Activity = 19,836 − 19,212 = &lt;b&gt;624 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (= 1.30 × 480).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r3&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Dal planning: b = (16,844 − 6,900) ÷ 9,040 = 9,944 ÷ 9,040 = &lt;b&gt;$1.10/h&lt;/b&gt; → formula &lt;b&gt;$6,900 + $1.10 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Flexible = 6,900 + 1.10 × 9,520 = 6,900 + 10,472 = &lt;b&gt;$17,372&lt;/b&gt;. Controllo: 17,372 − 16,844 = 528 U ✓.&lt;/li&gt;
    &lt;li&gt;Actual = 17,372 + 1,490 (U, quindi reale più alto) = &lt;b&gt;$18,862&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r4&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Due colonne note, due volumi: b = (4,484 − 4,340) ÷ (9,520 − 9,040) = 144 ÷ 480 = &lt;b&gt;$0.30/h&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;a = 4,484 − 0.30 × 9,520 = 4,484 − 2,856 = &lt;b&gt;$1,628&lt;/b&gt; → formula &lt;b&gt;$1,628 + $0.30 q&lt;/b&gt;. Controllo: 1,628 + 2,712 = 4,340 ✓.&lt;/li&gt;
    &lt;li&gt;Spending = 4,996 − 4,484 = &lt;b&gt;512 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Activity = 4,484 − 4,340 = &lt;b&gt;144 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r5&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Costo fisso puro: &lt;b&gt;$79,400&lt;/b&gt; in tutte e tre le colonne.&lt;/li&gt;
    &lt;li&gt;Spending 0 None (dato) e activity 0 None (dato): coerente, perché b = 0 e la spesa reale coincide con il budget.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r6&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Formula completa: &lt;b&gt;$18,780 + $1.30 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Flexible = 18,780 + 1.30 × 9,520 = 18,780 + 12,376 = &lt;b&gt;$31,156&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Actual = 31,156 − 1,180 (F) = &lt;b&gt;$29,976&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 18,780 + 11,752 = &lt;b&gt;$30,532&lt;/b&gt;; activity = 31,156 − 30,532 = &lt;b&gt;624 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;

  &lt;h3&gt;Il controllo finale: il totale reale&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; id=&quot;st&quot;&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;p&gt;&lt;b&gt;Passo 1.&lt;/b&gt; La slide dà un solo totale: &lt;b&gt;Actual total expense = $304,868&lt;/b&gt;. È il controllo naturale di tutto il lavoro: la somma dei costi reali ricostruiti deve dare esattamente questa cifra.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Passo 2.&lt;/b&gt; Somma degli actual: 154,370 + 17,264 + 18,862 + 4,996 + 79,400 + 29,976 = &lt;b&gt;$304,868&lt;/b&gt; ✓. I conti tornano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Passo 3.&lt;/b&gt; Totale flexible: 152,320 + 19,836 + 17,372 + 4,484 + 79,400 + 31,156 = &lt;b&gt;$304,568&lt;/b&gt;. Totale planning: 144,640 + 19,212 + 16,844 + 4,340 + 79,400 + 30,532 = &lt;b&gt;$294,968&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Passo 4.&lt;/b&gt; Variances totali: spending = 304,868 − 304,568 = &lt;b&gt;300 U&lt;/b&gt;; activity = 304,568 − 294,968 = &lt;b&gt;9,600 U&lt;/b&gt;. Verifica con le righe: spending 2,050 U + 1,490 U + 512 U − 2,572 F − 1,180 F = 300 U ✓; activity 7,680 + 624 + 528 + 144 + 624 = 9,600 U ✓.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Passo 5.&lt;/b&gt; Scorciatoia: la somma dei b è 16.00 + 1.30 + 1.10 + 0.30 + 1.30 = &lt;b&gt;$20.00/h&lt;/b&gt;, e 20 × 480 h = &lt;b&gt;$9,600&lt;/b&gt;. L&#x27;activity variance totale si ottiene in una riga.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-d=&quot;-1&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-d=&quot;1&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Da quale cella conviene partire per Utilities e perché?&lt;/summary&gt;&lt;div&gt;Dal planning budget ($16,844): conoscendo a = 6,900 e q = 9,040 si ricava subito b = 1.10. In alternativa: 528 ÷ 480.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Indirect labor e factory administration hanno la stessa activity variance. Coincidenza?&lt;/summary&gt;&lt;div&gt;No: hanno lo stesso b ($1.30) e l&#x27;activity variance dipende solo da b × Δq = 1.30 × 480 = 624. La parte fissa diversa non conta.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Come verifichi di non aver sbagliato nessuna riga?&lt;/summary&gt;&lt;div&gt;Sommando gli actual ricostruiti: devono dare $304,868, l&#x27;unico totale fornito dalla slide.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 5 · Soluzione e interpretazione&lt;/div&gt;
  &lt;h2&gt;Il report completo&lt;/h2&gt;
  &lt;p&gt;Le celle con &lt;b&gt;?&lt;/b&gt; sono quelle da calcolare. Prova a trovarle da solo, poi clicca una cella per vedere la risposta, oppure scoprile tutte.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;showall&quot;&gt;Scopri tutte&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;hideall&quot;&gt;Nascondi di nuovo&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;dato nella slide&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;calcolato&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;
  &lt;table id=&quot;sol&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Cost formula&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Spending var.&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Activity var.&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;&lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cosa ci dice il report&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg id=&quot;bars&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Spending variances per voce&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Spending variances per voce: barre a destra = U (sopra il flexible budget), a sinistra = F (sotto). Il totale netto è appena $300 U.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;Lettura 1 · Il grosso dello scostamento viene dal volume&lt;/summary&gt;&lt;div&gt;Rispetto al planning budget il reparto ha speso $9,900 in più, ma $9,600 si spiegano con le 480 ore in più (a $20/h di costi variabili). Il controllo della spesa in senso stretto pesa solo $300 U.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Lettura 2 · Dietro un totale piccolo ci sono scostamenti grandi&lt;/summary&gt;&lt;div&gt;Il netto di $300 U nasconde direct labor +2,050 U, utilities +1,490 U e supplies +512 U, compensati da indirect labor 2,572 F e factory administration 1,180 F. Con il &lt;span class=&quot;term&quot;&gt;management by exception&lt;/span&gt; (gestione per eccezioni: indagare solo gli scostamenti rilevanti) si guarderebbero proprio queste voci, non solo il totale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Lettura 3 · Domande da farsi su ciascuna voce&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;b&gt;Direct labor 2,050 U&lt;/b&gt;: il costo reale per ora è 154,370 ÷ 9,520 ≈ $16.22 contro $16.00 previsti. Tariffe più alte? Straordinari?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Utilities 1,490 U&lt;/b&gt;: tariffe energetiche, consumi anomali?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Supplies 512 U&lt;/b&gt;: sprechi, prezzi d&#x27;acquisto?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Indirect labor 2,572 F e factory admin 1,180 F&lt;/b&gt;: risparmi veri o rinvii (es. manutenzione, assunzioni posticipate) che costeranno dopo?&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Un F non è automaticamente un merito: va capito da dove nasce.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Errori tipici&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
    &lt;li&gt;Confrontare il reale con il &lt;b&gt;planning&lt;/b&gt; per giudicare la spesa: si mescolano volume ed efficienza.&lt;/li&gt;
    &lt;li&gt;Calcolare il flexible budget moltiplicando &lt;b&gt;anche la parte fissa&lt;/b&gt; per il rapporto 9,520/9,040.&lt;/li&gt;
    &lt;li&gt;Sbagliare la direzione: con una variance F su un costo, il reale è &lt;b&gt;minore&lt;/b&gt; del flexible, quindi si &lt;b&gt;sottrae&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Mettere segni negativi: la richiesta vuole importi positivi più lettera F/U/None.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Qual è la static budget variance totale e come si scompone?&lt;/summary&gt;&lt;div&gt;$9,900 U = $300 U (spending) + $9,600 U (activity).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Se le ore fossero state 9,040 come previsto e i manager avessero speso esattamente secondo le formule, quale sarebbe stato il costo totale?&lt;/summary&gt;&lt;div&gt;Il planning budget: $114,168 + 20 × 9,040 = &lt;b&gt;$294,968&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Quale voce merita per prima un&#x27;indagine e perché?&lt;/summary&gt;&lt;div&gt;Indirect labor (2,572 F) e direct labor (2,050 U) sono le più grandi in valore assoluto. Ha senso indagarle insieme: un risparmio sulla manodopera indiretta e un eccesso su quella diretta potrebbero avere la stessa causa, per esempio personale spostato da un ruolo all&#x27;altro. È un&#x27;ipotesi da verificare, non un dato delle slide.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide di questa esercitazione &lt;b&gt;non citano&lt;/b&gt; autori, testi, norme o siti: contengono solo il testo dell&#x27;esercizio. Indicano soltanto l&#x27;istituzione (Università degli Studi di Bergamo, Dipartimento di Scienze Aziendali) e la docente. Qui sotto trovi materiali di studio &lt;b&gt;esterni&lt;/b&gt; sullo stesso argomento, scelti perché ne usano la terminologia (&lt;em&gt;flexible budget performance report&lt;/em&gt;, &lt;em&gt;spending&lt;/em&gt; e &lt;em&gt;activity variances&lt;/em&gt;). Non vengono dal corso.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;Manuale di riferimento di managerial accounting, con molte edizioni. Il capitolo “Flexible Budgets and Performance Analysis” (numero 9 o 10 a seconda dell&#x27;edizione) introduce proprio il report a cinque colonne con planning budget, flexible budget, activity variances e spending variances. Lo schema e il formato degli esercizi di questa lezione corrispondono a quel capitolo. &lt;b&gt;Perché conta:&lt;/b&gt; è la spiegazione “ufficiale” del modello usato qui, con molti esercizi simili. Il sito indica solo il capitolo: verifica sul programma del corso se il testo adottato è questo.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0077432312/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice di un&#x27;edizione sul sito McGraw Hill Higher Education&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;OpenStax — &lt;em&gt;Principles of Accounting, Volume 2: Managerial Accounting&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;Manuale universitario gratuito e open (licenza CC BY-NC-SA) di Rice University. Il capitolo 7 “Budgeting” tratta il budget statico e la preparazione di flexible budgets distinguendo costi fissi e variabili. &lt;b&gt;Perché conta:&lt;/b&gt; è un ripasso gratuito e accessibile delle basi (cost behavior, budget statico vs flessibile) che questa esercitazione dà per scontate.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/preface&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org — Principles of Managerial Accounting&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;

  rows.forEach(function(r,i){
    var g=r[9],cls=function(k){return g.indexOf(k)&gt;=0?&#x27;given&#x27;:&#x27;calc hide&#x27;};
