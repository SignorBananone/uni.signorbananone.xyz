    &lt;b&gt;Link to the rest of the course.&lt;/b&gt; The file title (“16 … Flex budgets &lt;em&gt;ex 2&lt;/em&gt;”) indicates that this is the second exercise session on flexible budgets, following the theoretical part on budgeting. I was unable to open the other files in the &lt;code&gt;corso/&lt;/code&gt; folder, so nothing on this page comes from those materials. The theory presented here is a standard review, written to help you understand the exercise: compare it with the lecturer&#x27;s theory slides, especially regarding terminology and sign conventions.

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 1 · Concepts&lt;/div&gt;
  &lt;h2&gt;Planning budget and flexible budget&lt;/h2&gt;
  &lt;p&gt;A &lt;span class=&quot;term&quot;&gt;planning budget&lt;/span&gt; (also called a &lt;em&gt;static budget&lt;/em&gt;) is prepared &lt;b&gt;before&lt;/b&gt; the period, for a single expected level of activity. For Ray Company this is &lt;b&gt;9,040 labor-hours&lt;/b&gt; in August.&lt;/p&gt;
  &lt;p&gt;At the end of the month, the hours actually worked were &lt;b&gt;9,520&lt;/b&gt;. Comparing actual costs with the planning budget conflates two distinct effects: &lt;em&gt;more hours were worked&lt;/em&gt; and &lt;em&gt;spending per hour was different&lt;/em&gt;. This is where the &lt;span class=&quot;term&quot;&gt;flexible budget&lt;/span&gt; comes in: an estimate of what costs &lt;b&gt;should have been&lt;/b&gt; at the &lt;b&gt;actual&lt;/b&gt; level of activity.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Planning budget&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Prepared &lt;b&gt;ex ante&lt;/b&gt;&lt;/li&gt;&lt;li&gt;A single activity level: &lt;b&gt;the planned one&lt;/b&gt; (9,040 h)&lt;/li&gt;&lt;li&gt;Used for planning: resources, cash, targets&lt;/li&gt;&lt;li&gt;&lt;b&gt;Misleading&lt;/b&gt; for evaluating cost control if volume changes&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Flexible budget&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Recomputed &lt;b&gt;ex post&lt;/b&gt; (or for several levels)&lt;/li&gt;&lt;li&gt;&lt;b&gt;Actual&lt;/b&gt; activity level (9,520 h)&lt;/li&gt;&lt;li&gt;Uses the same cost formulas as the planning budget&lt;/li&gt;&lt;li&gt;The right benchmark for judging &lt;b&gt;spending&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Key idea.&lt;/b&gt; The flexible budget and the planning budget use &lt;b&gt;the same cost formulas&lt;/b&gt;; only the &lt;b&gt;q&lt;/b&gt; you plug in changes. Planning budget = formula × planned q; flexible budget = formula × actual q.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 200&quot; role=&quot;img&quot; aria-label=&quot;The three columns of the performance report&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;actual costs&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;actual q&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;430&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;a + b·q&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;actual q&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;text x=&quot;750&quot; y=&quot;75&quot; font-weight=&quot;700&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;98&quot; font-size=&quot;12&quot;&gt;a + b·q&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;planned q&lt;/text&gt;
        &lt;path d=&quot;M210,85 L330,85&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M530,85 L650,85&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;270&quot; y=&quot;30&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Spending variance&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;30&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Activity variance&lt;/text&gt;
        &lt;text x=&quot;270&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;same volume,&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;different spending&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;same formula,&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;176&quot; font-size=&quot;12&quot;&gt;different volume&lt;/text&gt;

    &lt;figcaption&gt;The layout of the &lt;em&gt;flexible budget performance report&lt;/em&gt; used in slide 2: five columns, three for amounts and two for variances.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why is comparing actual costs with the planning budget not enough to evaluate the production manager?&lt;/summary&gt;&lt;div&gt;Because the actual volume (9,520 h) differs from the planned volume (9,040 h). With more hours, variable costs inevitably rise: part of the difference reflects not how the manager spent, but how much work was done.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. What differs between the planning budget and the flexible budget: the formula or the volume?&lt;/summary&gt;&lt;div&gt;Only the volume (q). The cost formulas are the same.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Which column of the report is the right “yardstick” for judging how much was spent?&lt;/summary&gt;&lt;div&gt;The flexible budget: it shows how much should have been spent for the hours actually worked.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 2 · The cost model&lt;/div&gt;
  &lt;h2&gt;The cost formula: a + b·q&lt;/h2&gt;
  &lt;p&gt;Each line of the report has a &lt;span class=&quot;term&quot;&gt;cost formula&lt;/span&gt; of the form:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Cost = &lt;b&gt;a&lt;/b&gt; + &lt;b&gt;b&lt;/b&gt; · q&lt;/div&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;a&lt;/b&gt; = the &lt;span class=&quot;term&quot;&gt;fixed&lt;/span&gt; portion of the cost: it does not change with volume within the &lt;span class=&quot;term&quot;&gt;relevant range&lt;/span&gt; (the range of activity over which the formula holds).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;b&lt;/b&gt; = the &lt;span class=&quot;term&quot;&gt;variable&lt;/span&gt; cost per unit of the cost driver, here &lt;b&gt;per labor-hour&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;q&lt;/b&gt; = the level of activity, i.e. the &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt; (labor-hours).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;In the slide, each line&#x27;s formula is given in the first columns: fixed amount, “+”, variable rate, “(q)”. Many values are missing and must be derived. Ray Company&#x27;s costs fall into three types:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;b only&lt;/span&gt; Purely variable&lt;/h4&gt;&lt;p&gt;Direct labor: &lt;b&gt;b·q&lt;/b&gt;, with no fixed portion. Double the hours, and the cost doubles.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;a + b&lt;/span&gt; &lt;span class=&quot;term&quot;&gt;Mixed cost&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Indirect labor, utilities, supplies, factory administration: a fixed base plus a component that grows with hours.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;a only&lt;/span&gt; Purely fixed&lt;/h4&gt;&lt;p&gt;Equipment depreciation: $79,400 regardless of q. This is why its variances are 0.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Three ways to find a and b&lt;/h4&gt;&lt;p&gt;In the exercise, depending on what the table provides, you use:&lt;br&gt;① b = amount ÷ q (if a = 0)&lt;br&gt;② a = total − b·q&lt;br&gt;③ b = Δcost ÷ Δq between two columns (as in the &lt;span class=&quot;term&quot;&gt;high-low method&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Interactive chart: total department cost&lt;/h3&gt;
  &lt;p&gt;Summing the six cost formulas (derived in Part 4), the department has &lt;b&gt;a = $114,168&lt;/b&gt; and &lt;b&gt;b = $20.00 per hour&lt;/b&gt;. Move the slider to see how the flexible budget changes with volume.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;qr&quot;&gt;Labor-hours q:&lt;/label&gt;&lt;input id=&quot;qr&quot; type=&quot;range&quot; min=&quot;8000&quot; max=&quot;11000&quot; step=&quot;20&quot; value=&quot;9520&quot;&gt;&lt;b id=&quot;qv&quot; class=&quot;mono&quot;&gt;9,520&lt;/b&gt;&lt;/div&gt;
    &lt;svg id=&quot;chart&quot; viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Flexible budget line&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;&lt;small&gt;Flexible budget at q&lt;/small&gt;&lt;b id=&quot;r1&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;of which fixed&lt;/small&gt;&lt;b&gt;$114,168&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;of which variable&lt;/small&gt;&lt;b id=&quot;r2&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Activity variance vs 9,040 h&lt;/small&gt;&lt;b id=&quot;r3&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;The line is the flexible budget for each q. The gray ● is the planning budget (9,040 h); the terracotta ● is the actual cost ($304,868 at 9,520 h). The vertical distance between the actual point and the line at 9,520 h is the total spending variance ($300 U).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. With the formula $18,780 + $1.30q, what is the cost at 10,000 hours?&lt;/summary&gt;&lt;div&gt;18,780 + 1.30 × 10,000 = &lt;b&gt;$31,780&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Why does depreciation have no activity variance?&lt;/summary&gt;&lt;div&gt;Because it is a purely fixed cost (b = 0): its amount is the same at 9,040 and at 9,520 hours.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. If a cost is $4,340 at 9,040 h and $4,484 at 9,520 h, what is b?&lt;/summary&gt;&lt;div&gt;b = (4,484 − 4,340) ÷ (9,520 − 9,040) = 144 ÷ 480 = &lt;b&gt;$0.30/h&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 3 · Variances&lt;/div&gt;
  &lt;h2&gt;Spending variance and activity variance&lt;/h2&gt;
  &lt;p&gt;A &lt;span class=&quot;term&quot;&gt;variance&lt;/span&gt; is the difference between two columns of the report. The requirement asks you to enter amounts that are &lt;b&gt;always positive&lt;/b&gt; and to indicate the direction with a letter: &lt;b&gt;F&lt;/b&gt; = &lt;span class=&quot;term&quot;&gt;favorable&lt;/span&gt;, &lt;b&gt;U&lt;/b&gt; = &lt;span class=&quot;term&quot;&gt;unfavorable&lt;/span&gt;, &lt;b&gt;None&lt;/b&gt; = zero variance.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;v&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;v1&quot;&gt;Spending variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v2&quot;&gt;Activity variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v3&quot;&gt;F or U?&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;v4&quot;&gt;The total&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel on&quot; id=&quot;v1&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Spending variance = Actual results − Flexible budget&lt;/div&gt;
    &lt;p&gt;The volume is the same (actual q), so the difference depends only on &lt;b&gt;how much was paid&lt;/b&gt; and &lt;b&gt;how much was consumed&lt;/b&gt; per hour: prices, efficiency, waste, savings. This is the variance the department manager can control most directly.&lt;/p&gt;
    &lt;p&gt;For a cost: actual &amp;gt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;; actual &amp;lt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v2&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity variance = Flexible budget − Planning budget = b × (q&lt;sub&gt;actual&lt;/sub&gt; − q&lt;sub&gt;planned&lt;/sub&gt;)&lt;/div&gt;
    &lt;p&gt;Same formula, different volume. It depends &lt;b&gt;only on the variable component&lt;/b&gt;: fixed costs always have an activity variance of 0. In the exercise Δq = 9,520 − 9,040 = &lt;b&gt;480 h&lt;/b&gt;, so each activity variance = b × 480.&lt;/p&gt;
    &lt;p&gt;For a cost, more activity → higher cost → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Note: here “U” does not mean “inefficiency”. The cost rises because more work was done, which is often a good thing (higher output).&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v3&quot;&gt;
    &lt;p&gt;Rule for &lt;b&gt;cost items&lt;/b&gt;:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;U&quot;&gt;U · Unfavorable&lt;/h4&gt;&lt;p&gt;The column “closer to actual” is &lt;b&gt;higher&lt;/b&gt; than the one it is compared with: more was spent, or should have been spent.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;F&quot;&gt;F · Favorable&lt;/h4&gt;&lt;p&gt;The column “closer to actual” is &lt;b&gt;lower&lt;/b&gt;: less was spent.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;For revenues the opposite holds (higher revenue = F). This exercise involves costs only.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;v4&quot;&gt;
    &lt;p&gt;The two variances add up to the overall difference between actual results and the planning budget (static budget variance):&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;(Actual − Flexible) + (Flexible − Planning) = Actual − Planning&lt;/div&gt;
    &lt;p&gt;Ray Company: $300 U + $9,600 U = &lt;b&gt;$9,900 U&lt;/b&gt; (304,868 − 294,968). Without the flexible budget we would only see “we overspent by $9,900”. With the flexible budget we find that $9,600 is due to the additional hours and only $300 to spending.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Indirect labor: flexible budget $19,836, spending variance $2,572 F. What is the actual cost?&lt;/summary&gt;&lt;div&gt;F means actual &amp;lt; flexible: 19,836 − 2,572 = &lt;b&gt;$17,264&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Utilities has an activity variance of 528 U. With no other data, what is b?&lt;/summary&gt;&lt;div&gt;528 ÷ 480 h = &lt;b&gt;$1.10/h&lt;/b&gt;. This matches the calculation in Part 4.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Is a “U” activity variance on a cost always a negative signal?&lt;/summary&gt;&lt;div&gt;No. It only indicates that volume was higher than planned, so variable costs increased. It should be assessed together with revenues and the output produced.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 4 · The exercise (slides 2–3)&lt;/div&gt;
  &lt;h2&gt;Ray Company, Production Department, August&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; Ray Company provides excerpts from its &lt;em&gt;Production Department Flexible Budget Performance Report&lt;/em&gt; for the month ended August 31. &lt;b&gt;Requirement 1:&lt;/b&gt; complete the report, labeling each variance as F, U or None, with positive amounts.&lt;/p&gt;

  &lt;h3&gt;The given data&lt;/h3&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Cost formula&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Spending var.&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Activity var.&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Labor-hours (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;9,520&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;9,040&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;? (q)&lt;/td&gt;&lt;td&gt;$154,370&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;$152,320&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Indirect labor&lt;/td&gt;&lt;td&gt;? + $1.30 (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,572&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;F&lt;/td&gt;&lt;td&gt;19,836&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Utilities&lt;/td&gt;&lt;td&gt;$6,900 + ? (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,490&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;U&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;528&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;U&lt;/td&gt;&lt;td&gt;16,844&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Supplies&lt;/td&gt;&lt;td&gt;? + ? (q)&lt;/td&gt;&lt;td&gt;4,996&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;4,484&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;4,340&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Equipment depreciation&lt;/td&gt;&lt;td&gt;$79,400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td class=&quot;N&quot;&gt;None&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td class=&quot;N&quot;&gt;None&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Factory administration&lt;/td&gt;&lt;td&gt;$18,780 + $1.30 (q)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,180&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;F&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$304,868&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;The method, line by line&lt;/h3&gt;
  &lt;p&gt;For each line, start from the cell that “unlocks” the others. Choose an item:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;r&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;r1&quot;&gt;Direct labor&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r2&quot;&gt;Indirect labor&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r3&quot;&gt;Utilities&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r4&quot;&gt;Supplies&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r5&quot;&gt;Depreciation&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;r6&quot;&gt;Factory admin.&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel on&quot; id=&quot;r1&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Purely variable cost: b = 152,320 ÷ 9,520 = &lt;b&gt;$16.00/h&lt;/b&gt; → formula &lt;b&gt;$16.00 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 16.00 × 9,040 = &lt;b&gt;$144,640&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Spending = 154,370 − 152,320 = &lt;b&gt;2,050 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (actual is higher).&lt;/li&gt;
    &lt;li&gt;Activity = 152,320 − 144,640 = &lt;b&gt;7,680 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (= 16 × 480).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r2&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Fixed portion: a = 19,836 − 1.30 × 9,520 = 19,836 − 12,376 = &lt;b&gt;$7,460&lt;/b&gt; → formula &lt;b&gt;$7,460 + $1.30 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Actual = 19,836 − 2,572 (F, so actual is lower) = &lt;b&gt;$17,264&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 7,460 + 1.30 × 9,040 = 7,460 + 11,752 = &lt;b&gt;$19,212&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Activity = 19,836 − 19,212 = &lt;b&gt;624 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt; (= 1.30 × 480).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r3&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;From the planning budget: b = (16,844 − 6,900) ÷ 9,040 = 9,944 ÷ 9,040 = &lt;b&gt;$1.10/h&lt;/b&gt; → formula &lt;b&gt;$6,900 + $1.10 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Flexible = 6,900 + 1.10 × 9,520 = 6,900 + 10,472 = &lt;b&gt;$17,372&lt;/b&gt;. Check: 17,372 − 16,844 = 528 U ✓.&lt;/li&gt;
    &lt;li&gt;Actual = 17,372 + 1,490 (U, so actual is higher) = &lt;b&gt;$18,862&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r4&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Two known columns, two volumes: b = (4,484 − 4,340) ÷ (9,520 − 9,040) = 144 ÷ 480 = &lt;b&gt;$0.30/h&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;a = 4,484 − 0.30 × 9,520 = 4,484 − 2,856 = &lt;b&gt;$1,628&lt;/b&gt; → formula &lt;b&gt;$1,628 + $0.30 q&lt;/b&gt;. Check: 1,628 + 2,712 = 4,340 ✓.&lt;/li&gt;
    &lt;li&gt;Spending = 4,996 − 4,484 = &lt;b&gt;512 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Activity = 4,484 − 4,340 = &lt;b&gt;144 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r5&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Purely fixed cost: &lt;b&gt;$79,400&lt;/b&gt; in all three columns.&lt;/li&gt;
    &lt;li&gt;Spending 0 None (given) and activity 0 None (given): consistent, because b = 0 and actual spending equals the budget.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;r6&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
    &lt;li&gt;Complete formula: &lt;b&gt;$18,780 + $1.30 q&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Flexible = 18,780 + 1.30 × 9,520 = 18,780 + 12,376 = &lt;b&gt;$31,156&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Actual = 31,156 − 1,180 (F) = &lt;b&gt;$29,976&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Planning = 18,780 + 11,752 = &lt;b&gt;$30,532&lt;/b&gt;; activity = 31,156 − 30,532 = &lt;b&gt;624 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;

  &lt;h3&gt;The final check: the actual total&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; id=&quot;st&quot;&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;p&gt;&lt;b&gt;Step 1.&lt;/b&gt; The slide gives only one total: &lt;b&gt;Actual total expense = $304,868&lt;/b&gt;. This is the natural check on all the work: the sum of the reconstructed actual costs must equal exactly this figure.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Step 2.&lt;/b&gt; Sum of the actuals: 154,370 + 17,264 + 18,862 + 4,996 + 79,400 + 29,976 = &lt;b&gt;$304,868&lt;/b&gt; ✓. The figures reconcile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Step 3.&lt;/b&gt; Flexible total: 152,320 + 19,836 + 17,372 + 4,484 + 79,400 + 31,156 = &lt;b&gt;$304,568&lt;/b&gt;. Planning total: 144,640 + 19,212 + 16,844 + 4,340 + 79,400 + 30,532 = &lt;b&gt;$294,968&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Step 4.&lt;/b&gt; Total variances: spending = 304,868 − 304,568 = &lt;b&gt;300 U&lt;/b&gt;; activity = 304,568 − 294,968 = &lt;b&gt;9,600 U&lt;/b&gt;. Check against the individual lines: spending 2,050 U + 1,490 U + 512 U − 2,572 F − 1,180 F = 300 U ✓; activity 7,680 + 624 + 528 + 144 + 624 = 9,600 U ✓.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Step 5.&lt;/b&gt; Shortcut: the sum of the b values is 16.00 + 1.30 + 1.10 + 0.30 + 1.30 = &lt;b&gt;$20.00/h&lt;/b&gt;, and 20 × 480 h = &lt;b&gt;$9,600&lt;/b&gt;. The total activity variance can be obtained in a single line.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-d=&quot;-1&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-d=&quot;1&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Which cell is the best starting point for Utilities, and why?&lt;/summary&gt;&lt;div&gt;The planning budget ($16,844): knowing a = 6,900 and q = 9,040, you immediately obtain b = 1.10. Alternatively: 528 ÷ 480.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Indirect labor and factory administration have the same activity variance. Is this a coincidence?&lt;/summary&gt;&lt;div&gt;No: they have the same b ($1.30), and the activity variance depends only on b × Δq = 1.30 × 480 = 624. The different fixed portion is irrelevant.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. How do you verify that you have not made an error on any line?&lt;/summary&gt;&lt;div&gt;By summing the reconstructed actuals: they must equal $304,868, the only total given in the slide.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 5 · Solution and interpretation&lt;/div&gt;
  &lt;h2&gt;The completed report&lt;/h2&gt;
  &lt;p&gt;The cells marked &lt;b&gt;?&lt;/b&gt; are the ones to be calculated. Try to work them out yourself, then click a cell to see the answer, or reveal them all.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;showall&quot;&gt;Reveal all&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;hideall&quot;&gt;Hide again&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;given in the slide&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;calculated&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;
  &lt;table id=&quot;sol&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Cost formula&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Spending var.&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;Activity var.&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;&lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;What the report tells us&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg id=&quot;bars&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Spending variances by item&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Spending variances by item: bars to the right = U (above the flexible budget), to the left = F (below it). The net total is only $300 U.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;Reading 1 · Most of the variance is due to volume&lt;/summary&gt;&lt;div&gt;Compared with the planning budget, the department spent $9,900 more, but $9,600 is explained by the 480 additional hours (at $20/h of variable costs). Spending control in the strict sense accounts for only $300 U.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Reading 2 · A small total conceals large variances&lt;/summary&gt;&lt;div&gt;The net $300 U conceals direct labor +2,050 U, utilities +1,490 U and supplies +512 U, offset by indirect labor 2,572 F and factory administration 1,180 F. Under &lt;span class=&quot;term&quot;&gt;management by exception&lt;/span&gt; (investigating only significant variances), it is precisely these items that would be examined, not just the total.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Reading 3 · Questions to ask about each item&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;b&gt;Direct labor 2,050 U&lt;/b&gt;: the actual cost per hour is 154,370 ÷ 9,520 ≈ $16.22 versus the planned $16.00. Higher wage rates? Overtime?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Utilities 1,490 U&lt;/b&gt;: energy tariffs, unusual consumption?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Supplies 512 U&lt;/b&gt;: waste, purchase prices?&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Indirect labor 2,572 F and factory admin 1,180 F&lt;/b&gt;: genuine savings, or deferrals (e.g. maintenance, postponed hiring) that will cost more later?&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;An F is not automatically a merit: you need to understand where it comes from.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Common mistakes&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
    &lt;li&gt;Comparing actual results with the &lt;b&gt;planning&lt;/b&gt; budget to judge spending: this conflates volume and efficiency.&lt;/li&gt;
    &lt;li&gt;Computing the flexible budget by scaling &lt;b&gt;the fixed portion as well&lt;/b&gt; by the ratio 9,520/9,040.&lt;/li&gt;
    &lt;li&gt;Getting the direction wrong: with an F variance on a cost, actual is &lt;b&gt;lower&lt;/b&gt; than flexible, so you &lt;b&gt;subtract&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Using negative signs: the requirement asks for positive amounts plus an F/U/None label.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. What is the total static budget variance, and how does it break down?&lt;/summary&gt;&lt;div&gt;$9,900 U = $300 U (spending) + $9,600 U (activity).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. If hours had been 9,040 as planned and managers had spent exactly according to the formulas, what would the total cost have been?&lt;/summary&gt;&lt;div&gt;The planning budget: $114,168 + 20 × 9,040 = &lt;b&gt;$294,968&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Which item should be investigated first, and why?&lt;/summary&gt;&lt;div&gt;Indirect labor (2,572 F) and direct labor (2,050 U) are the largest in absolute value. It makes sense to investigate them together: a saving on indirect labor and an overrun on direct labor could share the same cause, for example staff reassigned from one role to the other. This is a hypothesis to be verified, not a fact from the slides.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The slides for this exercise &lt;b&gt;do not cite&lt;/b&gt; any authors, textbooks, standards or websites: they contain only the text of the exercise. They indicate only the institution (University of Bergamo, Department of Management) and the lecturer. Below are &lt;b&gt;external&lt;/b&gt; study materials on the same topic, chosen because they use its terminology (&lt;em&gt;flexible budget performance report&lt;/em&gt;, &lt;em&gt;spending&lt;/em&gt; and &lt;em&gt;activity variances&lt;/em&gt;). They do not come from the course.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;A standard managerial accounting textbook, published in many editions. The chapter “Flexible Budgets and Performance Analysis” (chapter 9 or 10, depending on the edition) introduces precisely the five-column report with planning budget, flexible budget, activity variances and spending variances. The layout and format of the exercises in this lecture correspond to that chapter. &lt;b&gt;Why it matters:&lt;/b&gt; it is the “official” explanation of the model used here, with many similar exercises. The website lists only the chapter: check the course syllabus to confirm whether this is the adopted textbook.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0077432312/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of one edition on the McGraw Hill Higher Education website&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
    &lt;h4&gt;OpenStax — &lt;em&gt;Principles of Accounting, Volume 2: Managerial Accounting&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;A free, open-access university textbook (CC BY-NC-SA license) from Rice University. Chapter 7, “Budgeting”, covers the static budget and the preparation of flexible budgets, distinguishing between fixed and variable costs. &lt;b&gt;Why it matters:&lt;/b&gt; it is a free and accessible review of the fundamentals (cost behavior, static vs flexible budgets) that this exercise takes for granted.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/preface&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org — Principles of Managerial Accounting&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
&lt;footer&gt;Summary written by Claude from the slides: always check against the material.&lt;/footer&gt;
