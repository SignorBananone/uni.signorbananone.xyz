        &lt;a href=&quot;#s-beyond&quot;&gt;&lt;rect x=&quot;245&quot; y=&quot;402&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;426&quot; font-weight=&quot;600&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;445&quot; font-size=&quot;11.5&quot;&gt;oltre l&#x27;esercizio&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s-beyond&quot;&gt;&lt;rect x=&quot;465&quot; y=&quot;402&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;426&quot; font-weight=&quot;600&quot;&gt;Balance sheet&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;445&quot; font-size=&quot;11.5&quot;&gt;saldi di fine luglio&lt;/text&gt;&lt;/a&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;note&quot;&gt;Le frecce mostrano da dove arriva il dato che alimenta il budget successivo. Verde = ricavi e incassi, ocra = produzione e materiali, ardesia = costi di conversione e di struttura, mattone = cassa e finanziamento; i riquadri tratteggiati sono estensioni non richieste dal testo.&lt;/p&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;nav class=&quot;toc&quot; aria-label=&quot;Indice&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;a href=&quot;#s-intro&quot;&gt;0 · Il master budget&lt;/a&gt;&lt;a href=&quot;#s-sales&quot;&gt;1–2 · Vendite e incassi&lt;/a&gt;&lt;a href=&quot;#s-prod&quot;&gt;3 · Produzione&lt;/a&gt;&lt;a href=&quot;#s-mat&quot;&gt;4–5 · Materiali&lt;/a&gt;&lt;a href=&quot;#s-costs&quot;&gt;6–8 · Lavoro, overhead, S&amp;amp;A&lt;/a&gt;&lt;a href=&quot;#s-cash&quot;&gt;9 · Cash budget&lt;/a&gt;&lt;a href=&quot;#s-beyond&quot;&gt;Oltre&lt;/a&gt;&lt;a href=&quot;#s-refs&quot;&gt;Per approfondire&lt;/a&gt;
&lt;/div&gt;&lt;/nav&gt;

&lt;main&gt;
&lt;section class=&quot;part&quot; id=&quot;s-intro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 0 · Il quadro&lt;/div&gt;
  &lt;h2&gt;Che cos&#x27;è un master budget&lt;/h2&gt;
  &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;master budget&lt;/span&gt; è l&#x27;insieme coordinato di tutti i budget di un&#x27;impresa per un periodo (qui: il mese di luglio). Non è un unico prospetto: è una &lt;b&gt;catena di prospetti&lt;/b&gt; in cui il risultato dell&#x27;uno diventa l&#x27;input del successivo. Il testo dell&#x27;esercizio chiede di costruirne la parte operativa e la cassa; la teoria qui sotto spiega la logica che il testo dà per scontata.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Operating budgets &lt;span class=&quot;pill&quot;&gt;budget operativi&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Descrivono l&#x27;attività: quanto vendere (&lt;span class=&quot;en&quot;&gt;sales budget&lt;/span&gt;), quanto produrre (&lt;span class=&quot;en&quot;&gt;production budget&lt;/span&gt;), quanti materiali comprare (&lt;span class=&quot;en&quot;&gt;direct materials budget&lt;/span&gt;), quanto lavoro e quali costi generali (&lt;span class=&quot;en&quot;&gt;direct labor&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;manufacturing overhead&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;selling and administrative expenses&lt;/span&gt;). Ragionano per competenza: il costo del mese, anche se non è ancora pagato.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Financial budgets &lt;span class=&quot;pill&quot;&gt;budget finanziari&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Traducono l&#x27;attività in denaro e in situazione patrimoniale: il &lt;span class=&quot;en&quot;&gt;cash budget&lt;/span&gt; (budget di cassa), il &lt;span class=&quot;en&quot;&gt;capital expenditure budget&lt;/span&gt; (investimenti in macchinari), il &lt;span class=&quot;en&quot;&gt;budgeted income statement&lt;/span&gt; (conto economico previsto) e il &lt;span class=&quot;en&quot;&gt;budgeted balance sheet&lt;/span&gt; (stato patrimoniale previsto).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tint&quot;&gt;
    &lt;b&gt;Il principio chiave dell&#x27;esercizio: competenza ≠ cassa.&lt;/b&gt; Ogni costo va guardato due volte. Una vendita di luglio è ricavo di luglio, ma viene incassata in parte ad agosto. L&#x27;ammortamento (&lt;span class=&quot;en&quot;&gt;depreciation&lt;/span&gt;) è un costo, ma non fa uscire un euro. La macchina comprata a luglio fa uscire € 75.000 di cassa, ma non è un costo di luglio. Il cash budget registra solo i movimenti di denaro.
  &lt;/div&gt;

  &lt;h3&gt;Perché le aziende fanno il budget&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Pianificare&lt;/summary&gt;&lt;div&gt;Obbliga i manager a pensare in anticipo e a mettere obiettivi in cifre: quante unità, quanta cassa, quanti finanziamenti.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Coordinare&lt;/summary&gt;&lt;div&gt;Vendite, produzione, acquisti e tesoreria lavorano sugli stessi numeri: se le vendite di agosto crescono, la produzione e gli acquisti di luglio si adeguano (lo vedrai nelle scorte finali).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Anticipare i problemi di liquidità&lt;/summary&gt;&lt;div&gt;È proprio il caso SmartBottle: l&#x27;azienda è redditizia, ma a luglio senza prestito finirebbe con la cassa negativa. Il cash budget lo segnala con un mese d&#x27;anticipo, così si contratta il prestito per tempo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Controllare&lt;/summary&gt;&lt;div&gt;A consuntivo si confrontano i dati reali con quelli previsti e si analizzano gli scostamenti (&lt;span class=&quot;en&quot;&gt;variances&lt;/span&gt;), argomento che di solito segue il master budget nei manuali di managerial accounting.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;I dati del caso &lt;span class=&quot;slide&quot;&gt;dalle slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;SmartBottle Company produce borracce smart riutilizzabili e prepara il master budget di &lt;b&gt;luglio&lt;/b&gt;. Apri le linguette per i dati raggruppati.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button data-t=&quot;d1&quot; aria-selected=&quot;true&quot;&gt;Vendite&lt;/button&gt;&lt;button data-t=&quot;d2&quot; aria-selected=&quot;false&quot;&gt;Scorte&lt;/button&gt;&lt;button data-t=&quot;d3&quot; aria-selected=&quot;false&quot;&gt;Costi di produzione&lt;/button&gt;&lt;button data-t=&quot;d4&quot; aria-selected=&quot;false&quot;&gt;Struttura e cassa&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d1&quot;&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Mese&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Vendite previste (unità)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Giugno&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Luglio&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;10.000&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Agosto&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12.000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Settembre&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Prezzo € 30/unità. Tutte le vendite sono &lt;span class=&quot;en&quot;&gt;on account&lt;/span&gt; (a credito, pagate dopo). Incasso: 70% nel mese della vendita, 30% nel mese successivo. &lt;span class=&quot;en&quot;&gt;Accounts receivable&lt;/span&gt; (crediti verso clienti) al 30 giugno: € 72.000, incassati a luglio.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d2&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Finished goods inventory&lt;/b&gt; (scorta di prodotti finiti): a fine mese deve essere il 20% delle vendite in unità del mese successivo. Al 30 giugno: 2.000 unità.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Raw materials inventory&lt;/b&gt; (scorta di materie prime): a fine mese il 10% del fabbisogno di produzione del mese successivo. Al 30 giugno: 3.120 kg.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d3&quot; hidden&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Direct materials&lt;/b&gt; (materiali diretti): 3 kg per borraccia a € 2/kg. Pagati 60% nel mese di acquisto e 40% il mese dopo; &lt;span class=&quot;en&quot;&gt;accounts payable&lt;/span&gt; (debiti verso fornitori) al 30 giugno € 22.000, pagati a luglio.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Direct labor&lt;/b&gt; (manodopera diretta): 0,5 &lt;span class=&quot;en&quot;&gt;direct labor-hours&lt;/span&gt; (ore di manodopera diretta) per unità a € 16/ora, pagata nel mese.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt; (costi generali di produzione): variabile € 4 per ora di manodopera diretta; fisso € 40.000/mese di cui € 8.000 di ammortamento. Parte monetaria pagata nel mese.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d4&quot; hidden&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Selling and administrative expenses&lt;/b&gt; (spese commerciali e amministrative): variabili € 2 per unità venduta; fisse € 35.000/mese di cui € 5.000 di ammortamento. Parte monetaria pagata nel mese.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Investimento&lt;/b&gt;: nuova macchina confezionatrice acquistata a luglio per € 75.000, installata ad agosto → nessun ammortamento a luglio.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Cassa&lt;/b&gt;: saldo al 1° luglio € 20.000; saldo minimo desiderato a fine mese € 30.000.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Finanziamento&lt;/b&gt;: prestito bancario a inizio luglio, in multipli di € 1.000, interesse 1% al mese pagato a fine mese.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · il quadro&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il sales budget è sempre il primo?&lt;/summary&gt;&lt;div&gt;Perché tutto dipende dal volume di vendita: produzione, acquisti, ore di lavoro, costi variabili, incassi. Un errore nelle vendite si propaga a tutta la catena.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;L&#x27;ammortamento di € 8.000 dell&#x27;overhead entra nel cash budget?&lt;/summary&gt;&lt;div&gt;No. È un costo (entra nel conto economico) ma non è un&#x27;uscita di cassa: il pagamento è avvenuto quando la macchina è stata comprata, in passato.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;La macchina da € 75.000 è un costo di luglio?&lt;/summary&gt;&lt;div&gt;No: è un investimento (&lt;span class=&quot;en&quot;&gt;capital expenditure&lt;/span&gt;). A luglio esce la cassa; il costo verrà ripartito negli anni con l&#x27;ammortamento, a partire da quando la macchina è installata e pronta all&#x27;uso (agosto).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-sales&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 1 · Punti 1 e 2&lt;/div&gt;
  &lt;h2&gt;Sales budget e schedule of expected cash collections&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;1 · Sales budget&lt;/h3&gt;
      &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;sales budget&lt;/span&gt; (budget delle vendite) moltiplica le unità previste per il prezzo. È un budget di competenza: il ricavo è di luglio anche se il cliente paga dopo.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Budgeted sales &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; unità previste × prezzo unitario&lt;/div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Luglio&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Unità previste&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;× prezzo unitario&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 300.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;2 · Cash collections&lt;/h3&gt;
      &lt;p&gt;La &lt;span class=&quot;en&quot;&gt;schedule of expected cash collections&lt;/span&gt; (prospetto degli incassi attesi) dice quanto denaro entra davvero. A luglio entrano due cose: il credito di giugno e la quota di luglio incassata subito.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Incassi luglio &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; AR iniziale + 70% × vendite luglio&lt;/div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts receivable 30 giugno&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;72.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Vendite luglio: 70% × 300.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;210.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash collections&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;282.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Resta da incassare ad agosto: 30% × 300.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;90.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Controllo di coerenza.&lt;/b&gt; Il credito di € 72.000 non è un numero a caso: è il 30% delle vendite di giugno (8.000 × € 30 = 240.000; 30% = 72.000). Se nel compito i saldi iniziali &quot;tornano&quot; con i dati, è un buon segno che hai capito la regola.&lt;/div&gt;

  &lt;h3&gt;Come si spostano gli incassi nel tempo&lt;/h3&gt;
  &lt;p&gt;Muovi il cursore: cambia la quota incassata nel mese di vendita e guarda come cambiano gli incassi di luglio e il credito che passa ad agosto.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;collSl&quot;&gt;% incassata nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;collSl&quot; min=&quot;40&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;collOut&quot;&gt;70%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 660 150&quot; aria-label=&quot;Composizione degli incassi&quot;&gt;
      &lt;text x=&quot;30&quot; y=&quot;20&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Incassi di luglio&lt;/text&gt;
      &lt;rect id=&quot;cbA&quot; x=&quot;30&quot; y=&quot;28&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.55&quot; rx=&quot;3&quot;/&gt;
      &lt;rect id=&quot;cbB&quot; y=&quot;28&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; rx=&quot;3&quot;/&gt;
      &lt;text x=&quot;36&quot; y=&quot;50&quot; font-size=&quot;11.5&quot; fill=&quot;var(--paper)&quot; style=&quot;fill:var(--paper)&quot;&gt;AR giugno 72k&lt;/text&gt;
      &lt;text id=&quot;cbBt&quot; y=&quot;50&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;92&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Vendite di luglio (€ 300.000)&lt;/text&gt;
      &lt;rect id=&quot;cbC&quot; y=&quot;100&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; rx=&quot;3&quot;/&gt;
      &lt;rect id=&quot;cbD&quot; y=&quot;100&quot; height=&quot;34&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.7&quot; rx=&quot;3&quot;/&gt;
      &lt;text id=&quot;cbDt&quot; y=&quot;122&quot; font-size=&quot;11.5&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Incassi luglio&lt;/span&gt;&lt;b id=&quot;collTot&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Credito a fine luglio&lt;/span&gt;&lt;b id=&quot;collAR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Il ricavo resta € 300.000 qualunque sia la quota: cambia solo &lt;em&gt;quando&lt;/em&gt; entra il denaro.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · vendite e incassi&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Se gli incassi fossero 60% nel mese e 40% nel successivo, quanto sarebbe il credito al 30 giugno (stesse vendite di giugno)?&lt;/summary&gt;&lt;div&gt;40% × 240.000 = € 96.000. Incassi di luglio: 96.000 + 60% × 300.000 = € 276.000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto vale l&#x27;accounts receivable a fine luglio?&lt;/summary&gt;&lt;div&gt;30% × 300.000 = € 90.000: andrà nel budgeted balance sheet e sarà incassato ad agosto.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il ricavo di luglio (300.000) è diverso dagli incassi di luglio (282.000)?&lt;/summary&gt;&lt;div&gt;Perché il ricavo segue la competenza (vendite del mese), gli incassi la cassa (denaro ricevuto, che include crediti del mese prima ed esclude la parte di luglio pagata ad agosto).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s-prod&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 2 · Punto 3&lt;/div&gt;
  &lt;h2&gt;Production budget&lt;/h2&gt;
  &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;production budget&lt;/span&gt; (budget di produzione) dice quante unità fabbricare. Non coincide con le vendite, perché bisogna anche lasciare in magazzino la scorta desiderata per il mese dopo, e si può usare quella già presente a inizio mese.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Produzione &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; vendite + scorta finale desiderata − scorta iniziale&lt;/div&gt;
  &lt;p&gt;È un&#x27;equazione di magazzino: ciò che serve (vendere + lasciare in scorta) deve essere coperto da ciò che c&#x27;è (scorta iniziale) più ciò che si produce.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Luglio&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;unità&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Vendite previste&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;+ Scorta finale desiderata (20% × 12.000 di agosto)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;= Fabbisogno totale&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12.400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Scorta iniziale (30 giugno)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Required production&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.400&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;Coerenza: 2.000 al 30 giugno = 20% × 10.000 vendite di luglio. La politica di scorta era già rispettata.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fgSl&quot;&gt;Scorta finale % vendite mese dopo&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fgSl&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;fgOut&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 150&quot; aria-label=&quot;Equazione di magazzino&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;40&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Serve&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;56&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot; style=&quot;fill:var(--muted)&quot;&gt;vendite + scorta fin.&lt;/text&gt;
        &lt;rect id=&quot;pbS&quot; x=&quot;150&quot; y=&quot;22&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;156&quot; y=&quot;47&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;Vendite 10.000&lt;/text&gt;
        &lt;rect id=&quot;pbE&quot; y=&quot;22&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.5&quot;/&gt;
        &lt;text id=&quot;pbEt&quot; y=&quot;78&quot; font-size=&quot;11&quot;&gt;&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;112&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Coperto da&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;128&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot; style=&quot;fill:var(--muted)&quot;&gt;scorta iniz. + prod.&lt;/text&gt;
        &lt;rect id=&quot;pbI&quot; x=&quot;150&quot; y=&quot;94&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot; opacity=&quot;.5&quot;/&gt;
        &lt;rect id=&quot;pbP&quot; y=&quot;94&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;152&quot; y=&quot;148&quot; font-size=&quot;11&quot;&gt;↑ iniziale 2.000&lt;/text&gt;
        &lt;text id=&quot;pbPt&quot; x=&quot;230&quot; y=&quot;119&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Scorta finale&lt;/span&gt;&lt;b id=&quot;fgEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Produzione luglio&lt;/span&gt;&lt;b id=&quot;fgProd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Le due barre hanno sempre la stessa lunghezza: è l&#x27;equazione di magazzino.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Perché tenere una scorta di prodotti finiti?&lt;/summary&gt;&lt;div&gt;Per non perdere vendite se la domanda arriva prima della produzione o se la produzione ha intoppi. Legarla in percentuale alle vendite del mese dopo è una regola semplice: più vendite attese, più scorta. Il rovescio: la scorta costa (capitale immobilizzato, spazio, obsolescenza), quindi la percentuale è un compromesso.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Serve anche la produzione di agosto? Sì, per il punto 4&lt;/summary&gt;&lt;div&gt;La scorta di materie prime di fine luglio dipende dalla produzione di &lt;b&gt;agosto&lt;/b&gt;. Calcolala con la stessa formula: 12.000 vendite + 20% × 9.000 (settembre) = 1.800 − 2.400 scorta iniziale di agosto (= finale di luglio) = &lt;b&gt;11.400 unità&lt;/b&gt;. Ecco perché il testo dà anche le vendite di settembre.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · produzione&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Se le vendite di agosto fossero 15.000, quanto si produrrebbe a luglio?&lt;/summary&gt;&lt;div&gt;10.000 + 20% × 15.000 (3.000) − 2.000 = 11.000 unità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la scorta iniziale di agosto?&lt;/summary&gt;&lt;div&gt;La scorta finale di luglio: 2.400 unità. La finale di un mese è sempre l&#x27;iniziale del successivo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In che caso la produzione è minore delle vendite?&lt;/summary&gt;&lt;div&gt;Quando la scorta iniziale supera quella finale desiderata, cioè quando si prevede un calo delle vendite e si &quot;svuota&quot; il magazzino. Per luglio succederebbe con vendite di agosto inferiori a 10.000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;s-mat&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 3 · Punti 4 e 5&lt;/div&gt;
  &lt;h2&gt;Direct materials budget e pagamenti ai fornitori&lt;/h2&gt;
  &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;direct materials budget&lt;/span&gt; (budget dei materiali diretti) applica la stessa logica di magazzino alle materie prime, ma in &lt;b&gt;chilogrammi&lt;/b&gt; e con la scorta legata alla &lt;b&gt;produzione&lt;/b&gt; (non alle vendite) del mese successivo.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Acquisti (kg) &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; fabbisogno per la produzione + scorta finale desiderata − scorta iniziale&lt;/div&gt;

  &lt;div class=&quot;steps card&quot; data-table=&quot;tMat&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;steplab note&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Fabbisogno di luglio.&lt;/b&gt; Ogni borraccia usa 3 kg: 10.400 unità × 3 = &lt;b&gt;31.200 kg&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Scorta finale desiderata.&lt;/b&gt; 10% del fabbisogno di agosto. Produzione di agosto 11.400 unità × 3 kg = 34.200 kg → 10% = &lt;b&gt;3.420 kg&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Scorta iniziale.&lt;/b&gt; 3.120 kg (che è proprio il 10% di 31.200: coerente). Il fabbisogno totale 31.200 + 3.420 = 34.620 kg, meno 3.120 = &lt;b&gt;31.500 kg da acquistare&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Valore degli acquisti.&lt;/b&gt; 31.500 kg × € 2 = &lt;b&gt;€ 63.000&lt;/b&gt;. Questo è il costo degli acquisti, non ancora il pagamento.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Pagamenti di luglio (punto 5).&lt;/b&gt; Si paga il debito di giugno, € 22.000, più il 60% degli acquisti di luglio (37.800) = &lt;b&gt;€ 59.800&lt;/b&gt;. Il 40% restante, € 25.200, diventa accounts payable di fine luglio.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tMat&quot;&gt;&lt;tr&gt;&lt;th&gt;4 · Direct materials budget&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;luglio&lt;/th&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;Produzione (unità)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;× kg per unità&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;= Fabbisogno per la produzione (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31.200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;+ Scorta finale desiderata (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.420&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;= Fabbisogno totale (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;34.620&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;− Scorta iniziale (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Materiali da acquistare (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31.500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;3&quot;&gt;&lt;td&gt;× costo per kg&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 2&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;3&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Costo degli acquisti&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 63.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;5 · Cash disbursements for materials&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Accounts payable 30 giugno&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Acquisti luglio: 60% × 63.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37.800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;59.800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Debito a fine luglio: 40% × 63.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.200&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;en&quot;&gt;Cash disbursements&lt;/span&gt; = esborsi di cassa, pagamenti effettivi.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le due &quot;catene di magazzino&quot; a confronto&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 880 200&quot; aria-label=&quot;Confronto tra budget di produzione e budget materiali&quot;&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;160&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;48&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Production budget (unità)&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;80&quot;&gt;vendite del mese&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;104&quot;&gt;+ scorta finale = 20% vendite mese dopo&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;128&quot;&gt;− scorta iniziale&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;158&quot; font-weight=&quot;700&quot;&gt;= unità da produrre&lt;/text&gt;
      &lt;rect x=&quot;450&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;160&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;text x=&quot;470&quot; y=&quot;48&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Direct materials budget (kg)&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;80&quot;&gt;produzione del mese × 3 kg&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;104&quot;&gt;+ scorta finale = 10% fabbisogno mese dopo&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;128&quot;&gt;− scorta iniziale&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;158&quot; font-weight=&quot;700&quot;&gt;= kg da acquistare × € 2&lt;/text&gt;
    &lt;/g&gt;
    &lt;path d=&quot;M330,158 C390,158 400,80 462,80&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;note&quot;&gt;L&#x27;output del primo (unità da produrre) è l&#x27;input del secondo: è il &quot;legame a cascata&quot; del master budget.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · materiali&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Errore tipico: calcolare la scorta finale di materie prime come 10% del fabbisogno di luglio. Cosa si otterrebbe?&lt;/summary&gt;&lt;div&gt;3.120 kg invece di 3.420: acquisti 31.200 kg (€ 62.400) e pagamenti 22.000 + 37.440 = € 59.440. Sbagliato: la regola guarda al mese &lt;b&gt;successivo&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il costo dei materiali usati (31.200 × 2 = 62.400) è diverso dal costo degli acquisti (63.000)?&lt;/summary&gt;&lt;div&gt;Perché a luglio la scorta di materie prime sale di 300 kg (da 3.120 a 3.420): si compra più di quanto si consuma. 300 kg × € 2 = € 600 di differenza.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto si pagherà ad agosto per gli acquisti di luglio?&lt;/summary&gt;&lt;div&gt;Il 40%: € 25.200.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-costs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 4 · Punti 6, 7 e 8&lt;/div&gt;
  &lt;h2&gt;Direct labor, manufacturing overhead, selling &amp;amp; administrative&lt;/h2&gt;
  &lt;p&gt;Tre budget di costo con la stessa struttura: una parte &lt;b&gt;variabile&lt;/b&gt; (cresce con un &lt;span class=&quot;en&quot;&gt;cost driver&lt;/span&gt;, cioè la grandezza che &quot;guida&quot; il costo: ore o unità) e una parte &lt;b&gt;fissa&lt;/b&gt; (uguale ogni mese). Per overhead e S&amp;amp;A il testo chiede di distinguere il &lt;b&gt;totale&lt;/b&gt; (competenza) dalla parte &lt;b&gt;cash&lt;/b&gt;: si toglie l&#x27;ammortamento.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Costo totale &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; tasso variabile × driver + costi fissi &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Cash &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; totale − depreciation&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button data-t=&quot;c1&quot; aria-selected=&quot;true&quot;&gt;6 · Direct labor&lt;/button&gt;&lt;button data-t=&quot;c2&quot; aria-selected=&quot;false&quot;&gt;7 · Mfg overhead&lt;/button&gt;&lt;button data-t=&quot;c3&quot; aria-selected=&quot;false&quot;&gt;8 · Selling &amp;amp; admin&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;
    &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;direct labor budget&lt;/span&gt; parte dalle unità &lt;b&gt;prodotte&lt;/b&gt; (non vendute!): le ore si spendono per fabbricare.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct labor&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;luglio&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Unità da produrre&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× ore di manodopera diretta per unità&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Direct labor-hours&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5.200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× tariffa oraria&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 16&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Direct labor cost (tutto pagato nel mese)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 83.200&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;note&quot;&gt;Le 5.200 ore servono anche per il punto 7: sono il driver dell&#x27;overhead variabile.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;
    &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;manufacturing overhead&lt;/span&gt; raccoglie i costi di produzione che non si attribuiscono direttamente alla singola borraccia: energia, manutenzione, supervisione, ammortamento degli impianti.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Manufacturing overhead&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Variabile: 5.200 DLH × € 4&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fisso&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total manufacturing overhead&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60.800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Depreciation (non monetaria)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cash disbursements for overhead&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52.800&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;
    &lt;p&gt;Le &lt;span class=&quot;en&quot;&gt;selling and administrative expenses&lt;/span&gt; (spese di vendita e amministrative) non sono costi di produzione: il loro driver variabile sono le unità &lt;b&gt;vendute&lt;/b&gt;.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Selling &amp;amp; administrative&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Variabile: 10.000 unità vendute × € 2&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fisso&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total S&amp;amp;A expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;55.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Depreciation (non monetaria)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cash disbursements for S&amp;amp;A&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Totale contro cassa, a colpo d&#x27;occhio&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 820 230&quot; aria-label=&quot;Confronto costi totali e uscite di cassa&quot;&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;line x1=&quot;200&quot; y1=&quot;10&quot; x2=&quot;200&quot; y2=&quot;200&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;Direct labor&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;28&quot; width=&quot;499&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;706&quot; y=&quot;42&quot;&gt;83.200&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;50&quot; width=&quot;499&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;706&quot; y=&quot;64&quot;&gt;83.200 cash&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;105&quot; font-weight=&quot;600&quot;&gt;Mfg overhead&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;88&quot; width=&quot;365&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;572&quot; y=&quot;102&quot;&gt;60.800&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;110&quot; width=&quot;317&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;517&quot; y=&quot;110&quot; width=&quot;48&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;572&quot; y=&quot;124&quot;&gt;52.800 cash (− 8.000 amm.)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;165&quot; font-weight=&quot;600&quot;&gt;Selling &amp;amp; admin&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;148&quot; width=&quot;330&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;537&quot; y=&quot;162&quot;&gt;55.000&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;170&quot; width=&quot;300&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;500&quot; y=&quot;170&quot; width=&quot;30&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;537&quot; y=&quot;184&quot;&gt;50.000 cash (− 5.000 amm.)&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;210&quot; width=&quot;14&quot; height=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;219&quot;&gt;costo totale (competenza)&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;210&quot; width=&quot;14&quot; height=&quot;10&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;219&quot;&gt;uscita di cassa&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;details&gt;&lt;summary&gt;Variabile o fisso? Il comportamento dei costi&lt;/summary&gt;&lt;div&gt;Un costo &lt;b&gt;variabile&lt;/b&gt; cresce in proporzione al driver (raddoppiano le ore → raddoppia l&#x27;overhead variabile). Un costo &lt;b&gt;fisso&lt;/b&gt; resta costante entro un intervallo di attività (affitti, stipendi di struttura, ammortamenti). Questa distinzione è la base anche dell&#x27;analisi costi-volumi-risultati e dei &lt;span class=&quot;en&quot;&gt;flexible budgets&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché l&#x27;ammortamento è &quot;non-cash&quot;?&lt;/summary&gt;&lt;div&gt;L&#x27;ammortamento ripartisce negli anni il costo di un bene già pagato. Il denaro è uscito il giorno dell&#x27;acquisto (come accade a luglio per la nuova macchina): contarlo di nuovo ogni mese sarebbe un doppio conteggio nel cash budget.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · costi&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il direct labor usa 10.400 unità e il S&amp;amp;A 10.000?&lt;/summary&gt;&lt;div&gt;Il lavoro diretto serve a produrre (10.400 unità prodotte); le spese commerciali variabili dipendono da quanto si vende (10.000 unità vendute).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se la produzione salisse di 1.000 unità, di quanto aumenterebbe l&#x27;overhead totale?&lt;/summary&gt;&lt;div&gt;1.000 × 0,5 ore × € 4 = € 2.000 (solo la parte variabile; i € 40.000 fissi non cambiano).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il costo variabile di produzione per unità?&lt;/summary&gt;&lt;div&gt;Materiali 3 kg × € 2 = 6 + lavoro 0,5 × 16 = 8 + overhead variabile 0,5 × 4 = 2 → &lt;b&gt;€ 16&lt;/b&gt; per borraccia.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-cash&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 5 · Punto 9&lt;/div&gt;
  &lt;h2&gt;Cash budget, investimento e prestito bancario&lt;/h2&gt;
  &lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;cash budget&lt;/span&gt; riunisce tutti gli incassi e i pagamenti calcolati finora, aggiunge l&#x27;investimento e decide il finanziamento. La struttura classica ha quattro blocchi:&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 880 110&quot; aria-label=&quot;Struttura del cash budget&quot;&gt;
    &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;Cassa disponibile&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;saldo iniziale + incassi&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;− Disbursements&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;tutti i pagamenti&lt;/text&gt;
      &lt;rect x=&quot;455&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;= Excess (deficiency)&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;surplus o buco&lt;/text&gt;
      &lt;rect x=&quot;680&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;775&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;± Financing&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;→ saldo finale&lt;/text&gt;
    &lt;/g&gt;
    &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;195&quot; y1=&quot;55&quot; x2=&quot;228&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;55&quot; x2=&quot;453&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;645&quot; y1=&quot;55&quot; x2=&quot;678&quot; y2=&quot;55&quot;/&gt;&lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;steps card&quot; data-table=&quot;tCash&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;steplab note&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Cassa disponibile.&lt;/b&gt; Saldo al 1° luglio € 20.000 + incassi (punto 2) € 282.000 = &lt;b&gt;€ 302.000&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Uscite operative.&lt;/b&gt; Materiali 59.800 (punto 5) + lavoro 83.200 (punto 6) + overhead cash 52.800 (punto 7) + S&amp;amp;A cash 50.000 (punto 8). Attenzione: le versioni &lt;em&gt;cash&lt;/em&gt;, senza ammortamenti.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Investimento.&lt;/b&gt; Si aggiunge la macchina, € 75.000: uscita di cassa di luglio anche se non è un costo di luglio. Totale uscite &lt;b&gt;€ 320.800&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Saldo prima del finanziamento.&lt;/b&gt; 302.000 − 320.800 = &lt;b&gt;− € 18.800&lt;/b&gt;. Il minimo richiesto è + 30.000: mancano almeno 48.800.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Quanto prendere a prestito.&lt;/b&gt; Il prestito B arriva a inizio luglio e l&#x27;interesse dell&#x27;1% si paga a fine luglio, quindi riduce il saldo: −18.800 + B − 0,01·B ≥ 30.000 → 0,99·B ≥ 48.800 → B ≥ 49.293. Primo multiplo di 1.000: &lt;b&gt;B = € 50.000&lt;/b&gt;, interessi € 500.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Saldo finale.&lt;/b&gt; −18.800 + 50.000 − 500 = &lt;b&gt;€ 30.700&lt;/b&gt; ≥ 30.000 ✓. Con 49.000 si avrebbe −18.800 + 49.000 − 490 = 29.710: insufficiente.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tCash&quot;&gt;&lt;tr&gt;&lt;th&gt;9 · Cash budget — luglio&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;Cash balance, beginning&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;+ Cash collections&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;282.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Total cash available&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;302.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Direct materials&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;59.800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Direct labor&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;83.200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Manufacturing overhead (cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52.800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Selling &amp;amp; administrative (cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;− Equipment purchase (packaging machine)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;2&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Total disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;320.800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;3&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Excess (deficiency) of cash available over disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(18.800)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;+ Borrowing (inizio luglio)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;− Interest (1% × 50.000, fine luglio)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;Total financing&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;49.500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;5&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Cash balance, ending&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30.700&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Trappola dei multipli.&lt;/b&gt; Non basta coprire il buco fino al minimo (48.800 → 49.000): l&#x27;interesse pagato a fine mese erode il saldo. Prova qui sotto.&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;borSl&quot;&gt;Prestito&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;borSl&quot; min=&quot;45000&quot; max=&quot;55000&quot; step=&quot;1000&quot; value=&quot;49000&quot;&gt;&lt;output id=&quot;borOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Interessi 1%&lt;/span&gt;&lt;b id=&quot;borInt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Saldo finale&lt;/span&gt;&lt;b id=&quot;borEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Esito&lt;/span&gt;&lt;b id=&quot;borOk&quot; style=&quot;font-size:1.05rem&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;sim-h&quot;&gt;Simulatore what-if: tutta la catena in un grafico&lt;/h3&gt;
  &lt;p&gt;Cambia le ipotesi: il modello ricalcola produzione, acquisti, costi, cassa e prestito con le regole del caso (scorte, percentuali di incasso e pagamento, multipli di € 1.000, interesse 1%). Il grafico a cascata (&lt;span class=&quot;en&quot;&gt;waterfall chart&lt;/span&gt;) mostra come si arriva dal saldo iniziale a quello finale.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;sim&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sSales&quot;&gt;Vendite luglio&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sSales&quot; min=&quot;7000&quot; max=&quot;14000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;sSalesO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sPrice&quot;&gt;Prezzo unitario&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sPrice&quot; min=&quot;24&quot; max=&quot;36&quot; step=&quot;1&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;sPriceO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sColl&quot;&gt;% incassata nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sColl&quot; min=&quot;40&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;sCollO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sMach&quot;&gt;Costo macchina&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sMach&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;5000&quot; value=&quot;75000&quot;&gt;&lt;output id=&quot;sMachO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sMin&quot;&gt;Saldo minimo&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sMin&quot; min=&quot;0&quot; max=&quot;60000&quot; step=&quot;5000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;sMinO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;button class=&quot;btn&quot; id=&quot;simReset&quot; style=&quot;margin:6px 0&quot;&gt;Ripristina i dati del caso&lt;/button&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Produzione&lt;/span&gt;&lt;b id=&quot;kProd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Acquisti&lt;/span&gt;&lt;b id=&quot;kKg&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Saldo prima fin.&lt;/span&gt;&lt;b id=&quot;kExc&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Prestito&lt;/span&gt;&lt;b id=&quot;kBor&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Interessi&lt;/span&gt;&lt;b id=&quot;kInt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Cassa finale&lt;/span&gt;&lt;b id=&quot;kEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 900 315&quot; id=&quot;wf&quot; aria-label=&quot;Grafico a cascata della cassa di luglio&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; id=&quot;simMsg&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · cassa&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il saldo è negativo anche se l&#x27;azienda guadagna (vedi parte successiva)?&lt;/summary&gt;&lt;div&gt;Per tre effetti di cassa: l&#x27;acquisto della macchina (€ 75.000), il credito di luglio non ancora incassato (€ 90.000 contro i 72.000 di giugno incassati) e la crescita delle scorte. Utile e liquidità sono cose diverse.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se l&#x27;interesse si pagasse solo al rimborso (non a fine luglio), quanto basterebbe prendere a prestito?&lt;/summary&gt;&lt;div&gt;Basterebbe coprire 48.800 → € 49.000, e il saldo finale sarebbe 30.200. L&#x27;interesse maturato (490) andrebbe comunque nel conto economico come costo di competenza.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Senza l&#x27;acquisto della macchina servirebbe un prestito?&lt;/summary&gt;&lt;div&gt;No: il saldo prima del finanziamento sarebbe −18.800 + 75.000 = € 56.200, sopra il minimo di 30.000. Verificalo col simulatore portando il costo macchina a 0.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s-beyond&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 6 · Oltre il testo&lt;/div&gt;
  &lt;h2&gt;Chiudere il master budget: conto economico e saldi di fine luglio&lt;/h2&gt;
  &lt;p&gt;Il testo si ferma al cash budget, ma il master budget completo prosegue con il &lt;span class=&quot;en&quot;&gt;budgeted income statement&lt;/span&gt; e il &lt;span class=&quot;en&quot;&gt;budgeted balance sheet&lt;/span&gt;. Sono qui come &lt;b&gt;estensione didattica&lt;/b&gt;, ricavata solo dai dati dell&#x27;esercizio: servono a vedere la differenza tra utile e cassa. Non fanno parte della consegna.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Conto economico di luglio · formato a margine di contribuzione&lt;/h4&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Variable cost of goods sold (10.000 × € 16)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;160.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Variable S&amp;amp;A (10.000 × € 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Contribution margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Fixed manufacturing overhead (amm. incluso)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Fixed S&amp;amp;A (amm. incluso)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;45.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income (prima delle imposte)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44.500&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;Il &lt;span class=&quot;en&quot;&gt;contribution margin&lt;/span&gt; (margine di contribuzione) è ciò che resta dei ricavi dopo i costi variabili, per coprire i fissi. Con il &lt;span class=&quot;en&quot;&gt;absorption costing&lt;/span&gt; (costo pieno, usato nel bilancio esterno) una parte dei costi fissi di produzione resterebbe nelle 400 unità di scorta in più e l&#x27;utile sarebbe un po&#x27; più alto: per calcolarlo servirebbe un tasso di imputazione dell&#x27;overhead fisso che il testo non fornisce.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Saldi patrimoniali al 31 luglio che emergono dall&#x27;esercizio&lt;/h4&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30.700&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts receivable (30% × 300.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;90.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Raw materials (3.420 kg × € 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6.840&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Finished goods (2.400 u. × € 16 a costo variabile)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;38.400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Nuova macchina (non ancora ammortizzata)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts payable (40% × 63.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;È solo la parte del bilancio che si ricava dai dati: mancano i saldi iniziali di impianti, patrimonio netto ecc.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Utile € 44.500, ma serve un prestito da € 50.000: la riconciliazione&lt;/h3&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Dall&#x27;utile alla variazione di cassa&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44.500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Ammortamenti (8.000 + 5.000), costi senza uscita&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Aumento crediti (90.000 − 72.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(18.000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Aumento scorte materie prime (300 kg × 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Aumento scorte prodotti finiti (400 u. × 16)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(6.400)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Aumento debiti fornitori (25.200 − 22.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Acquisto macchina&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75.000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Prestito ottenuto&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Variazione di cassa (da 20.000 a 30.700)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.700&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Questa è la logica del rendiconto finanziario con metodo indiretto. Torna al centesimo con il cash budget: è un ottimo controllo per il compito.&lt;/p&gt;

  &lt;h3&gt;Errori tipici da evitare&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Usare le vendite al posto della produzione&lt;/summary&gt;&lt;div&gt;Materiali, lavoro diretto e overhead variabile dipendono dalle unità &lt;b&gt;prodotte&lt;/b&gt; (10.400); solo il S&amp;amp;A variabile e il ricavo dipendono dalle unità &lt;b&gt;vendute&lt;/b&gt; (10.000).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Dimenticare la produzione di agosto&lt;/summary&gt;&lt;div&gt;La scorta finale di materie prime si basa sul fabbisogno di agosto (11.400 × 3 kg), che va calcolato con le vendite di settembre.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Lasciare l&#x27;ammortamento nel cash budget&lt;/summary&gt;&lt;div&gt;Overhead e S&amp;amp;A entrano nel cash budget per 52.800 e 50.000, non per 60.800 e 55.000.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Dimenticare i saldi iniziali di crediti e debiti&lt;/summary&gt;&lt;div&gt;Gli € 72.000 di crediti e i € 22.000 di debiti si incassano e si pagano a luglio: vanno nei prospetti dei punti 2 e 5.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Arrotondare il prestito senza contare l&#x27;interesse&lt;/summary&gt;&lt;div&gt;49.000 sembra bastare, ma dopo l&#x27;interesse il saldo è 29.710. La risposta corretta è 50.000.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · visione d&#x27;insieme&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Elenca in ordine i nove prospetti e per ciascuno il dato che passa al successivo.&lt;/summary&gt;&lt;div&gt;① vendite (unità, €) → ② incassi (€ al cash budget) · ③ produzione (unità) → ④ materiali (kg, € acquisti) → ⑤ pagamenti (€) · ③ → ⑥ lavoro (ore, €) → ⑦ overhead (ore come driver; € cash) · ① → ⑧ S&amp;amp;A (€ cash) · ②⑤⑥⑦⑧ + macchina → ⑨ cash budget → prestito.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale dato del caso non serve per i nove punti ma servirebbe per il conto economico?&lt;/summary&gt;&lt;div&gt;L&#x27;informazione che la macchina non genera ammortamento a luglio: non tocca la cassa, ma dice che nel conto economico di luglio non c&#x27;è un ammortamento in più.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-slate refs&quot; id=&quot;s-refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Parte 7&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Il testo dell&#x27;esercizio &lt;b&gt;non cita&lt;/b&gt; autori, manuali, norme o siti. Le voci qui sotto sono quindi &lt;b&gt;tutte fonti esterne&lt;/b&gt;, scelte perché trattano esattamente gli argomenti del caso; non è detto che coincidano con i testi adottati dal corso: controlla il programma.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;Il manuale di riferimento internazionale di contabilità direzionale. Il capitolo &lt;em&gt;Master Budgeting&lt;/em&gt; (in alcune edizioni &lt;em&gt;Profit Planning&lt;/em&gt;; il numero del capitolo cambia da un&#x27;edizione all&#x27;altra) segue la stessa sequenza dell&#x27;esercizio: sales budget, cash collections, production, direct materials, direct labor, overhead, S&amp;amp;A, cash budget con saldo minimo e prestito in multipli, poi conto economico e stato patrimoniale previsti. Il capitolo successivo tratta i &lt;span class=&quot;en&quot;&gt;flexible budgets&lt;/span&gt; e l&#x27;analisi degli scostamenti. Conta perché la struttura e i termini inglesi del caso SmartBottle sono quelli di questo manuale.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice di un&#x27;edizione sul sito McGraw Hill Higher Education&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;OpenStax — &lt;em&gt;Principles of Managerial Accounting&lt;/em&gt;, cap. 7 &quot;Budgeting&quot;&lt;/h4&gt;
    &lt;p&gt;Manuale gratuito e aperto (in alcuni cataloghi &lt;em&gt;Principles of Accounting, Volume 2&lt;/em&gt;). Il capitolo 7 spiega la preparazione dei budget operativi (produzione, materiali, lavoro, overhead, S&amp;amp;A), i prospetti di incassi e pagamenti, il cash budget (che combina incassi, pagamenti e budget degli investimenti) e il budgeted balance sheet, con glossario ed esercizi. Conta perché è consultabile gratis e ha domande di ripasso sugli stessi passaggi.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/chapter-7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org — Chapter 7&lt;/a&gt; · &lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/7-key-terms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Key terms&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;IAS 16 &lt;em&gt;Property, Plant and Equipment&lt;/em&gt; (IFRS Foundation)&lt;/h4&gt;
    &lt;p&gt;Il principio contabile internazionale su immobili, impianti e macchinari: rilevazione, misurazione, ammortamento. Prevede che l&#x27;ammortamento inizi quando il bene è disponibile per l&#x27;uso, cioè nel luogo e nelle condizioni per funzionare come previsto dalla direzione (par. 55). È la ragione per cui la macchina comprata a luglio ma installata ad agosto non genera ammortamento a luglio. Conta perché collega una frase del testo a una regola di bilancio vera.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 16&lt;/a&gt; · &lt;a href=&quot;https://ifrscommunity.com/?p=2931&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;commento IFRS Community su ammortamento (IAS 16 e IAS 38)&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  const fmt = n =&gt; (n&lt;0?&quot;− &quot;:&quot;&quot;) + Math.round(Math.abs(n)).toLocaleString(&quot;it-IT&quot;);
  const eur = n =&gt; (n&lt;0?&quot;− € &quot;:&quot;€ &quot;) + Math.round(Math.abs(n)).toLocaleString(&quot;it-IT&quot;);
  const $ = (s,r=document) =&gt; r.querySelector(s);
  const $$ = (s,r=document) =&gt; Array.from(r.querySelectorAll(s));

  /* modello completo del caso SmartBottle (luglio) */
  function model(o){
    const p = Object.assign({sales:10000, price:30, coll:0.7, fg:0.2, machine:75000, minCash:30000}, o||{});
    const r = {p};
    r.rev = p.sales*p.price;
    r.coll = 72000 + p.coll*r.rev;
    r.endFG = p.fg*12000; r.prod = p.sales + r.endFG - 2000;
    r.augProd = 12000 + p.fg*9000 - r.endFG;
    r.need = r.prod*3; r.endRM = 0.10*r.augProd*3; r.kg = r.need + r.endRM - 3120; r.purch = r.kg*2;
    r.disb = 22000 + 0.6*r.purch;
    r.dlh = r.prod*0.5; r.dl = r.dlh*16;
    r.moh = r.dlh*4 + 40000; r.mohCash = r.moh - 8000;
    r.sa = p.sales*2 + 35000; r.saCash = r.sa - 5000;
    r.avail = 20000 + r.coll;
    r.out = r.disb + r.dl + r.mohCash + r.saCash + p.machine;
    r.exc = r.avail - r.out;
    r.borrow = r.exc &gt;= p.minCash ? 0 : Math.ceil((p.minCash - r.exc)/0.99/1000 - 1e-9)*1000;
    r.int = r.borrow*0.01; r.end = r.exc + r.borrow - r.int;
    return r;
  }

  /* linguette */
  $$(&quot;.tabs&quot;).forEach(t=&gt;{
    const btns = $$(&quot;button&quot;,t);
    btns.forEach(b=&gt;b.addEventListener(&quot;click&quot;,()=&gt;{
      btns.forEach(x=&gt;{x.setAttribute(&quot;aria-selected&quot;,&quot;false&quot;);document.getElementById(x.dataset.t).hidden=true});
      b.setAttribute(&quot;aria-selected&quot;,&quot;true&quot;);document.getElementById(b.dataset.t).hidden=false;
    }));
  });

  /* passi da scorrere */
  $$(&quot;.steps&quot;).forEach(box=&gt;{
    const steps = $$(&quot;.step&quot;,box), dots = $(&quot;.dots&quot;,box), prev=$(&quot;.prev&quot;,box), next=$(&quot;.next&quot;,box), lab=$(&quot;.steplab&quot;,box);
    const table = box.dataset.table ? document.getElementById(box.dataset.table) : null;
    let i=0;
    dots.innerHTML = steps.map(()=&gt;&quot;&lt;i&gt;&lt;/i&gt;&quot;).join(&quot;&quot;);
    function show(){
      steps.forEach((s,k)=&gt;s.classList.toggle(&quot;on&quot;,k===i));
      $$(&quot;i&quot;,dots).forEach((d,k)=&gt;d.classList.toggle(&quot;on&quot;,k&lt;=i));
      prev.disabled = i===0; next.disabled = i===steps.length-1;
      lab.textContent = &quot;Passo &quot;+(i+1)+&quot; di &quot;+steps.length;
      if(table) $$(&quot;tr[data-s]&quot;,table).forEach(tr=&gt;{const s=+tr.dataset.s;tr.classList.toggle(&quot;hl&quot;,s===i);tr.classList.toggle(&quot;dim&quot;,s&gt;i)});
    }
    prev.addEventListener(&quot;click&quot;,()=&gt;{if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,()=&gt;{if(i&lt;steps.length-1){i++;show()}});
    show();
  });

  /* slider incassi */
  const cs = $(&quot;#collSl&quot;);
  if(cs){
    const upd=()=&gt;{
      const c=cs.value/100, inM=c*300000, ar=(1-c)*300000, tot=72000+inM;
      $(&quot;#collOut&quot;).textContent = cs.value+&quot;%&quot;;
      $(&quot;#collTot&quot;).textContent = eur(tot); $(&quot;#collAR&quot;).textContent = eur(ar);
      const W=600, sc=W/372000;
      $(&quot;#cbA&quot;).setAttribute(&quot;x&quot;,30); $(&quot;#cbA&quot;).setAttribute(&quot;width&quot;,72000*sc);
      $(&quot;#cbB&quot;).setAttribute(&quot;x&quot;,30+72000*sc); $(&quot;#cbB&quot;).setAttribute(&quot;width&quot;,inM*sc);
      $(&quot;#cbC&quot;).setAttribute(&quot;x&quot;,30); $(&quot;#cbC&quot;).setAttribute(&quot;width&quot;,inM*sc);
      $(&quot;#cbD&quot;).setAttribute(&quot;x&quot;,30+inM*sc); $(&quot;#cbD&quot;).setAttribute(&quot;width&quot;,ar*sc);
      $(&quot;#cbBt&quot;).textContent = &quot;70%&quot;.replace(&quot;70&quot;,cs.value)+&quot; luglio &quot;+fmt(inM);
      $(&quot;#cbBt&quot;).setAttribute(&quot;x&quot;,30+72000*sc+6);
      $(&quot;#cbDt&quot;).textContent = &quot;→ agosto &quot;+fmt(ar);
      $(&quot;#cbDt&quot;).setAttribute(&quot;x&quot;,Math.min(30+inM*sc+6,560));
    };
    cs.addEventListener(&quot;input&quot;,upd); upd();
  }

  /* slider produzione */
  const ps = $(&quot;#fgSl&quot;);
  if(ps){
    const upd=()=&gt;{
      const r = model({fg:ps.value/100});
      $(&quot;#fgOut&quot;).textContent = ps.value+&quot;%&quot;;
      $(&quot;#fgEnd&quot;).textContent = fmt(r.endFG); $(&quot;#fgProd&quot;).textContent = fmt(r.prod);
      const sc = 420/16000, x0=150;
      // barra sinistra: fabbisogno = vendite + scorta finale
      $(&quot;#pbS&quot;).setAttribute(&quot;width&quot;,10000*sc);
      $(&quot;#pbE&quot;).setAttribute(&quot;x&quot;,x0+10000*sc); $(&quot;#pbE&quot;).setAttribute(&quot;width&quot;,r.endFG*sc);
      // barra destra: coperto da scorta iniziale + produzione
      $(&quot;#pbI&quot;).setAttribute(&quot;width&quot;,2000*sc);
      $(&quot;#pbP&quot;).setAttribute(&quot;x&quot;,x0+2000*sc); $(&quot;#pbP&quot;).setAttribute(&quot;width&quot;,r.prod*sc);
      $(&quot;#pbPt&quot;).textContent = &quot;Produzione &quot;+fmt(r.prod);
      $(&quot;#pbEt&quot;).textContent = &quot;Scorta finale &quot;+fmt(r.endFG);
      $(&quot;#pbEt&quot;).setAttribute(&quot;x&quot;,x0+10000*sc+4);
    };
    ps.addEventListener(&quot;input&quot;,upd); upd();
  }

  /* simulatore cash budget + grafico a cascata */
  const sim = $(&quot;#sim&quot;);
  if(sim){
    const ids = [&quot;sSales&quot;,&quot;sPrice&quot;,&quot;sColl&quot;,&quot;sMach&quot;,&quot;sMin&quot;];
    const fmtOut = {sSales:v=&gt;fmt(v)+&quot; u.&quot;, sPrice:v=&gt;&quot;€ &quot;+v, sColl:v=&gt;v+&quot;%&quot;, sMach:v=&gt;eur(v), sMin:v=&gt;eur(v)};
    function draw(){
      const v = Object.fromEntries(ids.map(id=&gt;[id,+document.getElementById(id).value]));
      ids.forEach(id=&gt;document.getElementById(id+&quot;O&quot;).textContent = fmtOut[id](v[id]));
      const r = model({sales:v.sSales, price:v.sPrice, coll:v.sColl/100, machine:v.sMach, minCash:v.sMin});
      $(&quot;#kExc&quot;).textContent = eur(r.exc); $(&quot;#kBor&quot;).textContent = eur(r.borrow);
      $(&quot;#kInt&quot;).textContent = eur(r.int); $(&quot;#kEnd&quot;).textContent = eur(r.end);
      $(&quot;#kProd&quot;).textContent = fmt(r.prod)+&quot; u.&quot;; $(&quot;#kKg&quot;).textContent = fmt(r.kg)+&quot; kg&quot;;
      const steps = [
        [&quot;Cassa iniziale&quot;,20000,&quot;base&quot;],[&quot;Incassi&quot;,r.coll,&quot;in&quot;],[&quot;Materiali&quot;,-r.disb,&quot;out&quot;],[&quot;Direct labor&quot;,-r.dl,&quot;out&quot;],
        [&quot;Overhead cash&quot;,-r.mohCash,&quot;out&quot;],[&quot;S&amp;amp;A cash&quot;,-r.saCash,&quot;out&quot;],[&quot;Macchina&quot;,-v.sMach,&quot;out&quot;],
        [&quot;Saldo prima fin.&quot;,r.exc,&quot;tot&quot;],[&quot;Prestito&quot;,r.borrow,&quot;in&quot;],[&quot;Interessi&quot;,-r.int,&quot;out&quot;],[&quot;Cassa finale&quot;,r.end,&quot;tot&quot;]
      ];
      let run=0, lo=0, hi=0; const bars=[];
      steps.forEach(([l,val,k])=&gt;{
        let a,b;
        if(k===&quot;base&quot;||k===&quot;tot&quot;){a=0;b=val;run=val}else{a=run;b=run+val;run=b}
        bars.push({l,val,k,a,b}); lo=Math.min(lo,a,b); hi=Math.max(hi,a,b);
      });
      hi=Math.max(hi,v.sMin)*1.06; lo=lo&lt;0?lo*1.15:0;
      const W=900,H=330,T=24,B=270,L=10,bw=64,gap=(W-L*2)/steps.length;
      const y = val =&gt; T + (hi-val)/(hi-lo)*(B-T);
      const col = {base:&quot;var(--muted)&quot;,in:&quot;var(--sage)&quot;,out:&quot;var(--brick)&quot;,tot:&quot;var(--accent)&quot;};
      let s = `&lt;line x1=&quot;0&quot; x2=&quot;${W}&quot; y1=&quot;${y(0)}&quot; y2=&quot;${y(0)}&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1&quot;/&gt;`;
      s += `&lt;line x1=&quot;0&quot; x2=&quot;${W}&quot; y1=&quot;${y(v.sMin)}&quot; y2=&quot;${y(v.sMin)}&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;6 5&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;${W-6}&quot; y=&quot;${y(v.sMin)-6}&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; fill=&quot;var(--accent)&quot;&gt;minimo ${eur(v.sMin)}&lt;/text&gt;`;
      bars.forEach((d,k)=&gt;{
        const x=L+k*gap+(gap-bw)/2, y1=y(Math.max(d.a,d.b)), h=Math.max(1,Math.abs(y(d.a)-y(d.b)));
        s += `&lt;rect x=&quot;${x}&quot; y=&quot;${y1}&quot; width=&quot;${bw}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; fill=&quot;${col[d.k]}&quot; opacity=&quot;${d.k===&quot;tot&quot;||d.k===&quot;base&quot;?1:.85}&quot;/&gt;`;
        if(k&lt;bars.length-1) s += `&lt;line x1=&quot;${x+bw}&quot; x2=&quot;${x+gap}&quot; y1=&quot;${y(d.b)}&quot; y2=&quot;${y(d.b)}&quot; stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;2 3&quot;/&gt;`;
        const ty = d.val&gt;=0 || d.k===&quot;tot&quot; ? y1-5 : y1+h+13;
        s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${d.k===&quot;tot&quot;&amp;&amp;d.val&lt;0?y(d.b)+14:ty}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot;&gt;${(d.val&lt;0?&quot;−&quot;:&quot;&quot;)+(Math.abs(d.val)/1000).toLocaleString(&quot;it-IT&quot;,{maximumFractionDigits:1})}k&lt;/text&gt;`;
        s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${B+22}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;${d.l.split(&quot; &quot;)[0]}&lt;/text&gt;`;
        if(d.l.split(&quot; &quot;)[1]) s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${B+36}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;${d.l.split(&quot; &quot;).slice(1).join(&quot; &quot;)}&lt;/text&gt;`;
      });
      $(&quot;#wf&quot;).innerHTML = s;
      $(&quot;#simMsg&quot;).textContent = r.borrow===0
        ? &quot;Nessun prestito: il saldo prima del finanziamento copre già il minimo.&quot;
        : `Servono ${eur(r.borrow)} (multiplo di 1.000 che soddisfa B × 0,99 ≥ ${fmt(v.sMin)} − (${fmt(r.exc)})).`;
    }
    ids.forEach(id=&gt;document.getElementById(id).addEventListener(&quot;input&quot;,draw));
    $(&quot;#simReset&quot;).addEventListener(&quot;click&quot;,()=&gt;{
      [[&quot;sSales&quot;,10000],[&quot;sPrice&quot;,30],[&quot;sColl&quot;,70],[&quot;sMach&quot;,75000],[&quot;sMin&quot;,30000]].forEach(([id,v])=&gt;document.getElementById(id).value=v);draw();
    });
    draw();
  }

  /* calcolatore prestito: confronto 51.000 vs 52.000 */
  const bs = $(&quot;#borSl&quot;);
  if(bs){
    const upd=()=&gt;{
      const B=+bs.value, i=B*0.01, end=-18800+B-i;
      $(&quot;#borOut&quot;).textContent = eur(B);
      $(&quot;#borInt&quot;).textContent = eur(i);
      $(&quot;#borEnd&quot;).textContent = eur(end);
      const ok = end&gt;=30000;
      $(&quot;#borOk&quot;).textContent = ok ? &quot;✓ minimo rispettato&quot; : &quot;✗ sotto il minimo di € 30.000&quot;;
      $(&quot;#borOk&quot;).style.color = ok ? &quot;var(--sage)&quot; : &quot;var(--brick)&quot;;
    };
    bs.addEventListener(&quot;input&quot;,upd); upd();
  }
})();
&lt;/script&gt;
&lt;/body&gt;
