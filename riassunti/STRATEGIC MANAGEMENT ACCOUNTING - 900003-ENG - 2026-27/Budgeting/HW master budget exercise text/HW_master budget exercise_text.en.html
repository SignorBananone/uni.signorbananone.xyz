        &lt;a href=&quot;#s-beyond&quot;&gt;&lt;rect x=&quot;245&quot; y=&quot;402&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;426&quot; font-weight=&quot;600&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;445&quot; font-size=&quot;11.5&quot;&gt;beyond the exercise&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s-beyond&quot;&gt;&lt;rect x=&quot;465&quot; y=&quot;402&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;426&quot; font-weight=&quot;600&quot;&gt;Balance sheet&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;445&quot; font-size=&quot;11.5&quot;&gt;end-of-July balances&lt;/text&gt;&lt;/a&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;note&quot;&gt;The arrows show where the figure feeding each subsequent budget comes from. Green = revenue and collections, ochre = production and materials, slate = conversion and fixed costs, brick = cash and financing; dashed boxes are extensions not required by the exercise.&lt;/p&gt;
  &lt;/div&gt;

&lt;nav class=&quot;toc&quot; aria-label=&quot;Table of contents&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;a href=&quot;#s-intro&quot;&gt;0 · The master budget&lt;/a&gt;&lt;a href=&quot;#s-sales&quot;&gt;1–2 · Sales and collections&lt;/a&gt;&lt;a href=&quot;#s-prod&quot;&gt;3 · Production&lt;/a&gt;&lt;a href=&quot;#s-mat&quot;&gt;4–5 · Materials&lt;/a&gt;&lt;a href=&quot;#s-costs&quot;&gt;6–8 · Labor, overhead, S&amp;amp;A&lt;/a&gt;&lt;a href=&quot;#s-cash&quot;&gt;9 · Cash budget&lt;/a&gt;&lt;a href=&quot;#s-beyond&quot;&gt;Beyond&lt;/a&gt;&lt;a href=&quot;#s-refs&quot;&gt;Further reading&lt;/a&gt;
&lt;/div&gt;&lt;/nav&gt;

&lt;main&gt;
&lt;section class=&quot;part&quot; id=&quot;s-intro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 0 · The big picture&lt;/div&gt;
  &lt;h2&gt;What a master budget is&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;master budget&lt;/span&gt; is the coordinated set of all of a company&#x27;s budgets for a period (here: the month of July). It is not a single schedule but a &lt;b&gt;chain of schedules&lt;/b&gt; in which the output of one becomes the input of the next. The exercise asks you to build its operating part and the cash budget; the theory below explains the logic the text takes for granted.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Operating budgets &lt;span class=&quot;pill&quot;&gt;accrual view&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;They describe the business activity: how much to sell (&lt;span class=&quot;en&quot;&gt;sales budget&lt;/span&gt;), how much to produce (&lt;span class=&quot;en&quot;&gt;production budget&lt;/span&gt;), how much material to buy (&lt;span class=&quot;en&quot;&gt;direct materials budget&lt;/span&gt;), how much labor and which overhead costs (&lt;span class=&quot;en&quot;&gt;direct labor&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;manufacturing overhead&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;selling and administrative expenses&lt;/span&gt;). They follow the accrual basis: the cost belongs to the month even if it has not yet been paid.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Financial budgets &lt;span class=&quot;pill&quot;&gt;cash and position&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;They translate the activity into cash and financial position: the &lt;span class=&quot;en&quot;&gt;cash budget&lt;/span&gt;, the &lt;span class=&quot;en&quot;&gt;capital expenditure budget&lt;/span&gt; (investment in equipment), the &lt;span class=&quot;en&quot;&gt;budgeted income statement&lt;/span&gt; and the &lt;span class=&quot;en&quot;&gt;budgeted balance sheet&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tint&quot;&gt;
    &lt;b&gt;The key principle of the exercise: accrual ≠ cash.&lt;/b&gt; Every cost must be looked at twice. A July sale is July revenue, but part of it is collected in August. &lt;span class=&quot;en&quot;&gt;Depreciation&lt;/span&gt; is a cost, but not a single euro leaves the business. The machine bought in July causes a € 75,000 cash outflow, but it is not a July expense. The cash budget records only movements of cash.
  &lt;/div&gt;

  &lt;h3&gt;Why companies prepare budgets&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Planning&lt;/summary&gt;&lt;div&gt;It forces managers to think ahead and to express goals in numbers: how many units, how much cash, how much financing.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Coordination&lt;/summary&gt;&lt;div&gt;Sales, production, purchasing and treasury work from the same numbers: if August sales increase, July production and purchases adjust accordingly (you will see this in the ending inventories).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Anticipating liquidity problems&lt;/summary&gt;&lt;div&gt;This is exactly the SmartBottle case: the company is profitable, yet without a loan it would end July with a negative cash balance. The cash budget flags this a month in advance, so the loan can be negotiated in time.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Control&lt;/summary&gt;&lt;div&gt;After the period, actual results are compared with budgeted figures and the &lt;span class=&quot;en&quot;&gt;variances&lt;/span&gt; are analysed, a topic that usually follows the master budget in managerial accounting textbooks.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The case data &lt;span class=&quot;slide&quot;&gt;from the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;SmartBottle Company manufactures reusable smart water bottles and is preparing its master budget for &lt;b&gt;July&lt;/b&gt;. Open the tabs for the grouped data.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button data-t=&quot;d1&quot; aria-selected=&quot;true&quot;&gt;Sales&lt;/button&gt;&lt;button data-t=&quot;d2&quot; aria-selected=&quot;false&quot;&gt;Inventories&lt;/button&gt;&lt;button data-t=&quot;d3&quot; aria-selected=&quot;false&quot;&gt;Manufacturing costs&lt;/button&gt;&lt;button data-t=&quot;d4&quot; aria-selected=&quot;false&quot;&gt;Fixed costs and cash&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d1&quot;&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Month&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Forecast sales (units)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;June&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;July&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;10,000&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;August&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;September&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Price € 30/unit. All sales are &lt;span class=&quot;en&quot;&gt;on account&lt;/span&gt; (on credit, paid later). Collection pattern: 70% in the month of sale, 30% in the following month. &lt;span class=&quot;en&quot;&gt;Accounts receivable&lt;/span&gt; at June 30: € 72,000, collected in July.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d2&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Finished goods inventory&lt;/b&gt;: at each month-end it must equal 20% of the following month&#x27;s unit sales. At June 30: 2,000 units.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Raw materials inventory&lt;/b&gt;: at each month-end, 10% of the following month&#x27;s production needs. At June 30: 3,120 kg.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d3&quot; hidden&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Direct materials&lt;/b&gt;: 3 kg per bottle at € 2/kg. Paid 60% in the month of purchase and 40% in the following month; &lt;span class=&quot;en&quot;&gt;accounts payable&lt;/span&gt; at June 30 € 22,000, paid in July.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Direct labor&lt;/b&gt;: 0.5 &lt;span class=&quot;en&quot;&gt;direct labor-hours&lt;/span&gt; per unit at € 16/hour, paid in the month incurred.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt;: variable € 4 per direct labor-hour; fixed € 40,000/month, of which € 8,000 is depreciation. The cash portion is paid in the month incurred.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;d4&quot; hidden&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Selling and administrative expenses&lt;/b&gt;: variable € 2 per unit sold; fixed € 35,000/month, of which € 5,000 is depreciation. The cash portion is paid in the month incurred.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Investment&lt;/b&gt;: new packaging machine purchased in July for € 75,000, installed in August → no depreciation in July.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Cash&lt;/b&gt;: balance at July 1 € 20,000; desired minimum ending balance € 30,000.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Financing&lt;/b&gt;: bank loan at the beginning of July, in multiples of € 1,000, interest of 1% per month paid at month-end.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · the big picture&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the sales budget always prepared first?&lt;/summary&gt;&lt;div&gt;Because everything depends on sales volume: production, purchases, labor hours, variable costs, collections. An error in the sales forecast propagates through the entire chain.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does the € 8,000 of overhead depreciation enter the cash budget?&lt;/summary&gt;&lt;div&gt;No. It is an expense (it enters the income statement) but not a cash outflow: the payment was made when the equipment was purchased, in the past.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is the € 75,000 machine a July expense?&lt;/summary&gt;&lt;div&gt;No: it is an investment (&lt;span class=&quot;en&quot;&gt;capital expenditure&lt;/span&gt;). The cash leaves in July; the cost will be allocated over the years through depreciation, starting when the machine is installed and ready for use (August).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s-sales&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 1 · Requirements 1 and 2&lt;/div&gt;
  &lt;h2&gt;Sales budget and schedule of expected cash collections&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;1 · Sales budget&lt;/h3&gt;
      &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;sales budget&lt;/span&gt; multiplies forecast units by the selling price. It is an accrual-based budget: the revenue belongs to July even if the customer pays later.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Budgeted sales &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; forecast units × unit selling price&lt;/div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;July&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Forecast units&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;× unit selling price&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 300,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;2 · Cash collections&lt;/h3&gt;
      &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;schedule of expected cash collections&lt;/span&gt; shows how much cash actually comes in. In July two items are collected: the June receivable and the portion of July sales collected immediately.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;July collections &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; beginning AR + 70% × July sales&lt;/div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts receivable, June 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;72,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;July sales: 70% × 300,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;210,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash collections&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;282,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Still to be collected in August: 30% × 300,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;90,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Consistency check.&lt;/b&gt; The € 72,000 receivable is not an arbitrary number: it is 30% of June sales (8,000 × € 30 = 240,000; 30% = 72,000). If the beginning balances in the assignment &quot;reconcile&quot; with the data, it is a good sign that you have understood the rule.&lt;/div&gt;

  &lt;h3&gt;How collections shift over time&lt;/h3&gt;
  &lt;p&gt;Move the slider: change the share collected in the month of sale and see how July collections and the receivable carried into August change.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;collSl&quot;&gt;% collected in month of sale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;collSl&quot; min=&quot;40&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;collOut&quot;&gt;70%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 660 150&quot; aria-label=&quot;Composition of cash collections&quot;&gt;
      &lt;text x=&quot;30&quot; y=&quot;20&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;July collections&lt;/text&gt;
      &lt;rect id=&quot;cbA&quot; x=&quot;30&quot; y=&quot;28&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.55&quot; rx=&quot;3&quot;/&gt;
      &lt;rect id=&quot;cbB&quot; y=&quot;28&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; rx=&quot;3&quot;/&gt;
      &lt;text x=&quot;36&quot; y=&quot;50&quot; font-size=&quot;11.5&quot; fill=&quot;var(--paper)&quot; style=&quot;fill:var(--paper)&quot;&gt;June AR 72k&lt;/text&gt;
      &lt;text id=&quot;cbBt&quot; y=&quot;50&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;92&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;July sales (€ 300,000)&lt;/text&gt;
      &lt;rect id=&quot;cbC&quot; y=&quot;100&quot; height=&quot;34&quot; fill=&quot;var(--sage)&quot; rx=&quot;3&quot;/&gt;
      &lt;rect id=&quot;cbD&quot; y=&quot;100&quot; height=&quot;34&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.7&quot; rx=&quot;3&quot;/&gt;
      &lt;text id=&quot;cbDt&quot; y=&quot;122&quot; font-size=&quot;11.5&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;July collections&lt;/span&gt;&lt;b id=&quot;collTot&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Receivable at end of July&lt;/span&gt;&lt;b id=&quot;collAR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Revenue stays at € 300,000 whatever the share: only &lt;em&gt;when&lt;/em&gt; the cash comes in changes.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · sales and collections&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;If collections were 60% in the month of sale and 40% in the following month, what would the receivable be at June 30 (same June sales)?&lt;/summary&gt;&lt;div&gt;40% × 240,000 = € 96,000. July collections: 96,000 + 60% × 300,000 = € 276,000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is accounts receivable at the end of July?&lt;/summary&gt;&lt;div&gt;30% × 300,000 = € 90,000: it goes into the budgeted balance sheet and will be collected in August.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is July revenue (300,000) different from July collections (282,000)?&lt;/summary&gt;&lt;div&gt;Because revenue follows the accrual basis (sales of the month), while collections follow the cash basis (cash received, which includes the previous month&#x27;s receivables and excludes the part of July sales paid in August).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s-prod&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 2 · Requirement 3&lt;/div&gt;
  &lt;h2&gt;Production budget&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;production budget&lt;/span&gt; states how many units to manufacture. It does not equal sales, because the desired inventory for the following month must also be left in stock, and the inventory already on hand at the beginning of the month can be used.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Production &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; sales + desired ending inventory − beginning inventory&lt;/div&gt;
  &lt;p&gt;It is an inventory equation: what is needed (to sell + to leave in stock) must be covered by what is on hand (beginning inventory) plus what is produced.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;July&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;units&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Budgeted sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;+ Desired ending inventory (20% × August&#x27;s 12,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;= Total needs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Beginning inventory (June 30)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Required production&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;Consistency: 2,000 at June 30 = 20% × 10,000 July sales. The inventory policy was already being met.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fgSl&quot;&gt;Ending inventory % of next month&#x27;s sales&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fgSl&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;fgOut&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 150&quot; aria-label=&quot;Inventory equation&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;40&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Required&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;56&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot; style=&quot;fill:var(--muted)&quot;&gt;sales + ending inv.&lt;/text&gt;
        &lt;rect id=&quot;pbS&quot; x=&quot;150&quot; y=&quot;22&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;156&quot; y=&quot;47&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;Sales 10,000&lt;/text&gt;
        &lt;rect id=&quot;pbE&quot; y=&quot;22&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.5&quot;/&gt;
        &lt;text id=&quot;pbEt&quot; y=&quot;78&quot; font-size=&quot;11&quot;&gt;&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;112&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Covered by&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;128&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot; style=&quot;fill:var(--muted)&quot;&gt;beg. inv. + prod.&lt;/text&gt;
        &lt;rect id=&quot;pbI&quot; x=&quot;150&quot; y=&quot;94&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot; opacity=&quot;.5&quot;/&gt;
        &lt;rect id=&quot;pbP&quot; y=&quot;94&quot; height=&quot;40&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;152&quot; y=&quot;148&quot; font-size=&quot;11&quot;&gt;↑ beginning 2,000&lt;/text&gt;
        &lt;text id=&quot;pbPt&quot; x=&quot;230&quot; y=&quot;119&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Ending inventory&lt;/span&gt;&lt;b id=&quot;fgEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;July production&lt;/span&gt;&lt;b id=&quot;fgProd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;The two bars always have the same length: that is the inventory equation.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Why hold a finished goods inventory?&lt;/summary&gt;&lt;div&gt;To avoid losing sales if demand arrives before production does or if production runs into problems. Tying it as a percentage to next month&#x27;s sales is a simple rule: the more sales expected, the more inventory. The downside: inventory is costly (tied-up capital, storage space, obsolescence), so the percentage is a trade-off.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Is August production needed too? Yes, for requirement 4&lt;/summary&gt;&lt;div&gt;The raw materials inventory at the end of July depends on &lt;b&gt;August&lt;/b&gt; production. Compute it with the same formula: 12,000 sales + 20% × 9,000 (September) = 1,800 − 2,400 August beginning inventory (= July ending inventory) = &lt;b&gt;11,400 units&lt;/b&gt;. That is why the exercise also gives September sales.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · production&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;If August sales were 15,000, how many units would be produced in July?&lt;/summary&gt;&lt;div&gt;10,000 + 20% × 15,000 (3,000) − 2,000 = 11,000 units.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is August&#x27;s beginning inventory?&lt;/summary&gt;&lt;div&gt;July&#x27;s ending inventory: 2,400 units. The ending inventory of one month is always the beginning inventory of the next.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;When is production lower than sales?&lt;/summary&gt;&lt;div&gt;When beginning inventory exceeds the desired ending inventory, i.e. when a drop in sales is expected and the warehouse is &quot;drawn down&quot;. For July this would happen if August sales were below 10,000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;s-mat&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 3 · Requirements 4 and 5&lt;/div&gt;
  &lt;h2&gt;Direct materials budget and payments to suppliers&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;direct materials budget&lt;/span&gt; applies the same inventory logic to raw materials, but in &lt;b&gt;kilograms&lt;/b&gt; and with the inventory tied to the following month&#x27;s &lt;b&gt;production&lt;/b&gt; (not sales).&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Purchases (kg) &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; production needs + desired ending inventory − beginning inventory&lt;/div&gt;

  &lt;div class=&quot;steps card&quot; data-table=&quot;tMat&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;steplab note&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;July production needs.&lt;/b&gt; Each bottle uses 3 kg: 10,400 units × 3 = &lt;b&gt;31,200 kg&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Desired ending inventory.&lt;/b&gt; 10% of August needs. August production 11,400 units × 3 kg = 34,200 kg → 10% = &lt;b&gt;3,420 kg&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Beginning inventory.&lt;/b&gt; 3,120 kg (which is exactly 10% of 31,200: consistent). Total needs 31,200 + 3,420 = 34,620 kg, less 3,120 = &lt;b&gt;31,500 kg to be purchased&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Cost of purchases.&lt;/b&gt; 31,500 kg × € 2 = &lt;b&gt;€ 63,000&lt;/b&gt;. This is the cost of purchases, not yet the payment.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;July payments (requirement 5).&lt;/b&gt; The June payable of € 22,000 is paid, plus 60% of July purchases (37,800) = &lt;b&gt;€ 59,800&lt;/b&gt;. The remaining 40%, € 25,200, becomes accounts payable at the end of July.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tMat&quot;&gt;&lt;tr&gt;&lt;th&gt;4 · Direct materials budget&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;Production (units)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;× kg per unit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;= Production needs (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;+ Desired ending inventory (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,420&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;= Total needs (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;34,620&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;− Beginning inventory (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;2&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Materials to be purchased (kg)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;3&quot;&gt;&lt;td&gt;× cost per kg&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 2&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-s=&quot;3&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Cost of purchases&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 63,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;5 · Cash disbursements for materials&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Accounts payable, June 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;July purchases: 60% × 63,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;59,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Payable at end of July: 40% × 63,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25,200&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;en&quot;&gt;Cash disbursements&lt;/span&gt; = cash outflows, i.e. actual payments.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The two &quot;inventory chains&quot; compared&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 880 200&quot; aria-label=&quot;Comparison between production budget and materials budget&quot;&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;160&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;48&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Production budget (units)&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;80&quot;&gt;sales for the month&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;104&quot;&gt;+ ending inventory = 20% of next month&#x27;s sales&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;128&quot;&gt;− beginning inventory&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;158&quot; font-weight=&quot;700&quot;&gt;= units to produce&lt;/text&gt;
      &lt;rect x=&quot;450&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;160&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;text x=&quot;470&quot; y=&quot;48&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Direct materials budget (kg)&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;80&quot;&gt;production for the month × 3 kg&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;104&quot;&gt;+ ending inventory = 10% of next month&#x27;s needs&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;128&quot;&gt;− beginning inventory&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;158&quot; font-weight=&quot;700&quot;&gt;= kg to purchase × € 2&lt;/text&gt;
    &lt;/g&gt;
    &lt;path d=&quot;M330,158 C390,158 400,80 462,80&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;note&quot;&gt;The output of the first (units to produce) is the input of the second: this is the &quot;cascading link&quot; of the master budget.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · materials&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Common mistake: computing the raw materials ending inventory as 10% of July needs. What would you get?&lt;/summary&gt;&lt;div&gt;3,120 kg instead of 3,420: purchases of 31,200 kg (€ 62,400) and payments of 22,000 + 37,440 = € 59,440. Wrong: the rule looks at the &lt;b&gt;following&lt;/b&gt; month.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the cost of materials used (31,200 × 2 = 62,400) different from the cost of purchases (63,000)?&lt;/summary&gt;&lt;div&gt;Because in July the raw materials inventory rises by 300 kg (from 3,120 to 3,420): more is bought than is consumed. 300 kg × € 2 = € 600 difference.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How much will be paid in August for July purchases?&lt;/summary&gt;&lt;div&gt;40%: € 25,200.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-costs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 4 · Requirements 6, 7 and 8&lt;/div&gt;
  &lt;h2&gt;Direct labor, manufacturing overhead, selling &amp;amp; administrative&lt;/h2&gt;
  &lt;p&gt;Three cost budgets with the same structure: a &lt;b&gt;variable&lt;/b&gt; part (which rises with a &lt;span class=&quot;en&quot;&gt;cost driver&lt;/span&gt;, i.e. the activity measure that &quot;drives&quot; the cost: hours or units) and a &lt;b&gt;fixed&lt;/b&gt; part (the same every month). For overhead and S&amp;amp;A the exercise asks you to distinguish the &lt;b&gt;total&lt;/b&gt; (accrual basis) from the &lt;b&gt;cash&lt;/b&gt; portion: depreciation is deducted.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Total cost &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; variable rate × driver + fixed costs &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Cash &lt;span class=&quot;eq&quot;&gt;=&lt;/span&gt; total − depreciation&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button data-t=&quot;c1&quot; aria-selected=&quot;true&quot;&gt;6 · Direct labor&lt;/button&gt;&lt;button data-t=&quot;c2&quot; aria-selected=&quot;false&quot;&gt;7 · Mfg overhead&lt;/button&gt;&lt;button data-t=&quot;c3&quot; aria-selected=&quot;false&quot;&gt;8 · Selling &amp;amp; admin&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;
    &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;direct labor budget&lt;/span&gt; starts from units &lt;b&gt;produced&lt;/b&gt; (not sold!): labor hours are spent on manufacturing.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct labor&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Units to be produced&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× direct labor-hours per unit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Direct labor-hours&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× hourly wage rate&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 16&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Direct labor cost (all paid in the month)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;€ 83,200&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;note&quot;&gt;The 5,200 hours are also needed for requirement 7: they are the driver of variable overhead.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;en&quot;&gt;Manufacturing overhead&lt;/span&gt; comprises the production costs that cannot be traced directly to an individual bottle: energy, maintenance, supervision, depreciation of plant and equipment.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Manufacturing overhead&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Variable: 5,200 DLH × € 4&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fixed&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total manufacturing overhead&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Depreciation (non-cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cash disbursements for overhead&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52,800&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;en&quot;&gt;Selling and administrative expenses&lt;/span&gt; are not manufacturing costs: their variable driver is units &lt;b&gt;sold&lt;/b&gt;.&lt;/p&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Selling &amp;amp; administrative&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Variable: 10,000 units sold × € 2&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fixed&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total S&amp;amp;A expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;55,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Depreciation (non-cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cash disbursements for S&amp;amp;A&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Total versus cash at a glance&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 820 230&quot; aria-label=&quot;Comparison of total costs and cash outflows&quot;&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;line x1=&quot;200&quot; y1=&quot;10&quot; x2=&quot;200&quot; y2=&quot;200&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;Direct labor&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;28&quot; width=&quot;499&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;706&quot; y=&quot;42&quot;&gt;83,200&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;50&quot; width=&quot;499&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;706&quot; y=&quot;64&quot;&gt;83,200 cash&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;105&quot; font-weight=&quot;600&quot;&gt;Mfg overhead&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;88&quot; width=&quot;365&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;572&quot; y=&quot;102&quot;&gt;60,800&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;110&quot; width=&quot;317&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;517&quot; y=&quot;110&quot; width=&quot;48&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;572&quot; y=&quot;124&quot;&gt;52,800 cash (− 8,000 depr.)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;165&quot; font-weight=&quot;600&quot;&gt;Selling &amp;amp; admin&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;148&quot; width=&quot;330&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;537&quot; y=&quot;162&quot;&gt;55,000&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;170&quot; width=&quot;300&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;500&quot; y=&quot;170&quot; width=&quot;30&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;537&quot; y=&quot;184&quot;&gt;50,000 cash (− 5,000 depr.)&lt;/text&gt;
      &lt;rect x=&quot;200&quot; y=&quot;210&quot; width=&quot;14&quot; height=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;219&quot;&gt;total cost (accrual basis)&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;210&quot; width=&quot;14&quot; height=&quot;10&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;219&quot;&gt;cash outflow&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;details&gt;&lt;summary&gt;Variable or fixed? Cost behavior&lt;/summary&gt;&lt;div&gt;A &lt;b&gt;variable&lt;/b&gt; cost rises in proportion to its driver (hours double → variable overhead doubles). A &lt;b&gt;fixed&lt;/b&gt; cost remains constant within a relevant range of activity (rent, salaried staff, depreciation). This distinction is also the basis of cost-volume-profit analysis and of &lt;span class=&quot;en&quot;&gt;flexible budgets&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why is depreciation &quot;non-cash&quot;?&lt;/summary&gt;&lt;div&gt;Depreciation allocates over the years the cost of an asset that has already been paid for. The cash left the business on the day of purchase (as happens in July with the new machine): counting it again every month would be double counting in the cash budget.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · costs&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does direct labor use 10,400 units and S&amp;amp;A 10,000?&lt;/summary&gt;&lt;div&gt;Direct labor is used to produce (10,400 units produced); variable selling expenses depend on how much is sold (10,000 units sold).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If production rose by 1,000 units, by how much would total overhead increase?&lt;/summary&gt;&lt;div&gt;1,000 × 0.5 hours × € 4 = € 2,000 (only the variable part; the € 40,000 of fixed overhead does not change).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the variable manufacturing cost per unit?&lt;/summary&gt;&lt;div&gt;Materials 3 kg × € 2 = 6 + labor 0.5 × 16 = 8 + variable overhead 0.5 × 4 = 2 → &lt;b&gt;€ 16&lt;/b&gt; per bottle.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-cash&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 5 · Requirement 9&lt;/div&gt;
  &lt;h2&gt;Cash budget, capital expenditure and bank loan&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;cash budget&lt;/span&gt; brings together all the receipts and payments computed so far, adds the capital expenditure and determines the financing. The classic format has four sections:&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 880 110&quot; aria-label=&quot;Structure of the cash budget&quot;&gt;
    &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;Cash available&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;beg. balance + collections&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;− Disbursements&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;all payments&lt;/text&gt;
      &lt;rect x=&quot;455&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;= Excess (deficiency)&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;surplus or shortfall&lt;/text&gt;
      &lt;rect x=&quot;680&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;775&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;± Financing&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;70&quot; font-size=&quot;11.5&quot;&gt;→ ending balance&lt;/text&gt;
    &lt;/g&gt;
    &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;195&quot; y1=&quot;55&quot; x2=&quot;228&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;55&quot; x2=&quot;453&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;645&quot; y1=&quot;55&quot; x2=&quot;678&quot; y2=&quot;55&quot;/&gt;&lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;steps card&quot; data-table=&quot;tCash&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;steplab note&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Cash available.&lt;/b&gt; Balance at July 1 € 20,000 + collections (requirement 2) € 282,000 = &lt;b&gt;€ 302,000&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Operating disbursements.&lt;/b&gt; Materials 59,800 (requirement 5) + labor 83,200 (requirement 6) + cash overhead 52,800 (requirement 7) + cash S&amp;amp;A 50,000 (requirement 8). Note: use the &lt;em&gt;cash&lt;/em&gt; figures, excluding depreciation.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Capital expenditure.&lt;/b&gt; Add the machine, € 75,000: a July cash outflow even though it is not a July expense. Total disbursements &lt;b&gt;€ 320,800&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Balance before financing.&lt;/b&gt; 302,000 − 320,800 = &lt;b&gt;− € 18,800&lt;/b&gt;. The required minimum is + 30,000: at least 48,800 is missing.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;How much to borrow.&lt;/b&gt; Loan B is received at the beginning of July and the 1% interest is paid at the end of July, so it reduces the balance: −18,800 + B − 0.01·B ≥ 30,000 → 0.99·B ≥ 48,800 → B ≥ 49,293. First multiple of 1,000: &lt;b&gt;B = € 50,000&lt;/b&gt;, interest € 500.&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Ending balance.&lt;/b&gt; −18,800 + 50,000 − 500 = &lt;b&gt;€ 30,700&lt;/b&gt; ≥ 30,000 ✓. With 49,000 you would get −18,800 + 49,000 − 490 = 29,710: insufficient.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tCash&quot;&gt;&lt;tr&gt;&lt;th&gt;9 · Cash budget — July&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;Cash balance, beginning&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot;&gt;&lt;td&gt;+ Cash collections&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;282,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;0&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Total cash available&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;302,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Direct materials&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;59,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Direct labor&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;83,200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Manufacturing overhead (cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;1&quot;&gt;&lt;td&gt;− Selling &amp;amp; administrative (cash)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;2&quot;&gt;&lt;td&gt;− Equipment purchase (packaging machine)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;2&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Total disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;320,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;3&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Excess (deficiency) of cash available over disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(18,800)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;+ Borrowing (beginning of July)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;− Interest (1% × 50,000, end of July)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;4&quot;&gt;&lt;td&gt;Total financing&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;49,500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr data-s=&quot;5&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Cash balance, ending&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30,700&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;The multiples trap.&lt;/b&gt; Covering the shortfall up to the minimum (48,800 → 49,000) is not enough: the interest paid at month-end erodes the balance. Try it below.&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;borSl&quot;&gt;Loan&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;borSl&quot; min=&quot;45000&quot; max=&quot;55000&quot; step=&quot;1000&quot; value=&quot;49000&quot;&gt;&lt;output id=&quot;borOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Interest 1%&lt;/span&gt;&lt;b id=&quot;borInt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Ending balance&lt;/span&gt;&lt;b id=&quot;borEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Outcome&lt;/span&gt;&lt;b id=&quot;borOk&quot; style=&quot;font-size:1.05rem&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;sim-h&quot;&gt;What-if simulator: the whole chain in one chart&lt;/h3&gt;
  &lt;p&gt;Change the assumptions: the model recomputes production, purchases, costs, cash and the loan using the rules of the case (inventories, collection and payment percentages, multiples of € 1,000, 1% interest). The &lt;span class=&quot;en&quot;&gt;waterfall chart&lt;/span&gt; shows how the beginning balance leads to the ending balance.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;sim&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sSales&quot;&gt;July sales&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sSales&quot; min=&quot;7000&quot; max=&quot;14000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;sSalesO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sPrice&quot;&gt;Unit selling price&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sPrice&quot; min=&quot;24&quot; max=&quot;36&quot; step=&quot;1&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;sPriceO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sColl&quot;&gt;% collected in month of sale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sColl&quot; min=&quot;40&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;sCollO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sMach&quot;&gt;Machine cost&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sMach&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;5000&quot; value=&quot;75000&quot;&gt;&lt;output id=&quot;sMachO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;sMin&quot;&gt;Minimum balance&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sMin&quot; min=&quot;0&quot; max=&quot;60000&quot; step=&quot;5000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;sMinO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;button class=&quot;btn&quot; id=&quot;simReset&quot; style=&quot;margin:6px 0&quot;&gt;Restore the case data&lt;/button&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Production&lt;/span&gt;&lt;b id=&quot;kProd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Purchases&lt;/span&gt;&lt;b id=&quot;kKg&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Balance before fin.&lt;/span&gt;&lt;b id=&quot;kExc&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Loan&lt;/span&gt;&lt;b id=&quot;kBor&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Interest&lt;/span&gt;&lt;b id=&quot;kInt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Ending cash&lt;/span&gt;&lt;b id=&quot;kEnd&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 900 315&quot; id=&quot;wf&quot; aria-label=&quot;Waterfall chart of July cash&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot; id=&quot;simMsg&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · cash&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the balance negative even though the company is profitable (see the next part)?&lt;/summary&gt;&lt;div&gt;Because of three cash effects: the purchase of the machine (€ 75,000), the July receivable not yet collected (€ 90,000 versus the 72,000 collected from June) and the build-up of inventories. Profit and liquidity are different things.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If interest were paid only on repayment (not at the end of July), how much would need to be borrowed?&lt;/summary&gt;&lt;div&gt;Covering 48,800 → € 49,000 would suffice, and the ending balance would be 30,200. The accrued interest (490) would still be recognised in the income statement as an expense of the period.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Without the machine purchase, would a loan be needed?&lt;/summary&gt;&lt;div&gt;No: the balance before financing would be −18,800 + 75,000 = € 56,200, above the minimum of 30,000. Check it with the simulator by setting the machine cost to 0.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s-beyond&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 6 · Beyond the exercise&lt;/div&gt;
  &lt;h2&gt;Completing the master budget: income statement and end-of-July balances&lt;/h2&gt;
  &lt;p&gt;The exercise stops at the cash budget, but the complete master budget continues with the &lt;span class=&quot;en&quot;&gt;budgeted income statement&lt;/span&gt; and the &lt;span class=&quot;en&quot;&gt;budgeted balance sheet&lt;/span&gt;. They are included here as a &lt;b&gt;teaching extension&lt;/b&gt;, derived solely from the exercise data: they show the difference between profit and cash. They are not part of the assignment.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;July income statement · contribution format&lt;/h4&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Variable cost of goods sold (10,000 × € 16)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;160,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Variable S&amp;amp;A (10,000 × € 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Contribution margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Fixed manufacturing overhead (incl. depreciation)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Fixed S&amp;amp;A (incl. depreciation)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;45,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;− Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income (before taxes)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44,500&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;The &lt;span class=&quot;en&quot;&gt;contribution margin&lt;/span&gt; is what remains of revenue after variable costs, available to cover fixed costs. Under &lt;span class=&quot;en&quot;&gt;absorption costing&lt;/span&gt; (full costing, used in external financial reporting) part of the fixed manufacturing costs would remain in the 400 additional units of inventory and profit would be slightly higher: computing it would require a predetermined fixed overhead rate, which the exercise does not provide.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Balance sheet items at July 31 arising from the exercise&lt;/h4&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30,700&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts receivable (30% × 300,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;90,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Raw materials (3,420 kg × € 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,840&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Finished goods (2,400 u. × € 16 at variable cost)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;38,400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;New machine (not yet depreciated)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Accounts payable (40% × 63,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25,200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;This is only the part of the balance sheet that can be derived from the data: the beginning balances of plant and equipment, equity, etc. are missing.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A € 44,500 profit, yet a € 50,000 loan is needed: the reconciliation&lt;/h3&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;From net income to the change in cash&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44,500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Depreciation (8,000 + 5,000), non-cash expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Increase in receivables (90,000 − 72,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(18,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Increase in raw materials inventory (300 kg × 2)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Increase in finished goods inventory (400 u. × 16)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(6,400)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Increase in accounts payable (25,200 − 22,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Purchase of machine&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Loan proceeds&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Change in cash (from 20,000 to 30,700)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,700&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;This is the logic of the statement of cash flows under the indirect method. It reconciles to the cent with the cash budget: an excellent check for the assignment.&lt;/p&gt;

  &lt;h3&gt;Common mistakes to avoid&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Using sales instead of production&lt;/summary&gt;&lt;div&gt;Materials, direct labor and variable overhead depend on units &lt;b&gt;produced&lt;/b&gt; (10,400); only variable S&amp;amp;A and revenue depend on units &lt;b&gt;sold&lt;/b&gt; (10,000).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Forgetting August production&lt;/summary&gt;&lt;div&gt;The raw materials ending inventory is based on August needs (11,400 × 3 kg), which must be computed using September sales.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Leaving depreciation in the cash budget&lt;/summary&gt;&lt;div&gt;Overhead and S&amp;amp;A enter the cash budget at 52,800 and 50,000, not at 60,800 and 55,000.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Forgetting the beginning balances of receivables and payables&lt;/summary&gt;&lt;div&gt;The € 72,000 of receivables and the € 22,000 of payables are collected and paid in July: they belong in the schedules for requirements 2 and 5.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Rounding the loan without accounting for interest&lt;/summary&gt;&lt;div&gt;49,000 seems sufficient, but after interest the balance is 29,710. The correct answer is 50,000.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · the overall view&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;List the nine schedules in order and, for each one, the figure passed on to the next.&lt;/summary&gt;&lt;div&gt;① sales (units, €) → ② collections (€ to the cash budget) · ③ production (units) → ④ materials (kg, € purchases) → ⑤ payments (€) · ③ → ⑥ labor (hours, €) → ⑦ overhead (hours as driver; cash €) · ① → ⑧ S&amp;amp;A (cash €) · ②⑤⑥⑦⑧ + machine → ⑨ cash budget → loan.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which piece of case data is not needed for the nine requirements but would be needed for the income statement?&lt;/summary&gt;&lt;div&gt;The information that the machine generates no depreciation in July: it does not affect cash, but it tells you that the July income statement contains no additional depreciation.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-slate refs&quot; id=&quot;s-refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;Part 7&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The exercise text &lt;b&gt;does not cite&lt;/b&gt; any authors, textbooks, standards or websites. The items below are therefore &lt;b&gt;all external sources&lt;/b&gt;, chosen because they cover exactly the topics of the case; they may not match the textbooks adopted by the course: check the syllabus.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;The leading international managerial accounting textbook. The &lt;em&gt;Master Budgeting&lt;/em&gt; chapter (&lt;em&gt;Profit Planning&lt;/em&gt; in some editions; the chapter number varies from edition to edition) follows the same sequence as the exercise: sales budget, cash collections, production, direct materials, direct labor, overhead, S&amp;amp;A, cash budget with minimum balance and borrowing in multiples, then the budgeted income statement and balance sheet. The following chapter covers &lt;span class=&quot;en&quot;&gt;flexible budgets&lt;/span&gt; and variance analysis. It matters because the structure and English terminology of the SmartBottle case are those of this textbook.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of one edition on the McGraw Hill Higher Education site&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;OpenStax — &lt;em&gt;Principles of Managerial Accounting&lt;/em&gt;, ch. 7 &quot;Budgeting&quot;&lt;/h4&gt;
    &lt;p&gt;A free, open textbook (listed in some catalogues as &lt;em&gt;Principles of Accounting, Volume 2&lt;/em&gt;). Chapter 7 explains how to prepare the operating budgets (production, materials, labor, overhead, S&amp;amp;A), the schedules of collections and payments, the cash budget (which combines collections, payments and the capital expenditure budget) and the budgeted balance sheet, with a glossary and exercises. It matters because it is freely accessible and has review questions on the same steps.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/chapter-7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org — Chapter 7&lt;/a&gt; · &lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/7-key-terms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Key terms&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;IAS 16 &lt;em&gt;Property, Plant and Equipment&lt;/em&gt; (IFRS Foundation)&lt;/h4&gt;
    &lt;p&gt;The international accounting standard on property, plant and equipment: recognition, measurement, depreciation. It requires depreciation to begin when the asset is available for use, i.e. when it is in the location and condition necessary for it to be capable of operating in the manner intended by management (para. 55). This is why the machine bought in July but installed in August generates no depreciation in July. It matters because it links a sentence in the exercise to an actual financial reporting rule.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 16&lt;/a&gt; · &lt;a href=&quot;https://ifrscommunity.com/?p=2931&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Community commentary on depreciation (IAS 16 and IAS 38)&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  const fmt = n =&gt; (n&lt;0?&quot;− &quot;:&quot;&quot;) + Math.round(Math.abs(n)).toLocaleString(&quot;en-US&quot;);
  const eur = n =&gt; (n&lt;0?&quot;− € &quot;:&quot;€ &quot;) + Math.round(Math.abs(n)).toLocaleString(&quot;en-US&quot;);
  const $ = (s,r=document) =&gt; r.querySelector(s);
  const $$ = (s,r=document) =&gt; Array.from(r.querySelectorAll(s));

  /* full model of the SmartBottle case (July) */
  function model(o){
    const p = Object.assign({sales:10000, price:30, coll:0.7, fg:0.2, machine:75000, minCash:30000}, o||{});
    const r = {p};
    r.rev = p.sales*p.price;
    r.coll = 72000 + p.coll*r.rev;
    r.endFG = p.fg*12000; r.prod = p.sales + r.endFG - 2000;
    r.augProd = 12000 + p.fg*9000 - r.endFG;
    r.need = r.prod*3; r.endRM = 0.10*r.augProd*3; r.kg = r.need + r.endRM - 3120; r.purch = r.kg*2;
    r.disb = 22000 + 0.6*r.purch;
    r.dlh = r.prod*0.5; r.dl = r.dlh*16;
    r.moh = r.dlh*4 + 40000; r.mohCash = r.moh - 8000;
    r.sa = p.sales*2 + 35000; r.saCash = r.sa - 5000;
    r.avail = 20000 + r.coll;
    r.out = r.disb + r.dl + r.mohCash + r.saCash + p.machine;
    r.exc = r.avail - r.out;
    r.borrow = r.exc &gt;= p.minCash ? 0 : Math.ceil((p.minCash - r.exc)/0.99/1000 - 1e-9)*1000;
    r.int = r.borrow*0.01; r.end = r.exc + r.borrow - r.int;
    return r;
  }

  /* tabs */
  $$(&quot;.tabs&quot;).forEach(t=&gt;{
    const btns = $$(&quot;button&quot;,t);
    btns.forEach(b=&gt;b.addEventListener(&quot;click&quot;,()=&gt;{
      btns.forEach(x=&gt;{x.setAttribute(&quot;aria-selected&quot;,&quot;false&quot;);document.getElementById(x.dataset.t).hidden=true});
      b.setAttribute(&quot;aria-selected&quot;,&quot;true&quot;);document.getElementById(b.dataset.t).hidden=false;
    }));
  });

  /* step-through walkthroughs */
  $$(&quot;.steps&quot;).forEach(box=&gt;{
    const steps = $$(&quot;.step&quot;,box), dots = $(&quot;.dots&quot;,box), prev=$(&quot;.prev&quot;,box), next=$(&quot;.next&quot;,box), lab=$(&quot;.steplab&quot;,box);
    const table = box.dataset.table ? document.getElementById(box.dataset.table) : null;
    let i=0;
    dots.innerHTML = steps.map(()=&gt;&quot;&lt;i&gt;&lt;/i&gt;&quot;).join(&quot;&quot;);
    function show(){
      steps.forEach((s,k)=&gt;s.classList.toggle(&quot;on&quot;,k===i));
      $$(&quot;i&quot;,dots).forEach((d,k)=&gt;d.classList.toggle(&quot;on&quot;,k&lt;=i));
      prev.disabled = i===0; next.disabled = i===steps.length-1;
      lab.textContent = &quot;Step &quot;+(i+1)+&quot; of &quot;+steps.length;
      if(table) $$(&quot;tr[data-s]&quot;,table).forEach(tr=&gt;{const s=+tr.dataset.s;tr.classList.toggle(&quot;hl&quot;,s===i);tr.classList.toggle(&quot;dim&quot;,s&gt;i)});
    }
    prev.addEventListener(&quot;click&quot;,()=&gt;{if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,()=&gt;{if(i&lt;steps.length-1){i++;show()}});
    show();
  });

  /* collections slider */
  const cs = $(&quot;#collSl&quot;);
  if(cs){
    const upd=()=&gt;{
      const c=cs.value/100, inM=c*300000, ar=(1-c)*300000, tot=72000+inM;
      $(&quot;#collOut&quot;).textContent = cs.value+&quot;%&quot;;
      $(&quot;#collTot&quot;).textContent = eur(tot); $(&quot;#collAR&quot;).textContent = eur(ar);
      const W=600, sc=W/372000;
      $(&quot;#cbA&quot;).setAttribute(&quot;x&quot;,30); $(&quot;#cbA&quot;).setAttribute(&quot;width&quot;,72000*sc);
      $(&quot;#cbB&quot;).setAttribute(&quot;x&quot;,30+72000*sc); $(&quot;#cbB&quot;).setAttribute(&quot;width&quot;,inM*sc);
      $(&quot;#cbC&quot;).setAttribute(&quot;x&quot;,30); $(&quot;#cbC&quot;).setAttribute(&quot;width&quot;,inM*sc);
      $(&quot;#cbD&quot;).setAttribute(&quot;x&quot;,30+inM*sc); $(&quot;#cbD&quot;).setAttribute(&quot;width&quot;,ar*sc);
      $(&quot;#cbBt&quot;).textContent = &quot;70%&quot;.replace(&quot;70&quot;,cs.value)+&quot; July &quot;+fmt(inM);
      $(&quot;#cbBt&quot;).setAttribute(&quot;x&quot;,30+72000*sc+6);
      $(&quot;#cbDt&quot;).textContent = &quot;→ August &quot;+fmt(ar);
      $(&quot;#cbDt&quot;).setAttribute(&quot;x&quot;,Math.min(30+inM*sc+6,560));
    };
    cs.addEventListener(&quot;input&quot;,upd); upd();
  }

  /* production slider */
  const ps = $(&quot;#fgSl&quot;);
  if(ps){
    const upd=()=&gt;{
      const r = model({fg:ps.value/100});
      $(&quot;#fgOut&quot;).textContent = ps.value+&quot;%&quot;;
      $(&quot;#fgEnd&quot;).textContent = fmt(r.endFG); $(&quot;#fgProd&quot;).textContent = fmt(r.prod);
      const sc = 420/16000, x0=150;
      // left bar: needs = sales + ending inventory
      $(&quot;#pbS&quot;).setAttribute(&quot;width&quot;,10000*sc);
      $(&quot;#pbE&quot;).setAttribute(&quot;x&quot;,x0+10000*sc); $(&quot;#pbE&quot;).setAttribute(&quot;width&quot;,r.endFG*sc);
      // right bar: covered by beginning inventory + production
      $(&quot;#pbI&quot;).setAttribute(&quot;width&quot;,2000*sc);
      $(&quot;#pbP&quot;).setAttribute(&quot;x&quot;,x0+2000*sc); $(&quot;#pbP&quot;).setAttribute(&quot;width&quot;,r.prod*sc);
      $(&quot;#pbPt&quot;).textContent = &quot;Production &quot;+fmt(r.prod);
      $(&quot;#pbEt&quot;).textContent = &quot;Ending inventory &quot;+fmt(r.endFG);
      $(&quot;#pbEt&quot;).setAttribute(&quot;x&quot;,x0+10000*sc+4);
    };
    ps.addEventListener(&quot;input&quot;,upd); upd();
  }

  /* cash budget simulator + waterfall chart */
  const sim = $(&quot;#sim&quot;);
  if(sim){
    const ids = [&quot;sSales&quot;,&quot;sPrice&quot;,&quot;sColl&quot;,&quot;sMach&quot;,&quot;sMin&quot;];
    const fmtOut = {sSales:v=&gt;fmt(v)+&quot; u.&quot;, sPrice:v=&gt;&quot;€ &quot;+v, sColl:v=&gt;v+&quot;%&quot;, sMach:v=&gt;eur(v), sMin:v=&gt;eur(v)};
    function draw(){
      const v = Object.fromEntries(ids.map(id=&gt;[id,+document.getElementById(id).value]));
      ids.forEach(id=&gt;document.getElementById(id+&quot;O&quot;).textContent = fmtOut[id](v[id]));
      const r = model({sales:v.sSales, price:v.sPrice, coll:v.sColl/100, machine:v.sMach, minCash:v.sMin});
      $(&quot;#kExc&quot;).textContent = eur(r.exc); $(&quot;#kBor&quot;).textContent = eur(r.borrow);
      $(&quot;#kInt&quot;).textContent = eur(r.int); $(&quot;#kEnd&quot;).textContent = eur(r.end);
      $(&quot;#kProd&quot;).textContent = fmt(r.prod)+&quot; u.&quot;; $(&quot;#kKg&quot;).textContent = fmt(r.kg)+&quot; kg&quot;;
      const steps = [
        [&quot;Opening cash&quot;,20000,&quot;base&quot;],[&quot;Collections&quot;,r.coll,&quot;in&quot;],[&quot;Materials&quot;,-r.disb,&quot;out&quot;],[&quot;Direct labor&quot;,-r.dl,&quot;out&quot;],
        [&quot;Overhead cash&quot;,-r.mohCash,&quot;out&quot;],[&quot;S&amp;amp;A cash&quot;,-r.saCash,&quot;out&quot;],[&quot;Machine&quot;,-v.sMach,&quot;out&quot;],
        [&quot;Pre-fin. balance&quot;,r.exc,&quot;tot&quot;],[&quot;Loan&quot;,r.borrow,&quot;in&quot;],[&quot;Interest&quot;,-r.int,&quot;out&quot;],[&quot;Ending cash&quot;,r.end,&quot;tot&quot;]
      ];
      let run=0, lo=0, hi=0; const bars=[];
      steps.forEach(([l,val,k])=&gt;{
        let a,b;
        if(k===&quot;base&quot;||k===&quot;tot&quot;){a=0;b=val;run=val}else{a=run;b=run+val;run=b}
        bars.push({l,val,k,a,b}); lo=Math.min(lo,a,b); hi=Math.max(hi,a,b);
      });
      hi=Math.max(hi,v.sMin)*1.06; lo=lo&lt;0?lo*1.15:0;
      const W=900,H=330,T=24,B=270,L=10,bw=64,gap=(W-L*2)/steps.length;
      const y = val =&gt; T + (hi-val)/(hi-lo)*(B-T);
      const col = {base:&quot;var(--muted)&quot;,in:&quot;var(--sage)&quot;,out:&quot;var(--brick)&quot;,tot:&quot;var(--accent)&quot;};
      let s = `&lt;line x1=&quot;0&quot; x2=&quot;${W}&quot; y1=&quot;${y(0)}&quot; y2=&quot;${y(0)}&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1&quot;/&gt;`;
      s += `&lt;line x1=&quot;0&quot; x2=&quot;${W}&quot; y1=&quot;${y(v.sMin)}&quot; y2=&quot;${y(v.sMin)}&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;6 5&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;${W-6}&quot; y=&quot;${y(v.sMin)-6}&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; fill=&quot;var(--accent)&quot;&gt;minimum ${eur(v.sMin)}&lt;/text&gt;`;
      bars.forEach((d,k)=&gt;{
        const x=L+k*gap+(gap-bw)/2, y1=y(Math.max(d.a,d.b)), h=Math.max(1,Math.abs(y(d.a)-y(d.b)));
        s += `&lt;rect x=&quot;${x}&quot; y=&quot;${y1}&quot; width=&quot;${bw}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; fill=&quot;${col[d.k]}&quot; opacity=&quot;${d.k===&quot;tot&quot;||d.k===&quot;base&quot;?1:.85}&quot;/&gt;`;
        if(k&lt;bars.length-1) s += `&lt;line x1=&quot;${x+bw}&quot; x2=&quot;${x+gap}&quot; y1=&quot;${y(d.b)}&quot; y2=&quot;${y(d.b)}&quot; stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;2 3&quot;/&gt;`;
        const ty = d.val&gt;=0 || d.k===&quot;tot&quot; ? y1-5 : y1+h+13;
        s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${d.k===&quot;tot&quot;&amp;&amp;d.val&lt;0?y(d.b)+14:ty}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot;&gt;${(d.val&lt;0?&quot;−&quot;:&quot;&quot;)+(Math.abs(d.val)/1000).toLocaleString(&quot;en-US&quot;,{maximumFractionDigits:1})}k&lt;/text&gt;`;
        s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${B+22}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;${d.l.split(&quot; &quot;)[0]}&lt;/text&gt;`;
        if(d.l.split(&quot; &quot;)[1]) s += `&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${B+36}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;${d.l.split(&quot; &quot;).slice(1).join(&quot; &quot;)}&lt;/text&gt;`;
      });
      $(&quot;#wf&quot;).innerHTML = s;
      $(&quot;#simMsg&quot;).textContent = r.borrow===0
        ? &quot;No loan needed: the balance before financing already covers the minimum.&quot;
        : `${eur(r.borrow)} is needed (the multiple of 1,000 that satisfies B × 0.99 ≥ ${fmt(v.sMin)} − (${fmt(r.exc)})).`;
    }
    ids.forEach(id=&gt;document.getElementById(id).addEventListener(&quot;input&quot;,draw));
    $(&quot;#simReset&quot;).addEventListener(&quot;click&quot;,()=&gt;{
      [[&quot;sSales&quot;,10000],[&quot;sPrice&quot;,30],[&quot;sColl&quot;,70],[&quot;sMach&quot;,75000],[&quot;sMin&quot;,30000]].forEach(([id,v])=&gt;document.getElementById(id).value=v);draw();
    });
    draw();
  }

  /* loan calculator: 49,000 vs 50,000 comparison */
  const bs = $(&quot;#borSl&quot;);
  if(bs){
    const upd=()=&gt;{
      const B=+bs.value, i=B*0.01, end=-18800+B-i;
      $(&quot;#borOut&quot;).textContent = eur(B);
      $(&quot;#borInt&quot;).textContent = eur(i);
      $(&quot;#borEnd&quot;).textContent = eur(end);
      const ok = end&gt;=30000;
      $(&quot;#borOk&quot;).textContent = ok ? &quot;✓ minimum met&quot; : &quot;✗ below the € 30,000 minimum&quot;;
      $(&quot;#borOk&quot;).style.color = ok ? &quot;var(--sage)&quot; : &quot;var(--brick)&quot;;
    };
    bs.addEventListener(&quot;input&quot;,upd); upd();
  }
})();
&lt;/script&gt;
