&lt;div id=&quot;labBanner&quot;&gt;Stai vedendo numeri modificati dal Laboratorio: le tabelle non coincidono più con le slide. &lt;button type=&quot;button&quot; id=&quot;bannerReset&quot;&gt;Ripristina i dati delle slide&lt;/button&gt;&lt;/div&gt;

&lt;header class=&quot;hero&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;SMA 26-27 · Budgeting · Lezioni 9-10&lt;/div&gt;
  &lt;h1&gt;Master Budgeting&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;Perché un&#x27;impresa fa il budget, come lo costruisce e come le dieci schedule del &lt;i&gt;master budget&lt;/i&gt; si incastrano l&#x27;una nell&#x27;altra, dal sales budget fino al bilancio previsionale. Tutto seguendo l&#x27;esempio della Royal Company.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Fonte principale: &lt;i&gt;9-10_SMA 26-27_Master budget.pdf&lt;/i&gt; (87 slide). I numeri delle slide (es. «8-34») sono indicati come &lt;b&gt;[8-34]&lt;/b&gt;.&lt;/p&gt;
  &lt;nav class=&quot;toc&quot; aria-label=&quot;Indice&quot;&gt;
   &lt;a href=&quot;#definizione&quot;&gt;1 · Cos&#x27;è un budget&lt;/a&gt;&lt;a href=&quot;#perche&quot;&gt;2 · Perché&lt;/a&gt;&lt;a href=&quot;#come&quot;&gt;3 · Come&lt;/a&gt;&lt;a href=&quot;#master&quot;&gt;4 · Il master budget&lt;/a&gt;&lt;a href=&quot;#sales&quot;&gt;5 · Sales&lt;/a&gt;&lt;a href=&quot;#production&quot;&gt;6 · Production&lt;/a&gt;&lt;a href=&quot;#materials&quot;&gt;7 · Materials&lt;/a&gt;&lt;a href=&quot;#labor&quot;&gt;8 · Labor&lt;/a&gt;&lt;a href=&quot;#overhead&quot;&gt;9 · Overhead&lt;/a&gt;&lt;a href=&quot;#fginv&quot;&gt;10 · Finished goods&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;11 · S&amp;amp;A&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;12 · Cash budget&lt;/a&gt;&lt;a href=&quot;#statements&quot;&gt;13 · Income statement e balance sheet&lt;/a&gt;&lt;a href=&quot;#lab&quot;&gt;14 · Laboratorio&lt;/a&gt;&lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;
  &lt;/nav&gt;
  &lt;div class=&quot;map&quot;&gt;
   &lt;svg id=&quot;cmap&quot; viewBox=&quot;0 0 960 420&quot; role=&quot;img&quot; aria-label=&quot;Mappa concettuale della lezione: clicca un nodo per andare alla sezione&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Mappa concettuale: clicca un riquadro per saltare alla sezione. A sinistra il &lt;b&gt;perché&lt;/b&gt; e il &lt;b&gt;come&lt;/b&gt; del budgeting; al centro e a destra la catena delle schedule del master budget, che confluiscono nel cash budget e nei prospetti finali.&lt;/p&gt;
 &lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
&lt;!-- 1 --&gt;
&lt;section class=&quot;part&quot; id=&quot;definizione&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 1 · LEARNING OBJECTIVE 1&lt;/span&gt;
  &lt;h2&gt;Cos&#x27;è un budget e su quale periodo&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-2] – [8-4]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budget&lt;/b&gt;: un &lt;b&gt;detailed quantitative plan&lt;/b&gt; (piano dettagliato e quantitativo) per acquisire e usare risorse finanziarie e di altro tipo in un periodo futuro specificato. [8-3]&lt;/div&gt;
  &lt;p&gt;Le parole chiave sono tre. &lt;b&gt;Quantitativo&lt;/b&gt;: il budget parla in unità, ore, chili e dollari, non in intenzioni. &lt;b&gt;Dettagliato&lt;/b&gt;: scende fino al mese e alla singola voce di costo. &lt;b&gt;Futuro&lt;/b&gt;: riguarda il periodo che sta per cominciare, mentre la contabilità generale registra quello già trascorso.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Operating budget annuale&lt;/h4&gt;&lt;p&gt;Di solito copre &lt;b&gt;un anno&lt;/b&gt; e coincide con il &lt;span class=&quot;t&quot;&gt;fiscal year&lt;/span&gt; (l&#x27;esercizio contabile dell&#x27;impresa). Molte imprese lo dividono in &lt;b&gt;quattro trimestri&lt;/b&gt; e i trimestri in mesi. [8-3, 8-4]&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Continuous / perpetual budget&lt;/h4&gt;&lt;p&gt;Un &lt;span class=&quot;t&quot;&gt;continuous budget&lt;/span&gt; (o &lt;i&gt;perpetual&lt;/i&gt;, o &lt;i&gt;rolling budget&lt;/i&gt;) è un budget a 12 mesi che &lt;b&gt;scorre in avanti&lt;/b&gt;: chiuso un mese (o un trimestre), se ne aggiunge uno nuovo in fondo. L&#x27;orizzonte resta così sempre di un anno. [8-3, 8-4]&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Prova: fai scorrere il rolling budget&lt;/h3&gt;
  &lt;p&gt;Ogni clic chiude il mese più vecchio e ne aggiunge uno nuovo alla fine: la finestra resta sempre di 12 mesi.&lt;/p&gt;
  &lt;svg id=&quot;rolling&quot; viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Finestra di 12 mesi che scorre&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;rollBtn&quot;&gt;Chiudi un mese ▸&lt;/button&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; id=&quot;rollReset&quot;&gt;Ricomincia&lt;/button&gt;&lt;span class=&quot;stepmsg&quot; id=&quot;rollMsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Perché conviene: il manager guarda sempre un anno avanti invece di un orizzonte che si accorcia man mano che l&#x27;esercizio va avanti (a novembre, con un budget annuale classico, restano solo due mesi pianificati).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;Un budget è soprattutto…&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. un elenco di obiettivi strategici qualitativi&lt;/button&gt;
    &lt;button data-k=&quot;b&quot;&gt;b. un piano quantitativo dettagliato per acquisire e usare risorse in un periodo futuro&lt;/button&gt;
    &lt;button data-k=&quot;c&quot;&gt;c. il resoconto dei costi sostenuti nell&#x27;esercizio precedente&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;È la definizione di [8-3]. Il punto (c) descrive la contabilità a consuntivo, non il budget.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Siamo a fine marzo e c&#x27;è un continuous budget mensile. Quali mesi copre dopo la chiusura di marzo?&lt;/summary&gt;&lt;div&gt;Da aprile a marzo dell&#x27;anno successivo: marzo esce dalla finestra e si aggiunge il nuovo marzo, in modo da avere sempre 12 mesi davanti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 --&gt;
&lt;section class=&quot;part&quot; id=&quot;perche&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 2&lt;/span&gt;
  &lt;h2&gt;Perché le organizzazioni fanno il budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-5] – [8-8]&lt;/p&gt;
  &lt;p&gt;Il budget serve a due scopi distinti ma collegati, che le slide chiamano &lt;b&gt;planning&lt;/b&gt; e &lt;b&gt;control&lt;/b&gt; [8-8].&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Planning perspective&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Control perspective&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Come si legano&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning&lt;/b&gt;: sviluppare obiettivi e preparare i vari budget per raggiungerli. [8-8]&lt;/div&gt;
    &lt;p&gt;Clicca un beneficio per leggerne il significato. [8-6]&lt;/p&gt;
    &lt;svg id=&quot;benefits&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Benefici del budget dal punto di vista della pianificazione&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;panel&quot; id=&quot;benefitTxt&quot;&gt;Scegli un riquadro.&lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Control&lt;/b&gt;: i passi che il management compie per aumentare la probabilità che gli obiettivi fissati in fase di planning siano raggiunti e che tutte le parti dell&#x27;organizzazione lavorino insieme verso quel traguardo. [8-8]&lt;/div&gt;
    &lt;p&gt;In pratica si &lt;b&gt;confronta il budget con i risultati effettivi&lt;/b&gt; (actual results) per [8-7]:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Improve&lt;/h4&gt;&lt;p&gt;migliorare &lt;b&gt;efficiency&lt;/b&gt; (fare le cose usando meno risorse) ed &lt;b&gt;effectiveness&lt;/b&gt; (raggiungere davvero l&#x27;obiettivo) delle operazioni.&lt;/p&gt;&lt;/div&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Evaluate &amp;amp; reward&lt;/h4&gt;&lt;p&gt;valutare e premiare i dipendenti in base allo scostamento fra risultato e budget. Questo uso apre la strada al &lt;i&gt;budgetary slack&lt;/i&gt; (vedi parte 3).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Ciclo pianificazione e controllo&quot;&gt;
     &lt;defs&gt;&lt;marker id=&quot;ah&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;currentColor&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
     &lt;g style=&quot;color:var(--c)&quot;&gt;
      &lt;rect x=&quot;30&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--bg);stroke:var(--c)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;obiettivi + budget&lt;/text&gt;
      &lt;rect x=&quot;245&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Esecuzione&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;risultati effettivi&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--bg);stroke:var(--c)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Control&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;budget vs actual&lt;/text&gt;
      &lt;path d=&quot;M182 100H240&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path d=&quot;M397 100H455&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;path d=&quot;M535 133C535 190 105 190 105 136&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;text x=&quot;320&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;feedback: il piano si corregge quando cambiano le circostanze&lt;/text&gt;
     &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p&gt;Lo dice il riquadro di [8-8]: il controllo consiste nel «raccogliere feedback per assicurarsi che il piano sia eseguito correttamente e modificarlo quando le circostanze cambiano». Senza planning non c&#x27;è un metro di paragone; senza control il piano resta sulla carta.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;c&quot;&gt;&lt;p&gt;Confrontare il budget con i risultati effettivi per premiare un responsabile di reparto rientra nella prospettiva…&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. di planning&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. di coordinamento&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. di control&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-7]: dal punto di vista del controllo si confronta budget e actual per migliorare le operazioni e per &lt;i&gt;evaluate and reward employees&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Elenca i sei benefici di planning visti a lezione.&lt;/summary&gt;&lt;div&gt;Definire goals e objectives; pensare e pianificare il futuro; allocare le risorse; scoprire potenziali bottlenecks (colli di bottiglia); coordinare le attività; comunicare i piani. [8-6]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 --&gt;
&lt;section class=&quot;part&quot; id=&quot;come&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 3&lt;/span&gt;
  &lt;h2&gt;Come si crea un budget: top-down o self-imposed&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-9] – [8-14]&lt;/p&gt;
  &lt;p&gt;Nella pratica le imprese combinano due approcci [8-9]: il &lt;span class=&quot;t&quot;&gt;top-down budgeting&lt;/span&gt; (dall&#x27;alto verso il basso) e il &lt;span class=&quot;t&quot;&gt;self-imposed budget&lt;/span&gt;, detto anche &lt;span class=&quot;t&quot;&gt;participative budget&lt;/span&gt; (budget partecipativo).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Top-down&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Self-imposed&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Confronto&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Budget top-down: gli obiettivi scendono dal vertice&quot;&gt;
     &lt;g id=&quot;orgDown&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;p&gt;Il top management avvia il processo fissando i &lt;b&gt;profit targets&lt;/b&gt;; i manager di livello inferiore devono preparare budget che li rispettino. [8-10]&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Problemi&lt;/b&gt; [8-10]:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;spesso &lt;b&gt;demotiva&lt;/b&gt; i manager di livello inferiore, perché ignora le loro conoscenze e opinioni;&lt;/li&gt;
    &lt;li&gt;gli obiettivi possono essere &lt;b&gt;troppo alti&lt;/b&gt;, e allora generano risentimento invece di cooperazione, oppure, senza che nessuno se ne accorga, &lt;b&gt;troppo bassi&lt;/b&gt;, e allora sono inefficaci.&lt;/li&gt;&lt;/ul&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Budget self-imposed: le stime salgono dai supervisori al vertice&quot;&gt;&lt;g id=&quot;orgUp&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-imposed (participative) budget&lt;/b&gt;: budget preparato con la piena cooperazione e partecipazione dei manager di tutti i livelli. [8-9]&lt;/div&gt;
    &lt;p&gt;Le stime salgono dai supervisor al middle management e poi al top management [8-11]. Lavorando insieme, i manager tendono a fissare obiettivi &lt;b&gt;sfidanti ma raggiungibili&lt;/b&gt;, che rafforzano fiducia e impegno verso il budget.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Vantaggi [8-12]&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Respect&lt;/b&gt;: valorizza le opinioni dei manager di livello inferiore.&lt;/li&gt;&lt;li&gt;&lt;b&gt;More accurate&lt;/b&gt;: chi lavora in prima linea stima spesso meglio del vertice.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Motivation&lt;/b&gt;: si è più motivati a perseguire obiettivi che si è contribuito a fissare.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Ownership&lt;/b&gt;: il manager si sente proprietario del budget e risponde degli scostamenti.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Limiti [8-13]&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;Senza la visione strategica del vertice, le stime dal basso possono essere &lt;b&gt;subottimali&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Se il budget serve anche a premiare, i manager possono creare troppo &lt;span class=&quot;t&quot;&gt;budgetary slack&lt;/span&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; style=&quot;min-width:480px&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspetto&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Top-down&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Self-imposed&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Chi parte&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Top management (profit targets)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Manager di tutti i livelli&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Direzione&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;dall&#x27;alto in basso&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;dal basso in alto, con revisione dall&#x27;alto&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Accuratezza&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;rischio di target troppo alti o troppo bassi&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;stime spesso più accurate&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Motivazione&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;rischio di demotivazione e risentimento&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;più alta, con ownership&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Rischio tipico&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;si ignora la conoscenza operativa&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;slack, visione poco strategica&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;La soluzione delle slide è &lt;b&gt;mista&lt;/b&gt; [8-14]: il vertice fissa linee guida generali (profitti o vendite complessivi), i livelli inferiori costruiscono il budget dentro quei limiti e il vertice lo rivede per evitare lo slack.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Budgetary slack: cos&#x27;è e perché si combatte&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budgetary slack&lt;/b&gt; (riserva o «cuscinetto» di budget): margine introdotto di proposito nelle stime, per esempio sottostimando i ricavi o sovrastimando i costi, così che i risultati effettivi superino il piano con facilità. [8-13, 8-14]&lt;/div&gt;
  &lt;p&gt;Per questo i self-imposed budget vanno &lt;b&gt;rivisti dai livelli superiori&lt;/b&gt; [8-14]. L&#x27;obiettivo è un target &lt;i&gt;challenging but highly achievable&lt;/i&gt;. Lo schema qui sotto (illustrativo, non preso dalle slide) mostra le tre zone descritte in [8-10] e [8-14].&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;slackR&quot;&gt;Target proposto rispetto alla stima realistica&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;slackR&quot; min=&quot;-30&quot; max=&quot;30&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;slackO&quot;&gt;0%&lt;/output&gt;&lt;/div&gt;
  &lt;svg id=&quot;slackSvg&quot; viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Zone del target: troppo basso, sfidante ma raggiungibile, troppo alto&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;panel&quot; id=&quot;slackTxt&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;Un responsabile commerciale sa di poter vendere 12.000 unità ma mette a budget 10.000, perché il suo bonus dipende dal superamento del budget. Che cosa sta facendo?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. crea budgetary slack&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. applica il top-down budgeting&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. usa un continuous budget&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Sottostimare i ricavi per battere il piano è proprio lo slack descritto in [8-13]. Il rimedio è la revisione da parte dei livelli superiori [8-14].&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Perché le stime dei manager in prima linea sono spesso più accurate di quelle del vertice?&lt;/summary&gt;&lt;div&gt;Perché conoscono da vicino clienti, processi, tempi e problemi operativi. È il vantaggio n. 2 di [8-12].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono i due limiti del budget partecipativo?&lt;/summary&gt;&lt;div&gt;(1) Stime subottimali se manca la prospettiva strategica del vertice; (2) troppo slack se il budget viene usato per premiare. [8-13]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section class=&quot;part&quot; id=&quot;master&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 4&lt;/span&gt;
  &lt;h2&gt;Il master budget: visione d&#x27;insieme&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-15] – [8-18]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Master budget&lt;/b&gt;: l&#x27;insieme coordinato dei budget dell&#x27;impresa per il periodo, cioè dieci &lt;i&gt;schedule&lt;/i&gt; (prospetti) collegati fra loro, che partono dal &lt;span class=&quot;t&quot;&gt;sales budget&lt;/span&gt; e arrivano al conto economico e allo stato patrimoniale previsionali. [8-15, 8-16]&lt;/div&gt;
  &lt;p&gt;La freccia rossa di [8-15] indica il punto di partenza: &lt;b&gt;tutto discende dal sales budget&lt;/b&gt;. Le vendite previste determinano quanto produrre; la produzione determina materiali, manodopera e overhead; tutti i flussi di cassa confluiscono nel &lt;span class=&quot;t&quot;&gt;cash budget&lt;/span&gt;; alla fine si compilano il &lt;span class=&quot;t&quot;&gt;budgeted income statement&lt;/span&gt; (conto economico previsionale) e il &lt;span class=&quot;t&quot;&gt;budgeted balance sheet&lt;/span&gt; (stato patrimoniale previsionale).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Clicca uno schema&lt;/b&gt; per vedere da dove prende i dati, a cosa serve e a quale delle 10 domande risponde.&lt;/p&gt;
  &lt;div class=&quot;map&quot;&gt;&lt;svg id=&quot;flow&quot; viewBox=&quot;0 0 900 470&quot; role=&quot;img&quot; aria-label=&quot;Flusso del master budget, schema cliccabile&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;flowTxt&quot;&gt;Scegli uno schema nel diagramma.&lt;/div&gt;

  &lt;h3&gt;Seeing the big picture: le 10 domande&lt;/h3&gt;
  &lt;p&gt;Le 10 schedule del master budget servono a rispondere a 10 domande [8-16, 8-17]. Clicca una domanda per vedere quale schedule le risponde.&lt;/p&gt;
  &lt;ol class=&quot;qlist&quot; id=&quot;qlist&quot;&gt;
   &lt;li&gt;Quanti ricavi di vendita otterremo? &lt;span class=&quot;ans&quot;&gt;→ Sales budget (parte 5)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanta cassa incasseremo dai clienti? &lt;span class=&quot;ans&quot;&gt;→ Schedule of expected cash collections (parte 5)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanta materia prima dovremo acquistare? &lt;span class=&quot;ans&quot;&gt;→ Direct materials budget (parte 7)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanti costi di produzione sosterremo? &lt;span class=&quot;ans&quot;&gt;→ Direct materials, direct labor e manufacturing overhead budget (parti 7–9)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanta cassa pagheremo a fornitori, manodopera diretta e overhead? &lt;span class=&quot;ans&quot;&gt;→ Disbursements for materials, direct labor budget, overhead budget (parti 7–9)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quale costo totale passerà dal magazzino prodotti finiti al costo del venduto? &lt;span class=&quot;ans&quot;&gt;→ Ending finished goods inventory budget, che dà il costo unitario (parte 10)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quante spese di vendita e amministrative sosterremo, e quanta cassa pagheremo per esse? &lt;span class=&quot;ans&quot;&gt;→ Selling and administrative expense budget (parte 11)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanto prenderemo in prestito o rimborseremo, interessi compresi? &lt;span class=&quot;ans&quot;&gt;→ Cash budget (parte 12)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Quanto operating income (reddito operativo) otterremo? &lt;span class=&quot;ans&quot;&gt;→ Budgeted income statement (parte 13)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;Come sarà lo stato patrimoniale a fine periodo? &lt;span class=&quot;ans&quot;&gt;→ Budgeted balance sheet (parte 13)&lt;/span&gt;&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;Ogni schedule si regge su stime e ipotesi&lt;/h3&gt;
  &lt;p&gt;Il master budget si fonda su &lt;b&gt;estimates/assumptions&lt;/b&gt; [8-18]. Il sales budget, per esempio, ne richiede tre:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;1 · Unità&lt;/h4&gt;&lt;p&gt;Quante unità prevediamo di vendere?&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;2 · Prezzo&lt;/h4&gt;&lt;p&gt;Qual è il prezzo di vendita unitario previsto?&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;3 · Incassi&lt;/h4&gt;&lt;p&gt;Che percentuale dei crediti verso clienti (&lt;span class=&quot;t&quot;&gt;accounts receivable&lt;/span&gt;) sarà incassata nel periodo corrente e in quelli successivi?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Se un&#x27;ipotesi cambia, cambiano a cascata tutte le schedule che ne dipendono. Lo puoi provare nel &lt;a href=&quot;#lab&quot;&gt;Laboratorio&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;L&#x27;esempio guida: Royal Company&lt;/h3&gt;
  &lt;p&gt;Royal prepara i budget per il &lt;b&gt;trimestre che termina il 30 giugno&lt;/b&gt;, prezzo &lt;b&gt;$10&lt;/b&gt; per unità [8-21]. Vendite previste:&lt;/p&gt;
  &lt;svg id=&quot;salesChart&quot; viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Vendite previste da aprile ad agosto&quot;&gt;&lt;/svg&gt;
  &lt;p class=&quot;small&quot;&gt;Luglio e agosto non fanno parte del trimestre, ma servono per calcolare le scorte finali desiderate di giugno (di prodotti e di materiali).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;Da quale schedule parte la costruzione del master budget?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. Cash budget&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. Sales budget&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. Production budget&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-15]: il sales budget è il punto di partenza, perché quasi tutte le altre schedule dipendono dal volume di vendite previsto.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Perché il cash budget sta quasi in fondo alla catena?&lt;/summary&gt;&lt;div&gt;Perché raccoglie gli incassi (dalla schedule of collections) e i pagamenti calcolati nelle schedule di materiali, manodopera, overhead e S&amp;amp;A. Si può compilare solo dopo di esse [8-15].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 --&gt;
&lt;section class=&quot;part&quot; id=&quot;sales&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 5 · LEARNING OBJECTIVE 2&lt;/span&gt;
  &lt;h2&gt;Sales budget e schedule of expected cash collections&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-20] – [8-29]&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total budgeted sales = Budgeted unit sales × Selling price per unit&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tSales&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Ricavo e incasso però non coincidono: «Do customers pay immediately? Usually they do not» [8-22]. Il ricavo di aprile è 200.000 $, ma ad aprile se ne incassa solo una parte.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sales on account&lt;/b&gt; (vendite a credito): il cliente paga dopo la consegna. Nel frattempo l&#x27;importo è un credito, cioè un &lt;span class=&quot;t&quot;&gt;accounts receivable&lt;/span&gt; (A/R). Royal incassa il &lt;b&gt;70%&lt;/b&gt; nel mese della vendita e il &lt;b&gt;30%&lt;/b&gt; nel mese successivo; il saldo A/R al 31 marzo (30.000 $) si incassa tutto ad aprile. [8-23]&lt;/div&gt;
  &lt;svg id=&quot;collSvg&quot; viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Come le vendite di ogni mese si trasformano in incassi&quot;&gt;&lt;/svg&gt;
  &lt;h3&gt;Costruisci la schedule passo per passo&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tColl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tColl&quot; data-max=&quot;5&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Avanti ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Collections&lt;sub&gt;mese t&lt;/sub&gt; = 70% × Sales&lt;sub&gt;t&lt;/sub&gt; + 30% × Sales&lt;sub&gt;t−1&lt;/sub&gt;&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;A/R al 30/6 = 30% × vendite di giugno = &lt;b id=&quot;arEnd&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Il credito di fine trimestre non sparisce: finirà nel &lt;b&gt;budgeted balance sheet&lt;/b&gt; come attività e sarà incassato a luglio. [8-29]&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;d&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 1&lt;/b&gt; [8-27]: quali saranno gli incassi totali del trimestre?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $700,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $220,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $190,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $940,000&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;30.000 + 200.000 + 500.000 + 70% × 300.000 = 940.000. In alternativa: ricavi 1.000.000 + A/R iniziale 30.000 − A/R finale 90.000 = 940.000. [8-28, 8-29]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Se Royal incassasse il 60% nel mese e il 40% nel mese dopo, quanto incasserebbe a maggio?&lt;/summary&gt;&lt;div&gt;60% × 500.000 + 40% × 200.000 = 300.000 + 80.000 = 380.000 $ (invece di 410.000).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché i ricavi del trimestre (1.000.000) sono diversi dagli incassi (940.000)?&lt;/summary&gt;&lt;div&gt;Perché si incassano 30.000 di crediti vecchi (marzo) ma restano da incassare 90.000 di vendite di giugno: 1.000.000 + 30.000 − 90.000 = 940.000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 --&gt;
&lt;section class=&quot;part&quot; id=&quot;production&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 6 · LEARNING OBJECTIVE 3&lt;/span&gt;
  &lt;h2&gt;Production budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-30] – [8-38]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Production budget&lt;/b&gt;: elenca le unità da produrre per soddisfare le vendite previste e avere in magazzino la scorta finale desiderata di prodotti finiti (&lt;span class=&quot;t&quot;&gt;desired ending finished goods&lt;/span&gt;). Si prepara dopo il sales budget. [8-31]&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Required production = Budgeted sales + Desired ending inventory − Beginning inventory&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Intuizione: devo avere abbastanza unità per &lt;b&gt;vendere&lt;/b&gt; e per &lt;b&gt;lasciarne una scorta&lt;/b&gt; a fine mese (fabbisogno totale, &lt;i&gt;total needs&lt;/i&gt;). Una parte c&#x27;è già in magazzino a inizio mese, quindi la sottraggo.&lt;/p&gt;
  &lt;p&gt;Royal vuole una scorta finale pari al &lt;b&gt;20% delle vendite del mese successivo&lt;/b&gt;; al 31 marzo ha &lt;b&gt;4.000 unità&lt;/b&gt;. [8-32]&lt;/p&gt;
  &lt;svg id=&quot;prodSvg&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione della produzione richiesta&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;prodMonth&quot;&gt;Mese da scomporre&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;prodMonth&quot; min=&quot;0&quot; max=&quot;2&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;prodMonthO&quot;&gt;April&lt;/output&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tProd&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Attenzione ai legami&lt;/b&gt; [8-34, 8-37, 8-38]: la scorta finale di un mese è la scorta iniziale del mese dopo (aprile finisce con 10.000 e maggio parte da 10.000). Nella colonna &lt;i&gt;Quarter&lt;/i&gt; la scorta finale è quella di &lt;b&gt;giugno&lt;/b&gt; (5.000 = 20% × 25.000 di luglio) e quella iniziale è quella di &lt;b&gt;aprile&lt;/b&gt; (4.000): non si sommano i tre mesi.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;E se Royal fosse un&#x27;impresa commerciale?&lt;/b&gt; Una &lt;i&gt;merchandising company&lt;/i&gt; compra e rivende senza trasformare: invece del production budget prepara un &lt;span class=&quot;t&quot;&gt;merchandise purchase budget&lt;/span&gt; (budget degli acquisti di merci), con la stessa logica: acquisti = costo del venduto + scorta finale desiderata − scorta iniziale. [8-32]&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 2&lt;/b&gt; [8-35]: qual è la produzione richiesta a maggio?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. 56,000 units&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. 46,000 units&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. 62,000 units&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. 52,000 units&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;50.000 vendite + 6.000 scorta finale (20% × 30.000 di giugno) − 10.000 scorta iniziale = 46.000. Il 56.000 dell&#x27;opzione (a) è il &lt;i&gt;total needs&lt;/i&gt;: manca la sottrazione della scorta iniziale. [8-36, 8-37]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Perché la produzione del trimestre (101.000) supera le vendite (100.000)?&lt;/summary&gt;&lt;div&gt;Perché la scorta di prodotti finiti cresce da 4.000 (1 aprile) a 5.000 (30 giugno): 100.000 + 5.000 − 4.000 = 101.000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 --&gt;
&lt;section class=&quot;part&quot; id=&quot;materials&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 7 · LEARNING OBJECTIVE 4&lt;/span&gt;
  &lt;h2&gt;Direct materials budget e pagamenti ai fornitori&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-39] – [8-54]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Direct materials budget&lt;/b&gt;: indica quante materie prime (&lt;span class=&quot;t&quot;&gt;raw materials&lt;/span&gt;, i materiali diretti che entrano fisicamente nel prodotto) acquistare per soddisfare il production budget e mantenere scorte adeguate. Si prepara dopo il production budget. [8-40]&lt;/div&gt;
  &lt;p&gt;Dati Royal [8-41]: &lt;b&gt;5 pounds&lt;/b&gt; (libbre) di materiale per unità; scorta finale desiderata pari al &lt;b&gt;10% del fabbisogno di produzione del mese successivo&lt;/b&gt;; 13.000 libbre al 31 marzo; costo &lt;b&gt;$0.40&lt;/b&gt; per libbra.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Production needs = Units to produce × Materials per unit&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Materials to be purchased = Production needs + Desired ending inventory − Beginning inventory&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;È la stessa logica del production budget, spostata un gradino più in basso nella catena: lì si partiva dalle &lt;i&gt;vendite&lt;/i&gt;, qui dalla &lt;i&gt;produzione&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tMat&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Come si ottiene la scorta finale di giugno (11.500 lb)?&lt;/summary&gt;&lt;div&gt;Serve la produzione di &lt;b&gt;luglio&lt;/b&gt;: vendite di luglio 25.000 + scorta finale 20% × 15.000 (agosto) = 3.000 − scorta iniziale 5.000 = &lt;b&gt;23.000 unità&lt;/b&gt;. Fabbisogno di luglio = 23.000 × 5 = 115.000 lb, e il 10% è 11.500 lb. Le slide riportano solo il risultato [8-48]; il passaggio è ricostruito qui.&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;note&quot;&gt;«These are numbers of units of raw materials… not money» [8-48]. Il materials budget è in &lt;b&gt;libbre&lt;/b&gt;. Per passare ai dollari: libbre acquistate × $0.40 (es. aprile 140.000 × 0,40 = 56.000 $) [8-51].&lt;/div&gt;

  &lt;h3&gt;Schedule of expected cash disbursements for materials&lt;/h3&gt;
  &lt;p&gt;Royal paga &lt;b&gt;metà&lt;/b&gt; degli acquisti nel mese stesso e &lt;b&gt;metà&lt;/b&gt; nel mese successivo; i debiti verso fornitori (&lt;span class=&quot;t&quot;&gt;accounts payable&lt;/span&gt;, A/P) al 31 marzo sono 12.000 $ e si pagano ad aprile. [8-49] &lt;i&gt;Disbursement&lt;/i&gt; = esborso di cassa.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tPay&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tPay&quot; data-max=&quot;5&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Avanti ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;A/P al 30 giugno = 50% × acquisti di giugno = &lt;b id=&quot;apEnd&quot;&gt;&lt;/b&gt; [8-54]: andrà nel budgeted balance sheet come passività.&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 3&lt;/b&gt; [8-45]: quanti materiali acquistare a maggio?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. 221,500 pounds&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. 240,000 pounds&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. 230,000 pounds&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. 211,500 pounds&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;230.000 (46.000 × 5) + 14.500 (10% × 29.000 × 5) − 23.000 (scorta iniziale) = 221.500 lb. [8-47]&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 4&lt;/b&gt; [8-52]: quali sono i pagamenti totali per materiali nel trimestre?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $185,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $68,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $56,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $201,400&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;12.000 + 56.000 + 88.600 + 50% × 56.800 = 185.000. 201.400 è il &lt;i&gt;costo&lt;/i&gt; degli acquisti del trimestre: la differenza (12.000 − 28.400) dipende dalla variazione dei debiti verso fornitori. [8-54]&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 8 --&gt;
&lt;section class=&quot;part&quot; id=&quot;labor&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 8 · LEARNING OBJECTIVE 5&lt;/span&gt;
  &lt;h2&gt;Direct labor budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-55] – [8-60]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Direct labor budget&lt;/b&gt;: mostra le ore di manodopera diretta (&lt;span class=&quot;t&quot;&gt;direct labor-hours&lt;/span&gt;, il lavoro degli addetti che trasformano fisicamente il prodotto) richieste dal production budget. Così l&#x27;impresa può pianificare in anticipo come adeguare la forza lavoro nel corso dell&#x27;anno. [8-56]&lt;/div&gt;
  &lt;p&gt;Royal: &lt;b&gt;0,05 ore&lt;/b&gt; (3 minuti) per unità, manodopera non specializzata, &lt;b&gt;$10/ora&lt;/b&gt;. [8-57]&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Labor-hours required = Units of production × Direct labor time per unit&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Total direct labor cost = Labor-hours × Hourly wage rate&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tLab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Ipotesi semplificatrice&lt;/b&gt; [8-56]: la forza lavoro si adegua esattamente al fabbisogno, quindi il costo è variabile. Nella realtà politiche del personale e contratti spesso garantiscono un minimo di ore o richiedono pagamenti extra (straordinari), e allora il costo della manodopera non segue la produzione in modo proporzionale. Le slide assumono anche che le paghe si versino nel mese stesso: il costo coincide con l&#x27;uscita di cassa.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Se la paga salisse a $12/ora, quale sarebbe il costo della manodopera diretta a maggio?&lt;/summary&gt;&lt;div&gt;2.300 ore × 12 = 27.600 $ (invece di 23.000).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché il direct labor budget parte dal production budget e non dal sales budget?&lt;/summary&gt;&lt;div&gt;Perché si lavora per &lt;i&gt;produrre&lt;/i&gt;, non per vendere: le ore dipendono dalle unità prodotte (26.000, 46.000, 29.000), che differiscono dalle vendite per effetto delle scorte.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 9 --&gt;
&lt;section class=&quot;part&quot; id=&quot;overhead&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 9 · LEARNING OBJECTIVE 6&lt;/span&gt;
  &lt;h2&gt;Manufacturing overhead budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-61] – [8-66]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt; (costi generali di produzione): tutti i costi di produzione &lt;b&gt;diversi&lt;/b&gt; da materiali diretti e manodopera diretta [8-62], come energia, manutenzione, supervisione, affitto e ammortamento dello stabilimento.&lt;/div&gt;
  &lt;p&gt;Royal applica l&#x27;overhead ai prodotti in base alle &lt;b&gt;direct labor-hours&lt;/b&gt; [8-63]:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Variabile&lt;/h4&gt;&lt;p&gt;&lt;b&gt;$20 per direct labor-hour&lt;/b&gt;: cresce con le ore lavorate.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Fisso&lt;/h4&gt;&lt;p&gt;&lt;b&gt;$50.000 al mese&lt;/b&gt;, di cui &lt;b&gt;$20.000 noncash&lt;/b&gt;, cioè soprattutto &lt;span class=&quot;t&quot;&gt;depreciation&lt;/span&gt; (ammortamento) degli impianti.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total mfg. OH = Labor-hours × $20 + $50,000&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Cash disbursement for mfg. OH = Total mfg. OH − Noncash costs ($20,000)&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tOH&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Depreciation is a noncash charge&lt;/b&gt; [8-66]. L&#x27;ammortamento ripartisce negli anni il costo di un impianto già pagato quando è stato acquistato. È un &lt;i&gt;costo&lt;/i&gt; del periodo, che entra nel costo del prodotto e nel conto economico, ma non è un&#x27;&lt;i&gt;uscita di cassa&lt;/i&gt; del periodo. Per questo si toglie prima di passare al cash budget.&lt;/div&gt;

  &lt;h3&gt;Il tasso orario medio: $49,70&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Predetermined OH rate = Total mfg. OH for quarter / Total labor-hours = 251,000 / 5,050 ≈ $49.70 per hour&lt;/span&gt; [8-65]&lt;/div&gt;
  &lt;p&gt;Sposta il cursore: con più ore la quota fissa si spalma su una base più ampia e il costo medio orario scende. Per questo si usa un tasso &lt;b&gt;medio del trimestre&lt;/b&gt;, così il costo unitario del prodotto non oscilla da un mese all&#x27;altro.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ohH&quot;&gt;Direct labor-hours nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ohH&quot; min=&quot;500&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1300&quot;&gt;&lt;output id=&quot;ohHO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
  &lt;svg id=&quot;ohSvg&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Overhead totale, in cassa e tasso medio in funzione delle ore&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;kpis&quot; id=&quot;ohK&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Quanto paga in cassa Royal per l&#x27;overhead a giugno? Spiega il calcolo.&lt;/summary&gt;&lt;div&gt;1.450 h × 20 = 29.000 variabile + 50.000 fisso = 79.000 totale − 20.000 ammortamento = &lt;b&gt;59.000 $&lt;/b&gt;. [8-66]&lt;/div&gt;&lt;/details&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;c&quot;&gt;&lt;p&gt;Perché si sottraggono 20.000 $ al mese nell&#x27;overhead budget?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. perché sono costi variabili&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. perché sono già inclusi nella manodopera diretta&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. perché l&#x27;ammortamento non comporta un&#x27;uscita di cassa nel periodo&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-63, 8-66]: i costi noncash non entrano nel cash budget.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 10 --&gt;
&lt;section class=&quot;part&quot; id=&quot;fginv&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 10&lt;/span&gt;
  &lt;h2&gt;Ending finished goods inventory budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-67] – [8-71]&lt;/p&gt;
  &lt;p&gt;Questa schedule calcola il &lt;b&gt;costo unitario di produzione&lt;/b&gt; (&lt;span class=&quot;t&quot;&gt;unit product cost&lt;/span&gt;) e il valore della scorta finale di prodotti finiti. Serve per due cose: il costo del venduto (&lt;span class=&quot;t&quot;&gt;cost of goods sold&lt;/span&gt;, COGS) nel conto economico e il magazzino nello stato patrimoniale. Risponde alla domanda 6.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Unit product cost = DM (5 lb × $0.40) + DL (0.05 h × $10) + MOH (0.05 h × $49.70)&lt;/span&gt;&lt;/div&gt;
  &lt;svg id=&quot;ucSvg&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Composizione del costo unitario&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tFG&quot; style=&quot;min-width:420px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Ogni riga ha la sua fonte: materiali dal &lt;i&gt;direct materials budget&lt;/i&gt; [8-67], manodopera dal &lt;i&gt;direct labor budget&lt;/i&gt; [8-68], tasso di overhead dall&#x27;&lt;i&gt;overhead budget&lt;/i&gt; [8-69], unità finali dal &lt;i&gt;production budget&lt;/i&gt; [8-71]. È l&#x27;approccio dell&#x27;&lt;b&gt;absorption costing&lt;/b&gt; (il costo del prodotto include anche l&#x27;overhead fisso), visto che il tasso di 49,70 $ comprende la quota fissa.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;L&#x27;overhead per unità è 0,05 × 49,70 = 2,485, che le slide arrotondano a &lt;b&gt;2,49&lt;/b&gt;. Il costo unitario è quindi 4,99 $ e la scorta finale vale 5.000 × 4,99 = &lt;b&gt;24.950 $&lt;/b&gt; [8-70].&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché per l&#x27;overhead si usano 0,05 ore (come per la manodopera) e non le libbre di materiale?&lt;/summary&gt;&lt;div&gt;Perché Royal applica l&#x27;overhead sulla base delle direct labor-hours [8-63]: ogni unità «consuma» 0,05 ore, quindi assorbe 0,05 × 49,70 di overhead.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Da dove vengono le 5.000 unità di scorta finale?&lt;/summary&gt;&lt;div&gt;Dal production budget: scorta desiderata a fine giugno = 20% × 25.000 (vendite di luglio). [8-38, 8-71]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 11 --&gt;
&lt;section class=&quot;part&quot; id=&quot;sa&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 11 · LEARNING OBJECTIVE 7&lt;/span&gt;
  &lt;h2&gt;Selling and administrative expense budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-72] – [8-77]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Selling and administrative (S&amp;amp;A) expenses&lt;/b&gt;: costi &lt;b&gt;non di produzione&lt;/b&gt;, cioè commerciali (provvigioni, pubblicità, spedizioni) e amministrativi (direzione, contabilità, uffici). Non entrano nel costo del prodotto: sono &lt;i&gt;period costs&lt;/i&gt; (costi di periodo) e vanno direttamente a conto economico.&lt;/div&gt;
  &lt;p&gt;Royal li divide in componente variabile e fissa [8-73]: &lt;b&gt;$0.50 per unità venduta&lt;/b&gt; (si guarda alle vendite, non alla produzione) più &lt;b&gt;$70.000 al mese&lt;/b&gt; fissi, di cui &lt;b&gt;$10.000 noncash&lt;/b&gt; (soprattutto ammortamento).&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total S&amp;amp;A = Unit sales × $0.50 + $70,000&lt;/span&gt;  ·  &lt;span class=&quot;eq&quot;&gt;Cash S&amp;amp;A = Total S&amp;amp;A − $10,000&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tSA&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 6&lt;/b&gt; [8-75]: quali sono gli esborsi di cassa per S&amp;amp;A nel trimestre?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $180,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $230,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $110,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $70,000&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Variabili 50.000 + fissi 210.000 = 260.000 − noncash 30.000 = 230.000. [8-77]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Le spese S&amp;amp;A variabili dipendono dalle unità prodotte o vendute? Perché conta?&lt;/summary&gt;&lt;div&gt;Dalle &lt;b&gt;vendute&lt;/b&gt; (20.000, 50.000, 30.000). Le spese commerciali nascono dalla vendita; nel trimestre sono 100.000 unità vendute contro 101.000 prodotte.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 12 --&gt;
&lt;section class=&quot;part&quot; id=&quot;cash&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 12 · LEARNING OBJECTIVE 8&lt;/span&gt;
  &lt;h2&gt;Cash budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-78] – [8-88]&lt;/p&gt;
  &lt;p&gt;Il cash budget raccoglie in un&#x27;unica schedule tutti i flussi di cassa calcolati finora e dice se e quando l&#x27;impresa dovrà &lt;b&gt;chiedere un prestito&lt;/b&gt; o potrà &lt;b&gt;rimborsarlo&lt;/b&gt;.&lt;/p&gt;
  &lt;h3&gt;Le quattro sezioni [8-79]&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;1 · Cash receipts&lt;/h4&gt;&lt;p&gt;Tutte le entrate di cassa, &lt;b&gt;escluse&lt;/b&gt; quelle da finanziamenti.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;2 · Cash disbursements&lt;/h4&gt;&lt;p&gt;Tutti i pagamenti, &lt;b&gt;esclusi&lt;/b&gt; rimborsi di capitale e interessi.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;3 · Excess or deficiency&lt;/h4&gt;&lt;p&gt;Cassa disponibile − esborsi: dice se servirà un prestito o se si potrà rimborsare.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;4 · Financing&lt;/h4&gt;&lt;p&gt;Prestiti ottenuti (&lt;i&gt;borrowings&lt;/i&gt;), rimborsi (&lt;i&gt;repayments&lt;/i&gt;) e interessi del periodo.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Beginning cash + Cash collections = Total cash available&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Total cash available − Total disbursements = Excess (deficiency)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Excess (deficiency) + Total financing = Ending cash balance&lt;/span&gt; → che diventa il saldo iniziale del mese dopo&lt;/div&gt;
  &lt;h3&gt;Informazioni aggiuntive su Royal [8-80]&lt;/h3&gt;
  &lt;ul&gt;
   &lt;li&gt;&lt;span class=&quot;t&quot;&gt;Line of credit&lt;/span&gt; (linea di credito: la banca concede prestiti fino a un tetto, da usare quando serve) di &lt;b&gt;$75.000 al 16%&lt;/b&gt; annuo;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;saldo minimo di cassa: $30.000&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;prende a prestito il &lt;b&gt;primo giorno del mese&lt;/b&gt; e rimborsa l&#x27;&lt;b&gt;ultimo giorno del trimestre&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;dividendo in contanti di &lt;b&gt;$49.000 ad aprile&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;acquisto di attrezzature per &lt;b&gt;$143.700 a maggio&lt;/b&gt; e &lt;b&gt;$48.300 a giugno&lt;/b&gt;, pagate in contanti;&lt;/li&gt;
   &lt;li&gt;cassa al 1° aprile: &lt;b&gt;$40.000&lt;/b&gt;.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;h3&gt;Compila il cash budget&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tCash&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tCash&quot; data-max=&quot;6&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Avanti ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Ragionamento di aprile: perché si prendono a prestito 48.000 $&lt;/summary&gt;&lt;div&gt;Gli esborsi (228.000) superano la cassa disponibile (210.000): deficit di 18.000. Per chiudere il mese con il saldo minimo di 30.000 servono 30.000 − (−18.000) = &lt;b&gt;48.000&lt;/b&gt; [8-83, 8-84]. A maggio l&#x27;eccedenza è 40.000, sopra il minimo, quindi non si chiede nulla, ma non si rimborsa ancora, perché il rimborso avviene a fine trimestre.&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Ragionamento di giugno: rimborso e interessi&lt;/summary&gt;&lt;div&gt;Eccedenza 130.500. Si rimborsano i 48.000 più gli interessi per i 3 mesi (1° aprile – 30 giugno):
   &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Interest = $48,000 × 16% × 3/12 = $1,920&lt;/span&gt;&lt;/div&gt;
   Saldo finale: 130.500 − 48.000 − 1.920 = &lt;b&gt;80.580&lt;/b&gt; [8-88]. Gli interessi passano poi nel budgeted income statement [8-89].&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;note&quot;&gt;Colonna &lt;i&gt;Quarter&lt;/i&gt;: il saldo iniziale è quello del 1° aprile (40.000) e il finale quello del 30 giugno (80.580). Flussi (incassi, esborsi, finanziamenti) si sommano; saldi no.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;d&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 7&lt;/b&gt; [8-86]: qual è l&#x27;eccedenza (deficit) di cassa disponibile sugli esborsi a giugno?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $95,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $(21,000)&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $175,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $130,500&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Cassa disponibile 40.000 + 360.000 = 400.000 − esborsi 269.500 (72.700 + 14.500 + 59.000 + 75.000 + 48.300) = 130.500. [8-87, 8-88]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;In quale sezione del cash budget va il dividendo? E il rimborso del prestito?&lt;/summary&gt;&lt;div&gt;Il dividendo è un &lt;i&gt;cash disbursement&lt;/i&gt; (sezione 2). Rimborso e interessi stanno nella sezione &lt;i&gt;financing&lt;/i&gt; (4), perché la sezione 2 li esclude esplicitamente [8-79].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché l&#x27;ammortamento non compare nel cash budget?&lt;/summary&gt;&lt;div&gt;Perché è già stato tolto (noncash) nell&#x27;overhead budget e nell&#x27;S&amp;amp;A budget: nel cash budget entrano solo gli importi &lt;i&gt;cash&lt;/i&gt; (56.000, 70.000…).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 13 --&gt;
&lt;section class=&quot;part&quot; id=&quot;statements&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 13&lt;/span&gt;
  &lt;h2&gt;Budgeted income statement e budgeted balance sheet&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-89] e schema [8-15]. Le slide si fermano all&#x27;introduzione: i prospetti qui sotto sono &lt;b&gt;ricostruiti&lt;/b&gt; con i dati delle schedule precedenti.&lt;/p&gt;
  &lt;p&gt;Completato il cash budget, Royal conosce anche gli &lt;b&gt;interessi passivi&lt;/b&gt; e può preparare il conto economico previsionale [8-89]. Ultimo passo è lo stato patrimoniale previsionale [8-15, 8-17 domanda 10].&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Budgeted income statement&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Budgeted balance sheet&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;p&gt;&lt;span class=&quot;badge mine&quot;&gt;ricostruzione&lt;/span&gt;Formato a costo pieno (absorption), trimestre al 30 giugno:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tIS&quot; style=&quot;min-width:420px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Senza imposte, come nell&#x27;esempio delle slide. COGS = unità vendute × costo unitario del prodotto (parte 10), assumendo che anche le 4.000 unità iniziali siano valutate 4,99 $.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;badge mine&quot;&gt;ricostruzione&lt;/span&gt;Le slide non danno lo stato patrimoniale di partenza (al 31 marzo), quindi non si può compilarlo per intero. Si può però dire &lt;b&gt;da quale schedule viene ogni voce&lt;/b&gt; al 30 giugno:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tBS&quot; style=&quot;min-width:480px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Il principio: lo stato patrimoniale previsionale = stato patrimoniale iniziale + effetti di tutte le schedule del periodo.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché il reddito netto (≈ 239.000) è così diverso dalla variazione di cassa del trimestre (+40.580)?&lt;/summary&gt;&lt;div&gt;Perché competenza e cassa divergono: ammortamenti (90.000) riducono il reddito ma non la cassa; attrezzature (192.000) e dividendi (49.000) riducono la cassa ma non il reddito; crediti, debiti e scorte cambiano. Per questo servono &lt;i&gt;sia&lt;/i&gt; l&#x27;income statement &lt;i&gt;sia&lt;/i&gt; il cash budget.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quale valore di cassa va nello stato patrimoniale al 30 giugno e da dove viene?&lt;/summary&gt;&lt;div&gt;80.580 $, il saldo finale del cash budget [8-88].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 14 --&gt;
&lt;section class=&quot;part&quot; id=&quot;lab&quot; style=&quot;--h:35&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PARTE 14 · LABORATORIO&lt;/span&gt;
  &lt;h2&gt;Cambia un&#x27;ipotesi, guarda cambiare tutto&lt;/h2&gt;
  &lt;p&gt;Ogni cursore modifica un&#x27;ipotesi del caso Royal. &lt;b&gt;Tutte le tabelle della pagina&lt;/b&gt; si ricalcolano, come in un vero master budget collegato. Il grafico mostra il cash budget mese per mese. Il motore di calcolo segue le regole delle slide; per i prestiti si arrotonda ai 1.000 $ superiori e, se a giugno la cassa non basta, si rimborsa solo in parte.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lMay&quot;&gt;Vendite di maggio (unità)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lMay&quot; min=&quot;20000&quot; max=&quot;80000&quot; step=&quot;1000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lPrice&quot;&gt;Prezzo di vendita ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lPrice&quot; min=&quot;8&quot; max=&quot;12&quot; step=&quot;0.5&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lColl&quot;&gt;% incassata nel mese di vendita&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lColl&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lFG&quot;&gt;Scorta finale prodotti (% vendite mese dopo)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lFG&quot; min=&quot;0&quot; max=&quot;0.5&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lRM&quot;&gt;Scorta finale materiali (% fabbisogno mese dopo)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lRM&quot; min=&quot;0&quot; max=&quot;0.3&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lPay&quot;&gt;% acquisti pagata nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lPay&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lMin&quot;&gt;Saldo minimo di cassa ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lMin&quot; min=&quot;10000&quot; max=&quot;80000&quot; step=&quot;5000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;labReset&quot;&gt;Ripristina i dati delle slide&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;kpis&quot; id=&quot;labK&quot;&gt;&lt;/div&gt;
  &lt;svg id=&quot;labSvg&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Cash budget mensile: eccedenza, prestiti e saldo finale&quot;&gt;&lt;/svg&gt;
  &lt;p id=&quot;labMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Esperimenti guidati&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Porta la % incassata nel mese al 100%. Che cosa succede ad aprile?&lt;/summary&gt;&lt;div&gt;Gli incassi di aprile salgono a 230.000 (30.000 + 200.000): la cassa disponibile basta e il prestito di aprile scompare. Il reddito però non cambia, perché i ricavi sono gli stessi. Cambia solo il &lt;i&gt;timing&lt;/i&gt; della cassa.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Alza la scorta finale di prodotti al 40%. Perché sale il fabbisogno di prestito?&lt;/summary&gt;&lt;div&gt;Si produce di più ad aprile (più scorta per il picco di maggio), quindi crescono materiali, manodopera e overhead pagati prima di incassare le vendite. È il &lt;i&gt;bottleneck&lt;/i&gt; finanziario che il budget serve a scoprire in anticipo [8-6].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- Per approfondire --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--h:35&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PER APPROFONDIRE&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide non citano esplicitamente autori, testi, norme o siti. Le voci sotto vengono da ricerche web: alcune ricostruiscono la fonte probabile dell&#x27;esempio, altre approfondiscono concetti citati nelle slide (rolling budget, budgetary slack, participative budgeting). Ogni voce è segnata come &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill), cap. «Master Budgeting»&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il manuale di contabilità direzionale da cui con ogni probabilità vengono struttura ed esempio delle slide. La numerazione «8-x» corrisponde al capitolo 8, &lt;i&gt;Master Budgeting&lt;/i&gt;, nelle edizioni di &lt;i&gt;Managerial Accounting&lt;/i&gt; e &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt;, seguito da «Flexible Budgets and Performance Analysis». L&#x27;attribuzione è una deduzione dalla numerazione, non è dichiarata nelle slide.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; riporta l&#x27;esempio completo, compresi income statement e balance sheet che qui sono ricostruiti, ed esercizi svolti. Il capitolo successivo (flexible budgets) riprende il confronto budget–actual della prospettiva di controllo. La numerazione dei capitoli può cambiare da un&#x27;edizione all&#x27;altra.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;mheducation.com — Managerial Accounting (Garrison)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;CGMA (AICPA &amp;amp; CIMA) — «Rolling plans and forecasts»&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una guida pratica dell&#x27;organismo professionale dei management accountant su piani e forecast a scorrimento. Riprende la definizione della CIMA Official Terminology di &lt;i&gt;rolling plans or budgets&lt;/i&gt;: budget aggiornati di continuo aggiungendo un periodo quando quello più vecchio si chiude.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento professionale per il &lt;i&gt;continuous / perpetual budget&lt;/i&gt; di [8-3, 8-4], con vantaggi, limiti e consigli di implementazione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.cgma.org/resources/tools/essential-tools/rolling-plans-and-forecasts.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cgma.org — Rolling plans and forecasts&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Merchant, K. A. (1985) — «Budgeting and the propensity to create budgetary slack», &lt;i&gt;Accounting, Organizations and Society&lt;/i&gt;, 10(2), 201–210&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; uno degli studi empirici classici sul budgetary slack, cioè la sottostima dei ricavi e/o la sovrastima dei costi nel budget. Analizza i fattori che spingono i manager a crearlo, fra cui la partecipazione al budget.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà il fondamento di ricerca a [8-13, 8-14] (slack e participative budgeting). Non ho trovato un link diretto verificato all&#x27;articolo: il link qui sotto è a un articolo accademico ad accesso aperto che lo cita con questi dati bibliografici.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://scielo.br/j/rcf/a/qh7PKcLvxWFmFy7jjLBCxVh/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scielo.br — articolo che cita Merchant (1985)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Daumoser, Hirsch, Sohn (2018) — «Honesty in budgeting: a review of morality and control aspects in the budgetary slack literature», &lt;i&gt;Journal of Management Control&lt;/i&gt;, 29(2), 115–159&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una rassegna della ricerca sul budgetary slack nelle principali riviste di accounting e di etica degli affari. Conclude che il participative budgeting può sia &lt;b&gt;creare&lt;/b&gt; sia &lt;b&gt;ridurre&lt;/b&gt; lo slack, e che se ne crea meno con schemi retributivi che incentivano stime veritiere (&lt;i&gt;truth-inducing&lt;/i&gt;).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra che i vantaggi e i limiti del self-imposed budget visti in [8-12, 8-13] sono un tema ancora discusso e che dipendono da come il budget è legato ai premi, proprio il punto 2 di [8-13].&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://link.springer.com/doi/10.1007/s00187-018-0267-z&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer — DOI 10.1007/s00187-018-0267-z&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;
 &lt;/div&gt;
&lt;/section&gt;
