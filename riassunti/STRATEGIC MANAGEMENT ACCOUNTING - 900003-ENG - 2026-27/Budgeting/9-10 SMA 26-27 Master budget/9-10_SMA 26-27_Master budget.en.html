&lt;body&gt;
&lt;div id=&quot;labBanner&quot;&gt;You are viewing figures modified in the Lab: the tables no longer match the slides. &lt;button type=&quot;button&quot; id=&quot;bannerReset&quot;&gt;Restore the slide data&lt;/button&gt;&lt;/div&gt;

&lt;header class=&quot;hero&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;SMA 26-27 · Budgeting · Lectures 9-10&lt;/div&gt;
  &lt;h1&gt;Master Budgeting&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;Why a company prepares a budget, how it builds one, and how the ten schedules of the &lt;i&gt;master budget&lt;/i&gt; fit into one another, from the sales budget through to the budgeted financial statements. All of it follows the Royal Company example.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Main source: &lt;i&gt;9-10_SMA 26-27_Master budget.pdf&lt;/i&gt; (87 slides). Slide numbers (e.g. &quot;8-34&quot;) are given as &lt;b&gt;[8-34]&lt;/b&gt;.&lt;/p&gt;
  &lt;nav class=&quot;toc&quot; aria-label=&quot;Contents&quot;&gt;
   &lt;a href=&quot;#definizione&quot;&gt;1 · What a budget is&lt;/a&gt;&lt;a href=&quot;#perche&quot;&gt;2 · Why&lt;/a&gt;&lt;a href=&quot;#come&quot;&gt;3 · How&lt;/a&gt;&lt;a href=&quot;#master&quot;&gt;4 · The master budget&lt;/a&gt;&lt;a href=&quot;#sales&quot;&gt;5 · Sales&lt;/a&gt;&lt;a href=&quot;#production&quot;&gt;6 · Production&lt;/a&gt;&lt;a href=&quot;#materials&quot;&gt;7 · Materials&lt;/a&gt;&lt;a href=&quot;#labor&quot;&gt;8 · Labor&lt;/a&gt;&lt;a href=&quot;#overhead&quot;&gt;9 · Overhead&lt;/a&gt;&lt;a href=&quot;#fginv&quot;&gt;10 · Finished goods&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;11 · S&amp;amp;A&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;12 · Cash budget&lt;/a&gt;&lt;a href=&quot;#statements&quot;&gt;13 · Income statement and balance sheet&lt;/a&gt;&lt;a href=&quot;#lab&quot;&gt;14 · Lab&lt;/a&gt;&lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;
  &lt;/nav&gt;
  &lt;div class=&quot;map&quot;&gt;
   &lt;svg id=&quot;cmap&quot; viewBox=&quot;0 0 960 420&quot; role=&quot;img&quot; aria-label=&quot;Concept map of the lecture: click a node to jump to its section&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Concept map: click a box to jump to its section. On the left, the &lt;b&gt;why&lt;/b&gt; and the &lt;b&gt;how&lt;/b&gt; of budgeting; in the centre and on the right, the chain of master budget schedules, which flow into the cash budget and the final statements.&lt;/p&gt;
 &lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
&lt;!-- 1 --&gt;
&lt;section class=&quot;part&quot; id=&quot;definizione&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 1 · LEARNING OBJECTIVE 1&lt;/span&gt;
  &lt;h2&gt;What a budget is and what period it covers&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-2] – [8-4]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budget&lt;/b&gt;: a &lt;b&gt;detailed quantitative plan&lt;/b&gt; for acquiring and using financial and other resources over a specified future period. [8-3]&lt;/div&gt;
  &lt;p&gt;There are three key words. &lt;b&gt;Quantitative&lt;/b&gt;: a budget speaks in units, hours, pounds and dollars, not in intentions. &lt;b&gt;Detailed&lt;/b&gt;: it goes down to the individual month and the individual cost item. &lt;b&gt;Future&lt;/b&gt;: it concerns the period about to begin, whereas financial accounting records the period that has already passed.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Annual operating budget&lt;/h4&gt;&lt;p&gt;It usually covers &lt;b&gt;one year&lt;/b&gt; and corresponds to the company&#x27;s &lt;span class=&quot;t&quot;&gt;fiscal year&lt;/span&gt;. Many companies divide it into &lt;b&gt;four quarters&lt;/b&gt; and the quarters into months. [8-3, 8-4]&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Continuous / perpetual budget&lt;/h4&gt;&lt;p&gt;A &lt;span class=&quot;t&quot;&gt;continuous budget&lt;/span&gt; (also &lt;i&gt;perpetual&lt;/i&gt; or &lt;i&gt;rolling budget&lt;/i&gt;) is a 12-month budget that &lt;b&gt;rolls forward&lt;/b&gt;: as each month (or quarter) ends, a new one is added at the end. The planning horizon therefore always remains one year. [8-3, 8-4]&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Try it: roll the rolling budget forward&lt;/h3&gt;
  &lt;p&gt;Each click closes the oldest month and adds a new one at the end: the window always stays 12 months long.&lt;/p&gt;
  &lt;svg id=&quot;rolling&quot; viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Rolling 12-month window&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;rollBtn&quot;&gt;Close a month ▸&lt;/button&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; id=&quot;rollReset&quot;&gt;Start over&lt;/button&gt;&lt;span class=&quot;stepmsg&quot; id=&quot;rollMsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Why it helps: managers always look one year ahead, instead of facing a horizon that shrinks as the fiscal year goes on (in November, with a conventional annual budget, only two planned months remain).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;A budget is above all…&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. a list of qualitative strategic goals&lt;/button&gt;
    &lt;button data-k=&quot;b&quot;&gt;b. a detailed quantitative plan for acquiring and using resources over a future period&lt;/button&gt;
    &lt;button data-k=&quot;c&quot;&gt;c. a report of the costs incurred in the previous fiscal year&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;This is the definition in [8-3]. Option (c) describes actual (historical) accounting, not a budget.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;It is the end of March and there is a monthly continuous budget. Which months does it cover once March is closed?&lt;/summary&gt;&lt;div&gt;April through March of the following year: March drops out of the window and the new March is added, so that there are always 12 months ahead.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 --&gt;
&lt;section class=&quot;part&quot; id=&quot;perche&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 2&lt;/span&gt;
  &lt;h2&gt;Why organizations budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-5] – [8-8]&lt;/p&gt;
  &lt;p&gt;A budget serves two distinct but related purposes, which the slides call &lt;b&gt;planning&lt;/b&gt; and &lt;b&gt;control&lt;/b&gt; [8-8].&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Planning perspective&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Control perspective&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;How they connect&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning&lt;/b&gt;: developing goals and preparing the various budgets to achieve them. [8-8]&lt;/div&gt;
    &lt;p&gt;Click a benefit to read what it means. [8-6]&lt;/p&gt;
    &lt;svg id=&quot;benefits&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Benefits of budgeting from the planning perspective&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;panel&quot; id=&quot;benefitTxt&quot;&gt;Choose a box.&lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Control&lt;/b&gt;: the steps taken by management to increase the likelihood that the objectives set at the planning stage are attained and that all parts of the organization are working together toward that goal. [8-8]&lt;/div&gt;
    &lt;p&gt;In practice, the &lt;b&gt;budget is compared with actual results&lt;/b&gt; in order to [8-7]:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Improve&lt;/h4&gt;&lt;p&gt;improve the &lt;b&gt;efficiency&lt;/b&gt; (doing things with fewer resources) and &lt;b&gt;effectiveness&lt;/b&gt; (actually achieving the objective) of operations.&lt;/p&gt;&lt;/div&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Evaluate &amp;amp; reward&lt;/h4&gt;&lt;p&gt;evaluate and reward employees on the basis of the variance between actual results and the budget. This use opens the door to &lt;i&gt;budgetary slack&lt;/i&gt; (see Part 3).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Planning and control cycle&quot;&gt;
     &lt;defs&gt;&lt;marker id=&quot;ah&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;currentColor&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
     &lt;g style=&quot;color:var(--c)&quot;&gt;
      &lt;rect x=&quot;30&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--bg);stroke:var(--c)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;goals + budget&lt;/text&gt;
      &lt;rect x=&quot;245&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Execution&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;actual results&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--bg);stroke:var(--c)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Control&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;budget vs actual&lt;/text&gt;
      &lt;path d=&quot;M182 100H240&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path d=&quot;M397 100H455&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;path d=&quot;M535 133C535 190 105 190 105 136&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;text x=&quot;320&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;feedback: the plan is revised when circumstances change&lt;/text&gt;
     &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p&gt;As the box in [8-8] puts it, control involves &quot;gathering feedback to ensure that the plan is being properly executed or modified as circumstances change&quot;. Without planning there is no benchmark; without control the plan stays on paper.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;c&quot;&gt;&lt;p&gt;Comparing the budget with actual results in order to reward a department manager falls under the…&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. planning perspective&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. coordination perspective&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. control perspective&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-7]: from the control perspective, budget and actual are compared to improve operations and to &lt;i&gt;evaluate and reward employees&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;List the six planning benefits covered in class.&lt;/summary&gt;&lt;div&gt;Define goals and objectives; think about and plan for the future; allocate resources; uncover potential bottlenecks; coordinate activities; communicate plans. [8-6]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 --&gt;
&lt;section class=&quot;part&quot; id=&quot;come&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 3&lt;/span&gt;
  &lt;h2&gt;How a budget is created: top-down or self-imposed&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-9] – [8-14]&lt;/p&gt;
  &lt;p&gt;In practice, companies combine two approaches [8-9]: &lt;span class=&quot;t&quot;&gt;top-down budgeting&lt;/span&gt; and the &lt;span class=&quot;t&quot;&gt;self-imposed budget&lt;/span&gt;, also known as the &lt;span class=&quot;t&quot;&gt;participative budget&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Top-down&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Self-imposed&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Comparison&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Top-down budget: targets flow down from the top&quot;&gt;
     &lt;g id=&quot;orgDown&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;p&gt;Top management initiates the process by setting &lt;b&gt;profit targets&lt;/b&gt;; lower-level managers must prepare budgets that meet them. [8-10]&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Problems&lt;/b&gt; [8-10]:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;it often &lt;b&gt;demotivates&lt;/b&gt; lower-level managers, because it ignores their knowledge and opinions;&lt;/li&gt;
    &lt;li&gt;targets may be &lt;b&gt;too high&lt;/b&gt;, breeding resentment rather than cooperation, or, without anyone noticing, &lt;b&gt;too low&lt;/b&gt;, making them ineffective.&lt;/li&gt;&lt;/ul&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Self-imposed budget: estimates flow up from supervisors to the top&quot;&gt;&lt;g id=&quot;orgUp&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-imposed (participative) budget&lt;/b&gt;: a budget prepared with the full cooperation and participation of managers at all levels. [8-9]&lt;/div&gt;
    &lt;p&gt;Estimates flow up from supervisors to middle management and then to top management [8-11]. By working together, managers tend to set &lt;b&gt;challenging but attainable&lt;/b&gt; goals, which strengthen trust in and commitment to the budget.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Advantages [8-12]&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Respect&lt;/b&gt;: it values the opinions of lower-level managers.&lt;/li&gt;&lt;li&gt;&lt;b&gt;More accurate&lt;/b&gt;: front-line staff often estimate better than top management.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Motivation&lt;/b&gt;: people are more motivated to pursue goals they helped to set.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Ownership&lt;/b&gt;: the manager feels ownership of the budget and is accountable for variances.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
     &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Limitations [8-13]&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;Without top management&#x27;s strategic perspective, bottom-up estimates may be &lt;b&gt;suboptimal&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;If the budget is also used for rewards, managers may build in too much &lt;span class=&quot;t&quot;&gt;budgetary slack&lt;/span&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; style=&quot;min-width:480px&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspect&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Top-down&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Self-imposed&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Who starts&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Top management (profit targets)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Managers at all levels&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Direction&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;top to bottom&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;bottom to top, with review from above&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Accuracy&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;risk of targets that are too high or too low&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;estimates often more accurate&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Motivation&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;risk of demotivation and resentment&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;higher, with ownership&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Typical risk&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;operational knowledge is ignored&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;slack, limited strategic view&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;The slides&#x27; solution is a &lt;b&gt;hybrid&lt;/b&gt; [8-14]: top management sets broad guidelines (overall profit or sales), lower levels build the budget within those limits, and top management reviews it to prevent slack.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Budgetary slack: what it is and why it is countered&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budgetary slack&lt;/b&gt; (a budget &quot;cushion&quot;): a margin deliberately built into estimates, for example by understating revenues or overstating costs, so that actual results easily exceed the plan. [8-13, 8-14]&lt;/div&gt;
  &lt;p&gt;This is why self-imposed budgets must be &lt;b&gt;reviewed by higher levels of management&lt;/b&gt; [8-14]. The aim is a target that is &lt;i&gt;challenging but highly achievable&lt;/i&gt;. The diagram below (illustrative, not taken from the slides) shows the three zones described in [8-10] and [8-14].&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;slackR&quot;&gt;Proposed target relative to the realistic estimate&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;slackR&quot; min=&quot;-30&quot; max=&quot;30&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;slackO&quot;&gt;0%&lt;/output&gt;&lt;/div&gt;
  &lt;svg id=&quot;slackSvg&quot; viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Target zones: too low, challenging but achievable, too high&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;panel&quot; id=&quot;slackTxt&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;A sales manager knows they can sell 12,000 units but budgets 10,000, because their bonus depends on beating the budget. What are they doing?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. creating budgetary slack&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. applying top-down budgeting&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. using a continuous budget&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Understating revenues in order to beat the plan is exactly the slack described in [8-13]. The remedy is review by higher levels of management [8-14].&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Why are front-line managers&#x27; estimates often more accurate than top management&#x27;s?&lt;/summary&gt;&lt;div&gt;Because they have first-hand knowledge of customers, processes, lead times and operational problems. This is advantage no. 2 in [8-12].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the two limitations of participative budgeting?&lt;/summary&gt;&lt;div&gt;(1) Suboptimal estimates if top management&#x27;s strategic perspective is missing; (2) too much slack if the budget is used for rewards. [8-13]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section class=&quot;part&quot; id=&quot;master&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 4&lt;/span&gt;
  &lt;h2&gt;The master budget: the big picture&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-15] – [8-18]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Master budget&lt;/b&gt;: the coordinated set of the company&#x27;s budgets for the period, i.e. ten interrelated &lt;i&gt;schedules&lt;/i&gt;, starting from the &lt;span class=&quot;t&quot;&gt;sales budget&lt;/span&gt; and ending with the budgeted income statement and balance sheet. [8-15, 8-16]&lt;/div&gt;
  &lt;p&gt;The red arrow in [8-15] marks the starting point: &lt;b&gt;everything flows from the sales budget&lt;/b&gt;. Forecast sales determine how much to produce; production determines materials, labor and overhead; all cash flows feed into the &lt;span class=&quot;t&quot;&gt;cash budget&lt;/span&gt;; finally, the &lt;span class=&quot;t&quot;&gt;budgeted income statement&lt;/span&gt; and the &lt;span class=&quot;t&quot;&gt;budgeted balance sheet&lt;/span&gt; are prepared.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Click a schedule&lt;/b&gt; to see where it takes its data from, what it is used for and which of the 10 questions it answers.&lt;/p&gt;
  &lt;div class=&quot;map&quot;&gt;&lt;svg id=&quot;flow&quot; viewBox=&quot;0 0 900 470&quot; role=&quot;img&quot; aria-label=&quot;Master budget flow, clickable diagram&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;flowTxt&quot;&gt;Choose a schedule in the diagram.&lt;/div&gt;

  &lt;h3&gt;Seeing the big picture: the 10 questions&lt;/h3&gt;
  &lt;p&gt;The 10 schedules of the master budget answer 10 questions [8-16, 8-17]. Click a question to see which schedule answers it.&lt;/p&gt;
  &lt;ol class=&quot;qlist&quot; id=&quot;qlist&quot;&gt;
   &lt;li&gt;How much sales revenue will we earn? &lt;span class=&quot;ans&quot;&gt;→ Sales budget (Part 5)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much cash will we collect from customers? &lt;span class=&quot;ans&quot;&gt;→ Schedule of expected cash collections (Part 5)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much raw material will we need to purchase? &lt;span class=&quot;ans&quot;&gt;→ Direct materials budget (Part 7)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much manufacturing cost will we incur? &lt;span class=&quot;ans&quot;&gt;→ Direct materials, direct labor and manufacturing overhead budgets (Parts 7–9)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much cash will we pay to suppliers, direct labor and overhead? &lt;span class=&quot;ans&quot;&gt;→ Disbursements for materials, direct labor budget, overhead budget (Parts 7–9)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;What total cost will be released from finished goods inventory to cost of goods sold? &lt;span class=&quot;ans&quot;&gt;→ Ending finished goods inventory budget, which gives the unit cost (Part 10)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much selling and administrative expense will we incur, and how much cash will we pay for it? &lt;span class=&quot;ans&quot;&gt;→ Selling and administrative expense budget (Part 11)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much will we borrow or repay, including interest? &lt;span class=&quot;ans&quot;&gt;→ Cash budget (Part 12)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;How much operating income will we earn? &lt;span class=&quot;ans&quot;&gt;→ Budgeted income statement (Part 13)&lt;/span&gt;&lt;/li&gt;
   &lt;li&gt;What will the balance sheet look like at the end of the period? &lt;span class=&quot;ans&quot;&gt;→ Budgeted balance sheet (Part 13)&lt;/span&gt;&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;Every schedule rests on estimates and assumptions&lt;/h3&gt;
  &lt;p&gt;The master budget is based on &lt;b&gt;estimates/assumptions&lt;/b&gt; [8-18]. The sales budget, for example, requires three:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;1 · Units&lt;/h4&gt;&lt;p&gt;How many units do we expect to sell?&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;2 · Price&lt;/h4&gt;&lt;p&gt;What is the expected selling price per unit?&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;3 · Collections&lt;/h4&gt;&lt;p&gt;What percentage of &lt;span class=&quot;t&quot;&gt;accounts receivable&lt;/span&gt; will be collected in the current period and in subsequent periods?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;If an assumption changes, every schedule that depends on it changes in cascade. You can try this in the &lt;a href=&quot;#lab&quot;&gt;Lab&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;The running example: Royal Company&lt;/h3&gt;
  &lt;p&gt;Royal is preparing budgets for the &lt;b&gt;quarter ending June 30&lt;/b&gt;, with a selling price of &lt;b&gt;$10&lt;/b&gt; per unit [8-21]. Budgeted sales:&lt;/p&gt;
  &lt;svg id=&quot;salesChart&quot; viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Budgeted sales from April to August&quot;&gt;&lt;/svg&gt;
  &lt;p class=&quot;small&quot;&gt;July and August are not part of the quarter, but they are needed to calculate June&#x27;s desired ending inventories (of finished goods and of materials).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;Which schedule is the starting point for building the master budget?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. Cash budget&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. Sales budget&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. Production budget&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-15]: the sales budget is the starting point, because almost all the other schedules depend on budgeted sales volume.&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Why does the cash budget come near the end of the chain?&lt;/summary&gt;&lt;div&gt;Because it gathers the collections (from the schedule of collections) and the disbursements calculated in the materials, labor, overhead and S&amp;amp;A schedules. It can only be prepared after them [8-15].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 --&gt;
&lt;section class=&quot;part&quot; id=&quot;sales&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 5 · LEARNING OBJECTIVE 2&lt;/span&gt;
  &lt;h2&gt;Sales budget and schedule of expected cash collections&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-20] – [8-29]&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total budgeted sales = Budgeted unit sales × Selling price per unit&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tSales&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Revenue and cash receipts, however, are not the same thing: &quot;Do customers pay immediately? Usually they do not&quot; [8-22]. April&#x27;s revenue is $200,000, but only part of it is collected in April.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sales on account&lt;/b&gt; (credit sales): the customer pays after delivery. In the meantime the amount is a receivable, i.e. an &lt;span class=&quot;t&quot;&gt;accounts receivable&lt;/span&gt; (A/R). Royal collects &lt;b&gt;70%&lt;/b&gt; in the month of sale and &lt;b&gt;30%&lt;/b&gt; in the following month; the A/R balance at March 31 ($30,000) is collected in full in April. [8-23]&lt;/div&gt;
  &lt;svg id=&quot;collSvg&quot; viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;How each month&#x27;s sales turn into cash collections&quot;&gt;&lt;/svg&gt;
  &lt;h3&gt;Build the schedule step by step&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tColl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tColl&quot; data-max=&quot;5&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Next ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Collections&lt;sub&gt;month t&lt;/sub&gt; = 70% × Sales&lt;sub&gt;t&lt;/sub&gt; + 30% × Sales&lt;sub&gt;t−1&lt;/sub&gt;&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;A/R at 6/30 = 30% × June sales = &lt;b id=&quot;arEnd&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;The end-of-quarter receivable does not disappear: it will appear in the &lt;b&gt;budgeted balance sheet&lt;/b&gt; as an asset and will be collected in July. [8-29]&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;d&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 1&lt;/b&gt; [8-27]: what will total cash collections for the quarter be?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $700,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $220,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $190,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $940,000&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;30,000 + 200,000 + 500,000 + 70% × 300,000 = 940,000. Alternatively: revenue 1,000,000 + beginning A/R 30,000 − ending A/R 90,000 = 940,000. [8-28, 8-29]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;If Royal collected 60% in the month of sale and 40% in the following month, how much would it collect in May?&lt;/summary&gt;&lt;div&gt;60% × 500,000 + 40% × 200,000 = 300,000 + 80,000 = $380,000 (instead of $410,000).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why is the quarter&#x27;s revenue (1,000,000) different from its collections (940,000)?&lt;/summary&gt;&lt;div&gt;Because 30,000 of old receivables (from March) are collected, while 90,000 of June sales remain to be collected: 1,000,000 + 30,000 − 90,000 = 940,000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 --&gt;
&lt;section class=&quot;part&quot; id=&quot;production&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 6 · LEARNING OBJECTIVE 3&lt;/span&gt;
  &lt;h2&gt;Production budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-30] – [8-38]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Production budget&lt;/b&gt;: lists the number of units that must be produced to meet budgeted sales and to provide the &lt;span class=&quot;t&quot;&gt;desired ending finished goods&lt;/span&gt; inventory. It is prepared after the sales budget. [8-31]&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Required production = Budgeted sales + Desired ending inventory − Beginning inventory&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Intuition: I need enough units to &lt;b&gt;sell&lt;/b&gt; and to &lt;b&gt;leave in stock&lt;/b&gt; at the end of the month (&lt;i&gt;total needs&lt;/i&gt;). Some of them are already in inventory at the start of the month, so I subtract them.&lt;/p&gt;
  &lt;p&gt;Royal wants ending inventory equal to &lt;b&gt;20% of the following month&#x27;s sales&lt;/b&gt;; at March 31 it has &lt;b&gt;4,000 units&lt;/b&gt;. [8-32]&lt;/p&gt;
  &lt;svg id=&quot;prodSvg&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of required production&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;prodMonth&quot;&gt;Month to break down&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;prodMonth&quot; min=&quot;0&quot; max=&quot;2&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;prodMonthO&quot;&gt;April&lt;/output&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tProd&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Watch the links&lt;/b&gt; [8-34, 8-37, 8-38]: one month&#x27;s ending inventory is the next month&#x27;s beginning inventory (April ends with 10,000 and May starts with 10,000). In the &lt;i&gt;Quarter&lt;/i&gt; column, ending inventory is &lt;b&gt;June&#x27;s&lt;/b&gt; (5,000 = 20% × July&#x27;s 25,000) and beginning inventory is &lt;b&gt;April&#x27;s&lt;/b&gt; (4,000): the three months are not added together.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;What if Royal were a merchandising company?&lt;/b&gt; A &lt;i&gt;merchandising company&lt;/i&gt; buys and resells goods without transforming them: instead of a production budget it prepares a &lt;span class=&quot;t&quot;&gt;merchandise purchase budget&lt;/span&gt;, with the same logic: purchases = cost of goods sold + desired ending inventory − beginning inventory. [8-32]&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 2&lt;/b&gt; [8-35]: what is required production in May?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. 56,000 units&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. 46,000 units&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. 62,000 units&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. 52,000 units&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;50,000 sales + 6,000 ending inventory (20% × June&#x27;s 30,000) − 10,000 beginning inventory = 46,000. The 56,000 in option (a) is &lt;i&gt;total needs&lt;/i&gt;: the beginning inventory has not been subtracted. [8-36, 8-37]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Why does production for the quarter (101,000) exceed sales (100,000)?&lt;/summary&gt;&lt;div&gt;Because finished goods inventory rises from 4,000 (April 1) to 5,000 (June 30): 100,000 + 5,000 − 4,000 = 101,000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 --&gt;
&lt;section class=&quot;part&quot; id=&quot;materials&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 7 · LEARNING OBJECTIVE 4&lt;/span&gt;
  &lt;h2&gt;Direct materials budget and payments to suppliers&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-39] – [8-54]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Direct materials budget&lt;/b&gt;: shows how much &lt;span class=&quot;t&quot;&gt;raw materials&lt;/span&gt; (the direct materials that physically become part of the product) must be purchased to meet the production budget and maintain adequate inventories. It is prepared after the production budget. [8-40]&lt;/div&gt;
  &lt;p&gt;Royal data [8-41]: &lt;b&gt;5 pounds&lt;/b&gt; of material per unit; desired ending inventory equal to &lt;b&gt;10% of the following month&#x27;s production needs&lt;/b&gt;; 13,000 pounds on hand at March 31; cost &lt;b&gt;$0.40&lt;/b&gt; per pound.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Production needs = Units to produce × Materials per unit&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Materials to be purchased = Production needs + Desired ending inventory − Beginning inventory&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;It is the same logic as the production budget, moved one step further down the chain: there the starting point was &lt;i&gt;sales&lt;/i&gt;, here it is &lt;i&gt;production&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tMat&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;How is June&#x27;s ending inventory (11,500 lb) obtained?&lt;/summary&gt;&lt;div&gt;It requires &lt;b&gt;July&#x27;s&lt;/b&gt; production: July sales 25,000 + ending inventory 20% × 15,000 (August) = 3,000 − beginning inventory 5,000 = &lt;b&gt;23,000 units&lt;/b&gt;. July production needs = 23,000 × 5 = 115,000 lb, and 10% of that is 11,500 lb. The slides show only the result [8-48]; the working is reconstructed here.&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;note&quot;&gt;&quot;These are numbers of units of raw materials… not money&quot; [8-48]. The materials budget is in &lt;b&gt;pounds&lt;/b&gt;. To convert to dollars: pounds purchased × $0.40 (e.g. April 140,000 × 0.40 = $56,000) [8-51].&lt;/div&gt;

  &lt;h3&gt;Schedule of expected cash disbursements for materials&lt;/h3&gt;
  &lt;p&gt;Royal pays for &lt;b&gt;half&lt;/b&gt; of its purchases in the month of purchase and &lt;b&gt;half&lt;/b&gt; in the following month; &lt;span class=&quot;t&quot;&gt;accounts payable&lt;/span&gt; (A/P) at March 31 amount to $12,000 and are paid in April. [8-49] &lt;i&gt;Disbursement&lt;/i&gt; = cash payment.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tPay&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tPay&quot; data-max=&quot;5&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Next ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;A/P at June 30 = 50% × June purchases = &lt;b id=&quot;apEnd&quot;&gt;&lt;/b&gt; [8-54]: it will appear in the budgeted balance sheet as a liability.&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 3&lt;/b&gt; [8-45]: how much material should be purchased in May?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. 221,500 pounds&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. 240,000 pounds&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. 230,000 pounds&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. 211,500 pounds&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;230,000 (46,000 × 5) + 14,500 (10% × 29,000 × 5) − 23,000 (beginning inventory) = 221,500 lb. [8-47]&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 4&lt;/b&gt; [8-52]: what are total cash disbursements for materials in the quarter?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $185,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $68,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $56,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $201,400&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;12,000 + 56,000 + 88,600 + 50% × 56,800 = 185,000. 201,400 is the &lt;i&gt;cost&lt;/i&gt; of the quarter&#x27;s purchases: the difference (12,000 − 28,400) reflects the change in accounts payable. [8-54]&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 8 --&gt;
&lt;section class=&quot;part&quot; id=&quot;labor&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 8 · LEARNING OBJECTIVE 5&lt;/span&gt;
  &lt;h2&gt;Direct labor budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-55] – [8-60]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Direct labor budget&lt;/b&gt;: shows the &lt;span class=&quot;t&quot;&gt;direct labor-hours&lt;/span&gt; (the work of employees who physically transform the product) required by the production budget. This allows the company to plan in advance how to adjust its workforce over the year. [8-56]&lt;/div&gt;
  &lt;p&gt;Royal: &lt;b&gt;0.05 hours&lt;/b&gt; (3 minutes) per unit, unskilled labor, &lt;b&gt;$10/hour&lt;/b&gt;. [8-57]&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Labor-hours required = Units of production × Direct labor time per unit&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Total direct labor cost = Labor-hours × Hourly wage rate&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tLab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Simplifying assumption&lt;/b&gt; [8-56]: the workforce is adjusted exactly to requirements, so the cost is variable. In reality, employment policies and labor contracts often guarantee a minimum number of hours or require extra payments (overtime), in which case direct labor cost does not move in proportion to production. The slides also assume that wages are paid in the same month, so the cost equals the cash outflow.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;If the wage rate rose to $12/hour, what would direct labor cost be in May?&lt;/summary&gt;&lt;div&gt;2,300 hours × 12 = $27,600 (instead of $23,000).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the direct labor budget start from the production budget and not from the sales budget?&lt;/summary&gt;&lt;div&gt;Because labor is used to &lt;i&gt;produce&lt;/i&gt;, not to sell: hours depend on units produced (26,000, 46,000, 29,000), which differ from sales because of inventories.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 9 --&gt;
&lt;section class=&quot;part&quot; id=&quot;overhead&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 9 · LEARNING OBJECTIVE 6&lt;/span&gt;
  &lt;h2&gt;Manufacturing overhead budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-61] – [8-66]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt;: all manufacturing costs &lt;b&gt;other than&lt;/b&gt; direct materials and direct labor [8-62], such as utilities, maintenance, supervision, factory rent and depreciation.&lt;/div&gt;
  &lt;p&gt;Royal applies overhead to products on the basis of &lt;b&gt;direct labor-hours&lt;/b&gt; [8-63]:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Variable&lt;/h4&gt;&lt;p&gt;&lt;b&gt;$20 per direct labor-hour&lt;/b&gt;: it rises with hours worked.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Fixed&lt;/h4&gt;&lt;p&gt;&lt;b&gt;$50,000 per month&lt;/b&gt;, of which &lt;b&gt;$20,000 is noncash&lt;/b&gt;, mainly &lt;span class=&quot;t&quot;&gt;depreciation&lt;/span&gt; of plant and equipment.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total mfg. OH = Labor-hours × $20 + $50,000&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Cash disbursement for mfg. OH = Total mfg. OH − Noncash costs ($20,000)&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tOH&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Depreciation is a noncash charge&lt;/b&gt; [8-66]. Depreciation spreads over several years the cost of equipment that was paid for when it was purchased. It is a &lt;i&gt;cost&lt;/i&gt; of the period, which enters product cost and the income statement, but it is not a &lt;i&gt;cash outflow&lt;/i&gt; of the period. This is why it is deducted before moving to the cash budget.&lt;/div&gt;

  &lt;h3&gt;The average hourly rate: $49.70&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Predetermined OH rate = Total mfg. OH for quarter / Total labor-hours = 251,000 / 5,050 ≈ $49.70 per hour&lt;/span&gt; [8-65]&lt;/div&gt;
  &lt;p&gt;Move the slider: with more hours, the fixed portion is spread over a larger base and the average cost per hour falls. This is why a &lt;b&gt;quarterly average&lt;/b&gt; rate is used, so that unit product cost does not fluctuate from one month to the next.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ohH&quot;&gt;Direct labor-hours in the month&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ohH&quot; min=&quot;500&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1300&quot;&gt;&lt;output id=&quot;ohHO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
  &lt;svg id=&quot;ohSvg&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Total overhead, cash overhead and average rate as a function of hours&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;kpis&quot; id=&quot;ohK&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;How much cash does Royal pay for overhead in June? Explain the calculation.&lt;/summary&gt;&lt;div&gt;1,450 h × 20 = 29,000 variable + 50,000 fixed = 79,000 total − 20,000 depreciation = &lt;b&gt;$59,000&lt;/b&gt;. [8-66]&lt;/div&gt;&lt;/details&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;c&quot;&gt;&lt;p&gt;Why is $20,000 per month deducted in the overhead budget?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. because they are variable costs&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. because they are already included in direct labor&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. because depreciation does not involve a cash outflow in the period&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;[8-63, 8-66]: noncash costs do not enter the cash budget.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 10 --&gt;
&lt;section class=&quot;part&quot; id=&quot;fginv&quot; style=&quot;--h:150&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 10&lt;/span&gt;
  &lt;h2&gt;Ending finished goods inventory budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-67] – [8-71]&lt;/p&gt;
  &lt;p&gt;This schedule calculates the &lt;span class=&quot;t&quot;&gt;unit product cost&lt;/span&gt; and the value of ending finished goods inventory. It serves two purposes: &lt;span class=&quot;t&quot;&gt;cost of goods sold&lt;/span&gt; (COGS) in the income statement and inventory in the balance sheet. It answers question 6.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Unit product cost = DM (5 lb × $0.40) + DL (0.05 h × $10) + MOH (0.05 h × $49.70)&lt;/span&gt;&lt;/div&gt;
  &lt;svg id=&quot;ucSvg&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Composition of unit product cost&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tFG&quot; style=&quot;min-width:420px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Each line has its own source: materials from the &lt;i&gt;direct materials budget&lt;/i&gt; [8-67], labor from the &lt;i&gt;direct labor budget&lt;/i&gt; [8-68], the overhead rate from the &lt;i&gt;overhead budget&lt;/i&gt; [8-69], ending units from the &lt;i&gt;production budget&lt;/i&gt; [8-71]. This is the &lt;b&gt;absorption costing&lt;/b&gt; approach (product cost also includes fixed overhead), since the $49.70 rate includes the fixed portion.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;Overhead per unit is 0.05 × 49.70 = 2.485, which the slides round to &lt;b&gt;2.49&lt;/b&gt;. Unit product cost is therefore $4.99 and ending inventory is valued at 5,000 × 4.99 = &lt;b&gt;$24,950&lt;/b&gt; [8-70].&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why is overhead based on 0.05 hours (as for labor) rather than on pounds of material?&lt;/summary&gt;&lt;div&gt;Because Royal applies overhead on the basis of direct labor-hours [8-63]: each unit &quot;consumes&quot; 0.05 hours, so it absorbs 0.05 × 49.70 of overhead.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Where do the 5,000 units of ending inventory come from?&lt;/summary&gt;&lt;div&gt;From the production budget: desired inventory at the end of June = 20% × 25,000 (July sales). [8-38, 8-71]&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 11 --&gt;
&lt;section class=&quot;part&quot; id=&quot;sa&quot; style=&quot;--h:85&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 11 · LEARNING OBJECTIVE 7&lt;/span&gt;
  &lt;h2&gt;Selling and administrative expense budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-72] – [8-77]&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Selling and administrative (S&amp;amp;A) expenses&lt;/b&gt;: &lt;b&gt;nonmanufacturing&lt;/b&gt; costs, i.e. selling costs (commissions, advertising, shipping) and administrative costs (executive management, accounting, offices). They are not part of product cost: they are &lt;i&gt;period costs&lt;/i&gt; and go directly to the income statement.&lt;/div&gt;
  &lt;p&gt;Royal splits them into a variable and a fixed component [8-73]: &lt;b&gt;$0.50 per unit sold&lt;/b&gt; (based on sales, not production) plus &lt;b&gt;$70,000 per month&lt;/b&gt; fixed, of which &lt;b&gt;$10,000 is noncash&lt;/b&gt; (mainly depreciation).&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Total S&amp;amp;A = Unit sales × $0.50 + $70,000&lt;/span&gt;  ·  &lt;span class=&quot;eq&quot;&gt;Cash S&amp;amp;A = Total S&amp;amp;A − $10,000&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tSA&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;b&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 6&lt;/b&gt; [8-75]: what are the cash disbursements for S&amp;amp;A in the quarter?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $180,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $230,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $110,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $70,000&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Variable 50,000 + fixed 210,000 = 260,000 − noncash 30,000 = 230,000. [8-77]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;Do variable S&amp;amp;A expenses depend on units produced or units sold? Why does it matter?&lt;/summary&gt;&lt;div&gt;On units &lt;b&gt;sold&lt;/b&gt; (20,000, 50,000, 30,000). Selling expenses arise from sales; in the quarter 100,000 units are sold versus 101,000 produced.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 12 --&gt;
&lt;section class=&quot;part&quot; id=&quot;cash&quot; style=&quot;--h:250&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 12 · LEARNING OBJECTIVE 8&lt;/span&gt;
  &lt;h2&gt;Cash budget&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides [8-78] – [8-88]&lt;/p&gt;
  &lt;p&gt;The cash budget brings together in a single schedule all the cash flows calculated so far and shows whether and when the company will need to &lt;b&gt;borrow&lt;/b&gt; or will be able to &lt;b&gt;repay&lt;/b&gt;.&lt;/p&gt;
  &lt;h3&gt;The four sections [8-79]&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;1 · Cash receipts&lt;/h4&gt;&lt;p&gt;All cash inflows, &lt;b&gt;excluding&lt;/b&gt; those from financing.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;2 · Cash disbursements&lt;/h4&gt;&lt;p&gt;All cash payments, &lt;b&gt;excluding&lt;/b&gt; principal repayments and interest.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;3 · Excess or deficiency&lt;/h4&gt;&lt;p&gt;Cash available − disbursements: shows whether borrowing will be needed or repayment will be possible.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;4 · Financing&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Borrowings&lt;/i&gt;, &lt;i&gt;repayments&lt;/i&gt; and interest for the period.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Beginning cash + Cash collections = Total cash available&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Total cash available − Total disbursements = Excess (deficiency)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;eq&quot;&gt;Excess (deficiency) + Total financing = Ending cash balance&lt;/span&gt; → which becomes the next month&#x27;s beginning balance&lt;/div&gt;
  &lt;h3&gt;Additional information on Royal [8-80]&lt;/h3&gt;
  &lt;ul&gt;
   &lt;li&gt;a &lt;span class=&quot;t&quot;&gt;line of credit&lt;/span&gt; (the bank lends up to a ceiling, to be drawn on when needed) of &lt;b&gt;$75,000 at 16%&lt;/b&gt; per year;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;minimum cash balance: $30,000&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;borrows on the &lt;b&gt;first day of the month&lt;/b&gt; and repays on the &lt;b&gt;last day of the quarter&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;cash dividend of &lt;b&gt;$49,000 in April&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;equipment purchases of &lt;b&gt;$143,700 in May&lt;/b&gt; and &lt;b&gt;$48,300 in June&lt;/b&gt;, paid in cash;&lt;/li&gt;
   &lt;li&gt;cash on April 1: &lt;b&gt;$40,000&lt;/b&gt;.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;h3&gt;Fill in the cash budget&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tCash&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbar&quot; data-stepper=&quot;tCash&quot; data-max=&quot;6&quot;&gt;&lt;button class=&quot;btn ghost&quot; type=&quot;button&quot; data-d=&quot;-1&quot;&gt;◂ Back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Next ▸&lt;/button&gt;&lt;span class=&quot;stepmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;April&#x27;s reasoning: why $48,000 is borrowed&lt;/summary&gt;&lt;div&gt;Disbursements (228,000) exceed cash available (210,000): a deficiency of 18,000. To end the month at the minimum balance of 30,000, Royal needs 30,000 − (−18,000) = &lt;b&gt;48,000&lt;/b&gt; [8-83, 8-84]. In May the excess is 40,000, above the minimum, so nothing is borrowed, but nothing is repaid yet either, because repayment takes place at the end of the quarter.&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;June&#x27;s reasoning: repayment and interest&lt;/summary&gt;&lt;div&gt;Excess of 130,500. The 48,000 is repaid together with interest for the 3 months (April 1 – June 30):
   &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;eq&quot;&gt;Interest = $48,000 × 16% × 3/12 = $1,920&lt;/span&gt;&lt;/div&gt;
   Ending balance: 130,500 − 48,000 − 1,920 = &lt;b&gt;80,580&lt;/b&gt; [8-88]. The interest then flows into the budgeted income statement [8-89].&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;i&gt;Quarter&lt;/i&gt; column: the beginning balance is April 1&#x27;s (40,000) and the ending balance is June 30&#x27;s (80,580). Flows (collections, disbursements, financing) are added up; balances are not.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;div class=&quot;mcq&quot; data-ok=&quot;d&quot;&gt;&lt;p&gt;&lt;b&gt;Quick Check 7&lt;/b&gt; [8-86]: what is the excess (deficiency) of cash available over disbursements in June?&lt;/p&gt;
    &lt;button data-k=&quot;a&quot;&gt;a. $95,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $(21,000)&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $175,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $130,500&lt;/button&gt;
    &lt;div class=&quot;why&quot;&gt;Cash available 40,000 + 360,000 = 400,000 − disbursements 269,500 (72,700 + 14,500 + 59,000 + 75,000 + 48,300) = 130,500. [8-87, 8-88]&lt;/div&gt;&lt;/div&gt;
   &lt;details&gt;&lt;summary&gt;In which section of the cash budget does the dividend go? And the loan repayment?&lt;/summary&gt;&lt;div&gt;The dividend is a &lt;i&gt;cash disbursement&lt;/i&gt; (section 2). Repayment and interest belong in the &lt;i&gt;financing&lt;/i&gt; section (4), because section 2 explicitly excludes them [8-79].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does depreciation not appear in the cash budget?&lt;/summary&gt;&lt;div&gt;Because it has already been removed (noncash) in the overhead budget and the S&amp;amp;A budget: only &lt;i&gt;cash&lt;/i&gt; amounts (56,000, 70,000…) enter the cash budget.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 13 --&gt;
&lt;section class=&quot;part&quot; id=&quot;statements&quot; style=&quot;--h:25&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 13&lt;/span&gt;
  &lt;h2&gt;Budgeted income statement and budgeted balance sheet&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide [8-89] and diagram [8-15]. The slides stop at the introduction: the statements below are &lt;b&gt;reconstructed&lt;/b&gt; from the data in the previous schedules.&lt;/p&gt;
  &lt;p&gt;Once the cash budget is complete, Royal also knows its &lt;b&gt;interest expense&lt;/b&gt; and can prepare the budgeted income statement [8-89]. The last step is the budgeted balance sheet [8-15, 8-17 question 10].&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Budgeted income statement&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Budgeted balance sheet&lt;/button&gt;&lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot;&gt;
    &lt;p&gt;&lt;span class=&quot;badge mine&quot;&gt;reconstruction&lt;/span&gt;Absorption costing format, quarter ended June 30:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tIS&quot; style=&quot;min-width:420px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;No income taxes, as in the slides&#x27; example. COGS = units sold × unit product cost (Part 10), assuming that the 4,000 beginning units are also valued at $4.99.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;badge mine&quot;&gt;reconstruction&lt;/span&gt;The slides do not provide the opening balance sheet (at March 31), so it cannot be completed in full. It is possible, however, to state &lt;b&gt;which schedule each line item comes from&lt;/b&gt; at June 30:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;sched&quot; id=&quot;tBS&quot; style=&quot;min-width:480px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;The principle: budgeted balance sheet = opening balance sheet + effects of all the schedules for the period.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why is net income (≈ 239,000) so different from the quarter&#x27;s change in cash (+40,580)?&lt;/summary&gt;&lt;div&gt;Because accrual accounting and cash diverge: depreciation (90,000) reduces income but not cash; equipment (192,000) and dividends (49,000) reduce cash but not income; receivables, payables and inventories change. This is why &lt;i&gt;both&lt;/i&gt; the income statement &lt;i&gt;and&lt;/i&gt; the cash budget are needed.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What cash figure goes in the balance sheet at June 30, and where does it come from?&lt;/summary&gt;&lt;div&gt;$80,580, the ending balance of the cash budget [8-88].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 14 --&gt;
&lt;section class=&quot;part&quot; id=&quot;lab&quot; style=&quot;--h:35&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;PART 14 · LAB&lt;/span&gt;
  &lt;h2&gt;Change one assumption, watch everything change&lt;/h2&gt;
  &lt;p&gt;Each slider changes one assumption of the Royal case. &lt;b&gt;All the tables on the page&lt;/b&gt; are recalculated, as in a real linked master budget. The chart shows the cash budget month by month. The calculation engine follows the rules in the slides; borrowings are rounded up to the next $1,000 and, if cash in June is insufficient, the loan is only partly repaid.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lMay&quot;&gt;May sales (units)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lMay&quot; min=&quot;20000&quot; max=&quot;80000&quot; step=&quot;1000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lPrice&quot;&gt;Selling price ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lPrice&quot; min=&quot;8&quot; max=&quot;12&quot; step=&quot;0.5&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lColl&quot;&gt;% collected in the month of sale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lColl&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lFG&quot;&gt;Ending finished goods (% of next month&#x27;s sales)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lFG&quot; min=&quot;0&quot; max=&quot;0.5&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lRM&quot;&gt;Ending materials (% of next month&#x27;s needs)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lRM&quot; min=&quot;0&quot; max=&quot;0.3&quot; step=&quot;0.05&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lPay&quot;&gt;% of purchases paid in the month&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lPay&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lMin&quot;&gt;Minimum cash balance ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lMin&quot; min=&quot;10000&quot; max=&quot;80000&quot; step=&quot;5000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;labReset&quot;&gt;Restore the slide data&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;kpis&quot; id=&quot;labK&quot;&gt;&lt;/div&gt;
  &lt;svg id=&quot;labSvg&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Monthly cash budget: excess, borrowings and ending balance&quot;&gt;&lt;/svg&gt;
  &lt;p id=&quot;labMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Guided experiments&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Set the % collected in the month of sale to 100%. What happens in April?&lt;/summary&gt;&lt;div&gt;April collections rise to 230,000 (30,000 + 200,000): cash available is sufficient and April&#x27;s borrowing disappears. Income, however, does not change, because revenue is the same. Only the &lt;i&gt;timing&lt;/i&gt; of cash changes.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Raise ending finished goods inventory to 40%. Why does the borrowing requirement increase?&lt;/summary&gt;&lt;div&gt;More is produced in April (more inventory for the May peak), so more materials, labor and overhead are paid for before sales are collected. This is the financial &lt;i&gt;bottleneck&lt;/i&gt; that budgeting is meant to uncover in advance [8-6].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- Per approfondire --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--h:35&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;FURTHER READING&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The slides do not explicitly cite any authors, texts, standards or websites. The entries below come from web searches: some reconstruct the likely source of the example, others explore concepts mentioned in the slides (rolling budget, budgetary slack, participative budgeting) in more depth. Each entry is marked as an &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill), chapter &quot;Master Budgeting&quot;&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the managerial accounting textbook from which the structure and example of the slides most likely come. The &quot;8-x&quot; numbering corresponds to chapter 8, &lt;i&gt;Master Budgeting&lt;/i&gt;, in editions of &lt;i&gt;Managerial Accounting&lt;/i&gt; and &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt;, followed by &quot;Flexible Budgets and Performance Analysis&quot;. This attribution is inferred from the numbering; it is not stated in the slides.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it presents the full example, including the income statement and balance sheet that are reconstructed here, as well as worked exercises. The following chapter (flexible budgets) takes up the budget–actual comparison of the control perspective. Chapter numbering may vary between editions.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;mheducation.com — Managerial Accounting (Garrison)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;CGMA (AICPA &amp;amp; CIMA) — &quot;Rolling plans and forecasts&quot;&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a practical guide from the professional body for management accountants on rolling plans and forecasts. It draws on the CIMA Official Terminology definition of &lt;i&gt;rolling plans or budgets&lt;/i&gt;: budgets continuously updated by adding a new period as the oldest one ends.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the professional reference for the &lt;i&gt;continuous / perpetual budget&lt;/i&gt; in [8-3, 8-4], with advantages, limitations and implementation advice.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.cgma.org/resources/tools/essential-tools/rolling-plans-and-forecasts.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cgma.org — Rolling plans and forecasts&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Merchant, K. A. (1985) — &quot;Budgeting and the propensity to create budgetary slack&quot;, &lt;i&gt;Accounting, Organizations and Society&lt;/i&gt;, 10(2), 201–210&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; one of the classic empirical studies of budgetary slack, i.e. the understatement of revenues and/or overstatement of costs in the budget. It analyses the factors that lead managers to create it, including budget participation.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it provides the research basis for [8-13, 8-14] (slack and participative budgeting). I could not find a verified direct link to the article: the link below points to an open-access academic article that cites it with these bibliographic details.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://scielo.br/j/rcf/a/qh7PKcLvxWFmFy7jjLBCxVh/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scielo.br — article citing Merchant (1985)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Daumoser, Hirsch, Sohn (2018) — &quot;Honesty in budgeting: a review of morality and control aspects in the budgetary slack literature&quot;, &lt;i&gt;Journal of Management Control&lt;/i&gt;, 29(2), 115–159&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a review of research on budgetary slack in leading accounting and business ethics journals. It concludes that participative budgeting can both &lt;b&gt;create&lt;/b&gt; and &lt;b&gt;reduce&lt;/b&gt; slack, and that less slack is created under &lt;i&gt;truth-inducing&lt;/i&gt; compensation schemes.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it shows that the advantages and limitations of the self-imposed budget covered in [8-12, 8-13] are still debated and depend on how the budget is linked to rewards, which is precisely point 2 of [8-13].&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://link.springer.com/doi/10.1007/s00187-018-0267-z&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer — DOI 10.1007/s00187-018-0267-z&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
