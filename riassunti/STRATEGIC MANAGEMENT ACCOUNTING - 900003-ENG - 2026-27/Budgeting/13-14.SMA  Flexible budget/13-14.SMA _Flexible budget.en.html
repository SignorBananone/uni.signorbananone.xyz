&lt;section id=&quot;p1&quot; class=&quot;part sage&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot;&gt;Part 1&lt;/div&gt;
    &lt;h2&gt;Why the budget must become flexible&lt;/h2&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;The &lt;em&gt;budget&lt;/em&gt; is prepared &lt;b&gt;before&lt;/b&gt; the period begins &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;. During and after the period, however, it serves two different purposes: &lt;b&gt;guiding operations&lt;/b&gt; and &lt;b&gt;evaluating performance&lt;/b&gt;. To do so, it must be &quot;adjusted&quot; to what actually happened, and this is where the &lt;em class=&quot;t&quot;&gt;flexible budget&lt;/em&gt; comes in.&lt;/p&gt;

      &lt;h3&gt;The problem: a variance explains nothing on its own&lt;/h3&gt;
      &lt;p&gt;Slide 3 starts from a minimal case: budgeted sales for the quarter €200,000, actual sales €180,000, &lt;b&gt;difference = (€20,000)&lt;/b&gt;. Parentheses denote a negative amount, as is customary in financial statements. The question is: &lt;b&gt;why?&lt;/b&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lower volume?&lt;/h4&gt;&lt;p&gt;Fewer units were sold than expected, at the expected price. The problem is then a sales or market issue.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lower price?&lt;/h4&gt;&lt;p&gt;Volume was as expected, but discounts were granted. The problem lies in pricing policy.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A mix of both?&lt;/h4&gt;&lt;p&gt;The figure alone does not tell us. We need a way to &lt;b&gt;decompose&lt;/b&gt; the variance: this is exactly what the flexible budget does.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3 id=&quot;ciclo&quot;&gt;The Variance Analysis Cycle&lt;/h3&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;variance&lt;/em&gt; is the difference between an &lt;em&gt;actual&lt;/em&gt; amount and a benchmark amount (the budget). The &lt;em&gt;variance analysis cycle&lt;/em&gt; is the process through which a company uses variances to &lt;b&gt;evaluate and improve&lt;/b&gt; performance &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;. Click the stages: the cycle begins at &quot;Prepare performance report&quot;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;panel&quot;&gt;

    &lt;h3 id=&quot;mbe&quot;&gt;Management &quot;by exception&quot;&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Management by exception&lt;/b&gt;A management approach that compares &lt;b&gt;actual&lt;/b&gt; results with a &lt;b&gt;budget&lt;/b&gt;, so that significant variances stand out as &quot;exceptions&quot; and are investigated further. It is used together with the variance analysis cycle. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;The idea is to economize on managerial attention: a manager cannot investigate every line item. The slides state that the most significant variances are identified both &lt;b&gt;in absolute terms&lt;/b&gt; (amount) and &lt;b&gt;as a percentage&lt;/b&gt;. The two criteria complement each other. $2,000 on a $21,500 line item is 9%, whereas $200 on a $1,000 line item is 20%: the former has a greater impact on profit, while the latter signals an item that is &quot;out of control&quot;.&lt;/p&gt;
      &lt;p&gt;Try it below with the revenue and spending variances of Larry&#x27;s Lawn Service (we will compute them in &lt;a href=&quot;#spending&quot;&gt;Part 3&lt;/a&gt;). Set the thresholds and see which line items become exceptions.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; id=&quot;mbeBox&quot;&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;mbeAmt&quot;&gt;Amount threshold&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mbeAmt&quot; min=&quot;0&quot; max=&quot;2500&quot; step=&quot;50&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;mbeAmtO&quot;&gt;$500&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;mbePct&quot;&gt;Percentage threshold&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mbePct&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;mbePctO&quot;&gt;10%&lt;/output&gt;&lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:.4em 0&quot;&gt;&lt;span class=&quot;small&quot;&gt;Criterion:&lt;/span&gt;&lt;button class=&quot;btn&quot; data-logic=&quot;or&quot; aria-pressed=&quot;true&quot;&gt;either threshold&lt;/button&gt;&lt;button class=&quot;btn&quot; data-logic=&quot;and&quot; aria-pressed=&quot;false&quot;&gt;both thresholds&lt;/button&gt;&lt;/div&gt;
      &lt;ul class=&quot;mbe&quot; id=&quot;mbeList&quot;&gt;&lt;/ul&gt;
      &lt;p class=&quot;small&quot;&gt;Figures from Larry&#x27;s actual vs flexible budget comparison (slides 47–48). The % is computed on the flexible budget amount. The thresholds are a teaching example: the slides do not specify any values.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Note&lt;/div&gt;
      &lt;p&gt;Even a &lt;span class=&quot;fav&quot;&gt;favorable&lt;/span&gt; variance can be an exception. Larry&#x27;s $350 F on maintenance (21%) may reflect efficiency, but it may also reflect deferred maintenance that will cost more later. Management by exception looks at the &lt;b&gt;size&lt;/b&gt; of the variance, not its sign.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;check&quot;&gt;
      &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why is a budget prepared before the period not sufficient to evaluate managers?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because it is built on an assumed level of activity. If actual activity differs, the variances mix the effect of volume with the effect of management, and it becomes impossible to tell who deserves credit or blame.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;In the variance analysis cycle, which stage comes right after &quot;Identify root causes&quot;? And where does the cycle begin?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Next comes &quot;Take actions&quot;. The cycle begins (Begin) at &quot;Prepare performance report&quot;: report → analyze variances → raise questions → identify root causes → take actions → conduct next period&#x27;s operations → back to the report.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which two measures are used to decide whether a variance is an &quot;exception&quot;?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The absolute amount and the percentage relative to the benchmark. Using them together avoids ignoring small items that are badly out of control, as well as overweighting variances that are large in absolute terms but small in proportion.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p2&quot; class=&quot;part ochre&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot;&gt;Part 2 · Learning Objective 1&lt;/div&gt;
    &lt;h2&gt;Planning budget and flexible budget with a single cost driver&lt;/h2&gt;

    &lt;h3 id=&quot;static&quot;&gt;What the planning budget is (and why it is &quot;static&quot;)&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Planning budget&lt;/b&gt;Prepared &lt;b&gt;before&lt;/b&gt; the period, for a &lt;b&gt;single&lt;/b&gt; &lt;em&gt;planned level of activity&lt;/em&gt;. It is also called a &lt;em&gt;static budget&lt;/em&gt; because it does not change when volume changes. &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Flexible budget&lt;/b&gt;Estimates revenues and costs &lt;b&gt;given the actual level of activity&lt;/b&gt; for the period, taking into account how costs respond to activity. It shows what revenues and costs &lt;i&gt;should have been&lt;/i&gt; at that volume. &lt;span class=&quot;src&quot;&gt;slide 9, 31&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;The slides are unequivocal &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;: a static planning budget is suitable for &lt;b&gt;planning&lt;/b&gt;, but not for evaluating &lt;b&gt;how well costs were controlled&lt;/b&gt;. If actual activity differs from planned activity, comparing actual costs with the static budget is &lt;i&gt;misleading&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;Characteristics of the flexible budget &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;:&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;it can be prepared for &lt;b&gt;any level of activity&lt;/b&gt; within the &lt;em&gt;relevant range&lt;/em&gt;;&lt;/li&gt;
        &lt;li&gt;it shows the costs that &lt;b&gt;should have been&lt;/b&gt; incurred at the actual level of activity, so the comparison is &lt;b&gt;&quot;apples to apples&quot;&lt;/b&gt; (like-for-like quantities are compared);&lt;/li&gt;
        &lt;li&gt;it helps managers &lt;b&gt;control costs&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;it improves &lt;b&gt;performance evaluation&lt;/b&gt;.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;

    &lt;h3&gt;The Larry&#x27;s Lawn Service case&lt;/h3&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;Larry mows lawns in a neighborhood where all lawns are roughly the same size. At the end of May, Larry prepares the June budget based on &lt;b&gt;500 lawns&lt;/b&gt;. Since the lawns are similar, the chosen measure of activity is the &lt;b&gt;number of lawns mowed (Q)&lt;/b&gt;: this is the &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt;, i.e. the variable that &quot;drives&quot; costs &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;In June, however, Larry mows &lt;b&gt;550&lt;/b&gt; lawns. Browse the three tabs.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs=&quot;larry&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;lt1&quot; id=&quot;lt1b&quot;&gt;Planning budget (Q = 500)&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;lt2&quot; id=&quot;lt2b&quot;&gt;Actual results (Q = 550)&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;lt3&quot; id=&quot;lt3b&quot;&gt;Comparison with the static budget&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;lt1&quot; aria-labelledby=&quot;lt1b&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Revenue/Cost Formulas&lt;/th&gt;&lt;th&gt;Planning Budget&lt;/th&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$75Q&lt;/td&gt;&lt;td&gt;$37,500&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Gasoline and supplies&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$9Q&lt;/td&gt;&lt;td&gt;4,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment maintenance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$3Q&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop utilities&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop rent&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2,000&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Insurance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Insurance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;1,200&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td class=&quot;vhide unf&quot;&gt;200 U&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;36,550&lt;/td&gt;&lt;td&gt;32,500&lt;/td&gt;&lt;td class=&quot;vhide unf&quot;&gt;4,050 U&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$6,450&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td class=&quot;vhide fav&quot;&gt;$1,450 F&lt;/td&gt;&lt;/tr&gt;

    &lt;h3 id=&quot;limiti&quot;&gt;The limits of the static budget&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;unf&quot;&gt;Unfavorable variances…&lt;/h4&gt;&lt;p&gt;Wages +$3,500, gasoline +$600: did Larry control costs poorly? &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;fav&quot;&gt;…and favorable ones&lt;/h4&gt;&lt;p&gt;Revenue +$5,500, NOI +$1,450: so was the business managed well?&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;The slides&#x27; answer: &quot;we can&#x27;t tell yet&quot;&lt;/b&gt;The actual level of activity (550) is &lt;b&gt;higher&lt;/b&gt; than the planned level (500). Actual variable costs will therefore probably be higher than planned, &lt;b&gt;regardless&lt;/b&gt; of Larry&#x27;s efficiency. &lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;The right question (slide 27)&lt;/span&gt;&quot;How much of the cost variances is due to &lt;b&gt;higher activity&lt;/b&gt;, and how much to &lt;b&gt;cost control&lt;/b&gt;?&quot;&lt;/div&gt;
    &lt;p class=&quot;prose&quot;&gt;To answer it, the planning budget must be &lt;em class=&quot;t&quot;&gt;flexed&lt;/em&gt;, that is, recalculated at the actual level of activity.&lt;/p&gt;

    &lt;h3 id=&quot;cost-behavior&quot;&gt;How a flexible budget works: cost behavior&lt;/h3&gt;
    &lt;div class=&quot;prose&quot;&gt;&lt;p&gt;To flex a budget, you need to know two things &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;:&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Total variable costs&lt;/h4&gt;&lt;p&gt;They change &lt;b&gt;in direct proportion&lt;/b&gt; to activity. Example: gasoline at $9 per lawn → 500 lawns = $4,500, 550 lawns = $4,950. The cost per unit is constant, while the total increases.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Total fixed costs&lt;/h4&gt;&lt;p&gt;They remain &lt;b&gt;unchanged&lt;/b&gt; within the relevant range. Example: rent is $2,000 with both 500 and 550 lawns.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;div class=&quot;lab&quot;&gt;What the slides take for granted&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cost formula.&lt;/b&gt; Each line item is written as &lt;span class=&quot;mono&quot;&gt;Cost = a + b·Q&lt;/span&gt;, where &lt;i&gt;a&lt;/i&gt; is the fixed cost per period and &lt;i&gt;b&lt;/i&gt; is the variable cost per unit of the driver. If &lt;i&gt;a&lt;/i&gt; = 0, the cost is purely variable (gasoline &lt;span class=&quot;mono&quot;&gt;$9Q&lt;/span&gt;); if &lt;i&gt;b&lt;/i&gt; = 0, it is purely fixed (rent &lt;span class=&quot;mono&quot;&gt;$2,000&lt;/span&gt;). If both are present, it is a &lt;em&gt;mixed cost&lt;/em&gt;: wages &lt;span class=&quot;mono&quot;&gt;$5,000 + $30Q&lt;/span&gt; combine fixed salaries with pay per lawn.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Relevant range.&lt;/b&gt; The range of activity within which these assumptions hold. Beyond a certain threshold, Larry would need to buy a second mower or rent a larger shed: &quot;fixed&quot; costs would jump to a new level and the formulas would no longer apply.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Net operating income (NOI).&lt;/b&gt; Operating income, i.e. revenue minus all operating expenses. For Larry: total fixed costs = 5,000 + 1,000 + 2,000 + 2,500 + 1,000 = &lt;b&gt;$11,500&lt;/b&gt;; variable cost per lawn = 30 + 9 + 3 = &lt;b&gt;$42&lt;/b&gt;; therefore &lt;span class=&quot;mono&quot;&gt;NOI = 75Q − 42Q − 11,500 = 33Q − 11,500&lt;/span&gt;. The $33 is the &lt;em&gt;contribution margin&lt;/em&gt; per lawn (selling price minus unit variable costs).&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3 id=&quot;flex&quot;&gt;The flexible budget in action&lt;/h3&gt;
    &lt;p class=&quot;prose&quot;&gt;Move the slider. The &lt;b&gt;static budget&lt;/b&gt; remains a fixed point at Q = 500. The &lt;b&gt;flexible budget&lt;/b&gt;, by contrast, is a line: for each Q, it tells you what revenue and spending should have been. The formulas are the same as in the planning budget; only Q changes.&lt;/p&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;qS&quot;&gt;Lawns mowed (Q)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qS&quot; min=&quot;300&quot; max=&quot;700&quot; step=&quot;10&quot; value=&quot;550&quot;&gt;&lt;output id=&quot;qO&quot;&gt;550&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 320&quot; id=&quot;flexChart&quot; role=&quot;img&quot; aria-label=&quot;Chart of revenue and costs as a function of Q&quot;&gt;
        &lt;g id=&quot;fcGrid&quot; style=&quot;stroke:var(--rule);stroke-width:1&quot;&gt;&lt;/g&gt;
        &lt;g id=&quot;fcAxis&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;&lt;/g&gt;
        &lt;rect id=&quot;fcStaticBand&quot; style=&quot;fill:var(--ochre-bg)&quot;&gt;&lt;/rect&gt;
        &lt;path id=&quot;fcFixed&quot; style=&quot;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none&quot;/&gt;
        &lt;path id=&quot;fcCost&quot; style=&quot;stroke:var(--brick);stroke-width:3;fill:none&quot;/&gt;
        &lt;path id=&quot;fcRev&quot; style=&quot;stroke:var(--sage);stroke-width:3;fill:none&quot;/&gt;
        &lt;line id=&quot;fcStaticCost&quot; style=&quot;stroke:var(--ochre);stroke-width:2;stroke-dasharray:2 4&quot;/&gt;
        &lt;line id=&quot;fcQ&quot; style=&quot;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3&quot;/&gt;
        &lt;circle id=&quot;fcPlanR&quot; r=&quot;5&quot; style=&quot;fill:var(--paper);stroke:var(--sage);stroke-width:2&quot;/&gt;
        &lt;circle id=&quot;fcPlanC&quot; r=&quot;5&quot; style=&quot;fill:var(--paper);stroke:var(--brick);stroke-width:2&quot;/&gt;
        &lt;circle id=&quot;fcDotR&quot; r=&quot;6&quot; style=&quot;fill:var(--sage)&quot;/&gt;
        &lt;circle id=&quot;fcDotC&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;
        &lt;g style=&quot;font-size:12px;font-weight:600&quot;&gt;
          &lt;text id=&quot;fcLR&quot; style=&quot;fill:var(--sage)&quot;&gt;Revenue = 75Q&lt;/text&gt;
          &lt;text id=&quot;fcLC&quot; style=&quot;fill:var(--brick)&quot;&gt;Total cost = 11,500 + 42Q&lt;/text&gt;
          &lt;text id=&quot;fcLF&quot; style=&quot;fill:var(--muted)&quot;&gt;Fixed = 11,500&lt;/text&gt;
          &lt;text id=&quot;fcLS&quot; style=&quot;fill:var(--ochre)&quot;&gt;static budget costs: 32,500 (they do not move)&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;kpis&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Revenue (flex)&lt;/span&gt;&lt;b id=&quot;kRev&quot;&gt;&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Total expenses (flex)&lt;/span&gt;&lt;b id=&quot;kCost&quot;&gt;&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;NOI (flex)&lt;/span&gt;&lt;b id=&quot;kNoi&quot;&gt;&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Activity variance on NOI&lt;/span&gt;&lt;b id=&quot;kAct&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot; id=&quot;flexTbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;The 300–700 relevant range is a teaching assumption: the slides do not specify it. Hollow circles = planning budget (Q = 500), filled circles = flexible budget at the selected Q.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p class=&quot;prose&quot;&gt;At Q = 550 you obtain the flexible budget shown in the slides &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;: revenue &lt;b&gt;$41,250&lt;/b&gt; (75 × 550), total expenses &lt;b&gt;$34,600&lt;/b&gt;, NOI &lt;b&gt;$6,650&lt;/b&gt;. Given the actual number of lawns, profit &lt;b&gt;should have been&lt;/b&gt; $6,650, but it was $6,450. Where do these differences come from? We examine this in Part 3.&lt;/p&gt;

    &lt;div class=&quot;panel quiz&quot; data-answer=&quot;c&quot;&gt;
      &lt;b&gt;Quick Check 1&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 29–30&lt;/span&gt;
      &lt;p&gt;What should wages and salaries be in a flexible budget for &lt;b&gt;600 lawns&lt;/b&gt;?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;a. $18,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $20,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $23,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;d. $25,000&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot; data-ok=&quot;Correct: $5,000 + ($30 × 600) = $5,000 + $18,000 = $23,000.&quot; data-ko=&quot;No. Use the formula $5,000 + $30Q, without forgetting the fixed component.&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;check&quot;&gt;
      &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Larry has a $600 U variance on gasoline relative to the static budget. Does this mean fuel was wasted?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Not necessarily. With 50 more lawns, the fuel cost that &quot;should&quot; have been incurred rises by 9 × 50 = $450. Only $150 (5,100 − 4,950) actually reflects how the money was spent.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What do the planning budget and the flexible budget have in common, and what distinguishes them?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The revenue and cost &lt;b&gt;formulas&lt;/b&gt; are identical. What changes is the &lt;b&gt;level of activity&lt;/b&gt; to which they are applied: the planned level (500) versus the actual level (550). The flexible budget is prepared at the end of the period, once Q is known.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Compute wages and salaries and NOI in the flexible budget for 450 lawns.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Wages = 5,000 + 30 × 450 = &lt;b&gt;$18,500&lt;/b&gt;. NOI = 33 × 450 − 11,500 = &lt;b&gt;$3,350&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why is the flexible budget valid only within the relevant range?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because outside that range, fixed costs change in steps (new equipment, space, staff) and unit variable costs may also change. The cost formulas no longer describe reality.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p3&quot; class=&quot;part slate&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot;&gt;Part 3 · Learning Objectives 2, 3, 4&lt;/div&gt;
    &lt;h2&gt;Activity variances, revenue and spending variances, performance report&lt;/h2&gt;
    &lt;p class=&quot;prose&quot;&gt;The flexible budget sits &lt;b&gt;between&lt;/b&gt; the planning budget and the actual results, and splits the total variance into two parts that answer two different questions.&lt;/p&gt;
    &lt;figure class=&quot;panel&quot;&gt;

    &lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre);stroke-width:1.5&quot;/&gt;

    &lt;path d=&quot;M100,88 Q100,118 222,118 Q345,118 345,88&quot; style=&quot;stroke:var(--slate)&quot;/&gt;

    &lt;text x=&quot;222&quot; y=&quot;142&quot; style=&quot;fill:var(--slate)&quot;&gt;Revenue &amp;amp; spending variances&lt;/text&gt;
    &lt;text x=&quot;222&quot; y=&quot;160&quot; style=&quot;font-weight:400;fill:var(--muted)&quot;&gt;&quot;How well did we manage?&quot;&lt;/text&gt;
    &lt;text x=&quot;478&quot; y=&quot;142&quot; style=&quot;fill:var(--sage)&quot;&gt;Activity variances&lt;/text&gt;
    &lt;text x=&quot;478&quot; y=&quot;160&quot; style=&quot;font-weight:400;fill:var(--muted)&quot;&gt;&quot;What was the effect of volume?&quot;&lt;/text&gt;

    &lt;/figure&gt;

    &lt;h3 id=&quot;activity&quot;&gt;Activity variances &lt;span class=&quot;src&quot;&gt;LO2 · slide 33–38&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Activity variance&lt;/b&gt;The variance that arises &lt;b&gt;solely&lt;/b&gt; from the difference between the actual level of activity and the level assumed in the planning budget. It answers the question: &quot;What impact did the change in activity have on revenues, costs and profit?&quot;&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Formula&lt;/span&gt;Activity variance = Flexible budget − Planning budget&lt;/div&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;The &lt;b&gt;flexible budget&lt;/b&gt; shows what should have happened at the &lt;i&gt;actual&lt;/i&gt; level of activity; the &lt;b&gt;planning budget&lt;/b&gt; shows what should have happened at the &lt;i&gt;planned&lt;/i&gt; level. Both use the formulas, so their difference is purely a consequence of volume and &lt;b&gt;says nothing&lt;/b&gt; about the manager&#x27;s skill.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Formula&lt;/th&gt;&lt;th&gt;Flexible (550)&lt;/th&gt;&lt;th&gt;Planning (500)&lt;/th&gt;&lt;th&gt;Activity Variances&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$75Q&lt;/td&gt;&lt;td&gt;$41,250&lt;/td&gt;&lt;td&gt;$37,500&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$3,750 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Wages and salaries&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$5,000 + $30Q&lt;/td&gt;&lt;td&gt;$21,500&lt;/td&gt;&lt;td&gt;$20,000&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$1,500 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Gasoline and supplies&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$9Q&lt;/td&gt;&lt;td&gt;4,950&lt;/td&gt;&lt;td&gt;4,500&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;450 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment maintenance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$3Q&lt;/td&gt;&lt;td&gt;1,650&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;150 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Utilities · Rent · Depreciation · Insurance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;fixed&lt;/td&gt;&lt;td&gt;6,500&lt;/td&gt;&lt;td&gt;6,500&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;34,600&lt;/td&gt;&lt;td&gt;32,500&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;2,100 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$6,650&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$1,650 F&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shortcut&lt;/h4&gt;&lt;p&gt;Each activity variance = &lt;b&gt;ΔQ × variable component of the formula&lt;/b&gt;. Revenue: 50 × $75 = $3,750 F. Wages: 50 × $30 = $1,500 U &lt;span class=&quot;src&quot;&gt;slide 56&lt;/span&gt;. The U variances on costs are &quot;good&quot; here: they mean more work was done.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fixed costs → zero activity variance&lt;/h4&gt;&lt;p&gt;Within the relevant range, fixed costs do not depend on Q, so the flexible and planning budgets coincide.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The leverage effect of fixed costs&lt;/h4&gt;&lt;p&gt;Activity and revenue grow by &lt;b&gt;10%&lt;/b&gt;, while NOI grows by &lt;b&gt;33%&lt;/b&gt; (1,650 / 5,000), precisely because of fixed costs &lt;span class=&quot;src&quot;&gt;slide 37&lt;/span&gt;. Each additional lawn brings in $33 of contribution margin, while fixed costs remain at $11,500. Textbooks call this effect &lt;em&gt;operating leverage&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Exercise · Jake&#x27;s Roof Repair &lt;span class=&quot;src&quot;&gt;slide 39–41&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Cost driver: &lt;b&gt;repair-hours&lt;/b&gt; (q). 2,800 hours were planned for May; &lt;b&gt;2,900&lt;/b&gt; were worked. Expected revenue is $44.50 per hour. Compute the activity variances.&lt;/p&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Fixed Cost per Month&lt;/th&gt;&lt;th&gt;Cost per Repair-Hour&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Wages and salaries&lt;/td&gt;&lt;td&gt;$23,200&lt;/td&gt;&lt;td&gt;$16.30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Parts and supplies&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$8.60&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Equipment depreciation&lt;/td&gt;&lt;td&gt;$1,600&lt;/td&gt;&lt;td&gt;$0.40&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Truck operating expenses&lt;/td&gt;&lt;td&gt;$6,400&lt;/td&gt;&lt;td&gt;$1.70&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td&gt;$3,480&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Administrative expenses&lt;/td&gt;&lt;td&gt;$4,500&lt;/td&gt;&lt;td&gt;$0.80&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;quiz&quot; data-answer=&quot;b&quot;&gt;
        &lt;p&gt;&lt;b&gt;Try it:&lt;/b&gt; what is the activity variance for revenue?&lt;/p&gt;
        &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;a. $4,450 U&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $4,450 F&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $1,670 F&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot; data-ok=&quot;Yes: 100 hours × $44.50 = $4,450 F (129,050 − 124,600).&quot; data-ko=&quot;Try again: for revenue, more activity means more revenue (F). $1,670 is the NOI variance.&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;details&gt;&lt;summary&gt;Show the full solution&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
          &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Flexible (2,900)&lt;/th&gt;&lt;th&gt;Planning (2,800)&lt;/th&gt;&lt;th&gt;Activity Var.&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Revenue ($44.50q)&lt;/td&gt;&lt;td&gt;$129,050&lt;/td&gt;&lt;td&gt;$124,600&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$4,450 F&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Wages ($23,200 + $16.30q)&lt;/td&gt;&lt;td&gt;70,470&lt;/td&gt;&lt;td&gt;68,840&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;1,630 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Parts and supplies ($8.60q)&lt;/td&gt;&lt;td&gt;24,940&lt;/td&gt;&lt;td&gt;24,080&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;860 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Depreciation ($1,600 + $0.40q)&lt;/td&gt;&lt;td&gt;2,760&lt;/td&gt;&lt;td&gt;2,720&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;40 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Truck ($6,400 + $1.70q)&lt;/td&gt;&lt;td&gt;11,330&lt;/td&gt;&lt;td&gt;11,160&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;170 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Rent ($3,480)&lt;/td&gt;&lt;td&gt;3,480&lt;/td&gt;&lt;td&gt;3,480&lt;/td&gt;&lt;td&gt;0 (None)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Administrative ($4,500 + $0.80q)&lt;/td&gt;&lt;td&gt;6,820&lt;/td&gt;&lt;td&gt;6,740&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;80 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;119,800&lt;/td&gt;&lt;td&gt;117,020&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;2,780 U&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;$9,250&lt;/td&gt;&lt;td&gt;$7,580&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$1,670 F&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;p&gt;Quick check: variable cost per hour = 16.30 + 8.60 + 0.40 + 1.70 + 0.80 = $27.80; margin per hour = 44.50 − 27.80 = $16.70; 100 hours × 16.70 = &lt;b&gt;$1,670 F&lt;/b&gt;. Note that here depreciation also has a variable component.&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;h3 id=&quot;spending&quot;&gt;Revenue and spending variances &lt;span class=&quot;src&quot;&gt;LO3 · slide 42–48&lt;/span&gt;&lt;/h3&gt;
    &lt;p class=&quot;prose&quot;&gt;Guiding question: &quot;How well did we control revenues, costs and profit?&quot; The comparison is now between &lt;b&gt;actual&lt;/b&gt; results and the &lt;b&gt;flexible budget&lt;/b&gt;: the same Q on both sides, so the volume effect is eliminated.&lt;/p&gt;
    &lt;figure class=&quot;panel&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Key terminology: revenue variance and spending variance&quot;&gt;

    &lt;rect x=&quot;380&quot; y=&quot;10&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;Flexible budget revenue&lt;/text&gt;
    &lt;rect x=&quot;150&quot; y=&quot;80&quot; width=&quot;340&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-weight:700&quot;&gt;difference = revenue variance&lt;/text&gt;
    &lt;rect x=&quot;20&quot; y=&quot;135&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;6&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot;&gt;Actual cost&lt;/text&gt;
    &lt;rect x=&quot;380&quot; y=&quot;135&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;6&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot;&gt;Flexible budget cost&lt;/text&gt;
    &lt;rect x=&quot;150&quot; y=&quot;205&quot; width=&quot;340&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--card);stroke:var(--ink)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;231&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:700&quot;&gt;difference = spending variance&lt;/text&gt;
  &lt;/g&gt;
  &lt;g style=&quot;fill:none;stroke:var(--ink);stroke-width:1.5&quot;&gt;&lt;path d=&quot;M140,54 V66 H500 V54 M320,66 V78&quot;/&gt;&lt;path d=&quot;M140,179 V191 H500 V179 M320,191 V203&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
      &lt;figcaption&gt;Redrawn from slide 43 (Key Terminology).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Revenue variance&lt;/b&gt;Actual revenue − flexible budget revenue. &lt;span class=&quot;fav&quot;&gt;Favorable&lt;/span&gt; if actual revenue exceeds what it &quot;should have been&quot;, &lt;span class=&quot;unf&quot;&gt;unfavorable&lt;/span&gt; if it is lower. With a single driver, this amounts to saying that the &lt;b&gt;average selling price&lt;/b&gt; was higher (F) or lower (U) than expected. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Spending variance&lt;/b&gt;Actual cost − flexible budget cost. &lt;span class=&quot;unf&quot;&gt;Unfavorable&lt;/span&gt; if the actual cost exceeds what it &quot;should have been&quot;, &lt;span class=&quot;fav&quot;&gt;favorable&lt;/span&gt; if it is lower. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Formula&lt;/th&gt;&lt;th&gt;Actual (550)&lt;/th&gt;&lt;th&gt;Flexible (550)&lt;/th&gt;&lt;th&gt;Revenue &amp;amp; Spending Var.&lt;/th&gt;&lt;/tr&gt;

      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Gasoline and supplies&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$9Q&lt;/td&gt;&lt;td&gt;5,100&lt;/td&gt;&lt;td&gt;4,950&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;150 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment maintenance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$3Q&lt;/td&gt;&lt;td&gt;1,300&lt;/td&gt;&lt;td&gt;1,650&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;350 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop utilities&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;950&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;50 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop rent&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2,000&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment depreciation&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2,500&lt;/td&gt;&lt;td&gt;2,500&lt;/td&gt;&lt;td&gt;2,500&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;

    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;div class=&quot;lab&quot;&gt;How to read these figures (beyond the slides)&lt;/div&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Revenue $1,750 F&lt;/b&gt;: average actual price = 43,000 / 550 ≈ &lt;b&gt;$78.18&lt;/b&gt; per lawn, versus the expected $75.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Wages $2,000 U&lt;/b&gt;: this is the truly critical item. At the actual volume, wages should have been $21,500. The possible causes (overtime, higher pay rates, slower work) should be investigated through the variance analysis cycle.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Insurance $200 U&lt;/b&gt;: even a &lt;b&gt;fixed&lt;/b&gt; cost can have a spending variance (for example, an increased premium), even though it never has an activity variance.&lt;/li&gt;
        &lt;li&gt;A spending variance combines two effects: the &lt;b&gt;price&lt;/b&gt; paid for resources and the &lt;b&gt;quantity&lt;/b&gt; used. Separating them requires &lt;em&gt;standard costs&lt;/em&gt;, the topic that immediately follows this chapter in the McGraw Hill textbook cited &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/li&gt;
      &lt;/ul&gt;

    &lt;h3 id=&quot;report&quot;&gt;The performance report that brings it all together &lt;span class=&quot;src&quot;&gt;LO4 · slide 49–59&lt;/span&gt;&lt;/h3&gt;
    &lt;p class=&quot;prose&quot;&gt;The &lt;em class=&quot;t&quot;&gt;flexible budget performance report&lt;/em&gt; lines up three columns, (1) Actual, (2) Flexible and (3) Planning, with the two families of variances between them. &lt;b&gt;Click a row&lt;/b&gt; to see how the variance from the static budget breaks down.&lt;/p&gt;

    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; id=&quot;decBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;figure class=&quot;panel&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 300&quot; role=&quot;img&quot; aria-label=&quot;Net operating income bridge from planning to actual&quot;&gt;
  &lt;line x1=&quot;40&quot; y1=&quot;250&quot; x2=&quot;680&quot; y2=&quot;250&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
  &lt;g style=&quot;stroke:var(--rule);stroke-dasharray:3 3&quot;&gt;&lt;line x1=&quot;150&quot; y1=&quot;103&quot; x2=&quot;190&quot; y2=&quot;103&quot;/&gt;&lt;line x1=&quot;280&quot; y1=&quot;55&quot; x2=&quot;320&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;410&quot; y1=&quot;55&quot; x2=&quot;450&quot; y2=&quot;55&quot;/&gt;&lt;line x1=&quot;540&quot; y1=&quot;61&quot; x2=&quot;580&quot; y2=&quot;61&quot;/&gt;&lt;/g&gt;
  &lt;rect x=&quot;60&quot; y=&quot;103&quot; width=&quot;90&quot; height=&quot;147&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre);stroke-width:1.5&quot;/&gt;
  &lt;rect x=&quot;190&quot; y=&quot;55&quot; width=&quot;90&quot; height=&quot;48&quot; style=&quot;fill:var(--sage)&quot;/&gt;
  &lt;rect x=&quot;320&quot; y=&quot;55&quot; width=&quot;90&quot; height=&quot;195&quot; style=&quot;fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5&quot;/&gt;

  &lt;/g&gt;
  &lt;g text-anchor=&quot;middle&quot; style=&quot;font-size:12px;fill:var(--muted)&quot;&gt;
    &lt;text x=&quot;105&quot; y=&quot;268&quot;&gt;Planning&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;283&quot;&gt;budget&lt;/text&gt;
    &lt;text x=&quot;235&quot; y=&quot;268&quot;&gt;Activity&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;283&quot;&gt;variance&lt;/text&gt;
    &lt;text x=&quot;365&quot; y=&quot;268&quot;&gt;Flexible&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;283&quot;&gt;budget&lt;/text&gt;
    &lt;text x=&quot;495&quot; y=&quot;268&quot;&gt;Rev. &amp;amp; spending&lt;/text&gt;&lt;text x=&quot;495&quot; y=&quot;283&quot;&gt;variances&lt;/text&gt;
    &lt;text x=&quot;625&quot; y=&quot;268&quot;&gt;Actual&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;283&quot;&gt;results&lt;/text&gt;
