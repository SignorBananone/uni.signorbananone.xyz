      &lt;figcaption&gt;Larry&#x27;s net operating income: from the static budget to the actual result. The &quot;static&quot; variance of $1,450 F = $1,650 F from volume − $200 U from management. The scale starts at $0 and bar heights are proportional.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;The verdict on Larry&lt;/b&gt;The increase in NOI over budget (+$1,450) is &lt;b&gt;not&lt;/b&gt; the result of cost management. It comes entirely from volume (+$1,650), and management actually took away $200: better prices (+$1,750) did not offset the over-budget wages (−$2,000), fuel and insurance.&lt;/div&gt;

    &lt;div class=&quot;check&quot;&gt;
      &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What is the activity variance for fixed costs? And is their spending variance always zero?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The activity variance is zero (within the relevant range). The spending variance is &lt;b&gt;not&lt;/b&gt;: Larry spent $1,200 on insurance versus $1,000 (200 U) and $950 on utilities versus $1,000 (50 F).&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;If Larry had mowed 480 lawns, what would the NOI activity variance have been?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;ΔQ = −20; −20 × $33 = &lt;b&gt;$660 U&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Break down the static variance for wages ($3,500 U).&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Activity: 50 × $30 = $1,500 U (flex 21,500 − planning 20,000). Spending: 23,500 − 21,500 = $2,000 U. Total $3,500 U.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;An unfavorable spending variance on gasoline: what two different causes might it conceal?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;A higher fuel &lt;b&gt;price&lt;/b&gt; (price effect) or &lt;b&gt;more fuel&lt;/b&gt; used per lawn (quantity/efficiency effect). The performance report does not distinguish between them: this requires root cause analysis or a standard cost system.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p4&quot; class=&quot;part brick&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot;&gt;Part 4 · Learning Objectives 5, 6&lt;/div&gt;
    &lt;h2 id=&quot;multi&quot;&gt;Budgets and performance reports with multiple cost drivers&lt;/h2&gt;
    &lt;div class=&quot;prose&quot;&gt;
      &lt;p&gt;A single cost driver may not be enough to explain &lt;b&gt;all&lt;/b&gt; of an organization&#x27;s costs. The cost formulas of the flexible budget can be extended to recognize &lt;b&gt;multiple drivers&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 61&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Larry notices that the time spent on &lt;i&gt;edging and trimming&lt;/i&gt; varies considerably from lawn to lawn, and therefore adds a second driver, &lt;b&gt;edging/trimming hours (H)&lt;/b&gt;, to both the revenue and the cost formulas &lt;span class=&quot;src&quot;&gt;slide 62&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;General form of a cost formula with two drivers&lt;/span&gt;Cost = a + b₁·Q + b₂·H&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Two-driver flexible budget calculator&lt;/h4&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;mQ&quot;&gt;Lawns (Q)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mQ&quot; min=&quot;400&quot; max=&quot;700&quot; step=&quot;10&quot; value=&quot;550&quot;&gt;&lt;output id=&quot;mQO&quot;&gt;550&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;mH&quot;&gt;Edging/trimming hours (H)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mH&quot; min=&quot;0&quot; max=&quot;250&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;mHO&quot;&gt;100&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot; id=&quot;multiTbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Planning budget from the slides: Q = 500, H = 100 → NOI $5,700 &lt;span class=&quot;src&quot;&gt;slide 63&lt;/span&gt;. Flexible budget: Q = 550, H = 100 → NOI $7,500 &lt;span class=&quot;src&quot;&gt;slide 64&lt;/span&gt;. Revenue per hour ($25H) and wage cost per hour ($25H) offset each other: as currently priced, edging hours generate no margin and only consume fuel and maintenance (6 + 2 = $8/hour).&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;The performance report with two drivers &lt;span class=&quot;src&quot;&gt;LO6 · slide 66&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Formula&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Rev. &amp;amp; Spending&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th&gt;Activity&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Number of lawns (Q)&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;&lt;/td&gt;&lt;td&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Number of hours (H)&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$75Q + $25H&lt;/td&gt;&lt;td&gt;$43,000&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$750 U&lt;/td&gt;&lt;td&gt;$43,750&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$3,750 F&lt;/td&gt;&lt;td&gt;$40,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Wages and salaries&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$5,000 + $29Q + $25H&lt;/td&gt;&lt;td&gt;$23,500&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$50 U&lt;/td&gt;&lt;td&gt;$23,450&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$1,450 U&lt;/td&gt;&lt;td&gt;$22,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Gasoline and supplies&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$8Q + $6H&lt;/td&gt;&lt;td&gt;5,100&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;100 U&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;400 U&lt;/td&gt;&lt;td&gt;4,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment maintenance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2Q + $2H&lt;/td&gt;&lt;td&gt;1,300&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;1,300&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;100 U&lt;/td&gt;&lt;td&gt;1,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop utilities&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;950&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;50 F&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Office and shop rent&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2,000&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Equipment depreciation&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$2,500&lt;/td&gt;&lt;td&gt;2,500&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;2,500&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;2,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Insurance&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;$1,000&lt;/td&gt;&lt;td&gt;1,200&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;200 U&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;36,550&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;300 U&lt;/td&gt;&lt;td&gt;36,250&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;1,950 U&lt;/td&gt;&lt;td&gt;34,300&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$6,450&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$1,150 U&lt;/td&gt;&lt;td&gt;$7,500&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$1,800 F&lt;/td&gt;&lt;td&gt;$5,700&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;

    &lt;h4&gt;Same actual results, different diagnosis&lt;/h4&gt;
    &lt;p class=&quot;prose&quot;&gt;Compare the two versions of the report. The actual results are identical, but what &quot;should have been&quot; changes, and with it the assessment of management:&lt;/p&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
      &lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;1 driver (Q)&lt;/th&gt;&lt;th&gt;2 drivers (Q, H)&lt;/th&gt;&lt;th&gt;What changes&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenue variance&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$1,750 F&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$750 U&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;With 100 edging hours, revenue should have been $43,750: Larry &lt;b&gt;collected less&lt;/b&gt; than expected.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Wages spending&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$2,000 U&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$50 U&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Most of the &quot;excess&quot; wages reflected edging work, which the formula now recognizes.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Equipment maintenance&lt;/td&gt;&lt;td class=&quot;fav&quot;&gt;$350 F&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Exactly in line with what it should have been.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;NOI rev. &amp;amp; spending&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$200 U&lt;/td&gt;&lt;td class=&quot;unf&quot;&gt;$1,150 U&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;The problem shifts from costs to &lt;b&gt;prices&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Methodological lesson&lt;/div&gt;&lt;p&gt;A flexible budget is only as good as its formulas. With an inadequate driver, part of the volume effect ends up in the spending variances, and the wrong person is blamed for the wrong problem. Multiple drivers require more data collection, but they make the comparison truly &quot;apples to apples&quot;.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Exercise · Alyeski Tours &lt;span class=&quot;src&quot;&gt;slide 67–70&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Boat tours of coastal glaciers in Alaska (the boat &lt;i&gt;Blue Glacier&lt;/i&gt;, max. 89 passengers). Two drivers: &lt;b&gt;number of cruises&lt;/b&gt; and &lt;b&gt;number of passengers&lt;/b&gt;. Average revenue is $30 per passenger. In July: &lt;b&gt;59 cruises, 3,150 passengers&lt;/b&gt;. Prepare the flexible budget.&lt;/p&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Fixed per Month&lt;/th&gt;&lt;th&gt;per Cruise&lt;/th&gt;&lt;th&gt;per Passenger&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Vessel operating costs&lt;/td&gt;&lt;td&gt;$6,200&lt;/td&gt;&lt;td&gt;$475.00&lt;/td&gt;&lt;td&gt;$3.50&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Advertising&lt;/td&gt;&lt;td&gt;$2,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Administrative costs&lt;/td&gt;&lt;td&gt;$5,400&lt;/td&gt;&lt;td&gt;$37.00&lt;/td&gt;&lt;td&gt;$1.50&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Insurance&lt;/td&gt;&lt;td&gt;$3,100&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;quiz&quot; data-answer=&quot;a&quot;&gt;
        &lt;p&gt;&lt;b&gt;Try it:&lt;/b&gt; what are vessel operating costs in the July flexible budget?&lt;/p&gt;
        &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;a. $45,250&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;b. $39,050&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;c. $28,025&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot; data-ok=&quot;Correct: 6,200 + 475 × 59 + 3.50 × 3,150 = 6,200 + 28,025 + 11,025 = $45,250.&quot; data-ko=&quot;Remember all three components: fixed, per cruise and per passenger.&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;details&gt;&lt;summary&gt;Show the full solution&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;fin&quot;&gt;
          &lt;tr&gt;&lt;th&gt;Alyeski Tours · Flexible Budget · July&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;30 × 3,150&lt;/td&gt;&lt;td&gt;$94,500&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Vessel operating costs&lt;/td&gt;&lt;td&gt;6,200 + 28,025 + 11,025&lt;/td&gt;&lt;td&gt;45,250&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Advertising&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Administrative costs&lt;/td&gt;&lt;td&gt;5,400 + 37 × 59 + 1.50 × 3,150 = 5,400 + 2,183 + 4,725&lt;/td&gt;&lt;td&gt;12,308&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;ind&quot;&gt;Insurance&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;td&gt;3,100&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;62,658&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$31,842&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;check&quot;&gt;
      &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why does Larry add a second cost driver?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because edging/trimming time varies from lawn to lawn, so the number of lawns does not adequately explain wages, fuel and maintenance. Hours (H) capture this variability.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Verify the wages line in the two-driver planning budget.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;5,000 + 29 × 500 + 25 × 100 = 5,000 + 14,500 + 2,500 = &lt;b&gt;$22,000&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Alyeski: what are vessel operating costs with 60 cruises and 3,000 passengers?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;6,200 + 475 × 60 + 3.50 × 3,000 = 6,200 + 28,500 + 10,500 = &lt;b&gt;$45,200&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;With two drivers, Larry&#x27;s revenue variance changes from $1,750 F to $750 U. How is this possible if actual revenue is the same?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The benchmark changes. With two drivers, the revenue that &quot;should have been&quot; earned includes $25 × 100 edging hours ($2,500), raising it to $43,750. Against this benchmark, $43,000 falls short of expectations.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;sintesi&quot; class=&quot;part&quot; style=&quot;--c:var(--accent);--cbg:var(--accent-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot;&gt;Summary&lt;/div&gt;
    &lt;h2&gt;The review sheet&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Three columns&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Planning&lt;/b&gt; = formulas × planned Q&lt;br&gt;&lt;b&gt;Flexible&lt;/b&gt; = formulas × actual Q&lt;br&gt;&lt;b&gt;Actual&lt;/b&gt; = what happened&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Two variances&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Activity&lt;/b&gt; = Flexible − Planning (volume)&lt;br&gt;&lt;b&gt;Revenue/Spending&lt;/b&gt; = Actual − Flexible (management)&lt;br&gt;Sum = Actual − Planning&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;F or U?&lt;/h4&gt;&lt;p&gt;What matters is the effect on profit.&lt;br&gt;Revenue: actual &amp;gt; benchmark → &lt;span class=&quot;fav&quot;&gt;F&lt;/span&gt;&lt;br&gt;Costs: actual &amp;gt; benchmark → &lt;span class=&quot;unf&quot;&gt;U&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shortcuts&lt;/h4&gt;&lt;p&gt;Activity var. of a line item = ΔQ × variable coefficient.&lt;br&gt;Activity var. of NOI = ΔQ × unit contribution margin.&lt;br&gt;Fixed costs: activity var. = 0.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h4&gt;Common exam mistakes&lt;/h4&gt;
    &lt;ul class=&quot;prose&quot;&gt;
      &lt;li&gt;Comparing actual results with the planning budget and judging management on that basis: this is exactly what the slides describe as misleading.&lt;/li&gt;
      &lt;li&gt;Forgetting the fixed component of &lt;em&gt;mixed costs&lt;/em&gt; (wages $5,000 + $30Q).&lt;/li&gt;
      &lt;li&gt;Reading a U on cost activity variances as &quot;bad&quot;: it simply means more work was done.&lt;/li&gt;
      &lt;li&gt;Believing that fixed costs cannot have a spending variance (insurance 200 U).&lt;/li&gt;
      &lt;li&gt;Reversing the order of subtraction: the amount is always written as a positive number, and the sign is conveyed by the letter F/U.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;chip&quot; style=&quot;--c:var(--accent);--cbg:var(--accent-bg)&quot;&gt;Further reading&lt;/div&gt;
    &lt;h2&gt;Texts and sources behind the slides&lt;/h2&gt;
    &lt;p class=&quot;prose&quot;&gt;The slides have no explicit bibliography: they carry &quot;© McGraw Hill&quot;, a &quot;9-xx&quot; numbering (chapter 9) and a few concepts with a clear origin. Everything below comes from a web search and is marked as &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;

    &lt;div class=&quot;ref&quot;&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Noreen, Brewer, Garrison — &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; the managerial accounting textbook in the Garrison/Noreen/Brewer family. In the current international edition (ISBN 9781265617660), chapter 9 is titled precisely &lt;i&gt;Flexible Budgets and Performance Analysis&lt;/i&gt;, between &lt;i&gt;Master Budgeting&lt;/i&gt; and &lt;i&gt;Standard Costs and Variances&lt;/i&gt;. This matches the slides&#x27; 9-3, 9-39… numbering and their McGraw Hill copyright.&lt;br&gt;
      &lt;b&gt;Why it matters:&lt;/b&gt; it is the most likely source of the Larry&#x27;s Lawn Service, Jake&#x27;s Roof Repair and Alyeski Tours cases, and it offers additional exercises. The following chapter (standard costs) breaks spending variances down into price and quantity effects. In older editions the same chapter has a different number (for example, it is chapter 10 in the 2010 edition).&lt;br&gt;
      &lt;a href=&quot;https://www.mheducation.ca/managerial-accounting-for-managers-ise-9781265617660-can&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher&#x27;s page (McGraw Hill Canada)&lt;/a&gt; · &lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of an earlier edition (McGraw Hill Higher Education)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Wild &amp;amp; Shaw — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; another McGraw Hill textbook. The &lt;i&gt;Variance Analysis Cycle&lt;/i&gt; diagram on slide 4 (prepare the report → analyze variances → raise questions → identify causes → take action → next period) appears in the slides accompanying this text, in the chapter on flexible budgets and standard costing. This is based on a copy of the slides found online, so the attribution should be verified.&lt;br&gt;
      &lt;b&gt;Why it matters:&lt;/b&gt; it presents the cycle as a continuous control process, the framework within which the variance calculations covered in this lecture fit.&lt;br&gt;
      &lt;a href=&quot;https://www.mheducation.com/highered/product/managerial-accounting-wild.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Textbook page (McGraw Hill)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Management by exception — AccountingTools&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a practical definition of management by exception. Only &lt;i&gt;substantial&lt;/i&gt; differences from the budget are reported to management, with an example of a combined threshold (the greater of $10,000 and 20%) that mirrors the two criteria in the slides, absolute amount and percentage. It also points out a limitation: the method works only if the budget is well constructed; otherwise it produces many meaningless variances.&lt;br&gt;
      &lt;b&gt;Why it matters:&lt;/b&gt; it shows how thresholds for deciding what to investigate are set in practice, and confirms that a poorly calibrated static budget renders the method useless.&lt;br&gt;
      &lt;a href=&quot;https://www.accountingtools.com/articles/what-is-management-by-exception.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AccountingTools — Management by exception&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  var $ = function(s,r){return (r||document).querySelector(s)};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var fmt = function(n){return &#x27;$&#x27;+Math.round(Math.abs(n)).toLocaleString(&#x27;en-US&#x27;)};
  var num = function(n){return Math.round(n).toLocaleString(&#x27;en-US&#x27;)};
  // F/U sign: for revenue and NOI a positive difference is favorable, for costs it is unfavorable
  function fu(d,rev){
    if(Math.round(d)===0) return &#x27;&lt;span&gt;–&lt;/span&gt;&#x27;;
    var fav = rev ? d&gt;0 : d&lt;0;
    return &#x27;&lt;span class=&quot;&#x27;+(fav?&#x27;fav&#x27;:&#x27;unf&#x27;)+&#x27;&quot;&gt;&#x27;+fmt(d)+&#x27; &#x27;+(fav?&#x27;F&#x27;:&#x27;U&#x27;)+&#x27;&lt;/span&gt;&#x27;;
  }

  /* tabs */
  $$(&#x27;[data-tabs]&#x27;).forEach(function(list){
    var tabs = $$(&#x27;[role=tab]&#x27;,list);
    tabs.forEach(function(t){
      t.addEventListener(&#x27;click&#x27;,function(){
        tabs.forEach(function(o){
          var on = o===t;
          o.setAttribute(&#x27;aria-selected&#x27;,on);
          document.getElementById(o.getAttribute(&#x27;aria-controls&#x27;)).hidden = !on;
        });
      });
    });
  });

  /* variance analysis cycle */
  var cycT = [
    [&#x27;Prepare performance report&#x27;,&#x27;The cycle starts here (&lt;b&gt;Begin&lt;/b&gt;). At the end of the period, actual results are compared with the budget in a &lt;em&gt;performance report&lt;/em&gt;: a line-by-line statement showing the variances.&#x27;],
    [&#x27;Analyze variances&#x27;,&#x27;Variances are computed and decomposed: how much is due to volume (&lt;em&gt;activity variances&lt;/em&gt;) and how much to prices and cost control (&lt;em&gt;revenue and spending variances&lt;/em&gt;).&#x27;],
    [&#x27;Raise questions&#x27;,&#x27;Significant variances (see &lt;em&gt;management by exception&lt;/em&gt;) become questions. For example: why do Larry\&#x27;s wages exceed what they should have been by $2,000?&#x27;],
    [&#x27;Identify root causes&#x27;,&#x27;The underlying causes (&lt;em&gt;root causes&lt;/em&gt;) are investigated: overtime, supplier price increases, waste, or unrealistic budget formulas.&#x27;],
    [&#x27;Take actions&#x27;,&#x27;Corrective action is taken: operational adjustments, renegotiations, new procedures, or revision of the cost formulas if they were wrong.&#x27;],
    [&#x27;Conduct next period\&#x27;s operations&#x27;,&#x27;The next period is carried out with the corrections in place. At the end of the period, a new report is prepared and the cycle starts again.&#x27;]
  ];
  var cyc = 0;
  function setCyc(i){
    cyc = (i+6)%6;
    $$(&#x27;.cyc&#x27;).forEach(function(g){g.classList.toggle(&#x27;on&#x27;,+g.dataset.i===cyc)});
    $(&#x27;#cycTxt&#x27;).innerHTML = &#x27;&lt;b&gt;&#x27;+(cyc+1)+&#x27;/6 · &#x27;+cycT[cyc][0]+&#x27;&lt;/b&gt; — &#x27;+cycT[cyc][1];
  }
  $$(&#x27;.cyc&#x27;).forEach(function(g){
    g.addEventListener(&#x27;click&#x27;,function(){setCyc(+g.dataset.i)});
    g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();setCyc(+g.dataset.i)}});
  });
  $(&#x27;#cycPrev&#x27;).addEventListener(&#x27;click&#x27;,function(){setCyc(cyc-1)});
  $(&#x27;#cycNext&#x27;).addEventListener(&#x27;click&#x27;,function(){setCyc(cyc+1)});
  setCyc(0);

  /* management by exception */
  var mbeRows = [
    [&#x27;Revenue&#x27;,1750,41250,&#x27;F&#x27;],[&#x27;Wages and salaries&#x27;,2000,21500,&#x27;U&#x27;],[&#x27;Gasoline and supplies&#x27;,150,4950,&#x27;U&#x27;],
    [&#x27;Equipment maintenance&#x27;,350,1650,&#x27;F&#x27;],[&#x27;Office and shop utilities&#x27;,50,1000,&#x27;F&#x27;],[&#x27;Office and shop rent&#x27;,0,2000,&#x27;&#x27;],
    [&#x27;Equipment depreciation&#x27;,0,2500,&#x27;&#x27;],[&#x27;Insurance&#x27;,200,1000,&#x27;U&#x27;]
  ];
  var logic = &#x27;or&#x27;;
  function drawMbe(){
    var a = +$(&#x27;#mbeAmt&#x27;).value, p = +$(&#x27;#mbePct&#x27;).value;
    $(&#x27;#mbeAmtO&#x27;).textContent = fmt(a); $(&#x27;#mbePctO&#x27;).textContent = p+&#x27;%&#x27;;
    var n = 0;
    $(&#x27;#mbeList&#x27;).innerHTML = &#x27;&lt;li style=&quot;font-weight:600;color:var(--muted)&quot;&gt;&lt;span style=&quot;text-align:left&quot;&gt;Item&lt;/span&gt;&lt;span&gt;Variance&lt;/span&gt;&lt;span&gt;%&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/li&gt;&#x27; +
      mbeRows.map(function(r){
        var pct = r[1]/r[2]*100;
        var hitA = r[1]&gt;0 &amp;&amp; r[1]&gt;=a, hitP = r[1]&gt;0 &amp;&amp; pct&gt;=p;
        var ex = logic===&#x27;or&#x27; ? (hitA||hitP) : (hitA&amp;&amp;hitP);
        if(ex) n++;
        var cls = r[3]===&#x27;F&#x27;?&#x27;fav&#x27;:(r[3]===&#x27;U&#x27;?&#x27;unf&#x27;:&#x27;&#x27;);
        return &#x27;&lt;li class=&quot;&#x27;+(ex?&#x27;ex&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span style=&quot;text-align:left&quot;&gt;&#x27;+r[0]+&#x27;&lt;/span&gt;&lt;span class=&quot;&#x27;+cls+&#x27;&quot;&gt;&#x27;+(r[1]?fmt(r[1])+&#x27; &#x27;+r[3]:&#x27;–&#x27;)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+pct.toFixed(1)+&#x27;%&lt;/span&gt;&lt;span&gt;&#x27;+(ex?&#x27;&lt;span class=&quot;flag&quot;&gt;exception&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/span&gt;&lt;/li&gt;&#x27;;
      }).join(&#x27;&#x27;);
    $(&#x27;#mbeList&#x27;).insertAdjacentHTML(&#x27;beforeend&#x27;,&#x27;&lt;li style=&quot;border:0&quot;&gt;&lt;span style=&quot;text-align:left&quot; class=&quot;small&quot;&gt;&#x27;+n+&#x27; of 8 items to investigate&lt;/span&gt;&lt;/li&gt;&#x27;);
  }
  $(&#x27;#mbeAmt&#x27;).addEventListener(&#x27;input&#x27;,drawMbe);
  $(&#x27;#mbePct&#x27;).addEventListener(&#x27;input&#x27;,drawMbe);
  $$(&#x27;[data-logic]&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){
      logic = b.dataset.logic;
      $$(&#x27;[data-logic]&#x27;).forEach(function(o){o.setAttribute(&#x27;aria-pressed&#x27;,o===b)});
      drawMbe();
    });
  });
  drawMbe();

  /* progressive reveal of the static variances */
  var stCells = $$(&#x27;#staticTbl .vhide&#x27;), stI = 0;
  $(&#x27;#stNext&#x27;).addEventListener(&#x27;click&#x27;,function(){if(stI&lt;stCells.length){stCells[stI++].classList.add(&#x27;vshow&#x27;)}});
  $(&#x27;#stAll&#x27;).addEventListener(&#x27;click&#x27;,function(){stCells.forEach(function(c){c.classList.add(&#x27;vshow&#x27;)});stI=stCells.length});
  $(&#x27;#stReset&#x27;).addEventListener(&#x27;click&#x27;,function(){stCells.forEach(function(c){c.classList.remove(&#x27;vshow&#x27;)});stI=0});

  /* flexible budget chart */
  var X = function(q){return 60+(q-300)/400*560}, Y = function(v){return 280-v/55000*260};
  var g = &#x27;&#x27;, ax = &#x27;&#x27;;
  for(var v=0; v&lt;=50000; v+=10000){
    g += &#x27;&lt;line x1=&quot;60&quot; x2=&quot;620&quot; y1=&quot;&#x27;+Y(v)+&#x27;&quot; y2=&quot;&#x27;+Y(v)+&#x27;&quot;/&gt;&#x27;;
    ax += &#x27;&lt;text x=&quot;54&quot; y=&quot;&#x27;+(Y(v)+4)+&#x27;&quot; text-anchor=&quot;end&quot;&gt;&#x27;+(v/1000)+&#x27;k&lt;/text&gt;&#x27;;
  }
  for(var q=300; q&lt;=700; q+=100){ ax += &#x27;&lt;text x=&quot;&#x27;+X(q)+&#x27;&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+q+&#x27;&lt;/text&gt;&#x27;; }
  ax += &#x27;&lt;text x=&quot;340&quot; y=&quot;316&quot; text-anchor=&quot;middle&quot;&gt;Q = number of lawns&lt;/text&gt;&#x27;;
  $(&#x27;#fcGrid&#x27;).innerHTML = g; $(&#x27;#fcAxis&#x27;).innerHTML = ax;
  $(&#x27;#fcRev&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+X(300)+&#x27;,&#x27;+Y(22500)+&#x27; L&#x27;+X(700)+&#x27;,&#x27;+Y(52500));
  $(&#x27;#fcCost&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+X(300)+&#x27;,&#x27;+Y(11500+42*300)+&#x27; L&#x27;+X(700)+&#x27;,&#x27;+Y(11500+42*700));
  $(&#x27;#fcFixed&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+X(300)+&#x27;,&#x27;+Y(11500)+&#x27; L&#x27;+X(700)+&#x27;,&#x27;+Y(11500));
  var sc = $(&#x27;#fcStaticCost&#x27;); sc.setAttribute(&#x27;x1&#x27;,X(300)); sc.setAttribute(&#x27;x2&#x27;,X(700)); sc.setAttribute(&#x27;y1&#x27;,Y(32500)); sc.setAttribute(&#x27;y2&#x27;,Y(32500));
  function at(el,x,y,anchor){el.setAttribute(&#x27;x&#x27;,x);el.setAttribute(&#x27;y&#x27;,y);if(anchor)el.setAttribute(&#x27;text-anchor&#x27;,anchor)}
  at($(&#x27;#fcLR&#x27;),600,30,&#x27;end&#x27;); at($(&#x27;#fcLC&#x27;),615,108,&#x27;end&#x27;); at($(&#x27;#fcLF&#x27;),615,218,&#x27;end&#x27;); at($(&#x27;#fcLS&#x27;),66,120,&#x27;start&#x27;);
  $(&#x27;#fcPlanR&#x27;).setAttribute(&#x27;cx&#x27;,X(500)); $(&#x27;#fcPlanR&#x27;).setAttribute(&#x27;cy&#x27;,Y(37500));
  $(&#x27;#fcPlanC&#x27;).setAttribute(&#x27;cx&#x27;,X(500)); $(&#x27;#fcPlanC&#x27;).setAttribute(&#x27;cy&#x27;,Y(32500));
  var flexRows = [
    [&#x27;Revenue&#x27;,&#x27;$75Q&#x27;,0,75,true],[&#x27;Wages and salaries&#x27;,&#x27;$5,000 + $30Q&#x27;,5000,30],[&#x27;Gasoline and supplies&#x27;,&#x27;$9Q&#x27;,0,9],
    [&#x27;Equipment maintenance&#x27;,&#x27;$3Q&#x27;,0,3],[&#x27;Office and shop utilities&#x27;,&#x27;$1,000&#x27;,1000,0],[&#x27;Office and shop rent&#x27;,&#x27;$2,000&#x27;,2000,0],
    [&#x27;Equipment depreciation&#x27;,&#x27;$2,500&#x27;,2500,0],[&#x27;Insurance&#x27;,&#x27;$1,000&#x27;,1000,0]
  ];
  function drawFlex(){
    var q = +$(&#x27;#qS&#x27;).value; $(&#x27;#qO&#x27;).textContent = q;
    var rev = 75*q, cost = 11500+42*q, noi = rev-cost;
    $(&#x27;#fcDotR&#x27;).setAttribute(&#x27;cx&#x27;,X(q)); $(&#x27;#fcDotR&#x27;).setAttribute(&#x27;cy&#x27;,Y(rev));
    $(&#x27;#fcDotC&#x27;).setAttribute(&#x27;cx&#x27;,X(q)); $(&#x27;#fcDotC&#x27;).setAttribute(&#x27;cy&#x27;,Y(cost));
    var l = $(&#x27;#fcQ&#x27;); l.setAttribute(&#x27;x1&#x27;,X(q)); l.setAttribute(&#x27;x2&#x27;,X(q)); l.setAttribute(&#x27;y1&#x27;,20); l.setAttribute(&#x27;y2&#x27;,280);
    $(&#x27;#kRev&#x27;).textContent = fmt(rev); $(&#x27;#kCost&#x27;).textContent = fmt(cost);
    $(&#x27;#kNoi&#x27;).textContent = (noi&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+fmt(noi);
    $(&#x27;#kAct&#x27;).innerHTML = fu(noi-5000,true);
    var h = &#x27;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Formula&lt;/th&gt;&lt;th&gt;Flexible (Q = &#x27;+q+&#x27;)&lt;/th&gt;&lt;th&gt;Planning (Q = 500)&lt;/th&gt;&lt;th&gt;Activity variance&lt;/th&gt;&lt;/tr&gt;&#x27;;
    flexRows.forEach(function(r){
      var f = r[2]+r[3]*q, p = r[2]+r[3]*500;
      h += &#x27;&lt;tr&gt;&lt;td&#x27;+(r[4]?&#x27;&#x27;:&#x27; class=&quot;ind&quot;&#x27;)+&#x27;&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;&#x27;+r[1]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(f)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(p)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(f-p,!!r[4])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    });
    h += &#x27;&lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&#x27;+num(cost)+&#x27;&lt;/td&gt;&lt;td&gt;32,500&lt;/td&gt;&lt;td&gt;&#x27;+fu(cost-32500,false)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    h += &#x27;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;33Q − 11,500&lt;/td&gt;&lt;td&gt;&#x27;+(noi&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+fmt(noi)+&#x27;&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td&gt;&#x27;+fu(noi-5000,true)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    $(&#x27;#flexTbl&#x27;).innerHTML = h;
  }
  $(&#x27;#qS&#x27;).addEventListener(&#x27;input&#x27;,drawFlex);
  drawFlex();

  /* quiz */
  $$(&#x27;.quiz&#x27;).forEach(function(qz){
    var fb = $(&#x27;.fb&#x27;,qz), ans = qz.dataset.answer;
    $$(&#x27;.opts button&#x27;,qz).forEach(function(b){
      b.addEventListener(&#x27;click&#x27;,function(){
        var ok = b.dataset.k===ans;
        $$(&#x27;.opts button&#x27;,qz).forEach(function(o){o.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;)});
        b.classList.add(ok?&#x27;ok&#x27;:&#x27;ko&#x27;);
        fb.textContent = ok ? fb.dataset.ok : fb.dataset.ko;
      });
    });
  });

  /* performance report and decomposition */
  var rep = [
    [&#x27;Revenue&#x27;,43000,41250,37500,true],[&#x27;Wages and salaries&#x27;,23500,21500,20000],[&#x27;Gasoline and supplies&#x27;,5100,4950,4500],
    [&#x27;Equipment maintenance&#x27;,1300,1650,1500],[&#x27;Office and shop utilities&#x27;,950,1000,1000],[&#x27;Office and shop rent&#x27;,2000,2000,2000],
    [&#x27;Equipment depreciation&#x27;,2500,2500,2500],[&#x27;Insurance&#x27;,1200,1000,1000],[&#x27;Total expenses&#x27;,36550,34600,32500,false,&#x27;sub&#x27;],
    [&#x27;Net operating income&#x27;,6450,6650,5000,true,&#x27;tot&#x27;]
  ];
  var rh = &#x27;&lt;tr&gt;&lt;td&gt;Number of lawns (Q)&lt;/td&gt;&lt;td&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;500&lt;/td&gt;&lt;/tr&gt;&#x27;;
  rep.forEach(function(r,i){
    var ind = (!r[4] &amp;&amp; !r[5]) ? &#x27; class=&quot;ind&quot;&#x27; : &#x27;&#x27;;
    rh += &#x27;&lt;tr class=&quot;pick &#x27;+(r[5]||&#x27;&#x27;)+&#x27;&quot; data-i=&quot;&#x27;+i+&#x27;&quot; tabindex=&quot;0&quot;&gt;&lt;td&#x27;+ind+&#x27;&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(r[1])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(r[1]-r[2],!!r[4])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(r[2])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(r[2]-r[3],!!r[4])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(r[3])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
  });
  $(&#x27;#repTbl&#x27;).insertAdjacentHTML(&#x27;beforeend&#x27;,rh);
  function bar(d,rev,max){
    var fav = rev ? d&gt;0 : d&lt;0, w = max ? Math.abs(d)/max*100 : 0;
    return &#x27;&lt;span class=&quot;bar&quot; style=&quot;width:&#x27;+Math.max(w,0.5)+&#x27;%;max-width:60%;background:&#x27;+(Math.round(d)===0?&#x27;var(--rule)&#x27;:(fav?&#x27;var(--fav)&#x27;:&#x27;var(--unf)&#x27;))+&#x27;&quot;&gt;&lt;/span&gt;&#x27;;
  }
  function dec(i){
    var r = rep[i], rev = !!r[4];
    var st = r[1]-r[3], ac = r[2]-r[3], sp = r[1]-r[2];
    var max = Math.max(Math.abs(st),Math.abs(ac),Math.abs(sp));
    $$(&#x27;#repTbl tr.pick&#x27;).forEach(function(t){t.classList.toggle(&#x27;hl&#x27;,+t.dataset.i===i)});
    var line = function(lab,d,note){return &#x27;&lt;div style=&quot;display:grid;grid-template-columns:minmax(8em,13em) 7em 1fr;gap:10px;align-items:center;margin:6px 0&quot;&gt;&lt;span&gt;&#x27;+lab+&#x27;&lt;/span&gt;&lt;span style=&quot;text-align:right&quot;&gt;&#x27;+fu(d,rev)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+bar(d,rev,max)+&#x27; &lt;span class=&quot;small&quot;&gt;&#x27;+note+&#x27;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&#x27;};
    var msg;
    if(Math.round(st)===0 &amp;&amp; Math.round(ac)===0 &amp;&amp; Math.round(sp)===0) msg = &#x27;No variance: a fixed item, spent exactly as planned.&#x27;;
    else if(Math.round(ac)===0) msg = &#x27;Fixed item: volume does not affect it, so the entire variance is due to management.&#x27;;
    else if(Math.round(sp)===0) msg = &#x27;The entire variance is explained by volume.&#x27;;
    else msg = &#x27;The comparison with the static budget (&#x27;+fu(st,rev)+&#x27;) mixes two effects that must be read separately.&#x27;;
    $(&#x27;#decBox&#x27;).innerHTML = &#x27;&lt;h4 style=&quot;margin-top:0&quot;&gt;&#x27;+r[0]+&#x27;&lt;/h4&gt;&#x27;+
      line(&#x27;Actual − Planning (static)&#x27;,st,&#x27;what you would see without a flexible budget&#x27;)+
      line(&#x27;= Activity (Flex − Plan)&#x27;,ac,&#x27;volume effect&#x27;)+
      line(&#x27;+ Rev./Spending (Act − Flex)&#x27;,sp,&#x27;management effect&#x27;)+
      &#x27;&lt;p class=&quot;small&quot; style=&quot;margin-bottom:0&quot;&gt;&#x27;+msg+&#x27;&lt;/p&gt;&#x27;;
  }
  $$(&#x27;#repTbl tr.pick&#x27;).forEach(function(t){
    t.addEventListener(&#x27;click&#x27;,function(){dec(+t.dataset.i)});
    t.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();dec(+t.dataset.i)}});
  });
  dec(1);

  /* two-driver calculator */
  var mRows = [
    [&#x27;Revenue&#x27;,&#x27;$75Q + $25H&#x27;,0,75,25,true],[&#x27;Wages and salaries&#x27;,&#x27;$5,000 + $29Q + $25H&#x27;,5000,29,25],
    [&#x27;Gasoline and supplies&#x27;,&#x27;$8Q + $6H&#x27;,0,8,6],[&#x27;Equipment maintenance&#x27;,&#x27;$2Q + $2H&#x27;,0,2,2],
    [&#x27;Office and shop utilities&#x27;,&#x27;$1,000&#x27;,1000,0,0],[&#x27;Office and shop rent&#x27;,&#x27;$2,000&#x27;,2000,0,0],
    [&#x27;Equipment depreciation&#x27;,&#x27;$2,500&#x27;,2500,0,0],[&#x27;Insurance&#x27;,&#x27;$1,000&#x27;,1000,0,0]
  ];
  function drawMulti(){
    var Q = +$(&#x27;#mQ&#x27;).value, H = +$(&#x27;#mH&#x27;).value;
    $(&#x27;#mQO&#x27;).textContent = Q; $(&#x27;#mHO&#x27;).textContent = H;
    var h = &#x27;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Formula&lt;/th&gt;&lt;th&gt;Flexible (Q &#x27;+Q+&#x27;, H &#x27;+H+&#x27;)&lt;/th&gt;&lt;th&gt;Planning (Q 500, H 100)&lt;/th&gt;&lt;th&gt;Activity variance&lt;/th&gt;&lt;/tr&gt;&#x27;;
    var tf = 0, tp = 0, rf = 0, rp = 0;
    mRows.forEach(function(r){
      var f = r[2]+r[3]*Q+r[4]*H, p = r[2]+r[3]*500+r[4]*100;
      if(r[5]){rf=f;rp=p}else{tf+=f;tp+=p}
      h += &#x27;&lt;tr&gt;&lt;td&#x27;+(r[5]?&#x27;&#x27;:&#x27; class=&quot;ind&quot;&#x27;)+&#x27;&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td class=&quot;f&quot;&gt;&#x27;+r[1]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(f)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(p)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(f-p,!!r[5])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    });
    var nf = rf-tf, np = rp-tp;
    h += &#x27;&lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&#x27;+num(tf)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(tp)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(tf-tp,false)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    h += &#x27;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&#x27;+(nf&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+fmt(nf)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(np)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fu(nf-np,true)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    $(&#x27;#multiTbl&#x27;).innerHTML = h;
  }
  $(&#x27;#mQ&#x27;).addEventListener(&#x27;input&#x27;,drawMulti);
  $(&#x27;#mH&#x27;).addEventListener(&#x27;input&#x27;,drawMulti);
  drawMulti();
})();
&lt;/script&gt;
