&lt;main&gt;
&lt;!-- ============ S1 ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Slide 1–4 · il caso e le domande&lt;/div&gt;&lt;h2&gt;Il master budget e i dati di Morganton&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;master budget&lt;/span&gt; (budget generale) è l&#x27;insieme coordinato dei budget con cui l&#x27;azienda traduce in numeri i piani di un periodo futuro. Non è un unico prospetto ma una &lt;em&gt;catena&lt;/em&gt;: ogni budget usa i risultati del precedente. &lt;span class=&quot;badge b-add&quot;&gt;spiegazione aggiunta&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;dl style=&quot;margin:0&quot;&gt;
    &lt;dt&gt;Operating budgets&lt;/dt&gt;&lt;dd&gt;i budget &quot;operativi&quot;, che descrivono le attività: &lt;span class=&quot;t&quot;&gt;sales budget&lt;/span&gt; (vendite), &lt;span class=&quot;t&quot;&gt;production budget&lt;/span&gt; (produzione), &lt;span class=&quot;t&quot;&gt;direct materials budget&lt;/span&gt; (materie prime), &lt;span class=&quot;t&quot;&gt;direct labor budget&lt;/span&gt; (manodopera diretta), &lt;span class=&quot;t&quot;&gt;manufacturing overhead budget&lt;/span&gt; (costi indiretti di produzione), &lt;span class=&quot;t&quot;&gt;selling and administrative expense budget&lt;/span&gt; (spese commerciali e amministrative), fino al &lt;span class=&quot;t&quot;&gt;budgeted income statement&lt;/span&gt; (conto economico previsionale).&lt;/dd&gt;
    &lt;dt&gt;Financial budgets&lt;/dt&gt;&lt;dd&gt;i budget &quot;finanziari&quot;: &lt;span class=&quot;t&quot;&gt;cash budget&lt;/span&gt; (entrate e uscite di cassa) e &lt;span class=&quot;t&quot;&gt;budgeted balance sheet&lt;/span&gt; (stato patrimoniale previsionale), dove finiscono crediti, debiti e rimanenze calcolati nell&#x27;esercizio.&lt;/dd&gt;
    &lt;dt&gt;Perché si parte dalle vendite&lt;/dt&gt;&lt;dd&gt;il volume di vendita determina quanto produrre, quindi quanta materia comprare e quanta manodopera servirà. Un errore nella previsione delle vendite si propaga a tutto il resto.&lt;/dd&gt;
  &lt;/dl&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-panel=&quot;t1a&quot;&gt;I dati (a–g)&lt;/button&gt;

      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;t1c&quot;&gt;Le vendite nel tempo&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;t1a&quot;&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;ledger&quot;&gt;
        &lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Dato&lt;/th&gt;&lt;th&gt;Cosa significa&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;a&lt;/td&gt;&lt;td&gt;Prezzo $70/unità; vendite: giugno 8,400 · luglio 10,000 · agosto 12,000 · settembre 13,000 unità; tutte &lt;span class=&quot;t&quot;&gt;on credit&lt;/span&gt;&lt;/td&gt;&lt;td&gt;vendite a credito: il cliente paga dopo, quindi ricavo e incasso non coincidono&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;b&lt;/td&gt;&lt;td&gt;40% incassato nel mese della vendita, 60% nel mese successivo&lt;/td&gt;&lt;td&gt;regola degli incassi (cash collections)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;c&lt;/td&gt;&lt;td&gt;Rimanenza finale di prodotti finiti = 20% delle vendite del mese dopo&lt;/td&gt;&lt;td&gt;scorta di sicurezza di &lt;span class=&quot;t&quot;&gt;finished goods&lt;/span&gt; (prodotti finiti)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;d&lt;/td&gt;&lt;td&gt;Rimanenza finale di materie prime = 10% del fabbisogno di produzione del mese dopo; 5 pounds per unità; $2.00 per pound&lt;/td&gt;&lt;td&gt;1 pound (libbra) ≈ 0,454 kg; scorta di &lt;span class=&quot;t&quot;&gt;raw materials&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;e&lt;/td&gt;&lt;td&gt;30% degli acquisti pagato nel mese, 70% nel mese successivo&lt;/td&gt;&lt;td&gt;regola dei pagamenti ai fornitori (cash disbursements)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;f&lt;/td&gt;&lt;td&gt;Manodopera diretta $15/ora; 2 &lt;span class=&quot;t&quot;&gt;direct labor-hours&lt;/span&gt; per unità&lt;/td&gt;&lt;td&gt;ore di lavoro diretto necessarie per un&#x27;unità&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;g&lt;/td&gt;&lt;td&gt;S&amp;amp;A variabile $1.80 per unità venduta; S&amp;amp;A fissa $60,000 al mese&lt;/td&gt;&lt;td&gt;spese commerciali e amministrative&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Q11&lt;/td&gt;&lt;td&gt;Niente overhead fisso; overhead variabile $10 per direct labor-hour&lt;/td&gt;&lt;td&gt;dato aggiunto nella domanda 11 (slide 4)&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;

      &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide 3–4&lt;/span&gt; Tutte le domande riguardano &lt;b&gt;luglio&lt;/b&gt;.&lt;/p&gt;
      &lt;ol style=&quot;margin:0;padding-left:1.4em;columns:2 280px;column-gap:28px&quot;&gt;

        &lt;li&gt;Rimanenza di prodotti finiti a fine luglio &lt;a href=&quot;#s6&quot;&gt;→§6&lt;/a&gt;&lt;/li&gt;
        &lt;li&gt;Cost of goods sold e gross margin &lt;a href=&quot;#s6&quot;&gt;→§6&lt;/a&gt;&lt;/li&gt;

      &lt;p class=&quot;cap&quot;&gt;Per fare il budget di luglio servono anche i mesi vicini: giugno per gli incassi e le scorte iniziali, agosto (e indirettamente settembre) per le scorte finali.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché il master budget comincia sempre dal sales budget?&lt;/summary&gt;&lt;div&gt;Perché le vendite previste sono il vincolo che guida tutto: da esse dipendono produzione, acquisti di materia, manodopera, spese variabili e incassi. Gli altri budget sono costruiti &quot;a valle&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa vuol dire che tutte le vendite sono &quot;on credit&quot;?&lt;/summary&gt;&lt;div&gt;Che al momento della vendita l&#x27;azienda non riceve denaro: nasce un credito verso il cliente (accounts receivable). Il ricavo di competenza del mese e l&#x27;incasso del mese sono quindi grandezze diverse.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché per un budget di luglio servono i dati di agosto?&lt;/summary&gt;&lt;div&gt;Perché le scorte finali di luglio (prodotti finiti e materie prime) sono definite come percentuale del fabbisogno del mese successivo, cioè agosto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S2 ============ --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Domande 1–3 · slide 5–6&lt;/div&gt;&lt;h2&gt;Sales budget, cash collections e accounts receivable&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Domanda 1 · Budgeted sales&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Sales = unit sales × selling price = 10,000 × $70 = &lt;b&gt;$700,000&lt;/b&gt;&lt;small&gt;Il ricavo è di competenza di luglio anche se non è ancora stato incassato.&lt;/small&gt;&lt;/div&gt;

  &lt;h3&gt;Domanda 2 · Expected cash collections&lt;/h3&gt;
  &lt;p&gt;Gli &lt;span class=&quot;t&quot;&gt;expected cash collections&lt;/span&gt; (incassi previsti) sono il denaro che entra davvero nel mese. Con la regola 40% / 60%, a luglio entrano due &quot;fette&quot; di vendite diverse:&lt;/p&gt;
  &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;June sales: $588,000 × 60% &lt;span class=&quot;src&quot;&gt;(8,400 × $70)&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$352,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;July sales: $700,000 × 40%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash collections&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$632,800&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h3&gt;Domanda 3 · Accounts receivable a fine luglio&lt;/h3&gt;
  &lt;p&gt;Gli &lt;span class=&quot;t&quot;&gt;accounts receivable&lt;/span&gt; (crediti verso clienti) sono, come nota la slide 3, «l&#x27;importo dei beni venduti che non sono stati pagati (nessun incasso)». A fine luglio resta da incassare il 60% delle vendite di luglio: &lt;b&gt;$700,000 × 60% = $420,000&lt;/b&gt;. Le vendite di giugno, a fine luglio, sono state incassate per intero.&lt;/p&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Prova tu: cambia la regola di incasso&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;colPct&quot;&gt;% incassata nel mese della vendita&lt;/label&gt;&lt;input id=&quot;colPct&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;colPctO&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;fig&quot; id=&quot;colSvg&quot; viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Ripartizione degli incassi di giugno e luglio&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Cash collections di luglio&lt;/span&gt;&lt;b id=&quot;colK1&quot;&gt;$632,800&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Accounts receivable fine luglio&lt;/span&gt;&lt;b id=&quot;colK2&quot;&gt;$420,000&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Sales di luglio (non cambia)&lt;/span&gt;&lt;b&gt;$700,000&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;cap&quot;&gt;Il ricavo resta $700,000 qualunque sia la regola: cambia solo &lt;em&gt;quando&lt;/em&gt; arriva il denaro. Più si incassa subito, più cassa e meno crediti.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Competenza e cassa: perché sono due numeri diversi&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;spiegazione aggiunta&lt;/span&gt; Il conto economico segue il principio di competenza (&lt;span class=&quot;t&quot;&gt;accrual basis&lt;/span&gt;): il ricavo si registra quando si vende. Il cash budget segue la cassa: conta quando entra il denaro. Con vendite a credito i due numeri divergono, e la differenza si accumula nei crediti.&lt;/p&gt;
    &lt;p&gt;Un controllo utile: &lt;b&gt;AR iniziale + vendite − incassi = AR finale&lt;/b&gt;. AR fine giugno = 60% × 588,000 = 352,800; 352,800 + 700,000 − 632,800 = &lt;b&gt;420,000&lt;/b&gt;. Torna.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Il programma completo degli incassi (luglio–settembre)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;calcolo aggiunto&lt;/span&gt; Con gli stessi dati si possono stimare anche i mesi dopo (agosto: vendite $840,000; settembre: $910,000).&lt;/p&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Jul&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Aug&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Sep&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;60% delle vendite del mese prima&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;352,800&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;420,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;504,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;40% delle vendite del mese&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;336,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;364,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale incassi&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;632,800&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;756,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;868,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Se a luglio le vendite fossero 11,000 unità, quanto varrebbero gli incassi di luglio?&lt;/summary&gt;&lt;div&gt;June: 588,000 × 60% = 352,800; July: 11,000 × 70 = 770,000 × 40% = 308,000. Totale &lt;b&gt;$660,800&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;AR di fine luglio non comprende nulla delle vendite di giugno?&lt;/summary&gt;&lt;div&gt;Perché le vendite di giugno sono incassate per il 40% a giugno e per il 60% a luglio: a fine luglio sono pagate al 100%.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Ricavi di luglio $700,000, incassi $632,800: dove va la differenza?&lt;/summary&gt;&lt;div&gt;Fa crescere i crediti: AR passa da $352,800 (fine giugno) a $420,000 (fine luglio), +$67,200 = 700,000 − 632,800.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S3 ============ --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Domanda 4 · slide 6&lt;/div&gt;&lt;h2&gt;Production budget: quante unità produrre&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;production budget&lt;/span&gt; (budget di produzione) dice quante unità fabbricare. Non basta produrre quanto si vende: bisogna anche lasciare in magazzino la scorta desiderata per il mese dopo, e si può usare quella già presente a inizio mese.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Required production = Budgeted unit sales + Desired ending FG inventory − Beginning FG inventory&lt;small&gt;FG = finished goods, prodotti finiti. La rimanenza iniziale di luglio è la rimanenza finale di giugno.&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;box stepper&quot; data-stepper&gt;
    &lt;h4&gt;Costruisci il calcolo, un passo alla volta&lt;/h4&gt;
    &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;1&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;&lt;/span&gt;Budgeted sales in units&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;2&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;+&lt;/span&gt;Desired ending inventory*&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;3&quot; class=&quot;sub&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;=&lt;/span&gt;Total needs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;4&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;−&lt;/span&gt;Beginning inventory**&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;5&quot; class=&quot;tot&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;=&lt;/span&gt;Required production&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div class=&quot;steptext&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;template&gt;&lt;p&gt;Si parte da ciò che si prevede di vendere a luglio: &lt;b&gt;10,000 unità&lt;/b&gt; (dato a).&lt;/p&gt;&lt;p&gt;*A fine luglio vogliamo in magazzino il 20% delle vendite di agosto: 12,000 × 20% = &lt;b&gt;2,400&lt;/b&gt; unità (dato c).&lt;/p&gt;&lt;p&gt;Il fabbisogno totale è quanto serve avere a disposizione nel mese: vendere 10,000 e tenerne 2,400 = &lt;b&gt;12,400&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;**Una parte c&#x27;è già: la scorta finale di giugno, pari al 20% delle vendite di luglio: 10,000 × 20% = &lt;b&gt;2,000&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Resta da produrre &lt;b&gt;10,400 unità&lt;/b&gt;. Produzione &amp;gt; vendite perché le vendite crescono e quindi cresce anche la scorta richiesta.&lt;/p&gt;&lt;/template&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;L&#x27;equazione del magazzino, in figura&lt;/h4&gt;
    &lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;Ciò che entra (scorta iniziale + produzione) deve coincidere con ciò che esce o resta (vendite + scorta finale). Muovi il cursore per cambiare la politica di scorta.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fgPct&quot;&gt;Scorta finale FG (% vendite mese dopo)&lt;/label&gt;&lt;input id=&quot;fgPct&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;fgPctO&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;fig&quot; id=&quot;prodSvg&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Equazione del magazzino prodotti finiti&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Required production luglio&lt;/span&gt;&lt;b id=&quot;prodK&quot;&gt;10,400&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Differenza rispetto alle vendite&lt;/span&gt;&lt;b id=&quot;prodK2&quot;&gt;+400&lt;/b&gt;&lt;small&gt;= (agosto − luglio) × % scorta&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Production budget di giugno, luglio e agosto (verifica del dato «61,000 pounds»)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;calcolo aggiunto&lt;/span&gt; Applicando la stessa formula agli altri mesi:&lt;/p&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Jun&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Jul&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Aug&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Unit sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,400&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Ending FG (20% mese dopo)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,400&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Beginning FG (20% del mese)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,680&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Required production&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,720&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,200&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Agosto: 12,200 unità × 5 pounds = &lt;b&gt;61,000 pounds&lt;/b&gt;, proprio il dato che la domanda 5 fornisce già pronto. Anche giugno ha produzione maggiore delle vendite, per costruire la scorta in vista della crescita.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 3&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Se le vendite fossero costanti ogni mese, la produzione sarebbe maggiore, minore o uguale alle vendite?&lt;/summary&gt;&lt;div&gt;Uguale: scorta iniziale e scorta finale sarebbero identiche (20% dello stesso numero) e si annullerebbero.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la rimanenza iniziale di luglio è 2,000 e non 2,400?&lt;/summary&gt;&lt;div&gt;Perché è la scorta finale di giugno, calcolata sulle vendite del mese dopo giugno, cioè luglio: 10,000 × 20% = 2,000. I 2,400 sono la scorta finale di luglio (20% di agosto).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con una scorta del 30%, quante unità produrre a luglio?&lt;/summary&gt;&lt;div&gt;10,000 + 30% × 12,000 − 30% × 10,000 = 10,000 + 3,600 − 3,000 = &lt;b&gt;10,600&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S4 ============ --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Domande 5–9 · slide 7–9&lt;/div&gt;&lt;h2&gt;Direct materials budget, pagamenti e accounts payable&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;direct materials budget&lt;/span&gt; (budget delle materie prime dirette) ragiona come il production budget, ma un livello più a monte: parte dalla produzione e calcola quanta materia &lt;em&gt;acquistare&lt;/em&gt;, tenendo conto delle scorte di &lt;span class=&quot;t&quot;&gt;raw materials&lt;/span&gt; (materie prime).&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Purchases (pounds) = Production needs + Desired ending RM inventory − Beginning RM inventory&lt;small&gt;Production needs = unità da produrre × pounds per unità. Le scorte sono il 10% del fabbisogno del mese dopo (dato d).&lt;/small&gt;&lt;/div&gt;

  &lt;h3&gt;Domanda 5 · Pounds da acquistare&lt;/h3&gt;
  &lt;div class=&quot;box stepper&quot; data-stepper&gt;
    &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;1&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;&lt;/span&gt;Required production in units of finished goods&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;2&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;×&lt;/span&gt;Units of raw materials needed per unit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;3&quot; class=&quot;sub&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;=&lt;/span&gt;Raw materials needed to meet production&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;4&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;+&lt;/span&gt;Desired ending raw materials inventory*&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;5&quot; class=&quot;sub&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;=&lt;/span&gt;Total raw materials needed&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;58,100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;6&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;−&lt;/span&gt;Beginning raw materials inventory**&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-step=&quot;7&quot; class=&quot;tot&quot;&gt;&lt;td&gt;&lt;span class=&quot;op&quot;&gt;=&lt;/span&gt;Raw materials to be purchased&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52,900&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div class=&quot;steptext&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;template&gt;&lt;p&gt;Si parte dalla produzione di luglio calcolata nel production budget: &lt;b&gt;10,400 unità&lt;/b&gt;. Attenzione: produzione, non vendite.&lt;/p&gt;&lt;p&gt;Ogni unità richiede &lt;b&gt;5 pounds&lt;/b&gt; di materia (dato d).&lt;/p&gt;&lt;p&gt;Per produrre servono 10,400 × 5 = &lt;b&gt;52,000 pounds&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;*La scorta finale di luglio è il 10% del fabbisogno di agosto, che il testo dà già: 61,000 × 10% = &lt;b&gt;6,100 pounds&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Fabbisogno totale: 52,000 + 6,100 = &lt;b&gt;58,100 pounds&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;**La scorta iniziale di luglio è la finale di giugno: 10% del fabbisogno di luglio, 52,000 × 10% = &lt;b&gt;5,200 pounds&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Da comprare: &lt;b&gt;52,900 pounds&lt;/b&gt;.&lt;/p&gt;&lt;/template&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;svg class=&quot;fig&quot; id=&quot;rmSvg&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Equazione del magazzino materie prime&quot;&gt;&lt;/svg&gt;
  &lt;p class=&quot;cap&quot;&gt;Stessa equazione del magazzino vista per i prodotti finiti, ora in pounds di materia prima.&lt;/p&gt;

  &lt;h3&gt;Domande 6–9 · dai pounds ai dollari&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-panel=&quot;t4a&quot;&gt;6 · Costo acquisti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;t4b&quot;&gt;7 · Pagamenti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;t4c&quot;&gt;8 · Accounts payable&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;t4d&quot;&gt;9 · Scorta RM&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;t4a&quot;&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;Units of raw materials to be purchased&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52,900&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Unit cost of raw materials&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$2.00&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cost of raw materials to be purchased&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$105,800&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;cap&quot;&gt;È il costo degli &lt;em&gt;acquisti&lt;/em&gt;, non della materia consumata: la materia usata in produzione vale 52,000 × $2 = $104,000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;t4b&quot; hidden&gt;
      &lt;p&gt;Le &lt;span class=&quot;t&quot;&gt;cash disbursements&lt;/span&gt; (uscite di cassa) per materia seguono la regola 30% nel mese / 70% nel mese dopo (dato e):&lt;/p&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;June purchases: $88,880 × 70%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$62,216&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;July purchases: $105,800 × 30%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31,740&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cash disbursements&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$93,956&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Attenzione:&lt;/b&gt; il costo degli acquisti di giugno ($88,880) è un&#x27;&lt;em&gt;ipotesi della domanda 7&lt;/em&gt;, da usare così com&#x27;è. &lt;span class=&quot;badge b-add&quot;&gt;nota aggiunta&lt;/span&gt; Ricalcolandolo dai dati (produzione giugno 10,720 unità → 53,600 pounds + 5,200 − 5,360 = 53,440 pounds × $2) si otterrebbero $106,880: il testo semplifica, quindi all&#x27;esame usa il dato fornito.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;t4c&quot; hidden&gt;
      &lt;p&gt;Gli &lt;span class=&quot;t&quot;&gt;accounts payable&lt;/span&gt; (debiti verso fornitori) sono gli acquisti ricevuti ma non ancora pagati. A fine luglio resta da pagare il 70% degli acquisti di luglio:&lt;/p&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;July purchases&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$105,800&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Percent unpaid&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;70%&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$74,060&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;t4d&quot; hidden&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;Ending raw materials inventory (pounds)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cost per pound&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$2.00&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Raw material inventory balance&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$12,200&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;cap&quot;&gt;Questo valore finisce nello stato patrimoniale previsionale tra le rimanenze di materie prime.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box tint&quot;&gt;
    &lt;h4&gt;Specchio: clienti e fornitori funzionano allo stesso modo&lt;/h4&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;ledger&quot;&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Lato vendite (§2)&lt;/th&gt;&lt;th&gt;Lato acquisti (§4)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Grandezza di competenza&lt;/td&gt;&lt;td&gt;Sales $700,000&lt;/td&gt;&lt;td&gt;Purchases $105,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Regola di cassa&lt;/td&gt;&lt;td&gt;40% subito, 60% mese dopo&lt;/td&gt;&lt;td&gt;30% subito, 70% mese dopo&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Movimento di cassa luglio&lt;/td&gt;&lt;td&gt;Collections $632,800 (entrata)&lt;/td&gt;&lt;td&gt;Disbursements $93,956 (uscita)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Saldo a fine mese&lt;/td&gt;&lt;td&gt;Accounts receivable $420,000 (attivo)&lt;/td&gt;&lt;td&gt;Accounts payable $74,060 (passivo)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Formula del saldo&lt;/td&gt;&lt;td&gt;vendite del mese × % non incassata&lt;/td&gt;&lt;td&gt;acquisti del mese × % non pagata&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché il fabbisogno di materia si calcola sulla produzione e non sulle vendite?&lt;/summary&gt;&lt;div&gt;Perché la materia si consuma quando si produce. Le 10,000 unità vendute a luglio includono 2,000 unità prodotte a giugno; le 10,400 unità prodotte a luglio richiedono materia comprata ora.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se i fornitori volessero il 50% subito, quali sarebbero i pagamenti di luglio?&lt;/summary&gt;&lt;div&gt;Giugno: 88,880 × 50% = 44,440; luglio: 105,800 × 50% = 52,900. Totale &lt;b&gt;$97,340&lt;/b&gt;; AP fine luglio = 52,900.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Da dove viene il dato «61,000 pounds» per agosto?&lt;/summary&gt;&lt;div&gt;Dal production budget di agosto: 12,000 + 20% × 13,000 − 20% × 12,000 = 12,200 unità × 5 pounds = 61,000 (vedi la scheda di verifica in §3).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S5 ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Domande 10–11 · slide 10&lt;/div&gt;&lt;h2&gt;Direct labor budget e unit product cost&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Domanda 10 · Direct labor cost&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;direct labor budget&lt;/span&gt; (budget della manodopera diretta) stima le ore e il costo del personale che lavora direttamente sul prodotto. Anche qui si parte dalla &lt;b&gt;produzione&lt;/b&gt;.&lt;/p&gt;
  &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Required production in units&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;× Direct labor hours per unit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.0&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total direct labor-hours needed&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;× Direct labor cost per hour&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$15&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total direct labor cost&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$312,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-add&quot;&gt;nota&lt;/span&gt; Le slide trattano la manodopera come costo che varia con le ore. Nella realtà spesso una parte è fissa (personale con orario garantito); qui l&#x27;ipotesi semplifica.&lt;/p&gt;

  &lt;h3&gt;Domanda 11 · Unit product cost&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;dl style=&quot;margin:0&quot;&gt;
    &lt;dt&gt;Manufacturing overhead (MOH)&lt;/dt&gt;&lt;dd&gt;i costi indiretti di produzione: energia degli impianti, manutenzione, materiali di consumo, supervisione… Non si attribuiscono a un&#x27;unità in modo diretto, quindi si ripartiscono con una &lt;span class=&quot;t&quot;&gt;allocation base&lt;/span&gt; (base di ripartizione), qui le direct labor-hours: $10 per ora.&lt;/dd&gt;
    &lt;dt&gt;Unit product cost&lt;/dt&gt;&lt;dd&gt;il costo pieno di produzione di un&#x27;unità: materie dirette + manodopera diretta + overhead. Comprende solo costi di &lt;em&gt;prodotto&lt;/em&gt;, mai le spese commerciali e amministrative. È l&#x27;impostazione dell&#x27;&lt;span class=&quot;t&quot;&gt;absorption costing&lt;/span&gt; (costo pieno industriale). &lt;span class=&quot;badge b-add&quot;&gt;spiegazione aggiunta&lt;/span&gt;&lt;/dd&gt;
  &lt;/dl&gt;&lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Di cosa è fatto il costo di un&#x27;unità? Clicca le barre&lt;/h4&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 640 120&quot; id=&quot;ucSvg&quot; role=&quot;img&quot; aria-label=&quot;Composizione del costo unitario di 60 dollari&quot;&gt;
      &lt;g class=&quot;seg&quot; data-k=&quot;dm&quot; tabindex=&quot;0&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;100&quot; height=&quot;56&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;$10&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;seg&quot; data-k=&quot;dl&quot; tabindex=&quot;0&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;120&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;56&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;$30&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;seg&quot; data-k=&quot;oh&quot; tabindex=&quot;0&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;420&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;$20&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;70&quot; y=&quot;96&quot;&gt;Direct materials&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;96&quot;&gt;Direct labor&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;96&quot;&gt;Manufacturing overhead&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;14&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink)&quot; font-weight=&quot;700&quot;&gt;= $60.00&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;steptext&quot; id=&quot;ucText&quot;&gt;Clicca un segmento per vedere da dove viene.&lt;/div&gt;
  &lt;/div&gt;
  &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Quantity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cost&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5 pounds&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$2 per pound&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10.00&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2 hours&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$15 per hour&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30.00&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2 hours&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10 per hour&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.00&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unit product cost&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$60.00&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;E se ci fosse overhead fisso?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;spiegazione aggiunta&lt;/span&gt; La domanda 11 esclude l&#x27;overhead fisso apposta. Se ci fosse, per assorbirlo nel costo unitario servirebbe un &lt;span class=&quot;t&quot;&gt;predetermined overhead rate&lt;/span&gt; (tasso predeterminato): overhead fisso budget ÷ ore budget. Ad esempio $41,600 di overhead fisso su 20,800 ore aggiungerebbero $2 per ora, cioè $4 a unità. Il costo unitario dipenderebbe allora dal volume di produzione, perché il fisso si spalma su più o meno unità.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Il costo della manodopera di luglio è $312,000, ma 10,000 unità × $30 fa $300,000. Perché la differenza?&lt;/summary&gt;&lt;div&gt;$312,000 riguarda le 10,400 unità &lt;em&gt;prodotte&lt;/em&gt;. I $300,000 sarebbero la manodopera contenuta nelle unità &lt;em&gt;vendute&lt;/em&gt; (entra nel COGS). I $12,000 di differenza sono le 400 unità in più finite in magazzino (400 × $30).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le spese di vendita da $1.80 per unità entrano nell&#x27;unit product cost?&lt;/summary&gt;&lt;div&gt;No. Sono &lt;span class=&quot;t&quot;&gt;period costs&lt;/span&gt;: costi del periodo, che vanno direttamente a conto economico, non nel costo del prodotto né nelle rimanenze.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se il salario salisse a $18 l&#x27;ora, quale sarebbe il costo unitario?&lt;/summary&gt;&lt;div&gt;DM 10 + DL 2 × 18 = 36 + MOH 20 = &lt;b&gt;$66&lt;/b&gt;. L&#x27;overhead non cambia: è legato alle ore, non alla tariffa.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S6 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Domande 12–14 · slide 4, 11–12&lt;/div&gt;&lt;h2&gt;Finished goods, cost of goods sold, gross margin e S&amp;amp;A&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;12 · Finished goods inventory&lt;/h4&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;Ending FG inventory (units)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Unit product cost&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$60.00&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Ending FG inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$144,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;cap&quot;&gt;Le unità in magazzino valgono il loro costo di produzione, non il prezzo di vendita.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;13 · COGS e gross margin&lt;/h4&gt;
      &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;td&gt;Unit sales × unit product cost: 10,000 × $60&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$700,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$100,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;dl style=&quot;margin:0&quot;&gt;
    &lt;dt&gt;Cost of goods sold (COGS)&lt;/dt&gt;&lt;dd&gt;il costo del venduto: «il costo di prodotto totale dei beni venduti, solo costi di prodotto, non spese di vendita e amministrative» (nota della slide 4). Si moltiplica per le unità &lt;b&gt;vendute&lt;/b&gt; (10,000), non per quelle prodotte.&lt;/dd&gt;
    &lt;dt&gt;Gross margin&lt;/dt&gt;&lt;dd&gt;margine lordo industriale = ricavi − cost of goods sold (slide 4). Qui $100,000, cioè $10 per unità ($70 − $60), il 14.3% delle vendite.&lt;/dd&gt;
  &lt;/dl&gt;&lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Dove finiscono i costi di produzione di luglio&lt;/h4&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Flusso dei costi di produzione tra magazzino e costo del venduto&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink)&quot;&gt;Beginning FG&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;2,000 × $60 = $120,000&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink)&quot;&gt;Costo produzione luglio&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;10,400 × $60 = $624,000&lt;/text&gt;
      &lt;path d=&quot;M190 55C230 55 230 95 255 95M190 135C230 135 230 95 255 95&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;255&quot; y=&quot;70&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink)&quot;&gt;Disponibile&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;$744,000&lt;/text&gt;
      &lt;path d=&quot;M395 95C425 95 425 55 450 55M395 95C425 95 425 135 450 135&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;450&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink)&quot;&gt;COGS → conto econ.&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;10,000 × $60 = $600,000&lt;/text&gt;
      &lt;rect x=&quot;450&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink)&quot;&gt;Ending FG → stato patr.&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;2,400 × $60 = $144,000&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;Ipotesi: anche la scorta iniziale è valutata $60 per unità&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-add&quot;&gt;schema aggiunto&lt;/span&gt; I costi di produzione &quot;aspettano&quot; in magazzino e diventano costo solo quando l&#x27;unità è venduta. Per questo il COGS ($600,000) è diverso dai costi sostenuti nel mese ($624,000).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Domanda 14 · Selling and administrative expense&lt;/h3&gt;
  &lt;table class=&quot;ledger&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Budgeted unit sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;× Variable S&amp;amp;A expense per unit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$1.80&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total variable expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$18,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;+ Fixed S&amp;amp;A expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total selling and administrative expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$78,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p&gt;Le spese S&amp;amp;A variabili dipendono dalle unità &lt;b&gt;vendute&lt;/b&gt; (provvigioni, spedizioni), non da quelle prodotte. Sono &lt;span class=&quot;t&quot;&gt;period costs&lt;/span&gt;: vanno a conto economico nel mese, senza passare dal magazzino.&lt;/p&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Il conto economico di luglio: due formati&lt;/h4&gt;
    &lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;&lt;span class=&quot;badge b-add&quot;&gt;estensione&lt;/span&gt; Le slide si fermano a gross margin e S&amp;amp;A; mettendoli insieme si ottiene il &lt;span class=&quot;t&quot;&gt;net operating income&lt;/span&gt; (reddito operativo).&lt;/p&gt;
    &lt;div style=&quot;display:flex;gap:8px;margin-bottom:10px&quot;&gt;&lt;button class=&quot;btn on&quot; data-fmt=&quot;abs&quot;&gt;Absorption (per funzione)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-fmt=&quot;con&quot;&gt;Contribution (per variabilità)&lt;/button&gt;&lt;/div&gt;
    &lt;table class=&quot;ledger&quot; id=&quot;fmtAbs&quot;&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$700,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Selling &amp;amp; administrative expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;78,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$22,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;table class=&quot;ledger&quot; id=&quot;fmtCon&quot; hidden&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$700,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Variable production costs (10,000 × $60)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Variable S&amp;amp;A (10,000 × $1.80)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Contribution margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;82,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Fixed S&amp;amp;A&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$22,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;p class=&quot;cap&quot;&gt;Qui i due formati danno lo stesso reddito perché non c&#x27;è overhead fisso di produzione: nessun costo fisso resta &quot;parcheggiato&quot; nelle rimanenze.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché il COGS usa 10,000 unità e non 10,400?&lt;/summary&gt;&lt;div&gt;Perché il cost of goods sold riguarda le unità vendute. Le unità prodotte e non vendute restano in magazzino come attività (finished goods inventory).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le spese S&amp;amp;A fisse di $60,000 cambierebbero se a luglio si vendessero 12,000 unità?&lt;/summary&gt;&lt;div&gt;No, sono fisse nel mese. Cambierebbe solo la parte variabile: 12,000 × 1.80 = 21,600, totale $81,600.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto vale il gross margin per unità e cosa deve coprire?&lt;/summary&gt;&lt;div&gt;$70 − $60 = $10 a unità. Deve coprire le spese S&amp;amp;A ($7.80 a unità a questo volume: 78,000 ÷ 10,000) e lasciare un utile ($2.20 a unità, $22,000 in totale).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S7 ============ --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Tutto insieme · simulatore&lt;/div&gt;&lt;h2&gt;Il master budget di luglio in un colpo d&#x27;occhio&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Ogni cursore è un dato del testo. Muovendolo, vedi quali delle 14 risposte cambiano (bordo colorato) e quali no: è il modo più rapido per capire le dipendenze della mappa iniziale. Con i valori di partenza ritrovi le soluzioni delle slide.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vP&quot;&gt;Prezzo di vendita&lt;/label&gt;&lt;input id=&quot;vP&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;90&quot; step=&quot;1&quot; value=&quot;70&quot;&gt;&lt;output data-f=&quot;usd&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vQ&quot;&gt;Unità vendute a luglio&lt;/label&gt;&lt;input id=&quot;vQ&quot; type=&quot;range&quot; min=&quot;8000&quot; max=&quot;14000&quot; step=&quot;200&quot; value=&quot;10000&quot;&gt;&lt;output data-f=&quot;int&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vC&quot;&gt;% incassata nel mese&lt;/label&gt;&lt;input id=&quot;vC&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output data-f=&quot;pct&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vF&quot;&gt;Scorta FG (% mese dopo)&lt;/label&gt;&lt;input id=&quot;vF&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output data-f=&quot;pct&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vR&quot;&gt;Scorta RM (% mese dopo)&lt;/label&gt;&lt;input id=&quot;vR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;output data-f=&quot;pct&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vS&quot;&gt;% acquisti pagata nel mese&lt;/label&gt;&lt;input id=&quot;vS&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;output data-f=&quot;pct&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vW&quot;&gt;Salario orario&lt;/label&gt;&lt;input id=&quot;vW&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;25&quot; step=&quot;1&quot; value=&quot;15&quot;&gt;&lt;output data-f=&quot;usd&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vO&quot;&gt;Overhead variabile per ora&lt;/label&gt;&lt;input id=&quot;vO&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output data-f=&quot;usd&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p style=&quot;margin:10px 0 0&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;simReset&quot;&gt;Ripristina i dati delle slide&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;kpis&quot; id=&quot;simOut&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;cap&quot;&gt;Fissi: vendite giugno 8,400, agosto 12,000, settembre 13,000; 5 pounds a $2; 2 ore per unità; acquisti di giugno $88,880; S&amp;amp;A $1.80 + $60,000. Il fabbisogno di agosto (61,000 pounds nel testo) è ricalcolato dalla produzione di agosto. Il net operating income è un&#x27;estensione, non è nelle slide.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Gli errori più comuni in questo esercizio&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;Usare le &lt;b&gt;vendite&lt;/b&gt; invece della &lt;b&gt;produzione&lt;/b&gt; per materie prime e manodopera (domande 5 e 10).&lt;/li&gt;
      &lt;li&gt;Usare la &lt;b&gt;produzione&lt;/b&gt; invece delle &lt;b&gt;vendite&lt;/b&gt; per COGS e spese S&amp;amp;A variabili (domande 13 e 14).&lt;/li&gt;
      &lt;li&gt;Confondere scorta iniziale e finale: la iniziale di luglio è la finale di giugno, quindi si calcola sulle vendite (o sul fabbisogno) di &lt;em&gt;luglio&lt;/em&gt;.&lt;/li&gt;
      &lt;li&gt;Calcolare gli incassi di luglio con le sole vendite di luglio, dimenticando il 60% di giugno.&lt;/li&gt;
      &lt;li&gt;Mettere le spese di vendita nell&#x27;unit product cost: sono period costs.&lt;/li&gt;
      &lt;li&gt;Valutare le rimanenze al prezzo di vendita ($70) invece che al costo ($60).&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · parte 7&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Nel simulatore, alzando la % incassata nel mese, quali risposte cambiano?&lt;/summary&gt;&lt;div&gt;Solo cash collections (2) e accounts receivable (3). Nessun costo, margine o quantità dipende dai tempi di incasso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;E alzando il salario orario?&lt;/summary&gt;&lt;div&gt;Direct labor cost (10), unit product cost (11) e, a cascata, ending FG inventory (12), COGS e gross margin (13). Quantità, acquisti e incassi restano uguali.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale dato influenza il maggior numero di risposte?&lt;/summary&gt;&lt;div&gt;Le unità vendute di luglio: toccano vendite, incassi, crediti, produzione, materia, pagamenti, debiti, manodopera, COGS, margine e S&amp;amp;A. È il motivo per cui il sales budget sta in cima alla catena.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;sec-no&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;qs&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Testi e risorse&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide di questa esercitazione &lt;b&gt;non citano&lt;/b&gt; autori, testi, norme, standard o siti: contengono solo il testo del problema e le soluzioni. Qui sotto trovi due risorse di studio cercate sul web per approfondire il master budget. Sono &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;, non materiale del corso.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer · &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.mheducation.ca/managerial-accounting-for-managers-ise-9781265617660-can&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;editore: Managerial Accounting for Managers, ISE&lt;/a&gt;&lt;/p&gt;
    &lt;p&gt;Manuale molto diffuso di contabilità direzionale. Nelle edizioni recenti il capitolo 8, &lt;i&gt;Master Budgeting&lt;/i&gt;, presenta la stessa sequenza dell&#x27;esercizio: sales budget con schedule of expected cash collections, production budget, direct materials budget, direct labor budget, manufacturing overhead budget, S&amp;amp;A budget, cash budget e prospetti previsionali. Il problema &quot;Morganton Company&quot;, con gli stessi numeri, circola online associato a questo testo. Le slide però non indicano la fonte, quindi l&#x27;attribuzione è probabile, non certa.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; ha la stessa impostazione e terminologia dell&#x27;esercitazione e molti esercizi simili per allenarsi.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;h4&gt;OpenStax · &lt;i&gt;Principles of Accounting, Volume 2: Managerial Accounting&lt;/i&gt;&lt;/h4&gt;
    &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org: Principles of Managerial Accounting&lt;/a&gt;&lt;/p&gt;
    &lt;p&gt;Manuale universitario gratuito e open access. Il capitolo 7, &lt;i&gt;Budgeting&lt;/i&gt;, tratta nella sezione 7.2 gli operating budgets (production, direct materials, direct labor, manufacturing overhead, selling and administrative) e nella 7.3 i financial budgets, con i prospetti di incassi e pagamenti.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; si consulta online senza costi e ha esempi svolti con la stessa logica (scorte come % del mese successivo, incassi ripartiti su più mesi).&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;

  }
  $(&quot;#fgPct&quot;).addEventListener(&quot;input&quot;,drawProd);drawProd();

  /* §4 materie prime */
  drawBal($(&quot;#rmSvg&quot;),[{v:5200,l:&quot;Beginning RM&quot;,f:&quot;var(--slate-bg)&quot;},{v:52900,l:&quot;Purchases (pounds)&quot;,f:&quot;var(--brick)&quot;,dark:true}],[{v:52000,l:&quot;Used in production&quot;,f:&quot;var(--ochre)&quot;,dark:true},{v:6100,l:&quot;Ending RM&quot;,f:&quot;var(--acc-bg)&quot;}],&quot;pounds&quot;);

  /* §5 costo unitario */
  var ucT={dm:&quot;&lt;b&gt;Direct materials $10&lt;/b&gt;: 5 pounds × $2.00 per pound (dato d). È il costo della materia contenuta in un&#x27;unità.&quot;,
    dl:&quot;&lt;b&gt;Direct labor $30&lt;/b&gt;: 2 direct labor-hours × $15 per ora (dato f). È la voce più pesante: metà del costo unitario.&quot;,
    oh:&quot;&lt;b&gt;Manufacturing overhead $20&lt;/b&gt;: 2 direct labor-hours × $10 per ora (domanda 11). L&#x27;overhead si ripartisce in base alle ore di manodopera; non c&#x27;è overhead fisso.&quot;};
  $$(&quot;#ucSvg .seg&quot;).forEach(function(g){
    function s(){$(&quot;#ucText&quot;).innerHTML=ucT[g.getAttribute(&quot;data-k&quot;)];$$(&quot;#ucSvg .seg rect&quot;).forEach(function(r){r.style.opacity=r.parentNode===g?1:.45})}
    g.addEventListener(&quot;click&quot;,s);g.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();s()}});
  });

  /* §6 formato conto economico */
  $$(&quot;[data-fmt]&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){
    $$(&quot;[data-fmt]&quot;).forEach(function(o){o.classList.toggle(&quot;on&quot;,o===b)});
    $(&quot;#fmtAbs&quot;).hidden=b.getAttribute(&quot;data-fmt&quot;)!==&quot;abs&quot;;$(&quot;#fmtCon&quot;).hidden=b.getAttribute(&quot;data-fmt&quot;)!==&quot;con&quot;;
  })});

  /* §7 simulatore */
  var ids=[&quot;vP&quot;,&quot;vQ&quot;,&quot;vC&quot;,&quot;vF&quot;,&quot;vR&quot;,&quot;vS&quot;,&quot;vW&quot;,&quot;vO&quot;],base={};
  ids.forEach(function(id){base[id]=$(&quot;#&quot;+id).value});
  function calc(v){
    var P=v.vP,Q=v.vQ,c=v.vC/100,f=v.vF/100,r=v.vR/100,s=v.vS/100,W=v.vW,O=v.vO,A=12000,S=13000;
    var sales=Q*P,coll=8400*P*(1-c)+sales*c,ar=sales*(1-c);
    var prod=Q+f*A-f*Q,prodAug=A+f*S-f*A,need=prod*5,endRM=r*prodAug*5,begRM=r*need,lbs=need+endRM-begRM,cost=lbs*2;
    var disb=88880*(1-s)+cost*s,ap=cost*(1-s),rmInv=endRM*2,dl=prod*2*W,uc=10+2*W+2*O,fg=f*A*uc,cogs=Q*uc,gm=sales-cogs,sa=Q*1.8+60000;
    return [[&quot;1 · Budgeted sales&quot;,usd(sales)],[&quot;2 · Cash collections&quot;,usd(coll)],[&quot;3 · Accounts receivable&quot;,usd(ar)],[&quot;4 · Required production&quot;,int(prod)+&quot; u.&quot;],[&quot;5 · RM da acquistare&quot;,int(lbs)+&quot; lb&quot;],[&quot;6 · Costo acquisti RM&quot;,usd(cost)],[&quot;7 · Pagamenti RM&quot;,usd(disb)],[&quot;8 · Accounts payable&quot;,usd(ap)],[&quot;9 · Scorta RM&quot;,usd(rmInv)],[&quot;10 · Direct labor cost&quot;,usd(dl)],[&quot;11 · Unit product cost&quot;,usd(uc,2)],[&quot;12 · Ending FG inventory&quot;,usd(fg)],[&quot;13 · COGS / Gross margin&quot;,usd(cogs)+&quot; / &quot;+usd(gm)],[&quot;14 · Total S&amp;A&quot;,usd(sa)],[&quot;Net operating income*&quot;,usd(gm-sa)]];
  }
  function vals(){var o={};ids.forEach(function(id){o[id]=+$(&quot;#&quot;+id).value});return o}
  var baseOut=calc((function(){var o={};ids.forEach(function(id){o[id]=+base[id]});return o})());
  function sim(){
    ids.forEach(function(id){var i=$(&quot;#&quot;+id),o=i.nextElementSibling,fm=o.getAttribute(&quot;data-f&quot;);o.textContent=fm===&quot;usd&quot;?&quot;$&quot;+i.value:fm===&quot;pct&quot;?i.value+&quot;%&quot;:int(+i.value)});
    var out=calc(vals()),box=$(&quot;#simOut&quot;);box.innerHTML=&quot;&quot;;
    out.forEach(function(k,j){var d=document.createElement(&quot;div&quot;);d.className=&quot;kpi&quot;+(k[1]!==baseOut[j][1]?&quot; ch&quot;:&quot;&quot;);d.innerHTML=&quot;&lt;span&gt;&quot;+k[0].replace(&quot;&amp;&quot;,&quot;&amp;amp;&quot;)+&quot;&lt;/span&gt;&lt;b&gt;&quot;+k[1]+&quot;&lt;/b&gt;&quot;+(k[1]!==baseOut[j][1]?&quot;&lt;small&gt;slide: &quot;+baseOut[j][1]+&quot;&lt;/small&gt;&quot;:&quot;&quot;);box.appendChild(d)});
  }
  ids.forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,sim)});
  $(&quot;#simReset&quot;).addEventListener(&quot;click&quot;,function(){ids.forEach(function(id){$(&quot;#&quot;+id).value=base[id]});sim()});
  sim();
})();
&lt;/script&gt;
