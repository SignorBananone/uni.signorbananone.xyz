          &lt;text x=&quot;400&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14.5&quot;&gt;Flexible Budget Performance Report&lt;/text&gt;
          &lt;text x=&quot;400&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--ink2)&quot;&gt;tutto insieme, con la riconciliazione&lt;/text&gt;&lt;/a&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Mappa concettuale — clicca un riquadro per andare alla sezione. Le frecce tratteggiate indicano il confronto, quelle piene il calcolo.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
&lt;/header&gt;

  &lt;/div&gt;

&lt;main&gt;
&lt;!-- ============ 1 CONCETTI ============ --&gt;
&lt;section id=&quot;s1&quot; data-hue=&quot;sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 1&lt;/div&gt;
  &lt;h2&gt;Le basi: budget, attività e comportamento dei costi&lt;/h2&gt;
  &lt;p&gt;Le slide sono le soluzioni di un esercizio e danno per scontata la teoria. Qui la ricostruiamo: servono tre idee — &lt;b&gt;che cos&#x27;è un budget&lt;/b&gt;, &lt;b&gt;qual è la misura di attività&lt;/b&gt; e &lt;b&gt;come si comportano costi e ricavi&lt;/b&gt; quando l&#x27;attività cambia.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Budget&lt;/b&gt; — piano quantitativo, espresso in moneta, per un periodo futuro (qui: il mese di maggio). Serve a &lt;i&gt;pianificare&lt;/i&gt; prima e a &lt;i&gt;controllare&lt;/i&gt; dopo, confrontando ciò che è successo con ciò che si era previsto.&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Measure of activity&lt;/b&gt; (misura di attività, o &lt;i&gt;cost driver&lt;/i&gt;) — la grandezza che “muove” costi e ricavi. Per Adger è il numero di &lt;span class=&quot;term&quot;&gt;customers served&lt;/span&gt; (clienti serviti), indicato con &lt;b&gt;q&lt;/b&gt;. Nel report delle slide: “Customers (q)”.&lt;/div&gt;

  &lt;h3&gt;Tre comportamenti di costo&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 220 150&quot; aria-label=&quot;Costo fisso&quot;&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;210&quot; y2=&quot;130&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;30&quot; y2=&quot;15&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;70&quot; x2=&quot;205&quot; y2=&quot;70&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;205&quot; y=&quot;145&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--ink2)&quot;&gt;q&lt;/text&gt;
        &lt;text x=&quot;36&quot; y=&quot;62&quot; font-size=&quot;11.5&quot;&gt;y = a&lt;/text&gt;
      &lt;/svg&gt;
      &lt;h4&gt;&lt;span class=&quot;term&quot;&gt;Fixed cost&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Costo fisso: non cambia al variare di q (nell&#x27;intervallo rilevante). Adger: &lt;b&gt;other expenses 36.000 $&lt;/b&gt; al mese.&lt;/p&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 220 150&quot; aria-label=&quot;Costo variabile&quot;&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;210&quot; y2=&quot;130&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;30&quot; y2=&quot;15&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;200&quot; y2=&quot;25&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;205&quot; y=&quot;145&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--ink2)&quot;&gt;q&lt;/text&gt;
        &lt;text x=&quot;120&quot; y=&quot;100&quot; font-size=&quot;11.5&quot;&gt;y = b·q&lt;/text&gt;
      &lt;/svg&gt;
      &lt;h4&gt;&lt;span class=&quot;term&quot;&gt;Variable cost&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Costo variabile: proporzionale a q, con un costo unitario &lt;b&gt;b&lt;/b&gt; costante. Adger: &lt;b&gt;travel expenses 600 $&lt;/b&gt; per cliente.&lt;/p&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 220 150&quot; aria-label=&quot;Costo misto&quot;&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;210&quot; y2=&quot;130&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;130&quot; x2=&quot;30&quot; y2=&quot;15&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;88&quot; x2=&quot;205&quot; y2=&quot;88&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;88&quot; x2=&quot;200&quot; y2=&quot;22&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;205&quot; y=&quot;145&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--ink2)&quot;&gt;q&lt;/text&gt;
        &lt;text x=&quot;36&quot; y=&quot;104&quot; font-size=&quot;11&quot; style=&quot;fill:var(--ink2)&quot;&gt;a (parte fissa)&lt;/text&gt;
        &lt;text x=&quot;100&quot; y=&quot;44&quot; font-size=&quot;11.5&quot;&gt;y = a + b·q&lt;/text&gt;
      &lt;/svg&gt;
      &lt;h4&gt;&lt;span class=&quot;term&quot;&gt;Mixed cost&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Costo misto (semi-variabile): una parte fissa + una variabile. Adger: &lt;b&gt;salaries &amp;amp; wages 50.000 $ + 1.100 $ per cliente&lt;/b&gt;.&lt;/p&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;Cost formula: &amp;nbsp; &lt;span class=&quot;v&quot;&gt;y&lt;/span&gt; = &lt;span class=&quot;v&quot;&gt;a&lt;/span&gt; + &lt;span class=&quot;v&quot;&gt;b&lt;/span&gt; · &lt;span class=&quot;v&quot;&gt;q&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;muted&quot; style=&quot;text-align:center;margin-top:-6px&quot;&gt;a = &lt;span class=&quot;term&quot;&gt;fixed element per month&lt;/span&gt; · b = &lt;span class=&quot;term&quot;&gt;variable element per customer served&lt;/span&gt; · q = livello di attività&lt;/p&gt;
  &lt;p&gt;Le slide usano proprio questi termini: in ogni calcolo compaiono “&lt;i&gt;Variable element per customer served (a)&lt;/i&gt;” e “&lt;i&gt;Fixed element per month&lt;/i&gt;”. Attenzione: nelle slide la lettera &lt;b&gt;(a)&lt;/b&gt; indica l&#x27;elemento &lt;i&gt;variabile&lt;/i&gt; e &lt;b&gt;(b)&lt;/b&gt; l&#x27;attività, perché sono solo etichette delle righe del calcolo. Qui invece usiamo la notazione di manuale, a = fisso e b = variabile. Anche i ricavi seguono una formula: &lt;b&gt;revenue = 5.000 $ · q&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;Tre colonne, tre “mondi”&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Planning budget&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Flexible budget&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Actual results&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;&lt;span class=&quot;term&quot;&gt;Planning budget&lt;/span&gt;&lt;/b&gt; (detto anche &lt;i&gt;static budget&lt;/i&gt;): il budget preparato &lt;b&gt;prima&lt;/b&gt; del periodo, sul livello di attività &lt;b&gt;previsto&lt;/b&gt;. Adger aveva previsto &lt;b&gt;30 clienti&lt;/b&gt;. È “statico” perché non si adatta a ciò che poi accade davvero.&lt;/p&gt;
      &lt;p&gt;Limite: confrontarlo direttamente con i risultati effettivi mescola due cose diverse, cioè “abbiamo lavorato di più o di meno” e “abbiamo speso bene o male”.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;&lt;span class=&quot;term&quot;&gt;Flexible budget&lt;/span&gt;&lt;/b&gt;: stima di quanto ricavi e costi &lt;b&gt;avrebbero dovuto essere&lt;/b&gt; dato il livello di attività &lt;b&gt;effettivo&lt;/b&gt;. Si prepara &lt;b&gt;dopo&lt;/b&gt;, applicando le stesse cost formulas a q effettivo: per Adger &lt;b&gt;35 clienti&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;È il termine di paragone “giusto” per giudicare i manager sui costi: confronta il costo effettivo con quello che si sarebbe dovuto sostenere &lt;i&gt;per quel volume&lt;/i&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;&lt;span class=&quot;term&quot;&gt;Actual results&lt;/span&gt;&lt;/b&gt;: i ricavi e i costi effettivamente registrati in contabilità a fine mese. Non derivano da formule, sono un dato.&lt;/p&gt;
      &lt;p&gt;Adger a maggio: 35 clienti, ricavi 160.000 $, costi 141.500 $, &lt;span class=&quot;term&quot;&gt;net operating income&lt;/span&gt; (reddito operativo netto, NOI) 18.500 $.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Favorable (F) o Unfavorable (U)?&lt;/h3&gt;
  &lt;p&gt;Una &lt;span class=&quot;term&quot;&gt;variance&lt;/span&gt; (scostamento) è la differenza tra due colonne. Si scrive sempre &lt;b&gt;in valore assoluto&lt;/b&gt; con l&#x27;etichetta F o U, come nelle slide (“15,000 U”, “500 F”).&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ricavi&lt;/h4&gt;&lt;p&gt;Più alti del termine di confronto → &lt;span class=&quot;chip F&quot;&gt;F&lt;/span&gt;&lt;br&gt;Più bassi → &lt;span class=&quot;chip U&quot;&gt;U&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costi&lt;/h4&gt;&lt;p&gt;Più bassi del termine di confronto → &lt;span class=&quot;chip F&quot;&gt;F&lt;/span&gt;&lt;br&gt;Più alti → &lt;span class=&quot;chip U&quot;&gt;U&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Regola mentale: F = l&#x27;effetto sul reddito è positivo; U = l&#x27;effetto sul reddito è negativo.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Perché il planning budget non basta per valutare i costi di maggio?&lt;/summary&gt;&lt;div&gt;Perché è costruito su 30 clienti, ma i clienti effettivi sono stati 35. I costi variabili &lt;i&gt;dovevano&lt;/i&gt; essere più alti, quindi un confronto diretto farebbe sembrare “cattiva gestione” un semplice aumento di volume.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Classifica: salaries &amp;amp; wages, travel expenses, other expenses.&lt;/summary&gt;&lt;div&gt;Salaries &amp;amp; wages = &lt;b&gt;mixed&lt;/b&gt; (50.000 + 1.100q); travel = &lt;b&gt;variable&lt;/b&gt; (600q); other = &lt;b&gt;fixed&lt;/b&gt; (36.000).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Un costo effettivo di 19.000 contro un budget di 21.000: F o U?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;2.000 F&lt;/b&gt;: si è speso meno del previsto, quindi l&#x27;effetto sul reddito è positivo (è la Q8).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 DATI ============ --&gt;
&lt;section id=&quot;s2&quot; data-hue=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 2&lt;/div&gt;
  &lt;h2&gt;I dati di Adger Corporation&lt;/h2&gt;
  &lt;p&gt;La slide 2 chiede di rispondere a &lt;b&gt;15 domande&lt;/b&gt; e di preparare il &lt;b&gt;Flexible Budget Performance Report&lt;/b&gt;. Il testo dell&#x27;esercizio non è nel PDF delle soluzioni: i dati sotto sono &lt;b&gt;ricostruiti dalle soluzioni&lt;/b&gt; (slide 3–18), e tornano tutti.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:.4em&quot;&gt;Cost formulas&lt;/h3&gt;
      &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Fisso / mese&lt;/th&gt;&lt;th&gt;Variabile / cliente&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;5.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Employee salaries &amp;amp; wages&lt;/td&gt;&lt;td&gt;50.000&lt;/td&gt;&lt;td&gt;1.100&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;600&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:.4em&quot;&gt;Attività e risultati di maggio&lt;/h3&gt;
      &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dato&lt;/th&gt;&lt;th&gt;Valore&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Clienti pianificati&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Clienti effettivi&lt;/td&gt;&lt;td&gt;35&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Revenue effettivo&lt;/td&gt;&lt;td&gt;160.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Salaries &amp;amp; wages effettivi&lt;/td&gt;&lt;td&gt;88.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Travel effettivi&lt;/td&gt;&lt;td&gt;19.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Other effettivi&lt;/td&gt;&lt;td&gt;34.500&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Importi in dollari ($), come nelle slide. Qui uso il punto per le migliaia (uso italiano), le slide usano la virgola.&lt;/p&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Mappa delle 15 domande.&lt;/b&gt; Q1–Q5 flexible budget · Q6–Q9 revenue e spending variances · Q10–Q13 planning budget · Q14–Q15 activity variances · ultima slide: performance report completo.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Quale informazione cambia tra planning e flexible budget? Quale resta uguale?&lt;/summary&gt;&lt;div&gt;Cambia solo &lt;b&gt;q&lt;/b&gt; (30 → 35). Le cost formulas, cioè i 5.000, 1.100, 600, 50.000 e 36.000, restano identiche.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Qual è il margine di contribuzione per cliente di Adger?&lt;/summary&gt;&lt;div&gt;5.000 − 1.100 − 600 = &lt;b&gt;3.300 $&lt;/b&gt; per cliente. Non è nelle slide, ma aiuta molto: ogni cliente in più aggiunge 3.300 $ di reddito nel flexible budget.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 FLEXIBLE ============ --&gt;
&lt;section id=&quot;s3&quot; data-hue=&quot;ochre&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 3 · Q1–Q5&lt;/div&gt;
  &lt;h2&gt;Costruire il flexible budget (q = 35)&lt;/h2&gt;
  &lt;p&gt;Regola unica: &lt;b&gt;applica ogni cost formula al livello di attività effettivo&lt;/b&gt;. Scorri i passi.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;div class=&quot;nav&quot;&gt;&lt;button data-prev&gt;← Indietro&lt;/button&gt; &lt;button data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q1 · Revenue&lt;/h4&gt;
      &lt;p&gt;Variable element per customer served × actual activity&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;5.000 × 35 = &lt;b&gt;175.000 $&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;I ricavi sono puramente variabili: ogni cliente servito porta 5.000 $.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q2 · Employee salaries &amp;amp; wages&lt;/h4&gt;
      &lt;p&gt;Costo misto: parte variabile + parte fissa.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;1.100 × 35 = 38.500 &amp;nbsp;→&amp;nbsp; 38.500 + 50.000 = &lt;b&gt;88.500 $&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;Errore tipico: dimenticare i 50.000 fissi o, al contrario, moltiplicarli per q.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q3 · Travel expenses&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;600 × 35 = &lt;b&gt;21.000 $&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;Puramente variabile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q4 · Other expenses&lt;/h4&gt;
      &lt;p&gt;Costo fisso: nel flexible budget si inserisce il &lt;i&gt;fixed element per month&lt;/i&gt;, qualunque sia q.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;36.000 $&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;Un costo fisso è lo stesso in planning e flexible budget: per questo la sua activity variance sarà 0 (Q15).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q5 · Net operating income&lt;/h4&gt;
      &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;175.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Employee salaries &amp;amp; wages&lt;/td&gt;&lt;td&gt;88.500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;21.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;td&gt;145.500&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;29.500&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;Verifica rapida col margine: 3.300 × 35 − (50.000 + 36.000) = 115.500 − 86.000 = 29.500 ✓&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Laboratorio: il flexible budget si “flette”&lt;/h3&gt;
  &lt;p&gt;Sposta il cursore: le cost formulas restano fisse, cambia solo q. Le linee mostrano revenue e total expenses. Il punto in cui si incrociano è il pareggio (break-even).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;qr&quot;&gt;Clienti serviti (q)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qr&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;35&quot;&gt;&lt;span class=&quot;out num&quot; id=&quot;qv&quot;&gt;35&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;kpis&quot;&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Revenue&lt;/span&gt;&lt;b class=&quot;num&quot; id=&quot;k-rev&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Salaries &amp;amp; wages&lt;/span&gt;&lt;b class=&quot;num&quot; id=&quot;k-sal&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Travel&lt;/span&gt;&lt;b class=&quot;num&quot; id=&quot;k-tra&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Other&lt;/span&gt;&lt;b class=&quot;num&quot; id=&quot;k-oth&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;NOI&lt;/span&gt;&lt;b class=&quot;num&quot; id=&quot;k-noi&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;flexchart&quot; viewBox=&quot;0 0 620 300&quot; aria-label=&quot;Grafico revenue e costi totali al variare di q&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;muted&quot; id=&quot;flexnote&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Se Adger avesse servito 40 clienti, quanto sarebbero i salaries &amp;amp; wages nel flexible budget?&lt;/summary&gt;&lt;div&gt;50.000 + 1.100 × 40 = &lt;b&gt;94.000 $&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; E il NOI del flexible budget a 40 clienti?&lt;/summary&gt;&lt;div&gt;3.300 × 40 − 86.000 = &lt;b&gt;46.000 $&lt;/b&gt; (prova col cursore).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Perché “other expenses” vale 36.000 sia a 30 sia a 35 clienti?&lt;/summary&gt;&lt;div&gt;Perché è un costo fisso: la sua cost formula non contiene q.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 4 SPENDING ============ --&gt;
&lt;section id=&quot;s4&quot; data-hue=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 4 · Q6–Q9&lt;/div&gt;
  &lt;h2&gt;Revenue variance e spending variances&lt;/h2&gt;
  &lt;p&gt;Ora confrontiamo &lt;b&gt;actual results&lt;/b&gt; e &lt;b&gt;flexible budget&lt;/b&gt;. Hanno &lt;b&gt;lo stesso q (35)&lt;/b&gt;, quindi l&#x27;effetto volume è già eliminato: quello che resta dipende da &lt;b&gt;prezzi, efficienza e controllo della spesa&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Revenue / Spending variance = &lt;span class=&quot;v&quot;&gt;Actual results&lt;/span&gt; − &lt;span class=&quot;v&quot;&gt;Flexible budget&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Revenue variance&lt;/b&gt; — differenza tra ricavi effettivi e ricavi che si sarebbero dovuti ottenere al livello di attività effettivo. Ricavi effettivi più alti → F.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Spending variance&lt;/b&gt; — differenza tra costo effettivo e costo che si sarebbe dovuto sostenere al livello di attività effettivo. Costo effettivo più basso → F.&lt;/div&gt;
  &lt;/div&gt;

      &lt;tr&gt;&lt;td&gt;Q8 · Travel expenses&lt;/td&gt;&lt;td&gt;19.000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;2.000 F&lt;/td&gt;&lt;td&gt;21.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q9 · Other expenses&lt;/td&gt;&lt;td&gt;34.500&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;1.500 F&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;/tr&gt;

  &lt;details&gt;&lt;summary&gt;Come leggere i 15.000 U sui ricavi&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Con 35 clienti Adger &lt;i&gt;avrebbe dovuto&lt;/i&gt; incassare 175.000 $ (5.000 a cliente). Ne ha incassati 160.000, cioè in media &lt;b&gt;≈ 4.571 $ per cliente&lt;/b&gt; (160.000 / 35). Il volume non c&#x27;entra, perché è lo stesso: il problema è il &lt;b&gt;prezzo medio&lt;/b&gt; ottenuto, per esempio per sconti o per un mix di servizi più economici.&lt;/p&gt;
    &lt;p class=&quot;muted&quot;&gt;Il calcolo del ricavo medio e le possibili cause sono un&#x27;interpretazione aggiunta, non sono nelle slide.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché un costo fisso può avere una spending variance?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;“Fisso” vuol dire che non dipende da q, non che sia impossibile spendere di più o di meno. Gli other expenses erano previsti a 36.000 e sono stati 34.500: &lt;b&gt;1.500 F&lt;/b&gt;. Una spending variance su un costo fisso misura solo il controllo della spesa.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Mini-gioco: F o U?&lt;/h3&gt;
  &lt;div class=&quot;card&quot; id=&quot;fu-game&quot;&gt;
    &lt;p class=&quot;muted&quot;&gt;Scegli l&#x27;etichetta corretta per ciascun confronto &lt;i&gt;actual vs flexible&lt;/i&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Qual è la spending variance totale delle spese?&lt;/summary&gt;&lt;div&gt;500 F + 2.000 F + 1.500 F = &lt;b&gt;4.000 F&lt;/b&gt; (141.500 effettivi contro 145.500 del flexible budget).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Effetto netto di revenue e spending variances sul NOI?&lt;/summary&gt;&lt;div&gt;15.000 U − 4.000 F = &lt;b&gt;11.000 U&lt;/b&gt;: infatti il NOI effettivo (18.500) è inferiore a quello del flexible budget (29.500) di 11.000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Perché confrontare i travel effettivi (19.000) con il planning budget (18.000) sarebbe fuorviante?&lt;/summary&gt;&lt;div&gt;Darebbe 1.000 U, come se si fosse speso troppo. In realtà, con 35 clienti, la spesa “giusta” era 21.000: Adger ha speso &lt;b&gt;2.000 in meno&lt;/b&gt; del dovuto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 PLANNING ============ --&gt;
&lt;section id=&quot;s5&quot; data-hue=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 5 · Q10–Q13&lt;/div&gt;
  &lt;h2&gt;Il planning budget (q = 30)&lt;/h2&gt;
  &lt;p&gt;Stesse cost formulas, ma con l&#x27;attività &lt;b&gt;pianificata&lt;/b&gt;: 30 clienti. È il budget approvato a inizio periodo.&lt;/p&gt;
  &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th&gt;Planning (q=30)&lt;/th&gt;&lt;th&gt;Flexible (q=35)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Q10 · Revenue&lt;/td&gt;&lt;td&gt;5.000 × 30&lt;/td&gt;&lt;td&gt;150.000&lt;/td&gt;&lt;td&gt;175.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q11 · Salaries &amp;amp; wages&lt;/td&gt;&lt;td&gt;50.000 + 1.100 × 30&lt;/td&gt;&lt;td&gt;83.000&lt;/td&gt;&lt;td&gt;88.500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q12 · Travel expenses&lt;/td&gt;&lt;td&gt;600 × 30&lt;/td&gt;&lt;td&gt;18.000&lt;/td&gt;&lt;td&gt;21.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q13 · Other expenses&lt;/td&gt;&lt;td&gt;fisso&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;137.000&lt;/td&gt;&lt;td&gt;145.500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;13.000&lt;/td&gt;&lt;td&gt;29.500&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Totali e NOI del planning budget vengono dal report finale (slide 18). Q11 nelle slide: 1.100 × 30 = 33.000, più 50.000 = 83.000.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Calcola il NOI del planning budget col margine di contribuzione.&lt;/summary&gt;&lt;div&gt;3.300 × 30 − 86.000 = 99.000 − 86.000 = &lt;b&gt;13.000 $&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Quando si prepara il planning budget, e quando il flexible budget?&lt;/summary&gt;&lt;div&gt;Il planning &lt;b&gt;prima&lt;/b&gt; del periodo (q previsto); il flexible &lt;b&gt;dopo&lt;/b&gt;, quando si conosce q effettivo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ACTIVITY ============ --&gt;
&lt;section id=&quot;s6&quot; data-hue=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 6 · Q14–Q15&lt;/div&gt;
  &lt;h2&gt;Activity variances: il puro effetto volume&lt;/h2&gt;
  &lt;div class=&quot;formula&quot;&gt;Activity variance = &lt;span class=&quot;v&quot;&gt;Flexible budget&lt;/span&gt; − &lt;span class=&quot;v&quot;&gt;Planning budget&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Le due colonne usano le stesse formule e differiscono &lt;b&gt;solo per q&lt;/b&gt; (35 contro 30). Quindi l&#x27;activity variance misura &lt;b&gt;soltanto&lt;/b&gt; l&#x27;effetto di aver servito 5 clienti in più. Per le voci variabili si calcola anche direttamente: &lt;b&gt;Δq × costo (o ricavo) variabile unitario&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Flexible&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;Activity variance&lt;/th&gt;&lt;th&gt;Scorciatoia&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Q14 · Revenue&lt;/td&gt;&lt;td&gt;175.000&lt;/td&gt;&lt;td&gt;150.000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;25.000 F&lt;/td&gt;&lt;td&gt;5 × 5.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q15 · Salaries &amp;amp; wages&lt;/td&gt;&lt;td&gt;88.500&lt;/td&gt;&lt;td&gt;83.000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;5.500 U&lt;/td&gt;&lt;td&gt;5 × 1.100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q15 · Travel expenses&lt;/td&gt;&lt;td&gt;21.000&lt;/td&gt;&lt;td&gt;18.000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;3.000 U&lt;/td&gt;&lt;td&gt;5 × 600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Q15 · Other expenses&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;td&gt;36.000&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;fisso&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;29.500&lt;/td&gt;&lt;td&gt;13.000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;16.500 F&lt;/td&gt;&lt;td&gt;5 × 3.300&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;note warn&quot;&gt;&lt;b&gt;Attenzione all&#x27;etichetta U sui costi.&lt;/b&gt; I 5.500 U sui salari e i 3.000 U sui viaggi &lt;b&gt;non&lt;/b&gt; sono sprechi: sono la conseguenza normale di aver servito più clienti. Ciò che conta è l&#x27;effetto complessivo sul reddito, &lt;b&gt;16.500 F&lt;/b&gt;. Per giudicare l&#x27;efficienza si guardano le spending variances (Parte 4), non queste.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Perché l&#x27;activity variance di un costo fisso è sempre zero?&lt;/summary&gt;&lt;div&gt;Perché il costo fisso ha lo stesso importo in flexible e planning budget: la sua formula non dipende da q.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Se i clienti effettivi fossero stati 28, l&#x27;activity variance sui ricavi?&lt;/summary&gt;&lt;div&gt;Flexible 140.000 − planning 150.000 = &lt;b&gt;10.000 U&lt;/b&gt; (−2 × 5.000).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Activity variance di salaries &amp;amp; wages e travel insieme?&lt;/summary&gt;&lt;div&gt;5.500 U + 3.000 U = &lt;b&gt;8.500 U&lt;/b&gt; = total expenses 145.500 − 137.000.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 REPORT ============ --&gt;
&lt;section id=&quot;s7&quot; data-hue=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Parte 7 · Slide 18&lt;/div&gt;
  &lt;h2&gt;Flexible Budget Performance Report&lt;/h2&gt;
  &lt;p&gt;Il report mette in fila le cinque colonne: &lt;b&gt;Actual → (Revenue &amp;amp; spending variances) → Flexible → (Activity variances) → Planning&lt;/b&gt;. Il flexible budget sta in mezzo e fa da “ponte”. Usa i pulsanti per evidenziare un confronto.&lt;/p&gt;

  &lt;h3&gt;La riconciliazione&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;18.500 − 13.000 = &lt;b&gt;5.500 F&lt;/b&gt; = 16.500 F − 11.000 U&lt;/div&gt;
  &lt;p&gt;È il messaggio chiave della slide 18. Il NOI effettivo supera quello pianificato di 5.500 $, ma questo numero “nasconde” due storie opposte:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--hb:var(--sage-bg)&quot;&gt;&lt;h4&gt;+16.500 · effetto volume&lt;/h4&gt;&lt;p&gt;5 clienti in più × 3.300 $ di margine. È una buona notizia commerciale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;−11.000 · effetto prezzo / spesa&lt;/h4&gt;&lt;p&gt;Ricavi per cliente sotto lo standard (−15.000), solo in parte compensati da costi tenuti sotto controllo (+4.000).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Procedura in 5 passi per preparare il report (da usare all&#x27;esame)&lt;/summary&gt;&lt;div&gt;
    &lt;ol&gt;
      &lt;li&gt;Scrivi le cost formulas di ogni voce (colonna di sinistra, tra parentesi).&lt;/li&gt;
      &lt;li&gt;Planning budget: applica le formule a q pianificato.&lt;/li&gt;
      &lt;li&gt;Flexible budget: applica le formule a q effettivo.&lt;/li&gt;
      &lt;li&gt;Actual results: copia i dati contabili.&lt;/li&gt;
      &lt;li&gt;Calcola le variances in valore assoluto con F/U: Actual vs Flexible (revenue &amp;amp; spending), Flexible vs Planning (activity). Controlla che le variances sul NOI tornino con la riconciliazione.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Un manager dice: “Il NOI è sopra il piano di 5.500, è andato tutto bene”. Cosa rispondi?&lt;/summary&gt;&lt;div&gt;Che il risultato è merito del volume (+16.500 F). A parità di volume Adger ha perso 11.000, soprattutto sui ricavi per cliente (15.000 U). Il prezzo e gli sconti vanno indagati.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Total expenses: verifica la colonna activity variances.&lt;/summary&gt;&lt;div&gt;145.500 − 137.000 = 8.500 U = 5.500 U + 3.000 U + 0.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Quale colonna useresti per valutare il responsabile degli acquisti, e quale per il direttore commerciale?&lt;/summary&gt;&lt;div&gt;Per gli acquisti le &lt;b&gt;spending variances&lt;/b&gt;, perché il volume l&#x27;ha già neutralizzato il flexible budget. Per il commerciale le &lt;b&gt;activity variances&lt;/b&gt;, per i clienti serviti in più, e la &lt;b&gt;revenue variance&lt;/b&gt;, per il prezzo medio ottenuto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

  &lt;h2&gt;Collegamenti con il resto del corso&lt;/h2&gt;
  &lt;div class=&quot;note&quot;&gt;Ho cercato altri file nella cartella &lt;code&gt;corso/&lt;/code&gt;, ma con gli strumenti disponibili non sono riuscito a elencarne il contenuto e i nomi che ho provato non esistevano. &lt;b&gt;Questa pagina quindi non usa altri file del corso&lt;/b&gt;: tutto il contenuto didattico viene da &lt;i&gt;15.SMA.ex 1_solutions.pdf&lt;/i&gt;, più le fonti esterne segnate come tali.&lt;/div&gt;

&lt;!-- ============ 9 APPROFONDIRE ============ --&gt;
&lt;section id=&quot;s9&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-n&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide &lt;b&gt;non citano esplicitamente&lt;/b&gt; autori, testi, norme o siti. Le voci qui sotto sono &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: le ho trovate con ricerche web per inquadrare l&#x27;esercizio, il cui caso, terminologia e struttura del report coincidono con il manuale Garrison et al.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill, 18ª ed. ISE)&lt;/h4&gt;
    &lt;p&gt;Manuale di riferimento internazionale di contabilità direzionale. Il capitolo 9, “Flexible Budgets and Performance Analysis”, introduce planning e flexible budget, activity variances, revenue e spending variances e il &lt;i&gt;flexible budget performance report&lt;/i&gt; con le stesse cinque colonne della slide 18. Conta perché da qui vengono i termini usati nel corso. Controlla quale edizione adotta il corso: la numerazione dei capitoli cambia tra un&#x27;edizione e l&#x27;altra.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://aus.magento.intl.prod.mheducation.com/managerial-accounting-ise-9781266382680-aus-group&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;editore McGraw Hill&lt;/a&gt; · &lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/managerial-accounting-18th-ise-9781266248610&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda libreria (18th ISE)&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;McGraw Hill — Solutions Manual, Chapter 9 (Garrison)&lt;/h4&gt;
    &lt;p&gt;Soluzioni ufficiali degli esercizi del capitolo sui flexible budgets. La ricerca indica che contiene un esercizio con gli stessi importi di Adger: flexible budget con revenue 175.000, salaries 88.500, travel 21.000 e other 36.000. Utile per esercitarsi su casi analoghi.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/dl/free/0027162757/1029197/SMChap009.doc&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SMChap009.doc — highered.mheducation.com&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;AccountingTools — “Flexible budget variance”&lt;/h4&gt;
    &lt;p&gt;Breve voce divulgativa sullo scostamento tra risultati effettivi e flexible budget, con definizione ed esempi. Conta come ripasso veloce della logica &lt;i&gt;actual vs flexible&lt;/i&gt;. Nota: altri testi usano “flexible budget variance” per ciò che il corso chiama revenue e spending variances.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://accountingtools.com/articles/what-is-a-flexible-budget-variance.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;accountingtools.com&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;McGraw Hill — indice del manuale (Online Learning Center)&lt;/h4&gt;
    &lt;p&gt;Indice dei capitoli di un&#x27;edizione di &lt;i&gt;Managerial Accounting&lt;/i&gt;: mostra dove si collocano flexible budgets e standard costs nel percorso.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0077432312/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents — highered.mheducation.com&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
    &lt;div&gt;Le parti segnate &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; vengono da ricerche web e non dalle slide.&lt;/div&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  var fmt = function(n){ var s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, &quot;.&quot;); return (n &lt; 0 ? &quot;−&quot; : &quot;&quot;) + s; };
  var NS = &quot;http://www.w3.org/2000/svg&quot;;

  // Linguette
  document.querySelectorAll(&quot;[data-tabs]&quot;).forEach(function(box){
    var btns = box.querySelectorAll(&#x27;[role=tab]&#x27;), pans = box.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    btns.forEach(function(b, i){
      b.addEventListener(&quot;click&quot;, function(){
        btns.forEach(function(x, j){ x.setAttribute(&quot;aria-selected&quot;, i === j); pans[j].hidden = i !== j; });
      });
    });
  });

  // Passi da scorrere
  document.querySelectorAll(&quot;[data-stepper]&quot;).forEach(function(st){
    var steps = st.querySelectorAll(&quot;.step&quot;), dots = st.querySelector(&quot;.dots&quot;), cur = 0;
    var prev = st.querySelector(&quot;[data-prev]&quot;), next = st.querySelector(&quot;[data-next]&quot;);
    steps.forEach(function(s, i){
      var d = document.createElement(&quot;button&quot;);
      d.textContent = &quot;Q&quot; + (i + 1); d.setAttribute(&quot;aria-label&quot;, &quot;Passo &quot; + (i + 1));
      d.addEventListener(&quot;click&quot;, function(){ go(i); });
      dots.appendChild(d);
    });
    function go(i){
      cur = i;
      steps.forEach(function(s, j){ s.classList.toggle(&quot;on&quot;, j === i); dots.children[j].classList.toggle(&quot;on&quot;, j === i); });
      prev.disabled = i === 0; next.disabled = i === steps.length - 1;
    }
    prev.addEventListener(&quot;click&quot;, function(){ if (cur &gt; 0) go(cur - 1); });
    next.addEventListener(&quot;click&quot;, function(){ if (cur &lt; steps.length - 1) go(cur + 1); });
    go(0);
  });

  // Grafico del flexible budget
  var svg = document.getElementById(&quot;flexchart&quot;);
  function X(q){ return 60 + q * 10.8; }
  function Y(v){ return 260 - v * 0.00096; }
  function el(tag, attrs, txt){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (txt != null) e.textContent = txt;
    svg.appendChild(e); return e;
  }
  for (var v = 0; v &lt;= 250000; v += 50000){
    el(&quot;line&quot;, {x1:60, x2:600, y1:Y(v), y2:Y(v), stroke:&quot;var(--rule)&quot;});
    el(&quot;text&quot;, {x:54, y:Y(v) + 4, &quot;font-size&quot;:10.5, &quot;text-anchor&quot;:&quot;end&quot;, style:&quot;fill:var(--ink2)&quot;}, v / 1000 + &quot;k&quot;);
  }
  for (var q = 0; q &lt;= 50; q += 10){
    el(&quot;text&quot;, {x:X(q), y:276, &quot;font-size&quot;:10.5, &quot;text-anchor&quot;:&quot;middle&quot;, style:&quot;fill:var(--ink2)&quot;}, q);
  }
  el(&quot;text&quot;, {x:600, y:293, &quot;font-size&quot;:11, &quot;text-anchor&quot;:&quot;end&quot;, style:&quot;fill:var(--ink2)&quot;}, &quot;clienti serviti (q)&quot;);
  el(&quot;line&quot;, {x1:60, x2:600, y1:Y(86000), y2:Y(86000), stroke:&quot;var(--sage)&quot;, &quot;stroke-dasharray&quot;:&quot;5 4&quot;});
  el(&quot;text&quot;, {x:64, y:Y(86000) - 6, &quot;font-size&quot;:10.5, style:&quot;fill:var(--sage)&quot;}, &quot;costi fissi 86.000&quot;);
  el(&quot;line&quot;, {x1:X(0), y1:Y(0), x2:X(50), y2:Y(250000), stroke:&quot;var(--ochre)&quot;, &quot;stroke-width&quot;:2.5});
  el(&quot;line&quot;, {x1:X(0), y1:Y(86000), x2:X(50), y2:Y(86000 + 1700 * 50), stroke:&quot;var(--brick)&quot;, &quot;stroke-width&quot;:2.5});
  el(&quot;text&quot;, {x:X(44), y:Y(220000) - 8, &quot;font-size&quot;:11.5, &quot;text-anchor&quot;:&quot;end&quot;, style:&quot;fill:var(--ochre)&quot;, &quot;font-weight&quot;:600}, &quot;Revenue 5.000q&quot;);
  el(&quot;text&quot;, {x:X(50), y:Y(171000) + 18, &quot;font-size&quot;:11.5, &quot;text-anchor&quot;:&quot;end&quot;, style:&quot;fill:var(--brick)&quot;, &quot;font-weight&quot;:600}, &quot;Total expenses 86.000 + 1.700q&quot;);
  var be = 86000 / 3300;
  el(&quot;circle&quot;, {cx:X(be), cy:Y(5000 * be), r:4, fill:&quot;var(--ink)&quot;});
  el(&quot;text&quot;, {x:X(be) + 8, y:Y(5000 * be) + 16, &quot;font-size&quot;:10.5, style:&quot;fill:var(--ink2)&quot;}, &quot;break-even ≈ 26,1&quot;);
  el(&quot;line&quot;, {x1:X(30), x2:X(30), y1:20, y2:260, stroke:&quot;var(--slate)&quot;, &quot;stroke-dasharray&quot;:&quot;2 4&quot;});
  el(&quot;text&quot;, {x:X(30) - 4, y:30, &quot;font-size&quot;:10.5, &quot;text-anchor&quot;:&quot;end&quot;, style:&quot;fill:var(--slate)&quot;}, &quot;piano: 30&quot;);
  var gap = el(&quot;line&quot;, {&quot;stroke-width&quot;:6, &quot;stroke-linecap&quot;:&quot;round&quot;, opacity:.35});
  var vline = el(&quot;line&quot;, {y1:20, y2:260, stroke:&quot;var(--accent)&quot;, &quot;stroke-width&quot;:1.5});
  var d1 = el(&quot;circle&quot;, {r:5, fill:&quot;var(--ochre)&quot;}), d2 = el(&quot;circle&quot;, {r:5, fill:&quot;var(--brick)&quot;});
  var lab = el(&quot;text&quot;, {&quot;font-size&quot;:11.5, &quot;font-weight&quot;:600});

  var qr = document.getElementById(&quot;qr&quot;);
  function upd(){
    var q = +qr.value, rev = 5000 * q, sal = 50000 + 1100 * q, tra = 600 * q, oth = 36000, tot = sal + tra + oth, noi = rev - tot;
    document.getElementById(&quot;qv&quot;).textContent = q;
    document.getElementById(&quot;k-rev&quot;).textContent = fmt(rev);
    document.getElementById(&quot;k-sal&quot;).textContent = fmt(sal);
    document.getElementById(&quot;k-tra&quot;).textContent = fmt(tra);
    document.getElementById(&quot;k-oth&quot;).textContent = fmt(oth);
    var kn = document.getElementById(&quot;k-noi&quot;); kn.textContent = fmt(noi); kn.style.color = noi &gt;= 0 ? &quot;var(--fav)&quot; : &quot;var(--unf)&quot;;
    var x = X(q);
    vline.setAttribute(&quot;x1&quot;, x); vline.setAttribute(&quot;x2&quot;, x);
    d1.setAttribute(&quot;cx&quot;, x); d1.setAttribute(&quot;cy&quot;, Y(rev));
    d2.setAttribute(&quot;cx&quot;, x); d2.setAttribute(&quot;cy&quot;, Y(tot));
    gap.setAttribute(&quot;x1&quot;, x); gap.setAttribute(&quot;x2&quot;, x); gap.setAttribute(&quot;y1&quot;, Y(rev)); gap.setAttribute(&quot;y2&quot;, Y(tot));
    gap.setAttribute(&quot;stroke&quot;, noi &gt;= 0 ? &quot;var(--fav)&quot; : &quot;var(--unf)&quot;);
    var right = q &gt; 38;
    lab.setAttribute(&quot;x&quot;, right ? x - 8 : x + 8); lab.setAttribute(&quot;text-anchor&quot;, right ? &quot;end&quot; : &quot;start&quot;);
    lab.setAttribute(&quot;y&quot;, (Y(rev) + Y(tot)) / 2 + 4);
    lab.textContent = &quot;NOI &quot; + fmt(noi);
    var n = &quot;&quot;;
    if (q === 35) n = &quot;q = 35 è il livello effettivo di maggio: sono esattamente i valori del flexible budget delle slide (Q1–Q5).&quot;;
    else if (q === 30) n = &quot;q = 30 è il livello pianificato: ottieni il planning budget (Q10–Q13), NOI 13.000.&quot;;
    else n = &quot;Rispetto al planning budget (q = 30) l&#x27;activity variance sul NOI sarebbe &quot; + fmt(Math.abs(3300 * (q - 30))) + (q &gt; 30 ? &quot; F&quot; : &quot; U&quot;) + &quot; (= &quot; + (q - 30) + &quot; × 3.300).&quot;;
    document.getElementById(&quot;flexnote&quot;).textContent = n;
  }
  qr.addEventListener(&quot;input&quot;, upd); upd();

  // Report: evidenzia le colonne
  var rep = document.getElementById(&quot;report&quot;);
  document.querySelectorAll(&quot;#rep-legend button&quot;).forEach(function(b){
    b.addEventListener(&quot;click&quot;, function(){
      document.querySelectorAll(&quot;#rep-legend button&quot;).forEach(function(x){ x.classList.toggle(&quot;on&quot;, x === b); });
      var cols = b.dataset.cols === &quot;&quot; ? [] : b.dataset.cols.split(&quot;,&quot;).map(function(c){ return +c + 1; });
      rep.querySelectorAll(&quot;tr&quot;).forEach(function(tr){
        Array.prototype.forEach.call(tr.children, function(td, i){ td.classList.toggle(&quot;hl&quot;, cols.indexOf(i) &gt;= 0); });
      });
    });
  });

  // Mini-gioco F/U
  var game = document.getElementById(&quot;fu-game&quot;);
  var items = [
    [&quot;Revenue: actual 160.000 vs flexible 175.000&quot;, &quot;U&quot;, &quot;Ricavi sotto il flexible budget: effetto negativo sul reddito → 15.000 U.&quot;],
    [&quot;Salaries: actual 88.000 vs flexible 88.500&quot;, &quot;F&quot;, &quot;Costo sotto il flexible budget → 500 F.&quot;],
    [&quot;Travel: flexible 21.000 vs planning 18.000 (activity)&quot;, &quot;U&quot;, &quot;Costo più alto nel flexible budget → 3.000 U. È solo l&#x27;effetto volume, non uno spreco.&quot;],
    [&quot;Revenue: flexible 175.000 vs planning 150.000 (activity)&quot;, &quot;F&quot;, &quot;Più clienti, più ricavi → 25.000 F.&quot;],
    [&quot;NOI: actual 18.500 vs flexible 29.500&quot;, &quot;U&quot;, &quot;Reddito più basso → 11.000 U.&quot;]
  ];
  items.forEach(function(it){
    var row = document.createElement(&quot;div&quot;);
    row.style.cssText = &quot;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rule)&quot;;
    var t = document.createElement(&quot;span&quot;); t.textContent = it[0]; t.style.flex = &quot;1 1 260px&quot;;
    var fb = document.createElement(&quot;div&quot;); fb.style.cssText = &quot;flex-basis:100%;font-size:.9rem;display:none&quot;;
    row.appendChild(t);
    [&quot;F&quot;, &quot;U&quot;].forEach(function(l){
      var b = document.createElement(&quot;button&quot;); b.className = &quot;btn&quot;; b.textContent = l;
      b.addEventListener(&quot;click&quot;, function(){
        var ok = l === it[1];
        fb.style.display = &quot;block&quot;;
        fb.innerHTML = (ok ? &#x27;&lt;b class=&quot;F&quot;&gt;✓ Giusto.&lt;/b&gt; &#x27; : &#x27;&lt;b class=&quot;U&quot;&gt;✗ No, è &#x27; + it[1] + &#x27;.&lt;/b&gt; &#x27;) + it[2];
      });
      row.appendChild(b);
    });
    row.appendChild(fb); game.appendChild(row);
  });

  // Indice: evidenzia la sezione visibile
  var links = document.querySelectorAll(&quot;nav.toc a&quot;);
  if (&quot;IntersectionObserver&quot; in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting) links.forEach(function(a){ a.classList.toggle(&quot;on&quot;, a.getAttribute(&quot;href&quot;) === &quot;#&quot; + e.target.id); });
      });
    }, {rootMargin:&quot;-40% 0px -55% 0px&quot;});
    document.querySelectorAll(&quot;main section&quot;).forEach(function(s){ io.observe(s); });
  }
})();
&lt;/script&gt;
