      &lt;a href=&quot;#vendite&quot;&gt;&lt;rect class=&quot;box f-sagebg s-sage&quot; x=&quot;45&quot; y=&quot;237&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;130&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cash collections · AR&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;130&quot; y=&quot;273&quot; text-anchor=&quot;middle&quot;&gt;domande 2–3&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#materiali&quot;&gt;&lt;rect class=&quot;box f-slatebg s-slate&quot; x=&quot;255&quot; y=&quot;237&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;340&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Direct materials budget&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;340&quot; y=&quot;273&quot; text-anchor=&quot;middle&quot;&gt;domande 5, 6, 9&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#lavoro&quot;&gt;&lt;rect class=&quot;box f-brickbg s-brick&quot; x=&quot;475&quot; y=&quot;237&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;560&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Direct labor · overhead&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;560&quot; y=&quot;273&quot; text-anchor=&quot;middle&quot;&gt;domanda 10&lt;/text&gt;&lt;/a&gt;
      &lt;g&gt;&lt;rect class=&quot;box f-card s-rule dash&quot; x=&quot;45&quot; y=&quot;347&quot; width=&quot;172&quot; height=&quot;46&quot; rx=&quot;10&quot; style=&quot;stroke:var(--muted)&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;130&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cash budget&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;130&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;non richiesto qui&lt;/text&gt;&lt;/g&gt;
      &lt;a href=&quot;#materiali&quot;&gt;&lt;rect class=&quot;box f-slatebg s-slate&quot; x=&quot;255&quot; y=&quot;347&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;340&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cash disbursements · AP&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;340&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;domande 7–8&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#lavoro&quot;&gt;&lt;rect class=&quot;box f-brickbg s-brick&quot; x=&quot;475&quot; y=&quot;347&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;560&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Unit product cost&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;560&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;domanda 11&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#conto&quot;&gt;&lt;rect class=&quot;box f-accentbg s-accent&quot; x=&quot;705&quot; y=&quot;347&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;790&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;FG · COGS · margin&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;790&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;domande 12–13&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Linee continue: un budget alimenta l&#x27;altro. Tratteggio: relazione di appartenenza o passaggio successivo (il &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt; raccoglie incassi e pagamenti, ma l&#x27;esercizio non lo chiede). Colori: salvia = vendite, ocra = produzione, ardesia = materie prime, mattone = lavoro e costo unitario, terracotta = conto economico.&lt;/figcaption&gt;
  &lt;/figure&gt;
&lt;/section&gt;
&lt;/div&gt;

&lt;section id=&quot;master&quot; class=&quot;part p-accent&quot; aria-labelledby=&quot;h-master&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;1&lt;/span&gt;Il quadro&lt;/div&gt;
  &lt;h2 id=&quot;h-master&quot;&gt;Che cos&#x27;è il &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; e che cosa ci dà il caso&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Definizione&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; (budget generale d&#x27;esercizio) è l&#x27;insieme coordinato dei budget con cui un&#x27;azienda traduce i propri piani in numeri per un periodo futuro, di solito un anno diviso in mesi o trimestri. Non è un singolo prospetto ma una catena di budget collegati: ogni budget usa i risultati di quello precedente.&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;La catena parte quasi sempre dalle vendite, perché è la quantità che si pensa di vendere a determinare quanto produrre, quanto materiale comprare, quanto lavoro impiegare e quali costi commerciali sostenere. I budget si dividono in due famiglie:&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Operating budgets&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Financial budgets&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Perché farlo&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;&lt;i lang=&quot;en&quot;&gt;Operating budgets&lt;/i&gt;&lt;/b&gt; (budget operativi): descrivono l&#x27;attività caratteristica. Nell&#x27;esercizio compaiono il &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt; (vendite), il &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; (produzione in unità), il &lt;i lang=&quot;en&quot;&gt;direct materials budget&lt;/i&gt; (materie prime), il &lt;i lang=&quot;en&quot;&gt;direct labor budget&lt;/i&gt; (manodopera diretta), il &lt;i lang=&quot;en&quot;&gt;manufacturing overhead budget&lt;/i&gt; (costi indiretti di produzione), il &lt;i lang=&quot;en&quot;&gt;selling and administrative expense budget&lt;/i&gt; (costi commerciali e amministrativi) e, a valle, il costo del venduto.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;&lt;i lang=&quot;en&quot;&gt;Financial budgets&lt;/i&gt;&lt;/b&gt; (budget finanziari): traducono l&#x27;attività in movimenti di cassa e in valori patrimoniali. Qui compaiono i loro mattoni: &lt;i lang=&quot;en&quot;&gt;cash collections&lt;/i&gt; (incassi dai clienti), &lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt; (pagamenti ai fornitori) e i saldi di fine mese di crediti, debiti e rimanenze, che finiscono nel &lt;i lang=&quot;en&quot;&gt;budgeted balance sheet&lt;/i&gt; (stato patrimoniale previsionale). Il &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt; e il &lt;i lang=&quot;en&quot;&gt;budgeted income statement&lt;/i&gt; completi non sono richiesti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il budget serve a &lt;b&gt;pianificare&lt;/b&gt; (fissare obiettivi realistici), a &lt;b&gt;coordinare&lt;/b&gt; (vendite, produzione e acquisti devono parlare degli stessi numeri), a &lt;b&gt;prevedere la cassa&lt;/b&gt; (sapere in anticipo quando servono finanziamenti) e a &lt;b&gt;controllare&lt;/b&gt; (a consuntivo si confrontano i risultati con il budget e si analizzano gli scostamenti).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;I dati del caso &lt;span class=&quot;slide&quot;&gt;dalle slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Morganton Company produce &lt;b&gt;un solo prodotto&lt;/b&gt;. Le sette ipotesi della slide 2, raggruppate per budget:&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;tile p-sage&quot;&gt;&lt;span class=&quot;tag&quot;&gt;a&lt;/span&gt;Prezzo $70 per unità. Vendite in unità: giugno 8,400 · luglio 10,000 · agosto 12,000 · settembre 13,000. Tutte a credito.&lt;small&gt;→ sales budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-sage&quot;&gt;&lt;span class=&quot;tag&quot;&gt;b&lt;/span&gt;Il 40% delle vendite a credito si incassa nel mese di vendita, il 60% nel mese successivo.&lt;small&gt;→ cash collections&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-ochre&quot;&gt;&lt;span class=&quot;tag&quot;&gt;c&lt;/span&gt;Rimanenza finale di prodotti finiti = 20% delle vendite in unità del mese successivo.&lt;small&gt;→ production budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-slate&quot;&gt;&lt;span class=&quot;tag&quot;&gt;d&lt;/span&gt;Rimanenza finale di materie prime = 10% del fabbisogno di produzione del mese successivo. 5 libbre per unità, $2.00 a libbra.&lt;small&gt;→ direct materials budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-slate&quot;&gt;&lt;span class=&quot;tag&quot;&gt;e&lt;/span&gt;Acquisti di materie prime pagati 30% nel mese, 70% nel mese successivo.&lt;small&gt;→ cash disbursements&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-brick&quot;&gt;&lt;span class=&quot;tag&quot;&gt;f&lt;/span&gt;Manodopera diretta: $15 l&#x27;ora, 2 ore per unità.&lt;small&gt;→ direct labor budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-accent&quot;&gt;&lt;span class=&quot;tag&quot;&gt;g&lt;/span&gt;Costi commerciali e amministrativi: variabili $1.80 per unità venduta, fissi $60,000 al mese.&lt;small&gt;→ S&amp;amp;A expense budget&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Le domande riguardano tutte &lt;b&gt;luglio&lt;/b&gt;. Giugno serve perché incassi e pagamenti di luglio comprendono la coda del mese precedente; agosto e settembre servono perché le scorte finali si calcolano sulle vendite e sulla produzione del mese successivo. Unità di misura come nel caso: dollari e &lt;i lang=&quot;en&quot;&gt;pounds&lt;/i&gt; (libbre, lb).&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Che cosa le slide danno per scontato&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;&lt;b&gt;Competenza e cassa sono due cose diverse.&lt;/b&gt; Una vendita &quot;a credito&quot; (&lt;i lang=&quot;en&quot;&gt;on credit&lt;/i&gt;) è un ricavo del mese in cui avviene, ma il denaro entra più tardi. Per questo lo stesso mese ha un valore di vendite (ricavi) e un valore di incassi diverso, e la differenza resta come credito verso clienti.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Le politiche di scorta sono &quot;ponti&quot; tra i mesi.&lt;/b&gt; La rimanenza finale di un mese è la rimanenza iniziale del mese dopo. Se la politica vale sempre, la scorta iniziale di luglio è il 20% delle vendite di luglio (calcolata a fine giugno).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Un solo prodotto, costi standard costanti.&lt;/b&gt; Prezzo, consumo di materiale, ore e tariffe non cambiano tra i mesi: per questo il costo unitario è uno solo e le rimanenze si valutano tutte allo stesso costo.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt; si prepara per primo?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Perché quasi tutti gli altri budget dipendono dalle unità da vendere: la produzione deriva dalle vendite più le scorte desiderate, gli acquisti dalla produzione, il lavoro dalla produzione, i costi variabili di vendita dalle unità vendute, gli incassi dai ricavi.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Incassi dei clienti e saldo dei crediti a fine mese: &lt;i lang=&quot;en&quot;&gt;operating&lt;/i&gt; o &lt;i lang=&quot;en&quot;&gt;financial budget&lt;/i&gt;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Financial: riguardano la cassa (incassi) e lo stato patrimoniale (crediti). Il ricavo delle vendite invece appartiene al budget operativo delle vendite.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché servono anche i dati di giugno e di agosto se le domande riguardano solo luglio?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Giugno: il 60% delle vendite e il 70% degli acquisti di giugno si incassano o si pagano a luglio, e la scorta iniziale di luglio nasce a giugno. Agosto: le scorte finali di luglio sono definite in percentuale delle vendite e del fabbisogno di agosto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;vendite&quot; class=&quot;part p-sage&quot; aria-labelledby=&quot;h-vendite&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;2&lt;/span&gt;Domande 1–3&lt;/div&gt;
  &lt;h2 id=&quot;h-vendite&quot;&gt;Vendite, incassi e &lt;i lang=&quot;en&quot;&gt;accounts receivable&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Sales budget&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt; (budget delle vendite) stima le unità vendute e i ricavi di ogni periodo: &lt;b&gt;ricavi = unità vendute × prezzo unitario&lt;/b&gt;. È la base dell&#x27;intero master budget.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Sales budget&lt;/th&gt;&lt;th&gt;Giugno&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;Luglio&lt;/th&gt;&lt;th&gt;Agosto&lt;/th&gt;&lt;th&gt;Settembre&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Unità vendute&lt;/td&gt;&lt;td&gt;8,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;td&gt;13,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× prezzo unitario&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$70&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Ricavi (&lt;i lang=&quot;en&quot;&gt;sales&lt;/i&gt;)&lt;/td&gt;&lt;td&gt;$588,000&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$700,000&lt;/td&gt;&lt;td&gt;$840,000&lt;/td&gt;&lt;td&gt;$910,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Cash collections e accounts receivable&lt;/span&gt;
    &lt;p&gt;Le &lt;i lang=&quot;en&quot;&gt;cash collections&lt;/i&gt; sono gli incassi effettivi dai clienti in un mese. Gli &lt;i lang=&quot;en&quot;&gt;accounts receivable&lt;/i&gt; (AR, crediti verso clienti) sono, come dice la nota della slide 3, &lt;em&gt;&quot;l&#x27;ammontare dei beni venduti che non sono ancora stati pagati (nessun incasso)&quot;&lt;/em&gt;: un&#x27;attività dello stato patrimoniale.&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 215&quot; role=&quot;img&quot; aria-labelledby=&quot;tl1-t&quot;&gt;
      &lt;title id=&quot;tl1-t&quot;&gt;Calendario degli incassi: 40% nel mese della vendita, 60% nel mese successivo&lt;/title&gt;
      &lt;rect class=&quot;f-sagebg&quot; x=&quot;225&quot; y=&quot;28&quot; width=&quot;190&quot; height=&quot;150&quot; rx=&quot;8&quot;/&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;120&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Giugno&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;320&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Luglio&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;520&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Agosto&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;30&quot; y=&quot;46&quot;&gt;Vendite di giugno · $588,000&lt;/text&gt;
      &lt;rect x=&quot;30&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot; opacity=&quot;.45&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;120&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;40% · $235,200&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;60% · $352,800&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;230&quot; y=&quot;112&quot;&gt;Vendite di luglio · $700,000&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;40% · $280,000&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-card s-sage dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;520&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;60% · $420,000&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;520&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;= AR a fine luglio&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Incassi di luglio = $352,800 + $280,000 = $632,800&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Ogni vendita genera due incassi in due mesi diversi. La colonna di luglio somma la coda di giugno e la prima quota di luglio; la quota di luglio che slitta ad agosto è il credito ancora aperto a fine mese.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Domanda 1 · Vendite previste di luglio&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;10,000 unità × $70 = &lt;b&gt;$700,000&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;È un dato di competenza: il ricavo si registra a luglio anche se il cliente pagherà in parte ad agosto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Domanda 2 · Incassi attesi a luglio&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;60% × $588,000 (giugno) + 40% × $700,000 (luglio)&lt;br&gt;= $352,800 + $280,000 = &lt;b&gt;$632,800&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Errore tipico: prendere solo il 40% di luglio, dimenticando che a luglio si incassa anche il saldo delle vendite di giugno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Domanda 3 · Accounts receivable a fine luglio&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;60% × $700,000 = &lt;b&gt;$420,000&lt;/b&gt;&lt;small&gt;Controllo: AR inizio luglio $352,800 + vendite $700,000 − incassi $632,800 = $420,000&lt;/small&gt;&lt;/div&gt;
      &lt;p&gt;Il controllo usa l&#x27;equazione di ogni conto patrimoniale: &lt;b&gt;saldo iniziale + aumenti − diminuzioni = saldo finale&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn ghost prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Prova a cambiare la politica di incasso&lt;/h3&gt;
  &lt;p&gt;Sposta il cursore: che succede a incassi e crediti di luglio se i clienti pagano di più (o di meno) nel mese della vendita?&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;coll&quot;&gt;Incassato nel mese della vendita&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;coll&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;coll-o&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 720 125&quot; role=&quot;img&quot; aria-label=&quot;Barre: incassi di luglio e crediti a fine luglio&quot;&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;0&quot; y=&quot;42&quot;&gt;Incassi di luglio&lt;/text&gt;
      &lt;rect id=&quot;cb-a&quot; x=&quot;180&quot; y=&quot;20&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-sagebg s-sage&quot; stroke-width=&quot;1&quot;/&gt;
      &lt;rect id=&quot;cb-b&quot; x=&quot;180&quot; y=&quot;20&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text id=&quot;cb-tl&quot; class=&quot;svgt&quot; x=&quot;186&quot; y=&quot;42&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;0&quot; y=&quot;102&quot;&gt;Crediti a fine luglio&lt;/text&gt;
      &lt;rect id=&quot;cb-ar&quot; x=&quot;180&quot; y=&quot;80&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-card s-sage dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text id=&quot;cb-arl&quot; class=&quot;svgt&quot; x=&quot;186&quot; y=&quot;102&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;dalle vendite di giugno&lt;b id=&quot;coll-a&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;dalle vendite di luglio&lt;b id=&quot;coll-b&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;incassi totali di luglio&lt;b id=&quot;coll-tot&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;AR a fine luglio&lt;b id=&quot;coll-ar&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Chiaro: quota dalle vendite di giugno; pieno: quota dalle vendite di luglio. Poiché le vendite crescono (giugno $588,000 → luglio $700,000), incassare di più subito fa aumentare gli incassi di luglio e diminuire i crediti. Il ricavo di luglio resta $700,000 qualunque sia la percentuale.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se il 100% delle vendite fosse incassato nel mese, quanto varrebbero incassi e AR di luglio?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Incassi = $700,000 (le vendite di luglio; quelle di giugno sarebbero già state incassate a giugno). AR a fine luglio = $0.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quanto sarà incassato ad agosto, in base ai dati?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;60% × $700,000 + 40% × $840,000 = $420,000 + $336,000 = $756,000. Si noti che i $420,000 sono proprio l&#x27;AR di fine luglio.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Vero o falso: &quot;le vendite di luglio sono $632,800&quot;.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Falso: $632,800 sono gli &lt;em&gt;incassi&lt;/em&gt; di luglio. Le vendite (ricavi di competenza) sono $700,000.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;produzione&quot; class=&quot;part p-ochre&quot; aria-labelledby=&quot;h-produzione&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;3&lt;/span&gt;Domanda 4&lt;/div&gt;
  &lt;h2 id=&quot;h-produzione&quot;&gt;Il &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Production budget&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; (budget di produzione) dice quante unità produrre in ogni periodo per soddisfare le vendite previste &lt;b&gt;e&lt;/b&gt; lasciare in magazzino la scorta desiderata di &lt;i lang=&quot;en&quot;&gt;finished goods&lt;/i&gt; (prodotti finiti). È espresso in unità fisiche, non in dollari.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;Produzione = Vendite in unità + Scorta finale desiderata − Scorta iniziale&lt;small&gt;Viene dall&#x27;equazione di magazzino: scorta iniziale + produzione = vendite + scorta finale&lt;/small&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 275&quot; role=&quot;img&quot; aria-labelledby=&quot;eq-t&quot;&gt;
      &lt;title id=&quot;eq-t&quot;&gt;Equazione di magazzino dei prodotti finiti per luglio&lt;/title&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;215&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot;&gt;Disponibilità&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;425&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot;&gt;Impieghi&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;167.7&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect x=&quot;150&quot; y=&quot;207.7&quot; width=&quot;130&quot; height=&quot;32.3&quot; class=&quot;f-ochrebg s-ochre&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;360&quot; y=&quot;78.7&quot; width=&quot;130&quot; height=&quot;161.3&quot; class=&quot;f-ochre&quot; opacity=&quot;.75&quot;/&gt;
      &lt;rect x=&quot;360&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;38.7&quot; class=&quot;f-ochrebg s-ochre dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;120&quot; text-anchor=&quot;end&quot; font-weight=&quot;600&quot;&gt;Produzione&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;137&quot; text-anchor=&quot;end&quot;&gt;? = 10,400&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;222&quot; text-anchor=&quot;end&quot;&gt;Scorta iniziale&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;140&quot; y=&quot;236&quot; text-anchor=&quot;end&quot;&gt;20% × 10,000 = 2,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;500&quot; y=&quot;56&quot; font-weight=&quot;600&quot;&gt;Scorta finale&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;500&quot; y=&quot;71&quot;&gt;20% × 12,000 = 2,400&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;500&quot; y=&quot;160&quot;&gt;Vendite di luglio&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;500&quot; y=&quot;175&quot;&gt;10,000&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ochre);font:600 34px var(--serif)&quot;&gt;=&lt;/text&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;130&quot; y1=&quot;240&quot; x2=&quot;510&quot; y2=&quot;240&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;215&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot;&gt;12,400 unità&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;425&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot;&gt;12,400 unità&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le due colonne devono pareggiare: quello che c&#x27;è (scorta iniziale + produzione) va o venduto o lasciato in magazzino. La produzione è l&#x27;unica incognita.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 1 · Scorta finale desiderata di luglio&lt;/h4&gt;&lt;p&gt;La politica (punto c) lega la scorta finale alle vendite del mese &lt;em&gt;successivo&lt;/em&gt;: 20% × 12,000 (agosto) = &lt;b&gt;2,400 unità&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Passo 2 · Fabbisogno totale&lt;/h4&gt;&lt;p&gt;Vendite di luglio + scorta finale = 10,000 + 2,400 = &lt;b&gt;12,400 unità&lt;/b&gt; che devono essere disponibili a luglio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Passo 3 · Scorta iniziale&lt;/h4&gt;&lt;p&gt;È la scorta finale di giugno, calcolata con la stessa politica sulle vendite di luglio: 20% × 10,000 = &lt;b&gt;2,000 unità&lt;/b&gt;. Queste unità esistono già e non vanno prodotte.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Domanda 4 · Unità da produrre a luglio&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;10,000 + 2,400 − 2,000 = &lt;b&gt;10,400 unità&lt;/b&gt;&lt;/div&gt;&lt;p&gt;Si produce più di quanto si vende perché le vendite crescono e la scorta deve crescere con loro (+400 unità).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn ghost prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;Lo stesso schema per tre mesi (giugno e agosto serviranno per le materie prime):&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Production budget (unità)&lt;/th&gt;&lt;th&gt;Giugno&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;Luglio&lt;/th&gt;&lt;th&gt;Agosto&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Vendite in unità&lt;/td&gt;&lt;td&gt;8,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Scorta finale desiderata (20% mese dopo)&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2,400&lt;/td&gt;&lt;td&gt;2,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Fabbisogno totale&lt;/td&gt;&lt;td&gt;10,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;12,400&lt;/td&gt;&lt;td&gt;14,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Scorta iniziale&lt;/td&gt;&lt;td&gt;1,680&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2,000&lt;/td&gt;&lt;td&gt;2,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unità da produrre&lt;/td&gt;&lt;td&gt;8,720&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;td&gt;12,200&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Per giugno si assume che la politica valesse già a fine maggio (scorta iniziale = 20% × 8,400). Settembre non si può calcolare: servirebbero le vendite di ottobre.&lt;/p&gt;

  &lt;h3&gt;Quanto pesa la politica delle scorte?&lt;/h3&gt;
  &lt;figure&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fgp&quot;&gt;Scorta finale (% vendite mese dopo)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fgp&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;fgp-o&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Vendite e produzione per giugno, luglio, agosto&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;8&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;text class=&quot;svgs&quot; x=&quot;40&quot; y=&quot;19&quot;&gt;vendite (unità)&lt;/text&gt;
      &lt;rect x=&quot;140&quot; y=&quot;8&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;f-ochre&quot;/&gt;&lt;text class=&quot;svgs&quot; x=&quot;160&quot; y=&quot;19&quot;&gt;produzione (unità)&lt;/text&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;40&quot; y1=&quot;225&quot; x2=&quot;610&quot; y2=&quot;225&quot;/&gt;
      &lt;rect id=&quot;ps0&quot; x=&quot;88&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp0&quot; x=&quot;134&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect id=&quot;ps1&quot; x=&quot;278&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp1&quot; x=&quot;324&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect id=&quot;ps2&quot; x=&quot;468&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp2&quot; x=&quot;514&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;text id=&quot;psl0&quot; class=&quot;svgs&quot; x=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl0&quot; class=&quot;svgs&quot; x=&quot;154&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text id=&quot;psl1&quot; class=&quot;svgs&quot; x=&quot;298&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl1&quot; class=&quot;svgs&quot; x=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text id=&quot;psl2&quot; class=&quot;svgs&quot; x=&quot;488&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl2&quot; class=&quot;svgs&quot; x=&quot;534&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;131&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;Giugno&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;321&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;Luglio&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;511&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;Agosto&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;scorta finale di luglio&lt;b id=&quot;fgp-end&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;scorta iniziale di luglio&lt;b id=&quot;fgp-beg&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;produzione di luglio&lt;b id=&quot;fgp-jul&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Con vendite in crescita, più alta è la percentuale di scorta, più la produzione supera le vendite: ogni mese bisogna &quot;ricaricare&quot; un magazzino più grande. Con lo 0% si produce esattamente quanto si vende (produzione &lt;i lang=&quot;en&quot;&gt;just-in-time&lt;/i&gt;).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché a luglio si producono 10,400 unità e non 10,000?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Perché la scorta finale desiderata (2,400) supera quella iniziale (2,000) di 400 unità: oltre alle vendite bisogna produrre l&#x27;aumento di magazzino.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se le vendite di agosto fossero 9,000 invece di 12,000, quanto si produrrebbe a luglio?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Scorta finale = 20% × 9,000 = 1,800. Produzione = 10,000 + 1,800 − 2,000 = 9,800 unità: con vendite in calo si produce meno di quanto si vende.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; è espresso in dollari?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No, in unità fisiche. I dollari arrivano dopo, quando le unità vengono moltiplicate per i consumi e i prezzi dei fattori nei budget di materiali, lavoro e overhead.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;materiali&quot; class=&quot;part p-slate&quot; aria-labelledby=&quot;h-materiali&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;4&lt;/span&gt;Domande 5–9&lt;/div&gt;
  &lt;h2 id=&quot;h-materiali&quot;&gt;Materie prime: acquisti, pagamenti, &lt;i lang=&quot;en&quot;&gt;accounts payable&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Direct materials budget&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;direct materials budget&lt;/i&gt; (budget delle materie prime dirette) calcola quanta materia prima comprare per sostenere la produzione e mantenere la scorta desiderata di &lt;i lang=&quot;en&quot;&gt;raw materials&lt;/i&gt; (materie prime). Ha la stessa logica del budget di produzione, applicata a un altro magazzino e in un&#x27;altra unità di misura (libbre invece di pezzi).&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Acquisti (lb) = Fabbisogno di produzione + Scorta finale desiderata − Scorta iniziale&lt;small&gt;Fabbisogno di produzione = unità da produrre × 5 lb · Costo degli acquisti = lb acquistate × $2.00&lt;/small&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-labelledby=&quot;ch-t&quot;&gt;
      &lt;title id=&quot;ch-t&quot;&gt;Catena: vendite, produzione, fabbisogno, acquisti&lt;/title&gt;
      &lt;rect x=&quot;5&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-sagebg s-sage&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;72&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Vendite&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;72&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;10,000 unità&lt;/text&gt;
      &lt;rect x=&quot;170&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;237&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Produzione&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;237&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;10,400 unità&lt;/text&gt;
      &lt;rect x=&quot;335&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-slatebg s-slate&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;402&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Fabbisogno&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;402&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;52,000 lb&lt;/text&gt;
      &lt;rect x=&quot;500&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;567&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;Acquisti&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;567&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;52,900 lb&lt;/text&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Direct materials budget&lt;/th&gt;&lt;th&gt;Giugno&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;Luglio&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Unità da produrre&lt;/td&gt;&lt;td&gt;8,720&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× lb per unità&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Fabbisogno di produzione (lb)&lt;/td&gt;&lt;td&gt;43,600&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;52,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Scorta finale desiderata (10% mese dopo)&lt;/td&gt;&lt;td&gt;5,200&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;6,100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Scorta iniziale&lt;/td&gt;&lt;td&gt;4,360&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;5,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Libbre da acquistare&lt;/td&gt;&lt;td&gt;44,440&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;52,900&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costo degli acquisti (× $2.00)&lt;/td&gt;&lt;td&gt;$88,880&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$105,800&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;La colonna di giugno è una verifica: rifacendo i conti con le stesse politiche si ottiene esattamente il costo degli acquisti di giugno ($88,880) che la domanda 7 fornisce come dato. Anche le 61,000 lb di agosto della domanda 5 tornano: 12,200 unità × 5 lb.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;D5 · lb&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;D6 · costo&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;D7 · pagamenti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;D8 · AP&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;D9 · scorta&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Quante libbre acquistare a luglio, se ad agosto servono 61,000 lb?&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;52,000 + 10% × 61,000 − 10% × 52,000&lt;br&gt;= 52,000 + 6,100 − 5,200 = &lt;b&gt;52,900 lb&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Il fabbisogno di luglio viene dal budget di produzione (10,400 × 5); la scorta finale dal fabbisogno di agosto, la iniziale dal fabbisogno di luglio.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Costo stimato degli acquisti di luglio&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;52,900 lb × $2.00 = &lt;b&gt;$105,800&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;È il valore degli acquisti, non quello che si paga a luglio: il pagamento segue le condizioni del punto e.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Pagamenti totali per materie prime a luglio&lt;/b&gt; (&lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt;, uscite di cassa)&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;70% × $88,880 (giugno) + 30% × $105,800 (luglio)&lt;br&gt;= $62,216 + $31,740 = &lt;b&gt;$93,956&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Accounts payable a fine luglio&lt;/b&gt;: gli &lt;i lang=&quot;en&quot;&gt;accounts payable&lt;/i&gt; (AP, debiti verso fornitori) sono gli acquisti già ricevuti ma non ancora pagati, una passività dello stato patrimoniale.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;70% × $105,800 = &lt;b&gt;$74,060&lt;/b&gt;&lt;small&gt;Controllo: AP inizio luglio $62,216 + acquisti $105,800 − pagamenti $93,956 = $74,060&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Valore della scorta di materie prime a fine luglio&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;6,100 lb × $2.00 = &lt;b&gt;$12,200&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;La scorta si valuta al costo d&#x27;acquisto. Va nello stato patrimoniale previsionale tra le rimanenze, separata dalla scorta di prodotti finiti (domanda 12).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

    &lt;figcaption&gt;Stessa struttura degli incassi, ma dal lato fornitori: AP sta agli acquisti come AR sta alle vendite.&lt;/figcaption&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;AR e AP a confronto&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Accounts receivable&lt;/th&gt;&lt;th&gt;Accounts payable&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Nasce da&lt;/td&gt;&lt;td&gt;vendite a credito&lt;/td&gt;&lt;td&gt;acquisti a credito&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Natura&lt;/td&gt;&lt;td&gt;attività (credito)&lt;/td&gt;&lt;td&gt;passività (debito)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Si chiude con&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;cash collections&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fine luglio, Morganton&lt;/td&gt;&lt;td&gt;$420,000&lt;/td&gt;&lt;td&gt;$74,060&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché le libbre acquistate (52,900) sono più del fabbisogno di luglio (52,000)?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Perché la scorta di materie prime deve salire da 5,200 a 6,100 lb (+900) per seguire la produzione crescente di agosto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se si pagasse tutto nel mese d&#x27;acquisto, quanto varrebbero pagamenti e AP di luglio?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Pagamenti = $105,800 (solo gli acquisti di luglio; giugno sarebbe già saldato). AP a fine luglio = $0.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;La scorta di materie prime di fine luglio ($12,200) è un costo di luglio nel conto economico?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No: è un&#x27;attività (rimanenza) nello stato patrimoniale. Diventerà costo solo quando sarà usata nella produzione e il prodotto sarà venduto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;lavoro&quot; class=&quot;part p-brick&quot; aria-labelledby=&quot;h-lavoro&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;5&lt;/span&gt;Domande 10–11&lt;/div&gt;
  &lt;h2 id=&quot;h-lavoro&quot;&gt;&lt;i lang=&quot;en&quot;&gt;Direct labor&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;overhead&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Direct labor budget&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;direct labor budget&lt;/i&gt; (budget della manodopera diretta) stima le ore di lavoro direttamente impiegate sul prodotto e il loro costo: &lt;b&gt;ore = unità da produrre × ore per unità&lt;/b&gt; (&lt;i lang=&quot;en&quot;&gt;direct labor-hours&lt;/i&gt;, DLH), &lt;b&gt;costo = ore × tariffa oraria&lt;/b&gt;. Si parte dalle unità &lt;em&gt;prodotte&lt;/em&gt;, non da quelle vendute.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Direct labor budget&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;Luglio&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Unità da produrre&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× ore dirette per unità&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Ore di manodopera diretta&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;20,800 DLH&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× tariffa oraria&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$15&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Domanda 10 · Costo della manodopera diretta&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$312,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Manufacturing overhead&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;manufacturing overhead&lt;/i&gt; (MOH, costi indiretti di produzione) comprende tutti i costi di fabbrica che non sono materiali diretti né lavoro diretto: energia, manutenzione, supervisione, ammortamenti degli impianti. Una parte è variabile (cresce con l&#x27;attività), una parte fissa. La domanda 11 semplifica: &lt;b&gt;nessun overhead fisso&lt;/b&gt;, overhead variabile di &lt;b&gt;$10 per ora di lavoro diretto&lt;/b&gt;. L&#x27;ora di lavoro diretto è quindi la base di imputazione (&lt;i lang=&quot;en&quot;&gt;allocation base&lt;/i&gt;) dell&#x27;overhead al prodotto.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Unit product cost&lt;/span&gt;
    &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt; (costo unitario di prodotto) è la somma dei costi di produzione di una unità: materiali diretti + lavoro diretto + overhead. Non comprende i costi commerciali e amministrativi.&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-labelledby=&quot;uc-t&quot;&gt;
      &lt;title id=&quot;uc-t&quot;&gt;Composizione del costo unitario: 10 materiali, 30 lavoro, 20 overhead&lt;/title&gt;
      &lt;rect x=&quot;40&quot; y=&quot;40&quot; width=&quot;93.3&quot; height=&quot;50&quot; class=&quot;f-slate&quot;/&gt;
      &lt;rect x=&quot;133.3&quot; y=&quot;40&quot; width=&quot;280&quot; height=&quot;50&quot; class=&quot;f-brick&quot;/&gt;
      &lt;rect x=&quot;413.3&quot; y=&quot;40&quot; width=&quot;186.7&quot; height=&quot;50&quot; class=&quot;f-brickbg s-brick&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;86.7&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;$10&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;273.3&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;$30&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;506.7&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$20&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;86.7&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Direct materials&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;273.3&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Direct labor&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;506.7&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Variable MOH&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;86.7&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;5 lb × $2&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;273.3&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;2 h × $15&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;506.7&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;2 h × $10&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;Unit product cost = $60&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Il lavoro diretto pesa metà del costo unitario; l&#x27;overhead è imputato con le stesse 2 ore per unità.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;formula&quot;&gt;Domanda 11: $10 + $30 + $20 = &lt;b&gt;$60 per unità&lt;/b&gt;&lt;/div&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;E se ci fosse overhead fisso?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;Nel metodo di calcolo dei costi pieni (&lt;i lang=&quot;en&quot;&gt;absorption costing&lt;/i&gt;), usato per valutare rimanenze e costo del venduto, anche l&#x27;overhead fisso entra nel costo unitario. Si calcola un tasso predeterminato (&lt;i lang=&quot;en&quot;&gt;predetermined overhead rate&lt;/i&gt;):&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;Tasso = Overhead totale previsto ÷ Ore dirette previste&lt;/div&gt;
    &lt;p&gt;Esempio ipotetico (non nelle slide): con un overhead fisso di $41,600 a luglio e 20,800 ore, il tasso fisso sarebbe $2 l&#x27;ora, cioè $4 per unità, e il costo unitario salirebbe a $64. L&#x27;esercizio elimina questo passaggio proprio per tenere un costo unitario semplice e costante.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Il lavoro diretto si paga nel mese?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;L&#x27;esercizio non dà condizioni di pagamento per salari e overhead: nei manuali di budgeting di solito si assume che siano pagati nel mese in cui sono sostenuti, quindi i $312,000 sarebbero anche un&#x27;uscita di cassa di luglio nel &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt;. Qui è solo un&#x27;ipotesi di lavoro, la domanda chiede il costo.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il costo del lavoro di luglio usa 10,400 unità e non 10,000?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Perché il lavoro diretto si sostiene per produrre, e a luglio si producono 10,400 unità (domanda 4). Le 10,000 sono le unità vendute.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è il budget dell&#x27;overhead variabile di luglio?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;20,800 ore × $10 = $208,000 (oppure 10,400 unità × $20).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Il costo variabile commerciale di $1.80 entra nel &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No. È un costo di vendita, non di produzione: va tra le spese del periodo (domanda 14), non nel costo del prodotto né nelle rimanenze.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;conto&quot; class=&quot;part p-accent&quot; aria-labelledby=&quot;h-conto&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;6&lt;/span&gt;Domande 12–14&lt;/div&gt;
  &lt;h2 id=&quot;h-conto&quot;&gt;Rimanenze, &lt;i lang=&quot;en&quot;&gt;cost of goods sold&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;gross margin&lt;/i&gt; e spese&lt;/h2&gt;

  &lt;h3&gt;Domanda 12 · Scorta di prodotti finiti a fine luglio&lt;/h3&gt;
  &lt;p&gt;La scorta in unità è già nota dal budget di produzione (2,400); si valuta al costo unitario di prodotto:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;2,400 unità × $60 = &lt;b&gt;$144,000&lt;/b&gt;&lt;/div&gt;

  &lt;h3&gt;Domanda 13 · Costo del venduto e margine lordo&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Dalle note della slide 4&lt;/span&gt;
    &lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Cost of goods sold&lt;/i&gt; (COGS, costo del venduto) = costo di prodotto complessivo dei beni venduti, &lt;em&gt;&quot;solo di prodotto, non commerciale e amministrativo&quot;&lt;/em&gt;.&lt;br&gt;&lt;i lang=&quot;en&quot;&gt;Gross margin&lt;/i&gt; (margine lordo) = ricavi − costo del venduto.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;COGS = 10,000 unità vendute × $60 = &lt;b&gt;$600,000&lt;/b&gt;&lt;br&gt;Gross margin = $700,000 − $600,000 = &lt;b&gt;$100,000&lt;/b&gt;&lt;/div&gt;
  &lt;p&gt;Attenzione al numero di unità: il COGS usa le unità &lt;em&gt;vendute&lt;/em&gt; (10,000), non quelle prodotte (10,400). Le 400 unità di differenza restano in magazzino come aumento della scorta (da $120,000 a $144,000).&lt;/p&gt;

  &lt;h3&gt;Domanda 14 · Spese commerciali e amministrative&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Selling and administrative expense&lt;/span&gt;
    &lt;p&gt;Le &lt;i lang=&quot;en&quot;&gt;selling and administrative expenses&lt;/i&gt; (S&amp;amp;A, spese commerciali e amministrative) sono costi del periodo (&lt;i lang=&quot;en&quot;&gt;period costs&lt;/i&gt;): non entrano nel costo del prodotto e vanno a conto economico nel mese in cui si sostengono. Hanno una parte variabile, legata alle unità &lt;em&gt;vendute&lt;/em&gt;, e una fissa.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;10,000 × $1.80 + $60,000 = $18,000 + $60,000 = &lt;b&gt;$78,000&lt;/b&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 290&quot; role=&quot;img&quot; aria-labelledby=&quot;wf-t&quot;&gt;
      &lt;title id=&quot;wf-t&quot;&gt;Cascata: ricavi, costo del venduto, margine lordo, spese S&amp;amp;A, reddito operativo&lt;/title&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;40&quot; y1=&quot;250&quot; x2=&quot;610&quot; y2=&quot;250&quot;/&gt;
      &lt;rect x=&quot;60&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;200&quot; class=&quot;f-accent&quot;/&gt;
      &lt;rect x=&quot;170&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;171.4&quot; class=&quot;f-brick&quot;/&gt;
      &lt;rect x=&quot;280&quot; y=&quot;221.4&quot; width=&quot;80&quot; height=&quot;28.6&quot; class=&quot;f-sage&quot;/&gt;
      &lt;rect x=&quot;390&quot; y=&quot;221.4&quot; width=&quot;80&quot; height=&quot;22.3&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect x=&quot;500&quot; y=&quot;243.7&quot; width=&quot;80&quot; height=&quot;6.3&quot; class=&quot;f-ink&quot;/&gt;
      &lt;path class=&quot;ln dash&quot; d=&quot;M140 50 L170 50 M250 221.4 L280 221.4 M360 221.4 L390 221.4 M470 243.7 L500 243.7&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;100&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$700,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;210&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;−$600,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;213&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$100,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;430&quot; y=&quot;213&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;−$78,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;540&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$22,000&lt;/text&gt;

      &lt;text class=&quot;svgs&quot; x=&quot;210&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;COGS&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;Gross margin&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;430&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;S&amp;amp;A expense&lt;/text&gt;

      &lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot;&gt;luglio, in dollari, scala proporzionale&lt;/text&gt;
