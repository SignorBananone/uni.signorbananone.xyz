    &lt;figcaption&gt;Unendo le domande 1, 13 e 14 si ottiene il &lt;i lang=&quot;en&quot;&gt;budgeted income statement&lt;/i&gt; di luglio. L&#x27;ultimo passaggio, il &lt;i lang=&quot;en&quot;&gt;net operating income&lt;/i&gt; (reddito operativo, $22,000), non è chiesto dalle slide ma è la conseguenza diretta: il margine è sottile, il 3% circa dei ricavi.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Product vs period costs&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Gross vs contribution margin&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;i lang=&quot;en&quot;&gt;Product costs&lt;/i&gt;&lt;/th&gt;&lt;th&gt;&lt;i lang=&quot;en&quot;&gt;Period costs&lt;/i&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Cosa sono&lt;/td&gt;&lt;td&gt;DM, DL, MOH&lt;/td&gt;&lt;td&gt;S&amp;amp;A (vendita e amministrazione)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Quando diventano costo&lt;/td&gt;&lt;td&gt;quando il prodotto è venduto (COGS)&lt;/td&gt;&lt;td&gt;nel periodo in cui si sostengono&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Possono stare in magazzino?&lt;/td&gt;&lt;td&gt;sì, nelle rimanenze ($144,000)&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Morganton, luglio&lt;/td&gt;&lt;td&gt;$60 per unità&lt;/td&gt;&lt;td&gt;$78,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;gross margin&lt;/i&gt; (formato tradizionale) sottrae ai ricavi i costi di prodotto. Il &lt;i lang=&quot;en&quot;&gt;contribution margin&lt;/i&gt; (margine di contribuzione, formato per variabilità) sottrae invece tutti i costi variabili, di produzione e di vendita.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Luglio&lt;/th&gt;&lt;th&gt;Traditional&lt;/th&gt;&lt;th&gt;Contribution&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;− COGS / costi variabili ($600,000 + $18,000)&lt;/td&gt;&lt;td&gt;$600,000&lt;/td&gt;&lt;td&gt;$618,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;= Margine&lt;/td&gt;&lt;td&gt;$100,000&lt;/td&gt;&lt;td&gt;$82,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;− S&amp;amp;A / costi fissi&lt;/td&gt;&lt;td&gt;$78,000&lt;/td&gt;&lt;td&gt;$60,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;$22,000&lt;/td&gt;&lt;td&gt;$22,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Il risultato coincide perché non c&#x27;è overhead fisso: tutto il costo di prodotto è variabile. Con overhead fisso in magazzino i due formati darebbero redditi diversi.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché la scorta finale di prodotti finiti vale $144,000 e non 2,400 × $70?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Perché le rimanenze si valutano al costo ($60), non al prezzo di vendita ($70). Il margine si realizza solo quando l&#x27;unità viene venduta.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un compagno calcola il COGS come 10,400 × $60 = $624,000. Dov&#x27;è l&#x27;errore?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Usa le unità prodotte. Il costo del venduto riguarda solo le 10,000 unità vendute; le 400 in più aumentano la scorta di prodotti finiti.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se le vendite di luglio salissero a 11,000 unità (stesso prezzo), di quanto aumenterebbe il reddito operativo?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Ogni unità in più porta $70 − $60 − $1.80 = $8.20 di margine di contribuzione: 1,000 × $8.20 = $8,200 in più, quindi $30,200. I $60,000 fissi non cambiano. Puoi verificarlo nel simulatore qui sotto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;simulatore&quot; class=&quot;part p-ochre&quot; aria-labelledby=&quot;h-sim&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;7&lt;/span&gt;Tutto insieme&lt;/div&gt;
  &lt;h2 id=&quot;h-sim&quot;&gt;Simulatore: le 14 risposte in un colpo solo&lt;/h2&gt;
  &lt;p&gt;Cambia le ipotesi del caso e guarda come si propagano lungo la catena del &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt;. Restano fisse le vendite di giugno, agosto e settembre, i consumi (5 lb, 2 ore), le tariffe ($2, $15, $10 di overhead) e le spese S&amp;amp;A ($1.80 e $60,000). Per coerenza, le 61,000 lb di agosto e gli acquisti di giugno ($88,880) vengono ricalcolati con le politiche scelte.&lt;/p&gt;
  &lt;figure class=&quot;wide&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-units&quot;&gt;Vendite di luglio (unità)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-units&quot; min=&quot;8000&quot; max=&quot;14000&quot; step=&quot;100&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;s-units-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-price&quot;&gt;Prezzo di vendita&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-price&quot; min=&quot;50&quot; max=&quot;90&quot; step=&quot;1&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;s-price-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-fg&quot;&gt;Scorta prodotti finiti&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-fg&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;s-fg-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-rm&quot;&gt;Scorta materie prime&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-rm&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;s-rm-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-coll&quot;&gt;Incassato nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-coll&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;s-coll-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-pay&quot;&gt;Pagato nel mese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-pay&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;s-pay-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;s-reset&quot; type=&quot;button&quot;&gt;Ripristina i dati delle slide&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;tbl answers&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Risultato&lt;/th&gt;&lt;th&gt;Come si calcola&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;1 · Vendite di luglio&lt;/td&gt;&lt;td id=&quot;r1&quot;&gt;&lt;/td&gt;&lt;td&gt;unità × prezzo&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;2 · Incassi di luglio&lt;/td&gt;&lt;td id=&quot;r2&quot;&gt;&lt;/td&gt;&lt;td&gt;% nel mese × luglio + resto di giugno&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3 · AR fine luglio&lt;/td&gt;&lt;td id=&quot;r3&quot;&gt;&lt;/td&gt;&lt;td&gt;quota di luglio non incassata&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;4 · Produzione di luglio&lt;/td&gt;&lt;td id=&quot;r4&quot;&gt;&lt;/td&gt;&lt;td&gt;vendite + scorta finale − iniziale&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;5 · Acquisti di luglio (lb)&lt;/td&gt;&lt;td id=&quot;r5&quot;&gt;&lt;/td&gt;&lt;td&gt;fabbisogno + scorta finale − iniziale &lt;span class=&quot;src&quot; id=&quot;r5n&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;6 · Costo acquisti&lt;/td&gt;&lt;td id=&quot;r6&quot;&gt;&lt;/td&gt;&lt;td&gt;lb × $2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;7 · Pagamenti materie prime&lt;/td&gt;&lt;td id=&quot;r7&quot;&gt;&lt;/td&gt;&lt;td&gt;% nel mese × luglio + resto di giugno &lt;span class=&quot;src&quot; id=&quot;r7n&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8 · AP fine luglio&lt;/td&gt;&lt;td id=&quot;r8&quot;&gt;&lt;/td&gt;&lt;td&gt;quota di luglio non pagata&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;9 · Scorta materie prime&lt;/td&gt;&lt;td id=&quot;r9&quot;&gt;&lt;/td&gt;&lt;td&gt;% × fabbisogno di agosto × $2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;10 · Manodopera diretta&lt;/td&gt;&lt;td id=&quot;r10&quot;&gt;&lt;/td&gt;&lt;td&gt;produzione × 2 h × $15&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;11 · Costo unitario&lt;/td&gt;&lt;td id=&quot;r11&quot;&gt;&lt;/td&gt;&lt;td&gt;$10 + $30 + $20, non dipende dalle politiche&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;12 · Scorta prodotti finiti&lt;/td&gt;&lt;td id=&quot;r12&quot;&gt;&lt;/td&gt;&lt;td&gt;% × vendite di agosto × costo unitario&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;13 · COGS · Gross margin&lt;/td&gt;&lt;td id=&quot;r13&quot;&gt;&lt;/td&gt;&lt;td&gt;unità vendute × costo unitario; ricavi − COGS&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;14 · Spese S&amp;amp;A&lt;/td&gt;&lt;td id=&quot;r14&quot;&gt;&lt;/td&gt;&lt;td&gt;unità vendute × $1.80 + $60,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;extra · Net operating income&lt;/td&gt;&lt;td id=&quot;r15&quot;&gt;&lt;/td&gt;&lt;td&gt;gross margin − S&amp;amp;A&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;figcaption&gt;Valori con i dati delle slide: 1) $700,000 · 2) $632,800 · 3) $420,000 · 4) 10,400 · 5) 52,900 lb · 6) $105,800 · 7) $93,956 · 8) $74,060 · 9) $12,200 · 10) $312,000 · 11) $60 · 12) $144,000 · 13) $600,000 e $100,000 · 14) $78,000. Le soluzioni non sono nelle slide: confrontale con quelle discusse a lezione.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica con il simulatore&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Porta la scorta di prodotti finiti a 0%. Quali risposte cambiano e quali no?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Cambiano produzione (10,000), acquisti, pagamenti, AP, scorta di materie prime, lavoro diretto (300,000) e scorta di prodotti finiti ($0). Non cambiano vendite, incassi, AR, costo unitario, COGS, margine e S&amp;amp;A: la politica di scorta sposta i costi tra magazzino e periodi, ma con tutti costi variabili non modifica il reddito.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Abbassa il prezzo a $61. Che succede al reddito operativo e perché?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Diventa negativo: ricavi $610,000 − COGS $600,000 = margine $10,000, meno $78,000 di S&amp;amp;A = −$68,000. Il margine di contribuzione unitario scende a $61 − $61.80 = −$0.80: ogni unità venduta fa perdere denaro ancor prima dei costi fissi.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part p-slate&quot; aria-labelledby=&quot;h-fonti&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;+&lt;/span&gt;Per approfondire&lt;/div&gt;
  &lt;h2 id=&quot;h-fonti&quot;&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide non citano autori, testi, norme o siti: contengono solo il testo dell&#x27;esercizio, l&#x27;intestazione dell&#x27;Università degli Studi di Bergamo e il nome della docente. Qui sotto trovi l&#x27;istituzione citata e due manuali in cui questo tipo di esercizio è spiegato per intero. Tutto ciò che segue viene dalla ricerca web ed è segnato come &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;refs&quot;&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Università degli Studi di Bergamo · Dipartimento di Scienze Aziendali&lt;/h4&gt;
      &lt;p&gt;È l&#x27;ateneo indicato su ogni slide. Sul sito trovi le pagine degli insegnamenti con programma, testi d&#x27;esame consigliati e modalità di valutazione: è il riferimento ufficiale per sapere quale manuale segue il corso.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.unibg.it&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Garrison, Noreen, Brewer · &lt;i lang=&quot;en&quot;&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;Il manuale di contabilità direzionale più diffuso in lingua inglese. Nella 18ª edizione (2023, ISBN 9781266248610) il capitolo 8, &lt;i lang=&quot;en&quot;&gt;Master Budgeting&lt;/i&gt;, sviluppa esattamente la catena di questo esercizio: &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;schedule of expected cash collections&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;production&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;direct materials&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;direct labor&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;manufacturing overhead&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;ending finished goods inventory&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;selling and administrative expense&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt; e bilanci previsionali; il capitolo 9 passa ai &lt;i lang=&quot;en&quot;&gt;flexible budgets&lt;/i&gt;. Conta perché ne riprende lessico e formato delle tabelle: il problema &quot;Morganton Company&quot; circola online in più versioni (una con prezzo $70 come questa, una con prezzo $65) come esercizio di questo filone di manuali. L&#x27;attribuzione al libro non è confermata dalle slide.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.mheducation.com.sg/managerial-accounting-ise-9781266248610-asia-group&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;McGraw Hill · scheda della 18ª edizione e indice&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;OpenStax · &lt;i lang=&quot;en&quot;&gt;Principles of Accounting, Volume 2: Managerial Accounting&lt;/i&gt;&lt;/h4&gt;
      &lt;p&gt;Manuale universitario gratuito e aperto (Rice University). Il capitolo 7, &lt;i lang=&quot;en&quot;&gt;Budgeting&lt;/i&gt;, tratta nella sezione 7.2 gli &lt;i lang=&quot;en&quot;&gt;operating budgets&lt;/i&gt; (vendite, produzione, materiali, lavoro, overhead, S&amp;amp;A) e nella 7.3 i &lt;i lang=&quot;en&quot;&gt;financial budgets&lt;/i&gt; (incassi, pagamenti, cassa). Conta perché è consultabile gratis online, con esempi svolti e un glossario dei termini chiave, utile per ripassare il lessico in inglese.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org · indice del libro&lt;/a&gt; · &lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/7-key-terms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;capitolo 7 · key terms&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Per il percorso del corso, il materiale di riferimento resta quello indicato dalla docente: verifica sul programma ufficiale quale testo è adottato.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  var fmt=function(n){return (n&lt;0?&#x27;−$&#x27;:&#x27;$&#x27;)+Math.abs(Math.round(n)).toLocaleString(&#x27;en-US&#x27;)};
  var fu=function(n){return Math.round(n).toLocaleString(&#x27;en-US&#x27;)};
  var $=function(id){return document.getElementById(id)};
  var set=function(id,v){var e=$(id);if(e)e.textContent=v};
  window.__fmt=fmt;window.__fu=fu;

  /* tabs */
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;),panels=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,i===j?&#x27;true&#x27;:&#x27;false&#x27;);panels[j].hidden=i!==j});
    })});
  });

  /* steppers */
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),cnt=s.querySelector(&#x27;.count&#x27;);
    function show(){steps.forEach(function(x,j){x.hidden=j!==i});prev.disabled=i===0;next.disabled=i===steps.length-1;cnt.textContent=&#x27;Passo &#x27;+(i+1)+&#x27; di &#x27;+steps.length}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });

  /* quiz */
  document.querySelectorAll(&#x27;.reveal&#x27;).forEach(function(b){
    b.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
    b.addEventListener(&#x27;click&#x27;,function(){
      var a=b.nextElementSibling;a.hidden=!a.hidden;
      b.textContent=a.hidden?&#x27;Mostra risposta&#x27;:&#x27;Nascondi risposta&#x27;;
      b.setAttribute(&#x27;aria-expanded&#x27;,a.hidden?&#x27;false&#x27;:&#x27;true&#x27;);
    });
  });

  /* collections slider */
  var coll=$(&#x27;coll&#x27;);
  if(coll){
    var updColl=function(){
      var p=coll.value/100,jun=588000,jul=700000,a=(1-p)*jun,b=p*jul,sc=420/700000;
      set(&#x27;coll-o&#x27;,coll.value+&#x27;%&#x27;);
      set(&#x27;coll-tot&#x27;,fmt(a+b));set(&#x27;coll-ar&#x27;,fmt((1-p)*jul));
      set(&#x27;coll-a&#x27;,fmt(a));set(&#x27;coll-b&#x27;,fmt(b));
      $(&#x27;cb-a&#x27;).setAttribute(&#x27;width&#x27;,a*sc);
      $(&#x27;cb-b&#x27;).setAttribute(&#x27;x&#x27;,180+a*sc);$(&#x27;cb-b&#x27;).setAttribute(&#x27;width&#x27;,b*sc);
      $(&#x27;cb-ar&#x27;).setAttribute(&#x27;width&#x27;,(1-p)*jul*sc);
      set(&#x27;cb-tl&#x27;,fmt(a+b));$(&#x27;cb-tl&#x27;).setAttribute(&#x27;x&#x27;,186+(a+b)*sc);
      set(&#x27;cb-arl&#x27;,fmt((1-p)*jul));$(&#x27;cb-arl&#x27;).setAttribute(&#x27;x&#x27;,186+(1-p)*jul*sc);
    };
    coll.addEventListener(&#x27;input&#x27;,updColl);updColl();
  }

  /* production slider */
  var fg=$(&#x27;fgp&#x27;);
  if(fg){
    var sales=[8400,10000,12000,13000];
    var updFg=function(){
      var f=fg.value/100,sc=170/14000,base=225;
      set(&#x27;fgp-o&#x27;,fg.value+&#x27;%&#x27;);
      for(var m=0;m&lt;3;m++){
        var prod=sales[m]+f*sales[m+1]-f*sales[m];
        var hs=sales[m]*sc,hp=prod*sc;
        $(&#x27;ps&#x27;+m).setAttribute(&#x27;y&#x27;,base-hs);$(&#x27;ps&#x27;+m).setAttribute(&#x27;height&#x27;,hs);
        $(&#x27;pp&#x27;+m).setAttribute(&#x27;y&#x27;,base-hp);$(&#x27;pp&#x27;+m).setAttribute(&#x27;height&#x27;,hp);
        set(&#x27;ppl&#x27;+m,fu(prod));$(&#x27;ppl&#x27;+m).setAttribute(&#x27;y&#x27;,base-hp-6);
        set(&#x27;psl&#x27;+m,fu(sales[m]));$(&#x27;psl&#x27;+m).setAttribute(&#x27;y&#x27;,base-hs-6);
        if(m===1)set(&#x27;fgp-jul&#x27;,fu(prod)+&#x27; unità&#x27;);
      }
      set(&#x27;fgp-end&#x27;,fu(f*12000)+&#x27; unità&#x27;);set(&#x27;fgp-beg&#x27;,fu(f*10000)+&#x27; unità&#x27;);
    };
    fg.addEventListener(&#x27;input&#x27;,updFg);updFg();
  }

  /* simulator */
  var simIds=[&#x27;s-units&#x27;,&#x27;s-price&#x27;,&#x27;s-fg&#x27;,&#x27;s-rm&#x27;,&#x27;s-coll&#x27;,&#x27;s-pay&#x27;];
  if($(&#x27;s-units&#x27;)){
    var defaults={};simIds.forEach(function(id){defaults[id]=$(id).value});
    var sim=function(){
      var jun=8400,jul=+$(&#x27;s-units&#x27;).value,aug=12000,sep=13000,price=+$(&#x27;s-price&#x27;).value,
          f=$(&#x27;s-fg&#x27;).value/100,r=$(&#x27;s-rm&#x27;).value/100,c=$(&#x27;s-coll&#x27;).value/100,p=$(&#x27;s-pay&#x27;).value/100;
      set(&#x27;s-units-o&#x27;,fu(jul));set(&#x27;s-price-o&#x27;,&#x27;$&#x27;+price);set(&#x27;s-fg-o&#x27;,$(&#x27;s-fg&#x27;).value+&#x27;%&#x27;);
      set(&#x27;s-rm-o&#x27;,$(&#x27;s-rm&#x27;).value+&#x27;%&#x27;);set(&#x27;s-coll-o&#x27;,$(&#x27;s-coll&#x27;).value+&#x27;%&#x27;);set(&#x27;s-pay-o&#x27;,$(&#x27;s-pay&#x27;).value+&#x27;%&#x27;);
      var q1=jul*price,q2=c*q1+(1-c)*jun*price,q3=(1-c)*q1;
      var pJun=jun+f*jul-f*jun,pJul=jul+f*aug-f*jul,pAug=aug+f*sep-f*aug;
      var nJun=5*pJun,nJul=5*pJul,nAug=5*pAug;
      var purJun=nJun+r*nJul-r*nJun,purJul=nJul+r*nAug-r*nJul;
      var q6=purJul*2,q7=p*q6+(1-p)*purJun*2,q8=(1-p)*q6,q9=r*nAug*2,q10=pJul*2*15;
      var uc=5*2+2*15+2*10,q12=f*aug*uc,cogs=jul*uc,gm=q1-cogs,q14=jul*1.8+60000;
      set(&#x27;r1&#x27;,fmt(q1));set(&#x27;r2&#x27;,fmt(q2));set(&#x27;r3&#x27;,fmt(q3));set(&#x27;r4&#x27;,fu(pJul)+&#x27; unità&#x27;);
      set(&#x27;r5&#x27;,fu(purJul)+&#x27; lb&#x27;);set(&#x27;r5n&#x27;,&#x27;(fabbisogno di agosto: &#x27;+fu(nAug)+&#x27; lb)&#x27;);
      set(&#x27;r6&#x27;,fmt(q6));set(&#x27;r7&#x27;,fmt(q7));set(&#x27;r7n&#x27;,&#x27;(acquisti di giugno: &#x27;+fmt(purJun*2)+&#x27;)&#x27;);
      set(&#x27;r8&#x27;,fmt(q8));set(&#x27;r9&#x27;,fmt(q9));set(&#x27;r10&#x27;,fmt(q10));set(&#x27;r11&#x27;,fmt(uc));set(&#x27;r12&#x27;,fmt(q12));
      set(&#x27;r13&#x27;,fmt(cogs)+&#x27; · &#x27;+fmt(gm));set(&#x27;r14&#x27;,fmt(q14));set(&#x27;r15&#x27;,fmt(gm-q14));
    };
    simIds.forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,sim)});
    $(&#x27;s-reset&#x27;).addEventListener(&#x27;click&#x27;,function(){simIds.forEach(function(id){$(id).value=defaults[id]});sim()});
    sim();
  }
})();
&lt;/script&gt;
