section.part{--c:var(--accent);--cbg:var(--accent-bg);padding:3rem 0 2rem;border-top:1px solid var(--rule)}

  &lt;h1&gt;The &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; of Morganton Company&lt;/h1&gt;
  &lt;p class=&quot;lede&quot;&gt;One company, one product, four months of forecasts: from the units expected to be sold through to cash collections, production, purchases, cost of goods sold and margin. Fourteen questions that, solved in sequence, build the budget piece by piece.&lt;/p&gt;
  &lt;p class=&quot;meta&quot;&gt;Slides: &lt;em&gt;Budgeting – Excercise 1&lt;/em&gt;, Prof. Silvia Pilonato, University of Bergamo, Department of Management (file &lt;code&gt;corso/Budgeting/11.SMA Budget clean/11.SMA_Budget clean.pdf&lt;/code&gt;, 4 slides: case text, questions 1–10, questions 11–14 with three definitional notes). The slides contain only the text of the exercise: the explanations, solutions and diagrams on this page are reconstructed from those data.&lt;/p&gt;
&lt;/header&gt;

      &lt;g&gt;&lt;rect class=&quot;box f-card s-rule dash&quot; x=&quot;45&quot; y=&quot;347&quot; width=&quot;172&quot; height=&quot;46&quot; rx=&quot;10&quot; style=&quot;stroke:var(--muted)&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;130&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cash budget&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;130&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;not required here&lt;/text&gt;&lt;/g&gt;

      &lt;a href=&quot;#lavoro&quot;&gt;&lt;rect class=&quot;box f-brickbg s-brick&quot; x=&quot;475&quot; y=&quot;347&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;560&quot; y=&quot;367&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Unit product cost&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;560&quot; y=&quot;383&quot; text-anchor=&quot;middle&quot;&gt;question 11&lt;/text&gt;&lt;/a&gt;

&lt;section id=&quot;master&quot; class=&quot;part p-accent&quot; aria-labelledby=&quot;h-master&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;1&lt;/span&gt;The framework&lt;/div&gt;
  &lt;h2 id=&quot;h-master&quot;&gt;What the &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; is and what the case gives us&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Definition&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; is the coordinated set of budgets through which a company translates its plans into figures for a future period, usually a year broken down into months or quarters. It is not a single schedule but a chain of linked budgets: each budget uses the results of the previous one.&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;The chain almost always starts from sales, because the quantity expected to be sold determines how much to produce, how much material to purchase, how much labor to employ and which selling costs to incur. Budgets fall into two families:&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Operating budgets&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Financial budgets&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Why prepare it&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;&lt;i lang=&quot;en&quot;&gt;Operating budgets&lt;/i&gt;&lt;/b&gt;: they describe the company&#x27;s core operations. The exercise includes the &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt;, the &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; (production in units), the &lt;i lang=&quot;en&quot;&gt;direct materials budget&lt;/i&gt;, the &lt;i lang=&quot;en&quot;&gt;direct labor budget&lt;/i&gt;, the &lt;i lang=&quot;en&quot;&gt;manufacturing overhead budget&lt;/i&gt;, the &lt;i lang=&quot;en&quot;&gt;selling and administrative expense budget&lt;/i&gt; and, downstream, the cost of goods sold.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;&lt;i lang=&quot;en&quot;&gt;Financial budgets&lt;/i&gt;&lt;/b&gt;: they translate operations into cash flows and balance-sheet values. Their building blocks appear here: &lt;i lang=&quot;en&quot;&gt;cash collections&lt;/i&gt; (receipts from customers), &lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt; (payments to suppliers) and the month-end balances of receivables, payables and inventories, which flow into the &lt;i lang=&quot;en&quot;&gt;budgeted balance sheet&lt;/i&gt;. The complete &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;budgeted income statement&lt;/i&gt; are not required.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The budget serves to &lt;b&gt;plan&lt;/b&gt; (set realistic targets), to &lt;b&gt;coordinate&lt;/b&gt; (sales, production and purchasing must work from the same figures), to &lt;b&gt;forecast cash&lt;/b&gt; (know in advance when financing will be needed) and to &lt;b&gt;control&lt;/b&gt; (after the fact, actual results are compared with the budget and variances are analysed).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The case data &lt;span class=&quot;slide&quot;&gt;from the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Morganton Company makes &lt;b&gt;a single product&lt;/b&gt;. The seven assumptions on slide 2, grouped by budget:&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;tile p-sage&quot;&gt;&lt;span class=&quot;tag&quot;&gt;a&lt;/span&gt;Price $70 per unit. Unit sales: June 8,400 · July 10,000 · August 12,000 · September 13,000. All sales on credit.&lt;small&gt;→ sales budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-sage&quot;&gt;&lt;span class=&quot;tag&quot;&gt;b&lt;/span&gt;40% of credit sales are collected in the month of sale, 60% in the following month.&lt;small&gt;→ cash collections&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-ochre&quot;&gt;&lt;span class=&quot;tag&quot;&gt;c&lt;/span&gt;Ending finished goods inventory = 20% of the following month&#x27;s unit sales.&lt;small&gt;→ production budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-slate&quot;&gt;&lt;span class=&quot;tag&quot;&gt;d&lt;/span&gt;Ending raw materials inventory = 10% of the following month&#x27;s production needs. 5 pounds per unit, $2.00 per pound.&lt;small&gt;→ direct materials budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-slate&quot;&gt;&lt;span class=&quot;tag&quot;&gt;e&lt;/span&gt;Raw material purchases are paid 30% in the month of purchase, 70% in the following month.&lt;small&gt;→ cash disbursements&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-brick&quot;&gt;&lt;span class=&quot;tag&quot;&gt;f&lt;/span&gt;Direct labor: $15 per hour, 2 hours per unit.&lt;small&gt;→ direct labor budget&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;tile p-accent&quot;&gt;&lt;span class=&quot;tag&quot;&gt;g&lt;/span&gt;Selling and administrative expenses: variable $1.80 per unit sold, fixed $60,000 per month.&lt;small&gt;→ S&amp;amp;A expense budget&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;All the questions concern &lt;b&gt;July&lt;/b&gt;. June is needed because July&#x27;s collections and disbursements include the tail of the previous month; August and September are needed because ending inventories are calculated on the following month&#x27;s sales and production. Units of measure as in the case: dollars and &lt;i lang=&quot;en&quot;&gt;pounds&lt;/i&gt; (lb).&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;What the slides take for granted&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;&lt;b&gt;Accrual and cash are two different things.&lt;/b&gt; A sale &lt;i lang=&quot;en&quot;&gt;on credit&lt;/i&gt; is revenue of the month in which it occurs, but the cash comes in later. That is why the same month has a sales (revenue) figure that differs from its collections figure, and the difference remains as an account receivable.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Inventory policies are &quot;bridges&quot; between months.&lt;/b&gt; One month&#x27;s ending inventory is the next month&#x27;s beginning inventory. If the policy always applies, July&#x27;s beginning inventory is 20% of July&#x27;s sales (calculated at the end of June).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;One product, constant standard costs.&lt;/b&gt; Price, material usage, hours and rates do not change from month to month: that is why there is a single unit cost and all inventories are valued at the same cost.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is the &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt; prepared first?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Because almost all the other budgets depend on the units to be sold: production derives from sales plus desired inventory, purchases from production, labor from production, variable selling costs from units sold, collections from revenue.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Customer collections and the month-end receivables balance: &lt;i lang=&quot;en&quot;&gt;operating&lt;/i&gt; or &lt;i lang=&quot;en&quot;&gt;financial budget&lt;/i&gt;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Financial: they concern cash (collections) and the balance sheet (receivables). Sales revenue, by contrast, belongs to the sales budget, an operating budget.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why are June and August data also needed if the questions concern only July?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;June: 60% of June&#x27;s sales and 70% of June&#x27;s purchases are collected or paid in July, and July&#x27;s beginning inventory originates in June. August: July&#x27;s ending inventories are defined as a percentage of August&#x27;s sales and production needs.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;vendite&quot; class=&quot;part p-sage&quot; aria-labelledby=&quot;h-vendite&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;2&lt;/span&gt;Questions 1–3&lt;/div&gt;
  &lt;h2 id=&quot;h-vendite&quot;&gt;Sales, collections and &lt;i lang=&quot;en&quot;&gt;accounts receivable&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Sales budget&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt; estimates the units sold and the revenue of each period: &lt;b&gt;revenue = units sold × unit price&lt;/b&gt;. It is the foundation of the entire master budget.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Sales budget&lt;/th&gt;&lt;th&gt;June&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;July&lt;/th&gt;&lt;th&gt;August&lt;/th&gt;&lt;th&gt;September&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Units sold&lt;/td&gt;&lt;td&gt;8,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;td&gt;13,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× unit price&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$70&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;td&gt;$70&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Revenue (&lt;i lang=&quot;en&quot;&gt;sales&lt;/i&gt;)&lt;/td&gt;&lt;td&gt;$588,000&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$700,000&lt;/td&gt;&lt;td&gt;$840,000&lt;/td&gt;&lt;td&gt;$910,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Cash collections and accounts receivable&lt;/span&gt;
    &lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Cash collections&lt;/i&gt; are the actual cash receipts from customers in a month. &lt;i lang=&quot;en&quot;&gt;Accounts receivable&lt;/i&gt; (AR) are, as the note on slide 3 puts it, &lt;em&gt;&quot;the amount of goods sold that have not yet been paid for (no cash received)&quot;&lt;/em&gt;: a balance-sheet asset.&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 215&quot; role=&quot;img&quot; aria-labelledby=&quot;tl1-t&quot;&gt;
      &lt;title id=&quot;tl1-t&quot;&gt;Collection schedule: 40% in the month of sale, 60% in the following month&lt;/title&gt;
      &lt;rect class=&quot;f-sagebg&quot; x=&quot;225&quot; y=&quot;28&quot; width=&quot;190&quot; height=&quot;150&quot; rx=&quot;8&quot;/&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;120&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;June&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;320&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;July&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;520&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;August&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;30&quot; y=&quot;46&quot;&gt;June sales · $588,000&lt;/text&gt;
      &lt;rect x=&quot;30&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot; opacity=&quot;.45&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;120&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;40% · $235,200&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;60% · $352,800&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;230&quot; y=&quot;112&quot;&gt;July sales · $700,000&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;40% · $280,000&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-card s-sage dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;520&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;60% · $420,000&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;520&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;= AR at end of July&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;July collections = $352,800 + $280,000 = $632,800&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Each sale generates two collections in two different months. The July column adds the tail of June to the first instalment of July; the share of July that slips into August is the receivable still outstanding at month-end.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Question 1 · Budgeted sales for July&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;10,000 units × $70 = &lt;b&gt;$700,000&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;This is an accrual figure: the revenue is recognised in July even though the customer will pay part of it in August.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Question 2 · Expected cash collections in July&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;60% × $588,000 (June) + 40% × $700,000 (July)&lt;br&gt;= $352,800 + $280,000 = &lt;b&gt;$632,800&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Typical mistake: taking only 40% of July, forgetting that the balance of June&#x27;s sales is also collected in July.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Question 3 · Accounts receivable at the end of July&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;60% × $700,000 = &lt;b&gt;$420,000&lt;/b&gt;&lt;small&gt;Check: AR at beginning of July $352,800 + sales $700,000 − collections $632,800 = $420,000&lt;/small&gt;&lt;/div&gt;
      &lt;p&gt;The check uses the equation that applies to every balance-sheet account: &lt;b&gt;beginning balance + increases − decreases = ending balance&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn ghost prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Try changing the collection policy&lt;/h3&gt;
  &lt;p&gt;Move the slider: what happens to July&#x27;s collections and receivables if customers pay more (or less) in the month of sale?&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;coll&quot;&gt;Collected in the month of sale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;coll&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;coll-o&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 720 125&quot; role=&quot;img&quot; aria-label=&quot;Bars: July collections and receivables at the end of July&quot;&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;0&quot; y=&quot;42&quot;&gt;July collections&lt;/text&gt;
      &lt;rect id=&quot;cb-a&quot; x=&quot;180&quot; y=&quot;20&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-sagebg s-sage&quot; stroke-width=&quot;1&quot;/&gt;
      &lt;rect id=&quot;cb-b&quot; x=&quot;180&quot; y=&quot;20&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text id=&quot;cb-tl&quot; class=&quot;svgt&quot; x=&quot;186&quot; y=&quot;42&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;0&quot; y=&quot;102&quot;&gt;Receivables, end of July&lt;/text&gt;
      &lt;rect id=&quot;cb-ar&quot; x=&quot;180&quot; y=&quot;80&quot; height=&quot;34&quot; width=&quot;0&quot; class=&quot;f-card s-sage dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text id=&quot;cb-arl&quot; class=&quot;svgt&quot; x=&quot;186&quot; y=&quot;102&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;from June sales&lt;b id=&quot;coll-a&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;from July sales&lt;b id=&quot;coll-b&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;total July collections&lt;b id=&quot;coll-tot&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;AR at end of July&lt;b id=&quot;coll-ar&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Light: share from June sales; solid: share from July sales. Because sales are growing (June $588,000 → July $700,000), collecting more up front increases July&#x27;s collections and reduces receivables. July revenue stays at $700,000 whatever the percentage.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If 100% of sales were collected in the month of sale, what would July&#x27;s collections and AR be?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Collections = $700,000 (July&#x27;s sales; June&#x27;s would already have been collected in June). AR at the end of July = $0.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Based on the data, how much will be collected in August?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;60% × $700,000 + 40% × $840,000 = $420,000 + $336,000 = $756,000. Note that the $420,000 is exactly the AR at the end of July.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;True or false: &quot;July sales are $632,800&quot;.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;False: $632,800 is July&#x27;s &lt;em&gt;cash collections&lt;/em&gt;. Sales (accrual-basis revenue) are $700,000.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;produzione&quot; class=&quot;part p-ochre&quot; aria-labelledby=&quot;h-produzione&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;3&lt;/span&gt;Question 4&lt;/div&gt;
  &lt;h2 id=&quot;h-produzione&quot;&gt;The &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Production budget&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; states how many units must be produced in each period to meet budgeted sales &lt;b&gt;and&lt;/b&gt; leave the desired inventory of &lt;i lang=&quot;en&quot;&gt;finished goods&lt;/i&gt; in stock. It is expressed in physical units, not in dollars.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;Production = Unit sales + Desired ending inventory − Beginning inventory&lt;small&gt;Derived from the inventory equation: beginning inventory + production = sales + ending inventory&lt;/small&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 275&quot; role=&quot;img&quot; aria-labelledby=&quot;eq-t&quot;&gt;
      &lt;title id=&quot;eq-t&quot;&gt;Finished goods inventory equation for July&lt;/title&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;215&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot;&gt;Available&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;425&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot;&gt;Used&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;167.7&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect x=&quot;150&quot; y=&quot;207.7&quot; width=&quot;130&quot; height=&quot;32.3&quot; class=&quot;f-ochrebg s-ochre&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;360&quot; y=&quot;78.7&quot; width=&quot;130&quot; height=&quot;161.3&quot; class=&quot;f-ochre&quot; opacity=&quot;.75&quot;/&gt;
      &lt;rect x=&quot;360&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;38.7&quot; class=&quot;f-ochrebg s-ochre dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;120&quot; text-anchor=&quot;end&quot; font-weight=&quot;600&quot;&gt;Production&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;137&quot; text-anchor=&quot;end&quot;&gt;? = 10,400&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;140&quot; y=&quot;222&quot; text-anchor=&quot;end&quot;&gt;Beginning inventory&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;140&quot; y=&quot;236&quot; text-anchor=&quot;end&quot;&gt;20% × 10,000 = 2,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;500&quot; y=&quot;56&quot; font-weight=&quot;600&quot;&gt;Ending inventory&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;500&quot; y=&quot;71&quot;&gt;20% × 12,000 = 2,400&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;500&quot; y=&quot;160&quot;&gt;July sales&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;500&quot; y=&quot;175&quot;&gt;10,000&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ochre);font:600 34px var(--serif)&quot;&gt;=&lt;/text&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;130&quot; y1=&quot;240&quot; x2=&quot;510&quot; y2=&quot;240&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;215&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot;&gt;12,400 units&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;425&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot;&gt;12,400 units&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The two columns must balance: what is available (beginning inventory + production) is either sold or left in stock. Production is the only unknown.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 1 · Desired ending inventory for July&lt;/h4&gt;&lt;p&gt;The policy (item c) ties ending inventory to the &lt;em&gt;following&lt;/em&gt; month&#x27;s sales: 20% × 12,000 (August) = &lt;b&gt;2,400 units&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Step 2 · Total needs&lt;/h4&gt;&lt;p&gt;July sales + ending inventory = 10,000 + 2,400 = &lt;b&gt;12,400 units&lt;/b&gt; that must be available in July.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Step 3 · Beginning inventory&lt;/h4&gt;&lt;p&gt;This is June&#x27;s ending inventory, calculated with the same policy on July&#x27;s sales: 20% × 10,000 = &lt;b&gt;2,000 units&lt;/b&gt;. These units already exist and do not need to be produced.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Question 4 · Units to be produced in July&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;10,000 + 2,400 − 2,000 = &lt;b&gt;10,400 units&lt;/b&gt;&lt;/div&gt;&lt;p&gt;More is produced than sold because sales are growing and inventory must grow with them (+400 units).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn ghost prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;The same schedule over three months (June and August will be needed for raw materials):&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Production budget (units)&lt;/th&gt;&lt;th&gt;June&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;July&lt;/th&gt;&lt;th&gt;August&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Unit sales&lt;/td&gt;&lt;td&gt;8,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Desired ending inventory (20% of next month)&lt;/td&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2,400&lt;/td&gt;&lt;td&gt;2,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Total needs&lt;/td&gt;&lt;td&gt;10,400&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;12,400&lt;/td&gt;&lt;td&gt;14,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Beginning inventory&lt;/td&gt;&lt;td&gt;1,680&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2,000&lt;/td&gt;&lt;td&gt;2,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Units to be produced&lt;/td&gt;&lt;td&gt;8,720&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;td&gt;12,200&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;For June, the policy is assumed to have already applied at the end of May (beginning inventory = 20% × 8,400). September cannot be calculated: October&#x27;s sales would be needed.&lt;/p&gt;

  &lt;h3&gt;How much does the inventory policy matter?&lt;/h3&gt;
  &lt;figure&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fgp&quot;&gt;Ending inventory (% of next month&#x27;s sales)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fgp&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;fgp-o&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Sales and production for June, July, August&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;8&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;text class=&quot;svgs&quot; x=&quot;40&quot; y=&quot;19&quot;&gt;sales (units)&lt;/text&gt;
      &lt;rect x=&quot;140&quot; y=&quot;8&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;f-ochre&quot;/&gt;&lt;text class=&quot;svgs&quot; x=&quot;160&quot; y=&quot;19&quot;&gt;production (units)&lt;/text&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;40&quot; y1=&quot;225&quot; x2=&quot;610&quot; y2=&quot;225&quot;/&gt;
      &lt;rect id=&quot;ps0&quot; x=&quot;88&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp0&quot; x=&quot;134&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect id=&quot;ps1&quot; x=&quot;278&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp1&quot; x=&quot;324&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect id=&quot;ps2&quot; x=&quot;468&quot; width=&quot;40&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;rect id=&quot;pp2&quot; x=&quot;514&quot; width=&quot;40&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;text id=&quot;psl0&quot; class=&quot;svgs&quot; x=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl0&quot; class=&quot;svgs&quot; x=&quot;154&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text id=&quot;psl1&quot; class=&quot;svgs&quot; x=&quot;298&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl1&quot; class=&quot;svgs&quot; x=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text id=&quot;psl2&quot; class=&quot;svgs&quot; x=&quot;488&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;ppl2&quot; class=&quot;svgs&quot; x=&quot;534&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;131&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;June&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;321&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;July&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;511&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;August&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;July ending inventory&lt;b id=&quot;fgp-end&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;July beginning inventory&lt;b id=&quot;fgp-beg&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;July production&lt;b id=&quot;fgp-jul&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;With growing sales, the higher the inventory percentage, the more production exceeds sales: each month a larger warehouse has to be &quot;refilled&quot;. At 0%, exactly as much is produced as is sold (&lt;i lang=&quot;en&quot;&gt;just-in-time&lt;/i&gt; production).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why are 10,400 units produced in July rather than 10,000?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Because the desired ending inventory (2,400) exceeds the beginning inventory (2,000) by 400 units: in addition to sales, the increase in inventory must be produced.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If August sales were 9,000 instead of 12,000, how much would be produced in July?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Ending inventory = 20% × 9,000 = 1,800. Production = 10,000 + 1,800 − 2,000 = 9,800 units: with falling sales, less is produced than is sold.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Is the &lt;i lang=&quot;en&quot;&gt;production budget&lt;/i&gt; expressed in dollars?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No, in physical units. Dollars come later, when units are multiplied by input quantities and input prices in the materials, labor and overhead budgets.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;materiali&quot; class=&quot;part p-slate&quot; aria-labelledby=&quot;h-materiali&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;4&lt;/span&gt;Questions 5–9&lt;/div&gt;
  &lt;h2 id=&quot;h-materiali&quot;&gt;Raw materials: purchases, payments, &lt;i lang=&quot;en&quot;&gt;accounts payable&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Direct materials budget&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;direct materials budget&lt;/i&gt; calculates how much raw material must be purchased to support production and maintain the desired inventory of &lt;i lang=&quot;en&quot;&gt;raw materials&lt;/i&gt;. It follows the same logic as the production budget, applied to a different inventory and in a different unit of measure (pounds instead of units).&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Purchases (lb) = Production needs + Desired ending inventory − Beginning inventory&lt;small&gt;Production needs = units to be produced × 5 lb · Cost of purchases = lb purchased × $2.00&lt;/small&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-labelledby=&quot;ch-t&quot;&gt;
      &lt;title id=&quot;ch-t&quot;&gt;Chain: sales, production, material needs, purchases&lt;/title&gt;
      &lt;rect x=&quot;5&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-sagebg s-sage&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;72&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Sales&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;72&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;10,000 units&lt;/text&gt;
      &lt;rect x=&quot;170&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-ochrebg s-ochre&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;237&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Production&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;237&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;10,400 units&lt;/text&gt;
      &lt;rect x=&quot;335&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-slatebg s-slate&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;402&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Needs&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;402&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot;&gt;52,000 lb&lt;/text&gt;
      &lt;rect x=&quot;500&quot; y=&quot;30&quot; width=&quot;135&quot; height=&quot;58&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text class=&quot;svgt&quot; x=&quot;567&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;Purchases&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;567&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;52,900 lb&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;155&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot;&gt;± FG inventory&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot;&gt;× 5 lb&lt;/text&gt;&lt;text class=&quot;svgs&quot; x=&quot;485&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot;&gt;± RM inventory&lt;/text&gt;
      &lt;path class=&quot;ln&quot; d=&quot;M140 59 L168 59&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M305 59 L333 59&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M470 59 L498 59&quot;/&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;July: each step adjusts for the inventory of the corresponding stock&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Direct materials budget&lt;/th&gt;&lt;th&gt;June&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Units to be produced&lt;/td&gt;&lt;td&gt;8,720&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× lb per unit&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Production needs (lb)&lt;/td&gt;&lt;td&gt;43,600&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;52,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Desired ending inventory (10% of next month)&lt;/td&gt;&lt;td&gt;5,200&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;6,100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Beginning inventory&lt;/td&gt;&lt;td&gt;4,360&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;5,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Pounds to be purchased&lt;/td&gt;&lt;td&gt;44,440&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;52,900&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Cost of purchases (× $2.00)&lt;/td&gt;&lt;td&gt;$88,880&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$105,800&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;The June column is a check: redoing the calculation with the same policies yields exactly the June purchase cost ($88,880) that question 7 provides as a given. The 61,000 lb for August in question 5 also reconcile: 12,200 units × 5 lb.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Q5 · lb&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q6 · cost&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q7 · payments&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q8 · AP&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q9 · inventory&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;How many pounds should be purchased in July, if 61,000 lb are needed in August?&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;52,000 + 10% × 61,000 − 10% × 52,000&lt;br&gt;= 52,000 + 6,100 − 5,200 = &lt;b&gt;52,900 lb&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;July&#x27;s needs come from the production budget (10,400 × 5); ending inventory from August&#x27;s needs, beginning inventory from July&#x27;s needs.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Estimated cost of July purchases&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;52,900 lb × $2.00 = &lt;b&gt;$105,800&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;This is the value of purchases, not what is paid in July: payment follows the terms in item e.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Total payments for raw materials in July&lt;/b&gt; (&lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt;)&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;70% × $88,880 (June) + 30% × $105,800 (July)&lt;br&gt;= $62,216 + $31,740 = &lt;b&gt;$93,956&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Accounts payable at the end of July&lt;/b&gt;: &lt;i lang=&quot;en&quot;&gt;accounts payable&lt;/i&gt; (AP) are purchases already received but not yet paid for, a balance-sheet liability.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;70% × $105,800 = &lt;b&gt;$74,060&lt;/b&gt;&lt;small&gt;Check: AP at beginning of July $62,216 + purchases $105,800 − payments $93,956 = $74,060&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Value of raw materials inventory at the end of July&lt;/b&gt;&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;6,100 lb × $2.00 = &lt;b&gt;$12,200&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Inventory is valued at purchase cost. It goes into the budgeted balance sheet under inventories, separately from finished goods inventory (question 12).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 215&quot; role=&quot;img&quot; aria-labelledby=&quot;tl2-t&quot;&gt;
      &lt;title id=&quot;tl2-t&quot;&gt;Payment schedule: 30% in the month of purchase, 70% in the following month&lt;/title&gt;
      &lt;rect class=&quot;f-slatebg&quot; x=&quot;225&quot; y=&quot;28&quot; width=&quot;190&quot; height=&quot;150&quot; rx=&quot;8&quot;/&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;120&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;June&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;320&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;July&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;520&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;August&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;30&quot; y=&quot;46&quot;&gt;June purchases · $88,880&lt;/text&gt;
      &lt;rect x=&quot;30&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-slate&quot; opacity=&quot;.45&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;120&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;30% · $26,664&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;52&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-slate&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;70% · $62,216&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;230&quot; y=&quot;112&quot;&gt;July purchases · $105,800&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-slate&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;30% · $31,740&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;118&quot; width=&quot;180&quot; height=&quot;36&quot; rx=&quot;5&quot; class=&quot;f-card s-slate dash&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;520&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;70% · $74,060&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;520&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;= AP at end of July&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;July payments = $62,216 + $31,740 = $93,956&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Same structure as collections, but on the supplier side: AP is to purchases what AR is to sales.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;AR and AP compared&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Accounts receivable&lt;/th&gt;&lt;th&gt;Accounts payable&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Arises from&lt;/td&gt;&lt;td&gt;credit sales&lt;/td&gt;&lt;td&gt;credit purchases&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Nature&lt;/td&gt;&lt;td&gt;asset (receivable)&lt;/td&gt;&lt;td&gt;liability (payable)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Settled by&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;cash collections&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;cash disbursements&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;End of July, Morganton&lt;/td&gt;&lt;td&gt;$420,000&lt;/td&gt;&lt;td&gt;$74,060&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why are the pounds purchased (52,900) greater than July&#x27;s needs (52,000)?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Because raw materials inventory must rise from 5,200 to 6,100 lb (+900) to keep pace with August&#x27;s higher production.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If everything were paid in the month of purchase, what would July&#x27;s payments and AP be?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Payments = $105,800 (July&#x27;s purchases only; June&#x27;s would already be settled). AP at the end of July = $0.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Is the raw materials inventory at the end of July ($12,200) a July expense in the income statement?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No: it is an asset (inventory) on the balance sheet. It becomes an expense only once it is used in production and the product is sold.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;lavoro&quot; class=&quot;part p-brick&quot; aria-labelledby=&quot;h-lavoro&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;5&lt;/span&gt;Questions 10–11&lt;/div&gt;
  &lt;h2 id=&quot;h-lavoro&quot;&gt;&lt;i lang=&quot;en&quot;&gt;Direct labor&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;overhead&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt;&lt;/h2&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Direct labor budget&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;direct labor budget&lt;/i&gt; estimates the labor hours worked directly on the product and their cost: &lt;b&gt;hours = units to be produced × hours per unit&lt;/b&gt; (&lt;i lang=&quot;en&quot;&gt;direct labor-hours&lt;/i&gt;, DLH), &lt;b&gt;cost = hours × hourly rate&lt;/b&gt;. The starting point is units &lt;em&gt;produced&lt;/em&gt;, not units sold.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Direct labor budget&lt;/th&gt;&lt;th class=&quot;hl&quot;&gt;July&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Units to be produced&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;10,400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× direct labor-hours per unit&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;2&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;= Direct labor-hours&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;20,800 DLH&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;× hourly rate&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$15&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Question 10 · Direct labor cost&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;$312,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Manufacturing overhead&lt;/span&gt;
    &lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Manufacturing overhead&lt;/i&gt; (MOH) includes all factory costs other than direct materials and direct labor: utilities, maintenance, supervision, depreciation of plant and equipment. Part of it is variable (it rises with activity), part is fixed. Question 11 simplifies matters: &lt;b&gt;no fixed overhead&lt;/b&gt;, variable overhead of &lt;b&gt;$10 per direct labor-hour&lt;/b&gt;. The direct labor-hour is therefore the &lt;i lang=&quot;en&quot;&gt;allocation base&lt;/i&gt; used to assign overhead to the product.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Unit product cost&lt;/span&gt;
    &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt; is the sum of the manufacturing costs of one unit: direct materials + direct labor + overhead. It excludes selling and administrative costs.&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-labelledby=&quot;uc-t&quot;&gt;
      &lt;title id=&quot;uc-t&quot;&gt;Breakdown of unit cost: 10 materials, 30 labor, 20 overhead&lt;/title&gt;
      &lt;rect x=&quot;40&quot; y=&quot;40&quot; width=&quot;93.3&quot; height=&quot;50&quot; class=&quot;f-slate&quot;/&gt;
      &lt;rect x=&quot;133.3&quot; y=&quot;40&quot; width=&quot;280&quot; height=&quot;50&quot; class=&quot;f-brick&quot;/&gt;
      &lt;rect x=&quot;413.3&quot; y=&quot;40&quot; width=&quot;186.7&quot; height=&quot;50&quot; class=&quot;f-brickbg s-brick&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;86.7&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;$10&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;273.3&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;$30&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;506.7&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$20&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;86.7&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Direct materials&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;273.3&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Direct labor&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;506.7&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Variable MOH&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;86.7&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;5 lb × $2&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;273.3&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;2 h × $15&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;506.7&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;2 h × $10&lt;/text&gt;
      &lt;text class=&quot;svgh&quot; x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;Unit product cost = $60&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Direct labor accounts for half of the unit cost; overhead is applied using the same 2 hours per unit.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;formula&quot;&gt;Question 11: $10 + $30 + $20 = &lt;b&gt;$60 per unit&lt;/b&gt;&lt;/div&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;What if there were fixed overhead?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;Under &lt;i lang=&quot;en&quot;&gt;absorption costing&lt;/i&gt;, used to value inventories and cost of goods sold, fixed overhead also enters the unit cost. A &lt;i lang=&quot;en&quot;&gt;predetermined overhead rate&lt;/i&gt; is calculated:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;Rate = Estimated total overhead ÷ Estimated direct labor-hours&lt;/div&gt;
    &lt;p&gt;Hypothetical example (not in the slides): with fixed overhead of $41,600 in July and 20,800 hours, the fixed rate would be $2 per hour, i.e. $4 per unit, and the unit cost would rise to $64. The exercise omits this step precisely to keep the unit cost simple and constant.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Is direct labor paid in the same month?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;The exercise gives no payment terms for wages and overhead: budgeting textbooks usually assume they are paid in the month incurred, so the $312,000 would also be a July cash outflow in the &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt;. Here this is only a working assumption; the question asks for the cost.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does July&#x27;s labor cost use 10,400 units rather than 10,000?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Because direct labor is incurred to produce, and 10,400 units are produced in July (question 4). The 10,000 are the units sold.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is July&#x27;s variable overhead budget?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;20,800 hours × $10 = $208,000 (or 10,400 units × $20).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Is the $1.80 variable selling cost included in the &lt;i lang=&quot;en&quot;&gt;unit product cost&lt;/i&gt;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;No. It is a selling cost, not a manufacturing cost: it belongs to period expenses (question 14), not to product cost or inventories.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;conto&quot; class=&quot;part p-accent&quot; aria-labelledby=&quot;h-conto&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;6&lt;/span&gt;Questions 12–14&lt;/div&gt;
  &lt;h2 id=&quot;h-conto&quot;&gt;Inventories, &lt;i lang=&quot;en&quot;&gt;cost of goods sold&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;gross margin&lt;/i&gt; and expenses&lt;/h2&gt;

  &lt;h3&gt;Question 12 · Finished goods inventory at the end of July&lt;/h3&gt;
  &lt;p&gt;The inventory in units is already known from the production budget (2,400); it is valued at the unit product cost:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;2,400 units × $60 = &lt;b&gt;$144,000&lt;/b&gt;&lt;/div&gt;

  &lt;h3&gt;Question 13 · Cost of goods sold and gross margin&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;From the notes on slide 4&lt;/span&gt;
    &lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Cost of goods sold&lt;/i&gt; (COGS) = total product cost of the goods sold, &lt;em&gt;&quot;product cost only, not selling and administrative&quot;&lt;/em&gt;.&lt;br&gt;&lt;i lang=&quot;en&quot;&gt;Gross margin&lt;/i&gt; = sales − cost of goods sold.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;COGS = 10,000 units sold × $60 = &lt;b&gt;$600,000&lt;/b&gt;&lt;br&gt;Gross margin = $700,000 − $600,000 = &lt;b&gt;$100,000&lt;/b&gt;&lt;/div&gt;
  &lt;p&gt;Watch the number of units: COGS uses units &lt;em&gt;sold&lt;/em&gt; (10,000), not units produced (10,400). The 400-unit difference remains in stock as an increase in inventory (from $120,000 to $144,000).&lt;/p&gt;

  &lt;h3&gt;Question 14 · Selling and administrative expenses&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Selling and administrative expense&lt;/span&gt;
    &lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Selling and administrative expenses&lt;/i&gt; (S&amp;amp;A) are &lt;i lang=&quot;en&quot;&gt;period costs&lt;/i&gt;: they are not included in product cost and are charged to the income statement in the month in which they are incurred. They have a variable component, tied to units &lt;em&gt;sold&lt;/em&gt;, and a fixed component.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;10,000 × $1.80 + $60,000 = $18,000 + $60,000 = &lt;b&gt;$78,000&lt;/b&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 290&quot; role=&quot;img&quot; aria-labelledby=&quot;wf-t&quot;&gt;
      &lt;title id=&quot;wf-t&quot;&gt;Waterfall: sales, cost of goods sold, gross margin, S&amp;amp;A expenses, net operating income&lt;/title&gt;
      &lt;line class=&quot;ax&quot; x1=&quot;40&quot; y1=&quot;250&quot; x2=&quot;610&quot; y2=&quot;250&quot;/&gt;
      &lt;rect x=&quot;60&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;200&quot; class=&quot;f-accent&quot;/&gt;
      &lt;rect x=&quot;170&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;171.4&quot; class=&quot;f-brick&quot;/&gt;
      &lt;rect x=&quot;280&quot; y=&quot;221.4&quot; width=&quot;80&quot; height=&quot;28.6&quot; class=&quot;f-sage&quot;/&gt;
      &lt;rect x=&quot;390&quot; y=&quot;221.4&quot; width=&quot;80&quot; height=&quot;22.3&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;rect x=&quot;500&quot; y=&quot;243.7&quot; width=&quot;80&quot; height=&quot;6.3&quot; class=&quot;f-ink&quot;/&gt;
      &lt;path class=&quot;ln dash&quot; d=&quot;M140 50 L170 50 M250 221.4 L280 221.4 M360 221.4 L390 221.4 M470 243.7 L500 243.7&quot;/&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;100&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$700,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;210&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;−$600,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;320&quot; y=&quot;213&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$100,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;430&quot; y=&quot;213&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;−$78,000&lt;/text&gt;
      &lt;text class=&quot;svgt&quot; x=&quot;540&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$22,000&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;100&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;Sales&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;210&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;COGS&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;Gross margin&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;430&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;S&amp;amp;A expense&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;540&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;Net operating income&lt;/text&gt;
      &lt;text class=&quot;svgs&quot; x=&quot;320&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot;&gt;July, in dollars, proportional scale&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Combining questions 1, 13 and 14 yields July&#x27;s &lt;i lang=&quot;en&quot;&gt;budgeted income statement&lt;/i&gt;. The final step, &lt;i lang=&quot;en&quot;&gt;net operating income&lt;/i&gt; ($22,000), is not asked for in the slides but follows directly: the margin is thin, roughly 3% of sales.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Product vs period costs&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Gross vs contribution margin&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;i lang=&quot;en&quot;&gt;Product costs&lt;/i&gt;&lt;/th&gt;&lt;th&gt;&lt;i lang=&quot;en&quot;&gt;Period costs&lt;/i&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;What they are&lt;/td&gt;&lt;td&gt;DM, DL, MOH&lt;/td&gt;&lt;td&gt;S&amp;amp;A (selling and administrative)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;When they are expensed&lt;/td&gt;&lt;td&gt;when the product is sold (COGS)&lt;/td&gt;&lt;td&gt;in the period in which they are incurred&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Can they be held in inventory?&lt;/td&gt;&lt;td&gt;yes, in inventories ($144,000)&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Morganton, July&lt;/td&gt;&lt;td&gt;$60 per unit&lt;/td&gt;&lt;td&gt;$78,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;gross margin&lt;/i&gt; (traditional format) deducts product costs from sales. The &lt;i lang=&quot;en&quot;&gt;contribution margin&lt;/i&gt; (contribution format, by cost behaviour) instead deducts all variable costs, both manufacturing and selling.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;July&lt;/th&gt;&lt;th&gt;Traditional&lt;/th&gt;&lt;th&gt;Contribution&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;− COGS / variable costs ($600,000 + $18,000)&lt;/td&gt;&lt;td&gt;$600,000&lt;/td&gt;&lt;td&gt;$618,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;= Margin&lt;/td&gt;&lt;td&gt;$100,000&lt;/td&gt;&lt;td&gt;$82,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;− S&amp;amp;A / fixed costs&lt;/td&gt;&lt;td&gt;$78,000&lt;/td&gt;&lt;td&gt;$60,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;$22,000&lt;/td&gt;&lt;td&gt;$22,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The result is the same because there is no fixed overhead: all product cost is variable. With fixed overhead held in inventory, the two formats would report different incomes.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is ending finished goods inventory valued at $144,000 and not 2,400 × $70?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Because inventories are valued at cost ($60), not at selling price ($70). The margin is realised only when the unit is sold.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A classmate calculates COGS as 10,400 × $60 = $624,000. Where is the mistake?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;They use units produced. Cost of goods sold concerns only the 10,000 units sold; the extra 400 increase finished goods inventory.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If July sales rose to 11,000 units (same price), by how much would net operating income increase?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Each additional unit brings $70 − $60 − $1.80 = $8.20 of contribution margin: 1,000 × $8.20 = $8,200 more, giving $30,200. The $60,000 of fixed costs does not change. You can verify this in the simulator below.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;simulatore&quot; class=&quot;part p-ochre&quot; aria-labelledby=&quot;h-sim&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;7&lt;/span&gt;Putting it all together&lt;/div&gt;
  &lt;h2 id=&quot;h-sim&quot;&gt;Simulator: all 14 answers at once&lt;/h2&gt;
  &lt;p&gt;Change the case assumptions and see how they propagate along the &lt;i lang=&quot;en&quot;&gt;master budget&lt;/i&gt; chain. The following remain fixed: June, August and September sales, input quantities (5 lb, 2 hours), rates ($2, $15, $10 of overhead) and S&amp;amp;A expenses ($1.80 and $60,000). For consistency, August&#x27;s 61,000 lb and June&#x27;s purchases ($88,880) are recalculated using the selected policies.&lt;/p&gt;
  &lt;figure class=&quot;wide&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-units&quot;&gt;July sales (units)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-units&quot; min=&quot;8000&quot; max=&quot;14000&quot; step=&quot;100&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;s-units-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-price&quot;&gt;Selling price&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-price&quot; min=&quot;50&quot; max=&quot;90&quot; step=&quot;1&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;s-price-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-fg&quot;&gt;Finished goods inventory&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-fg&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;s-fg-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-rm&quot;&gt;Raw materials inventory&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-rm&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;s-rm-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-coll&quot;&gt;Collected in the month&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-coll&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;s-coll-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;s-pay&quot;&gt;Paid in the month&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-pay&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;s-pay-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;s-reset&quot; type=&quot;button&quot;&gt;Restore the slide data&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;tbl answers&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;Result&lt;/th&gt;&lt;th&gt;How it is calculated&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;1 · July sales&lt;/td&gt;&lt;td id=&quot;r1&quot;&gt;&lt;/td&gt;&lt;td&gt;units × price&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;2 · July collections&lt;/td&gt;&lt;td id=&quot;r2&quot;&gt;&lt;/td&gt;&lt;td&gt;% in month × July + remainder of June&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3 · AR end of July&lt;/td&gt;&lt;td id=&quot;r3&quot;&gt;&lt;/td&gt;&lt;td&gt;uncollected share of July&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;4 · July production&lt;/td&gt;&lt;td id=&quot;r4&quot;&gt;&lt;/td&gt;&lt;td&gt;sales + ending − beginning inventory&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;5 · July purchases (lb)&lt;/td&gt;&lt;td id=&quot;r5&quot;&gt;&lt;/td&gt;&lt;td&gt;needs + ending − beginning inventory &lt;span class=&quot;src&quot; id=&quot;r5n&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;6 · Cost of purchases&lt;/td&gt;&lt;td id=&quot;r6&quot;&gt;&lt;/td&gt;&lt;td&gt;lb × $2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;7 · Raw material payments&lt;/td&gt;&lt;td id=&quot;r7&quot;&gt;&lt;/td&gt;&lt;td&gt;% in month × July + remainder of June &lt;span class=&quot;src&quot; id=&quot;r7n&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8 · AP end of July&lt;/td&gt;&lt;td id=&quot;r8&quot;&gt;&lt;/td&gt;&lt;td&gt;unpaid share of July&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;9 · Raw materials inventory&lt;/td&gt;&lt;td id=&quot;r9&quot;&gt;&lt;/td&gt;&lt;td&gt;% × August needs × $2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;10 · Direct labor&lt;/td&gt;&lt;td id=&quot;r10&quot;&gt;&lt;/td&gt;&lt;td&gt;production × 2 h × $15&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;11 · Unit cost&lt;/td&gt;&lt;td id=&quot;r11&quot;&gt;&lt;/td&gt;&lt;td&gt;$10 + $30 + $20, independent of the policies&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;12 · Finished goods inventory&lt;/td&gt;&lt;td id=&quot;r12&quot;&gt;&lt;/td&gt;&lt;td&gt;% × August sales × unit cost&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;13 · COGS · Gross margin&lt;/td&gt;&lt;td id=&quot;r13&quot;&gt;&lt;/td&gt;&lt;td&gt;units sold × unit cost; sales − COGS&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;14 · S&amp;amp;A expenses&lt;/td&gt;&lt;td id=&quot;r14&quot;&gt;&lt;/td&gt;&lt;td&gt;units sold × $1.80 + $60,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;extra · Net operating income&lt;/td&gt;&lt;td id=&quot;r15&quot;&gt;&lt;/td&gt;&lt;td&gt;gross margin − S&amp;amp;A&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;figcaption&gt;Values with the slide data: 1) $700,000 · 2) $632,800 · 3) $420,000 · 4) 10,400 · 5) 52,900 lb · 6) $105,800 · 7) $93,956 · 8) $74,060 · 9) $12,200 · 10) $312,000 · 11) $60 · 12) $144,000 · 13) $600,000 and $100,000 · 14) $78,000. The solutions are not in the slides: compare them with those discussed in class.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check with the simulator&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Set finished goods inventory to 0%. Which answers change and which do not?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;Production (10,000), purchases, payments, AP, raw materials inventory, direct labor ($300,000) and finished goods inventory ($0) change. Sales, collections, AR, unit cost, COGS, margin and S&amp;amp;A do not: the inventory policy shifts costs between inventory and periods, but with all costs variable it does not affect income.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Lower the price to $61. What happens to net operating income, and why?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;&lt;p&gt;It turns negative: sales $610,000 − COGS $600,000 = margin $10,000, less $78,000 of S&amp;amp;A = −$68,000. The unit contribution margin falls to $61 − $61.80 = −$0.80: every unit sold loses money even before fixed costs.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part p-slate&quot; aria-labelledby=&quot;h-fonti&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span&gt;+&lt;/span&gt;Further reading&lt;/div&gt;
  &lt;h2 id=&quot;h-fonti&quot;&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The slides cite no authors, texts, standards or websites: they contain only the text of the exercise, the University of Bergamo header and the lecturer&#x27;s name. Below you will find the institution cited and two textbooks in which this type of exercise is explained in full. Everything that follows comes from web research and is marked as &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;refs&quot;&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;University of Bergamo · Department of Management&lt;/h4&gt;
      &lt;p&gt;This is the university named on every slide. Its website hosts the course pages with syllabus, recommended exam texts and assessment methods: it is the official reference for finding out which textbook the course follows.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.unibg.it&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Garrison, Noreen, Brewer · &lt;i lang=&quot;en&quot;&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;The most widely used managerial accounting textbook in English. In the 18th edition (2023, ISBN 9781266248610), chapter 8, &lt;i lang=&quot;en&quot;&gt;Master Budgeting&lt;/i&gt;, develops exactly the chain of this exercise: &lt;i lang=&quot;en&quot;&gt;sales budget&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;schedule of expected cash collections&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;production&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;direct materials&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;direct labor&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;manufacturing overhead&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;ending finished goods inventory&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;selling and administrative expense&lt;/i&gt;, &lt;i lang=&quot;en&quot;&gt;cash budget&lt;/i&gt; and budgeted financial statements; chapter 9 moves on to &lt;i lang=&quot;en&quot;&gt;flexible budgets&lt;/i&gt;. It matters because the exercise adopts its terminology and table format: the &quot;Morganton Company&quot; problem circulates online in several versions (one with a $70 price like this one, one with a $65 price) as an exercise from this family of textbooks. The attribution to the book is not confirmed by the slides.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.mheducation.com.sg/managerial-accounting-ise-9781266248610-asia-group&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;McGraw Hill · 18th edition product page and table of contents&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;OpenStax · &lt;i lang=&quot;en&quot;&gt;Principles of Accounting, Volume 2: Managerial Accounting&lt;/i&gt;&lt;/h4&gt;
      &lt;p&gt;A free, open-access university textbook (Rice University). Chapter 7, &lt;i lang=&quot;en&quot;&gt;Budgeting&lt;/i&gt;, covers &lt;i lang=&quot;en&quot;&gt;operating budgets&lt;/i&gt; (sales, production, materials, labor, overhead, S&amp;amp;A) in section 7.2 and &lt;i lang=&quot;en&quot;&gt;financial budgets&lt;/i&gt; (collections, disbursements, cash) in section 7.3. It matters because it is freely available online, with worked examples and a glossary of key terms, useful for reviewing the English terminology.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;openstax.org · table of contents&lt;/a&gt; · &lt;a href=&quot;https://openstax.org/books/principles-managerial-accounting/pages/7-key-terms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;chapter 7 · key terms&lt;/a&gt;&lt;/p&gt;
    &lt;/article&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;For this course, the reference material remains the one indicated by the lecturer: check the official syllabus to see which text is adopted.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
