    &lt;a href=&quot;#report&quot;&gt;&lt;rect x=&quot;270&quot; y=&quot;370&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;392&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Performance report&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;409&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;everything in one table&lt;/text&gt;&lt;/a&gt;

&lt;!-- SECTION 1 --&gt;
&lt;section id=&quot;comportamento&quot; class=&quot;part&quot; data-tone=&quot;sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 1 · fundamentals&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;1&lt;/span&gt;Cost behavior: how costs and revenue respond to volume&lt;/h2&gt;
  &lt;p&gt;The whole exercise rests on a table that the slides take for granted: for each line item, a &lt;b&gt;Fixed Element per Month&lt;/b&gt; and a &lt;b&gt;Variable Element per Customer Served&lt;/b&gt;. Understanding this table means understanding &lt;em class=&quot;t&quot;&gt;cost behavior&lt;/em&gt;, that is, the way a total cost changes when the level of activity changes.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity measure (or cost driver)&lt;/b&gt; — the measure of volume in which the company expresses its output and which &quot;drives&quot; variable costs. Adger is a service company and measures its output in &lt;b&gt;number of customers served&lt;/b&gt;.&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fixed cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Fixed cost&lt;/b&gt;: the total does not change as activity varies (within the &lt;em class=&quot;t&quot;&gt;relevant range&lt;/em&gt;, the range of volumes over which the assumptions hold). Per customer, however, it &lt;i&gt;falls&lt;/i&gt; as the number of customers rises.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Other expenses $36,000/month.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Variable cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Variable cost&lt;/b&gt;: the total rises in proportion to activity; the cost per unit stays constant.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Travel expenses $600 per customer.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mixed cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Mixed cost&lt;/b&gt; (or semivariable cost): has both components, a fixed base plus an amount per unit.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Employee salaries and wages $50,000 + $1,100 per customer.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;Each line item is described by a &lt;b&gt;cost formula&lt;/b&gt;, the same straight line for all of them:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Y = a + b · X&lt;small&gt;Y = total cost · a = fixed component for the month · b = variable cost per unit · X = level of activity (customers)&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;Revenue follows the same logic, with a = 0: &lt;b&gt;Revenue = $5,000 × customers&lt;/b&gt;. Here is the table from the slides expressed as formulas:&lt;/p&gt;

  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Fixed (a)&lt;/th&gt;&lt;th&gt;Variable per customer (b)&lt;/th&gt;&lt;th&gt;Behavior&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;td&gt;5,000·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;$50,000&lt;/td&gt;&lt;td&gt;$1,100&lt;/td&gt;&lt;td&gt;mixed&lt;/td&gt;&lt;td&gt;50,000 + 1,100·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;td&gt;600·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;td&gt;36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;$86,000&lt;/td&gt;&lt;td&gt;$1,700&lt;/td&gt;&lt;td&gt;mixed&lt;/td&gt;&lt;td&gt;86,000 + 1,700·X&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Data: 15.SMA.ex 1_text for students.pdf, initial table.&lt;/p&gt;

  &lt;h3&gt;Try it yourself: change the number of customers&lt;/h3&gt;
  &lt;p&gt;The chart plots Adger&#x27;s formulas. The vertical dashed lines mark the 30 customers in the planning budget and the 35 actually served in May.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;qSlider&quot;&gt;Customers served (X)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qSlider&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;qOut&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;cvp&quot; viewBox=&quot;0 0 640 360&quot; role=&quot;img&quot; aria-label=&quot;Chart of Adger&#x27;s revenue, fixed costs and total costs as a function of customers served&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Terracotta line: Revenue · slate line: Total expenses · sage area: fixed component ($86,000). The point where revenue and costs intersect is the break-even point &lt;span class=&quot;beyond&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;readout&quot; id=&quot;cvpRead&quot;&gt;&lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Why does the fixed cost &lt;i&gt;per customer&lt;/i&gt; change while the total does not?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The $86,000 of fixed costs is spread over more or fewer customers: at 30 customers it is $2,867 per customer, at 35 it is $2,457. The total, however, remains $86,000. This is why budgets always work with &lt;b&gt;fixed totals&lt;/b&gt; and &lt;b&gt;variable amounts per unit&lt;/b&gt;: a fixed cost &quot;per customer&quot; is never multiplied by a new volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Adger&#x27;s break-even point &lt;span class=&quot;beyond&quot;&gt;beyond the slides&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Each customer brings $5,000 of revenue and $1,700 of variable costs: the unit &lt;em class=&quot;t&quot;&gt;contribution margin&lt;/em&gt; is $3,300. Covering the $86,000 of fixed costs requires 86,000 / 3,300 ≈ &lt;b&gt;26.1 customers&lt;/b&gt;. Above that threshold, net operating income is positive. The exercise does not ask for this, but it helps to see that the same cost formula serves both CVP analysis and the flexible budget.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Relevant range: the limit of the formulas&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The formulas only hold for &quot;normal&quot; volumes. If Adger served 80 customers, it would probably need to hire staff or rent space: the &quot;fixed&quot; costs would rise in steps. The flexible budget assumes that actual volume stays within the relevant range.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What would travel expenses be if Adger served 0 customers in May?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$0: they are purely variable (600 · 0).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are other expenses at 40 customers?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$36,000: they are fixed and stay the same throughout the relevant range.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Write the cost formula for salaries and compute it for 32 customers.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Y = 50,000 + 1,100·X → 50,000 + 35,200 = &lt;b&gt;$85,200&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why are salaries a mixed cost rather than a fixed cost?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because on top of the $50,000 fixed base (salaries of permanent staff) there is a portion that rises by $1,100 for each additional customer (hours, overtime, project-based contractors).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SECTION 2 --&gt;
&lt;section id=&quot;budget&quot; class=&quot;part&quot; data-tone=&quot;ochre&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 2 · the three &quot;statements&quot;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;2&lt;/span&gt;Planning budget, flexible budget, actual results&lt;/h2&gt;
  &lt;p&gt;The core of the exercise: Adger had planned to serve &lt;b&gt;30 customers&lt;/b&gt; a month, but in May it served &lt;b&gt;35&lt;/b&gt;. When volume differs, comparing the original budget directly with actual results says nothing useful about how costs and prices were managed. Three columns are needed.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning budget&lt;/b&gt; (also called &lt;i&gt;static budget&lt;/i&gt;) — the budget prepared &lt;b&gt;before&lt;/b&gt; the period for a single planned level of activity (here 30 customers). It is not modified afterwards.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt; — an estimate of what revenues and costs &lt;b&gt;should have been&lt;/b&gt; given the &lt;b&gt;actual&lt;/b&gt; level of activity (here 35 customers). It is prepared at the end of the period by applying the same cost formulas to the actual volume.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Actual results&lt;/b&gt; — the amounts actually recorded: revenue $160,000, salaries $88,000, travel $19,000, other $34,500.&lt;/div&gt;

  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 210&quot; role=&quot;img&quot; aria-label=&quot;Timeline: beginning of May, planning budget at 30 customers; during May, 35 customers served; end of May, actual results and flexible budget at 35 customers&quot;&gt;
    &lt;line x1=&quot;40&quot; y1=&quot;70&quot; x2=&quot;690&quot; y2=&quot;70&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
    &lt;circle cx=&quot;90&quot; cy=&quot;70&quot; r=&quot;8&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle cx=&quot;360&quot; cy=&quot;70&quot; r=&quot;8&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;circle cx=&quot;620&quot; cy=&quot;70&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;
    &lt;text x=&quot;90&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Beginning of May&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;During May&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;End of May&lt;/text&gt;
    &lt;rect x=&quot;20&quot; y=&quot;95&quot; width=&quot;150&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;formulas × 30 customers&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;ex ante forecast&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;planned NOI $13,000&lt;/text&gt;
    &lt;rect x=&quot;285&quot; y=&quot;95&quot; width=&quot;150&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;
    &lt;text x=&quot;360&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual activity&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;35 customers served&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;+5 compared with plan&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;95&quot; width=&quot;210&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
    &lt;text x=&quot;595&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual + Flexible budget&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;recorded actuals&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;+ formulas × 35 customers (ex post)&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;comparison at the same volume&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The flexible budget is not a forecast: it is built afterwards, once actual volume is known.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Adger&#x27;s three columns compared&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Adger&#x27;s budgets&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t1&quot; aria-controls=&quot;p1&quot; aria-selected=&quot;true&quot;&gt;Planning (30)&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t2&quot; aria-controls=&quot;p2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Flexible (35)&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t3&quot; aria-controls=&quot;p3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Actual (35)&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t4&quot; aria-controls=&quot;p4&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;The wrong comparison&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p1&quot; aria-labelledby=&quot;t1&quot;&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Calculation (X = 30)&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;5,000 × 30&lt;/td&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;50,000 + 1,100 × 30&lt;/td&gt;&lt;td&gt;$83,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;600 × 30&lt;/td&gt;&lt;td&gt;$18,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$137,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;150,000 − 137,000&lt;/td&gt;&lt;td&gt;$13,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p2&quot; aria-labelledby=&quot;t2&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Calculation (X = 35)&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;5,000 × 35&lt;/td&gt;&lt;td&gt;$175,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;50,000 + 1,100 × 35&lt;/td&gt;&lt;td&gt;$88,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;600 × 35&lt;/td&gt;&lt;td&gt;$21,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$145,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;175,000 − 145,500&lt;/td&gt;&lt;td&gt;$29,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p3&quot; aria-labelledby=&quot;t3&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;given&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;given&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;given&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;given&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$141,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;160,000 − 141,500&lt;/td&gt;&lt;td&gt;$18,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p4&quot; aria-labelledby=&quot;t4&quot; hidden&gt;
    &lt;p&gt;If we compared &lt;b&gt;actual&lt;/b&gt; and &lt;b&gt;planning&lt;/b&gt; directly:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;Naive &quot;variance&quot;&lt;/th&gt;&lt;th&gt;Correct reading (vs flexible)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$10,000 F&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$15,000 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Salaries and wages&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;td&gt;$83,000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$5,000 U&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$500 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;td&gt;$18,000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$1,000 U&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$2,000 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$1,500 F&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$1,500 F&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;The naive comparison says &quot;excellent revenue, costs out of control&quot;. The truth is the opposite: &lt;b&gt;at the same 35 customers&lt;/b&gt;, costs were well managed, whereas revenue per customer was disappointing. The static comparison mixes two different effects, volume and management, and this is precisely why the flexible budget is prepared.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Golden rule.&lt;/strong&gt; In the flexible budget, fixed costs stay &lt;b&gt;the same&lt;/b&gt; as in the planning budget (Other expenses $36,000 in both); only the variable components change, multiplied by the actual volume.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the essential difference between the planning budget and the flexible budget?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The level of activity: the planning budget uses the &lt;i&gt;planned&lt;/i&gt; volume (30), the flexible budget the &lt;i&gt;actual&lt;/i&gt; volume (35). The cost formulas are the same.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Can the flexible budget be prepared at the beginning of the month?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The formulas, yes; the amounts, no: they require the number of customers actually served, which is known only at the end of the period. One can, however, prepare a &quot;multi-column&quot; flexible budget (e.g. 25, 30, 35, 40 customers) so that estimates are ready for various volumes.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is comparing actual (35 customers) with planning (30 customers) misleading?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because variable costs and revenues change with volume: part of the difference is due solely to the 5 additional customers, not to good management or inefficiency. It is like comparing apples with oranges.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SECTION 3 --&gt;
&lt;section id=&quot;scostamenti&quot; class=&quot;part&quot; data-tone=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 3 · variance analysis&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;3&lt;/span&gt;Variances: activity, revenue and spending&lt;/h2&gt;
  &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;variance&lt;/em&gt; is the difference between two columns. By placing the flexible budget &lt;b&gt;in the middle&lt;/b&gt;, the total difference between actual results and the plan splits into two blocks with different causes and different people responsible.&lt;/p&gt;

  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 230&quot; role=&quot;img&quot; aria-label=&quot;Diagram: actual results, revenue and spending variances, flexible budget, activity variances, planning budget&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;actual prices and costs&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;actual activity&lt;/text&gt;
    &lt;rect x=&quot;275&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;360&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;prices and costs per formula&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;actual activity&lt;/text&gt;
    &lt;rect x=&quot;540&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;625&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;prices and costs per formula&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;planned activity&lt;/text&gt;
    &lt;path d=&quot;M95 125 v12 h265 v-12 M227 137 v14&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;path d=&quot;M360 125 v12 h265 v-12 M492 137 v14&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;rect x=&quot;132&quot; y=&quot;153&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;
    &lt;text x=&quot;227&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Revenue &amp;amp; spending var.&lt;/text&gt;&lt;text x=&quot;227&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;only price/efficiency changes&lt;/text&gt;
    &lt;rect x=&quot;397&quot; y=&quot;153&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;
    &lt;text x=&quot;492&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Activity variances&lt;/text&gt;&lt;text x=&quot;492&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;only volume changes&lt;/text&gt;
    &lt;text x=&quot;360&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;total difference actual − planning = sum of the two blocks&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Each pair of adjacent columns differs by a single factor: this is why the variance is &quot;pure&quot;.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Types of variance&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v1&quot; aria-controls=&quot;vp1&quot; aria-selected=&quot;true&quot;&gt;Activity variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v2&quot; aria-controls=&quot;vp2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Revenue variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v3&quot; aria-controls=&quot;vp3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Spending variance&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp1&quot; aria-labelledby=&quot;v1&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity variance = Flexible budget − Planning budget&lt;small&gt;measures only the effect of the difference between actual and planned activity&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;For revenue&lt;/b&gt;: flexible &amp;gt; planning → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt; (more customers = more revenue). &lt;b&gt;For costs&lt;/b&gt;: flexible &amp;gt; planning → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;, because more customers push variable costs up.&lt;/p&gt;
    &lt;p&gt;For a &lt;b&gt;purely fixed&lt;/b&gt; cost the activity variance is always zero (&quot;None&quot;): volume does not affect it.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp2&quot; aria-labelledby=&quot;v2&quot; hidden&gt;
    &lt;div class=&quot;formula&quot;&gt;Revenue variance = Actual revenue − Flexible budget revenue&lt;small&gt;how much more or less was earned than should have been earned at the actual level of activity&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Actual &amp;gt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;; actual &amp;lt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Typical causes: average prices different from standard, discounts, customer mix, unbilled services.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp3&quot; aria-labelledby=&quot;v3&quot; hidden&gt;
    &lt;div class=&quot;formula&quot;&gt;Spending variance = Actual cost − Flexible budget cost&lt;small&gt;how much more or less was spent than should have been spent for the actual level of activity&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Actual &amp;lt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt; (less was spent); actual &amp;gt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Typical causes: different input prices, more or less efficient use of resources, waste or savings.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;How the exercise expects answers.&lt;/strong&gt; The questions always ask for &lt;b&gt;positive&lt;/b&gt; amounts labeled &lt;b&gt;F&lt;/b&gt; (favorable: increases income), &lt;b&gt;U&lt;/b&gt; (unfavorable: decreases income) or &lt;b&gt;None&lt;/b&gt; (zero variance). The sign is expressed by the letter, not by the number.&lt;/div&gt;

  &lt;h3&gt;Practice: F, U or None?&lt;/h3&gt;
  &lt;div class=&quot;fu&quot;&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;F&quot; data-why=&quot;Spending variance: actual &amp;lt; flexible, less was spent than allowed → $2,000 F.&quot;&gt;&lt;span&gt;Travel: actual $19,000, flexible $21,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Revenue variance: less was earned than the flexible budget anticipated → $15,000 U.&quot;&gt;&lt;span&gt;Revenue: actual $160,000, flexible $175,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Activity variance of a cost: more customers → higher cost → $5,500 U (this is not inefficiency!).&quot;&gt;&lt;span&gt;Salaries: flexible $88,500, planning $83,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;F&quot; data-why=&quot;Revenue activity variance: 5 additional customers × $5,000 → $25,000 F.&quot;&gt;&lt;span&gt;Revenue: flexible $175,000, planning $150,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;None&quot; data-why=&quot;Fixed cost: identical in flexible and planning budgets → activity variance $0, None.&quot;&gt;&lt;span&gt;Other expenses: flexible $36,000, planning $36,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Hypothetical case: more was spent than the flexible budget → spending variance $1,000 U.&quot;&gt;&lt;span&gt;Hypothetical: other expenses actual $37,000, flexible $36,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which two columns are compared for the spending variance?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Actual results and flexible budget: same volume (35 customers), so the difference depends only on how much was spent per unit of activity.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is an unfavorable activity variance on a cost a sign of poor management?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. It only says that, having served more customers, it was normal to spend more. Indeed, it is accompanied by a larger favorable activity variance on revenue.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the activity variance for a fixed cost always &quot;None&quot;?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the flexible and planning budgets use the same fixed amount: volume does not enter the formula (b = 0).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How can you check that the variances are consistent?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Revenue &amp;amp; spending variances + activity variances (with their effect on income) must add up to the total difference between actual NOI and planning NOI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SECTION 4 --&gt;
&lt;section id=&quot;adger&quot; class=&quot;part&quot; data-tone=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 4 · the exercise&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;4&lt;/span&gt;Adger Corporation: the 15 questions, step by step&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;The case&lt;/b&gt; (from the slides): Adger Corporation is a service company that measures its output in customers served. It planned for &lt;b&gt;30 customers&lt;/b&gt; a month; in May it served &lt;b&gt;35&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Fixed Element per Month&lt;/th&gt;&lt;th&gt;Variable Element per Customer Served&lt;/th&gt;&lt;th&gt;Actual Total for May&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;$50,000&lt;/td&gt;&lt;td&gt;$1,100&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Table reproduced from 15.SMA.ex 1_text for students.pdf.&lt;/p&gt;
  &lt;p&gt;Try to answer on your own before opening each calculation. The order of the steps follows the questions in the text.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;
      &lt;button&gt;① Flexible budget&lt;br&gt;Q1–5&lt;/button&gt;&lt;button&gt;② Revenue &amp;amp; spending&lt;br&gt;Q6–9&lt;/button&gt;&lt;button&gt;③ Planning budget&lt;br&gt;Q10–13&lt;/button&gt;&lt;button&gt;④ Activity var.&lt;br&gt;Q14–15&lt;/button&gt;&lt;button&gt;⑤ Check&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Step 1 · Flexible budget at 35 customers&lt;/h3&gt;
      &lt;p&gt;Apply each cost formula to the &lt;b&gt;actual&lt;/b&gt; volume, X = 35.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;1&lt;/span&gt;&lt;div&gt;Revenue in the flexible budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$5,000 × 35 = &lt;span class=&quot;res&quot;&gt;$175,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;2&lt;/span&gt;&lt;div&gt;Employee salaries and wages in the flexible budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$50,000 + $1,100 × 35 = 50,000 + 38,500 = &lt;span class=&quot;res&quot;&gt;$88,500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;3&lt;/span&gt;&lt;div&gt;Travel expenses in the flexible budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$600 × 35 = &lt;span class=&quot;res&quot;&gt;$21,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;4&lt;/span&gt;&lt;div&gt;Other expenses in the flexible budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;Fixed cost: &lt;span class=&quot;res&quot;&gt;$36,000&lt;/span&gt; (does not depend on customers)&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;5&lt;/span&gt;&lt;div&gt;Net operating income in the flexible budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;175,000 − (88,500 + 21,000 + 36,000) = 175,000 − 145,500 = &lt;span class=&quot;res&quot;&gt;$29,500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Step 2 · Revenue and spending variances (actual vs flexible)&lt;/h3&gt;
      &lt;p&gt;Compare actual results with the flexible budget: same volume, so only the effect of prices and efficiency remains.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;6&lt;/span&gt;&lt;div&gt;Revenue variance?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;160,000 − 175,000 = −15,000 → earned less than expected → &lt;span class=&quot;res U&quot;&gt;$15,000 U&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;7&lt;/span&gt;&lt;div&gt;Spending variance for employee salaries and wages?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;88,000 − 88,500 = −500 → spent less → &lt;span class=&quot;res F&quot;&gt;$500 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;8&lt;/span&gt;&lt;div&gt;Spending variance for travel expenses?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;19,000 − 21,000 = −2,000 → spent less → &lt;span class=&quot;res F&quot;&gt;$2,000 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;9&lt;/span&gt;&lt;div&gt;Spending variance for other expenses?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;34,500 − 36,000 = −1,500 → spent less → &lt;span class=&quot;res F&quot;&gt;$1,500 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Step 3 · Planning budget at 30 customers&lt;/h3&gt;
      &lt;p&gt;Same formulas, but with the &lt;b&gt;planned&lt;/b&gt; volume, X = 30.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;10&lt;/span&gt;&lt;div&gt;Revenue in the planning budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$5,000 × 30 = &lt;span class=&quot;res&quot;&gt;$150,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;11&lt;/span&gt;&lt;div&gt;Employee salaries and wages in the planning budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$50,000 + $1,100 × 30 = 50,000 + 33,000 = &lt;span class=&quot;res&quot;&gt;$83,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;12&lt;/span&gt;&lt;div&gt;Travel expenses in the planning budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$600 × 30 = &lt;span class=&quot;res&quot;&gt;$18,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;13&lt;/span&gt;&lt;div&gt;Other expenses in the planning budget?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;&lt;span class=&quot;res&quot;&gt;$36,000&lt;/span&gt; (fixed, same as the flexible budget)&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Not required but useful: planning NOI = 150,000 − 137,000 = $13,000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Step 4 · Activity variances (flexible vs planning)&lt;/h3&gt;
      &lt;p&gt;The difference due solely to the 5 additional customers. Shortcut: &lt;b&gt;activity variance = variable component × (35 − 30)&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;14&lt;/span&gt;&lt;div&gt;Revenue activity variance?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;175,000 − 150,000 = 5,000 × 5 = &lt;span class=&quot;res F&quot;&gt;$25,000 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;15&lt;/span&gt;&lt;div&gt;Activity variances for each cost?&lt;details&gt;&lt;summary&gt;Show calculation&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;
        Salaries and wages: 88,500 − 83,000 = 1,100 × 5 = &lt;span class=&quot;res U&quot;&gt;$5,500 U&lt;/span&gt;&lt;br&gt;
        Travel expenses: 21,000 − 18,000 = 600 × 5 = &lt;span class=&quot;res U&quot;&gt;$3,000 U&lt;/span&gt;&lt;br&gt;
        Other expenses: 36,000 − 36,000 = &lt;span class=&quot;res&quot;&gt;$0 None&lt;/span&gt;&lt;br&gt;
        &lt;span class=&quot;src&quot;&gt;Effect on NOI: 25,000 F − 5,500 U − 3,000 U = $16,500 F (= 3,300 contribution margin × 5 customers).&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Step 5 · Consistency check&lt;/h3&gt;
      &lt;p&gt;The variances must &quot;close&quot; the bridge between planning NOI and actual NOI.&lt;/p&gt;
      &lt;div class=&quot;calc&quot;&gt;
        &lt;p&gt;Actual NOI = 160,000 − (88,000 + 19,000 + 34,500) = 160,000 − 141,500 = &lt;b&gt;$18,500&lt;/b&gt;&lt;/p&gt;
        &lt;p&gt;Revenue &amp;amp; spending (effect on NOI) = −15,000 + 500 + 2,000 + 1,500 = &lt;span class=&quot;U&quot;&gt;$11,000 U&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Activity (effect on NOI) = &lt;span class=&quot;F&quot;&gt;$16,500 F&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;13,000 + 16,500 − 11,000 = &lt;b&gt;18,500&lt;/b&gt; ✓ → total variance &lt;span class=&quot;F&quot;&gt;$5,500 F&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Flexible budget results (Q1–5) checked against the McGraw-Hill solution: see &quot;Further reading&quot;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;If Adger had served 28 customers, what would travel expenses be in the flexible budget?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;600 × 28 = $16,800. And the activity variance relative to the planning budget (30) would be 600 × (28 − 30) = $1,200 F.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Actual average revenue per customer in May?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;160,000 / 35 ≈ $4,571, compared with the $5,000 standard: about $429 less per customer, which explains the $15,000 U revenue variance.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Compute the NOI activity variance with a single multiplication.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Contribution margin per customer (5,000 − 1,100 − 600 = 3,300) × 5 customers = $16,500 F.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SECTION 5 --&gt;
&lt;section id=&quot;report&quot; class=&quot;part&quot; data-tone=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 5 · the synthesis&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;5&lt;/span&gt;The five-column performance report&lt;/h2&gt;
  &lt;p&gt;Taken together, the answers to the 15 questions form the &lt;em class=&quot;t&quot;&gt;flexible budget performance report&lt;/em&gt;: a table that sets the three columns side by side, with the variances between them. It is the tool management uses to read the month. &lt;span class=&quot;beyond&quot;&gt;beyond the slides&lt;/span&gt; The slides ask for the individual amounts; the report is the standard way of presenting them.&lt;/p&gt;

  &lt;h3&gt;Lab: change the volumes&lt;/h3&gt;
  &lt;p&gt;With 30 and 35 you see the May report. Move the sliders to see how the columns change: actual results remain those of May, so other volumes are &lt;b&gt;hypothetical cases&lt;/b&gt; for practice.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;pSlider&quot;&gt;Customers in the planning budget&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pSlider&quot; min=&quot;20&quot; max=&quot;45&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;pOut&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;aSlider&quot;&gt;Customers actually served&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;aSlider&quot; min=&quot;20&quot; max=&quot;45&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;aOut&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
  &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;labReset&quot;&gt;Back to May (30 / 35)&lt;/button&gt;&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;labTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;labCheck&quot; class=&quot;calc&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 700 300&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart from planning budget NOI to actual NOI&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Waterfall chart: from planned to actual income. Green = variance that increases income (F), red = variance that decreases it (U), ochre = totals.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In the lab, set planning = actual = 35. What happens to the activity variances?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;They all become zero: the flexible and planning budgets coincide. Only revenue and spending variances remain.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the flexible budget the middle column of the report?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it acts as a bridge: it isolates the effect of prices/efficiency on the left and the effect of volume on the right, so the two are not mixed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SECTION 6 --&gt;
&lt;section id=&quot;interpretare&quot; class=&quot;part&quot; data-tone=&quot;accent&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 6 · reading the numbers&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;6&lt;/span&gt;What Adger&#x27;s variances tell us&lt;/h2&gt;
  &lt;p&gt;At first glance May looks like a good month: NOI of $18,500 against $13,000 planned. The analysis, however, tells a more nuanced story. &lt;span class=&quot;beyond&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Volume saved the month&lt;/h4&gt;&lt;p&gt;The 5 additional customers are worth $16,500 F in income. Without this effect, NOI would have fallen.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The average price is the problem&lt;/h4&gt;&lt;p&gt;Revenue variance $15,000 U: about $4,571 was earned per customer instead of $5,000. Discounts to acquire the new customers? Unbilled services? This needs investigating.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs are under control&lt;/h4&gt;&lt;p&gt;All spending variances are F (total $4,000). Good news, provided it does not conceal cuts that worsen the service.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Common mistakes&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Reading &quot;F&quot; as &quot;good&quot; and &quot;U&quot; as &quot;bad&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;F and U only indicate the effect on income. A favorable travel spending variance might come from skipped customer visits, which in the long run cost more than they save. An unfavorable cost activity variance is to be expected when volume grows.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Computing the flexible budget by &quot;scaling&quot; the planning budget proportionally&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Multiplying everything by 35/30 would be wrong: salaries would become 83,000 × 35/30 = $96,833 instead of $88,500, because the fixed portion would be inflated too. Only the variable component scales.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Using the wrong volume in the wrong column&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Planning → planned volume (30). Flexible → actual volume (35). Actual → recorded data, no formula.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Writing negative amounts&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The text asks for positive amounts with F/U/None: &quot;$500 F&quot;, not &quot;−500&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Who is responsible for what &lt;span class=&quot;beyond&quot;&gt;beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The two families of variances have different owners: the &lt;b&gt;activity variance&lt;/b&gt; depends on how much was sold (sales, market conditions); &lt;b&gt;revenue and spending variances&lt;/b&gt; depend on how prices were set and resources used (those responsible for pricing and for cost centers). Separating them makes it possible to evaluate each manager on what they control.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Limitations of the model.&lt;/strong&gt; A single cost driver (customers served) for all line items; linear costs; validity only within the relevant range. Textbooks extend the flexible budget to multiple cost drivers when costs depend on different activities (see &quot;Further reading&quot;).&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 6&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;NOI rose by $5,500 compared with the plan. Is that enough to say the month was well managed?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: it is the sum of +16,500 from volume and −11,000 from prices/costs, dominated by a revenue-per-customer problem that needs further investigation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why can&#x27;t the flexible budget be obtained by multiplying the planning budget by 35/30?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because fixed costs (and the fixed portion of mixed costs) do not grow with volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- FURTHER READING --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot; data-tone=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap refs&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Resources&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The slides for this exercise &lt;b&gt;do not cite any authors, textbooks, standards or websites&lt;/b&gt;: they contain only the text of the case. The resources below come from a web search to identify the textbook the exercise is taken from and related study material. Everything here is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;I was unable to list the contents of the &lt;i&gt;corso/&lt;/i&gt; folder (I could only read files at known paths): to link this exercise to the theory lectures on budgeting and to the syllabus, check the files near &lt;i&gt;corso/Budgeting/&lt;/i&gt;, in particular any solutions to exercise 15.SMA.&lt;/p&gt;

  &lt;article&gt;
    &lt;h3&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The standard university textbook for managerial accounting. The chapter &lt;b&gt;&quot;Flexible Budgets and Performance Analysis&quot;&lt;/b&gt; explains planning and flexible budgets, activity variances, revenue and spending variances, the performance report and flexible budgets with multiple cost drivers. The chapter number varies by edition (ch. 10 in the 13th edition, ch. 9 in more recent editions and in &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt;). It matters because the Adger exercise, with the same data and questions, appears in the textbook&#x27;s McGraw-Hill material.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of the 13th edition (McGraw-Hill Higher Education)&lt;/a&gt; · &lt;a href=&quot;https://www.mheducation.com/highered/product/9781265616656.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Current edition page (McGraw Hill)&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
  &lt;article&gt;
    &lt;h3&gt;Chapter 9 solutions (McGraw-Hill)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Solutions file published on the textbook&#x27;s McGraw-Hill website, including the Adger case: flexible budget revenue $175,000, salaries and wages $88,500, travel $21,000, other $36,000, NOI $29,500. These amounts match step 1 on this page. Useful for checking your own answers. It is a downloadable .doc file.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/dl/free/0027162757/1029197/SMChap009.doc&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SMChap009.doc — highered.mheducation.com&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
  &lt;article&gt;
    &lt;h3&gt;Practice quiz on flexible budgets (California State University, Sacramento)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; University practice quiz on chapter 9 (flexible budgets), with exercises of the same type: flexible budget, activity and spending variances. Useful for practicing on cases other than Adger.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.csus.edu/indiv/p/pforsichh/documents/ACCY02Chap09FlexBudgetPracticeQuizSTUDENTCOPY.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ACCY02 Chap. 09 Flex Budget Practice Quiz (csus.edu, PDF)&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
&quot;use strict&quot;;
var M={price:5000,sal:{f:50000,v:1100},trav:{f:0,v:600},oth:{f:36000,v:0}};
var ACT={rev:160000,sal:88000,trav:19000,oth:34500};
function fmt(n){n=Math.round(n);return (n&lt;0?&quot;−&quot;:&quot;&quot;)+&quot;$&quot;+Math.abs(n).toLocaleString(&quot;en-US&quot;);}
function budget(q){var b={rev:M.price*q,sal:M.sal.f+M.sal.v*q,trav:M.trav.f+M.trav.v*q,oth:M.oth.f+M.oth.v*q};b.exp=b.sal+b.trav+b.oth;b.noi=b.rev-b.exp;return b;}
function actual(){var a={rev:ACT.rev,sal:ACT.sal,trav:ACT.trav,oth:ACT.oth};a.exp=a.sal+a.trav+a.oth;a.noi=a.rev-a.exp;return a;}
/* variance: for revenue/NOI positive = F; for costs positive = U */
function vr(x,isCost){if(Math.round(x)===0)return{t:&quot;$0&quot;,c:&quot;N&quot;,l:&quot;None&quot;};var fav=isCost?x&lt;0:x&gt;0;return{t:fmt(Math.abs(x))+&quot; &quot;+(fav?&quot;F&quot;:&quot;U&quot;),c:fav?&quot;F&quot;:&quot;U&quot;,l:fav?&quot;F&quot;:&quot;U&quot;};}
var NS=&quot;http://www.w3.org/2000/svg&quot;;
function el(tag,attrs,parent,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}

/* --- cost behavior chart --- */
var cvp=document.getElementById(&quot;cvp&quot;);
if(cvp){
  var X=function(q){return 70+q*10.8;},Y=function(v){return 320-v*285/260000;};
  for(var v=0;v&lt;=250000;v+=50000){el(&quot;line&quot;,{x1:70,x2:610,y1:Y(v),y2:Y(v),stroke:&quot;var(--rule)&quot;},cvp);el(&quot;text&quot;,{x:62,y:Y(v)+4,&quot;text-anchor&quot;:&quot;end&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,v===0?&quot;0&quot;:(v/1000)+&quot;k&quot;);}
  for(var q=0;q&lt;=50;q+=10){el(&quot;text&quot;,{x:X(q),y:338,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,q);}
  el(&quot;text&quot;,{x:340,y:356,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,&quot;customers served&quot;);
  el(&quot;path&quot;,{d:&quot;M&quot;+X(0)+&quot; &quot;+Y(0)+&quot;L&quot;+X(0)+&quot; &quot;+Y(86000)+&quot;L&quot;+X(50)+&quot; &quot;+Y(86000)+&quot;L&quot;+X(50)+&quot; &quot;+Y(0)+&quot;Z&quot;,fill:&quot;var(--sage-bg)&quot;,stroke:&quot;var(--sage)&quot;,&quot;stroke-dasharray&quot;:&quot;4 3&quot;},cvp);
  el(&quot;text&quot;,{x:X(1),y:Y(86000)+16,fill:&quot;var(--sage)&quot;,&quot;font-size&quot;:&quot;12&quot;},cvp,&quot;fixed $86,000&quot;);
  el(&quot;line&quot;,{x1:X(0),y1:Y(86000),x2:X(50),y2:Y(171000),stroke:&quot;var(--slate)&quot;,&quot;stroke-width&quot;:2.5},cvp);
  el(&quot;line&quot;,{x1:X(0),y1:Y(0),x2:X(50),y2:Y(250000),stroke:&quot;var(--accent)&quot;,&quot;stroke-width&quot;:2.5},cvp);
  el(&quot;text&quot;,{x:X(50)-4,y:Y(250000)-8,&quot;text-anchor&quot;:&quot;end&quot;,fill:&quot;var(--accent)&quot;,&quot;font-size&quot;:&quot;12&quot;,&quot;font-weight&quot;:&quot;600&quot;},cvp,&quot;Revenue&quot;);
  el(&quot;text&quot;,{x:X(50)-4,y:Y(171000)+18,&quot;text-anchor&quot;:&quot;end&quot;,fill:&quot;var(--slate)&quot;,&quot;font-size&quot;:&quot;12&quot;,&quot;font-weight&quot;:&quot;600&quot;},cvp,&quot;Total expenses&quot;);
  [30,35].forEach(function(q){el(&quot;line&quot;,{x1:X(q),x2:X(q),y1:Y(0),y2:Y(255000),stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;2 4&quot;},cvp);el(&quot;text&quot;,{x:X(q),y:24,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,q===30?&quot;planning 30&quot;:&quot;actual 35&quot;);});
  var be=86000/3300;el(&quot;circle&quot;,{cx:X(be),cy:Y(5000*be),r:4,fill:&quot;var(--paper)&quot;,stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.5},cvp);
  el(&quot;text&quot;,{x:X(be)+8,y:Y(5000*be)+18,&quot;class&quot;:&quot;lbl&quot;},cvp,&quot;break-even ≈ 26.1&quot;);
  var mk=el(&quot;line&quot;,{y1:Y(0),y2:Y(260000),stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.2},cvp);
  var d1=el(&quot;circle&quot;,{r:5,fill:&quot;var(--accent)&quot;},cvp),d2=el(&quot;circle&quot;,{r:5,fill:&quot;var(--slate)&quot;},cvp);
  var qs=document.getElementById(&quot;qSlider&quot;),qo=document.getElementById(&quot;qOut&quot;),rd=document.getElementById(&quot;cvpRead&quot;);
  var upd=function(){var q=+qs.value,b=budget(q);qo.textContent=q;mk.setAttribute(&quot;x1&quot;,X(q));mk.setAttribute(&quot;x2&quot;,X(q));
    d1.setAttribute(&quot;cx&quot;,X(q));d1.setAttribute(&quot;cy&quot;,Y(b.rev));d2.setAttribute(&quot;cx&quot;,X(q));d2.setAttribute(&quot;cy&quot;,Y(b.exp));
    rd.innerHTML=&quot;&lt;div&gt;Revenue&lt;b&gt;&quot;+fmt(b.rev)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Salaries &amp;amp; wages&lt;b&gt;&quot;+fmt(b.sal)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Travel&lt;b&gt;&quot;+fmt(b.trav)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Other&lt;b&gt;&quot;+fmt(b.oth)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Net operating income&lt;b&gt;&quot;+fmt(b.noi)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Fixed cost per customer&lt;b&gt;&quot;+(q?fmt(86000/q):&quot;—&quot;)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;;};
  qs.addEventListener(&quot;input&quot;,upd);upd();
}

/* --- tabs --- */
document.querySelectorAll(&quot;[role=tablist]&quot;).forEach(function(tl){
  var tabs=tl.querySelectorAll(&quot;[role=tab]&quot;);
  tabs.forEach(function(t,i){t.addEventListener(&quot;click&quot;,function(){sel(i);});
    t.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;ArrowRight&quot;){sel((i+1)%tabs.length);tabs[(i+1)%tabs.length].focus();}if(e.key===&quot;ArrowLeft&quot;){var j=(i-1+tabs.length)%tabs.length;sel(j);tabs[j].focus();}});});
  function sel(i){tabs.forEach(function(t,j){t.setAttribute(&quot;aria-selected&quot;,i===j);t.tabIndex=i===j?0:-1;document.getElementById(t.getAttribute(&quot;aria-controls&quot;)).hidden=i!==j;});}
});

/* --- F/U classifier --- */
document.querySelectorAll(&quot;.fu .item&quot;).forEach(function(it){
  var ans=it.getAttribute(&quot;data-a&quot;),fb=it.querySelector(&quot;.fb&quot;);
  it.querySelectorAll(&quot;button&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){
    it.querySelectorAll(&quot;button&quot;).forEach(function(x){x.classList.remove(&quot;on&quot;);});b.classList.add(&quot;on&quot;);
    var ok=b.textContent.trim()===ans;fb.innerHTML=(ok?&quot;&lt;span class=&#x27;F&#x27;&gt;Correct.&lt;/span&gt; &quot;:&quot;&lt;span class=&#x27;U&#x27;&gt;Not quite.&lt;/span&gt; &quot;)+it.getAttribute(&quot;data-why&quot;);});});
});

/* --- steps --- */
document.querySelectorAll(&quot;.stepper&quot;).forEach(function(sp){
  var steps=sp.querySelectorAll(&quot;.step&quot;),bar=sp.querySelectorAll(&quot;.stepbar button&quot;),prev=sp.querySelector(&quot;.prev&quot;),next=sp.querySelector(&quot;.next&quot;),cur=0;
  function go(i){cur=i;steps.forEach(function(s,j){s.hidden=j!==i;});bar.forEach(function(b,j){if(j===i)b.setAttribute(&quot;aria-current&quot;,&quot;step&quot;);else b.removeAttribute(&quot;aria-current&quot;);});prev.disabled=i===0;next.disabled=i===steps.length-1;}
  bar.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){go(i);});});
  prev.addEventListener(&quot;click&quot;,function(){if(cur&gt;0)go(cur-1);});
  next.addEventListener(&quot;click&quot;,function(){if(cur&lt;steps.length-1)go(cur+1);});
  go(0);
});

/* --- performance report lab --- */
var lab=document.getElementById(&quot;labTable&quot;);
if(lab){
  var ps=document.getElementById(&quot;pSlider&quot;),as=document.getElementById(&quot;aSlider&quot;),po=document.getElementById(&quot;pOut&quot;),ao=document.getElementById(&quot;aOut&quot;),wf=document.getElementById(&quot;wf&quot;);
  var rows=[[&quot;Revenue&quot;,&quot;rev&quot;,false],[&quot;Employee salaries and wages&quot;,&quot;sal&quot;,true],[&quot;Travel expenses&quot;,&quot;trav&quot;,true],[&quot;Other expenses&quot;,&quot;oth&quot;,true],[&quot;Total expense&quot;,&quot;exp&quot;,true],[&quot;Net operating income&quot;,&quot;noi&quot;,false]];
  var draw=function(){
    var p=+ps.value,aq=+as.value;po.textContent=p;ao.textContent=aq;
    var A=actual(),F=budget(aq),P=budget(p);
    var h=&quot;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;Actual results&lt;br&gt;(&quot;+aq+&quot; customers)&lt;/th&gt;&lt;th&gt;Revenue &amp;amp; spending&lt;br&gt;variances&lt;/th&gt;&lt;th class=&#x27;hl&#x27;&gt;Flexible budget&lt;br&gt;(&quot;+aq+&quot; customers)&lt;/th&gt;&lt;th&gt;Activity&lt;br&gt;variances&lt;/th&gt;&lt;th&gt;Planning budget&lt;br&gt;(&quot;+p+&quot; customers)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&quot;;
    rows.forEach(function(r){var k=r[1],c=r[2],v1=vr(A[k]-F[k],c),v2=vr(F[k]-P[k],c);
      h+=&quot;&lt;tr&quot;+(k===&quot;noi&quot;||k===&quot;exp&quot;?&quot; class=&#x27;tot&#x27;&quot;:&quot;&quot;)+&quot;&gt;&lt;td&gt;&quot;+r[0]+&quot;&lt;/td&gt;&lt;td&gt;&quot;+fmt(A[k])+&quot;&lt;/td&gt;&lt;td class=&#x27;&quot;+v1.c+&quot;&#x27;&gt;&quot;+v1.t+&quot;&lt;/td&gt;&lt;td class=&#x27;hl&#x27;&gt;&quot;+fmt(F[k])+&quot;&lt;/td&gt;&lt;td class=&#x27;&quot;+v2.c+&quot;&#x27;&gt;&quot;+v2.t+&quot;&lt;/td&gt;&lt;td&gt;&quot;+fmt(P[k])+&quot;&lt;/td&gt;&lt;/tr&gt;&quot;;});
    lab.innerHTML=h+&quot;&lt;/tbody&gt;&quot;;
    /* waterfall */
    while(wf.firstChild)wf.removeChild(wf.firstChild);
    var st=[[&quot;Planning NOI&quot;,P.noi,&quot;tot&quot;],[&quot;Activity var.&quot;,F.noi-P.noi],[&quot;Revenue var.&quot;,A.rev-F.rev],[&quot;Salaries spend.&quot;,F.sal-A.sal],[&quot;Travel spend.&quot;,F.trav-A.trav],[&quot;Other spend.&quot;,F.oth-A.oth],[&quot;Actual NOI&quot;,A.noi,&quot;tot&quot;]];
    var run=0,bars=[],lo=0,hi=0;
    st.forEach(function(s){var y0,y1;if(s[2]){y0=0;y1=s[1];run=s[1];}else{y0=run;y1=run+s[1];run=y1;}bars.push([s[0],y0,y1,s[1],s[2]]);lo=Math.min(lo,y0,y1);hi=Math.max(hi,y0,y1);});
    var span=(hi-lo)||1,top=30,bot=250,Yw=function(v){return bot-(v-lo)*(bot-top)/span;},w=70,gap=24;
    el(&quot;line&quot;,{x1:20,x2:690,y1:Yw(0),y2:Yw(0),stroke:&quot;var(--ink2)&quot;},wf);
    bars.forEach(function(b,i){var x=30+i*(w+gap),ya=Yw(Math.max(b[1],b[2])),yb=Yw(Math.min(b[1],b[2])),col=b[4]?&quot;var(--ochre)&quot;:(b[3]&gt;=0?&quot;var(--good)&quot;:&quot;var(--bad)&quot;);
      el(&quot;rect&quot;,{x:x,y:ya,width:w,height:Math.max(1.5,yb-ya),fill:col,rx:2,opacity:b[4]?1:.85},wf);
      el(&quot;text&quot;,{x:x+w/2,y:ya-6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:&quot;11&quot;,&quot;font-weight&quot;:&quot;600&quot;},wf,(b[4]?&quot;&quot;:(b[3]&gt;=0?&quot;+&quot;:&quot;&quot;))+(b[4]?fmt(b[3]):(b[3]&lt;0?&quot;−&quot;:&quot;&quot;)+fmt(Math.abs(b[3]))));
      var parts=b[0].split(&quot; &quot;);parts.forEach(function(t,j){el(&quot;text&quot;,{x:x+w/2,y:272+j*13,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},wf,t);});
      if(i&lt;bars.length-1){var nx=x+w,ny=Yw(b[2]);el(&quot;line&quot;,{x1:nx,x2:nx+gap,y1:ny,y2:ny,stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;2 2&quot;},wf);}
    });
    document.getElementById(&quot;labCheck&quot;).innerHTML=&quot;Check: planning NOI &quot;+fmt(P.noi)+&quot; + activity &quot;+vr(F.noi-P.noi,false).t+&quot; + revenue &amp;amp; spending &quot;+vr(A.noi-F.noi,false).t+&quot; = actual NOI &quot;+fmt(A.noi)+&quot;. Total variance: &lt;b&gt;&quot;+vr(A.noi-P.noi,false).t+&quot;&lt;/b&gt;.&quot;;
  };
  ps.addEventListener(&quot;input&quot;,draw);as.addEventListener(&quot;input&quot;,draw);
  document.getElementById(&quot;labReset&quot;).addEventListener(&quot;click&quot;,function(){ps.value=30;as.value=35;draw();});
  draw();
}
})();
