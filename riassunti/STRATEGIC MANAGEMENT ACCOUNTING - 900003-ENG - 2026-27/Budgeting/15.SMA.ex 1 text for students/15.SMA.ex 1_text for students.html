&lt;!-- SEZIONE 1 --&gt;
&lt;section id=&quot;comportamento&quot; class=&quot;part&quot; data-tone=&quot;sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 1 · fondamenti&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;1&lt;/span&gt;Cost behavior: come reagiscono costi e ricavi al volume&lt;/h2&gt;
  &lt;p&gt;Tutto l&#x27;esercizio si regge su una tabella che le slide danno per scontata: per ogni voce, un &lt;b&gt;Fixed Element per Month&lt;/b&gt; (componente fissa mensile) e un &lt;b&gt;Variable Element per Customer Served&lt;/b&gt; (componente variabile per cliente servito). Capire questa tabella significa capire il &lt;em class=&quot;t&quot;&gt;cost behavior&lt;/em&gt;, cioè il modo in cui un costo totale cambia quando cambia il livello di attività.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity measure (o cost driver)&lt;/b&gt; — la misura del volume con cui l&#x27;azienda esprime il proprio output e che &quot;guida&quot; i costi variabili. Adger è una società di servizi e misura l&#x27;output in &lt;b&gt;number of customers served&lt;/b&gt; (numero di clienti serviti).&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fixed cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Costo fisso&lt;/b&gt;: il totale non cambia al variare dell&#x27;attività (entro il &lt;em class=&quot;t&quot;&gt;relevant range&lt;/em&gt;, l&#x27;intervallo di volumi in cui le ipotesi valgono). Per cliente, invece, &lt;i&gt;scende&lt;/i&gt; se i clienti aumentano.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Other expenses $36,000/mese.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Variable cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Costo variabile&lt;/b&gt;: il totale cresce in proporzione all&#x27;attività; il costo per unità resta costante.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Travel expenses $600 per cliente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mixed cost&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Costo misto&lt;/b&gt; (o semivariabile): ha entrambe le componenti, una base fissa più una quota per unità.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Adger: Employee salaries and wages $50,000 + $1,100 per cliente.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;Ogni voce si descrive con una &lt;b&gt;cost formula&lt;/b&gt;, la stessa retta per tutte:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Y = a + b · X&lt;small&gt;Y = costo totale · a = componente fissa del mese · b = costo variabile per unità · X = livello di attività (clienti)&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;Anche il ricavo segue la stessa logica, con a = 0: &lt;b&gt;Revenue = $5,000 × clienti&lt;/b&gt;. Ecco la tabella delle slide tradotta in formule:&lt;/p&gt;

  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Fixed (a)&lt;/th&gt;&lt;th&gt;Variable per customer (b)&lt;/th&gt;&lt;th&gt;Comportamento&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td&gt;variabile&lt;/td&gt;&lt;td&gt;5,000·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;$50,000&lt;/td&gt;&lt;td&gt;$1,100&lt;/td&gt;&lt;td&gt;mixed&lt;/td&gt;&lt;td&gt;50,000 + 1,100·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;td&gt;variabile&lt;/td&gt;&lt;td&gt;600·X&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;fisso&lt;/td&gt;&lt;td&gt;36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expenses&lt;/td&gt;&lt;td&gt;$86,000&lt;/td&gt;&lt;td&gt;$1,700&lt;/td&gt;&lt;td&gt;mixed&lt;/td&gt;&lt;td&gt;86,000 + 1,700·X&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Dati: 15.SMA.ex 1_text for students.pdf, tabella iniziale.&lt;/p&gt;

  &lt;h3&gt;Prova tu: sposta il numero di clienti&lt;/h3&gt;
  &lt;p&gt;Il grafico disegna le formule di Adger. Le linee tratteggiate verticali segnano i 30 clienti del planning budget e i 35 effettivamente serviti a maggio.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;qSlider&quot;&gt;Clienti serviti (X)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qSlider&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;qOut&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;cvp&quot; viewBox=&quot;0 0 640 360&quot; role=&quot;img&quot; aria-label=&quot;Grafico di ricavi, costi fissi e costi totali di Adger in funzione dei clienti serviti&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Linea terracotta: Revenue · linea ardesia: Total expenses · area salvia: componente fissa ($86,000). Il punto in cui ricavi e costi si incrociano è il break-even &lt;span class=&quot;beyond&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;readout&quot; id=&quot;cvpRead&quot;&gt;&lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Perché il costo fisso &lt;i&gt;per cliente&lt;/i&gt; cambia ma il totale no?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli $86,000 fissi si spalmano su più o meno clienti: a 30 clienti sono $2,867 per cliente, a 35 sono $2,457. Il totale però resta $86,000. Per questo nei budget si lavora sempre con i &lt;b&gt;totali fissi&lt;/b&gt; e con i &lt;b&gt;valori variabili unitari&lt;/b&gt;: non si moltiplica mai un costo fisso &quot;per cliente&quot; per un nuovo volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Il break-even di Adger &lt;span class=&quot;beyond&quot;&gt;oltre le slide&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ogni cliente porta $5,000 di ricavo e $1,700 di costi variabili: il &lt;em class=&quot;t&quot;&gt;contribution margin&lt;/em&gt; (margine di contribuzione) unitario è $3,300. Per coprire gli $86,000 fissi servono 86,000 / 3,300 ≈ &lt;b&gt;26,1 clienti&lt;/b&gt;. Sopra quella soglia la net operating income (reddito operativo netto) è positiva. Non è richiesto dall&#x27;esercizio, ma aiuta a vedere che la stessa cost formula serve sia per il CVP che per il flexible budget.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Relevant range: il limite delle formule&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le formule valgono solo per volumi &quot;normali&quot;. Se Adger servisse 80 clienti, probabilmente dovrebbe assumere personale o affittare spazi: i costi &quot;fissi&quot; salirebbero a gradini. Il flexible budget presuppone che il volume effettivo resti nel relevant range.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quanto valgono le travel expenses se a maggio i clienti fossero 0?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$0: sono puramente variabili (600 · 0).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto valgono le other expenses con 40 clienti?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$36,000: sono fisse, restano uguali in tutto il relevant range.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Scrivi la cost formula dei salari e calcolala per 32 clienti.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Y = 50,000 + 1,100·X → 50,000 + 35,200 = &lt;b&gt;$85,200&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché i salari sono un mixed cost e non un fixed cost?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché oltre alla base fissa di $50,000 (stipendi del personale stabile) c&#x27;è una parte che cresce di $1,100 per ogni cliente in più (ore, straordinari, collaboratori a progetto).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SEZIONE 2 --&gt;
&lt;section id=&quot;budget&quot; class=&quot;part&quot; data-tone=&quot;ochre&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 2 · i tre &quot;conti&quot;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;2&lt;/span&gt;Planning budget, flexible budget, actual results&lt;/h2&gt;
  &lt;p&gt;Il cuore dell&#x27;esercizio: Adger aveva previsto di servire &lt;b&gt;30 clienti&lt;/b&gt; al mese, ma a maggio ne ha serviti &lt;b&gt;35&lt;/b&gt;. Con un volume diverso, confrontare direttamente il budget iniziale con il consuntivo non dice nulla di utile su come sono stati gestiti costi e prezzi. Servono tre colonne.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning budget&lt;/b&gt; (detto anche &lt;i&gt;static budget&lt;/i&gt;, budget statico) — il budget preparato &lt;b&gt;prima&lt;/b&gt; del periodo, per un solo livello di attività previsto (qui 30 clienti). Non viene modificato dopo.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt; (budget flessibile) — una stima di quanto ricavi e costi &lt;b&gt;avrebbero dovuto essere&lt;/b&gt; dato il livello di attività &lt;b&gt;effettivo&lt;/b&gt; (qui 35 clienti). Si prepara a fine periodo applicando le stesse cost formulas al volume reale.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Actual results&lt;/b&gt; (risultati effettivi, consuntivo) — i valori registrati davvero: revenue $160,000, salaries $88,000, travel $19,000, other $34,500.&lt;/div&gt;

    &lt;text x=&quot;90&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Inizio maggio&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Durante maggio&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Fine maggio&lt;/text&gt;
    &lt;rect x=&quot;20&quot; y=&quot;95&quot; width=&quot;150&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;formule × 30 clienti&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;previsione ex ante&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;NOI previsto $13,000&lt;/text&gt;
    &lt;rect x=&quot;285&quot; y=&quot;95&quot; width=&quot;150&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;
    &lt;text x=&quot;360&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Attività reale&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;35 clienti serviti&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;+5 rispetto al piano&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;95&quot; width=&quot;210&quot; height=&quot;95&quot; rx=&quot;8&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
    &lt;text x=&quot;595&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual + Flexible budget&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;consuntivo registrato&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;+ formule × 35 clienti (ex post)&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;confronto a parità di volume&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Il flexible budget non è una previsione: si costruisce dopo, quando si conosce il volume effettivo.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le tre colonne di Adger a confronto&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Budget di Adger&quot;&gt;

      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;5,000 × 30&lt;/td&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;/tr&gt;

      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;fisso&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$137,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;150,000 − 137,000&lt;/td&gt;&lt;td&gt;$13,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p2&quot; aria-labelledby=&quot;t2&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Calcolo (X = 35)&lt;/th&gt;&lt;th&gt;Importo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;5,000 × 35&lt;/td&gt;&lt;td&gt;$175,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;50,000 + 1,100 × 35&lt;/td&gt;&lt;td&gt;$88,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;600 × 35&lt;/td&gt;&lt;td&gt;$21,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;fisso&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$145,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;175,000 − 145,500&lt;/td&gt;&lt;td&gt;$29,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p3&quot; aria-labelledby=&quot;t3&quot; hidden&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Origine&lt;/th&gt;&lt;th&gt;Importo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;dato&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;dato&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;dato&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;dato&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$141,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td&gt;160,000 − 141,500&lt;/td&gt;&lt;td&gt;$18,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;p4&quot; aria-labelledby=&quot;t4&quot; hidden&gt;
    &lt;p&gt;Se confrontassimo direttamente &lt;b&gt;actual&lt;/b&gt; e &lt;b&gt;planning&lt;/b&gt;:&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;&quot;Scostamento&quot; ingenuo&lt;/th&gt;&lt;th&gt;Lettura corretta (vs flexible)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$10,000 F&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$15,000 U&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Salaries and wages&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;td&gt;$83,000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$5,000 U&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$500 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;td&gt;$18,000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$1,000 U&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$2,000 F&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$1,500 F&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;$1,500 F&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Il confronto ingenuo dice &quot;ricavi ottimi, costi fuori controllo&quot;. La verità è opposta: &lt;b&gt;a parità di 35 clienti&lt;/b&gt; i costi sono stati gestiti bene, mentre i ricavi per cliente sono stati deludenti. Il confronto statico mescola due effetti diversi, volume e gestione, ed è questo il motivo per cui si costruisce il flexible budget.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Regola d&#x27;oro.&lt;/strong&gt; Nel flexible budget i costi fissi restano &lt;b&gt;uguali&lt;/b&gt; al planning budget (Other expenses $36,000 in entrambi); cambiano solo le componenti variabili, moltiplicate per il volume effettivo.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza essenziale tra planning budget e flexible budget?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il livello di attività: il planning usa il volume &lt;i&gt;previsto&lt;/i&gt; (30), il flexible quello &lt;i&gt;effettivo&lt;/i&gt; (35). Le cost formulas sono le stesse.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il flexible budget si può preparare all&#x27;inizio del mese?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le formule sì, gli importi no: servono i clienti effettivamente serviti, noti solo a fine periodo. Si può però preparare un flexible budget &quot;a più colonne&quot; (es. 25, 30, 35, 40 clienti) per avere pronte le stime per vari volumi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché confrontare actual (35 clienti) con planning (30 clienti) è fuorviante?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché costi e ricavi variabili cambiano con il volume: una parte della differenza è dovuta solo ai 5 clienti in più, non a bravura o inefficienza. Si confrontano mele con pere.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SEZIONE 3 --&gt;
&lt;section id=&quot;scostamenti&quot; class=&quot;part&quot; data-tone=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 3 · analisi degli scostamenti&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;3&lt;/span&gt;Variances: activity, revenue e spending&lt;/h2&gt;
  &lt;p&gt;Una &lt;em class=&quot;t&quot;&gt;variance&lt;/em&gt; (scostamento) è la differenza tra due colonne. Mettendo il flexible budget &lt;b&gt;in mezzo&lt;/b&gt;, la differenza totale tra consuntivo e piano si spezza in due blocchi che hanno cause e responsabili diversi.&lt;/p&gt;

  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 230&quot; role=&quot;img&quot; aria-label=&quot;Schema: actual results, revenue and spending variances, flexible budget, activity variances, planning budget&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;prezzi e costi effettivi&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;attività effettiva&lt;/text&gt;
    &lt;rect x=&quot;275&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;360&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;prezzi e costi da formula&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;attività effettiva&lt;/text&gt;
    &lt;rect x=&quot;540&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;625&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Planning budget&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;prezzi e costi da formula&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;attività prevista&lt;/text&gt;
    &lt;path d=&quot;M95 125 v12 h265 v-12 M227 137 v14&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;path d=&quot;M360 125 v12 h265 v-12 M492 137 v14&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;rect x=&quot;132&quot; y=&quot;153&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;
    &lt;text x=&quot;227&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Revenue &amp;amp; spending var.&lt;/text&gt;&lt;text x=&quot;227&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;cambia solo prezzo/efficienza&lt;/text&gt;
    &lt;rect x=&quot;397&quot; y=&quot;153&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;
    &lt;text x=&quot;492&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Activity variances&lt;/text&gt;&lt;text x=&quot;492&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;cambia solo il volume&lt;/text&gt;
    &lt;text x=&quot;360&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;la differenza totale actual − planning = somma dei due blocchi&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Ogni coppia di colonne adiacenti differisce per un solo fattore: per questo lo scostamento è &quot;puro&quot;.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Tipi di variance&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v1&quot; aria-controls=&quot;vp1&quot; aria-selected=&quot;true&quot;&gt;Activity variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v2&quot; aria-controls=&quot;vp2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Revenue variance&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;v3&quot; aria-controls=&quot;vp3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Spending variance&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp1&quot; aria-labelledby=&quot;v1&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity variance = Flexible budget − Planning budget&lt;small&gt;misura solo l&#x27;effetto della differenza tra attività effettiva e prevista&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Per i ricavi&lt;/b&gt;: flexible &amp;gt; planning → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt; (più clienti = più ricavi). &lt;b&gt;Per i costi&lt;/b&gt;: flexible &amp;gt; planning → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;, perché più clienti fanno salire i costi variabili.&lt;/p&gt;
    &lt;p&gt;Per un costo &lt;b&gt;totalmente fisso&lt;/b&gt; l&#x27;activity variance è sempre zero (&quot;None&quot;): il volume non lo tocca.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp2&quot; aria-labelledby=&quot;v2&quot; hidden&gt;
    &lt;div class=&quot;formula&quot;&gt;Revenue variance = Actual revenue − Flexible budget revenue&lt;small&gt;quanto si è incassato in più o in meno rispetto a quanto si sarebbe dovuto incassare con l&#x27;attività effettiva&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Actual &amp;gt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;; actual &amp;lt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Cause tipiche: prezzi medi diversi dallo standard, sconti, mix di clienti, servizi non fatturati.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;vp3&quot; aria-labelledby=&quot;v3&quot; hidden&gt;
    &lt;div class=&quot;formula&quot;&gt;Spending variance = Actual cost − Flexible budget cost&lt;small&gt;quanto si è speso in più o in meno di quanto si sarebbe dovuto spendere per l&#x27;attività effettiva&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Actual &amp;lt; flexible → &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt; (si è speso meno); actual &amp;gt; flexible → &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;. Cause tipiche: prezzi degli input diversi, uso più o meno efficiente delle risorse, sprechi o risparmi.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Come scrive le risposte l&#x27;esercizio.&lt;/strong&gt; Le domande chiedono importi sempre &lt;b&gt;positivi&lt;/b&gt; con l&#x27;indicazione &lt;b&gt;F&lt;/b&gt; (favorable, favorevole: alza il reddito), &lt;b&gt;U&lt;/b&gt; (unfavorable, sfavorevole: abbassa il reddito) o &lt;b&gt;None&lt;/b&gt; (scostamento zero). Il segno lo esprime la lettera, non il numero.&lt;/div&gt;

  &lt;h3&gt;Allenati: F, U o None?&lt;/h3&gt;
  &lt;div class=&quot;fu&quot;&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;F&quot; data-why=&quot;Spending variance: actual &amp;lt; flexible, si è speso meno del dovuto → $2,000 F.&quot;&gt;&lt;span&gt;Travel: actual $19,000, flexible $21,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Revenue variance: si è incassato meno di quanto prevedeva il flexible budget → $15,000 U.&quot;&gt;&lt;span&gt;Revenue: actual $160,000, flexible $175,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Activity variance di un costo: più clienti → costo più alto → $5,500 U (non è un&#x27;inefficienza!).&quot;&gt;&lt;span&gt;Salaries: flexible $88,500, planning $83,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;F&quot; data-why=&quot;Activity variance dei ricavi: 5 clienti in più × $5,000 → $25,000 F.&quot;&gt;&lt;span&gt;Revenue: flexible $175,000, planning $150,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;None&quot; data-why=&quot;Costo fisso: identico in flexible e planning → activity variance $0, None.&quot;&gt;&lt;span&gt;Other expenses: flexible $36,000, planning $36,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;U&quot; data-why=&quot;Caso ipotetico: si è speso più del flexible budget → spending variance $1,000 U.&quot;&gt;&lt;span&gt;Ipotetico: other expenses actual $37,000, flexible $36,000&lt;/span&gt;&lt;span class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;F&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;U&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;None&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali due colonne si confrontano per la spending variance?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Actual results e flexible budget: stesso volume (35 clienti), quindi la differenza dipende solo da quanto si è speso per unità di attività.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;activity variance U su un costo è un segnale di cattiva gestione?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Dice solo che, avendo servito più clienti, era normale spendere di più. Infatti è accompagnata da un&#x27;activity variance F sui ricavi più grande.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché per un costo fisso l&#x27;activity variance è sempre &quot;None&quot;?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché flexible e planning budget usano lo stesso importo fisso: il volume non entra nella formula (b = 0).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Come si verifica che le variances siano coerenti?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Revenue &amp;amp; spending variances + activity variances (con il loro effetto sul reddito) devono dare la differenza totale tra actual NOI e planning NOI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SEZIONE 4 --&gt;
&lt;section id=&quot;adger&quot; class=&quot;part&quot; data-tone=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 4 · l&#x27;esercizio&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;4&lt;/span&gt;Adger Corporation: le 15 domande, passo per passo&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Il caso&lt;/b&gt; (dalle slide): Adger Corporation è una società di servizi che misura il proprio output in clienti serviti. Ha pianificato &lt;b&gt;30 clienti&lt;/b&gt; al mese; a maggio ne ha serviti &lt;b&gt;35&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Fixed Element per Month&lt;/th&gt;&lt;th&gt;Variable Element per Customer Served&lt;/th&gt;&lt;th&gt;Actual Total for May&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$5,000&lt;/td&gt;&lt;td&gt;$160,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee salaries and wages&lt;/td&gt;&lt;td&gt;$50,000&lt;/td&gt;&lt;td&gt;$1,100&lt;/td&gt;&lt;td&gt;$88,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Travel expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$600&lt;/td&gt;&lt;td&gt;$19,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td&gt;$36,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$34,500&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Tabella riprodotta da 15.SMA.ex 1_text for students.pdf.&lt;/p&gt;
  &lt;p&gt;Prova a rispondere da solo prima di aprire ogni calcolo. L&#x27;ordine dei passi segue le domande del testo.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;
      &lt;button&gt;① Flexible budget&lt;br&gt;Q1–5&lt;/button&gt;&lt;button&gt;② Revenue &amp;amp; spending&lt;br&gt;Q6–9&lt;/button&gt;&lt;button&gt;③ Planning budget&lt;br&gt;Q10–13&lt;/button&gt;&lt;button&gt;④ Activity var.&lt;br&gt;Q14–15&lt;/button&gt;&lt;button&gt;⑤ Verifica&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Passo 1 · Flexible budget a 35 clienti&lt;/h3&gt;
      &lt;p&gt;Applica ogni cost formula al volume &lt;b&gt;effettivo&lt;/b&gt;, X = 35.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;1&lt;/span&gt;&lt;div&gt;Revenue nel flexible budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$5,000 × 35 = &lt;span class=&quot;res&quot;&gt;$175,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;2&lt;/span&gt;&lt;div&gt;Employee salaries and wages nel flexible budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$50,000 + $1,100 × 35 = 50,000 + 38,500 = &lt;span class=&quot;res&quot;&gt;$88,500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;3&lt;/span&gt;&lt;div&gt;Travel expenses nel flexible budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$600 × 35 = &lt;span class=&quot;res&quot;&gt;$21,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;4&lt;/span&gt;&lt;div&gt;Other expenses nel flexible budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;Costo fisso: &lt;span class=&quot;res&quot;&gt;$36,000&lt;/span&gt; (non dipende dai clienti)&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;5&lt;/span&gt;&lt;div&gt;Net operating income nel flexible budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;175,000 − (88,500 + 21,000 + 36,000) = 175,000 − 145,500 = &lt;span class=&quot;res&quot;&gt;$29,500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Passo 2 · Revenue e spending variances (actual vs flexible)&lt;/h3&gt;
      &lt;p&gt;Confronta il consuntivo con il flexible budget: stesso volume, quindi resta solo l&#x27;effetto di prezzi ed efficienza.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;6&lt;/span&gt;&lt;div&gt;Revenue variance?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;160,000 − 175,000 = −15,000 → incassato meno del dovuto → &lt;span class=&quot;res U&quot;&gt;$15,000 U&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;7&lt;/span&gt;&lt;div&gt;Spending variance di employee salaries and wages?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;88,000 − 88,500 = −500 → speso meno → &lt;span class=&quot;res F&quot;&gt;$500 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;8&lt;/span&gt;&lt;div&gt;Spending variance di travel expenses?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;19,000 − 21,000 = −2,000 → speso meno → &lt;span class=&quot;res F&quot;&gt;$2,000 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;9&lt;/span&gt;&lt;div&gt;Spending variance di other expenses?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;34,500 − 36,000 = −1,500 → speso meno → &lt;span class=&quot;res F&quot;&gt;$1,500 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Passo 3 · Planning budget a 30 clienti&lt;/h3&gt;
      &lt;p&gt;Stesse formule, ma con il volume &lt;b&gt;previsto&lt;/b&gt;, X = 30.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;10&lt;/span&gt;&lt;div&gt;Revenue nel planning budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$5,000 × 30 = &lt;span class=&quot;res&quot;&gt;$150,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;11&lt;/span&gt;&lt;div&gt;Employee salaries and wages nel planning budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$50,000 + $1,100 × 30 = 50,000 + 33,000 = &lt;span class=&quot;res&quot;&gt;$83,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;12&lt;/span&gt;&lt;div&gt;Travel expenses nel planning budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;$600 × 30 = &lt;span class=&quot;res&quot;&gt;$18,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;13&lt;/span&gt;&lt;div&gt;Other expenses nel planning budget?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;&lt;span class=&quot;res&quot;&gt;$36,000&lt;/span&gt; (fisso, uguale al flexible budget)&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Non richiesto ma utile: planning NOI = 150,000 − 137,000 = $13,000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Passo 4 · Activity variances (flexible vs planning)&lt;/h3&gt;
      &lt;p&gt;Differenza dovuta solo ai 5 clienti in più. Scorciatoia: &lt;b&gt;activity variance = componente variabile × (35 − 30)&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;14&lt;/span&gt;&lt;div&gt;Activity variance dei ricavi?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;175,000 − 150,000 = 5,000 × 5 = &lt;span class=&quot;res F&quot;&gt;$25,000 F&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;qa&quot;&gt;&lt;span class=&quot;qn&quot;&gt;15&lt;/span&gt;&lt;div&gt;Activity variances di ciascun costo?&lt;details&gt;&lt;summary&gt;Mostra calcolo&lt;/summary&gt;&lt;div class=&quot;calc&quot;&gt;
        Salaries and wages: 88,500 − 83,000 = 1,100 × 5 = &lt;span class=&quot;res U&quot;&gt;$5,500 U&lt;/span&gt;&lt;br&gt;
        Travel expenses: 21,000 − 18,000 = 600 × 5 = &lt;span class=&quot;res U&quot;&gt;$3,000 U&lt;/span&gt;&lt;br&gt;
        Other expenses: 36,000 − 36,000 = &lt;span class=&quot;res&quot;&gt;$0 None&lt;/span&gt;&lt;br&gt;
        &lt;span class=&quot;src&quot;&gt;Effetto sul NOI: 25,000 F − 5,500 U − 3,000 U = $16,500 F (= 3,300 di contribution margin × 5 clienti).&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Passo 5 · Verifica di coerenza&lt;/h3&gt;
      &lt;p&gt;Le variances devono &quot;chiudere&quot; il ponte tra planning NOI e actual NOI.&lt;/p&gt;
      &lt;div class=&quot;calc&quot;&gt;
        &lt;p&gt;Actual NOI = 160,000 − (88,000 + 19,000 + 34,500) = 160,000 − 141,500 = &lt;b&gt;$18,500&lt;/b&gt;&lt;/p&gt;
        &lt;p&gt;Revenue &amp;amp; spending (effetto su NOI) = −15,000 + 500 + 2,000 + 1,500 = &lt;span class=&quot;U&quot;&gt;$11,000 U&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Activity (effetto su NOI) = &lt;span class=&quot;F&quot;&gt;$16,500 F&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;13,000 + 16,500 − 11,000 = &lt;b&gt;18,500&lt;/b&gt; ✓ → scostamento totale &lt;span class=&quot;F&quot;&gt;$5,500 F&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Risultati del flexible budget (Q1–5) confrontati con la soluzione McGraw-Hill: vedi &quot;Per approfondire&quot;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Se Adger avesse servito 28 clienti, quanto varrebbero le travel expenses del flexible budget?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;600 × 28 = $16,800. E l&#x27;activity variance rispetto al planning (30) sarebbe 600 × (28 − 30) = $1,200 F.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Ricavo medio effettivo per cliente a maggio?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;160,000 / 35 ≈ $4,571, contro i $5,000 standard: circa $429 in meno per cliente, che spiega la revenue variance da $15,000 U.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Calcola l&#x27;activity variance del NOI con una sola moltiplicazione.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Contribution margin per cliente (5,000 − 1,100 − 600 = 3,300) × 5 clienti = $16,500 F.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SEZIONE 5 --&gt;
&lt;section id=&quot;report&quot; class=&quot;part&quot; data-tone=&quot;brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 5 · la sintesi&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;5&lt;/span&gt;Il performance report a cinque colonne&lt;/h2&gt;
  &lt;p&gt;Le risposte alle 15 domande, messe insieme, formano il &lt;em class=&quot;t&quot;&gt;flexible budget performance report&lt;/em&gt; (report di performance basato sul flexible budget): una tabella che affianca le tre colonne e, tra una e l&#x27;altra, le variances. È lo strumento con cui il management legge il mese. &lt;span class=&quot;beyond&quot;&gt;oltre le slide&lt;/span&gt; Le slide chiedono i singoli valori; il report è il modo standard di presentarli.&lt;/p&gt;

  &lt;h3&gt;Laboratorio: cambia i volumi&lt;/h3&gt;
  &lt;p&gt;Con 30 e 35 vedi il report di maggio. Sposta i cursori per vedere come cambiano le colonne: i risultati effettivi restano quelli di maggio, quindi gli altri volumi sono &lt;b&gt;casi ipotetici&lt;/b&gt; per allenarsi.&lt;/p&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;pSlider&quot;&gt;Clienti nel planning budget&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pSlider&quot; min=&quot;20&quot; max=&quot;45&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;pOut&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
  &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;aSlider&quot;&gt;Clienti effettivamente serviti&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;aSlider&quot; min=&quot;20&quot; max=&quot;45&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;aOut&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
  &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;labReset&quot;&gt;Torna a maggio (30 / 35)&lt;/button&gt;&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;labTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;labCheck&quot; class=&quot;calc&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 700 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata dal NOI del planning budget al NOI effettivo&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Grafico a cascata (waterfall): dal reddito previsto a quello effettivo. Verde = scostamento che aumenta il reddito (F), rosso = lo riduce (U), ocra = totali.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Nel laboratorio, metti planning = actual = 35. Che cosa succede alle activity variances?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Diventano tutte zero: flexible e planning coincidono. Restano solo revenue e spending variances.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la colonna centrale del report è il flexible budget?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché fa da ponte: confina a sinistra l&#x27;effetto di prezzi/efficienza e a destra l&#x27;effetto del volume, così i due non si mescolano.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- SEZIONE 6 --&gt;
&lt;section id=&quot;interpretare&quot; class=&quot;part&quot; data-tone=&quot;accent&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 6 · leggere i numeri&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num-badge&quot;&gt;6&lt;/span&gt;Che cosa dicono le variances di Adger&lt;/h2&gt;
  &lt;p&gt;A colpo d&#x27;occhio maggio sembra un buon mese: NOI $18,500 contro $13,000 previsti. L&#x27;analisi però racconta una storia più sfumata. &lt;span class=&quot;beyond&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il volume ha salvato il mese&lt;/h4&gt;&lt;p&gt;I 5 clienti in più valgono $16,500 F di reddito. Senza questo effetto il NOI sarebbe sceso.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il prezzo medio è il problema&lt;/h4&gt;&lt;p&gt;Revenue variance $15,000 U: si è incassato circa $4,571 per cliente invece di $5,000. Sconti per acquisire i nuovi clienti? Servizi non fatturati? Da indagare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;I costi sono sotto controllo&lt;/h4&gt;&lt;p&gt;Tutte le spending variances sono F (totale $4,000). Buona notizia, se non nasconde tagli che peggiorano il servizio.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Errori tipici&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Leggere &quot;F&quot; come &quot;buono&quot; e &quot;U&quot; come &quot;cattivo&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;F e U indicano solo l&#x27;effetto sul reddito. Una travel spending variance F potrebbe venire da visite ai clienti saltate, che a lungo andare costano più di quanto fanno risparmiare. Una cost activity variance U è fisiologica quando il volume cresce.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Calcolare il flexible budget &quot;scalando&quot; il planning budget in proporzione&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Moltiplicare tutto per 35/30 sarebbe sbagliato: i salari diventerebbero 83,000 × 35/30 = $96,833 invece di $88,500, perché anche la parte fissa verrebbe gonfiata. Solo la componente variabile si scala.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Usare il volume sbagliato nella colonna sbagliata&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Planning → volume previsto (30). Flexible → volume effettivo (35). Actual → dati registrati, nessuna formula.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Scrivere importi negativi&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il testo chiede valori positivi con F/U/None: &quot;$500 F&quot;, non &quot;−500&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Chi risponde di cosa &lt;span class=&quot;beyond&quot;&gt;oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Le due famiglie di variances hanno responsabili diversi: l&#x27;&lt;b&gt;activity variance&lt;/b&gt; dipende da quanto si è venduto (commerciale, mercato); le &lt;b&gt;revenue e spending variances&lt;/b&gt; dipendono da come si sono fissati i prezzi e usate le risorse (responsabili di prezzo e dei centri di costo). Separarle serve a valutare ciascuno su ciò che controlla.&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Limiti del modello.&lt;/strong&gt; Un solo cost driver (clienti serviti) per tutte le voci; costi lineari; validità solo nel relevant range. I manuali estendono il flexible budget a più cost drivers quando i costi dipendono da attività diverse (vedi &quot;Per approfondire&quot;).&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 6&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Il NOI è salito di $5,500 rispetto al piano. Basta per dire che il mese è stato gestito bene?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: è la somma di +16,500 di volume e −11,000 di prezzi/costi, dominato da un problema di ricavo per cliente da approfondire.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché non si può ottenere il flexible budget moltiplicando il planning budget per 35/30?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché i costi fissi (e la parte fissa dei mixed costs) non crescono con il volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- PER APPROFONDIRE --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot; data-tone=&quot;slate&quot;&gt;
&lt;div class=&quot;wrap refs&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Risorse&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le slide di questa esercitazione &lt;b&gt;non citano autori, testi, norme o siti&lt;/b&gt;: contengono solo il testo del caso. Le risorse qui sotto vengono da una ricerca web per individuare il manuale da cui proviene l&#x27;esercizio e materiale di studio collegato. Tutto è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;Non ho potuto elencare il contenuto della cartella &lt;i&gt;corso/&lt;/i&gt; (solo lettura di file con percorso noto): per collegare questa esercitazione alle lezioni teoriche sul budgeting e al programma, controlla i file vicini a &lt;i&gt;corso/Budgeting/&lt;/i&gt;, in particolare eventuali soluzioni dell&#x27;esercizio 15.SMA.&lt;/p&gt;

  &lt;article&gt;
    &lt;h3&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Manuale universitario di riferimento per la contabilità direzionale. Il capitolo &lt;b&gt;&quot;Flexible Budgets and Performance Analysis&quot;&lt;/b&gt; spiega planning e flexible budget, activity variances, revenue e spending variances, il performance report e i flexible budget con più cost drivers. Il numero del capitolo cambia con l&#x27;edizione (cap. 10 nella 13ª edizione, cap. 9 nelle edizioni più recenti e in &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt;). Conta perché l&#x27;esercizio Adger, con stessi dati e domande, compare nel materiale McGraw-Hill del manuale.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice della 13ª edizione (McGraw-Hill Higher Education)&lt;/a&gt; · &lt;a href=&quot;https://www.mheducation.com/highered/product/9781265616656.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;edizione corrente (McGraw Hill)&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
  &lt;article&gt;
    &lt;h3&gt;Soluzioni del capitolo 9 (McGraw-Hill)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; File di soluzioni pubblicato sul sito McGraw-Hill del manuale, con il caso Adger: flexible budget revenue $175,000, salaries and wages $88,500, travel $21,000, other $36,000, NOI $29,500. Questi valori coincidono con il passo 1 di questa pagina. Serve per controllare le proprie risposte. È un file .doc da scaricare.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/dl/free/0027162757/1029197/SMChap009.doc&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SMChap009.doc — highered.mheducation.com&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
  &lt;article&gt;
    &lt;h3&gt;Practice quiz sui flexible budgets (California State University, Sacramento)&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Quiz di esercitazione universitario sul capitolo 9 (flexible budgets), con esercizi dello stesso tipo: flexible budget, activity e spending variances. Utile per allenarsi su casi diversi da Adger.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.csus.edu/indiv/p/pforsichh/documents/ACCY02Chap09FlexBudgetPracticeQuizSTUDENTCOPY.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ACCY02 Chap. 09 Flex Budget Practice Quiz (csus.edu, PDF)&lt;/a&gt;&lt;/p&gt;
  &lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
&quot;use strict&quot;;
var M={price:5000,sal:{f:50000,v:1100},trav:{f:0,v:600},oth:{f:36000,v:0}};
var ACT={rev:160000,sal:88000,trav:19000,oth:34500};
function fmt(n){n=Math.round(n);return (n&lt;0?&quot;−&quot;:&quot;&quot;)+&quot;$&quot;+Math.abs(n).toLocaleString(&quot;en-US&quot;);}
function budget(q){var b={rev:M.price*q,sal:M.sal.f+M.sal.v*q,trav:M.trav.f+M.trav.v*q,oth:M.oth.f+M.oth.v*q};b.exp=b.sal+b.trav+b.oth;b.noi=b.rev-b.exp;return b;}
function actual(){var a={rev:ACT.rev,sal:ACT.sal,trav:ACT.trav,oth:ACT.oth};a.exp=a.sal+a.trav+a.oth;a.noi=a.rev-a.exp;return a;}
/* varianza: per ricavi/NOI positivo = F; per costi positivo = U */
function vr(x,isCost){if(Math.round(x)===0)return{t:&quot;$0&quot;,c:&quot;N&quot;,l:&quot;None&quot;};var fav=isCost?x&lt;0:x&gt;0;return{t:fmt(Math.abs(x))+&quot; &quot;+(fav?&quot;F&quot;:&quot;U&quot;),c:fav?&quot;F&quot;:&quot;U&quot;,l:fav?&quot;F&quot;:&quot;U&quot;};}
var NS=&quot;http://www.w3.org/2000/svg&quot;;
function el(tag,attrs,parent,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}

/* --- grafico cost behavior --- */
var cvp=document.getElementById(&quot;cvp&quot;);
if(cvp){
  var X=function(q){return 70+q*10.8;},Y=function(v){return 320-v*285/260000;};
  for(var v=0;v&lt;=250000;v+=50000){el(&quot;line&quot;,{x1:70,x2:610,y1:Y(v),y2:Y(v),stroke:&quot;var(--rule)&quot;},cvp);el(&quot;text&quot;,{x:62,y:Y(v)+4,&quot;text-anchor&quot;:&quot;end&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,v===0?&quot;0&quot;:(v/1000)+&quot;k&quot;);}
  for(var q=0;q&lt;=50;q+=10){el(&quot;text&quot;,{x:X(q),y:338,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,q);}
  el(&quot;text&quot;,{x:340,y:356,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,&quot;clienti serviti&quot;);
  el(&quot;path&quot;,{d:&quot;M&quot;+X(0)+&quot; &quot;+Y(0)+&quot;L&quot;+X(0)+&quot; &quot;+Y(86000)+&quot;L&quot;+X(50)+&quot; &quot;+Y(86000)+&quot;L&quot;+X(50)+&quot; &quot;+Y(0)+&quot;Z&quot;,fill:&quot;var(--sage-bg)&quot;,stroke:&quot;var(--sage)&quot;,&quot;stroke-dasharray&quot;:&quot;4 3&quot;},cvp);
  el(&quot;text&quot;,{x:X(1),y:Y(86000)+16,fill:&quot;var(--sage)&quot;,&quot;font-size&quot;:&quot;12&quot;},cvp,&quot;fixed $86,000&quot;);
  el(&quot;line&quot;,{x1:X(0),y1:Y(86000),x2:X(50),y2:Y(171000),stroke:&quot;var(--slate)&quot;,&quot;stroke-width&quot;:2.5},cvp);
  el(&quot;line&quot;,{x1:X(0),y1:Y(0),x2:X(50),y2:Y(250000),stroke:&quot;var(--accent)&quot;,&quot;stroke-width&quot;:2.5},cvp);
  el(&quot;text&quot;,{x:X(50)-4,y:Y(250000)-8,&quot;text-anchor&quot;:&quot;end&quot;,fill:&quot;var(--accent)&quot;,&quot;font-size&quot;:&quot;12&quot;,&quot;font-weight&quot;:&quot;600&quot;},cvp,&quot;Revenue&quot;);
  el(&quot;text&quot;,{x:X(50)-4,y:Y(171000)+18,&quot;text-anchor&quot;:&quot;end&quot;,fill:&quot;var(--slate)&quot;,&quot;font-size&quot;:&quot;12&quot;,&quot;font-weight&quot;:&quot;600&quot;},cvp,&quot;Total expenses&quot;);
  [30,35].forEach(function(q){el(&quot;line&quot;,{x1:X(q),x2:X(q),y1:Y(0),y2:Y(255000),stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;2 4&quot;},cvp);el(&quot;text&quot;,{x:X(q),y:24,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},cvp,q===30?&quot;planning 30&quot;:&quot;actual 35&quot;);});
  var be=86000/3300;el(&quot;circle&quot;,{cx:X(be),cy:Y(5000*be),r:4,fill:&quot;var(--paper)&quot;,stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.5},cvp);
  el(&quot;text&quot;,{x:X(be)+8,y:Y(5000*be)+18,&quot;class&quot;:&quot;lbl&quot;},cvp,&quot;break-even ≈ 26,1&quot;);
  var mk=el(&quot;line&quot;,{y1:Y(0),y2:Y(260000),stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.2},cvp);
  var d1=el(&quot;circle&quot;,{r:5,fill:&quot;var(--accent)&quot;},cvp),d2=el(&quot;circle&quot;,{r:5,fill:&quot;var(--slate)&quot;},cvp);
  var qs=document.getElementById(&quot;qSlider&quot;),qo=document.getElementById(&quot;qOut&quot;),rd=document.getElementById(&quot;cvpRead&quot;);
  var upd=function(){var q=+qs.value,b=budget(q);qo.textContent=q;mk.setAttribute(&quot;x1&quot;,X(q));mk.setAttribute(&quot;x2&quot;,X(q));
    d1.setAttribute(&quot;cx&quot;,X(q));d1.setAttribute(&quot;cy&quot;,Y(b.rev));d2.setAttribute(&quot;cx&quot;,X(q));d2.setAttribute(&quot;cy&quot;,Y(b.exp));
    rd.innerHTML=&quot;&lt;div&gt;Revenue&lt;b&gt;&quot;+fmt(b.rev)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Salaries &amp;amp; wages&lt;b&gt;&quot;+fmt(b.sal)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Travel&lt;b&gt;&quot;+fmt(b.trav)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Other&lt;b&gt;&quot;+fmt(b.oth)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Net operating income&lt;b&gt;&quot;+fmt(b.noi)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Costo fisso per cliente&lt;b&gt;&quot;+(q?fmt(86000/q):&quot;—&quot;)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;;};
  qs.addEventListener(&quot;input&quot;,upd);upd();
}

/* --- linguette --- */
document.querySelectorAll(&quot;[role=tablist]&quot;).forEach(function(tl){
  var tabs=tl.querySelectorAll(&quot;[role=tab]&quot;);
  tabs.forEach(function(t,i){t.addEventListener(&quot;click&quot;,function(){sel(i);});
    t.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;ArrowRight&quot;){sel((i+1)%tabs.length);tabs[(i+1)%tabs.length].focus();}if(e.key===&quot;ArrowLeft&quot;){var j=(i-1+tabs.length)%tabs.length;sel(j);tabs[j].focus();}});});
  function sel(i){tabs.forEach(function(t,j){t.setAttribute(&quot;aria-selected&quot;,i===j);t.tabIndex=i===j?0:-1;document.getElementById(t.getAttribute(&quot;aria-controls&quot;)).hidden=i!==j;});}
});

/* --- classificatore F/U --- */
document.querySelectorAll(&quot;.fu .item&quot;).forEach(function(it){
  var ans=it.getAttribute(&quot;data-a&quot;),fb=it.querySelector(&quot;.fb&quot;);
  it.querySelectorAll(&quot;button&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){
    it.querySelectorAll(&quot;button&quot;).forEach(function(x){x.classList.remove(&quot;on&quot;);});b.classList.add(&quot;on&quot;);
    var ok=b.textContent.trim()===ans;fb.innerHTML=(ok?&quot;&lt;span class=&#x27;F&#x27;&gt;Giusto.&lt;/span&gt; &quot;:&quot;&lt;span class=&#x27;U&#x27;&gt;Non proprio.&lt;/span&gt; &quot;)+it.getAttribute(&quot;data-why&quot;);});});
});

/* --- passi --- */
document.querySelectorAll(&quot;.stepper&quot;).forEach(function(sp){
  var steps=sp.querySelectorAll(&quot;.step&quot;),bar=sp.querySelectorAll(&quot;.stepbar button&quot;),prev=sp.querySelector(&quot;.prev&quot;),next=sp.querySelector(&quot;.next&quot;),cur=0;
  function go(i){cur=i;steps.forEach(function(s,j){s.hidden=j!==i;});bar.forEach(function(b,j){if(j===i)b.setAttribute(&quot;aria-current&quot;,&quot;step&quot;);else b.removeAttribute(&quot;aria-current&quot;);});prev.disabled=i===0;next.disabled=i===steps.length-1;}
  bar.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){go(i);});});
  prev.addEventListener(&quot;click&quot;,function(){if(cur&gt;0)go(cur-1);});
  next.addEventListener(&quot;click&quot;,function(){if(cur&lt;steps.length-1)go(cur+1);});
  go(0);
});

/* --- laboratorio performance report --- */
var lab=document.getElementById(&quot;labTable&quot;);
if(lab){
  var ps=document.getElementById(&quot;pSlider&quot;),as=document.getElementById(&quot;aSlider&quot;),po=document.getElementById(&quot;pOut&quot;),ao=document.getElementById(&quot;aOut&quot;),wf=document.getElementById(&quot;wf&quot;);
  var rows=[[&quot;Revenue&quot;,&quot;rev&quot;,false],[&quot;Employee salaries and wages&quot;,&quot;sal&quot;,true],[&quot;Travel expenses&quot;,&quot;trav&quot;,true],[&quot;Other expenses&quot;,&quot;oth&quot;,true],[&quot;Total expense&quot;,&quot;exp&quot;,true],[&quot;Net operating income&quot;,&quot;noi&quot;,false]];
  var draw=function(){
    var p=+ps.value,aq=+as.value;po.textContent=p;ao.textContent=aq;
    var A=actual(),F=budget(aq),P=budget(p);
    var h=&quot;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Actual results&lt;br&gt;(&quot;+aq+&quot; clienti)&lt;/th&gt;&lt;th&gt;Revenue &amp;amp; spending&lt;br&gt;variances&lt;/th&gt;&lt;th class=&#x27;hl&#x27;&gt;Flexible budget&lt;br&gt;(&quot;+aq+&quot; clienti)&lt;/th&gt;&lt;th&gt;Activity&lt;br&gt;variances&lt;/th&gt;&lt;th&gt;Planning budget&lt;br&gt;(&quot;+p+&quot; clienti)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&quot;;
    rows.forEach(function(r){var k=r[1],c=r[2],v1=vr(A[k]-F[k],c),v2=vr(F[k]-P[k],c);
      h+=&quot;&lt;tr&quot;+(k===&quot;noi&quot;||k===&quot;exp&quot;?&quot; class=&#x27;tot&#x27;&quot;:&quot;&quot;)+&quot;&gt;&lt;td&gt;&quot;+r[0]+&quot;&lt;/td&gt;&lt;td&gt;&quot;+fmt(A[k])+&quot;&lt;/td&gt;&lt;td class=&#x27;&quot;+v1.c+&quot;&#x27;&gt;&quot;+v1.t+&quot;&lt;/td&gt;&lt;td class=&#x27;hl&#x27;&gt;&quot;+fmt(F[k])+&quot;&lt;/td&gt;&lt;td class=&#x27;&quot;+v2.c+&quot;&#x27;&gt;&quot;+v2.t+&quot;&lt;/td&gt;&lt;td&gt;&quot;+fmt(P[k])+&quot;&lt;/td&gt;&lt;/tr&gt;&quot;;});
    lab.innerHTML=h+&quot;&lt;/tbody&gt;&quot;;
    /* waterfall */
    while(wf.firstChild)wf.removeChild(wf.firstChild);
    var st=[[&quot;Planning NOI&quot;,P.noi,&quot;tot&quot;],[&quot;Activity var.&quot;,F.noi-P.noi],[&quot;Revenue var.&quot;,A.rev-F.rev],[&quot;Salaries spend.&quot;,F.sal-A.sal],[&quot;Travel spend.&quot;,F.trav-A.trav],[&quot;Other spend.&quot;,F.oth-A.oth],[&quot;Actual NOI&quot;,A.noi,&quot;tot&quot;]];
    var run=0,bars=[],lo=0,hi=0;
    st.forEach(function(s){var y0,y1;if(s[2]){y0=0;y1=s[1];run=s[1];}else{y0=run;y1=run+s[1];run=y1;}bars.push([s[0],y0,y1,s[1],s[2]]);lo=Math.min(lo,y0,y1);hi=Math.max(hi,y0,y1);});
    var span=(hi-lo)||1,top=30,bot=250,Yw=function(v){return bot-(v-lo)*(bot-top)/span;},w=70,gap=24;
    el(&quot;line&quot;,{x1:20,x2:690,y1:Yw(0),y2:Yw(0),stroke:&quot;var(--ink2)&quot;},wf);
    bars.forEach(function(b,i){var x=30+i*(w+gap),ya=Yw(Math.max(b[1],b[2])),yb=Yw(Math.min(b[1],b[2])),col=b[4]?&quot;var(--ochre)&quot;:(b[3]&gt;=0?&quot;var(--good)&quot;:&quot;var(--bad)&quot;);
      el(&quot;rect&quot;,{x:x,y:ya,width:w,height:Math.max(1.5,yb-ya),fill:col,rx:2,opacity:b[4]?1:.85},wf);
      el(&quot;text&quot;,{x:x+w/2,y:ya-6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:&quot;11&quot;,&quot;font-weight&quot;:&quot;600&quot;},wf,(b[4]?&quot;&quot;:(b[3]&gt;=0?&quot;+&quot;:&quot;&quot;))+(b[4]?fmt(b[3]):(b[3]&lt;0?&quot;−&quot;:&quot;&quot;)+fmt(Math.abs(b[3]))));
      var parts=b[0].split(&quot; &quot;);parts.forEach(function(t,j){el(&quot;text&quot;,{x:x+w/2,y:272+j*13,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;class&quot;:&quot;lbl&quot;},wf,t);});
      if(i&lt;bars.length-1){var nx=x+w,ny=Yw(b[2]);el(&quot;line&quot;,{x1:nx,x2:nx+gap,y1:ny,y2:ny,stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;2 2&quot;},wf);}
    });
    document.getElementById(&quot;labCheck&quot;).innerHTML=&quot;Controllo: planning NOI &quot;+fmt(P.noi)+&quot; + activity &quot;+vr(F.noi-P.noi,false).t+&quot; + revenue &amp;amp; spending &quot;+vr(A.noi-F.noi,false).t+&quot; = actual NOI &quot;+fmt(A.noi)+&quot;. Totale scostamento: &lt;b&gt;&quot;+vr(A.noi-P.noi,false).t+&quot;&lt;/b&gt;.&quot;;
  };
  ps.addEventListener(&quot;input&quot;,draw);as.addEventListener(&quot;input&quot;,draw);
  document.getElementById(&quot;labReset&quot;).addEventListener(&quot;click&quot;,function(){ps.value=30;as.value=35;draw();});
  draw();
}
})();
&lt;/script&gt;
