    &lt;h1&gt;Flexible budget&lt;br&gt;&lt;span style=&quot;font-style:italic;color:var(--acc)&quot;&gt;the Little Theatre case&lt;/span&gt;&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;A nonprofit children&#x27;s theatre budgeted for 6 productions and 108 performances. It then staged 7 productions, with 168 performances. Costs rose by more than $200,000. Was this a poor result? Answering the question requires a &lt;em&gt;flexible budget&lt;/em&gt;, which separates the effect of &lt;em&gt;volume&lt;/em&gt; from the effect of &lt;em&gt;cost control&lt;/em&gt;.&lt;/p&gt;

&lt;!-- ===== 1. CASE ===== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;caso&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;1 · The case&lt;/span&gt;
  &lt;h2&gt;The Little Theatre: who it is, what it does, what changed&lt;/h2&gt;
  &lt;p&gt;A &lt;em&gt;nonprofit&lt;/em&gt; organization that stages plays for children. Its permanent administrative staff is very small. One detail determines everything else: under an agreement with the union, &lt;b&gt;actors and directors rehearse without pay and are paid only for actual performances&lt;/b&gt;. Their compensation therefore follows the number of &lt;em&gt;performances&lt;/em&gt; (individual showings), not time.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Two units of activity&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;Production&lt;/b&gt;: a new play that is staged (e.g. &lt;i&gt;Peter Rabbit&lt;/i&gt;), with its own scenery, costumes and publicity.&lt;br&gt;
      &lt;b&gt;Performance&lt;/b&gt;: a single showing of that play. &lt;i&gt;Peter Rabbit&lt;/i&gt; = 6 weeks × 3 performances each weekend = &lt;b&gt;18 performances&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Plan vs actual&lt;/h4&gt;
      &lt;svg viewBox=&quot;0 0 300 120&quot; aria-label=&quot;Comparison of plan and actual results&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;22&quot; font-size=&quot;12&quot;&gt;Productions&lt;/text&gt;
        &lt;rect x=&quot;95&quot; y=&quot;10&quot; width=&quot;120&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;23&quot; font-size=&quot;12&quot;&gt;6 plan&lt;/text&gt;
        &lt;rect x=&quot;95&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;43&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;7 actual&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;82&quot; font-size=&quot;12&quot;&gt;Performances&lt;/text&gt;
        &lt;rect x=&quot;95&quot; y=&quot;70&quot; width=&quot;108&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--acc)&quot; opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;83&quot; font-size=&quot;12&quot;&gt;108&lt;/text&gt;
        &lt;rect x=&quot;95&quot; y=&quot;90&quot; width=&quot;168&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;103&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;168&lt;/text&gt;
      &lt;/svg&gt;
      &lt;p class=&quot;note&quot;&gt;The board authorized the expansion &lt;i&gt;after&lt;/i&gt; the start of the year. Revenues (grants and ticket sales) grew correspondingly, but the exercise does not report them.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The data from the slides&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;t-plan&quot;&gt;Planning budget&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;t-act&quot;&gt;Actual costs&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;t-req&quot;&gt;Requirements&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;t-plan&quot; role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;tbl&quot; style=&quot;border:none;margin:0&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Costs from the Planning Budget&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;

      &lt;tr&gt;&lt;td&gt;Actors and directors wages&lt;/td&gt;&lt;td&gt;$216,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stagehands wages&lt;/td&gt;&lt;td&gt;32,400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ticket booth personnel and ushers wages&lt;/td&gt;&lt;td&gt;16,200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scenery, costumes, and props&lt;/td&gt;&lt;td&gt;108,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Theater hall rent&lt;/td&gt;&lt;td&gt;54,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Printed programs&lt;/td&gt;&lt;td&gt;27,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Publicity&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Administrative expenses&lt;/td&gt;&lt;td&gt;43,200&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
      &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;$508,800&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Actual number of productions&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Actual number of performances&lt;/td&gt;&lt;td&gt;168&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Actors and directors wages&lt;/td&gt;&lt;td&gt;$341,800&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Stagehands wages&lt;/td&gt;&lt;td&gt;49,700&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ticket booth personnel and ushers wages&lt;/td&gt;&lt;td&gt;25,900&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scenery, costumes, and props&lt;/td&gt;&lt;td&gt;130,600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Theater hall rent&lt;/td&gt;&lt;td&gt;78,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Printed programs&lt;/td&gt;&lt;td&gt;38,300&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Publicity&lt;/td&gt;&lt;td&gt;15,100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Administrative expenses&lt;/td&gt;&lt;td&gt;47,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
      &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;$726,900&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;t-req&quot; role=&quot;tabpanel&quot; hidden&gt;
    &lt;ol&gt;&lt;li&gt;&lt;b&gt;Prepare a flexible budget performance report&lt;/b&gt;: prepare a report showing both the &lt;i&gt;spending variances&lt;/i&gt; and the &lt;i&gt;activity variances&lt;/i&gt; → &lt;a href=&quot;#report&quot;&gt;section 6&lt;/a&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Should the board be satisfied with how well costs were controlled?&lt;/b&gt; Why or why not → &lt;a href=&quot;#valuta&quot;&gt;section 7&lt;/a&gt;.&lt;/li&gt;&lt;/ol&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The trap.&lt;/b&gt; Comparing actual and planning directly: $726,900 − $508,800 = &lt;b&gt;$218,100 more&lt;/b&gt; (+43%). It looks like a disaster, but the comparison mixes two different things: &lt;i&gt;we did more&lt;/i&gt; (a board decision) and &lt;i&gt;we spent well or badly for what we did&lt;/i&gt; (control). The whole exercise is about separating them.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · The case&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does it matter that actors rehearse without pay?&lt;/summary&gt;&lt;div&gt;Because their compensation then depends only on the number of &lt;i&gt;performances&lt;/i&gt;. The cost becomes &lt;b&gt;variable with respect to performances&lt;/b&gt;, which makes it possible to predict with a formula how much a year with more performances will cost.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How many performances per production on average in the plan? And in the actual results?&lt;/summary&gt;&lt;div&gt;Plan: 108 / 6 = &lt;b&gt;18&lt;/b&gt;. Actual: 168 / 7 = &lt;b&gt;24&lt;/b&gt;. Runs became longer on average: performances grew (+56%) much more than productions (+17%).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Do revenues appear in the exercise?&lt;/summary&gt;&lt;div&gt;No. The text says that grants and ticket sales grew “correspondingly” but does not report them. The report therefore covers costs only.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 2. DRIVER ===== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;driver&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;2 · Cost behavior&lt;/span&gt;
  &lt;h2&gt;What makes each cost move: cost drivers&lt;/h2&gt;
  &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt; (measure of activity) is the quantity whose increase causes a cost to rise. Introductory textbooks use a single driver, volume (units produced). Here there are &lt;b&gt;two&lt;/b&gt;, and this is the key point of the exercise: a flexible budget with &lt;em class=&quot;t&quot;&gt;multiple cost drivers&lt;/em&gt; (several measures of activity).&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 900 230&quot; aria-label=&quot;Three cost behaviors&quot;&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;g transform=&quot;translate(20,20)&quot;&gt;
        &lt;rect width=&quot;270&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;
        &lt;text x=&quot;16&quot; y=&quot;24&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;15&quot;&gt;Fixed&lt;/text&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;160&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;40&quot; y2=&quot;40&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;100&quot; x2=&quot;250&quot; y2=&quot;100&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;145&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;any level of activity&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;94&quot; font-size=&quot;11&quot;&gt;75% admin = $32,400&lt;/text&gt;
      &lt;/g&gt;
      &lt;g transform=&quot;translate(315,20)&quot;&gt;
        &lt;rect width=&quot;270&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;
        &lt;text x=&quot;16&quot; y=&quot;24&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;15&quot;&gt;Variable per production&lt;/text&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;160&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;40&quot; y2=&quot;40&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;path d=&quot;M40,160 h30 v-15 h30 v-15 h30 v-15 h30 v-15 h30 v-15 h30 v-15&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;145&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;no. of productions (1, 2, 3 …)&lt;/text&gt;&lt;text x=&quot;48&quot; y=&quot;60&quot; font-size=&quot;11&quot;&gt;scenery, publicity…&lt;/text&gt;
      &lt;/g&gt;
      &lt;g transform=&quot;translate(610,20)&quot;&gt;
        &lt;rect width=&quot;270&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;
        &lt;text x=&quot;16&quot; y=&quot;24&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;15&quot;&gt;Variable per performance&lt;/text&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;160&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;40&quot; y2=&quot;40&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;55&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;145&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;no. of performances&lt;/text&gt;&lt;text x=&quot;48&quot; y=&quot;60&quot; font-size=&quot;11&quot;&gt;wages, rent, programs…&lt;/text&gt;
      &lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Per &lt;i&gt;production&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Scenery, costumes, props · Publicity. &lt;i&gt;“It doesn&#x27;t make any difference how many times Peter Rabbit is performed; the cost of the scenery is the same.”&lt;/i&gt; The same applies to posters and radio spots, whether there are 10, 20 or 30 performances.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Per &lt;i&gt;performance&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Actors &amp;amp; directors · Stagehands · Ticket booth &amp;amp; ushers · Theater hall rent · Printed programs. More performances, more costs.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mixed: &lt;i&gt;Administrative&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Best estimate: &lt;b&gt;75% fixed&lt;/b&gt;, &lt;b&gt;15%&lt;/b&gt; per production, &lt;b&gt;10%&lt;/b&gt; per performance. It is a &lt;em class=&quot;t&quot;&gt;mixed cost&lt;/em&gt;, i.e. one with a fixed and a variable component, here split using a judgmental estimate.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The link with the cost hierarchy&lt;/h3&gt;
  &lt;p&gt;The two drivers correspond to the levels of the &lt;em class=&quot;t&quot;&gt;cost hierarchy&lt;/em&gt; used in &lt;em class=&quot;t&quot;&gt;activity-based costing&lt;/em&gt; (ABC). Each cost is linked to the level of activity that actually generates it. Productions resemble &lt;i&gt;batch/product-level&lt;/i&gt; costs, performances resemble &lt;i&gt;unit-level&lt;/i&gt; costs. The fixed part of administration is &lt;i&gt;facility-level&lt;/i&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;note&quot;&gt;see Cooper &amp;amp; Kaplan in &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 900 200&quot; aria-label=&quot;Cost hierarchy applied to the theatre&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;polygon points=&quot;300,180 600,180 540,130 360,130&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
      &lt;polygon points=&quot;360,128 540,128 490,80 410,80&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;polygon points=&quot;410,78 490,78 450,30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.7&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Performance&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Production&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;Fixed&lt;/text&gt;
      &lt;text x=&quot;612&quot; y=&quot;152&quot;&gt;unit-level → $/performance&lt;/text&gt;&lt;text x=&quot;612&quot; y=&quot;168&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;wages, rent, programs, 10% admin&lt;/text&gt;
      &lt;text x=&quot;556&quot; y=&quot;102&quot;&gt;product/batch-level → $/play&lt;/text&gt;&lt;text x=&quot;556&quot; y=&quot;118&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;scenery, publicity, 15% admin&lt;/text&gt;
      &lt;text x=&quot;500&quot; y=&quot;52&quot;&gt;facility-level → 75% admin&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;110&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;A cost “flexes” only&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;128&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;with ITS OWN driver&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Try it: which driver does it belong to?&lt;/b&gt; &lt;span class=&quot;note&quot;&gt;Click to find out.&lt;/span&gt;
    &lt;div class=&quot;grid3&quot; style=&quot;margin-top:10px&quot;&gt;
      &lt;details&gt;&lt;summary&gt;Stagehands wages&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;: stagehands work at every performance.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Publicity&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;production&lt;/b&gt;: one campaign per play, regardless of the number of performances.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Printed programs&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;: programs are printed for every performance (for the audience in the hall).&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Theater hall rent&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;, according to the text: the hall is rented for each performance. (We will see that the actual figure raises doubts.)&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Costumes&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;production&lt;/b&gt;, together with scenery and props.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Administrative director&#x27;s salary&lt;/summary&gt;&lt;div&gt;Probably in the &lt;b&gt;fixed&lt;/b&gt; portion (75%) of administrative expenses.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Cost drivers&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why would a single driver (e.g. performances only) produce a wrong flexible budget?&lt;/summary&gt;&lt;div&gt;Because scenery and publicity would be “flexed” in proportion to performances (+56%) instead of plays (+17%). The flexible budget would overstate these costs and hide any real overruns.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is a mixed cost? How does the exercise treat it?&lt;/summary&gt;&lt;div&gt;A cost with a fixed and a variable component. Administrative expenses are split using estimated percentages (75/15/10), and each portion is treated with its own driver.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 3. FORMULAS ===== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;formule&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;3 · Cost formulas&lt;/span&gt;
  &lt;h2&gt;From the planning budget to cost formulas&lt;/h2&gt;
  &lt;p&gt;The planning budget was prepared for 6 productions and 108 performances. Dividing each cost by its driver gives the &lt;em class=&quot;t&quot;&gt;cost per unit of activity&lt;/em&gt;. This ratio is assumed to remain constant within the &lt;em class=&quot;t&quot;&gt;relevant range&lt;/em&gt;, i.e. the range of activity within which the assumed cost behavior holds.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Cost = a + b₁ × productions + b₂ × performances&lt;small&gt;a = fixed component · b₁ = cost per production · b₂ = cost per performance&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; id=&quot;st1&quot;&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;Step 1 · Costs per performance (÷ 108)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;÷&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Actors and directors wages&lt;/td&gt;&lt;td&gt;$216,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$2,000&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Stagehands wages&lt;/td&gt;&lt;td&gt;32,400&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$300&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ticket booth &amp;amp; ushers&lt;/td&gt;&lt;td&gt;16,200&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$150&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Theater hall rent&lt;/td&gt;&lt;td&gt;54,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$500&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Printed programs&lt;/td&gt;&lt;td&gt;27,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$250&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · Costs per production (÷ 6)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;÷&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Scenery, costumes, and props&lt;/td&gt;&lt;td&gt;$108,000&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;$18,000&lt;/b&gt; / prod.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Publicity&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;$2,000&lt;/b&gt; / prod.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Splitting administrative expenses ($43,200)&lt;/h4&gt;
      &lt;svg viewBox=&quot;0 0 800 110&quot; aria-label=&quot;Breakdown of administrative expenses&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;570&quot; height=&quot;40&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.75&quot;/&gt;&lt;rect x=&quot;590&quot; y=&quot;20&quot; width=&quot;114&quot; height=&quot;40&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;704&quot; y=&quot;20&quot; width=&quot;76&quot; height=&quot;40&quot; fill=&quot;var(--acc)&quot;/&gt;
        &lt;text x=&quot;305&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; fill=&quot;white&quot; font-weight=&quot;600&quot; style=&quot;fill:#fff&quot;&gt;75% fixed = $32,400&lt;/text&gt;
        &lt;text x=&quot;647&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:#fff&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;742&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:#fff&quot;&gt;10%&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;82&quot; font-size=&quot;12&quot;&gt;$6,480 ÷ 6 = $1,080/prod.&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;100&quot; font-size=&quot;12&quot;&gt;$4,320 ÷ 108 = $40/perf.&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;formula&quot;&gt;Admin = $32,400 + $1,080 × q + $40 × p&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Check&lt;/h4&gt;&lt;p&gt;With q = 6 and p = 108, the formulas must return exactly the planning budget:&lt;/p&gt;
      &lt;p&gt;Wages etc.: (2,000 + 300 + 150 + 500 + 250) × 108 = 3,200 × 108 = $345,600&lt;br&gt;Per production: (18,000 + 2,000) × 6 = $120,000&lt;br&gt;Admin: 32,400 + 6,480 + 4,320 = $43,200&lt;br&gt;&lt;b&gt;Total = 345,600 + 120,000 + 43,200 = $508,800 ✓&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The complete cost model of the theatre.&lt;/b&gt;&lt;br&gt;Total cost = &lt;b&gt;$32,400&lt;/b&gt; + &lt;b&gt;$21,080&lt;/b&gt; × productions + &lt;b&gt;$3,240&lt;/b&gt; × performances&lt;br&gt;&lt;span class=&quot;note&quot;&gt;($21,080 = 18,000 + 2,000 + 1,080; $3,240 = 2,000 + 300 + 150 + 500 + 250 + 40)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Cost formulas&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;How much does one additional performance of a play already in the program cost?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;$3,240&lt;/b&gt;: only the per-performance costs (including the $40 of admin). Scenery and publicity do not change.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;And a new play with 20 performances?&lt;/summary&gt;&lt;div&gt;$21,080 + 20 × $3,240 = $21,080 + $64,800 = &lt;b&gt;$85,880&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which assumption makes these formulas valid?&lt;/summary&gt;&lt;div&gt;Constant unit costs within the relevant range (linearity) and correct identification of the driver. If, for instance, the hall rent carries volume discounts, the “$500 per performance” formula no longer holds.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 4. FLEX ===== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;flex&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;4 · Planning vs flexible&lt;/span&gt;
  &lt;h2&gt;Planning budget and flexible budget&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning (static) budget&lt;/b&gt;&lt;br&gt;Prepared &lt;i&gt;before&lt;/i&gt; the period, for a single expected level of activity (6 · 108). It is suitable for planning, but comparing it with actual results is misleading if activity changes.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt;&lt;br&gt;Cost (and revenue) estimates adjusted to the &lt;i&gt;actual&lt;/i&gt; level of activity (7 · 168), using the same cost formulas. It asks: “given what we actually did, how much &lt;i&gt;should&lt;/i&gt; we have spent?”&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The flexible budget is prepared &lt;b&gt;at the end of the period&lt;/b&gt;, once actual activity is known. It is not a new plan: it is an appropriate benchmark.&lt;/p&gt;

  &lt;h3&gt;Interactive flexible budget&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Move the sliders: the budget is recalculated using the formulas from section 3. Starting values = actual activity (7 · 168).&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;q&quot;&gt;Productions&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;3&quot; max=&quot;12&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;qo&quot;&gt;7&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;p&quot;&gt;Performances&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;p&quot; min=&quot;40&quot; max=&quot;300&quot; step=&quot;2&quot; value=&quot;168&quot;&gt;&lt;output id=&quot;po&quot;&gt;168&lt;/output&gt;&lt;/div&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin:12px 0&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;Flexible budget&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;ftot&quot;&gt;$724,280&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;vs planning $508,800&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;fdiff&quot; style=&quot;font-size:1.4rem&quot;&gt;+$215,480&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;Average performances / production&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;favg&quot; style=&quot;font-size:1.4rem&quot;&gt;24.0&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;fchart&quot; viewBox=&quot;0 0 860 300&quot; aria-label=&quot;Chart of flexible vs planning budget by line item&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span style=&quot;display:inline-block;width:12px;height:12px;background:var(--rule);vertical-align:middle&quot;&gt;&lt;/span&gt; planning · &lt;span style=&quot;display:inline-block;width:12px;height:12px;background:var(--brick);vertical-align:middle&quot;&gt;&lt;/span&gt; flexible at the selected level&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Flexible budget&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does the flexible budget not “reward” those who carry out more activity?&lt;/summary&gt;&lt;div&gt;Because it raises cost expectations in proportion to activity. Spending more to do more is no longer flagged as an overrun; only the amount spent in excess of &lt;i&gt;what that activity should have cost&lt;/i&gt; is still flagged.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If the theatre had staged 6 productions and 108 performances, would the flexible and planning budgets coincide?&lt;/summary&gt;&lt;div&gt;Yes: same formulas, same level of activity, hence no activity variance.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 5. VARIANCES ===== --&gt;
&lt;section class=&quot;part acc&quot; id=&quot;varianze&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;5 · Variances&lt;/span&gt;
  &lt;h2&gt;Activity variance and spending variance&lt;/h2&gt;
  &lt;p&gt;The flexible budget is placed &lt;b&gt;in between&lt;/b&gt; the planning budget and actual results. The total difference thus splits into two parts with different meanings.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity variance&lt;/b&gt;&lt;br&gt;= Flexible budget − Planning budget&lt;br&gt;It depends &lt;i&gt;only&lt;/i&gt; on the difference between actual and planned activity. For costs, more activity yields a &lt;b&gt;U&lt;/b&gt; variance. Here it reflects a board decision, not inefficiency.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Spending variance&lt;/b&gt;&lt;br&gt;= Actual − Flexible budget&lt;br&gt;It shows how much more or less was spent than the activity actually carried out &lt;i&gt;should&lt;/i&gt; have cost. It is the measure of cost control.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;F / U convention&lt;/b&gt;: for a cost, &lt;span class=&quot;F&quot;&gt;F = Favorable&lt;/span&gt; when the cost is &lt;i&gt;lower&lt;/i&gt; than the benchmark, &lt;span class=&quot;U&quot;&gt;U = Unfavorable&lt;/span&gt; when it is higher. For revenues the opposite applies.&lt;/p&gt;

  &lt;h3&gt;From planning to actual: the bridge&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 860 340&quot; aria-label=&quot;Waterfall chart of the variances&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;300&quot; x2=&quot;840&quot; y2=&quot;300&quot; stroke=&quot;var(--ink2)&quot;/&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;rect x=&quot;90&quot; y=&quot;126&quot; width=&quot;120&quot; height=&quot;174&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$508,800&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Planning&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;52&quot; width=&quot;120&quot; height=&quot;74&quot; fill=&quot;var(--brick)&quot; opacity=&quot;.8&quot;/&gt;&lt;line x1=&quot;210&quot; y1=&quot;126&quot; x2=&quot;260&quot; y2=&quot;126&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;U&quot;&gt;+$215,480 U&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Activity var.&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;52&quot; width=&quot;120&quot; height=&quot;248&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.8&quot;/&gt;&lt;line x1=&quot;380&quot; y1=&quot;52&quot; x2=&quot;430&quot; y2=&quot;52&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$724,280&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Flexible&lt;/text&gt;
      &lt;rect x=&quot;600&quot; y=&quot;49&quot; width=&quot;120&quot; height=&quot;3&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;line x1=&quot;550&quot; y1=&quot;52&quot; x2=&quot;600&quot; y2=&quot;52&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;660&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;U&quot;&gt;+$2,620 U&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Spending var.&lt;/text&gt;
      &lt;rect x=&quot;770&quot; y=&quot;51&quot; width=&quot;60&quot; height=&quot;249&quot; fill=&quot;var(--ink)&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$726,900&lt;/text&gt;&lt;text x=&quot;800&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Actual&lt;/text&gt;
      &lt;text x=&quot;660&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;almost invisible:&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;0.4% of flexible&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;div class=&quot;formula&quot;&gt;Actual − Planning = (Flexible − Planning) + (Actual − Flexible)&lt;br&gt;$218,100 U = $215,480 U + $2,620 U&lt;/div&gt;
  &lt;p&gt;98.8% of the cost increase is explained by the volume decided by the board. Only $2,620 is “spending outside the formula”.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;v-a&quot;&gt;Example: actors&#x27; wages&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;v-b&quot;&gt;Example: hall rent&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;v-c&quot;&gt;Example: admin&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-a&quot;&gt;&lt;p&gt;Planning $216,000 → Flexible $2,000 × 168 = &lt;b&gt;$336,000&lt;/b&gt; → Actual $341,800.&lt;br&gt;Activity = 336,000 − 216,000 = &lt;span class=&quot;U&quot;&gt;$120,000 U&lt;/span&gt; (60 additional performances × $2,000).&lt;br&gt;Spending = 341,800 − 336,000 = &lt;span class=&quot;U&quot;&gt;$5,800 U&lt;/span&gt; (about $34.5 more per performance).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-b&quot; hidden&gt;&lt;p&gt;Planning $54,000 → Flexible $500 × 168 = &lt;b&gt;$84,000&lt;/b&gt; → Actual $78,000.&lt;br&gt;Activity = &lt;span class=&quot;U&quot;&gt;$30,000 U&lt;/span&gt;; Spending = 78,000 − 84,000 = &lt;span class=&quot;F&quot;&gt;$6,000 F&lt;/span&gt;.&lt;br&gt;Actual cost per performance: 78,000 / 168 ≈ $464 instead of $500.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-c&quot; hidden&gt;&lt;p&gt;Flexible = 32,400 + 1,080 × 7 + 40 × 168 = 32,400 + 7,560 + 6,720 = &lt;b&gt;$46,680&lt;/b&gt;.&lt;br&gt;Activity = 46,680 − 43,200 = &lt;span class=&quot;U&quot;&gt;$3,480 U&lt;/span&gt;; Spending = 47,500 − 46,680 = &lt;span class=&quot;U&quot;&gt;$820 U&lt;/span&gt;.&lt;br&gt;Note: the fixed component generates no activity variance.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Variances&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Is an unfavorable activity variance on costs someone&#x27;s “fault”?&lt;/summary&gt;&lt;div&gt;Not necessarily. It measures the volume effect. Here volume increased by decision of the board, with revenues growing: it is an expected consequence, not a control problem.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is a favorable spending variance always good news?&lt;/summary&gt;&lt;div&gt;No. It might stem from cuts in quality (fewer printed programs, fewer front-of-house staff) or from a poorly estimated cost formula. It needs to be understood, not just applauded.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Compute the spending variance for publicity.&lt;/summary&gt;&lt;div&gt;Flexible = $2,000 × 7 = $14,000; actual $15,100 → &lt;span class=&quot;U&quot;&gt;$1,100 U&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 6. REPORT ===== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;report&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;6 · Requirement 1&lt;/span&gt;
  &lt;h2&gt;Flexible budget performance report&lt;/h2&gt;
  &lt;p&gt;Standard 5-column layout: &lt;b&gt;Actual&lt;/b&gt; · spending variance · &lt;b&gt;Flexible&lt;/b&gt; · activity variance · &lt;b&gt;Planning&lt;/b&gt;. Each variance sits between the two columns it compares. &lt;span class=&quot;note&quot;&gt;Click a row for commentary.&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;rep&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;The Little Theatre&lt;br&gt;Year ended Dec. 31&lt;/th&gt;&lt;th&gt;Actual&lt;br&gt;Results&lt;/th&gt;&lt;th&gt;Spending&lt;br&gt;Variances&lt;/th&gt;&lt;th&gt;Flexible&lt;br&gt;Budget&lt;/th&gt;&lt;th&gt;Activity&lt;br&gt;Variances&lt;/th&gt;&lt;th&gt;Planning&lt;br&gt;Budget&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Productions&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Performances&lt;/td&gt;&lt;td&gt;168&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;168&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
    &lt;tbody id=&quot;repbody&quot;&gt;&lt;/tbody&gt;
    &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;$726,900&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$2,620 U&lt;/td&gt;&lt;td&gt;$724,280&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$215,480 U&lt;/td&gt;&lt;td&gt;$508,800&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot; id=&quot;repnote&quot; style=&quot;min-height:80px&quot;&gt;&lt;span class=&quot;note&quot;&gt;Select a line item in the report to see the formula, the calculation and possible causes.&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Report&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Sum of the U and F spending variances?&lt;/summary&gt;&lt;div&gt;U: 5,800 + 700 + 4,600 + 1,100 + 820 = $13,020. F: 700 + 6,000 + 3,700 = $10,400. Net = &lt;b&gt;$2,620 U&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which line item has the largest spending variance in absolute value?&lt;/summary&gt;&lt;div&gt;Theater hall rent: &lt;span class=&quot;F&quot;&gt;$6,000 F&lt;/span&gt;. It is followed by actors and directors wages (&lt;span class=&quot;U&quot;&gt;$5,800 U&lt;/span&gt;) and scenery (&lt;span class=&quot;U&quot;&gt;$4,600 U&lt;/span&gt;).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 7. EVALUATION ===== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;valuta&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;7 · Requirement 2&lt;/span&gt;
  &lt;h2&gt;Should the board be satisfied?&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Short answer: on the whole, yes.&lt;/b&gt; Costs rose by $218,100, but $215,480 is explained by the expansion decided by the board itself. The net spending variance is only &lt;b&gt;$2,620 U, 0.36% of the flexible budget&lt;/b&gt;. The total, however, hides offsetting variances across line items, and that is where attention should go (&lt;em class=&quot;t&quot;&gt;management by exception&lt;/em&gt;: focusing attention on significant variances).&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Reasons to be satisfied&lt;/h3&gt;
      &lt;details open&gt;&lt;summary&gt;The appropriate comparison is with the flexible budget&lt;/summary&gt;&lt;div&gt;Saying “we spent 43% more” confuses volume with control. At the actual level of activity, costs are almost exactly those predicted by the formulas.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;The growth was intended and funded&lt;/summary&gt;&lt;div&gt;Grants and ticket sales grew “correspondingly”. The activity variance is the expected price of a richer program.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;What to investigate&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Actors and directors wages: $5,800 U&lt;/summary&gt;&lt;div&gt;Possible causes: higher pay rates, a play with a larger cast. The formula uses an average ($2,000/performance), but the cost per performance depends on the cast of each production. With 7 different plays, the planned average may no longer hold.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Scenery, costumes and props: $4,600 U&lt;/summary&gt;&lt;div&gt;The seventh play may have cost more than the $18,000 average (a more complex staging). Here too the problem may lie in the use of an average.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Hall rent $6,000 F and programs $3,700 F&lt;/summary&gt;&lt;div&gt;Possibly volume discounts (a longer-term lease, larger print runs). In that case these costs are not purely variable, and the formula should be revised. Alternatively, savings came from reduced service (fewer printed programs). Favorable variances must be explained just like unfavorable ones.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Offsetting variances hide information&lt;/summary&gt;&lt;div&gt;$13,020 of U variances are offset by $10,400 of F variances. A small total does not guarantee that each manager controlled their own costs well.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Limitation of the report.&lt;/b&gt; It shows costs only. A proper assessment of the expansion would require the full picture including revenues (grants, tickets) and their revenue variance. In a nonprofit, it also matters whether the mission (more plays for children) was served efficiently.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Evaluation&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is it wrong to conclude “costs out of control” from the actual/planning comparison?&lt;/summary&gt;&lt;div&gt;Because the planning budget refers to 6 · 108, while actual activity was 7 · 168. It compares costs of different activity levels: the volume effect obscures the assessment of control.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What improvement would you make to the cost formulas for next year?&lt;/summary&gt;&lt;div&gt;For example: estimate per-play costs based on cast and staging rather than using an average; check whether rent and programs have fixed components or volume discounts; revise the 75/15/10 split of admin using historical data.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 8. CONNECTIONS ===== --&gt;

  &lt;svg viewBox=&quot;0 0 860 120&quot; aria-label=&quot;Typical sequence of budgeting topics&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Before: master / planning budget&lt;/h4&gt;&lt;p&gt;The theatre&#x27;s planning budget is the “cost” component of an annual master budget, prepared for a single level of activity.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;After: standard costing&lt;/h4&gt;&lt;p&gt;A spending variance can be decomposed further: into a &lt;i&gt;price variance&lt;/i&gt; (more was paid per unit of input) and a &lt;i&gt;quantity variance&lt;/i&gt; (more input was used). For actors&#x27; wages: a higher pay rate or more actors per performance?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Alongside: ABC&lt;/h4&gt;&lt;p&gt;Multiple drivers (productions/performances) apply the logic of activity-based costing to budgeting.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== FURTHER READING ===== --&gt;
&lt;section class=&quot;part acc refs&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;slide&quot;&gt;from the slides&lt;/span&gt;The two pages &lt;b&gt;cite no authors, textbooks, standards or websites&lt;/b&gt;: they contain only the exercise text and data. The references below come from web searches for standard texts on these topics. They are all &lt;b&gt;external sources&lt;/b&gt; and do not come from the slides.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Garrison, Noreen, Brewer, &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;Standard managerial accounting textbook. The chapter “Flexible Budgets and Performance Analysis” (ch. 9 in recent editions, ch. 10 in some older ones) uses the same terminology as the exercise: planning budget, flexible budget, activity and spending variances, reports with multiple cost drivers. The format of the tables suggests the exercise comes from this or a similar text, but &lt;b&gt;the attribution is not confirmed&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book page on mheducation.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Kaplan &amp;amp; Cooper, “Profit Priorities from Activity-Based Costing”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, May–June 1991&lt;/h4&gt;
      &lt;p&gt;Classic article on activity-based cost management. It proposes keeping costs related to individual units separate from batch-level, product-sustaining and facility-sustaining costs. It is the same logic by which, at the theatre, some costs follow performances and others follow productions.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://store.hbr.org/product/profit-priorities-from-activity-based-costing-hbr-onpoint-enhanced-edition/3588&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBR Store page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Cost hierarchy (Cooper &amp;amp; Kaplan): summary on MAAW&lt;/h4&gt;
      &lt;p&gt;The Management And Accounting Web site summarizes a study by Ittner, Larcker and Randall (1997) and the four-level hierarchy (unit, batch, product-sustaining, facility-sustaining) according to which costs vary with activities at different levels. It helps explain why a flexible budget with a single driver is not enough.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumIttnerLarckerRandall97.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;maaw.info: article summary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Definition of flexible budget (CIMA, AccountingTools)&lt;/h4&gt;
      &lt;p&gt;The CIMA &lt;i&gt;Official Terminology&lt;/i&gt;, as reported by secondary sources (I have not verified the original text), defines a flexible budget as a budget which, by recognizing the difference between fixed, semi-variable and variable costs, is designed to change in relation to the level of activity attained. AccountingTools provides an introductory explanation including the comparison with the static budget.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.accountingtools.com/articles/what-is-a-flexible-budget.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AccountingTools: “What is a flexible budget?”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;
