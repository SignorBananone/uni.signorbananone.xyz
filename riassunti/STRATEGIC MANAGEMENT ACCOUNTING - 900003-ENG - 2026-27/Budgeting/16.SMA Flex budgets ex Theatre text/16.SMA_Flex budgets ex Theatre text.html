&lt;!-- ===== 1. CASO ===== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;caso&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;1 · Il caso&lt;/span&gt;
  &lt;h2&gt;The Little Theatre: chi è, cosa fa, cosa è cambiato&lt;/h2&gt;
  &lt;p&gt;Organizzazione &lt;em&gt;nonprofit&lt;/em&gt; che mette in scena spettacoli per bambini. Lo staff amministrativo fisso è piccolissimo. Un dettaglio decide tutto il resto: grazie a un accordo con il sindacato, &lt;b&gt;attori e registi provano gratis e sono pagati solo per le repliche effettive&lt;/b&gt;. Quindi i loro compensi seguono il numero di &lt;em&gt;performances&lt;/em&gt; (le singole repliche), non il tempo.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Due unità di attività&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;Production&lt;/b&gt;: un titolo nuovo messo in scena (es. &lt;i&gt;Peter Rabbit&lt;/i&gt;), con scenografia, costumi e pubblicità propri.&lt;br&gt;
      &lt;b&gt;Performance&lt;/b&gt;: una singola replica di quel titolo. &lt;i&gt;Peter Rabbit&lt;/i&gt; = 6 settimane × 3 repliche ogni weekend = &lt;b&gt;18 performances&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Piano vs realtà&lt;/h4&gt;
      &lt;svg viewBox=&quot;0 0 300 120&quot; aria-label=&quot;Confronto piano e consuntivo&quot;&gt;

        &lt;rect x=&quot;95&quot; y=&quot;70&quot; width=&quot;108&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--acc)&quot; opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;83&quot; font-size=&quot;12&quot;&gt;108&lt;/text&gt;
        &lt;rect x=&quot;95&quot; y=&quot;90&quot; width=&quot;168&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;103&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;168&lt;/text&gt;
      &lt;/svg&gt;
      &lt;p class=&quot;note&quot;&gt;Il board ha autorizzato l&#x27;espansione &lt;i&gt;dopo&lt;/i&gt; l&#x27;inizio dell&#x27;anno. Le entrate (donazioni e biglietti) sono cresciute di conseguenza, ma l&#x27;esercizio non le riporta.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;I dati delle slide&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;

  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;t-plan&quot; role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;tbl&quot; style=&quot;border:none;margin:0&quot;&gt;&lt;table&gt;

  &lt;div class=&quot;tabpanel&quot; id=&quot;t-req&quot; role=&quot;tabpanel&quot; hidden&gt;
    &lt;ol&gt;&lt;li&gt;&lt;b&gt;Prepare a flexible budget performance report&lt;/b&gt;: preparare un report che mostri sia le &lt;i&gt;spending variances&lt;/i&gt; sia le &lt;i&gt;activity variances&lt;/i&gt; → &lt;a href=&quot;#report&quot;&gt;sezione 6&lt;/a&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Il board dovrebbe essere soddisfatto di come sono stati controllati i costi?&lt;/b&gt; Perché sì o perché no → &lt;a href=&quot;#valuta&quot;&gt;sezione 7&lt;/a&gt;.&lt;/li&gt;&lt;/ol&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;La trappola.&lt;/b&gt; Confrontando direttamente actual e planning: $726,900 − $508,800 = &lt;b&gt;$218,100 in più&lt;/b&gt; (+43%). Sembra un disastro, ma il confronto mescola due cose diverse: &lt;i&gt;abbiamo fatto di più&lt;/i&gt; (decisione del board) e &lt;i&gt;abbiamo speso bene o male per quello che abbiamo fatto&lt;/i&gt; (controllo). Tutto l&#x27;esercizio serve a separarle.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Il caso&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché è importante che gli attori provino senza paga?&lt;/summary&gt;&lt;div&gt;Perché così i loro compensi dipendono solo dal numero di &lt;i&gt;performances&lt;/i&gt;. Il costo diventa &lt;b&gt;variabile rispetto alle repliche&lt;/b&gt;, e questo permette di prevedere con una formula quanto costerà un anno con più repliche.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quante performances per production in media nel piano? E nel consuntivo?&lt;/summary&gt;&lt;div&gt;Piano: 108 / 6 = &lt;b&gt;18&lt;/b&gt;. Consuntivo: 168 / 7 = &lt;b&gt;24&lt;/b&gt;. Le tournée sono diventate in media più lunghe: le performances sono cresciute (+56%) molto più delle productions (+17%).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le entrate compaiono nell&#x27;esercizio?&lt;/summary&gt;&lt;div&gt;No. Il testo dice che grants e ticket sales sono cresciuti “correspondingly” ma non le riporta. Il report riguarda quindi solo i costi.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 2. DRIVER ===== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;driver&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;2 · Cost behavior&lt;/span&gt;
  &lt;h2&gt;Che cosa fa muovere ogni costo: i cost driver&lt;/h2&gt;
  &lt;p&gt;Un &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt; (misura di attività) è la grandezza il cui aumento fa crescere un costo. Nei manuali di base c&#x27;è un solo driver, il volume (unità prodotte). Qui ce ne sono &lt;b&gt;due&lt;/b&gt;, e questo è il punto chiave dell&#x27;esercizio: un flexible budget con &lt;em class=&quot;t&quot;&gt;multiple cost drivers&lt;/em&gt; (più misure di attività).&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 900 230&quot; aria-label=&quot;Tre comportamenti di costo&quot;&gt;

      &lt;g transform=&quot;translate(20,20)&quot;&gt;

      &lt;/g&gt;

        &lt;text x=&quot;16&quot; y=&quot;24&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;15&quot;&gt;Variabile per production&lt;/text&gt;

      &lt;g transform=&quot;translate(610,20)&quot;&gt;

        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;160&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;40&quot; y2=&quot;40&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;55&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;text x=&quot;145&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;n. performances&lt;/text&gt;&lt;text x=&quot;48&quot; y=&quot;60&quot; font-size=&quot;11&quot;&gt;wages, rent, programs…&lt;/text&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Per &lt;i&gt;production&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Scenery, costumes, props · Publicity. &lt;i&gt;“It doesn&#x27;t make any difference how many times Peter Rabbit is performed; the cost of the scenery is the same.”&lt;/i&gt; Lo stesso vale per manifesti e spot radio, che si tratti di 10, 20 o 30 repliche.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Per &lt;i&gt;performance&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Actors &amp;amp; directors · Stagehands (macchinisti) · Ticket booth &amp;amp; ushers (biglietteria e maschere) · Theater hall rent · Printed programs. Più repliche, più costi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Misto: &lt;i&gt;Administrative&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Stima migliore: &lt;b&gt;75% fixed&lt;/b&gt;, &lt;b&gt;15%&lt;/b&gt; per production, &lt;b&gt;10%&lt;/b&gt; per performance. È un &lt;em class=&quot;t&quot;&gt;mixed cost&lt;/em&gt; (costo misto), cioè con una parte fissa e una variabile, qui scomposto con una stima di giudizio.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il legame con la cost hierarchy&lt;/h3&gt;
  &lt;p&gt;I due driver corrispondono ai livelli della &lt;em class=&quot;t&quot;&gt;cost hierarchy&lt;/em&gt; dell&#x27;&lt;em class=&quot;t&quot;&gt;activity-based costing&lt;/em&gt; (ABC, il calcolo dei costi per attività). Ogni costo si lega al livello di attività che lo genera davvero. Le productions somigliano a costi di &lt;i&gt;batch/product-level&lt;/i&gt;, le performances a costi di &lt;i&gt;unit-level&lt;/i&gt;. La parte fissa dell&#x27;amministrazione è &lt;i&gt;facility-level&lt;/i&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;note&quot;&gt;vedi Cooper &amp;amp; Kaplan in &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;

    &lt;g font-size=&quot;13&quot;&gt;
      &lt;polygon points=&quot;300,180 600,180 540,130 360,130&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
      &lt;polygon points=&quot;360,128 540,128 490,80 410,80&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;polygon points=&quot;410,78 490,78 450,30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.7&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Performance&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Production&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;Fixed&lt;/text&gt;
      &lt;text x=&quot;612&quot; y=&quot;152&quot;&gt;unit-level → $/replica&lt;/text&gt;&lt;text x=&quot;612&quot; y=&quot;168&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;wages, rent, programs, 10% admin&lt;/text&gt;
      &lt;text x=&quot;556&quot; y=&quot;102&quot;&gt;product/batch-level → $/titolo&lt;/text&gt;&lt;text x=&quot;556&quot; y=&quot;118&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;scenery, publicity, 15% admin&lt;/text&gt;
      &lt;text x=&quot;500&quot; y=&quot;52&quot;&gt;facility-level → 75% admin&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;110&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Un costo si “flette” solo&lt;/text&gt;

  &lt;/svg&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Prova tu: a quale driver appartiene?&lt;/b&gt; &lt;span class=&quot;note&quot;&gt;Clicca per scoprire.&lt;/span&gt;
    &lt;div class=&quot;grid3&quot; style=&quot;margin-top:10px&quot;&gt;
      &lt;details&gt;&lt;summary&gt;Stagehands wages&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;: i macchinisti lavorano a ogni replica.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Publicity&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;production&lt;/b&gt;: una campagna per titolo, indipendente dal numero di repliche.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Printed programs&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;: si stampano programmi per ogni replica (per il pubblico in sala).&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Theater hall rent&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;performance&lt;/b&gt;, secondo il testo: si affitta la sala per ogni replica. (Vedremo che il dato reale fa sorgere dubbi.)&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Costumes&lt;/summary&gt;&lt;div&gt;Per &lt;b&gt;production&lt;/b&gt;, insieme a scenery e props.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Salario del direttore amministrativo&lt;/summary&gt;&lt;div&gt;Probabilmente nella quota &lt;b&gt;fixed&lt;/b&gt; (75%) delle administrative expenses.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Cost driver&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché un unico driver (es. solo performances) darebbe un flexible budget sbagliato?&lt;/summary&gt;&lt;div&gt;Perché scenery e publicity verrebbero “flessi” in proporzione alle repliche (+56%) invece che ai titoli (+17%). Il budget flessibile sovrastimerebbe questi costi e nasconderebbe eventuali sforamenti reali.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è un mixed cost? Come lo tratta l&#x27;esercizio?&lt;/summary&gt;&lt;div&gt;Un costo con una componente fissa e una variabile. Le administrative expenses sono divise con percentuali stimate (75/15/10) e ogni quota viene trattata con il suo driver.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 3. FORMULE ===== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;formule&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;3 · Cost formulas&lt;/span&gt;
  &lt;h2&gt;Dal planning budget alle formule di costo&lt;/h2&gt;
  &lt;p&gt;Il planning budget è stato preparato per 6 productions e 108 performances. Dividendo ogni costo per il suo driver si ottiene il &lt;em class=&quot;t&quot;&gt;cost per unit of activity&lt;/em&gt; (costo per unità di attività). Si assume che questo rapporto resti costante entro il &lt;em class=&quot;t&quot;&gt;relevant range&lt;/em&gt;, cioè l&#x27;intervallo di attività in cui il comportamento dei costi resta valido.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Costo = a + b₁ × productions + b₂ × performances&lt;small&gt;a = parte fissa · b₁ = costo per production · b₂ = costo per performance&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; id=&quot;st1&quot;&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;Passo 1 · Costi per performance (÷ 108)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;÷&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Actors and directors wages&lt;/td&gt;&lt;td&gt;$216,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$2,000&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Stagehands wages&lt;/td&gt;&lt;td&gt;32,400&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$300&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ticket booth &amp;amp; ushers&lt;/td&gt;&lt;td&gt;16,200&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$150&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Theater hall rent&lt;/td&gt;&lt;td&gt;54,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$500&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Printed programs&lt;/td&gt;&lt;td&gt;27,000&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;&lt;b&gt;$250&lt;/b&gt; / perf.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · Costi per production (÷ 6)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;Planning&lt;/th&gt;&lt;th&gt;÷&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Scenery, costumes, and props&lt;/td&gt;&lt;td&gt;$108,000&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;$18,000&lt;/b&gt; / prod.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Publicity&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;$2,000&lt;/b&gt; / prod.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Scomporre le administrative expenses ($43,200)&lt;/h4&gt;
      &lt;svg viewBox=&quot;0 0 800 110&quot; aria-label=&quot;Scomposizione admin&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;570&quot; height=&quot;40&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.75&quot;/&gt;&lt;rect x=&quot;590&quot; y=&quot;20&quot; width=&quot;114&quot; height=&quot;40&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;704&quot; y=&quot;20&quot; width=&quot;76&quot; height=&quot;40&quot; fill=&quot;var(--acc)&quot;/&gt;
        &lt;text x=&quot;305&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; fill=&quot;white&quot; font-weight=&quot;600&quot; style=&quot;fill:#fff&quot;&gt;75% fixed = $32,400&lt;/text&gt;
        &lt;text x=&quot;647&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:#fff&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;742&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:#fff&quot;&gt;10%&lt;/text&gt;
        &lt;text x=&quot;590&quot; y=&quot;82&quot; font-size=&quot;12&quot;&gt;$6,480 ÷ 6 = $1,080/prod.&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;100&quot; font-size=&quot;12&quot;&gt;$4,320 ÷ 108 = $40/perf.&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;formula&quot;&gt;Admin = $32,400 + $1,080 × q + $40 × p&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Verifica&lt;/h4&gt;&lt;p&gt;Con q = 6 e p = 108 le formule devono restituire esattamente il planning budget:&lt;/p&gt;
      &lt;p&gt;Wages etc.: (2,000 + 300 + 150 + 500 + 250) × 108 = 3,200 × 108 = $345,600&lt;br&gt;Per production: (18,000 + 2,000) × 6 = $120,000&lt;br&gt;Admin: 32,400 + 6,480 + 4,320 = $43,200&lt;br&gt;&lt;b&gt;Totale = 345,600 + 120,000 + 43,200 = $508,800 ✓&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il modello completo del teatro.&lt;/b&gt;&lt;br&gt;Costo totale = &lt;b&gt;$32,400&lt;/b&gt; + &lt;b&gt;$21,080&lt;/b&gt; × productions + &lt;b&gt;$3,240&lt;/b&gt; × performances&lt;br&gt;&lt;span class=&quot;note&quot;&gt;($21,080 = 18,000 + 2,000 + 1,080; $3,240 = 2,000 + 300 + 150 + 500 + 250 + 40)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Cost formulas&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quanto costa in più una replica aggiuntiva di un titolo già in cartellone?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;$3,240&lt;/b&gt;: solo i costi per performance (inclusi i $40 di admin). Scenery e publicity non cambiano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;E un titolo nuovo con 20 repliche?&lt;/summary&gt;&lt;div&gt;$21,080 + 20 × $3,240 = $21,080 + $64,800 = &lt;b&gt;$85,880&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale ipotesi rende valide queste formule?&lt;/summary&gt;&lt;div&gt;Costi unitari costanti nel relevant range (linearità) e una corretta identificazione del driver. Se ad esempio l&#x27;affitto della sala ha sconti a volume, la formula “$500 per replica” non tiene più.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 4. FLEX ===== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;flex&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;4 · Planning vs flexible&lt;/span&gt;
  &lt;h2&gt;Planning budget e flexible budget&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Planning (static) budget&lt;/b&gt;&lt;br&gt;Preparato &lt;i&gt;prima&lt;/i&gt; del periodo, per un solo livello di attività previsto (6 · 108). Va bene per pianificare, ma confrontarlo con il consuntivo è fuorviante se l&#x27;attività cambia.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt;&lt;br&gt;Stime dei costi (e ricavi) adattate al livello di attività &lt;i&gt;effettivo&lt;/i&gt; (7 · 168), usando le stesse cost formulas. Dice: “dato quello che abbiamo fatto, quanto &lt;i&gt;avremmo dovuto&lt;/i&gt; spendere?”&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il flexible budget si prepara &lt;b&gt;a fine periodo&lt;/b&gt;, quando l&#x27;attività reale è nota. Non è un nuovo piano: è un metro di paragone corretto.&lt;/p&gt;

  &lt;h3&gt;Flexible budget interattivo&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Muovi i cursori: il budget si ricalcola con le formule della sezione 3. Valori di partenza = attività effettiva (7 · 168).&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;q&quot;&gt;Productions&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;3&quot; max=&quot;12&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;qo&quot;&gt;7&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;p&quot;&gt;Performances&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;p&quot; min=&quot;40&quot; max=&quot;300&quot; step=&quot;2&quot; value=&quot;168&quot;&gt;&lt;output id=&quot;po&quot;&gt;168&lt;/output&gt;&lt;/div&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin:12px 0&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;Flexible budget&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;ftot&quot;&gt;$724,280&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;vs planning $508,800&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;fdiff&quot; style=&quot;font-size:1.4rem&quot;&gt;+$215,480&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;note&quot;&gt;Media performances / production&lt;/div&gt;&lt;div class=&quot;big&quot; id=&quot;favg&quot; style=&quot;font-size:1.4rem&quot;&gt;24.0&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;fchart&quot; viewBox=&quot;0 0 860 300&quot; aria-label=&quot;Grafico flexible vs planning per voce&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span style=&quot;display:inline-block;width:12px;height:12px;background:var(--rule);vertical-align:middle&quot;&gt;&lt;/span&gt; planning · &lt;span style=&quot;display:inline-block;width:12px;height:12px;background:var(--brick);vertical-align:middle&quot;&gt;&lt;/span&gt; flexible al livello scelto&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Flexible budget&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il flexible budget non “premia” chi fa più attività?&lt;/summary&gt;&lt;div&gt;Perché alza le attese di costo in proporzione all&#x27;attività. Spendere di più per fare di più non è più segnalato come uno sforamento; resta segnalato solo quanto si spende in più &lt;i&gt;rispetto a quanto quell&#x27;attività avrebbe dovuto costare&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se il teatro avesse fatto 6 productions e 108 performances, flexible e planning coinciderebbero?&lt;/summary&gt;&lt;div&gt;Sì: stesse formule, stesso livello di attività, quindi nessuna activity variance.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 5. VARIANZE ===== --&gt;
&lt;section class=&quot;part acc&quot; id=&quot;varianze&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;5 · Varianze&lt;/span&gt;
  &lt;h2&gt;Activity variance e spending variance&lt;/h2&gt;
  &lt;p&gt;Il flexible budget si mette &lt;b&gt;in mezzo&lt;/b&gt; tra planning e actual. La differenza totale si spezza così in due parti, che hanno significati diversi.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity variance&lt;/b&gt; (varianza di attività)&lt;br&gt;= Flexible budget − Planning budget&lt;br&gt;Dipende &lt;i&gt;solo&lt;/i&gt; dalla differenza tra attività effettiva e attività prevista. Per i costi, più attività dà una variance &lt;b&gt;U&lt;/b&gt;. Qui riflette una scelta del board, non inefficienza.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Spending variance&lt;/b&gt; (varianza di spesa)&lt;br&gt;= Actual − Flexible budget&lt;br&gt;Mostra quanto si è speso in più o in meno di quanto &lt;i&gt;avrebbe dovuto&lt;/i&gt; costare l&#x27;attività svolta. È la misura del controllo dei costi.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Convenzione F / U&lt;/b&gt;: per un costo, &lt;span class=&quot;F&quot;&gt;F = Favorable&lt;/span&gt; (favorevole) quando il costo è &lt;i&gt;più basso&lt;/i&gt; del termine di confronto, &lt;span class=&quot;U&quot;&gt;U = Unfavorable&lt;/span&gt; (sfavorevole) quando è più alto. Per i ricavi vale il contrario.&lt;/p&gt;

  &lt;h3&gt;Dal planning all&#x27;actual: il ponte&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 860 340&quot; aria-label=&quot;Grafico a cascata delle varianze&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;300&quot; x2=&quot;840&quot; y2=&quot;300&quot; stroke=&quot;var(--ink2)&quot;/&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;rect x=&quot;90&quot; y=&quot;126&quot; width=&quot;120&quot; height=&quot;174&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$508,800&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Planning&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;52&quot; width=&quot;120&quot; height=&quot;74&quot; fill=&quot;var(--brick)&quot; opacity=&quot;.8&quot;/&gt;&lt;line x1=&quot;210&quot; y1=&quot;126&quot; x2=&quot;260&quot; y2=&quot;126&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;U&quot;&gt;+$215,480 U&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Activity var.&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;52&quot; width=&quot;120&quot; height=&quot;248&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.8&quot;/&gt;&lt;line x1=&quot;380&quot; y1=&quot;52&quot; x2=&quot;430&quot; y2=&quot;52&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$724,280&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Flexible&lt;/text&gt;
      &lt;rect x=&quot;600&quot; y=&quot;49&quot; width=&quot;120&quot; height=&quot;3&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;line x1=&quot;550&quot; y1=&quot;52&quot; x2=&quot;600&quot; y2=&quot;52&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;660&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;U&quot;&gt;+$2,620 U&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Spending var.&lt;/text&gt;
      &lt;rect x=&quot;770&quot; y=&quot;51&quot; width=&quot;60&quot; height=&quot;249&quot; fill=&quot;var(--ink)&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$726,900&lt;/text&gt;&lt;text x=&quot;800&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot;&gt;Actual&lt;/text&gt;
      &lt;text x=&quot;660&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;quasi invisibile:&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;0.4% del flexible&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;div class=&quot;formula&quot;&gt;Actual − Planning = (Flexible − Planning) + (Actual − Flexible)&lt;br&gt;$218,100 U = $215,480 U + $2,620 U&lt;/div&gt;
  &lt;p&gt;Il 98.8% dell&#x27;aumento dei costi si spiega con il volume deciso dal board. Solo $2,620 sono “spesa fuori formula”.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;v-a&quot;&gt;Esempio: actors&#x27; wages&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;v-b&quot;&gt;Esempio: hall rent&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;v-c&quot;&gt;Esempio: admin&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-a&quot;&gt;&lt;p&gt;Planning $216,000 → Flexible $2,000 × 168 = &lt;b&gt;$336,000&lt;/b&gt; → Actual $341,800.&lt;br&gt;Activity = 336,000 − 216,000 = &lt;span class=&quot;U&quot;&gt;$120,000 U&lt;/span&gt; (60 repliche in più × $2,000).&lt;br&gt;Spending = 341,800 − 336,000 = &lt;span class=&quot;U&quot;&gt;$5,800 U&lt;/span&gt; (circa $34.5 in più per replica).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-b&quot; hidden&gt;&lt;p&gt;Planning $54,000 → Flexible $500 × 168 = &lt;b&gt;$84,000&lt;/b&gt; → Actual $78,000.&lt;br&gt;Activity = &lt;span class=&quot;U&quot;&gt;$30,000 U&lt;/span&gt;; Spending = 78,000 − 84,000 = &lt;span class=&quot;F&quot;&gt;$6,000 F&lt;/span&gt;.&lt;br&gt;Costo effettivo per replica: 78,000 / 168 ≈ $464 invece di $500.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; id=&quot;v-c&quot; hidden&gt;&lt;p&gt;Flexible = 32,400 + 1,080 × 7 + 40 × 168 = 32,400 + 7,560 + 6,720 = &lt;b&gt;$46,680&lt;/b&gt;.&lt;br&gt;Activity = 46,680 − 43,200 = &lt;span class=&quot;U&quot;&gt;$3,480 U&lt;/span&gt;; Spending = 47,500 − 46,680 = &lt;span class=&quot;U&quot;&gt;$820 U&lt;/span&gt;.&lt;br&gt;Nota: la parte fissa non genera activity variance.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Varianze&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Una activity variance U sui costi è “colpa” di qualcuno?&lt;/summary&gt;&lt;div&gt;Non necessariamente. Misura l&#x27;effetto del volume. Qui il volume è salito per decisione del board, con entrate in crescita: è una conseguenza attesa, non un problema di controllo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una spending variance F è sempre una buona notizia?&lt;/summary&gt;&lt;div&gt;No. Potrebbe derivare da tagli alla qualità (meno programmi stampati, meno personale di sala) o da una formula di costo stimata male. Va capita, non solo applaudita.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Calcola la spending variance di publicity.&lt;/summary&gt;&lt;div&gt;Flexible = $2,000 × 7 = $14,000; actual $15,100 → &lt;span class=&quot;U&quot;&gt;$1,100 U&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 6. REPORT ===== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;report&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;6 · Requisito 1&lt;/span&gt;
  &lt;h2&gt;Flexible budget performance report&lt;/h2&gt;
  &lt;p&gt;Struttura classica a 5 colonne: &lt;b&gt;Actual&lt;/b&gt; · spending variance · &lt;b&gt;Flexible&lt;/b&gt; · activity variance · &lt;b&gt;Planning&lt;/b&gt;. Le varianze stanno tra le due colonne che confrontano. &lt;span class=&quot;note&quot;&gt;Clicca una riga per il commento.&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;rep&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;The Little Theatre&lt;br&gt;Year ended Dec. 31&lt;/th&gt;&lt;th&gt;Actual&lt;br&gt;Results&lt;/th&gt;&lt;th&gt;Spending&lt;br&gt;Variances&lt;/th&gt;&lt;th&gt;Flexible&lt;br&gt;Budget&lt;/th&gt;&lt;th&gt;Activity&lt;br&gt;Variances&lt;/th&gt;&lt;th&gt;Planning&lt;br&gt;Budget&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Productions&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Performances&lt;/td&gt;&lt;td&gt;168&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;168&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
    &lt;tbody id=&quot;repbody&quot;&gt;&lt;/tbody&gt;
    &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total expense&lt;/td&gt;&lt;td&gt;$726,900&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$2,620 U&lt;/td&gt;&lt;td&gt;$724,280&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;$215,480 U&lt;/td&gt;&lt;td&gt;$508,800&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot; id=&quot;repnote&quot; style=&quot;min-height:80px&quot;&gt;&lt;span class=&quot;note&quot;&gt;Seleziona una voce del report per vedere formula, calcolo e possibili cause.&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Report&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Somma delle spending variances U e F?&lt;/summary&gt;&lt;div&gt;U: 5,800 + 700 + 4,600 + 1,100 + 820 = $13,020. F: 700 + 6,000 + 3,700 = $10,400. Netto = &lt;b&gt;$2,620 U&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale voce ha la spending variance più grande in valore assoluto?&lt;/summary&gt;&lt;div&gt;Theater hall rent: &lt;span class=&quot;F&quot;&gt;$6,000 F&lt;/span&gt;. Seguono actors and directors wages (&lt;span class=&quot;U&quot;&gt;$5,800 U&lt;/span&gt;) e scenery (&lt;span class=&quot;U&quot;&gt;$4,600 U&lt;/span&gt;).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 7. VALUTAZIONE ===== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;valuta&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;7 · Requisito 2&lt;/span&gt;
  &lt;h2&gt;Il board dovrebbe essere soddisfatto?&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Risposta sintetica: nel complesso sì.&lt;/b&gt; I costi sono cresciuti di $218,100, ma $215,480 si spiegano con l&#x27;espansione decisa dal board stesso. La spending variance netta è di soli &lt;b&gt;$2,620 U, lo 0.36% del flexible budget&lt;/b&gt;. Il totale però nasconde compensazioni tra voci, ed è lì che conviene guardare (&lt;em class=&quot;t&quot;&gt;management by exception&lt;/em&gt;: concentrare l&#x27;attenzione sulle varianze significative).&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Perché soddisfatti&lt;/h3&gt;
      &lt;details open&gt;&lt;summary&gt;Il confronto corretto è con il flexible budget&lt;/summary&gt;&lt;div&gt;Dire “abbiamo speso il 43% in più” confonde volume e controllo. Al livello di attività effettivo, i costi sono quasi esattamente quelli previsti dalle formule.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;La crescita era voluta e finanziata&lt;/summary&gt;&lt;div&gt;Grants e ticket sales sono cresciuti “correspondingly”. L&#x27;activity variance è il prezzo atteso di un programma più ricco.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Cosa indagare&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Actors and directors wages: $5,800 U&lt;/summary&gt;&lt;div&gt;Possibili cause: tariffe più alte, un titolo con cast più numeroso. La formula usa una media ($2,000/replica), ma il costo per replica dipende dal cast di ogni production. Con 7 titoli diversi la media del piano può non valere più.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Scenery, costumes and props: $4,600 U&lt;/summary&gt;&lt;div&gt;Il settimo titolo può essere stato più costoso della media di $18,000 (allestimento più complesso). Anche qui il problema può stare nell&#x27;uso di una media.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Hall rent $6,000 F e programs $3,700 F&lt;/summary&gt;&lt;div&gt;Forse sconti a volume (affitto a lungo termine, tirature più grandi). Allora questi costi non sono puramente variabili, e la formula andrebbe rivista. Oppure si è risparmiato riducendo il servizio (meno programmi stampati). Le varianze F vanno spiegate come quelle U.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Le compensazioni nascondono informazione&lt;/summary&gt;&lt;div&gt;$13,020 di varianze U sono compensate da $10,400 di F. Un totale piccolo non garantisce che ogni responsabile abbia controllato bene i propri costi.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Limite del report.&lt;/b&gt; Mostra solo costi. Per giudicare davvero l&#x27;espansione servirebbe il quadro completo con ricavi (grants, biglietti) e la loro revenue variance. In un nonprofit conta anche se la missione (più spettacoli per bambini) è stata servita in modo efficiente.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Valutazione&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché è sbagliato concludere “costi fuori controllo” dal confronto actual/planning?&lt;/summary&gt;&lt;div&gt;Perché il planning si riferisce a 6 · 108, mentre l&#x27;attività è stata 7 · 168. Si confrontano costi di attività diverse: l&#x27;effetto volume oscura il giudizio sul controllo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale miglioramento faresti alle cost formulas per l&#x27;anno prossimo?&lt;/summary&gt;&lt;div&gt;Ad esempio: stimare i costi per titolo in base al cast e all&#x27;allestimento invece di usare una media; verificare se affitto e programmi hanno componenti fisse o sconti a volume; rivedere la ripartizione 75/15/10 dell&#x27;admin con dati storici.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== 8. COLLEGAMENTI ===== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;collegamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;8 · Collegamenti&lt;/span&gt;
  &lt;h2&gt;Dove si colloca questa lezione&lt;/h2&gt;
  &lt;p class=&quot;note&quot;&gt;Nota onesta: in questa sessione non ho potuto elencare il contenuto della cartella &lt;code&gt;corso/&lt;/code&gt;. Ho provato alcuni nomi plausibili (es. un file di soluzione accanto al testo) senza trovarli. I collegamenti qui sotto sono quindi concettuali e non presi da altri file del corso: verificali sul programma.&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 860 120&quot; aria-label=&quot;Sequenza tipica degli argomenti di budgeting&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot;&gt;Master budget&lt;/text&gt;
      &lt;rect x=&quot;230&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;questa lezione&lt;/text&gt;
      &lt;rect x=&quot;450&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot;&gt;Standard costing&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;price / quantity var.&lt;/text&gt;
      &lt;rect x=&quot;670&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot;&gt;Responsibility&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;accounting&lt;/text&gt;
      &lt;g stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;190&quot; y1=&quot;60&quot; x2=&quot;228&quot; y2=&quot;60&quot;/&gt;&lt;line x1=&quot;410&quot; y1=&quot;60&quot; x2=&quot;448&quot; y2=&quot;60&quot;/&gt;&lt;line x1=&quot;630&quot; y1=&quot;60&quot; x2=&quot;668&quot; y2=&quot;60&quot;/&gt;&lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Prima: master / planning budget&lt;/h4&gt;&lt;p&gt;Il planning budget del teatro è il pezzo “costi” di un master budget annuale, preparato per un solo livello di attività.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dopo: standard costing&lt;/h4&gt;&lt;p&gt;Una spending variance si può scomporre ancora: in &lt;i&gt;price variance&lt;/i&gt; (si è pagato di più per unità di input) e &lt;i&gt;quantity variance&lt;/i&gt; (si è usato più input). Per i wages degli attori: tariffa più alta o più attori per replica?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Accanto: ABC&lt;/h4&gt;&lt;p&gt;I driver multipli (productions/performances) applicano al budgeting la logica dell&#x27;activity-based costing.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===== PER APPROFONDIRE ===== --&gt;
&lt;section class=&quot;part acc refs&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;slide&quot;&gt;dalle slide&lt;/span&gt;Le due pagine &lt;b&gt;non citano autori, testi, norme né siti&lt;/b&gt;: riportano solo testo e dati dell&#x27;esercizio. I riferimenti qui sotto vengono da ricerche web su testi di riferimento per questi argomenti. Sono tutti &lt;b&gt;fonti esterne&lt;/b&gt; e non provengono dalle slide.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Garrison, Noreen, Brewer, &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
      &lt;p&gt;Manuale di riferimento per la contabilità direzionale. Il capitolo “Flexible Budgets and Performance Analysis” (cap. 9 nelle edizioni recenti, cap. 10 in alcune più vecchie) usa la stessa terminologia dell&#x27;esercizio: planning budget, flexible budget, activity e spending variances, report con più cost driver. La forma delle tabelle fa pensare che l&#x27;esercizio venga da qui o da un testo simile, ma &lt;b&gt;l&#x27;attribuzione non è confermata&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda del libro su mheducation.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Kaplan &amp;amp; Cooper, “Profit Priorities from Activity-Based Costing”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, mag.–giu. 1991&lt;/h4&gt;
      &lt;p&gt;Articolo classico sull&#x27;activity-based cost management. Propone di tenere separati i costi legati alle singole unità da quelli di batch, di mantenimento del prodotto e di struttura. È la stessa logica per cui al teatro alcuni costi seguono le performances e altri le productions.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://store.hbr.org/product/profit-priorities-from-activity-based-costing-hbr-onpoint-enhanced-edition/3588&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina HBR Store&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Cost hierarchy (Cooper &amp;amp; Kaplan): sintesi su MAAW&lt;/h4&gt;
      &lt;p&gt;Il sito Management And Accounting Web riassume uno studio di Ittner, Larcker e Randall (1997) e la gerarchia a quattro livelli (unit, batch, product-sustaining, facility-sustaining) secondo cui i costi sono variabili rispetto ad attività di livelli diversi. Serve a capire perché un flexible budget con un solo driver non basta.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumIttnerLarckerRandall97.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;maaw.info: sintesi dell&#x27;articolo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;Definizione di flexible budget (CIMA, AccountingTools)&lt;/h4&gt;
      &lt;p&gt;La CIMA &lt;i&gt;Official Terminology&lt;/i&gt;, riportata da fonti secondarie (non ho verificato il testo originale), definisce il flexible budget come un budget che, distinguendo costi fissi, semivariabili e variabili, cambia in relazione al livello di attività raggiunto. AccountingTools offre una spiegazione introduttiva con il confronto rispetto allo static budget.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.accountingtools.com/articles/what-is-a-flexible-budget.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AccountingTools: “What is a flexible budget?”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;

  // model

    {n:&quot;Actors and directors wages&quot;,s:&quot;Actors &amp; directors&quot;,f:0,q:0,p:2000,plan:216000,act:341800,why:&quot;Costo per replica $2,000. La spending U (+1.7%) può dipendere da tariffe più alte o da un titolo con cast più grande: la media del piano non tiene conto del cast di ogni production.&quot;},

    {n:&quot;Ticket booth personnel and ushers wages&quot;,s:&quot;Ticket &amp; ushers&quot;,f:0,q:0,p:150,plan:16200,act:25900,why:&quot;$150 per replica. Piccola variance U: forse più personale nelle repliche più affollate.&quot;},
    {n:&quot;Scenery, costumes, and props&quot;,s:&quot;Scenery etc.&quot;,f:0,q:18000,p:0,plan:108000,act:130600,why:&quot;$18,000 per production. Il settimo titolo può essere costato più della media: è il limite di usare un costo medio per titoli diversi.&quot;},
    {n:&quot;Theater hall rent&quot;,s:&quot;Hall rent&quot;,f:0,q:0,p:500,plan:54000,act:78000,why:&quot;$500 per replica attesi, ma in realtà circa $464. Un affitto più lungo può aver dato uno sconto: forse il costo non è puramente variabile e la formula va rivista.&quot;},
    {n:&quot;Printed programs&quot;,s:&quot;Programs&quot;,f:0,q:0,p:250,plan:27000,act:38300,why:&quot;$250 per replica attesi, circa $228 effettivi. Sconti su tirature maggiori, oppure meno programmi stampati: da verificare che non sia un taglio al servizio.&quot;},
    {n:&quot;Publicity&quot;,s:&quot;Publicity&quot;,f:0,q:2000,p:0,plan:12000,act:15100,why:&quot;$2,000 per production. Sforamento di $1,100: forse una campagna extra per sostenere le tournée più lunghe, una spesa che segue anche le repliche e non solo i titoli.&quot;},
    {n:&quot;Administrative expenses&quot;,s:&quot;Admin&quot;,f:32400,q:1080,p:40,plan:43200,act:47500,why:&quot;Mixed cost: $32,400 + $1,080·q + $40·p. Variance U modesta; la ripartizione 75/15/10 è una stima, quindi la variance è anche un indizio sulla bontà di quella stima.&quot;}

      el(&quot;text&quot;,{x:x0-8,y:y+19,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:&quot;12&quot;},l.s);
      el(&quot;rect&quot;,{x:x0,y:y,width:Math.max(1,l.plan/max*w),height:h/2-1,fill:&quot;var(--rule)&quot;});
