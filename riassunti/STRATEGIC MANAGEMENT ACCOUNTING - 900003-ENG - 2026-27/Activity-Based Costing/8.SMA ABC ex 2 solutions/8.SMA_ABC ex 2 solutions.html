        &lt;a href=&quot;#profit&quot; class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;605&quot; y=&quot;342&quot; width=&quot;155&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;682&quot; y=&quot;366&quot; text-anchor=&quot;middle&quot;&gt;5 · Conclusioni&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;682&quot; y=&quot;385&quot; text-anchor=&quot;middle&quot;&gt;costi evitabili?&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#pricing&quot; class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;410&quot; y=&quot;342&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;485&quot; y=&quot;366&quot; text-anchor=&quot;middle&quot;&gt;6 · Pricing&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;485&quot; y=&quot;385&quot; text-anchor=&quot;middle&quot;&gt;fine dei sussidi&lt;/text&gt;&lt;/a&gt;

&lt;section class=&quot;part&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Parte 1 · Il contesto&lt;/span&gt;
    &lt;h2&gt;Il caso Gallatin Carpet Cleaning&lt;/h2&gt;
    &lt;p&gt;&lt;b&gt;Gallatin Carpet Cleaning&lt;/b&gt; è una piccola impresa familiare di Bozeman (Montana) che pulisce tappeti e moquette. Ha sempre applicato un &lt;span class=&quot;t&quot;&gt;flat fee&lt;/span&gt; (tariffa unica, uguale per tutti): &lt;b&gt;$28 per hundred square feet&lt;/b&gt;, cioè per ogni 100 piedi quadrati puliti (circa 9,3 m²). &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;Il dubbio: l&#x27;azienda &lt;b&gt;guadagna davvero&lt;/b&gt; su tutti i clienti? In particolare su quelli nei &lt;b&gt;ranch isolati&lt;/b&gt;, che richiedono molto tempo di viaggio. La figlia del titolare propone di usare l&#x27;&lt;span class=&quot;t&quot;&gt;activity-based costing&lt;/span&gt; (ABC, calcolo dei costi basato sulle attività) e disegna un sistema semplice con &lt;b&gt;quattro activity cost pools&lt;/b&gt;.&lt;/p&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;h4&gt;Le quattro attività &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/h4&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;Attività annua&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;Square feet cleaned (00s)&lt;/td&gt;&lt;td&gt;20.000 centinaia di sq ft&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;Miles driven&lt;/td&gt;&lt;td&gt;60.000 miglia&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;Number of jobs&lt;/td&gt;&lt;td&gt;2.000 jobs&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;non applicabile&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;p class=&quot;small muted&quot;&gt;&lt;i&gt;Other&lt;/i&gt; raccoglie &lt;span class=&quot;t&quot;&gt;organization-sustaining costs&lt;/span&gt; (costi che mantengono in vita l&#x27;azienda nel suo complesso) e &lt;span class=&quot;t&quot;&gt;idle capacity costs&lt;/span&gt; (costo della capacità inutilizzata). &lt;i&gt;Job support&lt;/i&gt; = ricevere le telefonate dei potenziali clienti, programmare i lavori, fatturare, risolvere problemi. &lt;span class=&quot;src&quot;&gt;slide 2–3&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;h4&gt;I costi dell&#x27;anno &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h4&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Risorsa&lt;/th&gt;&lt;th&gt;Costo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Wages (salari)&lt;/td&gt;&lt;td&gt;$150.000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning supplies (detergenti, materiali)&lt;/td&gt;&lt;td&gt;40.000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning equipment depreciation (ammortamento macchine)&lt;/td&gt;&lt;td&gt;20.000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Vehicle expenses (furgoni)&lt;/td&gt;&lt;td&gt;80.000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Office expenses (ufficio)&lt;/td&gt;&lt;td&gt;60.000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;President&#x27;s compensation (compenso del titolare)&lt;/td&gt;&lt;td&gt;80.000&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
          &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;$430.000&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
        &lt;/table&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;I sei requirements dell&#x27;esercizio &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;1.&lt;/b&gt; First-stage allocation: ripartire i costi nei pool. &lt;a href=&quot;#stage1&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Calcolare l&#x27;activity rate di ogni pool. &lt;a href=&quot;#rates&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Costo ABC del lavoro al &lt;b&gt;Flying N Ranch&lt;/b&gt;: 500 sq ft, 75 miglia andata e ritorno. &lt;a href=&quot;#job&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Customer margin: ricavo $140 (5 × $28) meno costo. &lt;a href=&quot;#margin&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Il lavoro è redditizio? Spiegare. &lt;a href=&quot;#profit&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Consigli al titolare sul pricing futuro. &lt;a href=&quot;#pricing&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Attenzione alle unità.&lt;/b&gt; L&#x27;attività &quot;cleaning&quot; si misura in &lt;b&gt;centinaia&lt;/b&gt; di piedi quadrati: 500 sq ft = &lt;b&gt;5&lt;/b&gt; unità di attività. È l&#x27;errore più comune all&#x27;esame: moltiplicare $8,05 per 500 invece che per 5. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Hai chiaro il caso?&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il titolare sospetta di perdere soldi con i ranch, se la tariffa è la stessa per tutti?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché il prezzo dipende solo dai piedi quadrati, mentre i costi dipendono anche dalla &lt;b&gt;distanza&lt;/b&gt; (miglia guidate, tempo dei dipendenti) e dal &lt;b&gt;numero di lavori&lt;/b&gt; (telefonate, fatturazione). Un lavoro piccolo e lontano consuma molte risorse ma porta pochi ricavi.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quanti piedi quadrati ha pulito l&#x27;azienda nell&#x27;anno? Qual è il ricavo totale con il flat fee?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;20.000 centinaia = &lt;b&gt;2.000.000 sq ft&lt;/b&gt;. Ricavo = 20.000 × $28 = &lt;b&gt;$560.000&lt;/b&gt;. Con costi di $430.000, l&#x27;utile complessivo è $130.000: l&#x27;azienda nel complesso guadagna, il problema è &lt;i&gt;dove&lt;/i&gt; guadagna e dove perde. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;abc&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 2 · Concetti&lt;/span&gt;
    &lt;h2&gt;I concetti dell&#x27;ABC che servono qui&lt;/h2&gt;
    &lt;p&gt;Le slide di questo esercizio danno per scontata la teoria. Ecco il vocabolario minimo, con i termini inglesi del corso.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-based costing (ABC)&lt;/b&gt; — metodo che assegna i costi indiretti agli oggetti di costo (prodotti, servizi, clienti, singoli lavori) in base alle &lt;b&gt;attività&lt;/b&gt; che questi consumano, invece che con un&#x27;unica base come le ore di manodopera diretta.&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt; — &quot;contenitore&quot; in cui si raccolgono i costi di un&#x27;attività (es. Travel to jobs).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity measure&lt;/b&gt; (o cost driver) — la grandezza che misura quanto di un&#x27;attività consuma un oggetto di costo (es. miglia guidate).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt; — costo del pool diviso per l&#x27;attività totale: il &quot;prezzo interno&quot; di un&#x27;unità di attività (es. $1,30 per miglio).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost object&lt;/b&gt; — ciò di cui si vuole conoscere il costo: qui il singolo &lt;i&gt;job&lt;/i&gt;, cioè il lavoro presso un cliente.&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Il modello a due stadi&lt;/h3&gt;
    &lt;p&gt;L&#x27;ABC procede in due passaggi. Scorri i passi:&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-onstep=&quot;twoStage&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; aria-label=&quot;Modello ABC a due stadi&quot; id=&quot;twostage&quot;&gt;
        &lt;g id=&quot;ts-res&quot;&gt;
          &lt;rect class=&quot;s-slate&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;95&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Risorse&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;Wages&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Supplies&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Depreciation&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;Vehicle&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot;&gt;Office&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;President&lt;/text&gt;
        &lt;/g&gt;
        &lt;g id=&quot;ts-a1&quot; opacity=&quot;.15&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M185,125 L280,125&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;232&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot;&gt;% consumo&lt;/text&gt;&lt;/g&gt;
        &lt;g id=&quot;ts-pool&quot; opacity=&quot;.15&quot;&gt;
          &lt;rect class=&quot;s-ochre&quot; x=&quot;285&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;380&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Activity cost pools&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Cleaning $161.000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;Travel $78.000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;Job support $59.000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;Other $132.000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;(non assegnato)&lt;/text&gt;
        &lt;/g&gt;
        &lt;g id=&quot;ts-a2&quot; opacity=&quot;.15&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M480,110 L575,110&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;527&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;rate × consumo&lt;/text&gt;&lt;/g&gt;
        &lt;g id=&quot;ts-obj&quot; opacity=&quot;.15&quot;&gt;
          &lt;rect class=&quot;s-sage&quot; x=&quot;580&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;665&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Cost object&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Job Flying N Ranch&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;$167,25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;confronto con&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;ricavo $140&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Punto di partenza.&lt;/b&gt; I costi sono registrati in contabilità per &lt;i&gt;natura&lt;/i&gt; (salari, furgoni, ufficio…). Così non dicono nulla su quanto costa un singolo lavoro.&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;First-stage allocation.&lt;/b&gt; Con interviste e stime si stabilisce che percentuale di ogni risorsa viene consumata da ogni attività (es. il 20% dei salari va in viaggi). I costi passano dalle risorse ai pool. &lt;span class=&quot;src&quot;&gt;slide 3, 5&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Activity rates.&lt;/b&gt; Il costo di ogni pool si divide per la sua attività totale annua. Il pool &lt;i&gt;Other&lt;/i&gt; non ha una activity measure e quindi &lt;b&gt;resta fuori&lt;/b&gt;: non viene assegnato ai job. &lt;span class=&quot;src&quot;&gt;slide 2, 6&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Second-stage allocation.&lt;/b&gt; Ogni job riceve costo = rate × attività che consuma. Il risultato si confronta con il ricavo del job: è il &lt;span class=&quot;t&quot;&gt;customer margin&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 7–8&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt small muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;La gerarchia delle attività&lt;/h3&gt;
    &lt;p&gt;Le attività si classificano in base a &lt;b&gt;che cosa le fa variare&lt;/b&gt;. Nell&#x27;esercizio 1 il corso usa i termini &lt;i&gt;unit-level&lt;/i&gt;, &lt;i&gt;batch-level&lt;/i&gt; e &lt;i&gt;product-level&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;; qui compare anche &lt;i&gt;organization-sustaining&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;. Clicca sui livelli:&lt;/p&gt;
    &lt;div class=&quot;tabs&quot;&gt;
      &lt;div role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Unit-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Batch / job-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Customer-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Organization-sustaining&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Unit-level&lt;/b&gt;: si ripete per ogni unità prodotta o servita; il costo cresce con il volume. Esempio in Hickory: &lt;i&gt;machining&lt;/i&gt; (ore macchina) &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. &lt;b&gt;In Gallatin&lt;/b&gt;: &lt;i&gt;Cleaning carpets&lt;/i&gt;, che cresce con ogni centinaio di piedi quadrati.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Batch-level&lt;/b&gt;: si svolge una volta per lotto, a prescindere da quante unità contiene. In Hickory: &lt;i&gt;machine setups&lt;/i&gt;, &quot;non influenzato dal numero di unità processate una volta completato il setup&quot; &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. &lt;b&gt;In Gallatin&lt;/b&gt; il &quot;lotto&quot; è il &lt;b&gt;job&lt;/b&gt;: &lt;i&gt;Job support&lt;/i&gt; (telefonata, programmazione, fattura) costa uguale sia per 300 che per 3.000 sq ft. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Product-level&lt;/b&gt;: serve a mantenere un prodotto o servizio a catalogo, indipendentemente da lotti e unità. In Hickory: &lt;i&gt;product design&lt;/i&gt;, $42.000 per prodotto &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. In Gallatin non ce n&#x27;è: offre un solo servizio.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Customer-level&lt;/b&gt;: legato ai singoli clienti, non al volume (visite, assistenza, viaggio verso il cliente). &lt;i&gt;Travel to jobs&lt;/i&gt; dipende da &lt;b&gt;dove&lt;/b&gt; si trova il cliente: si misura in miglia, ma è il cliente a determinarle. È proprio questa attività che il flat fee ignora. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt; (classificazione tipica dei manuali, es. Garrison et al.)&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Organization-sustaining&lt;/b&gt;: costi che servono all&#x27;azienda nel suo insieme e non dipendono da clienti, prodotti o volumi (parte del compenso del titolare, parte dell&#x27;ufficio). Insieme all&#x27;&lt;b&gt;idle capacity&lt;/b&gt; finiscono nel pool &lt;i&gt;Other&lt;/i&gt;, che &lt;b&gt;non viene assegnato&lt;/b&gt; ai job perché qualunque criterio sarebbe arbitrario. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;Perché non si assegnano i costi di idle capacity?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La capacità inutilizzata (es. un furgone fermo il 40% del tempo) non è consumata da nessun cliente. Caricarla sui job farebbe sembrare costoso un lavoro solo perché l&#x27;azienda ha più risorse di quante ne usa. L&#x27;ABC &quot;alla Garrison&quot; la tiene separata per mostrarla al management come costo dell&#x27;inefficienza, non dei clienti. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;ABC in un&#x27;azienda di servizi: cosa cambia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nell&#x27;esercizio 1 l&#x27;oggetto di costo era un &lt;b&gt;prodotto&lt;/b&gt; (Y e Z) e i costi erano overhead di fabbrica. Qui l&#x27;oggetto è un &lt;b&gt;job/cliente&lt;/b&gt; e si allocano &lt;b&gt;tutti&lt;/b&gt; i costi aziendali, anche salari e compenso del titolare. La logica è la stessa: le risorse si consumano tramite attività. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Concetti&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che differenza c&#x27;è tra activity cost pool e activity measure?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Il &lt;b&gt;pool&lt;/b&gt; raccoglie i dollari di costo di un&#x27;attività; la &lt;b&gt;measure&lt;/b&gt; è l&#x27;unità con cui si conta quanto di quell&#x27;attività consuma ogni oggetto di costo. Rate = pool ÷ measure totale.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Job support è unit-level o batch-level? Perché?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Batch (job)-level: si svolge una volta per lavoro e non dipende da quanti piedi quadrati si puliscono, proprio come il setup di Hickory non dipende dalle unità del lotto.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il pool Other non ha activity measure?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Contiene costi organization-sustaining e di idle capacity, che non sono causati da nessun job. Non esiste una misura che ne spieghi il consumo, quindi non si allocano ai clienti.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;stage1&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 3 · Requirement 1&lt;/span&gt;
    &lt;h2&gt;First-stage allocation: dalle risorse ai pool&lt;/h2&gt;
    &lt;p&gt;La &lt;span class=&quot;t&quot;&gt;first-stage allocation&lt;/span&gt; (allocazione di primo stadio) ripartisce ogni voce di costo tra i pool secondo le percentuali di consumo delle risorse. Ogni cella si calcola così: &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;Costo nel pool = % di consumo × costo totale della risorsa&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;es. Wages → Cleaning: 70% × $150.000 = $105.000&lt;/span&gt;&lt;/div&gt;

    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;align-items:center&quot;&gt;
      &lt;button class=&quot;btn&quot; id=&quot;s1pct&quot; aria-pressed=&quot;false&quot;&gt;Mostra percentuali&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;s1usd&quot; aria-pressed=&quot;true&quot;&gt;Mostra dollari&lt;/button&gt;
      &lt;span class=&quot;small muted&quot;&gt;Clicca su una cella per vedere il calcolo.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;s1tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot; id=&quot;s1out&quot; aria-live=&quot;polite&quot;&gt;Clicca una cella della tabella.&lt;/div&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 120&quot; aria-label=&quot;Ripartizione dei 430.000 dollari tra i pool&quot;&gt;
        &lt;rect class=&quot;s-ochre&quot; x=&quot;20&quot; y=&quot;20&quot; width=&quot;269.6&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;289.6&quot; y=&quot;20&quot; width=&quot;130.6&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-sage&quot; x=&quot;420.2&quot; y=&quot;20&quot; width=&quot;98.8&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-brick&quot; x=&quot;519&quot; y=&quot;20&quot; width=&quot;221&quot; height=&quot;44&quot; style=&quot;stroke-dasharray:4 3&quot;/&gt;
        &lt;text class=&quot;big&quot; x=&quot;154.8&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Cleaning 161k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;354.9&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Travel 78k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;469.6&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Support 59k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;629.5&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Other 132k&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;154.8&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;37,4%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;354.9&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;18,1%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;469.6&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;13,7%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;629.5&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;30,7%&lt;/text&gt;
        &lt;path class=&quot;ax&quot; d=&quot;M20,100 L519,100&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;270&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;$298.000 assegnabili ai job&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Quasi un terzo dei costi (Other, $132.000) non verrà mai attribuito ai singoli lavori. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt; (percentuali calcolate dai dati della slide 5)&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Controllo di quadratura.&lt;/b&gt; La somma dei totali dei pool deve tornare al costo complessivo: 161.000 + 78.000 + 59.000 + 132.000 = &lt;b&gt;$430.000&lt;/b&gt;. Ogni riga deve sommare al 100%. Fallo sempre all&#x27;esame. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;First stage&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quanto delle vehicle expenses finisce in Travel to jobs? E in Other?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;60% × $80.000 = &lt;b&gt;$48.000&lt;/b&gt; in Travel; 40% × $80.000 = &lt;b&gt;$32.000&lt;/b&gt; in Other (es. furgoni fermi, idle capacity).&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Da quali risorse è formato il pool Job support?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Office expenses 45% ($27.000) + President&#x27;s compensation 40% ($32.000) = &lt;b&gt;$59.000&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se il 10% dei salari passasse da Other a Travel, quanto varrebbe il pool Travel?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Travel prenderebbe il 30% dei salari: $45.000 + $48.000 = &lt;b&gt;$93.000&lt;/b&gt; (rate $1,55 per miglio). Le stime del primo stadio influenzano direttamente i risultati. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;rates&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 4 · Requirement 2&lt;/span&gt;
    &lt;h2&gt;Activity rates: il prezzo di un&#x27;unità di attività&lt;/h2&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;(a) Total cost del pool&lt;/span&gt;&lt;span&gt;(b) Total activity&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Total cost&lt;/th&gt;&lt;th&gt;(b) Total activity&lt;/th&gt;&lt;th&gt;(a) ÷ (b) Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;$161.000&lt;/td&gt;&lt;td&gt;20.000 centinaia di sq ft&lt;/td&gt;&lt;td&gt;&lt;b&gt;$8,05&lt;/b&gt; per 100 sq ft&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;$78.000&lt;/td&gt;&lt;td&gt;60.000 miglia&lt;/td&gt;&lt;td&gt;&lt;b&gt;$1,30&lt;/b&gt; per miglio&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;$59.000&lt;/td&gt;&lt;td&gt;2.000 jobs&lt;/td&gt;&lt;td&gt;&lt;b&gt;$29,50&lt;/b&gt; per job&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Fonte: slide 6. Il pool Other non ha un rate perché non ha activity measure.&lt;/p&gt;

    &lt;h3&gt;Dentro ogni rate&lt;/h3&gt;
    &lt;p&gt;Un modo utile per capire i rate è scomporli per risorsa: ogni costo del pool diviso per la stessa attività. Questo servirà nella &lt;a href=&quot;#profit&quot;&gt;parte 7&lt;/a&gt; per capire quali costi sono evitabili. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 210&quot; aria-label=&quot;Scomposizione degli activity rate per risorsa&quot;&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;40&quot;&gt;Cleaning&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;54&quot;&gt;$8,05/100 sq ft&lt;/text&gt;
        &lt;rect class=&quot;s-slate&quot; x=&quot;130&quot; y=&quot;25&quot; width=&quot;391&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-ochre&quot; x=&quot;521&quot; y=&quot;25&quot; width=&quot;149&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-brick&quot; x=&quot;670&quot; y=&quot;25&quot; width=&quot;60&quot; height=&quot;34&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;325&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;wages 5,25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;595&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;supplies 2,00&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;700&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;dep. 0,80&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;105&quot;&gt;Travel&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;119&quot;&gt;$1,30/miglio&lt;/text&gt;
        &lt;rect class=&quot;s-slate&quot; x=&quot;130&quot; y=&quot;90&quot; width=&quot;231&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-sage&quot; x=&quot;361&quot; y=&quot;90&quot; width=&quot;369&quot; height=&quot;34&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;245&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;wages 0,50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;545&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;vehicle 0,80&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;170&quot;&gt;Job support&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;184&quot;&gt;$29,50/job&lt;/text&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;130&quot; y=&quot;155&quot; width=&quot;275&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-slate&quot; x=&quot;405&quot; y=&quot;155&quot; width=&quot;325&quot; height=&quot;34&quot; style=&quot;stroke-dasharray:4 3&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;267&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot;&gt;office 13,50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;567&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot;&gt;president 16,00&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ogni barra è lunga il 100% del suo rate. Es.: wages in Cleaning = $105.000 ÷ 20.000 = $5,25. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;details&gt;&lt;summary&gt;Perché il denominatore è l&#x27;attività &quot;for the year&quot; e non la capacità massima?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le slide usano l&#x27;attività effettiva/attesa dell&#x27;anno. Se si usasse la capacità pratica, il rate sarebbe più basso e la differenza (costo della capacità non usata) emergerebbe come idle capacity, che qui è già in parte separata nel pool Other. È lo stesso spunto da cui nasce il &lt;i&gt;time-driven ABC&lt;/i&gt; (vedi &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;). &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Activity rates&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è il costo ABC medio di un job, considerando che un job medio pulisce 1.000 sq ft e percorre 30 miglia?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Medie: 20.000/2.000 = 10 centinaia di sq ft per job; 60.000/2.000 = 30 miglia. Costo = 10 × 8,05 + 30 × 1,30 + 29,50 = 80,50 + 39,00 + 29,50 = &lt;b&gt;$149,00&lt;/b&gt;, contro un ricavo medio di $280. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché $29,50 per job è uguale per un lavoro grande e uno piccolo?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché job support è un&#x27;attività di livello job (batch): telefonata, programmazione e fattura richiedono lo stesso sforzo indipendentemente dalla superficie.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;job&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 5 · Requirement 3&lt;/span&gt;
    &lt;h2&gt;Il costo del lavoro al Flying N Ranch&lt;/h2&gt;
    &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;second stage&lt;/span&gt; (secondo stadio): si moltiplica ogni activity rate per l&#x27;attività consumata dal job. Il Flying N Ranch: &lt;b&gt;500 sq ft&lt;/b&gt; (= 5 centinaia), &lt;b&gt;75 miglia&lt;/b&gt; andata e ritorno, &lt;b&gt;1 job&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 4, 7&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ABC cost del job = Σ (activity rate × activity consumata)&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Activity rate&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;(a) × (b) ABC cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;$8,05 per 100 sq ft&lt;/td&gt;&lt;td&gt;5 centinaia di sq ft&lt;/td&gt;&lt;td&gt;$40,25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;$1,30 per miglio&lt;/td&gt;&lt;td&gt;75 miglia&lt;/td&gt;&lt;td&gt;97,50&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;$29,50 per job&lt;/td&gt;&lt;td&gt;1 job&lt;/td&gt;&lt;td&gt;29,50&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
      &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$167,25&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Il dato che salta all&#x27;occhio: il &lt;b&gt;viaggio pesa il 58%&lt;/b&gt; del costo del lavoro ($97,50 su $167,25), più del doppio della pulizia vera e propria. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;

    &lt;h3&gt;Simulatore: cambia il lavoro&lt;/h3&gt;
    &lt;p&gt;Muovi i cursori per vedere come cambiano costo ABC e margine. Il grafico mostra il margine al variare delle miglia per la superficie scelta: dove la linea scende sotto zero, il viaggio &quot;si mangia&quot; tutto il profitto. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt; (basato sui rate della slide 6)&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jSq&quot;&gt;Superficie (sq ft)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jSq&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;jSqO&quot;&gt;500&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jMi&quot;&gt;Miglia andata e ritorno&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jMi&quot; min=&quot;0&quot; max=&quot;160&quot; step=&quot;1&quot; value=&quot;75&quot;&gt;&lt;output id=&quot;jMiO&quot;&gt;75&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jP&quot;&gt;Prezzo per 100 sq ft&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jP&quot; min=&quot;15&quot; max=&quot;40&quot; step=&quot;0.25&quot; value=&quot;28&quot;&gt;&lt;output id=&quot;jPO&quot;&gt;$28,00&lt;/output&gt;&lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin:6px 0&quot;&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;500,75,28&quot;&gt;Flying N Ranch&lt;/button&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;1000,30,28&quot;&gt;Job medio&lt;/button&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;2000,8,28&quot;&gt;Grande cliente in città&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;kpis&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Ricavo&lt;/small&gt;&lt;b id=&quot;kRev&quot;&gt;$140,00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Costo ABC&lt;/small&gt;&lt;b id=&quot;kCost&quot;&gt;$167,25&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Customer margin&lt;/small&gt;&lt;b id=&quot;kMar&quot;&gt;−$27,25&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Pareggio a&lt;/small&gt;&lt;b id=&quot;kBe&quot;&gt;54 mi&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 300&quot; id=&quot;jChart&quot; aria-label=&quot;Margine in funzione delle miglia&quot;&gt;&lt;/svg&gt;
      &lt;p class=&quot;small muted&quot; id=&quot;jBreak&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Costo del job&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un cliente a 20 miglia (a/r) chiede la pulizia di 800 sq ft. Costo ABC?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;8 × 8,05 + 20 × 1,30 + 29,50 = 64,40 + 26,00 + 29,50 = &lt;b&gt;$119,90&lt;/b&gt;. Ricavo 8 × 28 = $224, margine +$104,10.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quante miglia può percorrere al massimo un job da 500 sq ft prima di andare in perdita?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Margine = 5 × (28 − 8,05) − 29,50 − 1,30 × m = 70,25 − 1,30 m. Pareggio a m = 70,25 ÷ 1,30 ≈ &lt;b&gt;54 miglia&lt;/b&gt; a/r. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;margin&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 6 · Requirement 4&lt;/span&gt;
    &lt;h2&gt;Customer margin del Flying N Ranch&lt;/h2&gt;
    &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;customer margin&lt;/span&gt; (margine sul cliente) è il ricavo del cliente meno i costi ABC che il cliente ha causato. Non include i costi del pool Other. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales&lt;/b&gt; (5 × $28)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$140,00&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Costs:&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Cleaning carpets&lt;/td&gt;&lt;td&gt;$40,25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Travel to jobs&lt;/td&gt;&lt;td&gt;97,50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Job support&lt;/td&gt;&lt;td&gt;29,50&lt;/td&gt;&lt;td&gt;167,25&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
        &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(27,25)&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;figure style=&quot;margin:0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 300 230&quot; aria-label=&quot;Cascata dal ricavo al margine&quot;&gt;
          &lt;path class=&quot;ax&quot; d=&quot;M20,190 L290,190&quot;/&gt;
          &lt;rect class=&quot;s-sage&quot; x=&quot;30&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;140&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;52&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;140&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;52&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Sales&lt;/text&gt;
          &lt;rect class=&quot;s-ochre&quot; x=&quot;88&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;40.25&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;−40,25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Clean&lt;/text&gt;
          &lt;rect class=&quot;s-acc&quot; x=&quot;146&quot; y=&quot;90.25&quot; width=&quot;44&quot; height=&quot;97.5&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;168&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;−97,50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;168&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Travel&lt;/text&gt;
          &lt;rect class=&quot;s-slate&quot; x=&quot;204&quot; y=&quot;187.75&quot; width=&quot;44&quot; height=&quot;29.5&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;226&quot; y=&quot;181&quot; text-anchor=&quot;middle&quot;&gt;−29,50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;226&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;Support&lt;/text&gt;
          &lt;text x=&quot;268&quot; y=&quot;214&quot; class=&quot;big&quot; style=&quot;fill:var(--neg)&quot; text-anchor=&quot;middle&quot;&gt;−27&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Cascata: il viaggio da solo assorbe il 70% del ricavo. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Il margine negativo è già &quot;prima&quot; dei costi Other.&lt;/b&gt; I $132.000 di costi organization-sustaining e idle capacity devono essere coperti dai margini dei clienti. Un cliente con margine negativo non contribuisce a coprirli: li aumenta. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Customer margin&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che prezzo per 100 sq ft avrebbe portato il Flying N in pareggio?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Serve un ricavo di $167,25 su 5 centinaia: 167,25 ÷ 5 = &lt;b&gt;$33,45&lt;/b&gt; per 100 sq ft (contro $28). &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;La somma dei customer margin di tutti i 2.000 job corrisponde all&#x27;utile aziendale?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No. Somma dei margini = $560.000 − $298.000 = $262.000. Togliendo i $132.000 di Other si ottiene l&#x27;utile di &lt;b&gt;$130.000&lt;/b&gt;. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;profit&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 7 · Requirement 5&lt;/span&gt;
    &lt;h2&gt;Il Flying N Ranch è davvero in perdita?&lt;/h2&gt;
    &lt;p&gt;La risposta delle slide ha due facce: &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sì, sembra di sì…&lt;/h4&gt;&lt;p&gt;Gallatin &lt;b&gt;sembra&lt;/b&gt; perdere denaro sul lavoro: $27,25 di margine negativo.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;…ma con cautela&lt;/h4&gt;&lt;p&gt;Alcuni costi potrebbero &lt;b&gt;non essere evitabili&lt;/b&gt;: sarebbero stati sostenuti anche rifiutando il lavoro. Il punto di partenza giusto è un&#x27;analisi più approfondita.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Avoidable cost&lt;/b&gt; (costo evitabile) — costo che scompare se si rinuncia a una decisione (qui: se non si accetta il job). Un costo &lt;b&gt;unavoidable&lt;/b&gt; resta comunque, per esempio l&#x27;ammortamento dell&#x27;attrezzatura o lo stipendio di un dipendente che sarebbe pagato lo stesso. L&#x27;ABC misura il &lt;b&gt;consumo di risorse&lt;/b&gt;, non necessariamente il &lt;b&gt;risparmio&lt;/b&gt; ottenibile eliminando l&#x27;attività.&lt;/div&gt;
    &lt;p&gt;Eppure, dicono le slide, esiste un punto oltre il quale i costi di viaggio &lt;b&gt;si mangiano tutto il profitto&lt;/b&gt;: con un flat fee indipendente dalla distanza, ci sono lavori che conviene &lt;b&gt;rifiutare&lt;/b&gt;.&lt;/p&gt;

    &lt;h3&gt;Laboratorio: quali costi spariscono davvero?&lt;/h3&gt;
    &lt;p&gt;Spunta le risorse che consideri evitabili per questo singolo lavoro. Il costo del job è scomposto per risorsa con i rate della &lt;a href=&quot;#rates&quot;&gt;parte 4&lt;/a&gt;. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;avTab&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Risorsa consumata dal job&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th&gt;Costo&lt;/th&gt;&lt;th&gt;Evitabile?&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;&lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;kpis&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Costo evitabile&lt;/small&gt;&lt;b id=&quot;avC&quot;&gt;$70,00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Ricavo&lt;/small&gt;&lt;b&gt;$140,00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Margine incrementale&lt;/small&gt;&lt;b id=&quot;avM&quot;&gt;$70,00&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;avTxt&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Come ragionare voce per voce&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;&lt;b&gt;Cleaning supplies&lt;/b&gt;: detergenti consumati sul posto, quasi certamente evitabili. &lt;b&gt;Vehicle expenses&lt;/b&gt;: carburante e usura sì, assicurazione e bollo no, quindi solo in parte. &lt;b&gt;Wages&lt;/b&gt;: dipende dal contratto; se i dipendenti sono pagati a ore e il tempo libero non si recupera, sono evitabili, altrimenti no. &lt;b&gt;Depreciation&lt;/b&gt;: costo già sostenuto (sunk cost), non evitabile nel breve. &lt;b&gt;Office&lt;/b&gt; e &lt;b&gt;President&lt;/b&gt;: un job in più o in meno non li cambia, a meno che i job siano tanti da richiedere più personale d&#x27;ufficio.&lt;/p&gt;
      &lt;p&gt;Il risultato si ribalta facilmente: con soli supplies e vehicle evitabili il job porta &lt;b&gt;+$70&lt;/b&gt;; aggiungendo i salari scende a &lt;b&gt;+$6,25&lt;/b&gt;. È per questo che le slide raccomandano cautela. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Profittabilità&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un margine ABC negativo non implica automaticamente che il job vada rifiutato?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché parte dei costi assegnati (ammortamenti, compenso del titolare, ufficio, forse salari) resterebbe anche senza quel job. Per decidere conta il confronto fra ricavo e &lt;b&gt;costi evitabili&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Allora a che serve l&#x27;ABC, se poi bisogna rifare l&#x27;analisi?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Indica &lt;b&gt;dove&lt;/b&gt; si consumano le risorse e quali clienti sono strutturalmente sottoprezzati. Nel lungo periodo quasi tutti i costi diventano variabili (furgoni, personale, uffici si dimensionano sulla domanda), quindi il segnale ABC conta per strategia e pricing. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;pricing&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 8 · Requirement 6&lt;/span&gt;
    &lt;h2&gt;Consigli sul pricing: fine dei sussidi incrociati&lt;/h2&gt;
    &lt;p&gt;Il consiglio delle slide al titolare: &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;applicare una &lt;b&gt;fee per il viaggio&lt;/b&gt; verso i clienti lontani, basata sulla distanza, e una &lt;b&gt;fee fissa per job&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;oggi i clienti vicini stanno di fatto &lt;b&gt;sussidiando&lt;/b&gt; quelli lontani (&lt;span class=&quot;t&quot;&gt;cross-subsidization&lt;/span&gt;, sussidio incrociato: alcuni clienti pagano più del costo che causano, altri meno);&lt;/li&gt;
      &lt;li&gt;con le fee per viaggio e job support, la tariffa per 100 sq ft può &lt;b&gt;scendere molto&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;si potrebbero perdere alcuni lavori piccoli in zone remote, ma il prezzo più basso può portare &lt;b&gt;molti più clienti vicino a Bozeman&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;se la tariffa è abbastanza bassa, la domanda in più non va nemmeno tolta ai concorrenti: alcuni clienti pulirebbero i tappeti &lt;b&gt;più spesso&lt;/b&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 170&quot; aria-label=&quot;Da tariffa unica a tariffa in tre parti&quot;&gt;
        &lt;rect class=&quot;s-brick&quot; x=&quot;10&quot; y=&quot;40&quot; width=&quot;210&quot; height=&quot;90&quot; rx=&quot;10&quot;/&gt;
        &lt;text class=&quot;big&quot; x=&quot;115&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Oggi: flat fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;115&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot;&gt;$28 × centinaia di sq ft&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;115&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;distanza ignorata&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M228,85 L290,85&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;rect class=&quot;s-ochre&quot; x=&quot;300&quot; y=&quot;15&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;370&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per sq ft&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;370&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;più basso&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;370&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;unit-level&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;455&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+&lt;/text&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;470&quot; y=&quot;15&quot; width=&quot;130&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;535&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per miglio&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;535&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;travel fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;535&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;customer-level&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;615&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+&lt;/text&gt;
        &lt;rect class=&quot;s-sage&quot; x=&quot;630&quot; y=&quot;15&quot; width=&quot;120&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;690&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per job&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;690&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;flat fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;690&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;job-level&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ogni componente del prezzo segue un livello della gerarchia dei costi. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Simulatore di listino&lt;/h3&gt;
    &lt;p&gt;Un esempio numerico costruito per questo riassunto: se travel fee e job fee coprono esattamente i rate ABC ($1,30/miglio, $29,50/job), quale tariffa per 100 sq ft mantiene invariati i ricavi totali di $560.000? (560.000 − 78.000 − 59.000) ÷ 20.000 = &lt;b&gt;$21,15&lt;/b&gt;, un quarto in meno di $28. &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt; (ipotesi: volumi invariati)&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pS&quot;&gt;Tariffa per 100 sq ft&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pS&quot; min=&quot;10&quot; max=&quot;28&quot; step=&quot;0.05&quot; value=&quot;21.15&quot;&gt;&lt;output id=&quot;pSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pM&quot;&gt;Travel fee per miglio&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pM&quot; min=&quot;0&quot; max=&quot;2.5&quot; step=&quot;0.05&quot; value=&quot;1.30&quot;&gt;&lt;output id=&quot;pMO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pJ&quot;&gt;Fee per job&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pJ&quot; min=&quot;0&quot; max=&quot;60&quot; step=&quot;0.5&quot; value=&quot;29.5&quot;&gt;&lt;output id=&quot;pJO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;pTab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;pTot&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Pricing&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Chi sussidia chi con il flat fee attuale?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;I clienti &lt;b&gt;vicini e con grandi superfici&lt;/b&gt; pagano molto più dei costi che causano; quelli &lt;b&gt;lontani e piccoli&lt;/b&gt; pagano meno. Il margine dei primi copre le perdite dei secondi.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è il rischio della nuova politica e perché le slide lo ritengono accettabile?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Si possono perdere lavori piccoli in zone remote, che però erano in perdita. In cambio la tariffa più bassa attira più clienti vicini e aumenta la frequenza degli acquisti.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;confronto&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Parte 9 · Collegamento&lt;/span&gt;
    &lt;h2&gt;Esercizio 1 (Hickory) ed Esercizio 2 (Gallatin) a confronto&lt;/h2&gt;
    &lt;p&gt;L&#x27;esercizio precedente del corso, &lt;i&gt;7.SMA_ABC ex 1 solutions.pdf&lt;/i&gt;, applica l&#x27;ABC a un&#x27;azienda manifatturiera. Le due storie raccontano la &lt;b&gt;stessa distorsione&lt;/b&gt;: un&#x27;unica base legata al volume spalma male i costi che non dipendono dal volume. &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;tabs&quot;&gt;
      &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hickory in breve&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Tabella di confronto&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;La lezione comune&lt;/button&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;Hickory produce 14.000 unità di Y e 6.000 di Z, con $684.000 di overhead. Con un &lt;span class=&quot;t&quot;&gt;plantwide overhead rate&lt;/span&gt; (tasso unico di stabilimento) di $684.000 ÷ 12.000 DLH = &lt;b&gt;$57 per direct labor-hour&lt;/b&gt;, Y riceve $456.000 (66,7%) e Z $228.000 (33,3%). Con l&#x27;ABC (quattro pool: machining $20/MH, setups $500/setup, product design $42.000/prodotto, general factory $25/DLH) Y riceve &lt;b&gt;$407.000&lt;/b&gt; (59%) e Z &lt;b&gt;$277.000&lt;/b&gt; (41%). &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Il motivo: Z, prodotto a basso volume, consuma il 75% dei setup (batch-level) e il 50% del design (product-level). Il sistema tradizionale assegnava troppo a Y e troppo poco a Z.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Ex 1 · Hickory&lt;/th&gt;&lt;th&gt;Ex 2 · Gallatin&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Settore&lt;/td&gt;&lt;td&gt;Manifattura&lt;/td&gt;&lt;td&gt;Servizi&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cost object&lt;/td&gt;&lt;td&gt;Prodotti Y e Z&lt;/td&gt;&lt;td&gt;Singolo job / cliente&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Costi allocati&lt;/td&gt;&lt;td&gt;Solo manufacturing overhead ($684.000), tutti allocati&lt;/td&gt;&lt;td&gt;Tutti i costi ($430.000); Other ($132.000) non allocato&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;First stage&lt;/td&gt;&lt;td&gt;Già data (costi dei pool forniti)&lt;/td&gt;&lt;td&gt;Da calcolare con le % di consumo&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Sistema &quot;tradizionale&quot;&lt;/td&gt;&lt;td&gt;Plantwide rate su DLH&lt;/td&gt;&lt;td&gt;Flat fee su sq ft (un prezzo, non un&#x27;allocazione)&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Chi è sottocostato&lt;/td&gt;&lt;td&gt;Prodotto a basso volume (Z)&lt;/td&gt;&lt;td&gt;Job piccoli e lontani&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Attività che fanno la differenza&lt;/td&gt;&lt;td&gt;Setups (batch), design (product)&lt;/td&gt;&lt;td&gt;Travel (customer), job support (job)&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;p class=&quot;small muted&quot;&gt;Righe compilate da ex 1 e slide; la sintesi è un&#x27;&lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;In entrambi gli esercizi i pool &lt;b&gt;unit-level&lt;/b&gt; danno risultati simili al metodo tradizionale (in Hickory, machining 70/30 e general factory 66,7/33,3 come il plantwide &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;). Le differenze nascono dai costi &lt;b&gt;non legati al volume&lt;/b&gt;: setup e design per Hickory, viaggio e gestione del job per Gallatin.&lt;/p&gt;
        &lt;p&gt;Regola pratica: &lt;b&gt;più un oggetto di costo è piccolo, raro o &quot;scomodo&quot;, più un sistema basato sul volume tende a sottostimarne il costo.&lt;/b&gt; &lt;span class=&quot;src own&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Collegamenti&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale pool di Gallatin è l&#x27;equivalente di &quot;machine setups&quot; di Hickory?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Job support&lt;/b&gt;: un costo fisso per ogni &quot;lotto&quot; (job), indipendente dalla quantità lavorata.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché in Hickory general factory dà le stesse % del plantwide?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché usa la stessa base unit-level (direct labor-hours) del plantwide rate. &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot; style=&quot;background:var(--slate-bg);color:var(--slate)&quot;&gt;Per approfondire&lt;/span&gt;
    &lt;h2&gt;Per approfondire&lt;/h2&gt;
    &lt;p&gt;Le slide di questo esercizio &lt;b&gt;non citano autori, testi, norme né siti&lt;/b&gt;. Qui sotto trovi i riferimenti essenziali sul metodo e sull&#x27;origine dell&#x27;esercizio, cercati sul web. Tutto in questa sezione è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h4&gt;
      &lt;p&gt;Manuale di contabilità direzionale molto diffuso. Il capitolo &quot;Activity-Based Costing: A Tool to Aid Decision Making&quot; (numero diverso a seconda dell&#x27;edizione) usa lo stesso schema delle slide: pool Other per costi organization-sustaining e idle capacity, first stage con le % di consumo, customer margin. Il caso Gallatin Carpet Cleaning compare tra i problemi del manuale (&quot;Evaluating the Profitability of Services&quot;). Conta perché è la fonte probabile dell&#x27;esercizio e spiega la teoria che le slide danno per scontata.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice della 13ª edizione sul sito McGraw-Hill&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Robin Cooper, Robert S. Kaplan — &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, settembre 1988&lt;/h4&gt;
      &lt;p&gt;Uno degli articoli che hanno reso popolare l&#x27;ABC: mostra come i sistemi tradizionali basati sul volume distorcono il costo di prodotti e clienti e portano a decisioni sbagliate di prezzo e di mix. È la base concettuale di entrambi gli esercizi del corso.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;articolo (Ivey Publishing)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Robert S. Kaplan, V.G. Narayanan — &quot;Measuring and Managing Customer Profitability&quot;, &lt;i&gt;Cost Management&lt;/i&gt;, 2001&lt;/h4&gt;
      &lt;p&gt;Applica l&#x27;ABC alla redditività dei clienti, proprio come fa il requirement 4: mostra che pochi clienti generano gran parte del profitto e alcuni lo distruggono, e discute pricing, costi di servizio e azioni correttive. Utile per approfondire il customer margin e i sussidi incrociati.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.hbs.edu/faculty/Pages/item.aspx?num=11052&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Harvard Business School&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson — &quot;Time-Driven Activity-Based Costing&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, novembre 2004&lt;/h4&gt;
      &lt;p&gt;Propone una versione semplificata dell&#x27;ABC: invece di interviste sulle % di consumo (come nella first stage di Gallatin), si stimano il costo per minuto della capacità e il tempo di ogni attività. Rende visibile la capacità inutilizzata, il tema del pool Other. Seguito dal libro omonimo del 2007.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&quot;Rethinking Activity-Based Costing&quot;, HBS Working Knowledge&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
