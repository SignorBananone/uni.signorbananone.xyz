*{box-sizing:border-box}

        &lt;a href=&quot;#job&quot; class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;575&quot; y=&quot;233&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;650&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot;&gt;3 · Job cost&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;650&quot; y=&quot;276&quot; text-anchor=&quot;middle&quot;&gt;rate × usage&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#margin&quot; class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;755&quot; y=&quot;233&quot; width=&quot;130&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;820&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot;&gt;4 · Margin&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;820&quot; y=&quot;276&quot; text-anchor=&quot;middle&quot;&gt;$140 − $167.25&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#profit&quot; class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;605&quot; y=&quot;342&quot; width=&quot;155&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;682&quot; y=&quot;366&quot; text-anchor=&quot;middle&quot;&gt;5 · Conclusions&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;682&quot; y=&quot;385&quot; text-anchor=&quot;middle&quot;&gt;avoidable costs?&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#pricing&quot; class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;410&quot; y=&quot;342&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;485&quot; y=&quot;366&quot; text-anchor=&quot;middle&quot;&gt;6 · Pricing&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;485&quot; y=&quot;385&quot; text-anchor=&quot;middle&quot;&gt;end of subsidies&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#confronto&quot; class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;575&quot; y=&quot;66&quot; width=&quot;160&quot; height=&quot;58&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;tt&quot; x=&quot;655&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Ex 1 · Hickory&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;655&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot;&gt;plantwide vs ABC&lt;/text&gt;&lt;/a&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent-bg);border-color:var(--accent)&quot;&gt;&lt;/i&gt;context&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage-bg);border-color:var(--sage)&quot;&gt;&lt;/i&gt;concepts&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ochre-bg);border-color:var(--ochre)&quot;&gt;&lt;/i&gt;calculations&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate-bg);border-color:var(--slate)&quot;&gt;&lt;/i&gt;analysis and decisions&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick-bg);border-color:var(--brick)&quot;&gt;&lt;/i&gt;links&lt;/span&gt;&lt;/div&gt;

&lt;section class=&quot;part&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Part 1 · Context&lt;/span&gt;
    &lt;h2&gt;The Gallatin Carpet Cleaning case&lt;/h2&gt;
    &lt;p&gt;&lt;b&gt;Gallatin Carpet Cleaning&lt;/b&gt; is a small family-owned business in Bozeman (Montana) that cleans carpets and rugs. It has always charged a &lt;span class=&quot;t&quot;&gt;flat fee&lt;/span&gt; (a single rate, the same for every customer): &lt;b&gt;$28 per hundred square feet&lt;/b&gt;, i.e. for every 100 square feet cleaned (about 9.3 m²). &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;The question: does the company &lt;b&gt;actually make money&lt;/b&gt; on every customer? In particular, on those located on &lt;b&gt;remote ranches&lt;/b&gt;, which require a great deal of travel time. The owner&#x27;s daughter proposes using &lt;span class=&quot;t&quot;&gt;activity-based costing&lt;/span&gt; (ABC, a costing method based on activities) and designs a simple system with &lt;b&gt;four activity cost pools&lt;/b&gt;.&lt;/p&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;h4&gt;The four activities &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/h4&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;Annual activity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;Square feet cleaned (00s)&lt;/td&gt;&lt;td&gt;20,000 hundred sq ft&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;Miles driven&lt;/td&gt;&lt;td&gt;60,000 miles&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;Number of jobs&lt;/td&gt;&lt;td&gt;2,000 jobs&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;not applicable&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;p class=&quot;small muted&quot;&gt;&lt;i&gt;Other&lt;/i&gt; collects &lt;span class=&quot;t&quot;&gt;organization-sustaining costs&lt;/span&gt; (costs that keep the business as a whole running) and &lt;span class=&quot;t&quot;&gt;idle capacity costs&lt;/span&gt; (the cost of unused capacity). &lt;i&gt;Job support&lt;/i&gt; = taking calls from prospective customers, scheduling jobs, billing, resolving problems. &lt;span class=&quot;src&quot;&gt;slides 2–3&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;h4&gt;Costs for the year &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h4&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Resource&lt;/th&gt;&lt;th&gt;Cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning supplies (detergents, materials)&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cleaning equipment depreciation (machines)&lt;/td&gt;&lt;td&gt;20,000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Vehicle expenses (vans)&lt;/td&gt;&lt;td&gt;80,000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Office expenses&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;President&#x27;s compensation (owner&#x27;s pay)&lt;/td&gt;&lt;td&gt;80,000&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
          &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;$430,000&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
        &lt;/table&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The six requirements of the exercise &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;1.&lt;/b&gt; First-stage allocation: distribute costs to the pools. &lt;a href=&quot;#stage1&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Compute the activity rate for each pool. &lt;a href=&quot;#rates&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;3.&lt;/b&gt; ABC cost of the job at the &lt;b&gt;Flying N Ranch&lt;/b&gt;: 500 sq ft, 75 miles round trip. &lt;a href=&quot;#job&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Customer margin: revenue of $140 (5 × $28) minus cost. &lt;a href=&quot;#margin&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Is the job profitable? Explain. &lt;a href=&quot;#profit&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Advice to the owner on future pricing. &lt;a href=&quot;#pricing&quot;&gt;→&lt;/a&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Watch the units.&lt;/b&gt; The cleaning activity is measured in &lt;b&gt;hundreds&lt;/b&gt; of square feet: 500 sq ft = &lt;b&gt;5&lt;/b&gt; units of activity. This is the most common exam mistake: multiplying $8.05 by 500 instead of by 5. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Is the case clear?&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does the owner suspect the company is losing money on ranches if the fee is the same for everyone?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because the price depends only on square footage, whereas costs also depend on &lt;b&gt;distance&lt;/b&gt; (miles driven, employee time) and on the &lt;b&gt;number of jobs&lt;/b&gt; (phone calls, billing). A small, distant job consumes many resources but generates little revenue.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;How many square feet did the company clean during the year? What is total revenue under the flat fee?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;20,000 hundreds = &lt;b&gt;2,000,000 sq ft&lt;/b&gt;. Revenue = 20,000 × $28 = &lt;b&gt;$560,000&lt;/b&gt;. With costs of $430,000, overall profit is $130,000: the company as a whole is profitable; the issue is &lt;i&gt;where&lt;/i&gt; it makes money and where it loses it. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;abc&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 2 · Concepts&lt;/span&gt;
    &lt;h2&gt;The ABC concepts needed here&lt;/h2&gt;
    &lt;p&gt;The slides for this exercise take the theory for granted. Here is the essential vocabulary, using the course&#x27;s English terminology.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-based costing (ABC)&lt;/b&gt; — a method that assigns indirect costs to cost objects (products, services, customers, individual jobs) according to the &lt;b&gt;activities&lt;/b&gt; they consume, rather than through a single base such as direct labor-hours.&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt; — a &quot;bucket&quot; in which the costs of an activity are accumulated (e.g. Travel to jobs).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity measure&lt;/b&gt; (or cost driver) — the quantity that measures how much of an activity a cost object consumes (e.g. miles driven).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt; — the cost of the pool divided by total activity: the &quot;internal price&quot; of one unit of activity (e.g. $1.30 per mile).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost object&lt;/b&gt; — the item whose cost we want to measure: here the individual &lt;i&gt;job&lt;/i&gt;, i.e. the work performed for a customer.&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The two-stage model&lt;/h3&gt;
    &lt;p&gt;ABC proceeds in two stages. Step through them:&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-onstep=&quot;twoStage&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; aria-label=&quot;Two-stage ABC model&quot; id=&quot;twostage&quot;&gt;
        &lt;g id=&quot;ts-res&quot;&gt;
          &lt;rect class=&quot;s-slate&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;95&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Resources&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;Wages&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Supplies&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Depreciation&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;Vehicle&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot;&gt;Office&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;95&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;President&lt;/text&gt;
        &lt;/g&gt;
        &lt;g id=&quot;ts-a1&quot; opacity=&quot;.15&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M185,125 L280,125&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;232&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot;&gt;% usage&lt;/text&gt;&lt;/g&gt;
        &lt;g id=&quot;ts-pool&quot; opacity=&quot;.15&quot;&gt;
          &lt;rect class=&quot;s-ochre&quot; x=&quot;285&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;380&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Activity cost pools&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Cleaning $161,000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;Travel $78,000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;Job support $59,000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;Other $132,000&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;(not assigned)&lt;/text&gt;
        &lt;/g&gt;
        &lt;g id=&quot;ts-a2&quot; opacity=&quot;.15&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M480,110 L575,110&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;527&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;rate × usage&lt;/text&gt;&lt;/g&gt;
        &lt;g id=&quot;ts-obj&quot; opacity=&quot;.15&quot;&gt;
          &lt;rect class=&quot;s-sage&quot; x=&quot;580&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;210&quot; rx=&quot;10&quot;/&gt;
          &lt;text class=&quot;big&quot; x=&quot;665&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot;&gt;Cost object&lt;/text&gt;
          &lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Flying N Ranch job&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;$167.25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;compared with&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;665&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;revenue of $140&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Starting point.&lt;/b&gt; Costs are recorded in the accounts by &lt;i&gt;nature&lt;/i&gt; (wages, vans, office…). In this form they tell us nothing about the cost of a single job.&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;First-stage allocation.&lt;/b&gt; Through interviews and estimates, the company determines what percentage of each resource is consumed by each activity (e.g. 20% of wages goes to travel). Costs flow from resources to pools. &lt;span class=&quot;src&quot;&gt;slides 3, 5&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Activity rates.&lt;/b&gt; The cost of each pool is divided by its total annual activity. The &lt;i&gt;Other&lt;/i&gt; pool has no activity measure and therefore &lt;b&gt;remains outside&lt;/b&gt;: it is not assigned to jobs. &lt;span class=&quot;src&quot;&gt;slides 2, 6&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Second-stage allocation.&lt;/b&gt; Each job is charged cost = rate × activity consumed. The result is compared with the job&#x27;s revenue: this is the &lt;span class=&quot;t&quot;&gt;customer margin&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slides 7–8&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt small muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The activity hierarchy&lt;/h3&gt;
    &lt;p&gt;Activities are classified according to &lt;b&gt;what causes them to vary&lt;/b&gt;. In Exercise 1 the course uses the terms &lt;i&gt;unit-level&lt;/i&gt;, &lt;i&gt;batch-level&lt;/i&gt; and &lt;i&gt;product-level&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;; here &lt;i&gt;organization-sustaining&lt;/i&gt; also appears &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;. Click on the levels:&lt;/p&gt;
    &lt;div class=&quot;tabs&quot;&gt;
      &lt;div role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Unit-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Batch / job-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Customer-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Organization-sustaining&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Unit-level&lt;/b&gt;: performed for each unit produced or served; the cost rises with volume. Example in Hickory: &lt;i&gt;machining&lt;/i&gt; (machine-hours) &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. &lt;b&gt;In Gallatin&lt;/b&gt;: &lt;i&gt;Cleaning carpets&lt;/i&gt;, which grows with every hundred square feet.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Batch-level&lt;/b&gt;: performed once per batch, regardless of how many units it contains. In Hickory: &lt;i&gt;machine setups&lt;/i&gt;, &quot;not affected by the number of units processed once the setup is completed&quot; &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. &lt;b&gt;In Gallatin&lt;/b&gt; the &quot;batch&quot; is the &lt;b&gt;job&lt;/b&gt;: &lt;i&gt;Job support&lt;/i&gt; (phone call, scheduling, invoice) costs the same for 300 sq ft as for 3,000 sq ft. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Product-level&lt;/b&gt;: needed to keep a product or service in the range, irrespective of batches and units. In Hickory: &lt;i&gt;product design&lt;/i&gt;, $42,000 per product &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;. Gallatin has none: it offers a single service.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Customer-level&lt;/b&gt;: related to individual customers rather than to volume (visits, support, travel to the customer). &lt;i&gt;Travel to jobs&lt;/i&gt; depends on &lt;b&gt;where&lt;/b&gt; the customer is located: it is measured in miles, but it is the customer that determines them. This is precisely the activity the flat fee ignores. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt; (a classification typical of textbooks, e.g. Garrison et al.)&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Organization-sustaining&lt;/b&gt;: costs that serve the business as a whole and do not depend on customers, products or volumes (part of the owner&#x27;s compensation, part of the office). Together with &lt;b&gt;idle capacity&lt;/b&gt; they end up in the &lt;i&gt;Other&lt;/i&gt; pool, which is &lt;b&gt;not assigned&lt;/b&gt; to jobs because any allocation basis would be arbitrary. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;Why are idle capacity costs not assigned?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Unused capacity (e.g. a van that sits idle 40% of the time) is not consumed by any customer. Charging it to jobs would make a job look expensive simply because the company has more resources than it uses. Garrison-style ABC keeps it separate so that management sees it as a cost of inefficiency, not of customers. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;ABC in a service company: what changes?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In Exercise 1 the cost object was a &lt;b&gt;product&lt;/b&gt; (Y and Z) and the costs were factory overhead. Here the cost object is a &lt;b&gt;job/customer&lt;/b&gt;, and &lt;b&gt;all&lt;/b&gt; company costs are allocated, including wages and the owner&#x27;s compensation. The logic is the same: resources are consumed through activities. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Concepts&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between an activity cost pool and an activity measure?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;The &lt;b&gt;pool&lt;/b&gt; accumulates the dollars of cost of an activity; the &lt;b&gt;measure&lt;/b&gt; is the unit used to count how much of that activity each cost object consumes. Rate = pool ÷ total measure.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Is job support unit-level or batch-level? Why?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Batch (job)-level: it is performed once per job and does not depend on how many square feet are cleaned, just as Hickory&#x27;s setup does not depend on the number of units in the batch.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does the Other pool have no activity measure?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;It contains organization-sustaining and idle capacity costs, which are not caused by any job. No measure explains their consumption, so they are not allocated to customers.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;stage1&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 3 · Requirement 1&lt;/span&gt;
    &lt;h2&gt;First-stage allocation: from resources to pools&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;t&quot;&gt;First-stage allocation&lt;/span&gt; distributes each cost item among the pools according to the resource consumption percentages. Each cell is calculated as follows: &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;Cost in pool = % of consumption × total cost of the resource&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;e.g. Wages → Cleaning: 70% × $150,000 = $105,000&lt;/span&gt;&lt;/div&gt;

    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;align-items:center&quot;&gt;
      &lt;button class=&quot;btn&quot; id=&quot;s1pct&quot; aria-pressed=&quot;false&quot;&gt;Show percentages&lt;/button&gt;
      &lt;button class=&quot;btn&quot; id=&quot;s1usd&quot; aria-pressed=&quot;true&quot;&gt;Show dollars&lt;/button&gt;
      &lt;span class=&quot;small muted&quot;&gt;Click on a cell to see the calculation.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;s1tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot; id=&quot;s1out&quot; aria-live=&quot;polite&quot;&gt;Click on a cell in the table.&lt;/div&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 120&quot; aria-label=&quot;Breakdown of the $430,000 among the pools&quot;&gt;
        &lt;rect class=&quot;s-ochre&quot; x=&quot;20&quot; y=&quot;20&quot; width=&quot;269.6&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;289.6&quot; y=&quot;20&quot; width=&quot;130.6&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-sage&quot; x=&quot;420.2&quot; y=&quot;20&quot; width=&quot;98.8&quot; height=&quot;44&quot;/&gt;
        &lt;rect class=&quot;s-brick&quot; x=&quot;519&quot; y=&quot;20&quot; width=&quot;221&quot; height=&quot;44&quot; style=&quot;stroke-dasharray:4 3&quot;/&gt;
        &lt;text class=&quot;big&quot; x=&quot;154.8&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Cleaning 161k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;354.9&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Travel 78k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;469.6&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Support 59k&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;629.5&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;Other 132k&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;154.8&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;37.4%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;354.9&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;18.1%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;469.6&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;13.7%&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;629.5&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;30.7%&lt;/text&gt;
        &lt;path class=&quot;ax&quot; d=&quot;M20,100 L519,100&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;270&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;$298,000 assignable to jobs&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Almost one third of the costs (Other, $132,000) will never be attributed to individual jobs. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt; (percentages calculated from the data in slide 5)&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Reconciliation check.&lt;/b&gt; The sum of the pool totals must equal total cost: 161,000 + 78,000 + 59,000 + 132,000 = &lt;b&gt;$430,000&lt;/b&gt;. Each row must add up to 100%. Always do this in the exam. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;First stage&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;How much of the vehicle expenses ends up in Travel to jobs? And in Other?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;60% × $80,000 = &lt;b&gt;$48,000&lt;/b&gt; in Travel; 40% × $80,000 = &lt;b&gt;$32,000&lt;/b&gt; in Other (e.g. idle vans, idle capacity).&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which resources make up the Job support pool?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Office expenses 45% ($27,000) + President&#x27;s compensation 40% ($32,000) = &lt;b&gt;$59,000&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If 10% of wages were moved from Other to Travel, what would the Travel pool be?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Travel would receive 30% of wages: $45,000 + $48,000 = &lt;b&gt;$93,000&lt;/b&gt; (rate of $1.55 per mile). First-stage estimates directly affect the results. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;rates&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 4 · Requirement 2&lt;/span&gt;
    &lt;h2&gt;Activity rates: the price of one unit of activity&lt;/h2&gt;
    &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;(a) Total cost of the pool&lt;/span&gt;&lt;span&gt;(b) Total activity&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Total cost&lt;/th&gt;&lt;th&gt;(b) Total activity&lt;/th&gt;&lt;th&gt;(a) ÷ (b) Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;$161,000&lt;/td&gt;&lt;td&gt;20,000 hundred sq ft&lt;/td&gt;&lt;td&gt;&lt;b&gt;$8.05&lt;/b&gt; per 100 sq ft&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;$78,000&lt;/td&gt;&lt;td&gt;60,000 miles&lt;/td&gt;&lt;td&gt;&lt;b&gt;$1.30&lt;/b&gt; per mile&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;$59,000&lt;/td&gt;&lt;td&gt;2,000 jobs&lt;/td&gt;&lt;td&gt;&lt;b&gt;$29.50&lt;/b&gt; per job&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Source: slide 6. The Other pool has no rate because it has no activity measure.&lt;/p&gt;

    &lt;h3&gt;Inside each rate&lt;/h3&gt;
    &lt;p&gt;A useful way to understand the rates is to break them down by resource: each cost in the pool divided by the same activity. This will be needed in &lt;a href=&quot;#profit&quot;&gt;Part 7&lt;/a&gt; to identify which costs are avoidable. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 210&quot; aria-label=&quot;Breakdown of the activity rates by resource&quot;&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;40&quot;&gt;Cleaning&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;54&quot;&gt;$8.05/100 sq ft&lt;/text&gt;
        &lt;rect class=&quot;s-slate&quot; x=&quot;130&quot; y=&quot;25&quot; width=&quot;391&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-ochre&quot; x=&quot;521&quot; y=&quot;25&quot; width=&quot;149&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-brick&quot; x=&quot;670&quot; y=&quot;25&quot; width=&quot;60&quot; height=&quot;34&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;325&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;wages 5.25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;595&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;supplies 2.00&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;700&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot;&gt;dep. 0.80&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;105&quot;&gt;Travel&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;119&quot;&gt;$1.30/mile&lt;/text&gt;
        &lt;rect class=&quot;s-slate&quot; x=&quot;130&quot; y=&quot;90&quot; width=&quot;231&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-sage&quot; x=&quot;361&quot; y=&quot;90&quot; width=&quot;369&quot; height=&quot;34&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;245&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;wages 0.50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;545&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;vehicle 0.80&lt;/text&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;170&quot;&gt;Job support&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;10&quot; y=&quot;184&quot;&gt;$29.50/job&lt;/text&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;130&quot; y=&quot;155&quot; width=&quot;275&quot; height=&quot;34&quot;/&gt;&lt;rect class=&quot;s-slate&quot; x=&quot;405&quot; y=&quot;155&quot; width=&quot;325&quot; height=&quot;34&quot; style=&quot;stroke-dasharray:4 3&quot;/&gt;
        &lt;text class=&quot;lbl&quot; x=&quot;267&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot;&gt;office 13.50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;567&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot;&gt;president 16.00&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Each bar represents 100% of its rate. E.g. wages in Cleaning = $105,000 ÷ 20,000 = $5.25. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;details&gt;&lt;summary&gt;Why is the denominator the activity &quot;for the year&quot; rather than maximum capacity?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The slides use the actual/expected activity for the year. If practical capacity were used instead, the rate would be lower and the difference (the cost of unused capacity) would emerge as idle capacity, which here is already partly separated in the Other pool. This is the same idea that gave rise to &lt;i&gt;time-driven ABC&lt;/i&gt; (see &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;). &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Activity rates&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the average ABC cost of a job, given that an average job covers 1,000 sq ft and 30 miles?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Averages: 20,000/2,000 = 10 hundred sq ft per job; 60,000/2,000 = 30 miles. Cost = 10 × 8.05 + 30 × 1.30 + 29.50 = 80.50 + 39.00 + 29.50 = &lt;b&gt;$149.00&lt;/b&gt;, against average revenue of $280. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is the $29.50 per job the same for a large job and a small one?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because job support is a job-level (batch) activity: the phone call, scheduling and invoice require the same effort regardless of the area cleaned.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;job&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 5 · Requirement 3&lt;/span&gt;
    &lt;h2&gt;The cost of the Flying N Ranch job&lt;/h2&gt;
    &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;second stage&lt;/span&gt;: each activity rate is multiplied by the activity consumed by the job. The Flying N Ranch: &lt;b&gt;500 sq ft&lt;/b&gt; (= 5 hundreds), &lt;b&gt;75 miles&lt;/b&gt; round trip, &lt;b&gt;1 job&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 4, 7&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ABC cost of the job = Σ (activity rate × activity consumed)&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Activity rate&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;(a) × (b) ABC cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Cleaning carpets&lt;/td&gt;&lt;td&gt;$8.05 per 100 sq ft&lt;/td&gt;&lt;td&gt;5 hundred sq ft&lt;/td&gt;&lt;td&gt;$40.25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Travel to jobs&lt;/td&gt;&lt;td&gt;$1.30 per mile&lt;/td&gt;&lt;td&gt;75 miles&lt;/td&gt;&lt;td&gt;97.50&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Job support&lt;/td&gt;&lt;td&gt;$29.50 per job&lt;/td&gt;&lt;td&gt;1 job&lt;/td&gt;&lt;td&gt;29.50&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
      &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$167.25&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;The striking figure: &lt;b&gt;travel accounts for 58%&lt;/b&gt; of the job&#x27;s cost ($97.50 out of $167.25), more than twice the cleaning itself. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;

    &lt;h3&gt;Simulator: change the job&lt;/h3&gt;
    &lt;p&gt;Move the sliders to see how ABC cost and margin change. The chart shows the margin as a function of miles for the selected area: where the line falls below zero, travel &quot;eats up&quot; all the profit. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt; (based on the rates in slide 6)&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jSq&quot;&gt;Area (sq ft)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jSq&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;jSqO&quot;&gt;500&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jMi&quot;&gt;Round-trip miles&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jMi&quot; min=&quot;0&quot; max=&quot;160&quot; step=&quot;1&quot; value=&quot;75&quot;&gt;&lt;output id=&quot;jMiO&quot;&gt;75&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;jP&quot;&gt;Price per 100 sq ft&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;jP&quot; min=&quot;15&quot; max=&quot;40&quot; step=&quot;0.25&quot; value=&quot;28&quot;&gt;&lt;output id=&quot;jPO&quot;&gt;$28.00&lt;/output&gt;&lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin:6px 0&quot;&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;500,75,28&quot;&gt;Flying N Ranch&lt;/button&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;1000,30,28&quot;&gt;Average job&lt;/button&gt;&lt;button class=&quot;btn&quot; data-preset=&quot;2000,8,28&quot;&gt;Large city customer&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;kpis&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Revenue&lt;/small&gt;&lt;b id=&quot;kRev&quot;&gt;$140.00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;ABC cost&lt;/small&gt;&lt;b id=&quot;kCost&quot;&gt;$167.25&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Customer margin&lt;/small&gt;&lt;b id=&quot;kMar&quot;&gt;−$27.25&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Break-even at&lt;/small&gt;&lt;b id=&quot;kBe&quot;&gt;54 mi&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 300&quot; id=&quot;jChart&quot; aria-label=&quot;Margin as a function of miles&quot;&gt;&lt;/svg&gt;
      &lt;p class=&quot;small muted&quot; id=&quot;jBreak&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Job cost&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A customer 20 miles away (round trip) requests cleaning of 800 sq ft. What is the ABC cost?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;8 × 8.05 + 20 × 1.30 + 29.50 = 64.40 + 26.00 + 29.50 = &lt;b&gt;$119.90&lt;/b&gt;. Revenue 8 × 28 = $224, margin +$104.10.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the maximum number of miles a 500 sq ft job can involve before it makes a loss?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Margin = 5 × (28 − 8.05) − 29.50 − 1.30 × m = 70.25 − 1.30 m. Break-even at m = 70.25 ÷ 1.30 ≈ &lt;b&gt;54 miles&lt;/b&gt; round trip. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;margin&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 6 · Requirement 4&lt;/span&gt;
    &lt;h2&gt;Customer margin of the Flying N Ranch&lt;/h2&gt;
    &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;customer margin&lt;/span&gt; is the revenue from a customer minus the ABC costs caused by that customer. It does not include the costs of the Other pool. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales&lt;/b&gt; (5 × $28)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$140.00&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Costs:&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Cleaning carpets&lt;/td&gt;&lt;td&gt;$40.25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Travel to jobs&lt;/td&gt;&lt;td&gt;97.50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Job support&lt;/td&gt;&lt;td&gt;29.50&lt;/td&gt;&lt;td&gt;167.25&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
        &lt;tfoot&gt;&lt;tr&gt;&lt;td&gt;Margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(27.25)&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;figure style=&quot;margin:0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 300 230&quot; aria-label=&quot;Waterfall from revenue to margin&quot;&gt;
          &lt;path class=&quot;ax&quot; d=&quot;M20,190 L290,190&quot;/&gt;
          &lt;rect class=&quot;s-sage&quot; x=&quot;30&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;140&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;52&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;140&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;52&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Sales&lt;/text&gt;
          &lt;rect class=&quot;s-ochre&quot; x=&quot;88&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;40.25&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;−40.25&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Clean&lt;/text&gt;
          &lt;rect class=&quot;s-acc&quot; x=&quot;146&quot; y=&quot;90.25&quot; width=&quot;44&quot; height=&quot;97.5&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;168&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;−97.50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;168&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;Travel&lt;/text&gt;
          &lt;rect class=&quot;s-slate&quot; x=&quot;204&quot; y=&quot;187.75&quot; width=&quot;44&quot; height=&quot;29.5&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;226&quot; y=&quot;181&quot; text-anchor=&quot;middle&quot;&gt;−29.50&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;226&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;Support&lt;/text&gt;
          &lt;text x=&quot;268&quot; y=&quot;214&quot; class=&quot;big&quot; style=&quot;fill:var(--neg)&quot; text-anchor=&quot;middle&quot;&gt;−27&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Waterfall: travel alone absorbs 70% of revenue. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;The margin is negative even &quot;before&quot; the Other costs.&lt;/b&gt; The $132,000 of organization-sustaining and idle capacity costs must be covered by customer margins. A customer with a negative margin does not help cover them: it increases them. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Customer margin&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What price per 100 sq ft would have brought the Flying N job to break-even?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Revenue of $167.25 is needed on 5 hundreds: 167.25 ÷ 5 = &lt;b&gt;$33.45&lt;/b&gt; per 100 sq ft (compared with $28). &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Does the sum of the customer margins of all 2,000 jobs equal the company&#x27;s profit?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No. Sum of margins = $560,000 − $298,000 = $262,000. Subtracting the $132,000 of Other gives the profit of &lt;b&gt;$130,000&lt;/b&gt;. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;profit&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 7 · Requirement 5&lt;/span&gt;
    &lt;h2&gt;Is the Flying N Ranch job really unprofitable?&lt;/h2&gt;
    &lt;p&gt;The answer in the slides has two sides: &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Yes, it appears so…&lt;/h4&gt;&lt;p&gt;Gallatin &lt;b&gt;appears&lt;/b&gt; to lose money on the job: a negative margin of $27.25.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;…but with caution&lt;/h4&gt;&lt;p&gt;Some costs may &lt;b&gt;not be avoidable&lt;/b&gt;: they would have been incurred even if the job had been turned down. The right starting point is a more in-depth analysis.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Avoidable cost&lt;/b&gt; — a cost that disappears if a decision is not taken (here: if the job is not accepted). An &lt;b&gt;unavoidable&lt;/b&gt; cost remains regardless, for example equipment depreciation or the salary of an employee who would be paid anyway. ABC measures &lt;b&gt;resource consumption&lt;/b&gt;, not necessarily the &lt;b&gt;savings&lt;/b&gt; obtainable by eliminating the activity.&lt;/div&gt;
    &lt;p&gt;Nevertheless, the slides note, there is a point beyond which travel costs &lt;b&gt;eat up all the profit&lt;/b&gt;: with a flat fee that does not depend on distance, there are jobs that are worth &lt;b&gt;turning down&lt;/b&gt;.&lt;/p&gt;

    &lt;h3&gt;Lab: which costs actually disappear?&lt;/h3&gt;
    &lt;p&gt;Tick the resources you consider avoidable for this single job. The job&#x27;s cost is broken down by resource using the rates from &lt;a href=&quot;#rates&quot;&gt;Part 4&lt;/a&gt;. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;avTab&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Resource consumed by the job&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th&gt;Cost&lt;/th&gt;&lt;th&gt;Avoidable?&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;&lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;kpis&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Avoidable cost&lt;/small&gt;&lt;b id=&quot;avC&quot;&gt;$70.00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Revenue&lt;/small&gt;&lt;b&gt;$140.00&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;small&gt;Incremental margin&lt;/small&gt;&lt;b id=&quot;avM&quot;&gt;$70.00&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;avTxt&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;How to reason item by item&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;&lt;b&gt;Cleaning supplies&lt;/b&gt;: detergents used on site, almost certainly avoidable. &lt;b&gt;Vehicle expenses&lt;/b&gt;: fuel and wear yes, insurance and road tax no, so only partly. &lt;b&gt;Wages&lt;/b&gt;: depends on the contract; if employees are paid by the hour and the freed-up time is not otherwise used, they are avoidable, otherwise not. &lt;b&gt;Depreciation&lt;/b&gt;: a cost already incurred (sunk cost), not avoidable in the short run. &lt;b&gt;Office&lt;/b&gt; and &lt;b&gt;President&lt;/b&gt;: one job more or less does not change them, unless there are so many jobs that more office staff are needed.&lt;/p&gt;
      &lt;p&gt;The result easily flips: with only supplies and vehicle avoidable, the job contributes &lt;b&gt;+$70&lt;/b&gt;; adding wages brings it down to &lt;b&gt;+$6.25&lt;/b&gt;. This is why the slides recommend caution. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Profitability&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does a negative ABC margin not automatically mean the job should be turned down?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because part of the assigned costs (depreciation, owner&#x27;s compensation, office, possibly wages) would remain even without that job. For the decision, what matters is the comparison between revenue and &lt;b&gt;avoidable costs&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;So what is ABC for, if the analysis has to be redone anyway?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;It shows &lt;b&gt;where&lt;/b&gt; resources are consumed and which customers are structurally underpriced. In the long run almost all costs become variable (vans, staff and offices are sized to demand), so the ABC signal matters for strategy and pricing. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;pricing&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 8 · Requirement 6&lt;/span&gt;
    &lt;h2&gt;Pricing advice: the end of cross-subsidization&lt;/h2&gt;
    &lt;p&gt;The slides&#x27; advice to the owner: &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;charge a distance-based &lt;b&gt;travel fee&lt;/b&gt; to distant customers and a &lt;b&gt;fixed fee per job&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;at present, nearby customers are effectively &lt;b&gt;subsidizing&lt;/b&gt; distant ones (&lt;span class=&quot;t&quot;&gt;cross-subsidization&lt;/span&gt;: some customers pay more than the cost they cause, others less);&lt;/li&gt;
      &lt;li&gt;with fees for travel and job support, the rate per 100 sq ft can &lt;b&gt;fall considerably&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;some small jobs in remote areas might be lost, but the lower price may attract &lt;b&gt;many more customers near Bozeman&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;if the rate is low enough, the additional demand need not even be taken from competitors: some customers would have their carpets cleaned &lt;b&gt;more often&lt;/b&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 170&quot; aria-label=&quot;From a single flat fee to a three-part tariff&quot;&gt;
        &lt;rect class=&quot;s-brick&quot; x=&quot;10&quot; y=&quot;40&quot; width=&quot;210&quot; height=&quot;90&quot; rx=&quot;10&quot;/&gt;
        &lt;text class=&quot;big&quot; x=&quot;115&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Today: flat fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;115&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot;&gt;$28 × hundreds of sq ft&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;115&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;distance ignored&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M228,85 L290,85&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;rect class=&quot;s-ochre&quot; x=&quot;300&quot; y=&quot;15&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;370&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per sq ft&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;370&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;lower&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;370&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;unit-level&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;455&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+&lt;/text&gt;
        &lt;rect class=&quot;s-acc&quot; x=&quot;470&quot; y=&quot;15&quot; width=&quot;130&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;535&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per mile&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;535&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;travel fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;535&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;customer-level&lt;/text&gt;
        &lt;text class=&quot;big&quot; x=&quot;615&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+&lt;/text&gt;
        &lt;rect class=&quot;s-sage&quot; x=&quot;630&quot; y=&quot;15&quot; width=&quot;120&quot; height=&quot;140&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;big&quot; x=&quot;690&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;per job&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;690&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;flat fee&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;690&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;job-level&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Each component of the price follows one level of the cost hierarchy. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Price list simulator&lt;/h3&gt;
    &lt;p&gt;A numerical example built for this summary: if the travel fee and job fee exactly cover the ABC rates ($1.30/mile, $29.50/job), what rate per 100 sq ft keeps total revenue unchanged at $560,000? (560,000 − 78,000 − 59,000) ÷ 20,000 = &lt;b&gt;$21.15&lt;/b&gt;, a quarter less than $28. &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt; (assumption: unchanged volumes)&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pS&quot;&gt;Rate per 100 sq ft&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pS&quot; min=&quot;10&quot; max=&quot;28&quot; step=&quot;0.05&quot; value=&quot;21.15&quot;&gt;&lt;output id=&quot;pSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pM&quot;&gt;Travel fee per mile&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pM&quot; min=&quot;0&quot; max=&quot;2.5&quot; step=&quot;0.05&quot; value=&quot;1.30&quot;&gt;&lt;output id=&quot;pMO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pJ&quot;&gt;Fee per job&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pJ&quot; min=&quot;0&quot; max=&quot;60&quot; step=&quot;0.5&quot; value=&quot;29.5&quot;&gt;&lt;output id=&quot;pJO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;pTab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;pTot&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Pricing&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Who subsidizes whom under the current flat fee?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Nearby customers with large areas&lt;/b&gt; pay much more than the costs they cause; &lt;b&gt;distant, small&lt;/b&gt; ones pay less. The margin on the former covers the losses on the latter.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the risk of the new policy, and why do the slides consider it acceptable?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Small jobs in remote areas may be lost, but these were loss-making anyway. In exchange, the lower rate attracts more nearby customers and increases purchase frequency.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;confronto&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot;&gt;Part 9 · Link&lt;/span&gt;
    &lt;h2&gt;Exercise 1 (Hickory) and Exercise 2 (Gallatin) compared&lt;/h2&gt;
    &lt;p&gt;The previous exercise in the course, &lt;i&gt;7.SMA_ABC ex 1 solutions.pdf&lt;/i&gt;, applies ABC to a manufacturing company. The two cases illustrate the &lt;b&gt;same distortion&lt;/b&gt;: a single volume-based allocation base spreads costs that do not depend on volume incorrectly. &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;tabs&quot;&gt;
      &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hickory in brief&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison table&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;The common lesson&lt;/button&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;Hickory produces 14,000 units of Y and 6,000 of Z, with $684,000 of overhead. With a &lt;span class=&quot;t&quot;&gt;plantwide overhead rate&lt;/span&gt; of $684,000 ÷ 12,000 DLH = &lt;b&gt;$57 per direct labor-hour&lt;/b&gt;, Y receives $456,000 (66.7%) and Z $228,000 (33.3%). With ABC (four pools: machining $20/MH, setups $500/setup, product design $42,000/product, general factory $25/DLH), Y receives &lt;b&gt;$407,000&lt;/b&gt; (59%) and Z &lt;b&gt;$277,000&lt;/b&gt; (41%). &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;The reason: Z, a low-volume product, consumes 75% of setups (batch-level) and 50% of design (product-level). The traditional system assigned too much to Y and too little to Z.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Ex 1 · Hickory&lt;/th&gt;&lt;th&gt;Ex 2 · Gallatin&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Sector&lt;/td&gt;&lt;td&gt;Manufacturing&lt;/td&gt;&lt;td&gt;Services&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Cost object&lt;/td&gt;&lt;td&gt;Products Y and Z&lt;/td&gt;&lt;td&gt;Individual job / customer&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Costs allocated&lt;/td&gt;&lt;td&gt;Manufacturing overhead only ($684,000), all allocated&lt;/td&gt;&lt;td&gt;All costs ($430,000); Other ($132,000) not allocated&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;First stage&lt;/td&gt;&lt;td&gt;Given (pool costs provided)&lt;/td&gt;&lt;td&gt;To be calculated with the % of consumption&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&quot;Traditional&quot; system&lt;/td&gt;&lt;td&gt;Plantwide rate on DLH&lt;/td&gt;&lt;td&gt;Flat fee on sq ft (a price, not an allocation)&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Who is undercosted&lt;/td&gt;&lt;td&gt;Low-volume product (Z)&lt;/td&gt;&lt;td&gt;Small, distant jobs&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Activities that make the difference&lt;/td&gt;&lt;td&gt;Setups (batch), design (product)&lt;/td&gt;&lt;td&gt;Travel (customer), job support (job)&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;p class=&quot;small muted&quot;&gt;Rows compiled from ex 1 and the slides; the synthesis is an &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;In both exercises the &lt;b&gt;unit-level&lt;/b&gt; pools give results similar to the traditional method (in Hickory, machining 70/30 and general factory 66.7/33.3, as with the plantwide rate &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;). The differences arise from costs &lt;b&gt;not related to volume&lt;/b&gt;: setups and design for Hickory, travel and job handling for Gallatin.&lt;/p&gt;
        &lt;p&gt;Rule of thumb: &lt;b&gt;the smaller, rarer or more &quot;inconvenient&quot; a cost object is, the more a volume-based system tends to understate its cost.&lt;/b&gt; &lt;span class=&quot;src own&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Self-check&lt;/div&gt;&lt;h3&gt;Links&lt;/h3&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which Gallatin pool is the equivalent of Hickory&#x27;s &quot;machine setups&quot;?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Job support&lt;/b&gt;: a fixed cost for each &quot;batch&quot; (job), independent of the quantity processed.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does general factory in Hickory give the same percentages as the plantwide rate?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because it uses the same unit-level base (direct labor-hours) as the plantwide rate. &lt;span class=&quot;src&quot;&gt;ex 1&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;span class=&quot;tag&quot; style=&quot;background:var(--slate-bg);color:var(--slate)&quot;&gt;Further reading&lt;/span&gt;
    &lt;h2&gt;Further reading&lt;/h2&gt;
    &lt;p&gt;The slides for this exercise &lt;b&gt;do not cite any authors, texts, standards or websites&lt;/b&gt;. Below are the key references on the method and on the origin of the exercise, found on the web. Everything in this section is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h4&gt;
      &lt;p&gt;A widely used managerial accounting textbook. The chapter &quot;Activity-Based Costing: A Tool to Aid Decision Making&quot; (its number varies by edition) uses the same framework as the slides: an Other pool for organization-sustaining and idle capacity costs, a first stage based on consumption percentages, and customer margin. The Gallatin Carpet Cleaning case appears among the textbook&#x27;s problems (&quot;Evaluating the Profitability of Services&quot;). It matters because it is the likely source of the exercise and explains the theory the slides take for granted.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of the 13th edition on the McGraw-Hill website&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Robin Cooper, Robert S. Kaplan — &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, September 1988&lt;/h4&gt;
      &lt;p&gt;One of the articles that popularized ABC: it shows how traditional volume-based systems distort the cost of products and customers and lead to wrong pricing and mix decisions. It is the conceptual basis of both exercises in the course.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article page (Ivey Publishing)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Robert S. Kaplan, V.G. Narayanan — &quot;Measuring and Managing Customer Profitability&quot;, &lt;i&gt;Cost Management&lt;/i&gt;, 2001&lt;/h4&gt;
      &lt;p&gt;Applies ABC to customer profitability, just as requirement 4 does: it shows that a few customers generate most of the profit while some destroy it, and discusses pricing, cost-to-serve and corrective actions. Useful for further study of customer margin and cross-subsidization.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.hbs.edu/faculty/Pages/item.aspx?num=11052&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School page&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
      &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson — &quot;Time-Driven Activity-Based Costing&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, November 2004&lt;/h4&gt;
      &lt;p&gt;Proposes a simplified version of ABC: instead of interviews about consumption percentages (as in Gallatin&#x27;s first stage), it estimates the cost per minute of capacity and the time required by each activity. It makes unused capacity visible, the theme of the Other pool. Followed by the 2007 book of the same name.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&quot;Rethinking Activity-Based Costing&quot;, HBS Working Knowledge&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

    el(&#x27;circle&#x27;,{cx:X(M),cy:Y(mar),r:6,style:&#x27;fill:&#x27;+(mar&lt;0?&#x27;var(--neg)&#x27;:&#x27;var(--pos)&#x27;)+&#x27;;stroke:var(--paper);stroke-width:2&#x27;},ch);

  job();

  /* avoidable costs */
