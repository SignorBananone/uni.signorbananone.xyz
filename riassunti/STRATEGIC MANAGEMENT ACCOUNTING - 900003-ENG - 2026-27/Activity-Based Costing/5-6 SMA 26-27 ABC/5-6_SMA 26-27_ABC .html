    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;Riconciliazione (non nelle slide, ma utile per l&#x27;esame): 7.240.000 − Customer relations 3.080.000 − Other 6.160.000 = &lt;b&gt;−2.000.000&lt;/b&gt;, cioè la stessa perdita del conto economico. L&#x27;ABC non cambia il risultato totale: cambia &lt;b&gt;come lo si spiega&lt;/b&gt;.&lt;/div&gt;

  &lt;h3&gt;Tradizionale vs ABC&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 720 260&quot; role=&quot;img&quot; aria-label=&quot;Confronto margini: SureStart 6,9 milioni tradizionale e 8,372 ABC; LongLife 2,1 milioni tradizionale e meno 1,132 ABC&quot;&gt;
      &lt;line x1=&quot;360&quot; y1=&quot;20&quot; x2=&quot;360&quot; y2=&quot;220&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;360&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;0 · scala: 1 M$ = 30 px&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;62&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;SureStart&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;40&quot; width=&quot;207&quot; height=&quot;22&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;574&quot; y=&quot;57&quot; font-size=&quot;13&quot;&gt;trad. 6.900.000&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;68&quot; width=&quot;251&quot; height=&quot;22&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;618&quot; y=&quot;85&quot; font-size=&quot;13&quot;&gt;ABC 8.372.000&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;152&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;LongLife&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;130&quot; width=&quot;63&quot; height=&quot;22&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;147&quot; font-size=&quot;13&quot;&gt;trad. 2.100.000&lt;/text&gt;
      &lt;rect x=&quot;326&quot; y=&quot;158&quot; width=&quot;34&quot; height=&quot;22&quot; style=&quot;fill:var(--bad)&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;175&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;ABC (1.132.000)&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;14&quot; height=&quot;14&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;212&quot; font-size=&quot;12&quot;&gt;tradizionale&lt;/text&gt;
      &lt;rect x=&quot;130&quot; y=&quot;200&quot; width=&quot;14&quot; height=&quot;14&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;212&quot; font-size=&quot;12&quot;&gt;ABC&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--ochre-bg);--c:var(--ochre)&quot;&gt;&lt;h4&gt;SureStart: +1.472.000&lt;/h4&gt;Il sistema tradizionale la &lt;b&gt;overcosts&lt;/b&gt; (le attribuisce troppi costi) e ne riporta un margine &lt;b&gt;più basso&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--brick-bg);--c:var(--brick)&quot;&gt;&lt;h4&gt;LongLife: −3.232.000&lt;/h4&gt;Il sistema tradizionale la &lt;b&gt;undercosts&lt;/b&gt; (le attribuisce troppo pochi costi) e ne riporta un margine &lt;b&gt;più alto&lt;/b&gt;. In realtà è in perdita.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;È il classico effetto del &lt;b&gt;cross-subsidization&lt;/b&gt; (sussidio incrociato): il prodotto standard ad alto volume «paga» parte dei costi del prodotto complesso a basso volume. Con il dato tradizionale Baxter potrebbe spingere proprio il prodotto che le fa perdere soldi.&lt;/p&gt;

  &lt;h3&gt;Le tre ragioni della differenza&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Quali overhead&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Quali basi&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Costi non di produzione&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Tradizionale:&lt;/b&gt; ripartisce &lt;i&gt;tutto&lt;/i&gt; il manufacturing overhead sui prodotti (anche l&#x27;affitto della fabbrica).&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; assegna ai prodotti solo l&#x27;overhead che i prodotti &lt;i&gt;consumano&lt;/i&gt; davvero; il resto (es. Other) resta non ripartito.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Tradizionale:&lt;/b&gt; una sola base legata al volume (machine-hours).&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; usa anche basi &lt;b&gt;non legate al volume&lt;/b&gt; (n. ordini, n. progetti): così LongLife, con molti ordini piccoli e molti progetti, riceve la sua vera quota.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Tradizionale:&lt;/b&gt; ignora selling &amp;amp; administrative expenses perché sono period expenses.&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; attribuisce direttamente le spedizioni ai prodotti e include nei pool gli overhead non di produzione causati dai prodotti (es. parte degli stipendi amministrativi e di marketing in Customer orders).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Laboratorio: che cosa guida il costo di LongLife?&lt;/h3&gt;
  &lt;p&gt;Muovi i cursori: le activity rate restano quelle di Baxter, il tasso tradizionale resta $ 17,50/MH. Nota che il sistema tradizionale &lt;b&gt;non vede&lt;/b&gt; ordini e progetti.&lt;/p&gt;
  &lt;div class=&quot;lab&quot; id=&quot;wi&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-o&quot;&gt;Ordini LongLife&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-o&quot; min=&quot;500&quot; max=&quot;10000&quot; step=&quot;100&quot; value=&quot;6000&quot;&gt;&lt;output id=&quot;wi-oo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-d&quot;&gt;Product designs LongLife&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-d&quot; min=&quot;0&quot; max=&quot;6000&quot; step=&quot;100&quot; value=&quot;4000&quot;&gt;&lt;output id=&quot;wi-do&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-m&quot;&gt;Machine-hours LongLife&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-m&quot; min=&quot;200000&quot; max=&quot;400000&quot; step=&quot;5000&quot; value=&quot;320000&quot;&gt;&lt;output id=&quot;wi-mo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 620 120&quot; role=&quot;img&quot; aria-label=&quot;Margine di LongLife tradizionale e ABC&quot;&gt;
      &lt;line x1=&quot;310&quot; y1=&quot;8&quot; x2=&quot;310&quot; y2=&quot;100&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;10&quot; y=&quot;36&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Tradizionale&lt;/text&gt;&lt;rect id=&quot;wi-bt&quot; y=&quot;20&quot; height=&quot;24&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text id=&quot;wi-tt&quot; y=&quot;37&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;80&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;ABC&lt;/text&gt;&lt;rect id=&quot;wi-ba&quot; y=&quot;64&quot; height=&quot;24&quot;/&gt;&lt;text id=&quot;wi-ta&quot; y=&quot;81&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;310&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-muted&quot;&gt;0&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;wi-msg&quot; class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Semplificazione didattica: in realtà, se le attività cambiano molto, cambiano anche i costi dei pool e quindi le rate.&lt;/p&gt;

  &lt;h3&gt;Customer margin: Acme Auto Parts&lt;/h3&gt;
  &lt;div class=&quot;tbl&quot; style=&quot;max-width:480px&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Acme Auto Parts&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;29.200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;7.500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;6.700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;1.700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;5.424&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;3.040&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;2.912&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;1.540&lt;/td&gt;&lt;td&gt;28.816&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;384&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Acme è appena in utile (1,3% delle vendite). Gli overhead ABC (12.916) pesano quasi quanto materiali e lavoro diretto insieme: ordini piccoli e frequenti e richieste di modifiche di design rendono il cliente costoso. Leve possibili: lotto minimo d&#x27;ordine, sovrapprezzo per i design personalizzati, prezzi diversi per servizio.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 6&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;ABC fa aumentare il margine di SureStart di 1.472.000?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Overhead tradizionale 8.400.000 → ABC 4.928.000 (−3.472.000), ma si aggiunge lo shipping di 2.000.000: −3.472.000 + 2.000.000 = −1.472.000 di costi, quindi +1.472.000 di margine.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;E per LongLife? Ricostruisci −3.232.000.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Overhead 5.600.000 → 7.832.000 (+2.232.000) più shipping 1.000.000 = +3.232.000 di costi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Vero o falso: l&#x27;ABC ha ridotto la perdita di Baxter.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Falso. Il risultato complessivo resta −2.000.000; l&#x27;ABC cambia solo la ripartizione e quindi la lettura di quali prodotti e clienti creano o distruggono valore.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Baxter dovrebbe eliminare subito LongLife?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Non automaticamente. Bisogna capire quali costi ABC sparirebbero davvero (alcuni sono di capacità e non si eliminano subito) e valutare alternative: aumentare i prezzi dei modelli personalizzati, far pagare i design, incentivare ordini più grandi. L&#x27;ABC indica dove guardare, la decisione richiede un&#x27;analisi dei costi evitabili.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 7 ========== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s7&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 7 · Uso manageriale&lt;/span&gt;
  &lt;h2&gt;Migliorare i processi e far funzionare l&#x27;ABC&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 77–78&lt;/p&gt;

  &lt;h3&gt;Targeting process improvement&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity-based management (ABM)&lt;/h4&gt;Usata insieme all&#x27;ABC per individuare le aree che trarrebbero beneficio da &lt;b&gt;miglioramenti di processo&lt;/b&gt;, concentrandosi sulle attività per &lt;b&gt;eliminare sprechi&lt;/b&gt;, ridurre i &lt;b&gt;tempi di lavorazione&lt;/b&gt; e i &lt;b&gt;difetti&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity rates come indizi&lt;/h4&gt;Una rate molto alta (es. $ 452 per evadere un ordine) è un campanello: dove c&#x27;è spreco? Si può semplificare il processo degli ordini?&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Benchmarking&lt;/h4&gt;Confrontare i costi delle attività con gli standard di prestazione raggiunti da &lt;b&gt;altre organizzazioni&lt;/b&gt;, per capire dove si è meno efficienti.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Caratteristiche di un&#x27;implementazione di successo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Strong top management support&lt;/h4&gt;&lt;p&gt;Senza la guida dei vertici alcuni manager non saranno motivati ad accettare il cambiamento.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Legato a valutazione e premi&lt;/h4&gt;&lt;p&gt;Se le persone continuano a essere valutate e premiate con dati di costo tradizionali, capiranno presto che l&#x27;ABC non conta e lo abbandoneranno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Cross-functional teams&lt;/h4&gt;&lt;p&gt;Team con persone di più funzioni (produzione, vendite, progettazione, amministrazione): hanno la conoscenza approfondita delle operazioni necessaria per progettare un ABC efficace.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;step-count small&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot; style=&quot;--c:var(--slate)&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Un limite noto e la risposta di Kaplan&lt;/h4&gt;
    &lt;p style=&quot;margin:0&quot;&gt;Il passo 2 di Baxter si basa su percentuali stimate con interviste. Kaplan e Anderson osservano che molte aziende hanno abbandonato l&#x27;ABC per i costi di queste rilevazioni e perché le percentuali dichiarate dai dipendenti sommano sempre al 100%, nascondendo la capacità inutilizzata. Propongono il &lt;b&gt;Time-Driven ABC&lt;/b&gt;: si stimano solo il costo per unità di tempo della capacità e il tempo richiesto da ogni attività. &lt;a href=&quot;https://hbr.org/2004/11/time-driven-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBR, novembre 2004&lt;/a&gt;. &lt;span class=&quot;small&quot;&gt;Non è nelle slide: è un approfondimento.&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 7&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra ABC e ABM?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;L&#x27;ABC misura i costi di attività, prodotti e clienti; l&#x27;ABM usa quelle informazioni per gestire e migliorare le attività (eliminare sprechi, ridurre tempi e difetti).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché collegare l&#x27;ABC al sistema di valutazione e premi?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché le persone seguono i numeri su cui vengono valutate: se gli incentivi restano legati ai costi tradizionali, l&#x27;ABC viene percepito come irrilevante e abbandonato.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A cosa serve un team cross-functional nella fase di definizione delle attività?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Le attività attraversano i reparti: solo chi conosce le diverse operazioni può identificarle, combinarle correttamente e stimare in modo credibile le percentuali di consumo delle risorse.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== Glossario ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;glossario&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Ripasso&lt;/span&gt;
  &lt;h2&gt;Glossario essenziale&lt;/h2&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Overhead&lt;/b&gt; · costi indiretti di produzione, non attribuibili direttamente al prodotto.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Cost object&lt;/b&gt; · ciò di cui si vuole misurare il costo: prodotto, ordine, cliente.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Allocation base&lt;/b&gt; · grandezza usata per ripartire un costo indiretto.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Plantwide overhead rate&lt;/b&gt; · un unico tasso di overhead per tutto lo stabilimento.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity&lt;/b&gt; · evento che causa il consumo di risorse di overhead.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt; · «secchio» di costi legati a una sola misura di attività.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity measure / cost driver&lt;/b&gt; · base di ripartizione in un sistema ABC.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Transaction / duration driver&lt;/b&gt; · conta le volte / misura il tempo.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;First-stage allocation&lt;/b&gt; · dalle risorse ai pool, con % di consumo.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt; · costo del pool ÷ attività totale.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Second-stage allocation&lt;/b&gt; · dai pool ai cost object: rate × attività consumata.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Overcost / undercost&lt;/b&gt; · costo attribuito troppo alto / troppo basso.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Product / customer margin&lt;/b&gt; · ricavi meno costi diretti e costi ABC del prodotto / cliente.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;ABM&lt;/b&gt; · activity-based management, gestione e miglioramento delle attività.&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== Approfondire ========== --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Fonti&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Opere citate nelle slide e letture collegate. Ogni scheda è una &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: i dati vengono da ricerche web, non dalle slide.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-prod&quot;&gt;Citato nelle slide 13 («Kaplan et al. 1998»)&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Robin Cooper · &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt;&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Harvard Business School Press, Boston, c1998; molte schede librarie riportano 1997, ISBN 978-0-87584-788-7. &lt;a href=&quot;https://catalog.lib.kyushu-u.ac.jp/ja/recordID/1000418434&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda di catalogo (Kyushu University Library)&lt;/a&gt; · &lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda editoriale&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; guida all&#x27;activity-based cost management, con capitoli introduttivi sull&#x27;ABC, sulla misura del costo della capacità delle risorse e sull&#x27;activity-based management strategico (mix di prodotti, prezzi, clienti); tratta anche target costing e kaizen costing. &lt;b&gt;Perché conta:&lt;/b&gt; è il testo di riferimento dei «padri» dell&#x27;ABC ed è da qui che viene la definizione di activity usata nella lezione. Il capitolo sul costo della capacità spiega il pool «unused capacity» di Baxter.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-prod&quot;&gt;Citato nella slide 14 («Brimson, 1998»)&lt;/span&gt;
    &lt;h4&gt;James A. Brimson · &lt;i&gt;Activity Accounting: An Activity-Based Costing Approach&lt;/i&gt;&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; John Wiley &amp;amp; Sons. Prima edizione 1991 (Wiley/National Association of Accountants series); ristampa in brossura luglio 1997, ISBN 978-0-471-19628-0, 224 pp. &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-0471196282.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina Wiley&lt;/a&gt; · &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-0471196282,descCd-tableOfContents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;indice&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;impostazione della contabilità per attività, dal cambiamento del contesto competitivo alla tracciatura dei costi sulle attività. Brimson è il fondatore dell&#x27;ABM Institute. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della formula chiave della lezione: «le risorse sono consumate dalle attività, le attività dai prodotti». &lt;i&gt;Nota:&lt;/i&gt; non ho trovato un&#x27;edizione datata 1998; probabilmente la slide si riferisce alla ristampa 1997/98.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-batch&quot;&gt;Probabile fonte degli esempi (non citata esplicitamente)&lt;/span&gt;
    &lt;h4&gt;Ray H. Garrison, Eric W. Noreen, Peter C. Brewer · &lt;i&gt;Managerial Accounting&lt;/i&gt;, cap. «Activity-Based Costing: A Tool to Aid Decision Making»&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; McGraw-Hill; il capitolo con questo titolo è il cap. 8 nella 13ª ed. (2009) e il 6–7 in altre edizioni. &lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice della 13ª edizione (McGraw-Hill)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; manuale di contabilità direzionale; il capitolo ABC segue gli stessi obiettivi di apprendimento della lezione (first-stage e second-stage allocation, product e customer margins). &lt;b&gt;Perché conta:&lt;/b&gt; il titolo della lezione e la numerazione «5-7», «5-8» sulle slide coincidono con lo stile delle slide di questo manuale. Verifica con il docente quale edizione è adottata nel corso.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-org&quot;&gt;Lettura collegata (non citata nelle slide)&lt;/span&gt;
    &lt;h4&gt;Robin Cooper, Robert S. Kaplan · «Measure Costs Right: Make the Right Decisions»&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Harvard Business Review&lt;/i&gt;, settembre 1988, 8 pp. &lt;a href=&quot;https://hbr.org/1988/09/measure-costs-right-make-the-right-decisions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;articolo che ha reso popolare l&#x27;ABC. Sostiene che le aziende multiprodotto prendono decisioni di prezzo, mix e tecnologia su dati di costo distorti e propone l&#x27;ABC come alternativa, da affiancare al sistema contabile ufficiale senza sostituirlo. &lt;b&gt;Perché conta:&lt;/b&gt; è la versione «da manager» del problema Baxter (Parte 2 e Parte 6).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-org&quot;&gt;Lettura collegata (non citata nelle slide)&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson · «Time-Driven Activity-Based Costing»&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Harvard Business Review&lt;/i&gt;, novembre 2004. &lt;a href=&quot;https://hbr.org/2004/11/time-driven-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una versione semplificata dell&#x27;ABC che sostituisce le interviste con due parametri (costo per unità di tempo della capacità e tempo per attività), considera la capacità inutilizzata e usa «time equations» per ordini e clienti diversi. &lt;b&gt;Perché conta:&lt;/b&gt; risponde ai limiti pratici del passo 1–2 visto con Baxter.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  var fmt=function(n){var s=Math.abs(Math.round(n)).toLocaleString(&#x27;it-IT&#x27;);return (n&lt;0?&#x27;(&#x27;:&#x27;&#x27;)+&#x27;$ &#x27;+s+(n&lt;0?&#x27;)&#x27;:&#x27;&#x27;);};
  window.__fmt=fmt;
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(w){
    var b=w.querySelectorAll(&#x27;[role=tab]&#x27;),p=w.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    b.forEach(function(x,i){x.addEventListener(&#x27;click&#x27;,function(){b.forEach(function(y,j){y.setAttribute(&#x27;aria-selected&#x27;,j===i);p[j].hidden=j!==i;});});});
  });
  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.step&#x27;),k=0,dots=s.querySelector(&#x27;.dots&#x27;),lab=s.querySelector(&#x27;.step-count&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;span&#x27;));});
    var pv=s.querySelector(&#x27;[data-prev]&#x27;),nx=s.querySelector(&#x27;[data-next]&#x27;);
    function show(){st.forEach(function(x,j){x.hidden=j!==k;});lab.textContent=(k+1)+&#x27; / &#x27;+st.length;pv.disabled=k===0;nx.disabled=k===st.length-1;dots.querySelectorAll(&#x27;span&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j&lt;=k);});}
    pv.addEventListener(&#x27;click&#x27;,function(){if(k&gt;0){k--;show();}});
    nx.addEventListener(&#x27;click&#x27;,function(){if(k&lt;st.length-1){k++;show();}});
    show();
  });
  // classification games
  document.querySelectorAll(&#x27;.game&#x27;).forEach(function(g){
    var opts=g.getAttribute(&#x27;data-options&#x27;).split(&#x27;|&#x27;);
    g.querySelectorAll(&#x27;.gitem&#x27;).forEach(function(it){
      var box=it.querySelector(&#x27;.opts&#x27;),ans=it.getAttribute(&#x27;data-a&#x27;);
      opts.forEach(function(o){var bt=document.createElement(&#x27;button&#x27;);bt.className=&#x27;btn&#x27;;bt.type=&#x27;button&#x27;;bt.textContent=o;
        bt.addEventListener(&#x27;click&#x27;,function(){if(it.classList.contains(&#x27;done&#x27;))return;
          if(o===ans){bt.classList.add(&#x27;right&#x27;);it.classList.add(&#x27;done&#x27;);}else{bt.classList.add(&#x27;wrong&#x27;);}
        });box.appendChild(bt);});
      var sh=document.createElement(&#x27;button&#x27;);sh.className=&#x27;btn&#x27;;sh.type=&#x27;button&#x27;;sh.textContent=&#x27;Mostra&#x27;;sh.style.marginLeft=&#x27;auto&#x27;;
      sh.addEventListener(&#x27;click&#x27;,function(){it.classList.add(&#x27;done&#x27;);box.querySelectorAll(&#x27;.btn&#x27;).forEach(function(x){if(x.textContent===ans)x.classList.add(&#x27;right&#x27;);});});
      box.appendChild(sh);
    });
  });
  // first-stage allocation matrix
  var P=[&#x27;Customer orders&#x27;,&#x27;Product design&#x27;,&#x27;Order size&#x27;,&#x27;Customer relations&#x27;,&#x27;Other&#x27;];
  var R=[[&#x27;Production Department&#x27;],
    [&#x27;Indirect factory wages&#x27;,6000000,[30,30,20,10,10]],
    [&#x27;Factory equipment depreciation&#x27;,3500000,[20,10,60,0,10]],
    [&#x27;Factory utilities&#x27;,2500000,[0,10,60,0,30]],
    [&#x27;Factory building lease&#x27;,2000000,[0,0,0,0,100]],
    [&#x27;General Administrative Department&#x27;],
    [&#x27;Administrative wages and salaries&#x27;,4000000,[30,10,10,30,20]],
    [&#x27;Office equipment depreciation&#x27;,900000,[30,10,0,20,40]],
    [&#x27;Administrative building lease&#x27;,1100000,[0,0,0,0,100]],
    [&#x27;Marketing Department&#x27;],
    [&#x27;Marketing wages and salaries&#x27;,1500000,[30,10,0,50,10]],
    [&#x27;Selling expenses&#x27;,500000,[20,0,0,70,10]]];
  var tb=document.getElementById(&#x27;fs-table&#x27;);
  if(tb){
    var mode=&#x27;pct&#x27;,selCol=-1,num=function(n){return Math.round(n).toLocaleString(&#x27;it-IT&#x27;);};
    var detail=document.getElementById(&#x27;fs-detail&#x27;);
    function render(){
      var h=&#x27;&lt;tr&gt;&lt;th&gt;Voce di overhead&lt;/th&gt;&lt;th&gt;Importo&lt;/th&gt;&#x27;+P.map(function(p,i){return &#x27;&lt;th data-col=&quot;&#x27;+i+&#x27;&quot;&#x27;+(i===selCol?&#x27; class=&quot;hl&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+p+&#x27;&lt;/th&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&#x27;;
      tb.tHead.innerHTML=h;
      var tot=[0,0,0,0,0],b=&#x27;&#x27;;
      R.forEach(function(r,ri){
        if(r.length===1){b+=&#x27;&lt;tr class=&quot;grp&quot;&gt;&lt;td colspan=&quot;7&quot;&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;return;}
        b+=&#x27;&lt;tr class=&quot;row ind&quot; data-r=&quot;&#x27;+ri+&#x27;&quot;&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+num(r[1])+&#x27;&lt;/td&gt;&#x27;;
        r[2].forEach(function(p,i){var v=r[1]*p/100;tot[i]+=v;b+=&#x27;&lt;td&#x27;+(i===selCol?&#x27; class=&quot;hl&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+(mode===&#x27;pct&#x27;?p+&#x27;%&#x27;:(v?num(v):&#x27;–&#x27;))+&#x27;&lt;/td&gt;&#x27;;});
        b+=&#x27;&lt;/tr&gt;&#x27;;
      });
      b+=&#x27;&lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;22.000.000&lt;/td&gt;&#x27;+tot.map(function(t,i){return &#x27;&lt;td&#x27;+(i===selCol?&#x27; class=&quot;hl&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+num(t)+&#x27;&lt;/td&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&#x27;;
      tb.tBodies[0].innerHTML=b;
      tb.tHead.querySelectorAll(&#x27;th[data-col]&#x27;).forEach(function(th){th.addEventListener(&#x27;click&#x27;,function(){var c=+th.getAttribute(&#x27;data-col&#x27;);selCol=selCol===c?-1:c;render();
        if(selCol&gt;=0){var parts=[];R.forEach(function(r){if(r.length&gt;1&amp;&amp;r[2][c])parts.push(num(r[1]*r[2][c]/100));});detail.innerHTML=&#x27;&lt;b&gt;&#x27;+P[c]+&#x27;&lt;/b&gt; = &#x27;+parts.join(&#x27; + &#x27;)+&#x27; = &lt;b&gt;$ &#x27;+num(tot[c])+&#x27;&lt;/b&gt;&#x27;;}});});
      tb.tBodies[0].querySelectorAll(&#x27;tr.row&#x27;).forEach(function(tr){tr.addEventListener(&#x27;click&#x27;,function(){
        tb.tBodies[0].querySelectorAll(&#x27;tr.row&#x27;).forEach(function(x){x.classList.remove(&#x27;sel&#x27;);});tr.classList.add(&#x27;sel&#x27;);
        var r=R[+tr.getAttribute(&#x27;data-r&#x27;)];
        detail.innerHTML=&#x27;&lt;b&gt;&#x27;+r[0]+&#x27;&lt;/b&gt; ($ &#x27;+num(r[1])+&#x27;): &#x27;+r[2].map(function(p,i){return p?P[i]+&#x27; &#x27;+p+&#x27;% = &#x27;+num(r[1]*p/100):null;}).filter(Boolean).join(&#x27; · &#x27;);
      });});
    }
    render();
    document.getElementById(&#x27;fs-pct&#x27;).addEventListener(&#x27;click&#x27;,function(){mode=&#x27;pct&#x27;;this.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;fs-usd&#x27;).classList.remove(&#x27;on&#x27;);render();});
    document.getElementById(&#x27;fs-usd&#x27;).addEventListener(&#x27;click&#x27;,function(){mode=&#x27;usd&#x27;;this.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;fs-pct&#x27;).classList.remove(&#x27;on&#x27;);render();});
  }
  // number of activities slider
  var na=document.getElementById(&#x27;nact&#x27;);
  if(na){
    var X=function(n){return 40+(n-1)/39*540;},Y=function(v){return 190-v*170;};
    var acc=function(n){return 1-Math.exp(-n/5);},cost=function(n){return 0.02+n/40*0.85;},net=function(n){return Math.max(0,acc(n)-cost(n)*0.85);};
    var path=function(f){var d=&#x27;&#x27;;for(var n=1;n&lt;=40;n+=0.5){d+=(d?&#x27;L&#x27;:&#x27;M&#x27;)+X(n).toFixed(1)+&#x27; &#x27;+Y(f(n)).toFixed(1);}return d;};
    document.getElementById(&#x27;c-acc&#x27;).setAttribute(&#x27;d&#x27;,path(acc));
    document.getElementById(&#x27;c-cost&#x27;).setAttribute(&#x27;d&#x27;,path(cost));
    document.getElementById(&#x27;c-net&#x27;).setAttribute(&#x27;d&#x27;,path(net));
    var upd=function(){var n=+na.value;document.getElementById(&#x27;nact-o&#x27;).textContent=n;var m=document.getElementById(&#x27;c-mark&#x27;);m.setAttribute(&#x27;x1&#x27;,X(n));m.setAttribute(&#x27;x2&#x27;,X(n));
      document.getElementById(&#x27;nact-msg&#x27;).textContent=n&lt;4?&#x27;Troppo poche attività: costi diversi finiscono nello stesso pool, il dato resta distorto.&#x27;:(n&lt;=12?&#x27;Zona «handful»: buona accuratezza a un costo ragionevole (Baxter usa 5 pool).&#x27;:&#x27;Molte attività: accuratezza marginale minima, ma il sistema diventa costoso da mantenere e usare.&#x27;);};
    na.addEventListener(&#x27;input&#x27;,upd);upd();
  }
  // what-if LongLife
  var wo=document.getElementById(&#x27;wi-o&#x27;);
  if(wo){
    var wd=document.getElementById(&#x27;wi-d&#x27;),wm=document.getElementById(&#x27;wi-m&#x27;),S=30/1e6,Z=310;
    var bar=function(rect,txt,v,col){var w=Math.min(Math.abs(v)*S*0.9,290);rect.setAttribute(&#x27;x&#x27;,v&gt;=0?Z:Z-w);rect.setAttribute(&#x27;width&#x27;,Math.max(w,1));if(col)rect.style.fill=col;
      txt.textContent=fmt(v);txt.setAttribute(&#x27;x&#x27;,v&gt;=0?Z+w+6:Z-w-6);txt.setAttribute(&#x27;text-anchor&#x27;,v&gt;=0?&#x27;start&#x27;:&#x27;end&#x27;);};
    var go=function(){var o=+wo.value,d=+wd.value,m=+wm.value;
      document.getElementById(&#x27;wi-oo&#x27;).textContent=o.toLocaleString(&#x27;it-IT&#x27;);document.getElementById(&#x27;wi-do&#x27;).textContent=d.toLocaleString(&#x27;it-IT&#x27;);document.getElementById(&#x27;wi-mo&#x27;).textContent=m.toLocaleString(&#x27;it-IT&#x27;);
      var trad=18700000-6000000-5000000-17.5*m;
      var abc=18700000-6000000-5000000-1000000-452*o-760*d-6.5*m;
      bar(document.getElementById(&#x27;wi-bt&#x27;),document.getElementById(&#x27;wi-tt&#x27;),trad);
      bar(document.getElementById(&#x27;wi-ba&#x27;),document.getElementById(&#x27;wi-ta&#x27;),abc,abc&gt;=0?&#x27;var(--slate)&#x27;:&#x27;var(--bad)&#x27;);
      var be=Math.ceil((18700000-12000000-1000000-760*d-6.5*m)/452);
      document.getElementById(&#x27;wi-msg&#x27;).innerHTML=abc&gt;=0?&#x27;Con questi parametri LongLife è in utile anche secondo l\&#x27;ABC.&#x27;:&#x27;Per tornare in pareggio (ABC), a parità di design e ore, gli ordini dovrebbero scendere a &lt;b&gt;&#x27;+(be&gt;0?be.toLocaleString(&#x27;it-IT&#x27;):&#x27;meno di zero: servono meno design&#x27;)+&#x27;&lt;/b&gt; (lotti più grandi).&#x27;;
    };
    [wo,wd,wm].forEach(function(e){e.addEventListener(&#x27;input&#x27;,go);});go();
  }
})();
&lt;/script&gt;
