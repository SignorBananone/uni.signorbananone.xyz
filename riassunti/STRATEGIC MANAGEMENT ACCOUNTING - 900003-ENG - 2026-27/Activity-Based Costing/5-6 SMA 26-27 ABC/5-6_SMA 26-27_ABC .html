      &lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;305&quot; y=&quot;184&quot; width=&quot;215&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;412&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;12&quot;&gt;5 · IMPLEMENTAZIONE&lt;/text&gt;&lt;text x=&quot;412&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;5 passi, 2 stadi&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s6&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;184&quot; width=&quot;210&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;12&quot;&gt;6 · REPORT&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Margini prodotto e cliente&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s7&quot;&gt;&lt;rect x=&quot;200&quot; y=&quot;320&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-sage&quot; font-size=&quot;12&quot;&gt;7 · USO MANAGERIALE&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;363&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;ABM, benchmarking, successo&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#approfondire&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;320&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-acc s-acc&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-acc&quot; font-size=&quot;12&quot;&gt;PER APPROFONDIRE&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;363&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Kaplan, Cooper, Brimson&lt;/text&gt;&lt;/a&gt;

&lt;!-- ========== 1 ========== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 1 · Contesto&lt;/span&gt;
  &lt;h2&gt;Perché serve un nuovo modo di calcolare i costi&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 2–5&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Una volta… (XIX e gran parte del XX secolo)&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;Sistemi di costo &lt;b&gt;semplici e soddisfacenti&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Gli &lt;em class=&quot;t&quot;&gt;overhead&lt;/em&gt; (costi generali indiretti di produzione) si ripartivano con basi come &lt;b&gt;labour-hours&lt;/b&gt; (ore di manodopera) e &lt;b&gt;machine-hours&lt;/b&gt; (ore macchina): i processi erano &lt;i&gt;labour-intensive&lt;/i&gt;.&lt;/li&gt;
        &lt;li&gt;Un solo &lt;em class=&quot;t&quot;&gt;overhead pool&lt;/em&gt; (l&#x27;intero stabilimento) o pochi pool (i reparti).&lt;/li&gt;
        &lt;li&gt;Pochi prodotti, poco diversi tra loro.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;
      &lt;h4&gt;Oggi le cose sono diverse&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;Molti compiti dei lavoratori diretti sono svolti da &lt;b&gt;impianti automatici&lt;/b&gt;, che sono overhead.&lt;/li&gt;
        &lt;li&gt;Nuovi prodotti e servizi, a ritmo crescente, differiscono per volume, dimensione dei lotti (&lt;i&gt;batch size&lt;/i&gt;) e complessità: &lt;b&gt;product and service diversity&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Servono più risorse di supporto (pianificatori, ingegneri di progetto) che &lt;b&gt;non dipendono&lt;/b&gt; da ore di manodopera o ore macchina.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;p class=&quot;key&quot;&gt;Conseguenza: con le basi di ripartizione tradizionali, il &lt;b&gt;costo unitario di prodotto&lt;/b&gt; rischia di essere distorto e fuorviante per le decisioni.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Grafico illustrativo: costo del lavoro diretto in calo, overhead in crescita&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;210&quot; x2=&quot;730&quot; y2=&quot;210&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;60&quot; y2=&quot;210&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;395&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot;&gt;tempo → (automazione, varietà di prodotti)&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;115&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot; transform=&quot;rotate(-90 20 115)&quot; text-anchor=&quot;middle&quot;&gt;peso sul costo totale&lt;/text&gt;
      &lt;path d=&quot;M60 50 C250 70 420 150 720 185&quot; fill=&quot;none&quot; style=&quot;stroke:var(--ochre)&quot; stroke-width=&quot;4&quot;/&gt;
      &lt;path d=&quot;M60 180 C250 165 420 90 720 40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brick)&quot; stroke-width=&quot;4&quot;/&gt;
      &lt;text x=&quot;80&quot; y=&quot;42&quot; font-size=&quot;14&quot; class=&quot;t-ochre&quot; font-weight=&quot;700&quot;&gt;Direct labour&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;32&quot; font-size=&quot;14&quot; class=&quot;t-brick&quot; font-weight=&quot;700&quot;&gt;Overhead&lt;/text&gt;
      &lt;circle cx=&quot;400&quot; cy=&quot;118&quot; r=&quot;6&quot; class=&quot;f-card s-ink&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;412&quot; y=&quot;140&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;la base (ore di lavoro) e il costo da ripartire&lt;/text&gt;
      &lt;text x=&quot;412&quot; y=&quot;156&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;vanno in «opposite directions»&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema illustrativo (non sono dati delle slide) del fenomeno descritto alle slide 3 e 18: il lavoro diretto pesa sempre meno, gli overhead sempre di più.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Classificare i costi: due criteri da non confondere&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Manufacturing vs nonmanufacturing&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Direct vs indirect&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product vs period cost&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Le imprese manifatturiere separano i costi in due grandi famiglie (slide 4):&lt;/p&gt;
      &lt;figure style=&quot;margin:8px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Manufacturing e nonmanufacturing costs&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;8&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Manufacturing costs&lt;/text&gt;
          &lt;rect x=&quot;380&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;8&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Nonmanufacturing costs&lt;/text&gt;
          &lt;g style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M170 56 V80 M70 80 H270 M70 80 V100 M170 80 V100 M270 80 V100 M530 56 V80 M460 80 H600 M460 80 V100 M600 80 V100&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
            &lt;rect x=&quot;20&quot; y=&quot;100&quot; width=&quot;100&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;125&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;142&quot;&gt;materials&lt;/text&gt;
            &lt;rect x=&quot;125&quot; y=&quot;100&quot; width=&quot;90&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;125&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;142&quot;&gt;labor&lt;/text&gt;
            &lt;rect x=&quot;220&quot; y=&quot;100&quot; width=&quot;100&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;125&quot;&gt;Manufact.&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;142&quot;&gt;overhead&lt;/text&gt;
            &lt;rect x=&quot;400&quot; y=&quot;100&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-brick&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;125&quot;&gt;Selling&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;142&quot;&gt;costs&lt;/text&gt;
            &lt;rect x=&quot;540&quot; y=&quot;100&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-brick&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;125&quot;&gt;Administrative&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;142&quot;&gt;costs&lt;/text&gt;
          &lt;/g&gt;
          &lt;text x=&quot;350&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;materie prime dirette · manodopera diretta · costi generali di produzione | vendita · amministrazione&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il criterio qui è la relazione con il &lt;em class=&quot;t&quot;&gt;cost object&lt;/em&gt; (oggetto di costo: qualunque cosa di cui si vuole conoscere il costo, cioè un prodotto, un ordine, un cliente, un reparto).&lt;/p&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Direct costs&lt;/h4&gt;Si possono &lt;b&gt;attribuire (trace)&lt;/b&gt; in modo facile e conveniente all&#x27;unità di prodotto o a un altro cost object. Esempi: direct material, direct labor.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;Indirect costs&lt;/h4&gt;&lt;b&gt;Non&lt;/b&gt; si possono attribuire in modo facile e conveniente. Esempio: manufacturing overhead (ammortamento impianti, utenze di fabbrica, salari indiretti…).&lt;/div&gt;
      &lt;/div&gt;
      &lt;p style=&quot;margin-top:12px&quot;&gt;Come si portano allora i costi indiretti sui cost object? Con una &lt;em class=&quot;t&quot;&gt;allocation basis&lt;/em&gt; (base di ripartizione): una grandezza misurabile (ore, unità, ordini…) con cui si divide il costo comune.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Un concetto che le slide danno per scontato (slide 73): nella contabilità tradizionale i costi di produzione sono &lt;b&gt;product costs&lt;/b&gt;, cioè entrano nel costo del prodotto e nel &lt;i&gt;cost of goods sold&lt;/i&gt;; i costi di vendita e amministrazione sono &lt;b&gt;period expenses&lt;/b&gt;, cioè costi di periodo spesati nell&#x27;esercizio e mai attribuiti ai prodotti.&lt;/p&gt;
      &lt;p&gt;È per questo che il sistema tradizionale di Baxter (Parte 2) calcola il margine di prodotto senza toccare spedizioni, marketing e amministrazione. L&#x27;ABC invece supera questa distinzione (Parte 3).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché le ore di manodopera erano una buona base di ripartizione nel Novecento e oggi lo sono meno?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché i processi erano labour-intensive e gli overhead crescevano più o meno insieme al lavoro diretto. Oggi l&#x27;automazione riduce il lavoro diretto mentre gli overhead aumentano, e molti overhead (progettazione, pianificazione) non dipendono dalle ore: la base non è più correlata al costo da ripartire.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Lo stipendio del responsabile della pianificazione della produzione è diretto o indiretto rispetto a una singola batteria?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Indiretto: non si può attribuire in modo facile e conveniente a una singola unità. È un manufacturing overhead.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il costo delle spedizioni è manufacturing o nonmanufacturing? Product o period cost nel sistema tradizionale?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;È un nonmanufacturing (selling) cost; nel sistema tradizionale è un period expense, quindi non entra nel costo del prodotto. Nell&#x27;ABC di Baxter invece viene attribuito direttamente (traced) ai prodotti e ai clienti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 2 ========== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 2 · Il metodo classico&lt;/span&gt;
  &lt;h2&gt;Baxter Battery Company e il plantwide overhead rate&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 6–10 (ripresa alla slide 69)&lt;/p&gt;

  &lt;p&gt;Baxter produce due batterie per auto: &lt;b&gt;SureStart&lt;/b&gt; (standard) e &lt;b&gt;LongLife&lt;/b&gt; (deluxe). Nell&#x27;anno 20X0 registra la &lt;b&gt;prima perdita della sua storia&lt;/b&gt;. Il conto economico:&lt;/p&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Income statement, 20X0&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;50.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;15.000.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;12.000.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;14.000.000&lt;/td&gt;&lt;td&gt;41.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;9.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Selling and administrative expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;3.000.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Marketing&lt;/td&gt;&lt;td&gt;2.000.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;General administrative&lt;/td&gt;&lt;td&gt;6.000.000&lt;/td&gt;&lt;td&gt;11.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;(2.000.000)&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;I 4 passi del sistema tradizionale&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Dati diretti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Tasso unico&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Ripartizione&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Margini&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Si raccolgono vendite e costi diretti di ogni prodotto.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31.300.000&lt;/td&gt;&lt;td&gt;18.700.000&lt;/td&gt;&lt;td&gt;50.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;9.000.000&lt;/td&gt;&lt;td&gt;6.000.000&lt;/td&gt;&lt;td&gt;15.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7.000.000&lt;/td&gt;&lt;td&gt;5.000.000&lt;/td&gt;&lt;td&gt;12.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Si calcola un unico tasso per tutto lo stabilimento, il &lt;em class=&quot;t&quot;&gt;plantwide overhead rate&lt;/em&gt;, usando le machine-hours (MH) come base.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Plantwide rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Manufacturing overhead totale&lt;/span&gt;&lt;span&gt;MH totali&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;14.000.000&lt;/span&gt;&lt;span&gt;800.000 MH&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;$ 17,50 per MH&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Overhead: salari indiretti 6.000.000 + ammortamento impianti 3.500.000 + utenze 2.500.000 + affitto fabbrica 2.000.000. MH: SureStart 800.000 × 0,60 h = 480.000; LongLife 400.000 × 0,80 h = 320.000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;MH&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Overhead allocato&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;SureStart&lt;/td&gt;&lt;td&gt;480.000&lt;/td&gt;&lt;td&gt;17,50&lt;/td&gt;&lt;td&gt;8.400.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;LongLife&lt;/td&gt;&lt;td&gt;320.000&lt;/td&gt;&lt;td&gt;17,50&lt;/td&gt;&lt;td&gt;5.600.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;14.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Tutto l&#x27;overhead di produzione finisce sui prodotti, &lt;b&gt;in proporzione alle ore macchina&lt;/b&gt;: SureStart ne riceve il 60%, LongLife il 40%.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31.300.000&lt;/td&gt;&lt;td&gt;18.700.000&lt;/td&gt;&lt;td&gt;50.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;9.000.000&lt;/td&gt;&lt;td&gt;6.000.000&lt;/td&gt;&lt;td&gt;15.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7.000.000&lt;/td&gt;&lt;td&gt;5.000.000&lt;/td&gt;&lt;td&gt;12.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;8.400.000&lt;/td&gt;&lt;td&gt;5.600.000&lt;/td&gt;&lt;td&gt;14.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;6.900.000&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;2.100.000&lt;/td&gt;&lt;td&gt;9.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Selling and administrative&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;11.000.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;(2.000.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;«What do we understand looking at these numbers?» (slide 10)&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;Secondo il sistema tradizionale &lt;b&gt;entrambi i prodotti sono profittevoli&lt;/b&gt;; la perdita sembra causata solo dagli 11 milioni di spese commerciali e amministrative, che restano «sopra» i prodotti come costo di periodo. Il report non dice &lt;i&gt;chi&lt;/i&gt; causa quelle spese né se l&#x27;overhead è stato distribuito in modo corretto. Spoiler: con l&#x27;ABC il quadro si ribalta (Parte 6).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Calcola l&#x27;overhead allocato a una singola LongLife con il metodo tradizionale.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;0,80 MH × $ 17,50 = &lt;b&gt;$ 14&lt;/b&gt; per batteria (5.600.000 / 400.000 = 14, coerente).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale ipotesi nascosta fa il plantwide rate?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Che tutto l&#x27;overhead vari in proporzione alle ore macchina, cioè al volume prodotto. Se una parte dei costi dipende invece da ordini, progetti o clienti, l&#x27;ipotesi è falsa e i costi vengono spostati da un prodotto all&#x27;altro.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il margine dei prodotti (9 M) non coincide con il risultato (−2 M)?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché 11 M di selling &amp;amp; administrative expenses sono trattati come period expenses e non attribuiti ai prodotti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 3 ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s3&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 3 · Obiettivo 1&lt;/span&gt;
  &lt;h2&gt;Che cos&#x27;è l&#x27;Activity-Based Costing&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 11–22 · «Understand activity-based costing and how it differs from a traditional costing system»&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-Based Costing (ABC).&lt;/b&gt; Metodo di calcolo dei costi pensato per dare ai manager informazioni per decisioni strategiche e di altro tipo che possono incidere sulla &lt;b&gt;capacity&lt;/b&gt; (capacità produttiva: le risorse disponibili come persone, macchine, spazi) e quindi sui costi «fissi» oltre che su quelli variabili.&lt;/div&gt;

  &lt;p&gt;Le virgolette su «fissi» sono importanti: un costo è fisso solo nel breve periodo. Se l&#x27;azienda decide di eliminare un prodotto molto complesso, può ridurre la capacità di progettazione (meno ingegneri) e quel costo «fisso» sparisce. L&#x27;ABC serve proprio a vedere questi legami.&lt;/p&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sostituisce i cost center&lt;/h4&gt;Di solito rimpiazza il sistema basato sui &lt;em class=&quot;t&quot;&gt;cost centers&lt;/em&gt; (centri di costo che ricalcano l&#x27;organigramma: reparti, uffici).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trasversale&lt;/h4&gt;Il beneficio principale: l&#x27;attenzione alla gestione delle risorse &lt;b&gt;attraversa le unità organizzative&lt;/b&gt;. Un&#x27;attività come «evadere un ordine» coinvolge vendite, produzione e amministrazione.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Al centro le activities&lt;/h4&gt;Combinazioni di persone, tecnologie, materie prime e condizioni ambientali finalizzate a un output finale &lt;span class=&quot;small&quot;&gt;(Kaplan et al., 1998)&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;L&#x27;idea di base: risorse → attività → oggetti di costo&lt;/h3&gt;
  &lt;p&gt;Le &lt;b&gt;risorse sono consumate dalle attività&lt;/b&gt;; le &lt;b&gt;attività sono consumate dai beni/servizi&lt;/b&gt; che l&#x27;organizzazione fornisce &lt;span class=&quot;small&quot;&gt;(Brimson, 1998)&lt;/span&gt;. &lt;b&gt;Consumando risorse, le attività generano costi.&lt;/b&gt; Tra le risorse ci sono spesso le &lt;i&gt;core competencies&lt;/i&gt; (competenze distintive) che determinano la capacità di offrire prodotti e servizi di qualità.&lt;/p&gt;

  &lt;h3&gt;Come l&#x27;ABC tratta i costi: 4 differenze&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Niente muro&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Più pool&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Misure proprie&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Perché ora&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Nell&#x27;ABC la distinzione tra &lt;b&gt;manufacturing e nonmanufacturing costs scompare&lt;/b&gt;: tutti i costi sono analizzati in base al grado di «consumo di risorse» da parte delle attività.&lt;/p&gt;
      &lt;p&gt;Costi di produzione e non di produzione &lt;b&gt;possono&lt;/b&gt; essere assegnati ai prodotti, ma &lt;b&gt;solo su base causa-effetto&lt;/b&gt; (&lt;i&gt;cause-and-effect basis&lt;/i&gt;). Ciò che non ha un legame causale (es. affitto della sede) non va spalmato sui prodotti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;L&#x27;ABC usa &lt;b&gt;numerosi overhead cost pool&lt;/b&gt;. Più pool vuol dire più precisione, ma anche più complessità.&lt;/p&gt;
      &lt;figure style=&quot;margin:6px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 600 250&quot; role=&quot;img&quot; aria-label=&quot;Complessità crescente: plantwide, departmental, ABC&quot;&gt;
          &lt;line x1=&quot;60&quot; y1=&quot;215&quot; x2=&quot;580&quot; y2=&quot;215&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;15&quot; x2=&quot;60&quot; y2=&quot;215&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;320&quot; y=&quot;243&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Number of cost pools →&lt;/text&gt;
          &lt;text x=&quot;24&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; transform=&quot;rotate(-90 24 115)&quot;&gt;Level of complexity →&lt;/text&gt;
          &lt;rect x=&quot;80&quot; y=&quot;150&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Plantwide&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;overhead rate&lt;/text&gt;
          &lt;rect x=&quot;250&quot; y=&quot;95&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Departmental&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;overhead rates&lt;/text&gt;
          &lt;rect x=&quot;420&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-slate s-slate&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Activity-Based&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;71&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Costing&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Departmental overhead rates&lt;/b&gt;: un tasso diverso per ogni reparto, a metà strada tra il tasso unico e l&#x27;ABC.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Ogni cost pool ABC ha una propria &lt;b&gt;misura di attività&lt;/b&gt;; i sistemi tradizionali usano direct labor hours e/o machine hours per &lt;i&gt;tutti&lt;/i&gt; gli overhead.&lt;/p&gt;
      &lt;p&gt;Le ore funzionano bene &lt;b&gt;solo se&lt;/b&gt; le variazioni della base sono correlate con le variazioni dei costi ripartiti. Esempio: le utenze delle macchine crescono con le ore macchina (ok); il costo di progettazione no.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Usare solo ore di lavoro o ore macchina è sempre più criticato perché lavoro diretto e overhead si muovono in &lt;b&gt;direzioni opposte&lt;/b&gt; e la &lt;b&gt;varietà dei prodotti&lt;/b&gt; è aumentata (vedi il grafico della Parte 1).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il vocabolario chiave&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity&lt;/h4&gt;Un «evento» che causa il consumo di risorse di overhead. Es.: ricevere un ordine, preparare un&#x27;attrezzatura.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity cost pool&lt;/h4&gt;Un «secchio» (&lt;i&gt;cost bucket&lt;/i&gt;) in cui si accumulano i costi legati a &lt;b&gt;una sola&lt;/b&gt; misura di attività.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity measure = cost driver&lt;/h4&gt;La base di ripartizione in un sistema ABC. Si chiama anche &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt; (determinante di costo): la grandezza che «guida» il consumo di risorse.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Due tipi comuni di activity measure&lt;/h4&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--ochre-bg);--c:var(--ochre)&quot;&gt;&lt;h4&gt;Transaction driver&lt;/h4&gt;Semplice &lt;b&gt;conteggio&lt;/b&gt; di quante volte un&#x27;attività avviene.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Es.: numero di fatture inviate a un cliente.&lt;/span&gt;&lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;Costa poco misurarlo; presume che ogni volta l&#x27;attività richieda le stesse risorse.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--sage-bg);--c:var(--sage)&quot;&gt;&lt;h4&gt;Duration driver&lt;/h4&gt;Misura del &lt;b&gt;tempo&lt;/b&gt; necessario per un&#x27;attività.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Es.: tempo speso a preparare le singole fatture.&lt;/span&gt;&lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;Più preciso quando le esecuzioni sono molto diverse (fattura semplice vs complessa), ma più costoso da rilevare.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Secondo Brimson, chi consuma cosa?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Le attività consumano risorse; i prodotti/servizi consumano attività. Consumando risorse, le attività generano costi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la definizione di ABC cita i costi «fissi» tra virgolette?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché le decisioni che toccano la capacity (es. eliminare un prodotto, ridurre i progetti) possono far variare nel medio periodo anche costi che nel breve sembrano fissi. L&#x27;ABC mostra quali attività li generano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;«Numero di setup» o «ore di setup»: quale è transaction e quale duration driver? Quando scegliere il secondo?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Numero di setup = transaction driver; ore di setup = duration driver. Il secondo conviene quando i setup hanno durate molto diverse tra prodotti, così il conteggio distorcerebbe il costo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra un activity cost pool e un cost center tradizionale?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Il cost center segue l&#x27;organigramma (un reparto); l&#x27;activity cost pool raccoglie costi di qualunque reparto purché legati alla stessa attività e alla stessa misura di attività.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 4 ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s4&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 4 · Gerarchia dei costi&lt;/span&gt;
  &lt;h2&gt;I cinque livelli di attività&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 23–28&lt;/p&gt;

  &lt;p&gt;I sistemi tradizionali usano basi di ripartizione &lt;b&gt;guidate dal volume di produzione&lt;/b&gt; (&lt;i&gt;volume-related&lt;/i&gt;). L&#x27;ABC riconosce invece &lt;b&gt;cinque livelli di attività&lt;/b&gt; che, salvo il primo, &lt;b&gt;in gran parte non dipendono dal numero di unità prodotte&lt;/b&gt;. Le aziende manifatturiere raggruppano tipicamente le loro attività in queste cinque classi.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 780 330&quot; role=&quot;img&quot; aria-label=&quot;Gerarchia dei cinque livelli di attività&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;34&quot; font-weight=&quot;700&quot; class=&quot;t-sage&quot; font-size=&quot;15&quot;&gt;Unit-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;54&quot; class=&quot;f-muted&quot;&gt;si ripete per ogni unità&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;34&quot;&gt;Energia per far girare le macchine&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;54&quot; class=&quot;f-muted&quot;&gt;driver: unità, ore macchina&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;74&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;98&quot; font-weight=&quot;700&quot; class=&quot;t-ochre&quot; font-size=&quot;15&quot;&gt;Batch-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;118&quot; class=&quot;f-muted&quot;&gt;per ogni lotto, quale che sia la sua dimensione&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;98&quot;&gt;Setup delle attrezzature, organizzare spedizioni&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;118&quot; class=&quot;f-muted&quot;&gt;driver: n. lotti, n. ordini, n. setup&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;138&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-slate s-slate&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;162&quot; font-weight=&quot;700&quot; class=&quot;t-slate&quot; font-size=&quot;15&quot;&gt;Product-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;182&quot; class=&quot;f-muted&quot;&gt;per ogni prodotto, a prescindere da lotti e unità&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;162&quot;&gt;Progettazione del prodotto, pubblicità&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;182&quot; class=&quot;f-muted&quot;&gt;driver: n. progetti, n. prodotti&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;202&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;226&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;15&quot;&gt;Customer-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;246&quot; class=&quot;f-muted&quot;&gt;legato a clienti specifici&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;226&quot;&gt;Visite commerciali, assistenza tecnica generale&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;246&quot; class=&quot;f-muted&quot;&gt;driver: n. clienti attivi&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;266&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;290&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Organization-sustaining&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;310&quot; class=&quot;f-muted&quot;&gt;non dipende da volumi, prodotti, clienti&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;290&quot;&gt;Riscaldare la fabbrica, pulire gli uffici, bilancio annuale&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;310&quot; class=&quot;f-muted&quot;&gt;nessun driver: di norma non si ripartisce&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Dall&#x27;alto verso il basso le attività sono sempre meno legate al volume. Esempi dalle slide 25–26; i driver tipici sono un&#x27;aggiunta esplicativa.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;note&quot;&gt;Il trucco per classificare: chiediti &lt;b&gt;«che cosa fa scattare il costo?»&lt;/b&gt;. Se raddoppio le unità in un lotto, il costo raddoppia? Allora è unit-level. Se resta uguale finché non avvio un nuovo lotto, è batch-level. Se resta uguale finché non creo un nuovo prodotto, è product-level.&lt;/div&gt;

  &lt;h3&gt;Esempio: Western River Expeditions&lt;/h3&gt;
  &lt;p&gt;Rafting sul Colorado: un viaggio di 6 giorni nel Grand Canyon. Ogni viaggio usa 1 o 2 &lt;b&gt;gommoni&lt;/b&gt;, ognuno con &lt;b&gt;2 guide&lt;/b&gt; e fino a &lt;b&gt;18 ospiti&lt;/b&gt;. Le guide preparano tutti i pasti. Ogni ospite riceve una &lt;b&gt;tazza&lt;/b&gt; da usare e da portare a casa.&lt;/p&gt;
  &lt;div class=&quot;game&quot; data-options=&quot;Unit-level|Batch-level|Product-level&quot;&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Unit-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;La tazza regalata a ogni ospite&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Unit-level: l&#x27;«unità» è l&#x27;ospite; ogni ospite in più costa una tazza in più (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;Il salario delle guide&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Batch-level: il «lotto» è il gommone; 2 guide per gommone, che porti 5 o 18 ospiti (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;Il cibo servito durante il viaggio&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Sembra unit-level, ma servono più informazioni: il menu standard è preparato il giorno prima della partenza e il cibo arriva preconfezionato in grandi lotti, quindi non si adatta al numero effettivo di ospiti. Per le slide è più corretto considerarlo &lt;b&gt;batch-level&lt;/b&gt; (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Product-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;Progettare e promuovere l&#x27;itinerario «6 giorni nel Grand Canyon»&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Product-level: il «prodotto» è il tipo di viaggio; il costo non dipende da quanti gommoni o ospiti partono. &lt;i&gt;Le slide pongono la domanda ma non danno la risposta: questo esempio è una nostra interpretazione.&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Lezione di metodo: la stessa voce di costo cambia livello a seconda di &lt;b&gt;come l&#x27;azienda svolge davvero l&#x27;attività&lt;/b&gt;. Per classificare servono informazioni sui processi, non solo sulla natura del costo.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quale dei cinque livelli è l&#x27;unico davvero «volume-related»?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Il livello unit-level: i costi sono proporzionali al numero di unità prodotte.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;azienda produce 1 lotto da 1.000 pezzi invece di 10 lotti da 100. Cosa succede ai costi di setup? E all&#x27;energia delle macchine?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;I costi di setup (batch-level) calano di circa 10 volte perché i setup passano da 10 a 1; l&#x27;energia (unit-level) resta circa uguale perché i pezzi sono sempre 1.000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché ripartire costi organization-sustaining sui prodotti è pericoloso?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché non hanno un legame causa-effetto con prodotti o clienti: qualunque ripartizione sarebbe arbitraria e potrebbe portare a decisioni sbagliate (es. eliminare un prodotto senza che quei costi spariscano).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 5 ========== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s5&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte 5 · Obiettivi 2–4&lt;/span&gt;
  &lt;h2&gt;Implementare l&#x27;ABC: cinque passi&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 29–64&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Definire activities, activity cost pools, activity measures&lt;/h4&gt;&lt;p&gt;Il passo più lungo e la base dell&#x27;intero sistema. Di solito si &lt;b&gt;intervistano le persone&lt;/b&gt; chiedendo di descrivere le loro attività principali: ne esce una lista &lt;b&gt;lunghissima&lt;/b&gt;, da ridurre combinando attività simili.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Assegnare gli overhead ai cost pool&lt;/h4&gt;&lt;p&gt;&lt;b&gt;First-stage allocation&lt;/b&gt; (ripartizione di primo stadio): ogni voce di overhead, di produzione e non, viene distribuita tra i pool in base alla % di risorse che ciascuna attività consuma (di solito stimata con interviste).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Calcolare gli activity rates&lt;/h4&gt;&lt;p&gt;Per ogni pool: &lt;b&gt;costo totale del pool ÷ quantità totale di attività&lt;/b&gt;. Si ottiene un costo per ordine, per progetto, per ora macchina, per cliente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h4&gt;Assegnare gli overhead ai cost objects&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Second-stage allocation&lt;/b&gt;: activity rate × quantità di attività consumata da un prodotto, un ordine o un cliente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h4&gt;Preparare i management reports&lt;/h4&gt;&lt;p&gt;Report di &lt;b&gt;product margin&lt;/b&gt; e &lt;b&gt;customer margin&lt;/b&gt; che sommano costi diretti e costi ABC e li sottraggono dai ricavi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;step-count small&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Passo 1 in dettaglio: tre questioni&lt;/h3&gt;
  &lt;details open&gt;&lt;summary&gt;1ª questione · Come definire le attività&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Interviste a chi lavora, chiedendo di descrivere le attività principali. Risultato tipico: una lista MOLTO lunga.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;2ª questione · Quante attività tenere?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;Più attività = informazione di costo più accurata, ma sistema più costoso da progettare, implementare, mantenere e usare. Serve una lista «maneggevole» (&lt;i&gt;handful&lt;/i&gt;) ottenuta combinando attività simili. Prova il cursore:&lt;/p&gt;
    &lt;div class=&quot;lab&quot;&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;nact&quot;&gt;Numero di activity cost pool&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;nact&quot; min=&quot;1&quot; max=&quot;40&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;nact-o&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 220&quot; id=&quot;nact-svg&quot; role=&quot;img&quot; aria-label=&quot;Curve illustrative di accuratezza e costo del sistema&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;580&quot; y2=&quot;190&quot; class=&quot;s-ink&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;190&quot; class=&quot;s-ink&quot;/&gt;
        &lt;path id=&quot;c-acc&quot; fill=&quot;none&quot; style=&quot;stroke:var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;path id=&quot;c-cost&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;path id=&quot;c-net&quot; fill=&quot;none&quot; style=&quot;stroke:var(--slate)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot;/&gt;
        &lt;line id=&quot;c-mark&quot; y1=&quot;10&quot; y2=&quot;190&quot; style=&quot;stroke:var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;300&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;numero di attività / cost pool&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;40&quot; font-size=&quot;12&quot; class=&quot;t-sage&quot; font-weight=&quot;700&quot;&gt;accuratezza&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;150&quot; font-size=&quot;12&quot; class=&quot;t-brick&quot; font-weight=&quot;700&quot;&gt;costo del sistema&lt;/text&gt;
        &lt;text x=&quot;60&quot; y=&quot;24&quot; font-size=&quot;12&quot; class=&quot;t-slate&quot; font-weight=&quot;700&quot;&gt;beneficio netto&lt;/text&gt;
      &lt;/svg&gt;
      &lt;p id=&quot;nact-msg&quot; class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:4px 0 0&quot;&gt;Curve qualitative a scopo didattico, non dati delle slide.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;3ª questione · Come combinare le attività&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Si raggruppano attività dello &lt;b&gt;stesso livello&lt;/b&gt; e &lt;b&gt;fortemente correlate&lt;/b&gt;. Es.: «numero di ordini ricevuti» e «numero di ordini completati e spediti» (due attività batch-level che si muovono insieme) diventano un unico pool. Attenzione: le attività sono &lt;b&gt;firm specific&lt;/b&gt;, cioè vanno definite sull&#x27;azienda concreta.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;I cinque pool di Baxter&lt;/h3&gt;
  &lt;p&gt;Per ognuno le slide chiedono: &lt;i&gt;«Which is the level involved?»&lt;/i&gt; Prova prima di scoprirlo.&lt;/p&gt;
  &lt;div class=&quot;game&quot; data-options=&quot;Unit|Batch|Product|Customer|Organization-sustaining&quot;&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch&quot;&gt;&lt;div class=&quot;q&quot;&gt;Customer Orders: costi per ricevere ed evadere gli ordini dei clienti&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Batch-level: l&#x27;ordine genera lavoro uguale sia che riguardi 1 unità sia 1.000. Measure: &lt;b&gt;numero di ordini&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Product&quot;&gt;&lt;div class=&quot;q&quot;&gt;Product Design: costi per progettare i prodotti&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Product-level: il lavoro di progettazione non dipende da unità ordinate né da lotti. Measure: &lt;b&gt;numero di product designs&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Unit&quot;&gt;&lt;div class=&quot;q&quot;&gt;Order Size: costi legati al numero di unità prodotte (energia per le macchine, parte degli ammortamenti)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Unit-level: ogni unità richiede una parte di queste risorse. Measure: &lt;b&gt;machine-hours&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Customer&quot;&gt;&lt;div class=&quot;q&quot;&gt;Customer Relations: costi per mantenere le relazioni con i clienti (visite commerciali)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Customer-level. Measure: &lt;b&gt;numero di clienti attivi&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Organization-sustaining&quot;&gt;&lt;div class=&quot;q&quot;&gt;Other: costi organization-sustaining e di capacità inutilizzata&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Organization-sustaining (più l&#x27;&lt;em class=&quot;t&quot;&gt;unused capacity&lt;/em&gt;, cioè il costo di risorse disponibili ma non usate). Measure: &lt;b&gt;non applicabile&lt;/b&gt;, quindi i costi restano non ripartiti.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La mappa dei flussi di costo&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 400&quot; role=&quot;img&quot; aria-label=&quot;Flusso dei costi in Baxter: costi tracciati, primo e secondo stadio&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;110&quot; height=&quot;44&quot; rx=&quot;6&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;65&quot; y=&quot;37&quot;&gt;Direct mat.&lt;/text&gt;
        &lt;rect x=&quot;130&quot; y=&quot;10&quot; width=&quot;110&quot; height=&quot;44&quot; rx=&quot;6&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;37&quot;&gt;Direct labor&lt;/text&gt;

  &lt;h3&gt;Passo 2 · First-stage allocation (obiettivo 2)&lt;/h3&gt;
  &lt;p&gt;Baxter parte dai 22 milioni di overhead &lt;b&gt;di produzione e non di produzione&lt;/b&gt;, organizzati per reparto (un&#x27;ottica &lt;i&gt;funzionale&lt;/i&gt;): Produzione 14.000.000 (= manufacturing overhead del conto economico), Amministrazione 6.000.000, Marketing 2.000.000. Restano fuori direct materials, direct labor e shipping, perché il sistema esistente già li attribuisce direttamente a prodotti e ordini.&lt;/p&gt;
  &lt;p&gt;Un team stima quanta parte di ogni risorsa è consumata da ciascuna attività. &lt;b&gt;Clicca una riga&lt;/b&gt; per vedere il calcolo, oppure un&#x27;intestazione di colonna per evidenziare un pool.&lt;/p&gt;
  &lt;div class=&quot;btns&quot; style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;fs-pct&quot;&gt;Mostra %&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;fs-usd&quot;&gt;Mostra $&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;fs-table&quot;&gt;&lt;thead&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot; id=&quot;fs-detail&quot; style=&quot;margin-top:0&quot;&gt;Clicca una riga: qui compare il calcolo, es. Indirect factory wages 6.000.000 × 30% = 1.800.000 al pool Customer orders.&lt;/div&gt;

  &lt;h3&gt;Passo 3 · Activity rates (obiettivo 3)&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Costo totale del pool&lt;/span&gt;&lt;span&gt;Attività totale prevista&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Total cost&lt;/th&gt;&lt;th&gt;(b) Total activity&lt;/th&gt;&lt;th&gt;(a) ÷ (b) Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;4.520.000&lt;/td&gt;&lt;td&gt;10.000 orders&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 452&lt;/b&gt; per order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;3.040.000&lt;/td&gt;&lt;td&gt;4.000 designs&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 760&lt;/b&gt; per design&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;5.200.000&lt;/td&gt;&lt;td&gt;800.000 MH&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 6,50&lt;/b&gt; per MH&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;3.080.000&lt;/td&gt;&lt;td&gt;2.000 customers&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 1.540&lt;/b&gt; per customer&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td&gt;6.160.000&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;22.000.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;«Other» contiene costi organization-sustaining: &lt;b&gt;non&lt;/b&gt; verranno assegnati a prodotti o clienti. Nota: la slide 56 scrive «4,000 changes», la slide 55 «4,000 product designs»: è la stessa misura (progetti/modifiche di design).&lt;/p&gt;

  &lt;h3&gt;Passo 4 · Second-stage allocation (obiettivo 4)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Ai prodotti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;A un cliente: Acme&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;SureStart&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:18px&quot;&gt;&lt;li&gt;nessuna nuova progettazione&lt;/li&gt;&lt;li&gt;800.000 batterie in 4.000 ordini&lt;/li&gt;&lt;li&gt;36 minuti macchina ciascuna → 480.000 MH&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;LongLife&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:18px&quot;&gt;&lt;li&gt;richiede progettazione: 4.000 design personalizzati&lt;/li&gt;&lt;li&gt;400.000 batterie in 6.000 ordini&lt;/li&gt;&lt;li&gt;48 minuti macchina ciascuna → 320.000 MH&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;SureStart: attività&lt;/th&gt;&lt;th&gt;SureStart: costo&lt;/th&gt;&lt;th&gt;LongLife: attività&lt;/th&gt;&lt;th&gt;LongLife: costo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;452&lt;/td&gt;&lt;td&gt;4.000&lt;/td&gt;&lt;td&gt;1.808.000&lt;/td&gt;&lt;td&gt;6.000&lt;/td&gt;&lt;td&gt;2.712.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;760&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;4.000&lt;/td&gt;&lt;td&gt;3.040.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;6,50&lt;/td&gt;&lt;td&gt;480.000&lt;/td&gt;&lt;td&gt;3.120.000&lt;/td&gt;&lt;td&gt;320.000&lt;/td&gt;&lt;td&gt;2.080.000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;4.928.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;7.832.000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Controllo: 4.928.000 + 7.832.000 + 9.240.000 non assegnati (Customer relations 3.080.000 + Other 6.160.000) = &lt;b&gt;22.000.000&lt;/b&gt;. Customer relations non va ai prodotti perché è un costo legato ai clienti.&lt;/p&gt;
      &lt;p&gt;Sorpresa: LongLife produce metà unità ma riceve &lt;b&gt;più&lt;/b&gt; overhead di SureStart, perché genera più ordini (6.000 contro 4.000, cioè ordini più piccoli) e assorbe tutta la progettazione.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Acme Auto Parts&lt;/b&gt;, uno dei 2.000 clienti, ha fatto 12 ordini: 8 da 60 SureStart e 4 da 50 LongLife. Ognuno dei 4 ordini LongLife ha richiesto una modifica di design. Ore macchina: 480 SureStart → 288 MH; 200 LongLife → 160 MH.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Attività&lt;/th&gt;&lt;th&gt;Costo ABC&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;452,00&lt;/td&gt;&lt;td&gt;12 &lt;span class=&quot;small&quot;&gt;(8 + 4)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;5.424&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;760,00&lt;/td&gt;&lt;td&gt;4 &lt;span class=&quot;small&quot;&gt;(ordini LongLife)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;3.040&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;6,50&lt;/td&gt;&lt;td&gt;448 &lt;span class=&quot;small&quot;&gt;(288 + 160 MH)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;2.912&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;1.540,00&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1.540&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;12.916&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Verifica il pool Order size: da quali voci arrivano i 5.200.000?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Indirect factory wages 6.000.000 × 20% = 1.200.000; factory equipment depreciation 3.500.000 × 60% = 2.100.000; factory utilities 2.500.000 × 60% = 1.500.000; administrative wages 4.000.000 × 10% = 400.000. Totale 5.200.000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;affitto della fabbrica va al 100% in «Other»?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché è un costo di struttura (organization-sustaining) senza un legame causa-effetto con ordini, progetti, ore macchina o clienti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto costa in overhead ABC una singola SureStart? E una LongLife?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;SureStart: 4.928.000 / 800.000 = &lt;b&gt;$ 6,16&lt;/b&gt;. LongLife: 7.832.000 / 400.000 = &lt;b&gt;$ 19,58&lt;/b&gt;. Con il metodo tradizionale erano $ 10,50 (0,6 × 17,50) e $ 14.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un nuovo cliente fa 2 ordini da 100 SureStart (60 MH in tutto). Quanto overhead ABC gli si assegna?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;2 × 452 + 0 × 760 + 60 × 6,50 + 1 × 1.540 = 904 + 390 + 1.540 = &lt;b&gt;$ 2.834&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

  &lt;span class=&quot;part-label&quot;&gt;Parte 6 · Obiettivo 5&lt;/span&gt;
  &lt;h2&gt;Margini di prodotto e di cliente: il quadro si ribalta&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 65–76&lt;/p&gt;

  &lt;p&gt;Tre passi: (1) vendite e costi diretti, ora &lt;b&gt;incluse le spedizioni&lt;/b&gt;; (2) aggiungere i costi ABC; (3) sottrarre tutto dalle vendite.&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31.300.000&lt;/td&gt;&lt;td&gt;18.700.000&lt;/td&gt;&lt;td&gt;50.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Direct costs&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;9.000.000&lt;/td&gt;&lt;td&gt;6.000.000&lt;/td&gt;&lt;td&gt;15.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7.000.000&lt;/td&gt;&lt;td&gt;5.000.000&lt;/td&gt;&lt;td&gt;12.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;2.000.000&lt;/td&gt;&lt;td&gt;1.000.000&lt;/td&gt;&lt;td&gt;3.000.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;ABC cost assignments&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;1.808.000&lt;/td&gt;&lt;td&gt;2.712.000&lt;/td&gt;&lt;td&gt;4.520.000&lt;/td&gt;&lt;/tr&gt;
