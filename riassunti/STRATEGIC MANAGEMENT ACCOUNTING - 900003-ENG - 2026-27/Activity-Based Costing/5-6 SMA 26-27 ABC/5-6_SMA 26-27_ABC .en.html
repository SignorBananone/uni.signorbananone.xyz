      &lt;text x=&quot;360&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Cost objects&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;products · customer orders · customers&lt;/text&gt;
      &lt;rect x=&quot;715&quot; y=&quot;338&quot; width=&quot;78&quot; height=&quot;40&quot; rx=&quot;6&quot; class=&quot;f-card s-rule&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;754&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;Unallocated&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Reconstruction of slides 34–35 and 57–59. DM, DL and shipping can already be traced directly, so they stay outside the allocation process; “Other” costs are not allocated.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Step 2 · First-stage allocation (objective 2)&lt;/h3&gt;
  &lt;p&gt;Baxter starts from 22 million of &lt;b&gt;manufacturing and nonmanufacturing&lt;/b&gt; overhead, organised by department (a &lt;i&gt;functional&lt;/i&gt; view): Production 14,000,000 (= the manufacturing overhead in the income statement), Administration 6,000,000, Marketing 2,000,000. Direct materials, direct labor and shipping are excluded, because the existing system already traces them directly to products and orders.&lt;/p&gt;
  &lt;p&gt;A team estimates how much of each resource is consumed by each activity. &lt;b&gt;Click a row&lt;/b&gt; to see the calculation, or a column header to highlight a pool.&lt;/p&gt;
  &lt;div class=&quot;btns&quot; style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;fs-pct&quot;&gt;Show %&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;fs-usd&quot;&gt;Show $&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;fs-table&quot;&gt;&lt;thead&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot; id=&quot;fs-detail&quot; style=&quot;margin-top:0&quot;&gt;Click a row: the calculation appears here, e.g. Indirect factory wages 6,000,000 × 30% = 1,800,000 to the Customer orders pool.&lt;/div&gt;

  &lt;h3&gt;Step 3 · Activity rates (objective 3)&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total pool cost&lt;/span&gt;&lt;span&gt;Total expected activity&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;(a) Total cost&lt;/th&gt;&lt;th&gt;(b) Total activity&lt;/th&gt;&lt;th&gt;(a) ÷ (b) Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;4,520,000&lt;/td&gt;&lt;td&gt;10,000 orders&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 452&lt;/b&gt; per order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;3,040,000&lt;/td&gt;&lt;td&gt;4,000 designs&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 760&lt;/b&gt; per design&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;5,200,000&lt;/td&gt;&lt;td&gt;800,000 MH&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 6.50&lt;/b&gt; per MH&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;3,080,000&lt;/td&gt;&lt;td&gt;2,000 customers&lt;/td&gt;&lt;td&gt;&lt;b&gt;$ 1,540&lt;/b&gt; per customer&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td&gt;6,160,000&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;22,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;“Other” contains organization-sustaining costs: they will &lt;b&gt;not&lt;/b&gt; be assigned to products or customers. Note: slide 56 reads “4,000 changes”, slide 55 “4,000 product designs”: it is the same measure (designs/design changes).&lt;/p&gt;

  &lt;h3&gt;Step 4 · Second-stage allocation (objective 4)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;To products&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;To a customer: Acme&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;SureStart&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:18px&quot;&gt;&lt;li&gt;no new design work&lt;/li&gt;&lt;li&gt;800,000 batteries in 4,000 orders&lt;/li&gt;&lt;li&gt;36 machine minutes each → 480,000 MH&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;LongLife&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:18px&quot;&gt;&lt;li&gt;requires design work: 4,000 custom designs&lt;/li&gt;&lt;li&gt;400,000 batteries in 6,000 orders&lt;/li&gt;&lt;li&gt;48 machine minutes each → 320,000 MH&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;SureStart: activity&lt;/th&gt;&lt;th&gt;SureStart: cost&lt;/th&gt;&lt;th&gt;LongLife: activity&lt;/th&gt;&lt;th&gt;LongLife: cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;452&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;1,808,000&lt;/td&gt;&lt;td&gt;6,000&lt;/td&gt;&lt;td&gt;2,712,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;760&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;3,040,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;6.50&lt;/td&gt;&lt;td&gt;480,000&lt;/td&gt;&lt;td&gt;3,120,000&lt;/td&gt;&lt;td&gt;320,000&lt;/td&gt;&lt;td&gt;2,080,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;4,928,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;7,832,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Check: 4,928,000 + 7,832,000 + 9,240,000 unassigned (Customer relations 3,080,000 + Other 6,160,000) = &lt;b&gt;22,000,000&lt;/b&gt;. Customer relations is not assigned to products because it is a customer-related cost.&lt;/p&gt;
      &lt;p&gt;Surprise: LongLife accounts for half as many units yet receives &lt;b&gt;more&lt;/b&gt; overhead than SureStart, because it generates more orders (6,000 versus 4,000, i.e. smaller orders) and absorbs all the design work.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Acme Auto Parts&lt;/b&gt;, one of the 2,000 customers, placed 12 orders: 8 for 60 SureStart batteries each and 4 for 50 LongLife batteries each. Each of the 4 LongLife orders required a design change. Machine-hours: 480 SureStart → 288 MH; 200 LongLife → 160 MH.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Activity&lt;/th&gt;&lt;th&gt;ABC cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;452.00&lt;/td&gt;&lt;td&gt;12 &lt;span class=&quot;small&quot;&gt;(8 + 4)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;5,424&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;760.00&lt;/td&gt;&lt;td&gt;4 &lt;span class=&quot;small&quot;&gt;(LongLife orders)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;3,040&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;6.50&lt;/td&gt;&lt;td&gt;448 &lt;span class=&quot;small&quot;&gt;(288 + 160 MH)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;2,912&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;1,540.00&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1,540&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;12,916&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Check the Order size pool: which items make up the 5,200,000?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Indirect factory wages 6,000,000 × 20% = 1,200,000; factory equipment depreciation 3,500,000 × 60% = 2,100,000; factory utilities 2,500,000 × 60% = 1,500,000; administrative wages 4,000,000 × 10% = 400,000. Total 5,200,000.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is 100% of the factory building lease assigned to “Other”?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because it is a structural (organization-sustaining) cost with no cause-and-effect relationship with orders, designs, machine hours or customers.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the ABC overhead cost of a single SureStart battery? And of a LongLife?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;SureStart: 4,928,000 / 800,000 = &lt;b&gt;$ 6.16&lt;/b&gt;. LongLife: 7,832,000 / 400,000 = &lt;b&gt;$ 19.58&lt;/b&gt;. Under the traditional method they were $ 10.50 (0.6 × 17.50) and $ 14.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A new customer places 2 orders of 100 SureStart batteries each (60 MH in total). How much ABC overhead is assigned to it?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;2 × 452 + 0 × 760 + 60 × 6.50 + 1 × 1,540 = 904 + 390 + 1,540 = &lt;b&gt;$ 2,834&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 6 ========== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s6&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 6 · Objective 5&lt;/span&gt;
  &lt;h2&gt;Product and customer margins: the picture is reversed&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 65–76&lt;/p&gt;

  &lt;h3&gt;Product margins under ABC&lt;/h3&gt;
  &lt;p&gt;Three steps: (1) sales and direct costs, now &lt;b&gt;including shipping&lt;/b&gt;; (2) add the ABC costs; (3) subtract everything from sales.&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31,300,000&lt;/td&gt;&lt;td&gt;18,700,000&lt;/td&gt;&lt;td&gt;50,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Direct costs&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;9,000,000&lt;/td&gt;&lt;td&gt;6,000,000&lt;/td&gt;&lt;td&gt;15,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7,000,000&lt;/td&gt;&lt;td&gt;5,000,000&lt;/td&gt;&lt;td&gt;12,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;2,000,000&lt;/td&gt;&lt;td&gt;1,000,000&lt;/td&gt;&lt;td&gt;3,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;ABC cost assignments&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;1,808,000&lt;/td&gt;&lt;td&gt;2,712,000&lt;/td&gt;&lt;td&gt;4,520,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;3,040,000&lt;/td&gt;&lt;td&gt;3,040,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;3,120,000&lt;/td&gt;&lt;td&gt;2,080,000&lt;/td&gt;&lt;td&gt;5,200,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;22,928,000&lt;/td&gt;&lt;td&gt;19,832,000&lt;/td&gt;&lt;td&gt;42,760,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;8,372,000&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;(1,132,000)&lt;/td&gt;&lt;td&gt;7,240,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;Reconciliation (not in the slides, but useful for the exam): 7,240,000 − Customer relations 3,080,000 − Other 6,160,000 = &lt;b&gt;−2,000,000&lt;/b&gt;, i.e. the same loss as in the income statement. ABC does not change the overall result: it changes &lt;b&gt;how it is explained&lt;/b&gt;.&lt;/div&gt;

  &lt;h3&gt;Traditional vs ABC&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 720 260&quot; role=&quot;img&quot; aria-label=&quot;Margin comparison: SureStart 6.9 million traditional and 8.372 million ABC; LongLife 2.1 million traditional and minus 1.132 million ABC&quot;&gt;
      &lt;line x1=&quot;360&quot; y1=&quot;20&quot; x2=&quot;360&quot; y2=&quot;220&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;360&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;0 · scale: $1 M = 30 px&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;62&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;SureStart&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;40&quot; width=&quot;207&quot; height=&quot;22&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;574&quot; y=&quot;57&quot; font-size=&quot;13&quot;&gt;trad. 6,900,000&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;68&quot; width=&quot;251&quot; height=&quot;22&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;618&quot; y=&quot;85&quot; font-size=&quot;13&quot;&gt;ABC 8,372,000&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;152&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;LongLife&lt;/text&gt;
      &lt;rect x=&quot;360&quot; y=&quot;130&quot; width=&quot;63&quot; height=&quot;22&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;147&quot; font-size=&quot;13&quot;&gt;trad. 2,100,000&lt;/text&gt;
      &lt;rect x=&quot;326&quot; y=&quot;158&quot; width=&quot;34&quot; height=&quot;22&quot; style=&quot;fill:var(--bad)&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;175&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;ABC (1,132,000)&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;14&quot; height=&quot;14&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;212&quot; font-size=&quot;12&quot;&gt;traditional&lt;/text&gt;
      &lt;rect x=&quot;130&quot; y=&quot;200&quot; width=&quot;14&quot; height=&quot;14&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;212&quot; font-size=&quot;12&quot;&gt;ABC&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--ochre-bg);--c:var(--ochre)&quot;&gt;&lt;h4&gt;SureStart: +1,472,000&lt;/h4&gt;The traditional system &lt;b&gt;overcosts&lt;/b&gt; it (assigns too much cost to it) and reports a &lt;b&gt;lower&lt;/b&gt; margin.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--brick-bg);--c:var(--brick)&quot;&gt;&lt;h4&gt;LongLife: −3,232,000&lt;/h4&gt;The traditional system &lt;b&gt;undercosts&lt;/b&gt; it (assigns too little cost to it) and reports a &lt;b&gt;higher&lt;/b&gt; margin. In reality it is loss-making.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;This is the classic effect of &lt;b&gt;cross-subsidization&lt;/b&gt;: the high-volume standard product “pays” for part of the costs of the complex low-volume product. Relying on the traditional figures, Baxter might promote the very product that is losing it money.&lt;/p&gt;

  &lt;h3&gt;The three reasons for the difference&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Which overhead&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Which bases&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Nonmanufacturing costs&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Traditional:&lt;/b&gt; allocates &lt;i&gt;all&lt;/i&gt; manufacturing overhead to products (including the factory lease).&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; assigns to products only the overhead that products actually &lt;i&gt;consume&lt;/i&gt;; the rest (e.g. Other) remains unallocated.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Traditional:&lt;/b&gt; a single volume-related base (machine-hours).&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; also uses &lt;b&gt;non-volume-related&lt;/b&gt; bases (no. of orders, no. of designs): in this way LongLife, with many small orders and many designs, receives its true share.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Traditional:&lt;/b&gt; ignores selling &amp;amp; administrative expenses because they are period expenses.&lt;br&gt;&lt;b&gt;ABC:&lt;/b&gt; traces shipping directly to products and includes in the pools the nonmanufacturing overhead caused by products (e.g. part of administrative and marketing salaries in Customer orders).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lab: what drives LongLife&#x27;s cost?&lt;/h3&gt;
  &lt;p&gt;Move the sliders: the activity rates remain Baxter&#x27;s, and the traditional rate remains $ 17.50/MH. Note that the traditional system &lt;b&gt;does not see&lt;/b&gt; orders and designs.&lt;/p&gt;
  &lt;div class=&quot;lab&quot; id=&quot;wi&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-o&quot;&gt;LongLife orders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-o&quot; min=&quot;500&quot; max=&quot;10000&quot; step=&quot;100&quot; value=&quot;6000&quot;&gt;&lt;output id=&quot;wi-oo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-d&quot;&gt;LongLife product designs&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-d&quot; min=&quot;0&quot; max=&quot;6000&quot; step=&quot;100&quot; value=&quot;4000&quot;&gt;&lt;output id=&quot;wi-do&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;wi-m&quot;&gt;LongLife machine-hours&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wi-m&quot; min=&quot;200000&quot; max=&quot;400000&quot; step=&quot;5000&quot; value=&quot;320000&quot;&gt;&lt;output id=&quot;wi-mo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 620 120&quot; role=&quot;img&quot; aria-label=&quot;LongLife margin, traditional and ABC&quot;&gt;
      &lt;line x1=&quot;310&quot; y1=&quot;8&quot; x2=&quot;310&quot; y2=&quot;100&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;10&quot; y=&quot;36&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Traditional&lt;/text&gt;&lt;rect id=&quot;wi-bt&quot; y=&quot;20&quot; height=&quot;24&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text id=&quot;wi-tt&quot; y=&quot;37&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;80&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;ABC&lt;/text&gt;&lt;rect id=&quot;wi-ba&quot; y=&quot;64&quot; height=&quot;24&quot;/&gt;&lt;text id=&quot;wi-ta&quot; y=&quot;81&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;310&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-muted&quot;&gt;0&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;wi-msg&quot; class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Teaching simplification: in reality, if activity levels change substantially, pool costs and therefore rates change too.&lt;/p&gt;

  &lt;h3&gt;Customer margin: Acme Auto Parts&lt;/h3&gt;
  &lt;div class=&quot;tbl&quot; style=&quot;max-width:480px&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Acme Auto Parts&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;29,200&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;6,700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;1,700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer orders&lt;/td&gt;&lt;td&gt;5,424&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;3,040&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Order size&lt;/td&gt;&lt;td&gt;2,912&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Customer relations&lt;/td&gt;&lt;td&gt;1,540&lt;/td&gt;&lt;td&gt;28,816&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;384&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Acme is barely profitable (1.3% of sales). ABC overhead (12,916) is almost as large as direct materials and direct labour combined: small, frequent orders and requests for design changes make this customer expensive to serve. Possible levers: a minimum order size, a surcharge for custom designs, service-based pricing.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 6&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does ABC increase SureStart&#x27;s margin by 1,472,000?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Traditional overhead 8,400,000 → ABC 4,928,000 (−3,472,000), but shipping of 2,000,000 is added: −3,472,000 + 2,000,000 = −1,472,000 in costs, hence +1,472,000 in margin.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;And for LongLife? Reconstruct the −3,232,000.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Overhead 5,600,000 → 7,832,000 (+2,232,000) plus shipping 1,000,000 = +3,232,000 in costs.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;True or false: ABC reduced Baxter&#x27;s loss.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;False. The overall result remains −2,000,000; ABC only changes the allocation, and therefore the understanding of which products and customers create or destroy value.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Should Baxter drop LongLife immediately?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Not automatically. It must first establish which ABC costs would actually disappear (some are capacity costs and cannot be eliminated immediately) and evaluate alternatives: raising prices on custom models, charging for designs, encouraging larger orders. ABC shows where to look; the decision requires an analysis of avoidable costs.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 7 ========== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s7&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 7 · Managerial use&lt;/span&gt;
  &lt;h2&gt;Improving processes and making ABC work&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 77–78&lt;/p&gt;

  &lt;h3&gt;Targeting process improvement&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity-based management (ABM)&lt;/h4&gt;Used in conjunction with ABC to identify areas that would benefit from &lt;b&gt;process improvements&lt;/b&gt;, focusing on activities in order to &lt;b&gt;eliminate waste&lt;/b&gt; and reduce &lt;b&gt;processing time&lt;/b&gt; and &lt;b&gt;defects&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity rates as clues&lt;/h4&gt;A very high rate (e.g. $ 452 to process an order) is a warning sign: where is the waste? Can the order-handling process be simplified?&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Benchmarking&lt;/h4&gt;Comparing activity costs with the performance standards achieved by &lt;b&gt;other organisations&lt;/b&gt;, in order to identify areas of lower efficiency.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Characteristics of a successful implementation&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Strong top management support&lt;/h4&gt;&lt;p&gt;Without leadership from senior management, some managers will not be motivated to accept the change.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Linked to evaluations and rewards&lt;/h4&gt;&lt;p&gt;If people continue to be evaluated and rewarded on the basis of traditional cost data, they will soon realise that ABC does not matter and will abandon it.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Cross-functional teams&lt;/h4&gt;&lt;p&gt;Teams with members from several functions (production, sales, design, administration): they have the in-depth knowledge of operations needed to design an effective ABC system.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;step-count small&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot; style=&quot;--c:var(--slate)&quot;&gt;
    &lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; A well-known limitation and Kaplan&#x27;s response&lt;/h4&gt;
    &lt;p style=&quot;margin:0&quot;&gt;Baxter&#x27;s step 2 relies on percentages estimated through interviews. Kaplan and Anderson observe that many companies abandoned ABC because of the cost of these surveys and because the percentages reported by employees always add up to 100%, concealing unused capacity. They propose &lt;b&gt;Time-Driven ABC&lt;/b&gt;: only the cost per unit of time of capacity and the time required by each activity are estimated. &lt;a href=&quot;https://hbr.org/2004/11/time-driven-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBR, November 2004&lt;/a&gt;. &lt;span class=&quot;small&quot;&gt;Not in the slides: further reading.&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 7&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between ABC and ABM?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;ABC measures the costs of activities, products and customers; ABM uses that information to manage and improve activities (eliminating waste, reducing time and defects).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why link ABC to the evaluation and reward system?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because people follow the numbers on which they are evaluated: if incentives remain tied to traditional costs, ABC is perceived as irrelevant and abandoned.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the purpose of a cross-functional team when defining activities?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Activities cut across departments: only people familiar with the various operations can identify them, combine them correctly and credibly estimate the percentages of resource consumption.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== Glossario ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;glossario&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Review&lt;/span&gt;
  &lt;h2&gt;Essential glossary&lt;/h2&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Overhead&lt;/b&gt; · indirect manufacturing costs that cannot be traced directly to the product.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Cost object&lt;/b&gt; · anything whose cost we wish to measure: product, order, customer.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Allocation base&lt;/b&gt; · quantity used to allocate an indirect cost.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Plantwide overhead rate&lt;/b&gt; · a single overhead rate for the whole plant.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity&lt;/b&gt; · event that causes the consumption of overhead resources.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt; · “bucket” of costs related to a single activity measure.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity measure / cost driver&lt;/b&gt; · allocation base in an ABC system.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Transaction / duration driver&lt;/b&gt; · counts occurrences / measures time.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;First-stage allocation&lt;/b&gt; · from resources to pools, using consumption percentages.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt; · pool cost ÷ total activity.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Second-stage allocation&lt;/b&gt; · from pools to cost objects: rate × activity consumed.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Overcost / undercost&lt;/b&gt; · cost assigned too high / too low.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Product / customer margin&lt;/b&gt; · revenues less direct costs and ABC costs of the product / customer.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;ABM&lt;/b&gt; · activity-based management, the management and improvement of activities.&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== Approfondire ========== --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Sources&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;Works cited in the slides and related readings. Each entry is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;: the details come from web searches, not from the slides.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-prod&quot;&gt;Cited on slide 13 (“Kaplan et al. 1998”)&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Robin Cooper · &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt;&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Harvard Business School Press, Boston, c1998; many library records give 1997, ISBN 978-0-87584-788-7. &lt;a href=&quot;https://catalog.lib.kyushu-u.ac.jp/ja/recordID/1000418434&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Catalogue record (Kyushu University Library)&lt;/a&gt; · &lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;publisher&#x27;s listing&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Contents:&lt;/b&gt; a guide to activity-based cost management, with introductory chapters on ABC, on measuring the cost of resource capacity and on strategic activity-based management (product mix, pricing, customers); it also covers target costing and kaizen costing. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reference text by the “founders” of ABC and the source of the definition of activity used in the lecture. The chapter on the cost of capacity explains Baxter&#x27;s “unused capacity” pool.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-prod&quot;&gt;Cited on slide 14 (“Brimson, 1998”)&lt;/span&gt;
    &lt;h4&gt;James A. Brimson · &lt;i&gt;Activity Accounting: An Activity-Based Costing Approach&lt;/i&gt;&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; John Wiley &amp;amp; Sons. First edition 1991 (Wiley/National Association of Accountants series); paperback reprint July 1997, ISBN 978-0-471-19628-0, 224 pp. &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-0471196282.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wiley page&lt;/a&gt; · &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-0471196282,descCd-tableOfContents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;table of contents&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Contents:&lt;/b&gt; the framework of activity accounting, from the changing competitive environment to tracing costs to activities. Brimson is the founder of the ABM Institute. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the lecture&#x27;s key formula: “resources are consumed by activities, activities by products”. &lt;i&gt;Note:&lt;/i&gt; I could not find an edition dated 1998; the slide probably refers to the 1997/98 reprint.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-batch&quot;&gt;Likely source of the examples (not explicitly cited)&lt;/span&gt;
    &lt;h4&gt;Ray H. Garrison, Eric W. Noreen, Peter C. Brewer · &lt;i&gt;Managerial Accounting&lt;/i&gt;, chapter “Activity-Based Costing: A Tool to Aid Decision Making”&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; McGraw-Hill; the chapter with this title is ch. 8 in the 13th ed. (2009) and ch. 6–7 in other editions. &lt;a href=&quot;https://highered.mheducation.com/sites/0073379611/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of the 13th edition (McGraw-Hill)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Contents:&lt;/b&gt; a managerial accounting textbook; the ABC chapter follows the same learning objectives as the lecture (first-stage and second-stage allocation, product and customer margins). &lt;b&gt;Why it matters:&lt;/b&gt; the lecture title and the “5-7”, “5-8” numbering on the slides match the style of this textbook&#x27;s slides. Check with the lecturer which edition is adopted for the course.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-org&quot;&gt;Related reading (not cited in the slides)&lt;/span&gt;
    &lt;h4&gt;Robin Cooper, Robert S. Kaplan · “Measure Costs Right: Make the Right Decisions”&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Harvard Business Review&lt;/i&gt;, September 1988, 8 pp. &lt;a href=&quot;https://hbr.org/1988/09/measure-costs-right-make-the-right-decisions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Contents:&lt;/b&gt; the article that popularised ABC. It argues that multi-product companies make pricing, mix and technology decisions on the basis of distorted cost data, and proposes ABC as an alternative to be used alongside the official accounting system rather than replacing it. &lt;b&gt;Why it matters:&lt;/b&gt; it is the “managerial” version of the Baxter problem (Parts 2 and 6).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;
    &lt;span class=&quot;pill lv-org&quot;&gt;Related reading (not cited in the slides)&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson · “Time-Driven Activity-Based Costing”&lt;/h4&gt;
    &lt;p class=&quot;where&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Harvard Business Review&lt;/i&gt;, November 2004. &lt;a href=&quot;https://hbr.org/2004/11/time-driven-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Contents:&lt;/b&gt; a simplified version of ABC that replaces interviews with two parameters (cost per unit of time of capacity and time per activity), accounts for unused capacity and uses “time equations” for different orders and customers. &lt;b&gt;Why it matters:&lt;/b&gt; it addresses the practical limitations of steps 1–2 seen in the Baxter case.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;
