      &lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;305&quot; y=&quot;184&quot; width=&quot;215&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;412&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;12&quot;&gt;5 · IMPLEMENTATION&lt;/text&gt;&lt;text x=&quot;412&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;5 steps, 2 stages&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s6&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;184&quot; width=&quot;210&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;12&quot;&gt;6 · REPORTS&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Product and customer margins&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s7&quot;&gt;&lt;rect x=&quot;200&quot; y=&quot;320&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;344&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;t-sage&quot; font-size=&quot;12&quot;&gt;7 · MANAGERIAL USE&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;363&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;ABM, benchmarking, success&lt;/text&gt;&lt;/a&gt;

&lt;!-- ========== 1 ========== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 1 · Context&lt;/span&gt;
  &lt;h2&gt;Why a new approach to costing is needed&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 2–5&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;In the past… (19th and most of the 20th century)&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;Costing systems were &lt;b&gt;simple and satisfactory&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;em class=&quot;t&quot;&gt;Overhead&lt;/em&gt; (indirect manufacturing costs) was allocated using bases such as &lt;b&gt;labour-hours&lt;/b&gt; and &lt;b&gt;machine-hours&lt;/b&gt;: processes were &lt;i&gt;labour-intensive&lt;/i&gt;.&lt;/li&gt;
        &lt;li&gt;A single &lt;em class=&quot;t&quot;&gt;overhead pool&lt;/em&gt; (the whole plant) or a few pools (the departments).&lt;/li&gt;
        &lt;li&gt;Few products, with little variation among them.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;
      &lt;h4&gt;Today things are different&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;Many tasks once performed by direct workers are now carried out by &lt;b&gt;automated equipment&lt;/b&gt;, which is overhead.&lt;/li&gt;
        &lt;li&gt;New products and services, introduced at an increasing pace, differ in volume, &lt;i&gt;batch size&lt;/i&gt; and complexity: &lt;b&gt;product and service diversity&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;More support resources are required (schedulers, design engineers) that are &lt;b&gt;not driven&lt;/b&gt; by labour-hours or machine-hours.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;p class=&quot;key&quot;&gt;Consequence: with traditional allocation bases, the &lt;b&gt;unit product cost&lt;/b&gt; is likely to be distorted and misleading for decision making.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Illustrative chart: direct labour cost declining, overhead rising&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;210&quot; x2=&quot;730&quot; y2=&quot;210&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;60&quot; y2=&quot;210&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;395&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot;&gt;time → (automation, product variety)&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;115&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot; transform=&quot;rotate(-90 20 115)&quot; text-anchor=&quot;middle&quot;&gt;share of total cost&lt;/text&gt;
      &lt;path d=&quot;M60 50 C250 70 420 150 720 185&quot; fill=&quot;none&quot; style=&quot;stroke:var(--ochre)&quot; stroke-width=&quot;4&quot;/&gt;
      &lt;path d=&quot;M60 180 C250 165 420 90 720 40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brick)&quot; stroke-width=&quot;4&quot;/&gt;
      &lt;text x=&quot;80&quot; y=&quot;42&quot; font-size=&quot;14&quot; class=&quot;t-ochre&quot; font-weight=&quot;700&quot;&gt;Direct labour&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;32&quot; font-size=&quot;14&quot; class=&quot;t-brick&quot; font-weight=&quot;700&quot;&gt;Overhead&lt;/text&gt;
      &lt;circle cx=&quot;400&quot; cy=&quot;118&quot; r=&quot;6&quot; class=&quot;f-card s-ink&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;412&quot; y=&quot;140&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;the base (labour hours) and the cost to be allocated&lt;/text&gt;
      &lt;text x=&quot;412&quot; y=&quot;156&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;move in “opposite directions”&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Illustrative diagram (not data from the slides) of the trend described on slides 3 and 18: direct labour accounts for an ever smaller share of cost, overhead for an ever larger one.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Classifying costs: two criteria not to be confused&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Manufacturing vs nonmanufacturing&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Direct vs indirect&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product vs period cost&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Manufacturing companies divide costs into two broad families (slide 4):&lt;/p&gt;
      &lt;figure style=&quot;margin:8px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Manufacturing and nonmanufacturing costs&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;8&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Manufacturing costs&lt;/text&gt;
          &lt;rect x=&quot;380&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;8&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Nonmanufacturing costs&lt;/text&gt;
          &lt;g style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M170 56 V80 M70 80 H270 M70 80 V100 M170 80 V100 M270 80 V100 M530 56 V80 M460 80 H600 M460 80 V100 M600 80 V100&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
            &lt;rect x=&quot;20&quot; y=&quot;100&quot; width=&quot;100&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;125&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;142&quot;&gt;materials&lt;/text&gt;
            &lt;rect x=&quot;125&quot; y=&quot;100&quot; width=&quot;90&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;125&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;142&quot;&gt;labor&lt;/text&gt;
            &lt;rect x=&quot;220&quot; y=&quot;100&quot; width=&quot;100&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-sage&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;125&quot;&gt;Manufact.&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;142&quot;&gt;overhead&lt;/text&gt;
            &lt;rect x=&quot;400&quot; y=&quot;100&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-brick&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;125&quot;&gt;Selling&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;142&quot;&gt;costs&lt;/text&gt;
            &lt;rect x=&quot;540&quot; y=&quot;100&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;6&quot; class=&quot;f-card s-brick&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;125&quot;&gt;Administrative&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;142&quot;&gt;costs&lt;/text&gt;
          &lt;/g&gt;
          &lt;text x=&quot;350&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;costs of making the product | costs of selling it and running the business&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The criterion here is the relationship with the &lt;em class=&quot;t&quot;&gt;cost object&lt;/em&gt; (anything whose cost we wish to know: a product, an order, a customer, a department).&lt;/p&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Direct costs&lt;/h4&gt;Can be &lt;b&gt;traced&lt;/b&gt; easily and conveniently to a unit of product or another cost object. Examples: direct material, direct labor.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;Indirect costs&lt;/h4&gt;Can&lt;b&gt;not&lt;/b&gt; be traced easily and conveniently. Example: manufacturing overhead (equipment depreciation, factory utilities, indirect wages…).&lt;/div&gt;
      &lt;/div&gt;
      &lt;p style=&quot;margin-top:12px&quot;&gt;How, then, are indirect costs assigned to cost objects? Through an &lt;em class=&quot;t&quot;&gt;allocation basis&lt;/em&gt;: a measurable quantity (hours, units, orders…) used to divide up the common cost.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;A concept the slides take for granted (slide 73): in traditional accounting, manufacturing costs are &lt;b&gt;product costs&lt;/b&gt;, i.e. they become part of the cost of the product and of &lt;i&gt;cost of goods sold&lt;/i&gt;; selling and administrative costs are &lt;b&gt;period expenses&lt;/b&gt;, i.e. they are expensed in the period in which they are incurred and never assigned to products.&lt;/p&gt;
      &lt;p&gt;This is why Baxter&#x27;s traditional system (Part 2) computes product margins without touching shipping, marketing or administration. ABC, by contrast, moves beyond this distinction (Part 3).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why were labour hours a good allocation base in the twentieth century, and why are they less so today?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because processes were labour-intensive and overhead grew roughly in step with direct labour. Today automation reduces direct labour while overhead increases, and much overhead (design, scheduling) does not depend on hours: the base is no longer correlated with the cost to be allocated.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is the salary of the production planning manager a direct or an indirect cost with respect to a single battery?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Indirect: it cannot be traced easily and conveniently to a single unit. It is manufacturing overhead.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is shipping cost manufacturing or nonmanufacturing? A product or a period cost in the traditional system?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;It is a nonmanufacturing (selling) cost; in the traditional system it is a period expense, so it is not included in product cost. In Baxter&#x27;s ABC system, by contrast, it is traced directly to products and customers.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 2 ========== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 2 · The traditional method&lt;/span&gt;
  &lt;h2&gt;Baxter Battery Company and the plantwide overhead rate&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 6–10 (revisited on slide 69)&lt;/p&gt;

  &lt;p&gt;Baxter makes two car batteries: &lt;b&gt;SureStart&lt;/b&gt; (standard) and &lt;b&gt;LongLife&lt;/b&gt; (deluxe). In year 20X0 it reports the &lt;b&gt;first loss in its history&lt;/b&gt;. The income statement:&lt;/p&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Income statement, 20X0&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;50,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;15,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;12,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;14,000,000&lt;/td&gt;&lt;td&gt;41,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;9,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;grp&quot;&gt;&lt;td&gt;Selling and administrative expenses&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Shipping&lt;/td&gt;&lt;td&gt;3,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Marketing&lt;/td&gt;&lt;td&gt;2,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;General administrative&lt;/td&gt;&lt;td&gt;6,000,000&lt;/td&gt;&lt;td&gt;11,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;(2,000,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;The 4 steps of the traditional system&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Direct data&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Single rate&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Allocation&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Margins&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Sales and direct costs are collected for each product.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31,300,000&lt;/td&gt;&lt;td&gt;18,700,000&lt;/td&gt;&lt;td&gt;50,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct material&lt;/td&gt;&lt;td&gt;9,000,000&lt;/td&gt;&lt;td&gt;6,000,000&lt;/td&gt;&lt;td&gt;15,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7,000,000&lt;/td&gt;&lt;td&gt;5,000,000&lt;/td&gt;&lt;td&gt;12,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;A single rate is computed for the whole plant, the &lt;em class=&quot;t&quot;&gt;plantwide overhead rate&lt;/em&gt;, using machine-hours (MH) as the base.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Plantwide rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total manufacturing overhead&lt;/span&gt;&lt;span&gt;Total MH&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;14,000,000&lt;/span&gt;&lt;span&gt;800,000 MH&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;$ 17.50 per MH&lt;/b&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Overhead: indirect wages 6,000,000 + equipment depreciation 3,500,000 + utilities 2,500,000 + factory lease 2,000,000. MH: SureStart 800,000 × 0.60 h = 480,000; LongLife 400,000 × 0.80 h = 320,000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;MH&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Allocated overhead&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;SureStart&lt;/td&gt;&lt;td&gt;480,000&lt;/td&gt;&lt;td&gt;17.50&lt;/td&gt;&lt;td&gt;8,400,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;LongLife&lt;/td&gt;&lt;td&gt;320,000&lt;/td&gt;&lt;td&gt;17.50&lt;/td&gt;&lt;td&gt;5,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;14,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;All manufacturing overhead is assigned to the products &lt;b&gt;in proportion to machine-hours&lt;/b&gt;: SureStart receives 60% of it, LongLife 40%.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;SureStart&lt;/th&gt;&lt;th&gt;LongLife&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;31,300,000&lt;/td&gt;&lt;td&gt;18,700,000&lt;/td&gt;&lt;td&gt;50,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;9,000,000&lt;/td&gt;&lt;td&gt;6,000,000&lt;/td&gt;&lt;td&gt;15,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;7,000,000&lt;/td&gt;&lt;td&gt;5,000,000&lt;/td&gt;&lt;td&gt;12,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;8,400,000&lt;/td&gt;&lt;td&gt;5,600,000&lt;/td&gt;&lt;td&gt;14,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;6,900,000&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;2,100,000&lt;/td&gt;&lt;td&gt;9,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Selling and administrative&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;11,000,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;sum&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;(2,000,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;“What do we understand looking at these numbers?” (slide 10)&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;According to the traditional system &lt;b&gt;both products are profitable&lt;/b&gt;; the loss appears to be caused solely by the 11 million of selling and administrative expenses, which remain “above” the products as a period cost. The report does not say &lt;i&gt;who&lt;/i&gt; causes those expenses, nor whether overhead has been distributed correctly. Spoiler: with ABC the picture is reversed (Part 6).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Compute the overhead allocated to a single LongLife battery under the traditional method.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;0.80 MH × $ 17.50 = &lt;b&gt;$ 14&lt;/b&gt; per battery (5,600,000 / 400,000 = 14, consistent).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What hidden assumption does the plantwide rate make?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;That all overhead varies in proportion to machine-hours, i.e. to production volume. If part of the costs is instead driven by orders, designs or customers, the assumption is false and costs are shifted from one product to another.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the total product margin (9 M) not match the bottom line (−2 M)?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because 11 M of selling &amp;amp; administrative expenses are treated as period expenses and are not assigned to products.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 3 ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s3&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 3 · Objective 1&lt;/span&gt;
  &lt;h2&gt;What Activity-Based Costing is&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 11–22 · “Understand activity-based costing and how it differs from a traditional costing system”&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-Based Costing (ABC).&lt;/b&gt; A costing method designed to provide managers with cost information for strategic and other decisions that may affect &lt;b&gt;capacity&lt;/b&gt; (the resources available, such as people, machines and space) and therefore “fixed” as well as variable costs.&lt;/div&gt;

  &lt;p&gt;The quotation marks around “fixed” matter: a cost is fixed only in the short run. If the company decides to drop a highly complex product, it can reduce its design capacity (fewer engineers) and that “fixed” cost disappears. ABC is designed precisely to reveal these links.&lt;/p&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Replaces cost centres&lt;/h4&gt;It usually replaces the system based on &lt;em class=&quot;t&quot;&gt;cost centers&lt;/em&gt; (units that mirror the organisational chart: departments, offices).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cross-functional&lt;/h4&gt;The main benefit: attention to resource management &lt;b&gt;cuts across organisational units&lt;/b&gt;. An activity such as “filling an order” involves sales, production and administration.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activities at the core&lt;/h4&gt;Combinations of people, technologies, raw materials and environmental conditions aimed at a final output &lt;span class=&quot;small&quot;&gt;(Kaplan et al., 1998)&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The basic idea: resources → activities → cost objects&lt;/h3&gt;
  &lt;p&gt;&lt;b&gt;Resources are consumed by activities&lt;/b&gt;; &lt;b&gt;activities are consumed by the goods/services&lt;/b&gt; the organisation provides &lt;span class=&quot;small&quot;&gt;(Brimson, 1998)&lt;/span&gt;. &lt;b&gt;By consuming resources, activities generate costs.&lt;/b&gt; Resources often include the &lt;i&gt;core competencies&lt;/i&gt; that determine the ability to deliver high-quality products and services.&lt;/p&gt;

      &lt;text x=&quot;530&quot; y=&quot;279&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;f-muted&quot;&gt;activity rate × driver quantity&lt;/text&gt;

  &lt;h3&gt;How ABC treats costs: 4 differences&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · No wall&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · More pools&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Own measures&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Why now&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;In ABC the distinction between &lt;b&gt;manufacturing and nonmanufacturing costs disappears&lt;/b&gt;: all costs are analysed according to the extent to which activities “consume resources”.&lt;/p&gt;
      &lt;p&gt;Both manufacturing and nonmanufacturing costs &lt;b&gt;may&lt;/b&gt; be assigned to products, but &lt;b&gt;only on a cause-and-effect basis&lt;/b&gt;. Costs with no causal link (e.g. headquarters rent) should not be spread over products.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;ABC uses &lt;b&gt;numerous overhead cost pools&lt;/b&gt;. More pools mean greater accuracy, but also greater complexity.&lt;/p&gt;
      &lt;figure style=&quot;margin:6px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 600 250&quot; role=&quot;img&quot; aria-label=&quot;Increasing complexity: plantwide, departmental, ABC&quot;&gt;
          &lt;line x1=&quot;60&quot; y1=&quot;215&quot; x2=&quot;580&quot; y2=&quot;215&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;15&quot; x2=&quot;60&quot; y2=&quot;215&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;320&quot; y=&quot;243&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Number of cost pools →&lt;/text&gt;
          &lt;text x=&quot;24&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; transform=&quot;rotate(-90 24 115)&quot;&gt;Level of complexity →&lt;/text&gt;
          &lt;rect x=&quot;80&quot; y=&quot;150&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Plantwide&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;overhead rate&lt;/text&gt;
          &lt;rect x=&quot;250&quot; y=&quot;95&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Departmental&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;overhead rates&lt;/text&gt;
          &lt;rect x=&quot;420&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;55&quot; rx=&quot;6&quot; class=&quot;f-slate s-slate&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Activity-Based&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;71&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Costing&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Departmental overhead rates&lt;/b&gt;: a separate rate for each department, halfway between the single plantwide rate and ABC.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Each ABC cost pool has its own &lt;b&gt;activity measure&lt;/b&gt;; traditional systems use direct labor hours and/or machine hours for &lt;i&gt;all&lt;/i&gt; overhead.&lt;/p&gt;
      &lt;p&gt;Hours work well &lt;b&gt;only if&lt;/b&gt; changes in the base are correlated with changes in the allocated costs. Example: machine utilities rise with machine hours (fine); design costs do not.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Relying solely on labour hours or machine hours is increasingly criticised because direct labour and overhead move in &lt;b&gt;opposite directions&lt;/b&gt; and &lt;b&gt;product diversity&lt;/b&gt; has increased (see the chart in Part 1).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Key vocabulary&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity&lt;/h4&gt;An “event” that causes the consumption of overhead resources. E.g. receiving an order, setting up equipment.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity cost pool&lt;/h4&gt;A “bucket” (&lt;i&gt;cost bucket&lt;/i&gt;) in which costs related to &lt;b&gt;a single&lt;/b&gt; activity measure are accumulated.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activity measure = cost driver&lt;/h4&gt;The allocation base in an ABC system. Also called a &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt;: the quantity that “drives” the consumption of resources.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Two common types of activity measure&lt;/h4&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--ochre-bg);--c:var(--ochre)&quot;&gt;&lt;h4&gt;Transaction driver&lt;/h4&gt;A simple &lt;b&gt;count&lt;/b&gt; of the number of times an activity occurs.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;E.g. number of invoices sent to a customer.&lt;/span&gt;&lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;Inexpensive to measure; assumes that each occurrence of the activity requires the same resources.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;--cb:var(--sage-bg);--c:var(--sage)&quot;&gt;&lt;h4&gt;Duration driver&lt;/h4&gt;A measure of the &lt;b&gt;time&lt;/b&gt; required to perform an activity.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;E.g. time spent preparing individual invoices.&lt;/span&gt;&lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;More accurate when occurrences differ widely (simple vs complex invoice), but more costly to record.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to Brimson, what consumes what?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Activities consume resources; products/services consume activities. By consuming resources, activities generate costs.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the definition of ABC put “fixed” costs in quotation marks?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because decisions affecting capacity (e.g. dropping a product, reducing design work) can, over the medium term, change costs that appear fixed in the short run. ABC shows which activities generate them.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;“Number of setups” or “setup hours”: which is a transaction driver and which a duration driver? When should the latter be chosen?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Number of setups = transaction driver; setup hours = duration driver. The latter is preferable when setup times differ widely across products, so that a simple count would distort the cost.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between an activity cost pool and a traditional cost center?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;A cost center follows the organisational chart (a department); an activity cost pool collects costs from any department, provided they relate to the same activity and the same activity measure.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 4 ========== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s4&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 4 · Cost hierarchy&lt;/span&gt;
  &lt;h2&gt;The five activity levels&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 23–28&lt;/p&gt;

  &lt;p&gt;Traditional systems use allocation bases &lt;b&gt;driven by production volume&lt;/b&gt; (&lt;i&gt;volume-related&lt;/i&gt;). ABC, by contrast, recognises &lt;b&gt;five levels of activity&lt;/b&gt; which, except for the first, are &lt;b&gt;largely unrelated to the number of units produced&lt;/b&gt;. Manufacturing companies typically group their activities into these five classes.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 780 330&quot; role=&quot;img&quot; aria-label=&quot;Hierarchy of the five activity levels&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-sage s-sage&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;34&quot; font-weight=&quot;700&quot; class=&quot;t-sage&quot; font-size=&quot;15&quot;&gt;Unit-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;54&quot; class=&quot;f-muted&quot;&gt;performed for each unit&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;34&quot;&gt;Power to run the machines&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;54&quot; class=&quot;f-muted&quot;&gt;driver: units, machine-hours&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;74&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-ochre s-ochre&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;98&quot; font-weight=&quot;700&quot; class=&quot;t-ochre&quot; font-size=&quot;15&quot;&gt;Batch-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;118&quot; class=&quot;f-muted&quot;&gt;for each batch, whatever its size&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;98&quot;&gt;Equipment setups, arranging shipments&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;118&quot; class=&quot;f-muted&quot;&gt;driver: no. of batches, orders, setups&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;138&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-slate s-slate&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;162&quot; font-weight=&quot;700&quot; class=&quot;t-slate&quot; font-size=&quot;15&quot;&gt;Product-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;182&quot; class=&quot;f-muted&quot;&gt;for each product, regardless of batches and units&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;162&quot;&gt;Product design, advertising&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;182&quot; class=&quot;f-muted&quot;&gt;driver: no. of designs, no. of products&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;202&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-brick s-brick&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;226&quot; font-weight=&quot;700&quot; class=&quot;t-brick&quot; font-size=&quot;15&quot;&gt;Customer-level&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;246&quot; class=&quot;f-muted&quot;&gt;related to specific customers&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;226&quot;&gt;Sales calls, general technical support&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;246&quot; class=&quot;f-muted&quot;&gt;driver: no. of active customers&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;266&quot; width=&quot;760&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;28&quot; y=&quot;290&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Organization-sustaining&lt;/text&gt;&lt;text x=&quot;28&quot; y=&quot;310&quot; class=&quot;f-muted&quot;&gt;independent of volumes, products, customers&lt;/text&gt;
        &lt;text x=&quot;300&quot; y=&quot;290&quot;&gt;Heating the factory, cleaning offices, annual report&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;310&quot; class=&quot;f-muted&quot;&gt;no driver: normally not allocated&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;From top to bottom, activities are less and less related to volume. Examples from slides 25–26; the typical drivers are an explanatory addition.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;note&quot;&gt;The key to classification: ask yourself &lt;b&gt;“what triggers the cost?”&lt;/b&gt; If I double the units in a batch, does the cost double? Then it is unit-level. If it stays the same until I start a new batch, it is batch-level. If it stays the same until I create a new product, it is product-level.&lt;/div&gt;

  &lt;h3&gt;Example: Western River Expeditions&lt;/h3&gt;
  &lt;p&gt;Rafting on the Colorado River: a 6-day trip through the Grand Canyon. Each trip uses 1 or 2 &lt;b&gt;rafts&lt;/b&gt;, each with &lt;b&gt;2 guides&lt;/b&gt; and up to &lt;b&gt;18 guests&lt;/b&gt;. The guides prepare all meals. Each guest receives a &lt;b&gt;mug&lt;/b&gt; to use and take home.&lt;/p&gt;
  &lt;div class=&quot;game&quot; data-options=&quot;Unit-level|Batch-level|Product-level&quot;&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Unit-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;The mug given to each guest&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Unit-level: the “unit” is the guest; each additional guest costs one more mug (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;The guides&#x27; wages&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Batch-level: the “batch” is the raft; 2 guides per raft, whether it carries 5 or 18 guests (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;The food served during the trip&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;It looks unit-level, but more information is needed: the standard menu is prepared the day before departure and the food arrives prepackaged in large batches, so it does not adjust to the actual number of guests. According to the slides it is more correct to treat it as &lt;b&gt;batch-level&lt;/b&gt; (slide 28).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Product-level&quot;&gt;&lt;div class=&quot;q&quot;&gt;Designing and promoting the “6 days in the Grand Canyon” itinerary&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Product-level: the “product” is the type of trip; the cost does not depend on how many rafts or guests set off. &lt;i&gt;The slides pose the question but do not give the answer: this example is our own interpretation.&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Methodological lesson: the same cost item can belong to different levels depending on &lt;b&gt;how the company actually performs the activity&lt;/b&gt;. Classification requires information about processes, not just about the nature of the cost.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which of the five levels is the only truly “volume-related” one?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;The unit level: costs are proportional to the number of units produced.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A company produces 1 batch of 1,000 units instead of 10 batches of 100. What happens to setup costs? And to machine power?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Setup costs (batch-level) fall roughly tenfold because setups drop from 10 to 1; power (unit-level) stays roughly the same because there are still 1,000 units.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is it dangerous to allocate organization-sustaining costs to products?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because they have no cause-and-effect relationship with products or customers: any allocation would be arbitrary and could lead to wrong decisions (e.g. dropping a product without those costs disappearing).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== 5 ========== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s5&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part 5 · Objectives 2–4&lt;/span&gt;
  &lt;h2&gt;Implementing ABC: five steps&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 29–64&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Define activities, activity cost pools and activity measures&lt;/h4&gt;&lt;p&gt;The longest step and the foundation of the entire system. Typically, &lt;b&gt;employees are interviewed&lt;/b&gt; and asked to describe their main activities: the result is a &lt;b&gt;very long&lt;/b&gt; list, which must be shortened by combining similar activities.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Assign overhead costs to the cost pools&lt;/h4&gt;&lt;p&gt;&lt;b&gt;First-stage allocation&lt;/b&gt;: each overhead item, manufacturing and nonmanufacturing, is distributed among the pools according to the % of resources each activity consumes (usually estimated through interviews).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Calculate activity rates&lt;/h4&gt;&lt;p&gt;For each pool: &lt;b&gt;total pool cost ÷ total activity&lt;/b&gt;. The result is a cost per order, per design, per machine hour, per customer.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h4&gt;Assign overhead costs to cost objects&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Second-stage allocation&lt;/b&gt;: activity rate × quantity of activity consumed by a product, an order or a customer.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h4&gt;Prepare management reports&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Product margin&lt;/b&gt; and &lt;b&gt;customer margin&lt;/b&gt; reports that add up direct costs and ABC costs and subtract them from revenues.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;step-count small&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Step 1 in detail: three issues&lt;/h3&gt;
  &lt;details open&gt;&lt;summary&gt;Issue 1 · How to define activities&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Interviews with employees, asking them to describe their main activities. Typical result: a VERY long list.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Issue 2 · How many activities to keep?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;More activities = more accurate cost information, but a system that is more costly to design, implement, maintain and use. A manageable list (a &lt;i&gt;handful&lt;/i&gt;) is needed, obtained by combining similar activities. Try the slider:&lt;/p&gt;
    &lt;div class=&quot;lab&quot;&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;label for=&quot;nact&quot;&gt;Number of activity cost pools&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;nact&quot; min=&quot;1&quot; max=&quot;40&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;nact-o&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 220&quot; id=&quot;nact-svg&quot; role=&quot;img&quot; aria-label=&quot;Illustrative curves of system accuracy and cost&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;580&quot; y2=&quot;190&quot; class=&quot;s-ink&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;190&quot; class=&quot;s-ink&quot;/&gt;
        &lt;path id=&quot;c-acc&quot; fill=&quot;none&quot; style=&quot;stroke:var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;path id=&quot;c-cost&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;path id=&quot;c-net&quot; fill=&quot;none&quot; style=&quot;stroke:var(--slate)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot;/&gt;
        &lt;line id=&quot;c-mark&quot; y1=&quot;10&quot; y2=&quot;190&quot; style=&quot;stroke:var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;300&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-muted&quot;&gt;number of activities / cost pools&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;40&quot; font-size=&quot;12&quot; class=&quot;t-sage&quot; font-weight=&quot;700&quot;&gt;accuracy&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;150&quot; font-size=&quot;12&quot; class=&quot;t-brick&quot; font-weight=&quot;700&quot;&gt;system cost&lt;/text&gt;
        &lt;text x=&quot;60&quot; y=&quot;24&quot; font-size=&quot;12&quot; class=&quot;t-slate&quot; font-weight=&quot;700&quot;&gt;net benefit&lt;/text&gt;
      &lt;/svg&gt;
      &lt;p id=&quot;nact-msg&quot; class=&quot;small&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:4px 0 0&quot;&gt;Qualitative curves for teaching purposes, not data from the slides.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Issue 3 · How to combine activities&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Activities at the &lt;b&gt;same level&lt;/b&gt; that are &lt;b&gt;highly correlated&lt;/b&gt; are grouped together. E.g. “number of orders received” and “number of orders completed and shipped” (two batch-level activities that move together) become a single pool. Note: activities are &lt;b&gt;firm specific&lt;/b&gt;, i.e. they must be defined for the particular company.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Baxter&#x27;s five pools&lt;/h3&gt;
  &lt;p&gt;For each one the slides ask: &lt;i&gt;“Which is the level involved?”&lt;/i&gt; Try before revealing the answer.&lt;/p&gt;
  &lt;div class=&quot;game&quot; data-options=&quot;Unit|Batch|Product|Customer|Organization-sustaining&quot;&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Batch&quot;&gt;&lt;div class=&quot;q&quot;&gt;Customer Orders: costs of receiving and processing customer orders&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Batch-level: an order generates the same work whether it involves 1 unit or 1,000. Measure: &lt;b&gt;number of orders&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Product&quot;&gt;&lt;div class=&quot;q&quot;&gt;Product Design: costs of designing products&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Product-level: design work does not depend on units ordered or on batches. Measure: &lt;b&gt;number of product designs&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Unit&quot;&gt;&lt;div class=&quot;q&quot;&gt;Order Size: costs related to the number of units produced (power for the machines, part of depreciation)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Unit-level: each unit requires a share of these resources. Measure: &lt;b&gt;machine-hours&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Customer&quot;&gt;&lt;div class=&quot;q&quot;&gt;Customer Relations: costs of maintaining relations with customers (sales calls)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Customer-level. Measure: &lt;b&gt;number of active customers&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gitem&quot; data-a=&quot;Organization-sustaining&quot;&gt;&lt;div class=&quot;q&quot;&gt;Other: organization-sustaining and idle capacity costs&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;Organization-sustaining (plus &lt;em class=&quot;t&quot;&gt;unused capacity&lt;/em&gt;, i.e. the cost of resources that are available but not used). Measure: &lt;b&gt;not applicable&lt;/b&gt;, so these costs remain unallocated.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
