&lt;main&gt;
&lt;!-- 1. THE CASE --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;caso&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 1&lt;/span&gt;&lt;h2&gt;The case: Hickory Company&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Hickory Company manufactures two products: &lt;b class=&quot;y&quot;&gt;14,000 units of Product Y&lt;/b&gt; (high volume) and &lt;b class=&quot;z&quot;&gt;6,000 units of Product Z&lt;/b&gt; (low volume). It currently uses a &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; (a single factory-wide rate for indirect costs) based on &lt;span class=&quot;term&quot;&gt;direct labor-hours&lt;/span&gt; (DLH). It is considering a switch to an &lt;span class=&quot;term&quot;&gt;activity-based costing&lt;/span&gt; (ABC) system that would assign all &lt;b&gt;$684,000&lt;/b&gt; of &lt;span class=&quot;term&quot;&gt;manufacturing overhead&lt;/span&gt; to four &lt;span class=&quot;term&quot;&gt;activity cost pools&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt;&lt;br&gt;All manufacturing costs other than direct materials and direct labor: machine depreciation, utilities, setups, engineering, supervision, factory rent… They cannot be traced &quot;by inspection&quot; to a single product, so they must be &lt;em&gt;allocated&lt;/em&gt; according to a rule.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt;&lt;br&gt;A &quot;bucket&quot; in which the costs of a single activity are accumulated (e.g., all setup costs). Each pool has its own &lt;span class=&quot;term&quot;&gt;activity measure&lt;/span&gt; (or &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;): the unit used to measure how much of that activity each product consumes.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Activity cost pools&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Activity by product&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;The 15 questions&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;Estimated overhead cost&lt;/th&gt;&lt;th&gt;Expected activity&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;Machine-hours&lt;/td&gt;&lt;td&gt;$200,000&lt;/td&gt;&lt;td&gt;10,000 MH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;Number of setups&lt;/td&gt;&lt;td&gt;$100,000&lt;/td&gt;&lt;td&gt;200 setups&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;Number of products&lt;/td&gt;&lt;td&gt;$84,000&lt;/td&gt;&lt;td&gt;2 products&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;General factory&lt;/td&gt;&lt;td&gt;Direct labor-hours&lt;/td&gt;&lt;td&gt;$300,000&lt;/td&gt;&lt;td&gt;12,000 DLH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$684,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Slide 2&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th class=&quot;y&quot;&gt;Product Y&lt;/th&gt;&lt;th class=&quot;z&quot;&gt;Product Z&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine-hours&lt;/td&gt;&lt;td&gt;7,000&lt;/td&gt;&lt;td&gt;3,000&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Number of setups&lt;/td&gt;&lt;td&gt;50&lt;/td&gt;&lt;td&gt;150&lt;/td&gt;&lt;td&gt;200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Number of products&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor-hours&lt;/td&gt;&lt;td&gt;8,000&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;12,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Units produced&lt;/i&gt;&lt;/td&gt;&lt;td&gt;14,000&lt;/td&gt;&lt;td&gt;6,000&lt;/td&gt;&lt;td&gt;20,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;The &quot;trick&quot; of the exercise is already visible here: Y accounts for 2/3 of the labor-hours but only 1/4 of the setups. Z is small in volume but &quot;complex&quot;: many short batches.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;Slide 2&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;ul style=&quot;list-style:none;padding:0;margin:0&quot;&gt;
        &lt;li&gt;&lt;b&gt;1.&lt;/b&gt; Plantwide overhead rate.&lt;/li&gt;&lt;li&gt;&lt;b&gt;2.&lt;/b&gt; Overhead allocated to Y and Z using the plantwide rate.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;3–6.&lt;/b&gt; Activity rates for Machining, Machine setups, Product design, General factory.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;7.&lt;/b&gt; Which activity is &lt;span class=&quot;term&quot;&gt;batch-level&lt;/span&gt;? Why?&lt;/li&gt;&lt;li&gt;&lt;b&gt;8.&lt;/b&gt; Which activity is &lt;span class=&quot;term&quot;&gt;product-level&lt;/span&gt;? Why?&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;9–10.&lt;/b&gt; Total overhead assigned to Y and to Z under ABC.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;11.&lt;/b&gt; % of overhead allocated to Y and Z under the plantwide rate.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;12–15.&lt;/b&gt; % of each pool (Machining, Setups, Design, General factory) assigned to Y and Z under ABC: are they similar to those in question 11? Why?&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;src&quot;&gt;Slides 3–4. Margin note on slide 3: the plantwide rate &quot;refers to the allocation of all overhead costs using direct labor-hours&quot;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why must overhead be &quot;allocated&quot; rather than simply &quot;traced&quot; like materials?&lt;/summary&gt;&lt;p&gt;Because it is an indirect cost: it serves several products at once and there is no direct measure of how much each one uses. One base (or several) must be chosen to approximate consumption.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Looking only at the activity table, which product do you suspect is undercosted by the current system?&lt;/summary&gt;&lt;p&gt;Product Z: it uses 75% of the setups but only 33% of the DLH. A DLH-based system will assign it less setup cost than it actually causes.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 2. PLANTWIDE --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;plantwide&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 2 · requirements 1–2&lt;/span&gt;&lt;h2&gt;The plantwide overhead rate&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;The &quot;traditional&quot; system: a single &lt;span class=&quot;term&quot;&gt;cost pool&lt;/span&gt; for the whole plant and a single &lt;span class=&quot;term&quot;&gt;allocation base&lt;/span&gt;. A &lt;em&gt;predetermined&lt;/em&gt; rate is computed (from estimates made at the start of the period) and applied to each product in proportion to the labor-hours it consumes.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Plantwide overhead rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total estimated overhead cost&lt;/span&gt;&lt;span&gt;Total expected direct labor-hours&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;$684,000&lt;/span&gt;&lt;span&gt;12,000 DLH&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;$57 per DLH&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Overhead allocated = product&#x27;s DLH × $57&lt;br&gt;
    &lt;span class=&quot;y&quot;&gt;Y: 8,000 × 57 = $456,000&lt;/span&gt; &amp;nbsp;·&amp;nbsp; &lt;span class=&quot;z&quot;&gt;Z: 4,000 × 57 = $228,000&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 5&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 760 200&quot; role=&quot;img&quot; aria-label=&quot;Plantwide rate diagram: a single pool, a single base&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;110&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Total overhead&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$684,000&lt;/text&gt;
    &lt;path d=&quot;M200,100 L290,100&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;circle cx=&quot;350&quot; cy=&quot;100&quot; r=&quot;56&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;350&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$57&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;per DLH&lt;/text&gt;
    &lt;path d=&quot;M406,90 C470,60 500,50 540,48&quot; stroke=&quot;var(--Y)&quot; stroke-width=&quot;10&quot; fill=&quot;none&quot; opacity=&quot;.75&quot;/&gt;
    &lt;path d=&quot;M406,110 C470,140 500,150 540,152&quot; stroke=&quot;var(--Z)&quot; stroke-width=&quot;5&quot; fill=&quot;none&quot; opacity=&quot;.75&quot;/&gt;
    &lt;rect x=&quot;545&quot; y=&quot;22&quot; width=&quot;190&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--Y)&quot;/&gt;
    &lt;text x=&quot;640&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;y&quot;&gt;Product Y · 8,000 DLH&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$456,000 (66.7%)&lt;/text&gt;
    &lt;rect x=&quot;545&quot; y=&quot;126&quot; width=&quot;190&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--Z)&quot;/&gt;
    &lt;text x=&quot;640&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;z&quot;&gt;Product Z · 4,000 DLH&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;167&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$228,000 (33.3%)&lt;/text&gt;
  &lt;/svg&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;What the slide takes for granted: strengths and limitations of a single rate&lt;/summary&gt;
    &lt;p&gt;&lt;b&gt;Strengths:&lt;/b&gt; very simple, inexpensive to maintain, and reasonable when products are similar and overhead is genuinely driven by volume.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Limitation:&lt;/b&gt; the DLH base is a &lt;span class=&quot;term&quot;&gt;unit-level&lt;/span&gt; measure (it grows with the number of units produced). It therefore assumes that &lt;em&gt;all&lt;/em&gt; overhead grows with volume. But setups and product design do not depend on how many units are made: they depend on how many batches and how many products are managed. Result: the high-volume product also pays for the complexity of the low-volume products → &lt;span class=&quot;term&quot;&gt;cost distortion&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt; (one product &quot;subsidizes&quot; the other).&lt;/p&gt;
  &lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;If expected DLH were 15,000 instead of 12,000 (overhead unchanged), what would the plantwide rate be?&lt;/summary&gt;&lt;p&gt;$684,000 / 15,000 = $45.60 per DLH.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Under the plantwide rate, how much overhead per unit do Y and Z receive?&lt;/summary&gt;&lt;p&gt;Y: $456,000 / 14,000 ≈ $32.57 per unit; Z: $228,000 / 6,000 = $38.00 per unit. &lt;span class=&quot;note&quot;&gt;(our calculation, not in the slides)&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What exactly do the 66.7% / 33.3% percentages depend on?&lt;/summary&gt;&lt;p&gt;Only on the DLH ratio: 8,000/12,000 and 4,000/12,000. The $57 rate cancels out: with a single base, the percentage split equals each product&#x27;s share of the base.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 3. ABC --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;abc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 3 · requirements 3–6&lt;/span&gt;&lt;h2&gt;Activity-based costing: pools and activity rates&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;ABC breaks overhead down into several pools, one per activity, and assigns each pool using its own &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;. It is a &lt;b&gt;two-stage&lt;/b&gt; process: (1) resource costs are assigned to activities; (2) activity costs are assigned to products according to how much of each activity they consume.&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 860 330&quot; role=&quot;img&quot; aria-label=&quot;Two-stage ABC diagram&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;135&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Resources&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;overhead $684k&lt;/text&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;
      &lt;path d=&quot;M170,155 L268,45&quot;/&gt;&lt;path d=&quot;M170,160 L268,125&quot;/&gt;&lt;path d=&quot;M170,170 L268,205&quot;/&gt;&lt;path d=&quot;M170,175 L268,285&quot;/&gt;
    &lt;/g&gt;
    &lt;text x=&quot;180&quot; y=&quot;20&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;stage 1&lt;/text&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;270&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Machining&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$200k ÷ 10,000 MH&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;100&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Machine setups&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$100k ÷ 200 setups&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;180&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;201&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product design&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;219&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$84k ÷ 2 products&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;260&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;281&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;General factory&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;299&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$300k ÷ 12,000 DLH&lt;/text&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;var(--sage)&quot;&gt;
      &lt;text x=&quot;485&quot; y=&quot;50&quot;&gt;$20/MH&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;130&quot;&gt;$500/setup&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;210&quot;&gt;$42,000/prod.&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;290&quot;&gt;$25/DLH&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;600&quot; y=&quot;20&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;stage 2: rate × driver&lt;/text&gt;
    &lt;g stroke=&quot;var(--Y)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; opacity=&quot;.8&quot;&gt;&lt;path d=&quot;M580,45 L690,105&quot;/&gt;&lt;path d=&quot;M580,125 L690,110&quot;/&gt;&lt;path d=&quot;M580,205 L690,115&quot;/&gt;&lt;path d=&quot;M580,285 L690,120&quot;/&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--Z)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; opacity=&quot;.8&quot;&gt;&lt;path d=&quot;M580,45 L690,215&quot;/&gt;&lt;path d=&quot;M580,125 L690,220&quot;/&gt;&lt;path d=&quot;M580,205 L690,225&quot;/&gt;&lt;path d=&quot;M580,285 L690,230&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;690&quot; y=&quot;85&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--Y)&quot;/&gt;&lt;text x=&quot;765&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; class=&quot;y&quot;&gt;Product Y&lt;/text&gt;&lt;text x=&quot;765&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$407,000&lt;/text&gt;
    &lt;rect x=&quot;690&quot; y=&quot;195&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--Z)&quot;/&gt;&lt;text x=&quot;765&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;z&quot;&gt;Product Z&lt;/text&gt;&lt;text x=&quot;765&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$277,000&lt;/text&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Estimated overhead cost of the pool&lt;/span&gt;&lt;span&gt;Expected activity (total quantity of the driver)&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper card&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;3 · Machining&lt;/h3&gt;&lt;p&gt;$200,000 ÷ 10,000 machine-hours = &lt;b&gt;$20 per MH&lt;/b&gt;. Each machine-hour used by a product &quot;costs&quot; $20 of machining overhead.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;4 · Machine setups&lt;/h3&gt;&lt;p&gt;$100,000 ÷ 200 setups = &lt;b&gt;$500 per setup&lt;/b&gt;. A &lt;span class=&quot;term&quot;&gt;setup&lt;/span&gt; is the preparation of a machine before a batch is run: tool changes, adjustments, test runs.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;5 · Product design&lt;/h3&gt;&lt;p&gt;$84,000 ÷ 2 products = &lt;b&gt;$42,000 per product&lt;/b&gt;. The cost of designing a product and maintaining its technical specifications is the same whether 10 or 10,000 units are made.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;6 · General factory&lt;/h3&gt;&lt;p&gt;$300,000 ÷ 12,000 DLH = &lt;b&gt;$25 per DLH&lt;/b&gt;. The &quot;residual&quot; pool of general factory costs is still allocated on direct labor-hours, as in the traditional system.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;src&quot;&gt;Slide 6&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between an activity cost pool and an activity measure?&lt;/summary&gt;&lt;p&gt;The pool is &lt;em&gt;how much&lt;/em&gt; the activity costs (e.g., $100,000 of setups); the measure is &lt;em&gt;how the activity is counted&lt;/em&gt; (number of setups). Dividing the former by the expected quantity of the latter gives the activity rate.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If expected setups rose to 250 (cost unchanged), what would the activity rate be?&lt;/summary&gt;&lt;p&gt;$100,000 / 250 = $400 per setup.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the General factory activity rate ($25) different from the plantwide rate ($57), even though both use DLH as the base?&lt;/summary&gt;&lt;p&gt;Because the numerator is different: General factory contains only $300,000, whereas the plantwide rate loads the full $684,000 onto DLH.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 4. HIERARCHY --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;gerarchia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 4 · requirements 7–8&lt;/span&gt;&lt;h2&gt;The cost hierarchy: at what level does a cost arise?&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;ABC classifies activities according to &lt;em&gt;what&lt;/em&gt; causes their cost to vary. This is the key to the rest of the exercise: the slides use it in answers 7–8 and 12–15 without fully defining it, so here is the complete picture.&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Cost hierarchy pyramid&quot;&gt;
    &lt;polygon points=&quot;330,20 490,20 540,80 280,80&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;polygon points=&quot;280,85 540,85 590,145 230,145&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;polygon points=&quot;230,150 590,150 640,210 180,210&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
    &lt;polygon points=&quot;180,215 640,215 690,275 130,275&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;g text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;410&quot; y=&quot;48&quot;&gt;Facility-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;113&quot;&gt;Product-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;178&quot;&gt;Batch-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;243&quot;&gt;Unit-level&lt;/text&gt;&lt;/g&gt;
    &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;410&quot; y=&quot;66&quot;&gt;sustains the organization as a whole&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;131&quot;&gt;varies with the no. of products&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;196&quot;&gt;varies with the no. of batches&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;261&quot;&gt;varies with the no. of units&lt;/text&gt;&lt;/g&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;&lt;text x=&quot;555&quot; y=&quot;56&quot;&gt;e.g., rent, management&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;120&quot; font-weight=&quot;600&quot;&gt;← Product design&lt;/text&gt;
      &lt;text x=&quot;650&quot; y=&quot;185&quot; font-weight=&quot;600&quot;&gt;← Machine setups&lt;/text&gt;
      &lt;text x=&quot;700&quot; y=&quot;245&quot; font-weight=&quot;600&quot;&gt;← Machining (MH)&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;262&quot; font-weight=&quot;600&quot;&gt;← General factory (DLH)&lt;/text&gt;&lt;/g&gt;
    &lt;text x=&quot;20&quot; y=&quot;290&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;the higher the level, the less the cost depends on production volume&lt;/text&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Unit-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Batch-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Facility-level&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Unit-level activities&lt;/span&gt;: performed for each unit produced, so their cost rises in proportion to volume. Typical drivers: machine-hours, direct labor-hours, units. In the exercise, &lt;b&gt;Machining&lt;/b&gt; and &lt;b&gt;General factory&lt;/b&gt; use unit-level measures (slides 10–11).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Batch-level activities&lt;/span&gt;: performed for each &lt;span class=&quot;term&quot;&gt;batch&lt;/span&gt;. &lt;b&gt;Machine setups is batch-level&lt;/b&gt;: &quot;a setup is performed to start a batch of units; its cost depends on the resources consumed to perform it, not on the number of units processed once it is completed&quot; (slide 7). A batch of 10 or of 1,000 units requires the same setup.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Product-level activities&lt;/span&gt; (or &lt;span class=&quot;term&quot;&gt;product-sustaining&lt;/span&gt;): needed to support a product, regardless of how many batches or units are produced. &lt;b&gt;Product design is product-level&lt;/b&gt;: &quot;its cost is determined by the number of products supported, not by the number of batches or units&quot; (slide 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Facility-level&lt;/span&gt; (or &lt;span class=&quot;term&quot;&gt;organization-sustaining&lt;/span&gt;): sustain the plant&#x27;s general capacity and are not linked to any specific product (rent, security, plant management). Many textbooks recommend not allocating them to products at all. &lt;span class=&quot;note&quot;&gt;This level does not appear in the slides: we add it for completeness. In the exercise, General factory is nonetheless allocated on DLH, i.e., treated with a unit-level base.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;If Hickory doubled production of Y while keeping the same number of batches, which costs would increase (in theory)?&lt;/summary&gt;&lt;p&gt;Only unit-level costs (Machining, and General factory insofar as it is tied to DLH). Setups and Product design would remain unchanged.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quality inspection of the first unit in each batch: which level does it belong to?&lt;/summary&gt;&lt;p&gt;Batch-level: it is repeated for each batch, not for each unit.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is it wrong to allocate batch-level costs using a unit-level base such as DLH?&lt;/summary&gt;&lt;p&gt;Because volume is not what causes those costs: the high-volume product with few batches would be charged for setups that are actually caused by the low-volume product with many batches.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 5. ASSIGNMENT --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;assegnazione&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 5 · requirements 9–10&lt;/span&gt;&lt;h2&gt;ABC assignment to Y and Z&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;formula&quot;&gt;Overhead assigned to the product = Σ&lt;sub&gt;pool&lt;/sub&gt; (activity rate × the product&#x27;s expected activity)&lt;/div&gt;
  &lt;p&gt;Step through: the chart builds up pool by pool.&lt;/p&gt;
  &lt;div class=&quot;stepper card&quot; id=&quot;assStepper&quot;&gt;
    &lt;svg id=&quot;assChart&quot; viewBox=&quot;0 0 700 150&quot; role=&quot;img&quot; aria-label=&quot;Overhead build-up by product&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Machining · $20 per MH&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 7,000 × 20 = $140,000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 3,000 × 20 = $60,000&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Machine setups · $500 per setup&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 50 × 500 = $25,000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 150 × 500 = $75,000&lt;/span&gt; — here Z pays three times as much as Y.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Product design · $42,000 per product&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 1 × 42,000 = $42,000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 1 × 42,000 = $42,000&lt;/span&gt; — the same amount, regardless of volume.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;General factory · $25 per DLH&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 8,000 × 25 = $200,000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 4,000 × 25 = $100,000&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Total&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: $407,000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: $277,000&lt;/span&gt; · sum $684,000: ABC redistributes the same overhead; it neither creates nor removes any.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;src&quot;&gt;Slide 8&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var Y=[140000,25000,42000,200000],Z=[60000,75000,42000,100000],col=[&#x27;var(--sage)&#x27;,&#x27;var(--brick)&#x27;,&#x27;var(--ochre)&#x27;,&#x27;var(--slate)&#x27;],nm=[&#x27;Machining&#x27;,&#x27;Setups&#x27;,&#x27;Design&#x27;,&#x27;General&#x27;];
    var svg=document.getElementById(&#x27;assChart&#x27;),sc=480/460000;
    function draw(k){
      var n=Math.min(k+1,4),h=&#x27;&#x27;;
      [[&#x27;Product Y&#x27;,Y,30,&#x27;var(--Y)&#x27;],[&#x27;Product Z&#x27;,Z,85,&#x27;var(--Z)&#x27;]].forEach(function(r){
        var x=110,t=0;h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(r[2]+22)+&#x27;&quot; font-weight=&quot;600&quot; fill=&quot;&#x27;+r[3]+&#x27;&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;
        for(var i=0;i&lt;n;i++){var w=r[1][i]*sc;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+r[2]+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;34&quot; fill=&quot;&#x27;+col[i]+&#x27;&quot; opacity=&quot;.8&quot;&gt;&lt;title&gt;&#x27;+nm[i]+&#x27;: $&#x27;+r[1][i].toLocaleString(&#x27;en-US&#x27;)+&#x27;&lt;/title&gt;&lt;/rect&gt;&#x27;;x+=w;t+=r[1][i];}
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+8)+&#x27;&quot; y=&quot;&#x27;+(r[2]+22)+&#x27;&quot; font-weight=&quot;600&quot;&gt;$&#x27;+t.toLocaleString(&#x27;en-US&#x27;)+&#x27;&lt;/text&gt;&#x27;;
      });
      h+=&#x27;&lt;line x1=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y1=&quot;22&quot; x2=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y2=&quot;70&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y=&quot;16&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;plantwide Y $456k&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y1=&quot;78&quot; x2=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y2=&quot;125&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y=&quot;140&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;plantwide Z $228k&lt;/text&gt;&#x27;;
      svg.innerHTML=h;
    }
    document.getElementById(&#x27;assStepper&#x27;).addEventListener(&#x27;step&#x27;,function(e){draw(e.detail);});
  })();
  &lt;/script&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h3&gt;And per unit? &lt;span class=&quot;tag ext&quot; style=&quot;vertical-align:middle&quot;&gt;our calculation, not in the slides&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Overhead per unit&lt;/th&gt;&lt;th&gt;Plantwide&lt;/th&gt;&lt;th&gt;ABC&lt;/th&gt;&lt;th&gt;Difference&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;y&quot;&gt;Product Y (14,000 units)&lt;/td&gt;&lt;td&gt;$32.57&lt;/td&gt;&lt;td&gt;$29.07&lt;/td&gt;&lt;td&gt;−$3.50 → was &lt;b&gt;overcosted&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;z&quot;&gt;Product Z (6,000 units)&lt;/td&gt;&lt;td&gt;$38.00&lt;/td&gt;&lt;td&gt;$46.17&lt;/td&gt;&lt;td&gt;+$8.17 → was &lt;b&gt;undercosted&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;This is the typical ABC conclusion: a volume-based system makes high-volume products bear part of the complexity of low-volume products. Pricing and product-mix decisions based on the plantwide rate risk promoting precisely Z, which appears more profitable than it really is.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Which pool shifts the most cost from Y to Z compared with the plantwide rate?&lt;/summary&gt;&lt;p&gt;Machine setups: under the plantwide rate Y would &quot;pay&quot; 66.7% of it (about $66,700); under ABC only $25,000. Product design also shifts cost: from ~$56,000 to $42,000 for Y.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the ABC total (Y+Z) still $684,000?&lt;/summary&gt;&lt;p&gt;Because each pool is distributed in full: the expected driver quantities of Y and Z add up exactly to the expected activity used to compute the rates.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 6. COMPARISON --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 6 · requirements 11–15&lt;/span&gt;&lt;h2&gt;Comparing the percentages: where the distortion arises&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;The plantwide rate assigns Y &lt;b&gt;66.7%&lt;/b&gt; of &lt;em&gt;every&lt;/em&gt; dollar of overhead. ABC, by contrast, splits each pool according to actual consumption. The dashed line marks 66.7%: the pools that deviate from it are the ones the traditional system measures poorly.&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Share of Y and Z by pool, compared with the plantwide rate&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;35&quot; font-weight=&quot;600&quot;&gt;Plantwide (all)&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;15&quot; width=&quot;400&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;600&quot; y=&quot;15&quot; width=&quot;200&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;79&quot;&gt;ABC · Machining&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;59&quot; width=&quot;420&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;620&quot; y=&quot;59&quot; width=&quot;180&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;123&quot;&gt;ABC · Machine setups&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;103&quot; width=&quot;150&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;103&quot; width=&quot;450&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;167&quot;&gt;ABC · Product design&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;147&quot; width=&quot;300&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;500&quot; y=&quot;147&quot; width=&quot;300&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;211&quot;&gt;ABC · General factory&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;191&quot; width=&quot;400&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;600&quot; y=&quot;191&quot; width=&quot;200&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;259&quot; font-weight=&quot;600&quot;&gt;ABC · Total&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;239&quot; width=&quot;357&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;557&quot; y=&quot;239&quot; width=&quot;243&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;white&quot; style=&quot;fill:var(--paper)&quot;&gt;
      &lt;text x=&quot;210&quot; y=&quot;34&quot;&gt;Y 66.7%&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;34&quot;&gt;Z 33.3%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;78&quot;&gt;Y 70%&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;78&quot;&gt;Z 30%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;122&quot;&gt;Y 25%&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;122&quot;&gt;Z 75%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;166&quot;&gt;Y 50%&lt;/text&gt;&lt;text x=&quot;510&quot; y=&quot;166&quot;&gt;Z 50%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;210&quot;&gt;Y 66.7%&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;210&quot;&gt;Z 33.3%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;258&quot;&gt;Y 59.5%&lt;/text&gt;&lt;text x=&quot;567&quot; y=&quot;258&quot;&gt;Z 40.5%&lt;/text&gt;
    &lt;/g&gt;
    &lt;line x1=&quot;600&quot; y1=&quot;6&quot; x2=&quot;600&quot; y2=&quot;276&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
    &lt;text x=&quot;600&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;66.7% (Y&#x27;s share of DLH)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 9 (the slides round the total to 59% / 41%).&lt;/p&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;12 · Machining&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;13 · Setups&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;14 · Design&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;15 · General factory&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;70% / 30% — similar to 66.7 / 33.3.&lt;/b&gt; Machining uses a &lt;span class=&quot;term&quot;&gt;unit-level&lt;/span&gt; measure (machine-hours), as does the plantwide DLH base. Two volume-based measures tend to produce comparable splits. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;25% / 75% — the opposite of 67 / 33.&lt;/b&gt; Machine setups is a &lt;span class=&quot;term&quot;&gt;batch-level&lt;/span&gt; pool. Y is the high-volume product (14,000 units) and Z the low-volume one (6,000 units), yet Y consumes only 25% of the setups. The conventional system assigns &lt;em&gt;too much&lt;/em&gt; setup cost to Y and &lt;em&gt;too little&lt;/em&gt; to Z. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;50% / 50% — different from 67 / 33.&lt;/b&gt; Product design is &lt;span class=&quot;term&quot;&gt;product-level&lt;/span&gt;: each product consumes half of the design resources, regardless of volume. Here too the conventional system overcharges Y and undercharges Z. &lt;span class=&quot;src&quot;&gt;Slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;66.7% / 33.3% — identical.&lt;/b&gt; General factory is allocated using the &lt;em&gt;same&lt;/em&gt; unit-level measure (DLH) as the plantwide rate, so the percentages coincide by construction. &lt;span class=&quot;src&quot;&gt;Slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;The lesson in one sentence.&lt;/b&gt; The distortions of the plantwide rate stem from &lt;em&gt;non&lt;/em&gt;-unit-level costs (batch- and product-level): the larger their share of overhead, and the more products differ in volume and complexity, the more inaccurate traditional costing becomes.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Which two pools, on their own, explain why Y&#x27;s ABC total (59.5%) is below 66.7%?&lt;/summary&gt;&lt;p&gt;Machine setups (25%) and Product design (50%). Machining (70%) actually pushes slightly above, while General factory is neutral.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If Y and Z used setups in the same proportion as their DLH (8:4), would ABC give different results from the plantwide rate?&lt;/summary&gt;&lt;p&gt;Only slightly: the deviations for Machining (70 vs 66.7) and Product design (50 vs 66.7) would remain. Try it in the lab below.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;True or false: ABC always increases the cost of low-volume products.&lt;/summary&gt;&lt;p&gt;False in general: it increases it when those products consume a disproportionate share of batch- or product-level activities, as Z does here. It depends on actual consumption.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 7. LAB --&gt;
&lt;section class=&quot;part&quot; id=&quot;lab&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Part 7&lt;/span&gt;&lt;h2&gt;Lab: move the drivers&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Pool costs are fixed as in the exercise ($200k, $100k, $84k, $300k); change the activity consumption and watch the plantwide and ABC results diverge. At the initial values you get the solution from the slides.&lt;/p&gt;
  &lt;div class=&quot;card lab grid2&quot;&gt;
    &lt;div&gt;
      &lt;label&gt;Setups for Y: &lt;output id=&quot;oSY&quot;&gt;50&lt;/output&gt;&lt;input id=&quot;sY&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Setups for Z: &lt;output id=&quot;oSZ&quot;&gt;150&lt;/output&gt;&lt;input id=&quot;sZ&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;150&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Machine-hours for Y (out of 10,000): &lt;output id=&quot;oMH&quot;&gt;7,000&lt;/output&gt;&lt;input id=&quot;mh&quot; type=&quot;range&quot; min=&quot;1000&quot; max=&quot;9000&quot; step=&quot;500&quot; value=&quot;7000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Direct labor-hours for Y (out of 12,000): &lt;output id=&quot;oDL&quot;&gt;8,000&lt;/output&gt;&lt;input id=&quot;dl&quot; type=&quot;range&quot; min=&quot;1000&quot; max=&quot;11000&quot; step=&quot;500&quot; value=&quot;8000&quot;&gt;&lt;/label&gt;
      &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;reset&quot;&gt;reset to the exercise data&lt;/button&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;svg id=&quot;labChart&quot; viewBox=&quot;0 0 360 230&quot; role=&quot;img&quot; aria-label=&quot;Plantwide vs ABC comparison&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;labTbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout&quot; id=&quot;labMsg&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){
    var $=function(i){return document.getElementById(i)},f=function(n){return Math.round(n).toLocaleString(&#x27;en-US&#x27;)};
    function upd(){
      var sY=+$(&#x27;sY&#x27;).value,sZ=+$(&#x27;sZ&#x27;).value,mh=+$(&#x27;mh&#x27;).value,dl=+$(&#x27;dl&#x27;).value;
      $(&#x27;oSY&#x27;).textContent=sY;$(&#x27;oSZ&#x27;).textContent=sZ;$(&#x27;oMH&#x27;).textContent=f(mh);$(&#x27;oDL&#x27;).textContent=f(dl);
      var aY=200000*mh/10000+100000*sY/(sY+sZ)+42000+300000*dl/12000,aZ=684000-aY,pY=684000*dl/12000,pZ=684000-pY;
      var sc=250/684000,h=&#x27;&#x27;;
      [[&#x27;Plantwide&#x27;,pY,pZ,20],[&#x27;ABC&#x27;,aY,aZ,110]].forEach(function(r){
        h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(r[3]+12)+&#x27;&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(r[3]+20)+&#x27;&quot; width=&quot;&#x27;+r[1]*sc+&#x27;&quot; height=&quot;26&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(r[1]*sc+6)+&#x27;&quot; y=&quot;&#x27;+(r[3]+38)+&#x27;&quot; font-size=&quot;12&quot;&gt;Y $&#x27;+f(r[1])+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(r[3]+50)+&#x27;&quot; width=&quot;&#x27;+r[2]*sc+&#x27;&quot; height=&quot;26&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(r[2]*sc+6)+&#x27;&quot; y=&quot;&#x27;+(r[3]+68)+&#x27;&quot; font-size=&quot;12&quot;&gt;Z $&#x27;+f(r[2])+&#x27;&lt;/text&gt;&#x27;;
      });
      $(&#x27;labChart&#x27;).innerHTML=h;
      $(&#x27;labTbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;per unit&lt;/th&gt;&lt;th&gt;Plantwide&lt;/th&gt;&lt;th&gt;ABC&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;y&quot;&gt;Y (14,000 units)&lt;/td&gt;&lt;td&gt;$&#x27;+(pY/14000).toFixed(2)+&#x27;&lt;/td&gt;&lt;td&gt;$&#x27;+(aY/14000).toFixed(2)+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;z&quot;&gt;Z (6,000 units)&lt;/td&gt;&lt;td&gt;$&#x27;+(pZ/6000).toFixed(2)+&#x27;&lt;/td&gt;&lt;td&gt;$&#x27;+(aZ/6000).toFixed(2)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      var d=(aZ-pZ)/aZ*100;
      $(&#x27;labMsg&#x27;).innerHTML=Math.abs(d)&lt;2?&#x27;&lt;b&gt;Almost no distortion&lt;/b&gt;: Z\&#x27;s activity consumption is in line with its share of DLH, and the single rate works.&#x27;:(d&gt;0?&#x27;The plantwide rate &lt;b&gt;understates&lt;/b&gt; Z\&#x27;s cost by &#x27;+d.toFixed(1)+&#x27;% relative to ABC: Y is subsidizing Z.&#x27;:&#x27;The plantwide rate &lt;b&gt;overstates&lt;/b&gt; Z\&#x27;s cost by &#x27;+(-d).toFixed(1)+&#x27;% relative to ABC: now Z is subsidizing Y.&#x27;);
    }
    [&#x27;sY&#x27;,&#x27;sZ&#x27;,&#x27;mh&#x27;,&#x27;dl&#x27;].forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,upd);});
    $(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,function(){$(&#x27;sY&#x27;).value=50;$(&#x27;sZ&#x27;).value=150;$(&#x27;mh&#x27;).value=7000;$(&#x27;dl&#x27;).value=8000;upd();});
    upd();
  })();
  &lt;/script&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Set Y setups = 100 and Z setups = 50. What happens, and why?&lt;/summary&gt;&lt;p&gt;The understatement of Z&#x27;s cost falls from about 17.7% to about 3%: Y now causes 2/3 of the setups, just as it accounts for 2/3 of the DLH, so that pool no longer creates distortion. What remains is Product design (50/50, which charges Z more than the plantwide rate does) and, in the opposite direction, Machining (70/30).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is there a combination in which ABC and the plantwide rate coincide exactly?&lt;/summary&gt;&lt;p&gt;Yes, when for every pool Y&#x27;s share of the driver equals its share of DLH. With Product design fixed at 50/50, the other drivers must compensate (e.g., a few more setups or MH for Y).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- FURTHER READING --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Beyond the slides&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;The slides for this exercise &lt;b&gt;do not cite&lt;/b&gt; any authors, textbooks, standards or websites. The references below are therefore an &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;: we selected them to frame the exercise and verified them through a web search.&lt;/p&gt;
  &lt;ul class=&quot;biblio&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;b&gt;Noreen, Brewer, Garrison — &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt; (McGraw Hill)&lt;/b&gt; and textbooks in the same family (Garrison/Noreen/Brewer, &lt;i&gt;Managerial Accounting&lt;/i&gt;). The structure and terminology of the exercise (plantwide rate, activity cost pools, cost hierarchy) follow these textbooks, which devote a chapter to ABC (the chapter number varies by edition). The slides do not state the source of the exercise. Useful for further exercises of the same type. &lt;a href=&quot;https://www.mheducation.com.au/managerial-accounting-for-managers-ise-9781265617660-aus&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher&#x27;s page&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;b&gt;Robin Cooper, Robert S. Kaplan — &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, September 1988.&lt;/b&gt; One of the founding articles of ABC: it argues that volume-based systems distort product costs and therefore pricing and product-mix decisions — exactly the phenomenon observed with Y and Z. &lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article page (Ivey Publishing)&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;b&gt;Robert S. Kaplan, Robin Cooper — &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt;, Harvard Business School Press, 1997.&lt;/b&gt; The book that systematizes ABC and its use for budgeting and for product and customer profitability. It matters because it takes ABC from cost measurement to decision-making. &lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book page&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;b&gt;Robert S. Kaplan, Steven R. Anderson — &quot;Time-Driven Activity-Based Costing&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, November 2004&lt;/b&gt; (later a book, 2007). It responds to the criticisms of conventional ABC (costly and slow to build and update) by using only two estimates: the time required by each activity and the cost per unit of capacity. It is the natural evolution of what is covered here. &lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on HBS Working Knowledge&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;note&quot;&gt;Link to the rest of the course: the file path (&lt;code&gt;corso/Activity-Based Costing/7.SMA ABC ex 1 solutions/&lt;/code&gt;) indicates that this is Exercise 1, with solutions, of the Activity-Based Costing module of the Strategic Management Accounting course. The theoretical questions to review (why ABC emerged, how cost drivers are chosen) are those developed here in Parts 3–4.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

(function(){
  // tabs
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var tabs=t.querySelectorAll(&#x27;[role=tab]&#x27;),panels=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    tabs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),k=0;
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;));});
    function show(){steps.forEach(function(x,i){x.classList.toggle(&#x27;on&#x27;,i===k);dots.children[i].classList.toggle(&#x27;on&#x27;,i&lt;=k);});
      prev.disabled=k===0;next.disabled=k===steps.length-1;s.dispatchEvent(new CustomEvent(&#x27;step&#x27;,{detail:k}));}
    prev.addEventListener(&#x27;click&#x27;,function(){if(k&gt;0){k--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(k&lt;steps.length-1){k++;show();}});
    show();
  });
  if(window.initPage)window.initPage();
})();
&lt;/script&gt;
