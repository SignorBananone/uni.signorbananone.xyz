&lt;!-- 1. IL CASO --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;caso&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 1&lt;/span&gt;&lt;h2&gt;Il caso: Hickory Company&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Hickory Company produce due prodotti: &lt;b class=&quot;y&quot;&gt;14.000 unità di Product Y&lt;/b&gt; (alto volume) e &lt;b class=&quot;z&quot;&gt;6.000 unità di Product Z&lt;/b&gt; (basso volume). Oggi usa un &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; (tasso unico di stabilimento per i costi indiretti) basato sulle &lt;span class=&quot;term&quot;&gt;direct labor-hours&lt;/span&gt; (DLH, ore di manodopera diretta). Sta valutando di passare a un sistema di &lt;span class=&quot;term&quot;&gt;activity-based costing&lt;/span&gt; (ABC) che attribuisce tutti i &lt;b&gt;$684.000&lt;/b&gt; di &lt;span class=&quot;term&quot;&gt;manufacturing overhead&lt;/span&gt; a quattro &lt;span class=&quot;term&quot;&gt;activity cost pools&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Manufacturing overhead&lt;/b&gt;&lt;br&gt;Tutti i costi di produzione che &lt;em&gt;non&lt;/em&gt; sono materiali diretti né manodopera diretta: ammortamento macchine, energia, attrezzaggi, progettazione, supervisione, affitto dello stabilimento… Non si possono ricondurre &quot;a vista&quot; a un singolo prodotto, quindi vanno &lt;em&gt;allocati&lt;/em&gt; con una regola.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity cost pool&lt;/b&gt;&lt;br&gt;Un &quot;contenitore&quot; in cui si raccolgono i costi di una singola attività (es. tutti i costi degli attrezzaggi). Ogni pool ha la sua &lt;span class=&quot;term&quot;&gt;activity measure&lt;/span&gt; (o &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;): l&#x27;unità con cui si misura quanto ogni prodotto usa quell&#x27;attività.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Activity cost pools&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Consumi per prodotto&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Le 15 domande&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;Estimated overhead cost&lt;/th&gt;&lt;th&gt;Expected activity&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;Machine-hours&lt;/td&gt;&lt;td&gt;$200.000&lt;/td&gt;&lt;td&gt;10.000 MH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;Number of setups&lt;/td&gt;&lt;td&gt;$100.000&lt;/td&gt;&lt;td&gt;200 setups&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product design&lt;/td&gt;&lt;td&gt;Number of products&lt;/td&gt;&lt;td&gt;$84.000&lt;/td&gt;&lt;td&gt;2 products&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;General factory&lt;/td&gt;&lt;td&gt;Direct labor-hours&lt;/td&gt;&lt;td&gt;$300.000&lt;/td&gt;&lt;td&gt;12.000 DLH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$684.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Slide 2&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th class=&quot;y&quot;&gt;Product Y&lt;/th&gt;&lt;th class=&quot;z&quot;&gt;Product Z&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine-hours&lt;/td&gt;&lt;td&gt;7.000&lt;/td&gt;&lt;td&gt;3.000&lt;/td&gt;&lt;td&gt;10.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Number of setups&lt;/td&gt;&lt;td&gt;50&lt;/td&gt;&lt;td&gt;150&lt;/td&gt;&lt;td&gt;200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Number of products&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor-hours&lt;/td&gt;&lt;td&gt;8.000&lt;/td&gt;&lt;td&gt;4.000&lt;/td&gt;&lt;td&gt;12.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Unità prodotte&lt;/i&gt;&lt;/td&gt;&lt;td&gt;14.000&lt;/td&gt;&lt;td&gt;6.000&lt;/td&gt;&lt;td&gt;20.000&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Già qui si vede il &quot;trucco&quot; dell&#x27;esercizio: Y ha 2/3 delle ore di manodopera ma solo 1/4 degli attrezzaggi. Z è piccolo in volume ma &quot;complicato&quot;: molti lotti brevi.&lt;/p&gt;
      &lt;p class=&quot;src&quot;&gt;Slide 2&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;ul style=&quot;list-style:none;padding:0;margin:0&quot;&gt;
        &lt;li&gt;&lt;b&gt;1.&lt;/b&gt; Plantwide overhead rate.&lt;/li&gt;&lt;li&gt;&lt;b&gt;2.&lt;/b&gt; Overhead allocato a Y e Z con il plantwide rate.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;3–6.&lt;/b&gt; Activity rate di Machining, Machine setups, Product design, General factory.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;7.&lt;/b&gt; Quale attività è &lt;span class=&quot;term&quot;&gt;batch-level&lt;/span&gt;? Perché?&lt;/li&gt;&lt;li&gt;&lt;b&gt;8.&lt;/b&gt; Quale attività è &lt;span class=&quot;term&quot;&gt;product-level&lt;/span&gt;? Perché?&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;9–10.&lt;/b&gt; Overhead totale a Y e a Z con l&#x27;ABC.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;11.&lt;/b&gt; % dell&#x27;overhead a Y e Z con il plantwide rate.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;12–15.&lt;/b&gt; % di ciascun pool (Machining, Setups, Design, General factory) a Y e Z con l&#x27;ABC: sono simili a quelle del punto 11? Perché?&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;src&quot;&gt;Slide 3–4. Nota a margine della slide 3: il plantwide rate &quot;si riferisce all&#x27;allocazione di tutti i costi di overhead usando le ore di manodopera diretta&quot;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;overhead va &quot;allocato&quot; e non semplicemente &quot;attribuito&quot; come i materiali?&lt;/summary&gt;&lt;p&gt;Perché è un costo indiretto: serve a più prodotti insieme e non esiste una misura diretta di quanto ne usi ciascuno. Bisogna scegliere una base (o più basi) che approssimi il consumo.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Guardando solo la tabella dei consumi, quale prodotto sospetti che sia sottocostato dal sistema attuale?&lt;/summary&gt;&lt;p&gt;Product Z: usa il 75% degli setups ma solo il 33% delle DLH. Un sistema basato sulle DLH gli attribuirà meno costi di setup di quelli che genera.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 2. PLANTWIDE --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;plantwide&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 2 · requisiti 1–2&lt;/span&gt;&lt;h2&gt;Il plantwide overhead rate&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Il sistema &quot;tradizionale&quot;: un unico &lt;span class=&quot;term&quot;&gt;cost pool&lt;/span&gt; per tutto lo stabilimento e un&#x27;unica &lt;span class=&quot;term&quot;&gt;allocation base&lt;/span&gt;. Si calcola un tasso &lt;em&gt;predeterminato&lt;/em&gt; (con dati stimati a inizio periodo) e lo si applica a ogni prodotto in proporzione alle ore di manodopera che consuma.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Plantwide overhead rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total estimated overhead cost&lt;/span&gt;&lt;span&gt;Total expected direct labor-hours&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;$684.000&lt;/span&gt;&lt;span&gt;12.000 DLH&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;$57 per DLH&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Overhead allocato = DLH del prodotto × $57&lt;br&gt;
    &lt;span class=&quot;y&quot;&gt;Y: 8.000 × 57 = $456.000&lt;/span&gt; &amp;nbsp;·&amp;nbsp; &lt;span class=&quot;z&quot;&gt;Z: 4.000 × 57 = $228.000&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 5&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 760 200&quot; role=&quot;img&quot; aria-label=&quot;Schema del plantwide rate: un unico pool, una sola base&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;110&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Overhead totale&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$684.000&lt;/text&gt;
    &lt;path d=&quot;M200,100 L290,100&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;circle cx=&quot;350&quot; cy=&quot;100&quot; r=&quot;56&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;350&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;$57&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;per DLH&lt;/text&gt;
    &lt;path d=&quot;M406,90 C470,60 500,50 540,48&quot; stroke=&quot;var(--Y)&quot; stroke-width=&quot;10&quot; fill=&quot;none&quot; opacity=&quot;.75&quot;/&gt;
    &lt;path d=&quot;M406,110 C470,140 500,150 540,152&quot; stroke=&quot;var(--Z)&quot; stroke-width=&quot;5&quot; fill=&quot;none&quot; opacity=&quot;.75&quot;/&gt;
    &lt;rect x=&quot;545&quot; y=&quot;22&quot; width=&quot;190&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--Y)&quot;/&gt;
    &lt;text x=&quot;640&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;y&quot;&gt;Product Y · 8.000 DLH&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$456.000 (66,7%)&lt;/text&gt;
    &lt;rect x=&quot;545&quot; y=&quot;126&quot; width=&quot;190&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--Z)&quot;/&gt;
    &lt;text x=&quot;640&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;z&quot;&gt;Product Z · 4.000 DLH&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;167&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;$228.000 (33,3%)&lt;/text&gt;
  &lt;/svg&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Cosa dà per scontato la slide: pregi e limiti del tasso unico&lt;/summary&gt;
    &lt;p&gt;&lt;b&gt;Pregi:&lt;/b&gt; semplicissimo, poco costoso da gestire, ragionevole quando i prodotti sono simili e l&#x27;overhead dipende davvero dai volumi.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Limite:&lt;/b&gt; la base DLH è una misura &lt;span class=&quot;term&quot;&gt;unit-level&lt;/span&gt; (cresce con le unità prodotte). Assume quindi che &lt;em&gt;tutto&lt;/em&gt; l&#x27;overhead cresca con il volume. Ma attrezzaggi e progettazione non dipendono da quante unità fai: dipendono da quanti lotti e quanti prodotti gestisci. Risultato: il prodotto ad alto volume paga anche per la complessità dei prodotti piccoli → &lt;span class=&quot;term&quot;&gt;cost distortion&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt; (un prodotto &quot;sovvenziona&quot; l&#x27;altro).&lt;/p&gt;
  &lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Se le DLH attese fossero 15.000 invece di 12.000 (overhead invariato), quale sarebbe il plantwide rate?&lt;/summary&gt;&lt;p&gt;$684.000 / 15.000 = $45,60 per DLH.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con il plantwide rate, quanto overhead per unità ricevono Y e Z?&lt;/summary&gt;&lt;p&gt;Y: $456.000 / 14.000 ≈ $32,57 per unità; Z: $228.000 / 6.000 = $38,00 per unità. &lt;span class=&quot;note&quot;&gt;(calcolo nostro, non nelle slide)&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le percentuali 66,7% / 33,3% da cosa dipendono, esattamente?&lt;/summary&gt;&lt;p&gt;Solo dal rapporto delle DLH: 8.000/12.000 e 4.000/12.000. Il tasso $57 si semplifica: con un&#x27;unica base, la ripartizione percentuale coincide con le quote della base.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 3. ABC --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;abc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 3 · requisiti 3–6&lt;/span&gt;&lt;h2&gt;Activity-based costing: pools e activity rates&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;L&#x27;ABC rompe l&#x27;overhead in più pool, uno per attività, e attribuisce ciascuno con il suo &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;. È un processo in &lt;b&gt;due stadi&lt;/b&gt;: (1) le risorse si caricano sulle attività; (2) le attività si caricano sui prodotti in base a quanto ciascuno le consuma.&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 860 330&quot; role=&quot;img&quot; aria-label=&quot;Schema a due stadi dell&#x27;ABC&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;135&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;95&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Risorse&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;overhead $684k&lt;/text&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;
      &lt;path d=&quot;M170,155 L268,45&quot;/&gt;&lt;path d=&quot;M170,160 L268,125&quot;/&gt;&lt;path d=&quot;M170,170 L268,205&quot;/&gt;&lt;path d=&quot;M170,175 L268,285&quot;/&gt;
    &lt;/g&gt;
    &lt;text x=&quot;180&quot; y=&quot;20&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;stadio 1&lt;/text&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;270&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Machining&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$200k ÷ 10.000 MH&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;100&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Machine setups&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$100k ÷ 200 setups&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;180&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;201&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product design&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;219&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$84k ÷ 2 products&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;260&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;281&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;General factory&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;299&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$300k ÷ 12.000 DLH&lt;/text&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;var(--sage)&quot;&gt;
      &lt;text x=&quot;485&quot; y=&quot;50&quot;&gt;$20/MH&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;130&quot;&gt;$500/setup&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;210&quot;&gt;$42.000/prod.&lt;/text&gt;&lt;text x=&quot;485&quot; y=&quot;290&quot;&gt;$25/DLH&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;600&quot; y=&quot;20&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;stadio 2: rate × driver&lt;/text&gt;
    &lt;g stroke=&quot;var(--Y)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; opacity=&quot;.8&quot;&gt;&lt;path d=&quot;M580,45 L690,105&quot;/&gt;&lt;path d=&quot;M580,125 L690,110&quot;/&gt;&lt;path d=&quot;M580,205 L690,115&quot;/&gt;&lt;path d=&quot;M580,285 L690,120&quot;/&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--Z)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; opacity=&quot;.8&quot;&gt;&lt;path d=&quot;M580,45 L690,215&quot;/&gt;&lt;path d=&quot;M580,125 L690,220&quot;/&gt;&lt;path d=&quot;M580,205 L690,225&quot;/&gt;&lt;path d=&quot;M580,285 L690,230&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;690&quot; y=&quot;85&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--Y)&quot;/&gt;&lt;text x=&quot;765&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; class=&quot;y&quot;&gt;Product Y&lt;/text&gt;&lt;text x=&quot;765&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$407.000&lt;/text&gt;
    &lt;rect x=&quot;690&quot; y=&quot;195&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--Z)&quot;/&gt;&lt;text x=&quot;765&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;z&quot;&gt;Product Z&lt;/text&gt;&lt;text x=&quot;765&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;$277.000&lt;/text&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Estimated overhead cost del pool&lt;/span&gt;&lt;span&gt;Expected activity (quantità totale del driver)&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper card&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;3 · Machining&lt;/h3&gt;&lt;p&gt;$200.000 ÷ 10.000 machine-hours = &lt;b&gt;$20 per MH&lt;/b&gt;. Ogni ora-macchina usata da un prodotto &quot;costa&quot; $20 di overhead di lavorazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;4 · Machine setups&lt;/h3&gt;&lt;p&gt;$100.000 ÷ 200 setups = &lt;b&gt;$500 per setup&lt;/b&gt;. Un &lt;span class=&quot;term&quot;&gt;setup&lt;/span&gt; (attrezzaggio) è la preparazione della macchina prima di un lotto: cambio utensili, regolazioni, prove.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;5 · Product design&lt;/h3&gt;&lt;p&gt;$84.000 ÷ 2 products = &lt;b&gt;$42.000 per product&lt;/b&gt;. Il costo di progettare e mantenere il disegno tecnico di un prodotto è lo stesso, che se ne facciano 10 o 10.000 unità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;6 · General factory&lt;/h3&gt;&lt;p&gt;$300.000 ÷ 12.000 DLH = &lt;b&gt;$25 per DLH&lt;/b&gt;. Il pool &quot;residuo&quot; di costi generali di stabilimento resta allocato sulle ore di manodopera, come nel sistema tradizionale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;src&quot;&gt;Slide 6&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra activity cost pool e activity measure?&lt;/summary&gt;&lt;p&gt;Il pool è &lt;em&gt;quanto&lt;/em&gt; costa l&#x27;attività (es. $100.000 di setups); la measure è &lt;em&gt;come si conta&lt;/em&gt; l&#x27;attività (numero di setups). Dividendo il primo per la quantità attesa della seconda si ottiene l&#x27;activity rate.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se gli setups attesi salissero a 250 (costo invariato), quanto varrebbe l&#x27;activity rate?&lt;/summary&gt;&lt;p&gt;$100.000 / 250 = $400 per setup.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;activity rate di General factory ($25) è diverso dal plantwide rate ($57), pur usando la stessa base DLH?&lt;/summary&gt;&lt;p&gt;Perché il numeratore è diverso: General factory contiene solo $300.000, mentre il plantwide rate carica sulle DLH tutti i $684.000.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 4. GERARCHIA --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;gerarchia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 4 · requisiti 7–8&lt;/span&gt;&lt;h2&gt;La cost hierarchy: a che livello nasce un costo?&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;L&#x27;ABC classifica le attività secondo &lt;em&gt;che cosa&lt;/em&gt; ne fa variare il costo. È la chiave per capire tutto il resto dell&#x27;esercizio: le slide la usano nelle risposte 7–8 e 12–15 senza definirla per intero, quindi eccola completa.&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Piramide della cost hierarchy&quot;&gt;
    &lt;polygon points=&quot;330,20 490,20 540,80 280,80&quot; fill=&quot;var(--paper2)&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;polygon points=&quot;280,85 540,85 590,145 230,145&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;polygon points=&quot;230,150 590,150 640,210 180,210&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
    &lt;polygon points=&quot;180,215 640,215 690,275 130,275&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;g text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;410&quot; y=&quot;48&quot;&gt;Facility-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;113&quot;&gt;Product-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;178&quot;&gt;Batch-level&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;243&quot;&gt;Unit-level&lt;/text&gt;&lt;/g&gt;
    &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;410&quot; y=&quot;66&quot;&gt;sostiene l&#x27;azienda nel complesso&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;131&quot;&gt;varia con il n° di prodotti&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;196&quot;&gt;varia con il n° di lotti&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;261&quot;&gt;varia con il n° di unità&lt;/text&gt;&lt;/g&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;&lt;text x=&quot;555&quot; y=&quot;56&quot;&gt;es. affitto, direzione&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;120&quot; font-weight=&quot;600&quot;&gt;← Product design&lt;/text&gt;
      &lt;text x=&quot;650&quot; y=&quot;185&quot; font-weight=&quot;600&quot;&gt;← Machine setups&lt;/text&gt;
      &lt;text x=&quot;700&quot; y=&quot;245&quot; font-weight=&quot;600&quot;&gt;← Machining (MH)&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;262&quot; font-weight=&quot;600&quot;&gt;← General factory (DLH)&lt;/text&gt;&lt;/g&gt;
    &lt;text x=&quot;20&quot; y=&quot;290&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; font-style=&quot;italic&quot;&gt;più si sale, meno il costo dipende dal volume prodotto&lt;/text&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Unit-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Batch-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Product-level&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Facility-level&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Unit-level activities&lt;/span&gt;: si svolgono per ogni unità prodotta, quindi il costo cresce proporzionalmente al volume. Driver tipici: machine-hours, direct labor-hours, unità. Nell&#x27;esercizio: &lt;b&gt;Machining&lt;/b&gt; e &lt;b&gt;General factory&lt;/b&gt; usano measure unit-level (slide 10–11).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Batch-level activities&lt;/span&gt;: si svolgono per ogni lotto (&lt;span class=&quot;term&quot;&gt;batch&lt;/span&gt;). &lt;b&gt;Machine setups è batch-level&lt;/b&gt;: &quot;un setup si fa per avviare un lotto di unità; il suo costo dipende dalle risorse consumate per farlo e non dal numero di unità lavorate una volta completato&quot; (slide 7). Un lotto di 10 o di 1.000 pezzi richiede lo stesso setup.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Product-level activities&lt;/span&gt; (o &lt;span class=&quot;term&quot;&gt;product-sustaining&lt;/span&gt;): servono a mantenere in vita un prodotto, indipendentemente da quanti lotti o unità se ne fanno. &lt;b&gt;Product design è product-level&lt;/b&gt;: &quot;il costo è determinato dal numero di prodotti supportati, non dal numero di lotti o di unità&quot; (slide 7).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Facility-level&lt;/span&gt; (o &lt;span class=&quot;term&quot;&gt;organization-sustaining&lt;/span&gt;): mantengono la capacità generale dell&#x27;impianto e non si legano a nessun prodotto specifico (affitto, sicurezza, direzione di stabilimento). Molti testi suggeriscono di non allocarli affatto ai prodotti. &lt;span class=&quot;note&quot;&gt;Questo livello non compare nelle slide: lo aggiungiamo per completezza. Nell&#x27;esercizio, General factory è allocato comunque con le DLH, cioè trattato con una base unit-level.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Se Hickory raddoppiasse la produzione di Y mantenendo lo stesso numero di lotti, quali costi aumenterebbero (in teoria)?&lt;/summary&gt;&lt;p&gt;Solo quelli unit-level (Machining, e General factory in quanto legato alle DLH). Setups e Product design resterebbero invariati.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il controllo qualità del primo pezzo di ogni lotto: a che livello appartiene?&lt;/summary&gt;&lt;p&gt;Batch-level: si ripete per ogni lotto, non per ogni unità.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché è sbagliato allocare costi batch-level con una base unit-level come le DLH?&lt;/summary&gt;&lt;p&gt;Perché il volume non è ciò che causa quei costi: il prodotto ad alto volume con pochi lotti si vedrebbe caricare setups che in realtà genera il prodotto a basso volume con molti lotti.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 5. ASSEGNAZIONE --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;assegnazione&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 5 · requisiti 9–10&lt;/span&gt;&lt;h2&gt;Assegnazione ABC a Y e Z&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;formula&quot;&gt;Overhead assegnato al prodotto = Σ&lt;sub&gt;pool&lt;/sub&gt; (activity rate × expected activity del prodotto)&lt;/div&gt;
  &lt;p&gt;Scorri i passi: il grafico accumula pool dopo pool.&lt;/p&gt;
  &lt;div class=&quot;stepper card&quot; id=&quot;assStepper&quot;&gt;
    &lt;svg id=&quot;assChart&quot; viewBox=&quot;0 0 700 150&quot; role=&quot;img&quot; aria-label=&quot;Accumulo dell&#x27;overhead per prodotto&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Machining · $20 per MH&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 7.000 × 20 = $140.000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 3.000 × 20 = $60.000&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Machine setups · $500 per setup&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 50 × 500 = $25.000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 150 × 500 = $75.000&lt;/span&gt; — qui Z paga il triplo di Y.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Product design · $42.000 per product&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 1 × 42.000 = $42.000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 1 × 42.000 = $42.000&lt;/span&gt; — stessa cifra, a prescindere dai volumi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;General factory · $25 per DLH&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: 8.000 × 25 = $200.000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: 4.000 × 25 = $100.000&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h3&gt;Totale&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;y&quot;&gt;Y: $407.000&lt;/span&gt; · &lt;span class=&quot;z&quot;&gt;Z: $277.000&lt;/span&gt; · somma $684.000: l&#x27;ABC ridistribuisce lo stesso overhead, non ne crea né ne toglie.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;src&quot;&gt;Slide 8&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var Y=[140000,25000,42000,200000],Z=[60000,75000,42000,100000],col=[&#x27;var(--sage)&#x27;,&#x27;var(--brick)&#x27;,&#x27;var(--ochre)&#x27;,&#x27;var(--slate)&#x27;],nm=[&#x27;Machining&#x27;,&#x27;Setups&#x27;,&#x27;Design&#x27;,&#x27;General&#x27;];
    var svg=document.getElementById(&#x27;assChart&#x27;),sc=480/460000;
    function draw(k){
      var n=Math.min(k+1,4),h=&#x27;&#x27;;
      [[&#x27;Product Y&#x27;,Y,30,&#x27;var(--Y)&#x27;],[&#x27;Product Z&#x27;,Z,85,&#x27;var(--Z)&#x27;]].forEach(function(r){
        var x=110,t=0;h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(r[2]+22)+&#x27;&quot; font-weight=&quot;600&quot; fill=&quot;&#x27;+r[3]+&#x27;&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;
        for(var i=0;i&lt;n;i++){var w=r[1][i]*sc;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+r[2]+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;34&quot; fill=&quot;&#x27;+col[i]+&#x27;&quot; opacity=&quot;.8&quot;&gt;&lt;title&gt;&#x27;+nm[i]+&#x27;: $&#x27;+r[1][i].toLocaleString(&#x27;it-IT&#x27;)+&#x27;&lt;/title&gt;&lt;/rect&gt;&#x27;;x+=w;t+=r[1][i];}
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+8)+&#x27;&quot; y=&quot;&#x27;+(r[2]+22)+&#x27;&quot; font-weight=&quot;600&quot;&gt;$&#x27;+t.toLocaleString(&#x27;it-IT&#x27;)+&#x27;&lt;/text&gt;&#x27;;
      });
      h+=&#x27;&lt;line x1=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y1=&quot;22&quot; x2=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y2=&quot;70&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(110+456000*sc)+&#x27;&quot; y=&quot;16&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;plantwide Y $456k&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y1=&quot;78&quot; x2=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y2=&quot;125&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(110+228000*sc)+&#x27;&quot; y=&quot;140&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;plantwide Z $228k&lt;/text&gt;&#x27;;
      svg.innerHTML=h;
    }
    document.getElementById(&#x27;assStepper&#x27;).addEventListener(&#x27;step&#x27;,function(e){draw(e.detail);});
  })();
  &lt;/script&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h3&gt;E per unità? &lt;span class=&quot;tag ext&quot; style=&quot;vertical-align:middle&quot;&gt;calcolo nostro, non nelle slide&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Overhead per unità&lt;/th&gt;&lt;th&gt;Plantwide&lt;/th&gt;&lt;th&gt;ABC&lt;/th&gt;&lt;th&gt;Differenza&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;y&quot;&gt;Product Y (14.000 u.)&lt;/td&gt;&lt;td&gt;$32,57&lt;/td&gt;&lt;td&gt;$29,07&lt;/td&gt;&lt;td&gt;−$3,50 → era &lt;b&gt;sovracostato&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td class=&quot;z&quot;&gt;Product Z (6.000 u.)&lt;/td&gt;&lt;td&gt;$38,00&lt;/td&gt;&lt;td&gt;$46,17&lt;/td&gt;&lt;td&gt;+$8,17 → era &lt;b&gt;sottocostato&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;È la tipica conclusione dell&#x27;ABC: il sistema a volume fa pagare ai prodotti ad alto volume parte della complessità dei prodotti a basso volume. Le decisioni di prezzo e di mix basate sul plantwide rate rischiano di spingere proprio Z, che sembra più redditizio di quanto sia.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Quale pool sposta più costo da Y a Z rispetto al plantwide?&lt;/summary&gt;&lt;p&gt;Machine setups: con il plantwide Y ne &quot;pagherebbe&quot; il 66,7% ($66.700 circa), con l&#x27;ABC solo $25.000. Anche Product design sposta costo: da ~$56.000 a $42.000 per Y.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la somma ABC (Y+Z) è ancora $684.000?&lt;/summary&gt;&lt;p&gt;Perché ogni pool viene distribuito interamente: le quantità attese dei driver di Y e Z sommano esattamente all&#x27;expected activity usata per calcolare i rate.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 6. CONFRONTO --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 6 · requisiti 11–15&lt;/span&gt;&lt;h2&gt;Confronto delle percentuali: dove nasce la distorsione&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Il plantwide rate dà a Y il &lt;b&gt;66,7%&lt;/b&gt; di &lt;em&gt;ogni&lt;/em&gt; euro di overhead. L&#x27;ABC invece ripartisce ogni pool secondo il consumo reale. La linea tratteggiata segna il 66,7%: i pool che se ne discostano sono quelli che il sistema tradizionale misura male.&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Quota di Y e Z per pool, confronto con il plantwide&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;35&quot; font-weight=&quot;600&quot;&gt;Plantwide (tutto)&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;15&quot; width=&quot;400&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;600&quot; y=&quot;15&quot; width=&quot;200&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;79&quot;&gt;ABC · Machining&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;59&quot; width=&quot;420&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;620&quot; y=&quot;59&quot; width=&quot;180&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;123&quot;&gt;ABC · Machine setups&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;103&quot; width=&quot;150&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;103&quot; width=&quot;450&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;167&quot;&gt;ABC · Product design&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;147&quot; width=&quot;300&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;500&quot; y=&quot;147&quot; width=&quot;300&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;211&quot;&gt;ABC · General factory&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;191&quot; width=&quot;400&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;600&quot; y=&quot;191&quot; width=&quot;200&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;259&quot; font-weight=&quot;600&quot;&gt;ABC · Totale&lt;/text&gt;&lt;rect x=&quot;200&quot; y=&quot;239&quot; width=&quot;357&quot; height=&quot;28&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;557&quot; y=&quot;239&quot; width=&quot;243&quot; height=&quot;28&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;white&quot; style=&quot;fill:var(--paper)&quot;&gt;
      &lt;text x=&quot;210&quot; y=&quot;34&quot;&gt;Y 66,7%&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;34&quot;&gt;Z 33,3%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;78&quot;&gt;Y 70%&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;78&quot;&gt;Z 30%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;122&quot;&gt;Y 25%&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;122&quot;&gt;Z 75%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;166&quot;&gt;Y 50%&lt;/text&gt;&lt;text x=&quot;510&quot; y=&quot;166&quot;&gt;Z 50%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;210&quot;&gt;Y 66,7%&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;210&quot;&gt;Z 33,3%&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;258&quot;&gt;Y 59,5%&lt;/text&gt;&lt;text x=&quot;567&quot; y=&quot;258&quot;&gt;Z 40,5%&lt;/text&gt;
    &lt;/g&gt;
    &lt;line x1=&quot;600&quot; y1=&quot;6&quot; x2=&quot;600&quot; y2=&quot;276&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
    &lt;text x=&quot;600&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;66,7% (quota DLH di Y)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 9 (le slide arrotondano il totale a 59% / 41%).&lt;/p&gt;

  &lt;div class=&quot;tabs card&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;12 · Machining&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;13 · Setups&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;14 · Design&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;15 · General factory&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;70% / 30% — simile al 66,7 / 33,3.&lt;/b&gt; Machining usa una measure &lt;span class=&quot;term&quot;&gt;unit-level&lt;/span&gt; (machine-hours), come lo è la base DLH del plantwide. Due misure di volume tendono a dare ripartizioni comparabili. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;25% / 75% — opposto al 67 / 33.&lt;/b&gt; Machine setups è un pool &lt;span class=&quot;term&quot;&gt;batch-level&lt;/span&gt;. Y è il prodotto ad alto volume (14.000 u.) e Z a basso volume (6.000 u.), eppure Y consuma solo il 25% degli setups. Il sistema convenzionale attribuisce &lt;em&gt;troppi&lt;/em&gt; costi di setup a Y e &lt;em&gt;troppo pochi&lt;/em&gt; a Z. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;50% / 50% — diverso dal 67 / 33.&lt;/b&gt; Product design è &lt;span class=&quot;term&quot;&gt;product-level&lt;/span&gt;: entrambi i prodotti consumano metà delle risorse di progettazione, a prescindere dai volumi. Anche qui il sistema convenzionale carica troppo Y e troppo poco Z. &lt;span class=&quot;src&quot;&gt;Slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;66,7% / 33,3% — identico.&lt;/b&gt; General factory è allocato con la &lt;em&gt;stessa&lt;/em&gt; measure unit-level (DLH) del plantwide, quindi le percentuali coincidono per costruzione. &lt;span class=&quot;src&quot;&gt;Slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;La lezione in una frase.&lt;/b&gt; Le distorsioni del plantwide rate nascono dai costi &lt;em&gt;non&lt;/em&gt; unit-level (batch e product-level): più pesano sull&#x27;overhead, e più i prodotti differiscono in volume e complessità, più il costo tradizionale è sbagliato.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Quali due pool, da soli, spiegano perché il totale ABC di Y (59,5%) è sotto il 66,7%?&lt;/summary&gt;&lt;p&gt;Machine setups (25%) e Product design (50%). Machining (70%) spinge anzi leggermente sopra, General factory è neutro.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se Y e Z avessero lo stesso numero di setups in proporzione alle DLH (8:4), l&#x27;ABC darebbe risultati diversi dal plantwide?&lt;/summary&gt;&lt;p&gt;Poco: resterebbero lo scostamento di Machining (70 vs 66,7) e quello di Product design (50 vs 66,7). Prova nel laboratorio qui sotto.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Vero o falso: l&#x27;ABC aumenta sempre il costo dei prodotti a basso volume.&lt;/summary&gt;&lt;p&gt;Falso in generale: lo aumenta quando quei prodotti consumano più che proporzionalmente attività batch o product-level, come Z qui. Dipende dai consumi reali.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 7. LAB --&gt;
&lt;section class=&quot;part&quot; id=&quot;lab&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Parte 7&lt;/span&gt;&lt;h2&gt;Laboratorio: muovi i driver&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Costi dei pool fissi come nell&#x27;esercizio ($200k, $100k, $84k, $300k); cambia i consumi e guarda come si allontanano plantwide e ABC. Ai valori iniziali ritrovi la soluzione delle slide.&lt;/p&gt;
  &lt;div class=&quot;card lab grid2&quot;&gt;
    &lt;div&gt;
      &lt;label&gt;Setups di Y: &lt;output id=&quot;oSY&quot;&gt;50&lt;/output&gt;&lt;input id=&quot;sY&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Setups di Z: &lt;output id=&quot;oSZ&quot;&gt;150&lt;/output&gt;&lt;input id=&quot;sZ&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;150&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Machine-hours di Y (su 10.000): &lt;output id=&quot;oMH&quot;&gt;7.000&lt;/output&gt;&lt;input id=&quot;mh&quot; type=&quot;range&quot; min=&quot;1000&quot; max=&quot;9000&quot; step=&quot;500&quot; value=&quot;7000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Direct labor-hours di Y (su 12.000): &lt;output id=&quot;oDL&quot;&gt;8.000&lt;/output&gt;&lt;input id=&quot;dl&quot; type=&quot;range&quot; min=&quot;1000&quot; max=&quot;11000&quot; step=&quot;500&quot; value=&quot;8000&quot;&gt;&lt;/label&gt;
      &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;reset&quot;&gt;ripristina i dati dell&#x27;esercizio&lt;/button&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;svg id=&quot;labChart&quot; viewBox=&quot;0 0 360 230&quot; role=&quot;img&quot; aria-label=&quot;Confronto plantwide e ABC&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;labTbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout&quot; id=&quot;labMsg&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){
    var $=function(i){return document.getElementById(i)},f=function(n){return Math.round(n).toLocaleString(&#x27;it-IT&#x27;)};
    function upd(){
      var sY=+$(&#x27;sY&#x27;).value,sZ=+$(&#x27;sZ&#x27;).value,mh=+$(&#x27;mh&#x27;).value,dl=+$(&#x27;dl&#x27;).value;
      $(&#x27;oSY&#x27;).textContent=sY;$(&#x27;oSZ&#x27;).textContent=sZ;$(&#x27;oMH&#x27;).textContent=f(mh);$(&#x27;oDL&#x27;).textContent=f(dl);
      var aY=200000*mh/10000+100000*sY/(sY+sZ)+42000+300000*dl/12000,aZ=684000-aY,pY=684000*dl/12000,pZ=684000-pY;
      var sc=250/684000,h=&#x27;&#x27;;
      [[&#x27;Plantwide&#x27;,pY,pZ,20],[&#x27;ABC&#x27;,aY,aZ,110]].forEach(function(r){
        h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(r[3]+12)+&#x27;&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(r[3]+20)+&#x27;&quot; width=&quot;&#x27;+r[1]*sc+&#x27;&quot; height=&quot;26&quot; fill=&quot;var(--Y)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(r[1]*sc+6)+&#x27;&quot; y=&quot;&#x27;+(r[3]+38)+&#x27;&quot; font-size=&quot;12&quot;&gt;Y $&#x27;+f(r[1])+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(r[3]+50)+&#x27;&quot; width=&quot;&#x27;+r[2]*sc+&#x27;&quot; height=&quot;26&quot; fill=&quot;var(--Z)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(r[2]*sc+6)+&#x27;&quot; y=&quot;&#x27;+(r[3]+68)+&#x27;&quot; font-size=&quot;12&quot;&gt;Z $&#x27;+f(r[2])+&#x27;&lt;/text&gt;&#x27;;
      });
      $(&#x27;labChart&#x27;).innerHTML=h;
      $(&#x27;labTbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;per unità&lt;/th&gt;&lt;th&gt;Plantwide&lt;/th&gt;&lt;th&gt;ABC&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;y&quot;&gt;Y (14.000 u.)&lt;/td&gt;&lt;td&gt;$&#x27;+(pY/14000).toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;$&#x27;+(aY/14000).toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;z&quot;&gt;Z (6.000 u.)&lt;/td&gt;&lt;td&gt;$&#x27;+(pZ/6000).toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;$&#x27;+(aZ/6000).toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      var d=(aZ-pZ)/aZ*100;
      $(&#x27;labMsg&#x27;).innerHTML=Math.abs(d)&lt;2?&#x27;&lt;b&gt;Quasi nessuna distorsione&lt;/b&gt;: i consumi di Z sono in linea con la sua quota di DLH, e il tasso unico funziona.&#x27;:(d&gt;0?&#x27;Il plantwide &lt;b&gt;sottostima&lt;/b&gt; il costo di Z del &#x27;+d.toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;% rispetto all\&#x27;ABC: Y sta sovvenzionando Z.&#x27;:&#x27;Il plantwide &lt;b&gt;sovrastima&lt;/b&gt; il costo di Z del &#x27;+(-d).toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;% rispetto all\&#x27;ABC: ora è Z a sovvenzionare Y.&#x27;);
    }
    [&#x27;sY&#x27;,&#x27;sZ&#x27;,&#x27;mh&#x27;,&#x27;dl&#x27;].forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,upd);});
    $(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,function(){$(&#x27;sY&#x27;).value=50;$(&#x27;sZ&#x27;).value=150;$(&#x27;mh&#x27;).value=7000;$(&#x27;dl&#x27;).value=8000;upd();});
    upd();
  })();
  &lt;/script&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Imposta setups Y = 100 e Z = 50. Cosa succede e perché?&lt;/summary&gt;&lt;p&gt;La sottostima di Z scende da circa il 17,7% a circa il 3%: ora Y genera i 2/3 dei setups, come i 2/3 delle DLH, e quel pool non distorce più. Restano Product design (50/50, che carica Z più del plantwide) e, in senso opposto, Machining (70/30).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Esiste una combinazione in cui ABC e plantwide coincidono esattamente?&lt;/summary&gt;&lt;p&gt;Sì, quando per ogni pool la quota di Y nel driver è uguale alla sua quota di DLH. Con Product design fisso a 50/50 bisogna compensare con gli altri driver (es. qualche setup o MH in più su Y).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PER APPROFONDIRE --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num&quot;&gt;Fuori dalle slide&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Le slide di questo esercizio &lt;b&gt;non citano&lt;/b&gt; autori, testi, norme o siti. I riferimenti qui sotto sono quindi &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;: li abbiamo scelti per inquadrare l&#x27;esercizio e verificati con una ricerca web.&lt;/p&gt;
  &lt;ul class=&quot;biblio&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;b&gt;Noreen, Brewer, Garrison — &lt;i&gt;Managerial Accounting for Managers&lt;/i&gt; (McGraw Hill)&lt;/b&gt; e testi della stessa famiglia (Garrison/Noreen/Brewer, &lt;i&gt;Managerial Accounting&lt;/i&gt;). Struttura e linguaggio dell&#x27;esercizio (plantwide rate, activity cost pools, cost hierarchy) seguono questi manuali, dove l&#x27;ABC ha un capitolo dedicato (il numero cambia secondo l&#x27;edizione). Le slide non indicano la fonte dell&#x27;esercizio. Utile per altri esercizi dello stesso tipo. &lt;a href=&quot;https://www.mheducation.com.au/managerial-accounting-for-managers-ise-9781265617660-aus&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;editore&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;b&gt;Robin Cooper, Robert S. Kaplan — &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, settembre 1988.&lt;/b&gt; Uno degli articoli fondativi dell&#x27;ABC: sostiene che i sistemi a base volume distorcono il costo dei prodotti e quindi le decisioni di prezzo e di mix, esattamente il fenomeno visto con Y e Z. &lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;articolo (Ivey Publishing)&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;b&gt;Robert S. Kaplan, Robin Cooper — &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt;, Harvard Business School Press, 1997.&lt;/b&gt; Il libro che sistematizza l&#x27;ABC e il suo uso per budgeting, redditività di prodotti e clienti. Conta perché porta l&#x27;ABC dal calcolo del costo alle decisioni. &lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda del libro&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;b&gt;Robert S. Kaplan, Steven R. Anderson — &quot;Time-Driven Activity-Based Costing&quot;, &lt;i&gt;Harvard Business Review&lt;/i&gt;, novembre 2004&lt;/b&gt; (poi libro, 2007). Risponde alle critiche all&#x27;ABC classico (costoso e lento da costruire e aggiornare) usando due sole stime: il tempo richiesto da ogni attività e il costo per unità di capacità. È l&#x27;evoluzione naturale di quanto visto qui. &lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su HBS Working Knowledge&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;note&quot;&gt;Collegamento con il resto del corso: dal nome del file (&lt;code&gt;corso/Activity-Based Costing/7.SMA ABC ex 1 solutions/&lt;/code&gt;) risulta che questo è l&#x27;esercizio 1, con soluzioni, del modulo Activity-Based Costing del corso di Strategic Management Accounting. Le domande teoriche da ripassare (perché nasce l&#x27;ABC, come si scelgono i cost driver) sono quelle sviluppate qui nelle Parti 3–4.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

    tabs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});

  // passi da scorrere
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){

    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;));});
    function show(){steps.forEach(function(x,i){x.classList.toggle(&#x27;on&#x27;,i===k);dots.children[i].classList.toggle(&#x27;on&#x27;,i&lt;=k);});
      prev.disabled=k===0;next.disabled=k===steps.length-1;s.dispatchEvent(new CustomEvent(&#x27;step&#x27;,{detail:k}));}
    prev.addEventListener(&#x27;click&#x27;,function(){if(k&gt;0){k--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(k&lt;steps.length-1){k++;show();}});
    show();
  });
  if(window.initPage)window.initPage();
})();
