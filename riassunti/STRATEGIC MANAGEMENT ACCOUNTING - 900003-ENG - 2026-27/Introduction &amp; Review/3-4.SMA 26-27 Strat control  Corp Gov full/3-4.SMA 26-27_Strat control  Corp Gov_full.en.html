&lt;!-- ========== PARTE I ========== --&gt;
&lt;section class=&quot;part p1&quot; id=&quot;p1&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;I&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 3–9&lt;/div&gt;&lt;h2&gt;Financial and managerial accounting&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The lecture opens with a question: &lt;em&gt;what is accounting?&lt;/em&gt; Before discussing strategic control, we need to understand what information is needed and by whom.&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;It is concerned with &lt;em&gt;recording, estimating, organizing, summarizing and reporting&lt;/em&gt; operational and financial data.&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Financial accounting&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;gloss&quot;&gt;(external reporting / financial statements)&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Communicates financial information to &lt;b&gt;external parties&lt;/b&gt;: &lt;em&gt;stockholders&lt;/em&gt;, &lt;em&gt;creditors&lt;/em&gt; (e.g. banks) and &lt;em&gt;regulators&lt;/em&gt; (supervisory authorities).&lt;/p&gt;&lt;p&gt;Output: published financial statements and other financial reports.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Managerial accounting&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;gloss&quot;&gt;(internal management reporting / cost accounting)&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Provides information to &lt;b&gt;internal managers&lt;/b&gt; so that they can &lt;em&gt;formulate plans&lt;/em&gt;, &lt;em&gt;control operations&lt;/em&gt; and &lt;em&gt;make decisions&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;Output: budgets, segment reports, cost analyses, performance reports.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 290&quot; role=&quot;img&quot; aria-label=&quot;A single accounting system feeds managerial accounting for internal users and financial accounting for external users&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar1&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;220&quot; y=&quot;14&quot; width=&quot;320&quot; height=&quot;78&quot; rx=&quot;12&quot; class=&quot;f1&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;text x=&quot;380&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 17px var(--serif)&quot;&gt;Accounting system&lt;/text&gt;
&lt;text x=&quot;380&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;collects data in the cost accounting system&lt;/text&gt;
&lt;path d=&quot;M300 92 C 300 130, 170 120, 170 150&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar1)&quot;/&gt;
&lt;path d=&quot;M460 92 C 460 130, 590 120, 590 150&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar1)&quot;/&gt;
&lt;rect x=&quot;30&quot; y=&quot;152&quot; width=&quot;280&quot; height=&quot;86&quot; rx=&quot;12&quot; fill=&quot;none&quot; style=&quot;stroke:var(--c1);stroke-width:1.5&quot;/&gt;
&lt;text x=&quot;170&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;s1&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Managerial accounting&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;202&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;decision making, planning,&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;controlling operations&lt;/text&gt;
&lt;rect x=&quot;450&quot; y=&quot;152&quot; width=&quot;280&quot; height=&quot;86&quot; rx=&quot;12&quot; fill=&quot;none&quot; style=&quot;stroke:var(--c1);stroke-width:1.5&quot;/&gt;
&lt;text x=&quot;590&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;s1&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Financial accounting&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;202&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;published financial statements&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;and other financial reports&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;INTERNAL USERS&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;EXTERNAL USERS&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 7: the same source data, two “outputs” for two types of users.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;The seven key differences&lt;/h3&gt;
&lt;p&gt;Slide 8 presents the empty table as an exercise. Try to recall the answers: press &lt;b&gt;Hide&lt;/b&gt;, then click each cell to reveal it.&lt;/p&gt;
&lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;hideBtn&quot; aria-pressed=&quot;false&quot;&gt;Hide the answers&lt;/button&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;reveal&quot; id=&quot;seven&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial accounting&lt;/th&gt;&lt;th&gt;Managerial accounting&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;1. Users&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;External&lt;/b&gt; parties who make financial decisions&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Managers&lt;/b&gt; who plan and control the organization&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;2. Time focus&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Historical&lt;/b&gt; perspective (what happened)&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;Emphasis on the &lt;b&gt;future&lt;/b&gt; (what we will do)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;3. Verifiability vs relevance&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Objectivity and &lt;b&gt;verifiability&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Relevance&lt;/b&gt; to the decision&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;4. Precision vs timeliness&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Precision&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Timeliness&lt;/b&gt;: an approximate figure today is better than a perfect one in three months&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;5. Subject&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Reports on the &lt;b&gt;company as a whole&lt;/b&gt; (companywide)&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Segment reports&lt;/b&gt; and specific &lt;b&gt;cost objects&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;6. Rules&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Must follow &lt;b&gt;GAAP/IFRS&lt;/b&gt; and prescribed formats&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Not&lt;/b&gt; bound by GAAP/IFRS or prescribed formats&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;7. Requirement&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Mandatory&lt;/b&gt; for external reports&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Not&lt;/b&gt; mandatory&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Terms the slides take for granted&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;GAAP&lt;/b&gt; (&lt;em&gt;Generally Accepted Accounting Principles&lt;/em&gt;): the US accounting standards. &lt;b&gt;IFRS&lt;/b&gt; (&lt;em&gt;International Financial Reporting Standards&lt;/em&gt;): the international standards issued by the IASB, mandatory in the EU for the consolidated financial statements of listed companies. See “Further reading”.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Segment report&lt;/b&gt;: an income statement for one part of the company (product line, geographical area, channel, division).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Cost object&lt;/b&gt;: anything whose cost we want to know, such as a product, a customer, a department or a project.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Cost accounting system&lt;/b&gt;: the system that records and assigns costs. It feeds both the financial statements (e.g. inventory valuation) and internal analyses.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-assessment · Part I&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;The sales director asks for an estimate, even a rough one, of the margin per customer by tomorrow. Which difference is mainly at stake?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Rules: it must follow IFRS&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Precision vs timeliness and Subject: timeliness and a specific cost object&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Requirement: it is a mandatory report&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct: it is needed quickly (timeliness) and refers to a specific object, the customer. This is typical managerial accounting.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why does managerial accounting not have to follow GAAP/IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because its users are internal: what matters is not comparability and the protection of third parties, but information relevant to decision making. Each company can design the reports that are most useful to it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Financial accounting = past, managerial accounting = future: is this an absolute rule?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is an &lt;em&gt;emphasis&lt;/em&gt;, not a sharp boundary (the slide says “emphasis”). Managerial accounting also uses historical data, for example to compare actual results with the budget, but its purpose is to guide future choices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE II ========== --&gt;
&lt;section class=&quot;part p2&quot; id=&quot;p2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;II&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 10–21&lt;/div&gt;&lt;h2&gt;The work of management: planning, controlling, decision making&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Managerial accounting supports three activities (slide 10). Use the tabs to explore them.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-plan&quot; id=&quot;tb-plan&quot;&gt;Planning&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-ctrl&quot; id=&quot;tb-ctrl&quot;&gt;Controlling&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-dec&quot; id=&quot;tb-dec&quot;&gt;Decision making&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-plan&quot; aria-labelledby=&quot;tb-plan&quot;&gt;
&lt;p&gt;&lt;b&gt;Planning&lt;/b&gt; proceeds in three steps:&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Establish goals, specify how goals will be achieved, develop budgets&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;1 · Establish goals&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;where we want to go&lt;/text&gt;
&lt;path d=&quot;M200 50 H 255&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;rect x=&quot;260&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;2 · Specify how&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;how to achieve the goals&lt;/text&gt;
&lt;path d=&quot;M460 50 H 515&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;3 · Develop budgets&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;the plan in numbers&lt;/text&gt;
&lt;text x=&quot;615&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 13px var(--serif)&quot;&gt;Budget = detailed plan for the future,&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 13px var(--serif)&quot;&gt;expressed in formal quantitative terms&lt;/text&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-ctrl&quot; aria-labelledby=&quot;tb-ctrl&quot; hidden&gt;
&lt;p&gt;The traditional &lt;b&gt;control&lt;/b&gt; function &lt;em&gt;gathers feedback to ensure that plans are being followed&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;Feedback takes the form of &lt;b&gt;performance reports&lt;/b&gt;, which compare &lt;em&gt;actual&lt;/em&gt; results with the &lt;em&gt;budget&lt;/em&gt;. The difference is called a &lt;b&gt;variance&lt;/b&gt; &lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;p style=&quot;text-align:center;font:400 1.15rem var(--serif)&quot;&gt;Variance = Actual − Budget&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Mind the sign: for revenues a positive variance is favorable, for costs it is unfavorable. In Part III you will see why this after-the-fact control is not enough at the strategic level.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-dec&quot; aria-labelledby=&quot;tb-dec&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;Decision making&lt;/b&gt; = &lt;em&gt;selecting a course of action from competing alternatives&lt;/em&gt;. There are three typical questions:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;What to sell&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Which products should we focus our marketing on?&lt;/li&gt;&lt;li&gt;Which new products should we offer?&lt;/li&gt;&lt;li&gt;What prices should we charge?&lt;/li&gt;&lt;li&gt;Which products should we discontinue?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;Whom to serve&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Whom should we focus our marketing on?&lt;/li&gt;&lt;li&gt;Whom should we start serving?&lt;/li&gt;&lt;li&gt;Whom should we charge a premium price or offer discounts to?&lt;/li&gt;&lt;li&gt;Whom should we stop serving?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;How?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;How to execute&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How should we source parts and services?&lt;/li&gt;&lt;li&gt;How should we expand or contract capacity?&lt;/li&gt;&lt;li&gt;How can we improve efficiency and effectiveness?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Goals and objectives: are they the same thing?&lt;/h3&gt;
&lt;p&gt;No (slides 12–13). The &lt;b&gt;goal&lt;/b&gt; sets the direction; the &lt;b&gt;objective&lt;/b&gt; is a precise, measurable step in that direction.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;th&gt;Objective&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Definition&lt;/th&gt;&lt;td&gt;Overall direction and destination that helps achieve the vision&lt;/td&gt;&lt;td&gt;Exact actions and steps to achieve the goal&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Specificity&lt;/th&gt;&lt;td&gt;General intention&lt;/td&gt;&lt;td&gt;Specific, precise&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Scope&lt;/th&gt;&lt;td&gt;Broad, concerns the whole&lt;/td&gt;&lt;td&gt;Narrow, one part of the whole&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Example&lt;/th&gt;&lt;td&gt;Expand the international customer base&lt;/td&gt;&lt;td&gt;+28% customers from the UK, Australia and Germany over the next 3 months&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Measurement&lt;/th&gt;&lt;td&gt;Difficult, often intangible&lt;/td&gt;&lt;td&gt;Easy: it must be measurable and tangible&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Time horizon&lt;/th&gt;&lt;td&gt;Long term&lt;/td&gt;&lt;td&gt;Short to medium term&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; A good objective has an indicator, a target value and a deadline. Many textbooks summarize this with the acronym &lt;em&gt;SMART&lt;/em&gt; (Specific, Measurable, Achievable, Relevant, Time-bound), which, however, does not appear in the slides.&lt;/p&gt;

&lt;h3&gt;The GreenBite Café case&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · The problem&lt;/span&gt;&lt;p&gt;A small café near the campus sells healthy meals, smoothies and coffee. Its vision is to become “the most trusted healthy food choice for students and young professionals in the city”.&lt;/p&gt;&lt;p&gt;The business has grown quickly, but lunchtime service is slow, food waste is increasing and employees do not know what the priority is: speed, quality, sustainability or profit?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · The founder’s statement&lt;/span&gt;&lt;p style=&quot;font:italic 1.2rem var(--serif)&quot;&gt;“We want GreenBite Café to become a sustainable and profitable business that customers love.”&lt;/p&gt;&lt;p&gt;Goal or objective?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · It is a goal&lt;/span&gt;&lt;p&gt;It is broad and describes the general direction, but it is &lt;b&gt;not measurable&lt;/b&gt;: it does not say how much profitability should grow, how sustainability is measured, or by when satisfaction should improve.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · From goal to objectives&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Customer satisfaction&lt;/b&gt;: raise the average rating from 4.1 to 4.5 out of 5 within six months, or reduce monthly complaints by 20% within three months.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Profitability&lt;/b&gt;: cut the monthly cost of ingredients by 8% without compromising quality.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Food waste&lt;/b&gt;: reduce daily unsold food by 25% within four months.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Service efficiency&lt;/b&gt;: serve at least 90% of lunch orders within 10 minutes.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Employee skills&lt;/b&gt;: train all employees in waste-reduction procedures by the end of next month.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · The role of the management accountant&lt;/span&gt;&lt;p&gt;Translating the general statement into objectives that guide &lt;b&gt;planning&lt;/b&gt; (budgets for ingredients and staff), &lt;b&gt;budgeting&lt;/b&gt; and &lt;b&gt;performance evaluation&lt;/b&gt;, i.e. comparing actual values with targets. This is the bridge between Part I and Part III.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab sorter&quot; id=&quot;sorter&quot;&gt;
&lt;h4&gt;Exercise: goal or objective?&lt;/h4&gt;
&lt;ul&gt;
&lt;li data-k=&quot;g&quot;&gt;&lt;span&gt;Become a benchmark for sustainable food service&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Reduce packaging waste by 15% by December&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Open a second outlet within 12 months serving at least 150 covers per day&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;g&quot;&gt;&lt;span&gt;Be a place where people love to work&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Bring the average waiting time below 7 minutes in the next quarter&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;gloss&quot;&gt;Examples constructed for practice; they do not appear in the slides.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Decision making in practice: make or buy&lt;/h3&gt;
&lt;p&gt;Exercise from slides 20–21: should the company keep &lt;b&gt;making&lt;/b&gt; a component in-house or &lt;b&gt;buy&lt;/b&gt; it from a foreign supplier? The slides identify two groups of factors:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quantitative&lt;/h4&gt;&lt;p&gt;The potential &lt;b&gt;cost savings&lt;/b&gt; from buying rather than making.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Qualitative&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Strategy&lt;/b&gt;: if the component is critical to the strategy, the company may keep making it even if this costs more.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Risks&lt;/b&gt;: if the supplier could cause quality problems that harm end consumers, the risks may outweigh the savings.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Corporate social responsibility&lt;/b&gt;: the company may forgo outsourcing if it would cause layoffs at the domestic plant.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot; id=&quot;mob&quot;&gt;
&lt;h4&gt;Make-or-buy lab&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mkc&quot;&gt;&lt;em&gt;Avoidable&lt;/em&gt; internal cost per unit&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mkc&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;18&quot;&gt;&lt;output id=&quot;mkcO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;byp&quot;&gt;Supplier price per unit&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;byp&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;bypO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vol&quot;&gt;Annual volume (units)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vol&quot; min=&quot;1000&quot; max=&quot;50000&quot; step=&quot;1000&quot; value=&quot;20000&quot;&gt;&lt;output id=&quot;volO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;toggles&quot;&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;s&quot;&gt;Component critical to the strategy&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;r&quot;&gt;Supplier quality risk&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;c&quot;&gt;Would cause layoffs&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; id=&quot;mobChart&quot; role=&quot;img&quot; aria-label=&quot;Comparison of total make and buy costs&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;38&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Make&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;88&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Buy&lt;/text&gt;
&lt;rect id=&quot;barM&quot; x=&quot;60&quot; y=&quot;20&quot; height=&quot;28&quot; rx=&quot;4&quot; class=&quot;s2&quot;/&gt;
&lt;rect id=&quot;barB&quot; x=&quot;60&quot; y=&quot;70&quot; height=&quot;28&quot; rx=&quot;4&quot; class=&quot;s3&quot;/&gt;
&lt;text id=&quot;lblM&quot; y=&quot;40&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;&lt;/text&gt;
&lt;text id=&quot;lblB&quot; y=&quot;90&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;mobV&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; Only &lt;b&gt;avoidable&lt;/b&gt; costs (&lt;em&gt;avoidable/relevant costs&lt;/em&gt;) count in the comparison, i.e. those that disappear if production stops. Allocated common fixed costs, which remain in any case, should be ignored. The model is deliberately simplified.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-assessment · Part II&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Which of the following is the definition of a budget given in the slides?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;The report comparing actual and planned results&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;A detailed plan for the future, usually expressed in formal quantitative terms&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;The choice among competing alternatives&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct. The comparison report is the performance report (controlling); choosing among alternatives is decision making.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;“Whom should we stop serving?” belongs to which family of decisions?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;What should we be selling?&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Who should we be serving?&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;How should we execute?&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Yes: it concerns customers, so it is a “Who” decision.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why might a company keep making a component even if buying it is cheaper?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For three qualitative reasons: the component is critical to the strategy (a competence to protect), the supplier poses quality risks that could harm consumers, or there are corporate social responsibility reasons (avoiding layoffs). Calculating the savings is necessary, but not sufficient.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE III ========== --&gt;
&lt;section class=&quot;part p3&quot; id=&quot;p3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;III&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 22–28&lt;/div&gt;&lt;h2&gt;Strategic control: from the traditional to the contemporary model&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Once the strategy has been formulated, it has to be implemented. Part of implementation consists of creating a mechanism that &lt;b&gt;monitors and corrects performance&lt;/b&gt;. This mechanism must be &lt;b&gt;consistent&lt;/b&gt; with the chosen strategy. The guiding question of slide 22 is: &lt;em&gt;how do you get all stakeholders moving in the right direction?&lt;/em&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Strategic control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Monitoring performance against strategic objectives and taking corrective action when needed, through effective systems. There are three mechanisms:&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;a class=&quot;card&quot; href=&quot;#p3-info&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Informational control&lt;/h4&gt;&lt;p&gt;Information about the external and internal environment: is the strategy still the right one?&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#p4&quot; style=&quot;text-decoration:none;color:inherit;--c:var(--c4)&quot;&gt;&lt;h4&gt;Behavioral control&lt;/h4&gt;&lt;p&gt;Culture, rewards and boundaries that shape people’s behavior.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#p5&quot; style=&quot;text-decoration:none;color:inherit;--c:var(--c5)&quot;&gt;&lt;h4&gt;Corporate governance&lt;/h4&gt;&lt;p&gt;The relationship among shareholders, the board and management.&lt;/p&gt;&lt;/a&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; Compared with the “controlling” of Part II, which checks whether the budget has been met, strategic control takes a higher-level view: it checks whether the strategy itself is working and whether it should be changed.&lt;/p&gt;

&lt;h3&gt;Two models compared&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-trad&quot; id=&quot;tb-trad&quot;&gt;Traditional approach&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-cont&quot; id=&quot;tb-cont&quot;&gt;Contemporary approach&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-trad&quot; aria-labelledby=&quot;tb-trad&quot;&gt;
&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Sequential model: formulate, implement, strategic control, with a feedback loop&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;40&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s4&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;1 · Formulate&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;strategies and goals&lt;/text&gt;
&lt;path d=&quot;M210 51 H 270&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;rect x=&quot;275&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s3&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;2 · Implement&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;put into action&lt;/text&gt;
&lt;path d=&quot;M445 51 H 505&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;rect x=&quot;510&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;3 · Strategic control&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;measure vs set goals&lt;/text&gt;
&lt;path d=&quot;M680 51 H 705 V 118 H 15 V 51 H 35&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;text x=&quot;360&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;feedback loop: only at the end, with lengthy time lags&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;The traditional model is &lt;b&gt;sequential&lt;/b&gt;: strategies are formulated and goals are set, they are implemented, and finally performance is measured against the &lt;em&gt;predetermined&lt;/em&gt; goals. Feedback returns to formulation only at the end of the cycle.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Lengthy time lags&lt;/b&gt;: a long time passes between action, measurement and correction.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Single-loop learning&lt;/b&gt;: actions are corrected to reach objectives that remain fixed, without questioning them.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;It is appropriate when&lt;/b&gt;: the environment is stable and relatively simple, objectives can be measured with certainty, and there is little need for complex performance measures.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-cont&quot; aria-labelledby=&quot;tb-cont&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 720 250&quot; role=&quot;img&quot; aria-label=&quot;Interactive model: formulate and implement linked to each other and to strategic control, through informational control and behavioral control&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;60&quot; y=&quot;20&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s4&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Formulate strategies&lt;/text&gt;
&lt;rect x=&quot;480&quot; y=&quot;20&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s3&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Implement strategies&lt;/text&gt;
&lt;rect x=&quot;270&quot; y=&quot;170&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Strategic control&lt;/text&gt;
&lt;path d=&quot;M245 50 H 475&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;path d=&quot;M170 84 L 290 166&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;path d=&quot;M550 84 L 430 166&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;text x=&quot;120&quot; y=&quot;138&quot; class=&quot;s3&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;Informational control&lt;/text&gt;
&lt;text x=&quot;120&quot; y=&quot;156&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;“doing the right things”&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;138&quot; class=&quot;s4&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;Behavioral control&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;156&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;“doing things right”&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;In the contemporary model, formulation, implementation and control are &lt;b&gt;highly interactive&lt;/b&gt;: they influence one another continuously rather than one after the other.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Informational control&lt;/h4&gt;&lt;p&gt;Is the organization &lt;b&gt;doing the right things&lt;/b&gt;? It concerns the &lt;b&gt;effectiveness&lt;/b&gt; of the strategy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c4)&quot;&gt;&lt;h4&gt;Behavioral control&lt;/h4&gt;&lt;p&gt;Is the organization &lt;b&gt;doing things right&lt;/b&gt; in implementing the strategy? It concerns &lt;b&gt;execution&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Both are needed&lt;/b&gt; (slide 27): a wrong strategy executed perfectly fails, and so does a right strategy executed poorly.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot; id=&quot;turb&quot;&gt;
&lt;h4&gt;Which approach fits the context?&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tu&quot;&gt;Environmental turbulence and complexity&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tu&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;tuO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;me&quot;&gt;Ease of measuring objectives&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;me&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;meO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;tuV&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;A teaching simplification of the criteria on slide 25: a stable, simple environment and objectives that can be measured with certainty favor the traditional approach; otherwise the contemporary one is needed.&lt;/p&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Single-loop and double-loop learning: the difference in one picture&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The distinction comes from Chris Argyris (&lt;a href=&quot;https://en.wikipedia.org/wiki/Double-loop_learning&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Double-loop learning, Wikipedia&lt;/a&gt;; original article: “Double Loop Learning in Organizations”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, Sep–Oct 1977).&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Single loop corrects actions; double loop also questions objectives and assumptions&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar5&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Objectives and&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;assumptions&lt;/text&gt;
&lt;rect x=&quot;260&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Actions&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;585&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Results&lt;/text&gt;
&lt;path d=&quot;M190 97 H 255&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path d=&quot;M430 97 H 495&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;path d=&quot;M585 124 C 585 160, 345 160, 345 128&quot; class=&quot;edge&quot; style=&quot;stroke:var(--c3);stroke-width:2&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;text x=&quot;465&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;s3&quot; style=&quot;font:italic 600 13px var(--serif)&quot;&gt;single loop: correct the actions&lt;/text&gt;
&lt;path d=&quot;M585 70 C 585 18, 105 18, 105 66&quot; class=&quot;edge&quot; style=&quot;stroke:var(--accent);stroke-width:2&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;text x=&quot;345&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;s5&quot; style=&quot;font:italic 600 13px var(--serif)&quot;&gt;double loop: rethink objectives and assumptions&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;The classic example is the thermostat: a “single-loop” thermostat turns on the heating when the temperature drops below 20°; a “double-loop” system asks whether 20° is really the right setting. Traditional strategic control works on the first loop; the informational control of the contemporary model also serves to travel the second.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;p3-info&quot;&gt;Informational control&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Informational control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;It concerns both the &lt;b&gt;internal&lt;/b&gt; and the &lt;b&gt;external&lt;/b&gt; environment. The question is: do the organization’s goals and strategies still &lt;em&gt;fit&lt;/em&gt; the current strategic environment?&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;The firm at the center, monitored from within and scanning outward&quot;&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;105&quot; fill=&quot;none&quot; style=&quot;stroke:var(--c3);stroke-dasharray:5 5;stroke-width:1.5&quot;/&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;52&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Firm&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:11px var(--sans)&quot;&gt;goals + strategy&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; class=&quot;s3&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;internal environment&lt;/text&gt;
&lt;text x=&quot;40&quot; y=&quot;60&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;1 · Scan and monitor&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;80&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;the external environment:&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;98&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;customers, competitors,&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;116&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;technology, regulation&lt;/text&gt;
&lt;text x=&quot;490&quot; y=&quot;60&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;2 · Continuously monitor&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;80&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;the internal environment:&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;98&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;resources, processes,&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;116&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;performance&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The two “key issues” of slide 28. The examples listed are a supplement.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-assessment · Part III&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;A company meets its budgeted cost targets every year, but demand for its product is collapsing because of a new technology. Which control was missing?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Behavioral control&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Informational control&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;None: the targets were met&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct: the company was doing things right, but no longer doing the right things. Its fit with the external environment had broken down.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;What does “single-loop learning” mean in the traditional model?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Actions are corrected against objectives set at the outset, without revisiting them&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Learning happens only once, at the start of the cycle&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Formulation and implementation influence each other&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Yes. The last option describes the contemporary model instead.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;List the three conditions under which the traditional approach is appropriate.&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;A stable and relatively simple environment.&lt;/li&gt;&lt;li&gt;Objectives that can be measured with certainty.&lt;/li&gt;&lt;li&gt;Little need for complex performance measures.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why are “both needed”, informational and behavioral control?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they cover two different ways of failing: choosing the wrong strategy (effectiveness) and executing the right one poorly (execution).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE IV ========== --&gt;
&lt;section class=&quot;part p4&quot; id=&quot;p4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;IV&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 29–35&lt;/div&gt;&lt;h2&gt;Behavioral control: culture, rewards, boundaries&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Behavioral control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;It focuses on implementation (&lt;em&gt;doing things right&lt;/em&gt;) and influences employees’ actions through three levers that must be &lt;b&gt;balanced&lt;/b&gt; against one another: &lt;b&gt;culture&lt;/b&gt;, &lt;b&gt;rewards&lt;/b&gt; and &lt;b&gt;boundaries&lt;/b&gt;.&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Clickable triangle: boundaries at the top, culture and rewards at the bottom, linked by double-headed arrows&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;path d=&quot;M275 115 L 165 210&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;path d=&quot;M365 115 L 475 210&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;path d=&quot;M200 262 H 440&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;bd&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;75&quot; r=&quot;62&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Boundaries&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;cu&quot;&gt;&lt;circle cx=&quot;140&quot; cy=&quot;262&quot; r=&quot;62&quot; class=&quot;f4&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;267&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Culture&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;rw&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;262&quot; r=&quot;62&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;267&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Rewards&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;320&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;the three levers reinforce (or hinder) one another&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot; id=&quot;bcPanel&quot;&gt;&lt;b&gt;Click a circle&lt;/b&gt; to see its summary.&lt;/div&gt;
&lt;div hidden&gt;
&lt;div data-info=&quot;cu&quot;&gt;&lt;b&gt;Culture.&lt;/b&gt; A system of unwritten rules that guides behavior from within: people do the right thing because they have internalized it. &lt;a href=&quot;#cu&quot;&gt;Go to details ↓&lt;/a&gt;&lt;/div&gt;
&lt;div data-info=&quot;rw&quot;&gt;&lt;b&gt;Rewards.&lt;/b&gt; Reward systems and incentive programs: they focus efforts on priorities and motivate individual and group performance. &lt;a href=&quot;#rw&quot;&gt;Go to details ↓&lt;/a&gt;&lt;/div&gt;
&lt;div data-info=&quot;bd&quot;&gt;&lt;b&gt;Boundaries.&lt;/b&gt; Limits communicated to employees that define what must not be done (codes of conduct, policies, rules). &lt;a href=&quot;#bd&quot;&gt;Go to details ↓&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/figure&gt;

&lt;h3 id=&quot;cu&quot;&gt;Culture&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Organizational culture&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;A system of &lt;b&gt;shared values&lt;/b&gt; (&lt;em&gt;what is important&lt;/em&gt;) and &lt;b&gt;beliefs&lt;/b&gt; (&lt;em&gt;how things work&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it does&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Shapes people, organizational structures and control systems.&lt;/li&gt;&lt;li&gt;Produces &lt;b&gt;behavioral norms&lt;/b&gt;: “the way we do things around here”.&lt;/li&gt;&lt;li&gt;Sets &lt;b&gt;implicit boundaries&lt;/b&gt; on dress, ethical matters and the way business is conducted.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A strong culture…&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;increases &lt;b&gt;employee engagement&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;provides a common purpose and identity;&lt;/li&gt;&lt;li&gt;&lt;b&gt;but&lt;/b&gt; can create &lt;b&gt;core rigidities&lt;/b&gt;: the habits that brought success become an obstacle to change.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The concept of &lt;em&gt;core rigidities&lt;/em&gt; comes from Dorothy Leonard-Barton (1992): a firm’s very core capabilities, rooted also in its values, can hinder innovation (&lt;a href=&quot;https://acawiki.org/Core_capabilities_and_core_rigidities:_A_paradox_in_managing_new_product_development&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary on AcaWiki&lt;/a&gt;).&lt;/p&gt;

&lt;h3 id=&quot;rw&quot;&gt;Rewards&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;Reward systems&lt;/b&gt; and incentive programs (slide 32):&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;are a powerful means of influencing culture;&lt;/li&gt;&lt;li&gt;focus efforts on high-priority tasks;&lt;/li&gt;&lt;li&gt;motivate individual and collective performance;&lt;/li&gt;&lt;li&gt;can be an effective motivator and control mechanism.&lt;/li&gt;&lt;/ul&gt;

&lt;div class=&quot;lab&quot; id=&quot;rwlab&quot;&gt;
&lt;h4&gt;Checklist: is your reward system effective?&lt;/h4&gt;
&lt;p class=&quot;gloss&quot;&gt;The six characteristics on slide 33. Tick those present in a system you know (work, sport, a club…).&lt;/p&gt;
&lt;div class=&quot;toggles&quot; style=&quot;flex-direction:column;align-items:flex-start&quot;&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Objectives are clear, well understood and broadly accepted&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Rewards are clearly linked to performance and desired behaviors&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Performance measures are clear and highly visible&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Feedback is prompt, clear and unambiguous&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;The compensation system is perceived as fair and equitable&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;The structure is flexible and adapts to changing circumstances&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 30&quot; role=&quot;img&quot; aria-label=&quot;Indicator of the number of characteristics present&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;8&quot; width=&quot;600&quot; height=&quot;14&quot; rx=&quot;7&quot; style=&quot;fill:var(--rule)&quot;/&gt;&lt;rect id=&quot;rwBar&quot; x=&quot;0&quot; y=&quot;8&quot; width=&quot;0&quot; height=&quot;14&quot; rx=&quot;7&quot; class=&quot;s4&quot;/&gt;&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;rwV&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;What happens if rewards reward the wrong behavior?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; People do what is measured and rewarded. If GreenBite rewards only speed of service, quality or waste reduction may deteriorate. This is why the slides require rewards to be linked to performance &lt;em&gt;and to desired behaviors&lt;/em&gt;, and the structure to be flexible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;bd&quot;&gt;Boundaries&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Boundaries&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Limits communicated to employees that prevent them from pursuing unacceptable projects. In a sense, they describe what is &lt;em&gt;not&lt;/em&gt; permitted in the search for innovations and new directions of development (the risks to be avoided). They serve to “delineate the acceptable domain of activity for organizational participants”. In empirical studies they appear as &lt;b&gt;codes of conduct, ethical behavior and policies&lt;/b&gt;.&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The quotation can be traced to Robert Simons and his &lt;em&gt;Levers of Control&lt;/em&gt; (1995), where &lt;em&gt;boundary systems&lt;/em&gt; are one of the four levers of control, together with belief, diagnostic and interactive systems (&lt;a href=&quot;https://www.icaew.com/technical/business-and-management/business-performance-management/bpm-tools-templates-and-case-studies/levers-of-control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW guide&lt;/a&gt;).&lt;/p&gt;

&lt;h3&gt;When to use which lever: situational factors&lt;/h3&gt;
&lt;p&gt;In the table on slide 35, boundaries appear as &lt;b&gt;rules&lt;/b&gt; (written rules):&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Approach&lt;/th&gt;&lt;th&gt;Situational factors&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Culture&lt;/b&gt;: unwritten rules that become an internalized influence on behavior&lt;/td&gt;&lt;td&gt;Typical of professional organizations · high autonomy · norms are the basis of behavior&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rules&lt;/b&gt;: written, explicit guidelines; external constraints on behavior&lt;/td&gt;&lt;td&gt;Standardized output · repetitive, routine tasks · little need for innovation and creativity&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rewards&lt;/b&gt;: performance-based incentive systems&lt;/td&gt;&lt;td&gt;Output and performance easy to measure · organizations with &lt;em&gt;unrelated diversification&lt;/em&gt; (diversification into unrelated businesses) · reinforce the other levers&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-assessment · Part IV&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;An architecture firm with highly autonomous professionals and ever-changing projects. Main lever?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Yes: a professional organization, high autonomy, behavior guided by shared norms.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;An assembly line with repetitive tasks and standardized output. Main lever?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct: routine tasks and little need for creativity make written, explicit rules appropriate.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;A conglomerate holding company with unrelated businesses (hotels, cement, insurance), each with easily measurable results. Main lever?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct: unrelated diversification and easily measured output. It is hard to have a common culture or common rules across such different businesses.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Does a strong culture have only advantages?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: besides engagement and a common purpose and identity, it can introduce &lt;b&gt;core rigidities&lt;/b&gt;, i.e. resistance to change when the environment calls for new strategies.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between culture and rules as control levers?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Culture works from &lt;b&gt;within&lt;/b&gt;, through unwritten, internalized rules. Rules work from &lt;b&gt;outside&lt;/b&gt;, through written, explicit constraints.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE V ========== --&gt;
&lt;section class=&quot;part p5&quot; id=&quot;p5&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;V&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 36–44&lt;/div&gt;&lt;h2&gt;Corporate governance&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The third mechanism of strategic control. Slide 36 opens with a question, “what do we already know?”, so the course assumes this topic is already partly familiar.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Corporate governance&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;It concerns the relationships among &lt;b&gt;shareholders&lt;/b&gt;, &lt;b&gt;management&lt;/b&gt; led by the &lt;b&gt;CEO&lt;/b&gt; (&lt;em&gt;Chief Executive Officer&lt;/em&gt;) and the &lt;b&gt;Board of Directors&lt;/b&gt;. It presupposes the &lt;b&gt;separation of ownership and management&lt;/b&gt; in the modern &lt;em&gt;corporation&lt;/em&gt; (large public company) and asks how to align managers’ motivations with the interests of shareholders and the board.&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Clickable triangle: shareholders elect the board, the board appoints and oversees the CEO, the CEO manages and is accountable&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar7&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;path d=&quot;M265 75 C 180 90, 140 140, 135 190&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;110&quot; class=&quot;edgelbl&quot;&gt;elect&lt;/text&gt;
&lt;path d=&quot;M215 245 H 420&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot;/&gt;&lt;text x=&quot;317&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;appoints, evaluates, compensates&lt;/text&gt;
&lt;path d=&quot;M500 190 C 490 140, 450 90, 375 75&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;110&quot; class=&quot;edgelbl&quot;&gt;creates value? accountable&lt;/text&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;sh&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;30&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;Shareholders&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;owners · principal&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;bo&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;215&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;241&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;Board of Directors&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;oversees&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;ce&quot;&gt;&lt;rect x=&quot;425&quot; y=&quot;215&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;241&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;CEO and management&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;manage · agent&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;Click an actor&lt;/b&gt; to see its role.&lt;/div&gt;
&lt;div hidden&gt;
&lt;div data-info=&quot;sh&quot;&gt;&lt;b&gt;Shareholders.&lt;/b&gt; They own the firm but, when they are numerous and dispersed, they do not manage it. Individually they have rights; collectively they have power (see shareholder activism).&lt;/div&gt;
&lt;div data-info=&quot;bo&quot;&gt;&lt;b&gt;Board of Directors.&lt;/b&gt; Represents the shareholders, discusses strategy, evaluates the CEO and decides on management rewards. Its power depends on its commitment and independence.&lt;/div&gt;
&lt;div data-info=&quot;ce&quot;&gt;&lt;b&gt;CEO and management.&lt;/b&gt; They hold information and day-to-day decision-making power. They may pursue goals of their own (prestige, pay, perquisites, growth in size) that differ from shareholder value creation.&lt;/div&gt;
&lt;/div&gt;
&lt;figcaption&gt;The arrows are a supplement: the slides list the three actors without drawing their relationships.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Why it is needed: agency theory&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; The slides mention &lt;b&gt;agency theory&lt;/b&gt; in connection with CEO duality, but take it for granted. The &lt;b&gt;principal&lt;/b&gt; (the shareholder) delegates a task to the &lt;b&gt;agent&lt;/b&gt; (the manager), who has more information and interests of their own. The result is a &lt;b&gt;principal–agent conflict&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; Jensen and Meckling (1976) define &lt;b&gt;agency costs&lt;/b&gt; as the sum of three components (&lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;):&lt;/p&gt;
&lt;p style=&quot;text-align:center;font:400 1.15rem var(--serif)&quot;&gt;Agency costs = monitoring costs + bonding costs + residual loss&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Monitoring: costs borne by the principal to oversee the agent (board, auditors, reports). Bonding: costs borne by the agent to provide guarantees. Residual loss: the loss of value that remains despite everything.&lt;/p&gt;

&lt;div class=&quot;lab&quot; id=&quot;ag&quot;&gt;
&lt;h4&gt;Why boards ask the CEO to own shares&lt;/h4&gt;
&lt;p class=&quot;gloss&quot;&gt;Jensen and Meckling’s idea, simplified. The CEO spends €100,000 of company money on private perquisites (jets, luxury offices…). How much does the CEO pay, and how much do the other shareholders pay?&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;al&quot;&gt;Share of equity owned by the CEO&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;al&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;alO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 70&quot; role=&quot;img&quot; aria-label=&quot;Split of the cost of perquisites between the CEO and the other shareholders&quot;&gt;
&lt;rect id=&quot;agA&quot; x=&quot;0&quot; y=&quot;10&quot; height=&quot;34&quot; class=&quot;s2&quot;/&gt;&lt;rect id=&quot;agB&quot; y=&quot;10&quot; height=&quot;34&quot; class=&quot;s5&quot;/&gt;
&lt;text x=&quot;0&quot; y=&quot;62&quot; class=&quot;s2&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;paid by the CEO&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;62&quot; text-anchor=&quot;end&quot; class=&quot;s5&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;paid by the other shareholders&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;agV&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Internal mechanisms&lt;/h3&gt;
&lt;p&gt;Four tools for aligning the interests of owners and managers (slide 38):&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;g-bo&quot; id=&quot;gb-bo&quot;&gt;Board of Directors&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-sa&quot; id=&quot;gb-sa&quot;&gt;Shareholder activism&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-in&quot; id=&quot;gb-in&quot;&gt;Rewards and incentives&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-du&quot; id=&quot;gb-du&quot;&gt;CEO duality&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-bo&quot; aria-labelledby=&quot;gb-bo&quot;&gt;
&lt;p&gt;An &lt;b&gt;effective&lt;/b&gt; board should:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;have active, critical members rather than mere rubber stamps;&lt;/li&gt;&lt;li&gt;discuss forward-looking strategic issues;&lt;/li&gt;&lt;li&gt;evaluate the CEO against high performance standards;&lt;/li&gt;&lt;li&gt;practice &lt;b&gt;director independence&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Outsider-dominated board: pros&lt;/h4&gt;&lt;p&gt;Access to broader knowledge; independent oversight of strategy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c4)&quot;&gt;&lt;h4&gt;…and cons&lt;/h4&gt;&lt;p&gt;Less direct operational information; fewer opportunities to interact with executives who do not sit on the board, who are thus excluded from the strategic vision.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; &lt;em&gt;Outsider&lt;/em&gt; = a director who is not an employee of the company (non-executive); &lt;em&gt;insider&lt;/em&gt; = a manager who also sits on the board.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-sa&quot; aria-labelledby=&quot;gb-sa&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;Shareholder activism&lt;/b&gt; = shareholders actively exercising their rights to influence the firm. It rests on three premises:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Individually they have rights&lt;/h4&gt;&lt;p&gt;To sell their shares, vote by &lt;em&gt;proxy&lt;/em&gt;, sue for damages, obtain information, and receive residual claims after liquidation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Collectively they have power&lt;/h4&gt;&lt;p&gt;To direct the course of the firm, promote collective action, and have key issues put to a vote (&lt;em&gt;proxy votes&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Institutional investors can be aggressive&lt;/h4&gt;&lt;p&gt;Pension funds, mutual funds and hedge funds push for changes in top management or for &lt;em&gt;stock buy-backs&lt;/em&gt; or &lt;em&gt;selloffs&lt;/em&gt; (divestiture of business units).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; &lt;em&gt;Proxy&lt;/em&gt;: an authorization by which a shareholder who does not attend the general meeting has another party vote on their behalf.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-in&quot; aria-labelledby=&quot;gb-in&quot; hidden&gt;
&lt;p&gt;The board is responsible for &lt;b&gt;managerial rewards and incentives&lt;/b&gt;, i.e. &lt;em&gt;contract-based outcomes&lt;/em&gt;: compensation contracts that align the interests of management and shareholders.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;It can require the CEO to become a &lt;b&gt;significant shareholder&lt;/b&gt; (see the lab above).&lt;/li&gt;&lt;li&gt;Salaries, bonuses and &lt;b&gt;stock options&lt;/b&gt; can be structured to reward superior performance and penalize poor performance.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Dismissal&lt;/b&gt; for poor performance must be a realistic threat.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;gloss&quot;&gt;Connection: these are the &lt;em&gt;rewards&lt;/em&gt; of Part IV applied to the top of the firm.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-du&quot; aria-labelledby=&quot;gb-du&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;CEO duality&lt;/b&gt; = the CEO is also the &lt;em&gt;chairman&lt;/em&gt; of the board. Two theories are opposed:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c2)&quot;&gt;&lt;h4&gt;Unity of command → yes to duality&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Clear focus.&lt;/li&gt;&lt;li&gt;Eliminates confusion and conflict.&lt;/li&gt;&lt;li&gt;Increases the firm’s responsiveness.&lt;/li&gt;&lt;li&gt;Fast decisions based on first-hand knowledge.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c3)&quot;&gt;&lt;h4&gt;Agency theory → separate the roles&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Protects against corruption or incompetence.&lt;/li&gt;&lt;li&gt;Eliminates conflicts of interest, especially over CEO succession.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; In short: if the person to be monitored chairs the body that monitors them, oversight is weakened. In exchange, speed is gained.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;External mechanisms&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 280&quot; role=&quot;img&quot; aria-label=&quot;The firm surrounded by five external governance mechanisms&quot;&gt;
&lt;g style=&quot;stroke:var(--rule);stroke-width:1.5&quot;&gt;&lt;line x1=&quot;350&quot; y1=&quot;140&quot; x2=&quot;350&quot; y2=&quot;40&quot;/&gt;&lt;line x1=&quot;350&quot; y1=&quot;140&quot; x2=&quot;130&quot; y2=&quot;100&quot;/&gt;&lt;line x1=&quot;350&quot; y1=&quot;140&quot; x2=&quot;570&quot; y2=&quot;100&quot;/&gt;&lt;line x1=&quot;350&quot; y1=&quot;140&quot; x2=&quot;170&quot; y2=&quot;230&quot;/&gt;&lt;line x1=&quot;350&quot; y1=&quot;140&quot; x2=&quot;530&quot; y2=&quot;230&quot;/&gt;&lt;/g&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;140&quot; r=&quot;48&quot; class=&quot;s5&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Firm&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:11px var(--sans)&quot;&gt;management&lt;/text&gt;
&lt;g style=&quot;font:13px var(--sans)&quot;&gt;
&lt;rect x=&quot;245&quot; y=&quot;14&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f5&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Market for corporate control&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;threat of takeover&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;78&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Auditors&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;verify the accounts&lt;/text&gt;
&lt;rect x=&quot;480&quot; y=&quot;78&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Banks and analysts&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;in-depth studies of the firm&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;208&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Regulatory bodies&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;mandatory financial disclosure&lt;/text&gt;
&lt;rect x=&quot;420&quot; y=&quot;208&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Media and activists&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;shape public perception&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 43: the controls that come from outside the firm.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;p&gt;Management performs poorly and little value is created.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;p&gt;Dissatisfied shareholders &lt;b&gt;sell&lt;/b&gt; their shares (the right to “sell” seen under shareholder activism).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;p&gt;The &lt;b&gt;share price falls&lt;/b&gt;: the firm becomes “cheap” relative to its potential.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;p&gt;The likelihood of a &lt;b&gt;takeover&lt;/b&gt; increases: a &lt;em&gt;hostile raider&lt;/em&gt; buys control in order to manage the firm better and usually replaces management.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · Takeover constraint&lt;/span&gt;&lt;p&gt;The mere &lt;b&gt;fear&lt;/b&gt; of being acquired and replaced pushes managers to create value. The market for corporate control thus acts as an external discipline.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The expression “market for corporate control” was introduced by Henry Manne in 1965 (&lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/259000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal of Political Economy&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
