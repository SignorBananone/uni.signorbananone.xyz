&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;International corporate governance&lt;/h3&gt;
&lt;p&gt;Outside the United States and the United Kingdom, where share ownership is often dispersed, the perspective changes (slide 44).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 220&quot; role=&quot;img&quot; aria-label=&quot;Comparison: principal-agent conflict between dispersed shareholders and managers; principal-principal conflict between the controlling shareholder and minority shareholders&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar8&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;text x=&quot;170&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Principal – agent&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;typical of the US and UK&lt;/text&gt;
&lt;g class=&quot;s5&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;75&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;135&quot; cy=&quot;68&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;78&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;185&quot; cy=&quot;66&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;210&quot; cy=&quot;76&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;235&quot; cy=&quot;70&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;170&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;many dispersed shareholders&lt;/text&gt;
&lt;path d=&quot;M170 112 V 150&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar8)&quot; marker-end=&quot;url(#ar8)&quot; style=&quot;stroke:var(--ko);stroke-width:2&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;155&quot; width=&quot;120&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f2&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Manager&lt;/text&gt;
&lt;line x1=&quot;350&quot; y1=&quot;10&quot; x2=&quot;350&quot; y2=&quot;210&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;530&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Principal – principal&lt;/text&gt;
&lt;text x=&quot;530&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;concentrated or family ownership&lt;/text&gt;
&lt;circle cx=&quot;450&quot; cy=&quot;100&quot; r=&quot;30&quot; class=&quot;s5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 11px var(--sans)&quot;&gt;control&lt;/text&gt;
&lt;g class=&quot;s3&quot;&gt;&lt;circle cx=&quot;590&quot; cy=&quot;82&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;612&quot; cy=&quot;96&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;592&quot; cy=&quot;112&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;616&quot; cy=&quot;122&quot; r=&quot;8&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;602&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;minority shareholders&lt;/text&gt;
&lt;path d=&quot;M485 100 H 575&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar8)&quot; marker-end=&quot;url(#ar8)&quot; style=&quot;stroke:var(--ko);stroke-width:2&quot;/&gt;
&lt;text x=&quot;530&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 12.5px var(--serif)&quot;&gt;risk of expropriation of minority shareholders&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Principal–principal conflicts&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Concentrated&lt;/b&gt; or family &lt;b&gt;ownership&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;The controlling shareholder is motivated to expropriate &lt;b&gt;minority shareholders&lt;/b&gt; for personal gain.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Few external regulatory constraints.&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;An example of expropriation&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; The controlling shareholder has the company buy services at inflated prices from another firm they own. Value shifts to the controlling shareholder, while minority shareholders suffer a loss proportional to their stake.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The principal–principal perspective is systematized by Young, Peng, Ahlstrom, Bruton and Jiang (2008), who identify it as the central governance problem in emerging economies (&lt;a href=&quot;https://ideas.repec.org/a/bla/jomstd/v45y2008i1p196-220.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;). &lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt; In Italy, too, ownership is often concentrated or family-based, so this framework is highly relevant.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-assessment · Part V&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;According to the slides, on what premise is corporate governance based?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;That the CEO is always also the chairman&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;The separation between owners (shareholders) and management&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;That shareholders manage the firm directly&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Correct: without the separation of ownership and control there would be no alignment problem.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Which argument supports CEO duality?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;It removes the conflict of interest over succession&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Unity of command: clear focus and fast decisions&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;It protects against corruption and incompetence&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Right. The other two options are agency-theory arguments in favor of separating the roles.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Which of these is an &lt;em&gt;external&lt;/em&gt; governance mechanism?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Stock options for the CEO&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Director independence&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;The market for corporate control&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Yes. Stock options and board independence are internal mechanisms.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Explain the chain that leads to the takeover constraint.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Poor management → shareholders sell → the share price falls → a takeover becomes more likely → the fear of being acquired and replaced disciplines managers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between principal–agent and principal–principal conflicts?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The first sets (dispersed) owners against managers. The second sets two groups of owners against each other: the controlling shareholder (often a family) and the minority shareholders, and it is fostered by concentrated ownership and few external constraints.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Link governance and behavioral control.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The managerial rewards of governance are the rewards of behavioral control applied to the CEO. A board that sets limits and standards recalls boundaries. Governance, informational control and behavioral control are the three mechanisms of strategic control.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== FONTI ========== --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;border-bottom:none&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;External sources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Texts, authors and standards cited in the slides or underlying their concepts. Everything below comes from web research: &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;. Where the slide does not explicitly name the author, I say so.&lt;/p&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Dess, McNamara, Eisner, Sauerwald — &lt;em&gt;Strategic Management: Creating Competitive Advantages&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;Strategy textbook; earlier editions co-authored with Lumpkin. &lt;a href=&quot;https://www.mheducation.com/highered/product/Strategic-Management-Creating-Competitive-Advantages-Dess.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher’s page&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;The slides are © McGraw Hill, and the section on strategic control follows the structure of this textbook’s chapter “Strategic Control and Corporate Governance” (traditional vs contemporary, informational and behavioral control, governance). The attribution is my own inference from the content. It matters because this is the reference text for Parts III–V.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher’s page&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;A widely used managerial accounting textbook. Planning, controlling and decision making, the seven differences between financial and managerial accounting, and the What/Who/How questions match its approach: this too is my own inference, as the slide only states © McGraw Hill. Useful for going deeper into Part I and make-or-buy decisions.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Robert Simons — &lt;em&gt;Levers of Control&lt;/em&gt; (Harvard Business School Press, 1995)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/business-and-management/business-performance-management/bpm-tools-templates-and-case-studies/levers-of-control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW summary&lt;/a&gt; · see also Simons, “Control in the Age of Empowerment”, &lt;em&gt;HBR&lt;/em&gt;, 1995&lt;/p&gt;
&lt;p&gt;Proposes four levers of control: belief, boundary, diagnostic and interactive systems. The phrase “delineate the acceptable domain of activity” on the boundaries slide comes from here (the sources found are secondary). It is the most widely used theoretical framework in empirical studies of control systems.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Chris Argyris — “Double Loop Learning in Organizations”, &lt;em&gt;Harvard Business Review&lt;/em&gt;, 1977&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;HBR 55(5), pp. 115–125 · &lt;a href=&quot;https://en.wikipedia.org/wiki/Double-loop_learning&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;overview entry&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Distinguishes single-loop learning (correcting actions) from double-loop learning (questioning objectives and assumptions). It explains the limitation of traditional strategic control mentioned on slide 25.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Dorothy Leonard-Barton — “Core capabilities and core rigidities”, &lt;em&gt;Strategic Management Journal&lt;/em&gt;, 1992&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;SMJ 13, pp. 111–125 · &lt;a href=&quot;https://acawiki.org/Core_capabilities_and_core_rigidities:_A_paradox_in_managing_new_product_development&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AcaWiki summary&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Based on 20 projects in 5 firms (including Ford and Hewlett-Packard), it shows that core capabilities, rooted also in values, can hinder innovation. It is the origin of the term &lt;em&gt;core rigidities&lt;/em&gt; used on the culture slide.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Adolf Berle, Gardiner Means — &lt;em&gt;The Modern Corporation and Private Property&lt;/em&gt; (1932)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.routledge.com/The-Modern-Corporation-and-Private-Property/Berle-Means/p/book/9780887388873&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher’s page (Routledge)&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;The classic work on the separation of ownership and control in large corporations: dispersed, passive shareholders and managers whose interests may diverge. It is the premise of corporate governance stated in the slides.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Michael Jensen, William Meckling — “Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure” (1976)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Financial Economics&lt;/em&gt; 3(4), pp. 305–360 · &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Founds modern agency theory and defines agency costs (monitoring, bonding, residual loss). It is among the most cited academic articles in business economics. It explains why boards tie CEO compensation to share value.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Henry Manne — “Mergers and the Market for Corporate Control” (1965)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Political Economy&lt;/em&gt; 73, pp. 110–120 · &lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/259000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Chicago Press&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Introduces the expression “market for corporate control”: the market for acquisitions disciplines inefficient managers. It underpins the takeover constraint on slide 43.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Young, Peng, Ahlstrom, Bruton, Jiang — “Corporate Governance in Emerging Economies: A Review of the Principal–Principal Perspective” (2008)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Management Studies&lt;/em&gt; 45(1), pp. 196–220 · &lt;a href=&quot;https://ideas.repec.org/a/bla/jomstd/v45y2008i1p196-220.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;A review linking principal–principal conflicts to concentrated ownership, family control, business groups and weak protection of minority shareholders. It is the reference for slide 44.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS — International Financial Reporting Standards (IASB)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/supporting-implementation/supporting-materials-by-ifrs-standards/conceptual-framework-for-financial-reporting.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Conceptual Framework&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;The international accounting standards cited in difference no. 6. The &lt;em&gt;Conceptual Framework&lt;/em&gt;, revised in 2018, explains the purpose of financial reporting for external users.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;US GAAP — FASB Accounting Standards Codification&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://asc.fasb.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;asc.fasb.org&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Since 2009 the Codification has been the single authoritative source of US GAAP (excluding SEC guidance), organized into about 90 topics. It is the other half of the “GAAP/IFRS” in the slides.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;G20/OECD Principles of Corporate Governance (2023)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://doi.org/10.1787/ed750b30-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD Publishing&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Not cited in the slides, but they are the international reference standard: shareholder rights, the role of the board, disclosure, institutional investors and, since 2023, sustainability. Useful for seeing all the mechanisms of Part V in normative form.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
