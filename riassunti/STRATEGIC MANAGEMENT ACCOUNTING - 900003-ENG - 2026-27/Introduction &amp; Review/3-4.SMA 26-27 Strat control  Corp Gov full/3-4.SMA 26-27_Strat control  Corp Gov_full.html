&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;p&gt;Il management gestisce male e il valore creato è basso.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;p&gt;Gli azionisti insoddisfatti &lt;b&gt;vendono&lt;/b&gt; le azioni (il diritto di «vendere» visto nello shareholder activism).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;p&gt;Il &lt;b&gt;prezzo dell&#x27;azione scende&lt;/b&gt;: l&#x27;impresa diventa «a buon mercato» rispetto al suo potenziale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;p&gt;Aumenta la probabilità di un &lt;b&gt;takeover&lt;/b&gt; (acquisizione): un &lt;em&gt;hostile raider&lt;/em&gt; compra il controllo per gestire meglio l&#x27;impresa e, di solito, sostituisce il management.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · Takeover constraint&lt;/span&gt;&lt;p&gt;La sola &lt;b&gt;paura&lt;/b&gt; di essere acquisiti e sostituiti spinge i manager a creare valore. Il mercato del controllo societario funziona quindi da disciplina esterna.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;espressione «market for corporate control» è stata introdotta da Henry Manne nel 1965 (&lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/259000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal of Political Economy&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;International corporate governance&lt;/h3&gt;
&lt;p&gt;Fuori da Stati Uniti e Regno Unito, dove l&#x27;azionariato è spesso disperso, la prospettiva cambia (slide 44).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 220&quot; role=&quot;img&quot; aria-label=&quot;Confronto: conflitto principal-agent tra azionisti dispersi e manager; conflitto principal-principal tra azionista di controllo e azionisti di minoranza&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar8&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;text x=&quot;170&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Principal – agent&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;tipico di USA e UK&lt;/text&gt;
&lt;g class=&quot;s5&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;75&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;135&quot; cy=&quot;68&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;78&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;185&quot; cy=&quot;66&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;210&quot; cy=&quot;76&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;235&quot; cy=&quot;70&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;170&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;molti azionisti dispersi&lt;/text&gt;
&lt;path d=&quot;M170 112 V 150&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar8)&quot; marker-end=&quot;url(#ar8)&quot; style=&quot;stroke:var(--ko);stroke-width:2&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;155&quot; width=&quot;120&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f2&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Manager&lt;/text&gt;
&lt;line x1=&quot;350&quot; y1=&quot;10&quot; x2=&quot;350&quot; y2=&quot;210&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;530&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Principal – principal&lt;/text&gt;
&lt;text x=&quot;530&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;proprietà concentrata o familiare&lt;/text&gt;
&lt;circle cx=&quot;450&quot; cy=&quot;100&quot; r=&quot;30&quot; class=&quot;s5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 11px var(--sans)&quot;&gt;controllo&lt;/text&gt;
&lt;g class=&quot;s3&quot;&gt;&lt;circle cx=&quot;590&quot; cy=&quot;82&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;612&quot; cy=&quot;96&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;592&quot; cy=&quot;112&quot; r=&quot;8&quot;/&gt;&lt;circle cx=&quot;616&quot; cy=&quot;122&quot; r=&quot;8&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;602&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;minority shareholders&lt;/text&gt;
&lt;path d=&quot;M485 100 H 575&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar8)&quot; marker-end=&quot;url(#ar8)&quot; style=&quot;stroke:var(--ko);stroke-width:2&quot;/&gt;
&lt;text x=&quot;530&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 12.5px var(--serif)&quot;&gt;rischio di espropriazione delle minoranze&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Principal–principal conflicts&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Proprietà concentrata&lt;/b&gt; o familiare.&lt;/li&gt;&lt;li&gt;L&#x27;azionista di controllo è motivato a espropriare i &lt;b&gt;minority shareholders&lt;/b&gt; (azionisti di minoranza) per guadagno personale.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Pochi vincoli regolamentari esterni.&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Un esempio di espropriazione&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; L&#x27;azionista di controllo fa comprare alla società servizi da un&#x27;altra impresa di sua proprietà a prezzi gonfiati. Il valore passa a lui, mentre i minori subiscono una perdita proporzionale alla loro quota.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; La prospettiva principal–principal è sistematizzata da Young, Peng, Ahlstrom, Bruton e Jiang (2008), che la indicano come il problema centrale della governance nelle economie emergenti (&lt;a href=&quot;https://ideas.repec.org/a/bla/jomstd/v45y2008i1p196-220.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;). &lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Anche in Italia la proprietà è spesso concentrata o familiare, quindi questo schema è molto pertinente.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte V&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Su quale presupposto si fonda la corporate governance secondo le slide?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Che il CEO sia sempre anche chairman&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;La separazione tra proprietari (shareholders) e management&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Che gli azionisti gestiscano direttamente l&#x27;impresa&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Esatto: senza separazione tra proprietà e controllo non ci sarebbe un problema di allineamento.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Quale argomento sostiene la CEO duality?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Rimuove il conflitto di interessi sulla successione&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Unity of command: focus chiaro e decisioni rapide&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Protegge da corruzione e incompetenza&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Giusto. Le altre due opzioni sono argomenti dell&#x27;agency theory a favore della separazione.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Quale di questi è un meccanismo di governance &lt;em&gt;esterno&lt;/em&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Stock options al CEO&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Indipendenza degli amministratori&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;Il market for corporate control&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Sì. Stock options e indipendenza del board sono meccanismi interni.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Spiega la catena che porta al takeover constraint.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Cattiva gestione → gli azionisti vendono → il prezzo dell&#x27;azione scende → un takeover diventa più probabile → la paura di essere acquisiti e sostituiti disciplina i manager.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza tra conflitto principal–agent e principal–principal?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il primo oppone proprietari (dispersi) e manager. Il secondo oppone due gruppi di proprietari: l&#x27;azionista di controllo (spesso una famiglia) e le minoranze, ed è favorito da proprietà concentrata e pochi vincoli esterni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Collega governance e behavioral control.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le managerial rewards della governance sono i rewards del behavioral control applicati al CEO. Il board che fissa limiti e standard ricorda i boundaries. Governance, informational e behavioral control sono i tre meccanismi dello strategic control.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== FONTI ========== --&gt;

&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Testi, autori e norme citati nelle slide o alla base dei loro concetti. Tutto ciò che segue viene dalla ricerca web: &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;. Dove la slide non nomina esplicitamente l&#x27;autore, lo indico.&lt;/p&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dess, McNamara, Eisner, Sauerwald — &lt;em&gt;Strategic Management: Creating Competitive Advantages&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;Manuale di strategia; nelle edizioni precedenti con Lumpkin. &lt;a href=&quot;https://www.mheducation.com/highered/product/Strategic-Management-Creating-Competitive-Advantages-Dess.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;editore&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Le slide sono © McGraw Hill e la parte sul controllo strategico riprende la struttura del capitolo «Strategic Control and Corporate Governance» di questo manuale (traditional vs contemporary, informational e behavioral control, governance). L&#x27;attribuzione è una mia deduzione dai contenuti. Conta perché è il testo di riferimento per le Parti III–V.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer — &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/Managerial-Accounting-Garrison.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;editore&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Manuale molto diffuso di contabilità direzionale. Planning, controlling e decision making, le sette differenze tra financial e managerial accounting e le domande What/Who/How corrispondono alla sua impostazione: anche questa è una mia deduzione, la slide indica solo © McGraw Hill. Utile per approfondire la Parte I e il make or buy.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Robert Simons — &lt;em&gt;Levers of Control&lt;/em&gt; (Harvard Business School Press, 1995)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/business-and-management/business-performance-management/bpm-tools-templates-and-case-studies/levers-of-control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi ICAEW&lt;/a&gt; · vedi anche Simons, «Control in the Age of Empowerment», &lt;em&gt;HBR&lt;/em&gt;, 1995&lt;/p&gt;
&lt;p&gt;Propone quattro leve di controllo: belief, boundary, diagnostic e interactive systems. Il «delineate the acceptable domain of activity» della slide sui boundaries viene da qui (le fonti trovate sono secondarie). È il quadro teorico più usato negli studi empirici sui sistemi di controllo.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Chris Argyris — «Double Loop Learning in Organizations», &lt;em&gt;Harvard Business Review&lt;/em&gt;, 1977&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;HBR 55(5), pp. 115–125 · &lt;a href=&quot;https://en.wikipedia.org/wiki/Double-loop_learning&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;voce di sintesi&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Distingue il single-loop learning (correggere le azioni) dal double-loop learning (mettere in discussione obiettivi e presupposti). Spiega il limite del controllo strategico tradizionale citato in slide 25.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dorothy Leonard-Barton — «Core capabilities and core rigidities», &lt;em&gt;Strategic Management Journal&lt;/em&gt;, 1992&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;SMJ 13, pp. 111–125 · &lt;a href=&quot;https://acawiki.org/Core_capabilities_and_core_rigidities:_A_paradox_in_managing_new_product_development&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi AcaWiki&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Basato su 20 progetti in 5 imprese (tra cui Ford e Hewlett-Packard), mostra che le capacità distintive, radicate anche nei valori, possono ostacolare l&#x27;innovazione. È l&#x27;origine del termine &lt;em&gt;core rigidities&lt;/em&gt; usato nella slide sulla cultura.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Adolf Berle, Gardiner Means — &lt;em&gt;The Modern Corporation and Private Property&lt;/em&gt; (1932)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.routledge.com/The-Modern-Corporation-and-Private-Property/Berle-Means/p/book/9780887388873&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;editore (Routledge)&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Il classico sulla separazione tra proprietà e controllo nelle grandi società: azionisti dispersi e passivi, manager con interessi che possono divergere. È il presupposto della corporate governance indicato nelle slide.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Michael Jensen, William Meckling — «Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure» (1976)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Financial Economics&lt;/em&gt; 3(4), pp. 305–360 · &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Fonda l&#x27;agency theory moderna e definisce gli agency costs (monitoring, bonding, residual loss). È tra gli articoli accademici di economia aziendale più citati. Spiega perché i board legano i compensi del CEO al valore delle azioni.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Henry Manne — «Mergers and the Market for Corporate Control» (1965)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Political Economy&lt;/em&gt; 73, pp. 110–120 · &lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/259000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Chicago Press&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Introduce l&#x27;espressione «market for corporate control»: il mercato delle acquisizioni disciplina i manager inefficienti. È la base del takeover constraint di slide 43.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Young, Peng, Ahlstrom, Bruton, Jiang — «Corporate Governance in Emerging Economies: A Review of the Principal–Principal Perspective» (2008)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;em&gt;Journal of Management Studies&lt;/em&gt; 45(1), pp. 196–220 · &lt;a href=&quot;https://ideas.repec.org/a/bla/jomstd/v45y2008i1p196-220.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Rassegna che lega i conflitti principal–principal a proprietà concentrata, controllo familiare, gruppi e scarsa tutela delle minoranze. È il riferimento della slide 44.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS — International Financial Reporting Standards (IASB)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/supporting-implementation/supporting-materials-by-ifrs-standards/conceptual-framework-for-financial-reporting.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Conceptual Framework&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Principi contabili internazionali citati nella differenza n. 6. Il &lt;em&gt;Conceptual Framework&lt;/em&gt; rivisto nel 2018 spiega a che cosa serve il financial reporting per gli utenti esterni.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;US GAAP — FASB Accounting Standards Codification&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://asc.fasb.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;asc.fasb.org&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Dal 2009 la Codification è l&#x27;unica fonte autorevole dei GAAP statunitensi (esclusa la guida SEC), organizzata in circa 90 topic. È l&#x27;altra metà del «GAAP/IFRS» delle slide.&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;G20/OECD Principles of Corporate Governance (2023)&lt;/h4&gt;
&lt;p class=&quot;cite&quot;&gt;&lt;a href=&quot;https://doi.org/10.1787/ed750b30-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD Publishing&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Non citati nelle slide, ma sono lo standard internazionale di riferimento: diritti degli azionisti, ruolo del board, disclosure, investitori istituzionali e, dal 2023, sostenibilità. Utili per vedere tutti i meccanismi della Parte V in forma normativa.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
