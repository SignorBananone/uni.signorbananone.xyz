&lt;main&gt;
&lt;!-- ========== PARTE I ========== --&gt;
&lt;section class=&quot;part p1&quot; id=&quot;p1&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;I&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 3–9&lt;/div&gt;&lt;h2&gt;Financial e managerial accounting&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;La lezione apre con una domanda: &lt;em&gt;che cos&#x27;è l&#x27;accounting?&lt;/em&gt; Prima di parlare di controllo strategico bisogna capire quali informazioni servono e a chi.&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Si occupa di &lt;em&gt;registrare, stimare, organizzare, sintetizzare e comunicare&lt;/em&gt; (recording, estimating, organizing, summarizing, reporting) dati operativi e finanziari.&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Financial accounting&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;gloss&quot;&gt;(contabilità generale / bilancio)&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Comunica informazioni finanziarie a &lt;b&gt;soggetti esterni&lt;/b&gt;: &lt;em&gt;stockholders&lt;/em&gt; (azionisti), &lt;em&gt;creditors&lt;/em&gt; (creditori, es. banche), &lt;em&gt;regulators&lt;/em&gt; (autorità di vigilanza).&lt;/p&gt;&lt;p&gt;Output: bilanci pubblicati e altri report finanziari.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Managerial accounting&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;gloss&quot;&gt;(contabilità direzionale / analitica)&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Fornisce informazioni ai &lt;b&gt;manager interni&lt;/b&gt; perché possano &lt;em&gt;formulate plans&lt;/em&gt; (pianificare), &lt;em&gt;control operations&lt;/em&gt; (controllare la gestione) e &lt;em&gt;make decisions&lt;/em&gt; (decidere).&lt;/p&gt;&lt;p&gt;Output: budget, report per segmento, analisi di costo, report di performance.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 290&quot; role=&quot;img&quot; aria-label=&quot;Un unico accounting system alimenta il managerial accounting per gli utenti interni e il financial accounting per gli utenti esterni&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar1&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

&lt;text x=&quot;170&quot; y=&quot;202&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;decisioni, pianificazione,&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;controllo della gestione&lt;/text&gt;
&lt;rect x=&quot;450&quot; y=&quot;152&quot; width=&quot;280&quot; height=&quot;86&quot; rx=&quot;12&quot; fill=&quot;none&quot; style=&quot;stroke:var(--c1);stroke-width:1.5&quot;/&gt;
&lt;text x=&quot;590&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;s1&quot; style=&quot;font:600 16px var(--serif)&quot;&gt;Financial accounting&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;202&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;bilanci pubblicati e&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;altri report finanziari&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;INTERNAL USERS&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;EXTERNAL USERS&lt;/text&gt;

&lt;h3&gt;Le sette differenze chiave&lt;/h3&gt;
&lt;p&gt;La slide 8 propone la tabella vuota come esercizio. Prova a ricordare le risposte: premi &lt;b&gt;Nascondi&lt;/b&gt;, poi clicca ogni cella per scoprirla.&lt;/p&gt;
&lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;hideBtn&quot; aria-pressed=&quot;false&quot;&gt;Nascondi le risposte&lt;/button&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;reveal&quot; id=&quot;seven&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial accounting&lt;/th&gt;&lt;th&gt;Managerial accounting&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;1. Users&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Persone &lt;b&gt;esterne&lt;/b&gt; che prendono decisioni finanziarie&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Manager&lt;/b&gt; che pianificano e controllano l&#x27;organizzazione&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;2. Time focus&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Prospettiva &lt;b&gt;storica&lt;/b&gt; (cosa è successo)&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;Enfasi sul &lt;b&gt;futuro&lt;/b&gt; (cosa faremo)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;3. Verifiability vs relevance&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Oggettività e &lt;b&gt;verificabilità&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Rilevanza&lt;/b&gt; per la decisione&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;4. Precision vs timeliness&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Precisione&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Tempestività&lt;/b&gt;: meglio un dato approssimato oggi che uno perfetto fra tre mesi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;5. Subject&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Report sull&#x27;&lt;b&gt;intera azienda&lt;/b&gt; (companywide)&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Segment reports&lt;/b&gt; e specifici &lt;b&gt;cost objects&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;6. Rules&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;Deve seguire &lt;b&gt;GAAP/IFRS&lt;/b&gt; e formati prescritti&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Non&lt;/b&gt; vincolata a GAAP/IFRS né a formati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;7. Requirement&lt;/th&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Obbligatoria&lt;/b&gt; per i report esterni&lt;/td&gt;&lt;td class=&quot;ans&quot;&gt;&lt;b&gt;Non&lt;/b&gt; obbligatoria&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Parole che le slide danno per scontate&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;GAAP&lt;/b&gt; (&lt;em&gt;Generally Accepted Accounting Principles&lt;/em&gt;): i principi contabili statunitensi. &lt;b&gt;IFRS&lt;/b&gt; (&lt;em&gt;International Financial Reporting Standards&lt;/em&gt;): i principi internazionali dello IASB, obbligatori in UE per i bilanci consolidati delle società quotate. Vedi «Per approfondire».&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Segment report&lt;/b&gt;: un conto economico per una parte dell&#x27;azienda (linea di prodotto, area geografica, canale, divisione).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Cost object&lt;/b&gt; (oggetto di costo): qualsiasi cosa di cui si vuole conoscere il costo, come un prodotto, un cliente, un reparto o un progetto.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Cost accounting system&lt;/b&gt;: il sistema che rileva e attribuisce i costi. Alimenta sia il bilancio (es. valutazione delle rimanenze) sia le analisi interne.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Il direttore commerciale chiede entro domani una stima, anche approssimata, del margine per cliente. Quale differenza è in gioco soprattutto?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Rules: deve seguire IFRS&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Precision vs timeliness e Subject: tempestività e un cost object specifico&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Requirement: è un report obbligatorio&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Esatto: serve in fretta (timeliness) ed è riferito a un oggetto specifico, il cliente. È tipico managerial accounting.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché il managerial accounting non deve seguire GAAP/IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché i suoi utenti sono interni: non servono comparabilità e tutela di terzi, ma informazioni rilevanti per decidere. Ogni azienda può costruire i report più utili per sé.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Financial accounting = passato, managerial = futuro: è una regola assoluta?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È un&#x27;&lt;em&gt;enfasi&lt;/em&gt;, non un confine netto (la slide dice «emphasis»). Anche il managerial accounting usa dati storici, per esempio per confrontare consuntivo e budget, ma lo scopo è orientare le scelte future.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE II ========== --&gt;
&lt;section class=&quot;part p2&quot; id=&quot;p2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;II&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 10–21&lt;/div&gt;&lt;h2&gt;Il lavoro del management: planning, controlling, decision making&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Il managerial accounting serve a tre attività (slide 10). Usa le linguette per esplorarle.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-plan&quot; id=&quot;tb-plan&quot;&gt;Planning&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-ctrl&quot; id=&quot;tb-ctrl&quot;&gt;Controlling&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-dec&quot; id=&quot;tb-dec&quot;&gt;Decision making&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-plan&quot; aria-labelledby=&quot;tb-plan&quot;&gt;
&lt;p&gt;&lt;b&gt;Planning&lt;/b&gt; (pianificazione) procede in tre passi:&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Establish goals, specify how goals will be achieved, develop budgets&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;1 · Establish goals&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;dove vogliamo arrivare&lt;/text&gt;
&lt;path d=&quot;M200 50 H 255&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;rect x=&quot;260&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;2 · Specify how&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;come raggiungere i goals&lt;/text&gt;
&lt;path d=&quot;M460 50 H 515&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;3 · Develop budgets&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;piano in numeri&lt;/text&gt;
&lt;text x=&quot;615&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 13px var(--serif)&quot;&gt;Budget = piano dettagliato per il futuro,&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:italic 13px var(--serif)&quot;&gt;espresso in termini quantitativi formali&lt;/text&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-ctrl&quot; aria-labelledby=&quot;tb-ctrl&quot; hidden&gt;
&lt;p&gt;La funzione di &lt;b&gt;control&lt;/b&gt; tradizionale &lt;em&gt;raccoglie feedback per assicurarsi che i piani vengano seguiti&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;Il feedback arriva sotto forma di &lt;b&gt;performance reports&lt;/b&gt;, che confrontano i risultati effettivi (&lt;em&gt;actual&lt;/em&gt;) con il &lt;em&gt;budget&lt;/em&gt;. La differenza si chiama &lt;b&gt;variance&lt;/b&gt; (scostamento) &lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;p style=&quot;text-align:center;font:400 1.15rem var(--serif)&quot;&gt;Variance = Actual − Budget&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Attenzione al segno: per i ricavi uno scostamento positivo è favorevole, per i costi è sfavorevole. Nella Parte III vedrai perché questo controllo &quot;a consuntivo&quot; non basta a livello strategico.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-dec&quot; aria-labelledby=&quot;tb-dec&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;Decision making&lt;/b&gt; = &lt;em&gt;scegliere fra alternative in competizione&lt;/em&gt;. Le domande tipiche sono tre:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;Cosa vendere&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Su quali prodotti concentrare il marketing?&lt;/li&gt;&lt;li&gt;Quali nuovi prodotti offrire?&lt;/li&gt;&lt;li&gt;Che prezzi fare?&lt;/li&gt;&lt;li&gt;Quali prodotti eliminare?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;Chi servire&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Su chi concentrare il marketing?&lt;/li&gt;&lt;li&gt;Chi iniziare a servire?&lt;/li&gt;&lt;li&gt;A chi chiedere un premium price o fare sconti?&lt;/li&gt;&lt;li&gt;Chi smettere di servire?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;How?&lt;/h4&gt;&lt;p class=&quot;gloss&quot;&gt;Come eseguire&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Come approvvigionarsi di parti e servizi?&lt;/li&gt;&lt;li&gt;Come espandere o ridurre la capacità?&lt;/li&gt;&lt;li&gt;Come migliorare efficienza ed efficacia?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Goals e objectives: sono la stessa cosa?&lt;/h3&gt;
&lt;p&gt;No (slide 12–13). Il &lt;b&gt;goal&lt;/b&gt; indica la direzione, l&#x27;&lt;b&gt;objective&lt;/b&gt; è un passo preciso e misurabile verso quella direzione.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;th&gt;Objective&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Definizione&lt;/th&gt;&lt;td&gt;Direzione e destinazione complessiva che aiuta a realizzare la vision&lt;/td&gt;&lt;td&gt;Azioni e passi esatti per raggiungere il goal&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Specificità&lt;/th&gt;&lt;td&gt;Intenzione generale&lt;/td&gt;&lt;td&gt;Specifico, preciso&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Ampiezza&lt;/th&gt;&lt;td&gt;Ampio, riguarda il tutto&lt;/td&gt;&lt;td&gt;Ristretto, una parte del tutto&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Esempio&lt;/th&gt;&lt;td&gt;Ampliare la base clienti internazionale&lt;/td&gt;&lt;td&gt;+28% clienti da UK, Australia e Germania nei prossimi 3 mesi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Misurazione&lt;/th&gt;&lt;td&gt;Difficile, spesso intangibile&lt;/td&gt;&lt;td&gt;Facile: deve essere misurabile e tangibile&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Orizzonte&lt;/th&gt;&lt;td&gt;Lungo termine&lt;/td&gt;&lt;td&gt;Medio-breve termine&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Un buon objective ha un indicatore, un valore target e una scadenza. Molti testi lo riassumono con l&#x27;acronimo &lt;em&gt;SMART&lt;/em&gt; (Specific, Measurable, Achievable, Relevant, Time-bound), che però non compare nelle slide.&lt;/p&gt;

&lt;h3&gt;Caso GreenBite Café&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Il problema&lt;/span&gt;&lt;p&gt;Un piccolo locale vicino al campus vende pasti sani, smoothie e caffè. La vision è diventare «la scelta di cibo sano più affidabile per studenti e giovani professionisti della città».&lt;/p&gt;&lt;p&gt;L&#x27;azienda è cresciuta in fretta, ma il servizio a pranzo è lento, gli sprechi alimentari aumentano e i dipendenti non sanno quale sia la priorità: velocità, qualità, sostenibilità o profitto?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · La frase del fondatore&lt;/span&gt;&lt;p style=&quot;font:italic 1.2rem var(--serif)&quot;&gt;«Vogliamo che GreenBite Café diventi un&#x27;attività sostenibile e profittevole che i clienti amano.»&lt;/p&gt;&lt;p&gt;Goal o objective?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · È un goal&lt;/span&gt;&lt;p&gt;È ampia e descrive la direzione generale, ma &lt;b&gt;non è misurabile&lt;/b&gt;: non dice di quanto debba crescere la redditività, come si misuri la sostenibilità né entro quando debba migliorare la soddisfazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Dal goal agli objectives&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Customer satisfaction&lt;/b&gt;: punteggio medio da 4,1 a 4,5 su 5 entro sei mesi, oppure −20% di reclami mensili entro tre mesi.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Profitability&lt;/b&gt;: −8% di costo mensile degli ingredienti senza cambiare la qualità.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Food waste&lt;/b&gt;: −25% di cibo invenduto giornaliero entro quattro mesi.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Service efficiency&lt;/b&gt;: almeno il 90% degli ordini a pranzo servito entro 10 minuti.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Employee skills&lt;/b&gt;: formare tutti i dipendenti sulle procedure anti-spreco entro fine del mese prossimo.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · Il ruolo del management accountant&lt;/span&gt;&lt;p&gt;Tradurre l&#x27;affermazione generale in objectives che guidino &lt;b&gt;planning&lt;/b&gt; (budget per ingredienti e personale), &lt;b&gt;budgeting&lt;/b&gt; e &lt;b&gt;performance evaluation&lt;/b&gt;, cioè confrontare i valori effettivi con i target. È il ponte fra la Parte I e la Parte III.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab sorter&quot; id=&quot;sorter&quot;&gt;
&lt;h4&gt;Esercizio: goal o objective?&lt;/h4&gt;
&lt;ul&gt;
&lt;li data-k=&quot;g&quot;&gt;&lt;span&gt;Diventare un punto di riferimento per la ristorazione sostenibile&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Ridurre gli scarti di imballaggio del 15% entro dicembre&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Aprire un secondo punto vendita entro 12 mesi con almeno 150 coperti al giorno&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;g&quot;&gt;&lt;span&gt;Essere un posto in cui le persone amano lavorare&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-k=&quot;o&quot;&gt;&lt;span&gt;Portare il tempo medio di attesa sotto i 7 minuti nel prossimo trimestre&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot;&gt;Goal&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Objective&lt;/button&gt; &lt;span class=&quot;r&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;gloss&quot;&gt;Esempi costruiti per esercizio, non presenti nelle slide.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Decision making in pratica: make or buy&lt;/h3&gt;
&lt;p&gt;Esercizio delle slide 20–21: continuare a &lt;b&gt;produrre&lt;/b&gt; internamente un componente o &lt;b&gt;comprarlo&lt;/b&gt; da un fornitore estero? Le slide indicano due gruppi di fattori:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quantitativo&lt;/h4&gt;&lt;p&gt;Il &lt;b&gt;risparmio di costo&lt;/b&gt; potenziale che si ottiene comprando invece di produrre.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Qualitativo&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Strategy&lt;/b&gt;: se il componente è critico per la strategia, si può continuare a produrlo anche se costa di più.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Risks&lt;/b&gt;: se il fornitore può creare problemi di qualità che danneggiano i consumatori finali, i rischi possono superare il risparmio.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Corporate social responsibility&lt;/b&gt;: si può rinunciare all&#x27;outsourcing se causerebbe licenziamenti nello stabilimento nazionale.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot; id=&quot;mob&quot;&gt;
&lt;h4&gt;Laboratorio make or buy&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mkc&quot;&gt;Costo interno &lt;em&gt;evitabile&lt;/em&gt; per unità&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mkc&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;18&quot;&gt;&lt;output id=&quot;mkcO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;byp&quot;&gt;Prezzo del fornitore per unità&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;byp&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;bypO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vol&quot;&gt;Volume annuo (unità)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vol&quot; min=&quot;1000&quot; max=&quot;50000&quot; step=&quot;1000&quot; value=&quot;20000&quot;&gt;&lt;output id=&quot;volO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;toggles&quot;&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;s&quot;&gt;Componente critico per la strategia&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;r&quot;&gt;Rischio qualità del fornitore&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-q=&quot;c&quot;&gt;Comporterebbe licenziamenti&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; id=&quot;mobChart&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra costo totale make e buy&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;38&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Make&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;88&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Buy&lt;/text&gt;
&lt;rect id=&quot;barM&quot; x=&quot;60&quot; y=&quot;20&quot; height=&quot;28&quot; rx=&quot;4&quot; class=&quot;s2&quot;/&gt;
&lt;rect id=&quot;barB&quot; x=&quot;60&quot; y=&quot;70&quot; height=&quot;28&quot; rx=&quot;4&quot; class=&quot;s3&quot;/&gt;
&lt;text id=&quot;lblM&quot; y=&quot;40&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;&lt;/text&gt;
&lt;text id=&quot;lblB&quot; y=&quot;90&quot; class=&quot;tk&quot; style=&quot;font:13px var(--sans)&quot;&gt;&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;mobV&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Nel confronto contano solo i costi &lt;b&gt;evitabili&lt;/b&gt; (&lt;em&gt;avoidable/relevant costs&lt;/em&gt;), cioè quelli che spariscono smettendo di produrre. Le quote di costi fissi comuni, che restano comunque, non vanno considerate. Il modello è volutamente semplificato.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Quale delle seguenti è la definizione di budget data nelle slide?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Il report che confronta risultati effettivi e previsti&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Un piano dettagliato per il futuro, espresso di solito in termini quantitativi formali&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;La scelta fra alternative concorrenti&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Giusto. Il report di confronto è il performance report (controlling); la scelta fra alternative è il decision making.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;«Chi dovremmo smettere di servire?» appartiene a quale famiglia di decisioni?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;What should we be selling?&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Who should we be serving?&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;How should we execute?&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Sì: riguarda i clienti, quindi è una decisione «Who».&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché un&#x27;impresa potrebbe continuare a produrre un componente anche se comprarlo costa meno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Per tre motivi qualitativi: il componente è critico per la strategia (competenza da proteggere), il fornitore comporta rischi di qualità che possono danneggiare i consumatori, oppure ci sono ragioni di corporate social responsibility (evitare licenziamenti). Il calcolo del risparmio è necessario, ma non basta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE III ========== --&gt;
&lt;section class=&quot;part p3&quot; id=&quot;p3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;III&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 22–28&lt;/div&gt;&lt;h2&gt;Strategic control: dal modello tradizionale a quello contemporaneo&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Formulata la strategia, bisogna attuarla. Parte dell&#x27;attuazione consiste nel creare un meccanismo che &lt;b&gt;monitori e corregga la performance&lt;/b&gt;. Questo meccanismo deve essere &lt;b&gt;coerente&lt;/b&gt; (&lt;em&gt;consistent&lt;/em&gt;) con la strategia scelta. La domanda guida della slide 22 è: &lt;em&gt;come si fa a far andare tutti gli stakeholder nella direzione giusta?&lt;/em&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Strategic control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Monitorare la performance rispetto agli obiettivi strategici e intervenire con azioni correttive quando serve, attraverso sistemi efficaci. I meccanismi sono tre:&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;a class=&quot;card&quot; href=&quot;#p3-info&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Informational control&lt;/h4&gt;&lt;p&gt;Le informazioni su ambiente esterno e interno: la strategia è ancora quella giusta?&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#p4&quot; style=&quot;text-decoration:none;color:inherit;--c:var(--c4)&quot;&gt;&lt;h4&gt;Behavioral control&lt;/h4&gt;&lt;p&gt;Cultura, ricompense e limiti che orientano i comportamenti delle persone.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#p5&quot; style=&quot;text-decoration:none;color:inherit;--c:var(--c5)&quot;&gt;&lt;h4&gt;Corporate governance&lt;/h4&gt;&lt;p&gt;Il rapporto fra azionisti, board e management.&lt;/p&gt;&lt;/a&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Rispetto al «controlling» della Parte II, che verifica se il budget è stato rispettato, lo strategic control guarda più in alto: verifica se la strategia stessa funziona e se va cambiata.&lt;/p&gt;

&lt;h3&gt;Due modelli a confronto&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-trad&quot; id=&quot;tb-trad&quot;&gt;Traditional approach&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-cont&quot; id=&quot;tb-cont&quot;&gt;Contemporary approach&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-trad&quot; aria-labelledby=&quot;tb-trad&quot;&gt;
&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Modello sequenziale: formulate, implement, strategic control, con un anello di ritorno&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;40&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s4&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;1 · Formulate&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;strategie e goals&lt;/text&gt;
&lt;path d=&quot;M210 51 H 270&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;rect x=&quot;275&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s3&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;2 · Implement&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;attuare&lt;/text&gt;
&lt;path d=&quot;M445 51 H 505&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;rect x=&quot;510&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;3 · Strategic control&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:12px var(--sans)&quot;&gt;misura vs goals fissati&lt;/text&gt;
&lt;path d=&quot;M680 51 H 705 V 118 H 15 V 51 H 35&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;text x=&quot;360&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;feedback loop: solo alla fine, con lunghi ritardi&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;Il modello tradizionale è &lt;b&gt;sequenziale&lt;/b&gt;: si formulano le strategie e si fissano i goals, si attuano, infine si misura la performance rispetto ai goals &lt;em&gt;predeterminati&lt;/em&gt;. Il feedback torna alla formulazione solo alla fine del ciclo.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Lengthy time lags&lt;/b&gt;: tra azione, misura e correzione passa molto tempo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Single-loop learning&lt;/b&gt;: si correggono le azioni per raggiungere obiettivi che restano fissi, senza metterli in discussione.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;Va bene quando&lt;/b&gt;: l&#x27;ambiente è stabile e relativamente semplice, gli obiettivi si misurano con certezza e non servono misure di performance complesse.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;t-cont&quot; aria-labelledby=&quot;tb-cont&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 720 250&quot; role=&quot;img&quot; aria-label=&quot;Modello interattivo: formulate e implement collegati tra loro e con strategic control, tramite informational control e behavioral control&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;60&quot; y=&quot;20&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s4&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Formulate strategies&lt;/text&gt;
&lt;rect x=&quot;480&quot; y=&quot;20&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s3&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Implement strategies&lt;/text&gt;
&lt;rect x=&quot;270&quot; y=&quot;170&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;s2&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot; class=&quot;tp&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Strategic control&lt;/text&gt;
&lt;path d=&quot;M245 50 H 475&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;path d=&quot;M170 84 L 290 166&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;path d=&quot;M550 84 L 430 166&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar4)&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
&lt;text x=&quot;120&quot; y=&quot;138&quot; class=&quot;s3&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;Informational control&lt;/text&gt;
&lt;text x=&quot;120&quot; y=&quot;156&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;«doing the right things»&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;138&quot; class=&quot;s4&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;Behavioral control&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;156&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;«doing things right»&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;Nel modello contemporaneo formulazione, attuazione e controllo sono &lt;b&gt;altamente interattivi&lt;/b&gt;: si influenzano a vicenda in continuazione e non uno dopo l&#x27;altro.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Informational control&lt;/h4&gt;&lt;p&gt;L&#x27;organizzazione sta facendo &lt;b&gt;le cose giuste&lt;/b&gt; (&lt;em&gt;doing the right things&lt;/em&gt;)? Riguarda l&#x27;&lt;b&gt;efficacia&lt;/b&gt; della strategia.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c4)&quot;&gt;&lt;h4&gt;Behavioral control&lt;/h4&gt;&lt;p&gt;L&#x27;organizzazione sta facendo &lt;b&gt;le cose nel modo giusto&lt;/b&gt; (&lt;em&gt;doing things right&lt;/em&gt;) nell&#x27;attuare la strategia? Riguarda l&#x27;&lt;b&gt;esecuzione&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Servono entrambi&lt;/b&gt; (slide 27): una strategia sbagliata eseguita alla perfezione fallisce, e lo stesso vale per una strategia giusta eseguita male.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot; id=&quot;turb&quot;&gt;
&lt;h4&gt;Quale approccio si adatta al contesto?&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tu&quot;&gt;Turbolenza e complessità dell&#x27;ambiente&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tu&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;tuO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;me&quot;&gt;Facilità di misurare gli obiettivi&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;me&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;meO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;tuV&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;Semplificazione didattica dei criteri di slide 25: ambiente stabile e semplice e obiettivi misurabili con certezza favoriscono l&#x27;approccio tradizionale; negli altri casi serve quello contemporaneo.&lt;/p&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Single-loop e double-loop learning: la differenza in un&#x27;immagine&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; La distinzione viene da Chris Argyris (&lt;a href=&quot;https://en.wikipedia.org/wiki/Double-loop_learning&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Double-loop learning, Wikipedia&lt;/a&gt;; articolo originale: «Double Loop Learning in Organizations», &lt;em&gt;Harvard Business Review&lt;/em&gt;, set–ott 1977).&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Single loop corregge le azioni; double loop rimette in discussione anche obiettivi e presupposti&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar5&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Obiettivi e&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;presupposti&lt;/text&gt;
&lt;rect x=&quot;260&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Azioni&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;585&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Risultati&lt;/text&gt;
&lt;path d=&quot;M190 97 H 255&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path d=&quot;M430 97 H 495&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;path d=&quot;M585 124 C 585 160, 345 160, 345 128&quot; class=&quot;edge&quot; style=&quot;stroke:var(--c3);stroke-width:2&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;text x=&quot;465&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;s3&quot; style=&quot;font:italic 600 13px var(--serif)&quot;&gt;single loop: correggo le azioni&lt;/text&gt;
&lt;path d=&quot;M585 70 C 585 18, 105 18, 105 66&quot; class=&quot;edge&quot; style=&quot;stroke:var(--accent);stroke-width:2&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
&lt;text x=&quot;345&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;s5&quot; style=&quot;font:italic 600 13px var(--serif)&quot;&gt;double loop: ripenso obiettivi e presupposti&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;L&#x27;esempio classico è il termostato: quello «single loop» accende il riscaldamento quando la temperatura scende sotto i 20°; un sistema «double loop» si chiede se 20° sia davvero il valore giusto. Il controllo strategico tradizionale lavora sul primo anello; l&#x27;informational control del modello contemporaneo serve anche a percorrere il secondo.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;p3-info&quot;&gt;Informational control&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Informational control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Riguarda sia l&#x27;ambiente &lt;b&gt;interno&lt;/b&gt; sia quello &lt;b&gt;esterno&lt;/b&gt;. La domanda è: i goals e le strategie dell&#x27;organizzazione hanno ancora un &lt;em&gt;fit&lt;/em&gt; (coerenza) con l&#x27;ambiente strategico attuale?&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;L&#x27;impresa al centro, monitorata dall&#x27;interno e scrutata verso l&#x27;esterno&quot;&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;105&quot; fill=&quot;none&quot; style=&quot;stroke:var(--c3);stroke-dasharray:5 5;stroke-width:1.5&quot;/&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;52&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Impresa&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:11px var(--sans)&quot;&gt;goals + strategia&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; class=&quot;s3&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;ambiente interno&lt;/text&gt;
&lt;text x=&quot;40&quot; y=&quot;60&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;1 · Scan and monitor&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;80&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;l&#x27;ambiente esterno:&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;98&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;clienti, concorrenti,&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;116&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;tecnologia, norme&lt;/text&gt;
&lt;text x=&quot;490&quot; y=&quot;60&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--serif)&quot;&gt;2 · Continuously monitor&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;80&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;l&#x27;ambiente interno:&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;98&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;risorse, processi,&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;116&quot; class=&quot;tm&quot; style=&quot;font:13px var(--sans)&quot;&gt;performance&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le due «key issues» di slide 28. Gli esempi tra parentesi sono un&#x27;integrazione.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Un&#x27;azienda raggiunge ogni anno i target di costo del budget, ma la domanda per il suo prodotto sta crollando per una nuova tecnologia. Quale controllo è mancato?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Behavioral control&lt;/button&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Informational control&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Nessuno: i target sono stati raggiunti&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Esatto: l&#x27;azienda faceva bene le cose (doing things right), ma non più le cose giuste. Il fit con l&#x27;ambiente esterno si era rotto.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Che cosa significa «single-loop learning» nel modello tradizionale?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Si correggono le azioni rispetto a obiettivi fissati in partenza, senza ridiscuterli&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Si apprende una volta sola, all&#x27;inizio del ciclo&lt;/button&gt;
&lt;button class=&quot;opt&quot;&gt;Formulazione e attuazione si influenzano a vicenda&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Sì. L&#x27;ultima opzione descrive invece il modello contemporaneo.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Elenca le tre condizioni in cui l&#x27;approccio tradizionale è appropriato.&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;Ambiente stabile e relativamente semplice.&lt;/li&gt;&lt;li&gt;Obiettivi misurabili con certezza.&lt;/li&gt;&lt;li&gt;Poca necessità di misure di performance complesse.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché «servono entrambi» informational e behavioral control?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché coprono due modi diversi di fallire: scegliere la strategia sbagliata (efficacia) ed eseguire male quella giusta (esecuzione).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE IV ========== --&gt;
&lt;section class=&quot;part p4&quot; id=&quot;p4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;IV&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 29–35&lt;/div&gt;&lt;h2&gt;Behavioral control: culture, rewards, boundaries&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Behavioral control&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Si concentra sull&#x27;attuazione (&lt;em&gt;doing things right&lt;/em&gt;) e influenza le azioni dei dipendenti con tre leve che vanno &lt;b&gt;bilanciate&lt;/b&gt; fra loro: &lt;b&gt;culture&lt;/b&gt;, &lt;b&gt;rewards&lt;/b&gt; e &lt;b&gt;boundaries&lt;/b&gt;.&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Triangolo cliccabile: boundaries in alto, culture e rewards in basso, collegati da frecce doppie&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;path d=&quot;M275 115 L 165 210&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;path d=&quot;M365 115 L 475 210&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;path d=&quot;M200 262 H 440&quot; class=&quot;edge&quot; marker-start=&quot;url(#ar6)&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;bd&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;75&quot; r=&quot;62&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Boundaries&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;cu&quot;&gt;&lt;circle cx=&quot;140&quot; cy=&quot;262&quot; r=&quot;62&quot; class=&quot;f4&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;267&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Culture&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;rw&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;262&quot; r=&quot;62&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;267&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 16px var(--sans)&quot;&gt;Rewards&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;320&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;le tre leve si rafforzano (o si ostacolano) a vicenda&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot; id=&quot;bcPanel&quot;&gt;&lt;b&gt;Clicca un cerchio&lt;/b&gt; per vederne il riassunto.&lt;/div&gt;
&lt;div hidden&gt;
&lt;div data-info=&quot;cu&quot;&gt;&lt;b&gt;Culture.&lt;/b&gt; Un sistema di regole non scritte che orienta il comportamento dall&#x27;interno: le persone fanno la cosa giusta perché l&#x27;hanno fatta propria. &lt;a href=&quot;#cu&quot;&gt;Vai al dettaglio ↓&lt;/a&gt;&lt;/div&gt;
&lt;div data-info=&quot;rw&quot;&gt;&lt;b&gt;Rewards.&lt;/b&gt; Sistemi di ricompensa e programmi di incentivi: concentrano gli sforzi sulle priorità e motivano la performance individuale e di gruppo. &lt;a href=&quot;#rw&quot;&gt;Vai al dettaglio ↓&lt;/a&gt;&lt;/div&gt;
&lt;div data-info=&quot;bd&quot;&gt;&lt;b&gt;Boundaries.&lt;/b&gt; Limiti comunicati ai dipendenti che delimitano ciò che non si deve fare (codici di condotta, policy, regole). &lt;a href=&quot;#bd&quot;&gt;Vai al dettaglio ↓&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/figure&gt;

&lt;h3 id=&quot;cu&quot;&gt;Culture&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Organizational culture&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Un sistema di &lt;b&gt;shared values&lt;/b&gt; (valori condivisi: &lt;em&gt;che cosa è importante&lt;/em&gt;) e di &lt;b&gt;beliefs&lt;/b&gt; (convinzioni: &lt;em&gt;come funzionano le cose&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cosa fa&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Plasma le persone, le strutture organizzative e i sistemi di controllo.&lt;/li&gt;&lt;li&gt;Produce &lt;b&gt;behavioral norms&lt;/b&gt;: «the way we do things around here», il modo in cui qui si fanno le cose.&lt;/li&gt;&lt;li&gt;Fissa &lt;b&gt;confini impliciti&lt;/b&gt; su abbigliamento, questioni etiche e modo di condurre gli affari.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Una cultura forte…&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;aumenta l&#x27;&lt;b&gt;employee engagement&lt;/b&gt; (coinvolgimento dei dipendenti);&lt;/li&gt;&lt;li&gt;dà uno scopo e un&#x27;identità comuni;&lt;/li&gt;&lt;li&gt;&lt;b&gt;ma&lt;/b&gt; può creare &lt;b&gt;core rigidities&lt;/b&gt;: le abitudini che hanno fatto il successo diventano un freno al cambiamento.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Il concetto di &lt;em&gt;core rigidities&lt;/em&gt; viene da Dorothy Leonard-Barton (1992): le stesse capacità distintive di un&#x27;impresa, radicate anche nei suoi valori, possono ostacolare l&#x27;innovazione (&lt;a href=&quot;https://acawiki.org/Core_capabilities_and_core_rigidities:_A_paradox_in_managing_new_product_development&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi su AcaWiki&lt;/a&gt;).&lt;/p&gt;

&lt;h3 id=&quot;rw&quot;&gt;Rewards&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;Reward systems&lt;/b&gt; e programmi di incentivi (slide 32):&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;sono un mezzo potente per influenzare la cultura;&lt;/li&gt;&lt;li&gt;concentrano gli sforzi sui compiti prioritari;&lt;/li&gt;&lt;li&gt;motivano la performance individuale e collettiva;&lt;/li&gt;&lt;li&gt;possono essere un motivatore e un meccanismo di controllo efficaci.&lt;/li&gt;&lt;/ul&gt;

&lt;div class=&quot;lab&quot; id=&quot;rwlab&quot;&gt;
&lt;h4&gt;Checklist: il tuo sistema di ricompensa è efficace?&lt;/h4&gt;
&lt;p class=&quot;gloss&quot;&gt;Le sei caratteristiche di slide 33. Spunta quelle presenti in un sistema che conosci (lavoro, sport, associazione…).&lt;/p&gt;
&lt;div class=&quot;toggles&quot; style=&quot;flex-direction:column;align-items:flex-start&quot;&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Obiettivi chiari, ben compresi e ampiamente accettati&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Ricompense chiaramente legate a performance e comportamenti desiderati&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Misure di performance chiare e molto visibili&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Feedback tempestivo, chiaro e non ambiguo&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Sistema di compensi percepito come equo&lt;/button&gt;
&lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;Struttura flessibile, che si adatta ai cambiamenti&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 30&quot; role=&quot;img&quot; aria-label=&quot;Indicatore del numero di caratteristiche presenti&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;8&quot; width=&quot;600&quot; height=&quot;14&quot; rx=&quot;7&quot; style=&quot;fill:var(--rule)&quot;/&gt;&lt;rect id=&quot;rwBar&quot; x=&quot;0&quot; y=&quot;8&quot; width=&quot;0&quot; height=&quot;14&quot; rx=&quot;7&quot; class=&quot;s4&quot;/&gt;&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;rwV&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Che cosa succede se le ricompense premiano il comportamento sbagliato?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Le persone fanno ciò che viene misurato e premiato. Se a GreenBite si premia solo la velocità del servizio, la qualità o la riduzione degli sprechi possono peggiorare. Per questo le slide chiedono che le ricompense siano legate alla performance &lt;em&gt;e ai comportamenti desiderati&lt;/em&gt;, e che la struttura sia flessibile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;bd&quot;&gt;Boundaries&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Boundaries&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Limiti comunicati ai dipendenti che impediscono di perseguire progetti non accettabili. Descrivono in un certo senso ciò che &lt;em&gt;non&lt;/em&gt; è permesso fare nella ricerca di innovazioni e nuove direzioni di sviluppo (i rischi da evitare). Servono a «delineate the acceptable domain of activity for organizational participants», cioè a tracciare il campo di attività accettabile. Negli studi empirici compaiono come &lt;b&gt;codici di condotta, comportamenti etici e policy&lt;/b&gt;.&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; La citazione tra virgolette è riconducibile a Robert Simons e ai suoi &lt;em&gt;Levers of Control&lt;/em&gt; (1995), dove i &lt;em&gt;boundary systems&lt;/em&gt; sono una delle quattro leve di controllo insieme a belief, diagnostic e interactive systems (&lt;a href=&quot;https://www.icaew.com/technical/business-and-management/business-performance-management/bpm-tools-templates-and-case-studies/levers-of-control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;guida ICAEW&lt;/a&gt;).&lt;/p&gt;

&lt;h3&gt;Quando usare quale leva: i situational factors&lt;/h3&gt;
&lt;p&gt;Nella tabella di slide 35 i boundaries compaiono come &lt;b&gt;rules&lt;/b&gt; (regole scritte):&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Approccio&lt;/th&gt;&lt;th&gt;Situational factors&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Culture&lt;/b&gt;: regole non scritte che diventano un&#x27;influenza interiorizzata sul comportamento&lt;/td&gt;&lt;td&gt;Tipica delle organizzazioni professionali · alta autonomia · le norme sono la base del comportamento&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rules&lt;/b&gt;: linee guida scritte ed esplicite, vincoli esterni al comportamento&lt;/td&gt;&lt;td&gt;Output standardizzato · compiti ripetitivi e di routine · poco bisogno di innovazione e creatività&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rewards&lt;/b&gt;: sistemi di incentivi basati sulla performance&lt;/td&gt;&lt;td&gt;Output e performance facili da misurare · organizzazioni con &lt;em&gt;unrelated diversification&lt;/em&gt; (diversificazione in business non collegati) · rafforzano le altre leve&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Uno studio di architetti con professionisti molto autonomi e progetti sempre diversi. Leva principale?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot; data-ok&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Sì: organizzazione professionale, alta autonomia, comportamento guidato da norme condivise.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Una catena di montaggio con compiti ripetitivi e output standard. Leva principale?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Esatto: compiti di routine e poca necessità di creatività rendono adatte regole scritte ed esplicite.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-mcq&gt;&lt;p&gt;Una holding conglomerata con business non collegati (hotel, cemento, assicurazioni), ciascuno con risultati facilmente misurabili. Leva principale?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
&lt;button class=&quot;opt&quot;&gt;Culture&lt;/button&gt;&lt;button class=&quot;opt&quot;&gt;Rules&lt;/button&gt;&lt;button class=&quot;opt&quot; data-ok&gt;Rewards&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; data-fb=&quot;Corretto: unrelated diversification e output facile da misurare. È difficile avere una cultura comune o regole comuni a business così diversi.&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Una cultura forte ha solo vantaggi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: oltre a engagement, scopo e identità comuni, può introdurre &lt;b&gt;core rigidities&lt;/b&gt;, cioè resistenza al cambiamento quando l&#x27;ambiente richiede nuove strategie.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza tra culture e rules come leve di controllo?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La culture agisce dall&#x27;&lt;b&gt;interno&lt;/b&gt; con regole non scritte e interiorizzate. Le rules agiscono dall&#x27;&lt;b&gt;esterno&lt;/b&gt; con vincoli scritti ed espliciti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ========== PARTE V ========== --&gt;
&lt;section class=&quot;part p5&quot; id=&quot;p5&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;partnum&quot;&gt;V&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 36–44&lt;/div&gt;&lt;h2&gt;Corporate governance&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Il terzo meccanismo di strategic control. La slide 36 parte con una domanda, «what do we already know?», quindi è un argomento che il corso presuppone in parte già noto.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Corporate governance&lt;/b&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt;&lt;br&gt;Si occupa delle relazioni tra &lt;b&gt;shareholders&lt;/b&gt; (azionisti), &lt;b&gt;management&lt;/b&gt; guidato dal &lt;b&gt;CEO&lt;/b&gt; (&lt;em&gt;Chief Executive Officer&lt;/em&gt;, amministratore delegato) e &lt;b&gt;Board of Directors&lt;/b&gt; (consiglio di amministrazione). Presuppone la &lt;b&gt;separazione tra proprietà e gestione&lt;/b&gt; nella &lt;em&gt;corporation&lt;/em&gt; moderna (grande società per azioni) e si chiede come allineare le motivazioni dei manager con gli interessi degli azionisti e del board.&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Triangolo cliccabile: shareholders eleggono il board, il board nomina e controlla il CEO, il CEO gestisce e rende conto&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar7&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;tm&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;path d=&quot;M265 75 C 180 90, 140 140, 135 190&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;110&quot; class=&quot;edgelbl&quot;&gt;eleggono&lt;/text&gt;
&lt;path d=&quot;M215 245 H 420&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot;/&gt;&lt;text x=&quot;317&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; class=&quot;edgelbl&quot;&gt;nomina, valuta, remunera&lt;/text&gt;
&lt;path d=&quot;M500 190 C 490 140, 450 90, 375 75&quot; class=&quot;edge&quot; marker-end=&quot;url(#ar7)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;110&quot; class=&quot;edgelbl&quot;&gt;crea valore? rende conto&lt;/text&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;sh&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;30&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;Shareholders&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;proprietari · principal&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;bo&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;215&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f3&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;241&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;Board of Directors&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;vigila&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-show=&quot;ce&quot;&gt;&lt;rect x=&quot;425&quot; y=&quot;215&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;241&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;CEO e management&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font:12px var(--sans)&quot;&gt;gestiscono · agent&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;Clicca un attore&lt;/b&gt; per vederne il ruolo.&lt;/div&gt;
&lt;div hidden&gt;
&lt;div data-info=&quot;sh&quot;&gt;&lt;b&gt;Shareholders.&lt;/b&gt; Possiedono l&#x27;impresa ma, se sono molti e dispersi, non la gestiscono. Da singoli hanno diritti; insieme hanno potere (vedi shareholder activism).&lt;/div&gt;
&lt;div data-info=&quot;bo&quot;&gt;&lt;b&gt;Board of Directors.&lt;/b&gt; Rappresenta gli azionisti, discute la strategia, valuta il CEO e decide le ricompense del management. Il suo potere dipende dall&#x27;impegno e dall&#x27;indipendenza.&lt;/div&gt;
&lt;div data-info=&quot;ce&quot;&gt;&lt;b&gt;CEO e management.&lt;/b&gt; Hanno informazioni e potere decisionale quotidiano. Possono perseguire obiettivi propri (prestigio, compensi, benefit, crescita dimensionale) diversi dalla creazione di valore per gli azionisti.&lt;/div&gt;
&lt;/div&gt;
&lt;figcaption&gt;Le frecce sono un&#x27;integrazione: le slide elencano i tre attori senza disegnarne i rapporti.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Perché serve: agency theory&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; Le slide nominano l&#x27;&lt;b&gt;agency theory&lt;/b&gt; a proposito della CEO duality, ma la danno per scontata. Il &lt;b&gt;principal&lt;/b&gt; (l&#x27;azionista) affida un compito all&#x27;&lt;b&gt;agent&lt;/b&gt; (il manager), che ha più informazioni e interessi propri. Il risultato è un &lt;b&gt;conflitto principal–agent&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Jensen e Meckling (1976) chiamano &lt;b&gt;agency costs&lt;/b&gt; la somma di tre voci (&lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;):&lt;/p&gt;
&lt;p style=&quot;text-align:center;font:400 1.15rem var(--serif)&quot;&gt;Agency costs = monitoring costs + bonding costs + residual loss&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Monitoring: costi sostenuti dal principal per controllare l&#x27;agent (board, revisori, report). Bonding: costi sostenuti dall&#x27;agent per dare garanzie. Residual loss: la perdita di valore che rimane nonostante tutto.&lt;/p&gt;

&lt;div class=&quot;lab&quot; id=&quot;ag&quot;&gt;
&lt;h4&gt;Perché i board chiedono al CEO di possedere azioni&lt;/h4&gt;
&lt;p class=&quot;gloss&quot;&gt;Idea di Jensen e Meckling, semplificata. Il CEO spende 100.000 € dell&#x27;azienda in benefit privati (jet, uffici di lusso…). Quanto paga lui, e quanto gli altri azionisti?&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;al&quot;&gt;Quota del capitale posseduta dal CEO&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;al&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;alO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 600 70&quot; role=&quot;img&quot; aria-label=&quot;Ripartizione del costo dei benefit tra CEO e altri azionisti&quot;&gt;
&lt;rect id=&quot;agA&quot; x=&quot;0&quot; y=&quot;10&quot; height=&quot;34&quot; class=&quot;s2&quot;/&gt;&lt;rect id=&quot;agB&quot; y=&quot;10&quot; height=&quot;34&quot; class=&quot;s5&quot;/&gt;
&lt;text x=&quot;0&quot; y=&quot;62&quot; class=&quot;s2&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;paga il CEO&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;62&quot; text-anchor=&quot;end&quot; class=&quot;s5&quot; style=&quot;font:600 12px var(--sans)&quot;&gt;pagano gli altri azionisti&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;verdict&quot; id=&quot;agV&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I meccanismi interni&lt;/h3&gt;
&lt;p&gt;Quattro strumenti per allineare gli interessi di owners e managers (slide 38):&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;g-bo&quot; id=&quot;gb-bo&quot;&gt;Board of Directors&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-sa&quot; id=&quot;gb-sa&quot;&gt;Shareholder activism&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-in&quot; id=&quot;gb-in&quot;&gt;Rewards e incentivi&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g-du&quot; id=&quot;gb-du&quot;&gt;CEO duality&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-bo&quot; aria-labelledby=&quot;gb-bo&quot;&gt;
&lt;p&gt;Un board &lt;b&gt;efficace&lt;/b&gt; dovrebbe:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;avere membri attivi e critici, non semplici ratificatori;&lt;/li&gt;&lt;li&gt;discutere questioni strategiche orientate al futuro;&lt;/li&gt;&lt;li&gt;valutare il CEO rispetto a standard di performance elevati;&lt;/li&gt;&lt;li&gt;praticare la &lt;b&gt;director independence&lt;/b&gt; (indipendenza degli amministratori).&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Board dominato da outsider: pro&lt;/h4&gt;&lt;p&gt;Accesso a conoscenze più ampie; supervisione indipendente della strategia.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c4)&quot;&gt;&lt;h4&gt;…e contro&lt;/h4&gt;&lt;p&gt;Meno informazioni operative dirette; meno occasioni di relazione con i dirigenti che non siedono nel board, che restano così esclusi dalla visione strategica.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; &lt;em&gt;Outsider&lt;/em&gt; = amministratore non dipendente dell&#x27;azienda (non esecutivo); &lt;em&gt;insider&lt;/em&gt; = manager che siede anche nel board.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-sa&quot; aria-labelledby=&quot;gb-sa&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;Shareholder activism&lt;/b&gt; = azionisti che usano attivamente i propri diritti per influenzare l&#x27;impresa. Si basa su tre presupposti:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Da soli hanno diritti&lt;/h4&gt;&lt;p&gt;Vendere le azioni, votare per delega (&lt;em&gt;proxy&lt;/em&gt;), fare causa per danni, ottenere informazioni, ricevere i diritti residui dopo la liquidazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Insieme hanno potere&lt;/h4&gt;&lt;p&gt;Indirizzare il corso dell&#x27;impresa, promuovere azioni collettive, chiedere che temi chiave vengano messi ai voti (&lt;em&gt;proxy votes&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gli istituzionali possono essere aggressivi&lt;/h4&gt;&lt;p&gt;Fondi pensione, fondi comuni e hedge fund fanno pressione per cambiare il vertice o ottenere &lt;em&gt;stock buy-back&lt;/em&gt; (riacquisto di azioni proprie) o &lt;em&gt;selloff&lt;/em&gt; (cessione di rami d&#x27;azienda).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; &lt;em&gt;Proxy&lt;/em&gt;: delega con cui l&#x27;azionista che non partecipa all&#x27;assemblea fa votare un altro soggetto al suo posto.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-in&quot; aria-labelledby=&quot;gb-in&quot; hidden&gt;
&lt;p&gt;Il board è responsabile delle &lt;b&gt;managerial rewards and incentives&lt;/b&gt;, cioè &lt;em&gt;contract-based outcomes&lt;/em&gt;: contratti di remunerazione che allineano gli interessi di management e azionisti.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Può chiedere che il CEO diventi &lt;b&gt;azionista rilevante&lt;/b&gt; (vedi il laboratorio qui sopra).&lt;/li&gt;&lt;li&gt;Stipendi, bonus e &lt;b&gt;stock options&lt;/b&gt; si possono strutturare in modo da premiare la performance superiore e penalizzare quella scarsa.&lt;/li&gt;&lt;li&gt;Il &lt;b&gt;licenziamento&lt;/b&gt; per scarsa performance deve essere una minaccia realistica.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;gloss&quot;&gt;Collegamento: sono i &lt;em&gt;rewards&lt;/em&gt; della Parte IV applicati al vertice dell&#x27;impresa.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;g-du&quot; aria-labelledby=&quot;gb-du&quot; hidden&gt;
&lt;p&gt;&lt;b&gt;CEO duality&lt;/b&gt; = il CEO è anche presidente (&lt;em&gt;chairman&lt;/em&gt;) del board. Due teorie si contrappongono:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c2)&quot;&gt;&lt;h4&gt;Unity of command → sì alla duality&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Focus chiaro.&lt;/li&gt;&lt;li&gt;Elimina confusione e conflitti.&lt;/li&gt;&lt;li&gt;Aumenta la reattività dell&#x27;impresa.&lt;/li&gt;&lt;li&gt;Decisioni rapide basate su conoscenza diretta.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;--c:var(--c3)&quot;&gt;&lt;h4&gt;Agency theory → separare i ruoli&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Protegge da corruzione o incompetenza.&lt;/li&gt;&lt;li&gt;Elimina il conflitto di interessi, soprattutto sulla successione del CEO.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt; In sintesi: se chi deve essere controllato presiede l&#x27;organo che lo controlla, il controllo si indebolisce. In cambio si guadagna rapidità.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I meccanismi esterni&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 700 280&quot; role=&quot;img&quot; aria-label=&quot;L&#x27;impresa circondata da cinque meccanismi esterni di governance&quot;&gt;

&lt;rect x=&quot;60&quot; y=&quot;208&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Regulatory bodies&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;obbligo di disclosure finanziaria&lt;/text&gt;
&lt;rect x=&quot;420&quot; y=&quot;208&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f3&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot; class=&quot;tk&quot; style=&quot;font-weight:600&quot;&gt;Media e attivisti&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; class=&quot;tm&quot; style=&quot;font-size:11px&quot;&gt;influenzano la percezione pubblica&lt;/text&gt;

&lt;/svg&gt;
&lt;figcaption&gt;Slide 43: i controlli che vengono da fuori dell&#x27;impresa.&lt;/figcaption&gt;
