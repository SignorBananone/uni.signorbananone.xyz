&lt;script&gt;
(function(){
  var fmt=window.__fmt,$=function(id){return document.getElementById(id)};
  var usd=function(n,d){return &#x27;$&#x27;+fmt(n,d)};
  // laboratorio cost object (Quinonez, Q15). livello: 0 reparto, 1 negozio, 2 società
  var items=[[&quot;Corporate headquarters building lease&quot;,77000,2],[&quot;Cosmetics Dept. sales commissions – Northridge&quot;,4000,0],[&quot;Corporate legal office salaries&quot;,59000,2],[&quot;Store manager&#x27;s salary – Northridge&quot;,11000,1],[&quot;Heating – Northridge&quot;,10000,1],[&quot;Cosmetics Dept. cost of sales – Northridge&quot;,37000,0],[&quot;Central warehouse lease cost&quot;,16000,2],[&quot;Store security – Northridge&quot;,12000,1],[&quot;Cosmetics Dept. manager&#x27;s salary – Northridge&quot;,4000,0]];
  var notes=[&quot;Per il reparto Cosmetics sono diretti solo i suoi costi: 45.000 (è il distrattore c della Q15). Riscaldamento, sicurezza e direttore del negozio sono comuni a tutti i reparti.&quot;,&quot;Per il negozio Northridge sono diretti tutti i costi del negozio e dei suoi reparti: i non diretti sono 152.000 (risposta della Q15).&quot;,&quot;Per l&#x27;intera società ogni costo è diretto: nessuna voce va ripartita.&quot;];
  function co(l){
    var d=0,i=0,h=&#x27;&#x27;;
    items.forEach(function(it){var dir=it[2]&lt;=l;if(dir)d+=it[1];else i+=it[1];
      h+=&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+it[0]+&#x27;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;&#x27;+fmt(it[1])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(dir?&#x27;&lt;span class=&quot;pill d&quot;&gt;direct&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;pill i&quot;&gt;indirect&lt;/span&gt;&#x27;)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;});
    $(&#x27;coBody&#x27;).innerHTML=h;$(&#x27;coD&#x27;).textContent=usd(d);$(&#x27;coI&#x27;).textContent=usd(i);$(&#x27;coNote&#x27;).textContent=notes[l];
  }
  var lab=$(&#x27;labCO&#x27;);lab.__on=function(b){co(+b.getAttribute(&#x27;data-l&#x27;))};co(1);

  // grafici cost behaviour
  var x0=48,x1=345,y0=220,y1=18;
  function axes(xmax,ymax,xl,yl,lo,hi,xmin){
    xmin=xmin||0;var X=function(v){return x0+(v-xmin)/(xmax-xmin)*(x1-x0)},s=&#x27;&#x27;;
    s+=&#x27;&lt;rect x=&quot;&#x27;+X(lo)+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;&#x27;+(X(hi)-X(lo))+&#x27;&quot; height=&quot;&#x27;+(y0-y1)+&#x27;&quot; style=&quot;fill:var(--sla-bg)&quot;/&gt;&#x27;;
    s+=&#x27;&lt;text x=&quot;&#x27;+((X(lo)+X(hi))/2)+&#x27;&quot; y=&quot;&#x27;+(y1+12)+&#x27;&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;relevant range&lt;/text&gt;&#x27;;
    s+=&#x27;&lt;path d=&quot;M&#x27;+x0+&#x27; &#x27;+y1+&#x27;V&#x27;+y0+&#x27;H&#x27;+x1+&#x27;&quot; fill=&quot;none&quot; style=&quot;stroke:var(--ink2)&quot;/&gt;&#x27;;
    for(var k=0;k&lt;=4;k++){var xv=k*2000;if(xv&lt;xmin)xv=xmin;s+=&#x27;&lt;text x=&quot;&#x27;+X(xv)+&#x27;&quot; y=&quot;&#x27;+(y0+15)+&#x27;&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;&#x27;+fmt(xv)+&#x27;&lt;/text&gt;&#x27;}
    s+=&#x27;&lt;text x=&quot;&#x27;+x1+&#x27;&quot; y=&quot;&#x27;+(y0+32)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;sv-sm&quot;&gt;&#x27;+xl+&#x27;&lt;/text&gt;&#x27;;
    s+=&#x27;&lt;text x=&quot;&#x27;+(x0-6)+&#x27;&quot; y=&quot;&#x27;+(y1+4)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;sv-sm&quot;&gt;&#x27;+yl+&#x27;&lt;/text&gt;&#x27;;
    s+=&#x27;&lt;text x=&quot;&#x27;+(x0-6)+&#x27;&quot; y=&quot;&#x27;+(y1+18)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;sv-sm&quot;&gt;&#x27;+fmt(ymax)+&#x27;&lt;/text&gt;&#x27;;
    return {s:s,X:X};
  }
  function lbl(x,y,t,c){return &#x27;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; class=&quot;sv-sm&quot; style=&quot;fill:&#x27;+c+&#x27;;font-weight:600&quot;&gt;&#x27;+t+&#x27;&lt;/text&gt;&#x27;}
  function cb(){
    var F=+$(&#x27;sF&#x27;).value,v=+$(&#x27;sV&#x27;).value,x=+$(&#x27;sX&#x27;).value;
    $(&#x27;oF&#x27;).textContent=usd(F);$(&#x27;oV&#x27;).textContent=usd(v,2);$(&#x27;oX&#x27;).textContent=fmt(x);
    var ymax=Math.max(1000,F+v*8000)*1.08,Y=function(c){return y0-c/ymax*(y0-y1)};
    var a=axes(8000,ymax,&#x27;unità&#x27;,&#x27;$ tot.&#x27;,2000,6000),X=a.X,s=a.s;
    s+=&#x27;&lt;path d=&quot;M&#x27;+X(0)+&#x27; &#x27;+Y(F)+&#x27;L&#x27;+X(8000)+&#x27; &#x27;+Y(F)+&#x27;&quot; style=&quot;stroke:var(--brk)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&#x27;;
    s+=&#x27;&lt;path d=&quot;M&#x27;+X(0)+&#x27; &#x27;+Y(0)+&#x27;L&#x27;+X(8000)+&#x27; &#x27;+Y(v*8000)+&#x27;&quot; style=&quot;stroke:var(--ocr)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&#x27;;
    s+=&#x27;&lt;path d=&quot;M&#x27;+X(0)+&#x27; &#x27;+Y(F)+&#x27;L&#x27;+X(8000)+&#x27; &#x27;+Y(F+v*8000)+&#x27;&quot; style=&quot;stroke:var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
    s+=&#x27;&lt;path d=&quot;M&#x27;+X(x)+&#x27; &#x27;+y1+&#x27;V&#x27;+y0+&#x27;&quot; style=&quot;stroke:var(--acc)&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;circle cx=&quot;&#x27;+X(x)+&#x27;&quot; cy=&quot;&#x27;+Y(F+v*x)+&#x27;&quot; r=&quot;5&quot; style=&quot;fill:var(--acc)&quot;/&gt;&#x27;;
    s+=lbl(X(8000)-40,Y(F)-6,&#x27;fisso&#x27;,&#x27;var(--brk)&#x27;)+lbl(X(8000)-60,Y(v*8000)+14,&#x27;variabile&#x27;,&#x27;var(--ocr)&#x27;)+lbl(X(8000)-40,Y(F+v*8000)-8,&#x27;totale&#x27;,&#x27;var(--sla)&#x27;);
    $(&#x27;gTot&#x27;).innerHTML=s;
    // per unità
    var xm=500,ym=(F/xm+v)*1.08||1,Yu=function(c){return y0-Math.min(c,ym)/ym*(y0-y1)};
    var b=axes(8000,ym,&#x27;unità&#x27;,&#x27;$/unità&#x27;,2000,6000,xm),Xu=b.X,t=b.s,pf=&#x27;&#x27;,pt=&#x27;&#x27;;
    for(var q=xm;q&lt;=8000;q+=125){pf+=(q===xm?&#x27;M&#x27;:&#x27;L&#x27;)+Xu(q).toFixed(1)+&#x27; &#x27;+Yu(F/q).toFixed(1);pt+=(q===xm?&#x27;M&#x27;:&#x27;L&#x27;)+Xu(q).toFixed(1)+&#x27; &#x27;+Yu(F/q+v).toFixed(1)}
    t+=&#x27;&lt;path d=&quot;&#x27;+pf+&#x27;&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brk)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&#x27;;
    t+=&#x27;&lt;path d=&quot;M&#x27;+Xu(xm)+&#x27; &#x27;+Yu(v)+&#x27;L&#x27;+Xu(8000)+&#x27; &#x27;+Yu(v)+&#x27;&quot; style=&quot;stroke:var(--ocr)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&#x27;;
    t+=&#x27;&lt;path d=&quot;&#x27;+pt+&#x27;&quot; fill=&quot;none&quot; style=&quot;stroke:var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
    t+=&#x27;&lt;path d=&quot;M&#x27;+Xu(x)+&#x27; &#x27;+y1+&#x27;V&#x27;+y0+&#x27;&quot; style=&quot;stroke:var(--acc)&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;circle cx=&quot;&#x27;+Xu(x)+&#x27;&quot; cy=&quot;&#x27;+Yu(F/x+v)+&#x27;&quot; r=&quot;5&quot; style=&quot;fill:var(--acc)&quot;/&gt;&#x27;;
    t+=lbl(Xu(8000)-70,Yu(F/8000)-6,&#x27;fisso/unità&#x27;,&#x27;var(--brk)&#x27;)+lbl(Xu(8000)-82,Yu(v)+14,&#x27;variabile/unità&#x27;,&#x27;var(--ocr)&#x27;);
    $(&#x27;gUnit&#x27;).innerHTML=t;
    $(&#x27;rV&#x27;).textContent=usd(v*x);$(&#x27;rT&#x27;).textContent=usd(F+v*x);$(&#x27;rFu&#x27;).textContent=usd(F/x,2);$(&#x27;rU&#x27;).textContent=usd(F/x+v,2);
    $(&#x27;rW&#x27;).textContent=(x&lt;2000||x&gt;6000)?&#x27;Fuori dal relevant range: le ipotesi (fissi costanti, variabile per unità costante) potrebbero non valere più.&#x27;:&#x27;&#x27;;
  }
  [&#x27;sF&#x27;,&#x27;sV&#x27;,&#x27;sX&#x27;].forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,cb)});cb();

  // conto economico a cascata + indici
  function ise(){
    var R=+$(&#x27;iR&#x27;).value,C=+$(&#x27;iC&#x27;).value,S=+$(&#x27;iS&#x27;).value,I=+$(&#x27;iI&#x27;).value,tx=+$(&#x27;iTx&#x27;).value/100;
    $(&#x27;oR&#x27;).textContent=usd(R);$(&#x27;oC&#x27;).textContent=usd(C);$(&#x27;oS&#x27;).textContent=usd(S);$(&#x27;oI&#x27;).textContent=usd(I);$(&#x27;oTx&#x27;).textContent=fmt(tx*100)+&#x27;%&#x27;;
    var GM=R-C,OI=GM-S,EBT=OI-I,T=Math.max(0,EBT)*tx,NI=EBT-T;
    var steps=[[&#x27;Revenues&#x27;,0,R,&#x27;r&#x27;],[&#x27;COGS&#x27;,GM,R,&#x27;c&#x27;],[&#x27;Gross margin&#x27;,0,GM,&#x27;r&#x27;],[&#x27;Selling &amp; admin&#x27;,OI,GM,&#x27;c&#x27;],[&#x27;Operating income&#x27;,0,OI,&#x27;r&#x27;],[&#x27;Interest&#x27;,EBT,OI,&#x27;c&#x27;],[&#x27;Pre-tax income&#x27;,0,EBT,&#x27;r&#x27;],[&#x27;Taxes&#x27;,NI,EBT,&#x27;c&#x27;],[&#x27;Net income&#x27;,0,NI,&#x27;r&#x27;]];
    var lo=Math.min(0,OI,EBT,NI),hi=R,W=640,top=20,bot=230,Y=function(v){return bot-(v-lo)/(hi-lo||1)*(bot-top)};
    var bw=W/steps.length,s=&#x27;&lt;path d=&quot;M0 &#x27;+Y(0)+&#x27;H&#x27;+W+&#x27;&quot; style=&quot;stroke:var(--ink2)&quot;/&gt;&#x27;;
    steps.forEach(function(st,k){
      var a=Math.min(st[1],st[2]),b=Math.max(st[1],st[2]),x=k*bw+8,res=st[3]===&#x27;r&#x27;,v=res?st[2]:st[1]-st[2];
      var col=res?(st[2]&lt;0?&#x27;var(--no)&#x27;:(k===8?&#x27;var(--acc)&#x27;:&#x27;var(--brk)&#x27;)):&#x27;var(--ink2)&#x27;;
      s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+Y(b)+&#x27;&quot; width=&quot;&#x27;+(bw-16)+&#x27;&quot; height=&quot;&#x27;+Math.max(1,Y(a)-Y(b))+&#x27;&quot; rx=&quot;3&quot; style=&quot;fill:&#x27;+col+&#x27;&quot; opacity=&quot;&#x27;+(res?1:.45)+&#x27;&quot;/&gt;&#x27;;
      s+=&#x27;&lt;text x=&quot;&#x27;+(x+(bw-16)/2)+&#x27;&quot; y=&quot;&#x27;+(Y(b)-5)+&#x27;&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot; style=&quot;font-size:10px&quot;&gt;&#x27;+fmt(Math.round(v/1000))+&#x27;k&lt;/text&gt;&#x27;;
      var nm=st[0].split(&#x27; &#x27;);s+=&#x27;&lt;text x=&quot;&#x27;+(x+(bw-16)/2)+&#x27;&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot; style=&quot;font-size:10px&quot;&gt;&#x27;+nm[0]+&#x27;&lt;/text&gt;&#x27;;
      if(nm[1])s+=&#x27;&lt;text x=&quot;&#x27;+(x+(bw-16)/2)+&#x27;&quot; y=&quot;261&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot; style=&quot;font-size:10px&quot;&gt;&#x27;+nm.slice(1).join(&#x27; &#x27;)+&#x27;&lt;/text&gt;&#x27;;
    });
    $(&#x27;gWf&#x27;).innerHTML=s;
    var N=+$(&#x27;iN&#x27;).value,P=+$(&#x27;iP&#x27;).value,E0=+$(&#x27;iE0&#x27;).value,E1=+$(&#x27;iE1&#x27;).value,EPS=NI/N;
    $(&#x27;oN&#x27;).textContent=fmt(N);$(&#x27;oP&#x27;).textContent=usd(P,2);$(&#x27;oE0&#x27;).textContent=usd(E0);$(&#x27;oE1&#x27;).textContent=usd(E1);
    $(&#x27;rNI&#x27;).textContent=usd(NI);$(&#x27;rEPS&#x27;).textContent=usd(EPS,2);
    $(&#x27;rPE&#x27;).textContent=EPS&gt;0?fmt(P/EPS,1):&#x27;n.s.&#x27;;
    $(&#x27;rROE&#x27;).textContent=fmt(NI/((E0+E1)/2)*100,1)+&#x27;%&#x27;;
    $(&#x27;rPEnote&#x27;).textContent=EPS&gt;0?&#x27;Il mercato paga &#x27;+usd(P/EPS,1)+&#x27; per ogni $1 di utile per azione. ROE: net income ÷ equity media (&#x27;+usd((E0+E1)/2)+&#x27;).&#x27;:&#x27;Con utile negativo il P/E non è significativo.&#x27;;
  }
  [&#x27;iR&#x27;,&#x27;iC&#x27;,&#x27;iS&#x27;,&#x27;iI&#x27;,&#x27;iTx&#x27;,&#x27;iN&#x27;,&#x27;iP&#x27;,&#x27;iE0&#x27;,&#x27;iE1&#x27;].forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,ise)});ise();
})();
&lt;/script&gt;
