    &lt;a href=&quot;#behaviour&quot;&gt;&lt;rect x=&quot;710&quot; y=&quot;270&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;12&quot; style=&quot;fill:var(--sla-bg);stroke:var(--sla)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;795&quot; y=&quot;293&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Relevant range&lt;/text&gt;&lt;text x=&quot;795&quot; y=&quot;311&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;e cost structure&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#bilancio&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;388&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;12&quot; style=&quot;fill:var(--brk-bg);stroke:var(--brk)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;411&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Financial statements&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;429&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;BS · IS · cash flow&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#bilancio&quot;&gt;&lt;rect x=&quot;560&quot; y=&quot;388&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;12&quot; style=&quot;fill:var(--brk-bg);stroke:var(--brk)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;655&quot; y=&quot;411&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Financial ratios&lt;/text&gt;&lt;text x=&quot;655&quot; y=&quot;429&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;P/E · ROE · liquidity&lt;/text&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Colori delle parti: terracotta = il costo, salvia = direct/indirect, ocra = manufacturing, ardesia = cost behaviour, mattone = bilancio e indici.&lt;/figcaption&gt;
  &lt;/figure&gt;

&lt;section class=&quot;part&quot; id=&quot;costo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 1 · Il punto di partenza&lt;/span&gt;
  &lt;h2&gt;Che cosa intendiamo per costo&lt;/h2&gt;
  &lt;p&gt;La lezione si apre con una domanda lasciata in sospeso (“A cost is…”) e poi con la risposta.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost (costo)&lt;/b&gt; — &lt;q&gt;the measure of resources given up to achieve a particular purpose&lt;/q&gt;: la misura, di solito in moneta, delle risorse a cui si rinuncia per raggiungere uno scopo preciso.&lt;br&gt;&lt;span class=&quot;src&quot;&gt;Slide 3–4&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Conviene leggere la definizione parola per parola, perché ogni pezzo prepara un argomento successivo:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“measure”&lt;/h4&gt;&lt;p&gt;Un costo è un &lt;em&gt;numero&lt;/em&gt;: serve una regola di misura (prezzo d&#x27;acquisto, ore × tariffa, quota di ammortamento…). Senza misura non c&#x27;è confronto tra alternative.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“resources given up”&lt;/h4&gt;&lt;p&gt;Materiali, lavoro, uso di macchinari, servizi: risorse consumate o impegnate, che non sono più disponibili per altri usi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“particular purpose”&lt;/h4&gt;&lt;p&gt;Il costo è sempre &lt;em&gt;costo di qualcosa&lt;/em&gt;: di un prodotto, di un reparto, di un cliente. Questo “qualcosa” è il &lt;em class=&quot;t&quot;&gt;cost object&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost object (oggetto di costo)&lt;/b&gt; — qualunque cosa di cui si vuole conoscere il costo separatamente: un&#x27;unità di prodotto, una linea di prodotti, un reparto, un negozio, un cliente, un progetto. Il termine compare nelle slide 5 e 9–10 e nella risposta di slide 15 (&lt;q&gt;It depends… what&#x27;s about the cost object?&lt;/q&gt;).&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Lo stesso costo cambia natura a seconda del cost object scelto&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; style=&quot;fill:var(--acc-bg);stroke:var(--acc)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;105&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Risorse&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;materiali · lavoro · servizi&lt;/text&gt;
    &lt;g fill=&quot;none&quot; stroke-width=&quot;1.6&quot; style=&quot;stroke:var(--ink2)&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M190 105 L280 105&quot;/&gt;&lt;path d=&quot;M450 105 C500 105 510 40 555 40&quot;/&gt;&lt;path d=&quot;M450 105 L555 105&quot;/&gt;&lt;path d=&quot;M450 105 C500 105 510 170 555 170&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;280&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;365&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Cost&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;misura in €/$&lt;/text&gt;
    &lt;g class=&quot;sv-txt&quot;&gt;&lt;text x=&quot;565&quot; y=&quot;44&quot;&gt;unità di prodotto&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;109&quot;&gt;reparto / negozio&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;174&quot;&gt;intera azienda&lt;/text&gt;&lt;/g&gt;
    &lt;text x=&quot;500&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;cost object: lo scopo per cui misuro&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dalla risorsa al costo, e dal costo al suo oggetto. Cambiando l&#x27;oggetto cambia la classificazione (parte 2).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;int&quot;&gt;&lt;p&gt;&lt;b&gt;Costi e spese, costi e attività.&lt;/b&gt; Nel &lt;em class=&quot;t&quot;&gt;management accounting&lt;/em&gt; (contabilità direzionale: informazioni per i manager interni) un costo può esistere anche se non compare come spesa nel conto economico di quel periodo: per esempio il costo dei materiali entra prima nelle rimanenze e diventa spesa (&lt;em class=&quot;t&quot;&gt;cost of goods sold&lt;/em&gt;) solo quando il prodotto viene venduto. Nel &lt;em class=&quot;t&quot;&gt;financial accounting&lt;/em&gt; (contabilità per gli esterni: bilancio) contano invece le regole dei principi contabili. Questo collegamento torna nella parte 5.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;self&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Ripeti la definizione di costo usata nel corso.&lt;/summary&gt;&lt;div&gt;La misura delle risorse a cui si rinuncia (&lt;em&gt;given up&lt;/em&gt;) per raggiungere uno scopo particolare (&lt;em&gt;a particular purpose&lt;/em&gt;).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Fai tre esempi di cost object per una catena di negozi.&lt;/summary&gt;&lt;div&gt;Un singolo prodotto venduto, il reparto Cosmetics di un negozio, il negozio Northridge, l&#x27;intera società, un cliente, una campagna pubblicitaria.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la definizione insiste su “particular purpose”?&lt;/summary&gt;&lt;div&gt;Perché un costo non ha una natura assoluta: si dice “diretto”, “indiretto”, “rilevante” solo rispetto a un oggetto o a una decisione. Senza scopo non si può classificare.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-sal&quot; id=&quot;diretti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 2 · Classificare rispetto all&#x27;oggetto&lt;/span&gt;
  &lt;h2&gt;Direct cost e indirect cost&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Direct cost (costo diretto)&lt;/b&gt; — un costo che si può &lt;em&gt;rintracciare&lt;/em&gt; (&lt;em class=&quot;t&quot;&gt;trace&lt;/em&gt;) in modo facile ed economicamente conveniente sul cost object considerato. Esempio: il legno di un tavolo rispetto al tavolo.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Indirect cost (costo indiretto)&lt;/b&gt; — un costo che non si può rintracciare facilmente sull&#x27;oggetto perché è &lt;em&gt;comune&lt;/em&gt; a più oggetti; per attribuirlo bisogna ripartirlo (&lt;em class=&quot;t&quot;&gt;allocate&lt;/em&gt;) con una base convenzionale. Esempio: lo stipendio del capo-reparto rispetto al singolo tavolo.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La parola chiave è &lt;b&gt;tracciabilità&lt;/b&gt;, non l&#x27;importo né la natura della spesa. E la tracciabilità dipende dall&#x27;oggetto: un costo comune a molti prodotti è indiretto per il singolo prodotto ma può essere diretto per il reparto che li produce tutti.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Costi diretti rintracciati sul prodotto, costi indiretti ripartiti tra più prodotti&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--sal-bg);stroke:var(--sal)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;120&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Direct materials&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;rintracciati sulla singola unità&lt;/text&gt;
    &lt;rect x=&quot;20&quot; y=&quot;150&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--brk-bg);stroke:var(--brk)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;120&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Stipendio supervisore&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;comune a tutta la produzione&lt;/text&gt;
    &lt;g fill=&quot;none&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M220 58 L520 58&quot; style=&quot;stroke:var(--sal)&quot;/&gt;&lt;/g&gt;
    &lt;g fill=&quot;none&quot; stroke-width=&quot;1.6&quot; stroke-dasharray=&quot;5 4&quot; style=&quot;stroke:var(--brk)&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M220 178 L330 178&quot;/&gt;&lt;path d=&quot;M440 160 C480 120 490 80 520 70&quot;/&gt;&lt;path d=&quot;M440 178 L520 140&quot;/&gt;&lt;path d=&quot;M440 196 L520 210&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;330&quot; y=&quot;155&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;23&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--brk)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;385&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;sv-txt&quot;&gt;allocation&lt;/text&gt;&lt;text x=&quot;385&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;base: ore, unità…&lt;/text&gt;
    &lt;text x=&quot;370&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;tracing: misura diretta&lt;/text&gt;
    &lt;g&gt;&lt;rect x=&quot;525&quot; y=&quot;40&quot; width=&quot;210&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; class=&quot;sv-txt&quot;&gt;Prodotto A&lt;/text&gt;
    &lt;rect x=&quot;525&quot; y=&quot;120&quot; width=&quot;210&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; class=&quot;sv-txt&quot;&gt;Prodotto B&lt;/text&gt;
    &lt;rect x=&quot;525&quot; y=&quot;192&quot; width=&quot;210&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;217&quot; text-anchor=&quot;middle&quot; class=&quot;sv-txt&quot;&gt;Prodotto C&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Linea piena = &lt;em&gt;tracing&lt;/em&gt; (costo diretto). Linea tratteggiata = &lt;em&gt;allocation&lt;/em&gt; con una base di ripartizione (costo indiretto).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q1 · slide 5–6&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A direct cost is a cost that can be easily traced to the particular cost object under consideration.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; È proprio la definizione: “easily traced” + “particular cost object”.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q2 · slide 7–8&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A factory supervisor&#x27;s salary would be classified as an indirect cost with respect to a unit of product.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; Il supervisore segue tutta la produzione: non si può dire quanto del suo stipendio “sta” in una singola unità. Rispetto al reparto che supervisiona, però, sarebbe diretto.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q3 · slide 9–10&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A cost can be direct or indirect. The classification can change if the cost object changes.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; Direct/indirect non è una proprietà del costo ma del rapporto costo–oggetto. Prova qui sotto con il caso Quinonez.&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Laboratorio: cambia il cost object (caso Quinonez, Q15)&lt;/h3&gt;
  &lt;p&gt;Quinonez Department Stores possiede molti negozi; Northridge è uno di questi, e il reparto Cosmetics è uno dei reparti di Northridge. Il magazzino centrale serve tutti i negozi. Scegli l&#x27;oggetto di costo e guarda come cambiano le classificazioni.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Dati di settembre, slide 34–36&lt;/p&gt;
  &lt;div class=&quot;box tabs&quot; id=&quot;labCO&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Cost object&quot;&gt;
      &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;co0&quot; data-l=&quot;0&quot;&gt;Reparto Cosmetics&lt;/button&gt;
      &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;co1&quot; data-l=&quot;1&quot;&gt;Negozio Northridge&lt;/button&gt;
      &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;co2&quot; data-l=&quot;2&quot;&gt;Intera società&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;co0&quot; hidden&gt;&lt;/div&gt;&lt;div role=&quot;tabpanel&quot; id=&quot;co1&quot;&gt;&lt;/div&gt;&lt;div role=&quot;tabpanel&quot; id=&quot;co2&quot; hidden&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;$&lt;/th&gt;&lt;th&gt;Classificazione&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;coBody&quot;&gt;&lt;/tbody&gt;
    &lt;tfoot&gt;&lt;tr&gt;&lt;th&gt;Totale diretti&lt;/th&gt;&lt;th class=&quot;r&quot; id=&quot;coD&quot;&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Totale NON diretti&lt;/th&gt;&lt;th class=&quot;r&quot; id=&quot;coI&quot;&gt;&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/tfoot&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p id=&quot;coNote&quot; class=&quot;src&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;a&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q15 · slide 34–36&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;What is the total amount of the costs listed above that are NOT direct costs of the Northridge Store?&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) $152,000&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) $33,000&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) $45,000&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) $77,000&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;a) $152,000.&lt;/b&gt; Non sono diretti per il negozio solo i costi di livello società: headquarters lease 77.000 + corporate legal 59.000 + central warehouse 16.000 = 152.000. Tutto ciò che riguarda Northridge (compresi i costi del reparto Cosmetics, che sta dentro il negozio) è diretto per Northridge. Il distrattore c) $45.000 è il totale dei costi diretti del &lt;em&gt;reparto&lt;/em&gt; Cosmetics: risponde a un&#x27;altra domanda, con un altro cost object.&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;self&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;L&#x27;affitto del magazzino centrale è diretto o indiretto?&lt;/summary&gt;&lt;div&gt;Dipende: indiretto per Northridge (serve tutti i negozi), diretto per l&#x27;intera società.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un costo “piccolo” è per forza indiretto?&lt;/summary&gt;&lt;div&gt;No. Il criterio è la tracciabilità. È vero però che per costi di importo minimo (colla, viti) rintracciarli può non valere la fatica, e in pratica si trattano come indiretti: “easily” significa anche “in modo conveniente”.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa serve per assegnare un costo indiretto a un prodotto?&lt;/summary&gt;&lt;div&gt;Una base di ripartizione (&lt;em&gt;allocation base&lt;/em&gt;), per esempio ore macchina o ore di lavoro diretto, con cui distribuire il costo comune tra i prodotti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-ocr&quot; id=&quot;produzione&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 3 · Classificare per funzione&lt;/span&gt;
  &lt;h2&gt;Manufacturing vs nonmanufacturing costs&lt;/h2&gt;
  &lt;p&gt;Le imprese manifatturiere separano di solito i costi in due grandi famiglie (slide 13): i costi di produzione (&lt;em class=&quot;t&quot;&gt;manufacturing costs&lt;/em&gt;, tutto ciò che serve a fabbricare il prodotto) e i costi non di produzione (&lt;em class=&quot;t&quot;&gt;nonmanufacturing costs&lt;/em&gt;, tutto ciò che serve a venderlo e a gestire l&#x27;azienda).&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 300&quot; role=&quot;img&quot; aria-label=&quot;Albero: manufacturing costs divisi in direct materials, direct labor, manufacturing overhead; nonmanufacturing costs divisi in selling e administrative&quot;&gt;
    &lt;rect x=&quot;230&quot; y=&quot;14&quot; width=&quot;300&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;380&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; class=&quot;sv-txt&quot; font-weight=&quot;600&quot;&gt;Costi di un&#x27;impresa manifatturiera&lt;/text&gt;
    &lt;g fill=&quot;none&quot; stroke-width=&quot;1.6&quot; style=&quot;stroke:var(--ink2)&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M330 58 L210 100&quot;/&gt;&lt;path d=&quot;M430 58 L560 100&quot;/&gt;
    &lt;path d=&quot;M150 150 L70 200&quot;/&gt;&lt;path d=&quot;M200 150 L200 200&quot;/&gt;&lt;path d=&quot;M250 150 L335 200&quot;/&gt;&lt;path d=&quot;M530 150 L490 200&quot;/&gt;&lt;path d=&quot;M600 150 L650 200&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;100&quot; y=&quot;100&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--ocr-bg);stroke:var(--ocr)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;210&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Manufacturing&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;product costs&lt;/text&gt;
    &lt;rect x=&quot;460&quot; y=&quot;100&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--sla-bg);stroke:var(--sla)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;text x=&quot;570&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Nonmanufacturing&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;period costs&lt;/text&gt;
    &lt;g class=&quot;sv-txt&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;200&quot; width=&quot;125&quot; height=&quot;58&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--ocr)&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;224&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;242&quot;&gt;Materials&lt;/text&gt;
      &lt;rect x=&quot;145&quot; y=&quot;200&quot; width=&quot;115&quot; height=&quot;58&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--ocr)&quot;/&gt;&lt;text x=&quot;202&quot; y=&quot;224&quot;&gt;Direct&lt;/text&gt;&lt;text x=&quot;202&quot; y=&quot;242&quot;&gt;Labor&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;200&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--ocr)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;224&quot;&gt;Manufacturing&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;242&quot;&gt;overhead&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;200&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--sla)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;224&quot;&gt;Selling&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;242&quot;&gt;costs&lt;/text&gt;
      &lt;rect x=&quot;575&quot; y=&quot;200&quot; width=&quot;160&quot; height=&quot;58&quot; rx=&quot;10&quot; class=&quot;sv-card&quot; style=&quot;stroke:var(--sla)&quot;/&gt;&lt;text x=&quot;655&quot; y=&quot;224&quot;&gt;Administrative&lt;/text&gt;&lt;text x=&quot;655&quot; y=&quot;242&quot;&gt;costs&lt;/text&gt;
    &lt;/g&gt;
    &lt;path d=&quot;M14 272 H256&quot; style=&quot;stroke:var(--ocr)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;prime cost = DM + DL&lt;/text&gt;
    &lt;path d=&quot;M150 268 H406&quot; style=&quot;stroke:var(--ocr)&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;2 4&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;conversion cost = DL + MOH&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Lo schema della slide 13, con le etichette &lt;em&gt;product/period costs&lt;/em&gt;, &lt;em&gt;prime cost&lt;/em&gt; e &lt;em&gt;conversion cost&lt;/em&gt; aggiunte come integrazione.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le cinque categorie, una per una&lt;/h3&gt;
  &lt;div class=&quot;acc&quot;&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;Direct materials (materiali diretti)&lt;/b&gt;: diventano parte del prodotto e si rintracciano su di esso&lt;/summary&gt;&lt;div&gt;Il legno del tavolo, il tessuto della camicia, il chip del telefono. Materiali minori e difficili da rintracciare (colla, viti) finiscono invece negli &lt;em&gt;indirect materials&lt;/em&gt;, cioè nel manufacturing overhead.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;Direct labor (lavoro diretto)&lt;/b&gt;: il lavoro di chi trasforma fisicamente il prodotto&lt;/summary&gt;&lt;div&gt;Operai alla linea, assemblatori. Il lavoro di supervisori, manutentori, addetti al magazzino non si rintraccia sulla singola unità: è &lt;em&gt;indirect labor&lt;/em&gt; e va nel manufacturing overhead (Q4).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;Manufacturing overhead (costi generali di produzione)&lt;/b&gt;: tutti gli altri costi di produzione&lt;/summary&gt;&lt;div&gt;Per esclusione: &lt;em&gt;tutti&lt;/em&gt; i costi di fabbrica tranne direct materials e direct labor (Q6). Comprende indirect materials, indirect labor, ammortamento e affitto dello stabilimento, energia della fabbrica, manutenzione, assicurazioni. Ha una parte fissa e una variabile (Q7, Q16).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;Selling costs (costi di vendita)&lt;/b&gt;: per ottenere ordini e consegnare il prodotto&lt;/summary&gt;&lt;div&gt;Pubblicità, provvigioni ai venditori (&lt;em&gt;sales commissions&lt;/em&gt;), spedizioni ai clienti, stipendi della forza vendita, magazzini prodotti finiti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;Administrative costs (costi amministrativi)&lt;/b&gt;: per la gestione generale dell&#x27;organizzazione&lt;/summary&gt;&lt;div&gt;Stipendi di direzione, contabilità, ufficio legale, sede centrale. Non sono legati né alla fabbrica né alla vendita.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;Total manufacturing cost = DM + DL + MOH&lt;small&gt;Prime cost = DM + DL · Conversion cost = DL + MOH (integrazione: definizioni standard del &lt;em&gt;cost accounting&lt;/em&gt;, non scritte nelle slide)&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;int&quot;&gt;&lt;p&gt;&lt;b&gt;Product costs e period costs.&lt;/b&gt; I costi di produzione sono &lt;em class=&quot;t&quot;&gt;product costs&lt;/em&gt; (costi del prodotto): seguono il prodotto nelle rimanenze e diventano spesa (&lt;em&gt;cost of goods sold&lt;/em&gt;, costo del venduto) solo quando il prodotto è venduto. Selling e administrative sono &lt;em class=&quot;t&quot;&gt;period costs&lt;/em&gt; (costi del periodo): vanno a conto economico nel periodo in cui si sostengono. Per questo la classificazione funzionale porta dritta al conto economico della parte 5.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q4 · slide 11–12&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;Wages paid to production supervisors would be classified as manufacturing overhead.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; Sono costi di fabbrica (quindi manufacturing) ma non direct labor, perché i supervisori non lavorano fisicamente il prodotto: restano nel manufacturing overhead come indirect labor. Si collega a Q2.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;D&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q5 · slide 14–15&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;Selling costs are usually indirect costs.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;D&quot;&gt;Dipende&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Dipende&lt;/b&gt; — la slide risponde &lt;q&gt;It depends… what&#x27;s about the cost object?&lt;/q&gt;. Rispetto alla singola unità di prodotto la pubblicità generale è indiretta; rispetto a un reparto, un negozio o un territorio di vendita molti costi di vendita (le provvigioni del reparto Cosmetics in Q15) sono diretti.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q6 · slide 16–17&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;The sum of all manufacturing costs except for direct materials and direct labor is called manufacturing overhead.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; MOH = totale costi di produzione − DM − DL. È una definizione per esclusione.&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;self&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Dove va lo stipendio del responsabile marketing?&lt;/summary&gt;&lt;div&gt;Nonmanufacturing, selling cost (period cost).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dove va l&#x27;ammortamento dei macchinari di fabbrica?&lt;/summary&gt;&lt;div&gt;Manufacturing overhead (product cost), e di solito è un costo fisso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;DM = 50, DL = 30, MOH = 20. Calcola prime cost e conversion cost.&lt;/summary&gt;&lt;div&gt;Prime cost = 50 + 30 = 80. Conversion cost = 30 + 20 = 50. Totale manufacturing = 100.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il lavoro del supervisore non è direct labor?&lt;/summary&gt;&lt;div&gt;Perché non si può rintracciare sulla singola unità: supervisiona tutta la produzione. È indirect labor, parte del MOH.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-sla&quot; id=&quot;behaviour&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 4 · Classificare per comportamento&lt;/span&gt;
  &lt;h2&gt;Cost behaviour: fixed, variable, mixed&lt;/h2&gt;
  &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Cost behaviour&lt;/em&gt; (comportamento dei costi) significa come reagisce un costo quando cambia il livello di attività (&lt;em class=&quot;t&quot;&gt;activity level&lt;/em&gt;: unità prodotte, ore macchina, clienti serviti…). È la parte più corposa del quiz (Q7–Q17).&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Variable cost&lt;/b&gt; — il totale varia in proporzione all&#x27;attività; il costo &lt;em&gt;per unità&lt;/em&gt; resta costante. Es.: materiali diretti, provvigioni.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Fixed cost&lt;/b&gt; — il totale resta costante (nel relevant range); il costo &lt;em&gt;per unità&lt;/em&gt; scende quando l&#x27;attività sale e sale quando scende. Es.: affitto, stipendi dei supervisori.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Mixed cost&lt;/b&gt; — ha una parte fissa e una variabile. Es.: bolletta con quota fissa + consumo; un&#x27;auto a noleggio con canone + €/km.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Y = a + b·X&lt;small&gt;Y = costo totale · a = parte fissa totale · b = costo variabile per unità · X = livello di attività&lt;/small&gt;&lt;/div&gt;

  &lt;h3&gt;La tabella da sapere a memoria&lt;/h3&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Costo totale&lt;/th&gt;&lt;th&gt;Costo per unità&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Variable&lt;/b&gt;&lt;/td&gt;&lt;td&gt;cresce e cala con l&#x27;attività&lt;/td&gt;&lt;td&gt;&lt;b&gt;costante&lt;/b&gt; (Q13)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Fixed&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;costante&lt;/b&gt; nel relevant range&lt;/td&gt;&lt;td&gt;cala se l&#x27;attività sale, cresce se scende (Q10–Q12)&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;È l&#x27;errore più frequente: confondere il comportamento &lt;em&gt;del totale&lt;/em&gt; con quello &lt;em&gt;per unità&lt;/em&gt;. Il costo fisso è “fisso” nel totale, ma per unità è proprio quello che si muove.&lt;/p&gt;

  &lt;h3&gt;Grafico interattivo: totale e per unità&lt;/h3&gt;
  &lt;p&gt;I valori di partenza vengono dal caso Rhome (Q16, slide 37–39): costi fissi di produzione = $3,00 × 4.000 = $12.000; costi variabili di produzione = 5,40 + 3,55 + 1,70 = $10,65 per unità; relevant range 2.000–6.000 unità (fascia evidenziata).&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Costi fissi totali (a) &lt;output id=&quot;oF&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sF&quot; min=&quot;0&quot; max=&quot;30000&quot; step=&quot;500&quot; value=&quot;12000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Costo variabile per unità (b) &lt;output id=&quot;oV&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sV&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.05&quot; value=&quot;10.65&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Unità prodotte (X) &lt;output id=&quot;oX&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sX&quot; min=&quot;500&quot; max=&quot;8000&quot; step=&quot;100&quot; value=&quot;4000&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;figure&gt;&lt;svg viewBox=&quot;0 0 360 260&quot; role=&quot;img&quot; aria-label=&quot;Costi totali in funzione delle unità&quot;&gt;&lt;g id=&quot;gTot&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Costi &lt;b&gt;totali&lt;/b&gt;: fisso (piatto), variabile (dall&#x27;origine), totale.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;svg viewBox=&quot;0 0 360 260&quot; role=&quot;img&quot; aria-label=&quot;Costi per unità in funzione delle unità&quot;&gt;&lt;g id=&quot;gUnit&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Costi &lt;b&gt;per unità&lt;/b&gt;: il fisso per unità è un&#x27;iperbole (a ÷ X).&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;
      &lt;div&gt;Variabili totali&lt;b id=&quot;rV&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Costo totale&lt;b id=&quot;rT&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Fisso per unità&lt;b id=&quot;rFu&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Costo pieno per unità&lt;b id=&quot;rU&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;warn&quot; id=&quot;rW&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Relevant range&lt;/b&gt; — l&#x27;intervallo di attività in cui valgono le ipotesi sul comportamento dei costi: i fissi restano fissi e il variabile per unità resta costante. Fuori dall&#x27;intervallo servirebbe per esempio un secondo stabilimento (i fissi “saltano”) o si otterrebbero sconti sui materiali (il variabile per unità cambia).&lt;/div&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;F&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q7 · slide 18–19&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;Indirect costs, such as manufacturing overhead, are variable costs.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Falso.&lt;/b&gt; Direct/indirect (tracciabilità) e fixed/variable (comportamento) sono due classificazioni indipendenti. Il MOH contiene costi fissi (affitto, ammortamento, supervisori), variabili (energia delle macchine, materiali indiretti) e misti. Nel caso Rhome c&#x27;è infatti sia un &lt;em&gt;variable&lt;/em&gt; sia un &lt;em&gt;fixed manufacturing overhead&lt;/em&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;F&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q10 · slide 24–25&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;If the activity level increases, then one would expect the fixed cost per unit to increase as well.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Falso.&lt;/b&gt; Il totale fisso si spalma su più unità: il fisso per unità &lt;em&gt;diminuisce&lt;/em&gt;. Sposta il cursore X qui sopra.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q11 · slide 26–27&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A fixed cost is a cost whose cost per unit varies as the activity level rises and falls.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; Sembra un tranello, ma è corretto: è fisso il totale, mentre il valore per unità varia al variare dell&#x27;attività.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;F&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q12 · slide 28–29&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A decrease in production will ordinarily result in a decrease in fixed production costs per unit.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Falso.&lt;/b&gt; Meno unità → stesso totale fisso diviso per un numero più piccolo → fisso per unità &lt;em&gt;più alto&lt;/em&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;F&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q13 · slide 30–31&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;The variable cost per unit depends on how many units are produced.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Falso.&lt;/b&gt; Nel relevant range il variabile per unità è costante: è il &lt;em&gt;totale&lt;/em&gt; variabile che dipende dalle unità.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;a&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q14 · slide 32–33&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;For the past 8 months, Jinan Corporation has experienced a steady increase in its cost per unit even though total costs have remained stable. This cost per unit increase may be due to ____ costs if the level of activity at Jinan is ____.&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) fixed, decreasing&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) fixed, increasing&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) variable, decreasing&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) variable, increasing&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;a) fixed, decreasing.&lt;/b&gt; Totale stabile + costo unitario in crescita è la “firma” dei costi fissi con volumi in calo. Se fossero variabili il costo unitario resterebbe costante e il totale si muoverebbe.&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Cost structure e altri termini vicini&lt;/h3&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;b&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q8 · slide 20–21&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;The relative proportion of variable, fixed, and mixed costs in a company is known as the company&#x27;s:&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) contribution margin&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) cost structure&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) product mix&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) relevant range&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;b) cost structure&lt;/b&gt; (struttura dei costi). Vedi le linguette qui sotto per capire perché gli altri sono sbagliati.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;box tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Termini&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;tm1&quot;&gt;Cost structure&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tm2&quot;&gt;Contribution margin&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tm3&quot;&gt;Product mix&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tm4&quot;&gt;Relevant range&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tm1&quot;&gt;&lt;p&gt;Il peso relativo di costi fissi, variabili e misti. Un&#x27;impresa con molti fissi (acciaieria, compagnia aerea) ha profitti molto sensibili al volume: guadagna molto quando le vendite salgono e perde molto quando scendono. Un&#x27;impresa con molti variabili è più “elastica” e meno rischiosa, ma guadagna meno per ogni unità in più. &lt;span class=&quot;src&quot;&gt;integrazione: questo effetto si chiama &lt;em&gt;operating leverage&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tm2&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Contribution margin&lt;/b&gt; (margine di contribuzione) = ricavi − costi variabili. È ciò che resta per coprire i costi fissi e poi generare utile. Per unità: prezzo − variabile per unità. È un &lt;em&gt;importo&lt;/em&gt;, non una proporzione tra tipi di costo.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tm3&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Product mix&lt;/b&gt; (mix di vendita) = le proporzioni in cui si vendono i diversi prodotti. Riguarda le vendite, non i costi.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tm4&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Relevant range&lt;/b&gt; = l&#x27;intervallo di attività in cui valgono le ipotesi di comportamento dei costi (per Rhome 2.000–6.000 unità). È un intervallo di volumi, non una composizione dei costi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Come si scopre se un costo è fisso o variabile&lt;/h3&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q9 · slide 22–23&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;In account analysis, an account is classified as either variable or fixed based on an analyst&#x27;s prior knowledge of how the cost in the account behaves.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; L&#x27;&lt;em&gt;account analysis&lt;/em&gt; (analisi dei conti) è il metodo più semplice: chi conosce l&#x27;azienda guarda ogni conto e lo etichetta come fisso o variabile in base all&#x27;esperienza. È rapido ma soggettivo.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;int&quot;&gt;&lt;p&gt;Per i costi misti esistono metodi quantitativi che stimano &lt;em&gt;a&lt;/em&gt; e &lt;em&gt;b&lt;/em&gt; dai dati storici: &lt;b&gt;high-low method&lt;/b&gt; (punto di massima e di minima attività: b = ΔCosto ÷ ΔAttività, poi a = Costo − b·X), &lt;b&gt;scattergraph&lt;/b&gt; (nuvola di punti tracciata a occhio) e &lt;b&gt;least-squares regression&lt;/b&gt; (regressione lineare). Esempio high-low: 1.000 ore → €9.000; 3.000 ore → €15.000 ⇒ b = 6.000 ÷ 2.000 = €3/ora; a = 9.000 − 3.000 = €6.000.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Esercizi numerici guidati&lt;/h3&gt;
  &lt;h4&gt;Q16 · Rhome Corporation (slide 37–39)&lt;/h4&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Costo medio per unità a 4.000 unità&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;$&lt;/th&gt;&lt;th&gt;Comportamento&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;5,40&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3,55&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Variable manufacturing overhead&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,70&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Fixed manufacturing overhead&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;&lt;b&gt;3,00&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;fixed&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Fixed selling expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0,60&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fixed administrative expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0,40&lt;/td&gt;&lt;td&gt;fixed&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Sales commissions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,00&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Variable administrative expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0,40&lt;/td&gt;&lt;td&gt;variable&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;box steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;Domanda: se si producono 5.000 unità, quanto vale il costo fisso di produzione medio per unità?&lt;/p&gt;&lt;p&gt;Opzioni: a) $3,75 · b) $2,40 · c) $2,70 · d) $3,00. Prova a rispondere, poi scorri i passi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;1 · Il $3,00 è una media calcolata a 4.000 unità.&lt;/p&gt;&lt;p&gt;Un costo fisso “per unità” non è un dato stabile: va sempre riportato al totale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;2 · Totale fisso di produzione = 3,00 × 4.000 = $12.000&lt;/p&gt;&lt;p&gt;Questo totale non cambia a 5.000 unità, perché 5.000 è dentro il relevant range (2.000–6.000).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;3 · Nuovo valore per unità = 12.000 ÷ 5.000 = $2,40&lt;/p&gt;&lt;p&gt;Risposta &lt;b&gt;b&lt;/b&gt;. La d) $3,00 è la trappola di chi tratta il fisso come se fosse variabile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h4&gt;Q17 · Timchak Corporation (slide 40–41)&lt;/h4&gt;
  &lt;div class=&quot;box steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;A 9.900 unità: variabili totali $919.116, fissi totali $259.974. Costo totale a 10.100 unità (nel relevant range)?&lt;/p&gt;&lt;p&gt;Opzioni: a) $1.197.658 · b) $1.191.000 · c) $1.179.090 · d) $1.202.910.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;1 · Variabile per unità = 919.116 ÷ 9.900 = $92,84&lt;/p&gt;&lt;p&gt;Il variabile per unità è costante: lo si ricava dal totale e lo si riusa al nuovo volume.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;2 · Variabili a 10.100 unità = 92,84 × 10.100 = $937.684&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;3 · Fissi invariati = $259.974&lt;/p&gt;&lt;p&gt;Siamo nel relevant range: il totale fisso non si tocca.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;big&quot;&gt;4 · Totale = 259.974 + 937.684 = $1.197.658&lt;/p&gt;&lt;p&gt;Risposta &lt;b&gt;a&lt;/b&gt;. Errore tipico: moltiplicare per 10.100/9.900 anche i costi fissi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;self&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Rhome: quanto vale il costo variabile totale per unità (produzione + vendita + amministrazione)?&lt;/summary&gt;&lt;div&gt;5,40 + 3,55 + 1,70 + 1,00 + 0,40 = $12,05 per unità, costante in tutto il relevant range.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Rhome: quanto valgono i costi fissi totali (tutti) e il costo fisso per unità a 2.000 unità?&lt;/summary&gt;&lt;div&gt;(3,00 + 0,60 + 0,40) × 4.000 = $16.000. A 2.000 unità: 16.000 ÷ 2.000 = $8,00 per unità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una bolletta ha €200 al mese fissi + €0,25/kWh. Quanto costa a 1.600 kWh?&lt;/summary&gt;&lt;div&gt;Y = 200 + 0,25 × 1.600 = €600. È un mixed cost.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché “indiretto” non vuol dire “fisso”?&lt;/summary&gt;&lt;div&gt;Perché sono due criteri diversi: tracciabilità sul cost object e reazione al volume. L&#x27;energia delle macchine è indiretta per il prodotto ma variabile; le provvigioni di un reparto sono dirette per il reparto e variabili; lo stipendio del responsabile di reparto è diretto per il reparto ma fisso.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-brk&quot; id=&quot;bilancio&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 5 · Dai costi al bilancio&lt;/span&gt;
  &lt;h2&gt;Financial statements e financial ratios&lt;/h2&gt;
  &lt;p&gt;Le ultime domande (Q18–Q24) ripassano il bilancio: i costi delle parti precedenti finiscono nel conto economico, i beni e i debiti nello stato patrimoniale, e dai due si calcolano gli indici.&lt;/p&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;a,d,e&quot; data-multi&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q18 · slide 42–43 · una o più risposte&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;What are the main reports provided by FINANCIAL STATEMENTS?&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot; aria-pressed=&quot;false&quot;&gt;a) The cash flow statement&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot; aria-pressed=&quot;false&quot;&gt;b) The strategic plan&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;c) The plan of human resources&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot; aria-pressed=&quot;false&quot;&gt;d) The income statement&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;e&quot; aria-pressed=&quot;false&quot;&gt;e) The balance sheet&lt;/button&gt;&lt;/div&gt;
    &lt;p&gt;&lt;button class=&quot;btn check&quot;&gt;Controlla&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;a, d, e.&lt;/b&gt; Strategic plan e piano delle risorse umane sono documenti di pianificazione interna, non prospetti di bilancio.&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;box tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Prospetti&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;fs1&quot;&gt;Balance sheet&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;fs2&quot;&gt;Income statement&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;fs3&quot;&gt;Cash flow statement&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;fs1&quot;&gt;
      &lt;p&gt;&lt;b&gt;Balance sheet&lt;/b&gt; (stato patrimoniale): una &lt;em&gt;fotografia&lt;/em&gt; a una data (fine esercizio). Elenca &lt;em class=&quot;t&quot;&gt;assets&lt;/em&gt; (attività: ciò che l&#x27;azienda possiede o controlla), &lt;em class=&quot;t&quot;&gt;liabilities&lt;/em&gt; (passività: ciò che deve a terzi) ed &lt;em class=&quot;t&quot;&gt;equity&lt;/em&gt; (patrimonio netto: ciò che resta ai soci).&lt;/p&gt;
      &lt;figure&gt;&lt;svg viewBox=&quot;0 0 520 230&quot; role=&quot;img&quot; aria-label=&quot;Assets uguale liabilities più equity&quot;&gt;
        &lt;rect x=&quot;40&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;190&quot; rx=&quot;6&quot; style=&quot;fill:var(--sla-bg);stroke:var(--sla)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;140&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Assets&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;cassa, crediti, magazzino,&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;impianti…&lt;/text&gt;
        &lt;rect x=&quot;280&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;115&quot; rx=&quot;6&quot; style=&quot;fill:var(--brk-bg);stroke:var(--brk)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Liabilities&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;debiti verso banche, fornitori…&lt;/text&gt;
        &lt;rect x=&quot;280&quot; y=&quot;140&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;6&quot; style=&quot;fill:var(--sal-bg);stroke:var(--sal)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; class=&quot;sv-sm&quot;&gt;= Assets − Liabilities&lt;/text&gt;
        &lt;text x=&quot;260&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;sv-ser&quot;&gt;=&lt;/text&gt;
      &lt;/svg&gt;&lt;figcaption&gt;L&#x27;equazione di bilancio: Assets = Liabilities + Equity.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;fs2&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Income statement&lt;/b&gt; (conto economico): un &lt;em&gt;film&lt;/em&gt; dell&#x27;esercizio. Parte dai ricavi (&lt;em class=&quot;t&quot;&gt;revenues&lt;/em&gt;), sottrae i costi a scalare e arriva al &lt;em class=&quot;t&quot;&gt;net income&lt;/em&gt; (utile netto). È qui che finiscono i product costs (come cost of goods sold) e i period costs (selling e administrative).&lt;/p&gt;
      &lt;p&gt;Usa i cursori nel laboratorio qui sotto per vederlo costruirsi.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;fs3&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Cash flow statement&lt;/b&gt; (rendiconto finanziario): spiega come è variata la cassa nell&#x27;esercizio, separando flussi da attività &lt;em class=&quot;t&quot;&gt;operating&lt;/em&gt; (gestione corrente), &lt;em class=&quot;t&quot;&gt;investing&lt;/em&gt; (investimenti) e &lt;em class=&quot;t&quot;&gt;financing&lt;/em&gt; (finanziamenti). Serve perché utile e cassa non coincidono: una vendita a credito genera ricavo ma non cassa; un ammortamento è un costo ma non un&#x27;uscita di cassa.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;q&quot; data-ans=&quot;a&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q19 · slide 44–45&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;What is the main value identified in the income statement?&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) Net income realized during the financial year, as the difference between revenues and costs&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) Net income realized during the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) Equity available at the end of the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) Equity realized during the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;a).&lt;/b&gt; Conto economico = flusso del periodo: ricavi − costi = net income.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;c&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q20 · slide 46–47&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;What is the main value identified in the balance sheet?&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) Net income realized during the financial year, as the difference between revenues and costs&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) Net income realized during the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) Equity available at the end of the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) Equity realized during the financial year, as the difference between assets and liabilities&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;c).&lt;/b&gt; Stato patrimoniale = consistenza a una data: assets − liabilities = equity &lt;em&gt;disponibile a fine esercizio&lt;/em&gt;. La d) sbaglia perché l&#x27;equity non si “realizza” durante l&#x27;anno: è uno stock, non un flusso.&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Laboratorio: costruisci il conto economico&lt;/h3&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Revenues &lt;output id=&quot;oR&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iR&quot; min=&quot;200000&quot; max=&quot;2000000&quot; step=&quot;10000&quot; value=&quot;1000000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Cost of goods sold (product costs) &lt;output id=&quot;oC&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iC&quot; min=&quot;0&quot; max=&quot;1500000&quot; step=&quot;10000&quot; value=&quot;600000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Selling &amp;amp; administrative (period costs) &lt;output id=&quot;oS&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iS&quot; min=&quot;0&quot; max=&quot;800000&quot; step=&quot;10000&quot; value=&quot;200000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Interest expense &lt;output id=&quot;oI&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iI&quot; min=&quot;0&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;40000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Aliquota imposte &lt;output id=&quot;oTx&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iTx&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;24&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 280&quot; role=&quot;img&quot; aria-label=&quot;Conto economico a cascata&quot;&gt;&lt;g id=&quot;gWf&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Cascata: ogni barra scura toglie un costo; le barre colorate sono i risultati intermedi. Operating income = revenues − operating costs (Q23).&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;b&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q23 · slide 52–53&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;What is the Operating Income?&lt;/div&gt;
    &lt;div class=&quot;opts col&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;a&quot;&gt;a) The difference between revenues and taxes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;b&quot;&gt;b) The difference between revenues and operating costs&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;c&quot;&gt;c) The difference between revenues and costs of bank loans&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;d&quot;&gt;d) The difference between revenues and accounts receivable&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;b).&lt;/b&gt; L&#x27;&lt;em&gt;operating income&lt;/em&gt; (reddito operativo) misura la gestione caratteristica, prima di oneri finanziari (interessi sui prestiti) e imposte. I crediti verso clienti (&lt;em class=&quot;t&quot;&gt;accounts receivable&lt;/em&gt;) sono un asset dello stato patrimoniale, non un costo.&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Gli indici delle slide&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;P/E = Market value per share ÷ Earnings per share&lt;small&gt;slide 49 · EPS = net income ÷ numero di azioni&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;ROE = Net income ÷ Average stockholders&#x27; equity&lt;small&gt;slide 50–51 · media = (equity inizio + fine) ÷ 2&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Current ratio = Current assets ÷ Current liabilities&lt;small&gt;integrazione: indice di liquidità classico&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Calcolatore collegato al conto economico qui sopra&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Numero di azioni &lt;output id=&quot;oN&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iN&quot; min=&quot;10000&quot; max=&quot;500000&quot; step=&quot;10000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Prezzo di mercato per azione &lt;output id=&quot;oP&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iP&quot; min=&quot;1&quot; max=&quot;100&quot; step=&quot;0.5&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Equity a inizio anno &lt;output id=&quot;oE0&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iE0&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;50000&quot; value=&quot;900000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Equity a fine anno &lt;output id=&quot;oE1&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iE1&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;50000&quot; value=&quot;1000000&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Net income&lt;b id=&quot;rNI&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;EPS&lt;b id=&quot;rEPS&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;P/E&lt;b id=&quot;rPE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ROE&lt;b id=&quot;rROE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;src&quot; id=&quot;rPEnote&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q21 · slide 48–49&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;A high price-earnings ratio means that investors are willing to pay a premium for the company&#x27;s stock.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; P/E alto = il mercato paga molti euro per ogni euro di utile corrente, di solito perché si aspetta crescita futura. (Integrazione: un P/E alto può dipendere anche da utili temporaneamente bassi, quindi va letto con cautela.)&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q22 · slide 50–51&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;Return on equity = Net income / Average total stockholders&#x27; equity.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; Il ROE misura il rendimento del capitale dei soci. Si usa la media perché il net income si forma lungo tutto l&#x27;anno mentre l&#x27;equity è un valore puntuale (inizio e fine).&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q&quot; data-ans=&quot;T&quot;&gt;&lt;div class=&quot;qh&quot;&gt;Dalle slide · Q24 · slide 54–55&lt;/div&gt;
    &lt;div class=&quot;qt&quot;&gt;Liquidity refers to how quickly an asset can be converted into cash.&lt;/div&gt;
    &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;T&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;F&quot;&gt;Falso&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;fb&quot; hidden&gt;&lt;b&gt;Vero.&lt;/b&gt; La cassa è liquida per definizione, i crediti e le scorte lo sono meno, gli impianti molto poco. Gli indici di liquidità (current ratio, quick ratio) confrontano le attività più liquide con i debiti a breve.&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;self&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Stock o flusso? Balance sheet e income statement.&lt;/summary&gt;&lt;div&gt;Balance sheet = stock a una data (fotografia). Income statement = flusso di un periodo (film). Il net income del periodo aumenta l&#x27;equity di fine periodo (se non distribuito).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Net income 120.000; equity inizio 900.000, fine 1.100.000. ROE?&lt;/summary&gt;&lt;div&gt;Equity media = 1.000.000 → ROE = 120.000 ÷ 1.000.000 = 12%.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Prezzo €40, EPS €2. P/E? E se l&#x27;EPS sale a €4 a prezzo invariato?&lt;/summary&gt;&lt;div&gt;P/E = 20; con EPS 4 → P/E = 10. A parità di prezzo, più utile per azione = P/E più basso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dove compaiono, nel conto economico, i costi di produzione e quelli di vendita?&lt;/summary&gt;&lt;div&gt;I product costs dei beni venduti nel cost of goods sold; selling e administrative tra gli operating expenses del periodo. Entrambi stanno sopra l&#x27;operating income.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part biblio&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Testi, standard e norme&lt;/h2&gt;
  &lt;p&gt;Le slide non citano autori, testi o norme: sono un quiz senza bibliografia. I riferimenti qui sotto sono stati scelti da me perché coprono esattamente gli argomenti della lezione. Sono tutte &lt;b&gt;fonti esterne&lt;/b&gt; trovate con la ricerca web: non fanno parte del materiale del corso, e il testo di riferimento ufficiale resta quello indicato dal docente.&lt;/p&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer (e Montague) — &lt;em&gt;Managerial Accounting&lt;/em&gt;, McGraw Hill&lt;/h4&gt;
    &lt;p&gt;È il manuale di riferimento per la contabilità direzionale; la pagina dell&#x27;editore indica una release 2026 (18ª edizione). Contiene i capitoli su cost terms (direct/indirect, manufacturing/nonmanufacturing, product/period costs), cost behaviour (fixed, variable, mixed, relevant range, metodi high-low e regressione) e financial statement analysis. &lt;b&gt;Perché conta:&lt;/b&gt; lo stile e il lessico delle domande (casi come Jinan, Rhome, Timchak, Quinonez) sono quelli tipici degli esercizi di questo manuale. Non ho però verificato che le domande vengano da lì.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com/highered/product/managerial-accounting-garrison.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;mheducation.com — Managerial Accounting (Garrison)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;Datar, Rajan — &lt;em&gt;Horngren&#x27;s Cost Accounting: A Managerial Emphasis&lt;/em&gt;, Pearson (Global Edition, 17ª ed.)&lt;/h4&gt;
    &lt;p&gt;Il classico del cost accounting. Va dalle basi (cost object, direct/indirect, cost drivers) a CVP, job costing e activity-based costing. Il suo filo conduttore è “different costs for different purposes”. &lt;b&gt;Perché conta:&lt;/b&gt; è lo stesso principio della Q3 e della Q5: la classificazione di un costo dipende dall&#x27;oggetto e dalla decisione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.pearson.com/en-gb/subject-catalog/p/Datar-Horngren-s-Cost-Accounting-Global-Edition-17th-Edition/P200000004493/9781292363202&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pearson.com — Horngren&#x27;s Cost Accounting, Global Edition&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;IAS 1 — &lt;em&gt;Presentation of Financial Statements&lt;/em&gt; (IFRS Foundation)&lt;/h4&gt;
    &lt;p&gt;Il principio contabile internazionale che definisce il bilancio completo: statement of financial position (balance sheet), statement of profit or loss and other comprehensive income, statement of changes in equity, statement of cash flows e note, con dati comparativi almeno annuali. &lt;b&gt;Perché conta:&lt;/b&gt; risponde in modo ufficiale alla Q18, aggiungendo il prospetto delle variazioni di patrimonio netto e le note.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;IFRS 18 — &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt; (IASB, aprile 2024)&lt;/h4&gt;
    &lt;p&gt;Sostituisce lo IAS 1 per gli esercizi che iniziano dal 1° gennaio 2027. Rende obbligatori nel conto economico i subtotali &lt;em&gt;operating profit&lt;/em&gt; e &lt;em&gt;profit before financing and income taxes&lt;/em&gt;, con le categorie operating, investing e financing, e chiede di spiegare le misure di performance definite dal management. &lt;b&gt;Perché conta:&lt;/b&gt; la Q23 (operating income) diventa un subtotale definito dalla norma proprio nell&#x27;anno accademico 2026-27.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 18&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;IAS 7 — &lt;em&gt;Statement of Cash Flows&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;Disciplina il rendiconto finanziario. Classifica i flussi in operating, investing e financing e ammette il metodo diretto e quello indiretto. Con le modifiche legate all&#x27;IFRS 18, il metodo indiretto partirà dall&#x27;operating profit. &lt;b&gt;Perché conta:&lt;/b&gt; è il terzo prospetto della Q18 e spiega la differenza tra utile e cassa.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;IAS 2 — &lt;em&gt;Inventories&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;Stabilisce come si misura il costo delle rimanenze, compresi i costi di trasformazione (lavoro diretto e overhead di produzione). Gli overhead fissi si imputano in base alla capacità normale: se la produzione è bassa, il fisso per unità &lt;em&gt;non&lt;/em&gt; viene aumentato e la quota non assorbita va a costo del periodo. &lt;b&gt;Perché conta:&lt;/b&gt; collega la distinzione product/period costs (parte 3) e il fisso per unità che sale quando il volume scende (Q12, Q16) alle regole del bilancio.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ext-t&quot;&gt;fonte esterna&lt;/span&gt;
    &lt;h4&gt;Codice civile, art. 2423 — Redazione del bilancio&lt;/h4&gt;
    &lt;p&gt;Per le società italiane che non applicano gli IFRS, il bilancio d&#x27;esercizio è composto da stato patrimoniale (art. 2424), conto economico (art. 2425), rendiconto finanziario (art. 2425-ter) e nota integrativa. Deve essere redatto con chiarezza e rappresentare in modo veritiero e corretto la situazione patrimoniale e finanziaria e il risultato economico. Le società che redigono il bilancio in forma abbreviata sono esonerate dal rendiconto. &lt;b&gt;Perché conta:&lt;/b&gt; è la versione italiana di balance sheet, income statement e cash flow statement.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2423.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;brocardi.it — art. 2423 c.c.&lt;/a&gt; (per il testo ufficiale aggiornato vedi Normattiva)&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;

    q.querySelectorAll(&#x27;.opts .btn&#x27;).forEach(function(b){

          b.setAttribute(&#x27;aria-pressed&#x27;,b.getAttribute(&#x27;aria-pressed&#x27;)===&#x27;true&#x27;?&#x27;false&#x27;:&#x27;true&#x27;);

        b.classList.add(ans.indexOf(v)&gt;=0?&#x27;right&#x27;:&#x27;wrong&#x27;);
        if(ans.indexOf(v)&lt;0){q.querySelectorAll(&#x27;.opts .btn&#x27;).forEach(function(o){if(ans.indexOf(o.getAttribute(&#x27;data-v&#x27;))&gt;=0)o.classList.add(&#x27;right&#x27;)})}

      b.setAttribute(&#x27;aria-selected&#x27;,&#x27;true&#x27;);document.getElementById(b.getAttribute(&#x27;aria-controls&#x27;)).hidden=false;
