      &lt;p class=&quot;small&quot;&gt;Dashed lines show the links between topics. Click a node to go to the section.&lt;/p&gt;

&lt;main&gt;
&lt;!-- ============ 01 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slides 2–3&lt;/span&gt;&lt;h2&gt;Who teaches the course, and what they research&lt;/h2&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Prof. Silvia Pilonato &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Course leader (Unibg). Slide 2 introduces her through three of her articles in international accounting journals: performance measurement in universities, the quality of CSR reports, and social media in the non-profit sector.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Prof. Laura Mazzola &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;&lt;em class=&quot;t&quot;&gt;International visiting professor&lt;/em&gt;. PhD in Business and Law (specialising in &lt;em&gt;Social and environmental Accounting&lt;/em&gt;) at Bergamo; currently Lecturer in Accounting at Royal Holloway, University of London. Research: the role of &lt;em&gt;accounting&lt;/em&gt; and &lt;em&gt;accountability&lt;/em&gt; in decision-making and policy processes aimed at reducing poverty.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt; &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;br&gt;The duty to &lt;i&gt;give an account&lt;/i&gt; of one&#x27;s actions and results to those entitled to it (shareholders, funders, citizens, communities). &lt;em&gt;Accounting&lt;/em&gt; provides the numbers; &lt;em&gt;accountability&lt;/em&gt; is the relationship in which those numbers are used to judge, reward and correct. It is a common thread running through the whole course.&lt;/div&gt;

  &lt;h3&gt;The three featured articles&lt;/h3&gt;
  &lt;p&gt;The slides show only the first pages. The content below comes from web research (&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;); full links are in &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Articles&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Universities and levers of control&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Quality of CSR reports&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Donors and social media&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Pilonato &amp;amp; Monfardini (2020)&lt;/b&gt;, &lt;i&gt;The British Accounting Review&lt;/i&gt;. Examines a new &lt;em class=&quot;t&quot;&gt;performance measurement system&lt;/em&gt; (PMS) for assessing teaching quality in Italian universities, using Simons&#x27; &lt;em&gt;levers of control&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;Findings: &lt;em&gt;belief systems&lt;/em&gt; make the reform acceptable; &lt;em&gt;diagnostic&lt;/em&gt; control is dominated by bureaucratic procedures; indicators act as a &lt;em&gt;boundary system&lt;/em&gt;; administrative staff and academics perceive the &lt;em&gt;interactive&lt;/em&gt; potential of the system differently. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v52y2020i3s0890838920300287.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Michelon, Pilonato &amp;amp; Ricceri (2015)&lt;/b&gt;, &lt;i&gt;Critical Perspectives on Accounting&lt;/i&gt;. Analyses three &lt;em class=&quot;t&quot;&gt;CSR reporting&lt;/em&gt; practices: &lt;em&gt;stand-alone&lt;/em&gt; reports, external &lt;em&gt;assurance&lt;/em&gt; and reporting guidelines (e.g. GRI). Are they signs of genuine accountability or symbolic gestures?&lt;/p&gt;
      &lt;p&gt;Finding: companies that adopt them do &lt;b&gt;not&lt;/b&gt;, in general, disclose higher-quality information, which suggests symbolic use. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ore.exeter.ac.uk/repository/handle/10871/17245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Exeter repository&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Alexander, Pilonato &amp;amp; Redigolo (2023)&lt;/b&gt;, &lt;i&gt;The British Accounting Review&lt;/i&gt;. Do institutional donors (banking foundations) reward non-profits that are active on social media?&lt;/p&gt;
      &lt;p&gt;Finding: organisations with more activity and &lt;em&gt;engagement&lt;/em&gt; receive larger grants and less stringent oversight. The benefit appears to be linked to accountability content: a more informal, two-way form of giving account. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v55y2023i5s0890838922001093.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A framework worth knowing: Simons&#x27; levers of control &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The title of the first article refers to the &lt;em class=&quot;t&quot;&gt;levers of control&lt;/em&gt;, the framework developed by Robert Simons (1995) and widely used in management accounting. It is useful from the outset because it explains what the course means when it links control systems to strategy.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;locT&quot;&gt;
      &lt;title id=&quot;locT&quot;&gt;Four levers around strategy: belief, boundary, diagnostic, interactive.&lt;/title&gt;
      &lt;circle cx=&quot;380&quot; cy=&quot;165&quot; r=&quot;70&quot; class=&quot;f-tone&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h t-paper&quot; style=&quot;fill:var(--paper)&quot;&gt;Business&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot; style=&quot;fill:var(--paper)&quot;&gt;strategy&lt;/text&gt;
      &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;50&quot; class=&quot;svg-h&quot;&gt;Belief systems&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;74&quot; class=&quot;svg-s&quot;&gt;values, mission, vision&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;94&quot; class=&quot;svg-s&quot;&gt;→ inspire and give direction&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;114&quot; class=&quot;svg-s&quot;&gt;risk: uncertainty about what to do&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;490&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;508&quot; y=&quot;50&quot; class=&quot;svg-h&quot;&gt;Boundary systems&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;74&quot; class=&quot;svg-s&quot;&gt;codes of conduct, prohibitions&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;94&quot; class=&quot;svg-s&quot;&gt;→ set the limits&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;114&quot; class=&quot;svg-s&quot;&gt;risk: improper behaviour&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Interactive control&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;254&quot; class=&quot;svg-s&quot;&gt;ongoing dialogue on key data&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;274&quot; class=&quot;svg-s&quot;&gt;→ learning, emergent strategies&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;294&quot; class=&quot;svg-s&quot;&gt;risk: strategic uncertainties&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;490&quot; y=&quot;200&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;508&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Diagnostic control&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;254&quot; class=&quot;svg-s&quot;&gt;targets, KPIs, budgets, variances&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;274&quot; class=&quot;svg-s&quot;&gt;→ monitor and correct&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;294&quot; class=&quot;svg-s&quot;&gt;risk: critical performance variables&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;s-tone&quot; d=&quot;M270 90 L320 125 M490 90 L440 125 M270 250 L320 205 M490 250 L440 205&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;&quot;positive&quot; levers that inspire / constrain&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;numbers-based levers&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Diagram drawn from descriptions of Simons&#x27; (1995) framework. Source: &lt;a href=&quot;https://www.icaew.com/technical/business/Business-performance-management/BPM-tools-templates-and-case-studies/Levers-of-Control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, Levers of Control&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Budgets, variances and KPIs, which the course will cover, are typically &lt;b&gt;diagnostic controls&lt;/b&gt;. When management uses them to discuss and challenge the strategy (not just to correct variances), they become &lt;b&gt;interactive&lt;/b&gt;. This is why the same tool can be &quot;accounting&quot; or &quot;strategic&quot; depending on how it is used. &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between accounting and accountability?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Accounting produces information (measures, reports). Accountability is the relationship in which someone must give an account to someone else using that information. Accounting can exist without genuine accountability, as the article on &quot;symbolic&quot; CSR reports shows.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;An annual budget checked only at year end to explain variances: which of Simons&#x27; levers is this?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;&lt;b&gt;Diagnostic control&lt;/b&gt;: performance is measured against a target and action is taken on the variance.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does the CSR reporting study suggest about the use of standards and assurance?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;That adopting them does not guarantee higher-quality reports: they can be used symbolically, to gain legitimacy rather than to genuinely give an account.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 02 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 4 · About the course&lt;/span&gt;&lt;h2&gt;Management control systems from a strategic perspective&lt;/h2&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Management control system (MCS)&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; + &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;br&gt;The set of tools, processes and information (budgets, costs, indicators, responsibility centres, incentives) through which management ensures that people&#x27;s decisions and behaviour are directed towards the organisation&#x27;s objectives. According to the slide, it is &quot;a fundamental dimension in any organisation&quot;: &lt;b&gt;profit, non-profit and public administration&lt;/b&gt;.&lt;/div&gt;

  &lt;p&gt;The aim of the course &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; is to provide an &lt;b&gt;in-depth understanding of MCS from a strategic perspective&lt;/b&gt;, that is, of the links between three elements, and to understand &lt;i&gt;whether and how&lt;/i&gt; a given MCS can guide internal decision-making for strategic purposes.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;triT&quot;&gt;
      &lt;title id=&quot;triT&quot;&gt;Triangle: accounting numbers, behavioral and cultural dimensions, managerial decisions, with strategy at the centre.&lt;/title&gt;
      &lt;path d=&quot;M380 40 L640 280 L120 280 Z&quot; class=&quot;f-tint&quot;/&gt;
      &lt;circle cx=&quot;380&quot; cy=&quot;200&quot; r=&quot;46&quot; class=&quot;f-tone&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot; style=&quot;fill:var(--paper)&quot;&gt;strategy&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;10&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Accounting numbers&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;costs, budgets, KPIs&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;262&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;135&quot; y=&quot;286&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Behavioral &amp;amp; cultural&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;306&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;motivation, values, incentives&lt;/text&gt;
      &lt;rect x=&quot;520&quot; y=&quot;262&quot; width=&quot;230&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;635&quot; y=&quot;286&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Managerial decisions&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;306&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;invest, cut, set prices&lt;/text&gt;
      &lt;text x=&quot;215&quot; y=&quot;160&quot; class=&quot;svg-s&quot; transform=&quot;rotate(-42 215 160)&quot;&gt;numbers change behaviour&lt;/text&gt;
      &lt;text x=&quot;500&quot; y=&quot;128&quot; class=&quot;svg-s&quot; transform=&quot;rotate(42 500 128)&quot;&gt;numbers inform choices&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;culture filters decisions&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The three links mentioned on slide 4. Summary diagram.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Types of organisation&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Non-profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Public administration&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Primary objective:&lt;/b&gt; creating economic value for the owners. The MCS links competitive strategy (cost leadership, differentiation) to margins, ROI and market share. &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Primary objective:&lt;/b&gt; the social mission; the economic result is a constraint, not the goal. The MCS must also account to donors and funders (see the study on foundations in section 01). &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Primary objective:&lt;/b&gt; public value and the proper use of citizens&#x27; resources. Control often originates from top-down reforms, such as the university PMS studied by Pilonato and Monfardini. &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Management accounting vs financial accounting &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The slide takes it for granted, but this distinction is at the heart of the final case (section 07):&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial accounting&lt;/th&gt;&lt;th&gt;Management accounting&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Users&lt;/b&gt;&lt;/td&gt;&lt;td&gt;External: shareholders, tax authorities, banks&lt;/td&gt;&lt;td&gt;Internal: managers at all levels&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rules&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Mandatory, accounting standards (e.g. IFRS)&lt;/td&gt;&lt;td&gt;Voluntary, tailor-made&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Time horizon&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Past, annual/quarterly periods&lt;/td&gt;&lt;td&gt;Past and future (budgets, forecasts)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Focus&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The entity as a whole&lt;/td&gt;&lt;td&gt;Products, customers, departments, activities&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Information&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Monetary, verifiable&lt;/td&gt;&lt;td&gt;Monetary and non-monetary (quality, time, satisfaction)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Purpose&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Compliance and transparency&lt;/td&gt;&lt;td&gt;Decision-making, control, strategy&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which three elements does the &quot;strategic&quot; perspective on MCS bring together?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Accounting numbers; behavioral and cultural dimensions; managerial decisions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does a public body, which does not seek profit, also need an MCS?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Because there, too, decisions and behaviour must be directed towards objectives (services, efficiency, public value), and the use of resources must be accounted for. The slide states explicitly that the MCS is fundamental in profit, non-profit and public administration.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is a report required by the tax authorities management or financial accounting?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Financial (and tax) accounting: it is mandatory, follows external rules and is addressed to third parties.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 03 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 5 · Why… learning objectives&lt;/span&gt;&lt;h2&gt;What you will be able to do by the end&lt;/h2&gt;&lt;/div&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;1&lt;/span&gt;Recap of the cost basics&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;A review of basic cost concepts: everything else builds on them.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cost object&lt;/h4&gt;&lt;p&gt;Anything for which a cost measurement is required: a product, a customer, a department, a project.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Direct vs indirect costs&lt;/h4&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Direct costs&lt;/em&gt;: can be traced to the cost object directly and economically (the raw materials in a product). &lt;em class=&quot;t&quot;&gt;Indirect costs&lt;/em&gt; (or &lt;em&gt;overhead&lt;/em&gt;): shared, so they must be &lt;i&gt;allocated&lt;/i&gt; using an allocation base (factory rent).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Variable vs fixed costs&lt;/h4&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Variable&lt;/em&gt;: change in proportion to volume. &lt;em class=&quot;t&quot;&gt;Fixed&lt;/em&gt;: remain constant within the &lt;em&gt;relevant range&lt;/em&gt; (the range of volumes over which the assumptions hold).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Contribution margin&lt;/h4&gt;&lt;p&gt;Price minus variable cost per unit: how much each unit contributes towards covering fixed costs and then generating profit.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Total cost = &lt;i&gt;FC&lt;/i&gt; + &lt;i&gt;v&lt;/i&gt; × Q &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Break-even Q = &lt;i&gt;FC&lt;/i&gt; ÷ (P − &lt;i&gt;v&lt;/i&gt;)&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;FC = fixed costs, v = variable cost per unit, P = price, Q = quantity. This formula underlies the flexible budget simulator below.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;2&lt;/span&gt;Control systems &amp;amp; corporate governance&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Management control&lt;/em&gt; serves to align people&#x27;s actions with the organisation&#x27;s objectives. &lt;em class=&quot;t&quot;&gt;Corporate governance&lt;/em&gt; is the system of rules and bodies (board of directors, committees, audit, incentive schemes) through which owners direct and control those who manage the firm.&lt;/p&gt;
    &lt;p&gt;The link between the two is the &lt;em class=&quot;t&quot;&gt;principal–agent problem&lt;/em&gt; (agency problem): those who delegate (the &lt;i&gt;principal&lt;/i&gt;, e.g. shareholders) and those who manage (the &lt;i&gt;agent&lt;/i&gt;, e.g. managers) may have different interests and information. Control and measurement systems reduce this information asymmetry.&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;The principal delegates to the agent; the agent gives account through information&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Principal&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;shareholders, board&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Agent&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;managers&lt;/text&gt;
      &lt;path d=&quot;M185 45 H452&quot; class=&quot;s-tone&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;delegation, objectives, incentives&lt;/text&gt;
      &lt;path d=&quot;M455 78 H190&quot; class=&quot;s-acc&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;accountability: reports, KPIs, budgets&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;3&lt;/span&gt;Activity-based costing (ABC)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Activity-based costing&lt;/em&gt; assigns overhead to products according to the &lt;b&gt;activities&lt;/b&gt; they consume, rather than through a single base (e.g. direct labour hours). Key idea: &lt;i&gt;products consume activities, activities consume resources&lt;/i&gt;.&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;Step 1 · Identify the activities&lt;/h4&gt;&lt;p&gt;E.g. machine setups, quality inspection, order handling, materials handling.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · Create the cost pools&lt;/h4&gt;&lt;p&gt;Group the indirect costs of each activity (people, machines, space) into a single &quot;container&quot; (&lt;em&gt;activity cost pool&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Choose the cost driver&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt; is the factor that &quot;causes&quot; the cost of the activity: number of setups, number of inspections, number of orders.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Calculate the rate&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Activity rate = cost pool ÷ total quantity of the driver&lt;/div&gt;&lt;p&gt;E.g. setups: €60,000 ÷ 300 setups = €200 per setup.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 5 · Assign costs to products&lt;/h4&gt;&lt;p&gt;Assigned cost = activity rate × driver quantity consumed. A niche product requiring 100 setups is assigned €20,000 of setup costs even if it uses few labour hours: the traditional method would have &lt;b&gt;undercosted&lt;/b&gt; it.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;ABC was popularised by Cooper &amp;amp; Kaplan (1988): see &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot; open&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;4&lt;/span&gt;Budgeting: master &amp;amp; flexible budgeting&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;master budget&lt;/em&gt; is the comprehensive operating and financial plan for the next period, built as a &quot;cascade&quot; starting from sales. The &lt;em class=&quot;t&quot;&gt;flexible budget&lt;/em&gt; recalculates budgeted costs and revenues at the &lt;b&gt;actual volume achieved&lt;/b&gt;, so that the comparison with actual results is meaningful. It is the subject of the first assignment (slide 11).&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Master budget sequence&quot;&gt;

        &lt;rect x=&quot;130&quot; y=&quot;20&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;48&quot; class=&quot;svg-t&quot;&gt;Production&lt;/text&gt;
        &lt;rect x=&quot;255&quot; y=&quot;0&quot; width=&quot;120&quot; height=&quot;36&quot; rx=&quot;10&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;23&quot; class=&quot;svg-s&quot;&gt;Materials&lt;/text&gt;
        &lt;rect x=&quot;255&quot; y=&quot;44&quot; width=&quot;120&quot; height=&quot;36&quot; rx=&quot;10&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;67&quot; class=&quot;svg-s&quot;&gt;Labour · Overhead&lt;/text&gt;
        &lt;rect x=&quot;390&quot; y=&quot;20&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;48&quot; class=&quot;svg-t&quot;&gt;COGS&lt;/text&gt;
        &lt;rect x=&quot;515&quot; y=&quot;20&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;40&quot; class=&quot;svg-t&quot;&gt;Budgeted&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;56&quot; class=&quot;svg-s&quot;&gt;income stat.&lt;/text&gt;
        &lt;rect x=&quot;640&quot; y=&quot;20&quot; width=&quot;115&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;697&quot; y=&quot;48&quot; class=&quot;svg-t&quot;&gt;Cash budget&lt;/text&gt;
        &lt;rect x=&quot;515&quot; y=&quot;96&quot; width=&quot;240&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;121&quot; class=&quot;svg-t&quot;&gt;Budgeted balance sheet&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M115 43 H126 M240 43 H251 M375 43 H386 M500 43 H511 M625 43 H636&quot; class=&quot;s-ink&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;path d=&quot;M697 66 V92&quot; class=&quot;s-ink&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;5&quot; y=&quot;110&quot; class=&quot;svg-s&quot;&gt;operating budget →&lt;/text&gt;&lt;text x=&quot;5&quot; y=&quot;128&quot; class=&quot;svg-s&quot;&gt;financial budget →&lt;/text&gt;

    &lt;h4&gt;Simulator: static vs flexible budget&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Hypothetical practice example: budgeted price €10, variable cost €6/unit, fixed costs €12,000, budgeted volume 5,000 units. Actual: price €9.80, variable cost €6.30/unit, fixed costs €12,500. Move the actual volume slider.&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fbQ&quot;&gt;Actual volume sold (units)&lt;/label&gt;&lt;output id=&quot;fbQo&quot;&gt;6,000&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;fbQ&quot; min=&quot;3000&quot; max=&quot;7000&quot; step=&quot;100&quot; value=&quot;6000&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 340&quot; id=&quot;fbChart&quot; role=&quot;img&quot; aria-label=&quot;Chart of costs and revenues as volume changes&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
        &lt;div&gt;
          &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;fbTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
          &lt;p class=&quot;small&quot; id=&quot;fbMsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Static-budget variance = &lt;i&gt;Sales-volume variance&lt;/i&gt; + &lt;i&gt;Flexible-budget variance&lt;/i&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Sales-volume variance&lt;/b&gt; = flexible − static: it depends &lt;i&gt;only&lt;/i&gt; on having sold more or less than planned. &lt;b&gt;Flexible-budget variance&lt;/b&gt; = actual − flexible: it measures efficiency and prices at the same volume. F = &lt;i&gt;favorable&lt;/i&gt; (increases operating income), U = &lt;i&gt;unfavorable&lt;/i&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;5&lt;/span&gt;Responsibility accounting&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Responsibility accounting&lt;/em&gt; measures each manager&#x27;s performance on the basis of what they are responsible for. The organisation is divided into &lt;em class=&quot;t&quot;&gt;responsibility centres&lt;/em&gt;:&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;Responsibility centres&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Cost&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Revenue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Investment&lt;/button&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Cost centre&lt;/b&gt;: the manager is accountable for costs (e.g. production department, IT). Measure: actual costs vs flexible budget.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Revenue centre&lt;/b&gt;: accountable for revenues (e.g. regional sales area). Measures: revenues, volumes, sales mix.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Profit centre&lt;/b&gt;: accountable for revenues and costs (e.g. product division). Measures: contribution margin, operating income.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Investment centre&lt;/b&gt;: also accountable for invested capital. Typical measures:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ROI = operating income ÷ invested capital &amp;nbsp;·&amp;nbsp; RI = income − (required rate of return × capital)&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Key principle: the &lt;em class=&quot;t&quot;&gt;controllability principle&lt;/em&gt;, i.e. a manager should be evaluated only on what they can actually influence.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;6&lt;/span&gt;Balanced Scorecard &amp;amp; Sustainable BSC&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;Balanced Scorecard&lt;/em&gt; (BSC) translates strategy into objectives and measures across four perspectives, balancing financial and non-financial measures, as well as outcome and process measures. The &lt;em class=&quot;t&quot;&gt;strategy map&lt;/em&gt; links the objectives through cause-and-effect relationships (from bottom to top). The &lt;em class=&quot;t&quot;&gt;Sustainability BSC&lt;/em&gt; integrates environmental and social aspects. It is the subject of the December group work.&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;sbscBtn&quot; aria-pressed=&quot;false&quot;&gt;Show the Sustainability version (SBSC)&lt;/button&gt;&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 400&quot; role=&quot;img&quot; aria-labelledby=&quot;bscT&quot; id=&quot;bsc&quot;&gt;
      &lt;title id=&quot;bscT&quot;&gt;Strategy map with four perspectives: learning and growth, internal processes, customer, financial.&lt;/title&gt;
      &lt;g text-anchor=&quot;middle&quot;&gt;

        &lt;rect x=&quot;150&quot; y=&quot;105&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;135&quot; class=&quot;svg-h&quot;&gt;Customer&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;157&quot; class=&quot;svg-s&quot;&gt;how do customers see us? · satisfaction, retention&lt;/text&gt;
        &lt;rect x=&quot;150&quot; y=&quot;200&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Internal business processes&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;252&quot; class=&quot;svg-s&quot;&gt;what must we excel at? · quality, cycle time&lt;/text&gt;
        &lt;rect x=&quot;150&quot; y=&quot;295&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;325&quot; class=&quot;svg-h&quot;&gt;Learning &amp;amp; growth&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;347&quot; class=&quot;svg-s&quot;&gt;can we continue to improve and innovate? · skills, systems&lt;/text&gt;

      &lt;g id=&quot;sbscLayer&quot; style=&quot;opacity:0;transition:opacity .4s&quot;&gt;
        &lt;rect x=&quot;625&quot; y=&quot;10&quot; width=&quot;125&quot; height=&quot;355&quot; rx=&quot;12&quot; style=&quot;fill:oklch(70% 0.1 150 / .18);stroke:oklch(55% 0.11 150);stroke-dasharray:6 4;stroke-width:1.6&quot;/&gt;

  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;7&lt;/span&gt;MA, human rights and Business Technologies&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;The final block takes management accounting (MA) to two frontiers, in line with objective 6:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Human rights&lt;/h4&gt;&lt;p&gt;Companies are expected to identify, measure and report their impacts on human rights (labour, supply chains, communities). The international reference framework is the UN Guiding Principles on Business and Human Rights (2011) &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;. This connects to Laura Mazzola&#x27;s research on accounting and poverty.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business technologies&lt;/h4&gt;&lt;p&gt;ERP systems, big data, analytics, automation and AI are changing how cost and performance data are collected and used, and are shifting the management accountant from recording data to analysing it and acting as a business partner: the same theme as the case in section 07.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Budgeted volume 5,000 units, actual 6,000 units. Why is comparing actual costs with the static master budget misleading?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Because variable costs &lt;i&gt;were expected&lt;/i&gt; to rise with volume: the comparison would show an unfavorable variance even with perfect efficiency. The flexible budget recalculates them at 6,000 units and isolates the efficiency/price effect.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the example, what is the sales-volume variance at 6,000 units?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;(6,000 − 5,000) × unit contribution margin of €4 = &lt;b&gt;€4,000 F&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the idea behind ABC?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Products consume activities and activities consume resources: overhead is assigned using activity cost drivers, not a single volume-based allocation base.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A division manager is accountable for revenues, costs and invested capital: what type of centre is this?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;An &lt;b&gt;investment centre&lt;/b&gt; (measures: ROI, residual income).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the four BSC perspectives, from the bottom to the top of the strategy map?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Learning &amp;amp; growth → Internal business processes → Customer → Financial.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 05 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;05&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 7 · How… pedagogical approach&lt;/span&gt;&lt;h2&gt;Active learning: learning by doing&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;formula&quot; style=&quot;white-space:normal;text-align:center;font-size:1.3rem;line-height:1.7&quot;&gt;
        &lt;i&gt;Active learning&lt;/i&gt; + &lt;i&gt;Student centered&lt;/i&gt;&lt;br&gt;&lt;span style=&quot;display:block;border-top:1.5px solid var(--ink);margin:4px 20%&quot;&gt;&lt;/span&gt;&lt;b&gt;Effective learning&lt;/b&gt; (&amp;amp; fun)
      &lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; Classes involve students&#x27; active participation, following an &lt;em class=&quot;t&quot;&gt;active learning&lt;/em&gt; approach: group work, case discussions, integrated exercises. The learning process works better when students play an active role. &lt;em class=&quot;t&quot;&gt;Peer-to-peer&lt;/em&gt; relationships are important and encouraged.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Does it really work? &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;A meta-analysis of 225 studies (Freeman et al., &lt;i&gt;PNAS&lt;/i&gt; 2014) found that active learning raises exam scores by about 0.47 standard deviations, and that students taught through traditional lecturing are about 1.5 times more likely to fail. The study covers STEM courses, but the principle applies here too.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC4060654/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Full text on PubMed Central&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;What this means for you&lt;/b&gt; &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;: come to class having read the material (slides are published in advance), bring questions, and work with your classmates. This is consistent with the request on slide 9 to come to class &quot;fully prepared&quot;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which three activities does the slide give as examples of active learning?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Group work, case discussions, integrated exercises.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which &quot;formula&quot; summarises the course&#x27;s approach?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Active learning + student centered = effective learning (&amp;amp; fun).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 06 ============ --&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;36&lt;/div&gt;&lt;p&gt;lectures &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;9 ECTS&lt;/div&gt;&lt;p&gt;European Credit Transfer System. 1 ECTS ≈ 25–30 hours of total student workload, i.e. roughly &lt;b&gt;225–270 hours&lt;/b&gt; &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;12 h&lt;/div&gt;&lt;p&gt;tutoring, in 6 online sessions (&quot;more info coming soon&quot;) &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;margin-top:16px&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;

  &lt;h3&gt;Attending or non-attending?&lt;/h3&gt;
  &lt;p&gt;There are &lt;b&gt;two voluntary in-class activities&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slides 10–13&lt;/span&gt;. Students who complete &lt;b&gt;both&lt;/b&gt; are &lt;em class=&quot;t&quot;&gt;attending students&lt;/em&gt;: they receive bonus points and sit a shorter exam. Those who complete only one are considered &lt;em class=&quot;t&quot;&gt;non-attending&lt;/em&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No. 1 · Assignment on Flexible Budget&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Individual&lt;/b&gt;, end of October (probably Monday 26th). Set during a class; you work alone and hand it in at the end of the class. &lt;b&gt;0–2 points.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No. 2 · Work group on Balanced Scorecard&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Groups of 4–5&lt;/b&gt;, December. Groups and cases are presented in class; 5–7 days of independent work; PowerPoint sent to the lecturers in advance; discussion over two classes with all members present. &lt;b&gt;0–3 points&lt;/b&gt; for each member.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Status and bonus simulator&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Choose which activities you take part in and the points you obtain. The points are assumed to be added to the written exam mark, as slide 13 states (&quot;added to students&#x27; evaluation during the final exam&quot;). How the cap of 30 and honours (lode) are handled is not specified: ask the lecturers.&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;simA&quot; aria-pressed=&quot;true&quot;&gt;Flexible Budget assignment&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;simB&quot; aria-pressed=&quot;true&quot;&gt;BSC group work&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptA&quot;&gt;Assignment points (0–2)&lt;/label&gt;&lt;output id=&quot;ptAo&quot;&gt;1.5&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptA&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.5&quot; value=&quot;1.5&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptB&quot;&gt;Group work points (0–3)&lt;/label&gt;&lt;output id=&quot;ptBo&quot;&gt;2.5&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptB&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2.5&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptE&quot;&gt;Written exam mark (/30)&lt;/label&gt;&lt;output id=&quot;ptEo&quot;&gt;24&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptE&quot; min=&quot;18&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;24&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot; id=&quot;simOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Assessment&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Attending&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Non-attending&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;When&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Three-part assessment &lt;span class=&quot;tag sl&quot;&gt;slide 18&lt;/span&gt;:&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;individual work during the course (written output)&lt;/li&gt;&lt;li&gt;group work during the course (case presentation to classmates)&lt;/li&gt;&lt;li&gt;final written exam (multiple choice, exercises, case discussion), &lt;b&gt;shorter&lt;/b&gt;&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Only students who complete both part 1 and part 2 are considered &quot;attending&quot;. This must be declared by &lt;b&gt;8 October&lt;/b&gt; via the quiz on the SMA e-learning page.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Final written exam only (multiple choice, exercises, case discussion), &lt;b&gt;longer&lt;/b&gt; than the attending students&#x27; exam &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; slide 19 says &quot;longer than the exam of non-attending students&quot;: this is a typo and should read &quot;of attending students&quot;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Winter&lt;/h4&gt;&lt;p&gt;January–February, 2 exam dates. &lt;b&gt;Different&lt;/b&gt; exams for attending and non-attending students. Attending students must sit the exam in the winter session.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Summer&lt;/h4&gt;&lt;p&gt;June–July, 2 exam dates + September, 1 exam date. &lt;b&gt;Same exam for everyone&lt;/b&gt; (non-attending format, as suggested by the note &quot;exam non-attendance…???&quot;).&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Registration is compulsory by the deadline via &lt;b&gt;Sportello Internet&lt;/b&gt; (the university&#x27;s online student portal).&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; slide 10 says &quot;by the end of February 2025&quot;: this appears to be left over from the previous year. For a.y. 2026-27 it will presumably be February 2027: please check.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Written exam criteria&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slides 18–19&lt;/span&gt;&lt;br&gt;Completeness of the knowledge acquired and the ability to carry out &lt;i&gt;problem-solving&lt;/i&gt;-oriented analysis through specific exercises (multiple choice and/or exercises).&lt;/div&gt;

  &lt;h3&gt;Materials&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Textbook&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Strategic Management Accounting&lt;/i&gt; (2023), Silvia Pilonato and Chiara Oppi, McGraw-Hill Create (custom edition for the course). Additional materials: slides, research articles, cases, exercises.&lt;/p&gt;&lt;p&gt;&lt;b&gt;All materials are required for the exam.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;E-learning and contacts&lt;/h4&gt;&lt;p&gt;Course &quot;Strategic Management Accounting a.y. 2026-27&quot;, code &lt;b&gt;900003-ENG&lt;/b&gt;; the enrolment key is on slide 15. Office hours by appointment via e-mail (address on slide 16).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;You take part only in the flexible budget assignment. What is your status?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;&lt;b&gt;Non-attending&lt;/b&gt;: both activities are required. You sit the longer exam.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the maximum bonus for an attending student?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;2 (assignment) + 3 (group work) = &lt;b&gt;5 points&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;By when must you declare your participation?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;By &lt;b&gt;8 October&lt;/b&gt;, via the quiz on the SMA e-learning page.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In June, is the exam different for attending and non-attending students?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;No: in the summer session (June–July and September) the exam is the same for everyone.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How many hours of work do 9 ECTS correspond to?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;About 225–270 hours (25–30 hours per credit), including classes, independent study and exam preparation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 07 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;07&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slides 21–24 · Let&#x27;s start…&lt;/span&gt;&lt;h2&gt;The case: “accountant, keep out of my department”&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;First discussion exercise. You are a newly hired accountant, and a plant manager tells you:&lt;/p&gt;
  &lt;blockquote&gt;As I see it, our accountants may be needed to keep records for shareholders and for the tax authorities – but I do not want them sticking their noses in my day-to-day operations. I do the best I know how. No pen-pushing bean-counter knows enough about my responsibilities to be of any use to me.&lt;/blockquote&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;em&gt;Bean counter&lt;/em&gt; = the stereotype of the accountant obsessed with numbers; &lt;em&gt;pen-pushing&lt;/em&gt; = bureaucratic. The slide reads &quot;bean-corner&quot;, a typo for &lt;em&gt;bean-counter&lt;/em&gt;. The manager sees only &lt;b&gt;financial accounting&lt;/b&gt; (section 02).&lt;/p&gt;

  &lt;p&gt;&lt;b&gt;Think first:&lt;/b&gt; how would you respond? Then go through the six responses proposed in the slides.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Clarifying the Role&lt;/h4&gt;&lt;p&gt;&quot;We are not here just to keep records: our role is to give you information to run operations more efficiently, for example by identifying &lt;em class=&quot;t&quot;&gt;cost drivers&lt;/em&gt; and areas where resources are being wasted.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Link: ABC (topic 3).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Collaboration, not Interference&lt;/h4&gt;&lt;p&gt;&quot;We don&#x27;t want to tell you how to run the plant. We want to support your decisions with reliable data and analysis, so that your experience is complemented by &lt;em&gt;evidence-based insights&lt;/em&gt;.&quot;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · From Compliance to Value Creation&lt;/h4&gt;&lt;p&gt;&quot;We have to meet our reporting obligations, but our role goes further: by analysing costs, budgets and performance we can create value and give you a clearer picture of how operations affect profitability.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Link: budgeting and flexible budgets (topic 4).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Business Partner Approach&lt;/h4&gt;&lt;p&gt;&quot;Instead of being &#x27;bean counters&#x27;, we can be &lt;em class=&quot;t&quot;&gt;business partners&lt;/em&gt;: for example, providing data to assess whether a new machine is worth the investment or whether changing a process would reduce waste.&quot;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Respecting Managerial Expertise&lt;/h4&gt;&lt;p&gt;&quot;You know how to run the plant; we know how to interpret financial and non-financial data. By combining the two perspectives, the company makes sounder decisions.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Link: non-financial data, Balanced Scorecard (topic 6).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Addressing Stereotypes&lt;/h4&gt;&lt;p&gt;&quot;I know accountants have a reputation as pen-pushers. But modern management accounting is proactive, strategic and supportive of operations: it helps managers succeed rather than interfering.&quot;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-labelledby=&quot;evoT&quot;&gt;
    &lt;title id=&quot;evoT&quot;&gt;Evolution of the role: from scorekeeper to business partner.&lt;/title&gt;
    &lt;defs&gt;&lt;linearGradient id=&quot;g1&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; style=&quot;stop-color:var(--rule)&quot;/&gt;&lt;stop offset=&quot;1&quot; style=&quot;stop-color:var(--acc)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
    &lt;path d=&quot;M30 120 L730 120 L730 100 L760 125 L730 150 L730 130 L30 130 Z&quot; fill=&quot;url(#g1)&quot;/&gt;
    &lt;g text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;110&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Scorekeeper&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;records, complies with rules&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Analyst&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;explains costs and variances&lt;/text&gt;
      &lt;text x=&quot;640&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Business partner&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;shares decisions, looks at strategy&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;160&quot; class=&quot;svg-s&quot;&gt;compliance&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;160&quot; class=&quot;svg-s&quot;&gt;value creation&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Visual summary of the six responses &lt;span class=&quot;tag int&quot;&gt;addition&lt;/span&gt;. This case connects to the first learning objective: the historical developments of management accounting.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What conceptual mistake does the plant manager make?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;They equate all of accounting with financial/tax accounting for external parties, and ignore management accounting, which produces information for internal decision-making.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Give a concrete example of &quot;business partner&quot; support for the plant manager.&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Assessing whether a new machine is worth the investment, identifying the cost drivers of waste, building a flexible budget that shows the department&#x27;s efficiency net of volume effects.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does response 5 (respecting expertise) also matter in terms of &quot;behavioral dimensions&quot;?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Because an MCS only works if those subject to it accept it. Acknowledging the manager&#x27;s expertise reduces resistance and ensures the numbers are actually used in decisions: this is the link between numbers, behaviour and decisions from section 02.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--h:35&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;External sources&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Authors, studies, texts and standards cited or referred to in the slides. Unless otherwise stated, all information in this section comes from web research and is an &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;src-list&quot;&gt;
    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Pilonato &amp;amp; Monfardini — Performance measurement systems in higher education&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;The British Accounting Review, 52(3), 2020, art. 100908 · DOI 10.1016/j.bar.2020.100908 · cited on slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; qualitative study (interviews with teaching quality managers and degree programme coordinators) of the Italian system for assessing teaching quality, analysed through Simons&#x27; levers of control.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it illustrates an MCS in public administration and shows how the same system is perceived differently by different groups.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v52y2020i3s0890838920300287.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/189206&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Unibg repository (Aisberg)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Michelon, Pilonato &amp;amp; Ricceri — CSR reporting practices and the quality of disclosure&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Critical Perspectives on Accounting, 33, 2015, pp. 59–78 · DOI 10.1016/j.cpa.2014.10.003 · cited on slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; tests whether stand-alone reports, assurance and guidelines (e.g. GRI) are associated with higher-quality CSR disclosure (in terms of content, type of information and managerial orientation).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it warns against confusing the form of reporting with genuine accountability. It is relevant to the Sustainable BSC.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ore.exeter.ac.uk/repository/handle/10871/17245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Exeter repository&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/189198&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Aisberg&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Alexander, Pilonato &amp;amp; Redigolo — Do institutional donors value social media activity and engagement?&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;The British Accounting Review, 55(5), 2023 · DOI 10.1016/j.bar.2022.101169 · cited on slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; survey of Italian non-profits funded by banking foundations, combined with Facebook and Twitter data; greater engagement is associated with larger grants and less restrictive oversight.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; an example of informal accountability in the non-profit sector, one of the three sectors mentioned on slide 4.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v55y2023i5s0890838922001093.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/235531&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Aisberg&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Pilonato &amp;amp; Oppi — Strategic Management Accounting (textbook)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;McGraw-Hill Create, 2023 · slide 17&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; the course textbook, in a custom McGraw-Hill Create edition.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the exam text. &lt;b&gt;Note:&lt;/b&gt; web research did not find a reliable public listing (normal for custom Create editions), so no link is given: refer to the lecturers&#x27; instructions and the e-learning page.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Robert Simons — Levers of Control (1995)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Referred to in the title of the article on slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; four levers of control (belief, boundary, diagnostic, interactive) for balancing innovation and control in implementing strategy.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is one of the key frameworks for analysing MCS &quot;from a strategic perspective&quot;, as the course requires.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/business/Business-performance-management/BPM-tools-templates-and-case-studies/Levers-of-Control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Levers of Control&lt;/a&gt; · &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumSimons95.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW summary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan &amp;amp; Norton — The Balanced Scorecard: Measures That Drive Performance&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Harvard Business Review, Jan–Feb 1992, pp. 71–79 · topic &quot;Balanced Scorecard&quot; (slide 6) and group work (slide 11)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; the article that introduced the BSC: financial measures complemented by operational measures on customers, internal processes, innovation and learning.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the basis for the December group work.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW summary&lt;/a&gt; · &lt;a href=&quot;https://icaew.com/technical/business/business-performance-management/balanced-scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Balanced scorecard&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Figge, Hahn, Schaltegger &amp;amp; Wagner — The Sustainability Balanced Scorecard&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Business Strategy and the Environment, 11(5), 2002, pp. 269–284 · DOI 10.1002/bse.339 · topic &quot;Sustainable BS&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; how to integrate environmental and social aspects into the BSC, including by adding a &quot;non-market&quot; perspective, and the steps for formulating one in a business unit.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the key reference on the SBSC and addresses objective 6 of the course.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://izt.de/publikationen/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IZT — publication page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Cooper &amp;amp; Kaplan — Measure Costs Right: Make the Right Decisions&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Harvard Business Review, 66(5), Sep–Oct 1988, pp. 96–103 · topic &quot;Activity based costing&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; a critique of allocating overhead on the basis of direct labour and a proposal for activity-based costing.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the article that popularised ABC.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ivey Publishing page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ECTS Users&#x27; Guide 2015&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;European Commission, 2015 · ISBN 978-92-79-43562-1 · slide 8&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; the official guide to the use of ECTS credits, adopted by the ministers of the European Higher Education Area in Yerevan (2015); 60 ECTS = one full-time academic year.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it explains what the course&#x27;s 9 ECTS mean in terms of hours of work.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://education.ec.europa.eu/sites/default/files/document-library-docs/ects-users-guide_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official PDF (education.ec.europa.eu)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Freeman et al. — Active learning increases student performance in science, engineering, and mathematics&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;PNAS, 111(23), 2014, pp. 8410–8415 · DOI 10.1073/pnas.1319030111 · approach on slide 7&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; meta-analysis of 225 studies comparing traditional lecturing and active learning.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the most widely cited empirical evidence in support of the course&#x27;s teaching approach.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC4060654/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PubMed Central&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;OHCHR, 2011 · HR/PUB/11/4 · topic &quot;MA, human rights&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Content:&lt;/b&gt; 31 principles based on three pillars (the State duty to protect, the corporate responsibility to respect, access to remedy), unanimously endorsed by the UN Human Rights Council (res. 17/4).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the reference framework for discussing business, management accounting and human rights.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot; style=&quot;margin-top:20px&quot;&gt;&lt;b&gt;Other course materials:&lt;/b&gt; the &lt;code&gt;corso/&lt;/code&gt; folder should contain lectures and exercises on the topics in section 04. It was not possible to list its contents with the tools available, so this summary is based solely on the intro slides. The links between topics follow the programme on slide 6.&lt;/p&gt;
