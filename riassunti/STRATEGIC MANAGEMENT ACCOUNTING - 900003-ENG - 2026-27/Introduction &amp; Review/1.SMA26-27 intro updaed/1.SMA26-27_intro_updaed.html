        &lt;a href=&quot;#s7&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;223&quot; width=&quot;200&quot; height=&quot;54&quot; rx=&quot;12&quot; style=&quot;stroke:oklch(60% 0.11 85)&quot;/&gt;&lt;text class=&quot;n&quot; x=&quot;34&quot; y=&quot;244&quot; style=&quot;fill:oklch(52% 0.1 85)&quot;&gt;07&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;264&quot;&gt;Caso “bean counter”&lt;/text&gt;&lt;/a&gt;
      &lt;/svg&gt;

&lt;!-- ============ 01 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 2–3&lt;/span&gt;&lt;h2&gt;Chi insegna, e su cosa fa ricerca&lt;/h2&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Prof.ssa Silvia Pilonato &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Docente titolare (Unibg). La slide 2 la presenta attraverso tre suoi articoli su riviste internazionali di accounting: misurazione della performance nelle università, qualità dei report CSR, social media nel non-profit.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Prof.ssa Laura Mazzola &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;&lt;em class=&quot;t&quot;&gt;International visiting professor&lt;/em&gt;. PhD in Business and Law (specializzazione in &lt;em&gt;Social and environmental Accounting&lt;/em&gt;) a Bergamo; oggi Lecturer in Accounting alla Royal Holloway, University of London. Ricerca: il ruolo di &lt;em&gt;accounting&lt;/em&gt; e &lt;em&gt;accountability&lt;/em&gt; nei processi decisionali e di policy per ridurre la povertà.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt; &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;br&gt;Il dovere di &lt;i&gt;rendere conto&lt;/i&gt; delle proprie azioni e dei risultati a chi ne ha titolo (azionisti, finanziatori, cittadini, comunità). L&#x27;&lt;em&gt;accounting&lt;/em&gt; fornisce i numeri; l&#x27;&lt;em&gt;accountability&lt;/em&gt; è la relazione in cui quei numeri vengono usati per giudicare, premiare, correggere. È un filo rosso di tutto il corso.&lt;/div&gt;

  &lt;h3&gt;I tre articoli in copertina&lt;/h3&gt;
  &lt;p&gt;Le slide mostrano solo le prime pagine. Il contenuto qui sotto viene dalla ricerca web (&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;); i link completi sono in &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Articoli&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Università e levers of control&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Qualità dei report CSR&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Donatori e social media&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Pilonato &amp;amp; Monfardini (2020)&lt;/b&gt;, &lt;i&gt;The British Accounting Review&lt;/i&gt;. Studia un nuovo &lt;em class=&quot;t&quot;&gt;performance measurement system&lt;/em&gt; (PMS, sistema di misurazione delle prestazioni) per valutare la qualità della didattica nelle università italiane, usando i &lt;em&gt;levers of control&lt;/em&gt; di Simons.&lt;/p&gt;
      &lt;p&gt;Risultati: le &lt;em&gt;belief systems&lt;/em&gt; rendono la riforma accettabile; nel controllo &lt;em&gt;diagnostic&lt;/em&gt; pesano soprattutto le procedure burocratiche; gli indicatori funzionano come &lt;em&gt;boundary system&lt;/em&gt;; personale amministrativo e docenti vedono in modo diverso la capacità &lt;em&gt;interactive&lt;/em&gt; del sistema. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v52y2020i3s0890838920300287.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Michelon, Pilonato &amp;amp; Ricceri (2015)&lt;/b&gt;, &lt;i&gt;Critical Perspectives on Accounting&lt;/i&gt;. Analizza tre pratiche di &lt;em class=&quot;t&quot;&gt;CSR reporting&lt;/em&gt; (rendicontazione di responsabilità sociale): report separati (&lt;em&gt;stand-alone&lt;/em&gt;), &lt;em&gt;assurance&lt;/em&gt; esterna, linee guida (es. GRI). Sono segno di vera accountability o gesti simbolici?&lt;/p&gt;
      &lt;p&gt;Risultato: le imprese che le adottano &lt;b&gt;non&lt;/b&gt; pubblicano in generale informazioni di qualità più alta, il che fa pensare a un uso simbolico. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ore.exeter.ac.uk/repository/handle/10871/17245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Exeter repository&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Alexander, Pilonato &amp;amp; Redigolo (2023)&lt;/b&gt;, &lt;i&gt;The British Accounting Review&lt;/i&gt;. I donatori istituzionali (fondazioni di origine bancaria) premiano le non-profit attive sui social media?&lt;/p&gt;
      &lt;p&gt;Risultato: le organizzazioni con più attività ed &lt;em&gt;engagement&lt;/em&gt; ricevono contributi più alti e una supervisione meno stringente. Il beneficio sembra legato ai contenuti di accountability: un rendere conto più informale e a due vie. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v55y2023i5s0890838922001093.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un modello da conoscere: i levers of control di Simons &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il titolo del primo articolo cita i &lt;em class=&quot;t&quot;&gt;levers of control&lt;/em&gt; (le &quot;leve del controllo&quot;), il modello di Robert Simons (1995) molto usato in management accounting. È utile già adesso perché spiega cosa intende il corso quando lega i sistemi di controllo alla strategia.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;locT&quot;&gt;
      &lt;title id=&quot;locT&quot;&gt;Quattro leve attorno alla strategia: belief, boundary, diagnostic, interactive.&lt;/title&gt;
      &lt;circle cx=&quot;380&quot; cy=&quot;165&quot; r=&quot;70&quot; class=&quot;f-tone&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h t-paper&quot; style=&quot;fill:var(--paper)&quot;&gt;Business&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot; style=&quot;fill:var(--paper)&quot;&gt;strategy&lt;/text&gt;
      &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;50&quot; class=&quot;svg-h&quot;&gt;Belief systems&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;74&quot; class=&quot;svg-s&quot;&gt;valori, mission, vision&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;94&quot; class=&quot;svg-s&quot;&gt;→ ispirano e orientano&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;114&quot; class=&quot;svg-s&quot;&gt;rischio: incertezza su cosa fare&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;490&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;508&quot; y=&quot;50&quot; class=&quot;svg-h&quot;&gt;Boundary systems&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;74&quot; class=&quot;svg-s&quot;&gt;codici di condotta, divieti&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;94&quot; class=&quot;svg-s&quot;&gt;→ fissano i limiti&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;114&quot; class=&quot;svg-s&quot;&gt;rischio: comportamenti scorretti&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Interactive control&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;254&quot; class=&quot;svg-s&quot;&gt;dialogo continuo sui dati chiave&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;274&quot; class=&quot;svg-s&quot;&gt;→ apprendimento, nuove strategie&lt;/text&gt;&lt;text x=&quot;38&quot; y=&quot;294&quot; class=&quot;svg-s&quot;&gt;rischio: incertezze strategiche&lt;/text&gt;&lt;/g&gt;
      &lt;g&gt;&lt;rect x=&quot;490&quot; y=&quot;200&quot; width=&quot;250&quot; height=&quot;110&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;&lt;text x=&quot;508&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Diagnostic control&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;254&quot; class=&quot;svg-s&quot;&gt;target, KPI, budget, scostamenti&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;274&quot; class=&quot;svg-s&quot;&gt;→ monitorano e correggono&lt;/text&gt;&lt;text x=&quot;508&quot; y=&quot;294&quot; class=&quot;svg-s&quot;&gt;rischio: variabili critiche&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;s-tone&quot; d=&quot;M270 90 L320 125 M490 90 L440 125 M270 250 L320 205 M490 250 L440 205&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;leve &quot;positive&quot; che ispirano / limitano&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;leve basate sui numeri&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema disegnato a mano a partire dalle descrizioni del modello di Simons (1995). Fonte: &lt;a href=&quot;https://www.icaew.com/technical/business/Business-performance-management/BPM-tools-templates-and-case-studies/Levers-of-Control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, Levers of Control&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Budget, varianze e KPI, che il corso tratterà, sono tipicamente &lt;b&gt;diagnostic controls&lt;/b&gt;. Quando il management li usa per discutere e mettere in dubbio la strategia (non solo per correggere scostamenti) diventano &lt;b&gt;interactive&lt;/b&gt;. Per questo lo stesso strumento può essere &quot;contabile&quot; o &quot;strategico&quot; a seconda di come lo si usa. &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra accounting e accountability?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;L&#x27;accounting produce informazioni (misure, report). L&#x27;accountability è il rapporto in cui qualcuno deve rendere conto a qualcun altro usando quelle informazioni. Si può avere accounting senza vera accountability, come mostra l&#x27;articolo sui report CSR &quot;simbolici&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un budget annuale controllato solo a fine anno per spiegare gli scostamenti: quale leva di Simons?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;&lt;b&gt;Diagnostic control&lt;/b&gt;: si misura la performance rispetto a un target e si interviene sulla varianza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa suggerisce lo studio sui report CSR sull&#x27;uso di standard e assurance?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Che adottarli non garantisce report di qualità più alta: possono essere usati in modo simbolico, per legittimarsi più che per rendere davvero conto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 02 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 4 · About the course&lt;/span&gt;&lt;h2&gt;Management control systems da una prospettiva strategica&lt;/h2&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Management control system (MCS)&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; + &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;br&gt;L&#x27;insieme di strumenti, processi e informazioni (budget, costi, indicatori, centri di responsabilità, incentivi) con cui il management fa sì che decisioni e comportamenti delle persone vadano verso gli obiettivi dell&#x27;organizzazione. Secondo la slide è &quot;una dimensione fondamentale in qualsiasi organizzazione&quot;: &lt;b&gt;profit, non-profit e public administration&lt;/b&gt;.&lt;/div&gt;

  &lt;p&gt;L&#x27;obiettivo del corso &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; è dare una &lt;b&gt;comprensione profonda degli MCS da una prospettiva strategica&lt;/b&gt;, cioè dei legami tra tre elementi, e capire &lt;i&gt;se e come&lt;/i&gt; un certo MCS può guidare le decisioni interne per fini strategici.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;triT&quot;&gt;
      &lt;title id=&quot;triT&quot;&gt;Triangolo: accounting numbers, behavioral and cultural dimensions, managerial decisions, con al centro la strategia.&lt;/title&gt;
      &lt;path d=&quot;M380 40 L640 280 L120 280 Z&quot; class=&quot;f-tint&quot;/&gt;
      &lt;circle cx=&quot;380&quot; cy=&quot;200&quot; r=&quot;46&quot; class=&quot;f-tone&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot; style=&quot;fill:var(--paper)&quot;&gt;strategia&lt;/text&gt;
      &lt;rect x=&quot;270&quot; y=&quot;10&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Accounting numbers&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;costi, budget, KPI&lt;/text&gt;
      &lt;rect x=&quot;10&quot; y=&quot;262&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;135&quot; y=&quot;286&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Behavioral &amp;amp; cultural&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;306&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;motivazione, valori, incentivi&lt;/text&gt;
      &lt;rect x=&quot;520&quot; y=&quot;262&quot; width=&quot;230&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card&quot;/&gt;
      &lt;text x=&quot;635&quot; y=&quot;286&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Managerial decisions&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;306&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;investire, tagliare, fissare prezzi&lt;/text&gt;
      &lt;text x=&quot;215&quot; y=&quot;160&quot; class=&quot;svg-s&quot; transform=&quot;rotate(-42 215 160)&quot;&gt;i numeri cambiano i comportamenti&lt;/text&gt;
      &lt;text x=&quot;500&quot; y=&quot;128&quot; class=&quot;svg-s&quot; transform=&quot;rotate(42 500 128)&quot;&gt;i numeri informano le scelte&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;la cultura filtra le decisioni&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;I tre legami citati nella slide 4. Disegno di sintesi.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Tipi di organizzazione&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Non-profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Public administration&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Obiettivo dominante:&lt;/b&gt; creare valore economico per la proprietà. L&#x27;MCS collega strategia competitiva (costo, differenziazione) a margini, ROI e quote di mercato. &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Obiettivo dominante:&lt;/b&gt; la missione sociale; il risultato economico è un vincolo, non lo scopo. L&#x27;MCS deve rendere conto anche a donatori e finanziatori (vedi lo studio sulle fondazioni nella sezione 01). &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Obiettivo dominante:&lt;/b&gt; valore pubblico e uso corretto delle risorse dei cittadini. Spesso il controllo nasce da riforme imposte dall&#x27;alto, come il PMS universitario studiato da Pilonato e Monfardini. &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Management accounting vs financial accounting &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La slide la dà per scontata, ma questa distinzione è il cuore del caso finale (sezione 07):&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial accounting&lt;/th&gt;&lt;th&gt;Management accounting&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Per chi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Esterni: azionisti, fisco, banche&lt;/td&gt;&lt;td&gt;Interni: manager a tutti i livelli&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Regole&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Obbligatorio, principi contabili (es. IFRS)&lt;/td&gt;&lt;td&gt;Volontario, disegnato su misura&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Orizzonte&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Passato, periodi annuali/trimestrali&lt;/td&gt;&lt;td&gt;Passato e futuro (budget, previsioni)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Oggetto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;impresa nel suo insieme&lt;/td&gt;&lt;td&gt;Prodotti, clienti, reparti, attività&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Informazioni&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Monetarie, verificabili&lt;/td&gt;&lt;td&gt;Monetarie e non (qualità, tempi, soddisfazione)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Scopo&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Compliance e trasparenza&lt;/td&gt;&lt;td&gt;Decisioni, controllo, strategia&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i tre elementi che la prospettiva &quot;strategica&quot; sugli MCS mette in relazione?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Accounting numbers; dimensioni comportamentali e culturali; decisioni manageriali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché un MCS serve anche a un ente pubblico, che non cerca profitto?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Perché anche lì bisogna orientare decisioni e comportamenti verso obiettivi (servizi, efficienza, valore pubblico) e rendere conto dell&#x27;uso delle risorse. La slide dice esplicitamente che l&#x27;MCS è fondamentale in profit, non-profit e PA.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un report richiesto dal fisco è management o financial accounting?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Financial (e fiscale): è obbligatorio, segue regole esterne ed è rivolto a terzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 03 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 5 · Why… learning objectives&lt;/span&gt;&lt;h2&gt;Cosa saprai fare alla fine&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;I sei obiettivi della slide salgono di livello: si parte dal &lt;i&gt;conoscere&lt;/i&gt;, si passa al &lt;i&gt;capire&lt;/i&gt; e all&#x27;&lt;i&gt;applicare&lt;/i&gt;, e si arriva a &lt;i&gt;integrare&lt;/i&gt; temi nuovi. Clicca un gradino.&lt;/p&gt;

    &lt;details&gt;&lt;summary&gt;Quali strumenti specifici di management accounting elenca la slide?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Responsibility centres, budgets, activity-based costing, balanced scorecard e strategic map.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali tre tipi di questioni vanno integrate nei sistemi strategici tradizionali?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Sociali, ecologiche/ambientali e tecnologiche.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;!-- ============ 04 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; style=&quot;--h:25&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;04&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 6 · How… the topics&lt;/span&gt;&lt;h2&gt;I sette topics del corso, in anteprima&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;La slide 6 elenca solo i titoli. Qui ognuno è spiegato a grandi linee &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;, così sai già cosa ti aspetta e come i pezzi si collegano. I dettagli arriveranno nelle lezioni dedicate.&lt;/p&gt;

  &lt;figure&gt;

        &lt;circle cx=&quot;160&quot; cy=&quot;75&quot; r=&quot;20&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;80&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;40&quot; class=&quot;svg-s&quot;&gt;control &amp;amp; governance&lt;/text&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;1&lt;/span&gt;Recap of the cost basics&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;Si ripassano i concetti di base dei costi: tutto il resto ci si appoggia.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cost object&lt;/h4&gt;&lt;p&gt;Ciò di cui si vuole conoscere il costo: un prodotto, un cliente, un reparto, un progetto.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Direct vs indirect costs&lt;/h4&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Direct costs&lt;/em&gt;: attribuibili in modo diretto ed economico al cost object (materie prime di un prodotto). &lt;em class=&quot;t&quot;&gt;Indirect costs&lt;/em&gt; (o &lt;em&gt;overhead&lt;/em&gt;): condivisi, vanno &lt;i&gt;allocati&lt;/i&gt; con un criterio (affitto dello stabilimento).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Variable vs fixed costs&lt;/h4&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Variable&lt;/em&gt;: variano in proporzione al volume. &lt;em class=&quot;t&quot;&gt;Fixed&lt;/em&gt;: costanti nel &lt;em&gt;relevant range&lt;/em&gt; (l&#x27;intervallo di volumi in cui le ipotesi valgono).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Contribution margin&lt;/h4&gt;&lt;p&gt;Prezzo meno costo variabile unitario: quanto ogni unità contribuisce a coprire i fixed costs e poi a fare profitto.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Total cost = &lt;i&gt;FC&lt;/i&gt; + &lt;i&gt;v&lt;/i&gt; × Q &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Break-even Q = &lt;i&gt;FC&lt;/i&gt; ÷ (P − &lt;i&gt;v&lt;/i&gt;)&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;FC = fixed costs, v = costo variabile unitario, P = prezzo, Q = quantità. Questa formula è la base del simulatore di flexible budget più sotto.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;2&lt;/span&gt;Control systems &amp;amp; corporate governance&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;management control&lt;/em&gt; serve ad allineare le azioni delle persone agli obiettivi dell&#x27;organizzazione. La &lt;em class=&quot;t&quot;&gt;corporate governance&lt;/em&gt; è il sistema di regole e organi (consiglio di amministrazione, comitati, revisione, sistemi di incentivo) con cui la proprietà indirizza e controlla chi gestisce.&lt;/p&gt;
    &lt;p&gt;Il legame tra i due è il &lt;em class=&quot;t&quot;&gt;principal–agent problem&lt;/em&gt; (problema di agenzia): chi delega (&lt;i&gt;principal&lt;/i&gt;, es. azionisti) e chi gestisce (&lt;i&gt;agent&lt;/i&gt;, es. manager) possono avere interessi e informazioni diversi. I sistemi di controllo e misurazione riducono questa asimmetria.&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;Principal delega all&#x27;agent, l&#x27;agent rende conto con informazioni&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Principal&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;azionisti, board&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Agent&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;manager&lt;/text&gt;
      &lt;path d=&quot;M185 45 H452&quot; class=&quot;s-tone&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;delega, obiettivi, incentivi&lt;/text&gt;
      &lt;path d=&quot;M455 78 H190&quot; class=&quot;s-acc&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;accountability: report, KPI, budget&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;3&lt;/span&gt;Activity-based costing (ABC)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;L&#x27;&lt;em class=&quot;t&quot;&gt;activity-based costing&lt;/em&gt; assegna gli overhead ai prodotti in base alle &lt;b&gt;attività&lt;/b&gt; che consumano, invece che con un&#x27;unica base (es. ore di manodopera). Idea chiave: &lt;i&gt;i prodotti consumano attività, le attività consumano risorse&lt;/i&gt;.&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;Passo 1 · Identificare le attività&lt;/h4&gt;&lt;p&gt;Es. setup delle macchine, controllo qualità, gestione ordini, movimentazione materiali.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · Creare i cost pools&lt;/h4&gt;&lt;p&gt;Raccogliere i costi indiretti di ogni attività (persone, macchine, spazi) in un &quot;contenitore&quot; (&lt;em&gt;activity cost pool&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Scegliere il cost driver&lt;/h4&gt;&lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;cost driver&lt;/em&gt; è il fattore che &quot;causa&quot; il costo dell&#x27;attività: n. di setup, n. di ispezioni, n. di ordini.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Calcolare il tasso&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Activity rate = costo del pool ÷ quantità totale del driver&lt;/div&gt;&lt;p&gt;Es. setup: 60.000 € ÷ 300 setup = 200 € per setup.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 5 · Assegnare ai prodotti&lt;/h4&gt;&lt;p&gt;Costo attribuito = activity rate × driver consumato. Un prodotto di nicchia con 100 setup riceve 20.000 € di costi di setup anche se usa poche ore di manodopera: il metodo tradizionale lo avrebbe &lt;b&gt;sotto-costato&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;ABC è stato reso popolare da Cooper &amp;amp; Kaplan (1988): vedi &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot; open&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;4&lt;/span&gt;Budgeting: master &amp;amp; flexible budgeting&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;master budget&lt;/em&gt; è il piano operativo e finanziario complessivo per il periodo successivo, costruito &quot;a cascata&quot; a partire dalle vendite. Il &lt;em class=&quot;t&quot;&gt;flexible budget&lt;/em&gt; ricalcola i costi e i ricavi previsti al &lt;b&gt;volume effettivamente realizzato&lt;/b&gt;: così il confronto con i dati consuntivi è corretto. È il tema del primo assignment (slide 11).&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Sequenza del master budget&quot;&gt;
      &lt;g text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tone&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;48&quot; class=&quot;svg-t&quot; style=&quot;fill:var(--paper)&quot;&gt;Sales&lt;/text&gt;
        &lt;rect x=&quot;130&quot; y=&quot;20&quot; width=&quot;110&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;48&quot; class=&quot;svg-t&quot;&gt;Production&lt;/text&gt;

    &lt;h4&gt;Simulatore: static vs flexible budget&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Esempio inventato per esercitarsi: prezzo previsto 10 €, costo variabile 6 €/u, fixed costs 12.000 €, volume a budget 5.000 u. A consuntivo: prezzo 9,80 €, costo variabile 6,30 €/u, fixed costs 12.500 €. Sposta il volume effettivo.&lt;/p&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fbQ&quot;&gt;Volume effettivo venduto (unità)&lt;/label&gt;&lt;output id=&quot;fbQo&quot;&gt;6.000&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;fbQ&quot; min=&quot;3000&quot; max=&quot;7000&quot; step=&quot;100&quot; value=&quot;6000&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 340&quot; id=&quot;fbChart&quot; role=&quot;img&quot; aria-label=&quot;Grafico costi e ricavi al variare del volume&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
        &lt;div&gt;
          &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;fbTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
          &lt;p class=&quot;small&quot; id=&quot;fbMsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Static-budget variance = &lt;i&gt;Sales-volume variance&lt;/i&gt; + &lt;i&gt;Flexible-budget variance&lt;/i&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Sales-volume variance&lt;/b&gt; = flexible − static: dipende &lt;i&gt;solo&lt;/i&gt; dall&#x27;aver venduto più o meno del previsto. &lt;b&gt;Flexible-budget variance&lt;/b&gt; = actual − flexible: misura efficienza e prezzi a parità di volume. F = &lt;i&gt;favorable&lt;/i&gt; (favorevole al reddito), U = &lt;i&gt;unfavorable&lt;/i&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;5&lt;/span&gt;Responsibility accounting&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;La &lt;em class=&quot;t&quot;&gt;responsibility accounting&lt;/em&gt; misura i risultati di ogni manager in base a ciò di cui è responsabile. L&#x27;organizzazione si divide in &lt;em class=&quot;t&quot;&gt;responsibility centres&lt;/em&gt;:&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;Centri di responsabilità&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Cost&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Revenue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Investment&lt;/button&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Cost centre&lt;/b&gt;: il manager risponde dei costi (es. reparto produzione, IT). Misura: costi effettivi vs flexible budget.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Revenue centre&lt;/b&gt;: risponde dei ricavi (es. area vendite regionale). Misura: ricavi, volumi, mix.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Profit centre&lt;/b&gt;: risponde di ricavi e costi (es. divisione prodotto). Misura: margine di contribuzione, utile operativo.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Investment centre&lt;/b&gt;: risponde anche del capitale investito. Misure tipiche:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ROI = utile operativo ÷ capitale investito &amp;nbsp;·&amp;nbsp; RI = utile − (tasso richiesto × capitale)&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Principio chiave: &lt;em class=&quot;t&quot;&gt;controllability principle&lt;/em&gt;, cioè valutare un manager solo su ciò che può effettivamente influenzare.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;6&lt;/span&gt;Balanced Scorecard &amp;amp; Sustainable BSC&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;La &lt;em class=&quot;t&quot;&gt;Balanced Scorecard&lt;/em&gt; (BSC) traduce la strategia in obiettivi e indicatori lungo quattro prospettive, bilanciando misure finanziarie e non finanziarie, di risultato e di processo. La &lt;em class=&quot;t&quot;&gt;strategy map&lt;/em&gt; collega gli obiettivi con relazioni causa-effetto (dal basso verso l&#x27;alto). La &lt;em class=&quot;t&quot;&gt;Sustainability BSC&lt;/em&gt; integra aspetti ambientali e sociali. È il tema del lavoro di gruppo di dicembre.&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;sbscBtn&quot; aria-pressed=&quot;false&quot;&gt;Mostra la versione Sustainability (SBSC)&lt;/button&gt;&lt;/p&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 400&quot; role=&quot;img&quot; aria-labelledby=&quot;bscT&quot; id=&quot;bsc&quot;&gt;
      &lt;title id=&quot;bscT&quot;&gt;Strategy map con quattro prospettive: learning and growth, internal processes, customer, financial.&lt;/title&gt;
      &lt;g text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;150&quot; y=&quot;10&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;40&quot; class=&quot;svg-h&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;62&quot; class=&quot;svg-s&quot;&gt;come ci vedono gli azionisti? · ROI, crescita ricavi&lt;/text&gt;
        &lt;rect x=&quot;150&quot; y=&quot;105&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;135&quot; class=&quot;svg-h&quot;&gt;Customer&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;157&quot; class=&quot;svg-s&quot;&gt;come ci vedono i clienti? · soddisfazione, retention&lt;/text&gt;
        &lt;rect x=&quot;150&quot; y=&quot;200&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;230&quot; class=&quot;svg-h&quot;&gt;Internal business processes&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;252&quot; class=&quot;svg-s&quot;&gt;in cosa dobbiamo eccellere? · qualità, tempi ciclo&lt;/text&gt;
        &lt;rect x=&quot;150&quot; y=&quot;295&quot; width=&quot;460&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;325&quot; class=&quot;svg-h&quot;&gt;Learning &amp;amp; growth&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;347&quot; class=&quot;svg-s&quot;&gt;possiamo migliorare e innovare? · competenze, sistemi&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M380 295 V275 M380 200 V180 M380 105 V85&quot; class=&quot;s-tone&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;60&quot; y=&quot;200&quot; class=&quot;svg-s&quot; transform=&quot;rotate(-90 60 200)&quot; text-anchor=&quot;middle&quot;&gt;causa → effetto&lt;/text&gt;
      &lt;g id=&quot;sbscLayer&quot; style=&quot;opacity:0;transition:opacity .4s&quot;&gt;
        &lt;rect x=&quot;625&quot; y=&quot;10&quot; width=&quot;125&quot; height=&quot;355&quot; rx=&quot;12&quot; style=&quot;fill:oklch(70% 0.1 150 / .18);stroke:oklch(55% 0.11 150);stroke-dasharray:6 4;stroke-width:1.6&quot;/&gt;
        &lt;text x=&quot;687&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;svg-h&quot;&gt;Non-market&lt;/text&gt;
        &lt;text x=&quot;687&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;ambiente,&lt;/text&gt;&lt;text x=&quot;687&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;società,&lt;/text&gt;&lt;text x=&quot;687&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;comunità&lt;/text&gt;
        &lt;text x=&quot;687&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;(5ª prospettiva)&lt;/text&gt;
        &lt;g style=&quot;fill:oklch(55% 0.11 150)&quot;&gt;&lt;circle cx=&quot;595&quot; cy=&quot;45&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;595&quot; cy=&quot;140&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;595&quot; cy=&quot;235&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;595&quot; cy=&quot;330&quot; r=&quot;6&quot;/&gt;&lt;/g&gt;
        &lt;text x=&quot;380&quot; y=&quot;392&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;● = KPI ambientali e sociali integrati nelle prospettive esistenti&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;&lt;figcaption id=&quot;bscCap&quot;&gt;Le quattro prospettive di Kaplan &amp;amp; Norton (1992). &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;details class=&quot;topic&quot;&gt;&lt;summary&gt;&lt;span class=&quot;tn&quot;&gt;7&lt;/span&gt;MA, human rights and Business Technologies&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p&gt;L&#x27;ultimo blocco porta il management accounting (MA) su due frontiere, in linea con l&#x27;obiettivo 6:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Human rights&lt;/h4&gt;&lt;p&gt;Le imprese sono chiamate a individuare, misurare e rendicontare i propri impatti sui diritti umani (lavoro, filiere, comunità). Il riferimento internazionale sono gli UN Guiding Principles on Business and Human Rights (2011) &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;. Si collega alla ricerca di Laura Mazzola su accounting e povertà.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business technologies&lt;/h4&gt;&lt;p&gt;ERP, big data, analytics, automazione e AI cambiano come si raccolgono e usano i dati di costo e performance, e spostano il management accountant dal registrare dati all&#x27;analizzarli e fare da partner del business: è lo stesso tema del caso in sezione 07.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Volume a budget 5.000 u, effettivo 6.000 u. Perché confrontare i costi effettivi con il master budget statico è fuorviante?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Perché i costi variabili &lt;i&gt;dovevano&lt;/i&gt; crescere con il volume: il confronto mostrerebbe una varianza sfavorevole anche con un&#x27;efficienza perfetta. Il flexible budget li ricalcola a 6.000 u e isola l&#x27;effetto efficienza/prezzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nell&#x27;esempio, a 6.000 u qual è la sales-volume variance?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;(6.000 − 5.000) × margine di contribuzione unitario 4 € = &lt;b&gt;4.000 € F&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è l&#x27;idea alla base dell&#x27;ABC?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;I prodotti consumano attività e le attività consumano risorse: gli overhead si assegnano con i cost driver delle attività, non con un&#x27;unica base di volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un direttore di divisione risponde di ricavi, costi e capitale investito: che centro è?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Un &lt;b&gt;investment centre&lt;/b&gt; (misure: ROI, residual income).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le quattro prospettive della BSC, dal basso verso l&#x27;alto della strategy map?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Learning &amp;amp; growth → Internal business processes → Customer → Financial.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 05 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;05&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 7 · How… pedagogical approach&lt;/span&gt;&lt;h2&gt;Active learning: si impara facendo&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;formula&quot; style=&quot;white-space:normal;text-align:center;font-size:1.3rem;line-height:1.7&quot;&gt;
        &lt;i&gt;Active learning&lt;/i&gt; + &lt;i&gt;Student centered&lt;/i&gt;&lt;br&gt;&lt;span style=&quot;display:block;border-top:1.5px solid var(--ink);margin:4px 20%&quot;&gt;&lt;/span&gt;&lt;b&gt;Effective learning&lt;/b&gt; (&amp;amp; fun)
      &lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt; Le lezioni prevedono la partecipazione attiva degli studenti secondo l&#x27;approccio dell&#x27;&lt;em class=&quot;t&quot;&gt;active learning&lt;/em&gt; (apprendimento attivo): lavori di gruppo, discussione di casi, esercizi integrati. Il processo di apprendimento funziona meglio quando lo studente ha un ruolo attivo. Le relazioni &lt;em class=&quot;t&quot;&gt;peer-to-peer&lt;/em&gt; (tra pari) sono importanti e incoraggiate.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;
      &lt;h4 style=&quot;margin-top:0&quot;&gt;Funziona davvero? &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Una meta-analisi su 225 studi (Freeman et al., &lt;i&gt;PNAS&lt;/i&gt; 2014) ha trovato che con l&#x27;active learning i punteggi d&#x27;esame salgono di circa 0,47 deviazioni standard, e che con la lezione frontale tradizionale gli studenti hanno circa 1,5 volte più probabilità di essere bocciati. Lo studio riguarda corsi STEM, ma il principio vale anche qui.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC4060654/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Full text su PubMed Central&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Cosa significa per te&lt;/b&gt; &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;: arrivare in aula avendo letto il materiale (le slide sono pubblicate prima), portare domande, lavorare con i compagni. È coerente con la richiesta della slide 9: essere in aula &quot;fully prepared&quot;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali tre attività cita la slide come esempi di active learning?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Group work, case discussions, integrated exercises.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale &quot;formula&quot; riassume l&#x27;approccio del corso?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Active learning + student centered = effective learning (&amp;amp; fun).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 06 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;06&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 8–20&lt;/span&gt;&lt;h2&gt;Organizzazione, attività in aula ed esame&lt;/h2&gt;&lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;36&lt;/div&gt;&lt;p&gt;lezioni &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;9 ECTS&lt;/div&gt;&lt;p&gt;European Credit Transfer System. 1 ECTS ≈ 25–30 ore di lavoro complessivo dello studente, quindi circa &lt;b&gt;225–270 ore&lt;/b&gt; &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;12 h&lt;/div&gt;&lt;p&gt;tutorato, in 6 incontri online (&quot;more info coming soon&quot;) &lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;margin-top:16px&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Docenza condivisa&lt;/h4&gt;
      &lt;p&gt;Silvia Pilonato (Unibg) · un nuovo docente (TBD) · Laura Mazzola (international visiting professor, orario specifico 14–18 dicembre).&lt;/p&gt;
      &lt;p&gt;Ogni lezione combina teoria ed esercizi: slide pubblicate in anticipo, esercizi, simulazioni in Excel, casi.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Orario&lt;/h4&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Giorno&lt;/th&gt;&lt;th&gt;Ora&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Lunedì&lt;/td&gt;&lt;td&gt;12:30&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Martedì&lt;/td&gt;&lt;td&gt;12:30&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mercoledì&lt;/td&gt;&lt;td&gt;8:30&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Lezioni dal 14 settembre al 18 dicembre. Controlla spesso la sezione news dell&#x27;e-learning per gli aggiornamenti.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

      &lt;path d=&quot;M339 132 V178&quot; class=&quot;s-ink&quot;/&gt;&lt;text x=&quot;339&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;16–17 nov&lt;/text&gt;&lt;text x=&quot;339&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; class=&quot;svg-s&quot;&gt;no lezione&lt;/text&gt;

  &lt;h3&gt;Attending o non-attending?&lt;/h3&gt;
  &lt;p&gt;Ci sono &lt;b&gt;due attività volontarie in aula&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 10–13&lt;/span&gt;. Chi le fa &lt;b&gt;entrambe&lt;/b&gt; è un &lt;em class=&quot;t&quot;&gt;attending student&lt;/em&gt; (studente frequentante): ha punti bonus e un esame più breve. Chi ne fa una sola è considerato &lt;em class=&quot;t&quot;&gt;non-attending&lt;/em&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;N. 1 · Assignment on Flexible Budget&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Individuale&lt;/b&gt;, fine ottobre (probabilmente lunedì 26). Proposto durante una lezione, si lavora da soli e si consegna a fine lezione. &lt;b&gt;0–2 punti.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;N. 2 · Work group on Balanced Scorecard&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Gruppi di 4–5&lt;/b&gt;, dicembre. Gruppi e casi presentati in aula; 5–7 giorni di lavoro autonomo; PowerPoint inviato prima ai docenti; discussione in due lezioni con tutti i membri presenti. &lt;b&gt;0–3 punti&lt;/b&gt; a ogni componente.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Simulatore di status e bonus&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Scegli a quali attività partecipi e i punti ottenuti. Si assume che i punti si sommino al voto dell&#x27;esame scritto, come dice la slide 13 (&quot;added to students&#x27; evaluation during the final exam&quot;). Come si gestiscono il tetto di 30 e la lode non è indicato: chiedi ai docenti.&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;simA&quot; aria-pressed=&quot;true&quot;&gt;Assignment Flexible Budget&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;simB&quot; aria-pressed=&quot;true&quot;&gt;Group work BSC&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptA&quot;&gt;Punti assignment (0–2)&lt;/label&gt;&lt;output id=&quot;ptAo&quot;&gt;1,5&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptA&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.5&quot; value=&quot;1.5&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptB&quot;&gt;Punti gruppo (0–3)&lt;/label&gt;&lt;output id=&quot;ptBo&quot;&gt;2,5&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptB&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2.5&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ptE&quot;&gt;Voto dell&#x27;esame scritto (/30)&lt;/label&gt;&lt;output id=&quot;ptEo&quot;&gt;24&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ptE&quot; min=&quot;18&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;24&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot; id=&quot;simOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Valutazione&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Attending&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Non-attending&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Quando&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Valutazione in tre parti &lt;span class=&quot;tag sl&quot;&gt;slide 18&lt;/span&gt;:&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;lavoro individuale durante il corso (produzione scritta)&lt;/li&gt;&lt;li&gt;lavoro di gruppo durante il corso (presentazione del caso ai compagni)&lt;/li&gt;&lt;li&gt;esame scritto finale (multiple choice, esercizi, discussione di casi), &lt;b&gt;più breve&lt;/b&gt;&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Solo chi fa sia la parte 1 sia la parte 2 è considerato &quot;attending&quot;. Bisogna dichiararlo entro l&#x27;&lt;b&gt;8 ottobre&lt;/b&gt; con il quiz sull&#x27;e-learning SMA.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Solo esame scritto finale (multiple choice, esercizi, discussione di casi), &lt;b&gt;più lungo&lt;/b&gt; di quello degli attending &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Nota:&lt;/b&gt; la slide 19 dice &quot;longer than the exam of non-attending students&quot;: è un refuso, va letto &quot;of attending students&quot;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Inverno&lt;/h4&gt;&lt;p&gt;Gennaio–febbraio, 2 appelli. Esami &lt;b&gt;diversi&lt;/b&gt; per attending e non-attending. Gli attending devono sostenerlo nella sessione invernale.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Estate&lt;/h4&gt;&lt;p&gt;Giugno–luglio 2 appelli + settembre 1 appello. Esame &lt;b&gt;uguale per tutti&lt;/b&gt; (formato non-attending, come suggerisce la nota &quot;exam non-attendance…???&quot;).&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Iscrizione obbligatoria entro la scadenza tramite &lt;b&gt;Sportello Internet&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Nota:&lt;/b&gt; la slide 10 dice &quot;by the end of February 2025&quot;: sembra un residuo dell&#x27;anno precedente. Per l&#x27;a.a. 2026-27 sarà presumibilmente febbraio 2027: verifica.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Criteri dell&#x27;esame scritto&lt;/b&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 18–19&lt;/span&gt;&lt;br&gt;Completezza delle conoscenze acquisite e capacità di analisi orientata al &lt;i&gt;problem solving&lt;/i&gt; attraverso esercizi specifici (multiple choice e/o esercizi).&lt;/div&gt;

  &lt;h3&gt;Materiali&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Textbook&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Strategic Management Accounting&lt;/i&gt; (2023), Silvia Pilonato e Chiara Oppi, McGraw-Hill Create (edizione personalizzata per il corso). Materiali aggiuntivi: slide, articoli di ricerca, casi, esercizi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Tutto il materiale è richiesto per l&#x27;esame.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;E-learning e contatti&lt;/h4&gt;&lt;p&gt;Corso &quot;Strategic Management Accounting a.y. 2026-27&quot;, codice &lt;b&gt;900003-ENG&lt;/b&gt;; la password di iscrizione è sulla slide 15. Ricevimento su appuntamento via e-mail (indirizzo sulla slide 16).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Partecipi solo all&#x27;assignment sul flexible budget. Che status hai?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;&lt;b&gt;Non-attending&lt;/b&gt;: servono entrambe le attività. Fai l&#x27;esame lungo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il bonus massimo per un attending student?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;2 (assignment) + 3 (group work) = &lt;b&gt;5 punti&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Entro quando devi dichiarare la partecipazione?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Entro l&#x27;&lt;b&gt;8 ottobre&lt;/b&gt;, con il quiz sull&#x27;e-learning SMA.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A giugno l&#x27;esame è diverso per attending e non-attending?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;No: nella sessione estiva (giugno–luglio e settembre) l&#x27;esame è uguale per tutti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quante ore di lavoro corrispondono a 9 ECTS?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Circa 225–270 ore (25–30 ore per credito), che comprendono lezioni, studio individuale e preparazione dell&#x27;esame.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 07 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;07&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Slide 21–24 · Let&#x27;s start…&lt;/span&gt;&lt;h2&gt;Il caso: “accountant, stai fuori dal mio reparto”&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Primo esercizio di discussione. Sei un nuovo accountant e un plant manager (responsabile di stabilimento) ti dice:&lt;/p&gt;
  &lt;blockquote&gt;As I see it, our accountants may be needed to keep records for shareholders and for the tax authorities – but I do not want them sticking their noses in my day-to-day operations. I do the best I know how. No pen-pushing bean-counter knows enough about my responsibilities to be of any use to me.&lt;/blockquote&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;em&gt;Bean counter&lt;/em&gt; = &quot;contafagioli&quot;, lo stereotipo del contabile chiuso nei numeri; &lt;em&gt;pen-pushing&lt;/em&gt; = burocrate. Nella slide c&#x27;è scritto &quot;bean-corner&quot;, refuso per &lt;em&gt;bean-counter&lt;/em&gt;. Il manager vede solo il &lt;b&gt;financial accounting&lt;/b&gt; (sezione 02).&lt;/p&gt;

  &lt;p&gt;&lt;b&gt;Prima pensa tu:&lt;/b&gt; cosa risponderesti? Poi scorri le sei risposte proposte nelle slide.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;h4&gt;1 · Clarifying the Role&lt;/h4&gt;&lt;p&gt;&quot;Non siamo qui solo per tenere i registri: il nostro ruolo è darti informazioni per gestire le operazioni in modo più efficiente, per esempio individuando i &lt;em class=&quot;t&quot;&gt;cost drivers&lt;/em&gt; e le aree in cui si sprecano risorse.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Collegamento: ABC (topic 3).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Collaboration, not Interference&lt;/h4&gt;&lt;p&gt;&quot;Non vogliamo dirti come gestire lo stabilimento. Vogliamo supportare le tue decisioni con dati e analisi affidabili, così la tua esperienza è completata da &lt;em&gt;evidence-based insights&lt;/em&gt;.&quot;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · From Compliance to Value Creation&lt;/h4&gt;&lt;p&gt;&quot;Dobbiamo rispettare gli obblighi di reporting, ma il nostro ruolo va oltre: analizzando costi, budget e performance possiamo creare valore e darti un quadro più chiaro di come le operazioni influenzano la redditività.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Collegamento: budgeting e flexible budget (topic 4).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Business Partner Approach&lt;/h4&gt;&lt;p&gt;&quot;Invece di fare i &#x27;bean counters&#x27; possiamo essere &lt;em class=&quot;t&quot;&gt;business partners&lt;/em&gt;: per esempio, fornire dati per valutare se un nuovo macchinario vale l&#x27;investimento o se cambiare un processo riduce gli sprechi.&quot;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Respecting Managerial Expertise&lt;/h4&gt;&lt;p&gt;&quot;Tu sai gestire lo stabilimento; noi sappiamo interpretare dati finanziari e non finanziari. Combinando le due prospettive l&#x27;azienda prende decisioni più solide.&quot;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Collegamento: dati non finanziari, Balanced Scorecard (topic 6).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Addressing Stereotypes&lt;/h4&gt;&lt;p&gt;&quot;So che gli accountant hanno fama di passacarte. Ma il management accounting moderno è proattivo, strategico e di supporto alle operazioni: aiuta i manager a riuscire, non interferisce.&quot;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-labelledby=&quot;evoT&quot;&gt;
    &lt;title id=&quot;evoT&quot;&gt;Evoluzione del ruolo: da scorekeeper a business partner.&lt;/title&gt;
    &lt;defs&gt;&lt;linearGradient id=&quot;g1&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; style=&quot;stop-color:var(--rule)&quot;/&gt;&lt;stop offset=&quot;1&quot; style=&quot;stop-color:var(--acc)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
    &lt;path d=&quot;M30 120 L730 120 L730 100 L760 125 L730 150 L730 130 L30 130 Z&quot; fill=&quot;url(#g1)&quot;/&gt;
    &lt;g text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;110&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Scorekeeper&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;registra, rispetta le norme&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Analyst&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;spiega costi e scostamenti&lt;/text&gt;
      &lt;text x=&quot;640&quot; y=&quot;70&quot; class=&quot;svg-h&quot;&gt;Business partner&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;92&quot; class=&quot;svg-s&quot;&gt;co-decide, guarda alla strategia&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;160&quot; class=&quot;svg-s&quot;&gt;compliance&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;160&quot; class=&quot;svg-s&quot;&gt;value creation&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Sintesi visiva delle sei risposte &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;. Collega questo caso al primo learning objective: gli sviluppi storici del management accounting.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quale errore concettuale fa il plant manager?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Confonde tutto l&#x27;accounting con il financial/tax accounting rivolto a terzi, e ignora il management accounting, che produce informazioni per le decisioni interne.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Fai un esempio concreto di aiuto &quot;da business partner&quot; al plant manager.&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Valutare se un nuovo macchinario vale l&#x27;investimento, individuare i cost driver degli sprechi, costruire un flexible budget che mostri l&#x27;efficienza del reparto al netto del volume.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la risposta 5 (respecting expertise) conta anche in termini di &quot;behavioral dimensions&quot;?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Perché un MCS funziona solo se chi lo subisce lo accetta. Riconoscere la competenza del manager riduce le resistenze e rende i numeri usati davvero nelle decisioni: è il legame tra numeri, comportamenti e decisioni della sezione 02.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--h:35&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Fonti esterne&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Autori, studi, testi e standard citati o richiamati nelle slide. Tutte le informazioni in questa sezione vengono dalla ricerca web e sono &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;, salvo dove indicato.&lt;/p&gt;
  &lt;div class=&quot;src-list&quot;&gt;
    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Pilonato &amp;amp; Monfardini — Performance measurement systems in higher education&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;The British Accounting Review, 52(3), 2020, art. 100908 · DOI 10.1016/j.bar.2020.100908 · citato nella slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; studio qualitativo (interviste a responsabili della didattica e coordinatori di corso) sul sistema italiano di valutazione della qualità della didattica, letto con i levers of control di Simons.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra un MCS nella pubblica amministrazione e come lo stesso sistema sia percepito diversamente da gruppi diversi.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v52y2020i3s0890838920300287.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/189206&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Repository Unibg (Aisberg)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Michelon, Pilonato &amp;amp; Ricceri — CSR reporting practices and the quality of disclosure&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Critical Perspectives on Accounting, 33, 2015, pp. 59–78 · DOI 10.1016/j.cpa.2014.10.003 · citato nella slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; verifica se report stand-alone, assurance e linee guida (es. GRI) si associano a informazioni CSR di qualità migliore (per contenuto, tipo di informazione e orientamento del management).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mette in guardia dal confondere la forma della rendicontazione con la vera accountability. È utile per la Sustainable BSC.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ore.exeter.ac.uk/repository/handle/10871/17245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Exeter repository&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/189198&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Aisberg&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Alexander, Pilonato &amp;amp; Redigolo — Do institutional donors value social media activity and engagement?&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;The British Accounting Review, 55(5), 2023 · DOI 10.1016/j.bar.2022.101169 · citato nella slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; survey su non-profit italiane finanziate da fondazioni di origine bancaria, unita ai dati Facebook e Twitter; più engagement si associa a contributi più alti e a una supervisione meno restrittiva.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; esempio di accountability informale nel non-profit, uno dei tre settori citati nella slide 4.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/bracre/v55y2023i5s0890838922001093.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://aisberg.unibg.it/handle/10446/235531&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Aisberg&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Pilonato &amp;amp; Oppi — Strategic Management Accounting (textbook)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;McGraw-Hill Create, 2023 · slide 17&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; manuale del corso, in edizione personalizzata McGraw-Hill Create.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il testo d&#x27;esame. &lt;b&gt;Nota:&lt;/b&gt; la ricerca web non ha trovato una scheda pubblica affidabile (normale per le edizioni Create su misura), quindi niente link: fai riferimento alle indicazioni dei docenti e all&#x27;e-learning.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Robert Simons — Levers of Control (1995)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Richiamato nel titolo dell&#x27;articolo della slide 2&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; quattro leve di controllo (belief, boundary, diagnostic, interactive) per bilanciare innovazione e controllo nell&#x27;attuazione della strategia.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è uno dei modelli di riferimento per leggere gli MCS &quot;da una prospettiva strategica&quot;, come chiede il corso.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/business/Business-performance-management/BPM-tools-templates-and-case-studies/Levers-of-Control&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Levers of Control&lt;/a&gt; · &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumSimons95.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW summary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan &amp;amp; Norton — The Balanced Scorecard: Measures That Drive Performance&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Harvard Business Review, gen–feb 1992, pp. 71–79 · topic &quot;Balanced Scorecard&quot; (slide 6) e group work (slide 11)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; l&#x27;articolo che introduce la BSC: misure finanziarie affiancate da misure operative su clienti, processi interni, innovazione e apprendimento.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la base del lavoro di gruppo di dicembre.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW summary&lt;/a&gt; · &lt;a href=&quot;https://icaew.com/technical/business/business-performance-management/balanced-scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Balanced scorecard&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Figge, Hahn, Schaltegger &amp;amp; Wagner — The Sustainability Balanced Scorecard&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Business Strategy and the Environment, 11(5), 2002, pp. 269–284 · DOI 10.1002/bse.339 · topic &quot;Sustainable BS&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; come integrare aspetti ambientali e sociali nella BSC, anche aggiungendo una prospettiva &quot;non-market&quot;, e i passi per formularla in una business unit.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il testo di riferimento sulla SBSC e risponde all&#x27;obiettivo 6 del corso.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://izt.de/publikationen/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IZT — scheda della pubblicazione&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Cooper &amp;amp; Kaplan — Measure Costs Right: Make the Right Decisions&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Harvard Business Review, 66(5), set–ott 1988, pp. 96–103 · topic &quot;Activity based costing&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; critica dell&#x27;allocazione degli overhead in base alla manodopera diretta e proposta del costing per attività.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;articolo che ha reso popolare l&#x27;ABC.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Ivey Publishing&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ECTS Users&#x27; Guide 2015&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Commissione europea, 2015 · ISBN 978-92-79-43562-1 · slide 8&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; guida ufficiale all&#x27;uso dei crediti ECTS, adottata dai ministri dello Spazio europeo dell&#x27;istruzione superiore a Yerevan (2015); 60 ECTS = un anno a tempo pieno.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; spiega cosa significano i 9 ECTS del corso in termini di ore di lavoro.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://education.ec.europa.eu/sites/default/files/document-library-docs/ects-users-guide_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF ufficiale (education.ec.europa.eu)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Freeman et al. — Active learning increases student performance in science, engineering, and mathematics&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;PNAS, 111(23), 2014, pp. 8410–8415 · DOI 10.1073/pnas.1319030111 · approccio della slide 7&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; meta-analisi di 225 studi che confrontano lezione frontale e active learning.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;evidenza empirica più citata a favore dell&#x27;approccio didattico del corso.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC4060654/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PubMed Central&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;OHCHR, 2011 · HR/PUB/11/4 · topic &quot;MA, human rights&quot; (slide 6)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Contenuto:&lt;/b&gt; 31 principi su tre pilastri (dovere degli Stati di proteggere, responsabilità delle imprese di rispettare, accesso ai rimedi), approvati all&#x27;unanimità dal Consiglio ONU per i diritti umani (ris. 17/4).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il quadro di riferimento quando si parla di imprese, management accounting e diritti umani.&lt;/p&gt;
      &lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot; style=&quot;margin-top:20px&quot;&gt;&lt;b&gt;Altri materiali del corso:&lt;/b&gt; la cartella &lt;code&gt;corso/&lt;/code&gt; dovrebbe contenere lezioni ed esercizi sui topics della sezione 04. Con gli strumenti disponibili non è stato possibile elencarne il contenuto, quindi questo riassunto si basa solo sulla slide di intro. I collegamenti tra topics seguono il programma della slide 6.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(box){

  // ladder
  var lad=[
    [&#x27;Be aware&#x27;,&#x27;Conoscere gli &lt;b&gt;sviluppi storici&lt;/b&gt; del management accounting e quelli più recenti: da strumento di registrazione dei costi a supporto della strategia (vedi il caso in sezione 07).&#x27;],
    [&#x27;Identify&#x27;,&#x27;Riconoscere &lt;b&gt;scopi, caratteristiche e funzionamento&lt;/b&gt; dei management control systems e i loro &lt;b&gt;legami con le strategie&lt;/b&gt; (sezione 02).&#x27;],
    [&#x27;Illustrate&#x27;,&#x27;Descrivere &lt;b&gt;design, implementation, use and review&lt;/b&gt; di un MCS: come si progetta, si introduce, si usa e si rivede.&#x27;],

    [&#x27;Apply tools&#x27;,&#x27;Applicare strumenti specifici: &lt;b&gt;responsibility centres, budgets, activity-based costing, balanced scorecard, strategic map&lt;/b&gt; (sezione 04).&#x27;],
    [&#x27;Combine&#x27;,&#x27;Spiegare come e perché integrare questioni &lt;b&gt;sociali, ecologiche/ambientali e tecnologiche&lt;/b&gt; nei sistemi tradizionali di strategic management (Sustainable BSC, human rights, business technologies).&#x27;]
  ];
  var out=document.getElementById(&#x27;ladderOut&#x27;),rungs=[].slice.call(document.querySelectorAll(&#x27;#ladder .rung&#x27;));
  function showL(i){out.innerHTML=&#x27;&lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt; &lt;h4 style=&quot;margin:.4em 0 .3em&quot;&gt;&#x27;+(i+1)+&#x27; · &#x27;+lad[i][0]+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+lad[i][1]+&#x27;&lt;/p&gt;&#x27;;rungs.forEach(function(r,j){r.querySelector(&#x27;rect&#x27;).style.fill=j===i?&#x27;var(--soft)&#x27;:&#x27;&#x27;;r.querySelector(&#x27;rect&#x27;).style.strokeWidth=j===i?3:&#x27;&#x27;})}
  rungs.forEach(function(r){var i=+r.dataset.i;r.style.cursor=&#x27;pointer&#x27;;r.addEventListener(&#x27;click&#x27;,function(){showL(i)});r.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();showL(i)}})});
  showL(0);
  // flexible budget
  var fmt=function(n){return Math.round(n).toLocaleString(&#x27;it-IT&#x27;)};
  var P=10,V=6,FC=12000,QB=5000,AP=9.8,AV=6.3,AFC=12500;
  var q=document.getElementById(&#x27;fbQ&#x27;),qo=document.getElementById(&#x27;fbQo&#x27;),ch=document.getElementById(&#x27;fbChart&#x27;),tb=document.getElementById(&#x27;fbTable&#x27;),msg=document.getElementById(&#x27;fbMsg&#x27;);

  function line(a,b,c,d,cls,extra){return &#x27;&lt;line x1=&quot;&#x27;+sx(a)+&#x27;&quot; y1=&quot;&#x27;+sy(b)+&#x27;&quot; x2=&quot;&#x27;+sx(c)+&#x27;&quot; y2=&quot;&#x27;+sy(d)+&#x27;&quot; class=&quot;&#x27;+cls+&#x27;&quot; &#x27;+(extra||&#x27;&#x27;)+&#x27;/&gt;&#x27;}
  function vt(v){var a=Math.abs(v)&lt;.5?&#x27;—&#x27;:fmt(Math.abs(v))+(v&gt;0?&#x27; F&#x27;:&#x27; U&#x27;);return &#x27;&lt;span class=&quot;&#x27;+(v&gt;0.5?&#x27;pos&#x27;:v&lt;-0.5?&#x27;neg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+a+&#x27;&lt;/span&gt;&#x27;}

    var g=&#x27;&#x27;;
    for(var i=0;i&lt;=8;i++){var yv=i*10000;g+=&#x27;&lt;line x1=&quot;&#x27;+X0+&#x27;&quot; x2=&quot;&#x27;+X1+&#x27;&quot; y1=&quot;&#x27;+sy(yv)+&#x27;&quot; y2=&quot;&#x27;+sy(yv)+&#x27;&quot; class=&quot;s-rule&quot; stroke-dasharray=&quot;2 4&quot;/&gt;&#x27;;if(i%2===0)g+=&#x27;&lt;text x=&quot;&#x27;+(X0-6)+&#x27;&quot; y=&quot;&#x27;+(sy(yv)+4)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;svg-s&quot;&gt;&#x27;+(yv/1000)+&#x27;k&lt;/text&gt;&#x27;}

    g+=line(0,FC,QM,FC,&#x27;s-ink&#x27;,&#x27;stroke-dasharray=&quot;6 4&quot;&#x27;)+&#x27;&lt;text x=&quot;&#x27;+(X1-4)+&#x27;&quot; y=&quot;&#x27;+(sy(FC)-6)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;svg-s&quot;&gt;fixed costs&lt;/text&gt;&#x27;;
    g+=line(0,FC,QM,FC+V*QM,&#x27;s-tone&#x27;)+&#x27;&lt;text x=&quot;&#x27;+(X1-4)+&#x27;&quot; y=&quot;&#x27;+(sy(FC+V*QM)+16)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;svg-s&quot;&gt;flexible budget: costi totali&lt;/text&gt;&#x27;;

    g+=&#x27;&lt;line x1=&quot;&#x27;+sx(Q)+&#x27;&quot; x2=&quot;&#x27;+sx(Q)+&#x27;&quot; y1=&quot;&#x27;+Y0+&#x27;&quot; y2=&quot;&#x27;+Y1+&#x27;&quot; class=&quot;s-rule&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
    g+=&#x27;&lt;circle cx=&quot;&#x27;+sx(QB)+&#x27;&quot; cy=&quot;&#x27;+sy(FC+V*QB)+&#x27;&quot; r=&quot;6&quot; class=&quot;f-card&quot; style=&quot;stroke:var(--ink);stroke-width:2&quot;/&gt;&lt;text x=&quot;&#x27;+(sx(QB)-8)+&#x27;&quot; y=&quot;&#x27;+(sy(FC+V*QB)-10)+&#x27;&quot; text-anchor=&quot;end&quot; class=&quot;svg-s&quot;&gt;static&lt;/text&gt;&#x27;;
