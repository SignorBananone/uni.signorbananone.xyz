.big{font-family:var(--serif);font-size:1.8rem;font-weight:500}

.note{font-size:.88rem;color:var(--muted)}

&lt;section class=&quot;part part-sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 1 · Fundamentals&lt;/span&gt;
  &lt;h2&gt;Direct costs, overhead and traditional costing&lt;/h2&gt;
  &lt;p&gt;All three exercises take certain basic cost accounting concepts for granted. It is worth establishing them before turning to ABC.&lt;/p&gt;
  &lt;dl class=&quot;def&quot;&gt;
    &lt;dt&gt;Direct materials / direct labor&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Direct materials&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;direct labor&lt;/span&gt;: costs that can be easily and accurately traced to a single unit of product, such as the $32 of material in each Hub (Ex. 3).&lt;/dd&gt;
    &lt;dt&gt;Manufacturing overhead&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Indirect manufacturing costs&lt;/span&gt;, i.e. all factory costs that are not direct: machine setups, depreciation, utilities, supervision. They cannot be traced to individual products and must therefore be &lt;em&gt;allocated&lt;/em&gt;.&lt;/dd&gt;
    &lt;dt&gt;Selling &amp;amp; administrative expenses&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Selling and administrative expenses&lt;/span&gt; (deliveries, order processing, advertising…). In traditional financial statements they are period costs and are not assigned to products. ABC, by contrast, can assign them to customers or products (Ex. 1 and 2).&lt;/dd&gt;
    &lt;dt&gt;Cost of goods sold (COGS)&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Cost of goods sold&lt;/span&gt;: the cost of the products sold during the period. For Worley it is the purchase price paid to suppliers; for Hi-Tek it is materials + labor + overhead.&lt;/dd&gt;
    &lt;dt&gt;Absorption costing&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Full costing&lt;/span&gt;: product cost &lt;em&gt;absorbs&lt;/em&gt; all manufacturing costs, both fixed and variable (DM + DL + overhead). Hi-Tek&#x27;s income statement is prepared on this basis.&lt;/dd&gt;
    &lt;dt&gt;Cost object&lt;/dt&gt;&lt;dd&gt;The &lt;span class=&quot;term&quot;&gt;cost object&lt;/span&gt; is anything whose cost we want to measure: a product (B300, Hubs), a customer (University, Memorial), an order.&lt;/dd&gt;
  &lt;/dl&gt;

  &lt;h3 id=&quot;tradizionale&quot;&gt;The traditional system: a single plantwide overhead rate&lt;/h3&gt;
  &lt;p&gt;A traditional costing system uses a single &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; (one overhead rate for the entire plant), computed on a volume-based allocation base such as direct labor-hours or direct labor dollars:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Plantwide overhead rate =
    &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Estimated total overhead&lt;/span&gt;&lt;span&gt;Estimated total amount of the allocation base&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;p&gt;Each product then receives overhead in proportion to the amount of the base it consumes. Hi-Tek (Ex. 2) uses &lt;em&gt;direct labor dollars&lt;/em&gt;: $608,000 / $304,000 = 2.00, i.e. 2 dollars of overhead for every dollar of direct labor.&lt;/p&gt;

  &lt;figure class=&quot;diagram&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 220&quot; role=&quot;img&quot; aria-label=&quot;Diagram of traditional costing&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Total overhead&lt;/text&gt;
      &lt;text x=&quot;115&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;a single pool&lt;/text&gt;
      &lt;path d=&quot;M210,110 L320,110&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;325&quot; y=&quot;70&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;A single base&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;DL hours or DL dollars&lt;/text&gt;
      &lt;path d=&quot;M535,100 C600,60 620,50 650,50&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;path d=&quot;M535,120 C600,160 620,170 650,170&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;655&quot; y=&quot;22&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;747&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product A&lt;/text&gt;
      &lt;rect x=&quot;655&quot; y=&quot;142&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;747&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product B&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;overhead follows labor volume, not the activities actually consumed&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The traditional method has a single &quot;funnel&quot;: all overhead passes through one volume-related base.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tint&quot;&gt;&lt;strong&gt;Where the problem lies.&lt;/strong&gt; Many indirect costs (setups, engineering, order processing) do not depend on how many units or labor-hours are produced, but on &lt;em&gt;how many times&lt;/em&gt; an activity is performed. A complex, low-volume product consumes many setups but little labor: under the plantwide rate it is &lt;strong&gt;undercosted&lt;/strong&gt;, while the simple, high-volume product is &lt;strong&gt;overcosted&lt;/strong&gt;. This shifting of costs from one product to another is called &lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt;. It is exactly what happens at Hi-Tek.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Fundamentals&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Why do selling &amp;amp; administrative expenses not appear in product cost on an absorption income statement?
        &lt;div class=&quot;answer&quot;&gt;Because they are period costs: absorption costing includes only manufacturing costs (DM, DL, overhead) in product cost. S&amp;amp;A expenses are charged to the income statement in the period in which they are incurred.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Hi-Tek has $608,000 of overhead and $304,000 of direct labor. How much overhead does a product with $50,000 of DL receive?
        &lt;div class=&quot;answer&quot;&gt;Rate = 608,000 / 304,000 = 2.00 per DL$, so 50,000 × 2 = &lt;strong&gt;$100,000&lt;/strong&gt;.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;What does it mean for a product to be &quot;undercosted&quot;?
        &lt;div class=&quot;answer&quot;&gt;The system assigns it fewer costs than it actually consumes. Its margin therefore appears higher than it really is, and the difference is &quot;paid for&quot; by another product (cross-subsidization).&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part part-accent&quot; id=&quot;abc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 2 · The method&lt;/span&gt;
  &lt;h2&gt;Activity-Based Costing (ABC)&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Activity-based costing&lt;/span&gt; starts from a simple idea: &lt;strong&gt;products and customers consume activities, and activities consume resources&lt;/strong&gt;. Instead of a single overhead pool, multiple &lt;span class=&quot;term&quot;&gt;activity cost pools&lt;/span&gt; (groups of costs associated with one activity) are created, each with its own &lt;span class=&quot;term&quot;&gt;activity measure&lt;/span&gt; or &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;, i.e. the quantity that measures how much of that activity is used.&lt;/p&gt;

  &lt;figure class=&quot;diagram&quot;&gt;
    &lt;svg viewBox=&quot;0 0 880 300&quot; role=&quot;img&quot; aria-label=&quot;Two-stage ABC model diagram&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;110&quot; width=&quot;160&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;text x=&quot;100&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Resources&lt;/text&gt;
      &lt;text x=&quot;100&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;overhead + S&amp;amp;A&lt;/text&gt;
      &lt;text x=&quot;245&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;1st stage&lt;/text&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;&gt;

        &lt;path d=&quot;M180,145 C230,130 260,120 300,120&quot;/&gt;
        &lt;path d=&quot;M180,155 C230,170 260,185 300,185&quot;/&gt;
        &lt;path d=&quot;M180,170 C230,220 250,250 300,252&quot;/&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;305&quot; y=&quot;32&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot;&gt;Setups · &lt;tspan font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;setup hours&lt;/tspan&gt;&lt;/text&gt;
        &lt;rect x=&quot;305&quot; y=&quot;98&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Machining · &lt;tspan font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;MH&lt;/tspan&gt;&lt;/text&gt;
        &lt;rect x=&quot;305&quot; y=&quot;164&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot;&gt;Order processing · &lt;tspan font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;orders&lt;/tspan&gt;&lt;/text&gt;
        &lt;rect x=&quot;305&quot; y=&quot;230&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot;&gt;Organization-sustaining&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;590&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;2nd stage: activity rate × usage&lt;/text&gt;

        &lt;path d=&quot;M505,120 C580,120 610,110 670,110&quot;/&gt;

      &lt;rect x=&quot;675&quot; y=&quot;80&quot; width=&quot;185&quot; height=&quot;110&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;text x=&quot;767&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cost objects&lt;/text&gt;
      &lt;text x=&quot;767&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;products · customers&lt;/text&gt;
      &lt;text x=&quot;767&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;orders · channels&lt;/text&gt;

      &lt;text x=&quot;670&quot; y=&quot;248&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;not assigned:&lt;/text&gt;
      &lt;text x=&quot;670&quot; y=&quot;264&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;deducted from the total&lt;/text&gt;

    &lt;figcaption&gt;The two-stage model: resources flow into activity cost pools, then to cost objects according to actual consumption. Organization-sustaining costs are left out.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The steps of ABC&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Standard procedure from managerial accounting textbooks, which the slides take for granted.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 1 · Define activities, activity cost pools and activity measures&lt;/h4&gt;&lt;p&gt;Identify the activities that generate costs (deliveries, setups, machining…) and choose a consumption measure for each. In the slides the measure appears in brackets: &lt;em&gt;Customer deliveries (Number of deliveries)&lt;/em&gt;, &lt;em&gt;Setups (setup hours)&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · Assign costs to the pools (first-stage allocation)&lt;/h4&gt;&lt;p&gt;Overhead and S&amp;amp;A costs are distributed among the pools, usually on the basis of interviews and estimates of how time and resources are used. In the exercises this step has &lt;strong&gt;already been done&lt;/strong&gt;: the tables give the &quot;Total Cost&quot; of each pool.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Compute the activity rates&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total cost of the pool&lt;/span&gt;&lt;span&gt;Total activity (of the measure)&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Worley example: 500,000 / 5,000 deliveries = &lt;strong&gt;$100 per delivery&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Assign costs to cost objects (second-stage allocation)&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Assigned cost = Activity rate × Activity consumed by the cost object&lt;/div&gt;
      &lt;p&gt;Example: Memorial receives 25 deliveries × $100 = $2,500 of delivery cost.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 5 · Prepare management reports&lt;/h4&gt;&lt;p&gt;Compute the &lt;span class=&quot;term&quot;&gt;customer margin&lt;/span&gt; (Ex. 1), the &lt;span class=&quot;term&quot;&gt;product margin&lt;/span&gt; (Ex. 2) or the &lt;span class=&quot;term&quot;&gt;unit product cost&lt;/span&gt; (Ex. 3). This shows which customers or products create value and which destroy it.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;gerarchia&quot;&gt;The cost hierarchy&lt;/h3&gt;
  &lt;p&gt;ABC classifies activities according to the level at which costs are incurred. Click a level to see its definition and examples from the exercises.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure class=&quot;diagram hier&quot; style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 320&quot; role=&quot;img&quot; aria-label=&quot;Cost hierarchy pyramid&quot;&gt;
        &lt;g data-l=&quot;0&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;20,300 380,300 350,250 50,250&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Unit-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;1&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;52,246 348,246 318,196 82,196&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Batch-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;84,192 316,192 286,142 114,142&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;116,138 284,138 254,88 146,88&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;148,84 252,84 200,20&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;11&quot;&gt;Org.-sust.&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;card&quot; id=&quot;hierText&quot; aria-live=&quot;polite&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tint&quot;&gt;&lt;strong&gt;Golden rule:&lt;/strong&gt; &lt;span class=&quot;term&quot;&gt;organization-sustaining&lt;/span&gt; costs (costs of sustaining the organization as a whole) &lt;strong&gt;are not assigned&lt;/strong&gt; to products or customers in a managerial ABC analysis. No product or customer &quot;causes&quot; them, and they would continue to be incurred even if a product were dropped. In the slides they are the ones whose measure is &quot;None&quot; or &quot;NA&quot;: $602,000 at Worley, $117,000 at Hi-Tek, $816,000 at Fogerty.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · ABC&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;What is the difference between an activity cost pool and an activity measure?
        &lt;div class=&quot;answer&quot;&gt;The pool is the &quot;bucket&quot; that collects the costs of an activity (e.g. Setups, $157,500). The measure is the unit in which consumption of that activity is measured (setup hours, 375 in total). Dividing one by the other gives the activity rate.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;At which level of the hierarchy are setup costs? And advertising dedicated to a single product?
        &lt;div class=&quot;answer&quot;&gt;Setup is &lt;strong&gt;batch-level&lt;/strong&gt;: it is incurred for every batch, regardless of how many units the batch contains. Advertising dedicated to a product is &lt;strong&gt;product-level&lt;/strong&gt; (at Hi-Tek it is traced directly to B300 and T500).&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Why are organization-sustaining costs not allocated in an ABC analysis?
        &lt;div class=&quot;answer&quot;&gt;Because they are not caused by any specific product or customer. Allocating them on an arbitrary basis would distort margins and could lead managers to drop products that actually help cover those fixed costs.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-ochre&quot; id=&quot;worley&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 3 · Exercise 1&lt;/span&gt;
  &lt;h2&gt;Worley Company: customer profitability&lt;/h2&gt;
  &lt;p&gt;Worley is a distributor: it buys surgical supplies and resells them to hospitals at a &lt;span class=&quot;term&quot;&gt;markup&lt;/span&gt; of &lt;strong&gt;5% on cost of goods sold&lt;/strong&gt;. For years it believed that this 5% was enough to cover S&amp;amp;A expenses and generate a profit. ABC reveals that &lt;strong&gt;customers with the same sales revenue can cost very different amounts to serve&lt;/strong&gt;, because they order in different ways.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Data: excersices- Tutorial session 1.pdf, p. 1.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Total cost&lt;/th&gt;&lt;th&gt;Total activity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000 deliveries&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000 orders&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500 orders&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000 line items&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other organization-sustaining&lt;/td&gt;&lt;td&gt;602,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total S&amp;amp;A&lt;/td&gt;&lt;td&gt;$2,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items picked&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;COGS of each&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;em&gt;Line item picking&lt;/em&gt;: picking each order line in the warehouse (each distinct item to be collected from the shelves).&lt;/p&gt;

  &lt;h3&gt;Step-by-step solution&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 1 · Revenue&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Revenue = COGS × (1 + 5%) = 30,000 × 1.05 = &lt;strong&gt;$31,500&lt;/strong&gt;&lt;/div&gt;
      &lt;p&gt;The same for both hospitals, since both purchased supplies that cost Worley $30,000. The gross &lt;em&gt;markup&lt;/em&gt; is therefore $1,500 per customer.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 2 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th&gt;Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;500,000 / 5,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$100&lt;/strong&gt; per delivery&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000 / 4,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$62&lt;/strong&gt; per order&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000 / 12,500&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$16&lt;/strong&gt; per order&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000 / 450,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$1&lt;/strong&gt; per line item&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The key point is already visible here: a manual order costs almost &lt;strong&gt;4 times&lt;/strong&gt; as much as an electronic one ($62 vs $16).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 3 · Activity costs per customer&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10 × $100 = $1,000&lt;/td&gt;&lt;td&gt;25 × $100 = $2,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0 × $62 = $0&lt;/td&gt;&lt;td&gt;30 × $62 = $1,860&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15 × $16 = $240&lt;/td&gt;&lt;td&gt;0 × $16 = $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items&lt;/td&gt;&lt;td&gt;120 × $1 = $120&lt;/td&gt;&lt;td&gt;250 × $1 = $250&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;$1,360&lt;/td&gt;&lt;td&gt;$4,610&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 4 · Customer margin&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Activity costs (S&amp;amp;A)&lt;/td&gt;&lt;td&gt;1,360&lt;/td&gt;&lt;td&gt;4,610&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$140&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(3,110)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;customer margin&lt;/span&gt; is the customer&#x27;s revenue minus all the costs that customer causes: COGS plus ABC activity costs. The $602,000 of organization-sustaining costs is not assigned.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Simulator: what makes a customer profitable?&lt;/h3&gt;
  &lt;p&gt;Move the sliders or load the two hospitals. The green bar is the 5% gross markup: the customer is profitable only if activity costs stay below that threshold.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;wsim&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;10,0,15,120,30000&quot;&gt;University&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;25,30,0,250,30000&quot;&gt;Memorial&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;25,0,30,250,30000&quot;&gt;Memorial, with electronic orders&lt;/button&gt;
    &lt;/div&gt;
    &lt;label&gt;Deliveries &lt;input type=&quot;range&quot; id=&quot;wd&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;wdo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Manual orders &lt;input type=&quot;range&quot; id=&quot;wm&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;wmo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Electronic orders &lt;input type=&quot;range&quot; id=&quot;we&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;weo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Line items picked &lt;input type=&quot;range&quot; id=&quot;wl&quot; min=&quot;0&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;120&quot;&gt;&lt;output id=&quot;wlo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Customer COGS ($) &lt;input type=&quot;range&quot; id=&quot;wc&quot; min=&quot;10000&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;wco&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;5% markup&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;wbm&quot; style=&quot;background:var(--sage)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;wbmv&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Activity costs&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;wb1&quot; style=&quot;background:var(--ochre)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb2&quot; style=&quot;background:var(--brick)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb3&quot; style=&quot;background:var(--slate)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb4&quot; style=&quot;background:var(--muted)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;wbav&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ochre)&quot;&gt;&lt;/i&gt;deliveries&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;manual orders&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate)&quot;&gt;&lt;/i&gt;electronic orders&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;line items&lt;/span&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:14px&quot;&gt;Customer margin: &lt;span class=&quot;big&quot; id=&quot;wmar&quot;&gt;&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;What the exercise teaches&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;A uniform markup assumes that every customer costs the same to serve per dollar of purchases. This is not true: Memorial places &lt;strong&gt;many small, manual orders requiring many deliveries&lt;/strong&gt;, whereas University orders electronically and receives fewer deliveries. The managerial levers are:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;encouraging customers to switch to electronic ordering (Memorial, with 30 electronic instead of manual orders, would save 30 × $46 = $1,380);&lt;/li&gt;
      &lt;li&gt;setting a minimum order size or charging for deliveries;&lt;/li&gt;
      &lt;li&gt;moving to differentiated pricing: a markup on COGS plus fees per delivery or per manual order.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;It also explains Worley&#x27;s declining profits: as the share of &quot;Memorial-type&quot; customers grows, the 5% no longer covers the cost to serve.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Worley&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;At how many deliveries would University break even, all else being equal?
        &lt;div class=&quot;answer&quot;&gt;The margin is $140 and each delivery costs $100: with 1 additional delivery (11) the margin becomes $40, with 2 additional deliveries (12) it becomes −$60. The exact break-even point would be 11.4 deliveries.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Why are the $602,000 of &quot;Other organization-sustaining costs&quot; excluded from the customer margin?
        &lt;div class=&quot;answer&quot;&gt;They have no activity measure (measure &quot;None&quot;): no customer causes them. They are borne by the company as a whole and are covered by the sum of all customers&#x27; customer margins.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Should Memorial be dropped as a customer?
        &lt;div class=&quot;answer&quot;&gt;Not automatically. The negative margin indicates that the relationship, &lt;em&gt;as it currently stands&lt;/em&gt;, destroys value. The first step is to change how the customer is served (electronic orders, fewer but larger deliveries) or the price. One must then ask whether the activity costs would actually disappear if the customer were lost.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part part-slate&quot; id=&quot;hitek&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 4 · Exercise 2&lt;/span&gt;
  &lt;h2&gt;Hi-Tek Manufacturing: product margins, traditional vs ABC&lt;/h2&gt;
  &lt;p&gt;Hi-Tek manufactures two industrial components, &lt;strong&gt;B300&lt;/strong&gt; (high volume, price $20) and &lt;strong&gt;T500&lt;/strong&gt; (low volume, price $40), and closes the period with a net operating loss of $50,000. The question is which product is really causing the problem. The traditional system and ABC give opposite answers.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Data: excersices- Tutorial session 1.pdf, p. 2.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Units × price&lt;/td&gt;&lt;td&gt;70,000 × $20&lt;/td&gt;&lt;td&gt;17,500 × $40&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;to be allocated&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A expenses&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;of which advertising 50,000 / 100,000&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity pool&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Tot.&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machining (MH)&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;90,000&lt;/td&gt;&lt;td&gt;62,500&lt;/td&gt;&lt;td&gt;152,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups (setup hours)&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;75&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;375&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining (no. of products)&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other (org.-sustaining)&lt;/td&gt;&lt;td&gt;117,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;$608,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Hi-Tek solution&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ht1&quot; id=&quot;t-ht1&quot;&gt;1 · Traditional&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ht2&quot; id=&quot;t-ht2&quot;&gt;2 · ABC&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ht3&quot; id=&quot;t-ht3&quot;&gt;3 · Quantitative comparison&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht1&quot; aria-labelledby=&quot;t-ht1&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Plantwide overhead rate&lt;/strong&gt; = $608,000 / $304,000 DL = &lt;strong&gt;2.00 per direct labor dollar&lt;/strong&gt; (200%).&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manufacturing overhead (DL × 2)&lt;/td&gt;&lt;td&gt;400,000&lt;/td&gt;&lt;td&gt;208,000&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$363,700&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$136,300&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A (not assigned)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Under the traditional system the product margin coincides with each product&#x27;s gross margin. Both products appear profitable: &lt;strong&gt;the loss seems to be caused by S&amp;amp;A expenses&lt;/strong&gt;, not by the products.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht2&quot; aria-labelledby=&quot;t-ht2&quot; hidden&gt;
      &lt;p&gt;&lt;strong&gt;Activity rates:&lt;/strong&gt; Machining 213,500 / 152,500 = &lt;strong&gt;$1.40 per MH&lt;/strong&gt; · Setups 157,500 / 375 = &lt;strong&gt;$420 per setup hour&lt;/strong&gt; · Product-sustaining 120,000 / 2 = &lt;strong&gt;$60,000 per product&lt;/strong&gt;. The $117,000 of &quot;Other&quot; is organization-sustaining and is not assigned.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Advertising (traced)&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining (MH × 1.40)&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups (h × 420)&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Total assigned costs&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$496,200&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(29,200)&lt;/td&gt;&lt;td&gt;$467,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Org.-sustaining: overhead 117,000 + S&amp;amp;A 400,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;517,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The overall result does not change (−$50,000): ABC &lt;strong&gt;neither creates nor eliminates costs&lt;/strong&gt;, it redistributes them. But now T500 turns out to be &lt;strong&gt;loss-making&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht3&quot; aria-labelledby=&quot;t-ht3&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Traditional&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;63.4%&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;36.6%&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;400,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;208,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costs assigned to products&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A not assigned&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,150,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity-Based&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: DM&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;63.4%&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;36.6%&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: DL&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: advertising&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;66.7%&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;59.0%&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;41.0%&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;80.0%&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;50.0%&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;50.0%&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costs assigned to products&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Costs not assigned (117,000 + 400,000)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;517,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,150,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Under the traditional system overhead is split 65.8% / 34.2%, in line with direct labor. Under ABC, 80% of setups and 41% of machining go to T500. Total cost (2,150,000) is identical: only its distribution changes.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;diagram&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 300&quot; role=&quot;img&quot; aria-label=&quot;Chart of product margins, traditional versus ABC&quot;&gt;

      &lt;g stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;3 3&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;40&quot; x2=&quot;680&quot; y2=&quot;40&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;140&quot; x2=&quot;680&quot; y2=&quot;140&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--muted)&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;54&quot; y=&quot;44&quot;&gt;$500k&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;144&quot;&gt;$250k&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;244&quot;&gt;0&lt;/text&gt;&lt;/g&gt;
      &lt;rect x=&quot;120&quot; y=&quot;94.5&quot; width=&quot;80&quot; height=&quot;145.5&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.75&quot;/&gt;
      &lt;rect x=&quot;210&quot; y=&quot;41.5&quot; width=&quot;80&quot; height=&quot;198.5&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;rect x=&quot;410&quot; y=&quot;185.5&quot; width=&quot;80&quot; height=&quot;54.5&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.75&quot;/&gt;
      &lt;rect x=&quot;500&quot; y=&quot;240&quot; width=&quot;80&quot; height=&quot;11.7&quot; fill=&quot;var(--neg)&quot;/&gt;
      &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
        &lt;text x=&quot;160&quot; y=&quot;88&quot;&gt;363,700&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;35&quot;&gt;496,200&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;179&quot;&gt;136,300&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;268&quot; fill=&quot;var(--neg)&quot;&gt;(29,200)&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;&lt;text x=&quot;205&quot; y=&quot;290&quot;&gt;B300&lt;/text&gt;&lt;text x=&quot;495&quot; y=&quot;290&quot;&gt;T500&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;legend&quot; style=&quot;padding:0 8px&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage);opacity:.75&quot;&gt;&lt;/i&gt;Traditional&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate)&quot;&gt;&lt;/i&gt;ABC&lt;/span&gt;&lt;/div&gt;
    &lt;figcaption&gt;Product margins of the two products under the two systems (calculated figures).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details open&gt;&lt;summary&gt;Why T500 changes sign&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Setups:&lt;/strong&gt; T500 uses 80% of setup hours (300 out of 375) but only 34% of direct labor. The traditional system charged it with just 34% of these costs.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Product-sustaining:&lt;/strong&gt; $60,000 per product regardless of volume. Spread over T500&#x27;s 17,500 units this amounts to $3.43 per unit, over B300&#x27;s 70,000 units only $0.86.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Advertising:&lt;/strong&gt; T500 absorbs $100,000 of traceable advertising, twice as much as B300.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Overhead &quot;donated&quot; by B300:&lt;/strong&gt; under the plantwide rate B300 received $400,000 of overhead, under ABC $217,500. The $182,500 difference was an implicit subsidy to T500 (&lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt;).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Full unit cost under ABC: B300 ≈ $12.91 (903,800 / 70,000) against a price of $20; T500 ≈ $41.67 (729,200 / 17,500) against a price of $40. &lt;strong&gt;T500 is sold below its ABC cost.&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Hi-Tek&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Why is the total loss −$50,000 under both the traditional method and ABC?
        &lt;div class=&quot;answer&quot;&gt;Because both systems distribute the same total cost ($2,150,000). ABC shifts costs between products and between &quot;assigned&quot; and &quot;not assigned&quot;, but does not change them.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Calculate B300&#x27;s total ABC overhead.
        &lt;div class=&quot;answer&quot;&gt;126,000 (machining) + 31,500 (setups) + 60,000 (product-sustaining) = &lt;strong&gt;$217,500&lt;/strong&gt;.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Should Hi-Tek stop producing T500?
        &lt;div class=&quot;answer&quot;&gt;Not necessarily. It must first determine which costs would actually disappear (avoidable costs): setups might be reduced, or the price might be raised. The $117,000 + $400,000 of organization-sustaining costs would remain in any case. ABC shows &lt;em&gt;where to look&lt;/em&gt;; the decision requires a relevant cost analysis.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Why did the traditional system overcost B300?
        &lt;div class=&quot;answer&quot;&gt;B300 uses 65.8% of direct labor, which is the allocation base, but consumes only 20% of setups and 59% of machine-hours. With a single volume-based base it absorbed too much overhead.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part part-brick&quot; id=&quot;fogerty&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 5 · Exercise 3&lt;/span&gt;
  &lt;h2&gt;Fogerty Company: unit product cost under ABC&lt;/h2&gt;
  &lt;p&gt;Fogerty manufactures two titanium products: &lt;strong&gt;Hubs&lt;/strong&gt; (10,000 units, complex, requiring special equipment) and &lt;strong&gt;Sprockets&lt;/strong&gt; (40,000 units, simple). The requirement is the &lt;span class=&quot;term&quot;&gt;unit product cost&lt;/span&gt;, i.e. the cost of a single unit of product.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Data: excersices- Tutorial session 1.pdf, p. 3.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;DL-hours per unit&lt;/td&gt;&lt;td&gt;0.80&lt;/td&gt;&lt;td&gt;0.40&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Annual production&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials / unit&lt;/td&gt;&lt;td&gt;$32&lt;/td&gt;&lt;td&gt;$18&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Wage rate&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;$15 per DL-hour&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool (measure)&lt;/th&gt;&lt;th&gt;Cost&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Spr.&lt;/th&gt;&lt;th&gt;Tot.&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups (no. of setups)&lt;/td&gt;&lt;td&gt;$72,000&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;400&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing (MH)&lt;/td&gt;&lt;td&gt;$200,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;General factory (org.-sust.)&lt;/td&gt;&lt;td&gt;$816,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Solution&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 1 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;72,000 / 400&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$180 per setup&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;200,000 / 5,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$40 per MH&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;General factory&lt;/td&gt;&lt;td&gt;organization-sustaining&lt;/td&gt;&lt;td&gt;no rate: not assigned&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Total overhead per product&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;100 × $180 = $18,000&lt;/td&gt;&lt;td&gt;300 × $180 = $54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;5,000 × $40 = $200,000&lt;/td&gt;&lt;td&gt;0 × $40 = $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total ABC overhead&lt;/td&gt;&lt;td&gt;$218,000&lt;/td&gt;&lt;td&gt;$54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;÷ units produced&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Overhead per unit&lt;/td&gt;&lt;td&gt;$21.80&lt;/td&gt;&lt;td&gt;$1.35&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Note: setup costs are batch-level. First compute the total per product, then divide by the number of units.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Requirement 2 · Unit product cost (ABC)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Per unit&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$32.00&lt;/td&gt;&lt;td&gt;$18.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor (h × $15)&lt;/td&gt;&lt;td&gt;0.80 × 15 = $12.00&lt;/td&gt;&lt;td&gt;0.40 × 15 = $6.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;$1.80&lt;/td&gt;&lt;td&gt;$1.35&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;$20.00&lt;/td&gt;&lt;td&gt;$0.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unit product cost&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Textbook variant: what if general factory were allocated?&lt;/summary&gt;&lt;div&gt;
    &lt;p class=&quot;note&quot;&gt;Additional calculation, not required by the slides.&lt;/p&gt;
    &lt;p&gt;In the slides general factory is organization-sustaining and is therefore excluded. If instead it were to be included in product cost (for example for external reporting, where absorption costing requires all manufacturing overhead), a typical choice is to allocate it on direct labor-hours: 816,000 / 24,000 DLH (= 8,000 + 16,000) = $34 per DLH.&lt;/p&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Unit cost&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;ABC as in the slides (excluding general factory)&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;ABC + general factory at $34/DLH&lt;/td&gt;&lt;td&gt;65.80 + 27.20 = $93.00&lt;/td&gt;&lt;td&gt;25.35 + 13.60 = $38.95&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Traditional: all overhead (1,088,000) / 24,000 DLH = $45.33&lt;/td&gt;&lt;td&gt;32 + 12 + 36.27 = $80.27&lt;/td&gt;&lt;td&gt;18 + 6 + 18.13 = $42.13&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Comparing the last two rows (same cost scope), the traditional method &lt;strong&gt;undercosts&lt;/strong&gt; the complex, low-volume Hubs and &lt;strong&gt;overcosts&lt;/strong&gt; the Sprockets. It is the same pattern as at Hi-Tek.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Slider: volume dilutes batch- and product-level costs&lt;/h3&gt;
  &lt;p&gt;Teaching assumption: Hubs keep 100 setups and 5,000 machine-hours, but the number of units produced changes. Observe how the unit cost varies.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;fsim&quot;&gt;
    &lt;label&gt;Hubs units produced &lt;input type=&quot;range&quot; id=&quot;fn&quot; min=&quot;2000&quot; max=&quot;40000&quot; step=&quot;1000&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;fno&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Direct materials&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb1&quot; style=&quot;background:var(--brick)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b&gt;$32.00&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Direct labor&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb2&quot; style=&quot;background:var(--ochre)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b&gt;$12.00&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Setups / unit&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb3&quot; style=&quot;background:var(--slate)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;fv3&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Special proc. / unit&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb4&quot; style=&quot;background:var(--sage)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;fv4&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p style=&quot;margin-top:14px&quot;&gt;ABC unit product cost of Hubs: &lt;span class=&quot;big&quot; id=&quot;ftot&quot;&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Materials and labor are unit-level costs: they remain constant per unit. Setups and special processing are fixed &lt;em&gt;per batch&lt;/em&gt; or &lt;em&gt;per product&lt;/em&gt;, so their per-unit burden falls as volume rises.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Fogerty&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Why do Sprockets receive no special processing costs?
        &lt;div class=&quot;answer&quot;&gt;Because they consume 0 special processing machine-hours. Under ABC a product is charged only for the activities it actually uses.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Setup cost per unit for Hubs ($1.80) and Sprockets ($1.35) is similar. Yet Sprockets require three times as many setups: why?
        &lt;div class=&quot;answer&quot;&gt;Because their $54,000 of setup cost is spread over 40,000 units, compared with the Hubs&#x27; $18,000 over 10,000 units. Batch-level costs should be read both in total and per unit.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Which cost item best explains the high cost of Hubs?
        &lt;div class=&quot;answer&quot;&gt;Special processing: $20 per unit, almost one third of the ABC cost ($65.80). This is the special equipment mentioned in the text (&quot;Hubs require special equipment&quot;).&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-accent&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Part 6 · Synthesis&lt;/span&gt;
  &lt;h2&gt;Traditional vs ABC: comparison and limitations&lt;/h2&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspect&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Traditional costing&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Activity-Based Costing&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Overhead pools&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;One (plantwide) or a few departmental pools&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Many, one per activity&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Allocation bases&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Volume-based (DLH, DL$, MH)&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Activity measures: no. of setups, orders, deliveries…&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;S&amp;amp;A costs&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Period costs, never assigned&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Assigned if traceable (advertising, deliveries)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Organization-sustaining costs&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Included in allocated overhead&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Excluded from cost objects&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Typical use&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;External financial reporting (absorption costing)&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Internal decisions: pricing, product mix, customers&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Risk&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Cross-subsidization: simple, high-volume products pay for complex ones&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Costly to build and maintain; first-stage allocation relies on estimates&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;When ABC is worthwhile&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.2em&quot;&gt;
      &lt;li&gt;Products or customers that differ widely in volume, complexity or service requirements&lt;/li&gt;
      &lt;li&gt;High overhead relative to direct costs&lt;/li&gt;
      &lt;li&gt;Margins that &quot;don&#x27;t add up&quot; or declining profits despite stable prices (Worley)&lt;/li&gt;
      &lt;li&gt;Competitors undercutting prices on high-volume products&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Caveats&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.2em&quot;&gt;
      &lt;li&gt;A negative ABC margin is not sufficient grounds for dropping a product or customer: avoidable costs must be identified&lt;/li&gt;
      &lt;li&gt;Managerial ABC excludes some manufacturing costs (org.-sustaining) and includes S&amp;amp;A, so it is not suitable for external reporting&lt;/li&gt;
      &lt;li&gt;The cost of implementation must be justified by the informational benefits&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Final self-check&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Across the three exercises, what do the &quot;losers&quot; (Memorial, T500, Hubs) have in common?
        &lt;div class=&quot;answer&quot;&gt;They consume a disproportionate amount of non-volume-related activities: manual orders and frequent deliveries, setups, special processing. A volume-based system (uniform markup, DL$) cannot detect this.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;True or false: &quot;Switching to ABC improves the company&#x27;s net operating income.&quot;
        &lt;div class=&quot;answer&quot;&gt;&lt;strong&gt;False.&lt;/strong&gt; ABC changes the distribution, not the total (Hi-Tek: −$50,000 in both cases). Income improves only if the information leads to better decisions on pricing, processes or product mix.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;What are the formulas for the activity rate and for the cost assigned to a cost object?
        &lt;div class=&quot;answer&quot;&gt;Activity rate = pool cost / total activity. Assigned cost = activity rate × activity consumed by the cost object.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The exercise file &lt;strong&gt;does not cite any authors, texts, standards or websites&lt;/strong&gt;: it contains only the texts of three cases. The references below are therefore &lt;em&gt;external sources&lt;/em&gt;, chosen because they are the standard references on the subject. The companies Worley, Hi-Tek and Fogerty appear to be taken from the exercises in the Garrison–Noreen–Brewer textbook, but the slides do not say so.&lt;/p&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer, &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill, multiple editions)&lt;/h4&gt;
    &lt;p&gt;The standard university textbook for managerial accounting. The chapter &quot;Activity-Based Costing: A Tool to Aid Decision Making&quot; (its number varies by edition: ch. 8 in the 13th ed., ch. 5 in &lt;em&gt;Managerial Accounting for Managers&lt;/em&gt;) presents the two-stage model, the cost hierarchy, customer and product margins and the comparison with the traditional system, with exercises structured like those in this session.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com.au/managerial-accounting-for-managers-ise-9781265617660-aus&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;McGraw Hill page, Managerial Accounting for Managers&lt;/a&gt; · &lt;a href=&quot;https://highered.mheducation.com/sites/0077432312/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of an edition of Managerial Accounting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;H. T. Johnson, R. S. Kaplan, &lt;em&gt;Relevance Lost: The Rise and Fall of Management Accounting&lt;/em&gt; (Harvard Business School Press, 1987)&lt;/h4&gt;
    &lt;p&gt;The book that called traditional costing systems into question. Its thesis is that management accounting, having become subordinated to the requirements of external financial reporting, no longer provided information useful for decision-making. This critique gave rise to the movement that led to ABC.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA00566322&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bibliographic record (CiNii)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;R. Cooper, R. S. Kaplan, &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, September 1988&lt;/h4&gt;
    &lt;p&gt;The article that popularized activity-based costing. It shows how allocating overhead on volume-based bases distorts product costs, inflating those of high-volume products and deflating those of complex, low-volume ones: the phenomenon seen at Hi-Tek and Fogerty. The authors later developed these ideas in the book &lt;em&gt;Cost &amp;amp; Effect&lt;/em&gt; (1997).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article page (Ivey Publishing)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;R. S. Kaplan, S. R. Anderson, &quot;Time-Driven Activity-Based Costing&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, November 2004&lt;/h4&gt;
    &lt;p&gt;Proposes a simplified version of ABC, developed because many companies had abandoned classic ABC as slow and expensive to build and maintain. TDABC requires only two estimates: the cost per unit of time of capacity (capacity cost rate) and the time required by each activity. It responds directly to the limitations discussed in Part 6.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBS Working Knowledge, &quot;Rethinking Activity-Based Costing&quot;&lt;/a&gt; · &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanAnderson2007.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on Management And Accounting Web&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  var fmt=function(n,d){d=d||0;var s=Math.abs(n).toLocaleString(&#x27;en-US&#x27;,{minimumFractionDigits:d,maximumFractionDigits:d});return (n&lt;0?&#x27;−$&#x27;:&#x27;$&#x27;)+s;};
  /* tabs */

    var tabs=t.querySelectorAll(&#x27;[role=tab]&#x27;);
    tabs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,&#x27;false&#x27;);document.getElementById(x.getAttribute(&#x27;aria-controls&#x27;)).hidden=true;});

  /* stepper */
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,ctl=document.createElement(&#x27;div&#x27;);ctl.className=&#x27;ctl&#x27;;

    var next=document.createElement(&#x27;button&#x27;);next.className=&#x27;btn&#x27;;next.textContent=&#x27;Next →&#x27;;
    steps.forEach(function(_,k){var d=document.createElement(&#x27;i&#x27;);d.title=&#x27;Step &#x27;+(k+1);d.addEventListener(&#x27;click&#x27;,function(){go(k);});dots.appendChild(d);});
    ctl.appendChild(prev);ctl.appendChild(dots);ctl.appendChild(next);s.appendChild(ctl);
    function go(k){i=k;steps.forEach(function(st,j){st.classList.toggle(&#x27;on&#x27;,j===i);dots.children[j].classList.toggle(&#x27;on&#x27;,j===i);});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){go(Math.max(0,i-1));});
    next.addEventListener(&#x27;click&#x27;,function(){go(Math.min(steps.length-1,i+1));});
    go(0);
  });
  /* quiz */
  document.querySelectorAll(&#x27;.quiz li&#x27;).forEach(function(li){
    var a=li.querySelector(&#x27;.answer&#x27;);if(!a)return;
    var b=document.createElement(&#x27;button&#x27;);b.className=&#x27;btn reveal&#x27;;b.textContent=&#x27;Show answer&#x27;;
    a.parentNode.insertBefore(b,a);
    b.addEventListener(&#x27;click&#x27;,function(){var on=a.classList.toggle(&#x27;show&#x27;);b.textContent=on?&#x27;Hide&#x27;:&#x27;Show answer&#x27;;});
  });
  /* cost hierarchy */
  var H=[
    [&#x27;Unit-level activities&#x27;,&#x27;Performed for each individual unit produced, so their cost increases in proportion to volume. This is the only type of cost that traditional volume-based allocation bases capture well.&#x27;,&#x27;Machining (machine-hours) at Hi-Tek; special processing (MH) at Fogerty; direct materials and direct labor.&#x27;],
    [&#x27;Batch-level activities&#x27;,&#x27;Performed for each batch, order or shipment, regardless of how many units it contains. Their cost depends on the number of batches, not on volume.&#x27;,&#x27;Setups at Hi-Tek and Fogerty; manual and electronic order processing, deliveries and line item picking at Worley.&#x27;],
    [&#x27;Product-level activities&#x27;,&#x27;Support a specific product, regardless of how many units or batches are produced: product design, bill of materials maintenance, dedicated advertising.&#x27;,&#x27;Product-sustaining $60,000 per product and traced advertising ($50,000 / $100,000) at Hi-Tek.&#x27;],
    [&#x27;Customer-level activities&#x27;,&#x27;Serve a specific customer, regardless of the products purchased: sales support, customer visits, dedicated technical support.&#x27;,&#x27;At Worley, order and delivery activities are summed by customer, yielding the customer margin of University and Memorial.&#x27;],
    [&#x27;Organization-sustaining activities&#x27;,&#x27;Sustain the organization as a whole, regardless of products and customers: top management, general accounting, headquarters rent. They are not assigned in a managerial ABC analysis.&#x27;,&#x27;&quot;Other&quot; $602,000 at Worley; &quot;Other&quot; $117,000 + remaining S&amp;A $400,000 at Hi-Tek; &quot;General factory&quot; $816,000 at Fogerty.&#x27;]
  ];
  var ht=document.getElementById(&#x27;hierText&#x27;),hg=document.querySelectorAll(&#x27;.hier g&#x27;);
  function showH(k){hg.forEach(function(g){g.classList.toggle(&#x27;on&#x27;,+g.dataset.l===k);});
    ht.innerHTML=&#x27;&lt;h4 style=&quot;margin-top:0&quot;&gt;&#x27;+H[k][0]+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+H[k][1]+&#x27;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;In the exercises:&lt;/strong&gt; &#x27;+H[k][2]+&#x27;&lt;/p&gt;&#x27;;}
  hg.forEach(function(g){var k=+g.dataset.l;g.addEventListener(&#x27;click&#x27;,function(){showH(k);});g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();showH(k);}});});
  if(ht)showH(1);
  /* Worley simulator */
  var $=function(id){return document.getElementById(id);};
  var wIds=[&#x27;wd&#x27;,&#x27;wm&#x27;,&#x27;we&#x27;,&#x27;wl&#x27;,&#x27;wc&#x27;];
  function wUpd(){
    var d=+$(&#x27;wd&#x27;).value,m=+$(&#x27;wm&#x27;).value,e=+$(&#x27;we&#x27;).value,l=+$(&#x27;wl&#x27;).value,c=+$(&#x27;wc&#x27;).value;
    $(&#x27;wdo&#x27;).textContent=d;$(&#x27;wmo&#x27;).textContent=m;$(&#x27;weo&#x27;).textContent=e;$(&#x27;wlo&#x27;).textContent=l;$(&#x27;wco&#x27;).textContent=fmt(c);
    var parts=[d*100,m*62,e*16,l*1],act=parts.reduce(function(a,b){return a+b;},0),mk=c*0.05,max=Math.max(8000,mk,act);
    $(&#x27;wbm&#x27;).style.width=(mk/max*100)+&#x27;%&#x27;;$(&#x27;wbmv&#x27;).textContent=fmt(mk);
    [&#x27;wb1&#x27;,&#x27;wb2&#x27;,&#x27;wb3&#x27;,&#x27;wb4&#x27;].forEach(function(id,i){$(id).style.width=(parts[i]/max*100)+&#x27;%&#x27;;});
    $(&#x27;wbav&#x27;).textContent=fmt(act);
    var mar=mk-act,o=$(&#x27;wmar&#x27;);o.textContent=fmt(mar);o.className=&#x27;big &#x27;+(mar&gt;=0?&#x27;pos&#x27;:&#x27;neg&#x27;);
  }
  if($(&#x27;wsim&#x27;)){
    wIds.forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,wUpd);});
    document.querySelectorAll(&#x27;#wsim [data-preset]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var v=b.dataset.preset.split(&#x27;,&#x27;);wIds.forEach(function(id,i){$(id).value=v[i];});wUpd();});});
    wUpd();
  }
  /* Fogerty slider */
  function fUpd(){
    var n=+$(&#x27;fn&#x27;).value,s=18000/n,p=200000/n,max=Math.max(140,32+12+s+p);
    $(&#x27;fno&#x27;).textContent=n.toLocaleString(&#x27;en-US&#x27;);
    $(&#x27;fb1&#x27;).style.width=(32/max*100)+&#x27;%&#x27;;$(&#x27;fb2&#x27;).style.width=(12/max*100)+&#x27;%&#x27;;
    $(&#x27;fb3&#x27;).style.width=(s/max*100)+&#x27;%&#x27;;$(&#x27;fb4&#x27;).style.width=(p/max*100)+&#x27;%&#x27;;
    $(&#x27;fv3&#x27;).textContent=fmt(s,2);$(&#x27;fv4&#x27;).textContent=fmt(p,2);$(&#x27;ftot&#x27;).textContent=fmt(44+s+p,2);
  }
  if($(&#x27;fsim&#x27;)){$(&#x27;fn&#x27;).addEventListener(&#x27;input&#x27;,fUpd);fUpd();}
})();
&lt;/script&gt;
