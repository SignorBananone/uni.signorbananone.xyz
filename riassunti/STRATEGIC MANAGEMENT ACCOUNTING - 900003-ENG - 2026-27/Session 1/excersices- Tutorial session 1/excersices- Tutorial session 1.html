&lt;main&gt;
&lt;section class=&quot;part part-sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Parte 1 · Fondamenti&lt;/span&gt;
  &lt;h2&gt;Costi diretti, overhead e costing tradizionale&lt;/h2&gt;
  &lt;p&gt;I tre esercizi danno per scontati alcuni concetti di base della contabilità dei costi. Conviene fissarli prima di arrivare all&#x27;ABC.&lt;/p&gt;
  &lt;dl class=&quot;def&quot;&gt;
    &lt;dt&gt;Direct materials / direct labor&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Materiali diretti&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;manodopera diretta&lt;/span&gt;: costi che si possono attribuire con facilità e precisione a una singola unità di prodotto, come i $32 di materiale di ogni Hub (Es. 3).&lt;/dd&gt;
    &lt;dt&gt;Manufacturing overhead&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Costi generali di produzione&lt;/span&gt;, cioè tutti i costi di fabbrica che non sono diretti: setup delle macchine, ammortamenti, energia, supervisione. Non si possono tracciare sul singolo prodotto, quindi vanno &lt;em&gt;allocati&lt;/em&gt;.&lt;/dd&gt;
    &lt;dt&gt;Selling &amp;amp; administrative expenses&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Spese commerciali e amministrative&lt;/span&gt; (consegne, gestione ordini, pubblicità…). Nei bilanci tradizionali sono costi di periodo e non vengono attribuite ai prodotti. L&#x27;ABC può invece assegnarle a clienti o prodotti (Es. 1 e 2).&lt;/dd&gt;
    &lt;dt&gt;Cost of goods sold (COGS)&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Costo del venduto&lt;/span&gt;: il costo dei prodotti venduti nel periodo. In Worley è il prezzo d&#x27;acquisto pagato ai fornitori; in Hi-Tek è materiali + manodopera + overhead.&lt;/dd&gt;
    &lt;dt&gt;Absorption costing&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;term&quot;&gt;Full costing&lt;/span&gt;: il costo di prodotto &lt;em&gt;assorbe&lt;/em&gt; tutti i costi di produzione, fissi e variabili (DM + DL + overhead). Il conto economico di Hi-Tek è redatto con questo metodo.&lt;/dd&gt;
    &lt;dt&gt;Cost object&lt;/dt&gt;&lt;dd&gt;L&#x27;&lt;span class=&quot;term&quot;&gt;oggetto di costo&lt;/span&gt;, cioè ciò di cui si vuole conoscere il costo: un prodotto (B300, Hubs), un cliente (University, Memorial), un ordine.&lt;/dd&gt;
  &lt;/dl&gt;

  &lt;h3 id=&quot;tradizionale&quot;&gt;Il sistema tradizionale: un solo plantwide overhead rate&lt;/h3&gt;
  &lt;p&gt;Un sistema di costing tradizionale usa un unico &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; (tasso di overhead unico per tutto lo stabilimento), calcolato su una base di allocazione di volume come le ore o i dollari di manodopera diretta:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Plantwide overhead rate =
    &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Overhead totale stimato&lt;/span&gt;&lt;span&gt;Totale della base di allocazione stimata&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;p&gt;Ogni prodotto riceve poi overhead in proporzione alla quantità di base che consuma. Hi-Tek (Es. 2) usa i &lt;em&gt;direct labor dollars&lt;/em&gt;: $608,000 / $304,000 = 2.00, cioè 2 dollari di overhead per ogni dollaro di manodopera.&lt;/p&gt;

  &lt;figure class=&quot;diagram&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 220&quot; role=&quot;img&quot; aria-label=&quot;Schema del costing tradizionale&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Overhead totale&lt;/text&gt;
      &lt;text x=&quot;115&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;un unico pool&lt;/text&gt;
      &lt;path d=&quot;M210,110 L320,110&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;325&quot; y=&quot;70&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Una sola base&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;DL hours o DL dollars&lt;/text&gt;
      &lt;path d=&quot;M535,100 C600,60 620,50 650,50&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;path d=&quot;M535,120 C600,160 620,170 650,170&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;655&quot; y=&quot;22&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;747&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Prodotto A&lt;/text&gt;
      &lt;rect x=&quot;655&quot; y=&quot;142&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;747&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Prodotto B&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;l&#x27;overhead segue il volume di manodopera, non le attività consumate davvero&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Nel metodo tradizionale c&#x27;è un solo &quot;imbuto&quot;: tutto l&#x27;overhead passa da una base legata al volume.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tint&quot;&gt;&lt;strong&gt;Dov&#x27;è il problema.&lt;/strong&gt; Molti costi indiretti (setup, progettazione, gestione ordini) non dipendono da quante unità o ore di manodopera si producono, ma da &lt;em&gt;quante volte&lt;/em&gt; si svolge un&#x27;attività. Un prodotto a basso volume e complesso consuma molti setup ma poca manodopera: col plantwide rate risulta &lt;strong&gt;undercosted&lt;/strong&gt; (costo sottostimato), mentre il prodotto ad alto volume e semplice risulta &lt;strong&gt;overcosted&lt;/strong&gt; (costo sovrastimato). Questo travaso di costi da un prodotto all&#x27;altro si chiama &lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt;. È esattamente ciò che succede in Hi-Tek.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Fondamenti&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Perché le selling &amp;amp; administrative expenses non compaiono nel costo di prodotto in un conto economico absorption?
        &lt;div class=&quot;answer&quot;&gt;Perché sono costi di periodo: l&#x27;absorption costing include nel costo di prodotto solo i costi di produzione (DM, DL, overhead). Le S&amp;amp;A vanno a conto economico nel periodo in cui si sostengono.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Hi-Tek ha overhead per $608,000 e direct labor per $304,000. Quanto overhead riceve un prodotto con $50,000 di DL?
        &lt;div class=&quot;answer&quot;&gt;Rate = 608,000 / 304,000 = 2.00 per DL$, quindi 50,000 × 2 = &lt;strong&gt;$100,000&lt;/strong&gt;.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Che cosa significa che un prodotto è &quot;undercosted&quot;?
        &lt;div class=&quot;answer&quot;&gt;Il sistema gli attribuisce meno costi di quanti ne consumi davvero. Il suo margine sembra quindi più alto del reale, e la differenza la &quot;paga&quot; un altro prodotto (cross-subsidization).&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-accent&quot; id=&quot;abc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Parte 2 · Il metodo&lt;/span&gt;
  &lt;h2&gt;Activity-Based Costing (ABC)&lt;/h2&gt;
  &lt;p&gt;L&#x27;&lt;span class=&quot;term&quot;&gt;activity-based costing&lt;/span&gt; (contabilità dei costi per attività) parte da un&#x27;idea semplice: &lt;strong&gt;i prodotti e i clienti consumano attività, e le attività consumano risorse&lt;/strong&gt;. Al posto di un unico pool di overhead si creano più &lt;span class=&quot;term&quot;&gt;activity cost pools&lt;/span&gt; (gruppi di costi legati a un&#x27;attività), ciascuno con la propria &lt;span class=&quot;term&quot;&gt;activity measure&lt;/span&gt; o &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;, cioè la grandezza che misura quanto di quell&#x27;attività viene usata.&lt;/p&gt;

  &lt;figure class=&quot;diagram&quot;&gt;

      &lt;text x=&quot;100&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;overhead + S&amp;amp;A&lt;/text&gt;

  &lt;/figure&gt;

  &lt;h3&gt;I passi dell&#x27;ABC&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Schema standard dei manuali di managerial accounting, che le slide danno per scontato.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 1 · Definire attività, activity cost pools e activity measures&lt;/h4&gt;&lt;p&gt;Si individuano le attività che generano costi (consegne, setup, lavorazione a macchina…) e per ognuna si sceglie una misura di consumo. Nelle slide la misura è tra parentesi: &lt;em&gt;Customer deliveries (Number of deliveries)&lt;/em&gt;, &lt;em&gt;Setups (setup hours)&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · Assegnare i costi ai pool (first-stage allocation)&lt;/h4&gt;&lt;p&gt;I costi di overhead e di S&amp;amp;A vengono ripartiti tra i pool, di solito con interviste e stime sull&#x27;uso del tempo e delle risorse. Negli esercizi questo passo è &lt;strong&gt;già fatto&lt;/strong&gt;: le tabelle danno il &quot;Total Cost&quot; di ciascun pool.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Calcolare gli activity rates&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Costo totale del pool&lt;/span&gt;&lt;span&gt;Attività totale (della misura)&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Esempio Worley: 500,000 / 5,000 deliveries = &lt;strong&gt;$100 per delivery&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Assegnare i costi ai cost objects (second-stage allocation)&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Costo assegnato = Activity rate × Attività consumata dal cost object&lt;/div&gt;
      &lt;p&gt;Esempio: Memorial riceve 25 consegne × $100 = $2,500 di costo di consegna.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 5 · Preparare i report gestionali&lt;/h4&gt;&lt;p&gt;Si calcolano &lt;span class=&quot;term&quot;&gt;customer margin&lt;/span&gt; (margine per cliente, Es. 1), &lt;span class=&quot;term&quot;&gt;product margin&lt;/span&gt; (margine per prodotto, Es. 2) o &lt;span class=&quot;term&quot;&gt;unit product cost&lt;/span&gt; (costo unitario di prodotto, Es. 3). Così si vede quali clienti o prodotti creano valore e quali lo distruggono.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;gerarchia&quot;&gt;La cost hierarchy&lt;/h3&gt;
  &lt;p&gt;L&#x27;ABC classifica le attività secondo il livello a cui nascono i costi. Clicca un livello per vedere definizione ed esempi presi dagli esercizi.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure class=&quot;diagram hier&quot; style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 320&quot; role=&quot;img&quot; aria-label=&quot;Piramide della cost hierarchy&quot;&gt;
        &lt;g data-l=&quot;0&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;20,300 380,300 350,250 50,250&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Unit-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;1&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;52,246 348,246 318,196 82,196&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Batch-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;84,192 316,192 286,142 114,142&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Product-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;116,138 284,138 254,88 146,88&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Customer-level&lt;/text&gt;&lt;/g&gt;
        &lt;g data-l=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;polygon points=&quot;148,84 252,84 200,20&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;11&quot;&gt;Org.-sust.&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;card&quot; id=&quot;hierText&quot; aria-live=&quot;polite&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tint&quot;&gt;&lt;strong&gt;Regola d&#x27;oro:&lt;/strong&gt; i costi &lt;span class=&quot;term&quot;&gt;organization-sustaining&lt;/span&gt; (costi di struttura dell&#x27;intera organizzazione) &lt;strong&gt;non si assegnano&lt;/strong&gt; a prodotti o clienti in un&#x27;analisi ABC gestionale. Nessun prodotto o cliente li &quot;causa&quot;, e continuerebbero a esistere anche eliminando un prodotto. Nelle slide sono quelli con misura &quot;None&quot; o &quot;NA&quot;: $602,000 in Worley, $117,000 in Hi-Tek, $816,000 in Fogerty.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · ABC&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Qual è la differenza tra activity cost pool e activity measure?
        &lt;div class=&quot;answer&quot;&gt;Il pool è il &quot;contenitore&quot; dei costi di un&#x27;attività (es. Setups, $157,500). La measure è l&#x27;unità con cui si misura il consumo di quell&#x27;attività (setup hours, 375 in totale). Dal rapporto tra i due si ottiene l&#x27;activity rate.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;A quale livello della gerarchia appartengono i costi di setup? E la pubblicità dedicata a un singolo prodotto?
        &lt;div class=&quot;answer&quot;&gt;Il setup è &lt;strong&gt;batch-level&lt;/strong&gt;: si sostiene a ogni lotto, indipendentemente da quante unità contiene. La pubblicità dedicata a un prodotto è &lt;strong&gt;product-level&lt;/strong&gt; (in Hi-Tek è tracciata direttamente su B300 e T500).&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Perché in un&#x27;analisi ABC i costi organization-sustaining non vengono allocati?
        &lt;div class=&quot;answer&quot;&gt;Perché non sono causati da nessun prodotto o cliente specifico. Allocarli con una base arbitraria distorcerebbe i margini e potrebbe spingere a eliminare prodotti che in realtà contribuiscono a coprire quei costi fissi.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-ochre&quot; id=&quot;worley&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Parte 3 · Esercizio 1&lt;/span&gt;
  &lt;h2&gt;Worley Company: customer profitability&lt;/h2&gt;
  &lt;p&gt;Worley è un distributore: compra forniture chirurgiche e le rivende agli ospedali con un &lt;span class=&quot;term&quot;&gt;markup&lt;/span&gt; (ricarico) del &lt;strong&gt;5% sul cost of goods sold&lt;/strong&gt;. Per anni ha creduto che quel 5% bastasse a coprire le spese S&amp;amp;A e a dare un profitto. Con l&#x27;ABC scopre che &lt;strong&gt;clienti con lo stesso fatturato possono costare in modo molto diverso&lt;/strong&gt;, perché ordinano in modi diversi.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Dati: excersices- Tutorial session 1.pdf, p. 1.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool&lt;/th&gt;&lt;th&gt;Total cost&lt;/th&gt;&lt;th&gt;Total activity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000 deliveries&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000 orders&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500 orders&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000 line items&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other organization-sustaining&lt;/td&gt;&lt;td&gt;602,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale S&amp;amp;A&lt;/td&gt;&lt;td&gt;$2,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items picked&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;COGS di ciascuno&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;em&gt;Line item picking&lt;/em&gt;: prelievo a magazzino di ogni riga d&#x27;ordine (ogni articolo diverso da raccogliere sugli scaffali).&lt;/p&gt;

  &lt;h3&gt;Soluzione passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 1 · Ricavi&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Revenue = COGS × (1 + 5%) = 30,000 × 1.05 = &lt;strong&gt;$31,500&lt;/strong&gt;&lt;/div&gt;
      &lt;p&gt;Uguali per i due ospedali, perché entrambi hanno comprato forniture che a Worley sono costate $30,000. Il &lt;em&gt;markup&lt;/em&gt; lordo è quindi $1,500 per cliente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 2 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th&gt;Activity rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;500,000 / 5,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$100&lt;/strong&gt; per delivery&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000 / 4,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$62&lt;/strong&gt; per order&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000 / 12,500&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$16&lt;/strong&gt; per order&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000 / 450,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$1&lt;/strong&gt; per line item&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Già qui si vede il punto chiave: un ordine manuale costa quasi &lt;strong&gt;4 volte&lt;/strong&gt; uno elettronico ($62 contro $16).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 3 · Activity costs per cliente&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Attività&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10 × $100 = $1,000&lt;/td&gt;&lt;td&gt;25 × $100 = $2,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0 × $62 = $0&lt;/td&gt;&lt;td&gt;30 × $62 = $1,860&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15 × $16 = $240&lt;/td&gt;&lt;td&gt;0 × $16 = $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items&lt;/td&gt;&lt;td&gt;120 × $1 = $120&lt;/td&gt;&lt;td&gt;250 × $1 = $250&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;$1,360&lt;/td&gt;&lt;td&gt;$4,610&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 4 · Customer margin&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Activity costs (S&amp;amp;A)&lt;/td&gt;&lt;td&gt;1,360&lt;/td&gt;&lt;td&gt;4,610&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$140&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(3,110)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Il &lt;span class=&quot;term&quot;&gt;customer margin&lt;/span&gt; è il ricavo del cliente meno tutti i costi che quel cliente causa: COGS più i costi di attività ABC. I $602,000 organization-sustaining non si assegnano.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Simulatore: che cosa rende un cliente redditizio?&lt;/h3&gt;
  &lt;p&gt;Muovi i cursori o carica i due ospedali. La barra verde è il markup lordo del 5%: il cliente è redditizio solo se i costi delle attività stanno sotto quella soglia.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;wsim&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;10,0,15,120,30000&quot;&gt;University&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;25,30,0,250,30000&quot;&gt;Memorial&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-preset=&quot;25,0,30,250,30000&quot;&gt;Memorial, ma con ordini elettronici&lt;/button&gt;
    &lt;/div&gt;
    &lt;label&gt;Deliveries &lt;input type=&quot;range&quot; id=&quot;wd&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;wdo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Manual orders &lt;input type=&quot;range&quot; id=&quot;wm&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;wmo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Electronic orders &lt;input type=&quot;range&quot; id=&quot;we&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;weo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;Line items picked &lt;input type=&quot;range&quot; id=&quot;wl&quot; min=&quot;0&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;120&quot;&gt;&lt;output id=&quot;wlo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label&gt;COGS del cliente ($) &lt;input type=&quot;range&quot; id=&quot;wc&quot; min=&quot;10000&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;wco&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Markup 5%&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;wbm&quot; style=&quot;background:var(--sage)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;wbmv&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Costi delle attività&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;wb1&quot; style=&quot;background:var(--ochre)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb2&quot; style=&quot;background:var(--brick)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb3&quot; style=&quot;background:var(--slate)&quot;&gt;&lt;/span&gt;&lt;span id=&quot;wb4&quot; style=&quot;background:var(--muted)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;wbav&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ochre)&quot;&gt;&lt;/i&gt;deliveries&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;manual orders&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate)&quot;&gt;&lt;/i&gt;electronic orders&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;line items&lt;/span&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:14px&quot;&gt;Customer margin: &lt;span class=&quot;big&quot; id=&quot;wmar&quot;&gt;&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Che cosa insegna l&#x27;esercizio&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Un markup uniforme presuppone che tutti i clienti costino uguale per ogni dollaro di acquisto. Non è vero: Memorial fa &lt;strong&gt;molti ordini piccoli, manuali, con molte consegne&lt;/strong&gt;, mentre University ordina per via elettronica e riceve meno consegne. Le leve gestionali sono:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;spingere i clienti verso gli ordini elettronici (Memorial con 30 ordini elettronici invece di manuali risparmierebbe 30 × $46 = $1,380);&lt;/li&gt;
      &lt;li&gt;fissare un ordine minimo o far pagare le consegne;&lt;/li&gt;
      &lt;li&gt;passare a un prezzo differenziato: markup sul COGS più tariffe per consegna o per ordine manuale.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Spiega anche il calo dei profitti di Worley: se cresce la quota di clienti &quot;alla Memorial&quot;, il 5% non copre più i costi di servizio.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Worley&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Con quante consegne University andrebbe in pareggio, a parità del resto?
        &lt;div class=&quot;answer&quot;&gt;Il margine è $140 e ogni consegna costa $100: con 1 consegna in più (11) il margine diventa $40, con 2 in più (12) diventa −$60. Il pareggio esatto sarebbe a 11.4 consegne.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Perché i $602,000 di &quot;Other organization-sustaining costs&quot; non entrano nel customer margin?
        &lt;div class=&quot;answer&quot;&gt;Non hanno un&#x27;activity measure (misura &quot;None&quot;): nessun cliente li causa. Restano a carico dell&#x27;azienda nel suo insieme e si coprono con la somma dei customer margin di tutti i clienti.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Memorial dovrebbe essere abbandonato come cliente?
        &lt;div class=&quot;answer&quot;&gt;Non automaticamente. Il margine negativo indica che &lt;em&gt;così com&#x27;è&lt;/em&gt; il rapporto distrugge valore. Prima conviene cambiare il modo di servirlo (ordini elettronici, meno consegne più grandi) o il prezzo. Bisogna poi chiedersi se i costi di attività sparirebbero davvero perdendo il cliente.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-slate&quot; id=&quot;hitek&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Parte 4 · Esercizio 2&lt;/span&gt;
  &lt;h2&gt;Hi-Tek Manufacturing: product margins, tradizionale vs ABC&lt;/h2&gt;
  &lt;p&gt;Hi-Tek produce due componenti industriali, &lt;strong&gt;B300&lt;/strong&gt; (alto volume, prezzo $20) e &lt;strong&gt;T500&lt;/strong&gt; (basso volume, prezzo $40), e chiude il periodo con una perdita operativa di $50,000. Il punto è capire quale prodotto genera davvero il problema. Il sistema tradizionale e l&#x27;ABC danno risposte opposte.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Dati: excersices- Tutorial session 1.pdf, p. 2.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dato&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Unità × prezzo&lt;/td&gt;&lt;td&gt;70,000 × $20&lt;/td&gt;&lt;td&gt;17,500 × $40&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;da allocare&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A expenses&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;di cui pubblicità 50,000 / 100,000&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity pool&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Tot.&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machining (MH)&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;90,000&lt;/td&gt;&lt;td&gt;62,500&lt;/td&gt;&lt;td&gt;152,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups (setup hours)&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;75&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;375&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining (n. prodotti)&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other (org.-sustaining)&lt;/td&gt;&lt;td&gt;117,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;$608,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Soluzione Hi-Tek&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ht1&quot; id=&quot;t-ht1&quot;&gt;1 · Tradizionale&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ht2&quot; id=&quot;t-ht2&quot;&gt;2 · ABC&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ht3&quot; id=&quot;t-ht3&quot;&gt;3 · Confronto quantitativo&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht1&quot; aria-labelledby=&quot;t-ht1&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Plantwide overhead rate&lt;/strong&gt; = $608,000 / $304,000 DL = &lt;strong&gt;2.00 per direct labor dollar&lt;/strong&gt; (200%).&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$363,700&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$136,300&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A (non assegnate)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Nel sistema tradizionale il product margin coincide con il gross margin del singolo prodotto. Entrambi i prodotti sembrano redditizi: &lt;strong&gt;la perdita sembra colpa delle S&amp;amp;A&lt;/strong&gt;, non dei prodotti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht2&quot; aria-labelledby=&quot;t-ht2&quot; hidden&gt;
      &lt;p&gt;&lt;strong&gt;Activity rates:&lt;/strong&gt; Machining 213,500 / 152,500 = &lt;strong&gt;$1.40 per MH&lt;/strong&gt; · Setups 157,500 / 375 = &lt;strong&gt;$420 per setup hour&lt;/strong&gt; · Product-sustaining 120,000 / 2 = &lt;strong&gt;$60,000 per product&lt;/strong&gt;. I $117,000 &quot;Other&quot; sono organization-sustaining e non si assegnano.&lt;/p&gt;

        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Advertising (tracciata)&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining (MH × 1.40)&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups (h × 420)&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Totale costi assegnati&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$496,200&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(29,200)&lt;/td&gt;&lt;td&gt;$467,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Org.-sustaining: overhead 117,000 + S&amp;amp;A 400,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;517,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Il risultato complessivo non cambia (−$50,000): l&#x27;ABC &lt;strong&gt;non crea né elimina costi&lt;/strong&gt;, li ridistribuisce. Ma ora T500 risulta &lt;strong&gt;in perdita&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ht3&quot; aria-labelledby=&quot;t-ht3&quot; hidden&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Traditional&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;63.4%&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;36.6%&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;400,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;208,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costi assegnati ai prodotti&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S&amp;amp;A non assegnate&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costo totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,150,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity-Based&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: DM&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;63.4%&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;36.6%&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: DL&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;65.8%&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct costs: advertising&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;66.7%&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;59.0%&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;41.0%&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;80.0%&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product-sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;50.0%&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;50.0%&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costi assegnati ai prodotti&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Costi non assegnati (117,000 + 400,000)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;517,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Costo totale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;2,150,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Nel sistema tradizionale l&#x27;overhead si divide 65.8% / 34.2%, come la manodopera. Con l&#x27;ABC i setup vanno all&#x27;80% a T500 e il machining al 41%. Il costo totale (2,150,000) è identico: cambia solo la ripartizione.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

      &lt;/g&gt;

  &lt;details open&gt;&lt;summary&gt;Perché T500 cambia segno&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Setups:&lt;/strong&gt; T500 usa l&#x27;80% delle setup hours (300 su 375) ma solo il 34% della manodopera. Il sistema tradizionale gli addebitava appena il 34% di questi costi.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Product-sustaining:&lt;/strong&gt; $60,000 per prodotto a prescindere dal volume. Sulle 17,500 unità di T500 pesano $3.43 a unità, sulle 70,000 di B300 solo $0.86.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Pubblicità:&lt;/strong&gt; T500 assorbe $100,000 di advertising tracciabile, il doppio di B300.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Overhead &quot;regalato&quot; da B300:&lt;/strong&gt; sotto il plantwide rate B300 riceveva $400,000 di overhead, con l&#x27;ABC $217,500. I $182,500 di differenza erano un sussidio implicito a T500 (&lt;span class=&quot;term&quot;&gt;cross-subsidization&lt;/span&gt;).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Costo unitario completo con l&#x27;ABC: B300 ≈ $12.91 (903,800 / 70,000) contro un prezzo di $20; T500 ≈ $41.67 (729,200 / 17,500) contro un prezzo di $40. &lt;strong&gt;T500 viene venduto sotto il suo costo ABC.&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Hi-Tek&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Perché la perdita totale è −$50,000 sia con il metodo tradizionale sia con l&#x27;ABC?
        &lt;div class=&quot;answer&quot;&gt;Perché entrambi i sistemi ripartiscono lo stesso totale di costi ($2,150,000). L&#x27;ABC sposta costi tra prodotti e tra &quot;assegnati&quot; e &quot;non assegnati&quot;, ma non li cambia.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Calcola l&#x27;overhead ABC totale di B300.
        &lt;div class=&quot;answer&quot;&gt;126,000 (machining) + 31,500 (setups) + 60,000 (product-sustaining) = &lt;strong&gt;$217,500&lt;/strong&gt;.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Hi-Tek dovrebbe smettere di produrre T500?
        &lt;div class=&quot;answer&quot;&gt;Non necessariamente. Bisogna capire quali costi sparirebbero davvero (i costi evitabili): forse i setup si possono ridurre, o il prezzo si può alzare. I $117,000 + $400,000 organization-sustaining resterebbero comunque. L&#x27;ABC indica &lt;em&gt;dove guardare&lt;/em&gt;; la decisione richiede un&#x27;analisi dei costi rilevanti.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Perché il sistema tradizionale sovrastimava il costo di B300?
        &lt;div class=&quot;answer&quot;&gt;B300 usa il 65.8% della manodopera diretta, che è la base di allocazione, ma consuma solo il 20% dei setup e il 59% delle ore macchina. Con un&#x27;unica base di volume assorbiva troppo overhead.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-brick&quot; id=&quot;fogerty&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;

  &lt;p class=&quot;src&quot;&gt;Dati: excersices- Tutorial session 1.pdf, p. 3.&lt;/p&gt;

  &lt;h3&gt;Soluzione&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 1 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;72,000 / 400&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$180 per setup&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;200,000 / 5,000&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$40 per MH&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;General factory&lt;/td&gt;&lt;td&gt;organization-sustaining&lt;/td&gt;&lt;td&gt;nessun rate: non si assegna&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Overhead totale per prodotto&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;100 × $180 = $18,000&lt;/td&gt;&lt;td&gt;300 × $180 = $54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;5,000 × $40 = $200,000&lt;/td&gt;&lt;td&gt;0 × $40 = $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale overhead ABC&lt;/td&gt;&lt;td&gt;$218,000&lt;/td&gt;&lt;td&gt;$54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;÷ unità prodotte&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Overhead per unità&lt;/td&gt;&lt;td&gt;$21.80&lt;/td&gt;&lt;td&gt;$1.35&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Attenzione: i costi di setup sono batch-level. Prima si calcola il totale per prodotto, poi si divide per le unità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Richiesta 2 · Unit product cost (ABC)&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Per unità&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$32.00&lt;/td&gt;&lt;td&gt;$18.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor (h × $15)&lt;/td&gt;&lt;td&gt;0.80 × 15 = $12.00&lt;/td&gt;&lt;td&gt;0.40 × 15 = $6.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;$1.80&lt;/td&gt;&lt;td&gt;$1.35&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;$20.00&lt;/td&gt;&lt;td&gt;$0.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unit product cost&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Variante da manuale: e se il general factory venisse allocato?&lt;/summary&gt;&lt;div&gt;
    &lt;p class=&quot;note&quot;&gt;Calcolo aggiuntivo, non richiesto dalle slide.&lt;/p&gt;
    &lt;p&gt;Nelle slide il general factory è organization-sustaining, quindi resta fuori. Se invece lo si volesse includere nel costo di prodotto (per esempio per il bilancio, dove l&#x27;absorption costing richiede tutto l&#x27;overhead di produzione), una scelta tipica è ripartirlo sulle ore di manodopera: 816,000 / 24,000 DLH (= 8,000 + 16,000) = $34 per DLH.&lt;/p&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Unit cost&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;ABC delle slide (senza general factory)&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;ABC + general factory a $34/DLH&lt;/td&gt;&lt;td&gt;65.80 + 27.20 = $93.00&lt;/td&gt;&lt;td&gt;25.35 + 13.60 = $38.95&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Tradizionale: tutto l&#x27;overhead (1,088,000) / 24,000 DLH = $45.33&lt;/td&gt;&lt;td&gt;32 + 12 + 36.27 = $80.27&lt;/td&gt;&lt;td&gt;18 + 6 + 18.13 = $42.13&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Confrontando le ultime due righe (stesso perimetro di costi), il metodo tradizionale &lt;strong&gt;sottostima&lt;/strong&gt; i Hubs, complessi e a basso volume, e &lt;strong&gt;sovrastima&lt;/strong&gt; gli Sprockets. È lo stesso schema di Hi-Tek.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Cursore: il volume diluisce i costi batch e product-level&lt;/h3&gt;
  &lt;p&gt;Ipotesi didattica: i Hubs mantengono 100 setup e 5,000 machine-hours, ma cambia il numero di unità prodotte. Guarda come varia il costo unitario.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;fsim&quot;&gt;
    &lt;label&gt;Unità di Hubs prodotte &lt;input type=&quot;range&quot; id=&quot;fn&quot; min=&quot;2000&quot; max=&quot;40000&quot; step=&quot;1000&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;fno&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Direct materials&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb1&quot; style=&quot;background:var(--brick)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b&gt;$32.00&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Direct labor&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb2&quot; style=&quot;background:var(--ochre)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b&gt;$12.00&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Setups / unità&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb3&quot; style=&quot;background:var(--slate)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;fv3&quot;&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;Special proc. / unità&lt;/span&gt;&lt;div class=&quot;bartrack&quot;&gt;&lt;span id=&quot;fb4&quot; style=&quot;background:var(--sage)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;b id=&quot;fv4&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p style=&quot;margin-top:14px&quot;&gt;Unit product cost ABC dei Hubs: &lt;span class=&quot;big&quot; id=&quot;ftot&quot;&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Materiali e manodopera sono costi unit-level: restano fissi per unità. Setup e special processing sono fissi &lt;em&gt;per lotto&lt;/em&gt; o &lt;em&gt;per prodotto&lt;/em&gt;, quindi il loro peso unitario scende quando il volume sale.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Fogerty&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Perché gli Sprockets non ricevono costi di special processing?
        &lt;div class=&quot;answer&quot;&gt;Perché consumano 0 machine-hours di special processing. Con l&#x27;ABC un prodotto paga solo le attività che usa davvero.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;I setup per unità degli Hubs ($1.80) e degli Sprockets ($1.35) sono simili. Eppure gli Sprockets fanno il triplo dei setup: perché?
        &lt;div class=&quot;answer&quot;&gt;Perché i loro $54,000 di setup si distribuiscono su 40,000 unità, contro i $18,000 dei Hubs su 10,000 unità. I costi batch-level vanno letti sia in totale sia per unità.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Qual è la voce che più spiega il costo alto dei Hubs?
        &lt;div class=&quot;answer&quot;&gt;Lo special processing: $20 per unità, quasi un terzo del costo ABC ($65.80). È l&#x27;attrezzatura speciale citata nel testo (&quot;Hubs require special equipment&quot;).&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part part-accent&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Parte 6 · Sintesi&lt;/span&gt;
  &lt;h2&gt;Tradizionale vs ABC: confronto e limiti&lt;/h2&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspetto&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Costing tradizionale&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Activity-Based Costing&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Pool di overhead&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Uno (plantwide) o pochi per reparto&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Molti, uno per attività&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Basi di allocazione&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Di volume (DLH, DL$, MH)&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Activity measures: n. setup, ordini, consegne…&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Costi S&amp;amp;A&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Costi di periodo, mai assegnati&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Assegnati se tracciabili (pubblicità, consegne)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Costi organization-sustaining&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Inclusi nell&#x27;overhead allocato&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Esclusi dai cost objects&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Uso tipico&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Bilancio esterno (absorption costing)&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Decisioni interne: prezzi, mix, clienti&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Rischio&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Cross-subsidization: prodotti semplici e ad alto volume pagano per quelli complessi&lt;/td&gt;&lt;td style=&quot;text-align:left;white-space:normal&quot;&gt;Costoso da costruire e aggiornare; la first-stage allocation si basa su stime&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Quando l&#x27;ABC vale la pena&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.2em&quot;&gt;
      &lt;li&gt;Prodotti o clienti molto diversi per volume, complessità o modalità di servizio&lt;/li&gt;
      &lt;li&gt;Overhead alto rispetto ai costi diretti&lt;/li&gt;
      &lt;li&gt;Margini che &quot;non tornano&quot; o profitti in calo nonostante prezzi stabili (Worley)&lt;/li&gt;
      &lt;li&gt;Concorrenti che sottoquotano i prodotti ad alto volume&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Cautele&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.2em&quot;&gt;
      &lt;li&gt;Un margine ABC negativo non basta per decidere di eliminare un prodotto o un cliente: servono i costi evitabili&lt;/li&gt;
      &lt;li&gt;L&#x27;ABC gestionale esclude costi di produzione (org.-sustaining) e include S&amp;amp;A, quindi non è adatto al bilancio esterno&lt;/li&gt;
      &lt;li&gt;Il costo di implementazione deve essere giustificato dai benefici informativi&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica finale&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Nei tre esercizi, che cosa hanno in comune i &quot;perdenti&quot; (Memorial, T500, Hubs)?
        &lt;div class=&quot;answer&quot;&gt;Consumano in proporzione molte attività non legate al volume: ordini manuali e consegne frequenti, setup, lavorazioni speciali. Un sistema basato sul volume (markup uniforme, DL$) non lo vede.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Vero o falso: &quot;Passando all&#x27;ABC il reddito operativo dell&#x27;azienda migliora&quot;.
        &lt;div class=&quot;answer&quot;&gt;&lt;strong&gt;Falso.&lt;/strong&gt; L&#x27;ABC cambia la ripartizione, non il totale (Hi-Tek: −$50,000 in entrambi i casi). Il reddito migliora solo se le informazioni portano a decisioni migliori su prezzi, processi o mix.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;Formula dell&#x27;activity rate e del costo assegnato a un cost object?
        &lt;div class=&quot;answer&quot;&gt;Activity rate = costo del pool / attività totale. Costo assegnato = activity rate × attività consumata dal cost object.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;badge&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Il file degli esercizi &lt;strong&gt;non cita autori, testi, norme o siti&lt;/strong&gt;: contiene solo i testi di tre casi. I riferimenti qui sotto sono quindi &lt;em&gt;fonti esterne&lt;/em&gt;, scelte perché sono i testi di riferimento sull&#x27;argomento. Le aziende Worley, Hi-Tek e Fogerty sembrano riprese dagli esercizi del manuale Garrison–Noreen–Brewer, ma le slide non lo dichiarano.&lt;/p&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Garrison, Noreen, Brewer, &lt;em&gt;Managerial Accounting&lt;/em&gt; (McGraw Hill, più edizioni)&lt;/h4&gt;
    &lt;p&gt;È il manuale universitario di riferimento per la contabilità gestionale. Il capitolo &quot;Activity-Based Costing: A Tool to Aid Decision Making&quot; (numero variabile secondo l&#x27;edizione: cap. 8 nella 13ª ed., cap. 5 in &lt;em&gt;Managerial Accounting for Managers&lt;/em&gt;) presenta il modello a due stadi, la cost hierarchy, i customer e product margin e il confronto con il sistema tradizionale, con esercizi della stessa struttura di quelli di questa sessione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.mheducation.com.au/managerial-accounting-for-managers-ise-9781265617660-aus&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda McGraw Hill, Managerial Accounting for Managers&lt;/a&gt; · &lt;a href=&quot;https://highered.mheducation.com/sites/0077432312/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice di un&#x27;edizione di Managerial Accounting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;H. T. Johnson, R. S. Kaplan, &lt;em&gt;Relevance Lost: The Rise and Fall of Management Accounting&lt;/em&gt; (Harvard Business School Press, 1987)&lt;/h4&gt;
    &lt;p&gt;È il libro che ha messo in discussione i sistemi di costing tradizionali. La tesi è che la contabilità gestionale, appiattita sulle esigenze del bilancio esterno, non dava più informazioni utili alle decisioni. Da questa critica nasce il movimento che porta all&#x27;ABC.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA00566322&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda bibliografica (CiNii)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;R. Cooper, R. S. Kaplan, &quot;Measure Costs Right: Make the Right Decisions&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, settembre 1988&lt;/h4&gt;
    &lt;p&gt;È l&#x27;articolo che ha reso popolare l&#x27;activity-based costing. Mostra come l&#x27;allocazione dell&#x27;overhead su basi di volume distorca i costi dei prodotti, gonfiando quelli ad alto volume e sgonfiando quelli a basso volume e complessi: è il fenomeno visto in Hi-Tek e Fogerty. Gli autori hanno poi sviluppato le idee nel libro &lt;em&gt;Cost &amp;amp; Effect&lt;/em&gt; (1997).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;articolo (Ivey Publishing)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;R. S. Kaplan, S. R. Anderson, &quot;Time-Driven Activity-Based Costing&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, novembre 2004&lt;/h4&gt;
    &lt;p&gt;Propone una versione semplificata dell&#x27;ABC, nata perché molte aziende avevano abbandonato l&#x27;ABC classico, giudicato lento e costoso da costruire e mantenere. Il TDABC usa solo due stime: il costo per unità di tempo della capacità (capacity cost rate) e il tempo richiesto da ogni attività. Risponde direttamente ai limiti visti nella Parte 6.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBS Working Knowledge, &quot;Rethinking Activity-Based Costing&quot;&lt;/a&gt; · &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanAnderson2007.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su Management And Accounting Web&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

  /* cost hierarchy */
  var H=[
    [&#x27;Unit-level activities&#x27;,&#x27;Si svolgono per ogni singola unità prodotta, quindi il costo cresce in proporzione al volume. È l\&#x27;unico tipo di costo che le basi di volume tradizionali catturano bene.&#x27;,&#x27;Machining (machine-hours) in Hi-Tek; special processing (MH) in Fogerty; materiali e manodopera diretta.&#x27;],
    [&#x27;Batch-level activities&#x27;,&#x27;Si svolgono per ogni lotto, ordine o spedizione, a prescindere da quante unità contiene. Il costo dipende dal numero di lotti, non dal volume.&#x27;,&#x27;Setups in Hi-Tek e Fogerty; order processing manuale ed elettronico, deliveries e line item picking in Worley.&#x27;],
    [&#x27;Product-level activities&#x27;,&#x27;Servono a un prodotto specifico, indipendentemente da quante unità o lotti se ne producono: progettazione, gestione distinte base, pubblicità dedicata.&#x27;,&#x27;Product-sustaining $60,000 per prodotto e advertising tracciata ($50,000 / $100,000) in Hi-Tek.&#x27;],
    [&#x27;Customer-level activities&#x27;,&#x27;Servono un cliente specifico, indipendentemente dai prodotti acquistati: assistenza commerciale, visite, supporto tecnico dedicato.&#x27;,&#x27;In Worley le attività per ordine e consegna vengono sommate per cliente, e il risultato è il customer margin di University e Memorial.&#x27;],
    [&#x27;Organization-sustaining activities&#x27;,&#x27;Mantengono in piedi l\&#x27;organizzazione nel suo complesso, a prescindere da prodotti e clienti: direzione, contabilità generale, affitto della sede. In un\&#x27;analisi ABC gestionale non si assegnano.&#x27;,&#x27;&quot;Other&quot; $602,000 in Worley; &quot;Other&quot; $117,000 + S&amp;A residue $400,000 in Hi-Tek; &quot;General factory&quot; $816,000 in Fogerty.&#x27;]
  ];
  var ht=document.getElementById(&#x27;hierText&#x27;),hg=document.querySelectorAll(&#x27;.hier g&#x27;);
  function showH(k){hg.forEach(function(g){g.classList.toggle(&#x27;on&#x27;,+g.dataset.l===k);});
    ht.innerHTML=&#x27;&lt;h4 style=&quot;margin-top:0&quot;&gt;&#x27;+H[k][0]+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+H[k][1]+&#x27;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Negli esercizi:&lt;/strong&gt; &#x27;+H[k][2]+&#x27;&lt;/p&gt;&#x27;;}
  hg.forEach(function(g){var k=+g.dataset.l;g.addEventListener(&#x27;click&#x27;,function(){showH(k);});g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();showH(k);}});});
  if(ht)showH(1);
  /* Worley simulator */
  var $=function(id){return document.getElementById(id);};
  var wIds=[&#x27;wd&#x27;,&#x27;wm&#x27;,&#x27;we&#x27;,&#x27;wl&#x27;,&#x27;wc&#x27;];
  function wUpd(){
    var d=+$(&#x27;wd&#x27;).value,m=+$(&#x27;wm&#x27;).value,e=+$(&#x27;we&#x27;).value,l=+$(&#x27;wl&#x27;).value,c=+$(&#x27;wc&#x27;).value;
    $(&#x27;wdo&#x27;).textContent=d;$(&#x27;wmo&#x27;).textContent=m;$(&#x27;weo&#x27;).textContent=e;$(&#x27;wlo&#x27;).textContent=l;$(&#x27;wco&#x27;).textContent=fmt(c);
    var parts=[d*100,m*62,e*16,l*1],act=parts.reduce(function(a,b){return a+b;},0),mk=c*0.05,max=Math.max(8000,mk,act);
    $(&#x27;wbm&#x27;).style.width=(mk/max*100)+&#x27;%&#x27;;$(&#x27;wbmv&#x27;).textContent=fmt(mk);
    [&#x27;wb1&#x27;,&#x27;wb2&#x27;,&#x27;wb3&#x27;,&#x27;wb4&#x27;].forEach(function(id,i){$(id).style.width=(parts[i]/max*100)+&#x27;%&#x27;;});
    $(&#x27;wbav&#x27;).textContent=fmt(act);
    var mar=mk-act,o=$(&#x27;wmar&#x27;);o.textContent=fmt(mar);o.className=&#x27;big &#x27;+(mar&gt;=0?&#x27;pos&#x27;:&#x27;neg&#x27;);
  }
  if($(&#x27;wsim&#x27;)){
    wIds.forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,wUpd);});
    document.querySelectorAll(&#x27;#wsim [data-preset]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var v=b.dataset.preset.split(&#x27;,&#x27;);wIds.forEach(function(id,i){$(id).value=v[i];});wUpd();});});
    wUpd();
  }
  /* Fogerty slider */
  function fUpd(){
    var n=+$(&#x27;fn&#x27;).value,s=18000/n,p=200000/n,max=Math.max(140,32+12+s+p);
    $(&#x27;fno&#x27;).textContent=n.toLocaleString(&#x27;en-US&#x27;);

    $(&#x27;fb3&#x27;).style.width=(s/max*100)+&#x27;%&#x27;;$(&#x27;fb4&#x27;).style.width=(p/max*100)+&#x27;%&#x27;;
    $(&#x27;fv3&#x27;).textContent=fmt(s,2);$(&#x27;fv4&#x27;).textContent=fmt(p,2);$(&#x27;ftot&#x27;).textContent=fmt(44+s+p,2);
  }
  if($(&#x27;fsim&#x27;)){$(&#x27;fn&#x27;).addEventListener(&#x27;input&#x27;,fUpd);fUpd();}
})();
