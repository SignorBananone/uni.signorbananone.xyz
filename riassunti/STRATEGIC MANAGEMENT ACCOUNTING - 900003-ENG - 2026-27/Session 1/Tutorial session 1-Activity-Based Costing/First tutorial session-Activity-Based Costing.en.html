*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.62}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0 0 .5em}
h2{font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:-.01em}

p{margin:.6em 0}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.term{font-style:italic;font-weight:600}
.small{font-size:.88rem;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
/* nav */
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in oklch,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}

nav.top a{flex:none;text-decoration:none;color:var(--ink2);font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid transparent}
nav.top a:hover{border-color:var(--rule);color:var(--ink)}
/* hero */
header.hero{padding:56px 0 24px}
.kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
header.hero h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:300;letter-spacing:-.02em;margin:.15em 0 .2em}
header.hero h1 em{font-style:italic;color:var(--acc)}
.lede{font-family:var(--serif);font-size:1.3rem;line-height:1.45;max-width:46ch;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:.88rem;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:600}
.map{margin:28px 0 8px;border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:10px}
.map svg{width:100%;height:auto;display:block}
.map a{cursor:pointer}
.map a:hover rect,.map a:focus rect{stroke-width:2.5}
.map text{font-family:var(--sans)}
/* sections */
section.part{padding:56px 0 30px;border-top:1px solid var(--rule)}
.part-head{display:flex;gap:16px;align-items:baseline;margin-bottom:10px}
.part-n{font-family:var(--serif);font-size:3.2rem;font-weight:200;line-height:1;color:var(--c)}
.part-tag{display:inline-block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--c);background:var(--cb);padding:2px 10px;border-radius:99px}
.c-acc{--c:var(--acc);--cb:var(--acc-bg)}.c-sal{--c:var(--sal);--cb:var(--sal-bg)}.c-ocr{--c:var(--ocr);--cb:var(--ocr-bg)}.c-ard{--c:var(--ard);--cb:var(--ard-bg)}.c-mat{--c:var(--mat);--cb:var(--mat-bg)}
.src{font-size:.8rem;color:var(--ink2);border-left:3px solid var(--c,var(--acc));padding-left:10px;margin:8px 0 18px}
/* boxes */
.def{background:var(--cb,var(--acc-bg));border-radius:12px;padding:14px 18px;margin:16px 0}
.def b:first-child{font-family:var(--serif);font-size:1.1rem}
.formula{font-family:var(--serif);font-size:1.25rem;text-align:center;padding:16px 12px;margin:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.formula .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .3em}
.formula .frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em}
.note{border:1px dashed var(--rule);border-radius:12px;padding:10px 16px;margin:16px 0;font-size:.94rem}
.note::before{content:&quot;Note · &quot;;font-weight:600;color:var(--c,var(--acc))}
.mine{border-left:4px solid var(--ard);background:var(--ard-bg);border-radius:0 12px 12px 0;padding:10px 16px;margin:16px 0;font-size:.95rem}
.mine::before{content:&quot;Additional explanation (not in the slides) · &quot;;font-weight:600;color:var(--ard)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.figure{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:14px;margin:18px 0}
.figure svg{width:100%;height:auto;display:block}

.cap{font-size:.84rem;color:var(--ink2);margin-top:6px}

.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:600;border-bottom:2px solid var(--c,var(--ink));font-size:.85rem}

td.neg{color:var(--neg)}td.pos{color:var(--pos)}

details.card{border:1px solid var(--rule);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden}
details.card&gt;summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.card&gt;summary::-webkit-details-marker{display:none}
details.card&gt;summary::after{content:&quot;+&quot;;font-family:var(--serif);font-size:1.4rem;line-height:1;color:var(--c,var(--acc))}
details.card[open]&gt;summary::after{content:&quot;–&quot;}
details.card&gt;div{padding:0 16px 14px}

.tabs{margin:18px 0}
.tablist{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--rule)}
.tablist button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:7px 14px;color:var(--ink2);cursor:pointer;margin-bottom:-1px}
.tablist button[aria-selected=true]{background:var(--card);border-color:var(--rule);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--c,var(--acc))}
.tabpanel{background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 12px 12px;padding:14px 18px}

.steps .step[hidden]{display:none}

.stepbar button,.btn{font:inherit;font-size:.88rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.stepbar button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;flex:1}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--c,var(--acc))}
.btn.on{background:var(--c,var(--acc));color:var(--paper);border-color:transparent}

.quiz{margin-top:30px;padding:18px;border-radius:14px;background:var(--cb,var(--acc-bg))}
.quiz h3{margin-top:0;font-size:1.25rem}
.quiz details{border-top:1px solid color-mix(in oklch,var(--c) 30%,transparent);padding:10px 0}
.quiz summary{cursor:pointer;font-weight:500}
.quiz summary::marker{color:var(--c)}
.quiz .ans{margin-top:8px;padding:10px 14px;background:var(--card);border-radius:10px;font-size:.95rem}

.ctrl{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 70px;gap:8px 12px;align-items:center;font-size:.9rem;margin:6px 0}
.ctrl output{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--c,var(--acc))}
.lab{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:16px 18px;margin:18px 0}
.lab h4{margin-top:0}
.bars{margin-top:12px}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:.86rem;margin:5px 0}
.bar .track{height:16px;background:var(--paper);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .25s}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.verdict{margin-top:12px;font-family:var(--serif);font-size:1.2rem}
.pct{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:.75rem;font-weight:600;margin:3px 0 10px}
.pct div{display:flex;align-items:center;justify-content:center;color:var(--paper);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.ref{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:14px 18px;margin:14px 0}
.ref .ext{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mat);border:1px solid var(--mat);border-radius:99px;padding:1px 8px;margin-bottom:6px}
.ref h4{margin:.2em 0 .3em}
footer{border-top:1px solid var(--rule);padding:30px 0 50px;margin-top:40px;font-size:.9rem;color:var(--ink2);text-align:center}

  body{font-size:16px}
  .ctrl{grid-template-columns:1fr 60px}.ctrl input{grid-column:1/-1;grid-row:2}
  .bar{grid-template-columns:96px 1fr 72px;font-size:.78rem}
  th,td{padding:6px 6px}
  .part-n{font-size:2.4rem}
}

&lt;!-- §1 --&gt;
&lt;section class=&quot;part c-acc&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Fundamentals&lt;/span&gt;&lt;h2&gt;What Activity-Based Costing is&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;The tutorial session slides contain exercises only: the definitions and theory in this section are derived from the solutions (slides 5–27) and supplemented with additional explanations, marked as such.&lt;/p&gt;

  &lt;p&gt;A company incurs &lt;span class=&quot;term&quot;&gt;direct costs&lt;/span&gt; (costs that can be traced unambiguously to a product, such as &lt;span class=&quot;term&quot;&gt;direct materials&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;direct labor&lt;/span&gt;) and &lt;span class=&quot;term&quot;&gt;overhead&lt;/span&gt; (indirect costs: machinery, setups, deliveries, administration…), which must instead be &lt;em&gt;allocated&lt;/em&gt; using some criterion. That criterion determines how much a product or a customer appears to cost, and therefore how profitable it appears to be.&lt;/p&gt;

  &lt;h3 id=&quot;tradizionale&quot;&gt;The traditional system: a single rate for the whole plant&lt;/h3&gt;
  &lt;p&gt;In a &lt;span class=&quot;term&quot;&gt;traditional costing system&lt;/span&gt;, all manufacturing overhead is gathered into a single pool and allocated using a single base, usually volume-related (direct labor-hours or direct labor dollars). This is the &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; used by Hi-Tek (slide 14):&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Predetermined overhead rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Estimated total manufacturing overhead&lt;/span&gt;&lt;span&gt;Estimated total direct labor dollars&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;The rate is &lt;span class=&quot;term&quot;&gt;predetermined&lt;/span&gt;: it is computed at the beginning of the period from estimated data and then applied to each product&#x27;s actual base. The weakness: if a cost does &lt;em&gt;not&lt;/em&gt; depend on volume (for example setups, i.e. preparing the machines for a run), a volume-based allocation loads it mainly onto high-volume products, even though these costs are caused by small, complex products.&lt;/p&gt;

  &lt;h3 id=&quot;abc&quot;&gt;The idea behind ABC&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-Based Costing (ABC)&lt;/b&gt; — a method that assigns overhead in two stages: first from costs to &lt;em&gt;activities&lt;/em&gt; (deliveries, setups, machining…), then from activities to &lt;span class=&quot;term&quot;&gt;cost objects&lt;/span&gt; (products, customers) in proportion to how much of each activity each object &lt;em&gt;consumes&lt;/em&gt;.&lt;/div&gt;

  &lt;h3 id=&quot;pool&quot;&gt;The building blocks: pool, measure, rate&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Activity cost pool&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Activity measure&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Activity rate&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Assignment&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Activity cost pool&lt;/b&gt;: the “bucket” in which all the costs of an activity are accumulated. Worley example (slide 3): &lt;i&gt;Customer deliveries&lt;/i&gt; collects $500,000 of selling and administrative expenses related to deliveries.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Activity measure&lt;/b&gt; (often called the &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;, the factor that causes the cost): the unit used to count how much of the activity is consumed. For Worley&#x27;s deliveries it is the &lt;i&gt;number of deliveries&lt;/i&gt;; for Hi-Tek&#x27;s machining, &lt;i&gt;machine-hours&lt;/i&gt; (MH); for setups, &lt;i&gt;setup hours&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;A good measure must have a cause-and-effect relationship with the cost: more deliveries, more delivery costs.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p id=&quot;rate&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt;: the cost of &lt;em&gt;one&lt;/em&gt; unit of activity.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;(a) Estimated overhead cost of the pool&lt;/span&gt;&lt;span&gt;(b) Expected (total) activity&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Worley: $500,000 ÷ 5,000 deliveries = &lt;b&gt;$100 per delivery&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Assignment to the cost object&lt;/b&gt;: multiply the rate by the activity consumed by that product or customer.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ABC cost = (a) Activity rate × (b) Activity of the cost object&lt;/div&gt;&lt;p&gt;University consumes 10 deliveries → 10 × $100 = &lt;b&gt;$1,000&lt;/b&gt;. Summing across all pools gives the &lt;span class=&quot;term&quot;&gt;total activity costs&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Many textbooks describe ABC implementation in five steps: ① define activities, cost pools and activity measures; ② assign overhead to the pools; ③ compute the activity rates; ④ assign costs to cost objects; ⑤ prepare management reports. The tutorial exercises start from step ③: pools and costs are given in the text.&lt;/div&gt;

  &lt;h3 id=&quot;gerarchia&quot;&gt;The cost hierarchy: at what level does a cost arise?&lt;/h3&gt;
  &lt;p&gt;Slides 19–21 explain the differences between the two systems through the level of each activity. Activities are classified according to &lt;em&gt;what&lt;/em&gt; triggers them:&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 330&quot; role=&quot;img&quot; aria-labelledby=&quot;hit&quot;&gt;

      &lt;polygon points=&quot;240,200 620,200 650,254 210,254&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Batch-level&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;per batch, regardless of units&lt;/text&gt;

    &lt;/g&gt;
    &lt;g font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;
      &lt;text x=&quot;575&quot; y=&quot;50&quot;&gt;General factory (Fogerty), Other (Hi-Tek)&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;110&quot;&gt;Deliveries and orders (Worley)&lt;/text&gt;
      &lt;text x=&quot;630&quot; y=&quot;170&quot;&gt;Product-sustaining (Hi-Tek)&lt;/text&gt;
      &lt;text x=&quot;660&quot; y=&quot;230&quot;&gt;Setups (Hi-Tek, Fogerty)&lt;/text&gt;

  &lt;div class=&quot;cap&quot;&gt;Examples from the exercises in the slides. Classifying Worley&#x27;s deliveries and orders as customer-level is our own choice: the slides do not name it.&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Unit-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Performed for &lt;em&gt;each unit&lt;/em&gt;: double the units, double the activity. Hi-Tek&#x27;s machine-hours are unit-level (slide 19), and so is the base of the traditional system (direct labour dollars). This is why the percentages are almost the same: 59%/41% under ABC versus 65.8%/34.2% under the traditional system.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Batch-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Performed for each &lt;em&gt;batch&lt;/em&gt;, regardless of how many units it contains. Setting up a machine costs the same for 10 or for 10,000 units. Slide 20 shows that T500, despite its few units, consumes 80% of the setups: this is where the traditional system errs the most.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Product-level (product-sustaining) activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Needed to &lt;em&gt;keep a product line alive&lt;/em&gt; (design, bill-of-materials maintenance, product managers…), regardless of how many units or batches are produced. Hi-Tek: $60,000 per product, 50% to each (slide 21).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Customer-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Related to serving a specific &lt;em&gt;customer&lt;/em&gt;: deliveries, order processing, customer support. It is the core of the Worley exercise, where the cost object is the customer, not the product.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Organization-sustaining activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sustains the organization as a whole (general management, headquarters, general accounting…): it would be incurred even without that product or that customer. Rule from the slides (16 and 25): &lt;b&gt;organization-sustaining and idle capacity costs are not allocated to products&lt;/b&gt;. &lt;span class=&quot;term&quot;&gt;Idle capacity&lt;/span&gt; is the cost of resources that are available but unused: charging it to products would inflate their cost.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Fundamentals&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does a plantwide rate based on direct labor distort the cost of low-volume products?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because it allocates all overhead in proportion to a volume-based measure. Batch-level and product-level costs, which small and complex products consume disproportionately, end up mostly on high-volume products: low-volume products are &lt;b&gt;undercosted&lt;/b&gt;, high-volume products are &lt;b&gt;overcosted&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Compute the activity rate of a $157,500 pool with 375 setup hours.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$157,500 ÷ 375 = &lt;b&gt;$420 per setup hour&lt;/b&gt; (Hi-Tek, slide 15).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is a machine setup unit-, batch- or product-level?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Batch-level&lt;/b&gt;: it is performed once per batch, whatever the number of units in the batch.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;According to the slides, which costs does ABC leave out of product cost?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Organization-sustaining costs&lt;/b&gt; and &lt;b&gt;idle capacity costs&lt;/b&gt;: they are not caused by any specific product.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §2 --&gt;
&lt;section class=&quot;part c-sal&quot; id=&quot;worley&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Exercise 1&lt;/span&gt;&lt;h2&gt;Worley Company: how profitable is each customer?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 2–9.&lt;/p&gt;

  &lt;p&gt;Worley buys surgical supplies from manufacturers and resells them, with delivery, to hundreds of hospitals. The price is the purchase cost plus a 5% &lt;span class=&quot;term&quot;&gt;markup&lt;/span&gt;: goods that cost $100 are sold for $105. For years Worley believed the 5% was enough to cover selling and administrative expenses and leave a reasonable profit. With profits declining, it introduces ABC to understand &lt;span class=&quot;term&quot;&gt;customer profitability&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool (measure)&lt;/th&gt;&lt;th&gt;Total cost&lt;/th&gt;&lt;th&gt;Total activity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries (no. of deliveries)&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing (manual orders)&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing (electronic orders)&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking (line items picked)&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other organization-sustaining (none)&lt;/td&gt;&lt;td&gt;602,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total selling &amp;amp; admin&lt;/td&gt;&lt;td&gt;$2,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items picked&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Both hospitals purchased goods that cost Worley $30,000. A &lt;span class=&quot;term&quot;&gt;line item&lt;/span&gt; is a line on an order, i.e. a distinct item to be retrieved from the warehouse (&lt;span class=&quot;term&quot;&gt;picking&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Step-by-step solution&lt;/h3&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q1 · Total revenue&lt;/h4&gt;
      &lt;p&gt;Revenue = cost of goods sold (a) + markup in dollars (b), where b = 5% × a.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold (a)&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Markup 5% (b)&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Revenue (a)+(b)&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Identical: under Worley&#x27;s pricing system, the two customers look the same.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;(a) Cost&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;(a)÷(b) Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;$100 per delivery&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;$62 per manual order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500&lt;/td&gt;&lt;td&gt;$16 per electronic order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;$1 per line item&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The $602,000 of organization-sustaining costs has no rate: it is not assigned to customers. A manual order costs almost &lt;b&gt;4 times&lt;/b&gt; as much as an electronic one ($62 versus $16).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q3 · Total activity costs per customer&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;ABC cost&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;th&gt;ABC cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;$100&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;$1,000&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;td&gt;$2,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;$62&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;1,860&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;$16&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;240&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Line items&lt;/td&gt;&lt;td&gt;$1&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$1,360&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$4,610&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q4 · Customer margin&lt;/h4&gt;
      &lt;p&gt;Mind the hint: start from sales and deduct the cost of goods sold &lt;em&gt;as well&lt;/em&gt;.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Total activity costs&lt;/td&gt;&lt;td&gt;1,360&lt;/td&gt;&lt;td&gt;4,610&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$140&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(3,110)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;With the same revenue, &lt;b&gt;University&lt;/b&gt; is barely profitable, while &lt;b&gt;Memorial&lt;/b&gt; loses $3,110: many small deliveries, manual orders, more line items to pick.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button type=&quot;button&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Customer margin&lt;/b&gt; — sales − cost of goods sold − the costs of the activities consumed by the customer. It is not net income: organization-sustaining costs are excluded and must be covered by the margins of all customers together.&lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Lab · build a customer&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Move the sliders: the activity rates stay as in the slides ($100, $62, $16, $1) and the markup stays at 5%. The initial values are Memorial&#x27;s.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-cogs&quot;&gt;Goods purchased (COGS)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-cogs&quot; min=&quot;5000&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;o-cogs&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-del&quot;&gt;Deliveries&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-del&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;o-del&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-man&quot;&gt;Manual orders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-man&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;o-man&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-ele&quot;&gt;Electronic orders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-ele&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;o-ele&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-li&quot;&gt;Line items picked&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-li&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;&lt;output id=&quot;o-li&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin:8px 0&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;uni&quot;&gt;Load University&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;mem&quot;&gt;Load Memorial&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;ele&quot;&gt;Memorial with electronic orders&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;bars&quot; id=&quot;w-bars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;w-verdict&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;What can Worley do with this information? A uniform markup means that “cheap” customers subsidize costly ones. The typical levers are encouraging electronic orders, consolidating deliveries, setting a minimum order size, or charging separately for costly services (extra deliveries, manual orders). Try the “Memorial with electronic orders” preset: 30 manual orders at $62 become 30 electronic orders at $16, and the loss falls by $1,380.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Worley&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the revenue of the two hospitals identical while the margin is not?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The price depends only on the cost of the goods (5% markup), whereas the cost to serve depends on the customer&#x27;s &lt;b&gt;behavior&lt;/b&gt;: number of deliveries, type of order, line items picked.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How much does each additional delivery to Memorial cost Worley? And each additional manual order?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$100 per delivery, $62 per manual order (the activity rates from Q2).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why are the $602,000 of “Other organization-sustaining costs” excluded from the customer margin?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;They have no activity measure and are not caused by any specific customer: they would still exist if University or Memorial were lost. Assigning them with an arbitrary criterion would distort the margin.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How many fewer deliveries would Memorial need to reach a customer margin of zero, all else equal?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The loss is $3,110 and each delivery is worth $100: &lt;b&gt;32 fewer deliveries&lt;/b&gt; would be needed, but Memorial makes only 25. Deliveries alone are not enough: manual orders must be addressed too.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §3 --&gt;
&lt;section class=&quot;part c-ocr&quot; id=&quot;hitek&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Exercise 2&lt;/span&gt;&lt;h2&gt;Hi-Tek Manufacturing: traditional versus ABC&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 10–21.&lt;/p&gt;

  &lt;p&gt;Hi-Tek makes two industrial components: &lt;b&gt;B300&lt;/b&gt; (high volume: 70,000 units at $20) and &lt;b&gt;T500&lt;/b&gt; (low volume: 17,500 units at $40). The income statement under &lt;span class=&quot;term&quot;&gt;absorption costing&lt;/span&gt; (all manufacturing overhead is included in product cost) shows a loss:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;500,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Selling &amp;amp; administrative expenses&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$436,300&lt;/td&gt;&lt;td&gt;$251,700&lt;/td&gt;&lt;td&gt;$688,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;COGS&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$1,600,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The ABC team determines that $50,000 (B300) and $100,000 (T500) of advertising expenses are &lt;span class=&quot;term&quot;&gt;directly traceable&lt;/span&gt; to the products; the remaining selling and administrative expenses are organization-sustaining. Manufacturing overhead is divided into four pools:&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool (measure)&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Machining (machine-hours)&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;90,000&lt;/td&gt;&lt;td&gt;62,500&lt;/td&gt;&lt;td&gt;152,500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Setups (setup hours)&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;75&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;375&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Product-sustaining (no. of products)&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Other (organization-sustaining)&lt;/td&gt;&lt;td&gt;117,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total manufacturing overhead&lt;/td&gt;&lt;td&gt;$608,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Q1 · Traditional&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q2 · ABC&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q3 · Comparison&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Sales: B300 = 70,000 × $20 = &lt;b&gt;$1,400,000&lt;/b&gt;; T500 = 17,500 × $40 = &lt;b&gt;$700,000&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;POHR = $608,000 ÷ $304,000 = &lt;b&gt;$2.00 per direct labor dollar&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Total manufacturing cost = DM + DL + applied overhead; Product margin = Sales − Total manufacturing cost.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Overhead @ $2.00 per DL$&lt;/td&gt;&lt;td&gt;400,000&lt;/td&gt;&lt;td&gt;208,000&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Total manufacturing cost&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$363,700&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$136,300&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Slide 14: under the traditional system &lt;b&gt;all&lt;/b&gt; manufacturing overhead goes to the products, and no selling expense (not even advertising) is assigned.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;First step, the activity rates (slide 15):&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;(a) Cost&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;152,500 MH&lt;/td&gt;&lt;td&gt;$1.40 per MH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;375 setup hours&lt;/td&gt;&lt;td&gt;$420 per setup hour&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product sustaining&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;2 products&lt;/td&gt;&lt;td&gt;$60,000 per product&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Then the assignment (slide 16). For example, B300 machining = 90,000 × $1.40 = $126,000; T500 setups = 300 × $420 = $126,000.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Advertising expense&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$496,200&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(29,200)&lt;/td&gt;&lt;td&gt;$467,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;The picture is reversed:&lt;/b&gt; T500, which appeared to earn $136,300, actually loses $29,200.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Why do the two assignments differ (slides 17–21)? First, the &lt;em&gt;scope&lt;/em&gt; changes: the traditional system assigns all $608,000 of overhead, ABC only $491,000, because it excludes the $117,000 of organization-sustaining costs. In addition, ABC adds advertising ($150,000), which the traditional system ignores. Second, the &lt;em&gt;shares&lt;/em&gt; change:&lt;/p&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ocr)&quot;&gt;&lt;/i&gt;B300&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ard)&quot;&gt;&lt;/i&gt;T500&lt;/span&gt;&lt;/div&gt;
      &lt;div id=&quot;pctbars&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;In the table on slide 18, the direct materials total for T500 is written as “$688,800”: this is a typo, the correct total is $688,000. Slides 20–21 round 65.8%/34.2% to 66%/34%.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;figure&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-hchart=&quot;m&quot;&gt;Product margin&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-hchart=&quot;o&quot;&gt;Overhead assigned&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Bar chart comparing traditional and ABC for B300 and T500&quot; id=&quot;hchart&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--rule)&quot;&gt;&lt;/i&gt;Traditional&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ocr)&quot;&gt;&lt;/i&gt;ABC&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cap&quot; id=&quot;hcap&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three reasons, in brief&lt;/h3&gt;
  &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Machining: same logic, similar results&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Machine-hours are a &lt;b&gt;unit-level&lt;/b&gt; measure, like the direct labour dollars of the traditional system. This is why the shares are close: 59.0%/41.0% versus 65.8%/34.2% (slide 19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Setups: where the traditional system errs the most&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Setup is a &lt;b&gt;batch-level&lt;/b&gt; activity. B300 is the high-volume product (70,000 units) but consumes only 20% of the setups; T500 (17,500 units) consumes 80%. The traditional system, being based on labor, does the opposite: it charges 66% to B300 (slide 20).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Product sustaining and advertising&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;b&gt;Product-level&lt;/b&gt; costs are split 50/50 because each line requires the same support, regardless of volume (slide 21). Advertising is traced directly: $50,000 to B300 and $100,000 to T500, whereas the traditional system does not assign it at all.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;mine&quot;&gt;The totals reconcile: $500,000 (traditional margin) − $150,000 (advertising now assigned) + $117,000 (organization-sustaining overhead no longer assigned) = $467,000 (ABC margin). Then $467,000 − $117,000 − ($550,000 − $150,000) of organization-sustaining expenses = $(50,000), the same loss as in the income statement. ABC does not change the company&#x27;s total profit: it changes its &lt;em&gt;distribution&lt;/em&gt; across products.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Hi-Tek&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;How much manufacturing overhead does the ABC system assign to products, and why not all of it?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$491,000 = $608,000 − $117,000. The $117,000 “Other” is organization-sustaining and is not allocated to products.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Compute the setup cost assigned to B300.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;75 setup hours × $420 = &lt;b&gt;$31,500&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does T500 go from a margin of +$136,300 to −$29,200?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Under ABC it receives more setup cost ($126,000), more advertising ($100,000) and its share of product-sustaining costs. Overall, the indirect costs assigned rise from $208,000 to $273,500 of overhead, plus $100,000 of advertising.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If Hi-Tek dropped T500, would profit increase by $29,200?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Not necessarily: ABC shows where to look, it does not make the decision by itself. One must check which costs would actually disappear (for example, whether the freed-up setup hours translate into savings or into &lt;span class=&quot;term&quot;&gt;idle capacity&lt;/span&gt;). This calls for a relevant cost analysis, but the signal should be taken seriously: a higher price or larger batches for T500 are the first levers.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §4 --&gt;
&lt;section class=&quot;part c-ard&quot; id=&quot;fogerty&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Exercise 3&lt;/span&gt;&lt;h2&gt;Fogerty Company: unit product cost under ABC&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 22–27.&lt;/p&gt;

  &lt;p&gt;Fogerty makes &lt;b&gt;Hubs&lt;/b&gt; (titanium hubs) and &lt;b&gt;Sprockets&lt;/b&gt;. Hubs require special equipment and are more complex to produce.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor-hours per unit&lt;/td&gt;&lt;td&gt;0.80&lt;/td&gt;&lt;td&gt;0.40&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Annual production&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct materials per unit&lt;/td&gt;&lt;td&gt;$32&lt;/td&gt;&lt;td&gt;$18&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor wage rate&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;$15 per hour&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool (measure)&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Machine setups (no. of setups)&lt;/td&gt;&lt;td&gt;$72,000&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Special processing (MH)&lt;/td&gt;&lt;td&gt;$200,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;General factory (org.-sustaining)&lt;/td&gt;&lt;td&gt;$816,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q1 · Activity rates&lt;/h4&gt;
      &lt;p&gt;Machine setups: $72,000 ÷ 400 = &lt;b&gt;$180 per setup&lt;/b&gt;. Special processing: $200,000 ÷ 5,000 = &lt;b&gt;$40 per MH&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;No rate for General factory: it is organization-sustaining and is not allocated to products (slide 25).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2a · Total ABC overhead per product&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;$180&lt;/td&gt;&lt;td&gt;100 → $18,000&lt;/td&gt;&lt;td&gt;300 → $54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;$40&lt;/td&gt;&lt;td&gt;5,000 → $200,000&lt;/td&gt;&lt;td&gt;0 → $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$218,000&lt;/td&gt;&lt;td&gt;$54,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2b · Unit product cost&lt;/h4&gt;
      &lt;p&gt;Unit cost is the sum of the direct costs per unit and the ABC overhead divided by the units produced.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$32.00&lt;/td&gt;&lt;td&gt;$18.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor ($15 × 0.80 / 0.40 DLH)&lt;/td&gt;&lt;td&gt;12.00&lt;/td&gt;&lt;td&gt;6.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Overhead ($218,000 ÷ 10,000 / $54,000 ÷ 40,000)&lt;/td&gt;&lt;td&gt;21.80&lt;/td&gt;&lt;td&gt;1.35&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unit cost&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button type=&quot;button&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Interactive chart · Hubs volume and unit cost&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;The Hubs&#x27; setup and special processing costs ($218,000) are not unit-level: if the same number of setups and machine-hours served more units, the cost per unit would fall. Teaching assumption: fixed activity, variable volume.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;f-q&quot;&gt;Hubs units produced&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;f-q&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;o-q&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;figure&quot; style=&quot;margin:10px 0 0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 260&quot; id=&quot;fchart&quot; role=&quot;img&quot; aria-label=&quot;Hubs unit cost curve as volume varies&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;f-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;The slides do not ask for a comparison with the traditional system, but it is worth making. If the same $272,000 of overhead ($72,000 + $200,000) were allocated on direct labor-hours (10,000 × 0.8 + 40,000 × 0.4 = 24,000 DLH → $11.33 per DLH), Hubs would receive $9.07 per unit instead of $21.80, and Sprockets $4.53 instead of $1.35. Unit costs: Hubs $53.07 versus $65.80 under ABC; Sprockets $28.53 versus $25.35. The complex, low-volume product would be undercosted: the same pattern as Hi-Tek.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Fogerty&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does the $816,000 of General factory not appear in the unit cost?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;It is organization-sustaining: it does not depend on the production of Hubs or Sprockets. According to the slides it is not allocated to products, so it has no activity rate.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Sprockets require 3 times as many setups as Hubs: why is their unit overhead so low?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because they do not use special processing (all $200,000 goes to Hubs) and because their $54,000 of setup cost is spread over 40,000 units: $1.35 per unit.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Recompute the Hubs unit cost if 200 setups were needed instead of 100 (everything else unchanged).&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Overhead = 200 × $180 + $200,000 = $236,000 → $23.60 per unit; unit cost = 32 + 12 + 23.60 = &lt;b&gt;$67.60&lt;/b&gt;. (Assumption: the rate stays at $180, i.e. the pool grows proportionally.)&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §5 --&gt;
&lt;section class=&quot;part c-mat&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Summary&lt;/span&gt;&lt;h2&gt;Key takeaways&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspect&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Traditional costing&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Activity-Based Costing&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Overhead pools&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;A single one (plantwide)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;One per activity&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Allocation base&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Volume-based (DL$, DLH)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Activity measures with a causal link (MH, setups, orders, deliveries…)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Overhead assigned&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;All manufacturing overhead&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Excluding organization-sustaining and idle capacity&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Selling &amp;amp; admin&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Period costs, not assigned&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Assigned if traceable (advertising, deliveries, orders)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Cost objects&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Products&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Products &lt;em&gt;and&lt;/em&gt; customers&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Typical risk&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Niche or complex products undercosted&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Cost and complexity of the system&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Formulas from the tutorial&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;Activity rate = estimated pool cost ÷ total expected activity&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;ABC cost = activity rate × activity consumed&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Customer margin = sales − COGS − total activity costs&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Product margin = sales − total (direct + activity) cost&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;POHR = estimated overhead ÷ estimated base (e.g. DL$)&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Unit product cost = DM + DL + ABC overhead ÷ units&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note c-mat&quot;&gt;Common mistakes in the exercises: forgetting COGS in the customer margin (the Worley hint); allocating organization-sustaining costs; confusing “per order” with “per line item”; dividing a product&#x27;s overhead by the units of &lt;em&gt;all&lt;/em&gt; products instead of the product under consideration.&lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Link to the rest of the course: this is the first tutorial session of Strategic Management Accounting, and the calculations assume the ABC theory covered in lectures. I could not open the other files in the corso/ folder (the tool available does not allow listing its contents), so there are no cross-references to other lectures here: check definitions and notation yourself against the Session 1 theory slides.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- Per approfondire --&gt;
&lt;section class=&quot;part c-mat&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Further reading&lt;/span&gt;&lt;h2&gt;Reference texts and studies&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The tutorial slides &lt;b&gt;do not cite&lt;/b&gt; any authors, texts, standards or websites. The cards below are reference readings on ABC selected by Claude and verified through a web search: they are all &lt;b&gt;external sources&lt;/b&gt;, distinct from the content of the slides.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;External source&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;A standard managerial accounting textbook. The chapter “Activity-Based Costing: A Tool to Aid Decision Making” (ch. 7 or 8 depending on the edition) presents the five steps of ABC, the cost hierarchy, and the calculation of customer and product margins. The Worley, Hi-Tek and Fogerty exercises share the style and structure of this text&#x27;s end-of-chapter exercises: this is an assumption, as the slides do not state their source. It matters because it offers theory and exercises in the same format as the tutorial.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/1259011828/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of one edition (McGraw Hill Higher Education)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;External source&lt;/span&gt;
    &lt;h4&gt;Robin Cooper, Robert S. Kaplan — “Measure Costs Right: Make the Right Decisions”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, September 1988&lt;/h4&gt;
    &lt;p&gt;An 8-page article among the founding texts of ABC: it argues that traditional volume-based systems distort product costs and lead to wrong pricing and product-mix decisions. It matters because it is the origin of the idea put into practice in the Hi-Tek exercise.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article page (Ivey Publishing, HBR distributor)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;External source&lt;/span&gt;
    &lt;h4&gt;Cooper &amp;amp; Kaplan — the cost hierarchy (unit, batch, product, facility level)&lt;/h4&gt;
    &lt;p&gt;A classification of activities according to what causes them: per unit, per batch, per product, per facility. It is the key used in slides 19–21 to explain why setups (batch-level) and product-sustaining costs are misallocated by a volume-based allocation base. Introductory sources use slightly different names for the top level (facility-sustaining or organization-sustaining).&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.accountingtools.com/articles/cost-hierarchy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AccountingTools — Cost hierarchy definition&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;External source&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson — “Time-Driven Activity-Based Costing”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, November 2004 (pp. 131–138)&lt;/h4&gt;
    &lt;p&gt;A response to criticisms of conventional ABC, regarded as costly and slow to build and maintain. &lt;span class=&quot;term&quot;&gt;TDABC&lt;/span&gt; uses only two estimates: the cost per time unit of the capacity supplied and the time required by each transaction. It contains customer profitability examples similar to the Worley case. In 2007 it became a book (Harvard Business School Press).&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=485443&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Working paper on SSRN&lt;/a&gt; · &lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBS Working Knowledge — “Rethinking Activity-Based Costing”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;External source&lt;/span&gt;
    &lt;h4&gt;Kaplan, Cooper — &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt; (Harvard Business School Press, 1997/1998)&lt;/h4&gt;
    &lt;p&gt;A book that takes ABC from cost measurement to management (&lt;span class=&quot;term&quot;&gt;activity-based management&lt;/span&gt;), alongside target costing and kaizen costing. Useful for the “strategic” side of the course: how to use ABC figures for decision-making.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bibliographic record (ISBN 9780875847887)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var usd=function(n){var s=Math.round(Math.abs(n)).toLocaleString(&quot;en-US&quot;);return n&lt;0?&quot;$(&quot;+s+&quot;)&quot;:&quot;$&quot;+s};
  var NS=&quot;http://www.w3.org/2000/svg&quot;;
  function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e}

  /* tabs */
  $$(&quot;[data-tabs]&quot;).forEach(function(box){
    var btns=$$(&quot;.tablist button&quot;,box),panels=$$(&quot;:scope &gt; .tabpanel&quot;,box);
    btns.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){
      btns.forEach(function(x,j){x.setAttribute(&quot;aria-selected&quot;,i===j?&quot;true&quot;:&quot;false&quot;)});
      panels.forEach(function(p,j){p.hidden=i!==j});
    })});
  });

  /* steps */
  $$(&quot;[data-steps]&quot;).forEach(function(box){
    var steps=$$(&quot;.step&quot;,box),dots=$(&quot;.dots&quot;,box),i=0,prev=$(&quot;[data-prev]&quot;,box),next=$(&quot;[data-next]&quot;,box);
    steps.forEach(function(){dots.appendChild(document.createElement(&quot;i&quot;))});
    function show(){steps.forEach(function(s,j){s.hidden=j!==i});$$(&quot;i&quot;,dots).forEach(function(d,j){d.className=j&lt;=i?&quot;on&quot;:&quot;&quot;});prev.disabled=i===0;next.disabled=i===steps.length-1}
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });

  /* Worley */
  var W={cogs:&quot;w-cogs&quot;,del:&quot;w-del&quot;,man:&quot;w-man&quot;,ele:&quot;w-ele&quot;,li:&quot;w-li&quot;};
  var presets={uni:[30000,10,0,15,120],mem:[30000,25,30,0,250],ele:[30000,25,0,30,250]};
  function worley(){
    var v={};for(var k in W){v[k]=+document.getElementById(W[k]).value}
    $(&quot;#o-cogs&quot;).textContent=usd(v.cogs);$(&quot;#o-del&quot;).textContent=v.del;$(&quot;#o-man&quot;).textContent=v.man;$(&quot;#o-ele&quot;).textContent=v.ele;$(&quot;#o-li&quot;).textContent=v.li;
    var gm=v.cogs*0.05,rows=[[&quot;Gross margin (5%)&quot;,gm,&quot;var(--sal)&quot;],[&quot;Deliveries × $100&quot;,v.del*100,&quot;var(--mat)&quot;],[&quot;Manual × $62&quot;,v.man*62,&quot;var(--mat)&quot;],[&quot;Electronic × $16&quot;,v.ele*16,&quot;var(--mat)&quot;],[&quot;Line items × $1&quot;,v.li,&quot;var(--mat)&quot;]];
    var act=v.del*100+v.man*62+v.ele*16+v.li,cm=gm-act,max=Math.max(gm,act,1);
    rows.push([&quot;Total activity costs&quot;,act,&quot;var(--ocr)&quot;]);
    var h=&quot;&quot;;rows.forEach(function(r){h+=&#x27;&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;&#x27;+r[0]+&#x27;&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:&#x27;+(r[1]/max*100).toFixed(1)+&#x27;%;background:&#x27;+r[2]+&#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;&#x27;+usd(r[1])+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;});
    $(&quot;#w-bars&quot;).innerHTML=h;
    $(&quot;#w-verdict&quot;).innerHTML=&#x27;Revenue &#x27;+usd(v.cogs+gm)+&#x27; · Customer margin &lt;b style=&quot;color:&#x27;+(cm&gt;=0?&quot;var(--pos)&quot;:&quot;var(--neg)&quot;)+&#x27;&quot;&gt;&#x27;+usd(cm)+&#x27;&lt;/b&gt;&#x27;+(cm&gt;=0?&#x27; · the customer covers the costs it generates.&#x27;:&#x27; · the customer costs more than it earns.&#x27;);
  }
  for(var k in W)document.getElementById(W[k]).addEventListener(&quot;input&quot;,worley);
  $$(&quot;[data-preset]&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var p=presets[b.dataset.preset],ks=Object.keys(W);ks.forEach(function(k,j){document.getElementById(W[k]).value=p[j]});worley()})});
  worley();

  /* Hi-Tek: percentage shares */
  var pct=[[&quot;Direct materials&quot;,63.4,&quot;Trad. and ABC&quot;],[&quot;Direct labor&quot;,65.8,&quot;Trad. and ABC&quot;],[&quot;Manufacturing overhead&quot;,65.8,&quot;Traditional&quot;],[&quot;Advertising&quot;,33.3,&quot;ABC&quot;],[&quot;Machining (unit-level)&quot;,59.0,&quot;ABC&quot;],[&quot;Setups (batch-level)&quot;,20.0,&quot;ABC&quot;],[&quot;Product sustaining (product-level)&quot;,50.0,&quot;ABC&quot;]];
  $(&quot;#pctbars&quot;).innerHTML=pct.map(function(p){return &#x27;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;&#x27;+p[0]+&#x27;&lt;/b&gt; · &#x27;+p[2]+&#x27;&lt;/div&gt;&lt;div class=&quot;pct&quot;&gt;&lt;div style=&quot;width:&#x27;+p[1]+&#x27;%;background:var(--ocr)&quot;&gt;B300 &#x27;+p[1].toFixed(1)+&#x27;%&lt;/div&gt;&lt;div style=&quot;width:&#x27;+(100-p[1])+&#x27;%;background:var(--ard)&quot;&gt;T500 &#x27;+(100-p[1]).toFixed(1)+&#x27;%&lt;/div&gt;&lt;/div&gt;&#x27;}).join(&quot;&quot;);

  /* Hi-Tek: chart */
  var HD={m:{max:500000,min:-50000,data:[[363700,496200],[136300,-29200]],cap:&quot;Product margin: the traditional system shows both products as profitable; ABC shows B300 as far more profitable and T500 as loss-making (slides 14 and 16).&quot;},
          o:{max:400000,min:0,data:[[400000,217500],[208000,273500]],cap:&quot;Manufacturing overhead assigned: under ABC, B300 receives much less ($217,500) and T500 more ($273,500). ABC total $491,000 versus $608,000.&quot;}};
  function hchart(key){
    var d=HD[key],svg=$(&quot;#hchart&quot;);svg.innerHTML=&quot;&quot;;
    var top=20,bot=220,sc=(bot-top)/(d.max-d.min),y0=top+d.max*sc;
    svg.appendChild(el(&quot;line&quot;,{x1:60,x2:580,y1:y0,y2:y0,stroke:&quot;var(--ink2)&quot;}));
    for(var t=d.min;t&lt;=d.max;t+=(d.max-d.min)/(key===&quot;m&quot;?11:4)){var y=y0-t*sc;svg.appendChild(el(&quot;line&quot;,{x1:60,x2:580,y1:y,y2:y,stroke:&quot;var(--rule)&quot;,&quot;stroke-dasharray&quot;:&quot;2 4&quot;}));svg.appendChild(el(&quot;text&quot;,{x:54,y:y+4,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:10,fill:&quot;var(--ink2)&quot;},Math.round(t/1000)+&quot;k&quot;))}
    [&quot;B300&quot;,&quot;T500&quot;].forEach(function(name,i){
      var cx=180+i*260;
      d.data[i].forEach(function(v,j){
        var x=cx-70+j*75,h=Math.abs(v)*sc,y=v&gt;=0?y0-h:y0;
        svg.appendChild(el(&quot;rect&quot;,{x:x,y:y,width:64,height:Math.max(h,1),rx:3,fill:j?(v&lt;0?&quot;var(--neg)&quot;:&quot;var(--ocr)&quot;):&quot;var(--rule)&quot;}));
        svg.appendChild(el(&quot;text&quot;,{x:x+32,y:v&gt;=0?y-5:y+h+13,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,&quot;font-weight&quot;:600},usd(v)));
      });
      svg.appendChild(el(&quot;text&quot;,{x:cx,y:250,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:13,&quot;font-weight&quot;:700},name));
    });
    $(&quot;#hcap&quot;).textContent=d.cap;
    $$(&quot;[data-hchart]&quot;).forEach(function(b){b.classList.toggle(&quot;on&quot;,b.dataset.hchart===key)});
  }
  $$(&quot;[data-hchart]&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){hchart(b.dataset.hchart)})});
  hchart(&quot;m&quot;);

  /* Fogerty: unit cost curve */
  var fs=$(&quot;#fchart&quot;),X0=60,X1=580,Y0=220,Y1=20,qmin=2000,qmax=20000,cmax=160;
  function fx(q){return X0+(q-qmin)/(qmax-qmin)*(X1-X0)}function fy(c){return Y0-c/cmax*(Y0-Y1)}
  function fogerty(){
    var q=+$(&quot;#f-q&quot;).value,c=44+218000/q;fs.innerHTML=&quot;&quot;;
    for(var c2=0;c2&lt;=cmax;c2+=40){fs.appendChild(el(&quot;line&quot;,{x1:X0,x2:X1,y1:fy(c2),y2:fy(c2),stroke:&quot;var(--rule)&quot;,&quot;stroke-dasharray&quot;:c2?&quot;2 4&quot;:&quot;&quot;}));fs.appendChild(el(&quot;text&quot;,{x:X0-6,y:fy(c2)+4,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:10,fill:&quot;var(--ink2)&quot;},&quot;$&quot;+c2))}
    for(var q2=qmin;q2&lt;=qmax;q2+=4500)fs.appendChild(el(&quot;text&quot;,{x:fx(q2),y:Y0+16,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:10,fill:&quot;var(--ink2)&quot;},q2.toLocaleString(&quot;en-US&quot;)));
    fs.appendChild(el(&quot;rect&quot;,{x:X0,y:fy(44),width:X1-X0,height:Y0-fy(44),fill:&quot;var(--ard-bg)&quot;}));
    fs.appendChild(el(&quot;text&quot;,{x:X1-6,y:fy(44)+16,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:11,fill:&quot;var(--ard)&quot;},&quot;DM + DL = $44 per unit&quot;));
    var d=&quot;&quot;;for(var qq=qmin;qq&lt;=qmax;qq+=250){d+=(d?&quot;L&quot;:&quot;M&quot;)+fx(qq).toFixed(1)+&quot;,&quot;+fy(Math.min(44+218000/qq,cmax)).toFixed(1)}
    fs.appendChild(el(&quot;path&quot;,{d:d,fill:&quot;none&quot;,stroke:&quot;var(--ard)&quot;,&quot;stroke-width&quot;:2.5}));
    fs.appendChild(el(&quot;line&quot;,{x1:fx(10000),x2:fx(10000),y1:Y1,y2:Y0,stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;3 3&quot;}));
    fs.appendChild(el(&quot;text&quot;,{x:fx(10000)+4,y:Y1+10,&quot;font-size&quot;:10,fill:&quot;var(--ink2)&quot;},&quot;volume in the slides&quot;));
    fs.appendChild(el(&quot;circle&quot;,{cx:fx(q),cy:fy(Math.min(c,cmax)),r:6,fill:&quot;var(--acc)&quot;}));
    fs.appendChild(el(&quot;text&quot;,{x:X0+(X1-X0)/2,y:Y0+34,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,fill:&quot;var(--ink2)&quot;},&quot;Hubs units&quot;));
    $(&quot;#o-q&quot;).textContent=q.toLocaleString(&quot;en-US&quot;);
    $(&quot;#f-out&quot;).innerHTML=&quot;Overhead per unit &quot;+&quot;$&quot;+(218000/q).toFixed(2)+&quot; · Unit cost &lt;b&gt;$&quot;+c.toFixed(2)+&quot;&lt;/b&gt;&quot;+(q===10000?&quot; (slide solution)&quot;:&quot;&quot;);
  }
  $(&quot;#f-q&quot;).addEventListener(&quot;input&quot;,fogerty);fogerty();
})();
&lt;/script&gt;
