*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.62}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0 0 .5em}
h2{font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:-.01em}

p{margin:.6em 0}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.term{font-style:italic;font-weight:600}
.small{font-size:.88rem;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
/* nav */
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in oklch,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}

nav.top a{flex:none;text-decoration:none;color:var(--ink2);font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid transparent}
nav.top a:hover{border-color:var(--rule);color:var(--ink)}
/* hero */
header.hero{padding:56px 0 24px}
.kicker{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
header.hero h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:300;letter-spacing:-.02em;margin:.15em 0 .2em}
header.hero h1 em{font-style:italic;color:var(--acc)}
.lede{font-family:var(--serif);font-size:1.3rem;line-height:1.45;max-width:46ch;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:.88rem;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:600}
.map{margin:28px 0 8px;border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:10px}
.map svg{width:100%;height:auto;display:block}
.map a{cursor:pointer}
.map a:hover rect,.map a:focus rect{stroke-width:2.5}
.map text{font-family:var(--sans)}
/* sections */
section.part{padding:56px 0 30px;border-top:1px solid var(--rule)}
.part-head{display:flex;gap:16px;align-items:baseline;margin-bottom:10px}
.part-n{font-family:var(--serif);font-size:3.2rem;font-weight:200;line-height:1;color:var(--c)}
.part-tag{display:inline-block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--c);background:var(--cb);padding:2px 10px;border-radius:99px}
.c-acc{--c:var(--acc);--cb:var(--acc-bg)}.c-sal{--c:var(--sal);--cb:var(--sal-bg)}.c-ocr{--c:var(--ocr);--cb:var(--ocr-bg)}.c-ard{--c:var(--ard);--cb:var(--ard-bg)}.c-mat{--c:var(--mat);--cb:var(--mat-bg)}
.src{font-size:.8rem;color:var(--ink2);border-left:3px solid var(--c,var(--acc));padding-left:10px;margin:8px 0 18px}
/* boxes */
.def{background:var(--cb,var(--acc-bg));border-radius:12px;padding:14px 18px;margin:16px 0}
.def b:first-child{font-family:var(--serif);font-size:1.1rem}

.formula .frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em}
.note{border:1px dashed var(--rule);border-radius:12px;padding:10px 16px;margin:16px 0;font-size:.94rem}
.note::before{content:&quot;Nota · &quot;;font-weight:600;color:var(--c,var(--acc))}
.mine{border-left:4px solid var(--ard);background:var(--ard-bg);border-radius:0 12px 12px 0;padding:10px 16px;margin:16px 0;font-size:.95rem}
.mine::before{content:&quot;Spiegazione aggiuntiva (non nelle slide) · &quot;;font-weight:600;color:var(--ard)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}

.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:600;border-bottom:2px solid var(--c,var(--ink));font-size:.85rem}

td.neg{color:var(--neg)}td.pos{color:var(--pos)}

details.card{border:1px solid var(--rule);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden}
details.card&gt;summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}

details.card[open]&gt;summary::after{content:&quot;–&quot;}

.tabs{margin:18px 0}
.tablist{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--rule)}
.tablist button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:7px 14px;color:var(--ink2);cursor:pointer;margin-bottom:-1px}
.tablist button[aria-selected=true]{background:var(--card);border-color:var(--rule);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--c,var(--acc))}

.stepbar button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;flex:1}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--c,var(--acc))}
.btn.on{background:var(--c,var(--acc));color:var(--paper);border-color:transparent}

.quiz details{border-top:1px solid color-mix(in oklch,var(--c) 30%,transparent);padding:10px 0}
.quiz summary{cursor:pointer;font-weight:500}
.quiz summary::marker{color:var(--c)}
.quiz .ans{margin-top:8px;padding:10px 14px;background:var(--card);border-radius:10px;font-size:.95rem}

.ctrl{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 70px;gap:8px 12px;align-items:center;font-size:.9rem;margin:6px 0}
.ctrl output{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--c,var(--acc))}
.lab{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:16px 18px;margin:18px 0}
.lab h4{margin-top:0}
.bars{margin-top:12px}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:.86rem;margin:5px 0}
.bar .track{height:16px;background:var(--paper);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .25s}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.verdict{margin-top:12px;font-family:var(--serif);font-size:1.2rem}
.pct{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:.75rem;font-weight:600;margin:3px 0 10px}
.pct div{display:flex;align-items:center;justify-content:center;color:var(--paper);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* refs */
.ref{border:1px solid var(--rule);border-radius:14px;background:var(--card);padding:14px 18px;margin:14px 0}
.ref .ext{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mat);border:1px solid var(--mat);border-radius:99px;padding:1px 8px;margin-bottom:6px}
.ref h4{margin:.2em 0 .3em}
footer{border-top:1px solid var(--rule);padding:30px 0 50px;margin-top:40px;font-size:.9rem;color:var(--ink2);text-align:center}

  .bar{grid-template-columns:96px 1fr 72px;font-size:.78rem}
  th,td{padding:6px 6px}
  .part-n{font-size:2.4rem}
}

&lt;main&gt;
&lt;!-- §1 --&gt;
&lt;section class=&quot;part c-acc&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Fondamenti&lt;/span&gt;&lt;h2&gt;Che cos&#x27;è l&#x27;Activity-Based Costing&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Le slide della tutorial session sono solo esercizi: definizioni e teoria di questa sezione sono ricavate dalle soluzioni (slide 5–27) e completate con spiegazioni aggiuntive, segnate come tali.&lt;/p&gt;

  &lt;p&gt;Un&#x27;azienda sostiene &lt;span class=&quot;term&quot;&gt;direct costs&lt;/span&gt; (costi diretti: attribuibili senza ambiguità a un prodotto, come &lt;span class=&quot;term&quot;&gt;direct materials&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;direct labor&lt;/span&gt;, materiali e manodopera diretta) e &lt;span class=&quot;term&quot;&gt;overhead&lt;/span&gt; (costi indiretti, o costi generali: macchinari, setup, consegne, amministrazione…), che vanno invece &lt;em&gt;distribuiti&lt;/em&gt; con un criterio. Da quel criterio dipende quanto sembra costare un prodotto o un cliente, quindi quanto sembra rendere.&lt;/p&gt;

  &lt;h3 id=&quot;tradizionale&quot;&gt;Il sistema tradizionale: un solo tasso per tutta la fabbrica&lt;/h3&gt;
  &lt;p&gt;Nel &lt;span class=&quot;term&quot;&gt;traditional costing system&lt;/span&gt; (sistema di calcolo dei costi tradizionale) tutto il manufacturing overhead si raccoglie in un unico calderone e si ripartisce con un&#x27;unica base, di solito legata ai volumi (ore o dollari di manodopera diretta). È il &lt;span class=&quot;term&quot;&gt;plantwide overhead rate&lt;/span&gt; (tasso di ripartizione unico per tutto lo stabilimento) usato da Hi-Tek (slide 14):&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Predetermined overhead rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Estimated total manufacturing overhead&lt;/span&gt;&lt;span&gt;Estimated total direct labor dollars&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Il tasso è &lt;span class=&quot;term&quot;&gt;predetermined&lt;/span&gt; (predeterminato): si calcola a inizio periodo su dati stimati, poi si applica alla base effettiva di ciascun prodotto. Il difetto: se un costo &lt;em&gt;non&lt;/em&gt; dipende dai volumi (per esempio i setup, cioè le preparazioni delle macchine), la base a volume lo carica soprattutto sui prodotti venduti in grandi quantità, anche se quei costi li generano i prodotti piccoli e complessi.&lt;/p&gt;

  &lt;h3 id=&quot;abc&quot;&gt;L&#x27;idea dell&#x27;ABC&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Activity-Based Costing (ABC)&lt;/b&gt; — metodo che distribuisce l&#x27;overhead in due passaggi: prima dai costi alle &lt;em&gt;attività&lt;/em&gt; (consegne, setup, lavorazioni…), poi dalle attività ai &lt;span class=&quot;term&quot;&gt;cost objects&lt;/span&gt; (oggetti di costo: prodotti, clienti) in proporzione a quanto ciascuno &lt;em&gt;consuma&lt;/em&gt; di ogni attività.&lt;/div&gt;

  &lt;h3 id=&quot;pool&quot;&gt;I mattoni: pool, measure, rate&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Activity cost pool&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Activity measure&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Activity rate&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Assegnazione&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Activity cost pool&lt;/b&gt; (centro di raccolta dei costi di un&#x27;attività): il “secchio” in cui si sommano tutti i costi di un&#x27;attività. Esempio Worley (slide 3): &lt;i&gt;Customer deliveries&lt;/i&gt; raccoglie $500,000 di spese di vendita e amministrative legate alle consegne.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Activity measure&lt;/b&gt; (misura dell&#x27;attività, spesso chiamata &lt;span class=&quot;term&quot;&gt;cost driver&lt;/span&gt;, il fattore che genera il costo): l&#x27;unità con cui si conta quanto di quell&#x27;attività viene usata. Per le consegne Worley è il &lt;i&gt;numero di consegne&lt;/i&gt;; per il machining di Hi-Tek le &lt;i&gt;machine-hours&lt;/i&gt; (ore macchina, MH); per i setup le &lt;i&gt;setup hours&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;Una buona misura deve avere un legame causa-effetto con il costo: più consegne, più costi di consegna.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p id=&quot;rate&quot;&gt;&lt;b&gt;Activity rate&lt;/b&gt; (tasso di attività): quanto costa &lt;em&gt;una&lt;/em&gt; unità di attività.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Activity rate = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;(a) Estimated overhead cost del pool&lt;/span&gt;&lt;span&gt;(b) Expected (total) activity&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Worley: $500,000 ÷ 5,000 consegne = &lt;b&gt;$100 per delivery&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Assegnazione al cost object&lt;/b&gt;: si moltiplica il tasso per l&#x27;attività consumata da quel prodotto o cliente.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ABC cost = (a) Activity rate × (b) Activity del cost object&lt;/div&gt;&lt;p&gt;University consuma 10 consegne → 10 × $100 = &lt;b&gt;$1,000&lt;/b&gt;. Si somma su tutti i pool per ottenere i &lt;span class=&quot;term&quot;&gt;total activity costs&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Molti manuali descrivono l&#x27;implementazione dell&#x27;ABC in cinque passi: ① definire attività, cost pool e activity measure; ② assegnare l&#x27;overhead ai pool; ③ calcolare gli activity rate; ④ assegnare i costi ai cost object; ⑤ preparare i report per il management. Gli esercizi della tutorial partono già dal passo ③: pool e costi sono dati nel testo.&lt;/div&gt;

  &lt;h3 id=&quot;gerarchia&quot;&gt;La cost hierarchy: a che livello nasce un costo?&lt;/h3&gt;

  &lt;/div&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Unit-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si svolge per &lt;em&gt;ogni unità&lt;/em&gt;: raddoppiano le unità, raddoppia l&#x27;attività. Le machine-hours di Hi-Tek sono unit-level (slide 19), e lo è anche la base del sistema tradizionale (direct labour dollars). Per questo le percentuali coincidono quasi: 59%/41% nell&#x27;ABC contro 65.8%/34.2% nel tradizionale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Batch-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si svolge per ogni &lt;em&gt;lotto&lt;/em&gt; (batch), indipendentemente da quante unità contiene. Il setup di una macchina costa uguale per 10 o per 10,000 pezzi. Le slide 20 mostrano che T500, pur con poche unità, consuma l&#x27;80% dei setup: è qui che il tradizionale sbaglia di più.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Product-level (product-sustaining) activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Serve a &lt;em&gt;mantenere in vita&lt;/em&gt; una linea di prodotto (progettazione, gestione delle distinte, product manager…), a prescindere da quante unità o lotti si fanno. Hi-Tek: $60,000 per prodotto, 50% a ciascuno (slide 21).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Customer-level activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Legata al servizio di un &lt;em&gt;cliente&lt;/em&gt; specifico: consegne, elaborazione degli ordini, assistenza. È il cuore dell&#x27;esercizio Worley, dove l&#x27;oggetto di costo è il cliente, non il prodotto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Organization-sustaining activity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Mantiene l&#x27;azienda nel suo insieme (direzione generale, sede, contabilità generale…): si sosterrebbe anche senza quel prodotto o quel cliente. Regola delle slide (16 e 25): &lt;b&gt;organization-sustaining e idle capacity costs non si allocano ai prodotti&lt;/b&gt;. L&#x27;&lt;span class=&quot;term&quot;&gt;idle capacity&lt;/span&gt; (capacità inutilizzata) è il costo di risorse disponibili ma non usate: caricarla sui prodotti ne gonfierebbe il costo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Fondamenti&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché un plantwide rate basato sulla manodopera diretta distorce il costo dei prodotti a basso volume?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché ripartisce tutto l&#x27;overhead in proporzione a una misura a volume. I costi batch-level e product-level, che i prodotti piccoli e complessi consumano in misura sproporzionata, finiscono soprattutto sui prodotti ad alto volume: quelli a basso volume risultano &lt;b&gt;sottocostati&lt;/b&gt;, quelli ad alto volume &lt;b&gt;sovracostati&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Calcola l&#x27;activity rate di un pool da $157,500 con 375 setup hours.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$157,500 ÷ 375 = &lt;b&gt;$420 per setup hour&lt;/b&gt; (Hi-Tek, slide 15).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un setup macchina è unit-, batch- o product-level?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Batch-level&lt;/b&gt;: si fa una volta per lotto, qualunque sia il numero di unità del lotto.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali costi l&#x27;ABC lascia fuori dal costo di prodotto, secondo le slide?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Gli &lt;b&gt;organization-sustaining costs&lt;/b&gt; e gli &lt;b&gt;idle capacity costs&lt;/b&gt;: non sono causati da un prodotto specifico.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §2 --&gt;
&lt;section class=&quot;part c-sal&quot; id=&quot;worley&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Esercizio 1&lt;/span&gt;&lt;h2&gt;Worley Company: quanto rende ogni cliente?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 2–9.&lt;/p&gt;

  &lt;p&gt;Worley compra forniture chirurgiche dai produttori e le rivende con consegna a centinaia di ospedali. Il prezzo è il costo d&#x27;acquisto più un &lt;span class=&quot;term&quot;&gt;markup&lt;/span&gt; (ricarico) del 5%: merce pagata $100 si rivende a $105. Per anni Worley ha pensato che il 5% bastasse a coprire le spese di vendita e amministrative e a lasciare un utile ragionevole. Con i profitti in calo, introduce l&#x27;ABC per capire la &lt;span class=&quot;term&quot;&gt;customer profitability&lt;/span&gt; (redditività per cliente).&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool (measure)&lt;/th&gt;&lt;th&gt;Total cost&lt;/th&gt;&lt;th&gt;Total activity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Customer deliveries (n. consegne)&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual order processing (ordini manuali)&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic order processing (ordini elettronici)&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line item picking (righe prelevate)&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other organization-sustaining (nessuna)&lt;/td&gt;&lt;td&gt;602,000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale selling &amp;amp; admin&lt;/td&gt;&lt;td&gt;$2,000,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity measure&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Line items picked&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Entrambi gli ospedali hanno acquistato merce che a Worley è costata $30,000. Una &lt;span class=&quot;term&quot;&gt;line item&lt;/span&gt; è una riga d&#x27;ordine, cioè un articolo diverso da prelevare a magazzino (&lt;span class=&quot;term&quot;&gt;picking&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Soluzione passo per passo&lt;/h3&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q1 · Total revenue&lt;/h4&gt;
      &lt;p&gt;Ricavo = cost of goods sold (a) + markup in dollari (b), con b = 5% × a.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold (a)&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;td&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Markup 5% (b)&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Revenue (a)+(b)&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Identici: con il sistema di prezzo di Worley, i due clienti sembrano uguali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2 · Activity rates&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;(a) Cost&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;(a)÷(b) Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Customer deliveries&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;$100 per delivery&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Manual order processing&lt;/td&gt;&lt;td&gt;248,000&lt;/td&gt;&lt;td&gt;4,000&lt;/td&gt;&lt;td&gt;$62 per manual order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Electronic order processing&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;12,500&lt;/td&gt;&lt;td&gt;$16 per electronic order&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Line item picking&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;450,000&lt;/td&gt;&lt;td&gt;$1 per line item&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;I $602,000 organization-sustaining non hanno tasso: non si assegnano ai clienti. Un ordine manuale costa quasi &lt;b&gt;4 volte&lt;/b&gt; uno elettronico ($62 contro $16).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q3 · Total activity costs per cliente&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;ABC cost&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;th&gt;ABC cost&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Deliveries&lt;/td&gt;&lt;td&gt;$100&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;$1,000&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;td&gt;$2,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Manual orders&lt;/td&gt;&lt;td&gt;$62&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;1,860&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Electronic orders&lt;/td&gt;&lt;td&gt;$16&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;240&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Line items&lt;/td&gt;&lt;td&gt;$1&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$1,360&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$4,610&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q4 · Customer margin&lt;/h4&gt;
      &lt;p&gt;Attenzione all&#x27;hint: si parte dalle vendite e si toglie &lt;em&gt;anche&lt;/em&gt; il costo del venduto.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;University&lt;/th&gt;&lt;th&gt;Memorial&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;td&gt;$31,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;td&gt;30,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;td&gt;1,500&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Total activity costs&lt;/td&gt;&lt;td&gt;1,360&lt;/td&gt;&lt;td&gt;4,610&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Customer margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$140&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(3,110)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;A parità di fatturato, &lt;b&gt;University&lt;/b&gt; è appena profittevole, mentre &lt;b&gt;Memorial&lt;/b&gt; fa perdere $3,110: tante consegne piccole, ordini manuali, più righe da prelevare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button type=&quot;button&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Customer margin&lt;/b&gt; — margine del cliente: sales − cost of goods sold − costi delle attività consumate dal cliente. Non è l&#x27;utile netto: i costi organization-sustaining restano fuori e vanno coperti dai margini di tutti i clienti insieme.&lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Laboratorio · costruisci un cliente&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Muovi i cursori: gli activity rate restano quelli delle slide ($100, $62, $16, $1) e il ricarico resta al 5%. I valori iniziali sono quelli di Memorial.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-cogs&quot;&gt;Merce acquistata (COGS)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-cogs&quot; min=&quot;5000&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;30000&quot;&gt;&lt;output id=&quot;o-cogs&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-del&quot;&gt;Deliveries&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-del&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;o-del&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-man&quot;&gt;Manual orders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-man&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;o-man&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-ele&quot;&gt;Electronic orders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-ele&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;o-ele&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-li&quot;&gt;Line items picked&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-li&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;&lt;output id=&quot;o-li&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin:8px 0&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;uni&quot;&gt;Carica University&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;mem&quot;&gt;Carica Memorial&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;ele&quot;&gt;Memorial con ordini elettronici&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;bars&quot; id=&quot;w-bars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;w-verdict&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Cosa può fare Worley con questa informazione? Un ricarico uguale per tutti fa sì che i clienti “economici” sussidino quelli costosi. Le leve tipiche sono spingere gli ordini elettronici, raggruppare le consegne, fissare un ordine minimo o far pagare a parte i servizi costosi (consegne extra, ordini manuali). Prova il preset “Memorial con ordini elettronici”: 30 ordini manuali a $62 diventano 30 ordini elettronici a $16, e la perdita scende di $1,380.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Worley&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il ricavo dei due ospedali è identico ma il margine no?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Il prezzo dipende solo dal costo della merce (ricarico 5%), mentre i costi di servizio dipendono dal &lt;b&gt;comportamento&lt;/b&gt; del cliente: numero di consegne, tipo di ordine, righe prelevate.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto costa a Worley ogni consegna aggiuntiva a Memorial? E ogni ordine manuale in più?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$100 per consegna, $62 per ordine manuale (gli activity rate della Q2).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché i $602,000 di “Other organization-sustaining costs” non entrano nel customer margin?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Non hanno un&#x27;activity measure e non sono causati da un cliente specifico: esisterebbero anche perdendo University o Memorial. Assegnarli con un criterio arbitrario distorcerebbe il margine.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quante consegne in meno servirebbero a Memorial per arrivare a un customer margin pari a zero, a parità del resto?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;La perdita è $3,110 e ogni consegna vale $100: servono &lt;b&gt;32 consegne in meno&lt;/b&gt;, ma Memorial ne fa solo 25. Le consegne da sole non bastano: bisogna agire anche sugli ordini manuali.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §3 --&gt;
&lt;section class=&quot;part c-ocr&quot; id=&quot;hitek&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Esercizio 2&lt;/span&gt;&lt;h2&gt;Hi-Tek Manufacturing: tradizionale contro ABC&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 10–21.&lt;/p&gt;

  &lt;p&gt;Hi-Tek produce due componenti industriali: &lt;b&gt;B300&lt;/b&gt; (alto volume: 70,000 unità a $20) e &lt;b&gt;T500&lt;/b&gt; (basso volume: 17,500 unità a $40). Il conto economico in &lt;span class=&quot;term&quot;&gt;absorption costing&lt;/span&gt; (costo pieno: tutto l&#x27;overhead di produzione entra nel costo del prodotto) chiude in perdita:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td&gt;500,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Selling &amp;amp; administrative expenses&lt;/td&gt;&lt;td&gt;550,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating loss&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(50,000)&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$436,300&lt;/td&gt;&lt;td&gt;$251,700&lt;/td&gt;&lt;td&gt;$688,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Manufacturing overhead&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;COGS&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$1,600,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il team ABC stabilisce che $50,000 (B300) e $100,000 (T500) di spese pubblicitarie sono &lt;span class=&quot;term&quot;&gt;directly traceable&lt;/span&gt; (attribuibili direttamente) ai prodotti; il resto delle spese di vendita e amministrative è organization-sustaining. L&#x27;overhead di produzione è diviso in quattro pool:&lt;/p&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Activity cost pool (measure)&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Machining (machine-hours)&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;90,000&lt;/td&gt;&lt;td&gt;62,500&lt;/td&gt;&lt;td&gt;152,500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Setups (setup hours)&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;75&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;375&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Product-sustaining (n. prodotti)&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Other (organization-sustaining)&lt;/td&gt;&lt;td&gt;117,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total manufacturing overhead&lt;/td&gt;&lt;td&gt;$608,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Q1 · Tradizionale&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q2 · ABC&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Q3 · Confronto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Sales: B300 = 70,000 × $20 = &lt;b&gt;$1,400,000&lt;/b&gt;; T500 = 17,500 × $40 = &lt;b&gt;$700,000&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;POHR = $608,000 ÷ $304,000 = &lt;b&gt;$2.00 per direct labor dollar&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;Total manufacturing cost = DM + DL + overhead applicato; Product margin = Sales − Total manufacturing cost.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Overhead @ $2.00 per DL$&lt;/td&gt;&lt;td&gt;400,000&lt;/td&gt;&lt;td&gt;208,000&lt;/td&gt;&lt;td&gt;608,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Total manufacturing cost&lt;/td&gt;&lt;td&gt;1,036,300&lt;/td&gt;&lt;td&gt;563,700&lt;/td&gt;&lt;td&gt;1,600,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$363,700&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$136,300&lt;/td&gt;&lt;td&gt;$500,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Slide 14: nel sistema tradizionale &lt;b&gt;tutto&lt;/b&gt; il manufacturing overhead va ai prodotti, e nessuna spesa di vendita (nemmeno la pubblicità) viene attribuita.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Primo passo, gli activity rate (slide 15):&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;(a) Cost&lt;/th&gt;&lt;th&gt;(b) Activity&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;$213,500&lt;/td&gt;&lt;td&gt;152,500 MH&lt;/td&gt;&lt;td&gt;$1.40 per MH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;td&gt;375 setup hours&lt;/td&gt;&lt;td&gt;$420 per setup hour&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product sustaining&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;td&gt;2 products&lt;/td&gt;&lt;td&gt;$60,000 per product&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;Poi l&#x27;assegnazione (slide 16). Per esempio machining B300 = 90,000 × $1.40 = $126,000; setups T500 = 300 × $420 = $126,000.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;B300&lt;/th&gt;&lt;th&gt;T500&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;$1,400,000&lt;/td&gt;&lt;td&gt;$700,000&lt;/td&gt;&lt;td&gt;$2,100,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;436,300&lt;/td&gt;&lt;td&gt;251,700&lt;/td&gt;&lt;td&gt;688,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;104,000&lt;/td&gt;&lt;td&gt;304,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Advertising expense&lt;/td&gt;&lt;td&gt;50,000&lt;/td&gt;&lt;td&gt;100,000&lt;/td&gt;&lt;td&gt;150,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Machining&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;87,500&lt;/td&gt;&lt;td&gt;213,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Setups&lt;/td&gt;&lt;td&gt;31,500&lt;/td&gt;&lt;td&gt;126,000&lt;/td&gt;&lt;td&gt;157,500&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Product sustaining&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;60,000&lt;/td&gt;&lt;td&gt;120,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Total cost&lt;/td&gt;&lt;td&gt;903,800&lt;/td&gt;&lt;td&gt;729,200&lt;/td&gt;&lt;td&gt;1,633,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Product margin&lt;/td&gt;&lt;td class=&quot;pos&quot;&gt;$496,200&lt;/td&gt;&lt;td class=&quot;neg&quot;&gt;$(29,200)&lt;/td&gt;&lt;td&gt;$467,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Il giudizio si capovolge:&lt;/b&gt; T500, che sembrava rendere $136,300, in realtà perde $29,200.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Perché le due assegnazioni differiscono (slide 17–21)? Prima di tutto cambia il &lt;em&gt;perimetro&lt;/em&gt;: il tradizionale assegna tutti i $608,000 di overhead, l&#x27;ABC solo $491,000, perché lascia fuori i $117,000 organization-sustaining. In più l&#x27;ABC aggiunge la pubblicità ($150,000), che il tradizionale ignora. Poi cambiano le &lt;em&gt;quote&lt;/em&gt;:&lt;/p&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ocr)&quot;&gt;&lt;/i&gt;B300&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ard)&quot;&gt;&lt;/i&gt;T500&lt;/span&gt;&lt;/div&gt;
      &lt;div id=&quot;pctbars&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Nella tabella della slide 18 il totale dei direct materials per T500 è scritto “$688,800”: è un refuso, il totale corretto è $688,000. Le slide 20–21 arrotondano 65.8%/34.2% a 66%/34%.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;figure&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-hchart=&quot;m&quot;&gt;Product margin&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-hchart=&quot;o&quot;&gt;Overhead assegnato&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Grafico a barre tradizionale contro ABC per B300 e T500&quot; id=&quot;hchart&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--rule)&quot;&gt;&lt;/i&gt;Tradizionale&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ocr)&quot;&gt;&lt;/i&gt;ABC&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cap&quot; id=&quot;hcap&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le tre ragioni, in breve&lt;/h3&gt;
  &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Machining: stessa logica, risultati simili&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le machine-hours sono una misura &lt;b&gt;unit-level&lt;/b&gt;, come i direct labour dollars del tradizionale. Per questo le quote sono vicine: 59.0%/41.0% contro 65.8%/34.2% (slide 19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Setups: qui il tradizionale si sbaglia di più&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il setup è un&#x27;attività &lt;b&gt;batch-level&lt;/b&gt;. B300 è il prodotto ad alto volume (70,000 unità) ma consuma solo il 20% dei setup; T500 (17,500 unità) ne consuma l&#x27;80%. Il tradizionale, basandosi sulla manodopera, fa l&#x27;opposto: carica il 66% su B300 (slide 20).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Product sustaining e pubblicità&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I costi &lt;b&gt;product-level&lt;/b&gt; si dividono 50/50 perché ogni linea richiede lo stesso supporto, indipendentemente dai volumi (slide 21). La pubblicità è tracciata direttamente: $50,000 a B300 e $100,000 a T500, mentre il tradizionale non la attribuisce affatto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;mine&quot;&gt;I totali si riconciliano: $500,000 (margine tradizionale) − $150,000 (pubblicità ora attribuita) + $117,000 (overhead organization-sustaining non più attribuito) = $467,000 (margine ABC). Poi $467,000 − $117,000 − ($550,000 − $150,000) di spese organization-sustaining = $(50,000), la stessa perdita del conto economico. L&#x27;ABC non cambia l&#x27;utile totale dell&#x27;azienda: cambia la sua &lt;em&gt;distribuzione&lt;/em&gt; fra i prodotti.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Hi-Tek&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quanto overhead di produzione assegna ai prodotti il sistema ABC, e perché non tutto?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;$491,000 = $608,000 − $117,000. I $117,000 “Other” sono organization-sustaining e non si allocano ai prodotti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Calcola il costo di setup assegnato a B300.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;75 setup hours × $420 = &lt;b&gt;$31,500&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché T500 passa da un margine di +$136,300 a −$29,200?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Con l&#x27;ABC riceve più setup ($126,000), più pubblicità ($100,000) e la sua quota di product-sustaining. Nel complesso i costi indiretti assegnati salgono da $208,000 a $273,500 di overhead, più $100,000 di pubblicità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se Hi-Tek eliminasse T500, l&#x27;utile salirebbe di $29,200?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Non necessariamente: l&#x27;ABC indica dove guardare, non decide da solo. Bisogna verificare quali costi sparirebbero davvero (per esempio se le setup hours liberate si traducono in risparmi o in &lt;span class=&quot;term&quot;&gt;idle capacity&lt;/span&gt;). È un&#x27;analisi di costi rilevanti, ma il segnale va preso sul serio: un prezzo più alto o lotti più grandi per T500 sono le prime leve.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §4 --&gt;
&lt;section class=&quot;part c-ard&quot; id=&quot;fogerty&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Esercizio 3&lt;/span&gt;&lt;h2&gt;Fogerty Company: unit product cost con l&#x27;ABC&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 22–27.&lt;/p&gt;

  &lt;p&gt;Fogerty produce &lt;b&gt;Hubs&lt;/b&gt; (mozzi in titanio) e &lt;b&gt;Sprockets&lt;/b&gt; (ruote dentate). Gli Hubs richiedono attrezzature speciali e sono più complessi da produrre.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor-hours per unit&lt;/td&gt;&lt;td&gt;0.80&lt;/td&gt;&lt;td&gt;0.40&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Annual production&lt;/td&gt;&lt;td&gt;10,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct materials per unit&lt;/td&gt;&lt;td&gt;$32&lt;/td&gt;&lt;td&gt;$18&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Direct labor wage rate&lt;/td&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;$15 per hour&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool (measure)&lt;/th&gt;&lt;th&gt;Overhead&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;th&gt;Total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Machine setups (n. setups)&lt;/td&gt;&lt;td&gt;$72,000&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Special processing (MH)&lt;/td&gt;&lt;td&gt;$200,000&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;5,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;General factory (org.-sustaining)&lt;/td&gt;&lt;td&gt;$816,000&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;td&gt;NA&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Q1 · Activity rates&lt;/h4&gt;
      &lt;p&gt;Machine setups: $72,000 ÷ 400 = &lt;b&gt;$180 per setup&lt;/b&gt;. Special processing: $200,000 ÷ 5,000 = &lt;b&gt;$40 per MH&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;Nessun tasso per General factory: è organization-sustaining e non va allocato ai prodotti (slide 25).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2a · Overhead ABC totale per prodotto&lt;/h4&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pool&lt;/th&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Machine setups&lt;/td&gt;&lt;td&gt;$180&lt;/td&gt;&lt;td&gt;100 → $18,000&lt;/td&gt;&lt;td&gt;300 → $54,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Special processing&lt;/td&gt;&lt;td&gt;$40&lt;/td&gt;&lt;td&gt;5,000 → $200,000&lt;/td&gt;&lt;td&gt;0 → $0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;$218,000&lt;/td&gt;&lt;td&gt;$54,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Q2b · Unit product cost&lt;/h4&gt;
      &lt;p&gt;Il costo unitario somma i costi diretti per unità e l&#x27;overhead ABC diviso per le unità prodotte.&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Hubs&lt;/th&gt;&lt;th&gt;Sprockets&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Direct materials&lt;/td&gt;&lt;td&gt;$32.00&lt;/td&gt;&lt;td&gt;$18.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Direct labor ($15 × 0.80 / 0.40 DLH)&lt;/td&gt;&lt;td&gt;12.00&lt;/td&gt;&lt;td&gt;6.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Overhead ($218,000 ÷ 10,000 / $54,000 ÷ 40,000)&lt;/td&gt;&lt;td&gt;21.80&lt;/td&gt;&lt;td&gt;1.35&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Unit cost&lt;/td&gt;&lt;td&gt;$65.80&lt;/td&gt;&lt;td&gt;$25.35&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button type=&quot;button&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Grafico con cursore · volume e costo unitario degli Hubs&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;I costi di setup e di special processing degli Hubs ($218,000) non sono unit-level: se lo stesso numero di setup e di ore macchina servisse a più unità, il costo per unità scenderebbe. Ipotesi didattica: attività fissa, volume variabile.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;f-q&quot;&gt;Unità di Hubs prodotte&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;f-q&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output id=&quot;o-q&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;figure&quot; style=&quot;margin:10px 0 0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 260&quot; id=&quot;fchart&quot; role=&quot;img&quot; aria-label=&quot;Curva del costo unitario degli Hubs al variare del volume&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;f-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Le slide non chiedono il confronto con il sistema tradizionale, ma è utile farlo. Se gli stessi $272,000 di overhead ($72,000 + $200,000) si ripartissero sulle direct labor-hours (10,000 × 0.8 + 40,000 × 0.4 = 24,000 DLH → $11.33 per DLH), gli Hubs riceverebbero $9.07 per unità invece di $21.80, e gli Sprockets $4.53 invece di $1.35. Costi unitari: Hubs $53.07 contro $65.80 con l&#x27;ABC; Sprockets $28.53 contro $25.35. Il prodotto complesso e a basso volume verrebbe sottocostato: è lo stesso schema di Hi-Tek.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Fogerty&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché gli $816,000 di General factory non compaiono nel costo unitario?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Sono organization-sustaining: non dipendono dalla produzione di Hubs o Sprockets. Per le slide non si allocano ai prodotti, quindi non hanno activity rate.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Gli Sprockets fanno 3 volte i setup degli Hubs: perché hanno un overhead unitario così basso?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché non usano lo special processing ($200,000 tutti sugli Hubs) e perché i loro $54,000 di setup si spalmano su 40,000 unità: $1.35 per unità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Ricalcola il costo unitario degli Hubs se servissero 200 setup invece di 100 (resto invariato).&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Overhead = 200 × $180 + $200,000 = $236,000 → $23.60 per unità; unit cost = 32 + 12 + 23.60 = &lt;b&gt;$67.60&lt;/b&gt;. (Ipotesi: il tasso resta $180, cioè il pool cresce in proporzione.)&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- §5 --&gt;
&lt;section class=&quot;part c-mat&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Sintesi&lt;/span&gt;&lt;h2&gt;Cosa portarsi a casa&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Aspetto&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Traditional costing&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Activity-Based Costing&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;Pool di overhead&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Uno solo (plantwide)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Uno per attività&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Base di ripartizione&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;A volume (DL$, DLH)&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Activity measure con legame causale (MH, setup, ordini, consegne…)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Overhead assegnato&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Tutto il manufacturing overhead&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Esclusi organization-sustaining e idle capacity&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Selling &amp;amp; admin&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Costi di periodo, non attribuiti&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Attribuiti se tracciabili (pubblicità, consegne, ordini)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Oggetti di costo&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Prodotti&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Prodotti &lt;em&gt;e&lt;/em&gt; clienti&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Rischio tipico&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Prodotti di nicchia o complessi sottocostati&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Costo e complessità del sistema&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Le formule dell&#x27;esercitazione&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;Activity rate = costo stimato del pool ÷ attività attesa totale&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;ABC cost = activity rate × attività consumata&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Customer margin = sales − COGS − total activity costs&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Product margin = sales − total (direct + activity) cost&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;POHR = overhead stimato ÷ base stimata (es. DL$)&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;Unit product cost = DM + DL + overhead ABC ÷ unità&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note c-mat&quot;&gt;Errori frequenti negli esercizi: dimenticare il COGS nel customer margin (l&#x27;hint di Worley); allocare i costi organization-sustaining; confondere “per order” con “per line item”; dividere l&#x27;overhead di prodotto per le unità di &lt;em&gt;tutti&lt;/em&gt; i prodotti invece che di quello in esame.&lt;/div&gt;

  &lt;div class=&quot;mine&quot;&gt;Collegamento con il resto del corso: questa è la prima tutorial session di Strategic Management Accounting, e i calcoli presuppongono la teoria dell&#x27;ABC vista a lezione. Non ho potuto aprire gli altri file della cartella corso/ (lo strumento a disposizione non permette di elencarne il contenuto), quindi qui non ci sono rimandi ad altre lezioni: confronta tu definizioni e notazione con le slide teoriche della Session 1.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- Per approfondire --&gt;
&lt;section class=&quot;part c-mat&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-n&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;part-tag&quot;&gt;Per approfondire&lt;/span&gt;&lt;h2&gt;Testi e studi di riferimento&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide della tutorial &lt;b&gt;non citano&lt;/b&gt; autori, testi, norme o siti. Le schede qui sotto sono letture di riferimento sull&#x27;ABC scelte da Claude e verificate con una ricerca web: sono tutte &lt;b&gt;fonti esterne&lt;/b&gt;, distinte dal contenuto delle slide.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;Fonte esterna&lt;/span&gt;
    &lt;h4&gt;Garrison, Noreen, Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw Hill)&lt;/h4&gt;
    &lt;p&gt;Manuale di riferimento di contabilità direzionale. Il capitolo “Activity-Based Costing: A Tool to Aid Decision Making” (cap. 7 o 8 a seconda dell&#x27;edizione) presenta i cinque passi dell&#x27;ABC, la cost hierarchy e il calcolo di customer e product margin. Gli esercizi Worley, Hi-Tek e Fogerty hanno lo stile e la struttura degli esercizi di fine capitolo di questo testo: è un&#x27;ipotesi, le slide non indicano la fonte. Conta perché offre teoria ed esercizi con lo stesso formato dell&#x27;esercitazione.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/1259011828/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice di un&#x27;edizione (McGraw Hill Higher Education)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;Fonte esterna&lt;/span&gt;
    &lt;h4&gt;Robin Cooper, Robert S. Kaplan — “Measure Costs Right: Make the Right Decisions”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, settembre 1988&lt;/h4&gt;
    &lt;p&gt;Articolo di 8 pagine fra i testi fondativi dell&#x27;ABC: sostiene che i sistemi tradizionali a base volume distorcono il costo dei prodotti e portano a decisioni sbagliate di prezzo e di mix. Conta perché è l&#x27;origine dell&#x27;idea messa in pratica nell&#x27;esercizio Hi-Tek.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.iveypublishing.ca/s/product/measure-costs-right-make-the-right-decisions/01t5c00000CwWzrAAF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;articolo (Ivey Publishing, distributore HBR)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;Fonte esterna&lt;/span&gt;
    &lt;h4&gt;Cooper &amp;amp; Kaplan — la cost hierarchy (unit, batch, product, facility level)&lt;/h4&gt;
    &lt;p&gt;Classificazione delle attività in base a cosa le genera: per unità, per lotto, per prodotto, per struttura. È la chiave usata dalle slide 19–21 per spiegare perché i setup (batch-level) e i costi product-sustaining sono distribuiti male da una base a volume. Le fonti divulgative usano nomi un po&#x27; diversi per l&#x27;ultimo livello (facility- oppure organization-sustaining).&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.accountingtools.com/articles/cost-hierarchy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AccountingTools — Cost hierarchy definition&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;Fonte esterna&lt;/span&gt;
    &lt;h4&gt;Robert S. Kaplan, Steven R. Anderson — “Time-Driven Activity-Based Costing”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, novembre 2004 (pp. 131–138)&lt;/h4&gt;
    &lt;p&gt;Risposta alle critiche all&#x27;ABC classico, giudicato costoso e lento da costruire e mantenere. Il &lt;span class=&quot;term&quot;&gt;TDABC&lt;/span&gt; usa due sole stime: il costo per unità di tempo della capacità fornita e il tempo richiesto da ogni transazione. Contiene esempi di redditività per cliente simili al caso Worley. Nel 2007 è diventato un libro (Harvard Business School Press).&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=485443&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Working paper su SSRN&lt;/a&gt; · &lt;a href=&quot;https://hbswk.hbs.edu/item/rethinking-activity-based-costing&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBS Working Knowledge — “Rethinking Activity-Based Costing”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;Fonte esterna&lt;/span&gt;
    &lt;h4&gt;Kaplan, Cooper — &lt;i&gt;Cost &amp;amp; Effect: Using Integrated Cost Systems to Drive Profitability and Performance&lt;/i&gt; (Harvard Business School Press, 1997/1998)&lt;/h4&gt;
    &lt;p&gt;Libro che porta l&#x27;ABC dal calcolo dei costi alla gestione (&lt;span class=&quot;term&quot;&gt;activity-based management&lt;/span&gt;), affiancandolo a target costing e kaizen costing. Utile per il lato “strategic” del corso: come usare i numeri dell&#x27;ABC per le decisioni.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.eyrolles.com/Loisirs/Livre/cost-and-effect-9780875847887&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda bibliografica (ISBN 9780875847887)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;
