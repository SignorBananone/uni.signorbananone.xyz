        &lt;text x=&quot;130&quot; y=&quot;76&quot;&gt;40,000&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;57&quot; font-weight=&quot;600&quot;&gt;45,714&lt;/text&gt;
        &lt;text x=&quot;315&quot; y=&quot;127&quot;&gt;24,000&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;138&quot; font-weight=&quot;600&quot;&gt;20,571&lt;/text&gt;
        &lt;text x=&quot;500&quot; y=&quot;153&quot;&gt;16,000&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;160&quot; font-weight=&quot;600&quot;&gt;13,715&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13.5&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;163&quot; y=&quot;232&quot;&gt;New Cars&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;232&quot;&gt;Used Cars&lt;/text&gt;&lt;text x=&quot;533&quot; y=&quot;232&quot;&gt;Car Parts&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot;&gt;&lt;rect x=&quot;400&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;418&quot; y=&quot;25&quot;&gt;Anno 1&lt;/text&gt;&lt;rect x=&quot;480&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;498&quot; y=&quot;25&quot;&gt;Anno 2&lt;/text&gt;&lt;/g&gt;

    &lt;figcaption&gt;Dati delle sl. 11-78/79. Le vendite di New Cars salgono da $1.5M a $2.0M; gli altri reparti restano fermi (900k e 600k).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Anno 1&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Anno 2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Cosa non va&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;New&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Used&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Parts&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;% of total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Allocation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Es. New: 1,500,000 ÷ 3,000,000 = 50% → 50% di $80,000 = $40,000 &lt;span class=&quot;src&quot;&gt;sl. 11-78&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;New&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Used&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Parts&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,500,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;% of total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;57%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;26%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Allocation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;45,714&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,571&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,715&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;New: 2,000,000 ÷ 3,500,000 ≈ 57% → $45,714 &lt;span class=&quot;src&quot;&gt;sl. 11-79&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il manager di New Cars si lamenterebbe, e avrebbe ragione &lt;span class=&quot;src&quot;&gt;sl. 11-79&lt;/span&gt;: ha venduto di più, non ha usato più servizi, e il suo addebito sale di $5,714. Used e Parts vedono scendere il proprio addebito senza aver fatto nulla.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Le vendite non sono il cost driver del service department. Il risultato è che l&#x27;addebito di un reparto dipende dalle performance &lt;i&gt;degli altri&lt;/i&gt;, cosa che viola il controllability principle e penalizza chi va meglio. La soluzione è applicare le regole viste sopra: variabili in base all&#x27;uso effettivo del servizio, fissi in base alla capacità richiesta, tutto a budget.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 6&lt;/h3&gt;
    &lt;p class=&quot;small muted&quot;&gt;Foster City &lt;span class=&quot;src&quot;&gt;sl. 11-72&lt;/span&gt;: un servizio ambulanze usato da due ospedali pubblici. Variabili a budget $4.20 per miglio; fissi a budget $120,000 l&#x27;anno. Mercy: 45% della capacità di punta, 15,000 miglia pianificate, 16,000 usate. Northside: 55%, 17,000 pianificate, 17,500 usate.&lt;/p&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 1a · Quanto costo verrà addebitato a Mercy Hospital a &lt;b&gt;fine anno&lt;/b&gt;? &lt;span class=&quot;src&quot;&gt;sl. 11-73&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$121,200&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$254,400&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$139,500&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;$117,000&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;Variabili: $4.20 × 16,000 miglia &lt;i&gt;effettive&lt;/i&gt; = $67,200. Fissi: 45% × $120,000 = $54,000. Totale &lt;b&gt;$121,200&lt;/b&gt;. ($117,000 è l&#x27;importo di inizio anno, calcolato sulle miglia pianificate.)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2 · E quanto si sarebbe previsto per Mercy all&#x27;&lt;b&gt;inizio&lt;/b&gt; dell&#x27;anno?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; $4.20 × 15,000 miglia pianificate = $63,000 + $54,000 = &lt;b&gt;$117,000&lt;/b&gt;. La parte fissa non cambia; cambia solo la variabile.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3 · Quanto paga Northside a fine anno?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;$4.20 × 17,500 = $73,500 + 55% × $120,000 = $66,000 → &lt;b&gt;$139,500&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;4 · Perché si addebitano i costi a budget e non quelli effettivi?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Per non trasferire ai reparti operativi le inefficienze del service department: chi gestisce il servizio resta responsabile della differenza tra costi effettivi e budget (sl. 11-68).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= FONTI ================= --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Testi, studi e norme&lt;/h2&gt;
  &lt;p&gt;Le slide citano esplicitamente solo la balanced scorecard e la lezione #4. Le altre voci sono collegate agli argomenti e indicate come tali. Le schede segnate &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; riportano dati e link trovati con una ricerca web, da controllare.&lt;/p&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· origine probabile delle slide&lt;/span&gt;
    &lt;h4&gt;R. H. Garrison, E. W. Noreen, P. C. Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h4&gt;
    &lt;p&gt;Manuale di contabilità direzionale molto diffuso. Nella 14ª edizione (2012) il capitolo 11 si intitola “Performance Measurement in Decentralized Organizations”: corrisponde alla numerazione “11-xx” delle slide, e la doppia numerazione “16-35/36/37” sulle tabelle Norton fa pensare al capitolo sull&#x27;analisi di bilancio. Qui trovi spiegati per esteso ROI, residual income, transfer pricing e addebito dei service departments, con esercizi. La numerazione dei capitoli cambia tra le edizioni.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0027162757/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Indice di un&#x27;edizione sul sito McGraw-Hill&lt;/a&gt; · &lt;a href=&quot;https://www.mheducation.com/highered/product/introduction-managerial-accounting-2024-release-brewer-garrison/M9781266540851.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Introduction to Managerial Accounting, edizione 2024 (stessi autori)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· citato nelle slide (sl. 11-31)&lt;/span&gt;
    &lt;h4&gt;R. S. Kaplan, D. P. Norton — “The Balanced Scorecard: Measures That Drive Performance”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, gen.-feb. 1992, pp. 71-79&lt;/h4&gt;
    &lt;p&gt;L&#x27;articolo che ha introdotto la balanced scorecard: affianca alle misure finanziarie tre prospettive operative (cliente, processi interni, innovazione e apprendimento) che le “guidano”. Conta per questa lezione perché risponde alla prima critica al ROI: indica &lt;i&gt;quali leve&lt;/i&gt; muovere per migliorarlo.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi dell&#x27;articolo (Management And Accounting Web)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Balanced_scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce “Balanced scorecard” (Wikipedia)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· collegato, non citato&lt;/span&gt;
    &lt;h4&gt;D. Solomons — &lt;i&gt;Divisional Performance: Measurement and Control&lt;/i&gt; (Financial Executives Research Foundation / Irwin, 1965)&lt;/h4&gt;
    &lt;p&gt;Studio classico sulla misurazione della performance delle divisioni. Solomons è indicato come colui che propose il residual income per valutare separatamente un investment center e il suo manager. Utile per capire da dove nasce la contrapposizione ROI / RI della parte 4.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA01277273&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda bibliografica (CiNii)&lt;/a&gt; · &lt;a href=&quot;https://link.springer.com/chapter/10.1007/978-1-4899-7138-8_17&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce “residual income” (Springer)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· materiale di studio collegato&lt;/span&gt;
    &lt;h4&gt;ACCA — articolo tecnico “Performance measurement”&lt;/h4&gt;
    &lt;p&gt;Materiale per gli esami ACCA che tratta misure di performance divisionale come ROI e residual income (definito come profitto controllabile meno un onere figurativo sull&#x27;investimento controllabile). Utile per esercitarsi con un taglio un po&#x27; diverso da quello del manuale.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.accaglobal.com/uk/en/student/exam-support-resources/fundamentals-exams-study-resources/f5/technical-articles/performance-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;accaglobal.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· norme sul bilancio (le slide dicono solo che è obbligatorio)&lt;/span&gt;
    &lt;h4&gt;Codice civile, art. 2423 e seguenti — Redazione del bilancio&lt;/h4&gt;
    &lt;p&gt;In Italia gli amministratori devono redigere il bilancio d&#x27;esercizio (stato patrimoniale, conto economico, rendiconto finanziario e nota integrativa), che deve rappresentare in modo veritiero e corretto la situazione patrimoniale e finanziaria e il risultato economico. Gli artt. 2424 e 2425 fissano gli schemi di stato patrimoniale e conto economico: sono l&#x27;equivalente italiano del balance sheet e dell&#x27;income statement della parte 3.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2423.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2423 c.c. (Brocardi.it)&lt;/a&gt;&lt;/p&gt;
    &lt;h4&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; (sostituisce IAS 1)&lt;/h4&gt;
    &lt;p&gt;Il principio contabile internazionale sulla presentazione del bilancio, emesso dallo IASB nell&#x27;aprile 2024 e in vigore dagli esercizi che iniziano dal 1° gennaio 2027. Introduce nel conto economico il subtotale obbligatorio &lt;i&gt;operating profit&lt;/i&gt;, vicino al net operating income usato per il ROI.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://cdn.ifrs.org/projects/projects/primary-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina del progetto (IFRS Foundation)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· collegato, non citato&lt;/span&gt;
    &lt;h4&gt;OECD — &lt;i&gt;Transfer Pricing Guidelines for Multinational Enterprises and Tax Administrations&lt;/i&gt; (ed. 2022)&lt;/h4&gt;
    &lt;p&gt;Le linee guida internazionali sul transfer pricing &lt;i&gt;fiscale&lt;/i&gt; tra società dello stesso gruppo in paesi diversi, fondate sull&#x27;&lt;b&gt;arm&#x27;s length principle&lt;/b&gt;: il prezzo interno deve essere quello che pagherebbero due imprese indipendenti. Attenzione alla differenza con la lezione: qui il prezzo serve a motivare i manager, lì a dividere correttamente la base imponibile tra paesi. Il criterio “arm&#x27;s length” somiglia però al market price approach.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://oecd-ilibrary.org/taxation/oecd-transfer-pricing-guidelines-for-multinational-enterprises-and-tax-administrations-2022_02d2274c-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD iLibrary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot; style=&quot;border-color:var(--ochre)&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;dal corso&lt;/span&gt;
    &lt;h4&gt;Lezione #4 — Corporate governance&lt;/h4&gt;
    &lt;p&gt;Citata nella sl. 5-2 come l&#x27;altra faccia della delega (azionisti → top manager). Non ho potuto aprire gli altri file della cartella &lt;em&gt;corso/&lt;/em&gt;: rileggi quella lezione per il primo anello della catena di delega.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;

&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;:scope&gt;.tablist&gt;button&#x27;),pans=t.querySelectorAll(&#x27;:scope&gt;.tabpanel&#x27;);
    btns.forEach(function(b,i){
      b.setAttribute(&#x27;aria-selected&#x27;,i===0?&#x27;true&#x27;:&#x27;false&#x27;);
      b.addEventListener(&#x27;click&#x27;,function(){
        btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;);pans[j].hidden=j!==i;});
        if(b.dataset.after&amp;&amp;window[b.dataset.after])window[b.dataset.after]();
      });
    });
  });
  // quiz
  document.querySelectorAll(&#x27;[data-quiz]&#x27;).forEach(function(o){
    var ok=o.dataset.quiz,fb=o.parentNode.querySelector(&#x27;.fb&#x27;);
    o.querySelectorAll(&#x27;button&#x27;).forEach(function(b){
      b.addEventListener(&#x27;click&#x27;,function(){
        if(b.dataset.k===ok){b.classList.add(&#x27;right&#x27;);o.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.disabled=true});}
        else b.classList.add(&#x27;wrong&#x27;);
        if(fb)fb.hidden=false;
      });
    });
  });
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.steps&gt;div&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),i=0,
        p=s.querySelector(&#x27;[data-prev]&#x27;),n=s.querySelector(&#x27;[data-next]&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){st.forEach(function(x,j){x.hidden=j!==i});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j===i?&#x27;on&#x27;:&#x27;&#x27;});p.disabled=i===0;n.disabled=i===st.length-1;}
    p.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    n.addEventListener(&#x27;click&#x27;,function(){if(i&lt;st.length-1){i++;show()}});
    show();
  });
  function $(id){return document.getElementById(id)}
  function usd(v,d){var s=Math.abs(v).toLocaleString(&#x27;en-US&#x27;,{minimumFractionDigits:d||0,maximumFractionDigits:d||0});return (v&lt;0?&#x27;−$&#x27;:&#x27;$&#x27;)+s}
  function pct(v,d){return (v*100).toFixed(d==null?1:d)+&#x27;%&#x27;}
  function presets(attr,fn){document.querySelectorAll(&#x27;[&#x27;+attr+&#x27;]&#x27;).forEach(function(b,_,all){b.addEventListener(&#x27;click&#x27;,function(){all.forEach(function(x){x.classList.remove(&#x27;on&#x27;)});b.classList.add(&#x27;on&#x27;);fn(b.getAttribute(attr))})})}

  // ROI simulator
  if($(&#x27;rS&#x27;)){
    var rS=$(&#x27;rS&#x27;),rE=$(&#x27;rE&#x27;),rA=$(&#x27;rA&#x27;);
    var X=function(t){return 50+t/4*440},Y=function(m){return 260-m/0.25*240};
    var h=&#x27;&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;495&quot; y2=&quot;260&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;50&quot; y2=&quot;20&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
    for(var k=0;k&lt;=5;k++){var m=k*0.05;h+=&#x27;&lt;line x1=&quot;50&quot; x2=&quot;490&quot; y1=&quot;&#x27;+Y(m)+&#x27;&quot; y2=&quot;&#x27;+Y(m)+&#x27;&quot; stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;2 4&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;&#x27;+(Y(m)+4)+&#x27;&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+(k*5)+&#x27;%&lt;/text&gt;&#x27;;}
    for(var t=0;t&lt;=4;t++)h+=&#x27;&lt;text x=&quot;&#x27;+X(t)+&#x27;&quot; y=&quot;277&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+t+&#x27;&lt;/text&gt;&#x27;;
    h+=&#x27;&lt;text x=&quot;490&quot; y=&quot;295&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;turnover →&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;12&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;↑ margin&lt;/text&gt;&#x27;;
    $(&#x27;rcAxes&#x27;).innerHTML=h;
    var c=&#x27;&#x27;;[0.1,0.15,0.2,0.3,0.4].forEach(function(r){var d=&#x27;&#x27;,t0=r/0.25;for(var i=0;i&lt;=80;i++){var t=t0+(4-t0)*i/80;d+=(i?&#x27;L&#x27;:&#x27;M&#x27;)+X(t).toFixed(1)+&#x27;,&#x27;+Y(r/t).toFixed(1)}
      c+=&#x27;&lt;path d=&quot;&#x27;+d+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;&#x27;+(r===0.15?2.2:1.2)+&#x27;&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;&#x27;+(X(t0)+4)+&#x27;&quot; y=&quot;32&quot; font-size=&quot;11.5&quot; fill=&quot;var(--slate)&quot;&gt;&#x27;+Math.round(r*100)+&#x27;%&lt;/text&gt;&#x27;});
    $(&#x27;rcCurves&#x27;).innerHTML=c;
    var roiUpd=function(){
      var S=+rS.value,E=+rE.value,A=+rA.value,N=S-E,M=N/S,T=S/A,R=N/A;
      $(&#x27;oS&#x27;).textContent=usd(S);$(&#x27;oE&#x27;).textContent=usd(E);$(&#x27;oA&#x27;).textContent=usd(A);
      $(&#x27;kN&#x27;).textContent=usd(N);$(&#x27;kM&#x27;).textContent=pct(M,2);$(&#x27;kT&#x27;).textContent=T.toFixed(2);$(&#x27;kR&#x27;).textContent=pct(R);
      var dot=$(&#x27;rcDot&#x27;);dot.setAttribute(&#x27;cx&#x27;,X(Math.min(T,4)));dot.setAttribute(&#x27;cy&#x27;,Y(Math.max(0,Math.min(M,0.25))));
    };
    [rS,rE,rA].forEach(function(x){x.addEventListener(&#x27;input&#x27;,roiUpd)});
    presets(&#x27;data-roip&#x27;,function(v){var a=v.split(&#x27;,&#x27;);rS.value=a[0];rE.value=a[1];rA.value=a[2];roiUpd()});
    roiUpd();
  }

  // ROI vs RI simulator
  if($(&#x27;iN&#x27;)){
    var ids=[&#x27;iN&#x27;,&#x27;iA&#x27;,&#x27;iR&#x27;,&#x27;pI&#x27;,&#x27;pN&#x27;];
    var riUpd=function(){
      var n=+$(&#x27;iN&#x27;).value,a=+$(&#x27;iA&#x27;).value,r=+$(&#x27;iR&#x27;).value,pi=+$(&#x27;pI&#x27;).value,pn=+$(&#x27;pN&#x27;).value;
      $(&#x27;oiN&#x27;).textContent=usd(n);$(&#x27;oiA&#x27;).textContent=usd(a);$(&#x27;oiR&#x27;).textContent=pct(r);$(&#x27;opI&#x27;).textContent=usd(pi);$(&#x27;opN&#x27;).textContent=usd(pn);
      var roi1=n/a,roi2=(n+pn)/(a+pi),pr=pn/pi,ri1=n-a*r,ri2=n+pn-(a+pi)*r;
      $(&#x27;r1&#x27;).textContent=pct(roi1);$(&#x27;r2&#x27;).textContent=pct(roi2);$(&#x27;r3&#x27;).textContent=pct(pr);$(&#x27;ri1&#x27;).textContent=usd(ri1);$(&#x27;ri2&#x27;).textContent=usd(ri2);
      var accR=roi2&gt;roi1+1e-9,accI=ri2&gt;ri1+1e-9,good=pr&gt;r+1e-9;
      function yn(b){return b?&#x27;&lt;span class=&quot;good&quot;&gt;accetta&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;badt&quot;&gt;rifiuta&lt;/span&gt;&#x27;}
      var txt=&#x27;Manager valutato sul &lt;b&gt;ROI&lt;/b&gt;: &#x27;+yn(accR)+&#x27; · Manager valutato sul &lt;b&gt;RI&lt;/b&gt;: &#x27;+yn(accI)+&#x27; · &lt;b&gt;Azienda&lt;/b&gt;: il progetto &#x27;+(good?&#x27;&lt;span class=&quot;good&quot;&gt;conviene&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;badt&quot;&gt;non conviene&lt;/span&gt;&#x27;)+&#x27; (rende &#x27;+pct(pr)+&#x27; contro un minimo del &#x27;+pct(r)+&#x27;).&#x27;;
      if(accR!==good)txt+=&#x27;&lt;br&gt;&lt;b&gt;Conflitto:&lt;/b&gt; con il ROI la decisione del manager va contro l\&#x27;interesse dell\&#x27;azienda. Con il RI no.&#x27;;
      else txt+=&#x27;&lt;br&gt;Nessun conflitto in questo caso: ROI e RI portano alla stessa decisione.&#x27;;
      $(&#x27;riv&#x27;).innerHTML=txt;
      var max=0.4,x=function(v){return 20+Math.max(0,Math.min(v,max))/max*520};
      var s=&#x27;&lt;line x1=&quot;20&quot; y1=&quot;50&quot; x2=&quot;540&quot; y2=&quot;50&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
      for(var k=0;k&lt;=8;k++){s+=&#x27;&lt;line x1=&quot;&#x27;+x(k*0.05)+&#x27;&quot; x2=&quot;&#x27;+x(k*0.05)+&#x27;&quot; y1=&quot;46&quot; y2=&quot;54&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+x(k*0.05)+&#x27;&quot; y=&quot;70&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+(k*5)+&#x27;%&lt;/text&gt;&#x27;;}
      if(roi1&gt;r)s+=&#x27;&lt;rect x=&quot;&#x27;+x(r)+&#x27;&quot; y=&quot;38&quot; width=&quot;&#x27;+(x(roi1)-x(r))+&#x27;&quot; height=&quot;24&quot; fill=&quot;var(--brick)&quot; opacity=&quot;.2&quot;/&gt;&lt;text x=&quot;&#x27;+((x(r)+x(roi1))/2)+&#x27;&quot; y=&quot;88&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--brick)&quot;&gt;zona di conflitto&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(r)+&#x27;&quot; x2=&quot;&#x27;+x(r)+&#x27;&quot; y1=&quot;30&quot; y2=&quot;62&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;&#x27;+x(r)+&#x27;&quot; y=&quot;24&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--sage)&quot;&gt;minimo&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(roi1)+&#x27;&quot; x2=&quot;&#x27;+x(roi1)+&#x27;&quot; y1=&quot;30&quot; y2=&quot;62&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;&#x27;+x(roi1)+&#x27;&quot; y=&quot;12&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--slate)&quot;&gt;ROI attuale&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;circle cx=&quot;&#x27;+x(pr)+&#x27;&quot; cy=&quot;50&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      $(&#x27;ribar&#x27;).innerHTML=s;
    };
    ids.forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,riUpd)});riUpd();
  }

  // Transfer pricing simulator
  if($(&#x27;tI&#x27;)){
    var tI=$(&#x27;tI&#x27;),tO=$(&#x27;tO&#x27;);
    var tpUpd=function(){
      var idle=+tI.value,out=+tO.value,lost=Math.max(0,1000-idle),lo=10+15*lost/1000,hi=out,gain=(hi-lo)*1000;
      $(&#x27;otI&#x27;).textContent=idle.toLocaleString(&#x27;en-US&#x27;);$(&#x27;otO&#x27;).textContent=usd(out,2);
      $(&#x27;tL&#x27;).textContent=usd(lo,2);$(&#x27;tU&#x27;).textContent=usd(hi,2);$(&#x27;tG&#x27;).textContent=usd(gain);
      var x=function(v){return 30+v/32*520},s=&#x27;&lt;line x1=&quot;30&quot; y1=&quot;70&quot; x2=&quot;550&quot; y2=&quot;70&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
      for(var v=0;v&lt;=30;v+=5)s+=&#x27;&lt;line x1=&quot;&#x27;+x(v)+&#x27;&quot; x2=&quot;&#x27;+x(v)+&#x27;&quot; y1=&quot;66&quot; y2=&quot;74&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+x(v)+&#x27;&quot; y=&quot;90&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;$&#x27;+v+&#x27;&lt;/text&gt;&#x27;;
      var ok=lo&lt;=hi+1e-9;
      if(ok)s+=&#x27;&lt;rect x=&quot;&#x27;+x(lo)+&#x27;&quot; y=&quot;56&quot; width=&quot;&#x27;+Math.max(2,x(hi)-x(lo))+&#x27;&quot; height=&quot;28&quot; rx=&quot;4&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.35&quot;/&gt;&#x27;;
      else s+=&#x27;&lt;rect x=&quot;&#x27;+x(hi)+&#x27;&quot; y=&quot;56&quot; width=&quot;&#x27;+(x(lo)-x(hi))+&#x27;&quot; height=&quot;28&quot; rx=&quot;4&quot; fill=&quot;var(--bad)&quot; opacity=&quot;.22&quot;/&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(10)+&#x27;&quot; x2=&quot;&#x27;+x(10)+&#x27;&quot; y1=&quot;96&quot; y2=&quot;104&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+x(10)+&#x27;&quot; y=&quot;118&quot; font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;var. cost $10&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(25)+&#x27;&quot; x2=&quot;&#x27;+x(25)+&#x27;&quot; y1=&quot;96&quot; y2=&quot;104&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+x(25)+&#x27;&quot; y=&quot;118&quot; font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;mercato $25&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(lo)+&#x27;&quot; x2=&quot;&#x27;+x(lo)+&#x27;&quot; y1=&quot;36&quot; y2=&quot;84&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;&#x27;+x(lo)+&#x27;&quot; y=&quot;30&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--brick)&quot;&gt;min venditore&lt;/text&gt;&#x27;;
      s+=&#x27;&lt;line x1=&quot;&#x27;+x(hi)+&#x27;&quot; x2=&quot;&#x27;+x(hi)+&#x27;&quot; y1=&quot;20&quot; y2=&quot;84&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;&#x27;+x(hi)+&#x27;&quot; y=&quot;14&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--slate)&quot;&gt;max compratore&lt;/text&gt;&#x27;;
      $(&#x27;tpbar&#x27;).innerHTML=s;
      $(&#x27;tpv&#x27;).innerHTML=ok?&#x27;&lt;span class=&quot;good&quot;&gt;Esiste un intervallo: &#x27;+usd(lo,2)+&#x27; – &#x27;+usd(hi,2)+&#x27;.&lt;/span&gt; Lo scambio interno fa guadagnare al gruppo &#x27;+usd(gain)+&#x27; al mese; il transfer price decide solo come dividerlo tra le due divisioni. Vendite esterne sacrificate: &#x27;+lost.toLocaleString(&#x27;en-US&#x27;)+&#x27; casse.&#x27;
        :&#x27;&lt;span class=&quot;badt&quot;&gt;Nessun intervallo accettabile.&lt;/span&gt; Al venditore lo scambio costa più di quanto il compratore pagherebbe fuori: per il gruppo è meglio non farlo (perderebbe &#x27;+usd(-gain)+&#x27; al mese). Il fatto che la trattativa fallisca qui è un segnale corretto.&#x27;;
    };
