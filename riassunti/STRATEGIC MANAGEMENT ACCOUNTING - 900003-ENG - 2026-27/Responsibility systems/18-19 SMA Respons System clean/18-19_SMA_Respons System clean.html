          &lt;text x=&quot;819&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;5 · Transfer&lt;/text&gt;&lt;text x=&quot;819&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;pricing&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s6&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;736&quot; y=&quot;192&quot; width=&quot;166&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot;/&gt;
          &lt;text x=&quot;819&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;6 · Service&lt;/text&gt;&lt;text x=&quot;819&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;departments&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#fonti&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;246&quot; y=&quot;292&quot; width=&quot;446&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.4&quot;/&gt;
          &lt;text x=&quot;469&quot; y=&quot;319&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;Per approfondire · testi, studi e norme collegati&lt;/text&gt;&lt;/a&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Filo logico: si delega (1) → si rende ognuno responsabile solo di ciò che controlla (2) → per i centri con capitale investito servono dati di bilancio (3) e misure come ROI e residual income (4) → i segmenti si scambiano beni (5) e consumano servizi comuni (6), che vanno prezzati senza distorcere gli incentivi.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

&lt;!-- ================= 1 ================= --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 1&lt;/span&gt;
  &lt;h2&gt;Delegare: perché le organizzazioni si decentralizzano&lt;/h2&gt;
  &lt;p&gt;Il punto di partenza della lezione &lt;span class=&quot;src&quot;&gt;sl. 5-2&lt;/span&gt;: tranne che nelle organizzazioni molto piccole, proprietari e top manager &lt;b&gt;devono delegare&lt;/b&gt; l&#x27;autorità decisionale. La delega avviene a due livelli, e a ciascuno corrisponde un sistema di controllo diverso.&lt;/p&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Catena della delega: proprietari, top manager, subordinati&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;15&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;115&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Owners&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;es. stockholders (azionisti)&lt;/text&gt;
        &lt;rect x=&quot;335&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;430&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Top managers&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;vertice aziendale&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;745&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Subordinates&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;manager di livello inferiore&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;&gt;&lt;path d=&quot;M212,100 L331,100&quot;/&gt;&lt;path d=&quot;M527,100 L646,100&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;
        &lt;text x=&quot;272&quot; y=&quot;44&quot;&gt;delega&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;170&quot;&gt;Corporate governance&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;187&quot; font-weight=&quot;400&quot; fill=&quot;var(--ink2)&quot;&gt;(lezione #4)&lt;/text&gt;
        &lt;text x=&quot;587&quot; y=&quot;44&quot;&gt;delega&lt;/text&gt;&lt;text x=&quot;587&quot; y=&quot;170&quot;&gt;Management control&lt;/text&gt;&lt;text x=&quot;587&quot; y=&quot;187&quot; fill=&quot;var(--sage)&quot;&gt;systems&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Fonte: sl. 5-2. Questa lezione riguarda il secondo anello: come i top manager dirigono e controllano i subordinati.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Decentralized organization&lt;/b&gt; (organizzazione decentralizzata): l&#x27;autorità decisionale è distribuita in tutta l&#x27;organizzazione invece di restare confinata a pochi top executive &lt;span class=&quot;src&quot;&gt;sl. 5-2&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Corporate governance&lt;/b&gt; = l&#x27;insieme di regole e meccanismi con cui i proprietari indirizzano e controllano i top manager (argomento della lezione #4 del corso, citata nella slide). &lt;b&gt;Management control systems&lt;/b&gt; = gli strumenti (budget, misure di performance, incentivi) con cui i top manager orientano le azioni dei sottoposti.&lt;/p&gt;

  &lt;h3&gt;Vantaggi e svantaggi&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Benefits&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Disadvantages&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Il filo comune&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Top management libero di concentrarsi sulla strategia&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Le decisioni operative quotidiane passano ad altri.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Decisioni basate su informazioni migliori&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Chi sta “sul campo” conosce clienti, costi e problemi locali.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Risposta rapida ai clienti&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Non serve far risalire ogni richiesta lungo la gerarchia.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;I manager di livello inferiore fanno esperienza&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Si forma la futura classe dirigente.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Più soddisfazione nel lavoro&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Avere autorità decisionale motiva.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-4&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Manca la “big picture”&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Si decide guardando solo il proprio segmento.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Obiettivi non allineati&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Gli obiettivi del manager possono non coincidere con quelli dell&#x27;azienda.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Scarso coordinamento&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Tra manager autonomi.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Difficile diffondere le innovazioni&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Una buona idea resta chiusa in un reparto.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-5&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Gli svantaggi hanno quasi tutti la stessa radice: un problema di &lt;b&gt;goal congruence&lt;/b&gt; (allineamento fra gli obiettivi del singolo e quelli dell&#x27;azienda). Tutto il resto della lezione è la risposta: misurare ciascun manager &lt;i&gt;solo su ciò che controlla&lt;/i&gt; (parte 2), con indicatori che non lo spingano a scelte dannose per l&#x27;insieme (ROI vs residual income, parte 4), e fissare prezzi interni e addebiti che lo inducano ad agire “nel miglior interesse dell&#x27;azienda nel suo complesso” (parti 5 e 6).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Con quale sistema gli azionisti controllano i top manager, e con quale i top manager controllano i subordinati?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Azionisti → top manager: &lt;b&gt;corporate governance systems&lt;/b&gt;. Top manager → subordinati: &lt;b&gt;management control systems&lt;/b&gt; (sl. 5-2).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Quale di questi è uno &lt;u&gt;svantaggio&lt;/u&gt; della decentralizzazione?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Decisioni basate su informazioni migliori&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Obiettivi del manager diversi da quelli dell&#x27;azienda&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Top management libero per la strategia&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;Gli altri due sono benefici (sl. 11-4); il disallineamento degli obiettivi è uno svantaggio (sl. 11-5).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Perché proprio chi sta ai livelli bassi avrebbe “informazioni migliori”?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Perché è vicino a clienti, processi e mercati locali: conosce dettagli che al vertice arrivano tardi, filtrati o non arrivano affatto. Per questo la delega accelera la risposta ai clienti.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 2 ================= --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 2&lt;/span&gt;
  &lt;h2&gt;Responsibility accounting e responsibility centers&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility accounting&lt;/b&gt; (contabilità per responsabilità): i manager rispondono di quegli elementi, e &lt;i&gt;solo&lt;/i&gt; di quelli, che possono effettivamente controllare in misura significativa &lt;span class=&quot;src&quot;&gt;sl. 11-6&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;È il cosiddetto &lt;b&gt;controllability principle&lt;/b&gt; (principio di controllabilità): sarebbe ingiusto, e demotivante, giudicare un capo reparto per un costo deciso dalla sede o per un prezzo di vendita che non può toccare.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility center&lt;/b&gt; (centro di responsabilità): qualunque parte dell&#x27;organizzazione il cui manager ha controllo su, ed è chiamato a rispondere di, &lt;b&gt;costi, profitti o investimenti&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-6&lt;/span&gt;.&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Tre tipi di centri di responsabilità, uno dentro l&#x27;altro&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;560&quot; height=&quot;260&quot; rx=&quot;22&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;45&quot; y=&quot;70&quot; width=&quot;380&quot; height=&quot;190&quot; rx=&quot;18&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;70&quot; y=&quot;120&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;g font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;
        &lt;text x=&quot;40&quot; y=&quot;50&quot; fill=&quot;var(--slate)&quot;&gt;Investment center&lt;/text&gt;
        &lt;text x=&quot;65&quot; y=&quot;98&quot; fill=&quot;var(--ochre)&quot;&gt;Profit center&lt;/text&gt;
        &lt;text x=&quot;88&quot; y=&quot;146&quot; fill=&quot;var(--sage)&quot;&gt;Cost center&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;
        &lt;text x=&quot;88&quot; y=&quot;176&quot;&gt;controlla: costi&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;196&quot;&gt;misura: costi vs&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;214&quot;&gt;budget / standard&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;150&quot;&gt;+ ricavi&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;172&quot;&gt;misura:&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;190&quot;&gt;profitto del&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;208&quot;&gt;segmento&lt;/text&gt;
        &lt;text x=&quot;445&quot; y=&quot;120&quot;&gt;+ investimenti&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;138&quot;&gt;in operating&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;156&quot;&gt;assets&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;186&quot;&gt;misura:&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;204&quot;&gt;ROI, residual&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;222&quot;&gt;income&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;text x=&quot;610&quot; y=&quot;60&quot; font-weight=&quot;600&quot;&gt;Chi controlla cosa&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;122&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;Cost&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;122&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;122&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;122&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;152&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot;&gt;Profit&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;152&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;152&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;152&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;182&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Investment&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;
        &lt;text x=&quot;700&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Costi&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Ricavi&lt;/text&gt;&lt;text x=&quot;806&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Invest.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;I tre tipi di responsibility center (sl. 11-7 → 11-10): ogni livello aggiunge un&#x27;area di controllo. Le colonne “misura” sono un&#x27;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; che anticipa la parte 4.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Cost center&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Profit center&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Definizione&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-8&lt;/span&gt;: segmento il cui manager controlla i &lt;b&gt;costi&lt;/b&gt;, ma non i ricavi né i fondi per investimenti.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Esempi: un reparto produttivo, la manutenzione, l&#x27;IT, la contabilità. Si valuta confrontando i costi effettivi con quelli di budget o standard: un buon cost center produce l&#x27;output richiesto al costo minimo.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Definizione&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-9&lt;/span&gt;: segmento il cui manager controlla &lt;b&gt;sia i costi sia i ricavi&lt;/b&gt;, ma non i fondi per investimenti.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Revenues&lt;/h4&gt;Sales · Interest · Other&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;Mfg. costs (costi di produzione) · Commissions (provvigioni) · Salaries · Other&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Esempi: un punto vendita di una catena, una linea di prodotto. Si valuta sul profitto, confrontato con il budget.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Definizione&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-10&lt;/span&gt;: segmento il cui manager controlla &lt;b&gt;costi, ricavi e investimenti in operating assets&lt;/b&gt; (attività operative: impianti, magazzino, crediti…).&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Esempi: una divisione con propria autonomia di investimento, una società controllata. Il profitto da solo non basta: una divisione che guadagna 100 investendo 1.000 non vale quanto una che guadagna 100 investendo 200. Servono misure che mettono in rapporto reddito e capitale: &lt;a href=&quot;#s4&quot;&gt;ROI&lt;/a&gt; e &lt;a href=&quot;#s4b&quot;&gt;residual income&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. La manager di un negozio decide prezzi, assortimento e personale, ma non può aprire nuovi negozi né comprare attrezzature. Che centro è?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Cost center&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Profit center&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;Controlla costi e ricavi ma non gli investimenti → &lt;b&gt;profit center&lt;/b&gt; (sl. 11-9).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Il responsabile di produzione dovrebbe essere giudicato sull&#x27;aumento dell&#x27;affitto del capannone deciso dalla sede?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;No: per il controllability principle si risponde solo di ciò che si controlla in misura significativa (sl. 11-6). Quel costo va attribuito a chi l&#x27;ha deciso.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Perché per un investment center non basta guardare il profitto?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Perché il manager decide anche quanto capitale impiegare: bisogna giudicare il profitto &lt;i&gt;in rapporto&lt;/i&gt; agli asset usati (ROI) o al netto di un rendimento minimo richiesto su quegli asset (residual income).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 3 ================= --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 3&lt;/span&gt;
  &lt;h2&gt;Ripasso: il bilancio (financial statement)&lt;/h2&gt;
  &lt;p&gt;Per calcolare il ROI servono due numeri presi da due documenti diversi: un &lt;i&gt;reddito&lt;/i&gt; (dal conto economico) e un &lt;i&gt;capitale investito&lt;/i&gt; (dallo stato patrimoniale). Le slide fanno quindi un ripasso veloce &lt;span class=&quot;src&quot;&gt;sl. 12 → 11-20&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial statement (FS)&lt;/b&gt;: insieme obbligatorio di documenti che le imprese redigono ogni anno. Comprende due documenti contabili principali: &lt;b&gt;income statement&lt;/b&gt; (IS, conto economico) e &lt;b&gt;balance sheet&lt;/b&gt; (BS, stato patrimoniale).&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;

      &lt;text x=&quot;130&quot; y=&quot;222&quot; font-weight=&quot;600&quot;&gt;Net income&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;240&quot; font-size=&quot;12&quot;&gt;(profit)&lt;/text&gt;
      &lt;text x=&quot;270&quot; y=&quot;140&quot;&gt;Positive items&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;158&quot;&gt;of income (ricavi)&lt;/text&gt;&lt;/g&gt;

      &lt;rect x=&quot;470&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;220&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;rect x=&quot;630&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;140&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;rect x=&quot;630&quot; y=&quot;180&quot; width=&quot;160&quot; height=&quot;80&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot;&gt;&lt;text x=&quot;550&quot; y=&quot;146&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;164&quot; font-size=&quot;12&quot;&gt;impieghi&lt;/text&gt;
      &lt;text x=&quot;710&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;Liabilities&lt;/text&gt;&lt;text x=&quot;710&quot; y=&quot;124&quot; font-size=&quot;12&quot;&gt;debiti verso terzi&lt;/text&gt;
      &lt;text x=&quot;710&quot; y=&quot;216&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;710&quot; y=&quot;234&quot; font-size=&quot;12&quot;&gt;patrimonio netto&lt;/text&gt;&lt;/g&gt;
      &lt;path d=&quot;M200,236 C380,300 560,300 626,232&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
      &lt;text x=&quot;420&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;il net income dell&#x27;anno confluisce nell&#x27;equity&lt;/text&gt;

    &lt;figcaption&gt;Ricostruzione degli schemi delle sl. 12-13. Identità di fondo &lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt;: &lt;b&gt;Assets = Liabilities + Equity&lt;/b&gt;; e &lt;b&gt;Net income = ricavi − costi&lt;/b&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Per valutare la salute dell&#x27;impresa, il bilancio viene &lt;b&gt;“analysed”&lt;/b&gt; (riclassificato): le voci di BS e IS vengono riordinate in modo da ricavarne più informazioni sull&#x27;azienda e sulla sua performance &lt;span class=&quot;src&quot;&gt;sl. 14&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Le voci principali&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Assets — impieghi (sl. 15)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Cash and cash equivalent&lt;/b&gt;: denaro in cassa e sui conti correnti e di risparmio. &lt;b&gt;Account receivables&lt;/b&gt; (trade receivables, crediti commerciali): somme dovute dai clienti per beni o servizi già consegnati. &lt;b&gt;Inventories&lt;/b&gt; (rimanenze): merci in magazzino disponibili per la vendita. &lt;b&gt;Property, plant and equipment&lt;/b&gt; (immobilizzazioni materiali): beni non convertibili rapidamente in denaro (computer, auto, impianti). &lt;b&gt;Securities&lt;/b&gt;: obbligazioni, azioni o quote di altre imprese acquisite a scopo di investimento.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Le securities di solito &lt;i&gt;non&lt;/i&gt; sono operating assets: non servono al core business. Per questo nel ROI si escludono (vedi parte 4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Liabilities — debiti (sl. 17)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Bank overdraft&lt;/b&gt; (scoperto di conto): fondi prelevati oltre il saldo, spesso per pagare i fornitori. &lt;b&gt;Account payable&lt;/b&gt; (trade payables, debiti verso fornitori): importi dovuti per beni o servizi già ricevuti. &lt;b&gt;Note payable&lt;/b&gt;: obbligo di restituire una somma presa in prestito a una data futura. &lt;b&gt;Severance provisions&lt;/b&gt; (employee benefit liabilities, in Italia il TFR): obbligo verso i dipendenti, pagato quando il rapporto di lavoro finisce. &lt;b&gt;Long term borrowings&lt;/b&gt;: debiti verso finanziatori (es. mutuo bancario) da rimborsare oltre 12 mesi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Equity — patrimonio netto (sl. 18)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Share capital&lt;/b&gt;: quanto hanno investito i proprietari. &lt;b&gt;Retained earnings&lt;/b&gt; (o reserves, utili non distribuiti): somma dei profitti della vita dell&#x27;azienda non distribuiti come &lt;b&gt;dividends&lt;/b&gt; (i dividendi sono distribuzioni di profitto). &lt;b&gt;Net income&lt;/b&gt;: differenza tra componenti positive e negative di reddito (utile o perdita).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Par value&lt;/b&gt; = valore nominale dell&#x27;azione. &lt;b&gt;APIC&lt;/b&gt; (additional paid-in capital, sovrapprezzo azioni): quanto un investitore paga in più rispetto al valore nominale &lt;span class=&quot;src&quot;&gt;sl. 11-19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Il caso Norton Corporation&lt;/h3&gt;
  &lt;p&gt;Le slide presentano il bilancio di un&#x27;azienda di esempio, su due anni. Scorri le linguette.&lt;/p&gt;

      &lt;tr&gt;&lt;td&gt;Land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;165,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;123,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Buildings and equipment, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;116,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;128,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total property and equipment&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;281,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;251,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$346,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$300,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-16 · valori in $&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;

      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Total stockholders&#x27; equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;234,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;180,000&lt;/td&gt;&lt;/tr&gt;

    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-19&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;494,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;450,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;127,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;354,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;323,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;270,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;249,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income &lt;span class=&quot;small muted&quot;&gt;(≈ EBIT)&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;84,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;74,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,300&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Net income before taxes&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;76,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Less income taxes (30%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23,010&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$53,690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$46,200&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Gross margin&lt;/b&gt; = ricavi − cost of goods sold (solo costo del prodotto, non le spese di vendita e amministrative). &lt;b&gt;Interest expense&lt;/b&gt; = costo delle risorse finanziarie &lt;span class=&quot;src&quot;&gt;sl. 11-20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Tre conti che le slide non fanno ma che aiutano a “leggere” i numeri:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Dividendi pagati&lt;/b&gt;: RE iniziali 50,000 + net income 53,690 − RE finali 48,890 = &lt;b&gt;$54,800&lt;/b&gt;. Norton ha distribuito più dell&#x27;utile dell&#x27;anno: per questo le retained earnings scendono.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Aumento di capitale&lt;/b&gt;: common stock +10,400 (10,400 nuove azioni da $1 di par value) e APIC +45,100 → incassati &lt;b&gt;$55,500&lt;/b&gt;, circa $5.34 per azione.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;ROI di Norton&lt;/b&gt; (anticipo della parte 4): average operating assets = (346,390 + 300,000) / 2 = 323,195; ROI = 84,000 / 323,195 ≈ &lt;b&gt;26.0%&lt;/b&gt;, cioè margin 17.0% × turnover 1.53. Per semplicità qui si considerano operativi tutti gli asset; prova il caso nel &lt;a href=&quot;#roisim&quot;&gt;simulatore&lt;/a&gt;.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. In quale documento trovi il net operating income, e in quale gli operating assets?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Net operating income → &lt;b&gt;income statement&lt;/b&gt; (è un flusso dell&#x27;anno). Operating assets → &lt;b&gt;balance sheet&lt;/b&gt; (è uno stock a una data). Per questo il ROI usa la &lt;i&gt;media&lt;/i&gt; degli asset di inizio e fine anno.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Un cliente deve ancora pagare una fattura: dove compare l&#x27;importo?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Accounts receivable&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Accounts payable&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Retained earnings&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;È un credito verso clienti → &lt;b&gt;accounts receivable&lt;/b&gt;, tra gli assets (sl. 15). Gli accounts payable sono debiti verso fornitori.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Norton: verifica che il balance sheet “quadri” quest&#x27;anno.&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Liabilities 112,000 + equity 234,390 = 346,390 = total assets. ✓&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 4 ================= --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 4 · Learning objective 1&lt;/span&gt;
  &lt;h2&gt;Return on investment (ROI)&lt;/h2&gt;
  &lt;p&gt;Obiettivo: calcolare il ROI e capire come lo cambiano vendite, costi e asset &lt;span class=&quot;src&quot;&gt;sl. 11-11&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;ROI&lt;/b&gt; (return on investment, redditività del capitale investito): confronta il reddito operativo prodotto con gli asset operativi. È una misura di &lt;b&gt;profitability&lt;/b&gt; (redditività): dice se l&#x27;azienda sa generare reddito usando i propri asset operativi, cioè &lt;i&gt;“is the core business going well?”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-21&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;ROI = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Net operating income&lt;/h4&gt;= &lt;b&gt;EBIT&lt;/b&gt;, earnings before interest and taxes: reddito prima di interessi e imposte &lt;span class=&quot;src&quot;&gt;sl. 11-22&lt;/span&gt;. &lt;span class=&quot;small muted&quot;&gt;Si escludono interessi e imposte perché dipendono da come è finanziata l&#x27;azienda e dal fisco, non dalla gestione operativa.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Average operating assets&lt;/h4&gt;Cash, accounts receivable, inventory, plant and equipment e altri asset produttivi &lt;span class=&quot;src&quot;&gt;sl. 11-22&lt;/span&gt;. &lt;span class=&quot;small muted&quot;&gt;Media di inizio e fine periodo, perché il reddito matura lungo tutto l&#x27;anno. Esclusi gli asset non operativi (terreni tenuti per uso futuro, partecipazioni in altre società).&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La scomposizione: margin × turnover&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;
    Margin = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;/span&gt;
    &amp;nbsp;&amp;nbsp; Turnover = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;br&gt;&lt;br&gt;
    &lt;b&gt;ROI = Margin × Turnover&lt;/b&gt;
  &lt;/div&gt;
  &lt;p&gt;Le vendite si semplificano: è la stessa frazione del ROI, spezzata in due &lt;span class=&quot;src&quot;&gt;sl. 11-24&lt;/span&gt;. &lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Questa è la cosiddetta formula DuPont.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Margin&lt;/h4&gt;Capacità di ricavare reddito operativo (ricavi − costi operativi) dalle vendite &lt;span class=&quot;src&quot;&gt;sl. 11-25&lt;/span&gt;. Quanti centesimi restano per ogni euro venduto.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Turnover&lt;/h4&gt;Efficienza nell&#x27;uso degli asset operativi: quante volte all&#x27;anno gli asset “vengono usati” per produrre vendite &lt;span class=&quot;src&quot;&gt;sl. 11-26&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Lo stesso ROI si ottiene con strategie opposte: una gioielleria (margin alto, turnover basso) e un discount alimentare (margin basso, turnover alto) possono avere entrambi un ROI del 15%. Il grafico qui sotto lo mostra: ogni curva è un “ROI costante”.&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;roisim&quot;&gt;
    &lt;h4&gt;Simulatore: muovi vendite, costi e asset&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Casi:&lt;/span&gt;&lt;button class=&quot;btn on&quot; data-roip=&quot;500000,470000,200000&quot;&gt;Regal, base&lt;/button&gt;&lt;button class=&quot;btn&quot; data-roip=&quot;535000,485000,230000&quot;&gt;Regal, dopo l&#x27;investimento&lt;/button&gt;&lt;button class=&quot;btn&quot; data-roip=&quot;494000,410000,323000&quot;&gt;Norton, quest&#x27;anno&lt;/button&gt;&lt;/div&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rS&quot; min=&quot;100000&quot; max=&quot;1000000&quot; step=&quot;1000&quot; value=&quot;500000&quot;&gt;&lt;output id=&quot;oS&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Operating expenses&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rE&quot; min=&quot;50000&quot; max=&quot;1000000&quot; step=&quot;1000&quot; value=&quot;470000&quot;&gt;&lt;output id=&quot;oE&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rA&quot; min=&quot;50000&quot; max=&quot;600000&quot; step=&quot;1000&quot; value=&quot;200000&quot;&gt;&lt;output id=&quot;oA&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Net op. income&lt;/span&gt;&lt;b id=&quot;kN&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Margin&lt;/span&gt;&lt;b id=&quot;kM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Turnover&lt;/span&gt;&lt;b id=&quot;kT&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI&lt;/span&gt;&lt;b id=&quot;kR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;roichart&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico margin contro turnover con curve di ROI costante&quot;&gt;
      &lt;g id=&quot;rcAxes&quot;&gt;&lt;/g&gt;&lt;g id=&quot;rcCurves&quot;&gt;&lt;/g&gt;
      &lt;circle id=&quot;rcDot&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;small muted&quot;&gt;Asse x: turnover (0–4 volte). Asse y: margin (0–25%). Il punto è la tua azienda; le curve sono combinazioni con lo stesso ROI. Per “Norton” i costi operativi includono cost of goods sold (140,000 + 270,000) e gli asset sono la media arrotondata.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Le tre leve per aumentare il ROI&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Dalla formula si vede che il ROI cresce se:&lt;/p&gt;
    &lt;ol&gt;&lt;li&gt;&lt;b&gt;aumentano le vendite&lt;/b&gt;: il turnover sale; e se una parte dei costi è fissa, sale anche il margin (operating leverage, leva operativa);&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;si riducono i costi operativi&lt;/b&gt;: sale il margin;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;si riducono gli asset operativi&lt;/b&gt; (meno magazzino, crediti incassati prima, impianti inutilizzati venduti): sale il turnover.&lt;/li&gt;&lt;/ol&gt;
    &lt;p&gt;Nell&#x27;esempio Regal delle slide si usano insieme più leve: un investimento in asset (che da solo abbasserebbe il turnover) fa crescere molto le vendite e il margin.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Esempio guidato: Regal Company&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps&quot;&gt;
      &lt;div&gt;&lt;b&gt;Dati&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-27&lt;/span&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$30,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Average operating assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$200,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$500,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$470,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;Domanda: qual è il ROI di Regal?&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Margin&lt;/b&gt; = 30,000 / 500,000 = &lt;b&gt;6%&lt;/b&gt;. Ogni dollaro di vendite lascia 6 centesimi di reddito operativo.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Turnover&lt;/b&gt; = 500,000 / 200,000 = &lt;b&gt;2.5&lt;/b&gt;. Gli asset “girano” due volte e mezzo in un anno.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;ROI&lt;/b&gt; = 6% × 2.5 = &lt;b&gt;15%&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-28&lt;/span&gt;. Controllo: 30,000 / 200,000 = 15%. ✓&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Il manager investe&lt;/b&gt; $30,000 in un&#x27;attrezzatura: vendite +$35,000, costi operativi +$15,000 &lt;span class=&quot;src&quot;&gt;sl. 11-29&lt;/span&gt;.&lt;br&gt;Nuovi dati: NOI = 30,000 + 35,000 − 15,000 = &lt;b&gt;$50,000&lt;/b&gt;; asset = &lt;b&gt;$230,000&lt;/b&gt;; sales = &lt;b&gt;$535,000&lt;/b&gt;; expenses = &lt;b&gt;$485,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Nuovo ROI&lt;/b&gt; = 50,000/535,000 × 535,000/230,000 = 9.35% × 2.33 = &lt;b&gt;21.8%&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-30&lt;/span&gt;.&lt;br&gt;Il turnover è sceso (2.5 → 2.33) ma il margin è salito molto di più (6% → 9.35%). &lt;span class=&quot;small muted&quot;&gt;Nota: il calcolo diretto 50,000/230,000 dà 21.7%; il 21.8% della slide viene dall&#x27;arrotondamento dei fattori.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Criticisms of ROI&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Senza balanced scorecard non si sa come agire&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Il ROI dice &lt;i&gt;se&lt;/i&gt; le cose vanno bene, non &lt;i&gt;quali&lt;/i&gt; azioni concrete lo migliorano. La balanced scorecard collega le misure operative (clienti, processi, apprendimento) ai risultati finanziari &lt;span class=&quot;src&quot;&gt;sl. 11-31&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Costi “ereditati”&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Il manager eredita molti &lt;b&gt;committed costs&lt;/b&gt; (costi già vincolati da decisioni passate, es. impianti, contratti) che non controlla: il ROI lo giudica anche su questi, contro il controllability principle.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Si rifiutano investimenti redditizi&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Un manager valutato sul ROI può scartare progetti buoni per l&#x27;azienda se abbassano il suo ROI medio. È il problema che risolve il residual income (sotto).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;s4b&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 4 · Learning objective 2&lt;/span&gt;
  &lt;h2&gt;Residual income&lt;/h2&gt;
  &lt;p&gt;Obiettivo: calcolare il residual income e spiegarne punti di forza e di debolezza &lt;span class=&quot;src&quot;&gt;sl. 11-32&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Residual income&lt;/b&gt; (RI, reddito residuo): il net operating income che supera un rendimento minimo richiesto sugli operating assets &lt;span class=&quot;src&quot;&gt;sl. 11-33&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Residual income = Net operating income − (Average operating assets × Minimum required rate of return)&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ROI&lt;/h4&gt;Misura il reddito &lt;b&gt;in rapporto&lt;/b&gt; all&#x27;investimento: è una percentuale.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Residual income&lt;/h4&gt;Misura il reddito &lt;b&gt;meno&lt;/b&gt; il rendimento minimo richiesto sugli asset: è un importo in denaro &lt;span class=&quot;src&quot;&gt;sl. 11-34&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Il &lt;b&gt;minimum required rate of return&lt;/b&gt; (tasso minimo richiesto, o hurdle rate) rappresenta il costo opportunità del capitale: quanto l&#x27;azienda potrebbe ottenere investendo altrove con rischio simile. Un RI positivo significa che la divisione crea valore oltre quel minimo. L&#x27;EVA (economic value added) è una versione commerciale dello stesso concetto.&lt;/p&gt;

  &lt;h4&gt;Esempio: Zephyr, Inc. — Retail Division &lt;span class=&quot;src&quot;&gt;sl. 11-35/36&lt;/span&gt;&lt;/h4&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;td&gt;Operating assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$100,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;× Required rate of return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20%&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;= Minimum required return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Actual income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Minimum required return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Residual income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Motivation and residual income&lt;/b&gt;: il RI incoraggia i manager a fare investimenti redditizi che verrebbero rifiutati da manager valutati sul ROI &lt;span class=&quot;src&quot;&gt;sl. 11-37&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;sim&quot; id=&quot;risim&quot;&gt;
    &lt;h4&gt;Simulatore: il manager accetta il progetto?&lt;/h4&gt;
    &lt;p class=&quot;small muted&quot;&gt;Dati iniziali: divisione Redmond Awnings dei Quick Check (sl. 11-38 → 11-44).&lt;/p&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;NOI attuale&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iN&quot; min=&quot;10000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;60000&quot;&gt;&lt;output id=&quot;oiN&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Asset attuali&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iA&quot; min=&quot;50000&quot; max=&quot;600000&quot; step=&quot;5000&quot; value=&quot;300000&quot;&gt;&lt;output id=&quot;oiA&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Tasso minimo richiesto&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iR&quot; min=&quot;0.05&quot; max=&quot;0.30&quot; step=&quot;0.005&quot; value=&quot;0.15&quot;&gt;&lt;output id=&quot;oiR&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Investimento progetto&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;pI&quot; min=&quot;10000&quot; max=&quot;300000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;output id=&quot;opI&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;NOI aggiuntivo progetto&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;pN&quot; min=&quot;0&quot; max=&quot;80000&quot; step=&quot;1000&quot; value=&quot;18000&quot;&gt;&lt;output id=&quot;opN&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI prima&lt;/span&gt;&lt;b id=&quot;r1&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI dopo&lt;/span&gt;&lt;b id=&quot;r2&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Rendimento progetto&lt;/span&gt;&lt;b id=&quot;r3&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;RI prima&lt;/span&gt;&lt;b id=&quot;ri1&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;RI dopo&lt;/span&gt;&lt;b id=&quot;ri2&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;ribar&quot; viewBox=&quot;0 0 560 90&quot; role=&quot;img&quot; aria-label=&quot;Scala dei rendimenti con zona di conflitto&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;riv&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Punti deboli del residual income&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Le slide citano la forza del RI (sl. 11-37); il punto debole classico, trattato nel manuale di Garrison, Noreen e Brewer (da cui sembrano provenire le slide, vedi &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;), è che &lt;b&gt;non si possono confrontare divisioni di dimensioni diverse&lt;/b&gt;: essendo un importo assoluto, una divisione grande tende ad avere un RI maggiore di una piccola anche se è meno efficiente. Inoltre il risultato dipende dalla scelta, in parte arbitraria, del tasso minimo richiesto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4 &lt;span class=&quot;small muted&quot;&gt;(i Quick Check delle slide)&lt;/span&gt;&lt;/h3&gt;
    &lt;p class=&quot;small muted&quot;&gt;Redmond Awnings, divisione di Wrap-up Corp.: NOI $60,000, average operating assets $300,000, required rate of return 15%.&lt;/p&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 1 · Qual è il ROI della divisione? &lt;span class=&quot;src&quot;&gt;sl. 11-38&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;d&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;25%&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;5%&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;15%&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;20%&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;ROI = 60,000 / 300,000 = &lt;b&gt;20%&lt;/b&gt;. Il 15% è il tasso minimo, che qui non serve.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 2 · Se è valutata sul ROI, la manager vorrà fare un investimento di $100,000 che genera $18,000 di NOI in più all&#x27;anno? &lt;span class=&quot;src&quot;&gt;sl. 11-40&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Yes&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;No&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;&lt;b&gt;No&lt;/b&gt;: il progetto rende 18%, meno del 20% attuale. Il ROI della divisione scenderebbe a 78,000 / 400,000 = 19.5%.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 3 · L&#x27;azienda (tasso minimo 15%) vorrebbe che la manager facesse quell&#x27;investimento? &lt;span class=&quot;src&quot;&gt;sl. 11-42&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Yes&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;No&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;&lt;b&gt;Sì&lt;/b&gt;: il 18% supera il 15% richiesto. Ecco il conflitto tra la manager e l&#x27;azienda, cioè la terza critica al ROI.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 4 · Qual è il residual income della divisione? &lt;span class=&quot;src&quot;&gt;sl. 11-44&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;c&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$240,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$45,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$15,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;$51,000&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;RI = 60,000 − 300,000 × 15% = 60,000 − 45,000 = &lt;b&gt;$15,000&lt;/b&gt;. Con il progetto: 78,000 − 400,000 × 15% = 18,000 → il RI sale, quindi chi è valutato sul RI accetta.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;5 · Un manager vende un magazzino inutilizzato senza toccare vendite e costi. Che succede al ROI?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Gli asset scendono → il turnover sale → il ROI sale, con margin invariato.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 5 ================= --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 5 · Learning objective 3&lt;/span&gt;
  &lt;h2&gt;Transfer pricing: i prezzi tra divisioni&lt;/h2&gt;
  &lt;p&gt;Obiettivo: determinare l&#x27;intervallo, se esiste, entro cui dovrebbe cadere un &lt;b&gt;negotiated transfer price&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-48&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Transfer price&lt;/b&gt; (prezzo di trasferimento): il prezzo addebitato quando un segmento dell&#x27;azienda fornisce beni o servizi a un altro segmento della stessa azienda &lt;span class=&quot;src&quot;&gt;sl. 11-49&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Obiettivo fondamentale&lt;/b&gt;: motivare i manager ad agire nel &lt;b&gt;miglior interesse dell&#x27;azienda nel suo complesso&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-49&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; Perché conta: per l&#x27;azienda il prezzo interno è una “partita di giro” (il ricavo di chi vende è il costo di chi compra, il totale non cambia). Ma decide &lt;i&gt;come si divide il profitto&lt;/i&gt; tra le divisioni, e quindi come vengono valutati i loro manager: un prezzo sbagliato può spingerli a rifiutare scambi convenienti per il gruppo.&lt;/p&gt;

  &lt;h3&gt;I tre approcci &lt;span class=&quot;src&quot;&gt;sl. 11-50&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;1 · Negotiated&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · At cost&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Market price&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Il prezzo nasce da una &lt;b&gt;trattativa&lt;/b&gt; tra divisione venditrice (selling) e acquirente (buying) &lt;span class=&quot;src&quot;&gt;sl. 11-51&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Preserva l&#x27;autonomia&lt;/b&gt; delle divisioni, coerente con lo spirito della decentralizzazione.&lt;/div&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Usa l&#x27;informazione migliore&lt;/b&gt;: chi tratta conosce costi e benefici dello scambio meglio di chiunque altro.&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;Il &lt;b&gt;limite inferiore&lt;/b&gt; lo fissa chi vende; il &lt;b&gt;limite superiore&lt;/b&gt; lo fissa chi compra.&lt;/p&gt;
      &lt;h4&gt;Valutazione &lt;span class=&quot;src&quot;&gt;sl. 11-57&lt;/span&gt;&lt;/h4&gt;
      &lt;ul&gt;&lt;li&gt;Se lo scambio interno aumenta il profitto complessivo, esiste &lt;b&gt;sempre&lt;/b&gt; un intervallo di prezzi in cui entrambe le divisioni guadagnano.&lt;/li&gt;
      &lt;li&gt;Se i manager sono messi in competizione tra loro (invece che con la propria performance passata o con benchmark ragionevoli), si crea quasi certamente un &lt;b&gt;clima non cooperativo&lt;/b&gt;.&lt;/li&gt;
      &lt;li&gt;Viste le dispute che spesso accompagnano la trattativa, &lt;b&gt;la maggior parte delle aziende usa altri metodi&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Molte aziende fissano il prezzo al &lt;b&gt;variable cost&lt;/b&gt; (costo variabile) o al &lt;b&gt;full cost&lt;/b&gt; (costo pieno, variabile + quota di fissi) della divisione venditrice &lt;span class=&quot;src&quot;&gt;sl. 11-59&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Suboptimization&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Usare il full cost può portare a decisioni subottimali: il costo pieno include fissi che non cambiano con lo scambio, quindi l&#x27;acquirente vede un costo più alto di quello reale per il gruppo e può rifiutare scambi convenienti.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Mai un profitto&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;La divisione venditrice non mostra mai un profitto sugli scambi interni: non ha interesse a vendere dentro.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Nessun incentivo a contenere i costi&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Ogni inefficienza viene “passata” al compratore dentro il prezzo.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il &lt;b&gt;market price&lt;/b&gt; (prezzo praticato sul mercato aperto) è spesso considerato l&#x27;approccio migliore &lt;span class=&quot;src&quot;&gt;sl. 11-61&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Funziona bene&lt;/b&gt; quando il prodotto è venduto così com&#x27;è a clienti esterni e la divisione venditrice &lt;b&gt;non ha capacità inutilizzata&lt;/b&gt;: rinunciare a una vendita esterna costa esattamente il prezzo di mercato.&lt;/div&gt;
      &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Funziona male&lt;/b&gt; quando la venditrice &lt;b&gt;ha capacità inutilizzata&lt;/b&gt;: il costo reale per il gruppo è solo il costo variabile, e un prezzo di mercato alto può far rifiutare scambi convenienti.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le due formule dell&#x27;intervallo &lt;span class=&quot;src&quot;&gt;sl. 11-53&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;formula&quot; style=&quot;text-align:left&quot;&gt;
    &lt;b style=&quot;color:var(--brick)&quot;&gt;Venditore (limite inferiore)&lt;/b&gt;&lt;br&gt;
    Transfer price ≥ Variable cost per unit + &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total contribution margin on lost sales&lt;/span&gt;&lt;span&gt;Number of units transferred&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Contribution margin&lt;/b&gt; (margine di contribuzione) = prezzo − costo variabile. Le “lost sales” sono le vendite esterne a cui il venditore rinuncia per servire la divisione interna: è il suo costo opportunità.&lt;/p&gt;
  &lt;div class=&quot;formula&quot; style=&quot;text-align:left&quot;&gt;
    &lt;b style=&quot;color:var(--brick)&quot;&gt;Compratore (limite superiore)&lt;/b&gt;&lt;br&gt;
    Transfer price ≤ Cost of buying from outside supplier&lt;br&gt;
    &lt;span class=&quot;small&quot;&gt;Se non esiste un fornitore esterno: Transfer price ≤ profitto per unità venduta (escluso il transfer price)&lt;/span&gt;
  &lt;/div&gt;

  &lt;h3&gt;Caso Grocery Storehouse&lt;/h3&gt;
  &lt;p&gt;Due società controllate dalla stessa Grocery Storehouse &lt;span class=&quot;src&quot;&gt;sl. 11-52&lt;/span&gt;: &lt;b&gt;West Coast Plantations&lt;/b&gt; (venditrice: capacità 10,000 casse di arance navel al mese, costo variabile $10/cassa, costi fissi $100,000/mese, prezzo di mercato $25/cassa) e &lt;b&gt;Grocery Mart&lt;/b&gt; (compratrice: oggi paga $20/cassa a un fornitore esterno, vende 1,000 casse al mese).&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;tpsim&quot;&gt;
    &lt;h4&gt;Simulatore: quanta capacità inutilizzata ha West Coast?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Scenari delle slide:&lt;/span&gt;&lt;button class=&quot;btn on&quot; data-tpi=&quot;3000&quot;&gt;Idle capacity sufficiente (3,000)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tpi=&quot;0&quot;&gt;Nessuna (0)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tpi=&quot;500&quot;&gt;Parziale (500)&lt;/button&gt;&lt;/div&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Idle capacity (casse)&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;tI&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;3000&quot;&gt;&lt;output id=&quot;otI&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Prezzo del fornitore esterno&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;tO&quot; min=&quot;12&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;otO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;svg id=&quot;tpbar&quot; viewBox=&quot;0 0 580 130&quot; role=&quot;img&quot; aria-label=&quot;Intervallo dei prezzi di trasferimento accettabili&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Minimo venditore&lt;/span&gt;&lt;b id=&quot;tL&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Massimo compratore&lt;/span&gt;&lt;b id=&quot;tU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Guadagno del gruppo&lt;/span&gt;&lt;b id=&quot;tG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;tpv&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Part 3 · idle capacity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Part 4 · no idle capacity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Part 5 · some idle capacity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;3,000 casse libere ≥ 1,000 richieste: nessuna vendita persa &lt;span class=&quot;src&quot;&gt;sl. 11-54&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimo: $10 + $0/1,000 = &lt;b&gt;$10&lt;/b&gt;. Massimo: &lt;b&gt;$20&lt;/b&gt;. → Intervallo &lt;b&gt;$10 – $20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Nessuna capacità libera: si sacrificano 1,000 casse di vendite esterne &lt;span class=&quot;src&quot;&gt;sl. 11-55&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimo: $10 + ($25 − $10) × 1,000 / 1,000 = &lt;b&gt;$25&lt;/b&gt;. Massimo: &lt;b&gt;$20&lt;/b&gt;. → &lt;b&gt;Nessun intervallo&lt;/b&gt;. Ed è giusto così: per il gruppo conviene che West Coast venda fuori a $25 e Grocery Mart compri fuori a $20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;500 casse libere, 500 di vendite esterne sacrificate &lt;span class=&quot;src&quot;&gt;sl. 11-56&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimo: $10 + ($25 − $10) × 500 / 1,000 = &lt;b&gt;$17.50&lt;/b&gt;. Massimo: &lt;b&gt;$20&lt;/b&gt;. → Intervallo &lt;b&gt;$17.50 – $20.00&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Con 3,000 casse di idle capacity, quale prezzo di trasferimento è accettabile per entrambe le divisioni?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$8&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$15&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$22&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;L&#x27;intervallo è $10–$20: solo &lt;b&gt;$15&lt;/b&gt; ci sta. Con $8 il venditore perde, con $22 il compratore preferisce il fornitore esterno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Se West Coast avesse 200 casse libere, quale sarebbe il prezzo minimo?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Vendite perse = 1,000 − 200 = 800 casse. Minimo = 10 + 15 × 800 / 1,000 = &lt;b&gt;$22&lt;/b&gt; &amp;gt; $20 → nessun intervallo. Verificalo con il simulatore.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Perché il market price non funziona bene quando c&#x27;è idle capacity?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;Perché il vero costo per il gruppo è solo il costo variabile ($10): fissando il prezzo a $25 Grocery Mart preferirebbe il fornitore esterno a $20, e il gruppo perderebbe un risparmio di $10 a cassa (sl. 11-61).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;4. Quali sono i tre svantaggi dei prezzi di trasferimento basati sul costo?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Mostra la risposta&lt;/summary&gt;&lt;div&gt;(1) Con il full cost si rischia la suboptimization; (2) la venditrice non mostra mai profitto sugli scambi interni; (3) non c&#x27;è incentivo a controllare i costi (sl. 11-59).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 6 ================= --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Parte 6 · Learning objective 4&lt;/span&gt;
  &lt;h2&gt;Addebitare i costi dei service departments&lt;/h2&gt;
  &lt;p&gt;Obiettivo: addebitare ai reparti operativi i servizi forniti dai reparti di servizio &lt;span class=&quot;src&quot;&gt;sl. 11-62&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Operating departments&lt;/h4&gt;Svolgono il core business (es. produzione, vendita) &lt;span class=&quot;src&quot;&gt;sl. 11-63&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Service departments&lt;/h4&gt;Non svolgono direttamente attività operative: supportano gli altri (es. manutenzione, IT, mensa, personale) &lt;span class=&quot;src&quot;&gt;sl. 11-63&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Perché addebitarli &lt;span class=&quot;src&quot;&gt;sl. 11-64&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;Incoraggiare i reparti operativi a &lt;b&gt;usare con giudizio&lt;/b&gt; le risorse dei service departments.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;Dare ai reparti operativi &lt;b&gt;dati di costo più completi&lt;/b&gt; per decidere.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;Aiutare a &lt;b&gt;misurare la redditività&lt;/b&gt; dei reparti operativi.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;Creare un incentivo per i service departments a &lt;b&gt;lavorare in modo efficiente&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le regole: charging costs by behavior&lt;/h3&gt;
  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 250&quot; role=&quot;img&quot; aria-label=&quot;Schema di addebito dei costi variabili e fissi&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect x=&quot;300&quot; y=&quot;12&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Costi del service department&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;separati in variabili e fissi · a budget&lt;/text&gt;
      &lt;path d=&quot;M380,70 L210,110&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
      &lt;path d=&quot;M480,70 L650,110&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
      &lt;rect x=&quot;30&quot; y=&quot;112&quot; width=&quot;370&quot; height=&quot;124&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;rect x=&quot;460&quot; y=&quot;112&quot; width=&quot;370&quot; height=&quot;124&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;text x=&quot;48&quot; y=&quot;138&quot; font-weight=&quot;600&quot; fill=&quot;var(--accent)&quot;&gt;VARIABILI&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;162&quot;&gt;tariffa a budget × attività effettiva&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;si usa il cost driver che genera il costo&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;204&quot; fill=&quot;var(--ink2)&quot;&gt;(es. ore macchina, miglia percorse)&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;138&quot; font-weight=&quot;600&quot; fill=&quot;var(--accent)&quot;&gt;FISSI&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;162&quot;&gt;importo a budget × % di capacità richiesta&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;peak-period o long-run average needs&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;204&quot; fill=&quot;var(--ink2)&quot;&gt;importi predeterminati, stabili nel tempo&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Sintesi delle sl. 11-65 → 11-68.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details open&gt;&lt;summary&gt;Le quattro regole, una per una&lt;/summary&gt;&lt;div&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;b&gt;Separare&lt;/b&gt; i costi variabili e fissi del service department e addebitarli separatamente &lt;span class=&quot;src&quot;&gt;sl. 11-65&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;I &lt;b&gt;variabili&lt;/b&gt; si addebitano ai reparti utilizzatori in base all&#x27;attività, o &lt;b&gt;cost driver&lt;/b&gt; (fattore che causa il costo), che li genera &lt;span class=&quot;src&quot;&gt;sl. 11-66&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;I &lt;b&gt;fissi&lt;/b&gt; si assegnano in importi predeterminati, basati sui bisogni del reparto nel &lt;b&gt;peak period&lt;/b&gt; (periodo di punta) o sulla media di lungo periodo. Riflettono la capacità che ogni reparto richiede e non dovrebbero cambiare da un periodo all&#x27;altro &lt;span class=&quot;src&quot;&gt;sl. 11-67&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;Si addebitano i costi &lt;b&gt;a budget&lt;/b&gt;, non quelli effettivi &lt;span class=&quot;src&quot;&gt;sl. 11-68&lt;/span&gt;.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;integrazione&lt;/span&gt; &lt;b&gt;Perché queste regole.&lt;/b&gt; La capacità fissa (macchinari, personale) si dimensiona sui picchi di chi la usa: chi ne ha chiesto di più paga di più, a prescindere dall&#x27;uso dell&#x27;anno. Usare il &lt;i&gt;budget&lt;/i&gt; invece dei costi effettivi evita di scaricare sui reparti operativi le inefficienze del service department (che così resta responsabile dei propri sprechi, secondo il controllability principle). Per i variabili si usa però l&#x27;attività &lt;i&gt;effettiva&lt;/i&gt; del reparto utilizzatore, che quella sì dipende da lui.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Esempio guidato: Sipco&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps&quot;&gt;
      &lt;div&gt;&lt;b&gt;Dati&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-69&lt;/span&gt;: un reparto di manutenzione e due reparti operativi, Cutting e Assembly. Variabili a budget: &lt;b&gt;$0.60 per ora macchina&lt;/b&gt;. Fissi a budget: &lt;b&gt;$200,000 l&#x27;anno&lt;/b&gt;.
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Reparto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% capacità di punta&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Ore pianificate&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Ore usate&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cutting&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Assembly&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;125,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Variabili a fine anno&lt;/b&gt;: tariffa a budget × &lt;b&gt;ore effettive&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-70&lt;/span&gt;.&lt;br&gt;Cutting: $0.60 × 80,000 = &lt;b&gt;$48,000&lt;/b&gt; · Assembly: $0.60 × 40,000 = &lt;b&gt;$24,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Fissi&lt;/b&gt;: importo a budget × &lt;b&gt;% di capacità di punta&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-71&lt;/span&gt;.&lt;br&gt;Cutting: 60% × $200,000 = &lt;b&gt;$120,000&lt;/b&gt; · Assembly: 40% × $200,000 = &lt;b&gt;$80,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Totale addebitato&lt;/b&gt;: Cutting &lt;b&gt;$168,000&lt;/b&gt; · Assembly &lt;b&gt;$104,000&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-71&lt;/span&gt;.&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Nota: Assembly ha usato meno ore del previsto (40,000 contro 50,000), ma paga comunque l&#x27;intera quota fissa: la capacità era stata predisposta anche per lei.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il controesempio: Autos R Us&lt;/h3&gt;
  &lt;p&gt;Un service department e tre reparti vendita (New Cars, Used Cars, Car Parts). I costi del servizio sono $80,000 in entrambi gli anni. &lt;b&gt;Contrariamente alla buona pratica&lt;/b&gt;, l&#x27;azienda li ripartisce in base alle vendite &lt;span class=&quot;src&quot;&gt;sl. 11-77&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Ripartizione dei costi di servizio nei due anni&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;210&quot; x2=&quot;620&quot; y2=&quot;210&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;52&quot; y=&quot;214&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;134&quot;&gt;25k&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;54&quot;&gt;50k&lt;/text&gt;&lt;/g&gt;
      &lt;g stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;2 4&quot;&gt;&lt;line x1=&quot;60&quot; x2=&quot;620&quot; y1=&quot;130&quot; y2=&quot;130&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;620&quot; y1=&quot;50&quot; y2=&quot;50&quot;/&gt;&lt;/g&gt;
      &lt;g&gt;
        &lt;rect x=&quot;100&quot; y=&quot;82&quot; width=&quot;60&quot; height=&quot;128&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;165&quot; y=&quot;63.7&quot; width=&quot;60&quot; height=&quot;146.3&quot; fill=&quot;var(--accent)&quot;/&gt;
        &lt;rect x=&quot;285&quot; y=&quot;133.2&quot; width=&quot;60&quot; height=&quot;76.8&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;144.2&quot; width=&quot;60&quot; height=&quot;65.8&quot; fill=&quot;var(--accent)&quot;/&gt;
        &lt;rect x=&quot;470&quot; y=&quot;158.8&quot; width=&quot;60&quot; height=&quot;51.2&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;535&quot; y=&quot;166.1&quot; width=&quot;60&quot; height=&quot;43.9&quot; fill=&quot;var(--accent)&quot;/&gt;
      &lt;/g&gt;
