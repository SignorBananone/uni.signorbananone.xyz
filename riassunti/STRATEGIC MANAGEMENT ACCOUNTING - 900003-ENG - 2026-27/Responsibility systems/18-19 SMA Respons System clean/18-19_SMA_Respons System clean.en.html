    &lt;figcaption&gt;Data from sl. 11-78/79. New Cars sales rise from $1.5M to $2.0M; the other departments remain flat (900k and 600k).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Year 1&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Year 2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;What goes wrong&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;New&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Used&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Parts&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;% of total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Allocation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;E.g. New: 1,500,000 ÷ 3,000,000 = 50% → 50% of $80,000 = $40,000 &lt;span class=&quot;src&quot;&gt;sl. 11-78&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;New&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Used&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Parts&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,500,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;% of total sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;57%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;26%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Allocation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;45,714&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,571&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,715&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;New: 2,000,000 ÷ 3,500,000 ≈ 57% → $45,714 &lt;span class=&quot;src&quot;&gt;sl. 11-79&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The New Cars manager would complain, and rightly so &lt;span class=&quot;src&quot;&gt;sl. 11-79&lt;/span&gt;: they sold more, did not use more services, and their charge rises by $5,714. Used and Parts see their charges fall without having done anything.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Sales are not the service department&#x27;s cost driver. As a result, a department&#x27;s charge depends on the performance &lt;i&gt;of the other departments&lt;/i&gt;, which violates the controllability principle and penalizes the best performers. The solution is to apply the rules above: variable costs based on actual use of the service, fixed costs based on the capacity required, everything at budgeted amounts.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 6&lt;/h3&gt;
    &lt;p class=&quot;small muted&quot;&gt;Foster City &lt;span class=&quot;src&quot;&gt;sl. 11-72&lt;/span&gt;: an ambulance service used by two public hospitals. Budgeted variable costs $4.20 per mile; budgeted fixed costs $120,000 per year. Mercy: 45% of peak capacity, 15,000 miles planned, 16,000 used. Northside: 55%, 17,000 planned, 17,500 used.&lt;/p&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 1a · How much cost will be charged to Mercy Hospital at the &lt;b&gt;end&lt;/b&gt; of the year? &lt;span class=&quot;src&quot;&gt;sl. 11-73&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$121,200&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$254,400&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$139,500&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;$117,000&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;Variable: $4.20 × 16,000 &lt;i&gt;actual&lt;/i&gt; miles = $67,200. Fixed: 45% × $120,000 = $54,000. Total &lt;b&gt;$121,200&lt;/b&gt;. ($117,000 is the beginning-of-year amount, calculated on planned miles.)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2 · And how much would have been expected for Mercy at the &lt;b&gt;beginning&lt;/b&gt; of the year?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; $4.20 × 15,000 planned miles = $63,000 + $54,000 = &lt;b&gt;$117,000&lt;/b&gt;. The fixed portion does not change; only the variable portion does.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3 · How much does Northside pay at year-end?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;$4.20 × 17,500 = $73,500 + 55% × $120,000 = $66,000 → &lt;b&gt;$139,500&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;4 · Why are budgeted costs charged rather than actual costs?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;To avoid passing the service department&#x27;s inefficiencies on to operating departments: the manager of the service department remains responsible for the difference between actual and budgeted costs (sl. 11-68).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= FONTI ================= --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Texts, studies and standards&lt;/h2&gt;
  &lt;p&gt;The slides explicitly cite only the balanced scorecard and lecture #4. The other entries are related to the topics and are labelled as such. Entries marked &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; report information and links found through a web search and should be verified.&lt;/p&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· probable origin of the slides&lt;/span&gt;
    &lt;h4&gt;R. H. Garrison, E. W. Noreen, P. C. Brewer — &lt;i&gt;Managerial Accounting&lt;/i&gt; (McGraw-Hill)&lt;/h4&gt;
    &lt;p&gt;A widely used managerial accounting textbook. In the 14th edition (2012), chapter 11 is titled “Performance Measurement in Decentralized Organizations”: this matches the “11-xx” numbering of the slides, and the double numbering “16-35/36/37” on the Norton tables suggests the chapter on financial statement analysis. It covers ROI, residual income, transfer pricing and service department charging in full, with exercises. Chapter numbering varies between editions.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://highered.mheducation.com/sites/0027162757/information_center_view0/table_of_contents.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Table of contents of one edition on the McGraw-Hill website&lt;/a&gt; · &lt;a href=&quot;https://www.mheducation.com/highered/product/introduction-managerial-accounting-2024-release-brewer-garrison/M9781266540851.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Introduction to Managerial Accounting, 2024 release (same authors)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· cited in the slides (sl. 11-31)&lt;/span&gt;
    &lt;h4&gt;R. S. Kaplan, D. P. Norton — “The Balanced Scorecard: Measures That Drive Performance”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, Jan.-Feb. 1992, pp. 71-79&lt;/h4&gt;
    &lt;p&gt;The article that introduced the balanced scorecard: alongside financial measures it adds three operational perspectives (customer, internal processes, innovation and learning) that “drive” them. It is relevant to this lecture because it answers the first criticism of ROI: it indicates &lt;i&gt;which levers&lt;/i&gt; to pull in order to improve it.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary of the article (Management And Accounting Web)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Balanced_scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Balanced scorecard” entry (Wikipedia)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· related, not cited&lt;/span&gt;
    &lt;h4&gt;D. Solomons — &lt;i&gt;Divisional Performance: Measurement and Control&lt;/i&gt; (Financial Executives Research Foundation / Irwin, 1965)&lt;/h4&gt;
    &lt;p&gt;A classic study on measuring divisional performance. Solomons is credited with proposing residual income as a way to evaluate an investment center and its manager separately. Useful for understanding the origins of the ROI / RI contrast in part 4.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA01277273&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bibliographic record (CiNii)&lt;/a&gt; · &lt;a href=&quot;https://link.springer.com/chapter/10.1007/978-1-4899-7138-8_17&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Residual income” entry (Springer)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· related study material&lt;/span&gt;
    &lt;h4&gt;ACCA — technical article “Performance measurement”&lt;/h4&gt;
    &lt;p&gt;ACCA exam material covering divisional performance measures such as ROI and residual income (defined as controllable profit minus an imputed interest charge on controllable investment). Useful for practising with a slightly different approach from the textbook&#x27;s.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.accaglobal.com/uk/en/student/exam-support-resources/fundamentals-exams-study-resources/f5/technical-articles/performance-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;accaglobal.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· regulations on financial statements (the slides only state that they are mandatory)&lt;/span&gt;
    &lt;h4&gt;Italian Civil Code, art. 2423 et seq. — Preparation of the financial statements&lt;/h4&gt;
    &lt;p&gt;In Italy, directors must prepare the annual financial statements (balance sheet, income statement, cash flow statement and notes), which must give a true and fair view of the company&#x27;s financial position and results. Articles 2424 and 2425 set out the formats of the balance sheet and income statement: they are the Italian equivalent of the balance sheet and income statement in part 3.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2423.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2423 of the Civil Code (Brocardi.it)&lt;/a&gt;&lt;/p&gt;
    &lt;h4&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; (replaces IAS 1)&lt;/h4&gt;
    &lt;p&gt;The international accounting standard on the presentation of financial statements, issued by the IASB in April 2024 and effective for annual periods beginning on or after 1 January 2027. It introduces a mandatory &lt;i&gt;operating profit&lt;/i&gt; subtotal in the income statement, close to the net operating income used for ROI.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://cdn.ifrs.org/projects/projects/primary-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project page (IFRS Foundation)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;small muted&quot;&gt;· related, not cited&lt;/span&gt;
    &lt;h4&gt;OECD — &lt;i&gt;Transfer Pricing Guidelines for Multinational Enterprises and Tax Administrations&lt;/i&gt; (2022 ed.)&lt;/h4&gt;
    &lt;p&gt;The international guidelines on &lt;i&gt;tax&lt;/i&gt; transfer pricing between companies of the same group in different countries, based on the &lt;b&gt;arm&#x27;s length principle&lt;/b&gt;: the internal price should be the one two independent enterprises would pay. Note the difference from this lecture: here the price serves to motivate managers, there to allocate the tax base correctly between countries. The arm&#x27;s length criterion does, however, resemble the market price approach.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://oecd-ilibrary.org/taxation/oecd-transfer-pricing-guidelines-for-multinational-enterprises-and-tax-administrations-2022_02d2274c-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD iLibrary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;bib&quot; style=&quot;border-color:var(--ochre)&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;from the course&lt;/span&gt;
    &lt;h4&gt;Lecture #4 — Corporate governance&lt;/h4&gt;
    &lt;p&gt;Cited on sl. 5-2 as the other side of delegation (stockholders → top managers). I was unable to open the other files in the &lt;em&gt;corso/&lt;/em&gt; folder: review that lecture for the first link in the chain of delegation.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;
