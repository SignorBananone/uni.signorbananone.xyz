*{box-sizing:border-box}

        &lt;a href=&quot;#s6&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;736&quot; y=&quot;192&quot; width=&quot;166&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot;/&gt;
          &lt;text x=&quot;819&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;6 · Service&lt;/text&gt;&lt;text x=&quot;819&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;departments&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#fonti&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;246&quot; y=&quot;292&quot; width=&quot;446&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.4&quot;/&gt;
          &lt;text x=&quot;469&quot; y=&quot;319&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;Further reading · related texts, studies and standards&lt;/text&gt;&lt;/a&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;The logical thread: authority is delegated (1) → each manager is held responsible only for what they control (2) → centers with invested capital require financial statement data (3) and measures such as ROI and residual income (4) → segments exchange goods with one another (5) and consume shared services (6), which must be priced without distorting incentives.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
&lt;!-- ================= 1 ================= --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 1&lt;/span&gt;
  &lt;h2&gt;Delegation: why organizations decentralize&lt;/h2&gt;
  &lt;p&gt;The starting point of the lecture &lt;span class=&quot;src&quot;&gt;sl. 5-2&lt;/span&gt;: except in very small organizations, owners and top managers &lt;b&gt;must delegate&lt;/b&gt; decision-making authority. Delegation occurs at two levels, and each level is matched by a different control system.&lt;/p&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Chain of delegation: owners, top managers, subordinates&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;15&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;115&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Owners&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;e.g. stockholders&lt;/text&gt;
        &lt;rect x=&quot;335&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;430&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Top managers&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;senior management&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;745&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;Subordinates&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;118&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;lower-level managers&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;&gt;&lt;path d=&quot;M212,100 L331,100&quot;/&gt;&lt;path d=&quot;M527,100 L646,100&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;
        &lt;text x=&quot;272&quot; y=&quot;44&quot;&gt;delegation&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;170&quot;&gt;Corporate governance&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;187&quot; font-weight=&quot;400&quot; fill=&quot;var(--ink2)&quot;&gt;(lecture #4)&lt;/text&gt;
        &lt;text x=&quot;587&quot; y=&quot;44&quot;&gt;delegation&lt;/text&gt;&lt;text x=&quot;587&quot; y=&quot;170&quot;&gt;Management control&lt;/text&gt;&lt;text x=&quot;587&quot; y=&quot;187&quot; fill=&quot;var(--sage)&quot;&gt;systems&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Source: sl. 5-2. This lecture concerns the second link: how top managers direct and control their subordinates.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Decentralized organization&lt;/b&gt;: decision-making authority is spread throughout the organization rather than being confined to a few top executives &lt;span class=&quot;src&quot;&gt;sl. 5-2&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Corporate governance&lt;/b&gt; = the set of rules and mechanisms through which owners direct and control top managers (the subject of lecture #4 of the course, referenced on the slide). &lt;b&gt;Management control systems&lt;/b&gt; = the tools (budgets, performance measures, incentives) through which top managers steer the actions of their subordinates.&lt;/p&gt;

  &lt;h3&gt;Advantages and disadvantages&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Benefits&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Disadvantages&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The common thread&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Top management freed to concentrate on strategy&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Day-to-day operating decisions are passed to others.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Decisions based on better information&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Those “in the field” know local customers, costs and problems.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Quicker response to customers&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Requests do not have to travel up the hierarchy.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Lower-level managers gain experience&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;The next generation of executives is developed.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Greater job satisfaction&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Having decision-making authority is motivating.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-4&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Lack of a “big picture” view&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Decisions consider only the manager&#x27;s own segment.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Misaligned objectives&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;The manager&#x27;s objectives may differ from those of the company.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Poor coordination&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Among autonomous managers.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Innovations are hard to spread&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;A good idea stays locked inside one department.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-5&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Almost all of the disadvantages share the same root: a &lt;b&gt;goal congruence&lt;/b&gt; problem (alignment between the individual&#x27;s objectives and those of the company). The rest of the lecture is the response: measure each manager &lt;i&gt;only on what they control&lt;/i&gt; (part 2), with indicators that do not push them towards choices harmful to the whole (ROI vs residual income, part 4), and set internal prices and charges that lead them to act “in the best interests of the company as a whole” (parts 5 and 6).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Through which system do stockholders control top managers, and through which do top managers control subordinates?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Stockholders → top managers: &lt;b&gt;corporate governance systems&lt;/b&gt;. Top managers → subordinates: &lt;b&gt;management control systems&lt;/b&gt; (sl. 5-2).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Which of the following is a &lt;u&gt;disadvantage&lt;/u&gt; of decentralization?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Decisions based on better information&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Manager&#x27;s objectives differ from the company&#x27;s&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Top management freed for strategy&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;The other two are benefits (sl. 11-4); misaligned objectives are a disadvantage (sl. 11-5).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Why would people at the lower levels have “better information”?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Because they are close to customers, processes and local markets: they know details that reach the top late, filtered, or not at all. This is also why delegation speeds up the response to customers.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 2 ================= --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 2&lt;/span&gt;
  &lt;h2&gt;Responsibility accounting and responsibility centers&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility accounting&lt;/b&gt;: managers are held accountable for those items, and &lt;i&gt;only&lt;/i&gt; those items, over which they can exert significant control &lt;span class=&quot;src&quot;&gt;sl. 11-6&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;This is known as the &lt;b&gt;controllability principle&lt;/b&gt;: it would be unfair, and demotivating, to judge a department head on a cost decided by headquarters or on a selling price they cannot influence.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility center&lt;/b&gt;: any part of the organization whose manager has control over, and is accountable for, &lt;b&gt;cost, profit or investments&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-6&lt;/span&gt;.&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Three types of responsibility centers, nested one inside another&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;560&quot; height=&quot;260&quot; rx=&quot;22&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;45&quot; y=&quot;70&quot; width=&quot;380&quot; height=&quot;190&quot; rx=&quot;18&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;rect x=&quot;70&quot; y=&quot;120&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;g font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;
        &lt;text x=&quot;40&quot; y=&quot;50&quot; fill=&quot;var(--slate)&quot;&gt;Investment center&lt;/text&gt;
        &lt;text x=&quot;65&quot; y=&quot;98&quot; fill=&quot;var(--ochre)&quot;&gt;Profit center&lt;/text&gt;
        &lt;text x=&quot;88&quot; y=&quot;146&quot; fill=&quot;var(--sage)&quot;&gt;Cost center&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;
        &lt;text x=&quot;88&quot; y=&quot;176&quot;&gt;controls: costs&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;196&quot;&gt;measure: costs vs&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;214&quot;&gt;budget / standard&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;150&quot;&gt;+ revenues&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;172&quot;&gt;measure:&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;190&quot;&gt;segment&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;208&quot;&gt;profit&lt;/text&gt;
        &lt;text x=&quot;445&quot; y=&quot;120&quot;&gt;+ investments&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;138&quot;&gt;in operating&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;156&quot;&gt;assets&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;186&quot;&gt;measure:&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;204&quot;&gt;ROI, residual&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;222&quot;&gt;income&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;text x=&quot;610&quot; y=&quot;60&quot; font-weight=&quot;600&quot;&gt;Who controls what&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;122&quot; fill=&quot;var(--sage)&quot; font-weight=&quot;600&quot;&gt;Cost&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;122&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;122&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;122&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;152&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot;&gt;Profit&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;152&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;152&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;152&quot; fill=&quot;var(--ink2)&quot;&gt;✗&lt;/text&gt;
        &lt;text x=&quot;610&quot; y=&quot;182&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;Investment&lt;/text&gt;&lt;text x=&quot;718&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;768&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;&lt;text x=&quot;822&quot; y=&quot;182&quot;&gt;✓&lt;/text&gt;
        &lt;text x=&quot;700&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Costs&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Revenue&lt;/text&gt;&lt;text x=&quot;806&quot; y=&quot;92&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;Invest.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The three types of responsibility center (sl. 11-7 → 11-10): each level adds an area of control. The “measure” entries are a &lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; anticipating part 4.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Cost center&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Profit center&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Definition&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-8&lt;/span&gt;: a segment whose manager has control over &lt;b&gt;costs&lt;/b&gt;, but not over revenues or investment funds.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Examples: a production department, maintenance, IT, accounting. It is evaluated by comparing actual costs with budgeted or standard costs: a good cost center delivers the required output at minimum cost.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Definition&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-9&lt;/span&gt;: a segment whose manager has control over &lt;b&gt;both costs and revenues&lt;/b&gt;, but not over investment funds.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Revenues&lt;/h4&gt;Sales · Interest · Other&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;Mfg. costs (manufacturing costs) · Commissions · Salaries · Other&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Examples: a store in a retail chain, a product line. It is evaluated on profit, compared with the budget.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Definition&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-10&lt;/span&gt;: a segment whose manager has control over &lt;b&gt;costs, revenues and investments in operating assets&lt;/b&gt; (plant, inventory, receivables…).&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Examples: a division with its own investment autonomy, a subsidiary. Profit alone is not enough: a division earning 100 on an investment of 1,000 is not worth as much as one earning 100 on an investment of 200. Measures relating income to capital are needed: &lt;a href=&quot;#s4&quot;&gt;ROI&lt;/a&gt; and &lt;a href=&quot;#s4b&quot;&gt;residual income&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. A store manager sets prices, product range and staffing, but cannot open new stores or buy equipment. What type of center is this?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Cost center&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Profit center&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;The manager controls costs and revenues but not investments → &lt;b&gt;profit center&lt;/b&gt; (sl. 11-9).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Should the production manager be evaluated on a factory rent increase decided by headquarters?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;No: under the controllability principle, managers are accountable only for what they can significantly control (sl. 11-6). That cost should be attributed to whoever decided it.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Why is profit alone insufficient for evaluating an investment center?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Because the manager also decides how much capital to employ: profit must be judged &lt;i&gt;relative to&lt;/i&gt; the assets used (ROI) or net of a minimum required return on those assets (residual income).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 3 ================= --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 3&lt;/span&gt;
  &lt;h2&gt;Review: the financial statements&lt;/h2&gt;
  &lt;p&gt;Computing ROI requires two figures taken from two different documents: an &lt;i&gt;income&lt;/i&gt; figure (from the income statement) and an &lt;i&gt;invested capital&lt;/i&gt; figure (from the balance sheet). The slides therefore include a brief review &lt;span class=&quot;src&quot;&gt;sl. 12 → 11-20&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial statement (FS)&lt;/b&gt;: a mandatory set of documents that companies prepare every year. It comprises two main accounting documents: the &lt;b&gt;income statement&lt;/b&gt; (IS) and the &lt;b&gt;balance sheet&lt;/b&gt; (BS).&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;

      &lt;text x=&quot;130&quot; y=&quot;222&quot; font-weight=&quot;600&quot;&gt;Net income&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;240&quot; font-size=&quot;12&quot;&gt;(profit)&lt;/text&gt;
      &lt;text x=&quot;270&quot; y=&quot;140&quot;&gt;Positive items&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;158&quot;&gt;of income (revenues)&lt;/text&gt;&lt;/g&gt;

      &lt;rect x=&quot;630&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;140&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;rect x=&quot;630&quot; y=&quot;180&quot; width=&quot;160&quot; height=&quot;80&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot;&gt;&lt;text x=&quot;550&quot; y=&quot;146&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;&lt;text x=&quot;550&quot; y=&quot;164&quot; font-size=&quot;12&quot;&gt;uses of funds&lt;/text&gt;

      &lt;text x=&quot;710&quot; y=&quot;216&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;710&quot; y=&quot;234&quot; font-size=&quot;12&quot;&gt;owners&#x27; equity&lt;/text&gt;&lt;/g&gt;

      &lt;text x=&quot;420&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;the year&#x27;s net income flows into equity&lt;/text&gt;

    &lt;figcaption&gt;Reconstruction of the diagrams on sl. 12-13. Underlying identities &lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt;: &lt;b&gt;Assets = Liabilities + Equity&lt;/b&gt;; and &lt;b&gt;Net income = revenues − costs&lt;/b&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;To assess the company&#x27;s health, the financial statements are &lt;b&gt;“analysed”&lt;/b&gt; (reclassified): BS and IS items are rearranged so as to extract more information about the company and its performance &lt;span class=&quot;src&quot;&gt;sl. 14&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;The main items&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Assets — uses of funds (sl. 15)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Cash and cash equivalent&lt;/b&gt;: cash on hand and in current and savings accounts. &lt;b&gt;Account receivables&lt;/b&gt; (trade receivables): amounts owed by customers for goods or services already delivered. &lt;b&gt;Inventories&lt;/b&gt;: goods in stock available for sale. &lt;b&gt;Property, plant and equipment&lt;/b&gt; (tangible fixed assets): assets that cannot quickly be converted into cash (computers, cars, plant). &lt;b&gt;Securities&lt;/b&gt;: bonds, shares or stakes in other companies acquired for investment purposes.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Securities are usually &lt;i&gt;not&lt;/i&gt; operating assets: they do not serve the core business. This is why they are excluded from ROI (see part 4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Liabilities — debts (sl. 17)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Bank overdraft&lt;/b&gt;: funds withdrawn in excess of the account balance, often to pay suppliers. &lt;b&gt;Account payable&lt;/b&gt; (trade payables): amounts owed for goods or services already received. &lt;b&gt;Note payable&lt;/b&gt;: an obligation to repay a borrowed sum at a future date. &lt;b&gt;Severance provisions&lt;/b&gt; (employee benefit liabilities; in Italy, the TFR): an obligation towards employees, paid when the employment relationship ends. &lt;b&gt;Long term borrowings&lt;/b&gt;: debts to lenders (e.g. a bank mortgage) repayable after more than 12 months.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Equity — owners&#x27; equity (sl. 18)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Share capital&lt;/b&gt;: the amount invested by the owners. &lt;b&gt;Retained earnings&lt;/b&gt; (or reserves): the sum of profits over the company&#x27;s life not distributed as &lt;b&gt;dividends&lt;/b&gt; (dividends are distributions of profit). &lt;b&gt;Net income&lt;/b&gt;: the difference between positive and negative items of income (profit or loss).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Par value&lt;/b&gt; = the nominal value of a share. &lt;b&gt;APIC&lt;/b&gt; (additional paid-in capital, share premium): the amount an investor pays in excess of par value &lt;span class=&quot;src&quot;&gt;sl. 11-19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The Norton Corporation case&lt;/h3&gt;
  &lt;p&gt;The slides present the financial statements of a sample company over two years. Browse the tabs.&lt;/p&gt;

    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-16 · amounts in $&lt;/p&gt;&lt;/div&gt;

    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;sl. 11-19&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;494,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;450,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;127,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;354,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;323,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;270,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;249,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income &lt;span class=&quot;small muted&quot;&gt;(≈ EBIT)&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;84,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;74,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,300&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;Net income before taxes&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;76,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Less income taxes (30%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23,010&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19,800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$53,690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$46,200&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Gross margin&lt;/b&gt; = revenues − cost of goods sold (product cost only, excluding selling and administrative expenses). &lt;b&gt;Interest expense&lt;/b&gt; = the cost of financial resources &lt;span class=&quot;src&quot;&gt;sl. 11-20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Three calculations not shown on the slides that help to “read” the figures:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Dividends paid&lt;/b&gt;: opening RE 50,000 + net income 53,690 − closing RE 48,890 = &lt;b&gt;$54,800&lt;/b&gt;. Norton distributed more than the year&#x27;s profit, which is why retained earnings decline.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Capital increase&lt;/b&gt;: common stock +10,400 (10,400 new shares at $1 par value) and APIC +45,100 → &lt;b&gt;$55,500&lt;/b&gt; raised, roughly $5.34 per share.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Norton&#x27;s ROI&lt;/b&gt; (preview of part 4): average operating assets = (346,390 + 300,000) / 2 = 323,195; ROI = 84,000 / 323,195 ≈ &lt;b&gt;26.0%&lt;/b&gt;, i.e. margin 17.0% × turnover 1.53. For simplicity, all assets are treated as operating here; try the case in the &lt;a href=&quot;#roisim&quot;&gt;simulator&lt;/a&gt;.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. In which document do you find net operating income, and in which the operating assets?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Net operating income → &lt;b&gt;income statement&lt;/b&gt; (it is a flow over the year). Operating assets → &lt;b&gt;balance sheet&lt;/b&gt; (a stock at a given date). This is why ROI uses the &lt;i&gt;average&lt;/i&gt; of beginning- and end-of-year assets.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. A customer has yet to pay an invoice: where does the amount appear?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Accounts receivable&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Accounts payable&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Retained earnings&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;It is an amount owed by a customer → &lt;b&gt;accounts receivable&lt;/b&gt;, among the assets (sl. 15). Accounts payable are amounts owed to suppliers.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Norton: verify that this year&#x27;s balance sheet “balances”.&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Liabilities 112,000 + equity 234,390 = 346,390 = total assets. ✓&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 4 ================= --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 4 · Learning objective 1&lt;/span&gt;
  &lt;h2&gt;Return on investment (ROI)&lt;/h2&gt;
  &lt;p&gt;Objective: compute ROI and understand how it is affected by sales, expenses and assets &lt;span class=&quot;src&quot;&gt;sl. 11-11&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;ROI&lt;/b&gt; (return on investment): compares the operating income generated with the operating assets employed. It is a measure of &lt;b&gt;profitability&lt;/b&gt;: it shows whether the company can generate income from its operating assets, i.e. &lt;i&gt;“is the core business going well?”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-21&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;ROI = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Net operating income&lt;/h4&gt;= &lt;b&gt;EBIT&lt;/b&gt;, earnings before interest and taxes &lt;span class=&quot;src&quot;&gt;sl. 11-22&lt;/span&gt;. &lt;span class=&quot;small muted&quot;&gt;Interest and taxes are excluded because they depend on how the company is financed and on taxation, not on operating management.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Average operating assets&lt;/h4&gt;Cash, accounts receivable, inventory, plant and equipment and other productive assets &lt;span class=&quot;src&quot;&gt;sl. 11-22&lt;/span&gt;. &lt;span class=&quot;small muted&quot;&gt;The average of beginning and end of period, because income accrues throughout the year. Non-operating assets (land held for future use, investments in other companies) are excluded.&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The decomposition: margin × turnover&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;
    Margin = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;/span&gt;
    &amp;nbsp;&amp;nbsp; Turnover = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;br&gt;&lt;br&gt;
    &lt;b&gt;ROI = Margin × Turnover&lt;/b&gt;
  &lt;/div&gt;
  &lt;p&gt;Sales cancel out: it is the same ROI fraction, split in two &lt;span class=&quot;src&quot;&gt;sl. 11-24&lt;/span&gt;. &lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; This is known as the DuPont formula.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Margin&lt;/h4&gt;The ability to generate operating income (revenues − operating expenses) from sales &lt;span class=&quot;src&quot;&gt;sl. 11-25&lt;/span&gt;. How many cents remain from each dollar of sales.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Turnover&lt;/h4&gt;Efficiency in the use of operating assets: how many times per year the assets are “used” to generate sales &lt;span class=&quot;src&quot;&gt;sl. 11-26&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; The same ROI can be achieved with opposite strategies: a jewellery store (high margin, low turnover) and a discount grocery store (low margin, high turnover) may both earn a 15% ROI. The chart below illustrates this: each curve represents a “constant ROI”.&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;roisim&quot;&gt;
    &lt;h4&gt;Simulator: adjust sales, expenses and assets&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Cases:&lt;/span&gt;&lt;button class=&quot;btn on&quot; data-roip=&quot;500000,470000,200000&quot;&gt;Regal, base&lt;/button&gt;&lt;button class=&quot;btn&quot; data-roip=&quot;535000,485000,230000&quot;&gt;Regal, after the investment&lt;/button&gt;&lt;button class=&quot;btn&quot; data-roip=&quot;494000,410000,323000&quot;&gt;Norton, this year&lt;/button&gt;&lt;/div&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rS&quot; min=&quot;100000&quot; max=&quot;1000000&quot; step=&quot;1000&quot; value=&quot;500000&quot;&gt;&lt;output id=&quot;oS&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Operating expenses&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rE&quot; min=&quot;50000&quot; max=&quot;1000000&quot; step=&quot;1000&quot; value=&quot;470000&quot;&gt;&lt;output id=&quot;oE&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;rA&quot; min=&quot;50000&quot; max=&quot;600000&quot; step=&quot;1000&quot; value=&quot;200000&quot;&gt;&lt;output id=&quot;oA&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Net op. income&lt;/span&gt;&lt;b id=&quot;kN&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Margin&lt;/span&gt;&lt;b id=&quot;kM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Turnover&lt;/span&gt;&lt;b id=&quot;kT&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI&lt;/span&gt;&lt;b id=&quot;kR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;roichart&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Chart of margin against turnover with constant-ROI curves&quot;&gt;
      &lt;g id=&quot;rcAxes&quot;&gt;&lt;/g&gt;&lt;g id=&quot;rcCurves&quot;&gt;&lt;/g&gt;
      &lt;circle id=&quot;rcDot&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;small muted&quot;&gt;x-axis: turnover (0–4 times). y-axis: margin (0–25%). The dot is your company; the curves are combinations yielding the same ROI. For “Norton”, operating expenses include cost of goods sold (140,000 + 270,000) and assets are the rounded average.&lt;/p&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;The three levers for increasing ROI&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; The formula shows that ROI increases if:&lt;/p&gt;
    &lt;ol&gt;&lt;li&gt;&lt;b&gt;sales increase&lt;/b&gt;: turnover rises; and if part of the costs is fixed, margin rises too (operating leverage);&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;operating expenses decrease&lt;/b&gt;: margin rises;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;operating assets decrease&lt;/b&gt; (less inventory, receivables collected sooner, idle plant sold): turnover rises.&lt;/li&gt;&lt;/ol&gt;
    &lt;p&gt;The Regal example on the slides uses several levers together: an investment in assets (which on its own would lower turnover) leads to a large increase in sales and margin.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Worked example: Regal Company&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps&quot;&gt;
      &lt;div&gt;&lt;b&gt;Data&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-27&lt;/span&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$30,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Average operating assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$200,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$500,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$470,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;Question: what is Regal&#x27;s ROI?&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Margin&lt;/b&gt; = 30,000 / 500,000 = &lt;b&gt;6%&lt;/b&gt;. Each dollar of sales leaves 6 cents of operating income.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Turnover&lt;/b&gt; = 500,000 / 200,000 = &lt;b&gt;2.5&lt;/b&gt;. The assets “turn over” two and a half times a year.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;ROI&lt;/b&gt; = 6% × 2.5 = &lt;b&gt;15%&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-28&lt;/span&gt;. Check: 30,000 / 200,000 = 15%. ✓&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;The manager invests&lt;/b&gt; $30,000 in equipment: sales +$35,000, operating expenses +$15,000 &lt;span class=&quot;src&quot;&gt;sl. 11-29&lt;/span&gt;.&lt;br&gt;New data: NOI = 30,000 + 35,000 − 15,000 = &lt;b&gt;$50,000&lt;/b&gt;; assets = &lt;b&gt;$230,000&lt;/b&gt;; sales = &lt;b&gt;$535,000&lt;/b&gt;; expenses = &lt;b&gt;$485,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;New ROI&lt;/b&gt; = 50,000/535,000 × 535,000/230,000 = 9.35% × 2.33 = &lt;b&gt;21.8%&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-30&lt;/span&gt;.&lt;br&gt;Turnover has fallen (2.5 → 2.33) but margin has risen considerably more (6% → 9.35%). &lt;span class=&quot;small muted&quot;&gt;Note: the direct calculation 50,000/230,000 gives 21.7%; the slide&#x27;s 21.8% results from rounding the factors.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Criticisms of ROI&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Without a balanced scorecard, managers do not know how to act&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;ROI tells &lt;i&gt;whether&lt;/i&gt; things are going well, not &lt;i&gt;which&lt;/i&gt; concrete actions will improve it. The balanced scorecard links operational measures (customers, processes, learning) to financial results &lt;span class=&quot;src&quot;&gt;sl. 11-31&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;“Inherited” costs&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;The manager inherits many &lt;b&gt;committed costs&lt;/b&gt; (costs locked in by past decisions, e.g. plant, contracts) that they do not control: ROI judges them on these too, contrary to the controllability principle.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Profitable investments are rejected&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;A manager evaluated on ROI may reject projects that are good for the company if they lower the manager&#x27;s average ROI. This is the problem that residual income solves (below).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;s4b&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 4 · Learning objective 2&lt;/span&gt;
  &lt;h2&gt;Residual income&lt;/h2&gt;
  &lt;p&gt;Objective: compute residual income and explain its strengths and weaknesses &lt;span class=&quot;src&quot;&gt;sl. 11-32&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Residual income&lt;/b&gt; (RI): the net operating income that an investment center earns above the minimum required return on its operating assets &lt;span class=&quot;src&quot;&gt;sl. 11-33&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Residual income = Net operating income − (Average operating assets × Minimum required rate of return)&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ROI&lt;/h4&gt;Measures income &lt;b&gt;relative to&lt;/b&gt; investment: it is a percentage.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Residual income&lt;/h4&gt;Measures income &lt;b&gt;minus&lt;/b&gt; the minimum required return on assets: it is a monetary amount &lt;span class=&quot;src&quot;&gt;sl. 11-34&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; The &lt;b&gt;minimum required rate of return&lt;/b&gt; (or hurdle rate) represents the opportunity cost of capital: what the company could earn by investing elsewhere at similar risk. A positive RI means the division creates value above that minimum. EVA (economic value added) is a commercial version of the same concept.&lt;/p&gt;

  &lt;h4&gt;Example: Zephyr, Inc. — Retail Division &lt;span class=&quot;src&quot;&gt;sl. 11-35/36&lt;/span&gt;&lt;/h4&gt;
  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;td&gt;Operating assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$100,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;× Required rate of return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20%&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;= Minimum required return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Actual income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$30,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;− Minimum required return&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Residual income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Motivation and residual income&lt;/b&gt;: RI encourages managers to make profitable investments that would be rejected by managers evaluated on ROI &lt;span class=&quot;src&quot;&gt;sl. 11-37&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;sim&quot; id=&quot;risim&quot;&gt;
    &lt;h4&gt;Simulator: does the manager accept the project?&lt;/h4&gt;
    &lt;p class=&quot;small muted&quot;&gt;Initial data: the Redmond Awnings division from the Quick Checks (sl. 11-38 → 11-44).&lt;/p&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Current NOI&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iN&quot; min=&quot;10000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;60000&quot;&gt;&lt;output id=&quot;oiN&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Current assets&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iA&quot; min=&quot;50000&quot; max=&quot;600000&quot; step=&quot;5000&quot; value=&quot;300000&quot;&gt;&lt;output id=&quot;oiA&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Minimum required rate&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;iR&quot; min=&quot;0.05&quot; max=&quot;0.30&quot; step=&quot;0.005&quot; value=&quot;0.15&quot;&gt;&lt;output id=&quot;oiR&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Project investment&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;pI&quot; min=&quot;10000&quot; max=&quot;300000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;output id=&quot;opI&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Additional project NOI&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;pN&quot; min=&quot;0&quot; max=&quot;80000&quot; step=&quot;1000&quot; value=&quot;18000&quot;&gt;&lt;output id=&quot;opN&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI before&lt;/span&gt;&lt;b id=&quot;r1&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI after&lt;/span&gt;&lt;b id=&quot;r2&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Project return&lt;/span&gt;&lt;b id=&quot;r3&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;RI before&lt;/span&gt;&lt;b id=&quot;ri1&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;RI after&lt;/span&gt;&lt;b id=&quot;ri2&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;ribar&quot; viewBox=&quot;0 0 560 90&quot; role=&quot;img&quot; aria-label=&quot;Scale of returns with conflict zone&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;riv&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Weaknesses of residual income&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; The slides mention the strength of RI (sl. 11-37); the classic weakness, discussed in the textbook by Garrison, Noreen and Brewer (which the slides appear to be based on, see &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;), is that &lt;b&gt;divisions of different sizes cannot be compared&lt;/b&gt;: since RI is an absolute amount, a large division tends to have a higher RI than a small one even if it is less efficient. Moreover, the result depends on the partly arbitrary choice of the minimum required rate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4 &lt;span class=&quot;small muted&quot;&gt;(the Quick Checks from the slides)&lt;/span&gt;&lt;/h3&gt;
    &lt;p class=&quot;small muted&quot;&gt;Redmond Awnings, a division of Wrap-up Corp.: NOI $60,000, average operating assets $300,000, required rate of return 15%.&lt;/p&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 1 · What is the division&#x27;s ROI? &lt;span class=&quot;src&quot;&gt;sl. 11-38&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;d&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;25%&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;5%&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;15%&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;20%&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;ROI = 60,000 / 300,000 = &lt;b&gt;20%&lt;/b&gt;. The 15% is the minimum rate, which is not needed here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 2 · If evaluated on ROI, will the manager want to make a $100,000 investment that generates an additional $18,000 of NOI per year? &lt;span class=&quot;src&quot;&gt;sl. 11-40&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Yes&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;No&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;&lt;b&gt;No&lt;/b&gt;: the project returns 18%, less than the current 20%. The division&#x27;s ROI would fall to 78,000 / 400,000 = 19.5%.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 3 · Would the company (minimum rate 15%) want the manager to make that investment? &lt;span class=&quot;src&quot;&gt;sl. 11-42&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;a&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Yes&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;No&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;&lt;b&gt;Yes&lt;/b&gt;: 18% exceeds the required 15%. Here is the conflict between the manager and the company, i.e. the third criticism of ROI.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;Quick Check 4 · What is the division&#x27;s residual income? &lt;span class=&quot;src&quot;&gt;sl. 11-44&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;c&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$240,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$45,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$15,000&lt;/button&gt;&lt;button data-k=&quot;d&quot;&gt;$51,000&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;RI = 60,000 − 300,000 × 15% = 60,000 − 45,000 = &lt;b&gt;$15,000&lt;/b&gt;. With the project: 78,000 − 400,000 × 15% = 18,000 → RI increases, so a manager evaluated on RI accepts.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;5 · A manager sells an idle warehouse without affecting sales or expenses. What happens to ROI?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Assets decrease → turnover rises → ROI rises, with margin unchanged.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 5 ================= --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 5 · Learning objective 3&lt;/span&gt;
  &lt;h2&gt;Transfer pricing: prices between divisions&lt;/h2&gt;
  &lt;p&gt;Objective: determine the range, if any, within which a &lt;b&gt;negotiated transfer price&lt;/b&gt; should fall &lt;span class=&quot;src&quot;&gt;sl. 11-48&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Transfer price&lt;/b&gt;: the price charged when one segment of a company provides goods or services to another segment of the same company &lt;span class=&quot;src&quot;&gt;sl. 11-49&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Fundamental objective&lt;/b&gt;: to motivate managers to act in the &lt;b&gt;best interests of the company as a whole&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-49&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; Why it matters: for the company as a whole, the internal price is a wash (the seller&#x27;s revenue is the buyer&#x27;s cost, so the total does not change). But it determines &lt;i&gt;how profit is split&lt;/i&gt; between the divisions, and therefore how their managers are evaluated: a poorly set price can lead them to reject exchanges that benefit the group.&lt;/p&gt;

  &lt;h3&gt;The three approaches &lt;span class=&quot;src&quot;&gt;sl. 11-50&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;1 · Negotiated&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · At cost&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Market price&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;The price results from a &lt;b&gt;negotiation&lt;/b&gt; between the selling and buying divisions &lt;span class=&quot;src&quot;&gt;sl. 11-51&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Preserves the autonomy&lt;/b&gt; of the divisions, consistent with the spirit of decentralization.&lt;/div&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Uses the best information&lt;/b&gt;: the negotiating managers know the costs and benefits of the transfer better than anyone else.&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;The &lt;b&gt;lower limit&lt;/b&gt; is set by the seller; the &lt;b&gt;upper limit&lt;/b&gt; is set by the buyer.&lt;/p&gt;
      &lt;h4&gt;Evaluation &lt;span class=&quot;src&quot;&gt;sl. 11-57&lt;/span&gt;&lt;/h4&gt;
      &lt;ul&gt;&lt;li&gt;If an internal transfer increases overall profit, there is &lt;b&gt;always&lt;/b&gt; a range of prices within which both divisions benefit.&lt;/li&gt;
      &lt;li&gt;If managers are pitted against each other (rather than against their own past performance or reasonable benchmarks), a &lt;b&gt;non-cooperative atmosphere&lt;/b&gt; is almost guaranteed.&lt;/li&gt;
      &lt;li&gt;Given the disputes that often accompany negotiation, &lt;b&gt;most companies rely on other methods&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Many companies set the price at the selling division&#x27;s &lt;b&gt;variable cost&lt;/b&gt; or &lt;b&gt;full cost&lt;/b&gt; (variable cost plus a share of fixed costs) &lt;span class=&quot;src&quot;&gt;sl. 11-59&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Suboptimization&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Using full cost can lead to suboptimal decisions: full cost includes fixed costs that do not change with the transfer, so the buyer sees a higher cost than the true cost to the group and may reject beneficial transfers.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Never a profit&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;The selling division never shows a profit on internal transfers: it has no incentive to sell internally.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;No incentive to control costs&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;Every inefficiency is “passed on” to the buyer through the price.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The &lt;b&gt;market price&lt;/b&gt; (the price charged on the open market) is often regarded as the best approach &lt;span class=&quot;src&quot;&gt;sl. 11-61&lt;/span&gt;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card plus&quot;&gt;&lt;b&gt;Works well&lt;/b&gt; when the product is sold as is to outside customers and the selling division has &lt;b&gt;no idle capacity&lt;/b&gt;: forgoing an outside sale costs exactly the market price.&lt;/div&gt;
      &lt;div class=&quot;card minus&quot;&gt;&lt;b&gt;Works poorly&lt;/b&gt; when the seller &lt;b&gt;has idle capacity&lt;/b&gt;: the true cost to the group is only the variable cost, and a high market price may cause beneficial transfers to be rejected.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The two range formulas &lt;span class=&quot;src&quot;&gt;sl. 11-53&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;formula&quot; style=&quot;text-align:left&quot;&gt;
    &lt;b style=&quot;color:var(--brick)&quot;&gt;Seller (lower limit)&lt;/b&gt;&lt;br&gt;
    Transfer price ≥ Variable cost per unit + &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total contribution margin on lost sales&lt;/span&gt;&lt;span&gt;Number of units transferred&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Contribution margin&lt;/b&gt; = price − variable cost. “Lost sales” are the outside sales the seller forgoes in order to supply the internal division: this is its opportunity cost.&lt;/p&gt;
  &lt;div class=&quot;formula&quot; style=&quot;text-align:left&quot;&gt;
    &lt;b style=&quot;color:var(--brick)&quot;&gt;Buyer (upper limit)&lt;/b&gt;&lt;br&gt;
    Transfer price ≤ Cost of buying from outside supplier&lt;br&gt;
    &lt;span class=&quot;small&quot;&gt;If no outside supplier exists: Transfer price ≤ profit per unit sold (excluding the transfer price)&lt;/span&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Grocery Storehouse case&lt;/h3&gt;
  &lt;p&gt;Two subsidiaries of the same company, Grocery Storehouse &lt;span class=&quot;src&quot;&gt;sl. 11-52&lt;/span&gt;: &lt;b&gt;West Coast Plantations&lt;/b&gt; (seller: capacity of 10,000 crates of navel oranges per month, variable cost $10/crate, fixed costs $100,000/month, market price $25/crate) and &lt;b&gt;Grocery Mart&lt;/b&gt; (buyer: currently pays $20/crate to an outside supplier, sells 1,000 crates per month).&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;tpsim&quot;&gt;
    &lt;h4&gt;Simulator: how much idle capacity does West Coast have?&lt;/h4&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Scenarios from the slides:&lt;/span&gt;&lt;button class=&quot;btn on&quot; data-tpi=&quot;3000&quot;&gt;Sufficient idle capacity (3,000)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tpi=&quot;0&quot;&gt;None (0)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tpi=&quot;500&quot;&gt;Partial (500)&lt;/button&gt;&lt;/div&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Idle capacity (crates)&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;tI&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;3000&quot;&gt;&lt;output id=&quot;otI&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;lab&quot;&gt;&lt;span&gt;Outside supplier&#x27;s price&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;tO&quot; min=&quot;12&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;otO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;svg id=&quot;tpbar&quot; viewBox=&quot;0 0 580 130&quot; role=&quot;img&quot; aria-label=&quot;Range of acceptable transfer prices&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Seller&#x27;s minimum&lt;/span&gt;&lt;b id=&quot;tL&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Buyer&#x27;s maximum&lt;/span&gt;&lt;b id=&quot;tU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Gain to the group&lt;/span&gt;&lt;b id=&quot;tG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;tpv&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Part 3 · idle capacity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Part 4 · no idle capacity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Part 5 · some idle capacity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;3,000 idle crates ≥ 1,000 required: no lost sales &lt;span class=&quot;src&quot;&gt;sl. 11-54&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimum: $10 + $0/1,000 = &lt;b&gt;$10&lt;/b&gt;. Maximum: &lt;b&gt;$20&lt;/b&gt;. → Range &lt;b&gt;$10 – $20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;No idle capacity: 1,000 crates of outside sales are sacrificed &lt;span class=&quot;src&quot;&gt;sl. 11-55&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimum: $10 + ($25 − $10) × 1,000 / 1,000 = &lt;b&gt;$25&lt;/b&gt;. Maximum: &lt;b&gt;$20&lt;/b&gt;. → &lt;b&gt;No range&lt;/b&gt;. And rightly so: for the group, it is better for West Coast to sell outside at $25 and for Grocery Mart to buy outside at $20.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;500 idle crates, 500 crates of outside sales sacrificed &lt;span class=&quot;src&quot;&gt;sl. 11-56&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;Minimum: $10 + ($25 − $10) × 500 / 1,000 = &lt;b&gt;$17.50&lt;/b&gt;. Maximum: &lt;b&gt;$20&lt;/b&gt;. → Range &lt;b&gt;$17.50 – $20.00&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. With 3,000 crates of idle capacity, which transfer price is acceptable to both divisions?&lt;/p&gt;
      &lt;div class=&quot;opts&quot; data-quiz=&quot;b&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;$8&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;$15&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;$22&lt;/button&gt;&lt;/div&gt;
      &lt;p class=&quot;fb&quot; hidden&gt;The range is $10–$20: only &lt;b&gt;$15&lt;/b&gt; falls within it. At $8 the seller loses; at $22 the buyer prefers the outside supplier.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. If West Coast had 200 idle crates, what would the minimum price be?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Lost sales = 1,000 − 200 = 800 crates. Minimum = 10 + 15 × 800 / 1,000 = &lt;b&gt;$22&lt;/b&gt; &amp;gt; $20 → no range. Check it with the simulator.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Why does the market price work poorly when there is idle capacity?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;Because the true cost to the group is only the variable cost ($10): with the price set at $25, Grocery Mart would prefer the outside supplier at $20, and the group would lose a saving of $10 per crate (sl. 11-61).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;4. What are the three disadvantages of cost-based transfer prices?&lt;/p&gt;
      &lt;details class=&quot;reveal&quot;&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;div&gt;(1) Full cost risks suboptimization; (2) the seller never shows a profit on internal transfers; (3) there is no incentive to control costs (sl. 11-59).&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ================= 6 ================= --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;Part 6 · Learning objective 4&lt;/span&gt;
  &lt;h2&gt;Charging service department costs&lt;/h2&gt;
  &lt;p&gt;Objective: charge operating departments for the services provided by service departments &lt;span class=&quot;src&quot;&gt;sl. 11-62&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Operating departments&lt;/h4&gt;Carry out the core business (e.g. production, sales) &lt;span class=&quot;src&quot;&gt;sl. 11-63&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Service departments&lt;/h4&gt;Do not engage directly in operating activities: they support the others (e.g. maintenance, IT, cafeteria, personnel) &lt;span class=&quot;src&quot;&gt;sl. 11-63&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Why charge them &lt;span class=&quot;src&quot;&gt;sl. 11-64&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;To encourage operating departments to &lt;b&gt;make wise use&lt;/b&gt; of service department resources.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;To provide operating departments with &lt;b&gt;more complete cost data&lt;/b&gt; for decision making.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;To help &lt;b&gt;measure the profitability&lt;/b&gt; of operating departments.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;To create an incentive for service departments to &lt;b&gt;operate efficiently&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The rules: charging costs by behavior&lt;/h3&gt;
  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 250&quot; role=&quot;img&quot; aria-label=&quot;Diagram of how variable and fixed costs are charged&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect x=&quot;300&quot; y=&quot;12&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Service department costs&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;split into variable and fixed · budgeted&lt;/text&gt;
      &lt;path d=&quot;M380,70 L210,110&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
      &lt;path d=&quot;M480,70 L650,110&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar6)&quot;/&gt;
      &lt;rect x=&quot;30&quot; y=&quot;112&quot; width=&quot;370&quot; height=&quot;124&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;rect x=&quot;460&quot; y=&quot;112&quot; width=&quot;370&quot; height=&quot;124&quot; rx=&quot;12&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.3&quot;/&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;text x=&quot;48&quot; y=&quot;138&quot; font-weight=&quot;600&quot; fill=&quot;var(--accent)&quot;&gt;VARIABLE&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;162&quot;&gt;budgeted rate × actual activity&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;use the cost driver that causes the cost&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;204&quot; fill=&quot;var(--ink2)&quot;&gt;(e.g. machine hours, miles driven)&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;138&quot; font-weight=&quot;600&quot; fill=&quot;var(--accent)&quot;&gt;FIXED&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;162&quot;&gt;budgeted amount × % of capacity required&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;peak-period or long-run average needs&lt;/text&gt;
        &lt;text x=&quot;478&quot; y=&quot;204&quot; fill=&quot;var(--ink2)&quot;&gt;predetermined amounts, stable over time&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Summary of sl. 11-65 → 11-68.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details open&gt;&lt;summary&gt;The four rules, one by one&lt;/summary&gt;&lt;div&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;b&gt;Separate&lt;/b&gt; the service department&#x27;s variable and fixed costs and charge them separately &lt;span class=&quot;src&quot;&gt;sl. 11-65&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Variable&lt;/b&gt; costs are charged to consuming departments according to the activity, or &lt;b&gt;cost driver&lt;/b&gt; (the factor that causes the cost), that generates them &lt;span class=&quot;src&quot;&gt;sl. 11-66&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Fixed&lt;/b&gt; costs are assigned in predetermined amounts, based on the department&#x27;s &lt;b&gt;peak-period&lt;/b&gt; needs or long-run average needs. They reflect the capacity each department requires and should not change from period to period &lt;span class=&quot;src&quot;&gt;sl. 11-67&lt;/span&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Budgeted&lt;/b&gt; costs, not actual costs, are charged &lt;span class=&quot;src&quot;&gt;sl. 11-68&lt;/span&gt;.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext in&quot;&gt;supplement&lt;/span&gt; &lt;b&gt;Why these rules.&lt;/b&gt; Fixed capacity (machinery, staff) is sized to meet users&#x27; peak needs: those who required more capacity pay more, regardless of the year&#x27;s usage. Using the &lt;i&gt;budget&lt;/i&gt; instead of actual costs avoids passing the service department&#x27;s inefficiencies on to operating departments (so the service department remains responsible for its own waste, in line with the controllability principle). For variable costs, however, the consuming department&#x27;s &lt;i&gt;actual&lt;/i&gt; activity is used, since that does depend on that department.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Worked example: Sipco&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;steps&quot;&gt;
      &lt;div&gt;&lt;b&gt;Data&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-69&lt;/span&gt;: one maintenance department and two operating departments, Cutting and Assembly. Budgeted variable costs: &lt;b&gt;$0.60 per machine hour&lt;/b&gt;. Budgeted fixed costs: &lt;b&gt;$200,000 per year&lt;/b&gt;.
        &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Department&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% of peak capacity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Planned hours&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Hours used&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cutting&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Assembly&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100%&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;125,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Variable costs at year-end&lt;/b&gt;: budgeted rate × &lt;b&gt;actual hours&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-70&lt;/span&gt;.&lt;br&gt;Cutting: $0.60 × 80,000 = &lt;b&gt;$48,000&lt;/b&gt; · Assembly: $0.60 × 40,000 = &lt;b&gt;$24,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Fixed costs&lt;/b&gt;: budgeted amount × &lt;b&gt;% of peak capacity&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-71&lt;/span&gt;.&lt;br&gt;Cutting: 60% × $200,000 = &lt;b&gt;$120,000&lt;/b&gt; · Assembly: 40% × $200,000 = &lt;b&gt;$80,000&lt;/b&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Total charged&lt;/b&gt;: Cutting &lt;b&gt;$168,000&lt;/b&gt; · Assembly &lt;b&gt;$104,000&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;sl. 11-71&lt;/span&gt;.&lt;br&gt;&lt;span class=&quot;small muted&quot;&gt;Note: Assembly used fewer hours than planned (40,000 against 50,000), but still pays its full fixed share: the capacity had been provided for it as well.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The counterexample: Autos R Us&lt;/h3&gt;
  &lt;p&gt;One service department and three sales departments (New Cars, Used Cars, Car Parts). Service costs are $80,000 in both years. &lt;b&gt;Contrary to good practice&lt;/b&gt;, the company allocates them on the basis of sales &lt;span class=&quot;src&quot;&gt;sl. 11-77&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Allocation of service costs over the two years&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;210&quot; x2=&quot;620&quot; y2=&quot;210&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;52&quot; y=&quot;214&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;134&quot;&gt;25k&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;54&quot;&gt;50k&lt;/text&gt;&lt;/g&gt;
      &lt;g stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;2 4&quot;&gt;&lt;line x1=&quot;60&quot; x2=&quot;620&quot; y1=&quot;130&quot; y2=&quot;130&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;620&quot; y1=&quot;50&quot; y2=&quot;50&quot;/&gt;&lt;/g&gt;
      &lt;g&gt;
        &lt;rect x=&quot;100&quot; y=&quot;82&quot; width=&quot;60&quot; height=&quot;128&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;165&quot; y=&quot;63.7&quot; width=&quot;60&quot; height=&quot;146.3&quot; fill=&quot;var(--accent)&quot;/&gt;
        &lt;rect x=&quot;285&quot; y=&quot;133.2&quot; width=&quot;60&quot; height=&quot;76.8&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;144.2&quot; width=&quot;60&quot; height=&quot;65.8&quot; fill=&quot;var(--accent)&quot;/&gt;
        &lt;rect x=&quot;470&quot; y=&quot;158.8&quot; width=&quot;60&quot; height=&quot;51.2&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;rect x=&quot;535&quot; y=&quot;166.1&quot; width=&quot;60&quot; height=&quot;43.9&quot; fill=&quot;var(--accent)&quot;/&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;130&quot; y=&quot;76&quot;&gt;40,000&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;57&quot; font-weight=&quot;600&quot;&gt;45,714&lt;/text&gt;
        &lt;text x=&quot;315&quot; y=&quot;127&quot;&gt;24,000&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;138&quot; font-weight=&quot;600&quot;&gt;20,571&lt;/text&gt;
        &lt;text x=&quot;500&quot; y=&quot;153&quot;&gt;16,000&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;160&quot; font-weight=&quot;600&quot;&gt;13,715&lt;/text&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;13.5&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;163&quot; y=&quot;232&quot;&gt;New Cars&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;232&quot;&gt;Used Cars&lt;/text&gt;&lt;text x=&quot;533&quot; y=&quot;232&quot;&gt;Car Parts&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot;&gt;&lt;rect x=&quot;400&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;418&quot; y=&quot;25&quot;&gt;Year 1&lt;/text&gt;&lt;rect x=&quot;480&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;498&quot; y=&quot;25&quot;&gt;Year 2&lt;/text&gt;&lt;/g&gt;
