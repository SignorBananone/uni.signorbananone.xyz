 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Study canvas · Strategic Management Accounting · A.Y. 2026-27&lt;/div&gt;
  &lt;h1&gt;The course programme, explained topic by topic&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;From the &lt;em&gt;flexible budget&lt;/em&gt; to the &lt;em&gt;Sustainable Balanced Scorecard&lt;/em&gt;: what is studied, in what order, and why each tool lays the groundwork for the next.&lt;/p&gt;
  &lt;div class=&quot;box terra tint&quot;&gt;
   &lt;p&gt;&lt;b&gt;Where this material comes from.&lt;/b&gt; The source file (&lt;code&gt;Intro and general info/SMA detailed program students.261015.pdf&lt;/code&gt;) is &lt;b&gt;a single page&lt;/b&gt;: the class schedule from 19 October to 17 December, listing the date, the day and the title of each topic. The slides contain no definitions, formulas, authors or references.&lt;/p&gt;
   &lt;p&gt;For this reason the page uses three labels:
   &lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; for what is actually in the PDF ·
   &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; for the standard textbook explanations that the schedule takes for granted ·
   &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; for what has been checked on the web, always with a link.&lt;/p&gt;
   &lt;p class=&quot;note&quot;&gt;I was unable to consult the other files in the &lt;code&gt;corso/&lt;/code&gt; folder: with the tools available to me I cannot view their content. For this reason, no part of this page is based on those files. When the slides for the individual lectures become available, compare the supplementary material with the definitions and notation used by the lecturer.&lt;/p&gt;
  &lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;◎&lt;/span&gt;&lt;h2&gt;Concept map&lt;/h2&gt;&lt;/div&gt;

&lt;/section&gt;

 &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; &lt;b&gt;Strategic management accounting&lt;/b&gt; (SMA) is the branch of management accounting that provides information to &lt;i&gt;formulate, implement and control strategy&lt;/i&gt;. It therefore looks beyond short-term internal costs: markets, competitors, long-term objectives, non-financial measures. The programme follows exactly this path, from short-term control tools (budgets, responsibility centres) to strategic ones (BSC and SBSC).&lt;/p&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;flex&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Flexible budget&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; First lecture of the course, &lt;b&gt;Monday 19 October&lt;/b&gt;. &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; for all the content that follows.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;A fixed budget compares actual results with a plan designed for a different volume. The &lt;em&gt;flexible budget&lt;/em&gt; recalculates the plan at the actual volume, so that like is compared with like.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Static budget&lt;/b&gt; (or &lt;i&gt;master budget&lt;/i&gt;): the budget prepared at the start of the period for &lt;b&gt;a single planned level of activity&lt;/b&gt;, for example 10,000 units.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt;: the same budget &lt;b&gt;recalculated at the actual level of activity&lt;/b&gt;, using budgeted prices and unit costs. It is prepared at the end of the period, once the actual volume is known.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Variable / fixed costs&lt;/b&gt;: variable costs change in proportion to volume, fixed costs do not, at least within the &lt;i&gt;relevant range&lt;/i&gt; (the range of activity over which the assumed cost behaviour holds).&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Variance&lt;/b&gt;: the difference between actual results and the budget. It is &lt;b&gt;F&lt;/b&gt; (&lt;i&gt;favourable&lt;/i&gt;) if it increases income relative to the plan and &lt;b&gt;U&lt;/b&gt; (&lt;i&gt;unfavourable&lt;/i&gt;) if it reduces it.&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;formula&quot;&gt;Flexible budget = Fixed costs + (budgeted variable cost per unit × &lt;b&gt;actual&lt;/b&gt; output)&lt;/div&gt;

 &lt;h3&gt;Building it in four steps&lt;/h3&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;① Determine the actual volume&lt;/h4&gt;&lt;p&gt;Start from the figure the static budget could not know: how many units were actually sold or produced, for example 11,000 instead of the 10,000 planned.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;② Flexible revenues&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Budgeted&lt;/b&gt; selling price × actual volume: €50 × 11,000 = €550,000. The price stays at its budgeted level: the price effect will be isolated later.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;③ Flexible variable costs&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Standard&lt;/b&gt; variable cost per unit × actual volume: €30 × 11,000 = €330,000. This is what we &lt;i&gt;should have&lt;/i&gt; spent for that volume.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;④ Unchanged fixed costs&lt;/h4&gt;&lt;p&gt;Fixed costs remain those of the static budget (€120,000) because, by definition, they do not depend on volume within the relevant range. Flexible-budget operating income: 550,000 − 330,000 − 120,000 = €100,000.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;The hierarchy of variances&lt;/h3&gt;
 &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Variance tree: the static-budget variance splits into the flexible-budget variance and the sales-volume variance; the former splits into the price and efficiency variances&quot;&gt;
  &lt;g fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;path d=&quot;M430 72 V100 H215 V128 M430 100 H645 V128&quot;/&gt;&lt;path d=&quot;M215 192 V214 H110 V236 M215 214 H320 V236&quot;/&gt;&lt;/g&gt;
  &lt;rect x=&quot;290&quot; y=&quot;16&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;430&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;Static-budget variance&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Actual − Static budget · level 1&lt;/text&gt;
  &lt;rect x=&quot;85&quot; y=&quot;128&quot; width=&quot;260&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;215&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Flexible-budget variance&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Actual − Flexible · efficiency and prices&lt;/text&gt;
  &lt;rect x=&quot;515&quot; y=&quot;128&quot; width=&quot;260&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;645&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Sales-volume variance&lt;/text&gt;&lt;text x=&quot;645&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Flexible − Static · volume effect&lt;/text&gt;
  &lt;rect x=&quot;20&quot; y=&quot;236&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
  &lt;text x=&quot;110&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Price variance&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;279&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;(AP − SP) × AQ&lt;/text&gt;
  &lt;rect x=&quot;230&quot; y=&quot;236&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
  &lt;text x=&quot;320&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Efficiency variance&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;279&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;(AQ − SQ) × SP&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;typical responsibility: marketing / sales&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;= (actual Q − budgeted Q) × budgeted unit margin&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;AP/SP = actual/standard price per unit of input; AQ = actual quantity of input; SQ = standard quantity allowed for actual output.&lt;/p&gt;

 &lt;h3&gt;Simulator: change the volume and watch the variances&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;Static budget: 10,000 units, price €50, variable cost €30/unit, fixed costs €120,000 → operating income €80,000. The sliders act on the actual results.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Actual units sold: &lt;output id=&quot;fq&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fqR&quot; min=&quot;6000&quot; max=&quot;14000&quot; step=&quot;250&quot; value=&quot;11000&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Actual price: &lt;output id=&quot;fp&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fpR&quot; min=&quot;44&quot; max=&quot;56&quot; step=&quot;0.5&quot; value=&quot;49&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Actual variable cost/unit: &lt;output id=&quot;fv&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fvR&quot; min=&quot;26&quot; max=&quot;34&quot; step=&quot;0.5&quot; value=&quot;31&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Actual fixed costs: &lt;output id=&quot;ff&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ffR&quot; min=&quot;100000&quot; max=&quot;140000&quot; step=&quot;2500&quot; value=&quot;125000&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;ftab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;svg viewBox=&quot;0 0 600 236&quot; id=&quot;fchart&quot; aria-label=&quot;Comparison of operating incomes&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
  &lt;p class=&quot;note&quot; id=&quot;fmsg&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;

 &lt;h3&gt;Level 3: price and efficiency variances, an example&lt;/h3&gt;
 &lt;div class=&quot;box tint&quot;&gt;
  &lt;p&gt;Standard: &lt;b&gt;2 kg&lt;/b&gt; of direct materials per unit at &lt;b&gt;€5/kg&lt;/b&gt;. Actual output 10,000 units → SQ = 20,000 kg. Actual usage: &lt;b&gt;21,000 kg&lt;/b&gt; purchased at &lt;b&gt;€4.80/kg&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
   &lt;tr&gt;&lt;th&gt;Variance&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th&gt;Result&lt;/th&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Price variance&lt;/td&gt;&lt;td&gt;(4.80 − 5.00) × 21,000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;4,200 F&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Efficiency variance&lt;/td&gt;&lt;td&gt;(21,000 − 20,000) × 5.00&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;5,000 U&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Direct materials flexible-budget variance&lt;/td&gt;&lt;td&gt;100,800 − 100,000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;800 U&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;The purchasing department secured a better price, but production wasted material. Perhaps lower-quality material was bought: this is why an F variance is not automatically good news.&lt;/p&gt;
 &lt;/div&gt;

 &lt;details class=&quot;ochre&quot;&gt;&lt;summary&gt;Why does this topic open a course on &lt;i&gt;strategic&lt;/i&gt; management accounting?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The flexible budget answers a control question: &lt;i&gt;at the same volume, did we perform well?&lt;/i&gt; It separates what depends on the market (volume) from what depends on management (prices and efficiency). It is the basis for the next lecture: each variance must be assigned to &lt;b&gt;whoever can control it&lt;/b&gt;, which is precisely the idea behind &lt;i&gt;Responsibility Accounting Systems&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz ochre&quot;&gt;
  &lt;h3&gt;Self-assessment&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Sales exceed the budget by 10% and total variable costs exceed the static budget by 8%. Was the department inefficient?&lt;/summary&gt;&lt;div&gt;No, quite the opposite: at the actual volume the flexible budget allows variable costs &lt;b&gt;+10%&lt;/b&gt;. Spending +8% therefore gives a &lt;b&gt;favourable&lt;/b&gt; flexible-budget variance. The comparison with the static budget (+8%, “U”) was misleading.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which variance measures the effect of volume alone?&lt;/summary&gt;&lt;div&gt;The &lt;b&gt;sales-volume variance&lt;/b&gt; = flexible budget − static budget = (actual Q − budgeted Q) × budgeted contribution margin per unit.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why are fixed costs the same in the flexible and the static budget?&lt;/summary&gt;&lt;div&gt;Because within the &lt;i&gt;relevant range&lt;/i&gt; they do not vary with volume: “flexing” the budget affects only the variable items.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Favourable price variance and unfavourable efficiency variance on the same materials: what hypothesis would you put forward?&lt;/summary&gt;&lt;div&gt;Cheaper but lower-quality material was purchased, generating more waste in production. The two variances must be read together, and responsibility may lie with the purchasing department even though the variance shows up in production.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;ras&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Responsibility Accounting Systems&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; Three lectures: &lt;b&gt;20, 27 and 28 October&lt;/b&gt;, either side of the 1st Assignment (26 October). &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; for the content.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;A &lt;em&gt;responsibility accounting system&lt;/em&gt; organises budgets, actual results and variances &lt;b&gt;by responsible manager&lt;/b&gt;: each manager is given objectives and is evaluated only on what they can influence.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility centre&lt;/b&gt;: an organisational unit headed by a manager who is accountable for a defined set of activities and results.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Controllability principle&lt;/b&gt;: a manager should be evaluated only on the items they can &lt;b&gt;control&lt;/b&gt; or significantly influence. Other items are reported separately or excluded.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Decentralisation&lt;/b&gt;: the delegation of decision-making authority to lower levels. It brings decisions closer to the information, but requires measurement systems that align objectives.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Goal congruence&lt;/b&gt;: a system works if, in pursuing their own objectives, each manager also pursues those of the organisation as a whole.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;The four types of centre&lt;/h3&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
   &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;rc1&quot;&gt;Cost centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc2&quot;&gt;Revenue centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc3&quot;&gt;Profit centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc4&quot;&gt;Investment centre&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc1&quot;&gt;&lt;h4&gt;Cost centre: accountable for costs&lt;/h4&gt;&lt;p&gt;Examples: a plant, a production department, IT. A distinction is drawn between the &lt;b&gt;standard (engineered) cost centre&lt;/b&gt;, where there is a measurable input-output relationship and standard costs and flexible budgets are used, and the &lt;b&gt;discretionary expense centre&lt;/b&gt; (R&amp;amp;D, legal department, corporate marketing), where output is hard to measure and control focuses mainly on staying within the budget allocation.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Typical measures:&lt;/b&gt; cost variances, unit cost, efficiency.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc2&quot; hidden&gt;&lt;h4&gt;Revenue centre: accountable for revenues&lt;/h4&gt;&lt;p&gt;Examples: a sales region, the sales network. The manager acts on sales volumes and mix, often with little autonomy over prices and no control over production costs.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Typical measures:&lt;/b&gt; revenues, market share, sales-volume and sales-mix variances. The risk is pushing low-margin products just to increase turnover.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc3&quot; hidden&gt;&lt;h4&gt;Profit centre: accountable for revenues and costs&lt;/h4&gt;&lt;p&gt;Examples: a business unit, a store, a product line. The manager decides on prices, mix and costs, and can therefore trade revenues off against costs.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Typical measures:&lt;/b&gt; contribution margin, &lt;i&gt;controllable margin&lt;/i&gt;, divisional profit. If profit centres exchange goods with each other, a &lt;b&gt;transfer price&lt;/b&gt; is needed.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc4&quot; hidden&gt;&lt;h4&gt;Investment centre: accountable for income and invested capital&lt;/h4&gt;&lt;p&gt;Examples: a division with autonomy over investments, a subsidiary. It is the broadest level of delegation, because the manager also decides how much capital to employ.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Typical measures:&lt;/b&gt; ROI, Residual Income, EVA (see below).&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;svg viewBox=&quot;0 0 860 260&quot; role=&quot;img&quot; aria-label=&quot;Organisation chart with responsibility centres: CEO as investment centre, divisions as profit or investment centres, plants as cost centres, sales region as revenue centre, discretionary services&quot;&gt;
  &lt;g fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.4&quot;&gt;&lt;path d=&quot;M430 60 V84 H220 V104 M430 84 H640 V104&quot;/&gt;&lt;path d=&quot;M220 150 V172 H110 V194 M220 172 H330 V194&quot;/&gt;&lt;path d=&quot;M640 150 V172 H540 V194 M640 172 H750 V194&quot;/&gt;&lt;/g&gt;

 &lt;p class=&quot;cap&quot;&gt;Responsibility reports move up the hierarchy: each level sees the detail of its own controllable items and a summary of the levels below.&lt;/p&gt;

 &lt;h3&gt;Measuring an investment centre&lt;/h3&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;ROI, Return on Investment&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ROI = Operating income / Invested capital&lt;/div&gt;&lt;p&gt;The &lt;b&gt;DuPont&lt;/b&gt; decomposition shows the two levers: &lt;br&gt;&lt;span style=&quot;font-family:var(--serif)&quot;&gt;ROI = (Income / Sales) × (Sales / Investment)&lt;/span&gt;, i.e. &lt;i&gt;margin&lt;/i&gt; × &lt;i&gt;asset turnover&lt;/i&gt;. Being a ratio, it allows divisions of different sizes to be compared.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;RI, Residual Income&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;RI = Operating income − (k × Invested capital)&lt;/div&gt;&lt;p&gt;&lt;i&gt;k&lt;/i&gt; = &lt;i&gt;required rate of return&lt;/i&gt; (often the cost of capital). It is an absolute amount: it shows how much income remains &lt;b&gt;after&lt;/b&gt; the capital has been remunerated. &lt;b&gt;EVA&lt;/b&gt; (&lt;i&gt;Economic Value Added&lt;/i&gt;) is a variant: NOPAT − WACC × invested capital, with accounting adjustments.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Simulator: the goal congruence problem&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;A division has invested capital of €1,000,000 and operating income of €200,000 (ROI 20%). The company&#x27;s cost of capital is &lt;i&gt;k&lt;/i&gt;. The manager is offered a new project.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Project investment: &lt;output id=&quot;ri1&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riI&quot; min=&quot;100000&quot; max=&quot;800000&quot; step=&quot;50000&quot; value=&quot;400000&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Project return: &lt;output id=&quot;ri2&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riR&quot; min=&quot;4&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;15&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Cost of capital k: &lt;output id=&quot;ri3&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riK&quot; min=&quot;6&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;kpi&quot; id=&quot;rikpi&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;rimsg&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;

 &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Transfer pricing: when centres sell goods to each other&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The &lt;b&gt;transfer price&lt;/b&gt; is the price at which one division supplies goods or services to another division of the same company. For the company as a whole, income does not change, but the price shifts income between divisions and therefore changes how they are evaluated. Typical methods: &lt;b&gt;market-based&lt;/b&gt;, &lt;b&gt;cost-based&lt;/b&gt; (variable or full cost, possibly with a mark-up), &lt;b&gt;negotiated&lt;/b&gt;. A good transfer price preserves goal congruence and divisional autonomy.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Limitations of systems based solely on financial measures&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ROI and RI measure short-term results: they encourage cuts to training, maintenance or R&amp;amp;D to improve the year&#x27;s income (&lt;i&gt;short-termism&lt;/i&gt;). They show &lt;i&gt;how much&lt;/i&gt; was earned, not &lt;i&gt;why&lt;/i&gt;, and they do not show whether the capabilities for the future are being built. This is where the &lt;b&gt;Balanced Scorecard&lt;/b&gt; comes in, complementing financial measures with non-financial indicators.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz brick&quot;&gt;
  &lt;h3&gt;Self-assessment&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;The plant manager is penalised because the rent of the head office, allocated to their department, has increased. Which principle is violated?&lt;/summary&gt;&lt;div&gt;The &lt;b&gt;controllability principle&lt;/b&gt;: head-office rent is not controllable by the plant manager, so it should be excluded from their evaluation or reported separately.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What is the difference between a profit centre and an investment centre?&lt;/summary&gt;&lt;div&gt;Both are accountable for revenues and costs, but the manager of an investment centre also decides on &lt;b&gt;invested capital&lt;/b&gt; and is evaluated with measures that include it (ROI, RI, EVA).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;A division with ROI of 20%, a project returning 15%, cost of capital 12%. What does a manager evaluated on ROI do? And one evaluated on RI?&lt;/summary&gt;&lt;div&gt;Under ROI the manager rejects the project, because it lowers the division&#x27;s average ROI. Under RI the manager accepts it, because RI increases: (15% − 12%) × investment &amp;gt; 0. For the company the project creates value: ROI generates a &lt;b&gt;goal congruence&lt;/b&gt; problem.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Write out the DuPont decomposition of ROI and explain what it is used for.&lt;/summary&gt;&lt;div&gt;ROI = (Income/Sales) × (Sales/Investment). It shows whether a low ROI stems from low margins or from under-utilised capital, and hence which lever to act on.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;bsc&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Balanced Scorecard&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; This is the longest block: &lt;b&gt;2, 3, 4 and 9 November&lt;/b&gt;. &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; for the content. Kaplan and Norton&#x27;s original works are described in &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;The &lt;em&gt;Balanced Scorecard&lt;/em&gt; (BSC) translates strategy into a limited set of objectives and measures, organised into four perspectives linked by cause-and-effect relationships.&lt;/p&gt;
 &lt;p&gt;“Balanced” because it balances &lt;b&gt;financial and non-financial&lt;/b&gt; measures, &lt;b&gt;outcome&lt;/b&gt; (lagging) and &lt;b&gt;leading&lt;/b&gt; indicators, the &lt;b&gt;internal and external&lt;/b&gt; perspectives, and the &lt;b&gt;short and long term&lt;/b&gt;.&lt;/p&gt;

 &lt;h3&gt;The four perspectives: click a box&lt;/h3&gt;
 &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
  &lt;svg viewBox=&quot;0 0 420 420&quot; role=&quot;img&quot; aria-label=&quot;The four BSC perspectives around vision and strategy&quot; id=&quot;bscsvg&quot;&gt;

   &lt;g class=&quot;bq&quot; data-k=&quot;0&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;how do shareholders see us?&lt;/text&gt;&lt;/g&gt;

   &lt;g class=&quot;bq&quot; data-k=&quot;2&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;150&quot; width=&quot;130&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;Internal&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;process&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;what must we excel at?&lt;/text&gt;&lt;/g&gt;
   &lt;g class=&quot;bq&quot; data-k=&quot;3&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;280&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;330&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Learning &amp;amp; growth&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;352&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;can we improve and create value?&lt;/text&gt;&lt;/g&gt;

 &lt;p class=&quot;note&quot;&gt;In the 1992 version the fourth perspective is called &lt;i&gt;innovation and learning&lt;/i&gt;; in later works it becomes &lt;i&gt;learning and growth&lt;/i&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; (&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW, summary of Kaplan &amp;amp; Norton 1992&lt;/a&gt;).&lt;/p&gt;

 &lt;h3&gt;The elements of each perspective&lt;/h3&gt;
 &lt;div class=&quot;grid4&quot;&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Objectives&lt;/h4&gt;What we want to achieve. &lt;i&gt;E.g.: on-time flights.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Measures&lt;/h4&gt;How we measure progress (KPIs). &lt;i&gt;E.g.: % of arrivals within 15 minutes.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Targets&lt;/h4&gt;The level to be reached and by when. &lt;i&gt;E.g.: 92% by December.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Initiatives&lt;/h4&gt;Projects and actions to get there. &lt;i&gt;E.g.: new ground turnaround programme.&lt;/i&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Cause and effect: the strategy map&lt;/h3&gt;
 &lt;p&gt;The BSC is not a list of KPIs: the perspectives are linked by cause-and-effect hypotheses, from the bottom up. The &lt;b&gt;strategy map&lt;/b&gt; makes them visible. A classic example of a low-cost airline, for illustrative purposes:&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 860 400&quot; role=&quot;img&quot; aria-label=&quot;Strategy map of a low-cost airline from training to profit&quot;&gt;
  &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

   &lt;path d=&quot;M480 322 V278&quot;/&gt;&lt;path d=&quot;M480 232 V180&quot;/&gt;&lt;path d=&quot;M480 232 C560 210 640 200 700 180&quot;/&gt;&lt;path d=&quot;M480 134 C480 110 420 90 400 72&quot;/&gt;&lt;path d=&quot;M700 134 C700 110 620 80 560 64&quot;/&gt;&lt;path d=&quot;M290 232 C300 150 330 100 350 72&quot;/&gt;

   &lt;rect x=&quot;390&quot; y=&quot;134&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;162&quot;&gt;On-time flights&lt;/text&gt;
   &lt;rect x=&quot;620&quot; y=&quot;134&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;705&quot; y=&quot;162&quot;&gt;Low fares&lt;/text&gt;
   &lt;rect x=&quot;380&quot; y=&quot;232&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;260&quot;&gt;Fast ground turnaround&lt;/text&gt;
   &lt;rect x=&quot;190&quot; y=&quot;232&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;260&quot;&gt;Fewer planes on ground&lt;/text&gt;
   &lt;rect x=&quot;370&quot; y=&quot;322&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;350&quot;&gt;Ground crew training&lt;/text&gt;

 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;Each arrow is a hypothesis to be tested over time. If training increases but punctuality does not, the strategy needs revising, not just the KPI.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lag indicators&lt;/b&gt; (&lt;i&gt;outcome measures&lt;/i&gt;): measure what has already happened, such as ROI or market share. They arrive late.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lead indicators&lt;/b&gt; (&lt;i&gt;performance drivers&lt;/i&gt;): measure the levers that produce future results, such as training hours or cycle times. They allow timely corrective action.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;From measurement system to strategic management system&lt;/h3&gt;
 &lt;p&gt;In later work (1996) Kaplan and Norton describe the BSC as a cycle of four management processes. Step through them:&lt;/p&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Translating the vision&lt;/h4&gt;&lt;p&gt;Top management turns vision and strategy into shared, operational objectives and measures. Statements such as “to be the preferred supplier” become measurable objectives.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Communicating and linking&lt;/h4&gt;&lt;p&gt;The strategy is communicated at all levels and linked to departmental and individual objectives, and possibly to incentives (&lt;i&gt;cascading&lt;/i&gt;, i.e. scorecards cascaded down to units).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Business planning&lt;/h4&gt;&lt;p&gt;Budgets, resource allocation and initiatives are aligned with the scorecard objectives, setting &lt;i&gt;targets&lt;/i&gt; and milestones. Here the BSC connects to the budget covered in section 1.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Feedback and learning&lt;/h4&gt;&lt;p&gt;Periodic reviews do not merely check the figures: they test the cause-and-effect hypotheses (&lt;i&gt;double-loop learning&lt;/i&gt;) and update the strategy.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Comparison: traditional responsibility accounting and the BSC&lt;/summary&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Aspect&lt;/th&gt;&lt;th&gt;Traditional systems&lt;/th&gt;&lt;th&gt;Balanced Scorecard&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Measures&lt;/td&gt;&lt;td&gt;Almost exclusively financial&lt;/td&gt;&lt;td&gt;Financial and non-financial&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Time horizon&lt;/td&gt;&lt;td&gt;Current period&lt;/td&gt;&lt;td&gt;Short and long term&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Type of indicators&lt;/td&gt;&lt;td&gt;Lag (outcome)&lt;/td&gt;&lt;td&gt;Lag and lead&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Starting point&lt;/td&gt;&lt;td&gt;Organisational structure&lt;/td&gt;&lt;td&gt;Strategy&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Function&lt;/td&gt;&lt;td&gt;Control and evaluation&lt;/td&gt;&lt;td&gt;Communication, alignment, learning&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Common implementation mistakes&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
  &lt;li&gt;Too many indicators: the scorecard becomes a dashboard and no longer tells the story of the strategy (15-25 measures are often cited as a rough order of magnitude).&lt;/li&gt;
  &lt;li&gt;Indicators unconnected to one another, with no cause-and-effect logic.&lt;/li&gt;
  &lt;li&gt;Copying another company&#x27;s scorecard: the measures must derive from the company&#x27;s &lt;i&gt;own&lt;/i&gt; strategy.&lt;/li&gt;
  &lt;li&gt;Project delegated to the management control or IT function, without top management involvement.&lt;/li&gt;
  &lt;li&gt;Tying incentives straight away to measures that have not yet been validated.&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz slate&quot;&gt;
  &lt;h3&gt;Self-assessment&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;List the four perspectives and the guiding question of each.&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Financial&lt;/b&gt;: how do shareholders see us? · &lt;b&gt;Customer&lt;/b&gt;: how do customers see us? · &lt;b&gt;Internal process&lt;/b&gt;: which processes must we excel at? · &lt;b&gt;Learning &amp;amp; growth&lt;/b&gt;: can we continue to improve and create value?&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Are “training hours per employee” a lead or a lag indicator?&lt;/summary&gt;&lt;div&gt;A &lt;b&gt;lead indicator&lt;/b&gt;: it anticipates future improvements in processes, customers and financial results.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why is the BSC said to be “balanced”?&lt;/summary&gt;&lt;div&gt;Because it balances financial and non-financial measures, outcome and leading indicators, the internal and external perspectives (shareholders and customers), and the short and long term.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What is a strategy map and what is it for?&lt;/summary&gt;&lt;div&gt;It is the graphical representation of the cause-and-effect relationships between the objectives of the four perspectives. It serves to communicate the strategy and to make the underlying hypotheses testable.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What are the four management processes of the BSC?&lt;/summary&gt;&lt;div&gt;Translating the vision · Communicating and linking · Business planning · Feedback and learning.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;sbsc&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Sustainable Balanced Scorecard&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; Two lectures: &lt;b&gt;10 and 11 November&lt;/b&gt;, immediately after the BSC and before the break for the intermediate tests. The course calls it the &lt;i&gt;Sustainable&lt;/i&gt; BSC. In the literature it is often referred to as the &lt;i&gt;Sustainability Balanced Scorecard&lt;/i&gt; (SBSC).&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;The SBSC brings &lt;b&gt;environmental and social&lt;/b&gt; aspects into the tool the company uses to manage its strategy, instead of leaving them in a separate sustainability report.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Triple bottom line&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt;: the idea that performance should be measured along three dimensions, &lt;i&gt;economic, environmental, social&lt;/i&gt; (often summarised as “profit, planet, people”).&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Non-market perspective&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt;: the environment in which the company operates &lt;i&gt;outside&lt;/i&gt; the market, i.e. communities, regulators, NGOs, public opinion. There, relationships are not mediated by prices and contracts, yet they can strongly influence results.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Three ways to build an SBSC&lt;/h3&gt;
 &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Figge, Hahn, Schaltegger and Wagner (2002) compare the possible forms of an SBSC and describe how to build one for a business unit (&lt;a href=&quot;https://www.izt.de/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IZT record&lt;/a&gt;). The three variants below are the classification commonly used in the literature: compare it with the lecture slides.&lt;/p&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;sb1&quot;&gt;① Integration&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;sb2&quot;&gt;② Fifth perspective&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;sb3&quot;&gt;③ Derived scorecard&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb1&quot;&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;Four perspectives with integrated sustainability elements&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;45&quot;&gt;Financial&lt;/text&gt;
    &lt;rect x=&quot;108&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;45&quot;&gt;Customer&lt;/text&gt;
    &lt;rect x=&quot;206&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;248&quot; y=&quot;45&quot;&gt;Process&lt;/text&gt;
    &lt;rect x=&quot;304&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;346&quot; y=&quot;45&quot;&gt;Learning&lt;/text&gt;
    &lt;g fill=&quot;var(--sage)&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;80&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;150&quot; cy=&quot;95&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;235&quot; cy=&quot;75&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;262&quot; cy=&quot;105&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;346&quot; cy=&quot;88&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;Environmental and social objectives are placed &lt;b&gt;within the four classic perspectives&lt;/b&gt;, like green circles alongside the other objectives. Examples: reducing energy consumption (process), eco-designed products (customer), safety and skills (learning). &lt;b&gt;Pro:&lt;/b&gt; sustainability becomes part of the cause-and-effect chain. &lt;b&gt;Con:&lt;/b&gt; issues that do not pass through the market are left out.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb2&quot; hidden&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;Four perspectives plus a fifth non-market perspective&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;6&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;41&quot; y=&quot;45&quot;&gt;Financial&lt;/text&gt;
    &lt;rect x=&quot;84&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;119&quot; y=&quot;45&quot;&gt;Customer&lt;/text&gt;
    &lt;rect x=&quot;162&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;197&quot; y=&quot;45&quot;&gt;Process&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;45&quot;&gt;Learning&lt;/text&gt;
    &lt;rect x=&quot;318&quot; y=&quot;20&quot; width=&quot;76&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;356&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;Non-&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;61&quot; font-weight=&quot;600&quot;&gt;market&lt;/text&gt;
    &lt;g fill=&quot;var(--sage)&quot;&gt;&lt;circle cx=&quot;345&quot; cy=&quot;90&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;370&quot; cy=&quot;110&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;A &lt;b&gt;fifth perspective&lt;/b&gt; is added for issues that affect the company&#x27;s success &lt;b&gt;outside the market&lt;/b&gt;: social licence to operate, relations with communities and regulators, reputation. &lt;b&gt;Pro:&lt;/b&gt; it gives visibility to non-market issues. &lt;b&gt;Con:&lt;/b&gt; a genuine link with the other perspectives is needed, otherwise sustainability remains an add-on.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb3&quot; hidden&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;Main BSC from which an environmental and social scorecard is derived&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;150&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;70&quot; font-weight=&quot;600&quot;&gt;BSC&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;88&quot;&gt;(4 or 5 perspectives)&lt;/text&gt;
    &lt;path d=&quot;M170 75 H222&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;rect x=&quot;228&quot; y=&quot;30&quot; width=&quot;155&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;Environmental &amp;amp;&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;83&quot; font-weight=&quot;600&quot;&gt;social scorecard&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;102&quot; font-size=&quot;11&quot;&gt;derived&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;A &lt;b&gt;specific scorecard&lt;/b&gt; for environmental and social issues is &lt;b&gt;derived&lt;/b&gt; from the main scorecard, for example for the function that manages sustainability. &lt;b&gt;Pro:&lt;/b&gt; it allows ESG issues to be coordinated in detail. &lt;b&gt;Con:&lt;/b&gt; without prior integration (① or ②), the derived scorecard becomes a parallel document, disconnected from the strategy.&lt;/p&gt;
  &lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Where would you place this issue? Try it&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;Choose a sustainability issue: you will see a possible placement in the scorecard under approach ① and under approach ②. These placements are plausible for teaching purposes: actual choices depend on the individual company&#x27;s strategy.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; id=&quot;sbchips&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sbout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;How it is built, in broad terms&lt;/h3&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Choose the unit&lt;/h4&gt;&lt;p&gt;The work is carried out on a &lt;b&gt;strategic business unit&lt;/b&gt; with a defined strategy: the SBSC does not invent the strategy, it makes it operational.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Map the exposure&lt;/h4&gt;&lt;p&gt;Identify the &lt;b&gt;environmental&lt;/b&gt; aspects (emissions, energy, waste, materials…) and &lt;b&gt;social&lt;/b&gt; aspects (employees, suppliers, communities, human rights…) that concern the unit.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Assess strategic relevance&lt;/h4&gt;&lt;p&gt;For each aspect, ask whether and how it affects the strategy: is it a strategic objective in itself, a driver of other objectives, or a minimum requirement to be met?&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Place and measure&lt;/h4&gt;&lt;p&gt;Relevant aspects become objectives, measures, targets and initiatives within the perspectives, possibly in a fifth non-market perspective. They must be linked by cause-and-effect arrows to the financial perspective.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; teaching summary, based on the description of the process in Figge et al. (2002). For details see &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;

 &lt;details class=&quot;sage&quot;&gt;&lt;summary&gt;A tension to discuss: business case or “genuine” sustainability?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In the BSC all arrows point upwards, to the financial result. If sustainability is integrated into the same logic, there is a risk of considering only the environmental and social issues that “pay off” (the &lt;i&gt;business case for sustainability&lt;/i&gt;). Much of the subsequent literature discusses precisely how to account for issues that matter to society even when their link to profit is weak or uncertain. It is a good point to prepare for the 2nd assignment and for the lectures on &lt;i&gt;human rights&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz sage&quot;&gt;
  &lt;h3&gt;Self-assessment&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;What are the three SBSC variants?&lt;/summary&gt;&lt;div&gt;① Integration of environmental and social objectives into the four existing perspectives · ② addition of a fifth &lt;i&gt;non-market&lt;/i&gt; perspective · ③ an environmental and social scorecard &lt;i&gt;derived&lt;/i&gt; from the main one.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why might a “non-market” perspective be needed?&lt;/summary&gt;&lt;div&gt;Because some decisive factors, such as relations with local communities, regulation or social legitimacy, do not pass through customers and markets and therefore have no place in the four classic perspectives.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What is the risk of a separate sustainability scorecard not linked to the main BSC?&lt;/summary&gt;&lt;div&gt;That sustainability remains a parallel activity, with no links to the strategy or to decisions on budgets and incentives: so-called &lt;i&gt;decoupling&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;vp&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Course wrap-up: assessments, manager and “VP” lectures&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; After the break (16–25 November) the course resumes with: &lt;b&gt;Recap – Q&amp;amp;A&lt;/b&gt; (30 November), &lt;b&gt;Groups presentations&lt;/b&gt; for the 2nd assignment (1 and 2 December), &lt;b&gt;Lecture with manager&lt;/b&gt; (9 December, 10:30 am) and three &lt;b&gt;4-hour&lt;/b&gt; sessions titled &lt;b&gt;“VP – MA, Human rights, Business Technologies”&lt;/b&gt; (14, 15 and 17 December).&lt;/p&gt;

 &lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the final weeks of the course&quot;&gt;
  &lt;line x1=&quot;30&quot; x2=&quot;830&quot; y1=&quot;70&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot;/&gt;
  &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
   &lt;circle cx=&quot;60&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;16–25 Nov&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;100&quot; fill=&quot;var(--ink2)&quot;&gt;break&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;116&quot; fill=&quot;var(--ink2)&quot;&gt;intermediate tests&lt;/text&gt;
   &lt;circle cx=&quot;210&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;30 Nov&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;100&quot;&gt;Recap · Q&amp;amp;A&lt;/text&gt;
   &lt;circle cx=&quot;350&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;1–2 Dec&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;100&quot;&gt;Presentations&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;116&quot; fill=&quot;var(--ink2)&quot;&gt;2nd assignment&lt;/text&gt;
   &lt;circle cx=&quot;490&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;7–8 Dec&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;100&quot; fill=&quot;var(--ink2)&quot;&gt;holiday&lt;/text&gt;
   &lt;circle cx=&quot;610&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;oklch(60% 0.09 300)&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;9 Dec · 10:30&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;100&quot;&gt;Lecture with&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;116&quot;&gt;manager&lt;/text&gt;
   &lt;circle cx=&quot;760&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;oklch(60% 0.09 300)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;14·15·17 Dec&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;100&quot;&gt;VP · 3 × 4h&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;116&quot; fill=&quot;var(--ink2)&quot;&gt;MA, human rights,&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;132&quot; fill=&quot;var(--ink2)&quot;&gt;business tech.&lt;/text&gt;
  &lt;/g&gt;
 &lt;/svg&gt;

 &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; The slides give only the titles of the three final topics. Here is how they connect to the rest of the course:&lt;/p&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;vp1&quot;&gt;MA&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;vp2&quot;&gt;Human rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;vp3&quot;&gt;Business technologies&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp1&quot;&gt;&lt;h4&gt;Management Accounting (MA)&lt;/h4&gt;&lt;p&gt;Management accounting produces information for internal decisions: planning, control, performance evaluation. It differs from &lt;i&gt;financial accounting&lt;/i&gt;, which is aimed at external users and governed by accounting standards. The whole course falls within it: budgets and flexible budgets, responsibility centres, the BSC.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp2&quot; hidden&gt;&lt;h4&gt;Human rights&lt;/h4&gt;&lt;p&gt;Respect for human rights by businesses, including along the supply chain, is a quintessential “non-market” issue. The most widely cited international reference is the &lt;b&gt;UN Guiding Principles on Business and Human Rights&lt;/b&gt; (2011), with the &lt;i&gt;Protect, Respect and Remedy&lt;/i&gt; framework and the concept of &lt;i&gt;human rights due diligence&lt;/i&gt;. See the entry in &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;. For management accounting, the question is how to measure, report and incorporate these issues into control systems, for example in an SBSC.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp3&quot; hidden&gt;&lt;h4&gt;Business technologies&lt;/h4&gt;&lt;p&gt;Digital technologies (ERP, business intelligence and dashboards, automation, analytics and artificial intelligence) change the way data are collected and variances and KPIs are calculated, and therefore also the role of the controller. Scorecards become dashboards updated in near real time, but remain useful only if they are linked to the strategy.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;details class=&quot;terra&quot;&gt;&lt;summary&gt;How to prepare for the Recap and presentations&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
  &lt;li&gt;Review the logical chain of the course: &lt;b&gt;flexible budget → variances → responsibility → financial measures → BSC → SBSC&lt;/b&gt;.&lt;/li&gt;
  &lt;li&gt;For each tool, can you say what it is for, how it is calculated or built, what its limitations are and which subsequent tool overcomes them?&lt;/li&gt;
  &lt;li&gt;Bring the questions you collected during the break to the Recap on 30 November.&lt;/li&gt;
  &lt;li&gt;Check the news for any changes of date or room.&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz terra&quot;&gt;
  &lt;h3&gt;Self-assessment&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Summarise the thread of the course in one sentence.&lt;/summary&gt;&lt;div&gt;We start by comparing results with a budget adjusted to volume (flexible budget), assign variances to the managers responsible (responsibility accounting), overcome the limitations of purely financial measures with the BSC, and extend the BSC to the environment and society (SBSC). The final lectures broaden the scope to human rights and technologies.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In which SBSC perspective would you place human rights due diligence on suppliers?&lt;/summary&gt;&lt;div&gt;There are two possible answers: &lt;b&gt;internal process&lt;/b&gt; (supplier selection and audit process) if the integration approach is chosen, or the &lt;b&gt;non-market&lt;/b&gt; perspective if the focus is on the expectations of regulators, NGOs and communities.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
 &lt;div class=&quot;box tint terra&quot;&gt;
  &lt;p&gt;&lt;b&gt;Note:&lt;/b&gt; the source slide &lt;b&gt;does not cite&lt;/b&gt; any authors, texts, standards or websites, because it is only a schedule. Below are the classic references for &lt;i&gt;the topics listed in the schedule&lt;/i&gt;, found on the web. All of them are &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;: check with the lecturer which texts the course adopts.&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Simmonds, K. (1981), “Strategic management accounting”, &lt;i&gt;Management Accounting&lt;/i&gt; (UK)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the article, published in a British professional journal, that the literature credits with introducing the term &lt;i&gt;strategic management accounting&lt;/i&gt;. It defines it as information about the business and its competitors for developing and monitoring strategy. Secondary sources disagree on the exact page and wording.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it gives the course its name and explains why “strategic” management accounting looks outward, at markets and competitors.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://www.emerald.com/prr/article/4/2/129/323765/Revisiting-the-relevance-of-strategic-management&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald – “Revisiting the relevance of strategic management accounting” (review discussing Simmonds)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Datar, S. M. &amp;amp; Rajan, M. V., &lt;i&gt;Horngren&#x27;s Cost Accounting: A Managerial Emphasis&lt;/i&gt;, Global Edition, 17th ed., Pearson (2024)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the standard textbook on budgets and variances. In the 17th Global Edition, flexible budgets and direct-cost variances are in Chapter 7, overhead cost variances in Chapter 8. The textbook also covers responsibility centres and performance evaluation.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the textbook basis for sections 1 and 2 of this page (static/flexible budget, variance hierarchy, ROI and RI).&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://pearson.com/en-gb/subject-catalog/p/Datar-Horngren-s-Cost-Accounting-Global-Edition-17th-Edition/P200000004493/9781292436500&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson – book page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (1992), “The Balanced Scorecard – Measures That Drive Performance”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, Jan.-Feb., pp. 71-79&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the article that introduces the BSC. It stems from a 1990 multi-company research project in which intangible assets were central to value creation. It defines the scorecard as a set of measures that gives top management a fast but comprehensive view of the business, through four perspectives: customer, internal business, innovation and learning, financial.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the foundational text for section 3.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Management And Accounting Web – summary of the article&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (1996), “Using the Balanced Scorecard as a Strategic Management System”, &lt;i&gt;HBR&lt;/i&gt;, and the book &lt;i&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/i&gt;, Harvard Business School Press (1996)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What they contain:&lt;/b&gt; the shift from the BSC as a measurement system to a &lt;b&gt;strategic management system&lt;/b&gt;, with four processes: translating the vision, communicating and linking, business planning, feedback and learning. The article stresses that the ability to exploit intangible assets matters more than the ability to manage physical assets.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the “steps” in section 3 and of the link between the BSC and the budget.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://oreilly.com/library/view/hbrs-10-must/9781633699403/12601/OEBPS/xhtml/10_Using_th.xhtml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;O&#x27;Reilly – the article in the HBR&#x27;s 10 Must Reads on Strategy collection&lt;/a&gt; · &lt;a href=&quot;https://opexsociety.org/bookstore/balanced-scorecard-translating-strategy-action/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;book page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (2004), &lt;i&gt;Strategy Maps: Converting Intangible Assets into Tangible Outcomes&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; develops the &lt;b&gt;strategy map&lt;/b&gt; on the basis of the experience of hundreds of companies that have adopted the BSC. It shows how intangible assets link to value creation through four clusters of internal processes: operations management, customer management, innovation, regulatory and social processes.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it explains the cause-and-effect relationships in section 3. The “regulatory and social” process cluster serves as a bridge to the SBSC.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://is.muni.cz/publication/677618?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bibliographic record (Masaryk University)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Figge, F., Hahn, T., Schaltegger, S. &amp;amp; Wagner, M. (2002), “The Sustainability Balanced Scorecard – Linking Sustainability Management to Business Strategy”, &lt;i&gt;Business Strategy and the Environment&lt;/i&gt;, 11(5), pp. 269-284, doi:10.1002/bse.339&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; uses the BSC as a basis for integrating environmental and social aspects into the company&#x27;s management system. It discusses the possible forms of the SBSC and describes step by step how to build one for a business unit.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the classic reference for section 4 and, according to institutional pages, one of the most cited articles on the topic.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://www.izt.de/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IZT – publication record&lt;/a&gt; · &lt;a href=&quot;https://merit.url.edu/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-mana-4/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;university repository&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;United Nations (2011), &lt;i&gt;Guiding Principles on Business and Human Rights: Implementing the United Nations “Protect, Respect and Remedy” Framework&lt;/i&gt;, HR/PUB/11/4&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; 31 principles, each with a brief commentary, organised into three pillars: &lt;i&gt;Protect&lt;/i&gt; (the State duty), &lt;i&gt;Respect&lt;/i&gt; (the corporate responsibility) and &lt;i&gt;Remedy&lt;/i&gt; (access to remedy). The Human Rights Council endorsed them unanimously in resolution 17/4 of 16 June 2011. They are also known as the “Ruggie Principles” and are not a binding treaty.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the reference framework for the &lt;i&gt;human rights&lt;/i&gt; topic of the final lectures and for the social objectives of an SBSC.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library – text in several languages&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

  function vr(x,cost){if(Math.abs(x)&lt;0.5)return &#x27;&lt;span&gt;0&lt;/span&gt;&#x27;;var fav=cost?x&lt;0:x&gt;0;return &#x27;&lt;span class=&quot;&#x27;+(fav?&#x27;F&#x27;:&#x27;U&#x27;)+&#x27;&quot;&gt;&#x27;+Math.round(Math.abs(x)).toLocaleString(&#x27;en-GB&#x27;)+&#x27; &#x27;+(fav?&#x27;F&#x27;:&#x27;U&#x27;)+&#x27;&lt;/span&gt;&#x27;;}
  var fR=[&#x27;fqR&#x27;,&#x27;fpR&#x27;,&#x27;fvR&#x27;,&#x27;ffR&#x27;].map(function(id){return document.getElementById(id);});

    var L=[&#x27;Units&#x27;,&#x27;Revenues&#x27;,&#x27;Variable costs&#x27;,&#x27;Contribution margin&#x27;,&#x27;Fixed costs&#x27;,&#x27;Operating income&#x27;],cost=[0,0,1,0,1,0];

    L.forEach(function(l,i){var u=i===0;h+=&#x27;&lt;tr&#x27;+(i===5?&#x27; style=&quot;font-weight:600&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+l+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(u?A[i].toLocaleString(&#x27;en-GB&#x27;):eur(A[i]))+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(u?&#x27;—&#x27;:vr(A[i]-FB[i],cost[i]))+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(u?FB[i].toLocaleString(&#x27;en-GB&#x27;):eur(FB[i]))+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(u?&#x27;—&#x27;:vr(FB[i]-S[i],cost[i]))+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(u?S[i].toLocaleString(&#x27;en-GB&#x27;):eur(S[i]))+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;});

    s+=&#x27;&lt;line x1=&quot;40&quot; x2=&quot;590&quot; y1=&quot;&#x27;+base+&#x27;&quot; y2=&quot;&#x27;+base+&#x27;&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
    vals.forEach(function(r,i){var x=70+i*180,hh=Math.min(Math.abs(r[1])*sc,140),y=r[1]&gt;=0?base-hh:base;

      s+=&#x27;&lt;text x=&quot;&#x27;+(x+60)+&#x27;&quot; y=&quot;&#x27;+(base+(r[1]&lt;0?hh+30:18))+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;});

  // ROI vs RI

    m+=(roiYes!==good)?&#x27;&lt;span class=&quot;U&quot;&gt;ROI leads to a decision that is not congruent with the company\&#x27;s interest.&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;F&quot;&gt;In this case both measures lead to the same correct decision.&lt;/span&gt;&#x27;;
    document.getElementById(&#x27;rimsg&#x27;).innerHTML=m;
  }

  // BSC perspectives
  var BQ=[
    [&#x27;Financial perspective&#x27;,&#x27;&lt;i&gt;“To succeed financially, how should we appear to our shareholders?”&lt;/i&gt; Measures whether the strategy actually improves economic results. It is the top of the cause-and-effect chain.&#x27;,&#x27;Revenue growth, ROI, residual income / EVA, operating margin, cash flow, unit cost reduction.&#x27;],
    [&#x27;Customer perspective&#x27;,&#x27;&lt;i&gt;“To achieve our vision, how should we appear to our customers?”&lt;/i&gt; Defines the target segments and the &lt;b&gt;value proposition&lt;/b&gt; (price, quality, time, relationship, image).&#x27;,&#x27;Market share in the segment, customer retention and acquisition, satisfaction, customer profitability.&#x27;],

  var SB=[
