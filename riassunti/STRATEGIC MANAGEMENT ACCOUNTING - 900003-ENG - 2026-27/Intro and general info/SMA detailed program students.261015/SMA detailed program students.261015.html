  &lt;h1&gt;Il programma del corso, spiegato argomento per argomento&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;Dal &lt;em&gt;flexible budget&lt;/em&gt; alla &lt;em&gt;Sustainable Balanced Scorecard&lt;/em&gt;: che cosa si studia, in che ordine e perché ogni strumento prepara il successivo.&lt;/p&gt;
  &lt;div class=&quot;box terra tint&quot;&gt;
   &lt;p&gt;&lt;b&gt;Da dove viene questo materiale.&lt;/b&gt; Il file di partenza (&lt;code&gt;Intro and general info/SMA detailed program students.261015.pdf&lt;/code&gt;) è &lt;b&gt;una sola pagina&lt;/b&gt;: il calendario delle lezioni dal 19 ottobre al 17 dicembre, con data, giorno e titolo dell&#x27;argomento. Le slide non contengono definizioni, formule, autori o fonti.&lt;/p&gt;
   &lt;p&gt;Per questo la pagina usa tre etichette:
   &lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; per quello che c&#x27;è davvero nel PDF ·
   &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; per le spiegazioni manualistiche che il calendario dà per scontate ·
   &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; per ciò che è stato verificato sul web, sempre con il link.&lt;/p&gt;
   &lt;p class=&quot;note&quot;&gt;Non ho potuto consultare gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt;: con gli strumenti a mia disposizione non riesco a vederne il contenuto. Per questo nessuna parte della pagina viene da quei file. Quando arrivano le slide delle singole lezioni, confronta le integrazioni con le definizioni e le notazioni usate dal docente.&lt;/p&gt;
  &lt;/div&gt;

   &lt;text x=&quot;40&quot; y=&quot;294&quot; font-size=&quot;12&quot;&gt;• 1st Assignment (26 ott)&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;316&quot; font-size=&quot;12&quot;&gt;• Recap · Q&amp;amp;A (30 nov)&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;338&quot; font-size=&quot;12&quot;&gt;• Group presentations&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;354&quot; font-size=&quot;12&quot;&gt;(2nd assignment)&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;376&quot; font-size=&quot;12&quot;&gt;• Lecture with manager&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;392&quot; font-size=&quot;12&quot;&gt;(9 dic, ore 10:30)&lt;/text&gt;&lt;/a&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;Frecce piene: sequenza logica del programma. Tratteggio: la responsibility accounting fornisce le misure con cui valutare i manager, che la BSC poi integra con indicatori non finanziari. &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;/section&gt;

 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;0&lt;/span&gt;&lt;h2&gt;Il calendario: cosa dice davvero il PDF&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Il documento si intitola &lt;b&gt;Strategic Management Accounting A.Y. 2026-27&lt;/b&gt; e avverte: &lt;i&gt;“Here you may find the classes planning (always check news for updates)”&lt;/i&gt;. Il calendario può quindi cambiare: le novità vanno controllate nelle &lt;b&gt;news&lt;/b&gt; del corso.&lt;/p&gt;
 &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; &lt;b&gt;Strategic management accounting&lt;/b&gt; (SMA, contabilità direzionale strategica) è la parte della contabilità direzionale che produce informazioni per &lt;i&gt;formulare, attuare e controllare la strategia&lt;/i&gt;. Guarda quindi oltre i costi interni del breve periodo: mercato, concorrenti, obiettivi di lungo periodo, misure non finanziarie. Il programma segue proprio questo percorso, dagli strumenti di controllo di breve periodo (budget, centri di responsabilità) a quelli strategici (BSC e SBSC).&lt;/p&gt;

 &lt;div class=&quot;kpi&quot;&gt;

 &lt;div class=&quot;quiz terra&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Quante lezioni sono dedicate alla Balanced Scorecard, contando anche la versione sostenibile?&lt;/summary&gt;&lt;div&gt;Sei: quattro sulla &lt;i&gt;Balanced Scorecard&lt;/i&gt; (2, 3, 4 e 9 novembre) e due sulla &lt;i&gt;Sustainable Balanced Scorecard&lt;/i&gt; (10 e 11 novembre). È il blocco più lungo del corso.&lt;/div&gt;&lt;/details&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;flex&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Flexible budget&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Prima lezione del corso, &lt;b&gt;lunedì 19 ottobre&lt;/b&gt;. &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; per tutti i contenuti che seguono.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;Un budget fisso confronta il consuntivo con un piano pensato per un altro volume. Il &lt;em&gt;flexible budget&lt;/em&gt; ricalcola il piano al volume effettivo, così si confrontano grandezze omogenee.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Static budget&lt;/b&gt; (budget statico o &lt;i&gt;master budget&lt;/i&gt;): il budget preparato all&#x27;inizio del periodo per &lt;b&gt;un solo livello di attività&lt;/b&gt; previsto, per esempio 10.000 unità.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Flexible budget&lt;/b&gt; (budget flessibile): lo stesso budget &lt;b&gt;ricalcolato al livello di attività effettivo&lt;/b&gt;, usando prezzi e costi unitari di budget. Si costruisce a fine periodo, quando si conosce il volume reale.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Variable / fixed costs&lt;/b&gt;: i costi variabili cambiano in proporzione al volume, i costi fissi no, almeno entro il &lt;i&gt;relevant range&lt;/i&gt; (l&#x27;intervallo di attività in cui il comportamento dei costi resta valido).&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Variance&lt;/b&gt; (scostamento): differenza tra consuntivo e budget. È &lt;b&gt;F&lt;/b&gt; (&lt;i&gt;favorable&lt;/i&gt;, favorevole) se aumenta il reddito rispetto al piano e &lt;b&gt;U&lt;/b&gt; (&lt;i&gt;unfavorable&lt;/i&gt;, sfavorevole) se lo riduce.&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;formula&quot;&gt;Flexible budget = Fixed costs + (budgeted variable cost per unit × &lt;b&gt;actual&lt;/b&gt; output)&lt;/div&gt;

 &lt;h3&gt;Costruirlo in quattro passi&lt;/h3&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;① Rileva il volume effettivo&lt;/h4&gt;&lt;p&gt;Si parte dal dato che il budget statico non poteva conoscere: quante unità sono state davvero vendute o prodotte, per esempio 11.000 invece delle 10.000 previste.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;② Ricavi flessibili&lt;/h4&gt;&lt;p&gt;Prezzo di vendita &lt;b&gt;di budget&lt;/b&gt; × volume effettivo: 50 € × 11.000 = 550.000 €. Il prezzo resta quello di budget: l&#x27;effetto prezzo verrà isolato dopo.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;③ Costi variabili flessibili&lt;/h4&gt;&lt;p&gt;Costo variabile unitario &lt;b&gt;standard&lt;/b&gt; × volume effettivo: 30 € × 11.000 = 330.000 €. È quanto &lt;i&gt;avremmo dovuto&lt;/i&gt; spendere per quel volume.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;④ Costi fissi invariati&lt;/h4&gt;&lt;p&gt;I costi fissi restano quelli del budget statico (120.000 €), perché per definizione non dipendono dal volume entro il relevant range. Reddito flessibile: 550.000 − 330.000 − 120.000 = 100.000 €.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;La gerarchia degli scostamenti&lt;/h3&gt;
 &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Albero degli scostamenti: static-budget variance divisa in flexible-budget variance e sales-volume variance; la prima si divide in price e efficiency variance&quot;&gt;
  &lt;g fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;path d=&quot;M430 72 V100 H215 V128 M430 100 H645 V128&quot;/&gt;&lt;path d=&quot;M215 192 V214 H110 V236 M215 214 H320 V236&quot;/&gt;&lt;/g&gt;
  &lt;rect x=&quot;290&quot; y=&quot;16&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;430&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;Static-budget variance&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Actual − Static budget · livello 1&lt;/text&gt;
  &lt;rect x=&quot;85&quot; y=&quot;128&quot; width=&quot;260&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;215&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Flexible-budget variance&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Actual − Flexible · efficienza e prezzi&lt;/text&gt;
  &lt;rect x=&quot;515&quot; y=&quot;128&quot; width=&quot;260&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
  &lt;text x=&quot;645&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Sales-volume variance&lt;/text&gt;&lt;text x=&quot;645&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Flexible − Static · effetto volume&lt;/text&gt;
  &lt;rect x=&quot;20&quot; y=&quot;236&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
  &lt;text x=&quot;110&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Price variance&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;279&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;(AP − SP) × AQ&lt;/text&gt;
  &lt;rect x=&quot;230&quot; y=&quot;236&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
  &lt;text x=&quot;320&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Efficiency variance&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;279&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;(AQ − SQ) × SP&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;responsabilità tipica: marketing / vendite&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;= (Q effettive − Q budget) × margine unitario budget&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;AP/SP = actual/standard price per unità di input; AQ = quantità effettiva di input; SQ = quantità standard consentita per l&#x27;output effettivo.&lt;/p&gt;

 &lt;h3&gt;Simulatore: sposta il volume e guarda gli scostamenti&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;Budget statico: 10.000 unità, prezzo 50 €, costo variabile 30 €/unità, costi fissi 120.000 € → reddito 80.000 €. I cursori agiscono sul consuntivo.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Unità vendute effettive: &lt;output id=&quot;fq&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fqR&quot; min=&quot;6000&quot; max=&quot;14000&quot; step=&quot;250&quot; value=&quot;11000&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Prezzo effettivo: &lt;output id=&quot;fp&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fpR&quot; min=&quot;44&quot; max=&quot;56&quot; step=&quot;0.5&quot; value=&quot;49&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Costo variabile effettivo/unità: &lt;output id=&quot;fv&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fvR&quot; min=&quot;26&quot; max=&quot;34&quot; step=&quot;0.5&quot; value=&quot;31&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Costi fissi effettivi: &lt;output id=&quot;ff&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ffR&quot; min=&quot;100000&quot; max=&quot;140000&quot; step=&quot;2500&quot; value=&quot;125000&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;ftab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;svg viewBox=&quot;0 0 600 236&quot; id=&quot;fchart&quot; aria-label=&quot;Confronto dei redditi operativi&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
  &lt;p class=&quot;note&quot; id=&quot;fmsg&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;

 &lt;h3&gt;Livello 3: price ed efficiency variance, un esempio&lt;/h3&gt;
 &lt;div class=&quot;box tint&quot;&gt;
  &lt;p&gt;Standard: &lt;b&gt;2 kg&lt;/b&gt; di materia prima per unità a &lt;b&gt;5 €/kg&lt;/b&gt;. Output effettivo 10.000 unità → SQ = 20.000 kg. Consumo effettivo: &lt;b&gt;21.000 kg&lt;/b&gt; pagati &lt;b&gt;4,80 €/kg&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
   &lt;tr&gt;&lt;th&gt;Scostamento&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th&gt;Risultato&lt;/th&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Price variance&lt;/td&gt;&lt;td&gt;(4,80 − 5,00) × 21.000&lt;/td&gt;&lt;td class=&quot;F&quot;&gt;4.200 F&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Efficiency variance&lt;/td&gt;&lt;td&gt;(21.000 − 20.000) × 5,00&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;5.000 U&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Flexible-budget variance materiali&lt;/td&gt;&lt;td&gt;100.800 − 100.000&lt;/td&gt;&lt;td class=&quot;U&quot;&gt;800 U&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;L&#x27;ufficio acquisti ha spuntato un prezzo migliore, ma la produzione ha sprecato materiale. Magari è stato comprato materiale di qualità inferiore: per questo uno scostamento F non è automaticamente una buona notizia.&lt;/p&gt;
 &lt;/div&gt;

 &lt;details class=&quot;ochre&quot;&gt;&lt;summary&gt;Perché questo argomento apre un corso di &lt;i&gt;strategic&lt;/i&gt; management accounting?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il flexible budget risponde a una domanda di controllo: &lt;i&gt;a parità di volume, abbiamo lavorato bene?&lt;/i&gt; Separa ciò che dipende dal mercato (volume) da ciò che dipende dalla gestione (prezzi ed efficienza). È la base della lezione successiva: ogni scostamento va attribuito a &lt;b&gt;chi può controllarlo&lt;/b&gt;, ed è proprio l&#x27;idea dei &lt;i&gt;Responsibility Accounting Systems&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz ochre&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Le vendite superano il budget del 10% e i costi variabili totali superano il budget statico dell&#x27;8%. Il reparto è stato inefficiente?&lt;/summary&gt;&lt;div&gt;No, anzi: al volume effettivo il flexible budget prevede costi variabili &lt;b&gt;+10%&lt;/b&gt;. Una spesa del +8% dà quindi una flexible-budget variance &lt;b&gt;favorevole&lt;/b&gt;. Il confronto con il budget statico (+8%, “U”) ingannava.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale scostamento misura l&#x27;effetto del solo volume?&lt;/summary&gt;&lt;div&gt;La &lt;b&gt;sales-volume variance&lt;/b&gt; = flexible budget − static budget = (Q effettive − Q budget) × margine di contribuzione unitario di budget.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché i costi fissi sono uguali nel flexible e nello static budget?&lt;/summary&gt;&lt;div&gt;Perché entro il &lt;i&gt;relevant range&lt;/i&gt; non variano con il volume: “flettere” il budget agisce solo sulle voci variabili.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Price variance favorevole ed efficiency variance sfavorevole sugli stessi materiali: che ipotesi faresti?&lt;/summary&gt;&lt;div&gt;Acquisto di materiale più economico ma di qualità inferiore, che genera più scarti in produzione. I due scostamenti vanno letti insieme, e la responsabilità può stare nell&#x27;ufficio acquisti anche se lo scostamento compare in produzione.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;ras&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Responsibility Accounting Systems&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Tre lezioni: &lt;b&gt;20, 27 e 28 ottobre&lt;/b&gt;, a cavallo del 1st Assignment (26 ottobre). &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; per i contenuti.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;Un &lt;em&gt;responsibility accounting system&lt;/em&gt; (sistema di contabilità per centri di responsabilità) organizza budget, consuntivi e scostamenti &lt;b&gt;per persona responsabile&lt;/b&gt;: ogni manager riceve obiettivi e viene valutato solo su ciò che può influenzare.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility centre&lt;/b&gt; (centro di responsabilità): un&#x27;unità dell&#x27;organizzazione guidata da un manager che risponde di un insieme definito di attività e di risultati.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Controllability principle&lt;/b&gt; (principio di controllabilità): un manager va valutato solo sulle voci che può &lt;b&gt;controllare&lt;/b&gt; o influenzare in modo significativo. Le altre voci si mostrano a parte o si escludono.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Decentralisation&lt;/b&gt; (decentramento): delega di poteri decisionali ai livelli inferiori. Avvicina le decisioni all&#x27;informazione, ma rende necessari sistemi di misura che allineino gli obiettivi.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Goal congruence&lt;/b&gt; (congruenza degli obiettivi): un sistema funziona se, perseguendo i propri obiettivi, ogni manager persegue anche quelli dell&#x27;azienda nel suo insieme.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;I quattro tipi di centro&lt;/h3&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
   &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;rc1&quot;&gt;Cost centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc2&quot;&gt;Revenue centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc3&quot;&gt;Profit centre&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;rc4&quot;&gt;Investment centre&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc1&quot;&gt;&lt;h4&gt;Cost centre: risponde dei costi&lt;/h4&gt;&lt;p&gt;Esempi: uno stabilimento, un reparto di produzione, l&#x27;IT. Si distingue tra &lt;b&gt;standard (engineered) cost centre&lt;/b&gt;, dove c&#x27;è una relazione misurabile input-output e si usano costi standard e flexible budget, e &lt;b&gt;discretionary expense centre&lt;/b&gt; (R&amp;amp;D, ufficio legale, marketing istituzionale), dove l&#x27;output è difficile da misurare e si controlla soprattutto il rispetto dello stanziamento.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Misure tipiche:&lt;/b&gt; scostamenti di costo, costo unitario, efficienza.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc2&quot; hidden&gt;&lt;h4&gt;Revenue centre: risponde dei ricavi&lt;/h4&gt;&lt;p&gt;Esempi: un&#x27;area commerciale, la rete vendita. Il manager agisce su volumi e mix di vendita, spesso con poca autonomia sui prezzi e senza controllo sui costi di produzione.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Misure tipiche:&lt;/b&gt; ricavi, quote di mercato, sales-volume e sales-mix variances. Il rischio è spingere prodotti a basso margine pur di aumentare il fatturato.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc3&quot; hidden&gt;&lt;h4&gt;Profit centre: risponde di ricavi e costi&lt;/h4&gt;&lt;p&gt;Esempi: una business unit, un punto vendita, una linea di prodotto. Il manager decide su prezzi, mix e costi, quindi può bilanciare tra loro ricavi e costi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Misure tipiche:&lt;/b&gt; margine di contribuzione, &lt;i&gt;controllable margin&lt;/i&gt; (margine controllabile dal manager), reddito di divisione. Se i profit centre si scambiano beni, serve un &lt;b&gt;transfer price&lt;/b&gt; (prezzo di trasferimento interno).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;rc4&quot; hidden&gt;&lt;h4&gt;Investment centre: risponde di reddito e capitale investito&lt;/h4&gt;&lt;p&gt;Esempi: una divisione con autonomia sugli investimenti, una società controllata. È il livello più ampio di delega, perché il manager decide anche quanto capitale impiegare.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Misure tipiche:&lt;/b&gt; ROI, Residual Income, EVA (vedi sotto).&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;svg viewBox=&quot;0 0 860 260&quot; role=&quot;img&quot; aria-label=&quot;Organigramma con centri di responsabilità: CEO investment centre, divisioni profit o investment centre, stabilimenti cost centre, area vendite revenue centre, servizi discrezionali&quot;&gt;

  &lt;rect x=&quot;540&quot; y=&quot;104&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Divisione B&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;profit centre&lt;/text&gt;

  &lt;rect x=&quot;250&quot; y=&quot;194&quot; width=&quot;160&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Area vendite&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;231&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;revenue centre&lt;/text&gt;
  &lt;rect x=&quot;460&quot; y=&quot;194&quot; width=&quot;160&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;R&amp;amp;D&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;231&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;discretionary centre&lt;/text&gt;
  &lt;rect x=&quot;670&quot; y=&quot;194&quot; width=&quot;160&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Punto vendita&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;231&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;profit centre&lt;/text&gt;&lt;/g&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;I report di responsabilità risalgono la gerarchia: ogni livello vede il dettaglio delle proprie voci controllabili e un riepilogo dei livelli sottostanti.&lt;/p&gt;

 &lt;h3&gt;Misurare un investment centre&lt;/h3&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;ROI, Return on Investment&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ROI = Operating income / Invested capital&lt;/div&gt;&lt;p&gt;La scomposizione &lt;b&gt;DuPont&lt;/b&gt; mostra le due leve: &lt;br&gt;&lt;span style=&quot;font-family:var(--serif)&quot;&gt;ROI = (Income / Sales) × (Sales / Investment)&lt;/span&gt;, cioè &lt;i&gt;margine&lt;/i&gt; × &lt;i&gt;rotazione del capitale&lt;/i&gt;. È un rapporto, quindi permette di confrontare divisioni di dimensioni diverse.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;RI, Residual Income&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;RI = Operating income − (k × Invested capital)&lt;/div&gt;&lt;p&gt;&lt;i&gt;k&lt;/i&gt; = tasso minimo richiesto (&lt;i&gt;required rate of return&lt;/i&gt;, spesso il costo del capitale). È un valore assoluto: indica quanto reddito resta &lt;b&gt;dopo&lt;/b&gt; aver remunerato il capitale. L&#x27;&lt;b&gt;EVA&lt;/b&gt; (&lt;i&gt;Economic Value Added&lt;/i&gt;) ne è una variante: NOPAT − WACC × capitale investito, con rettifiche contabili.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Simulatore: il problema della goal congruence&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;Una divisione ha capitale investito 1.000.000 € e reddito 200.000 € (ROI 20%). Il costo del capitale aziendale è &lt;i&gt;k&lt;/i&gt;. Al manager viene proposto un nuovo progetto.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Investimento del progetto: &lt;output id=&quot;ri1&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riI&quot; min=&quot;100000&quot; max=&quot;800000&quot; step=&quot;50000&quot; value=&quot;400000&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Rendimento del progetto: &lt;output id=&quot;ri2&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riR&quot; min=&quot;4&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;15&quot;&gt;&lt;/div&gt;
   &lt;div&gt;&lt;label class=&quot;sl&quot;&gt;Costo del capitale k: &lt;output id=&quot;ri3&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;riK&quot; min=&quot;6&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;kpi&quot; id=&quot;rikpi&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;rimsg&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;

 &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Transfer pricing: quando i centri si vendono beni tra loro&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il &lt;b&gt;transfer price&lt;/b&gt; è il prezzo a cui una divisione cede beni o servizi a un&#x27;altra della stessa azienda. Per l&#x27;azienda nel suo insieme il reddito non cambia, ma il prezzo sposta il reddito tra le divisioni e quindi cambia la loro valutazione. Metodi tipici: &lt;b&gt;market-based&lt;/b&gt; (prezzo di mercato), &lt;b&gt;cost-based&lt;/b&gt; (costo variabile o pieno, eventualmente con un ricarico), &lt;b&gt;negotiated&lt;/b&gt; (prezzo negoziato). Un buon transfer price conserva la goal congruence e l&#x27;autonomia delle divisioni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Limiti dei sistemi basati solo su misure finanziarie&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ROI e RI misurano risultati di breve periodo: spingono a tagliare formazione, manutenzione o R&amp;amp;D per migliorare il reddito dell&#x27;anno (&lt;i&gt;short-termism&lt;/i&gt;). Dicono &lt;i&gt;quanto&lt;/i&gt; si è guadagnato, non &lt;i&gt;perché&lt;/i&gt;, e non dicono se si stanno costruendo le capacità per il futuro. Da qui nasce la &lt;b&gt;Balanced Scorecard&lt;/b&gt;, che completa le misure finanziarie con indicatori non finanziari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz brick&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Il responsabile di stabilimento viene penalizzato perché l&#x27;affitto della sede centrale, ribaltato sul suo reparto, è aumentato. Quale principio è violato?&lt;/summary&gt;&lt;div&gt;Il &lt;b&gt;controllability principle&lt;/b&gt;: l&#x27;affitto della sede non è controllabile dal responsabile di stabilimento, quindi va escluso dalla sua valutazione o mostrato separatamente.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra profit centre e investment centre?&lt;/summary&gt;&lt;div&gt;Entrambi rispondono di ricavi e costi, ma il manager di un investment centre decide anche sul &lt;b&gt;capitale investito&lt;/b&gt; e viene valutato con misure che lo includono (ROI, RI, EVA).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Divisione con ROI 20%, progetto al 15%, costo del capitale 12%. Che cosa fa un manager valutato sul ROI? E sul RI?&lt;/summary&gt;&lt;div&gt;Con il ROI rifiuta il progetto, perché abbassa il ROI medio della divisione. Con il RI lo accetta, perché il RI aumenta: (15% − 12%) × investimento &amp;gt; 0. Per l&#x27;azienda il progetto crea valore: il ROI genera un problema di &lt;b&gt;goal congruence&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Scrivi la scomposizione DuPont del ROI e spiega a cosa serve.&lt;/summary&gt;&lt;div&gt;ROI = (Income/Sales) × (Sales/Investment). Mostra se un ROI basso dipende da margini bassi o da capitale poco sfruttato, e quindi su quale leva agire.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;bsc&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Balanced Scorecard&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; È il blocco più lungo: &lt;b&gt;2, 3, 4 e 9 novembre&lt;/b&gt;. &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; per i contenuti. Le opere originali di Kaplan e Norton sono descritte in &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;La &lt;em&gt;Balanced Scorecard&lt;/em&gt; (BSC, “scheda di valutazione bilanciata”) traduce la strategia in un insieme limitato di obiettivi e misure, organizzato in quattro prospettive legate da relazioni di causa-effetto.&lt;/p&gt;
 &lt;p&gt;“Balanced” perché bilancia: misure &lt;b&gt;finanziarie e non finanziarie&lt;/b&gt;, indicatori di &lt;b&gt;risultato&lt;/b&gt; e &lt;b&gt;anticipatori&lt;/b&gt;, prospettiva &lt;b&gt;interna ed esterna&lt;/b&gt;, &lt;b&gt;breve e lungo periodo&lt;/b&gt;.&lt;/p&gt;

 &lt;h3&gt;Le quattro prospettive: clicca un riquadro&lt;/h3&gt;
 &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
  &lt;svg viewBox=&quot;0 0 420 420&quot; role=&quot;img&quot; aria-label=&quot;Le quattro prospettive della BSC attorno a visione e strategia&quot; id=&quot;bscsvg&quot;&gt;

   &lt;g class=&quot;bq&quot; data-k=&quot;1&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;280&quot; y=&quot;150&quot; width=&quot;130&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Customer&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;come ci vedono&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;234&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;i clienti?&lt;/text&gt;&lt;/g&gt;
   &lt;g class=&quot;bq&quot; data-k=&quot;2&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;150&quot; width=&quot;130&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;Internal&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;process&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;in cosa eccellere?&lt;/text&gt;&lt;/g&gt;
   &lt;g class=&quot;bq&quot; data-k=&quot;3&quot; tabindex=&quot;0&quot; role=&quot;button&quot; style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;280&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;330&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Learning &amp;amp; growth&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;352&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;possiamo migliorare e creare valore?&lt;/text&gt;&lt;/g&gt;

 &lt;p class=&quot;note&quot;&gt;Nella versione del 1992 la quarta prospettiva si chiama &lt;i&gt;innovation and learning&lt;/i&gt;; nelle opere successive diventa &lt;i&gt;learning and growth&lt;/i&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; (&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MAAW, sintesi di Kaplan &amp;amp; Norton 1992&lt;/a&gt;).&lt;/p&gt;

 &lt;h3&gt;Gli elementi di ogni prospettiva&lt;/h3&gt;
 &lt;div class=&quot;grid4&quot;&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Objectives&lt;/h4&gt;Che cosa vogliamo ottenere. &lt;i&gt;Es.: voli puntuali.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Measures&lt;/h4&gt;Come misuriamo il progresso (KPI). &lt;i&gt;Es.: % arrivi entro 15 minuti.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Targets&lt;/h4&gt;Il livello da raggiungere ed entro quando. &lt;i&gt;Es.: 92% entro dicembre.&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;mini&quot;&gt;&lt;h4&gt;Initiatives&lt;/h4&gt;Progetti e azioni per arrivarci. &lt;i&gt;Es.: nuovo programma di turnaround a terra.&lt;/i&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Cause-and-effect: la strategy map&lt;/h3&gt;
 &lt;p&gt;La BSC non è un elenco di KPI: le prospettive sono collegate da ipotesi di causa-effetto, dal basso verso l&#x27;alto. La &lt;b&gt;strategy map&lt;/b&gt; (mappa strategica) le rende visibili. Esempio classico di una compagnia aerea low cost, a scopo illustrativo:&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 860 400&quot; role=&quot;img&quot; aria-label=&quot;Strategy map di una compagnia aerea low cost dalla formazione al profitto&quot;&gt;
  &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
  &lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; font-weight=&quot;600&quot; letter-spacing=&quot;.05em&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;50&quot;&gt;FINANCIAL&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;148&quot;&gt;CUSTOMER&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;246&quot;&gt;INTERNAL&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;262&quot;&gt;PROCESS&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;346&quot;&gt;LEARNING&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;362&quot;&gt;&amp;amp; GROWTH&lt;/text&gt;&lt;/g&gt;
  &lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;0&quot; x2=&quot;860&quot; y1=&quot;96&quot; y2=&quot;96&quot;/&gt;&lt;line x1=&quot;0&quot; x2=&quot;860&quot; y1=&quot;196&quot; y2=&quot;196&quot;/&gt;&lt;line x1=&quot;0&quot; x2=&quot;860&quot; y1=&quot;296&quot; y2=&quot;296&quot;/&gt;&lt;/g&gt;
  &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar2)&quot;&gt;
   &lt;path d=&quot;M480 322 V278&quot;/&gt;&lt;path d=&quot;M480 232 V180&quot;/&gt;&lt;path d=&quot;M480 232 C560 210 640 200 700 180&quot;/&gt;&lt;path d=&quot;M480 134 C480 110 420 90 400 72&quot;/&gt;&lt;path d=&quot;M700 134 C700 110 620 80 560 64&quot;/&gt;&lt;path d=&quot;M290 232 C300 150 330 100 350 72&quot;/&gt;
  &lt;/g&gt;
  &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;320&quot; y=&quot;26&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;54&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Profitto e crescita dei ricavi&lt;/text&gt;
   &lt;rect x=&quot;390&quot; y=&quot;134&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;162&quot;&gt;Voli puntuali&lt;/text&gt;
   &lt;rect x=&quot;620&quot; y=&quot;134&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;705&quot; y=&quot;162&quot;&gt;Tariffe basse&lt;/text&gt;
   &lt;rect x=&quot;380&quot; y=&quot;232&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;260&quot;&gt;Turnaround a terra rapido&lt;/text&gt;
   &lt;rect x=&quot;190&quot; y=&quot;232&quot; width=&quot;170&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;260&quot;&gt;Meno aerei a terra&lt;/text&gt;
   &lt;rect x=&quot;370&quot; y=&quot;322&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;23&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;350&quot;&gt;Formazione del personale di terra&lt;/text&gt;
  &lt;/g&gt;
  &lt;path d=&quot;M380 255 H364&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;cap&quot;&gt;Ogni freccia è un&#x27;ipotesi da verificare nel tempo. Se la formazione aumenta ma la puntualità no, la strategia va rivista, non solo il KPI.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lag indicators&lt;/b&gt; (indicatori di risultato, &lt;i&gt;outcome measures&lt;/i&gt;): misurano ciò che è già successo, come il ROI o la quota di mercato. Arrivano tardi.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lead indicators&lt;/b&gt; (indicatori anticipatori, &lt;i&gt;performance drivers&lt;/i&gt;): misurano le leve che producono i risultati futuri, come le ore di formazione o i tempi di ciclo. Permettono di correggere in tempo.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Da sistema di misura a sistema di gestione strategica&lt;/h3&gt;
 &lt;p&gt;Nelle opere successive (1996) Kaplan e Norton descrivono la BSC come un ciclo di quattro processi di gestione. Scorri i passi:&lt;/p&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Translating the vision&lt;/h4&gt;&lt;p&gt;Il top management trasforma visione e strategia in obiettivi e misure operativi e condivisi. Frasi come “essere il fornitore preferito” diventano obiettivi misurabili.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Communicating and linking&lt;/h4&gt;&lt;p&gt;La strategia viene comunicata a tutti i livelli e collegata agli obiettivi dei reparti e dei singoli, ed eventualmente agli incentivi (&lt;i&gt;cascading&lt;/i&gt;, cioè scorecard “a cascata” per le unità).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Business planning&lt;/h4&gt;&lt;p&gt;Budget, allocazione delle risorse e iniziative vengono allineati agli obiettivi della scorecard, fissando &lt;i&gt;targets&lt;/i&gt; e tappe intermedie. Qui la BSC si collega al budget visto nella sezione 1.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Feedback and learning&lt;/h4&gt;&lt;p&gt;Le revisioni periodiche non si limitano a verificare i numeri: mettono alla prova le ipotesi di causa-effetto (&lt;i&gt;double-loop learning&lt;/i&gt;, apprendimento “a doppio anello”) e aggiornano la strategia.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Confronto: responsibility accounting tradizionale e BSC&lt;/summary&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Aspetto&lt;/th&gt;&lt;th&gt;Sistemi tradizionali&lt;/th&gt;&lt;th&gt;Balanced Scorecard&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Misure&lt;/td&gt;&lt;td&gt;Quasi solo finanziarie&lt;/td&gt;&lt;td&gt;Finanziarie e non finanziarie&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Orizzonte&lt;/td&gt;&lt;td&gt;Periodo corrente&lt;/td&gt;&lt;td&gt;Breve e lungo periodo&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Tipo di indicatori&lt;/td&gt;&lt;td&gt;Lag (risultato)&lt;/td&gt;&lt;td&gt;Lag e lead&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Punto di partenza&lt;/td&gt;&lt;td&gt;Struttura organizzativa&lt;/td&gt;&lt;td&gt;Strategia&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Funzione&lt;/td&gt;&lt;td&gt;Controllo e valutazione&lt;/td&gt;&lt;td&gt;Comunicazione, allineamento, apprendimento&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Errori frequenti nell&#x27;implementazione&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
  &lt;li&gt;Troppi indicatori: la scorecard diventa un cruscotto e non racconta più la strategia (spesso si citano 15-25 misure come ordine di grandezza).&lt;/li&gt;
  &lt;li&gt;Indicatori scollegati tra loro, senza una logica causa-effetto.&lt;/li&gt;
  &lt;li&gt;Copiare la scorecard di un&#x27;altra azienda: le misure devono discendere dalla &lt;i&gt;propria&lt;/i&gt; strategia.&lt;/li&gt;
  &lt;li&gt;Progetto delegato a controllo di gestione o IT, senza il coinvolgimento del top management.&lt;/li&gt;
  &lt;li&gt;Legare subito gli incentivi a misure non ancora validate.&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz slate&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Elenca le quattro prospettive e la domanda guida di ciascuna.&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Financial&lt;/b&gt;: come ci vedono gli azionisti? · &lt;b&gt;Customer&lt;/b&gt;: come ci vedono i clienti? · &lt;b&gt;Internal process&lt;/b&gt;: in quali processi dobbiamo eccellere? · &lt;b&gt;Learning &amp;amp; growth&lt;/b&gt;: possiamo continuare a migliorare e creare valore?&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Le “ore di formazione per dipendente” sono un lead o un lag indicator?&lt;/summary&gt;&lt;div&gt;Un &lt;b&gt;lead indicator&lt;/b&gt;: anticipa i miglioramenti futuri di processi, clienti e risultati finanziari.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché si dice che la BSC è “balanced”?&lt;/summary&gt;&lt;div&gt;Perché bilancia misure finanziarie e non finanziarie, indicatori di risultato e anticipatori, prospettiva interna ed esterna (azionisti e clienti), breve e lungo periodo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che cos&#x27;è una strategy map e a cosa serve?&lt;/summary&gt;&lt;div&gt;È la rappresentazione grafica delle relazioni causa-effetto tra gli obiettivi delle quattro prospettive. Serve a comunicare la strategia e a rendere verificabili le ipotesi su cui si basa.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quali sono i quattro processi di gestione della BSC?&lt;/summary&gt;&lt;div&gt;Translating the vision · Communicating and linking · Business planning · Feedback and learning.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;sbsc&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Sustainable Balanced Scorecard&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Due lezioni: &lt;b&gt;10 e 11 novembre&lt;/b&gt;, subito dopo la BSC e prima della pausa per le prove intermedie. Il corso la chiama &lt;i&gt;Sustainable&lt;/i&gt; BSC. In letteratura si trova spesso come &lt;i&gt;Sustainability Balanced Scorecard&lt;/i&gt; (SBSC).&lt;/p&gt;
 &lt;p class=&quot;lead&quot;&gt;La SBSC porta gli aspetti &lt;b&gt;ambientali e sociali&lt;/b&gt; dentro lo strumento con cui l&#x27;azienda gestisce la strategia, invece di lasciarli in un report di sostenibilità separato.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Triple bottom line&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;: l&#x27;idea che la performance si misuri su tre dimensioni, &lt;i&gt;economic, environmental, social&lt;/i&gt; (spesso riassunte in “profit, planet, people”).&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Non-market perspective&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;: l&#x27;ambiente in cui l&#x27;azienda opera &lt;i&gt;fuori&lt;/i&gt; dal mercato, cioè comunità, regolatori, ONG, opinione pubblica. Lì le relazioni non passano per prezzi e contratti, ma possono influenzare fortemente i risultati.&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Tre modi di costruire una SBSC&lt;/h3&gt;
 &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Figge, Hahn, Schaltegger e Wagner (2002) confrontano le possibili forme di una SBSC e descrivono come costruirla per una business unit (&lt;a href=&quot;https://www.izt.de/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda IZT&lt;/a&gt;). Le tre varianti che seguono sono la classificazione usata comunemente in letteratura: confrontala con le slide della lezione.&lt;/p&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;sb1&quot;&gt;① Integrazione&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;sb2&quot;&gt;② Quinta prospettiva&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;sb3&quot;&gt;③ Scorecard derivata&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb1&quot;&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;Quattro prospettive con elementi di sostenibilità integrati&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;45&quot;&gt;Financial&lt;/text&gt;
    &lt;rect x=&quot;108&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;45&quot;&gt;Customer&lt;/text&gt;
    &lt;rect x=&quot;206&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;248&quot; y=&quot;45&quot;&gt;Process&lt;/text&gt;
    &lt;rect x=&quot;304&quot; y=&quot;20&quot; width=&quot;85&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;346&quot; y=&quot;45&quot;&gt;Learning&lt;/text&gt;
    &lt;g fill=&quot;var(--sage)&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;80&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;150&quot; cy=&quot;95&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;235&quot; cy=&quot;75&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;262&quot; cy=&quot;105&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;346&quot; cy=&quot;88&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;Gli obiettivi ambientali e sociali si inseriscono &lt;b&gt;dentro le quattro prospettive classiche&lt;/b&gt;, come cerchi verdi accanto agli altri obiettivi. Esempi: riduzione dei consumi energetici (process), prodotti eco-progettati (customer), sicurezza e competenze (learning). &lt;b&gt;Pro:&lt;/b&gt; la sostenibilità entra nella catena causa-effetto. &lt;b&gt;Contro:&lt;/b&gt; restano fuori i temi che non passano per il mercato.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb2&quot; hidden&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;Quattro prospettive più una quinta non-market&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;6&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;41&quot; y=&quot;45&quot;&gt;Financial&lt;/text&gt;
    &lt;rect x=&quot;84&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;119&quot; y=&quot;45&quot;&gt;Customer&lt;/text&gt;
    &lt;rect x=&quot;162&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;197&quot; y=&quot;45&quot;&gt;Process&lt;/text&gt;
    &lt;rect x=&quot;240&quot; y=&quot;20&quot; width=&quot;70&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;45&quot;&gt;Learning&lt;/text&gt;
    &lt;rect x=&quot;318&quot; y=&quot;20&quot; width=&quot;76&quot; height=&quot;110&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;356&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;Non-&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;61&quot; font-weight=&quot;600&quot;&gt;market&lt;/text&gt;
    &lt;g fill=&quot;var(--sage)&quot;&gt;&lt;circle cx=&quot;345&quot; cy=&quot;90&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;370&quot; cy=&quot;110&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;Si aggiunge una &lt;b&gt;quinta prospettiva&lt;/b&gt; per i temi che influenzano il successo dell&#x27;azienda &lt;b&gt;al di fuori del mercato&lt;/b&gt;: licenza sociale a operare, rapporti con comunità e regolatori, reputazione. &lt;b&gt;Pro:&lt;/b&gt; dà visibilità ai temi non di mercato. &lt;b&gt;Contro:&lt;/b&gt; serve un vero legame con le altre prospettive, altrimenti la sostenibilità resta un&#x27;appendice.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sb3&quot; hidden&gt;
   &lt;svg viewBox=&quot;0 0 400 150&quot; role=&quot;img&quot; aria-label=&quot;BSC principale da cui si deriva una scorecard ambientale e sociale&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;150&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;70&quot; font-weight=&quot;600&quot;&gt;BSC&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;88&quot;&gt;(4 o 5 prospettive)&lt;/text&gt;
    &lt;path d=&quot;M170 75 H222&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;rect x=&quot;228&quot; y=&quot;30&quot; width=&quot;155&quot; height=&quot;90&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;Environmental &amp;amp;&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;83&quot; font-weight=&quot;600&quot;&gt;social scorecard&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;102&quot; font-size=&quot;11&quot;&gt;derivata&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;p&gt;Dalla scorecard principale si &lt;b&gt;deriva una scorecard specifica&lt;/b&gt; per ambiente e società, per esempio per la funzione che gestisce la sostenibilità. &lt;b&gt;Pro:&lt;/b&gt; permette di coordinare i temi ESG nel dettaglio. &lt;b&gt;Contro:&lt;/b&gt; se non c&#x27;è prima l&#x27;integrazione (① o ②), la scorecard derivata diventa un documento parallelo, scollegato dalla strategia.&lt;/p&gt;
  &lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Dove metteresti questo tema? Prova&lt;/h3&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;p class=&quot;note&quot;&gt;Scegli un tema di sostenibilità: vedrai una possibile collocazione nella scorecard con l&#x27;approccio ① e con l&#x27;approccio ②. Sono collocazioni plausibili a scopo didattico: le stesse scelte dipendono dalla strategia della singola azienda.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; id=&quot;sbchips&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sbout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Come si costruisce, a grandi linee&lt;/h3&gt;
 &lt;div class=&quot;steps box&quot;&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Scegliere l&#x27;unità&lt;/h4&gt;&lt;p&gt;Si lavora su una &lt;b&gt;strategic business unit&lt;/b&gt; con una strategia definita: la SBSC non inventa la strategia, la rende operativa.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Mappare l&#x27;esposizione&lt;/h4&gt;&lt;p&gt;Si identificano gli aspetti &lt;b&gt;ambientali&lt;/b&gt; (emissioni, energia, rifiuti, materiali…) e &lt;b&gt;sociali&lt;/b&gt; (lavoratori, fornitori, comunità, diritti umani…) che riguardano l&#x27;unità.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Valutare la rilevanza strategica&lt;/h4&gt;&lt;p&gt;Per ogni aspetto ci si chiede se e come incida sulla strategia: è un obiettivo strategico in sé, una leva che spinge altri obiettivi, o un requisito minimo da rispettare?&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Collocare e misurare&lt;/h4&gt;&lt;p&gt;Gli aspetti rilevanti diventano obiettivi, misure, target e iniziative nelle prospettive, eventualmente in una quinta prospettiva non-market. Vanno collegati con frecce causa-effetto alla prospettiva finanziaria.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; sintesi didattica, basata sulla descrizione del processo nel lavoro di Figge et al. (2002). Per i dettagli vedi &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

 &lt;details class=&quot;sage&quot;&gt;&lt;summary&gt;Una tensione da discutere: business case o sostenibilità “vera”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nella BSC tutte le frecce portano in alto, al risultato finanziario. Se si integra la sostenibilità nella stessa logica, si rischia di considerare solo i temi ambientali e sociali che “rendono” (il &lt;i&gt;business case for sustainability&lt;/i&gt;). Gran parte della letteratura successiva discute proprio come tenere conto dei temi importanti per la società anche quando il loro legame con il profitto è debole o incerto. È un buon punto da preparare per il 2nd assignment e per le lezioni su &lt;i&gt;human rights&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz sage&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Quali sono le tre varianti di SBSC?&lt;/summary&gt;&lt;div&gt;① Integrazione di obiettivi ambientali e sociali nelle quattro prospettive esistenti · ② aggiunta di una quinta prospettiva &lt;i&gt;non-market&lt;/i&gt; · ③ una scorecard ambientale e sociale &lt;i&gt;derivata&lt;/i&gt; da quella principale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché può servire una prospettiva “non-market”?&lt;/summary&gt;&lt;div&gt;Perché alcuni fattori decisivi, come le relazioni con le comunità locali, la regolamentazione o la legittimazione sociale, non passano per clienti e mercati e quindi non trovano posto nelle quattro prospettive classiche.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Qual è il rischio di una scorecard di sostenibilità separata e non collegata alla BSC principale?&lt;/summary&gt;&lt;div&gt;Che la sostenibilità resti un&#x27;attività parallela, senza legami con la strategia e con le decisioni su budget e incentivi: il cosiddetto &lt;i&gt;decoupling&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;vp&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Chiusura del corso: verifiche, manager e lezioni “VP”&lt;/h2&gt;&lt;/div&gt;
 &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; Dopo la pausa (16–25 novembre) il corso riprende con: &lt;b&gt;Recap – Q&amp;amp;A&lt;/b&gt; (30 novembre), &lt;b&gt;Groups presentations&lt;/b&gt; del 2nd assignment (1 e 2 dicembre), &lt;b&gt;Lecture with manager&lt;/b&gt; (9 dicembre, ore 10:30) e tre incontri da &lt;b&gt;4 ore&lt;/b&gt; intitolati &lt;b&gt;“VP – MA, Human rights, Business Technologies”&lt;/b&gt; (14, 15 e 17 dicembre).&lt;/p&gt;

  &lt;line x1=&quot;30&quot; x2=&quot;830&quot; y1=&quot;70&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot;/&gt;

   &lt;circle cx=&quot;760&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;oklch(60% 0.09 300)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;46&quot; font-weight=&quot;600&quot;&gt;14·15·17 dic&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;100&quot;&gt;VP · 3 × 4h&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;116&quot; fill=&quot;var(--ink2)&quot;&gt;MA, human rights,&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;132&quot; fill=&quot;var(--ink2)&quot;&gt;business tech.&lt;/text&gt;

 &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Le slide danno solo i titoli dei tre temi finali. Ecco come si collegano al resto del corso:&lt;/p&gt;
 &lt;div data-tabs&gt;
  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;vp1&quot;&gt;MA&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;vp2&quot;&gt;Human rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;vp3&quot;&gt;Business technologies&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp1&quot;&gt;&lt;h4&gt;Management Accounting (MA)&lt;/h4&gt;&lt;p&gt;La contabilità direzionale produce informazioni per decisioni interne: pianificazione, controllo, valutazione delle performance. È diversa dalla &lt;i&gt;financial accounting&lt;/i&gt;, rivolta a destinatari esterni e regolata da principi contabili. Tutto il corso ne fa parte: budget e flexible budget, centri di responsabilità, BSC.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp2&quot; hidden&gt;&lt;h4&gt;Human rights&lt;/h4&gt;&lt;p&gt;Il rispetto dei diritti umani da parte delle imprese, anche lungo la catena di fornitura, è un tema “non-market” per eccellenza. Il riferimento internazionale più citato sono i &lt;b&gt;UN Guiding Principles on Business and Human Rights&lt;/b&gt; (2011), con il quadro &lt;i&gt;Protect, Respect and Remedy&lt;/i&gt; e il concetto di &lt;i&gt;human rights due diligence&lt;/i&gt;. Vedi la scheda in &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;. Per il management accounting la domanda è come misurare, rendicontare e incorporare questi temi nei sistemi di controllo, per esempio in una SBSC.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;vp3&quot; hidden&gt;&lt;h4&gt;Business technologies&lt;/h4&gt;&lt;p&gt;Le tecnologie digitali (ERP, business intelligence e dashboard, automazione, analytics e intelligenza artificiale) cambiano il modo di raccogliere dati e calcolare scostamenti e KPI, e quindi anche il ruolo del controller. Le scorecard diventano cruscotti aggiornati in tempo quasi reale, ma restano utili solo se legate alla strategia.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;details class=&quot;terra&quot;&gt;&lt;summary&gt;Come prepararsi a Recap e presentazioni&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
  &lt;li&gt;Ripassa la catena logica del corso: &lt;b&gt;flexible budget → scostamenti → responsabilità → misure finanziarie → BSC → SBSC&lt;/b&gt;.&lt;/li&gt;
  &lt;li&gt;Per ogni strumento sai dire: a cosa serve, come si calcola o si costruisce, quali sono i limiti e quale strumento successivo li supera?&lt;/li&gt;
  &lt;li&gt;Porta al Recap del 30 novembre le domande raccolte durante la pausa.&lt;/li&gt;
  &lt;li&gt;Controlla le news per eventuali cambi di data o di aula.&lt;/li&gt;
 &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz terra&quot;&gt;
  &lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Ricostruisci in una frase il filo del corso.&lt;/summary&gt;&lt;div&gt;Si parte dal confrontare i risultati con un budget adattato al volume (flexible budget), si attribuiscono gli scostamenti ai responsabili (responsibility accounting), si superano i limiti delle sole misure finanziarie con la BSC e si estende la BSC a ambiente e società (SBSC). Le lezioni finali allargano a diritti umani e tecnologie.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In quale prospettiva di una SBSC collocheresti la human rights due diligence sui fornitori?&lt;/summary&gt;&lt;div&gt;Ci sono due risposte possibili: &lt;b&gt;internal process&lt;/b&gt; (processo di selezione e audit dei fornitori) se si sceglie l&#x27;integrazione, oppure la prospettiva &lt;b&gt;non-market&lt;/b&gt; se si guarda alle aspettative di regolatori, ONG e comunità.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
 &lt;div class=&quot;box tint terra&quot;&gt;
  &lt;p&gt;&lt;b&gt;Attenzione:&lt;/b&gt; la slide di partenza &lt;b&gt;non cita&lt;/b&gt; autori, testi, norme o siti, perché è solo un calendario. Qui sotto trovi i riferimenti classici per &lt;i&gt;gli argomenti elencati nel calendario&lt;/i&gt;, cercati sul web. Tutto è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;: verifica con il docente quali testi adotta il corso.&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Simmonds, K. (1981), “Strategic management accounting”, &lt;i&gt;Management Accounting&lt;/i&gt; (UK)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;articolo, uscito su una rivista professionale britannica, a cui la letteratura attribuisce l&#x27;introduzione del termine &lt;i&gt;strategic management accounting&lt;/i&gt;. Lo definisce come informazione sull&#x27;azienda e sui suoi concorrenti per sviluppare e monitorare la strategia. Le fonti secondarie non concordano sulla pagina e sulla formulazione esatta.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà il nome al corso e spiega perché la contabilità direzionale “strategica” guarda all&#x27;esterno, a mercati e concorrenti.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://www.emerald.com/prr/article/4/2/129/323765/Revisiting-the-relevance-of-strategic-management&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald – “Revisiting the relevance of strategic management accounting” (rassegna che discute Simmonds)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Datar, S. M. &amp;amp; Rajan, M. V., &lt;i&gt;Horngren&#x27;s Cost Accounting: A Managerial Emphasis&lt;/i&gt;, Global Edition, 17ª ed., Pearson (2024)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il manuale di riferimento per budget e scostamenti. Nell&#x27;edizione Global 17ª i flexible budget e gli scostamenti dei costi diretti sono al capitolo 7, quelli dei costi generali (overhead) al capitolo 8. Il manuale tratta anche i centri di responsabilità e la valutazione delle performance.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la base manualistica delle sezioni 1 e 2 di questa pagina (static/flexible budget, gerarchia degli scostamenti, ROI e RI).&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://pearson.com/en-gb/subject-catalog/p/Datar-Horngren-s-Cost-Accounting-Global-Edition-17th-Edition/P200000004493/9781292436500&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson – scheda del volume&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (1992), “The Balanced Scorecard – Measures That Drive Performance”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, gen.-feb., pp. 71-79&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;articolo che introduce la BSC. Nasce da una ricerca del 1990 su più aziende in cui gli asset intangibili erano centrali per creare valore. Definisce la scorecard come un insieme di misure che dà al top management una visione rapida ma completa dell&#x27;azienda, attraverso quattro prospettive: customer, internal business, innovation and learning, financial.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il testo fondativo della sezione 3.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Management And Accounting Web – sintesi dell&#x27;articolo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (1996), “Using the Balanced Scorecard as a Strategic Management System”, &lt;i&gt;HBR&lt;/i&gt;, e il libro &lt;i&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/i&gt;, Harvard Business School Press (1996)&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contengono:&lt;/b&gt; il passaggio dalla BSC come sistema di misura a &lt;b&gt;sistema di gestione strategica&lt;/b&gt;, con i quattro processi: tradurre la visione, comunicare e collegare, pianificare, feedback e apprendimento. L&#x27;articolo sottolinea che la capacità di sfruttare gli asset intangibili conta più di quella di gestire gli asset fisici.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la fonte dei “passi” della sezione 3 e del collegamento tra BSC e budget.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://oreilly.com/library/view/hbrs-10-must/9781633699403/12601/OEBPS/xhtml/10_Using_th.xhtml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;O&#x27;Reilly – l&#x27;articolo nella raccolta HBR&#x27;s 10 Must Reads on Strategy&lt;/a&gt; · &lt;a href=&quot;https://opexsociety.org/bookstore/balanced-scorecard-translating-strategy-action/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda del libro&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. &amp;amp; Norton, D. P. (2004), &lt;i&gt;Strategy Maps: Converting Intangible Assets into Tangible Outcomes&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; sviluppa la &lt;b&gt;strategy map&lt;/b&gt; sulla base dell&#x27;esperienza di centinaia di aziende che hanno adottato la BSC. Mostra come gli asset intangibili si collegano alla creazione di valore attraverso quattro gruppi di processi interni: operations, gestione dei clienti, innovazione, processi regolatori e sociali.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; spiega le relazioni causa-effetto della sezione 3. Il gruppo di processi “regulatory and social” fa da ponte verso la SBSC.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://is.muni.cz/publication/677618?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda bibliografica (Masaryk University)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Figge, F., Hahn, T., Schaltegger, S. &amp;amp; Wagner, M. (2002), “The Sustainability Balanced Scorecard – Linking Sustainability Management to Business Strategy”, &lt;i&gt;Business Strategy and the Environment&lt;/i&gt;, 11(5), pp. 269-284, doi:10.1002/bse.339&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; usa la BSC come base per integrare gli aspetti ambientali e sociali nel sistema di gestione dell&#x27;azienda. Discute le possibili forme della SBSC e descrive passo per passo come costruirne una per una business unit.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento classico per la sezione 4 e, secondo le pagine istituzionali, uno degli articoli più citati sul tema.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://www.izt.de/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-management-to-business-strategy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IZT – scheda della pubblicazione&lt;/a&gt; · &lt;a href=&quot;https://merit.url.edu/en/publications/the-sustainability-balanced-scorecard-linking-sustainability-mana-4/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;repository universitario&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Nazioni Unite (2011), &lt;i&gt;Guiding Principles on Business and Human Rights: Implementing the United Nations “Protect, Respect and Remedy” Framework&lt;/i&gt;, HR/PUB/11/4&lt;/h4&gt;
  &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; 31 principi, ciascuno con un breve commento, organizzati nei tre pilastri &lt;i&gt;Protect&lt;/i&gt; (dovere degli Stati), &lt;i&gt;Respect&lt;/i&gt; (responsabilità delle imprese) e &lt;i&gt;Remedy&lt;/i&gt; (accesso ai rimedi). Il Consiglio per i diritti umani li ha approvati all&#x27;unanimità con la risoluzione 17/4 del 16 giugno 2011. Sono noti anche come “Ruggie Principles” e non sono un trattato vincolante.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il quadro di riferimento per il tema &lt;i&gt;human rights&lt;/i&gt; delle lezioni finali e per gli obiettivi sociali di una SBSC.&lt;/p&gt;
  &lt;p&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library – testo in più lingue&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;script&gt;
(function(){
  // linguette
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(g){
    var btns=g.querySelectorAll(&#x27;.tabs button&#x27;);
    btns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===b?&#x27;true&#x27;:&#x27;false&#x27;);var p=document.getElementById(x.dataset.p);if(p)p.hidden=(x!==b);});
    });});
  });
