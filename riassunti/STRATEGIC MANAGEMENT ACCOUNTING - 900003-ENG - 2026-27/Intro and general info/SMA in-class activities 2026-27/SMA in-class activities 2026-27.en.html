*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.62 &quot;IBM Plex Sans&quot;,system-ui,sans-serif}

&lt;section class=&quot;part p-slate&quot; id=&quot;regole&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PART 1&quot;&gt;Who counts as an &lt;em&gt;attending student&lt;/em&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;The course offers &lt;strong&gt;voluntary&lt;/strong&gt; in-class activities (&lt;em class=&quot;en&quot;&gt;voluntary in-class activities&lt;/em&gt;). The lecturers assess them and the assessment counts towards the final grade. Participants are considered &lt;em class=&quot;en&quot;&gt;attending students&lt;/em&gt; and receive &lt;em&gt;a discount on the final exam&lt;/em&gt;: a shorter exam.&lt;/p&gt;
    &lt;div class=&quot;quote&quot;&gt;&quot;Students will be considered attending students &lt;u&gt;only if they participate in both&lt;/u&gt; in-class activities. Students participating only in one of the two activities will be considered non-attending students.&quot;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Attending student&lt;/dt&gt;&lt;dd&gt;Has registered participation by 8 October &lt;em&gt;and&lt;/em&gt; has completed both activities. Shorter final exam + bonus points.&lt;/dd&gt;
        &lt;dt&gt;Non-attending student&lt;/dt&gt;&lt;dd&gt;Anyone who did not register, or took part in only one activity, or in neither. Sits the full exam.&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;div class=&quot;card tint&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;The rule as a logical formula&lt;/h4&gt;
        &lt;div class=&quot;formula&quot; style=&quot;margin:6px 0&quot;&gt;attending = registration ∧ FB ∧ BSC&lt;/div&gt;
        &lt;p class=&quot;note&quot;&gt;∧ means &quot;and&quot; (AND): if even a single condition is missing, the status is lost. This is the point the document stresses (it is the only underlined sentence).&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Try it: what would your status be?&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;Toggle the conditions on or off. The tool applies the document&#x27;s rules literally.&lt;/p&gt;
    &lt;div class=&quot;toggles&quot; id=&quot;stTog&quot;&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;d&quot;&gt;Registered by 8 October&lt;/button&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;f&quot;&gt;Flexible Budget assignment&lt;/button&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;b&quot;&gt;Balanced Scorecard group work&lt;/button&gt;

    &lt;div class=&quot;out&quot; id=&quot;stOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-assessment&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;I did the Flexible Budget assignment but I am skipping the BSC case discussion. Am I an attending student?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No. Students who take part in only one of the two activities are &lt;em&gt;non-attending&lt;/em&gt;. The document does not say whether the assignment points are counted anyway: if in doubt, ask the lecturers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Where do you register your participation?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Through a dedicated quiz on &lt;em&gt;SMA e-learning&lt;/em&gt;, the course&#x27;s online platform, by 8 October.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What exactly does an attending student gain?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Two advantages: (1) up to 2 + 3 = 5 points added to the exam grade; (2) a final exam that is shorter than the one taken by non-attending students.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;flexible&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PART 3 · ACTIVITY NO. 1&quot;&gt;Assignment on &lt;em&gt;Flexible Budget&lt;/em&gt;&lt;/h2&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p style=&quot;margin-top:0&quot;&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;&lt;strong&gt;Format:&lt;/strong&gt; &lt;strong&gt;individual&lt;/strong&gt; assignment, set during a lecture. Students work &lt;em&gt;autonomously&lt;/em&gt; and submit &lt;strong&gt;at the end of the lecture&lt;/strong&gt;. It is worth &lt;strong&gt;0-2 points&lt;/strong&gt; on the exam grade.&lt;/p&gt;
      &lt;p class=&quot;note&quot; style=&quot;margin-bottom:0&quot;&gt;The document does not explain what a flexible budget is: the rest of this section is an &lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt; of standard theory, useful for preparation.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Static budget and flexible budget&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Static budget&lt;/dt&gt;
        &lt;dd&gt;The budget prepared at the start of the period for &lt;strong&gt;a single&lt;/strong&gt; planned level of activity (e.g. 10,000 units sold). It does not change even if actual volumes differ.&lt;/dd&gt;
        &lt;dt&gt;Flexible budget&lt;/dt&gt;
        &lt;dd&gt;The same budget &lt;strong&gt;recalculated at the end of the period for the actual volume&lt;/strong&gt;, keeping the budgeted standard prices and unit costs. It answers the question: &lt;em&gt;how much should we have spent and earned, given the volume we actually achieved?&lt;/em&gt;&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Variable cost&lt;/dt&gt;&lt;dd&gt;A cost that rises in proportion to volume (raw materials, sales commissions). In the flexible budget it &quot;flexes&quot;.&lt;/dd&gt;
        &lt;dt&gt;Fixed cost&lt;/dt&gt;&lt;dd&gt;A cost that does not change within the relevant range of activity (rent, fixed salaries). In the flexible budget it stays equal to the static budget.&lt;/dd&gt;
        &lt;dt&gt;Contribution margin&lt;/dt&gt;&lt;dd&gt;Revenue − variable costs; per unit: selling price − variable cost per unit.&lt;/dd&gt;
      &lt;/dl&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Flexible budget = (std price − std variable cost per unit) × &lt;strong&gt;actual volume&lt;/strong&gt; − budgeted fixed costs&lt;/div&gt;

    &lt;h3&gt;Why it matters: comparing like with like&lt;/h3&gt;
    &lt;p&gt;If you sold more than planned, actual variable costs will be higher than in the static budget. Comparing them directly would make a department look &quot;inefficient&quot; when it has simply produced more. The flexible budget separates the two effects:&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Levels of variance analysis&quot; class=&quot;figure&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Static budget&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;planned volume, std values&lt;/text&gt;
      &lt;rect x=&quot;340&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;actual volume, std values&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;770&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;actual volume, actual values&lt;/text&gt;
      &lt;path d=&quot;M240 140 L340 140&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Sales-volume variance&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;volume effect&lt;/text&gt;
      &lt;path d=&quot;M560 140 L660 140&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Flexible-budget variance&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;price and efficiency effect&lt;/text&gt;
      &lt;path d=&quot;M130 30 Q450 -10 770 30&quot; stroke=&quot;var(--muted)&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;Static-budget variance (total) = sum of the two&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;Levels of variance&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;v0&quot; id=&quot;t-v0&quot;&gt;Level 0&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v1&quot; id=&quot;t-v1&quot;&gt;Level 1&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v2&quot; id=&quot;t-v2&quot;&gt;Level 2&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v3&quot; id=&quot;t-v3&quot;&gt;F / U&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v0&quot; aria-labelledby=&quot;t-v0&quot;&gt;&lt;p&gt;&lt;strong&gt;Static-budget variance&lt;/strong&gt; = actual result − static budget. It tells you &lt;em&gt;how much&lt;/em&gt; results deviated, not &lt;em&gt;why&lt;/em&gt;. It is the least informative level.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v1&quot; aria-labelledby=&quot;t-v1&quot; hidden&gt;&lt;p&gt;It is broken down into:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Sales-volume variance = (Q&lt;sub&gt;act&lt;/sub&gt; − Q&lt;sub&gt;budget&lt;/sub&gt;) × std unit contribution margin&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Flexible-budget variance = actual result − flexible budget&lt;/div&gt;&lt;p&gt;The former is typically the responsibility of marketing/sales; the latter concerns prices and costs.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v2&quot; aria-labelledby=&quot;t-v2&quot; hidden&gt;&lt;p&gt;The flexible-budget variance is in turn broken down line by line:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Selling-price variance = (P&lt;sub&gt;act&lt;/sub&gt; − P&lt;sub&gt;std&lt;/sub&gt;) × Q&lt;sub&gt;act&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Variable-cost variance = (VC&lt;sub&gt;std&lt;/sub&gt; − VC&lt;sub&gt;act&lt;/sub&gt;) × Q&lt;sub&gt;act&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Fixed-cost (spending) variance = FC&lt;sub&gt;budget&lt;/sub&gt; − FC&lt;sub&gt;act&lt;/sub&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;In full courses the variable-cost variance is further split into a &lt;em&gt;price variance&lt;/em&gt; (price of inputs) and an &lt;em&gt;efficiency variance&lt;/em&gt; (quantity of inputs per unit): check in the course lectures how far the analysis goes.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v3&quot; aria-labelledby=&quot;t-v3&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;F&quot;&gt;F = Favorable&lt;/span&gt;: the variance increases operating income (higher revenue or lower costs than planned). &lt;span class=&quot;U&quot;&gt;U = Unfavorable&lt;/span&gt;: it reduces it. Mind the sign on costs: a cost &lt;em&gt;higher&lt;/em&gt; than budget is U.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Lab: move the sliders&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;Fictitious example. Budget: 10,000 units, price €20, variable cost €12/unit, fixed costs €50,000 → operating income €30,000. Change the actual values and see how the variance breaks down.&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;qa&quot;&gt;Actual units sold&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qa&quot; min=&quot;7000&quot; max=&quot;13000&quot; step=&quot;100&quot; value=&quot;11000&quot;&gt;&lt;output id=&quot;qaO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pa&quot;&gt;Actual price €/unit&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pa&quot; min=&quot;16&quot; max=&quot;24&quot; step=&quot;0.5&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;paO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;va&quot;&gt;Actual variable cost €/unit&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;va&quot; min=&quot;9&quot; max=&quot;15&quot; step=&quot;0.25&quot; value=&quot;12.5&quot;&gt;&lt;output id=&quot;vaO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fa&quot;&gt;Actual fixed costs €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fa&quot; min=&quot;40000&quot; max=&quot;60000&quot; step=&quot;500&quot; value=&quot;52000&quot;&gt;&lt;output id=&quot;faO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;tblwrap&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table id=&quot;fbT&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart of the variances&quot; style=&quot;margin-top:14px&quot;&gt;&lt;/svg&gt;
      &lt;p class=&quot;figcap&quot;&gt;Waterfall chart (&lt;em&gt;waterfall&lt;/em&gt;): from static-budget income to actual income, through each variance. Green = F, red = U.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;How to approach the in-class assignment&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;steps&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div data-step&gt;&lt;h4&gt;1 · Classify the costs&lt;/h4&gt;&lt;p&gt;Separate variable and fixed costs; calculate the standard unit values (price, variable cost per unit, unit contribution margin).&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;2 · Rebuild the static budget&lt;/h4&gt;&lt;p&gt;Revenue, variable costs, contribution margin, fixed costs and operating income at the planned volume.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;3 · Build the flexible budget&lt;/h4&gt;&lt;p&gt;Same structure, but multiply the standard unit values by the &lt;strong&gt;actual volume&lt;/strong&gt;. Fixed costs remain at their budgeted level.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;4 · Calculate and classify the variances&lt;/h4&gt;&lt;p&gt;Sales-volume variance (static vs flexible) and flexible-budget variance (flexible vs actual), line by line; label each one F or U. Check that the sum reconciles with the total variance.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;5 · Comment&lt;/h4&gt;&lt;p&gt;Explain the possible causes (discounts to push volumes? more expensive raw materials?) and who is responsible. Time is limited to the lecture: leave a few minutes to check the totals.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-assessment&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;In the flexible budget, do fixed costs change with actual volume?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No: within the relevant range they stay equal to the static budget. Only revenue and variable costs &quot;flex&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Budget 10,000 units, actual 11,000 units, std contribution margin €8/unit. Sales-volume variance?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;(11,000 − 10,000) × 8 = €8,000 &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Actual variable cost is €12.50/unit against a standard of €12/unit, on 11,000 units. Variance?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;(12 − 12.5) × 11,000 = −€5,500 → €5,500 &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why can comparing actual costs with the static budget be misleading?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Because it mixes the volume effect with the efficiency/price effect: if more is produced, variable costs rise without any inefficiency.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;bsc&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PART 4 · ACTIVITY NO. 2&quot;&gt;Work group on &lt;em&gt;Balanced Scorecard&lt;/em&gt;&lt;/h2&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p style=&quot;margin-top:0&quot;&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;The lecturers form &lt;strong&gt;groups of 4-5 students&lt;/strong&gt; who discuss a &lt;em class=&quot;en&quot;&gt;case study&lt;/em&gt; focused on the Balanced Scorecard. Groups and cases are presented in a lecture; the groups then have &lt;strong&gt;7-10 days&lt;/strong&gt; to work independently and prepare a &lt;strong&gt;PowerPoint presentation to be sent in advance&lt;/strong&gt; to the lecturers. The discussion takes place over &lt;strong&gt;two lectures&lt;/strong&gt; and &lt;strong&gt;all group members&lt;/strong&gt; must attend. It is worth &lt;strong&gt;0-3 points&lt;/strong&gt;, awarded to every member.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;The group&#x27;s process&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;steps&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div data-step&gt;&lt;h4&gt;1 · Kick-off lecture&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;The lecturers announce the group composition (you do not choose your groups) and the assigned case.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;2 · Independent work (7-10 days)&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;The group analyses the case. &lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;It is advisable to split up the four perspectives but to bring them back together as a group: the value of the BSC lies in the links between them.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;3 · PowerPoint presentation&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;To be prepared and &lt;strong&gt;sent in advance&lt;/strong&gt; to the lecturers. &lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;A useful structure: company strategy → strategy map → table of objectives/measures/targets/initiatives → critical issues and recommendations.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;4 · In-class discussion&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;It takes place over two lectures; all members must be present.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;5 · Assessment&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;0-3 points, the same for all group members, added to each student&#x27;s individual grade in the final exam.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;What the Balanced Scorecard is&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;The &lt;em class=&quot;en&quot;&gt;Balanced Scorecard&lt;/em&gt; (BSC) is a performance measurement system proposed by Robert S. Kaplan and David P. Norton in 1992. The underlying idea: financial measures alone are &lt;em class=&quot;en&quot;&gt;lagging indicators&lt;/em&gt; (they record outcomes that have already occurred) and are not sufficient to steer strategy. They must be &lt;strong&gt;balanced&lt;/strong&gt; with non-financial measures that act as &lt;em class=&quot;en&quot;&gt;leading indicators&lt;/em&gt; (they signal future outcomes). Over time the BSC evolved from a measurement system into a tool for translating strategy into action.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;The four perspectives&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;p1&quot; id=&quot;t-p1&quot;&gt;Financial&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p2&quot; id=&quot;t-p2&quot;&gt;Customer&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p3&quot; id=&quot;t-p3&quot;&gt;Internal process&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p4&quot; id=&quot;t-p4&quot;&gt;Learning &amp;amp; growth&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p1&quot; aria-labelledby=&quot;t-p1&quot;&gt;&lt;p&gt;&lt;strong&gt;Guiding question:&lt;/strong&gt; how do shareholders see us? To succeed financially, what results must we deliver?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Typical measures:&lt;/strong&gt; ROI, revenue growth, operating margin, cash flow, EVA.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p2&quot; aria-labelledby=&quot;t-p2&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Guiding question:&lt;/strong&gt; how do customers see us? What value must we offer them?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Typical measures:&lt;/strong&gt; market share, customer satisfaction, customer retention, new customer acquisition, customer profitability.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p3&quot; aria-labelledby=&quot;t-p3&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Guiding question:&lt;/strong&gt; which internal processes must we excel at to satisfy customers and shareholders?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Typical measures:&lt;/strong&gt; cycle time, defect rate, on-time delivery, cost per process, number of new products.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p4&quot; aria-labelledby=&quot;t-p4&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Guiding question:&lt;/strong&gt; how can we sustain our ability to change and improve? (in the 1992 article: &lt;em&gt;innovation and learning perspective&lt;/em&gt;)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Typical measures:&lt;/strong&gt; training and skills, employee satisfaction and turnover, information system availability, suggestions implemented.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Strategy map: the cause-and-effect chain&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;A &lt;em class=&quot;en&quot;&gt;strategy map&lt;/em&gt; (Kaplan &amp;amp; Norton 2000) depicts the objectives of the four perspectives and the cause-and-effect relationships between them: from the bottom (people and systems) up to the top (financial results). Click an objective to see how it translates into a measure, a target and an initiative.&lt;/p&gt;
    &lt;figure class=&quot;figure&quot;&gt;
    &lt;svg class=&quot;smap&quot; id=&quot;smap&quot; viewBox=&quot;0 0 900 420&quot; role=&quot;group&quot; aria-label=&quot;Example strategy map&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect class=&quot;band&quot; x=&quot;10&quot; y=&quot;15&quot; width=&quot;880&quot; height=&quot;90&quot; rx=&quot;8&quot;/&gt;&lt;rect class=&quot;band&quot; x=&quot;10&quot; y=&quot;115&quot; width=&quot;880&quot; height=&quot;90&quot; rx=&quot;8&quot;/&gt;&lt;rect class=&quot;band&quot; x=&quot;10&quot; y=&quot;215&quot; width=&quot;880&quot; height=&quot;90&quot; rx=&quot;8&quot;/&gt;&lt;rect class=&quot;band&quot; x=&quot;10&quot; y=&quot;315&quot; width=&quot;880&quot; height=&quot;90&quot; rx=&quot;8&quot;/&gt;
      &lt;text class=&quot;bl&quot; x=&quot;24&quot; y=&quot;36&quot;&gt;FINANCIAL&lt;/text&gt;&lt;text class=&quot;bl&quot; x=&quot;24&quot; y=&quot;136&quot;&gt;CUSTOMER&lt;/text&gt;&lt;text class=&quot;bl&quot; x=&quot;24&quot; y=&quot;236&quot;&gt;INTERNAL PROCESS&lt;/text&gt;&lt;text class=&quot;bl&quot; x=&quot;24&quot; y=&quot;336&quot;&gt;LEARNING &amp;amp; GROWTH&lt;/text&gt;
      &lt;path class=&quot;ar&quot; d=&quot;M290 337 L290 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 337 L650 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 337 L330 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;path class=&quot;ar&quot; d=&quot;M290 237 L290 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 237 L650 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M330 237 L610 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;path class=&quot;ar&quot; d=&quot;M290 137 L290 85&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 137 L650 85&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M610 137 L330 85&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;0&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;37&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot;&gt;Revenue growth&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;1&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;37&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot;&gt;Return on capital&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;2&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;137&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Acquire new customers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;3&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;137&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Retain customers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;4&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;237&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;265&quot; text-anchor=&quot;middle&quot;&gt;On-time delivery&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;5&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;237&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;265&quot; text-anchor=&quot;middle&quot;&gt;Zero-defect quality&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;6&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;337&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot;&gt;Employee skills&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;7&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;337&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot;&gt;Integrated information systems&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption class=&quot;figcap&quot;&gt;Fictitious teaching example (generic manufacturing company): it does not reproduce a course case.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;out&quot; id=&quot;smOut&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Select an objective on the map.&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;The elements of a scorecard&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Objective&lt;/dt&gt;&lt;dd&gt;What we want to achieve (e.g. retain customers).&lt;/dd&gt;
        &lt;dt&gt;Measure / KPI&lt;/dt&gt;&lt;dd&gt;How we measure progress (&lt;em class=&quot;en&quot;&gt;Key Performance Indicator&lt;/em&gt;; e.g. repeat purchase rate).&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Target&lt;/dt&gt;&lt;dd&gt;The level to be reached by a given date (e.g. 80% within 12 months).&lt;/dd&gt;
        &lt;dt&gt;Initiative&lt;/dt&gt;&lt;dd&gt;The project or action undertaken to reach the target (e.g. a loyalty programme).&lt;/dd&gt;
      &lt;/dl&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Common mistakes when analysing a BSC case&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;ul&gt;
      &lt;li&gt;Too many measures: a scorecard should focus on a few indicators per perspective.&lt;/li&gt;
      &lt;li&gt;Measures not linked to strategy: the BSC starts from strategy, not from the indicators already available.&lt;/li&gt;
      &lt;li&gt;Only lagging indicators: without leading indicators the scorecard anticipates nothing.&lt;/li&gt;
      &lt;li&gt;No cause-and-effect link: the four perspectives treated as four separate lists.&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-assessment&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What are the four perspectives of the Balanced Scorecard?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Financial, Customer, Internal (business) process, Learning &amp;amp; growth (in 1992: innovation and learning).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Is employee satisfaction a leading or a lagging indicator of ROI?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Leading: it moves first and, through the cause-and-effect chain (processes → customers), anticipates financial results.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why is it called &quot;balanced&quot;?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;It balances financial and non-financial measures, short-term and long-term, internal and external, outcome (lagging) and driver (leading) measures.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;A group member cannot attend one of the two discussion lectures. What does the document say?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;That all members must take part in the discussion. Absence is not addressed: it must be agreed with the lecturers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;valutazione&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PART 5&quot;&gt;Assessment and final exam&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt;The points from the activities are &lt;strong&gt;added&lt;/strong&gt; to the grade obtained in the final exam:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;No. 1 · individual&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;0 – 2&lt;/strong&gt; points&lt;p class=&quot;note&quot;&gt;Flexible Budget, awarded to each student.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;No. 2 · group&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;0 – 3&lt;/strong&gt; points&lt;p class=&quot;note&quot;&gt;Balanced Scorecard, the same for all members.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Exam&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;shorter&lt;/strong&gt;&lt;p class=&quot;note&quot;&gt;for attending students compared with non-attending students.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Grade simulator&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;addition&lt;/span&gt;Assumption: exam grade out of 30, as is customary in Italian universities, with points added directly. The document does &lt;strong&gt;not&lt;/strong&gt; specify the scale, the granularity of the points, or what happens above 30 (honours, &lt;em&gt;lode&lt;/em&gt;?): ask the lecturers.&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ex&quot;&gt;Exam grade (shorter exam)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ex&quot; min=&quot;18&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;exO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pf&quot;&gt;Flexible Budget points&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pf&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.5&quot; value=&quot;1.5&quot;&gt;&lt;output id=&quot;pfO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pb&quot;&gt;BSC points (group)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pb&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;pbO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg id=&quot;gb&quot; viewBox=&quot;0 0 640 70&quot; role=&quot;img&quot; aria-label=&quot;Grade breakdown&quot; style=&quot;margin-top:10px&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;out&quot; id=&quot;gOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-assessment&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What is the maximum total bonus for an attending student?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;2 + 3 = 5 points.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Is the BSC score individual?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No: it is awarded to the group and added to the individual grade of every member.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-accent&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;FURTHER READING&quot;&gt;Texts and resources&lt;/h2&gt;
    &lt;p&gt;The document cites no authors or texts: it only mentions the University of Bergamo (Department of Management) and the course&#x27;s internal &lt;em&gt;SMA e-learning&lt;/em&gt; platform. The entries below are the key references for the two tools used in the activities. Each entry is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;: always check which texts the course syllabus adopts.&lt;/p&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Course page &quot;Strategic Management Accounting&quot;, University of Bergamo&lt;/h4&gt;&lt;p&gt;Taught in English, 9 ECTS credits, 72 hours, first semester (14/09–18/12/2026 in the 2026-27 offering); it presents &lt;em&gt;management control systems&lt;/em&gt; as a fundamental dimension of every organisation, whether profit, non-profit or public.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the official source for the syllabus, lecturers and exam arrangements, which the PDF does not report. &lt;a href=&quot;https://unibg.unifind.cineca.it/resource/af/654637-170967-COMUNE-1_1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.unifind.cineca.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (1992), &quot;The Balanced Scorecard — Measures That Drive Performance&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, Jan-Feb, pp. 71-79&lt;/h4&gt;&lt;p&gt;The article that introduced the BSC, arising from a 1990 research project with 12 companies: it complements financial measures with those of the customer, internal process, and innovation and learning perspectives.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the origin of the concept on which activity No. 2 is based. &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on maaw.info (J.R. Martin)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (1996), &lt;em&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/em&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;The book that systematises the BSC: four perspectives (financial, customer, internal process, learning and growth) and the use of the scorecard as a strategic management system, not merely a measurement system.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the comprehensive reference for building a scorecard in a business case. &lt;a href=&quot;https://www.oreilly.com/library/view/the-balanced-scorecard/9781422148167/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher&#x27;s page (O&#x27;Reilly)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (2000), &quot;Having Trouble with Your Strategy? Then Map It&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt; 78(5), pp. 167-176&lt;/h4&gt;&lt;p&gt;Introduces the &lt;em&gt;strategy map&lt;/em&gt;: the four BSC areas linked by cause-and-effect relationships, illustrated with the example of Mobil North American Marketing and Refining.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it helps you present the group case by showing the links between objectives, rather than just a list of KPIs. &lt;a href=&quot;https://www.hbs.edu/faculty/Pages/item.aspx?num=6720&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Lumen Learning, &lt;em&gt;Managerial Accounting&lt;/em&gt; — &quot;Flexible Budget Variance&quot;&lt;/h4&gt;&lt;p&gt;Open textbook with explanations and numerical examples of the flexible budget, sales-volume variance and flexible-budget variance.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: useful for practising the calculations of activity No. 1; it is secondary teaching material, to be compared with the course textbook. &lt;a href=&quot;https://courses.lumenlearning.com/wm-managerialaccounting/chapter/flexible-budget-variance/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;courses.lumenlearning.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;

&lt;/footer&gt;

&lt;script&gt;
(function(){
&quot;use strict&quot;;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var NS=&quot;http://www.w3.org/2000/svg&quot;;
function fmt(n,d){return Number(n).toLocaleString(&quot;en-GB&quot;,{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e}

/* tabs */
$$(&quot;[data-tabs]&quot;).forEach(function(box){
  var tabs=$$(&quot;[role=tab]&quot;,box);
  function sel(t){tabs.forEach(function(b){var on=b===t;b.setAttribute(&quot;aria-selected&quot;,on);b.tabIndex=on?0:-1;document.getElementById(b.getAttribute(&quot;aria-controls&quot;)).hidden=!on})}
  tabs.forEach(function(t,i){
    t.addEventListener(&quot;click&quot;,function(){sel(t)});
    t.addEventListener(&quot;keydown&quot;,function(e){var j=e.key===&quot;ArrowRight&quot;?i+1:e.key===&quot;ArrowLeft&quot;?i-1:null;if(j===null)return;var n=tabs[(j+tabs.length)%tabs.length];sel(n);n.focus()});
  });
  sel(tabs[0]);
});

/* steppers */
$$(&quot;[data-stepper]&quot;).forEach(function(st){
  var steps=$$(&quot;[data-step]&quot;,st),dots=$(&quot;.steps&quot;,st),cur=0,bs=[];
  steps.forEach(function(s,i){var b=document.createElement(&quot;button&quot;);b.type=&quot;button&quot;;b.className=&quot;dot&quot;;b.textContent=i+1;b.setAttribute(&quot;aria-label&quot;,&quot;Step &quot;+(i+1));b.addEventListener(&quot;click&quot;,function(){go(i)});dots.appendChild(b);bs.push(b)});
  function go(i){cur=Math.max(0,Math.min(steps.length-1,i));steps.forEach(function(s,j){s.hidden=j!==cur});bs.forEach(function(b,j){if(j===cur)b.setAttribute(&quot;aria-current&quot;,&quot;step&quot;);else b.removeAttribute(&quot;aria-current&quot;)});$(&quot;[data-prev]&quot;,st).disabled=cur===0;$(&quot;[data-next]&quot;,st).disabled=cur===steps.length-1}
  $(&quot;[data-prev]&quot;,st).addEventListener(&quot;click&quot;,function(){go(cur-1)});
  $(&quot;[data-next]&quot;,st).addEventListener(&quot;click&quot;,function(){go(cur+1)});
  go(0);
});

/* status simulator */
var st={d:false,f:false,b:false};
function status(){
  var o=$(&quot;#stOut&quot;),h;
  if(st.d&amp;&amp;st.f&amp;&amp;st.b)h=&#x27;&lt;strong class=&quot;big&quot; style=&quot;color:var(--good)&quot;&gt;Attending student&lt;/strong&gt;Shorter final exam and up to &lt;strong&gt;+5 points&lt;/strong&gt; (0-2 Flexible Budget + 0-3 Balanced Scorecard).&#x27;;
  else{
    var miss=[];if(!st.d)miss.push(&quot;registration by 8 October&quot;);if(!st.f)miss.push(&quot;the Flexible Budget assignment&quot;);if(!st.b)miss.push(&quot;the BSC group work&quot;);
    h=&#x27;&lt;strong class=&quot;big&quot; style=&quot;color:var(--bad)&quot;&gt;Non-attending student&lt;/strong&gt;Missing: &#x27;+miss.join(&quot;, &quot;)+&#x27;. Full exam.&#x27;;
    if(st.f!==st.b&amp;&amp;(st.f||st.b))h+=&#x27;&lt;br&gt;&lt;span class=&quot;note&quot;&gt;One activity alone is not enough. The document does not say whether its points are counted anyway.&lt;/span&gt;&#x27;;
  }
  o.innerHTML=h;
}
$$(&quot;#stTog .tg&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var k=b.dataset.k;st[k]=!st[k];b.setAttribute(&quot;aria-pressed&quot;,st[k]);status()})});
status();

/* flexible budget lab */
var B={q:10000,p:20,v:12,f:50000};
function fbv(x,cost){if(Math.abs(x)&lt;0.5)return &#x27;&lt;span&gt;0&lt;/span&gt;&#x27;;var good=cost?x&lt;0:x&gt;0;return &#x27;&lt;span class=&quot;&#x27;+(good?&quot;F&quot;:&quot;U&quot;)+&#x27;&quot;&gt;&#x27;+fmt(Math.abs(x))+&quot; &quot;+(good?&quot;F&quot;:&quot;U&quot;)+&quot;&lt;/span&gt;&quot;}
function lab(){
  var qa=+$(&quot;#qa&quot;).value,pa=+$(&quot;#pa&quot;).value,va=+$(&quot;#va&quot;).value,fa=+$(&quot;#fa&quot;).value;
  $(&quot;#qaO&quot;).textContent=fmt(qa);$(&quot;#paO&quot;).textContent=fmt(pa,2)+&quot; €&quot;;$(&quot;#vaO&quot;).textContent=fmt(va,2)+&quot; €&quot;;$(&quot;#faO&quot;).textContent=fmt(fa)+&quot; €&quot;;
  var A={rev:pa*qa,vc:va*qa,fc:fa},F={rev:B.p*qa,vc:B.v*qa,fc:B.f},S={rev:B.p*B.q,vc:B.v*B.q,fc:B.f};
  [A,F,S].forEach(function(x){x.cm=x.rev-x.vc;x.oi=x.cm-x.fc});
  var rows=[[&quot;Units&quot;,qa,qa,B.q,null],[&quot;Revenue&quot;,&quot;rev&quot;,0],[&quot;Variable costs&quot;,&quot;vc&quot;,1],[&quot;Contribution margin&quot;,&quot;cm&quot;,0],[&quot;Fixed costs&quot;,&quot;fc&quot;,1],[&quot;Operating income&quot;,&quot;oi&quot;,0]];
  var h=&#x27;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Flexible-budget var.&lt;/th&gt;&lt;th&gt;Flexible budget&lt;/th&gt;&lt;th&gt;Sales-volume var.&lt;/th&gt;&lt;th&gt;Static budget&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  rows.forEach(function(r){
    if(r[4]===null){h+=&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa)+&#x27;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa-B.q)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(B.q)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;return}
    var k=r[1],c=r[2],b=k===&quot;oi&quot;?&#x27; style=&quot;font-weight:700&quot;&#x27;:&#x27;&#x27;;
    h+=&#x27;&lt;tr&#x27;+b+&#x27;&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(A[k])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fbv(A[k]-F[k],c)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(F[k])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fbv(F[k]-S[k],c)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(S[k])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
  });
  h+=&#x27;&lt;/tbody&gt;&#x27;;$(&quot;#fbT&quot;).innerHTML=h;
  var items=[[&quot;Static&quot;,S.oi,1],[&quot;Volume&quot;,F.oi-S.oi,0],[&quot;Price&quot;,(pa-B.p)*qa,0],[&quot;Var. cost&quot;,(B.v-va)*qa,0],[&quot;Fixed costs&quot;,B.f-fa,0],[&quot;Actual&quot;,A.oi,1]];
  var svg=$(&quot;#wf&quot;);while(svg.firstChild)svg.removeChild(svg.firstChild);
  var cum=0,pts=[0],segs=[];
  items.forEach(function(it){if(it[2]){segs.push([0,it[1]]);cum=it[1]}else{segs.push([cum,cum+it[1]]);cum+=it[1]}pts.push(segs[segs.length-1][0],segs[segs.length-1][1])});
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),pad=(mx-mn)*0.08||1000;mn-=pad;mx+=pad;
  var y=function(v){return 25+(mx-v)/(mx-mn)*175},w=74,gap=(560-6*w)/5;
  svg.appendChild(el(&quot;line&quot;,{x1:50,x2:630,y1:y(0),y2:y(0),stroke:&quot;var(--muted)&quot;,&quot;stroke-width&quot;:1}));
  items.forEach(function(it,i){
    var s=segs[i],x=60+i*(w+gap),top=y(Math.max(s[0],s[1])),hh=Math.max(1.5,Math.abs(y(s[0])-y(s[1])));
    var col=it[2]?&quot;var(--ochre)&quot;:(it[1]&gt;=0?&quot;var(--good)&quot;:&quot;var(--bad)&quot;);
    svg.appendChild(el(&quot;rect&quot;,{x:x,y:top,width:w,height:hh,rx:3,fill:col,opacity:it[2]?1:.85}));
    if(i&lt;items.length-1){var nx=x+w,ny=y(s[1]);svg.appendChild(el(&quot;line&quot;,{x1:nx,x2:nx+gap,y1:ny,y2:ny,stroke:&quot;var(--muted)&quot;,&quot;stroke-dasharray&quot;:&quot;3 3&quot;}))}
    svg.appendChild(el(&quot;text&quot;,{x:x+w/2,y:top-6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12,&quot;font-weight&quot;:600},(it[2]||it[1]&lt;0?&quot;&quot;:&quot;+&quot;)+fmt(it[1])));
    svg.appendChild(el(&quot;text&quot;,{x:x+w/2,y:248,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12},it[0]));
  });
}
[&quot;qa&quot;,&quot;pa&quot;,&quot;va&quot;,&quot;fa&quot;].forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,lab)});
lab();

/* strategy map */
var SM=[
 [&quot;Financial&quot;,&quot;Revenue growth&quot;,&quot;Annual % change in revenue&quot;,&quot;+8% per year&quot;,&quot;Launch of a new product line&quot;,&quot;lagging&quot;],
 [&quot;Financial&quot;,&quot;Return on capital&quot;,&quot;ROI (operating income / invested capital)&quot;,&quot;≥ 12%&quot;,&quot;Review of the customer and product portfolio&quot;,&quot;lagging&quot;],
 [&quot;Customer&quot;,&quot;Acquire new customers&quot;,&quot;No. of new customers in the period&quot;,&quot;+150 customers/year&quot;,&quot;Sales campaign in new markets&quot;,&quot;lagging for processes, leading for revenue&quot;],
 [&quot;Customer&quot;,&quot;Retain customers&quot;,&quot;Customer retention rate&quot;,&quot;≥ 85%&quot;,&quot;Loyalty programme and after-sales service&quot;,&quot;leading&quot;],
 [&quot;Internal process&quot;,&quot;On-time delivery&quot;,&quot;% of orders delivered by the promised date&quot;,&quot;≥ 95%&quot;,&quot;Production planning integrated with sales&quot;,&quot;leading&quot;],
 [&quot;Internal process&quot;,&quot;Zero-defect quality&quot;,&quot;Defects per million parts (ppm)&quot;,&quot;&lt; 500 ppm&quot;,&quot;Continuous quality improvement programme&quot;,&quot;leading&quot;],
 [&quot;Learning &amp; growth&quot;,&quot;Employee skills&quot;,&quot;Training hours per employee&quot;,&quot;≥ 30 hours/year&quot;,&quot;Technical training plan&quot;,&quot;leading&quot;],
 [&quot;Learning &amp; growth&quot;,&quot;Integrated information systems&quot;,&quot;% of key processes covered by the ERP&quot;,&quot;100% within 2 years&quot;,&quot;ERP integration project&quot;,&quot;leading&quot;]
];
var boxes=$$(&quot;#smap .box&quot;);
function pick(i){boxes.forEach(function(b,j){b.classList.toggle(&quot;on&quot;,j===i)});var d=SM[i];
  $(&quot;#smOut&quot;).innerHTML=&#x27;&lt;div class=&quot;kicker&quot;&gt;&#x27;+d[0]+&#x27;&lt;/div&gt;&lt;strong class=&quot;big&quot;&gt;&#x27;+d[1]+&#x27;&lt;/strong&gt;&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Measure (KPI)&lt;/td&gt;&lt;td&gt;&#x27;+d[2]+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Target&lt;/td&gt;&lt;td&gt;&#x27;+d[3]+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Initiative&lt;/td&gt;&lt;td&gt;&#x27;+d[4]+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Indicator type&lt;/td&gt;&lt;td&gt;&#x27;+d[5]+&#x27;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&#x27;}
boxes.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){pick(i)});b.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();pick(i)}})});

/* grade simulator */
function grade(){
  var ex=+$(&quot;#ex&quot;).value,pf=+$(&quot;#pf&quot;).value,pb=+$(&quot;#pb&quot;).value,t=ex+pf+pb;
  $(&quot;#exO&quot;).textContent=ex;$(&quot;#pfO&quot;).textContent=&quot;+&quot;+fmt(pf,1);$(&quot;#pbO&quot;).textContent=&quot;+&quot;+fmt(pb,1);
  var g=$(&quot;#gb&quot;);while(g.firstChild)g.removeChild(g.firstChild);
  var sx=600/35,x=20;
  [[ex,&quot;var(--muted)&quot;,&quot;Exam&quot;],[pf,&quot;var(--ochre)&quot;,&quot;FB&quot;],[pb,&quot;var(--sage)&quot;,&quot;BSC&quot;]].forEach(function(s){if(s[0]&gt;0){g.appendChild(el(&quot;rect&quot;,{x:x,y:12,width:s[0]*sx,height:26,fill:s[1],opacity:.9}));if(s[0]*sx&gt;26)g.appendChild(el(&quot;text&quot;,{x:x+s[0]*sx/2,y:30,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12,style:&quot;fill:var(--paper)&quot;},s[2]))}x+=s[0]*sx});
  g.appendChild(el(&quot;line&quot;,{x1:20+30*sx,x2:20+30*sx,y1:4,y2:46,stroke:&quot;var(--brick)&quot;,&quot;stroke-width&quot;:2}));
  g.appendChild(el(&quot;text&quot;,{x:20+30*sx,y:62,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12},&quot;30&quot;));
  $(&quot;#gOut&quot;).innerHTML=&#x27;&lt;strong class=&quot;big&quot;&gt;&#x27;+fmt(t,1)+&#x27;&lt;/strong&gt;&#x27;+(t&gt;30?&#x27;&lt;span class=&quot;note&quot;&gt;Above 30: the document does not say how excess points are handled or whether they give access to honours (lode).&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;note&quot;&gt;Exam grade &#x27;+ex+&#x27; + bonus &#x27;+fmt(pf+pb,1)+&#x27; points.&lt;/span&gt;&#x27;);
}
[&quot;ex&quot;,&quot;pf&quot;,&quot;pb&quot;].forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,grade)});
grade();
})();
&lt;/script&gt;
