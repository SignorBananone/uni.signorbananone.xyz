*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.62 &quot;IBM Plex Sans&quot;,system-ui,sans-serif}

h1{font-size:clamp(2.2rem,6vw,3.9rem);font-weight:300;letter-spacing:-.01em}

.tg[aria-pressed=true]::before{content:&quot;✓ &quot;}
.out{margin-top:12px;padding:14px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--card)}

.btn{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}

&lt;section class=&quot;part p-slate&quot; id=&quot;regole&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PARTE 1&quot;&gt;Chi è un &lt;em&gt;attending student&lt;/em&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;Il corso offre attività in aula &lt;strong&gt;volontarie&lt;/strong&gt; (&lt;em class=&quot;en&quot;&gt;voluntary in-class activities&lt;/em&gt;). I docenti le valutano e la valutazione entra nel voto finale. Chi vi partecipa è considerato &lt;em class=&quot;en&quot;&gt;attending student&lt;/em&gt;, cioè &quot;studente frequentante&quot;, e ottiene uno &quot;sconto&quot; sull&#x27;esame finale (&lt;em&gt;a discount on the final exam&lt;/em&gt;): un esame più breve.&lt;/p&gt;
    &lt;div class=&quot;quote&quot;&gt;&quot;Students will be considered attending students &lt;u&gt;only if they participate in both&lt;/u&gt; in-class activities. Students participating only in one of the two activities will be considered non-attending students.&quot;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Attending student&lt;/dt&gt;&lt;dd&gt;Ha dichiarato la partecipazione entro l&#x27;8 ottobre &lt;em&gt;e&lt;/em&gt; ha svolto entrambe le attività. Esame finale più breve + punti bonus.&lt;/dd&gt;
        &lt;dt&gt;Non-attending student&lt;/dt&gt;&lt;dd&gt;Chi non ha dichiarato, o ha partecipato a una sola attività, o a nessuna. Sostiene l&#x27;esame completo.&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;div class=&quot;card tint&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;La regola come formula logica&lt;/h4&gt;
        &lt;div class=&quot;formula&quot; style=&quot;margin:6px 0&quot;&gt;attending = dichiarazione ∧ FB ∧ BSC&lt;/div&gt;
        &lt;p class=&quot;note&quot;&gt;∧ significa &quot;e&quot; (AND): basta che manchi una sola condizione perché lo status cada. È il punto che il documento sottolinea (è l&#x27;unica frase sottolineata).&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Prova tu: che status avresti?&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Attiva o disattiva le condizioni. Lo strumento applica alla lettera le regole del documento.&lt;/p&gt;
    &lt;div class=&quot;toggles&quot; id=&quot;stTog&quot;&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;d&quot;&gt;Dichiarato entro l&#x27;8 ottobre&lt;/button&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;f&quot;&gt;Assignment Flexible Budget&lt;/button&gt;
      &lt;button class=&quot;tg&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot; data-k=&quot;b&quot;&gt;Group work Balanced Scorecard&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;out&quot; id=&quot;stOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Ho fatto l&#x27;assignment sul Flexible Budget ma salto la discussione del caso BSC. Sono attending?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No. Chi partecipa a una sola delle due attività è &lt;em&gt;non-attending&lt;/em&gt;. Il documento non dice se i punti dell&#x27;assignment vengano comunque conteggiati: in caso di dubbio chiedi ai docenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Dove si dichiara la partecipazione?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Tramite un quiz specifico nell&#x27;&lt;em&gt;SMA e-learning&lt;/em&gt;, cioè la piattaforma online del corso, entro l&#x27;8 ottobre.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa ottiene in concreto un attending student?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Due vantaggi: (1) fino a 2 + 3 = 5 punti aggiunti alla valutazione dell&#x27;esame; (2) un esame finale più breve di quello dei non-attending.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;calendario&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;

    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;Il documento dà una sola data assoluta (8 ottobre) e alcune durate relative. La linea del tempo qui sotto le mette in ordine; le posizioni sono indicative perché le date delle lezioni non sono indicate.&lt;/p&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;flexible&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PARTE 3 · ATTIVITÀ N. 1&quot;&gt;Assignment on &lt;em&gt;Flexible Budget&lt;/em&gt;&lt;/h2&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p style=&quot;margin-top:0&quot;&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;&lt;strong&gt;Formato:&lt;/strong&gt; assignment &lt;strong&gt;individuale&lt;/strong&gt;, proposto durante una lezione. Si lavora &lt;em&gt;autonomously&lt;/em&gt; (da soli) e si consegna &lt;strong&gt;a fine lezione&lt;/strong&gt;. Vale &lt;strong&gt;0-2 punti&lt;/strong&gt; sul voto d&#x27;esame.&lt;/p&gt;
      &lt;p class=&quot;note&quot; style=&quot;margin-bottom:0&quot;&gt;Il documento non spiega che cos&#x27;è un flexible budget: tutto il resto di questa sezione è &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; di teoria standard, utile per prepararsi.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Static budget e flexible budget&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Static budget&lt;/dt&gt;
        &lt;dd&gt;&quot;Budget statico&quot;: il budget preparato a inizio periodo per &lt;strong&gt;un solo&lt;/strong&gt; livello di attività previsto (es. 10.000 unità vendute). Non cambia anche se i volumi effettivi sono diversi.&lt;/dd&gt;
        &lt;dt&gt;Flexible budget&lt;/dt&gt;
        &lt;dd&gt;&quot;Budget flessibile&quot;: lo stesso budget &lt;strong&gt;ricalcolato a fine periodo sul volume effettivo&lt;/strong&gt;, mantenendo i prezzi e i costi unitari standard del budget. Risponde alla domanda: &lt;em&gt;quanto avremmo dovuto spendere e incassare, dato il volume che abbiamo realmente fatto?&lt;/em&gt;&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Variable cost&lt;/dt&gt;&lt;dd&gt;Costo variabile: cresce in proporzione al volume (materie prime, provvigioni). Nel flexible budget si &quot;flette&quot;.&lt;/dd&gt;
        &lt;dt&gt;Fixed cost&lt;/dt&gt;&lt;dd&gt;Costo fisso: non cambia nel range rilevante di attività (affitti, stipendi fissi). Nel flexible budget resta uguale allo static.&lt;/dd&gt;
        &lt;dt&gt;Contribution margin&lt;/dt&gt;&lt;dd&gt;Margine di contribuzione = ricavi − costi variabili; per unità: prezzo − costo variabile unitario.&lt;/dd&gt;
      &lt;/dl&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Flexible budget = (prezzo std − costo var. unitario std) × &lt;strong&gt;volume effettivo&lt;/strong&gt; − costi fissi di budget&lt;/div&gt;

    &lt;h3&gt;Perché serve: confrontare mele con mele&lt;/h3&gt;
    &lt;p&gt;Se a consuntivo hai venduto più del previsto, i costi variabili effettivi saranno più alti di quelli dello static budget. Confrontarli direttamente farebbe sembrare &quot;inefficiente&quot; un reparto che ha solo prodotto di più. Il flexible budget separa i due effetti:&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Livelli della variance analysis&quot; class=&quot;figure&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Static budget&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;volume previsto, valori std&lt;/text&gt;
      &lt;rect x=&quot;340&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Flexible budget&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;volume effettivo, valori std&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;40&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;770&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Actual results&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;volume effettivo, valori effettivi&lt;/text&gt;
      &lt;path d=&quot;M240 140 L340 140&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Sales-volume variance&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;effetto quantità&lt;/text&gt;
      &lt;path d=&quot;M560 140 L660 140&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Flexible-budget variance&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;effetto prezzi ed efficienza&lt;/text&gt;
      &lt;path d=&quot;M130 30 Q450 -10 770 30&quot; stroke=&quot;var(--muted)&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;Static-budget variance (totale) = somma delle due&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;Livelli di variance&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;v0&quot; id=&quot;t-v0&quot;&gt;Livello 0&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v1&quot; id=&quot;t-v1&quot;&gt;Livello 1&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v2&quot; id=&quot;t-v2&quot;&gt;Livello 2&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;v3&quot; id=&quot;t-v3&quot;&gt;F / U&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v0&quot; aria-labelledby=&quot;t-v0&quot;&gt;&lt;p&gt;&lt;strong&gt;Static-budget variance&lt;/strong&gt; = risultato effettivo − static budget. Dice &lt;em&gt;quanto&lt;/em&gt; ci si è scostati, non &lt;em&gt;perché&lt;/em&gt;. È il livello meno informativo.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v1&quot; aria-labelledby=&quot;t-v1&quot; hidden&gt;&lt;p&gt;La si scompone in:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Sales-volume variance = (Q&lt;sub&gt;eff&lt;/sub&gt; − Q&lt;sub&gt;budget&lt;/sub&gt;) × margine di contribuzione unitario std&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Flexible-budget variance = risultato effettivo − flexible budget&lt;/div&gt;&lt;p&gt;La prima è responsabilità tipica del marketing/vendite; la seconda riguarda prezzi e costi.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v2&quot; aria-labelledby=&quot;t-v2&quot; hidden&gt;&lt;p&gt;La flexible-budget variance si scompone a sua volta riga per riga:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Selling-price variance = (P&lt;sub&gt;eff&lt;/sub&gt; − P&lt;sub&gt;std&lt;/sub&gt;) × Q&lt;sub&gt;eff&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Variable-cost variance = (CV&lt;sub&gt;std&lt;/sub&gt; − CV&lt;sub&gt;eff&lt;/sub&gt;) × Q&lt;sub&gt;eff&lt;/sub&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;Fixed-cost (spending) variance = CF&lt;sub&gt;budget&lt;/sub&gt; − CF&lt;sub&gt;eff&lt;/sub&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Nei corsi completi la variable-cost variance si divide ancora in &lt;em&gt;price variance&lt;/em&gt; (prezzo degli input) ed &lt;em&gt;efficiency variance&lt;/em&gt; (quantità di input per unità): verifica nelle lezioni del corso fin dove si spinge l&#x27;analisi.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;v3&quot; aria-labelledby=&quot;t-v3&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;F&quot;&gt;F = Favorable&lt;/span&gt;: lo scostamento aumenta il reddito operativo (ricavi più alti o costi più bassi del previsto). &lt;span class=&quot;U&quot;&gt;U = Unfavorable&lt;/span&gt;: lo riduce. Attenzione al segno sui costi: un costo &lt;em&gt;più alto&lt;/em&gt; del budget è U.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Laboratorio: muovi i cursori&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Esempio inventato. Budget: 10.000 unità, prezzo 20 €, costo variabile 12 €/u, costi fissi 50.000 € → reddito operativo 30.000 €. Cambia i valori effettivi e guarda come si scompone lo scostamento.&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;qa&quot;&gt;Unità vendute effettive&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qa&quot; min=&quot;7000&quot; max=&quot;13000&quot; step=&quot;100&quot; value=&quot;11000&quot;&gt;&lt;output id=&quot;qaO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pa&quot;&gt;Prezzo effettivo €/u&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pa&quot; min=&quot;16&quot; max=&quot;24&quot; step=&quot;0.5&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;paO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;va&quot;&gt;Costo variabile eff. €/u&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;va&quot; min=&quot;9&quot; max=&quot;15&quot; step=&quot;0.25&quot; value=&quot;12.5&quot;&gt;&lt;output id=&quot;vaO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;fa&quot;&gt;Costi fissi effettivi €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fa&quot; min=&quot;40000&quot; max=&quot;60000&quot; step=&quot;500&quot; value=&quot;52000&quot;&gt;&lt;output id=&quot;faO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;tblwrap&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table id=&quot;fbT&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata degli scostamenti&quot; style=&quot;margin-top:14px&quot;&gt;&lt;/svg&gt;
      &lt;p class=&quot;figcap&quot;&gt;Grafico a cascata (&lt;em&gt;waterfall&lt;/em&gt;): dal reddito dello static budget a quello effettivo, passando per ogni scostamento. Verde = F, rosso = U.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Come affrontare l&#x27;assignment in aula&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;steps&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div data-step&gt;&lt;h4&gt;1 · Classifica i costi&lt;/h4&gt;&lt;p&gt;Separa costi variabili e fissi; calcola i valori unitari standard (prezzo, costo variabile per unità, margine di contribuzione unitario).&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;2 · Ricostruisci lo static budget&lt;/h4&gt;&lt;p&gt;Ricavi, costi variabili, margine di contribuzione, costi fissi, reddito operativo al volume previsto.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;3 · Costruisci il flexible budget&lt;/h4&gt;&lt;p&gt;Stessa struttura, ma moltiplica i valori unitari standard per il &lt;strong&gt;volume effettivo&lt;/strong&gt;. I costi fissi restano quelli di budget.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;4 · Calcola e classifica le variances&lt;/h4&gt;&lt;p&gt;Sales-volume variance (static vs flexible) e flexible-budget variance (flexible vs actual), riga per riga; etichetta ognuna F o U. Controlla che la somma torni con la variance totale.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;5 · Commenta&lt;/h4&gt;&lt;p&gt;Spiega le cause possibili (sconti per spingere i volumi? materie prime più care?) e chi ne è responsabile. Il tempo è limitato alla lezione: lascia qualche minuto per la verifica dei totali.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Nel flexible budget i costi fissi cambiano con il volume effettivo?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No: nel range rilevante restano uguali allo static budget. Si &quot;flettono&quot; solo ricavi e costi variabili.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Budget 10.000 u, effettive 11.000 u, margine di contribuzione std 8 €/u. Sales-volume variance?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;(11.000 − 10.000) × 8 = 8.000 € &lt;span class=&quot;F&quot;&gt;F&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Il costo variabile effettivo è 12,5 €/u contro 12 €/u di standard, su 11.000 unità. Variance?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;(12 − 12,5) × 11.000 = −5.500 € → 5.500 € &lt;span class=&quot;U&quot;&gt;U&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché confrontare i costi effettivi con lo static budget può essere fuorviante?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Perché mescola effetto volume ed effetto efficienza/prezzo: se si produce di più, i costi variabili salgono senza che ci sia inefficienza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;bsc&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PARTE 4 · ATTIVITÀ N. 2&quot;&gt;Work group on &lt;em&gt;Balanced Scorecard&lt;/em&gt;&lt;/h2&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p style=&quot;margin-top:0&quot;&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;I docenti formano &lt;strong&gt;gruppi di 4-5 studenti&lt;/strong&gt; che discutono un &lt;em class=&quot;en&quot;&gt;case study&lt;/em&gt; (caso aziendale) centrato sul Balanced Scorecard. Gruppi e casi vengono presentati in una lezione; poi i gruppi hanno &lt;strong&gt;7-10 giorni&lt;/strong&gt; per lavorare in autonomia e preparare una presentazione &lt;strong&gt;PowerPoint da inviare in anticipo&lt;/strong&gt; ai docenti. La discussione avviene in &lt;strong&gt;due lezioni&lt;/strong&gt; e &lt;strong&gt;tutti i membri&lt;/strong&gt; del gruppo devono partecipare. Vale &lt;strong&gt;0-3 punti&lt;/strong&gt;, assegnati a tutti i componenti.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Il percorso del gruppo&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;steps&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div data-step&gt;&lt;h4&gt;1 · Lezione di avvio&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;I docenti comunicano composizione dei gruppi (non li scegliete voi) e caso assegnato.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;2 · Lavoro autonomo (7-10 giorni)&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;Il gruppo analizza il caso. &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Conviene dividersi le quattro prospettive ma ricomporle insieme: il valore del BSC sta nei legami tra di esse.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;3 · Presentazione PowerPoint&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;Da preparare e &lt;strong&gt;inviare in anticipo&lt;/strong&gt; ai docenti. &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Una struttura utile: strategia dell&#x27;azienda → strategy map → tabella obiettivi/misure/target/iniziative → criticità e raccomandazioni.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;4 · Discussione in aula&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;Si svolge in due lezioni; la presenza di tutti i membri è richiesta.&lt;/p&gt;&lt;/div&gt;
        &lt;div data-step hidden&gt;&lt;h4&gt;5 · Valutazione&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;0-3 punti, uguali per tutti i componenti del gruppo, sommati alla valutazione personale all&#x27;esame finale.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Che cos&#x27;è il Balanced Scorecard&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Il &lt;em class=&quot;en&quot;&gt;Balanced Scorecard&lt;/em&gt; (BSC, &quot;scheda di valutazione bilanciata&quot;) è un sistema di misurazione delle performance proposto da Robert S. Kaplan e David P. Norton nel 1992. L&#x27;idea: le sole misure finanziarie sono &lt;em class=&quot;en&quot;&gt;lagging indicators&lt;/em&gt; (indicatori &quot;in ritardo&quot;, che registrano risultati già avvenuti) e non bastano a guidare la strategia. Vanno &lt;strong&gt;bilanciate&lt;/strong&gt; con misure non finanziarie che sono &lt;em class=&quot;en&quot;&gt;leading indicators&lt;/em&gt; (indicatori &quot;anticipatori&quot;, che preannunciano i risultati futuri). Nel tempo il BSC è passato da sistema di misura a strumento per tradurre la strategia in azione.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div role=&quot;tablist&quot; aria-label=&quot;Le quattro prospettive&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;p1&quot; id=&quot;t-p1&quot;&gt;Financial&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p2&quot; id=&quot;t-p2&quot;&gt;Customer&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p3&quot; id=&quot;t-p3&quot;&gt;Internal process&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;p4&quot; id=&quot;t-p4&quot;&gt;Learning &amp;amp; growth&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p1&quot; aria-labelledby=&quot;t-p1&quot;&gt;&lt;p&gt;&lt;strong&gt;Domanda guida:&lt;/strong&gt; come ci vedono gli azionisti? Per avere successo finanziario, che risultati dobbiamo mostrare?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Misure tipiche:&lt;/strong&gt; ROI, crescita dei ricavi, margine operativo, cash flow, EVA.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p2&quot; aria-labelledby=&quot;t-p2&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Domanda guida:&lt;/strong&gt; come ci vedono i clienti? Che valore dobbiamo offrire loro?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Misure tipiche:&lt;/strong&gt; quota di mercato, customer satisfaction, retention (fidelizzazione), acquisizione di nuovi clienti, redditività per cliente.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p3&quot; aria-labelledby=&quot;t-p3&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Domanda guida:&lt;/strong&gt; in quali processi interni dobbiamo eccellere per soddisfare clienti e azionisti?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Misure tipiche:&lt;/strong&gt; tempo di ciclo, difettosità, consegne puntuali, costo per processo, numero di nuovi prodotti.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; id=&quot;p4&quot; aria-labelledby=&quot;t-p4&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Domanda guida:&lt;/strong&gt; come sostenere la capacità di cambiare e migliorare? (nell&#x27;articolo del 1992: &lt;em&gt;innovation and learning perspective&lt;/em&gt;)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Misure tipiche:&lt;/strong&gt; formazione e competenze, soddisfazione e turnover dei dipendenti, disponibilità dei sistemi informativi, suggerimenti implementati.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Strategy map: la catena causa-effetto&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Una &lt;em class=&quot;en&quot;&gt;strategy map&lt;/em&gt; (&quot;mappa strategica&quot;, Kaplan &amp;amp; Norton 2000) disegna gli obiettivi delle quattro prospettive e le relazioni causa-effetto tra loro: dal basso (persone e sistemi) verso l&#x27;alto (risultati finanziari). Clicca un obiettivo per vedere come si traduce in misura, target e iniziativa.&lt;/p&gt;
    &lt;figure class=&quot;figure&quot;&gt;

      &lt;path class=&quot;ar&quot; d=&quot;M290 337 L290 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 337 L650 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 337 L330 285&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;path class=&quot;ar&quot; d=&quot;M290 237 L290 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M650 237 L650 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ar&quot; d=&quot;M330 237 L610 185&quot; marker-end=&quot;url(#ah2)&quot;/&gt;

      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;5&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;237&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;265&quot; text-anchor=&quot;middle&quot;&gt;Qualità senza difetti&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;6&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;337&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot;&gt;Competenze del personale&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;box&quot; tabindex=&quot;0&quot; data-i=&quot;7&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;337&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot;&gt;Sistemi informativi integrati&lt;/text&gt;&lt;/g&gt;

    &lt;div class=&quot;out&quot; id=&quot;smOut&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Seleziona un obiettivo nella mappa.&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Gli elementi di una scorecard&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Objective&lt;/dt&gt;&lt;dd&gt;Che cosa vogliamo ottenere (es. fidelizzare i clienti).&lt;/dd&gt;
        &lt;dt&gt;Measure / KPI&lt;/dt&gt;&lt;dd&gt;Come misuriamo il progresso (&lt;em class=&quot;en&quot;&gt;Key Performance Indicator&lt;/em&gt;, indicatore chiave di prestazione; es. tasso di riacquisto).&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;dl class=&quot;card def&quot;&gt;
        &lt;dt&gt;Target&lt;/dt&gt;&lt;dd&gt;Il livello da raggiungere entro una data (es. 80% entro 12 mesi).&lt;/dd&gt;
        &lt;dt&gt;Initiative&lt;/dt&gt;&lt;dd&gt;Il progetto o l&#x27;azione per raggiungere il target (es. programma fedeltà).&lt;/dd&gt;
      &lt;/dl&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Errori frequenti nell&#x27;analisi di un caso BSC&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;ul&gt;
      &lt;li&gt;Troppe misure: una scorecard dovrebbe concentrarsi su pochi indicatori per prospettiva.&lt;/li&gt;
      &lt;li&gt;Misure non collegate alla strategia: il BSC parte dalla strategia, non dagli indicatori già disponibili.&lt;/li&gt;
      &lt;li&gt;Solo lagging indicators: senza leading indicators la scorecard non anticipa nulla.&lt;/li&gt;
      &lt;li&gt;Nessun nesso causa-effetto: le quattro prospettive trattate come quattro liste separate.&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Quali sono le quattro prospettive del Balanced Scorecard?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Financial, Customer, Internal (business) process, Learning &amp;amp; growth (nel 1992: innovation and learning).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Il tasso di soddisfazione dei dipendenti è un leading o un lagging indicator del ROI?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Leading: si muove prima e, attraverso la catena causa-effetto (processi → clienti), anticipa i risultati finanziari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché si chiama &quot;balanced&quot;?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Bilancia misure finanziarie e non finanziarie, di breve e lungo periodo, interne ed esterne, di risultato (lagging) e di guida (leading).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Un membro del gruppo non può venire a una delle due lezioni di discussione. Cosa dice il documento?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;Che tutti i membri devono partecipare alla discussione. Il caso dell&#x27;assenza non è previsto: va concordato con i docenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;valutazione&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PARTE 5&quot;&gt;Valutazione ed esame finale&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt;I punti delle attività si &lt;strong&gt;aggiungono&lt;/strong&gt; alla valutazione ottenuta all&#x27;esame finale:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;N. 1 · individuale&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;0 – 2&lt;/strong&gt; punti&lt;p class=&quot;note&quot;&gt;Flexible Budget, a ciascuno studente.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;N. 2 · di gruppo&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;0 – 3&lt;/strong&gt; punti&lt;p class=&quot;note&quot;&gt;Balanced Scorecard, uguali per tutti i componenti.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Esame&lt;/div&gt;&lt;strong style=&quot;font-family:Newsreader,serif;font-size:2.2rem&quot;&gt;più breve&lt;/strong&gt;&lt;p class=&quot;note&quot;&gt;per gli attending students rispetto ai non-attending.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Simulatore del voto&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt;Ipotesi: voto d&#x27;esame in trentesimi, come d&#x27;uso nelle università italiane, con i punti sommati direttamente. Il documento &lt;strong&gt;non&lt;/strong&gt; specifica scala, granularità dei punti, né cosa succede oltre il 30 (lode?): chiedi ai docenti.&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ex&quot;&gt;Voto dell&#x27;esame (ridotto)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ex&quot; min=&quot;18&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;exO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pf&quot;&gt;Punti Flexible Budget&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pf&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.5&quot; value=&quot;1.5&quot;&gt;&lt;output id=&quot;pfO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pb&quot;&gt;Punti BSC (gruppo)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pb&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;pbO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg id=&quot;gb&quot; viewBox=&quot;0 0 640 70&quot; role=&quot;img&quot; aria-label=&quot;Composizione del voto&quot; style=&quot;margin-top:10px&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;out&quot; id=&quot;gOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Qual è il bonus massimo complessivo per un attending student?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;2 + 3 = 5 punti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Il punteggio BSC è individuale?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;No: è assegnato al gruppo e aggiunto alla valutazione personale di tutti i componenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-accent&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2 data-n=&quot;PER APPROFONDIRE&quot;&gt;Testi e risorse&lt;/h2&gt;
    &lt;p&gt;Il documento non cita autori né testi: nomina solo l&#x27;Università di Bergamo (Dipartimento di Scienze Aziendali) e la piattaforma &lt;em&gt;SMA e-learning&lt;/em&gt;, interna al corso. Le voci qui sotto sono i riferimenti fondamentali per i due strumenti delle attività. Ogni voce è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;: verifica sempre quali testi adotta il programma del corso.&lt;/p&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Scheda del corso &quot;Strategic Management Accounting&quot;, Università degli Studi di Bergamo&lt;/h4&gt;&lt;p&gt;Insegnamento in inglese, 9 CFU, 72 ore, primo semestre (14/09–18/12/2026 nell&#x27;offerta 2026-27); presenta i &lt;em&gt;management control systems&lt;/em&gt; come dimensione fondamentale di ogni organizzazione, profit, non-profit e pubblica.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte ufficiale per programma, docenti e modalità d&#x27;esame, che il PDF non riporta. &lt;a href=&quot;https://unibg.unifind.cineca.it/resource/af/654637-170967-COMUNE-1_1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.unifind.cineca.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (1992), &quot;The Balanced Scorecard — Measures That Drive Performance&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt;, gen-feb, pp. 71-79&lt;/h4&gt;&lt;p&gt;L&#x27;articolo che introduce il BSC, nato da un progetto di ricerca del 1990 con 12 aziende: affianca alle misure finanziarie quelle delle prospettive cliente, processi interni, innovazione e apprendimento.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;origine del concetto su cui verte l&#x27;attività N. 2. &lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton92.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su maaw.info (J.R. Martin)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (1996), &lt;em&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/em&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;Il libro che sistematizza il BSC: quattro prospettive (financial, customer, internal process, learning and growth) e uso della scorecard come sistema di gestione strategica, non solo di misura.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il riferimento completo per costruire una scorecard in un caso aziendale. &lt;a href=&quot;https://www.oreilly.com/library/view/the-balanced-scorecard/9781422148167/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda editoriale (O&#x27;Reilly)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan R.S., Norton D.P. (2000), &quot;Having Trouble with Your Strategy? Then Map It&quot;, &lt;em&gt;Harvard Business Review&lt;/em&gt; 78(5), pp. 167-176&lt;/h4&gt;&lt;p&gt;Introduce la &lt;em&gt;strategy map&lt;/em&gt;: le quattro aree del BSC collegate da relazioni causa-effetto, con l&#x27;esempio di Mobil North American Marketing and Refining.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: aiuta a presentare il caso di gruppo mostrando i nessi tra obiettivi, non solo un elenco di KPI. &lt;a href=&quot;https://www.hbs.edu/faculty/Pages/item.aspx?num=6720&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Harvard Business School&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Lumen Learning, &lt;em&gt;Managerial Accounting&lt;/em&gt; — &quot;Flexible Budget Variance&quot;&lt;/h4&gt;&lt;p&gt;Manuale open con spiegazione ed esempi numerici di flexible budget, sales-volume variance e flexible-budget variance.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: utile per esercitarsi sui calcoli dell&#x27;attività N. 1; è materiale didattico secondario, da confrontare con il testo del corso. &lt;a href=&quot;https://courses.lumenlearning.com/wm-managerialaccounting/chapter/flexible-budget-variance/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;courses.lumenlearning.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){

var NS=&quot;http://www.w3.org/2000/svg&quot;;

function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e}

/* tabs */
$$(&quot;[data-tabs]&quot;).forEach(function(box){

/* steppers */
$$(&quot;[data-stepper]&quot;).forEach(function(st){

  $(&quot;[data-prev]&quot;,st).addEventListener(&quot;click&quot;,function(){go(cur-1)});

/* status simulator */
var st={d:false,f:false,b:false};
function status(){
  var o=$(&quot;#stOut&quot;),h;
  if(st.d&amp;&amp;st.f&amp;&amp;st.b)h=&#x27;&lt;strong class=&quot;big&quot; style=&quot;color:var(--good)&quot;&gt;Attending student&lt;/strong&gt;Esame finale più breve e fino a &lt;strong&gt;+5 punti&lt;/strong&gt; (0-2 Flexible Budget + 0-3 Balanced Scorecard).&#x27;;
  else{
    var miss=[];if(!st.d)miss.push(&quot;la dichiarazione entro l&#x27;8 ottobre&quot;);if(!st.f)miss.push(&quot;l&#x27;assignment sul Flexible Budget&quot;);if(!st.b)miss.push(&quot;il lavoro di gruppo sul BSC&quot;);
    h=&#x27;&lt;strong class=&quot;big&quot; style=&quot;color:var(--bad)&quot;&gt;Non-attending student&lt;/strong&gt;Manca: &#x27;+miss.join(&quot;, &quot;)+&#x27;. Esame completo.&#x27;;
    if(st.f!==st.b&amp;&amp;(st.f||st.b))h+=&#x27;&lt;br&gt;&lt;span class=&quot;note&quot;&gt;Una sola attività non basta. Il documento non dice se i suoi punti vengano comunque conteggiati.&lt;/span&gt;&#x27;;
  }
  o.innerHTML=h;
}
$$(&quot;#stTog .tg&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var k=b.dataset.k;st[k]=!st[k];b.setAttribute(&quot;aria-pressed&quot;,st[k]);status()})});
status();

/* flexible budget lab */
var B={q:10000,p:20,v:12,f:50000};
function fbv(x,cost){if(Math.abs(x)&lt;0.5)return &#x27;&lt;span&gt;0&lt;/span&gt;&#x27;;var good=cost?x&lt;0:x&gt;0;return &#x27;&lt;span class=&quot;&#x27;+(good?&quot;F&quot;:&quot;U&quot;)+&#x27;&quot;&gt;&#x27;+fmt(Math.abs(x))+&quot; &quot;+(good?&quot;F&quot;:&quot;U&quot;)+&quot;&lt;/span&gt;&quot;}
function lab(){
  var qa=+$(&quot;#qa&quot;).value,pa=+$(&quot;#pa&quot;).value,va=+$(&quot;#va&quot;).value,fa=+$(&quot;#fa&quot;).value;
  $(&quot;#qaO&quot;).textContent=fmt(qa);$(&quot;#paO&quot;).textContent=fmt(pa,2)+&quot; €&quot;;$(&quot;#vaO&quot;).textContent=fmt(va,2)+&quot; €&quot;;$(&quot;#faO&quot;).textContent=fmt(fa)+&quot; €&quot;;
  var A={rev:pa*qa,vc:va*qa,fc:fa},F={rev:B.p*qa,vc:B.v*qa,fc:B.f},S={rev:B.p*B.q,vc:B.v*B.q,fc:B.f};
  [A,F,S].forEach(function(x){x.cm=x.rev-x.vc;x.oi=x.cm-x.fc});
  var rows=[[&quot;Unità&quot;,qa,qa,B.q,null],[&quot;Ricavi&quot;,&quot;rev&quot;,0],[&quot;Costi variabili&quot;,&quot;vc&quot;,1],[&quot;Margine di contribuzione&quot;,&quot;cm&quot;,0],[&quot;Costi fissi&quot;,&quot;fc&quot;,1],[&quot;Reddito operativo&quot;,&quot;oi&quot;,0]];
  var h=&#x27;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Flexible-budget var.&lt;/th&gt;&lt;th&gt;Flexible budget&lt;/th&gt;&lt;th&gt;Sales-volume var.&lt;/th&gt;&lt;th&gt;Static budget&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  rows.forEach(function(r){
    if(r[4]===null){h+=&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa)+&#x27;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(qa-B.q)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(B.q)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;return}
    var k=r[1],c=r[2],b=k===&quot;oi&quot;?&#x27; style=&quot;font-weight:700&quot;&#x27;:&#x27;&#x27;;
    h+=&#x27;&lt;tr&#x27;+b+&#x27;&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(A[k])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fbv(A[k]-F[k],c)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(F[k])+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fbv(F[k]-S[k],c)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(S[k])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
  });
  h+=&#x27;&lt;/tbody&gt;&#x27;;$(&quot;#fbT&quot;).innerHTML=h;
  var items=[[&quot;Static&quot;,S.oi,1],[&quot;Volume&quot;,F.oi-S.oi,0],[&quot;Prezzo&quot;,(pa-B.p)*qa,0],[&quot;Costo var.&quot;,(B.v-va)*qa,0],[&quot;Costi fissi&quot;,B.f-fa,0],[&quot;Actual&quot;,A.oi,1]];
  var svg=$(&quot;#wf&quot;);while(svg.firstChild)svg.removeChild(svg.firstChild);
  var cum=0,pts=[0],segs=[];
  items.forEach(function(it){if(it[2]){segs.push([0,it[1]]);cum=it[1]}else{segs.push([cum,cum+it[1]]);cum+=it[1]}pts.push(segs[segs.length-1][0],segs[segs.length-1][1])});
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),pad=(mx-mn)*0.08||1000;mn-=pad;mx+=pad;
  var y=function(v){return 25+(mx-v)/(mx-mn)*175},w=74,gap=(560-6*w)/5;
  svg.appendChild(el(&quot;line&quot;,{x1:50,x2:630,y1:y(0),y2:y(0),stroke:&quot;var(--muted)&quot;,&quot;stroke-width&quot;:1}));
  items.forEach(function(it,i){
    var s=segs[i],x=60+i*(w+gap),top=y(Math.max(s[0],s[1])),hh=Math.max(1.5,Math.abs(y(s[0])-y(s[1])));
    var col=it[2]?&quot;var(--ochre)&quot;:(it[1]&gt;=0?&quot;var(--good)&quot;:&quot;var(--bad)&quot;);
    svg.appendChild(el(&quot;rect&quot;,{x:x,y:top,width:w,height:hh,rx:3,fill:col,opacity:it[2]?1:.85}));
    if(i&lt;items.length-1){var nx=x+w,ny=y(s[1]);svg.appendChild(el(&quot;line&quot;,{x1:nx,x2:nx+gap,y1:ny,y2:ny,stroke:&quot;var(--muted)&quot;,&quot;stroke-dasharray&quot;:&quot;3 3&quot;}))}
    svg.appendChild(el(&quot;text&quot;,{x:x+w/2,y:top-6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12,&quot;font-weight&quot;:600},(it[2]||it[1]&lt;0?&quot;&quot;:&quot;+&quot;)+fmt(it[1])));
    svg.appendChild(el(&quot;text&quot;,{x:x+w/2,y:248,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12},it[0]));
  });
}
[&quot;qa&quot;,&quot;pa&quot;,&quot;va&quot;,&quot;fa&quot;].forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,lab)});
lab();

/* strategy map */
var SM=[
 [&quot;Financial&quot;,&quot;Crescita dei ricavi&quot;,&quot;Variazione % dei ricavi annui&quot;,&quot;+8% annuo&quot;,&quot;Lancio di una nuova linea di prodotto&quot;,&quot;lagging&quot;],

function grade(){

  $(&quot;#exO&quot;).textContent=ex;$(&quot;#pfO&quot;).textContent=&quot;+&quot;+fmt(pf,1);$(&quot;#pbO&quot;).textContent=&quot;+&quot;+fmt(pb,1);
  var g=$(&quot;#gb&quot;);while(g.firstChild)g.removeChild(g.firstChild);
  var sx=600/35,x=20;

  g.appendChild(el(&quot;text&quot;,{x:20+30*sx,y:62,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12},&quot;30&quot;));

}
[&quot;ex&quot;,&quot;pf&quot;,&quot;pb&quot;].forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,grade)});
