      &lt;a href=&quot;#s-relativ&quot;&gt;&lt;g class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;630&quot; y=&quot;145&quot; width=&quot;240&quot; height=&quot;72&quot; rx=&quot;14&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;750&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;4 · «È pratica comune»&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;750&quot; y=&quot;199&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;relativism vs absolutism&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
      &lt;a href=&quot;#s-child&quot;&gt;&lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;335&quot; width=&quot;230&quot; height=&quot;72&quot; rx=&quot;14&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;225&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;5 · Child labour&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;225&quot; y=&quot;389&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;ILO C138 · C182 · legge thai&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
      &lt;a href=&quot;#s-decisione&quot;&gt;&lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;460&quot; y=&quot;340&quot; width=&quot;260&quot; height=&quot;72&quot; rx=&quot;14&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;590&quot; y=&quot;370&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;6 · Decidere&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;590&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;opzioni · due diligence · rimedi&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
      &lt;a href=&quot;#s-fonti&quot;&gt;&lt;text class=&quot;svgmut&quot; x=&quot;890&quot; y=&quot;455&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; style=&quot;fill:var(--accent);text-decoration:underline&quot;&gt;Per approfondire →&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le frecce piene sono i passaggi logici del caso; la tratteggiata è la domanda aperta “esistono norme valide ovunque?”, che lega il relativismo al child labour.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;box line small&quot;&gt;&lt;strong&gt;Nota sui materiali.&lt;/strong&gt; Il file della lezione è una singola pagina di manuale (caso + domande). Non sono riuscito a leggere l&#x27;elenco degli altri file in &lt;code&gt;corso/&lt;/code&gt; (non avevo uno strumento per sfogliare le cartelle, e i nomi che ho provato non esistevano), quindi in questa pagina &lt;strong&gt;non c&#x27;è contenuto preso da altri file del corso&lt;/strong&gt;. I collegamenti al quadro teorico vengono dal manuale da cui il caso sembra tratto: nella pagina in trasparenza si legge la parte sull&#x27;&lt;em&gt;egoism&lt;/em&gt; e un rimando al “Chapter 2”, come nel capitolo sulle teorie normative di Crane &amp;amp; Matten, &lt;em&gt;Business Ethics&lt;/em&gt; (vedi &lt;a href=&quot;#s-fonti&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 1 IL CASO ===================== --&gt;
&lt;section class=&quot;part p-accent&quot; id=&quot;s-caso&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 1&lt;/div&gt;
    &lt;h2&gt;Il caso, passo per passo&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; Sei il &lt;span class=&quot;term&quot;&gt;product manager&lt;/span&gt; (chi è responsabile di un prodotto: costi, fornitori, risultati) di un&#x27;azienda dolciaria che mette piccoli giocattoli di plastica nei cioccolatini. A una fiera in Europa conosci un produttore thailandese; vai nel nord-est della Thailandia per chiudere un &lt;strong&gt;contratto di fornitura di due anni&lt;/strong&gt;. Il prezzo è &lt;strong&gt;un terzo&lt;/strong&gt; di quello del fornitore portoghese attuale, con qualità e condizioni di consegna equivalenti.&lt;/p&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stepbody&quot;&gt;
        &lt;svg viewBox=&quot;0 0 120 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;54&quot; class=&quot;f-card&quot; style=&quot;stroke:var(--rule);stroke-width:3&quot;/&gt;&lt;g class=&quot;svgmut&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;20&quot;&gt;12&lt;/text&gt;&lt;text x=&quot;103&quot; y=&quot;64&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;108&quot;&gt;6&lt;/text&gt;&lt;text x=&quot;17&quot; y=&quot;64&quot;&gt;9&lt;/text&gt;&lt;/g&gt;&lt;line data-hand x1=&quot;60&quot; y1=&quot;60&quot; x2=&quot;60&quot; y2=&quot;24&quot; style=&quot;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:transform .4s;transform-origin:60px 60px&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;4&quot; class=&quot;f-accent&quot;/&gt;&lt;/svg&gt;
        &lt;div&gt;
          &lt;div data-step data-hour=&quot;11&quot;&gt;&lt;h4&gt;Il prezzo&lt;/h4&gt;&lt;p&gt;Con il sales manager concordi un prezzo pari a 1/3 di quello portoghese. Per controllare l&#x27;affidabilità del processo chiedi di visitare la produzione: &lt;strong&gt;non c&#x27;è un vero laboratorio&lt;/strong&gt; nella sede.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;6&quot; hidden&gt;&lt;h4&gt;Ore 6:00 — il cancello&lt;/h4&gt;&lt;p&gt;Circa &lt;strong&gt;30 uomini&lt;/strong&gt; fanno la fila al cancello, caricano grandi scatole di componenti su carretti e scooter e le portano &lt;strong&gt;a casa&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;10&quot; hidden&gt;&lt;h4&gt;Durante il giorno — il fienile&lt;/h4&gt;&lt;p&gt;In un fienile simile a un garage una famiglia numerosa monta i giocattoli: madre, padre e i &lt;strong&gt;sei figli, dai 5 ai 14 anni&lt;/strong&gt;, che lavorano “busily” e, da quel che vedi, “very cheerfully”. La nonna cucina nella stanza accanto.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;8&quot; hidden&gt;&lt;h4&gt;Ore 20:00 — la consegna&lt;/h4&gt;&lt;p&gt;Il lavoro della giornata finisce. I pezzi montati tornano nelle scatole e nel laboratorio dell&#x27;azienda, dove &lt;strong&gt;gli uomini vengono pagati per i prodotti finiti&lt;/strong&gt;. A fine settimana i giocattoli partono per l&#x27;Europa.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;2&quot; hidden&gt;&lt;h4&gt;La giustificazione&lt;/h4&gt;&lt;p&gt;Il partner thailandese spiega che è una pratica &lt;strong&gt;“very common and well-established”&lt;/strong&gt; in quella zona e che garantisce buona qualità. Soddisfatto, dici che firmerai una volta a casa, pensando al risparmio e al &lt;strong&gt;bonus&lt;/strong&gt; di fine anno.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;5&quot; hidden&gt;&lt;h4&gt;All&#x27;aeroporto&lt;/h4&gt;&lt;p&gt;Mentre compri souvenir per le tue nipoti di &lt;strong&gt;5 e 7 anni&lt;/strong&gt;, ti chiedi se vorresti vederle crescere come i bambini che hai appena “assunto” per fare i giocattoli della tua azienda.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;La catena di fornitura vista da vicino&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; La &lt;span class=&quot;term&quot;&gt;supply chain&lt;/span&gt; (catena di fornitura: tutti i passaggi che portano un prodotto dalle materie prime al cliente) qui ha un anello “nascosto”. L&#x27;azienda europea firma con il produttore, ma il lavoro vero lo fa una rete di &lt;span class=&quot;term&quot;&gt;homeworkers&lt;/span&gt; (lavoratori a domicilio, pagati dal committente per lavorare a casa propria). È un caso di &lt;span class=&quot;term&quot;&gt;subcontracting&lt;/span&gt; informale: il contratto non arriva fino a chi lavora.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Schema della catena di fornitura del caso&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:none;stroke:var(--accent);stroke-dasharray:6 5&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;22&quot; y=&quot;40&quot; font-size=&quot;12&quot;&gt;ciò che il contratto copre&lt;/text&gt;
      &lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;450&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--brick-bg);stroke:none;opacity:.7&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;452&quot; y=&quot;40&quot; font-size=&quot;12&quot;&gt;ciò che il contratto non vede&lt;/text&gt;
      &lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;115&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Azienda dolciaria&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;115&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;Europa · tu, il PM&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;325&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Produttore thai&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;325&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;sales manager · cancello&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;460&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;545&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;~30 uomini&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;545&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;scatole su scooter&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;680&quot; y=&quot;80&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;775&quot; y=&quot;106&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Famiglie&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;775&quot; y=&quot;126&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;genitori + figli 5–14&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;775&quot; y=&quot;144&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;nel fienile, a casa&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M200,110 L238,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M410,110 L458,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M630,110 L678,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge dash&quot; d=&quot;M775,162 C760,215 360,215 330,164&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;550&quot; y=&quot;205&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;20:00 pezzi finiti → pagamento a pezzo agli uomini → spedizione settimanale&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;115&quot; y=&quot;60&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;contratto 2 anni · prezzo 1/3&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;635&quot; y=&quot;250&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;I bambini non compaiono in nessun documento: il pagamento va agli uomini, a pezzo.&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Più ci si allontana dal contratto, meno trasparenza c&#x27;è. È qui che di solito si nasconde il rischio etico di una supply chain.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fatti certi (dalle slide)&lt;/h4&gt;&lt;p&gt;Prezzo 1/3, qualità equivalente, contratto di 2 anni; lavoro a domicilio dalle 6 alle 20; sei bambini di 5–14 anni che lavorano con i genitori; pagamento agli uomini per i pezzi finiti; pratica “comune” nella zona; un bonus personale in vista.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cosa le slide non dicono&lt;/h4&gt;&lt;p&gt;Se i bambini vanno a scuola; quante ore lavorano davvero; quanto guadagna la famiglia e se basta per vivere; se i materiali (plastica, colle, vernici) sono sicuri; cosa farebbe la famiglia senza questo lavoro. &lt;strong&gt;Un buon giudizio parte dal chiedersi cosa manca.&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Quanto pesa il risparmio? &lt;span class=&quot;small&quot;&gt;(numeri d&#x27;esempio)&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Le slide dicono solo “un terzo del costo”. Con i cursori puoi dare un ordine di grandezza all&#x27;incentivo economico, che spiega perché il manager esce “happy”. I valori sono inventati: servono a ragionare, non a descrivere il caso.&lt;/p&gt;
    &lt;div class=&quot;card&quot; data-saving&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sv-p&quot;&gt;Prezzo portoghese per pezzo (€)&lt;/label&gt;&lt;input id=&quot;sv-p&quot; type=&quot;range&quot; min=&quot;0.05&quot; max=&quot;0.5&quot; step=&quot;0.01&quot; value=&quot;0.15&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sv-q&quot;&gt;Pezzi all&#x27;anno (milioni)&lt;/label&gt;&lt;input id=&quot;sv-q&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 120&quot; aria-label=&quot;Confronto dei costi&quot;&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;0&quot; y=&quot;28&quot; font-size=&quot;13&quot;&gt;Portogallo&lt;/text&gt;&lt;rect data-bar-pt x=&quot;110&quot; y=&quot;12&quot; height=&quot;24&quot; rx=&quot;5&quot; class=&quot;f-slate&quot; width=&quot;460&quot;/&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;0&quot; y=&quot;72&quot; font-size=&quot;13&quot;&gt;Thailandia&lt;/text&gt;&lt;rect data-bar-th x=&quot;110&quot; y=&quot;56&quot; height=&quot;24&quot; rx=&quot;5&quot; class=&quot;f-accent&quot; width=&quot;153&quot;/&gt;
        &lt;text data-sv-txt class=&quot;svgtxt&quot; x=&quot;110&quot; y=&quot;110&quot; font-size=&quot;14&quot;&gt;&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · il caso&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché si dice che i bambini sono un anello “invisibile” della supply chain?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Il contratto è tra l&#x27;azienda europea e il produttore; il produttore paga gli uomini a pezzo. Nessun documento registra chi monta davvero i giocattoli. Il PM li vede solo perché ha chiesto di visitare la produzione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quali due interessi personali del manager entrano in gioco?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Il risparmio per l&#x27;azienda (successo professionale) e il &lt;strong&gt;bonus&lt;/strong&gt; di fine anno. È un piccolo &lt;span class=&quot;term&quot;&gt;conflict of interest&lt;/span&gt; (conflitto d&#x27;interessi: il guadagno personale spinge verso una scelta da valutare in modo imparziale).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Cosa fa scattare il dubbio morale, e perché proprio in quel momento?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Comprare regali per le nipoti di 5 e 7 anni, che hanno l&#x27;età dei bambini al lavoro. Il problema diventa vicino e personale: le vittime potenziali hanno un volto (vedi &lt;em&gt;proximity&lt;/em&gt; nella Parte 2).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 2 GUT REACTION ===================== --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s-gut&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 2 · Domanda 1&lt;/div&gt;
    &lt;h2&gt;La gut reaction: cosa sento, prima di ragionare&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; &lt;em&gt;«Reading the case and putting yourself in the role of the product manager, what would your immediate gut reaction be?»&lt;/em&gt;&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; La &lt;span class=&quot;term&quot;&gt;gut reaction&lt;/span&gt; è la reazione “di pancia”: un giudizio immediato, spesso emotivo, che arriva prima delle argomentazioni. L&#x27;esercizio chiede di &lt;strong&gt;registrarla onestamente&lt;/strong&gt; invece di saltare subito alla risposta “giusta”: serve come materia prima per la domanda 2.&lt;/p&gt;

    &lt;h3&gt;Perché partire dall&#x27;intuizione&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Lo psicologo Jonathan Haidt, nel &lt;span class=&quot;term&quot;&gt;social intuitionist model&lt;/span&gt; (2001), sostiene che di solito il giudizio morale nasce da un&#x27;intuizione rapida e automatica e che il ragionamento arriva &lt;em&gt;dopo&lt;/em&gt;, per giustificarla e convincere gli altri (&lt;a href=&quot;https://www.faculty.umb.edu/adam_beresford/courses/phil_281_11/reading_emotional_dog.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo&lt;/a&gt;). Le due domande del caso seguono proprio questo ordine: prima la pancia (Q1), poi le ragioni (Q2), poi un controllo critico di quelle ragioni.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Schema: situazione, intuizione, giudizio, ragionamento&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

    &lt;h3&gt;Le reazioni tipiche&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;«Firmo»&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;«Non firmo»&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;«Firmo, ma…»&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;«Devo saperne di più»&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Intuizione:&lt;/strong&gt; “I bambini sembravano felici, lavorano con i genitori, la qualità è buona e il risparmio è enorme.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cosa c&#x27;è sotto:&lt;/strong&gt; attenzione ai risultati, rispetto per le abitudini locali, a volte l&#x27;interesse personale (il bonus). &lt;strong&gt;Rischio:&lt;/strong&gt; prendere “cheerfully” come prova che non c&#x27;è danno; l&#x27;allegria non dice nulla su scuola, ore e salute.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuizione:&lt;/strong&gt; “Bambini di 5 anni che lavorano per i miei cioccolatini: no.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cosa c&#x27;è sotto:&lt;/strong&gt; l&#x27;idea che i bambini abbiano diritto all&#x27;infanzia e all&#x27;istruzione, il disagio di trattarli come mezzi di produzione. &lt;strong&gt;Rischio:&lt;/strong&gt; andarsene può togliere reddito alla famiglia e spingere i bambini verso lavori peggiori. Ci si lava le mani, ma il problema resta.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuizione:&lt;/strong&gt; “Il fornitore va bene, ma niente bambini: lo metto per iscritto e lo controllo.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cosa c&#x27;è sotto:&lt;/strong&gt; la ricerca di un compromesso tra efficienza e responsabilità. &lt;strong&gt;Rischio:&lt;/strong&gt; una clausola senza controlli né aiuto concreto alla famiglia (salari adulti adeguati, scuola) resta sulla carta.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuizione:&lt;/strong&gt; “Non so abbastanza: i bambini vanno a scuola? Quante ore lavorano? Cosa dice la legge thailandese?”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cosa c&#x27;è sotto:&lt;/strong&gt; prudenza e senso di responsabilità per le informazioni. &lt;strong&gt;Rischio:&lt;/strong&gt; usare l&#x27;incertezza come scusa per rimandare la decisione all&#x27;infinito.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Perché il dubbio arriva solo all&#x27;aeroporto&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Thomas M. Jones (1991) chiama &lt;span class=&quot;term&quot;&gt;moral intensity&lt;/span&gt; (intensità morale) quanto una questione “spinge” a essere riconosciuta come morale. Dipende da sei caratteristiche del problema, non della persona. Apri ciascuna per vederla applicata al caso.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;details&gt;&lt;summary&gt;Magnitude of consequences&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quanto è grave il danno. Sviluppo, scuola e salute di bambini piccoli: potenzialmente alto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Social consensus&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quanto è condiviso che sia sbagliato. In Europa molto; il partner thai dice che lì è normale. Il consenso è diviso e l&#x27;intensità percepita cala.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Probability of effect&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quanto è probabile il danno. Non è chiaro (non sappiamo della scuola), e questo abbassa l&#x27;intensità.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Temporal immediacy&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quanto presto arrivano le conseguenze. Il risparmio è immediato, i danni allo sviluppo si vedono dopo anni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Proximity&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quanto ci si sente vicini a chi è coinvolto. &lt;strong&gt;Le nipoti di 5 e 7 anni&lt;/strong&gt; la aumentano di colpo: è il momento della svolta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Concentration of effect&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quante persone subiscono il danno, e quanto per ciascuna. Pochi bambini, ma colpiti in modo serio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Fonte esterna per il modello: Jones, T. M. (1991), &lt;em&gt;Academy of Management Review&lt;/em&gt; 16(2), 366–395 — &lt;a href=&quot;https://www.proquest.com/docview/198088404&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;record ProQuest&lt;/a&gt;.&lt;/p&gt;

    &lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;strong&gt;Tre test pratici per mettere alla prova l&#x27;intuizione&lt;/strong&gt; &lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Test delle nipoti&lt;/strong&gt; (è il caso stesso): accetterei la cosa se toccasse le persone a cui voglio bene? · &lt;strong&gt;Test del giornale&lt;/strong&gt;: sarei a mio agio se la mia scelta finisse in prima pagina? · &lt;strong&gt;Test dello specchio&lt;/strong&gt;: che persona divento se la faccio? I tre test anticipano tre teorie della Parte 3: universalizzabilità/giustizia, conseguenze/reputazione, virtù.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · gut reaction&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché l&#x27;esercizio chiede la reazione istintiva &lt;em&gt;prima&lt;/em&gt; delle ragioni?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Per rendere visibile il punto di partenza reale (spesso emotivo) e poi esaminarlo. Le ragioni trovate dopo possono confermare l&#x27;intuizione, ma anche correggerla: è così che il giudizio morale diventa più solido.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale componente della moral intensity cambia all&#x27;aeroporto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Soprattutto la &lt;strong&gt;proximity&lt;/strong&gt;: pensando alle nipoti, i bambini thailandesi smettono di essere un dato astratto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;«Lavoravano felici, quindi non c&#x27;è problema». Cosa non funziona in questo ragionamento?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quello che si vede in una visita (l&#x27;umore) non basta a stabilire il danno (scuola persa, ore, salute, sviluppo). In più i bambini non possono scegliere liberamente e non hanno il potere di rifiutare.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 3 TEORIE ===================== --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s-teorie&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 3 · Domanda 2&lt;/div&gt;
    &lt;h2&gt;Dalle ragioni ai valori: le normative ethical theories&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; &lt;em&gt;«Based on your spontaneous immediate decision, can you set out the reasons for your choice? Also, can you relate those reasons back to some underlying values or principles that are obviously important to you?»&lt;/em&gt;&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; La domanda chiede di salire una scala: dalla reazione alle &lt;strong&gt;ragioni&lt;/strong&gt;, dalle ragioni ai &lt;span class=&quot;term&quot;&gt;values&lt;/span&gt; (ciò che riteniamo importante: famiglia, infanzia, lavoro, prosperità) e ai &lt;span class=&quot;term&quot;&gt;principles&lt;/span&gt; (regole generali: “non usare le persone”, “massimizza il benessere”). Le &lt;span class=&quot;term&quot;&gt;normative ethical theories&lt;/span&gt; (teorie etiche normative, che dicono come &lt;em&gt;si dovrebbe&lt;/em&gt; agire) sono i principi messi in ordine e pensati fino in fondo.&lt;/p&gt;
    &lt;figure&gt;

      &lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;64&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;335&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Ragioni&lt;/text&gt;&lt;/g&gt;

      &lt;g class=&quot;node n-sage&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;12&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;795&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Teorie normative&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M200,105 L238,95&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M430,80 L468,70&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M660,54 L698,44&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;335&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;«perché?»&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;565&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;«cosa conta per me?»&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;795&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;«è coerente? regge?»&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;h3&gt;La mappa delle teorie&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Il caso viene dal capitolo &lt;em&gt;“Evaluating business ethics: normative ethical theories”&lt;/em&gt; del manuale Crane &amp;amp; Matten (&lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;indice OUP&lt;/a&gt;), che divide le teorie così. Le spiegazioni qui sotto sono mie, in sintesi.&lt;/p&gt;
    &lt;figure&gt;

      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;160&quot; width=&quot;200&quot; height=&quot;36&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;svgtxt&quot; x=&quot;110&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Consequentialist&lt;/text&gt;&lt;/g&gt;
