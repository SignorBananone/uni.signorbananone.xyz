    &lt;h3&gt;Ogni teoria applicata al caso&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Kant&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Justice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Feminist&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Discourse&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Postmodern&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;h4&gt;Ethical egoism&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; un&#x27;azione è giusta se serve l&#x27;interesse a lungo termine di chi la compie. (È anche la base morale dell&#x27;economia di mercato: la “mano invisibile” di Adam Smith.)&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; il bonus e il successo professionale dicono “firma”. Ma un egoista &lt;em&gt;accorto&lt;/em&gt; guarda al lungo termine: lo scandalo, se esce la notizia dei bambini, colpisce l&#x27;azienda e il manager. E il disagio all&#x27;aeroporto è anch&#x27;esso un costo personale.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; gli interessi degli altri contano solo se tornano utili a me; i bambini non sono presi in considerazione per loro stessi.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Utilitarianism&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Bentham, Mill) è giusta l&#x27;azione che produce &lt;strong&gt;la massima felicità per il maggior numero&lt;/strong&gt; di persone coinvolte. Si fa una sorta di &lt;span class=&quot;term&quot;&gt;cost-benefit analysis&lt;/span&gt; morale su tutti gli &lt;span class=&quot;term&quot;&gt;stakeholders&lt;/span&gt; (chiunque è toccato dalla decisione).&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;Formula semplificata: utilità netta di un&#x27;opzione = Σ (benefici per ciascuno) − Σ (danni per ciascuno). Si sceglie l&#x27;opzione con il valore più alto.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Prova:&lt;/strong&gt; dai un peso a ciascun effetto (0–10) e guarda come cambia la classifica delle opzioni. È un modello giocattolo: mostra la logica dell&#x27;utilitarismo e i suoi problemi (come si misura lo sviluppo di un bambino contro qualche centesimo?).&lt;/p&gt;
        &lt;div class=&quot;card&quot; data-util&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-s&quot;&gt;Risparmio per azienda e consumatori&lt;/label&gt;&lt;input id=&quot;u-s&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-i&quot;&gt;Reddito per le famiglie thai&lt;/label&gt;&lt;input id=&quot;u-i&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-h&quot;&gt;Danno ai bambini (scuola, salute)&lt;/label&gt;&lt;input id=&quot;u-h&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-r&quot;&gt;Rischio reputazione e legge&lt;/label&gt;&lt;input id=&quot;u-r&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-p&quot;&gt;% che i bambini finiscano in lavori peggiori se te ne vai&lt;/label&gt;&lt;input id=&quot;u-p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;bars&quot; style=&quot;margin-top:14px&quot;&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;A · Firmare così&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;a&quot;&gt;&lt;/output&gt;&lt;/div&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;B · Rinunciare&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;b&quot;&gt;&lt;/output&gt;&lt;/div&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;C · Firmare con condizioni&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;c&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;c&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;small&quot; style=&quot;margin-top:10px&quot;&gt;Regole del modello: A = risparmio + reddito − danno − rischio. B = − reddito − (danno × 1,5 × probabilità di finire in lavori peggiori). C = 0,6 × risparmio (costi un po&#x27; più alti per salari adulti e controlli) + reddito − 0,2 × danno − 0,3 × rischio. &lt;span data-uverdict class=&quot;verdict&quot;&gt;&lt;/span&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; misurare e sommare beni diversi è arbitrario; e se il risparmio per milioni di consumatori fosse enorme, l&#x27;utilitarismo potrebbe “giustificare” il danno a pochi bambini. Le teorie non-consequentialist nascono anche da questa obiezione.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Ethics of duties (Kant)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; certi doveri valgono a prescindere dalle conseguenze. Il &lt;span class=&quot;term&quot;&gt;categorical imperative&lt;/span&gt; (imperativo categorico) ha due formulazioni utili qui:&lt;/p&gt;
        &lt;p&gt;① &lt;em&gt;Universalizzabilità&lt;/em&gt;: agisci solo secondo una regola che potresti volere come legge per tutti. “Le aziende possono far lavorare bambini di 5 anni se costa meno” varrebbe anche per le tue nipoti: la vorresti?&lt;br&gt;② &lt;em&gt;Umanità&lt;/em&gt;: tratta le persone sempre anche come &lt;strong&gt;fini&lt;/strong&gt;, mai solo come &lt;strong&gt;mezzi&lt;/strong&gt;. I bambini qui sono usati come manodopera a basso costo, senza poter acconsentire.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; il momento all&#x27;aeroporto è, di fatto, un test di universalizzabilità.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; rigido quando i doveri sono in conflitto (dovere verso i bambini vs. dovere verso l&#x27;azienda e i suoi lavoratori).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Rights&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; ogni essere umano ha &lt;span class=&quot;term&quot;&gt;human rights&lt;/span&gt; (diritti umani) fondamentali che altri non possono sacrificare per un vantaggio, nemmeno collettivo.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; diritto all&#x27;istruzione, al gioco, alla salute, a non essere sfruttati economicamente. &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La Convenzione ONU sui diritti dell&#x27;infanzia (art. 32) riconosce il diritto del bambino a essere protetto da lavori che ostacolano l&#x27;istruzione o danneggiano salute e sviluppo (vedi Parte 5).&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; i diritti possono scontrarsi (diritto della famiglia a un reddito vs. diritto del bambino alla scuola) e non dicono sempre chi deve garantirli: lo Stato thai? il produttore? il cliente europeo?&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Justice (Rawls)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; la &lt;span class=&quot;term&quot;&gt;justice&lt;/span&gt; (giustizia) riguarda la distribuzione equa di benefici e oneri. John Rawls propone il &lt;span class=&quot;term&quot;&gt;veil of ignorance&lt;/span&gt; (velo d&#x27;ignoranza): scegli le regole senza sapere che posto occuperai nella società. Secondo il &lt;span class=&quot;term&quot;&gt;difference principle&lt;/span&gt; le disuguaglianze vanno bene solo se migliorano la posizione di chi sta peggio.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Prova il velo:&lt;/strong&gt; estrai a caso chi sarai in questa catena di fornitura e chiediti se accetteresti il contratto così com&#x27;è.&lt;/p&gt;
        &lt;div class=&quot;card&quot; data-veil&gt;&lt;button class=&quot;btn&quot;&gt;Estrai un ruolo&lt;/button&gt; &lt;span data-role style=&quot;margin-left:10px;font-weight:600&quot;&gt;&lt;/span&gt;&lt;p data-role-note class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; i benefici (risparmio, bonus) vanno a chi sta già meglio; i costi (infanzia, scuola) ricadono su chi sta peggio. Il contratto, così com&#x27;è, difficilmente passa il test.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Virtue ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (da Aristotele) la domanda non è “quale regola?” ma &lt;strong&gt;“che persona voglio essere?”&lt;/strong&gt;. Le &lt;span class=&quot;term&quot;&gt;virtues&lt;/span&gt; (virtù: onestà, compassione, giustizia, saggezza pratica) si formano con le azioni ripetute.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; un manager compassionevole e prudente non firma pensando solo al bonus, ma nemmeno scappa: cerca la via che una persona saggia riconoscerebbe come giusta. È il “test dello specchio”.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; dà poche indicazioni concrete su &lt;em&gt;cosa&lt;/em&gt; fare in una situazione precisa.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Feminist ethics (ethics of care)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; la morale nasce dalle &lt;strong&gt;relazioni&lt;/strong&gt;, dall&#x27;empatia e dalla cura, più che da regole astratte. Conta mantenere relazioni buone e attente ai bisogni concreti.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; mette in luce entrambi i lati. La famiglia che lavora unita, con la nonna che cucina, è una rete di cura che non va distrutta. Ma i bambini hanno bisogni specifici (gioco, scuola). E il manager scopre la propria relazione di cura con le nipoti, che si estende ai bambini thai.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; rischia di favorire chi ci è vicino rispetto a chi è lontano.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Discourse ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Habermas) una norma è giusta se tutti gli interessati potrebbero accettarla in un &lt;strong&gt;dialogo&lt;/strong&gt; libero e razionale. L&#x27;etica diventa una procedura per risolvere i conflitti.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; invece di decidere da solo in aeroporto, il manager dovrebbe aprire il confronto con il produttore, i genitori, magari ONG e autorità locali, e i colleghi in azienda. Ma i bambini possono partecipare davvero a questo dialogo?&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; lento, e presuppone che le parti abbiano pari potere (qui non è così).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Postmodern ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Bauman) diffida delle grandi teorie e dà valore all&#x27;&lt;strong&gt;impulso morale&lt;/strong&gt;, al “sentire” che nasce dal trovarsi davanti all&#x27;altro. Valuta caso per caso.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; è la teoria che prende più sul serio la &lt;em&gt;gut reaction&lt;/em&gt; della domanda 1. Il disagio all&#x27;aeroporto non è un errore da correggere con la teoria, ma un segnale morale da ascoltare.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limite:&lt;/strong&gt; poco prevedibile; difficile da trasformare in politiche aziendali.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Gioco: da quale valore nasce questa ragione?&lt;/h3&gt;
    &lt;p&gt;Clicca una frase che un manager potrebbe dire per spiegare la propria scelta: vedrai il valore e la teoria che ci stanno dietro.&lt;/p&gt;
    &lt;div class=&quot;chips&quot; data-match&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Ethical egoism&lt;/strong&gt; · valore: interesse personale e carriera.&quot;&gt;«Il risparmio mi garantisce il bonus.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Utilitarianism&lt;/strong&gt; · valore: benessere complessivo. Attenzione: conta anche il danno ai bambini.&quot;&gt;«Costa un terzo, i clienti pagano meno e la famiglia guadagna.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Kant, universalizzabilità&lt;/strong&gt; (e il velo di Rawls) · valore: coerenza, imparzialità.&quot;&gt;«Non lo accetterei per le mie nipoti.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Rights&lt;/strong&gt; · valore: dignità e infanzia come diritti non negoziabili.&quot;&gt;«I bambini hanno diritto di andare a scuola e giocare.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Ethical relativism&lt;/strong&gt; · valore: rispetto per le altre culture. Vedi Parte 4: è davvero la cultura, o la povertà?&quot;&gt;«Lì è normale, chi sono io per giudicare?»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Virtue ethics&lt;/strong&gt; · valore: integrità e carattere.&quot;&gt;«Non voglio diventare il tipo di persona che firma questo.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Feminist ethics / care&lt;/strong&gt; · valore: relazioni familiari e cura.&quot;&gt;«Lavorano insieme, uniti, con la nonna che cucina.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Postmodern ethics&lt;/strong&gt; · valore: ascoltare l&#x27;impulso morale.&quot;&gt;«Sento che è sbagliato, anche se non so spiegare perché.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Discourse ethics&lt;/strong&gt; · valore: equità della procedura, voce agli interessati.&quot;&gt;«Prima di decidere ne parlerei con il fornitore, la famiglia e un&#x27;ONG.»&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Utilitarianism / egoism di lungo periodo&lt;/strong&gt; · valore: reputazione e sostenibilità dell&#x27;impresa.&quot;&gt;«Se esce sui giornali, il marchio è rovinato.»&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;box reveal&quot; data-match-out&gt;&lt;span class=&quot;small&quot;&gt;La risposta appare qui.&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;box&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Pragmatic pluralism.&lt;/strong&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Crane &amp;amp; Matten non chiedono di scegliere &lt;em&gt;una&lt;/em&gt; teoria “vera”: le teorie sono strumenti, lenti diverse che illuminano aspetti diversi di un problema. Se lenti diverse portano alla stessa conclusione, quella conclusione è più solida. Nel caso: Kant, diritti, giustizia, virtù e perfino l&#x27;egoismo di lungo periodo concordano che &lt;strong&gt;il contratto così com&#x27;è non va bene&lt;/strong&gt;. L&#x27;utilitarismo e l&#x27;etica della cura avvertono invece di &lt;strong&gt;non scaricare il costo sulla famiglia&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · teorie normative&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Qual è la differenza fra consequentialist e non-consequentialist theories? Fai un esempio dal caso.&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Le prime giudicano dalle conseguenze (utilitarismo: confronto risparmio e reddito con il danno ai bambini); le seconde da principi validi in sé (Kant: non usare i bambini solo come mezzi, comunque vadano i numeri).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale formulazione dell&#x27;imperativo categorico corrisponde al “test delle nipoti”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;L&#x27;universalizzabilità: se la regola che sto seguendo dovesse valere per tutti, anche per le mie nipoti, la accetterei?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché un utilitarista potrebbe essere contrario a rompere subito il contratto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché senza quel reddito la famiglia potrebbe stare peggio e i bambini potrebbero finire in lavori più pericolosi. Conta il risultato netto per tutti, non la coscienza pulita del manager.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Cosa vuol dire pragmatic pluralism e perché è utile qui?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Usare più teorie come strumenti complementari invece di sceglierne una sola. Fa emergere sia il nucleo condiviso (no a bambini di 5 anni al lavoro) sia i rischi di una soluzione affrettata (abbandonare la famiglia).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 4 RELATIVISMO ===================== --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;s-relativ&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 4&lt;/div&gt;
    &lt;h2&gt;«È una pratica comune qui»: relativismo o principi universali?&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; Il partner thai spiega che il lavoro a domicilio delle famiglie è &lt;em&gt;“a very common and well-established practice in this part of the country”&lt;/em&gt; e che garantisce buona qualità.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Questa frase porta al cuore dell&#x27;etica negli affari internazionali: &lt;strong&gt;i giudizi morali valgono ovunque o dipendono dal contesto?&lt;/strong&gt;&lt;/p&gt;

    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Spettro tra absolutism e relativism&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gr&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; style=&quot;stop-color:var(--slate)&quot;/&gt;&lt;stop offset=&quot;.5&quot; style=&quot;stop-color:var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; style=&quot;stop-color:var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;rect x=&quot;40&quot; y=&quot;62&quot; width=&quot;820&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;url(#gr)&quot;/&gt;
      &lt;circle cx=&quot;60&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-slate&quot;/&gt;&lt;circle cx=&quot;450&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-sage&quot;/&gt;&lt;circle cx=&quot;840&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-brick&quot;/&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;60&quot; y=&quot;40&quot; font-size=&quot;16&quot;&gt;Ethical absolutism&lt;/text&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;450&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Core values + moral free space&lt;/text&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;840&quot; y=&quot;40&quot; text-anchor=&quot;end&quot; font-size=&quot;16&quot;&gt;Ethical relativism&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;60&quot; y=&quot;104&quot; font-size=&quot;12.5&quot;&gt;«le mie regole valgono ovunque»&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;450&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;pochi principi universali,&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;450&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;molta libertà sul resto&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;840&quot; y=&quot;104&quot; text-anchor=&quot;end&quot; font-size=&quot;12.5&quot;&gt;«paese che vai, morale che trovi»&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;60&quot; y=&quot;140&quot; font-size=&quot;12&quot; style=&quot;fill:var(--slate)&quot;&gt;rischio: ethical imperialism&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;840&quot; y=&quot;140&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;rischio: tutto è giustificabile&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Relativism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Absolutism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;La via di mezzo&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Ethical relativism&lt;/span&gt; (relativismo etico): giusto e sbagliato dipendono dalla cultura; non esiste un punto di vista neutro da cui giudicare le pratiche altrui.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; «Se in Thailandia i bambini aiutano la famiglia, chi sono io, europeo, per dire che è sbagliato?» È un argomento di rispetto e di umiltà.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Problemi:&lt;/strong&gt; ① che una pratica sia &lt;em&gt;comune&lt;/em&gt; è un fatto, che sia &lt;em&gt;giusta&lt;/em&gt; è un giudizio: dal fatto non segue il giudizio (in filosofia è la distanza tra “is” e “ought”, essere e dover essere). ② “La cultura” spesso è povertà: le famiglie non scelgono liberamente. ③ La fonte è interessata: è il fornitore a dirlo. ④ Lo stesso Stato thai fissa per legge un&#x27;età minima (Parte 5): la “cultura locale” non è unanime.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Ethical absolutism&lt;/span&gt; (assolutismo etico): esistono principi validi ovunque e sempre. Nella versione estrema si applicano semplicemente le regole del proprio paese.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nel caso:&lt;/strong&gt; «In Europa il lavoro minorile è vietato, quindi vale anche in Thailandia, punto.»&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Problemi:&lt;/strong&gt; diventa facilmente &lt;span class=&quot;term&quot;&gt;ethical imperialism&lt;/span&gt; (imperialismo etico: imporre i propri standard senza capire il contesto). Non distingue tra un bambino di 14 anni che aiuta qualche ora dopo la scuola e uno di 5 che monta pezzi tutto il giorno; e può portare a soluzioni che peggiorano la vita delle persone che si vuole proteggere.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Thomas Donaldson (&lt;em&gt;“Values in Tension: Ethics Away from Home”&lt;/em&gt;, Harvard Business Review, 1996) propone una via di mezzo: esistono &lt;span class=&quot;term&quot;&gt;core values&lt;/span&gt; (valori fondamentali) da rispettare ovunque, come la dignità umana e i diritti fondamentali, mentre su molte altre pratiche le aziende devono lasciare spazio alle differenze locali. Con Dunfee ha sviluppato l&#x27;idea di &lt;span class=&quot;term&quot;&gt;hypernorms&lt;/span&gt;: norme così fondamentali da valere in ogni comunità e da porre limiti alle norme locali.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Domanda chiave:&lt;/strong&gt; la pratica è diversa per &lt;strong&gt;tradizione culturale&lt;/strong&gt; o per &lt;strong&gt;livello di sviluppo economico&lt;/strong&gt;? Nel secondo caso ci si chiede: &lt;em&gt;sarebbe accettabile a casa nostra se fossimo allo stesso livello di sviluppo?&lt;/em&gt; Ma anche così, una pratica che viola un core value resta inaccettabile.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Un percorso per decidere (schema ispirato a Donaldson)&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-tree&gt;
      &lt;div data-node=&quot;0&quot;&gt;&lt;h4&gt;La pratica viola un core value (dignità, diritti fondamentali, sicurezza)?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Bambini di 5 anni al lavoro tutto il giorno, forse senza scuola: probabilmente sì. Ma se fossero quattordicenni che aiutano poche ore dopo la scuola?&lt;/p&gt;&lt;div class=&quot;seg&quot;&gt;&lt;button data-go=&quot;1&quot;&gt;Sì, chiaramente&lt;/button&gt;&lt;button data-go=&quot;2&quot;&gt;No / non è chiaro&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div data-node=&quot;1&quot; hidden&gt;&lt;h4&gt;→ Inaccettabile ovunque&lt;/h4&gt;&lt;p&gt;Non basta che sia “comune”. Si può ancora scegliere &lt;em&gt;come&lt;/em&gt; intervenire (Parte 6): correggere la pratica con il fornitore o, se non si può, uscirne senza scaricare i costi sulle famiglie.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;
      &lt;div data-node=&quot;2&quot; hidden&gt;&lt;h4&gt;La differenza dipende dallo sviluppo economico o dalla tradizione culturale?&lt;/h4&gt;&lt;div class=&quot;seg&quot;&gt;&lt;button data-go=&quot;3&quot;&gt;Sviluppo economico&lt;/button&gt;&lt;button data-go=&quot;4&quot;&gt;Tradizione culturale&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div data-node=&quot;3&quot; hidden&gt;&lt;h4&gt;Sarebbe accettabile a casa nostra se avessimo lo stesso livello di sviluppo?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se sì, si può accettare temporaneamente, lavorando per migliorare. Se no, va trattata come una violazione.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;
      &lt;div data-node=&quot;4&quot; hidden&gt;&lt;h4&gt;Si può fare business senza adottare la pratica? E la pratica viola un core value?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se si può evitarla, la si evita; se non si può e non viola core values, rientra nel &lt;em&gt;moral free space&lt;/em&gt; (spazio di libertà morale) e si può rispettare la differenza.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Lo schema è una sintesi didattica; per i dettagli leggi l&#x27;articolo originale (link in fondo).&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · relativismo&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;«È una pratica comune e consolidata»: perché non basta a renderla giusta?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché descrive ciò che &lt;em&gt;è&lt;/em&gt;, non ciò che &lt;em&gt;deve essere&lt;/em&gt;. Inoltre lo dice una parte interessata, e la diffusione può dipendere dalla povertà più che da una scelta culturale libera.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;ethical imperialism e perché è un rischio anche per chi vuole proteggere i bambini?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;È l&#x27;imposizione dei propri standard senza tener conto del contesto. Può portare a soluzioni che sembrano morali in Europa ma peggiorano la situazione locale (es. la famiglia perde reddito e i figli vanno a lavorare altrove, in condizioni peggiori).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Cosa sono le hypernorms?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Norme morali fondamentali, riconosciute in modo trasversale alle culture, che limitano ciò che le norme locali possono permettere (es. il rispetto della dignità umana e dei diritti di base).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 5 CHILD LABOUR ===================== --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-child&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 5&lt;/div&gt;
    &lt;h2&gt;Child labour: cosa dicono le norme&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Le slide non citano leggi, ma la domanda “è sbagliato?” ha anche una risposta giuridica. Prima una distinzione fondamentale dell&#x27;ILO (International Labour Organization, l&#x27;agenzia ONU per il lavoro):&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Child work&lt;/h4&gt;&lt;p&gt;Attività che un bambino può svolgere senza danno: aiutare in casa o nell&#x27;attività di famiglia per poco tempo, in modo adatto all&#x27;età, &lt;strong&gt;senza togliere tempo alla scuola&lt;/strong&gt;. Può anche essere educativa.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Child labour&lt;/h4&gt;&lt;p&gt;Lavoro che priva i bambini dell&#x27;infanzia, del potenziale e della dignità, danneggia sviluppo fisico o mentale, &lt;strong&gt;interferisce con la scuola&lt;/strong&gt;, o riguarda bambini sotto l&#x27;età minima. È questo che le norme vietano.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Le soglie di età della convenzione ILO C138&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La &lt;em&gt;Minimum Age Convention&lt;/em&gt; del 1973 (C138) fissa l&#x27;età minima generale a &lt;strong&gt;non meno di 15 anni&lt;/strong&gt; (14 come soglia iniziale per i paesi in via di sviluppo che ne fanno dichiarazione), permette &lt;span class=&quot;term&quot;&gt;light work&lt;/span&gt; (lavoro leggero, che non danneggia salute e scuola) dai &lt;strong&gt;13 anni&lt;/strong&gt; (12 nei paesi con la clausola), e vieta il &lt;span class=&quot;term&quot;&gt;hazardous work&lt;/span&gt; (lavoro pericoloso) &lt;strong&gt;sotto i 18&lt;/strong&gt;.&lt;/p&gt;

    &lt;div class=&quot;card&quot; data-age&gt;
      &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Fasce d&#x27;età della convenzione C138&quot;&gt;
        &lt;g data-zones&gt;&lt;/g&gt;
        &lt;g data-ticks class=&quot;svgmut&quot; font-size=&quot;12&quot;&gt;&lt;/g&gt;
        &lt;rect data-kids x=&quot;0&quot; y=&quot;18&quot; height=&quot;8&quot; rx=&quot;4&quot; class=&quot;f-brick&quot;/&gt;
        &lt;text data-kids-l class=&quot;svgmut&quot; font-size=&quot;12&quot; y=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;i 6 bambini del caso (5–14)&lt;/text&gt;
        &lt;polygon data-mark points=&quot;0,0&quot; class=&quot;f-accent&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ag&quot;&gt;Età del bambino&lt;/label&gt;&lt;input id=&quot;ag&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;18&quot; value=&quot;9&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0&quot;&gt;
        &lt;span class=&quot;small&quot;&gt;Tipo di lavoro:&lt;/span&gt;
        &lt;div class=&quot;seg&quot; data-work&gt;&lt;button aria-pressed=&quot;false&quot; data-w=&quot;light&quot;&gt;leggero, poche ore, fuori scuola&lt;/button&gt;&lt;button aria-pressed=&quot;true&quot; data-w=&quot;full&quot;&gt;tutto il giorno (come nel caso)&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-w=&quot;haz&quot;&gt;pericoloso&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;label class=&quot;small&quot;&gt;&lt;input type=&quot;checkbox&quot; data-dev&gt; Paese in via di sviluppo che usa la clausola C138 (14 / 12 anni)&lt;/label&gt;
      &lt;div class=&quot;box&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;p data-age-out style=&quot;margin:0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;Semplificazione didattica dello standard internazionale; non sostituisce la legge nazionale (in Thailandia l&#x27;età minima è 15) né le eccezioni previste (es. spettacoli artistici).&lt;/p&gt;
    &lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;C182 · Worst Forms of Child Labour Convention (1999)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Chiede l&#x27;eliminazione urgente delle &lt;span class=&quot;term&quot;&gt;worst forms of child labour&lt;/span&gt; (peggiori forme) per tutti i minori di 18 anni: schiavitù e pratiche simili (tratta, lavoro forzato, servitù per debiti), sfruttamento sessuale, attività illecite, e lavori che per natura o condizioni danneggiano salute, sicurezza o moralità. Nel caso non c&#x27;è nulla del genere, salvo che le ore o i materiali rendano il lavoro &lt;em&gt;hazardous&lt;/em&gt;: un&#x27;altra cosa da verificare.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;UN Convention on the Rights of the Child (1989), art. 32&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Riconosce il diritto del bambino a essere protetto dallo sfruttamento economico e da lavori pericolosi, che ostacolano l&#x27;istruzione o danneggiano salute e sviluppo; chiede agli Stati di fissare età minime e orari. È la base “di diritti” della Parte 3.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;La legge thailandese&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo i rapporti del Dipartimento del Lavoro USA (ILAB), il &lt;em&gt;Labour Protection Act&lt;/em&gt; thailandese fissa l&#x27;età minima per lavorare a &lt;strong&gt;15 anni&lt;/strong&gt; e a 18 per i lavori pericolosi; la Thailandia ha ratificato C138 e C182. Il &lt;em&gt;Home Workers Protection Act&lt;/em&gt; del 2010 regola proprio il lavoro a domicilio su commissione, e un regolamento ministeriale vieta alcuni tipi di home work ai minori di 15 anni. Gli stessi rapporti segnalano lacune nell&#x27;applicazione. &lt;strong&gt;Conclusione per il caso:&lt;/strong&gt; dal “è comune” non segue “è legale”: tutti e sei i bambini (5–14 anni) sono sotto l&#x27;età minima thailandese.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;C177 · Home Work Convention (1996)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Definisce l&#x27;&lt;span class=&quot;term&quot;&gt;homeworker&lt;/span&gt; (chi lavora a casa propria, per una retribuzione, producendo ciò che chiede un committente) e chiede parità di trattamento con gli altri lavoratori: salario, sicurezza, età minima, diritto di associarsi. È stata la prima convenzione ILO per un gruppo di lavoratori, in gran parte donne, dell&#x27;&lt;span class=&quot;term&quot;&gt;informal economy&lt;/span&gt; (economia informale, fuori da contratti e controlli). Descrive esattamente il modello del caso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;h3&gt;Quanto è diffuso&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Le stime ILO-UNICEF pubblicate nel giugno 2025 contano circa &lt;strong&gt;138 milioni&lt;/strong&gt; di bambini in child labour nel 2024 (quasi l&#x27;8% dei bambini nel mondo), di cui circa &lt;strong&gt;54 milioni&lt;/strong&gt; in lavori pericolosi. Il numero è sceso di oltre 20 milioni rispetto al 2020, ma l&#x27;obiettivo di eliminare il lavoro minorile entro il 2025 non è stato raggiunto.&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; role=&quot;img&quot; aria-label=&quot;Child labour nel 2024: 138 milioni, di cui 54 milioni in lavori pericolosi&quot;&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;900&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot; style=&quot;opacity:.35&quot;/&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;352&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-brick&quot;/&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;12&quot; y=&quot;44&quot; font-size=&quot;14&quot; style=&quot;fill:var(--paper)&quot;&gt;54 mln: hazardous work&lt;/text&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;888&quot; y=&quot;44&quot; font-size=&quot;14&quot; text-anchor=&quot;end&quot;&gt;138 mln in child labour (2024)&lt;/text&gt;
        &lt;text class=&quot;svgmut&quot; x=&quot;0&quot; y=&quot;88&quot; font-size=&quot;12&quot;&gt;Fonte esterna: ILO-UNICEF, Child Labour: Global estimates 2024 (giugno 2025). Barra in scala.&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · child labour&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Un ragazzo di 14 anni che aiuta i genitori un&#x27;ora al giorno dopo la scuola fa child labour?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;In genere no: è &lt;em&gt;light work&lt;/em&gt; ammesso dai 13 anni secondo C138, se non danneggia salute e scuola (ma la legge nazionale può essere più severa, e il manager dovrebbe comunque verificare). Il bambino di 5 anni che monta pezzi tutto il giorno è chiaramente child labour.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché la distinzione child work / child labour è importante per evitare l&#x27;ethical imperialism?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Permette di non condannare ogni forma di aiuto familiare (culturalmente diffusa e talvolta educativa) e di concentrarsi su ciò che danneggia davvero: età troppo bassa, ore eccessive, scuola persa, pericoli.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale convenzione ILO descrive il modello produttivo del caso?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;La C177 sul lavoro a domicilio (Home Work Convention, 1996).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 6 DECIDERE ===================== --&gt;
&lt;section class=&quot;part p-accent&quot; id=&quot;s-decisione&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Parte 6&lt;/div&gt;
    &lt;h2&gt;Decidere: dalle teorie a cosa fare lunedì mattina&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Le slide si fermano alle domande. Qui mettiamo insieme le parti 2–5 per confrontare le opzioni reali del product manager.&lt;/p&gt;

    &lt;div class=&quot;tablewrap&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Opzione&lt;/th&gt;&lt;th&gt;Pro&lt;/th&gt;&lt;th&gt;Contro&lt;/th&gt;&lt;th&gt;Teorie a favore&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;A · Firmare così&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Risparmio di 2/3, bonus, reddito alle famiglie&lt;/td&gt;&lt;td&gt;Bambini sotto l&#x27;età minima legale; rischio legale e di reputazione; tratta i bambini come mezzi&lt;/td&gt;&lt;td&gt;Egoism di breve periodo; utilitarismo “ingenuo”&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;B · Rinunciare e restare in Portogallo&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Coscienza pulita, nessun rischio per il marchio&lt;/td&gt;&lt;td&gt;La famiglia perde reddito; i bambini possono finire in lavori peggiori; il problema resta, solo non lo vedi più&lt;/td&gt;&lt;td&gt;Rights, Kant (lettura rigida)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;C · Firmare con condizioni&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Mantiene reddito e risparmio (ridotto); cambia la pratica dall&#x27;interno&lt;/td&gt;&lt;td&gt;Costi di controllo; serve impegno vero e verificabile&lt;/td&gt;&lt;td&gt;Pragmatic pluralism: utilitarismo, justice, care, discourse, virtue&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D · Rimandare e informarsi&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Decisione su fatti verificati (scuola, ore, salari)&lt;/td&gt;&lt;td&gt;Può diventare un alibi; non risolve nulla da solo&lt;/td&gt;&lt;td&gt;Prudenza (virtue ethics)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;

    &lt;h3&gt;Due diligence, passo per passo&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; I &lt;em&gt;UN Guiding Principles on Business and Human Rights&lt;/em&gt; (2011) chiedono alle imprese di &lt;span class=&quot;term&quot;&gt;respect&lt;/span&gt; i diritti umani anche nella propria catena del valore, con un processo di &lt;span class=&quot;term&quot;&gt;human rights due diligence&lt;/span&gt; (verifica continua: individuare, prevenire, monitorare e comunicare gli impatti negativi) e di &lt;span class=&quot;term&quot;&gt;remediation&lt;/span&gt; (rimedio per chi ha subito un danno). Applicato al caso:&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stepbody&quot;&gt;
        &lt;svg viewBox=&quot;0 0 120 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;52&quot; style=&quot;fill:var(--accent-bg);stroke:var(--accent);stroke-width:3&quot;/&gt;&lt;text data-stepnum class=&quot;svgser&quot; x=&quot;60&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;48&quot; style=&quot;fill:var(--accent)&quot;&gt;1&lt;/text&gt;&lt;/svg&gt;
        &lt;div&gt;
          &lt;div data-step&gt;&lt;h4&gt;Identificare&lt;/h4&gt;&lt;p&gt;Raccogliere i fatti mancanti: età precise, scuola, ore, salario a pezzo, sicurezza dei materiali. Verificare la legge locale (età minima 15, Home Workers Act). Non fidarsi solo del fornitore.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Non decidere da solo&lt;/h4&gt;&lt;p&gt;Il bonus crea un conflitto d&#x27;interessi: portare la questione ai superiori, all&#x27;ufficio CSR o legale. Capire se l&#x27;azienda ha un &lt;span class=&quot;term&quot;&gt;code of conduct&lt;/span&gt; (codice di condotta) per i fornitori.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Prevenire e negoziare&lt;/h4&gt;&lt;p&gt;Clausola contrattuale: niente lavoro sotto l&#x27;età minima, nemmeno a domicilio. In cambio, un prezzo che permetta agli adulti di guadagnare abbastanza senza l&#x27;aiuto dei figli. Anche pagando di più, il risparmio rispetto al Portogallo può restare.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Rimediare&lt;/h4&gt;&lt;p&gt;Non “licenziare” i bambini e basta: sostenere il loro ritorno a scuola (borse, materiali), magari con ONG locali, perché la famiglia non perda tutto il reddito.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Monitorare&lt;/h4&gt;&lt;p&gt;Visite e &lt;span class=&quot;term&quot;&gt;audits&lt;/span&gt; (verifiche) indipendenti, anche senza preavviso; il lavoro a domicilio è difficile da controllare. Esistono programmi di settore come l&#x27;ICTI Ethical Toy Program.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Uscire solo come ultima scelta&lt;/h4&gt;&lt;p&gt;Se il fornitore rifiuta o non migliora, interrompere il rapporto in modo responsabile (preavviso, ricerca di alternative). Comunicare con trasparenza ciò che si è fatto.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;box&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Contesto normativo europeo&lt;/strong&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La &lt;em&gt;Corporate Sustainability Due Diligence Directive&lt;/em&gt; (Direttiva UE 2024/1760) trasforma la due diligence sui diritti umani, incluso il lavoro minorile, in un obbligo per le grandi imprese, nelle loro attività e catene del valore. La direttiva è stata modificata dopo l&#x27;adozione e le date di applicazione sono state rinviate: controlla sempre il testo consolidato su EUR-Lex.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Una traccia di risposta alla domanda 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Mostra un esempio di risposta ben costruita&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Reazione:&lt;/strong&gt; «Non firmerei il contratto così com&#x27;è, ma non me ne andrei subito.»&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Ragioni:&lt;/strong&gt; ① bambini di 5–14 anni lavorano tutto il giorno, sotto l&#x27;età minima della legge thailandese; ② non accetterei la stessa cosa per le mie nipoti; ③ il mio bonus non dovrebbe pesare sulla decisione; ④ andarmene subito toglierebbe reddito alla famiglia senza proteggere i bambini.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Valori e principi:&lt;/strong&gt; dignità e diritti dell&#x27;infanzia (rights), imparzialità e universalizzabilità (Kant, Rawls), integrità personale (virtue), attenzione alle conseguenze reali per la famiglia (utilitarianism, care).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Quindi:&lt;/strong&gt; firmerei solo con condizioni verificabili (niente lavoro minorile, prezzo che permetta salari adeguati agli adulti, sostegno alla scuola, controlli), dopo averne parlato in azienda.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica · decidere&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché “rinunciare al contratto” non è automaticamente la scelta più etica?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Protegge la reputazione dell&#x27;azienda, ma può peggiorare la situazione dei bambini (meno reddito per la famiglia, lavori più pericolosi). La responsabilità verso le persone coinvolte non finisce quando si esce dalla catena di fornitura.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Cos&#x27;è la remediation e come si applicherebbe qui?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Rimediare ai danni causati o favoriti: ad esempio sostenere il ritorno a scuola dei bambini e garantire agli adulti un reddito che non dipenda dal lavoro dei figli.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale ruolo gioca il bonus nella decisione e come andrebbe gestito?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;È un incentivo personale che spinge verso il risparmio massimo (conflitto d&#x27;interessi). Va reso esplicito e la decisione va condivisa con altri in azienda; a livello di organizzazione, gli incentivi dovrebbero premiare anche il rispetto degli standard etici, non solo il costo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== FONTI ===================== --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-fonti&quot;&gt;
  &lt;div class=&quot;wrap refs&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
    &lt;h2&gt;Testi, norme e dati&lt;/h2&gt;
    &lt;p&gt;La slide non cita autori o norme: è un caso con due domande. Qui sotto trovi i riferimenti usati per spiegare gli argomenti. &lt;strong&gt;Tutto in questa sezione è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/strong&gt;, verificato con la ricerca web: il link porta alla pagina consultata.&lt;/p&gt;

    &lt;h3&gt;Il manuale e la teoria&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;em&gt;Business Ethics&lt;/em&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;Il manuale da cui il caso sembra provenire (formato “An ethical dilemma”). La 5ª edizione è del 2019, la 2ª edizione internazionale del 2020; nell&#x27;indice c&#x27;è il capitolo “Evaluating business ethics: Normative ethical theories” seguito da “Making decisions in business ethics: Descriptive ethical theories”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è lì che egoism, utilitarianism, Kant, rights, justice, virtue, feminist, discourse e postmodern ethics e il pragmatic pluralism sono spiegati per esteso. &lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda OUP&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Haidt, J. (2001) — “The emotional dog and its rational tail”, &lt;em&gt;Psychological Review&lt;/em&gt; 108(4), 814–834&lt;/h4&gt;&lt;p&gt;Presenta il social intuitionist model: il giudizio morale nasce soprattutto da intuizioni rapide; il ragionamento spesso arriva dopo, per giustificarle.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega perché la domanda 1 (gut reaction) viene prima della domanda 2 (ragioni). &lt;a href=&quot;https://www.faculty.umb.edu/adam_beresford/courses/phil_281_11/reading_emotional_dog.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (copia didattica UMass Boston)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jones, T. M. (1991) — “Ethical decision making by individuals in organizations: An issue-contingent model”, &lt;em&gt;Academy of Management Review&lt;/em&gt; 16, 366–395&lt;/h4&gt;&lt;p&gt;Introduce la moral intensity, con sei componenti (gravità delle conseguenze, consenso sociale, probabilità, immediatezza, vicinanza, concentrazione) che influenzano ogni fase della decisione etica.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega perché il dubbio arriva solo all&#x27;aeroporto (proximity). &lt;a href=&quot;https://www.proquest.com/docview/198088404&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record ProQuest&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Donaldson, T. (1996) — “Values in Tension: Ethics Away from Home”, &lt;em&gt;Harvard Business Review&lt;/em&gt; 74(5), 48–62&lt;/h4&gt;&lt;p&gt;Come comportarsi quando una pratica accettata all&#x27;estero sembra immorale: rifiuta sia il relativismo culturale sia l&#x27;imperialismo etico e propone core values validi ovunque.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la risposta classica all&#x27;argomento «è pratica comune qui» (Parte 4). &lt;a href=&quot;https://hbr.org/1996/09/values-in-tension-ethics-away-from-home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Articolo su HBR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Norme internazionali e nazionali&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C138 — Minimum Age Convention, 1973&lt;/h4&gt;&lt;p&gt;Età minima generale non inferiore a 15 anni (14 per alcuni paesi in via di sviluppo), light work dai 13 (12), lavori pericolosi vietati sotto i 18.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dà le soglie per dire quando il lavoro dei bambini è child labour. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C138&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C182 — Worst Forms of Child Labour Convention, 1999&lt;/h4&gt;&lt;p&gt;Obbliga a eliminare con urgenza le peggiori forme di lavoro minorile (schiavitù, sfruttamento sessuale, attività illecite, lavori pericolosi) per i minori di 18 anni.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: segna il limite che nessuna “tradizione” può superare. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C182&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C177 — Home Work Convention, 1996&lt;/h4&gt;&lt;p&gt;Adottata nel 1996, in vigore dal 2000: definisce il lavoro a domicilio e chiede parità di trattamento per gli homeworkers. Ha avuto poche ratifiche.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: descrive esattamente il modello produttivo del caso. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C177&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UN Convention on the Rights of the Child, 1989&lt;/h4&gt;&lt;p&gt;L&#x27;art. 32 tutela i bambini dallo sfruttamento economico e dai lavori che danneggiano istruzione, salute e sviluppo.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base giuridica dell&#x27;approccio “rights”. &lt;a href=&quot;https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su OHCHR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Thailandia — Home Workers Protection Act B.E. 2553 (2010)&lt;/h4&gt;&lt;p&gt;Regola il lavoro su commissione svolto a casa (definizioni, obblighi del committente). Insieme al Labour Protection Act (età minima 15) delimita ciò che è legale nel caso.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra che la pratica “comune” è regolata anche dalla legge thai. &lt;a href=&quot;https://www.wiego.org/wp-content/uploads/2019/09/Thailand-Home-Workers-Protection-Act-B.E.-2553-2010.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Traduzione inglese (WIEGO, PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;U.S. Department of Labor (ILAB) — Findings on the Worst Forms of Child Labor: Thailand&lt;/h4&gt;&lt;p&gt;Rapporti annuali sul quadro legale (età minime, ratifiche, lacune nell&#x27;applicazione) e sui settori a rischio.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fonte aggiornata e verificabile sulla situazione thailandese. &lt;a href=&quot;https://www.dol.gov/agencies/ilab/resources/reports/child-labor/thailand&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina ILAB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Imprese e diritti umani&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights (2011)&lt;/h4&gt;&lt;p&gt;Il quadro “Protect, Respect and Remedy”, approvato all&#x27;unanimità dal Consiglio ONU per i diritti umani: dovere dello Stato di proteggere, responsabilità delle imprese di rispettare, accesso ai rimedi. Al centro c&#x27;è la human rights due diligence.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dice cosa ci si aspetta dall&#x27;azienda dolciaria verso i fornitori (Parte 6). &lt;a href=&quot;https://www.ohchr.org/sites/default/files/documents/publications/guidingprinciplesbusinesshr_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF su OHCHR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Direttiva (UE) 2024/1760 — Corporate Sustainability Due Diligence&lt;/h4&gt;&lt;p&gt;Obblighi di due diligence su diritti umani e ambiente per le grandi imprese e le loro catene del valore. Il testo è stato poi modificato: consulta la versione consolidata.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: oggi in Europa la domanda del caso non è solo morale, ma anche di compliance. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ICTI Ethical Toy Program&lt;/h4&gt;&lt;p&gt;Programma di settore nato nel 2004: audit indipendenti delle fabbriche di giocattoli su lavoro minorile, orari, salari e sicurezza, basati sulle convenzioni ILO. Ha ricevuto anche critiche (ad esempio da China Labor Watch) sulla sua efficacia.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: esempio concreto di monitoraggio nella filiera dei giocattoli, e dei suoi limiti. &lt;a href=&quot;https://ethicaltoyprogram.org/our-program/what-does-the-ethical-supply-chain-program-cover&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sito del programma&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Dati&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO-UNICEF — Child Labour: Global estimates 2024 (giugno 2025)&lt;/h4&gt;&lt;p&gt;Circa 138 milioni di bambini in child labour nel 2024, 54 milioni in lavori pericolosi; in calo di oltre 20 milioni dal 2020, ma lontano dall&#x27;obiettivo 2025.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dà la dimensione globale del problema dietro un singolo caso. &lt;a href=&quot;https://www.unicef.org/press-releases/despite-progress-child-labour-still-affects-138-million-children-globally-ilo-unicef&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato UNICEF&lt;/a&gt; · &lt;a href=&quot;https://www.ilo.org/resource/other/2024-global-estimates-child-labour-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dati ILO&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;),panels=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });
  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;[data-step]&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;[data-prev]&#x27;),next=s.querySelector(&#x27;[data-next]&#x27;),hand=s.querySelector(&#x27;[data-hand]&#x27;),i=0;
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;));});
    function show(){
      steps.forEach(function(x,j){x.hidden=j!==i;});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j===i?&#x27;on&#x27;:&#x27;&#x27;;});
      prev.disabled=i===0;next.disabled=i===steps.length-1;
      if(hand){var h=parseFloat(steps[i].dataset.hour||0);hand.style.transform=&#x27;rotate(&#x27;+(h%12)*30+&#x27;deg)&#x27;;}
      var num=s.querySelector(&#x27;[data-stepnum]&#x27;);if(num)num.textContent=i+1;
    }
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    show();
  });
  // saving
  var sv=document.querySelector(&#x27;[data-saving]&#x27;);
  if(sv){
    var p=sv.querySelector(&#x27;#sv-p&#x27;),q=sv.querySelector(&#x27;#sv-q&#x27;);
    var upd=function(){
      var pr=+p.value,qt=+q.value;
      p.nextElementSibling.textContent=pr.toFixed(2);q.nextElementSibling.textContent=qt;
      var save=pr*(2/3)*qt*1e6*2;
      sv.querySelector(&#x27;[data-sv-txt]&#x27;).textContent=&#x27;Risparmio sui 2 anni del contratto: circa &#x27;+Math.round(save).toLocaleString(&#x27;it-IT&#x27;)+&#x27; €&#x27;;
    };
    p.addEventListener(&#x27;input&#x27;,upd);q.addEventListener(&#x27;input&#x27;,upd);upd();
  }
  // utilitarian toy model
  var ut=document.querySelector(&#x27;[data-util]&#x27;);
  if(ut){
    var ids=[&#x27;u-s&#x27;,&#x27;u-i&#x27;,&#x27;u-h&#x27;,&#x27;u-r&#x27;,&#x27;u-p&#x27;];
    var names={a:&#x27;A · Firmare così&#x27;,b:&#x27;B · Rinunciare&#x27;,c:&#x27;C · Firmare con condizioni&#x27;};
    var calc=function(){
      var v={};ids.forEach(function(id){var el=document.getElementById(id);v[id]=+el.value;el.nextElementSibling.textContent=id===&#x27;u-p&#x27;?el.value+&#x27;%&#x27;:el.value;});
      var S=v[&#x27;u-s&#x27;],I=v[&#x27;u-i&#x27;],H=v[&#x27;u-h&#x27;],R=v[&#x27;u-r&#x27;],P=v[&#x27;u-p&#x27;]/100;
      var r={a:S+I-H-R,b:-I-H*1.5*P,c:0.6*S+I-0.2*H-0.3*R};
      var best=&#x27;a&#x27;;
      Object.keys(r).forEach(function(k){
        if(r[k]&gt;r[best])best=k;
        var f=ut.querySelector(&#x27;[data-u=&quot;&#x27;+k+&#x27;&quot;]&#x27;),w=Math.min(Math.abs(r[k])/20,1)*50;
        f.style.width=w+&#x27;%&#x27;;f.style.left=r[k]&gt;=0?&#x27;50%&#x27;:(50-w)+&#x27;%&#x27;;
        f.style.background=r[k]&gt;=0?&#x27;var(--sage)&#x27;:&#x27;var(--brick)&#x27;;
        ut.querySelector(&#x27;[data-uo=&quot;&#x27;+k+&#x27;&quot;]&#x27;).textContent=(r[k]&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+r[k].toFixed(1);
      });
      ut.querySelector(&#x27;[data-uverdict]&#x27;).textContent=&#x27;Con i tuoi pesi vince: &#x27;+names[best]+&#x27;.&#x27;;
    };
    ids.forEach(function(id){document.getElementById(id).addEventListener(&#x27;input&#x27;,calc);});calc();
  }
  // veil of ignorance
  var veil=document.querySelector(&#x27;[data-veil]&#x27;);
  if(veil){
