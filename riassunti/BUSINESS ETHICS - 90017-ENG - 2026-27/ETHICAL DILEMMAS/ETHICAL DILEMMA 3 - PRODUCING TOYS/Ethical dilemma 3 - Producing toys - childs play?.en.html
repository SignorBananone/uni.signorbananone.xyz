      &lt;a href=&quot;#s-child&quot;&gt;&lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;335&quot; width=&quot;230&quot; height=&quot;72&quot; rx=&quot;14&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;225&quot; y=&quot;365&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;5 · Child labour&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;225&quot; y=&quot;389&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;ILO C138 · C182 · Thai law&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
      &lt;a href=&quot;#s-decisione&quot;&gt;&lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;460&quot; y=&quot;340&quot; width=&quot;260&quot; height=&quot;72&quot; rx=&quot;14&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;590&quot; y=&quot;370&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;6 · Deciding&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;590&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;options · due diligence · remediation&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
      &lt;a href=&quot;#s-fonti&quot;&gt;&lt;text class=&quot;svgmut&quot; x=&quot;890&quot; y=&quot;455&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; style=&quot;fill:var(--accent);text-decoration:underline&quot;&gt;Further reading →&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Solid arrows are the logical steps of the case; the dashed one is the open question “are there norms that hold everywhere?”, which links relativism to child labour.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;box line small&quot;&gt;&lt;strong&gt;A note on the materials.&lt;/strong&gt; The lecture file is a single textbook page (case + questions). I was unable to read the list of other files in &lt;code&gt;corso/&lt;/code&gt; (I had no tool for browsing folders, and the file names I tried did not exist), so this page &lt;strong&gt;contains no material taken from other course files&lt;/strong&gt;. The links to the theoretical framework come from the textbook the case appears to be taken from: the show-through on the page reveals the section on &lt;em&gt;egoism&lt;/em&gt; and a reference to “Chapter 2”, as in the chapter on normative theories in Crane &amp;amp; Matten, &lt;em&gt;Business Ethics&lt;/em&gt; (see &lt;a href=&quot;#s-fonti&quot;&gt;Further reading&lt;/a&gt;).&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 1 IL CASO ===================== --&gt;
&lt;section class=&quot;part p-accent&quot; id=&quot;s-caso&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 1&lt;/div&gt;
    &lt;h2&gt;The case, step by step&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; You are the &lt;span class=&quot;term&quot;&gt;product manager&lt;/span&gt; (the person responsible for a product: costs, suppliers, results) at a confectionery company that puts small plastic toys inside its chocolates. At a trade fair in Europe you meet a Thai manufacturer; you travel to north-east Thailand to finalise a &lt;strong&gt;two-year supply contract&lt;/strong&gt;. The price is &lt;strong&gt;one third&lt;/strong&gt; of what the current Portuguese supplier charges, with equivalent quality and delivery terms.&lt;/p&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stepbody&quot;&gt;
        &lt;svg viewBox=&quot;0 0 120 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;54&quot; class=&quot;f-card&quot; style=&quot;stroke:var(--rule);stroke-width:3&quot;/&gt;&lt;g class=&quot;svgmut&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;20&quot;&gt;12&lt;/text&gt;&lt;text x=&quot;103&quot; y=&quot;64&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;108&quot;&gt;6&lt;/text&gt;&lt;text x=&quot;17&quot; y=&quot;64&quot;&gt;9&lt;/text&gt;&lt;/g&gt;&lt;line data-hand x1=&quot;60&quot; y1=&quot;60&quot; x2=&quot;60&quot; y2=&quot;24&quot; style=&quot;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:transform .4s;transform-origin:60px 60px&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;4&quot; class=&quot;f-accent&quot;/&gt;&lt;/svg&gt;
        &lt;div&gt;
          &lt;div data-step data-hour=&quot;11&quot;&gt;&lt;h4&gt;The price&lt;/h4&gt;&lt;p&gt;With the sales manager you agree on a price equal to 1/3 of the Portuguese one. To check that the process is reliable, you ask to visit the production site: &lt;strong&gt;there is no real workshop&lt;/strong&gt; on the premises.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;6&quot; hidden&gt;&lt;h4&gt;6:00 a.m. — the gate&lt;/h4&gt;&lt;p&gt;About &lt;strong&gt;30 men&lt;/strong&gt; queue at the gate, load large boxes of components onto carts and scooters, and take them &lt;strong&gt;home&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;10&quot; hidden&gt;&lt;h4&gt;During the day — the barn&lt;/h4&gt;&lt;p&gt;In a garage-like barn a large family assembles the toys: mother, father and their &lt;strong&gt;six children, aged 5 to 14&lt;/strong&gt;, who work “busily” and, as far as you can see, “very cheerfully”. The grandmother is cooking in the next room.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;8&quot; hidden&gt;&lt;h4&gt;8:00 p.m. — delivery&lt;/h4&gt;&lt;p&gt;The day&#x27;s work is over. The assembled parts go back into the boxes and to the company&#x27;s workshop, where &lt;strong&gt;the men are paid for the finished products&lt;/strong&gt;. At the end of the week the toys are shipped to Europe.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;2&quot; hidden&gt;&lt;h4&gt;The justification&lt;/h4&gt;&lt;p&gt;The Thai partner explains that this is a &lt;strong&gt;“very common and well-established”&lt;/strong&gt; practice in the area and that it ensures good quality. Satisfied, you say you will sign once you are back home, thinking of the savings and of your year-end &lt;strong&gt;bonus&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step data-hour=&quot;5&quot; hidden&gt;&lt;h4&gt;At the airport&lt;/h4&gt;&lt;p&gt;While buying souvenirs for your nieces, aged &lt;strong&gt;5 and 7&lt;/strong&gt;, you wonder whether you would want them to grow up like the children you have just “hired” to make your company&#x27;s toys.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The supply chain up close&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The &lt;span class=&quot;term&quot;&gt;supply chain&lt;/span&gt; (all the stages that take a product from raw materials to the customer) has a “hidden” link here. The European company signs with the manufacturer, but the actual work is done by a network of &lt;span class=&quot;term&quot;&gt;homeworkers&lt;/span&gt; (people paid by a contractor to work in their own homes). This is a case of informal &lt;span class=&quot;term&quot;&gt;subcontracting&lt;/span&gt;: the contract does not reach the people who do the work.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the supply chain in the case&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:none;stroke:var(--accent);stroke-dasharray:6 5&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;22&quot; y=&quot;40&quot; font-size=&quot;12&quot;&gt;what the contract covers&lt;/text&gt;
      &lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;450&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--brick-bg);stroke:none;opacity:.7&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;452&quot; y=&quot;40&quot; font-size=&quot;12&quot;&gt;what the contract does not see&lt;/text&gt;
      &lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;115&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Confectionery firm&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;115&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;Europe · you, the PM&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;325&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Thai manufacturer&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;325&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;sales manager · gate&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;460&quot; y=&quot;80&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;545&quot; y=&quot;112&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;~30 men&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;545&quot; y=&quot;134&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;boxes on scooters&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;680&quot; y=&quot;80&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;775&quot; y=&quot;106&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Families&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;775&quot; y=&quot;126&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;parents + children 5–14&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;775&quot; y=&quot;144&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;in the barn, at home&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M200,110 L238,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M410,110 L458,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M630,110 L678,110&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge dash&quot; d=&quot;M775,162 C760,215 360,215 330,164&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;550&quot; y=&quot;205&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;8 p.m. finished parts → piece-rate payment to the men → weekly shipment&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;115&quot; y=&quot;60&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;2-year contract · 1/3 price&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;635&quot; y=&quot;250&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;The children appear in no document: payment goes to the men, per piece.&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The further you move from the contract, the less transparency there is. This is usually where the ethical risk in a supply chain is hidden.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Established facts (from the slides)&lt;/h4&gt;&lt;p&gt;1/3 price, equivalent quality, 2-year contract; home-based work from 6 a.m. to 8 p.m.; six children aged 5–14 working alongside their parents; the men are paid for finished pieces; a “common” practice in the area; a personal bonus in prospect.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What the slides do not say&lt;/h4&gt;&lt;p&gt;Whether the children attend school; how many hours they actually work; how much the family earns and whether it is enough to live on; whether the materials (plastic, glues, paints) are safe; what the family would do without this work. &lt;strong&gt;Sound judgement starts by asking what is missing.&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;How much are the savings worth? &lt;span class=&quot;small&quot;&gt;(illustrative figures)&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The slides only say “one third of the cost”. The sliders let you estimate the order of magnitude of the economic incentive, which explains why the manager leaves “happy”. The values are invented: they are meant for reasoning, not for describing the case.&lt;/p&gt;
    &lt;div class=&quot;card&quot; data-saving&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sv-p&quot;&gt;Portuguese price per piece (€)&lt;/label&gt;&lt;input id=&quot;sv-p&quot; type=&quot;range&quot; min=&quot;0.05&quot; max=&quot;0.5&quot; step=&quot;0.01&quot; value=&quot;0.15&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sv-q&quot;&gt;Pieces per year (millions)&lt;/label&gt;&lt;input id=&quot;sv-q&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 120&quot; aria-label=&quot;Cost comparison&quot;&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;0&quot; y=&quot;28&quot; font-size=&quot;13&quot;&gt;Portugal&lt;/text&gt;&lt;rect data-bar-pt x=&quot;110&quot; y=&quot;12&quot; height=&quot;24&quot; rx=&quot;5&quot; class=&quot;f-slate&quot; width=&quot;460&quot;/&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;0&quot; y=&quot;72&quot; font-size=&quot;13&quot;&gt;Thailand&lt;/text&gt;&lt;rect data-bar-th x=&quot;110&quot; y=&quot;56&quot; height=&quot;24&quot; rx=&quot;5&quot; class=&quot;f-accent&quot; width=&quot;153&quot;/&gt;
        &lt;text data-sv-txt class=&quot;svgtxt&quot; x=&quot;110&quot; y=&quot;110&quot; font-size=&quot;14&quot;&gt;&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · the case&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why are the children described as an “invisible” link in the supply chain?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The contract is between the European company and the manufacturer; the manufacturer pays the men per piece. No document records who actually assembles the toys. The PM only sees them because they asked to visit the production site.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which two personal interests of the manager come into play?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The savings for the company (professional success) and the year-end &lt;strong&gt;bonus&lt;/strong&gt;. This is a minor &lt;span class=&quot;term&quot;&gt;conflict of interest&lt;/span&gt; (personal gain pushes towards a choice that ought to be assessed impartially).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What triggers the moral doubt, and why at that particular moment?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Buying presents for the nieces aged 5 and 7, who are the same age as the working children. The problem becomes close and personal: the potential victims now have a face (see &lt;em&gt;proximity&lt;/em&gt; in Part 2).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 2 GUT REACTION ===================== --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s-gut&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 2 · Question 1&lt;/div&gt;
    &lt;h2&gt;The gut reaction: what I feel before I reason&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; &lt;em&gt;«Reading the case and putting yourself in the role of the product manager, what would your immediate gut reaction be?»&lt;/em&gt;&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The &lt;span class=&quot;term&quot;&gt;gut reaction&lt;/span&gt; is the instinctive response: an immediate, often emotional judgement that comes before any argument. The exercise asks you to &lt;strong&gt;record it honestly&lt;/strong&gt; rather than jumping straight to the “right” answer: it is the raw material for question 2.&lt;/p&gt;

    &lt;h3&gt;Why start from intuition&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; In his &lt;span class=&quot;term&quot;&gt;social intuitionist model&lt;/span&gt; (2001), the psychologist Jonathan Haidt argues that moral judgement usually arises from a quick, automatic intuition, and that reasoning comes &lt;em&gt;afterwards&lt;/em&gt;, to justify it and persuade others (&lt;a href=&quot;https://www.faculty.umb.edu/adam_beresford/courses/phil_281_11/reading_emotional_dog.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;article&lt;/a&gt;). The two questions in the case follow exactly this order: gut first (Q1), then reasons (Q2), then a critical examination of those reasons.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Diagram: situation, intuition, judgement, reasoning&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;60&quot; width=&quot;160&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;90&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Situation&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;90&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;children at work&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;230&quot; y=&quot;60&quot; width=&quot;180&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;320&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Intuition&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;320&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;quick · emotional&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;470&quot; y=&quot;60&quot; width=&quot;160&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;550&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Judgement&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;550&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;“I don&#x27;t like it”&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-sage&quot;&gt;&lt;rect x=&quot;690&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;790&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Reasoning&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;790&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;often post hoc&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M170,95 L228,95&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M410,95 L468,95&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M630,95 L688,95&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
      &lt;path class=&quot;edge dash&quot; d=&quot;M790,132 C780,190 340,190 325,134&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;560&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;reflection (Q2) can correct the intuition — that is the point of the exercise&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;320&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Q1&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;790&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Q2&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Based on Haidt&#x27;s social intuitionist model (external source), simplified.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Typical reactions&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;“I&#x27;ll sign”&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;“I won&#x27;t sign”&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;“I&#x27;ll sign, but…”&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;“I need to know more”&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Intuition:&lt;/strong&gt; “The children seemed happy, they work with their parents, the quality is good and the savings are huge.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What lies beneath:&lt;/strong&gt; a focus on outcomes, respect for local customs, sometimes self-interest (the bonus). &lt;strong&gt;Risk:&lt;/strong&gt; taking “cheerfully” as proof that there is no harm; cheerfulness tells us nothing about schooling, hours or health.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuition:&lt;/strong&gt; “Five-year-olds working for my chocolates: no.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What lies beneath:&lt;/strong&gt; the idea that children have a right to a childhood and to education, and the discomfort of treating them as means of production. &lt;strong&gt;Risk:&lt;/strong&gt; walking away may deprive the family of income and push the children into worse work. You wash your hands of it, but the problem remains.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuition:&lt;/strong&gt; “The supplier is fine, but no children: I&#x27;ll put it in writing and monitor it.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What lies beneath:&lt;/strong&gt; the search for a compromise between efficiency and responsibility. &lt;strong&gt;Risk:&lt;/strong&gt; a clause with no monitoring and no practical support for the family (adequate adult wages, schooling) remains a dead letter.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intuition:&lt;/strong&gt; “I don&#x27;t know enough: do the children go to school? How many hours do they work? What does Thai law say?”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What lies beneath:&lt;/strong&gt; prudence and a sense of responsibility for gathering information. &lt;strong&gt;Risk:&lt;/strong&gt; using uncertainty as an excuse to postpone the decision indefinitely.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Why the doubt only arises at the airport&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Thomas M. Jones (1991) uses the term &lt;span class=&quot;term&quot;&gt;moral intensity&lt;/span&gt; for the extent to which an issue “pushes” to be recognised as a moral one. It depends on six characteristics of the issue, not of the person. Open each one to see it applied to the case.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;details&gt;&lt;summary&gt;Magnitude of consequences&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How serious the harm is. The development, schooling and health of young children: potentially high.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Social consensus&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How widely it is agreed that it is wrong. Very widely in Europe; the Thai partner says it is normal there. Consensus is divided, and perceived intensity drops.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Probability of effect&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How likely the harm is. Unclear (we do not know about schooling), which lowers the intensity.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Temporal immediacy&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How soon the consequences occur. The savings are immediate; the harm to development only becomes visible years later.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Proximity&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How close one feels to those affected. &lt;strong&gt;The nieces aged 5 and 7&lt;/strong&gt; raise it abruptly: this is the turning point.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Concentration of effect&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;How many people bear the harm, and how much each one bears. Few children, but seriously affected.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;External source for the model: Jones, T. M. (1991), &lt;em&gt;Academy of Management Review&lt;/em&gt; 16(2), 366–395 — &lt;a href=&quot;https://www.proquest.com/docview/198088404&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ProQuest record&lt;/a&gt;.&lt;/p&gt;

    &lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;strong&gt;Three practical tests for your intuition&lt;/strong&gt; &lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;The nieces test&lt;/strong&gt; (the case itself): would I accept this if it affected the people I love? · &lt;strong&gt;The newspaper test&lt;/strong&gt;: would I be comfortable if my choice made the front page? · &lt;strong&gt;The mirror test&lt;/strong&gt;: what kind of person do I become if I do this? The three tests anticipate three theories from Part 3: universalisability/justice, consequences/reputation, virtue.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · gut reaction&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why does the exercise ask for the instinctive reaction &lt;em&gt;before&lt;/em&gt; the reasons?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;To make the real (often emotional) starting point visible and then examine it. The reasons found afterwards may confirm the intuition, but they may also correct it: this is how moral judgement becomes more robust.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which component of moral intensity changes at the airport?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Above all &lt;strong&gt;proximity&lt;/strong&gt;: when the manager thinks of the nieces, the Thai children stop being an abstract fact.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;“They were working happily, so there&#x27;s no problem.” What is wrong with this reasoning?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;What can be observed during a visit (mood) is not enough to establish harm (missed schooling, hours, health, development). Moreover, the children cannot choose freely and have no power to refuse.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 3 TEORIE ===================== --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s-teorie&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 3 · Question 2&lt;/div&gt;
    &lt;h2&gt;From reasons to values: normative ethical theories&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; &lt;em&gt;«Based on your spontaneous immediate decision, can you set out the reasons for your choice? Also, can you relate those reasons back to some underlying values or principles that are obviously important to you?»&lt;/em&gt;&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The question asks you to climb a ladder: from the reaction to the &lt;strong&gt;reasons&lt;/strong&gt;, and from the reasons to &lt;span class=&quot;term&quot;&gt;values&lt;/span&gt; (what we consider important: family, childhood, work, prosperity) and &lt;span class=&quot;term&quot;&gt;principles&lt;/span&gt; (general rules: “do not use people”, “maximise well-being”). &lt;span class=&quot;term&quot;&gt;Normative ethical theories&lt;/span&gt; (theories that state how one &lt;em&gt;ought&lt;/em&gt; to act) are these principles organised systematically and thought through to their conclusions.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Ladder from reaction to theory&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;105&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Gut reaction&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-accent&quot;&gt;&lt;rect x=&quot;240&quot; y=&quot;64&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;335&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Reasons&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;470&quot; y=&quot;38&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;565&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Values and principles&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-sage&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;12&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;795&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Normative theories&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M200,105 L238,95&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M430,80 L468,70&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M660,54 L698,44&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;335&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;“why?”&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;565&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;“what matters to me?”&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;795&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;“is it consistent? does it hold?”&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;h3&gt;The map of theories&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The case comes from the chapter &lt;em&gt;“Evaluating business ethics: normative ethical theories”&lt;/em&gt; of the Crane &amp;amp; Matten textbook (&lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP table of contents&lt;/a&gt;), which classifies the theories as follows. The explanations below are my own, in summary form.&lt;/p&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 270&quot; role=&quot;img&quot; aria-label=&quot;Classification of normative ethical theories&quot;&gt;
      &lt;g class=&quot;node n-sage&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;8&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;450&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Normative ethical theories&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M400,52 L230,88&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M500,52 L690,88&quot;/&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;90&quot; y=&quot;88&quot; width=&quot;280&quot; height=&quot;40&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;230&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Traditional theories&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-ochre&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;88&quot; width=&quot;300&quot; height=&quot;40&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;690&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Contemporary theories&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M180,128 L110,160&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M280,128 L330,160&quot;/&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;160&quot; width=&quot;200&quot; height=&quot;36&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;svgtxt&quot; x=&quot;110&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Consequentialist&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node n-slate&quot;&gt;&lt;rect x=&quot;230&quot; y=&quot;160&quot; width=&quot;200&quot; height=&quot;36&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;svgtxt&quot; x=&quot;330&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Non-consequentialist&lt;/text&gt;&lt;/g&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;110&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Egoism&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;110&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Utilitarianism&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;330&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Ethics of duties (Kant)&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;330&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Rights and justice&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M690,128 L690,160&quot;/&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;690&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Virtue ethics · Feminist ethics&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;690&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Discourse ethics · Postmodern ethics&lt;/text&gt;
      &lt;g class=&quot;node n-sage&quot;&gt;&lt;rect x=&quot;460&quot; y=&quot;222&quot; width=&quot;430&quot; height=&quot;40&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;svgser&quot; x=&quot;675&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Pragmatic pluralism: using the theories together&lt;/text&gt;&lt;/g&gt;
      &lt;path class=&quot;edge dash&quot; d=&quot;M330,250 L458,242&quot;/&gt;&lt;path class=&quot;edge dash&quot; d=&quot;M690,205 L680,220&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;term&quot;&gt;Consequentialist theories&lt;/span&gt; judge an action by its outcomes; &lt;span class=&quot;term&quot;&gt;non-consequentialist&lt;/span&gt; theories judge it by principles that hold regardless of outcomes.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Each theory applied to the case&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Kant&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Justice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Feminist&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Discourse&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Postmodern&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;h4&gt;Ethical egoism&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; an action is right if it serves the long-term self-interest of the person performing it. (This is also the moral foundation of the market economy: Adam Smith&#x27;s “invisible hand”.)&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; the bonus and professional success say “sign”. But an &lt;em&gt;enlightened&lt;/em&gt; egoist takes the long view: if news about the children gets out, the scandal hits both the company and the manager. And the discomfort at the airport is itself a personal cost.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; other people&#x27;s interests count only insofar as they are useful to me; the children are not considered for their own sake.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Utilitarianism&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Bentham, Mill) the right action is the one that produces &lt;strong&gt;the greatest happiness for the greatest number&lt;/strong&gt; of those affected. It amounts to a kind of moral &lt;span class=&quot;term&quot;&gt;cost-benefit analysis&lt;/span&gt; across all &lt;span class=&quot;term&quot;&gt;stakeholders&lt;/span&gt; (anyone affected by the decision).&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;Simplified formula: net utility of an option = Σ (benefits to each party) − Σ (harms to each party). The option with the highest value is chosen.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Try it:&lt;/strong&gt; assign a weight to each effect (0–10) and see how the ranking of the options changes. It is a toy model: it shows the logic of utilitarianism and its problems (how do you weigh a child&#x27;s development against a few cents?).&lt;/p&gt;
        &lt;div class=&quot;card&quot; data-util&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-s&quot;&gt;Savings for the company and consumers&lt;/label&gt;&lt;input id=&quot;u-s&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-i&quot;&gt;Income for the Thai families&lt;/label&gt;&lt;input id=&quot;u-i&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-h&quot;&gt;Harm to the children (schooling, health)&lt;/label&gt;&lt;input id=&quot;u-h&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-r&quot;&gt;Reputational and legal risk&lt;/label&gt;&lt;input id=&quot;u-r&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;u-p&quot;&gt;% chance the children end up in worse work if you leave&lt;/label&gt;&lt;input id=&quot;u-p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;bars&quot; style=&quot;margin-top:14px&quot;&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;A · Sign as is&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;a&quot;&gt;&lt;/output&gt;&lt;/div&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;B · Walk away&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;b&quot;&gt;&lt;/output&gt;&lt;/div&gt;
            &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;C · Sign with conditions&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;zero&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fill&quot; data-u=&quot;c&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;output data-uo=&quot;c&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;small&quot; style=&quot;margin-top:10px&quot;&gt;Model rules: A = savings + income − harm − risk. B = − income − (harm × 1.5 × probability of ending up in worse work). C = 0.6 × savings (slightly higher costs for adult wages and monitoring) + income − 0.2 × harm − 0.3 × risk. &lt;span data-uverdict class=&quot;verdict&quot;&gt;&lt;/span&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; measuring and adding up different goods is arbitrary; and if the savings for millions of consumers were huge, utilitarianism could “justify” the harm to a few children. Non-consequentialist theories arose partly in response to this objection.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Ethics of duties (Kant)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; certain duties hold regardless of the consequences. The &lt;span class=&quot;term&quot;&gt;categorical imperative&lt;/span&gt; has two formulations that are useful here:&lt;/p&gt;
        &lt;p&gt;① &lt;em&gt;Universalisability&lt;/em&gt;: act only according to a rule that you could will to become a law for everyone. “Companies may put five-year-olds to work if it is cheaper” would apply to your nieces too: would you will that?&lt;br&gt;② &lt;em&gt;Humanity&lt;/em&gt;: always treat people as &lt;strong&gt;ends&lt;/strong&gt;, never merely as &lt;strong&gt;means&lt;/strong&gt;. Here the children are used as cheap labour, without being able to consent.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; the moment at the airport is, in effect, a universalisability test.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; rigid when duties conflict (duty towards the children vs. duty towards the company and its employees).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Rights&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; every human being has fundamental &lt;span class=&quot;term&quot;&gt;human rights&lt;/span&gt; that others may not sacrifice for any advantage, not even a collective one.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; the right to education, to play, to health, and not to be economically exploited. &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The UN Convention on the Rights of the Child (Art. 32) recognises the child&#x27;s right to be protected from work that interferes with education or harms health and development (see Part 5).&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; rights can clash (the family&#x27;s right to an income vs. the child&#x27;s right to schooling), and they do not always say who must uphold them: the Thai state? the manufacturer? the European customer?&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Justice (Rawls)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; &lt;span class=&quot;term&quot;&gt;justice&lt;/span&gt; concerns the fair distribution of benefits and burdens. John Rawls proposes the &lt;span class=&quot;term&quot;&gt;veil of ignorance&lt;/span&gt;: choose the rules without knowing what position you will occupy in society. According to the &lt;span class=&quot;term&quot;&gt;difference principle&lt;/span&gt;, inequalities are acceptable only if they improve the position of the worst-off.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Try the veil:&lt;/strong&gt; randomly draw who you will be in this supply chain and ask yourself whether you would accept the contract as it stands.&lt;/p&gt;
        &lt;div class=&quot;card&quot; data-veil&gt;&lt;button class=&quot;btn&quot;&gt;Draw a role&lt;/button&gt; &lt;span data-role style=&quot;margin-left:10px;font-weight:600&quot;&gt;&lt;/span&gt;&lt;p data-role-note class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; the benefits (savings, bonus) go to those who are already better off; the costs (childhood, schooling) fall on the worst-off. As it stands, the contract is unlikely to pass the test.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Virtue ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (after Aristotle) the question is not “which rule?” but &lt;strong&gt;“what kind of person do I want to be?”&lt;/strong&gt;. &lt;span class=&quot;term&quot;&gt;Virtues&lt;/span&gt; (honesty, compassion, justice, practical wisdom) are formed through repeated action.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; a compassionate and prudent manager does not sign with only the bonus in mind, but does not run away either: they look for the course of action that a wise person would recognise as right. This is the “mirror test”.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; it offers little concrete guidance on &lt;em&gt;what&lt;/em&gt; to do in a specific situation.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Feminist ethics (ethics of care)&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; morality arises from &lt;strong&gt;relationships&lt;/strong&gt;, empathy and care rather than from abstract rules. What matters is maintaining good relationships that are attentive to concrete needs.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; it highlights both sides. The family working together, with the grandmother cooking, is a network of care that should not be destroyed. But children have specific needs (play, schooling). And the manager discovers their own caring relationship with their nieces, which extends to the Thai children.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; it risks favouring those close to us over those far away.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Discourse ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Habermas) a norm is right if everyone affected could accept it in a free and rational &lt;strong&gt;dialogue&lt;/strong&gt;. Ethics becomes a procedure for resolving conflicts.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; rather than deciding alone at the airport, the manager should open a dialogue with the manufacturer, the parents, possibly NGOs and local authorities, and colleagues at the company. But can the children really take part in this dialogue?&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; slow, and it presupposes that the parties have equal power (which is not the case here).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;h4&gt;Postmodern ethics&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Idea:&lt;/strong&gt; (Bauman) it distrusts grand theories and values the &lt;strong&gt;moral impulse&lt;/strong&gt;, the “feeling” that arises from being face to face with the other. It judges case by case.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; this is the theory that takes the &lt;em&gt;gut reaction&lt;/em&gt; of question 1 most seriously. The discomfort at the airport is not an error to be corrected by theory, but a moral signal to be heeded.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Limitation:&lt;/strong&gt; unpredictable; hard to translate into corporate policy.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Game: which value does this reason come from?&lt;/h3&gt;
    &lt;p&gt;Click on a statement a manager might make to explain their choice: you will see the value and the theory behind it.&lt;/p&gt;
    &lt;div class=&quot;chips&quot; data-match&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Ethical egoism&lt;/strong&gt; · value: self-interest and career.&quot;&gt;“The savings guarantee my bonus.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Utilitarianism&lt;/strong&gt; · value: overall well-being. Note: the harm to the children counts too.&quot;&gt;“It costs a third, customers pay less and the family earns money.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Kant, universalisability&lt;/strong&gt; (and Rawls&#x27;s veil) · value: consistency, impartiality.&quot;&gt;“I wouldn&#x27;t accept it for my nieces.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Rights&lt;/strong&gt; · value: dignity and childhood as non-negotiable rights.&quot;&gt;“Children have the right to go to school and play.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Ethical relativism&lt;/strong&gt; · value: respect for other cultures. See Part 4: is it really culture, or poverty?&quot;&gt;“It&#x27;s normal there, who am I to judge?”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Virtue ethics&lt;/strong&gt; · value: integrity and character.&quot;&gt;“I don&#x27;t want to become the kind of person who signs this.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Feminist ethics / care&lt;/strong&gt; · value: family relationships and care.&quot;&gt;“They work together, as a family, with the grandmother cooking.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Postmodern ethics&lt;/strong&gt; · value: heeding the moral impulse.&quot;&gt;“I feel it&#x27;s wrong, even if I can&#x27;t explain why.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Discourse ethics&lt;/strong&gt; · value: procedural fairness, a voice for those affected.&quot;&gt;“Before deciding I&#x27;d talk to the supplier, the family and an NGO.”&lt;/button&gt;
      &lt;button data-v=&quot;&lt;strong&gt;Utilitarianism / long-term egoism&lt;/strong&gt; · value: the firm&#x27;s reputation and sustainability.&quot;&gt;“If this gets into the papers, the brand is ruined.”&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;box reveal&quot; data-match-out&gt;&lt;span class=&quot;small&quot;&gt;The answer appears here.&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;box&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Pragmatic pluralism.&lt;/strong&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Crane &amp;amp; Matten do not ask us to choose &lt;em&gt;one&lt;/em&gt; “true” theory: theories are tools, different lenses that illuminate different aspects of a problem. If different lenses lead to the same conclusion, that conclusion is more robust. In the case, Kant, rights, justice, virtue and even long-term egoism agree that &lt;strong&gt;the contract as it stands is unacceptable&lt;/strong&gt;. Utilitarianism and the ethics of care, by contrast, warn us &lt;strong&gt;not to shift the cost onto the family&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · normative theories&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What is the difference between consequentialist and non-consequentialist theories? Give an example from the case.&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The former judge by consequences (utilitarianism: weighing savings and income against the harm to the children); the latter by principles that are valid in themselves (Kant: do not use the children merely as means, whatever the numbers say).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which formulation of the categorical imperative corresponds to the “nieces test”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Universalisability: if the rule I am following had to apply to everyone, including my nieces, would I accept it?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why might a utilitarian oppose terminating the contract immediately?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because without that income the family could be worse off and the children could end up in more dangerous work. What counts is the net outcome for everyone, not the manager&#x27;s clear conscience.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What does pragmatic pluralism mean and why is it useful here?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Using several theories as complementary tools instead of choosing just one. It brings out both the shared core (no five-year-olds at work) and the risks of a hasty solution (abandoning the family).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 4 RELATIVISMO ===================== --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;s-relativ&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 4&lt;/div&gt;
    &lt;h2&gt;“It&#x27;s common practice here”: relativism or universal principles?&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;slide&lt;/span&gt; The Thai partner explains that family home-based work is &lt;em&gt;“a very common and well-established practice in this part of the country”&lt;/em&gt; and that it ensures good quality.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; This statement leads to the heart of ethics in international business: &lt;strong&gt;do moral judgements hold everywhere, or do they depend on context?&lt;/strong&gt;&lt;/p&gt;

    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Spectrum between absolutism and relativism&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gr&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; style=&quot;stop-color:var(--slate)&quot;/&gt;&lt;stop offset=&quot;.5&quot; style=&quot;stop-color:var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; style=&quot;stop-color:var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;rect x=&quot;40&quot; y=&quot;62&quot; width=&quot;820&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;url(#gr)&quot;/&gt;
      &lt;circle cx=&quot;60&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-slate&quot;/&gt;&lt;circle cx=&quot;450&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-sage&quot;/&gt;&lt;circle cx=&quot;840&quot; cy=&quot;68&quot; r=&quot;12&quot; class=&quot;f-brick&quot;/&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;60&quot; y=&quot;40&quot; font-size=&quot;16&quot;&gt;Ethical absolutism&lt;/text&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;450&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot;&gt;Core values + moral free space&lt;/text&gt;
      &lt;text class=&quot;svgser&quot; x=&quot;840&quot; y=&quot;40&quot; text-anchor=&quot;end&quot; font-size=&quot;16&quot;&gt;Ethical relativism&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;60&quot; y=&quot;104&quot; font-size=&quot;12.5&quot;&gt;“my rules apply everywhere”&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;450&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;a few universal principles,&lt;/text&gt;&lt;text class=&quot;svgmut&quot; x=&quot;450&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;much freedom on the rest&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;840&quot; y=&quot;104&quot; text-anchor=&quot;end&quot; font-size=&quot;12.5&quot;&gt;“when in Rome, do as the Romans do”&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;60&quot; y=&quot;140&quot; font-size=&quot;12&quot; style=&quot;fill:var(--slate)&quot;&gt;risk: ethical imperialism&lt;/text&gt;
      &lt;text class=&quot;svgmut&quot; x=&quot;840&quot; y=&quot;140&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;risk: anything can be justified&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Relativism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Absolutism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;The middle way&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Ethical relativism&lt;/span&gt;: right and wrong depend on culture; there is no neutral standpoint from which to judge other people&#x27;s practices.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; “If in Thailand children help their families, who am I, a European, to say it is wrong?” It is an argument from respect and humility.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Problems:&lt;/strong&gt; ① that a practice is &lt;em&gt;common&lt;/em&gt; is a fact; that it is &lt;em&gt;right&lt;/em&gt; is a judgement, and the judgement does not follow from the fact (in philosophy this is the gap between “is” and “ought”). ② “Culture” is often poverty: the families do not choose freely. ③ The source has a vested interest: it is the supplier who says so. ④ The Thai state itself sets a legal minimum age (Part 5): “local culture” is not unanimous.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Ethical absolutism&lt;/span&gt;: there are principles that are valid everywhere and always. In its extreme form, one simply applies the rules of one&#x27;s own country.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;In the case:&lt;/strong&gt; “Child labour is banned in Europe, so it is banned in Thailand too, full stop.”&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Problems:&lt;/strong&gt; it easily turns into &lt;span class=&quot;term&quot;&gt;ethical imperialism&lt;/span&gt; (imposing one&#x27;s own standards without understanding the context). It does not distinguish between a 14-year-old helping for a few hours after school and a five-year-old assembling parts all day; and it can lead to solutions that worsen the lives of the very people it seeks to protect.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Thomas Donaldson (&lt;em&gt;“Values in Tension: Ethics Away from Home”&lt;/em&gt;, Harvard Business Review, 1996) proposes a middle way: there are &lt;span class=&quot;term&quot;&gt;core values&lt;/span&gt; to be respected everywhere, such as human dignity and basic rights, while for many other practices companies must leave room for local differences. Together with Dunfee he developed the idea of &lt;span class=&quot;term&quot;&gt;hypernorms&lt;/span&gt;: norms so fundamental that they apply in every community and set limits on local norms.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Key question:&lt;/strong&gt; does the practice differ because of &lt;strong&gt;cultural tradition&lt;/strong&gt; or because of the &lt;strong&gt;level of economic development&lt;/strong&gt;? In the latter case, ask: &lt;em&gt;would it be acceptable at home if we were at the same level of development?&lt;/em&gt; Even so, a practice that violates a core value remains unacceptable.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;A decision path (based on Donaldson)&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-tree&gt;
      &lt;div data-node=&quot;0&quot;&gt;&lt;h4&gt;Does the practice violate a core value (dignity, basic rights, safety)?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Five-year-olds working all day, possibly without schooling: probably yes. But what if they were 14-year-olds helping for a few hours after school?&lt;/p&gt;&lt;div class=&quot;seg&quot;&gt;&lt;button data-go=&quot;1&quot;&gt;Yes, clearly&lt;/button&gt;&lt;button data-go=&quot;2&quot;&gt;No / unclear&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div data-node=&quot;1&quot; hidden&gt;&lt;h4&gt;→ Unacceptable everywhere&lt;/h4&gt;&lt;p&gt;Being “common” is not enough. You can still choose &lt;em&gt;how&lt;/em&gt; to intervene (Part 6): correct the practice together with the supplier or, if that is not possible, exit without shifting the costs onto the families.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Start over&lt;/button&gt;&lt;/div&gt;
      &lt;div data-node=&quot;2&quot; hidden&gt;&lt;h4&gt;Is the difference due to economic development or to cultural tradition?&lt;/h4&gt;&lt;div class=&quot;seg&quot;&gt;&lt;button data-go=&quot;3&quot;&gt;Economic development&lt;/button&gt;&lt;button data-go=&quot;4&quot;&gt;Cultural tradition&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div data-node=&quot;3&quot; hidden&gt;&lt;h4&gt;Would it be acceptable at home if we were at the same level of development?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If so, it can be accepted temporarily while working towards improvement. If not, it should be treated as a violation.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Start over&lt;/button&gt;&lt;/div&gt;
      &lt;div data-node=&quot;4&quot; hidden&gt;&lt;h4&gt;Can business be done without adopting the practice? And does the practice violate a core value?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If it can be avoided, avoid it; if it cannot and it does not violate core values, it falls within the &lt;em&gt;moral free space&lt;/em&gt; and the difference can be respected.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-go=&quot;0&quot;&gt;↺ Start over&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;The diagram is a teaching summary; for details read the original article (link at the bottom).&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · relativism&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;“It&#x27;s a common and well-established practice”: why is that not enough to make it right?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because it describes what &lt;em&gt;is&lt;/em&gt;, not what &lt;em&gt;ought to be&lt;/em&gt;. Moreover, it is stated by an interested party, and how widespread the practice is may depend on poverty rather than on a free cultural choice.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What is ethical imperialism, and why is it a risk even for those who want to protect children?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It is the imposition of one&#x27;s own standards without regard for context. It can lead to solutions that look moral from Europe but worsen the local situation (e.g. the family loses income and the children go to work elsewhere, in worse conditions).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What are hypernorms?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Fundamental moral norms, recognised across cultures, that limit what local norms may permit (e.g. respect for human dignity and basic rights).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 5 CHILD LABOUR ===================== --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-child&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 5&lt;/div&gt;
    &lt;h2&gt;Child labour: what the rules say&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The slides do not cite any laws, but the question “is it wrong?” also has a legal answer. First, a fundamental distinction drawn by the ILO (International Labour Organization, the UN agency for labour):&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Child work&lt;/h4&gt;&lt;p&gt;Activities a child can do without harm: helping at home or in the family business for short periods, in an age-appropriate way, &lt;strong&gt;without taking time away from school&lt;/strong&gt;. It can even be educational.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Child labour&lt;/h4&gt;&lt;p&gt;Work that deprives children of their childhood, their potential and their dignity, harms their physical or mental development, &lt;strong&gt;interferes with schooling&lt;/strong&gt;, or involves children below the minimum age. This is what the rules prohibit.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The age thresholds of ILO Convention C138&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The 1973 &lt;em&gt;Minimum Age Convention&lt;/em&gt; (C138) sets the general minimum age at &lt;strong&gt;not less than 15&lt;/strong&gt; (14 as an initial threshold for developing countries that make a declaration to that effect), permits &lt;span class=&quot;term&quot;&gt;light work&lt;/span&gt; (work that does not harm health or schooling) from &lt;strong&gt;age 13&lt;/strong&gt; (12 in countries using the clause), and prohibits &lt;span class=&quot;term&quot;&gt;hazardous work&lt;/span&gt; &lt;strong&gt;under 18&lt;/strong&gt;.&lt;/p&gt;

    &lt;div class=&quot;card&quot; data-age&gt;
      &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Age bands under Convention C138&quot;&gt;
        &lt;g data-zones&gt;&lt;/g&gt;
        &lt;g data-ticks class=&quot;svgmut&quot; font-size=&quot;12&quot;&gt;&lt;/g&gt;
        &lt;rect data-kids x=&quot;0&quot; y=&quot;18&quot; height=&quot;8&quot; rx=&quot;4&quot; class=&quot;f-brick&quot;/&gt;
        &lt;text data-kids-l class=&quot;svgmut&quot; font-size=&quot;12&quot; y=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;the 6 children in the case (5–14)&lt;/text&gt;
        &lt;polygon data-mark points=&quot;0,0&quot; class=&quot;f-accent&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ag&quot;&gt;Child&#x27;s age&lt;/label&gt;&lt;input id=&quot;ag&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;18&quot; value=&quot;9&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0&quot;&gt;
        &lt;span class=&quot;small&quot;&gt;Type of work:&lt;/span&gt;
        &lt;div class=&quot;seg&quot; data-work&gt;&lt;button aria-pressed=&quot;false&quot; data-w=&quot;light&quot;&gt;light, few hours, outside school&lt;/button&gt;&lt;button aria-pressed=&quot;true&quot; data-w=&quot;full&quot;&gt;all day (as in the case)&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-w=&quot;haz&quot;&gt;hazardous&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;label class=&quot;small&quot;&gt;&lt;input type=&quot;checkbox&quot; data-dev&gt; Developing country using the C138 clause (14 / 12 years)&lt;/label&gt;
      &lt;div class=&quot;box&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;p data-age-out style=&quot;margin:0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:8px 0 0&quot;&gt;A teaching simplification of the international standard; it does not replace national law (in Thailand the minimum age is 15) or the permitted exceptions (e.g. artistic performances).&lt;/p&gt;
    &lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;C182 · Worst Forms of Child Labour Convention (1999)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; It calls for the urgent elimination of the &lt;span class=&quot;term&quot;&gt;worst forms of child labour&lt;/span&gt; for all persons under 18: slavery and similar practices (trafficking, forced labour, debt bondage), sexual exploitation, illicit activities, and work which by its nature or circumstances harms health, safety or morals. Nothing of the kind appears in the case, unless the hours or the materials make the work &lt;em&gt;hazardous&lt;/em&gt;: another point to verify.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;UN Convention on the Rights of the Child (1989), Art. 32&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; It recognises the child&#x27;s right to be protected from economic exploitation and from work that is hazardous, interferes with education or harms health and development; it requires states to set minimum ages and working hours. It is the “rights” basis of Part 3.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Thai law&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; According to the reports of the U.S. Department of Labor (ILAB), Thailand&#x27;s &lt;em&gt;Labour Protection Act&lt;/em&gt; sets the minimum working age at &lt;strong&gt;15&lt;/strong&gt; and at 18 for hazardous work; Thailand has ratified C138 and C182. The 2010 &lt;em&gt;Home Workers Protection Act&lt;/em&gt; specifically regulates commissioned home-based work, and a ministerial regulation prohibits certain types of home work for those under 15. The same reports point to gaps in enforcement. &lt;strong&gt;Conclusion for the case:&lt;/strong&gt; “it&#x27;s common” does not imply “it&#x27;s legal”: all six children (aged 5–14) are below the Thai minimum age.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;C177 · Home Work Convention (1996)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; It defines the &lt;span class=&quot;term&quot;&gt;homeworker&lt;/span&gt; (a person who works in their own home, for remuneration, producing what an employer specifies) and calls for equal treatment with other workers: wages, safety, minimum age, freedom of association. It was the first ILO convention for a group of workers, largely women, in the &lt;span class=&quot;term&quot;&gt;informal economy&lt;/span&gt; (outside contracts and inspections). It describes exactly the model in the case.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;h3&gt;How widespread it is&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; ILO-UNICEF estimates published in June 2025 put the number of children in child labour at about &lt;strong&gt;138 million&lt;/strong&gt; in 2024 (almost 8% of the world&#x27;s children), of whom about &lt;strong&gt;54 million&lt;/strong&gt; were in hazardous work. The number has fallen by more than 20 million since 2020, but the goal of eliminating child labour by 2025 has not been met.&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; role=&quot;img&quot; aria-label=&quot;Child labour in 2024: 138 million, of whom 54 million in hazardous work&quot;&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;900&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot; style=&quot;opacity:.35&quot;/&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;352&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-brick&quot;/&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;12&quot; y=&quot;44&quot; font-size=&quot;14&quot; style=&quot;fill:var(--paper)&quot;&gt;54 m: hazardous work&lt;/text&gt;
        &lt;text class=&quot;svgtxt&quot; x=&quot;888&quot; y=&quot;44&quot; font-size=&quot;14&quot; text-anchor=&quot;end&quot;&gt;138 m in child labour (2024)&lt;/text&gt;
        &lt;text class=&quot;svgmut&quot; x=&quot;0&quot; y=&quot;88&quot; font-size=&quot;12&quot;&gt;External source: ILO-UNICEF, Child Labour: Global estimates 2024 (June 2025). Bar drawn to scale.&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · child labour&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Is a 14-year-old who helps their parents for an hour a day after school engaged in child labour?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Generally not: under C138 this is &lt;em&gt;light work&lt;/em&gt;, permitted from age 13 provided it does not harm health or schooling (though national law may be stricter, and the manager should check in any case). The five-year-old assembling parts all day is clearly child labour.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why is the distinction between child work and child labour important for avoiding ethical imperialism?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It avoids condemning every form of family help (culturally widespread and sometimes educational) and focuses on what is genuinely harmful: too young an age, excessive hours, missed schooling, hazards.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which ILO convention describes the production model in the case?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;C177 on home work (Home Work Convention, 1996).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== 6 DECIDERE ===================== --&gt;
&lt;section class=&quot;part p-accent&quot; id=&quot;s-decisione&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Part 6&lt;/div&gt;
    &lt;h2&gt;Deciding: from theories to what to do on Monday morning&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The slides stop at the questions. Here we bring Parts 2–5 together to compare the product manager&#x27;s actual options.&lt;/p&gt;

    &lt;div class=&quot;tablewrap&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Option&lt;/th&gt;&lt;th&gt;Pros&lt;/th&gt;&lt;th&gt;Cons&lt;/th&gt;&lt;th&gt;Supporting theories&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;A · Sign as is&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;2/3 savings, bonus, income for the families&lt;/td&gt;&lt;td&gt;Children below the legal minimum age; legal and reputational risk; treats the children as means&lt;/td&gt;&lt;td&gt;Short-term egoism; “naive” utilitarianism&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;B · Walk away and stay with Portugal&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Clear conscience, no risk to the brand&lt;/td&gt;&lt;td&gt;The family loses income; the children may end up in worse work; the problem remains, you just no longer see it&lt;/td&gt;&lt;td&gt;Rights, Kant (strict reading)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;C · Sign with conditions&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Preserves income and (reduced) savings; changes the practice from within&lt;/td&gt;&lt;td&gt;Monitoring costs; requires genuine, verifiable commitment&lt;/td&gt;&lt;td&gt;Pragmatic pluralism: utilitarianism, justice, care, discourse, virtue&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D · Postpone and gather information&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Decision based on verified facts (schooling, hours, wages)&lt;/td&gt;&lt;td&gt;Can become an excuse; solves nothing on its own&lt;/td&gt;&lt;td&gt;Prudence (virtue ethics)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;

    &lt;h3&gt;Due diligence, step by step&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The &lt;em&gt;UN Guiding Principles on Business and Human Rights&lt;/em&gt; (2011) require companies to &lt;span class=&quot;term&quot;&gt;respect&lt;/span&gt; human rights throughout their value chain as well, through a process of &lt;span class=&quot;term&quot;&gt;human rights due diligence&lt;/span&gt; (ongoing assessment: identifying, preventing, monitoring and reporting adverse impacts) and &lt;span class=&quot;term&quot;&gt;remediation&lt;/span&gt; (redress for those who have been harmed). Applied to the case:&lt;/p&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;stepbody&quot;&gt;
        &lt;svg viewBox=&quot;0 0 120 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;52&quot; style=&quot;fill:var(--accent-bg);stroke:var(--accent);stroke-width:3&quot;/&gt;&lt;text data-stepnum class=&quot;svgser&quot; x=&quot;60&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;48&quot; style=&quot;fill:var(--accent)&quot;&gt;1&lt;/text&gt;&lt;/svg&gt;
        &lt;div&gt;
          &lt;div data-step&gt;&lt;h4&gt;Identify&lt;/h4&gt;&lt;p&gt;Gather the missing facts: exact ages, schooling, hours, piece rate, safety of the materials. Check local law (minimum age 15, Home Workers Act). Do not rely on the supplier alone.&lt;/p&gt;&lt;/div&gt;
