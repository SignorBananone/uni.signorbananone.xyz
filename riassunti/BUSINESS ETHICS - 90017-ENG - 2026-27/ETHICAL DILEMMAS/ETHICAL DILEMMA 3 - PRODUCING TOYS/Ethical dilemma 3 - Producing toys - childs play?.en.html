          &lt;div data-step hidden&gt;&lt;h4&gt;Do not decide alone&lt;/h4&gt;&lt;p&gt;The bonus creates a conflict of interest: escalate the matter to your superiors and to the CSR or legal department. Find out whether the company has a supplier &lt;span class=&quot;term&quot;&gt;code of conduct&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Prevent and negotiate&lt;/h4&gt;&lt;p&gt;Contract clause: no work below the minimum age, including home work. In return, a price that allows the adults to earn enough without their children&#x27;s help. Even paying more, the savings compared with Portugal may remain.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Remediate&lt;/h4&gt;&lt;p&gt;Do not simply “dismiss” the children: support their return to school (grants, materials), possibly with local NGOs, so that the family does not lose all its income.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Monitor&lt;/h4&gt;&lt;p&gt;Independent visits and &lt;span class=&quot;term&quot;&gt;audits&lt;/span&gt;, including unannounced ones; home-based work is hard to monitor. Industry programmes such as the ICTI Ethical Toy Program exist.&lt;/p&gt;&lt;/div&gt;
          &lt;div data-step hidden&gt;&lt;h4&gt;Exit only as a last resort&lt;/h4&gt;&lt;p&gt;If the supplier refuses or fails to improve, end the relationship responsibly (advance notice, search for alternatives). Communicate transparently what has been done.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;box&quot;&gt;
      &lt;p&gt;&lt;strong&gt;The European regulatory context&lt;/strong&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The &lt;em&gt;Corporate Sustainability Due Diligence Directive&lt;/em&gt; (EU Directive 2024/1760) turns human rights due diligence, including on child labour, into a legal obligation for large companies, covering their own operations and their value chains. The directive was amended after adoption and its application dates have been postponed: always check the consolidated text on EUR-Lex.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;An outline answer to question 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Show an example of a well-structured answer&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Reaction:&lt;/strong&gt; “I would not sign the contract as it stands, but I would not walk away immediately either.”&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Reasons:&lt;/strong&gt; ① children aged 5–14 work all day, below the minimum age under Thai law; ② I would not accept the same thing for my nieces; ③ my bonus should not weigh on the decision; ④ walking away immediately would deprive the family of income without protecting the children.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Values and principles:&lt;/strong&gt; the dignity and rights of children (rights), impartiality and universalisability (Kant, Rawls), personal integrity (virtue), attention to the real consequences for the family (utilitarianism, care).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Therefore:&lt;/strong&gt; I would sign only with verifiable conditions (no child labour, a price that allows adequate adult wages, support for schooling, monitoring), after discussing it within the company.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check · deciding&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why is “walking away from the contract” not automatically the most ethical choice?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It protects the company&#x27;s reputation, but it may worsen the children&#x27;s situation (less income for the family, more dangerous work). Responsibility towards the people involved does not end when you leave the supply chain.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What is remediation and how would it apply here?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Redressing the harm one has caused or contributed to: for example, supporting the children&#x27;s return to school and ensuring the adults an income that does not depend on their children&#x27;s work.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What role does the bonus play in the decision, and how should it be handled?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It is a personal incentive that pushes towards maximum savings (a conflict of interest). It should be disclosed and the decision shared with others in the company; at the organisational level, incentives should also reward compliance with ethical standards, not just cost reduction.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================== FONTI ===================== --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s-fonti&quot;&gt;
  &lt;div class=&quot;wrap refs&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
    &lt;h2&gt;Texts, regulations and data&lt;/h2&gt;
    &lt;p&gt;The slide cites no authors or regulations: it is a case with two questions. Below are the references used to explain the topics. &lt;strong&gt;Everything in this section is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/strong&gt;, verified through web search: each link leads to the page consulted.&lt;/p&gt;

    &lt;h3&gt;The textbook and the theory&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;em&gt;Business Ethics&lt;/em&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;The textbook the case appears to come from (“An ethical dilemma” format). The 5th edition dates from 2019, the 2nd international edition from 2020; the table of contents includes the chapter “Evaluating business ethics: Normative ethical theories”, followed by “Making decisions in business ethics: Descriptive ethical theories”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: this is where egoism, utilitarianism, Kant, rights, justice, virtue, feminist, discourse and postmodern ethics and pragmatic pluralism are explained in full. &lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Haidt, J. (2001) — “The emotional dog and its rational tail”, &lt;em&gt;Psychological Review&lt;/em&gt; 108(4), 814–834&lt;/h4&gt;&lt;p&gt;Presents the social intuitionist model: moral judgement arises mainly from quick intuitions; reasoning often comes afterwards, to justify them.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains why question 1 (gut reaction) comes before question 2 (reasons). &lt;a href=&quot;https://www.faculty.umb.edu/adam_beresford/courses/phil_281_11/reading_emotional_dog.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (UMass Boston course copy)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jones, T. M. (1991) — “Ethical decision making by individuals in organizations: An issue-contingent model”, &lt;em&gt;Academy of Management Review&lt;/em&gt; 16, 366–395&lt;/h4&gt;&lt;p&gt;Introduces moral intensity, with six components (magnitude of consequences, social consensus, probability, immediacy, proximity, concentration) that influence every stage of ethical decision-making.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains why the doubt only arises at the airport (proximity). &lt;a href=&quot;https://www.proquest.com/docview/198088404&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ProQuest record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Donaldson, T. (1996) — “Values in Tension: Ethics Away from Home”, &lt;em&gt;Harvard Business Review&lt;/em&gt; 74(5), 48–62&lt;/h4&gt;&lt;p&gt;How to behave when a practice accepted abroad seems immoral: it rejects both cultural relativism and ethical imperialism and proposes core values that hold everywhere.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the classic response to the “it&#x27;s common practice here” argument (Part 4). &lt;a href=&quot;https://hbr.org/1996/09/values-in-tension-ethics-away-from-home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article on HBR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;International and national regulations&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C138 — Minimum Age Convention, 1973&lt;/h4&gt;&lt;p&gt;General minimum age not less than 15 (14 for some developing countries), light work from 13 (12), hazardous work prohibited under 18.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it provides the thresholds for determining when children&#x27;s work is child labour. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C138&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C182 — Worst Forms of Child Labour Convention, 1999&lt;/h4&gt;&lt;p&gt;Requires the urgent elimination of the worst forms of child labour (slavery, sexual exploitation, illicit activities, hazardous work) for persons under 18.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it marks the limit that no “tradition” can override. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C182&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO C177 — Home Work Convention, 1996&lt;/h4&gt;&lt;p&gt;Adopted in 1996, in force since 2000: it defines home work and calls for equal treatment for homeworkers. It has received few ratifications.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it describes exactly the production model in the case. &lt;a href=&quot;https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C177&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on NORMLEX (ILO)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UN Convention on the Rights of the Child, 1989&lt;/h4&gt;&lt;p&gt;Art. 32 protects children from economic exploitation and from work that harms their education, health and development.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the legal basis of the “rights” approach. &lt;a href=&quot;https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on OHCHR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Thailand — Home Workers Protection Act B.E. 2553 (2010)&lt;/h4&gt;&lt;p&gt;Regulates commissioned work carried out at home (definitions, obligations of the hirer). Together with the Labour Protection Act (minimum age 15) it defines what is legal in the case.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows that the “common” practice is also regulated by Thai law. &lt;a href=&quot;https://www.wiego.org/wp-content/uploads/2019/09/Thailand-Home-Workers-Protection-Act-B.E.-2553-2010.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;English translation (WIEGO, PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;U.S. Department of Labor (ILAB) — Findings on the Worst Forms of Child Labor: Thailand&lt;/h4&gt;&lt;p&gt;Annual reports on the legal framework (minimum ages, ratifications, enforcement gaps) and on high-risk sectors.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: an up-to-date, verifiable source on the situation in Thailand. &lt;a href=&quot;https://www.dol.gov/agencies/ilab/resources/reports/child-labor/thailand&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ILAB page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Business and human rights&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights (2011)&lt;/h4&gt;&lt;p&gt;The “Protect, Respect and Remedy” framework, unanimously endorsed by the UN Human Rights Council: the state duty to protect, the corporate responsibility to respect, and access to remedy. Human rights due diligence is at its core.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it sets out what is expected of the confectionery company with regard to its suppliers (Part 6). &lt;a href=&quot;https://www.ohchr.org/sites/default/files/documents/publications/guidingprinciplesbusinesshr_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF on OHCHR&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Directive (EU) 2024/1760 — Corporate Sustainability Due Diligence&lt;/h4&gt;&lt;p&gt;Human rights and environmental due diligence obligations for large companies and their value chains. The text was subsequently amended: consult the consolidated version.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: in Europe today, the question raised by the case is not only a moral one but also a matter of compliance. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ICTI Ethical Toy Program&lt;/h4&gt;&lt;p&gt;An industry programme launched in 2004: independent audits of toy factories on child labour, working hours, wages and safety, based on ILO conventions. Its effectiveness has also been criticised (for example by China Labor Watch).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: a concrete example of monitoring in the toy supply chain, and of its limits. &lt;a href=&quot;https://ethicaltoyprogram.org/our-program/what-does-the-ethical-supply-chain-program-cover&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Programme website&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Data&lt;/h3&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ILO-UNICEF — Child Labour: Global estimates 2024 (June 2025)&lt;/h4&gt;&lt;p&gt;About 138 million children in child labour in 2024, 54 million in hazardous work; down by more than 20 million since 2020, but far from the 2025 target.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows the global scale of the problem behind a single case. &lt;a href=&quot;https://www.unicef.org/press-releases/despite-progress-child-labour-still-affects-138-million-children-globally-ilo-unicef&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNICEF press release&lt;/a&gt; · &lt;a href=&quot;https://www.ilo.org/resource/other/2024-global-estimates-child-labour-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ILO data&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;),panels=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });
  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;[data-step]&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;[data-prev]&#x27;),next=s.querySelector(&#x27;[data-next]&#x27;),hand=s.querySelector(&#x27;[data-hand]&#x27;),i=0;
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;));});
    function show(){
      steps.forEach(function(x,j){x.hidden=j!==i;});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j===i?&#x27;on&#x27;:&#x27;&#x27;;});
      prev.disabled=i===0;next.disabled=i===steps.length-1;
      if(hand){var h=parseFloat(steps[i].dataset.hour||0);hand.style.transform=&#x27;rotate(&#x27;+(h%12)*30+&#x27;deg)&#x27;;}
      var num=s.querySelector(&#x27;[data-stepnum]&#x27;);if(num)num.textContent=i+1;
    }
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    show();
  });
  // saving

    };
    p.addEventListener(&#x27;input&#x27;,upd);q.addEventListener(&#x27;input&#x27;,upd);upd();
  }
  // utilitarian toy model
  var ut=document.querySelector(&#x27;[data-util]&#x27;);
  if(ut){
    var ids=[&#x27;u-s&#x27;,&#x27;u-i&#x27;,&#x27;u-h&#x27;,&#x27;u-r&#x27;,&#x27;u-p&#x27;];
    var names={a:&#x27;A · Sign as is&#x27;,b:&#x27;B · Walk away&#x27;,c:&#x27;C · Sign with conditions&#x27;};
    var calc=function(){
      var v={};ids.forEach(function(id){var el=document.getElementById(id);v[id]=+el.value;el.nextElementSibling.textContent=id===&#x27;u-p&#x27;?el.value+&#x27;%&#x27;:el.value;});
      var S=v[&#x27;u-s&#x27;],I=v[&#x27;u-i&#x27;],H=v[&#x27;u-h&#x27;],R=v[&#x27;u-r&#x27;],P=v[&#x27;u-p&#x27;]/100;
      var r={a:S+I-H-R,b:-I-H*1.5*P,c:0.6*S+I-0.2*H-0.3*R};
      var best=&#x27;a&#x27;;
      Object.keys(r).forEach(function(k){
        if(r[k]&gt;r[best])best=k;
        var f=ut.querySelector(&#x27;[data-u=&quot;&#x27;+k+&#x27;&quot;]&#x27;),w=Math.min(Math.abs(r[k])/20,1)*50;
        f.style.width=w+&#x27;%&#x27;;f.style.left=r[k]&gt;=0?&#x27;50%&#x27;:(50-w)+&#x27;%&#x27;;
        f.style.background=r[k]&gt;=0?&#x27;var(--sage)&#x27;:&#x27;var(--brick)&#x27;;
        ut.querySelector(&#x27;[data-uo=&quot;&#x27;+k+&#x27;&quot;]&#x27;).textContent=(r[k]&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+r[k].toFixed(1);
      });
      ut.querySelector(&#x27;[data-uverdict]&#x27;).textContent=&#x27;With your weights, the winner is: &#x27;+names[best]+&#x27;.&#x27;;
    };
    ids.forEach(function(id){document.getElementById(id).addEventListener(&#x27;input&#x27;,calc);});calc();
  }
  // veil of ignorance
  var veil=document.querySelector(&#x27;[data-veil]&#x27;);
  if(veil){
    var roles=[
      [&#x27;the product manager&#x27;,&#x27;You get the bonus. Would you still accept if you could be anyone else?&#x27;],
      [&#x27;a shareholder in the confectionery company&#x27;,&#x27;Higher margins, but the reputational risk is yours too.&#x27;],
      [&#x27;a European consumer&#x27;,&#x27;You might pay a few cents less for a chocolate.&#x27;],
      [&#x27;a worker at the Portuguese supplier&#x27;,&#x27;Your plant loses a major customer.&#x27;],
      [&#x27;the Thai father&#x27;,&#x27;You bring home a piece-rate income that currently also depends on your children\&#x27;s work.&#x27;],
      [&#x27;the Thai mother&#x27;,&#x27;You work all day in the barn, next to your six children.&#x27;],
      [&#x27;a five-year-old Thai child&#x27;,&#x27;You assemble plastic parts from 6 a.m. to 8 p.m. Do you go to school? The slides do not say.&#x27;],
      [&#x27;a 14-year-old Thai girl&#x27;,&#x27;You are almost of working age: light work plus school would be a real alternative for you.&#x27;],
      [&#x27;the grandmother&#x27;,&#x27;You cook for the whole family in the next room.&#x27;],
      [&#x27;the Thai sales manager&#x27;,&#x27;You close a two-year contract with a European customer.&#x27;]

    var last=-1;
    veil.querySelector(&#x27;button&#x27;).addEventListener(&#x27;click&#x27;,function(){
      var k;do{k=Math.floor(Math.random()*roles.length);}while(k===last);last=k;
      veil.querySelector(&#x27;[data-role]&#x27;).textContent=&#x27;You are &#x27;+roles[k][0]+&#x27;.&#x27;;
      veil.querySelector(&#x27;[data-role-note]&#x27;).textContent=roles[k][1]+&#x27; Would you accept the contract as it stands?&#x27;;
    });
  }
  // reason → value
  var mt=document.querySelector(&#x27;[data-match]&#x27;),mo=document.querySelector(&#x27;[data-match-out]&#x27;);
  if(mt){mt.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
    mt.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);});
    b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);mo.innerHTML=&#x27;&lt;p style=&quot;margin:0&quot;&gt;&#x27;+b.textContent+&#x27;&lt;br&gt;→ &#x27;+b.dataset.v+&#x27;&lt;/p&gt;&#x27;;
  });});}
  // decision tree
  document.querySelectorAll(&#x27;[data-tree]&#x27;).forEach(function(t){
    t.addEventListener(&#x27;click&#x27;,function(e){var g=e.target.closest(&#x27;[data-go]&#x27;);if(!g)return;
      t.querySelectorAll(&#x27;[data-node]&#x27;).forEach(function(n){n.hidden=n.dataset.node!==g.dataset.go;});});
  });
  // age checker
  var ag=document.querySelector(&#x27;[data-age]&#x27;);
  if(ag){
    var NS=&#x27;http://www.w3.org/2000/svg&#x27;,X=function(a){return 30+a*(840/18);};
    var zones=ag.querySelector(&#x27;[data-zones]&#x27;),ticks=ag.querySelector(&#x27;[data-ticks]&#x27;);
    var age=ag.querySelector(&#x27;#ag&#x27;),dev=ag.querySelector(&#x27;[data-dev]&#x27;),work=&#x27;full&#x27;;
    for(var a=0;a&lt;=18;a++){var tx=document.createElementNS(NS,&#x27;text&#x27;);tx.setAttribute(&#x27;x&#x27;,X(a));tx.setAttribute(&#x27;y&#x27;,96);tx.setAttribute(&#x27;text-anchor&#x27;,&#x27;middle&#x27;);tx.textContent=a;ticks.appendChild(tx);}
    var kb=ag.querySelector(&#x27;[data-kids]&#x27;);kb.setAttribute(&#x27;x&#x27;,X(5));kb.setAttribute(&#x27;width&#x27;,X(15)-X(5));
    ag.querySelector(&#x27;[data-kids-l]&#x27;).setAttribute(&#x27;x&#x27;,X(5));
    var draw=function(){
      var d=dev.checked,mn=d?14:15,lt=d?12:13;
      var z=[[0,lt,&#x27;brick&#x27;,&#x27;prohibited&#x27;],[lt,mn,&#x27;ochre&#x27;,&#x27;light work only&#x27;],[mn,18,&#x27;sage&#x27;,&#x27;yes, if not hazardous&#x27;],[18,18.0001,&#x27;slate&#x27;,&#x27;&#x27;]];
      zones.innerHTML=&#x27;&#x27;;
      z.forEach(function(q){if(q[1]-q[0]&lt;0.01)return;
        var r=document.createElementNS(NS,&#x27;rect&#x27;);r.setAttribute(&#x27;x&#x27;,X(q[0]));r.setAttribute(&#x27;y&#x27;,34);r.setAttribute(&#x27;width&#x27;,X(q[1])-X(q[0]));r.setAttribute(&#x27;height&#x27;,40);r.setAttribute(&#x27;rx&#x27;,6);r.setAttribute(&#x27;style&#x27;,&#x27;fill:var(--&#x27;+q[2]+&#x27;-bg);stroke:var(--&#x27;+q[2]+&#x27;)&#x27;);zones.appendChild(r);
        var t=document.createElementNS(NS,&#x27;text&#x27;);t.setAttribute(&#x27;x&#x27;,(X(q[0])+X(q[1]))/2);t.setAttribute(&#x27;y&#x27;,58);t.setAttribute(&#x27;text-anchor&#x27;,&#x27;middle&#x27;);t.setAttribute(&#x27;font-size&#x27;,&#x27;12.5&#x27;);t.setAttribute(&#x27;class&#x27;,&#x27;svgtxt&#x27;);t.textContent=q[3];zones.appendChild(t);});
      var v=+age.value;age.nextElementSibling.textContent=v+&#x27; yrs&#x27;;
      var mx=X(v);ag.querySelector(&#x27;[data-mark]&#x27;).setAttribute(&#x27;points&#x27;,(mx-8)+&#x27;,80 &#x27;+(mx+8)+&#x27;,80 &#x27;+mx+&#x27;,72&#x27;);
      var out;
      if(work===&#x27;haz&#x27;)out=v&lt;18?&#x27;&lt;span class=&quot;verdict&quot;&gt;Child labour.&lt;/span&gt; Hazardous work is prohibited under the age of 18 (C138, Art. 3; it is also one of the worst forms under C182).&#x27;:&#x27;Adult: the work is permitted, subject to normal safety protections.&#x27;;
      else if(work===&#x27;full&#x27;)out=v&lt;mn?&#x27;&lt;span class=&quot;verdict&quot;&gt;Child labour.&lt;/span&gt; Below the minimum age (&#x27;+mn+&#x27;) regular full-time work is not permitted.&#x27;:(v&lt;18?&#x27;Permitted if not hazardous, but for a minor 14 hours a day (6 a.m. to 8 p.m.) is almost certainly excessive: national laws limit working hours.&#x27;:&#x27;Adult: permitted, within the working-hour limits that apply to all workers.&#x27;);
      else out=v&lt;lt?&#x27;&lt;span class=&quot;verdict&quot;&gt;Child labour.&lt;/span&gt; Below the age of &#x27;+lt+&#x27; not even light work is permitted (except for exceptions such as artistic performances).&#x27;:(v&lt;mn?&#x27;Permitted as &lt;em&gt;light work&lt;/em&gt;: only if it does not harm health and development and does not interfere with schooling. This is the zone of &lt;em&gt;child work&lt;/em&gt;.&#x27;:&#x27;Permitted.&#x27;);
      if(v&lt;15)out+=&#x27; &lt;br&gt;&lt;span class=&quot;small&quot;&gt;In Thailand the legal minimum age is 15.&lt;/span&gt;&#x27;;
      ag.querySelector(&#x27;[data-age-out]&#x27;).innerHTML=out;
    };
    ag.querySelectorAll(&#x27;[data-work] button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      work=b.dataset.w;ag.querySelectorAll(&#x27;[data-work] button&#x27;).forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,x===b);});draw();});});
    age.addEventListener(&#x27;input&#x27;,draw);dev.addEventListener(&#x27;change&#x27;,draw);draw();
  }
})();
&lt;/script&gt;
