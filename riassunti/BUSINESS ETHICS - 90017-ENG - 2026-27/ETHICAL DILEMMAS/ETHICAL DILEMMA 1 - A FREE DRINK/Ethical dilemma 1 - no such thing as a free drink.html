    &lt;div class=&quot;step&quot;&gt;
      &lt;h4&gt;Passo 1 · Il lavoro&lt;/h4&gt;
      &lt;p&gt;Jenna, amica e compagna di università, si lamenta da tempo di essere sempre al verde. Trova lavoro come &lt;b&gt;bartender&lt;/b&gt; nel bar studentesco dell&#x27;università, tre sere a settimana. Tu sei contento: lei guadagna, e tu sei un cliente abituale del bar.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Da notare: c&#x27;è già un &lt;b&gt;conflitto di ruoli&lt;/b&gt; possibile. Jenna è dipendente del bar e amica di un cliente.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Passo 2 · Il primo favore&lt;/h4&gt;
      &lt;p&gt;Quando vai al banco, Jenna &lt;b&gt;ti serve sempre per primo&lt;/b&gt;, anche se ci sono altre persone in attesa. Tu ne sei «rather pleased».&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;È un favoritismo piccolo: il costo è il tempo degli altri clienti, non i soldi del bar. La domanda 3 parte da qui.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Passo 3 · Il malcontento&lt;/h4&gt;
      &lt;p&gt;Jenna ha sempre una storia nuova sul &lt;b&gt;manager&lt;/b&gt;: le danno i turni peggiori, le tocca il lavoro meno amato (pulire i bagni), la rimproverano per errori che agli altri vengono perdonati.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Tu senti solo la sua versione. Il racconto di un torto subito è il terreno su cui nasceranno le giustificazioni (sezione 5).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Passo 4 · Il giro da quattro&lt;/h4&gt;
      &lt;p&gt;Paghi un giro di &lt;b&gt;quattro drink&lt;/b&gt; e Jenna, con discrezione, te ne fa pagare &lt;b&gt;uno&lt;/b&gt;. Sei un po&#x27; a disagio, ma non vuoi perdere il risparmio né metterla nei guai rifiutando. Gli amici trovano la cosa divertente e ti fanno i complimenti. Uno di loro ti chiede di andare tu a ordinare con i suoi soldi. Tu rifiuti, ma Jenna continua a farti lo sconto ogni volta che tocca a te.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Il gruppo crea &lt;b&gt;social consensus&lt;/b&gt; (consenso sociale) a favore del comportamento: «è divertente». Lo vedremo nella sezione 4.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Passo 5 · La giustificazione&lt;/h4&gt;
      &lt;p&gt;Non del tutto tranquillo, ne parli con Jenna da solo. Lei ride:&lt;/p&gt;
      &lt;blockquote&gt;«Yeah, it is great isn&#x27;t it? They will never notice, and you get a cheap night out. Besides, it is only what this place deserves after the way I have been treated.»&lt;/blockquote&gt;
      &lt;p class=&quot;small&quot;&gt;Tre frasi, tre giustificazioni diverse: nessuno se ne accorge, ne guadagni anche tu, se lo meritano. Le analizziamo nella sezione 5.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;small&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le quattro domande della lezione&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; La pagina segue le domande in un ordine logico (prima &lt;i&gt;chi&lt;/i&gt;, poi &lt;i&gt;quanto&lt;/i&gt;, poi &lt;i&gt;perché&lt;/i&gt;, infine &lt;i&gt;cosa fare&lt;/i&gt;), non nell&#x27;ordine del PDF.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q1 → sez. 3&lt;/span&gt;&lt;h4&gt;Chi sbaglia?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Jenna che ti fa lo sconto, tu che lo accetti, tutti e due o nessuno?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q2 → sez. 6&lt;/span&gt;&lt;h4&gt;Cosa faresti?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Niente, o chiedi a Jenna di smettere? E se lei rifiuta?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q3 → sez. 4&lt;/span&gt;&lt;h4&gt;Favore o furto?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto è diverso farsi sottocaricare (essere &lt;i&gt;undercharged&lt;/i&gt;) rispetto a essere serviti prima degli altri?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q4 → sez. 5&lt;/span&gt;&lt;h4&gt;Il torto subito la scusa?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il fatto che Jenna si senta maltrattata giustifica (&lt;i&gt;condone&lt;/i&gt;) il suo comportamento? Aiuta a spiegare le sue azioni o le tue?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Che cos&#x27;è un ethical dilemma.&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Un &lt;span class=&quot;term&quot;&gt;ethical dilemma&lt;/span&gt; (dilemma etico) è una situazione in cui una scelta va presa e ogni opzione mette in gioco valori diversi. Qui da una parte ci sono &lt;b&gt;lealtà verso un&#x27;amica&lt;/b&gt;, il quieto vivere e il risparmio. Dall&#x27;altra ci sono &lt;b&gt;onestà&lt;/b&gt;, rispetto della proprietà altrui ed equità verso gli altri clienti. Il caso non ha una «risposta giusta» scritta nelle slide: serve ad allenare il ragionamento.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In quale passo il comportamento cambia natura?&lt;/summary&gt;&lt;p&gt;Nel passo 4. Servirti per primo costa agli altri clienti solo un po&#x27; di tempo. Sottocaricare il conto toglie soldi al bar, cioè a un terzo che non è d&#x27;accordo. Si passa da un favoritismo a un&#x27;appropriazione di risorse altrui.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché è rilevante che il protagonista si senta «slightly uncomfortable»?&lt;/summary&gt;&lt;p&gt;Perché il disagio è un segnale di &lt;i&gt;moral awareness&lt;/i&gt; (consapevolezza morale): ti sei accorto che c&#x27;è una questione etica. Il dilemma nasce proprio dal fatto che, nonostante questo, gli incentivi (risparmio, amicizia, approvazione degli amici) spingono a non fare nulla.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che ruolo hanno gli amici che si congratulano?&lt;/summary&gt;&lt;p&gt;Creano una norma di gruppo che rende normale il comportamento («è divertente») e alzano il costo sociale di dire di no. Uno chiede perfino di usarti come intermediario: il comportamento tende ad allargarsi.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2. STAKEHOLDER ============ --&gt;
&lt;section id=&quot;stakeholder&quot; class=&quot;t-sage&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Chi è coinvolto&lt;/div&gt;
  &lt;h2&gt;Gli stakeholder del giro gratis&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Uno &lt;span class=&quot;term&quot;&gt;stakeholder&lt;/span&gt; è chiunque abbia un interesse in gioco in una decisione, perché ne è toccato o perché può influenzarla. Elencarli è il primo passo per capire che «non fa male a nessuno» quasi mai è vero. Tocca una persona nello schema.&lt;/p&gt;

  &lt;figure&gt;

        &lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;120&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;520&quot; y2=&quot;70&quot;/&gt;

      &lt;g class=&quot;sk&quot; data-k=&quot;jenna&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;120&quot; cy=&quot;70&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Jenna&lt;/text&gt;&lt;/g&gt;

      &lt;g class=&quot;sk&quot; data-k=&quot;amici&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;100&quot; cy=&quot;250&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Amici&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;bar&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;540&quot; cy=&quot;250&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Bar /&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;264&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;università&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;manager&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;290&quot; r=&quot;36&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;295&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Manager&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;clienti&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;40&quot; r=&quot;34&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Altri&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;clienti&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Ogni nodo è cliccabile. Il colore del bordo indica chi ci guadagna (terracotta), chi è complice (ocra) e chi ci perde (mattone e ardesia).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;box plain&quot; id=&quot;skout&quot; aria-live=&quot;polite&quot;&gt;&lt;b&gt;Tocca uno stakeholder&lt;/b&gt; per vedere cosa guadagna, cosa rischia e che dovere ha.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;«They will never notice»: perché questo non vuol dire «nessuno ci perde»?&lt;/summary&gt;&lt;p&gt;Che il danno non si veda non vuol dire che non ci sia. Il bar perde ricavi a ogni giro, e se è gestito dall&#x27;università o dall&#x27;associazione studentesca la perdita ricade anche sugli studenti. Inoltre, se gli ammanchi emergono, i sospetti possono cadere su colleghi innocenti.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Chi rischia di più se la cosa viene scoperta?&lt;/summary&gt;&lt;p&gt;Jenna: perde il lavoro e può avere conseguenze disciplinari o legali. È anche per questo che «non metterla nei guai» è un argomento ambiguo: continuare ad accettare la mette in un guaio più grande.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. CHI SBAGLIA ============ --&gt;
&lt;section id=&quot;chi&quot; class=&quot;t-slate&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Domanda 1&lt;/div&gt;
  &lt;h2&gt;Chi sbaglia: Jenna, tu, entrambi o nessuno?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; «Who is wrong in this situation, Jenna for undercharging you, you for accepting it, both of you, or neither of you?»&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Per rispondere bene serve un criterio. L&#x27;etica normativa ne offre tre grandi famiglie, che nei manuali di business ethics si usano come &lt;b&gt;lenti&lt;/b&gt;: guardano lo stesso fatto da punti diversi. Un buon argomento d&#x27;esame le confronta, non si limita a sceglierne una.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Consequentialism&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Deontology&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue ethics&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Consequentialism&lt;/b&gt; (consequenzialismo): un&#x27;azione è giusta se produce le conseguenze migliori. La versione più nota è l&#x27;&lt;span class=&quot;term&quot;&gt;utilitarianism&lt;/span&gt; (utilitarismo, Bentham e Mill): massimizzare il benessere complessivo di &lt;i&gt;tutti&lt;/i&gt; i coinvolti, contando ciascuno allo stesso modo.&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Domanda guida:&lt;/b&gt; sommando benefici e costi per tutti gli stakeholder, il risultato è positivo?&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Applicata al caso:&lt;/b&gt; i benefici sono concentrati e visibili (tu e gli amici risparmiate, Jenna si sente vendicata). I costi sono diffusi ma reali: ricavi persi dal bar, rischio altissimo per Jenna se scoperta, possibili sospetti sui colleghi, abitudine all&#x27;illecito che si allarga (l&#x27;amico che vuole usarti). Se si contano i rischi e gli effetti a lungo termine, il saldo tende al negativo.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Limite:&lt;/b&gt; se il bar davvero «non se ne accorge mai» e il danno è minimo, un calcolo stretto potrebbe dire che va bene. È la critica classica: l&#x27;utilitarismo può giustificare ingiustizie piccole e nascoste.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Verdetto tipico:&lt;/b&gt; sbagliano entrambi, perché entrambi producono il danno. Jenna ne è l&#x27;autrice, tu lo rendi possibile e lo ripeti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Deontology&lt;/b&gt; (etica dei doveri): un&#x27;azione è giusta se rispetta un dovere o una regola, a prescindere dalle conseguenze. Il riferimento è Kant, con il &lt;span class=&quot;term&quot;&gt;categorical imperative&lt;/span&gt; (imperativo categorico).&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Due test kantiani:&lt;/b&gt;&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;b&gt;Universalizzabilità:&lt;/b&gt; «agisci solo secondo una massima che puoi volere diventi legge universale». Se &lt;i&gt;ogni&lt;/i&gt; barista facesse pagare meno agli amici, i prezzi perderebbero senso e nessun bar potrebbe fidarsi del personale. La massima si contraddice da sola.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Umanità come fine:&lt;/b&gt; non trattare le persone solo come mezzi. Il datore di lavoro ha affidato a Jenna la cassa sulla base di un accordo. Usare quella fiducia per altri scopi lo tratta come puro mezzo.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p&gt;&lt;b&gt;Doveri in gioco:&lt;/b&gt; il dovere di Jenna, legato al ruolo, verso il datore di lavoro (onestà, correttezza). Il tuo dovere di non approfittare di ciò che sai non essere tuo. Il dovere verso l&#x27;amica esiste, ma non include aiutarla a fare qualcosa di sbagliato.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Verdetto tipico:&lt;/b&gt; sbagliano entrambi. Il torto subito da Jenna (se vero) non cancella il dovere: due torti non si compensano.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Virtue ethics&lt;/b&gt; (etica delle virtù): conta il &lt;i&gt;carattere&lt;/i&gt;. La domanda non è «quale regola?» ma «che tipo di persona sto diventando?». Viene da Aristotele: le virtù (onestà, giustizia, coraggio, lealtà) si formano con l&#x27;abitudine.&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Domanda guida:&lt;/b&gt; cosa farebbe una persona onesta &lt;i&gt;e&lt;/i&gt; un buon amico?&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Applicata al caso:&lt;/b&gt; la lealtà è una virtù, ma diventa un vizio quando copre la disonestà. Un buon amico non approfitta di Jenna e non la lascia scivolare in un comportamento che può costarle il lavoro. Il disagio che provi è proprio il segno di un carattere che «sente» il problema. Ogni giro accettato è un&#x27;abitudine che lo smussa.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Verdetto tipico:&lt;/b&gt; sbagliano entrambi. In più questa lente sottolinea il tuo &lt;i&gt;ruolo di amico&lt;/i&gt;: hai l&#x27;occasione di aiutare Jenna, non solo di non peccare tu.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Gradi di responsabilità&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; «Entrambi sbagliano» non vuol dire «allo stesso modo». La responsabilità ha gradi: chi agisce, chi ne beneficia sapendolo, chi incoraggia, chi ha creato il contesto.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Scala dei gradi di responsabilità&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gr&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--slate-bg)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;rect x=&quot;30&quot; y=&quot;70&quot; width=&quot;640&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;url(#gr)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;110&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;estraneo&lt;/text&gt;
      &lt;text x=&quot;670&quot; y=&quot;110&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;autore&lt;/text&gt;
      &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;
        &lt;circle cx=&quot;210&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Manager&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;contesto (forse ingiusto)&lt;/text&gt;
        &lt;circle cx=&quot;340&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Amici&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;incoraggiano&lt;/text&gt;
        &lt;circle cx=&quot;480&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Tu&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;beneficiario consapevole&lt;/text&gt;
        &lt;circle cx=&quot;620&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Jenna&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;compie l&#x27;atto&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Una lettura possibile, non l&#x27;unica. Il beneficiario consapevole e ripetuto si avvicina molto all&#x27;autore: senza i tuoi giri, il trucco non avrebbe destinatario.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details&gt;&lt;summary&gt;Ma io non ho chiesto niente: accettare è davvero «fare»?&lt;/summary&gt;
    &lt;p&gt;È la distinzione tra &lt;span class=&quot;term&quot;&gt;acts&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;omissions&lt;/span&gt; (azioni e omissioni). La prima volta la sorpresa può attenuare la colpa. Ma il caso dice che la cosa va avanti «for a number of visits»: tornare al banco sapendo cosa succederà è una scelta ripetuta. Inoltre tu sei l&#x27;unico che può fermarla senza costi per Jenna: ti basta pagare il prezzo pieno.&lt;/p&gt;
  &lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;E l&#x27;opzione «nessuno sbaglia»?&lt;/summary&gt;
    &lt;p&gt;Per sostenerla bisognerebbe dire che il bar non subisce un danno reale, oppure che il torto subito da Jenna rende lo sconto una forma di giusta compensazione. Entrambe le tesi sono deboli: la prima la smonta l&#x27;analisi degli stakeholder (sez. 2), la seconda l&#x27;analisi della domanda 4 (sez. 5).&lt;/p&gt;
  &lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Applica il test di universalizzabilità alla massima di Jenna.&lt;/summary&gt;&lt;p&gt;Massima: «quando mi sento trattato male dal datore di lavoro, posso regalare la sua merce agli amici». Universalizzata, nessun datore potrebbe affidare beni ai dipendenti e il concetto stesso di rapporto di lavoro basato sulla fiducia salterebbe. La massima non regge.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché un utilitarista potrebbe essere in difficoltà con questo caso?&lt;/summary&gt;&lt;p&gt;Perché se il danno è davvero piccolo e nessuno lo scopre, il bilancio immediato sembra positivo (felicità degli amici &gt; piccola perdita del bar). Deve allora contare rischi, effetti nel tempo e l&#x27;erosione della fiducia. Oppure passare a un &lt;i&gt;rule utilitarianism&lt;/i&gt;: valutare la regola «i baristi fanno sconti agli amici», le cui conseguenze generali sono chiaramente negative.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa aggiunge la virtue ethics rispetto alle altre due lenti?&lt;/summary&gt;&lt;p&gt;Sposta l&#x27;attenzione dall&#x27;atto singolo al carattere e alle relazioni. Ti chiede che amico vuoi essere, e mostra che la lealtà, senza onestà, diventa complicità.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4. FAVORE O FURTO ============ --&gt;
&lt;section id=&quot;favori&quot; class=&quot;t-ochre&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Domanda 3&lt;/div&gt;
  &lt;h2&gt;Servirti prima o farti pagare meno: che differenza c&#x27;è?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; «To what extent do you think that being deliberately undercharged is different from other forms of preferential treatment, such as Jenna serving you in front of other waiting customers?»&lt;/p&gt;

  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Servirti per primo&lt;/th&gt;&lt;th&gt;Farti pagare 1 drink su 4&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi paga il costo&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gli altri clienti, in tempo di attesa&lt;/td&gt;&lt;td&gt;Il bar (datore di lavoro), in denaro&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Risorsa usata&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;attenzione di Jenna, su cui ha discrezione&lt;/td&gt;&lt;td&gt;Merce e prezzi del bar, di cui Jenna &lt;i&gt;non&lt;/i&gt; è proprietaria&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Visibilità&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Pubblica: tutti vedono&lt;/td&gt;&lt;td&gt;Nascosta: «discreetly», «they will never notice»&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Reversibilità&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Il danno svanisce in pochi minuti&lt;/td&gt;&lt;td&gt;Il danno si accumula a ogni giro&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Regole&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Viola una norma sociale (la fila)&lt;/td&gt;&lt;td&gt;Viola regole del rapporto di lavoro e potenzialmente la legge&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consenso sociale&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Diffusamente tollerato tra amici&lt;/td&gt;&lt;td&gt;Ampiamente giudicato disonesto (fuori dal tuo gruppo)&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Entrambi sono &lt;span class=&quot;term&quot;&gt;preferential treatment&lt;/span&gt; (trattamento di favore) e hanno la stessa struttura: un rapporto personale entra in un ruolo professionale che dovrebbe essere imparziale. Cambia l&#x27;&lt;b&gt;intensità&lt;/b&gt;. Un buon modo di misurarla è il modello di Jones.&lt;/p&gt;

  &lt;h3&gt;Moral intensity: misurare quanto «pesa» una questione&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Thomas M. Jones (1991) ha proposto che la probabilità di riconoscere una questione come morale, e di comportarsi eticamente, dipenda dalle caratteristiche della &lt;i&gt;questione stessa&lt;/i&gt;. Le ha chiamate &lt;span class=&quot;term&quot;&gt;moral intensity&lt;/span&gt; (intensità morale) e le ha divise in sei dimensioni. Il modello è spesso usato nei manuali di business ethics per spiegare perché le persone sottovalutano i «piccoli» illeciti.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Magnitude of consequences&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto danno (o beneficio) totale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social consensus&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto la gente concorda che sia sbagliato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Probability of effect&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto è probabile che il danno avvenga davvero.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Temporal immediacy&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto presto arrivano le conseguenze.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Proximity&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto ci si sente vicini a chi subisce il danno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Concentration of effect&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quanto il danno cade su pochi invece che spalmato su molti.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box plain&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;p&gt;&lt;b&gt;Laboratorio.&lt;/b&gt; Scegli un comportamento e regola le sei dimensioni (0 = bassa, 10 = alta). I valori iniziali sono una stima ragionata e discutibile: spostali e osserva l&#x27;indice.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot; style=&quot;margin:0 0 .6rem&quot;&gt;&lt;button class=&quot;btn on&quot; data-mi=&quot;0&quot;&gt;Servirti per primo&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mi=&quot;1&quot;&gt;Sottocaricare 4→1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mi=&quot;2&quot;&gt;Sottocaricare, visto dal tuo gruppo&lt;/button&gt;&lt;/div&gt;
    &lt;div id=&quot;mislider&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:.8rem&quot;&gt;Indice di moral intensity: &lt;span class=&quot;big&quot; id=&quot;miv&quot;&gt;–&lt;/span&gt;&lt;span class=&quot;small&quot;&gt; / 10&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;i id=&quot;mibar&quot; style=&quot;width:0&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot; id=&quot;mitxt&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;L&#x27;indice è una media semplice per scopi didattici: Jones non propone una formula numerica.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Il terzo preset mostra il punto chiave del caso: &lt;b&gt;gli stessi fatti&lt;/b&gt;, visti dal gruppo che si congratula (consenso alto a favore, danno «che nessuno nota», vittima lontana e impersonale), hanno un&#x27;intensità percepita molto più bassa. Per questo il protagonista è solo «slightly uncomfortable».&lt;/p&gt;

  &lt;h3&gt;«Ma è solo qualche drink»: quanto vale davvero?&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; La &lt;i&gt;magnitude of consequences&lt;/i&gt; si sottovaluta quando il danno è spezzettato. Prova a sommarlo.&lt;/p&gt;
  &lt;div class=&quot;box plain&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cp&quot;&gt;Prezzo di un drink&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cp&quot; min=&quot;2&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;cpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cg&quot;&gt;Drink non pagati per giro&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cg&quot; min=&quot;1&quot; max=&quot;6&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;cgo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cw&quot;&gt;Giri «scontati» a settimana&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cw&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;cwo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cs&quot;&gt;Settimane (un semestre ≈ 14)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cs&quot; min=&quot;1&quot; max=&quot;40&quot; value=&quot;14&quot;&gt;&lt;output id=&quot;cso&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p&gt;Perdita per il bar: &lt;span class=&quot;big&quot; id=&quot;ctot&quot;&gt;–&lt;/span&gt;&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect id=&quot;cbar&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;0&quot; y=&quot;66&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;0 €&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;66&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;2.000 €&lt;/text&gt;&lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;ctxt&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza decisiva tra i due favori?&lt;/summary&gt;&lt;p&gt;Con il primo Jenna usa una risorsa su cui ha un certo margine (l&#x27;ordine in cui servire). Con il secondo usa beni che appartengono al datore di lavoro, in modo nascosto e ripetuto. Il primo è scortese verso gli altri clienti, il secondo è un&#x27;appropriazione di valore altrui.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali due dimensioni di Jones sono «abbassate» artificialmente dal contesto del caso?&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Social consensus&lt;/b&gt; (gli amici approvano e lo trovano divertente) e &lt;b&gt;proximity&lt;/b&gt; (la vittima è un&#x27;organizzazione impersonale, «this place»). A queste si aggiunge la bassa &lt;i&gt;concentration of effect&lt;/i&gt;: la perdita è diluita.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il favoritismo «piccolo» è innocuo?&lt;/summary&gt;&lt;p&gt;Non del tutto: è iniquo verso gli altri clienti. Inoltre il caso mostra che spesso è il primo gradino di una &lt;i&gt;slippery slope&lt;/i&gt; (china scivolosa): una volta accettato che l&#x27;amicizia piega le regole del ruolo, il passo successivo sembra meno grave.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5. IL TORTO SUBITO ============ --&gt;
&lt;section id=&quot;torto&quot; class=&quot;t-brick&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Domanda 4&lt;/div&gt;
  &lt;h2&gt;Il torto subito giustifica Jenna?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; «Does the fact that Jenna feels aggrieved at the treatment she receives from her boss condone her behaviour? Does it help to explain either her actions or your actions?»&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;La chiave della domanda: spiegare ≠ giustificare.&lt;/b&gt; La domanda separa due verbi. &lt;i&gt;Condone&lt;/i&gt; vuol dire scusare, rendere accettabile. &lt;i&gt;Explain&lt;/i&gt; vuol dire capire le cause. Il risentimento di Jenna &lt;b&gt;spiega&lt;/b&gt; molto bene perché agisce così, ma non lo &lt;b&gt;rende giusto&lt;/b&gt;: il bar non ha accettato di pagare per il comportamento del manager, e i drink regalati non riparano il torto, né per lei né per i colleghi.&lt;/div&gt;

  &lt;h3&gt;Spiegare: la equity theory&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Secondo la &lt;span class=&quot;term&quot;&gt;equity theory&lt;/span&gt; (teoria dell&#x27;equità) di J. Stacy Adams, ciascuno confronta il rapporto tra ciò che &lt;i&gt;riceve&lt;/i&gt; dal lavoro (&lt;span class=&quot;term&quot;&gt;outcomes&lt;/span&gt;: paga, turni, rispetto) e ciò che &lt;i&gt;dà&lt;/i&gt; (&lt;span class=&quot;term&quot;&gt;inputs&lt;/span&gt;: impegno, tempo, competenze) con lo stesso rapporto di un collega di riferimento.&lt;/p&gt;
  &lt;div class=&quot;box plain&quot; style=&quot;text-align:center;font-family:var(--serif);font-size:1.3rem&quot;&gt;
    O&lt;sub&gt;Jenna&lt;/sub&gt; / I&lt;sub&gt;Jenna&lt;/sub&gt; &amp;nbsp; vs &amp;nbsp; O&lt;sub&gt;colleghi&lt;/sub&gt; / I&lt;sub&gt;colleghi&lt;/sub&gt;
    &lt;div class=&quot;small&quot; style=&quot;font-family:var(--sans)&quot;&gt;Se il primo rapporto è più basso → &lt;b&gt;underpayment inequity&lt;/b&gt; (iniquità per difetto) → tensione → spinta a «riequilibrare»&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box plain&quot;&gt;
    &lt;p&gt;&lt;b&gt;Bilancia interattiva.&lt;/b&gt; Turni peggiori e rimproveri riducono gli &lt;i&gt;outcomes&lt;/i&gt; di Jenna rispetto ai colleghi.&lt;/p&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;eo1&quot;&gt;Outcomes di Jenna&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eo1&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;eo1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;ei1&quot;&gt;Inputs di Jenna&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ei1&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ei1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;eo2&quot;&gt;Outcomes dei colleghi&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eo2&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;eo2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;ei2&quot;&gt;Inputs dei colleghi&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ei2&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ei2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 500 190&quot; aria-label=&quot;Bilancia dell&#x27;equità&quot;&gt;
      &lt;polygon points=&quot;250,170 235,190 265,190&quot; fill=&quot;var(--ink2)&quot;/&gt;
      &lt;g id=&quot;beam&quot; style=&quot;transition:transform .3s&quot;&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;100&quot; x2=&quot;430&quot; y2=&quot;100&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;250&quot; y1=&quot;100&quot; x2=&quot;250&quot; y2=&quot;170&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;75&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; id=&quot;r1&quot;&gt;Jenna&lt;/text&gt;
        &lt;rect x=&quot;370&quot; y=&quot;62&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;425&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; id=&quot;r2&quot;&gt;Colleghi&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;eqtxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Per ridurre la tensione la teoria prevede varie strade: ridurre l&#x27;impegno, chiedere di più, cambiare il termine di confronto, andarsene. Oppure &lt;b&gt;prendersi da soli ciò che si ritiene dovuto&lt;/b&gt;. Jerald Greenberg (1990) lo ha osservato sul campo: in stabilimenti dove la paga era stata tagliata temporaneamente, i furti dei dipendenti aumentarono, e aumentarono meno dove il taglio era stato spiegato con cura e rispetto. Lo sconto di Jenna è un caso da manuale di questo «riequilibrio».&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Attenzione: la teoria dice cosa le persone tendono a fare, non cosa è giusto fare. È uno strumento per &lt;i&gt;spiegare&lt;/i&gt;, coerente con la domanda 4.&lt;/p&gt;

  &lt;h3&gt;Le scuse che ci raccontiamo: techniques of neutralization&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; I sociologi Gresham Sykes e David Matza (1957) hanno notato che chi viola una norma di solito &lt;i&gt;la condivide&lt;/i&gt;, ma la «neutralizza» con giustificazioni che zittiscono il senso di colpa. Le chiamano &lt;span class=&quot;term&quot;&gt;techniques of neutralization&lt;/span&gt;. Tocca una frase per vedere quale tecnica usa.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; id=&quot;neutral&quot;&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;0&quot;&gt;Jenna: «They will never notice»&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;1&quot;&gt;Jenna: «It is only what this place deserves»&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;2&quot;&gt;Jenna: «…after the way I have been treated»&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;3&quot;&gt;Tu: «Non voglio metterla nei guai»&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;4&quot;&gt;Tu: «Non sono io a battere lo scontrino»&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;5&quot;&gt;Jenna: «…and you get a cheap night out»&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot; id=&quot;nout&quot; aria-live=&quot;polite&quot;&gt;Le cinque tecniche classiche: &lt;b&gt;denial of responsibility&lt;/b&gt;, &lt;b&gt;denial of injury&lt;/b&gt;, &lt;b&gt;denial of the victim&lt;/b&gt;, &lt;b&gt;condemnation of the condemners&lt;/b&gt;, &lt;b&gt;appeal to higher loyalties&lt;/b&gt;.&lt;/div&gt;

  &lt;h3&gt;Spiega anche le tue azioni?&lt;/h3&gt;
  &lt;p&gt;In parte sì: la storia del maltrattamento ti rende &lt;b&gt;più comprensivo&lt;/b&gt; e quindi meno propenso a dire di no. Ma tu non hai subito nessun torto dal bar: per te il risentimento di Jenna non è nemmeno una spiegazione, è al massimo un alibi preso in prestito. E ricorda che conosci &lt;b&gt;una sola versione&lt;/b&gt; dei fatti: non sai se il manager sia davvero ingiusto.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra «condone» ed «explain»?&lt;/summary&gt;&lt;p&gt;&lt;i&gt;Explain&lt;/i&gt;: individuare le cause di un comportamento (risentimento, senso di iniquità). &lt;i&gt;Condone&lt;/i&gt;: considerarlo accettabile o perdonabile. Si può spiegare un comportamento senza scusarlo: è la risposta più solida alla domanda 4.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Secondo la equity theory, quali alternative legittime aveva Jenna?&lt;/summary&gt;&lt;p&gt;Parlare con il manager o con un suo superiore, chiedere turni equi, documentare il trattamento diverso, rivolgersi a rappresentanti degli studenti o dei lavoratori, oppure cercare un altro lavoro. Tutte riducono l&#x27;iniquità senza danneggiare terzi.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;«They will never notice»: quale tecnica di neutralizzazione è?&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Denial of injury&lt;/b&gt;: se nessuno se ne accorge, «non c&#x27;è danno». Ma un danno nascosto è comunque un danno.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il torto subito da Jenna rende «legittimo» che anche tu ne approfitti?&lt;/summary&gt;&lt;p&gt;No. Anche nella lettura più favorevole a Jenna, il torto l&#x27;ha subito lei, non tu. Il tuo beneficio non ripara nulla e trasferisce valore dal bar a te.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6. COSA FARE ============ --&gt;
&lt;section id=&quot;agire&quot; class=&quot;t-accent&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Domanda 2&lt;/div&gt;
  &lt;h2&gt;Cosa faresti? E se lei rifiuta?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;dalle slide&lt;/span&gt; «Confronted by this situation, how would you handle it? Do nothing, or ask Jenna to stop undercharging you? If you take the latter option, what would you do if she refused?»&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;integrazione&lt;/span&gt; Un modo utile per ordinare le opzioni è lo schema di Albert O. Hirschman: davanti a qualcosa che non va si può scegliere &lt;span class=&quot;term&quot;&gt;exit&lt;/span&gt; (uscire, sottrarsi) o &lt;span class=&quot;term&quot;&gt;voice&lt;/span&gt; (prendere la parola per cambiare le cose). La &lt;span class=&quot;term&quot;&gt;loyalty&lt;/span&gt; (lealtà) influenza quale strada si prende. Qui la lealtà verso Jenna spinge verso il silenzio. Scegli un&#x27;opzione:&lt;/p&gt;

  &lt;div class=&quot;ctrl&quot; id=&quot;opts&quot; style=&quot;margin-bottom:.5rem&quot;&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;0&quot;&gt;Non fare nulla&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;1&quot;&gt;Pagare il prezzo pieno&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;2&quot;&gt;Parlare con Jenna&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;3&quot;&gt;Smettere di andare al suo banco&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;4&quot;&gt;Dirlo al manager&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot; id=&quot;oout&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;small&quot;&gt;Ogni opzione mostra cosa succede a ciascuno stakeholder e come la giudicano le tre lenti della sezione 3.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Se Jenna rifiuta: una scala di escalation&lt;/h3&gt;
  &lt;p&gt;Il protagonista ha già fatto il primo passo, e lei «just laughs it off». Le risposte vanno dosate: partire dal mezzo meno costoso per la relazione, e salire solo se serve.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Scala di escalation in quattro gradini&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;150&quot; height=&quot;50&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · Rifiuta tu&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;paga il conto intero&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;150&quot; width=&quot;150&quot; height=&quot;100&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · Spiega perché&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;il rischio per lei,&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;non una predica&lt;/text&gt;
        &lt;rect x=&quot;320&quot; y=&quot;100&quot; width=&quot;150&quot; height=&quot;150&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;395&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · Offri aiuto&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;sul vero problema:&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;il manager, i turni&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;50&quot; width=&quot;150&quot; height=&quot;200&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;4 · Prendi distanza&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;non partecipare più;&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;valuta se segnalare&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M40 40 L600 20&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;text x=&quot;40&quot; y=&quot;30&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;costo per la relazione e incisività crescono&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;Il gradino 1 è sempre possibile, anche se lei rifiuta&lt;/summary&gt;&lt;p&gt;Non serve il permesso di Jenna per pagare il prezzo pieno: puoi dire il numero esatto di drink, mettere i soldi giusti, o ordinare da un collega. È il punto su cui hai pieno controllo. Ed elimina la tua parte di responsabilità senza esporre Jenna.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;E segnalare al manager?&lt;/summary&gt;&lt;p&gt;È l&#x27;opzione più dura: protegge il bar, ma probabilmente costa a Jenna il lavoro e a te l&#x27;amicizia. Un argomento a favore: il danno continua e si allarga (gli amici). Uno contro: è sproporzionato se basta smettere di partecipare. Molti la vedono come ultima risorsa, se il comportamento cresce o se si rischia che la colpa cada su colleghi innocenti. Non esiste una risposta unica: conta motivare la scelta.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Come rispondere agli amici?&lt;/summary&gt;&lt;p&gt;Rifiutare il ruolo di intermediario (come il protagonista fa già) è coerente. Spiegare in modo semplice («la mettiamo nei guai») sposta la questione dal moralismo alla cura per Jenna, ed è più facile da accettare per il gruppo.&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché «non fare nulla» non è una scelta neutra?&lt;/summary&gt;&lt;p&gt;Perché lasciare le cose come stanno vuol dire continuare a ricevere drink sottocosto: il silenzio qui è partecipazione. E la situazione tende a peggiorare (più amici, più giri).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Exit o voice: quale delle due è «pagare il prezzo pieno»?&lt;/summary&gt;&lt;p&gt;È soprattutto una forma di &lt;b&gt;exit&lt;/b&gt;: esci dal meccanismo senza cercare di cambiarlo. Parlare con Jenna, o con il manager, è &lt;b&gt;voice&lt;/b&gt;. Spesso la risposta migliore le combina: esci subito e insieme parli.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è l&#x27;argomento più efficace per convincere Jenna?&lt;/summary&gt;&lt;p&gt;Quello che parte dai suoi interessi: rischia il posto e la reputazione per qualche drink, e così si toglie la ragione nella disputa con il manager. Se viene scoperta, nessuno ascolterà più le sue lamentele sul trattamento ingiusto.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SINTESI ============ --&gt;
&lt;section class=&quot;t-sage&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Sintesi&lt;/div&gt;
  &lt;h2&gt;La risposta d&#x27;esame in quattro righe&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q1&lt;/span&gt;&lt;p&gt;Sbagliano entrambi, con gradi diversi: Jenna come autrice, tu come beneficiario consapevole e ripetuto. Le tre lenti etiche (consequentialism, deontology, virtue ethics) arrivano qui alla stessa conclusione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q2&lt;/span&gt;&lt;p&gt;Pagare il prezzo pieno è sempre possibile e risolve la tua parte. Parlare con Jenna partendo dal suo interesse. Se rifiuta, prendere distanza; segnalare solo come ultima risorsa, motivando la scelta.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q3&lt;/span&gt;&lt;p&gt;Stessa struttura (preferential treatment), intensità diversa: lo sconto usa beni altrui, è nascosto, si accumula. La moral intensity è alta, ma il gruppo la fa &lt;i&gt;percepire&lt;/i&gt; bassa.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q4&lt;/span&gt;&lt;p&gt;Il torto subito &lt;b&gt;spiega&lt;/b&gt; (equity theory, techniques of neutralization) ma non &lt;b&gt;giustifica&lt;/b&gt;. E per te non è neanche una spiegazione: è un alibi preso in prestito.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;t-ochre&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Testi, studi e norme&lt;/h2&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Nota importante.&lt;/b&gt; Le slide di questa lezione &lt;b&gt;non citano autori, studi, testi, norme o siti&lt;/b&gt;: contengono solo il caso e le domande. Le voci qui sotto sono le fonti dei concetti usati sopra come &lt;i&gt;integrazione&lt;/i&gt;. Ogni dato bibliografico viene dal web ed è segnato come &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;. Non è stato possibile consultare gli altri file della cartella corso/ (lezioni, programma), quindi non so quali di questi testi siano già nel corso: verifica sul programma.&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;A. Crane, D. Matten, S. Glozer, L. Spence, &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;, 5ª ed., Oxford University Press, 2019 (ISBN 9780198810070)&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; manuale di riferimento di business ethics: teorie etiche normative, decision making etico, stakeholder, e capitoli dedicati a dipendenti, consumatori, fornitori, società civile. Ogni capitolo ha riquadri «Ethical dilemma». &lt;b&gt;Perché conta:&lt;/b&gt; il formato della slide («ETHICAL DILEMMA 1», domande numerate) corrisponde a questi riquadri, quindi è con ogni probabilità il libro da cui viene il caso. È un&#x27;attribuzione dedotta, non scritta nelle slide.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;editore (Oxford University Press, edizione internazionale)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Stanford Encyclopedia of Philosophy: «Consequentialism», «Kant&#x27;s Moral Philosophy», «Virtue Ethics»&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; tre voci enciclopediche accademiche, aggiornate periodicamente. Coprono le tre lenti della sezione 3: le conseguenze come unico criterio, l&#x27;imperativo categorico, la centralità del carattere (la voce sulle virtù è di R. Hursthouse e G. Pettigrove). &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte gratuita più affidabile per controllare definizioni e obiezioni classiche.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/consequentialism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consequentialism&lt;/a&gt; · &lt;a href=&quot;https://plato.stanford.edu/entries/kant-moral/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kant&#x27;s Moral Philosophy&lt;/a&gt; · &lt;a href=&quot;https://plato.stanford.edu/entries/ethics-virtue/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Virtue Ethics&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;T. M. Jones, «Ethical Decision Making by Individuals in Organizations: An Issue-Contingent Model», &lt;i&gt;Academy of Management Review&lt;/i&gt;, 16(2), 1991, pp. 366–395&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; introduce la &lt;i&gt;moral intensity&lt;/i&gt; e le sue sei dimensioni, che influenzano le quattro fasi del comportamento etico (riconoscere la questione, giudicare, avere l&#x27;intenzione, agire). Studi successivi indicano &lt;i&gt;social consensus&lt;/i&gt; e &lt;i&gt;magnitude of consequences&lt;/i&gt; come le dimensioni più influenti. &lt;b&gt;Perché conta:&lt;/b&gt; spiega perché il favoritismo e lo sconto «sembrano» diversi (sez. 4) e perché il gruppo di amici abbassa la percezione del problema.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1991.4278958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell&#x27;articolo&lt;/a&gt; · &lt;a href=&quot;https://sk.sagepub.com/ency/edvol/embed/sage-encyclopedia-of-business-ethics-and-society-2e/chpt/moral-intensity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce «Moral intensity», SAGE Encyclopedia of Business Ethics and Society&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;J. S. Adams, «Inequity in Social Exchange», in L. Berkowitz (a cura di), &lt;i&gt;Advances in Experimental Social Psychology&lt;/i&gt;, vol. 2, Academic Press, 1965, pp. 267–299&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la formulazione completa della equity theory: il confronto tra rapporti outcomes/inputs, la tensione proporzionale all&#x27;iniquità e le strategie per ridurla. È un quadro generale degli scambi sociali, non solo del lavoro. &lt;b&gt;Perché conta:&lt;/b&gt; è lo strumento per &lt;i&gt;spiegare&lt;/i&gt; il comportamento di Jenna (sez. 5).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1016/S0065-2601(08)60108-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI del capitolo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;J. Greenberg, «Employee Theft as a Reaction to Underpayment Inequity: The Hidden Cost of Pay Cuts», &lt;i&gt;Journal of Applied Psychology&lt;/i&gt;, 75(5), 1990, pp. 561–568&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; uno studio sul campo in stabilimenti industriali dopo un taglio temporaneo delle paghe. I furti dei dipendenti aumentano e la loro crescita si riduce quando il taglio viene spiegato in modo adeguato e rispettoso. &lt;b&gt;Perché conta:&lt;/b&gt; è la prova empirica che il senso di ingiustizia può tradursi in appropriazione ai danni del datore di lavoro, proprio come per Jenna. Mostra anche che il &lt;i&gt;modo&lt;/i&gt; in cui un&#x27;organizzazione tratta le persone conta (organizational justice).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1037/0021-9010.75.5.561&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell&#x27;articolo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;G. M. Sykes, D. Matza, «Techniques of Neutralization: A Theory of Delinquency», &lt;i&gt;American Sociological Review&lt;/i&gt;, 22(6), 1957&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; nato per spiegare la delinquenza giovanile, propone che chi viola una norma la condivida ma la «neutralizzi» con cinque tecniche: denial of responsibility, denial of injury, denial of the victim, condemnation of the condemners, appeal to higher loyalties. Studi successivi notano che l&#x27;elenco non è esaustivo e che il sostegno empirico è misto. &lt;b&gt;Perché conta:&lt;/b&gt; le frasi di Jenna (e i pensieri del protagonista) sono esempi quasi perfetti di queste tecniche.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://study.sagepub.com/system/files/Sykes,_Gresham_M.,_and_David_Matza_-_Techniques_of_Neutralization.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo dell&#x27;articolo (materiali didattici SAGE)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Techniques_of_neutralization&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;A. O. Hirschman, &lt;i&gt;Exit, Voice, and Loyalty: Responses to Decline in Firms, Organizations, and States&lt;/i&gt;, Harvard University Press, 1970&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; distingue due risposte all&#x27;insoddisfazione verso un&#x27;organizzazione: &lt;i&gt;exit&lt;/i&gt; (andarsene, cambiare fornitore) e &lt;i&gt;voice&lt;/i&gt; (cercare di cambiare le cose dall&#x27;interno). La &lt;i&gt;loyalty&lt;/i&gt; rallenta l&#x27;uscita e dà spazio alla voce. &lt;b&gt;Perché conta:&lt;/b&gt; dà un vocabolario per ordinare le opzioni della domanda 2 (sez. 6). Vale anche per Jenna: davanti al manager aveva exit e voice, e ha scelto una terza via, la ritorsione nascosta.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://casbs.stanford.edu/exit-voice-and-loyalty-responses-decline-firms-organizations-and-states&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda del libro (Stanford CASBS)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Codice civile, art. 2105 «Obbligo di fedeltà» (con artt. 1175 e 1375 su correttezza e buona fede)&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; nel diritto italiano il lavoratore subordinato non deve fare concorrenza al datore né divulgarne le informazioni. La giurisprudenza legge l&#x27;obbligo in senso ampio, integrato dai doveri generali di correttezza e buona fede. &lt;b&gt;Perché conta:&lt;/b&gt; mostra che il «dovere legato al ruolo» della lente deontologica ha un corrispettivo giuridico. Il caso è ambientato in un contesto anglosassone, quindi è solo un parallelo: la qualificazione legale concreta (disciplinare o penale) dipende dai fatti e non va data per scontata.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-ii/capo-i/sezione-iii/art2105.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2105 c.c. su Brocardi.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
&lt;footer&gt;
  &lt;p&gt;&lt;b&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/b&gt;&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Fonte principale: «Ethical dilemma 1 – no such thing as a free drink.pdf» (cartella corso/ETHICAL DILEMMAS). Le parti segnate come &lt;i&gt;integrazione&lt;/i&gt; o &lt;i&gt;fonte esterna&lt;/i&gt; non sono nelle slide.&lt;/p&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  // passi da scorrere
  document.querySelectorAll(&#x27;[data-steps]&#x27;).forEach(function(box){
    var steps=box.querySelectorAll(&#x27;.step&#x27;),bars=box.querySelectorAll(&#x27;.bar span&#x27;),i=0;
    var prev=box.querySelector(&#x27;[data-prev]&#x27;),next=box.querySelector(&#x27;[data-next]&#x27;),cnt=box.querySelector(&#x27;[data-count]&#x27;);
    function show(){steps.forEach(function(s,k){s.hidden=k!==i});bars.forEach(function(b,k){b.classList.toggle(&#x27;on&#x27;,k&lt;=i)});
      prev.disabled=i===0;next.disabled=i===steps.length-1;if(cnt)cnt.textContent=(i+1)+&#x27; / &#x27;+steps.length;}
    prev.onclick=function(){if(i&gt;0){i--;show();}};next.onclick=function(){if(i&lt;steps.length-1){i++;show();}};show();
  });
  // linguette
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;.tablist button&#x27;),pans=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,k){b.onclick=function(){btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===k?&#x27;true&#x27;:&#x27;false&#x27;)});pans.forEach(function(p,j){p.hidden=j!==k});};});
  });
  // stakeholder
  var SK={
    jenna:[&#x27;Jenna&#x27;,&#x27;Guadagna: una piccola «rivincita» sul manager e la gratitudine degli amici. Rischia: licenziamento, conseguenze disciplinari o legali, la fiducia dei colleghi. Dovere: lealtà e correttezza verso il datore di lavoro, di cui maneggia merce e cassa.&#x27;],
    tu:[&#x27;Tu&#x27;,&#x27;Guadagni: tre drink su quattro gratis a ogni giro. Rischi: complicità, la reputazione, e l\&#x27;amicizia stessa se la cosa finisce male. Dovere: non approfittare di ciò che sai non essere dovuto. Tu sei quello che &lt;i&gt;può scegliere&lt;/i&gt; di interrompere la catena.&#x27;],
    amici:[&#x27;Gli amici&#x27;,&#x27;Guadagnano: drink a basso costo e una storia divertente. Rischiano poco in prima persona, ma creano pressione sociale (social consensus) e cercano di allargare il meccanismo usandoti come intermediario.&#x27;],
    bar:[&#x27;Il bar / l\&#x27;università&#x27;,&#x27;Perde: il ricavo di ogni drink non pagato. Il danno è diffuso e invisibile (nessuno lo nota), ma si accumula. Se il bar è dell\&#x27;università o degli studenti, la perdita ricade sulla comunità di cui fai parte.&#x27;],
    manager:[&#x27;Il manager&#x27;,&#x27;Secondo Jenna tratta male lei in particolare (turni peggiori, compiti ingrati, rimproveri sproporzionati). Ha la responsabilità di un trattamento equo del personale. Ma lo conosciamo &lt;i&gt;solo&lt;/i&gt; dal racconto di Jenna.&#x27;],
    clienti:[&#x27;Gli altri clienti&#x27;,&#x27;Perdono tempo quando Jenna ti serve per primo (passo 2). Pagano il prezzo pieno mentre tu no: subiscono una disparità di trattamento. Se gli ammanchi portano a prezzi più alti, pagano anche quelli.&#x27;]
  };
  var out=document.getElementById(&#x27;skout&#x27;);
  document.querySelectorAll(&#x27;#stakesvg .sk&#x27;).forEach(function(g){
    function f(){var d=SK[g.dataset.k];out.innerHTML=&#x27;&lt;b&gt;&#x27;+d[0]+&#x27;.&lt;/b&gt; &#x27;+d[1];}
    g.style.cursor=&#x27;pointer&#x27;;g.addEventListener(&#x27;click&#x27;,f);g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();f();}});
  });
  function $(id){return document.getElementById(id);}
  // moral intensity
  var MID=[&#x27;Magnitude of consequences&#x27;,&#x27;Social consensus (che sia sbagliato)&#x27;,&#x27;Probability of effect&#x27;,&#x27;Temporal immediacy&#x27;,&#x27;Proximity (alla vittima)&#x27;,&#x27;Concentration of effect&#x27;];
  var MIP=[[2,4,9,9,6,3],[6,8,9,6,4,4],[3,2,4,3,2,2]];
  var MIT=[&#x27;Favoritismo lieve: costo piccolo, temporaneo e diffuso. Spesso tollerato.&#x27;,&#x27;Questione ad alta intensità: danno certo, che si accumula, considerato disonesto quasi da tutti.&#x27;,&#x27;Stessi fatti, percepiti dal gruppo: «è divertente», «nessuno se ne accorge», «è solo il bar». L\&#x27;intensità percepita crolla, e con lei la probabilità di comportarsi eticamente.&#x27;];
  var ms=$(&#x27;mislider&#x27;),mi=0,html=&#x27;&#x27;;
  MID.forEach(function(n,k){html+=&#x27;&lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;mi&#x27;+k+&#x27;&quot;&gt;&#x27;+n+&#x27;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mi&#x27;+k+&#x27;&quot; min=&quot;0&quot; max=&quot;10&quot;&gt;&lt;output id=&quot;mio&#x27;+k+&#x27;&quot;&gt;&lt;/output&gt;&lt;/div&gt;&#x27;;});
  ms.innerHTML=html;
  function miUpd(){var s=0;for(var k=0;k&lt;6;k++){var v=+$(&#x27;mi&#x27;+k).value;$(&#x27;mio&#x27;+k).textContent=v;s+=v;}
    var a=s/6;$(&#x27;miv&#x27;).textContent=a.toFixed(1);$(&#x27;mibar&#x27;).style.width=(a*10)+&#x27;%&#x27;;}
  function miSet(p){mi=p;MIP[p].forEach(function(v,k){$(&#x27;mi&#x27;+k).value=v;});$(&#x27;mitxt&#x27;).textContent=MIT[p];
    document.querySelectorAll(&#x27;[data-mi]&#x27;).forEach(function(b){b.classList.toggle(&#x27;on&#x27;,+b.dataset.mi===p);});miUpd();}
  ms.addEventListener(&#x27;input&#x27;,miUpd);
  document.querySelectorAll(&#x27;[data-mi]&#x27;).forEach(function(b){b.onclick=function(){miSet(+b.dataset.mi);};});
  miSet(0);
  // calcolatore
  function cUpd(){var p=+$(&#x27;cp&#x27;).value,g=+$(&#x27;cg&#x27;).value,w=+$(&#x27;cw&#x27;).value,s=+$(&#x27;cs&#x27;).value,t=p*g*w*s;
    $(&#x27;cpo&#x27;).textContent=p.toFixed(1)+&#x27;€&#x27;;$(&#x27;cgo&#x27;).textContent=g;$(&#x27;cwo&#x27;).textContent=w;$(&#x27;cso&#x27;).textContent=s;
    $(&#x27;ctot&#x27;).textContent=t.toLocaleString(&#x27;it-IT&#x27;,{maximumFractionDigits:0})+&#x27; €&#x27;;
    $(&#x27;cbar&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,t/2000*600));
    $(&#x27;ctxt&#x27;).textContent=g*w*s+&#x27; drink regalati. Ogni singolo giro costa &#x27;+(p*g).toFixed(0)+&#x27; €: «they will never notice», ma la somma è un\&#x27;altra cosa.&#x27;+(t&gt;2000?&#x27; (Oltre la scala del grafico.)&#x27;:&#x27;&#x27;);}
  [&#x27;cp&#x27;,&#x27;cg&#x27;,&#x27;cw&#x27;,&#x27;cs&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,cUpd);});cUpd();
  // equity
  function eUpd(){var o1=+$(&#x27;eo1&#x27;).value,i1=+$(&#x27;ei1&#x27;).value,o2=+$(&#x27;eo2&#x27;).value,i2=+$(&#x27;ei2&#x27;).value;
    [&#x27;eo1&#x27;,&#x27;ei1&#x27;,&#x27;eo2&#x27;,&#x27;ei2&#x27;].forEach(function(id){$(id+&#x27;o&#x27;).textContent=$(id).value;});
    var r1=o1/i1,r2=o2/i2,d=r1-r2,ang=Math.max(-14,Math.min(14,-d*12));
    $(&#x27;r1&#x27;).textContent=&#x27;Jenna &#x27;+r1.toFixed(2);$(&#x27;r2&#x27;).textContent=&#x27;Colleghi &#x27;+r2.toFixed(2);
    $(&#x27;beam&#x27;).setAttribute(&#x27;transform&#x27;,&#x27;rotate(&#x27;+(-ang)+&#x27; 250 100)&#x27;);
    var t;if(Math.abs(d)&lt;0.08)t=&#x27;&lt;b&gt;Equity:&lt;/b&gt; i rapporti sono simili. Nessuna tensione: nessuna spinta a «riequilibrare».&#x27;;
    else if(d&lt;0)t=&#x27;&lt;b&gt;Underpayment inequity&lt;/b&gt; (Jenna riceve meno, in proporzione): rabbia e risentimento. È la situazione che Jenna racconta, e la spinta a «riprendersi» qualcosa nasce qui.&#x27;;
    else t=&#x27;&lt;b&gt;Overpayment inequity&lt;/b&gt; (Jenna riceve più del dovuto): secondo Adams genera senso di colpa, e la persona tende a lavorare di più per compensare.&#x27;;
    $(&#x27;eqtxt&#x27;).innerHTML=t;}
  [&#x27;eo1&#x27;,&#x27;ei1&#x27;,&#x27;eo2&#x27;,&#x27;ei2&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,eUpd);});eUpd();
  // neutralization
  var NT=[[&#x27;Denial of injury&#x27;,&#x27;«Non fa male a nessuno»: se il danno non si vede, non esiste. Ma i ricavi persi sono reali (vedi il calcolatore nella sez. 4).&#x27;],
    [&#x27;Denial of the victim&#x27;,&#x27;La vittima «se lo merita»: lo sconto diventa una punizione giusta. Ma il bar come organizzazione e il manager non sono la stessa cosa.&#x27;],
    [&#x27;Condemnation of the condemners&#x27;,&#x27;Spostare l\&#x27;attenzione sulle colpe di chi potrebbe giudicarti: «sono loro gli scorretti». Il torto del manager, anche se vero, è un problema distinto.&#x27;],
    [&#x27;Appeal to higher loyalties&#x27;,&#x27;La lealtà verso l\&#x27;amica viene messa sopra la norma di onestà. Ma metterla nei guai è proprio ciò che succede se lo sconto continua.&#x27;],
    [&#x27;Denial of responsibility&#x27;,&#x27;«Non dipende da me»: è Jenna che batte il conto. Ma tu sai cosa succede e torni al banco: la scelta di accettare è tua.&#x27;],
    [&#x27;Non è una delle cinque tecniche classiche&#x27;,&#x27;È un &lt;i&gt;incentivo&lt;/i&gt; che coinvolge te: condividere il beneficio rende complici, e un complice difficilmente denuncia. Distribuire il guadagno tiene in piedi il meccanismo.&#x27;]];
  document.querySelectorAll(&#x27;#neutral [data-n]&#x27;).forEach(function(b){b.onclick=function(){var d=NT[+b.dataset.n];
    $(&#x27;nout&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+d[0]+&#x27;.&lt;/b&gt; &#x27;+d[1];
    document.querySelectorAll(&#x27;#neutral [data-n]&#x27;).forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});};});
  // opzioni Q2
  var OP=[
    [&#x27;Non fare nulla&#x27;,&#x27;Tu: continui a risparmiare, ma anche a partecipare. Jenna: il rischio cresce a ogni giro. Bar: la perdita si accumula. Amici: la pratica si allarga.&#x27;,&#x27;Conseguenze negative nel tempo; viola il dovere di non approfittare; non è da buon amico.&#x27;,&#x27;Sconsigliata&#x27;],
    [&#x27;Pagare il prezzo pieno&#x27;,&#x27;Tu: esci dalla complicità con il minimo costo. Jenna: non è esposta, ma potrebbe offendersi o continuare con altri. Bar: smette di perdere sui tuoi giri.&#x27;,&#x27;Buone conseguenze, rispetta i doveri, coerente con l\&#x27;onestà. Ma da sola non affronta il problema di Jenna.&#x27;,&#x27;Minimo indispensabile (exit)&#x27;],
    [&#x27;Parlare con Jenna&#x27;,&#x27;Tu: rischi un momento di imbarazzo. Jenna: ha l\&#x27;occasione di fermarsi prima di essere scoperta; puoi aiutarla anche sul problema del manager.&#x27;,&#x27;La più apprezzata dalla virtue ethics (onestà + vera lealtà). Funziona meglio insieme al pagare il prezzo pieno.&#x27;,&#x27;Consigliata (voice), già tentata una volta nel caso&#x27;],
    [&#x27;Smettere di andare al suo banco&#x27;,&#x27;Tu: eviti la situazione. Jenna: niente cambia per lei; può sentirsi evitata senza capire perché. Bar: la perdita continua con altri clienti.&#x27;,&#x27;Ti protegge ma lascia intatto il problema. È una exit silenziosa.&#x27;,&#x27;Accettabile come ripiego&#x27;],
    [&#x27;Dirlo al manager&#x27;,&#x27;Tu: perdi probabilmente l\&#x27;amicizia. Jenna: probabile licenziamento. Bar: il danno si ferma. Colleghi: non rischiano sospetti ingiusti.&#x27;,&#x27;Rispetta il dovere verso il bar, ma può essere sproporzionata se bastano mezzi più lievi. Il manager è proprio la persona con cui Jenna è in conflitto.&#x27;,&#x27;Ultima risorsa (voice esterna)&#x27;]];
  document.querySelectorAll(&#x27;#opts [data-o]&#x27;).forEach(function(b){b.onclick=function(){var d=OP[+b.dataset.o];
    $(&#x27;oout&#x27;).innerHTML=&#x27;&lt;h4 style=&quot;margin-top:0&quot;&gt;&#x27;+d[0]+&#x27; &lt;span class=&quot;chip&quot;&gt;&#x27;+d[3]+&#x27;&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Effetti sugli stakeholder.&lt;/b&gt; &#x27;+d[1]+&#x27;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Le tre lenti.&lt;/b&gt; &#x27;+d[2]+&#x27;&lt;/p&gt;&#x27;;
    document.querySelectorAll(&#x27;#opts [data-o]&#x27;).forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});};});
})();
&lt;/script&gt;
