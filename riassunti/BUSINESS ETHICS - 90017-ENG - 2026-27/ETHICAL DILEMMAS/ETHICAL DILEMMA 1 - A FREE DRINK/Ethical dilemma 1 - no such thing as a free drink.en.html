&lt;!-- ============ 1. IL CASO ============ --&gt;
&lt;section id=&quot;caso&quot; class=&quot;t-accent&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;The case&lt;/div&gt;
  &lt;h2&gt;A story in five steps&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; The case is an escalation: each step seems small compared with the previous one, which makes it hard to tell when the line has been crossed. Scroll through the steps.&lt;/p&gt;

  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h4&gt;Step 1 · The job&lt;/h4&gt;
      &lt;p&gt;Jenna, a friend and fellow student, has long complained about always being broke. She gets a job as a &lt;b&gt;bartender&lt;/b&gt; in the university student bar, three evenings a week. You are pleased: she is earning money, and you are a regular at the bar.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Note: there is already a potential &lt;b&gt;role conflict&lt;/b&gt;. Jenna is an employee of the bar and a friend of a customer.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Step 2 · The first favour&lt;/h4&gt;
      &lt;p&gt;When you go up to the bar, Jenna &lt;b&gt;always serves you first&lt;/b&gt;, even when other people are waiting. You are “rather pleased”.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;This is minor favouritism: the cost is borne by the other customers’ time, not the bar’s money. Question 3 starts here.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Step 3 · The discontent&lt;/h4&gt;
      &lt;p&gt;Jenna always has a new story about the &lt;b&gt;manager&lt;/b&gt;: she gets the worst shifts, she is given the least popular jobs (cleaning the toilets), and she is reprimanded for mistakes that others are forgiven for.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;You only hear her side. The account of a perceived injustice is the ground on which the justifications will grow (section 5).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Step 4 · The round of four&lt;/h4&gt;
      &lt;p&gt;You buy a round of &lt;b&gt;four drinks&lt;/b&gt; and Jenna discreetly charges you for &lt;b&gt;one&lt;/b&gt;. You feel slightly uncomfortable, but you do not want to lose the saving or get her into trouble by refusing. Your friends find it amusing and congratulate you. One of them asks you to go and order with his money. You refuse, but Jenna keeps undercharging you every time it is your round.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;The group creates &lt;b&gt;social consensus&lt;/b&gt; in favour of the behaviour: “it’s funny”. We will come back to this in section 4.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;
      &lt;h4&gt;Step 5 · The justification&lt;/h4&gt;
      &lt;p&gt;Not entirely at ease, you raise it with Jenna in private. She laughs:&lt;/p&gt;
      &lt;blockquote&gt;“Yeah, it is great isn&#x27;t it? They will never notice, and you get a cheap night out. Besides, it is only what this place deserves after the way I have been treated.”&lt;/blockquote&gt;
      &lt;p class=&quot;small&quot;&gt;Three sentences, three different justifications: nobody notices, you benefit too, they deserve it. We analyse them in section 5.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;small&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The four questions of the lecture&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; This page follows the questions in a logical order (first &lt;i&gt;who&lt;/i&gt;, then &lt;i&gt;how much&lt;/i&gt;, then &lt;i&gt;why&lt;/i&gt;, and finally &lt;i&gt;what to do&lt;/i&gt;), not in the order of the PDF.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q1 → sec. 3&lt;/span&gt;&lt;h4&gt;Who is wrong?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Jenna for undercharging you, you for accepting it, both of you or neither?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q2 → sec. 6&lt;/span&gt;&lt;h4&gt;What would you do?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Nothing, or ask Jenna to stop? And what if she refuses?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q3 → sec. 4&lt;/span&gt;&lt;h4&gt;Favour or theft?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How different is being deliberately &lt;i&gt;undercharged&lt;/i&gt; from being served before other customers?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q4 → sec. 5&lt;/span&gt;&lt;h4&gt;Does the grievance excuse her?&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Does the fact that Jenna feels mistreated &lt;i&gt;condone&lt;/i&gt; her behaviour? Does it help to explain her actions or yours?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;What is an ethical dilemma?&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; An &lt;span class=&quot;term&quot;&gt;ethical dilemma&lt;/span&gt; is a situation in which a choice must be made and every option puts different values at stake. Here, on one side, there is &lt;b&gt;loyalty to a friend&lt;/b&gt;, a quiet life and the saving. On the other, there is &lt;b&gt;honesty&lt;/b&gt;, respect for other people’s property and fairness towards other customers. The case has no “right answer” written in the slides: its purpose is to train your reasoning.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;At which step does the behaviour change in nature?&lt;/summary&gt;&lt;p&gt;At step 4. Serving you first costs the other customers only a little time. Undercharging takes money from the bar, that is, from a third party who has not consented. It moves from favouritism to the appropriation of someone else’s resources.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does it matter that the protagonist feels “slightly uncomfortable”?&lt;/summary&gt;&lt;p&gt;Because the discomfort is a sign of &lt;i&gt;moral awareness&lt;/i&gt;: you have recognised that there is an ethical issue. The dilemma arises precisely because, despite this, the incentives (the saving, the friendship, your friends’ approval) push you towards doing nothing.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What role do the friends who congratulate you play?&lt;/summary&gt;&lt;p&gt;They create a group norm that normalises the behaviour (“it’s funny”) and raise the social cost of saying no. One of them even asks to use you as an intermediary: the behaviour tends to spread.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2. STAKEHOLDER ============ --&gt;
&lt;section id=&quot;stakeholder&quot; class=&quot;t-sage&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Who is involved&lt;/div&gt;
  &lt;h2&gt;The stakeholders of the free round&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; A &lt;span class=&quot;term&quot;&gt;stakeholder&lt;/span&gt; is anyone with an interest at stake in a decision, either because they are affected by it or because they can influence it. Listing them is the first step towards seeing that “it doesn’t hurt anyone” is almost never true. Tap a person in the diagram.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the stakeholders around the bar counter&quot; id=&quot;stakesvg&quot;&gt;
      &lt;g stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.5&quot;&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;120&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;520&quot; y2=&quot;70&quot;/&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;100&quot; y2=&quot;250&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;540&quot; y2=&quot;250&quot;/&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;320&quot; y2=&quot;290&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;165&quot; x2=&quot;320&quot; y2=&quot;40&quot;/&gt;
      &lt;/g&gt;
      &lt;circle cx=&quot;320&quot; cy=&quot;165&quot; r=&quot;54&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;320&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-family=&quot;Newsreader,serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;The bill&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;4 drinks → 1&lt;/text&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;jenna&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;120&quot; cy=&quot;70&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Jenna&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;tu&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;520&quot; cy=&quot;70&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;You&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;amici&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;100&quot; cy=&quot;250&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Friends&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;bar&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;540&quot; cy=&quot;250&quot; r=&quot;40&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Bar /&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;264&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;university&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;manager&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;290&quot; r=&quot;36&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;295&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Manager&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;sk&quot; data-k=&quot;clienti&quot; tabindex=&quot;0&quot; role=&quot;button&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;40&quot; r=&quot;34&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Other&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;customers&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Every node is clickable. The border colour shows who gains (terracotta), who is complicit (ochre) and who loses (brick and slate).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;box plain&quot; id=&quot;skout&quot; aria-live=&quot;polite&quot;&gt;&lt;b&gt;Tap a stakeholder&lt;/b&gt; to see what they gain, what they risk and what duty they have.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;“They will never notice”: why does this not mean “nobody loses out”?&lt;/summary&gt;&lt;p&gt;The fact that the harm is not visible does not mean it does not exist. The bar loses revenue with every round, and if it is run by the university or the students’ union, the loss also falls on the students. Moreover, if the shortfalls come to light, suspicion may fall on innocent colleagues.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Who has the most to lose if it is discovered?&lt;/summary&gt;&lt;p&gt;Jenna: she loses her job and may face disciplinary or legal consequences. This is also why “not getting her into trouble” is an ambiguous argument: continuing to accept puts her in bigger trouble.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. CHI SBAGLIA ============ --&gt;
&lt;section id=&quot;chi&quot; class=&quot;t-slate&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Question 1&lt;/div&gt;
  &lt;h2&gt;Who is wrong: Jenna, you, both or neither?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; “Who is wrong in this situation, Jenna for undercharging you, you for accepting it, both of you, or neither of you?”&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; To answer well you need a criterion. Normative ethics offers three main families of criteria, which business ethics textbooks use as &lt;b&gt;lenses&lt;/b&gt;: they look at the same fact from different standpoints. A good exam answer compares them rather than simply picking one.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Consequentialism&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Deontology&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue ethics&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Consequentialism&lt;/b&gt;: an action is right if it produces the best consequences. The best-known version is &lt;span class=&quot;term&quot;&gt;utilitarianism&lt;/span&gt; (Bentham and Mill): maximise the overall welfare of &lt;i&gt;everyone&lt;/i&gt; involved, with each person counting equally.&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Guiding question:&lt;/b&gt; adding up benefits and costs for all stakeholders, is the result positive?&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Applied to the case:&lt;/b&gt; the benefits are concentrated and visible (you and your friends save money, Jenna feels avenged). The costs are diffuse but real: lost revenue for the bar, a very high risk for Jenna if she is caught, possible suspicion falling on colleagues, and a habit of wrongdoing that spreads (the friend who wants to use you). Once risks and long-term effects are counted, the balance tends to be negative.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Limitation:&lt;/b&gt; if the bar really “will never notice” and the harm is minimal, a strict calculation might say it is acceptable. This is the classic criticism: utilitarianism can justify small, hidden injustices.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Typical verdict:&lt;/b&gt; both are wrong, because both produce the harm. Jenna commits it; you make it possible and repeat it.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Deontology&lt;/b&gt; (duty-based ethics): an action is right if it respects a duty or a rule, regardless of the consequences. The key reference is Kant and the &lt;span class=&quot;term&quot;&gt;categorical imperative&lt;/span&gt;.&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Two Kantian tests:&lt;/b&gt;&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;b&gt;Universalisability:&lt;/b&gt; “act only according to that maxim whereby you can at the same time will that it should become a universal law”. If &lt;i&gt;every&lt;/i&gt; bartender undercharged their friends, prices would lose their meaning and no bar could trust its staff. The maxim defeats itself.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Humanity as an end:&lt;/b&gt; do not treat people merely as means. The employer entrusted Jenna with the till on the basis of an agreement. Using that trust for other purposes treats the employer as a mere means.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p&gt;&lt;b&gt;Duties at stake:&lt;/b&gt; Jenna’s role-based duty towards her employer (honesty, fair dealing). Your duty not to take advantage of what you know is not yours. The duty towards a friend exists, but it does not include helping her do something wrong.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Typical verdict:&lt;/b&gt; both are wrong. The injustice Jenna has suffered (if real) does not cancel the duty: two wrongs do not make a right.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Virtue ethics&lt;/b&gt;: what matters is &lt;i&gt;character&lt;/i&gt;. The question is not “which rule?” but “what kind of person am I becoming?”. It goes back to Aristotle: virtues (honesty, justice, courage, loyalty) are formed through habit.&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Guiding question:&lt;/b&gt; what would an honest person &lt;i&gt;and&lt;/i&gt; a good friend do?&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Applied to the case:&lt;/b&gt; loyalty is a virtue, but it becomes a vice when it covers up dishonesty. A good friend does not take advantage of Jenna and does not let her slide into behaviour that could cost her the job. The discomfort you feel is precisely the sign of a character that “senses” the problem. Every round you accept is a habit that dulls it.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Typical verdict:&lt;/b&gt; both are wrong. In addition, this lens highlights your &lt;i&gt;role as a friend&lt;/i&gt;: you have the opportunity to help Jenna, not merely to avoid doing wrong yourself.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Degrees of responsibility&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; “Both are wrong” does not mean “equally wrong”. Responsibility comes in degrees: the one who acts, the one who knowingly benefits, the one who encourages, the one who created the context.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Scale of degrees of responsibility&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gr&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--slate-bg)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;rect x=&quot;30&quot; y=&quot;70&quot; width=&quot;640&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;url(#gr)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;110&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;bystander&lt;/text&gt;
      &lt;text x=&quot;670&quot; y=&quot;110&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;perpetrator&lt;/text&gt;
      &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;
        &lt;circle cx=&quot;210&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Manager&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;context (possibly unfair)&lt;/text&gt;
        &lt;circle cx=&quot;340&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Friends&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;encourage&lt;/text&gt;
        &lt;circle cx=&quot;480&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;You&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;knowing beneficiary&lt;/text&gt;
        &lt;circle cx=&quot;620&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Jenna&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;performs the act&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;One possible reading, not the only one. A knowing, repeated beneficiary comes very close to the perpetrator: without your rounds, the trick would have no recipient.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details&gt;&lt;summary&gt;But I didn’t ask for anything: is accepting really “doing”?&lt;/summary&gt;
    &lt;p&gt;This is the distinction between &lt;span class=&quot;term&quot;&gt;acts&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;omissions&lt;/span&gt;. The first time, surprise may mitigate the blame. But the case says it continues “for a number of visits”: going back to the bar knowing what will happen is a repeated choice. Moreover, you are the only one who can stop it at no cost to Jenna: you simply have to pay the full price.&lt;/p&gt;
  &lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What about the “neither is wrong” option?&lt;/summary&gt;
    &lt;p&gt;To defend it, you would have to argue either that the bar suffers no real harm, or that the injustice Jenna has suffered makes the discount a form of fair compensation. Both claims are weak: the first is undermined by the stakeholder analysis (sec. 2), the second by the analysis of question 4 (sec. 5).&lt;/p&gt;
  &lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Apply the universalisability test to Jenna’s maxim.&lt;/summary&gt;&lt;p&gt;Maxim: “when I feel mistreated by my employer, I may give away their goods to my friends”. Universalised, no employer could entrust goods to employees, and the very idea of an employment relationship based on trust would collapse. The maxim does not hold.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why might a utilitarian find this case difficult?&lt;/summary&gt;&lt;p&gt;Because if the harm really is small and nobody finds out, the immediate balance looks positive (the friends’ happiness &gt; the bar’s small loss). The utilitarian must then count risks, effects over time and the erosion of trust. Or switch to &lt;i&gt;rule utilitarianism&lt;/i&gt;: evaluate the rule “bartenders give their friends discounts”, whose general consequences are clearly negative.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does virtue ethics add to the other two lenses?&lt;/summary&gt;&lt;p&gt;It shifts attention from the single act to character and relationships. It asks what kind of friend you want to be, and shows that loyalty without honesty becomes complicity.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4. FAVORE O FURTO ============ --&gt;
&lt;section id=&quot;favori&quot; class=&quot;t-ochre&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Question 3&lt;/div&gt;
  &lt;h2&gt;Serving you first or charging you less: what is the difference?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; “To what extent do you think that being deliberately undercharged is different from other forms of preferential treatment, such as Jenna serving you in front of other waiting customers?”&lt;/p&gt;

  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Serving you first&lt;/th&gt;&lt;th&gt;Charging you for 1 drink in 4&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Who bears the cost&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The other customers, in waiting time&lt;/td&gt;&lt;td&gt;The bar (the employer), in money&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Resource used&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Jenna’s attention, over which she has discretion&lt;/td&gt;&lt;td&gt;The bar’s goods and prices, which Jenna does &lt;i&gt;not&lt;/i&gt; own&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Visibility&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Public: everyone can see&lt;/td&gt;&lt;td&gt;Hidden: “discreetly”, “they will never notice”&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Reversibility&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The harm disappears within minutes&lt;/td&gt;&lt;td&gt;The harm accumulates with every round&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rules&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Breaks a social norm (queuing)&lt;/td&gt;&lt;td&gt;Breaks the rules of the employment relationship and potentially the law&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Social consensus&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Widely tolerated among friends&lt;/td&gt;&lt;td&gt;Widely judged dishonest (outside your group)&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Both are &lt;span class=&quot;term&quot;&gt;preferential treatment&lt;/span&gt; and share the same structure: a personal relationship intrudes into a professional role that ought to be impartial. What changes is the &lt;b&gt;intensity&lt;/b&gt;. A good way to measure it is Jones’s model.&lt;/p&gt;

  &lt;h3&gt;Moral intensity: measuring how much an issue “weighs”&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; Thomas M. Jones (1991) proposed that the likelihood of recognising an issue as a moral one, and of behaving ethically, depends on the characteristics of the &lt;i&gt;issue itself&lt;/i&gt;. He called this &lt;span class=&quot;term&quot;&gt;moral intensity&lt;/span&gt; and divided it into six dimensions. The model is often used in business ethics textbooks to explain why people underestimate “minor” wrongdoing.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Magnitude of consequences&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How much total harm (or benefit).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social consensus&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How far people agree that it is wrong.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Probability of effect&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How likely it is that the harm will actually occur.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Temporal immediacy&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How soon the consequences arrive.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Proximity&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How close one feels to those who are harmed.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Concentration of effect&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How far the harm falls on a few rather than being spread over many.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box plain&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;p&gt;&lt;b&gt;Workshop.&lt;/b&gt; Choose a behaviour and adjust the six dimensions (0 = low, 10 = high). The initial values are a reasoned and debatable estimate: move them and watch the index.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot; style=&quot;margin:0 0 .6rem&quot;&gt;&lt;button class=&quot;btn on&quot; data-mi=&quot;0&quot;&gt;Serving you first&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mi=&quot;1&quot;&gt;Undercharging 4→1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mi=&quot;2&quot;&gt;Undercharging, as seen by your group&lt;/button&gt;&lt;/div&gt;
    &lt;div id=&quot;mislider&quot;&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-top:.8rem&quot;&gt;Moral intensity index: &lt;span class=&quot;big&quot; id=&quot;miv&quot;&gt;–&lt;/span&gt;&lt;span class=&quot;small&quot;&gt; / 10&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;i id=&quot;mibar&quot; style=&quot;width:0&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot; id=&quot;mitxt&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;The index is a simple average for teaching purposes: Jones does not propose a numerical formula.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;The third preset shows the key point of the case: &lt;b&gt;the same facts&lt;/b&gt;, seen by the group that offers congratulations (high consensus in favour, harm “nobody notices”, a distant and impersonal victim), have a much lower perceived intensity. This is why the protagonist is only “slightly uncomfortable”.&lt;/p&gt;

  &lt;h3&gt;“But it’s only a few drinks”: what is it really worth?&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; The &lt;i&gt;magnitude of consequences&lt;/i&gt; is underestimated when the harm is broken into small pieces. Try adding it up.&lt;/p&gt;
  &lt;div class=&quot;box plain&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cp&quot;&gt;Price of a drink&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cp&quot; min=&quot;2&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;cpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cg&quot;&gt;Unpaid drinks per round&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cg&quot; min=&quot;1&quot; max=&quot;6&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;cgo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cw&quot;&gt;“Discounted” rounds per week&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cw&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;cwo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;cs&quot;&gt;Weeks (one semester ≈ 14)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cs&quot; min=&quot;1&quot; max=&quot;40&quot; value=&quot;14&quot;&gt;&lt;output id=&quot;cso&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p&gt;Loss to the bar: &lt;span class=&quot;big&quot; id=&quot;ctot&quot;&gt;–&lt;/span&gt;&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 600 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;600&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect id=&quot;cbar&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;0&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;0&quot; y=&quot;66&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;€0&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;66&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--ink2)&quot;&gt;€2,000&lt;/text&gt;&lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;ctxt&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the decisive difference between the two favours?&lt;/summary&gt;&lt;p&gt;With the first, Jenna uses a resource over which she has some latitude (the order in which she serves). With the second, she uses goods that belong to her employer, covertly and repeatedly. The first is discourteous to the other customers; the second is an appropriation of someone else’s value.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which two of Jones’s dimensions are artificially “lowered” by the context of the case?&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Social consensus&lt;/b&gt; (the friends approve and find it amusing) and &lt;b&gt;proximity&lt;/b&gt; (the victim is an impersonal organisation, “this place”). To these we can add a low &lt;i&gt;concentration of effect&lt;/i&gt;: the loss is diluted.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is “minor” favouritism harmless?&lt;/summary&gt;&lt;p&gt;Not entirely: it is unfair to the other customers. Moreover, the case shows that it is often the first step on a &lt;i&gt;slippery slope&lt;/i&gt;: once you accept that friendship can bend the rules of a role, the next step seems less serious.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5. IL TORTO SUBITO ============ --&gt;
&lt;section id=&quot;torto&quot; class=&quot;t-brick&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Question 4&lt;/div&gt;
  &lt;h2&gt;Does the grievance justify Jenna?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; “Does the fact that Jenna feels aggrieved at the treatment she receives from her boss condone her behaviour? Does it help to explain either her actions or your actions?”&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;The key to the question: explaining ≠ justifying.&lt;/b&gt; The question separates two verbs. To &lt;i&gt;condone&lt;/i&gt; means to excuse, to make acceptable. To &lt;i&gt;explain&lt;/i&gt; means to understand the causes. Jenna’s resentment &lt;b&gt;explains&lt;/b&gt; very well why she acts as she does, but it does not &lt;b&gt;make it right&lt;/b&gt;: the bar has not agreed to pay for the manager’s behaviour, and giving drinks away does not redress the wrong, neither for her nor for her colleagues.&lt;/div&gt;

  &lt;h3&gt;Explaining: equity theory&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; According to J. Stacy Adams’s &lt;span class=&quot;term&quot;&gt;equity theory&lt;/span&gt;, each person compares the ratio between what they &lt;i&gt;receive&lt;/i&gt; from their job (&lt;span class=&quot;term&quot;&gt;outcomes&lt;/span&gt;: pay, shifts, respect) and what they &lt;i&gt;give&lt;/i&gt; (&lt;span class=&quot;term&quot;&gt;inputs&lt;/span&gt;: effort, time, skills) with the same ratio for a referent colleague.&lt;/p&gt;
  &lt;div class=&quot;box plain&quot; style=&quot;text-align:center;font-family:var(--serif);font-size:1.3rem&quot;&gt;
    O&lt;sub&gt;Jenna&lt;/sub&gt; / I&lt;sub&gt;Jenna&lt;/sub&gt; &amp;nbsp; vs &amp;nbsp; O&lt;sub&gt;colleagues&lt;/sub&gt; / I&lt;sub&gt;colleagues&lt;/sub&gt;
    &lt;div class=&quot;small&quot; style=&quot;font-family:var(--sans)&quot;&gt;If the first ratio is lower → &lt;b&gt;underpayment inequity&lt;/b&gt; → tension → drive to “restore the balance”&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box plain&quot;&gt;
    &lt;p&gt;&lt;b&gt;Interactive scale.&lt;/b&gt; Worse shifts and reprimands reduce Jenna’s &lt;i&gt;outcomes&lt;/i&gt; relative to her colleagues.&lt;/p&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;eo1&quot;&gt;Jenna’s outcomes&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eo1&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;eo1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;ei1&quot;&gt;Jenna’s inputs&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ei1&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ei1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;eo2&quot;&gt;Colleagues’ outcomes&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eo2&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;eo2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;ei2&quot;&gt;Colleagues’ inputs&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ei2&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ei2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 500 190&quot; aria-label=&quot;Equity scale&quot;&gt;
      &lt;polygon points=&quot;250,170 235,190 265,190&quot; fill=&quot;var(--ink2)&quot;/&gt;
      &lt;g id=&quot;beam&quot; style=&quot;transition:transform .3s&quot;&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;100&quot; x2=&quot;430&quot; y2=&quot;100&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;250&quot; y1=&quot;100&quot; x2=&quot;250&quot; y2=&quot;170&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;75&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; id=&quot;r1&quot;&gt;Jenna&lt;/text&gt;
        &lt;rect x=&quot;370&quot; y=&quot;62&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;425&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; id=&quot;r2&quot;&gt;Colleagues&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;eqtxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;To reduce the tension, the theory predicts several routes: reducing effort, asking for more, changing the comparison referent, leaving. Or &lt;b&gt;taking for oneself what one believes is owed&lt;/b&gt;. Jerald Greenberg (1990) observed this in the field: in plants where pay had been temporarily cut, employee theft increased, and it increased less where the cut had been explained carefully and respectfully. Jenna’s discount is a textbook case of this kind of “rebalancing”.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Note: the theory describes what people tend to do, not what is right to do. It is a tool for &lt;i&gt;explaining&lt;/i&gt;, consistent with question 4.&lt;/p&gt;

  &lt;h3&gt;The excuses we tell ourselves: techniques of neutralization&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; The sociologists Gresham Sykes and David Matza (1957) noted that people who break a norm usually &lt;i&gt;share&lt;/i&gt; it, but “neutralize” it with justifications that silence their sense of guilt. They called these &lt;span class=&quot;term&quot;&gt;techniques of neutralization&lt;/span&gt;. Tap a sentence to see which technique it uses.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; id=&quot;neutral&quot;&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;0&quot;&gt;Jenna: “They will never notice”&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;1&quot;&gt;Jenna: “It is only what this place deserves”&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;2&quot;&gt;Jenna: “…after the way I have been treated”&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;3&quot;&gt;You: “I don’t want to get her into trouble”&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;4&quot;&gt;You: “I’m not the one ringing up the bill”&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-n=&quot;5&quot;&gt;Jenna: “…and you get a cheap night out”&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot; id=&quot;nout&quot; aria-live=&quot;polite&quot;&gt;The five classic techniques: &lt;b&gt;denial of responsibility&lt;/b&gt;, &lt;b&gt;denial of injury&lt;/b&gt;, &lt;b&gt;denial of the victim&lt;/b&gt;, &lt;b&gt;condemnation of the condemners&lt;/b&gt;, &lt;b&gt;appeal to higher loyalties&lt;/b&gt;.&lt;/div&gt;

  &lt;h3&gt;Does it also explain your actions?&lt;/h3&gt;
  &lt;p&gt;Partly, yes: the story of mistreatment makes you &lt;b&gt;more sympathetic&lt;/b&gt; and therefore less inclined to say no. But you have suffered no wrong at the hands of the bar: for you, Jenna’s resentment is not even an explanation; at most it is a borrowed alibi. And remember that you know &lt;b&gt;only one version&lt;/b&gt; of the facts: you do not know whether the manager really is unfair.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between “condone” and “explain”?&lt;/summary&gt;&lt;p&gt;&lt;i&gt;Explain&lt;/i&gt;: identify the causes of a behaviour (resentment, a sense of inequity). &lt;i&gt;Condone&lt;/i&gt;: regard it as acceptable or forgivable. A behaviour can be explained without being excused: this is the most robust answer to question 4.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;According to equity theory, what legitimate alternatives did Jenna have?&lt;/summary&gt;&lt;p&gt;Talking to the manager or to their superior, asking for fair shifts, documenting the unequal treatment, turning to student or worker representatives, or looking for another job. All of these reduce the inequity without harming third parties.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;“They will never notice”: which technique of neutralization is this?&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Denial of injury&lt;/b&gt;: if nobody notices, “there is no harm”. But hidden harm is still harm.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does the wrong Jenna has suffered make it “legitimate” for you to benefit too?&lt;/summary&gt;&lt;p&gt;No. Even on the reading most favourable to Jenna, she suffered the wrong, not you. Your benefit repairs nothing and transfers value from the bar to you.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6. COSA FARE ============ --&gt;
&lt;section id=&quot;agire&quot; class=&quot;t-accent&quot;&gt;
  &lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;
  &lt;div class=&quot;kicker&quot;&gt;Question 2&lt;/div&gt;
  &lt;h2&gt;What would you do? And what if she refuses?&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;from the slides&lt;/span&gt; “Confronted by this situation, how would you handle it? Do nothing, or ask Jenna to stop undercharging you? If you take the latter option, what would you do if she refused?”&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src add&quot;&gt;supplement&lt;/span&gt; A useful way to organise the options is Albert O. Hirschman’s framework: when faced with something that is wrong, one can choose &lt;span class=&quot;term&quot;&gt;exit&lt;/span&gt; (leaving, withdrawing) or &lt;span class=&quot;term&quot;&gt;voice&lt;/span&gt; (speaking up to change things). &lt;span class=&quot;term&quot;&gt;Loyalty&lt;/span&gt; influences which route is taken. Here, loyalty to Jenna pushes towards silence. Choose an option:&lt;/p&gt;

  &lt;div class=&quot;ctrl&quot; id=&quot;opts&quot; style=&quot;margin-bottom:.5rem&quot;&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;0&quot;&gt;Do nothing&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;1&quot;&gt;Pay the full price&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;2&quot;&gt;Talk to Jenna&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;3&quot;&gt;Stop going to her side of the bar&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-o=&quot;4&quot;&gt;Tell the manager&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot; id=&quot;oout&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;small&quot;&gt;Each option shows what happens to each stakeholder and how the three lenses of section 3 judge it.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;If Jenna refuses: an escalation ladder&lt;/h3&gt;
  &lt;p&gt;The protagonist has already taken the first step, and she “just laughs it off”. Responses should be measured: start with the means least costly to the relationship, and move up only if necessary.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Four-step escalation ladder&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;200&quot; width=&quot;150&quot; height=&quot;50&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · Refuse yourself&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;pay the full bill&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;150&quot; width=&quot;150&quot; height=&quot;100&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · Explain why&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;the risk to her,&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;not a lecture&lt;/text&gt;
        &lt;rect x=&quot;320&quot; y=&quot;100&quot; width=&quot;150&quot; height=&quot;150&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;395&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · Offer help&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;with the real problem:&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;the manager, the shifts&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;50&quot; width=&quot;150&quot; height=&quot;200&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;4 · Step back&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;stop taking part;&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;consider reporting it&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M40 40 L600 20&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;text x=&quot;40&quot; y=&quot;30&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;cost to the relationship and effectiveness both increase&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;Step 1 is always possible, even if she refuses&lt;/summary&gt;&lt;p&gt;You do not need Jenna’s permission to pay the full price: you can state the exact number of drinks, put down the right amount of money, or order from a colleague. This is the point over which you have full control. And it removes your share of the responsibility without exposing Jenna.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What about reporting it to the manager?&lt;/summary&gt;&lt;p&gt;This is the harshest option: it protects the bar, but it will probably cost Jenna her job and you the friendship. An argument in favour: the harm continues and is spreading (the friends). An argument against: it is disproportionate if simply ceasing to take part would suffice. Many see it as a last resort, if the behaviour escalates or if there is a risk that the blame will fall on innocent colleagues. There is no single answer: what matters is justifying your choice.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;How should you respond to your friends?&lt;/summary&gt;&lt;p&gt;Refusing the role of intermediary (as the protagonist already does) is consistent. Giving a simple explanation (“we’re getting her into trouble”) shifts the issue from moralising to concern for Jenna, and is easier for the group to accept.&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is “doing nothing” not a neutral choice?&lt;/summary&gt;&lt;p&gt;Because leaving things as they are means continuing to receive underpriced drinks: here, silence is participation. And the situation tends to get worse (more friends, more rounds).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Exit or voice: which one is “paying the full price”?&lt;/summary&gt;&lt;p&gt;It is mainly a form of &lt;b&gt;exit&lt;/b&gt;: you leave the mechanism without trying to change it. Talking to Jenna, or to the manager, is &lt;b&gt;voice&lt;/b&gt;. The best response often combines the two: exit straight away and speak up at the same time.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the most effective argument for persuading Jenna?&lt;/summary&gt;&lt;p&gt;One that starts from her own interests: she is risking her job and her reputation for a few drinks, and in doing so she undermines her own position in the dispute with the manager. If she is caught, nobody will listen to her complaints about unfair treatment any more.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SINTESI ============ --&gt;
&lt;section class=&quot;t-sage&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Summary&lt;/div&gt;
  &lt;h2&gt;The exam answer in four lines&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q1&lt;/span&gt;&lt;p&gt;Both are wrong, to different degrees: Jenna as the perpetrator, you as a knowing and repeated beneficiary. The three ethical lenses (consequentialism, deontology, virtue ethics) reach the same conclusion here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q2&lt;/span&gt;&lt;p&gt;Paying the full price is always possible and settles your part. Talk to Jenna, starting from her own interest. If she refuses, step back; report it only as a last resort, justifying the choice.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q3&lt;/span&gt;&lt;p&gt;Same structure (preferential treatment), different intensity: the discount uses someone else’s goods, is hidden and accumulates. Moral intensity is high, but the group makes it &lt;i&gt;seem&lt;/i&gt; low.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Q4&lt;/span&gt;&lt;p&gt;The grievance &lt;b&gt;explains&lt;/b&gt; (equity theory, techniques of neutralization) but does not &lt;b&gt;justify&lt;/b&gt;. And for you it is not even an explanation: it is a borrowed alibi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;t-ochre&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Texts, studies and laws&lt;/h2&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Important note.&lt;/b&gt; The slides for this lecture &lt;b&gt;do not cite any authors, studies, texts, laws or websites&lt;/b&gt;: they contain only the case and the questions. The entries below are the sources of the concepts used above as a &lt;i&gt;supplement&lt;/i&gt;. All bibliographic details come from the web and are marked as &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;. It was not possible to consult the other files in the corso/ folder (lectures, syllabus), so I do not know which of these texts are already part of the course: check the syllabus.&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;A. Crane, D. Matten, S. Glozer, L. Spence, &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;, 5th edn, Oxford University Press, 2019 (ISBN 9780198810070)&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; a standard business ethics textbook covering normative ethical theories, ethical decision-making and stakeholders, with chapters devoted to employees, consumers, suppliers and civil society. Each chapter includes “Ethical dilemma” boxes. &lt;b&gt;Why it matters:&lt;/b&gt; the format of the slide (“ETHICAL DILEMMA 1”, numbered questions) matches these boxes, so this is very probably the book the case comes from. This attribution is inferred; it is not stated in the slides.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://india.oup.com/product/business-ethics-9780198828792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher’s page (Oxford University Press, international edition)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Stanford Encyclopedia of Philosophy: “Consequentialism”, “Kant&#x27;s Moral Philosophy”, “Virtue Ethics”&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; three academic encyclopaedia entries, periodically revised. They cover the three lenses of section 3: consequences as the sole criterion, the categorical imperative, and the centrality of character (the entry on virtue ethics is by R. Hursthouse and G. Pettigrove). &lt;b&gt;Why it matters:&lt;/b&gt; it is the most reliable free source for checking definitions and classic objections.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/consequentialism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consequentialism&lt;/a&gt; · &lt;a href=&quot;https://plato.stanford.edu/entries/kant-moral/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kant&#x27;s Moral Philosophy&lt;/a&gt; · &lt;a href=&quot;https://plato.stanford.edu/entries/ethics-virtue/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Virtue Ethics&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;T. M. Jones, “Ethical Decision Making by Individuals in Organizations: An Issue-Contingent Model”, &lt;i&gt;Academy of Management Review&lt;/i&gt;, 16(2), 1991, pp. 366–395&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; introduces &lt;i&gt;moral intensity&lt;/i&gt; and its six dimensions, which influence the four stages of ethical behaviour (recognising the issue, making a judgement, forming an intention, acting). Later studies identify &lt;i&gt;social consensus&lt;/i&gt; and &lt;i&gt;magnitude of consequences&lt;/i&gt; as the most influential dimensions. &lt;b&gt;Why it matters:&lt;/b&gt; it explains why favouritism and the discount “feel” different (sec. 4) and why the group of friends lowers the perception of the problem.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1991.4278958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt; · &lt;a href=&quot;https://sk.sagepub.com/ency/edvol/embed/sage-encyclopedia-of-business-ethics-and-society-2e/chpt/moral-intensity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Moral intensity” entry, SAGE Encyclopedia of Business Ethics and Society&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;J. S. Adams, “Inequity in Social Exchange”, in L. Berkowitz (ed.), &lt;i&gt;Advances in Experimental Social Psychology&lt;/i&gt;, vol. 2, Academic Press, 1965, pp. 267–299&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; the full formulation of equity theory: the comparison of outcome/input ratios, tension proportional to the inequity, and the strategies for reducing it. It is a general framework for social exchange, not only for employment. &lt;b&gt;Why it matters:&lt;/b&gt; it is the tool for &lt;i&gt;explaining&lt;/i&gt; Jenna’s behaviour (sec. 5).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1016/S0065-2601(08)60108-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Chapter DOI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;J. Greenberg, “Employee Theft as a Reaction to Underpayment Inequity: The Hidden Cost of Pay Cuts”, &lt;i&gt;Journal of Applied Psychology&lt;/i&gt;, 75(5), 1990, pp. 561–568&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; a field study in manufacturing plants following a temporary pay cut. Employee theft increases, and the increase is smaller when the cut is explained adequately and respectfully. &lt;b&gt;Why it matters:&lt;/b&gt; it is empirical evidence that a sense of injustice can translate into appropriation at the employer’s expense, just as with Jenna. It also shows that the &lt;i&gt;way&lt;/i&gt; an organisation treats people matters (organizational justice).&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1037/0021-9010.75.5.561&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;G. M. Sykes, D. Matza, “Techniques of Neutralization: A Theory of Delinquency”, &lt;i&gt;American Sociological Review&lt;/i&gt;, 22(6), 1957&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; originally developed to explain juvenile delinquency, it proposes that those who break a norm share it but “neutralize” it with five techniques: denial of responsibility, denial of injury, denial of the victim, condemnation of the condemners, appeal to higher loyalties. Later studies note that the list is not exhaustive and that the empirical support is mixed. &lt;b&gt;Why it matters:&lt;/b&gt; Jenna’s remarks (and the protagonist’s thoughts) are almost perfect examples of these techniques.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://study.sagepub.com/system/files/Sykes,_Gresham_M.,_and_David_Matza_-_Techniques_of_Neutralization.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Full text of the article (SAGE teaching materials)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Techniques_of_neutralization&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Overview on Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;A. O. Hirschman, &lt;i&gt;Exit, Voice, and Loyalty: Responses to Decline in Firms, Organizations, and States&lt;/i&gt;, Harvard University Press, 1970&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; distinguishes two responses to dissatisfaction with an organisation: &lt;i&gt;exit&lt;/i&gt; (leaving, switching supplier) and &lt;i&gt;voice&lt;/i&gt; (trying to change things from within). &lt;i&gt;Loyalty&lt;/i&gt; delays exit and makes room for voice. &lt;b&gt;Why it matters:&lt;/b&gt; it provides a vocabulary for organising the options in question 2 (sec. 6). It also applies to Jenna: faced with the manager, she had exit and voice available, and chose a third way, covert retaliation.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://casbs.stanford.edu/exit-voice-and-loyalty-responses-decline-firms-organizations-and-states&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book page (Stanford CASBS)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Italian Civil Code, Art. 2105 “Duty of loyalty” (with Arts. 1175 and 1375 on fair dealing and good faith)&lt;/h4&gt;
    &lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; under Italian law, an employee must not compete with the employer or disclose the employer’s information. Case law interprets this duty broadly, supplemented by the general duties of fair dealing and good faith. &lt;b&gt;Why it matters:&lt;/b&gt; it shows that the “role-based duty” of the deontological lens has a legal counterpart. The case is set in an English-speaking context, so this is only a parallel: the actual legal characterisation (disciplinary or criminal) depends on the facts and should not be taken for granted.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-ii/capo-i/sezione-iii/art2105.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2105 of the Civil Code on Brocardi.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

  function cUpd(){var p=+$(&#x27;cp&#x27;).value,g=+$(&#x27;cg&#x27;).value,w=+$(&#x27;cw&#x27;).value,s=+$(&#x27;cs&#x27;).value,t=p*g*w*s;
    $(&#x27;cpo&#x27;).textContent=&#x27;€&#x27;+p.toFixed(1);$(&#x27;cgo&#x27;).textContent=g;$(&#x27;cwo&#x27;).textContent=w;$(&#x27;cso&#x27;).textContent=s;
    $(&#x27;ctot&#x27;).textContent=&#x27;€&#x27;+t.toLocaleString(&#x27;en-GB&#x27;,{maximumFractionDigits:0});
    $(&#x27;cbar&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,t/2000*600));
    $(&#x27;ctxt&#x27;).textContent=g*w*s+&#x27; drinks given away. Each single round costs €&#x27;+(p*g).toFixed(0)+&#x27;: “they will never notice”, but the total is another matter.&#x27;+(t&gt;2000?&#x27; (Beyond the scale of the chart.)&#x27;:&#x27;&#x27;);}
  [&#x27;cp&#x27;,&#x27;cg&#x27;,&#x27;cw&#x27;,&#x27;cs&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,cUpd);});cUpd();
  // equity
  function eUpd(){var o1=+$(&#x27;eo1&#x27;).value,i1=+$(&#x27;ei1&#x27;).value,o2=+$(&#x27;eo2&#x27;).value,i2=+$(&#x27;ei2&#x27;).value;
    [&#x27;eo1&#x27;,&#x27;ei1&#x27;,&#x27;eo2&#x27;,&#x27;ei2&#x27;].forEach(function(id){$(id+&#x27;o&#x27;).textContent=$(id).value;});
    var r1=o1/i1,r2=o2/i2,d=r1-r2,ang=Math.max(-14,Math.min(14,-d*12));
    $(&#x27;r1&#x27;).textContent=&#x27;Jenna &#x27;+r1.toFixed(2);$(&#x27;r2&#x27;).textContent=&#x27;Colleagues &#x27;+r2.toFixed(2);
    $(&#x27;beam&#x27;).setAttribute(&#x27;transform&#x27;,&#x27;rotate(&#x27;+(-ang)+&#x27; 250 100)&#x27;);
    var t;if(Math.abs(d)&lt;0.08)t=&#x27;&lt;b&gt;Equity:&lt;/b&gt; the ratios are similar. No tension: no drive to “restore the balance”.&#x27;;
    else if(d&lt;0)t=&#x27;&lt;b&gt;Underpayment inequity&lt;/b&gt; (Jenna receives proportionally less): anger and resentment. This is the situation Jenna describes, and the drive to “take something back” starts here.&#x27;;
    else t=&#x27;&lt;b&gt;Overpayment inequity&lt;/b&gt; (Jenna receives more than her due): according to Adams this generates guilt, and the person tends to work harder to compensate.&#x27;;
    $(&#x27;eqtxt&#x27;).innerHTML=t;}
  [&#x27;eo1&#x27;,&#x27;ei1&#x27;,&#x27;eo2&#x27;,&#x27;ei2&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,eUpd);});eUpd();
  // neutralization
  var NT=[[&#x27;Denial of injury&#x27;,&#x27;“It doesn’t hurt anyone”: if the harm cannot be seen, it does not exist. But the lost revenue is real (see the calculator in sec. 4).&#x27;],
    [&#x27;Denial of the victim&#x27;,&#x27;The victim “deserves it”: the discount becomes a just punishment. But the bar as an organisation and the manager are not the same thing.&#x27;],
    [&#x27;Condemnation of the condemners&#x27;,&#x27;Shifting attention to the faults of those who might judge you: “they are the ones in the wrong”. The manager’s wrongdoing, even if real, is a separate problem.&#x27;],
    [&#x27;Appeal to higher loyalties&#x27;,&#x27;Loyalty to a friend is placed above the norm of honesty. But getting her into trouble is exactly what happens if the discount continues.&#x27;],
    [&#x27;Denial of responsibility&#x27;,&#x27;“It’s not up to me”: Jenna is the one ringing up the bill. But you know what is happening and you go back to the bar: the choice to accept is yours.&#x27;],
    [&#x27;Not one of the five classic techniques&#x27;,&#x27;It is an &lt;i&gt;incentive&lt;/i&gt; that involves you: sharing the benefit makes you complicit, and an accomplice is unlikely to report it. Spreading the gain keeps the mechanism going.&#x27;]];
  document.querySelectorAll(&#x27;#neutral [data-n]&#x27;).forEach(function(b){b.onclick=function(){var d=NT[+b.dataset.n];
    $(&#x27;nout&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+d[0]+&#x27;.&lt;/b&gt; &#x27;+d[1];
    document.querySelectorAll(&#x27;#neutral [data-n]&#x27;).forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});};});
  // opzioni Q2
  var OP=[
    [&#x27;Do nothing&#x27;,&#x27;You: you keep saving money, but also keep taking part. Jenna: the risk grows with every round. Bar: the loss accumulates. Friends: the practice spreads.&#x27;,&#x27;Negative consequences over time; breaches the duty not to take advantage; not what a good friend does.&#x27;,&#x27;Not advisable&#x27;],
    [&#x27;Pay the full price&#x27;,&#x27;You: you exit complicity at minimal cost. Jenna: she is not exposed, but she might take offence or carry on with others. Bar: it stops losing money on your rounds.&#x27;,&#x27;Good consequences, respects duties, consistent with honesty. But on its own it does not address Jenna’s problem.&#x27;,&#x27;Bare minimum (exit)&#x27;],
    [&#x27;Talk to Jenna&#x27;,&#x27;You: you risk a moment of awkwardness. Jenna: she has the chance to stop before being caught; you can also help her with the problem of the manager.&#x27;,&#x27;The option most favoured by virtue ethics (honesty + genuine loyalty). Works best combined with paying the full price.&#x27;,&#x27;Advisable (voice), already attempted once in the case&#x27;],
    [&#x27;Stop going to her side of the bar&#x27;,&#x27;You: you avoid the situation. Jenna: nothing changes for her; she may feel avoided without understanding why. Bar: the loss continues with other customers.&#x27;,&#x27;Protects you but leaves the problem untouched. It is a silent exit.&#x27;,&#x27;Acceptable as a fallback&#x27;],
    [&#x27;Tell the manager&#x27;,&#x27;You: you will probably lose the friendship. Jenna: likely dismissal. Bar: the harm stops. Colleagues: no longer at risk of unfair suspicion.&#x27;,&#x27;Respects the duty towards the bar, but may be disproportionate if milder means would suffice. The manager is precisely the person Jenna is in conflict with.&#x27;,&#x27;Last resort (external voice)&#x27;]];
  document.querySelectorAll(&#x27;#opts [data-o]&#x27;).forEach(function(b){b.onclick=function(){var d=OP[+b.dataset.o];
    $(&#x27;oout&#x27;).innerHTML=&#x27;&lt;h4 style=&quot;margin-top:0&quot;&gt;&#x27;+d[0]+&#x27; &lt;span class=&quot;chip&quot;&gt;&#x27;+d[3]+&#x27;&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Effects on stakeholders.&lt;/b&gt; &#x27;+d[1]+&#x27;&lt;/p&gt;&lt;p&gt;&lt;b&gt;The three lenses.&lt;/b&gt; &#x27;+d[2]+&#x27;&lt;/p&gt;&#x27;;
    document.querySelectorAll(&#x27;#opts [data-o]&#x27;).forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});};});
})();
&lt;/script&gt;
