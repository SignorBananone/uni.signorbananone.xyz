    &lt;h1&gt;Introducing Business Ethics&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;What &lt;span class=&quot;term&quot;&gt;business ethics&lt;/span&gt; is, why it differs from mere compliance with the law, why it matters today, and how it varies across types of organization, industries, cultures and the global marketplace.&lt;/p&gt;

&lt;main&gt;
&lt;section class=&quot;part&quot; id=&quot;p1&quot; data-h=&quot;150&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;What is business ethics?&lt;/div&gt;&lt;h2&gt;What business ethics is&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 3-10&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Starting from a case: “No such thing as a free drink?”&lt;/h3&gt;
  &lt;p&gt;The lecture opens with an &lt;span class=&quot;term&quot;&gt;ethical dilemma&lt;/span&gt;: a situation in which the right choice is not obvious, because legitimate values or interests come into conflict. The box appears to be taken from the Crane &amp;amp; Matten textbook: its layout and title match their “Ethical dilemma” boxes.&lt;/p&gt;
  &lt;div class=&quot;card t&quot;&gt;
    &lt;p&gt;&lt;b&gt;The case in brief.&lt;/b&gt; Jenna, a friend of yours from university, complains that she never has any money and gets a job as a bartender in the student bar, where you are a regular customer. Soon she starts complaining about the manager: she says the manager treats her badly and gives her the worst shifts and tasks. Then she starts letting you and your friends have drinks for free or for less. At first you feel uncomfortable, but the discount comes in handy. When you try to raise the issue she plays it down: “They&#x27;ll never notice anyway, and the way they treat me, they deserve it.”&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Summary of slide 3. The text in the box is small: check the details against the original.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;q1&quot;&gt;Who is to blame?&lt;/button&gt;&lt;button data-tab=&quot;q2&quot;&gt;What would you do?&lt;/button&gt;&lt;button data-tab=&quot;q3&quot;&gt;Preferential treatment&lt;/button&gt;&lt;button data-tab=&quot;q4&quot;&gt;Does the wrong she suffers justify her?&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q1&quot;&gt;&lt;p&gt;&lt;b&gt;Who is in the wrong: Jenna, you, both, neither?&lt;/b&gt; Jenna is taking value away from her employer, but you are also knowingly benefiting from it. This is a question of &lt;span class=&quot;term&quot;&gt;complicity&lt;/span&gt;: accepting an advantage while knowing where it comes from is not neutral behaviour.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q2&quot;&gt;&lt;p&gt;&lt;b&gt;How would you handle it?&lt;/b&gt; The options are to stay silent, ask Jenna to stop, refuse the discounts or report her. Each one has a cost: the friendship, your wallet, her job. The case shows that even everyday choices have an ethical dimension, long before the decisions of top managers.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q3&quot;&gt;&lt;p&gt;&lt;b&gt;Is it different from other forms of preferential treatment?&lt;/b&gt; For example, serving you before other customers in the queue. In both cases a friend receives a privilege, but the discount takes money from the business, while “queue-jumping” takes time from the other customers. Comparing the two cases forces us to say &lt;em&gt;why&lt;/em&gt; one seems more serious than the other: this is the step from opinion to argument (see &lt;a href=&quot;#p3&quot;&gt;section 3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q4&quot;&gt;&lt;p&gt;&lt;b&gt;Does the fact that Jenna is treated badly justify her behaviour?&lt;/b&gt; It may explain it, but explaining is not justifying. The case highlights a tension typical of business ethics: an injustice suffered (perhaps a real one) used to legitimize another wrongdoing.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Business ethics: an oxymoron?&lt;/h3&gt;
  &lt;p&gt;An &lt;span class=&quot;term&quot;&gt;oxymoron&lt;/span&gt; is an expression that combines apparently contradictory terms: “deafening silence”, “burning ice”. According to a popular quip, &lt;em&gt;business ethics&lt;/em&gt; is one too: business and ethics supposedly do not go together. Slide 4 asks what this idea means and what consequences it has, and offers two readings:&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;imm&quot;&gt;Immorality of business&lt;/button&gt;&lt;button data-tab=&quot;amo&quot;&gt;Amorality of business&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;imm&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business is &lt;em&gt;immoral&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Business would be &lt;b&gt;opposed&lt;/b&gt; to ethics: profit, competition and self-interest would by their very nature push towards wrongdoing. On this reading business ethics is impossible, because those who want to stay honest lose out.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Counter-argument: many firms prosper precisely thanks to trust, and scandals (slides 9-10) outrage us because we &lt;em&gt;expect&lt;/em&gt; proper conduct.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;amo&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business is &lt;em&gt;amoral&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Business would be &lt;b&gt;unrelated&lt;/b&gt; to ethics: a technical domain where numbers, efficiency and the law are what count, while moral questions are “beside the point”. This is the more insidious reading, because it leads managers not to use ethical language, that is, to &lt;a href=&quot;#p1-mute&quot;&gt;moral muteness&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Counter-argument: every business decision affects people (employees, customers, communities), so it always has moral effects.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;p1-mute&quot;&gt;The Moral Muteness of Managers &lt;span class=&quot;small&quot;&gt;(Bird &amp;amp; Waters, 1989)&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Why is it hard to talk about ethics in the workplace? According to Bird and Waters, most managers suffer from &lt;span class=&quot;term&quot;&gt;moral muteness&lt;/span&gt;: they are uncomfortable using the language of ethics in their managerial role. The slides give three reasons, linked to how managers perceive ethics:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;details&gt;&lt;summary&gt;A highly technical discipline&lt;/summary&gt;&lt;div&gt;They see it as a body of knowledge that requires an advanced degree to decipher, and they do not feel qualified enough to use it.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A matter of blame&lt;/summary&gt;&lt;div&gt;Talking about ethics would mean talking about &lt;em&gt;blame and fault&lt;/em&gt;: accusing someone, creating conflict.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;An idealistic undertaking&lt;/summary&gt;&lt;div&gt;Ethics seems like idealism, whereas management is supposedly about &lt;em&gt;hard numbers&lt;/em&gt; and practical results.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Two separate mental checklists: business decision and ethical decision&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;160&quot; rx=&quot;14&quot; class=&quot;fill-card stroke-d&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;40&quot; y=&quot;54&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Business decision&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;92&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ What might I gain?&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;122&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ How will it affect the future?&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;160&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;numbers, results&lt;/text&gt;
      &lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;160&quot; rx=&quot;14&quot; class=&quot;fill-t stroke-d&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;460&quot; y=&quot;54&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Ethical decision&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;92&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ Is this fair?&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;122&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ Will people be hurt?&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;160&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;fairness, harm to people&lt;/text&gt;
      &lt;path d=&quot;M330 100 L430 100&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 6&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; class=&quot;fill-acc&quot; font-size=&quot;22&quot;&gt;✕&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot;&gt;“Ethics is (or was) widely viewed as optional to business and largely unconnected”&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The cartoon from slide 5, redrawn: two mental checklists kept apart. The message of the lecture is that they must be brought together.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The article&#x27;s abstract (&lt;a href=&quot;https://cmr.berkeley.edu/1989/11/32-1-the-moral-muteness-of-managers&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;California Management Review&lt;/a&gt;) adds that managers experience moral talk as a threat to organizational harmony, to their own efficiency and to their image of power. It also lists the costs of muteness: &lt;em&gt;moral amnesia&lt;/em&gt; (the ethical dimension of decisions is forgotten), moral stress for individuals, neglected abuses, and ethical standards with diminished authority.&lt;/div&gt;

  &lt;h3&gt;Ethics is not optional&lt;/h3&gt;
  &lt;blockquote&gt;But the truth is that while our particular choice of morals in business is optional, whether we &lt;b&gt;have&lt;/b&gt; morals in business is not! Ethics is not an option, it is an inescapable part of what means to be human, and that includes what we do in business.&lt;cite&gt;Wicks, Freeman, Werhane and Martin, 2010, p. 2 · slide 6&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In other words: we can choose &lt;em&gt;which&lt;/em&gt; values to follow, but we cannot decide to have none. Even “not thinking about it” is a choice with moral consequences. The cartoon on slide 6 makes the point ironically: “Your company has a huge corruption problem…” / “A thousand dollars if you don&#x27;t tell anyone!”.&lt;/p&gt;
  &lt;blockquote&gt;Managers must see ethics not only as an integral part of management but also as something that can help them and their organization to achieve excellence.&lt;cite&gt;Wicks, Freeman, Werhane and Martin, 2010, p. 3 · slide 7&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Here the point is turned around: ethics is not just a constraint to be respected, it is a resource for the organization&#x27;s &lt;em&gt;excellence&lt;/em&gt;.&lt;/p&gt;

  &lt;h3 id=&quot;p1-def&quot;&gt;The definition&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Business ethics&lt;/b&gt; is the study of business situations, activities, and decisions where issues of &quot;right and wrong&quot;, values and purposes are addressed. &lt;span class=&quot;small&quot;&gt;(slide 8)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;In short: it is a reflective study of the business situations in which right and wrong, values and purposes are at stake.&lt;/span&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 140&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of the definition&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;OBJECT&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;situations · activities&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;decisions&lt;/text&gt;
        &lt;rect x=&quot;265&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;ISSUES&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;right and wrong&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;values · purposes&lt;/text&gt;
        &lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;NATURE&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;a &lt;tspan font-style=&quot;italic&quot;&gt;study&lt;/tspan&gt;: reflection&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;not a list of rules&lt;/text&gt;
        &lt;path d=&quot;M242 70 L262 70 M497 70 L517 70&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;p&gt;Immediately afterwards the slide asks the question that opens &lt;a href=&quot;#p2&quot;&gt;section 2&lt;/a&gt;: &lt;b&gt;“Why we need ethics if we have the law?”&lt;/b&gt;&lt;/p&gt;

  &lt;h3&gt;Corporate scandals&lt;/h3&gt;
  &lt;p&gt;Slides 9-10 refer to two videos on corporate scandals (“The 3 craziest corporate scandals of 2017”, “10 shocking corporate scandals”; links in &lt;a href=&quot;#more&quot;&gt;Further reading&lt;/a&gt;) and ask:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;What is wrong in these stories?&lt;/summary&gt;&lt;div&gt;Usually someone (savers, consumers, employees, the environment) has been harmed by those with more power or more information, and trust has often been betrayed.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why do we feel they are “wrong”, “unfair”, “scandals”?&lt;/summary&gt;&lt;div&gt;Because they violate shared norms and values (&lt;a href=&quot;#p3&quot;&gt;morality&lt;/a&gt;), even when there is no court ruling yet. Outrage is already a moral judgement.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What role does the law play in preventing abuses?&lt;/summary&gt;&lt;div&gt;The law often comes afterwards, does not cover everything and can be circumvented (see &lt;em&gt;opportunistic compliance&lt;/em&gt; in &lt;a href=&quot;#p2-motives&quot;&gt;section 2&lt;/a&gt;). On its own it is not enough.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is there room to discuss and study business ethics?&lt;/summary&gt;&lt;div&gt;Yes: precisely where the law is silent or lags behind, ethical judgement is needed. This answer sets up the next section.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Amorality means that business is unrelated to ethics, not opposed to it. Immorality means opposed.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; “In business, numbers are what count; moral questions are simply beside the point.” Which reading of the oxymoron does this express?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Immorality of business&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Amorality of business&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. What is moral muteness, and which three perceptions of ethics give rise to it?&lt;/summary&gt;&lt;div&gt;Managers&#x27; discomfort with using ethical language in their role (Bird &amp;amp; Waters, 1989). They see ethics as (a) a highly technical discipline, (b) a matter of blame and fault, (c) an idealistic undertaking, far removed from numbers and results.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. What do Wicks et al. mean by “our choice of morals is optional, whether we have morals is not”?&lt;/summary&gt;&lt;div&gt;We can choose which values to adopt, but we cannot have none: every business decision has a moral dimension regardless.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Restate the definition of business ethics and identify its three components.&lt;/summary&gt;&lt;div&gt;“The study of business situations, activities, and decisions where issues of right and wrong, values and purposes are addressed”. Object (situations, activities, decisions), issues (right/wrong, values, purposes), nature (a study).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p2&quot; data-h=&quot;85&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Ethics and the law&lt;/div&gt;&lt;h2&gt;Ethics and the law: why the law is not enough&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 8, 11-12&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Ethics and the law overlap only in part. Slide 11 represents them as two circles: the intersection contains what both regulate, while the two outer “crescents” contain what concerns only one or the other. &lt;b&gt;Click on the areas of the diagram.&lt;/b&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;venn&quot; viewBox=&quot;0 0 740 330&quot; role=&quot;img&quot; aria-label=&quot;Clickable Venn diagram of ethics and the law&quot; style=&quot;cursor:pointer&quot;&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;170&quot; r=&quot;130&quot; style=&quot;fill:oklch(var(--tint-l) 0.01 60);stroke:var(--ink)&quot; stroke-width=&quot;1.5&quot; id=&quot;vE&quot;/&gt;
      &lt;circle cx=&quot;440&quot; cy=&quot;170&quot; r=&quot;130&quot; style=&quot;fill:oklch(var(--tint-l) 0.05 140);stroke:var(--ink);fill-opacity:.75&quot; stroke-width=&quot;1.5&quot; id=&quot;vL&quot;/&gt;
      &lt;text x=&quot;230&quot; y=&quot;30&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Ethics&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;320&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Law&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Grey area&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;ethics only&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;Covered by&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;both law&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;and ethics&lt;/text&gt;
      &lt;text x=&quot;510&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Law only&lt;/text&gt;
      &lt;path id=&quot;vHi&quot; d=&quot;&quot; style=&quot;fill:none;stroke:var(--acc)&quot; stroke-width=&quot;4&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tabbar&quot; id=&quot;vennBtns&quot;&gt;&lt;button class=&quot;btn&quot; data-r=&quot;e&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;b&quot;&gt;Ethics + law&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;l&quot;&gt;Law only&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot; id=&quot;vennInfo&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Choose an area to read what it means.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;p&gt;The &lt;b&gt;grey area&lt;/b&gt; is the territory of genuine &lt;span class=&quot;term&quot;&gt;ethical dilemmas&lt;/span&gt;: the law says nothing, so the decision is left to the firm and its judgement. This is why ethics is needed even within a legal system: &lt;b&gt;the law does not cover everything, often comes late and varies from country to country&lt;/b&gt; (as we will see in &lt;a href=&quot;#p5&quot;&gt;section 5&lt;/a&gt;). For the most part the law sets a minimum, while ethics asks us to go beyond it.&lt;/p&gt;

  &lt;h4&gt;Try it yourself: which area does it fall into?&lt;/h4&gt;
  &lt;p class=&quot;small&quot;&gt;Examples constructed for the exercise, not taken from the slides (except the first and the last).&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;This is the example from the slide: in many jurisdictions it is legal (or unregulated), but it is highly questionable on moral grounds.&quot;&gt;
      &lt;p&gt;Selling anti-personnel mines to an oppressive regime, where it is not prohibited.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Both&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Law only&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;Fraud is prohibited by law and is also morally wrong.&quot;&gt;
      &lt;p&gt;Falsifying the financial statements to hide losses from investors.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Both&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Law only&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;If the contract allows it, it is legal, but exploiting one&#x27;s bargaining power over small suppliers and their employees raises questions of fairness.&quot;&gt;
      &lt;p&gt;A large retail chain pays its small suppliers at 180 days because the contract allows it.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Both&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Law only&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;This is the example from the slide: a coordination rule. Right or left are morally equivalent; what matters is that everyone does the same.&quot;&gt;
      &lt;p&gt;Driving on the right-hand side of the road.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Both&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Law only&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;p2-motives&quot;&gt;Why do firms comply with the law? Legal motives&lt;/h3&gt;
  &lt;p&gt;Even compliance with the law can happen for very different reasons. Slide 12 takes the classification of &lt;span class=&quot;term&quot;&gt;legal motives&lt;/span&gt; from the &lt;span class=&quot;term&quot;&gt;three-domain CSR model&lt;/span&gt; of Schwartz and Carroll (2003); the slide title reads “CRS”, but the article refers to CSR, &lt;span class=&quot;term&quot;&gt;Corporate Social Responsibility&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The model (&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-social-responsibility-a-threedomain-approach/0655292E11AC9C9CA33ACD433417518C&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Ethics Quarterly, 2003&lt;/a&gt;) replaces Carroll&#x27;s famous CSR “pyramid” (1991) with three overlapping circles: the &lt;b&gt;economic&lt;/b&gt;, &lt;b&gt;legal&lt;/b&gt; and &lt;b&gt;ethical&lt;/b&gt; domains. Their overlaps generate seven categories. The motives on the slide describe the &lt;em&gt;legal&lt;/em&gt; circle, i.e. the different ways in which a firm relates to the law.&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Scale of legal motives from passive to proactive&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;path d=&quot;M30 60 L730 60&quot; style=&quot;stroke:var(--acc)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;
        &lt;circle cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;38&quot;&gt;Passive&lt;/text&gt;
        &lt;circle cx=&quot;230&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;38&quot;&gt;Restrictive&lt;/text&gt;
        &lt;circle cx=&quot;380&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;38&quot;&gt;Opportunistic&lt;/text&gt;
        &lt;circle cx=&quot;530&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;38&quot;&gt;Avoid. civil litigation&lt;/text&gt;
        &lt;circle cx=&quot;680&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;38&quot;&gt;Anticipation&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;30&quot; y=&quot;98&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;unaware&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;98&quot; text-anchor=&quot;end&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;forward-looking&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Our own reading (not from the slide): from unaware compliance to proactive anticipation. Opportunistic compliance uses the law instrumentally.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;m1&quot;&gt;Passive / accidental&lt;/button&gt;&lt;button data-tab=&quot;m2&quot;&gt;Restrictive&lt;/button&gt;&lt;button data-tab=&quot;m3&quot;&gt;Opportunistic&lt;/button&gt;&lt;button data-tab=&quot;m4&quot;&gt;Avoidance of civil litigation&lt;/button&gt;&lt;button data-tab=&quot;m5&quot;&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m1&quot;&gt;&lt;h4&gt;Passive / accidental compliance &lt;span class=&quot;small&quot;&gt;(outside the legal domain)&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Description:&lt;/b&gt; &lt;em&gt;unintentional or unaware&lt;/em&gt; compliance with laws and regulations.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example from the slide:&lt;/b&gt; driving below the speed limit because the road is in poor condition, not because of the highway code.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The law is complied with by chance: the real motive is something else.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m2&quot;&gt;&lt;h4&gt;Restrictive compliance&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Description:&lt;/b&gt; &lt;em&gt;intentional&lt;/em&gt; compliance with laws that constrain action.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example from the slide:&lt;/b&gt; complying with emission standards in the production process.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The firm would act otherwise, but the law prevents it and the firm obeys.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m3&quot;&gt;&lt;h4&gt;Opportunistic compliance&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Description:&lt;/b&gt; seeking the &lt;em&gt;most profitable&lt;/em&gt; option within the legal system.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example from the slide:&lt;/b&gt; locating operations where controls are weaker or taxes are lower.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Formally legal, but it is the gateway to the &lt;a href=&quot;#p5-race&quot;&gt;race to the bottom&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m4&quot;&gt;&lt;h4&gt;Avoidance of civil litigation&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Description:&lt;/b&gt; acting mainly to &lt;em&gt;avoid civil lawsuits&lt;/em&gt; for negligence.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example from the slide:&lt;/b&gt; voluntarily recalling products with quality defects.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The driver is the legal and financial risk of being sued.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m5&quot;&gt;&lt;h4&gt;Anticipation of law&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Description:&lt;/b&gt; acting on the basis of &lt;em&gt;expected changes in the law&lt;/em&gt;, for example by looking at laws already in force in other jurisdictions.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example from the slide:&lt;/b&gt; adopting production technologies with environmental standards higher than those required, but already widely accepted internationally.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The firm moves ahead of the legislator.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Moving the headquarters to where taxes are lower is legal and maximizes profit within the rules: it is opportunistic compliance.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; A company moves its tax domicile to a low-tax country, entirely legally. Which legal motive?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Restrictive&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Opportunistic&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Complying today with an expected rule (already widespread elsewhere) is anticipation of law.&quot;&gt;
      &lt;p&gt;&lt;b&gt;2.&lt;/b&gt; A manufacturer phases out in advance a substance already banned in the EU, even though it is still permitted in its home country. Which legal motive?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Avoidance of civil litigation&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Passive&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;3. Why do we need ethics if we have the law? Give at least three reasons.&lt;/summary&gt;&lt;div&gt;(a) The law does not cover everything: there is the grey area. (b) It often comes after the problems. (c) It varies across countries and can be exploited opportunistically. (d) Complying with the law says nothing about &lt;em&gt;why&lt;/em&gt; one does so, and motives matter.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Give an example of something “covered by law but not by ethics”.&lt;/summary&gt;&lt;div&gt;Which side of the road we drive on, or many purely technical and coordination rules: the content is morally indifferent; what matters is that a common rule exists.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p3&quot; data-h=&quot;250&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Morality, ethics, ethical theory&lt;/div&gt;&lt;h2&gt;From opinions to arguments&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 13-16&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;What, then, is business ethics for? Slide 13 answers in three steps:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Answers, or at least tools&lt;/h4&gt;&lt;p&gt;It offers answers, or at least &lt;b&gt;tools&lt;/b&gt;, for understanding &lt;em&gt;why&lt;/em&gt; certain decisions should be assessed as ethical or unethical, right or wrong.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Better, not right&lt;/h4&gt;&lt;p&gt;It helps us make &lt;b&gt;&lt;em&gt;better&lt;/em&gt;&lt;/b&gt; decisions, which are not necessarily the unequivocally &lt;em&gt;right&lt;/em&gt; ones. Above all, it is about &lt;b&gt;developing good judgement&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Accountable&lt;/h4&gt;&lt;p&gt;Ethical reasoning enables us to &lt;b&gt;be accountable&lt;/b&gt; to others, that is, to answer for our choices and justify them.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote&gt;Ethics refers to our efforts to figure out what we should do and how we should live. […] It involves the challenge of figuring out how to justify our behavior – both to ourselves and to others (in business, e.g., to shareholders, employees, and the public). Taking ethics seriously involves the admission that other people have inherent worth and dignity, so that our decisions […] need to be backed up with good reasons.&lt;cite&gt;Wicks et al., 2010, p. 4 · slide 14&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;This is the core: if others have &lt;em&gt;dignity&lt;/em&gt; and inherent worth, the decisions that affect them must be &lt;b&gt;justified with good reasons&lt;/b&gt;. Saying “in my opinion” is not enough. Some &lt;span class=&quot;term&quot;&gt;stakeholders&lt;/span&gt; (anyone who affects or is affected by the firm&#x27;s activities) already appear here: &lt;em&gt;shareholders&lt;/em&gt;, &lt;em&gt;employees&lt;/em&gt; and &lt;em&gt;the public&lt;/em&gt;.&lt;/p&gt;

  &lt;h4&gt;Opinion or argument? Try turning one into the other&lt;/h4&gt;
  &lt;div class=&quot;stepper&quot; aria-label=&quot;From opinion to argument&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Step 1 · Opinion&lt;/p&gt;&lt;p class=&quot;lede&quot;&gt;“Offshoring the factory to Asia is wrong.”&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;It is a judgement, but it does not say why: it can be neither discussed nor tested.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Step 2 · Who is involved?&lt;/p&gt;&lt;p&gt;Italian employees (who lose their jobs), Asian workers (who gain jobs, but under what conditions?), shareholders (lower costs), consumers (prices), the local community.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Step 3 · Which reasons and values?&lt;/p&gt;&lt;p&gt;Fairness towards those who have contributed to the firm for years; respect for the dignity of the new workers; duty towards shareholders; sustainability of the community.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Step 4 · Objections&lt;/p&gt;&lt;p&gt;“Without cutting costs the firm goes bankrupt and everyone loses their job.” A serious argument also considers the reasons against it.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Step 5 · Argument&lt;/p&gt;&lt;p class=&quot;lede&quot;&gt;“Offshoring can be justified if it is necessary for the firm&#x27;s survival, but only if decent working conditions are guaranteed abroad and the dismissed workers receive support.”&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Now it is a position one can be &lt;em&gt;accountable&lt;/em&gt; for before the stakeholders. Example constructed for the exercise.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; aria-label=&quot;Previous step&quot;&gt;←&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Step&quot;&gt;&lt;button class=&quot;btn next&quot; aria-label=&quot;Next step&quot;&gt;→&lt;/button&gt;&lt;span class=&quot;count small&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Morality, ethics, ethical theory&lt;/h3&gt;
  &lt;p&gt;Slide 15 distinguishes three terms that are used as synonyms in everyday language:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Morality&lt;/b&gt; is concerned with the &lt;em&gt;norms, values and beliefs&lt;/em&gt; embedded in social processes which define right and wrong for an individual or a community.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Morality is something we &lt;em&gt;live&lt;/em&gt;.&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethics&lt;/b&gt; is concerned with the study of morality and the &lt;em&gt;application of reasons&lt;/em&gt; to elucidate specific rules and principles that determine right and wrong for any given situation.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Ethics is something we &lt;em&gt;reflect on&lt;/em&gt;.&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethical theories&lt;/b&gt;: these rules and principles.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Ethical theories are the rules and principles produced in this way.&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; aria-label=&quot;Chain of morality, ethics, ethical theory&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Chain of four blocks&quot; id=&quot;chainSvg&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;10&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Morality&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;207&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;282&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Ethics&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;404&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;479&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Ethical theory&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;601&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;676&quot; y=&quot;62&quot; class=&quot;svg-ink&quot;&gt;Potential&lt;/text&gt;&lt;text x=&quot;676&quot; y=&quot;80&quot; class=&quot;svg-ink&quot;&gt;solutions&lt;/text&gt;
        &lt;path d=&quot;M162 65 L204 65 M359 65 L401 65 M556 65 L598 65&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;text x=&quot;183&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;rationalizes&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;to produce&lt;/text&gt;&lt;text x=&quot;577&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;applied to&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;1 · Morality&lt;/p&gt;&lt;p&gt;In the bar case (&lt;a href=&quot;#p1&quot;&gt;section 1&lt;/a&gt;) we feel that “you don&#x27;t take what isn&#x27;t yours” and that “friends help each other”. These are moral convictions: we have absorbed them from our community, often without ever examining them, and here they come into conflict.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;2 · Ethics rationalizes morality…&lt;/p&gt;&lt;p&gt;Ethics takes these convictions and examines them through reason: &lt;em&gt;why&lt;/em&gt; is stealing wrong? Does the wrong suffered by Jenna change anything? Which principles are at stake?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;3 · …to produce ethical theory…&lt;/p&gt;&lt;p&gt;The reasoning is condensed into general principles, ethical theories, which apply beyond this single case. For example, a principle that looks at the &lt;em&gt;consequences&lt;/em&gt; of actions, or one that looks at &lt;em&gt;duties&lt;/em&gt; and rights. &lt;span class=&quot;small&quot;&gt;(Indicative examples: the individual theories are not covered in these slides.)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;4 · …that can be applied to any situation&lt;/p&gt;&lt;p&gt;Theories offer &lt;b&gt;potential solutions to ethical problems&lt;/b&gt;: &lt;em&gt;possible&lt;/em&gt; solutions, not certain ones. This brings back the point of slide 13: &lt;em&gt;better&lt;/em&gt; decisions, not necessarily &lt;em&gt;right&lt;/em&gt; ones.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; aria-label=&quot;Previous step&quot;&gt;←&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Step&quot;&gt;&lt;button class=&quot;btn next&quot; aria-label=&quot;Next step&quot;&gt;→&lt;/button&gt;&lt;span class=&quot;count small&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;style&gt;#chainSvg .cb{fill:var(--card);stroke:var(--rule);stroke-width:1.5;transition:fill .3s}#chainSvg .cb.on{fill:oklch(var(--tint-l) 0.06 250);stroke:oklch(var(--deep-l) var(--deep-c) 250);stroke-width:2.5}&lt;/style&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;The norms and beliefs shared by a community are morality. Ethics is the reflective study of those norms.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; “In this company it is normal for bosses not to answer emails at the weekend, and nobody considers it improper.” This is…&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Morality&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Ethics&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Ethical theory&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Why does business ethics aim at “better” rather than “right” decisions?&lt;/summary&gt;&lt;div&gt;Because dilemmas rarely have a single unequivocal answer: the aim is to develop &lt;em&gt;good judgement&lt;/em&gt;, i.e. the ability to choose well and to justify the choice.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. What is the link between people&#x27;s dignity and the obligation to justify?&lt;/summary&gt;&lt;div&gt;If others have &lt;em&gt;inherent worth and dignity&lt;/em&gt; (Wicks et al.), we cannot treat them as mere means: the decisions that affect them must be backed by good reasons for which we are &lt;em&gt;accountable&lt;/em&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Reconstruct the chain on slide 16.&lt;/summary&gt;&lt;div&gt;Morality → (ethics rationalizes morality) → Ethics → (to produce) → Ethical theory → (that can be applied to any situation) → Potential solutions to ethical problems.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p4&quot; data-h=&quot;25&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Why is business ethics important?&lt;/div&gt;&lt;h2&gt;Why it matters, and how it varies across contexts&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 17-20&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Slide 17 lists seven reasons. They can be read in three groups: the &lt;b&gt;weight&lt;/b&gt; of business in society (1-3), external &lt;b&gt;pressure&lt;/b&gt; (4) and &lt;b&gt;open problems&lt;/b&gt; (5-7). Open the cards.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Three groups of reasons&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;330&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;175&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Weight of business&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;1 power · 2 contribution · 3 harm&lt;/text&gt;
        &lt;rect x=&quot;355&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Pressure&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;4 stakeholders&lt;/text&gt;
        &lt;rect x=&quot;510&quot; y=&quot;10&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Open problems&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;5 education · 6 infractions · 7 trust&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;A grouping suggested as a memory aid: the slide presents them as a numbered list.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;1 · Power and influence of business in society&lt;/summary&gt;&lt;div&gt;Large corporations command resources comparable to those of entire states and influence employment, consumption, the environment and politics. More power means more responsibility for how it is used.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;2 · Potential to provide major contribution to society&lt;/summary&gt;&lt;div&gt;Firms produce goods, services, employment, innovation and tax revenue. Ethics helps steer this potential towards the common good.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;3 · Potential to inflict harm on individuals, society and the environment&lt;/summary&gt;&lt;div&gt;The same power can cause harm: dangerous products, pollution, exploitation, financial crises. The scandals in &lt;a href=&quot;#p1&quot;&gt;section 1&lt;/a&gt; are examples.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;4 · Increasing demands from stakeholders&lt;/summary&gt;&lt;div&gt;Consumers, investors, employees, NGOs and the media increasingly ask firms to account for their conduct. This is the &lt;em&gt;accountability&lt;/em&gt; of &lt;a href=&quot;#p3&quot;&gt;section 3&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;5 · Lack of business ethics education or training&lt;/summary&gt;&lt;div&gt;Without training, people lack the words and tools to deal with dilemmas, and we are back to &lt;a href=&quot;#p1-mute&quot;&gt;moral muteness&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;6 · Continued occurrence of ethical infractions&lt;/summary&gt;&lt;div&gt;Violations keep occurring, in every sector, as the data below show.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;7 · Businesses face a trust deficit&lt;/summary&gt;&lt;div&gt;Firms suffer from a &lt;span class=&quot;term&quot;&gt;trust deficit&lt;/span&gt;: the public tends not to trust them. Ethical conduct is the precondition for regaining legitimacy.&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;p4-ctx&quot;&gt;Misconduct is not just a “business” problem&lt;/h3&gt;
  &lt;p&gt;Slide 18 shows two charts from Crane &amp;amp; Matten (2010), based on the Ethics Resource Center surveys (2007): misconduct, i.e. improper behaviour observed by employees, exists in businesses, nonprofits and government.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;h4&gt;Types of misconduct by sector&lt;/h4&gt;
      &lt;div class=&quot;tabbar&quot; id=&quot;barBtns&quot;&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;0&quot;&gt;Nonprofit&lt;/button&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;1&quot;&gt;Business&lt;/button&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;2&quot;&gt;Government&lt;/button&gt;&lt;/div&gt;
      &lt;svg id=&quot;bars&quot; viewBox=&quot;0 0 420 270&quot; role=&quot;img&quot; aria-label=&quot;Bar chart of misconduct by sector&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;% of employees who observed the behaviour. Source given on the slide: Ethics Resource Center (2008), &lt;em&gt;2007 National Nonprofit Ethics Survey&lt;/em&gt;, in Crane &amp;amp; Matten (2010), fig. 1.3. Values read from the slide.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;h4&gt;Observed misconduct over time&lt;/h4&gt;
      &lt;svg id=&quot;lines&quot; viewBox=&quot;0 0 420 270&quot; role=&quot;img&quot; aria-label=&quot;Line chart of observed misconduct 2000-2007&quot;&gt;&lt;/svg&gt;
      &lt;label class=&quot;small&quot; for=&quot;yr&quot;&gt;Year: &lt;b id=&quot;yrLab&quot;&gt;2007&lt;/b&gt;&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;yr&quot; min=&quot;0&quot; max=&quot;3&quot; value=&quot;3&quot; step=&quot;1&quot;&gt;
      &lt;div id=&quot;yrOut&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Crane &amp;amp; Matten (2010), fig. 1.4. Values read from the slide. The assignment of lines to sectors is our reconstruction based on colours and positions: check it against the original.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;How to read them:&lt;/b&gt; more than half of employees, in all three sectors, report having seen misconduct. The public sector appears the most affected, and the nonprofit sector, often perceived as “more ethical”, is not immune: by 2007 it comes close to the others. Business ethics therefore concerns &lt;b&gt;every type of organization&lt;/b&gt;, albeit in different ways.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; According to summaries of the ERC survey (see &lt;a href=&quot;#more&quot;&gt;Further reading&lt;/a&gt;), misconduct in the nonprofit sector was on the rise, and financial fraud was more widespread there than in business or government.&lt;/div&gt;

  &lt;h3&gt;Differences across organizational types&lt;/h3&gt;
  &lt;p&gt;Slide 19 compares four types of organization along four dimensions. &lt;span class=&quot;term&quot;&gt;Civil society organisations&lt;/span&gt; include NGOs, associations and nonprofit bodies.&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;o1&quot;&gt;Large corporations&lt;/button&gt;&lt;button data-tab=&quot;o2&quot;&gt;Small businesses&lt;/button&gt;&lt;button data-tab=&quot;o3&quot;&gt;Civil society organisations&lt;/button&gt;&lt;button data-tab=&quot;o4&quot;&gt;Public sector&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o1&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Ethical priorities&lt;/th&gt;&lt;td&gt;Financial integrity, employee/customer issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approach&lt;/th&gt;&lt;td&gt;Formal, public relations and/or systems-based: codes, procedures, communication&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accountable to&lt;/th&gt;&lt;td&gt;Shareholders and other stakeholders&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Constraints&lt;/th&gt;&lt;td&gt;Shareholder orientation; size and complexity&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o2&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Ethical priorities&lt;/th&gt;&lt;td&gt;Employee, customer/community issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approach&lt;/th&gt;&lt;td&gt;Informal, relationship and trust based&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accountable to&lt;/th&gt;&lt;td&gt;Owners and family members&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Constraints&lt;/th&gt;&lt;td&gt;Lack of resources, including time&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o3&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Ethical priorities&lt;/th&gt;&lt;td&gt;Delivery of mission to clients; legitimacy and accountability issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approach&lt;/th&gt;&lt;td&gt;Informal values based&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accountable to&lt;/th&gt;&lt;td&gt;Donors and clients&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Constraints&lt;/th&gt;&lt;td&gt;Lack of resources and formal training&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o4&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Ethical priorities&lt;/th&gt;&lt;td&gt;Rule of law, conflict of interest; accountability issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approach&lt;/th&gt;&lt;td&gt;Formal, bureaucratic, regulated&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accountable to&lt;/th&gt;&lt;td&gt;General public, higher level government organisations&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Constraints&lt;/th&gt;&lt;td&gt;Inertia, lack of transparency&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 200&quot; role=&quot;img&quot; aria-label=&quot;Map: formality of approach versus size&quot;&gt;
      &lt;path d=&quot;M60 170 L740 170 M60 170 L60 15&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;740&quot; y=&quot;192&quot; text-anchor=&quot;end&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;more formal approach →&lt;/text&gt;
      &lt;text x=&quot;66&quot; y=&quot;22&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;resources and complexity ↑&lt;/text&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;135&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;118&quot; class=&quot;svg-ink&quot;&gt;Small businesses&lt;/text&gt;
        &lt;circle cx=&quot;260&quot; cy=&quot;110&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;93&quot; class=&quot;svg-ink&quot;&gt;Civil society org.&lt;/text&gt;
        &lt;circle cx=&quot;560&quot; cy=&quot;45&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;28&quot; class=&quot;svg-ink&quot;&gt;Large corporations&lt;/text&gt;
        &lt;circle cx=&quot;660&quot; cy=&quot;80&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;660&quot; y=&quot;63&quot; class=&quot;svg-ink&quot;&gt;Public sector&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Our own interpretive diagram, not in the slides: small and values-based organizations manage ethics informally; large corporations and the public sector do so formally.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Ethical issues in different industries&lt;/h3&gt;
  &lt;p&gt;The industry also shapes which ethical issues prevail (slide 20):&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;i1&quot;&gt;Chemical&lt;/button&gt;&lt;button data-tab=&quot;i2&quot;&gt;Supermarkets&lt;/button&gt;&lt;button data-tab=&quot;i3&quot;&gt;IT &amp;amp; mobile&lt;/button&gt;&lt;button data-tab=&quot;i4&quot;&gt;Financial services&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i1&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;competitive practices&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;environmental responsibility&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;health and safety&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;human rights&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i2&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;healthy eating (sugar, salt)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;food and packaging waste&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;power in supply chain relationships&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;supply chain CO₂ emissions&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;community relationships&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;local economies, decline of town centre locations&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;“Power in supply chain relationships”: large retailers have considerable bargaining power over suppliers, as in the example of 180-day payment terms in &lt;a href=&quot;#p2&quot;&gt;section 2&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i3&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;competitive practices&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;fair pricing&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;global production methods&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;data protection&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;harmful materials&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;energy and water usage&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CO₂ emissions&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i4&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;weak regulation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;financial crime&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;responsible lending&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;sales practices and consumer protection&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;tax evasion and avoidance&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;term&quot;&gt;Tax evasion&lt;/span&gt; is illegal. &lt;span class=&quot;term&quot;&gt;Tax avoidance&lt;/span&gt; means exploiting the law to pay less: often legal, but ethically contested. It is a typical grey-area case.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Small businesses manage ethics informally, on the basis of relationships and trust, and are accountable to owners and family.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; An “informal, relationship and trust based” approach, accountable to “owners and family members”: which type of organization is this?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Civil society org.&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Small business&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Public sector&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. List the seven reasons why business ethics is important.&lt;/summary&gt;&lt;div&gt;Power and influence; potential major contribution; potential to inflict harm; increasing stakeholder demands; lack of ethics education; continued ethical infractions; trust deficit.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. What do the ERC data teach us about the three sectors?&lt;/summary&gt;&lt;div&gt;Misconduct is widespread everywhere (over 50% observed), the public sector is the highest and the nonprofit sector is not immune. Ethics concerns every organization.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. What are the typical constraints of the public sector and of large corporations?&lt;/summary&gt;&lt;div&gt;Public sector: inertia, lack of transparency. Large corporations: shareholder orientation, size and complexity.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p5&quot; data-h=&quot;35&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Globalization: a key context for business ethics?&lt;/div&gt;&lt;h2&gt;Cultures and globalization&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 21-24&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;h3&gt;Different approaches depending on culture&lt;/h3&gt;
  &lt;p&gt;Slide 21 poses five questions; slide 22 answers them by comparing Europe, North America and Asia (source: Crane et al., 2019). Choose a question.&lt;/p&gt;
  &lt;div class=&quot;tabset&quot; id=&quot;regions&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;r1&quot;&gt;Who is responsible?&lt;/button&gt;&lt;button data-tab=&quot;r2&quot;&gt;Key actor&lt;/button&gt;&lt;button data-tab=&quot;r3&quot;&gt;Guidelines&lt;/button&gt;&lt;button data-tab=&quot;r4&quot;&gt;Key issues&lt;/button&gt;&lt;button data-tab=&quot;r5&quot;&gt;Stakeholder approach&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r1&quot;&gt;&lt;p class=&quot;small&quot;&gt;Who is responsible for ethical conduct in business?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Social control by the collective&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;The individual&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Top management&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r2&quot;&gt;&lt;p class=&quot;small&quot;&gt;Who is the key actor in business ethics?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Government, trade unions, corporate associations&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;The corporation&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Government, corporations&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r3&quot;&gt;&lt;p class=&quot;small&quot;&gt;What are the key guidelines for ethical behaviour?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Negotiated legal framework of business&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Corporate codes of ethics&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Managerial discretion&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r4&quot;&gt;&lt;p class=&quot;small&quot;&gt;What are the key issues in business ethics?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Social issues in organizing the framework of business&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Misconduct and immorality in single decision situations&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Corporate governance and accountability&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r5&quot;&gt;&lt;p class=&quot;small&quot;&gt;What is the dominant stakeholder management approach?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Formalised multiple stakeholder approach&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Focus on shareholder value&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Implicit multiple stakeholder approach, benign managerialism&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The common thread&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Europe:&lt;/b&gt; ethics runs through &lt;em&gt;institutions&lt;/em&gt; (negotiated laws, trade unions, associations). The issue is how to organize the framework within which firms operate. &lt;b&gt;North America:&lt;/b&gt; ethics is a matter for the &lt;em&gt;individual&lt;/em&gt; and the &lt;em&gt;corporation&lt;/em&gt; (codes of ethics). The issue is the single improper decision, and &lt;span class=&quot;term&quot;&gt;shareholder value&lt;/span&gt; prevails. &lt;b&gt;Asia:&lt;/b&gt; ethics depends on &lt;em&gt;top management&lt;/em&gt; and its discretion. The issue is &lt;span class=&quot;term&quot;&gt;corporate governance&lt;/span&gt; (the system by which the firm is directed and controlled), with an implicit, paternalistic concern for stakeholders: &lt;span class=&quot;term&quot;&gt;benign managerialism&lt;/span&gt;, a “benevolent” management that decides for everyone.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;These are general tendencies, not rules that apply to every firm. They do, however, explain why the same conduct may be judged differently from one country to another.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;The “ethical” impact of globalization on stakeholders&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Globalization&lt;/span&gt; (the growing integration of markets, production and communications across national borders) creates opportunities and risks for each stakeholder group (slide 23). &lt;span class=&quot;term&quot;&gt;MNCs&lt;/span&gt; are &lt;em&gt;multinational corporations&lt;/em&gt;. &lt;b&gt;Click on a stakeholder.&lt;/b&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wheel&quot; viewBox=&quot;0 0 760 400&quot; role=&quot;img&quot; aria-label=&quot;Clickable stakeholder wheel&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;grid g2&quot; id=&quot;whOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;p5-race&quot;&gt;Warning: race to the bottom&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Race to the bottom&lt;/b&gt;: a process whereby multinationals pit developing countries against each other, by allocating foreign direct investment to countries that can offer them the most favourable conditions in terms of low tax rates, low levels of environmental regulation, and restricted workers&#x27; rights. &lt;span class=&quot;small&quot;&gt;(slide 24)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;In short: multinationals play developing countries off against one another and direct &lt;span class=&quot;term&quot;&gt;foreign direct investment&lt;/span&gt; (FDI) to whichever offers low taxes, little environmental regulation and fewer workers&#x27; rights.&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Simulation.&lt;/b&gt; Three countries start with different standards (an index summarizing taxes, environmental regulation and workers&#x27; rights). In each round the multinational invests in the country with the lowest standard, and the others lower theirs to undercut it. Move the sliders: with the second one you can introduce a &lt;b&gt;common floor&lt;/b&gt;, i.e. a minimum standard agreed at international level.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg id=&quot;race&quot; viewBox=&quot;0 0 520 260&quot; role=&quot;img&quot; aria-label=&quot;Race to the bottom simulation&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;small&quot; for=&quot;rRound&quot;&gt;Round: &lt;b id=&quot;rRoundL&quot;&gt;0&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rRound&quot; min=&quot;0&quot; max=&quot;8&quot; value=&quot;0&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rFloor&quot;&gt;Common minimum standard: &lt;b id=&quot;rFloorL&quot;&gt;none&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rFloor&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;0&quot; step=&quot;5&quot;&gt;
    &lt;p id=&quot;rOut&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;A toy model built to illustrate the dynamics, not taken from the slides. The link with &lt;a href=&quot;#p2-motives&quot;&gt;opportunistic compliance&lt;/a&gt; is direct: each location decision is legal, but the overall effect worsens conditions for everyone.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Empirical studies are divided: some (for example Olney&#x27;s working paper on employment protection) find that countries do lower their standards to attract FDI. Others argue that foreign investment spreads cleaner technologies (the so-called &lt;em&gt;pollution halo&lt;/em&gt;). Links in &lt;a href=&quot;#more&quot;&gt;Further reading&lt;/a&gt;.&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;According to slide 22, in North America the key guidelines are corporate codes of ethics, and the focus on shareholder value prevails.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; In which region are corporate codes of ethics the main guideline?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Europe&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;North America&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Asia&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Define the race to the bottom and identify the three levers on which countries compete.&lt;/summary&gt;&lt;div&gt;Multinationals pit developing countries against each other by allocating FDI where conditions are most favourable: low tax rates, low environmental regulation, restricted workers&#x27; rights.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Why does globalization “weaken governments” and increase corporate responsibility?&lt;/summary&gt;&lt;div&gt;Firms operate beyond the reach of individual states, which compete to attract them. Where governments are weak or permissive, firms are expected to take responsibility for employment, welfare and ethical standards, and global pressure groups try to “police” them.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Give an example of an ambivalent impact on consumers.&lt;/summary&gt;&lt;div&gt;Lower prices and products available everywhere, but also accusations of cultural imperialism and westernization, and the risk of exploiting vulnerable consumers in developing countries.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;sintesi&quot; data-h=&quot;250&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker deep&quot;&gt;Summary · slide 32&lt;/div&gt;&lt;h2&gt;Lecture summary&lt;/h2&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Definition of business ethics&lt;/b&gt;&lt;br&gt;The study of business situations in which right and wrong, values and purposes are at stake. &lt;a href=&quot;#p1-def&quot;&gt;→ 1&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Business ethics and the law&lt;/b&gt;&lt;br&gt;They overlap only in part: the grey area and legal motives. &lt;a href=&quot;#p2&quot;&gt;→ 2&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Vital in contemporary capitalism&lt;/b&gt;&lt;br&gt;Seven reasons: power, contribution, harm, stakeholders, education, infractions, trust. &lt;a href=&quot;#p4&quot;&gt;→ 4&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Challenges differ by organization and context&lt;/b&gt;&lt;br&gt;Large and small firms, civil society and the public sector; different industries. &lt;a href=&quot;#p4-ctx&quot;&gt;→ 4&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ A global view is essential&lt;/b&gt;&lt;br&gt;Regional cultures, impacts on stakeholders, race to the bottom. &lt;a href=&quot;#p5&quot;&gt;→ 5&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Method&lt;/b&gt;&lt;br&gt;Morality → ethics → ethical theory: from opinions to arguments, for &lt;em&gt;better&lt;/em&gt; and justifiable decisions. &lt;a href=&quot;#p3&quot;&gt;→ 3&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;more&quot; data-h=&quot;85&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker deep&quot;&gt;Further reading&lt;/div&gt;&lt;h2&gt;Authors, texts and sources cited in the slides&lt;/h2&gt;
  &lt;p&gt;For each reference cited in the slides I searched the web for bibliographic details and a reliable link. Cards labelled &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; contain information taken from the web and &lt;b&gt;not&lt;/b&gt; from the slides.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Bird, F. &amp;amp; Waters, J. A. (1989). “The Moral Muteness of Managers”. &lt;em&gt;California Management Review&lt;/em&gt;, 32(1), 73-88.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The article that gave &lt;em&gt;moral muteness&lt;/em&gt; its name. It analyses why managers avoid describing the moral issues of business in moral terms: they fear undermining harmony, efficiency and their own image of power. It lists the costs (moral amnesia, moral stress, neglected abuses, loss of authority of ethical standards) and proposes remedies. It matters because it explains where the idea that ethics is “optional” comes from. Full text behind a paywall. &lt;a href=&quot;https://cmr.berkeley.edu/1989/11/32-1-the-moral-muteness-of-managers&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record on California Management Review&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wicks, A. C., Freeman, R. E., Werhane, P. H. &amp;amp; Martin, K. E. (2010). &lt;em&gt;Business Ethics: A Managerial Approach&lt;/em&gt;. Prentice Hall / Pearson.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slides 6, 7, 14&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; A textbook for business ethics courses, published in July 2009 with a 2010 copyright, ISBN 9780131427921. Its authors include R. Edward Freeman, the father of stakeholder theory. The chapters cover the language of ethics, stakeholders and strategy, the global marketplace, the functional areas (marketing, finance, management) and environmental sustainability. It matters because it provides the central thesis of the lecture: ethics is an inescapable and useful part of management. &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Schwartz, M. S. &amp;amp; Carroll, A. B. (2003). “Corporate Social Responsibility: A Three-Domain Approach”. &lt;em&gt;Business Ethics Quarterly&lt;/em&gt;, 13(4), 503-530.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; It proposes replacing Carroll&#x27;s CSR pyramid with a diagram of three overlapping domains (economic, legal, ethical) that generates seven categories, useful for classifying a firm&#x27;s responsibilities. This is the source of the typology of legal motives. It has drawn criticism: Fisher (2005), among other things, faults it for a drift towards relativism. &lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-social-responsibility-a-threedomain-approach/0655292E11AC9C9CA33ACD433417518C&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v13y2003i04p503-530_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract on IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A. &amp;amp; Matten, D. (2010). &lt;em&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt;, 3rd ed. Oxford University Press.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; A leading European textbook, ISBN 9780199564330. It revolves around three challenges: corporate citizenship, globalization and sustainability. It is the source of the ERC charts on slide 18; the “Ethical dilemma” box on slide 3 has the textbook&#x27;s typical layout. &lt;a href=&quot;https://vufind.lboro.ac.uk/Record/473219&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record in the Loughborough University catalogue&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A., Matten, D., Glozer, S. &amp;amp; Spence, L. J. (2019). &lt;em&gt;Business Ethics&lt;/em&gt;, 5th ed. Oxford University Press.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; An updated edition of the same textbook (about 600 pages, ISBN 9780198810070), source of the Europe / North America / Asia table. It matters because it is the recent edition: check the tables there if the course syllabus lists it as the set text. &lt;a href=&quot;https://ubffm.hds.hebis.de/Record/HEB451213327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record in the Frankfurt University Library catalogue&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ethics Resource Center (2008). &lt;em&gt;2007 National Nonprofit Ethics Survey: An Inside View of Nonprofit Sector Ethics&lt;/em&gt;. Arlington, VA.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The fourth edition of a longitudinal study of US workplaces. It finds that the nonprofit sector remains the best-rated, but that misconduct there is rising, particularly financial fraud; just over half of employees report having observed at least one instance of misconduct in the past year. The data are self-reported, and their representativeness has been questioned. &lt;a href=&quot;https://assets.corporatecompliance.org/Portals/1/Users/169/29/60329/ERC&#x27;s%20National%20Nonprofit%20Ethics%20Survey.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF of the report (copy on corporatecompliance.org)&lt;/a&gt; · &lt;a href=&quot;https://www.philanthropy.com/news/ethical-standards-erode-at-nonprofit-groups-study-finds/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;article in the Chronicle of Philanthropy&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Race to the bottom&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The hypothesis that countries lower taxes and regulatory, environmental and labour standards to attract investment. The empirical debate is open, with evidence both for and against. &lt;a href=&quot;https://en.wikipedia.org/wiki/Race_to_the_bottom&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry (overview and bibliography)&lt;/a&gt; · &lt;a href=&quot;https://web.williams.edu/Economics/wp/OlneyEmploymentProtectionAndFDI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Olney, working paper on employment protection and FDI (Williams College)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Videos on corporate scandals&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; Links given in the slides, not verified: &lt;a href=&quot;https://www.youtube.com/watch?v=X2ey6OqAxLY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“The 3 craziest corporate scandals of 2017”&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=_QepKsfmfSo&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“10 shocking corporate scandals”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

(function(){

    var steps=st.querySelectorAll(&#x27;.step&#x27;),r=st.querySelector(&#x27;input[type=range]&#x27;),lab=st.querySelector(&#x27;.count&#x27;),i=0;
