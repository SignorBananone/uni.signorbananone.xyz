  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Manuale europeo di riferimento, ISBN 9780199564330. Ruota attorno a tre sfide: corporate citizenship, globalizzazione e sostenibilità. Da qui vengono i grafici ERC della slide 18; il riquadro «Ethical dilemma» della slide 3 ha la grafica tipica del manuale. &lt;a href=&quot;https://vufind.lboro.ac.uk/Record/473219&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda nel catalogo della Loughborough University&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A., Matten, D., Glozer, S. &amp;amp; Spence, L. J. (2019). &lt;em&gt;Business Ethics&lt;/em&gt;, 5ª ed. Oxford University Press.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Edizione aggiornata dello stesso manuale (circa 600 pagine, ISBN 9780198810070), fonte della tabella Europa / Nord America / Asia. Conta perché è l&#x27;edizione recente: confronta lì le tabelle se il programma del corso la indica come testo. &lt;a href=&quot;https://ubffm.hds.hebis.de/Record/HEB451213327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda nel catalogo della biblioteca universitaria di Francoforte&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ethics Resource Center (2008). &lt;em&gt;2007 National Nonprofit Ethics Survey: An Inside View of Nonprofit Sector Ethics&lt;/em&gt;. Arlington, VA.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Quarta edizione di uno studio longitudinale sui luoghi di lavoro negli Stati Uniti. Rileva che il non profit resta il settore valutato meglio, ma che lì il misconduct è in aumento, in particolare la frode finanziaria; poco più di metà dei dipendenti dichiara di aver osservato almeno un episodio scorretto nell&#x27;ultimo anno. Sono dati autodichiarati, e la loro rappresentatività è stata discussa. &lt;a href=&quot;https://assets.corporatecompliance.org/Portals/1/Users/169/29/60329/ERC&#x27;s%20National%20Nonprofit%20Ethics%20Survey.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF del report (copia su corporatecompliance.org)&lt;/a&gt; · &lt;a href=&quot;https://www.philanthropy.com/news/ethical-standards-erode-at-nonprofit-groups-study-finds/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo del Chronicle of Philanthropy&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Race to the bottom&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Ipotesi secondo cui i paesi abbassano tasse e standard regolatori, ambientali e del lavoro per attrarre investimenti. Il dibattito empirico è aperto e ci sono evidenze a favore e contro. &lt;a href=&quot;https://en.wikipedia.org/wiki/Race_to_the_bottom&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce di Wikipedia (panoramica e bibliografia)&lt;/a&gt; · &lt;a href=&quot;https://web.williams.edu/Economics/wp/OlneyEmploymentProtectionAndFDI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Olney, working paper sulla protezione dell&#x27;impiego e gli FDI (Williams College)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Video sugli scandali aziendali&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; Link riportati nelle slide, non verificati: &lt;a href=&quot;https://www.youtube.com/watch?v=X2ey6OqAxLY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;«The 3 craziest corporate scandals of 2017»&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=_QepKsfmfSo&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;«10 shocking corporate scandals»&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

(function(){
