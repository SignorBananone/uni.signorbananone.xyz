  &lt;h3&gt;Si parte da un caso: «No such thing as a free drink?»&lt;/h3&gt;
  &lt;p&gt;La lezione si apre con un &lt;span class=&quot;term&quot;&gt;ethical dilemma&lt;/span&gt; (dilemma etico: una situazione in cui non è ovvio quale sia la scelta giusta, perché valori o interessi legittimi entrano in conflitto). Il riquadro sembra tratto dal manuale di Crane &amp;amp; Matten: grafica e titolo coincidono con i loro «Ethical dilemma».&lt;/p&gt;
  &lt;div class=&quot;card t&quot;&gt;
    &lt;p&gt;&lt;b&gt;Il caso, in breve.&lt;/b&gt; Jenna, una tua amica dell&#x27;università, si lamenta di non avere mai soldi e trova lavoro come barista nel bar degli studenti, dove tu sei cliente abituale. Presto inizia a lamentarsi del manager: dice che la tratta male e le dà i turni e i compiti peggiori. Poi comincia a non farti pagare i drink o a farteli pagare meno, a te e ai tuoi amici. Tu all&#x27;inizio sei a disagio, ma lo sconto fa comodo. Quando provi a parlarne lei minimizza: «Tanto non se ne accorgono, e con come mi trattano se lo meritano».&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Riassunto della slide 3. Il testo del riquadro è piccolo: controlla i dettagli sull&#x27;originale.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;q1&quot;&gt;Di chi è la colpa?&lt;/button&gt;&lt;button data-tab=&quot;q2&quot;&gt;Cosa faresti?&lt;/button&gt;&lt;button data-tab=&quot;q3&quot;&gt;Preferential treatment&lt;/button&gt;&lt;button data-tab=&quot;q4&quot;&gt;Il torto subito la giustifica?&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q1&quot;&gt;&lt;p&gt;&lt;b&gt;Chi sbaglia: Jenna, tu, entrambi, nessuno?&lt;/b&gt; Jenna sottrae valore al datore di lavoro, ma anche tu ne trai un beneficio consapevole. È una questione di &lt;span class=&quot;term&quot;&gt;complicity&lt;/span&gt; (complicità): ricevere un vantaggio sapendo da dove viene non è un comportamento neutro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q2&quot;&gt;&lt;p&gt;&lt;b&gt;Come gestiresti la cosa?&lt;/b&gt; Le opzioni sono tacere, chiedere a Jenna di smettere, rifiutare gli sconti o segnalarla. Ognuna ha un costo: l&#x27;amicizia, il tuo portafoglio, il lavoro di lei. Il caso fa vedere che anche le scelte quotidiane hanno una dimensione etica, ben prima di quelle dei grandi manager.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q3&quot;&gt;&lt;p&gt;&lt;b&gt;È diverso da altre forme di trattamento di favore?&lt;/b&gt; Per esempio servirti prima di altri clienti in coda. In entrambi i casi un amico riceve un privilegio, ma lo sconto sottrae denaro all&#x27;impresa e il «salto della coda» toglie tempo agli altri clienti. Confrontare i due casi obbliga a dire &lt;em&gt;perché&lt;/em&gt; uno ci sembra più grave dell&#x27;altro: è il passaggio dall&#x27;opinione all&#x27;argomentazione (vedi &lt;a href=&quot;#p3&quot;&gt;sezione 3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;q4&quot;&gt;&lt;p&gt;&lt;b&gt;Il fatto che Jenna sia trattata male giustifica il suo comportamento?&lt;/b&gt; Può spiegarlo, ma spiegare non è giustificare. Il caso mette in luce una tensione tipica della business ethics: un&#x27;ingiustizia subita (forse reale) usata per legittimare un&#x27;altra scorrettezza.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Business ethics: un ossimoro?&lt;/h3&gt;
  &lt;p&gt;Un &lt;span class=&quot;term&quot;&gt;oxymoron&lt;/span&gt; (ossimoro) è un&#x27;espressione che accosta termini in apparente contraddizione: «silenzio assordante», «ghiaccio bollente». Secondo una battuta diffusa, anche &lt;em&gt;business ethics&lt;/em&gt; lo sarebbe: affari ed etica non starebbero insieme. La slide 4 chiede cosa significhi questa idea e quali conseguenze abbia, e propone due letture:&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;imm&quot;&gt;Immorality of business&lt;/button&gt;&lt;button data-tab=&quot;amo&quot;&gt;Amorality of business&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;imm&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il business è &lt;em&gt;immorale&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Gli affari sarebbero &lt;b&gt;contrari&lt;/b&gt; all&#x27;etica: profitto, competizione e interesse personale spingerebbero per loro natura a comportamenti scorretti. In questa lettura l&#x27;etica degli affari è impossibile, perché chi vuole restare onesto perde.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Contro-argomento: molte imprese prosperano proprio grazie alla fiducia, e gli scandali (slide 9-10) ci indignano perché &lt;em&gt;ci aspettiamo&lt;/em&gt; comportamenti corretti.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;amo&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il business è &lt;em&gt;amorale&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Gli affari sarebbero &lt;b&gt;estranei&lt;/b&gt; all&#x27;etica: un ambito tecnico in cui contano numeri, efficienza e legge, mentre le domande morali «non c&#x27;entrano». È la lettura più insidiosa, perché porta i manager a non usare il linguaggio etico, cioè alla &lt;a href=&quot;#p1-mute&quot;&gt;moral muteness&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Contro-argomento: ogni decisione aziendale tocca persone (dipendenti, clienti, comunità), quindi ha comunque effetti morali.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;p1-mute&quot;&gt;The Moral Muteness of Managers &lt;span class=&quot;small&quot;&gt;(Bird &amp;amp; Waters, 1989)&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Perché è difficile parlare di etica in azienda? Secondo Bird e Waters la maggior parte dei manager soffre di &lt;span class=&quot;term&quot;&gt;moral muteness&lt;/span&gt; («mutismo morale»): sono a disagio nell&#x27;usare il linguaggio dell&#x27;etica nel loro ruolo di manager. Le slide indicano tre motivi, legati a come vedono l&#x27;etica:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Una disciplina troppo tecnica&lt;/summary&gt;&lt;div&gt;La vedono come un sapere che richiede una laurea avanzata per essere decifrato, e non si sentono abbastanza qualificati per usarlo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una questione di colpe&lt;/summary&gt;&lt;div&gt;Parlare di etica significherebbe parlare di &lt;em&gt;blame and fault&lt;/em&gt; (biasimo e colpa): accusare qualcuno, creare conflitto.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa idealistica&lt;/summary&gt;&lt;div&gt;L&#x27;etica sembra idealismo, mentre il management sarebbe fatto di &lt;em&gt;hard numbers&lt;/em&gt; e risultati pratici.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Due checklist mentali separate: decisione di business e decisione etica&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;160&quot; rx=&quot;14&quot; class=&quot;fill-card stroke-d&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;40&quot; y=&quot;54&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Business decision&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;92&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ What might I gain?&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;122&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ How will it affect the future?&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;160&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;numeri, risultati&lt;/text&gt;
      &lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;160&quot; rx=&quot;14&quot; class=&quot;fill-t stroke-d&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;460&quot; y=&quot;54&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Ethical decision&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;92&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ Is this fair?&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;122&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot;&gt;☐ Will people be hurt?&lt;/text&gt;
      &lt;text x=&quot;460&quot; y=&quot;160&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;equità, danni alle persone&lt;/text&gt;
      &lt;path d=&quot;M330 100 L430 100&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 6&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; class=&quot;fill-acc&quot; font-size=&quot;22&quot;&gt;✕&lt;/text&gt;
      &lt;text x=&quot;380&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot;&gt;«Ethics is (or was) widely viewed as optional to business and largely unconnected»&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;La vignetta della slide 5, ridisegnata: due checklist mentali tenute separate. Il messaggio della lezione è che vanno unite.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;abstract dell&#x27;articolo (&lt;a href=&quot;https://cmr.berkeley.edu/1989/11/32-1-the-moral-muteness-of-managers&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;California Management Review&lt;/a&gt;) aggiunge che i manager vivono il discorso morale come una minaccia all&#x27;armonia dell&#x27;organizzazione, alla propria efficacia e al proprio potere. Elenca anche i costi del mutismo: &lt;em&gt;moral amnesia&lt;/em&gt; (si dimentica la dimensione etica delle decisioni), stress morale per i singoli, abusi trascurati, standard etici con meno autorità.&lt;/div&gt;

  &lt;h3&gt;L&#x27;etica non è un optional&lt;/h3&gt;
  &lt;blockquote&gt;But the truth is that while our particular choice of morals in business is optional, whether we &lt;b&gt;have&lt;/b&gt; morals in business is not! Ethics is not an option, it is an inescapable part of what means to be human, and that includes what we do in business.&lt;cite&gt;Wicks, Freeman, Werhane e Martin, 2010, p. 2 · slide 6&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In altre parole: possiamo scegliere &lt;em&gt;quali&lt;/em&gt; valori seguire, ma non possiamo decidere di non averne. Anche «non pensarci» è una scelta con conseguenze morali. La vignetta della slide 6 lo rende con ironia: «La tua azienda ha un enorme problema di corruzione…» / «Mille dollari se non lo racconti in giro!».&lt;/p&gt;
  &lt;blockquote&gt;Managers must see ethics not only as an integral part of management but also as something that can help them and their organization to achieve excellence.&lt;cite&gt;Wicks, Freeman, Werhane e Martin, 2010, p. 3 · slide 7&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Qui il punto si rovescia: l&#x27;etica non è solo un vincolo da rispettare, è una risorsa per l&#x27;&lt;em&gt;excellence&lt;/em&gt; (eccellenza) dell&#x27;organizzazione.&lt;/p&gt;

  &lt;h3 id=&quot;p1-def&quot;&gt;La definizione&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Business ethics&lt;/b&gt; is the study of business situations, activities, and decisions where issues of &quot;right and wrong&quot;, values and purposes are addressed. &lt;span class=&quot;small&quot;&gt;(slide 8)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;È lo studio delle situazioni, attività e decisioni aziendali in cui entrano in gioco questioni di giusto e sbagliato, valori e scopi.&lt;/span&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 140&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione della definizione&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;OGGETTO&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;situations · activities&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;decisions&lt;/text&gt;
        &lt;rect x=&quot;265&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;QUESTIONI&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;right and wrong&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;values · purposes&lt;/text&gt;
        &lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;100&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;NATURA&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;uno &lt;tspan font-style=&quot;italic&quot;&gt;study&lt;/tspan&gt;: riflessione&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;non un elenco di regole&lt;/text&gt;
        &lt;path d=&quot;M242 70 L262 70 M497 70 L517 70&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;p&gt;Subito dopo la slide pone la domanda che apre la &lt;a href=&quot;#p2&quot;&gt;sezione 2&lt;/a&gt;: &lt;b&gt;«Why we need ethics if we have the law?»&lt;/b&gt;, perché serve l&#x27;etica se c&#x27;è già la legge?&lt;/p&gt;

  &lt;h3&gt;Corporate scandals&lt;/h3&gt;
  &lt;p&gt;Le slide 9-10 rimandano a due video sugli scandali aziendali («The 3 craziest corporate scandals of 2017», «10 shocking corporate scandals»; link in &lt;a href=&quot;#more&quot;&gt;Per approfondire&lt;/a&gt;) e chiedono:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa c&#x27;è di sbagliato in queste storie?&lt;/summary&gt;&lt;div&gt;Di solito qualcuno è stato danneggiato (risparmiatori, consumatori, dipendenti, ambiente) da chi aveva più potere o più informazioni, e spesso è stata tradita la fiducia.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché le sentiamo «wrong», «unfair», «scandals»?&lt;/summary&gt;&lt;div&gt;Perché violano norme e valori condivisi (la &lt;a href=&quot;#p3&quot;&gt;morality&lt;/a&gt;), anche quando non c&#x27;è ancora una sentenza. L&#x27;indignazione è già un giudizio morale.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che ruolo ha la legge nel prevenire gli abusi?&lt;/summary&gt;&lt;div&gt;La legge arriva spesso dopo, non copre tutto e può essere aggirata (vedi l&#x27;&lt;em&gt;opportunistic compliance&lt;/em&gt; nella &lt;a href=&quot;#p2-motives&quot;&gt;sezione 2&lt;/a&gt;). Da sola non basta.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;C&#x27;è spazio per parlare e studiare business ethics?&lt;/summary&gt;&lt;div&gt;Sì: proprio dove la legge tace o resta indietro c&#x27;è bisogno di giudizio etico. Questa è la risposta che prepara la sezione successiva.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Amorality significa che il business sarebbe estraneo all&#x27;etica, non contrario. Immorality significa contrario.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; «In azienda contano i numeri, le questioni morali semplicemente non c&#x27;entrano.» Quale lettura dell&#x27;ossimoro esprime?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Immorality of business&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Amorality of business&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Cos&#x27;è la moral muteness e da quali tre percezioni dell&#x27;etica nasce?&lt;/summary&gt;&lt;div&gt;Il disagio dei manager a usare il linguaggio etico nel loro ruolo (Bird &amp;amp; Waters, 1989). Vedono l&#x27;etica come (a) disciplina troppo tecnica, (b) questione di biasimo e colpa, (c) impresa idealistica, lontana da numeri e risultati.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Cosa vogliono dire Wicks et al. con «our choice of morals is optional, whether we have morals is not»?&lt;/summary&gt;&lt;div&gt;Si può scegliere quali valori adottare, ma non si può non averne: ogni decisione aziendale ha comunque una dimensione morale.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Ripeti la definizione di business ethics e individuane le tre componenti.&lt;/summary&gt;&lt;div&gt;«The study of business situations, activities, and decisions where issues of right and wrong, values and purposes are addressed». Oggetto (situazioni, attività, decisioni), questioni (giusto/sbagliato, valori, scopi), natura (uno studio).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p2&quot; data-h=&quot;85&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Ethics and the law&lt;/div&gt;&lt;h2&gt;Etica e legge: perché non basta la legge&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 8, 11-12&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Etica e legge si sovrappongono solo in parte. La slide 11 le rappresenta come due cerchi: l&#x27;intersezione contiene ciò che entrambe regolano, le due «lune» esterne ciò che riguarda solo l&#x27;una o solo l&#x27;altra. &lt;b&gt;Clicca sulle zone del diagramma.&lt;/b&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;venn&quot; viewBox=&quot;0 0 740 330&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn tra etica e legge, cliccabile&quot; style=&quot;cursor:pointer&quot;&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;170&quot; r=&quot;130&quot; style=&quot;fill:oklch(var(--tint-l) 0.01 60);stroke:var(--ink)&quot; stroke-width=&quot;1.5&quot; id=&quot;vE&quot;/&gt;
      &lt;circle cx=&quot;440&quot; cy=&quot;170&quot; r=&quot;130&quot; style=&quot;fill:oklch(var(--tint-l) 0.05 140);stroke:var(--ink);fill-opacity:.75&quot; stroke-width=&quot;1.5&quot; id=&quot;vL&quot;/&gt;
      &lt;text x=&quot;230&quot; y=&quot;30&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Ethics&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;320&quot; class=&quot;svg-ink&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;Law&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Grey area&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;solo etica&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;Covered by&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;both law&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;14&quot;&gt;and ethics&lt;/text&gt;
      &lt;text x=&quot;510&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Solo legge&lt;/text&gt;
      &lt;path id=&quot;vHi&quot; d=&quot;&quot; style=&quot;fill:none;stroke:var(--acc)&quot; stroke-width=&quot;4&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tabbar&quot; id=&quot;vennBtns&quot;&gt;&lt;button class=&quot;btn&quot; data-r=&quot;e&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;b&quot;&gt;Etica + legge&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;l&quot;&gt;Solo legge&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot; id=&quot;vennInfo&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Scegli una zona per leggerne il significato.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;p&gt;La &lt;b&gt;grey area&lt;/b&gt; è il territorio dei veri &lt;span class=&quot;term&quot;&gt;ethical dilemmas&lt;/span&gt;: la legge non dice nulla, quindi la decisione resta all&#x27;impresa e al suo giudizio. Ecco perché, anche con un ordinamento giuridico, serve l&#x27;etica: &lt;b&gt;la legge non copre tutto, arriva spesso in ritardo e varia da paese a paese&lt;/b&gt; (come si vedrà nella &lt;a href=&quot;#p5&quot;&gt;sezione 5&lt;/a&gt;). Per lo più la legge fissa un minimo, mentre l&#x27;etica chiede di andare oltre.&lt;/p&gt;

  &lt;h4&gt;Prova tu: in quale zona cade?&lt;/h4&gt;
  &lt;p class=&quot;small&quot;&gt;Esempi costruiti per l&#x27;esercizio, non presenti nelle slide (tranne il primo e l&#x27;ultimo).&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;È l&#x27;esempio della slide: in molti ordinamenti è legale (o non regolato), ma è fortemente discutibile sul piano morale.&quot;&gt;
      &lt;p&gt;Vendere mine antiuomo a un regime oppressivo, dove non è vietato.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Entrambe&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Solo legge&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;La frode è vietata dalla legge ed è anche moralmente sbagliata.&quot;&gt;
      &lt;p&gt;Truccare il bilancio per nascondere perdite agli investitori.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Entrambe&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Solo legge&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;Se il contratto lo consente è legale, ma sfruttare la propria forza contrattuale su fornitori piccoli e dipendenti solleva questioni di equità.&quot;&gt;
      &lt;p&gt;Una grande catena paga i piccoli fornitori a 180 giorni perché il contratto lo consente.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Entrambe&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Solo legge&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card mcq&quot; data-why=&quot;È l&#x27;esempio della slide: una regola di coordinamento. Destra o sinistra sono moralmente equivalenti, conta che tutti facciano lo stesso.&quot;&gt;
      &lt;p&gt;Guidare sul lato destro della strada.&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Grey area&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Entrambe&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Solo legge&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;p2-motives&quot;&gt;Perché le imprese rispettano la legge? I legal motives&lt;/h3&gt;
  &lt;p&gt;Anche rispettare la legge può avvenire per ragioni molto diverse. La slide 12 riprende la classificazione dei &lt;span class=&quot;term&quot;&gt;legal motives&lt;/span&gt; (motivazioni legali) dal &lt;span class=&quot;term&quot;&gt;three-domain CSR model&lt;/span&gt; di Schwartz e Carroll (2003); nella slide il titolo dice «CRS», ma l&#x27;articolo parla di CSR, &lt;span class=&quot;term&quot;&gt;Corporate Social Responsibility&lt;/span&gt;, cioè la responsabilità sociale d&#x27;impresa.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Il modello (&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-social-responsibility-a-threedomain-approach/0655292E11AC9C9CA33ACD433417518C&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Ethics Quarterly, 2003&lt;/a&gt;) sostituisce la famosa «piramide» della CSR di Carroll (1991) con tre cerchi sovrapposti: dominio &lt;b&gt;economic&lt;/b&gt;, &lt;b&gt;legal&lt;/b&gt; ed &lt;b&gt;ethical&lt;/b&gt;. Dalle sovrapposizioni nascono sette categorie. Le motivazioni della slide descrivono il cerchio &lt;em&gt;legal&lt;/em&gt;, cioè i diversi modi in cui un&#x27;impresa si rapporta alla legge.&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Scala dei legal motives da passivo a proattivo&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;path d=&quot;M30 60 L730 60&quot; style=&quot;stroke:var(--acc)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; class=&quot;svg-ink&quot;&gt;
        &lt;circle cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;38&quot;&gt;Passive&lt;/text&gt;
        &lt;circle cx=&quot;230&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;38&quot;&gt;Restrictive&lt;/text&gt;
        &lt;circle cx=&quot;380&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;38&quot;&gt;Opportunistic&lt;/text&gt;
        &lt;circle cx=&quot;530&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;38&quot;&gt;Avoid. civil litigation&lt;/text&gt;
        &lt;circle cx=&quot;680&quot; cy=&quot;60&quot; r=&quot;9&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;38&quot;&gt;Anticipation&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;30&quot; y=&quot;98&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;inconsapevole&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;98&quot; text-anchor=&quot;end&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;guarda avanti&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Una lettura nostra (non della slide): dal rispetto inconsapevole all&#x27;anticipazione proattiva. L&#x27;opportunistic compliance usa la legge in modo strumentale.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;m1&quot;&gt;Passive / accidental&lt;/button&gt;&lt;button data-tab=&quot;m2&quot;&gt;Restrictive&lt;/button&gt;&lt;button data-tab=&quot;m3&quot;&gt;Opportunistic&lt;/button&gt;&lt;button data-tab=&quot;m4&quot;&gt;Avoidance of civil litigation&lt;/button&gt;&lt;button data-tab=&quot;m5&quot;&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m1&quot;&gt;&lt;h4&gt;Passive / accidental compliance &lt;span class=&quot;small&quot;&gt;(fuori dal dominio legale)&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Descrizione:&lt;/b&gt; rispetto &lt;em&gt;non intenzionale o inconsapevole&lt;/em&gt; di leggi e regolamenti.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio della slide:&lt;/b&gt; guidare sotto il limite di velocità perché la strada è in cattive condizioni, non per il codice della strada.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Si rispetta la legge per caso: il motivo vero è un altro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m2&quot;&gt;&lt;h4&gt;Restrictive compliance&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Descrizione:&lt;/b&gt; rispetto &lt;em&gt;intenzionale&lt;/em&gt; di leggi che limitano l&#x27;azione.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio della slide:&lt;/b&gt; rispettare gli standard sulle emissioni nel processo produttivo.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;L&#x27;impresa farebbe altrimenti, ma la legge glielo impedisce e lei obbedisce.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m3&quot;&gt;&lt;h4&gt;Opportunistic compliance&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Descrizione:&lt;/b&gt; cercare l&#x27;opzione &lt;em&gt;più redditizia&lt;/em&gt; dentro il sistema legale.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio della slide:&lt;/b&gt; localizzare l&#x27;attività dove i controlli sono più deboli o le tasse più basse.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Formalmente legale, ma è la porta d&#x27;ingresso della &lt;a href=&quot;#p5-race&quot;&gt;race to the bottom&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m4&quot;&gt;&lt;h4&gt;Avoidance of civil litigation&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Descrizione:&lt;/b&gt; agire soprattutto per &lt;em&gt;evitare cause civili&lt;/em&gt; per negligenza.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio della slide:&lt;/b&gt; richiamare volontariamente prodotti con difetti di qualità.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Il motore è il rischio legale ed economico di essere citati in giudizio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel card t&quot; data-panel=&quot;m5&quot;&gt;&lt;h4&gt;Anticipation of law&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Descrizione:&lt;/b&gt; agire in base ai &lt;em&gt;cambiamenti di legge attesi&lt;/em&gt;, per esempio guardando a leggi già in vigore in altri ordinamenti.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio della slide:&lt;/b&gt; adottare tecnologie produttive con standard ambientali più alti di quelli obbligatori, ma già ampiamente accettati a livello internazionale.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;L&#x27;impresa si muove prima del legislatore.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Spostare la sede dove le tasse sono più basse è legale e massimizza il profitto entro le regole: è opportunistic compliance.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; Un&#x27;azienda sposta la sede fiscale in un paese a bassa tassazione, in modo del tutto legale. Quale legal motive?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Restrictive&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Opportunistic&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Adeguarsi oggi a una norma attesa (già diffusa altrove) è anticipation of law.&quot;&gt;
      &lt;p&gt;&lt;b&gt;2.&lt;/b&gt; Un produttore elimina in anticipo una sostanza già vietata nell&#x27;UE, anche se nel suo paese è ancora ammessa. Quale legal motive?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Avoidance of civil litigation&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Passive&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Anticipation of law&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;3. Perché serve l&#x27;etica se c&#x27;è la legge? Dai almeno tre ragioni.&lt;/summary&gt;&lt;div&gt;(a) La legge non copre tutto: c&#x27;è la grey area. (b) Arriva spesso dopo i problemi. (c) Varia tra paesi e può essere sfruttata in modo opportunistico. (d) Rispettare la legge non dice nulla sul &lt;em&gt;perché&lt;/em&gt; lo si fa, e le motivazioni contano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Fai un esempio di ciò che è «covered by law but not by ethics».&lt;/summary&gt;&lt;div&gt;Il lato della strada su cui si guida, o molte norme puramente tecniche e di coordinamento: il contenuto è moralmente indifferente, conta che esista una regola comune.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p3&quot; data-h=&quot;250&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Morality, ethics, ethical theory&lt;/div&gt;&lt;h2&gt;Dalle opinioni alle argomentazioni&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 13-16&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;A cosa serve allora la business ethics? La slide 13 risponde in tre passaggi:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Answers, or at least tools&lt;/h4&gt;&lt;p&gt;Offre risposte, o almeno &lt;b&gt;strumenti&lt;/b&gt;, per capire &lt;em&gt;perché&lt;/em&gt; certe decisioni vanno valutate come etiche o non etiche, giuste o sbagliate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Better, not right&lt;/h4&gt;&lt;p&gt;Aiuta a prendere decisioni &lt;b&gt;&lt;em&gt;migliori&lt;/em&gt;&lt;/b&gt;, che non sono per forza quelle inequivocabilmente &lt;em&gt;giuste&lt;/em&gt;. È soprattutto &lt;b&gt;developing good judgement&lt;/b&gt;: sviluppare buon giudizio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Accountable&lt;/h4&gt;&lt;p&gt;Il ragionamento etico ci rende capaci di &lt;b&gt;be accountable&lt;/b&gt; verso gli altri, cioè di rendere conto delle nostre scelte e giustificarle.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote&gt;Ethics refers to our efforts to figure out what we should do and how we should live. […] It involves the challenge of figuring out how to justify our behavior – both to ourselves and to others (in business, e.g., to shareholders, employees, and the public). Taking ethics seriously involves the admission that other people have inherent worth and dignity, so that our decisions […] need to be backed up with good reasons.&lt;cite&gt;Wicks et al., 2010, p. 4 · slide 14&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Il nucleo è qui: se gli altri hanno &lt;em&gt;dignità&lt;/em&gt; e valore in sé, le decisioni che li toccano vanno &lt;b&gt;giustificate con buone ragioni&lt;/b&gt;. Non basta dire «secondo me». Compaiono già alcuni &lt;span class=&quot;term&quot;&gt;stakeholders&lt;/span&gt; (portatori di interesse: chiunque influenzi o sia influenzato dall&#x27;attività dell&#x27;impresa), cioè &lt;em&gt;shareholders&lt;/em&gt; (azionisti), &lt;em&gt;employees&lt;/em&gt; (dipendenti) e &lt;em&gt;the public&lt;/em&gt;.&lt;/p&gt;

  &lt;h4&gt;Opinione o argomentazione? Prova a trasformarla&lt;/h4&gt;
  &lt;div class=&quot;stepper&quot; aria-label=&quot;Da opinione ad argomentazione&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Passo 1 · Opinione&lt;/p&gt;&lt;p class=&quot;lede&quot;&gt;«Delocalizzare la fabbrica in Asia è sbagliato.»&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;È un giudizio, ma non dice perché: non si può discutere né verificare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Passo 2 · Chi è coinvolto?&lt;/p&gt;&lt;p&gt;Dipendenti italiani (perdono il lavoro), lavoratori asiatici (ottengono lavoro, ma a quali condizioni?), azionisti (costi più bassi), consumatori (prezzi), comunità locale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Passo 3 · Quali ragioni e valori?&lt;/p&gt;&lt;p&gt;Equità verso chi ha contribuito all&#x27;impresa per anni; rispetto della dignità dei nuovi lavoratori; dovere verso gli azionisti; sostenibilità della comunità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Passo 4 · Obiezioni&lt;/p&gt;&lt;p&gt;«Senza ridurre i costi l&#x27;impresa fallisce e tutti perdono il lavoro.» Un&#x27;argomentazione seria considera anche le ragioni contrarie.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;Passo 5 · Argomentazione&lt;/p&gt;&lt;p class=&quot;lede&quot;&gt;«Delocalizzare può essere giustificato se è necessario alla sopravvivenza dell&#x27;impresa, ma solo garantendo condizioni di lavoro dignitose all&#x27;estero e un accompagnamento dei lavoratori licenziati.»&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Ora è una posizione di cui si può rendere conto (&lt;em&gt;accountable&lt;/em&gt;) davanti agli stakeholder. Esempio costruito per l&#x27;esercizio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; aria-label=&quot;Passo precedente&quot;&gt;←&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Passo&quot;&gt;&lt;button class=&quot;btn next&quot; aria-label=&quot;Passo successivo&quot;&gt;→&lt;/button&gt;&lt;span class=&quot;count small&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Morality, ethics, ethical theory&lt;/h3&gt;
  &lt;p&gt;La slide 15 distingue tre termini che nel linguaggio comune si usano come sinonimi:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Morality&lt;/b&gt; is concerned with the &lt;em&gt;norms, values and beliefs&lt;/em&gt; embedded in social processes which define right and wrong for an individual or a community.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;La morale è l&#x27;insieme di norme, valori e credenze radicati nei processi sociali, che definiscono giusto e sbagliato per un individuo o una comunità. È qualcosa che &lt;em&gt;si vive&lt;/em&gt;.&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethics&lt;/b&gt; is concerned with the study of morality and the &lt;em&gt;application of reasons&lt;/em&gt; to elucidate specific rules and principles that determine right and wrong for any given situation.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;L&#x27;etica è lo studio della morale: usa le ragioni per chiarire regole e principi che stabiliscono giusto e sbagliato in una situazione. È qualcosa su cui &lt;em&gt;si riflette&lt;/em&gt;.&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethical theories&lt;/b&gt;: these rules and principles.&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Le teorie etiche sono le regole e i principi così elaborati.&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; aria-label=&quot;Catena morality, ethics, ethical theory&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Catena in quattro blocchi&quot; id=&quot;chainSvg&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;10&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Morality&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;207&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;282&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Ethics&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;404&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;479&quot; y=&quot;70&quot; class=&quot;svg-ink&quot;&gt;Ethical theory&lt;/text&gt;
        &lt;rect class=&quot;cb&quot; x=&quot;601&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;676&quot; y=&quot;62&quot; class=&quot;svg-ink&quot;&gt;Potential&lt;/text&gt;&lt;text x=&quot;676&quot; y=&quot;80&quot; class=&quot;svg-ink&quot;&gt;solutions&lt;/text&gt;
        &lt;path d=&quot;M162 65 L204 65 M359 65 L401 65 M556 65 L598 65&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;text x=&quot;183&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;rationalizes&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;to produce&lt;/text&gt;&lt;text x=&quot;577&quot; y=&quot;25&quot; class=&quot;svg-muted&quot; font-size=&quot;11&quot;&gt;applied to&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;1 · Morality&lt;/p&gt;&lt;p&gt;Nel caso del bar (&lt;a href=&quot;#p1&quot;&gt;sezione 1&lt;/a&gt;) sentiamo che «non si prende ciò che non è nostro» e che «gli amici si aiutano». Sono convinzioni morali: le abbiamo assorbite dalla comunità, spesso senza averle mai esaminate, e qui entrano in conflitto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;2 · Ethics rationalizes morality…&lt;/p&gt;&lt;p&gt;L&#x27;etica prende queste convinzioni e le esamina con la ragione: &lt;em&gt;perché&lt;/em&gt; rubare è sbagliato? Il torto subito da Jenna cambia qualcosa? Quali principi sono in gioco?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;3 · …to produce ethical theory…&lt;/p&gt;&lt;p&gt;Il ragionamento si condensa in principi generali, le teorie etiche, che non valgono solo per questo caso. Per esempio un principio che guarda alle &lt;em&gt;conseguenze&lt;/em&gt; delle azioni, o uno che guarda ai &lt;em&gt;doveri&lt;/em&gt; e ai diritti. &lt;span class=&quot;small&quot;&gt;(Esempi indicativi: le singole teorie non sono trattate in queste slide.)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p class=&quot;kicker deep&quot;&gt;4 · …that can be applied to any situation&lt;/p&gt;&lt;p&gt;Le teorie offrono &lt;b&gt;potential solutions to ethical problems&lt;/b&gt;: soluzioni &lt;em&gt;possibili&lt;/em&gt;, non certe. Torna il punto della slide 13, decisioni &lt;em&gt;migliori&lt;/em&gt; e non per forza &lt;em&gt;giuste&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; aria-label=&quot;Passo precedente&quot;&gt;←&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Passo&quot;&gt;&lt;button class=&quot;btn next&quot; aria-label=&quot;Passo successivo&quot;&gt;→&lt;/button&gt;&lt;span class=&quot;count small&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;style&gt;#chainSvg .cb{fill:var(--card);stroke:var(--rule);stroke-width:1.5;transition:fill .3s}#chainSvg .cb.on{fill:oklch(var(--tint-l) 0.06 250);stroke:oklch(var(--deep-l) var(--deep-c) 250);stroke-width:2.5}&lt;/style&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Le norme e credenze condivise da una comunità sono morality. L&#x27;etica è lo studio riflessivo di quelle norme.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; «In questa azienda è normale che i capi non rispondano alle email nel weekend e nessuno lo considera scorretto.» È…&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Morality&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Ethics&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Ethical theory&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Perché la business ethics punta a decisioni «better» e non «right»?&lt;/summary&gt;&lt;div&gt;Perché nei dilemmi raramente c&#x27;è un&#x27;unica risposta inequivocabile: lo scopo è sviluppare &lt;em&gt;good judgement&lt;/em&gt;, cioè la capacità di scegliere bene e di giustificare la scelta.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Che legame c&#x27;è tra dignità delle persone e obbligo di giustificare?&lt;/summary&gt;&lt;div&gt;Se gli altri hanno &lt;em&gt;inherent worth and dignity&lt;/em&gt; (Wicks et al.), non possiamo trattarli come semplici mezzi: le decisioni che li toccano vanno sostenute con buone ragioni, di cui siamo &lt;em&gt;accountable&lt;/em&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Ricostruisci la catena della slide 16.&lt;/summary&gt;&lt;div&gt;Morality → (ethics rationalizes morality) → Ethics → (to produce) → Ethical theory → (that can be applied to any situation) → Potential solutions to ethical problems.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p4&quot; data-h=&quot;25&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Why is business ethics important?&lt;/div&gt;&lt;h2&gt;Perché conta, e come cambia nei diversi contesti&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 17-20&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;La slide 17 elenca sette ragioni. Si possono leggere in tre gruppi: il &lt;b&gt;peso&lt;/b&gt; delle imprese nella società (1-3), la &lt;b&gt;pressione&lt;/b&gt; esterna (4) e i &lt;b&gt;problemi aperti&lt;/b&gt; (5-7). Apri le schede.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Tre gruppi di ragioni&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;330&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;175&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Peso del business&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;1 potere · 2 contributo · 3 danno&lt;/text&gt;
        &lt;rect x=&quot;355&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Pressione&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;4 stakeholder&lt;/text&gt;
        &lt;rect x=&quot;510&quot; y=&quot;10&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;fill-t&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;42&quot; class=&quot;svg-ink&quot; font-weight=&quot;600&quot;&gt;Problemi aperti&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;66&quot; class=&quot;svg-muted&quot; font-size=&quot;13&quot;&gt;5 formazione · 6 infrazioni · 7 fiducia&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Raggruppamento proposto per memorizzare: la slide le presenta come un elenco numerato.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details&gt;&lt;summary&gt;1 · Power and influence of business in society&lt;/summary&gt;&lt;div&gt;Le grandi imprese hanno risorse paragonabili a quelle di interi stati e influenzano lavoro, consumi, ambiente e politica. Più potere significa più responsabilità per come lo si usa.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;2 · Potential to provide major contribution to society&lt;/summary&gt;&lt;div&gt;Le imprese producono beni, servizi, occupazione, innovazione e gettito fiscale. L&#x27;etica aiuta a orientare questo potenziale verso il bene comune.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;3 · Potential to inflict harm on individuals, society and the environment&lt;/summary&gt;&lt;div&gt;Lo stesso potere può nuocere: prodotti pericolosi, inquinamento, sfruttamento, crisi finanziarie. Gli scandali della &lt;a href=&quot;#p1&quot;&gt;sezione 1&lt;/a&gt; ne sono esempi.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;4 · Increasing demands from stakeholders&lt;/summary&gt;&lt;div&gt;Consumatori, investitori, dipendenti, ONG e media chiedono sempre più spesso alle imprese di rendere conto dei loro comportamenti. È l&#x27;&lt;em&gt;accountability&lt;/em&gt; della &lt;a href=&quot;#p3&quot;&gt;sezione 3&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;5 · Lack of business ethics education or training&lt;/summary&gt;&lt;div&gt;Senza formazione mancano parole e strumenti per affrontare i dilemmi, e si torna alla &lt;a href=&quot;#p1-mute&quot;&gt;moral muteness&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;6 · Continued occurrence of ethical infractions&lt;/summary&gt;&lt;div&gt;Le violazioni continuano a verificarsi, in tutti i settori, come mostrano i dati qui sotto.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;7 · Businesses face a trust deficit&lt;/summary&gt;&lt;div&gt;Le imprese soffrono di un &lt;span class=&quot;term&quot;&gt;trust deficit&lt;/span&gt; (deficit di fiducia): il pubblico tende a non fidarsi. Un comportamento etico è la condizione per recuperare legittimità.&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;p4-ctx&quot;&gt;Il malcostume non è solo «business»&lt;/h3&gt;
  &lt;p&gt;La slide 18 riporta due grafici da Crane &amp;amp; Matten (2010), basati sulle survey dell&#x27;Ethics Resource Center (2007): il misconduct, cioè il comportamento scorretto osservato dai dipendenti, esiste in imprese, non profit e pubblica amministrazione.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;h4&gt;Tipi di misconduct per settore&lt;/h4&gt;
      &lt;div class=&quot;tabbar&quot; id=&quot;barBtns&quot;&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;0&quot;&gt;Nonprofit&lt;/button&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;1&quot;&gt;Business&lt;/button&gt;&lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;2&quot;&gt;Government&lt;/button&gt;&lt;/div&gt;
      &lt;svg id=&quot;bars&quot; viewBox=&quot;0 0 420 270&quot; role=&quot;img&quot; aria-label=&quot;Grafico a barre del misconduct per settore&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;% di dipendenti che ha osservato il comportamento. Fonte nella slide: Ethics Resource Center (2008), &lt;em&gt;2007 National Nonprofit Ethics Survey&lt;/em&gt;, in Crane &amp;amp; Matten (2010), fig. 1.3. Valori letti dalla slide.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;h4&gt;Misconduct osservato nel tempo&lt;/h4&gt;
      &lt;svg id=&quot;lines&quot; viewBox=&quot;0 0 420 270&quot; role=&quot;img&quot; aria-label=&quot;Grafico a linee del misconduct osservato 2000-2007&quot;&gt;&lt;/svg&gt;
      &lt;label class=&quot;small&quot; for=&quot;yr&quot;&gt;Anno: &lt;b id=&quot;yrLab&quot;&gt;2007&lt;/b&gt;&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;yr&quot; min=&quot;0&quot; max=&quot;3&quot; value=&quot;3&quot; step=&quot;1&quot;&gt;
      &lt;div id=&quot;yrOut&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Crane &amp;amp; Matten (2010), fig. 1.4. Valori letti dalla slide. L&#x27;attribuzione delle linee ai settori è ricostruita da noi in base a colori e posizioni: verificala sull&#x27;originale.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Come leggerli:&lt;/b&gt; più di metà dei dipendenti, in tutti e tre i settori, dichiara di aver visto comportamenti scorretti. Il settore pubblico risulta il più colpito e il non profit, spesso percepito come «più etico», non ne è immune: nel 2007 si avvicina agli altri. La business ethics quindi riguarda &lt;b&gt;ogni tipo di organizzazione&lt;/b&gt;, anche se in modi diversi.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo le sintesi della survey ERC (vedi &lt;a href=&quot;#more&quot;&gt;Per approfondire&lt;/a&gt;), nel non profit il misconduct era in crescita, e la frode finanziaria era più diffusa che nel business o nella pubblica amministrazione.&lt;/div&gt;

  &lt;h3&gt;Differences across organizational types&lt;/h3&gt;
  &lt;p&gt;La slide 19 confronta quattro tipi di organizzazione su quattro dimensioni. &lt;span class=&quot;term&quot;&gt;Civil society organisations&lt;/span&gt; sono le organizzazioni della società civile: ONG, associazioni, enti non profit.&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;o1&quot;&gt;Large corporations&lt;/button&gt;&lt;button data-tab=&quot;o2&quot;&gt;Small businesses&lt;/button&gt;&lt;button data-tab=&quot;o3&quot;&gt;Civil society organisations&lt;/button&gt;&lt;button data-tab=&quot;o4&quot;&gt;Public sector&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o1&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Priorità etiche&lt;/th&gt;&lt;td&gt;Financial integrity, employee/customer issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approccio&lt;/th&gt;&lt;td&gt;Formal, public relations and/or systems-based: codici, procedure, comunicazione&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Responsabile verso&lt;/th&gt;&lt;td&gt;Shareholders and other stakeholders&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Vincoli&lt;/th&gt;&lt;td&gt;Shareholder orientation; size and complexity&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o2&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Priorità etiche&lt;/th&gt;&lt;td&gt;Employee, customer/community issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approccio&lt;/th&gt;&lt;td&gt;Informal, relationship and trust based&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Responsabile verso&lt;/th&gt;&lt;td&gt;Owners and family members&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Vincoli&lt;/th&gt;&lt;td&gt;Lack of resources, including time&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o3&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Priorità etiche&lt;/th&gt;&lt;td&gt;Delivery of mission to clients; legitimacy and accountability issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approccio&lt;/th&gt;&lt;td&gt;Informal values based&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Responsabile verso&lt;/th&gt;&lt;td&gt;Donors and clients&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Vincoli&lt;/th&gt;&lt;td&gt;Lack of resources and formal training&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;o4&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Priorità etiche&lt;/th&gt;&lt;td&gt;Rule of law, conflict of interest; accountability issues&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Approccio&lt;/th&gt;&lt;td&gt;Formal, bureaucratic, regulated&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Responsabile verso&lt;/th&gt;&lt;td&gt;General public, higher level government organisations&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Vincoli&lt;/th&gt;&lt;td&gt;Inertia, lack of transparency&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 200&quot; role=&quot;img&quot; aria-label=&quot;Mappa: formalità dell&#x27;approccio contro dimensione&quot;&gt;
      &lt;path d=&quot;M60 170 L740 170 M60 170 L60 15&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;740&quot; y=&quot;192&quot; text-anchor=&quot;end&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;approccio più formale →&lt;/text&gt;
      &lt;text x=&quot;66&quot; y=&quot;22&quot; class=&quot;svg-muted&quot; font-size=&quot;12&quot;&gt;risorse e complessità ↑&lt;/text&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;135&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;118&quot; class=&quot;svg-ink&quot;&gt;Small businesses&lt;/text&gt;
        &lt;circle cx=&quot;260&quot; cy=&quot;110&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;93&quot; class=&quot;svg-ink&quot;&gt;Civil society org.&lt;/text&gt;
        &lt;circle cx=&quot;560&quot; cy=&quot;45&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;28&quot; class=&quot;svg-ink&quot;&gt;Large corporations&lt;/text&gt;
        &lt;circle cx=&quot;660&quot; cy=&quot;80&quot; r=&quot;10&quot; class=&quot;fill-d&quot;/&gt;&lt;text x=&quot;660&quot; y=&quot;63&quot; class=&quot;svg-ink&quot;&gt;Public sector&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema interpretativo nostro, non presente nelle slide: le organizzazioni piccole e quelle basate sui valori gestiscono l&#x27;etica in modo informale; grandi imprese e settore pubblico in modo formale.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Ethical issues in different industries&lt;/h3&gt;
  &lt;p&gt;Anche il settore cambia i temi etici prevalenti (slide 20):&lt;/p&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;i1&quot;&gt;Chemical&lt;/button&gt;&lt;button data-tab=&quot;i2&quot;&gt;Supermarkets&lt;/button&gt;&lt;button data-tab=&quot;i3&quot;&gt;IT &amp;amp; mobile&lt;/button&gt;&lt;button data-tab=&quot;i4&quot;&gt;Financial services&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i1&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;competitive practices&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;environmental responsibility&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;health and safety&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;human rights&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i2&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;healthy eating (sugar, salt)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;food and packaging waste&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;power in supply chain relationships&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;supply chain CO₂ emissions&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;community relationships&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;local economies, decline of town centre locations&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;«Power in supply chain relationships»: la grande distribuzione ha molta forza contrattuale sui fornitori, come nell&#x27;esempio dei pagamenti a 180 giorni della &lt;a href=&quot;#p2&quot;&gt;sezione 2&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i3&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;competitive practices&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;fair pricing&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;global production methods&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;data protection&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;harmful materials&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;energy and water usage&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CO₂ emissions&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;i4&quot;&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;weak regulation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;financial crime&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;responsible lending&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;sales practices and consumer protection&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;tax evasion and avoidance&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;term&quot;&gt;Tax evasion&lt;/span&gt; è l&#x27;evasione, illegale. &lt;span class=&quot;term&quot;&gt;Tax avoidance&lt;/span&gt; è l&#x27;elusione: sfruttare la legge per pagare meno, spesso legale ma eticamente discussa. È un caso tipico di grey area.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Le piccole imprese gestiscono l&#x27;etica in modo informale, basato su relazioni e fiducia, e rispondono a proprietari e famiglia.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; Approccio «informal, relationship and trust based», responsabilità verso «owners and family members»: di che organizzazione si tratta?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Civil society org.&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;Small business&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Public sector&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Elenca le sette ragioni per cui la business ethics è importante.&lt;/summary&gt;&lt;div&gt;Power and influence; potential major contribution; potential to inflict harm; increasing stakeholder demands; lack of ethics education; continued ethical infractions; trust deficit.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Cosa insegnano i dati ERC sui tre settori?&lt;/summary&gt;&lt;div&gt;Il misconduct è diffuso ovunque (oltre il 50% osservato), il settore pubblico è il più alto e il non profit non è immune. L&#x27;etica riguarda ogni organizzazione.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Quali sono i vincoli tipici del settore pubblico e delle grandi imprese?&lt;/summary&gt;&lt;div&gt;Settore pubblico: inertia, lack of transparency. Grandi imprese: shareholder orientation, size and complexity.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p5&quot; data-h=&quot;35&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker deep&quot;&gt;Globalization: a key context for business ethics?&lt;/div&gt;&lt;h2&gt;Culture e globalizzazione&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 21-24&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;h3&gt;Different approaches depending on culture&lt;/h3&gt;
  &lt;p&gt;La slide 21 pone cinque domande; la slide 22 risponde confrontando Europa, Nord America e Asia (fonte: Crane et al., 2019). Scegli la domanda.&lt;/p&gt;
  &lt;div class=&quot;tabset&quot; id=&quot;regions&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button data-tab=&quot;r1&quot;&gt;Chi è responsabile?&lt;/button&gt;&lt;button data-tab=&quot;r2&quot;&gt;Attore chiave&lt;/button&gt;&lt;button data-tab=&quot;r3&quot;&gt;Linee guida&lt;/button&gt;&lt;button data-tab=&quot;r4&quot;&gt;Temi chiave&lt;/button&gt;&lt;button data-tab=&quot;r5&quot;&gt;Stakeholder approach&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r1&quot;&gt;&lt;p class=&quot;small&quot;&gt;Who is responsible for ethical conduct in business?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Social control by the collective&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;The individual&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Top management&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r2&quot;&gt;&lt;p class=&quot;small&quot;&gt;Who is the key actor in business ethics?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Government, trade unions, corporate associations&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;The corporation&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Government, corporations&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r3&quot;&gt;&lt;p class=&quot;small&quot;&gt;What are the key guidelines for ethical behaviour?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Negotiated legal framework of business&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Corporate codes of ethics&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Managerial discretion&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r4&quot;&gt;&lt;p class=&quot;small&quot;&gt;What are the key issues in business ethics?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Social issues in organizing the framework of business&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Misconduct and immorality in single decision situations&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Corporate governance and accountability&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-panel=&quot;r5&quot;&gt;&lt;p class=&quot;small&quot;&gt;What is the dominant stakeholder management approach?&lt;/p&gt;&lt;div class=&quot;grid g3&quot;&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Formalised multiple stakeholder approach&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;North America&lt;/h4&gt;Focus on shareholder value&lt;/div&gt;&lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Asia&lt;/h4&gt;Implicit multiple stakeholder approach, benign managerialism&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il filo rosso&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Europa:&lt;/b&gt; l&#x27;etica passa per le &lt;em&gt;istituzioni&lt;/em&gt; (leggi negoziate, sindacati, associazioni). Il tema è come organizzare il quadro in cui operano le imprese. &lt;b&gt;Nord America:&lt;/b&gt; l&#x27;etica è affare dell&#x27;&lt;em&gt;individuo&lt;/em&gt; e dell&#x27;&lt;em&gt;impresa&lt;/em&gt; (codici etici). Il tema è la singola decisione scorretta, e prevale lo &lt;span class=&quot;term&quot;&gt;shareholder value&lt;/span&gt; (valore per gli azionisti). &lt;b&gt;Asia:&lt;/b&gt; l&#x27;etica dipende dai &lt;em&gt;vertici&lt;/em&gt; e dalla loro discrezionalità. Il tema è la &lt;span class=&quot;term&quot;&gt;corporate governance&lt;/span&gt; (sistema di governo e controllo dell&#x27;impresa), con un&#x27;attenzione agli stakeholder implicita, di tipo paternalistico: &lt;span class=&quot;term&quot;&gt;benign managerialism&lt;/span&gt;, un management «benevolo» che decide per tutti.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Sono tendenze generali, non regole valide per ogni impresa. Spiegano però perché la stessa condotta può essere giudicata in modo diverso da un paese all&#x27;altro.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;L&#x27;impatto «etico» della globalizzazione sugli stakeholder&lt;/h3&gt;
  &lt;p&gt;La &lt;span class=&quot;term&quot;&gt;globalization&lt;/span&gt; (integrazione crescente di mercati, produzione e comunicazioni oltre i confini nazionali) crea opportunità e rischi per ciascun gruppo di stakeholder (slide 23). &lt;span class=&quot;term&quot;&gt;MNCs&lt;/span&gt; sono le &lt;em&gt;multinational corporations&lt;/em&gt;. &lt;b&gt;Clicca su uno stakeholder.&lt;/b&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wheel&quot; viewBox=&quot;0 0 760 400&quot; role=&quot;img&quot; aria-label=&quot;Ruota degli stakeholder, cliccabile&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;grid g2&quot; id=&quot;whOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;p5-race&quot;&gt;Warning: race to the bottom&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Race to the bottom&lt;/b&gt;: a process whereby multinationals pit developing countries against each other, by allocating foreign direct investment to countries that can offer them the most favourable conditions in terms of low tax rates, low levels of environmental regulation, and restricted workers&#x27; rights. &lt;span class=&quot;small&quot;&gt;(slide 24)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;La «corsa al ribasso»: le multinazionali mettono in competizione i paesi in via di sviluppo e destinano gli investimenti diretti esteri (&lt;span class=&quot;term&quot;&gt;foreign direct investment&lt;/span&gt;, FDI) a chi offre tasse basse, poche regole ambientali e meno diritti ai lavoratori.&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Simulazione.&lt;/b&gt; Tre paesi partono con standard diversi (un indice che riassume tasse, regole ambientali e diritti dei lavoratori). A ogni round la multinazionale investe nel paese con lo standard più basso, e gli altri abbassano il proprio per superarlo al ribasso. Muovi i cursori: con il secondo puoi introdurre un &lt;b&gt;pavimento comune&lt;/b&gt;, cioè uno standard minimo concordato a livello internazionale.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg id=&quot;race&quot; viewBox=&quot;0 0 520 260&quot; role=&quot;img&quot; aria-label=&quot;Simulazione della race to the bottom&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;small&quot; for=&quot;rRound&quot;&gt;Round: &lt;b id=&quot;rRoundL&quot;&gt;0&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rRound&quot; min=&quot;0&quot; max=&quot;8&quot; value=&quot;0&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rFloor&quot;&gt;Standard minimo comune: &lt;b id=&quot;rFloorL&quot;&gt;nessuno&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rFloor&quot; min=&quot;0&quot; max=&quot;50&quot; value=&quot;0&quot; step=&quot;5&quot;&gt;
    &lt;p id=&quot;rOut&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Modello giocattolo costruito per far capire la dinamica, non presente nelle slide. Il collegamento con la &lt;a href=&quot;#p2-motives&quot;&gt;opportunistic compliance&lt;/a&gt; è diretto: ogni scelta di localizzazione è legale, ma l&#x27;effetto complessivo peggiora le condizioni di tutti.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Gli studi empirici sono divisi: alcuni (per esempio il working paper di Olney sulla protezione dell&#x27;impiego) trovano che i paesi riducono davvero gli standard per attrarre FDI. Altri sostengono che gli investimenti esteri diffondano tecnologie più pulite (la cosiddetta &lt;em&gt;pollution halo&lt;/em&gt;). Link in &lt;a href=&quot;#more&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-why=&quot;Per la slide 22 in Nord America la linea guida chiave sono i corporate codes of ethics, e prevale il focus sullo shareholder value.&quot;&gt;
      &lt;p&gt;&lt;b&gt;1.&lt;/b&gt; In quale area la guida principale sono i corporate codes of ethics?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot;&gt;Europe&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ok&gt;North America&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Asia&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;2. Definisci la race to the bottom e indica le tre leve su cui competono i paesi.&lt;/summary&gt;&lt;div&gt;Le multinazionali mettono in competizione i paesi in via di sviluppo allocando gli FDI dove le condizioni sono più favorevoli: low tax rates, low environmental regulation, restricted workers&#x27; rights.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Perché la globalizzazione «weakens governments» e aumenta la responsabilità delle imprese?&lt;/summary&gt;&lt;div&gt;Le imprese operano oltre la portata dei singoli stati, che competono per attrarle. Dove i governi sono deboli o tolleranti, alle imprese si chiede di farsi carico di lavoro, welfare e standard etici, e i gruppi di pressione globali cercano di «sorvegliarle».&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Fai un esempio di impatto ambivalente sui consumatori.&lt;/summary&gt;&lt;div&gt;Prezzi più bassi e prodotti accessibili ovunque, ma anche accuse di imperialismo culturale e di occidentalizzazione, e rischio di sfruttamento dei consumatori vulnerabili nei paesi in via di sviluppo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;sintesi&quot; data-h=&quot;250&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker deep&quot;&gt;Summary · slide 32&lt;/div&gt;&lt;h2&gt;Sintesi della lezione&lt;/h2&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Definition of business ethics&lt;/b&gt;&lt;br&gt;Lo studio delle situazioni aziendali in cui sono in gioco giusto e sbagliato, valori e scopi. &lt;a href=&quot;#p1-def&quot;&gt;→ 1&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Business ethics and the law&lt;/b&gt;&lt;br&gt;Si sovrappongono solo in parte: la grey area e i legal motives. &lt;a href=&quot;#p2&quot;&gt;→ 2&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Vital in contemporary capitalism&lt;/b&gt;&lt;br&gt;Sette ragioni: potere, contributo, danno, stakeholder, formazione, infrazioni, fiducia. &lt;a href=&quot;#p4&quot;&gt;→ 4&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ Challenges differ by organization and context&lt;/b&gt;&lt;br&gt;Grandi e piccole imprese, società civile e settore pubblico; settori industriali diversi. &lt;a href=&quot;#p4-ctx&quot;&gt;→ 4&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;✓ A global view is essential&lt;/b&gt;&lt;br&gt;Culture regionali, impatti sugli stakeholder, race to the bottom. &lt;a href=&quot;#p5&quot;&gt;→ 5&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Metodo&lt;/b&gt;&lt;br&gt;Morality → ethics → ethical theory: dalle opinioni alle argomentazioni, per decisioni &lt;em&gt;migliori&lt;/em&gt; e giustificabili. &lt;a href=&quot;#p3&quot;&gt;→ 3&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;more&quot; data-h=&quot;85&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker deep&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Autori, testi e fonti citati nelle slide&lt;/h2&gt;
  &lt;p&gt;Per ogni riferimento citato nelle slide ho cercato sul web i dati bibliografici e un link affidabile. Le schede con l&#x27;etichetta &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; contengono informazioni prese dal web e &lt;b&gt;non&lt;/b&gt; dalle slide.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Bird, F. &amp;amp; Waters, J. A. (1989). «The Moral Muteness of Managers». &lt;em&gt;California Management Review&lt;/em&gt;, 32(1), 73-88.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;articolo che ha dato il nome alla &lt;em&gt;moral muteness&lt;/em&gt;. Analizza perché i manager evitano di descrivere in termini morali le questioni morali del business: temono di minare l&#x27;armonia, l&#x27;efficienza e la propria immagine di potere. Ne elenca i costi (moral amnesia, stress morale, abusi trascurati, perdita di autorità degli standard etici) e propone interventi. Conta perché spiega da dove nasce l&#x27;idea che l&#x27;etica sia «optional». Testo completo a pagamento. &lt;a href=&quot;https://cmr.berkeley.edu/1989/11/32-1-the-moral-muteness-of-managers&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su California Management Review&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wicks, A. C., Freeman, R. E., Werhane, P. H. &amp;amp; Martin, K. E. (2010). &lt;em&gt;Business Ethics: A Managerial Approach&lt;/em&gt;. Prentice Hall / Pearson.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 6, 7, 14&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Manuale per corsi di business ethics, pubblicato a luglio 2009 con copyright 2010, ISBN 9780131427921. Tra gli autori c&#x27;è R. Edward Freeman, padre della teoria degli stakeholder. I capitoli trattano il linguaggio dell&#x27;etica, stakeholder e strategia, il mercato globale, le aree funzionali (marketing, finanza, management) e la sostenibilità ambientale. Conta perché fornisce la tesi centrale della lezione: l&#x27;etica è parte inevitabile e utile del management. &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Pearson&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Schwartz, M. S. &amp;amp; Carroll, A. B. (2003). «Corporate Social Responsibility: A Three-Domain Approach». &lt;em&gt;Business Ethics Quarterly&lt;/em&gt;, 13(4), 503-530.&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Propone di sostituire la piramide della CSR di Carroll con un diagramma a tre domini sovrapposti (economic, legal, ethical) che genera sette categorie, utili a classificare le responsabilità di un&#x27;impresa. Da qui viene la tipologia dei legal motives. Ha ricevuto critiche: Fisher (2005) gli rimprovera, tra l&#x27;altro, una deriva relativistica. &lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-social-responsibility-a-threedomain-approach/0655292E11AC9C9CA33ACD433417518C&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v13y2003i04p503-530_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract su IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A. &amp;amp; Matten, D. (2010). &lt;em&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt;, 3ª ed. Oxford University Press.&lt;/h4&gt;
