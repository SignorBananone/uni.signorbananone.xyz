 &lt;p class=&quot;lead&quot;&gt;Questa lezione inizia alla slide 43, ma presuppone tutto ciò che c&#x27;era prima: le teorie “classiche” e i loro limiti. Ecco l&#x27;essenziale per non perdersi.&lt;/p&gt;
 &lt;p class=&quot;note&quot; style=&quot;border:0;margin:0&quot;&gt;Tutto ciò che in questa sezione porta l&#x27;etichetta &lt;span class=&quot;src&quot;&gt;Parte I&lt;/span&gt; viene da &lt;code&gt;corso/LECTURES/2. BE - NORMATIVE ETHICAL THEORIES - PART I/2. BE - Normative Ethical Theories 2026-2027 - part I.pdf&lt;/code&gt;.&lt;/p&gt;

 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Normative ethical theories&lt;/b&gt;Regole e principi che aiutano a stabilire che cosa è “right” e “wrong”; le teorie &lt;em&gt;normative&lt;/em&gt; &lt;i&gt;prescrivono&lt;/i&gt; il modo moralmente corretto di agire, a differenza di quelle &lt;em&gt;descriptive&lt;/em&gt;, che &lt;i&gt;descrivono&lt;/i&gt; come le decisioni etiche vengono davvero prese in azienda. &lt;span class=&quot;src&quot;&gt;Parte I · slide 4&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Due famiglie di teorie moderniste&lt;/h3&gt;
 &lt;figure&gt;

 &lt;/figure&gt;

 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card p-mattone&quot;&gt;&lt;h4&gt;Ethical egoism&lt;/h4&gt;&lt;p&gt;Giusto è perseguire i propri desideri o interessi (di lungo periodo: &lt;i&gt;enlightened self-interest&lt;/i&gt;). Hobbes, Ayn Rand; Adam Smith e la “invisible hand”.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Parte I · slide 15–17&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-mattone&quot;&gt;&lt;h4&gt;Utilitarianism&lt;/h4&gt;&lt;p&gt;“The greatest good for the greatest number”: si sommano costi e benefici per tutti. &lt;i&gt;Act&lt;/i&gt; vs &lt;i&gt;rule&lt;/i&gt; utilitarianism. Bentham, J.S. Mill.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Parte I · slide 18–21&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-ardesia&quot;&gt;&lt;h4&gt;Ethics of duties&lt;/h4&gt;&lt;p&gt;Kant: &lt;i&gt;categorical imperative&lt;/i&gt; (imperativo categorico) — agisci solo secondo una massima che puoi volere come legge universale; tratta l&#x27;umanità sempre come fine, mai solo come mezzo.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Parte I · slide 25–28&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-ardesia&quot;&gt;&lt;h4&gt;Rights &amp;amp; justice&lt;/h4&gt;&lt;p&gt;Locke (natural rights), Rousseau (social contract), Rawls (veil of ignorance, difference principle); human rights, UN Global Compact.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Parte I · slide 31–38&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Perché servono delle “alternative”: i limiti&lt;/h3&gt;
 &lt;p&gt;La Parte I chiude elencando sei limiti delle teorie moderniste occidentali. Clicca su un limite per vedere quale delle nuove prospettive prova a rispondere. &lt;span class=&quot;src&quot;&gt;Parte I · slide 41&lt;/span&gt; &lt;span class=&quot;src int&quot;&gt;collegamenti: integrazione&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;limits&quot; role=&quot;tablist&quot; aria-label=&quot;Limiti delle teorie moderniste&quot;&gt;
  &lt;button class=&quot;btn&quot; data-k=&quot;0&quot;&gt;Too abstract&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;1&quot;&gt;Too reductionist&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;2&quot;&gt;Too objective &amp;amp; elitist&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;3&quot;&gt;Too impersonal&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;4&quot;&gt;Too rational &amp;amp; codified&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;5&quot;&gt;Too imperialist&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;limitsOut&quot; aria-live=&quot;polite&quot;&gt;Scegli un limite.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Qual è la differenza tra una teoria normative e una descriptive?&lt;/summary&gt;&lt;div&gt;La normativa dice come &lt;i&gt;si dovrebbe&lt;/i&gt; agire (prescrive); la descrittiva spiega come le persone &lt;i&gt;di fatto&lt;/i&gt; decidono in azienda.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Utilitarianism e Kant arrivano alla stessa conclusione nel trolley problem: perché la lezione dice che “sentiamo” comunque che le due situazioni non sono uguali?&lt;/summary&gt;&lt;div&gt;Perché entrano in gioco elementi che le teorie astratte ignorano: il grado di &lt;i&gt;agency&lt;/i&gt;/responsabilità richiesto e il coinvolgimento personale della “terza persona” (Parte I, slide 29). È proprio il tipo di intuizione che le teorie alternative valorizzano.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 1 VIRTUE --&gt;
&lt;section class=&quot;part p-salvia&quot; id=&quot;virtue&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;1 · Approaches based on character and integrity&lt;/div&gt;
 &lt;h2&gt;Virtue ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Non “che cosa devo fare?” ma “che persona voglio essere?”. Il giudizio morale si sposta dall&#x27;azione al &lt;i&gt;carattere&lt;/i&gt; di chi agisce.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Virtue ethics&lt;/b&gt;Sostiene che sono moralmente corrette le azioni compiute da attori con un &lt;em&gt;carattere virtuoso&lt;/em&gt;. Quindi la formazione di un carattere virtuoso è il primo passo verso un comportamento corretto. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Gli ingredienti&lt;/h3&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Intellectual virtues&lt;/b&gt;&lt;br&gt;es. &lt;i&gt;practical wisdom&lt;/i&gt;&lt;span class=&quot;back&quot;&gt;Virtù della mente. La regina è la &lt;i&gt;practical wisdom&lt;/i&gt; (in greco &lt;i&gt;phronesis&lt;/i&gt;): la saggezza pratica di capire che cosa è giusto fare &lt;i&gt;qui e ora&lt;/i&gt;, in una situazione concreta. Senza di essa le virtù morali non sanno dove dirigersi.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Moral virtues&lt;/b&gt;&lt;br&gt;temperance, courage, justice, honesty…&lt;span class=&quot;back&quot;&gt;Virtù del carattere: disposizioni stabili ad agire e sentire nel modo giusto. Per Aristotele ognuna sta nel “giusto mezzo” tra un eccesso e un difetto (vedi il cursore qui sotto).&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Acquired traits&lt;/b&gt;&lt;br&gt;si imparano, in comunità&lt;span class=&quot;back&quot;&gt;Non si nasce virtuosi: lo si diventa imparando e &lt;i&gt;vivendo in relazione con altri in una comunità&lt;/i&gt;. Si diventa coraggiosi facendo atti coraggiosi — è un&#x27;abitudine (in greco &lt;i&gt;hexis&lt;/i&gt;).&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Standard of excellence&lt;/b&gt;&lt;br&gt;tendere al meglio&lt;span class=&quot;back&quot;&gt;La virtù è eccellenza (&lt;i&gt;aretē&lt;/i&gt;): non basta evitare il male, si tende a fare bene ciò che si fa, come un buon professionista. In azienda: qualità del lavoro, integrità, reputazione costruita nel tempo.&lt;/span&gt;&lt;/button&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Clicca sulle schede per aprirle. Testo base: slide 44; le spiegazioni dei termini greci sono un&#x27;integrazione.&lt;/p&gt;

 &lt;h3&gt;Il “giusto mezzo”: prova il cursore&lt;/h3&gt;

 &lt;/div&gt;

 &lt;h3&gt;Perché se ne parla oggi: la “recovery” della virtù&lt;/h3&gt;
 &lt;ul class=&quot;tight&quot;&gt;
  &lt;li&gt;La virtue ethics è un &lt;em class=&quot;t&quot;&gt;developing approach&lt;/em&gt; nella business ethics, nato dal “recupero” dell&#x27;idea di virtù nella filosofia della seconda metà del Novecento: &lt;b&gt;Anscombe (1958)&lt;/b&gt;, &lt;b&gt;MacIntyre (1985)&lt;/b&gt;, &lt;b&gt;Battaly (2010)&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
  &lt;li&gt;Le virtù sono la &lt;em class=&quot;t&quot;&gt;realization of the potential of human beings&lt;/em&gt;: la realizzazione delle potenzialità umane per raggiungere ciò che è bene per sé e per gli altri. Le azioni si valutano in rapporto allo &lt;i&gt;sviluppo del carattere&lt;/i&gt; della persona. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
  &lt;li&gt;Analogamente un&#x27;impresa può sviluppare una &lt;em class=&quot;t&quot;&gt;business culture or character&lt;/em&gt;: l&#x27;organizzazione “cresce” attraverso le azioni dei suoi membri come una persona attraverso le proprie (Goodpaster &amp;amp; Matthews 1982; Moore 2005, 2008, 2015). &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
 &lt;/ul&gt;

   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Virtue ethics vs altre teorie&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Quali virtù per il business?&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;La slide 45 rimanda al video &lt;i&gt;Ethics Defined: Virtue Ethics&lt;/i&gt; di &lt;b&gt;Ethics Unwrapped&lt;/b&gt; (University of Texas at Austin), che confronta la virtue ethics con le teorie tradizionali: le altre chiedono quale &lt;i&gt;regola&lt;/i&gt; seguire o quali &lt;i&gt;conseguenze&lt;/i&gt; produrre, la virtue ethics chiede quali &lt;i&gt;abitudini&lt;/i&gt; coltivare. &lt;a href=&quot;https://ethicsunwrapped.utexas.edu/glossary/virtue-ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethicsunwrapped.utexas.edu&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;link dalle slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Il secondo video (slide 45) è un&#x27;intervista a &lt;b&gt;Edwin M. Hartman&lt;/b&gt; (Leonard N. Stern School of Business, NYU) su quali virtù servano nel business e perché. Hartman ha sviluppato il tema nel libro &lt;i&gt;Virtue in Business: Conversations with Aristotle&lt;/i&gt; (Cambridge UP, 2013). &lt;a href=&quot;https://www.youtube.com/watch?v=uWVVulWMmu0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video su YouTube&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;link dalle slide&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;libro: fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Qual è la “domanda guida” della virtue ethics, diversa da quella di Kant o dell&#x27;utilitarismo?&lt;/summary&gt;&lt;div&gt;“Che persona (o che impresa) voglio essere?” — si valuta il carattere che l&#x27;azione esprime e sviluppa, non solo la regola rispettata o il risultato prodotto.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Distingui intellectual virtues e moral virtues con un esempio ciascuna.&lt;/summary&gt;&lt;div&gt;Intellectual: practical wisdom (capire cosa è giusto nel caso concreto). Moral: courage, temperance, justice, honesty (disposizioni stabili del carattere).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa vuol dire che le virtù sono “acquired traits”?&lt;/summary&gt;&lt;div&gt;Si acquisiscono imparando e vivendo in relazione con altri in una comunità; non sono innate né si ottengono una volta per tutte.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In che senso un&#x27;impresa può avere un “carattere”?&lt;/summary&gt;&lt;div&gt;Per analogia con la persona: l&#x27;organizzazione sviluppa una cultura/carattere attraverso le azioni dei suoi membri (Goodpaster &amp;amp; Matthews 1982; Moore 2005–2015, slide 46).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 2 SHORTCUT --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;shortcut&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;2 · Ethical dilemma &amp;amp; ‘short cut’ theories&lt;/div&gt;
 &lt;h2&gt;Restituire la spada?&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Epoca romana. Il vicino parte per la guerra e ti affida una spada bella e preziosa, ereditata dal padre. Anni dopo torna ferito e &lt;i&gt;insane&lt;/i&gt; (folle). Chiede la spada, ma c&#x27;è un forte rischio che la usi contro se stesso o contro altri. &lt;span class=&quot;src&quot;&gt;slide 47 · © Prof. Elena Cavagnaro&lt;/span&gt;&lt;/p&gt;
 &lt;p&gt;&lt;b&gt;Qual è la tua prima reazione, immediata?&lt;/b&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;swordPick&quot;&gt;
  &lt;button class=&quot;btn&quot; data-s=&quot;give&quot;&gt;La restituisco&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;keep&quot;&gt;La tengo&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;swordOut&quot; aria-live=&quot;polite&quot;&gt;Scegli prima d&#x27;istinto, poi leggi che cosa direbbe ciascuna teoria.&lt;/div&gt;

 &lt;h3&gt;Le due “short cut” theories&lt;/h3&gt;
 &lt;p&gt;Le slide chiamano &lt;em class=&quot;t&quot;&gt;short cut theories&lt;/em&gt; (teorie “scorciatoia”) due modi rapidi di ragionare sul dilemma. &lt;span class=&quot;src&quot;&gt;slide 48 · © Prof. Elena Cavagnaro&lt;/span&gt;&lt;/p&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 270&quot; role=&quot;img&quot; aria-label=&quot;Confronto contract theory e due care theory&quot;&gt;
   &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;250&quot; rx=&quot;14&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;
   &lt;rect x=&quot;370&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;250&quot; rx=&quot;14&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot;/&gt;
   &lt;text x=&quot;180&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;Contract theory&lt;/text&gt;
   &lt;text x=&quot;180&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;“an agreement is an agreement”&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--salvia)&quot;&gt;Due care theory&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;“care as central principle”&lt;/text&gt;
   &lt;g font-size=&quot;13&quot;&gt;
    &lt;text x=&quot;30&quot; y=&quot;98&quot;&gt;• non-consequentialist&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;124&quot;&gt;• contratto esplicito o implicito&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;150&quot;&gt;• presuppone trasparenza e&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;168&quot;&gt;piena informazione&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;194&quot; style=&quot;fill:var(--mattone)&quot;&gt;⚠ sottovaluta le asimmetrie&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;212&quot; style=&quot;fill:var(--mattone)&quot;&gt;di potere&lt;/text&gt;
    &lt;text x=&quot;390&quot; y=&quot;98&quot;&gt;• consequentialist&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;124&quot;&gt;• decisioni nel contesto delle&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;142&quot;&gt;relazioni personali&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;168&quot;&gt;• assumersi attivamente la&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;186&quot;&gt;responsabilità; imparare&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;204&quot;&gt;dall&#x27;esperienza&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;230&quot; style=&quot;fill:var(--mattone)&quot;&gt;⚠ rischio di paternalismo&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;180&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;→ restituisci&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;252&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;→ trattieni (per ora)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Il limite della due care theory è importante: poiché rischia di essere &lt;i&gt;paternalistic&lt;/i&gt; (decido io che cosa è bene per te), va applicata &lt;b&gt;solo quando le circostanze in cui l&#x27;accordo era stato preso sono cambiate drasticamente&lt;/b&gt; — come la follia del vicino. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;
 &lt;details&gt;&lt;summary&gt;Da dove viene questo dilemma?&lt;/summary&gt;&lt;div&gt;È un esempio classico: nella &lt;i&gt;Repubblica&lt;/i&gt; di Platone (libro I) Socrate obietta che “restituire ciò che si è ricevuto” non può essere la definizione di giustizia, perché non restituiremmo le armi a un amico impazzito. &lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Perché la contract theory “sottovaluta le asimmetrie di potere”?&lt;/summary&gt;&lt;div&gt;Tratta ogni accordo come se fosse stato firmato tra pari, informati e liberi. Nel business spesso non è così (es. un fornitore piccolo e un grande compratore, un lavoratore e un&#x27;impresa): “un accordo è un accordo” può allora coprire condizioni ingiuste. &lt;span class=&quot;src int&quot;&gt;esempio: integrazione&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Contract theory: consequentialist o non-consequentialist? E due care?&lt;/summary&gt;&lt;div&gt;Contract theory: non-consequentialist (conta rispettare l&#x27;accordo). Due care: consequentialist (conta evitare il danno che la restituzione causerebbe).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quando è legittimo applicare la due care theory?&lt;/summary&gt;&lt;div&gt;Solo quando le circostanze in cui l&#x27;accordo era stato raggiunto sono cambiate drasticamente; altrimenti si scivola nel paternalismo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale teoria della Parte I è più vicina alla contract theory?&lt;/summary&gt;&lt;div&gt;Le teorie principle-based (ethics of duty, social contract): conta il vincolo assunto, non l&#x27;esito.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 3 CARE --&gt;
&lt;section class=&quot;part p-mattone&quot; id=&quot;care&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;3 · Approaches based on relationship and responsibility&lt;/div&gt;
 &lt;h2&gt;Ethics of care&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Al centro non c&#x27;è un principio astratto ma la &lt;i&gt;rete di relazioni&lt;/i&gt; concrete in cui ciascuno è immerso. Autrice di riferimento: &lt;b&gt;Carol Gilligan&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethics of care&lt;/b&gt;Un approccio che dà priorità all&#x27;&lt;em&gt;empathy&lt;/em&gt; (empatia), a relazioni sociali armoniose e sane, alla cura reciproca e all&#x27;&lt;em&gt;avoidance of harm&lt;/em&gt; (evitare il danno) &lt;b&gt;al di sopra dei principi astratti&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;

 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 260&quot; role=&quot;img&quot; aria-label=&quot;Etica della giustizia come scala di principi, etica della cura come rete di relazioni&quot;&gt;
   &lt;text x=&quot;170&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;Ethic of justice (modernista)&lt;/text&gt;
   &lt;g stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M110 50V240M230 50V240&quot;/&gt;&lt;path d=&quot;M110 80H230M110 120H230M110 160H230M110 200H230&quot;/&gt;&lt;/g&gt;
   &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;75&quot;&gt;principi universali&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;115&quot;&gt;regole&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;155&quot;&gt;caso&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;195&quot;&gt;decisione&lt;/text&gt;&lt;/g&gt;
   &lt;text x=&quot;170&quot; y=&quot;256&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;si “sale” dall&#x27;astratto al caso&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--mattone)&quot;&gt;Ethic of care&lt;/text&gt;
   &lt;g stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M540 140L450 80M540 140L640 80M540 140L440 205M540 140L640 210M450 80L640 80M440 205L450 80M640 210L640 80&quot;/&gt;&lt;/g&gt;
   &lt;circle cx=&quot;540&quot; cy=&quot;140&quot; r=&quot;26&quot; fill=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;io&lt;/text&gt;
   &lt;g fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;&gt;&lt;circle cx=&quot;450&quot; cy=&quot;80&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;640&quot; cy=&quot;80&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;440&quot; cy=&quot;205&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;640&quot; cy=&quot;210&quot; r=&quot;22&quot;/&gt;&lt;/g&gt;
   &lt;g font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;450&quot; y=&quot;84&quot;&gt;colleghi&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;84&quot;&gt;famiglia&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;209&quot;&gt;clienti&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;214&quot;&gt;fornitori&lt;/text&gt;&lt;/g&gt;
   &lt;text x=&quot;540&quot; y=&quot;256&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;si decide dentro le relazioni&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Due modi di “vedere” un problema morale. &lt;span class=&quot;src int&quot;&gt;schema: integrazione basata su slide 49–50&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;

 &lt;h3&gt;Key elements&lt;/h3&gt;
 &lt;p&gt;Clicca sulle linguette. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; data-tabs&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Elementi chiave dell&#x27;ethics of care&quot;&gt;
   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Feminist approach&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Relationships &amp;amp; emotions&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Responsibility&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Processes&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;È un &lt;em class=&quot;t&quot;&gt;feminist approach to business ethics&lt;/em&gt;. Nasce dal libro di Gilligan &lt;i&gt;In a Different Voice&lt;/i&gt; (1982), che contestava la teoria dello sviluppo morale di Lawrence Kohlberg: quella teoria premiava un ragionamento per principi astratti e giudicava “meno maturo” il ragionamento centrato sulle relazioni, più frequente nelle donne intervistate. Gilligan vi riconosce invece una “voce diversa”, altrettanto morale. &lt;span class=&quot;src ext&quot;&gt;fonte esterna: Wikipedia, In a Different Voice&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Decisioni prese nel contesto delle &lt;b&gt;interrelazioni umane personali&lt;/b&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Emotional commitment&lt;/b&gt;: il coinvolgimento emotivo non è un disturbo, è parte del giudizio&lt;/li&gt;&lt;li&gt;Si è &lt;b&gt;bound by circumstances, relations and position&lt;/b&gt;: legati alla situazione e al proprio ruolo&lt;/li&gt;&lt;li&gt;Si riconoscono &lt;b&gt;informazione limitata&lt;/b&gt; e &lt;b&gt;posizioni di potere disuguali&lt;/b&gt; (contro l&#x27;ipotesi di attori pari e informati della contract theory)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Conta l&#x27;&lt;b&gt;active ‘taking’ of responsibility&lt;/b&gt;, prendersi attivamente la responsabilità, non semplicemente “averla” per contratto o per ruolo. Un manager che ha la responsabilità formale di un reparto la “ha”; un manager che si accorge che un collaboratore è in difficoltà e interviene se la “prende”. &lt;span class=&quot;src int&quot;&gt;esempio: integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Processes rather than results&lt;/b&gt;: non c&#x27;è una formula che dà la risposta giusta una volta per tutte; si &lt;b&gt;impara e ci si sviluppa dall&#x27;esperienza&lt;/b&gt;. Nota la somiglianza con la due care theory della slide 48.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p&gt;Altra autrice di riferimento è &lt;b&gt;Virginia Held&lt;/b&gt;, &lt;i&gt;The Ethics of Care: Personal, Political and Global&lt;/i&gt; (slide 53), che estende la cura dalle relazioni personali alla politica e ai rapporti globali, anche come limite all&#x27;estensione dei mercati. &lt;span class=&quot;src ext&quot;&gt;fonte esterna: recensione NDPR&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa mette l&#x27;ethics of care “al di sopra dei principi astratti”?&lt;/summary&gt;&lt;div&gt;Empatia, relazioni sociali sane e armoniose, cura reciproca ed evitare il danno.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra “having” e “taking” responsibility?&lt;/summary&gt;&lt;div&gt;Averla è una condizione formale (ruolo, contratto); prenderla è un atto attivo di farsi carico dell&#x27;altro.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché si parla di “feminist approach”?&lt;/summary&gt;&lt;div&gt;Perché nasce dalla critica di Gilligan a modelli di sviluppo morale costruiti su un ragionamento astratto e impersonale, dando valore a una “voce” relazionale.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 4 DISCOURSE --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;discourse&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;4 · Approaches based on procedures of norm generation&lt;/div&gt;
 &lt;h2&gt;Discourse ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Non si parte da una norma già data: la norma si &lt;i&gt;costruisce&lt;/i&gt; insieme, discutendo. Autore di riferimento: &lt;b&gt;Jürgen Habermas&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discourse ethics&lt;/b&gt;Mira a risolvere i conflitti etici offrendo un &lt;em&gt;processo di generazione delle norme&lt;/em&gt; attraverso la riflessione razionale sulle esperienze di vita reale di &lt;b&gt;tutti i partecipanti rilevanti&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Il processo, passo per passo&lt;/h3&gt;
 &lt;div class=&quot;steps&quot; id=&quot;dsteps&quot;&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 720 120&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;g id=&quot;dsDots&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;dsPrev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;dsNext&quot;&gt;Avanti →&lt;/button&gt;&lt;span id=&quot;dsN&quot; style=&quot;font-size:.85rem;color:var(--ink2)&quot;&gt;&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;out&quot; id=&quot;dsOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;
 &lt;/div&gt;

 &lt;h3&gt;I criteri dell&#x27;“ideal discourse”&lt;/h3&gt;
 &lt;p&gt;Perché il risultato sia davvero accettabile per tutti, la discussione deve rispettare quattro condizioni. Clicca per la spiegazione. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Impartiality&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;Ogni partecipante deve poter considerare il punto di vista di tutti, non solo il proprio; nessuno ha una voce “che vale di più”.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Non-persuasiveness&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;Si convince con argomenti, non con retorica, manipolazione o trucchi comunicativi.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Non-coercion&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;Nessuno è costretto ad accettare per paura, pressione economica o gerarchica. È il punto più delicato quando le parti hanno potere molto diverso.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Expertise&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;I partecipanti devono avere (o poter ottenere) le conoscenze necessarie a capire la questione: senza informazioni il consenso è solo apparente.&lt;/span&gt;&lt;/button&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Spiegazioni dei criteri: integrazione. Nel libro &lt;i&gt;Moral Consciousness and Communicative Action&lt;/i&gt; (slide 53) Habermas propone in sostanza di sostituire l&#x27;imperativo categorico di Kant con una &lt;i&gt;procedura&lt;/i&gt;: una norma è valida solo se tutti gli interessati potrebbero accettarne le conseguenze senza costrizione. &lt;span class=&quot;src ext&quot;&gt;fonte esterna: MIT Press / Wikipedia “Discourse ethics”&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Qual è l&#x27;“ultimate goal” della discourse ethics in azienda?&lt;/summary&gt;&lt;div&gt;Il &lt;i&gt;peaceful settlement of conflicts&lt;/i&gt;: la composizione pacifica dei conflitti, con una soluzione accettabile per tutti.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Elenca i quattro criteri dell&#x27;ideal discourse.&lt;/summary&gt;&lt;div&gt;Impartiality, non-persuasiveness, non-coercion, expertise.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché si dice che è un approccio “procedural”?&lt;/summary&gt;&lt;div&gt;Perché non fornisce il contenuto della norma, ma la &lt;i&gt;procedura&lt;/i&gt; corretta per generarla insieme.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 5 POSTMODERN --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;postmodern&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;5 · Approaches based on empathy and moral impulse&lt;/div&gt;
 &lt;h2&gt;Postmodern ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;La morale non nasce dalla ragione ma da un &lt;i&gt;impulso&lt;/i&gt; verso l&#x27;altro, che viene prima di ogni regola. Autore di riferimento: &lt;b&gt;Zygmunt Bauman&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Postmodern ethics&lt;/b&gt;Colloca la moralità &lt;em&gt;oltre la sfera della razionalità&lt;/em&gt;, in un &lt;em&gt;moral impulse&lt;/em&gt; emotivo verso gli altri. Incoraggia ciascuno a mettere in discussione pratiche e regole quotidiane e ad ascoltare e seguire emozioni, convinzioni interiori e “gut feelings” (sensazioni di pancia) su ciò che è giusto o sbagliato nella singola decisione. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/div&gt;
 &lt;h3&gt;Quattro tratti&lt;/h3&gt;
 &lt;details open&gt;&lt;summary&gt;Holistic approach&lt;/summary&gt;&lt;div&gt;Nessuna separazione tra sfera privata e professionale: non esiste un “io in ufficio” con un&#x27;altra morale. Se una cosa non la faresti a casa, non diventa giusta perché è “business”.&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Practices rather than principles&lt;/summary&gt;&lt;div&gt;Contano le pratiche concrete, non i grandi principi universali, che il postmodernismo guarda con sospetto (possono diventare codici applicati senza pensare).&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Think local, act local&lt;/summary&gt;&lt;div&gt;Rovescia lo slogan “think global, act local”: il giudizio va formato sulla situazione specifica e sulle persone toccate, senza pretese universali.&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Preliminary character&lt;/summary&gt;&lt;div&gt;Le conclusioni sono sempre provvisorie, rivedibili: la morale è un percorso aperto, non una risposta definitiva.&lt;/div&gt;&lt;/details&gt;
 &lt;p class=&quot;note&quot;&gt;Titoli dei tratti: slide 52; spiegazioni: integrazione. Bauman è un sociologo; il suo &lt;i&gt;Postmodern Ethics&lt;/i&gt; (1993) sostiene che l&#x27;età postmoderna apre una comprensione radicalmente nuova dell&#x27;etica e critica la riduzione della morale a scelta razionale utilitaristica. &lt;span class=&quot;src ext&quot;&gt;fonte esterna: scheda Wiley-Blackwell&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Dove colloca la morale la postmodern ethics?&lt;/summary&gt;&lt;div&gt;Oltre la razionalità, in un impulso morale emotivo verso gli altri.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa significa “holistic approach” qui?&lt;/summary&gt;&lt;div&gt;Nessuna separazione tra etica privata ed etica professionale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale rischio delle teorie moderniste vuole evitare?&lt;/summary&gt;&lt;div&gt;Seguire “slavishly” regole e codici aziendali senza chiedersi se siano davvero giusti (vedi slide 68).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 6 CONFRONTO --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;6 · Alternative perspectives on ethical theory&lt;/div&gt;
 &lt;h2&gt;Tutte le teorie a confronto&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Le slide 53–54 riassumono le quattro alternative in due tabelle (fonte: Crane et al., 2019). Qui sono affiancate alle teorie moderniste della Parte I (slide 39–40), per avere il quadro completo.&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; data-tabs id=&quot;cmpTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Scegli una teoria&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;details style=&quot;margin-top:14px&quot;&gt;&lt;summary&gt;Mostra la tabella completa&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;tablewrap&quot; id=&quot;cmpTable&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;p class=&quot;note&quot;&gt;Le quattro colonne “alternative”: slide 53–54. Le quattro colonne “moderniste”: Parte I, slide 39–40. Entrambe da Crane et al. (2019).&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Associa ogni teoria al suo “type”: virtue, feminist, procedural, poststructuralist.&lt;/summary&gt;&lt;div&gt;Virtue ethics → virtue; ethics of care → feminist; discourse ethics → procedural; postmodern ethics → poststructuralist.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale concezione dell&#x27;essere umano ha la discourse ethics? E la postmodern?&lt;/summary&gt;&lt;div&gt;Discourse: individui razionali che risolvono i conflitti argomentando. Postmodern: esseri umani con una guida etica interiore innata.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Chi è l&#x27;autore di “After Virtue”? E di “Postmodern Ethics”?&lt;/summary&gt;&lt;div&gt;Alasdair MacIntyre; Zygmunt Bauman.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 7 GUIDE --&gt;
&lt;section class=&quot;part p-salvia&quot; id=&quot;guide&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;7 · From philosophy to practical judgment&lt;/div&gt;
 &lt;h2&gt;Decision guides for managers&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Wicks, Freeman, Werhane e Martin (2010, cap. 1) traducono tre grandi famiglie di teorie in tre “guide” concrete per chi decide in azienda.&lt;/p&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 250&quot; role=&quot;img&quot; aria-label=&quot;Dalle teorie alle guide decisionali&quot;&gt;
   &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;53&quot;&gt;Deontology&lt;/text&gt;
    &lt;rect x=&quot;10&quot; y=&quot;97&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;130&quot;&gt;Virtue ethics&lt;/text&gt;
    &lt;rect x=&quot;10&quot; y=&quot;174&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;207&quot;&gt;Consequentialism&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;53&quot;&gt;Standard of Conduct&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;97&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--salvia)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;122&quot;&gt;Character and&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;139&quot;&gt;Relationships&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;174&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;199&quot;&gt;Purposes and&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;216&quot;&gt;Consequences&lt;/text&gt;
   &lt;/g&gt;
   &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M212 48H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M212 125H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M212 202H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 48H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 125H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 202H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;

  &lt;figcaption&gt;Teoria → guida → domanda pratica. &lt;span class=&quot;src&quot;&gt;slide 55–57&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;
 &lt;div class=&quot;tabs&quot; data-tabs&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Le tre guide&quot;&gt;
   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Standard of Conduct&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Character &amp;amp; Relationships&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Purposes &amp;amp; Consequences&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;From Deontology to Standard of Conduct.&lt;/b&gt; Gli &lt;em class=&quot;t&quot;&gt;standards of conduct&lt;/em&gt; sono i principi e le regole che governano una comunità: stabiliscono quali azioni la comunità considera moralmente appropriate o inappropriate e la aiutano ad articolare le proprie regole morali.&lt;/p&gt;&lt;p&gt;Esistono a più livelli: &lt;b&gt;azienda, settore, nazione, comunità internazionale&lt;/b&gt; — codici etici, standard, ecc. &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;i&gt;Esempio:&lt;/i&gt; il codice etico aziendale; a livello internazionale, i principi del UN Global Compact visti nella Parte I (slide 32). &lt;span class=&quot;src int&quot;&gt;collegamento&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;From Virtue Ethics to Character and Relationships.&lt;/b&gt; L&#x27;idea chiave è che le imprese devono &lt;em class=&quot;t&quot;&gt;“walk the talk”&lt;/em&gt; (fare ciò che dicono) e trovare modi di fare business che permettano loro di &lt;i&gt;incarnare&lt;/i&gt; i tratti di carattere a cui aspirano.&lt;/p&gt;&lt;p&gt;È una questione di auto-sviluppo e ricerca dell&#x27;eccellenza: &lt;b&gt;“Who we want to be?”&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 56&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;From Consequentialism to Purposes and Consequences.&lt;/b&gt; Scopi e conseguenze sono centrali sia per i manager sia per gli &lt;em class=&quot;t&quot;&gt;stakeholders&lt;/em&gt; principali (portatori di interesse: dipendenti, clienti, fornitori, comunità, azionisti…).&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Scegliere un insieme di &lt;b&gt;scopi difendibili&lt;/b&gt; e agire per realizzarli è il cuore del comportamento etico.&lt;/li&gt;&lt;li&gt;Conta moralmente che i manager scelgano i &lt;b&gt;giusti obiettivi&lt;/b&gt; e usino le risorse dell&#x27;organizzazione per raggiungerli.&lt;/li&gt;&lt;li&gt;Creare &lt;b&gt;conseguenze favorevoli per gli stakeholder chiave&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 57&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Da quale teoria deriva lo “Standard of Conduct”? Fai un esempio di livello.&lt;/summary&gt;&lt;div&gt;Dalla deontologia. Livelli: azienda (codice etico), settore (standard di categoria), nazione, internazionale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa significa “walk the talk” per un&#x27;impresa?&lt;/summary&gt;&lt;div&gt;Comportarsi coerentemente con i valori dichiarati, incarnando davvero i tratti di carattere a cui aspira.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché nella guida 3 la scelta degli obiettivi ha valore morale?&lt;/summary&gt;&lt;div&gt;Perché gli scopi scelti determinano come si usano le risorse dell&#x27;organizzazione e quali conseguenze ricadono sugli stakeholder.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 8 TEST --&gt;
&lt;section class=&quot;part p-mattone&quot; id=&quot;test&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;8 · Avoiding rationalization&lt;/div&gt;
 &lt;h2&gt;Tre test contro l&#x27;autoinganno&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Rationalization&lt;/b&gt;Il processo con cui ci si convince che una decisione è giusta e difendibile quando in realtà serve solo i propri interessi o offre una facile via d&#x27;uscita. È una trappola comune nelle decisioni. &lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Publicity test&lt;/h4&gt;&lt;p&gt;«Potresti difendere la tua decisione se diventasse pubblica?» — l&#x27;immagine del gatto “I&#x27;m so embarrassed!”. Se ti imbarazzerebbe leggerla sui giornali, c&#x27;è qualcosa che non va.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Reversibility test&lt;/h4&gt;&lt;p&gt;Mettiti nei panni di chi subirebbe le principali conseguenze negative: «potresti difendere il tuo ragionamento se fossi tu dalla parte di chi perde?» — il pesce all&#x27;amo.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 59&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · Generalizability test&lt;/h4&gt;&lt;p&gt;«L&#x27;azione che stai valutando, e la sua logica, è qualcosa che vorresti che &lt;i&gt;tutti&lt;/i&gt; adottassero in circostanze simili?» — il parcheggio caotico: se tutti parcheggiassero “solo per un attimo” in doppia fila…&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 59&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Collegamenti &lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt;: il &lt;i&gt;reversibility test&lt;/i&gt; richiama la regola d&#x27;oro e il &lt;i&gt;veil of ignorance&lt;/i&gt; di Rawls; il &lt;i&gt;generalizability test&lt;/i&gt; è l&#x27;imperativo categorico di Kant (massima come legge universale, Parte I slide 26–28); il &lt;i&gt;publicity test&lt;/i&gt; si lega alla trasparenza verso gli stakeholder (Parte I slide 3).&lt;/p&gt;

 &lt;h3&gt;Mettili alla prova&lt;/h3&gt;
 &lt;p&gt;Scegli una situazione e rispondi onestamente ai tre test.&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;ratCase&quot;&gt;
  &lt;button class=&quot;btn&quot; data-c=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;Il “gift” al doganiere&lt;/button&gt;&lt;button class=&quot;btn&quot; data-c=&quot;1&quot;&gt;Gonfiare la nota spese&lt;/button&gt;&lt;button class=&quot;btn&quot; data-c=&quot;2&quot;&gt;Tacere un difetto al cliente&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;card&quot; id=&quot;ratText&quot; style=&quot;margin:8px 0&quot;&gt;&lt;/div&gt;
 &lt;div id=&quot;ratQs&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;ratOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Definisci rationalization con parole tue.&lt;/summary&gt;&lt;div&gt;Costruirsi buone ragioni “a posteriori” per una scelta che in realtà fa comodo a sé o evita una difficoltà.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale dei tre test è più vicino all&#x27;imperativo categorico?&lt;/summary&gt;&lt;div&gt;Il generalizability test.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Nel reversibility test, nei panni di chi ci si deve mettere?&lt;/summary&gt;&lt;div&gt;Di chi subirebbe le principali conseguenze negative della decisione.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 9 PLURALISM --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;pluralism&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;9 · Towards a pragmatic use of ethical theory&lt;/div&gt;
 &lt;h2&gt;Ethical pluralism&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Nessuna teoria è “la” verità. Per decidere bene in azienda, tutte gettano luce sullo stesso problema da angolazioni diverse.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Crane et al. (2019): per decidere efficacemente nel business…&lt;/b&gt;
  &lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;non indicare una sola teoria come la migliore o la vera visione di un dilemma;&lt;/li&gt;&lt;li&gt;riconoscere che &lt;u&gt;tutti&lt;/u&gt; gli approcci illuminano da angoli diversi lo stesso problema;&lt;/li&gt;&lt;li&gt;sono &lt;b&gt;complementari&lt;/b&gt;, non mutuamente esclusivi;&lt;/li&gt;&lt;li&gt;sostenere una posizione di &lt;em class=&quot;t&quot;&gt;pluralism&lt;/em&gt;;&lt;/li&gt;&lt;li&gt;terreno intermedio tra &lt;em class=&quot;t&quot;&gt;absolutism&lt;/em&gt; e &lt;em class=&quot;t&quot;&gt;relativism&lt;/em&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 64&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Lente o prisma?&lt;/h3&gt;
 &lt;div class=&quot;row&quot; id=&quot;lpPick&quot;&gt;&lt;button class=&quot;btn&quot; data-m=&quot;lens&quot; aria-pressed=&quot;true&quot;&gt;Typical perspective (lente)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;prism&quot;&gt;Pluralistic perspective (prisma)&lt;/button&gt;&lt;/div&gt;

    &lt;text x=&quot;250&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;‘Lens’ of ethical theory&lt;/text&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;3&quot;&gt;&lt;path d=&quot;M275 80L480 112&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M275 115L480 115&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M275 150L480 118&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;490&quot; y=&quot;95&quot; width=&quot;40&quot; height=&quot;40&quot; fill=&quot;var(--ardesia)&quot; transform=&quot;rotate(45 510 115)&quot;/&gt;
    &lt;text x=&quot;600&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Una sola considerazione&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;197&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;normativa&lt;/text&gt;
   &lt;/g&gt;
   &lt;g id=&quot;prismG&quot; style=&quot;display:none&quot;&gt;
    &lt;path d=&quot;M250 25L320 200H180Z&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;250&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;‘Prism’ of ethical theories&lt;/text&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;3&quot;&gt;&lt;path d=&quot;M290 100L470 60&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M295 120L470 115&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M300 140L470 170&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;490&quot; y=&quot;20&quot; width=&quot;60&quot; height=&quot;190&quot; fill=&quot;url(#spec)&quot; rx=&quot;4&quot;/&gt;
    &lt;text x=&quot;640&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Varietà di&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;considerazioni&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;normative&lt;/text&gt;
   &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption id=&quot;lpCap&quot;&gt;Ridisegno delle slide 65–66. Con la lente, una teoria trasforma il dilemma in un&#x27;unica risposta; con il prisma, l&#x27;insieme delle teorie lo scompone in uno “spettro” di considerazioni da pesare.&lt;/figcaption&gt;
 &lt;/figure&gt;

 &lt;h3&gt;Dove sta il pluralismo? Sposta il cursore&lt;/h3&gt;
 &lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; id=&quot;arR&quot; aria-label=&quot;Da absolutism a relativism&quot;&gt;
 &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;font-size:.85rem;color:var(--ink2);margin-top:0&quot;&gt;&lt;span&gt;Ethical absolutism&lt;/span&gt;&lt;span&gt;Pluralism&lt;/span&gt;&lt;span&gt;Ethical relativism&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;arOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

 &lt;h3&gt;Le nove considerazioni (il “prisma” in pratica)&lt;/h3&gt;
 &lt;p&gt;Ogni teoria si traduce in una &lt;i&gt;considerazione&lt;/i&gt; e in domande da porsi. Clicca su un raggio. &lt;span class=&quot;src&quot;&gt;slide 67–68 · Crane et al. 2019&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;consRow&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;consOut&quot; aria-live=&quot;polite&quot;&gt;Scegli una considerazione.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Perché il pluralismo è “middle ground” tra absolutism e relativism?&lt;/summary&gt;&lt;div&gt;Non sostiene un unico principio valido sempre (absolutism) né che tutto dipenda da persona e cultura senza criteri razionali (relativism): riconosce più valori legittimi e permette di discuterli razionalmente (Parte I, slide 7–9).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Qual è la differenza tra la metafora della lente e quella del prisma?&lt;/summary&gt;&lt;div&gt;La lente: una teoria → una sola considerazione normativa. Il prisma: più teorie → uno spettro di considerazioni.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;A quale teoria corrisponde la considerazione “Procedures of norm generation”? E “Fairness”?&lt;/summary&gt;&lt;div&gt;Discourse ethics; theories of justice.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 10 TOYS --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;toys&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;10 · Ethical dilemma 3&lt;/div&gt;
 &lt;h2&gt;Producing toys — child&#x27;s play?&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Sei product manager di un&#x27;azienda dolciaria che mette piccoli giocattoli di plastica nei cioccolatini. In Thailandia trovi un fornitore che costa &lt;b&gt;un terzo&lt;/b&gt; di quello portoghese, con qualità equivalente. Visitandolo scopri che non c&#x27;è una fabbrica: i componenti vengono assemblati &lt;b&gt;a casa da intere famiglie&lt;/b&gt;, compresi bambini dai 5 ai 14 anni, che sembrano lavorare volentieri. Il partner ti dice che è una pratica comune e consolidata nella zona, che garantisce buona qualità. Firmi; sul volo di ritorno, comprando souvenir per le tue nipoti di 5 e 7 anni, ti chiedi se vorresti vederle crescere come quei bambini. &lt;span class=&quot;src&quot;&gt;slide 70 · caso da Crane et al.&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;steps&quot;&gt;
  &lt;h3&gt;Passo 1 · La reazione di pancia&lt;/h3&gt;
  &lt;p&gt;La domanda del caso: qual è la tua &lt;i&gt;gut reaction&lt;/i&gt; immediata?&lt;/p&gt;
  &lt;div class=&quot;row&quot; id=&quot;gutRow&quot;&gt;&lt;button class=&quot;btn&quot; data-g=&quot;0&quot;&gt;Confermo il contratto&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;1&quot;&gt;Lo annullo&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;2&quot;&gt;Lo tengo ma chiedo cambiamenti&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;gutOut&quot; aria-live=&quot;polite&quot;&gt;Rispondi d&#x27;istinto.&lt;/div&gt;

  &lt;h3&gt;Passo 2 · Passa il caso attraverso il prisma&lt;/h3&gt;
  &lt;p&gt;Clicca sulle nove considerazioni: ognuna mostra come “vede” il caso. Lo spettro qui sotto si colora man mano. &lt;span class=&quot;src int&quot;&gt;analisi: integrazione basata su slide 67–68&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;row&quot; id=&quot;toyRow&quot;&gt;&lt;/div&gt;
  &lt;figure style=&quot;margin-top:6px&quot;&gt;&lt;svg viewBox=&quot;0 0 720 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;toySpec&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;figcaption&gt;&lt;span class=&quot;verdict v-no&quot;&gt;pesa contro&lt;/span&gt;&lt;span class=&quot;verdict v-mid&quot;&gt;ambiguo / dipende&lt;/span&gt;&lt;span class=&quot;verdict v-yes&quot;&gt;pesa a favore&lt;/span&gt; — il punto non è “contare i voti”, ma vedere quali ragioni emergono.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;out&quot; id=&quot;toyOut&quot; aria-live=&quot;polite&quot;&gt;Scegli una considerazione.&lt;/div&gt;
 &lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;Passo 3 · Una possibile sintesi pluralista&lt;/summary&gt;&lt;div&gt;Quasi tutte le prospettive segnalano un problema serio (diritti dei bambini, dignità, giustizia, carattere, publicity test); solo l&#x27;egoismo di breve periodo e un utilitarismo stretto spingono a confermare. Ma le prospettive di care e discourse ricordano che &lt;i&gt;annullare e basta&lt;/i&gt; potrebbe danneggiare proprio le famiglie. Una soluzione difendibile: non accettare il lavoro minorile, ma dialogare con il fornitore e le famiglie (discourse ethics) per riorganizzare la produzione con adulti, con prezzi che lo rendano sostenibile, e verificare nel tempo. Il collegamento con la Parte I: è esattamente la &lt;i&gt;human rights due diligence&lt;/i&gt; dei principi ONU (Parte I, slide 33). &lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Le domande del caso chiedono due cose: quali?&lt;/summary&gt;&lt;div&gt;1) La reazione di pancia immediata nei panni del product manager. 2) Le ragioni di quella scelta e i valori o principi sottostanti.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale teoria “alternativa” valorizza proprio la domanda sulle nipoti?&lt;/summary&gt;&lt;div&gt;La postmodern ethics (gut feelings, nessuna separazione tra privato e professionale) e, in parte, l&#x27;ethics of care.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;“È una pratica comune nella zona”: quale posizione etica rischia di giustificare tutto con questo argomento?&lt;/summary&gt;&lt;div&gt;Il relativismo etico. Il pluralismo lo prende sul serio come informazione sul contesto, ma non come giustificazione automatica.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- SINTESI --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;Summary&lt;/div&gt;
 &lt;h2&gt;In quattro frasi&lt;/h2&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Le teorie etiche sono regole e principi che determinano giusto e sbagliato in una data situazione.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Esistono molte teorie, ognuna con punti di forza e debolezze.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Le teorie possono servire da &lt;b&gt;prisma&lt;/b&gt; per guardare i problemi etici.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Il pluralismo etico è il terreno intermedio tra absolutism e relativism.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Slide 69. Letture indicate (slide 71): textbook, cap. 3 (Crane et al. 2019) e Wicks, Freeman, Werhane &amp;amp; Martin (2010), cap. 1 “The language of ethics”, pp. 1–21.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;Per approfondire&lt;/div&gt;
 &lt;h2&gt;Autori, testi e siti citati&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Ogni scheda indica che cosa dicono le slide e che cosa si è trovato con una ricerca web. I link si aprono in una nuova scheda.&lt;/p&gt;
 &lt;div class=&quot;ref&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Aristotele — &lt;i&gt;Nicomachean Ethics&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 53 · contributor della virtue ethics&lt;/div&gt;&lt;p&gt;Il testo fondativo della virtue ethics: l&#x27;etica come ricerca della vita buona (&lt;i&gt;eudaimonia&lt;/i&gt;), virtù intellettuali e morali, giusto mezzo. La voce dell&#x27;enciclopedia di Stanford, curata da Richard Kraut, è un&#x27;ottima introduzione accademica gratuita.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://plato.stanford.edu/entries/aristotle-ethics/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP — Aristotle&#x27;s Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stanford Encyclopedia — Virtue Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;sfondo per slide 44–46&lt;/div&gt;&lt;p&gt;Voce di Hursthouse e Pettigrove: presenta la virtue ethics come una delle tre grandi famiglie dell&#x27;etica normativa (con deontology e consequentialism) e ne ricostruisce la rinascita a partire da Anscombe (1958).&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://plato.stanford.edu/entries/ethics-virtue/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP — Virtue Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;G.E.M. Anscombe (1958), “Modern Moral Philosophy”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;Saggio pubblicato in &lt;i&gt;Philosophy&lt;/i&gt; 33(124), gennaio 1958. Critica concetti come “obbligo morale” e conia il termine &lt;i&gt;consequentialism&lt;/i&gt;; è considerato l&#x27;inizio della virtue ethics contemporanea.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Modern_Moral_Philosophy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — Modern Moral Philosophy&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Alasdair MacIntyre, &lt;i&gt;After Virtue&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46 (ed. 1985) · slide 53&lt;/div&gt;&lt;p&gt;Uscito nel 1981 (2ª ed. 1985, 3ª 2007, University of Notre Dame Press). Diagnostica la scomparsa della virtù nella vita moderna e propone di recuperarla; introduce lo schema &lt;i&gt;virtues–practice–institution&lt;/i&gt; usato poi da Moore per le imprese.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://philpapers.org/rec/MACAVA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers — After Virtue&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Heather Battaly (2010), “Introduction: Virtue and Vice”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;In &lt;i&gt;Metaphilosophy&lt;/i&gt; 41(1‑2), pp. 1–21, poi nel volume &lt;i&gt;Virtue and Vice, Moral and Epistemic&lt;/i&gt; (Wiley-Blackwell). Si chiede che cos&#x27;è una teoria della virtù, una virtù e un vizio; distingue la virtù come capacità di raggiungere fini buoni e come buona motivazione.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://philpapers.org/rec/BATIVA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers — Battaly 2010&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Goodpaster &amp;amp; Matthews (1982), “Can a Corporation Have a Conscience?”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt; 60, gen.–feb. 1982, pp. 132–141. Sostengono che le organizzazioni vanno giudicate con gli stessi standard morali delle persone e possono avere una “coscienza” — la base dell&#x27;analogia persona/impresa della slide 46.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://law.wvu.edu/the-business-of-human-rights/2013/03/08/literature-review-can-a-corporation-have-a-conscience&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda di lettura (WVU Law)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2005), “Corporate Character”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;“Corporate character: Modern virtue ethics and the virtuous corporation”, &lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 15(4), pp. 659–685. Applica MacIntyre all&#x27;impresa: la corporation è l&#x27;istituzione che ospita una pratica; definisce il &lt;i&gt;corporate character&lt;/i&gt; distinguendolo da cultura e valori aziendali.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-character-modern-virtue-ethics-and-the-virtuous-corporation/AD19AB876E80F63377D9F666E0C4F913&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2008), “Re-imagining the morality of management”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 18(4), pp. 483–511. Parte dalla critica di MacIntyre ai manager e usa lo stesso schema virtù–pratica–istituzione per ripensare la moralità del management.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v18y2008i04p483-511_01.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc / IDEAS&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2015), “Corporate character, corporate virtues”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Business Ethics: A European Review&lt;/i&gt; 24(S2), pp. S99–S114. Propone un quadro per stabilire quali virtù servano a un&#x27;organizzazione e una prima tassonomia delle &lt;i&gt;corporate virtues&lt;/i&gt;. Versione accettata gratuita nel repository di Durham.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://durham-repository.worktribe.com/output/1436025/corporate-character-corporate-virtues&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Durham Research Online&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Carol Gilligan, &lt;i&gt;In a Different Voice&lt;/i&gt; (1982)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 49–50, 53&lt;/div&gt;&lt;p&gt;Harvard University Press. Critica il modello di sviluppo morale di Kohlberg e identifica un ragionamento morale basato sulla cura anziché sulla giustizia; tradotto in 16 lingue. Il dibattito sulla sua critica è ancora aperto.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/In_a_Different_Voice&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — In a Different Voice&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Virginia Held, &lt;i&gt;The Ethics of Care: Personal, Political, and Global&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 53&lt;/div&gt;&lt;p&gt;Oxford University Press, 2006. Difende la cura come teoria morale autonoma rispetto a Kant e all&#x27;utilitarismo e la estende alla politica, ai mercati e alla dimensione globale.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ndpr.nd.edu/news/the-ethics-of-care-personal-political-global/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Recensione su NDPR&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Internet Encyclopedia of Philosophy — Care Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;sfondo per slide 49–50&lt;/div&gt;&lt;p&gt;Panoramica accademica: origini (Gilligan, Noddings), autrici successive (Held, Tronto, Kittay…), confronto con Kant e utilitarismo, critiche principali.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://iep.utm.edu/care-ethics/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IEP — Care Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jürgen Habermas, &lt;i&gt;Moral Consciousness and Communicative Action&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 51, 53&lt;/div&gt;&lt;p&gt;Originale tedesco 1983 (Suhrkamp), trad. inglese MIT Press 1990. Sviluppa la discourse ethics, che sostituisce all&#x27;imperativo categorico una procedura di accordo argomentato tra tutti gli interessati.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://search.worldcat.org/title/Moral-consciousness-and-communicative-action/oclc/20670280&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Discourse_ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — Discourse ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Zygmunt Bauman, &lt;i&gt;Postmodern Ethics&lt;/i&gt; (1993)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 52–53&lt;/div&gt;&lt;p&gt;Blackwell, 1993. Sostiene che l&#x27;età postmoderna apre una comprensione radicalmente nuova dell&#x27;etica e critica le teorie che riducono la morale a scelta razionale utilitaristica.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-063118693X.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Wiley-Blackwell&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer &amp;amp; Spence (2019), &lt;i&gt;Business Ethics&lt;/i&gt;, 5ª ed.&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;textbook del corso · slide 53–54, 64, 67–68&lt;/div&gt;&lt;p&gt;Oxford University Press, 2019 (ISBN 9780198810070), sottotitolo &lt;i&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;. Il cap. 3 è la base di tutta la lezione: tabelle di confronto, pluralismo, considerazioni, caso dei giocattoli.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ubffm.hds.hebis.de/Record/HEB451213327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record bibliografico&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wicks, Freeman, Werhane &amp;amp; Martin (2010), &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 55–57, 71&lt;/div&gt;&lt;p&gt;Pearson/Prentice Hall (© 2010). Il cap. 1, “The language of ethics” (pp. 1–21), è lettura indicata e fonte delle tre decision guides per i manager.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ethics Unwrapped — Virtue Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 45&lt;/div&gt;&lt;p&gt;Programma gratuito della McCombs School of Business (UT Austin) con oltre 130 video brevi; la serie “Ethics Defined” spiega i concetti in 1–2 minuti. La voce sulla virtue ethics la descrive come l&#x27;invito a vivere moralmente coltivando abitudini virtuose.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;link dalle slide&lt;/span&gt; &lt;a href=&quot;https://ethicsunwrapped.utexas.edu/glossary/virtue-ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethicsunwrapped.utexas.edu&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Edwin M. Hartman — virtù nel business&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 45 (video)&lt;/div&gt;&lt;p&gt;Il video della slide risponde a “quali virtù per il business e perché”. Per approfondire: &lt;i&gt;Virtue in Business: Conversations with Aristotle&lt;/i&gt; (Cambridge UP, 2013), che applica ad aziende e leader l&#x27;idea aristotelica che il carattere conti più delle singole azioni.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;video: link dalle slide&lt;/span&gt; &lt;a href=&quot;https://www.youtube.com/watch?v=uWVVulWMmu0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt; · &lt;span class=&quot;src ext&quot;&gt;libro: fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.cambridge.org/core/product/8B65B00DFDC6FCA79A77C919B47A3247&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Il dilemma della spada e le short cut theories (slide 47–48) sono materiali © Prof. Elena Cavagnaro, adattati nelle slide del corso.&lt;/p&gt;

function drawAR(){var v=+$(&quot;#arR&quot;).value,o=$(&quot;#arOut&quot;);
 if(v&lt;30)o.innerHTML=&quot;&lt;b&gt;Ethical absolutism&lt;/b&gt;: esistono principi morali eterni e universali, determinabili razionalmente (tipico delle teorie tradizionali). Bribery è &lt;i&gt;sempre&lt;/i&gt; sbagliata: non pagare e, se previsto, denunciare. &lt;span class=&#x27;src&#x27;&gt;Parte I · slide 7–8&lt;/span&gt;&quot;;
 else if(v&gt;70)o.innerHTML=&quot;&lt;b&gt;Ethical relativism&lt;/b&gt;: la morale dipende dal contesto e dal soggetto; non ci sono giusti e sbagliati universali (tipico delle teorie contemporanee). Bribery &lt;i&gt;può&lt;/i&gt; essere sbagliata: dipende dalla cultura e dalle circostanze; se non lo è, nessun ostacolo a “ungere le ruote”. &lt;span class=&#x27;src&#x27;&gt;Parte I · slide 7–8&lt;/span&gt;&quot;;
 else o.innerHTML=&quot;&lt;b&gt;Ethical pluralism&lt;/b&gt; — l&#x27;approccio del corso: riconosce che valori incompatibili possono essere ugualmente legittimi, resta aperto alle nuove realtà e permette un discorso razionale tra persone con valori diversi. &lt;span class=&#x27;src&#x27;&gt;Parte I · slide 9 · slide 64&lt;/span&gt;&quot;;}

var CONS=[
 [&quot;One&#x27;s own interests&quot;,&quot;Egoism&quot;,&quot;È davvero nel mio interesse (o dell&#x27;organizzazione) di lungo periodo? Sarebbe accettabile pensare solo alle conseguenze per me?&quot;],
 [&quot;Social consequences&quot;,&quot;Utilitarianism&quot;,&quot;Considerando tutte le conseguenze per tutti gli interessati, staremo meglio o peggio nel complesso? Quanto sono probabili e rilevanti?&quot;],
 [&quot;Duties to others&quot;,&quot;Ethics of duty&quot;,&quot;Verso chi ho obblighi? Che cosa succederebbe se tutti agissero come me? Tratto le persone solo come mezzo o penso anche a ciò che vogliono loro?&quot;],
 [&quot;Entitlements of others&quot;,&quot;Ethics of rights&quot;,&quot;Di chi devo considerare i diritti? Rispetto i diritti fondamentali e la dignità umana?&quot;],

 [&quot;Procedures of norm generation&quot;,&quot;Discourse ethics&quot;,&quot;Quali norme possiamo elaborare insieme per una soluzione reciprocamente accettabile? Come evitare che il più potente imponga la sua (“railroading”)?&quot;],
 [&quot;Empathy and moral impulse&quot;,&quot;Postmodern ethics&quot;,&quot;Sto solo seguendo la prassi o il codice aziendale senza chiedermi se mi sembra davvero giusto? Come posso avvicinarmi a chi subirà la decisione? Che cosa mi dicono le emozioni fuori dall&#x27;ufficio?&quot;]];

 &quot;Reazione netta, vicina all&#x27;&lt;b&gt;ethics of rights&lt;/b&gt; e all&#x27;impulso morale della &lt;b&gt;postmodern ethics&lt;/b&gt;. Ma che cosa succede alle famiglie che perdono quel reddito?&quot;,
 &quot;Reazione vicina all&#x27;&lt;b&gt;ethics of care&lt;/b&gt; e alla &lt;b&gt;discourse ethics&lt;/b&gt;: restare nella relazione per cambiarla. Rischio: che i cambiamenti restino solo sulla carta.&quot;];

 [&quot;mid&quot;,&quot;Nel breve periodo conviene: risparmio di 2/3 e bonus personale. Nel lungo periodo uno scandalo sul lavoro minorile potrebbe costare caro in reputazione e vendite.&quot;],
 [&quot;mid&quot;,&quot;Benefici: prezzi più bassi, reddito per le famiglie thailandesi. Costi: salute e istruzione dei bambini, rischi per l&#x27;azienda. Il bilancio dipende da come si pesano — e il danno ai bambini è difficile da monetizzare.&quot;],

 [&quot;no&quot;,&quot;La domanda finale del caso — le nipoti di 5 e 7 anni — è proprio il moral impulse: fuori dall&#x27;ufficio, la cosa non “sembra giusta”.&quot;]];
