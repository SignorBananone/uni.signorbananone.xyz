 &lt;h3&gt;Where does pluralism lie? Move the slider&lt;/h3&gt;
 &lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; id=&quot;arR&quot; aria-label=&quot;From absolutism to relativism&quot;&gt;
 &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;font-size:.85rem;color:var(--ink2);margin-top:0&quot;&gt;&lt;span&gt;Ethical absolutism&lt;/span&gt;&lt;span&gt;Pluralism&lt;/span&gt;&lt;span&gt;Ethical relativism&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;arOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

 &lt;h3&gt;The nine considerations (the “prism” in practice)&lt;/h3&gt;
 &lt;p&gt;Each theory translates into a &lt;i&gt;consideration&lt;/i&gt; and a set of questions to ask. Click on a ray. &lt;span class=&quot;src&quot;&gt;slides 67–68 · Crane et al. 2019&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;consRow&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;consOut&quot; aria-live=&quot;polite&quot;&gt;Choose a consideration.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Why is pluralism a “middle ground” between absolutism and relativism?&lt;/summary&gt;&lt;div&gt;It neither holds that a single principle is always valid (absolutism) nor that everything depends on the individual and culture without rational criteria (relativism): it recognises several legitimate values and allows them to be discussed rationally (Part I, slides 7–9).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What is the difference between the lens metaphor and the prism metaphor?&lt;/summary&gt;&lt;div&gt;The lens: one theory → a single normative consideration. The prism: several theories → a spectrum of considerations.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which theory does the consideration “Procedures of norm generation” correspond to? And “Fairness”?&lt;/summary&gt;&lt;div&gt;Discourse ethics; theories of justice.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 10 TOYS --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;toys&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;10 · Ethical dilemma 3&lt;/div&gt;
 &lt;h2&gt;Producing toys — child&#x27;s play?&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;You are a product manager at a confectionery company that puts small plastic toys inside its chocolates. In Thailand you find a supplier that costs &lt;b&gt;one third&lt;/b&gt; of your Portuguese supplier, with equivalent quality. On visiting, you discover there is no factory: the components are assembled &lt;b&gt;at home by entire families&lt;/b&gt;, including children aged 5 to 14, who appear to work willingly. Your partner tells you this is a common, long-established practice in the area that ensures good quality. You sign; on the flight home, buying souvenirs for your nieces aged 5 and 7, you ask yourself whether you would want to see them grow up like those children. &lt;span class=&quot;src&quot;&gt;slide 70 · case from Crane et al.&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;steps&quot;&gt;
  &lt;h3&gt;Step 1 · Your gut reaction&lt;/h3&gt;
  &lt;p&gt;The question posed by the case: what is your immediate &lt;i&gt;gut reaction&lt;/i&gt;?&lt;/p&gt;
  &lt;div class=&quot;row&quot; id=&quot;gutRow&quot;&gt;&lt;button class=&quot;btn&quot; data-g=&quot;0&quot;&gt;I confirm the contract&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;1&quot;&gt;I cancel it&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;2&quot;&gt;I keep it but demand changes&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;gutOut&quot; aria-live=&quot;polite&quot;&gt;Answer on instinct.&lt;/div&gt;

  &lt;h3&gt;Step 2 · Pass the case through the prism&lt;/h3&gt;
  &lt;p&gt;Click on the nine considerations: each one shows how it “sees” the case. The spectrum below fills with colour as you go. &lt;span class=&quot;src int&quot;&gt;analysis: supplementary, based on slides 67–68&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;row&quot; id=&quot;toyRow&quot;&gt;&lt;/div&gt;
  &lt;figure style=&quot;margin-top:6px&quot;&gt;&lt;svg viewBox=&quot;0 0 720 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;toySpec&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
   &lt;figcaption&gt;&lt;span class=&quot;verdict v-no&quot;&gt;weighs against&lt;/span&gt;&lt;span class=&quot;verdict v-mid&quot;&gt;ambiguous / it depends&lt;/span&gt;&lt;span class=&quot;verdict v-yes&quot;&gt;weighs in favour&lt;/span&gt; — the point is not to “count the votes”, but to see which reasons emerge.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;out&quot; id=&quot;toyOut&quot; aria-live=&quot;polite&quot;&gt;Choose a consideration.&lt;/div&gt;
 &lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;Step 3 · A possible pluralist synthesis&lt;/summary&gt;&lt;div&gt;Almost all perspectives flag a serious problem (children&#x27;s rights, dignity, justice, character, the publicity test); only short-term egoism and a narrow utilitarianism push towards confirming the contract. Yet the care and discourse perspectives remind us that &lt;i&gt;simply cancelling&lt;/i&gt; could harm the very families involved. A defensible solution: do not accept child labour, but engage in dialogue with the supplier and the families (discourse ethics) to reorganise production with adult workers, at prices that make this sustainable, and monitor it over time. The link with Part I: this is precisely the &lt;i&gt;human rights due diligence&lt;/i&gt; of the UN principles (Part I, slide 33). &lt;span class=&quot;src int&quot;&gt;supplementary&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;The case questions ask for two things: what are they?&lt;/summary&gt;&lt;div&gt;1) Your immediate gut reaction in the product manager&#x27;s position. 2) The reasons for that choice and the underlying values or principles.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which “alternative” theory gives particular weight to the question about the nieces?&lt;/summary&gt;&lt;div&gt;Postmodern ethics (gut feelings, no separation between private and professional) and, in part, the ethics of care.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;“It is a common practice in the area”: which ethical position risks justifying anything with this argument?&lt;/summary&gt;&lt;div&gt;Ethical relativism. Pluralism takes it seriously as information about the context, but not as an automatic justification.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- SINTESI --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;Summary&lt;/div&gt;
 &lt;h2&gt;In four sentences&lt;/h2&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Ethical theories are rules and principles that determine right and wrong in a given situation.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;There are many theories, each with its own strengths and weaknesses.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Theories can serve as a &lt;b&gt;prism&lt;/b&gt; through which to view ethical problems.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Ethical pluralism is the middle ground between absolutism and relativism.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Slide 69. Assigned readings (slide 71): textbook, ch. 3 (Crane et al. 2019) and Wicks, Freeman, Werhane &amp;amp; Martin (2010), ch. 1 “The language of ethics”, pp. 1–21.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;Further reading&lt;/div&gt;
 &lt;h2&gt;Authors, texts and websites cited&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Each card indicates what the slides say and what was found through a web search. Links open in a new tab.&lt;/p&gt;
 &lt;div class=&quot;ref&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Aristotle — &lt;i&gt;Nicomachean Ethics&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 53 · contributor to virtue ethics&lt;/div&gt;&lt;p&gt;The founding text of virtue ethics: ethics as the pursuit of the good life (&lt;i&gt;eudaimonia&lt;/i&gt;), intellectual and moral virtues, the golden mean. The Stanford Encyclopedia entry by Richard Kraut is an excellent free academic introduction.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://plato.stanford.edu/entries/aristotle-ethics/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP — Aristotle&#x27;s Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stanford Encyclopedia — Virtue Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;background for slides 44–46&lt;/div&gt;&lt;p&gt;Entry by Hursthouse and Pettigrove: presents virtue ethics as one of the three major approaches in normative ethics (alongside deontology and consequentialism) and traces its revival from Anscombe (1958) onwards.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://plato.stanford.edu/entries/ethics-virtue/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP — Virtue Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;G.E.M. Anscombe (1958), “Modern Moral Philosophy”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;Essay published in &lt;i&gt;Philosophy&lt;/i&gt; 33(124), January 1958. It criticises concepts such as “moral obligation” and coins the term &lt;i&gt;consequentialism&lt;/i&gt;; it is regarded as the starting point of contemporary virtue ethics.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Modern_Moral_Philosophy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — Modern Moral Philosophy&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Alasdair MacIntyre, &lt;i&gt;After Virtue&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46 (1985 ed.) · slide 53&lt;/div&gt;&lt;p&gt;First published in 1981 (2nd ed. 1985, 3rd ed. 2007, University of Notre Dame Press). It diagnoses the disappearance of virtue from modern life and proposes its recovery; it introduces the &lt;i&gt;virtues–practice–institution&lt;/i&gt; scheme later applied by Moore to companies.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://philpapers.org/rec/MACAVA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers — After Virtue&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Heather Battaly (2010), “Introduction: Virtue and Vice”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;In &lt;i&gt;Metaphilosophy&lt;/i&gt; 41(1‑2), pp. 1–21, later in the volume &lt;i&gt;Virtue and Vice, Moral and Epistemic&lt;/i&gt; (Wiley-Blackwell). It asks what a virtue theory, a virtue and a vice are; it distinguishes virtue as the capacity to attain good ends from virtue as good motivation.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://philpapers.org/rec/BATIVA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers — Battaly 2010&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Goodpaster &amp;amp; Matthews (1982), “Can a Corporation Have a Conscience?”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt; 60, Jan.–Feb. 1982, pp. 132–141. The authors argue that organisations should be judged by the same moral standards as individuals and can have a “conscience” — the basis of the person/company analogy on slide 46.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://law.wvu.edu/the-business-of-human-rights/2013/03/08/literature-review-can-a-corporation-have-a-conscience&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Literature review (WVU Law)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2005), “Corporate Character”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;“Corporate character: Modern virtue ethics and the virtuous corporation”, &lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 15(4), pp. 659–685. Applies MacIntyre to the firm: the corporation is the institution that houses a practice; it defines &lt;i&gt;corporate character&lt;/i&gt; as distinct from corporate culture and values.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/corporate-character-modern-virtue-ethics-and-the-virtuous-corporation/AD19AB876E80F63377D9F666E0C4F913&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2008), “Re-imagining the morality of management”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 18(4), pp. 483–511. Starts from MacIntyre&#x27;s critique of managers and uses the same virtues–practice–institution scheme to rethink the morality of management.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v18y2008i04p483-511_01.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc / IDEAS&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Geoff Moore (2015), “Corporate character, corporate virtues”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 46&lt;/div&gt;&lt;p&gt;&lt;i&gt;Business Ethics: A European Review&lt;/i&gt; 24(S2), pp. S99–S114. Proposes a framework for determining which virtues an organisation needs and a first taxonomy of &lt;i&gt;corporate virtues&lt;/i&gt;. A free accepted version is available in the Durham repository.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://durham-repository.worktribe.com/output/1436025/corporate-character-corporate-virtues&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Durham Research Online&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Carol Gilligan, &lt;i&gt;In a Different Voice&lt;/i&gt; (1982)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slides 49–50, 53&lt;/div&gt;&lt;p&gt;Harvard University Press. Critiques Kohlberg&#x27;s model of moral development and identifies a mode of moral reasoning based on care rather than justice; translated into 16 languages. The debate on her critique remains open.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/In_a_Different_Voice&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — In a Different Voice&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Virginia Held, &lt;i&gt;The Ethics of Care: Personal, Political, and Global&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 53&lt;/div&gt;&lt;p&gt;Oxford University Press, 2006. Defends care as a moral theory in its own right, distinct from Kantian ethics and utilitarianism, and extends it to politics, markets and the global dimension.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ndpr.nd.edu/news/the-ethics-of-care-personal-political-global/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review in NDPR&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Internet Encyclopedia of Philosophy — Care Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;background for slides 49–50&lt;/div&gt;&lt;p&gt;Academic overview: origins (Gilligan, Noddings), later authors (Held, Tronto, Kittay…), comparison with Kant and utilitarianism, main criticisms.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://iep.utm.edu/care-ethics/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IEP — Care Ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jürgen Habermas, &lt;i&gt;Moral Consciousness and Communicative Action&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slides 51, 53&lt;/div&gt;&lt;p&gt;German original 1983 (Suhrkamp), English translation MIT Press 1990. Develops discourse ethics, which replaces the categorical imperative with a procedure of reasoned agreement among all those affected.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://search.worldcat.org/title/Moral-consciousness-and-communicative-action/oclc/20670280&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Discourse_ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — Discourse ethics&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Zygmunt Bauman, &lt;i&gt;Postmodern Ethics&lt;/i&gt; (1993)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slides 52–53&lt;/div&gt;&lt;p&gt;Blackwell, 1993. Argues that the postmodern era opens up a radically new understanding of ethics and criticises theories that reduce morality to utilitarian rational choice.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://gov.wiley.com/WileyCDA/WileyTitle/productCd-063118693X.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wiley-Blackwell catalogue page&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer &amp;amp; Spence (2019), &lt;i&gt;Business Ethics&lt;/i&gt;, 5th ed.&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;course textbook · slides 53–54, 64, 67–68&lt;/div&gt;&lt;p&gt;Oxford University Press, 2019 (ISBN 9780198810070), subtitled &lt;i&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;. Chapter 3 underpins the entire lecture: comparison tables, pluralism, considerations, the toys case.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ubffm.hds.hebis.de/Record/HEB451213327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bibliographic record&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wicks, Freeman, Werhane &amp;amp; Martin (2010), &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slides 55–57, 71&lt;/div&gt;&lt;p&gt;Pearson/Prentice Hall (© 2010). Chapter 1, “The language of ethics” (pp. 1–21), is assigned reading and the source of the three decision guides for managers.&lt;/p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ethics Unwrapped — Virtue Ethics&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 45&lt;/div&gt;&lt;p&gt;Free programme from the McCombs School of Business (UT Austin) with over 130 short videos; the “Ethics Defined” series explains concepts in 1–2 minutes. Its entry on virtue ethics describes it as an invitation to live morally by cultivating virtuous habits.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;link from the slides&lt;/span&gt; &lt;a href=&quot;https://ethicsunwrapped.utexas.edu/glossary/virtue-ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethicsunwrapped.utexas.edu&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Edwin M. Hartman — virtue in business&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;slide 45 (video)&lt;/div&gt;&lt;p&gt;The video on the slide addresses “which virtues for business and why”. For further reading: &lt;i&gt;Virtue in Business: Conversations with Aristotle&lt;/i&gt; (Cambridge UP, 2013), which applies to companies and leaders the Aristotelian idea that character matters more than individual actions.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;video: link from the slides&lt;/span&gt; &lt;a href=&quot;https://www.youtube.com/watch?v=uWVVulWMmu0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt; · &lt;span class=&quot;src ext&quot;&gt;book: external source&lt;/span&gt; &lt;a href=&quot;https://www.cambridge.org/core/product/8B65B00DFDC6FCA79A77C919B47A3247&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;The sword dilemma and the short cut theories (slides 47–48) are materials © Prof. Elena Cavagnaro, adapted in the course slides.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

 [&quot;Too abstract&quot;,&quot;General principles far removed from the concrete situation in which the manager has to decide.&quot;,&quot;Virtue ethics and postmodern ethics: they start from the person&#x27;s character and from concrete practices.&quot;],
