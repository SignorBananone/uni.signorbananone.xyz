 &lt;h2&gt;The bridge to Part I&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;This lecture begins at slide 43, but it presupposes everything that came before: the “classical” theories and their limitations. Here are the essentials you need to keep your bearings.&lt;/p&gt;
 &lt;p class=&quot;note&quot; style=&quot;border:0;margin:0&quot;&gt;Everything in this section labelled &lt;span class=&quot;src&quot;&gt;Part I&lt;/span&gt; comes from &lt;code&gt;corso/LECTURES/2. BE - NORMATIVE ETHICAL THEORIES - PART I/2. BE - Normative Ethical Theories 2026-2027 - part I.pdf&lt;/code&gt;.&lt;/p&gt;

 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Normative ethical theories&lt;/b&gt;Rules and principles that help determine what is “right” and “wrong”; &lt;em&gt;normative&lt;/em&gt; theories &lt;i&gt;prescribe&lt;/i&gt; the morally correct way to act, unlike &lt;em&gt;descriptive&lt;/em&gt; theories, which &lt;i&gt;describe&lt;/i&gt; how ethical decisions are actually made in organisations. &lt;span class=&quot;src&quot;&gt;Part I · slide 4&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Two families of modernist theories&lt;/h3&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 200&quot; role=&quot;img&quot; aria-label=&quot;Motivation/principles, action, outcomes&quot;&gt;
   &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
   &lt;ellipse cx=&quot;120&quot; cy=&quot;70&quot; rx=&quot;95&quot; ry=&quot;42&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;2&quot;/&gt;
   &lt;text x=&quot;120&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Motivation /&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Principles&lt;/text&gt;
   &lt;circle cx=&quot;360&quot; cy=&quot;70&quot; r=&quot;44&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Action&lt;/text&gt;
   &lt;ellipse cx=&quot;600&quot; cy=&quot;70&quot; rx=&quot;95&quot; ry=&quot;42&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Outcomes&lt;/text&gt;
   &lt;path d=&quot;M216 70H312&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M405 70H502&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
   &lt;path d=&quot;M40 130 q0 14 14 14 h176 q14 0 14 14 q0 -14 14 -14 h106 q14 0 14 -14&quot; fill=&quot;none&quot; stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;2&quot;/&gt;
   &lt;text x=&quot;245&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;Principle-based (deontological)&lt;/text&gt;
   &lt;path d=&quot;M372 130 q0 14 14 14 h86 q14 0 14 14 q0 -14 14 -14 h176 q14 0 14 -14&quot; fill=&quot;none&quot; stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;/&gt;
   &lt;text x=&quot;500&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--mattone)&quot;&gt;Consequentialist (teleological)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;&lt;em class=&quot;t&quot;&gt;Consequentialist theories&lt;/em&gt; (also called “teleological”, from the Greek &lt;i&gt;telos&lt;/i&gt; = end, goal) judge an action by its &lt;i&gt;outcomes&lt;/i&gt;; &lt;em class=&quot;t&quot;&gt;principle-based theories&lt;/em&gt; (deontological, from &lt;i&gt;deon&lt;/i&gt; = duty) judge it by the &lt;i&gt;principles&lt;/i&gt; that motivate it, regardless of its outcomes. &lt;span class=&quot;src&quot;&gt;Part I · slides 12–13&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;

 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card p-mattone&quot;&gt;&lt;h4&gt;Ethical egoism&lt;/h4&gt;&lt;p&gt;Right action consists in pursuing one&#x27;s own desires or interests (in the long term: &lt;i&gt;enlightened self-interest&lt;/i&gt;). Hobbes, Ayn Rand; Adam Smith and the “invisible hand”.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Part I · slides 15–17&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-mattone&quot;&gt;&lt;h4&gt;Utilitarianism&lt;/h4&gt;&lt;p&gt;“The greatest good for the greatest number”: costs and benefits are aggregated across everyone affected. &lt;i&gt;Act&lt;/i&gt; vs &lt;i&gt;rule&lt;/i&gt; utilitarianism. Bentham, J.S. Mill.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Part I · slides 18–21&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-ardesia&quot;&gt;&lt;h4&gt;Ethics of duties&lt;/h4&gt;&lt;p&gt;Kant: the &lt;i&gt;categorical imperative&lt;/i&gt; — act only according to a maxim that you can will to become a universal law; always treat humanity as an end, never merely as a means.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Part I · slides 25–28&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card p-ardesia&quot;&gt;&lt;h4&gt;Rights &amp;amp; justice&lt;/h4&gt;&lt;p&gt;Locke (natural rights), Rousseau (social contract), Rawls (veil of ignorance, difference principle); human rights, UN Global Compact.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;Part I · slides 31–38&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Why “alternatives” are needed: the limitations&lt;/h3&gt;
 &lt;p&gt;Part I closes by listing six limitations of Western modernist theories. Click on a limitation to see which of the new perspectives attempts to address it. &lt;span class=&quot;src&quot;&gt;Part I · slide 41&lt;/span&gt; &lt;span class=&quot;src int&quot;&gt;links: supplementary&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;limits&quot; role=&quot;tablist&quot; aria-label=&quot;Limitations of modernist theories&quot;&gt;
  &lt;button class=&quot;btn&quot; data-k=&quot;0&quot;&gt;Too abstract&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;1&quot;&gt;Too reductionist&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;2&quot;&gt;Too objective &amp;amp; elitist&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;3&quot;&gt;Too impersonal&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;4&quot;&gt;Too rational &amp;amp; codified&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;5&quot;&gt;Too imperialist&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;limitsOut&quot; aria-live=&quot;polite&quot;&gt;Choose a limitation.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;What is the difference between a normative and a descriptive theory?&lt;/summary&gt;&lt;div&gt;A normative theory states how one &lt;i&gt;ought&lt;/i&gt; to act (it prescribes); a descriptive theory explains how people &lt;i&gt;actually&lt;/i&gt; make decisions in organisations.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Utilitarianism and Kant reach the same conclusion in the trolley problem: why does the lecture say that we nonetheless “feel” the two situations are not the same?&lt;/summary&gt;&lt;div&gt;Because factors that abstract theories ignore come into play: the degree of &lt;i&gt;agency&lt;/i&gt;/responsibility required and the personal involvement of the “third person” (Part I, slide 29). This is precisely the kind of intuition that the alternative theories take seriously.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 1 VIRTUE --&gt;
&lt;section class=&quot;part p-salvia&quot; id=&quot;virtue&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;1 · Approaches based on character and integrity&lt;/div&gt;
 &lt;h2&gt;Virtue ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Not “what should I do?” but “what kind of person do I want to be?”. Moral judgement shifts from the action to the &lt;i&gt;character&lt;/i&gt; of the agent.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Virtue ethics&lt;/b&gt;Holds that morally correct actions are those undertaken by actors with a &lt;em&gt;virtuous character&lt;/em&gt;. Hence the formation of a virtuous character is the first step towards morally correct behaviour. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;The ingredients&lt;/h3&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Intellectual virtues&lt;/b&gt;&lt;br&gt;e.g. &lt;i&gt;practical wisdom&lt;/i&gt;&lt;span class=&quot;back&quot;&gt;Virtues of the mind. Foremost among them is &lt;i&gt;practical wisdom&lt;/i&gt; (Greek &lt;i&gt;phronesis&lt;/i&gt;): the ability to discern what is right to do &lt;i&gt;here and now&lt;/i&gt;, in a concrete situation. Without it, the moral virtues have no direction.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Moral virtues&lt;/b&gt;&lt;br&gt;temperance, courage, justice, honesty…&lt;span class=&quot;back&quot;&gt;Virtues of character: stable dispositions to act and feel in the right way. For Aristotle, each lies at the “mean” between an excess and a deficiency (see the slider below).&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Acquired traits&lt;/b&gt;&lt;br&gt;learned within a community&lt;span class=&quot;back&quot;&gt;No one is born virtuous: one becomes virtuous through learning and by &lt;i&gt;living in relationship with others in a community&lt;/i&gt;. We become courageous by performing courageous acts — virtue is a habit (Greek &lt;i&gt;hexis&lt;/i&gt;).&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Standard of excellence&lt;/b&gt;&lt;br&gt;striving for the best&lt;span class=&quot;back&quot;&gt;Virtue is excellence (&lt;i&gt;aretē&lt;/i&gt;): it is not enough to avoid wrongdoing; one strives to do well whatever one does, like a good professional. In business: quality of work, integrity, a reputation built over time.&lt;/span&gt;&lt;/button&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Click on the cards to open them. Core text: slide 44; the explanations of the Greek terms are supplementary.&lt;/p&gt;

 &lt;h3&gt;The “golden mean”: try the slider&lt;/h3&gt;
 &lt;p&gt;The slides do not mention it, but it lies at the heart of Aristotelian virtue (&lt;i&gt;Nicomachean Ethics&lt;/i&gt;, cited on slide 53): every moral virtue is a mean between two vices. &lt;span class=&quot;src int&quot;&gt;supplementary&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; role=&quot;tablist&quot; aria-label=&quot;Choose a virtue&quot; id=&quot;meanPick&quot;&gt;
  &lt;button class=&quot;btn&quot; data-v=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;Courage&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;1&quot;&gt;Honesty&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;2&quot;&gt;Generosity&lt;/button&gt;
 &lt;/div&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 120&quot; aria-hidden=&quot;true&quot;&gt;
   &lt;defs&gt;&lt;linearGradient id=&quot;gm&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--mattone)&quot;/&gt;&lt;stop offset=&quot;.5&quot; stop-color=&quot;var(--salvia)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--mattone)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
   &lt;rect x=&quot;20&quot; y=&quot;50&quot; width=&quot;660&quot; height=&quot;14&quot; rx=&quot;7&quot; fill=&quot;url(#gm)&quot; opacity=&quot;.85&quot;/&gt;
   &lt;text x=&quot;20&quot; y=&quot;35&quot; font-size=&quot;14&quot; id=&quot;mL&quot;&gt;Cowardice&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;35&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; id=&quot;mM&quot; style=&quot;fill:var(--salvia)&quot;&gt;Courage&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;35&quot; font-size=&quot;14&quot; text-anchor=&quot;end&quot; id=&quot;mR&quot;&gt;Recklessness&lt;/text&gt;
   &lt;text x=&quot;20&quot; y=&quot;92&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;deficiency&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;92&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink2)&quot;&gt;golden mean&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;92&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--ink2)&quot;&gt;excess&lt;/text&gt;
   &lt;circle id=&quot;mDot&quot; cx=&quot;350&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;
  &lt;/svg&gt;
  &lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; id=&quot;meanR&quot; aria-label=&quot;Position between deficiency and excess&quot;&gt;
  &lt;div class=&quot;out&quot; id=&quot;meanOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
 &lt;/figure&gt;

 &lt;h3&gt;Why it matters today: the “recovery” of virtue&lt;/h3&gt;
 &lt;ul class=&quot;tight&quot;&gt;
  &lt;li&gt;Virtue ethics is a &lt;em class=&quot;t&quot;&gt;developing approach&lt;/em&gt; in business ethics, arising from the “recovery” of the idea of virtue in philosophy during the second half of the twentieth century: &lt;b&gt;Anscombe (1958)&lt;/b&gt;, &lt;b&gt;MacIntyre (1985)&lt;/b&gt;, &lt;b&gt;Battaly (2010)&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
  &lt;li&gt;Virtues are the &lt;em class=&quot;t&quot;&gt;realization of the potential of human beings&lt;/em&gt;: the fulfilment of human potential so as to achieve what is good for oneself and for others. Actions are assessed in relation to the &lt;i&gt;development of the person&#x27;s character&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
  &lt;li&gt;Analogously, a company can develop a &lt;em class=&quot;t&quot;&gt;business culture or character&lt;/em&gt;: the organisation “grows” through the actions of its members, just as a person grows through their own (Goodpaster &amp;amp; Matthews 1982; Moore 2005, 2008, 2015). &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/li&gt;
 &lt;/ul&gt;

 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 250&quot; role=&quot;img&quot; aria-label=&quot;MacIntyre&#x27;s virtues, practice, institution scheme as taken up by Moore&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;680&quot; height=&quot;210&quot; rx=&quot;16&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;1.5&quot;/&gt;
   &lt;text x=&quot;40&quot; y=&quot;46&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;INSTITUTION — the firm&lt;/text&gt;
   &lt;text x=&quot;40&quot; y=&quot;66&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;pursues external goods: profit, power, status&lt;/text&gt;
   &lt;rect x=&quot;60&quot; y=&quot;86&quot; width=&quot;380&quot; height=&quot;124&quot; rx=&quot;14&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot; stroke-width=&quot;1.5&quot;/&gt;
   &lt;text x=&quot;80&quot; y=&quot;110&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--salvia)&quot;&gt;PRACTICE — the “craft”&lt;/text&gt;
   &lt;text x=&quot;80&quot; y=&quot;130&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;internal goods: excellence of the product&lt;/text&gt;
   &lt;text x=&quot;80&quot; y=&quot;146&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;and the perfection of its practitioners&lt;/text&gt;
   &lt;circle cx=&quot;360&quot; cy=&quot;166&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--salvia)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;171&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;virtues&lt;/text&gt;
   &lt;rect x=&quot;470&quot; y=&quot;96&quot; width=&quot;210&quot; height=&quot;104&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot;/&gt;
   &lt;text x=&quot;575&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--accent)&quot;&gt;Corporate character&lt;/text&gt;
   &lt;text x=&quot;575&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;protects the practice&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;from the pressure of&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;external goods&lt;/text&gt;
   &lt;path d=&quot;M470 150 H444&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;MacIntyre&#x27;s &lt;i&gt;virtues–practice–institution&lt;/i&gt; scheme, which Geoff Moore applies to the firm: the corporation is the institution that “houses” a practice; &lt;i&gt;corporate character&lt;/i&gt; is what prevents it from sacrificing excellence to profit alone. &lt;span class=&quot;src ext&quot;&gt;external source: Moore 2005, BEQ 15(4)&lt;/span&gt; — link in &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/figcaption&gt;
 &lt;/figure&gt;

 &lt;div class=&quot;tabs&quot; data-tabs&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Videos and materials from slide 45&quot;&gt;
   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Virtue ethics vs other theories&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Which virtues for business?&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;Slide 45 refers to the video &lt;i&gt;Ethics Defined: Virtue Ethics&lt;/i&gt; by &lt;b&gt;Ethics Unwrapped&lt;/b&gt; (University of Texas at Austin), which compares virtue ethics with the traditional theories: whereas the latter ask which &lt;i&gt;rule&lt;/i&gt; to follow or which &lt;i&gt;consequences&lt;/i&gt; to bring about, virtue ethics asks which &lt;i&gt;habits&lt;/i&gt; to cultivate. &lt;a href=&quot;https://ethicsunwrapped.utexas.edu/glossary/virtue-ethics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethicsunwrapped.utexas.edu&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;link from the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The second video (slide 45) is an interview with &lt;b&gt;Edwin M. Hartman&lt;/b&gt; (Leonard N. Stern School of Business, NYU) on which virtues are needed in business and why. Hartman develops the theme in his book &lt;i&gt;Virtue in Business: Conversations with Aristotle&lt;/i&gt; (Cambridge UP, 2013). &lt;a href=&quot;https://www.youtube.com/watch?v=uWVVulWMmu0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video on YouTube&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;link from the slides&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;book: external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;What is the “guiding question” of virtue ethics, as distinct from that of Kant or utilitarianism?&lt;/summary&gt;&lt;div&gt;“What kind of person (or company) do I want to be?” — what is assessed is the character that the action expresses and develops, not merely the rule observed or the outcome produced.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Distinguish between intellectual virtues and moral virtues, giving one example of each.&lt;/summary&gt;&lt;div&gt;Intellectual: practical wisdom (discerning what is right in the concrete case). Moral: courage, temperance, justice, honesty (stable dispositions of character).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What does it mean to say that virtues are “acquired traits”?&lt;/summary&gt;&lt;div&gt;They are acquired through learning and by living in relationship with others in a community; they are neither innate nor attained once and for all.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In what sense can a company have a “character”?&lt;/summary&gt;&lt;div&gt;By analogy with a person: the organisation develops a culture/character through the actions of its members (Goodpaster &amp;amp; Matthews 1982; Moore 2005–2015, slide 46).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 2 SHORTCUT --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;shortcut&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;2 · Ethical dilemma &amp;amp; ‘short cut’ theories&lt;/div&gt;
 &lt;h2&gt;Return the sword?&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Roman times. Your neighbour is leaving for war and entrusts you with a beautiful and valuable sword, inherited from his father. Years later he returns wounded and &lt;i&gt;insane&lt;/i&gt;. He asks for the sword back, but there is a serious risk that he will use it against himself or others. &lt;span class=&quot;src&quot;&gt;slide 47 · © Prof. Elena Cavagnaro&lt;/span&gt;&lt;/p&gt;
 &lt;p&gt;&lt;b&gt;What is your first, immediate reaction?&lt;/b&gt;&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;swordPick&quot;&gt;
  &lt;button class=&quot;btn&quot; data-s=&quot;give&quot;&gt;I return it&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;keep&quot;&gt;I keep it&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;swordOut&quot; aria-live=&quot;polite&quot;&gt;Choose on instinct first, then read what each theory would say.&lt;/div&gt;

 &lt;h3&gt;The two “short cut” theories&lt;/h3&gt;
 &lt;p&gt;The slides use the term &lt;em class=&quot;t&quot;&gt;short cut theories&lt;/em&gt; for two quick ways of reasoning about the dilemma. &lt;span class=&quot;src&quot;&gt;slide 48 · © Prof. Elena Cavagnaro&lt;/span&gt;&lt;/p&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 270&quot; role=&quot;img&quot; aria-label=&quot;Comparison of contract theory and due care theory&quot;&gt;
   &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;250&quot; rx=&quot;14&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;
   &lt;rect x=&quot;370&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;250&quot; rx=&quot;14&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot;/&gt;
   &lt;text x=&quot;180&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;Contract theory&lt;/text&gt;
   &lt;text x=&quot;180&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;“an agreement is an agreement”&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--salvia)&quot;&gt;Due care theory&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;“care as central principle”&lt;/text&gt;
   &lt;g font-size=&quot;13&quot;&gt;
    &lt;text x=&quot;30&quot; y=&quot;98&quot;&gt;• non-consequentialist&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;124&quot;&gt;• explicit or implicit contract&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;150&quot;&gt;• presupposes transparency and&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;168&quot;&gt;full information&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;194&quot; style=&quot;fill:var(--mattone)&quot;&gt;⚠ underestimates power&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;212&quot; style=&quot;fill:var(--mattone)&quot;&gt;asymmetries&lt;/text&gt;
    &lt;text x=&quot;390&quot; y=&quot;98&quot;&gt;• consequentialist&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;124&quot;&gt;• decisions in the context of&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;142&quot;&gt;personal relationships&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;168&quot;&gt;• actively taking&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;186&quot;&gt;responsibility; learning&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;204&quot;&gt;from experience&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;230&quot; style=&quot;fill:var(--mattone)&quot;&gt;⚠ risk of paternalism&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;180&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;→ return it&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;252&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;→ keep it (for now)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The limitation of due care theory is important: since it risks being &lt;i&gt;paternalistic&lt;/i&gt; (I decide what is good for you), it should be applied &lt;b&gt;only when the circumstances under which the agreement was made have changed drastically&lt;/b&gt; — as with the neighbour&#x27;s insanity. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;
 &lt;details&gt;&lt;summary&gt;Where does this dilemma come from?&lt;/summary&gt;&lt;div&gt;It is a classic example: in Plato&#x27;s &lt;i&gt;Republic&lt;/i&gt; (Book I), Socrates objects that “returning what one has received” cannot be the definition of justice, since we would not return weapons to a friend who has gone mad. &lt;span class=&quot;src int&quot;&gt;supplementary&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Why does contract theory “underestimate power asymmetries”?&lt;/summary&gt;&lt;div&gt;It treats every agreement as if it had been signed between equal, informed and free parties. In business this is often not the case (e.g. a small supplier and a large buyer, an employee and a company): “an agreement is an agreement” may then conceal unfair conditions. &lt;span class=&quot;src int&quot;&gt;example: supplementary&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Contract theory: consequentialist or non-consequentialist? And due care theory?&lt;/summary&gt;&lt;div&gt;Contract theory: non-consequentialist (what matters is honouring the agreement). Due care: consequentialist (what matters is avoiding the harm that returning the sword would cause).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;When is it legitimate to apply due care theory?&lt;/summary&gt;&lt;div&gt;Only when the circumstances under which the agreement was reached have changed drastically; otherwise one slides into paternalism.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which Part I theory is closest to contract theory?&lt;/summary&gt;&lt;div&gt;The principle-based theories (ethics of duty, social contract): what matters is the commitment undertaken, not the outcome.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 3 CARE --&gt;
&lt;section class=&quot;part p-mattone&quot; id=&quot;care&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;3 · Approaches based on relationship and responsibility&lt;/div&gt;
 &lt;h2&gt;Ethics of care&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;At the centre lies not an abstract principle but the concrete &lt;i&gt;web of relationships&lt;/i&gt; in which each of us is embedded. Key author: &lt;b&gt;Carol Gilligan&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethics of care&lt;/b&gt;An approach that prioritises &lt;em&gt;empathy&lt;/em&gt;, harmonious and healthy social relationships, mutual care and the &lt;em&gt;avoidance of harm&lt;/em&gt; &lt;b&gt;above abstract principles&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;

 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 260&quot; role=&quot;img&quot; aria-label=&quot;Ethic of justice as a ladder of principles, ethic of care as a web of relationships&quot;&gt;
   &lt;text x=&quot;170&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--ardesia)&quot;&gt;Ethic of justice (modernist)&lt;/text&gt;
   &lt;g stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M110 50V240M230 50V240&quot;/&gt;&lt;path d=&quot;M110 80H230M110 120H230M110 160H230M110 200H230&quot;/&gt;&lt;/g&gt;
   &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;75&quot;&gt;universal principles&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;115&quot;&gt;rules&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;155&quot;&gt;case&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;195&quot;&gt;decision&lt;/text&gt;&lt;/g&gt;
   &lt;text x=&quot;170&quot; y=&quot;256&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;moving from the abstract to the case&lt;/text&gt;
   &lt;text x=&quot;540&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--mattone)&quot;&gt;Ethic of care&lt;/text&gt;
   &lt;g stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M540 140L450 80M540 140L640 80M540 140L440 205M540 140L640 210M450 80L640 80M440 205L450 80M640 210L640 80&quot;/&gt;&lt;/g&gt;
   &lt;circle cx=&quot;540&quot; cy=&quot;140&quot; r=&quot;26&quot; fill=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;me&lt;/text&gt;
   &lt;g fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot; stroke-width=&quot;2&quot;&gt;&lt;circle cx=&quot;450&quot; cy=&quot;80&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;640&quot; cy=&quot;80&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;440&quot; cy=&quot;205&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;640&quot; cy=&quot;210&quot; r=&quot;22&quot;/&gt;&lt;/g&gt;
   &lt;g font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;450&quot; y=&quot;84&quot;&gt;colleagues&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;84&quot;&gt;family&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;209&quot;&gt;customers&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;214&quot;&gt;suppliers&lt;/text&gt;&lt;/g&gt;
   &lt;text x=&quot;540&quot; y=&quot;256&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--ink2)&quot;&gt;decisions are made within relationships&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Two ways of “seeing” a moral problem. &lt;span class=&quot;src int&quot;&gt;diagram: supplementary, based on slides 49–50&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;

 &lt;h3&gt;Key elements&lt;/h3&gt;
 &lt;p&gt;Click on the tabs. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; data-tabs&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Key elements of the ethics of care&quot;&gt;
   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Feminist approach&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Relationships &amp;amp; emotions&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Responsibility&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Processes&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;It is a &lt;em class=&quot;t&quot;&gt;feminist approach to business ethics&lt;/em&gt;. It originates in Gilligan&#x27;s book &lt;i&gt;In a Different Voice&lt;/i&gt; (1982), which challenged Lawrence Kohlberg&#x27;s theory of moral development: that theory rewarded reasoning based on abstract principles and judged relationship-centred reasoning, more common among the women interviewed, to be “less mature”. Gilligan instead recognises in it a “different voice” that is equally moral. &lt;span class=&quot;src ext&quot;&gt;external source: Wikipedia, In a Different Voice&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Decisions are made in the context of &lt;b&gt;personal human interrelationships&lt;/b&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Emotional commitment&lt;/b&gt;: emotional involvement is not a disturbance but part of the judgement&lt;/li&gt;&lt;li&gt;One is &lt;b&gt;bound by circumstances, relations and position&lt;/b&gt;: tied to the situation and to one&#x27;s own role&lt;/li&gt;&lt;li&gt;&lt;b&gt;Limited information&lt;/b&gt; and &lt;b&gt;unequal power positions&lt;/b&gt; are acknowledged (against contract theory&#x27;s assumption of equal, informed actors)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;What matters is the &lt;b&gt;active ‘taking’ of responsibility&lt;/b&gt;, not simply “having” it by contract or by role. A manager who is formally responsible for a department “has” responsibility; a manager who notices that a team member is struggling and steps in “takes” it. &lt;span class=&quot;src int&quot;&gt;example: supplementary&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Processes rather than results&lt;/b&gt;: there is no formula that yields the right answer once and for all; one &lt;b&gt;learns and develops from experience&lt;/b&gt;. Note the similarity with the due care theory on slide 48.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p&gt;Another key author is &lt;b&gt;Virginia Held&lt;/b&gt;, &lt;i&gt;The Ethics of Care: Personal, Political and Global&lt;/i&gt; (slide 53), who extends care from personal relationships to politics and global relations, including as a limit on the expansion of markets. &lt;span class=&quot;src ext&quot;&gt;external source: NDPR review&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;What does the ethics of care place “above abstract principles”?&lt;/summary&gt;&lt;div&gt;Empathy, healthy and harmonious social relationships, mutual care and the avoidance of harm.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What is the difference between “having” and “taking” responsibility?&lt;/summary&gt;&lt;div&gt;Having it is a formal condition (role, contract); taking it is an active commitment to caring for the other.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why is it called a “feminist approach”?&lt;/summary&gt;&lt;div&gt;Because it arises from Gilligan&#x27;s critique of models of moral development built on abstract and impersonal reasoning, and gives value to a relational “voice”.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 4 DISCOURSE --&gt;
&lt;section class=&quot;part p-ardesia&quot; id=&quot;discourse&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;4 · Approaches based on procedures of norm generation&lt;/div&gt;
 &lt;h2&gt;Discourse ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;We do not start from a pre-given norm: the norm is &lt;i&gt;constructed&lt;/i&gt; together, through discussion. Key author: &lt;b&gt;Jürgen Habermas&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discourse ethics&lt;/b&gt;Aims to resolve ethical conflicts by providing a &lt;em&gt;process of norm generation&lt;/em&gt; through rational reflection on the real-life experiences of &lt;b&gt;all relevant participants&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;The process, step by step&lt;/h3&gt;
 &lt;div class=&quot;steps&quot; id=&quot;dsteps&quot;&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 720 120&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;g id=&quot;dsDots&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;dsPrev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;dsNext&quot;&gt;Next →&lt;/button&gt;&lt;span id=&quot;dsN&quot; style=&quot;font-size:.85rem;color:var(--ink2)&quot;&gt;&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;out&quot; id=&quot;dsOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;
 &lt;/div&gt;

 &lt;h3&gt;The criteria of “ideal discourse”&lt;/h3&gt;
 &lt;p&gt;For the outcome to be genuinely acceptable to all, the discussion must satisfy four conditions. Click for an explanation. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Impartiality&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;Every participant must be able to consider everyone&#x27;s point of view, not only their own; no one has a voice that “counts for more”.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Non-persuasiveness&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;People are convinced by arguments, not by rhetoric, manipulation or communicative tricks.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Non-coercion&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;No one is forced to agree out of fear or economic or hierarchical pressure. This is the most delicate point when the parties have very unequal power.&lt;/span&gt;&lt;/button&gt;
  &lt;button class=&quot;flip&quot; aria-expanded=&quot;false&quot;&gt;&lt;b&gt;Expertise&lt;/b&gt;&lt;span class=&quot;back&quot;&gt;Participants must have (or be able to obtain) the knowledge needed to understand the issue: without information, consensus is merely apparent.&lt;/span&gt;&lt;/button&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Explanations of the criteria: supplementary. In &lt;i&gt;Moral Consciousness and Communicative Action&lt;/i&gt; (slide 53), Habermas essentially proposes replacing Kant&#x27;s categorical imperative with a &lt;i&gt;procedure&lt;/i&gt;: a norm is valid only if all those affected could accept its consequences without coercion. &lt;span class=&quot;src ext&quot;&gt;external source: MIT Press / Wikipedia “Discourse ethics”&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;What is the “ultimate goal” of discourse ethics in business?&lt;/summary&gt;&lt;div&gt;The &lt;i&gt;peaceful settlement of conflicts&lt;/i&gt;, with a solution acceptable to all.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;List the four criteria of ideal discourse.&lt;/summary&gt;&lt;div&gt;Impartiality, non-persuasiveness, non-coercion, expertise.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why is it described as a “procedural” approach?&lt;/summary&gt;&lt;div&gt;Because it does not supply the content of the norm, but the correct &lt;i&gt;procedure&lt;/i&gt; for generating it together.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 5 POSTMODERN --&gt;
&lt;section class=&quot;part p-ocra&quot; id=&quot;postmodern&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;5 · Approaches based on empathy and moral impulse&lt;/div&gt;
 &lt;h2&gt;Postmodern ethics&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Morality springs not from reason but from an &lt;i&gt;impulse&lt;/i&gt; towards the other, which precedes any rule. Key author: &lt;b&gt;Zygmunt Bauman&lt;/b&gt;.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Postmodern ethics&lt;/b&gt;Locates morality &lt;em&gt;beyond the realm of rationality&lt;/em&gt;, in an emotional &lt;em&gt;moral impulse&lt;/em&gt; towards others. It encourages individuals to question everyday practices and rules, and to listen to and act on their emotions, inner convictions and “gut feelings” about what is right or wrong in the particular decision. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/div&gt;
 &lt;h3&gt;Four features&lt;/h3&gt;
 &lt;details open&gt;&lt;summary&gt;Holistic approach&lt;/summary&gt;&lt;div&gt;No separation between the private and the professional sphere: there is no “me at the office” with a different morality. If you would not do something at home, it does not become right because it is “business”.&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Practices rather than principles&lt;/summary&gt;&lt;div&gt;What matters are concrete practices, not grand universal principles, which postmodernism regards with suspicion (they can turn into codes applied without thinking).&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Think local, act local&lt;/summary&gt;&lt;div&gt;It inverts the slogan “think global, act local”: judgement should be formed on the specific situation and the people affected, without universal pretensions.&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Preliminary character&lt;/summary&gt;&lt;div&gt;Conclusions are always provisional and open to revision: morality is an open-ended journey, not a definitive answer.&lt;/div&gt;&lt;/details&gt;
 &lt;p class=&quot;note&quot;&gt;Feature headings: slide 52; explanations: supplementary. Bauman is a sociologist; his &lt;i&gt;Postmodern Ethics&lt;/i&gt; (1993) argues that the postmodern era opens up a radically new understanding of ethics, and criticises the reduction of morality to utilitarian rational choice. &lt;span class=&quot;src ext&quot;&gt;external source: Wiley-Blackwell catalogue page&lt;/span&gt;&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Where does postmodern ethics locate morality?&lt;/summary&gt;&lt;div&gt;Beyond rationality, in an emotional moral impulse towards others.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What does “holistic approach” mean here?&lt;/summary&gt;&lt;div&gt;No separation between private ethics and professional ethics.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which risk of the modernist theories does it seek to avoid?&lt;/summary&gt;&lt;div&gt;Following company rules and codes “slavishly” without asking whether they are actually right (see slide 68).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 6 CONFRONTO --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;6 · Alternative perspectives on ethical theory&lt;/div&gt;
 &lt;h2&gt;All the theories compared&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Slides 53–54 summarise the four alternatives in two tables (source: Crane et al., 2019). Here they are set alongside the modernist theories from Part I (slides 39–40) to give the complete picture.&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; data-tabs id=&quot;cmpTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;Choose a theory&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;details style=&quot;margin-top:14px&quot;&gt;&lt;summary&gt;Show the full table&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;tablewrap&quot; id=&quot;cmpTable&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;p class=&quot;note&quot;&gt;The four “alternative” columns: slides 53–54. The four “modernist” columns: Part I, slides 39–40. Both from Crane et al. (2019).&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Match each theory to its “type”: virtue, feminist, procedural, poststructuralist.&lt;/summary&gt;&lt;div&gt;Virtue ethics → virtue; ethics of care → feminist; discourse ethics → procedural; postmodern ethics → poststructuralist.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What concept of human beings does discourse ethics hold? And postmodern ethics?&lt;/summary&gt;&lt;div&gt;Discourse: rational individuals who resolve conflicts through argumentation. Postmodern: human beings with an innate internal guide to ethics.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Who wrote “After Virtue”? And “Postmodern Ethics”?&lt;/summary&gt;&lt;div&gt;Alasdair MacIntyre; Zygmunt Bauman.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 7 GUIDE --&gt;
&lt;section class=&quot;part p-salvia&quot; id=&quot;guide&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;7 · From philosophy to practical judgment&lt;/div&gt;
 &lt;h2&gt;Decision guides for managers&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;Wicks, Freeman, Werhane and Martin (2010, ch. 1) translate three major families of theories into three concrete “guides” for business decision-makers.&lt;/p&gt;
 &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 720 250&quot; role=&quot;img&quot; aria-label=&quot;From theories to decision guides&quot;&gt;
   &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;53&quot;&gt;Deontology&lt;/text&gt;
    &lt;rect x=&quot;10&quot; y=&quot;97&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;130&quot;&gt;Virtue ethics&lt;/text&gt;
    &lt;rect x=&quot;10&quot; y=&quot;174&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;207&quot;&gt;Consequentialism&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;53&quot;&gt;Standard of Conduct&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;97&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--salvia)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;122&quot;&gt;Character and&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;139&quot;&gt;Relationships&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;174&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;199&quot;&gt;Purposes and&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;216&quot;&gt;Consequences&lt;/text&gt;
   &lt;/g&gt;
   &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M212 48H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M212 125H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M212 202H296&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 48H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 125H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M502 202H536&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
   &lt;g font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;&lt;text x=&quot;545&quot; y=&quot;53&quot;&gt;Which rules apply here?&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;130&quot;&gt;Who do we want to be?&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;207&quot;&gt;Which purposes, for whom?&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Theory → guide → practical question. &lt;span class=&quot;src&quot;&gt;slides 55–57&lt;/span&gt;&lt;/figcaption&gt;
 &lt;/figure&gt;
 &lt;div class=&quot;tabs&quot; data-tabs&gt;
  &lt;div role=&quot;tablist&quot; aria-label=&quot;The three guides&quot;&gt;
   &lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Standard of Conduct&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Character &amp;amp; Relationships&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Purposes &amp;amp; Consequences&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;From Deontology to Standard of Conduct.&lt;/b&gt; &lt;em class=&quot;t&quot;&gt;Standards of conduct&lt;/em&gt; are the principles and rules that govern a community: they establish which actions the community considers morally appropriate or inappropriate and help it articulate its own moral rules.&lt;/p&gt;&lt;p&gt;They exist at several levels: &lt;b&gt;company, industry, nation, international community&lt;/b&gt; — codes of ethics, standards, etc. &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;i&gt;Example:&lt;/i&gt; the corporate code of ethics; at international level, the UN Global Compact principles discussed in Part I (slide 32). &lt;span class=&quot;src int&quot;&gt;link&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;From Virtue Ethics to Character and Relationships.&lt;/b&gt; The key idea is that companies must &lt;em class=&quot;t&quot;&gt;“walk the talk”&lt;/em&gt; (do what they say) and find ways of doing business that allow them to &lt;i&gt;embody&lt;/i&gt; the character traits to which they aspire.&lt;/p&gt;&lt;p&gt;It is a matter of self-development and the pursuit of excellence: &lt;b&gt;“Who we want to be?”&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 56&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;From Consequentialism to Purposes and Consequences.&lt;/b&gt; Purposes and consequences are central both for managers and for the main &lt;em class=&quot;t&quot;&gt;stakeholders&lt;/em&gt; (employees, customers, suppliers, communities, shareholders…).&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Choosing a set of &lt;b&gt;defensible purposes&lt;/b&gt; and acting to achieve them is at the heart of ethical behaviour.&lt;/li&gt;&lt;li&gt;It matters morally that managers choose the &lt;b&gt;right goals&lt;/b&gt; and use the organisation&#x27;s resources to achieve them.&lt;/li&gt;&lt;li&gt;Creating &lt;b&gt;favourable consequences for key stakeholders&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 57&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Which theory does the “Standard of Conduct” derive from? Give an example of a level.&lt;/summary&gt;&lt;div&gt;From deontology. Levels: company (code of ethics), industry (sector standards), nation, international.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What does “walk the talk” mean for a company?&lt;/summary&gt;&lt;div&gt;Behaving consistently with its stated values, genuinely embodying the character traits to which it aspires.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why, in guide 3, does the choice of goals have moral value?&lt;/summary&gt;&lt;div&gt;Because the purposes chosen determine how the organisation&#x27;s resources are used and which consequences fall on stakeholders.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 8 TEST --&gt;
&lt;section class=&quot;part p-mattone&quot; id=&quot;test&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;8 · Avoiding rationalization&lt;/div&gt;
 &lt;h2&gt;Three tests against self-deception&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Rationalization&lt;/b&gt;The process by which we convince ourselves that a decision is right and defensible when in fact it merely serves our own interests or offers an easy way out. It is a common trap in decision-making. &lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Publicity test&lt;/h4&gt;&lt;p&gt;“Could you defend your decision if it became public?” — the image of the cat saying “I&#x27;m so embarrassed!”. If you would be embarrassed to read about it in the newspapers, something is wrong.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Reversibility test&lt;/h4&gt;&lt;p&gt;Put yourself in the shoes of those who would bear the main negative consequences: “could you defend your reasoning if you were on the losing side?” — the fish on the hook.&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 59&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · Generalizability test&lt;/h4&gt;&lt;p&gt;“Is the action you are considering, and its rationale, something you would want &lt;i&gt;everyone&lt;/i&gt; to adopt in similar circumstances?” — the chaotic car park: if everyone double-parked “just for a moment”…&lt;/p&gt;&lt;span class=&quot;src&quot;&gt;slide 59&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;note&quot;&gt;Links &lt;span class=&quot;src int&quot;&gt;supplementary&lt;/span&gt;: the &lt;i&gt;reversibility test&lt;/i&gt; recalls the golden rule and Rawls&#x27;s &lt;i&gt;veil of ignorance&lt;/i&gt;; the &lt;i&gt;generalizability test&lt;/i&gt; is Kant&#x27;s categorical imperative (maxim as universal law, Part I slides 26–28); the &lt;i&gt;publicity test&lt;/i&gt; relates to transparency towards stakeholders (Part I slide 3).&lt;/p&gt;

 &lt;h3&gt;Put them to the test&lt;/h3&gt;
 &lt;p&gt;Choose a situation and answer the three tests honestly.&lt;/p&gt;
 &lt;div class=&quot;row&quot; id=&quot;ratCase&quot;&gt;
  &lt;button class=&quot;btn&quot; data-c=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;The customs officer&#x27;s “gift”&lt;/button&gt;&lt;button class=&quot;btn&quot; data-c=&quot;1&quot;&gt;Padding the expense report&lt;/button&gt;&lt;button class=&quot;btn&quot; data-c=&quot;2&quot;&gt;Concealing a defect from the customer&lt;/button&gt;
 &lt;/div&gt;
 &lt;div class=&quot;card&quot; id=&quot;ratText&quot; style=&quot;margin:8px 0&quot;&gt;&lt;/div&gt;
 &lt;div id=&quot;ratQs&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;out&quot; id=&quot;ratOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;Define rationalization in your own words.&lt;/summary&gt;&lt;div&gt;Constructing good reasons “after the fact” for a choice that actually suits oneself or avoids a difficulty.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which of the three tests is closest to the categorical imperative?&lt;/summary&gt;&lt;div&gt;The generalizability test.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In the reversibility test, whose shoes should you put yourself in?&lt;/summary&gt;&lt;div&gt;Those of the people who would bear the main negative consequences of the decision.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- 9 PLURALISM --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;pluralism&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;9 · Towards a pragmatic use of ethical theory&lt;/div&gt;
 &lt;h2&gt;Ethical pluralism&lt;/h2&gt;
 &lt;p class=&quot;lead&quot;&gt;No theory is “the” truth. To make good decisions in business, all of them shed light on the same problem from different angles.&lt;/p&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Crane et al. (2019): for effective decision-making in business…&lt;/b&gt;
  &lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;do not single out one theory as the best or the true view of a dilemma;&lt;/li&gt;&lt;li&gt;recognise that &lt;u&gt;all&lt;/u&gt; approaches illuminate the same problem from different angles;&lt;/li&gt;&lt;li&gt;they are &lt;b&gt;complementary&lt;/b&gt;, not mutually exclusive;&lt;/li&gt;&lt;li&gt;advocate a position of &lt;em class=&quot;t&quot;&gt;pluralism&lt;/em&gt;;&lt;/li&gt;&lt;li&gt;a middle ground between &lt;em class=&quot;t&quot;&gt;absolutism&lt;/em&gt; and &lt;em class=&quot;t&quot;&gt;relativism&lt;/em&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 64&lt;/span&gt;&lt;/div&gt;

 &lt;h3&gt;Lens or prism?&lt;/h3&gt;
 &lt;div class=&quot;row&quot; id=&quot;lpPick&quot;&gt;&lt;button class=&quot;btn&quot; data-m=&quot;lens&quot; aria-pressed=&quot;true&quot;&gt;Typical perspective (lens)&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;prism&quot;&gt;Pluralistic perspective (prism)&lt;/button&gt;&lt;/div&gt;

   &lt;g id=&quot;lensG&quot;&gt;

    &lt;text x=&quot;250&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;‘Lens’ of ethical theory&lt;/text&gt;
    &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;3&quot;&gt;&lt;path d=&quot;M275 80L480 112&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M275 115L480 115&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M275 150L480 118&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;490&quot; y=&quot;95&quot; width=&quot;40&quot; height=&quot;40&quot; fill=&quot;var(--ardesia)&quot; transform=&quot;rotate(45 510 115)&quot;/&gt;
