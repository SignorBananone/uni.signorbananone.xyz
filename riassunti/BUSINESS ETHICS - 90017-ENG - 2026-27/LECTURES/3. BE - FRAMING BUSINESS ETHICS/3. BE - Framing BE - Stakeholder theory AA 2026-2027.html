      &lt;a href=&quot;#s8&quot; class=&quot;mnode&quot; style=&quot;--nb:var(--slate-bg);--nc:var(--slate)&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;472&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;14&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;498&quot;&gt;8 · Forme della teoria&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;600&quot; y=&quot;517&quot;&gt;D&amp;amp;P 1995 · Savage 1991&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s9&quot; class=&quot;mnode&quot; style=&quot;--nb:var(--brick-bg);--nc:var(--brick)&quot;&gt;&lt;rect x=&quot;710&quot; y=&quot;472&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;14&quot;/&gt;&lt;text x=&quot;805&quot; y=&quot;498&quot;&gt;9 · Common good&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;805&quot; y=&quot;517&quot;&gt;Melé 2009&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;

  &lt;/div&gt;
  &lt;nav class=&quot;toc&quot; aria-label=&quot;Indice&quot;&gt;
    &lt;a href=&quot;#s1&quot;&gt;1 Responsabilità&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 Shareholder model&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 Critiche&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;4 Verso il framework&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;5 Stakeholder model&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;6 Argomenti&lt;/a&gt;&lt;a href=&quot;#s7&quot;&gt;7 Mappe&lt;/a&gt;&lt;a href=&quot;#s8&quot;&gt;8 Forme&lt;/a&gt;&lt;a href=&quot;#s9&quot;&gt;9 Common good&lt;/a&gt;&lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;
  &lt;/nav&gt;
  &lt;p class=&quot;small&quot; style=&quot;margin-top:1rem&quot;&gt;Obiettivi dichiarati nell’Overview (slide 2): spiegare perché le imprese hanno responsabilità sociali; chiedersi a beneficio di chi vadano gestite; presentare la stakeholder theory; introdurre il common good approach; distinguere i concetti di CSR; esaminare criticamente la corporate citizenship. Gli ultimi due punti &lt;b&gt;non hanno slide dedicate in questo file&lt;/b&gt;: vedi la nota in fondo alla sezione 9.&lt;/p&gt;
&lt;/div&gt;
&lt;/header&gt;

&lt;main class=&quot;wrap&quot;&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Può un’impresa avere responsabilità sociali?&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;4–9&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;La lezione parte da una provocazione: se un’impresa è solo uno strumento per fare profitti, ha senso parlare della sua &lt;em class=&quot;t&quot;&gt;corporate social responsibility&lt;/em&gt; (CSR, la responsabilità sociale d’impresa)?&lt;/p&gt;

  &lt;div class=&quot;quote&quot;&gt;“The only one responsibility of business towards society is the maximization of profits to the shareholders within the legal framework and the ethical custom of the country.”&lt;cite&gt;Milton Friedman, 1970 · citato nelle slide 4 e 12&lt;/cite&gt;&lt;/div&gt;
  &lt;p&gt;Attenzione a cosa dice davvero la frase: Friedman non sostiene che tutto sia lecito. Il profitto va massimizzato &lt;b&gt;dentro&lt;/b&gt; due recinti, la legge e il &lt;em&gt;ethical custom&lt;/em&gt; (le consuetudini etiche) del paese. Quello che nega è che l’impresa abbia doveri sociali &lt;i&gt;ulteriori&lt;/i&gt;.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Dibattito Friedman&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;f-a&quot;&gt;Gli argomenti di Friedman&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;f-b&quot;&gt;La risposta: corporate moral agency&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;f-a&quot;&gt;
      &lt;p&gt;Il premio Nobel per l’economia Milton Friedman si oppose alla responsabilità sociale d’impresa con &lt;b&gt;tre argomenti&lt;/b&gt; (slide 5):&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;① Solo le persone&lt;/h4&gt;Solo gli esseri umani hanno responsabilità morale per le proprie azioni. Un’impresa, in quanto tale, no.&lt;/div&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;② Il mandato dei manager&lt;/h4&gt;I manager devono agire &lt;b&gt;solo&lt;/b&gt; nell’interesse degli shareholder (gli azionisti), che li hanno incaricati. Spendere per scopi sociali vuol dire usare soldi altrui.&lt;/div&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;③ È compito dello Stato&lt;/h4&gt;I problemi sociali sono di competenza dello Stato, non dei manager, che non hanno né legittimazione democratica né competenza.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;f-b&quot; hidden&gt;
      &lt;p&gt;Il dibattito è lungo e complesso, ma la letteratura riconosce in genere &lt;b&gt;un certo grado di responsabilità morale&lt;/b&gt; alle imprese (slide 6). Gli argomenti sono tre, uno per ciascun tipo di “identità”:&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Legal identity&lt;/h4&gt;L’identità giuridica: l’impresa stipula contratti, è soggetta a obblighi di legge, può fare causa e subire procedimenti. Ha diritti e doveri.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Agency identity&lt;/h4&gt;Ogni organizzazione ha una &lt;i&gt;corporate internal decision structure&lt;/i&gt; (struttura decisionale interna) che orienta le decisioni verso obiettivi predefiniti. Le decisioni sono quindi “dell’impresa”, non solo dei singoli &lt;small&gt;(French 1979)&lt;/small&gt;.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Organizational identity&lt;/h4&gt;Ogni organizzazione esprime credenze e valori su ciò che è giusto o sbagliato: la &lt;i&gt;organizational culture&lt;/i&gt; (cultura organizzativa) &lt;small&gt;(Moore 1999)&lt;/small&gt;.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Lettura di sintesi (non nelle slide): queste tre identità rispondono soprattutto all’argomento ①. Agli argomenti ② e ③ rispondono le sezioni successive: la legge che tutela altri gruppi (sez. 3) e lo stakeholder model (sez. 5).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le due domande che guidano la lezione&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Che tipo di responsabilità?&lt;/h4&gt;Economiche, legali, etiche… Quali doveri ha davvero un’impresa? &lt;small&gt;(slide 7)&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Verso chi?&lt;/h4&gt;Solo verso gli azionisti o verso tutti quelli che toccano le sue attività? &lt;small&gt;(slide 7 e 9: «What is the purpose of a corporation? For whose benefit should a company be managed?»)&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Esercizio in aula · Ethical dilemma 2: «When good results are bad results» (slide 8)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;La slide riporta solo le domande di discussione; il testo del caso del Professor Ballistico (la slide mostra solo una foto di laboratorio) non è nelle slide e va letto nel materiale del corso. &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Il titolo e la numerazione “Ethical dilemma” fanno pensare ai dilemmi del manuale Crane et al., capitoli 2 e 5 in bibliografia: è un’ipotesi da verificare.&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;Quali sono le principali questioni etiche per il Professor Ballistico?&lt;/li&gt;
      &lt;li&gt;Quali opzioni ha? Come le valuteresti?&lt;/li&gt;
      &lt;li&gt;Come dovrebbe procedere e cosa può fare, realisticamente, per evitare problemi simili in futuro?&lt;/li&gt;
      &lt;li&gt;Chi sono gli &lt;b&gt;stakeholder&lt;/b&gt; toccati dalla decisione?&lt;/li&gt;
      &lt;li&gt;Verso quali stakeholder ha responsabilità &lt;b&gt;primarie&lt;/b&gt;?&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;Le domande 4 e 5 anticipano i concetti delle sezioni 5 e 7: usale come ripasso dopo averle lette.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Friedman sostiene che l’impresa può fare qualsiasi cosa pur di massimizzare il profitto?&lt;/summary&gt;&lt;p&gt;No. Il profitto va massimizzato «within the legal framework and the ethical custom of the country». Friedman nega le responsabilità sociali &lt;i&gt;in più&lt;/i&gt;, non il rispetto di legge e consuetudini etiche.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Elenca i tre argomenti di Friedman.&lt;/summary&gt;&lt;p&gt;① Solo gli esseri umani hanno responsabilità morale; ② i manager devono agire solo nell’interesse degli azionisti; ③ i problemi sociali spettano allo Stato, non ai manager.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Su quali tre “identità” si fonda l’idea che un’impresa possa essere moralmente responsabile?&lt;/summary&gt;&lt;p&gt;Legal identity (diritti, doveri, contratti, cause), agency identity (struttura decisionale interna orientata a obiettivi, French 1979), organizational identity (valori e cultura organizzativa, Moore 1999).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--c:var(--ochre);--cbg:var(--ochre-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Il modello dominante: shareholder model&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;10–12&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Il modello che per decenni ha dominato il pensiero manageriale (chiamato anche &lt;em class=&quot;t&quot;&gt;managerial model&lt;/em&gt;) mette gli azionisti al centro: sono il gruppo principale e il primo obiettivo dei manager.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Le caratteristiche&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Companies with dispersed capital&lt;/b&gt;: imprese a capitale diffuso, con moltissimi piccoli azionisti.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Separation between ownership and management&lt;/b&gt;: chi possiede (gli azionisti) non coincide con chi gestisce (i manager).&lt;/li&gt;
        &lt;li&gt;Gli shareholder sono il gruppo più importante a cui il manager deve guardare.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Target&lt;/b&gt;: aumentare lo &lt;em class=&quot;t&quot;&gt;shareholder value&lt;/em&gt; (il valore per gli azionisti, di solito il valore di borsa).&lt;/li&gt;
        &lt;li&gt;Remunerazione e sistemi di incentivo dei manager sono allineati all’interesse degli azionisti, cioè al valore delle azioni.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;Schema del modello dominante: l&#x27;impresa al centro, gli azionisti evidenziati&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;a2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#a2)&quot;&gt;
          &lt;path d=&quot;M160 132 L120 96&quot; marker-start=&quot;url(#a2)&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;path d=&quot;M240 132 L280 96&quot;/&gt;&lt;path d=&quot;M120 214 L158 180&quot;/&gt;&lt;path d=&quot;M280 214 L242 180&quot;/&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;200&quot; cy=&quot;155&quot; rx=&quot;62&quot; ry=&quot;32&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Firm&lt;/text&gt;
        &lt;ellipse cx=&quot;85&quot; cy=&quot;68&quot; rx=&quot;72&quot; ry=&quot;34&quot; class=&quot;s-c&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot;&gt;Shareholders&lt;/text&gt;
        &lt;ellipse cx=&quot;315&quot; cy=&quot;68&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Customers&lt;/text&gt;
        &lt;ellipse cx=&quot;85&quot; cy=&quot;242&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Suppliers&lt;/text&gt;
        &lt;ellipse cx=&quot;315&quot; cy=&quot;242&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Employees&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ridisegnato dalla slide 11. Solo con gli azionisti c’è una relazione in &lt;b&gt;entrambe&lt;/b&gt; le direzioni (capitale in entrata, profitti in uscita); fornitori e dipendenti sono input, i clienti sono lo sbocco dell’output.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il meccanismo sotto il modello: il rapporto di agency&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; La separazione tra proprietà e gestione crea un rapporto di &lt;em class=&quot;t&quot;&gt;agency&lt;/em&gt;: il &lt;i&gt;principal&lt;/i&gt; (l’azionista) affida le proprie risorse a un &lt;i&gt;agent&lt;/i&gt; (il manager) che potrebbe perseguire fini propri. Lo shareholder model risponde legando gli incentivi del manager al prezzo delle azioni (ad esempio con le stock option), così che il manager guadagni quando guadagna l’azionista.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Agency&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ag1&quot;&gt;Il problema&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ag2&quot;&gt;La “soluzione” del modello&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ag3&quot;&gt;Il rischio&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag1&quot;&gt;&lt;p&gt;Il manager conosce l’impresa meglio dell’azionista disperso, che non può controllarlo da vicino. Può quindi decidere a proprio vantaggio (benefici personali, crescita fine a se stessa).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag2&quot; hidden&gt;&lt;p&gt;Un obiettivo unico e misurabile (lo shareholder value) e retribuzioni legate al titolo. Il motto è &lt;b&gt;«the business of business is business»&lt;/b&gt; (slide 12): l’impresa deve occuparsi d’affari e basta.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag3&quot; hidden&gt;&lt;p&gt;Se tutto si misura sul valore delle azioni, gli interessi degli altri gruppi (dipendenti, comunità, ambiente) diventano costi da comprimere, e il breve termine prevale. È proprio quanto contestano le critiche della sezione 3 e la prospettiva economica della sezione 4 (agency problem tra breve e lungo termine).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché lo shareholder model nasce in imprese a capitale diffuso?&lt;/summary&gt;&lt;p&gt;Perché lì proprietà e gestione sono separate: gli azionisti, numerosi e dispersi, delegano ai manager. Il modello serve a orientare i manager verso l’interesse dei proprietari.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il target dei manager in questo modello e come viene incentivato?&lt;/summary&gt;&lt;p&gt;Aumentare lo shareholder value (valore di borsa); incentivi e retribuzioni sono legati al valore delle azioni.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nello schema della slide 11, che cosa distingue la relazione con gli azionisti dalle altre?&lt;/summary&gt;&lt;p&gt;È l’unica rappresentata a doppio senso ed è evidenziata: gli azionisti sono il gruppo centrale, gli altri compaiono solo come input o come sbocco.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Perché il modello dominante non basta&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;13–17&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Le slide muovono tre critiche allo shareholder model: non coglie la complessità del XXI secolo, non è del tutto coerente con il diritto e non è coerente con l’etica di base.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Tre critiche&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;c1&quot;&gt;① Complessità&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c2&quot;&gt;② Diritto&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c3&quot;&gt;③ Etica&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;
      &lt;p&gt;Oggi il business è &lt;b&gt;global, complex, multi-faceted, interconnected, not fully predictable&lt;/b&gt;: globale, complesso, sfaccettato, interconnesso, non del tutto prevedibile. Un modello con un solo gruppo al centro non riesce a coglierne la dinamica.&lt;/p&gt;
      &lt;p&gt;Esempio della slide 13: lavoratrici e lavoratori del tessile in Bangladesh bloccano una strada a Dhaka (20 maggio 2020), durante il lockdown, per chiedere salari non pagati. Le decisioni dei marchi globali ricadono su persone lontane lungo la filiera.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;
      &lt;p&gt;Nel tempo la legge ha dato &lt;i&gt;de facto standing&lt;/i&gt; (un riconoscimento di fatto) alle pretese di gruppi diversi dagli azionisti: ha imposto di tener conto di &lt;b&gt;clienti, fornitori, comunità locali e dipendenti&lt;/b&gt;. Pensa alle norme sulla sicurezza sul lavoro e sui dispositivi di protezione, o sui rischi ambientali (le immagini della slide 14).&lt;/p&gt;
      &lt;p&gt;Gli scandali &lt;b&gt;Enron, WorldCom, Tyco… Volkswagen&lt;/b&gt; hanno ulteriormente messo in discussione il modello: la pressione sul valore per gli azionisti può spingere a frodi contabili o, nel caso Volkswagen, a manipolare i test sulle emissioni.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;
      &lt;p&gt;Il modello poggia sulla &lt;em class=&quot;t&quot;&gt;separation fallacy&lt;/em&gt; (la fallacia della separazione):&lt;/p&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.08rem&quot;&gt;It is useful to believe that sentences like “x is a business decision” have no ethical content or any implicit ethical point of view. And, it is useful to believe that sentences like “x is an ethical decision, the best thing to do all things considered” have no content or implicit view about value creation and trade (business).&lt;cite&gt;The Separation Fallacy · slide 15&lt;/cite&gt;&lt;/div&gt;
      &lt;p&gt;In parole semplici: si finge che le decisioni d’affari siano eticamente neutre e che l’etica non abbia nulla a che fare con la creazione di valore. Secondo la slide, questa fallacia regge gran parte del racconto dominante sul business, e non solo.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Dalla separazione all’integrazione&lt;/h3&gt;
  &lt;p&gt;Se business ed etica fossero davvero separati, non avrebbe senso parlare di responsabilità morale per le decisioni aziendali, e la battuta per cui “business ethics” sarebbe una contraddizione in termini sembrerebbe vera. Invece vale il &lt;em class=&quot;t&quot;&gt;responsibility principle&lt;/em&gt; (slide 16):&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility principle.&lt;/b&gt; «Most people, most of the time, want to and do accept responsibility for the effects of their actions on others»: la maggior parte delle persone, quasi sempre, vuole accettare (e accetta) la responsabilità degli effetti delle proprie azioni sugli altri.&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg id=&quot;sepsvg&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Business ed etica: separati o integrati&quot;&gt;
      &lt;circle id=&quot;cB&quot; cx=&quot;170&quot; cy=&quot;115&quot; r=&quot;88&quot; fill=&quot;var(--ochre)&quot; fill-opacity=&quot;.22&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; style=&quot;transition:transform .8s&quot;/&gt;
      &lt;circle id=&quot;cE&quot; cx=&quot;470&quot; cy=&quot;115&quot; r=&quot;88&quot; fill=&quot;var(--slate)&quot; fill-opacity=&quot;.22&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; style=&quot;transition:transform .8s&quot;/&gt;
      &lt;text id=&quot;tB&quot; x=&quot;130&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; style=&quot;transition:transform .8s&quot;&gt;Business&lt;/text&gt;
      &lt;text id=&quot;tE&quot; x=&quot;510&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; style=&quot;transition:transform .8s&quot;&gt;Ethics&lt;/text&gt;
      &lt;g id=&quot;hum&quot; opacity=&quot;0&quot; style=&quot;transition:opacity .8s&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;115&quot; r=&quot;30&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;human&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;beings&lt;/text&gt;&lt;/g&gt;
      &lt;text id=&quot;sepcap&quot; x=&quot;320&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;13&quot;&gt;Separation fallacy: due mondi che non si toccano&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div style=&quot;text-align:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;sepbtn&quot; aria-pressed=&quot;false&quot;&gt;Mostra la Integration Thesis&lt;/button&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Integration Thesis I&lt;/h4&gt;La maggior parte delle decisioni (o frasi) sul business ha un contenuto etico, o una visione etica implicita. La maggior parte delle decisioni etiche ha un contenuto di business, o una visione implicita del business.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Integration Thesis II&lt;/h4&gt;Non ha senso parlare di business senza parlare di etica; né di etica senza parlare di business; né di entrambi senza parlare di &lt;b&gt;esseri umani&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre critiche allo shareholder model?&lt;/summary&gt;&lt;p&gt;① Non coglie la complessità (globale, interconnessa, imprevedibile) del business del XXI secolo; ② non è del tutto coerente con il diritto, che tutela anche clienti, fornitori, comunità e dipendenti; ③ non è coerente con l’etica di base, perché poggia sulla separation fallacy.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa afferma la separation fallacy?&lt;/summary&gt;&lt;p&gt;Che le decisioni di business non abbiano contenuto etico e che le decisioni etiche non abbiano contenuto di business o di creazione di valore.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il “terzo elemento” che la Integration Thesis II aggiunge a business ed etica?&lt;/summary&gt;&lt;p&gt;Gli esseri umani: non ha senso parlare di business ed etica senza parlare delle persone.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Verso lo stakeholder framework&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;18, 19, 30, 31&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;La slide 18 chiude il ragionamento con un “se… allora”: se accettiamo quattro premesse, ci serve un nuovo modello di business.&lt;/p&gt;

  &lt;figure&gt;

      &lt;text x=&quot;608&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; style=&quot;font-family:var(--serif)&quot; font-size=&quot;21&quot; font-weight=&quot;600&quot;&gt;framework&lt;/text&gt;

    &lt;figcaption&gt;Ridisegnato dalla slide 18: le quattro condizioni insieme portano a un nuovo modello per il business.&lt;/figcaption&gt;

  &lt;h3&gt;Why stakeholders matter: la sintesi (slide 19)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Milton Friedman&lt;/h4&gt;Le imprese vanno gestite &lt;b&gt;solo&lt;/b&gt; nell’interesse dei loro proprietari.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;R. Edward Freeman&lt;/h4&gt;Anche altri hanno una &lt;b&gt;pretesa legittima&lt;/b&gt; (&lt;i&gt;legitimate claim&lt;/i&gt;) nei confronti dell’impresa, per tre ragioni ↓&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Legal perspective · la prospettiva giuridica&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lo &lt;em class=&quot;t&quot;&gt;stake&lt;/em&gt; (la “posta in gioco”, l’interesse che un gruppo ha nell’impresa) è già tutelato per legge in vari modi: per esempio con contratti vincolanti con dipendenti, fornitori e clienti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Economic perspective · la prospettiva economica&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Externalities&lt;/b&gt; (esternalità): effetti dell’attività d’impresa su soggetti &lt;i&gt;esterni&lt;/i&gt; ai rapporti contrattuali. &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Un esempio è l’inquinamento di una fabbrica, che danneggia chi vive vicino senza che nessun contratto lo compensi. Il mercato da solo non “vede” questi costi.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Agency problem&lt;/b&gt;: gli interessi di breve termine dei “proprietari” contro quelli di lungo termine di manager, dipendenti, clienti ecc. &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Un azionista può vendere il titolo domani; un dipendente o una comunità restano legati all’impresa per anni.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Ethical perspective · la prospettiva etica&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rifiuto della separation thesis (sez. 3) ed essere umano al centro delle decisioni di business.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The open question argument (slide 30)&lt;/h3&gt;
  &lt;p&gt;È una lista di domande da porsi &lt;b&gt;prima&lt;/b&gt; di ogni decisione, per non cadere nella separation fallacy. Prova a scorrerle su un caso &lt;span class=&quot;int&quot;&gt;esempio didattico&lt;/span&gt;: &lt;i&gt;un’azienda valuta di chiudere uno stabilimento italiano e spostare la produzione all’estero, dove costa meno.&lt;/i&gt;&lt;/p&gt;
  &lt;div class=&quot;panel stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Domanda 1&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;If this decision is made, for whom is value created and destroyed?&lt;/h4&gt;&lt;p&gt;Per chi si crea e per chi si distrugge valore? &lt;i&gt;Valore creato:&lt;/i&gt; azionisti (margini più alti), forse clienti (prezzi più bassi), lavoratori del nuovo paese. &lt;i&gt;Valore distrutto:&lt;/i&gt; dipendenti licenziati, fornitori locali, comune che perde gettito.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Domanda 2&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;Who is harmed and/or benefited by this decision?&lt;/h4&gt;&lt;p&gt;Chi ne è danneggiato e chi ne trae beneficio? Qui guardi alle &lt;b&gt;persone concrete&lt;/b&gt;: famiglie, indotto, territorio, e non solo alle voci di bilancio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Domanda 3&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;Whose rights are enabled and whose values are realized by this decision (and whose are not)?&lt;/h4&gt;&lt;p&gt;Di chi si realizzano i diritti e i valori, e di chi no? Le condizioni di lavoro nel nuovo stabilimento rispettano i diritti dei lavoratori? Gli impegni presi con il territorio vengono mantenuti?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Domanda 4&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;What kind of person will I (we) become if we make this decision?&lt;/h4&gt;&lt;p&gt;Che tipo di persona (di impresa) diventerò, o diventeremo, prendendo questa decisione? È la domanda sul &lt;b&gt;carattere&lt;/b&gt;, che ritorna nel principle of corporate character e nell’argument from character (sez. 5 e 6).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Le quattro domande ricalcano i quattro argomenti della sezione 6: valore (consequences), danni e benefici (consequences), diritti (rights), carattere (character).&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Remember!&lt;/b&gt; Stakeholders with &lt;b&gt;names and faces&lt;/b&gt; (slide 31): gli stakeholder non sono categorie astratte ma persone, con nomi, volti e famiglie.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le quattro premesse che, secondo la slide 18, rendono necessario un nuovo modello?&lt;/summary&gt;&lt;p&gt;Abbandonare la separation fallacy, adottare la integration thesis, accettare l’open question argument, riconoscere la necessità di una responsibility thesis.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Spiega con un esempio cosa sono le esternalità e perché contano per gli stakeholder.&lt;/summary&gt;&lt;p&gt;Sono effetti dell’attività d’impresa su soggetti esterni ai contratti (es. inquinamento sui residenti). Chi le subisce ha un interesse legittimo anche senza un contratto con l’impresa.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la quarta domanda dell’open question argument?&lt;/summary&gt;&lt;p&gt;«What kind of person will I (we) become if we make this decision?»: la domanda sul carattere.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--c:var(--accent);--cbg:var(--accent-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Lo stakeholder model&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;20–24&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder.&lt;/b&gt; «Any group or individual that can affect or is affected by the achievement of an organisation’s objectives»: qualsiasi gruppo o individuo che può influenzare il raggiungimento degli obiettivi di un’organizzazione o ne è influenzato. &lt;small&gt;(Freeman, 1984: 46)&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;Nota la doppia direzione: &lt;b&gt;can affect&lt;/b&gt; (chi ha potere sull’impresa) e &lt;b&gt;is affected&lt;/b&gt; (chi ne subisce gli effetti). Basta una delle due per essere stakeholder.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;

      &lt;figcaption&gt;Ridisegnato dalle slide 20–21: frecce in &lt;b&gt;entrambe&lt;/b&gt; le direzioni e nessun gruppo evidenziato. Clicca un nodo.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;panel&quot; id=&quot;hubpanel&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Different stakeholders, different «stakes»&lt;/span&gt;&lt;h4 style=&quot;margin-top:.6rem&quot;&gt;Clicca uno stakeholder&lt;/h4&gt;&lt;p&gt;Vedrai che cosa “mette in gioco” nell’impresa e che cosa si aspetta. &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Le descrizioni sono esempi esplicativi; le slide elencano solo i gruppi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il business come insieme di relazioni&lt;/h3&gt;
  &lt;p&gt;Il business si può intendere come &lt;b&gt;a set of relationships&lt;/b&gt; tra gruppi che hanno uno stake nelle attività che lo compongono (slide 21).&lt;/p&gt;
  &lt;div class=&quot;quote&quot;&gt;A ‘stakeholder theory’ is one that puts as a primary managerial task the charge to influence, or manage, or balance the set of relationships that can affect the achievement of an organization’s purpose.&lt;cite&gt;Freeman and Phillips, 2002, p. 334&lt;/cite&gt;&lt;/div&gt;

  &lt;h3&gt;New roles to management (slide 22)&lt;/h3&gt;
  &lt;p&gt;La responsabilità primaria del manager diventa &lt;b&gt;creare quanto più valore possibile per gli stakeholder&lt;/b&gt;. Quando gli interessi sono in conflitto, il manager deve &lt;b&gt;ripensare il problema&lt;/b&gt; in modo che quegli interessi possano andare insieme e si crei ancora più valore per ciascuno. Se servono &lt;em class=&quot;t&quot;&gt;tradeoffs&lt;/em&gt; (compromessi in cui uno guadagna e un altro perde), deve saperli fare e cominciare subito a &lt;b&gt;migliorarli&lt;/b&gt; per tutte le parti.&lt;/p&gt;

  &lt;figure class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;frontier&quot; viewBox=&quot;0 0 400 320&quot; role=&quot;img&quot; aria-label=&quot;Grafico della frontiera del valore tra azionisti e dipendenti&quot;&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;380&quot; y2=&quot;280&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;50&quot; y2=&quot;20&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;304&quot; text-anchor=&quot;end&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot;&gt;valore per gli azionisti →&lt;/text&gt;
        &lt;text x=&quot;16&quot; y=&quot;150&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 16 150)&quot; text-anchor=&quot;middle&quot;&gt;valore per i dipendenti →&lt;/text&gt;
        &lt;path id=&quot;fr0&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 5&quot;/&gt;
        &lt;path id=&quot;fr&quot; fill=&quot;var(--c)&quot; fill-opacity=&quot;.1&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;2.5&quot;/&gt;
        &lt;line id=&quot;frx&quot; stroke=&quot;var(--c)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;line id=&quot;fry&quot; stroke=&quot;var(--c)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;
        &lt;circle id=&quot;frp&quot; r=&quot;8&quot; fill=&quot;var(--c)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label class=&quot;rng&quot;&gt;Tradeoff: a chi va il valore &lt;output id=&quot;o-a&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-a&quot; min=&quot;5&quot; max=&quot;85&quot; value=&quot;45&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;rng&quot;&gt;Ripensare il problema (innovazione, cooperazione) &lt;output id=&quot;o-r&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-r&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
        &lt;p id=&quot;frtxt&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;&lt;span class=&quot;int&quot;&gt;illustrazione didattica&lt;/span&gt; Il grafico non è nelle slide: traduce in forma visiva la slide 22. Muovendo il primo cursore lungo la curva fai un tradeoff (uno guadagna, l’altro perde). Il secondo cursore sposta in fuori tutta la curva: è il “rethink the problem” di Freeman, che fa crescere il valore per tutti. La linea tratteggiata è la frontiera di partenza.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Tre principi: che cosa vuol dire “affects” e “affected by” (slide 24)&lt;/h3&gt;
  &lt;p&gt;Per Freeman i manager non sono più semplici &lt;i&gt;agents&lt;/i&gt; degli azionisti: devono considerare diritti e interessi di &lt;b&gt;tutti&lt;/b&gt; gli stakeholder legittimi. Evan e Freeman (1993) precisano i termini con tre principi:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate rights&lt;/h4&gt;L’impresa ha l’obbligo di non violare i diritti altrui.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate effect&lt;/h4&gt;Le imprese sono responsabili degli effetti delle loro azioni sugli altri.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate character&lt;/h4&gt;Che tipo di impresa voglio creare e costruire?&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un caso reale: Business Roundtable 2019 (slide 23)&lt;/h3&gt;
  &lt;p&gt;La slide riproduce lo &lt;b&gt;Statement on the Purpose of a Corporation&lt;/b&gt; della Business Roundtable (associazione degli amministratori delegati delle grandi imprese USA), diffuso il &lt;b&gt;19 agosto 2019&lt;/b&gt; e firmato da numerosi CEO. Il testo dichiara un &lt;i&gt;fundamental commitment to all of our stakeholders&lt;/i&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid4&quot; style=&quot;grid-template-columns:repeat(5,1fr)&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Customers&lt;/h4&gt;&lt;small&gt;creare valore, soddisfare o superare le aspettative&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Employees&lt;/h4&gt;&lt;small&gt;retribuire equamente, formazione, diversità, dignità&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Suppliers&lt;/h4&gt;&lt;small&gt;rapporti corretti ed etici con grandi e piccoli&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Communities&lt;/h4&gt;&lt;small&gt;rispetto, ambiente, pratiche sostenibili&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shareholders&lt;/h4&gt;&lt;small&gt;valore di lungo periodo, trasparenza&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;«Each of our stakeholders is essential.» &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Lo statement ha segnato il distacco dalla shareholder primacy che la Business Roundtable sosteneva dal 1997 (&lt;a href=&quot;https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Roundtable&lt;/a&gt;). In bibliografia c’è un commento di Harrison, Phillips e Freeman (2020): vedi «Per approfondire».&lt;/p&gt;
  &lt;style&gt;@media (max-width:760px){#s5 .grid4{grid-template-columns:1fr 1fr!important}}&lt;/style&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Riporta la definizione di stakeholder di Freeman (1984).&lt;/summary&gt;&lt;p&gt;«Any group or individual that can affect or is affected by the achievement of an organisation’s objectives.»&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa deve fare il manager quando gli interessi degli stakeholder sono in conflitto?&lt;/summary&gt;&lt;p&gt;Ripensare il problema perché gli interessi vadano insieme e si crei più valore per ciascuno; se servono tradeoff, farli e cominciare subito a migliorarli per tutte le parti.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i tre principi di Evan e Freeman (1993)?&lt;/summary&gt;&lt;p&gt;Principle of corporate rights (non violare i diritti altrui), principle of corporate effect (responsabilità per gli effetti delle proprie azioni), principle of corporate character (che impresa voglio costruire).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Confronta lo schema della slide 11 con quello della slide 20: che cosa cambia?&lt;/summary&gt;&lt;p&gt;Nella slide 20 compaiono più gruppi (government, competitors, civil society), le frecce vanno in entrambe le direzioni e gli azionisti non sono più evidenziati: sono uno stakeholder tra gli altri.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Quattro argomenti per il managing for stakeholders&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;25–29&lt;/b&gt; · tutte da Freeman, 2007&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Perché un’impresa dovrebbe essere gestita “per gli stakeholder”? Freeman offre quattro argomenti, ciascuno legato a una grande famiglia di teorie etiche.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Quattro argomenti&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;g1&quot;&gt;Rights&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g2&quot;&gt;Consequences&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g3&quot;&gt;Character&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g4&quot;&gt;Pragmatist&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g1&quot;&gt;
      &lt;h4&gt;Argument from Rights&lt;/h4&gt;
      &lt;p&gt;Gestire per gli stakeholder presuppone che gli stakeholder &lt;b&gt;abbiano dei diritti&lt;/b&gt;. Gli azionisti non possono usare la loro proprietà per limitare i diritti altrui: azionisti e manager (i loro &lt;i&gt;agents&lt;/i&gt;) non possono, per esempio, usare i beni dell’impresa per violare il diritto alla vita di altri.&lt;/p&gt;
      &lt;p&gt;Gli stakeholder sono esseri umani, «with names, faces and families», e meritano attenzione e protezione.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;La slide rimanda alla parte del corso sulle &lt;b&gt;teorie etiche normative&lt;/b&gt; e su business e diritti umani.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g2&quot; hidden&gt;
      &lt;h4&gt;Argument from Consequences&lt;/h4&gt;
      &lt;p&gt;Gestire per gli stakeholder può produrre &lt;b&gt;conseguenze migliori per tutti&lt;/b&gt;, perché riconosce che i loro interessi sono &lt;i&gt;joint&lt;/i&gt; (congiunti). Se uno stakeholder persegue sistematicamente i propri interessi a spese degli altri, gli altri ritirano il loro sostegno, oppure:&lt;/p&gt;
      &lt;figure style=&quot;margin:.6rem 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 640 190&quot; role=&quot;img&quot; aria-label=&quot;Tre reazioni degli stakeholder penalizzati&quot;&gt;
          &lt;defs&gt;&lt;marker id=&quot;a6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--c)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
          &lt;rect x=&quot;10&quot; y=&quot;62&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
          &lt;text x=&quot;95&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;uno stakeholder&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-size=&quot;12&quot;&gt;si prende tutto&lt;/text&gt;
          &lt;g stroke=&quot;var(--c)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;&gt;&lt;path d=&quot;M180 80 C 240 40 260 34 320 34&quot;/&gt;&lt;path d=&quot;M180 94 L320 94&quot;/&gt;&lt;path d=&quot;M180 108 C 240 150 260 154 320 154&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;12.5&quot;&gt;&lt;rect x=&quot;324&quot; y=&quot;12&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;32&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(1) exit&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;48&quot; class=&quot;s-ink2&quot;&gt;escono e formano una nuova rete di stakeholder&lt;/text&gt;
          &lt;rect x=&quot;324&quot; y=&quot;72&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;92&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(2) political process&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;usano la politica per vincolare chi abusa&lt;/text&gt;
          &lt;rect x=&quot;324&quot; y=&quot;132&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;152&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(3) invent&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;168&quot; class=&quot;s-ink2&quot;&gt;inventano un’altra attività per i propri bisogni&lt;/text&gt;&lt;/g&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.05rem&quot;&gt;If we think about stakeholders engaged in a series of bargains among themselves, then we would expect that as individual stakeholders recognized their joint interests, and made good decisions based on these interests, better consequences would result, than if they each narrowly pursued their individual self interests.&lt;cite&gt;Freeman, 2007 · slide 27&lt;/cite&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g3&quot; hidden&gt;
      &lt;h4&gt;The Argument from Character&lt;/h4&gt;
      &lt;p&gt;Per Freeman è uno degli argomenti più forti: chiede a manager e imprenditori &lt;b&gt;che tipo di impresa vogliono creare e costruire&lt;/b&gt;. La risposta è in gran parte una questione di carattere: &lt;i&gt;aspiration matters&lt;/i&gt;, contano le aspirazioni.&lt;/p&gt;
      &lt;p&gt;Le &lt;b&gt;business virtues&lt;/b&gt; (virtù d’impresa) di efficienza, equità, rispetto, integrità, mantenimento degli impegni sono decisive per creare valore per gli stakeholder. Ma queste virtù &lt;b&gt;mancano del tutto&lt;/b&gt; se si pensa solo al modello dominante e alla sua logica economica ristretta.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g4&quot; hidden&gt;
      &lt;h4&gt;The Pragmatist’s Argument&lt;/h4&gt;
      &lt;p&gt;I tre argomenti precedenti danno ragioni importanti per adottare un nuovo racconto del business. Il pragmatista vuole sapere &lt;b&gt;come possiamo vivere meglio&lt;/b&gt;: come costruire noi stessi e le nostre comunità in modo che valori come libertà e solidarietà siano presenti il più possibile nella vita di ogni giorno.&lt;/p&gt;
      &lt;p&gt;A volte conviene ragionare separatamente su conseguenze, diritti e carattere, ma nella realtà la vita è più ricca se possiamo &lt;b&gt;conversare su come vivere insieme meglio&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tscroll&quot; style=&quot;margin-top:1.2rem&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Argomento&lt;/th&gt;&lt;th&gt;Domanda chiave&lt;/th&gt;&lt;th&gt;Famiglia etica &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rights&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Quali diritti rispetto o violo?&lt;/td&gt;&lt;td&gt;Etiche dei diritti e del dovere (deontologiche)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consequences&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Quali effetti produco per tutti?&lt;/td&gt;&lt;td&gt;Etiche consequenzialiste (es. utilitarismo)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Character&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Che impresa voglio diventare?&lt;/td&gt;&lt;td&gt;Etica delle virtù&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Pragmatist&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Come viviamo meglio insieme?&lt;/td&gt;&lt;td&gt;Pragmatismo: tiene insieme le tre prospettive&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Nell’argument from consequences, quali tre reazioni hanno gli stakeholder penalizzati?&lt;/summary&gt;&lt;p&gt;(1) Uscire e formare una nuova rete di stakeholder; (2) usare il processo politico per vincolare lo stakeholder che abusa; (3) inventare un’altra attività per soddisfare i propri bisogni. In più, possono ritirare il loro sostegno.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché secondo Freeman le business virtues “mancano” nel modello dominante?&lt;/summary&gt;&lt;p&gt;Perché il modello dominante si affida solo a una logica economica ristretta, in cui virtù come equità, rispetto e integrità non trovano posto.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa aggiunge l’argomento pragmatista agli altri tre?&lt;/summary&gt;&lt;p&gt;Invece di considerare conseguenze, diritti e carattere separatamente, li tiene insieme in una conversazione su come vivere meglio insieme, con libertà e solidarietà nella vita quotidiana.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--c:var(--ochre);--cbg:var(--ochre-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Mappare gli stakeholder&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;33, 35–39&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Pause to reflect… (slide 33, adattata da Laine et al., 2022)&lt;/summary&gt;&lt;div&gt;
    &lt;ol&gt;
      &lt;li&gt;Scegli un’organizzazione che conosci e scrivi più stakeholder possibile: prima i più ovvi, poi quelli meno ovvi.&lt;/li&gt;
      &lt;li&gt;Per alcuni di essi, individua le pretese o richieste (&lt;i&gt;claims&lt;/i&gt;) verso l’organizzazione.&lt;/li&gt;
      &lt;li&gt;Gli interessi sono allineati o in conflitto? Ci sono pretese in concorrenza tra loro?&lt;/li&gt;
      &lt;li&gt;Quale scopo potrebbe allineare gli interessi della maggior parte degli stakeholder?&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;Fallo su carta: la pagina non raccoglie e non invia nulla.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Primary e secondary stakeholders (slide 35)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Cerchi concentrici: impresa, stakeholder primari, stakeholder secondari&quot;&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;170&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;108&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;40&quot; fill=&quot;var(--c)&quot;/&gt;
        &lt;text x=&quot;180&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;THE FIRM&lt;/text&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;s-ink&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;140&quot; y=&quot;110&quot;&gt;Communities&lt;/text&gt;&lt;text x=&quot;225&quot; y=&quot;110&quot;&gt;Customers&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;186&quot;&gt;Employees&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;260&quot;&gt;Suppliers&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;230&quot;&gt;Financiers&lt;/text&gt;
        &lt;/g&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;s-ink2&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;180&quot; y=&quot;34&quot;&gt;Government&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;130&quot;&gt;Competitors&lt;/text&gt;&lt;text x=&quot;296&quot; y=&quot;296&quot;&gt;Consumer&lt;/text&gt;&lt;text x=&quot;296&quot; y=&quot;309&quot;&gt;advocate groups&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;296&quot;&gt;Special interest&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;309&quot;&gt;groups&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;130&quot;&gt;Media&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;180&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--c)&quot; font-weight=&quot;700&quot;&gt;PRIMARY&lt;/text&gt;
        &lt;text x=&quot;180&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--c)&quot; font-weight=&quot;700&quot;&gt;SECONDARY&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ridisegnato dalla figura della slide 35.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Primary stakeholder group&lt;/b&gt; è quello da cui l’impresa &lt;b&gt;dipende per la propria sopravvivenza&lt;/b&gt; &lt;small&gt;(Clarkson 1995)&lt;/small&gt;. Sono cinque gruppi: investitori e azionisti, dipendenti, clienti, fornitori e un &lt;i&gt;public group&lt;/i&gt; di governi e comunità, che controllano infrastrutture e mercati e impongono leggi da rispettare e tasse da pagare.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; I &lt;b&gt;secondary stakeholders&lt;/b&gt; influenzano l’impresa o ne sono influenzati, ma l’impresa non dipende da loro per sopravvivere (media, concorrenti, gruppi di interesse, associazioni dei consumatori).&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Attenzione a un’incongruenza:&lt;/b&gt; il testo di Clarkson mette governi e comunità tra i primari, mentre la figura della slide colloca &lt;i&gt;Government&lt;/i&gt; nell’anello esterno. All’esame conviene citare la definizione e segnalare che la classificazione dipende dal contesto.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel&quot; id=&quot;sortgame&quot;&gt;
    &lt;h4&gt;Mini-esercizio: primario o secondario?&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Classifica secondo la definizione di Clarkson riportata nella slide 35.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Come lo fanno organizzazioni diverse (slide 36–38)&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Novo Nordisk&lt;/h4&gt;Una ragnatela di cerchi: al centro le &lt;b&gt;people with diabetes&lt;/b&gt;, poi shareholders, employees, customers, healthcare providers; all’esterno regulatory authorities, media, NGOs, policy makers, comunità locali, istituzioni educative…&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Westchester Probation Service&lt;/h4&gt;Tre anelli: &lt;b&gt;internal&lt;/b&gt; (staff, trade union, probation board), &lt;b&gt;directly affected&lt;/b&gt; (offenders, victims, courts, police, prisons…), &lt;b&gt;indirectly affected&lt;/b&gt; (suppliers, other probation services, voluntary organisations…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Comunità scientifica&lt;/h4&gt;Al centro gli &lt;b&gt;scientists&lt;/b&gt;, collegati ad academia, private industry, non-profit, government, community, ciascuno con i propri sotto-gruppi (studenti, citizen-scientists, policymakers, bibliotecari…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;comindwork.com&lt;/h4&gt;Al centro il &lt;b&gt;management&lt;/b&gt;, poi stakeholder primari (strategic partners, shareholders, staff, strategic clients) e secondari (banks, media, government, associations…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;PrincetonGreen community&lt;/h4&gt;Al centro i &lt;b&gt;clients&lt;/b&gt;, poi primary stakeholders (leadership, partners, interns) e secondary constituents (inventors, family members, legislators, media…).&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Che cosa insegnano&lt;/h4&gt;Non esiste una mappa unica: &lt;b&gt;chi sta al centro&lt;/b&gt; e come si raggruppano gli stakeholder rivela lo scopo che l’organizzazione si dà.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The network relations (Rowley, 1997)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;

          &lt;circle cx=&quot;150&quot; cy=&quot;25&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;29&quot; class=&quot;s-ink&quot;&gt;Supp. C&lt;/text&gt;

          &lt;circle cx=&quot;370&quot; cy=&quot;250&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;254&quot; class=&quot;s-ink&quot;&gt;Cust. B&lt;/text&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;200&quot; cy=&quot;160&quot; rx=&quot;42&quot; ry=&quot;24&quot; class=&quot;s-c&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot;&gt;Firm&lt;/text&gt;

          &lt;ellipse cx=&quot;290&quot; cy=&quot;90&quot; rx=&quot;44&quot; ry=&quot;20&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;94&quot; class=&quot;s-ink&quot;&gt;Stakeh. A&lt;/text&gt;
          &lt;ellipse cx=&quot;320&quot; cy=&quot;190&quot; rx=&quot;44&quot; ry=&quot;20&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;194&quot; class=&quot;s-ink&quot;&gt;Stakeh. B&lt;/text&gt;
          &lt;ellipse cx=&quot;200&quot; cy=&quot;260&quot; rx=&quot;36&quot; ry=&quot;18&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;
          &lt;ellipse cx=&quot;90&quot; cy=&quot;220&quot; rx=&quot;36&quot; ry=&quot;18&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;
