      &lt;div style=&quot;text-align:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;netbtn&quot; aria-pressed=&quot;false&quot;&gt;Mostra la rete&lt;/button&gt;&lt;/div&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;Lo schema “a raggiera” mostra solo legami &lt;b&gt;diadici&lt;/b&gt; (a due: impresa–stakeholder). Ma gli stakeholder sono legati &lt;b&gt;anche tra loro&lt;/b&gt;: lo stakeholder A ha i suoi clienti e dipendenti, lo stakeholder C i suoi fornitori, e così via (slide 39).&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Rowley usa la social network analysis per spiegare come l’impresa risponde alla pressione simultanea di più stakeholder interconnessi, superando l’analisi delle singole coppie (&lt;a href=&quot;https://doi.org/10.2307/259248&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Academy of Management Review, 1997&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il criterio di Clarkson per dire che uno stakeholder è primario?&lt;/summary&gt;&lt;p&gt;L’impresa dipende da lui per la propria sopravvivenza.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i cinque gruppi primari secondo Clarkson?&lt;/summary&gt;&lt;p&gt;Investitori e azionisti, dipendenti, clienti, fornitori, e il public group di governi e comunità.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa aggiunge la prospettiva di rete di Rowley allo schema classico?&lt;/summary&gt;&lt;p&gt;Gli stakeholder non sono legati solo all’impresa ma anche tra loro; l’impresa sta dentro una rete di relazioni e deve rispondere a pressioni simultanee e interdipendenti.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Le forme della stakeholder theory&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;44–49, 51&lt;/b&gt; · Donaldson e Preston, 1995; Savage et al., 1991&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;“Stakeholder theory” non è una cosa sola. Donaldson e Preston distinguono quattro usi della teoria, che rispondono a domande diverse.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Quattro forme&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;d1&quot;&gt;Descriptive&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d2&quot;&gt;Instrumental&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d3&quot;&gt;Normative&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d4&quot;&gt;Managerial&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d1&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;le imprese lo fanno davvero?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Cerca di stabilire &lt;b&gt;se (e come)&lt;/b&gt; le imprese &lt;i&gt;actually do&lt;/i&gt; tengono conto degli interessi degli stakeholder. Serve a descrivere, e talvolta a spiegare, caratteristiche e comportamenti delle imprese.&lt;/p&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.05rem&quot;&gt;It describes the corporation as a constellation of cooperative and competitive interests possessing intrinsic value.&lt;cite&gt;Donaldson e Preston, 1995 · slide 45&lt;/cite&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d2&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;conviene all’impresa?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Chiede se sia &lt;i&gt;beneficial for the corporation&lt;/i&gt; tenere conto degli stakeholder. Con l’aiuto dei dati empirici cerca i &lt;b&gt;legami (o la loro assenza)&lt;/b&gt; tra stakeholder management e obiettivi tradizionali: profittabilità, stabilità, crescita.&lt;/p&gt;
      &lt;p&gt;Ipotesi centrale: a parità di altre condizioni, le imprese che praticano lo stakeholder management avranno risultati relativamente migliori in termini convenzionali.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d3&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;perché le imprese dovrebbero farlo?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Dà una &lt;b&gt;ragione&lt;/b&gt; per cui le imprese &lt;i&gt;should&lt;/i&gt; considerare gli stakeholder. Per Donaldson e Preston è la base fondamentale della teoria e accetta due idee:&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;gli stakeholder sono persone o gruppi con &lt;b&gt;interessi legittimi&lt;/b&gt; in aspetti procedurali e/o sostanziali dell’attività d’impresa, e sono identificati dai loro interessi, che l’impresa abbia o no un interesse funzionale verso di loro;&lt;/li&gt;
        &lt;li&gt;gli interessi di tutti gli stakeholder hanno &lt;b&gt;valore intrinseco&lt;/b&gt;: ogni gruppo merita considerazione &lt;i&gt;per se stesso&lt;/i&gt;, non solo perché utile a un altro gruppo, come gli azionisti.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d4&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;come si fa?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Non si limita a descrivere o a prevedere rapporti causa-effetto: &lt;i&gt;recommends&lt;/i&gt; atteggiamenti, strutture e pratiche che insieme costituiscono lo &lt;b&gt;stakeholder management&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;Tratto chiave: &lt;b&gt;attenzione simultanea&lt;/b&gt; agli interessi legittimi di tutti gli stakeholder appropriati, sia nelle strutture e nelle politiche generali sia nelle decisioni caso per caso.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center;margin-top:1.4rem&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 300&quot; role=&quot;img&quot; aria-label=&quot;Tre cerchi concentrici: descriptive, instrumental, normative&quot;&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;150&quot; r=&quot;140&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;165&quot; r=&quot;96&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;185&quot; r=&quot;50&quot; fill=&quot;var(--c)&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Descriptive&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Instrumental&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Normative&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nell’articolo originale i tre aspetti sono disegnati come cerchi annidati: lo strato esterno descrittivo, poi quello strumentale, al centro il nucleo normativo. Gli autori li considerano distinti, ciascuno con un tipo di prova diverso, ma &lt;b&gt;si sostengono a vicenda&lt;/b&gt;, e la base normativa è quella fondamentale (&lt;a href=&quot;https://doi.org/10.5465/amr.1995.9503271992&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract, Academy of Management Review&lt;/a&gt;).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;La forma managerial della slide 44 attraversa le altre tre: traduce la teoria in pratiche.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Strategic Stakeholder Management Approach (slide 49)&lt;/h3&gt;
  &lt;p&gt;Una versione strumentale e strategica: mappa l’&lt;b&gt;importanza relativa&lt;/b&gt; di ogni stakeholder per l’organizzazione secondo due dimensioni, la &lt;b&gt;capacity for threat&lt;/b&gt; (capacità di minacciare l’impresa) e la &lt;b&gt;potential for co-operation&lt;/b&gt; (potenziale di cooperazione). Muovi i cursori.&lt;/p&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;savage&quot; viewBox=&quot;0 0 340 320&quot; role=&quot;img&quot; aria-label=&quot;Matrice di Savage et al. 1991&quot;&gt;
        &lt;text x=&quot;200&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot;&gt;Capacity for threat →&lt;/text&gt;
        &lt;text x=&quot;14&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 160)&quot;&gt;Potential for co-operation →&lt;/text&gt;
        &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;rect id=&quot;q1&quot; x=&quot;40&quot; y=&quot;30&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;88&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 1 · Supportive&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;strategy: involve&lt;/text&gt;
          &lt;rect id=&quot;q4&quot; x=&quot;190&quot; y=&quot;30&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;88&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 4 · Mixed blessing&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;strategy: collaborate&lt;/text&gt;
          &lt;rect id=&quot;q2&quot; x=&quot;40&quot; y=&quot;170&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;228&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 2 · Marginal&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;248&quot; class=&quot;s-ink2&quot;&gt;strategy: monitor&lt;/text&gt;
          &lt;rect id=&quot;q3&quot; x=&quot;190&quot; y=&quot;170&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;228&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 3 · Non-supportive&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;248&quot; class=&quot;s-ink2&quot;&gt;strategy: defend&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;112&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;11&quot;&gt;low&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;11&quot;&gt;high&lt;/text&gt;
        &lt;circle id=&quot;sp&quot; r=&quot;9&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label class=&quot;rng&quot;&gt;Capacity for threat &lt;output id=&quot;o-t&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-t&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;rng&quot;&gt;Potential for co-operation &lt;output id=&quot;o-c&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-c&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;75&quot;&gt;&lt;/label&gt;
        &lt;div id=&quot;savtxt&quot; class=&quot;def&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;small&quot;&gt;Esempi &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;: &lt;button class=&quot;btn&quot; data-sv=&quot;20,80&quot;&gt;dipendenti motivati&lt;/button&gt; &lt;button class=&quot;btn&quot; data-sv=&quot;80,75&quot;&gt;un grande cliente&lt;/button&gt; &lt;button class=&quot;btn&quot; data-sv=&quot;85,20&quot;&gt;un’ONG ostile&lt;/button&gt; &lt;button class=&quot;btn&quot; data-sv=&quot;15,20&quot;&gt;un piccolo gruppo locale&lt;/button&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Fonte: slide 49, «adapted from Savage et al., 1991». Gli esempi sui pulsanti sono indicativi: la collocazione reale dipende dal caso.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Collegamenti con CSR e accountability (slide 51)&lt;/h3&gt;
  &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Stakeholder approach&lt;/th&gt;&lt;th&gt;CSR theories&lt;/th&gt;&lt;th&gt;Accountability&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Instrumental / strategic&lt;/td&gt;&lt;td&gt;Instrumental theories&lt;/td&gt;&lt;td&gt;Instrumental approach to accountability&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Normative&lt;/td&gt;&lt;td&gt;Ethical theories&lt;/td&gt;&lt;td&gt;Ethical and holistic approach&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Descriptive&lt;/td&gt;&lt;td&gt;Basis for the previous theories&lt;/td&gt;&lt;td&gt;Description of the network of stakeholders and their relationships&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Integrative theories&lt;/td&gt;&lt;td&gt;Integrated Reporting&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; &lt;i&gt;Accountability&lt;/i&gt; significa rendere conto: l’obbligo di spiegare e giustificare il proprio operato verso chi ne è toccato. L’&lt;i&gt;Integrated Reporting&lt;/i&gt; è un tipo di rendicontazione che unisce informazioni finanziarie e non finanziarie. È il ponte con la parte del corso di laurea su sustainability accounting (cfr. Laine et al. 2022, citato nella slide 33).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Abbina ogni forma della teoria alla sua domanda: descrittiva, strumentale, normativa, manageriale.&lt;/summary&gt;&lt;p&gt;Descrittiva: le imprese tengono davvero conto degli stakeholder? Strumentale: conviene loro farlo? Normativa: perché dovrebbero farlo? Manageriale: con quali atteggiamenti, strutture e pratiche farlo?&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa significa che gli interessi degli stakeholder hanno “intrinsic value”?&lt;/summary&gt;&lt;p&gt;Che ogni gruppo merita considerazione per se stesso, non solo perché la sua soddisfazione serve gli interessi di un altro gruppo come gli azionisti.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Stakeholder con alta capacità di minaccia e alto potenziale di cooperazione: tipo e strategia?&lt;/summary&gt;&lt;p&gt;Type 4, Mixed blessing: strategia collaborate.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Stakeholder non collaborativo ma potenzialmente pericoloso: tipo e strategia?&lt;/summary&gt;&lt;p&gt;Type 3, Non-supportive: strategia defend.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;9&lt;/span&gt;&lt;h2&gt;Un’altra prospettiva: il common good approach&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slide &lt;b&gt;52–56&lt;/b&gt; · Melé, 2009&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Per Melé l’impresa non è solo un fascio di contratti né solo un sistema di interessi da coordinare: è una &lt;em class=&quot;t&quot;&gt;community of persons&lt;/em&gt;, una comunità di persone.&lt;/p&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Impegno comune&lt;/h4&gt;Nell’impresa si trovano impegno reale e volontà di cooperare per scopi comuni, anche se ognuno ha pure motivi individuali per lavorare insieme.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Risultato collettivo&lt;/h4&gt;Le persone lavorano in cooperazione, e il risultato non è attribuibile a nessuno in particolare ma all’impresa nel suo insieme, o a un gruppo al suo interno.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Legami non solo economici&lt;/h4&gt;Tra le persone ci sono legami economici ma anche emotivi e morali.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Melé, 2009, p. 158 (slide 52)&lt;/p&gt;

  &lt;h3&gt;Come l’impresa contribuisce al common good (slide 53)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; Il &lt;i&gt;common good&lt;/i&gt; (bene comune) è l’insieme delle condizioni sociali che permettono alle persone e ai gruppi di realizzarsi. Secondo Melé (p. 164) l’impresa vi contribuisce:&lt;/p&gt;
  &lt;ol&gt;
    &lt;li&gt;creando valore economico aggiunto con &lt;b&gt;giustizia&lt;/b&gt; e distribuendolo con &lt;b&gt;equità&lt;/b&gt;;&lt;/li&gt;
    &lt;li&gt;fornendo beni e servizi utili, in modo efficiente e corretto;&lt;/li&gt;
    &lt;li&gt;offrendo lavoro, opportunità e condizioni organizzative rispettose della &lt;b&gt;dignità e dei diritti umani&lt;/b&gt;;&lt;/li&gt;
    &lt;li&gt;promuovendo relazioni tra impresa e stakeholder costitutivi, con reciprocità, collaborazione e cooperazione;&lt;/li&gt;
    &lt;li&gt;puntando alla &lt;b&gt;continuità e sostenibilità&lt;/b&gt; dell’impresa;&lt;/li&gt;
    &lt;li&gt;essendo un buon &lt;em class=&quot;t&quot;&gt;corporate citizen&lt;/em&gt; (un “cittadino d’impresa” che partecipa alla vita della comunità).&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;Tre modelli di impresa a confronto (Table 7.1, slide 54)&lt;/h3&gt;
  &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;View of the firm&lt;/th&gt;&lt;th&gt;Purpose of the firm&lt;/th&gt;&lt;th&gt;Corporate governance model&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Contractual approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A fictitious person and a set of contracts&lt;/td&gt;&lt;td&gt;Maximizing shareholder wealth&lt;/td&gt;&lt;td&gt;&lt;b&gt;Shareholder model&lt;/b&gt;: orientamento a massimizzare lo shareholder value (con tendenza a tollerare di più gli interessi degli altri stakeholder)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Stakeholder approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A system of stakeholder interests&lt;/td&gt;&lt;td&gt;Coordinating stakeholder interests&lt;/td&gt;&lt;td&gt;&lt;b&gt;Stakeholder model&lt;/b&gt;: orientamento agli interessi degli stakeholder, creando valore per loro e mantenendo la sopravvivenza dell’impresa&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Common good approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A community of persons producing goods and services&lt;/td&gt;&lt;td&gt;Achieving the multi-ends of the firm in accordance with the common good of society&lt;/td&gt;&lt;td&gt;&lt;b&gt;Mission-driven model&lt;/b&gt;: orientamento al bene dell’impresa, definito dai suoi fini multipli in accordo con il bene comune, attraverso la mission (considerando anche gli interessi legittimi degli stakeholder)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il confronto dimensione per dimensione (slide 55–56, da Melé 2009)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Dimensioni di confronto&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;m1&quot;&gt;Fiduciary duties&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m2&quot;&gt;Legality&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m3&quot;&gt;Property right&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m4&quot;&gt;Wealth creation&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m5&quot;&gt;Management performance&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m1&quot;&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Fiduciary duty&lt;/i&gt; = dovere fiduciario, l’obbligo di agire nell’interesse di qualcuno che ti ha affidato qualcosa.&lt;/p&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;I manager sono &lt;i&gt;agents&lt;/i&gt; degli azionisti, che sono i &lt;i&gt;principals&lt;/i&gt;: hanno doveri fiduciari verso di loro e ne servono il migliore interesse.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;I manager hanno doveri fiduciari non solo verso gli azionisti ma verso &lt;b&gt;tutti&lt;/b&gt; gli stakeholder.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;Il dovere fiduciario primario è verso &lt;b&gt;l’impresa stessa&lt;/b&gt;: agire per il bene dell’intera istituzione.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m2&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;In alcuni paesi le leggi sostengono l’idea della massimizzazione del profitto.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Le leggi cambiano nel tempo e da paese a paese, e tutelano anche gli interessi degli stakeholder.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;Le leggi non sono di per sé una giustificazione morale. L’impresa fa parte di una comunità più ampia.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m3&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;Il proprietario ha il diritto di decidere come usare la propria proprietà.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Diritti di proprietà e giustizia distributiva.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;L’impresa è una realtà umana: i diritti di proprietà riconoscono in modo inadeguato le persone che ci lavorano.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m4&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;La massimizzazione del profitto è una via efficace per creare ricchezza (Adam Smith, la &lt;i&gt;invisible hand&lt;/i&gt;, mano invisibile).&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;La creazione di ricchezza di lungo periodo è servita meglio considerando gli interessi di tutti gli stakeholder legittimi.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;L’orientamento alla mission include sia la ricerca di profitti equi sia il coordinamento degli interessi legittimi degli stakeholder.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m5&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;Obiettivi chiari, meno comportamenti opportunistici, più controllo.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Sistemi di misurazione multidimensionali.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;&lt;i&gt;Stewardship&lt;/i&gt; (custodia responsabile), cura e consapevolezza della funzione sociale e delle responsabilità morali dell’impresa.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;E la CSR e la corporate citizenship?&lt;/b&gt; L’Overview (slide 2) promette anche di «distinguish the various concepts of CSR» e «critically examine the notion of corporate citizenship», ma in questo PDF non ci sono slide dedicate. Inoltre la numerazione salta (mancano, ad esempio, le slide 3, 32, 34, 40–43, 50). Per questi temi la bibliografia rimanda al manuale &lt;b&gt;Crane et al., capitoli 2 e 5&lt;/b&gt;. Qui la corporate citizenship compare solo come ultimo contributo al common good.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Verso chi è il dovere fiduciario primario nei tre approcci?&lt;/summary&gt;&lt;p&gt;Shareholder approach: verso gli azionisti. Stakeholder approach: verso tutti gli stakeholder. Common good approach: verso l’impresa stessa, come istituzione.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la “view of the firm” del common good approach e quale modello di governance ne deriva?&lt;/summary&gt;&lt;p&gt;L’impresa come comunità di persone che producono beni e servizi; il modello di governance è mission-driven.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché per il common good approach la legalità non basta?&lt;/summary&gt;&lt;p&gt;Perché le leggi non sono di per sé una giustificazione morale: l’impresa fa parte di una comunità più ampia e deve guardare al bene comune.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cita almeno quattro modi in cui l’impresa contribuisce al common good secondo Melé.&lt;/summary&gt;&lt;p&gt;Valore aggiunto creato con giustizia e distribuito con equità; beni e servizi utili forniti in modo efficiente e corretto; lavoro rispettoso della dignità e dei diritti umani; relazioni di reciprocità con gli stakeholder; continuità e sostenibilità; essere un buon corporate citizen.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg);border-bottom:none&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Autori, testi e documenti citati nelle slide. Tutte le schede sono &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: dati e link trovati con la ricerca web, da verificare con le edizioni indicate nel programma.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h3&gt;Testi in bibliografia (slide 57)&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence: &lt;i&gt;Business Ethics&lt;/i&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;Il manuale del corso, intitolato &lt;i&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;. La 5ª edizione è del 2019 (ISBN 9780198810070). Le slide indicano i &lt;b&gt;capitoli 2 e 5&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: copre i temi dell’Overview senza slide dedicate (concetti di CSR, corporate citizenship) e la teoria degli stakeholder. Controlla l’edizione adottata nel programma.&lt;/p&gt;&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oup.com.au: scheda della 5ª edizione&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Freeman, R.E. (2007): &lt;i&gt;Managing for Stakeholders&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Le slide 25–29 lo citano come «notes available in Moodle». Freeman ha pubblicato con questo titolo una nota tecnica della Darden School (University of Virginia), usata nel corso di Business Ethics di Darden. Nel 2007 è uscito anche il libro &lt;i&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/i&gt; (Freeman, Harrison, Wicks, Yale University Press).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte dei quattro argomenti (rights, consequences, character, pragmatist). Fai fede alla versione su Moodle.&lt;/p&gt;&lt;a href=&quot;https://store.darden.virginia.edu/managing-for-stakeholders&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Darden Business Publishing: Managing for Stakeholders&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Melé, D. (2009): &lt;i&gt;Business Ethics in Action. Seeking Human Excellence in Organizations&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Palgrave Macmillan, Basingstoke. Le slide usano il cap. 7, «The Purpose of the Firm and Mission-Driven Management» (pp. 152–174). Melé insegna all’IESE Business School e adotta una prospettiva centrata sulla persona. Nel 2020 è uscita una nuova edizione, &lt;i&gt;Managing Human Excellence&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte del common good approach e delle tabelle di confronto (sez. 9).&lt;/p&gt;&lt;a href=&quot;https://www.iese.edu/insight/articles/profit-with-principles/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight: articolo di Melé legato al libro&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Wicks, Freeman, Werhane, Martin (2010): &lt;i&gt;Business Ethics. A Managerial Approach&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Pearson / Prentice Hall, © 2010 (ISBN 9780131427921). Le slide indicano il cap. 3, «Ethics, Stakeholders, Corporate Strategy, and Value Creation» (pp. 68–86).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base di separation fallacy, integration thesis, responsibility principle e open question argument (sez. 3–4).&lt;/p&gt;&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson: scheda del libro&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Harrison, Phillips, Freeman (2020): «On the 2019 Business Roundtable “Statement on the Purpose of a Corporation”»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Management&lt;/i&gt;, 46(7), 1223–1237. È un editoriale che ripercorre il dibattito stockholders contro stakeholders e ne trae le implicazioni per studiosi e manager.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la lettura consigliata per interpretare la slide 23.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1177/0149206319892669&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.1177/0149206319892669&lt;/a&gt; · &lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/124&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda UR Scholarship&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Laine, Tregidga, Unerman (2022): &lt;i&gt;Sustainability Accounting and Accountability&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Routledge, 3ª edizione. È un’introduzione a sustainability accounting, reporting, ESG e accountability, con capitoli su clima, biodiversità e diritti umani.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: da qui è adattato l’esercizio «Pause to reflect» (slide 33), ed è il ponte con l’accountability (slide 51).&lt;/p&gt;&lt;a href=&quot;https://routledge.com/Sustainability-Accounting-and-Accountability/Laine-Tregidga-Unerman/p/book/9781032023106&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Routledge: scheda della 3ª edizione&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--sage)&quot;&gt;&lt;h3&gt;Autori e articoli citati nelle slide&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Friedman, M. (1970): «The Social Responsibility of Business Is to Increase Its Profits»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;The New York Times Magazine&lt;/i&gt;, 13 settembre 1970. Friedman, economista di Chicago e Nobel nel 1976, sostiene che solo le persone hanno responsabilità e che il compito dei manager è generare profitto per gli azionisti nel rispetto delle regole.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il testo di riferimento dello shareholder model (slide 4–5, 12).&lt;/p&gt;&lt;a href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fermat’s Library: testo annotato&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Freeman, R.E. (1984): &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Prima edizione Pitman, Boston (copyright 1984), poi ristampata da Cambridge University Press. È considerata il punto di partenza della stakeholder theory.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: contiene la definizione di stakeholder della slide 20 (p. 46).&lt;/p&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rutgers CLEO: scheda sul libro&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Evan, W.M. e Freeman, R.E. (1993): «A Stakeholder Theory of the Modern Corporation: Kantian Capitalism»&lt;/h4&gt;&lt;p&gt;Capitolo dell’antologia &lt;i&gt;Ethical Theory and Business&lt;/i&gt; (Beauchamp e Bowie), ripubblicato in più edizioni. Propone che i manager abbiano un rapporto fiduciario con gli stakeholder, non solo con gli azionisti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte dei principi di corporate rights, effect e character (slide 24).&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/kantian-theory-of-capitalism/490F75ACB46F81400612DE50CBA8446E&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Ethics Quarterly: Bowie, «A Kantian Theory of Capitalism», che lo discute&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Freeman, R.E. e Phillips, R.A. (2002): «Stakeholder Theory: A Libertarian Defense»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Business Ethics Quarterly&lt;/i&gt;, 12(3), 331–349. Sostiene che un filone della stakeholder theory ha radici libertarie e abbozza un modello di “stakeholder capitalism”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della definizione di stakeholder theory nella slide 21 (p. 334).&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v12y2002i03p331-349_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: scheda dell’articolo&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Donaldson, T. e Preston, L.E. (1995): «The Stakeholder Theory of the Corporation: Concepts, Evidence, and Implications»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 20(1), 65–91. Distingue gli aspetti descrittivo, strumentale e normativo della teoria e indica come fondamentale la base normativa.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte delle quattro forme della teoria (slide 44–48).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1995.9503271992&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.5465/amr.1995.9503271992&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Clarkson, M.B.E. (1995): «A Stakeholder Framework for Analyzing and Evaluating Corporate Social Performance»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 20(1), 92–117. Basandosi su oltre 70 studi sul campo (1983–1993), conclude che le imprese gestiscono relazioni con gruppi di stakeholder, non con “la società” in generale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della distinzione tra stakeholder primari e secondari (slide 35).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/258888&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.2307/258888&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Rowley, T.J. (1997): «Moving Beyond Dyadic Ties: A Network Theory of Stakeholder Influences»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 22(4), 887–910. Applica la social network analysis per spiegare la risposta dell’impresa a pressioni simultanee di più stakeholder.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della slide 39 (network relations).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/259248&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.2307/259248&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Savage, Nix, Whitehead, Blair (1991): «Strategies for Assessing and Managing Organizational Stakeholders»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Executive&lt;/i&gt;, 1991. È una tipologia diagnostica che incrocia potenziale di minaccia e potenziale di cooperazione e ricava quattro tipi di stakeholder, ognuno con una strategia.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della matrice della slide 49. Il link è una risorsa didattica aperta che la spiega; per i dati bibliografici completi consulta una banca dati.&lt;/p&gt;&lt;a href=&quot;https://pressbooks.atlanticoer-relatlantique.ca/actingresponsibly/?p=64&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pressbooks (OER): Acting Responsibly, il modello di Savage et al.&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;French, P.A. (1979): «The Corporation as a Moral Person»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;American Philosophical Quarterly&lt;/i&gt;, 16, 207–215. Introduce la &lt;i&gt;Corporate Internal Decision (CID) Structure&lt;/i&gt; come base per attribuire agency morale all’impresa. L’ha poi sviluppata in &lt;i&gt;Collective and Corporate Responsibility&lt;/i&gt; (1984).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fonda l’agency identity (slide 6).&lt;/p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/ethics-business/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy: «Business Ethics», con la discussione sulla corporate moral agency&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Moore, G. (1999): «Corporate Moral Agency: Review and Implications»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Business Ethics&lt;/i&gt;, 21(4), 329–343. Rassegna degli argomenti a favore e contro la responsabilità morale delle imprese: conclude che pesano di più quelli a favore e ne discute le implicazioni per stakeholder theory e virtue ethics.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fonda l’organizational identity (slide 6).&lt;/p&gt;&lt;a href=&quot;https://www.proquest.com/docview/198123925&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ProQuest: scheda e abstract&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h3&gt;Documenti e casi citati&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Business Roundtable (2019): &lt;i&gt;Statement on the Purpose of a Corporation&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Pubblicato il 19 agosto 2019 e firmato da circa 181 CEO. Sostituisce la posizione, sostenuta dal 1997, per cui le imprese esistono principalmente per servire gli azionisti, con un impegno verso clienti, dipendenti, fornitori, comunità e azionisti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il documento della slide 23, un caso reale di passaggio dal linguaggio shareholder a quello stakeholder (con critiche sulla sua attuazione).&lt;/p&gt;&lt;a href=&quot;https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Roundtable: comunicato ufficiale&lt;/a&gt; · &lt;a href=&quot;https://purpose.businessroundtable.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito dello statement&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Il caso Volkswagen (2015)&lt;/h4&gt;&lt;p&gt;Il 18 settembre 2015 l’EPA statunitense ha notificato a Volkswagen la violazione del Clean Air Act: un software (&lt;i&gt;defeat device&lt;/i&gt;) riconosceva i test ufficiali e attivava i controlli sulle emissioni solo durante le prove. Le auto emettevano fino a 40 volte più del consentito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è uno degli scandali che, secondo la slide 14, mettono in crisi il modello dominante.&lt;/p&gt;&lt;a href=&quot;https://www.epa.gov/vw/learn-about-volkswagen-violations&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPA: Learn About Volkswagen Violations&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Il caso Enron (2001)&lt;/h4&gt;&lt;p&gt;La SEC ha raccolto le azioni contro i vertici di Enron (Lay, Skilling, Causey e altri) e contro un partner di Arthur Andersen, per la manipolazione dei bilanci. La pagina è archiviata e non più aggiornata.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il primo scandalo citato nella slide 14 ed è un esempio classico degli effetti della pressione sul valore per gli azionisti.&lt;/p&gt;&lt;a href=&quot;https://www.sec.gov/spotlight/enron.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEC: Spotlight on Enron&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;script&gt;
(function(){
  // linguette
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;);
    btns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===b?&#x27;true&#x27;:&#x27;false&#x27;)});
      t.querySelectorAll(&#x27;[role=tabpanel]&#x27;).forEach(function(p){p.hidden=p.id!==b.getAttribute(&#x27;aria-controls&#x27;)});
    })});
  });
  // passi da scorrere
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;[data-prev]&#x27;),next=s.querySelector(&#x27;[data-next]&#x27;);
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){steps.forEach(function(x,k){x.classList.toggle(&#x27;on&#x27;,k===i)});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,k){d.classList.toggle(&#x27;on&#x27;,k===i)});prev.disabled=i===0;next.disabled=i===steps.length-1}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });
  // separazione / integrazione
  var sb=document.getElementById(&#x27;sepbtn&#x27;);
  if(sb){var on=false;sb.addEventListener(&#x27;click&#x27;,function(){on=!on;sb.setAttribute(&#x27;aria-pressed&#x27;,on);
    [&#x27;cB&#x27;,&#x27;tB&#x27;].forEach(function(id){document.getElementById(id).style.transform=on?&#x27;translateX(95px)&#x27;:&#x27;none&#x27;});
    [&#x27;cE&#x27;,&#x27;tE&#x27;].forEach(function(id){document.getElementById(id).style.transform=on?&#x27;translateX(-95px)&#x27;:&#x27;none&#x27;});
    document.getElementById(&#x27;hum&#x27;).setAttribute(&#x27;opacity&#x27;,on?1:0);
    document.getElementById(&#x27;sepcap&#x27;).textContent=on?&#x27;Integration thesis: business ed etica si sovrappongono, e al centro ci sono le persone&#x27;:&#x27;Separation fallacy: due mondi che non si toccano&#x27;;
    sb.textContent=on?&#x27;Torna alla separation fallacy&#x27;:&#x27;Mostra la Integration Thesis&#x27;;});}
  // stakeholder model: schede dei nodi
  var stakes={
    sh:[&#x27;Shareholders&#x27;,&#x27;Mettono il capitale di rischio. Si aspettano rendimento, valore di lungo periodo e trasparenza. Qui sono uno stakeholder tra gli altri, non il centro.&#x27;],
    emp:[&#x27;Employees&#x27;,&#x27;Mettono tempo, competenze, salute. Si aspettano salario equo, sicurezza, formazione, dignità e stabilità.&#x27;],
    cust:[&#x27;Customers&#x27;,&#x27;Mettono il loro denaro e la loro fiducia. Si aspettano prodotti sicuri, utili, a un prezzo corretto e informazioni veritiere.&#x27;],
    sup:[&#x27;Suppliers&#x27;,&#x27;Mettono forniture, investimenti dedicati, spesso la propria sopravvivenza. Si aspettano pagamenti puntuali e rapporti corretti.&#x27;],
    gov:[&#x27;Government&#x27;,&#x27;Garantisce infrastrutture, regole, mercati. Si aspetta rispetto delle leggi e pagamento delle tasse.&#x27;],
    comp:[&#x27;Competitors&#x27;,&#x27;Condividono il mercato. Si aspettano concorrenza leale e possono cooperare su standard comuni.&#x27;],
    civ:[&#x27;Civil society&#x27;,&#x27;Comunità locali, ONG, cittadini. Subiscono le esternalità (ambiente, territorio) e si aspettano un’impresa che contribuisca alla comunità.&#x27;]
  };
  var hp=document.getElementById(&#x27;hubpanel&#x27;);
  document.querySelectorAll(&#x27;.hubn&#x27;).forEach(function(n){
    function act(){document.querySelectorAll(&#x27;.hubn&#x27;).forEach(function(m){m.classList.toggle(&#x27;on&#x27;,m===n)});var s=stakes[n.dataset.k];
      hp.innerHTML=&#x27;&lt;span class=&quot;chip&quot;&gt;stake di &#x27;+s[0]+&#x27;&lt;/span&gt;&lt;h4 style=&quot;margin-top:.6rem&quot;&gt;&#x27;+s[0]+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+s[1]+&#x27;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt; esempio esplicativo, non testo delle slide.&lt;/p&gt;&#x27;;}
    n.addEventListener(&#x27;click&#x27;,act);n.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();act()}});
  });
  // frontiera del valore
  var ra=document.getElementById(&#x27;r-a&#x27;),rr=document.getElementById(&#x27;r-r&#x27;);
  if(ra){
    var ox=50,oy=280,W=310,H=240;
    function arc(R){var d=&#x27;M&#x27;+ox+&#x27; &#x27;+(oy-R*H);for(var k=0;k&lt;=40;k++){var t=Math.PI/2*(1-k/40);d+=&#x27; L&#x27;+(ox+R*W*Math.cos(t)).toFixed(1)+&#x27; &#x27;+(oy-R*H*Math.sin(t)).toFixed(1)}return d}
    document.getElementById(&#x27;fr0&#x27;).setAttribute(&#x27;d&#x27;,arc(.62));
    function upd(){
      var R=.62+.33*rr.value/100,t=(90-ra.value)*Math.PI/180;
      var px=ox+R*W*Math.cos(t),py=oy-R*H*Math.sin(t);
      document.getElementById(&#x27;fr&#x27;).setAttribute(&#x27;d&#x27;,arc(R)+&#x27; L&#x27;+ox+&#x27; &#x27;+oy+&#x27; Z&#x27;);
      var p=document.getElementById(&#x27;frp&#x27;);p.setAttribute(&#x27;cx&#x27;,px);p.setAttribute(&#x27;cy&#x27;,py);
      var lx=document.getElementById(&#x27;frx&#x27;);lx.setAttribute(&#x27;x1&#x27;,px);lx.setAttribute(&#x27;x2&#x27;,px);lx.setAttribute(&#x27;y1&#x27;,py);lx.setAttribute(&#x27;y2&#x27;,oy);
      var ly=document.getElementById(&#x27;fry&#x27;);ly.setAttribute(&#x27;x1&#x27;,ox);ly.setAttribute(&#x27;x2&#x27;,px);ly.setAttribute(&#x27;y1&#x27;,py);ly.setAttribute(&#x27;y2&#x27;,py);
      var vs=Math.round(R*100*Math.cos(t)),ve=Math.round(R*100*Math.sin(t));
      document.getElementById(&#x27;o-a&#x27;).textContent=ra.value&lt;45?&#x27;più agli azionisti&#x27;:ra.value&gt;45?&#x27;più ai dipendenti&#x27;:&#x27;equilibrio&#x27;;
      document.getElementById(&#x27;o-r&#x27;).textContent=&#x27;+&#x27;+Math.round(rr.value*.33/.62)+&#x27;% di valore&#x27;;
      document.getElementById(&#x27;frtxt&#x27;).innerHTML=&#x27;Valore azionisti &lt;b&gt;&#x27;+vs+&#x27;&lt;/b&gt; · valore dipendenti &lt;b&gt;&#x27;+ve+&#x27;&lt;/b&gt;. &#x27;+(rr.value&gt;0?&#x27;Ripensando il problema la torta cresce: lo stesso tradeoff lascia entrambi meglio di prima.&#x27;:&#x27;Sulla curva di partenza ogni guadagno di uno è una perdita per l’altro.&#x27;);
    }
    ra.addEventListener(&#x27;input&#x27;,upd);rr.addEventListener(&#x27;input&#x27;,upd);upd();
  }
  // mini-esercizio primari/secondari
  var sg=document.getElementById(&#x27;sortgame&#x27;);
  if(sg){
    var items=[[&#x27;Dipendenti&#x27;,&#x27;p&#x27;],[&#x27;Media&#x27;,&#x27;s&#x27;],[&#x27;Azionisti e investitori&#x27;,&#x27;p&#x27;],[&#x27;Concorrenti&#x27;,&#x27;s&#x27;],[&#x27;Clienti&#x27;,&#x27;p&#x27;],[&#x27;Associazioni dei consumatori&#x27;,&#x27;s&#x27;],[&#x27;Fornitori&#x27;,&#x27;p&#x27;],[&#x27;Gruppi di interesse (ONG di settore)&#x27;,&#x27;s&#x27;],[&#x27;Comunità locali&#x27;,&#x27;p&#x27;]];
