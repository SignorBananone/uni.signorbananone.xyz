      &lt;a href=&quot;#s8&quot; class=&quot;mnode&quot; style=&quot;--nb:var(--slate-bg);--nc:var(--slate)&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;472&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;14&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;498&quot;&gt;8 · Forms of the theory&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;600&quot; y=&quot;517&quot;&gt;D&amp;amp;P 1995 · Savage 1991&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s9&quot; class=&quot;mnode&quot; style=&quot;--nb:var(--brick-bg);--nc:var(--brick)&quot;&gt;&lt;rect x=&quot;710&quot; y=&quot;472&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;14&quot;/&gt;&lt;text x=&quot;805&quot; y=&quot;498&quot;&gt;9 · Common good&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;805&quot; y=&quot;517&quot;&gt;Melé 2009&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--d:var(--sage)&quot;&gt;sage&lt;/span&gt;&lt;span style=&quot;--d:var(--ochre)&quot;&gt;ochre&lt;/span&gt;&lt;span style=&quot;--d:var(--slate)&quot;&gt;slate&lt;/span&gt;&lt;span style=&quot;--d:var(--brick)&quot;&gt;brick&lt;/span&gt;&lt;span style=&quot;--d:var(--accent)&quot;&gt;core of the lecture&lt;/span&gt; · dashed arrows indicate a comparison, not a consequence&lt;/div&gt;
  &lt;/div&gt;
  &lt;nav class=&quot;toc&quot; aria-label=&quot;Contents&quot;&gt;
    &lt;a href=&quot;#s1&quot;&gt;1 Responsibility&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 Shareholder model&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 Critiques&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;4 Towards the framework&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;5 Stakeholder model&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;6 Arguments&lt;/a&gt;&lt;a href=&quot;#s7&quot;&gt;7 Maps&lt;/a&gt;&lt;a href=&quot;#s8&quot;&gt;8 Forms&lt;/a&gt;&lt;a href=&quot;#s9&quot;&gt;9 Common good&lt;/a&gt;&lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;
  &lt;/nav&gt;
  &lt;p class=&quot;small&quot; style=&quot;margin-top:1rem&quot;&gt;Learning objectives stated in the Overview (slide 2): explain why firms have social responsibilities; ask for whose benefit they should be managed; present stakeholder theory; introduce the common good approach; distinguish the concepts of CSR; critically examine corporate citizenship. The last two points &lt;b&gt;have no dedicated slides in this file&lt;/b&gt;: see the note at the end of section 9.&lt;/p&gt;
&lt;/div&gt;
&lt;/header&gt;

&lt;main class=&quot;wrap&quot;&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Can a firm have social responsibilities?&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;4–9&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The lecture opens with a provocation: if a firm is merely an instrument for making profits, does it make sense to speak of its &lt;em class=&quot;t&quot;&gt;corporate social responsibility&lt;/em&gt; (CSR)?&lt;/p&gt;

  &lt;div class=&quot;quote&quot;&gt;“The only one responsibility of business towards society is the maximization of profits to the shareholders within the legal framework and the ethical custom of the country.”&lt;cite&gt;Milton Friedman, 1970 · quoted on slides 4 and 12&lt;/cite&gt;&lt;/div&gt;
  &lt;p&gt;Note what the sentence actually says: Friedman does not claim that anything goes. Profit is to be maximised &lt;b&gt;within&lt;/b&gt; two boundaries, the law and the &lt;em&gt;ethical custom&lt;/em&gt; of the country. What he denies is that the firm has &lt;i&gt;additional&lt;/i&gt; social duties.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Friedman debate&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;f-a&quot;&gt;Friedman’s arguments&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;f-b&quot;&gt;The response: corporate moral agency&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;f-a&quot;&gt;
      &lt;p&gt;Nobel laureate in economics Milton Friedman opposed corporate social responsibility with &lt;b&gt;three arguments&lt;/b&gt; (slide 5):&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;① Only individuals&lt;/h4&gt;Only human beings bear moral responsibility for their actions. A corporation, as such, does not.&lt;/div&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;② The managers’ mandate&lt;/h4&gt;Managers must act &lt;b&gt;solely&lt;/b&gt; in the interest of the shareholders, who appointed them. Spending on social goals means using other people’s money.&lt;/div&gt;
        &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;③ It is the State’s task&lt;/h4&gt;Social problems fall within the remit of the State, not of managers, who have neither democratic legitimacy nor the relevant expertise.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;f-b&quot; hidden&gt;
      &lt;p&gt;The debate is long and complex, but the literature generally acknowledges &lt;b&gt;some degree of moral responsibility&lt;/b&gt; for corporations (slide 6). There are three arguments, one for each type of “identity”:&lt;/p&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Legal identity&lt;/h4&gt;The firm enters into contracts, is subject to legal obligations, and can sue and be sued. It has rights and duties.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Agency identity&lt;/h4&gt;Every organisation has a &lt;i&gt;corporate internal decision structure&lt;/i&gt; that steers decisions towards predefined goals. Decisions are therefore “the corporation’s”, not merely those of individuals &lt;small&gt;(French 1979)&lt;/small&gt;.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Organizational identity&lt;/h4&gt;Every organisation expresses beliefs and values about what is right or wrong: its &lt;i&gt;organizational culture&lt;/i&gt; &lt;small&gt;(Moore 1999)&lt;/small&gt;.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Synthesis (not in the slides): these three identities mainly answer argument ①. Arguments ② and ③ are answered in later sections: the law protecting other groups (sect. 3) and the stakeholder model (sect. 5).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The two questions guiding the lecture&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What kind of responsibilities?&lt;/h4&gt;Economic, legal, ethical… What duties does a firm really have? &lt;small&gt;(slide 7)&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Towards whom?&lt;/h4&gt;Only towards shareholders, or towards everyone affected by its activities? &lt;small&gt;(slides 7 and 9: “What is the purpose of a corporation? For whose benefit should a company be managed?”)&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;In-class exercise · Ethical dilemma 2: “When good results are bad results” (slide 8)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;The slide only lists the discussion questions; the text of the Professor Ballistico case (the slide shows only a laboratory photo) is not in the slides and must be read in the course material. &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; The title and the “Ethical dilemma” numbering suggest the dilemmas in the Crane et al. textbook, chapters 2 and 5 in the reading list: this is a hypothesis to be verified.&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;What are the main ethical issues for Professor Ballistico?&lt;/li&gt;
      &lt;li&gt;What options are available? How would you assess them?&lt;/li&gt;
      &lt;li&gt;How should Professor Ballistico proceed, and what can realistically be done to avoid similar problems in the future?&lt;/li&gt;
      &lt;li&gt;Who are the &lt;b&gt;stakeholders&lt;/b&gt; affected by the decision?&lt;/li&gt;
      &lt;li&gt;Towards which stakeholders does Professor Ballistico have &lt;b&gt;primary&lt;/b&gt; responsibilities?&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;Questions 4 and 5 anticipate the concepts of sections 5 and 7: use them for revision after reading those sections.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Does Friedman argue that a firm may do anything in order to maximise profit?&lt;/summary&gt;&lt;p&gt;No. Profit is to be maximised “within the legal framework and the ethical custom of the country”. Friedman denies &lt;i&gt;additional&lt;/i&gt; social responsibilities, not compliance with the law and ethical custom.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;List Friedman’s three arguments.&lt;/summary&gt;&lt;p&gt;① Only human beings bear moral responsibility; ② managers must act solely in the interest of shareholders; ③ social problems are the State’s business, not managers’.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;On which three “identities” does the idea that a firm can be morally responsible rest?&lt;/summary&gt;&lt;p&gt;Legal identity (rights, duties, contracts, lawsuits), agency identity (goal-oriented internal decision structure, French 1979), organizational identity (values and organisational culture, Moore 1999).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--c:var(--ochre);--cbg:var(--ochre-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;2&lt;/span&gt;&lt;h2&gt;The dominant model: the shareholder model&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;10–12&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The model that dominated managerial thinking for decades (also called the &lt;em class=&quot;t&quot;&gt;managerial model&lt;/em&gt;) puts shareholders at the centre: they are the principal group and the managers’ primary objective.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h3 style=&quot;margin-top:0&quot;&gt;Key features&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;&lt;b&gt;Companies with dispersed capital&lt;/b&gt;: widely held firms, with a very large number of small shareholders.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Separation between ownership and management&lt;/b&gt;: those who own the firm (shareholders) are not those who run it (managers).&lt;/li&gt;
        &lt;li&gt;Shareholders are the most important group the manager must look after.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Target&lt;/b&gt;: increasing &lt;em class=&quot;t&quot;&gt;shareholder value&lt;/em&gt; (usually the market value of the shares).&lt;/li&gt;
        &lt;li&gt;Managerial remuneration and incentive systems are aligned with shareholders’ interests, i.e. with the share price.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the dominant model: the firm at the centre, shareholders highlighted&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;a2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#a2)&quot;&gt;
          &lt;path d=&quot;M160 132 L120 96&quot; marker-start=&quot;url(#a2)&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;path d=&quot;M240 132 L280 96&quot;/&gt;&lt;path d=&quot;M120 214 L158 180&quot;/&gt;&lt;path d=&quot;M280 214 L242 180&quot;/&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;200&quot; cy=&quot;155&quot; rx=&quot;62&quot; ry=&quot;32&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Firm&lt;/text&gt;
        &lt;ellipse cx=&quot;85&quot; cy=&quot;68&quot; rx=&quot;72&quot; ry=&quot;34&quot; class=&quot;s-c&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot;&gt;Shareholders&lt;/text&gt;
        &lt;ellipse cx=&quot;315&quot; cy=&quot;68&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Customers&lt;/text&gt;
        &lt;ellipse cx=&quot;85&quot; cy=&quot;242&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Suppliers&lt;/text&gt;
        &lt;ellipse cx=&quot;315&quot; cy=&quot;242&quot; rx=&quot;66&quot; ry=&quot;30&quot; class=&quot;s-card&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot;&gt;Employees&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Redrawn from slide 11. Only the relationship with shareholders runs in &lt;b&gt;both&lt;/b&gt; directions (capital in, profits out); suppliers and employees are inputs, customers are the outlet for output.&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3&gt;The mechanism behind the model: the agency relationship&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; The separation of ownership and control creates an &lt;em class=&quot;t&quot;&gt;agency&lt;/em&gt; relationship: the &lt;i&gt;principal&lt;/i&gt; (the shareholder) entrusts their resources to an &lt;i&gt;agent&lt;/i&gt; (the manager) who may pursue their own ends. The shareholder model responds by tying managerial incentives to the share price (e.g. through stock options), so that the manager gains when the shareholder gains.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Agency&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ag1&quot;&gt;The problem&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ag2&quot;&gt;The model’s “solution”&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ag3&quot;&gt;The risk&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag1&quot;&gt;&lt;p&gt;The manager knows the firm better than the dispersed shareholder, who cannot monitor them closely. The manager can therefore make decisions to their own advantage (private benefits, growth for its own sake).&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag2&quot; hidden&gt;&lt;p&gt;A single, measurable objective (shareholder value) and pay linked to the share price. The motto is &lt;b&gt;“the business of business is business”&lt;/b&gt; (slide 12): a firm should concern itself with business and nothing else.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ag3&quot; hidden&gt;&lt;p&gt;If everything is measured by share value, the interests of other groups (employees, communities, the environment) become costs to be squeezed, and short-termism prevails. This is precisely what the critiques in section 3 and the economic perspective in section 4 (the agency problem between short and long term) call into question.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does the shareholder model arise in firms with dispersed capital?&lt;/summary&gt;&lt;p&gt;Because there ownership and control are separated: numerous, dispersed shareholders delegate to managers. The model serves to direct managers towards the owners’ interests.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the managers’ target in this model, and how are they incentivised?&lt;/summary&gt;&lt;p&gt;Increasing shareholder value (market value); incentives and pay are linked to the share price.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the diagram on slide 11, what distinguishes the relationship with shareholders from the others?&lt;/summary&gt;&lt;p&gt;It is the only one shown as two-way and it is highlighted: shareholders are the central group, while the others appear only as inputs or as an outlet.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Why the dominant model falls short&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;13–17&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The slides raise three critiques of the shareholder model: it fails to capture the complexity of the 21st century, it is not fully consistent with the law, and it is not consistent with basic ethics.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Three critiques&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;c1&quot;&gt;① Complexity&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c2&quot;&gt;② Law&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c3&quot;&gt;③ Ethics&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;
      &lt;p&gt;Business today is &lt;b&gt;global, complex, multi-faceted, interconnected, not fully predictable&lt;/b&gt;. A model with a single group at its centre cannot capture these dynamics.&lt;/p&gt;
      &lt;p&gt;Example from slide 13: garment workers in Bangladesh block a road in Dhaka (20 May 2020), during the lockdown, to demand unpaid wages. The decisions of global brands fall on distant people along the supply chain.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;
      &lt;p&gt;Over time the law has given &lt;i&gt;de facto standing&lt;/i&gt; to the claims of groups other than shareholders: it has required firms to take account of &lt;b&gt;customers, suppliers, local communities and employees&lt;/b&gt;. Think of regulations on occupational health and safety and protective equipment, or on environmental risks (the images on slide 14).&lt;/p&gt;
      &lt;p&gt;The &lt;b&gt;Enron, WorldCom, Tyco… Volkswagen&lt;/b&gt; scandals have further called the model into question: pressure on shareholder value can drive accounting fraud or, in the Volkswagen case, the manipulation of emissions tests.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;
      &lt;p&gt;The model rests on the &lt;em class=&quot;t&quot;&gt;separation fallacy&lt;/em&gt;:&lt;/p&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.08rem&quot;&gt;It is useful to believe that sentences like “x is a business decision” have no ethical content or any implicit ethical point of view. And, it is useful to believe that sentences like “x is an ethical decision, the best thing to do all things considered” have no content or implicit view about value creation and trade (business).&lt;cite&gt;The Separation Fallacy · slide 15&lt;/cite&gt;&lt;/div&gt;
      &lt;p&gt;Put simply: one pretends that business decisions are ethically neutral and that ethics has nothing to do with value creation. According to the slide, this fallacy underpins much of the dominant narrative about business, and more besides.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;From separation to integration&lt;/h3&gt;
  &lt;p&gt;If business and ethics were truly separate, it would make no sense to speak of moral responsibility for business decisions, and the joke that “business ethics” is an oxymoron would seem true. Instead, the &lt;em class=&quot;t&quot;&gt;responsibility principle&lt;/em&gt; holds (slide 16):&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Responsibility principle.&lt;/b&gt; “Most people, most of the time, want to and do accept responsibility for the effects of their actions on others.”&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg id=&quot;sepsvg&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Business and ethics: separate or integrated&quot;&gt;
      &lt;circle id=&quot;cB&quot; cx=&quot;170&quot; cy=&quot;115&quot; r=&quot;88&quot; fill=&quot;var(--ochre)&quot; fill-opacity=&quot;.22&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; style=&quot;transition:transform .8s&quot;/&gt;
      &lt;circle id=&quot;cE&quot; cx=&quot;470&quot; cy=&quot;115&quot; r=&quot;88&quot; fill=&quot;var(--slate)&quot; fill-opacity=&quot;.22&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; style=&quot;transition:transform .8s&quot;/&gt;
      &lt;text id=&quot;tB&quot; x=&quot;130&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; style=&quot;transition:transform .8s&quot;&gt;Business&lt;/text&gt;
      &lt;text id=&quot;tE&quot; x=&quot;510&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; style=&quot;transition:transform .8s&quot;&gt;Ethics&lt;/text&gt;
      &lt;g id=&quot;hum&quot; opacity=&quot;0&quot; style=&quot;transition:opacity .8s&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;115&quot; r=&quot;30&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;human&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;beings&lt;/text&gt;&lt;/g&gt;
      &lt;text id=&quot;sepcap&quot; x=&quot;320&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;13&quot;&gt;Separation fallacy: two worlds that never meet&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div style=&quot;text-align:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;sepbtn&quot; aria-pressed=&quot;false&quot;&gt;Show the Integration Thesis&lt;/button&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Integration Thesis I&lt;/h4&gt;Most business decisions (or sentences about business) have some ethical content, or an implicit ethical view. Most ethical decisions have some business content, or an implicit view about business.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Integration Thesis II&lt;/h4&gt;It makes no sense to talk about business without talking about ethics; nor about ethics without talking about business; nor about either without talking about &lt;b&gt;human beings&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What are the three critiques of the shareholder model?&lt;/summary&gt;&lt;p&gt;① It fails to capture the complexity (global, interconnected, unpredictable) of 21st-century business; ② it is not fully consistent with the law, which also protects customers, suppliers, communities and employees; ③ it is not consistent with basic ethics, because it rests on the separation fallacy.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does the separation fallacy claim?&lt;/summary&gt;&lt;p&gt;That business decisions have no ethical content and that ethical decisions have no business or value-creation content.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the “third element” that Integration Thesis II adds to business and ethics?&lt;/summary&gt;&lt;p&gt;Human beings: it makes no sense to talk about business and ethics without talking about people.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Towards the stakeholder framework&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;18, 19, 30, 31&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Slide 18 closes the reasoning with an “if… then”: if we accept four premises, we need a new model of business.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Four premises lead to the stakeholder framework&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;a4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--c)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;38&quot; class=&quot;s-ink&quot;&gt;① we give up the &lt;tspan font-weight=&quot;700&quot;&gt;separation fallacy&lt;/tspan&gt;&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;66&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;94&quot; class=&quot;s-ink&quot;&gt;② we adopt the &lt;tspan font-weight=&quot;700&quot;&gt;integration thesis&lt;/tspan&gt;&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;122&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;150&quot; class=&quot;s-ink&quot;&gt;③ the &lt;tspan font-weight=&quot;700&quot;&gt;open question argument&lt;/tspan&gt; makes sense&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;178&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;206&quot; class=&quot;s-ink&quot;&gt;④ we need a &lt;tspan font-weight=&quot;700&quot;&gt;responsibility thesis&lt;/tspan&gt;&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--c)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M310 33 C 400 33 400 117 460 117&quot;/&gt;&lt;path d=&quot;M310 89 C 380 89 400 117 460 117&quot;/&gt;&lt;path d=&quot;M310 145 C 380 145 400 117 460 117&quot;/&gt;&lt;path d=&quot;M310 201 C 400 201 400 117 460 117&quot; marker-end=&quot;url(#a4)&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;468&quot; y=&quot;77&quot; width=&quot;280&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;s-c&quot;/&gt;
      &lt;text x=&quot;608&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; style=&quot;font-family:var(--serif)&quot; font-size=&quot;21&quot; font-weight=&quot;600&quot;&gt;Stakeholder&lt;/text&gt;
      &lt;text x=&quot;608&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; style=&quot;font-family:var(--serif)&quot; font-size=&quot;21&quot; font-weight=&quot;600&quot;&gt;framework&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Redrawn from slide 18: taken together, the four conditions lead to a new model for business.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Why stakeholders matter: the summary (slide 19)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Milton Friedman&lt;/h4&gt;Corporations should be managed &lt;b&gt;solely&lt;/b&gt; in the interest of their owners.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;R. Edward Freeman&lt;/h4&gt;Others also have a &lt;b&gt;legitimate claim&lt;/b&gt; on the corporation, for three reasons ↓&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Legal perspective&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;stake&lt;/em&gt; (what a group has at stake in the firm, its interest in it) is already protected by law in various ways: for example, through binding contracts with employees, suppliers and customers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Economic perspective&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Externalities&lt;/b&gt;: effects of business activity on parties &lt;i&gt;outside&lt;/i&gt; the contractual relationships. &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; One example is pollution from a factory, which harms those living nearby without any contract compensating them. The market alone does not “see” these costs.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Agency problem&lt;/b&gt;: the short-term interests of the “owners” versus the long-term interests of managers, employees, customers, etc. &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; A shareholder can sell their shares tomorrow; an employee or a community remains tied to the firm for years.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Ethical perspective&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rejection of the separation thesis (sect. 3) and the human being at the centre of business decisions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The open question argument (slide 30)&lt;/h3&gt;
  &lt;p&gt;This is a list of questions to ask &lt;b&gt;before&lt;/b&gt; every decision, so as not to fall into the separation fallacy. Try working through them on a case &lt;span class=&quot;int&quot;&gt;teaching example&lt;/span&gt;: &lt;i&gt;a company is considering closing an Italian plant and offshoring production to a lower-cost country.&lt;/i&gt;&lt;/p&gt;
  &lt;div class=&quot;panel stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Question 1&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;If this decision is made, for whom is value created and destroyed?&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Value created:&lt;/i&gt; shareholders (higher margins), perhaps customers (lower prices), workers in the new country. &lt;i&gt;Value destroyed:&lt;/i&gt; laid-off employees, local suppliers, the municipality losing tax revenue.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Question 2&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;Who is harmed and/or benefited by this decision?&lt;/h4&gt;&lt;p&gt;Here you look at &lt;b&gt;actual people&lt;/b&gt;: families, the local supply network, the area, and not only at line items in the financial statements.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Question 3&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;Whose rights are enabled and whose values are realized by this decision (and whose are not)?&lt;/h4&gt;&lt;p&gt;Do working conditions in the new plant respect workers’ rights? Are the commitments made to the local area being kept?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Question 4&lt;/span&gt;&lt;h4 style=&quot;margin-top:.5rem&quot;&gt;What kind of person will I (we) become if we make this decision?&lt;/h4&gt;&lt;p&gt;What kind of person (or firm) will I, or we, become by making this decision? This is the question of &lt;b&gt;character&lt;/b&gt;, which recurs in the principle of corporate character and the argument from character (sect. 5 and 6).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; The four questions mirror the four arguments in section 6: value (consequences), harms and benefits (consequences), rights (rights), character (character).&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Remember!&lt;/b&gt; Stakeholders with &lt;b&gt;names and faces&lt;/b&gt; (slide 31): stakeholders are not abstract categories but people, with names, faces and families.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to slide 18, what are the four premises that make a new model necessary?&lt;/summary&gt;&lt;p&gt;Giving up the separation fallacy, adopting the integration thesis, accepting the open question argument, recognising the need for a responsibility thesis.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Use an example to explain what externalities are and why they matter for stakeholders.&lt;/summary&gt;&lt;p&gt;They are effects of business activity on parties outside the contracts (e.g. pollution affecting residents). Those who bear them have a legitimate interest even without a contract with the firm.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the fourth question of the open question argument?&lt;/summary&gt;&lt;p&gt;“What kind of person will I (we) become if we make this decision?”: the question of character.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--c:var(--accent);--cbg:var(--accent-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;5&lt;/span&gt;&lt;h2&gt;The stakeholder model&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;20–24&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder.&lt;/b&gt; “Any group or individual that can affect or is affected by the achievement of an organisation’s objectives.” &lt;small&gt;(Freeman, 1984: 46)&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;Note the two directions: &lt;b&gt;can affect&lt;/b&gt; (those with power over the firm) and &lt;b&gt;is affected&lt;/b&gt; (those who bear its effects). Either one is sufficient to be a stakeholder.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 420 330&quot; role=&quot;img&quot; aria-label=&quot;The stakeholder model: click the stakeholders&quot;&gt;

        &lt;g class=&quot;hubn&quot; data-k=&quot;civ&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse cx=&quot;210&quot; cy=&quot;285&quot; rx=&quot;60&quot; ry=&quot;24&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;290&quot;&gt;Civil society&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;hubn&quot; data-k=&quot;sup&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse cx=&quot;75&quot; cy=&quot;245&quot; rx=&quot;58&quot; ry=&quot;24&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;250&quot;&gt;Suppliers&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;hubn&quot; data-k=&quot;sh&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse cx=&quot;62&quot; cy=&quot;145&quot; rx=&quot;58&quot; ry=&quot;24&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;150&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;

    &lt;div class=&quot;panel&quot; id=&quot;hubpanel&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Different stakeholders, different “stakes”&lt;/span&gt;&lt;h4 style=&quot;margin-top:.6rem&quot;&gt;Click a stakeholder&lt;/h4&gt;&lt;p&gt;You will see what it “puts at stake” in the firm and what it expects. &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; The descriptions are illustrative examples; the slides only list the groups.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Business as a set of relationships&lt;/h3&gt;
  &lt;p&gt;Business can be understood as &lt;b&gt;a set of relationships&lt;/b&gt; among groups that have a stake in the activities that make it up (slide 21).&lt;/p&gt;
  &lt;div class=&quot;quote&quot;&gt;A ‘stakeholder theory’ is one that puts as a primary managerial task the charge to influence, or manage, or balance the set of relationships that can affect the achievement of an organization’s purpose.&lt;cite&gt;Freeman and Phillips, 2002, p. 334&lt;/cite&gt;&lt;/div&gt;

  &lt;h3&gt;New roles to management (slide 22)&lt;/h3&gt;
  &lt;p&gt;The manager’s primary responsibility becomes &lt;b&gt;creating as much value as possible for stakeholders&lt;/b&gt;. When interests conflict, the manager must &lt;b&gt;rethink the problem&lt;/b&gt; so that those interests can go together and even more value is created for each. If &lt;em class=&quot;t&quot;&gt;tradeoffs&lt;/em&gt; are needed (compromises in which one party gains and another loses), the manager must be able to make them and immediately start &lt;b&gt;improving&lt;/b&gt; them for all sides.&lt;/p&gt;

  &lt;figure class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;frontier&quot; viewBox=&quot;0 0 400 320&quot; role=&quot;img&quot; aria-label=&quot;Chart of the value frontier between shareholders and employees&quot;&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;380&quot; y2=&quot;280&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;50&quot; y2=&quot;20&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;304&quot; text-anchor=&quot;end&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot;&gt;value for shareholders →&lt;/text&gt;
        &lt;text x=&quot;16&quot; y=&quot;150&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 16 150)&quot; text-anchor=&quot;middle&quot;&gt;value for employees →&lt;/text&gt;
        &lt;path id=&quot;fr0&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 5&quot;/&gt;
        &lt;path id=&quot;fr&quot; fill=&quot;var(--c)&quot; fill-opacity=&quot;.1&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;2.5&quot;/&gt;
        &lt;line id=&quot;frx&quot; stroke=&quot;var(--c)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;line id=&quot;fry&quot; stroke=&quot;var(--c)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;
        &lt;circle id=&quot;frp&quot; r=&quot;8&quot; fill=&quot;var(--c)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label class=&quot;rng&quot;&gt;Tradeoff: who gets the value &lt;output id=&quot;o-a&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-a&quot; min=&quot;5&quot; max=&quot;85&quot; value=&quot;45&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;rng&quot;&gt;Rethinking the problem (innovation, cooperation) &lt;output id=&quot;o-r&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-r&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
        &lt;p id=&quot;frtxt&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;&lt;span class=&quot;int&quot;&gt;teaching illustration&lt;/span&gt; The chart is not in the slides: it is a visual rendering of slide 22. Moving the first slider along the curve makes a tradeoff (one gains, the other loses). The second slider shifts the whole curve outwards: this is Freeman’s “rethink the problem”, which increases value for everyone. The dashed line is the starting frontier.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Three principles: what “affects” and “affected by” mean (slide 24)&lt;/h3&gt;
  &lt;p&gt;For Freeman, managers are no longer mere &lt;i&gt;agents&lt;/i&gt; of shareholders: they must consider the rights and interests of &lt;b&gt;all&lt;/b&gt; legitimate stakeholders. Evan and Freeman (1993) clarify the terms with three principles:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate rights&lt;/h4&gt;The corporation has an obligation not to violate the rights of others.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate effect&lt;/h4&gt;Corporations are responsible for the effects of their actions on others.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Principle of corporate character&lt;/h4&gt;What kind of corporation do I want to create and build?&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A real case: Business Roundtable 2019 (slide 23)&lt;/h3&gt;
  &lt;p&gt;The slide reproduces the &lt;b&gt;Statement on the Purpose of a Corporation&lt;/b&gt; issued by the Business Roundtable (an association of chief executive officers of major US companies) on &lt;b&gt;19 August 2019&lt;/b&gt; and signed by numerous CEOs. The text declares a &lt;i&gt;fundamental commitment to all of our stakeholders&lt;/i&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid4&quot; style=&quot;grid-template-columns:repeat(5,1fr)&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Customers&lt;/h4&gt;&lt;small&gt;delivering value, meeting or exceeding expectations&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Employees&lt;/h4&gt;&lt;small&gt;fair compensation, training, diversity, dignity&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Suppliers&lt;/h4&gt;&lt;small&gt;fair and ethical dealings with large and small partners&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Communities&lt;/h4&gt;&lt;small&gt;respect, the environment, sustainable practices&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shareholders&lt;/h4&gt;&lt;small&gt;long-term value, transparency&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;“Each of our stakeholders is essential.” &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The statement marked a departure from the shareholder primacy the Business Roundtable had endorsed since 1997 (&lt;a href=&quot;https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Roundtable&lt;/a&gt;). The reading list includes a commentary by Harrison, Phillips and Freeman (2020): see “Further reading”.&lt;/p&gt;
  &lt;style&gt;@media (max-width:760px){#s5 .grid4{grid-template-columns:1fr 1fr!important}}&lt;/style&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;State Freeman’s (1984) definition of a stakeholder.&lt;/summary&gt;&lt;p&gt;“Any group or individual that can affect or is affected by the achievement of an organisation’s objectives.”&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What must the manager do when stakeholder interests conflict?&lt;/summary&gt;&lt;p&gt;Rethink the problem so that the interests go together and more value is created for each; if tradeoffs are needed, make them and immediately start improving them for all sides.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are Evan and Freeman’s (1993) three principles?&lt;/summary&gt;&lt;p&gt;Principle of corporate rights (do not violate the rights of others), principle of corporate effect (responsibility for the effects of one’s actions), principle of corporate character (what kind of corporation I want to build).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Compare the diagram on slide 11 with the one on slide 20: what changes?&lt;/summary&gt;&lt;p&gt;Slide 20 shows more groups (government, competitors, civil society), the arrows run in both directions, and shareholders are no longer highlighted: they are one stakeholder among others.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Four arguments for managing for stakeholders&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;25–29&lt;/b&gt; · all from Freeman, 2007&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Why should a firm be managed “for stakeholders”? Freeman offers four arguments, each linked to a major family of ethical theories.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Four arguments&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;g1&quot;&gt;Rights&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g2&quot;&gt;Consequences&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g3&quot;&gt;Character&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;g4&quot;&gt;Pragmatist&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g1&quot;&gt;
      &lt;h4&gt;Argument from Rights&lt;/h4&gt;
      &lt;p&gt;Managing for stakeholders presupposes that stakeholders &lt;b&gt;have rights&lt;/b&gt;. Shareholders cannot use their property to restrict the rights of others: shareholders and managers (their &lt;i&gt;agents&lt;/i&gt;) cannot, for example, use corporate assets to violate others’ right to life.&lt;/p&gt;
      &lt;p&gt;Stakeholders are human beings, “with names, faces and families”, and deserve attention and protection.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;The slide refers to the part of the course on &lt;b&gt;normative ethical theories&lt;/b&gt; and on business and human rights.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g2&quot; hidden&gt;
      &lt;h4&gt;Argument from Consequences&lt;/h4&gt;
      &lt;p&gt;Managing for stakeholders can produce &lt;b&gt;better consequences for all&lt;/b&gt;, because it recognises that their interests are &lt;i&gt;joint&lt;/i&gt;. If one stakeholder systematically pursues its own interests at the expense of the others, the others withdraw their support, or:&lt;/p&gt;
      &lt;figure style=&quot;margin:.6rem 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 640 190&quot; role=&quot;img&quot; aria-label=&quot;Three reactions of disadvantaged stakeholders&quot;&gt;
          &lt;defs&gt;&lt;marker id=&quot;a6&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--c)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
          &lt;rect x=&quot;10&quot; y=&quot;62&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
          &lt;text x=&quot;95&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;one stakeholder&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-size=&quot;12&quot;&gt;takes everything&lt;/text&gt;
          &lt;g stroke=&quot;var(--c)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#a6)&quot;&gt;&lt;path d=&quot;M180 80 C 240 40 260 34 320 34&quot;/&gt;&lt;path d=&quot;M180 94 L320 94&quot;/&gt;&lt;path d=&quot;M180 108 C 240 150 260 154 320 154&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;12.5&quot;&gt;&lt;rect x=&quot;324&quot; y=&quot;12&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;32&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(1) exit&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;48&quot; class=&quot;s-ink2&quot;&gt;they exit and form a new stakeholder network&lt;/text&gt;
          &lt;rect x=&quot;324&quot; y=&quot;72&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;92&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(2) political process&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;they use politics to constrain the abuser&lt;/text&gt;
          &lt;rect x=&quot;324&quot; y=&quot;132&quot; width=&quot;306&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;s-cbg&quot;/&gt;&lt;text x=&quot;336&quot; y=&quot;152&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;(3) invent&lt;/text&gt;&lt;text x=&quot;336&quot; y=&quot;168&quot; class=&quot;s-ink2&quot;&gt;they invent another business to meet their needs&lt;/text&gt;&lt;/g&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.05rem&quot;&gt;If we think about stakeholders engaged in a series of bargains among themselves, then we would expect that as individual stakeholders recognized their joint interests, and made good decisions based on these interests, better consequences would result, than if they each narrowly pursued their individual self interests.&lt;cite&gt;Freeman, 2007 · slide 27&lt;/cite&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g3&quot; hidden&gt;
      &lt;h4&gt;The Argument from Character&lt;/h4&gt;
      &lt;p&gt;For Freeman this is one of the strongest arguments: it asks managers and entrepreneurs &lt;b&gt;what kind of company they want to create and build&lt;/b&gt;. The answer is largely a matter of character: &lt;i&gt;aspiration matters&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;The &lt;b&gt;business virtues&lt;/b&gt; of efficiency, fairness, respect, integrity and keeping commitments are critical to creating value for stakeholders. Yet these virtues are &lt;b&gt;entirely absent&lt;/b&gt; if one thinks only in terms of the dominant model and its narrow economic logic.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;g4&quot; hidden&gt;
      &lt;h4&gt;The Pragmatist’s Argument&lt;/h4&gt;
      &lt;p&gt;The three previous arguments give important reasons for adopting a new narrative about business. The pragmatist wants to know &lt;b&gt;how we can live better&lt;/b&gt;: how to create ourselves and our communities so that values such as freedom and solidarity are present in our everyday lives to the greatest possible extent.&lt;/p&gt;
      &lt;p&gt;It is sometimes useful to reason separately about consequences, rights and character, but in reality life is richer if we can &lt;b&gt;converse about how to live together better&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tscroll&quot; style=&quot;margin-top:1.2rem&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Argument&lt;/th&gt;&lt;th&gt;Key question&lt;/th&gt;&lt;th&gt;Ethical family &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rights&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Which rights do I respect or violate?&lt;/td&gt;&lt;td&gt;Rights- and duty-based ethics (deontological)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consequences&lt;/b&gt;&lt;/td&gt;&lt;td&gt;What effects do I produce for everyone?&lt;/td&gt;&lt;td&gt;Consequentialist ethics (e.g. utilitarianism)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Character&lt;/b&gt;&lt;/td&gt;&lt;td&gt;What kind of firm do I want to become?&lt;/td&gt;&lt;td&gt;Virtue ethics&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Pragmatist&lt;/b&gt;&lt;/td&gt;&lt;td&gt;How do we live better together?&lt;/td&gt;&lt;td&gt;Pragmatism: holds the three perspectives together&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In the argument from consequences, what three reactions do disadvantaged stakeholders have?&lt;/summary&gt;&lt;p&gt;(1) Exit and form a new stakeholder network; (2) use the political process to constrain the abusing stakeholder; (3) invent another business to meet their needs. In addition, they can withdraw their support.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why, according to Freeman, are the business virtues “missing” from the dominant model?&lt;/summary&gt;&lt;p&gt;Because the dominant model relies solely on a narrow economic logic, in which virtues such as fairness, respect and integrity have no place.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does the pragmatist argument add to the other three?&lt;/summary&gt;&lt;p&gt;Instead of considering consequences, rights and character separately, it holds them together in a conversation about how to live better together, with freedom and solidarity in everyday life.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--c:var(--ochre);--cbg:var(--ochre-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Mapping stakeholders&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;33, 35–39&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Pause to reflect… (slide 33, adapted from Laine et al., 2022)&lt;/summary&gt;&lt;div&gt;
    &lt;ol&gt;
      &lt;li&gt;Choose an organisation you know and list as many stakeholders as you can: the most obvious first, then the less obvious ones.&lt;/li&gt;
      &lt;li&gt;For some of them, identify their &lt;i&gt;claims&lt;/i&gt; on the organisation.&lt;/li&gt;
      &lt;li&gt;Are the interests aligned or in conflict? Are there competing claims?&lt;/li&gt;
      &lt;li&gt;What purpose could align the interests of most stakeholders?&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;small&quot;&gt;Do this on paper: the page neither collects nor sends anything.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Primary and secondary stakeholders (slide 35)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Concentric circles: the firm, primary stakeholders, secondary stakeholders&quot;&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;170&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;108&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;40&quot; fill=&quot;var(--c)&quot;/&gt;
        &lt;text x=&quot;180&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;THE FIRM&lt;/text&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;s-ink&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;140&quot; y=&quot;110&quot;&gt;Communities&lt;/text&gt;&lt;text x=&quot;225&quot; y=&quot;110&quot;&gt;Customers&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;186&quot;&gt;Employees&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;260&quot;&gt;Suppliers&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;230&quot;&gt;Financiers&lt;/text&gt;
        &lt;/g&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;s-ink2&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;180&quot; y=&quot;34&quot;&gt;Government&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;130&quot;&gt;Competitors&lt;/text&gt;&lt;text x=&quot;296&quot; y=&quot;296&quot;&gt;Consumer&lt;/text&gt;&lt;text x=&quot;296&quot; y=&quot;309&quot;&gt;advocate groups&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;296&quot;&gt;Special interest&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;309&quot;&gt;groups&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;130&quot;&gt;Media&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;180&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--c)&quot; font-weight=&quot;700&quot;&gt;PRIMARY&lt;/text&gt;
        &lt;text x=&quot;180&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--c)&quot; font-weight=&quot;700&quot;&gt;SECONDARY&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Redrawn from the figure on slide 35.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Primary stakeholder group&lt;/b&gt;: one on which the firm &lt;b&gt;depends for its survival&lt;/b&gt; &lt;small&gt;(Clarkson 1995)&lt;/small&gt;. There are five groups: investors and shareholders, employees, customers, suppliers, and a &lt;i&gt;public group&lt;/i&gt; of governments and communities, which provide infrastructure and markets and impose laws to be obeyed and taxes to be paid.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; &lt;b&gt;Secondary stakeholders&lt;/b&gt; affect or are affected by the firm, but the firm does not depend on them for its survival (media, competitors, special interest groups, consumer associations).&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Beware of an inconsistency:&lt;/b&gt; Clarkson’s text places governments and communities among the primary stakeholders, whereas the figure on the slide puts &lt;i&gt;Government&lt;/i&gt; in the outer ring. In the exam, it is advisable to cite the definition and point out that the classification depends on the context.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel&quot; id=&quot;sortgame&quot;&gt;
    &lt;h4&gt;Mini-exercise: primary or secondary?&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Classify according to Clarkson’s definition as given on slide 35.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;How different organisations do it (slides 36–38)&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Novo Nordisk&lt;/h4&gt;A web of circles: at the centre, &lt;b&gt;people with diabetes&lt;/b&gt;, then shareholders, employees, customers, healthcare providers; on the outside, regulatory authorities, media, NGOs, policy makers, local communities, educational institutions…&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Westchester Probation Service&lt;/h4&gt;Three rings: &lt;b&gt;internal&lt;/b&gt; (staff, trade union, probation board), &lt;b&gt;directly affected&lt;/b&gt; (offenders, victims, courts, police, prisons…), &lt;b&gt;indirectly affected&lt;/b&gt; (suppliers, other probation services, voluntary organisations…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Scientific community&lt;/h4&gt;At the centre, &lt;b&gt;scientists&lt;/b&gt;, linked to academia, private industry, non-profits, government and community, each with its own sub-groups (students, citizen-scientists, policymakers, librarians…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;comindwork.com&lt;/h4&gt;At the centre, &lt;b&gt;management&lt;/b&gt;, then primary stakeholders (strategic partners, shareholders, staff, strategic clients) and secondary ones (banks, media, government, associations…).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;PrincetonGreen community&lt;/h4&gt;At the centre, &lt;b&gt;clients&lt;/b&gt;, then primary stakeholders (leadership, partners, interns) and secondary constituents (inventors, family members, legislators, media…).&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What they teach us&lt;/h4&gt;There is no single map: &lt;b&gt;who sits at the centre&lt;/b&gt; and how stakeholders are grouped reveals the purpose the organisation sets for itself.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The network relations (Rowley, 1997)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;Dyadic ties or stakeholder network&quot;&gt;
        &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.4&quot;&gt;
          &lt;line x1=&quot;200&quot; y1=&quot;160&quot; x2=&quot;120&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;160&quot; x2=&quot;290&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;160&quot; x2=&quot;320&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;160&quot; x2=&quot;200&quot; y2=&quot;260&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;160&quot; x2=&quot;90&quot; y2=&quot;220&quot;/&gt;
        &lt;/g&gt;
        &lt;g id=&quot;netlinks&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;2&quot; opacity=&quot;0&quot; style=&quot;transition:opacity .6s&quot;&gt;
          &lt;line x1=&quot;120&quot; y1=&quot;90&quot; x2=&quot;290&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;290&quot; y1=&quot;90&quot; x2=&quot;320&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;90&quot; x2=&quot;40&quot; y2=&quot;80&quot;/&gt;&lt;line x1=&quot;290&quot; y1=&quot;90&quot; x2=&quot;360&quot; y2=&quot;40&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;190&quot; x2=&quot;370&quot; y2=&quot;250&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;90&quot; x2=&quot;150&quot; y2=&quot;25&quot;/&gt;
        &lt;/g&gt;
        &lt;g id=&quot;netext&quot; opacity=&quot;0&quot; style=&quot;transition:opacity .6s&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;circle cx=&quot;40&quot; cy=&quot;80&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;84&quot; class=&quot;s-ink&quot;&gt;Empl. C&lt;/text&gt;
          &lt;circle cx=&quot;150&quot; cy=&quot;25&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;29&quot; class=&quot;s-ink&quot;&gt;Supp. C&lt;/text&gt;
          &lt;circle cx=&quot;360&quot; cy=&quot;40&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;44&quot; class=&quot;s-ink&quot;&gt;Cust. A&lt;/text&gt;
          &lt;circle cx=&quot;370&quot; cy=&quot;250&quot; r=&quot;20&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;254&quot; class=&quot;s-ink&quot;&gt;Cust. B&lt;/text&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;200&quot; cy=&quot;160&quot; rx=&quot;42&quot; ry=&quot;24&quot; class=&quot;s-c&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot;&gt;Firm&lt;/text&gt;
        &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;ellipse cx=&quot;120&quot; cy=&quot;90&quot; rx=&quot;44&quot; ry=&quot;20&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;94&quot; class=&quot;s-ink&quot;&gt;Stakeh. C&lt;/text&gt;
          &lt;ellipse cx=&quot;290&quot; cy=&quot;90&quot; rx=&quot;44&quot; ry=&quot;20&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;94&quot; class=&quot;s-ink&quot;&gt;Stakeh. A&lt;/text&gt;
          &lt;ellipse cx=&quot;320&quot; cy=&quot;190&quot; rx=&quot;44&quot; ry=&quot;20&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;194&quot; class=&quot;s-ink&quot;&gt;Stakeh. B&lt;/text&gt;
          &lt;ellipse cx=&quot;200&quot; cy=&quot;260&quot; rx=&quot;36&quot; ry=&quot;18&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;
          &lt;ellipse cx=&quot;90&quot; cy=&quot;220&quot; rx=&quot;36&quot; ry=&quot;18&quot; class=&quot;s-card&quot; stroke=&quot;var(--ink2)&quot;/&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;div style=&quot;text-align:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;netbtn&quot; aria-pressed=&quot;false&quot;&gt;Show the network&lt;/button&gt;&lt;/div&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;The “hub-and-spoke” diagram shows only &lt;b&gt;dyadic&lt;/b&gt; ties (between two parties: firm–stakeholder). But stakeholders are &lt;b&gt;also linked to one another&lt;/b&gt;: stakeholder A has its own customers and employees, stakeholder C its own suppliers, and so on (slide 39).&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Rowley uses social network analysis to explain how the firm responds to the simultaneous pressure of multiple interconnected stakeholders, moving beyond the analysis of individual pairs (&lt;a href=&quot;https://doi.org/10.2307/259248&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Academy of Management Review, 1997&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is Clarkson’s criterion for a stakeholder to be primary?&lt;/summary&gt;&lt;p&gt;The firm depends on it for its survival.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are Clarkson’s five primary groups?&lt;/summary&gt;&lt;p&gt;Investors and shareholders, employees, customers, suppliers, and the public group of governments and communities.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does Rowley’s network perspective add to the classic diagram?&lt;/summary&gt;&lt;p&gt;Stakeholders are linked not only to the firm but also to one another; the firm is embedded in a network of relationships and must respond to simultaneous, interdependent pressures.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;8&lt;/span&gt;&lt;h2&gt;The forms of stakeholder theory&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;44–49, 51&lt;/b&gt; · Donaldson and Preston, 1995; Savage et al., 1991&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;“Stakeholder theory” is not a single thing. Donaldson and Preston distinguish four uses of the theory, which answer different questions.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Four forms&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;d1&quot;&gt;Descriptive&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d2&quot;&gt;Instrumental&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d3&quot;&gt;Normative&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d4&quot;&gt;Managerial&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d1&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;do firms actually do it?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;It seeks to establish &lt;b&gt;whether (and how)&lt;/b&gt; firms &lt;i&gt;actually do&lt;/i&gt; take stakeholder interests into account. It is used to describe, and sometimes to explain, corporate characteristics and behaviours.&lt;/p&gt;
      &lt;div class=&quot;quote&quot; style=&quot;font-size:1.05rem&quot;&gt;It describes the corporation as a constellation of cooperative and competitive interests possessing intrinsic value.&lt;cite&gt;Donaldson and Preston, 1995 · slide 45&lt;/cite&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d2&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;does it pay off for the firm?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;It asks whether taking stakeholders into account is &lt;i&gt;beneficial for the corporation&lt;/i&gt;. With the help of empirical data, it looks for &lt;b&gt;connections (or the lack thereof)&lt;/b&gt; between stakeholder management and traditional corporate objectives: profitability, stability, growth.&lt;/p&gt;
      &lt;p&gt;Central hypothesis: other things being equal, corporations that practise stakeholder management will perform relatively better in conventional terms.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d3&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;why should firms do it?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;It provides a &lt;b&gt;reason&lt;/b&gt; why firms &lt;i&gt;should&lt;/i&gt; consider stakeholders. For Donaldson and Preston it is the fundamental basis of the theory, and it accepts two ideas:&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;stakeholders are persons or groups with &lt;b&gt;legitimate interests&lt;/b&gt; in procedural and/or substantive aspects of corporate activity, and they are identified by their interests, whether or not the corporation has any functional interest in them;&lt;/li&gt;
        &lt;li&gt;the interests of all stakeholders are of &lt;b&gt;intrinsic value&lt;/b&gt;: each group merits consideration &lt;i&gt;for its own sake&lt;/i&gt;, not merely because it is useful to some other group, such as shareholders.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;d4&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;chip&quot;&gt;how is it done?&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;It does not merely describe or predict cause–effect relationships: it &lt;i&gt;recommends&lt;/i&gt; attitudes, structures and practices that together constitute &lt;b&gt;stakeholder management&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;Key feature: &lt;b&gt;simultaneous attention&lt;/b&gt; to the legitimate interests of all appropriate stakeholders, both in general structures and policies and in case-by-case decision making.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center;margin-top:1.4rem&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 300&quot; role=&quot;img&quot; aria-label=&quot;Three concentric circles: descriptive, instrumental, normative&quot;&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;150&quot; r=&quot;140&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;165&quot; r=&quot;96&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;185&quot; r=&quot;50&quot; fill=&quot;var(--c)&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Descriptive&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Instrumental&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Normative&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In the original article the three aspects are drawn as nested circles: the descriptive outer layer, then the instrumental one, with the normative core at the centre. The authors regard them as distinct, each relying on a different type of evidence, but &lt;b&gt;mutually supportive&lt;/b&gt;, with the normative base being fundamental (&lt;a href=&quot;https://doi.org/10.5465/amr.1995.9503271992&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract, Academy of Management Review&lt;/a&gt;).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;The managerial form on slide 44 cuts across the other three: it translates the theory into practice.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Strategic Stakeholder Management Approach (slide 49)&lt;/h3&gt;
  &lt;p&gt;An instrumental, strategic version: it maps the &lt;b&gt;relative importance&lt;/b&gt; of each stakeholder to the organisation along two dimensions, &lt;b&gt;capacity for threat&lt;/b&gt; and &lt;b&gt;potential for co-operation&lt;/b&gt;. Move the sliders.&lt;/p&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;savage&quot; viewBox=&quot;0 0 340 320&quot; role=&quot;img&quot; aria-label=&quot;Savage et al. 1991 matrix&quot;&gt;
        &lt;text x=&quot;200&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot;&gt;Capacity for threat →&lt;/text&gt;
        &lt;text x=&quot;14&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 160)&quot;&gt;Potential for co-operation →&lt;/text&gt;
        &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;rect id=&quot;q1&quot; x=&quot;40&quot; y=&quot;30&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;88&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 1 · Supportive&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;strategy: involve&lt;/text&gt;
          &lt;rect id=&quot;q4&quot; x=&quot;190&quot; y=&quot;30&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;88&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 4 · Mixed blessing&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;108&quot; class=&quot;s-ink2&quot;&gt;strategy: collaborate&lt;/text&gt;
          &lt;rect id=&quot;q2&quot; x=&quot;40&quot; y=&quot;170&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;228&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 2 · Marginal&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;248&quot; class=&quot;s-ink2&quot;&gt;strategy: monitor&lt;/text&gt;
          &lt;rect id=&quot;q3&quot; x=&quot;190&quot; y=&quot;170&quot; width=&quot;145&quot; height=&quot;135&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;228&quot; class=&quot;s-ink&quot; font-weight=&quot;700&quot;&gt;Type 3 · Non-supportive&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;248&quot; class=&quot;s-ink2&quot;&gt;strategy: defend&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;112&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;11&quot;&gt;low&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink2&quot; font-size=&quot;11&quot;&gt;high&lt;/text&gt;
        &lt;circle id=&quot;sp&quot; r=&quot;9&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label class=&quot;rng&quot;&gt;Capacity for threat &lt;output id=&quot;o-t&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r-t&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
