  &lt;h3&gt;Links to CSR and accountability (slide 51)&lt;/h3&gt;
  &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Stakeholder approach&lt;/th&gt;&lt;th&gt;CSR theories&lt;/th&gt;&lt;th&gt;Accountability&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Instrumental / strategic&lt;/td&gt;&lt;td&gt;Instrumental theories&lt;/td&gt;&lt;td&gt;Instrumental approach to accountability&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Normative&lt;/td&gt;&lt;td&gt;Ethical theories&lt;/td&gt;&lt;td&gt;Ethical and holistic approach&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Descriptive&lt;/td&gt;&lt;td&gt;Basis for the previous theories&lt;/td&gt;&lt;td&gt;Description of the network of stakeholders and their relationships&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Integrative theories&lt;/td&gt;&lt;td&gt;Integrated Reporting&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; &lt;i&gt;Accountability&lt;/i&gt; means the duty to account for one’s conduct: the obligation to explain and justify one’s actions to those affected by them. &lt;i&gt;Integrated Reporting&lt;/i&gt; is a form of reporting that combines financial and non-financial information. It is the bridge to the part of the degree programme on sustainability accounting (cf. Laine et al. 2022, cited on slide 33).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Match each form of the theory to its question: descriptive, instrumental, normative, managerial.&lt;/summary&gt;&lt;p&gt;Descriptive: do firms actually take stakeholders into account? Instrumental: does it pay off for them to do so? Normative: why should they do so? Managerial: through which attitudes, structures and practices should they do so?&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does it mean that stakeholder interests have “intrinsic value”?&lt;/summary&gt;&lt;p&gt;That each group merits consideration for its own sake, not merely because satisfying it serves the interests of some other group, such as shareholders.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A stakeholder with high capacity for threat and high potential for co-operation: type and strategy?&lt;/summary&gt;&lt;p&gt;Type 4, Mixed blessing: collaborate strategy.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;An uncooperative but potentially dangerous stakeholder: type and strategy?&lt;/summary&gt;&lt;p&gt;Type 3, Non-supportive: defend strategy.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;9&lt;/span&gt;&lt;h2&gt;Another perspective: the common good approach&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Slides &lt;b&gt;52–56&lt;/b&gt; · Melé, 2009&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;For Melé the firm is neither merely a nexus of contracts nor merely a system of interests to be coordinated: it is a &lt;em class=&quot;t&quot;&gt;community of persons&lt;/em&gt;.&lt;/p&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Shared commitment&lt;/h4&gt;Within the firm there is genuine commitment and a willingness to cooperate towards common goals, even though each person also has individual reasons for working together.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Collective outcome&lt;/h4&gt;People work cooperatively, and the outcome cannot be attributed to anyone in particular but to the firm as a whole, or to a group within it.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Not only economic ties&lt;/h4&gt;The bonds between people are economic but also emotional and moral.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Melé, 2009, p. 158 (slide 52)&lt;/p&gt;

  &lt;h3&gt;How the firm contributes to the common good (slide 53)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; The &lt;i&gt;common good&lt;/i&gt; is the sum of social conditions that allow individuals and groups to flourish. According to Melé (p. 164), the firm contributes to it by:&lt;/p&gt;
  &lt;ol&gt;
    &lt;li&gt;creating economic added value with &lt;b&gt;justice&lt;/b&gt; and distributing it with &lt;b&gt;equity&lt;/b&gt;;&lt;/li&gt;
    &lt;li&gt;providing useful goods and services, efficiently and fairly;&lt;/li&gt;
    &lt;li&gt;offering work, opportunities and organisational conditions that respect &lt;b&gt;human dignity and human rights&lt;/b&gt;;&lt;/li&gt;
    &lt;li&gt;fostering relationships between the firm and its constituent stakeholders, based on reciprocity, collaboration and cooperation;&lt;/li&gt;
    &lt;li&gt;aiming at the &lt;b&gt;continuity and sustainability&lt;/b&gt; of the firm;&lt;/li&gt;
    &lt;li&gt;being a good &lt;em class=&quot;t&quot;&gt;corporate citizen&lt;/em&gt; (a firm that takes part in the life of the community).&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;Three models of the firm compared (Table 7.1, slide 54)&lt;/h3&gt;
  &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;View of the firm&lt;/th&gt;&lt;th&gt;Purpose of the firm&lt;/th&gt;&lt;th&gt;Corporate governance model&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Contractual approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A fictitious person and a set of contracts&lt;/td&gt;&lt;td&gt;Maximizing shareholder wealth&lt;/td&gt;&lt;td&gt;&lt;b&gt;Shareholder model&lt;/b&gt;: oriented towards maximising shareholder value (with a tendency towards greater tolerance of other stakeholders’ interests)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Stakeholder approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A system of stakeholder interests&lt;/td&gt;&lt;td&gt;Coordinating stakeholder interests&lt;/td&gt;&lt;td&gt;&lt;b&gt;Stakeholder model&lt;/b&gt;: oriented towards stakeholder interests, creating value for them while maintaining the survival of the firm&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Common good approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A community of persons producing goods and services&lt;/td&gt;&lt;td&gt;Achieving the multi-ends of the firm in accordance with the common good of society&lt;/td&gt;&lt;td&gt;&lt;b&gt;Mission-driven model&lt;/b&gt;: oriented towards the good of the firm, defined by its multiple ends in accordance with the common good, through the mission (also taking into account the legitimate interests of stakeholders)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Dimension-by-dimension comparison (slides 55–56, from Melé 2009)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Dimensions of comparison&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;m1&quot;&gt;Fiduciary duties&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m2&quot;&gt;Legality&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m3&quot;&gt;Property right&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m4&quot;&gt;Wealth creation&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;m5&quot;&gt;Management performance&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m1&quot;&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Fiduciary duty&lt;/i&gt; = the obligation to act in the interest of someone who has entrusted something to you.&lt;/p&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;Managers are &lt;i&gt;agents&lt;/i&gt; of the shareholders, who are the &lt;i&gt;principals&lt;/i&gt;: they have fiduciary duties towards them and serve their best interests.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Managers have fiduciary duties not only towards shareholders but towards &lt;b&gt;all&lt;/b&gt; stakeholders.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;The primary fiduciary duty is towards &lt;b&gt;the firm itself&lt;/b&gt;: acting for the good of the institution as a whole.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m2&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;In some countries the law supports the idea of profit maximisation.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Laws change over time and from country to country, and they also protect stakeholder interests.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;Laws are not in themselves a moral justification. The firm is part of a wider community.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m3&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;The owner has the right to decide how to use their property.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Property rights and distributive justice.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;The firm is a human reality: property rights inadequately recognise the people who work in it.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m4&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;Profit maximisation is an effective way to create wealth (Adam Smith, the &lt;i&gt;invisible hand&lt;/i&gt;).&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Long-term wealth creation is best served by considering the interests of all legitimate stakeholders.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;Mission orientation includes both the pursuit of fair profits and the coordination of legitimate stakeholder interests.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;m5&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ochre)&quot;&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;Clear objectives, less opportunistic behaviour, more control.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;Multidimensional measurement systems.&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h4&gt;Common good&lt;/h4&gt;&lt;i&gt;Stewardship&lt;/i&gt;, care and awareness of the firm’s social function and moral responsibilities.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;What about CSR and corporate citizenship?&lt;/b&gt; The Overview (slide 2) also promises to “distinguish the various concepts of CSR” and “critically examine the notion of corporate citizenship”, but this PDF contains no dedicated slides. Moreover, the numbering has gaps (for example, slides 3, 32, 34, 40–43 and 50 are missing). For these topics the reading list refers to the &lt;b&gt;Crane et al. textbook, chapters 2 and 5&lt;/b&gt;. Here corporate citizenship appears only as the last contribution to the common good.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Towards whom is the primary fiduciary duty owed in the three approaches?&lt;/summary&gt;&lt;p&gt;Shareholder approach: towards shareholders. Stakeholder approach: towards all stakeholders. Common good approach: towards the firm itself, as an institution.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the “view of the firm” in the common good approach, and what governance model follows from it?&lt;/summary&gt;&lt;p&gt;The firm as a community of persons producing goods and services; the governance model is mission-driven.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is legality not enough for the common good approach?&lt;/summary&gt;&lt;p&gt;Because laws are not in themselves a moral justification: the firm is part of a wider community and must look to the common good.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Name at least four ways in which the firm contributes to the common good according to Melé.&lt;/summary&gt;&lt;p&gt;Added value created with justice and distributed with equity; useful goods and services provided efficiently and fairly; work that respects human dignity and human rights; reciprocal relationships with stakeholders; continuity and sustainability; being a good corporate citizen.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg);border-bottom:none&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;pnum&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;p class=&quot;src&quot;&gt;Authors, texts and documents cited in the slides. All entries are &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;: details and links found through web searches, to be checked against the editions listed in the syllabus.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;h3&gt;Texts in the reading list (slide 57)&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence: &lt;i&gt;Business Ethics&lt;/i&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;The course textbook, subtitled &lt;i&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;. The 5th edition dates from 2019 (ISBN 9780198810070). The slides refer to &lt;b&gt;chapters 2 and 5&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it covers the Overview topics without dedicated slides (concepts of CSR, corporate citizenship) as well as stakeholder theory. Check the edition adopted in the syllabus.&lt;/p&gt;&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oup.com.au: 5th edition page&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Freeman, R.E. (2007): &lt;i&gt;Managing for Stakeholders&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Slides 25–29 cite it as “notes available in Moodle”. Freeman published a technical note with this title at the Darden School (University of Virginia), used in Darden’s Business Ethics course. The book &lt;i&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/i&gt; (Freeman, Harrison, Wicks, Yale University Press) also appeared in 2007.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the four arguments (rights, consequences, character, pragmatist). The Moodle version is authoritative.&lt;/p&gt;&lt;a href=&quot;https://store.darden.virginia.edu/managing-for-stakeholders&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Darden Business Publishing: Managing for Stakeholders&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Melé, D. (2009): &lt;i&gt;Business Ethics in Action. Seeking Human Excellence in Organizations&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Palgrave Macmillan, Basingstoke. The slides use ch. 7, “The Purpose of the Firm and Mission-Driven Management” (pp. 152–174). Melé teaches at IESE Business School and adopts a person-centred perspective. A new edition, &lt;i&gt;Managing Human Excellence&lt;/i&gt;, was published in 2020.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the common good approach and of the comparison tables (sect. 9).&lt;/p&gt;&lt;a href=&quot;https://www.iese.edu/insight/articles/profit-with-principles/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight: article by Melé related to the book&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Wicks, Freeman, Werhane, Martin (2010): &lt;i&gt;Business Ethics. A Managerial Approach&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Pearson / Prentice Hall, © 2010 (ISBN 9780131427921). The slides refer to ch. 3, “Ethics, Stakeholders, Corporate Strategy, and Value Creation” (pp. 68–86).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the basis for the separation fallacy, integration thesis, responsibility principle and open question argument (sect. 3–4).&lt;/p&gt;&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson: book page&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Harrison, Phillips, Freeman (2020): “On the 2019 Business Roundtable ‘Statement on the Purpose of a Corporation’”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Management&lt;/i&gt;, 46(7), 1223–1237. An editorial that revisits the stockholders-versus-stakeholders debate and draws out its implications for scholars and managers.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the recommended reading for interpreting slide 23.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1177/0149206319892669&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.1177/0149206319892669&lt;/a&gt; · &lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/124&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UR Scholarship record&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Laine, Tregidga, Unerman (2022): &lt;i&gt;Sustainability Accounting and Accountability&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Routledge, 3rd edition. An introduction to sustainability accounting, reporting, ESG and accountability, with chapters on climate, biodiversity and human rights.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: the “Pause to reflect” exercise (slide 33) is adapted from it, and it is the bridge to accountability (slide 51).&lt;/p&gt;&lt;a href=&quot;https://routledge.com/Sustainability-Accounting-and-Accountability/Laine-Tregidga-Unerman/p/book/9781032023106&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Routledge: 3rd edition page&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--sage)&quot;&gt;&lt;h3&gt;Authors and articles cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Friedman, M. (1970): “The Social Responsibility of Business Is to Increase Its Profits”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;The New York Times Magazine&lt;/i&gt;, 13 September 1970. Friedman, a Chicago economist and 1976 Nobel laureate, argues that only individuals have responsibilities and that the managers’ task is to generate profit for shareholders while abiding by the rules.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the reference text of the shareholder model (slides 4–5, 12).&lt;/p&gt;&lt;a href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fermat’s Library: annotated text&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Freeman, R.E. (1984): &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;First published by Pitman, Boston (copyright 1984), later reissued by Cambridge University Press. It is regarded as the starting point of stakeholder theory.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it contains the definition of stakeholder on slide 20 (p. 46).&lt;/p&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rutgers CLEO: page on the book&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Evan, W.M. and Freeman, R.E. (1993): “A Stakeholder Theory of the Modern Corporation: Kantian Capitalism”&lt;/h4&gt;&lt;p&gt;A chapter in the anthology &lt;i&gt;Ethical Theory and Business&lt;/i&gt; (Beauchamp and Bowie), reprinted in several editions. It proposes that managers stand in a fiduciary relationship to stakeholders, not only to shareholders.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the principles of corporate rights, effect and character (slide 24).&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/kantian-theory-of-capitalism/490F75ACB46F81400612DE50CBA8446E&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Ethics Quarterly: Bowie, “A Kantian Theory of Capitalism”, which discusses it&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Freeman, R.E. and Phillips, R.A. (2002): “Stakeholder Theory: A Libertarian Defense”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Business Ethics Quarterly&lt;/i&gt;, 12(3), 331–349. It argues that one strand of stakeholder theory has libertarian roots and sketches a model of “stakeholder capitalism”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the definition of stakeholder theory on slide 21 (p. 334).&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v12y2002i03p331-349_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: article record&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Donaldson, T. and Preston, L.E. (1995): “The Stakeholder Theory of the Corporation: Concepts, Evidence, and Implications”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 20(1), 65–91. It distinguishes the descriptive, instrumental and normative aspects of the theory and identifies the normative base as fundamental.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the four forms of the theory (slides 44–48).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1995.9503271992&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.5465/amr.1995.9503271992&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Clarkson, M.B.E. (1995): “A Stakeholder Framework for Analyzing and Evaluating Corporate Social Performance”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 20(1), 92–117. Drawing on more than 70 field studies (1983–1993), it concludes that firms manage relationships with stakeholder groups, not with “society” at large.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the distinction between primary and secondary stakeholders (slide 35).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/258888&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.2307/258888&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Rowley, T.J. (1997): “Moving Beyond Dyadic Ties: A Network Theory of Stakeholder Influences”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Review&lt;/i&gt;, 22(4), 887–910. It applies social network analysis to explain the firm’s response to the simultaneous pressures of multiple stakeholders.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of slide 39 (network relations).&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/259248&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.2307/259248&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Savage, Nix, Whitehead, Blair (1991): “Strategies for Assessing and Managing Organizational Stakeholders”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Academy of Management Executive&lt;/i&gt;, 1991. A diagnostic typology that crosses potential for threat with potential for co-operation, yielding four stakeholder types, each with its own strategy.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the matrix on slide 49. The link is an open educational resource that explains it; for full bibliographic details, consult a database.&lt;/p&gt;&lt;a href=&quot;https://pressbooks.atlanticoer-relatlantique.ca/actingresponsibly/?p=64&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pressbooks (OER): Acting Responsibly, the Savage et al. model&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;French, P.A. (1979): “The Corporation as a Moral Person”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;American Philosophical Quarterly&lt;/i&gt;, 16, 207–215. It introduces the &lt;i&gt;Corporate Internal Decision (CID) Structure&lt;/i&gt; as the basis for attributing moral agency to the corporation, an idea later developed in &lt;i&gt;Collective and Corporate Responsibility&lt;/i&gt; (1984).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it grounds agency identity (slide 6).&lt;/p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/ethics-business/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy: “Business Ethics”, including the discussion of corporate moral agency&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Moore, G. (1999): “Corporate Moral Agency: Review and Implications”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Business Ethics&lt;/i&gt;, 21(4), 329–343. A review of the arguments for and against corporate moral responsibility: it concludes that the arguments in favour carry more weight and discusses the implications for stakeholder theory and virtue ethics.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it grounds organizational identity (slide 6).&lt;/p&gt;&lt;a href=&quot;https://www.proquest.com/docview/198123925&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ProQuest: record and abstract&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;src-group&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;h3&gt;Documents and cases cited&lt;/h3&gt;
  &lt;div class=&quot;srcs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Business Roundtable (2019): &lt;i&gt;Statement on the Purpose of a Corporation&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Published on 19 August 2019 and signed by about 181 CEOs. It replaces the position, held since 1997, that corporations exist principally to serve shareholders with a commitment to customers, employees, suppliers, communities and shareholders.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the document on slide 23, a real case of a shift from shareholder to stakeholder language (with criticism of its implementation).&lt;/p&gt;&lt;a href=&quot;https://www.businessroundtable.org/business-roundtable-redefines-the-purpose-of-a-corporation-to-promote-an-economy-that-serves-all-americans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business Roundtable: official press release&lt;/a&gt; · &lt;a href=&quot;https://purpose.businessroundtable.org&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;statement website&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The Volkswagen case (2015)&lt;/h4&gt;&lt;p&gt;On 18 September 2015 the US EPA issued Volkswagen a notice of violation of the Clean Air Act: software (a &lt;i&gt;defeat device&lt;/i&gt;) detected official tests and activated emissions controls only during testing. The cars emitted up to 40 times the permitted level.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is one of the scandals that, according to slide 14, undermine the dominant model.&lt;/p&gt;&lt;a href=&quot;https://www.epa.gov/vw/learn-about-volkswagen-violations&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPA: Learn About Volkswagen Violations&lt;/a&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The Enron case (2001)&lt;/h4&gt;&lt;p&gt;The SEC compiled its actions against Enron’s senior executives (Lay, Skilling, Causey and others) and against an Arthur Andersen partner for financial statement manipulation. The page is archived and no longer updated.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the first scandal cited on slide 14 and a classic example of the effects of pressure on shareholder value.&lt;/p&gt;&lt;a href=&quot;https://www.sec.gov/spotlight/enron.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEC: Spotlight on Enron&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;&lt;b&gt;Summary written by Claude from the slides: always check against the material.&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Parts marked &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; are explanations added to clarify the slides; parts marked &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; come from web searches, with links.&lt;/p&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;);
    btns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===b?&#x27;true&#x27;:&#x27;false&#x27;)});
      t.querySelectorAll(&#x27;[role=tabpanel]&#x27;).forEach(function(p){p.hidden=p.id!==b.getAttribute(&#x27;aria-controls&#x27;)});
    })});
  });
  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;[data-prev]&#x27;),next=s.querySelector(&#x27;[data-next]&#x27;);
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){steps.forEach(function(x,k){x.classList.toggle(&#x27;on&#x27;,k===i)});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,k){d.classList.toggle(&#x27;on&#x27;,k===i)});prev.disabled=i===0;next.disabled=i===steps.length-1}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });
  // separation / integration
  var sb=document.getElementById(&#x27;sepbtn&#x27;);
  if(sb){var on=false;sb.addEventListener(&#x27;click&#x27;,function(){on=!on;sb.setAttribute(&#x27;aria-pressed&#x27;,on);
    [&#x27;cB&#x27;,&#x27;tB&#x27;].forEach(function(id){document.getElementById(id).style.transform=on?&#x27;translateX(95px)&#x27;:&#x27;none&#x27;});
    [&#x27;cE&#x27;,&#x27;tE&#x27;].forEach(function(id){document.getElementById(id).style.transform=on?&#x27;translateX(-95px)&#x27;:&#x27;none&#x27;});
    document.getElementById(&#x27;hum&#x27;).setAttribute(&#x27;opacity&#x27;,on?1:0);
    document.getElementById(&#x27;sepcap&#x27;).textContent=on?&#x27;Integration thesis: business and ethics overlap, with people at the centre&#x27;:&#x27;Separation fallacy: two worlds that never meet&#x27;;
    sb.textContent=on?&#x27;Back to the separation fallacy&#x27;:&#x27;Show the Integration Thesis&#x27;;});}
  // stakeholder model: node cards
  var stakes={
    sh:[&#x27;Shareholders&#x27;,&#x27;They provide risk capital. They expect returns, long-term value and transparency. Here they are one stakeholder among others, not the centre.&#x27;],
    emp:[&#x27;Employees&#x27;,&#x27;They contribute time, skills and health. They expect fair pay, safety, training, dignity and stability.&#x27;],
    cust:[&#x27;Customers&#x27;,&#x27;They contribute their money and their trust. They expect safe, useful products at a fair price and truthful information.&#x27;],
    sup:[&#x27;Suppliers&#x27;,&#x27;They contribute supplies, dedicated investments and often their own survival. They expect timely payment and fair dealings.&#x27;],
    gov:[&#x27;Government&#x27;,&#x27;It provides infrastructure, rules and markets. It expects compliance with the law and payment of taxes.&#x27;],
    comp:[&#x27;Competitors&#x27;,&#x27;They share the market. They expect fair competition and may cooperate on common standards.&#x27;],
    civ:[&#x27;Civil society&#x27;,&#x27;Local communities, NGOs, citizens. They bear the externalities (environment, local area) and expect a firm that contributes to the community.&#x27;]
  };
  var hp=document.getElementById(&#x27;hubpanel&#x27;);
  document.querySelectorAll(&#x27;.hubn&#x27;).forEach(function(n){
    function act(){document.querySelectorAll(&#x27;.hubn&#x27;).forEach(function(m){m.classList.toggle(&#x27;on&#x27;,m===n)});var s=stakes[n.dataset.k];
      hp.innerHTML=&#x27;&lt;span class=&quot;chip&quot;&gt;stake of &#x27;+s[0]+&#x27;&lt;/span&gt;&lt;h4 style=&quot;margin-top:.6rem&quot;&gt;&#x27;+s[0]+&#x27;&lt;/h4&gt;&lt;p&gt;&#x27;+s[1]+&#x27;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt; illustrative example, not text from the slides.&lt;/p&gt;&#x27;;}
    n.addEventListener(&#x27;click&#x27;,act);n.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();act()}});
  });
  // value frontier
  var ra=document.getElementById(&#x27;r-a&#x27;),rr=document.getElementById(&#x27;r-r&#x27;);
  if(ra){
    var ox=50,oy=280,W=310,H=240;
    function arc(R){var d=&#x27;M&#x27;+ox+&#x27; &#x27;+(oy-R*H);for(var k=0;k&lt;=40;k++){var t=Math.PI/2*(1-k/40);d+=&#x27; L&#x27;+(ox+R*W*Math.cos(t)).toFixed(1)+&#x27; &#x27;+(oy-R*H*Math.sin(t)).toFixed(1)}return d}
    document.getElementById(&#x27;fr0&#x27;).setAttribute(&#x27;d&#x27;,arc(.62));
    function upd(){
      var R=.62+.33*rr.value/100,t=(90-ra.value)*Math.PI/180;
      var px=ox+R*W*Math.cos(t),py=oy-R*H*Math.sin(t);
      document.getElementById(&#x27;fr&#x27;).setAttribute(&#x27;d&#x27;,arc(R)+&#x27; L&#x27;+ox+&#x27; &#x27;+oy+&#x27; Z&#x27;);
      var p=document.getElementById(&#x27;frp&#x27;);p.setAttribute(&#x27;cx&#x27;,px);p.setAttribute(&#x27;cy&#x27;,py);
      var lx=document.getElementById(&#x27;frx&#x27;);lx.setAttribute(&#x27;x1&#x27;,px);lx.setAttribute(&#x27;x2&#x27;,px);lx.setAttribute(&#x27;y1&#x27;,py);lx.setAttribute(&#x27;y2&#x27;,oy);
      var ly=document.getElementById(&#x27;fry&#x27;);ly.setAttribute(&#x27;x1&#x27;,ox);ly.setAttribute(&#x27;x2&#x27;,px);ly.setAttribute(&#x27;y1&#x27;,py);ly.setAttribute(&#x27;y2&#x27;,py);
      var vs=Math.round(R*100*Math.cos(t)),ve=Math.round(R*100*Math.sin(t));
      document.getElementById(&#x27;o-a&#x27;).textContent=ra.value&lt;45?&#x27;more to shareholders&#x27;:ra.value&gt;45?&#x27;more to employees&#x27;:&#x27;balance&#x27;;
      document.getElementById(&#x27;o-r&#x27;).textContent=&#x27;+&#x27;+Math.round(rr.value*.33/.62)+&#x27;% value&#x27;;
      document.getElementById(&#x27;frtxt&#x27;).innerHTML=&#x27;Shareholder value &lt;b&gt;&#x27;+vs+&#x27;&lt;/b&gt; · employee value &lt;b&gt;&#x27;+ve+&#x27;&lt;/b&gt;. &#x27;+(rr.value&gt;0?&#x27;By rethinking the problem the pie grows: the same tradeoff leaves both better off than before.&#x27;:&#x27;On the starting curve, every gain for one is a loss for the other.&#x27;);
    }
    ra.addEventListener(&#x27;input&#x27;,upd);rr.addEventListener(&#x27;input&#x27;,upd);upd();
  }
  // primary/secondary mini-exercise
  var sg=document.getElementById(&#x27;sortgame&#x27;);
  if(sg){
    var items=[[&#x27;Employees&#x27;,&#x27;p&#x27;],[&#x27;Media&#x27;,&#x27;s&#x27;],[&#x27;Shareholders and investors&#x27;,&#x27;p&#x27;],[&#x27;Competitors&#x27;,&#x27;s&#x27;],[&#x27;Customers&#x27;,&#x27;p&#x27;],[&#x27;Consumer associations&#x27;,&#x27;s&#x27;],[&#x27;Suppliers&#x27;,&#x27;p&#x27;],[&#x27;Special interest groups (sector NGOs)&#x27;,&#x27;s&#x27;],[&#x27;Local communities&#x27;,&#x27;p&#x27;]];
    items.forEach(function(it){
      var row=document.createElement(&#x27;div&#x27;);row.className=&#x27;sortitem&#x27;;
      row.innerHTML=&#x27;&lt;span&gt;&#x27;+it[0]+&#x27;&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; data-a=&quot;p&quot;&gt;Primary&lt;/button&gt; &lt;button class=&quot;btn&quot; data-a=&quot;s&quot;&gt;Secondary&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&#x27;;
      row.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
        var ok=b.dataset.a===it[1],fb=row.querySelector(&#x27;.fb&#x27;);
        row.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,x===b)});
        fb.className=&#x27;fb &#x27;+(ok?&#x27;ok&#x27;:&#x27;ko&#x27;);
        fb.textContent=ok?&#x27;✓ Correct: &#x27;+(it[1]===&#x27;p&#x27;?&#x27;the firm depends on this group for its survival.&#x27;:&#x27;it affects or is affected by the firm, but the firm does not depend on it for survival.&#x27;):&#x27;✗ Try again: ask yourself whether the firm could survive without this group.&#x27;;
      })});
      sg.appendChild(row);
    });
  }
  // Rowley&#x27;s network
  var nb=document.getElementById(&#x27;netbtn&#x27;);
  if(nb){var nn=false;nb.addEventListener(&#x27;click&#x27;,function(){nn=!nn;nb.setAttribute(&#x27;aria-pressed&#x27;,nn);
    document.getElementById(&#x27;netlinks&#x27;).setAttribute(&#x27;opacity&#x27;,nn?1:0);document.getElementById(&#x27;netext&#x27;).setAttribute(&#x27;opacity&#x27;,nn?1:0);
    nb.textContent=nn?&#x27;Back to dyadic ties&#x27;:&#x27;Show the network&#x27;;});}
  // Savage matrix
  var rt=document.getElementById(&#x27;r-t&#x27;),rc=document.getElementById(&#x27;r-c&#x27;);
  if(rt){
    var Q={q1:[&#x27;Type 1 · Supportive&#x27;,&#x27;Low threat, high cooperation: &lt;b&gt;involve&lt;/b&gt; them in decisions and make the most of their support.&#x27;],
           q2:[&#x27;Type 2 · Marginal&#x27;,&#x27;Low threat, low cooperation: &lt;b&gt;monitor&lt;/b&gt; them without investing too many resources.&#x27;],
           q3:[&#x27;Type 3 · Non-supportive&#x27;,&#x27;High threat, low cooperation: &lt;b&gt;defend&lt;/b&gt;, reduce dependence and protect yourself.&#x27;],
           q4:[&#x27;Type 4 · Mixed blessing&#x27;,&#x27;High threat, high cooperation: &lt;b&gt;collaborate&lt;/b&gt;, turn the potential threat into collaboration.&#x27;]};
    function sv(){
      var t=+rt.value,c=+rc.value,q=c&gt;=50?(t&lt;50?&#x27;q1&#x27;:&#x27;q4&#x27;):(t&lt;50?&#x27;q2&#x27;:&#x27;q3&#x27;);
      [&#x27;q1&#x27;,&#x27;q2&#x27;,&#x27;q3&#x27;,&#x27;q4&#x27;].forEach(function(id){var r=document.getElementById(id);r.setAttribute(&#x27;fill&#x27;,id===q?&#x27;var(--cbg)&#x27;:&#x27;var(--card)&#x27;);r.setAttribute(&#x27;stroke&#x27;,id===q?&#x27;var(--c)&#x27;:&#x27;var(--rule)&#x27;);r.setAttribute(&#x27;stroke-width&#x27;,id===q?3:1)});
      var p=document.getElementById(&#x27;sp&#x27;);p.setAttribute(&#x27;cx&#x27;,40+t/100*295);p.setAttribute(&#x27;cy&#x27;,305-c/100*275);
      document.getElementById(&#x27;o-t&#x27;).textContent=t&lt;50?&#x27;low&#x27;:&#x27;high&#x27;;document.getElementById(&#x27;o-c&#x27;).textContent=c&lt;50?&#x27;low&#x27;:&#x27;high&#x27;;
      document.getElementById(&#x27;savtxt&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+Q[q][0]+&#x27;&lt;/b&gt;&lt;br&gt;&#x27;+Q[q][1]+&#x27; &lt;span class=&quot;int&quot;&gt;explanation: supplement&lt;/span&gt;&#x27;;
    }
    rt.addEventListener(&#x27;input&#x27;,sv);rc.addEventListener(&#x27;input&#x27;,sv);
    document.querySelectorAll(&#x27;[data-sv]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){var v=b.dataset.sv.split(&#x27;,&#x27;);rt.value=v[0];rc.value=v[1];sv()})});
    sv();
  }
})();
&lt;/script&gt;
