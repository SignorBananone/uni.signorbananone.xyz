      &lt;a href=&quot;#s4&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;220&quot; y=&quot;172&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;360&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;4 · Garriga &amp;amp; Melé&#x27;s map&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;360&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot;&gt;from Parsons&#x27; 4 aspects (1961)&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s5&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;12&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;95&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;I · Instrumental&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;95&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;economics · profit&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s6&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;192&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;275&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;II · Political&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;275&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;power · citizenship&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s7&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;372&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;455&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;III · Integrative&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;455&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;social demands&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s8&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;547&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;630&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;IV · Ethical&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;630&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;values · common good&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s9&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;210&quot; y=&quot;462&quot; width=&quot;300&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;360&quot; y=&quot;486&quot; text-anchor=&quot;middle&quot;&gt;Synthesis · 4 connected dimensions&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;360&quot; y=&quot;504&quot; text-anchor=&quot;middle&quot;&gt;Donati (1991) reinterprets Parsons&lt;/text&gt;&lt;/a&gt;
      &lt;text class=&quot;elab&quot; x=&quot;360&quot; y=&quot;545&quot; text-anchor=&quot;middle&quot;&gt;dashed lines = thematic links · solid lines = steps in the argument&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; Navigating the jungle of definitions &lt;span class=&quot;slides&quot;&gt;slides 2–14&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;What does CSR mean?&lt;/h2&gt;
  &lt;p&gt;&lt;dfn&gt;CSR – Corporate Social Responsibility&lt;/dfn&gt; refers, as a first approximation, to the responsibilities a company has towards society beyond simply doing business. The lecture, however, starts from a key point: &lt;b&gt;there is no single definition&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;The starting point: two opposing views&lt;/h3&gt;
  &lt;p&gt;As you already know from the course (slide 2), the debate revolves around two poles:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Shareholders&#x27; view&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Stakeholders&#x27; view&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Milton Friedman&lt;/b&gt;: &lt;i&gt;“The only corporate social responsibility a company has is to maximize its profits.”&lt;/i&gt;&lt;/p&gt;
      &lt;p&gt;The &lt;dfn&gt;shareholders&lt;/dfn&gt; are the owners: the company is their instrument and the manager is their agent. Engaging in “charity” with the company&#x27;s money would mean spending other people&#x27;s money. Social responsibility coincides with profit, within the rules of the game (law and ethical custom). → Basis of the &lt;a href=&quot;#s5&quot;&gt;instrumental theories&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;R. Edward Freeman&lt;/b&gt;: the company must answer to all its &lt;dfn&gt;stakeholders&lt;/dfn&gt;, i.e. the parties that affect or are affected by its activities (employees, customers, suppliers, communities, the environment, capital providers…).&lt;/p&gt;
      &lt;p&gt;Value is created not only for shareholders but through relationships with many groups, whose interests have intrinsic worth. → Returns in &lt;a href=&quot;#s7&quot;&gt;stakeholder management&lt;/a&gt; (integrative) and in &lt;a href=&quot;#s8&quot;&gt;normative stakeholder theory&lt;/a&gt; (ethical).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;An ambiguous, complex, “open” concept&lt;/h3&gt;
  &lt;p&gt;The literature (slide 3) agrees on one point: CSR is&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;ambiguous&lt;/span&gt;&lt;p&gt;“ambiguous, elusive and unclear” — Smith &amp;amp; Langford 2009; van Marrewijk 2003; Vogel 1991; Votaw 1973.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;difficult to define&lt;/span&gt;&lt;p&gt;Aguinis &amp;amp; Glavas 2012; Dahlsrud 2008; Garriga &amp;amp; Melé 2004; Matten &amp;amp; Moon 2008; Moon, Crane &amp;amp; Matten 2005.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;multidisciplinary&lt;/span&gt;&lt;p&gt;The complexity stems from the fact that theories and approaches come from different disciplines (economics, law, sociology, philosophy, management).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;complex · appraisive · open&lt;/span&gt;&lt;p&gt;A &lt;i class=&quot;en&quot;&gt;complex, appraisive, open&lt;/i&gt; concept: it takes on different meanings in different organisations and contexts (Matten &amp;amp; Moon 2008; Moon, Crane &amp;amp; Matten 2005).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;i class=&quot;en&quot;&gt;Appraisive&lt;/i&gt; (evaluative) means that calling a company “socially responsible” is already a positive value judgement; &lt;i class=&quot;en&quot;&gt;open&lt;/i&gt; means that its content changes over time and across contexts. This is why there is so much debate about what it includes.&lt;/div&gt;
  &lt;blockquote&gt;«… few subjects in management arouse as much controversy and contestation as CSR. For this reason, definitions of CSR abound, and there are as many definitions of CSR as there are disagreements over the appropriate role of the corporation in society»&lt;cite&gt;Crane, Matten &amp;amp; Spence, 2008 · slide 4&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In other words: there are as many definitions as there are disagreements over the &lt;b&gt;role of the corporation in society&lt;/b&gt;. This sentence is the key to the whole lecture: tell me what role you assign to business and I will tell you what your CSR is.&lt;/p&gt;

  &lt;h3&gt;Votaw&#x27;s seven meanings (1972)&lt;/h3&gt;
  &lt;p&gt;Votaw (slide 5) shows that “CSR” means something, but not the same thing to everyone. Click on each meaning:&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;div&gt;
      &lt;button class=&quot;pk&quot; data-k=&quot;v1&quot;&gt;legal responsibility / liability&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v2&quot;&gt;ethical behaviour&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v3&quot;&gt;“responsible for” (causal)&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v4&quot;&gt;charitable contribution&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v5&quot;&gt;socially conscious&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v6&quot;&gt;legitimacy&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v7&quot;&gt;fiduciary duty&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;v0&quot;&gt;Choose a meaning to see what it implies.&lt;/div&gt;
      &lt;div data-k=&quot;v1&quot; hidden&gt;&lt;b&gt;Legal responsibility&lt;/b&gt;: the company is legally answerable for the harm it causes (&lt;i class=&quot;en&quot;&gt;liability&lt;/i&gt;). Example: compensating those harmed by a defective product.&lt;/div&gt;
      &lt;div data-k=&quot;v2&quot; hidden&gt;&lt;b&gt;Ethically responsible behaviour&lt;/b&gt;: acting rightly in a moral sense, even beyond legal obligations.&lt;/div&gt;
      &lt;div data-k=&quot;v3&quot; hidden&gt;&lt;b&gt;“Responsible for” in a causal sense&lt;/b&gt;: being the cause of something (e.g. “the company is responsible for polluting the river”). Links to the &lt;i&gt;responsibility for&lt;/i&gt; / &lt;i&gt;responsibility to&lt;/i&gt; distinction below.&lt;/div&gt;
      &lt;div data-k=&quot;v4&quot; hidden&gt;&lt;b&gt;Charitable contribution&lt;/b&gt;: for many, CSR = philanthropy, donations. This is the most reductive reading (cf. the &lt;a href=&quot;#s6&quot;&gt;limited view of corporate citizenship&lt;/a&gt;).&lt;/div&gt;
      &lt;div data-k=&quot;v5&quot; hidden&gt;&lt;b&gt;Socially conscious&lt;/b&gt;: a company that is attentive and sensitive to social problems.&lt;/div&gt;
      &lt;div data-k=&quot;v6&quot; hidden&gt;&lt;b&gt;Legitimacy&lt;/b&gt;: CSR as a synonym for being “proper”, valid, accepted by society. Returns in the &lt;a href=&quot;#s7&quot;&gt;integrative theories&lt;/a&gt; (Suchman).&lt;/div&gt;
      &lt;div data-k=&quot;v7&quot; hidden&gt;&lt;b&gt;Fiduciary duty&lt;/b&gt;: higher standards of behaviour for businessmen than for ordinary citizens. &lt;i class=&quot;en&quot;&gt;Fiduciary duty&lt;/i&gt; is the obligation to act in the interest of those who have entrusted something to you: it returns in Freeman (“managers bear a fiduciary duty to stakeholders”).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A seminal book: Bowen (1953)&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Howard R. Bowen, &lt;i&gt;Social Responsibilities of the Businessman&lt;/i&gt; (1953)&lt;/b&gt; — regarded as the beginning of the modern CSR debate (slide 6). Since then there has been a great proliferation of theories, approaches and terminologies.&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;CSR&#x27;s “cousin” terms (slide 7)&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;In brief&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Business and Society&lt;/i&gt;&lt;/td&gt;&lt;td&gt;field of study on the relationships between business and society&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Social Issues Management&lt;/i&gt;&lt;/td&gt;&lt;td&gt;management of the social issues that affect the company (→ issues management)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Public policy and business&lt;/i&gt;&lt;/td&gt;&lt;td&gt;relationship between business and public policy (→ principle of public responsibility)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Stakeholder (Corporate Stakeholder Responsibility)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;responsibility understood as responsibility towards stakeholders&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Accountability&lt;/i&gt;&lt;/td&gt;&lt;td&gt;having to give account of one&#x27;s actions (e.g. through reporting)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;&lt;i&gt;Corporate citizenship&lt;/i&gt;&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the company as a “citizen” (→ &lt;a href=&quot;#s6&quot;&gt;political theories&lt;/a&gt;)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;&lt;i&gt;Sustainability&lt;/i&gt;&lt;/b&gt;&lt;/td&gt;&lt;td&gt;sustainability (→ &lt;a href=&quot;#s8&quot;&gt;sustainable development&lt;/a&gt;)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;small muted&quot;&gt;On the slide the last two are highlighted: they are the ones the lecture takes up in detail.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Lecture objectives and guiding questions (slides 8–9)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Objectives: to introduce the concept of CSR; to stimulate critical thinking about the role of business in society; to discuss the different theories. First we need to ask: &lt;i&gt;what does CSR mean? Why do companies have social responsibilities? What kind of responsibilities?&lt;/i&gt;&lt;/p&gt;
    &lt;p&gt;Slide 9 presents “two views” through two videos: a CSR certificate (WORLDCOB CSR:2011.2) and a video by the &lt;i&gt;Confederation of Indian Industry&lt;/i&gt; on CSR.&lt;/p&gt;
    &lt;div class=&quot;ext&quot;&gt;One possible reading of the comparison (not stated in the slides): in India, &lt;i&gt;Section 135&lt;/i&gt; of the &lt;i&gt;Companies Act 2013&lt;/i&gt; requires companies above certain thresholds to spend at least 2% of their average net profit of the three preceding financial years on CSR, whereas in 2001 the EU described CSR as &lt;b&gt;voluntary&lt;/b&gt;. Sources: &lt;a href=&quot;https://bsr.org/en/blog/india-companies-act-2013-five-key-points-about-indias-csr-mandate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BSR&lt;/a&gt;, &lt;a href=&quot;https://cag.gov.in/uploads/download_audit_report/2018/Chapter_4_Corporate_Social_Responsibility_of_Report_No_18_of_2018_-_Compliance_Audit_on_General_Purpose_Financial_Reports_of_Central_Public_Sector_Enterprises_of_Uni.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CAG India, Report No. 18 of 2018&lt;/a&gt;.&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Generating and solving problems&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;CSR&lt;/b&gt; = an organisation&#x27;s contribution both to &lt;b&gt;generating&lt;/b&gt; and to &lt;b&gt;solving&lt;/b&gt; social and environmental problems (Secchi 2007; Wood &amp;amp; Logsdon 2002 · slides 3, 13).&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Responsibility for and responsibility to&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;rect x=&quot;340&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;155&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 16px var(--serif);fill:var(--brick)&quot;&gt;Responsibility FOR&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; style=&quot;font:13px var(--sans);fill:var(--ink)&quot;&gt;(having done) something&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;backward-looking: I answer for the&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;effects I have caused (problems generated)&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 16px var(--serif);fill:var(--sage)&quot;&gt;Responsibility TO&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; style=&quot;font:13px var(--sans);fill:var(--ink)&quot;&gt;do something&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;forward-looking: I commit to&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;helping to solve problems&lt;/text&gt;
      &lt;path d=&quot;M302 85H338&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Slide 13: two sides of responsibility. Example: a steelworks is responsible &lt;i&gt;for&lt;/i&gt; the emissions it produces; it takes on a responsibility &lt;i&gt;to&lt;/i&gt; when it funds land remediation or training in the local area.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The three dimensions&lt;/h3&gt;
  &lt;p&gt;Responsibility sits at three nested levels (slide 14). Click on the rings:&lt;/p&gt;
  &lt;div data-picker class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 240&quot; role=&quot;img&quot; aria-label=&quot;Three nested dimensions: institutional, organisational, individual&quot;&gt;
      &lt;g data-k=&quot;d1&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;125&quot; rx=&quot;150&quot; ry=&quot;108&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.95&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Institutional&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;national and international&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;d2&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;150&quot; rx=&quot;100&quot; ry=&quot;76&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Organisational&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;d3&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;180&quot; r=&quot;42&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--paper)&quot;&gt;Individual&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;d0&quot;&gt;Click a level.&lt;/div&gt;
      &lt;div data-k=&quot;d1&quot; hidden&gt;&lt;b&gt;Institutional&lt;/b&gt;: rules, policies and expectations of states and supranational bodies (EU, UN), which set the framework within which companies operate. → &lt;a href=&quot;#s2&quot;&gt;section 2&lt;/a&gt;.&lt;/div&gt;
      &lt;div data-k=&quot;d2&quot; hidden&gt;&lt;b&gt;Organisational&lt;/b&gt;: the company as an actor that adopts CSR strategies, processes and policies.&lt;/div&gt;
      &lt;div data-k=&quot;d3&quot; hidden&gt;&lt;b&gt;Individual&lt;/b&gt;: managers and people who make decisions and are morally accountable for them (it is no coincidence that Bowen spoke of the &lt;i&gt;businessman&lt;/i&gt;).&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:.6rem&quot;&gt;Connection: the same three levels return in the principles of &lt;a href=&quot;#s7&quot;&gt;Wood&#x27;s (1991)&lt;/a&gt; model.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to Crane, Matten &amp;amp; Spence, why are there so many definitions of CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because each definition reflects a different idea of the &lt;b&gt;appropriate role of the corporation in society&lt;/b&gt;: there are as many definitions as there are disagreements over that role.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between “responsibility for” and “responsibility to”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;For&lt;/i&gt;: answering for what one has done (problems generated, a retrospective perspective). &lt;i&gt;To&lt;/i&gt;: committing to do something (helping to solve problems, a prospective perspective).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Name at least four of the meanings of CSR listed by Votaw.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Legal responsibility/liability; ethical behaviour; causal “responsible for”; charitable contribution; social consciousness; legitimacy; fiduciary duty with higher standards for businessmen.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three dimensions of CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Institutional (national and international), organisational, individual.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; The institutional level &lt;span class=&quot;slides&quot;&gt;slides 15–24&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;EU and UN: CSR on the public agenda&lt;/h2&gt;

  &lt;h3&gt;The EU definition (Green Paper 2001)&lt;/h3&gt;
  &lt;blockquote&gt;“Most definitions of corporate social responsibility describe it as a concept whereby companies integrate social and environmental concerns in their business operations and in their interaction with their stakeholders on a voluntary basis”.&lt;cite&gt;EU, 2001 – Green Paper · slide 15&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Slide 18 breaks it down into three elements. Go through the tabs:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;① integration&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;② voluntariness&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;③ stakeholders&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;i&gt;“…integration of social and environmental concerns in their business operations”&lt;/i&gt; → a &lt;b&gt;holistic approach&lt;/b&gt;, not a sporadic, isolated activity. CSR must become part of the ordinary way of producing, buying and selling, not an occasional donation.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;i&gt;“…on a voluntary basis”&lt;/i&gt; → something that goes &lt;b&gt;beyond legal and contractual requirements&lt;/b&gt; (&lt;i class=&quot;en&quot;&gt;beyond the law&lt;/i&gt;). Complying with the law is the minimum; CSR begins after that.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;i&gt;“…in their interaction with their stakeholders”&lt;/i&gt; → strong commitment to stakeholders (&lt;b&gt;stakeholder approach&lt;/b&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;In communication &lt;b&gt;COM(2011) 681&lt;/b&gt; the Commission then adopted a shorter definition: CSR as &lt;i&gt;“the responsibility of enterprises for their impacts on society”&lt;/i&gt;, with respect for applicable legislation and collective agreements as a prerequisite. Dahlsrud&#x27;s (2008) study of 37 definitions identifies the Green Paper definition as the most frequently cited. Sources: &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, summary&lt;/a&gt;; &lt;a href=&quot;https://ideas.repec.org/a/wly/corsem/v15y2008i1p1-13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dahlsrud 2008 on IDEAS/RePEc&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;The Lisbon appeal (March 2000)&lt;/h3&gt;
  &lt;p&gt;The Lisbon European Council made a special appeal to companies&#x27; sense of social responsibility regarding best practices in: &lt;b&gt;lifelong learning&lt;/b&gt;, &lt;b&gt;work organisation&lt;/b&gt;, &lt;b&gt;equal opportunities&lt;/b&gt;, &lt;b&gt;social inclusion&lt;/b&gt; and &lt;b&gt;sustainable development&lt;/b&gt; (slide 16).&lt;/p&gt;

  &lt;h3&gt;Key documents: a timeline&lt;/h3&gt;
  &lt;p&gt;Click on the years (slide 17):&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;svg viewBox=&quot;0 0 680 120&quot; role=&quot;img&quot; aria-label=&quot;Timeline of EU documents on CSR&quot;&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;60&quot; x2=&quot;660&quot; y2=&quot;60&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;g data-k=&quot;t1&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2001&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Green Paper&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t2&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2002&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Communication&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t3&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;270&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2006&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Communication&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t4&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;380&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2011&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Strategy 2011-14&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t5&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;510&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2019&lt;/text&gt;&lt;text x=&quot;510&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Green Deal&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t6&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;610&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2020&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;NextGenEU&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;t0&quot;&gt;Click a year.&lt;/div&gt;
      &lt;div data-k=&quot;t1&quot; hidden&gt;&lt;b&gt;2001 · Green Paper&lt;/b&gt; “Promoting a European framework for corporate social responsibility”: opens the debate and provides the “voluntary” definition seen above. &lt;span class=&quot;small muted&quot;&gt;(External source: COM(2001) 366, 18 July 2001 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/green-paper-on-corporate-social-responsibility.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t2&quot; hidden&gt;&lt;b&gt;2002 · Communication&lt;/b&gt; “Corporate Social Responsibility: A business contribution to Sustainable Development”: links CSR to sustainable development. &lt;span class=&quot;small muted&quot;&gt;(External source: COM(2002) 347, follow-up to the Green Paper.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t3&quot; hidden&gt;&lt;b&gt;2006 · Communication&lt;/b&gt; “Implementing the partnership for growth and jobs: making Europe a pole of excellence on corporate social responsibility”: CSR as a lever for growth and employment.&lt;/div&gt;
      &lt;div data-k=&quot;t4&quot; hidden&gt;&lt;b&gt;2011 · Communication&lt;/b&gt; “A renewed EU strategy 2011-14 for corporate social responsibility”: the 8-point agenda for action (below). &lt;span class=&quot;small muted&quot;&gt;(External source: COM(2011) 681, 25 October 2011 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t5&quot; hidden&gt;&lt;b&gt;2019 · European Green Deal&lt;/b&gt; (von der Leyen Commission): sustainability moves to the centre of policymakers&#x27; agenda. &lt;span class=&quot;small muted&quot;&gt;(External source: COM(2019) 640 of 11.12.2019, target of net-zero greenhouse gas emissions by 2050 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-green-deal.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t6&quot; hidden&gt;&lt;b&gt;2020 · Next Generation EU&lt;/b&gt;: the post-pandemic recovery plan; in Italy it takes the form of the PNRR, the National Recovery and Resilience Plan (slide 20: “4 challenges”, “6 missions”). &lt;span class=&quot;small muted&quot;&gt;(External source: its core is the Recovery and Resilience Facility, grants and loans for reforms and investments — &lt;a href=&quot;https://next-generation-eu.europa.eu/recovery-and-resilience-facility_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Commission&#x27;s strategy: 8 lines of action&lt;/h3&gt;
  &lt;p&gt;The Commission promotes CSR and encourages companies to adhere to international guidelines and principles (slide 19). The agenda includes:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card small&quot;&gt;1. Enhancing the &lt;b&gt;visibility&lt;/b&gt; of CSR and disseminating good practices&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;2. Improving and tracking levels of &lt;b&gt;trust&lt;/b&gt; in business&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;3. Improving &lt;b&gt;self- and co-regulation&lt;/b&gt; processes (self-regulation and regulation shared with public authorities)&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;4. Enhancing &lt;b&gt;market rewards&lt;/b&gt; for CSR&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;5. Improving company &lt;b&gt;disclosure&lt;/b&gt; of social and environmental information&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;6. Further integrating CSR into &lt;b&gt;education, training and research&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;7. Emphasising the importance of &lt;b&gt;national and sub-national&lt;/b&gt; CSR policies&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;8. Better aligning &lt;b&gt;European and global&lt;/b&gt; approaches&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The UN&#x27;s commitment&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;UN Global Compact&lt;/b&gt; — “the world&#x27;s largest corporate sustainability initiative”; “Business as a force for good”. A call to companies to align their strategies and operations with universal principles on &lt;b&gt;human rights, labour, environment and anti-corruption&lt;/b&gt;, and to take action in support of societal goals (slides 21–22).&lt;/div&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Human rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Labour&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Environment&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Anti-corruption&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;1.&lt;/b&gt; Support and respect internationally proclaimed human rights. &lt;b&gt;2.&lt;/b&gt; Make sure they are not complicit in human rights abuses.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;3.&lt;/b&gt; Freedom of association and collective bargaining. &lt;b&gt;4.&lt;/b&gt; Elimination of forced labour. &lt;b&gt;5.&lt;/b&gt; Abolition of child labour. &lt;b&gt;6.&lt;/b&gt; Elimination of discrimination in employment.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;7.&lt;/b&gt; A precautionary approach to environmental challenges. &lt;b&gt;8.&lt;/b&gt; Initiatives to promote greater environmental responsibility. &lt;b&gt;9.&lt;/b&gt; Development and diffusion of environmentally friendly technologies.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;10.&lt;/b&gt; Work against corruption in all its forms, including extortion and bribery.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;ext&quot;&gt;The slides name the four areas; the ten principles (paraphrased here) come from the official website and are derived from the Universal Declaration of Human Rights, the ILO Declaration, the Rio Declaration and the UN Convention against Corruption. The Global Compact is not a regulatory instrument: it does not “police” or sanction companies. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Global Compact – The Ten Principles&lt;/a&gt;.&lt;/p&gt;

  &lt;h4&gt;Sustainable Development Goals (2015)&lt;/h4&gt;
  &lt;p&gt;“2015 – Time for global action for people and planet”. The SDGs “provide a powerful aspiration for improving our world”. Slide 23 states it clearly: &lt;b&gt;“The call for action is a call to assume a responsibility”&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;sdg&quot; id=&quot;sdg&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;ext&quot;&gt;17 goals and 169 targets adopted by the General Assembly in resolution A/RES/70/1 “Transforming our world: the 2030 Agenda for Sustainable Development” (25–27 September 2015), to be achieved by 2030. &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN text (PDF)&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What are the three key elements of the 2001 EU definition and what do they imply?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Integration into operations (a holistic, not episodic, approach); a voluntary basis (beyond the law); interaction with stakeholders (stakeholder approach).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;On which issues did the Lisbon Council (2000) call for companies&#x27; commitment?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lifelong learning, work organisation, equal opportunities, social inclusion, sustainable development.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Into which four areas are the Global Compact principles divided?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Human rights, labour, environment, anti-corruption.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why are the SDGs relevant to CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the &lt;i&gt;call for action&lt;/i&gt; is a call to &lt;b&gt;assume a responsibility&lt;/b&gt; — a &lt;i&gt;responsibility to&lt;/i&gt; that is also addressed to companies.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; The motivations &lt;span class=&quot;slides&quot;&gt;slides 25–27&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Why do companies adopt CSR?&lt;/h2&gt;
  &lt;p&gt;“Please, think and share!” Organisations implement CSR policies for various reasons, often in combination (“and/or”). Each reason anticipates one of the four groups of theories:&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Reason (slide 26)&lt;/th&gt;&lt;th&gt;Label&lt;/th&gt;&lt;th&gt;Group of theories&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;They hope to improve their economic performance&lt;/td&gt;&lt;td&gt;strategical reasons&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s5&quot; style=&quot;color:var(--ochre)&quot;&gt;I · Instrumental&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;They recognise their role in society as a political actor&lt;/td&gt;&lt;td&gt;role into society&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s6&quot; style=&quot;color:var(--slate)&quot;&gt;II · Political&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;They want to integrate the expectations of different stakeholders into their objectives, for ethical or instrumental reasons&lt;/td&gt;&lt;td&gt;integrate&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s7&quot; style=&quot;color:var(--sage)&quot;&gt;III · Integrative&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;They hold ethical values or beliefs that impose social responsibilities&lt;/td&gt;&lt;td&gt;ethical foundation&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s8&quot; style=&quot;color:var(--brick)&quot;&gt;IV · Ethical&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;In summary (slide 27):&lt;/b&gt; CSR is a &lt;i&gt;tricky&lt;/i&gt; concept, difficult to define, and broad. &lt;b&gt;The definition and scope of the concept depend on the role of business in society.&lt;/b&gt; The next step: analysing the theories according to &lt;i&gt;how the interaction between business and society is focused&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;A company integrates its customers&#x27; environmental expectations “because otherwise it will lose them”. Ethical or instrumental reason?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Instrumental: stakeholder expectations may be integrated for ethical &lt;i&gt;or&lt;/i&gt; instrumental reasons (slide 26). Here the motive is economic performance.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;According to the summary slide, what does the scope of the CSR concept depend on?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;On the role attributed to business in society.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt; A map of the territory &lt;span class=&quot;slides&quot;&gt;slides 28–30&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Garriga &amp;amp; Melé (2004): four families of theories&lt;/h2&gt;
  &lt;blockquote&gt;“…our aim here is to map the territory in which most relevant CSR theories and related approaches are situated. We will do so by considering each theory from the perspective of how the interaction phenomena between business and society are focused.”&lt;cite&gt;Garriga &amp;amp; Melé, 2004, &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53 · slides 28–29&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;The classification criterion is not “how much” the company is responsible, but &lt;b&gt;which aspect of the business–society interaction&lt;/b&gt; the theory emphasises. To identify these aspects, the authors start from the sociologist &lt;b&gt;Talcott Parsons&lt;/b&gt; (the slides write “Parson”, 1961).&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;Parsons argues that every social system, in order to survive, must solve four functional problems, known by the acronym &lt;b&gt;AGIL&lt;/b&gt;: &lt;b&gt;A&lt;/b&gt;daptation (obtaining resources from the environment), &lt;b&gt;G&lt;/b&gt;oal attainment (setting and achieving goals, i.e. politics), &lt;b&gt;I&lt;/b&gt;ntegration (holding the parts together, social cohesion), &lt;b&gt;L&lt;/b&gt;atency or pattern maintenance (preserving culture and values). These are exactly the four “Group” headings on slides 31, 38, 50 and 60.&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Correspondence between Parsons&#x27; four aspects and the four groups of theories&quot;&gt;
      &lt;g style=&quot;font-family:var(--sans)&quot;&gt;

        &lt;rect x=&quot;325&quot; y=&quot;10&quot; width=&quot;305&quot; height=&quot;150&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;

        &lt;text x=&quot;30&quot; y=&quot;42&quot; style=&quot;font:700 30px var(--serif);fill:var(--ochre)&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;40&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Adaptation to the environment&lt;/text&gt;

        &lt;text x=&quot;30&quot; y=&quot;235&quot; style=&quot;font:13px var(--sans);fill:var(--muted)&quot;&gt;aspect: social integration&lt;/text&gt;
        &lt;text x=&quot;30&quot; y=&quot;280&quot; style=&quot;font:600 19px var(--serif);fill:var(--sage)&quot;&gt;▶ Integrative theories&lt;/text&gt;
        &lt;text x=&quot;30&quot; y=&quot;305&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;integrating social demands&lt;/text&gt;

        &lt;text x=&quot;345&quot; y=&quot;235&quot; style=&quot;font:13px var(--sans);fill:var(--muted)&quot;&gt;aspect: culture and values (ethics)&lt;/text&gt;
        &lt;text x=&quot;345&quot; y=&quot;280&quot; style=&quot;font:600 19px var(--serif);fill:var(--brick)&quot;&gt;▶ Ethical theories&lt;/text&gt;
        &lt;text x=&quot;345&quot; y=&quot;305&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;“the right thing to do”&lt;/text&gt;
