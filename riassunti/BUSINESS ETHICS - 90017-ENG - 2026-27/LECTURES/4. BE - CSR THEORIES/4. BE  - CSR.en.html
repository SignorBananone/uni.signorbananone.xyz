    &lt;tr&gt;&lt;td style=&quot;color:var(--ochre)&quot;&gt;&lt;b&gt;I · Instrumental&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The company is an instrument for wealth creation; CSR is a means to profit&lt;/td&gt;&lt;td&gt;1.1 shareholder value · 1.2 competitive advantage · 1.3 cause-related marketing&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--slate)&quot;&gt;&lt;b&gt;II · Political&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The company&#x27;s social power entails responsibility in the political arena&lt;/td&gt;&lt;td&gt;2.1 corporate constitutionalism · 2.2 ISCT · 2.3 corporate citizenship&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--sage)&quot;&gt;&lt;b&gt;III · Integrative&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The company depends on society and must integrate its demands&lt;/td&gt;&lt;td&gt;3.1 issues management · 3.2 public responsibility · 3.3 stakeholder management · 3.4 CSP&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--brick)&quot;&gt;&lt;b&gt;IV · Ethical&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The business–society relationship is embedded with values; CSR is an ethical obligation&lt;/td&gt;&lt;td&gt;4.1 normative stakeholder theory · 4.2 universal rights · 4.3 sustainable development · 4.4 common good&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What criterion do Garriga &amp;amp; Melé use to classify the theories?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;How each theory focuses on the interaction phenomena between business and society.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Match Parsons&#x27; four aspects to the groups of theories.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Resources/economics (adaptation) → instrumental; politics (goal attainment) → political; social integration → integrative; culture and values (pattern maintenance) → ethical.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ I ============ --&gt;
&lt;section class=&quot;part p-ins&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;I&lt;/span&gt; Group I · Adaptation → resources and economics &lt;span class=&quot;slides&quot;&gt;slides 31–37&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Instrumental theories&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Instrumental theories&lt;/b&gt;: the company is an instrument for wealth creation, and this is its &lt;b&gt;sole&lt;/b&gt; social responsibility. Only the economic aspect of the business–society interaction is considered: a social activity is accepted &lt;b&gt;if and only if&lt;/b&gt; it is consistent with wealth creation. &lt;br&gt;&lt;b&gt;CSR is a means to the end of profit&lt;/b&gt; (slide 32).&lt;/div&gt;

  &lt;h3&gt;“The business of business is business”&lt;/h3&gt;
  &lt;blockquote&gt;“The only one responsibility of business towards society is the maximization of profits to the shareholders within the legal framework and the ethical custom of the country”.&lt;cite&gt;Friedman, 1970 · slide 33&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;ext&quot;&gt;Milton Friedman&#x27;s essay appeared in the &lt;i&gt;New York Times Magazine&lt;/i&gt; on 13 September 1970 under the title “The Social Responsibility of Business Is to Increase Its Profits” and is regarded as the manifesto of &lt;i&gt;shareholder primacy&lt;/i&gt;. Key argument: only individuals have responsibilities; a manager who spends company funds for social purposes is “taxing” shareholders, customers or employees without a mandate. &lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Friedman doctrine (Wikipedia)&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;“Enlightened self-interest”: three approaches&lt;/h3&gt;
  &lt;p&gt;&lt;i class=&quot;en&quot;&gt;Enlightened self-interest&lt;/i&gt; is the idea that doing something good for society can be in the company&#x27;s own interest (slide 34).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1.1 Shareholder value&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;1.2 Competitive advantage&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;1.3 Cause-related marketing&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Focus on the share price&lt;/b&gt; → short-term profit orientation.&lt;/p&gt;
      &lt;blockquote&gt;Any investment in social demands that would produce an increase of the shareholder value should be made, acting without deception and fraud. In contrast, if the social demands only impose a cost on the company they should be rejected.&lt;cite&gt;slide 35&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;ul&gt;
        &lt;li&gt;Maximising shareholder value is the &lt;b&gt;supreme criterion&lt;/b&gt; for corporate decisions.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Agency Theory&lt;/b&gt; (Jensen &amp;amp; Meckling 1976; Ross 1973): shareholders (the &lt;i&gt;principal&lt;/i&gt;) entrust the company to managers (the &lt;i&gt;agent&lt;/i&gt;), who may pursue their own interests. Incentives and monitoring are needed to align them: &lt;dfn&gt;agency costs&lt;/dfn&gt; are the price of this misalignment. A “social” expenditure decided by the manager can be seen precisely as an agency cost.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;‘Enlightened value maximization’&lt;/b&gt; (Jensen 2000): the company&#x27;s &lt;i&gt;long-term&lt;/i&gt; value is maximised, and to do so stakeholders must be taken into account; but there is still a single decision criterion: value.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Focus on long-term profits&lt;/b&gt;. Three strands (slide 36):&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;&lt;b&gt;Social investments in competitive context&lt;/b&gt;: investing in the context in which the company competes (education, infrastructure, local suppliers) improves both society and competitiveness.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Natural resource-based view of the firm and its dynamic capabilities&lt;/b&gt;: competitive advantage arises from resources and capabilities that are hard to imitate; the relationship with the natural environment (pollution prevention, etc.) can generate them. &lt;i class=&quot;en&quot;&gt;Dynamic capabilities&lt;/i&gt; are the ability to reconfigure resources when the environment changes.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Strategies for the bottom of the economic pyramid&lt;/b&gt;: serving the billions of poorest people, a neglected market, with affordable products, generating both profit and development.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p class=&quot;ext&quot;&gt;The key authors are not in the slides but in Garriga &amp;amp; Melé&#x27;s article: (a) Porter &amp;amp; Kramer, &lt;i&gt;The Competitive Advantage of Corporate Philanthropy&lt;/i&gt;, HBR Dec. 2002 (&lt;a href=&quot;https://bc.edu/content/ccc/research-briefs/the-competitive-advantage-of-corporate-philanthropy.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Boston College summary&lt;/a&gt;); (b) Hart, &lt;i&gt;A Natural-Resource-Based View of the Firm&lt;/i&gt;, AMR 1995 (&lt;a href=&quot;https://www.uvm.edu/giee/pubpdfs/Hart_2011_Journal%20of%20Management.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Hart &amp;amp; Dowell 2011 review&lt;/a&gt;): three strategies, pollution prevention, product stewardship, sustainable development; (c) Prahalad &amp;amp; Hammond, &lt;i&gt;Serving the World&#x27;s Poor, Profitably&lt;/i&gt;, HBR 2002 (&lt;a href=&quot;https://en.wikipedia.org/wiki/Bottom_of_the_pyramid&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bottom of the pyramid&lt;/a&gt;; a contested thesis, e.g. by Karnani 2007).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;A particular form of marketing based on &lt;b&gt;cooperation between a for-profit company and a nonprofit organisation&lt;/b&gt; for mutual benefit (slide 37).&lt;/p&gt;
      &lt;blockquote&gt;“The brand manager uses consumer concern for business responsibility as a means for securing competitive advantage. At the same time a charitable cause receives substantial financial benefits”&lt;cite&gt;Smith &amp;amp; Higgins, 2000, p. 309&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;div class=&quot;note&quot;&gt;Typical example: “for every pack sold we donate 10 cents to an NGO”. The company differentiates its brand and increases sales; the cause receives funds. It is instrumental because the social cause is chosen and measured on the basis of its commercial return.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lab: does a social investment pass the instrumental test?&lt;/h3&gt;
  &lt;p&gt;Simplified model (cumulative values, no discounting): an initiative costs &lt;i&gt;C&lt;/i&gt; up front and generates an annual benefit &lt;i&gt;B&lt;/i&gt; for the company (reputation, sales, more qualified staff). Move the sliders and compare the short-term perspective (1.1, share price at 1 year) with the long-term one (1.2).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ic&quot;&gt;Initial cost &lt;i&gt;C&lt;/i&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ic&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;icv&quot;&gt;60&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ib&quot;&gt;Annual benefit &lt;i&gt;B&lt;/i&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ib&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;ibv&quot;&gt;12&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ih&quot;&gt;Time horizon (years)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ih&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;ihv&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;ichart&quot; viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Cumulative value of the social investment over time&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;verdict&quot;&gt;&lt;div id=&quot;iv1&quot;&gt;&lt;/div&gt;&lt;div id=&quot;iv2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Interpretation: for instrumental theories the question is not “is it right?” but “does it create shareholder value?”. The same project may be rejected from a short-term perspective and accepted from a long-term one.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · group I&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to instrumental theories, when is a social activity acceptable?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If and only if it is consistent with wealth creation for the company (CSR as a means to profit).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What distinguishes 1.1 from 1.2?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;1.1 looks at shareholder value and the share price (short term); 1.2 at strategies for competitive advantage and long-term profits.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does agency theory say and how does it relate to CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It studies the relationship between shareholders (principal) and managers (agent), whose interests may diverge. From an instrumental perspective, social action decided by the manager is justified only if it serves shareholder value; otherwise it is an agency cost.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Define cause-related marketing.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Cooperation between a for-profit company and a nonprofit organisation for mutual benefit: the brand gains competitive advantage by leveraging consumer concern, and the cause receives funds (Smith &amp;amp; Higgins 2000).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ II ============ --&gt;
&lt;section class=&quot;part p-pol&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;II&lt;/span&gt; Group II · Goal attainment → politics &lt;span class=&quot;slides&quot;&gt;slides 38–49&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Political theories&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Political theories&lt;/b&gt;: the focus is on the company&#x27;s &lt;b&gt;social power&lt;/b&gt; in its relationship with society, and on its responsibility in the political arena associated with that power. It follows that the company accepts social duties and rights or participates in certain forms of social cooperation (slide 39).&lt;/div&gt;

  &lt;h3&gt;2.1 Corporate constitutionalism (Davis)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;The social power equation&lt;/span&gt;&lt;p&gt;&lt;i&gt;“Social responsibilities of businessmen arise from the amount of social power that they have”&lt;/i&gt; — Davis 1967, p. 48.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;More power → more responsibility.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;The iron law of responsibility&lt;/span&gt;&lt;p&gt;&lt;i&gt;“Whoever does not use his social power responsibly will lose it. In the long run those who do not use power in a manner which society considers responsible will tend to lose it because other groups eventually will step in to assume those responsibilities”&lt;/i&gt; — Davis 1960, p. 63.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;It is called &lt;i&gt;constitutionalism&lt;/i&gt; because, just as a constitution limits the power of the state, social forces (governments, trade unions, consumers, public opinion) &lt;b&gt;limit and constrain&lt;/b&gt; the company&#x27;s power: if the company abuses it, other actors take it away, for instance through new legislation.&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Lab · iron law.&lt;/b&gt; Set how much social power a company has and how much responsibility it actually exercises:&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dp&quot;&gt;Social power&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;dpv&quot;&gt;70&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dr&quot;&gt;Responsible use&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;drv&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;dchart&quot; viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Comparison between expected and exercised responsibilities&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;pane&quot; id=&quot;dmsg&quot; style=&quot;background:var(--slate-bg)&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Example · slide 42&lt;/span&gt;&lt;p&gt;&lt;b&gt;“Merkel to industry: ‘Support refugees!’”&lt;/b&gt; (2015). At the opening of the IAA motor show in Frankfurt, the German Chancellor asked the car industry to offer vocational training and jobs to refugees: their integration requires everyone&#x27;s support.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Interpretation: a large industrial sector has enormous social power (employment, training); this is why politics asks it to take on public responsibilities. It is the social power equation seen from the side of expectations.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;2.2 Integrative social contract theory (ISCT)&lt;/h3&gt;
  &lt;p&gt;Social responsibilities derive from &lt;b&gt;consent&lt;/b&gt; (Donaldson &amp;amp; Dunfee 1991). Two levels of consent (slide 43):&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;ISCT: theoretical macrosocial contract with hypernorms and actual microsocial contracts of communities&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;620&quot; height=&quot;230&quot; rx=&quot;18&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;40&quot; style=&quot;font:600 16px var(--serif);fill:var(--slate)&quot;&gt;Macrosocial contract — theoretical&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;60&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;what all rational contractors would agree on → Hyper-norms (e.g. fundamental human rights)&lt;/text&gt;
      &lt;g style=&quot;font:12px var(--sans)&quot;&gt;
        &lt;rect x=&quot;40&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;rect x=&quot;235&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;rect x=&quot;430&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;125&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;community A (e.g. a country)&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;community B (e.g. an industry)&lt;/text&gt;
        &lt;text x=&quot;515&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;community C (e.g. a company)&lt;/text&gt;
        &lt;text x=&quot;125&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;actual local norms&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;actual local norms&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;actual local norms&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;local norms are valid if they do not contradict the hypernorms&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The macrosocial contract is hypothetical and universal; microsocial contracts are actual agreements, implicit or explicit, among members of localised communities.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;In the extended version (Donaldson &amp;amp; Dunfee, &lt;i&gt;Toward a Unified Conception of Business Ethics: Integrative Social Contracts Theory&lt;/i&gt;, AMR 19(2), 1994, pp. 252–284) the theory combines sensitivity to cultural contexts with cross-cultural norms through three concepts: &lt;i&gt;authentic norms&lt;/i&gt; (the genuine norms of communities), &lt;i&gt;priority rules&lt;/i&gt; (rules for resolving conflicts) and &lt;i&gt;hypernorms&lt;/i&gt;. The authors later developed it in the book &lt;i&gt;Ties That Bind&lt;/i&gt; (1999). &lt;a href=&quot;https://link.springer.com/article/10.1023/A:1006154819742&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Critical discussion on Springer&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;2.3 Corporate citizenship&lt;/h3&gt;
  &lt;p&gt;A concept that emerged in the 1980s within companies, with three connotations: a &lt;b&gt;sense of belonging&lt;/b&gt; to a community; &lt;b&gt;partnership&lt;/b&gt; (a willingness to improve the local community); &lt;b&gt;concern for the environment&lt;/b&gt;. Later developments lead &lt;b&gt;from local to global citizenship&lt;/b&gt; (slide 44).&lt;/p&gt;
  &lt;p&gt;“Corporate citizenship” does not mean the same thing to everyone. Matten et al. (2003) distinguish three views (slides 45–47):&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;(1) Limited view&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;(2) Equivalent to CSR&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;(3) Extended view&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;A usage close to &lt;b&gt;corporate philanthropy&lt;/b&gt;, social investment or certain responsibilities towards the &lt;b&gt;local community&lt;/b&gt;. E.g. sponsoring the local sports team, donating to the senior citizens&#x27; centre.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;A very widespread view. &lt;b&gt;Carroll (1999)&lt;/b&gt;: corporate citizenship appears to be a new conceptualisation of the role of business in society but, depending on how it is defined, it largely overlaps with other theories of corporate responsibility. In practice: a new name for CSR.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Advocated by Matten et al. (2003) and Matten &amp;amp; Crane (2010): companies &lt;b&gt;enter the arena of citizenship at the point where government fails&lt;/b&gt; to protect it. Some companies have gradually replaced the most powerful institution of traditional citizenship: government.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;In the extended view, companies partly take on the functions of &lt;b&gt;protecting, facilitating and enabling&lt;/b&gt; citizens&#x27; rights (slides 48–49). Click on each type of right:&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;div&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r1&quot;&gt;Social rights&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r2&quot;&gt;Civil rights&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r3&quot;&gt;Political rights&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;r0&quot;&gt;The three types of citizenship rights.&lt;/div&gt;
      &lt;div data-k=&quot;r1&quot; hidden&gt;&lt;b&gt;Social rights&lt;/b&gt; (education, health, work, welfare): the company &lt;i&gt;provides&lt;/i&gt; what the state does not guarantee. Examples from the slides: feeding the homeless, helping head teachers manage school budgets, improving the employability of the unemployed, regenerating run-down neighbourhoods.&lt;/div&gt;
      &lt;div data-k=&quot;r2&quot; hidden&gt;&lt;b&gt;Civil rights&lt;/b&gt; (freedom, property, justice): government failure is particularly visible in developing or transition countries. Companies can discourage or encourage governments to meet their responsibilities. &lt;br&gt;– Negative case: &lt;b&gt;Shell in Nigeria&lt;/b&gt; and its apparent role in restricting the civil rights of the &lt;b&gt;Ogoni&lt;/b&gt; people. &lt;br&gt;– Positive case: the role of &lt;b&gt;General Motors in South Africa&lt;/b&gt;.&lt;/div&gt;
      &lt;div data-k=&quot;r3&quot; hidden&gt;&lt;b&gt;Political rights&lt;/b&gt; (participation): citizens&#x27; political action is directed at companies rather than governments: &lt;b&gt;boycotts, single-issue campaigns&lt;/b&gt; (&lt;i class=&quot;en&quot;&gt;single-issue campaigns&lt;/i&gt;), protests. The company becomes a channel for exercising citizenship.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Background to the two cases (not from the slides). GM in South Africa: the Reverend Leon Sullivan, a member of GM&#x27;s board, drew up the &lt;b&gt;Sullivan Principles&lt;/b&gt; in 1977, a code of conduct for US companies operating in apartheid South Africa, later expanded into the &lt;b&gt;Global Sullivan Principles&lt;/b&gt; (1999), which you will find among the &lt;a href=&quot;#s8&quot;&gt;universal rights&lt;/a&gt;. &lt;a href=&quot;https://en.wikipedia.org/wiki/Sullivan_principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sullivan principles (Wikipedia)&lt;/a&gt;. On the theoretical level, Matten &amp;amp; Crane define corporate citizenship as the &lt;i&gt;administration&lt;/i&gt; of the social, civil and political rights traditionally guaranteed by governments: &lt;i&gt;Corporate Citizenship: Toward an Extended Theoretical Conceptualization&lt;/i&gt;, AMR 30(1), 2005 (&lt;a href=&quot;https://researchportal.bath.ac.uk/en/publications/corporate-citizenship-toward-an-extended-theoretical-conceptualiz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Bath&lt;/a&gt;).&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Videos cited in the slides (Jeremy Moon): “Corporate Citizenship” &lt;a href=&quot;https://www.youtube.com/watch?v=hDk21vU3sZk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=hDk21vU3sZk&lt;/a&gt; · “Usefulness of Corporate Citizenship Concept” &lt;a href=&quot;https://www.youtube.com/watch?v=FyuASCknXMk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=FyuASCknXMk&lt;/a&gt; · “Corporations Provide Arena for Human Citizenship” &lt;a href=&quot;https://www.youtube.com/watch?v=fW-xRbcT3u0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=fW-xRbcT3u0&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · group II&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;State the social power equation and the iron law of responsibility.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Equation: social responsibilities arise from the amount of social power (Davis 1967). Iron law: whoever does not use their social power responsibly will lose it, because other groups will take over those responsibilities (Davis 1960).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the two levels of consent in ISCT?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A theoretical macrosocial contract that applies to all rational contractors (hypernorms) and actual microsocial contracts among members of localised communities.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Distinguish the three views of corporate citizenship.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Limited (philanthropy, social investment, local community); equivalent to CSR (Carroll 1999); extended (companies enter citizenship where government fails, administering social, civil and political rights).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A boycott of a fashion brand over factory conditions: what type of citizenship right is at stake?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Political rights: citizens&#x27; political action is directed at the company rather than at the government.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ III ============ --&gt;
&lt;section class=&quot;part p-int&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;III&lt;/span&gt; Group III · Social integration &lt;span class=&quot;slides&quot;&gt;slides 50–59&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Integrative theories&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Integrative theories&lt;/b&gt;: the company depends on society for its continuity, its growth and even its existence; this is why it &lt;b&gt;must integrate social demands&lt;/b&gt; (slide 51).&lt;/div&gt;
  &lt;blockquote&gt;“Social responsibilities mean that businessmen should oversee the operation of an economic system that fulfills the expectations of the public”.&lt;cite&gt;Frederick, 1960 · slide 51&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Social demands and expectations are the way in which society interacts with the company and grants it &lt;dfn&gt;legitimacy&lt;/dfn&gt;:&lt;/p&gt;
  &lt;blockquote&gt;“generalized perception or assumption that the actions of an entity are desirable, proper, or appropriate within some socially constructed system of norms, values, beliefs, and definitions”&lt;cite&gt;Suchman, 1995, p. 574 · slide 52&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In essence: &lt;b&gt;public approval&lt;/b&gt;. The company must therefore integrate social demands so that its conduct appears aligned with society&#x27;s values and needs.&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;Suchman (AMR 20(3), 1995) distinguishes three types of legitimacy: &lt;b&gt;pragmatic&lt;/b&gt; (based on the audience&#x27;s self-interest), &lt;b&gt;moral&lt;/b&gt; (normative approval), &lt;b&gt;cognitive&lt;/b&gt; (the organisation is comprehensible and taken for granted), and discusses how to gain, maintain and repair it. &lt;a href=&quot;https://en.wikipedia.org/wiki/Mark_C._Suchman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mark C. Suchman (Wikipedia)&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;3.1 Issues management&lt;/h3&gt;
  &lt;p&gt;&lt;b&gt;Social responsiveness&lt;/b&gt; (Sethi 1975; an approach that emerged in the 1970s): what matters is the &lt;b&gt;gap&lt;/b&gt; between the performance that relevant publics expect from the organisation and its actual performance. The company must perceive this gap, the &lt;i class=&quot;en&quot;&gt;zone of discretion&lt;/i&gt;, and choose a response to close it (Ackerman &amp;amp; Bauer 1976).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Issues management&lt;/b&gt;: the &lt;b&gt;processes&lt;/b&gt; by which the company identifies, evaluates and responds to the social and political issues that may have a significant impact on it (&lt;i class=&quot;en&quot;&gt;“process of institutionalization”&lt;/i&gt;, i.e. embedding the response stably within the organisation).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ge&quot;&gt;Performance expected by publics&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ge&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;75&quot;&gt;&lt;output id=&quot;gev&quot;&gt;75&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ga&quot;&gt;Actual performance&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ga&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;gav&quot;&gt;45&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;gchart&quot; viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Gap between expected and actual performance&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;pane&quot; id=&quot;gmsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stepper card&quot; data-stepper&gt;
    &lt;div class=&quot;eyebrow&quot; style=&quot;color:var(--sage)&quot;&gt;The issues management cycle · step through&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Identify&lt;/h4&gt;&lt;p&gt;Scan the environment: which social or political issues are emerging? (e.g. single-use plastics, wages in the supply chain, data privacy).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Evaluate&lt;/h4&gt;&lt;p&gt;How much could the issue affect the company? How wide is the gap between expectations and performance?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Respond&lt;/h4&gt;&lt;p&gt;Choose a response to close the gap: change the product or process, engage in dialogue with stakeholders, communicate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Institutionalise&lt;/h4&gt;&lt;p&gt;Turn the response into routine: responsibilities, procedures, indicators. This way the company does not have to “chase” every crisis.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;→&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;3.2 The principle of public responsibility&lt;/h3&gt;
  &lt;p&gt;According to &lt;b&gt;Preston &amp;amp; Post (1981)&lt;/b&gt;, appropriate guidelines for legitimate managerial behaviour are to be found within the framework of relevant &lt;b&gt;public policy&lt;/b&gt;, where:&lt;/p&gt;
  &lt;blockquote&gt;“Public policy includes not only the literal text of law and regulation but also the broad pattern of social direction reflected in public opinion, emerging issues, formal legal requirements and enforcement or implementation practices”.&lt;cite&gt;slide 55&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;They choose the term &lt;b&gt;“public”&lt;/b&gt; rather than “social” to stress the importance of the &lt;b&gt;public process&lt;/b&gt;, rather than personal moral views or narrow interest groups, in defining the scope of responsibilities.&lt;/p&gt;

  &lt;h3&gt;3.3 Stakeholder management&lt;/h3&gt;
  &lt;p&gt;It seeks to integrate into managerial decisions the groups that have a &lt;i class=&quot;en&quot;&gt;stake&lt;/i&gt; in the company. &lt;b&gt;Stakeholders&lt;/b&gt; = persons or groups that affect or are affected by the company&#x27;s policies and practices (slide 56).&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;The slide refers back to previous lectures on stakeholder theory. A difference to bear in mind: here stakeholders are &lt;i&gt;managed&lt;/i&gt; because the company depends on them (integrative perspective); in &lt;a href=&quot;#s8&quot;&gt;normative stakeholder theory&lt;/a&gt; their interests have &lt;i&gt;intrinsic value&lt;/i&gt; (ethical perspective).&lt;/p&gt;

  &lt;h3&gt;3.4 Corporate social performance (CSP)&lt;/h3&gt;
  &lt;p&gt;&lt;b&gt;Carroll (1979, 1991)&lt;/b&gt; and the “Pyramid of Corporate Social Responsibilities”. Carroll&#x27;s &lt;i&gt;corporate performance model&lt;/i&gt; combines: a) a basic definition of social responsibility; b) a list of issues; c) the philosophy of response (slides 57–58). Click on the levels of the pyramid:&lt;/p&gt;
  &lt;div data-picker class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 300&quot; role=&quot;img&quot; aria-label=&quot;Carroll&#x27;s pyramid&quot;&gt;
      &lt;g data-k=&quot;c4&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M140 20H200L225 85H115Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 12px var(--sans);fill:var(--paper)&quot;&gt;Philanthropic&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c3&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M113 90H227L252 155H88Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--paper)&quot;&gt;Ethical&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c2&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M86 160H254L279 225H61Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.5&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Legal&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c1&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M59 230H281L306 295H34Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.3&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Economic&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;c0&quot;&gt;Click a level (from the bottom up).&lt;/div&gt;
      &lt;div data-k=&quot;c1&quot; hidden&gt;&lt;b&gt;Economic responsibilities&lt;/b&gt; — &lt;i&gt;Be profitable.&lt;/i&gt; The foundation on which all the others rest. A company that cannot stand on its own feet cannot be responsible for anything.&lt;/div&gt;
      &lt;div data-k=&quot;c2&quot; hidden&gt;&lt;b&gt;Legal responsibilities&lt;/b&gt; — &lt;i&gt;Obey the law.&lt;/i&gt; Law is society&#x27;s codification of right and wrong: playing by the rules of the game.&lt;/div&gt;
      &lt;div data-k=&quot;c3&quot; hidden&gt;&lt;b&gt;Ethical responsibilities&lt;/b&gt; — &lt;i&gt;Be ethical.&lt;/i&gt; The obligation to do what is right, just and fair; to avoid harm, even where the law does not reach.&lt;/div&gt;
      &lt;div data-k=&quot;c4&quot; hidden&gt;&lt;b&gt;Philanthropic responsibilities&lt;/b&gt; — &lt;i&gt;Be a good corporate citizen.&lt;/i&gt; Contributing resources to the community, improving quality of life.&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:.6rem&quot;&gt;External source: Carroll (1991, &lt;i&gt;Business Horizons&lt;/i&gt; 34, pp. 39–48) describes economic and legal responsibilities as &lt;i&gt;required&lt;/i&gt; by society, ethical ones as &lt;i&gt;expected&lt;/i&gt; and philanthropic ones as &lt;i&gt;desired&lt;/i&gt;; in the 1979 model (AMR 4(4)) the fourth category was called &lt;i&gt;discretionary&lt;/i&gt; and the philosophy of response ranged from reactive to defensive, accommodative and proactive. &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Carroll&#x27;s Pyramid of CSR&lt;/a&gt; · &lt;a href=&quot;https://edisciplinas.usp.br/pluginfile.php/5095444/mod_resource/content/0/%5B1979%5D%20Carroll%20pyramid.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Carroll 1979 (PDF)&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Videos cited on slide 58: &lt;a href=&quot;https://www.youtube.com/watch?v=EjSlTfWxJKQ&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=EjSlTfWxJKQ&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=QqCAFScpFvY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=QqCAFScpFvY&lt;/a&gt;.&lt;/p&gt;

  &lt;h4&gt;Wood&#x27;s CSP model (1991)&lt;/h4&gt;
  &lt;div class=&quot;stepper card&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Principles of CSR&lt;/h4&gt;&lt;p&gt;Why the company is responsible: the underlying principles (slide 59).&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;External source: Wood sets them out at three levels, &lt;b&gt;legitimacy&lt;/b&gt; (institutional), &lt;b&gt;public responsibility&lt;/b&gt; (organisational, cf. Preston &amp;amp; Post) and &lt;b&gt;managerial discretion&lt;/b&gt; (individual): the same three levels as on &lt;a href=&quot;#s1&quot;&gt;slide 14&lt;/a&gt;. Wood, &lt;i&gt;Corporate Social Performance Revisited&lt;/i&gt;, AMR 16(4), 1991 — &lt;a href=&quot;https://scholarworks.uni.edu/facpub/2123&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;record&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Processes of corporate social responsiveness&lt;/h4&gt;&lt;p&gt;How the company responds: &lt;b&gt;environmental assessment&lt;/b&gt;, &lt;b&gt;stakeholder management&lt;/b&gt;, &lt;b&gt;issues management&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Outcomes of corporate behavior&lt;/h4&gt;&lt;p&gt;What it produces: &lt;b&gt;social impacts&lt;/b&gt;, &lt;b&gt;social programmes&lt;/b&gt;, &lt;b&gt;social policies&lt;/b&gt;. This is what can be observed and measured.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;→&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;CSP is where the integrative theories “come full circle”: principles (why) → processes (how) → outcomes (what). Note that issues management and stakeholder management, previously seen as standalone approaches, here become &lt;i&gt;processes&lt;/i&gt; within a single model.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · group III&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to integrative theories, why must the company respond to social demands?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it depends on society for its continuity, growth and existence; society grants it legitimacy (public approval) if its conduct appears aligned with society&#x27;s values and needs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the “zone of discretion”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The gap between the performance expected by relevant publics and the company&#x27;s actual performance; the company must perceive it and choose a response to close it (Ackerman &amp;amp; Bauer 1976).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why do Preston &amp;amp; Post speak of “public” rather than “social” responsibility?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;To emphasise the public process (laws, public opinion, emerging issues, enforcement practices) rather than personal moral views or those of narrow groups.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;List the levels of Carroll&#x27;s pyramid from the bottom up.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Economic (be profitable), legal (obey the law), ethical (be ethical), philanthropic (be a good corporate citizen).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three components of Wood&#x27;s model?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Principles of CSR; processes of social responsiveness (environmental assessment, stakeholder management, issues management); outcomes (social impacts, programmes, policies).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ IV ============ --&gt;
&lt;section class=&quot;part p-eth&quot; id=&quot;s8&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;IV&lt;/span&gt; Group IV · Pattern maintenance → culture and values &lt;span class=&quot;slides&quot;&gt;slides 60–67&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Ethical theories&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethical theories&lt;/b&gt;: the relationship between business and society is embedded with ethical values. This leads to a view of CSR in which companies ought to accept social responsibilities as an &lt;b&gt;ethical obligation, above any other consideration&lt;/b&gt;. &lt;br&gt;&lt;b&gt;The right thing to do!&lt;/b&gt; (slide 61)&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;The contrast with Group I is stark: there CSR is pursued &lt;i&gt;if it pays&lt;/i&gt;, here it is pursued &lt;i&gt;because it is right&lt;/i&gt;, even if it is costly. In the &lt;a href=&quot;#s5&quot;&gt;instrumental lab&lt;/a&gt;, a project with negative value would be rejected; for ethical theories it might be a duty.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;4.1 Normative stakeholder&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.2 Universal rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.3 Sustainable development&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.4 Common good&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Freeman (1984)&lt;/b&gt;: &lt;i&gt;“managers bear a fiduciary duty to stakeholders”&lt;/i&gt;: managers have a fiduciary duty towards all stakeholders, not only towards shareholders.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Donaldson &amp;amp; Preston (1995)&lt;/b&gt;:&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Stakeholders are &lt;b&gt;persons or groups with legitimate interests&lt;/b&gt; in procedural and/or substantive aspects of corporate activity: they are identified by &lt;i&gt;their&lt;/i&gt; interests in the company, whether or not the company has any corresponding functional interest in them.&lt;/li&gt;
        &lt;li&gt;The interests of all stakeholders are of &lt;b&gt;intrinsic value&lt;/b&gt;: each group merits consideration for its own sake, not merely because it serves the interests of some other group, such as shareholders.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p style=&quot;font:italic 1.1rem var(--serif);color:var(--brick)&quot;&gt;“Stakeholders with names, faces, and… families”&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;Donaldson &amp;amp; Preston (AMR 20(1), 1995, pp. 65–91) distinguish three uses of stakeholder theory: &lt;b&gt;descriptive&lt;/b&gt; (what the company is like), &lt;b&gt;instrumental&lt;/b&gt; (what pays off), &lt;b&gt;normative&lt;/b&gt; (what ought to be done), and argue that the normative basis is fundamental. This is the key to understanding why stakeholder management appears in Group III and normative stakeholder theory in Group IV. &lt;a href=&quot;https://www.proquest.com/docview/210948648&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ProQuest record&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Initiatives that set standards of responsibility based on human rights (slide 64):&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;UN Global Compact&lt;/b&gt; — the 10 principles seen in &lt;a href=&quot;#s2&quot;&gt;section 2&lt;/a&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;The Global Sullivan Principles&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;SA8000&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;…&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;All based on the Universal Declaration of Human Rights.&lt;/b&gt;&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;Global Sullivan Principles: presented at the UN on 2 November 1999 by Leon Sullivan together with Kofi Annan, they extend the 1977 code on apartheid: human rights, equal opportunities, freedom of association, rejection of bribery (&lt;a href=&quot;https://nautilus.org/projects/cap/the-global-sullivan-principles-february-1-1999/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text&lt;/a&gt;). SA8000: a certifiable standard by Social Accountability International (1997; current edition SA8000:2014) on working conditions, with a management system for continuous improvement (&lt;a href=&quot;https://en.wikipedia.org/wiki/SA8000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SA8000&lt;/a&gt;). Universal Declaration: adopted by the UN General Assembly on 10 December 1948, res. 217 A (III) (&lt;a href=&quot;https://www.coe.int/en/web/gender-matters/the-universal-declaration-of-human-rights&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text, Council of Europe&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;blockquote&gt;“Sustainable development seeks to meet the needs and aspirations of the present without compromising the ability to meet those of the future”.&lt;cite&gt;World Commission on Environment and Development – Brundtland Report, 1987, p. 40 · slide 65&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;The company also has responsibilities towards &lt;b&gt;future generations&lt;/b&gt;: the resources it consumes today are not its alone. Slide 66 refers again to the UN SDGs.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 520 200&quot; role=&quot;img&quot; aria-label=&quot;Sustainable development as a balance between present and future&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;150&quot; x2=&quot;480&quot; y2=&quot;150&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;path d=&quot;M260 150L240 185H280Z&quot; fill=&quot;var(--brick)&quot;/&gt;
          &lt;line x1=&quot;70&quot; y1=&quot;150&quot; x2=&quot;450&quot; y2=&quot;150&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;4&quot;/&gt;
          &lt;rect x=&quot;70&quot; y=&quot;80&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Present&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;needs and aspirations&lt;/text&gt;
          &lt;rect x=&quot;300&quot; y=&quot;80&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;375&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Future&lt;/text&gt;&lt;text x=&quot;375&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;ability to meet them&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font:italic 15px var(--serif);fill:var(--ink)&quot;&gt;“…without compromising…”&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;ext&quot;&gt;The report &lt;i&gt;Our Common Future&lt;/i&gt; (World Commission on Environment and Development, chaired by Gro Harlem Brundtland) was transmitted to the General Assembly as document A/42/427 (4 August 1987). The slides write “Brutland”: the correct name is Brundtland. &lt;a href=&quot;https://digitallibrary.un.org/record/139811&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;blockquote&gt;“Business, as with any other social group or individual in society, has to contribute to the common good, because it is a part of society”.&lt;cite&gt;Garriga &amp;amp; Melé · slide 67&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;blockquote&gt;“Business should be neither harmful to nor a parasite on society, but purely a positive contributor to the wellbeing of the society.”&lt;cite&gt;Garriga &amp;amp; Melé · slide 67&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;The company is not an external actor that “gives back” something to society: &lt;b&gt;it is part of it&lt;/b&gt;, like a person or a family, and therefore participates in the &lt;dfn&gt;common good&lt;/dfn&gt;, the set of conditions that enable everyone to flourish.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · group IV&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What distinguishes ethical theories from instrumental ones?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;CSR is an ethical obligation above any other consideration (“the right thing to do”), not a means to profit.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are Donaldson &amp;amp; Preston&#x27;s (1995) two theses?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;(1) Stakeholders are identified by their legitimate interests in the company; (2) the interests of all stakeholders are of intrinsic value.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which document are the Global Compact, the Global Sullivan Principles and SA8000 based on?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The Universal Declaration of Human Rights.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Give the Brundtland Report&#x27;s definition of sustainable development.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Development that seeks to meet the needs and aspirations of the present without compromising the ability to meet those of the future (1987, p. 40).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SINTESI ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s9&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;∑&lt;/span&gt; The four theories and reality &lt;span class=&quot;slides&quot;&gt;slide 68&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Four interconnected dimensions&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Donati (1991)&lt;/b&gt; reinterprets Parsons (1961) and suggests that the four groups should be understood as &lt;b&gt;four interconnected dimensions present in every social phenomenon&lt;/b&gt;. Hence the business–society relationship, and with it CSR theories, must include all four dimensions, and some connection must (or at least should) exist among them.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 520 330&quot; role=&quot;img&quot; aria-label=&quot;The four connected dimensions around the business-society relationship&quot;&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M140 85L380 85M140 245L380 245M110 115L110 215M410 115L410 215M140 105L380 225M380 105L140 225&quot;/&gt;&lt;/g&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;165&quot; r=&quot;54&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;business&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;↔ society&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;profit&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Political&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;responsible power&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;215&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Integrative&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;social demands&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;215&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Ethical&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;values, common good&lt;/text&gt;
      &lt;text x=&quot;260&quot; y=&quot;315&quot; text-anchor=&quot;middle&quot; style=&quot;font:italic 13px var(--serif);fill:var(--muted)&quot;&gt;not four alternatives, but four facets of the same phenomenon&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;In their article, Garriga &amp;amp; Melé conclude that each theory privileges one dimension (profits, political performance, social demands, ethical values) and that a new theory capable of integrating all of them is needed. &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight, “Untangling CSR theories”&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Exercise: which group does it belong to?&lt;/h3&gt;
  &lt;p&gt;For each statement by a manager, choose the group of theories it best expresses.&lt;/p&gt;
  &lt;div id=&quot;classify&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot; id=&quot;clsScore&quot;&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · synthesis&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is Donati&#x27;s (1991) proposal?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;To read the four groups not as alternatives, but as four interconnected dimensions present in every social phenomenon: a sound theory of the business–society relationship must include all of them and connect them.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Possible exam question: “Why is CSR difficult to define, and how do Garriga &amp;amp; Melé classify it?”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Outline: an ambiguous, appraisive, open, multidisciplinary concept (slides 3–5); definitions depend on the role attributed to business (Crane et al.); Garriga &amp;amp; Melé classify by the focus of the business–society interaction, starting from Parsons&#x27; 4 aspects → 4 groups with examples (Friedman, Davis, Carroll/Wood, Freeman/Brundtland); conclusion with Donati.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part p-pol&quot; id=&quot;s10&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;+&lt;/span&gt; Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, texts, standards and websites cited in the slides&lt;/h2&gt;
  &lt;p&gt;Each card gives the reference as it appears in the slides &lt;span class=&quot;badge sl&quot;&gt;slide&lt;/span&gt; and the information verified through web searches &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;, with a link. Some bibliographic details differ between sources (e.g. page numbers): check them against the journal before citing them.&lt;/p&gt;
  &lt;div class=&quot;src&quot;&gt;
    &lt;article&gt;&lt;h4&gt;Bowen · &lt;i&gt;Social Responsibilities of the Businessman&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 6&lt;/span&gt; H.R. Bowen, 1953&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Regarded as the first comprehensive treatment of business ethics and social responsibility; reissued in 2013 by University of Iowa Press with an introduction by Jean-Pascal Gond. &lt;a href=&quot;https://muse.jhu.edu/book/29080&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project MUSE&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it marks the beginning of the modern CSR debate.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Friedman · NYT Magazine 1970&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 2, 33&lt;/span&gt; Friedman, 1970&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “The Social Responsibility of Business Is to Increase Its Profits”, 13 September 1970: only individuals have responsibilities; the company&#x27;s sole responsibility is profit within the rules of the game. &lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Friedman doctrine&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the reference point of the shareholder view and of instrumental theories.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Freeman · &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 2, 63&lt;/span&gt; Freeman, 1984&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Published by Pitman in 1984, reissued by Cambridge University Press in 2010 with a new preface. &lt;a href=&quot;https://www.cambridge.org/core/books/abs/strategic-management/preface-to-the-2010-reissue/100B5E83DA2414E84D15C83C0EC29C7B&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it founds stakeholder theory, the basis of stakeholder management and of its normative version.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Garriga &amp;amp; Melé · “CSR Theories: Mapping the Territory”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 28–30, 67&lt;/span&gt; &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53, 2004&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; JBE 53(1–2), pp. 51–71, DOI 10.1023/B:BUSI.0000039399.90587.34; reprinted among the journal&#x27;s &lt;i&gt;Citation Classics&lt;/i&gt; (2013). &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it provides the structure of the entire second part of the lecture.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Carroll · pyramid and three-dimensional model&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 46, 57–58&lt;/span&gt; Carroll 1979, 1991, 1999&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; 1979: “A Three-Dimensional Conceptual Model of Corporate Performance”, AMR 4(4), 497–505 (definition, issues, philosophy of response). 1991: “The pyramid of corporate social responsibility”, &lt;i&gt;Business Horizons&lt;/i&gt; 34, 39–48. &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open textbook explanation&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the most cited CSR model and the one most used in exams.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Wood · “Corporate Social Performance Revisited”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 57, 59&lt;/span&gt; Wood, 1991&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; AMR 16(4), October 1991, pp. 691–718: CSP as principles, processes of responsiveness, outcomes. &lt;a href=&quot;https://scholarworks.uni.edu/facpub/2123&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNI ScholarWorks&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it integrates issues management, stakeholder management and measurable outcomes into a single model.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Davis · social power and the iron law&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 41&lt;/span&gt; Davis 1960, 1967&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “Can Business Afford to Ignore Social Responsibilities?”, &lt;i&gt;California Management Review&lt;/i&gt;, 1960. The formulation of the iron law is also associated with Davis &amp;amp; Blomstrom&#x27;s book &lt;i&gt;Business, Society, and Environment&lt;/i&gt;. &lt;a href=&quot;https://cmr-mig.berkeley.edu/1960/05/2-3-can-business-afford-to-ignore-social-responsibilities&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CMR&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the basis of corporate constitutionalism.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Donaldson &amp;amp; Dunfee · ISCT&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 43&lt;/span&gt; Donaldson &amp;amp; Dunfee, 1991&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Reference version: AMR 19(2), 1994, pp. 252–284; then the book &lt;i&gt;Ties That Bind&lt;/i&gt; (1999). &lt;a href=&quot;https://link.springer.com/article/10.1023/A:1006154819742&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains how to reconcile universal norms and local norms.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Matten &amp;amp; Crane · extended corporate citizenship&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 45–49&lt;/span&gt; Matten et al. 2003; Matten &amp;amp; Crane 2010&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “Corporate Citizenship: Toward an Extended Theoretical Conceptualization”, AMR 30(1), 2005, pp. 166–179: the company as administrator of social, civil and political rights. &lt;a href=&quot;https://researchportal.bath.ac.uk/en/publications/corporate-citizenship-toward-an-extended-theoretical-conceptualiz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Bath&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the theoretical basis of the extended view.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Jensen &amp;amp; Meckling · agency theory&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 35&lt;/span&gt; Jensen &amp;amp; Meckling 1976; Ross 1973; Jensen 2000&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure”, &lt;i&gt;Journal of Financial Economics&lt;/i&gt; 3(4), 1976, pp. 305–360. &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it underpins the primacy of shareholder value.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Suchman · legitimacy&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 52&lt;/span&gt; Suchman 1995, p. 574&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “Managing Legitimacy: Strategic and Institutional Approaches”, AMR 20(3), 1995, pp. 571–610: pragmatic, moral and cognitive legitimacy. &lt;a href=&quot;https://en.wikipedia.org/wiki/Mark_C._Suchman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it provides the definition of legitimacy used by integrative theories.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Donaldson &amp;amp; Preston · stakeholder theory&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 63&lt;/span&gt; Donaldson &amp;amp; Preston 1995&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “The Stakeholder Theory of the Corporation: Concepts, Evidence, and Implications”, AMR 20(1), 65–91: descriptive, instrumental and normative uses. &lt;a href=&quot;https://en.wikipedia.org/wiki/Thomas_Donaldson_(ethicist)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Thomas Donaldson (Wikipedia)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it defines the normative (ethical) version of stakeholder theory.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Dahlsrud · 37 definitions of CSR&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 3&lt;/span&gt; Dahlsrud 2008&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;CSR and Environmental Management&lt;/i&gt; 15(1), 1–13: 5 recurring dimensions (environmental, social, economic, stakeholder, voluntariness); the confusion concerns how CSR is socially constructed in specific contexts more than how it is defined. &lt;a href=&quot;https://ideas.repec.org/a/wly/corsem/v15y2008i1p1-13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows the “jungle of definitions” empirically.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;European Commission · Green Paper and CSR strategy&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 15–19&lt;/span&gt; EU 2001, 2002, 2006, 2011&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Green Paper COM(2001) 366 of 18.7.2001; renewed strategy COM(2011) 681 of 25.10.2011. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/green-paper-on-corporate-social-responsibility.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex Green Paper&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex CSR in the EU&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the reference institutional definition in Europe.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;European Green Deal · NextGenerationEU&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 17, 20&lt;/span&gt; 2019, 2020&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Green Deal: COM(2019) 640, net-zero emissions by 2050. NextGenerationEU: Recovery and Resilience Facility, the basis of national recovery and resilience plans (PNRR in Italy). &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-green-deal.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://next-generation-eu.europa.eu/recovery-and-resilience-facility_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commission&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows sustainability at the centre of the political agenda.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;UN Global Compact&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 21–24, 64&lt;/span&gt; unglobalcompact.org&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; 10 principles on human rights, labour, environment and anti-corruption; a voluntary, non-regulatory initiative. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Ten Principles&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the most widespread voluntary global standard.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;2030 Agenda and SDGs&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 20, 23–24, 66&lt;/span&gt; un.org/sustainabledevelopment&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Resolution A/RES/70/1 (September 2015): 17 goals, 169 targets, by 2030. &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN text&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it translates sustainability into goals to which companies also contribute.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Brundtland Report · &lt;i&gt;Our Common Future&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 65&lt;/span&gt; WCED 1987, p. 40&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; UN document A/42/427; published by Oxford University Press in 1987. &lt;a href=&quot;https://digitallibrary.un.org/record/139811&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it contains the classic definition of sustainable development.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;SA8000 and Global Sullivan Principles&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 64&lt;/span&gt; universal rights&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; SA8000: a Social Accountability International standard (1997; 2014 edition) certified by accredited bodies. Global Sullivan Principles: presented at the UN on 2.11.1999. &lt;a href=&quot;https://en.wikipedia.org/wiki/SA8000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SA8000&lt;/a&gt; · &lt;a href=&quot;https://nautilus.org/projects/cap/the-global-sullivan-principles-february-1-1999/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sullivan Principles&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: concrete examples of standards grounded in human rights.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Porter &amp;amp; Kramer · Hart · Prahalad&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 36&lt;/span&gt; (authors implicit in points a–c)&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Porter &amp;amp; Kramer, HBR Dec. 2002; Hart, AMR 20(4), 1995; Prahalad &amp;amp; Hammond, HBR 2002. &lt;a href=&quot;https://bc.edu/content/ccc/research-briefs/the-competitive-advantage-of-corporate-philanthropy.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Porter &amp;amp; Kramer (BC)&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Bottom_of_the_pyramid&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bottom of the pyramid&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: they are the sources of the three competitive advantage strategies.&lt;/p&gt;&lt;/article&gt;
  &lt;/div&gt;
  &lt;details style=&quot;margin-top:1rem&quot;&gt;&lt;summary&gt;Other references cited in the slides (without a card)&lt;/summary&gt;&lt;div&gt;
    &lt;p class=&quot;small&quot;&gt;Smith &amp;amp; Langford 2009; van Marrewijk 2003; Vogel 1991; Votaw 1972–1973; Aguinis &amp;amp; Glavas 2012; Matten &amp;amp; Moon 2008; Moon, Crane &amp;amp; Matten 2005; Secchi 2007; Wood &amp;amp; Logsdon 2002; Crane, Matten &amp;amp; Spence 2008; Ross 1973; Jensen 2000; Smith &amp;amp; Higgins 2000; Frederick 1960; Sethi 1975; Ackerman &amp;amp; Bauer 1976; Preston &amp;amp; Post 1981; Parsons 1961; Donati 1991. Videos on slide 9: &lt;a href=&quot;https://www.youtube.com/watch?v=dA72LVsbPFM&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dA72LVsbPFM&lt;/a&gt;, &lt;a href=&quot;https://www.youtube.com/watch?v=ejgg7pm-7lE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ejgg7pm-7lE&lt;/a&gt;. Commission website cited on slide 16: ec.europa.eu/growth/industry/corporate-social-responsibility_en (historical address, may have changed).&lt;/p&gt;

&lt;script&gt;
(function(){

    }
    p.querySelectorAll(&#x27;[data-k]&#x27;).forEach(function(el){
      if(pane.contains(el))return;
      el.addEventListener(&#x27;click&#x27;,function(e){e.stopPropagation();show(el.getAttribute(&#x27;data-k&#x27;));});
      el.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();show(el.getAttribute(&#x27;data-k&#x27;));}});
    });
  });

  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){

    function go(n){i=Math.max(0,Math.min(steps.length-1,n));steps.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i);});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j===i);});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){go(i-1);});next.addEventListener(&#x27;click&#x27;,function(){go(i+1);});go(0);
  });
  // SDG grid
  var sdg=document.getElementById(&#x27;sdg&#x27;);
  if(sdg){var n=[&#x27;No poverty&#x27;,&#x27;Zero hunger&#x27;,&#x27;Good health and well-being&#x27;,&#x27;Quality education&#x27;,&#x27;Gender equality&#x27;,&#x27;Clean water and sanitation&#x27;,&#x27;Affordable and clean energy&#x27;,&#x27;Decent work and economic growth&#x27;,&#x27;Industry, innovation and infrastructure&#x27;,&#x27;Reduced inequalities&#x27;,&#x27;Sustainable cities and communities&#x27;,&#x27;Responsible consumption and production&#x27;,&#x27;Climate action&#x27;,&#x27;Life below water&#x27;,&#x27;Life on land&#x27;,&#x27;Peace, justice and strong institutions&#x27;,&#x27;Partnerships for the goals&#x27;];
    var c=[&#x27;#E5243B&#x27;,&#x27;#DDA63A&#x27;,&#x27;#4C9F38&#x27;,&#x27;#C5192D&#x27;,&#x27;#FF3A21&#x27;,&#x27;#26BDE2&#x27;,&#x27;#FCC30B&#x27;,&#x27;#A21942&#x27;,&#x27;#FD6925&#x27;,&#x27;#DD1367&#x27;,&#x27;#FD9D24&#x27;,&#x27;#BF8B2E&#x27;,&#x27;#3F7E44&#x27;,&#x27;#0A97D9&#x27;,&#x27;#56C02B&#x27;,&#x27;#00689D&#x27;,&#x27;#19486A&#x27;];
    n.forEach(function(t,i){var d=document.createElement(&#x27;div&#x27;);d.style.background=c[i];d.innerHTML=&#x27;&lt;b&gt;&#x27;+(i+1)+&#x27;&lt;/b&gt;&#x27;+t;if(i===6||i===10)d.style.color=&#x27;#1b1b1b&#x27;;sdg.appendChild(d);});}
  function $(id){return document.getElementById(id);}
  function bind(ids,fn){ids.forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,fn);});fn();}

    var C=+$(&#x27;ic&#x27;).value,B=+$(&#x27;ib&#x27;).value,H=+$(&#x27;ih&#x27;).value,s=$(&#x27;ichart&#x27;);

    [-100,0,100,200].forEach(function(v){s.appendChild(el(&#x27;text&#x27;,{x:42,y:y(v)+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},v));});
