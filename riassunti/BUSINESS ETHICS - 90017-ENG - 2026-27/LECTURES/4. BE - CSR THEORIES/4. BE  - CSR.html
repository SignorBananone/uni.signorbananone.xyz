    &lt;tr&gt;&lt;td style=&quot;color:var(--ochre)&quot;&gt;&lt;b&gt;I · Strumentali&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;impresa è uno strumento per creare ricchezza; la CSR è un mezzo per il profitto&lt;/td&gt;&lt;td&gt;1.1 shareholder value · 1.2 vantaggio competitivo · 1.3 cause-related marketing&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--slate)&quot;&gt;&lt;b&gt;II · Politiche&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Il potere sociale dell&#x27;impresa implica responsabilità nell&#x27;arena politica&lt;/td&gt;&lt;td&gt;2.1 corporate constitutionalism · 2.2 ISCT · 2.3 corporate citizenship&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--sage)&quot;&gt;&lt;b&gt;III · Integrative&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;impresa dipende dalla società e deve integrarne le domande&lt;/td&gt;&lt;td&gt;3.1 issues management · 3.2 public responsibility · 3.3 stakeholder management · 3.4 CSP&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td style=&quot;color:var(--brick)&quot;&gt;&lt;b&gt;IV · Etiche&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Il rapporto impresa–società è intriso di valori; la CSR è un obbligo etico&lt;/td&gt;&lt;td&gt;4.1 normative stakeholder theory · 4.2 universal rights · 4.3 sustainable development · 4.4 common good&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il criterio con cui Garriga &amp;amp; Melé classificano le teorie?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il modo in cui ciascuna teoria focalizza i fenomeni di interazione tra impresa e società.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Abbina i quattro aspetti di Parsons ai gruppi di teorie.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Resources/economics (adaptation) → strumentali; politics (goal attainment) → politiche; social integration → integrative; culture and values (pattern maintenance) → etiche.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ I ============ --&gt;
&lt;section class=&quot;part p-ins&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;I&lt;/span&gt; Group I · Adaptation → resources and economics &lt;span class=&quot;slides&quot;&gt;slide 31–37&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Teorie strumentali&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Instrumental theories&lt;/b&gt;: l&#x27;impresa è uno strumento per creare ricchezza e questa è la sua &lt;b&gt;unica&lt;/b&gt; responsabilità sociale. Si considera solo l&#x27;aspetto economico dell&#x27;interazione impresa–società: un&#x27;attività sociale è accettata &lt;b&gt;se e solo se&lt;/b&gt; è coerente con la creazione di ricchezza. &lt;br&gt;&lt;b&gt;CSR is a means to the end of profit&lt;/b&gt; (slide 32).&lt;/div&gt;

  &lt;h3&gt;“The business of business is business”&lt;/h3&gt;
  &lt;blockquote&gt;“The only one responsibility of business towards society is the maximization of profits to the shareholders within the legal framework and the ethical custom of the country”.&lt;cite&gt;Friedman, 1970 · slide 33&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;ext&quot;&gt;Il saggio di Milton Friedman uscì sul &lt;i&gt;New York Times Magazine&lt;/i&gt; il 13 settembre 1970 con il titolo “The Social Responsibility of Business Is to Increase Its Profits” ed è considerato il manifesto della &lt;i&gt;shareholder primacy&lt;/i&gt; (primato degli azionisti). Argomento chiave: solo le persone hanno responsabilità; il manager che spende i fondi dell&#x27;impresa per fini sociali “tassa” azionisti, clienti o dipendenti senza mandato. &lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Friedman doctrine (Wikipedia)&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;“Enlightened self-interest”: tre approcci&lt;/h3&gt;
  &lt;p&gt;L&#x27;&lt;i class=&quot;en&quot;&gt;enlightened self-interest&lt;/i&gt; (interesse personale “illuminato”) è l&#x27;idea che fare qualcosa di buono per la società possa essere nell&#x27;interesse dell&#x27;impresa stessa (slide 34).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1.1 Shareholder value&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;1.2 Competitive advantage&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;1.3 Cause-related marketing&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Focus sul prezzo dell&#x27;azione&lt;/b&gt; → orientamento al profitto di breve periodo.&lt;/p&gt;
      &lt;blockquote&gt;Any investment in social demands that would produce an increase of the shareholder value should be made, acting without deception and fraud. In contrast, if the social demands only impose a cost on the company they should be rejected.&lt;cite&gt;slide 35&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;ul&gt;
        &lt;li&gt;La massimizzazione dello shareholder value è il &lt;b&gt;riferimento supremo&lt;/b&gt; per le decisioni d&#x27;impresa.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Agency Theory&lt;/b&gt; (Jensen &amp;amp; Meckling 1976; Ross 1973): gli azionisti (&lt;i&gt;principal&lt;/i&gt;, mandante) affidano l&#x27;impresa ai manager (&lt;i&gt;agent&lt;/i&gt;, agente), che possono perseguire interessi propri. Servono incentivi e controlli per allinearli: i &lt;dfn&gt;costi di agenzia&lt;/dfn&gt; sono il prezzo di questo disallineamento. Una spesa “sociale” decisa dal manager può essere vista proprio come un costo di agenzia.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;‘Enlightened value maximization’&lt;/b&gt; (Jensen 2000): si massimizza il valore &lt;i&gt;di lungo periodo&lt;/i&gt; dell&#x27;impresa, e per farlo bisogna tenere conto degli stakeholder; ma il criterio di decisione resta uno solo, il valore.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Focus sui profitti di lungo periodo&lt;/b&gt;. Tre filoni (slide 36):&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;&lt;b&gt;Social investments in competitive context&lt;/b&gt;: investire nel contesto in cui l&#x27;impresa compete (istruzione, infrastrutture, fornitori locali) migliora insieme società e competitività.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Natural resource-based view of the firm and its dynamic capabilities&lt;/b&gt;: il vantaggio competitivo nasce da risorse e capacità difficili da imitare; il rapporto con l&#x27;ambiente naturale (prevenire l&#x27;inquinamento, ecc.) può generarle. Le &lt;i class=&quot;en&quot;&gt;dynamic capabilities&lt;/i&gt; sono le capacità di riconfigurare le risorse quando l&#x27;ambiente cambia.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Strategies for the bottom of the economic pyramid&lt;/b&gt;: servire con prodotti accessibili i miliardi di persone più povere, mercato trascurato, creando insieme profitto e sviluppo.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p class=&quot;ext&quot;&gt;Gli autori di riferimento non sono nelle slide ma nell&#x27;articolo di Garriga &amp;amp; Melé: (a) Porter &amp;amp; Kramer, &lt;i&gt;The Competitive Advantage of Corporate Philanthropy&lt;/i&gt;, HBR dic. 2002 (&lt;a href=&quot;https://bc.edu/content/ccc/research-briefs/the-competitive-advantage-of-corporate-philanthropy.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi Boston College&lt;/a&gt;); (b) Hart, &lt;i&gt;A Natural-Resource-Based View of the Firm&lt;/i&gt;, AMR 1995 (&lt;a href=&quot;https://www.uvm.edu/giee/pubpdfs/Hart_2011_Journal%20of%20Management.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;rassegna Hart &amp;amp; Dowell 2011&lt;/a&gt;): tre strategie, prevenzione dell&#x27;inquinamento, product stewardship, sviluppo sostenibile; (c) Prahalad &amp;amp; Hammond, &lt;i&gt;Serving the World&#x27;s Poor, Profitably&lt;/i&gt;, HBR 2002 (&lt;a href=&quot;https://en.wikipedia.org/wiki/Bottom_of_the_pyramid&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bottom of the pyramid&lt;/a&gt;; tesi criticata, es. da Karnani 2007).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Forma particolare di marketing basata sulla &lt;b&gt;cooperazione tra un&#x27;impresa “for profit” e una “nonprofit organization”&lt;/b&gt; per un beneficio reciproco (slide 37).&lt;/p&gt;
      &lt;blockquote&gt;“The brand manager uses consumer concern for business responsibility as a means for securing competitive advantage. At the same time a charitable cause receives substantial financial benefits”&lt;cite&gt;Smith &amp;amp; Higgins, 2000, p. 309&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;div class=&quot;note&quot;&gt;Esempio tipico: “per ogni confezione venduta doniamo 10 centesimi a una ONG”. L&#x27;impresa differenzia il marchio e aumenta le vendite; la causa riceve fondi. È strumentale perché la causa sociale è scelta e misurata in base al ritorno commerciale.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Laboratorio: un investimento sociale passa il test strumentale?&lt;/h3&gt;
  &lt;p&gt;Modello semplificato (valori cumulati, senza attualizzazione): un&#x27;iniziativa costa subito &lt;i&gt;C&lt;/i&gt; e genera ogni anno un beneficio &lt;i&gt;B&lt;/i&gt; per l&#x27;impresa (reputazione, vendite, personale più qualificato). Muovi i cursori e confronta l&#x27;ottica di breve (1.1, prezzo dell&#x27;azione a 1 anno) con quella di lungo periodo (1.2).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ic&quot;&gt;Costo iniziale &lt;i&gt;C&lt;/i&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ic&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;icv&quot;&gt;60&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ib&quot;&gt;Beneficio annuo &lt;i&gt;B&lt;/i&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ib&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;ibv&quot;&gt;12&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ih&quot;&gt;Orizzonte (anni)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ih&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;ihv&quot;&gt;6&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;ichart&quot; viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Valore cumulato dell&#x27;investimento sociale nel tempo&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;verdict&quot;&gt;&lt;div id=&quot;iv1&quot;&gt;&lt;/div&gt;&lt;div id=&quot;iv2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Lettura: per le teorie strumentali la domanda non è “è giusto?”, ma “crea valore per gli azionisti?”. Lo stesso progetto può essere respinto in ottica di breve e accettato in ottica di lungo periodo.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · gruppo I&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Secondo le teorie strumentali, quando un&#x27;attività sociale è accettabile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se e solo se è coerente con la creazione di ricchezza per l&#x27;impresa (CSR come mezzo per il profitto).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa distingue 1.1 da 1.2?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;1.1 guarda al valore per l&#x27;azionista e al prezzo dell&#x27;azione (breve periodo); 1.2 a strategie per un vantaggio competitivo e profitti di lungo periodo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa dice la teoria dell&#x27;agenzia e che c&#x27;entra con la CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Studia il rapporto tra azionisti (principal) e manager (agent) con interessi potenzialmente divergenti. In ottica strumentale, l&#x27;azione sociale decisa dal manager è giustificata solo se serve al valore per gli azionisti; altrimenti è un costo di agenzia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Definisci il cause-related marketing.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Cooperazione tra un&#x27;impresa profit e un&#x27;organizzazione nonprofit per beneficio reciproco: il marchio ottiene vantaggio competitivo sfruttando la sensibilità dei consumatori, la causa riceve fondi (Smith &amp;amp; Higgins 2000).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ II ============ --&gt;
&lt;section class=&quot;part p-pol&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;II&lt;/span&gt; Group II · Goal attainment → politics &lt;span class=&quot;slides&quot;&gt;slide 38–49&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Teorie politiche&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Political theories&lt;/b&gt;: al centro c&#x27;è il &lt;b&gt;potere sociale&lt;/b&gt; dell&#x27;impresa, nel rapporto con la società, e la sua responsabilità nell&#x27;arena politica legata a quel potere. Ne segue che l&#x27;impresa accetta doveri e diritti sociali o partecipa a forme di cooperazione sociale (slide 39).&lt;/div&gt;

  &lt;h3&gt;2.1 Corporate constitutionalism (Davis)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;The social power equation&lt;/span&gt;&lt;p&gt;&lt;i&gt;“Social responsibilities of businessmen arise from the amount of social power that they have”&lt;/i&gt; — Davis 1967, p. 48.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Più potere → più responsabilità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;The iron law of responsibility&lt;/span&gt;&lt;p&gt;&lt;i&gt;“Whoever does not use his social power responsibly will lose it. In the long run those who do not use power in a manner which society considers responsible will tend to lose it because other groups eventually will step in to assume those responsibilities”&lt;/i&gt; — Davis 1960, p. 63.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;Si chiama &lt;i&gt;constitutionalism&lt;/i&gt; perché, come una costituzione limita il potere dello Stato, così le forze sociali (governi, sindacati, consumatori, opinione pubblica) &lt;b&gt;limitano e condizionano&lt;/b&gt; il potere dell&#x27;impresa: se ne abusa, altri soggetti glielo sottraggono, per esempio con nuove leggi.&lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Laboratorio · legge ferrea.&lt;/b&gt; Imposta quanto potere sociale ha un&#x27;impresa e quanta responsabilità esercita davvero:&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dp&quot;&gt;Potere sociale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;dpv&quot;&gt;70&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dr&quot;&gt;Uso responsabile&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;drv&quot;&gt;35&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;dchart&quot; viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra responsabilità attese e responsabilità esercitate&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;pane&quot; id=&quot;dmsg&quot; style=&quot;background:var(--slate-bg)&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Esempio · slide 42&lt;/span&gt;&lt;p&gt;&lt;b&gt;“Merkel to industry: ‘Support refugees!’”&lt;/b&gt; (2015). All&#x27;apertura del salone dell&#x27;auto IAA di Francoforte, la cancelliera tedesca chiede all&#x27;industria automobilistica di offrire formazione professionale e lavoro ai rifugiati: la loro integrazione richiede il sostegno di tutti.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Lettura: un grande settore industriale ha un potere sociale enorme (occupazione, formazione); per questo la politica gli chiede di assumersi responsabilità pubbliche. È l&#x27;equazione del potere sociale vista dal lato delle aspettative.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;2.2 Integrative social contract theory (ISCT)&lt;/h3&gt;
  &lt;p&gt;Le responsabilità sociali nascono dal &lt;b&gt;consenso&lt;/b&gt; (Donaldson &amp;amp; Dunfee 1991). Due livelli di consenso (slide 43):&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;ISCT: macrocontratto teorico con hypernorms e microcontratti reali delle comunità&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;620&quot; height=&quot;230&quot; rx=&quot;18&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;40&quot; style=&quot;font:600 16px var(--serif);fill:var(--slate)&quot;&gt;Macrosocial contract — teorico&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;60&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;ciò su cui tutti i contraenti razionali concorderebbero → Hyper-norms (es. diritti umani fondamentali)&lt;/text&gt;
      &lt;g style=&quot;font:12px var(--sans)&quot;&gt;
        &lt;rect x=&quot;40&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;rect x=&quot;235&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;rect x=&quot;430&quot; y=&quot;90&quot; width=&quot;170&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;125&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;comunità A (es. un Paese)&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;comunità B (es. un settore)&lt;/text&gt;
        &lt;text x=&quot;515&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;Microsocial contract&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;comunità C (es. un&#x27;impresa)&lt;/text&gt;
        &lt;text x=&quot;125&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;norme locali reali&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;norme locali reali&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;norme locali reali&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;le norme locali valgono se non contraddicono le hypernorms&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Il macrocontratto è ipotetico e universale; i microcontratti sono accordi reali, impliciti o espliciti, tra i membri di comunità localizzate.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Nella versione estesa (Donaldson &amp;amp; Dunfee, &lt;i&gt;Toward a Unified Conception of Business Ethics: Integrative Social Contracts Theory&lt;/i&gt;, AMR 19(2), 1994, pp. 252–284) la teoria combina sensibilità ai contesti culturali e norme trans-culturali tramite tre concetti: &lt;i&gt;authentic norms&lt;/i&gt; (norme autentiche delle comunità), &lt;i&gt;priority rules&lt;/i&gt; (regole di priorità in caso di conflitto) e &lt;i&gt;hypernorms&lt;/i&gt;. Gli autori la svilupparono poi nel libro &lt;i&gt;Ties That Bind&lt;/i&gt; (1999). &lt;a href=&quot;https://link.springer.com/article/10.1023/A:1006154819742&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Discussione critica su Springer&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;2.3 Corporate citizenship&lt;/h3&gt;
  &lt;p&gt;Concetto nato negli anni &#x27;80 all&#x27;interno delle imprese, con tre connotazioni: &lt;b&gt;senso di appartenenza&lt;/b&gt; a una comunità; &lt;b&gt;partnership&lt;/b&gt; (volontà di migliorare la comunità locale); &lt;b&gt;attenzione all&#x27;ambiente&lt;/b&gt;. Gli sviluppi successivi portano &lt;b&gt;dalla cittadinanza locale a quella globale&lt;/b&gt; (slide 44).&lt;/p&gt;
  &lt;p&gt;“Corporate citizenship” non significa la stessa cosa per tutti. Matten et al. (2003) distinguono tre visioni (slide 45–47):&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;(1) Limited view&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;(2) Equivalent to CSR&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;(3) Extended view&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Uso vicino alla &lt;b&gt;filantropia d&#x27;impresa&lt;/b&gt;, all&#x27;investimento sociale o a certe responsabilità verso la &lt;b&gt;comunità locale&lt;/b&gt;. Es.: sponsorizzare la squadra del paese, donare al centro anziani.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Visione molto diffusa. &lt;b&gt;Carroll (1999)&lt;/b&gt;: la corporate citizenship sembra una nuova concettualizzazione del ruolo dell&#x27;impresa nella società ma, a seconda di come la si definisce, si sovrappone in gran parte ad altre teorie sulla responsabilità d&#x27;impresa. In pratica: un nuovo nome per la CSR.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Sostenuta da Matten et al. (2003) e Matten &amp;amp; Crane (2010): le imprese &lt;b&gt;entrano nell&#x27;arena della cittadinanza nel punto in cui il governo fallisce&lt;/b&gt; nel proteggerla. Alcune imprese hanno gradualmente sostituito l&#x27;istituzione più potente della cittadinanza tradizionale: il governo.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Nella visione estesa le imprese assumono in parte funzioni di &lt;b&gt;protezione, facilitazione e abilitazione&lt;/b&gt; dei diritti dei cittadini (slide 48–49). Clicca su ciascun tipo di diritto:&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;div&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r1&quot;&gt;Social rights&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r2&quot;&gt;Civil rights&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;r3&quot;&gt;Political rights&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;r0&quot;&gt;I tre tipi di diritti di cittadinanza.&lt;/div&gt;
      &lt;div data-k=&quot;r1&quot; hidden&gt;&lt;b&gt;Diritti sociali&lt;/b&gt; (istruzione, salute, lavoro, welfare): l&#x27;impresa &lt;i&gt;fornisce&lt;/i&gt; ciò che lo Stato non garantisce. Esempi dalle slide: nutrire i senzatetto, aiutare i presidi a gestire i bilanci scolastici, migliorare l&#x27;occupabilità dei disoccupati, riqualificare quartieri degradati.&lt;/div&gt;
      &lt;div data-k=&quot;r2&quot; hidden&gt;&lt;b&gt;Diritti civili&lt;/b&gt; (libertà, proprietà, giustizia): il fallimento del governo è particolarmente visibile nei Paesi in via di sviluppo o in transizione. Le imprese possono scoraggiare o incoraggiare i governi a rispettare le proprie responsabilità. &lt;br&gt;– Caso negativo: &lt;b&gt;Shell in Nigeria&lt;/b&gt; e il suo apparente ruolo nella restrizione dei diritti civili del popolo &lt;b&gt;Ogoni&lt;/b&gt;. &lt;br&gt;– Caso positivo: il ruolo di &lt;b&gt;General Motors in Sudafrica&lt;/b&gt;.&lt;/div&gt;
      &lt;div data-k=&quot;r3&quot; hidden&gt;&lt;b&gt;Diritti politici&lt;/b&gt; (partecipazione): l&#x27;azione politica dei cittadini si rivolge alle imprese anziché ai governi: &lt;b&gt;boicottaggi, campagne su un singolo tema&lt;/b&gt; (&lt;i class=&quot;en&quot;&gt;single-issue campaigns&lt;/i&gt;), proteste. L&#x27;impresa diventa un canale per esercitare la cittadinanza.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Contesto dei due casi (non dalle slide). GM in Sudafrica: il reverendo Leon Sullivan, membro del consiglio di GM, elaborò nel 1977 i &lt;b&gt;Sullivan Principles&lt;/b&gt;, codice di condotta per le imprese USA attive nel Sudafrica dell&#x27;apartheid, poi ampliati nei &lt;b&gt;Global Sullivan Principles&lt;/b&gt; (1999) che ritrovi tra i &lt;a href=&quot;#s8&quot;&gt;universal rights&lt;/a&gt;. &lt;a href=&quot;https://en.wikipedia.org/wiki/Sullivan_principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sullivan principles (Wikipedia)&lt;/a&gt;. Sul piano teorico, Matten &amp;amp; Crane definiscono la corporate citizenship come &lt;i&gt;amministrazione&lt;/i&gt; dei diritti sociali, civili e politici tradizionalmente garantiti dai governi: &lt;i&gt;Corporate Citizenship: Toward an Extended Theoretical Conceptualization&lt;/i&gt;, AMR 30(1), 2005 (&lt;a href=&quot;https://researchportal.bath.ac.uk/en/publications/corporate-citizenship-toward-an-extended-theoretical-conceptualiz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Bath&lt;/a&gt;).&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Video citati nelle slide (Jeremy Moon): “Corporate Citizenship” &lt;a href=&quot;https://www.youtube.com/watch?v=hDk21vU3sZk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=hDk21vU3sZk&lt;/a&gt; · “Usefulness of Corporate Citizenship Concept” &lt;a href=&quot;https://www.youtube.com/watch?v=FyuASCknXMk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=FyuASCknXMk&lt;/a&gt; · “Corporations Provide Arena for Human Citizenship” &lt;a href=&quot;https://www.youtube.com/watch?v=fW-xRbcT3u0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=fW-xRbcT3u0&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · gruppo II&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Enuncia la social power equation e la iron law of responsibility.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Equazione: le responsabilità sociali derivano dalla quantità di potere sociale (Davis 1967). Legge ferrea: chi non usa responsabilmente il proprio potere sociale lo perde, perché altri gruppi ne assumeranno le responsabilità (Davis 1960).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i due livelli di consenso dell&#x27;ISCT?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Un macrocontratto sociale teorico che vale per tutti i contraenti razionali (hypernorms) e microcontratti sociali reali tra i membri di comunità localizzate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Distingui le tre visioni della corporate citizenship.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Limitata (filantropia, investimento sociale, comunità locale); equivalente alla CSR (Carroll 1999); estesa (le imprese entrano nella cittadinanza dove il governo fallisce, gestendo diritti sociali, civili e politici).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un boicottaggio contro un marchio di moda per le condizioni nelle fabbriche: che tipo di diritto di cittadinanza è in gioco?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Diritti politici: l&#x27;azione politica dei cittadini si rivolge all&#x27;impresa invece che al governo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ III ============ --&gt;
&lt;section class=&quot;part p-int&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;III&lt;/span&gt; Group III · Social integration &lt;span class=&quot;slides&quot;&gt;slide 50–59&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Teorie integrative&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Integrative theories&lt;/b&gt;: l&#x27;impresa dipende dalla società per la sua continuità, la sua crescita e perfino la sua esistenza; per questo &lt;b&gt;deve integrare le domande sociali&lt;/b&gt; (slide 51).&lt;/div&gt;
  &lt;blockquote&gt;“Social responsibilities mean that businessmen should oversee the operation of an economic system that fulfills the expectations of the public”.&lt;cite&gt;Frederick, 1960 · slide 51&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Le domande e le aspettative sociali sono il modo in cui la società interagisce con l&#x27;impresa e le conferisce &lt;dfn&gt;legitimacy&lt;/dfn&gt; (legittimità):&lt;/p&gt;
  &lt;blockquote&gt;“generalized perception or assumption that the actions of an entity are desirable, proper, or appropriate within some socially constructed system of norms, values, beliefs, and definitions”&lt;cite&gt;Suchman, 1995, p. 574 · slide 52&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In sostanza: &lt;b&gt;approvazione pubblica&lt;/b&gt;. Quindi l&#x27;impresa deve integrare le domande sociali in modo che il suo operato appaia allineato a valori e bisogni della società.&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;Suchman (AMR 20(3), 1995) distingue tre tipi di legittimità: &lt;b&gt;pragmatica&lt;/b&gt; (basata sull&#x27;interesse del pubblico), &lt;b&gt;morale&lt;/b&gt; (approvazione normativa), &lt;b&gt;cognitiva&lt;/b&gt; (l&#x27;organizzazione è comprensibile e data per scontata), e discute come ottenerla, mantenerla e ripararla. &lt;a href=&quot;https://en.wikipedia.org/wiki/Mark_C._Suchman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mark C. Suchman (Wikipedia)&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;3.1 Issues management&lt;/h3&gt;
  &lt;p&gt;&lt;b&gt;Social responsiveness&lt;/b&gt; (Sethi 1975; approccio nato negli anni &#x27;70): ciò che conta è il &lt;b&gt;gap&lt;/b&gt; tra la performance che i pubblici rilevanti si aspettano dall&#x27;organizzazione e la sua performance effettiva. L&#x27;impresa deve percepire questo gap, la &lt;i class=&quot;en&quot;&gt;zone of discretion&lt;/i&gt; (zona di discrezionalità), e scegliere una risposta per colmarlo (Ackerman &amp;amp; Bauer 1976).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Issues management&lt;/b&gt;: i &lt;b&gt;processi&lt;/b&gt; con cui l&#x27;impresa identifica, valuta e risponde alle questioni sociali e politiche che possono avere un impatto significativo su di essa (&lt;i class=&quot;en&quot;&gt;“process of institutionalization”&lt;/i&gt;, cioè rendere stabile la risposta dentro l&#x27;organizzazione).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ge&quot;&gt;Performance attesa dai pubblici&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ge&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;75&quot;&gt;&lt;output id=&quot;gev&quot;&gt;75&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ga&quot;&gt;Performance effettiva&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ga&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;gav&quot;&gt;45&lt;/output&gt;&lt;/div&gt;
    &lt;svg class=&quot;chart&quot; id=&quot;gchart&quot; viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Gap tra performance attesa ed effettiva&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;pane&quot; id=&quot;gmsg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stepper card&quot; data-stepper&gt;
    &lt;div class=&quot;eyebrow&quot; style=&quot;color:var(--sage)&quot;&gt;Il ciclo dell&#x27;issues management · scorri i passi&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Identificare&lt;/h4&gt;&lt;p&gt;Scansionare l&#x27;ambiente: quali questioni sociali o politiche emergono? (es. plastica monouso, salari nella filiera, privacy dei dati).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Valutare&lt;/h4&gt;&lt;p&gt;Quanto l&#x27;issue può impattare sull&#x27;impresa? Quanto è ampio il gap tra attese e performance?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Rispondere&lt;/h4&gt;&lt;p&gt;Scegliere una risposta per chiudere il gap: cambiare prodotto o processo, dialogare con gli stakeholder, comunicare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Istituzionalizzare&lt;/h4&gt;&lt;p&gt;Trasformare la risposta in routine: responsabilità, procedure, indicatori. Così l&#x27;impresa non “insegue” ogni volta le crisi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;→&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;3.2 The principle of public responsibility&lt;/h3&gt;
  &lt;p&gt;Per &lt;b&gt;Preston &amp;amp; Post (1981)&lt;/b&gt; una guida adeguata per un comportamento manageriale legittimo si trova nel quadro della &lt;b&gt;public policy&lt;/b&gt; rilevante, dove:&lt;/p&gt;
  &lt;blockquote&gt;“Public policy includes not only the literal text of law and regulation but also the broad pattern of social direction reflected in public opinion, emerging issues, formal legal requirements and enforcement or implementation practices”.&lt;cite&gt;slide 55&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Scelgono il termine &lt;b&gt;“public”&lt;/b&gt; invece di “social” per sottolineare l&#x27;importanza del &lt;b&gt;processo pubblico&lt;/b&gt;, invece di visioni morali personali o di gruppi d&#x27;interesse ristretti, nel definire l&#x27;ambito delle responsabilità.&lt;/p&gt;

  &lt;h3&gt;3.3 Stakeholder management&lt;/h3&gt;
  &lt;p&gt;Cerca di integrare nelle decisioni manageriali i gruppi che hanno un interesse (&lt;i class=&quot;en&quot;&gt;stake&lt;/i&gt;) nell&#x27;impresa. &lt;b&gt;Stakeholders&lt;/b&gt; = persone o gruppi che influenzano o sono influenzati dalle politiche e pratiche dell&#x27;impresa (slide 56).&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;La slide rimanda alle lezioni precedenti sulla stakeholder theory. Differenza da tenere a mente: qui gli stakeholder si &lt;i&gt;gestiscono&lt;/i&gt; perché l&#x27;impresa dipende da loro (prospettiva integrativa); nella &lt;a href=&quot;#s8&quot;&gt;normative stakeholder theory&lt;/a&gt; i loro interessi hanno &lt;i&gt;valore intrinseco&lt;/i&gt; (prospettiva etica).&lt;/p&gt;

  &lt;h3&gt;3.4 Corporate social performance (CSP)&lt;/h3&gt;
  &lt;p&gt;&lt;b&gt;Carroll (1979, 1991)&lt;/b&gt; e la “Pyramid of Corporate Social Responsibilities”. Il &lt;i&gt;corporate performance model&lt;/i&gt; di Carroll unisce: a) una definizione di base di responsabilità sociale; b) un elenco di issues; c) la filosofia di risposta (slide 57–58). Clicca sui livelli della piramide:&lt;/p&gt;
  &lt;div data-picker class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 300&quot; role=&quot;img&quot; aria-label=&quot;Piramide di Carroll&quot;&gt;
      &lt;g data-k=&quot;c4&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M140 20H200L225 85H115Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 12px var(--sans);fill:var(--paper)&quot;&gt;Filantropiche&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c3&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M113 90H227L252 155H88Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--paper)&quot;&gt;Etiche&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c2&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M86 160H254L279 225H61Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.5&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Legali&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;c1&quot; tabindex=&quot;0&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M59 230H281L306 295H34Z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.3&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Economiche&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;c0&quot;&gt;Clicca un livello (dal basso verso l&#x27;alto).&lt;/div&gt;
      &lt;div data-k=&quot;c1&quot; hidden&gt;&lt;b&gt;Economic responsibilities&lt;/b&gt; — &lt;i&gt;Be profitable.&lt;/i&gt; Il fondamento su cui poggiano tutte le altre. Un&#x27;impresa che non sta in piedi non può essere responsabile di nulla.&lt;/div&gt;
      &lt;div data-k=&quot;c2&quot; hidden&gt;&lt;b&gt;Legal responsibilities&lt;/b&gt; — &lt;i&gt;Obey the law.&lt;/i&gt; La legge è la codificazione sociale di giusto e sbagliato: giocare secondo le regole del gioco.&lt;/div&gt;
      &lt;div data-k=&quot;c3&quot; hidden&gt;&lt;b&gt;Ethical responsibilities&lt;/b&gt; — &lt;i&gt;Be ethical.&lt;/i&gt; Obbligo di fare ciò che è giusto, equo e corretto; evitare danni, anche dove la legge non arriva.&lt;/div&gt;
      &lt;div data-k=&quot;c4&quot; hidden&gt;&lt;b&gt;Philanthropic responsibilities&lt;/b&gt; — &lt;i&gt;Be a good corporate citizen.&lt;/i&gt; Contribuire con risorse alla comunità, migliorare la qualità della vita.&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:.6rem&quot;&gt;Fonte esterna: Carroll (1991, &lt;i&gt;Business Horizons&lt;/i&gt; 34, pp. 39–48) descrive le responsabilità economiche e legali come &lt;i&gt;richieste&lt;/i&gt; dalla società, quelle etiche come &lt;i&gt;attese&lt;/i&gt;, quelle filantropiche come &lt;i&gt;desiderate&lt;/i&gt;; nel modello del 1979 (AMR 4(4)) la quarta categoria si chiamava &lt;i&gt;discretionary&lt;/i&gt; e la filosofia di risposta andava da reattiva a difensiva, accomodante, proattiva. &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Carroll&#x27;s Pyramid of CSR&lt;/a&gt; · &lt;a href=&quot;https://edisciplinas.usp.br/pluginfile.php/5095444/mod_resource/content/0/%5B1979%5D%20Carroll%20pyramid.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Carroll 1979 (PDF)&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Video citati nella slide 58: &lt;a href=&quot;https://www.youtube.com/watch?v=EjSlTfWxJKQ&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=EjSlTfWxJKQ&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=QqCAFScpFvY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=QqCAFScpFvY&lt;/a&gt;.&lt;/p&gt;

  &lt;h4&gt;Il modello CSP di Wood (1991)&lt;/h4&gt;
  &lt;div class=&quot;stepper card&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Principles of CSR&lt;/h4&gt;&lt;p&gt;Perché l&#x27;impresa è responsabile: i principi di fondo (slide 59).&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Fonte esterna: Wood li articola su tre livelli, &lt;b&gt;legittimità&lt;/b&gt; (istituzionale), &lt;b&gt;responsabilità pubblica&lt;/b&gt; (organizzativo, cfr. Preston &amp;amp; Post) e &lt;b&gt;discrezionalità manageriale&lt;/b&gt; (individuale): gli stessi tre livelli della &lt;a href=&quot;#s1&quot;&gt;slide 14&lt;/a&gt;. Wood, &lt;i&gt;Corporate Social Performance Revisited&lt;/i&gt;, AMR 16(4), 1991 — &lt;a href=&quot;https://scholarworks.uni.edu/facpub/2123&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;record&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Processes of corporate social responsiveness&lt;/h4&gt;&lt;p&gt;Come l&#x27;impresa risponde: &lt;b&gt;environmental assessment&lt;/b&gt; (analisi dell&#x27;ambiente), &lt;b&gt;stakeholder management&lt;/b&gt;, &lt;b&gt;issues management&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Outcomes of corporate behavior&lt;/h4&gt;&lt;p&gt;Che cosa produce: &lt;b&gt;social impacts&lt;/b&gt; (impatti sociali), &lt;b&gt;social programmes&lt;/b&gt; (programmi sociali), &lt;b&gt;social policies&lt;/b&gt; (politiche sociali). È ciò che si può osservare e misurare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot;&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;next&quot;&gt;→&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;Il CSP è il punto in cui le teorie integrative “chiudono il cerchio”: principi (perché) → processi (come) → risultati (che cosa). Nota che issues management e stakeholder management, visti prima come approcci autonomi, qui diventano &lt;i&gt;processi&lt;/i&gt; dentro un modello unico.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · gruppo III&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché, secondo le teorie integrative, l&#x27;impresa deve rispondere alle domande sociali?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché dipende dalla società per continuità, crescita ed esistenza; la società le conferisce legittimità (approvazione pubblica) se il suo operato appare allineato ai propri valori e bisogni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è la “zone of discretion”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il gap tra la performance che i pubblici rilevanti si aspettano e quella effettiva dell&#x27;impresa; l&#x27;impresa deve percepirlo e scegliere una risposta per colmarlo (Ackerman &amp;amp; Bauer 1976).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché Preston &amp;amp; Post parlano di responsabilità “pubblica” e non “sociale”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Per sottolineare il processo pubblico (leggi, opinione pubblica, issues emergenti, prassi applicative) invece di visioni morali personali o di gruppi ristretti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Elenca i livelli della piramide di Carroll dal basso.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Economiche (be profitable), legali (obey the law), etiche (be ethical), filantropiche (be a good corporate citizen).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre componenti del modello di Wood?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Principi di CSR; processi di social responsiveness (environmental assessment, stakeholder management, issues management); risultati (social impacts, programmes, policies).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ IV ============ --&gt;
&lt;section class=&quot;part p-eth&quot; id=&quot;s8&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;IV&lt;/span&gt; Group IV · Pattern maintenance → culture and values &lt;span class=&quot;slides&quot;&gt;slide 60–67&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Teorie etiche&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Ethical theories&lt;/b&gt;: il rapporto tra impresa e società è intriso di valori etici. Ne deriva una visione della CSR in cui le imprese devono accettare le responsabilità sociali come &lt;b&gt;obbligo etico, al di sopra di ogni altra considerazione&lt;/b&gt;. &lt;br&gt;&lt;b&gt;The right thing to do!&lt;/b&gt; (slide 61)&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;Il contrasto con il gruppo I è netto: lì la CSR si fa &lt;i&gt;se conviene&lt;/i&gt;, qui si fa &lt;i&gt;perché è giusta&lt;/i&gt;, anche se costa. Nel &lt;a href=&quot;#s5&quot;&gt;laboratorio strumentale&lt;/a&gt;, un progetto con valore negativo verrebbe respinto; per le teorie etiche potrebbe essere doveroso.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;4.1 Normative stakeholder&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.2 Universal rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.3 Sustainable development&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4.4 Common good&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Freeman (1984)&lt;/b&gt;: &lt;i&gt;“managers bear a fiduciary duty to stakeholders”&lt;/i&gt;: i manager hanno un dovere fiduciario verso tutti gli stakeholder, non solo verso gli azionisti.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Donaldson &amp;amp; Preston (1995)&lt;/b&gt;:&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Gli stakeholder sono &lt;b&gt;persone o gruppi con interessi legittimi&lt;/b&gt; negli aspetti procedurali e/o sostanziali dell&#x27;attività d&#x27;impresa: sono identificati dai &lt;i&gt;loro&lt;/i&gt; interessi nell&#x27;impresa, che l&#x27;impresa abbia o no un interesse funzionale verso di loro.&lt;/li&gt;
        &lt;li&gt;Gli interessi di tutti gli stakeholder hanno &lt;b&gt;valore intrinseco&lt;/b&gt;: ogni gruppo merita considerazione per sé stesso, non solo perché serve agli interessi di un altro gruppo, come gli azionisti.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p style=&quot;font:italic 1.1rem var(--serif);color:var(--brick)&quot;&gt;“Stakeholders with names, faces, and… families”&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;Donaldson &amp;amp; Preston (AMR 20(1), 1995, pp. 65–91) distinguono tre usi della stakeholder theory: &lt;b&gt;descrittivo&lt;/b&gt; (com&#x27;è l&#x27;impresa), &lt;b&gt;strumentale&lt;/b&gt; (che cosa conviene), &lt;b&gt;normativo&lt;/b&gt; (che cosa si deve fare), e sostengono che la base normativa è fondamentale. È la chiave per capire perché lo stakeholder management compare nel gruppo III e la stakeholder theory normativa nel gruppo IV. &lt;a href=&quot;https://www.proquest.com/docview/210948648&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;record ProQuest&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Iniziative che fissano standard di responsabilità sulla base dei diritti umani (slide 64):&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;UN Global Compact&lt;/b&gt; — i 10 principi visti nella &lt;a href=&quot;#s2&quot;&gt;sezione 2&lt;/a&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;The Global Sullivan Principles&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;SA8000&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;…&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;Tutte basate sulla Dichiarazione universale dei diritti umani.&lt;/b&gt;&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;Global Sullivan Principles: presentati all&#x27;ONU il 2 novembre 1999 da Leon Sullivan con Kofi Annan, estendono il codice del 1977 sull&#x27;apartheid: diritti umani, pari opportunità, libertà di associazione, rifiuto della corruzione (&lt;a href=&quot;https://nautilus.org/projects/cap/the-global-sullivan-principles-february-1-1999/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo&lt;/a&gt;). SA8000: standard certificabile di Social Accountability International (1997; edizione corrente SA8000:2014) sulle condizioni di lavoro, con un sistema di gestione per il miglioramento continuo (&lt;a href=&quot;https://en.wikipedia.org/wiki/SA8000&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SA8000&lt;/a&gt;). Dichiarazione universale: adottata dall&#x27;Assemblea generale ONU il 10 dicembre 1948, ris. 217 A (III) (&lt;a href=&quot;https://www.coe.int/en/web/gender-matters/the-universal-declaration-of-human-rights&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo, Consiglio d&#x27;Europa&lt;/a&gt;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;blockquote&gt;“Sustainable development seeks to meet the needs and aspirations of the present without compromising the ability to meet those of the future”.&lt;cite&gt;World Commission on Environment and Development – Brundtland Report, 1987, p. 40 · slide 65&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;L&#x27;impresa ha responsabilità anche verso le &lt;b&gt;generazioni future&lt;/b&gt;: le risorse che consuma oggi non sono solo sue. La slide 66 richiama di nuovo gli SDG dell&#x27;ONU.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 520 200&quot; role=&quot;img&quot; aria-label=&quot;Sviluppo sostenibile come equilibrio tra presente e futuro&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;150&quot; x2=&quot;480&quot; y2=&quot;150&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;path d=&quot;M260 150L240 185H280Z&quot; fill=&quot;var(--brick)&quot;/&gt;
          &lt;line x1=&quot;70&quot; y1=&quot;150&quot; x2=&quot;450&quot; y2=&quot;150&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;4&quot;/&gt;
          &lt;rect x=&quot;70&quot; y=&quot;80&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Presente&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;bisogni e aspirazioni&lt;/text&gt;
          &lt;rect x=&quot;300&quot; y=&quot;80&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;375&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Futuro&lt;/text&gt;&lt;text x=&quot;375&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;capacità di soddisfarli&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font:italic 15px var(--serif);fill:var(--ink)&quot;&gt;“…without compromising…”&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;ext&quot;&gt;Il rapporto &lt;i&gt;Our Common Future&lt;/i&gt; (Commissione mondiale su ambiente e sviluppo, presieduta da Gro Harlem Brundtland) fu trasmesso all&#x27;Assemblea generale come documento A/42/427 (4 agosto 1987). Le slide scrivono “Brutland”: il nome corretto è Brundtland. &lt;a href=&quot;https://digitallibrary.un.org/record/139811&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;blockquote&gt;“Business, as with any other social group or individual in society, has to contribute to the common good, because it is a part of society”.&lt;cite&gt;Garriga &amp;amp; Melé · slide 67&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;blockquote&gt;“Business should be neither harmful to nor a parasite on society, but purely a positive contributor to the wellbeing of the society.”&lt;cite&gt;Garriga &amp;amp; Melé · slide 67&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;L&#x27;impresa non è un soggetto esterno che “restituisce” qualcosa alla società: &lt;b&gt;ne fa parte&lt;/b&gt;, come una persona o una famiglia, e quindi partecipa al &lt;dfn&gt;bene comune&lt;/dfn&gt;, l&#x27;insieme delle condizioni che permettono a tutti di realizzarsi.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · gruppo IV&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa caratterizza le teorie etiche rispetto alle strumentali?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La CSR è un obbligo etico al di sopra di ogni altra considerazione (“the right thing to do”), non un mezzo per il profitto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le due tesi di Donaldson &amp;amp; Preston (1995)?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;(1) Gli stakeholder sono identificati dai loro interessi legittimi nell&#x27;impresa; (2) gli interessi di tutti gli stakeholder hanno valore intrinseco.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Su quale documento si basano Global Compact, Global Sullivan Principles e SA8000?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sulla Dichiarazione universale dei diritti umani.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dai la definizione di sviluppo sostenibile del rapporto Brundtland.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lo sviluppo che cerca di soddisfare bisogni e aspirazioni del presente senza compromettere la capacità di soddisfare quelli del futuro (1987, p. 40).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SINTESI ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s9&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;∑&lt;/span&gt; Le quattro teorie e la realtà &lt;span class=&quot;slides&quot;&gt;slide 68&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Quattro dimensioni interconnesse&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Donati (1991)&lt;/b&gt; rilegge Parsons (1961) e suggerisce che i quattro gruppi vanno intesi come &lt;b&gt;quattro dimensioni interconnesse presenti in ogni fenomeno sociale&lt;/b&gt;. Quindi il rapporto impresa–società, e con esso le teorie della CSR, deve includere tutte e quattro le dimensioni, e tra loro deve esistere (o almeno dovrebbe) qualche connessione.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 520 330&quot; role=&quot;img&quot; aria-label=&quot;Le quattro dimensioni connesse attorno al rapporto impresa-società&quot;&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M140 85L380 85M140 245L380 245M110 115L110 215M410 115L410 215M140 105L380 225M380 105L140 225&quot;/&gt;&lt;/g&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;165&quot; r=&quot;54&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;impresa&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;↔ società&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Economica&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;profitto&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Politica&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;potere responsabile&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;215&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Integrativa&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;domande sociali&lt;/text&gt;
      &lt;rect x=&quot;320&quot; y=&quot;215&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;30&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;Etica&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;valori, bene comune&lt;/text&gt;
      &lt;text x=&quot;260&quot; y=&quot;315&quot; text-anchor=&quot;middle&quot; style=&quot;font:italic 13px var(--serif);fill:var(--muted)&quot;&gt;non quattro alternative, ma quattro facce dello stesso fenomeno&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Nell&#x27;articolo, Garriga &amp;amp; Melé concludono che ogni teoria privilegia una dimensione (profitti, performance politica, domande sociali, valori etici) e che servirebbe una nuova teoria capace di integrarle tutte. &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight, “Untangling CSR theories”&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Esercizio: a quale gruppo appartiene?&lt;/h3&gt;
  &lt;p&gt;Per ogni affermazione di un manager, scegli il gruppo di teorie che esprime meglio.&lt;/p&gt;
  &lt;div id=&quot;classify&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot; id=&quot;clsScore&quot;&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · sintesi&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la proposta di Donati (1991)?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Leggere i quattro gruppi non come alternative, ma come quattro dimensioni interconnesse presenti in ogni fenomeno sociale: una buona teoria del rapporto impresa–società deve includerle tutte e collegarle.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Domanda d&#x27;esame possibile: “Perché la CSR è difficile da definire e come la classificano Garriga &amp;amp; Melé?”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Traccia: concetto ambiguo, appraisive, open, multidisciplinare (slide 3–5); le definizioni dipendono dal ruolo attribuito all&#x27;impresa (Crane et al.); Garriga &amp;amp; Melé classificano per focus dell&#x27;interazione impresa–società, partendo dai 4 aspetti di Parsons → 4 gruppi con esempi (Friedman, Davis, Carroll/Wood, Freeman/Brundtland); chiusura con Donati.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part p-pol&quot; id=&quot;s10&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;+&lt;/span&gt; Per approfondire&lt;/div&gt;
  &lt;h2&gt;Autori, testi, norme e siti citati nelle slide&lt;/h2&gt;
  &lt;p&gt;Ogni scheda indica il riferimento come appare nelle slide &lt;span class=&quot;badge sl&quot;&gt;slide&lt;/span&gt; e i dati verificati con ricerca web &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;, con il link. Alcuni dettagli bibliografici differiscono tra le fonti (es. pagine): verificateli sulla rivista prima di citarli.&lt;/p&gt;
  &lt;div class=&quot;src&quot;&gt;
    &lt;article&gt;&lt;h4&gt;Bowen · &lt;i&gt;Social Responsibilities of the Businessman&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 6&lt;/span&gt; H.R. Bowen, 1953&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Considerato la prima trattazione organica di etica degli affari e responsabilità sociale; riedito nel 2013 da University of Iowa Press con introduzione di Jean-Pascal Gond. &lt;a href=&quot;https://muse.jhu.edu/book/29080&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project MUSE&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: segna l&#x27;inizio del dibattito moderno sulla CSR.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Friedman · NYT Magazine 1970&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 2, 33&lt;/span&gt; Friedman, 1970&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “The Social Responsibility of Business Is to Increase Its Profits”, 13 settembre 1970: solo le persone hanno responsabilità; l&#x27;unica responsabilità dell&#x27;impresa è il profitto entro le regole del gioco. &lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Friedman doctrine&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il riferimento della shareholder view e delle teorie strumentali.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Freeman · &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 2, 63&lt;/span&gt; Freeman, 1984&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Pubblicato da Pitman nel 1984, riedito da Cambridge University Press nel 2010 con nuova prefazione. &lt;a href=&quot;https://www.cambridge.org/core/books/abs/strategic-management/preface-to-the-2010-reissue/100B5E83DA2414E84D15C83C0EC29C7B&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fonda la stakeholder theory, base dello stakeholder management e della sua versione normativa.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Garriga &amp;amp; Melé · “CSR Theories: Mapping the Territory”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 28–30, 67&lt;/span&gt; &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53, 2004&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; JBE 53(1–2), pp. 51–71, DOI 10.1023/B:BUSI.0000039399.90587.34; ristampato tra i &lt;i&gt;Citation Classics&lt;/i&gt; della rivista (2013). &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la struttura dell&#x27;intera seconda parte della lezione.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Carroll · piramide e modello tridimensionale&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 46, 57–58&lt;/span&gt; Carroll 1979, 1991, 1999&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; 1979: “A Three-Dimensional Conceptual Model of Corporate Performance”, AMR 4(4), 497–505 (definizione, issues, filosofia di risposta). 1991: “The pyramid of corporate social responsibility”, &lt;i&gt;Business Horizons&lt;/i&gt; 34, 39–48. &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Spiegazione open textbook&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il modello di CSR più citato e usato agli esami.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Wood · “Corporate Social Performance Revisited”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 57, 59&lt;/span&gt; Wood, 1991&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; AMR 16(4), ottobre 1991, pp. 691–718: CSP come principi, processi di responsiveness, risultati. &lt;a href=&quot;https://scholarworks.uni.edu/facpub/2123&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNI ScholarWorks&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: integra in un solo modello issues management, stakeholder management e risultati misurabili.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Davis · potere sociale e legge ferrea&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 41&lt;/span&gt; Davis 1960, 1967&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “Can Business Afford to Ignore Social Responsibilities?”, &lt;i&gt;California Management Review&lt;/i&gt;, 1960. La formulazione della legge ferrea è associata anche al libro di Davis &amp;amp; Blomstrom &lt;i&gt;Business, Society, and Environment&lt;/i&gt;. &lt;a href=&quot;https://cmr-mig.berkeley.edu/1960/05/2-3-can-business-afford-to-ignore-social-responsibilities&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CMR&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: base del corporate constitutionalism.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Donaldson &amp;amp; Dunfee · ISCT&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 43&lt;/span&gt; Donaldson &amp;amp; Dunfee, 1991&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Versione di riferimento: AMR 19(2), 1994, pp. 252–284; poi il libro &lt;i&gt;Ties That Bind&lt;/i&gt; (1999). &lt;a href=&quot;https://link.springer.com/article/10.1023/A:1006154819742&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega come conciliare norme universali e norme locali.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Matten &amp;amp; Crane · corporate citizenship estesa&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 45–49&lt;/span&gt; Matten et al. 2003; Matten &amp;amp; Crane 2010&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “Corporate Citizenship: Toward an Extended Theoretical Conceptualization”, AMR 30(1), 2005, pp. 166–179: l&#x27;impresa come amministratrice di diritti sociali, civili e politici. &lt;a href=&quot;https://researchportal.bath.ac.uk/en/publications/corporate-citizenship-toward-an-extended-theoretical-conceptualiz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Bath&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base teorica della visione estesa.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Jensen &amp;amp; Meckling · teoria dell&#x27;agenzia&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 35&lt;/span&gt; Jensen &amp;amp; Meckling 1976; Ross 1973; Jensen 2000&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure”, &lt;i&gt;Journal of Financial Economics&lt;/i&gt; 3(4), 1976, pp. 305–360. &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fonda il primato del valore per l&#x27;azionista.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Suchman · legittimità&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 52&lt;/span&gt; Suchman 1995, p. 574&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “Managing Legitimacy: Strategic and Institutional Approaches”, AMR 20(3), 1995, pp. 571–610: legittimità pragmatica, morale, cognitiva. &lt;a href=&quot;https://en.wikipedia.org/wiki/Mark_C._Suchman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dà la definizione di legittimità usata dalle teorie integrative.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Donaldson &amp;amp; Preston · stakeholder theory&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 63&lt;/span&gt; Donaldson &amp;amp; Preston 1995&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; “The Stakeholder Theory of the Corporation: Concepts, Evidence, and Implications”, AMR 20(1), 65–91: usi descrittivo, strumentale, normativo. &lt;a href=&quot;https://en.wikipedia.org/wiki/Thomas_Donaldson_(ethicist)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Thomas Donaldson (Wikipedia)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: definisce la versione normativa (etica) della stakeholder theory.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Dahlsrud · 37 definizioni di CSR&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 3&lt;/span&gt; Dahlsrud 2008&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;CSR and Environmental Management&lt;/i&gt; 15(1), 1–13: 5 dimensioni ricorrenti (ambientale, sociale, economica, stakeholder, volontarietà); la confusione riguarda più come la CSR viene costruita nei contesti che come viene definita. &lt;a href=&quot;https://ideas.repec.org/a/wly/corsem/v15y2008i1p1-13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra in modo empirico la “giungla delle definizioni”.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Commissione europea · Green Paper e strategia CSR&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 15–19&lt;/span&gt; EU 2001, 2002, 2006, 2011&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Green Paper COM(2001) 366 del 18.7.2001; strategia rinnovata COM(2011) 681 del 25.10.2011. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/green-paper-on-corporate-social-responsibility.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex Green Paper&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex CSR nell&#x27;UE&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la definizione istituzionale di riferimento in Europa.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;European Green Deal · NextGenerationEU&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 17, 20&lt;/span&gt; 2019, 2020&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Green Deal: COM(2019) 640, zero emissioni nette al 2050. NextGenerationEU: Recovery and Resilience Facility, base dei PNRR. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-green-deal.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://next-generation-eu.europa.eu/recovery-and-resilience-facility_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra la sostenibilità al centro dell&#x27;agenda politica.&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;UN Global Compact&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 21–24, 64&lt;/span&gt; unglobalcompact.org&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; 10 principi su diritti umani, lavoro, ambiente, anticorruzione; iniziativa volontaria, non regolatoria. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Ten Principles&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è lo standard globale volontario più diffuso.&lt;/p&gt;&lt;/article&gt;
