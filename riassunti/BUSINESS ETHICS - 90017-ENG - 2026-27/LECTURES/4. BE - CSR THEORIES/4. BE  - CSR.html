      &lt;a href=&quot;#s3&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;32&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;600&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot;&gt;3 · Perché la CSR?&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;600&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot;&gt;ragioni per adottarla&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s4&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;220&quot; y=&quot;172&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;360&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;4 · Mappa di Garriga &amp;amp; Melé&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;360&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot;&gt;dai 4 aspetti di Parsons (1961)&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s5&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;12&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;95&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;I · Strumentali&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;95&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;economia · profitto&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s6&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;192&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;275&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;II · Politiche&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;275&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;potere · cittadinanza&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s7&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;372&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;455&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;III · Integrative&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;455&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;domande sociali&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s8&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;547&quot; y=&quot;322&quot; width=&quot;166&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;630&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;IV · Etiche&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;630&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;valori · bene comune&lt;/text&gt;&lt;/a&gt;
      &lt;a href=&quot;#s9&quot; class=&quot;node&quot;&gt;&lt;rect x=&quot;210&quot; y=&quot;462&quot; width=&quot;300&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text class=&quot;t1&quot; x=&quot;360&quot; y=&quot;486&quot; text-anchor=&quot;middle&quot;&gt;Sintesi · 4 dimensioni connesse&lt;/text&gt;&lt;text class=&quot;t2&quot; x=&quot;360&quot; y=&quot;504&quot; text-anchor=&quot;middle&quot;&gt;Donati (1991) rilegge Parsons&lt;/text&gt;&lt;/a&gt;
      &lt;text class=&quot;elab&quot; x=&quot;360&quot; y=&quot;545&quot; text-anchor=&quot;middle&quot;&gt;linee tratteggiate = legami tematici · linee piene = passaggi del ragionamento&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Come leggere la pagina: il contenuto delle slide è il corpo del testo (con il numero di slide). I riquadri &lt;span class=&quot;tag&quot; style=&quot;--c:var(--slate);--cbg:var(--slate-bg)&quot;&gt;fonte esterna&lt;/span&gt; contengono dati trovati con ricerca web, con link. I riquadri “collegamento / chiarimento” sono spiegazioni aggiunte per capire ciò che le slide danno per scontato. Nel PDF mancano le slide 11–12 (la numerazione salta da 10 a 13).&lt;/p&gt;
&lt;/header&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; Navigare nella giungla delle definizioni &lt;span class=&quot;slides&quot;&gt;slide 2–14&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Che cosa significa CSR?&lt;/h2&gt;
  &lt;p&gt;&lt;dfn&gt;CSR – Corporate Social Responsibility&lt;/dfn&gt; (responsabilità sociale d&#x27;impresa) indica, in prima approssimazione, le responsabilità che un&#x27;impresa ha verso la società oltre al semplice fare affari. Ma la lezione parte da un punto chiave: &lt;b&gt;non esiste una definizione unica&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;Il punto di partenza: due visioni contrapposte&lt;/h3&gt;
  &lt;p&gt;Dal corso già sapete (slide 2) che il dibattito ruota intorno a due poli:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Shareholders&#x27; view&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Stakeholders&#x27; view&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Milton Friedman&lt;/b&gt;: &lt;i&gt;“The only corporate social responsibility a company has is to maximize its profits.”&lt;/i&gt;&lt;/p&gt;
      &lt;p&gt;Gli &lt;dfn&gt;shareholders&lt;/dfn&gt; (azionisti) sono i proprietari: l&#x27;impresa è loro strumento e il manager è il loro agente. Fare “beneficenza” con i soldi dell&#x27;impresa significherebbe spendere denaro altrui. La responsabilità sociale coincide con il profitto, entro le regole del gioco (legge e costumi etici). → Base delle &lt;a href=&quot;#s5&quot;&gt;teorie strumentali&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;R. Edward Freeman&lt;/b&gt;: l&#x27;impresa deve rispondere a tutti gli &lt;dfn&gt;stakeholders&lt;/dfn&gt;, cioè i soggetti che influenzano o sono influenzati dalle sue attività (dipendenti, clienti, fornitori, comunità, ambiente, finanziatori…).&lt;/p&gt;
      &lt;p&gt;Il valore non si crea solo per gli azionisti ma attraverso relazioni con molti gruppi, i cui interessi hanno dignità propria. → Ritorna nello &lt;a href=&quot;#s7&quot;&gt;stakeholder management&lt;/a&gt; (integrativo) e nella &lt;a href=&quot;#s8&quot;&gt;normative stakeholder theory&lt;/a&gt; (etica).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un concetto ambiguo, complesso, “aperto”&lt;/h3&gt;
  &lt;p&gt;La letteratura (slide 3) concorda su un punto: la CSR è&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;ambigua&lt;/span&gt;&lt;p&gt;“ambiguous, elusive and unclear” — Smith &amp;amp; Langford 2009; van Marrewijk 2003; Vogel 1991; Votaw 1973.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;difficile da definire&lt;/span&gt;&lt;p&gt;Aguinis &amp;amp; Glavas 2012; Dahlsrud 2008; Garriga &amp;amp; Melé 2004; Matten &amp;amp; Moon 2008; Moon, Crane &amp;amp; Matten 2005.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;multidisciplinare&lt;/span&gt;&lt;p&gt;La complessità nasce dal fatto che teorie e approcci vengono da discipline diverse (economia, diritto, sociologia, filosofia, management).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;complessa · valutativa · aperta&lt;/span&gt;&lt;p&gt;Un concetto &lt;i class=&quot;en&quot;&gt;complex, appraisive, open&lt;/i&gt;: assume significati diversi in organizzazioni e contesti diversi (Matten &amp;amp; Moon 2008; Moon, Crane &amp;amp; Matten 2005).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;i class=&quot;en&quot;&gt;Appraisive&lt;/i&gt; (valutativo) significa che chiamare “socialmente responsabile” un&#x27;impresa è già un giudizio di valore positivo; &lt;i class=&quot;en&quot;&gt;open&lt;/i&gt; significa che il contenuto cambia nel tempo e nei contesti. Per questo si discute tanto su che cosa ci rientri.&lt;/div&gt;
  &lt;blockquote&gt;«… few subjects in management arouse as much controversy and contestation as CSR. For this reason, definitions of CSR abound, and there are as many definitions of CSR as there are disagreements over the appropriate role of the corporation in society»&lt;cite&gt;Crane, Matten &amp;amp; Spence, 2008 · slide 4&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;In italiano: ci sono tante definizioni quanti sono i disaccordi sul &lt;b&gt;ruolo dell&#x27;impresa nella società&lt;/b&gt;. Questa frase è la chiave di tutta la lezione: dimmi che ruolo dai all&#x27;impresa e ti dirò qual è la tua CSR.&lt;/p&gt;

  &lt;h3&gt;I sette significati di Votaw (1972)&lt;/h3&gt;
  &lt;p&gt;Votaw (slide 5) mostra che “CSR” significa qualcosa, ma non la stessa cosa per tutti. Clicca su ciascun significato:&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;div&gt;
      &lt;button class=&quot;pk&quot; data-k=&quot;v1&quot;&gt;legal responsibility / liability&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v2&quot;&gt;ethical behaviour&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v3&quot;&gt;“responsible for” (causal)&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v4&quot;&gt;charitable contribution&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v5&quot;&gt;socially conscious&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v6&quot;&gt;legitimacy&lt;/button&gt;&lt;button class=&quot;pk&quot; data-k=&quot;v7&quot;&gt;fiduciary duty&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;v0&quot;&gt;Scegli un significato per vedere cosa vuol dire.&lt;/div&gt;
      &lt;div data-k=&quot;v1&quot; hidden&gt;&lt;b&gt;Responsabilità legale&lt;/b&gt;: l&#x27;impresa risponde giuridicamente dei danni che causa (&lt;i class=&quot;en&quot;&gt;liability&lt;/i&gt;). Esempio: risarcire chi è danneggiato da un prodotto difettoso.&lt;/div&gt;
      &lt;div data-k=&quot;v2&quot; hidden&gt;&lt;b&gt;Comportamento eticamente responsabile&lt;/b&gt;: agire bene in senso morale, anche oltre l&#x27;obbligo di legge.&lt;/div&gt;
      &lt;div data-k=&quot;v3&quot; hidden&gt;&lt;b&gt;“Responsible for” in senso causale&lt;/b&gt;: essere la causa di qualcosa (es. “l&#x27;azienda è responsabile dell&#x27;inquinamento del fiume”). Collega alla distinzione &lt;i&gt;responsibility for&lt;/i&gt; / &lt;i&gt;responsibility to&lt;/i&gt; più sotto.&lt;/div&gt;
      &lt;div data-k=&quot;v4&quot; hidden&gt;&lt;b&gt;Contributo caritatevole&lt;/b&gt;: per molti CSR = filantropia, donazioni. È la lettura più riduttiva (cfr. la &lt;a href=&quot;#s6&quot;&gt;visione limitata della corporate citizenship&lt;/a&gt;).&lt;/div&gt;
      &lt;div data-k=&quot;v5&quot; hidden&gt;&lt;b&gt;Socialmente consapevole&lt;/b&gt;: un&#x27;impresa attenta e sensibile ai problemi sociali.&lt;/div&gt;
      &lt;div data-k=&quot;v6&quot; hidden&gt;&lt;b&gt;Legittimità&lt;/b&gt;: CSR come sinonimo di essere “propri”, validi, accettati dalla società. Torna nelle &lt;a href=&quot;#s7&quot;&gt;teorie integrative&lt;/a&gt; (Suchman).&lt;/div&gt;
      &lt;div data-k=&quot;v7&quot; hidden&gt;&lt;b&gt;Dovere fiduciario&lt;/b&gt;: standard di comportamento più elevati per gli uomini d&#x27;affari che per i cittadini comuni. Il &lt;i class=&quot;en&quot;&gt;fiduciary duty&lt;/i&gt; è l&#x27;obbligo di agire nell&#x27;interesse di chi ti ha affidato qualcosa: ritorna in Freeman (“managers bear a fiduciary duty to stakeholders”).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un libro seminale: Bowen (1953)&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Howard R. Bowen, &lt;i&gt;Social Responsibilities of the Businessman&lt;/i&gt; (1953)&lt;/b&gt; — considerato l&#x27;inizio del dibattito moderno sulla CSR (slide 6). Da allora c&#x27;è stata una grande proliferazione di teorie, approcci e terminologie.&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;I termini “cugini” della CSR (slide 7)&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Termine&lt;/th&gt;&lt;th&gt;In breve&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Business and Society&lt;/i&gt;&lt;/td&gt;&lt;td&gt;campo di studi sulle relazioni tra imprese e società&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Social Issues Management&lt;/i&gt;&lt;/td&gt;&lt;td&gt;gestione delle questioni sociali che toccano l&#x27;impresa (→ issues management)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Public policy and business&lt;/i&gt;&lt;/td&gt;&lt;td&gt;rapporto tra imprese e politiche pubbliche (→ principle of public responsibility)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Stakeholder (Corporate Stakeholder Responsibility)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;la responsabilità vista come responsabilità verso gli stakeholder&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;i&gt;Accountability&lt;/i&gt;&lt;/td&gt;&lt;td&gt;dover rendere conto delle proprie azioni (es. tramite reporting)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;&lt;i&gt;Corporate citizenship&lt;/i&gt;&lt;/b&gt;&lt;/td&gt;&lt;td&gt;l&#x27;impresa come “cittadino” (→ &lt;a href=&quot;#s6&quot;&gt;teorie politiche&lt;/a&gt;)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;&lt;i&gt;Sustainability&lt;/i&gt;&lt;/b&gt;&lt;/td&gt;&lt;td&gt;sostenibilità (→ &lt;a href=&quot;#s8&quot;&gt;sviluppo sostenibile&lt;/a&gt;)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;small muted&quot;&gt;Nella slide gli ultimi due sono evidenziati: sono quelli che la lezione riprende in dettaglio.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Obiettivi delle lezioni e domande guida (slide 8–9)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Obiettivi: introdurre il concetto di CSR; stimolare il pensiero critico sul ruolo dell&#x27;impresa nella società; discutere le diverse teorie. Prima bisogna chiedersi: &lt;i&gt;che cosa significa CSR? Perché le imprese hanno responsabilità sociali? Che tipo di responsabilità?&lt;/i&gt;&lt;/p&gt;
    &lt;p&gt;La slide 9 propone “due visioni” con due video: un certificato CSR (WORLDCOB CSR:2011.2) e un video della &lt;i&gt;Confederation of Indian Industry&lt;/i&gt; sulla CSR.&lt;/p&gt;
    &lt;div class=&quot;ext&quot;&gt;Una possibile lettura del confronto (non scritta nelle slide): in India la &lt;i&gt;Section 135&lt;/i&gt; del &lt;i&gt;Companies Act 2013&lt;/i&gt; impone alle imprese sopra certe soglie di destinare alla CSR almeno il 2% dell&#x27;utile netto medio dei tre esercizi precedenti, mentre l&#x27;UE nel 2001 parlava di CSR &lt;b&gt;volontaria&lt;/b&gt;. Fonti: &lt;a href=&quot;https://bsr.org/en/blog/india-companies-act-2013-five-key-points-about-indias-csr-mandate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BSR&lt;/a&gt;, &lt;a href=&quot;https://cag.gov.in/uploads/download_audit_report/2018/Chapter_4_Corporate_Social_Responsibility_of_Report_No_18_of_2018_-_Compliance_Audit_on_General_Purpose_Financial_Reports_of_Central_Public_Sector_Enterprises_of_Uni.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CAG India, rapporto 18/2018&lt;/a&gt;.&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Generare e risolvere problemi&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;CSR&lt;/b&gt; = il contributo di un&#x27;organizzazione sia a &lt;b&gt;generare&lt;/b&gt; sia a &lt;b&gt;risolvere&lt;/b&gt; problemi sociali e ambientali (Secchi 2007; Wood &amp;amp; Logsdon 2002 · slide 3, 13).&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Responsibility for e responsibility to&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;rect x=&quot;340&quot; y=&quot;20&quot; width=&quot;290&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;text x=&quot;155&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 16px var(--serif);fill:var(--brick)&quot;&gt;Responsibility FOR&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; style=&quot;font:13px var(--sans);fill:var(--ink)&quot;&gt;(having done) something&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;guarda al passato: rispondo degli&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;effetti che ho causato (problemi generati)&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 16px var(--serif);fill:var(--sage)&quot;&gt;Responsibility TO&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; style=&quot;font:13px var(--sans);fill:var(--ink)&quot;&gt;do something&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;guarda al futuro: mi impegno a&lt;/text&gt;
      &lt;text x=&quot;485&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; style=&quot;font:12px var(--sans);fill:var(--muted)&quot;&gt;contribuire a risolvere problemi&lt;/text&gt;
      &lt;path d=&quot;M302 85H338&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Slide 13: due facce della responsabilità. Esempio: un&#x27;acciaieria risponde &lt;i&gt;for&lt;/i&gt; le emissioni prodotte; si assume una responsabilità &lt;i&gt;to&lt;/i&gt; quando finanzia la bonifica o la formazione nel territorio.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le tre dimensioni&lt;/h3&gt;
  &lt;p&gt;La responsabilità si colloca su tre livelli annidati (slide 14). Clicca sugli anelli:&lt;/p&gt;
  &lt;div data-picker class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 240&quot; role=&quot;img&quot; aria-label=&quot;Tre dimensioni annidate: istituzionale, organizzativa, individuale&quot;&gt;
      &lt;g data-k=&quot;d1&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;125&quot; rx=&quot;150&quot; ry=&quot;108&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; opacity=&quot;.95&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Istituzionale&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;nazionale e internazionale&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;d2&quot; tabindex=&quot;0&quot;&gt;&lt;ellipse class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;150&quot; rx=&quot;100&quot; ry=&quot;76&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--ink)&quot;&gt;Organizzativa&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;d3&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;180&quot; r=&quot;42&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 13px var(--sans);fill:var(--paper)&quot;&gt;Individuale&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;d0&quot;&gt;Clicca un livello.&lt;/div&gt;
      &lt;div data-k=&quot;d1&quot; hidden&gt;&lt;b&gt;Istituzionale&lt;/b&gt;: regole, politiche e aspettative di Stati e organismi sovranazionali (UE, ONU), che definiscono il quadro entro cui le imprese operano. → &lt;a href=&quot;#s2&quot;&gt;sezione 2&lt;/a&gt;.&lt;/div&gt;
      &lt;div data-k=&quot;d2&quot; hidden&gt;&lt;b&gt;Organizzativa&lt;/b&gt;: l&#x27;impresa come soggetto che adotta strategie, processi e politiche di CSR.&lt;/div&gt;
      &lt;div data-k=&quot;d3&quot; hidden&gt;&lt;b&gt;Individuale&lt;/b&gt;: manager e persone che prendono decisioni e ne rispondono moralmente (non a caso Bowen parlava del &lt;i&gt;businessman&lt;/i&gt;).&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:.6rem&quot;&gt;Collegamento: gli stessi tre livelli tornano nei principi del modello di &lt;a href=&quot;#s7&quot;&gt;Wood (1991)&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché, secondo Crane, Matten &amp;amp; Spence, esistono così tante definizioni di CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché ogni definizione riflette una diversa idea del &lt;b&gt;ruolo appropriato dell&#x27;impresa nella società&lt;/b&gt;: ci sono tante definizioni quanti disaccordi su quel ruolo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra “responsibility for” e “responsibility to”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;For&lt;/i&gt;: rispondere di ciò che si è fatto (problemi generati, ottica retrospettiva). &lt;i&gt;To&lt;/i&gt;: impegnarsi a fare qualcosa (contribuire a risolvere problemi, ottica prospettica).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cita almeno quattro dei significati di CSR elencati da Votaw.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Responsabilità legale/liability; comportamento etico; “responsible for” causale; contributo caritatevole; consapevolezza sociale; legittimità; dovere fiduciario con standard più alti per gli uomini d&#x27;affari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre dimensioni della CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Istituzionale (nazionale e internazionale), organizzativa, individuale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; Il livello istituzionale &lt;span class=&quot;slides&quot;&gt;slide 15–24&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;UE e ONU: la CSR nell&#x27;agenda pubblica&lt;/h2&gt;

  &lt;h3&gt;La definizione UE (Green Paper 2001)&lt;/h3&gt;
  &lt;blockquote&gt;“Most definitions of corporate social responsibility describe it as a concept whereby companies integrate social and environmental concerns in their business operations and in their interaction with their stakeholders on a voluntary basis”.&lt;cite&gt;EU, 2001 – Green Paper · slide 15&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;La slide 18 la scompone in tre elementi. Passa sulle linguette:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;① integrazione&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;② volontarietà&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;③ stakeholder&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;i&gt;“…integration of social and environmental concerns in their business operations”&lt;/i&gt; → &lt;b&gt;approccio olistico&lt;/b&gt;, non un fatto sporadico e isolato. La CSR deve entrare nel modo ordinario di produrre, comprare, vendere, non essere una donazione occasionale.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;i&gt;“…on a voluntary basis”&lt;/i&gt; → qualcosa che va &lt;b&gt;oltre i requisiti normativi e convenzionali&lt;/b&gt; (&lt;i class=&quot;en&quot;&gt;beyond the law&lt;/i&gt;). Rispettare la legge è il minimo; la CSR comincia dopo.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;i&gt;“…in their interaction with their stakeholders”&lt;/i&gt; → forte impegno verso gli stakeholder (&lt;b&gt;stakeholder approach&lt;/b&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Nella comunicazione &lt;b&gt;COM(2011) 681&lt;/b&gt; la Commissione ha poi adottato una definizione più breve: la CSR come &lt;i&gt;“the responsibility of enterprises for their impacts on society”&lt;/i&gt;, dove il rispetto della legge e dei contratti collettivi è un prerequisito. Lo studio di Dahlsrud (2008) su 37 definizioni indica la definizione del Green Paper come la più citata. Fonti: &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, sintesi&lt;/a&gt;; &lt;a href=&quot;https://ideas.repec.org/a/wly/corsem/v15y2008i1p1-13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dahlsrud 2008 su IDEAS/RePEc&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;L&#x27;appello di Lisbona (marzo 2000)&lt;/h3&gt;
  &lt;p&gt;Il Consiglio europeo di Lisbona fa un appello speciale al senso di responsabilità sociale delle imprese sulle buone pratiche in: &lt;b&gt;lifelong learning&lt;/b&gt; (formazione continua), &lt;b&gt;organizzazione del lavoro&lt;/b&gt;, &lt;b&gt;pari opportunità&lt;/b&gt;, &lt;b&gt;inclusione sociale&lt;/b&gt; e &lt;b&gt;sviluppo sostenibile&lt;/b&gt; (slide 16).&lt;/p&gt;

  &lt;h3&gt;I documenti chiave: una linea del tempo&lt;/h3&gt;
  &lt;p&gt;Clicca sugli anni (slide 17):&lt;/p&gt;
  &lt;div data-picker&gt;
    &lt;svg viewBox=&quot;0 0 680 120&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo dei documenti UE sulla CSR&quot;&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;60&quot; x2=&quot;660&quot; y2=&quot;60&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;g data-k=&quot;t1&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2001&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Green Paper&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t2&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;160&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2002&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Communication&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t3&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;270&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2006&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Communication&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t4&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;380&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2011&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Strategia 2011-14&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t5&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;510&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2019&lt;/text&gt;&lt;text x=&quot;510&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;Green Deal&lt;/text&gt;&lt;/g&gt;
      &lt;g data-k=&quot;t6&quot; tabindex=&quot;0&quot;&gt;&lt;circle class=&quot;hit&quot; cx=&quot;610&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; style=&quot;font:600 14px var(--sans);fill:var(--ink)&quot;&gt;2020&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; style=&quot;font:11px var(--sans);fill:var(--muted)&quot;&gt;NextGenEU&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;pane&quot;&gt;
      &lt;div data-k=&quot;t0&quot;&gt;Clicca un anno.&lt;/div&gt;
      &lt;div data-k=&quot;t1&quot; hidden&gt;&lt;b&gt;2001 · Green Paper&lt;/b&gt; “Promoting a European framework for corporate social responsibility”: apre il dibattito e dà la definizione “volontaria” vista sopra. &lt;span class=&quot;small muted&quot;&gt;(Fonte esterna: COM(2001) 366, 18 luglio 2001 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/green-paper-on-corporate-social-responsibility.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t2&quot; hidden&gt;&lt;b&gt;2002 · Communication&lt;/b&gt; “Corporate Social Responsibility: A business contribution to Sustainable Development”: collega la CSR allo sviluppo sostenibile. &lt;span class=&quot;small muted&quot;&gt;(Fonte esterna: COM(2002) 347, follow-up del Green Paper.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t3&quot; hidden&gt;&lt;b&gt;2006 · Communication&lt;/b&gt; “Implementing the partnership for growth and jobs: making Europe a pole of excellence on corporate social responsibility”: la CSR come leva di crescita e occupazione.&lt;/div&gt;
      &lt;div data-k=&quot;t4&quot; hidden&gt;&lt;b&gt;2011 · Communication&lt;/b&gt; “A renewed EU strategy 2011-14 for corporate social responsibility”: l&#x27;agenda d&#x27;azione in 8 punti (sotto). &lt;span class=&quot;small muted&quot;&gt;(Fonte esterna: COM(2011) 681, 25 ottobre 2011 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/corporate-social-responsibility-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t5&quot; hidden&gt;&lt;b&gt;2019 · European Green Deal&lt;/b&gt; (Commissione von der Leyen): la sostenibilità entra al centro dell&#x27;agenda dei policy maker. &lt;span class=&quot;small muted&quot;&gt;(Fonte esterna: COM(2019) 640 dell&#x27;11.12.2019, obiettivo zero emissioni nette di gas serra al 2050 — &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-green-deal.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
      &lt;div data-k=&quot;t6&quot; hidden&gt;&lt;b&gt;2020 · Next Generation EU&lt;/b&gt;: il piano di ripresa post-pandemia; in Italia si traduce nel PNRR (slide 20: “4 sfide”, “6 missioni”). &lt;span class=&quot;small muted&quot;&gt;(Fonte esterna: il cuore è la Recovery and Resilience Facility, sovvenzioni e prestiti per riforme e investimenti — &lt;a href=&quot;https://next-generation-eu.europa.eu/recovery-and-resilience-facility_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea&lt;/a&gt;.)&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La strategia della Commissione: 8 linee d&#x27;azione&lt;/h3&gt;
  &lt;p&gt;La Commissione promuove la CSR e incoraggia le imprese ad aderire a linee guida e principi internazionali (slide 19). L&#x27;agenda comprende:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card small&quot;&gt;1. Aumentare la &lt;b&gt;visibilità&lt;/b&gt; della CSR e diffondere buone pratiche&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;2. Migliorare e monitorare la &lt;b&gt;fiducia&lt;/b&gt; nelle imprese&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;3. Migliorare i processi di &lt;b&gt;self- e co-regulation&lt;/b&gt; (autoregolazione e regolazione condivisa con le autorità)&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;4. Rafforzare le &lt;b&gt;ricompense di mercato&lt;/b&gt; per la CSR&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;5. Migliorare la &lt;b&gt;disclosure&lt;/b&gt; (comunicazione) di informazioni sociali e ambientali&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;6. Integrare la CSR in &lt;b&gt;istruzione, formazione e ricerca&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;7. Valorizzare le politiche CSR &lt;b&gt;nazionali e sub-nazionali&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;8. Allineare meglio gli approcci &lt;b&gt;europei e globali&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;L&#x27;impegno dell&#x27;ONU&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;UN Global Compact&lt;/b&gt; — “the world&#x27;s largest corporate sustainability initiative”; “Business as a force for good”. Un invito alle imprese ad allineare strategie e operazioni a principi universali su &lt;b&gt;diritti umani, lavoro, ambiente, anticorruzione&lt;/b&gt; e ad agire per obiettivi sociali (slide 21–22).&lt;/div&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Diritti umani&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Lavoro&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ambiente&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Anticorruzione&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;1.&lt;/b&gt; Sostenere e rispettare i diritti umani proclamati a livello internazionale. &lt;b&gt;2.&lt;/b&gt; Non rendersi complici di abusi.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;3.&lt;/b&gt; Libertà di associazione e contrattazione collettiva. &lt;b&gt;4.&lt;/b&gt; Eliminare il lavoro forzato. &lt;b&gt;5.&lt;/b&gt; Abolire il lavoro minorile. &lt;b&gt;6.&lt;/b&gt; Eliminare la discriminazione nell&#x27;impiego.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;7.&lt;/b&gt; Approccio precauzionale alle sfide ambientali. &lt;b&gt;8.&lt;/b&gt; Iniziative per una maggiore responsabilità ambientale. &lt;b&gt;9.&lt;/b&gt; Sviluppo e diffusione di tecnologie rispettose dell&#x27;ambiente.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;10.&lt;/b&gt; Contrastare la corruzione in ogni forma, incluse estorsione e concussione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;ext&quot;&gt;Le slide nominano le quattro aree; i dieci principi (qui parafrasati) vengono dal sito ufficiale e derivano da Dichiarazione universale dei diritti umani, Dichiarazione ILO, Dichiarazione di Rio e Convenzione ONU contro la corruzione. Il Global Compact non è uno strumento regolatorio: non “sorveglia” né sanziona. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Global Compact – The Ten Principles&lt;/a&gt;.&lt;/p&gt;

  &lt;h4&gt;Sustainable Development Goals (2015)&lt;/h4&gt;
  &lt;p&gt;“2015 – Time for global action for people and planet”. Gli SDG “provide a powerful aspiration for improving our world”. La slide 23 lo dice chiaramente: &lt;b&gt;“The call for action is a call to assume a responsibility”&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;sdg&quot; id=&quot;sdg&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;ext&quot;&gt;17 obiettivi e 169 target adottati dall&#x27;Assemblea generale con la risoluzione A/RES/70/1 “Transforming our world: the 2030 Agenda for Sustainable Development” (25–27 settembre 2015), da raggiungere entro il 2030. &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo ONU (PDF)&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i tre elementi chiave della definizione UE del 2001 e cosa implicano?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Integrazione nelle operazioni (approccio olistico, non episodico); base volontaria (oltre la legge); interazione con gli stakeholder (stakeholder approach).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Su quali temi il Consiglio di Lisbona (2000) chiede l&#x27;impegno delle imprese?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lifelong learning, organizzazione del lavoro, pari opportunità, inclusione sociale, sviluppo sostenibile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In quali quattro aree si articolano i principi del Global Compact?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Diritti umani, lavoro, ambiente, anticorruzione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché gli SDG riguardano la CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché l&#x27;invito ad agire (&lt;i&gt;call for action&lt;/i&gt;) è un invito ad &lt;b&gt;assumersi una responsabilità&lt;/b&gt; — una &lt;i&gt;responsibility to&lt;/i&gt; rivolta anche alle imprese.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; Le motivazioni &lt;span class=&quot;slides&quot;&gt;slide 25–27&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Perché le imprese adottano la CSR?&lt;/h2&gt;
  &lt;p&gt;“Please, think and share!” Le organizzazioni attuano politiche di CSR per diverse ragioni, spesso combinate (“and/or”). Ogni ragione anticipa uno dei quattro gruppi di teorie:&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Ragione (slide 26)&lt;/th&gt;&lt;th&gt;Etichetta&lt;/th&gt;&lt;th&gt;Gruppo di teorie&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Sperano di migliorare i risultati economici&lt;/td&gt;&lt;td&gt;strategical reasons&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s5&quot; style=&quot;color:var(--ochre)&quot;&gt;I · Strumentali&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Riconoscono il proprio ruolo nella società come attore politico&lt;/td&gt;&lt;td&gt;role into society&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s6&quot; style=&quot;color:var(--slate)&quot;&gt;II · Politiche&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Vogliono integrare nei propri obiettivi le aspettative dei diversi stakeholder, per ragioni etiche o strumentali&lt;/td&gt;&lt;td&gt;integrate&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s7&quot; style=&quot;color:var(--sage)&quot;&gt;III · Integrative&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Hanno valori o convinzioni etiche che impongono responsabilità sociali&lt;/td&gt;&lt;td&gt;ethical foundation&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#s8&quot; style=&quot;color:var(--brick)&quot;&gt;IV · Etiche&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Riassumendo (slide 27):&lt;/b&gt; la CSR è un concetto insidioso (&lt;i&gt;tricky&lt;/i&gt;), difficile da definire, ampio. &lt;b&gt;La definizione e l&#x27;estensione del concetto dipendono dal ruolo dell&#x27;impresa nella società.&lt;/b&gt; Il passo successivo: analizzare le teorie secondo &lt;i&gt;come è focalizzata l&#x27;interazione tra impresa e società&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa integra le attese dei clienti sull&#x27;ambiente “perché altrimenti li perde”. Ragione etica o strumentale?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Strumentale: l&#x27;integrazione delle attese degli stakeholder può avvenire per ragioni etiche &lt;i&gt;o&lt;/i&gt; strumentali (slide 26). Qui il motivo è il risultato economico.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Da che cosa dipende, secondo la slide di sintesi, l&#x27;estensione del concetto di CSR?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dal ruolo che si attribuisce all&#x27;impresa nella società.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part p-acc&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt; Una mappa del territorio &lt;span class=&quot;slides&quot;&gt;slide 28–30&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Garriga &amp;amp; Melé (2004): quattro famiglie di teorie&lt;/h2&gt;
  &lt;blockquote&gt;“…our aim here is to map the territory in which most relevant CSR theories and related approaches are situated. We will do so by considering each theory from the perspective of how the interaction phenomena between business and society are focused.”&lt;cite&gt;Garriga &amp;amp; Melé, 2004, &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53 · slide 28–29&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;Il criterio di classificazione non è “quanto” l&#x27;impresa è responsabile, ma &lt;b&gt;su quale aspetto dell&#x27;interazione impresa–società&lt;/b&gt; la teoria pone l&#x27;accento. Per individuare questi aspetti, gli autori partono dal sociologo &lt;b&gt;Talcott Parsons&lt;/b&gt; (le slide scrivono “Parson”, 1961).&lt;/p&gt;
  &lt;div class=&quot;note&quot;&gt;Parsons sostiene che ogni sistema sociale, per sopravvivere, deve risolvere quattro problemi funzionali, noti con l&#x27;acronimo &lt;b&gt;AGIL&lt;/b&gt;: &lt;b&gt;A&lt;/b&gt;daptation (procurarsi risorse dall&#x27;ambiente), &lt;b&gt;G&lt;/b&gt;oal attainment (fissare e raggiungere obiettivi, cioè la politica), &lt;b&gt;I&lt;/b&gt;ntegration (tenere insieme le parti, coesione sociale), &lt;b&gt;L&lt;/b&gt;atency o pattern maintenance (conservare culture e valori). Sono esattamente i quattro titoli dei “Group” nelle slide 31, 38, 50, 60.&lt;/div&gt;

        &lt;text x=&quot;345&quot; y=&quot;75&quot; style=&quot;font:13px var(--sans);fill:var(--muted)&quot;&gt;aspetto: politics&lt;/text&gt;
