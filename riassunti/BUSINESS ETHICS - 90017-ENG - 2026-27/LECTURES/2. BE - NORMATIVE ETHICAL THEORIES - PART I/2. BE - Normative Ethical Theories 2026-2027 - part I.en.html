&lt;!-- ============ PARTE A ============ --&gt;
&lt;section id=&quot;parte-a&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Part A · slides 3–13&lt;/p&gt;
    &lt;h2&gt;Foundations: why we need a theory&lt;/h2&gt;
    &lt;p&gt;What normative theories are, which starting positions one can take (absolutist, relativist, pluralist), and how traditional theories divide into two broad families.&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;decisione&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; Ethical decision in business&lt;/h2&gt;
    &lt;p&gt;In business, decisions do not concern only the decision-maker: they affect employees, customers, suppliers, communities and shareholders. These parties are called &lt;dfn&gt;stakeholders&lt;/dfn&gt; (anyone who affects or is affected by the firm&#x27;s activities). For this reason an ethical decision in business must rest on a &lt;strong&gt;systematic rationale&lt;/strong&gt; and on arguments that everyone can understand, so that it can be &lt;strong&gt;defended, justified and explained&lt;/strong&gt; to those who bear its effects. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;This is precisely what ethical theories are for: they provide the “grammar” with which the justification is built and communicated.&lt;/p&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;From decision to justification towards stakeholders&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;arA&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-ink2&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g font-size=&quot;14&quot;&gt;
          &lt;rect x=&quot;10&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;95&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Dilemma&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;e.g. pay the “gift”?&lt;/text&gt;
          &lt;rect x=&quot;220&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;305&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Ethical theory&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;rules and principles&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;50&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;505&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Decision&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;systematic rationale&lt;/text&gt;
          &lt;path d=&quot;M180 85H216M390 85H426M580 85H616&quot; class=&quot;s-ink2&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arA)&quot;/&gt;
          &lt;circle cx=&quot;680&quot; cy=&quot;40&quot; r=&quot;22&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;customers&lt;/text&gt;
          &lt;circle cx=&quot;720&quot; cy=&quot;88&quot; r=&quot;22&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;staff&lt;/text&gt;
          &lt;circle cx=&quot;680&quot; cy=&quot;135&quot; r=&quot;22&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;society&lt;/text&gt;
          &lt;circle cx=&quot;645&quot; cy=&quot;88&quot; r=&quot;20&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;645&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot;&gt;owners&lt;/text&gt;
          &lt;text x=&quot;505&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;defended · justified · explained&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Theory acts as a bridge between the dilemma and a decision that can be explained to stakeholders. Diagram based on &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition · slide 4&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Ethical theories&lt;/strong&gt; = the rules and principles that help determine what is “right” and “wrong” in a given situation.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Normative ethical theories&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Descriptive ethical theories&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;They &lt;strong&gt;prescribe&lt;/strong&gt; the morally correct way to act: they answer the question &lt;em&gt;“what should I do?”&lt;/em&gt;. They are the subject of this lecture. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;muted small&quot;&gt;Example: “One must not pay bribes, because…” — the “because” is supplied by the theory.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;They &lt;strong&gt;describe&lt;/strong&gt; how ethical decisions are &lt;em&gt;actually&lt;/em&gt; made in organisations: they answer the question &lt;em&gt;“what do people really do, and why?”&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;muted small&quot;&gt;Example: “60% of managers in that industry pay to speed up customs clearance, especially under deadline pressure” — this is a fact, not a judgement.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;religione&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; Normative ethical theories and religion&lt;/h2&gt;
    &lt;p&gt;Philosophical theories and religions share the &lt;strong&gt;same purpose&lt;/strong&gt;: to tell us what the right things to do are. In business, both aim to ensure that the firm is &lt;strong&gt;responsible, avoids doing harm and contributes to social welfare&lt;/strong&gt;. There are two differences. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Comparison between philosophy and religion&quot;&gt;
        &lt;g font-size=&quot;14&quot;&gt;
          &lt;rect x=&quot;250&quot; y=&quot;10&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;28&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;380&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Common purpose&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;to say what is right to do&lt;/text&gt;
          &lt;text x=&quot;140&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot;&gt;Philosophy&lt;/text&gt;
          &lt;text x=&quot;620&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot;&gt;Religion&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-tint&quot; font-weight=&quot;600&quot;&gt;SOURCE OF NORMS&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;118&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;human reason&lt;/text&gt;
          &lt;rect x=&quot;500&quot; y=&quot;118&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;deities or organised&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;belief systems&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-tint&quot; font-weight=&quot;600&quot;&gt;CONSEQUENCES&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;240&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;tangible benefits or harms&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;to others&lt;/text&gt;
          &lt;rect x=&quot;500&quot; y=&quot;180&quot; width=&quot;240&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;also spiritual: enlightenment,&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;reincarnation, damnation, salvation&lt;/text&gt;
          &lt;path d=&quot;M380 66V118M380 150V190&quot; class=&quot;s-rule&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;The two differences identified in &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;: the source of the rules and the kind of consequences of (im)morality.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;small muted&quot;&gt;The religious symbols on &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt; are a reminder that religions, too, are in their own way &lt;em&gt;principle-based&lt;/em&gt; systems: they start from given universal principles.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;posizioni&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; Absolutism, relativism, pluralism&lt;/h2&gt;
    &lt;p&gt;Before choosing a theory, the lecture raises a fundamental question &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;: &lt;em&gt;do all of us in this class share the same ideas about right and wrong? Are there universal ideals accepted by everyone?&lt;/em&gt; The possible answers lie along a spectrum between two extremes (De George, 1999) &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Spectrum from absolutism to relativism with pluralism in the middle&quot;&gt;
        &lt;defs&gt;&lt;linearGradient id=&quot;gSp&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;oklch(55% .11 250)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;oklch(60% .12 85)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
        &lt;rect x=&quot;40&quot; y=&quot;70&quot; width=&quot;680&quot; height=&quot;14&quot; rx=&quot;7&quot; fill=&quot;url(#gSp)&quot;/&gt;
        &lt;circle cx=&quot;48&quot; cy=&quot;77&quot; r=&quot;13&quot; class=&quot;f-card&quot; stroke=&quot;oklch(55% .11 250)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle cx=&quot;712&quot; cy=&quot;77&quot; r=&quot;13&quot; class=&quot;f-card&quot; stroke=&quot;oklch(60% .12 85)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;rect x=&quot;320&quot; y=&quot;58&quot; width=&quot;120&quot; height=&quot;38&quot; rx=&quot;19&quot; class=&quot;f-acc&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Pluralism&lt;/text&gt;
        &lt;g font-size=&quot;14&quot;&gt;
          &lt;text x=&quot;40&quot; y=&quot;40&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Ethical absolutism&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;40&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;19&quot; text-anchor=&quot;end&quot;&gt;Ethical relativism&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;122&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;eternal, universal moral principles&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;140&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;right/wrong: objective qualities&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;158&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;→ typical of traditional theories&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;122&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;morality depends on context,&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;140&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;on the individual and on culture&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;158&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;→ typical of contemporary theories&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-size=&quot;13&quot;&gt;the course&#x27;s approach&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;The two extreme positions and the intermediate one adopted by the course and the textbook. &lt;span class=&quot;src&quot;&gt;slides 7, 9&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tinted slate&quot;&gt;&lt;h4&gt;Ethical absolutism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;There are &lt;strong&gt;eternal, universally applicable&lt;/strong&gt; moral principles. Right and wrong are objective qualities that can be determined through reason.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted ochre&quot;&gt;&lt;h4&gt;Ethical relativism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Morality is &lt;strong&gt;context-dependent and subjective&lt;/strong&gt;: there is no universal right or wrong; it depends on the decision-maker and on the culture in which they are situated.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted brick&quot;&gt;&lt;h4&gt;Ethical pluralism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Incompatible values may be &lt;strong&gt;equally legitimate&lt;/strong&gt; and should be acknowledged and tolerated; openness to new realities; rational dialogue between people holding different values. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note inf&quot;&gt;Pluralism does not mean “everyone has their own truth” (that is relativism). It means using &lt;em&gt;several&lt;/em&gt; theories as different lenses, comparing their outcomes and arguing rationally for a choice, rather than relying on a single rule or on context alone.&lt;/div&gt;

    &lt;h3 id=&quot;caso&quot;&gt;The Briberyland case &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--accent)&quot;&gt;
      &lt;p&gt;You are a manager at an international trading company that exports goods to &lt;strong&gt;Briberyland&lt;/strong&gt;. A local customs official asks for a special “gift”: otherwise the goods will be held for &lt;strong&gt;one month&lt;/strong&gt; for inspection.&lt;/p&gt;
      &lt;ul class=&quot;clean small&quot;&gt;
        &lt;li&gt;Colleagues in the industry tell you they routinely pay to “speed up the paperwork”.&lt;/li&gt;
        &lt;li&gt;Briberyland customs is &lt;strong&gt;legally&lt;/strong&gt; entitled to hold the goods for inspection.&lt;/li&gt;
        &lt;li&gt;In the headquarters country bribery is &lt;strong&gt;illegal&lt;/strong&gt;; but the company has no clear policy and somehow tolerates it.&lt;/li&gt;
        &lt;li&gt;The goods are for one of your &lt;strong&gt;best customers&lt;/strong&gt; and must be delivered &lt;strong&gt;within two weeks&lt;/strong&gt;.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;p&gt;How would the two extreme positions and the pluralist one respond? &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Absolutism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Relativism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Pluralism&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Bribery is &lt;strong&gt;&lt;em&gt;always&lt;/em&gt; wrong&lt;/strong&gt;. Anyone faced with a corrupt official must under no circumstances pay and, depending on the policies in force, should also report the matter to the authorities. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Bribery &lt;strong&gt;&lt;em&gt;may&lt;/em&gt; be wrong&lt;/strong&gt;. It is judged according to the culture in which one operates and the specific circumstances. If one concludes that it is wrong, one acts as above; if one concludes that it is not, nothing prevents “&lt;em&gt;greasing the wheels&lt;/em&gt;” (paying to keep procedures moving). &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The case is examined through &lt;strong&gt;several theories&lt;/strong&gt; (consequences, duties, rights, justice…), identifying where they converge and where they diverge, and a defensible decision is argued for. This is the final objective of the lecture: you will find it applied in &lt;a href=&quot;#briberyland&quot;&gt;section 13&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;tradizionali&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt; Traditional (Western modernist) theories&lt;/h2&gt;
    &lt;p&gt;Traditional theories are &lt;dfn&gt;normative&lt;/dfn&gt; because they start from an &lt;strong&gt;assumption about the nature of the world&lt;/strong&gt; and, more specifically, about &lt;strong&gt;the nature of human beings&lt;/strong&gt;. How far we can accept a theory — and its conclusions in a business case — depends on how far we share these assumptions. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;They generally offer a rule or principle applicable to any situation: an &lt;em&gt;unequivocal solution&lt;/em&gt;. They fall into two groups depending on &lt;strong&gt;where they look&lt;/strong&gt; along the chain of action. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

    &lt;figure&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Highlight a family&quot;&gt;
        &lt;button class=&quot;btn&quot; data-hl=&quot;pb&quot; aria-pressed=&quot;false&quot;&gt;Principle-based&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-hl=&quot;cq&quot; aria-pressed=&quot;false&quot;&gt;Consequentialist&lt;/button&gt;
      &lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Motivation/Principles, Action, Outcomes&quot; id=&quot;chain&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;arB&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-ink2&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g class=&quot;brick&quot; data-g=&quot;pb&quot; style=&quot;transition:opacity .3s&quot;&gt;
          &lt;ellipse cx=&quot;130&quot; cy=&quot;80&quot; rx=&quot;105&quot; ry=&quot;52&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Motivation /&lt;/text&gt;
          &lt;text x=&quot;130&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Principles&lt;/text&gt;
          &lt;path d=&quot;M40 150 q0 12 12 12 h145 q12 0 16 14 q4-14 16-14 h145 q12 0 12-12&quot; fill=&quot;none&quot; class=&quot;s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;214&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;Principle-based ethics&lt;/text&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;385&quot; cy=&quot;80&quot; rx=&quot;62&quot; ry=&quot;52&quot; class=&quot;f-card s-ink2&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;385&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Action&lt;/text&gt;
        &lt;g class=&quot;sage&quot; data-g=&quot;cq&quot; style=&quot;transition:opacity .3s&quot;&gt;
          &lt;ellipse cx=&quot;630&quot; cy=&quot;80&quot; rx=&quot;105&quot; ry=&quot;52&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;630&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Outcomes&lt;/text&gt;
          &lt;path d=&quot;M395 150 q0 12 12 12 h105 q12 0 16 14 q4-14 16-14 h170 q12 0 12-12&quot; fill=&quot;none&quot; class=&quot;s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;545&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;Consequentialist ethics&lt;/text&gt;
        &lt;/g&gt;
        &lt;path d=&quot;M236 80H318M448 80H520&quot; class=&quot;s-ink2&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#arB)&quot;/&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Redrawn from &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt; (stated source: Crane et al., 2019). Principle-based theories look at &lt;em&gt;why&lt;/em&gt; and &lt;em&gt;according to which principle&lt;/em&gt; one acts; consequentialist theories look at &lt;em&gt;what the action produces&lt;/em&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;sage&quot; style=&quot;border-top:4px solid var(--tint)&quot;&gt;Consequentialist theories&lt;/th&gt;&lt;th class=&quot;brick&quot; style=&quot;border-top:4px solid var(--tint)&quot;&gt;Principle-based theories&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Basis of judgement&lt;/th&gt;&lt;td&gt;The &lt;strong&gt;outcomes&lt;/strong&gt; of an action&lt;/td&gt;&lt;td&gt;The derivation of &lt;strong&gt;principles&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Key question&lt;/th&gt;&lt;td&gt;&lt;strong&gt;Goal oriented&lt;/strong&gt;: is the intended outcome desirable?&lt;/td&gt;&lt;td&gt;&lt;strong&gt;What is right&lt;/strong&gt; vs what is desirable: what is right, regardless of what is advantageous&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Rule&lt;/th&gt;&lt;td&gt;Desirable outcomes → morally right action; undesirable outcomes → wrong action&lt;/td&gt;&lt;td&gt;From the desirability of the principles a &lt;strong&gt;“duty”&lt;/strong&gt; to act is derived, irrespective of the consequences&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Technical name&lt;/th&gt;&lt;td&gt;&lt;strong&gt;Teleological theories&lt;/strong&gt; (from Greek &lt;em&gt;télos&lt;/em&gt;, end/purpose)&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Deontological theories&lt;/strong&gt; (from Greek &lt;em&gt;déon&lt;/em&gt;, that which is owed)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Examples&lt;/th&gt;&lt;td&gt;&lt;a href=&quot;#egoism&quot;&gt;Ethical egoism&lt;/a&gt;, &lt;a href=&quot;#utilitarianism&quot;&gt;utilitarianism&lt;/a&gt;&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#kant&quot;&gt;Ethics of duties&lt;/a&gt;, &lt;a href=&quot;#rights&quot;&gt;ethics of rights and justice&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Table based on &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;; etymologies added for clarity.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part A&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between a normative and a descriptive ethical theory?&lt;/summary&gt;&lt;p&gt;A normative theory &lt;em&gt;prescribes&lt;/em&gt; how one ought to act; a descriptive theory &lt;em&gt;describes&lt;/em&gt; how ethical decisions are actually made in organisations (slide 4).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does business need a “systematic rationale”?&lt;/summary&gt;&lt;p&gt;Because decisions affect many stakeholders and must be capable of being defended, justified and explained with understandable arguments (slide 3).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A manager says: “In Briberyland paying is normal, so it&#x27;s fine.” Which position are they adopting?&lt;/summary&gt;&lt;p&gt;Ethical relativism: they judge bribery according to local culture and circumstances, not universal principles (slides 7–8).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How does pluralism differ from relativism?&lt;/summary&gt;&lt;p&gt;Relativism denies that a universal right can be rationally determined; pluralism acknowledges that incompatible values may be legitimate but maintains rational dialogue between different positions and uses several theories in the evaluation (slide 9).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the two differences between philosophical and religious theories identified in the slides?&lt;/summary&gt;&lt;p&gt;The source of norms (human reason vs deities/belief systems) and the consequences of morality (tangible benefits/harms vs also spiritual consequences) (slide 10).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Teleological or deontological: “I don&#x27;t lie to customers, even if a lie would increase sales”?&lt;/summary&gt;&lt;p&gt;Deontological (principle-based): the duty not to lie holds irrespective of desirable consequences (slide 13).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE B ============ --&gt;
&lt;section id=&quot;parte-b&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Part B · slides 14–22&lt;/p&gt;
    &lt;h2&gt;Consequentialist theories&lt;/h2&gt;
    &lt;p&gt;They judge an action by its outcomes. The only thing that changes is &lt;em&gt;whose&lt;/em&gt; outcomes count: those of the individual decision-maker (egoism) or those of everyone affected (utilitarianism).&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;egoism&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt; Ethical egoism&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition · slide 15&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Ethical egoism&lt;/strong&gt;: an action is morally right if the decision-maker freely chooses it in pursuit of their own &lt;strong&gt;desires&lt;/strong&gt; (short-term) or their own &lt;strong&gt;interests&lt;/strong&gt; (long-term).&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;Note: this is a &lt;em&gt;normative&lt;/em&gt; theory. It does not say “people are selfish” (that would be a description), but “it is &lt;em&gt;right&lt;/em&gt; for each person to pursue their own good”.&lt;/p&gt;

    &lt;h3&gt;Roots and proponents &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
    &lt;div data-steps class=&quot;sage&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Epicurus · Ancient Greece&lt;/h4&gt;&lt;p&gt;The roots go back to Greek philosophy: for Epicurus, &lt;dfn&gt;hedonism&lt;/dfn&gt; holds: pleasure is the highest good and is to be sought for its own sake.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Thomas Hobbes · &lt;em&gt;Leviathan&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;In the state of nature everyone pursues their own interest, giving rise to the “&lt;strong&gt;war of all against all&lt;/strong&gt;”. To escape it, individuals — precisely out of self-interest — submit to a sovereign power. In the summary table Hobbes is listed as the main contributor to egoism. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Ayn Rand · &lt;em&gt;The Virtue of Selfishness&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;She defends the theory out of a strong belief in individualism and in the “&lt;strong&gt;virtue of selfishness&lt;/strong&gt;”: rationally pursuing one&#x27;s own interest is a moral duty, not a vice.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Adam Smith · the “invisible hand”&lt;/h4&gt;&lt;p&gt;The best-known version: pursuing individual interest is morally acceptable because the &lt;dfn&gt;invisible hand&lt;/dfn&gt; of the market turns private interests into a benefit for all. The slides add a “(?)”: is this really so?&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;The slides give the year 1793; the work in which the invisible hand appears, &lt;em&gt;The Wealth of Nations&lt;/em&gt;, was first published in 1776 &lt;a class=&quot;ext&quot; href=&quot;https://oll.libertyfund.org/quote/249&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The 1793 date probably refers to a later edition.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Milton Friedman (?)&lt;/h4&gt;&lt;p&gt;Capitalism, free markets and &lt;dfn&gt;shareholder primacy&lt;/dfn&gt; (the view that the purpose of the firm is to create value for its shareholders). Here too the slides add a “(?)”: classing Friedman as an egoist is debatable, since he also justifies profit by its social effects. The key text is the 1970 article “The Social Responsibility of Business Is to Increase Its Profits” &lt;a class=&quot;ext&quot; href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn pri next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Desire vs interest: are they the same thing? &lt;span class=&quot;src&quot;&gt;slides 16–17&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Slide 16 shows two young men: one drinking at the bar, the other studying among piles of books. &lt;em&gt;Both are following their own desires&lt;/em&gt;. But one is pursuing immediate pleasure, the other a long-term interest. Move the time horizon and see which choice really “pays off”.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;hz&quot;&gt;Evaluation horizon&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;hz&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;hzo&quot;&gt;1&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 260&quot; id=&quot;egoChart&quot; role=&quot;img&quot; aria-label=&quot;Cumulative well-being of two choices over time&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;egoV&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Illustrative model with invented numbers, intended to visualise the distinction in &lt;span class=&quot;src&quot;&gt;slides 16–17&lt;/span&gt;: with a short horizon &lt;em&gt;desire&lt;/em&gt; wins; with a long one, &lt;em&gt;interest&lt;/em&gt; wins.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Problems with egoism &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;From desire to the pursuit of interests&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If egoism is based on momentary desires, it justifies any whim. To be a serious theory it must shift to long-term &lt;strong&gt;interests&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Objective value → enlightened self-interest&lt;/summary&gt;&lt;div&gt;&lt;p&gt;But if we speak of interests, we admit that one course of action is &lt;strong&gt;objectively better&lt;/strong&gt; (“more ethical”) than another: this is &lt;dfn&gt;enlightened egoism&lt;/dfn&gt; or &lt;dfn&gt;enlightened self-interest&lt;/dfn&gt; (far-sighted self-interest: e.g. a company treats its employees well because it benefits in the long run). In doing so, however, a criterion external to the individual&#x27;s desires is introduced.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;A social mechanism is needed (market failures)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A mechanism is needed to prevent one egoist from pursuing their interests &lt;strong&gt;at the expense of other egoists&lt;/strong&gt;. The market alone is not enough: there are &lt;dfn&gt;market failures&lt;/dfn&gt; (pollution, monopolies, information asymmetries) in which the invisible hand does not produce the common good.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Internally inconsistent?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Some do not regard egoism as a genuine ethical theory because it is &lt;strong&gt;internally inconsistent&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Additional explanation: a consistent egoist should hope that others do &lt;em&gt;not&lt;/em&gt; follow egoism (it pays to be surrounded by altruists), so they cannot recommend their own theory as a rule for everyone, as one would expect of a moral theory.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;utilitarianism&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt; Utilitarianism&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition · slide 18&lt;/span&gt;
      &lt;p&gt;According to &lt;strong&gt;utilitarianism&lt;/strong&gt;, an action is morally right if it produces &lt;strong&gt;the greatest amount of good for the greatest number of people&lt;/strong&gt; among those affected by the action.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;Unlike egoism, it does not ask whether each individual gets what they want, but looks at the &lt;em&gt;collective welfare&lt;/em&gt; produced by the action. The method is a &lt;dfn&gt;cost-benefit analysis&lt;/dfn&gt;. Main contributors: &lt;strong&gt;Jeremy Bentham&lt;/strong&gt; and &lt;strong&gt;John Stuart Mill&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;

    &lt;div class=&quot;card&quot; style=&quot;text-align:center;margin:1.2rem 0&quot;&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-bottom:.3rem&quot;&gt;The calculation in compact form (teaching formalisation)&lt;/p&gt;
      &lt;p style=&quot;font:500 1.45rem/1.5 var(--serif);margin:.2rem 0&quot;&gt;U(action) = Σ&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; [ benefits&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; − costs&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; ]&lt;/p&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:0&quot;&gt;for every person &lt;i&gt;i&lt;/i&gt; affected by the action · choose the action with the highest U · everyone counts equally&lt;/p&gt;
    &lt;/div&gt;

    &lt;p&gt;What is measured as “&lt;dfn&gt;utility&lt;/dfn&gt;”? The slides distinguish three versions &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hedonistic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Eudemonistic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ideal&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Pleasure&lt;/strong&gt; and &lt;strong&gt;pain&lt;/strong&gt;. This is Bentham&#x27;s classical version. &lt;span class=&quot;muted small&quot;&gt;E.g. a dismissal causes pain to the person losing their job; a cost saving causes pleasure to the shareholders.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Happiness&lt;/strong&gt; and &lt;strong&gt;unhappiness&lt;/strong&gt; (from Greek &lt;em&gt;eudaimonía&lt;/em&gt;, “a flourishing life”). Broader than mere momentary pleasure.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intrinsically valuable human goods&lt;/strong&gt;: goods that are valuable in themselves, such as friendship, love and trust. &lt;span class=&quot;muted small&quot;&gt;E.g. a corporate policy that preserves customer trust produces “utility” even if it gives no immediate pleasure.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Act and rule utilitarianism &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Act utilitarianism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Looks at the &lt;strong&gt;individual action&lt;/strong&gt;: it is right if &lt;em&gt;this&lt;/em&gt; action, here and now, produces more pleasure than pain.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Rule utilitarianism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Looks at &lt;strong&gt;classes of actions&lt;/strong&gt;: does the underlying principle, if followed by everyone, produce more pleasure than pain for society &lt;strong&gt;in the long run&lt;/strong&gt;?&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Utilitarian calculator: pay the “gift” in Briberyland?&lt;/h3&gt;
    &lt;p&gt;Assign each stakeholder the &lt;em&gt;immediate&lt;/em&gt; effect of the payment (−5 = great pain, +5 = great pleasure). Then switch from act to rule: the long-term effects of an “always pay” &lt;em&gt;rule&lt;/em&gt; are added.&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;calc&quot;&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Version&quot;&gt;
        &lt;button class=&quot;btn&quot; data-mode=&quot;act&quot; aria-pressed=&quot;true&quot;&gt;Act utilitarianism&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-mode=&quot;rule&quot; aria-pressed=&quot;false&quot;&gt;Rule utilitarianism&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;calcSl&quot;&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 250&quot; id=&quot;calcSvg&quot; role=&quot;img&quot; aria-label=&quot;Cost-benefit chart&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;calcV&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin:0&quot;&gt;Starting values chosen for illustrative purposes. The long-term effects (in rule mode) are fixed: repeated extortion and legal risk for the company, honest competitors penalised, local institutions weakened.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Problems with utilitarianism &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/h3&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;The interests of minorities are neglected&lt;/summary&gt;&lt;div&gt;&lt;p&gt;There is a risk of sacrificing the rights and well-being of the few in order to maximise those of the community. &lt;span class=&quot;muted small&quot;&gt;E.g. closing a plant “pays off” in aggregate, but shifts all the costs onto a small community.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Arrow&#x27;s theorem&lt;/summary&gt;&lt;div&gt;&lt;p&gt;From microeconomics: individual utility functions cannot be aggregated into a single function that perfectly represents the whole community. Even equal weighting for everyone is problematic (&lt;em&gt;equal weighting?&lt;/em&gt;).&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;More precisely: Kenneth Arrow proved that no procedure can turn individual (ordinal) preferences into a collective ranking while jointly satisfying a few reasonable conditions: unrestricted domain, weak Pareto, independence of irrelevant alternatives, non-dictatorship &lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/arrows-theorem/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;It ignores those starting from worse conditions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The sum does not consider &lt;em&gt;how&lt;/em&gt; well-being is distributed. This is the problem addressed by &lt;strong&gt;John Rawls&lt;/strong&gt;, a contemporary deontologist, in his theory of justice: see &lt;a href=&quot;#justice&quot;&gt;section 11&lt;/a&gt; and the veil of ignorance simulator.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;It reduces well-being to material well-being&lt;/summary&gt;&lt;div&gt;&lt;p&gt;There is a risk of neglecting or underestimating spiritual, cultural and relational aspects, which are hard to quantify.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;The problem of “boundaries”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Who is included in the sum? How is the community defined: employees, the country, future generations, animals?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;p class=&quot;small muted&quot;&gt;The slide numbering jumps from 18 to 20: slide 19 is missing from the PDF.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part B&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What do egoism and utilitarianism have in common?&lt;/summary&gt;&lt;p&gt;Both are consequentialist (teleological): they judge an action by its outcomes. They differ in whose outcomes count: the individual decision-maker or everyone affected (slides 13, 15, 18).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is enlightened self-interest and why does it create a problem for egoism?&lt;/summary&gt;&lt;p&gt;It is long-term self-interest, which makes some courses of conduct objectively better than others. The problem is that it introduces an “objective value”, i.e. a criterion that goes beyond the individual&#x27;s desires (slide 17).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A company asks: “If we hide this minor defect, how many will benefit and how many will suffer?” Which theory is it using?&lt;/summary&gt;&lt;p&gt;(Act) utilitarianism, based on a cost-benefit analysis of the individual act.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why do act and rule utilitarianism give different answers in the calculator?&lt;/summary&gt;&lt;p&gt;Act utilitarianism considers only the effects of the single bribe; rule utilitarianism evaluates the general rule “always pay”, whose long-term effects (repeated extortion, corrupt institutions, distorted competition) far outweigh the immediate benefits (slide 20).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Name three problems with utilitarianism.&lt;/summary&gt;&lt;p&gt;Minorities neglected; Arrow&#x27;s theorem (utilities cannot be perfectly aggregated); it ignores those starting from worse conditions (Rawls); reduction to material well-being; the boundaries problem (slide 21).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three versions of “utility”?&lt;/summary&gt;&lt;p&gt;Hedonistic (pleasure/pain), eudemonistic (happiness/unhappiness), ideal (intrinsically valuable goods such as friendship, love and trust) (slide 18).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE C ============ --&gt;
&lt;section id=&quot;parte-c&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Part C · slides 23–38&lt;/p&gt;
    &lt;h2&gt;Principle-based (deontological) theories&lt;/h2&gt;
    &lt;p&gt;They start from the assumption that there are &lt;strong&gt;basic universal principles&lt;/strong&gt; of right and wrong. Two strands: &lt;strong&gt;ethics of duties&lt;/strong&gt; and &lt;strong&gt;ethics of rights and justice&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;kant&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt; Ethics of duties — Immanuel Kant&lt;/h2&gt;
    &lt;p&gt;For Kant, morality is a matter of &lt;strong&gt;abstract&lt;/strong&gt; and &lt;strong&gt;unchanging&lt;/strong&gt; obligations, a set of &lt;dfn&gt;a priori&lt;/dfn&gt; rules (knowable through reason alone, prior to and independently of experience) to be applied to all relevant ethical problems. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Rational actors&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Human beings are rational actors endowed with &lt;strong&gt;free will&lt;/strong&gt;: they can establish these principles for themselves.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Duties&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;strong&gt;Duties&lt;/strong&gt; are the core of morality.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Commitment&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;A duty arises from the commitment to do the right thing &lt;strong&gt;out of respect for the moral law&lt;/strong&gt;, not out of expediency.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The categorical imperative &lt;span class=&quot;src&quot;&gt;slides 26–27&lt;/span&gt;&lt;/h3&gt;
    &lt;blockquote&gt;“There is, therefore, only one categorical imperative. It is: Act only according to that maxim by which you can at the same time will that it should become a universal law.”&lt;footer&gt;Immanuel Kant, quoted in slides 26–28&lt;/footer&gt;&lt;/blockquote&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Categorical&lt;/span&gt;&lt;p&gt;Universal and &lt;strong&gt;unconditional&lt;/strong&gt;: it applies to everyone, always, whatever you may desire.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Imperative&lt;/span&gt;&lt;p&gt;A &lt;strong&gt;command&lt;/strong&gt; to be followed.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note inf&quot;&gt;Its opposite is the &lt;em&gt;hypothetical&lt;/em&gt; imperative: “&lt;strong&gt;if&lt;/strong&gt; you want X, do Y” (if you don&#x27;t want to lose the customer, pay). The categorical imperative has no “if”. Slide 27 illustrates this with a red traffic light at night at a deserted junction: you stop anyway, because the rule holds unconditionally, not because someone is watching.&lt;/div&gt;

    &lt;h3&gt;The three maxims &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;A &lt;dfn&gt;maxim&lt;/dfn&gt; is the personal rule behind an action (“when it suits me, I make false promises”). The categorical imperative is expressed in three formulations, which work as three tests:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Consistency&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Human dignity&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Universality&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;“Act only according to that maxim by which you can at the same time will that it should become a universal law.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: if everyone did as I do, would my rule still work without contradicting itself?&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;“Act so that you treat humanity, whether in your own person or in that of another, always as an end and never as a means only.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: am I using someone (or myself) &lt;em&gt;only&lt;/em&gt; as a tool? Note the word “only”: in business we always use other people&#x27;s work as a means, but we must never reduce a person to a &lt;em&gt;mere&lt;/em&gt; means.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;“Act only so that the will through its maxims could regard itself at the same time as universally lawgiving.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: could all rational agents endorse this rule as a law they jointly give themselves?&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The three tests applied to the Briberyland case&lt;/h3&gt;
    &lt;div data-steps class=&quot;brick&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 1 · Formulate the maxim&lt;/h4&gt;&lt;p&gt;“When an official asks me for a gift to release the goods, I pay, if it suits me.” Kant does not ask how valuable the customer is: he asks which rule you are adopting.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · Consistency&lt;/h4&gt;&lt;p&gt;Imagine it became a universal law: everyone always pays. Customs inspection stops being a check and becomes a market for permits, and the very “advantage” of paying disappears, because everyone pays. The rule is &lt;strong&gt;self-defeating&lt;/strong&gt;: you cannot will it to be universal.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Human dignity&lt;/h4&gt;&lt;p&gt;The official is treated as a tool to be bought; honest competitors and the citizens of Briberyland as negligible obstacles. Several people are used &lt;strong&gt;merely as means&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Universality&lt;/h4&gt;&lt;p&gt;Would all rational agents, including those who are harmed, endorse a law authorising bribery? Hardly.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Deontological verdict&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Do not pay&lt;/strong&gt;, regardless of the month&#x27;s delay and the risk of losing the customer. The negative consequences remain, but they do not change the duty: this is the logic of absolutism seen in &lt;a href=&quot;#posizioni&quot;&gt;section 3&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn pri next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Problems with the ethics of duties &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Undervaluing motivation&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Only acting from duty counts: compassion, love or sympathy as motives give the action no moral worth.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Undervaluing outcomes&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Consequences, even serious ones, do not count: following the rule can lead to disastrous outcomes.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Assumption of rationality&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;It presupposes fully rational people: &lt;em&gt;misplaced optimism?&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Videos listed on slide 30: &lt;a href=&quot;https://www.youtube.com/watch?v=x_uUEaeqFog&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=gGczdp0SE0c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2&lt;/a&gt;.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic ochre&quot; id=&quot;trolley&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt; The trolley problem&lt;/h2&gt;
    &lt;p&gt;A thought experiment that sets the two families of theories against each other. A runaway trolley is about to run over five people. &lt;span class=&quot;src&quot;&gt;slides 22, 29&lt;/span&gt;&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Version 1 · the switch&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Version 2 · the footbridge&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;figure style=&quot;margin-top:0&quot;&gt;
          &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Switch: divert the trolley towards one person to save five&quot;&gt;
            &lt;path d=&quot;M20 100H300 L600 100&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
            &lt;path d=&quot;M300 100 Q380 100 440 160 H600&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; stroke-dasharray=&quot;7 5&quot;/&gt;
            &lt;rect x=&quot;40&quot; y=&quot;76&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;f-acc&quot;/&gt;&lt;circle cx=&quot;58&quot; cy=&quot;108&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;92&quot; cy=&quot;108&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;
            &lt;g class=&quot;f-ink&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;580&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;/g&gt;
            &lt;circle cx=&quot;540&quot; cy=&quot;144&quot; r=&quot;7&quot; class=&quot;f-ink&quot;/&gt;
            &lt;rect x=&quot;275&quot; y=&quot;30&quot; width=&quot;16&quot; height=&quot;44&quot; rx=&quot;3&quot; class=&quot;f-tint&quot;/&gt;&lt;circle cx=&quot;283&quot; cy=&quot;22&quot; r=&quot;8&quot; class=&quot;f-ink&quot;/&gt;
            &lt;text x=&quot;283&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;you, at the lever&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;5 people&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;1 person&lt;/text&gt;
            &lt;path d=&quot;M283 74 L295 98&quot; class=&quot;s-tint&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;/svg&gt;
        &lt;/figure&gt;
        &lt;p&gt;You can pull a lever and divert the trolley onto a track where there is only one person.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;figure style=&quot;margin-top:0&quot;&gt;
          &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Footbridge: push one person onto the tracks to save five&quot;&gt;
            &lt;path d=&quot;M20 160H620&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot;/&gt;
            &lt;rect x=&quot;40&quot; y=&quot;136&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;f-acc&quot;/&gt;&lt;circle cx=&quot;58&quot; cy=&quot;168&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;92&quot; cy=&quot;168&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;
            &lt;rect x=&quot;250&quot; y=&quot;70&quot; width=&quot;160&quot; height=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;path d=&quot;M260 80V160M400 80V160&quot; class=&quot;s-tint&quot; stroke-width=&quot;4&quot;/&gt;
            &lt;circle cx=&quot;310&quot; cy=&quot;52&quot; r=&quot;9&quot; class=&quot;f-ink&quot;/&gt;&lt;rect x=&quot;302&quot; y=&quot;62&quot; width=&quot;16&quot; height=&quot;8&quot; class=&quot;f-ink&quot;/&gt;
            &lt;circle cx=&quot;345&quot; cy=&quot;46&quot; r=&quot;13&quot; class=&quot;f-ink&quot;/&gt;&lt;rect x=&quot;334&quot; y=&quot;58&quot; width=&quot;22&quot; height=&quot;12&quot; class=&quot;f-ink&quot;/&gt;
            &lt;g class=&quot;f-ink&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;580&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;/g&gt;
            &lt;text x=&quot;310&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;you&lt;/text&gt;
            &lt;text x=&quot;370&quot; y=&quot;28&quot; font-size=&quot;13&quot;&gt;a person&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;5 people&lt;/text&gt;
          &lt;/svg&gt;
        &lt;/figure&gt;
        &lt;p&gt;You are on a footbridge above the tracks: you can stop the trolley only by pushing a person off.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted sage&quot;&gt;&lt;h4&gt;Consequentialist perspective&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The two situations are &lt;strong&gt;the same&lt;/strong&gt;: 1 life against 5. One must sacrifice 1 to save 5, because utility is greater if five survive. &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted brick&quot;&gt;&lt;h4&gt;Non-consequentialist perspective&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Here too the two situations are &lt;strong&gt;the same&lt;/strong&gt;: in both cases one must do nothing, because human life is an &lt;strong&gt;incommensurable&lt;/strong&gt; good, not something to be traded (1 against 5) and never a means to an end. &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot;&gt;And yet we “feel” that the two situations are &lt;em&gt;not&lt;/em&gt; the same. Why? Because of the &lt;strong&gt;agency / responsibility&lt;/strong&gt; required (diverting vs pushing with one&#x27;s own hands) and the &lt;strong&gt;degree of involvement of the “third” person&lt;/strong&gt; (who on the footbridge is used directly as a tool). &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Videos listed on slide 22: &lt;a href=&quot;https://www.youtube.com/watch?v=bOpf6KcWYyw&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt; · &lt;a href=&quot;https://youtu.be/yg16u_bzjPE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2 (new link)&lt;/a&gt;. The problem was proposed by Philippa Foot (1967) and named by Judith Jarvis Thomson (1976), who added the footbridge variant &lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/topic/trolley-problem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;rights&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt; Ethics of rights: natural and human rights&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Natural rights · John Locke · slide 31&lt;/span&gt;&lt;p&gt;Moral claims to which human beings are entitled and which must be respected and protected. They are the rights to &lt;strong&gt;life&lt;/strong&gt;, &lt;strong&gt;liberty&lt;/strong&gt; and &lt;strong&gt;property&lt;/strong&gt;. Key work: &lt;em&gt;Two Treatises of Government&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Human rights · slide 31&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Basic, inalienable entitlements&lt;/strong&gt; (fundamental entitlements that cannot be transferred or surrendered) inherent in all human beings, without exception.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;They generate a &lt;strong&gt;duty&lt;/strong&gt; on the part of other actors to respect them: rights and duties are two sides of the same coin.&lt;/li&gt;
      &lt;li&gt;They rest on a consensus about the nature of &lt;strong&gt;human dignity&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;They are increasingly important for business: they feature in the &lt;strong&gt;UN Global Compact&lt;/strong&gt; and in the &lt;strong&gt;UN Guiding Principles on Business and Human Rights&lt;/strong&gt;, known as the “&lt;strong&gt;Ruggie Principles&lt;/strong&gt;” after John Ruggie, who developed them. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;UN Global Compact: Principles 1 and 2 &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principle One: Human Rights&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Businesses should &lt;strong&gt;support and respect&lt;/strong&gt; the protection of internationally proclaimed human rights.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principle Two: Human Rights&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Businesses should make sure that they are &lt;strong&gt;not complicit&lt;/strong&gt; in human rights abuses.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;The UN Global Compact is a UN initiative that companies join voluntarily; its ten principles cover human rights, labour, the environment and anti-corruption &lt;a class=&quot;ext&quot; href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The anti-corruption principle is directly relevant to the Briberyland case.&lt;/p&gt;

    &lt;h3&gt;Who must do what: the three pillars &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 700 250&quot; role=&quot;img&quot; aria-label=&quot;The three pillars: the State protects, businesses respect, courts provide remedy&quot;&gt;

          &lt;rect x=&quot;480&quot; y=&quot;66&quot; width=&quot;150&quot; height=&quot;130&quot; class=&quot;f-card s-rule&quot;/&gt;

          &lt;text x=&quot;350&quot; y=&quot;100&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;BUSINESS&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;130&quot;&gt;duty / responsibility&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;to respect&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;175&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;human rights&lt;/text&gt;
          &lt;text x=&quot;555&quot; y=&quot;100&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;JUDICIARY&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;130&quot;&gt;provides&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;remedy&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;175&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;to victims of abuse&lt;/text&gt;
        &lt;/g&gt;

    &lt;/figure&gt;

    &lt;p&gt;What can a company actually do? The slide lists four levels of increasing commitment:&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Four levels of commitment on human rights&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;190&quot; width=&quot;160&quot; height=&quot;50&quot; class=&quot;f-tbg s-tint&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;a) Avoid&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;11&quot;&gt;causing or contributing&lt;/text&gt;
          &lt;rect x=&quot;185&quot; y=&quot;140&quot; width=&quot;160&quot; height=&quot;100&quot; class=&quot;f-tbg s-tint&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;b) Prevent&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;11&quot;&gt;or mitigate adverse impacts&lt;/text&gt;
          &lt;rect x=&quot;350&quot; y=&quot;90&quot; width=&quot;160&quot; height=&quot;150&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;f-paper&quot;&gt;c) Protect&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-paper&quot;&gt;human rights&lt;/text&gt;
          &lt;rect x=&quot;515&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;200&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;f-paper&quot;&gt;d) Strengthen&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-paper&quot;&gt;civil rights&lt;/text&gt;
          &lt;path d=&quot;M350 30 H675&quot; class=&quot;s-acc&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M350 24V36M675 24V36&quot; class=&quot;s-acc&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;512&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-style=&quot;italic&quot; font-size=&quot;14&quot;&gt;Corporate citizenship&lt;/text&gt;
          &lt;path d=&quot;M20 255 H345&quot; class=&quot;s-ink2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;→ human rights due diligence&lt;/text&gt;

      &lt;/svg&gt;
      &lt;figcaption&gt;Diagram from &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;: c) and d) fall under &lt;em&gt;corporate citizenship&lt;/em&gt;; everything converges in &lt;em&gt;human rights due diligence&lt;/em&gt;.&lt;/figcaption&gt;
