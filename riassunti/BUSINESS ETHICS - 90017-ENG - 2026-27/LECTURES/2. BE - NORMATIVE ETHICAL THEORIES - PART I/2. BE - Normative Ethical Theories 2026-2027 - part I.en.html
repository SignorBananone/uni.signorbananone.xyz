    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Two terms&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Human rights due diligence&lt;/strong&gt;: the ongoing process through which a company identifies, prevents, mitigates and accounts for the human rights impacts of its own activities and its value chain.&lt;br&gt;&lt;strong&gt;Corporate citizenship&lt;/strong&gt;: the company seen as a “citizen” of society, playing an active role in protecting and promoting rights, not merely in avoiding harm.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;contract&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt; Social contract theory — J.-J. Rousseau&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition · slide 34&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Social contract&lt;/strong&gt;: a &lt;em&gt;hypothetical agreement&lt;/em&gt; between the members of a society and those who govern it, establishing on a fair basis their mutual relationships, rights and responsibilities.&lt;/p&gt;&lt;/div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;It serves to &lt;strong&gt;determine the responsibilities of business&lt;/strong&gt;: what society can legitimately expect of companies.&lt;/li&gt;
      &lt;li&gt;Rights, obligations and justice bind the members of society together.&lt;/li&gt;
      &lt;li&gt;Business and government cooperate to create a good society.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Each contractarian theory starts from a different idea of the &lt;dfn&gt;state of nature&lt;/dfn&gt; (how people would live without institutions). Compare the four authors covered in the lecture:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hobbes&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Locke&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rousseau&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rawls&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;War of all against all.&lt;/strong&gt; Everyone pursues their own interest: a strong power (the &lt;em&gt;Leviathan&lt;/em&gt;) is needed to guarantee peace. This is the philosophical basis of egoism. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Human beings have &lt;strong&gt;natural rights&lt;/strong&gt; to life, liberty and property; institutions exist to protect them. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;People are &lt;strong&gt;peaceful and kind&lt;/strong&gt;, living in a simple, mutually supportive way; everyone has an interest in passing on and sharing knowledge, art and information. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Equal, free and rational&lt;/strong&gt; people who seek their own interest, but who choose the rules behind a &lt;em&gt;veil of ignorance&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt; → &lt;a href=&quot;#justice&quot;&gt;section 11&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;justice&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;11&lt;/span&gt; Justice: procedures, outcomes, Rawls&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition · slide 35&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Justice&lt;/strong&gt;: the &lt;em&gt;simultaneously&lt;/em&gt; fair treatment of individuals in a given situation, with the result that everyone gets what they deserve.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;Two crucial moral questions: what exactly does &lt;em&gt;fairness&lt;/em&gt; mean in a specific situation? By what criteria do we establish what a person can reasonably deserve? &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/p&gt;

    &lt;h3&gt;Procedural vs distributive justice &lt;span class=&quot;src&quot;&gt;slide 36&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;A distinction proposed by Boatright (2014). Try it on the example of a year-end bonus:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Fair procedures&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Fair outcomes&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Procedural justice&lt;/strong&gt;: fairness depends on whether everyone has been &lt;strong&gt;free to obtain rewards for their efforts&lt;/strong&gt;. What matters is the process, not the result.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Bonus: clear rules, the same for everyone, communicated in advance, transparent criteria. If the rules are fair, the resulting distribution is fair, even if it is highly unequal.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Distributive justice&lt;/strong&gt;: fairness depends on whether the consequences (positive and negative) are &lt;strong&gt;distributed fairly&lt;/strong&gt;, according to a principle such as &lt;strong&gt;need&lt;/strong&gt; or &lt;strong&gt;merit&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Bonus: one looks at who ultimately receives how much. By merit, more goes to those who contributed most; by need, more goes to those on low incomes.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;John Rawls — &lt;em&gt;A Theory of Justice&lt;/em&gt; &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Rawls imagines a &lt;strong&gt;state of nature&lt;/strong&gt; in which people are equal, free and rational and seek their own interest, but decide the rules of society behind a &lt;dfn&gt;veil of ignorance&lt;/dfn&gt;: they do not know what position they will occupy, whether they will be rich or poor, healthy or ill, or of which gender or religion. In this way no one can choose rules to their own advantage.&lt;/p&gt;
    &lt;p&gt;A society is just when:&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Liberty principle&lt;/strong&gt;: each person has an equal right to the most extensive system of basic liberties compatible with a similar system of liberty for all.&lt;/li&gt;
      &lt;li&gt;Social and economic inequalities are permitted only if:
        &lt;ol type=&quot;a&quot;&gt;
          &lt;li&gt;they are to the &lt;strong&gt;greatest benefit of the least advantaged&lt;/strong&gt; → &lt;dfn&gt;difference principle&lt;/dfn&gt;;&lt;/li&gt;
          &lt;li&gt;they are attached to offices and positions open to all under conditions of fair equality of opportunity → &lt;dfn&gt;equal opportunity principle&lt;/dfn&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/li&gt;
    &lt;/ol&gt;

    &lt;h3&gt;Simulator: choose behind the veil&lt;/h3&gt;
    &lt;p&gt;Three societies, each with five social positions (income in units). You know how each society is structured, but not which position will be yours. Choose, then lift the veil.&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;veil&quot;&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Choose a society&quot;&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;Society A&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Society B&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;Society C&lt;/button&gt;
        &lt;button class=&quot;btn pri&quot; id=&quot;lift&quot; disabled&gt;Lift the veil&lt;/button&gt;
      &lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 660 250&quot; id=&quot;veilSvg&quot; role=&quot;img&quot; aria-label=&quot;Incomes of the five positions in the three societies&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;veilV&quot;&gt;Choose a society.&lt;/div&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;What would a utilitarian and Rawls choose?&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;&lt;strong&gt;Utilitarian&lt;/strong&gt;: society &lt;strong&gt;B&lt;/strong&gt;, because it has the highest total (350). That the person at the bottom has only 20 does not matter, provided the sum is maximised: this is the “those starting from worse conditions” problem of &lt;a href=&quot;#utilitarianism&quot;&gt;slide 21&lt;/a&gt;.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Rawls&lt;/strong&gt;: society &lt;strong&gt;C&lt;/strong&gt;. Behind the veil a rational person asks “what if I end up at the bottom?” and chooses the society in which the worst-off is best off (45 versus 30 and 20). C is unequal, but the inequality also benefits the least advantaged compared with A: this is the difference principle.&lt;/p&gt;
        &lt;p class=&quot;small muted&quot;&gt;Illustrative figures. The rule of choosing the option with the best “worst case” is called &lt;em&gt;maximin&lt;/em&gt;.&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Video flagged as important on slide 38: &lt;a href=&quot;https://youtu.be/n6k08C699zI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Theory of Justice&lt;/a&gt;. The numbering jumps from 36 to 38: slide 37 is missing from the PDF.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part C&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What do “categorical” and “imperative” mean?&lt;/summary&gt;&lt;p&gt;Categorical = universal and unconditional; imperative = a command to be followed (slide 26).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;State the three maxims of the categorical imperative.&lt;/summary&gt;&lt;p&gt;1) Consistency: act only according to a maxim you can will as a universal law. 2) Human dignity: treat humanity, in yourself and in others, always also as an end and never merely as a means. 3) Universality: act so that your will can regard itself as universally lawgiving, i.e. endorsable by all rational agents (slide 28).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the trolley problem, why do both the utilitarian and the Kantian treat the two versions in the same way?&lt;/summary&gt;&lt;p&gt;The utilitarian sees 1 life against 5 in both and sacrifices 1; the Kantian sees in both an incommensurable life that must not be used as a means, and does not intervene. The difference we perceive depends on agency/responsibility and on the involvement of the third person (slide 29).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three pillars of the UN Guiding Principles and to whom do they apply?&lt;/summary&gt;&lt;p&gt;State: duty to protect; Business: responsibility to respect; Judiciary: remedy for victims (slide 33).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between procedural and distributive justice?&lt;/summary&gt;&lt;p&gt;Procedural justice looks at the fairness of the process (everyone free to obtain rewards for their efforts); distributive justice at the fairness of the final distribution according to a principle such as need or merit (slide 36, Boatright 2014).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does Rawls&#x27;s difference principle say?&lt;/summary&gt;&lt;p&gt;Social and economic inequalities are just only if they are to the greatest benefit of the least advantaged (slide 38).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How does Rousseau&#x27;s state of nature relate to Hobbes&#x27;s?&lt;/summary&gt;&lt;p&gt;They are opposites: for Hobbes it is a war of all against all (slide 15); for Rousseau people are peaceful, mutually supportive and inclined to share (slide 34).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE D ============ --&gt;
&lt;section id=&quot;parte-d&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Part D · slides 39–41 + objective 4&lt;/p&gt;
    &lt;h2&gt;Synthesis, limitations and pluralist evaluation&lt;/h2&gt;
    &lt;p&gt;The four theories compared, the limitations of the modern Western approach, and a full pluralist evaluation of the Briberyland case.&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;sintesi&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;12&lt;/span&gt; Major normative theories: a summary&lt;/h2&gt;
    &lt;p&gt;The two tables from &lt;span class=&quot;src&quot;&gt;slides 39–40&lt;/span&gt; (source: Crane et al., 2019) merged into one. Select a theory to highlight its column.&lt;/p&gt;
    &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Highlight theory&quot; id=&quot;tblBtns&quot;&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Ethical egoism&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;Ethics of duty&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;4&quot; aria-pressed=&quot;false&quot;&gt;Rights &amp;amp; Justice&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;
    &lt;table id=&quot;sumTbl&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Ethical egoism&lt;/th&gt;&lt;th&gt;Utilitarianism&lt;/th&gt;&lt;th&gt;Ethics of duty&lt;/th&gt;&lt;th&gt;Rights &amp;amp; Justice&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;td&gt;Consequentialist&lt;/td&gt;&lt;td&gt;Consequentialist&lt;/td&gt;&lt;td&gt;Principle-based&lt;/td&gt;&lt;td&gt;Principle-based&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Leading contributors&lt;/th&gt;&lt;td&gt;Thomas Hobbes&lt;/td&gt;&lt;td&gt;Jeremy Bentham&lt;/td&gt;&lt;td&gt;Immanuel Kant&lt;/td&gt;&lt;td&gt;John Locke, Jean-Jacques Rousseau, John Rawls&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Key works&lt;/th&gt;&lt;td&gt;&lt;em&gt;Leviathan&lt;/em&gt; (Hobbes); &lt;em&gt;The Virtue of Selfishness&lt;/em&gt; (Rand)&lt;/td&gt;&lt;td&gt;&lt;em&gt;An Introduction to the Principles of Morals and Legislation&lt;/em&gt; (Bentham); &lt;em&gt;Utilitarianism&lt;/em&gt;, &lt;em&gt;On Liberty&lt;/em&gt;, &lt;em&gt;Considerations on Representative Government&lt;/em&gt; (J.S. Mill)&lt;/td&gt;&lt;td&gt;&lt;em&gt;Foundations of the Metaphysics of Morals&lt;/em&gt; (Kant)&lt;/td&gt;&lt;td&gt;&lt;em&gt;Two Treatises of Government&lt;/em&gt; (Locke); &lt;em&gt;The Social Contract&lt;/em&gt; (Rousseau); &lt;em&gt;A Theory of Justice&lt;/em&gt; (Rawls)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Focus&lt;/th&gt;&lt;td&gt;Individual desires or interests&lt;/td&gt;&lt;td&gt;Outcomes and collective welfare&lt;/td&gt;&lt;td&gt;Duties&lt;/td&gt;&lt;td&gt;Rights and the nature of justice&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Guiding tenets&lt;/th&gt;&lt;td&gt;Maximise desires / self-interest&lt;/td&gt;&lt;td&gt;Act / rule utilitarianism&lt;/td&gt;&lt;td&gt;Respect for autonomy and rational reasons&lt;/td&gt;&lt;td&gt;Universalisable rules of justice and respect for human beings&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Concept of human beings&lt;/th&gt;&lt;td&gt;Objectively bound to serve only their own interest&lt;/td&gt;&lt;td&gt;Motivated to avoid pain and obtain pleasure&lt;/td&gt;&lt;td&gt;Rational moral actors endowed with free will&lt;/td&gt;&lt;td&gt;Distinguished by dignity&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;Recall &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;: every theory starts from a conception of the human being (last row). Accepting a theory ultimately means accepting that conception.&lt;/div&gt;

    &lt;h3&gt;Limitations of Western modernist theories &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;The slides list six criticisms; the explanations below are added to help understand them.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too abstract&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;General principles far removed from the concrete situations in which managers make decisions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too reductionist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;They reduce moral complexity to a single criterion (utility, duty, rights).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too objective and elitist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;They claim an objective truth established by a few experts — philosophers — rather than by those living the situation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too impersonal&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;They neglect the relationships, emotions, care and character of the decision-maker.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too rational and codified&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;They treat ethics as an algorithm of rules, ignoring intuition and practical judgement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too imperialist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Having originated in Europe, they are imposed as universal on other cultures, such as that of Briberyland.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p&gt;These limitations are the starting point for the &lt;em&gt;“alternative”&lt;/em&gt; theories, the third objective of the overview &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;, which the lecture defers to part II.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;briberyland&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;13&lt;/span&gt; Pluralist evaluation of the Briberyland case&lt;/h2&gt;
    &lt;p&gt;The final objective of the overview is to “conduct a pluralist business ethics evaluation” &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;. Let us try: the case is examined through each theory, and then the verdicts are compared. The slides present the case &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; and compare only absolutism and relativism &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;; the application of the individual theories below is a guided exercise, not an official solution.&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;Verdicts of the different theories on paying the gift&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;text x=&quot;200&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;THEORY&lt;/text&gt;
          &lt;text x=&quot;330&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;PAY&lt;/text&gt;
          &lt;text x=&quot;480&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;IT DEPENDS&lt;/text&gt;
          &lt;text x=&quot;630&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;DON&#x27;T PAY&lt;/text&gt;
          &lt;path d=&quot;M260 32H680&quot; class=&quot;s-rule&quot;/&gt;
          &lt;g id=&quot;lensRows&quot;&gt;&lt;/g&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Each dot shows where a theory&#x27;s verdict tends. Convergence towards the right is the strongest argument of a pluralist evaluation.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Duties&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Justice&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Synthesis&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Desire&lt;/strong&gt;: pay, so the customer is served immediately. &lt;strong&gt;Enlightened self-interest&lt;/strong&gt;: bribery is illegal in the headquarters country and exposes the company to sanctions, future blackmail and reputational damage, so it is better not to pay. The verdict depends on the time horizon, as in the chart in &lt;a href=&quot;#egoism&quot;&gt;section 5&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Act&lt;/strong&gt;: if only the company, the customer and the official are counted, the payment may “win”. &lt;strong&gt;Rule&lt;/strong&gt;: the rule “always pay” harms honest competitors, citizens and institutions in the long run, so do not pay. Try the &lt;a href=&quot;#calc&quot;&gt;calculator&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The maxim “I pay when it suits me” cannot be universalised and uses the official and third parties merely as means, so &lt;strong&gt;do not pay&lt;/strong&gt;, regardless of the consequences (&lt;a href=&quot;#kant&quot;&gt;section 7&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;UN Global Compact: the company must not be complicit in abuses, and the ten principles include anti-corruption. Bribery erodes the rule of law, on which the rights of Briberyland&#x27;s citizens depend. Conclusion: do not pay, and introduce a policy, i.e. &lt;em&gt;due diligence&lt;/em&gt; (&lt;a href=&quot;#rights&quot;&gt;section 9&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Procedural&lt;/strong&gt;: the bribe distorts the rules of the game, because those who do not pay are not free to compete on merit. &lt;strong&gt;Social contract&lt;/strong&gt;: business and government should jointly build a good society, and the bribe prevents this. Conclusion: do not pay (&lt;a href=&quot;#contract&quot;&gt;sections 10–11&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Almost all the lenses converge on &lt;strong&gt;do not pay&lt;/strong&gt;; only short-term egoism and narrow act utilitarianism point the other way. A decision that can be defended to stakeholders (&lt;a href=&quot;#decisione&quot;&gt;section 1&lt;/a&gt;) might be:&lt;/p&gt;
        &lt;ul class=&quot;clean small&quot;&gt;
          &lt;li&gt;refuse the “gift” and accept the &lt;em&gt;legal&lt;/em&gt; inspection (which customs is entitled to carry out);&lt;/li&gt;
          &lt;li&gt;inform the customer immediately of the possible delay and look for logistical solutions;&lt;/li&gt;
          &lt;li&gt;document the request and inform headquarters;&lt;/li&gt;
          &lt;li&gt;ask the company for a clear anti-corruption policy, so as to fill the gap described in the case.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part D&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Match author and theory: Bentham, Kant, Hobbes, Rawls.&lt;/summary&gt;&lt;p&gt;Bentham: utilitarianism; Kant: ethics of duty; Hobbes: ethical egoism; Rawls: rights &amp;amp; justice (slide 39).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What concept of the human being underlies the ethics of duty? And utilitarianism?&lt;/summary&gt;&lt;p&gt;Duty: rational moral actors with free will. Utilitarianism: beings motivated to avoid pain and obtain pleasure (slide 40).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;List the six limitations of Western modernist theories.&lt;/summary&gt;&lt;p&gt;Too abstract, too reductionist, too objective and elitist, too impersonal, too rational and codified, too imperialist (slide 41).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is a pluralist evaluation more convincing than one based on a single theory?&lt;/summary&gt;&lt;p&gt;Because it shows whether theories with different assumptions converge. If they do, the decision is more robust and easier to justify to stakeholders with different values; if they diverge, it makes explicit the trade-offs to be discussed (slides 9, 3).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head slate&quot; style=&quot;--tbg:var(--card)&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Further reading&lt;/p&gt;
    &lt;h2&gt;Authors, texts and documents cited in the slides&lt;/h2&gt;
    &lt;p&gt;For each: bibliographic details, content and why it matters. All information and links in this section are &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;external source&lt;/span&gt;, checked through a web search and kept separate from the slide content. Each entry also indicates the slide on which the reference appears.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Course reference texts&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;em&gt;Business Ethics&lt;/em&gt; (5th ed., 2019)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Oxford University Press, 2019 · full title &lt;em&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt; · ISBN 9780198810070 · cited on slides 12, 39, 40 as “Crane et al. (2019)”&lt;/div&gt;
      &lt;p&gt;The business ethics textbook from which the principle-based/consequentialist diagram and the summary tables are taken. It covers normative theories, stakeholders, corporate citizenship and sustainability.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;Slide 9 refers to the pluralist approach “of our textbook”: this is almost certainly the textbook, although the slides do not say so explicitly.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://search.worldcat.org/oclc/1106086638&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Richard T. De George — &lt;em&gt;Business Ethics&lt;/em&gt; (5th ed., 1999)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Prentice Hall, Upper Saddle River, 1999 · ISBN 0-13-079772-3 · slide 7&lt;/div&gt;
      &lt;p&gt;A classic American business ethics textbook that also addresses international practices, such as bribery in foreign markets.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;It is the source of the distinction between ethical absolutism and ethical relativism as “two extreme positions”.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ci.nii.ac.jp/author/DA00386280&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CiNii (author record)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John R. Boatright — &lt;em&gt;Ethics and the Conduct of Business&lt;/em&gt; (7th ed.)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Pearson · 7th ed. 2012, international edition 2014 · slide 36&lt;/div&gt;
      &lt;p&gt;A textbook devoted to the ethical issues managers face when setting policies towards employees, customers and the public.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;It is the source of the distinction between procedural and distributive justice.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://colectivo.uloyola.es/Record/L74139?lng=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Catalogue record&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Classics of moral philosophy&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Epicurus and hedonism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Greek philosopher (341–270 BC) · slide 15&lt;/div&gt;
      &lt;p&gt;Pleasure, understood above all as the absence of pain and disturbance, is the goal of life.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;He is the forerunner of ethical egoism and of the hedonistic version of utilitarianism.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/epicurus/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Thomas Hobbes — &lt;em&gt;Leviathan&lt;/em&gt; (1651)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slides 15, 39&lt;/div&gt;
      &lt;p&gt;The state of nature is a “war of all against all”; individuals, out of self-interest, surrender power to a sovereign.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the summary table&#x27;s reference for ethical egoism, and the counterpoint to Rousseau&#x27;s state of nature.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/search/?query=leviathan+hobbes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on Project Gutenberg&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/egoism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Egoism&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ayn Rand — &lt;em&gt;The Virtue of Selfishness&lt;/em&gt; (1964)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Collection of essays by Rand and Nathaniel Branden · slides 15, 39&lt;/div&gt;
      &lt;p&gt;It presents rational egoism as an ethical code and criticises altruism; the opening essay is “The Objectivist Ethics”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the most explicit modern defence of egoism as a virtue.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.penguinrandomhouse.com/books/316412/the-virtue-of-selfishness-by-ayn-rand/9780451163936&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Penguin Random House&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Adam Smith — &lt;em&gt;The Wealth of Nations&lt;/em&gt; (1776)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 15 (which gives the year 1793)&lt;/div&gt;
      &lt;p&gt;It contains the famous passage on the “invisible hand”: the merchant who seeks only his own gain promotes an end he did not intend. Smith uses the expression very rarely; the “general” reading is largely a later development.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the most frequently cited economic justification for the pursuit of individual interest, and should be read with the slides&#x27; “(?)” in mind.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://oll.libertyfund.org/quote/249&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Online Library of Liberty&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Milton Friedman — “The Social Responsibility of Business Is to Increase Its Profits” (1970)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;em&gt;The New York Times Magazine&lt;/em&gt;, 13 September 1970 · slide 15&lt;/div&gt;
      &lt;p&gt;He argues that only people have responsibilities and that managers&#x27; duty to shareholders is to make profits while respecting the rules of the game.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the foundational text of shareholder primacy and the starting point of every CSR debate.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annotated text (Fermat&#x27;s Library)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Jeremy Bentham — &lt;em&gt;An Introduction to the Principles of Morals and Legislation&lt;/em&gt; (1789) · John Stuart Mill — &lt;em&gt;Utilitarianism&lt;/em&gt; (1861)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 39&lt;/div&gt;
      &lt;p&gt;Bentham founded utilitarianism and proposed a “felicific calculus” of pleasure and pain (intensity, duration, certainty…). Mill refined it by distinguishing the quality of pleasures.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;They are the founding texts of utilitarianism; the act/rule debate arises from their interpretation.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/An_Introduction_to_the_Principles_of_Morals_and_Legislation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Overview of Bentham&#x27;s work&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/consequentialism-rule/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Rule Consequentialism&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Immanuel Kant — &lt;em&gt;Groundwork / Foundations of the Metaphysics of Morals&lt;/em&gt; (1785)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slides 25–28, 39&lt;/div&gt;
      &lt;p&gt;It presents the categorical imperative as the supreme principle of morality: a rational, objective and unconditional principle, the law of an autonomous will.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the basis of the ethics of duties and of the three maxims.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/kant-moral/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Kant&#x27;s Moral Philosophy&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John Locke — &lt;em&gt;Two Treatises of Government&lt;/em&gt; (1689) · J.-J. Rousseau — &lt;em&gt;The Social Contract&lt;/em&gt; (1762)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slides 31, 34, 39&lt;/div&gt;
      &lt;p&gt;Locke laid the foundations of natural rights (life, liberty, property); Rousseau of the social contract as an agreement between citizens and government.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;They are the roots of the ethics of rights and of social contract theory.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/7370&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Locke, Second Treatise (Gutenberg)&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/search/?query=rousseau+social+contract&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rousseau (Gutenberg)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John Rawls — &lt;em&gt;A Theory of Justice&lt;/em&gt; (1971)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slides 21, 38, 39&lt;/div&gt;
      &lt;p&gt;It introduces the &lt;em&gt;original position&lt;/em&gt; with the veil of ignorance: rational agents unaware of their own position would choose two principles of justice, equal liberty and the difference principle.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the deontological response to the distributive problem of utilitarianism.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/original-position/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Original Position&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Arrow&#x27;s (impossibility) theorem&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Kenneth Arrow, &lt;em&gt;Social Choice and Individual Values&lt;/em&gt; (1951) · slide 21&lt;/div&gt;
      &lt;p&gt;No procedure for aggregating individual ordinal preferences jointly satisfies a few reasonable conditions: unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It shows the formal limit of the utilitarian idea of summing everyone&#x27;s well-being.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/arrows-theorem/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Arrow&#x27;s Theorem&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The trolley problem&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Philippa Foot (1967); Judith Jarvis Thomson, “Killing, Letting Die, and the Trolley Problem” (1976) · slides 22, 29&lt;/div&gt;
      &lt;p&gt;Foot proposed it while discussing the doctrine of double effect; Thomson named it and added the footbridge variant.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the standard thought experiment for comparing consequentialist and deontological intuitions.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/topic/trolley-problem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;International norms and standards&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Global Compact — The Ten Principles&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;United Nations · slides 31, 32&lt;/div&gt;
      &lt;p&gt;Ten voluntary principles for business on human rights (1–2), labour, the environment and anti-corruption, derived among other sources from the Universal Declaration of Human Rights and the UN Convention against Corruption. Respecting rights requires due diligence in order to “do no harm”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the most widespread standard through which companies commit to human rights, and it is directly relevant to the Briberyland case.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unglobalcompact.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights (“Ruggie Principles”, 2011)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;OHCHR, HR/PUB/11/4 · unanimously endorsed by the Human Rights Council, res. 17/4 of 16 June 2011 · slides 31, 33&lt;/div&gt;
      &lt;p&gt;31 principles with commentary, organised in three pillars: the State duty to protect, the corporate responsibility to respect, and access to remedy. They are not a binding treaty, but they clarify the implications of existing standards.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;They are the source of the State/Business/Judiciary model and of human rights due diligence.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.ohchr.org/sites/default/files/Documents/Publications/GuidingPrinciplesBusinessHR_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (OHCHR, PDF)&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;li&gt;Problems with the ethics of duties: &lt;a href=&quot;https://www.youtube.com/watch?v=x_uUEaeqFog&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt;, &lt;a href=&quot;https://www.youtube.com/watch?v=gGczdp0SE0c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/li&gt;

      v.innerHTML=(mode===&#x27;act&#x27;?&#x27;&lt;strong&gt;Act utilitarianism&lt;/strong&gt;: &#x27;:&#x27;&lt;strong&gt;Rule utilitarianism&lt;/strong&gt;: &#x27;)+&#x27;U = &#x27;+(tot&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+tot+&#x27; → &#x27;+
        (tot&gt;0?&#x27;paying the gift comes out as “right”.&#x27;:tot&lt;0?&#x27;paying the gift comes out as “wrong”.&#x27;:&#x27;indifferent: the calculation does not decide.&#x27;);
    }
    draw();
  })();

  // Rawls veil
  (function(){
    var box=document.getElementById(&#x27;veil&#x27;);if(!box)return;
    var soc=[[30,30,30,30,30],[20,40,60,90,140],[45,50,60,75,100]],L=[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;],sel=-1,me=-1,
        svg=document.getElementById(&#x27;veilSvg&#x27;),v=document.getElementById(&#x27;veilV&#x27;),lift=document.getElementById(&#x27;lift&#x27;),
        bs=box.querySelectorAll(&#x27;[data-soc]&#x27;);
    function draw(){
      svg.textContent=&#x27;&#x27;;
      soc.forEach(function(s,g){
        var x0=25+g*215,on=sel===g||sel&lt;0;
        s.forEach(function(val,i){
          var h=val*1.25,x=x0+i*38,mine=sel===g&amp;&amp;me===i;
          svg.appendChild(el(&#x27;rect&#x27;,{x:x,y:200-h,width:30,height:h,rx:3,fill:sel===g?&#x27;oklch(55% .13 25)&#x27;:&#x27;oklch(62% .06 25)&#x27;,opacity:on?1:.3,
            stroke:mine?&#x27;oklch(50% .15 35)&#x27;:&#x27;none&#x27;,&#x27;stroke-width&#x27;:mine?3:0}));
          svg.appendChild(el(&#x27;text&#x27;,{x:x+15,y:195-h,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;class&#x27;:&#x27;f-ink2&#x27;},val));
          if(mine)svg.appendChild(el(&#x27;text&#x27;,{x:x+15,y:180-h,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:12,&#x27;font-weight&#x27;:700,&#x27;class&#x27;:&#x27;f-acc&#x27;},&#x27;YOU&#x27;));
        });
        var sum=s.reduce(function(a,b){return a+b;},0);
        svg.appendChild(el(&#x27;text&#x27;,{x:x0+92,y:222,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:14,&#x27;font-weight&#x27;:600,opacity:on?1:.45},&#x27;Society &#x27;+L[g]));
        svg.appendChild(el(&#x27;text&#x27;,{x:x0+92,y:240,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;class&#x27;:&#x27;f-ink2&#x27;},&#x27;total &#x27;+sum+&#x27; · minimum &#x27;+Math.min.apply(null,s)));
      });
    }
    bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      sel=+b.dataset.soc;me=-1;bs.forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,String(x===b));});
      lift.disabled=false;v.innerHTML=&#x27;You have chosen society &lt;strong&gt;&#x27;+L[sel]+&#x27;&lt;/strong&gt;. Now lift the veil: which position will you get?&#x27;;draw();});});
    lift.addEventListener(&#x27;click&#x27;,function(){
      me=Math.floor(Math.random()*5);var val=soc[sel][me],min=Math.min.apply(null,soc[sel]);
      v.innerHTML=&#x27;You have ended up in position &#x27;+(me+1)+&#x27; of society &#x27;+L[sel]+&#x27; with an income of &lt;strong&gt;&#x27;+val+&#x27;&lt;/strong&gt;.&#x27;+
        (val===min?&#x27; You are among the least advantaged: this is exactly the case Rawls asks us to consider.&#x27;:&#x27; But you could have got &#x27;+min+&#x27;.&#x27;)+&#x27; Try again or change society.&#x27;;
      draw();});
    draw();
  })();

  // summary table highlight
  (function(){
    var bs=document.querySelectorAll(&#x27;#tblBtns [data-c]&#x27;),t=document.getElementById(&#x27;sumTbl&#x27;);if(!t)return;
    bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var on=b.getAttribute(&#x27;aria-pressed&#x27;)!==&#x27;true&#x27;,c=+b.dataset.c;
      bs.forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);});if(on)b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
      [].forEach.call(t.rows,function(row){[].forEach.call(row.cells,function(cell,j){cell.classList.toggle(&#x27;hi&#x27;,on&amp;&amp;j===c);});});
    });});
  })();

  // lens chart
  (function(){
    var g=document.getElementById(&#x27;lensRows&#x27;);if(!g)return;
    var rows=[[&#x27;Absolutism&#x27;,1,250],[&#x27;Relativism&#x27;,.5,85],[&#x27;Egoism · desire&#x27;,0,150],[&#x27;Egoism · enlightened&#x27;,1,150],[&#x27;Act utilitarianism&#x27;,.25,150],[&#x27;Rule utilitarianism&#x27;,1,150],[&#x27;Ethics of duties (Kant)&#x27;,1,25],[&#x27;Rights / UN Global Compact&#x27;,1,25],[&#x27;Justice / social contract&#x27;,1,25]];
    rows.forEach(function(r,i){
      var y=56+i*27,x=330+r[1]*300;
      g.appendChild(el(&#x27;text&#x27;,{x:250,y:y+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;,&#x27;font-size&#x27;:13},r[0]));
      g.appendChild(el(&#x27;line&#x27;,{x1:330,x2:630,y1:y,y2:y,&#x27;class&#x27;:&#x27;s-rule&#x27;}));
      g.appendChild(el(&#x27;circle&#x27;,{cx:x,cy:y,r:8,fill:&#x27;oklch(58% .12 &#x27;+r[2]+&#x27;)&#x27;}));
    });
  })();
})();
