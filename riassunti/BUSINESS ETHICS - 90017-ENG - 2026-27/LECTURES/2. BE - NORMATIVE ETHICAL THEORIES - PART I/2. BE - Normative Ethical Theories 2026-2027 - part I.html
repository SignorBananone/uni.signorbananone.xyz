      &lt;figcaption&gt;Schema dalla &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;: c) e d) sono raccolti sotto &lt;em&gt;corporate citizenship&lt;/em&gt;; tutto converge nella &lt;em&gt;human rights due diligence&lt;/em&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Due termini&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Human rights due diligence&lt;/strong&gt;: il processo continuativo con cui un&#x27;impresa individua, previene, mitiga e rende conto degli impatti sui diritti umani delle proprie attività e della propria catena del valore.&lt;br&gt;&lt;strong&gt;Corporate citizenship&lt;/strong&gt;: l&#x27;impresa vista come “cittadino” della società, con un ruolo attivo nel proteggere e promuovere i diritti, non solo nell&#x27;evitare danni.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;contract&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt; Social contract theory — J.-J. Rousseau&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione · slide 34&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Social contract&lt;/strong&gt;: un &lt;em&gt;accordo ipotetico&lt;/em&gt; tra i membri di una società e chi la governa, che stabilisce su basi eque le relazioni, i diritti e le responsabilità reciproche.&lt;/p&gt;&lt;/div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;Serve a &lt;strong&gt;determinare le responsabilità delle imprese&lt;/strong&gt;: che cosa la società può legittimamente aspettarsi da loro.&lt;/li&gt;
      &lt;li&gt;Diritti, obblighi e giustizia legano tra loro i membri della società.&lt;/li&gt;
      &lt;li&gt;Imprese e governo collaborano per creare una buona società.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Ogni teoria contrattualista parte da un&#x27;idea diversa di &lt;dfn&gt;state of nature&lt;/dfn&gt; (stato di natura: come vivrebbero le persone senza istituzioni). Confronta i quattro autori della lezione:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hobbes&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Locke&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rousseau&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rawls&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;War of all against all.&lt;/strong&gt; Ognuno persegue il proprio interesse: serve un potere forte (il &lt;em&gt;Leviathan&lt;/em&gt;) per garantire la pace. È la base filosofica dell&#x27;egoism. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Gli esseri umani hanno &lt;strong&gt;natural rights&lt;/strong&gt; a vita, libertà e proprietà; le istituzioni esistono per proteggerli. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Le persone sono &lt;strong&gt;pacifiche e gentili&lt;/strong&gt;, vivono in modo solidale e semplice; tutti hanno interesse a passarsi e condividere conoscenza, arte, informazione. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Persone &lt;strong&gt;uguali, libere e razionali&lt;/strong&gt; che cercano il proprio interesse, ma che scelgono le regole dietro un &lt;em&gt;veil of ignorance&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt; → &lt;a href=&quot;#justice&quot;&gt;sezione 11&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;justice&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;11&lt;/span&gt; Justice: procedures, outcomes, Rawls&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione · slide 35&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Justice&lt;/strong&gt;: il trattamento &lt;em&gt;simultaneamente&lt;/em&gt; equo degli individui in una data situazione, con il risultato che ciascuno ottiene ciò che merita.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;Due domande morali cruciali: che cosa significa esattamente &lt;em&gt;fairness&lt;/em&gt; (equità) in una situazione specifica? Con quali criteri si stabilisce che cosa una persona può ragionevolmente meritare? &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/p&gt;

    &lt;h3&gt;Procedural vs distributive justice &lt;span class=&quot;src&quot;&gt;slide 36&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Distinzione proposta da Boatright (2014). Prova sull&#x27;esempio di un bonus di fine anno:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Fair procedures&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Fair outcomes&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Procedural justice&lt;/strong&gt;: l&#x27;equità dipende dal fatto che ciascuno sia stato &lt;strong&gt;libero di ottenere ricompense per i propri sforzi&lt;/strong&gt;. Conta il processo, non il risultato.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Bonus: regole chiare e uguali per tutti, comunicate in anticipo, criteri trasparenti. Se le regole sono giuste, la distribuzione che ne risulta è giusta, anche se molto diseguale.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Distributive justice&lt;/strong&gt;: l&#x27;equità dipende dal fatto che le conseguenze (positive e negative) siano &lt;strong&gt;distribuite in modo giusto&lt;/strong&gt;, secondo un principio come il &lt;strong&gt;bisogno&lt;/strong&gt; o il &lt;strong&gt;merito&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Bonus: si guarda a chi alla fine riceve quanto. Per merito, più a chi ha contribuito di più; per bisogno, più a chi ha redditi bassi.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;John Rawls — &lt;em&gt;A Theory of Justice&lt;/em&gt; &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Rawls immagina uno &lt;strong&gt;state of nature&lt;/strong&gt; in cui le persone sono uguali, libere e razionali e cercano il proprio interesse, ma decidono le regole della società dietro un &lt;dfn&gt;veil of ignorance&lt;/dfn&gt; (velo di ignoranza): non sanno che posto occuperanno, se saranno ricchi o poveri, sani o malati, di quale genere o religione. Così nessuno può scegliere regole a proprio vantaggio.&lt;/p&gt;
    &lt;p&gt;Una società è giusta quando:&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Liberty principle&lt;/strong&gt; (principio di libertà): ognuno ha uguale diritto al più esteso sistema di libertà fondamentali compatibile con un sistema simile di libertà per tutti.&lt;/li&gt;
      &lt;li&gt;Le disuguaglianze sociali ed economiche sono ammesse solo se:
        &lt;ol type=&quot;a&quot;&gt;
          &lt;li&gt;vanno a &lt;strong&gt;massimo beneficio dei meno avvantaggiati&lt;/strong&gt; → &lt;dfn&gt;difference principle&lt;/dfn&gt; (principio di differenza);&lt;/li&gt;
          &lt;li&gt;sono legate a cariche e posizioni aperte a tutti in condizioni di equa uguaglianza di opportunità → &lt;dfn&gt;equal opportunity principle&lt;/dfn&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/li&gt;
    &lt;/ol&gt;

    &lt;h3&gt;Simulatore: scegli dietro il velo&lt;/h3&gt;
    &lt;p&gt;Tre società, cinque posizioni sociali ciascuna (reddito in unità). Sai com&#x27;è fatta ogni società, ma non quale posizione toccherà a te. Scegli, poi solleva il velo.&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;veil&quot;&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Scegli una società&quot;&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;Società A&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Società B&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-soc=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;Società C&lt;/button&gt;
        &lt;button class=&quot;btn pri&quot; id=&quot;lift&quot; disabled&gt;Solleva il velo&lt;/button&gt;
      &lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 660 250&quot; id=&quot;veilSvg&quot; role=&quot;img&quot; aria-label=&quot;Redditi delle cinque posizioni nelle tre società&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;veilV&quot;&gt;Scegli una società.&lt;/div&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Che cosa sceglierebbero un utilitarista e Rawls?&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;&lt;strong&gt;Utilitarista&lt;/strong&gt;: la società &lt;strong&gt;B&lt;/strong&gt;, perché ha il totale più alto (350). Che chi sta in fondo abbia solo 20 non conta, purché la somma sia massima: è il problema “those starting from worse conditions” della &lt;a href=&quot;#utilitarianism&quot;&gt;slide 21&lt;/a&gt;.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Rawls&lt;/strong&gt;: la società &lt;strong&gt;C&lt;/strong&gt;. Dietro il velo una persona razionale si chiede “e se finissi in fondo?” e sceglie la società in cui il peggiore sta meglio (45 contro 30 e 20). C è diseguale, ma la disuguaglianza avvantaggia anche i meno avvantaggiati rispetto ad A: è il difference principle.&lt;/p&gt;
        &lt;p class=&quot;small muted&quot;&gt;Numeri illustrativi. La regola di scegliere l&#x27;opzione col “peggior caso” migliore si chiama &lt;em&gt;maximin&lt;/em&gt;.&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Video indicato come importante nella slide 38: &lt;a href=&quot;https://youtu.be/n6k08C699zI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Theory of Justice&lt;/a&gt;. La numerazione passa da 36 a 38: la slide 37 non è presente nel PDF.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte C&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa significano “categorical” e “imperative”?&lt;/summary&gt;&lt;p&gt;Categorical = universale e senza condizioni; imperative = comando da seguire (slide 26).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Enuncia le tre maxims del categorical imperative.&lt;/summary&gt;&lt;p&gt;1) Consistency: agisci solo secondo una massima che puoi volere come legge universale. 2) Human dignity: tratta l&#x27;umanità, in te e negli altri, sempre anche come fine e mai solo come mezzo. 3) Universality: agisci in modo che la tua volontà possa considerarsi legislatrice universale, cioè approvabile da tutti gli agenti razionali (slide 28).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nel trolley problem, perché sia l&#x27;utilitarista sia il kantiano trattano le due versioni allo stesso modo?&lt;/summary&gt;&lt;p&gt;L&#x27;utilitarista vede in entrambe 1 vita contro 5 e sacrifica 1; il kantiano vede in entrambe una vita incommensurabile da non usare come mezzo e non interviene. La differenza che percepiamo dipende da agency/responsabilità e dal coinvolgimento della terza persona (slide 29).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i tre pilastri degli UN Guiding Principles e a chi spettano?&lt;/summary&gt;&lt;p&gt;State: duty to protect; Business: responsibility to respect; Judiciary: remedy per le vittime (slide 33).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra procedural e distributive justice?&lt;/summary&gt;&lt;p&gt;La procedurale guarda all&#x27;equità del processo (tutti liberi di ottenere ricompense per i propri sforzi); la distributiva all&#x27;equità della distribuzione finale secondo un principio come bisogno o merito (slide 36, Boatright 2014).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa dice il difference principle di Rawls?&lt;/summary&gt;&lt;p&gt;Le disuguaglianze sociali ed economiche sono giuste solo se vanno a massimo beneficio dei meno avvantaggiati (slide 38).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Come si collega lo stato di natura di Rousseau a quello di Hobbes?&lt;/summary&gt;&lt;p&gt;Sono opposti: per Hobbes è una guerra di tutti contro tutti (slide 15), per Rousseau le persone sono pacifiche, solidali e propense a condividere (slide 34).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE D ============ --&gt;
&lt;section id=&quot;parte-d&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Parte D · slide 39–41 + obiettivo 4&lt;/p&gt;
    &lt;h2&gt;Sintesi, limiti e valutazione pluralista&lt;/h2&gt;
    &lt;p&gt;Le quattro teorie a confronto, i limiti dell&#x27;approccio occidentale moderno e una valutazione pluralista completa del caso Briberyland.&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;sintesi&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;12&lt;/span&gt; Major normative theories: a summary&lt;/h2&gt;
    &lt;p&gt;Le due tabelle delle &lt;span class=&quot;src&quot;&gt;slide 39–40&lt;/span&gt; (fonte: Crane et al., 2019) riunite in una. Seleziona una teoria per evidenziarne la colonna.&lt;/p&gt;
    &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Evidenzia teoria&quot; id=&quot;tblBtns&quot;&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Ethical egoism&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;Ethics of duty&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-c=&quot;4&quot; aria-pressed=&quot;false&quot;&gt;Rights &amp;amp; Justice&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tbl&quot;&gt;
    &lt;table id=&quot;sumTbl&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Ethical egoism&lt;/th&gt;&lt;th&gt;Utilitarianism&lt;/th&gt;&lt;th&gt;Ethics of duty&lt;/th&gt;&lt;th&gt;Rights &amp;amp; Justice&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;td&gt;Consequentialist&lt;/td&gt;&lt;td&gt;Consequentialist&lt;/td&gt;&lt;td&gt;Principle-based&lt;/td&gt;&lt;td&gt;Principle-based&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Leading contributors&lt;/th&gt;&lt;td&gt;Thomas Hobbes&lt;/td&gt;&lt;td&gt;Jeremy Bentham&lt;/td&gt;&lt;td&gt;Immanuel Kant&lt;/td&gt;&lt;td&gt;John Locke, Jean-Jacques Rousseau, John Rawls&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Key works&lt;/th&gt;&lt;td&gt;&lt;em&gt;Leviathan&lt;/em&gt; (Hobbes); &lt;em&gt;The Virtue of Selfishness&lt;/em&gt; (Rand)&lt;/td&gt;&lt;td&gt;&lt;em&gt;An Introduction to the Principles of Morals and Legislation&lt;/em&gt; (Bentham); &lt;em&gt;Utilitarianism&lt;/em&gt;, &lt;em&gt;On Liberty&lt;/em&gt;, &lt;em&gt;Considerations on Representative Government&lt;/em&gt; (J.S. Mill)&lt;/td&gt;&lt;td&gt;&lt;em&gt;Foundations of the Metaphysics of Morals&lt;/em&gt; (Kant)&lt;/td&gt;&lt;td&gt;&lt;em&gt;Two Treatises of Government&lt;/em&gt; (Locke); &lt;em&gt;The Social Contract&lt;/em&gt; (Rousseau); &lt;em&gt;A Theory of Justice&lt;/em&gt; (Rawls)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Focus&lt;/th&gt;&lt;td&gt;Desideri o interessi individuali&lt;/td&gt;&lt;td&gt;Outcomes e benessere collettivo&lt;/td&gt;&lt;td&gt;Doveri&lt;/td&gt;&lt;td&gt;Diritti e natura della giustizia&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Guiding tenets&lt;/th&gt;&lt;td&gt;Massimizzare desideri / interesse personale&lt;/td&gt;&lt;td&gt;Act / rule utilitarianism&lt;/td&gt;&lt;td&gt;Rispetto dell&#x27;autonomia e ragioni razionali&lt;/td&gt;&lt;td&gt;Regole universalizzabili sulla giustizia e rispetto per gli esseri umani&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Concept of human beings&lt;/th&gt;&lt;td&gt;Oggettivamente obbligati a servire solo il proprio interesse&lt;/td&gt;&lt;td&gt;Motivati da evitare il dolore e ottenere piacere&lt;/td&gt;&lt;td&gt;Attori morali razionali dotati di libero arbitrio&lt;/td&gt;&lt;td&gt;Distinti dalla dignità&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;Ricorda la &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;: ogni teoria parte da un&#x27;idea dell&#x27;essere umano (ultima riga). Accettare una teoria significa, in fondo, accettare quell&#x27;idea.&lt;/div&gt;

    &lt;h3&gt;Limiti delle teorie Western modernist &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Le slide elencano sei critiche; le spiegazioni sotto sono un&#x27;aggiunta per capirle meglio.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too abstract&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Principi generali lontani dalle situazioni concrete in cui i manager decidono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too reductionist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Riducono la complessità morale a un solo criterio (utilità, dovere, diritto).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too objective and elitist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Pretendono una verità oggettiva stabilita da pochi esperti, filosofi, e non da chi vive la situazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too impersonal&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Trascurano relazioni, emozioni, cura e carattere di chi decide.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too rational and codified&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Trattano l&#x27;etica come un algoritmo di regole, ignorando intuizione e giudizio pratico.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Too imperialist&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;small&quot;&gt;Nate in Europa, vengono imposte come universali ad altre culture, come quella di Briberyland.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;p&gt;Da questi limiti partono le teorie &lt;em&gt;“alternative”&lt;/em&gt;, terzo obiettivo dell&#x27;overview &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;, che la lezione rimanda alla parte II.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;briberyland&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;13&lt;/span&gt; Valutazione pluralista del caso Briberyland&lt;/h2&gt;
    &lt;p&gt;L&#x27;obiettivo finale dell&#x27;overview è “conduct a pluralist business ethics evaluation” &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;. Proviamo: si guarda il caso con ogni teoria, poi si confrontano i verdetti. Le slide pongono il caso &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; e confrontano solo absolutism e relativism &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;; l&#x27;applicazione delle singole teorie qui sotto è un esercizio guidato, non una soluzione ufficiale.&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;Verdetti delle diverse teorie sul pagamento del gift&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;text x=&quot;200&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;TEORIA&lt;/text&gt;
          &lt;text x=&quot;330&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;PAGA&lt;/text&gt;
          &lt;text x=&quot;480&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;DIPENDE&lt;/text&gt;
          &lt;text x=&quot;630&quot; y=&quot;22&quot; font-weight=&quot;600&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;NON PAGARE&lt;/text&gt;
          &lt;path d=&quot;M260 32H680&quot; class=&quot;s-rule&quot;/&gt;
          &lt;g id=&quot;lensRows&quot;&gt;&lt;/g&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ogni punto indica dove tende il verdetto di una teoria. La convergenza verso destra è l&#x27;argomento più forte di una valutazione pluralista.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Duties&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Justice&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sintesi&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Desire&lt;/strong&gt;: pagare, così il cliente è servito subito. &lt;strong&gt;Enlightened self-interest&lt;/strong&gt;: la corruzione è illegale nel Paese della sede, espone a sanzioni, ricatti futuri e danni reputazionali, quindi conviene non pagare. Il verdetto dipende dall&#x27;orizzonte, come nel grafico della &lt;a href=&quot;#egoism&quot;&gt;sezione 5&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Act&lt;/strong&gt;: se si contano solo azienda, cliente e funzionario, il pagamento può “vincere”. &lt;strong&gt;Rule&lt;/strong&gt;: la regola “si paga sempre” danneggia concorrenti onesti, cittadini e istituzioni nel lungo periodo, quindi non pagare. Prova il &lt;a href=&quot;#calc&quot;&gt;calcolatore&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;La maxim “pago quando mi conviene” non è universalizzabile e usa il funzionario e i terzi solo come mezzi, quindi &lt;strong&gt;non pagare&lt;/strong&gt;, a prescindere dalle conseguenze (&lt;a href=&quot;#kant&quot;&gt;sezione 7&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;UN Global Compact: l&#x27;impresa non deve essere complice di abusi, e i dieci principi includono l&#x27;anticorruzione. La corruzione erode lo stato di diritto, da cui dipendono i diritti dei cittadini di Briberyland. Conclusione: non pagare, e introdurre una policy, cioè la &lt;em&gt;due diligence&lt;/em&gt; (&lt;a href=&quot;#rights&quot;&gt;sezione 9&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Procedural&lt;/strong&gt;: la tangente altera le regole del gioco, perché chi non paga non è libero di competere sul merito. &lt;strong&gt;Social contract&lt;/strong&gt;: imprese e governo dovrebbero costruire insieme una buona società, e la tangente lo impedisce. Conclusione: non pagare (&lt;a href=&quot;#contract&quot;&gt;sezioni 10–11&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Quasi tutte le lenti convergono su &lt;strong&gt;non pagare&lt;/strong&gt;; solo l&#x27;egoismo di breve periodo e l&#x27;act utilitarianism ristretto vanno in direzione opposta. Una decisione difendibile davanti agli stakeholders (&lt;a href=&quot;#decisione&quot;&gt;sezione 1&lt;/a&gt;) potrebbe essere:&lt;/p&gt;
        &lt;ul class=&quot;clean small&quot;&gt;
          &lt;li&gt;rifiutare il “gift” e accettare l&#x27;ispezione &lt;em&gt;legale&lt;/em&gt; (che è un diritto della dogana);&lt;/li&gt;
          &lt;li&gt;avvisare subito il cliente del possibile ritardo e cercare soluzioni logistiche;&lt;/li&gt;
          &lt;li&gt;documentare la richiesta e informare la sede centrale;&lt;/li&gt;
          &lt;li&gt;chiedere all&#x27;azienda una policy anticorruzione chiara, così da colmare il vuoto descritto nel caso.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte D&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Abbina autore e teoria: Bentham, Kant, Hobbes, Rawls.&lt;/summary&gt;&lt;p&gt;Bentham: utilitarianism; Kant: ethics of duty; Hobbes: ethical egoism; Rawls: rights &amp;amp; justice (slide 39).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale concetto di essere umano sta dietro l&#x27;ethics of duty? E dietro l&#x27;utilitarianism?&lt;/summary&gt;&lt;p&gt;Duty: attori morali razionali con free will. Utilitarianism: esseri motivati dall&#x27;evitare il dolore e ottenere il piacere (slide 40).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Elenca i sei limiti delle teorie Western modernist.&lt;/summary&gt;&lt;p&gt;Too abstract, too reductionist, too objective and elitist, too impersonal, too rational and codified, too imperialist (slide 41).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché una valutazione pluralista è più convincente di una basata su una sola teoria?&lt;/summary&gt;&lt;p&gt;Perché mostra se teorie con assunzioni diverse convergono. Se convergono, la decisione è più robusta e più facile da giustificare a stakeholders con valori diversi; se divergono, rende espliciti i trade-off da discutere (slide 9, 3).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

    &lt;p class=&quot;kicker&quot;&gt;Per approfondire&lt;/p&gt;
    &lt;h2&gt;Autori, testi e documenti citati nelle slide&lt;/h2&gt;
    &lt;p&gt;Per ognuno: dati bibliografici, contenuto e perché conta. Tutte le informazioni e i link di questa sezione sono &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;fonte esterna&lt;/span&gt;, verificati con una ricerca web e distinti dal contenuto delle slide. Le schede indicano anche in quale slide compare il riferimento.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Testi di riferimento del corso&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;em&gt;Business Ethics&lt;/em&gt; (5ª ed., 2019)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Oxford University Press, 2019 · titolo completo &lt;em&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt; · ISBN 9780198810070 · citato nelle slide 12, 39, 40 come “Crane et al. (2019)”&lt;/div&gt;
      &lt;p&gt;Il manuale di business ethics da cui provengono lo schema principle-based/consequentialist e le tabelle riassuntive. Copre teorie normative, stakeholder, corporate citizenship e sostenibilità.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;Le slide 9 parlano dell&#x27;approccio pluralista “of our textbook”: è quasi certamente questo il libro di testo, anche se le slide non lo dicono in modo esplicito.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://search.worldcat.org/oclc/1106086638&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Richard T. De George — &lt;em&gt;Business Ethics&lt;/em&gt; (5ª ed., 1999)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Prentice Hall, Upper Saddle River, 1999 · ISBN 0-13-079772-3 · slide 7&lt;/div&gt;
      &lt;p&gt;Classico manuale americano di business ethics che affronta anche le pratiche internazionali, come la corruzione nei mercati esteri.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;È la fonte della distinzione tra ethical absolutism ed ethical relativism come “due posizioni estreme”.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ci.nii.ac.jp/author/DA00386280&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CiNii (record autore)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John R. Boatright — &lt;em&gt;Ethics and the Conduct of Business&lt;/em&gt; (7ª ed.)&lt;/h4&gt;
      &lt;div class=&quot;bib&quot;&gt;Pearson · 7ª ed. 2012, edizione internazionale 2014 · slide 36&lt;/div&gt;
      &lt;p&gt;Manuale dedicato ai problemi etici che i manager affrontano nel definire le politiche verso dipendenti, clienti e pubblico.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;È la fonte della distinzione tra procedural e distributive justice.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://colectivo.uloyola.es/Record/L74139?lng=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record di catalogo&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Classici della filosofia morale&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Epicuro e l&#x27;hedonism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Filosofo greco (341–270 a.C.) · slide 15&lt;/div&gt;
      &lt;p&gt;Il piacere, inteso soprattutto come assenza di dolore e turbamento, è il fine della vita.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È l&#x27;antenato dell&#x27;ethical egoism e della versione hedonistic dell&#x27;utilitarianism.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/epicurus/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Thomas Hobbes — &lt;em&gt;Leviathan&lt;/em&gt; (1651)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 15, 39&lt;/div&gt;
      &lt;p&gt;Lo stato di natura è una “guerra di tutti contro tutti”; gli individui, per interesse, cedono potere a un sovrano.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È il riferimento della tabella di sintesi per l&#x27;ethical egoism, ed è il contrappunto allo stato di natura di Rousseau.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/search/?query=leviathan+hobbes&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su Project Gutenberg&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/egoism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Egoism&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ayn Rand — &lt;em&gt;The Virtue of Selfishness&lt;/em&gt; (1964)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Raccolta di saggi di Rand e Nathaniel Branden · slide 15, 39&lt;/div&gt;
      &lt;p&gt;Presenta l&#x27;egoismo razionale come codice etico e critica l&#x27;altruismo; il saggio d&#x27;apertura è “The Objectivist Ethics”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la difesa moderna più esplicita dell&#x27;egoism come virtù.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.penguinrandomhouse.com/books/316412/the-virtue-of-selfishness-by-ayn-rand/9780451163936&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Penguin Random House&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Adam Smith — &lt;em&gt;The Wealth of Nations&lt;/em&gt; (1776)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 15 (che riporta l&#x27;anno 1793)&lt;/div&gt;
      &lt;p&gt;Contiene il celebre passo sulla “mano invisibile”: il mercante che cerca solo il proprio guadagno promuove un fine che non intendeva. Smith usa l&#x27;espressione pochissime volte; la lettura “generale” è in gran parte successiva.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la giustificazione economica più citata del perseguimento dell&#x27;interesse individuale, e va letta con il “(?)” delle slide.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://oll.libertyfund.org/quote/249&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Online Library of Liberty&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Milton Friedman — “The Social Responsibility of Business Is to Increase Its Profits” (1970)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;&lt;em&gt;The New York Times Magazine&lt;/em&gt;, 13 settembre 1970 · slide 15&lt;/div&gt;
      &lt;p&gt;Sostiene che solo le persone hanno responsabilità e che il dovere dei manager verso gli azionisti è fare profitti nel rispetto delle regole del gioco.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È il testo base della shareholder primacy e il punto di partenza di ogni dibattito sulla CSR.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo annotato (Fermat&#x27;s Library)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Jeremy Bentham — &lt;em&gt;An Introduction to the Principles of Morals and Legislation&lt;/em&gt; (1789) · John Stuart Mill — &lt;em&gt;Utilitarianism&lt;/em&gt; (1861)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 39&lt;/div&gt;
      &lt;p&gt;Bentham fonda l&#x27;utilitarismo e propone un “calcolo felicifico” di piacere e dolore (intensità, durata, certezza…). Mill lo raffina distinguendo la qualità dei piaceri.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Sono i testi fondativi dell&#x27;utilitarianism; il dibattito act/rule nasce dalla loro interpretazione.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/An_Introduction_to_the_Principles_of_Morals_and_Legislation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;opera di Bentham&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/consequentialism-rule/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Rule Consequentialism&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Immanuel Kant — &lt;em&gt;Groundwork / Foundations of the Metaphysics of Morals&lt;/em&gt; (1785)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 25–28, 39&lt;/div&gt;
      &lt;p&gt;Presenta il categorical imperative come principio supremo della morale: un principio razionale, oggettivo e incondizionato, legge di una volontà autonoma.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la base dell&#x27;ethics of duties e delle tre maxims.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/kant-moral/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Kant&#x27;s Moral Philosophy&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John Locke — &lt;em&gt;Two Treatises of Government&lt;/em&gt; (1689) · J.-J. Rousseau — &lt;em&gt;The Social Contract&lt;/em&gt; (1762)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 31, 34, 39&lt;/div&gt;
      &lt;p&gt;Locke fonda i natural rights (vita, libertà, proprietà); Rousseau il contratto sociale come accordo tra cittadini e governo.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Sono le radici dell&#x27;ethics of rights e della social contract theory.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/7370&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Locke, Second Treatise (Gutenberg)&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.gutenberg.org/ebooks/search/?query=rousseau+social+contract&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rousseau (Gutenberg)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;John Rawls — &lt;em&gt;A Theory of Justice&lt;/em&gt; (1971)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;slide 21, 38, 39&lt;/div&gt;
      &lt;p&gt;Introduce la &lt;em&gt;original position&lt;/em&gt; con il veil of ignorance: agenti razionali che ignorano la propria posizione sceglierebbero due principi di giustizia, uguali libertà e difference principle.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la risposta deontologica al problema distributivo dell&#x27;utilitarianism.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/original-position/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Original Position&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Arrow&#x27;s (impossibility) theorem&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Kenneth Arrow, &lt;em&gt;Social Choice and Individual Values&lt;/em&gt; (1951) · slide 21&lt;/div&gt;
      &lt;p&gt;Nessuna procedura di aggregazione delle preferenze individuali ordinali soddisfa insieme alcune condizioni ragionevoli: dominio non ristretto, Pareto, indipendenza dalle alternative irrilevanti, assenza di dittatore.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Mostra il limite formale dell&#x27;idea utilitarista di sommare il benessere di tutti.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/arrows-theorem/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEP: Arrow&#x27;s Theorem&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Il trolley problem&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Philippa Foot (1967); Judith Jarvis Thomson, “Killing, Letting Die, and the Trolley Problem” (1976) · slide 22, 29&lt;/div&gt;
      &lt;p&gt;Foot lo propone discutendo la dottrina del doppio effetto; Thomson gli dà il nome e aggiunge la variante del ponte.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È l&#x27;esperimento mentale standard per confrontare intuizioni consequentialist e deontological.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/topic/trolley-problem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme e standard internazionali&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Global Compact — The Ten Principles&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Nazioni Unite · slide 31, 32&lt;/div&gt;
      &lt;p&gt;Dieci principi volontari per le imprese su diritti umani (1–2), lavoro, ambiente e anticorruzione, derivati tra l&#x27;altro dalla Dichiarazione universale dei diritti umani e dalla Convenzione ONU contro la corruzione. Il rispetto dei diritti richiede una due diligence per non danneggiare (“do no harm”).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È lo standard più diffuso con cui le imprese si impegnano sui diritti umani, ed è direttamente rilevante per il caso Briberyland.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unglobalcompact.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Guiding Principles on Business and Human Rights (“Ruggie Principles”, 2011)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;OHCHR, HR/PUB/11/4 · approvati all&#x27;unanimità dal Consiglio per i diritti umani, ris. 17/4 del 16 giugno 2011 · slide 31, 33&lt;/div&gt;
      &lt;p&gt;31 principi con commento, organizzati in tre pilastri: dovere dello Stato di proteggere, responsabilità d&#x27;impresa di rispettare, accesso ai rimedi. Non sono un trattato vincolante, ma precisano le implicazioni degli standard esistenti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Sono la fonte del modello State/Business/Judiciary e della human rights due diligence.&lt;/p&gt;
      &lt;div class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.ohchr.org/sites/default/files/Documents/Publications/GuidingPrinciplesBusinessHR_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (OHCHR, PDF)&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://digitallibrary.un.org/record/720245&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Video indicati nelle slide&lt;/h3&gt;
  &lt;ul class=&quot;clean small&quot;&gt;
    &lt;li&gt;Trolley problem: &lt;a href=&quot;https://www.youtube.com/watch?v=bOpf6KcWYyw&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt;, &lt;a href=&quot;https://youtu.be/yg16u_bzjPE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2 (nuovo link)&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Problemi dell&#x27;ethics of duties: &lt;a href=&quot;https://www.youtube.com/watch?v=x_uUEaeqFog&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt;, &lt;a href=&quot;https://www.youtube.com/watch?v=gGczdp0SE0c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Theory of Justice (Rawls), indicato come importante: &lt;a href=&quot;https://youtu.be/n6k08C699zI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;
