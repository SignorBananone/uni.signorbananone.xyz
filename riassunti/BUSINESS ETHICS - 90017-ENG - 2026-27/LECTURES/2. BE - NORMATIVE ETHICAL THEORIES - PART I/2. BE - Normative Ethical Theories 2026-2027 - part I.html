&lt;!-- ============ PARTE A ============ --&gt;
&lt;section id=&quot;parte-a&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Parte A · slide 3–13&lt;/p&gt;
    &lt;h2&gt;Fondamenti: perché serve una teoria&lt;/h2&gt;
    &lt;p&gt;Che cosa sono le teorie normative, quali posizioni di partenza si possono prendere (assoluta, relativa, pluralista) e come le teorie tradizionali si dividono in due grandi famiglie.&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;decisione&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt; Ethical decision in business&lt;/h2&gt;
    &lt;p&gt;In azienda le decisioni non riguardano solo chi le prende: toccano dipendenti, clienti, fornitori, comunità, azionisti. Questi soggetti si chiamano &lt;dfn&gt;stakeholders&lt;/dfn&gt; (i portatori di interesse: chiunque influenza o è influenzato dall&#x27;attività dell&#x27;impresa). Per questo una decisione etica in business deve poggiare su un &lt;strong&gt;systematic rationale&lt;/strong&gt; (un ragionamento sistematico) e su argomenti comprensibili a tutti, così da poter essere &lt;strong&gt;defended, justified and explained&lt;/strong&gt;: difesa, giustificata e spiegata a chi ne subisce gli effetti. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;Le teorie etiche servono proprio a questo: forniscono la “grammatica” con cui costruire e comunicare la giustificazione.&lt;/p&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Dalla decisione alla giustificazione verso gli stakeholder&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;arA&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-ink2&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g font-size=&quot;14&quot;&gt;
          &lt;rect x=&quot;10&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;95&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Dilemma&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;es. pagare il “gift”?&lt;/text&gt;
          &lt;rect x=&quot;220&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;305&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Ethical theory&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;regole e principi&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;50&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;505&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Decisione&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;systematic rationale&lt;/text&gt;

          &lt;circle cx=&quot;720&quot; cy=&quot;88&quot; r=&quot;22&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;staff&lt;/text&gt;
          &lt;circle cx=&quot;680&quot; cy=&quot;135&quot; r=&quot;22&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;società&lt;/text&gt;
          &lt;circle cx=&quot;645&quot; cy=&quot;88&quot; r=&quot;20&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;645&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot;&gt;soci&lt;/text&gt;
          &lt;text x=&quot;505&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;defended · justified · explained&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;La teoria fa da ponte tra il dilemma e una decisione che si può spiegare agli stakeholders. Schema costruito sulla &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione · slide 4&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Ethical theories&lt;/strong&gt; = le regole e i principi che aiutano a determinare che cosa è “right” e “wrong” in una data situazione.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Normative ethical theories&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Descriptive ethical theories&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Prescrivono&lt;/strong&gt; il modo moralmente corretto di agire: rispondono alla domanda &lt;em&gt;“che cosa dovrei fare?”&lt;/em&gt;. Sono l&#x27;oggetto di questa lezione. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;muted small&quot;&gt;Esempio: “Non si devono pagare tangenti, perché…” — il “perché” è fornito dalla teoria.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;Descrivono&lt;/strong&gt; come le decisioni etiche vengono &lt;em&gt;effettivamente&lt;/em&gt; prese nelle aziende: rispondono alla domanda &lt;em&gt;“che cosa fanno davvero le persone, e perché?”&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;muted small&quot;&gt;Esempio: “Il 60% dei manager in quel settore paga per velocizzare la dogana, soprattutto sotto pressione di scadenze” — è un fatto, non un giudizio.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;religione&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt; Normative ethical theories and religion&lt;/h2&gt;
    &lt;p&gt;Teorie filosofiche e religioni hanno lo &lt;strong&gt;stesso scopo&lt;/strong&gt;: dirci quali sono le cose giuste da fare. In ambito business, entrambe puntano a far sì che l&#x27;impresa sia &lt;strong&gt;responsabile, eviti di fare danni e contribuisca al benessere sociale&lt;/strong&gt;. Le differenze sono due. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra filosofia e religione&quot;&gt;
        &lt;g font-size=&quot;14&quot;&gt;

          &lt;text x=&quot;380&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Scopo comune&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;dire che cosa è giusto fare&lt;/text&gt;
          &lt;text x=&quot;140&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot;&gt;Filosofia&lt;/text&gt;
          &lt;text x=&quot;620&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot;&gt;Religione&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-tint&quot; font-weight=&quot;600&quot;&gt;FONTE DELLE NORME&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;118&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;la ragione umana&lt;/text&gt;
          &lt;rect x=&quot;500&quot; y=&quot;118&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;divinità o sistemi&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;di credenze organizzati&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-tint&quot; font-weight=&quot;600&quot;&gt;CONSEGUENZE&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;240&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;benefici o danni tangibili&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;per gli altri&lt;/text&gt;
          &lt;rect x=&quot;500&quot; y=&quot;180&quot; width=&quot;240&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;anche spirituali: illuminazione,&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;reincarnazione, dannazione, salvezza&lt;/text&gt;
          &lt;path d=&quot;M380 66V118M380 150V190&quot; class=&quot;s-rule&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;

      &lt;/svg&gt;
      &lt;figcaption&gt;Le due differenze indicate dalla &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;: fonte delle regole e tipo di conseguenze della (im)moralità.&lt;/figcaption&gt;

    &lt;p class=&quot;small muted&quot;&gt;I simboli religiosi della &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt; ricordano che anche le religioni sono, a modo loro, sistemi &lt;em&gt;principle-based&lt;/em&gt;: partono da principi universali dati.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;posizioni&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt; Absolutism, relativism, pluralism&lt;/h2&gt;
    &lt;p&gt;Prima di scegliere una teoria, la lezione pone una domanda di fondo &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;: &lt;em&gt;in classe abbiamo tutti le stesse idee su giusto e sbagliato? Esistono ideali universali accettati da tutti?&lt;/em&gt; Le risposte possibili si dispongono lungo uno spettro con due estremi (De George, 1999) &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;

    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Spettro tra assolutismo e relativismo con il pluralismo in mezzo&quot;&gt;
        &lt;defs&gt;&lt;linearGradient id=&quot;gSp&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;oklch(55% .11 250)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;oklch(60% .12 85)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
        &lt;rect x=&quot;40&quot; y=&quot;70&quot; width=&quot;680&quot; height=&quot;14&quot; rx=&quot;7&quot; fill=&quot;url(#gSp)&quot;/&gt;
        &lt;circle cx=&quot;48&quot; cy=&quot;77&quot; r=&quot;13&quot; class=&quot;f-card&quot; stroke=&quot;oklch(55% .11 250)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle cx=&quot;712&quot; cy=&quot;77&quot; r=&quot;13&quot; class=&quot;f-card&quot; stroke=&quot;oklch(60% .12 85)&quot; stroke-width=&quot;3&quot;/&gt;

        &lt;text x=&quot;380&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Pluralism&lt;/text&gt;
        &lt;g font-size=&quot;14&quot;&gt;
          &lt;text x=&quot;40&quot; y=&quot;40&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Ethical absolutism&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;40&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;19&quot; text-anchor=&quot;end&quot;&gt;Ethical relativism&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;122&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;principi morali eterni e universali&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;140&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;giusto/sbagliato: qualità oggettive&lt;/text&gt;
          &lt;text x=&quot;40&quot; y=&quot;158&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot;&gt;→ tipico delle teorie tradizionali&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;122&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;la morale dipende dal contesto&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;140&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;dalla persona e dalla cultura&lt;/text&gt;
          &lt;text x=&quot;720&quot; y=&quot;158&quot; class=&quot;f-ink2&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;→ tipico delle teorie contemporanee&lt;/text&gt;
          &lt;text x=&quot;380&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-size=&quot;13&quot;&gt;l&#x27;approccio del corso&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Le due posizioni estreme e quella intermedia adottata dal corso e dal libro di testo. &lt;span class=&quot;src&quot;&gt;slide 7, 9&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tinted slate&quot;&gt;&lt;h4&gt;Ethical absolutism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Esistono principi morali &lt;strong&gt;eterni e universalmente applicabili&lt;/strong&gt;. Giusto e sbagliato sono qualità oggettive, determinabili con la ragione.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted ochre&quot;&gt;&lt;h4&gt;Ethical relativism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;La morale è &lt;strong&gt;dipendente dal contesto e soggettiva&lt;/strong&gt;: non c&#x27;è un giusto/sbagliato universale; dipende da chi decide e dalla cultura in cui si trova.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted brick&quot;&gt;&lt;h4&gt;Ethical pluralism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Valori incompatibili possono essere &lt;strong&gt;ugualmente legittimi&lt;/strong&gt; e vanno riconosciuti e tollerati; apertura alle nuove realtà; dialogo razionale tra chi ha valori diversi. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note inf&quot;&gt;Pluralismo non vuol dire “ognuno ha la sua verità” (quello è relativismo). Vuol dire usare &lt;em&gt;più&lt;/em&gt; teorie come lenti diverse, confrontarne gli esiti e argomentare razionalmente la scelta, invece di affidarsi a un&#x27;unica regola o al solo contesto.&lt;/div&gt;

    &lt;h3 id=&quot;caso&quot;&gt;Il caso Briberyland &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--accent)&quot;&gt;
      &lt;p&gt;Sei manager di un&#x27;azienda di trading internazionale che esporta merci a &lt;strong&gt;Briberyland&lt;/strong&gt;. Un funzionario della dogana locale chiede un “gift” speciale: altrimenti le merci resteranno ferme &lt;strong&gt;un mese&lt;/strong&gt; per controlli.&lt;/p&gt;
      &lt;ul class=&quot;clean small&quot;&gt;
        &lt;li&gt;I colleghi del settore ti dicono che pagano regolarmente per “velocizzare la pratica”.&lt;/li&gt;
        &lt;li&gt;La dogana di Briberyland ha &lt;strong&gt;legalmente&lt;/strong&gt; il diritto di trattenere le merci per un&#x27;ispezione.&lt;/li&gt;
        &lt;li&gt;Nel Paese della sede centrale la corruzione è &lt;strong&gt;illegale&lt;/strong&gt;; ma l&#x27;azienda non ha una policy chiara e in qualche modo la tollera.&lt;/li&gt;
        &lt;li&gt;Le merci sono per uno dei tuoi &lt;strong&gt;migliori clienti&lt;/strong&gt; e vanno consegnate &lt;strong&gt;entro due settimane&lt;/strong&gt;.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;p&gt;Come risponderebbero le due posizioni estreme e quella pluralista? &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Absolutism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Relativism&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Pluralism&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;La corruzione è &lt;strong&gt;&lt;em&gt;sempre&lt;/em&gt; sbagliata&lt;/strong&gt;. Chi si trova davanti a un funzionario corrotto non deve assolutamente pagare e, a seconda delle policy in vigore, dovrebbe anche segnalare la cosa alle autorità. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;La corruzione &lt;strong&gt;&lt;em&gt;può&lt;/em&gt; essere sbagliata&lt;/strong&gt;. Si giudica in base alla cultura in cui si opera e alle circostanze specifiche. Se si conclude che è sbagliata, ci si comporta come sopra; se si conclude che non lo è, nulla impedisce di “&lt;em&gt;greasing the wheels&lt;/em&gt;” (ungere gli ingranaggi, cioè pagare per far scorrere le pratiche). &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Si esamina il caso con &lt;strong&gt;più teorie&lt;/strong&gt; (conseguenze, doveri, diritti, giustizia…), si vede dove convergono e dove divergono e si argomenta una decisione difendibile. È l&#x27;obiettivo finale della lezione: lo trovi applicato nella &lt;a href=&quot;#briberyland&quot;&gt;sezione 13&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;tradizionali&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt; Traditional (Western modernist) theories&lt;/h2&gt;
    &lt;p&gt;Le teorie tradizionali sono &lt;dfn&gt;normative&lt;/dfn&gt; perché partono da un&#x27;&lt;strong&gt;assunzione sulla natura del mondo&lt;/strong&gt; e, più in particolare, sulla &lt;strong&gt;natura dell&#x27;essere umano&lt;/strong&gt;. Quanto possiamo accettare una teoria — e le sue conclusioni in un caso aziendale — dipende da quanto condividiamo queste assunzioni. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;In genere offrono una regola o un principio applicabile a qualunque situazione: una &lt;em&gt;unequivocal solution&lt;/em&gt; (soluzione univoca). Si dividono in due gruppi a seconda di &lt;strong&gt;dove guardano&lt;/strong&gt; nella catena dell&#x27;azione. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

    &lt;figure&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Evidenzia una famiglia&quot;&gt;
        &lt;button class=&quot;btn&quot; data-hl=&quot;pb&quot; aria-pressed=&quot;false&quot;&gt;Principle-based&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-hl=&quot;cq&quot; aria-pressed=&quot;false&quot;&gt;Consequentialist&lt;/button&gt;
      &lt;/div&gt;

          &lt;ellipse cx=&quot;130&quot; cy=&quot;80&quot; rx=&quot;105&quot; ry=&quot;52&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Motivation /&lt;/text&gt;
          &lt;text x=&quot;130&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Principles&lt;/text&gt;
          &lt;path d=&quot;M40 150 q0 12 12 12 h145 q12 0 16 14 q4-14 16-14 h145 q12 0 12-12&quot; fill=&quot;none&quot; class=&quot;s-tint&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;214&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;Principle-based ethics&lt;/text&gt;
        &lt;/g&gt;
        &lt;ellipse cx=&quot;385&quot; cy=&quot;80&quot; rx=&quot;62&quot; ry=&quot;52&quot; class=&quot;f-card s-ink2&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;385&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Action&lt;/text&gt;
        &lt;g class=&quot;sage&quot; data-g=&quot;cq&quot; style=&quot;transition:opacity .3s&quot;&gt;

          &lt;text x=&quot;630&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Outcomes&lt;/text&gt;
          &lt;path d=&quot;M395 150 q0 12 12 12 h105 q12 0 16 14 q4-14 16-14 h170 q12 0 12-12&quot; fill=&quot;none&quot; class=&quot;s-tint&quot; stroke-width=&quot;2&quot;/&gt;

        &lt;/g&gt;
        &lt;path d=&quot;M236 80H318M448 80H520&quot; class=&quot;s-ink2&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#arB)&quot;/&gt;

      &lt;figcaption&gt;Ridisegnato dalla &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt; (fonte indicata: Crane et al., 2019). Le principle-based guardano a &lt;em&gt;perché&lt;/em&gt; e &lt;em&gt;secondo quale principio&lt;/em&gt; si agisce; le consequentialist a &lt;em&gt;che cosa produce&lt;/em&gt; l&#x27;azione.&lt;/figcaption&gt;

    &lt;div class=&quot;tbl&quot;&gt;

      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Base del giudizio&lt;/th&gt;&lt;td&gt;Gli &lt;strong&gt;outcomes&lt;/strong&gt; (risultati) di un&#x27;azione&lt;/td&gt;&lt;td&gt;La derivazione di &lt;strong&gt;principles&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Domanda chiave&lt;/th&gt;&lt;td&gt;&lt;strong&gt;Goal oriented&lt;/strong&gt;: l&#x27;esito voluto è desiderabile?&lt;/td&gt;&lt;td&gt;&lt;strong&gt;What is right&lt;/strong&gt; vs what is desirable: che cosa è giusto, a prescindere da ciò che conviene&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Regola&lt;/th&gt;&lt;td&gt;Esiti desiderabili → azione moralmente giusta; esiti indesiderabili → azione sbagliata&lt;/td&gt;&lt;td&gt;Dalla desiderabilità dei principi si deduce un &lt;strong&gt;“duty”&lt;/strong&gt; (dovere) di agire, indipendentemente dalle conseguenze&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Nome tecnico&lt;/th&gt;&lt;td&gt;&lt;strong&gt;Teleological theories&lt;/strong&gt; (dal greco &lt;em&gt;télos&lt;/em&gt;, fine/scopo)&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Deontological theories&lt;/strong&gt; (dal greco &lt;em&gt;déon&lt;/em&gt;, ciò che è dovuto)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Esempi&lt;/th&gt;&lt;td&gt;&lt;a href=&quot;#egoism&quot;&gt;Ethical egoism&lt;/a&gt;, &lt;a href=&quot;#utilitarianism&quot;&gt;utilitarianism&lt;/a&gt;&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;#kant&quot;&gt;Ethics of duties&lt;/a&gt;, &lt;a href=&quot;#rights&quot;&gt;ethics of rights and justice&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Tabella costruita sulla &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;; etimologie aggiunte per chiarezza.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte A&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra una teoria etica normativa e una descrittiva?&lt;/summary&gt;&lt;p&gt;La normativa &lt;em&gt;prescrive&lt;/em&gt; come si dovrebbe agire; la descrittiva &lt;em&gt;descrive&lt;/em&gt; come le decisioni etiche vengono effettivamente prese nelle aziende (slide 4).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché in business serve un “systematic rationale”?&lt;/summary&gt;&lt;p&gt;Perché le decisioni toccano molti stakeholders e devono poter essere difese, giustificate e spiegate con argomenti comprensibili (slide 3).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un manager dice: “A Briberyland pagare è normale, quindi va bene”. Che posizione sta adottando?&lt;/summary&gt;&lt;p&gt;Ethical relativism: giudica la corruzione in base alla cultura locale e alle circostanze, non a principi universali (slide 7–8).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In che cosa il pluralismo differisce dal relativismo?&lt;/summary&gt;&lt;p&gt;Il relativismo nega che si possa determinare razionalmente un giusto universale; il pluralismo riconosce che valori incompatibili possono essere legittimi ma mantiene il dialogo razionale tra posizioni diverse e usa più teorie per valutare (slide 9).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le due differenze tra teorie filosofiche e religiose indicate nelle slide?&lt;/summary&gt;&lt;p&gt;La fonte delle norme (ragione umana vs divinità/sistemi di credenze) e le conseguenze della moralità (benefici/danni tangibili vs anche conseguenze spirituali) (slide 10).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Teleological o deontological: “Non mento ai clienti, anche se una bugia aumenterebbe le vendite”?&lt;/summary&gt;&lt;p&gt;Deontological (principle-based): il dovere di non mentire vale indipendentemente dalle conseguenze desiderabili (slide 13).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE B ============ --&gt;
&lt;section id=&quot;parte-b&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Parte B · slide 14–22&lt;/p&gt;
    &lt;h2&gt;Consequentialist theories&lt;/h2&gt;
    &lt;p&gt;Giudicano un&#x27;azione dai suoi risultati. Cambia solo &lt;em&gt;di chi&lt;/em&gt; sono i risultati che contano: dell&#x27;individuo che decide (egoism) o di tutti quelli coinvolti (utilitarianism).&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;egoism&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt; Ethical egoism&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione · slide 15&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Ethical egoism&lt;/strong&gt;: un&#x27;azione è moralmente giusta se chi decide la sceglie liberamente per perseguire i propri &lt;strong&gt;desires&lt;/strong&gt; (desideri, di breve periodo) oppure i propri &lt;strong&gt;interests&lt;/strong&gt; (interessi, di lungo periodo).&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;Attenzione: è una teoria &lt;em&gt;normativa&lt;/em&gt;. Non dice “le persone sono egoiste” (quella sarebbe una descrizione), ma “è &lt;em&gt;giusto&lt;/em&gt; che ciascuno persegua il proprio bene”.&lt;/p&gt;

    &lt;h3&gt;Le radici e i sostenitori &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
    &lt;div data-steps class=&quot;sage&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Epicuro · Grecia antica&lt;/h4&gt;&lt;p&gt;Le radici risalgono alla filosofia greca: per Epicuro vale l&#x27;&lt;dfn&gt;hedonism&lt;/dfn&gt; (edonismo): il piacere è il bene supremo e va cercato per sé stesso.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Thomas Hobbes · &lt;em&gt;Leviathan&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Nello stato di natura ognuno persegue il proprio interesse e ne nasce la “&lt;strong&gt;war of all against all&lt;/strong&gt;” (guerra di tutti contro tutti). Per uscirne gli individui, proprio per interesse personale, si affidano a un potere sovrano. Nella tabella di sintesi Hobbes è il contributore principale dell&#x27;egoism. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Ayn Rand · &lt;em&gt;The Virtue of Selfishness&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Difende la teoria per una forte fede nell&#x27;individualismo e nella “&lt;strong&gt;virtue of selfishness&lt;/strong&gt;” (la virtù dell&#x27;egoismo): perseguire razionalmente il proprio interesse è un dovere morale, non un vizio.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Adam Smith · la “invisible hand”&lt;/h4&gt;&lt;p&gt;La versione più nota: perseguire l&#x27;interesse individuale è moralmente accettabile perché la &lt;dfn&gt;invisible hand&lt;/dfn&gt; (mano invisibile) del mercato trasforma gli interessi privati in un beneficio per tutti. Le slide mettono un “(?)”: è davvero così?&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Le slide indicano l&#x27;anno 1793; l&#x27;opera in cui compare la mano invisibile, &lt;em&gt;The Wealth of Nations&lt;/em&gt;, è uscita per la prima volta nel 1776 &lt;a class=&quot;ext&quot; href=&quot;https://oll.libertyfund.org/quote/249&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Il 1793 corrisponde probabilmente a un&#x27;edizione successiva.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Milton Friedman (?)&lt;/h4&gt;&lt;p&gt;Capitalismo, libero mercato e &lt;dfn&gt;shareholder primacy&lt;/dfn&gt; (il primato degli azionisti: lo scopo dell&#x27;impresa è creare valore per i soci). Anche qui le slide mettono un “(?)”: ricondurre Friedman all&#x27;egoism è discutibile, perché lui giustifica il profitto anche con i suoi effetti sociali. Il testo di riferimento è l&#x27;articolo del 1970 “The Social Responsibility of Business Is to Increase Its Profits” &lt;a class=&quot;ext&quot; href=&quot;https://fermatslibrary.com/s/the-social-responsibility-of-business-is-to-increase-its-profits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn pri next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Desire vs interest: sono la stessa cosa? &lt;span class=&quot;src&quot;&gt;slide 16–17&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;La slide 16 mostra due ragazzi: uno beve al bancone, l&#x27;altro studia fra pile di libri. &lt;em&gt;Entrambi seguono i propri desideri&lt;/em&gt;. Ma uno insegue un piacere immediato, l&#x27;altro un interesse di lungo periodo. Muovi l&#x27;orizzonte temporale e guarda quale scelta “conviene” davvero.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;hz&quot;&gt;Orizzonte di valutazione&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;hz&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;hzo&quot;&gt;1&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 260&quot; id=&quot;egoChart&quot; role=&quot;img&quot; aria-label=&quot;Benessere cumulato di due scelte nel tempo&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;egoV&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Modello illustrativo con numeri inventati, utile a visualizzare la distinzione delle &lt;span class=&quot;src&quot;&gt;slide 16–17&lt;/span&gt;: con un orizzonte breve vince il &lt;em&gt;desire&lt;/em&gt;, con uno lungo vince l&#x27;&lt;em&gt;interest&lt;/em&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;I problemi dell&#x27;egoism &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Dal desire alla pursuit of interests&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se l&#x27;egoism si basa sui desideri del momento, giustifica qualunque capriccio. Per essere una teoria seria deve spostarsi sugli &lt;strong&gt;interessi&lt;/strong&gt; di lungo periodo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Objective value → enlightened self-interest&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ma se parliamo di interessi, ammettiamo che un modo di agire è &lt;strong&gt;oggettivamente migliore&lt;/strong&gt; (“più etico”) di un altro: è l&#x27;&lt;dfn&gt;enlightened egoism&lt;/dfn&gt; o &lt;dfn&gt;enlightened self-interest&lt;/dfn&gt; (interesse personale “illuminato”, che guarda lontano: es. un&#x27;azienda tratta bene i dipendenti perché le conviene nel lungo periodo). Così però si introduce un criterio esterno ai desideri del singolo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Serve un meccanismo sociale (market failures)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Serve un meccanismo che impedisca a un egoista di perseguire i propri interessi &lt;strong&gt;a spese degli altri egoisti&lt;/strong&gt;. Il mercato da solo non basta: esistono le &lt;dfn&gt;market failures&lt;/dfn&gt; (fallimenti di mercato: inquinamento, monopoli, asimmetrie informative), in cui la mano invisibile non produce il bene comune.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Internamente incoerente?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Alcuni non considerano l&#x27;egoism una vera teoria etica perché è &lt;strong&gt;internally inconsistent&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Spiegazione aggiuntiva: un egoista coerente dovrebbe sperare che gli altri &lt;em&gt;non&lt;/em&gt; seguano l&#x27;egoismo (gli conviene essere circondato da altruisti), quindi non può raccomandare la propria teoria come regola per tutti, come invece ci si aspetta da una teoria morale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;utilitarianism&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt; Utilitarianism&lt;/h2&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione · slide 18&lt;/span&gt;
      &lt;p&gt;Secondo l&#x27;&lt;strong&gt;utilitarianism&lt;/strong&gt; un&#x27;azione è moralmente giusta se produce &lt;strong&gt;the greatest amount of good for the greatest number of people&lt;/strong&gt; (il massimo bene per il maggior numero di persone) tra quelle toccate dall&#x27;azione.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;A differenza dell&#x27;egoism, non chiede se ogni singolo ottiene ciò che vuole, ma guarda al &lt;em&gt;collective welfare&lt;/em&gt; (benessere collettivo) prodotto dall&#x27;azione. Il metodo è una &lt;dfn&gt;cost-benefit analysis&lt;/dfn&gt; (analisi costi-benefici). Contributori principali: &lt;strong&gt;Jeremy Bentham&lt;/strong&gt; e &lt;strong&gt;John Stuart Mill&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;

    &lt;div class=&quot;card&quot; style=&quot;text-align:center;margin:1.2rem 0&quot;&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-bottom:.3rem&quot;&gt;Il calcolo in forma compatta (formalizzazione didattica)&lt;/p&gt;
      &lt;p style=&quot;font:500 1.45rem/1.5 var(--serif);margin:.2rem 0&quot;&gt;U(azione) = Σ&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; [ benefici&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; − costi&lt;sub&gt;&lt;i&gt;i&lt;/i&gt;&lt;/sub&gt; ]&lt;/p&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin:0&quot;&gt;per ogni persona &lt;i&gt;i&lt;/i&gt; toccata dall&#x27;azione · si sceglie l&#x27;azione con U più alta · ognuno conta uguale&lt;/p&gt;
    &lt;/div&gt;

    &lt;p&gt;Che cosa si misura come “&lt;dfn&gt;utility&lt;/dfn&gt;”? Le slide distinguono tre versioni &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Hedonistic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Eudemonistic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ideal&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Pleasure&lt;/strong&gt; e &lt;strong&gt;pain&lt;/strong&gt;: piacere e dolore. È la versione classica di Bentham. &lt;span class=&quot;muted small&quot;&gt;Es.: un licenziamento genera dolore per chi perde il posto, un risparmio genera piacere per i soci.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Happiness&lt;/strong&gt; e &lt;strong&gt;unhappiness&lt;/strong&gt;: felicità e infelicità (dal greco &lt;em&gt;eudaimonía&lt;/em&gt;, “vita riuscita”). Più ampia del semplice piacere momentaneo.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Intrinsically valuable human goods&lt;/strong&gt;: beni umani che valgono di per sé, come amicizia, amore, fiducia. &lt;span class=&quot;muted small&quot;&gt;Es.: una politica aziendale che preserva la fiducia dei clienti produce “utility” anche se non dà piacere immediato.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Act- e rule-utilitarianism &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Act utilitarianism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Guarda la &lt;strong&gt;singola azione&lt;/strong&gt;: è giusta se &lt;em&gt;questa&lt;/em&gt; azione, qui e ora, produce più piacere che dolore.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Rule utilitarianism&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Guarda le &lt;strong&gt;classi di azioni&lt;/strong&gt;: il principio sottostante, se seguito da tutti, produce più piacere che dolore per la società &lt;strong&gt;nel lungo periodo&lt;/strong&gt;?&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Calcolatore utilitarista: pagare il “gift” a Briberyland?&lt;/h3&gt;
    &lt;p&gt;Assegna a ogni stakeholder l&#x27;effetto &lt;em&gt;immediato&lt;/em&gt; del pagamento (−5 = molto dolore, +5 = molto piacere). Poi passa da act a rule: si aggiungono gli effetti di lungo periodo di una &lt;em&gt;regola&lt;/em&gt; “si paga sempre”.&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;calc&quot;&gt;
      &lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Versione&quot;&gt;
        &lt;button class=&quot;btn&quot; data-mode=&quot;act&quot; aria-pressed=&quot;true&quot;&gt;Act utilitarianism&lt;/button&gt;
        &lt;button class=&quot;btn&quot; data-mode=&quot;rule&quot; aria-pressed=&quot;false&quot;&gt;Rule utilitarianism&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;calcSl&quot;&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 250&quot; id=&quot;calcSvg&quot; role=&quot;img&quot; aria-label=&quot;Grafico costi-benefici&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;calcV&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin:0&quot;&gt;Valori di partenza scelti a scopo illustrativo. Gli effetti di lungo periodo (in rule mode) sono fissi: estorsioni ripetute e rischio legale per l&#x27;azienda, concorrenza onesta penalizzata, istituzioni locali indebolite.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;I problemi dell&#x27;utilitarianism &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/h3&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Gli interessi delle minoranze vengono trascurati&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si rischia di sacrificare diritti e benessere di pochi per massimizzare quello della comunità. &lt;span class=&quot;muted small&quot;&gt;Es.: chiudere uno stabilimento “conviene” alla somma, ma scarica tutti i costi su una piccola comunità.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Arrow&#x27;s theorem&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dalla microeconomia: non è possibile aggregare le funzioni di utilità individuali in un&#x27;unica funzione che rappresenti perfettamente l&#x27;intera comunità. Anche il peso uguale per tutti è problematico (&lt;em&gt;equal weighting?&lt;/em&gt;).&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Più precisamente: Kenneth Arrow ha dimostrato che nessuna procedura può trasformare le preferenze individuali (ordinali) in un ordinamento collettivo rispettando insieme alcune condizioni ragionevoli: dominio non ristretto, Pareto debole, indipendenza dalle alternative irrilevanti, assenza di dittatore &lt;a class=&quot;ext&quot; href=&quot;https://plato.stanford.edu/entries/arrows-theorem/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Ignora chi parte da condizioni peggiori&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La somma non guarda a &lt;em&gt;come&lt;/em&gt; il benessere è distribuito. È il problema affrontato da &lt;strong&gt;John Rawls&lt;/strong&gt;, deontologo contemporaneo, nella sua teoria della giustizia: vedi la &lt;a href=&quot;#justice&quot;&gt;sezione 11&lt;/a&gt; e il simulatore del velo di ignoranza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Riduce il benessere a benessere materiale&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rischio di trascurare o sottovalutare gli aspetti spirituali, culturali e relazionali, che sono difficili da quantificare.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;open&quot;&gt;&lt;summary&gt;Il problema dei “boundaries”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Chi rientra nella somma? Come si definisce la comunità: dipendenti, Paese, generazioni future, animali?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;p class=&quot;small muted&quot;&gt;La numerazione delle slide passa da 18 a 20: la slide 19 non è presente nel PDF.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte B&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa hanno in comune egoism e utilitarianism?&lt;/summary&gt;&lt;p&gt;Sono entrambe consequentialist (teleological): giudicano un&#x27;azione dai suoi outcomes. Differiscono per chi conta: il singolo decisore oppure tutti gli interessati (slide 13, 15, 18).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;enlightened self-interest e perché crea un problema all&#x27;egoism?&lt;/summary&gt;&lt;p&gt;È l&#x27;interesse personale di lungo periodo, che rende alcune condotte oggettivamente migliori di altre. Il problema è che introduce un “objective value”, cioè un criterio che va oltre i desideri del singolo (slide 17).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;azienda chiede: “Se nascondiamo questo difetto minore, quanti ne beneficiano e quanti ne soffrono?” Che teoria sta usando?&lt;/summary&gt;&lt;p&gt;Utilitarianism (act), basato su cost-benefit analysis del singolo atto.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché, nel calcolatore, act e rule utilitarianism danno risposte diverse?&lt;/summary&gt;&lt;p&gt;L&#x27;act guarda solo agli effetti della singola tangente; il rule valuta la regola generale “pagare sempre”, i cui effetti di lungo periodo (estorsioni ripetute, istituzioni corrotte, concorrenza falsata) pesano molto più dei benefici immediati (slide 20).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cita tre problemi dell&#x27;utilitarianism.&lt;/summary&gt;&lt;p&gt;Minoranze trascurate; Arrow&#x27;s theorem (impossibile aggregare perfettamente le utilità); ignora chi parte da condizioni peggiori (Rawls); riduzione al benessere materiale; problema dei boundaries (slide 21).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre versioni di “utility”?&lt;/summary&gt;&lt;p&gt;Hedonistic (pleasure/pain), eudemonistic (happiness/unhappiness), ideal (beni intrinsecamente validi come amicizia, amore, fiducia) (slide 18).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE C ============ --&gt;
&lt;section id=&quot;parte-c&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Parte C · slide 23–38&lt;/p&gt;
    &lt;h2&gt;Principle-based (deontological) theories&lt;/h2&gt;
    &lt;p&gt;Partono dall&#x27;assunzione che esistano &lt;strong&gt;basic universal principles&lt;/strong&gt; di giusto e sbagliato. Due filoni: &lt;strong&gt;ethics of duties&lt;/strong&gt; (etica dei doveri) ed &lt;strong&gt;ethics of rights and justice&lt;/strong&gt; (etica dei diritti e della giustizia). &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;article class=&quot;topic&quot; id=&quot;kant&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt; Ethics of duties — Immanuel Kant&lt;/h2&gt;
    &lt;p&gt;Per Kant la morale è una questione di obblighi &lt;strong&gt;astratti&lt;/strong&gt; e &lt;strong&gt;immutabili&lt;/strong&gt;, un insieme di regole &lt;dfn&gt;a priori&lt;/dfn&gt; (conoscibili con la sola ragione, prima e indipendentemente dall&#x27;esperienza) da applicare a tutti i problemi etici rilevanti. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Rational actors&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Gli esseri umani sono attori razionali dotati di &lt;strong&gt;free will&lt;/strong&gt; (libero arbitrio): possono stabilire loro stessi questi principi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Duties&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;I &lt;strong&gt;doveri&lt;/strong&gt; sono il cuore della morale.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Commitment&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Un dovere nasce dall&#x27;impegno a fare la cosa giusta &lt;strong&gt;per rispetto della legge morale&lt;/strong&gt;, non per convenienza.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Il categorical imperative &lt;span class=&quot;src&quot;&gt;slide 26–27&lt;/span&gt;&lt;/h3&gt;
    &lt;blockquote&gt;“There is, therefore, only one categorical imperative. It is: Act only according to that maxim by which you can at the same time will that it should become a universal law.”&lt;footer&gt;Immanuel Kant, citato nelle slide 26–28&lt;/footer&gt;&lt;/blockquote&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Categorical&lt;/span&gt;&lt;p&gt;Universale e &lt;strong&gt;senza condizioni&lt;/strong&gt;: vale per tutti e sempre, qualunque cosa tu desideri.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Imperative&lt;/span&gt;&lt;p&gt;Un &lt;strong&gt;comando&lt;/strong&gt; da seguire.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note inf&quot;&gt;Il contrario è l&#x27;imperativo &lt;em&gt;ipotetico&lt;/em&gt;: “&lt;strong&gt;se&lt;/strong&gt; vuoi X, fai Y” (se vuoi non perdere il cliente, paga). Quello categorico non ha “se”. La slide 27 lo illustra con un semaforo rosso di notte, a incrocio deserto: ti fermi lo stesso, perché la regola vale senza condizioni, non perché qualcuno ti guarda.&lt;/div&gt;

    &lt;h3&gt;Le tre maxims &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Una &lt;dfn&gt;maxim&lt;/dfn&gt; (massima) è la regola personale che sta dietro un&#x27;azione (“quando mi conviene, prometto il falso”). Il categorical imperative si declina in tre formulazioni, che funzionano come tre test:&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Consistency&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Human dignity&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Universality&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;“Act only according to that maxim by which you can at the same time will that it should become a universal law.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: se tutti facessero come me, la mia regola funzionerebbe ancora, senza contraddirsi?&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;“Act so that you treat humanity, whether in your own person or in that of another, always as an end and never as a means only.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: sto usando qualcuno (o me stesso) &lt;em&gt;solo&lt;/em&gt; come strumento? Nota quel “only”: in azienda usiamo sempre il lavoro altrui come mezzo, ma non dobbiamo mai ridurre una persona a &lt;em&gt;puro&lt;/em&gt; mezzo.&lt;/p&gt;&lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;“Act only so that the will through its maxims could regard itself at the same time as universally lawgiving.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Test&lt;/strong&gt;: tutti gli agenti razionali potrebbero approvare questa regola come una legge che danno insieme a sé stessi?&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;I tre test applicati al caso Briberyland&lt;/h3&gt;
    &lt;div data-steps class=&quot;brick&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 1 · Formula la maxim&lt;/h4&gt;&lt;p&gt;“Quando un funzionario mi chiede un regalo per sbloccare le merci, pago, se mi conviene.” Kant non chiede quanto vale il cliente: chiede quale regola stai adottando.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · Consistency&lt;/h4&gt;&lt;p&gt;Immagina che diventi legge universale: tutti pagano sempre. L&#x27;ispezione doganale smette di essere un controllo e diventa un mercato di permessi, e lo stesso “vantaggio” di pagare scompare, perché paga chiunque. La regola si &lt;strong&gt;autodistrugge&lt;/strong&gt;: non puoi volerla universale.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Human dignity&lt;/h4&gt;&lt;p&gt;Il funzionario viene trattato come uno strumento da comprare; i concorrenti onesti e i cittadini di Briberyland come ostacoli trascurabili. Diverse persone sono usate &lt;strong&gt;solo come mezzi&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Universality&lt;/h4&gt;&lt;p&gt;Tutti gli agenti razionali, compresi quelli danneggiati, approverebbero una legge che autorizza la corruzione? Difficilmente.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Verdetto deontological&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Non pagare&lt;/strong&gt;, a prescindere dal mese di ritardo e dal rischio di perdere il cliente. Le conseguenze negative restano, ma non cambiano il dovere: è la logica dell&#x27;absolutism visto nella &lt;a href=&quot;#posizioni&quot;&gt;sezione 3&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn pri next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;I problemi dell&#x27;ethics of duties &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Undervaluing motivation&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Conta solo agire per dovere: compassione, amore o simpatia come moventi non danno valore morale all&#x27;azione.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Undervaluing outcomes&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le conseguenze, anche gravi, non contano: seguire la regola può produrre esiti disastrosi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Assumption of rationality&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Presuppone persone pienamente razionali: &lt;em&gt;misplaced optimism?&lt;/em&gt; (un ottimismo mal riposto?).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Video indicati nella slide 30: &lt;a href=&quot;https://www.youtube.com/watch?v=x_uUEaeqFog&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=gGczdp0SE0c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2&lt;/a&gt;.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic ochre&quot; id=&quot;trolley&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt; The trolley problem&lt;/h2&gt;
    &lt;p&gt;Un esperimento mentale che mette a confronto le due famiglie di teorie. Un carrello senza freni sta per travolgere cinque persone. &lt;span class=&quot;src&quot;&gt;slide 22, 29&lt;/span&gt;&lt;/p&gt;
    &lt;div data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Versione 1 · il deviatoio&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Versione 2 · il ponte&lt;/button&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot;&gt;
        &lt;figure style=&quot;margin-top:0&quot;&gt;
          &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Deviatoio: deviare il carrello verso una persona per salvarne cinque&quot;&gt;
            &lt;path d=&quot;M20 100H300 L600 100&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
            &lt;path d=&quot;M300 100 Q380 100 440 160 H600&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; stroke-dasharray=&quot;7 5&quot;/&gt;
            &lt;rect x=&quot;40&quot; y=&quot;76&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;f-acc&quot;/&gt;&lt;circle cx=&quot;58&quot; cy=&quot;108&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;92&quot; cy=&quot;108&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;
            &lt;g class=&quot;f-ink&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;580&quot; cy=&quot;84&quot; r=&quot;7&quot;/&gt;&lt;/g&gt;
            &lt;circle cx=&quot;540&quot; cy=&quot;144&quot; r=&quot;7&quot; class=&quot;f-ink&quot;/&gt;
            &lt;rect x=&quot;275&quot; y=&quot;30&quot; width=&quot;16&quot; height=&quot;44&quot; rx=&quot;3&quot; class=&quot;f-tint&quot;/&gt;&lt;circle cx=&quot;283&quot; cy=&quot;22&quot; r=&quot;8&quot; class=&quot;f-ink&quot;/&gt;
            &lt;text x=&quot;283&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;tu, alla leva&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;5 persone&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;1 persona&lt;/text&gt;
            &lt;path d=&quot;M283 74 L295 98&quot; class=&quot;s-tint&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;/svg&gt;
        &lt;/figure&gt;
        &lt;p&gt;Puoi tirare una leva e deviare il carrello su un binario dove c&#x27;è una sola persona.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div role=&quot;tabpanel&quot; hidden&gt;
        &lt;figure style=&quot;margin-top:0&quot;&gt;
          &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Ponte: spingere una persona sui binari per salvarne cinque&quot;&gt;
            &lt;path d=&quot;M20 160H620&quot; class=&quot;s-ink2&quot; stroke-width=&quot;3&quot;/&gt;
            &lt;rect x=&quot;40&quot; y=&quot;136&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;f-acc&quot;/&gt;&lt;circle cx=&quot;58&quot; cy=&quot;168&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;92&quot; cy=&quot;168&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;
            &lt;rect x=&quot;250&quot; y=&quot;70&quot; width=&quot;160&quot; height=&quot;10&quot; class=&quot;f-tint&quot;/&gt;&lt;path d=&quot;M260 80V160M400 80V160&quot; class=&quot;s-tint&quot; stroke-width=&quot;4&quot;/&gt;
            &lt;circle cx=&quot;310&quot; cy=&quot;52&quot; r=&quot;9&quot; class=&quot;f-ink&quot;/&gt;&lt;rect x=&quot;302&quot; y=&quot;62&quot; width=&quot;16&quot; height=&quot;8&quot; class=&quot;f-ink&quot;/&gt;
            &lt;circle cx=&quot;345&quot; cy=&quot;46&quot; r=&quot;13&quot; class=&quot;f-ink&quot;/&gt;&lt;rect x=&quot;334&quot; y=&quot;58&quot; width=&quot;22&quot; height=&quot;12&quot; class=&quot;f-ink&quot;/&gt;
            &lt;g class=&quot;f-ink&quot;&gt;&lt;circle cx=&quot;500&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;580&quot; cy=&quot;144&quot; r=&quot;7&quot;/&gt;&lt;/g&gt;
            &lt;text x=&quot;310&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;tu&lt;/text&gt;
            &lt;text x=&quot;370&quot; y=&quot;28&quot; font-size=&quot;13&quot;&gt;una persona&lt;/text&gt;
            &lt;text x=&quot;540&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;5 persone&lt;/text&gt;
          &lt;/svg&gt;
        &lt;/figure&gt;
        &lt;p&gt;Sei su un ponte sopra i binari: puoi fermare il carrello solo spingendo giù una persona.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted sage&quot;&gt;&lt;h4&gt;Prospettiva consequentialist&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le due situazioni sono &lt;strong&gt;uguali&lt;/strong&gt;: 1 vita contro 5. Si deve sacrificare 1 per salvarne 5, perché l&#x27;utilità è maggiore se sopravvivono in cinque. &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted brick&quot;&gt;&lt;h4&gt;Prospettiva non-consequentialist&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le due situazioni sono &lt;strong&gt;uguali&lt;/strong&gt; anche qui: in entrambi i casi non si deve fare nulla, perché la vita umana è un bene &lt;strong&gt;incommensurabile&lt;/strong&gt;, non oggetto di baratto (1 contro 5) e mai un mezzo per un fine. &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot;&gt;Eppure “sentiamo” che le due situazioni &lt;em&gt;non&lt;/em&gt; sono uguali. Perché? Per la &lt;strong&gt;agency / responsibility&lt;/strong&gt; richiesta (deviare vs spingere con le mani) e per il &lt;strong&gt;grado di coinvolgimento della “terza” persona&lt;/strong&gt; (che nel ponte viene usata direttamente come strumento). &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Video indicati nella slide 22: &lt;a href=&quot;https://www.youtube.com/watch?v=bOpf6KcWYyw&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 1&lt;/a&gt; · &lt;a href=&quot;https://youtu.be/yg16u_bzjPE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video 2 (link nuovo)&lt;/a&gt;. Il problema fu proposto da Philippa Foot (1967) e così battezzato da Judith Jarvis Thomson (1976), che aggiunse la variante del ponte &lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/topic/trolley-problem&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
  &lt;/article&gt;

  &lt;article class=&quot;topic&quot; id=&quot;rights&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt; Ethics of rights: natural and human rights&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Natural rights · John Locke · slide 31&lt;/span&gt;&lt;p&gt;Diritti naturali: pretese morali che spettano agli esseri umani e vanno rispettate e protette. Sono i diritti alla &lt;strong&gt;vita&lt;/strong&gt;, alla &lt;strong&gt;libertà&lt;/strong&gt; e alla &lt;strong&gt;proprietà&lt;/strong&gt;. Opera chiave: &lt;em&gt;Two Treatises of Government&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;k&quot;&gt;Human rights · slide 31&lt;/span&gt;&lt;p&gt;Diritti umani: &lt;strong&gt;basic, inalienable entitlements&lt;/strong&gt; (titolarità fondamentali e inalienabili, cioè non cedibili) inerenti a tutti gli esseri umani, senza eccezione.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;Generano un &lt;strong&gt;duty&lt;/strong&gt; (dovere) in capo agli altri attori di rispettarli: diritti e doveri sono due facce della stessa medaglia.&lt;/li&gt;
      &lt;li&gt;Si basano sul consenso circa la natura della &lt;strong&gt;human dignity&lt;/strong&gt; (dignità umana).&lt;/li&gt;
      &lt;li&gt;Sono sempre più importanti per le imprese: compaiono nello &lt;strong&gt;UN Global Compact&lt;/strong&gt; e negli &lt;strong&gt;UN Guiding Principles on Business and Human Rights&lt;/strong&gt;, detti “&lt;strong&gt;Ruggie Principles&lt;/strong&gt;” dal nome di John Ruggie, che li ha elaborati. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;UN Global Compact: i principi 1 e 2 &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principle One: Human Rights&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le imprese dovrebbero &lt;strong&gt;sostenere e rispettare&lt;/strong&gt; la protezione dei diritti umani proclamati a livello internazionale.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principle Two: Human Rights&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le imprese dovrebbero assicurarsi di &lt;strong&gt;non essere complici&lt;/strong&gt; di violazioni dei diritti umani.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Lo UN Global Compact è un&#x27;iniziativa ONU a cui le imprese aderiscono volontariamente; i suoi dieci principi riguardano diritti umani, lavoro, ambiente e anticorruzione &lt;a class=&quot;ext&quot; href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Il principio anticorruzione è direttamente rilevante per il caso Briberyland.&lt;/p&gt;

    &lt;h3&gt;Chi deve fare che cosa: i tre pilastri &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 700 250&quot; role=&quot;img&quot; aria-label=&quot;I tre pilastri: Stato protegge, imprese rispettano, giudici rimediano&quot;&gt;
        &lt;rect x=&quot;40&quot; y=&quot;20&quot; width=&quot;620&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;f-tbg s-tint&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;350&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;serif&quot;&gt;UN Guiding Principles · “Protect, Respect and Remedy”&lt;/text&gt;
        &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;rect x=&quot;70&quot; y=&quot;66&quot; width=&quot;150&quot; height=&quot;130&quot; class=&quot;f-card s-rule&quot;/&gt;

          &lt;rect x=&quot;480&quot; y=&quot;66&quot; width=&quot;150&quot; height=&quot;130&quot; class=&quot;f-card s-rule&quot;/&gt;
          &lt;text x=&quot;145&quot; y=&quot;100&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;STATE&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;130&quot;&gt;duty to&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;protect&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;175&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;i diritti umani&lt;/text&gt;
          &lt;text x=&quot;350&quot; y=&quot;100&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;BUSINESS&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;130&quot;&gt;duty / responsibility&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;to respect&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;175&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;i diritti umani&lt;/text&gt;
          &lt;text x=&quot;555&quot; y=&quot;100&quot; font-weight=&quot;600&quot; class=&quot;f-tint&quot;&gt;JUDICIARY&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;130&quot;&gt;offre&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;remedy&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;175&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;alle vittime di abusi&lt;/text&gt;
        &lt;/g&gt;
        &lt;rect x=&quot;30&quot; y=&quot;196&quot; width=&quot;640&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-tint&quot;/&gt;
        &lt;text x=&quot;350&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-ink2&quot;&gt;Approvati dal Consiglio ONU per i diritti umani nel 2011 (risoluzione 17/4) — fonte esterna&lt;/text&gt;

    &lt;/figure&gt;

    &lt;p&gt;Che cosa può fare concretamente un&#x27;impresa? La slide elenca quattro livelli di impegno crescente:&lt;/p&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Quattro livelli di impegno sui diritti umani&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;190&quot; width=&quot;160&quot; height=&quot;50&quot; class=&quot;f-tbg s-tint&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;a) Evitare&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;11&quot;&gt;di causare o contribuire&lt;/text&gt;
          &lt;rect x=&quot;185&quot; y=&quot;140&quot; width=&quot;160&quot; height=&quot;100&quot; class=&quot;f-tbg s-tint&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;b) Prevenire&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;11&quot;&gt;o mitigare impatti negativi&lt;/text&gt;
          &lt;rect x=&quot;350&quot; y=&quot;90&quot; width=&quot;160&quot; height=&quot;150&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;f-paper&quot;&gt;c) Proteggere&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-paper&quot;&gt;i diritti umani&lt;/text&gt;
          &lt;rect x=&quot;515&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;200&quot; class=&quot;f-tint&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;f-paper&quot;&gt;d) Rafforzare&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-paper&quot;&gt;i civil rights&lt;/text&gt;
          &lt;path d=&quot;M350 30 H675&quot; class=&quot;s-acc&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M350 24V36M675 24V36&quot; class=&quot;s-acc&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;512&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; class=&quot;f-acc&quot; font-style=&quot;italic&quot; font-size=&quot;14&quot;&gt;Corporate citizenship&lt;/text&gt;
          &lt;path d=&quot;M20 255 H345&quot; class=&quot;s-ink2&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink2&quot; font-size=&quot;12&quot;&gt;→ human rights due diligence&lt;/text&gt;
