      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Immagine dell&#x27;impresa&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gerarchia: &quot;gli azionisti sono il capo&quot;&lt;/td&gt;&lt;td&gt;Rete di relazioni che creano valore&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rapporto tra interessi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;In conflitto, si fanno tradeoff&lt;/td&gt;&lt;td&gt;Joint: si riformula per farli andare insieme&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Misura della performance&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Prezzo dell&#x27;azione, EPS trimestrale&lt;/td&gt;&lt;td&gt;Valore creato per ciascuno stakeholder nel tempo&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Business ed etica&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Separati (Separation Fallacy); l&#x27;etica è un vincolo esterno&lt;/td&gt;&lt;td&gt;Integrati (Integration Thesis); l&#x27;etica è routine&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Persone&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Interesse personale ristretto&lt;/td&gt;&lt;td&gt;Interesse per sé e per gli altri; nomi e volti&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Responsabilità sociale&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Serve la CSR come correttivo&lt;/td&gt;&lt;td&gt;Corporate stakeholder responsibility&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Capitalismo&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Soprattutto competizione&lt;/td&gt;&lt;td&gt;Soprattutto cooperazione e collaborazione&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Da ricordare&lt;/h4&gt;&lt;p&gt;Freeman non sostiene che esista &lt;i&gt;un&lt;/i&gt; modello stakeholder valido per tutte le imprese. Sostiene che chiedersi come le poste in gioco creano valore, e quale ruolo ha l&#x27;executive, è più utile, più realistico e più onesto eticamente del &quot;massimizza il valore per gli azionisti&quot;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;section id=&quot;s-fonti&quot; class=&quot;sec t-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Autori, testi, casi e norme citati&lt;/h2&gt;
  &lt;p&gt;Ogni scheda riguarda un riferimento citato nel saggio. Il riferimento al testo (pagina o nota) viene dal PDF; dati, descrizione e link segnati &lt;span class=&quot;ext&quot; style=&quot;margin:0&quot;&gt;fonte esterna&lt;/span&gt; vengono da una ricerca web e vanno verificati.&lt;/p&gt;

  &lt;h3&gt;Freeman e la stakeholder theory&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Strategic Management: A Stakeholder Approach&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;R. E. Freeman · Pitman 1984; ristampa Cambridge University Press · nel saggio: nota 1&lt;/div&gt;&lt;p&gt;Il libro che ha fondato la stakeholder theory. Parte I sull&#x27;approccio stakeholder (&quot;Managing in turbulent times&quot;, il concetto di stakeholder), poi processi di strategic management e implicazioni. Per l&#x27;edizione Cambridge, la sua pubblicazione è stata un momento chiave della teoria.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine della definizione ampia (&quot;can affect or be affected&quot;).&lt;/p&gt;&lt;a href=&quot;https://search.worldcat.org/title/903391157&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat: scheda del libro&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Freeman, Harrison, Wicks · Yale University Press 2007 · nota 1 (&quot;forthcoming&quot;)&lt;/div&gt;&lt;p&gt;La versione in forma di libro del saggio: capitoli sul business nel XXI secolo, lo schema di base, stakeholder, purpose e valori, strategie quotidiane per creare valore, leadership. Le descrizioni editoriali parlano di dieci principi e sette tecniche pratiche.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; sviluppa in modo operativo le idee del paper.&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/abs/managing-for-stakeholders-survival-reputation-success-by-r-edward-freeman-jeffrey-s-harrison-and-andrew-c-wicks-new-haven-conn-yale-university-press-2007-hardcover-200-pp-26-isbn-9780300125283/81A923CF1448D512C4BD6C16B9D55F40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Recensione su Business Ethics Quarterly (Cambridge Core)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;The Politics of Stakeholder Theory: Some Future Directions&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;R. E. Freeman · Business Ethics Quarterly 4(4), 1994, pp. 409–421 · nota 9&lt;/div&gt;&lt;p&gt;L&#x27;articolo dove Freeman introduce la &lt;i&gt;Separation Thesis&lt;/i&gt;. Abbandonandola, non resta un&#x27;unica stakeholder theory ma un &quot;genere&quot; di teorie che intrecciano concetti di business ed etici.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;antecedente diretto della Separation Fallacy.&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/product/117251073D5DBF47BFF0322281DC6F87&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core: abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Stakeholder Theory: A Libertarian Defense&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Freeman, Phillips · Business Ethics Quarterly 12(3), 2002, pp. 331–349 · nota 10&lt;/div&gt;&lt;p&gt;Trova le radici della stakeholder theory nel pensiero libertario e propone un modello di &quot;stakeholder capitalism&quot; fondato su libertà e azione volontaria.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra che l&#x27;approccio stakeholder non è per forza &quot;anti-mercato&quot;.&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v12y2002i03p331-349_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: scheda e abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Stakeholder Theory and Organizational Ethics&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Robert Phillips · Berrett-Koehler 2003 · nota 13&lt;/div&gt;&lt;p&gt;Fonda la stakeholder theory su un &quot;principio di equità tra stakeholder&quot; ripreso da Rawls e lo usa per capire chi è uno stakeholder legittimo e perché. Phillips si è formato a Darden con Freeman.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; da qui viene lo spirito della ruota della Figure 1.&lt;/p&gt;&lt;a href=&quot;https://www.bkconnection.com/static/Stakeholder_Theory_and_Organizational_Ethics_EXCERPT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Estratto dell&#x27;editore (PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Innovative Stakeholder Relations: When &quot;Ethics Pays&quot; (and When it Doesn&#x27;t)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harting, Harmeling, Venkataraman · Business Ethics Quarterly 16(1), 2006, pp. 43–68 · nota 18&lt;/div&gt;&lt;p&gt;Collega stakeholder theory, innovazione e vantaggio competitivo e propone ipotesi verificabili su quando l&#x27;etica &quot;paga&quot;. La nota 18 cita anche Venkataraman e Velamuri (Ruffin Series, 2002), non verificati qui.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; sostiene l&#x27;argomento dalle conseguenze.&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v16y2006i01p43-68_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: scheda e abstract&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La visione shareholder e la storia dell&#x27;impresa&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Milton Friedman, &quot;The Social Responsibility of Business Is to Increase Its Profits&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;New York Times Magazine, 13 settembre 1970 · p. 10&lt;/div&gt;&lt;p&gt;Il saggio considerato il manifesto della shareholder theory: l&#x27;unica responsabilità dell&#x27;impresa è verso gli azionisti, entro le regole del gioco. Alcuni storici pensano che la sua influenza sia sopravvalutata.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;interlocutore principale di Freeman, che ne valorizza la clausola &quot;legge e costume etico&quot;.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Friedman doctrine&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Jensen &amp;amp; Meckling, &quot;Theory of the Firm&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Financial Economics 3(4), 1976, pp. 305–360 · contesto della nota 5&lt;/div&gt;&lt;p&gt;Unisce teoria dell&#x27;agenzia, diritti di proprietà e finanza; definisce gli &lt;i&gt;agency costs&lt;/i&gt;. È uno degli articoli di business più citati di sempre. Freeman non lo nomina, ma è il riferimento classico dell&#x27;agency theory della nota 5.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; spiega la separazione fra decisione e rischio residuo.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN: abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Alfred D. Chandler, Strategy and Structure&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;MIT Press 1962 (Freeman cita l&#x27;ed. 1970) · nota 6&lt;/div&gt;&lt;p&gt;Studio storico di DuPont, General Motors, Standard Oil of New Jersey e Sears: la nascita dell&#x27;impresa multidivisionale e la tesi &quot;structure follows strategy&quot;. Sloan è descritto come architetto della strategia e della struttura di GM.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; documenta il passo 4 della storia dominante.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Alfred_D._Chandler_Jr.&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Alfred D. Chandler Jr.&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Peter Drucker, The Concept of the Corporation&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;John Day 1946; ristampa Transaction 1993 · nota 6&lt;/div&gt;&lt;p&gt;Nato dallo studio che GM chiese a Drucker nel 1943. I manager GM lo giudicarono troppo critico, ma i suoi principi di organizzazione sono diventati un modello nel mondo.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il ritratto &quot;non così lusinghiero&quot; di GM che Freeman affianca a Chandler.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Concept_of_the_Corporation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Concept of the Corporation&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Joseph Schumpeter, Capitalism, Socialism and Democracy&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1942 · p. 4&lt;/div&gt;&lt;p&gt;Sostiene che nelle grandi imprese burocratiche l&#x27;innovazione diventa routine affidata a team di specialisti e la funzione dell&#x27;imprenditore diventa obsoleta.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la previsione che Freeman ricorda sui rischi del managerialismo.&lt;/p&gt;&lt;a href=&quot;https://cato.org/regulation/summer-2022/celebrated-puzzling-book&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cato, Regulation (2022): recensione&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Breaking the Short-Term Cycle&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;CFA Centre for Financial Market Integrity e Business Roundtable Institute for Corporate Ethics, luglio 2006 · nota 8 (stampata come &quot;6&quot;)&lt;/div&gt;&lt;p&gt;Rapporto contro lo &lt;i&gt;short-termism&lt;/i&gt;: tra le raccomandazioni, abbandonare la guidance trimestrale sugli utili, incentivi di lungo periodo, più trasparenza verso gli investitori.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; lega la critica di Freeman all&#x27;ossessione per gli EPS trimestrali.&lt;/p&gt;&lt;a href=&quot;https://rpc.cfainstitute.org/-/media/documents/article/position-paper/breaking-the-short-term-cycle.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CFA Institute: rapporto (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Casi giudiziari e norme (USA)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Winterbottom v. Wright (1842)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Court of Exchequer, Inghilterra · p. 6&lt;/div&gt;&lt;p&gt;Il cocchiere di una diligenza postale, ferito, fa causa a chi doveva mantenerla: perde perché non aveva un contratto con lui. È il caso simbolo della &lt;i&gt;privity of contract&lt;/i&gt;, poi superata (MacPherson v. Buick, 1916; Donoghue v. Stevenson, 1932).&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Winterbottom_v_Wright&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Winterbottom v Wright&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Greenman v. Yuba Power Products (1963)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Corte Suprema della California, 59 Cal.2d 57 · p. 6&lt;/div&gt;&lt;p&gt;Un utensile combinato (Shopsmith) lancia un pezzo di legno e ferisce l&#x27;utente. Il giudice Traynor stabilisce la responsabilità oggettiva in tort del produttore per i prodotti difettosi.&lt;/p&gt;&lt;a href=&quot;https://scocal.stanford.edu/opinion/greenman-v-yuba-power-products-inc-27186&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford SCOCAL: testo della sentenza&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Consumer Product Safety Act e CPSC (1972)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Pub. L. 92-573 · p. 7&lt;/div&gt;&lt;p&gt;Crea la Consumer Product Safety Commission come agenzia indipendente, con il potere di disporre richiami e, in casi limitati, vietare prodotti. Rafforzata nel 2008.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Consumer_Product_Safety_Act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Consumer Product Safety Act&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;National Labor Relations Act (1935) e NLRB&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;detto anche Wagner Act · p. 7&lt;/div&gt;&lt;p&gt;Riconosce il diritto di organizzarsi in sindacato e di contrattare collettivamente. Il National Labor Relations Board è l&#x27;agenzia federale indipendente che lo applica.&lt;/p&gt;&lt;a href=&quot;https://www.nlrb.gov/about-nlrb/who-we-are&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NLRB: Who We Are&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Equal Pay Act 1963, Title VII 1964, ADEA 1967&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 7&lt;/div&gt;&lt;p&gt;Parità salariale per lavoro sostanzialmente uguale; divieto di discriminazione per razza, colore, religione, sesso, origine nazionale (Title VII crea anche la EEOC); tutela contro la discriminazione per età, all&#x27;origine per chi aveva tra 40 e 65 anni.&lt;/p&gt;&lt;a href=&quot;https://www.eeoc.gov/youth/timeline-important-eeoc-events&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EEOC: cronologia&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Clean Air Act e Clean Water Act&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 7&lt;/div&gt;&lt;p&gt;Il Clean Air Act, approvato nel 1970 e aggiornato nel 1990, fissa standard di qualità dell&#x27;aria e limiti alle emissioni. Il Clean Water Act regola gli scarichi nelle acque USA.&lt;/p&gt;&lt;a href=&quot;https://www.epa.gov/clean-air-act-overview/plain-english-guide-clean-air-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPA: guida al Clean Air Act&lt;/a&gt; · &lt;a href=&quot;https://www.everycrsreport.com/reports/RL30798.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRS: sintesi delle leggi ambientali&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Marsh v. Alabama, 326 U.S. 501 (1946)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Corte Suprema USA · pp. 7–8&lt;/div&gt;&lt;p&gt;Una testimone di Geova viene arrestata mentre distribuisce volantini a Chickasaw, città di proprietà della Gulf Shipbuilding. La Corte decide che una company town aperta al pubblico non può limitare la libertà di espressione come se fosse una proprietà privata qualunque.&lt;/p&gt;&lt;a href=&quot;https://www.law.cornell.edu/supct/html/historics/USSC_CR_326_501_ZO.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cornell LII: testo della sentenza&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Etica, filosofia e management&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Adam Smith e la &quot;mano invisibile&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;The Wealth of Nations, 1776 · p. 20&lt;/div&gt;&lt;p&gt;Nel Libro IV Smith usa la metafora per dire che azioni guidate dall&#x27;interesse personale possono promuovere l&#x27;interesse pubblico. Smith parla di &quot;una&quot; mano invisibile e non ne fa un principio generale: la lettura liberista è un&#x27;estensione successiva.&lt;/p&gt;&lt;a href=&quot;https://www.britannica.com/money/invisible-hand&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica: invisible hand&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;John Rawls, Political Liberalism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Columbia University Press 1993 (Freeman cita l&#x27;ed. 1995) · nota 11&lt;/div&gt;&lt;p&gt;Come può stare insieme una società stabile e giusta di persone con dottrine diverse e inconciliabili? Con un &quot;overlapping consensus&quot; su principi politici condivisi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; ispira l&#x27;idea di etica come ragionare insieme nonostante le differenze.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Political_Liberalism&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Political Liberalism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Pragmatismo: William James, John Dewey&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 23&lt;/div&gt;&lt;p&gt;Tradizione filosofica nata negli USA intorno al 1870 (Peirce, James, Dewey): chiarire le idee guardando alle loro conseguenze pratiche. Rinasce dagli anni &#x27;70 con Rorty, Putnam, Brandom.&lt;/p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/pragmatism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy: Pragmatism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Interviste a Richard Rorty&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;E. Mendieta (a cura di), Take Care of Freedom and Truth Will Take Care of Itself, Stanford University Press 2006 · nota 20&lt;/div&gt;&lt;p&gt;Raccolta di interviste su filosofia, politica, democrazia e tradizione sindacale americana. Da qui (p. 68) viene la citazione sull&#x27;ideale pragmatista.&lt;/p&gt;&lt;a href=&quot;https://dc2.philarchive.org/rec/RORTCO&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilArchive: scheda&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Russell Hardin, Morality within the Limits of Reason&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;University of Chicago Press 1988 · nota 19&lt;/div&gt;&lt;p&gt;Ricostruzione dell&#x27;utilitarismo che tiene conto dei limiti pratici della scelta etica (informazione incompleta, comprensione limitata di cause ed effetti).&lt;/p&gt;&lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/293267&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Recensione su Ethics (1990)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Bill George, Authentic Leadership&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Jossey-Bass 2003 · nota 15&lt;/div&gt;&lt;p&gt;L&#x27;ex CEO di Medtronic sostiene che servono nuovi leader, non solo nuove leggi, e che le imprese guidate da una missione creano più valore per gli azionisti. Indica cinque dimensioni: purpose, valori, cuore, relazioni, autodisciplina.&lt;/p&gt;&lt;a href=&quot;https://knowledge.wharton.upenn.edu/article/authentic-leadership&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Knowledge at Wharton&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Collins &amp;amp; Porras, Built to Last&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1994 (Freeman cita l&#x27;ed. 2002) · nota 8&lt;/div&gt;&lt;p&gt;Confronta 18 imprese &quot;visionarie&quot; con concorrenti di controllo: quelle durature mantengono stabile una &lt;i&gt;core ideology&lt;/i&gt; e cambiano tutto il resto, e il profitto viene dopo valori e scopo.&lt;/p&gt;&lt;a href=&quot;https://www.supersummary.com/built-to-last/summary/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SuperSummary: sintesi (fonte secondaria)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Grameen Bank&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;esempio di purpose, p. 18&lt;/div&gt;&lt;p&gt;Fondata da Muhammad Yunus in Bangladesh nel 1976, banca indipendente dal 1983. Fa microcredito a gruppi di cinque persone, dove la pressione del gruppo sostituisce le garanzie. Nobel per la pace 2006 insieme a Yunus.&lt;/p&gt;&lt;a href=&quot;https://www.britannica.com/money/Grameen-Bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica: Grameen Bank&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Citati nel saggio ma non approfonditi qui: Beauchamp e Bowie, &lt;i&gt;Ethical Theory and Business&lt;/i&gt;; Wicks, Freeman, Werhane, Martin, &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;; Freeman, &quot;The Development of Stakeholder Theory: An Idiosyncratic Approach&quot; (in Smith e Hitt, &lt;i&gt;Great Minds in Management&lt;/i&gt;, OUP 2005); Velamuri e Venkataraman (Ruffin Series, 2002).&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
