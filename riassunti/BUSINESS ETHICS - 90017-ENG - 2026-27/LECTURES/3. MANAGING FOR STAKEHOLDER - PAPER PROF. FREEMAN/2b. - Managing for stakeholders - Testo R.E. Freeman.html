      &lt;text x=&quot;494&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Open Question Argument&lt;/text&gt;&lt;text x=&quot;494&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;4 domande sempre aperte&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#integration&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;228&quot; width=&quot;240&quot; height=&quot;52&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;180&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13.5&quot;&gt;Integration Thesis&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;+ Responsibility Principle&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-mfs&quot;&gt;&lt;rect x=&quot;360&quot; y=&quot;336&quot; width=&quot;240&quot; height=&quot;58&quot; rx=&quot;14&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;text x=&quot;480&quot; y=&quot;361&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot; style=&quot;fill:var(--paper)&quot;&gt;Managing for stakeholders&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;il business come rete di relazioni&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#wheel-sec&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;150&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Stakeholders e stakes&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;primari · secondari&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-executive&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Responsabilità executive&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;interessi joint · purpose&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-argomenti&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;610&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Tre argomenti etici&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;conseguenze · diritti · carattere&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#arg-prag&quot;&gt;&lt;rect x=&quot;740&quot; y=&quot;456&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;840&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Argomento pragmatista&lt;/text&gt;&lt;text x=&quot;840&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;capitalismo = cooperazione&lt;/text&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Il filo del saggio: si parte dal modello dominante, se ne mostrano tre difetti &quot;fatali&quot;, si smonta l&#x27;idea che business ed etica siano separati e si propone un modello nuovo, giustificato con quattro argomenti.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 1. TESI ============ --&gt;
&lt;section id=&quot;s-intro&quot; class=&quot;sec&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;1 · La tesi del saggio &lt;span class=&quot;pages&quot;&gt;pp. 2–3&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Una visione del business che sta emergendo&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Freeman propone di chiamare &lt;span class=&quot;en&quot;&gt;managing for stakeholders&lt;/span&gt; una visione dell&#x27;impresa nata negli ultimi trent&#x27;anni dal lavoro di studiosi di discipline molto diverse, dalla finanza alla filosofia.&lt;/p&gt;
  &lt;p&gt;Due parole da fissare subito:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;termine&lt;/span&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Azionista&lt;/b&gt;: chi possiede azioni dell&#x27;impresa (&lt;span class=&quot;en&quot;&gt;share&lt;/span&gt; = quota). Freeman preferisce spesso dire &lt;span class=&quot;en&quot;&gt;financiers&lt;/span&gt;, cioè finanziatori: azionisti, obbligazionisti, banche.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;termine&lt;/span&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Portatore di interesse&lt;/b&gt;: chi ha una &quot;posta in gioco&quot; (&lt;span class=&quot;en&quot;&gt;stake&lt;/span&gt;) nelle attività dell&#x27;impresa: clienti, fornitori, dipendenti, comunità, finanziatori. Il gioco di parole con &lt;span class=&quot;en&quot;&gt;shareholder&lt;/span&gt; è voluto.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;L&#x27;idea di base&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;Il modello a cui si oppone&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;Come procede il saggio&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;p&gt;Le imprese, e i dirigenti che le guidano, &lt;b&gt;effettivamente creano&lt;/b&gt; e &lt;b&gt;dovrebbero creare&lt;/b&gt; valore per clienti, fornitori, dipendenti, comunità e finanziatori. Bisogna quindi fare molta attenzione a &lt;i&gt;come&lt;/i&gt; si gestiscono queste relazioni e a &lt;i&gt;come&lt;/i&gt; si crea valore per ciascuno.&lt;/p&gt;
      &lt;p&gt;La frase ha due piani: uno &lt;b&gt;descrittivo&lt;/b&gt; (è così che le imprese funzionano) e uno &lt;b&gt;normativo&lt;/b&gt; (è così che dovrebbero funzionare). Freeman li tiene insieme di proposito (vedi nota 17, sezione 6).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;p&gt;Il &lt;dfn&gt;modello dominante&lt;/dfn&gt;: l&#x27;impresa va gestita &lt;b&gt;solo a beneficio degli azionisti&lt;/b&gt;. Gli altri benefici (o danni) che produce sono &lt;i&gt;incidentali&lt;/i&gt;, cioè effetti collaterali.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Nota 4: nel modello dominante &quot;non si gestisce &lt;i&gt;per&lt;/i&gt;&quot; quei benefici. Da qui il titolo: &lt;i&gt;managing &lt;b&gt;for&lt;/b&gt; stakeholders&lt;/i&gt;, gestire avendo come fine gli stakeholder.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;ol&gt;
        &lt;li&gt;Perché la storia dominante &lt;b&gt;non funziona più&lt;/b&gt;: resiste al cambiamento, non è coerente con la legge, ignora l&#x27;etica. Ognuno di questi difetti è &quot;fatale&quot; nel XXI secolo.&lt;/li&gt;
        &lt;li&gt;Le idee di base del &lt;i&gt;managing for stakeholders&lt;/i&gt;: usare lo &lt;i&gt;stakeholder&lt;/i&gt; come &lt;b&gt;unità di analisi&lt;/b&gt; rende difficile ignorare l&#x27;etica.&lt;/li&gt;
        &lt;li&gt;La responsabilità principale dell&#x27;executive: creare &lt;b&gt;più valore possibile per gli stakeholder&lt;/b&gt;. Nessun interesse sta in piedi da solo.&lt;/li&gt;
        &lt;li&gt;Tre argomenti dalla teoria etica, più un quarto &lt;b&gt;argomento pragmatista&lt;/b&gt;: il capitalismo come sistema di &lt;b&gt;cooperazione&lt;/b&gt; sociale più che di competizione.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Nota sul nome&lt;/h4&gt;&lt;p&gt;La stessa idea è stata chiamata &lt;span class=&quot;en&quot;&gt;stakeholder management&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;stakeholder capitalism&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;stakeholder theory of the modern corporation&lt;/span&gt;. Freeman sceglie &lt;span class=&quot;en&quot;&gt;managing for stakeholders&lt;/span&gt; e avverte che la sua versione è &quot;piuttosto idiosincratica&quot; (nota 2).&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual è la differenza tra shareholder e stakeholder?&lt;/summary&gt;&lt;div&gt;Lo &lt;i&gt;shareholder&lt;/i&gt; è l&#x27;azionista, che ha una quota della proprietà. Lo &lt;i&gt;stakeholder&lt;/i&gt; è chiunque abbia una posta in gioco nell&#x27;impresa: clienti, fornitori, dipendenti, comunità, finanziatori. Gli azionisti sono quindi &lt;b&gt;uno&lt;/b&gt; dei gruppi di stakeholder.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Secondo il modello dominante, che status hanno i benefici per i clienti o i danni alla comunità?&lt;/summary&gt;&lt;div&gt;Sono &lt;b&gt;incidentali&lt;/b&gt;: effetti collaterali di un&#x27;impresa gestita solo per gli azionisti, non obiettivi della gestione.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Con quale immagine del capitalismo si chiude il saggio?&lt;/summary&gt;&lt;div&gt;Il capitalismo come sistema di &lt;b&gt;cooperazione e collaborazione sociale&lt;/b&gt;, più che principalmente di competizione.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2. STORIA DOMINANTE ============ --&gt;
&lt;section id=&quot;s-dominante&quot; class=&quot;sec t-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;2 · La storia dominante &lt;span class=&quot;pages&quot;&gt;pp. 3–5&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Managerial capitalism con gli azionisti al centro&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;La grande impresa moderna è per Freeman una delle innovazioni più importanti della storia umana. Per capire come vada reinventata, bisogna vedere come si è formata la storia che oggi raccontiamo su di essa.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1 · All&#x27;inizio&lt;/div&gt;&lt;h4&gt;Imprese semplici&lt;/h4&gt;&lt;p&gt;&quot;Fare business&quot; voleva dire comprare materie prime dai fornitori, trasformarle in prodotti e venderli ai clienti. Le imprese le fondavano soprattutto &lt;b&gt;proprietari-imprenditori&lt;/b&gt; (&lt;span class=&quot;en&quot;&gt;owner-entrepreneurs&lt;/span&gt;), che ci lavoravano con i familiari.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2 · Crescita&lt;/div&gt;&lt;h4&gt;Catena di montaggio e capitale&lt;/h4&gt;&lt;p&gt;Nuovi processi produttivi come l&#x27;&lt;span class=&quot;en&quot;&gt;assembly line&lt;/span&gt; (catena di montaggio) permettono di specializzare i compiti. Arrivano nuove tecnologie e fonti di energia. Servono &lt;b&gt;molti più capitali&lt;/b&gt; di quanti ne abbia un singolo proprietario, e i &quot;lavoratori&quot; non familiari diventano la regola.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;3 · Separazione&lt;/div&gt;&lt;h4&gt;Proprietà dispersa, controllo ai manager&lt;/h4&gt;&lt;p&gt;Il capitale arriva da banche, azionisti e altre istituzioni: la proprietà si disperde e la &lt;b&gt;gestione si separa dalla proprietà&lt;/b&gt;. Per avere successo i top manager devono soddisfare insieme proprietari, dipendenti e sindacati, fornitori e clienti. Questo sistema si chiama &lt;span class=&quot;en&quot;&gt;managerial capitalism&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;laissez-faire capitalism&lt;/span&gt; o, più di recente, &lt;span class=&quot;en&quot;&gt;shareholder capitalism&lt;/span&gt;.&lt;/p&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nota 5: agency theory e agency problem&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Freeman tratta capitalismo manageriale e capitalismo degli azionisti come se fossero la stessa cosa, perché entrambi accettano l&#x27;&lt;dfn&gt;agency theory&lt;/dfn&gt; (teoria dell&#x27;agenzia): nell&#x27;impresa moderna chi &lt;b&gt;decide&lt;/b&gt; (il manager, l&#x27;&lt;i&gt;agent&lt;/i&gt;) è diverso da chi &lt;b&gt;sopporta il rischio residuo&lt;/b&gt; (l&#x27;azionista, il &lt;i&gt;principal&lt;/i&gt;, che viene pagato per ultimo, dopo tutti gli altri).&lt;/p&gt;&lt;p&gt;Ne nasce l&#x27;&lt;dfn&gt;agency problem&lt;/dfn&gt;: come ottenere che il manager agisca nell&#x27;interesse dell&#x27;azionista e non nel proprio? La risposta classica sono gli incentivi legati al valore delle azioni (passo 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;4 · Struttura&lt;/div&gt;&lt;h4&gt;La divisionalized firm&lt;/h4&gt;&lt;p&gt;Per controllare imprese sempre più grandi i manager inventano l&#x27;&lt;dfn&gt;impresa divisionale&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;divisionalized firm&lt;/span&gt;): divisioni per prodotto o mercato, coordinate da uno staff centrale (&lt;span class=&quot;en&quot;&gt;headquarters&lt;/span&gt;). Il modello lo guida &lt;b&gt;Alfred Sloan alla General Motors&lt;/b&gt; e poi si diffonde ovunque. Il riferimento per l&#x27;autorità manageriale è la &lt;b&gt;burocrazia&lt;/b&gt; militare e statale: strutture e processi razionali per una crescita ordinata.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Nota 6: Freeman rimanda ad Alfred Chandler, &lt;i&gt;Strategy and Structure&lt;/i&gt;, e, per un ritratto meno lusinghiero di GM, a Peter Drucker, &lt;i&gt;The Concept of the Corporation&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;5 · Apogeo&lt;/div&gt;&lt;h4&gt;Gerarchia, stabilità, prevedibilità&lt;/h4&gt;&lt;p&gt;Managerialismo, gerarchia, stabilità e prevedibilità crescono insieme negli Stati Uniti e in Europa e formano &quot;il sistema economico più potente della storia&quot;. Proprio per questo &lt;b&gt;Joseph Schumpeter&lt;/b&gt; temeva che la burocrazia avrebbe spento la &lt;b&gt;forza creativa&lt;/b&gt; del capitalismo, soffocando l&#x27;innovazione in nome della stabilità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;6 · Ultimi 50 anni&lt;/div&gt;&lt;h4&gt;&quot;Increase shareholder value&quot;&lt;/h4&gt;&lt;p&gt;Il modello manageriale mette gli &lt;b&gt;azionisti al centro&lt;/b&gt; e risponde alla complessità concentrandosi ancora di più sul &lt;span class=&quot;en&quot;&gt;shareholder value&lt;/span&gt;, il valore per gli azionisti. Nascono piani di compenso legati al &lt;b&gt;prezzo dell&#x27;azione&lt;/b&gt;, che dipende molto dalle attese degli analisti di Wall Street sugli &lt;b&gt;utili per azione trimestrali&lt;/b&gt;. Diventa misura della performance battere i target e far crescere l&#x27;EPS un trimestre dopo l&#x27;altro.&lt;/p&gt;&lt;p&gt;Gli scandali &lt;b&gt;Enron, WorldCom, Tyco, Arthur Andersen&lt;/b&gt; nascono anche da dirigenti che cercavano di aumentare il valore per gli azionisti, a volte violando norme contabili e legge.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Formula · non nel testo&lt;/span&gt;
    &lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;b&gt;Earnings per share (EPS)&lt;/b&gt;, utile per azione: il numero che Wall Street guarda ogni trimestre.&lt;/p&gt;
    &lt;p style=&quot;font:400 1.25rem var(--serif);text-align:center;margin:12px 0&quot;&gt;EPS = &lt;span style=&quot;display:inline-block;vertical-align:middle;text-align:center&quot;&gt;&lt;span style=&quot;display:block;border-bottom:1px solid var(--ink);padding:0 6px&quot;&gt;utile netto − dividendi su azioni privilegiate&lt;/span&gt;&lt;span style=&quot;display:block;padding:0 6px&quot;&gt;numero medio di azioni ordinarie in circolazione&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;it&quot;&gt;Esempio: utile 50 milioni €, nessun dividendo privilegiato, 25 milioni di azioni → EPS = 2 €. Se gli analisti si aspettavano 2,10 €, il titolo può scendere anche con un&#x27;impresa in salute. È questa pressione che spinge al &lt;span class=&quot;en&quot;&gt;short-termism&lt;/span&gt; (la miopia del breve periodo), il tema del rapporto &lt;i&gt;Breaking the Short-Term Cycle&lt;/i&gt; citato da Freeman (seconda nota numerata &quot;6&quot;, in realtà la 8).&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 210&quot; role=&quot;img&quot; aria-label=&quot;Catena degli incentivi nel modello dominante&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Attese&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;108&quot;&gt;degli analisti&lt;/text&gt;
        &lt;rect x=&quot;155&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;EPS&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;108&quot;&gt;trimestrale&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Prezzo&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;108&quot;&gt;dell&#x27;azione&lt;/text&gt;
        &lt;rect x=&quot;445&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Compenso&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;108&quot;&gt;dei manager&lt;/text&gt;
        &lt;rect x=&quot;590&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Rischio&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;108&quot;&gt;di forzare i conti&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M130 95H153&quot;/&gt;&lt;path d=&quot;M275 95H298&quot;/&gt;&lt;path d=&quot;M420 95H443&quot;/&gt;&lt;path d=&quot;M565 95H588&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;360&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;Enron, WorldCom, Tyco, Arthur Andersen (p. 5)&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;obiettivo dichiarato: allineare gli interessi dei manager a quelli degli azionisti&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema ricostruito da p. 4–5. Il punto di Freeman: questo meccanismo presuppone una stabilità e una prevedibilità che il mondo di oggi non garantisce più.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché la proprietà dell&#x27;impresa si è dispersa?&lt;/summary&gt;&lt;div&gt;Perché catena di montaggio, nuove tecnologie e crescita richiedevano capitali ben oltre le possibilità di un singolo proprietario: si raccolgono da banche, azionisti e istituzioni. Ne segue la separazione tra proprietà e gestione.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che cosa temeva Schumpeter?&lt;/summary&gt;&lt;div&gt;Che burocrazia e managerialismo, cercando stabilità e prevedibilità, spegnessero la forza creativa del capitalismo e soffocassero l&#x27;innovazione.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Come lega Freeman gli scandali Enron e WorldCom al modello dominante?&lt;/summary&gt;&lt;div&gt;Sono nati &lt;i&gt;in parte&lt;/i&gt; dal tentativo dei dirigenti di aumentare lo shareholder value (prezzo dell&#x27;azione, EPS trimestrali), a volte contro le regole contabili e la legge.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché, nella nota 5, capitalismo manageriale e degli azionisti si possono trattare insieme?&lt;/summary&gt;&lt;div&gt;Perché entrambi accettano l&#x27;agency theory: decisione e rischio residuo stanno in mani diverse (manager e azionisti), e da qui viene l&#x27;agency problem.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3. TRE DIFETTI ============ --&gt;
&lt;section id=&quot;s-difetti&quot; class=&quot;sec t-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;3 · I tre difetti fatali &lt;span class=&quot;pages&quot;&gt;pp. 5–12&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Perché la storia dominante non regge più&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Freeman indica tre difetti del modello con gli azionisti al centro, e per lui ognuno basta da solo a renderlo inservibile nel XXI secolo.&lt;/p&gt;

  &lt;h3 id=&quot;d-change&quot;&gt;a) È resistente al cambiamento&lt;/h3&gt;
  &lt;p&gt;Il modello mette gli interessi degli azionisti &lt;b&gt;sopra&lt;/b&gt; quelli di clienti, fornitori, dipendenti e altri, &lt;i&gt;come se dovessero per forza essere in conflitto&lt;/i&gt;. Vede l&#x27;impresa come una &lt;b&gt;gerarchia&lt;/b&gt; tenuta insieme dall&#x27;autorità di agire per conto degli azionisti. Lo rivela il linguaggio dei dirigenti: &quot;lavoriamo per gli azionisti&quot;, &quot;gli azionisti sono il capo&quot;, &quot;bisogna fare quello che vogliono gli azionisti&quot;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;conseguenza&lt;/span&gt;&lt;h4&gt;Si cambia solo se gli azionisti sono scontenti&lt;/h4&gt;&lt;p&gt;Finché arrivano risultati finanziari un po&#x27; migliori ogni trimestre, &quot;non c&#x27;è problema&quot;. Clienti insoddisfatti, conti truccati, qualità scadente, un disastro ambientale in arrivo o nuovi concorrenti contano &lt;b&gt;solo&lt;/b&gt; per l&#x27;effetto che hanno sul prezzo dell&#x27;azione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;obiezione&lt;/span&gt;&lt;h4&gt;Un unico criterio è troppo poco&lt;/h4&gt;&lt;p&gt;Il business di oggi è globale e sfaccettato, e l&#x27;incertezza è troppa per affidarsi a un solo indicatore. Se anche il prezzo dell&#x27;azione alla fine registra i cambiamenti, lo fa &lt;b&gt;troppo tardi&lt;/b&gt; perché i manager possano reagire.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote class=&quot;q&quot;&gt;La storia dominante può descrivere come vanno le cose nel lungo periodo a Wall Street, ma i manager devono guardare anche a Main Street.&lt;cite&gt;p. 6, parafrasi. &lt;i&gt;Wall Street&lt;/i&gt; = i mercati finanziari; &lt;i&gt;Main Street&lt;/i&gt; = l&#x27;economia reale delle persone e delle comunità.&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nota 7: la finanza come &quot;universal acid&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ai dirigenti serve a poco la consolazione che &quot;nel lungo periodo sopravvivono le imprese più efficienti&quot;. Alcuni teorici del mercato vedono la teoria finanziaria come un &quot;acido universale&quot; che attraversa ogni decisione, che i manager lo sappiano o no. Forse, dice Freeman, la vera differenza è che i due modelli parlano di &lt;b&gt;cose diverse&lt;/b&gt;: quello dominante della stretta logica economica dei mercati, il &lt;i&gt;managing for stakeholders&lt;/i&gt; di come gli esseri umani creano valore gli uni per gli altri.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;d-law&quot;&gt;b) Non è coerente con la legge&lt;/h3&gt;
  &lt;p&gt;Mettere gli azionisti &quot;prima di tutti&quot; contrasta con la realtà del diritto. Il diritto societario non dice in modo netto nell&#x27;interesse di chi vada governata l&#x27;impresa, e nel tempo ha dato rilievo &lt;i&gt;de facto&lt;/i&gt; (di fatto) alle pretese di altri gruppi, ponendo limiti ai &lt;span class=&quot;en&quot;&gt;tradeoffs&lt;/span&gt; (compromessi in cui si sacrifica un interesse per un altro) che il management può fare. Gli esempi sono quasi tutti statunitensi:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;Clienti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;Dipendenti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;Comunità locali&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot;&gt;E nel mondo?&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;figure style=&quot;margin:6px 0 16px&quot;&gt;&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Evoluzione della responsabilità del produttore&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;70&quot; x2=&quot;690&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;circle cx=&quot;90&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1842&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;100&quot;&gt;Winterbottom v. Wright&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;privity of contract&lt;/text&gt;
          &lt;circle cx=&quot;300&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1963&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;100&quot;&gt;Greenman v. Yuba Power&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;strict liability&lt;/text&gt;
          &lt;circle cx=&quot;490&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1972&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;100&quot;&gt;Consumer Product&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;116&quot;&gt;Safety Commission&lt;/text&gt;
          &lt;circle cx=&quot;650&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;oggi&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;100&quot;&gt;obblighi informativi&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;es. ingredienti&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;370&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;caveat emptor  →  caveat venditor&lt;/text&gt;
      &lt;/svg&gt;&lt;figcaption&gt;Le date 1963 e 1972 vengono da fonti esterne (vedi &quot;Per approfondire&quot;); il testo cita solo il 1842.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;&lt;dfn&gt;Privity of contract&lt;/dfn&gt; (relatività del contratto): solo chi ha firmato un contratto può farne valere gli obblighi. Con &lt;i&gt;Winterbottom v. Wright&lt;/i&gt; (1842) chi si faceva male per un prodotto difettoso senza avere un contratto con il produttore non poteva fargli causa.&lt;/p&gt;
      &lt;p&gt;Il diritto della &lt;span class=&quot;en&quot;&gt;product liability&lt;/span&gt; (responsabilità da prodotto) ha eroso questa dottrina. &lt;i&gt;Greenman v. Yuba Power&lt;/i&gt; stabilisce la &lt;dfn&gt;strict liability&lt;/dfn&gt; (responsabilità oggettiva) del produttore per i danni causati dai suoi prodotti, &lt;b&gt;anche se&lt;/b&gt; il venditore ha usato tutta la cura possibile e il consumatore non ha alcun contratto con il produttore.&lt;/p&gt;
      &lt;p&gt;Così &lt;span class=&quot;en&quot;&gt;caveat emptor&lt;/span&gt; (&quot;stia attento il compratore&quot;) è stato in gran parte sostituito da &lt;span class=&quot;en&quot;&gt;caveat venditor&lt;/span&gt; (&quot;stia attento il venditore&quot;). La &lt;b&gt;Consumer Product Safety Commission&lt;/b&gt; può imporre richiami dei prodotti, e questo ha fatto crescere i richiami &quot;volontari&quot; con cui le imprese cercano di limitare i risarcimenti. Alcuni settori devono informare sugli ingredienti, che il cliente lo voglia o no.&lt;/p&gt;
      &lt;p class=&quot;box&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;b&gt;Conclusione:&lt;/b&gt; le imprese devono tenere conto degli interessi dei clienti &lt;i&gt;per legge&lt;/i&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;sindacato&lt;/span&gt;&lt;h4&gt;National Labor Relations Act&lt;/h4&gt;&lt;p&gt;Diritto di organizzarsi in sindacato e di contrattare in buona fede. Crea il National Labor Relations Board per farlo rispettare.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1963&lt;/span&gt;&lt;h4&gt;Equal Pay Act&lt;/h4&gt;&lt;p&gt;Vieta le discriminazioni salariali.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1964&lt;/span&gt;&lt;h4&gt;Civil Rights Act, Title VII&lt;/h4&gt;&lt;p&gt;Vieta le discriminazioni nelle assunzioni.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1967&lt;/span&gt;&lt;h4&gt;Age Discrimination in Employment Act&lt;/h4&gt;&lt;p&gt;Discriminazione per età, poi estensioni sulle persone con disabilità.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Dalle controversie di lavoro e dagli accordi sulle discriminazioni con grandi datori di lavoro è nata una giurisprudenza amministrativa, e con essa una &lt;b&gt;pratica manageriale&lt;/b&gt; coerente con i diritti garantiti ai dipendenti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Clean Air Act&lt;/b&gt; e &lt;b&gt;Clean Water Act&lt;/b&gt; (con i loro emendamenti) impediscono al management di &quot;rovinare i beni comuni&quot; (&lt;span class=&quot;en&quot;&gt;spoiling the commons&lt;/span&gt;: aria e acqua sono di tutti, e chi inquina scarica un costo sugli altri).&lt;/p&gt;
      &lt;p&gt;In &lt;i&gt;Marsh v. Alabama&lt;/i&gt; la Corte Suprema ha stabilito che una &lt;span class=&quot;en&quot;&gt;company town&lt;/span&gt; (una città di proprietà di un&#x27;impresa) era soggetta alla Costituzione: i diritti dei cittadini prevalgono sui &quot;diritti di proprietà&quot; dell&#x27;impresa.&lt;/p&gt;
      &lt;p&gt;I temi aperti ai tempi del saggio: protezione delle imprese locali, obbligo di pagare l&#x27;assistenza sanitaria ai dipendenti, salari minimi, standard ambientali, effetti dello sviluppo sulle vite dei residenti. Sono temi della politica locale, e le imprese devono farci i conti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Obiezione:&lt;/b&gt; in un business globale i vincoli della legge USA contano sempre meno. &lt;b&gt;Risposta:&lt;/b&gt; la globalizzazione rende l&#x27;argomento &lt;i&gt;più&lt;/i&gt; forte. Le leggi sono cambiate in modo diverso nel mondo, ma ovunque nella direzione di considerare gruppi diversi dagli azionisti:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;b&gt;India&lt;/b&gt;: ogni stato ha regole proprie su come si può fare impresa.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Cina&lt;/b&gt;: il diritto riconosce alle imprese diritti di proprietà, ma tutt&#x27;altro che esclusivi.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Unione Europea&lt;/b&gt;: le norme su &quot;società civile&quot; e ruolo dei dipendenti sono più complesse persino di quelle USA.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Conclusione di Freeman&lt;/span&gt;&lt;blockquote&gt;&quot;Laissez faire capitalism&quot; is simply a myth.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Se &quot;massimizzare il valore per gli azionisti&quot; va sempre corretto con eccezioni di legge o di buona pratica, le eccezioni sono troppe e la storia dominante non serve più a descrivere il business. La si può salvare solo come tesi &lt;b&gt;normativa&lt;/b&gt; (come le imprese &lt;i&gt;dovrebbero&lt;/i&gt; funzionare), e allora bisogna guardarne i problemi concettuali ed etici (p. 8).&lt;/p&gt;&lt;/div&gt;

  &lt;h3 id=&quot;d-ethics&quot;&gt;c) Non è coerente con l&#x27;etica di base&lt;/h3&gt;
  &lt;p&gt;Molte teorie del business separano le decisioni &quot;di business&quot; da quelle &quot;etiche&quot;. Lo mostra la battuta per cui &lt;i&gt;business ethics&lt;/i&gt; sarebbe un ossimoro (una contraddizione in termini). Freeman dà a questa idea un nome:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Separation Fallacy · p. 9&lt;/span&gt;&lt;blockquote&gt;È comodo credere che frasi come &quot;x è una decisione di business&quot; non abbiano contenuto etico né un punto di vista etico implicito, e che frasi come &quot;x è una decisione etica&quot; non dicano nulla sulla creazione di valore e sullo scambio.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;&lt;span class=&quot;en&quot;&gt;Fallacy&lt;/span&gt; = errore di ragionamento. In un articolo del 1994 (nota 9) Freeman la chiamava &lt;span class=&quot;en&quot;&gt;Separation Thesis&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;p&gt;Rifiutarla ha due implicazioni. La prima è che &lt;b&gt;quasi ogni decisione di business ha un contenuto etico&lt;/b&gt;. Per verificarlo basta chiedersi se queste domande hanno senso per una decisione qualsiasi:&lt;/p&gt;

  &lt;div id=&quot;oqa&quot; class=&quot;stepper&quot; style=&quot;scroll-margin-top:70px&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;The Open Question Argument · prova tu&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Scegli una decisione: le quattro domande di Freeman restano sempre &quot;aperte&quot;. Le risposte sono esempi didattici, non vengono dal testo.&lt;/p&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px&quot; id=&quot;oqaBtns&quot;&gt;
      &lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-d=&quot;0&quot;&gt;Tagliare i benefit sanitari per comprare un sistema di magazzino&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Rinviare un nuovo prodotto per tenere alti gli utili&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;2&quot;&gt;Chiudere lo stabilimento locale e spostarlo all&#x27;estero&lt;/button&gt;
    &lt;/div&gt;
    &lt;ol id=&quot;oqaList&quot; style=&quot;padding-left:1.2em;margin:0&quot;&gt;&lt;/ol&gt;
  &lt;/div&gt;

  &lt;p&gt;Se queste domande sono sempre aperte, conviene abbandonare la Separation Fallacy. Serve una teoria del business che includa le risposte. Una risposta possibile è &quot;conta solo il valore per gli azionisti&quot;, ma anche questa è già &lt;b&gt;una presa di posizione etica&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;E Milton Friedman?&lt;/h4&gt;&lt;p&gt;Friedman, &quot;a differenza di molti suoi divulgatori&quot;, dà forse una risposta moralmente ricca: la responsabilità del dirigente è fare profitti &lt;b&gt;nel rispetto della legge e del costume etico&lt;/b&gt;. A seconda di come si interpreta questa clausola, la differenza con l&#x27;approccio stakeholder può ridursi a un disaccordo su &lt;b&gt;come funziona il mondo&lt;/b&gt;. Freeman preferisce integrare etica e business in una rete di relazioni, invece di trattare l&#x27;etica come un &lt;span class=&quot;en&quot;&gt;side constraint&lt;/span&gt; (vincolo esterno) sul profitto.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot; id=&quot;integration&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Integration Thesis · p. 10&lt;/span&gt;&lt;blockquote&gt;La maggior parte delle decisioni di business, o delle frasi sul business, ha un contenuto etico o una visione etica implicita. La maggior parte delle decisioni etiche, o delle frasi sull&#x27;etica, ha un contenuto di business o una visione implicita del business.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Nota 10: la seconda metà della tesi resta &quot;per un&#x27;altra occasione&quot;. Freeman accenna che la filosofia politica potrebbe partire da &quot;come si rende sostenibile nel tempo la creazione di valore?&quot; invece che da &quot;come si giustifica lo Stato?&quot;.&lt;/p&gt;&lt;/div&gt;
  &lt;p&gt;Per Freeman l&#x27;etica riguarda regole, principi, conseguenze, carattere, cioè ciò che usiamo per vivere insieme. Una definizione possibile, di taglio &lt;b&gt;pragmatista&lt;/b&gt; (nota 11: segue la logica di John Rawls in &lt;i&gt;Political Liberalism&lt;/i&gt;): l&#x27;etica come &lt;b&gt;conversazione&lt;/b&gt; su come ragionare insieme, risolvere le differenze e riconoscere dove i nostri interessi sono uniti, così da prosperare tutti senza ricorrere a coercizione e violenza.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Responsibility Principle · p. 11&lt;/span&gt;&lt;blockquote&gt;Most people, most of the time, want to, actually do, and should accept responsibility for the effects of their actions on others.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;La maggior parte delle persone, quasi sempre, vuole, di fatto accetta e dovrebbe accettare la responsabilità per gli effetti delle proprie azioni sugli altri. È incompatibile con la Separation Fallacy: se il business è separato dall&#x27;etica, non c&#x27;è responsabilità morale per le decisioni di business. Senza questo principio, dice Freeman, l&#x27;etica &quot;non decolla&quot; ed è un esercizio in malafede. Nota 12: anche il modello dominante deve rispondere sulla responsabilità, e risponde &quot;i dirigenti rispondono solo degli effetti sugli azionisti&quot;.&lt;/p&gt;&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Catena logica verso il nuovo modello&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;6&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;86&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;Rifiuto la&lt;/text&gt;&lt;text x=&quot;86&quot; y=&quot;84&quot;&gt;Separation Fallacy&lt;/text&gt;
        &lt;rect x=&quot;196&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;276&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;Adotto la&lt;/text&gt;&lt;text x=&quot;276&quot; y=&quot;84&quot;&gt;Integration Thesis&lt;/text&gt;
        &lt;rect x=&quot;386&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;466&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;Accetto il&lt;/text&gt;&lt;text x=&quot;466&quot; y=&quot;84&quot;&gt;Responsibility Principle&lt;/text&gt;
        &lt;rect x=&quot;576&quot; y=&quot;34&quot; width=&quot;178&quot; height=&quot;78&quot; rx=&quot;12&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;665&quot; y=&quot;66&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Serve un nuovo&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;84&quot; style=&quot;fill:var(--paper)&quot;&gt;modello di business&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M166 73H194&quot;/&gt;&lt;path d=&quot;M356 73H384&quot;/&gt;&lt;path d=&quot;M546 73H574&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;380&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;deve spiegare come la creazione di valore tiene insieme economia ed etica e tutti gli effetti sugli altri (pp. 11–12)&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché il modello dominante è &quot;resistente al cambiamento&quot;?&lt;/summary&gt;&lt;div&gt;Perché misura ogni cambiamento con un unico criterio, il valore per l&#x27;azionista (prezzo dell&#x27;azione), e cambia solo se gli azionisti sono scontenti. Quel criterio registra i problemi, se li registra, troppo tardi per reagire.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Cosa significa passare da caveat emptor a caveat venditor? Con quale caso?&lt;/summary&gt;&lt;div&gt;La responsabilità per i prodotti difettosi passa dal compratore al produttore. Con &lt;i&gt;Greenman v. Yuba Power&lt;/i&gt; il produttore risponde in modo oggettivo (strict liability), anche senza contratto con il consumatore, superando la privity of contract di &lt;i&gt;Winterbottom v. Wright&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Enuncia la Separation Fallacy e spiega perché è un errore.&lt;/summary&gt;&lt;div&gt;È l&#x27;idea che le frasi sul business non abbiano contenuto etico e quelle sull&#x27;etica non dicano nulla sul business. È un errore perché, per quasi ogni decisione, le domande dell&#x27;Open Question Argument (per chi si crea o distrugge valore, chi ne beneficia o ne soffre, quali diritti e valori si realizzano, che persona divento) restano aperte.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Su cosa Freeman dice di poter essere d&#x27;accordo con Friedman, e su cosa no?&lt;/summary&gt;&lt;div&gt;Friedman vincola il profitto a &quot;legge e costume etico&quot;, quindi una dimensione morale c&#x27;è. Il disaccordo riguarda &quot;come funziona il mondo&quot;: Freeman pensa che si crei più valore integrando l&#x27;etica nelle relazioni con gli stakeholder, non trattandola come un vincolo esterno sul profitto.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché la globalizzazione non salva il modello dominante dal punto di vista legale?&lt;/summary&gt;&lt;div&gt;Perché ovunque (India, Cina, UE) le leggi sono cambiate in modi diversi ma sempre nel senso di tutelare anche gruppi diversi dagli azionisti. Anzi, in UE le norme su società civile e dipendenti sono più complesse di quelle USA.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4. MANAGING FOR STAKEHOLDERS ============ --&gt;
&lt;section id=&quot;s-mfs&quot; class=&quot;sec t-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;4 · Managing for stakeholders &lt;span class=&quot;pages&quot;&gt;pp. 12–16&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Il business come insieme di relazioni&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;L&#x27;idea di base è semplice: il business è un insieme di relazioni tra gruppi che hanno una posta in gioco nelle sue attività. Capire un&#x27;impresa vuol dire capire come funzionano queste relazioni, e il lavoro del manager o dell&#x27;imprenditore è gestirle e dar loro forma.&lt;/p&gt;
  &lt;p&gt;Clienti, fornitori, dipendenti, finanziatori (azionisti, obbligazionisti, banche), comunità e manager &lt;b&gt;interagiscono e creano valore&lt;/b&gt;. Lo &lt;i&gt;stakeholder&lt;/i&gt; diventa l&#x27;&lt;b&gt;unità di analisi&lt;/b&gt;: invece di chiedersi &quot;quanto vale l&#x27;azione?&quot; ci si chiede &quot;che cosa succede in ciascuna di queste relazioni?&quot;.&lt;/p&gt;

  &lt;h3 id=&quot;wheel-sec&quot;&gt;La ruota: Figure 1&lt;/h3&gt;
  &lt;p&gt;Freeman usa una variante del classico diagramma &lt;span class=&quot;en&quot;&gt;wheel and spoke&lt;/span&gt; (ruota e raggi; nota 13: lo spirito viene da Robert Phillips). &lt;b&gt;Clicca&lt;/b&gt; sui settori per vedere la posta in gioco di ciascun gruppo.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
    &lt;div class=&quot;svgbox&quot;&gt;
      &lt;svg id=&quot;wheel&quot; viewBox=&quot;0 0 400 400&quot; role=&quot;img&quot; aria-label=&quot;Ruota degli stakeholder, interattiva&quot;&gt;&lt;/svg&gt;
      &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px&quot;&gt;
        &lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;defBroad&quot;&gt;Definizione ampia&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;defNarrow&quot;&gt;Definizione stretta&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; id=&quot;shPanel&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Clicca un settore&lt;/span&gt;&lt;h4&gt;The Firm&lt;/h4&gt;&lt;p&gt;Al centro Freeman mette impresa e manager perché la sua è una teoria del management. Ma avverte che &lt;b&gt;non c&#x27;è alcuna pretesa metafisica&lt;/b&gt;: le imprese non sono il centro dell&#x27;universo. Si potrebbero mettere al centro i clienti, per dire che sono la priorità, o i dipendenti collegati a clienti e azionisti.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Ricostruzione della Figure 1 (p. 13). Anello interno: stakeholder &lt;b&gt;primari&lt;/b&gt;; anello esterno: stakeholder &lt;b&gt;secondari&lt;/b&gt;. Le descrizioni dei gruppi secondari sono esempi didattici: il testo dice solo che &quot;influenzano gli stakeholder primari&quot;.&lt;/p&gt;

  &lt;h3&gt;Che cos&#x27;è uno stakeholder? Più definizioni&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;Stretta&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;Ampia&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;Altre&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot;&gt;L&#x27;approccio di Freeman&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;div class=&quot;def&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Primari / definitional&lt;/span&gt;&lt;blockquote&gt;Quei gruppi senza il cui sostegno il business cesserebbe di essere vitale.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;È l&#x27;anello interno: finanziatori, clienti, fornitori, dipendenti, comunità. Ogni impresa, grande o piccola, ha a che fare con queste relazioni.&lt;/p&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Ma i pesi cambiano.&lt;/b&gt; In una start-up a volte non ci sono fornitori, e la cosa giusta è curare moltissimo uno o due clienti chiave e il &lt;span class=&quot;en&quot;&gt;venture capitalist&lt;/span&gt; (il finanziatore che investe in imprese nuove e rischiose).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;div class=&quot;def&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Secondari / instrumental&lt;/span&gt;&lt;blockquote&gt;A stakeholder is any group or individual that can affect or be affected by the realization of an organization&#x27;s purpose.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Qualsiasi gruppo o individuo che può influenzare il raggiungimento degli scopi dell&#x27;organizzazione o esserne influenzato. Come minimo, alcuni gruppi influenzano gli stakeholder primari: è l&#x27;anello esterno (governo, concorrenti, associazioni dei consumatori, gruppi di interesse, media). È la definizione legata al libro di Freeman del 1984.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;p&gt;Negli ultimi trent&#x27;anni sono nate altre definizioni, alcune basate su &lt;b&gt;rischi e ricompense&lt;/b&gt; (è stakeholder chi sopporta un rischio legato all&#x27;impresa), altre sulla &lt;b&gt;reciprocità degli interessi&lt;/b&gt;. Il dibattito sulla &quot;vera definizione&quot; probabilmente non finirà mai.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;p&gt;Freeman non cerca la definizione &quot;vera&quot;. Il suo approccio è &lt;b&gt;pragmatista&lt;/b&gt;: chiarire &lt;i&gt;a che cosa serve&lt;/i&gt; la definizione che si usa. Ci sono pochissimi principi validi per tutte le imprese del mondo e molti modi di avere successo, cioè molte &quot;versioni&quot; del managing for stakeholders.&lt;/p&gt;
      &lt;p&gt;Per questo vede poca utilità nel cercare un unico modello, shareholder o stakeholder, valido per tutte le imprese ovunque. Gli interessa invece capire &lt;b&gt;come funzionano le poste in gioco nel processo di creazione del valore&lt;/b&gt; e qual è il ruolo dell&#x27;executive.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono gli stakeholder primari e perché si chiamano anche &quot;definitional&quot;?&lt;/summary&gt;&lt;div&gt;Finanziatori, clienti, fornitori, dipendenti e comunità. Si chiamano &quot;definitional&quot; perché definiscono l&#x27;impresa: senza il loro sostegno smetterebbe di essere vitale.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché Freeman preferisce &quot;financiers&quot; a &quot;owners&quot;?&lt;/summary&gt;&lt;div&gt;Perché il loro rapporto con l&#x27;impresa è un investimento con un&#x27;attesa di ritorno finanziario (azioni, obbligazioni, prestiti), e la &quot;proprietà&quot; è solo uno dei modi di finanziare. Se si parla di proprietà, va con essa una responsabilità per come la si usa.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché l&#x27;impresa sta al centro della ruota? Deve starci per forza?&lt;/summary&gt;&lt;div&gt;Ci sta perché è una teoria del management, ma non c&#x27;è alcuna pretesa metafisica: si possono disegnare ruote con al centro i clienti o i dipendenti.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che cosa si aspettano i dipendenti in cambio del loro lavoro?&lt;/summary&gt;&lt;div&gt;Sicurezza, salario, benefit e un lavoro significativo. Spesso partecipano alle decisioni, a volte sono anche finanziatori (piani di azionariato). Freeman suggerisce di pensare questa relazione in termini di contratti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5. EXECUTIVE ============ --&gt;
&lt;section id=&quot;s-executive&quot; class=&quot;sec t-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;5 · La responsabilità dell&#x27;executive &lt;span class=&quot;pages&quot;&gt;pp. 16–19&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Tenere le poste in gioco nella stessa direzione&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;L&#x27;executive ha un ruolo speciale. Ha una posta in gioco come ogni dipendente (un contratto di lavoro, esplicito o implicito), legata a quelle degli altri, e in più deve curare la salute dell&#x27;intera impresa, mantenere i vari interessi &lt;i&gt;più o meno nella stessa direzione&lt;/i&gt; e tenerli in equilibrio.&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nota 14: niente &quot;fiduciary duty to stakeholders&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nelle versioni precedenti del saggio Freeman proponeva di estendere il &lt;dfn&gt;fiduciary duty&lt;/dfn&gt; (dovere fiduciario: l&#x27;obbligo legale e morale di agire nell&#x27;interesse di qualcuno, che il modello classico riconosce verso gli azionisti) a tutti gli stakeholder. Ora lo esclude: allargarlo snaturerebbe il concetto stesso di &quot;fiduciario&quot;, e avere un dovere speciale verso uno solo o pochi stakeholder &quot;non aiuta&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Interessi joint, non opposti&lt;/h3&gt;
  &lt;p&gt;Nessuno stakeholder è isolato nella creazione di valore. Come potrebbe un obbligazionista avere un ritorno se il management trascura clienti e dipendenti? Come potrebbero i clienti avere prodotti senza dipendenti e fornitori? Come potrebbero i dipendenti vivere bene senza comunità?&lt;/p&gt;
  &lt;p&gt;Molti vedono come problema centrale il &lt;span class=&quot;en&quot;&gt;priority problem&lt;/span&gt;: quali stakeholder contano di più, come fare i &lt;span class=&quot;en&quot;&gt;tradeoffs&lt;/span&gt; tra loro. Per Freeman è una &lt;b&gt;questione secondaria&lt;/b&gt;. Prima di tutto bisogna vedere gli interessi come &lt;dfn&gt;joint&lt;/dfn&gt;: congiunti, legati tra loro per natura.&lt;/p&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:0;align-items:center&quot;&gt;
      &lt;svg id=&quot;frontier&quot; viewBox=&quot;0 0 340 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico tradeoff contro reframing&quot;&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Tradeoff o reframing? Muovi i cursori&lt;/h4&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;th&quot;&gt;Come divido il valore (sposta il punto sulla curva)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;th&quot; min=&quot;0&quot; max=&quot;90&quot; value=&quot;45&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rf&quot;&gt;Reframing: ripensare il problema (innovazione, nuove soluzioni)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rf&quot; min=&quot;0&quot; max=&quot;60&quot; value=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;out&quot; id=&quot;frOut&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;small&quot; style=&quot;margin-top:10px&quot;&gt;Modello didattico, non nel testo. La curva tratteggiata è la frontiera iniziale: lungo di essa, dare di più a uno significa togliere all&#x27;altro. Il reframing sposta la curva verso l&#x27;esterno e tutti e due possono guadagnare.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;domanda da tradeoff&lt;/span&gt;&lt;h4&gt;&quot;Perché non…&quot;&lt;/h4&gt;&lt;p&gt;…rinviare la spesa per nuovi prodotti per i clienti, così da tenere gli utili un po&#x27; più alti?&lt;/p&gt;&lt;p&gt;…tagliare i benefit sanitari dei dipendenti per investire in un nuovo sistema di controllo del magazzino?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--slate)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;domanda riformulata&lt;/span&gt;&lt;h4&gt;&quot;Come possiamo…&quot;&lt;/h4&gt;&lt;p&gt;…investire in nuovi prodotti &lt;b&gt;e&lt;/b&gt; avere utili più alti?&lt;/p&gt;&lt;p&gt;…avere dipendenti sani e soddisfatti, capaci di lavorare con creatività, così da cogliere davvero i benefici delle nuove tecnologie come i sistemi di magazzino?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;blockquote class=&quot;q&quot;&gt;Servire tutti i tuoi stakeholder è il modo migliore per ottenere risultati di lungo periodo e far crescere un&#x27;impresa prospera… Non c&#x27;è conflitto tra servire tutti gli stakeholder e dare ottimi ritorni agli azionisti. Nel lungo periodo è impossibile avere l&#x27;uno senza l&#x27;altro. Servire tutti questi gruppi, però, richiede disciplina, visione e una leadership impegnata.&lt;cite&gt;Bill George, ex CEO di Medtronic, &lt;i&gt;Authentic Leadership&lt;/i&gt; (nota 15), citato a pp. 17–18&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;La responsabilità principale · p. 18&lt;/span&gt;&lt;blockquote&gt;Managing for stakeholders is about creating as much value as possible for stakeholders, without resorting to tradeoffs.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Quando gli interessi sono in conflitto, l&#x27;executive deve ripensare il problema perché possano stare insieme e si crei ancora più valore per ciascuno. Se un tradeoff è inevitabile, come capita spesso nel mondo reale, va fatto e poi bisogna &lt;b&gt;subito&lt;/b&gt; cominciare a migliorarlo per tutte le parti. Nota 16: questa indicazione è chiara almeno quanto quella del modello dominante (&quot;crea più valore possibile per gli azionisti&quot;).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Il ruolo del purpose&lt;/h3&gt;
  &lt;p&gt;Il compito è più facile se l&#x27;impresa ha un &lt;dfn&gt;purpose&lt;/dfn&gt;, uno scopo che parla &quot;al cuore e alla mente&quot; degli stakeholder chiave. Gli scopi possibili sono molti, e tutte queste organizzazioni devono comunque fare profitti, altrimenti non possono perseguirli:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wal-Mart&lt;/h4&gt;&lt;p&gt;&quot;Everyday low price&quot;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Merck&lt;/h4&gt;&lt;p&gt;Alleviare la sofferenza umana&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Grameen Bank&lt;/h4&gt;&lt;p&gt;Eliminare la povertà&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fannie Mae&lt;/h4&gt;&lt;p&gt;Case accessibili a ogni livello di reddito&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tastings&lt;/h4&gt;&lt;p&gt;Ristorante locale: buon cibo e buon vino per tante persone della comunità&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&quot;Il capitalismo funziona perché possiamo perseguire il nostro scopo insieme ad altri.&quot; Nota 8: Collins e Porras (&lt;i&gt;Built to Last&lt;/i&gt;) sostengono che anche chi vuole massimizzare il valore per gli azionisti farebbe meglio a concentrarsi sul purpose, perché puntare direttamente al valore non lo massimizza. È come l&#x27;idea di Aristotele che la felicità non si ottiene cercandola, o quella di Mill sull&#x27;utilità.&lt;/p&gt;

  &lt;h3&gt;Stakeholder con nomi e volti&lt;/h3&gt;
  &lt;p&gt;Le imprese sono istituzioni umane, fatte di persone reali e complesse: gli stakeholder &quot;hanno nomi, volti e figli&quot;, non sono semplici ruoli sociali. Per questo l&#x27;etica, in questo approccio, è &lt;b&gt;routine&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;assunto del modello dominante&lt;/span&gt;&lt;p&gt;Gli azionisti tengono solo ai ritorni, quindi i loro agenti (i manager) devono tenere solo ai ritorni. Le persone agiscono per un &lt;b&gt;interesse personale ristretto&lt;/b&gt; (&lt;span class=&quot;en&quot;&gt;narrow self-interest&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;la visione di Freeman&lt;/span&gt;&lt;p&gt;Siamo interessati a noi stessi &lt;b&gt;e&lt;/b&gt; agli altri. Lavoriamo anche per creare cose con e per gli altri, senza negare l&#x27;incentivo dello stipendio. L&#x27;assunto ristretto è limitante e &lt;b&gt;si autoalimenta&lt;/b&gt;: chi crede che ci si aspetti egoismo da lui inizia a comportarsi così, come mostrano scandali come Enron.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote class=&quot;q&quot;&gt;The only assets I manage go up and down the elevators everyday.&lt;cite&gt;Un CEO citato a p. 19: gli unici beni che gestisco salgono e scendono con l&#x27;ascensore ogni giorno.&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché per Freeman il &quot;priority problem&quot; è secondario?&lt;/summary&gt;&lt;div&gt;Perché gli interessi degli stakeholder sono joint, cioè legati tra loro: nessuno crea valore da solo. Prima va cercato il modo di farli andare insieme (reframing); solo se è inevitabile si fa un tradeoff, e lo si migliora subito.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Riformula: &quot;tagliamo la formazione per far quadrare il trimestre&quot;.&lt;/summary&gt;&lt;div&gt;Ad esempio: &quot;Come possiamo formare meglio le persone in modo che la produttività cresca e il trimestre migliori?&quot; Si passa da &quot;chi perde?&quot; a &quot;come guadagniamo tutti?&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché Freeman rinuncia all&#x27;idea di un &quot;fiduciary duty to stakeholders&quot;?&lt;/summary&gt;&lt;div&gt;Perché estendere il dovere fiduciario a tutti lo svuoterebbe di senso, e un dovere speciale verso uno o pochi stakeholder non aiuta.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che rapporto c&#x27;è tra purpose e profitto?&lt;/summary&gt;&lt;div&gt;Il purpose motiva gli stakeholder e rende più probabile un successo duraturo; il profitto è la condizione per poterlo perseguire. Non si escludono.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6. ARGOMENTI ============ --&gt;
&lt;section id=&quot;s-argomenti&quot; class=&quot;sec t-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;6 · Argomenti per il managing for stakeholders &lt;span class=&quot;pages&quot;&gt;pp. 20–24&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Tre argomenti etici e uno pragmatista&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Se gli stakeholder sono persone, le idee dell&#x27;etica si applicano automaticamente. Comunque si interpreti la parola, bisogna badare agli effetti delle proprie azioni sugli altri: è il Responsibility Principle, pietra angolare di ogni teoria etica adeguata.&lt;/p&gt;
  &lt;p&gt;Freeman presenta tre argomenti che i filosofi collegheranno ai &lt;b&gt;tre grandi approcci storici della teoria etica&lt;/b&gt;, e poi un quarto che ritiene più forte. Le etichette nella tabella (consequenzialismo, deontologia, etica delle virtù) sono la classificazione standard: il testo non le nomina.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Argomento&lt;/th&gt;&lt;th&gt;Tradizione etica&lt;/th&gt;&lt;th&gt;Domanda guida&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consequences&lt;/b&gt;&lt;/td&gt;&lt;td&gt;consequenzialismo (utilitarismo)&lt;/td&gt;&lt;td&gt;Quale modello produce le conseguenze migliori?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rights&lt;/b&gt;&lt;/td&gt;&lt;td&gt;deontologia, etica dei diritti&lt;/td&gt;&lt;td&gt;Che cosa è dovuto a ciascuno?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Character&lt;/b&gt;&lt;/td&gt;&lt;td&gt;etica delle virtù&lt;/td&gt;&lt;td&gt;Che impresa, e che persone, vogliamo essere?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Pragmatist&lt;/b&gt;&lt;/td&gt;&lt;td&gt;pragmatismo (James, Dewey, Rorty)&lt;/td&gt;&lt;td&gt;Come possiamo vivere meglio insieme?&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;1 · Conseguenze&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;2 · Diritti&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;3 · Carattere&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot; id=&quot;arg-prag-tab&quot;&gt;4 · Pragmatista&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Consequences&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;La difesa classica del modello dominante:&lt;/b&gt; porta alle conseguenze migliori per tutti. Si invoca la &lt;dfn&gt;mano invisibile&lt;/dfn&gt; di Adam Smith: se ognuno persegue il proprio interesse, emerge il bene di tutti.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Il problema:&lt;/b&gt; la moderna teoria dell&#x27;&lt;span class=&quot;en&quot;&gt;general equilibrium&lt;/span&gt; (equilibrio economico generale: lo studio di quando tutti i mercati sono in equilibrio insieme) mostra che l&#x27;argomento funziona solo in &lt;b&gt;condizioni molto speciali&lt;/b&gt;, che descrivono di rado il mondo reale. E anche se ci si avvicina a quelle condizioni, non è garantito che il bene massimo si realizzi.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;La tesi di Freeman:&lt;/b&gt; il managing for stakeholders può dare conseguenze migliori perché riconosce che gli interessi sono joint. Se uno stakeholder si avvantaggia di continuo a spese degli altri, in una società libera gli altri:&lt;/p&gt;
      &lt;figure class=&quot;svgbox&quot; style=&quot;margin:14px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Le tre reazioni degli stakeholder sfruttati&quot;&gt;
          &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
          &lt;text x=&quot;105&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Uno stakeholder&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;guadagna sempre a spese degli altri&lt;/text&gt;
          &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M200 90 C 250 40 270 35 318 35&quot;/&gt;&lt;path d=&quot;M200 100 H318&quot;/&gt;&lt;path d=&quot;M200 110 C 250 160 270 165 318 165&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;12.5&quot;&gt;
            &lt;rect x=&quot;320&quot; y=&quot;12&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;40&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;1 · Exit&lt;/tspan&gt;: escono e formano una nuova rete di stakeholder&lt;/text&gt;
            &lt;rect x=&quot;320&quot; y=&quot;77&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;105&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;2 · Politica&lt;/tspan&gt;: usano il processo politico per limitarlo&lt;/text&gt;
            &lt;rect x=&quot;320&quot; y=&quot;142&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;170&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;3 · Invenzione&lt;/tspan&gt;: inventano un&#x27;altra attività per i loro bisogni&lt;/text&gt;
          &lt;/g&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;p. 21 (nota 18: Venkataraman, Velamuri, Harting e altri).&lt;/figcaption&gt;
      &lt;/figure&gt;
      &lt;p&gt;Visti gli stakeholder come impegnati in una serie di contrattazioni, se riconoscono gli interessi comuni otterranno risultati migliori che inseguendo ciascuno il proprio interesse ristretto. Nota 19: esistono situazioni da &lt;span class=&quot;en&quot;&gt;prisoner&#x27;s dilemma&lt;/span&gt; (dilemma del prigioniero: dove la scelta razionale del singolo porta tutti a un risultato peggiore), ma non sono i casi tipici, e sembra che li risolviamo di routine (Russell Hardin).&lt;/p&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Da CSR a &quot;corporate stakeholder responsibility&quot;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Obiezione:&lt;/b&gt; questo approccio ignora le conseguenze sociali, quindi serve la &lt;span class=&quot;en&quot;&gt;corporate social responsibility&lt;/span&gt; (CSR, responsabilità sociale d&#x27;impresa). &lt;b&gt;Risposta:&lt;/b&gt; è un &quot;arto vestigiale&quot; del modello dominante. La CSR serve solo se si pensa che gli unici effetti del business siano economici. Se le relazioni con gli stakeholder sono già immerse nella moralità, la CSR non serve più: la si sostituisce con la &lt;dfn&gt;corporate stakeholder responsibility&lt;/dfn&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Rights&lt;/h4&gt;
      &lt;p&gt;La storia dominante dà i &lt;span class=&quot;en&quot;&gt;property rights&lt;/span&gt; (diritti di proprietà) sull&#x27;impresa &lt;b&gt;solo agli azionisti&lt;/b&gt;. Viene spontaneo chiedersi: e i diritti degli altri stakeholder coinvolti?&lt;/p&gt;
      &lt;p&gt;Il managing for stakeholders prende sul serio i diritti. Se i diritti hanno senso, e se quando una persona ha diritto a X ce l&#x27;hanno tutte, ragionare in termini di stakeholder viene naturale:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;gli azionisti hanno diritti di proprietà, ma &lt;b&gt;non assoluti&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;non possono usare la loro proprietà per limitare i diritti altrui: né loro né i manager loro agenti possono usare i beni dell&#x27;impresa per violare il &lt;b&gt;diritto alla vita&lt;/b&gt; di altri;&lt;/li&gt;
        &lt;li&gt;chi prende sul serio questo approccio si chiede automaticamente &lt;b&gt;che cosa è dovuto&lt;/b&gt; a clienti, fornitori, dipendenti, finanziatori e comunità, &lt;i&gt;in virtù della loro posta in gioco e della loro umanità&lt;/i&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small&quot;&gt;Freeman ammette che il concetto di &quot;diritti&quot; è notoriamente difficile da analizzare.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Character&lt;/h4&gt;
      &lt;p&gt;Per Freeman è tra gli argomenti più forti: chiede a dirigenti e imprenditori &lt;b&gt;che tipo di impresa vogliono costruire&lt;/b&gt;. La risposta è in gran parte una questione di carattere: &quot;l&#x27;aspirazione conta&quot;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;domanda ristretta&lt;/span&gt;&lt;p&gt;&quot;Come creiamo valore per gli azionisti?&quot; → l&#x27;unica virtù che emerge è la &lt;b&gt;lealtà&lt;/b&gt; agli interessi degli azionisti.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;domanda ampia&lt;/span&gt;&lt;p&gt;&quot;Come creiamo e sosteniamo valore per gli stakeholder?&quot;, &quot;come facciamo andare tutti gli interessi nella stessa direzione?&quot; → entrano in gioco &lt;b&gt;molte virtù&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Le &lt;span class=&quot;en&quot;&gt;business virtues&lt;/span&gt;: &lt;b&gt;efficienza, equità, rispetto, integrità, mantenere gli impegni&lt;/b&gt;. Sono decisive per creare valore e spariscono se si pensa solo con la logica economica ristretta. Rendendo l&#x27;etica esplicita si evita la &lt;b&gt;malafede e l&#x27;autoinganno&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot; id=&quot;arg-prag&quot;&gt;The Pragmatist&#x27;s Argument&lt;/h4&gt;
      &lt;p&gt;I pragmatisti vogliono sapere come &lt;b&gt;vivere meglio&lt;/b&gt;: come costruire noi stessi e le comunità in modo che valori come libertà e solidarietà siano il più possibile presenti nella vita quotidiana. Conseguenze, diritti e carattere si possono pensare separatamente, ma la vita è più ricca se si conversa su come vivere insieme meglio. È la tradizione di &lt;b&gt;William James&lt;/b&gt; e &lt;b&gt;John Dewey&lt;/b&gt;, ripresa da &lt;b&gt;Richard Rorty&lt;/b&gt;:&lt;/p&gt;
      &lt;blockquote class=&quot;q&quot;&gt;…pragmatists… hope instead that human beings will come to enjoy more money, more free time, and greater social equality, and also that they will develop more empathy, more ability to put themselves in the shoes of others.&lt;cite&gt;Richard Rorty, in E. Mendieta (a cura di), interviste, p. 68 (nota 20), citato a p. 23&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;Mettere dentro lo schema con cui pensiamo il business l&#x27;attenzione a libertà, uguaglianza, conseguenze, decenza, scopo condiviso ed effetti sugli altri permette di fare del business un&#x27;&lt;b&gt;istituzione umana&lt;/b&gt; e forse di &quot;rifarlo in un modo che ci sostenga&quot;.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;La chiusa · pp. 23–24&lt;/span&gt;&lt;blockquote&gt;The spirit of capitalism is the spirit of individual achievement together with the spirit of accomplishing great tasks in collaboration with others.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Il business è una pratica sociale nata per creare valore e scambiare. È prima di tutto &lt;b&gt;collaborazione&lt;/b&gt;; gli stakeholder restano liberi di formare reti in concorrenza tra loro, ma il carburante del capitalismo è il desiderio di creare valore per sé e per gli altri.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nota 17: descrittivo, normativo, strumentale… o tutto insieme?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Alcuni filosofi dicono che la stakeholder theory ha bisogno di una &quot;giustificazione normativa&quot;. Freeman la intende come richiesta di collegarla alla teoria etica tradizionale, e da pragmatista &lt;b&gt;rifiuta&lt;/b&gt; la distinzione &quot;descrittivo / normativo / strumentale&quot; adottata da molti studiosi. Il managing for stakeholders è una narrazione che è insieme:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:8px 0 0&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Descriptive&lt;/b&gt;: descrive come agiscono alcune imprese.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Aspirational e normative&lt;/b&gt;: dice come potrebbero e dovrebbero agire.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Instrumental&lt;/b&gt;: indica quali mezzi portano a quali fini.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Managerial&lt;/b&gt;: deve essere coerente su tutti i piani e guidare l&#x27;azione dei dirigenti.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché l&#x27;argomento della &quot;mano invisibile&quot; non basta a difendere il modello dominante?&lt;/summary&gt;&lt;div&gt;Perché la teoria dell&#x27;equilibrio generale mostra che il risultato &quot;migliore per tutti&quot; si ha solo in condizioni molto particolari, raramente reali, e anche avvicinandosi a quelle condizioni non è garantito.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali tre reazioni hanno gli stakeholder sfruttati in modo continuato?&lt;/summary&gt;&lt;div&gt;(1) Exit, per formare una nuova rete di stakeholder; (2) usare il processo politico per limitare chi li sfrutta; (3) inventare un&#x27;altra forma di attività che soddisfi i loro bisogni.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché Freeman dice che la CSR è un &quot;arto vestigiale&quot;?&lt;/summary&gt;&lt;div&gt;Perché serve solo se si accetta il modello dominante, dove gli effetti del business sono solo economici e quelli sociali vanno aggiunti a parte. Se le relazioni con gli stakeholder sono già morali, basta la &quot;corporate stakeholder responsibility&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali virtù di business cita l&#x27;argomento dal carattere?&lt;/summary&gt;&lt;div&gt;Efficienza, equità, rispetto, integrità, mantenere gli impegni, e altre. Con la sola domanda sul valore per gli azionisti resterebbe soltanto la lealtà verso di loro.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual è la visione del capitalismo nell&#x27;argomento pragmatista?&lt;/summary&gt;&lt;div&gt;Una pratica sociale di cooperazione per creare valore e scambiarlo: spirito di realizzazione individuale insieme allo spirito di compiere grandi imprese con gli altri.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7. SINTESI ============ --&gt;
&lt;section id=&quot;s-sintesi&quot; class=&quot;sec&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;7 · Sintesi a confronto&lt;/div&gt;
  &lt;h2&gt;Due storie sul business&lt;/h2&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Modello dominante&lt;/th&gt;&lt;th&gt;Managing for stakeholders&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Per chi si gestisce&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Solo per gli azionisti; il resto è incidentale&lt;/td&gt;&lt;td&gt;Per tutti gli stakeholder: clienti, fornitori, dipendenti, comunità, finanziatori&lt;/td&gt;&lt;/tr&gt;
