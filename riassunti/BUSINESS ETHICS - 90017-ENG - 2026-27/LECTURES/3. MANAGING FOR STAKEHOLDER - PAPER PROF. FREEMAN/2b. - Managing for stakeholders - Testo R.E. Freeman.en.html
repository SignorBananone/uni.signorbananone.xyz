    &lt;a href=&quot;#integration&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;228&quot; width=&quot;240&quot; height=&quot;52&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;180&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13.5&quot;&gt;Integration Thesis&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;+ Responsibility Principle&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-mfs&quot;&gt;&lt;rect x=&quot;360&quot; y=&quot;336&quot; width=&quot;240&quot; height=&quot;58&quot; rx=&quot;14&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;text x=&quot;480&quot; y=&quot;361&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot; style=&quot;fill:var(--paper)&quot;&gt;Managing for stakeholders&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;business as a network of relationships&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#wheel-sec&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;150&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Stakeholders and stakes&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;primary · secondary&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-executive&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Executive responsibility&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;joint interests · purpose&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s-argomenti&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;456&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;610&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Three ethical arguments&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;consequences · rights · character&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#arg-prag&quot;&gt;&lt;rect x=&quot;740&quot; y=&quot;456&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;840&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Pragmatist argument&lt;/text&gt;&lt;text x=&quot;840&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;capitalism = cooperation&lt;/text&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The thread of the essay: it starts from the dominant model, exposes three &quot;fatal&quot; flaws in it, dismantles the idea that business and ethics are separate, and proposes a new model justified by four arguments.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 1. THESIS ============ --&gt;
&lt;section id=&quot;s-intro&quot; class=&quot;sec&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;1 · The thesis of the essay &lt;span class=&quot;pages&quot;&gt;pp. 2–3&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;An emerging view of business&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Freeman proposes the label &lt;span class=&quot;en&quot;&gt;managing for stakeholders&lt;/span&gt; for a view of the firm that has emerged over the past thirty years from the work of scholars in very different disciplines, from finance to philosophy.&lt;/p&gt;
  &lt;p&gt;Two terms to pin down from the outset:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;term&lt;/span&gt;&lt;h4&gt;Shareholder&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Shareholder&lt;/b&gt;: anyone who owns shares in the firm (&lt;span class=&quot;en&quot;&gt;share&lt;/span&gt; = a portion of ownership). Freeman often prefers the term &lt;span class=&quot;en&quot;&gt;financiers&lt;/span&gt;: shareholders, bondholders and banks.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;term&lt;/span&gt;&lt;h4&gt;Stakeholder&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Stakeholder&lt;/b&gt;: anyone who has a &lt;span class=&quot;en&quot;&gt;stake&lt;/span&gt; in the firm&#x27;s activities: customers, suppliers, employees, communities, financiers. The play on the word &lt;span class=&quot;en&quot;&gt;shareholder&lt;/span&gt; is deliberate.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;The basic idea&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;The model it opposes&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;How the essay proceeds&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;p&gt;Businesses, and the executives who manage them, &lt;b&gt;actually do&lt;/b&gt; and &lt;b&gt;should&lt;/b&gt; create value for customers, suppliers, employees, communities and financiers. Close attention must therefore be paid to &lt;i&gt;how&lt;/i&gt; these relationships are managed and &lt;i&gt;how&lt;/i&gt; value is created for each of them.&lt;/p&gt;
      &lt;p&gt;The statement works on two levels: a &lt;b&gt;descriptive&lt;/b&gt; one (this is how firms work) and a &lt;b&gt;normative&lt;/b&gt; one (this is how they ought to work). Freeman deliberately keeps the two together (see note 17, section 6).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;p&gt;The &lt;dfn&gt;dominant model&lt;/dfn&gt;: the firm should be managed &lt;b&gt;solely for the benefit of shareholders&lt;/b&gt;. Any other benefits (or harms) it produces are &lt;i&gt;incidental&lt;/i&gt;, i.e. side effects.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Note 4: in the dominant model one &quot;does not manage &lt;i&gt;for&lt;/i&gt;&quot; those benefits. Hence the title: &lt;i&gt;managing &lt;b&gt;for&lt;/b&gt; stakeholders&lt;/i&gt;, managing with stakeholders as the end.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;ol&gt;
        &lt;li&gt;Why the dominant story &lt;b&gt;no longer works&lt;/b&gt;: it resists change, is inconsistent with the law and ignores ethics. Each of these flaws is &quot;fatal&quot; in the twenty-first century.&lt;/li&gt;
        &lt;li&gt;The basic ideas of &lt;i&gt;managing for stakeholders&lt;/i&gt;: taking the &lt;i&gt;stakeholder&lt;/i&gt; as the &lt;b&gt;unit of analysis&lt;/b&gt; makes it hard to ignore ethics.&lt;/li&gt;
        &lt;li&gt;The executive&#x27;s primary responsibility: to create &lt;b&gt;as much value as possible for stakeholders&lt;/b&gt;. No stakeholder interest stands alone.&lt;/li&gt;
        &lt;li&gt;Three arguments from ethical theory, plus a fourth, &lt;b&gt;pragmatist argument&lt;/b&gt;: capitalism as a system of social &lt;b&gt;cooperation&lt;/b&gt; rather than competition.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;A note on the name&lt;/h4&gt;&lt;p&gt;The same idea has been called &lt;span class=&quot;en&quot;&gt;stakeholder management&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;stakeholder capitalism&lt;/span&gt; and the &lt;span class=&quot;en&quot;&gt;stakeholder theory of the modern corporation&lt;/span&gt;. Freeman opts for &lt;span class=&quot;en&quot;&gt;managing for stakeholders&lt;/span&gt; and warns that his version is &quot;rather idiosyncratic&quot; (note 2).&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the difference between a shareholder and a stakeholder?&lt;/summary&gt;&lt;div&gt;A &lt;i&gt;shareholder&lt;/i&gt; holds a portion of the firm&#x27;s ownership. A &lt;i&gt;stakeholder&lt;/i&gt; is anyone with a stake in the firm: customers, suppliers, employees, communities, financiers. Shareholders are therefore &lt;b&gt;one&lt;/b&gt; of the stakeholder groups.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Under the dominant model, what status do benefits to customers or harms to the community have?&lt;/summary&gt;&lt;div&gt;They are &lt;b&gt;incidental&lt;/b&gt;: side effects of a firm managed solely for shareholders, not goals of management.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;With what image of capitalism does the essay close?&lt;/summary&gt;&lt;div&gt;Capitalism as a system of &lt;b&gt;social cooperation and collaboration&lt;/b&gt;, rather than primarily of competition.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2. DOMINANT STORY ============ --&gt;
&lt;section id=&quot;s-dominante&quot; class=&quot;sec t-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;2 · The dominant story &lt;span class=&quot;pages&quot;&gt;pp. 3–5&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Managerial capitalism with shareholders at the centre&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;For Freeman, the modern large corporation is one of the most important innovations in human history. To understand how it should be reinvented, we need to see how the story we now tell about it took shape.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1 · In the beginning&lt;/div&gt;&lt;h4&gt;Simple businesses&lt;/h4&gt;&lt;p&gt;&quot;Doing business&quot; meant buying raw materials from suppliers, converting them into products and selling them to customers. Businesses were founded mainly by &lt;b&gt;owner-entrepreneurs&lt;/b&gt;, who worked in them alongside family members.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2 · Growth&lt;/div&gt;&lt;h4&gt;Assembly line and capital&lt;/h4&gt;&lt;p&gt;New production processes such as the &lt;span class=&quot;en&quot;&gt;assembly line&lt;/span&gt; made it possible to specialise tasks. New technologies and energy sources arrived. Firms needed &lt;b&gt;far more capital&lt;/b&gt; than a single owner could provide, and &quot;workers&quot; from outside the family became the norm.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;3 · Separation&lt;/div&gt;&lt;h4&gt;Dispersed ownership, control in managers&#x27; hands&lt;/h4&gt;&lt;p&gt;Capital came from banks, shareholders and other institutions: ownership became dispersed and &lt;b&gt;management became separated from ownership&lt;/b&gt;. To succeed, top managers had to satisfy owners, employees and their unions, suppliers and customers all at once. This system is called &lt;span class=&quot;en&quot;&gt;managerial capitalism&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;laissez-faire capitalism&lt;/span&gt; or, more recently, &lt;span class=&quot;en&quot;&gt;shareholder capitalism&lt;/span&gt;.&lt;/p&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Note 5: agency theory and the agency problem&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Freeman treats managerial capitalism and shareholder capitalism as if they were the same thing, because both accept &lt;dfn&gt;agency theory&lt;/dfn&gt;: in the modern firm, whoever &lt;b&gt;makes decisions&lt;/b&gt; (the manager, the &lt;i&gt;agent&lt;/i&gt;) is different from whoever &lt;b&gt;bears the residual risk&lt;/b&gt; (the shareholder, the &lt;i&gt;principal&lt;/i&gt;, who is paid last, after everyone else).&lt;/p&gt;&lt;p&gt;This gives rise to the &lt;dfn&gt;agency problem&lt;/dfn&gt;: how can managers be made to act in the shareholders&#x27; interest rather than their own? The classic answer is incentives tied to the share price (step 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;4 · Structure&lt;/div&gt;&lt;h4&gt;The divisionalized firm&lt;/h4&gt;&lt;p&gt;To control ever larger firms, managers invented the &lt;dfn&gt;divisionalized firm&lt;/dfn&gt;: divisions by product or market, coordinated by a central staff (&lt;span class=&quot;en&quot;&gt;headquarters&lt;/span&gt;). The model was pioneered by &lt;b&gt;Alfred Sloan at General Motors&lt;/b&gt; and then spread everywhere. The reference point for managerial authority was military and state &lt;b&gt;bureaucracy&lt;/b&gt;: rational structures and processes for orderly growth.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Note 6: Freeman refers to Alfred Chandler, &lt;i&gt;Strategy and Structure&lt;/i&gt;, and, for a less flattering portrait of GM, to Peter Drucker, &lt;i&gt;The Concept of the Corporation&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;5 · Heyday&lt;/div&gt;&lt;h4&gt;Hierarchy, stability, predictability&lt;/h4&gt;&lt;p&gt;Managerialism, hierarchy, stability and predictability grew together in the United States and Europe and formed &quot;the most powerful economic system in history&quot;. This is precisely why &lt;b&gt;Joseph Schumpeter&lt;/b&gt; feared that bureaucracy would extinguish the &lt;b&gt;creative force&lt;/b&gt; of capitalism, stifling innovation for the sake of stability.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;6 · The last 50 years&lt;/div&gt;&lt;h4&gt;&quot;Increase shareholder value&quot;&lt;/h4&gt;&lt;p&gt;The managerial model puts &lt;b&gt;shareholders at the centre&lt;/b&gt; and responds to complexity by focusing even more narrowly on &lt;span class=&quot;en&quot;&gt;shareholder value&lt;/span&gt;. Compensation plans emerge that are tied to the &lt;b&gt;share price&lt;/b&gt;, which depends heavily on Wall Street analysts&#x27; expectations of &lt;b&gt;quarterly earnings per share&lt;/b&gt;. Meeting targets and growing EPS quarter after quarter becomes the measure of performance.&lt;/p&gt;&lt;p&gt;The &lt;b&gt;Enron, WorldCom, Tyco and Arthur Andersen&lt;/b&gt; scandals stem in part from executives trying to increase shareholder value, at times in breach of accounting rules and the law.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Formula · not in the text&lt;/span&gt;
    &lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;b&gt;Earnings per share (EPS)&lt;/b&gt;: the figure Wall Street watches every quarter.&lt;/p&gt;
    &lt;p style=&quot;font:400 1.25rem var(--serif);text-align:center;margin:12px 0&quot;&gt;EPS = &lt;span style=&quot;display:inline-block;vertical-align:middle;text-align:center&quot;&gt;&lt;span style=&quot;display:block;border-bottom:1px solid var(--ink);padding:0 6px&quot;&gt;net income − preferred dividends&lt;/span&gt;&lt;span style=&quot;display:block;padding:0 6px&quot;&gt;weighted average number of common shares outstanding&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;it&quot;&gt;Example: net income of €50 million, no preferred dividends, 25 million shares → EPS = €2. If analysts expected €2.10, the share price may fall even though the firm is healthy. It is this pressure that drives &lt;span class=&quot;en&quot;&gt;short-termism&lt;/span&gt;, the subject of the report &lt;i&gt;Breaking the Short-Term Cycle&lt;/i&gt; cited by Freeman (in the second note numbered &quot;6&quot;, actually note 8).&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 210&quot; role=&quot;img&quot; aria-label=&quot;Chain of incentives in the dominant model&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Analysts&#x27;&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;108&quot;&gt;expectations&lt;/text&gt;
        &lt;rect x=&quot;155&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Quarterly&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;108&quot;&gt;EPS&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Share&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;108&quot;&gt;price&lt;/text&gt;
        &lt;rect x=&quot;445&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Executive&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;108&quot;&gt;compensation&lt;/text&gt;
        &lt;rect x=&quot;590&quot; y=&quot;60&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Risk of&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;108&quot;&gt;cooking the books&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M130 95H153&quot;/&gt;&lt;path d=&quot;M275 95H298&quot;/&gt;&lt;path d=&quot;M420 95H443&quot;/&gt;&lt;path d=&quot;M565 95H588&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;360&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;Enron, WorldCom, Tyco, Arthur Andersen (p. 5)&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;stated aim: to align managers&#x27; interests with those of shareholders&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Diagram reconstructed from pp. 4–5. Freeman&#x27;s point: this mechanism presupposes a stability and predictability that today&#x27;s world no longer guarantees.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why did the ownership of firms become dispersed?&lt;/summary&gt;&lt;div&gt;Because the assembly line, new technologies and growth required capital far beyond the means of a single owner: it was raised from banks, shareholders and institutions. The result was the separation of ownership and management.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What did Schumpeter fear?&lt;/summary&gt;&lt;div&gt;That bureaucracy and managerialism, in seeking stability and predictability, would extinguish the creative force of capitalism and stifle innovation.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How does Freeman link the Enron and WorldCom scandals to the dominant model?&lt;/summary&gt;&lt;div&gt;They arose &lt;i&gt;in part&lt;/i&gt; from executives&#x27; attempts to increase shareholder value (share price, quarterly EPS), at times in breach of accounting rules and the law.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why, in note 5, can managerial and shareholder capitalism be treated together?&lt;/summary&gt;&lt;div&gt;Because both accept agency theory: decision-making and residual risk lie in different hands (managers and shareholders), which gives rise to the agency problem.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3. THREE FLAWS ============ --&gt;
&lt;section id=&quot;s-difetti&quot; class=&quot;sec t-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;3 · The three fatal flaws &lt;span class=&quot;pages&quot;&gt;pp. 5–12&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Why the dominant story no longer holds&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Freeman identifies three flaws in the shareholder-centred model, and for him each one is enough on its own to make it unfit for the twenty-first century.&lt;/p&gt;

  &lt;h3 id=&quot;d-change&quot;&gt;a) It is resistant to change&lt;/h3&gt;
  &lt;p&gt;The model places shareholders&#x27; interests &lt;b&gt;above&lt;/b&gt; those of customers, suppliers, employees and others, &lt;i&gt;as if they were necessarily in conflict&lt;/i&gt;. It sees the firm as a &lt;b&gt;hierarchy&lt;/b&gt; held together by the authority to act on shareholders&#x27; behalf. Executives&#x27; language gives this away: &quot;we work for the shareholders&quot;, &quot;the shareholders are the boss&quot;, &quot;we have to do what the shareholders want&quot;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;consequence&lt;/span&gt;&lt;h4&gt;Change happens only if shareholders are unhappy&lt;/h4&gt;&lt;p&gt;As long as slightly better financial results arrive every quarter, &quot;there is no problem&quot;. Dissatisfied customers, falsified accounts, poor quality, an impending environmental disaster or new competitors matter &lt;b&gt;only&lt;/b&gt; for their effect on the share price.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;objection&lt;/span&gt;&lt;h4&gt;A single criterion is not enough&lt;/h4&gt;&lt;p&gt;Today&#x27;s business is global and multifaceted, and there is too much uncertainty to rely on a single indicator. Even if the share price eventually registers changes, it does so &lt;b&gt;too late&lt;/b&gt; for managers to respond.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote class=&quot;q&quot;&gt;The dominant story may describe how things work out in the long run on Wall Street, but managers must also pay attention to Main Street.&lt;cite&gt;p. 6, paraphrase. &lt;i&gt;Wall Street&lt;/i&gt; = the financial markets; &lt;i&gt;Main Street&lt;/i&gt; = the real economy of people and communities.&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Note 7: finance as a &quot;universal acid&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Executives take little comfort from the claim that &quot;in the long run the most efficient firms survive&quot;. Some market theorists see financial theory as a &quot;universal acid&quot; that cuts through every decision, whether managers realise it or not. Perhaps, Freeman suggests, the real difference is that the two models are talking about &lt;b&gt;different things&lt;/b&gt;: the dominant one about the strict economic logic of markets, &lt;i&gt;managing for stakeholders&lt;/i&gt; about how human beings create value for one another.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;d-law&quot;&gt;b) It is inconsistent with the law&lt;/h3&gt;
  &lt;p&gt;Putting shareholders &quot;ahead of everyone else&quot; clashes with legal reality. Corporate law does not state clearly in whose interest the corporation is to be governed, and over time it has given &lt;i&gt;de facto&lt;/i&gt; weight to the claims of other groups, placing limits on the &lt;span class=&quot;en&quot;&gt;tradeoffs&lt;/span&gt; (compromises in which one interest is sacrificed for another) that management can make. The examples are almost all from the United States:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;Customers&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;Employees&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;Local communities&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot;&gt;And elsewhere?&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;figure style=&quot;margin:6px 0 16px&quot;&gt;&lt;svg viewBox=&quot;0 0 720 150&quot; role=&quot;img&quot; aria-label=&quot;Evolution of manufacturer liability&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;70&quot; x2=&quot;690&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;circle cx=&quot;90&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1842&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;100&quot;&gt;Winterbottom v. Wright&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;privity of contract&lt;/text&gt;
          &lt;circle cx=&quot;300&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1963&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;100&quot;&gt;Greenman v. Yuba Power&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;strict liability&lt;/text&gt;
          &lt;circle cx=&quot;490&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;1972&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;100&quot;&gt;Consumer Product&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;116&quot;&gt;Safety Commission&lt;/text&gt;
          &lt;circle cx=&quot;650&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;today&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;100&quot;&gt;disclosure duties&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;116&quot; fill=&quot;var(--muted)&quot;&gt;e.g. ingredients&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;370&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;caveat emptor  →  caveat venditor&lt;/text&gt;
      &lt;/svg&gt;&lt;figcaption&gt;The dates 1963 and 1972 come from external sources (see &quot;Further reading&quot;); the text cites only 1842.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;&lt;dfn&gt;Privity of contract&lt;/dfn&gt;: only the parties to a contract can enforce its obligations. Under &lt;i&gt;Winterbottom v. Wright&lt;/i&gt; (1842), someone injured by a defective product who had no contract with the manufacturer could not sue it.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;en&quot;&gt;Product liability&lt;/span&gt; law has eroded this doctrine. &lt;i&gt;Greenman v. Yuba Power&lt;/i&gt; established the manufacturer&#x27;s &lt;dfn&gt;strict liability&lt;/dfn&gt; for harm caused by its products, &lt;b&gt;even if&lt;/b&gt; the seller exercised all possible care and the consumer has no contract with the manufacturer.&lt;/p&gt;
      &lt;p&gt;As a result, &lt;span class=&quot;en&quot;&gt;caveat emptor&lt;/span&gt; (&quot;let the buyer beware&quot;) has largely been replaced by &lt;span class=&quot;en&quot;&gt;caveat venditor&lt;/span&gt; (&quot;let the seller beware&quot;). The &lt;b&gt;Consumer Product Safety Commission&lt;/b&gt; can order product recalls, which has led to more &quot;voluntary&quot; recalls by firms seeking to limit damages. Some industries must disclose ingredients, whether customers want this or not.&lt;/p&gt;
      &lt;p class=&quot;box&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;b&gt;Conclusion:&lt;/b&gt; firms must take customers&#x27; interests into account &lt;i&gt;by law&lt;/i&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;div class=&quot;grid3&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;unions&lt;/span&gt;&lt;h4&gt;National Labor Relations Act&lt;/h4&gt;&lt;p&gt;The right to organise in a union and to bargain in good faith. It established the National Labor Relations Board to enforce it.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1963&lt;/span&gt;&lt;h4&gt;Equal Pay Act&lt;/h4&gt;&lt;p&gt;Prohibits pay discrimination.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1964&lt;/span&gt;&lt;h4&gt;Civil Rights Act, Title VII&lt;/h4&gt;&lt;p&gt;Prohibits discrimination in hiring.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1967&lt;/span&gt;&lt;h4&gt;Age Discrimination in Employment Act&lt;/h4&gt;&lt;p&gt;Age discrimination, later extended to people with disabilities.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Labour disputes and discrimination settlements with large employers have produced a body of administrative case law, and with it a &lt;b&gt;management practice&lt;/b&gt; consistent with the rights guaranteed to employees.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;p&gt;The &lt;b&gt;Clean Air Act&lt;/b&gt; and &lt;b&gt;Clean Water Act&lt;/b&gt; (with their amendments) prevent management from &lt;span class=&quot;en&quot;&gt;spoiling the commons&lt;/span&gt; (air and water belong to everyone, and a polluter shifts a cost onto others).&lt;/p&gt;
      &lt;p&gt;In &lt;i&gt;Marsh v. Alabama&lt;/i&gt; the Supreme Court held that a &lt;span class=&quot;en&quot;&gt;company town&lt;/span&gt; (a town owned by a firm) was subject to the Constitution: citizens&#x27; rights take precedence over the firm&#x27;s &quot;property rights&quot;.&lt;/p&gt;
      &lt;p&gt;Open issues at the time of the essay: protection of local businesses, mandatory employer-paid health care, minimum wages, environmental standards, and the effects of development on residents&#x27; lives. These are matters of local politics, and firms have to reckon with them.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Objection:&lt;/b&gt; in a global business, the constraints of US law matter less and less. &lt;b&gt;Reply:&lt;/b&gt; globalisation makes the argument &lt;i&gt;stronger&lt;/i&gt;. Laws have changed differently around the world, but everywhere in the direction of taking groups other than shareholders into account:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;b&gt;India&lt;/b&gt;: each state has its own rules on how business may be conducted.&lt;/li&gt;&lt;li&gt;&lt;b&gt;China&lt;/b&gt;: the law grants firms property rights, but far from exclusive ones.&lt;/li&gt;&lt;li&gt;&lt;b&gt;European Union&lt;/b&gt;: the rules on &quot;civil society&quot; and the role of employees are even more complex than in the US.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Freeman&#x27;s conclusion&lt;/span&gt;&lt;blockquote&gt;&quot;Laissez faire capitalism&quot; is simply a myth.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;If &quot;maximise shareholder value&quot; must always be qualified by legal exceptions or good practice, there are too many exceptions and the dominant story no longer serves to describe business. It can be rescued only as a &lt;b&gt;normative&lt;/b&gt; thesis (how firms &lt;i&gt;ought&lt;/i&gt; to operate), and then its conceptual and ethical problems must be examined (p. 8).&lt;/p&gt;&lt;/div&gt;

  &lt;h3 id=&quot;d-ethics&quot;&gt;c) It is inconsistent with basic ethics&lt;/h3&gt;
  &lt;p&gt;Many theories of business separate &quot;business&quot; decisions from &quot;ethical&quot; ones. This shows in the joke that &lt;i&gt;business ethics&lt;/i&gt; is an oxymoron (a contradiction in terms). Freeman gives this idea a name:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Separation Fallacy · p. 9&lt;/span&gt;&lt;blockquote&gt;It is useful to believe that sentences like &quot;x is a business decision&quot; have no ethical content or any implicit ethical point of view, and that sentences like &quot;x is an ethical decision&quot; say nothing about value creation and trade.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;&lt;span class=&quot;en&quot;&gt;Fallacy&lt;/span&gt; = an error in reasoning. In a 1994 article (note 9) Freeman called it the &lt;span class=&quot;en&quot;&gt;Separation Thesis&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;p&gt;Rejecting it has two implications. The first is that &lt;b&gt;almost every business decision has ethical content&lt;/b&gt;. To check this, simply ask whether the following questions make sense for any given decision:&lt;/p&gt;

  &lt;div id=&quot;oqa&quot; class=&quot;stepper&quot; style=&quot;scroll-margin-top:70px&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;The Open Question Argument · try it&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Choose a decision: Freeman&#x27;s four questions always remain &quot;open&quot;. The answers are teaching examples and do not come from the text.&lt;/p&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px&quot; id=&quot;oqaBtns&quot;&gt;
      &lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-d=&quot;0&quot;&gt;Cut health benefits to buy a warehouse system&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;1&quot;&gt;Delay a new product to keep earnings high&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-d=&quot;2&quot;&gt;Close the local plant and move it abroad&lt;/button&gt;
    &lt;/div&gt;
    &lt;ol id=&quot;oqaList&quot; style=&quot;padding-left:1.2em;margin:0&quot;&gt;&lt;/ol&gt;
  &lt;/div&gt;

  &lt;p&gt;If these questions are always open, we had better abandon the Separation Fallacy. We need a theory of business that incorporates the answers. One possible answer is &quot;only shareholder value matters&quot;, but this too is already &lt;b&gt;an ethical stance&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;What about Milton Friedman?&lt;/h4&gt;&lt;p&gt;Friedman, &quot;unlike many of his popularisers&quot;, arguably gives a morally rich answer: the executive&#x27;s responsibility is to make profits &lt;b&gt;while conforming to the law and ethical custom&lt;/b&gt;. Depending on how this clause is interpreted, the difference from the stakeholder approach may come down to a disagreement about &lt;b&gt;how the world works&lt;/b&gt;. Freeman prefers to integrate ethics and business within a network of relationships, rather than treating ethics as a &lt;span class=&quot;en&quot;&gt;side constraint&lt;/span&gt; on profit.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;def&quot; id=&quot;integration&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Integration Thesis · p. 10&lt;/span&gt;&lt;blockquote&gt;Most business decisions, or statements about business, have some ethical content or an implicit ethical view. Most ethical decisions, or statements about ethics, have some business content or an implicit view about business.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Note 10: the second half of the thesis is left &quot;for another occasion&quot;. Freeman hints that political philosophy might start from &quot;how is value creation made sustainable over time?&quot; rather than &quot;how is the state justified?&quot;.&lt;/p&gt;&lt;/div&gt;
  &lt;p&gt;For Freeman, ethics concerns rules, principles, consequences and character, i.e. what we use to live together. One possible definition, &lt;b&gt;pragmatist&lt;/b&gt; in tone (note 11: it follows the logic of John Rawls in &lt;i&gt;Political Liberalism&lt;/i&gt;): ethics as a &lt;b&gt;conversation&lt;/b&gt; about how to reason together, resolve our differences and recognise where our interests are joined, so that we can all flourish without resorting to coercion and violence.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The Responsibility Principle · p. 11&lt;/span&gt;&lt;blockquote&gt;Most people, most of the time, want to, actually do, and should accept responsibility for the effects of their actions on others.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;This principle is incompatible with the Separation Fallacy: if business is separate from ethics, there is no moral responsibility for business decisions. Without this principle, Freeman says, ethics &quot;cannot get off the ground&quot; and becomes an exercise in bad faith. Note 12: the dominant model too must answer the question of responsibility, and its answer is &quot;executives are responsible only for the effects on shareholders&quot;.&lt;/p&gt;&lt;/div&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Logical chain towards the new model&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;6&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;86&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;I reject the&lt;/text&gt;&lt;text x=&quot;86&quot; y=&quot;84&quot;&gt;Separation Fallacy&lt;/text&gt;
        &lt;rect x=&quot;196&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;276&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;I adopt the&lt;/text&gt;&lt;text x=&quot;276&quot; y=&quot;84&quot;&gt;Integration Thesis&lt;/text&gt;
        &lt;rect x=&quot;386&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;466&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;I accept the&lt;/text&gt;&lt;text x=&quot;466&quot; y=&quot;84&quot;&gt;Responsibility Principle&lt;/text&gt;
        &lt;rect x=&quot;576&quot; y=&quot;34&quot; width=&quot;178&quot; height=&quot;78&quot; rx=&quot;12&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;665&quot; y=&quot;66&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;A new business&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;84&quot; style=&quot;fill:var(--paper)&quot;&gt;model is needed&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M166 73H194&quot;/&gt;&lt;path d=&quot;M356 73H384&quot;/&gt;&lt;path d=&quot;M546 73H574&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;380&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;it must explain how value creation holds economics, ethics and all effects on others together (pp. 11–12)&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is the dominant model &quot;resistant to change&quot;?&lt;/summary&gt;&lt;div&gt;Because it measures every change against a single criterion, shareholder value (the share price), and changes only if shareholders are unhappy. That criterion registers problems, if at all, too late to respond.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What does the shift from caveat emptor to caveat venditor mean? Which case marks it?&lt;/summary&gt;&lt;div&gt;Liability for defective products shifts from the buyer to the manufacturer. Under &lt;i&gt;Greenman v. Yuba Power&lt;/i&gt; the manufacturer is strictly liable, even without a contract with the consumer, overcoming the privity of contract of &lt;i&gt;Winterbottom v. Wright&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;State the Separation Fallacy and explain why it is mistaken.&lt;/summary&gt;&lt;div&gt;It is the idea that statements about business have no ethical content and statements about ethics say nothing about business. It is mistaken because, for almost every decision, the questions of the Open Question Argument (for whom value is created or destroyed, who benefits or suffers, which rights and values are realised, what kind of person I become) remain open.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;On what does Freeman say he can agree with Friedman, and on what not?&lt;/summary&gt;&lt;div&gt;Friedman constrains profit by &quot;law and ethical custom&quot;, so a moral dimension is present. The disagreement concerns &quot;how the world works&quot;: Freeman thinks more value is created by integrating ethics into stakeholder relationships, not by treating it as an external constraint on profit.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does globalisation not rescue the dominant model from a legal standpoint?&lt;/summary&gt;&lt;div&gt;Because everywhere (India, China, EU) laws have changed in different ways but always towards protecting groups other than shareholders too. Indeed, in the EU the rules on civil society and employees are more complex than in the US.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4. MANAGING FOR STAKEHOLDERS ============ --&gt;
&lt;section id=&quot;s-mfs&quot; class=&quot;sec t-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;4 · Managing for stakeholders &lt;span class=&quot;pages&quot;&gt;pp. 12–16&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Business as a set of relationships&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The basic idea is simple: business is a set of relationships among groups that have a stake in its activities. Understanding a business means understanding how these relationships work, and the job of the manager or entrepreneur is to manage and shape them.&lt;/p&gt;
  &lt;p&gt;Customers, suppliers, employees, financiers (shareholders, bondholders, banks), communities and managers &lt;b&gt;interact and create value&lt;/b&gt;. The &lt;i&gt;stakeholder&lt;/i&gt; becomes the &lt;b&gt;unit of analysis&lt;/b&gt;: instead of asking &quot;what is the share worth?&quot; we ask &quot;what is happening in each of these relationships?&quot;.&lt;/p&gt;

  &lt;h3 id=&quot;wheel-sec&quot;&gt;The wheel: Figure 1&lt;/h3&gt;
  &lt;p&gt;Freeman uses a variant of the classic &lt;span class=&quot;en&quot;&gt;wheel and spoke&lt;/span&gt; diagram (note 13: its spirit comes from Robert Phillips). &lt;b&gt;Click&lt;/b&gt; on the sectors to see each group&#x27;s stake.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
    &lt;div class=&quot;svgbox&quot;&gt;
      &lt;svg id=&quot;wheel&quot; viewBox=&quot;0 0 400 400&quot; role=&quot;img&quot; aria-label=&quot;Interactive stakeholder wheel&quot;&gt;&lt;/svg&gt;
      &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px&quot;&gt;
        &lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;defBroad&quot;&gt;Broad definition&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;defNarrow&quot;&gt;Narrow definition&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; id=&quot;shPanel&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Click a sector&lt;/span&gt;&lt;h4&gt;The Firm&lt;/h4&gt;&lt;p&gt;Freeman places the firm and its managers at the centre because his is a theory of management. But he stresses that &lt;b&gt;there is no metaphysical claim&lt;/b&gt;: firms are not the centre of the universe. One could place customers at the centre, to signal that they are the priority, or employees linked to customers and shareholders.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Reconstruction of Figure 1 (p. 13). Inner ring: &lt;b&gt;primary&lt;/b&gt; stakeholders; outer ring: &lt;b&gt;secondary&lt;/b&gt; stakeholders. The descriptions of the secondary groups are teaching examples: the text says only that they &quot;can affect primary stakeholders&quot;.&lt;/p&gt;

  &lt;h3&gt;What is a stakeholder? Several definitions&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;Narrow&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;Broad&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;Others&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot;&gt;Freeman&#x27;s approach&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;div class=&quot;def&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Primary / definitional&lt;/span&gt;&lt;blockquote&gt;Those groups without whose support the business would cease to be viable.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;This is the inner ring: financiers, customers, suppliers, employees, communities. Every business, large or small, deals with these relationships.&lt;/p&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;But the weights vary.&lt;/b&gt; A start-up may have no suppliers at all, and the right thing to do is to pay very close attention to one or two key customers and to the &lt;span class=&quot;en&quot;&gt;venture capitalist&lt;/span&gt; (the financier who invests in new, high-risk ventures).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;div class=&quot;def&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Secondary / instrumental&lt;/span&gt;&lt;blockquote&gt;A stakeholder is any group or individual that can affect or be affected by the realization of an organization&#x27;s purpose.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;At a minimum, some groups affect primary stakeholders: this is the outer ring (government, competitors, consumer advocate groups, special interest groups, media). This is the definition associated with Freeman&#x27;s 1984 book.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;p&gt;Over the past thirty years other definitions have emerged, some based on &lt;b&gt;risks and rewards&lt;/b&gt; (a stakeholder is anyone who bears a risk linked to the firm), others on the &lt;b&gt;mutuality of interests&lt;/b&gt;. The debate over the &quot;true definition&quot; will probably never end.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;p&gt;Freeman is not looking for the &quot;true&quot; definition. His approach is &lt;b&gt;pragmatist&lt;/b&gt;: to make clear &lt;i&gt;what purpose&lt;/i&gt; the chosen definition serves. There are very few principles that hold for every firm in the world and many ways to succeed, i.e. many &quot;versions&quot; of managing for stakeholders.&lt;/p&gt;
      &lt;p&gt;For this reason he sees little point in searching for a single model, shareholder or stakeholder, that holds for all firms everywhere. What interests him instead is understanding &lt;b&gt;how stakes work in the value-creation process&lt;/b&gt; and what the executive&#x27;s role is.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Who are the primary stakeholders, and why are they also called &quot;definitional&quot;?&lt;/summary&gt;&lt;div&gt;Financiers, customers, suppliers, employees and communities. They are called &quot;definitional&quot; because they define the firm: without their support it would cease to be viable.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does Freeman prefer &quot;financiers&quot; to &quot;owners&quot;?&lt;/summary&gt;&lt;div&gt;Because their relationship with the firm is an investment with an expected financial return (shares, bonds, loans), and &quot;ownership&quot; is only one way of providing finance. If we do speak of ownership, it comes with responsibility for how that property is used.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is the firm at the centre of the wheel? Does it have to be?&lt;/summary&gt;&lt;div&gt;It is there because this is a theory of management, but there is no metaphysical claim: wheels can be drawn with customers or employees at the centre.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What do employees expect in return for their work?&lt;/summary&gt;&lt;div&gt;Security, wages, benefits and meaningful work. They often take part in decision-making and are sometimes financiers as well (employee share ownership plans). Freeman suggests thinking about this relationship in terms of contracts.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5. EXECUTIVE ============ --&gt;
&lt;section id=&quot;s-executive&quot; class=&quot;sec t-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;5 · The responsibility of the executive &lt;span class=&quot;pages&quot;&gt;pp. 16–19&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Keeping stakeholder interests moving in the same direction&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The executive plays a special role. Like every employee, they have a stake (an employment contract, explicit or implicit) that is bound up with the stakes of others, and in addition they must look after the health of the whole firm, keep the various interests &lt;i&gt;moving more or less in the same direction&lt;/i&gt; and keep them in balance.&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Note 14: no &quot;fiduciary duty to stakeholders&quot;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In earlier versions of the essay Freeman proposed extending &lt;dfn&gt;fiduciary duty&lt;/dfn&gt; (the legal and moral obligation to act in someone&#x27;s interest, which the classic model recognises towards shareholders) to all stakeholders. He now rules this out: broadening it would distort the very concept of a &quot;fiduciary&quot;, and having a special duty to only one or a few stakeholders &quot;is not helpful&quot;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Joint, not opposing, interests&lt;/h3&gt;
  &lt;p&gt;No stakeholder stands alone in the value-creation process. How could a bondholder obtain a return if management neglects customers and employees? How could customers obtain products without employees and suppliers? How could employees live well without communities?&lt;/p&gt;
  &lt;p&gt;Many see the &lt;span class=&quot;en&quot;&gt;priority problem&lt;/span&gt; as the central issue: which stakeholders matter most, and how to make &lt;span class=&quot;en&quot;&gt;tradeoffs&lt;/span&gt; among them. For Freeman this is a &lt;b&gt;secondary question&lt;/b&gt;. First and foremost, interests must be seen as &lt;dfn&gt;joint&lt;/dfn&gt;: inherently tied to one another.&lt;/p&gt;

  &lt;figure class=&quot;svgbox&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:0;align-items:center&quot;&gt;
      &lt;svg id=&quot;frontier&quot; viewBox=&quot;0 0 340 300&quot; role=&quot;img&quot; aria-label=&quot;Tradeoff versus reframing chart&quot;&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Tradeoff or reframing? Move the sliders&lt;/h4&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;th&quot;&gt;How I split the value (move the point along the curve)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;th&quot; min=&quot;0&quot; max=&quot;90&quot; value=&quot;45&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rf&quot;&gt;Reframing: rethinking the problem (innovation, new solutions)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rf&quot; min=&quot;0&quot; max=&quot;60&quot; value=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;out&quot; id=&quot;frOut&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;small&quot; style=&quot;margin-top:10px&quot;&gt;Teaching model, not in the text. The dashed curve is the initial frontier: along it, giving more to one party means taking from the other. Reframing shifts the curve outwards and both parties can gain.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;tradeoff question&lt;/span&gt;&lt;h4&gt;&quot;Why not…&quot;&lt;/h4&gt;&lt;p&gt;…postpone spending on new products for customers, so as to keep earnings a little higher?&lt;/p&gt;&lt;p&gt;…cut employees&#x27; health benefits to invest in a new inventory control system?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--slate)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;reframed question&lt;/span&gt;&lt;h4&gt;&quot;How can we…&quot;&lt;/h4&gt;&lt;p&gt;…invest in new products &lt;b&gt;and&lt;/b&gt; achieve higher earnings?&lt;/p&gt;&lt;p&gt;…have healthy, satisfied employees who can work creatively, so as to truly capture the benefits of new technologies such as inventory systems?&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;blockquote class=&quot;q&quot;&gt;Serving all your stakeholders is the best way to produce long-term results and create a growing, prosperous company… There is no conflict between serving all your stakeholders and providing excellent returns for shareholders. In the long term it is impossible to have one without the other. However, serving all these stakeholder groups requires discipline, vision, and committed leadership.&lt;cite&gt;Bill George, former CEO of Medtronic, &lt;i&gt;Authentic Leadership&lt;/i&gt; (note 15), quoted on pp. 17–18&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The primary responsibility · p. 18&lt;/span&gt;&lt;blockquote&gt;Managing for stakeholders is about creating as much value as possible for stakeholders, without resorting to tradeoffs.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;When interests conflict, the executive must rethink the problem so that they can go together and even more value is created for each. If a tradeoff is unavoidable, as often happens in the real world, it must be made, and then work must begin &lt;b&gt;immediately&lt;/b&gt; on improving it for all sides. Note 16: this guidance is at least as clear as that of the dominant model (&quot;create as much value as possible for shareholders&quot;).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;The role of purpose&lt;/h3&gt;
  &lt;p&gt;The task is easier if the firm has a &lt;dfn&gt;purpose&lt;/dfn&gt; that speaks to &quot;the hearts and minds&quot; of key stakeholders. There are many possible purposes, and all these organisations must still make a profit, or they cannot pursue them:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wal-Mart&lt;/h4&gt;&lt;p&gt;&quot;Everyday low price&quot;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Merck&lt;/h4&gt;&lt;p&gt;Alleviating human suffering&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Grameen Bank&lt;/h4&gt;&lt;p&gt;Eliminating poverty&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fannie Mae&lt;/h4&gt;&lt;p&gt;Affordable housing at every income level&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tastings&lt;/h4&gt;&lt;p&gt;A local restaurant: good food and good wine for many people in the community&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&quot;Capitalism works because we can pursue our purpose with others.&quot; Note 8: Collins and Porras (&lt;i&gt;Built to Last&lt;/i&gt;) argue that even those who want to maximise shareholder value would do better to focus on purpose, because aiming directly at value does not maximise it. This is like Aristotle&#x27;s idea that happiness is not achieved by seeking it, or Mill&#x27;s view on utility.&lt;/p&gt;

  &lt;h3&gt;Stakeholders with names and faces&lt;/h3&gt;
  &lt;p&gt;Firms are human institutions made up of real, complex people: stakeholders &quot;have names, faces and children&quot;; they are not mere social roles. This is why, in this approach, ethics is &lt;b&gt;routine&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;assumption of the dominant model&lt;/span&gt;&lt;p&gt;Shareholders care only about returns, so their agents (managers) must care only about returns. People act out of &lt;b&gt;narrow self-interest&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Freeman&#x27;s view&lt;/span&gt;&lt;p&gt;We are interested in ourselves &lt;b&gt;and&lt;/b&gt; in others. We also work to create things with and for others, without denying the incentive of a salary. The narrow assumption is limiting and &lt;b&gt;self-reinforcing&lt;/b&gt;: people who believe selfishness is expected of them start behaving that way, as scandals such as Enron show.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;blockquote class=&quot;q&quot;&gt;The only assets I manage go up and down the elevators everyday.&lt;cite&gt;A CEO quoted on p. 19.&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does Freeman consider the &quot;priority problem&quot; secondary?&lt;/summary&gt;&lt;div&gt;Because stakeholder interests are joint, i.e. tied to one another: no one creates value alone. The first step is to find a way to make them go together (reframing); only if it is unavoidable is a tradeoff made, and it is improved immediately.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Reframe: &quot;let&#x27;s cut training to make the quarter add up&quot;.&lt;/summary&gt;&lt;div&gt;For example: &quot;How can we train people better so that productivity rises and the quarter improves?&quot; The question shifts from &quot;who loses?&quot; to &quot;how do we all gain?&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does Freeman abandon the idea of a &quot;fiduciary duty to stakeholders&quot;?&lt;/summary&gt;&lt;div&gt;Because extending fiduciary duty to everyone would empty it of meaning, and a special duty to one or a few stakeholders is not helpful.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the relationship between purpose and profit?&lt;/summary&gt;&lt;div&gt;Purpose motivates stakeholders and makes lasting success more likely; profit is the condition for being able to pursue it. They are not mutually exclusive.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6. ARGUMENTS ============ --&gt;
&lt;section id=&quot;s-argomenti&quot; class=&quot;sec t-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;6 · Arguments for managing for stakeholders &lt;span class=&quot;pages&quot;&gt;pp. 20–24&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Three ethical arguments and a pragmatist one&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;If stakeholders are people, the ideas of ethics apply automatically. However the word is interpreted, we must pay attention to the effects of our actions on others: this is the Responsibility Principle, the cornerstone of any adequate ethical theory.&lt;/p&gt;
  &lt;p&gt;Freeman presents three arguments that philosophers will connect to the &lt;b&gt;three major historical approaches in ethical theory&lt;/b&gt;, followed by a fourth that he considers stronger. The labels in the table (consequentialism, deontology, virtue ethics) are the standard classification: the text does not use them.&lt;/p&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Argument&lt;/th&gt;&lt;th&gt;Ethical tradition&lt;/th&gt;&lt;th&gt;Guiding question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Consequences&lt;/b&gt;&lt;/td&gt;&lt;td&gt;consequentialism (utilitarianism)&lt;/td&gt;&lt;td&gt;Which model produces the best consequences?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rights&lt;/b&gt;&lt;/td&gt;&lt;td&gt;deontology, rights-based ethics&lt;/td&gt;&lt;td&gt;What is owed to each party?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Character&lt;/b&gt;&lt;/td&gt;&lt;td&gt;virtue ethics&lt;/td&gt;&lt;td&gt;What kind of firm, and what kind of people, do we want to be?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Pragmatist&lt;/b&gt;&lt;/td&gt;&lt;td&gt;pragmatism (James, Dewey, Rorty)&lt;/td&gt;&lt;td&gt;How can we live better together?&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;0&quot;&gt;1 · Consequences&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;1&quot;&gt;2 · Rights&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;2&quot;&gt;3 · Character&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;3&quot; id=&quot;arg-prag-tab&quot;&gt;4 · Pragmatist&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;0&quot;&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Consequences&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;The classic defence of the dominant model:&lt;/b&gt; it leads to the best consequences for all. Adam Smith&#x27;s &lt;dfn&gt;invisible hand&lt;/dfn&gt; is invoked: if each person pursues their own interest, the good of all emerges.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;The problem:&lt;/b&gt; modern &lt;span class=&quot;en&quot;&gt;general equilibrium&lt;/span&gt; theory (the study of when all markets are in equilibrium simultaneously) shows that the argument works only under &lt;b&gt;very special conditions&lt;/b&gt;, which seldom describe the real world. And even if those conditions are approximated, there is no guarantee that the greatest good will be achieved.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Freeman&#x27;s thesis:&lt;/b&gt; managing for stakeholders can yield better consequences because it recognises that interests are joint. If one stakeholder continually benefits at the expense of the others, in a free society the others will:&lt;/p&gt;
      &lt;figure class=&quot;svgbox&quot; style=&quot;margin:14px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;The three responses of exploited stakeholders&quot;&gt;
          &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
          &lt;text x=&quot;105&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;One stakeholder&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;always gains at others&#x27; expense&lt;/text&gt;
          &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M200 90 C 250 40 270 35 318 35&quot;/&gt;&lt;path d=&quot;M200 100 H318&quot;/&gt;&lt;path d=&quot;M200 110 C 250 160 270 165 318 165&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;12.5&quot;&gt;
            &lt;rect x=&quot;320&quot; y=&quot;12&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;40&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;1 · Exit&lt;/tspan&gt;: leave and form a new stakeholder network&lt;/text&gt;
            &lt;rect x=&quot;320&quot; y=&quot;77&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;105&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;2 · Politics&lt;/tspan&gt;: use the political process to restrain it&lt;/text&gt;
            &lt;rect x=&quot;320&quot; y=&quot;142&quot; width=&quot;370&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;334&quot; y=&quot;170&quot;&gt;&lt;tspan font-weight=&quot;600&quot;&gt;3 · Invention&lt;/tspan&gt;: invent another activity to meet their needs&lt;/text&gt;
          &lt;/g&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;p. 21 (note 18: Venkataraman, Velamuri, Harting and others).&lt;/figcaption&gt;
      &lt;/figure&gt;
      &lt;p&gt;If stakeholders are seen as engaged in a series of bargains, then by recognising their common interests they will achieve better outcomes than by each pursuing their own narrow self-interest. Note 19: &lt;span class=&quot;en&quot;&gt;prisoner&#x27;s dilemma&lt;/span&gt; situations exist (where each individual&#x27;s rational choice leads everyone to a worse outcome), but they are not the typical case, and we seem to solve them routinely (Russell Hardin).&lt;/p&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;From CSR to &quot;corporate stakeholder responsibility&quot;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Objection:&lt;/b&gt; this approach ignores social consequences, so &lt;span class=&quot;en&quot;&gt;corporate social responsibility&lt;/span&gt; (CSR) is needed. &lt;b&gt;Reply:&lt;/b&gt; CSR is a &quot;vestigial appendage&quot; of the dominant model. It is needed only if one believes that the only effects of business are economic. If stakeholder relationships are already embedded in morality, CSR is no longer necessary: it is replaced by &lt;dfn&gt;corporate stakeholder responsibility&lt;/dfn&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;1&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Rights&lt;/h4&gt;
      &lt;p&gt;The dominant story assigns &lt;span class=&quot;en&quot;&gt;property rights&lt;/span&gt; in the firm &lt;b&gt;to shareholders alone&lt;/b&gt;. The obvious question is: what about the rights of the other stakeholders involved?&lt;/p&gt;
      &lt;p&gt;Managing for stakeholders takes rights seriously. If rights make sense, and if whenever one person has a right to X everyone does, then reasoning in stakeholder terms follows naturally:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;shareholders have property rights, but these are &lt;b&gt;not absolute&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;they cannot use their property to restrict the rights of others: neither they nor the managers acting as their agents may use corporate assets to violate others&#x27; &lt;b&gt;right to life&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;anyone who takes this approach seriously automatically asks &lt;b&gt;what is owed&lt;/b&gt; to customers, suppliers, employees, financiers and communities, &lt;i&gt;by virtue of their stake and their humanity&lt;/i&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small&quot;&gt;Freeman acknowledges that the concept of &quot;rights&quot; is notoriously difficult to analyse.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;2&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot;&gt;The Argument from Character&lt;/h4&gt;
      &lt;p&gt;For Freeman this is among the strongest arguments: it asks executives and entrepreneurs &lt;b&gt;what kind of company they want to build&lt;/b&gt;. The answer is largely a matter of character: &quot;aspiration matters&quot;.&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;narrow question&lt;/span&gt;&lt;p&gt;&quot;How do we create value for shareholders?&quot; → the only virtue that emerges is &lt;b&gt;loyalty&lt;/b&gt; to shareholders&#x27; interests.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;broad question&lt;/span&gt;&lt;p&gt;&quot;How do we create and sustain value for stakeholders?&quot;, &quot;how do we get all these interests moving in the same direction?&quot; → &lt;b&gt;many virtues&lt;/b&gt; come into play.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;The &lt;span class=&quot;en&quot;&gt;business virtues&lt;/span&gt;: &lt;b&gt;efficiency, fairness, respect, integrity, keeping commitments&lt;/b&gt;. They are crucial to value creation and disappear if one thinks only in terms of narrow economic logic. Making ethics explicit avoids &lt;b&gt;bad faith and self-deception&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; data-p=&quot;3&quot; hidden&gt;
      &lt;h4 style=&quot;margin-top:6px&quot; id=&quot;arg-prag&quot;&gt;The Pragmatist&#x27;s Argument&lt;/h4&gt;
      &lt;p&gt;Pragmatists want to know how to &lt;b&gt;live better&lt;/b&gt;: how to shape ourselves and our communities so that values such as freedom and solidarity are present as fully as possible in everyday life. Consequences, rights and character can be thought of separately, but life is richer if we hold a conversation about how to live together better. This is the tradition of &lt;b&gt;William James&lt;/b&gt; and &lt;b&gt;John Dewey&lt;/b&gt;, taken up by &lt;b&gt;Richard Rorty&lt;/b&gt;:&lt;/p&gt;
      &lt;blockquote class=&quot;q&quot;&gt;…pragmatists… hope instead that human beings will come to enjoy more money, more free time, and greater social equality, and also that they will develop more empathy, more ability to put themselves in the shoes of others.&lt;cite&gt;Richard Rorty, in E. Mendieta (ed.), interviews, p. 68 (note 20), quoted on p. 23&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;Building attention to freedom, equality, consequences, decency, shared purpose and effects on others into the framework through which we think about business makes it possible to treat business as a &lt;b&gt;human institution&lt;/b&gt;, and perhaps to &quot;remake it in a way that sustains us&quot;.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The conclusion · pp. 23–24&lt;/span&gt;&lt;blockquote&gt;The spirit of capitalism is the spirit of individual achievement together with the spirit of accomplishing great tasks in collaboration with others.&lt;/blockquote&gt;&lt;p class=&quot;it&quot;&gt;Business is a social practice that arose to create value and trade. It is first and foremost &lt;b&gt;collaboration&lt;/b&gt;; stakeholders remain free to form competing networks, but the fuel of capitalism is the desire to create value for oneself and for others.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Note 17: descriptive, normative, instrumental… or all at once?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Some philosophers say that stakeholder theory needs a &quot;normative justification&quot;. Freeman takes this as a demand to connect it with traditional ethical theory and, as a pragmatist, &lt;b&gt;rejects&lt;/b&gt; the &quot;descriptive / normative / instrumental&quot; distinction adopted by many scholars. Managing for stakeholders is a narrative that is at once:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:8px 0 0&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Descriptive&lt;/b&gt;: it describes how some firms act.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Aspirational and normative&lt;/b&gt;: it says how they could and should act.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Instrumental&lt;/b&gt;: it indicates which means lead to which ends.&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Managerial&lt;/b&gt;: it must be coherent on all these levels and guide executives&#x27; actions.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is the &quot;invisible hand&quot; argument not enough to defend the dominant model?&lt;/summary&gt;&lt;div&gt;Because general equilibrium theory shows that the outcome that is &quot;best for all&quot; obtains only under very particular conditions, seldom found in reality, and even approximating those conditions does not guarantee it.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What three responses do persistently exploited stakeholders have?&lt;/summary&gt;&lt;div&gt;(1) Exit, to form a new stakeholder network; (2) use the political process to restrain whoever is exploiting them; (3) invent another form of activity that meets their needs.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does Freeman call CSR a &quot;vestigial appendage&quot;?&lt;/summary&gt;&lt;div&gt;Because it is needed only if one accepts the dominant model, in which the effects of business are purely economic and social effects must be added separately. If stakeholder relationships are already moral, &quot;corporate stakeholder responsibility&quot; is enough.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which business virtues does the argument from character cite?&lt;/summary&gt;&lt;div&gt;Efficiency, fairness, respect, integrity, keeping commitments, and others. With only the question about shareholder value, all that would remain is loyalty to shareholders.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What view of capitalism does the pragmatist argument put forward?&lt;/summary&gt;&lt;div&gt;A social practice of cooperation to create and trade value: the spirit of individual achievement together with the spirit of accomplishing great tasks with others.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7. SYNTHESIS ============ --&gt;
&lt;section id=&quot;s-sintesi&quot; class=&quot;sec&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;7 · Side-by-side synthesis&lt;/div&gt;
  &lt;h2&gt;Two stories about business&lt;/h2&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Dominant model&lt;/th&gt;&lt;th&gt;Managing for stakeholders&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Managed for whom&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Shareholders only; everything else is incidental&lt;/td&gt;&lt;td&gt;All stakeholders: customers, suppliers, employees, communities, financiers&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Image of the firm&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Hierarchy: &quot;the shareholders are the boss&quot;&lt;/td&gt;&lt;td&gt;Network of value-creating relationships&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Relationship between interests&lt;/b&gt;&lt;/td&gt;&lt;td&gt;In conflict; tradeoffs are made&lt;/td&gt;&lt;td&gt;Joint; problems are reframed so that interests go together&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Performance measure&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Share price, quarterly EPS&lt;/td&gt;&lt;td&gt;Value created for each stakeholder over time&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Business and ethics&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Separate (Separation Fallacy); ethics is an external constraint&lt;/td&gt;&lt;td&gt;Integrated (Integration Thesis); ethics is routine&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;People&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Narrow self-interest&lt;/td&gt;&lt;td&gt;Concern for self and others; names and faces&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Social responsibility&lt;/b&gt;&lt;/td&gt;&lt;td&gt;CSR is needed as a corrective&lt;/td&gt;&lt;td&gt;Corporate stakeholder responsibility&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Capitalism&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Primarily competition&lt;/td&gt;&lt;td&gt;Primarily cooperation and collaboration&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Key takeaway&lt;/h4&gt;&lt;p&gt;Freeman does not claim that there is &lt;i&gt;one&lt;/i&gt; stakeholder model valid for all firms. He claims that asking how stakes create value, and what role the executive plays, is more useful, more realistic and more ethically honest than &quot;maximise shareholder value&quot;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ FURTHER READING ============ --&gt;
&lt;section id=&quot;s-fonti&quot; class=&quot;sec t-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;secnum&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, texts, cases and statutes cited&lt;/h2&gt;
