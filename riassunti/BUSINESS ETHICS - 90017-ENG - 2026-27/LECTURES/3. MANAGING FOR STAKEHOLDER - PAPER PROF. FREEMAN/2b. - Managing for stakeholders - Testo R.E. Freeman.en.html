  &lt;p&gt;Each card covers a reference cited in the essay. The reference to the text (page or note) comes from the PDF; details, descriptions and links marked &lt;span class=&quot;ext&quot; style=&quot;margin:0&quot;&gt;external source&lt;/span&gt; come from a web search and should be verified.&lt;/p&gt;

  &lt;h3&gt;Freeman and stakeholder theory&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Strategic Management: A Stakeholder Approach&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;R. E. Freeman · Pitman 1984; reissued by Cambridge University Press · in the essay: note 1&lt;/div&gt;&lt;p&gt;The book that founded stakeholder theory. Part I on the stakeholder approach (&quot;Managing in turbulent times&quot;, the stakeholder concept), followed by strategic management processes and implications. According to the Cambridge edition, its publication was a landmark moment for the theory.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of the broad definition (&quot;can affect or be affected&quot;).&lt;/p&gt;&lt;a href=&quot;https://search.worldcat.org/title/903391157&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat: book record&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Freeman, Harrison, Wicks · Yale University Press 2007 · note 1 (&quot;forthcoming&quot;)&lt;/div&gt;&lt;p&gt;The book-length version of the essay: chapters on business in the twenty-first century, the basic framework, stakeholders, purpose and values, everyday strategies for creating value, and leadership. Publisher descriptions mention ten principles and seven practical techniques.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it develops the paper&#x27;s ideas in operational terms.&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/journals/business-ethics-quarterly/article/abs/managing-for-stakeholders-survival-reputation-success-by-r-edward-freeman-jeffrey-s-harrison-and-andrew-c-wicks-new-haven-conn-yale-university-press-2007-hardcover-200-pp-26-isbn-9780300125283/81A923CF1448D512C4BD6C16B9D55F40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review in Business Ethics Quarterly (Cambridge Core)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The Politics of Stakeholder Theory: Some Future Directions&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;R. E. Freeman · Business Ethics Quarterly 4(4), 1994, pp. 409–421 · note 9&lt;/div&gt;&lt;p&gt;The article in which Freeman introduces the &lt;i&gt;Separation Thesis&lt;/i&gt;. Once it is abandoned, what remains is not a single stakeholder theory but a &quot;genre&quot; of theories that weave together business and ethical concepts.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the direct precursor of the Separation Fallacy.&lt;/p&gt;&lt;a href=&quot;https://www.cambridge.org/core/product/117251073D5DBF47BFF0322281DC6F87&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core: abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Stakeholder Theory: A Libertarian Defense&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Freeman, Phillips · Business Ethics Quarterly 12(3), 2002, pp. 331–349 · note 10&lt;/div&gt;&lt;p&gt;Traces the roots of stakeholder theory in libertarian thought and proposes a model of &quot;stakeholder capitalism&quot; grounded in freedom and voluntary action.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it shows that the stakeholder approach is not necessarily &quot;anti-market&quot;.&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v12y2002i03p331-349_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: record and abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Stakeholder Theory and Organizational Ethics&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Robert Phillips · Berrett-Koehler 2003 · note 13&lt;/div&gt;&lt;p&gt;Grounds stakeholder theory in a &quot;principle of stakeholder fairness&quot; drawn from Rawls and uses it to determine who is a legitimate stakeholder and why. Phillips trained at Darden under Freeman.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the spirit of the wheel in Figure 1.&lt;/p&gt;&lt;a href=&quot;https://www.bkconnection.com/static/Stakeholder_Theory_and_Organizational_Ethics_EXCERPT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher&#x27;s excerpt (PDF)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Innovative Stakeholder Relations: When &quot;Ethics Pays&quot; (and When it Doesn&#x27;t)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harting, Harmeling, Venkataraman · Business Ethics Quarterly 16(1), 2006, pp. 43–68 · note 18&lt;/div&gt;&lt;p&gt;Links stakeholder theory, innovation and competitive advantage, and proposes testable hypotheses on when ethics &quot;pays&quot;. Note 18 also cites Venkataraman and Velamuri (Ruffin Series, 2002), not verified here.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it supports the argument from consequences.&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v16y2006i01p43-68_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc: record and abstract&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The shareholder view and the history of the corporation&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Milton Friedman, &quot;The Social Responsibility of Business Is to Increase Its Profits&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;New York Times Magazine, 13 September 1970 · p. 10&lt;/div&gt;&lt;p&gt;The essay regarded as the manifesto of shareholder theory: the firm&#x27;s only responsibility is to its shareholders, within the rules of the game. Some historians think its influence is overstated.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; Friedman is Freeman&#x27;s main interlocutor, and Freeman makes much of his &quot;law and ethical custom&quot; clause.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Friedman_doctrine&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Friedman doctrine&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Jensen &amp;amp; Meckling, &quot;Theory of the Firm&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Financial Economics 3(4), 1976, pp. 305–360 · context of note 5&lt;/div&gt;&lt;p&gt;Combines agency theory, property rights and finance; defines &lt;i&gt;agency costs&lt;/i&gt;. It is one of the most cited business articles of all time. Freeman does not name it, but it is the classic reference for the agency theory of note 5.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it explains the separation between decision-making and residual risk.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN: abstract&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Alfred D. Chandler, Strategy and Structure&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;MIT Press 1962 (Freeman cites the 1970 ed.) · note 6&lt;/div&gt;&lt;p&gt;A historical study of DuPont, General Motors, Standard Oil of New Jersey and Sears: the rise of the multidivisional firm and the thesis that &quot;structure follows strategy&quot;. Sloan is portrayed as the architect of GM&#x27;s strategy and structure.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it documents step 4 of the dominant story.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Alfred_D._Chandler_Jr.&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Alfred D. Chandler Jr.&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Peter Drucker, The Concept of the Corporation&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;John Day 1946; reissued by Transaction 1993 · note 6&lt;/div&gt;&lt;p&gt;Grew out of the study GM commissioned from Drucker in 1943. GM&#x27;s managers found it too critical, but its principles of organisation became a model worldwide.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the &quot;not so flattering&quot; portrait of GM that Freeman sets alongside Chandler.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Concept_of_the_Corporation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Concept of the Corporation&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Joseph Schumpeter, Capitalism, Socialism and Democracy&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1942 · p. 4&lt;/div&gt;&lt;p&gt;Argues that in large bureaucratic firms innovation becomes a routine entrusted to teams of specialists and the entrepreneurial function becomes obsolete.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the prediction about the risks of managerialism that Freeman recalls.&lt;/p&gt;&lt;a href=&quot;https://cato.org/regulation/summer-2022/celebrated-puzzling-book&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cato, Regulation (2022): review&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Breaking the Short-Term Cycle&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;CFA Centre for Financial Market Integrity and Business Roundtable Institute for Corporate Ethics, July 2006 · note 8 (printed as &quot;6&quot;)&lt;/div&gt;&lt;p&gt;A report against &lt;i&gt;short-termism&lt;/i&gt;: its recommendations include ending quarterly earnings guidance, long-term incentives and greater transparency towards investors.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it connects Freeman&#x27;s critique to the obsession with quarterly EPS.&lt;/p&gt;&lt;a href=&quot;https://rpc.cfainstitute.org/-/media/documents/article/position-paper/breaking-the-short-term-cycle.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CFA Institute: report (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Court cases and statutes (US)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Winterbottom v. Wright (1842)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Court of Exchequer, England · p. 6&lt;/div&gt;&lt;p&gt;The injured driver of a mail coach sues the party responsible for maintaining it and loses because he had no contract with that party. It is the landmark case for &lt;i&gt;privity of contract&lt;/i&gt;, later overcome (MacPherson v. Buick, 1916; Donoghue v. Stevenson, 1932).&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Winterbottom_v_Wright&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Winterbottom v Wright&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Greenman v. Yuba Power Products (1963)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Supreme Court of California, 59 Cal.2d 57 · p. 6&lt;/div&gt;&lt;p&gt;A combination power tool (Shopsmith) throws out a piece of wood and injures the user. Justice Traynor establishes the manufacturer&#x27;s strict liability in tort for defective products.&lt;/p&gt;&lt;a href=&quot;https://scocal.stanford.edu/opinion/greenman-v-yuba-power-products-inc-27186&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford SCOCAL: text of the opinion&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Consumer Product Safety Act and CPSC (1972)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Pub. L. 92-573 · p. 7&lt;/div&gt;&lt;p&gt;Establishes the Consumer Product Safety Commission as an independent agency with the power to order recalls and, in limited cases, ban products. Strengthened in 2008.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Consumer_Product_Safety_Act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Consumer Product Safety Act&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;National Labor Relations Act (1935) and NLRB&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;also known as the Wagner Act · p. 7&lt;/div&gt;&lt;p&gt;Recognises the right to unionise and to bargain collectively. The National Labor Relations Board is the independent federal agency that enforces it.&lt;/p&gt;&lt;a href=&quot;https://www.nlrb.gov/about-nlrb/who-we-are&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NLRB: Who We Are&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Equal Pay Act 1963, Title VII 1964, ADEA 1967&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 7&lt;/div&gt;&lt;p&gt;Equal pay for substantially equal work; prohibition of discrimination on the basis of race, colour, religion, sex and national origin (Title VII also created the EEOC); protection against age discrimination, originally for people aged 40 to 65.&lt;/p&gt;&lt;a href=&quot;https://www.eeoc.gov/youth/timeline-important-eeoc-events&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EEOC: timeline&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Clean Air Act and Clean Water Act&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 7&lt;/div&gt;&lt;p&gt;The Clean Air Act, passed in 1970 and amended in 1990, sets air quality standards and emission limits. The Clean Water Act regulates discharges into US waters.&lt;/p&gt;&lt;a href=&quot;https://www.epa.gov/clean-air-act-overview/plain-english-guide-clean-air-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPA: guide to the Clean Air Act&lt;/a&gt; · &lt;a href=&quot;https://www.everycrsreport.com/reports/RL30798.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRS: summaries of environmental laws&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Marsh v. Alabama, 326 U.S. 501 (1946)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;US Supreme Court · pp. 7–8&lt;/div&gt;&lt;p&gt;A Jehovah&#x27;s Witness is arrested while distributing leaflets in Chickasaw, a town owned by Gulf Shipbuilding. The Court holds that a company town open to the public cannot restrict freedom of expression as if it were ordinary private property.&lt;/p&gt;&lt;a href=&quot;https://www.law.cornell.edu/supct/html/historics/USSC_CR_326_501_ZO.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cornell LII: text of the opinion&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Ethics, philosophy and management&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Adam Smith and the &quot;invisible hand&quot;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;The Wealth of Nations, 1776 · p. 20&lt;/div&gt;&lt;p&gt;In Book IV Smith uses the metaphor to say that actions driven by self-interest can promote the public interest. Smith speaks of &quot;an&quot; invisible hand and does not make it a general principle: the free-market reading is a later extension.&lt;/p&gt;&lt;a href=&quot;https://www.britannica.com/money/invisible-hand&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica: invisible hand&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;John Rawls, Political Liberalism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Columbia University Press 1993 (Freeman cites the 1995 ed.) · note 11&lt;/div&gt;&lt;p&gt;How can a stable and just society of people holding different and irreconcilable doctrines endure? Through an &quot;overlapping consensus&quot; on shared political principles.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it inspires the idea of ethics as reasoning together despite our differences.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Political_Liberalism&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Political Liberalism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Pragmatism: William James, John Dewey&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;p. 23&lt;/div&gt;&lt;p&gt;A philosophical tradition that emerged in the US around 1870 (Peirce, James, Dewey): clarifying ideas by looking at their practical consequences. Revived from the 1970s onwards by Rorty, Putnam and Brandom.&lt;/p&gt;&lt;a href=&quot;https://plato.stanford.edu/entries/pragmatism/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford Encyclopedia of Philosophy: Pragmatism&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Interviews with Richard Rorty&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;E. Mendieta (ed.), Take Care of Freedom and Truth Will Take Care of Itself, Stanford University Press 2006 · note 20&lt;/div&gt;&lt;p&gt;A collection of interviews on philosophy, politics, democracy and the American labour tradition. The quotation on the pragmatist ideal comes from here (p. 68).&lt;/p&gt;&lt;a href=&quot;https://dc2.philarchive.org/rec/RORTCO&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilArchive: record&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Russell Hardin, Morality within the Limits of Reason&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;University of Chicago Press 1988 · note 19&lt;/div&gt;&lt;p&gt;A reconstruction of utilitarianism that takes into account the practical limits of ethical choice (incomplete information, limited understanding of cause and effect).&lt;/p&gt;&lt;a href=&quot;https://www.journals.uchicago.edu/doi/10.1086/293267&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review in Ethics (1990)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Bill George, Authentic Leadership&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Jossey-Bass 2003 · note 15&lt;/div&gt;&lt;p&gt;The former CEO of Medtronic argues that new leaders, not just new laws, are needed, and that mission-driven companies create more value for shareholders. He identifies five dimensions: purpose, values, heart, relationships, self-discipline.&lt;/p&gt;&lt;a href=&quot;https://knowledge.wharton.upenn.edu/article/authentic-leadership&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Knowledge at Wharton&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Collins &amp;amp; Porras, Built to Last&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1994 (Freeman cites the 2002 ed.) · note 8&lt;/div&gt;&lt;p&gt;Compares 18 &quot;visionary&quot; companies with comparison competitors: the enduring ones keep a stable &lt;i&gt;core ideology&lt;/i&gt; while changing everything else, and profit comes after values and purpose.&lt;/p&gt;&lt;a href=&quot;https://www.supersummary.com/built-to-last/summary/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SuperSummary: summary (secondary source)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Grameen Bank&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;example of purpose, p. 18&lt;/div&gt;&lt;p&gt;Founded by Muhammad Yunus in Bangladesh in 1976, an independent bank since 1983. It provides microcredit to groups of five people, in which peer pressure replaces collateral. Nobel Peace Prize 2006, shared with Yunus.&lt;/p&gt;&lt;a href=&quot;https://www.britannica.com/money/Grameen-Bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica: Grameen Bank&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Cited in the essay but not covered here: Beauchamp and Bowie, &lt;i&gt;Ethical Theory and Business&lt;/i&gt;; Wicks, Freeman, Werhane, Martin, &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;; Freeman, &quot;The Development of Stakeholder Theory: An Idiosyncratic Approach&quot; (in Smith and Hitt, &lt;i&gt;Great Minds in Management&lt;/i&gt;, OUP 2005); Velamuri and Venkataraman (Ruffin Series, 2002).&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

  // Tradeoff / reframing frontier
