.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin-top:8px}

&lt;!-- 1 CORSO --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;corso&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 1 · slides 1-4&lt;/div&gt;&lt;h2&gt;The course, the lecturer, the Master&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slides 1-2&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Business Ethics&lt;/em&gt; is a course in the &lt;em class=&quot;t&quot;&gt;Master Degree in Accounting, Governance and Sustainability&lt;/em&gt; (a two-year postgraduate degree taught in English) offered by the Department of Management of the University of Bergamo, at via dei Caniana 2. The lecturer is &lt;b&gt;Prof. Silvana Signori&lt;/b&gt;, Professor of Accounting, Business Ethics and Sustainability and coordinator of the Master Degree programme.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Accounting&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Measuring and reporting: financial statements, management control, audit. It is &quot;how we count&quot; the value of the firm.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Governance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Who makes decisions within the firm, under which rules and controls, and to whom they are answerable (&lt;i&gt;accountability&lt;/i&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Value over time and for society and the environment, not only for shareholders.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The three pillars in the name of the Master: business ethics is the field in which we ask &lt;i&gt;why&lt;/i&gt; and &lt;i&gt;for whom&lt;/i&gt; value is measured, governed and created.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;What the university website says about the AGS Master &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;A two-year Master&#x27;s degree worth 120 ECTS credits, class LM-77 (business and economics), taught entirely in English and in person, with open admission (English at B2 level and curricular requirements are needed). It covers planning and control, risk management, corporate governance, auditing, sustainable finance and the measurement and reporting of economic, social and environmental performance. It offers a double degree with the University of Dundee.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Source: &lt;a href=&quot;https://www.unibg.it/studiare/corsi/offertaformativa/accounting-governance-and-sustainability&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it — Accounting, Governance and Sustainability&lt;/a&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;“Who you are…” — introducing yourself&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slides 3-4&lt;/span&gt; The first activity is a round of introductions: name, background, Master programme attended, interests and, above all, &lt;b&gt;expectations&lt;/b&gt; of the course and of the Master. This is no minor detail: a course based on &lt;em class=&quot;t&quot;&gt;discussion&lt;/em&gt; and &lt;em class=&quot;t&quot;&gt;case studies&lt;/em&gt; only works if the class takes part. Try preparing your own answer: open one prompt at a time.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;My background is…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Think about what you bring to the classroom: a degree in economics, law, engineering? Work experience? Each background &quot;sees&quot; different ethical problems: someone from accounting notices the manipulation of figures, someone from marketing notices misleading advertising.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My interests are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Climate, workers&#x27; rights, sustainable finance, governance… Linking the course cases to your own interests makes studying far more effective.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My expectations for this course are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Compare them with the stated &lt;a href=&quot;#obiettivi&quot;&gt;aims&lt;/a&gt;: if you expect &quot;rules to learn&quot;, be ready for a course that mainly asks you to &lt;i&gt;build arguments&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My expectations for this Master Degree are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Future profession (accountant, auditor, consultant, manager)? The course aims mention precisely these roles (slide 8).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which degree programme does Business Ethics belong to, and in which language is it taught?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;The Master Degree in Accounting, Governance and Sustainability at the University of Bergamo, Department of Management; the course is taught in English.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the first lecture ask students to state their expectations?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because the course relies on discussion and real cases: knowing the backgrounds and expectations of the class makes it possible to tailor the examples, and it helps students compare what they are looking for with the stated aims.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 ETICA --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;etica&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 2 · slides 5-6&lt;/div&gt;&lt;h2&gt;What (business) ethics is&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; The course introduces the concept of &lt;em class=&quot;t&quot;&gt;business ethics&lt;/em&gt; (the study of business situations, activities and decisions in which issues of right and wrong arise) and its importance at two levels: the &lt;b&gt;academic&lt;/b&gt; level (a discipline with its own theories and research) and that of &lt;b&gt;&lt;em class=&quot;t&quot;&gt;practical management&lt;/em&gt;&lt;/b&gt;, i.e. the actual management of different kinds of organisations — businesses, but also public bodies and non-profits.&lt;/p&gt;

  &lt;blockquote&gt;“Ethics refers to our efforts to figure out what we should do and how we should live. More specifically, it involves the challenge of figuring out how to justify our behavior — both to ourselves and to others (in business, e.g., to shareholders, employees, and the public). All of us ‘do’ ethics, often without thinking consciously that this is what we are doing.”&lt;cite&gt;Wicks et al., 2010, p. 4 — quoted in slide 6&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;p&gt;Let us take the definition apart piece by piece:&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;1 · Doing&quot;&gt;&lt;h4&gt;“what we should do”&lt;/h4&gt;&lt;p&gt;Ethics is &lt;b&gt;normative&lt;/b&gt;: it does not merely describe what people do, but asks what they &lt;i&gt;ought&lt;/i&gt; to do. “Should I disclose the product defect to the customer?” is an ethical question; “how many companies disclose it?” is a descriptive one.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;2 · Living&quot; hidden&gt;&lt;h4&gt;“how we should live”&lt;/h4&gt;&lt;p&gt;Beyond individual actions, ethics concerns the &lt;b&gt;kind of person&lt;/b&gt; (and organisation) we want to be. This is the bridge to the &lt;em class=&quot;t&quot;&gt;virtues&lt;/em&gt; (stable dispositions of character, such as honesty or courage) of slide 6.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;3 · Justifying&quot; hidden&gt;&lt;h4&gt;“how to justify our behavior”&lt;/h4&gt;&lt;p&gt;The core of the definition: doing ethics means being able to give public and consistent &lt;b&gt;reasons&lt;/b&gt; for a choice. This is exactly what the exam rewards: “clearness, synthesis, consistency and critical judgment” (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;4 · To whom&quot; hidden&gt;&lt;h4&gt;“to ourselves and to others”&lt;/h4&gt;&lt;p&gt;Justification has two audiences: our own conscience and other people. In business the &quot;others&quot; are &lt;em class=&quot;t&quot;&gt;shareholders&lt;/em&gt;, &lt;em class=&quot;t&quot;&gt;employees&lt;/em&gt; and &lt;em class=&quot;t&quot;&gt;the public&lt;/em&gt;: they are already, in embryonic form, the &lt;a href=&quot;#struttura&quot;&gt;stakeholders&lt;/a&gt; of module 5.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 420 150&quot; style=&quot;max-width:420px;width:100%&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;75&quot; r=&quot;30&quot; fill=&quot;oklch(50% 0.15 35)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:oklch(97% 0.012 80)&quot; font-weight=&quot;600&quot;&gt;decision&lt;/text&gt;
      &lt;g stroke=&quot;oklch(55% 0.09 150)&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;180&quot; y1=&quot;70&quot; x2=&quot;80&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;70&quot; x2=&quot;340&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;85&quot; x2=&quot;80&quot; y2=&quot;125&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;85&quot; x2=&quot;340&quot; y2=&quot;125&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;currentColor&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;20&quot; y=&quot;25&quot;&gt;ourselves&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;25&quot;&gt;shareholders&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;140&quot;&gt;employees&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;140&quot;&gt;the public&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;5 · Everyone&quot; hidden&gt;&lt;h4&gt;“All of us ‘do’ ethics”&lt;/h4&gt;&lt;p&gt;This is not a subject for philosophers only: every time we decide whether to round off a figure, how to treat a colleague or whether to accept a gift from a supplier, we are already doing ethics, often &lt;b&gt;without realising it&lt;/b&gt;. The course aims to make this conscious and well argued.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav-btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Values, virtues, excellence&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; The slide closes with a summary: &lt;i&gt;“Ethics is about values, virtues and excellence in business.”&lt;/i&gt; Three key terms to keep distinct:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Values&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;What we consider important and worth pursuing (honesty, fairness, respect, transparency). They guide choices and may conflict with one another.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Virtues&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Character traits cultivated through practice: an honest person does not &quot;apply a rule&quot;, they are honest by habit. A tradition dating back to Aristotle.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Excellence&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Ethics is not only a constraint (&quot;don&#x27;t do&quot;): it is also about doing one&#x27;s job &lt;i&gt;well&lt;/i&gt;, excelling as a professional and as a company.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; Explanations of the three terms added for clarity.&lt;/p&gt;

  &lt;h3&gt;Ethics, morality and law: not the same thing&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; Two distinctions that the slides take for granted but that recur throughout the course (they are discussed in the Crane et al. textbook).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Morality&lt;/b&gt; — the norms, values and beliefs embedded in a social group that define what is right or wrong. &lt;b&gt;Ethics&lt;/b&gt; — the systematic reflection on those norms: the theories through which we examine and justify them.&lt;/div&gt;
  &lt;p&gt;What about the law? Many people think “if it&#x27;s legal, it&#x27;s ethical”. Click the three areas of the diagram:&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 230&quot; data-info-group=&quot;venn-out&quot; role=&quot;group&quot; aria-label=&quot;Diagram of ethics and law&quot;&gt;
        &lt;circle cx=&quot;140&quot; cy=&quot;115&quot; r=&quot;95&quot; fill=&quot;oklch(70% 0.1 150 / .35)&quot; stroke=&quot;oklch(45% 0.1 150)&quot; stroke-width=&quot;2&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Ethical but not (only) required by law.&lt;/b&gt; The law does not say everything: dealing fairly with a small supplier, reporting a risk you are not obliged to disclose, turning down a lawful but harmful deal. Much of business ethics lives here: where the law is silent.&quot;/&gt;
        &lt;circle cx=&quot;220&quot; cy=&quot;115&quot; r=&quot;95&quot; fill=&quot;oklch(70% 0.1 250 / .35)&quot; stroke=&quot;oklch(45% 0.1 250)&quot; stroke-width=&quot;2&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Legal but ethically questionable.&lt;/b&gt; Aggressive tax avoidance, relocating production to where labour protections are minimal, lawful but manipulative marketing. Legality is a minimum, not a guarantee of right conduct.&quot;/&gt;
        &lt;path d=&quot;M180 30 A95 95 0 0 1 180 200 A95 95 0 0 1 180 30Z&quot; fill=&quot;oklch(50% 0.15 35 / .55)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Overlap.&lt;/b&gt; Many legal norms codify shared moral values: do not steal, do not defraud, do not discriminate. Here law and ethics say the same thing — so-called “codified ethics”.&quot;/&gt;
        &lt;text x=&quot;80&quot; y=&quot;120&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; pointer-events=&quot;none&quot;&gt;Ethics&lt;/text&gt;
        &lt;text x=&quot;245&quot; y=&quot;120&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; pointer-events=&quot;none&quot;&gt;Law&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;venn-out&quot; class=&quot;card tint&quot; aria-live=&quot;polite&quot;&gt;Click an area of the diagram (or select it with Tab and press Enter).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Descriptive vs normative ethics&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;&lt;b&gt;Normative&lt;/b&gt;: asks what one &lt;i&gt;ought&lt;/i&gt; to do and provides criteria for judgement (the &lt;em class=&quot;t&quot;&gt;normative ethical theories&lt;/em&gt; of module 2). &lt;b&gt;Descriptive&lt;/b&gt;: describes how people &lt;i&gt;actually&lt;/i&gt; make decisions and why (the basis of module 3 on &lt;em class=&quot;t&quot;&gt;decision-making&lt;/em&gt;). The course uses both.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to Wicks et al. (2010), what is the specific &quot;challenge&quot; of ethics?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Figuring out how to &lt;b&gt;justify one&#x27;s behaviour&lt;/b&gt;, both to oneself and to others — in business, to shareholders, employees and the public.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is “All of us do ethics” an important statement for a future auditor?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because ethical choices are embedded in everyday work (estimates, professional judgements, client relationships) even when we do not call them that; recognising them is the first step towards managing them.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Is a legal action always ethical? Give an example.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: law and ethics only partly overlap. Example: a lawful but aggressive tax practice, or selling a product that complies with one country&#x27;s regulations but is banned elsewhere because it is harmful.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which three words sum up ethics in slide 6?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Values, virtues and excellence in business.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 CSR --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;csr&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 3 · slide 5&lt;/div&gt;&lt;h2&gt;Business in a wider society: CSR and sustainability&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; Business ethics is framed by considering the corporation as &lt;b&gt;part of a &lt;em class=&quot;t&quot;&gt;wider society&lt;/em&gt;&lt;/b&gt;: the firm is not an island answerable only to the market, but a social actor that draws resources from society (labour, infrastructure, legitimacy) and influences it in turn. Hence two concepts that the course analyses “in their main characteristics and in connection with business ethics theories”:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Corporate Social Responsibility (CSR)&lt;/h4&gt;&lt;p&gt;The idea that a company has responsibilities towards society that go beyond profit and mere compliance with the law. It is the subject of &lt;b&gt;module 4&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p&gt;The capacity to maintain over time the economic, social and environmental systems on which we depend. For a company it means creating value without depleting the future foundations of that value.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Carroll&#x27;s pyramid &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The best-known model for ordering corporate responsibilities (Carroll, 1991). Click each level:&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 260&quot; data-info-group=&quot;carroll-out&quot; role=&quot;group&quot; aria-label=&quot;Carroll&#x27;s pyramid&quot;&gt;
        &lt;polygon points=&quot;180,10 225,70 135,70&quot; fill=&quot;oklch(75% 0.12 85)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Philanthropic — desired.&lt;/b&gt; Being a good corporate citizen: donations, community projects. Society &lt;i&gt;desires&lt;/i&gt; it but does not demand it.&quot;/&gt;
        &lt;polygon points=&quot;135,74 225,74 270,134 90,134&quot; fill=&quot;oklch(68% 0.12 150)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Ethical — expected.&lt;/b&gt; Doing what is right and fair even beyond the law, avoiding harm. This is the level where business ethics sits most directly.&quot;/&gt;
        &lt;polygon points=&quot;90,138 270,138 315,198 45,198&quot; fill=&quot;oklch(62% 0.1 250)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Legal — required.&lt;/b&gt; Obeying the law: the law is the “codification” of what society considers right and wrong.&quot;/&gt;
        &lt;polygon points=&quot;45,202 315,202 355,254 5,254&quot; fill=&quot;oklch(58% 0.13 25)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Economic — required.&lt;/b&gt; Being profitable: this is the foundation, because a company that does not survive cannot fulfil any other responsibility.&quot;/&gt;
        &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot; style=&quot;fill:oklch(18% 0.02 60)&quot; pointer-events=&quot;none&quot;&gt;&lt;text x=&quot;180&quot; y=&quot;58&quot;&gt;Phil.&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;110&quot;&gt;Ethical&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;174&quot;&gt;Legal&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;233&quot;&gt;Economic&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;carroll-out&quot; class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;Carroll defines CSR as the set of &lt;b&gt;economic, legal, ethical and discretionary (philanthropic)&lt;/b&gt; expectations that society has of organisations at a given point in time. Click a level.&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;External source: Carroll, A. B. (1991), “The pyramid of corporate social responsibility”, &lt;i&gt;Business Horizons&lt;/i&gt;, 34, 39-48 — summary from &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Maricopa Open — Carroll&#x27;s Pyramid of CSR&lt;/a&gt;. The slides of this lecture do not cite Carroll: we include it as a preview of module 4.&lt;/figcaption&gt;
  &lt;/div&gt;

  &lt;h3&gt;Sustainability: the classic definition &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h3&gt;
  &lt;blockquote&gt;Sustainable development is development that meets the needs of the present without compromising the ability of future generations to meet their own needs.&lt;cite&gt;Brundtland Report, “Our Common Future”, 1987 — &lt;a href=&quot;https://www.are.admin.ch/are/en/home/media/publications/sustainable-development/brundtland-report.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ARE, Swiss Confederation&lt;/a&gt;&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;svg viewBox=&quot;0 0 520 250&quot; style=&quot;max-width:520px;margin:auto&quot;&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;95&quot; r=&quot;75&quot; fill=&quot;oklch(70% 0.12 85 / .45)&quot; stroke=&quot;oklch(50% 0.11 85)&quot;/&gt;
      &lt;circle cx=&quot;320&quot; cy=&quot;95&quot; r=&quot;75&quot; fill=&quot;oklch(68% 0.1 150 / .45)&quot; stroke=&quot;oklch(45% 0.1 150)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;170&quot; r=&quot;75&quot; fill=&quot;oklch(65% 0.1 250 / .45)&quot; stroke=&quot;oklch(45% 0.1 250)&quot;/&gt;
      &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;165&quot; y=&quot;80&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;80&quot;&gt;Environmental&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;220&quot;&gt;Social&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;260&quot; y=&quot;125&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; fill=&quot;currentColor&quot;&gt;sustainable&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The three dimensions (economic, environmental, social) identified as components of sustainable development in the tradition of the Brundtland Report. The diagram is a &lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt;.&lt;/figcaption&gt;
  &lt;/div&gt;

  &lt;h3&gt;How the three concepts are connected&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Business ethics&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;CSR&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Sustainability&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;The underlying question&lt;/b&gt;: what is the right thing to do? It provides the &lt;i&gt;theories&lt;/i&gt; and criteria for evaluating choices (modules 2-3). It is the &quot;grammar&quot; in which CSR and sustainability are discussed.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;The organisational response&lt;/b&gt;: which responsibilities the company takes on towards society and how it manages them (policies, codes of ethics, reporting). Ethical theories serve to justify — or criticise — CSR practices.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;The long-term goal&lt;/b&gt;: the outcome to which CSR and ethics should contribute, with explicit attention to future generations and environmental limits. For a Master in Accounting, sustainability also becomes a matter of &lt;i&gt;measurement and reporting&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; A reading of the links suggested for study purposes; the course will explore them in modules 4-5.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What does it mean to frame the corporation “as part of a wider society”?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;To regard the company as a social actor that depends on society and influences it, and therefore has responsibilities towards parties beyond its shareholders alone.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the four levels of Carroll&#x27;s pyramid, from the bottom up?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Economic (required), legal (required), ethical (expected), philanthropic (desired).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the Brundtland Report&#x27;s definition of sustainable development?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Development that meets the needs of the present without compromising the ability of future generations to meet their own needs.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 AIMS --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;obiettivi&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 4 · slides 5, 7-8&lt;/div&gt;&lt;h2&gt;Aims: what you should be able to do by the end&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; The stated aim is to develop and deepen students&#x27; understanding of &lt;b&gt;moral obligations&lt;/b&gt; and of &lt;b&gt;the good that business can bring to society&lt;/b&gt;. Note the two sides: ethics as a constraint (obligations) and as an opportunity (the good that is possible).&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; The method: combining the examination of ethical and management theory with the &lt;em class=&quot;t&quot;&gt;discussion&lt;/em&gt; of common ethical problems &lt;i&gt;in context&lt;/i&gt;, through &lt;em class=&quot;t&quot;&gt;real-world examples and case studies&lt;/em&gt;.&lt;/p&gt;

  &lt;h3&gt;Four verbs, in order of difficulty&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; Students should be able to &lt;b&gt;identify, describe, explain and critically analyse&lt;/b&gt;. These are increasing levels: step through them by applying them to a sample case — &lt;i&gt;a clothing company discovers that one of its overseas suppliers uses child labour&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Identify&quot;&gt;&lt;h4&gt;1 · Identify — recognise&lt;/h4&gt;&lt;p&gt;Realise that there is an ethical issue: “children&#x27;s rights are at stake here, not just a supply-cost problem”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Describe&quot; hidden&gt;&lt;h4&gt;2 · Describe — set out&lt;/h4&gt;&lt;p&gt;Reconstruct the facts and who is involved: children and their families, the supplier, the company, consumers, shareholders, NGOs, the local government.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Explain&quot; hidden&gt;&lt;h4&gt;3 · Explain — account for&lt;/h4&gt;&lt;p&gt;Why does it happen? Price pressure, weak supply chain controls, local poverty, regulatory differences between countries. The concepts and theories of the course are used here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Critically analyse&quot; hidden&gt;&lt;h4&gt;4 · Critically analyse — evaluate&lt;/h4&gt;&lt;p&gt;Assess the options (terminate the contract? work with the supplier on an exit plan?) using several ethical theories, showing their pros, cons and consequences for stakeholders, and reach a &lt;b&gt;well-argued&lt;/b&gt; position. This is the level the exam rewards.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav-btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← back&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; The case is a teaching example, not taken from the slides.&lt;/p&gt;

  &lt;h3&gt;What they are applied to&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Objects of analysis &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;the importance of business ethics for business&lt;/li&gt;
      &lt;li&gt;current ethical issues in business&lt;/li&gt;
      &lt;li&gt;current ethical theories and &lt;em class=&quot;t&quot;&gt;ethical decision-making&lt;/em&gt;&lt;/li&gt;
      &lt;li&gt;common management practices for facilitating and encouraging ethical business&lt;/li&gt;
      &lt;li&gt;the different ethical issues in &lt;em class=&quot;t&quot;&gt;business-stakeholder&lt;/em&gt; relationships&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Skills to improve &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;Think critically&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;understand business ethics and CSR issues and problems, in their theoretical and practical implications, in an &lt;b&gt;international&lt;/b&gt; dimension and in relation to the professions (&lt;i&gt;accountant, auditor, consultant, manager&lt;/i&gt;)&lt;/li&gt;
      &lt;li&gt;apply the main traditional ethical theories to analyse positions and formulate &lt;em class=&quot;t&quot;&gt;moral defenses&lt;/em&gt; (reasoned moral justifications) of decisions&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Evaluate the role of business in society&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What are the four verbs in the aims, and which is the most demanding?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Identify, describe, explain, critically analyse; the most demanding is critically analyse, because it requires evaluating alternatives and taking a justified position.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is a “moral defense” of a business decision?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;An argument that justifies a decision on the basis of one or more ethical theories, making the principles used explicit — the direct link with the Wicks et al. definition (“justify our behavior”).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which professions are mentioned in the course aims?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Accountant, auditor, consultant, manager.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 STRUTTURA --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;struttura&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 5 · slide 9&lt;/div&gt;&lt;h2&gt;The structure: 5 modules in 2 parts&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; The course proceeds as a “cascade”: each module builds on the previous one. The first part develops the tools (&lt;b&gt;Understanding Business Ethics&lt;/b&gt;), the second applies them to the relationship between the company and its stakeholders (&lt;b&gt;Contextualizing Business Ethics&lt;/b&gt;).&lt;/p&gt;

        &lt;rect x=&quot;90&quot; y=&quot;118&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(75% 0.15 150)&quot;/&gt;&lt;text x=&quot;104&quot; y=&quot;145&quot;&gt;3 · Making decisions&lt;/text&gt;
        &lt;rect x=&quot;130&quot; y=&quot;172&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(80% 0.1 185)&quot;/&gt;&lt;text x=&quot;144&quot; y=&quot;199&quot;&gt;4 · Corporate Social Responsibility&lt;/text&gt;

  &lt;p&gt;What to expect in each module (a preview: the slides of this lecture only give the titles).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 Intro&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 Theories&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 Decisions&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 CSR&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;5 Stakeholders&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Introducing business ethics and its relevance in business context&lt;/h4&gt;&lt;p&gt;What business ethics is, why it matters to companies (reputation, trust, risk, employee motivation), and its relationship with the law and with globalisation. This opening lecture is a first taste: see &lt;a href=&quot;#etica&quot;&gt;Part 2&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Evaluating business ethics through normative ethical theories&lt;/h4&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Normative ethical theories&lt;/em&gt; are criteria for judging whether an action is right. The &quot;traditional&quot; families usually studied are:&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Consequentialism / utilitarianism&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;An action is right if it produces the &lt;b&gt;best consequences&lt;/b&gt; (the greatest good for the greatest number). Typical question: “which option generates the greatest net benefits for everyone involved?”&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Deontology (ethics of duty)&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;What matters are &lt;b&gt;duties and principles&lt;/b&gt;, regardless of consequences (Kant: always treat people as ends, never merely as means). Typical question: “would I want everyone to act according to this rule?”&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Rights &amp;amp; justice&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;People have &lt;b&gt;rights&lt;/b&gt; that cannot be sacrificed for a collective advantage; justice concerns the fair distribution of benefits and burdens.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Virtue ethics&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;The focus is on &lt;b&gt;character&lt;/b&gt;: “what would a virtuous person do?” (Aristotle). It links to the “values, virtues and excellence” of slide 6.&lt;/div&gt;&lt;/details&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; Standard overview, to be checked against the module 2 slides.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Making decisions in business ethics&lt;/h4&gt;&lt;p&gt;How people &lt;i&gt;actually&lt;/i&gt; make ethical decisions and what influences them (individual factors such as values and experience; situational factors such as organisational culture, pressures and incentives). A classic model, also used in the core textbook, is &lt;b&gt;Rest&#x27;s&lt;/b&gt; four-stage model:&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 640 90&quot; style=&quot;width:100%&quot;&gt;&lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Recognition&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;I see the issue&lt;/text&gt;
        &lt;rect x=&quot;167&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Judgment&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;I assess what is right&lt;/text&gt;
        &lt;rect x=&quot;329&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;399&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Intent&lt;/text&gt;&lt;text x=&quot;399&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;I decide to do it&lt;/text&gt;
        &lt;rect x=&quot;491&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;561&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Behaviour&lt;/text&gt;&lt;text x=&quot;561&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;I actually do it&lt;/text&gt;&lt;/g&gt;
        &lt;g stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M147 45h16M309 45h16M471 45h16&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Rest, J. (1986), &lt;i&gt;Moral Development&lt;/i&gt; — see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;. A failure at any one of the stages prevents ethical behaviour.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Corporate Social Responsibility (CSR)&lt;/h4&gt;&lt;p&gt;Definitions and models of CSR (see Carroll&#x27;s pyramid in &lt;a href=&quot;#csr&quot;&gt;Part 3&lt;/a&gt;), arguments for and against, and the debate on “what the corporation is for”. The course lists specific suggested readings for this module (slide 19).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Business ethics, the company and its stakeholders&lt;/h4&gt;&lt;p&gt;A &lt;em class=&quot;t&quot;&gt;stakeholder&lt;/em&gt; is, in Freeman&#x27;s (1984) classic definition, any group or individual who can affect or is affected by the achievement of the organisation&#x27;s objectives. The module examines the ethical issues arising with each of them.&lt;/p&gt;
      &lt;div class=&quot;figure&quot; style=&quot;margin:8px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 400 260&quot; data-info-group=&quot;stk-out&quot; role=&quot;group&quot; aria-label=&quot;Stakeholder map&quot;&gt;
          &lt;g stroke=&quot;oklch(60% 0.05 250)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;200&quot; y2=&quot;35&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;340&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;340&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;200&quot; y2=&quot;225&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;60&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;60&quot; y2=&quot;70&quot;/&gt;&lt;/g&gt;
          &lt;circle cx=&quot;200&quot; cy=&quot;130&quot; r=&quot;34&quot; fill=&quot;oklch(50% 0.15 35)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:oklch(97% 0.012 80)&quot;&gt;Company&lt;/text&gt;
          &lt;g font-size=&quot;11&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Shareholders&lt;/b&gt;: governance, shareholder rights, executive remuneration, insider trading.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;35&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;39&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Employees&lt;/b&gt;: discrimination, health and safety, privacy, fair wages, whistleblowing.&quot;&gt;&lt;circle cx=&quot;340&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;74&quot;&gt;Employees&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Consumers&lt;/b&gt;: product safety, misleading marketing, pricing, personal data.&quot;&gt;&lt;circle cx=&quot;340&quot; cy=&quot;190&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;194&quot;&gt;Consumers&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Suppliers &amp;amp; competitors&lt;/b&gt;: labour in supply chains, bargaining power, corruption, fair competition.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;225&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;229&quot;&gt;Suppliers&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Civil society&lt;/b&gt;: NGOs, local communities, the environment; the company&#x27;s impacts on the local area.&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;190&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;194&quot;&gt;Civil soc.&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Government&lt;/b&gt;: lobbying, taxation, regulation, the relationship between business and politics.&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;74&quot;&gt;Government&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;
        &lt;/svg&gt;
        &lt;div id=&quot;stk-out&quot; class=&quot;card tint small&quot; aria-live=&quot;polite&quot;&gt;Click a stakeholder to see examples of typical ethical issues.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Freeman (1984) — see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;. Groups and examples: &lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; modelled on the textbook.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;I was unable to consult the other files in the &lt;code&gt;corso/&lt;/code&gt; folder (module lectures, syllabus): the previews above should be checked against those slides when you study them.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Which modules make up Part 1, and which Part 2?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Part 1 “Understanding Business Ethics”: modules 1-4 (intro, normative theories, decision-making, CSR). Part 2 “Contextualizing Business Ethics”: module 5 (BE, the company and its stakeholders).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between module 2 and module 3?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Module 2 is normative (which criteria tell us what is right); module 3 concerns actual decision-making (how people do, or do not, come to behave ethically).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Define &quot;stakeholder&quot;.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Any group or individual who can affect or is affected by the achievement of the organisation&#x27;s objectives (Freeman, 1984).&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Main book &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Crane, Matten, Glozer &amp;amp; Spence (2019)&lt;/b&gt;, &lt;i&gt;Business Ethics&lt;/i&gt;, Fifth Edition, Oxford University Press.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;+ suggested readings for specific modules (e.g. CSR and stakeholder theory). The reading list is on &lt;b&gt;Leganto&lt;/b&gt; (the library&#x27;s reading list service) and on Moodle. &lt;b&gt;Watch out for updates!&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;The exam&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt; It is a &lt;b&gt;written&lt;/b&gt; exam covering the theoretical and practical aspects explained in class. A mark of at least &lt;b&gt;18/30&lt;/b&gt; is required to pass. Further information will be given during the course.&lt;/p&gt;

    &lt;input type=&quot;range&quot; id=&quot;grade&quot; min=&quot;0&quot; max=&quot;31&quot; value=&quot;24&quot;&gt;

    &lt;div class=&quot;readout&quot; id=&quot;grade-out&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;small&quot; id=&quot;grade-note&quot; style=&quot;color:var(--ink)&quot;&gt;&lt;/div&gt;
    &lt;figcaption&gt;&lt;span class=&quot;src int&quot;&gt;supplement&lt;/span&gt; In the Italian system marks range from 0 to 30; 18 is the pass mark, and 30 cum laude (“30L”, from &lt;i&gt;lode&lt;/i&gt;) denotes excellence.&lt;/figcaption&gt;

  &lt;h4&gt;What is rewarded &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h4&gt;
  &lt;p&gt;“Clearness, synthesis, consistency and critical judgment will be given particular merit”. Open each criterion to see how to put it into practice in a written answer:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Clearness&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Define technical terms (e.g. CSR, stakeholder) before using them; one idea per paragraph.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Synthesis&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Answer the question asked, not everything you know. Select the relevant concepts.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Consistency&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Conclusions must follow from the premises: if you apply a theory, apply it all the way through.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Critical judgment&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Compare perspectives, acknowledge the limits of a theory, take a position and justify it: this is the “critically analyse” of the course aims.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slides 21-22&lt;/span&gt; The lecture closes with time for questions and the invitation: &lt;i&gt;“Participate actively and… enjoy the course!”&lt;/i&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the main textbook?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Crane, Matten, Glozer and Spence (2019), &lt;i&gt;Business Ethics&lt;/i&gt;, 5th ed., Oxford University Press.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Exam format and pass mark?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Written; passed with at least 18/30.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which four qualities are rewarded?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Clearness, synthesis, consistency, critical judgment.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Where is the reading list?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;On Leganto and in the course&#x27;s Moodle space.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- APPROFONDIRE --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Resources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Texts and resources cited in the slides (or closely related to concepts the slides mention). Each entry is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;: details verified through web searches, to be checked against the library catalogue.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A., Matten, D., Glozer, S. &amp;amp; Spence, L. J. (2019). &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;, 5th ed. Oxford University Press &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;About 600 pages; this edition adds Laura Spence and Sarah Glozer to the author team, with revised “Ethics in Action” boxes. It covers definitions of business ethics, ethical theories, decision-making, CSR and chapters organised by stakeholder (shareholders, employees, consumers, suppliers, civil society, government).&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is the course&#x27;s &lt;b&gt;main book&lt;/b&gt;; the module structure follows its organisation. There is also an “International Edition” (2020) with a different ISBN: check which edition Leganto lists.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Oxford University Press — book page (ISBN 9780198810070)&lt;/a&gt; · &lt;a href=&quot;https://search.worldcat.org/oclc/1106086638&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wicks, A. C., Freeman, R. E., Werhane, P. H. &amp;amp; Martin, K. E. (2010). &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;. Pearson / Prentice Hall &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;A textbook in 10 chapters: a first part on the language of ethics, the sources of ethical problems, stakeholders and value creation, and global ethics; a second part on ethics in the functional areas (leadership, marketing, finance and accounting, management) and on environmental sustainability, with cases such as Merck and Ben &amp;amp; Jerry&#x27;s.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the definition of ethics as the effort to &lt;i&gt;justify&lt;/i&gt; one&#x27;s behaviour (p. 4). Its authors include R. E. Freeman, the father of stakeholder theory.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson — Business Ethics, 1st edition (ISBN 9780131427921)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Freeman, R. E. (1984). &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;. Pitman (reissued by Cambridge University Press, 2010) &lt;span class=&quot;src&quot;&gt;slides 9, 19: “stakeholder theory”&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Organised in three parts: the stakeholder approach, strategic management processes, and implications for theory and practice.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is the founding text of stakeholder theory, the subject of module 5 and of the suggested readings.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rutgers CLEO — page on the book&lt;/a&gt; · &lt;a href=&quot;https://search.worldcat.org/es/title/Strategic-management-:-a-stakeholder-approach/oclc/903391157&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Carroll, A. B. (1991). “The pyramid of corporate social responsibility: toward the moral management of organizational stakeholders”. &lt;i&gt;Business Horizons&lt;/i&gt;, 34, 39-48 &lt;span class=&quot;src&quot;&gt;slides 5, 9: “CSR”&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Defines CSR as the set of economic, legal, ethical and philanthropic expectations that society has of businesses, and arranges them as a pyramid.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is one of the most cited articles on CSR, and almost always the starting point of module 4.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Maricopa Open — Carroll&#x27;s Pyramid of CSR (teaching summary)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Commission on Environment and Development (1987). &lt;i&gt;Our Common Future&lt;/i&gt; (“Brundtland Report”) &lt;span class=&quot;src&quot;&gt;slide 5: “sustainability”&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Report of the UN commission chaired by Gro Harlem Brundtland: it defines sustainable development and links environmental problems to poverty and consumption patterns.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is the origin of the most widely used definition of sustainability in policy documents, standards and sustainability reports.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.are.admin.ch/are/en/home/media/publications/sustainable-development/brundtland-report.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Swiss Federal Office for Spatial Development (ARE) — Brundtland Report&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rest, J. R. (1986). &lt;i&gt;Moral Development: Advances in Research and Theory&lt;/i&gt;. Praeger &lt;span class=&quot;src&quot;&gt;slides 7, 9: “ethical decision-making”&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Presents the four-component model (sensitivity/recognition, judgment, motivation/intent, character/behaviour) and research on the Defining Issues Test.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it is the foundational model for module 3 on how ethical decisions are made.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/James_Rest&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — James Rest (introductory entry)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;University of Bergamo — Master Degree in Accounting, Governance and Sustainability &lt;span class=&quot;src&quot;&gt;slides 1, 16&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Official page of the degree programme: structure, admission, double degree, career prospects (including the qualifying exam for Chartered Accountant and Statutory Auditor).&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Why it matters: it places Business Ethics within the overall Master programme.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.unibg.it/studiare/corsi/offertaformativa/accounting-governance-and-sustainability&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it — Accounting, Governance and Sustainability&lt;/a&gt; · &lt;a href=&quot;https://elearning15.unibg.it/course/view.php?id=9250&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Course Moodle space (from slide 15)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
