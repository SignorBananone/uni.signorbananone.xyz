*{box-sizing:border-box}

&lt;!-- 1 CORSO --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;corso&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 1 · slide 1-4&lt;/div&gt;&lt;h2&gt;Il corso, la docente, il Master&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 1-2&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Business Ethics&lt;/em&gt; è un insegnamento del &lt;em class=&quot;t&quot;&gt;Master Degree in Accounting, Governance and Sustainability&lt;/em&gt; (laurea magistrale, in inglese) del Dipartimento di Scienze Aziendali dell&#x27;Università di Bergamo, sede di via dei Caniana 2. La docente è la &lt;b&gt;Prof.ssa Silvana Signori&lt;/b&gt;, professoressa di Accounting, Business Ethics and Sustainability e coordinatrice del corso di laurea magistrale.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Accounting&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Misurare e rendicontare: bilanci, controllo, audit. È il &quot;come si conta&quot; il valore dell&#x27;impresa.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Governance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Chi decide nell&#x27;impresa, con quali regole e controlli, e a chi rende conto (&lt;i&gt;accountability&lt;/i&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il valore nel tempo e per la società e l&#x27;ambiente, non solo per gli azionisti.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; I tre pilastri del nome del Master: la business ethics è il terreno in cui si chiede &lt;i&gt;perché&lt;/i&gt; e &lt;i&gt;per chi&lt;/i&gt; si misura, si governa e si crea valore.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa dice il sito dell&#x27;ateneo sul Master AGS &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;p&gt;Laurea magistrale biennale da 120 CFU, classe LM-77 (scienze economico-aziendali), interamente in inglese e in presenza, ad accesso libero (servono inglese B2 e requisiti curricolari). Copre planning and control, risk management, corporate governance, auditing, sustainable finance e la misurazione e il reporting delle performance economiche, sociali e ambientali. Prevede un double degree con la University of Dundee.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Fonte: &lt;a href=&quot;https://www.unibg.it/studiare/corsi/offertaformativa/accounting-governance-and-sustainability&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it — Accounting, Governance and Sustainability&lt;/a&gt;.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;«Who you are…» — presentarsi&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 3-4&lt;/span&gt; La prima attività è una presentazione reciproca: nome, background, master frequentato, interessi, e soprattutto &lt;b&gt;aspettative&lt;/b&gt; sul corso e sul Master. Non è un dettaglio: un corso basato su &lt;em class=&quot;t&quot;&gt;discussion&lt;/em&gt; e &lt;em class=&quot;t&quot;&gt;case studies&lt;/em&gt; funziona solo se l&#x27;aula partecipa. Prova a preparare la tua risposta: apri una traccia per volta.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;My background is…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Pensa a cosa porti in aula: una laurea in economia, giurisprudenza, ingegneria? Esperienze di lavoro? Ogni background &quot;vede&quot; problemi etici diversi: chi viene dall&#x27;accounting nota la manipolazione dei numeri, chi viene dal marketing la pubblicità ingannevole.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My interests are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Clima, diritti dei lavoratori, finanza sostenibile, governance… Collegare i casi del corso ai tuoi interessi rende lo studio molto più efficace.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My expectations for this course are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Confrontale con gli &lt;a href=&quot;#obiettivi&quot;&gt;aims&lt;/a&gt; dichiarati: se ti aspetti &quot;regole da imparare&quot;, preparati a un corso che chiede soprattutto di &lt;i&gt;argomentare&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;My expectations for this Master Degree are…&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Professione futura (accountant, auditor, consultant, manager)? Gli obiettivi del corso citano proprio questi ruoli (slide 8).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In quale corso di laurea si colloca Business Ethics e in quale lingua?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Nel Master Degree (laurea magistrale) in Accounting, Governance and Sustainability dell&#x27;Università di Bergamo, Dipartimento di Scienze Aziendali; il corso è in inglese.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la prima lezione chiede di dichiarare le proprie aspettative?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché il corso si regge su discussione e casi reali: conoscere i background e le attese dell&#x27;aula permette di calibrare gli esempi, e allo studente serve per confrontare ciò che cerca con gli obiettivi dichiarati.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 ETICA --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;etica&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 2 · slide 5-6&lt;/div&gt;&lt;h2&gt;Che cos&#x27;è la (business) ethics&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; Il corso introduce il concetto di &lt;em class=&quot;t&quot;&gt;business ethics&lt;/em&gt; (etica degli affari: lo studio delle situazioni, attività e decisioni aziendali in cui si pongono questioni di giusto e sbagliato) e la sua importanza su due piani: quello &lt;b&gt;accademico&lt;/b&gt; (una disciplina con teorie e ricerche) e quello del &lt;b&gt;&lt;em class=&quot;t&quot;&gt;practical management&lt;/em&gt;&lt;/b&gt;, cioè la gestione concreta di organizzazioni di tipo diverso — imprese, ma anche enti pubblici e non profit.&lt;/p&gt;

  &lt;blockquote&gt;«Ethics refers to our efforts to figure out what we should do and how we should live. More specifically, it involves the challenge of figuring out how to justify our behavior — both to ourselves and to others (in business, e.g., to shareholders, employees, and the public). All of us “do” ethics, often without thinking consciously that this is what we are doing.»&lt;cite&gt;Wicks et al., 2010, p. 4 — citata nella slide 6&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;p&gt;Smontiamo la definizione pezzo per pezzo:&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;1 · Fare&quot;&gt;&lt;h4&gt;«what we should do»&lt;/h4&gt;&lt;p&gt;L&#x27;etica è &lt;b&gt;normativa&lt;/b&gt;: non descrive solo ciò che le persone fanno, ma si chiede che cosa &lt;i&gt;dovrebbero&lt;/i&gt; fare. «Dovrei rivelare al cliente il difetto del prodotto?» è una domanda etica; «quante aziende lo rivelano?» è una domanda descrittiva.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;2 · Vivere&quot; hidden&gt;&lt;h4&gt;«how we should live»&lt;/h4&gt;&lt;p&gt;Oltre alle singole azioni, l&#x27;etica riguarda il &lt;b&gt;tipo di persona&lt;/b&gt; (e di organizzazione) che vogliamo essere. È il ponte verso le &lt;em class=&quot;t&quot;&gt;virtues&lt;/em&gt; (virtù: disposizioni stabili del carattere, come onestà o coraggio) della slide 6.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;3 · Giustificare&quot; hidden&gt;&lt;h4&gt;«how to justify our behavior»&lt;/h4&gt;&lt;p&gt;Il cuore della definizione: fare etica significa saper dare &lt;b&gt;ragioni&lt;/b&gt; pubbliche e coerenti di una scelta. È esattamente ciò che l&#x27;esame premia: «clearness, synthesis, consistency and critical judgment» (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;4 · A chi&quot; hidden&gt;&lt;h4&gt;«to ourselves and to others»&lt;/h4&gt;&lt;p&gt;La giustificazione ha due pubblici: la nostra coscienza e gli altri. Nel business gli &quot;altri&quot; sono &lt;em class=&quot;t&quot;&gt;shareholders&lt;/em&gt; (azionisti), &lt;em class=&quot;t&quot;&gt;employees&lt;/em&gt; (dipendenti), &lt;em class=&quot;t&quot;&gt;the public&lt;/em&gt; (la collettività): sono già, in germe, gli &lt;a href=&quot;#struttura&quot;&gt;stakeholders&lt;/a&gt; del modulo 5.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 420 150&quot; style=&quot;max-width:420px;width:100%&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;75&quot; r=&quot;30&quot; fill=&quot;oklch(50% 0.15 35)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:oklch(97% 0.012 80)&quot; font-weight=&quot;600&quot;&gt;decisione&lt;/text&gt;
      &lt;g stroke=&quot;oklch(55% 0.09 150)&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;180&quot; y1=&quot;70&quot; x2=&quot;80&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;70&quot; x2=&quot;340&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;85&quot; x2=&quot;80&quot; y2=&quot;125&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;85&quot; x2=&quot;340&quot; y2=&quot;125&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;currentColor&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;20&quot; y=&quot;25&quot;&gt;sé stessi&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;25&quot;&gt;shareholders&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;140&quot;&gt;employees&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;140&quot;&gt;the public&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;5 · Tutti&quot; hidden&gt;&lt;h4&gt;«All of us “do” ethics»&lt;/h4&gt;&lt;p&gt;Non è materia per filosofi: ogni volta che decidiamo se arrotondare un dato, come trattare un collega o se accettare un regalo da un fornitore, stiamo già facendo etica, spesso &lt;b&gt;senza accorgercene&lt;/b&gt;. Il corso serve a renderlo consapevole e argomentato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav-btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Values, virtues, excellence&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; La slide chiude con una sintesi: &lt;i&gt;«Ethics is about values, virtues and excellence in business.»&lt;/i&gt; Tre parole chiave da tenere distinte:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Values&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Ciò che riteniamo importante e degno di essere perseguito (onestà, equità, rispetto, trasparenza). Orientano le scelte e possono entrare in conflitto tra loro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Virtues&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Tratti del carattere coltivati con la pratica: chi è onesto non &quot;applica una regola&quot;, lo è abitualmente. Tradizione che risale ad Aristotele.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Excellence&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;L&#x27;etica non è solo un freno (&quot;non fare&quot;): è anche fare &lt;i&gt;bene&lt;/i&gt; il proprio mestiere, eccellere come professionista e come impresa.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Spiegazioni dei tre termini aggiunte per chiarezza.&lt;/p&gt;

  &lt;h3&gt;Ethics, morality e law: non sono la stessa cosa&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Due distinzioni che le slide danno per scontate ma che tornano in tutto il corso (sono trattate nel manuale di Crane et al.).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Morality&lt;/b&gt; — le norme, i valori e le credenze radicati in un gruppo sociale che definiscono ciò che è giusto o sbagliato. &lt;b&gt;Ethics&lt;/b&gt; — la riflessione sistematica su quelle norme: le teorie con cui le esaminiamo e le giustifichiamo.&lt;/div&gt;
  &lt;p&gt;E la legge? Molti pensano «se è legale, è etico». Clicca le tre zone del diagramma:&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 230&quot; data-info-group=&quot;venn-out&quot; role=&quot;group&quot; aria-label=&quot;Diagramma ethics e law&quot;&gt;
        &lt;circle cx=&quot;140&quot; cy=&quot;115&quot; r=&quot;95&quot; fill=&quot;oklch(70% 0.1 150 / .35)&quot; stroke=&quot;oklch(45% 0.1 150)&quot; stroke-width=&quot;2&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Etico ma non (solo) imposto dalla legge.&lt;/b&gt; La legge non dice tutto: trattare con correttezza un fornitore piccolo, segnalare un rischio non obbligatorio, rifiutare un affare lecito ma dannoso. Qui vive gran parte della business ethics: dove la legge tace.&quot;/&gt;
        &lt;circle cx=&quot;220&quot; cy=&quot;115&quot; r=&quot;95&quot; fill=&quot;oklch(70% 0.1 250 / .35)&quot; stroke=&quot;oklch(45% 0.1 250)&quot; stroke-width=&quot;2&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Legale ma eticamente discutibile.&lt;/b&gt; Elusione fiscale aggressiva, produzione spostata dove le tutele del lavoro sono minime, marketing lecito ma manipolatorio. La legalità è un minimo, non una garanzia di correttezza.&quot;/&gt;
        &lt;path d=&quot;M180 30 A95 95 0 0 1 180 200 A95 95 0 0 1 180 30Z&quot; fill=&quot;oklch(50% 0.15 35 / .55)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Sovrapposizione.&lt;/b&gt; Molte norme giuridiche codificano valori morali condivisi: non rubare, non frodare, non discriminare. Qui legge ed etica dicono la stessa cosa — è la cosiddetta «codified ethics».&quot;/&gt;
        &lt;text x=&quot;80&quot; y=&quot;120&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; pointer-events=&quot;none&quot;&gt;Ethics&lt;/text&gt;
        &lt;text x=&quot;245&quot; y=&quot;120&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; pointer-events=&quot;none&quot;&gt;Law&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;venn-out&quot; class=&quot;card tint&quot; aria-live=&quot;polite&quot;&gt;Clicca una zona del diagramma (o selezionala con Tab e premi Invio).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Descriptive vs normative ethics&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;p&gt;&lt;b&gt;Normative&lt;/b&gt;: chiede cosa si &lt;i&gt;dovrebbe&lt;/i&gt; fare e offre criteri per giudicare (le &lt;em class=&quot;t&quot;&gt;normative ethical theories&lt;/em&gt; del modulo 2). &lt;b&gt;Descriptive&lt;/b&gt;: descrive come le persone &lt;i&gt;di fatto&lt;/i&gt; decidono e perché (base del modulo 3 sul &lt;em class=&quot;t&quot;&gt;decision-making&lt;/em&gt;). Il corso usa entrambe.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Secondo Wicks et al. (2010), qual è la &quot;sfida&quot; specifica dell&#x27;etica?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Capire come &lt;b&gt;giustificare il proprio comportamento&lt;/b&gt;, sia a sé stessi sia agli altri — nel business ad azionisti, dipendenti e pubblico.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché «All of us do ethics» è un&#x27;affermazione importante per un futuro auditor?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché le scelte etiche sono incorporate nel lavoro quotidiano (stime, giudizi professionali, rapporti col cliente) anche quando non le chiamiamo così; riconoscerle è il primo passo per gestirle.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;azione legale è sempre etica? Fai un esempio.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: legge ed etica si sovrappongono solo in parte. Esempio: una pratica fiscale lecita ma aggressiva, o vendere un prodotto conforme alle norme di un Paese ma vietato altrove perché dannoso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali tre parole sintetizzano l&#x27;etica nella slide 6?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Values, virtues and excellence in business.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 CSR --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;csr&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 3 · slide 5&lt;/div&gt;&lt;h2&gt;L&#x27;impresa in una società più ampia: CSR e sustainability&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; La business ethics viene inquadrata considerando la corporation come &lt;b&gt;parte di una &lt;em class=&quot;t&quot;&gt;wider society&lt;/em&gt;&lt;/b&gt;: l&#x27;impresa non è un&#x27;isola che risponde solo al mercato, ma un attore sociale che riceve risorse dalla società (lavoro, infrastrutture, legittimazione) e la influenza. Da qui due concetti che il corso analizza «nelle loro caratteristiche principali e in connessione con le teorie di business ethics»:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Corporate Social Responsibility (CSR)&lt;/h4&gt;&lt;p&gt;Responsabilità sociale d&#x27;impresa: l&#x27;idea che l&#x27;impresa abbia responsabilità verso la società che vanno oltre il profitto e il mero rispetto della legge. È il tema del &lt;b&gt;modulo 4&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p&gt;Sostenibilità: la capacità di mantenere nel tempo i sistemi economici, sociali e ambientali da cui dipendiamo. Per l&#x27;impresa significa creare valore senza consumare le basi future di quel valore.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La piramide di Carroll &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il modello più noto per ordinare le responsabilità d&#x27;impresa (Carroll, 1991). Clicca ogni livello:&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 260&quot; data-info-group=&quot;carroll-out&quot; role=&quot;group&quot; aria-label=&quot;Piramide di Carroll&quot;&gt;
        &lt;polygon points=&quot;180,10 225,70 135,70&quot; fill=&quot;oklch(75% 0.12 85)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Philanthropic — desired.&lt;/b&gt; Essere un buon cittadino d&#x27;impresa: donazioni, progetti per la comunità. La società lo &lt;i&gt;desidera&lt;/i&gt; ma non lo pretende.&quot;/&gt;
        &lt;polygon points=&quot;135,74 225,74 270,134 90,134&quot; fill=&quot;oklch(68% 0.12 150)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Ethical — expected.&lt;/b&gt; Fare ciò che è giusto ed equo anche oltre la legge, evitare il danno. È il livello in cui si colloca più direttamente la business ethics.&quot;/&gt;
        &lt;polygon points=&quot;90,138 270,138 315,198 45,198&quot; fill=&quot;oklch(62% 0.1 250)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Legal — required.&lt;/b&gt; Rispettare le leggi: la legge è la «codificazione» di ciò che la società considera giusto e sbagliato.&quot;/&gt;
        &lt;polygon points=&quot;45,202 315,202 355,254 5,254&quot; fill=&quot;oklch(58% 0.13 25)&quot; tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Economic — required.&lt;/b&gt; Essere profittevoli: è la base, perché un&#x27;impresa che non sopravvive non può adempiere a nessun&#x27;altra responsabilità.&quot;/&gt;
        &lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot; style=&quot;fill:oklch(18% 0.02 60)&quot; pointer-events=&quot;none&quot;&gt;&lt;text x=&quot;180&quot; y=&quot;58&quot;&gt;Phil.&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;110&quot;&gt;Ethical&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;174&quot;&gt;Legal&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;233&quot;&gt;Economic&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;carroll-out&quot; class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;Carroll definisce la CSR come l&#x27;insieme delle aspettative &lt;b&gt;economic, legal, ethical e discretionary (philanthropic)&lt;/b&gt; che la società ha verso le organizzazioni in un dato momento. Clicca un livello.&lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Fonte esterna: Carroll, A. B. (1991), «The pyramid of corporate social responsibility», &lt;i&gt;Business Horizons&lt;/i&gt;, 34, 39-48 — sintesi da &lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Maricopa Open — Carroll&#x27;s Pyramid of CSR&lt;/a&gt;. Le slide di questa lezione non citano Carroll: lo inseriamo come anticipazione del modulo 4.&lt;/figcaption&gt;
  &lt;/div&gt;

  &lt;h3&gt;Sustainability: la definizione classica &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h3&gt;
  &lt;blockquote&gt;Lo sviluppo sostenibile è uno sviluppo che soddisfa i bisogni del presente senza compromettere la capacità delle generazioni future di soddisfare i propri.&lt;cite&gt;Rapporto Brundtland, «Our Common Future», 1987 — &lt;a href=&quot;https://www.are.admin.ch/are/en/home/media/publications/sustainable-development/brundtland-report.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ARE, Confederazione Svizzera&lt;/a&gt;&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;svg viewBox=&quot;0 0 520 250&quot; style=&quot;max-width:520px;margin:auto&quot;&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;95&quot; r=&quot;75&quot; fill=&quot;oklch(70% 0.12 85 / .45)&quot; stroke=&quot;oklch(50% 0.11 85)&quot;/&gt;
      &lt;circle cx=&quot;320&quot; cy=&quot;95&quot; r=&quot;75&quot; fill=&quot;oklch(68% 0.1 150 / .45)&quot; stroke=&quot;oklch(45% 0.1 150)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;170&quot; r=&quot;75&quot; fill=&quot;oklch(65% 0.1 250 / .45)&quot; stroke=&quot;oklch(45% 0.1 250)&quot;/&gt;
      &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;currentColor&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;165&quot; y=&quot;80&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;80&quot;&gt;Environmental&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;220&quot;&gt;Social&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;260&quot; y=&quot;125&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; fill=&quot;currentColor&quot;&gt;sostenibile&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le tre dimensioni (economica, ambientale, sociale) indicate come componenti dello sviluppo sostenibile nella tradizione del rapporto Brundtland. Lo schema è un&#x27;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt;.&lt;/figcaption&gt;
  &lt;/div&gt;

  &lt;h3&gt;Come si collegano i tre concetti&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Business ethics&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;CSR&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Sustainability&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;La domanda di fondo&lt;/b&gt;: che cosa è giusto fare? Fornisce le &lt;i&gt;teorie&lt;/i&gt; e i criteri per valutare le scelte (moduli 2-3). È la &quot;grammatica&quot; con cui si discutono CSR e sostenibilità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;La risposta organizzativa&lt;/b&gt;: quali responsabilità si assume l&#x27;impresa verso la società e come le gestisce (politiche, codici etici, rendicontazione). Le teorie etiche servono a giustificare — o criticare — le pratiche di CSR.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;L&#x27;obiettivo di lungo periodo&lt;/b&gt;: il risultato a cui CSR ed etica dovrebbero contribuire, con un&#x27;attenzione esplicita alle generazioni future e ai limiti ambientali. Per un Master in Accounting la sostenibilità diventa anche &lt;i&gt;misurazione e reporting&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Lettura dei legami proposta per lo studio; il corso li approfondirà nei moduli 4-5.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa significa inquadrare la corporation «as part of a wider society»?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Considerare l&#x27;impresa come attore sociale che dipende dalla società e la influenza, e quindi ha responsabilità verso soggetti che vanno oltre i soli azionisti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i quattro livelli della piramide di Carroll, dal basso?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Economic (required), legal (required), ethical (expected), philanthropic (desired).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la definizione di sviluppo sostenibile del rapporto Brundtland?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Uno sviluppo che soddisfa i bisogni del presente senza compromettere la capacità delle generazioni future di soddisfare i propri.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 AIMS --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;obiettivi&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 4 · slide 5, 7-8&lt;/div&gt;&lt;h2&gt;Aims: che cosa si deve saper fare alla fine&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; Lo scopo dichiarato è sviluppare e approfondire la comprensione degli &lt;b&gt;obblighi morali&lt;/b&gt; (&lt;i&gt;moral obligations&lt;/i&gt;) e del &lt;b&gt;bene che il business può portare alla società&lt;/b&gt;. Nota la doppia faccia: l&#x27;etica come vincolo (obblighi) e come opportunità (il bene possibile).&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt; Il metodo: unire l&#x27;esame della teoria etica e manageriale con la &lt;em class=&quot;t&quot;&gt;discussion&lt;/em&gt; di problemi etici comuni &lt;i&gt;in context&lt;/i&gt;, attraverso &lt;em class=&quot;t&quot;&gt;real-world examples and case studies&lt;/em&gt;.&lt;/p&gt;

  &lt;h3&gt;Quattro verbi, in ordine di difficoltà&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; Lo studente deve saper &lt;b&gt;identify, describe, explain and critically analyse&lt;/b&gt;. Sono livelli crescenti: scorri i passi applicandoli a un caso di esempio — &lt;i&gt;un&#x27;azienda di abbigliamento scopre che un fornitore estero impiega lavoro minorile&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Identify&quot;&gt;&lt;h4&gt;1 · Identify — riconoscere&lt;/h4&gt;&lt;p&gt;Accorgersi che c&#x27;è una questione etica: «qui ci sono diritti dei minori in gioco, non solo un problema di costi di fornitura».&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Describe&quot; hidden&gt;&lt;h4&gt;2 · Describe — descrivere&lt;/h4&gt;&lt;p&gt;Ricostruire i fatti e chi è coinvolto: bambini e famiglie, fornitore, azienda, consumatori, azionisti, ONG, governo locale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Explain&quot; hidden&gt;&lt;h4&gt;3 · Explain — spiegare&lt;/h4&gt;&lt;p&gt;Perché succede? Pressione sui prezzi, controlli deboli nella supply chain, povertà locale, differenze normative tra Paesi. Si usano concetti e teorie del corso.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-label=&quot;Critically analyse&quot; hidden&gt;&lt;h4&gt;4 · Critically analyse — analizzare criticamente&lt;/h4&gt;&lt;p&gt;Valutare le opzioni (interrompere il contratto? lavorare col fornitore per un piano di uscita?) con più teorie etiche, mostrandone pro, contro e conseguenze per gli stakeholder, e arrivare a una posizione &lt;b&gt;argomentata&lt;/b&gt;. È il livello che l&#x27;esame premia.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav-btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Il caso è un esempio didattico, non tratto dalle slide.&lt;/p&gt;

  &lt;h3&gt;Su che cosa si applicano&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Oggetti di analisi &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;l&#x27;importanza della business ethics per il business&lt;/li&gt;
      &lt;li&gt;le questioni etiche attuali nel business&lt;/li&gt;
      &lt;li&gt;le teorie etiche attuali e l&#x27;&lt;em class=&quot;t&quot;&gt;ethical decision-making&lt;/em&gt; (processo decisionale etico)&lt;/li&gt;
      &lt;li&gt;le pratiche manageriali comuni per facilitare e incoraggiare un business etico&lt;/li&gt;
      &lt;li&gt;le diverse questioni etiche nelle relazioni &lt;em class=&quot;t&quot;&gt;business-stakeholder&lt;/em&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Abilità da migliorare &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;b&gt;Think critically&lt;/b&gt; — pensare criticamente&lt;/li&gt;
      &lt;li&gt;capire questioni e criticità di business ethics e CSR, nelle implicazioni teoriche e pratiche, in dimensione &lt;b&gt;internazionale&lt;/b&gt; e legate alle professioni (&lt;i&gt;accountant, auditor, consultant, manager&lt;/i&gt;)&lt;/li&gt;
      &lt;li&gt;applicare le principali teorie etiche tradizionali per analizzare posizioni e formulare &lt;em class=&quot;t&quot;&gt;moral defenses&lt;/em&gt; (difese morali argomentate) delle decisioni&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Evaluate the role of business in society&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i quattro verbi degli obiettivi e qual è il più impegnativo?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Identify, describe, explain, critically analyse; il più impegnativo è critically analyse, perché richiede di valutare alternative e prendere una posizione giustificata.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è una «moral defense» di una decisione aziendale?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Un&#x27;argomentazione che giustifica una decisione sulla base di una o più teorie etiche, rendendo espliciti i principi usati — il collegamento diretto con la definizione di Wicks et al. («justify our behavior»).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali professioni citano gli obiettivi del corso?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Accountant, auditor, consultant, manager.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 STRUTTURA --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;struttura&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 5 · slide 9&lt;/div&gt;&lt;h2&gt;La struttura: 5 moduli in 2 parti&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; Il corso procede «a cascata»: ogni modulo poggia sul precedente. La prima parte costruisce gli strumenti (&lt;b&gt;Understanding Business Ethics&lt;/b&gt;), la seconda li cala nella relazione tra impresa e portatori di interesse (&lt;b&gt;Contextualizing Business Ethics&lt;/b&gt;).&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Cascata dei cinque moduli&quot;&gt;
      &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot; style=&quot;fill:oklch(18% 0.02 60)&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(80% 0.13 85)&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;37&quot;&gt;1 · Introducing business ethics&lt;/text&gt;
        &lt;rect x=&quot;50&quot; y=&quot;64&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(82% 0.15 130)&quot;/&gt;&lt;text x=&quot;64&quot; y=&quot;91&quot;&gt;2 · Normative ethical theories&lt;/text&gt;
        &lt;rect x=&quot;90&quot; y=&quot;118&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(75% 0.15 150)&quot;/&gt;&lt;text x=&quot;104&quot; y=&quot;145&quot;&gt;3 · Making decisions&lt;/text&gt;
        &lt;rect x=&quot;130&quot; y=&quot;172&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(80% 0.1 185)&quot;/&gt;&lt;text x=&quot;144&quot; y=&quot;199&quot;&gt;4 · Corporate Social Responsibility&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;236&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;oklch(70% 0.1 250)&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;263&quot;&gt;5 · BE, the company &amp;amp; its stakeholders&lt;/text&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;currentColor&quot; fill=&quot;none&quot; stroke-width=&quot;1.5&quot; opacity=&quot;.6&quot;&gt;&lt;path d=&quot;M565 10 h12 v206 h-12&quot;/&gt;&lt;path d=&quot;M565 236 h12 v44 h-12&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;12&quot; fill=&quot;currentColor&quot; font-weight=&quot;600&quot;&gt;&lt;text x=&quot;585&quot; y=&quot;105&quot;&gt;Part 1&lt;/text&gt;&lt;text x=&quot;585&quot; y=&quot;121&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot;&gt;Under-&lt;/text&gt;&lt;text x=&quot;585&quot; y=&quot;134&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot;&gt;standing&lt;/text&gt;&lt;text x=&quot;585&quot; y=&quot;255&quot;&gt;Part 2&lt;/text&gt;&lt;text x=&quot;585&quot; y=&quot;270&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot;&gt;Context.&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Ridisegno dello schema della slide 9.&lt;/figcaption&gt;
  &lt;/div&gt;
  &lt;p&gt;Che cosa aspettarsi in ogni modulo (anticipazioni: le slide di questa lezione riportano solo i titoli).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 Intro&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 Theories&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 Decisions&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 CSR&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;5 Stakeholders&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Introducing business ethics and its relevance in business context&lt;/h4&gt;&lt;p&gt;Che cos&#x27;è la business ethics, perché conta per le imprese (reputazione, fiducia, rischio, motivazione dei dipendenti), rapporto con la legge e con la globalizzazione. Questa lezione d&#x27;apertura ne è il primo assaggio: vedi &lt;a href=&quot;#etica&quot;&gt;Parte 2&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Evaluating business ethics through normative ethical theories&lt;/h4&gt;&lt;p&gt;Le &lt;em class=&quot;t&quot;&gt;normative ethical theories&lt;/em&gt; sono criteri per giudicare se un&#x27;azione è giusta. Le famiglie &quot;tradizionali&quot; che di solito si studiano:&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Consequentialism / utilitarianism&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Un&#x27;azione è giusta se produce le &lt;b&gt;conseguenze migliori&lt;/b&gt; (il massimo bene per il maggior numero). Domanda tipo: «quale opzione genera più benefici netti per tutti i coinvolti?»&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Deontology (ethics of duty)&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Contano i &lt;b&gt;doveri e i principi&lt;/b&gt;, a prescindere dalle conseguenze (Kant: tratta le persone sempre come fini, mai solo come mezzi). Domanda tipo: «vorrei che tutti agissero secondo questa regola?»&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Rights &amp;amp; justice&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Le persone hanno &lt;b&gt;diritti&lt;/b&gt; che non si possono sacrificare per un vantaggio collettivo; la giustizia riguarda l&#x27;equa distribuzione di benefici e oneri.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Virtue ethics&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Al centro c&#x27;è il &lt;b&gt;carattere&lt;/b&gt;: «che cosa farebbe una persona virtuosa?» (Aristotele). Si collega a «values, virtues and excellence» della slide 6.&lt;/div&gt;&lt;/details&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Panoramica standard, da verificare sulle slide del modulo 2.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Making decisions in business ethics&lt;/h4&gt;&lt;p&gt;Come le persone &lt;i&gt;di fatto&lt;/i&gt; prendono decisioni etiche e che cosa le influenza (fattori individuali come valori ed esperienza; fattori situazionali come cultura aziendale, pressioni, incentivi). Un modello classico, usato anche nel manuale di riferimento, è quello di &lt;b&gt;Rest&lt;/b&gt; in quattro fasi:&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 640 90&quot; style=&quot;width:100%&quot;&gt;&lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Recognition&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;vedo il problema&lt;/text&gt;
        &lt;rect x=&quot;167&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Judgment&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;valuto cosa è giusto&lt;/text&gt;
        &lt;rect x=&quot;329&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;399&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Intent&lt;/text&gt;&lt;text x=&quot;399&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;decido di farlo&lt;/text&gt;
        &lt;rect x=&quot;491&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;oklch(85% 0.08 150)&quot;/&gt;&lt;text x=&quot;561&quot; y=&quot;42&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;Behaviour&lt;/text&gt;&lt;text x=&quot;561&quot; y=&quot;58&quot; font-weight=&quot;400&quot; font-size=&quot;11&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;lo faccio davvero&lt;/text&gt;&lt;/g&gt;
        &lt;g stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M147 45h16M309 45h16M471 45h16&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Rest, J. (1986), &lt;i&gt;Moral Development&lt;/i&gt; — vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;. Il fallimento in una qualunque delle fasi impedisce il comportamento etico.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Corporate Social Responsibility (CSR)&lt;/h4&gt;&lt;p&gt;Definizioni e modelli della CSR (vedi la piramide di Carroll nella &lt;a href=&quot;#csr&quot;&gt;Parte 3&lt;/a&gt;), argomenti a favore e contro, il dibattito su «a che cosa serve l&#x27;impresa». Il corso indica letture suggerite specifiche per questo modulo (slide 19).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;h4&gt;Business ethics, the company and its stakeholders&lt;/h4&gt;&lt;p&gt;Uno &lt;em class=&quot;t&quot;&gt;stakeholder&lt;/em&gt; (portatore di interesse) è, nella definizione classica di Freeman (1984), qualsiasi gruppo o individuo che può influenzare o essere influenzato dal raggiungimento degli obiettivi dell&#x27;impresa. Il modulo esamina le questioni etiche con ciascuno.&lt;/p&gt;
      &lt;div class=&quot;figure&quot; style=&quot;margin:8px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 400 260&quot; data-info-group=&quot;stk-out&quot; role=&quot;group&quot; aria-label=&quot;Mappa degli stakeholder&quot;&gt;
          &lt;g stroke=&quot;oklch(60% 0.05 250)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;200&quot; y2=&quot;35&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;340&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;340&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;200&quot; y2=&quot;225&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;60&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;130&quot; x2=&quot;60&quot; y2=&quot;70&quot;/&gt;&lt;/g&gt;
          &lt;circle cx=&quot;200&quot; cy=&quot;130&quot; r=&quot;34&quot; fill=&quot;oklch(50% 0.15 35)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:oklch(97% 0.012 80)&quot;&gt;Impresa&lt;/text&gt;
          &lt;g font-size=&quot;11&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot; style=&quot;fill:oklch(20% 0.02 60)&quot;&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Shareholders&lt;/b&gt;: governance, diritti degli azionisti, remunerazione dei manager, insider trading.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;35&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;39&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Employees&lt;/b&gt;: discriminazione, salute e sicurezza, privacy, salari equi, whistleblowing.&quot;&gt;&lt;circle cx=&quot;340&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;74&quot;&gt;Employees&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Consumers&lt;/b&gt;: sicurezza dei prodotti, marketing ingannevole, prezzi, dati personali.&quot;&gt;&lt;circle cx=&quot;340&quot; cy=&quot;190&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;194&quot;&gt;Consumers&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Suppliers &amp;amp; competitors&lt;/b&gt;: lavoro nelle supply chain, potere contrattuale, corruzione, concorrenza leale.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;225&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;229&quot;&gt;Suppliers&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Civil society&lt;/b&gt;: ONG, comunità locali, ambiente; impatti dell&#x27;impresa sul territorio.&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;190&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;194&quot;&gt;Civil soc.&lt;/text&gt;&lt;/g&gt;
          &lt;g tabindex=&quot;0&quot; class=&quot;toggle&quot; data-info=&quot;&lt;b&gt;Government&lt;/b&gt;: lobbying, tasse, regolazione, rapporto tra impresa e politica.&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;oklch(85% 0.06 250)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;74&quot;&gt;Government&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;
        &lt;/svg&gt;
        &lt;div id=&quot;stk-out&quot; class=&quot;card tint small&quot; aria-live=&quot;polite&quot;&gt;Clicca uno stakeholder per vedere esempi di questioni etiche tipiche.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Freeman (1984) — vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;. Gruppi ed esempi: &lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; sulla falsariga del manuale.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Non ho potuto consultare gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; (lezioni dei moduli, programma): le anticipazioni qui sopra vanno confrontate con quelle slide quando le studierai.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali moduli formano la Part 1 e quale la Part 2?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Part 1 «Understanding Business Ethics»: moduli 1-4 (intro, normative theories, decision-making, CSR). Part 2 «Contextualizing Business Ethics»: modulo 5 (BE, the company and its stakeholders).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra il modulo 2 e il modulo 3?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Il 2 è normativo (quali criteri dicono cosa è giusto); il 3 riguarda il processo decisionale reale (come si arriva, o non si arriva, a comportarsi eticamente).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Definisci &quot;stakeholder&quot;.&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Qualsiasi gruppo o individuo che può influenzare o essere influenzato dal raggiungimento degli obiettivi dell&#x27;impresa (Freeman, 1984).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 ORGANIZZAZIONE --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;organizzazione&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 6 · slide 10-16&lt;/div&gt;&lt;h2&gt;Calendario, lezioni, ricevimento, Moodle&lt;/h2&gt;&lt;/header&gt;
  &lt;h3&gt;L&#x27;anno accademico in un anello&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 10-11&lt;/span&gt; Le attività didattiche sono divise in &lt;b&gt;due semestri&lt;/b&gt;, alternati a sessioni d&#x27;esame. Sposta il cursore sui mesi: l&#x27;anello evidenzia il periodo e il riquadro dice cosa succede per Business Ethics.&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;ring&quot; viewBox=&quot;0 0 300 300&quot; role=&quot;img&quot; aria-label=&quot;Anno accademico: semestri ed esami&quot;&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;label for=&quot;month&quot; class=&quot;small&quot;&gt;Mese&lt;/label&gt;
        &lt;input type=&quot;range&quot; id=&quot;month&quot; min=&quot;0&quot; max=&quot;11&quot; value=&quot;1&quot;&gt;
        &lt;div class=&quot;readout&quot; id=&quot;month-name&quot;&gt;&lt;/div&gt;
        &lt;div id=&quot;month-info&quot; class=&quot;small&quot; aria-live=&quot;polite&quot; style=&quot;color:var(--ink)&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(62% 0.14 35)&quot;&gt;&lt;/i&gt;lezioni&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(58% 0.08 250)&quot;&gt;&lt;/i&gt;esami&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(80% 0.01 70)&quot;&gt;&lt;/i&gt;pausa&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Ridisegno della slide 10. Il calendario completo è sul sito di ateneo (slide 11, link «here» non riportato nel PDF).&lt;/figcaption&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le lezioni di Business Ethics&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Quando &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;I semestre&lt;/b&gt;: 14 settembre – 19 dicembre 2026, &lt;b&gt;in presenza&lt;/b&gt;.&lt;br&gt;Orario: &lt;b&gt;lunedì e martedì, 10:30-12:30&lt;/b&gt;.&lt;/p&gt;
      &lt;ul class=&quot;clean small&quot;&gt;&lt;li&gt;sospensione per festività: 7-8/12/2026 e dal 20/12/2026 al 6/01/2027&lt;/li&gt;&lt;li&gt;21-23 ottobre: lezioni sospese per le &lt;i&gt;Final Dissertations&lt;/i&gt; (lauree), possibili recuperi&lt;/li&gt;&lt;li&gt;16-17 novembre: lezioni sospese per le prove intermedie (&lt;i&gt;mid-term exams&lt;/i&gt;)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Regole d&#x27;ingaggio &lt;span class=&quot;src&quot;&gt;slide 13, 15&lt;/span&gt;&lt;/h4&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Lezioni &lt;b&gt;solo in presenza&lt;/b&gt;: nessuna registrazione.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Attendance is strongly recommended&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Possibili &lt;b&gt;cambiamenti&lt;/b&gt; durante l&#x27;anno (anche per partecipare a seminari): seguire le indicazioni della docente e il sito (pagina «Lectures&#x27; schedule» e «Department agenda»).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il calendario qui sotto è calcolato applicando le regole della slide 12 a tutti i lunedì e martedì del semestre:&lt;/p&gt;
  &lt;div class=&quot;cal&quot; id=&quot;cal&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--tint);border:1px solid var(--line)&quot;&gt;&lt;/i&gt;lezione prevista&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--rule) 3px 4px);border:1px solid var(--rule)&quot;&gt;&lt;/i&gt;sospesa&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot; id=&quot;cal-sum&quot;&gt;&lt;/p&gt;
  &lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Conteggio indicativo: le sospensioni del 21-23 ottobre cadono di mercoledì-venerdì e non toccano le lezioni di BE; il calendario reale può cambiare (slide 13).&lt;/p&gt;

  &lt;h3&gt;Ricevimento&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt; Primi appuntamenti: giovedì 17 settembre ore 12:00, lunedì 21 settembre ore 16:30, giovedì 1 ottobre ore 14:00. &lt;b&gt;Dal 19 ottobre: ogni lunedì alle 12:30&lt;/b&gt;. La slide raccomanda di &lt;b&gt;verificare eventuali cambiamenti prima di andare&lt;/b&gt;. Per qualsiasi necessità: l&#x27;indirizzo email istituzionale della docente indicato nella slide (silvana.signori@unibg.it).&lt;/p&gt;

  &lt;h3&gt;e-learning (Moodle)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 15-16&lt;/span&gt; Materiali e handouts sono pubblicati sulla piattaforma &lt;em class=&quot;t&quot;&gt;Moodle&lt;/em&gt; (lo spazio e-learning d&#x27;ateneo). Conviene iscriversi in &lt;b&gt;due spazi&lt;/b&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;LM AGS&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Lo spazio dell&#x27;intero Master Degree in Accounting, Governance and Sustainability: comunicazioni generali del corso di laurea.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business ethics&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Lo spazio del singolo insegnamento: slide, letture, avvisi. Link indicato nella slide 15: &lt;a href=&quot;https://elearning15.unibg.it/course/view.php?id=9250&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;elearning15.unibg.it/course/view.php?id=9250&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Percorso dal sito unibg.it (slide 16): voce &lt;i&gt;eLearning&lt;/i&gt; in alto a sinistra → area «Scienze Aziendali e Scienze Economiche». Nella slide c&#x27;è anche un QR code.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Giorni e orario delle lezioni?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Lunedì e martedì, 10:30-12:30, in presenza, dal 14/09 al 19/12/2026.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In quali giorni di novembre non c&#x27;è lezione, e perché?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;16-17 novembre, per le prove intermedie (mid-term exams).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le lezioni sono registrate?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: «Lectures will be provided only in presence!», la frequenza è fortemente raccomandata; i materiali sono su Moodle.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In quali due spazi Moodle conviene iscriversi?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Quello del Master LM AGS e quello del corso Business ethics.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 ESAME --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;esame&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 7 · slide 19-22&lt;/div&gt;&lt;h2&gt;Bibliografia ed esame&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Main book &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Crane, Matten, Glozer &amp;amp; Spence (2019)&lt;/b&gt;, &lt;i&gt;Business Ethics&lt;/i&gt;, Fifth Edition, Oxford University Press.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;+ letture suggerite per moduli specifici (ad es. CSR e stakeholder theory). La reading list è su &lt;b&gt;Leganto&lt;/b&gt; (il servizio di liste di lettura della biblioteca) e su Moodle. &lt;b&gt;Attenzione agli aggiornamenti!&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Come prepararsi &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;clean small&quot;&gt;&lt;li&gt;slide e handouts pubblicati su Moodle&lt;/li&gt;&lt;li&gt;testi, letture, articoli, documentari e fonti web raccomandati durante il corso&lt;/li&gt;&lt;li&gt;&lt;b&gt;«We strongly recommend to study all the suggested reading!»&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;L&#x27;esame&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt; È &lt;b&gt;scritto&lt;/b&gt; e verte su aspetti teorici e pratici spiegati a lezione. Per superarlo serve almeno &lt;b&gt;18/30&lt;/b&gt;. Ulteriori informazioni saranno date durante il corso.&lt;/p&gt;
  &lt;div class=&quot;figure&quot;&gt;
    &lt;label for=&quot;grade&quot; class=&quot;small&quot;&gt;Prova un voto&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;grade&quot; min=&quot;0&quot; max=&quot;31&quot; value=&quot;24&quot;&gt;
    &lt;svg viewBox=&quot;0 0 620 40&quot; style=&quot;width:100%&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;12&quot; width=&quot;360&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;oklch(80% 0.01 70)&quot;/&gt;&lt;rect x=&quot;360&quot; y=&quot;12&quot; width=&quot;240&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;oklch(65% 0.1 150)&quot;/&gt;&lt;rect x=&quot;600&quot; y=&quot;12&quot; width=&quot;20&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;oklch(50% 0.15 35)&quot;/&gt;&lt;g font-size=&quot;11&quot; fill=&quot;currentColor&quot;&gt;&lt;text x=&quot;0&quot; y=&quot;40&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;352&quot; y=&quot;40&quot;&gt;18&lt;/text&gt;&lt;text x=&quot;588&quot; y=&quot;40&quot;&gt;30&lt;/text&gt;&lt;text x=&quot;604&quot; y=&quot;9&quot;&gt;L&lt;/text&gt;&lt;/g&gt;&lt;polygon id=&quot;gmark&quot; points=&quot;0,10 -6,0 6,0&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;

    &lt;figcaption&gt;&lt;span class=&quot;src int&quot;&gt;integrazione&lt;/span&gt; Nel sistema italiano i voti vanno da 0 a 30; 18 è la sufficienza, 30 e lode («30L») l&#x27;eccellenza.&lt;/figcaption&gt;
  &lt;/div&gt;
  &lt;h4&gt;Che cosa viene premiato &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h4&gt;
  &lt;p&gt;«Clearness, synthesis, consistency and critical judgment will be given particular merit». Tocca ogni criterio per vedere come metterlo in pratica in una risposta scritta:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Clearness — chiarezza&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Definisci i termini tecnici (es. CSR, stakeholder) prima di usarli; una idea per paragrafo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Synthesis — sintesi&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Rispondi alla domanda posta, non a tutto ciò che sai. Seleziona i concetti rilevanti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Consistency — coerenza&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Le conclusioni devono seguire dalle premesse: se applichi una teoria, applicala fino in fondo.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Critical judgment — giudizio critico&lt;/summary&gt;&lt;div class=&quot;body small&quot;&gt;Confronta prospettive, riconosci i limiti di una teoria, prendi posizione motivandola: è il «critically analyse» degli obiettivi.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 21-22&lt;/span&gt; La lezione chiude con lo spazio per le domande e l&#x27;invito: &lt;i&gt;«Participate actively and… enjoy the course!»&lt;/i&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è il manuale principale?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Crane, Matten, Glozer e Spence (2019), &lt;i&gt;Business Ethics&lt;/i&gt;, 5ª ed., Oxford University Press.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Forma dell&#x27;esame e soglia di superamento?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Scritto; si supera con almeno 18/30.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali quattro qualità vengono premiate?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Clearness, synthesis, consistency, critical judgment.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dove si trova la lista delle letture?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Su Leganto e nello spazio Moodle del corso.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- APPROFONDIRE --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;num&quot;&gt;Risorse&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/header&gt;
  &lt;p&gt;Testi e risorse citati nelle slide (o strettamente collegati a concetti che le slide nominano). Ogni scheda è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;: dati verificati via ricerca web, da controllare sul catalogo della biblioteca.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, A., Matten, D., Glozer, S. &amp;amp; Spence, L. J. (2019). &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;, 5th ed. Oxford University Press &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Circa 600 pagine; in questa edizione entrano nel gruppo di autori Laura Spence e Sarah Glozer, con i box «Ethics in Action» rinnovati. Copre definizioni di business ethics, teorie etiche, decision-making, CSR e i capitoli per stakeholder (azionisti, dipendenti, consumatori, fornitori, società civile, governo).&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è il &lt;b&gt;main book&lt;/b&gt; del corso; la struttura in moduli ne ricalca l&#x27;impianto. Esiste anche una «International Edition» (2020) con ISBN diverso: verifica quale edizione indica Leganto.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Oxford University Press — scheda del libro (ISBN 9780198810070)&lt;/a&gt; · &lt;a href=&quot;https://search.worldcat.org/oclc/1106086638&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wicks, A. C., Freeman, R. E., Werhane, P. H. &amp;amp; Martin, K. E. (2010). &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;. Pearson / Prentice Hall &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Manuale in 10 capitoli: una prima parte su linguaggio dell&#x27;etica, fonti dei problemi etici, stakeholder e creazione di valore, etica globale; una seconda sull&#x27;etica nelle aree funzionali (leadership, marketing, finanza e accounting, management) e sulla sostenibilità ambientale, con casi come Merck e Ben &amp;amp; Jerry&#x27;s.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della definizione di ethics come sforzo di &lt;i&gt;giustificare&lt;/i&gt; il proprio comportamento (p. 4). Tra gli autori c&#x27;è R. E. Freeman, padre della stakeholder theory.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson — Business Ethics, 1st edition (ISBN 9780131427921)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Freeman, R. E. (1984). &lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;. Pitman (ristampa Cambridge University Press, 2010) &lt;span class=&quot;src&quot;&gt;slide 9, 19: «stakeholder theory»&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Organizzato in tre parti: l&#x27;approccio stakeholder, i processi di strategic management, le implicazioni per teoria e pratica.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è il testo fondativo della stakeholder theory, oggetto del modulo 5 e delle letture suggerite.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rutgers CLEO — scheda sul libro&lt;/a&gt; · &lt;a href=&quot;https://search.worldcat.org/es/title/Strategic-management-:-a-stakeholder-approach/oclc/903391157&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Carroll, A. B. (1991). «The pyramid of corporate social responsibility: toward the moral management of organizational stakeholders». &lt;i&gt;Business Horizons&lt;/i&gt;, 34, 39-48 &lt;span class=&quot;src&quot;&gt;slide 5, 9: «CSR»&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Definisce la CSR come l&#x27;insieme delle aspettative economiche, legali, etiche e filantropiche della società verso le imprese, e le dispone a piramide.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è tra gli articoli più citati sulla CSR, quasi sempre il punto di partenza del modulo 4.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://open.maricopa.edu/societyandbusiness/chapter/carrolls-pyramid-of-csr/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Maricopa Open — Carroll&#x27;s Pyramid of CSR (sintesi didattica)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Commission on Environment and Development (1987). &lt;i&gt;Our Common Future&lt;/i&gt; («Rapporto Brundtland») &lt;span class=&quot;src&quot;&gt;slide 5: «sustainability»&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Rapporto della commissione ONU presieduta da Gro Harlem Brundtland: definisce lo sviluppo sostenibile e lega i problemi ambientali a povertà e modelli di consumo.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;origine della definizione di sostenibilità più usata in documenti, standard e bilanci di sostenibilità.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.are.admin.ch/are/en/home/media/publications/sustainable-development/brundtland-report.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ufficio federale svizzero dello sviluppo territoriale (ARE) — Brundtland Report&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rest, J. R. (1986). &lt;i&gt;Moral Development: Advances in Research and Theory&lt;/i&gt;. Praeger &lt;span class=&quot;src&quot;&gt;slide 7, 9: «ethical decision-making»&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Presenta il four-component model (sensitivity/recognition, judgment, motivation/intent, character/behaviour) e le ricerche sul Defining Issues Test.&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: è il modello di base per il modulo 3 su come si prendono le decisioni etiche.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/James_Rest&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia — James Rest (voce introduttiva)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Università di Bergamo — Master Degree in Accounting, Governance and Sustainability &lt;span class=&quot;src&quot;&gt;slide 1, 16&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Pagina ufficiale del corso di laurea: struttura, ammissione, double degree, sbocchi professionali (anche verso l&#x27;esame di Dottore Commercialista e Revisore Contabile).&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Perché conta: colloca Business Ethics nel percorso complessivo del Master.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.unibg.it/studiare/corsi/offertaformativa/accounting-governance-and-sustainability&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unibg.it — Accounting, Governance and Sustainability&lt;/a&gt; · &lt;a href=&quot;https://elearning15.unibg.it/course/view.php?id=9250&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Spazio Moodle del corso (dalla slide 15)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
