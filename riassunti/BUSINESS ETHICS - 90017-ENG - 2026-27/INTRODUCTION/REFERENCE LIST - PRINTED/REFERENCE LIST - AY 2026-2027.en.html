        &lt;line x1=&quot;80&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;80&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;230&quot;/&gt;
        &lt;line x1=&quot;250&quot; y1=&quot;90&quot; x2=&quot;420&quot; y2=&quot;50&quot;/&gt;&lt;line x1=&quot;250&quot; y1=&quot;90&quot; x2=&quot;420&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;250&quot; y1=&quot;230&quot; x2=&quot;420&quot; y2=&quot;270&quot;/&gt;
        &lt;line x1=&quot;420&quot; y1=&quot;50&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;160&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;270&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;
      &lt;/g&gt;
      &lt;g id=&quot;tiEdges&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot; style=&quot;display:none&quot;&gt;

      &lt;/g&gt;

        &lt;circle cx=&quot;80&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;157&quot;&gt;Brand&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;172&quot; font-size=&quot;10&quot;&gt;lead firm&lt;/text&gt;
        &lt;circle cx=&quot;250&quot; cy=&quot;90&quot; r=&quot;26&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;94&quot;&gt;Tier 1&lt;/text&gt;

        &lt;circle cx=&quot;420&quot; cy=&quot;270&quot; r=&quot;24&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;274&quot;&gt;Tier 2&lt;/text&gt;
        &lt;circle cx=&quot;590&quot; cy=&quot;160&quot; r=&quot;32&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;590&quot; y=&quot;157&quot;&gt;Workers&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;172&quot; font-size=&quot;10&quot;&gt;harmed&lt;/text&gt;
        &lt;g id=&quot;tiNode&quot; style=&quot;display:none&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;276&quot; width=&quot;100&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;590&quot; y=&quot;295&quot;&gt;NGO / media&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;netOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Schrempf: from liability to social connection&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; According to the summary in &lt;a href=&quot;https://socialsciencespace.com/2014/04/is-it-unfair-to-blame-fast-food-corporations-for-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business and Management INK&lt;/a&gt;, the article argues that obesity is a different problem from classic product liability, and attributes responsibility to fast-food chains &lt;b&gt;because of their connection&lt;/b&gt; to the problem, not for having caused it directly. The reference model is the &lt;em class=&quot;t&quot;&gt;social connection model&lt;/em&gt; of the philosopher Iris Marion Young.&lt;/p&gt;
  &lt;p&gt;Press the button to compare the two models.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; data-model=&quot;liab&quot;&gt;Liability model&lt;/button&gt;&lt;button class=&quot;btn&quot; data-model=&quot;soc&quot;&gt;Social connection model&lt;/button&gt;&lt;/div&gt;
    &lt;div id=&quot;modelOut&quot; class=&quot;panel&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Parameters for reasoning about responsibility (Young)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; Young suggests grading shared responsibility according to four parameters. Applied to fast-food chains:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;&lt;b&gt;Power&lt;/b&gt; — the capacity to influence the process: menus, portion sizes, prices, marketing to children.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Privilege&lt;/b&gt; — the benefit derived from the structure: profits from sales.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Interest&lt;/b&gt; — an interest in changing the structure: reputation, regulatory risks.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Collective ability&lt;/b&gt; — the capacity to act together with others: industry agreements, collaboration with schools and governments.&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Check in the article how Schrempf uses these parameters: the abstract does not list them.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The common thread&lt;/h3&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 680 150&quot; role=&quot;img&quot; aria-label=&quot;Link between Phillips and Schrempf&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;70&quot;&gt;Phillips: the network&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;dilutes responsibility&lt;/text&gt;
      &lt;rect x=&quot;240&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;70&quot;&gt;Common problem:&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;harm without a single culprit&lt;/text&gt;
      &lt;rect x=&quot;470&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot;&gt;Schrempf: connection&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;grounds responsibility&lt;/text&gt;
      &lt;path d=&quot;M210 75 L240 75&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M470 75 L440 75&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What are the three defences against the attribution of responsibility identified by Phillips?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Connection, control and knowledge.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What role does the tertius illuminans play?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It is a third party (NGOs, media, certifiers) that makes ties in the network visible: it increases density and centrality, making it harder for an actor to deny connection and knowledge.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does the liability model work poorly in the case of obesity?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because obesity arises from many causes and actors (diet, lifestyle, marketing, policy): no single culprit can be isolated and direct causation cannot be proven. The social connection model instead assigns a shared, forward-looking responsibility to those who participate in the process.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Link Phillips to Jones&#x27;s moral intensity.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;In long networks, proximity and temporal immediacy are low, so the issue appears less intense and is less often recognized as moral; the tertius illuminans makes it close and visible again.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The entries follow the 7 texts on the reference list, plus one related reading. The bibliographic details in grey come from the PDF; everything marked &lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; comes from web search, with a link.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Oxford University Press, Oxford 2019, 5th ed., ISBN 978-0-19-881007-0. Required reading, ch. 1-5, 7, 9.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; Published by OUP on 11 July 2019; authors Andrew Crane, Dirk Matten, Sarah Glozer, Laura Spence (&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Australia&lt;/a&gt;). According to a table of contents (unofficial source), the 11 chapters are: 1 Introducing business ethics; 2 Framing business ethics (CR, stakeholders, citizenship); 3 Normative ethical theories; 4 Descriptive ethical theories; 5 Tools and techniques; 6 Shareholders; 7 Employees; 8 Consumers; 9 Suppliers, competitors; 10 Civil society; 11 Government and regulation. Check the titles in the book.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the course&#x27;s core textbook. It organizes the subject by stakeholder, so chapters 7 and 9 apply the theories and tools of chapters 1-5.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;R. Edward Freeman — &lt;i&gt;Managing for Stakeholders&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: document, not in the library, available on Moodle. Required reading.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; A working paper with this title exists on SSRN (DOI 10.2139/ssrn.1186402), original version dated January 2007 (&lt;a href=&quot;https://econbiz.de/Record/managing-for-stakeholders-freeman-edward/10012708824&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconBiz&lt;/a&gt;). The same title belongs to a 2007 book by Freeman, Harrison and Wicks, &lt;i&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/i&gt; (Yale University Press), which proposes principles and techniques for managing stakeholder relationships (&lt;a href=&quot;https://www.goodreads.com/book/show/2178015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Goodreads&lt;/a&gt;). Freeman teaches at the Darden School of Business, University of Virginia (&lt;a href=&quot;https://phdplus.virginia.edu/people/r-edward-freeman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UVA&lt;/a&gt;). Use the version on Moodle: that is the one that counts for the course.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; Freeman is the father of stakeholder theory (&lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;, 1984). This text gives its mature formulation.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Elisabet Garriga, Domènec Melé — “Corporate Social Responsibility Theories: Mapping the Territory”&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53(1/2), 2004, pp. 51-71, DOI 10.1023/b:busi.0000039399.90587.34. Required reading.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; It classifies CSR theories into four groups (instrumental, political, integrative, ethical), corresponding to four dimensions (profits, political performance, social demands, ethical values), and concludes that a theory integrating them is needed (&lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;; &lt;a href=&quot;https://philpapers.org/rec/GARCSR&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers&lt;/a&gt; entry; text on the publisher&#x27;s site via &lt;a href=&quot;https://doi.org/10.1023/B:BUSI.0000039399.90587.34&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is one of the most cited reviews of CSR; it serves as a map on which to place all the other readings.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Judith Schrempf(-Stirling) — “A Social Connection Approach to Corporate Responsibility: The Case of the Fast-Food Industry and Obesity”&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Business &amp;amp; Society&lt;/i&gt; 53(2), 2014, pp. 300-332, Sage. Required reading, peer-reviewed.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; DOI 10.1177/0007650312449577. The article proposes the concept of social connection corporate responsibility as an alternative to product liability and applies it to the relationship between fast-food chains and obesity (&lt;a href=&quot;https://socialsciencespace.com/2014/04/is-it-unfair-to-blame-fast-food-corporations-for-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business and Management INK&lt;/a&gt;; &lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/27&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Richmond&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it brings into CSR a model of shared, forward-looking responsibility, useful for structural problems such as public health, climate and supply chains.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Robert A. Phillips — “Ethics and Network Organizations” (2009 SBE Presidential Address)&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 20(3), 2010, pp. 533-543, Society for Business Ethics. Required reading.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; It uses social network analysis to study how responsibility is distributed in outsourcing networks; it identifies three defences (connection, control, knowledge) and the role of the tertius illuminans in density and centrality (&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v20y2010i03p533-543_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;; &lt;a href=&quot;https://resolve.cambridge.org/core/journals/business-ethics-quarterly/article/ethics-and-network-organizations/AA6337DD77AB7DCB87818F9453571F96&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge University Press&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the presidential address of the field&#x27;s main scholarly society; it opens up the theme of responsibility in global chains.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Andrew C. Wicks, R. Edward Freeman, Patricia H. Werhane, Kirsten E. Martin — &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Pearson, Boston c2010, ISBN 978-0-13-142792-1. Recommended reading, ch. 3 only.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; 1st edition, Pearson. Ch. 3 is “Ethics, Stakeholders, Corporate Strategy, and Value Creation”, with the Merck &amp;amp; Co., Inc. case, in Part I “Ethics and Business” (&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it translates stakeholder theory into tools for managers, with cases.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Domènec Melé — &lt;i&gt;Business Ethics in Action: Seeking Human Excellence in Organizations&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Palgrave Macmillan, Basingstoke 2009, ISBN 978-0-230-57310-9. Recommended reading, ch. 7 only.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; Melé teaches at IESE Business School. In the table of contents of the 2009 edition, the seventh title is “The purpose of the firm and mission-driven management” (&lt;a href=&quot;https://www.kriso.ee/business-ethics-action-seeking-human-excellence-db-9780230573109.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kriso&lt;/a&gt;; see also &lt;a href=&quot;https://philpapers.org/rec/MELBEI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers&lt;/a&gt; and &lt;a href=&quot;https://www.iese.edu/insight/articles/profit-with-principles/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;). Later editions have a different subtitle (“Managing Human Excellence in Organizations”) and chapter numbering that may change.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it provides the humanistic perspective (virtue, common good) that complements the stakeholder approach.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Related reading (not on the reference list): Iris Marion Young — “Responsibility and Global Justice: A Social Connection Model”&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; &lt;i&gt;Social Philosophy and Policy&lt;/i&gt; 23(1), 2006, pp. 102-130; developed in the posthumous book &lt;i&gt;Responsibility for Justice&lt;/i&gt; (Oxford University Press, 2011). It proposes a forward-looking responsibility for those who participate in the structural processes that produce injustice; central example: sweatshops (&lt;a href=&quot;https://academic.oup.com/book/4381&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Academic&lt;/a&gt;; &lt;a href=&quot;https://en.wikipedia.org/wiki/Iris_Marion_Young&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the theoretical basis of the social connection model applied by Schrempf.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

    var btns=t.querySelectorAll(&#x27;.tabbar button&#x27;),pans=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;)});
      pans.forEach(function(p,j){p.hidden=j!==i});
    })});
  });
  // reveal answers
  document.querySelectorAll(&#x27;.reveal&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    var a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?&#x27;Show answer&#x27;:&#x27;Hide answer&#x27;;
  })});
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),dots=s.querySelector(&#x27;.dots&#x27;);
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){steps.forEach(function(x,j){x.hidden=j!==i});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j===i?&#x27;on&#x27;:&#x27;&#x27;});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });
  // info panels from clickable SVG elements
  document.querySelectorAll(&#x27;[data-info]&#x27;).forEach(function(el){
    function go(){var p=document.getElementById(el.getAttribute(&#x27;data-target&#x27;));if(p)p.innerHTML=el.getAttribute(&#x27;data-info&#x27;);}
    el.addEventListener(&#x27;click&#x27;,go);
    el.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go()}});
  });
  // highlight the current section in the table of contents
  var links=document.querySelectorAll(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle(&#x27;on&#x27;,l.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)})}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}

  // stakeholder map: shareholder vs stakeholder view
  var shOnly=false;
  $(&#x27;stkToggle&#x27;).addEventListener(&#x27;click&#x27;,function(){
    shOnly=!shOnly;
    document.querySelectorAll(&#x27;#stkmap .prim-n, #stkmap .sec-n, #stkSec&#x27;).forEach(function(n){n.style.opacity=shOnly?.12:1});
    document.querySelectorAll(&#x27;#stkmap line.prim&#x27;).forEach(function(l,i){if(i&gt;0)l.style.opacity=shOnly?.1:1});
    this.textContent=shOnly?&#x27;Show the stakeholder view&#x27;:&#x27;Show the shareholder view only&#x27;;
    $(&#x27;stkp&#x27;).innerHTML=shOnly?&#x27;&lt;b&gt;Shareholder view.&lt;/b&gt; The firm is accountable only to shareholders; other groups are constraints or instruments (Friedman).&#x27;:&#x27;&lt;b&gt;Stakeholder view.&lt;/b&gt; The firm creates value for and with all the groups it affects or is affected by (Freeman).&#x27;;
  });

  // classify the statements (Garriga &amp; Melé)
  var items=[
    [&#x27;We donate to a social cause because it increases sales of the product.&#x27;,&#x27;Instrumental&#x27;],
    [&#x27;Those who have social power and do not use it responsibly will eventually lose it.&#x27;,&#x27;Political&#x27;],
    [&#x27;We monitor emerging issues in society so that we can respond in time.&#x27;,&#x27;Integrative&#x27;],
    [&#x27;We respect human rights even when it does not pay economically.&#x27;,&#x27;Ethical&#x27;],
    [&#x27;The only social responsibility is to increase profits while staying within the rules.&#x27;,&#x27;Instrumental&#x27;],
    [&#x27;The firm must contribute to the common good of the community.&#x27;,&#x27;Ethical&#x27;]
  ];
  var groups=[&#x27;Instrumental&#x27;,&#x27;Political&#x27;,&#x27;Integrative&#x27;,&#x27;Ethical&#x27;],sorter=$(&#x27;sorter&#x27;);
  items.forEach(function(it){
    var d=document.createElement(&#x27;div&#x27;);d.className=&#x27;q&#x27;;
    var p=document.createElement(&#x27;p&#x27;);p.textContent=&#x27;“&#x27;+it[0]+&#x27;”&#x27;;d.appendChild(p);
    var row=document.createElement(&#x27;div&#x27;);row.style.cssText=&#x27;display:flex;flex-wrap:wrap;gap:6px&#x27;;
    var fb=document.createElement(&#x27;div&#x27;);fb.className=&#x27;note&#x27;;fb.style.marginTop=&#x27;6px&#x27;;
    groups.forEach(function(g){
      var b=document.createElement(&#x27;button&#x27;);b.className=&#x27;btn&#x27;;b.textContent=g;
      b.addEventListener(&#x27;click&#x27;,function(){
        row.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});b.classList.add(&#x27;on&#x27;);
        fb.textContent=g===it[1]?&#x27;✓ Correct: &#x27;+it[1]+&#x27;.&#x27;:&#x27;✗ Not quite: it is &#x27;+it[1]+&#x27;.&#x27;;
      });row.appendChild(b);
    });
    d.appendChild(row);d.appendChild(fb);sorter.appendChild(d);
  });

  // utilitarian lab
  function util(){
    var s=0;
    for(var i=1;i&lt;=5;i++){var v=+$(&#x27;u&#x27;+i).value;s+=v;$(&#x27;u&#x27;+i).nextElementSibling.textContent=(v&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+v;}
    $(&#x27;utilBar&#x27;).style.width=((s+50)/100*100)+&#x27;%&#x27;;
    $(&#x27;utilOut&#x27;).innerHTML=&#x27;Sum of utilities: &lt;b&gt;&#x27;+(s&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+s+&#x27;&lt;/b&gt;. &#x27;+(s&gt;0?&#x27;For utilitarianism the closure is justified: total benefits exceed harms.&#x27;:s&lt;0?&#x27;For utilitarianism the closure is not justified: total harms exceed benefits.&#x27;:&#x27;A tie: utilitarianism alone cannot decide.&#x27;)+&#x27; &lt;span class=&quot;note&quot;&gt;Note the limitation: who weighs how much, and who decides the numbers?&lt;/span&gt;&#x27;;
  }
  for(var i=1;i&lt;=5;i++)$(&#x27;u&#x27;+i).addEventListener(&#x27;input&#x27;,util);util();

  // moral intensity
  function mi(){
    var s=0;
    for(var i=1;i&lt;=6;i++){var v=+$(&#x27;m&#x27;+i).value;s+=v;$(&#x27;m&#x27;+i).nextElementSibling.textContent=v;}
    var avg=s/6;$(&#x27;miBar&#x27;).style.width=(avg*10)+&#x27;%&#x27;;
    $(&#x27;miOut&#x27;).textContent=avg&gt;=7?&#x27;High intensity: the issue is very likely to be recognized as moral.&#x27;:avg&gt;=4?&#x27;Medium intensity: it depends on framing and the organizational context.&#x27;:&#x27;Low intensity: high risk that nobody sees it as a moral issue.&#x27;;
  }
  for(var j=1;j&lt;=6;j++)$(&#x27;m&#x27;+j).addEventListener(&#x27;input&#x27;,mi);mi();

  // purpose of the firm
  var pp=[
    &#x27;&lt;b&gt;Shareholder view&lt;/b&gt; (Friedman): the firm exists to maximize shareholder value, within the law and the rules of the game. Everything else is up to governments and individuals.&#x27;,
    &#x27;&lt;b&gt;Stakeholder view&lt;/b&gt; (Freeman, Wicks): the firm exists to create value for all stakeholders; profit is an outcome of this value creation, not its sole purpose.&#x27;,
    &#x27;&lt;b&gt;Humanistic view&lt;/b&gt; (Melé): the firm is a community of persons that serves society and contributes to the common good; profit and stakeholder value are means and conditions of a broader purpose.&#x27;
  ];
  function ppu(){$(&#x27;ppOut&#x27;).innerHTML=pp[+$(&#x27;pp&#x27;).value]}
  $(&#x27;pp&#x27;).addEventListener(&#x27;input&#x27;,ppu);ppu();

  // Phillips&#x27;s network
  var ti=false;
  function net(){
    $(&#x27;tiEdges&#x27;).style.display=ti?&#x27;&#x27;:&#x27;none&#x27;;$(&#x27;tiNode&#x27;).style.display=ti?&#x27;&#x27;:&#x27;none&#x27;;
    var n=ti?8:7,e=ti?12:8,d=e/(n*(n-1)/2);
    $(&#x27;netStats&#x27;).textContent=&#x27;Nodes &#x27;+n+&#x27; · ties &#x27;+e+&#x27; · density &#x27;+d.toFixed(2)+&#x27; · brand ties &#x27;+(ti?4:2);
    $(&#x27;netOut&#x27;).innerHTML=ti?&#x27;The third party makes the ties visible: the brand is now directly linked to Tier 2 and to the workers through those who observe them. The &lt;b&gt;connection&lt;/b&gt; (“it has nothing to do with me”) and &lt;b&gt;knowledge&lt;/b&gt; (“I did not know”) defences lose credibility; &lt;b&gt;control&lt;/b&gt; remains open to debate.&#x27;:&#x27;Without the third party, the brand has only two direct ties and the workers are two steps away: it can plausibly claim that it is not connected to the harm and knows nothing about it.&#x27;;
    $(&#x27;tiBtn&#x27;).textContent=ti?&#x27;Remove the tertius illuminans&#x27;:&#x27;Add the tertius illuminans&#x27;;
  }
  $(&#x27;tiBtn&#x27;).addEventListener(&#x27;click&#x27;,function(){ti=!ti;net()});net();

  // liability vs social connection
  var models={
    liab:&#x27;&lt;b&gt;Liability model&lt;/b&gt;: one looks for whoever caused the harm, through a direct causal link and often with intent or negligence. Responsibility is backward-looking, isolates a culprit and sanctions it. It works well for a defective product; poorly for obesity, where the causes are many and diffuse.&#x27;,
    soc:&#x27;&lt;b&gt;Social connection model&lt;/b&gt; (Young, applied by Schrempf): those who, through their actions, participate in structural processes that produce harm are responsible, even if they do not cause it alone. Responsibility is shared, forward-looking (changing the structure) and exercised collectively. Fast-food chains are connected to obesity through their products, portion sizes and marketing.&#x27;
  };
  document.querySelectorAll(&#x27;[data-model]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    document.querySelectorAll(&#x27;[data-model]&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});b.classList.add(&#x27;on&#x27;);
    $(&#x27;modelOut&#x27;).innerHTML=models[b.getAttribute(&#x27;data-model&#x27;)];
  })});
  $(&#x27;modelOut&#x27;).innerHTML=models.liab;
})();
&lt;/script&gt;
