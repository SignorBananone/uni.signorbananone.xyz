  &lt;p&gt;The reference list is not a lecture: it is the course&#x27;s &lt;b&gt;reading contract&lt;/b&gt;. It states what is required (&lt;i&gt;Required reading&lt;/i&gt;), what is recommended (&lt;i&gt;Recommended reading&lt;/i&gt;) and, for books, &lt;b&gt;which chapters&lt;/b&gt; count. Studying well starts here: knowing what to read and why each text is on the list.&lt;/p&gt;

      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; A sensible order, from general to specific (a suggestion, not given by the course):&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Crane ch. 1-2 → the vocabulary: business ethics, CSR, stakeholders, citizenship.&lt;/li&gt;

        &lt;li&gt;Crane ch. 7 and 9 → two concrete stakeholder groups: employees, suppliers and competitors.&lt;/li&gt;
        &lt;li&gt;Phillips and Schrempf → the frontier: responsibility in supply networks and for structural problems.&lt;/li&gt;

&lt;section class=&quot;part sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;h2&gt;What is business ethics&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 1 (required). &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; standard definitions of the discipline, to be checked against the chapter.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Business ethics&lt;/b&gt; — the study of business situations, activities and decisions where issues of right and wrong are addressed. It is both a &lt;em class=&quot;t&quot;&gt;practice&lt;/em&gt; (how firms behave) and a &lt;em class=&quot;t&quot;&gt;discipline&lt;/em&gt; (how we study them).&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Morality&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Morality&lt;/b&gt;: the norms, values and beliefs embedded in social processes that define right and wrong for an individual or a community.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ethics&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Ethics&lt;/b&gt;: the study of morality and the application of reason to elucidate the rules and principles that determine right and wrong in a given situation.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Law&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Law&lt;/b&gt;: codified, enforceable rules. It often overlaps with ethics, but not always: business ethics is often said to begin where the law ends.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Ethics and law: two overlapping circles&lt;/h3&gt;
  &lt;p&gt;Click the three areas of the diagram.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram of ethics and law&quot;&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Legal only.&lt;/b&gt; Behaviour required or permitted by law that has little moral content, or that some consider questionable: for example technical accounting rules, or legal but contested practices (paying legal minimum wages that fall short of a living wage in some countries).&quot;&gt;&lt;circle cx=&quot;160&quot; cy=&quot;130&quot; r=&quot;105&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; opacity=&quot;.85&quot;/&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Ethical only.&lt;/b&gt; Moral issues on which the law is silent or ambiguous: the typical territory of business ethics. Examples: treating suppliers fairly beyond the contract, cutting emissions beyond what is mandatory, not exploiting a regulatory gap in a foreign country.&quot;&gt;&lt;circle cx=&quot;260&quot; cy=&quot;130&quot; r=&quot;105&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Ethical and legal.&lt;/b&gt; Where law and morality coincide: do not steal, do not defraud customers, do not discriminate. Here the law crystallizes a pre-existing moral consensus.&quot;&gt;&lt;path d=&quot;M210 39 A105 105 0 0 1 210 221 A105 105 0 0 1 210 39z&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;/g&gt;
    &lt;text x=&quot;110&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; pointer-events=&quot;none&quot;&gt;Law&lt;/text&gt;
    &lt;text x=&quot;310&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; pointer-events=&quot;none&quot;&gt;Ethics&lt;/text&gt;
    &lt;text x=&quot;210&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; pointer-events=&quot;none&quot;&gt;both&lt;/text&gt;
  &lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;vennp&quot;&gt;&lt;b&gt;Click an area&lt;/b&gt; to see what it contains.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Why study it?&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;The power and impact of business&lt;/summary&gt;&lt;div&gt;Large corporations shape work, consumption, the environment and politics. More power means a greater demand for accountability.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Crises and scandals&lt;/summary&gt;&lt;div&gt;Accounting fraud, environmental disasters, working conditions in supply chains: every scandal shows that markets and the law alone are not enough.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Better ethics can also be good for business&lt;/summary&gt;&lt;div&gt;Reputation, customer and employee trust, risk management: this is the &lt;em class=&quot;t&quot;&gt;business case&lt;/em&gt; (the economic justification) for ethics. Be careful, though: if ethics only counted when it pays, it would no longer be ethics. This tension recurs throughout the course (see the &lt;a href=&quot;#teoriecsr&quot;&gt;instrumental theories&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;People want to know how to behave&lt;/summary&gt;&lt;div&gt;Managers and employees face real dilemmas: knowing the theories helps them reason in a structured way, not just by instinct.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The textbook&#x27;s two frames: globalization and sustainability&lt;/h3&gt;
  &lt;p&gt;Crane&#x27;s subtitle is “managing corporate citizenship and sustainability in the age of globalization”. Two ideas underpin it.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Globalization&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Globalization&lt;/b&gt; is the progressive deterritorialization of economic activities: firms operate across countries with different laws and cultures. This creates regulatory gaps (no single government controls the whole chain) and makes it harder to say who is responsible. It is the same problem addressed by &lt;a href=&quot;#reti&quot;&gt;Phillips and Schrempf&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Sustainability&lt;/b&gt;: the long-term maintenance of the environmental, economic and social systems of which the firm is a part. In the classic form of the &lt;em class=&quot;t&quot;&gt;triple bottom line&lt;/em&gt;, the firm is assessed on three dimensions, not on profit alone.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 300&quot; style=&quot;max-width:420px;margin:auto&quot; role=&quot;img&quot; aria-label=&quot;Triple bottom line&quot;&gt;
    &lt;circle cx=&quot;210&quot; cy=&quot;110&quot; r=&quot;80&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;circle cx=&quot;150&quot; cy=&quot;200&quot; r=&quot;80&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;circle cx=&quot;270&quot; cy=&quot;200&quot; r=&quot;80&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;210&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Environmental&lt;/text&gt;
    &lt;text x=&quot;110&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Economic&lt;/text&gt;
    &lt;text x=&quot;310&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Social&lt;/text&gt;
    &lt;text x=&quot;210&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;sustainable&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Triple bottom line: sustainability lies at the intersection of the three dimensions.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between morality and ethics?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Morality is the set of norms and values lived within a community; ethics is rational reflection on those norms, in order to work out what is right in a given situation.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is business ethics said to “begin where the law ends”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because its typical field is the grey areas that the law does not regulate, or regulates poorly (partly because of globalization). If something is prohibited by law, the issue is one of compliance; business ethics deals with what remains open.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does the triple bottom line add to the classic view of the firm?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It assesses the firm on its environmental and social performance as well, not only on its economic results.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;csr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;h2&gt;CSR, stakeholders and corporate citizenship&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 2 · Freeman, &lt;i&gt;Managing for Stakeholders&lt;/i&gt; (Moodle). &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; classic models covered in these readings.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Corporate Social Responsibility (CSR)&lt;/b&gt; — the idea that the firm has responsibilities to society beyond profit for its shareholders. The debate starts from a question: &lt;i&gt;can a corporation have moral responsibilities?&lt;/i&gt; Those who answer yes argue that the corporation has its own intentions and decision-making structures, which cannot be reduced to those of individuals.&lt;/div&gt;

  &lt;h3&gt;Carroll&#x27;s pyramid&lt;/h3&gt;
  &lt;p&gt;The most cited model of CSR (Archie Carroll, 1991) distinguishes four levels of responsibility. Click a level.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;Carroll&#x27;s pyramid&quot;&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Economic responsibilities — required.&lt;/b&gt; Be profitable: produce useful goods and services, provide a return to investors, create jobs. This is the foundation: without it, the firm does not exist.&quot;&gt;&lt;path d=&quot;M40 280 L360 280 L322 210 L78 210z&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Economic&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Legal responsibilities — required.&lt;/b&gt; Obey the law: the law as society&#x27;s “codified ethics”.&quot;&gt;&lt;path d=&quot;M78 205 L322 205 L284 140 L116 140z&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Legal&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Ethical responsibilities — expected.&lt;/b&gt; Do what is right and fair even where the law does not reach; avoid harm. This is where business ethics in the strict sense comes in.&quot;&gt;&lt;path d=&quot;M116 135 L284 135 L246 70 L154 70z&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Ethical&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Philanthropic responsibilities — desired.&lt;/b&gt; Contribute to the community: donations, social projects, volunteering. Appreciated, but their absence is not regarded as immoral.&quot;&gt;&lt;path d=&quot;M154 65 L246 65 L200 10z&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Philanthropic&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;carrollp&quot;&gt;&lt;b&gt;Click a level&lt;/b&gt; of the pyramid.&lt;p class=&quot;note&quot;&gt;A common criticism: the pyramid shape suggests a hierarchy (profit first), and the model originates in the US context; in Europe many “ethical” responsibilities are already law.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Stakeholder theory&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt; — in Freeman&#x27;s classic definition (1984): “any group or individual who can affect or is affected by the achievement of the organization&#x27;s objectives”. It is contrasted with the &lt;b&gt;shareholder&lt;/b&gt;, who in the traditional view is the only party to whom the firm is accountable.&lt;/div&gt;
  &lt;p&gt;Click the nodes of the map. The button switches from the &lt;em class=&quot;t&quot;&gt;shareholder&lt;/em&gt; view to the &lt;em class=&quot;t&quot;&gt;stakeholder&lt;/em&gt; view.&lt;/p&gt;
  &lt;div&gt;&lt;button class=&quot;btn&quot; id=&quot;stkToggle&quot;&gt;Show the shareholder view only&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;&lt;svg id=&quot;stkmap&quot; viewBox=&quot;0 0 440 400&quot; role=&quot;img&quot; aria-label=&quot;Stakeholder map&quot;&gt;
    &lt;g id=&quot;stkSec&quot; stroke=&quot;var(--rule)&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;200&quot; r=&quot;175&quot;/&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.4&quot;&gt;
      &lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;220&quot; y2=&quot;85&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;330&quot; y2=&quot;160&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;290&quot; y2=&quot;295&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;150&quot; y2=&quot;295&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;110&quot; y2=&quot;160&quot; class=&quot;prim&quot;/&gt;
    &lt;/g&gt;
    &lt;circle cx=&quot;220&quot; cy=&quot;200&quot; r=&quot;42&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; class=&quot;serif&quot;&gt;Firm&lt;/text&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;g class=&quot;clickable stk&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Shareholders / financiers.&lt;/b&gt; They provide capital and expect a return. In the stakeholder view they remain fundamental, but they are not the only ones.&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;85&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;89&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Employees.&lt;/b&gt; They provide labour and skills, and expect wages, security and respect for their rights. → Crane ch. 7, section 8.&quot;&gt;&lt;circle cx=&quot;330&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;164&quot;&gt;Employees&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Customers.&lt;/b&gt; They buy products and services, and expect quality, safety and accurate information. Schrempf&#x27;s fast-food case is precisely about customers and health.&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;295&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;299&quot;&gt;Customers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Suppliers.&lt;/b&gt; They provide materials and services, and expect fair payment and stable relationships. → Crane ch. 9 and Phillips, sections 8 and 10.&quot;&gt;&lt;circle cx=&quot;150&quot; cy=&quot;295&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;299&quot;&gt;Suppliers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Communities.&lt;/b&gt; Local communities provide infrastructure and a social context, and bear the effects (jobs, pollution, traffic).&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;164&quot;&gt;Communities&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Government.&lt;/b&gt; A secondary stakeholder in Freeman: it sets the rules, taxes and regulates. It can strongly influence the firm even without direct market exchanges.&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;40&quot;&gt;Government&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Competitors.&lt;/b&gt; Secondary, but with obligations of fair competition. → Crane ch. 9.&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;378&quot; y=&quot;40&quot;&gt;Competitors&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Media.&lt;/b&gt; Secondary: they amplify or build reputation. They are a typical “tertius illuminans” in Phillips&#x27;s sense (section 10).&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;355&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;375&quot;&gt;Media&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Special interest groups / NGOs.&lt;/b&gt; NGOs, pressure groups, consumer associations: secondary, but able to mobilize other stakeholders.&quot;&gt;&lt;rect x=&quot;315&quot; y=&quot;355&quot; width=&quot;110&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;375&quot;&gt;NGOs and activists&lt;/text&gt;&lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Primary (filled circles) and secondary (outer ring) stakeholders, in the version by Freeman et al. (2007).&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;stkp&quot;&gt;&lt;b&gt;Click a stakeholder.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Freeman&#x27;s paper: the key ideas&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;The problem&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Three theses&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;The principles&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Value, not trade-offs&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;“Traditional” capitalism separates two worlds: business (profit) and ethics (elsewhere). Freeman calls this error the &lt;em class=&quot;t&quot;&gt;separation fallacy&lt;/em&gt;: the idea that one can talk about business without talking about ethics, and vice versa.&lt;/p&gt;
      &lt;p&gt;The paper proposes &lt;em class=&quot;t&quot;&gt;managing for stakeholders&lt;/em&gt;: running the firm with a view to creating value for all stakeholders, rather than maximizing shareholder value while treating everyone else as constraints.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Separation fallacy&lt;/h4&gt;&lt;p&gt;It is false to think that business decisions are morally neutral: every decision has effects on people.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Open question argument&lt;/h4&gt;&lt;p&gt;For any decision one can always ask: who benefits, who is harmed, whose rights are affected, what kind of person do I become by doing this?&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Responsibility principle&lt;/h4&gt;&lt;p&gt;Most people, most of the time, want to take responsibility for the effects of their actions on others.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Together they lead to the &lt;b&gt;integration thesis&lt;/b&gt;: business and ethics must be thought of together.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; The principles proposed by Freeman and co-authors (summarized wording; check the list against the paper):&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Stakeholder interests go together over time.&lt;/li&gt;
        &lt;li&gt;Stakeholders are real people with names and faces, not abstract categories.&lt;/li&gt;
        &lt;li&gt;Seek solutions that satisfy multiple stakeholders simultaneously.&lt;/li&gt;
        &lt;li&gt;Engage in intensive communication with everyone, including critics.&lt;/li&gt;
        &lt;li&gt;Prefer voluntarism to imposed regulation.&lt;/li&gt;
        &lt;li&gt;Generalize the marketing approach: understand each group&#x27;s needs as you would customers&#x27;.&lt;/li&gt;
        &lt;li&gt;Everything that is done serves stakeholders.&lt;/li&gt;
        &lt;li&gt;Negotiate with primary and secondary stakeholders.&lt;/li&gt;
        &lt;li&gt;Constantly monitor and redesign processes to serve stakeholders better.&lt;/li&gt;
        &lt;li&gt;Act with a purpose that fulfils commitments to stakeholders.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The key question is not “how do I divide a fixed pie?” but “how do I grow the pie for everyone?”. Freeman sees trade-offs between stakeholders as a problem to be overcome through innovation, not as a natural state.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;Fixed pie versus growing pie&quot;&gt;
        &lt;circle cx=&quot;130&quot; cy=&quot;85&quot; r=&quot;60&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;path d=&quot;M130 85 L130 25 A60 60 0 0 1 182 115z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;
        &lt;text x=&quot;130&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Trade-off: fixed pie&lt;/text&gt;
        &lt;path d=&quot;M230 85 L330 85&quot; stroke=&quot;var(--soft)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;circle cx=&quot;460&quot; cy=&quot;85&quot; r=&quot;78&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;path d=&quot;M460 85 L460 7 A78 78 0 0 1 528 124z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;
        &lt;text x=&quot;460&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Value creation: the pie grows&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Corporate citizenship&lt;/h3&gt;
  &lt;p&gt;Crane uses the metaphor of &lt;b&gt;citizenship&lt;/b&gt;: the firm as a “citizen” of society. There are three possible readings:&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;View&lt;/th&gt;&lt;th&gt;What it means&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Limited view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Citizenship = philanthropy and local community involvement, out of enlightened self-interest.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Equivalent view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Citizenship = a synonym for CSR (Carroll&#x27;s pyramid under another name).&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Extended view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The firm administers citizenship rights (social, civil, political) where the state falls short: it provides services, enables or hinders rights. This is the political view, crucial under globalization.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which levels of Carroll&#x27;s pyramid are “required”, “expected” and “desired”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Economic and legal: required. Ethical: expected. Philanthropic: desired.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the separation fallacy?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The idea, criticized by Freeman, that business and ethics are separate domains and that economic decisions are morally neutral.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between primary and secondary stakeholders?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Primary stakeholders (customers, employees, suppliers, communities, financiers) are essential to the firm&#x27;s existence and value creation; secondary stakeholders (government, competitors, media, NGOs) can influence or be influenced by it without being a direct party to its exchanges.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which view of corporate citizenship sees the firm as a political actor?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The extended view: the firm administers citizenship rights where governments fall short.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;teoriecsr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;h2&gt;Mapping CSR theories&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Garriga &amp;amp; Melé, “Corporate Social Responsibility Theories: Mapping the Territory”, &lt;i&gt;Journal of Business Ethics&lt;/i&gt;, 2004 (required). &lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; summary of the article from &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;.&lt;/p&gt;
  &lt;p&gt;The CSR field is full of theories that use different terms. Garriga and Melé classify them according to &lt;b&gt;how they conceive the relationship between business and society&lt;/b&gt;, starting from the idea (from the sociologist Talcott Parsons) that every social system must solve four problems: adapting to the environment, attaining goals, achieving social integration, and maintaining shared values. Each one corresponds to a family of theories.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 340&quot; role=&quot;img&quot; aria-label=&quot;Four groups of CSR theories&quot;&gt;
    &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Instrumental&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;80&quot;&gt;the firm as an instrument&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;98&quot;&gt;for wealth creation&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;135&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimension: profits&lt;/text&gt;
      &lt;rect x=&quot;310&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Political&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;80&quot;&gt;the power of the firm&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;98&quot;&gt;in society&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;135&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimension: political performance&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;215&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Integrative&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;240&quot;&gt;the firm integrates&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;258&quot;&gt;social demands&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;295&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimension: social demands&lt;/text&gt;
      &lt;rect x=&quot;310&quot; y=&quot;180&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;215&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Ethical&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;240&quot;&gt;the firm has moral&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;258&quot;&gt;obligations to society&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;295&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimension: ethical values&lt;/text&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;170&quot; r=&quot;34&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;166&quot; font-size=&quot;11&quot;&gt;business&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;180&quot; font-size=&quot;11&quot;&gt;↔ society&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;The four groups. The article&#x27;s conclusion: a theory is needed that integrates all four dimensions.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Instrumental&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Political&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Integrative&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ethical&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;CSR matters only if, and to the extent that, it helps create economic value. This is the &lt;b&gt;business case&lt;/b&gt; for CSR.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Maximizing shareholder value&lt;/b&gt; — Milton Friedman (1970): “the social responsibility of business is to increase its profits”, within the rules of the game.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Strategies for competitive advantage&lt;/b&gt; — social investments that improve the competitive context (Porter &amp;amp; Kramer), natural resources and dynamic capabilities, strategies for the &lt;i&gt;bottom of the pyramid&lt;/i&gt; (the markets of the poorest, Prahalad).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Cause-related marketing&lt;/b&gt; — linking a product to a social cause to increase sales and reputation.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The firm has &lt;b&gt;social power&lt;/b&gt;, and power entails responsibility.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Corporate constitutionalism&lt;/b&gt; — Keith Davis: the “iron law of responsibility”: those who do not use power responsibly will eventually lose it.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Integrative Social Contract Theory (ISCT)&lt;/b&gt; — Donaldson &amp;amp; Dunfee: there is a social contract between business and society, with universal norms (&lt;i&gt;hypernorms&lt;/i&gt;) and legitimate local norms.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Corporate citizenship&lt;/b&gt; — the firm as a citizen, with rights and duties (see the extended view, section 3).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The firm depends on society for its existence and growth, so it must detect and respond to social demands.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Issues management&lt;/b&gt; — identifying early the social issues that may affect the firm.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Principle of public responsibility&lt;/b&gt; — Preston &amp;amp; Post: law and public policy indicate what society expects.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Stakeholder management&lt;/b&gt; — balancing stakeholder interests (see Freeman).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Corporate Social Performance (CSP)&lt;/b&gt; — Carroll, Wood: measuring the principles, processes and outcomes of social responsibility.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Social responsibility is a &lt;b&gt;moral obligation&lt;/b&gt;, prior to any calculation of advantage.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Normative stakeholder theory&lt;/b&gt; — stakeholders have interests of intrinsic value (Freeman; Donaldson &amp;amp; Preston).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Universal rights&lt;/b&gt; — human and labour rights as the foundation (UN Global Compact, Universal Declaration of Human Rights).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Sustainable development&lt;/b&gt; — Brundtland Report (1987): meeting the needs of the present without compromising the ability of future generations to meet their own needs.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;The common good&lt;/b&gt; — the firm must contribute to the common good of the society it belongs to. This is the perspective favoured by Melé (see section 9).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Classify it yourself&lt;/h3&gt;
  &lt;p&gt;Which group does each statement belong to? Choose and check.&lt;/p&gt;
  &lt;div id=&quot;sorter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which group would you place Friedman&#x27;s position in, and why?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Instrumental: the only responsibility is to increase profits; any social activity is justified only as a means to that end.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Freeman appears in more than one group: how is that possible?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Stakeholder theory has a managerial version (stakeholder management, integrative) and a normative version (stakeholders have intrinsic value, ethical). Garriga &amp;amp; Melé classify approaches, not authors.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the main conclusion of the article?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Each family emphasizes one dimension (profits, political performance, social demands, ethical values); what is needed is a theory of the business-society relationship that integrates all four.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;normative&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;h2&gt;Normative ethical theories&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 3 (required). &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Normative ethical theories&lt;/b&gt; tell us &lt;i&gt;how one ought&lt;/i&gt; to decide: they offer criteria for judging right and wrong. Crane uses them as tools, not dogmas: each one sheds light on a different aspect of the problem.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;Tree of normative theories&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;260&quot; y=&quot;10&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;35&quot; font-size=&quot;14&quot;&gt;Normative theories&lt;/text&gt;
      &lt;g stroke=&quot;var(--soft)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M350 50 L120 90&quot;/&gt;&lt;path d=&quot;M350 50 L350 90&quot;/&gt;&lt;path d=&quot;M350 50 L580 90&quot;/&gt;&lt;path d=&quot;M120 130 L60 165&quot;/&gt;&lt;path d=&quot;M120 130 L180 165&quot;/&gt;&lt;path d=&quot;M350 130 L290 165&quot;/&gt;&lt;path d=&quot;M350 130 L410 165&quot;/&gt;&lt;path d=&quot;M580 130 L520 165&quot;/&gt;&lt;path d=&quot;M580 130 L640 165&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;30&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;108&quot;&gt;Consequentialist&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;outcomes matter&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;108&quot;&gt;Non-consequentialist&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;principles matter&lt;/text&gt;
      &lt;rect x=&quot;490&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;108&quot;&gt;Contemporary&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;character, relationships, dialogue&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;182&quot;&gt;Egoism&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;182&quot;&gt;Utilitarianism&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;182&quot;&gt;Duties (Kant)&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;182&quot;&gt;Rights &amp;amp; justice&lt;/text&gt;
      &lt;text x=&quot;520&quot; y=&quot;182&quot;&gt;Virtue · Care&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;182&quot;&gt;Discourse · Postmod.&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Kant&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights &amp;amp; justice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Others&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Ethical egoism&lt;/b&gt;: an action is right if it maximizes positive consequences &lt;i&gt;for the actor&lt;/i&gt;. It is the philosophical basis of the market economy (Adam Smith&#x27;s “invisible hand”). Limitation: it ignores others except when they serve one&#x27;s own interest; it does not resolve conflicts.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Utilitarianism&lt;/b&gt; (Bentham and Mill): an action is right if it produces &lt;i&gt;the greatest happiness for the greatest number&lt;/i&gt; of those affected. It amounts to a kind of moral cost-benefit analysis.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;right action = argmax Σ&lt;sub&gt;i&lt;/sub&gt; (benefits&lt;sub&gt;i&lt;/sub&gt; − harms&lt;sub&gt;i&lt;/sub&gt;) over all those affected&lt;/div&gt;
      &lt;p&gt;Distinctions: &lt;b&gt;act utilitarianism&lt;/b&gt; (each individual action is assessed) vs &lt;b&gt;rule utilitarianism&lt;/b&gt; (the rules that, if followed by everyone, produce the best outcome are assessed). Limitations: measuring and comparing happiness is difficult, and the aggregate can override the minority.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Ethics of duties&lt;/b&gt; (Immanuel Kant): an action is right if it follows a moral principle that is valid in itself, regardless of consequences. The test is the &lt;em class=&quot;t&quot;&gt;categorical imperative&lt;/em&gt;, in three maxims:&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;&lt;b&gt;Consistency&lt;/b&gt; — act only according to a rule that does not contradict itself.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Human dignity&lt;/b&gt; — always treat people as ends, never merely as means.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Universality&lt;/b&gt; — act as if your rule were to become a universal law.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Limitation: it is rigid; it does not say what to do when two duties conflict.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Rights&lt;/b&gt;: fundamental entitlements that people can claim against others (life, liberty, dignity), the basis of human rights. The problem is balancing conflicting rights.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Justice&lt;/b&gt;: the fair distribution of benefits and burdens. Two opposing views: &lt;b&gt;Rawls&lt;/b&gt; (justice as fairness: the rules we would choose behind a “veil of ignorance”, without knowing who we will be; inequalities are acceptable only if they improve the position of the least advantaged) and &lt;b&gt;Nozick&lt;/b&gt; (entitlement: what is just is whatever results from legitimate acquisitions and exchanges).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Virtue ethics&lt;/b&gt; (from Aristotle): the question is not “which rule?” but “what kind of person do I want to be?”. Right is what a person of good character would do: honesty, courage, prudence, justice. It is the basis of Melé&#x27;s perspective, which speaks of “human excellence” in organizations.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Feminist ethics / ethics of care&lt;/b&gt; — relationships, empathy and care at the centre, instead of abstract rules.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Discourse ethics&lt;/b&gt; (Habermas) — just norms emerge from a rational, inclusive dialogue among all those concerned: the basis of &lt;i&gt;stakeholder dialogue&lt;/i&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Postmodern ethics&lt;/b&gt; — scepticism towards universal theories; what matters is personal responsibility in the concrete situation, “feeling” the moral problem.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;Crane concludes with a &lt;b&gt;pluralistic and pragmatic&lt;/b&gt; approach: using several theories together as lenses for examining a case.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lab: should a plant be closed?&lt;/h3&gt;
  &lt;p&gt;A firm is considering closing a plant and relocating production. Move the sliders to estimate the effects (from −10 to +10) on each group: the utilitarian calculation adds everything up. The Kantian test does not change with the numbers.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;utilLab&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u1&quot;&gt;Shareholders (higher profits)&lt;/label&gt;&lt;input id=&quot;u1&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u2&quot;&gt;Laid-off employees&lt;/label&gt;&lt;input id=&quot;u2&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;-8&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u3&quot;&gt;Local community&lt;/label&gt;&lt;input id=&quot;u3&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;-4&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u4&quot;&gt;Customers (lower prices)&lt;/label&gt;&lt;input id=&quot;u4&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u5&quot;&gt;New workers abroad&lt;/label&gt;&lt;input id=&quot;u5&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;span id=&quot;utilBar&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;utilOut&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Kantian question (does not change with the sliders): does the firm inform employees in good time and honestly, or does it treat them merely as means? Utilitarianism looks at the sum, Kant at the manner.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the essential difference between consequentialist and non-consequentialist theories?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The former judge an action by its outcomes; the latter by the principles or duties it follows, irrespective of outcomes.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A company lies about the risks of a product because “the total benefit is greater”. Which Kantian maxim does it violate?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Above all human dignity (it uses customers merely as means) and universality (a rule of “lie when it pays” would make trust impossible).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does Rawls&#x27;s veil of ignorance ask us to do?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;To choose the rules of society without knowing which position we will occupy; what follows is equal liberties, and inequalities that are acceptable only if they benefit the least advantaged.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;decisioni&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;h2&gt;How decisions are actually made&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 4 (required). &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Descriptive ethical theories&lt;/b&gt; do not say what one ought to do, but &lt;i&gt;how&lt;/i&gt; people actually make decisions in organizations, and why “decent” people sometimes do wrong things.&lt;/p&gt;

  &lt;h3&gt;Rest&#x27;s four-step model&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Recognize moral issue&lt;/h4&gt;&lt;p&gt;Recognizing that the situation has a moral dimension. It seems trivial, but it is where things most often go wrong: if a problem is framed as “purely technical” or “purely commercial”, ethics never comes into play. What matters is &lt;b&gt;moral framing&lt;/b&gt;, the language used (“tax optimization” vs “tax evasion”).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Make moral judgement&lt;/h4&gt;&lt;p&gt;Assessing what is right. This is where normative theories (section 5) and the person&#x27;s stage of moral development (Kohlberg, below) come in.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Establish moral intent&lt;/h4&gt;&lt;p&gt;Deciding to act on the judgement. One can know what is right and not want to do it, for example because other goals (career, budget) weigh more heavily.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Engage in moral behaviour&lt;/h4&gt;&lt;p&gt;Actually acting. Pressure from the boss, the corporate culture or time constraints can drive a wedge between intention and behaviour.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;What influences the decision&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Individual factors&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;age and gender (weak and mixed effects)&lt;/li&gt;&lt;li&gt;national culture&lt;/li&gt;&lt;li&gt;education and experience&lt;/li&gt;&lt;li&gt;locus of control: believing that one controls events or is controlled by them&lt;/li&gt;&lt;li&gt;&lt;b&gt;cognitive moral development&lt;/b&gt; (Kohlberg)&lt;/li&gt;&lt;li&gt;personal integrity and moral imagination&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Situational factors&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;issue-related&lt;/b&gt;: moral intensity, moral framing&lt;/li&gt;&lt;li&gt;&lt;b&gt;context-related&lt;/b&gt;: reward systems, authority, bureaucracy, work roles, group and organizational norms and culture, national context&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;Crane stresses that situational factors often weigh more than individual ones.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Kohlberg: three levels of moral development&lt;/h3&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Kohlberg&#x27;s scale&quot;&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;150&quot; width=&quot;200&quot; height=&quot;60&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Pre-conventional&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;punishment and reward&lt;/text&gt;
      &lt;rect x=&quot;220&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;120&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Conventional&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot;&gt;group expectations,&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;rules and laws&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;180&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Post-conventional&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;universal principles,&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;even against norms&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Each level has two stages (six in total). Most adults reason at the conventional level: this is why corporate culture matters so much.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;h3&gt;Moral intensity: how much an issue “weighs”&lt;/h3&gt;
  &lt;p&gt;According to Jones (1991), the likelihood of recognizing an issue as moral increases with its &lt;em class=&quot;t&quot;&gt;moral intensity&lt;/em&gt;, which has six components. Move the sliders.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;miLab&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m1&quot;&gt;Magnitude of consequences&lt;/label&gt;&lt;input id=&quot;m1&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m2&quot;&gt;Social consensus&lt;/label&gt;&lt;input id=&quot;m2&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m3&quot;&gt;Probability of effect&lt;/label&gt;&lt;input id=&quot;m3&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m4&quot;&gt;Temporal immediacy&lt;/label&gt;&lt;input id=&quot;m4&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m5&quot;&gt;Proximity&lt;/label&gt;&lt;input id=&quot;m5&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m6&quot;&gt;Concentration of effect&lt;/label&gt;&lt;input id=&quot;m6&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;span id=&quot;miBar&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;miOut&quot;&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;What each component means&lt;/summary&gt;&lt;div&gt;
      &lt;b&gt;Magnitude&lt;/b&gt;: how large the harm or benefit is. &lt;b&gt;Social consensus&lt;/b&gt;: how far society agrees that it is wrong. &lt;b&gt;Probability&lt;/b&gt;: how likely the effect is to occur. &lt;b&gt;Temporal immediacy&lt;/b&gt;: how soon it occurs. &lt;b&gt;Proximity&lt;/b&gt;: how close we feel to those affected. &lt;b&gt;Concentration&lt;/b&gt;: how far the effect is concentrated on a few people.&lt;br&gt;&lt;span class=&quot;note&quot;&gt;The score here is only an illustrative average, not a formula from Jones.&lt;/span&gt;
    &lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;p&gt;Connection: in long supply chains, &lt;b&gt;proximity&lt;/b&gt; and &lt;b&gt;temporal immediacy&lt;/b&gt; are low (the victims are far away), and perceived intensity drops. This is one of the reasons why &lt;a href=&quot;#reti&quot;&gt;Phillips&lt;/a&gt; studies networks.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;At which step of Rest&#x27;s model does moral framing mainly operate?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;At the first, recognition: the language used to frame the problem determines whether it is seen as moral.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does it matter to a firm that most people are at the conventional level?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because at that level people follow what the group and authority expect: the organization&#x27;s culture and rules strongly shape behaviour, for better or worse.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Name two context-related situational factors.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;For example: reward systems (bonuses tied only to results), authority (pressure from superiors), bureaucracy, work roles, organizational culture, national context.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;strumenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;h2&gt;Managing ethics: tools and techniques&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 5 (required). &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Business ethics management&lt;/b&gt; is the direct attempt, formal or informal, to manage ethical issues through policies, practices and programmes. Crane presents it as a set of mutually reinforcing tools.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Components of business ethics management&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;80&quot;&gt;Mission and&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;96&quot;&gt;value statements&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;80&quot;&gt;Codes of&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;96&quot;&gt;ethics&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;80&quot;&gt;Ethics programmes&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;96&quot;&gt;and training&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;80&quot;&gt;Stakeholder&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;96&quot;&gt;engagement&lt;/text&gt;
      &lt;rect x=&quot;570&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;80&quot;&gt;Accounting,&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;96&quot;&gt;auditing, reporting&lt;/text&gt;
      &lt;path d=&quot;M70 130 Q350 175 630 130&quot; fill=&quot;none&quot; stroke=&quot;var(--soft)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;30&quot; fill=&quot;var(--soft)&quot;&gt;from stating values to verifying outcomes&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;details open&gt;&lt;summary&gt;Codes of ethics&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Written statements of the norms and values that the organization expects of its members. Four types:&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Adopted by&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Organizational / corporate code&lt;/td&gt;&lt;td&gt;a single firm&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Professional code&lt;/td&gt;&lt;td&gt;a profession (doctors, accountants, engineers)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Industry code&lt;/td&gt;&lt;td&gt;a sector (e.g. textiles, chemicals)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Programme / group code&lt;/td&gt;&lt;td&gt;firms that sign up to a common initiative (e.g. UN Global Compact)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Pros: clarity, a signal to the outside world. Cons: they may remain mere &lt;i&gt;window dressing&lt;/i&gt; if not backed by consistent training, controls and incentives.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Ethics programmes and dedicated roles&lt;/summary&gt;&lt;div&gt;Training, ethics officers, reporting hotlines (whistleblowing), ethics committees. A purely &lt;b&gt;compliance&lt;/b&gt;-based approach (rule-following, monitoring and sanctions) works less well than one based on &lt;b&gt;integrity&lt;/b&gt; (shared values, personal responsibility).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Stakeholder engagement&lt;/summary&gt;&lt;div&gt;Involving stakeholders in decisions, from simple listening to collaboration and partnership. It is the practical translation of discourse ethics and of Freeman&#x27;s managing for stakeholders.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Social and ethical accounting, auditing and reporting (SEAAR)&lt;/summary&gt;&lt;div&gt;Measuring, verifying and communicating the firm&#x27;s social, ethical and environmental impact: sustainability reports, third-party verification. The required qualities include inclusivity, comprehensiveness, comparability, external verification and continuity.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Organizational culture&lt;/summary&gt;&lt;div&gt;No formal tool works against the real culture: values, informal norms, the example set by leaders. Crane distinguishes between “espoused” culture and lived culture.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why might a code of ethics on its own not be enough?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because without training, reporting systems, consistent incentives and a culture that supports it, it remains window dressing; situational factors (section 6) weigh more than the written text.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between a compliance approach and an integrity approach?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Compliance: rules, controls and sanctions to prevent violations. Integrity: shared values and personal responsibility, to guide choices even where rules do not reach.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;persone&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;h2&gt;Employees, suppliers and competitors&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., ch. 7 (employees) and ch. 9 (suppliers, competitors), both required. Ch. 6 (shareholders) and ch. 8 (consumers) are not on the syllabus. &lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;These chapters apply the general tools to two concrete stakeholder groups. The recurring scheme is: &lt;b&gt;which rights and duties&lt;/b&gt; exist in the relationship, and how they change under globalization.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Employees: rights&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Employees: duties&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Suppliers&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Competitors&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Right&lt;/th&gt;&lt;th&gt;Typical issues&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Principle of non-discrimination&lt;/td&gt;&lt;td&gt;equal opportunities, diversity management, affirmative action&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Privacy&lt;/td&gt;&lt;td&gt;email monitoring, testing, personal data&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Due process&lt;/td&gt;&lt;td&gt;fair procedures in dismissals and disciplinary action&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Participation and association&lt;/td&gt;&lt;td&gt;trade unions, involvement in decision-making&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Healthy and safe working conditions&lt;/td&gt;&lt;td&gt;safety, stress, working hours&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fair wages&lt;/td&gt;&lt;td&gt;fair pay, living wage&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Freedom of conscience and speech&lt;/td&gt;&lt;td&gt;whistleblowing&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Right to work&lt;/td&gt;&lt;td&gt;access to work, precarious employment&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Employees also have &lt;b&gt;duties&lt;/b&gt;: loyalty, honesty, not using company resources for personal ends, avoiding conflicts of interest. The most delicate case is &lt;em class=&quot;t&quot;&gt;whistleblowing&lt;/em&gt; (reporting wrongdoing): loyalty to the firm and duty to the public may conflict. Other topics: work-life balance, the firm “intruding” into employees&#x27; private lives.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;The relationship with suppliers is shaped by &lt;b&gt;power&lt;/b&gt;: large buyers can impose prices and deadlines. Issues:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;abuse of power, loyalty and long-term partnerships&lt;/li&gt;&lt;li&gt;conflicts of interest, gifts and &lt;b&gt;bribery&lt;/b&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;global supply chains&lt;/b&gt;: sweatshops, child labour, safety&lt;/li&gt;&lt;li&gt;&lt;b&gt;ethical sourcing&lt;/b&gt; and &lt;b&gt;fair trade&lt;/b&gt;: extending ethical standards along the chain&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;Key question: how far does the lead firm&#x27;s responsibility extend to its suppliers&#x27; suppliers? This is exactly the theme of &lt;a href=&quot;#reti&quot;&gt;Phillips&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Ethical limits exist between competitors too:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;b&gt;Intensity of competition&lt;/b&gt; and “dirty tricks” (industrial espionage, smear campaigns)&lt;/li&gt;&lt;li&gt;&lt;b&gt;Competitive intelligence&lt;/b&gt;: gathering information on competitors, by legitimate means or not&lt;/li&gt;&lt;li&gt;&lt;b&gt;Anti-competitive behaviour&lt;/b&gt;: cartels, price fixing, predatory pricing (pricing below cost to eliminate rivals), abuse of a dominant position&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;Paradox: competition benefits society, but unrestrained competition can harm it. Sometimes competitors cooperate to raise industry standards (industry codes, section 7).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is whistleblowing an ethical dilemma?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It sets the duty of loyalty to the employer against freedom of conscience or the duty towards third parties harmed by the wrongdoing.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What makes ethical issues with suppliers particularly difficult in the age of globalization?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Chains are long and cross countries with different rules; the lead firm has commercial power but little visibility and direct control over the distant tiers.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;scopo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
  &lt;h2&gt;The purpose of the firm and value creation&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Wicks et al., ch. 3 (recommended) · Melé, ch. 7 (recommended). &lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; chapter titles from the &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson catalogue&lt;/a&gt; and the &lt;a href=&quot;https://www.kriso.ee/business-ethics-action-seeking-human-excellence-db-9780230573109.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;table of contents of the 2009 edition (Kriso)&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Wicks et al., ch. 3&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; Title: “Ethics, Stakeholders, Corporate Strategy, and Value Creation”, with the &lt;b&gt;Merck &amp;amp; Co., Inc.&lt;/b&gt; case.&lt;/p&gt;
      &lt;p&gt;The book is written by Wicks, &lt;b&gt;Freeman&lt;/b&gt;, Werhane and Martin: the chapter takes the stakeholder theory of section 3 in a managerial direction. The idea: ethics is not a constraint external to strategy, but part of the way the firm creates value.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; The Merck case often used in business ethics courses concerns the decision to develop and donate Mectizan against river blindness (onchocerciasis), a disease of poor countries with no profitable market. Check in the book which aspect of the case is discussed.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Melé, ch. 7&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; In the table of contents of the 2009 edition, the seventh title is “The purpose of the firm and mission-driven management”. The numbering is inferred from the order of titles in the catalogue: check it in the book.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Background explanation&lt;/span&gt; Melé proposes a humanistic view: the firm as a &lt;b&gt;community of persons&lt;/b&gt;, with a purpose that goes beyond profit (serving society and contributing to the &lt;b&gt;common good&lt;/b&gt;), and mission-driven management. Profit remains necessary, but as a condition and a measure, not as the ultimate end.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Three answers to the question “what is a firm for?”&lt;/h3&gt;
  &lt;p&gt;Drag the slider to move between the positions.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;purposeLab&quot;&gt;
    &lt;input type=&quot;range&quot; id=&quot;pp&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;1&quot; value=&quot;0&quot; aria-label=&quot;Position on the purpose of the firm&quot;&gt;
    &lt;div style=&quot;display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft)&quot;&gt;&lt;span&gt;Shareholder view&lt;/span&gt;&lt;span&gt;Stakeholder view&lt;/span&gt;&lt;span&gt;Humanistic view&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;ppOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What do Wicks&#x27;s ch. 3 and Freeman&#x27;s paper have in common?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Freeman co-authored both; both link ethics, stakeholders and strategy in value creation, against the separation fallacy.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In which of Garriga &amp;amp; Melé&#x27;s groups would you place Melé&#x27;s humanistic view?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Ethical, under the common good theory.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;reti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;
  &lt;h2&gt;Responsibility beyond causation: networks and social connection&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Phillips, “Ethics and Network Organizations”, &lt;i&gt;Business Ethics Quarterly&lt;/i&gt;, 2010 · Schrempf, “A Social Connection Approach to Corporate Responsibility”, &lt;i&gt;Business &amp;amp; Society&lt;/i&gt;, 2014 (both required). &lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; content from the abstracts (links in Further reading).&lt;/p&gt;
  &lt;p&gt;The two readings tackle the same problem from different angles: &lt;b&gt;who is responsible&lt;/b&gt; when harm arises from many actors, none of whom causes it alone?&lt;/p&gt;

  &lt;h3&gt;Phillips: network organizations&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;External source&lt;/span&gt; According to the abstract (&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v20y2010i03p533-543_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;), outsourcing and subcontracting make it harder to attribute responsibility. Phillips uses &lt;b&gt;social network analysis&lt;/b&gt; to understand how responsibility is distributed among actors and how they can plausibly deny their involvement. He identifies three sources of defence:&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Connection&lt;/h4&gt;&lt;p&gt;“It has nothing to do with me: I have no ties to whoever caused the harm.” The further away the actor is in the network, the more credible the defence.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Control&lt;/h4&gt;&lt;p&gt;“There was nothing I could do: I do not control that supplier.”&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Knowledge&lt;/h4&gt;&lt;p&gt;“I did not know.”&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Two network concepts: &lt;b&gt;density&lt;/b&gt; (how many ties exist relative to all possible ties) and &lt;b&gt;centrality&lt;/b&gt; (how connected an actor is). The &lt;em class=&quot;t&quot;&gt;tertius illuminans&lt;/em&gt; (“the third who illuminates”) is a third party, such as an NGO, a journalist or a certification body, that makes ties visible: it increases density and centrality and thus weakens the connection and knowledge defences.&lt;/p&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;align-items:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;tiBtn&quot;&gt;Add the tertius illuminans&lt;/button&gt;&lt;span class=&quot;note&quot; id=&quot;netStats&quot;&gt;&lt;/span&gt;&lt;/div&gt;
