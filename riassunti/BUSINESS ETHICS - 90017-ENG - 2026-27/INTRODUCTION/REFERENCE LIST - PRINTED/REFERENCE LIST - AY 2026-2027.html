        &lt;line x1=&quot;80&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;80&quot; y1=&quot;160&quot; x2=&quot;250&quot; y2=&quot;230&quot;/&gt;
        &lt;line x1=&quot;250&quot; y1=&quot;90&quot; x2=&quot;420&quot; y2=&quot;50&quot;/&gt;&lt;line x1=&quot;250&quot; y1=&quot;90&quot; x2=&quot;420&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;250&quot; y1=&quot;230&quot; x2=&quot;420&quot; y2=&quot;270&quot;/&gt;
        &lt;line x1=&quot;420&quot; y1=&quot;50&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;160&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;420&quot; y1=&quot;270&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;
      &lt;/g&gt;
      &lt;g id=&quot;tiEdges&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 4&quot; style=&quot;display:none&quot;&gt;
        &lt;line x1=&quot;590&quot; y1=&quot;290&quot; x2=&quot;590&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;590&quot; y1=&quot;290&quot; x2=&quot;80&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;590&quot; y1=&quot;290&quot; x2=&quot;420&quot; y2=&quot;270&quot;/&gt;&lt;line x1=&quot;80&quot; y1=&quot;160&quot; x2=&quot;420&quot; y2=&quot;160&quot;/&gt;

        &lt;circle cx=&quot;80&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;157&quot;&gt;Brand&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;172&quot; font-size=&quot;10&quot;&gt;capofila&lt;/text&gt;
        &lt;circle cx=&quot;250&quot; cy=&quot;90&quot; r=&quot;26&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;94&quot;&gt;Tier 1&lt;/text&gt;

        &lt;circle cx=&quot;420&quot; cy=&quot;50&quot; r=&quot;24&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;54&quot;&gt;Tier 2&lt;/text&gt;

        &lt;circle cx=&quot;420&quot; cy=&quot;270&quot; r=&quot;24&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;274&quot;&gt;Tier 2&lt;/text&gt;

        &lt;g id=&quot;tiNode&quot; style=&quot;display:none&quot;&gt;&lt;rect x=&quot;540&quot; y=&quot;276&quot; width=&quot;100&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;590&quot; y=&quot;295&quot;&gt;ONG / media&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;netOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Schrempf: dalla liability alla social connection&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Secondo la sintesi di &lt;a href=&quot;https://socialsciencespace.com/2014/04/is-it-unfair-to-blame-fast-food-corporations-for-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business and Management INK&lt;/a&gt;, l&#x27;articolo sostiene che l&#x27;obesità è un problema diverso dalla classica responsabilità da prodotto, e attribuisce responsabilità alle catene di fast-food &lt;b&gt;per la loro connessione&lt;/b&gt; al problema, non per averlo causato direttamente. Il modello di riferimento è il &lt;em class=&quot;t&quot;&gt;social connection model&lt;/em&gt; della filosofa Iris Marion Young.&lt;/p&gt;
  &lt;p&gt;Premi il pulsante per confrontare i due modelli.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; data-model=&quot;liab&quot;&gt;Liability model&lt;/button&gt;&lt;button class=&quot;btn&quot; data-model=&quot;soc&quot;&gt;Social connection model&lt;/button&gt;&lt;/div&gt;
    &lt;div id=&quot;modelOut&quot; class=&quot;panel&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;I parametri per ragionare sulla responsabilità (Young)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; Young suggerisce di graduare la responsabilità condivisa secondo quattro parametri. Applicati alle catene di fast-food:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;&lt;b&gt;Power&lt;/b&gt; — capacità di influenzare il processo: menu, porzioni, prezzi, marketing verso i bambini.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Privilege&lt;/b&gt; — beneficio tratto dalla struttura: i profitti delle vendite.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Interest&lt;/b&gt; — interesse a cambiare la struttura: reputazione, rischi regolatori.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Collective ability&lt;/b&gt; — capacità di agire insieme ad altri: accordi di settore, collaborazione con scuole e governi.&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Verifica sull&#x27;articolo come Schrempf usa questi parametri: l&#x27;abstract non li elenca.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Il filo comune&lt;/h3&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 680 150&quot; role=&quot;img&quot; aria-label=&quot;Collegamento tra Phillips e Schrempf&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;70&quot;&gt;Phillips: la rete&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;diluisce la responsabilità&lt;/text&gt;
      &lt;rect x=&quot;240&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;70&quot;&gt;Problema comune:&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;danno senza un colpevole unico&lt;/text&gt;
      &lt;rect x=&quot;470&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot;&gt;Schrempf: la connessione&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;88&quot; fill=&quot;var(--soft)&quot;&gt;fonda la responsabilità&lt;/text&gt;
      &lt;path d=&quot;M210 75 L240 75&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M470 75 L440 75&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quali sono le tre difese contro l&#x27;attribuzione di responsabilità individuate da Phillips?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Connection, control e knowledge.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che ruolo ha il tertius illuminans?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;È un terzo (ONG, media, certificatori) che rende visibili i legami nella rete: aumenta densità e centralità, così è più difficile per un attore negare connessione e conoscenza.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché nel caso dell&#x27;obesità il liability model funziona male?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché l&#x27;obesità nasce da molte cause e attori (dieta, stile di vita, marketing, politiche): non si può isolare un singolo colpevole né provare la causalità diretta. Il social connection model attribuisce invece una responsabilità condivisa e rivolta al futuro a chi partecipa al processo.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Collega Phillips alla moral intensity di Jones.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Nelle reti lunghe proximity e temporal immediacy sono basse, quindi la questione appare meno intensa e viene riconosciuta meno spesso come morale; il tertius illuminans la rende di nuovo vicina e visibile.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le schede seguono i 7 testi della reference list, più una lettura collegata. I dati bibliografici in grigio vengono dal PDF; tutto ciò che è marcato &lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; viene dalla ricerca web, con il link.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Crane, Matten, Glozer, Spence — &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Oxford University Press, Oxford 2019, 5ª ed., ISBN 978-0-19-881007-0. Lettura obbligatoria, cap. 1-5, 7, 9.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Pubblicato da OUP l&#x27;11 luglio 2019; autori Andrew Crane, Dirk Matten, Sarah Glozer, Laura Spence (&lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Australia&lt;/a&gt;). Secondo un indice dei capitoli (fonte non ufficiale) gli 11 capitoli sono: 1 Introducing business ethics; 2 Framing business ethics (CR, stakeholders, citizenship); 3 Normative ethical theories; 4 Descriptive ethical theories; 5 Tools and techniques; 6 Shareholders; 7 Employees; 8 Consumers; 9 Suppliers, competitors; 10 Civil society; 11 Government and regulation. Verifica i titoli sul libro.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il manuale di base del corso. Organizza la materia per stakeholder, per cui i capitoli 7 e 9 applicano teorie e strumenti dei capitoli 1-5.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;R. Edward Freeman — &lt;i&gt;Managing for Stakeholders&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: documento, non in biblioteca, disponibile su Moodle. Lettura obbligatoria.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Esiste un working paper con questo titolo su SSRN (DOI 10.2139/ssrn.1186402), versione originale datata gennaio 2007 (&lt;a href=&quot;https://econbiz.de/Record/managing-for-stakeholders-freeman-edward/10012708824&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconBiz&lt;/a&gt;). Lo stesso titolo è un libro del 2007 di Freeman, Harrison e Wicks, &lt;i&gt;Managing for Stakeholders: Survival, Reputation, and Success&lt;/i&gt; (Yale University Press), che propone principi e tecniche per gestire le relazioni con gli stakeholder (&lt;a href=&quot;https://www.goodreads.com/book/show/2178015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Goodreads&lt;/a&gt;). Freeman insegna alla Darden School of Business, University of Virginia (&lt;a href=&quot;https://phdplus.virginia.edu/people/r-edward-freeman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UVA&lt;/a&gt;). Usa la versione su Moodle: è quella che conta per il corso.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; Freeman è il padre della stakeholder theory (&lt;i&gt;Strategic Management: A Stakeholder Approach&lt;/i&gt;, 1984). Questo testo ne dà la formulazione matura.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Elisabet Garriga, Domènec Melé — «Corporate Social Responsibility Theories: Mapping the Territory»&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53(1/2), 2004, pp. 51-71, DOI 10.1023/b:busi.0000039399.90587.34. Lettura obbligatoria.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Classifica le teorie CSR in quattro gruppi (instrumental, political, integrative, ethical), corrispondenti a quattro dimensioni (profitti, performance politica, domande sociali, valori etici), e conclude che serve una teoria che le integri (&lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;; scheda &lt;a href=&quot;https://philpapers.org/rec/GARCSR&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers&lt;/a&gt;; testo sul sito dell&#x27;editore tramite &lt;a href=&quot;https://doi.org/10.1023/B:BUSI.0000039399.90587.34&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è una delle rassegne più citate sulla CSR; fa da mappa per collocare tutte le altre letture.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Judith Schrempf(-Stirling) — «A Social Connection Approach to Corporate Responsibility: The Case of the Fast-Food Industry and Obesity»&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Business &amp;amp; Society&lt;/i&gt; 53(2), 2014, pp. 300-332, Sage. Lettura obbligatoria, peer-reviewed.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; DOI 10.1177/0007650312449577. L&#x27;articolo propone il concetto di social connection corporate responsibility come alternativa alla responsabilità da prodotto e lo applica al rapporto tra catene di fast-food e obesità (&lt;a href=&quot;https://socialsciencespace.com/2014/04/is-it-unfair-to-blame-fast-food-corporations-for-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business and Management INK&lt;/a&gt;; &lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/27&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Richmond&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; porta nella CSR un modello di responsabilità condivisa e rivolta al futuro, utile per problemi strutturali come salute pubblica, clima, supply chain.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Robert A. Phillips — «Ethics and Network Organizations» (2009 SBE Presidential Address)&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: &lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 20(3), 2010, pp. 533-543, Society for Business Ethics. Lettura obbligatoria.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Usa la social network analysis per studiare come la responsabilità si distribuisce nelle reti di outsourcing; individua tre difese (connection, control, knowledge) e il ruolo del tertius illuminans su densità e centralità (&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v20y2010i03p533-543_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;; &lt;a href=&quot;https://resolve.cambridge.org/core/journals/business-ethics-quarterly/article/ethics-and-network-organizations/AA6337DD77AB7DCB87818F9453571F96&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge University Press&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il discorso presidenziale della principale società scientifica del settore; apre il tema della responsabilità nelle catene globali.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Andrew C. Wicks, R. Edward Freeman, Patricia H. Werhane, Kirsten E. Martin — &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Pearson, Boston c2010, ISBN 978-0-13-142792-1. Lettura consigliata, solo cap. 3.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; 1ª edizione, Pearson. Il cap. 3 è «Ethics, Stakeholders, Corporate Strategy, and Value Creation», con il caso Merck &amp;amp; Co., Inc., nella parte I «Ethics and Business» (&lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pearson&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; traduce la stakeholder theory in strumenti per manager, con casi.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Domènec Melé — &lt;i&gt;Business Ethics in Action: Seeking Human Excellence in Organizations&lt;/i&gt;&lt;/h4&gt;
      &lt;p class=&quot;bib&quot;&gt;Reference list: Palgrave Macmillan, Basingstoke 2009, ISBN 978-0-230-57310-9. Lettura consigliata, solo cap. 7.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Melé insegna alla IESE Business School. Nell&#x27;indice dell&#x27;edizione 2009 il settimo titolo è «The purpose of the firm and mission-driven management» (&lt;a href=&quot;https://www.kriso.ee/business-ethics-action-seeking-human-excellence-db-9780230573109.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kriso&lt;/a&gt;; vedi anche &lt;a href=&quot;https://philpapers.org/rec/MELBEI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PhilPapers&lt;/a&gt; e &lt;a href=&quot;https://www.iese.edu/insight/articles/profit-with-principles/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;). Le edizioni successive hanno un sottotitolo diverso («Managing Human Excellence in Organizations») e una numerazione che può cambiare.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà la prospettiva umanistica (virtù, bene comune) che completa l&#x27;approccio stakeholder.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;
      &lt;h4&gt;Lettura collegata (non nella reference list): Iris Marion Young — «Responsibility and Global Justice: A Social Connection Model»&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; &lt;i&gt;Social Philosophy and Policy&lt;/i&gt; 23(1), 2006, pp. 102-130; sviluppato nel libro postumo &lt;i&gt;Responsibility for Justice&lt;/i&gt; (Oxford University Press, 2011). Propone una responsabilità rivolta al futuro per chi partecipa ai processi strutturali che producono ingiustizia; esempio centrale: gli sweatshop (&lt;a href=&quot;https://academic.oup.com/book/4381&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Academic&lt;/a&gt;; &lt;a href=&quot;https://en.wikipedia.org/wiki/Iris_Marion_Young&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la base teorica del social connection model applicato da Schrempf.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // linguette
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;.tabbar button&#x27;),pans=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;)});
      pans.forEach(function(p,j){p.hidden=j!==i});
    })});
  });
  // risposte da scoprire
  document.querySelectorAll(&#x27;.reveal&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    var a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?&#x27;Mostra risposta&#x27;:&#x27;Nascondi risposta&#x27;;
  })});
  // passi da scorrere
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),i=0,prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),dots=s.querySelector(&#x27;.dots&#x27;);
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){steps.forEach(function(x,j){x.hidden=j!==i});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j===i?&#x27;on&#x27;:&#x27;&#x27;});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });
  // pannelli informativi da elementi SVG cliccabili
  document.querySelectorAll(&#x27;[data-info]&#x27;).forEach(function(el){
    function go(){var p=document.getElementById(el.getAttribute(&#x27;data-target&#x27;));if(p)p.innerHTML=el.getAttribute(&#x27;data-info&#x27;);}
    el.addEventListener(&#x27;click&#x27;,go);
    el.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go()}});
  });
  // evidenzia la sezione corrente nell&#x27;indice
  var links=document.querySelectorAll(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle(&#x27;on&#x27;,l.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)})}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}

  // mappa stakeholder: visione shareholder vs stakeholder
  var shOnly=false;
  $(&#x27;stkToggle&#x27;).addEventListener(&#x27;click&#x27;,function(){
    shOnly=!shOnly;
    document.querySelectorAll(&#x27;#stkmap .prim-n, #stkmap .sec-n, #stkSec&#x27;).forEach(function(n){n.style.opacity=shOnly?.12:1});
    document.querySelectorAll(&#x27;#stkmap line.prim&#x27;).forEach(function(l,i){if(i&gt;0)l.style.opacity=shOnly?.1:1});
    this.textContent=shOnly?&#x27;Mostra la visione stakeholder&#x27;:&#x27;Mostra solo la visione shareholder&#x27;;
    $(&#x27;stkp&#x27;).innerHTML=shOnly?&#x27;&lt;b&gt;Shareholder view.&lt;/b&gt; L\&#x27;impresa risponde solo agli azionisti; gli altri gruppi sono vincoli o strumenti (Friedman).&#x27;:&#x27;&lt;b&gt;Stakeholder view.&lt;/b&gt; L\&#x27;impresa crea valore per e con tutti i gruppi che influenza o da cui è influenzata (Freeman).&#x27;;
  });

  // classifica le affermazioni (Garriga &amp; Melé)
  var items=[
    [&#x27;Doniamo a una causa sociale perché aumenta le vendite del prodotto.&#x27;,&#x27;Instrumental&#x27;],
    [&#x27;Chi ha potere sociale e non lo usa responsabilmente finisce per perderlo.&#x27;,&#x27;Political&#x27;],
    [&#x27;Monitoriamo le questioni emergenti nella società per rispondere in tempo.&#x27;,&#x27;Integrative&#x27;],
    [&#x27;Rispettiamo i diritti umani anche quando non conviene economicamente.&#x27;,&#x27;Ethical&#x27;],
    [&#x27;L\&#x27;unica responsabilità sociale è aumentare i profitti nel rispetto delle regole.&#x27;,&#x27;Instrumental&#x27;],
    [&#x27;L\&#x27;impresa deve contribuire al bene comune della comunità.&#x27;,&#x27;Ethical&#x27;]
  ];
  var groups=[&#x27;Instrumental&#x27;,&#x27;Political&#x27;,&#x27;Integrative&#x27;,&#x27;Ethical&#x27;],sorter=$(&#x27;sorter&#x27;);
  items.forEach(function(it){
    var d=document.createElement(&#x27;div&#x27;);d.className=&#x27;q&#x27;;
    var p=document.createElement(&#x27;p&#x27;);p.textContent=&#x27;«&#x27;+it[0]+&#x27;»&#x27;;d.appendChild(p);
    var row=document.createElement(&#x27;div&#x27;);row.style.cssText=&#x27;display:flex;flex-wrap:wrap;gap:6px&#x27;;
    var fb=document.createElement(&#x27;div&#x27;);fb.className=&#x27;note&#x27;;fb.style.marginTop=&#x27;6px&#x27;;
    groups.forEach(function(g){
      var b=document.createElement(&#x27;button&#x27;);b.className=&#x27;btn&#x27;;b.textContent=g;
      b.addEventListener(&#x27;click&#x27;,function(){
        row.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});b.classList.add(&#x27;on&#x27;);
        fb.textContent=g===it[1]?&#x27;✓ Giusto: &#x27;+it[1]+&#x27;.&#x27;:&#x27;✗ Non proprio: è &#x27;+it[1]+&#x27;.&#x27;;
      });row.appendChild(b);
    });
    d.appendChild(row);d.appendChild(fb);sorter.appendChild(d);
  });

  // laboratorio utilitarista
  function util(){
    var s=0;
    for(var i=1;i&lt;=5;i++){var v=+$(&#x27;u&#x27;+i).value;s+=v;$(&#x27;u&#x27;+i).nextElementSibling.textContent=(v&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+v;}
    $(&#x27;utilBar&#x27;).style.width=((s+50)/100*100)+&#x27;%&#x27;;
    $(&#x27;utilOut&#x27;).innerHTML=&#x27;Somma delle utilità: &lt;b&gt;&#x27;+(s&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+s+&#x27;&lt;/b&gt;. &#x27;+(s&gt;0?&#x27;Per l\&#x27;utilitarismo la chiusura è giustificata: i benefici totali superano i danni.&#x27;:s&lt;0?&#x27;Per l\&#x27;utilitarismo la chiusura non è giustificata: i danni totali superano i benefici.&#x27;:&#x27;Pareggio: l\&#x27;utilitarismo da solo non decide.&#x27;)+&#x27; &lt;span class=&quot;note&quot;&gt;Nota il limite: chi pesa quanto, e chi decide i numeri?&lt;/span&gt;&#x27;;
  }
  for(var i=1;i&lt;=5;i++)$(&#x27;u&#x27;+i).addEventListener(&#x27;input&#x27;,util);util();

  // moral intensity
  function mi(){
    var s=0;
    for(var i=1;i&lt;=6;i++){var v=+$(&#x27;m&#x27;+i).value;s+=v;$(&#x27;m&#x27;+i).nextElementSibling.textContent=v;}
    var avg=s/6;$(&#x27;miBar&#x27;).style.width=(avg*10)+&#x27;%&#x27;;
    $(&#x27;miOut&#x27;).textContent=avg&gt;=7?&#x27;Intensità alta: è molto probabile che la questione venga riconosciuta come morale.&#x27;:avg&gt;=4?&#x27;Intensità media: dipende dal framing e dal contesto organizzativo.&#x27;:&#x27;Intensità bassa: rischio alto che nessuno la veda come questione morale.&#x27;;
  }
  for(var j=1;j&lt;=6;j++)$(&#x27;m&#x27;+j).addEventListener(&#x27;input&#x27;,mi);mi();

  // scopo dell&#x27;impresa
  var pp=[
    &#x27;&lt;b&gt;Shareholder view&lt;/b&gt; (Friedman): l\&#x27;impresa serve a massimizzare il valore per gli azionisti, nel rispetto della legge e delle regole del gioco. Il resto spetta a governi e individui.&#x27;,
    &#x27;&lt;b&gt;Stakeholder view&lt;/b&gt; (Freeman, Wicks): l\&#x27;impresa serve a creare valore per tutti gli stakeholder; il profitto è un risultato di questa creazione, non il suo unico scopo.&#x27;,
    &#x27;&lt;b&gt;Humanistic view&lt;/b&gt; (Melé): l\&#x27;impresa è una comunità di persone che serve la società e contribuisce al bene comune; profitto e valore per gli stakeholder sono mezzi e condizioni di uno scopo più ampio.&#x27;
  ];
  function ppu(){$(&#x27;ppOut&#x27;).innerHTML=pp[+$(&#x27;pp&#x27;).value]}
  $(&#x27;pp&#x27;).addEventListener(&#x27;input&#x27;,ppu);ppu();

  // rete di Phillips
  var ti=false;
  function net(){
    $(&#x27;tiEdges&#x27;).style.display=ti?&#x27;&#x27;:&#x27;none&#x27;;$(&#x27;tiNode&#x27;).style.display=ti?&#x27;&#x27;:&#x27;none&#x27;;
    var n=ti?8:7,e=ti?12:8,d=e/(n*(n-1)/2);
    $(&#x27;netStats&#x27;).textContent=&#x27;Nodi &#x27;+n+&#x27; · legami &#x27;+e+&#x27; · density &#x27;+d.toFixed(2)+&#x27; · legami del brand &#x27;+(ti?4:2);
    $(&#x27;netOut&#x27;).innerHTML=ti?&#x27;Il terzo rende visibili i legami: il brand è ora collegato direttamente al Tier 2 e ai lavoratori tramite chi li osserva. Le difese di &lt;b&gt;connection&lt;/b&gt; («non c\&#x27;entro») e &lt;b&gt;knowledge&lt;/b&gt; («non lo sapevo») diventano poco credibili; resta da discutere il &lt;b&gt;control&lt;/b&gt;.&#x27;:&#x27;Senza il terzo, il brand ha solo due legami diretti e i lavoratori sono a due passi di distanza: può dire in modo plausibile di non essere connesso al danno e di non saperne nulla.&#x27;;
    $(&#x27;tiBtn&#x27;).textContent=ti?&#x27;Togli il tertius illuminans&#x27;:&#x27;Aggiungi il tertius illuminans&#x27;;
  }
  $(&#x27;tiBtn&#x27;).addEventListener(&#x27;click&#x27;,function(){ti=!ti;net()});net();

  // liability vs social connection
  var models={
    liab:&#x27;&lt;b&gt;Liability model&lt;/b&gt; (modello della colpa): si cerca chi ha causato il danno, con un nesso causale diretto e spesso con intenzione o negligenza. La responsabilità guarda al passato, isola un colpevole e lo sanziona. Funziona bene per un prodotto difettoso; male per l\&#x27;obesità, dove le cause sono molte e diffuse.&#x27;,
    soc:&#x27;&lt;b&gt;Social connection model&lt;/b&gt; (Young, applicato da Schrempf): è responsabile chi partecipa con le proprie azioni a processi strutturali che producono un danno, anche senza causarlo da solo. La responsabilità è condivisa, guarda al futuro (cambiare la struttura) e si esercita in modo collettivo. Le catene di fast-food sono connesse all\&#x27;obesità tramite prodotti, porzioni e marketing.&#x27;
  };
  document.querySelectorAll(&#x27;[data-model]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    document.querySelectorAll(&#x27;[data-model]&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});b.classList.add(&#x27;on&#x27;);
    $(&#x27;modelOut&#x27;).innerHTML=models[b.getAttribute(&#x27;data-model&#x27;)];
  })});
  $(&#x27;modelOut&#x27;).innerHTML=models.liab;
})();
&lt;/script&gt;
