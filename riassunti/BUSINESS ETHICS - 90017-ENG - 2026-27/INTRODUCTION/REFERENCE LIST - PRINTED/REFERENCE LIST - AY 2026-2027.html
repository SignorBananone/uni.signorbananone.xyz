&lt;section class=&quot;part&quot; id=&quot;letture&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
  &lt;h2&gt;Il corso e le letture&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; «BUSINESS ETHICS 2026-2027», codice 90017-ENG_2026, «7 citazioni in 1 sezioni».&lt;/p&gt;
  &lt;p&gt;La reference list non è una lezione: è il &lt;b&gt;contratto di lettura&lt;/b&gt; del corso. Dice cosa è obbligatorio (&lt;i&gt;Lettura obbligatoria&lt;/i&gt;), cosa è consigliato (&lt;i&gt;Lettura consigliata&lt;/i&gt;) e, per i libri, &lt;b&gt;quali capitoli&lt;/b&gt; contano. Studiare bene parte da qui: sapere cosa leggere e perché ogni testo è nella lista.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Obbligatorie&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Consigliate&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Piano di lettura&lt;/button&gt;

        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Crane et al.&lt;/b&gt;, &lt;i&gt;Business Ethics: Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/i&gt;, OUP 2019, 5ª ed.&lt;/td&gt;&lt;td&gt;Manuale&lt;/td&gt;&lt;td&gt;Capitoli 1-5, 7, 9&lt;/td&gt;&lt;td&gt;Biblioteca di economia e giurisprudenza, 174.4 CRA BUS&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Freeman&lt;/b&gt;, &lt;i&gt;Managing for Stakeholders&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Paper&lt;/td&gt;&lt;td&gt;Tutto&lt;/td&gt;&lt;td&gt;Spazio e-learning Moodle (non in biblioteca)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Garriga &amp;amp; Melé&lt;/b&gt;, «Corporate Social Responsibility Theories: Mapping the Territory», &lt;i&gt;Journal of Business Ethics&lt;/i&gt; 53(1/2), 2004, pp. 51-71&lt;/td&gt;&lt;td&gt;Articolo&lt;/td&gt;&lt;td&gt;Tutto&lt;/td&gt;&lt;td&gt;readings.unibg.it&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Schrempf&lt;/b&gt;, «A Social Connection Approach to Corporate Responsibility: The Case of the Fast-Food Industry and Obesity», &lt;i&gt;Business &amp;amp; Society&lt;/i&gt; 53(2), 2014, pp. 300-332&lt;/td&gt;&lt;td&gt;Articolo&lt;/td&gt;&lt;td&gt;Tutto&lt;/td&gt;&lt;td&gt;readings.unibg.it&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Phillips&lt;/b&gt;, «Ethics and Network Organizations», &lt;i&gt;Business Ethics Quarterly&lt;/i&gt; 20(3), 2010, pp. 533-543&lt;/td&gt;&lt;td&gt;Articolo (Presidential Address SBE 2009)&lt;/td&gt;&lt;td&gt;Tutto&lt;/td&gt;&lt;td&gt;readings.unibg.it&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Testo&lt;/th&gt;&lt;th&gt;Cosa leggere&lt;/th&gt;&lt;th&gt;Perché è utile&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Wicks et al.&lt;/b&gt;, &lt;i&gt;Business Ethics: A Managerial Approach&lt;/i&gt;, Pearson c2010&lt;/td&gt;&lt;td&gt;Solo cap. 3&lt;/td&gt;&lt;td&gt;Riprende Freeman (coautore) in chiave manageriale: etica, stakeholder, strategia e creazione di valore. → &lt;a href=&quot;#scopo&quot;&gt;sezione 9&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Melé&lt;/b&gt;, &lt;i&gt;Business Ethics in Action: Seeking Human Excellence in Organizations&lt;/i&gt;, Palgrave 2009&lt;/td&gt;&lt;td&gt;Solo cap. 7&lt;/td&gt;&lt;td&gt;Lo stesso Melé di Garriga &amp;amp; Melé: prospettiva umanistica sull&#x27;impresa. → &lt;a href=&quot;#scopo&quot;&gt;sezione 9&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; Un ordine sensato, dal generale al particolare (è un suggerimento, non dato dal corso):&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Crane cap. 1-2 → il vocabolario: business ethics, CSR, stakeholder, citizenship.&lt;/li&gt;
        &lt;li&gt;Freeman → il cuore della stakeholder theory. Poi, se vuoi, Wicks cap. 3.&lt;/li&gt;
        &lt;li&gt;Garriga &amp;amp; Melé → la mappa di tutte le teorie CSR, dove collocare ciò che hai letto.&lt;/li&gt;
        &lt;li&gt;Crane cap. 3-5 → come giudicare (teorie normative), come si decide davvero (descrittive), come si gestisce (strumenti).&lt;/li&gt;
        &lt;li&gt;Crane cap. 7 e 9 → due stakeholder concreti: dipendenti, fornitori e concorrenti.&lt;/li&gt;
        &lt;li&gt;Phillips e Schrempf → la frontiera: responsabilità nelle reti di fornitura e per problemi strutturali.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quali capitoli del manuale Crane et al. sono obbligatori?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Dal 1 al 5, più il 7 e il 9 (nota «ONLY CHAPTERS FROM 1 TO 5 AND 7 AND 9»).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale testo non è disponibile in biblioteca e dove si trova?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Il paper di R. Edward Freeman &lt;i&gt;Managing for Stakeholders&lt;/i&gt;: si trova nello spazio e-learning Moodle del corso.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale autore compare due volte nella lista?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Domènec Melé: coautore dell&#x27;articolo con Garriga (2004) e autore di &lt;i&gt;Business Ethics in Action&lt;/i&gt; (2009). Anche Freeman torna indirettamente: è coautore del libro di Wicks et al. (fonte esterna, catalogo Pearson).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
