&lt;section class=&quot;part sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;h2&gt;Cos&#x27;è la business ethics&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 1 (obbligatorio). &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; definizioni standard della disciplina, da confrontare col capitolo.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Business ethics&lt;/b&gt; (etica degli affari) — lo studio delle situazioni, attività e decisioni d&#x27;impresa in cui sono in gioco questioni di giusto e sbagliato. È sia una &lt;em class=&quot;t&quot;&gt;pratica&lt;/em&gt; (come si comportano le imprese) sia una &lt;em class=&quot;t&quot;&gt;disciplina&lt;/em&gt; (come le studiamo).&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Morality&lt;/h4&gt;&lt;p&gt;La &lt;b&gt;morale&lt;/b&gt;: norme, valori e credenze radicati nei processi sociali, che definiscono giusto e sbagliato per un individuo o una comunità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ethics&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;b&gt;etica&lt;/b&gt;: lo studio della morale e l&#x27;applicazione della ragione per chiarire regole e principi che determinano giusto e sbagliato in una situazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Law&lt;/h4&gt;&lt;p&gt;La &lt;b&gt;legge&lt;/b&gt;: regole codificate e sanzionate. Spesso coincide con l&#x27;etica, ma non sempre: si dice che la business ethics comincia dove finisce la legge.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Etica e legge: due cerchi che si sovrappongono&lt;/h3&gt;
  &lt;p&gt;Clicca le tre zone del diagramma.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn etica e legge&quot;&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Solo legale.&lt;/b&gt; Comportamenti richiesti o permessi dalla legge che non hanno un forte contenuto morale, o che alcuni ritengono discutibili: per esempio regole tecniche di contabilità, o pratiche legali ma contestate (pagare salari minimi legali ma insufficienti per vivere in alcuni paesi).&quot;&gt;&lt;circle cx=&quot;160&quot; cy=&quot;130&quot; r=&quot;105&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; opacity=&quot;.85&quot;/&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Solo etico.&lt;/b&gt; Questioni morali dove la legge tace o è ambigua: è il territorio tipico della business ethics. Esempi: trattare i fornitori con equità oltre il contratto, ridurre emissioni oltre l&#x27;obbligo, non sfruttare un vuoto normativo in un paese estero.&quot;&gt;&lt;circle cx=&quot;260&quot; cy=&quot;130&quot; r=&quot;105&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; opacity=&quot;.85&quot;/&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;vennp&quot; data-info=&quot;&lt;b&gt;Etico e legale.&lt;/b&gt; Dove legge e morale coincidono: non rubare, non frodare i clienti, non discriminare. Qui la legge cristallizza un consenso morale già esistente.&quot;&gt;&lt;path d=&quot;M210 39 A105 105 0 0 1 210 221 A105 105 0 0 1 210 39z&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;/g&gt;
    &lt;text x=&quot;110&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; pointer-events=&quot;none&quot;&gt;Legge&lt;/text&gt;
    &lt;text x=&quot;310&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; pointer-events=&quot;none&quot;&gt;Etica&lt;/text&gt;
    &lt;text x=&quot;210&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; pointer-events=&quot;none&quot;&gt;entrambe&lt;/text&gt;
  &lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;vennp&quot;&gt;&lt;b&gt;Clicca una zona&lt;/b&gt; per vedere cosa contiene.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Perché studiarla?&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Il potere e l&#x27;impatto delle imprese&lt;/summary&gt;&lt;div&gt;Le grandi imprese influenzano lavoro, consumi, ambiente e politica. Più potere significa più domanda di responsabilità.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Le crisi e gli scandali&lt;/summary&gt;&lt;div&gt;Frodi contabili, disastri ambientali, condizioni di lavoro nelle supply chain: ogni scandalo mostra che il mercato e la legge da soli non bastano.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Un&#x27;etica migliore può fare bene anche agli affari&lt;/summary&gt;&lt;div&gt;Reputazione, fiducia di clienti e dipendenti, gestione del rischio: è la &lt;em class=&quot;t&quot;&gt;business case&lt;/em&gt; (la giustificazione economica) per l&#x27;etica. Attenzione però: se l&#x27;etica valesse solo quando rende, non sarebbe più etica. È una tensione che torna in tutto il corso (vedi le &lt;a href=&quot;#teoriecsr&quot;&gt;teorie strumentali&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Le persone vogliono sapere come comportarsi&lt;/summary&gt;&lt;div&gt;Manager e dipendenti affrontano dilemmi reali: conoscere le teorie aiuta a ragionarci in modo strutturato, non solo d&#x27;istinto.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Le due cornici del manuale: globalization e sustainability&lt;/h3&gt;
  &lt;p&gt;Il sottotitolo del Crane è «managing corporate citizenship and sustainability in the age of globalization». Due idee lo reggono.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Globalization&lt;/h4&gt;&lt;p&gt;La &lt;b&gt;globalizzazione&lt;/b&gt; è la progressiva deterritorializzazione delle attività economiche: le imprese operano tra paesi con leggi e culture diverse. Questo crea vuoti normativi (nessun governo controlla tutta la catena) e rende più difficile dire chi è responsabile. È lo stesso problema di &lt;a href=&quot;#reti&quot;&gt;Phillips e Schrempf&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;&lt;p&gt;La &lt;b&gt;sostenibilità&lt;/b&gt;: mantenere nel lungo periodo i sistemi ambientali, economici e sociali di cui l&#x27;impresa fa parte. Nella forma classica del &lt;em class=&quot;t&quot;&gt;triple bottom line&lt;/em&gt; (triplice risultato) l&#x27;impresa si valuta su tre dimensioni, non solo sul profitto.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 300&quot; style=&quot;max-width:420px;margin:auto&quot; role=&quot;img&quot; aria-label=&quot;Triple bottom line&quot;&gt;
    &lt;circle cx=&quot;210&quot; cy=&quot;110&quot; r=&quot;80&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;circle cx=&quot;150&quot; cy=&quot;200&quot; r=&quot;80&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;circle cx=&quot;270&quot; cy=&quot;200&quot; r=&quot;80&quot; fill=&quot;var(--slate)&quot; opacity=&quot;.22&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;210&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Ambientale&lt;/text&gt;
    &lt;text x=&quot;110&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Economica&lt;/text&gt;
    &lt;text x=&quot;310&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Sociale&lt;/text&gt;
    &lt;text x=&quot;210&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;sostenibile&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Triple bottom line: la sostenibilità sta nell&#x27;intersezione delle tre dimensioni.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è la differenza tra morality ed ethics?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La morality è l&#x27;insieme di norme e valori vissuti in una comunità; l&#x27;ethics è la riflessione razionale su quelle norme, per capire cosa sia giusto in una situazione.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché si dice che la business ethics «comincia dove finisce la legge»?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché il suo campo tipico sono le zone grigie che la legge non regola o regola male (anche per la globalizzazione). Se una cosa è vietata dalla legge, il problema è di compliance; la business ethics si occupa di ciò che resta aperto.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa aggiunge il triple bottom line alla visione classica dell&#x27;impresa?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Valuta l&#x27;impresa anche sui risultati ambientali e sociali, non solo su quelli economici.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;csr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;h2&gt;CSR, stakeholder e corporate citizenship&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 2 · Freeman, &lt;i&gt;Managing for Stakeholders&lt;/i&gt; (Moodle). &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; modelli classici trattati in queste letture.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Corporate Social Responsibility (CSR)&lt;/b&gt; — la &lt;b&gt;responsabilità sociale d&#x27;impresa&lt;/b&gt;: l&#x27;idea che l&#x27;impresa abbia responsabilità verso la società oltre il solo profitto per gli azionisti. Il dibattito parte da una domanda: &lt;i&gt;un&#x27;impresa può avere responsabilità morali?&lt;/i&gt; Chi dice di sì sostiene che l&#x27;impresa ha intenzioni e strutture decisionali proprie, non riducibili ai singoli.&lt;/div&gt;

  &lt;h3&gt;La piramide di Carroll&lt;/h3&gt;
  &lt;p&gt;Il modello più citato di CSR (Archie Carroll, 1991) distingue quattro livelli di responsabilità. Clicca un livello.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;Piramide di Carroll&quot;&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Economic responsibilities — richieste.&lt;/b&gt; Essere redditizi: produrre beni e servizi utili, dare un ritorno agli investitori, creare lavoro. È la base: senza, l&#x27;impresa non esiste.&quot;&gt;&lt;path d=&quot;M40 280 L360 280 L322 210 L78 210z&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Economiche&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Legal responsibilities — richieste.&lt;/b&gt; Rispettare le leggi: la legge come «etica codificata» della società.&quot;&gt;&lt;path d=&quot;M78 205 L322 205 L284 140 L116 140z&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Legali&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Ethical responsibilities — attese.&lt;/b&gt; Fare ciò che è giusto ed equo anche dove la legge non arriva; evitare il danno. Qui entra la business ethics in senso stretto.&quot;&gt;&lt;path d=&quot;M116 135 L284 135 L246 70 L154 70z&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;Etiche&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;clickable&quot; tabindex=&quot;0&quot; data-target=&quot;carrollp&quot; data-info=&quot;&lt;b&gt;Philanthropic responsibilities — desiderate.&lt;/b&gt; Contribuire alla comunità: donazioni, progetti sociali, volontariato. Apprezzate, ma la loro mancanza non è considerata immorale.&quot;&gt;&lt;path d=&quot;M154 65 L246 65 L200 10z&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Filantropiche&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;carrollp&quot;&gt;&lt;b&gt;Clicca un livello&lt;/b&gt; della piramide.&lt;p class=&quot;note&quot;&gt;Critica frequente: la forma a piramide suggerisce una gerarchia (prima il profitto), e il modello nasce nel contesto USA; in Europa molte responsabilità «etiche» sono già legge.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Stakeholder theory&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt; — nella definizione classica di Freeman (1984): «qualsiasi gruppo o individuo che può influenzare o è influenzato dal raggiungimento degli obiettivi dell&#x27;organizzazione». Si contrappone allo &lt;b&gt;shareholder&lt;/b&gt; (azionista), che nella visione tradizionale è l&#x27;unico a cui l&#x27;impresa deve rendere conto.&lt;/div&gt;
  &lt;p&gt;Clicca i nodi della mappa. Il pulsante passa dalla visione &lt;em class=&quot;t&quot;&gt;shareholder&lt;/em&gt; a quella &lt;em class=&quot;t&quot;&gt;stakeholder&lt;/em&gt;.&lt;/p&gt;
  &lt;div&gt;&lt;button class=&quot;btn&quot; id=&quot;stkToggle&quot;&gt;Mostra solo la visione shareholder&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
  &lt;figure&gt;&lt;svg id=&quot;stkmap&quot; viewBox=&quot;0 0 440 400&quot; role=&quot;img&quot; aria-label=&quot;Mappa degli stakeholder&quot;&gt;
    &lt;g id=&quot;stkSec&quot; stroke=&quot;var(--rule)&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;200&quot; r=&quot;175&quot;/&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.4&quot;&gt;
      &lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;220&quot; y2=&quot;85&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;330&quot; y2=&quot;160&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;290&quot; y2=&quot;295&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;150&quot; y2=&quot;295&quot; class=&quot;prim&quot;/&gt;&lt;line x1=&quot;220&quot; y1=&quot;200&quot; x2=&quot;110&quot; y2=&quot;160&quot; class=&quot;prim&quot;/&gt;
    &lt;/g&gt;
    &lt;circle cx=&quot;220&quot; cy=&quot;200&quot; r=&quot;42&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; class=&quot;serif&quot;&gt;Impresa&lt;/text&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;g class=&quot;clickable stk&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Shareholders / financiers.&lt;/b&gt; Azionisti e finanziatori: forniscono capitale, si aspettano un rendimento. Nella visione stakeholder restano fondamentali, ma non sono gli unici.&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;85&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;89&quot;&gt;Azionisti&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Employees.&lt;/b&gt; Dipendenti: forniscono lavoro e competenze, si aspettano salario, sicurezza, rispetto dei diritti. → Crane cap. 7, sezione 8.&quot;&gt;&lt;circle cx=&quot;330&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;164&quot;&gt;Dipendenti&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Customers.&lt;/b&gt; Clienti: comprano prodotti e servizi, si aspettano qualità, sicurezza, informazioni corrette. Il caso fast-food di Schrempf riguarda proprio clienti e salute.&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;295&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;299&quot;&gt;Clienti&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Suppliers.&lt;/b&gt; Fornitori: forniscono materiali e servizi, si aspettano pagamenti equi e rapporti stabili. → Crane cap. 9 e Phillips, sezioni 8 e 10.&quot;&gt;&lt;circle cx=&quot;150&quot; cy=&quot;295&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;299&quot;&gt;Fornitori&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk prim-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Communities.&lt;/b&gt; Comunità locali: offrono infrastrutture e contesto sociale, subiscono gli effetti (lavoro, inquinamento, traffico).&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;160&quot; r=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;164&quot;&gt;Comunità&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Government.&lt;/b&gt; Stakeholder secondario in Freeman: fissa le regole, tassa, regola. Può influenzare molto l&#x27;impresa pur senza scambi diretti di mercato.&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;40&quot;&gt;Governo&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Competitors.&lt;/b&gt; Concorrenti: secondari, ma con obblighi di concorrenza leale. → Crane cap. 9.&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;378&quot; y=&quot;40&quot;&gt;Concorrenti&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Media.&lt;/b&gt; Secondari: amplificano o costruiscono la reputazione. Sono un tipico «tertius illuminans» di Phillips (sezione 10).&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;355&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;375&quot;&gt;Media&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;clickable stk sec-n&quot; tabindex=&quot;0&quot; data-target=&quot;stkp&quot; data-info=&quot;&lt;b&gt;Special interest groups / NGOs.&lt;/b&gt; ONG, gruppi di pressione, associazioni di consumatori: secondari, ma possono mobilitare gli altri stakeholder.&quot;&gt;&lt;rect x=&quot;315&quot; y=&quot;355&quot; width=&quot;110&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--soft)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;375&quot;&gt;ONG e attivisti&lt;/text&gt;&lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Primari (cerchi pieni) e secondari (anello esterno), nella versione di Freeman et al. (2007).&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;card panel&quot; id=&quot;stkp&quot;&gt;&lt;b&gt;Clicca uno stakeholder.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il paper di Freeman: le idee chiave&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Il problema&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Tre tesi&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;I principi&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Valore, non trade-off&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Il capitalismo «tradizionale» separa due mondi: gli affari (profitto) e l&#x27;etica (altrove). Freeman chiama questo errore &lt;em class=&quot;t&quot;&gt;separation fallacy&lt;/em&gt; (fallacia della separazione): l&#x27;idea che si possa parlare di business senza parlare di etica, e viceversa.&lt;/p&gt;
      &lt;p&gt;Il paper propone il &lt;em class=&quot;t&quot;&gt;managing for stakeholders&lt;/em&gt;: gestire l&#x27;impresa pensando a come creare valore per tutti gli stakeholder, invece che massimizzare il valore per gli azionisti trattando gli altri come vincoli.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Separation fallacy&lt;/h4&gt;&lt;p&gt;È falso pensare che le decisioni d&#x27;impresa siano moralmente neutre: ogni decisione ha effetti su persone.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Open question argument&lt;/h4&gt;&lt;p&gt;Per ogni decisione ci si può sempre chiedere: chi ne beneficia, chi ne è danneggiato, quali diritti sono toccati, che tipo di persona divento facendolo?&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Responsibility principle&lt;/h4&gt;&lt;p&gt;La maggior parte delle persone, la maggior parte del tempo, vuole assumersi la responsabilità degli effetti delle proprie azioni sugli altri.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Insieme portano alla &lt;b&gt;integration thesis&lt;/b&gt;: business ed etica vanno pensati insieme.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; I principi proposti da Freeman e coautori (formulazione riassunta; verifica la lista sul paper):&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;Gli interessi degli stakeholder, nel tempo, vanno nella stessa direzione.&lt;/li&gt;
        &lt;li&gt;Gli stakeholder sono persone reali, con nomi e volti, non categorie astratte.&lt;/li&gt;
        &lt;li&gt;Cercare soluzioni che soddisfino più stakeholder insieme.&lt;/li&gt;
        &lt;li&gt;Comunicare intensamente con tutti, anche con chi è critico.&lt;/li&gt;
        &lt;li&gt;Preferire la volontarietà alla regolazione imposta.&lt;/li&gt;
        &lt;li&gt;Generalizzare l&#x27;approccio del marketing: capire i bisogni di ciascuno come si fa coi clienti.&lt;/li&gt;
        &lt;li&gt;Tutto ciò che si fa serve gli stakeholder.&lt;/li&gt;
        &lt;li&gt;Negoziare con stakeholder primari e secondari.&lt;/li&gt;
        &lt;li&gt;Monitorare e riprogettare i processi per servirli meglio.&lt;/li&gt;
        &lt;li&gt;Agire con uno scopo che soddisfi gli impegni verso gli stakeholder.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;La domanda chiave non è «come divido una torta fissa?», ma «come faccio crescere la torta per tutti?». Freeman vede i trade-off tra stakeholder come un problema da superare con innovazione, non come uno stato naturale.&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;Torta fissa contro torta che cresce&quot;&gt;
        &lt;circle cx=&quot;130&quot; cy=&quot;85&quot; r=&quot;60&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;path d=&quot;M130 85 L130 25 A60 60 0 0 1 182 115z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;
        &lt;text x=&quot;130&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Trade-off: torta fissa&lt;/text&gt;
        &lt;path d=&quot;M230 85 L330 85&quot; stroke=&quot;var(--soft)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;circle cx=&quot;460&quot; cy=&quot;85&quot; r=&quot;78&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;path d=&quot;M460 85 L460 7 A78 78 0 0 1 528 124z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.7&quot;/&gt;
        &lt;text x=&quot;460&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Creazione di valore: la torta cresce&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Corporate citizenship&lt;/h3&gt;
  &lt;p&gt;Il Crane usa la metafora della &lt;b&gt;cittadinanza&lt;/b&gt;: l&#x27;impresa come «cittadino» della società. Tre letture possibili:&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Visione&lt;/th&gt;&lt;th&gt;Cosa significa&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Limited view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cittadinanza = filantropia e impegno nella comunità locale, per interesse proprio illuminato.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Equivalent view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cittadinanza = sinonimo di CSR (la piramide di Carroll con un altro nome).&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Extended view&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;impresa gestisce diritti di cittadinanza (sociali, civili, politici) dove lo Stato non arriva: fornisce servizi, abilita o ostacola diritti. È la visione politica, cruciale nella globalizzazione.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quali livelli della piramide di Carroll sono «richiesti», «attesi» e «desiderati»?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Economici e legali: richiesti. Etici: attesi. Filantropici: desiderati.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cos&#x27;è la separation fallacy?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;L&#x27;idea, criticata da Freeman, che business ed etica siano ambiti separati e che le decisioni economiche siano moralmente neutre.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che differenza c&#x27;è tra stakeholder primari e secondari?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;I primari (clienti, dipendenti, fornitori, comunità, finanziatori) sono essenziali all&#x27;esistenza e alla creazione di valore dell&#x27;impresa; i secondari (governo, concorrenti, media, ONG) possono influenzarla o esserne influenzati senza essere parte diretta dei suoi scambi.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale visione della corporate citizenship vede l&#x27;impresa come attore politico?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La extended view: l&#x27;impresa gestisce diritti di cittadinanza dove i governi non arrivano.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;teoriecsr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;h2&gt;Mappare le teorie della CSR&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Garriga &amp;amp; Melé, «Corporate Social Responsibility Theories: Mapping the Territory», &lt;i&gt;Journal of Business Ethics&lt;/i&gt;, 2004 (obbligatorio). &lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; sintesi dell&#x27;articolo da &lt;a href=&quot;https://www.iese.edu/insight/articles/untangling-csr-corporate-social-responsibility-theories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IESE Insight&lt;/a&gt;.&lt;/p&gt;
  &lt;p&gt;Il campo della CSR è pieno di teorie che usano parole diverse. Garriga e Melé le ordinano in base a &lt;b&gt;come concepiscono il rapporto tra impresa e società&lt;/b&gt;, partendo dall&#x27;idea (del sociologo Talcott Parsons) che ogni sistema sociale debba risolvere quattro problemi: adattarsi all&#x27;ambiente, raggiungere obiettivi, integrarsi socialmente, mantenere valori condivisi. A ciascuno corrisponde una famiglia di teorie.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 340&quot; role=&quot;img&quot; aria-label=&quot;Quattro gruppi di teorie CSR&quot;&gt;
    &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Instrumental&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;80&quot;&gt;l&#x27;impresa come strumento&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;98&quot;&gt;per creare ricchezza&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;135&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimensione: profitto&lt;/text&gt;
      &lt;rect x=&quot;310&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Political&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;80&quot;&gt;il potere dell&#x27;impresa&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;98&quot;&gt;nella società&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;135&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimensione: performance politica&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;215&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Integrative&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;240&quot;&gt;l&#x27;impresa integra&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;258&quot;&gt;le domande sociali&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;295&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimensione: domande sociali&lt;/text&gt;
      &lt;rect x=&quot;310&quot; y=&quot;180&quot; width=&quot;270&quot; height=&quot;140&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;215&quot; class=&quot;serif&quot; font-size=&quot;19&quot;&gt;Ethical&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;240&quot;&gt;l&#x27;impresa ha obblighi&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;258&quot;&gt;morali verso la società&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;295&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;dimensione: valori etici&lt;/text&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;170&quot; r=&quot;34&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;166&quot; font-size=&quot;11&quot;&gt;impresa&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;180&quot; font-size=&quot;11&quot;&gt;↔ società&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;I quattro gruppi. La conclusione dell&#x27;articolo: serve una teoria che integri le quattro dimensioni.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Instrumental&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Political&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Integrative&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ethical&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;La CSR conta solo se e quanto aiuta a creare valore economico. È il &lt;b&gt;business case&lt;/b&gt; della CSR.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Maximizing shareholder value&lt;/b&gt; — Milton Friedman (1970): «la responsabilità sociale dell&#x27;impresa è aumentare i profitti», entro le regole del gioco.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Strategies for competitive advantage&lt;/b&gt; — investimenti sociali che migliorano il contesto competitivo (Porter &amp;amp; Kramer), risorse e capacità ambientali, strategie per la &lt;i&gt;bottom of the pyramid&lt;/i&gt; (i mercati dei più poveri, Prahalad).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Cause-related marketing&lt;/b&gt; — legare il prodotto a una causa sociale per aumentare vendite e reputazione.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;L&#x27;impresa ha &lt;b&gt;potere sociale&lt;/b&gt;, e il potere comporta responsabilità.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Corporate constitutionalism&lt;/b&gt; — Keith Davis: «iron law of responsibility», chi non usa il potere in modo responsabile finisce per perderlo.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Integrative Social Contract Theory (ISCT)&lt;/b&gt; — Donaldson &amp;amp; Dunfee: esiste un contratto sociale tra impresa e società, con norme universali (&lt;i&gt;hypernorms&lt;/i&gt;) e norme locali legittime.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Corporate citizenship&lt;/b&gt; — l&#x27;impresa come cittadino, con diritti e doveri (vedi la extended view, sezione 3).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;L&#x27;impresa dipende dalla società per esistere e crescere, quindi deve rilevare e rispondere alle domande sociali.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Issues management&lt;/b&gt; — individuare per tempo le questioni sociali che possono colpire l&#x27;impresa.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Principle of public responsibility&lt;/b&gt; — Preston &amp;amp; Post: la legge e le politiche pubbliche indicano cosa la società si aspetta.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Stakeholder management&lt;/b&gt; — bilanciare gli interessi degli stakeholder (vedi Freeman).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Corporate Social Performance (CSP)&lt;/b&gt; — Carroll, Wood: misurare principi, processi e risultati della responsabilità sociale.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;La responsabilità sociale è un &lt;b&gt;obbligo morale&lt;/b&gt;, prima di ogni calcolo di convenienza.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Normative stakeholder theory&lt;/b&gt; — gli stakeholder hanno interessi con valore intrinseco (Freeman; Donaldson &amp;amp; Preston).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Universal rights&lt;/b&gt; — diritti umani e del lavoro come base (UN Global Compact, Dichiarazione universale dei diritti umani).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Sustainable development&lt;/b&gt; — rapporto Brundtland (1987): soddisfare i bisogni del presente senza compromettere quelli delle generazioni future.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;The common good&lt;/b&gt; — l&#x27;impresa deve contribuire al bene comune della società di cui è parte. È la prospettiva cara a Melé (vedi sezione 9).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Classifica da te&lt;/h3&gt;
  &lt;p&gt;A quale gruppo appartiene ciascuna affermazione? Scegli e verifica.&lt;/p&gt;
  &lt;div id=&quot;sorter&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In quale gruppo collocheresti la posizione di Friedman e perché?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Instrumental: la sola responsabilità è aumentare i profitti; ogni attività sociale si giustifica solo come mezzo per quello scopo.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Freeman compare in più gruppi: come è possibile?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La stakeholder theory ha una versione gestionale (stakeholder management, integrative) e una versione normativa (gli stakeholder hanno valore intrinseco, ethical). Garriga &amp;amp; Melé classificano gli approcci, non gli autori.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è la conclusione principale dell&#x27;articolo?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Ogni famiglia enfatizza una dimensione (profitti, performance politica, domande sociali, valori etici); serve una teoria del rapporto impresa-società che le integri tutte e quattro.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;normative&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;h2&gt;Teorie etiche normative&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 3 (obbligatorio). &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Le &lt;b&gt;normative ethical theories&lt;/b&gt; (teorie etiche normative) dicono &lt;i&gt;come si dovrebbe&lt;/i&gt; decidere: offrono criteri per giudicare giusto o sbagliato. Il Crane le usa come strumenti, non come dogmi: ognuna illumina un aspetto diverso del problema.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;Albero delle teorie normative&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;260&quot; y=&quot;10&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;35&quot; font-size=&quot;14&quot;&gt;Teorie normative&lt;/text&gt;
      &lt;g stroke=&quot;var(--soft)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M350 50 L120 90&quot;/&gt;&lt;path d=&quot;M350 50 L350 90&quot;/&gt;&lt;path d=&quot;M350 50 L580 90&quot;/&gt;&lt;path d=&quot;M120 130 L60 165&quot;/&gt;&lt;path d=&quot;M120 130 L180 165&quot;/&gt;&lt;path d=&quot;M350 130 L290 165&quot;/&gt;&lt;path d=&quot;M350 130 L410 165&quot;/&gt;&lt;path d=&quot;M580 130 L520 165&quot;/&gt;&lt;path d=&quot;M580 130 L640 165&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;30&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;108&quot;&gt;Consequentialist&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;conta il risultato&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;108&quot;&gt;Non-consequentialist&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;conta il principio&lt;/text&gt;
      &lt;rect x=&quot;490&quot; y=&quot;90&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;108&quot;&gt;Contemporary&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;123&quot; fill=&quot;var(--soft)&quot; font-size=&quot;11&quot;&gt;carattere, relazioni, dialogo&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;182&quot;&gt;Egoism&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;182&quot;&gt;Utilitarianism&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;182&quot;&gt;Duties (Kant)&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;182&quot;&gt;Rights &amp;amp; justice&lt;/text&gt;
      &lt;text x=&quot;520&quot; y=&quot;182&quot;&gt;Virtue · Care&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;182&quot;&gt;Discourse · Postmod.&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Egoism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Utilitarianism&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Kant&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rights &amp;amp; justice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Virtue&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Altre&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Ethical egoism&lt;/b&gt; (egoismo etico): un&#x27;azione è giusta se massimizza le conseguenze positive &lt;i&gt;per chi agisce&lt;/i&gt;. Base filosofica dell&#x27;economia di mercato (la «mano invisibile» di Adam Smith). Limite: ignora gli altri, salvo quando servono al proprio interesse; non risolve i conflitti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Utilitarianism&lt;/b&gt; (utilitarismo, Bentham e Mill): un&#x27;azione è giusta se produce &lt;i&gt;la massima felicità per il maggior numero&lt;/i&gt; di persone toccate. Si fa una specie di analisi costi-benefici morale.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;azione giusta = argmax Σ&lt;sub&gt;i&lt;/sub&gt; (benefici&lt;sub&gt;i&lt;/sub&gt; − danni&lt;sub&gt;i&lt;/sub&gt;) su tutte le persone toccate&lt;/div&gt;
      &lt;p&gt;Distinzioni: &lt;b&gt;act utilitarianism&lt;/b&gt; (si valuta ogni singola azione) vs &lt;b&gt;rule utilitarianism&lt;/b&gt; (si valutano le regole che, seguite da tutti, danno il miglior risultato). Limiti: misurare e confrontare la felicità è difficile, e la somma può schiacciare la minoranza.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Ethics of duties&lt;/b&gt; (Immanuel Kant): un&#x27;azione è giusta se segue un principio morale valido in sé, indipendentemente dalle conseguenze. Il test è il &lt;em class=&quot;t&quot;&gt;categorical imperative&lt;/em&gt; (imperativo categorico), in tre massime:&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;&lt;b&gt;Consistency&lt;/b&gt; — agisci solo secondo una regola che non si contraddice.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Human dignity&lt;/b&gt; — tratta le persone sempre anche come fini, mai solo come mezzi.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Universality&lt;/b&gt; — agisci come se la tua regola dovesse diventare legge universale.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Limite: rigido; non dice cosa fare quando due doveri entrano in conflitto.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Rights&lt;/b&gt; (diritti): rivendicazioni fondamentali che le persone possono avanzare contro gli altri (vita, libertà, dignità), base dei diritti umani. Il problema è bilanciare diritti in conflitto.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Justice&lt;/b&gt; (giustizia): l&#x27;equa distribuzione di benefici e oneri. Due visioni opposte: &lt;b&gt;Rawls&lt;/b&gt; (justice as fairness: le regole che sceglieremmo sotto un «velo d&#x27;ignoranza», senza sapere chi saremo; le disuguaglianze sono accettabili solo se migliorano la condizione dei più svantaggiati) e &lt;b&gt;Nozick&lt;/b&gt; (entitlement: giusto è ciò che deriva da acquisizioni e scambi legittimi).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Virtue ethics&lt;/b&gt; (etica delle virtù, da Aristotele): la domanda non è «quale regola?», ma «che tipo di persona voglio essere?». Giusto è ciò che farebbe una persona di buon carattere: onestà, coraggio, prudenza, giustizia. È la base della prospettiva di Melé, che parla di «human excellence» nelle organizzazioni.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Feminist ethics / ethics of care&lt;/b&gt; — al centro relazioni, empatia, cura, invece di regole astratte.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Discourse ethics&lt;/b&gt; (Habermas) — le norme giuste emergono da un dialogo razionale e inclusivo tra tutti gli interessati: base della &lt;i&gt;stakeholder dialogue&lt;/i&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Postmodern ethics&lt;/b&gt; — diffidenza verso le teorie universali; conta la responsabilità personale nella situazione concreta, «sentire» il problema morale.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;Il Crane conclude con un approccio &lt;b&gt;pluralista e pragmatico&lt;/b&gt;: usare più teorie insieme come lenti per esaminare un caso.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Laboratorio: chiudere uno stabilimento?&lt;/h3&gt;
  &lt;p&gt;Un&#x27;impresa valuta di chiudere uno stabilimento e spostare la produzione. Muovi i cursori per stimare gli effetti (da −10 a +10) su ciascun gruppo: il calcolo utilitarista somma tutto. Il controllo kantiano non cambia con i numeri.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;utilLab&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u1&quot;&gt;Azionisti (più profitti)&lt;/label&gt;&lt;input id=&quot;u1&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u2&quot;&gt;Dipendenti licenziati&lt;/label&gt;&lt;input id=&quot;u2&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;-8&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u3&quot;&gt;Comunità locale&lt;/label&gt;&lt;input id=&quot;u3&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;-4&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u4&quot;&gt;Clienti (prezzi più bassi)&lt;/label&gt;&lt;input id=&quot;u4&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u5&quot;&gt;Nuovi lavoratori all&#x27;estero&lt;/label&gt;&lt;input id=&quot;u5&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;span id=&quot;utilBar&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;utilOut&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Domanda kantiana (non cambia coi cursori): l&#x27;impresa informa i dipendenti per tempo e con onestà, o li tratta solo come mezzi? L&#x27;utilitarismo guarda alla somma, Kant al modo.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Qual è la differenza essenziale tra teorie consequentialist e non-consequentialist?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Le prime giudicano un&#x27;azione dai suoi risultati; le seconde dai principi o doveri che segue, a prescindere dai risultati.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un&#x27;azienda mente sui rischi di un prodotto perché «il beneficio totale è maggiore». Quale massima kantiana viola?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Soprattutto la dignità umana (usa i clienti solo come mezzi) e l&#x27;universalità (una regola «mentire quando conviene» renderebbe impossibile la fiducia).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa chiede il velo d&#x27;ignoranza di Rawls?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Scegliere le regole della società senza sapere quale posizione si occuperà; ne seguono libertà uguali e disuguaglianze accettabili solo se avvantaggiano i più svantaggiati.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;decisioni&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;h2&gt;Come si decide davvero&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 4 (obbligatorio). &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Le &lt;b&gt;descriptive ethical theories&lt;/b&gt; (teorie descrittive) non dicono cosa si dovrebbe fare, ma &lt;i&gt;come&lt;/i&gt; le persone decidono di fatto nelle organizzazioni, e perché persone «per bene» a volte fanno cose sbagliate.&lt;/p&gt;

  &lt;h3&gt;Il modello in quattro passi di Rest&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Recognize moral issue&lt;/h4&gt;&lt;p&gt;Riconoscere che la situazione ha una dimensione morale. Sembra banale, ma è il punto in cui più spesso si sbaglia: se un problema è inquadrato come «solo tecnico» o «solo commerciale», l&#x27;etica non entra mai in gioco. Conta il &lt;b&gt;moral framing&lt;/b&gt;, il linguaggio usato («ottimizzazione fiscale» vs «evasione»).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Make moral judgement&lt;/h4&gt;&lt;p&gt;Valutare cosa sia giusto. Qui entrano le teorie normative (sezione 5) e lo stadio di sviluppo morale della persona (Kohlberg, sotto).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Establish moral intent&lt;/h4&gt;&lt;p&gt;Decidere di agire secondo il giudizio. Si può sapere cosa è giusto e non volerlo fare, per esempio perché altri obiettivi (carriera, budget) pesano di più.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Engage in moral behaviour&lt;/h4&gt;&lt;p&gt;Agire davvero. Pressioni del capo, della cultura aziendale o del tempo possono separare intenzione e comportamento.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cosa influenza la decisione&lt;/h3&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Individual factors&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;età e genere (effetti deboli e contrastanti)&lt;/li&gt;&lt;li&gt;cultura nazionale&lt;/li&gt;&lt;li&gt;istruzione ed esperienza&lt;/li&gt;&lt;li&gt;locus of control: credere di controllare gli eventi o di subirli&lt;/li&gt;&lt;li&gt;&lt;b&gt;cognitive moral development&lt;/b&gt; (Kohlberg)&lt;/li&gt;&lt;li&gt;integrità personale e moral imagination&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Situational factors&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;issue-related&lt;/b&gt;: moral intensity, moral framing&lt;/li&gt;&lt;li&gt;&lt;b&gt;context-related&lt;/b&gt;: sistemi di ricompensa, autorità, burocrazia, ruoli lavorativi, norme e cultura del gruppo e dell&#x27;organizzazione, contesto nazionale&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;note&quot;&gt;Il Crane sottolinea che i fattori situazionali spesso pesano più di quelli individuali.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Kohlberg: tre livelli di sviluppo morale&lt;/h3&gt;
  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Scala di Kohlberg&quot;&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;150&quot; width=&quot;200&quot; height=&quot;60&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Pre-conventional&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;punizioni e premi&lt;/text&gt;
      &lt;rect x=&quot;220&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;120&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Conventional&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot;&gt;aspettative del gruppo,&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;regole e leggi&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;180&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Post-conventional&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;principi universali,&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;anche contro le norme&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;figcaption&gt;Ogni livello ha due stadi (sei in tutto). La maggior parte degli adulti ragiona a livello convenzionale: per questo la cultura aziendale conta tanto.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;h3&gt;Moral intensity: quanto «pesa» una questione&lt;/h3&gt;
  &lt;p&gt;Secondo Jones (1991), la probabilità di riconoscere una questione come morale cresce con la sua &lt;em class=&quot;t&quot;&gt;moral intensity&lt;/em&gt; (intensità morale), fatta di sei componenti. Muovi i cursori.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;miLab&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m1&quot;&gt;Magnitude of consequences&lt;/label&gt;&lt;input id=&quot;m1&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m2&quot;&gt;Social consensus&lt;/label&gt;&lt;input id=&quot;m2&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m3&quot;&gt;Probability of effect&lt;/label&gt;&lt;input id=&quot;m3&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m4&quot;&gt;Temporal immediacy&lt;/label&gt;&lt;input id=&quot;m4&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m5&quot;&gt;Proximity&lt;/label&gt;&lt;input id=&quot;m5&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;m6&quot;&gt;Concentration of effect&lt;/label&gt;&lt;input id=&quot;m6&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;span class=&quot;out&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;meter&quot;&gt;&lt;span id=&quot;miBar&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;miOut&quot;&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Cosa significa ogni componente&lt;/summary&gt;&lt;div&gt;
      &lt;b&gt;Magnitude&lt;/b&gt;: quanto è grande il danno o il beneficio. &lt;b&gt;Social consensus&lt;/b&gt;: quanto la società concorda che sia sbagliato. &lt;b&gt;Probability&lt;/b&gt;: quanto è probabile che l&#x27;effetto accada. &lt;b&gt;Temporal immediacy&lt;/b&gt;: quanto presto arriva. &lt;b&gt;Proximity&lt;/b&gt;: quanto ci sentiamo vicini a chi è colpito. &lt;b&gt;Concentration&lt;/b&gt;: quanto l&#x27;effetto si concentra su poche persone.&lt;br&gt;&lt;span class=&quot;note&quot;&gt;Il punteggio qui è solo una media illustrativa, non una formula di Jones.&lt;/span&gt;
    &lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;p&gt;Collegamento: nelle lunghe supply chain la &lt;b&gt;proximity&lt;/b&gt; e la &lt;b&gt;temporal immediacy&lt;/b&gt; sono basse (le vittime sono lontane), e l&#x27;intensità percepita cala. È uno dei motivi per cui &lt;a href=&quot;#reti&quot;&gt;Phillips&lt;/a&gt; studia le reti.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In quale passo del modello di Rest agisce soprattutto il moral framing?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Nel primo, il riconoscimento: il linguaggio con cui si inquadra il problema decide se viene visto come morale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché per un&#x27;impresa conta che la maggior parte delle persone sia a livello convenzionale?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché a quel livello si segue ciò che il gruppo e l&#x27;autorità si aspettano: la cultura e le regole dell&#x27;organizzazione orientano fortemente il comportamento, nel bene e nel male.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Cita due situational factors context-related.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Per esempio: sistemi di ricompensa (bonus legati solo ai risultati), autorità (pressione dei superiori), burocrazia, ruoli lavorativi, cultura organizzativa, contesto nazionale.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;strumenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;h2&gt;Gestire l&#x27;etica: strumenti e tecniche&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 5 (obbligatorio). &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Il &lt;b&gt;business ethics management&lt;/b&gt; è il tentativo diretto, formale o informale, di gestire le questioni etiche attraverso politiche, pratiche e programmi. Il Crane lo presenta come un insieme di strumenti che si rafforzano a vicenda.&lt;/p&gt;

  &lt;figure&gt;&lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Componenti del business ethics management&quot;&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;80&quot;&gt;Mission e&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;96&quot;&gt;value statements&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;80&quot;&gt;Codes of&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;96&quot;&gt;ethics&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;80&quot;&gt;Ethics programmes&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;96&quot;&gt;e formazione&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;80&quot;&gt;Stakeholder&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;96&quot;&gt;engagement&lt;/text&gt;
      &lt;rect x=&quot;570&quot; y=&quot;50&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;80&quot;&gt;Accounting,&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;96&quot;&gt;auditing, reporting&lt;/text&gt;
      &lt;path d=&quot;M70 130 Q350 175 630 130&quot; fill=&quot;none&quot; stroke=&quot;var(--soft)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;30&quot; fill=&quot;var(--soft)&quot;&gt;dall&#x27;enunciato dei valori alla verifica dei risultati&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;&lt;/figure&gt;

  &lt;details open&gt;&lt;summary&gt;Codes of ethics&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Dichiarazioni scritte delle norme e dei valori che l&#x27;organizzazione si aspetta dai suoi membri. Quattro tipi:&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Tipo&lt;/th&gt;&lt;th&gt;Chi lo adotta&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Organizational / corporate code&lt;/td&gt;&lt;td&gt;una singola impresa&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Professional code&lt;/td&gt;&lt;td&gt;una professione (medici, commercialisti, ingegneri)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Industry code&lt;/td&gt;&lt;td&gt;un settore (es. tessile, chimico)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Programme / group code&lt;/td&gt;&lt;td&gt;imprese che aderiscono a un&#x27;iniziativa comune (es. UN Global Compact)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Pro: chiarezza, segnale all&#x27;esterno. Contro: possono restare di facciata (&lt;i&gt;window dressing&lt;/i&gt;) se non accompagnati da formazione, controlli e incentivi coerenti.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Ethics programmes e figure dedicate&lt;/summary&gt;&lt;div&gt;Formazione, ethics officer, hotline per le segnalazioni (whistleblowing), comitati etici. Un approccio solo di &lt;b&gt;compliance&lt;/b&gt; (rispetto delle regole, controllo e sanzioni) funziona meno di uno basato su &lt;b&gt;integrity&lt;/b&gt; (valori condivisi, responsabilità personale).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Stakeholder engagement&lt;/summary&gt;&lt;div&gt;Coinvolgere gli stakeholder nelle decisioni, dal semplice ascolto alla collaborazione e partnership. È la traduzione pratica della discourse ethics e del managing for stakeholders di Freeman.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Social and ethical accounting, auditing and reporting (SEAAR)&lt;/summary&gt;&lt;div&gt;Misurare, verificare e comunicare l&#x27;impatto sociale, etico e ambientale dell&#x27;impresa: bilanci di sostenibilità, verifiche di terzi. Le qualità richieste includono inclusività, completezza, confrontabilità, verifica esterna, continuità.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Organizational culture&lt;/summary&gt;&lt;div&gt;Nessuno strumento formale funziona contro la cultura reale: valori, norme informali, esempi dei leader. Il Crane distingue tra cultura «dichiarata» e cultura vissuta.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un codice etico da solo può non bastare?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché senza formazione, sistemi di segnalazione, incentivi coerenti e una cultura che lo sostiene resta di facciata; i fattori situazionali (sezione 6) pesano più del testo scritto.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che differenza c&#x27;è tra approccio di compliance e di integrity?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Compliance: regole, controlli e sanzioni per prevenire violazioni. Integrity: valori condivisi e responsabilità personale, per guidare le scelte anche dove le regole non arrivano.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;persone&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;h2&gt;Dipendenti, fornitori e concorrenti&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Crane et al., cap. 7 (employees) e cap. 9 (suppliers, competitors), entrambi obbligatori. Il cap. 6 (shareholders) e il cap. 8 (consumers) non sono in programma. &lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Questi capitoli applicano gli strumenti generali a due stakeholder concreti. Lo schema ricorrente è: &lt;b&gt;quali diritti e doveri&lt;/b&gt; ci sono nella relazione, e come cambiano nella globalizzazione.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Employees: diritti&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Employees: doveri&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Suppliers&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Competitors&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Diritto&lt;/th&gt;&lt;th&gt;Questioni tipiche&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Principle of non-discrimination&lt;/td&gt;&lt;td&gt;pari opportunità, diversity management, affirmative action (azioni positive)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Privacy&lt;/td&gt;&lt;td&gt;monitoraggio delle email, test, dati personali&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Due process&lt;/td&gt;&lt;td&gt;procedure eque nei licenziamenti e nelle sanzioni&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Participation and association&lt;/td&gt;&lt;td&gt;sindacati, coinvolgimento nelle decisioni&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Healthy and safe working conditions&lt;/td&gt;&lt;td&gt;sicurezza, stress, orari&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fair wages&lt;/td&gt;&lt;td&gt;salario equo, living wage (salario dignitoso)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Freedom of conscience and speech&lt;/td&gt;&lt;td&gt;whistleblowing&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Right to work&lt;/td&gt;&lt;td&gt;accesso al lavoro, lavoro precario&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Anche i dipendenti hanno &lt;b&gt;doveri&lt;/b&gt;: lealtà, onestà, non usare le risorse aziendali per sé, evitare conflitti di interesse. Il caso più delicato è il &lt;em class=&quot;t&quot;&gt;whistleblowing&lt;/em&gt; (segnalazione di illeciti): lealtà verso l&#x27;impresa e dovere verso il pubblico possono entrare in conflitto. Altri temi: lavoro e vita privata, l&#x27;impresa che «entra» nella vita dei dipendenti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Il rapporto coi fornitori è segnato dal &lt;b&gt;potere&lt;/b&gt;: grandi acquirenti possono imporre prezzi e tempi. Questioni:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;abuso di potere, lealtà e partnership di lungo periodo&lt;/li&gt;&lt;li&gt;conflitti di interesse, regali e &lt;b&gt;bribery&lt;/b&gt; (corruzione)&lt;/li&gt;&lt;li&gt;&lt;b&gt;global supply chains&lt;/b&gt;: sweatshop, lavoro minorile, sicurezza&lt;/li&gt;&lt;li&gt;&lt;b&gt;ethical sourcing&lt;/b&gt; e &lt;b&gt;fair trade&lt;/b&gt; (commercio equo): estendere gli standard etici lungo la catena&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;Domanda chiave: fin dove arriva la responsabilità dell&#x27;impresa capofila sui fornitori dei fornitori? È esattamente il tema di &lt;a href=&quot;#reti&quot;&gt;Phillips&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Anche tra concorrenti esistono limiti etici:&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;b&gt;Intensità della concorrenza&lt;/b&gt; e «dirty tricks» (spionaggio industriale, campagne denigratorie)&lt;/li&gt;&lt;li&gt;&lt;b&gt;Competitive intelligence&lt;/b&gt;: raccogliere informazioni sui concorrenti, in modo lecito o no&lt;/li&gt;&lt;li&gt;&lt;b&gt;Anti-competitive behaviour&lt;/b&gt;: cartelli, price fixing (accordi sui prezzi), predatory pricing (prezzi sotto costo per eliminare rivali), abuso di posizione dominante&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;Paradosso: la concorrenza giova alla società, ma una concorrenza senza limiti può danneggiarla. A volte i concorrenti collaborano per alzare gli standard di settore (industry codes, sezione 7).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il whistleblowing è un dilemma etico?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Mette in conflitto il dovere di lealtà verso il datore di lavoro e la libertà di coscienza o il dovere verso terzi danneggiati dall&#x27;illecito.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Cosa rende particolarmente difficili le questioni etiche con i fornitori nell&#x27;era della globalizzazione?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Le catene sono lunghe e attraversano paesi con regole diverse; l&#x27;impresa capofila ha potere commerciale ma poca visibilità e controllo diretto sui livelli lontani.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;scopo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
  &lt;h2&gt;Lo scopo dell&#x27;impresa e la creazione di valore&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Wicks et al., cap. 3 (consigliato) · Melé, cap. 7 (consigliato). &lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; titoli dei capitoli da &lt;a href=&quot;https://www.pearson.com/store/en-us/p/business-ethics/P200000006439/9780131427921&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;catalogo Pearson&lt;/a&gt; e &lt;a href=&quot;https://www.kriso.ee/business-ethics-action-seeking-human-excellence-db-9780230573109.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;indice dell&#x27;edizione 2009 (Kriso)&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Wicks et al., cap. 3&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Titolo: «Ethics, Stakeholders, Corporate Strategy, and Value Creation», con il caso &lt;b&gt;Merck &amp;amp; Co., Inc.&lt;/b&gt;&lt;/p&gt;
      &lt;p&gt;Il libro è scritto da Wicks, &lt;b&gt;Freeman&lt;/b&gt;, Werhane e Martin: il capitolo porta in chiave manageriale la stakeholder theory della sezione 3. L&#x27;idea: l&#x27;etica non è un vincolo esterno alla strategia, ma parte del modo in cui l&#x27;impresa crea valore.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; Il caso Merck usato spesso nei corsi di business ethics riguarda la decisione di sviluppare e donare il Mectizan contro la river blindness (oncocercosi), una malattia dei paesi poveri senza mercato redditizio. Verifica sul libro quale aspetto del caso viene discusso.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Melé, cap. 7&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Nell&#x27;indice dell&#x27;edizione 2009 il settimo titolo è «The purpose of the firm and mission-driven management». La numerazione è dedotta dall&#x27;ordine dei titoli nel catalogo: verificala sul libro.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-base&quot;&gt;Spiegazione di base&lt;/span&gt; Melé propone una visione umanistica: l&#x27;impresa come &lt;b&gt;comunità di persone&lt;/b&gt;, con uno scopo che va oltre il profitto (servire la società e contribuire al &lt;b&gt;common good&lt;/b&gt;), e una gestione guidata dalla missione. Il profitto resta necessario, ma come condizione e misura, non come fine ultimo.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Tre risposte alla domanda «a cosa serve un&#x27;impresa?»&lt;/h3&gt;
  &lt;p&gt;Trascina il cursore per spostarti tra le posizioni.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;purposeLab&quot;&gt;
    &lt;input type=&quot;range&quot; id=&quot;pp&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;1&quot; value=&quot;0&quot; aria-label=&quot;Posizione sullo scopo dell&#x27;impresa&quot;&gt;
    &lt;div style=&quot;display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft)&quot;&gt;&lt;span&gt;Shareholder view&lt;/span&gt;&lt;span&gt;Stakeholder view&lt;/span&gt;&lt;span&gt;Humanistic view&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;ppOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa hanno in comune il cap. 3 di Wicks e il paper di Freeman?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Freeman è coautore di entrambi; tutti e due legano etica, stakeholder e strategia nella creazione di valore, contro la separation fallacy.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In quale gruppo di Garriga &amp;amp; Melé collocheresti la visione umanistica di Melé?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Ethical, nella teoria del common good.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;reti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;
  &lt;h2&gt;Responsabilità oltre la causalità: reti e connessioni sociali&lt;/h2&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-list&quot;&gt;Reference list&lt;/span&gt; Phillips, «Ethics and Network Organizations», &lt;i&gt;Business Ethics Quarterly&lt;/i&gt;, 2010 · Schrempf, «A Social Connection Approach to Corporate Responsibility», &lt;i&gt;Business &amp;amp; Society&lt;/i&gt;, 2014 (entrambi obbligatori). &lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; contenuti dagli abstract (link in Per approfondire).&lt;/p&gt;
  &lt;p&gt;Le due letture affrontano lo stesso problema da lati diversi: &lt;b&gt;chi è responsabile&lt;/b&gt; quando il danno nasce da tanti attori, nessuno dei quali lo causa da solo?&lt;/p&gt;

  &lt;h3&gt;Phillips: le organizzazioni a rete&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;Fonte esterna&lt;/span&gt; Secondo l&#x27;abstract (&lt;a href=&quot;https://ideas.repec.org/a/cup/buetqu/v20y2010i03p533-543_00.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;), outsourcing e subappalto rendono più difficile attribuire la responsabilità. Phillips usa la &lt;b&gt;social network analysis&lt;/b&gt; (analisi delle reti sociali) per capire come la responsabilità si distribuisce tra gli attori e come questi possano negare in modo plausibile il proprio coinvolgimento. Individua tre fonti di difesa:&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Connection&lt;/h4&gt;&lt;p&gt;«Non c&#x27;entro: non ho rapporti con chi ha causato il danno». Più l&#x27;attore è lontano nella rete, più la difesa è credibile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Control&lt;/h4&gt;&lt;p&gt;«Non potevo farci niente: non controllo quel fornitore».&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Knowledge&lt;/h4&gt;&lt;p&gt;«Non lo sapevo».&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Due concetti di rete: &lt;b&gt;density&lt;/b&gt; (densità, quanti legami esistono rispetto a tutti quelli possibili) e &lt;b&gt;centrality&lt;/b&gt; (centralità, quanto un attore è collegato). Il &lt;em class=&quot;t&quot;&gt;tertius illuminans&lt;/em&gt; («il terzo che illumina») è un attore terzo, come una ONG, un giornalista o un ente di certificazione, che rende visibili i legami: aumenta densità e centralità e così indebolisce le difese di connection e knowledge.&lt;/p&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:8px;align-items:center&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;tiBtn&quot;&gt;Aggiungi il tertius illuminans&lt;/button&gt;&lt;span class=&quot;note&quot; id=&quot;netStats&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;svg id=&quot;net&quot; viewBox=&quot;0 0 680 320&quot; role=&quot;img&quot; aria-label=&quot;Rete di fornitura&quot;&gt;
