&lt;section class=&quot;part brick&quot; id=&quot;regole&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 1 · The assignment&lt;/div&gt;&lt;h2&gt;Ground rules&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;In autonomy a group of students (max 3) examine a specific research question of their interest within the themes that are part of the course (please see the course outline in the website or check out Manual’s content). The group prepares a power point that will be presented at the class in max 15-20 min. At the end of each presentation up to 5 minutes will be dedicated to questions raised by students in the class. Active participation will be part of the assessment.&lt;/div&gt;

  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Who&lt;/h4&gt;A group of &lt;strong&gt;at most 3&lt;/strong&gt; students working &lt;em&gt;in autonomy&lt;/em&gt;: you choose the topic yourselves; nobody assigns it to you.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What&lt;/h4&gt;A &lt;span class=&quot;term&quot;&gt;research question&lt;/span&gt; (a precise, answerable question) within the course themes, which you can find in the &lt;em&gt;course outline&lt;/em&gt; on the website or in the table of contents of the &lt;em&gt;Manual&lt;/em&gt; (the textbook).&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;How&lt;/h4&gt;A PowerPoint presented in class in &lt;strong&gt;15–20 minutes&lt;/strong&gt;, followed by &lt;strong&gt;up to 5 minutes&lt;/strong&gt; of questions from your classmates.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Assessed&lt;/h4&gt;&lt;span class=&quot;term&quot;&gt;Active participation&lt;/span&gt; is assessed too: asking questions during other groups’ presentations and answering questions on your own well.&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 130&quot; role=&quot;img&quot; aria-label=&quot;Timeline of a slot: 15-20 minutes of presentation and up to 5 of questions&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;60&quot; x2=&quot;760&quot; y2=&quot;60&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;rect x=&quot;40&quot; y=&quot;40&quot; width=&quot;432&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
      &lt;rect x=&quot;472&quot; y=&quot;40&quot; width=&quot;144&quot; height=&quot;40&quot; rx=&quot;0&quot; style=&quot;fill:color-mix(in oklch,var(--brick-bg) 50%,transparent);stroke:var(--brick);stroke-dasharray:4 3&quot;/&gt;
      &lt;rect x=&quot;616&quot; y=&quot;40&quot; width=&quot;144&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
      &lt;text x=&quot;256&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Presentation: at least 15&#x27;&lt;/text&gt;
      &lt;text x=&quot;544&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;up to 20&#x27;&lt;/text&gt;
      &lt;text x=&quot;688&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Q&amp;amp;A ≤ 5&#x27;&lt;/text&gt;
      &lt;g font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;104&quot;&gt;0&#x27;&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;15&#x27;&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;20&#x27;&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;104&quot; text-anchor=&quot;end&quot;&gt;25&#x27;&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;40&quot; y=&quot;24&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;A typical slot (maximum case)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;“max 15-20 min” is a ceiling: rehearse with a timer. Groups that overrun usually end up cutting the take-home message, which is the most important part.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;What makes a good research question&lt;/h3&gt;
  &lt;p&gt;The slides ask for a &lt;em&gt;specific research question&lt;/em&gt;: not a topic (“NextGenEU”) but a &lt;strong&gt;question that can be answered&lt;/strong&gt; with data or with the literature in 15 minutes. A good question is &lt;strong&gt;well delimited&lt;/strong&gt; (country, period, variable), &lt;strong&gt;linked to the course&lt;/strong&gt; and &lt;strong&gt;answerable&lt;/strong&gt; with sources you are able to read.&lt;/p&gt;
  &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;From topic to question: three examples&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Too vague&lt;/th&gt;&lt;th&gt;Better&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Trust in the EU&lt;/td&gt;&lt;td&gt;Did trust in EU institutions change after the 2022 crisis in Italy and Germany? What do the 2019–2026 Eurobarometer surveys show?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Is the euro worth it?&lt;/td&gt;&lt;td&gt;What would Slovakia’s GDP per capita have been without the euro? What do synthetic control studies estimate?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Eurobonds&lt;/td&gt;&lt;td&gt;Why do NextGenEU bonds yield more than Bunds despite their AAA rating? How much does the investor base matter?&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;p class=&quot;note&quot;&gt;Examples constructed for this summary, not taken from the slides.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;How to “participate actively” in the Q&amp;amp;A&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Useful questions to ask another group: &lt;em&gt;Which data did you use, and why those? Is the result a correlation or a causal effect? What would change in another country? What is the main limitation of the study?&lt;/em&gt; These are the same questions you must be able to answer yourselves: prepare a backup slide with details on data and methodology.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A group of 4 friends wants to present together. Is that allowed?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: the slides set a maximum of 3 members per group.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the maximum length of a slot, questions included?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;About 25 minutes: at most 15–20 minutes of presentation plus up to 5 minutes of questions.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is “Eurobonds” not acceptable as a research question?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because it is a topic, not a question: it does not state what you intend to explain or measure. It must be narrowed down to a precise question, for instance about the yield spread relative to the Bund.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;struttura&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 2 · The slides&lt;/div&gt;&lt;h2&gt;Structure of the presentation&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;The guidelines provide a six-point outline. Step through it: for each point you will find the course text and what it means in practice.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Title, group components&lt;/h4&gt;&lt;p&gt;Title and names of the group members. The best titles already contain the question or the answer, for example “Why do NGEU bonds pay more than Bunds?”.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Suggested time: a few seconds.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Research question and motivation&lt;/h4&gt;&lt;div class=&quot;slide&quot;&gt;how is the chosen topic related to the issues studied and analysed in the course&lt;/div&gt;&lt;p&gt;This is the point the slides highlight in bold: &lt;strong&gt;question&lt;/strong&gt; and &lt;strong&gt;motivation&lt;/strong&gt;. State the question in one sentence, then explain why it matters and &lt;em&gt;which part of the course it relates to&lt;/em&gt;, for example optimum currency area theory, ECB monetary policy, or fiscal rules and NGEU.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~2 minutes.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Outline of the presentation&lt;/h4&gt;&lt;p&gt;A contents slide: it tells the audience where you are heading. 3–5 items are enough.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~30 seconds.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Central part&lt;/h4&gt;&lt;div class=&quot;slide&quot;&gt;Depending on the type of contribution (empirical or review of papers): objectives, data used, methods, results and conclusions of the paper(s) read or of the empirical analysis&lt;/div&gt;&lt;p&gt;This is the core, roughly two thirds of the time. The structure is the same whether you analyse your own data or summarise papers: &lt;strong&gt;objectives → data → methods → results → conclusions&lt;/strong&gt;. The two variants are compared below.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~10–12 minutes.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Take-home message&lt;/h4&gt;&lt;p&gt;The key message, i.e. the answer to the research question in 1–3 sentences. If the audience forgets everything else, they should remember this. Add a limitation or an open question.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~1 minute.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · References&lt;/h4&gt;&lt;p&gt;Full bibliography: authors, year, title, outlet (journal, working paper series, VoxEU…), link. Use a consistent citation style, for example Author (year), “Title”, Outlet.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;One slide, not read aloud.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 92&quot; role=&quot;img&quot; aria-label=&quot;Indicative allocation of time across the six parts&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;16&quot; height=&quot;36&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;20&quot; width=&quot;80&quot; height=&quot;36&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect x=&quot;116&quot; y=&quot;20&quot; width=&quot;24&quot; height=&quot;36&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;140&quot; y=&quot;20&quot; width=&quot;520&quot; height=&quot;36&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;rect x=&quot;660&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;36&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect x=&quot;756&quot; y=&quot;20&quot; width=&quot;24&quot; height=&quot;36&quot; style=&quot;fill:var(--muted)&quot;/&gt;
        &lt;text x=&quot;76&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot;&gt;Question&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Central part: objectives · data · methods · results · conclusions&lt;/text&gt;&lt;text x=&quot;708&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot;&gt;Take-home&lt;/text&gt;&lt;text x=&quot;128&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;Outline&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;76&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;Ref.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Indicative allocation over ~18 minutes (suggested by this summary, not by the slides).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Empirical or review of papers?&lt;/h3&gt;
  &lt;div class=&quot;tabs brick&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Empirical contribution&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Review of papers&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;You carry out a small data analysis yourselves: charts, cross-country comparisons, a simple regression. Example: download trust in the ECB by country from the Eurobarometer and compare it with inflation.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt;: which relationship you want to measure.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Data used&lt;/strong&gt;: source (Eurostat, Eurobarometer, ECB), period, countries, unit of measurement.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Methods&lt;/strong&gt;: descriptive statistics, correlations, &lt;span class=&quot;term&quot;&gt;difference-in-differences&lt;/span&gt; (comparing changes between a “treated” group and a control group), etc.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Results&lt;/strong&gt;: readable charts, key figures.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conclusions&lt;/strong&gt;: what you can and cannot claim, for example that a correlation does not establish a causal effect.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;You read 2–4 papers on the same topic and compare them. For each paper (or in a comparative table):&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt;: the paper’s research question.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Data&lt;/strong&gt;: which data it uses (surveys, macro time series, market data).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Methods&lt;/strong&gt;: experiment, synthetic control, DSGE model, etc.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Results&lt;/strong&gt;: the main figures.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conclusions&lt;/strong&gt;: policy implications, and where the papers agree or disagree.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Empirical&lt;/th&gt;&lt;th&gt;Review&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Strength&lt;/td&gt;&lt;td&gt;Originality, your own charts&lt;/td&gt;&lt;td&gt;Coverage, robustness of sources&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Risk&lt;/td&gt;&lt;td&gt;Unwarranted causal conclusions&lt;/td&gt;&lt;td&gt;A flat list of summaries without synthesis&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Key slide&lt;/td&gt;&lt;td&gt;Results chart&lt;/td&gt;&lt;td&gt;Comparative table of the papers&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which five elements must appear in the central part?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Objectives, data used, methods, results and conclusions, either of the paper(s) read or of your own analysis.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;According to the guidelines, what must the motivation slide state?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;How the chosen topic relates to the issues studied and analysed in the course.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between the take-home message and the conclusions?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;The conclusions close the central part, paper by paper or analysis by analysis. The take-home message is the final synthesis: the answer to the research question in a few sentences.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 3 · Sources&lt;/div&gt;&lt;h2&gt;Where to look&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;Notice that the topics will also be dealt with during classes → try to add and contribute by reading papers, articles, reports. For all topics find references directly ECB, EC research papers, Vox.eu, think-tank websites suggested in the first class.&lt;/div&gt;
  &lt;p&gt;The message is twofold. First, the topics will also be covered in class, so the presentation must &lt;strong&gt;add&lt;/strong&gt; something (a paper, a dataset, a case study) rather than repeat the textbook. Second, sources should be taken &lt;strong&gt;from the source&lt;/strong&gt;: institutions and researchers, not newspapers or generic blogs.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ECB · European Central Bank&lt;/h4&gt;The European Central Bank publishes the &lt;em&gt;Working Paper Series&lt;/em&gt; (research), the &lt;em&gt;Economic Bulletin&lt;/em&gt; (economic and monetary analysis) and the data in the &lt;em&gt;Statistical Data Warehouse&lt;/em&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;EC research papers&lt;/h4&gt;The European Commission, especially DG ECFIN (Economic and Financial Affairs), publishes the &lt;em&gt;European Economy Discussion Papers&lt;/em&gt; and the official evaluations of NGEU and the RRF.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;VoxEU (CEPR)&lt;/h4&gt;The &lt;em&gt;policy columns&lt;/em&gt; portal of the Centre for Economic Policy Research: short articles written by the authors of the underlying papers, summarising them. They are an excellent starting point, after which you move on to the full paper. Almost all the links in the slides point here.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Think tanks&lt;/h4&gt;Independent research centres working on European policy. The exact list was given &lt;em&gt;in the first class&lt;/em&gt; and is not in the document: check your notes from the first lecture.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 210&quot; role=&quot;img&quot; aria-label=&quot;Ladder of source reliability&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;polygon points=&quot;400,10 560,200 240,200&quot; style=&quot;fill:none;stroke:var(--rule)&quot;/&gt;
        &lt;rect x=&quot;330&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Journal article&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;70&quot; width=&quot;200&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Working paper (ECB, EC, CEPR, Bank of Italy)&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;110&quot; width=&quot;260&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;VoxEU column · think-tank report&lt;/text&gt;
        &lt;rect x=&quot;240&quot; y=&quot;150&quot; width=&quot;320&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;Press, blogs: for context only&lt;/text&gt;
        &lt;text x=&quot;600&quot; y=&quot;50&quot; style=&quot;fill:var(--muted)&quot;&gt;more vetted, slower&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;170&quot; style=&quot;fill:var(--muted)&quot;&gt;faster, less vetted&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;A rough hierarchy (suggested by this summary). In practice: start from a VoxEU column and trace it back to the working paper that underpins it.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;You find a VoxEU column that fits your topic perfectly. Is citing it enough?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;It is a good start, but you should trace it back to the paper it is based on (usually a CEPR Discussion Paper or a working paper), which contains the data and methods to present in the central part.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why do the guidelines say “try to add and contribute”?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because the topics will also be covered in class: the presentation is worth more if it brings readings, data or reports that go beyond the lectures.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;fiducia&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 4 · Topic&lt;/div&gt;&lt;h2&gt;What do citizens think of the European institutions?&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;WHAT DO EUROPEAN CITIZENS THINK OF EUROPEAN INSTITUTIONS AND HOW MUCH DO THEY TRUST THEM? What is the Extent of Euro Scepticism? What is the Eurobarometer? How can it be useful? See Eurobarometer data and report.&lt;/div&gt;

  &lt;h3&gt;Key concepts&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Trust (institutional trust)&lt;/h4&gt;The extent to which citizens trust an institution (the Commission, the European Parliament, the ECB) to act competently and in their interest. It matters because EU institutions have little direct coercive power: their effectiveness depends on perceived legitimacy.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Euroscepticism&lt;/h4&gt;Opposition to or distrust of European integration. The literature distinguishes &lt;em&gt;hard&lt;/em&gt; Euroscepticism, which rejects membership itself (leaving the EU or the euro), from &lt;em&gt;soft&lt;/em&gt; Euroscepticism, which opposes specific policies or further integration. &lt;span class=&quot;note&quot;&gt;(a classic distinction in political science, not in the slides)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Eurobarometer: what it is and how it works&lt;/h3&gt;
  &lt;p&gt;It is the European Commission’s public opinion survey programme, running since the 1970s. There are several families of surveys:&lt;/p&gt;
  &lt;div class=&quot;tabs sage&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Standard&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Special&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Flash&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Parlemeter&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Published twice a year (spring and autumn) with recurring questions: trust in institutions, image of the EU, support for the euro, main concerns. Because the questions are repeated, it allows the construction of &lt;strong&gt;time series&lt;/strong&gt;.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;According to the GESIS archive documentation, the Standard Eurobarometer is conducted mainly through face-to-face interviews, on a fresh sample at each wave (&lt;span class=&quot;term&quot;&gt;repeated cross-section&lt;/span&gt;, i.e. different respondents each time), of about 1,000 respondents per country. &lt;a href=&quot;https://www.gesis.org/en/eurobarometer-data-service/data-and-documentation/standard-special-eb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS Eurobarometer Data Service&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;In-depth thematic studies (climate, digital, defence…) with longer questionnaires on a single topic.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Quick surveys, often by telephone or online, on current issues and specific groups (young people, businesses).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Eurobarometer surveys commissioned by the European Parliament, for example on perceptions of the Parliament and on the European elections.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;How to read a trust figure&lt;/h3&gt;
  &lt;p&gt;The typical question asks whether respondents “tend to trust” or “tend not to trust” an institution, plus “don’t know”. A common summary measure is &lt;span class=&quot;term&quot;&gt;net trust&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;net trust = % tend to trust − % tend not to trust&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tr&quot;&gt;Tend to trust&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;51&quot;&gt;&lt;output id=&quot;trO&quot;&gt;51%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dtr&quot;&gt;Tend not to trust&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dtr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;dtrO&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect id=&quot;bT&quot; x=&quot;0&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect id=&quot;bD&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect id=&quot;bN&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--rule)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Don’t know: &lt;b id=&quot;dkO&quot;&gt;9%&lt;/b&gt; · Net trust: &lt;b id=&quot;ntO&quot;&gt;+11&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Indicative starting values. Note that with many “don’t know” answers the same trust percentage can correspond to a very different net trust.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;What recent data show&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Trust in the EU and in national governments, spring 2025 and 2026&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;190&quot; x2=&quot;580&quot; y2=&quot;190&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;90&quot; x2=&quot;580&quot; y2=&quot;90&quot; style=&quot;stroke:var(--rule);stroke-dasharray:3 3&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;94&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;194&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;0&lt;/text&gt;
        &lt;rect x=&quot;110&quot; y=&quot;86&quot; width=&quot;70&quot; height=&quot;104&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;52%&lt;/text&gt;
        &lt;rect x=&quot;190&quot; y=&quot;118&quot; width=&quot;70&quot; height=&quot;72&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;225&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;36%&lt;/text&gt;
        &lt;rect x=&quot;350&quot; y=&quot;88&quot; width=&quot;70&quot; height=&quot;102&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;385&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;51%&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;116&quot; width=&quot;70&quot; height=&quot;74&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;37%&lt;/text&gt;
        &lt;text x=&quot;185&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Spring 2025 (EB 103)&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Spring 2026 (EB 105)&lt;/text&gt;
        &lt;rect x=&quot;70&quot; y=&quot;10&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;88&quot; y=&quot;20&quot;&gt;Trust in the EU&lt;/text&gt;&lt;rect x=&quot;210&quot; y=&quot;10&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;228&quot; y=&quot;20&quot;&gt;Trust in the national government&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Chart built from the data in the external sources below. The 2026 figure comes from a secondary analysis: it should be checked against the official report.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Spring 2025 (Standard EB 103): trust in the EU at 52%, the highest level since 2007; national government 36%, national parliament 37%. &lt;a href=&quot;https://malta.representation.ec.europa.eu/news/eurobarometer-shows-record-high-trust-eu-and-strong-support-euro-and-common-defence-and-security-2025-05-28_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission, Representation in Malta&lt;/a&gt;. Spring 2026 (EB 105, fieldwork March–April 2026): according to an analysis by the Institut Jacques Delors, trust in the EU stands at 51% against 37% for national governments. &lt;a href=&quot;https://informat.ro/en/eu/the-jacques-delors-institute-notes-that-support-for-the-eu-remains-high-but-the-differences-between-states-are-deepening-131242&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;report on the Delors analysis&lt;/a&gt;.&lt;/div&gt;
  &lt;p&gt;On average, then, Europeans trust the EU more than their own governments. Averages, however, conceal &lt;strong&gt;large cross-country differences&lt;/strong&gt;, and this is where a presentation can say something new: who is more Eurosceptic, and why? Do income, inflation, age or the sovereign debt crisis matter?&lt;/p&gt;
  &lt;details class=&quot;sage&quot;&gt;&lt;summary&gt;How the Eurobarometer can be useful for your presentation&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Cross-country comparisons&lt;/strong&gt; at a given point in time (cross-sectional data).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Trends over time&lt;/strong&gt;, for example around the 2010–12 crisis, Covid or the 2022 inflation surge.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Links with economic variables&lt;/strong&gt;: trust can be matched with unemployment or inflation (Eurostat data).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Limitations&lt;/strong&gt;: it measures stated opinions, questions and interview modes have changed over time, and a correlation does not establish a causal effect.&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Trust 45%, distrust 45%, don’t know 10%: what is net trust?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0. Public opinion is perfectly split, even though 45% trust on its own might look “low”.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does it mean that the Standard Eurobarometer is a repeated cross-section?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;A new sample is interviewed at each wave: you follow population averages over time, not the same individuals (which would be a panel).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between hard and soft Euroscepticism?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Hard: rejection of membership (leaving the EU or the euro). Soft: criticism of specific policies or of further integration, while remaining a member.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;bce&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 5 · Topic&lt;/div&gt;&lt;h2&gt;The role of trust in the ECB&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;THE ROLE OF TRUST IN THE ECB — cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&lt;/div&gt;

  &lt;h3&gt;Why trust in the central bank matters&lt;/h3&gt;
  &lt;p&gt;The ECB’s objective is price stability (2% inflation over the medium term). The main channel runs through &lt;span class=&quot;term&quot;&gt;inflation expectations&lt;/span&gt;: if firms and households believe inflation will stay at 2%, they set prices and wages accordingly and inflation tends to stay there. Expectations are then said to be &lt;span class=&quot;term&quot;&gt;anchored&lt;/span&gt;. The central bank’s &lt;span class=&quot;term&quot;&gt;credibility&lt;/span&gt; is what holds the anchor in place.&lt;/p&gt;

  &lt;h3&gt;The euro-specific problem: one central bank, many public budgets&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 220&quot; role=&quot;img&quot; aria-label=&quot;Chain: one country&#x27;s debt, fear of ECB intervention, inflation expectations across the whole area&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;News: more debt&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;in Italy, France, Spain&lt;/text&gt;
        &lt;rect x=&quot;220&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Fear:&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;the ECB will have to “help”&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Low rates / purchases&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;→ higher inflation&lt;/text&gt;
        &lt;rect x=&quot;640&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;715&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Expectations ↑&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;in Germany too&lt;/text&gt;
        &lt;path d=&quot;M180 105H216M390 105H426M600 105H636&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;rect x=&quot;200&quot; y=&quot;170&quot; width=&quot;420&quot; height=&quot;38&quot; rx=&quot;19&quot; style=&quot;fill:var(--card);stroke:var(--sage);stroke-dasharray:5 3&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;Trust in the ECB can break the chain here&lt;/text&gt;
        &lt;path d=&quot;M305 168V144&quot; style=&quot;stroke:var(--sage);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;p&gt;This fear has a name: &lt;span class=&quot;term&quot;&gt;fiscal dominance&lt;/span&gt;, the situation in which monetary policy becomes subordinated to the financing needs of public debt. In a monetary union the costs are shared: one country’s debt can translate into inflation for everyone. Hence the title &lt;em&gt;“Your debt, my inflation”&lt;/em&gt;. Those who trust the ECB to remain independent and faithful to its mandate do not revise their expectations; those who do not trust it do.&lt;/p&gt;

  &lt;div class=&quot;ext&quot;&gt;
    &lt;p&gt;&lt;strong&gt;The study behind the column.&lt;/strong&gt; A randomised information experiment on German firms, using the &lt;em&gt;Bundesbank Online Panel of Firms&lt;/em&gt; (about 7,000 firms surveyed every quarter). Pessimistic debt projections for France, Italy and Spain raised the three-year-ahead inflation expectations of firms that do &lt;em&gt;not&lt;/em&gt; trust the ECB, whereas firms with high trust did not react. The announcement of a €500 bn German debt package did not change expectations. The column is based on CEPR Discussion Paper 21595. &lt;a href=&quot;https://cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU, “Your debt, my inflation”&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The method: the information experiment (information RCT)&lt;/h3&gt;
  &lt;div class=&quot;stepper sage&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Sample&lt;/h4&gt;&lt;p&gt;A panel of firms that are periodically asked about their price and inflation expectations, and how much they trust the ECB.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Randomisation&lt;/h4&gt;&lt;p&gt;Firms are assigned to groups &lt;strong&gt;at random&lt;/strong&gt;. Random assignment ensures that the groups are, on average, identical in every respect except the information received.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Treatment&lt;/h4&gt;&lt;p&gt;One group reads a piece of information (for example debt projections for other countries); the control group does not.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Measurement&lt;/h4&gt;&lt;p&gt;Inflation expectations are elicited again. The average difference between treated and control firms is the &lt;strong&gt;causal effect&lt;/strong&gt; of the information.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Heterogeneity&lt;/h4&gt;&lt;p&gt;The effect is compared between firms with high and low trust in the ECB. This is where the role of trust emerges: the effect is present only among firms that do not trust the ECB.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Try it yourself: trust and the response of expectations&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tb&quot;&gt;Trust in the ECB&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tb&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;tbO&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;nb&quot;&gt;Debt news (additional p.p. of GDP)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;nb&quot; min=&quot;0&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;nbO&quot;&gt;10&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;90&quot; x2=&quot;580&quot; y2=&quot;90&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;rect x=&quot;80&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;50&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Before: 2.0%&lt;/text&gt;
      &lt;rect id=&quot;bceBar&quot; x=&quot;340&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;50&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; id=&quot;bceTxt&quot;&gt;After&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;3-year-ahead inflation expectation: &lt;b id=&quot;bceO&quot;&gt;2.0%&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;A toy teaching model made up for this summary: Δπᵉ = 0.03 × news × (1 − trust/100). It reproduces only the qualitative logic of the paper (those who trust the ECB do not react), &lt;strong&gt;not&lt;/strong&gt; its estimates.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;A useful connection: another VoxEU column, based on Dutch data, finds that people who perceive higher inflation or face financial difficulties trust the ECB less. Causality may therefore also run the other way, from inflation to trust. &lt;a href=&quot;https://cepr.org/voxeu/columns/high-inflation-erodes-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU, “High inflation erodes trust in the ECB”&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why can Italian debt raise the inflation expectations of a German firm?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because there is a single monetary policy: if the firm fears that the ECB will keep rates low or buy bonds to support highly indebted countries (fiscal dominance), it expects higher inflation across the whole euro area.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is the receipt of information randomised?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because treated and control groups are then identical on average, so the difference in expectations can be attributed to the information rather than to pre-existing differences between firms.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which result in the column suggests that it is &lt;em&gt;other countries’&lt;/em&gt; debt that matters?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;News about French, Italian and Spanish debt moved the expectations of German firms with low trust in the ECB, whereas a €500 bn German debt package did not change them.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;emu&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 6 · Topic&lt;/div&gt;&lt;h2&gt;How to measure the costs and benefits of joining EMU&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;HOW TO MEASURE THE COSTS/BENEFITS OF JOINING EMU. Can the benefits of joining EMU or EU be measured? (see among others, papers that use synthetic cohort methods, e.g. papers.ssrn.com/sol3/papers.cfm?abstract_id=2432446)&lt;/div&gt;
  &lt;p&gt;&lt;strong&gt;EMU&lt;/strong&gt; = &lt;span class=&quot;term&quot;&gt;Economic and Monetary Union&lt;/span&gt;: the single currency, the ECB and the coordination of economic policies. The question has two halves: &lt;em&gt;what&lt;/em&gt; theory leads us to expect, and &lt;em&gt;how&lt;/em&gt; it can be measured in practice.&lt;/p&gt;

  &lt;h3&gt;The theory: optimum currency areas&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Optimum currency area&lt;/span&gt; (OCA) theory, originating with Robert Mundell (1961), asks when it is beneficial for a group of countries to share a single currency. The main cost is the loss of the exchange rate and of an independent monetary policy, which are most valuable in the face of an &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt;: a shock that hits one country but not the others, for example a collapse in demand for its main export.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Benefits&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;No currency conversion costs (&lt;em&gt;transaction costs&lt;/em&gt;)&lt;/li&gt;&lt;li&gt;No exchange-rate uncertainty&lt;/li&gt;&lt;li&gt;Price transparency, more competition&lt;/li&gt;&lt;li&gt;More trade and financial integration&lt;/li&gt;&lt;li&gt;“Imported” anti-inflation credibility, lower interest rates&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;No devaluation to absorb asymmetric shocks&lt;/li&gt;&lt;li&gt;A “one-size-fits-all” monetary policy, which may be wrong for some members&lt;/li&gt;&lt;li&gt;Debt issued in a currency the country does not control&lt;/li&gt;&lt;li&gt;Adjustment through wages and unemployment if markets are rigid&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;ochre&quot;&gt;&lt;summary&gt;The OCA criteria: what reduces the costs&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Labour mobility&lt;/strong&gt; (Mundell): workers move to where demand is.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Price and wage flexibility&lt;/strong&gt;: adjustment takes place without the exchange rate.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Trade openness&lt;/strong&gt; (McKinnon): the more members trade with each other, the less useful the exchange rate.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Production diversification&lt;/strong&gt; (Kenen): diversified economies suffer fewer country-specific shocks.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Fiscal transfers&lt;/strong&gt;: a common budget compensates the regions hit, which is the link with NGEU (Part 8).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Symmetric shocks&lt;/strong&gt;: if business cycles are synchronised, a single monetary policy suits everyone.&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Mundell (1961), McKinnon (1963) and Kenen (1969) are regarded as the three founding contributions to the theory (see “Further reading”).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h4&gt;Interactive chart: when does joining pay off?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; role=&quot;img&quot; aria-label=&quot;Benefits and costs of monetary union as a function of trade integration&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;250&quot; x2=&quot;570&quot; y2=&quot;250&quot; style=&quot;stroke:var(--ink)&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;250&quot; x2=&quot;60&quot; y2=&quot;20&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;565&quot; y=&quot;275&quot; text-anchor=&quot;end&quot;&gt;trade integration with the area →&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;22&quot;&gt;costs / benefits&lt;/text&gt;
        &lt;path id=&quot;ocaB&quot; style=&quot;fill:none;stroke:var(--sage);stroke-width:3&quot;/&gt;
        &lt;path id=&quot;ocaC&quot; style=&quot;fill:none;stroke:var(--brick);stroke-width:3&quot;/&gt;
        &lt;line id=&quot;ocaT&quot; y1=&quot;30&quot; y2=&quot;250&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 3&quot;/&gt;
        &lt;text id=&quot;ocaTt&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;T*&lt;/text&gt;
        &lt;circle id=&quot;ocaP&quot; r=&quot;7&quot; cy=&quot;250&quot; style=&quot;fill:var(--accent)&quot;/&gt;
        &lt;text x=&quot;520&quot; y=&quot;50&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;benefits&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;235&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;600&quot;&gt;costs&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ocaF&quot;&gt;Wage flexibility and labour mobility&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ocaF&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;ocaFO&quot;&gt;40&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ocaX&quot;&gt;Country’s integration&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ocaX&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;ocaXO&quot;&gt;55&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;ocaR&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;A qualitative textbook-style diagram (à la De Grauwe): benefits rise with trade integration, costs fall. Greater flexibility shifts the cost curve down and moves the threshold T* to the left. The curves are illustrative.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The measurement problem: the counterfactual&lt;/h3&gt;
  &lt;p&gt;To measure the benefit of membership, we would need to know how &lt;em&gt;the same country would have fared without joining&lt;/em&gt;: the &lt;span class=&quot;term&quot;&gt;counterfactual&lt;/span&gt;, which is never observed. The available strategies are:&lt;/p&gt;
  &lt;div class=&quot;tabs ochre&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Before/after&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Difference-in-differences&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Synthetic control&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Compares growth before and after accession. It is naive: it attributes to membership everything else as well (the global cycle, crises, reforms).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Compares the &lt;em&gt;change&lt;/em&gt; in the country that joined with the change in countries that stayed out. It works if, absent accession, the two groups would have evolved in parallel (&lt;span class=&quot;term&quot;&gt;parallel trends&lt;/span&gt;), which is often questionable.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Builds an artificial “twin” of the country as a &lt;strong&gt;weighted average of non-member countries&lt;/strong&gt; (the &lt;span class=&quot;term&quot;&gt;donor pool&lt;/span&gt;), with weights chosen so that the twin closely replicates the country &lt;em&gt;before&lt;/em&gt; accession. After accession, the gap between the actual country and its twin estimates the effect. This is the method the slides call &lt;em&gt;synthetic cohort / synthetic counterfactual&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Ŷ&lt;sub&gt;1t&lt;/sub&gt;&lt;sup&gt;N&lt;/sup&gt; = Σ&lt;sub&gt;j&lt;/sub&gt; w&lt;sub&gt;j&lt;/sub&gt; Y&lt;sub&gt;jt&lt;/sub&gt; &amp;nbsp;&amp;nbsp; with w&lt;sub&gt;j&lt;/sub&gt; ≥ 0, Σ w&lt;sub&gt;j&lt;/sub&gt; = 1 &amp;nbsp;&amp;nbsp;&amp;nbsp;⇒&amp;nbsp;&amp;nbsp;&amp;nbsp; α̂&lt;sub&gt;1t&lt;/sub&gt; = Y&lt;sub&gt;1t&lt;/sub&gt; − Ŷ&lt;sub&gt;1t&lt;/sub&gt;&lt;sup&gt;N&lt;/sup&gt;&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;Y&lt;sub&gt;1t&lt;/sub&gt; = GDP per capita of the acceding country in year t; Y&lt;sub&gt;jt&lt;/sub&gt; = that of donor country j; w&lt;sub&gt;j&lt;/sub&gt; = weights chosen to minimise the pre-accession error; α̂&lt;sub&gt;1t&lt;/sub&gt; = estimated effect after accession. Methodological reference: Abadie, Diamond and Hainmueller (2010).&lt;/p&gt;

  &lt;h4&gt;Lab: build the synthetic country yourself&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 280&quot; role=&quot;img&quot; aria-label=&quot;Actual country and synthetic country before and after accession&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;240&quot; x2=&quot;570&quot; y2=&quot;240&quot; style=&quot;stroke:var(--ink)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;240&quot; x2=&quot;50&quot; y2=&quot;20&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
        &lt;line x1=&quot;310&quot; y1=&quot;20&quot; x2=&quot;310&quot; y2=&quot;240&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 3&quot;/&gt;&lt;text x=&quot;314&quot; y=&quot;32&quot; style=&quot;fill:var(--muted)&quot;&gt;accession&lt;/text&gt;
        &lt;text x=&quot;50&quot; y=&quot;258&quot;&gt;year 0&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;258&quot; text-anchor=&quot;end&quot;&gt;year 20&lt;/text&gt;&lt;text x=&quot;56&quot; y=&quot;16&quot;&gt;GDP per capita (index)&lt;/text&gt;
        &lt;path id=&quot;scA&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;&lt;path id=&quot;scB&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;&lt;path id=&quot;scC&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;
        &lt;path id=&quot;scS&quot; style=&quot;fill:none;stroke:var(--ochre);stroke-width:3;stroke-dasharray:7 4&quot;/&gt;
        &lt;path id=&quot;scT&quot; style=&quot;fill:none;stroke:var(--ink);stroke-width:3&quot;/&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;272&quot; x2=&quot;94&quot; y2=&quot;272&quot; style=&quot;stroke:var(--ink);stroke-width:3&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;276&quot;&gt;acceding country&lt;/text&gt;
        &lt;line x1=&quot;210&quot; y1=&quot;272&quot; x2=&quot;234&quot; y2=&quot;272&quot; style=&quot;stroke:var(--ochre);stroke-width:3;stroke-dasharray:7 4&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot;&gt;synthetic&lt;/text&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;272&quot; x2=&quot;344&quot; y2=&quot;272&quot; style=&quot;stroke:var(--rule);stroke-width:2&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;276&quot;&gt;donors A, B, C&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wA&quot;&gt;Weight of donor A&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wA&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;33&quot;&gt;&lt;output id=&quot;wAO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wB&quot;&gt;Weight of donor B&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wB&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;33&quot;&gt;&lt;output id=&quot;wBO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC&quot;&gt;Weight of donor C&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;34&quot;&gt;&lt;output id=&quot;wCO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot;&gt;Pre-accession error (RMSPE): &lt;b id=&quot;scE&quot;&gt;&lt;/b&gt; · Estimated average post-accession effect: &lt;b id=&quot;scG&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Simulated data. The weights are normalised to sum to 1. Goal: move the sliders until the dashed line tracks the black one &lt;em&gt;before&lt;/em&gt; accession (RMSPE close to 0). Only then is the post-accession gap a credible estimate. The “true” weights in the simulation are 50/30/20.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;The SSRN link in the slides (abstract 2432446) could not be verified directly through web search. The best-known study using this method, and almost certainly the one referred to (same period, May 2014), is &lt;strong&gt;Campos, Coricelli and Moretti&lt;/strong&gt;, “Economic Growth and Political Integration: Estimating the Benefits from Membership in the European Union Using the Synthetic Counterfactuals Method” (IZA DP 8162, April 2014; CEPR DP 9968, May 2014). It estimates GDP per capita and labour productivity of the countries that joined the EU in the 1973, 1980s, 1995 and 2004 enlargements, relative to a synthetic counterfactual: without integration, per capita income would have been on average about 12% lower. Effects vary across countries and over time and are negative only for Greece. &lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP9968.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR DP 9968 (PDF)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Note: the study measures membership of the &lt;strong&gt;EU&lt;/strong&gt;, not of the euro. Indeed, the slides say “EMU or EU”. For the euro itself you need analogous studies that treat the adoption of the single currency as the treatment.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is an asymmetric shock the critical case for a monetary union?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because it hits only one country: the common monetary policy cannot respond to that country alone, and the exchange rate no longer exists. Adjustment must come through wages, labour mobility or fiscal transfers.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What ensures that the synthetic country is a good counterfactual?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;That it closely replicates the actual country in the period &lt;em&gt;before&lt;/em&gt; treatment (low pre-treatment RMSPE), using non-negative weights summing to 1 on untreated countries.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In the OCA chart, what happens to T* if wages become more flexible?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;The cost curve shifts down, so T* moves to the left: less trade integration is needed for the union to pay off.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;safe&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 7 · Topic&lt;/div&gt;&lt;h2&gt;Why are NextGenEU bonds considered less safe than Bunds?&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;WHY DO NextGenEU BONDS ARE CONSIDERED LESS SAFE THAN BUNDS? See Bonfanti, G and J Marcucci (2025), “A European Safe Asset? Not Without the Investors”, Working Paper, Bank of Italy — cepr.org/voxeu/columns/european-safe-asset-will-require-bolder-steps&lt;/div&gt;

  &lt;h3&gt;Key terms&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;NextGenerationEU (NGEU)&lt;/h4&gt;The EU’s post-Covid recovery plan, financed for the first time on a large scale through &lt;strong&gt;common debt&lt;/strong&gt;: the Commission issues bonds (&lt;em&gt;EU-Bonds&lt;/em&gt;) on the markets.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Bund&lt;/h4&gt;German government bonds (&lt;em&gt;Bundesanleihen&lt;/em&gt;). They are the euro area &lt;span class=&quot;term&quot;&gt;benchmark&lt;/span&gt;: the reference risk-free security.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Safe asset&lt;/h4&gt;A security with near-zero default risk, highly &lt;strong&gt;liquid&lt;/strong&gt; (it can be bought and sold quickly without moving the price), that &lt;strong&gt;retains its value in crises&lt;/strong&gt; and is universally accepted as &lt;em&gt;collateral&lt;/em&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;The original ceiling set in 2021 was about €800 bn of borrowing by the end of 2026. For 2026 the Commission planned €180 bn of EU-Bonds, which also finance the SAFE defence programme and support for Ukraine; NGEU Green Bonds issued so far amount to €84.3 bn. &lt;a href=&quot;https://europa.eu/newsroom/ecpc-failover/pdf/ip-26-1879_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission, press release IP/26/1879&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;The puzzle&lt;/h3&gt;
  &lt;p&gt;EU bonds carry top-tier ratings and the market is now large. Yet they pay a higher yield than Bunds of the same maturity. The differential is called the &lt;span class=&quot;term&quot;&gt;spread&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;spread&lt;sub&gt;EU&lt;/sub&gt; = EU-Bond yield − Bund yield (same maturity)&lt;/div&gt;
  &lt;p&gt;If default risk is close to zero in both cases, the spread measures something else: liquidity, investor demand, institutional status.&lt;/p&gt;

  &lt;h4&gt;Decompose the spread: what happens if an obstacle is removed?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;chips&quot; id=&quot;spChips&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;spBar&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Residual spread (illustrative): &lt;b id=&quot;spO&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Click a factor to “resolve” it. The shares are &lt;strong&gt;made up for teaching purposes&lt;/strong&gt; to show the logic of the decomposition; they are not estimates from the paper.&lt;/p&gt;
  &lt;/div&gt;
  &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;The factors, explained&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Exclusion from sovereign indices.&lt;/strong&gt; The major bond indices classify the EU as a &lt;em&gt;supranational&lt;/em&gt; rather than a sovereign issuer. Funds that replicate those indices (&lt;em&gt;index tracking&lt;/em&gt;) therefore do not buy EU-Bonds: the &lt;strong&gt;investor base&lt;/strong&gt; is smaller.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Liquidity and market infrastructure.&lt;/strong&gt; Bunds have a deep futures market and a huge repurchase (&lt;em&gt;repo&lt;/em&gt;) market; for EU bonds these markets are thinner.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Temporary issuance.&lt;/strong&gt; NGEU was set up as a time-limited programme (until 2026): without permanent issuance, no stable benchmark yield curve can develop.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Fiscal status.&lt;/strong&gt; The EU does not have its own taxing power as a state does: repayment relies on the EU budget and on Member States’ contributions.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;ECB support in a crisis.&lt;/strong&gt; If investors expect the ECB to buy EU bonds in a crisis (&lt;em&gt;state-contingent&lt;/em&gt; purchases), the premium shrinks. This is the link with Part 5.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Bonfanti and Marcucci&lt;/strong&gt;, “A European Safe Asset? Not Without the Investors” (Giovanni Bonfanti, Columbia University; Juri Marcucci, Bank of Italy; version of 10 November 2025). Main argument: EU-Bonds pay more than equally safe and large sovereign issuers. The gap is linked to a narrower investor base, because EU bonds are excluded from the main bond indices for lack of formal sovereign status. Expectations of state-contingent ECB purchases can substantially reduce the premium; in the model the spread would be negligible if the EU were treated as a fully sovereign issuer. &lt;a href=&quot;https://econ.columbia.edu/wp-content/uploads/sites/18/2025/09/Giovanni-Bonfanti-Job-Market-Paper.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Paper (PDF, Columbia)&lt;/a&gt;&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;The VoxEU column cited in the slides (“A European safe asset will require bolder steps”) appears in Bonfanti’s CEPR profile, but its text could not be accessed through search: open it from the link in the slides.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Complementary reading: “The safe asset potential of EU-issued bonds” observes that EU bonds are of high quality but relatively illiquid compared with Bunds. &lt;a href=&quot;https://cepr.org/voxeu/columns/safe-asset-potential-eu-issued-bonds&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If the default risk of EU-Bonds and Bunds is close to zero, why is there a spread?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because safety is not only about credit risk: liquidity, the breadth of the investor base, index inclusion, institutional status and expected central bank support all matter.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What do bond indices have to do with it?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Many funds track sovereign bond indices. If the EU is not classified as a sovereign, those funds do not buy its bonds: demand is lower and the yield higher (Bonfanti and Marcucci).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;rrf&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 8 · Topic&lt;/div&gt;&lt;h2&gt;The macroeconomic impact of NextGenEU&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;THE MACROECONOMIC IMPACT OF NEXTGENEU — three VoxEU columns: “Macroeconomic impact of the Recovery and Resilience Facility: analysis of Italy, Spain and Greece”; “EU’s Recovery and Resilience Facility: experience and lessons for the next multiannual [financial framework]”; “Surprisingly, Italy’s Resilience and Recovery Facility plan is working”.&lt;/div&gt;

  &lt;h3&gt;How the RRF works&lt;/h3&gt;
  &lt;p&gt;The core of NGEU is the &lt;span class=&quot;term&quot;&gt;Recovery and Resilience Facility&lt;/span&gt; (RRF): &lt;em&gt;grants&lt;/em&gt; and &lt;em&gt;loans&lt;/em&gt; to Member States, tied to a national plan. In Italy this is the PNRR (Piano Nazionale di Ripresa e Resilienza, the National Recovery and Resilience Plan). Its distinctive feature is &lt;span class=&quot;term&quot;&gt;performance-based conditionality&lt;/span&gt;: funds are disbursed in instalments only when the country meets agreed &lt;span class=&quot;term&quot;&gt;milestones and targets&lt;/span&gt;, i.e. qualitative milestones (a reform adopted) and quantitative targets (km of railway, nurseries built).&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 150&quot; role=&quot;img&quot; aria-label=&quot;RRF cycle: plan, milestones, payment request, assessment, disbursement&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;66&quot;&gt;National plan&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;reforms + investment&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;66&quot;&gt;Approval&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;Commission + Council&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;395&quot; y=&quot;66&quot;&gt;Milestones&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;&amp;amp; targets met&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;66&quot;&gt;Payment request&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;and assessment&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;66&quot;&gt;Disbursement&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;of the instalment&lt;/text&gt;
        &lt;path d=&quot;M140 70H166M300 70H326M460 70H486M620 70H646&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M720 102 Q720 140 395 140 Q395 140 395 104&quot; style=&quot;fill:none;stroke:var(--muted);stroke-dasharray:4 3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;134&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;next instalment&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Three channels of impact&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Demand&lt;/h4&gt;Public spending and investment raise aggregate demand in the short run. The effect depends on the &lt;span class=&quot;term&quot;&gt;fiscal multiplier&lt;/span&gt;, i.e. by how many euros GDP rises for each euro spent.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Supply&lt;/h4&gt;Investment (digital, green transition, infrastructure) and reforms (justice, public administration) raise &lt;span class=&quot;term&quot;&gt;potential output&lt;/span&gt; in the medium to long run.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Financial&lt;/h4&gt;Common debt and grants, which do not add to national debt, reduce the spreads of the most indebted countries and create fiscal space.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Simulator: how much additional GDP?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rS&quot;&gt;Annual funds (% of GDP)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rS&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;rSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rA&quot;&gt;Absorption (share actually spent)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rA&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;rAO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rM&quot;&gt;Fiscal multiplier&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rM&quot; min=&quot;0&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;rMO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rL&quot;&gt;Additionality (does not replace already planned spending)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rL&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;rLO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;15&quot; width=&quot;600&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate-bg)&quot;/&gt;&lt;rect id=&quot;rBar&quot; x=&quot;0&quot; y=&quot;15&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Short-run impact on the level of GDP: &lt;b id=&quot;rO&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ΔGDP/GDP ≈ funds × absorption × additionality × multiplier&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;A teaching formula for short-run demand effects only: it does not capture supply-side effects or effects on spreads. Note that with low absorption even large funds achieve little, which is the issue of the “absorption bottlenecks” mentioned in the columns.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;What the columns in the slides say&lt;/h3&gt;
  &lt;div class=&quot;tabs slate&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Italy, Spain, Greece&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Lessons for the next MFF&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Italy’s PNRR&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;ext&quot;&gt;A descriptive, preliminary study based on simple counterfactual comparisons: the results are consistent with a positive effect of the RRF on real GDP, stronger on employment and investment, and with an expected effect on potential output in subsequent years. The Italian plan is worth 9.1% of GDP, of which 3.4% in grants. Since 2020 the agencies Fitch and DBRS Morningstar have cited the RRF positively in every rating decision on Spain, Greece and Italy. The authors note that the empirical literature on realised effects is still scarce. &lt;a href=&quot;https://cepr.org/voxeu/columns/macroeconomic-impact-recovery-and-resilience-facility-analysis-italy-spain-and-greece&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;ext&quot;&gt;The RRF is presented as a test case for &lt;em&gt;performance-based&lt;/em&gt; fiscal policy. It supported demand, encouraged reforms and strengthened EU fiscal integration; however, complex plans and administrative bottlenecks slowed disbursements. Recommendation: future EU budget instruments (the &lt;span class=&quot;term&quot;&gt;Multiannual Financial Framework&lt;/span&gt;, MFF) should link reforms and investment, with targeted and flexible plans. The text corresponds to IMF Working Paper WP/26/114 (Busse, Caselli, Fotiou, June 2026). &lt;a href=&quot;https://cepr.org/voxeu/columns/eus-recovery-and-resilience-facility-experience-and-lessons-next-multiannual&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://www.bookstore.imf.org/books/the-eu-s-recovery-and-resilience-facility-experience-and-lessons-for-the-next-multiannual-financial-framework&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;ext&quot;&gt;Column by Francesco Giavazzi and Chiara Goretti (21 May 2024). The full text could not be accessed through search; the related CEPR Policy Insight 130, at the mid-point of the PNRR, reports cases of reforms launched with surprisingly rapid results in some areas. In 2026 the Commission approved the ninth instalment (€12.8 bn), bringing Italy to 85% of its allocated funds. &lt;a href=&quot;https://cepr.org/publications/policy-insight-130-italys-rrf-plan-working-or-it-just-another-waste-money&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR Policy Insight 130&lt;/a&gt; · &lt;a href=&quot;https://en.ilsole24ore.com/art/the-eu-disburses-to-italy-128-billion-pnrr-and-ninth-tranche-AIq9niSD&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Sole 24 Ore&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;The RRF has an envelope of €577 bn, to be mobilised in principle by August 2026, according to a policy brief by the Institut Jacques Delors (2026). &lt;a href=&quot;https://institutdelors.eu/content/uploads/2026/05/PB260512_Performances_post_covid_sud_Europe_Jaillet_Rubio_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Institut Jacques Delors (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Why measuring the impact is hard (and the link with Part 6)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Here too the problem is the &lt;strong&gt;counterfactual&lt;/strong&gt;: what would have happened without the RRF? The years 2021–2026 combine the post-Covid rebound, the 2022 energy shock, inflation and the ECB’s rate hikes. One needs comparisons across countries receiving funds of different intensity (a logic similar to difference-in-differences) or macroeconomic models (for example the Commission’s QUEST model or NiGEM). Part 6 shows the same tools applied to EU membership.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does it mean that the RRF is “performance-based”?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;That payments are tied to the achievement of milestones (qualitative) and targets (quantitative), not to the expenditure incurred.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does low absorption reduce the impact even when funds are large?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because the demand effect comes from actual spending: funds that are allocated but not spent do not move GDP.&lt;/div&gt;&lt;/div&gt;
