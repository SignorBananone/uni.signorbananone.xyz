    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which channel links the RRF to sovereign spreads?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;The financial channel: common debt and grants reduce the borrowing needs and perceived risk of the most indebted countries, and rating agencies cite this in their decisions.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;voto&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 9 · The mark&lt;/div&gt;&lt;h2&gt;How the presentation counts&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;The work is assessed in thirties and weights 30% on the total mark. e.g. teamwork 27, written exam 24, final mark = (27*0.3+24*0.7) = 8.1+16.8 = 24.9 → 25&lt;/div&gt;
  &lt;p&gt;The presentation receives a mark out of 30 (&lt;em&gt;in thirties&lt;/em&gt;) that weighs &lt;strong&gt;30%&lt;/strong&gt;; the written exam accounts for the remaining &lt;strong&gt;70%&lt;/strong&gt;. The final mark is a &lt;strong&gt;weighted average&lt;/strong&gt;, rounded to the nearest integer:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;final mark = 0.3 × teamwork + 0.7 × written exam&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vT&quot;&gt;Teamwork&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vT&quot; min=&quot;18&quot; max=&quot;30&quot; value=&quot;27&quot;&gt;&lt;output id=&quot;vTO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vE&quot;&gt;Written exam&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vE&quot; min=&quot;18&quot; max=&quot;30&quot; value=&quot;24&quot;&gt;&lt;output id=&quot;vEO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect id=&quot;vBt&quot; x=&quot;0&quot; y=&quot;15&quot; height=&quot;30&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect id=&quot;vBe&quot; y=&quot;15&quot; height=&quot;30&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;line x1=&quot;600&quot; y1=&quot;8&quot; x2=&quot;600&quot; y2=&quot;52&quot; style=&quot;stroke:var(--muted)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;vO&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Bar: contribution of the presentation (terracotta) and of the written exam (ochre) out of 30. The example in the slides rounds 24.9 to 25; the slides do not say how an exact .5 is rounded. Honours (&lt;em&gt;lode&lt;/em&gt;) and minimum marks are not specified in the document.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Teamwork 30, written exam 22: final mark?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0.3×30 + 0.7×22 = 9 + 15.4 = 24.4 → 24.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;How many points of the final mark is each additional point in the presentation worth?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0.3 points (against 0.7 for each point in the written exam).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Resources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Each entry is either cited in the slides or needed to understand them. Data, descriptions and links come from web searches: they are an &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid g2 refs&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eurobarometer &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;European Commission · GESIS data archive&lt;/div&gt;&lt;p&gt;Half-yearly (Standard) and thematic surveys of European public opinion, including trust in institutions. It is the primary source for Topic 4; the microdata can be downloaded from GESIS.&lt;/p&gt;&lt;a href=&quot;https://www.gesis.org/en/eurobarometer-data-service/data-and-documentation/standard-special-eb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS Eurobarometer Data Service&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“Your debt, my inflation: The role of trust in the ECB” &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · based on CEPR DP 21595&lt;/div&gt;&lt;p&gt;A randomised experiment on German firms: news about other countries’ debt raises the inflation expectations only of firms that do not trust the ECB. Relevant because it links trust, monetary union and fiscal dominance.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“High inflation erodes trust in the ECB” &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · Dutch data&lt;/div&gt;&lt;p&gt;Shows the reverse link: perceived inflation reduces trust. Useful for discussing causality.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/high-inflation-erodes-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Campos, Coricelli, Moretti (2014) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;CEPR DP 9968 / IZA DP 8162&lt;/div&gt;&lt;p&gt;Benefits of EU membership estimated with synthetic counterfactuals: per capita income on average about 12% higher, with Greece the only negative exception. The reference paper for Topic 6 (probably the one behind the SSRN link in the slides).&lt;/p&gt;&lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP9968.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR PDF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Abadie, Diamond, Hainmueller (2010) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;JASA 105(490): 493–505 · doi 10.1198/jasa.2009.ap08746&lt;/div&gt;&lt;p&gt;The methodological article on synthetic control, applied to California’s tobacco control programme (Proposition 99). It explains how the weights are chosen and how inference is conducted.&lt;/p&gt;&lt;a href=&quot;https://www.mit.edu/~jhainm/Paper/ccs.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF (MIT)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mundell (1961), McKinnon (1963), Kenen (1969) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Optimum currency area theory&lt;/div&gt;&lt;p&gt;The three founding contributions: factor mobility, trade openness, diversification. The theoretical basis for the costs and benefits of EMU.&lt;/p&gt;&lt;a href=&quot;https://www.diw.de/de/diw_01.c.412107.de/optimum_currency_area.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DIW glossary, “Optimum Currency Area”&lt;/a&gt; · &lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP7645.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR DP 7645, “An Optimum Currency Area Odyssey”&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bonfanti, Marcucci (2025) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Working paper · Columbia / Bank of Italy&lt;/div&gt;&lt;p&gt;“A European Safe Asset? Not Without the Investors”: the EU-Bond spread depends on the investor base (exclusion from sovereign indices) and on expected ECB support. The key reading for Topic 7.&lt;/p&gt;&lt;a href=&quot;https://econ.columbia.edu/wp-content/uploads/sites/18/2025/09/Giovanni-Bonfanti-Job-Market-Paper.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“A European safe asset will require bolder steps” &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · Bonfanti (according to the CEPR profile)&lt;/div&gt;&lt;p&gt;The column cited in the slides. Its content could not be verified through search: read it directly.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/european-safe-asset-will-require-bolder-steps&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;European Commission, EU-Bonds 2026 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Press release IP/26/1879&lt;/div&gt;&lt;p&gt;The 2026 issuance plan (€180 bn in total), for NGEU, SAFE and Ukraine. Useful for the size of the EU bond market.&lt;/p&gt;&lt;a href=&quot;https://europa.eu/newsroom/ecpc-failover/pdf/ip-26-1879_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The RRF in Italy, Spain and Greece &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column&lt;/div&gt;&lt;p&gt;Early empirical evidence on the realised effects of the RRF: positive on GDP, employment and investment.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/macroeconomic-impact-recovery-and-resilience-facility-analysis-italy-spain-and-greece&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Busse, Caselli, Fotiou (2026) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;IMF WP/26/114 · VoxEU column on lessons for the MFF&lt;/div&gt;&lt;p&gt;An assessment of the RRF: demand support, reforms, stabilisation of debt markets thanks to common borrowing; absorption problems.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/eus-recovery-and-resilience-facility-experience-and-lessons-next-multiannual&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://www.bookstore.imf.org/books/the-eu-s-recovery-and-resilience-facility-experience-and-lessons-for-the-next-multiannual-financial-framework&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Giavazzi, Goretti (2024) &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · CEPR Policy Insight 130&lt;/div&gt;&lt;p&gt;“Surprisingly, Italy’s RRF plan is working”: at the mid-point, some PNRR reforms show rapid results.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/surprisingly-italys-resilience-and-recovery-facility-plan-working&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://cepr.org/publications/policy-insight-130-italys-rrf-plan-working-or-it-just-another-waste-money&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Policy Insight 130&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;On the other course materials: it was not possible to consult the &lt;code&gt;corso/&lt;/code&gt; folder, because its contents could not be listed with the available tools. The links with the other lectures (OCA theory, the ECB, NGEU) are therefore reconstructed from general knowledge and should be checked against the course syllabus and the Manual.&lt;/p&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;.tablist button&#x27;),panels=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),cur=0;
    steps.forEach(function(_,i){var b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.textContent=i+1;b.setAttribute(&#x27;aria-label&#x27;,&#x27;Step &#x27;+(i+1));b.addEventListener(&#x27;click&#x27;,function(){go(i)});dots.appendChild(b);});
    function go(i){cur=i;steps.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});dots.querySelectorAll(&#x27;button&#x27;).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){go(Math.max(0,cur-1))});next.addEventListener(&#x27;click&#x27;,function(){go(Math.min(steps.length-1,cur+1))});go(0);
  });
  // self-check
  document.querySelectorAll(&#x27;.quiz .q&#x27;).forEach(function(q){
    var b=q.querySelector(&#x27;button&#x27;);b.addEventListener(&#x27;click&#x27;,function(){var on=q.classList.toggle(&#x27;show&#x27;);b.textContent=on?&#x27;Hide answer&#x27;:&#x27;Show answer&#x27;;});
  });
  // active contents link
  var links=document.querySelectorAll(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)});}});},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}
  function f1(n,d){return n.toFixed(d===undefined?1:d)}
  function on(ids,fn){ids.forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,fn)});fn();}
  function path(pts){return pts.map(function(p,i){return (i?&#x27;L&#x27;:&#x27;M&#x27;)+p[0].toFixed(1)+&#x27; &#x27;+p[1].toFixed(1)}).join(&#x27;&#x27;)}

  // net trust
  on([&#x27;tr&#x27;,&#x27;dtr&#x27;],function(e){
    var t=+$(&#x27;tr&#x27;).value,d=+$(&#x27;dtr&#x27;).value;
    if(t+d&gt;100){if(e&amp;&amp;e.target.id===&#x27;tr&#x27;){d=100-t;$(&#x27;dtr&#x27;).value=d}else{t=100-d;$(&#x27;tr&#x27;).value=t}}
    var n=100-t-d;$(&#x27;trO&#x27;).textContent=t+&#x27;%&#x27;;$(&#x27;dtrO&#x27;).textContent=d+&#x27;%&#x27;;$(&#x27;dkO&#x27;).textContent=n+&#x27;%&#x27;;
    $(&#x27;ntO&#x27;).textContent=(t-d&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+(t-d);
    $(&#x27;bT&#x27;).setAttribute(&#x27;width&#x27;,t*6);$(&#x27;bD&#x27;).setAttribute(&#x27;x&#x27;,t*6);$(&#x27;bD&#x27;).setAttribute(&#x27;width&#x27;,d*6);$(&#x27;bN&#x27;).setAttribute(&#x27;x&#x27;,(t+d)*6);$(&#x27;bN&#x27;).setAttribute(&#x27;width&#x27;,n*6);
  });

  // trust in the ECB
  on([&#x27;tb&#x27;,&#x27;nb&#x27;],function(){
    var tr=+$(&#x27;tb&#x27;).value,nw=+$(&#x27;nb&#x27;).value,v=2+0.03*nw*(1-tr/100),h=v*25;
    $(&#x27;tbO&#x27;).textContent=tr;$(&#x27;nbO&#x27;).textContent=nw;
    $(&#x27;bceBar&#x27;).setAttribute(&#x27;y&#x27;,90-h);$(&#x27;bceBar&#x27;).setAttribute(&#x27;height&#x27;,h);
    $(&#x27;bceTxt&#x27;).textContent=&#x27;After: &#x27;+f1(v,2)+&#x27;%&#x27;;$(&#x27;bceO&#x27;).textContent=f1(v,2)+&#x27;%&#x27;;
  });

  // OCA
  on([&#x27;ocaF&#x27;,&#x27;ocaX&#x27;],function(){
    var F=+$(&#x27;ocaF&#x27;).value,X=+$(&#x27;ocaX&#x27;).value,k=210-1.3*F;
    function B(T){return 20+1.8*T}function C(T){return k-(k-15)*T/100}
    function px(T){return 60+T*5}function py(v){return 250-Math.min(v,220)}
    var b=[],c=[];for(var T=0;T&lt;=100;T+=5){b.push([px(T),py(B(T))]);c.push([px(T),py(C(T))]);}
    $(&#x27;ocaB&#x27;).setAttribute(&#x27;d&#x27;,path(b));$(&#x27;ocaC&#x27;).setAttribute(&#x27;d&#x27;,path(c));
    var ts=(k-20)/(1.8+(k-15)/100);
    [&#x27;x1&#x27;,&#x27;x2&#x27;].forEach(function(a){$(&#x27;ocaT&#x27;).setAttribute(a,px(ts))});$(&#x27;ocaTt&#x27;).setAttribute(&#x27;x&#x27;,px(ts));
    $(&#x27;ocaP&#x27;).setAttribute(&#x27;cx&#x27;,px(X));
    $(&#x27;ocaFO&#x27;).textContent=F;$(&#x27;ocaXO&#x27;).textContent=X;
    var net=B(X)-C(X);
    $(&#x27;ocaR&#x27;).innerHTML=&#x27;Threshold T* ≈ &lt;b&gt;&#x27;+Math.round(ts)+&#x27;&lt;/b&gt; · country’s net benefit: &lt;b&gt;&#x27;+(net&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+Math.round(net)+&#x27;&lt;/b&gt; → &#x27;+(net&gt;0?&#x27;joining the union pays off&#x27;:&#x27;not yet worth joining&#x27;);
  });

  // synthetic control
  (function(){
    var Y=[],A=[],Bd=[],Cd=[];
    for(var t=0;t&lt;=20;t++){
      var a=100+1.2*t+2*Math.sin(t/2),b=95+3*t,c=105+1.8*t-0.03*t*t;
      A.push(a);Bd.push(b);Cd.push(c);Y.push(0.5*a+0.3*b+0.2*c+(t&gt;10?1.2*(t-10):0));
    }
    function px(t){return 50+t*26}function py(v){return 240-(v-85)*2.75}
    function ser(s){return path(s.map(function(v,t){return [px(t),py(v)]}))}
    $(&#x27;scA&#x27;).setAttribute(&#x27;d&#x27;,ser(A));$(&#x27;scB&#x27;).setAttribute(&#x27;d&#x27;,ser(Bd));$(&#x27;scC&#x27;).setAttribute(&#x27;d&#x27;,ser(Cd));$(&#x27;scT&#x27;).setAttribute(&#x27;d&#x27;,ser(Y));
    on([&#x27;wA&#x27;,&#x27;wB&#x27;,&#x27;wC&#x27;],function(){
      var a=+$(&#x27;wA&#x27;).value,b=+$(&#x27;wB&#x27;).value,c=+$(&#x27;wC&#x27;).value,s=a+b+c||1;a/=s;b/=s;c/=s;
      $(&#x27;wAO&#x27;).textContent=Math.round(a*100)+&#x27;%&#x27;;$(&#x27;wBO&#x27;).textContent=Math.round(b*100)+&#x27;%&#x27;;$(&#x27;wCO&#x27;).textContent=Math.round(c*100)+&#x27;%&#x27;;
      var S=A.map(function(_,t){return a*A[t]+b*Bd[t]+c*Cd[t]});
      $(&#x27;scS&#x27;).setAttribute(&#x27;d&#x27;,ser(S));
      var e=0,g=0;for(var t=0;t&lt;=10;t++)e+=Math.pow(Y[t]-S[t],2);for(t=11;t&lt;=20;t++)g+=Y[t]-S[t];
      $(&#x27;scE&#x27;).textContent=f1(Math.sqrt(e/11),2);$(&#x27;scG&#x27;).textContent=(g&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+f1(g/10)+&#x27; points (true effect: +6.6)&#x27;;
    });
  })();

  // spread
  (function(){
    var F=[[&#x27;Exclusion from sovereign indices&#x27;,12],[&#x27;Liquidity / futures / repo&#x27;,8],[&#x27;Uncertain ECB backstop&#x27;,6],[&#x27;Temporary issuance&#x27;,5],[&#x27;No own fiscal power&#x27;,5]],off={};
    var cols=[&#x27;var(--slate)&#x27;,&#x27;var(--ochre)&#x27;,&#x27;var(--sage)&#x27;,&#x27;var(--brick)&#x27;,&#x27;var(--accent)&#x27;];
    F.forEach(function(f,i){var b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.className=&#x27;btn&#x27;;b.textContent=f[0];b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);
      b.style.borderColor=cols[i];b.addEventListener(&#x27;click&#x27;,function(){off[i]=!off[i];b.setAttribute(&#x27;aria-pressed&#x27;,off[i]);b.style.textDecoration=off[i]?&#x27;line-through&#x27;:&#x27;none&#x27;;b.style.opacity=off[i]?.55:1;draw()});$(&#x27;spChips&#x27;).appendChild(b);});
    function draw(){
      var g=$(&#x27;spBar&#x27;),x=0,tot=0,h=&#x27;&#x27;;
      F.forEach(function(f,i){if(off[i])return;var w=f[1]*15;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;20&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;44&quot; style=&quot;fill:&#x27;+cols[i]+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(x+w/2)+&#x27;&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;&#x27;+f[1]+&#x27;&lt;/text&gt;&#x27;;x+=w;tot+=f[1];});
      h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;90&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;basis points (bp) above the Bund · 1 bp = 0.01%&lt;/text&gt;&#x27;;
      g.innerHTML=h;$(&#x27;spO&#x27;).textContent=tot+&#x27; bp&#x27;;
    }
    draw();
  })();

  // RRF
  on([&#x27;rS&#x27;,&#x27;rA&#x27;,&#x27;rM&#x27;,&#x27;rL&#x27;],function(){
    var s=$(&#x27;rS&#x27;).value/10,a=$(&#x27;rA&#x27;).value/100,m=$(&#x27;rM&#x27;).value/10,l=$(&#x27;rL&#x27;).value/100,v=s*a*m*l;
    $(&#x27;rSO&#x27;).textContent=f1(s)+&#x27;%&#x27;;$(&#x27;rAO&#x27;).textContent=Math.round(a*100)+&#x27;%&#x27;;$(&#x27;rMO&#x27;).textContent=f1(m);$(&#x27;rLO&#x27;).textContent=Math.round(l*100)+&#x27;%&#x27;;
    $(&#x27;rBar&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,v/3*600));$(&#x27;rO&#x27;).textContent=&#x27;+&#x27;+f1(v,2)+&#x27;% of GDP&#x27;;
  });

  // mark
  on([&#x27;vT&#x27;,&#x27;vE&#x27;],function(){
    var t=+$(&#x27;vT&#x27;).value,e=+$(&#x27;vE&#x27;).value,f=0.3*t+0.7*e;
    $(&#x27;vTO&#x27;).textContent=t;$(&#x27;vEO&#x27;).textContent=e;
    $(&#x27;vBt&#x27;).setAttribute(&#x27;width&#x27;,0.3*t*20);$(&#x27;vBe&#x27;).setAttribute(&#x27;x&#x27;,0.3*t*20);$(&#x27;vBe&#x27;).setAttribute(&#x27;width&#x27;,0.7*e*20);
    $(&#x27;vO&#x27;).innerHTML=&#x27;(0.3 × &#x27;+t+&#x27;) + (0.7 × &#x27;+e+&#x27;) = &#x27;+f1(0.3*t)+&#x27; + &#x27;+f1(0.7*e)+&#x27; = &#x27;+f1(f)+&#x27; → &lt;b&gt;&#x27;+Math.round(f)+&#x27;/30&lt;/b&gt;&#x27;;
  });
})();
&lt;/script&gt;
