        &lt;line x1=&quot;310&quot; y1=&quot;20&quot; x2=&quot;310&quot; y2=&quot;240&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 3&quot;/&gt;&lt;text x=&quot;314&quot; y=&quot;32&quot; style=&quot;fill:var(--muted)&quot;&gt;adesione&lt;/text&gt;
        &lt;text x=&quot;50&quot; y=&quot;258&quot;&gt;anno 0&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;258&quot; text-anchor=&quot;end&quot;&gt;anno 20&lt;/text&gt;&lt;text x=&quot;56&quot; y=&quot;16&quot;&gt;PIL pro capite (indice)&lt;/text&gt;
        &lt;path id=&quot;scA&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;&lt;path id=&quot;scB&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;&lt;path id=&quot;scC&quot; style=&quot;fill:none;stroke:var(--rule);stroke-width:1.5&quot;/&gt;
        &lt;path id=&quot;scS&quot; style=&quot;fill:none;stroke:var(--ochre);stroke-width:3;stroke-dasharray:7 4&quot;/&gt;
        &lt;path id=&quot;scT&quot; style=&quot;fill:none;stroke:var(--ink);stroke-width:3&quot;/&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;272&quot; x2=&quot;94&quot; y2=&quot;272&quot; style=&quot;stroke:var(--ink);stroke-width:3&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;276&quot;&gt;paese entrato&lt;/text&gt;
        &lt;line x1=&quot;210&quot; y1=&quot;272&quot; x2=&quot;234&quot; y2=&quot;272&quot; style=&quot;stroke:var(--ochre);stroke-width:3;stroke-dasharray:7 4&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot;&gt;sintetico&lt;/text&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;272&quot; x2=&quot;344&quot; y2=&quot;272&quot; style=&quot;stroke:var(--rule);stroke-width:2&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;276&quot;&gt;donatori A, B, C&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wA&quot;&gt;Peso donatore A&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wA&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;33&quot;&gt;&lt;output id=&quot;wAO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wB&quot;&gt;Peso donatore B&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wB&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;33&quot;&gt;&lt;output id=&quot;wBO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC&quot;&gt;Peso donatore C&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;34&quot;&gt;&lt;output id=&quot;wCO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot;&gt;Errore pre-adesione (RMSPE): &lt;b id=&quot;scE&quot;&gt;&lt;/b&gt; · Effetto medio stimato post: &lt;b id=&quot;scG&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Dati simulati. I pesi vengono normalizzati a somma 1. Obiettivo: muovete i cursori finché la linea tratteggiata ricalca quella nera &lt;em&gt;prima&lt;/em&gt; dell’adesione (RMSPE vicino a 0). Solo allora la distanza dopo l’adesione è una stima credibile. I pesi “veri” della simulazione sono 50/30/20.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;Il link SSRN delle slide (abstract 2432446) non si è potuto verificare direttamente con la ricerca web. Lo studio più noto con questo metodo, e quasi certamente quello indicato (stesso periodo, maggio 2014), è &lt;strong&gt;Campos, Coricelli e Moretti&lt;/strong&gt;, “Economic Growth and Political Integration: Estimating the Benefits from Membership in the European Union Using the Synthetic Counterfactuals Method” (IZA DP 8162, aprile 2014; CEPR DP 9968, maggio 2014). Stima PIL pro capite e produttività dei paesi entrati nell’UE con gli allargamenti del 1973, degli anni ’80, del 1995 e del 2004, rispetto a un controfattuale sintetico: senza integrazione il reddito pro capite sarebbe stato in media circa il 12% più basso. Gli effetti variano tra paesi e nel tempo e sono negativi solo per la Grecia. &lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP9968.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR DP 9968 (PDF)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Attenzione: lo studio misura l’adesione all’&lt;strong&gt;UE&lt;/strong&gt;, non all’euro. Le slide infatti dicono “EMU or EU”. Per l’euro in sé servono studi analoghi, con l’adozione della moneta unica come trattamento.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché uno shock asimmetrico è il caso critico per un’unione monetaria?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché colpisce un solo paese: la politica monetaria comune non può rispondere solo per lui e il cambio non esiste più. L’aggiustamento deve passare da salari, mobilità del lavoro o trasferimenti fiscali.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Cosa garantisce che il paese sintetico sia un buon controfattuale?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Che replichi bene il paese reale nel periodo &lt;em&gt;prima&lt;/em&gt; del trattamento (RMSPE pre basso), con pesi non negativi a somma 1 su paesi non trattati.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Nel grafico OCA, cosa succede a T* se i salari diventano più flessibili?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;La curva dei costi scende, quindi T* si sposta a sinistra: basta meno integrazione commerciale perché l’unione convenga.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;safe&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 7 · Tema&lt;/div&gt;&lt;h2&gt;Perché i titoli NextGenEU sono considerati meno sicuri dei Bund?&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;WHY DO NextGenEU BONDS ARE CONSIDERED LESS SAFE THAN BUNDS? See Bonfanti, G and J Marcucci (2025), “A European Safe Asset? Not Without the Investors”, Working Paper, Bank of Italy — cepr.org/voxeu/columns/european-safe-asset-will-require-bolder-steps&lt;/div&gt;

  &lt;h3&gt;Le parole del tema&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;NextGenerationEU (NGEU)&lt;/h4&gt;Il piano di ripresa post-Covid dell’UE, finanziato per la prima volta su larga scala con &lt;strong&gt;debito comune&lt;/strong&gt;: la Commissione emette obbligazioni (&lt;em&gt;EU-Bonds&lt;/em&gt;) sui mercati.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Bund&lt;/h4&gt;I titoli di Stato tedeschi (&lt;em&gt;Bundesanleihen&lt;/em&gt;). Sono il &lt;span class=&quot;term&quot;&gt;benchmark&lt;/span&gt; dell’area euro: il titolo di riferimento privo di rischio.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Safe asset&lt;/h4&gt;Un titolo con rischio di default quasi nullo, molto &lt;strong&gt;liquido&lt;/strong&gt; (si compra e vende in fretta senza muovere il prezzo), che &lt;strong&gt;tiene il valore nelle crisi&lt;/strong&gt; e che tutti accettano come &lt;em&gt;collateral&lt;/em&gt; (garanzia).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Il tetto originario fissato nel 2021 era di circa €800 mld di raccolta entro fine 2026. Per il 2026 la Commissione ha pianificato €180 mld di EU-Bonds, che finanziano anche il programma SAFE per la difesa e il sostegno all’Ucraina; i NGEU Green Bonds emessi finora ammontano a €84,3 mld. &lt;a href=&quot;https://europa.eu/newsroom/ecpc-failover/pdf/ip-26-1879_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea, comunicato IP/26/1879&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Il puzzle&lt;/h3&gt;
  &lt;p&gt;I titoli UE hanno rating ai massimi livelli e il mercato è ormai grande. Eppure pagano un rendimento più alto dei Bund di pari durata. Il differenziale si chiama &lt;span class=&quot;term&quot;&gt;spread&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;spread&lt;sub&gt;EU&lt;/sub&gt; = rendimento EU-Bond − rendimento Bund (stessa scadenza)&lt;/div&gt;
  &lt;p&gt;Se il rischio di default è quasi nullo in entrambi i casi, lo spread misura qualcos’altro: liquidità, domanda degli investitori, status istituzionale.&lt;/p&gt;

  &lt;h4&gt;Scomponi lo spread: cosa succede se si rimuove un ostacolo?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;chips&quot; id=&quot;spChips&quot;&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;spBar&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Spread residuo (illustrativo): &lt;b id=&quot;spO&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Clicca un fattore per “risolverlo”. Le quote sono &lt;strong&gt;inventate a scopo didattico&lt;/strong&gt; per mostrare la logica della scomposizione, non stime del paper.&lt;/p&gt;
  &lt;/div&gt;
  &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;I fattori, spiegati&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Esclusione dagli indici sovrani.&lt;/strong&gt; I grandi indici obbligazionari classificano l’UE come &lt;em&gt;supranational&lt;/em&gt; e non come Stato sovrano. I fondi che replicano quegli indici (&lt;em&gt;index tracking&lt;/em&gt;) quindi non comprano EU-Bonds: la &lt;strong&gt;base di investitori&lt;/strong&gt; è più piccola.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Liquidità e infrastruttura di mercato.&lt;/strong&gt; Per i Bund esistono un mercato futures profondo e un mercato pronti contro termine (&lt;em&gt;repo&lt;/em&gt;) enorme; per i titoli UE sono più sottili.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Emissione temporanea.&lt;/strong&gt; NGEU è nato come programma a termine (fino al 2026): senza emissioni permanenti non si forma una curva dei rendimenti di riferimento stabile.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Status fiscale.&lt;/strong&gt; L’UE non ha un potere impositivo proprio come uno Stato: il rimborso si appoggia sul bilancio UE e sui contributi degli Stati membri.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Sostegno della BCE in caso di crisi.&lt;/strong&gt; Se gli investitori si aspettano che la BCE compri titoli UE in una crisi (acquisti &lt;em&gt;state-contingent&lt;/em&gt;), il premio si riduce. Qui c’è il legame con la parte 5.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Bonfanti e Marcucci&lt;/strong&gt;, “A European Safe Asset? Not Without the Investors” (Giovanni Bonfanti, Columbia University; Juri Marcucci, Banca d’Italia; versione del 10 novembre 2025). Tesi: gli EU-Bonds pagano più di emittenti sovrani altrettanto sicuri e grandi. Il divario è legato a una base di investitori ridotta, perché i titoli UE sono esclusi dai principali indici obbligazionari per mancanza di status sovrano formale. Le aspettative di acquisti “state-contingent” da parte della BCE possono ridurre molto il premio; nel modello lo spread sarebbe trascurabile se l’UE fosse trattata come un emittente pienamente sovrano. &lt;a href=&quot;https://econ.columbia.edu/wp-content/uploads/sites/18/2025/09/Giovanni-Bonfanti-Job-Market-Paper.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Paper (PDF, Columbia)&lt;/a&gt;&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;La column VoxEU citata nelle slide (“A European safe asset will require bolder steps”) risulta nel profilo CEPR di Bonfanti, ma non è stato possibile leggerne il testo via ricerca: apritela dal link delle slide.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Lettura complementare: “The safe asset potential of EU-issued bonds” osserva che i titoli UE hanno alta qualità ma liquidità relativamente bassa rispetto ai Bund. &lt;a href=&quot;https://cepr.org/voxeu/columns/safe-asset-potential-eu-issued-bonds&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se il rischio di default di EU-Bond e Bund è quasi nullo, perché esiste uno spread?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché la sicurezza non è solo rischio di credito: contano liquidità, ampiezza della base di investitori, inclusione negli indici, status istituzionale e sostegno atteso della banca centrale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa c’entrano gli indici obbligazionari?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Molti fondi replicano indici di titoli sovrani. Se l’UE non è classificata come sovrana, quei fondi non comprano i suoi titoli: la domanda è più bassa e il rendimento più alto (Bonfanti e Marcucci).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;rrf&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 8 · Tema&lt;/div&gt;&lt;h2&gt;L’impatto macroeconomico di NextGenEU&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;THE MACROECONOMIC IMPACT OF NEXTGENEU — tre column VoxEU: “Macroeconomic impact of the Recovery and Resilience Facility: analysis of Italy, Spain and Greece”; “EU’s Recovery and Resilience Facility: experience and lessons for the next multiannual [financial framework]”; “Surprisingly, Italy’s Resilience and Recovery Facility plan is working”.&lt;/div&gt;

  &lt;h3&gt;Come funziona il RRF&lt;/h3&gt;
  &lt;p&gt;Il cuore di NGEU è il &lt;span class=&quot;term&quot;&gt;Recovery and Resilience Facility&lt;/span&gt; (RRF, Dispositivo per la ripresa e la resilienza): sovvenzioni (&lt;em&gt;grants&lt;/em&gt;) e prestiti (&lt;em&gt;loans&lt;/em&gt;) agli Stati membri, legati a un piano nazionale. In Italia è il PNRR, Piano Nazionale di Ripresa e Resilienza. Il tratto distintivo è la &lt;span class=&quot;term&quot;&gt;performance-based conditionality&lt;/span&gt;: i soldi arrivano a rate solo quando il paese raggiunge &lt;span class=&quot;term&quot;&gt;milestones and targets&lt;/span&gt; concordati, cioè traguardi qualitativi (una riforma approvata) e obiettivi quantitativi (km di ferrovia, asili costruiti).&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 150&quot; role=&quot;img&quot; aria-label=&quot;Ciclo del RRF: piano, traguardi, richiesta di pagamento, verifica, erogazione&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;66&quot;&gt;Piano nazionale&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;riforme + investimenti&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;66&quot;&gt;Approvazione&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;Commissione + Consiglio&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;395&quot; y=&quot;66&quot;&gt;Milestones&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;&amp;amp; targets raggiunti&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;66&quot;&gt;Richiesta&lt;/text&gt;&lt;text x=&quot;555&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;e verifica&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;66&quot;&gt;Erogazione&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;84&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;della rata&lt;/text&gt;
        &lt;path d=&quot;M140 70H166M300 70H326M460 70H486M620 70H646&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M720 102 Q720 140 395 140 Q395 140 395 104&quot; style=&quot;fill:none;stroke:var(--muted);stroke-dasharray:4 3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;134&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;rata successiva&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Tre canali d’impatto&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Domanda&lt;/h4&gt;Spesa pubblica e investimenti aumentano la domanda aggregata nel breve periodo. L’effetto dipende dal &lt;span class=&quot;term&quot;&gt;fiscal multiplier&lt;/span&gt; (moltiplicatore fiscale), cioè di quanti euro sale il PIL per ogni euro speso.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Offerta&lt;/h4&gt;Investimenti (digitale, transizione verde, infrastrutture) e riforme (giustizia, pubblica amministrazione) alzano il &lt;span class=&quot;term&quot;&gt;potential output&lt;/span&gt; (PIL potenziale) nel medio-lungo periodo.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Finanziario&lt;/h4&gt;Il debito comune e le sovvenzioni, che non pesano sul debito nazionale, riducono gli spread dei paesi più indebitati e creano spazio di bilancio.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Simulatore: quanto PIL in più?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rS&quot;&gt;Fondi annui (% del PIL)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rS&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;rSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rA&quot;&gt;Assorbimento (quota spesa davvero)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rA&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;rAO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rM&quot;&gt;Moltiplicatore fiscale&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rM&quot; min=&quot;0&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;rMO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rL&quot;&gt;Addizionalità (non sostituisce spesa già prevista)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rL&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;rLO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;15&quot; width=&quot;600&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate-bg)&quot;/&gt;&lt;rect id=&quot;rBar&quot; x=&quot;0&quot; y=&quot;15&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Impatto di breve sul livello del PIL: &lt;b id=&quot;rO&quot;&gt;&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ΔPIL/PIL ≈ fondi × assorbimento × addizionalità × moltiplicatore&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Formula didattica per i soli effetti di domanda nel breve: non coglie gli effetti di offerta né quelli sugli spread. Vale la pena notare che con assorbimento basso anche fondi ingenti producono poco, ed è il tema degli “absorption bottlenecks” citati nelle column.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cosa dicono le column delle slide&lt;/h3&gt;
  &lt;div class=&quot;tabs slate&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Italia, Spagna, Grecia&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Lezioni per il prossimo QFP&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Il PNRR italiano&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;ext&quot;&gt;Uno studio descrittivo e preliminare, basato su semplici confronti controfattuali: i risultati sono coerenti con un effetto positivo del RRF sul PIL reale, più forte su occupazione e investimenti, e con un effetto atteso sul prodotto potenziale negli anni successivi. Il piano italiano vale il 9,1% del PIL, di cui il 3,4% in sovvenzioni. Dal 2020 le agenzie Fitch e DBRS Morningstar hanno citato positivamente il RRF in ogni decisione di rating su Spagna, Grecia e Italia. Gli autori notano che la letteratura empirica sugli effetti realizzati è ancora scarsa. &lt;a href=&quot;https://cepr.org/voxeu/columns/macroeconomic-impact-recovery-and-resilience-facility-analysis-italy-spain-and-greece&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;ext&quot;&gt;Il RRF è presentato come banco di prova della politica fiscale &lt;em&gt;performance-based&lt;/em&gt;. Ha sostenuto la domanda, favorito le riforme e rafforzato l’integrazione fiscale UE; piani complessi e colli di bottiglia amministrativi hanno però rallentato gli esborsi. Raccomandazione: i futuri strumenti del bilancio UE (il &lt;span class=&quot;term&quot;&gt;Multiannual Financial Framework&lt;/span&gt;, quadro finanziario pluriennale) dovrebbero legare riforme e investimenti, con piani mirati e flessibili. Il testo corrisponde all’IMF Working Paper WP/26/114 (Busse, Caselli, Fotiou, giugno 2026). &lt;a href=&quot;https://cepr.org/voxeu/columns/eus-recovery-and-resilience-facility-experience-and-lessons-next-multiannual&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://www.bookstore.imf.org/books/the-eu-s-recovery-and-resilience-facility-experience-and-lessons-for-the-next-multiannual-financial-framework&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;ext&quot;&gt;Column di Francesco Giavazzi e Chiara Goretti (21 maggio 2024). Il testo completo non è stato leggibile via ricerca; il CEPR Policy Insight 130 collegato, a metà percorso del PNRR, segnala casi di riforme avviate con risultati sorprendentemente rapidi in alcune aree. Nel 2026 la Commissione ha approvato la nona rata (€12,8 mld): l’Italia arriva così all’85% dei fondi assegnati. &lt;a href=&quot;https://cepr.org/publications/policy-insight-130-italys-rrf-plan-working-or-it-just-another-waste-money&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR Policy Insight 130&lt;/a&gt; · &lt;a href=&quot;https://en.ilsole24ore.com/art/the-eu-disburses-to-italy-128-billion-pnrr-and-ninth-tranche-AIq9niSD&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Sole 24 Ore&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Il RRF ha una dotazione di €577 mld, da mobilitare in linea di principio entro agosto 2026, secondo un policy brief dell’Institut Jacques Delors (2026). &lt;a href=&quot;https://institutdelors.eu/content/uploads/2026/05/PB260512_Performances_post_covid_sud_Europe_Jaillet_Rubio_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Institut Jacques Delors (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;details class=&quot;slate&quot;&gt;&lt;summary&gt;Perché misurare l’impatto è difficile (e il legame con la parte 6)&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Anche qui il problema è il &lt;strong&gt;controfattuale&lt;/strong&gt;: cosa sarebbe successo senza RRF? Gli anni 2021–2026 mescolano il rimbalzo post-Covid, lo shock energetico del 2022, l’inflazione e il rialzo dei tassi BCE. Servono confronti tra paesi con diversa intensità di fondi (una logica simile al difference-in-differences) o modelli macro (per esempio il modello QUEST della Commissione o NiGEM). La parte 6 mostra gli stessi strumenti applicati all’adesione all’UE.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa significa che il RRF è “performance-based”?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Che i pagamenti sono legati al raggiungimento di milestones (traguardi qualitativi) e targets (obiettivi quantitativi), non alle spese sostenute.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un assorbimento basso riduce l’impatto anche con fondi ingenti?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché l’effetto sulla domanda nasce dalla spesa effettiva: i fondi assegnati ma non spesi non muovono il PIL.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale canale lega il RRF agli spread sovrani?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Il canale finanziario: debito comune e sovvenzioni riducono il fabbisogno e il rischio percepito dei paesi più indebitati, e le agenzie di rating lo citano nelle loro decisioni.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;voto&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 9 · Il voto&lt;/div&gt;&lt;h2&gt;Come pesa la presentazione&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;The work is assessed in thirties and weights 30% on the total mark. e.g. teamwork 27, written exam 24, final mark = (27*0.3+24*0.7) = 8.1+16.8 = 24.9 → 25&lt;/div&gt;
  &lt;p&gt;La presentazione riceve un voto in trentesimi (&lt;em&gt;in thirties&lt;/em&gt;) che pesa il &lt;strong&gt;30%&lt;/strong&gt;; lo scritto pesa il restante &lt;strong&gt;70%&lt;/strong&gt;. Il voto finale è una &lt;strong&gt;media ponderata&lt;/strong&gt;, arrotondata all’intero:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;voto finale = 0,3 × teamwork + 0,7 × written exam&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vT&quot;&gt;Teamwork&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vT&quot; min=&quot;18&quot; max=&quot;30&quot; value=&quot;27&quot;&gt;&lt;output id=&quot;vTO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;vE&quot;&gt;Written exam&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;vE&quot; min=&quot;18&quot; max=&quot;30&quot; value=&quot;24&quot;&gt;&lt;output id=&quot;vEO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect id=&quot;vBt&quot; x=&quot;0&quot; y=&quot;15&quot; height=&quot;30&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect id=&quot;vBe&quot; y=&quot;15&quot; height=&quot;30&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;line x1=&quot;600&quot; y1=&quot;8&quot; x2=&quot;600&quot; y2=&quot;52&quot; style=&quot;stroke:var(--muted)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;vO&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Barra: contributo della presentazione (terracotta) e dello scritto (ocra) su 30. L’esempio delle slide arrotonda 24,9 a 25; come si arrotonda un ,5 esatto le slide non lo dicono. Lode e minimi non sono specificati nel documento.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Teamwork 30, scritto 22: voto finale?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0,3×30 + 0,7×22 = 9 + 15,4 = 24,4 → 24.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quanti punti del voto finale vale ogni punto in più nella presentazione?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0,3 punti (contro 0,7 per ogni punto dello scritto).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Risorse&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Ogni voce è citata nelle slide o è necessaria per capirle. Dati, descrizioni e link vengono da ricerche web: sono &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid g2 refs&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eurobarometer &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Commissione europea · archivio dati GESIS&lt;/div&gt;&lt;p&gt;Sondaggi semestrali (Standard) e tematici sull’opinione pubblica europea, inclusa la fiducia nelle istituzioni. È la fonte primaria del tema 4; i microdati sono scaricabili da GESIS.&lt;/p&gt;&lt;a href=&quot;https://www.gesis.org/en/eurobarometer-data-service/data-and-documentation/standard-special-eb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS Eurobarometer Data Service&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“Your debt, my inflation: The role of trust in the ECB” &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · basata su CEPR DP 21595&lt;/div&gt;&lt;p&gt;Esperimento randomizzato sulle imprese tedesche: le notizie sul debito altrui alzano le aspettative di inflazione solo di chi non si fida della BCE. Conta perché collega fiducia, unione monetaria e fiscal dominance.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“High inflation erodes trust in the ECB” &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · dati olandesi&lt;/div&gt;&lt;p&gt;Mostra il nesso inverso: l’inflazione percepita riduce la fiducia. Utile per discutere la causalità.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/high-inflation-erodes-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Campos, Coricelli, Moretti (2014) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;CEPR DP 9968 / IZA DP 8162&lt;/div&gt;&lt;p&gt;Benefici dell’adesione all’UE stimati con synthetic counterfactuals: reddito pro capite in media circa il 12% più alto, Grecia unica eccezione negativa. È il paper di riferimento del tema 6 (probabilmente quello del link SSRN delle slide).&lt;/p&gt;&lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP9968.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF CEPR&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Abadie, Diamond, Hainmueller (2010) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;JASA 105(490): 493–505 · doi 10.1198/jasa.2009.ap08746&lt;/div&gt;&lt;p&gt;L’articolo metodologico del synthetic control, applicato al programma antifumo della California (Proposition 99). Spiega come si scelgono i pesi e come si fa inferenza.&lt;/p&gt;&lt;a href=&quot;https://www.mit.edu/~jhainm/Paper/ccs.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF (MIT)&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mundell (1961), McKinnon (1963), Kenen (1969) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Teoria delle optimum currency areas&lt;/div&gt;&lt;p&gt;I tre contributi fondativi: mobilità dei fattori, apertura commerciale, diversificazione. La base teorica dei costi e benefici dell’EMU.&lt;/p&gt;&lt;a href=&quot;https://www.diw.de/de/diw_01.c.412107.de/optimum_currency_area.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DIW, glossario “Optimum Currency Area”&lt;/a&gt; · &lt;a href=&quot;https://repec.cepr.org/repec/cpr/ceprdp/DP7645.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEPR DP 7645, “An Optimum Currency Area Odyssey”&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bonfanti, Marcucci (2025) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Working paper · Columbia / Banca d’Italia&lt;/div&gt;&lt;p&gt;“A European Safe Asset? Not Without the Investors”: lo spread degli EU-Bonds dipende dalla base di investitori (esclusione dagli indici sovrani) e dal sostegno atteso della BCE. È la lettura chiave del tema 7.&lt;/p&gt;&lt;a href=&quot;https://econ.columbia.edu/wp-content/uploads/sites/18/2025/09/Giovanni-Bonfanti-Job-Market-Paper.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“A European safe asset will require bolder steps” &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · Bonfanti (secondo il profilo CEPR)&lt;/div&gt;&lt;p&gt;La column citata nelle slide. Il contenuto non è stato verificabile via ricerca: leggetela direttamente.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/european-safe-asset-will-require-bolder-steps&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Commissione europea, EU-Bonds 2026 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;Comunicato IP/26/1879&lt;/div&gt;&lt;p&gt;Piano di emissione del 2026 (€180 mld in totale), per NGEU, SAFE e Ucraina. Utile per le dimensioni del mercato dei titoli UE.&lt;/p&gt;&lt;a href=&quot;https://europa.eu/newsroom/ecpc-failover/pdf/ip-26-1879_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;RRF in Italia, Spagna e Grecia &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column&lt;/div&gt;&lt;p&gt;Prima evidenza empirica sugli effetti realizzati del RRF: positivi su PIL, occupazione e investimenti.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/macroeconomic-impact-recovery-and-resilience-facility-analysis-italy-spain-and-greece&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Busse, Caselli, Fotiou (2026) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;IMF WP/26/114 · column VoxEU sulle lezioni per il QFP&lt;/div&gt;&lt;p&gt;Bilancio del RRF: spinta alla domanda, riforme, stabilizzazione dei mercati del debito grazie all’indebitamento comune; problemi di assorbimento.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/eus-recovery-and-resilience-facility-experience-and-lessons-next-multiannual&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://www.bookstore.imf.org/books/the-eu-s-recovery-and-resilience-facility-experience-and-lessons-for-the-next-multiannual-financial-framework&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Giavazzi, Goretti (2024) &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;div class=&quot;meta&quot;&gt;VoxEU column · CEPR Policy Insight 130&lt;/div&gt;&lt;p&gt;“Surprisingly, Italy’s RRF plan is working”: a metà percorso, alcune riforme del PNRR mostrano risultati rapidi.&lt;/p&gt;&lt;a href=&quot;https://cepr.org/voxeu/columns/surprisingly-italys-resilience-and-recovery-facility-plan-working&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt; · &lt;a href=&quot;https://cepr.org/publications/policy-insight-130-italys-rrf-plan-working-or-it-just-another-waste-money&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Policy Insight 130&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Sugli altri materiali del corso: non è stato possibile consultare la cartella &lt;code&gt;corso/&lt;/code&gt;, perché con gli strumenti disponibili non si può elencarne il contenuto. I collegamenti con le altre lezioni (teoria OCA, BCE, NGEU) sono quindi ricostruiti da conoscenze generali e vanno verificati sul programma e sul Manual del corso.&lt;/p&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;
(function(){
  // linguette
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;.tablist button&#x27;),panels=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });
  // passi da scorrere
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),dots=s.querySelector(&#x27;.dots&#x27;),prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),cur=0;
    steps.forEach(function(_,i){var b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.textContent=i+1;b.setAttribute(&#x27;aria-label&#x27;,&#x27;Passo &#x27;+(i+1));b.addEventListener(&#x27;click&#x27;,function(){go(i)});dots.appendChild(b);});
    function go(i){cur=i;steps.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});dots.querySelectorAll(&#x27;button&#x27;).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});prev.disabled=i===0;next.disabled=i===steps.length-1;}
    prev.addEventListener(&#x27;click&#x27;,function(){go(Math.max(0,cur-1))});next.addEventListener(&#x27;click&#x27;,function(){go(Math.min(steps.length-1,cur+1))});go(0);
  });
  // autoverifica
  document.querySelectorAll(&#x27;.quiz .q&#x27;).forEach(function(q){
    var b=q.querySelector(&#x27;button&#x27;);b.addEventListener(&#x27;click&#x27;,function(){var on=q.classList.toggle(&#x27;show&#x27;);b.textContent=on?&#x27;Nascondi risposta&#x27;:&#x27;Mostra risposta&#x27;;});
  });
  // indice attivo
  var links=document.querySelectorAll(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)});}});},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}
  function f1(n,d){return n.toFixed(d===undefined?1:d).replace(&#x27;.&#x27;,&#x27;,&#x27;)}
  function on(ids,fn){ids.forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,fn)});fn();}
  function path(pts){return pts.map(function(p,i){return (i?&#x27;L&#x27;:&#x27;M&#x27;)+p[0].toFixed(1)+&#x27; &#x27;+p[1].toFixed(1)}).join(&#x27;&#x27;)}

  // net trust
  on([&#x27;tr&#x27;,&#x27;dtr&#x27;],function(e){
    var t=+$(&#x27;tr&#x27;).value,d=+$(&#x27;dtr&#x27;).value;
    if(t+d&gt;100){if(e&amp;&amp;e.target.id===&#x27;tr&#x27;){d=100-t;$(&#x27;dtr&#x27;).value=d}else{t=100-d;$(&#x27;tr&#x27;).value=t}}
    var n=100-t-d;$(&#x27;trO&#x27;).textContent=t+&#x27;%&#x27;;$(&#x27;dtrO&#x27;).textContent=d+&#x27;%&#x27;;$(&#x27;dkO&#x27;).textContent=n+&#x27;%&#x27;;
    $(&#x27;ntO&#x27;).textContent=(t-d&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+(t-d);
    $(&#x27;bT&#x27;).setAttribute(&#x27;width&#x27;,t*6);$(&#x27;bD&#x27;).setAttribute(&#x27;x&#x27;,t*6);$(&#x27;bD&#x27;).setAttribute(&#x27;width&#x27;,d*6);$(&#x27;bN&#x27;).setAttribute(&#x27;x&#x27;,(t+d)*6);$(&#x27;bN&#x27;).setAttribute(&#x27;width&#x27;,n*6);
  });

  // fiducia BCE
  on([&#x27;tb&#x27;,&#x27;nb&#x27;],function(){
    var tr=+$(&#x27;tb&#x27;).value,nw=+$(&#x27;nb&#x27;).value,v=2+0.03*nw*(1-tr/100),h=v*25;
    $(&#x27;tbO&#x27;).textContent=tr;$(&#x27;nbO&#x27;).textContent=nw;
    $(&#x27;bceBar&#x27;).setAttribute(&#x27;y&#x27;,90-h);$(&#x27;bceBar&#x27;).setAttribute(&#x27;height&#x27;,h);
    $(&#x27;bceTxt&#x27;).textContent=&#x27;Dopo: &#x27;+f1(v,2)+&#x27;%&#x27;;$(&#x27;bceO&#x27;).textContent=f1(v,2)+&#x27;%&#x27;;
  });

  // OCA
  on([&#x27;ocaF&#x27;,&#x27;ocaX&#x27;],function(){
    var F=+$(&#x27;ocaF&#x27;).value,X=+$(&#x27;ocaX&#x27;).value,k=210-1.3*F;
    function B(T){return 20+1.8*T}function C(T){return k-(k-15)*T/100}
    function px(T){return 60+T*5}function py(v){return 250-Math.min(v,220)}
    var b=[],c=[];for(var T=0;T&lt;=100;T+=5){b.push([px(T),py(B(T))]);c.push([px(T),py(C(T))]);}
    $(&#x27;ocaB&#x27;).setAttribute(&#x27;d&#x27;,path(b));$(&#x27;ocaC&#x27;).setAttribute(&#x27;d&#x27;,path(c));
    var ts=(k-20)/(1.8+(k-15)/100);
    [&#x27;x1&#x27;,&#x27;x2&#x27;].forEach(function(a){$(&#x27;ocaT&#x27;).setAttribute(a,px(ts))});$(&#x27;ocaTt&#x27;).setAttribute(&#x27;x&#x27;,px(ts));
    $(&#x27;ocaP&#x27;).setAttribute(&#x27;cx&#x27;,px(X));
    $(&#x27;ocaFO&#x27;).textContent=F;$(&#x27;ocaXO&#x27;).textContent=X;
    var net=B(X)-C(X);
    $(&#x27;ocaR&#x27;).innerHTML=&#x27;Soglia T* ≈ &lt;b&gt;&#x27;+Math.round(ts)+&#x27;&lt;/b&gt; · beneficio netto del paese: &lt;b&gt;&#x27;+(net&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+Math.round(net)+&#x27;&lt;/b&gt; → &#x27;+(net&gt;0?&#x27;all’unione conviene entrare&#x27;:&#x27;non conviene ancora&#x27;);
  });

  // synthetic control
  (function(){
    var Y=[],A=[],Bd=[],Cd=[];
    for(var t=0;t&lt;=20;t++){
      var a=100+1.2*t+2*Math.sin(t/2),b=95+3*t,c=105+1.8*t-0.03*t*t;
      A.push(a);Bd.push(b);Cd.push(c);Y.push(0.5*a+0.3*b+0.2*c+(t&gt;10?1.2*(t-10):0));
    }
    function px(t){return 50+t*26}function py(v){return 240-(v-85)*2.75}
    function ser(s){return path(s.map(function(v,t){return [px(t),py(v)]}))}
    $(&#x27;scA&#x27;).setAttribute(&#x27;d&#x27;,ser(A));$(&#x27;scB&#x27;).setAttribute(&#x27;d&#x27;,ser(Bd));$(&#x27;scC&#x27;).setAttribute(&#x27;d&#x27;,ser(Cd));$(&#x27;scT&#x27;).setAttribute(&#x27;d&#x27;,ser(Y));
    on([&#x27;wA&#x27;,&#x27;wB&#x27;,&#x27;wC&#x27;],function(){
      var a=+$(&#x27;wA&#x27;).value,b=+$(&#x27;wB&#x27;).value,c=+$(&#x27;wC&#x27;).value,s=a+b+c||1;a/=s;b/=s;c/=s;
      $(&#x27;wAO&#x27;).textContent=Math.round(a*100)+&#x27;%&#x27;;$(&#x27;wBO&#x27;).textContent=Math.round(b*100)+&#x27;%&#x27;;$(&#x27;wCO&#x27;).textContent=Math.round(c*100)+&#x27;%&#x27;;
      var S=A.map(function(_,t){return a*A[t]+b*Bd[t]+c*Cd[t]});
      $(&#x27;scS&#x27;).setAttribute(&#x27;d&#x27;,ser(S));
      var e=0,g=0;for(var t=0;t&lt;=10;t++)e+=Math.pow(Y[t]-S[t],2);for(t=11;t&lt;=20;t++)g+=Y[t]-S[t];
      $(&#x27;scE&#x27;).textContent=f1(Math.sqrt(e/11),2);$(&#x27;scG&#x27;).textContent=(g&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+f1(g/10)+&#x27; punti (effetto vero: +6,6)&#x27;;
    });
  })();

  // spread
  (function(){
    var F=[[&#x27;Esclusione dagli indici sovrani&#x27;,12],[&#x27;Liquidità / futures / repo&#x27;,8],[&#x27;Sostegno BCE incerto&#x27;,6],[&#x27;Emissione temporanea&#x27;,5],[&#x27;Nessun potere fiscale proprio&#x27;,5]],off={};
    var cols=[&#x27;var(--slate)&#x27;,&#x27;var(--ochre)&#x27;,&#x27;var(--sage)&#x27;,&#x27;var(--brick)&#x27;,&#x27;var(--accent)&#x27;];
    F.forEach(function(f,i){var b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.className=&#x27;btn&#x27;;b.textContent=f[0];b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);
      b.style.borderColor=cols[i];b.addEventListener(&#x27;click&#x27;,function(){off[i]=!off[i];b.setAttribute(&#x27;aria-pressed&#x27;,off[i]);b.style.textDecoration=off[i]?&#x27;line-through&#x27;:&#x27;none&#x27;;b.style.opacity=off[i]?.55:1;draw()});$(&#x27;spChips&#x27;).appendChild(b);});
    function draw(){
      var g=$(&#x27;spBar&#x27;),x=0,tot=0,h=&#x27;&#x27;;
      F.forEach(function(f,i){if(off[i])return;var w=f[1]*15;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;20&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;44&quot; style=&quot;fill:&#x27;+cols[i]+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(x+w/2)+&#x27;&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;&#x27;+f[1]+&#x27;&lt;/text&gt;&#x27;;x+=w;tot+=f[1];});
      h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;90&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;punti base (bp) sopra il Bund · 1 bp = 0,01%&lt;/text&gt;&#x27;;
      g.innerHTML=h;$(&#x27;spO&#x27;).textContent=tot+&#x27; bp&#x27;;
    }
    draw();
  })();

  // RRF
  on([&#x27;rS&#x27;,&#x27;rA&#x27;,&#x27;rM&#x27;,&#x27;rL&#x27;],function(){
    var s=$(&#x27;rS&#x27;).value/10,a=$(&#x27;rA&#x27;).value/100,m=$(&#x27;rM&#x27;).value/10,l=$(&#x27;rL&#x27;).value/100,v=s*a*m*l;
    $(&#x27;rSO&#x27;).textContent=f1(s)+&#x27;%&#x27;;$(&#x27;rAO&#x27;).textContent=Math.round(a*100)+&#x27;%&#x27;;$(&#x27;rMO&#x27;).textContent=f1(m);$(&#x27;rLO&#x27;).textContent=Math.round(l*100)+&#x27;%&#x27;;
    $(&#x27;rBar&#x27;).setAttribute(&#x27;width&#x27;,Math.min(600,v/3*600));$(&#x27;rO&#x27;).textContent=&#x27;+&#x27;+f1(v,2)+&#x27;% del PIL&#x27;;
  });

  // voto
  on([&#x27;vT&#x27;,&#x27;vE&#x27;],function(){
    var t=+$(&#x27;vT&#x27;).value,e=+$(&#x27;vE&#x27;).value,f=0.3*t+0.7*e;
    $(&#x27;vTO&#x27;).textContent=t;$(&#x27;vEO&#x27;).textContent=e;
    $(&#x27;vBt&#x27;).setAttribute(&#x27;width&#x27;,0.3*t*20);$(&#x27;vBe&#x27;).setAttribute(&#x27;x&#x27;,0.3*t*20);$(&#x27;vBe&#x27;).setAttribute(&#x27;width&#x27;,0.7*e*20);
    $(&#x27;vO&#x27;).innerHTML=&#x27;(0,3 × &#x27;+t+&#x27;) + (0,7 × &#x27;+e+&#x27;) = &#x27;+f1(0.3*t)+&#x27; + &#x27;+f1(0.7*e)+&#x27; = &#x27;+f1(f)+&#x27; → &lt;b&gt;&#x27;+Math.round(f)+&#x27;/30&lt;/b&gt;&#x27;;
  });
})();
