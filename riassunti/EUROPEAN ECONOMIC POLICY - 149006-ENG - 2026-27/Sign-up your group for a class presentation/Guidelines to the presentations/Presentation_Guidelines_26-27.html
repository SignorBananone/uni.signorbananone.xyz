&lt;main class=&quot;wrap&quot;&gt;
&lt;section class=&quot;part brick&quot; id=&quot;regole&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 1 · Il compito&lt;/div&gt;&lt;h2&gt;Regole del gioco&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;In autonomy a group of students (max 3) examine a specific research question of their interest within the themes that are part of the course (please see the course outline in the website or check out Manual’s content). The group prepares a power point that will be presented at the class in max 15-20 min. At the end of each presentation up to 5 minutes will be dedicated to questions raised by students in the class. Active participation will be part of the assessment.&lt;/div&gt;

  &lt;div class=&quot;grid g3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Chi&lt;/h4&gt;Un gruppo di &lt;strong&gt;massimo 3&lt;/strong&gt; studenti, che lavora &lt;em&gt;in autonomy&lt;/em&gt;: il tema lo scegliete voi, nessuno ve lo assegna.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Cosa&lt;/h4&gt;Una &lt;span class=&quot;term&quot;&gt;research question&lt;/span&gt; (domanda di ricerca precisa) dentro i temi del corso, che trovate nel &lt;em&gt;course outline&lt;/em&gt; sul sito o nell’indice del &lt;em&gt;Manual&lt;/em&gt; (il manuale).&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Come&lt;/h4&gt;Un PowerPoint presentato in aula in &lt;strong&gt;15–20 minuti&lt;/strong&gt;, poi &lt;strong&gt;fino a 5 minuti&lt;/strong&gt; di domande dei compagni.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Valutato&lt;/h4&gt;Anche la &lt;span class=&quot;term&quot;&gt;active participation&lt;/span&gt;: fare domande alle presentazioni degli altri e rispondere bene alle proprie.&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 130&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo di uno slot: 15-20 minuti di presentazione e fino a 5 di domande&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;60&quot; x2=&quot;760&quot; y2=&quot;60&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;rect x=&quot;40&quot; y=&quot;40&quot; width=&quot;432&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
      &lt;rect x=&quot;472&quot; y=&quot;40&quot; width=&quot;144&quot; height=&quot;40&quot; rx=&quot;0&quot; style=&quot;fill:color-mix(in oklch,var(--brick-bg) 50%,transparent);stroke:var(--brick);stroke-dasharray:4 3&quot;/&gt;
      &lt;rect x=&quot;616&quot; y=&quot;40&quot; width=&quot;144&quot; height=&quot;40&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
      &lt;text x=&quot;256&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Presentazione: almeno 15&#x27;&lt;/text&gt;
      &lt;text x=&quot;544&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;fino a 20&#x27;&lt;/text&gt;
      &lt;text x=&quot;688&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Q&amp;amp;A ≤ 5&#x27;&lt;/text&gt;
      &lt;g font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;104&quot;&gt;0&#x27;&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;15&#x27;&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;20&#x27;&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;104&quot; text-anchor=&quot;end&quot;&gt;25&#x27;&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;40&quot; y=&quot;24&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;Uno slot tipico (caso massimo)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;“max 15-20 min” è un tetto: provate con il cronometro. Chi sfora di solito taglia proprio il take-home message, che è la parte più importante.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Che cos’è una buona research question&lt;/h3&gt;
  &lt;p&gt;Le slide chiedono una &lt;em&gt;specific research question&lt;/em&gt;: non un argomento (“NextGenEU”), ma una &lt;strong&gt;domanda a cui si può rispondere&lt;/strong&gt; con dati o con la letteratura in 15 minuti. Una buona domanda è &lt;strong&gt;delimitata&lt;/strong&gt; (paese, periodo, variabile), &lt;strong&gt;collegata al corso&lt;/strong&gt; e &lt;strong&gt;rispondibile&lt;/strong&gt; con le fonti che riuscite a leggere.&lt;/p&gt;
  &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Da argomento a domanda: tre esempi&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Troppo vago&lt;/th&gt;&lt;th&gt;Meglio&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;La fiducia nell’UE&lt;/td&gt;&lt;td&gt;La fiducia nelle istituzioni UE è cambiata dopo la crisi del 2022 in Italia e in Germania? Cosa dicono gli Eurobarometer 2019–2026?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;L’euro conviene?&lt;/td&gt;&lt;td&gt;Quanto avrebbe avuto di PIL pro capite la Slovacchia senza euro? Cosa stimano gli studi con synthetic control?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Gli eurobond&lt;/td&gt;&lt;td&gt;Perché i titoli NextGenEU rendono più dei Bund pur essendo AAA? Quanto conta la base di investitori?&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;p class=&quot;note&quot;&gt;Esempi costruiti per questo riassunto, non presi dalle slide.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;brick&quot;&gt;&lt;summary&gt;Come si “partecipa attivamente” al Q&amp;amp;A&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Domande utili da fare a un altro gruppo: &lt;em&gt;Quali dati avete usato e perché quelli? Il risultato è una correlazione o un effetto causale? Che cosa cambierebbe in un altro paese? Qual è il limite principale dello studio?&lt;/em&gt; Sono le stesse domande a cui dovete saper rispondere voi: preparatevi una slide di riserva con dettagli sui dati e sul metodo.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un gruppo di 4 amici vuole presentare insieme. Si può?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: le slide fissano un massimo di 3 componenti per gruppo.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quanto dura al massimo uno slot, domande comprese?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Circa 25 minuti: massimo 15–20 di presentazione più fino a 5 di domande.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché “Gli eurobond” non va bene come research question?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché è un argomento, non una domanda: non dice che cosa si vuole spiegare o misurare. Va ristretto a una domanda precisa, per esempio sul differenziale di rendimento rispetto al Bund.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;struttura&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 2 · Le slide&lt;/div&gt;&lt;h2&gt;La struttura della presentazione&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Le linee guida danno una scaletta in sei punti. Scorrete i passi: per ognuno c’è il testo del corso e cosa significa in pratica.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Title, group components&lt;/h4&gt;&lt;p&gt;Titolo e nomi dei componenti. Il titolo migliore contiene già la domanda o la risposta, per esempio “Perché i titoli NGEU pagano più dei Bund?”.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Tempo suggerito: pochi secondi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Research question and motivation&lt;/h4&gt;&lt;div class=&quot;slide&quot;&gt;how is the chosen topic related to the issues studied and analysed in the course&lt;/div&gt;&lt;p&gt;È il punto che le slide mettono in grassetto: &lt;strong&gt;question&lt;/strong&gt; e &lt;strong&gt;motivation&lt;/strong&gt;. Scrivete la domanda in una frase, poi spiegate perché conta e &lt;em&gt;a quale parte del corso si collega&lt;/em&gt;, per esempio la teoria delle aree valutarie, la politica monetaria della BCE o le regole fiscali e NGEU.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~2 minuti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Outline of the presentation&lt;/h4&gt;&lt;p&gt;Una slide-indice: dice al pubblico dove state andando. Bastano 3–5 voci.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~30 secondi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Central part&lt;/h4&gt;&lt;div class=&quot;slide&quot;&gt;Depending on the type of contribution (empirical or review of papers): objectives, data used, methods, results and conclusions of the paper(s) read or of the empirical analysis&lt;/div&gt;&lt;p&gt;È il cuore, circa due terzi del tempo. Lo schema è lo stesso sia che analizziate dati vostri, sia che riassumiate articoli: &lt;strong&gt;obiettivi → dati → metodi → risultati → conclusioni&lt;/strong&gt;. Più sotto trovate le due varianti a confronto.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~10–12 minuti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Take-home message&lt;/h4&gt;&lt;p&gt;Il messaggio da portare a casa, cioè la risposta alla research question in 1–3 frasi. Se il pubblico dimentica tutto, deve ricordare questo. Aggiungete un limite o una domanda aperta.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;~1 minuto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · References&lt;/h4&gt;&lt;p&gt;Bibliografia completa: autori, anno, titolo, sede (rivista, working paper series, VoxEU…), link. Usate uno stile coerente, per esempio Autore (anno), “Titolo”, Sede.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Una slide, non letta ad alta voce.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 92&quot; role=&quot;img&quot; aria-label=&quot;Ripartizione indicativa del tempo tra le sei parti&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;16&quot; height=&quot;36&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;20&quot; width=&quot;80&quot; height=&quot;36&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect x=&quot;116&quot; y=&quot;20&quot; width=&quot;24&quot; height=&quot;36&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;140&quot; y=&quot;20&quot; width=&quot;520&quot; height=&quot;36&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;rect x=&quot;660&quot; y=&quot;20&quot; width=&quot;96&quot; height=&quot;36&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect x=&quot;756&quot; y=&quot;20&quot; width=&quot;24&quot; height=&quot;36&quot; style=&quot;fill:var(--muted)&quot;/&gt;
        &lt;text x=&quot;76&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot;&gt;Domanda&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Parte centrale: obiettivi · dati · metodi · risultati · conclusioni&lt;/text&gt;&lt;text x=&quot;708&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot;&gt;Take-home&lt;/text&gt;&lt;text x=&quot;128&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;Outline&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;76&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;Ref.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Ripartizione indicativa su ~18 minuti (proposta di questo riassunto, non delle slide).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Empirical o review of papers?&lt;/h3&gt;
  &lt;div class=&quot;tabs brick&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Contributo empirico&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Review of papers&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Fate voi una piccola analisi sui dati: grafici, confronti tra paesi, una regressione semplice. Esempio: scaricare dall’Eurobarometer la fiducia nella BCE per paese e confrontarla con l’inflazione.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt;: quale relazione volete misurare.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Data used&lt;/strong&gt;: fonte (Eurostat, Eurobarometer, BCE), periodo, paesi, unità di misura.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Methods&lt;/strong&gt;: statistiche descrittive, correlazioni, &lt;span class=&quot;term&quot;&gt;difference-in-differences&lt;/span&gt; (confronto delle variazioni tra un gruppo “trattato” e uno di controllo), ecc.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Results&lt;/strong&gt;: grafici leggibili, numeri chiave.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conclusions&lt;/strong&gt;: cosa potete dire e cosa no, per esempio che una correlazione non prova un effetto causale.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Leggete 2–4 articoli sullo stesso tema e li mettete a confronto. Per ciascun paper (o in una tabella comparativa):&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt;: la domanda del paper.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Data&lt;/strong&gt;: che dati usa (survey, serie macro, dati di mercato).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Methods&lt;/strong&gt;: esperimento, synthetic control, modello DSGE, ecc.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Results&lt;/strong&gt;: i numeri principali.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conclusions&lt;/strong&gt;: implicazioni di policy, e dove i paper concordano o divergono.&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Empirico&lt;/th&gt;&lt;th&gt;Review&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Punto di forza&lt;/td&gt;&lt;td&gt;Originalità, grafici vostri&lt;/td&gt;&lt;td&gt;Copertura, solidità delle fonti&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Rischio&lt;/td&gt;&lt;td&gt;Conclusioni causali non giustificate&lt;/td&gt;&lt;td&gt;Elenco piatto di riassunti senza sintesi&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Slide chiave&lt;/td&gt;&lt;td&gt;Grafico dei risultati&lt;/td&gt;&lt;td&gt;Tabella comparativa dei paper&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quali cinque elementi devono comparire nella parte centrale?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Objectives, data used, methods, results e conclusions, del paper letto o della vostra analisi.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa deve dire la slide di motivation, secondo le linee guida?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Come il tema scelto si collega alle questioni studiate e analizzate nel corso.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che differenza c’è tra take-home message e conclusions?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Le conclusions chiudono la parte centrale, paper per paper o analisi per analisi. Il take-home message è la sintesi finale: la risposta alla research question in poche frasi.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 3 · Le fonti&lt;/div&gt;&lt;h2&gt;Dove cercare&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;Notice that the topics will also be dealt with during classes → try to add and contribute by reading papers, articles, reports. For all topics find references directly ECB, EC research papers, Vox.eu, think-tank websites suggested in the first class.&lt;/div&gt;
  &lt;p&gt;Il messaggio è doppio: i temi verranno trattati anche a lezione, quindi la presentazione deve &lt;strong&gt;aggiungere&lt;/strong&gt; qualcosa (un paper, un dato, un caso) e non ripetere il manuale. Inoltre le fonti vanno prese &lt;strong&gt;alla fonte&lt;/strong&gt;: istituzioni e ricercatori, non giornali o blog generici.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ECB · European Central Bank&lt;/h4&gt;La Banca Centrale Europea pubblica la &lt;em&gt;Working Paper Series&lt;/em&gt; (ricerca), l’&lt;em&gt;Economic Bulletin&lt;/em&gt; (analisi congiunturale) e i dati dello &lt;em&gt;Statistical Data Warehouse&lt;/em&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;EC research papers&lt;/h4&gt;La Commissione europea, soprattutto la DG ECFIN (Affari economici e finanziari), pubblica i &lt;em&gt;European Economy Discussion Papers&lt;/em&gt; e le valutazioni ufficiali di NGEU e del RRF.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;VoxEU (CEPR)&lt;/h4&gt;Portale di &lt;em&gt;policy columns&lt;/em&gt; del Centre for Economic Policy Research: articoli brevi scritti dagli autori dei paper, che li riassumono. Sono un ottimo punto di partenza, poi si va al paper completo. Quasi tutti i link delle slide portano qui.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Think tanks&lt;/h4&gt;Centri di ricerca indipendenti su policy europea. L’elenco preciso è stato dato &lt;em&gt;in the first class&lt;/em&gt; e non è nel documento: controllate i vostri appunti della prima lezione.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 210&quot; role=&quot;img&quot; aria-label=&quot;Scala dell&#x27;affidabilità delle fonti&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;polygon points=&quot;400,10 560,200 240,200&quot; style=&quot;fill:none;stroke:var(--rule)&quot;/&gt;
        &lt;rect x=&quot;330&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Articolo su rivista&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;70&quot; width=&quot;200&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Working paper (BCE, CE, CEPR, Banca d’Italia)&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;110&quot; width=&quot;260&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;Column VoxEU · report di think tank&lt;/text&gt;
        &lt;rect x=&quot;240&quot; y=&quot;150&quot; width=&quot;320&quot; height=&quot;30&quot; rx=&quot;5&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;Stampa, blog: solo per contesto&lt;/text&gt;
        &lt;text x=&quot;600&quot; y=&quot;50&quot; style=&quot;fill:var(--muted)&quot;&gt;più verificato, più lento&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;170&quot; style=&quot;fill:var(--muted)&quot;&gt;più rapido, meno verificato&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Una gerarchia di massima (proposta del riassunto). Nella pratica: si parte da una column VoxEU e si risale al working paper che la sostiene.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Trovate una column VoxEU perfetta per il vostro tema. Basta citarla?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;È un buon inizio, ma conviene risalire al paper su cui si basa (di solito un CEPR Discussion Paper o un working paper), dove ci sono i dati e i metodi da presentare nella parte centrale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché le linee guida dicono “try to add and contribute”?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché i temi saranno trattati anche a lezione: la presentazione vale di più se porta letture, dati o report che vanno oltre la lezione.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;fiducia&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 4 · Tema&lt;/div&gt;&lt;h2&gt;Che cosa pensano i cittadini delle istituzioni europee?&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;WHAT DO EUROPEAN CITIZENS THINK OF EUROPEAN INSTITUTIONS AND HOW MUCH DO THEY TRUST THEM? What is the Extent of Euro Scepticism? What is the Eurobarometer? How can it be useful? See Eurobarometer data and report.&lt;/div&gt;

  &lt;h3&gt;Concetti chiave&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Trust (fiducia istituzionale)&lt;/h4&gt;Quanto i cittadini si fidano che un’istituzione (Commissione, Parlamento europeo, BCE) agisca bene e nel loro interesse. Conta perché le istituzioni UE hanno poca forza coercitiva diretta: la loro efficacia dipende dalla legittimità percepita.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Euroscepticism&lt;/h4&gt;Opposizione o diffidenza verso l’integrazione europea. In letteratura si distingue lo scetticismo &lt;em&gt;hard&lt;/em&gt;, contrario all’appartenenza stessa (uscita dall’UE o dall’euro), da quello &lt;em&gt;soft&lt;/em&gt;, contrario a singole politiche o a un’ulteriore integrazione. &lt;span class=&quot;note&quot;&gt;(distinzione classica di scienza politica, non nelle slide)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il Eurobarometer, cos’è e come funziona&lt;/h3&gt;
  &lt;p&gt;È il programma di sondaggi d’opinione della Commissione europea, attivo dagli anni ’70. Ne esistono varie famiglie:&lt;/p&gt;
  &lt;div class=&quot;tabs sage&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Standard&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Special&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Flash&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Parlemeter&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Esce due volte l’anno (primavera e autunno) con domande ripetute: fiducia nelle istituzioni, immagine dell’UE, sostegno all’euro, preoccupazioni principali. Grazie alle domande ripetute permette di costruire &lt;strong&gt;serie storiche&lt;/strong&gt;.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;Secondo la documentazione dell’archivio GESIS, lo Standard Eurobarometer si fa soprattutto con interviste faccia a faccia, su campioni nuovi a ogni ondata (&lt;span class=&quot;term&quot;&gt;repeated cross-section&lt;/span&gt;, cioè persone diverse ogni volta), di circa 1000 intervistati per paese. &lt;a href=&quot;https://www.gesis.org/en/eurobarometer-data-service/data-and-documentation/standard-special-eb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS Eurobarometer Data Service&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Approfondimenti tematici (clima, digitale, difesa…) con questionari più lunghi su un solo tema.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Sondaggi rapidi, spesso telefonici o online, su temi d’attualità e gruppi specifici (giovani, imprese).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Eurobarometer commissionati dal Parlamento europeo, per esempio sulla percezione del Parlamento e sulle elezioni europee.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Come leggere un dato di fiducia&lt;/h3&gt;
  &lt;p&gt;La domanda tipica chiede se si “tende a fidarsi” o “a non fidarsi” di un’istituzione, più “non so”. Per sintetizzare si usa spesso la &lt;span class=&quot;term&quot;&gt;net trust&lt;/span&gt; (fiducia netta):&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;net trust = % tend to trust − % tend not to trust&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tr&quot;&gt;Tend to trust&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;51&quot;&gt;&lt;output id=&quot;trO&quot;&gt;51%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dtr&quot;&gt;Tend not to trust&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dtr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;dtrO&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect id=&quot;bT&quot; x=&quot;0&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect id=&quot;bD&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect id=&quot;bN&quot; y=&quot;10&quot; height=&quot;30&quot; style=&quot;fill:var(--rule)&quot;/&gt;&lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Don’t know: &lt;b id=&quot;dkO&quot;&gt;9%&lt;/b&gt; · Net trust: &lt;b id=&quot;ntO&quot;&gt;+11&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Valori di partenza indicativi. Notate che con molti “non so” la stessa % di fiducia può corrispondere a una net trust molto diversa.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cosa dicono i dati recenti&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Fiducia nell&#x27;UE e nei governi nazionali, primavera 2025 e 2026&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;190&quot; x2=&quot;580&quot; y2=&quot;190&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;90&quot; x2=&quot;580&quot; y2=&quot;90&quot; style=&quot;stroke:var(--rule);stroke-dasharray:3 3&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;94&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;194&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;0&lt;/text&gt;
        &lt;rect x=&quot;110&quot; y=&quot;86&quot; width=&quot;70&quot; height=&quot;104&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;52%&lt;/text&gt;
        &lt;rect x=&quot;190&quot; y=&quot;118&quot; width=&quot;70&quot; height=&quot;72&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;225&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;36%&lt;/text&gt;
        &lt;rect x=&quot;350&quot; y=&quot;88&quot; width=&quot;70&quot; height=&quot;102&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;385&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;51%&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;116&quot; width=&quot;70&quot; height=&quot;74&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;37%&lt;/text&gt;
        &lt;text x=&quot;185&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Primavera 2025 (EB 103)&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Primavera 2026 (EB 105)&lt;/text&gt;
        &lt;rect x=&quot;70&quot; y=&quot;10&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;88&quot; y=&quot;20&quot;&gt;Fiducia nell’UE&lt;/text&gt;&lt;rect x=&quot;210&quot; y=&quot;10&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;228&quot; y=&quot;20&quot;&gt;Fiducia nel governo nazionale&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Grafico costruito con i dati delle fonti esterne qui sotto. Il dato 2026 è una rielaborazione secondaria: va verificato sul report ufficiale.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Primavera 2025 (Standard EB 103): fiducia nell’UE al 52%, il valore più alto dal 2007; governo nazionale 36%, parlamento nazionale 37%. &lt;a href=&quot;https://malta.representation.ec.europa.eu/news/eurobarometer-shows-record-high-trust-eu-and-strong-support-euro-and-common-defence-and-security-2025-05-28_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea, rappresentanza a Malta&lt;/a&gt;. Primavera 2026 (EB 105, campo marzo–aprile 2026): secondo un’analisi dell’Institut Jacques Delors, fiducia nell’UE al 51% contro il 37% per i governi nazionali. &lt;a href=&quot;https://informat.ro/en/eu/the-jacques-delors-institute-notes-that-support-for-the-eu-remains-high-but-the-differences-between-states-are-deepening-131242&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;resoconto dell’analisi Delors&lt;/a&gt;.&lt;/div&gt;
  &lt;p&gt;Quindi, in media, gli europei si fidano più dell’UE che dei propri governi. Le medie però nascondono &lt;strong&gt;forti differenze tra paesi&lt;/strong&gt;, ed è lì che una presentazione può dire qualcosa di nuovo: chi è più euroscettico, e perché? Contano reddito, inflazione, età, la crisi del debito sovrano?&lt;/p&gt;
  &lt;details class=&quot;sage&quot;&gt;&lt;summary&gt;Come può essere utile il Eurobarometer per la vostra presentazione&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Confronti tra paesi&lt;/strong&gt; nello stesso momento (dato cross-section).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Andamento nel tempo&lt;/strong&gt;, per esempio intorno alla crisi del 2010–12, al Covid o all’inflazione del 2022.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Legame con le variabili economiche&lt;/strong&gt;: si può incrociare la fiducia con disoccupazione o inflazione (dati Eurostat).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Limiti&lt;/strong&gt;: è un’opinione dichiarata, le domande e la modalità di intervista sono cambiate nel tempo, e una correlazione non prova un effetto causale.&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Fiducia 45%, sfiducia 45%, non so 10%: quanto vale la net trust?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;0. Un’opinione pubblica perfettamente divisa, anche se il 45% di fiducia da solo potrebbe sembrare “basso”.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che vuol dire che lo Standard Eurobarometer è un repeated cross-section?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;A ogni ondata si intervista un campione nuovo: si seguono le medie della popolazione nel tempo, non le stesse persone (che sarebbe un panel).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Differenza tra euroscetticismo hard e soft?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Hard: rifiuto dell’appartenenza (uscire dall’UE o dall’euro). Soft: critica di singole politiche o di un’ulteriore integrazione, restando dentro.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;bce&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 5 · Tema&lt;/div&gt;&lt;h2&gt;Il ruolo della fiducia nella BCE&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;THE ROLE OF TRUST IN THE ECB — cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&lt;/div&gt;

  &lt;h3&gt;Perché la fiducia nella banca centrale conta&lt;/h3&gt;
  &lt;p&gt;L’obiettivo della BCE è la stabilità dei prezzi (inflazione al 2% nel medio termine). Il canale principale passa dalle &lt;span class=&quot;term&quot;&gt;inflation expectations&lt;/span&gt; (aspettative di inflazione): se imprese e famiglie credono che l’inflazione resterà al 2%, fissano prezzi e salari di conseguenza e l’inflazione tende a restare lì. Si dice che le aspettative sono &lt;span class=&quot;term&quot;&gt;anchored&lt;/span&gt; (ancorate). La &lt;span class=&quot;term&quot;&gt;credibility&lt;/span&gt; (credibilità) della banca centrale è ciò che tiene l’ancora.&lt;/p&gt;

  &lt;h3&gt;Il problema specifico dell’euro: una banca centrale, tanti bilanci pubblici&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 220&quot; role=&quot;img&quot; aria-label=&quot;Catena: debito di un paese, timore di intervento della BCE, aspettative di inflazione in tutta l&#x27;area&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Notizia: più debito&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;in Italia, Francia, Spagna&lt;/text&gt;
        &lt;rect x=&quot;220&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Timore:&lt;/text&gt;&lt;text x=&quot;305&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;la BCE dovrà “aiutare”&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Tassi bassi / acquisti&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;→ più inflazione&lt;/text&gt;
        &lt;rect x=&quot;640&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;715&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Aspettative ↑&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;anche in Germania&lt;/text&gt;
        &lt;path d=&quot;M180 105H216M390 105H426M600 105H636&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;rect x=&quot;200&quot; y=&quot;170&quot; width=&quot;420&quot; height=&quot;38&quot; rx=&quot;19&quot; style=&quot;fill:var(--card);stroke:var(--sage);stroke-dasharray:5 3&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;La fiducia nella BCE può interrompere la catena qui&lt;/text&gt;
        &lt;path d=&quot;M305 168V144&quot; style=&quot;stroke:var(--sage);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;p&gt;Questo timore ha un nome: &lt;span class=&quot;term&quot;&gt;fiscal dominance&lt;/span&gt; (dominanza fiscale), cioè la situazione in cui la politica monetaria finisce subordinata alle esigenze di finanziamento del debito pubblico. In un’unione monetaria i costi si condividono: il debito di un paese può tradursi in inflazione per tutti. Da qui il titolo &lt;em&gt;“Your debt, my inflation”&lt;/em&gt;. Chi si fida che la BCE resti indipendente e fedele al mandato non cambia le proprie aspettative; chi non si fida sì.&lt;/p&gt;

  &lt;div class=&quot;ext&quot;&gt;
    &lt;p&gt;&lt;strong&gt;Lo studio dietro la column.&lt;/strong&gt; Un esperimento informativo randomizzato su imprese tedesche, con il &lt;em&gt;Bundesbank Online Panel of Firms&lt;/em&gt; (circa 7000 imprese intervistate ogni trimestre). Proiezioni pessimistiche sul debito di Francia, Italia e Spagna hanno alzato le aspettative di inflazione a tre anni delle imprese che &lt;em&gt;non&lt;/em&gt; si fidano della BCE, mentre quelle con alta fiducia non hanno reagito. L’annuncio di un pacchetto di debito tedesco da €500 mld non ha cambiato le aspettative. La column si basa sul CEPR Discussion Paper 21595. &lt;a href=&quot;https://cepr.org/voxeu/columns/your-debt-my-inflation-role-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU, “Your debt, my inflation”&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il metodo: l’esperimento informativo (information RCT)&lt;/h3&gt;
  &lt;div class=&quot;stepper sage&quot;&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Campione&lt;/h4&gt;&lt;p&gt;Un panel di imprese a cui si chiedono periodicamente aspettative su prezzi e inflazione, e quanto si fidano della BCE.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Randomizzazione&lt;/h4&gt;&lt;p&gt;Le imprese vengono divise &lt;strong&gt;a caso&lt;/strong&gt; in gruppi. Il caso garantisce che i gruppi siano in media uguali in tutto, tranne che nell’informazione ricevuta.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Trattamento&lt;/h4&gt;&lt;p&gt;Un gruppo legge un’informazione (per esempio le proiezioni sul debito di altri paesi), il gruppo di controllo no.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Misura&lt;/h4&gt;&lt;p&gt;Si chiedono di nuovo le aspettative di inflazione. La differenza media tra trattati e controllo è l’&lt;strong&gt;effetto causale&lt;/strong&gt; dell’informazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Eterogeneità&lt;/h4&gt;&lt;p&gt;Si confronta l’effetto tra imprese ad alta e a bassa fiducia nella BCE. È qui che emerge il ruolo della fiducia: l’effetto c’è solo per chi non si fida.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Prova tu: fiducia e reazione delle aspettative&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;tb&quot;&gt;Fiducia nella BCE&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tb&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;tbO&quot;&gt;30&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;nb&quot;&gt;Notizia sul debito (p.p. di PIL in più)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;nb&quot; min=&quot;0&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;nbO&quot;&gt;10&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;90&quot; x2=&quot;580&quot; y2=&quot;90&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;rect x=&quot;80&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;50&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Prima: 2,0%&lt;/text&gt;
      &lt;rect id=&quot;bceBar&quot; x=&quot;340&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;50&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; id=&quot;bceTxt&quot;&gt;Dopo&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot;&gt;Aspettativa d’inflazione a 3 anni: &lt;b id=&quot;bceO&quot;&gt;2,0%&lt;/b&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Modellino didattico inventato per il riassunto: Δπᵉ = 0,03 × notizia × (1 − fiducia/100). Riproduce solo la logica qualitativa del paper (chi si fida non reagisce), &lt;strong&gt;non&lt;/strong&gt; le sue stime.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;Collegamento utile: un’altra column VoxEU, su dati olandesi, trova che chi percepisce un’inflazione più alta o ha difficoltà finanziarie si fida meno della BCE. La causalità può quindi andare anche nell’altro senso, dall’inflazione alla fiducia. &lt;a href=&quot;https://cepr.org/voxeu/columns/high-inflation-erodes-trust-ecb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU, “High inflation erodes trust in the ECB”&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il debito italiano può alzare le aspettative di inflazione di un’impresa tedesca?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché la politica monetaria è unica: se l’impresa teme che la BCE tenga i tassi bassi o compri titoli per sostenere i paesi indebitati (fiscal dominance), si aspetta più inflazione in tutta l’area euro.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché si randomizza chi riceve l’informazione?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Perché così trattati e controllo sono in media identici, e la differenza nelle aspettative si può attribuire all’informazione e non a differenze preesistenti tra le imprese.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale risultato della column suggerisce che conta il debito &lt;em&gt;altrui&lt;/em&gt;?&lt;/p&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Le notizie sul debito di Francia, Italia e Spagna hanno mosso le aspettative delle imprese tedesche con poca fiducia nella BCE, mentre un pacchetto di debito tedesco da €500 mld non le ha cambiate.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;emu&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 6 · Tema&lt;/div&gt;&lt;h2&gt;Come misurare costi e benefici dell’adesione all’EMU&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;slide&quot;&gt;HOW TO MEASURE THE COSTS/BENEFITS OF JOINING EMU. Can the benefits of joining EMU or EU be measured? (see among others, papers that use synthetic cohort methods, e.g. papers.ssrn.com/sol3/papers.cfm?abstract_id=2432446)&lt;/div&gt;
  &lt;p&gt;&lt;strong&gt;EMU&lt;/strong&gt; = &lt;span class=&quot;term&quot;&gt;Economic and Monetary Union&lt;/span&gt;, l’Unione economica e monetaria: la moneta unica, la BCE e il coordinamento delle politiche economiche. La domanda ha due metà: &lt;em&gt;cosa&lt;/em&gt; ci si aspetta in teoria, e &lt;em&gt;come&lt;/em&gt; lo si misura in pratica.&lt;/p&gt;

  &lt;h3&gt;La teoria: optimum currency area&lt;/h3&gt;
  &lt;p&gt;La teoria delle &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (OCA, area valutaria ottimale), nata con Robert Mundell (1961), chiede quando a un gruppo di paesi conviene avere una sola moneta. Il costo principale è perdere il tasso di cambio e una politica monetaria propria, che servono soprattutto davanti a un &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt; (shock asimmetrico): uno shock che colpisce un paese e non gli altri, per esempio il crollo della domanda per il suo prodotto principale.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Benefici&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Niente costi di cambio tra valute (&lt;em&gt;transaction costs&lt;/em&gt;)&lt;/li&gt;&lt;li&gt;Niente incertezza sul tasso di cambio&lt;/li&gt;&lt;li&gt;Prezzi confrontabili, più concorrenza&lt;/li&gt;&lt;li&gt;Più commercio e integrazione finanziaria&lt;/li&gt;&lt;li&gt;Credibilità anti-inflazione “importata”, tassi più bassi&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Costi&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Niente svalutazione per assorbire shock asimmetrici&lt;/li&gt;&lt;li&gt;Una politica monetaria “taglia unica”, che può essere sbagliata per qualcuno&lt;/li&gt;&lt;li&gt;Un debito emesso in una moneta che il paese non controlla&lt;/li&gt;&lt;li&gt;Aggiustamento via salari e disoccupazione, se i mercati sono rigidi&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;ochre&quot;&gt;&lt;summary&gt;I criteri OCA: cosa riduce i costi&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Mobilità del lavoro&lt;/strong&gt; (Mundell): i lavoratori si spostano dove c’è domanda.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Flessibilità di prezzi e salari&lt;/strong&gt;: l’aggiustamento avviene senza cambio.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Apertura commerciale&lt;/strong&gt; (McKinnon): più si commercia tra i membri, più il cambio è inutile.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Diversificazione produttiva&lt;/strong&gt; (Kenen): economie diversificate subiscono meno shock specifici.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Trasferimenti fiscali&lt;/strong&gt;: un bilancio comune compensa le regioni colpite, ed è il legame con NGEU (parte 8).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Shock simili&lt;/strong&gt;: se i cicli sono sincronizzati, una politica monetaria unica va bene per tutti.&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;note&quot;&gt;Mundell (1961), McKinnon (1963) e Kenen (1969) sono indicati come i tre lavori fondativi della teoria (vedi “Per approfondire”).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h4&gt;Grafico interattivo: quando conviene entrare?&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; role=&quot;img&quot; aria-label=&quot;Benefici e costi dell&#x27;unione monetaria in funzione dell&#x27;integrazione commerciale&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;250&quot; x2=&quot;570&quot; y2=&quot;250&quot; style=&quot;stroke:var(--ink)&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;250&quot; x2=&quot;60&quot; y2=&quot;20&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;565&quot; y=&quot;275&quot; text-anchor=&quot;end&quot;&gt;integrazione commerciale con l’area →&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;22&quot;&gt;costi / benefici&lt;/text&gt;
        &lt;path id=&quot;ocaB&quot; style=&quot;fill:none;stroke:var(--sage);stroke-width:3&quot;/&gt;
        &lt;path id=&quot;ocaC&quot; style=&quot;fill:none;stroke:var(--brick);stroke-width:3&quot;/&gt;
        &lt;line id=&quot;ocaT&quot; y1=&quot;30&quot; y2=&quot;250&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 3&quot;/&gt;
        &lt;text id=&quot;ocaTt&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;T*&lt;/text&gt;
        &lt;circle id=&quot;ocaP&quot; r=&quot;7&quot; cy=&quot;250&quot; style=&quot;fill:var(--accent)&quot;/&gt;
        &lt;text x=&quot;520&quot; y=&quot;50&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;benefici&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;235&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;600&quot;&gt;costi&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ocaF&quot;&gt;Flessibilità di salari e mobilità del lavoro&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ocaF&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;ocaFO&quot;&gt;40&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ocaX&quot;&gt;Integrazione del paese&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ocaX&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;ocaXO&quot;&gt;55&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;ocaR&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Schema qualitativo in stile “manuale” (alla De Grauwe): i benefici crescono con l’integrazione commerciale, i costi diminuiscono. Più flessibilità abbassa la curva dei costi e sposta a sinistra la soglia T*. Le curve sono illustrative.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il problema della misura: il controfattuale&lt;/h3&gt;
  &lt;p&gt;Per misurare il beneficio dell’adesione servirebbe sapere come sarebbe andato &lt;em&gt;lo stesso paese senza entrare&lt;/em&gt;: il &lt;span class=&quot;term&quot;&gt;counterfactual&lt;/span&gt; (controfattuale), che non si osserva mai. Le strategie:&lt;/p&gt;
  &lt;div class=&quot;tabs ochre&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Prima/dopo&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Difference-in-differences&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Synthetic control&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Confronta la crescita prima e dopo l’ingresso. È ingenuo: attribuisce all’adesione anche tutto il resto (ciclo mondiale, crisi, riforme).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Confronta la &lt;em&gt;variazione&lt;/em&gt; del paese entrato con la variazione di paesi rimasti fuori. Funziona se, senza adesione, i due gruppi sarebbero andati in parallelo (&lt;span class=&quot;term&quot;&gt;parallel trends&lt;/span&gt;), cosa spesso dubbia.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Costruisce un “gemello” artificiale del paese come &lt;strong&gt;media ponderata di paesi non entrati&lt;/strong&gt; (il &lt;span class=&quot;term&quot;&gt;donor pool&lt;/span&gt;), con pesi scelti perché il gemello replichi bene il paese &lt;em&gt;prima&lt;/em&gt; dell’ingresso. Dopo l’ingresso, la distanza tra paese reale e gemello stima l’effetto. È il metodo che le slide chiamano &lt;em&gt;synthetic cohort / synthetic counterfactual&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Ŷ&lt;sub&gt;1t&lt;/sub&gt;&lt;sup&gt;N&lt;/sup&gt; = Σ&lt;sub&gt;j&lt;/sub&gt; w&lt;sub&gt;j&lt;/sub&gt; Y&lt;sub&gt;jt&lt;/sub&gt; &amp;nbsp;&amp;nbsp; con w&lt;sub&gt;j&lt;/sub&gt; ≥ 0, Σ w&lt;sub&gt;j&lt;/sub&gt; = 1 &amp;nbsp;&amp;nbsp;&amp;nbsp;⇒&amp;nbsp;&amp;nbsp;&amp;nbsp; α̂&lt;sub&gt;1t&lt;/sub&gt; = Y&lt;sub&gt;1t&lt;/sub&gt; − Ŷ&lt;sub&gt;1t&lt;/sub&gt;&lt;sup&gt;N&lt;/sup&gt;&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;Y&lt;sub&gt;1t&lt;/sub&gt; = PIL pro capite del paese entrato nell’anno t; Y&lt;sub&gt;jt&lt;/sub&gt; = quello del paese donatore j; w&lt;sub&gt;j&lt;/sub&gt; = pesi scelti per minimizzare l’errore prima dell’ingresso; α̂&lt;sub&gt;1t&lt;/sub&gt; = effetto stimato dopo l’ingresso. Riferimento metodologico: Abadie, Diamond e Hainmueller (2010).&lt;/p&gt;

  &lt;h4&gt;Laboratorio: costruisci tu il paese sintetico&lt;/h4&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 280&quot; role=&quot;img&quot; aria-label=&quot;Paese reale e paese sintetico prima e dopo l&#x27;adesione&quot;&gt;
