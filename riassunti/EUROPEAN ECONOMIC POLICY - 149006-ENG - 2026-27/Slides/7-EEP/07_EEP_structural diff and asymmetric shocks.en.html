      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;MIT Press, Cambridge (Mass.), 1991, xi + 142 pages, in the Gaston Eyskens Lectures series (also Leuven University Press). Krugman argues that the location of production must return to the centre of economic analysis: economies of scale and transport costs explain why industry concentrates in a few regions. It is the theoretical basis of the pessimistic view of integration.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://nantilus.univ-nantes.fr/vufind/Record/PPN002751038&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Catalogue record (Université de Nantes)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;European Commission (1990) — &lt;em&gt;One market, one money&lt;/em&gt;, European Economy no. 44&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: the &quot;European Commission view&quot; (slide 5) does not cite a specific document; this is the Commission study on the costs and benefits of EMU with which it is usually associated.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;A study by DG Economic and Financial Affairs published in October 1990, subtitled &quot;An evaluation of the potential benefits and costs of forming an economic and monetary union&quot; (351 pages). Daniel Gros (CEPS) observes that the central argument should have been read the other way round: it is the single currency that creates the single market; and that the report had not foreseen the large cross-border financial flows later linked to the crisis.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://aei.pitt.edu/98210&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Archive of European Integration (Univ. of Pittsburgh)&lt;/a&gt; · &lt;a href=&quot;https://www.ceps.eu/?p=9856&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commentary by D. Gros, CEPS&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Andrew K. Rose (2000) — &quot;One money, one market: the effect of common currencies on trade&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: empirical evidence in favour of the optimistic view (slide 7).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;&lt;em&gt;Economic Policy&lt;/em&gt;, no. 30, April 2000, pp. 7–46 (first as NBER Working Paper 7432, 1999). It uses a gravity model on panel data for 186 countries (1970–1990). &lt;strong&gt;Note:&lt;/strong&gt; the slides speak of trade flows being &quot;doubled&quot;, whereas the Frankel (2010) chapter cited among the sources reports Rose&#x27;s estimate as roughly &lt;em&gt;tripled&lt;/em&gt; trade between members of a currency union. Rose himself warned that the results, obtained mainly for small or poor countries, might not apply to EMU; hence the much lower subsequent estimates (5–20% in the slides).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/1377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://nber.org/system/files/working_papers/w7432/w7432.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER WP 7432 (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/system/files/chapters/c11658/c11658.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Frankel (2010), NBER chapter (PDF)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Ian M. McDonald and Robert M. Solow (1981) — &quot;Wage Bargaining and Employment&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: the model used in section 2 (slides 9–11).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;&lt;em&gt;American Economic Review&lt;/em&gt;, vol. 71, no. 5, December 1981, pp. 896–908. It analyses bargaining between unions and firms: in addition to the standard monopoly union case (the union sets the wage, the firm chooses employment, as used in the slides) it proposes &lt;em&gt;efficient bargains&lt;/em&gt;, contracts in which wages and employment are negotiated jointly. It is the starting point of the literature on wage bargaining.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/e/c/pmc76.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS: Ian M. McDonald&#x27;s page with the article&lt;/a&gt; · &lt;a href=&quot;https://authors.repec.org/pro/pso18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc: Robert M. Solow&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Robert J. Hodrick and Edward C. Prescott (1981, 1997) — &quot;Postwar U.S. Business Cycles: An Empirical Investigation&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: HP filter (slides 23–25).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;Circulated as Northwestern University Discussion Paper no. 451 (1981) and published in the &lt;em&gt;Journal of Money, Credit and Banking&lt;/em&gt;, vol. 29, no. 1, February 1997, pp. 1–16. It proposes the method for separating a series into a slowly moving trend and a cyclical component, and studies the co-movements of the cyclical components of macroeconomic series. It is the standard tool for estimating output gaps and cycles.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.2307/2953682&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI (JSTOR)&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/p/nwu/cmsems/451.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1981 working paper on RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;AMECO — the European Commission&#x27;s annual macro-economic database&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: source of Fig. 2.4 (slide 17) and of relative unit labour costs (slide 20).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;The annual database of DG ECFIN: macroeconomic series submitted by member states and reviewed by the Commission, for the EU, the member states and other G20 countries (national accounts, public finances, labour, prices, trade). It feeds the spring and autumn forecasts and is the official source for some public finance variables. It contains the actual data behind this lecture&#x27;s charts, including output gaps and ULC.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/data/datasets/AME/data-information&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AMECO on the ECB data portal&lt;/a&gt; · &lt;a href=&quot;https://db.nomics.world/AMECO&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AMECO on DBnomics&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;ECB / SSM — data on mortgage lending standards (credit underwriting, 2019)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: source of Chart A.2 on LTV and LTI (slide 14).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;In 2019 ECB Banking Supervision (SSM, Single Supervisory Mechanism) collected data from significant banks on new loans for 2016–2018. A special feature of the ECB&#x27;s Financial Stability Review (May 2020, judging by its URL) reports that in the euro area the average LTI rose from 4.0 to 4.4 and the average LTV from 80.3% to 81.0%, and that the share of mortgages with LTV above 80% or LTI above 5 is increasing. It is not confirmed that the slide&#x27;s Chart A.2 comes from this very article, but the data and the source match.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/pub/financial-stability/fsr/special/html/ecb.fsrart202005_01~762d09d7a2.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, special feature on residential mortgage lending standards&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;OECD (1999b)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: source of Table 2.2 on government bond maturity (slide 15).&lt;/div&gt;
      &lt;p&gt;The slides do not give the title of the publication and the search did not allow it to be identified with certainty, so no link is provided here. The full reference should be in the bibliography of the textbook from which the table is taken.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
