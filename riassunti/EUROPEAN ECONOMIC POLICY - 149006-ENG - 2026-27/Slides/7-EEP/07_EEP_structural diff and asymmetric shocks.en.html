  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;0&lt;/span&gt;&lt;div&gt;&lt;h2&gt;The problem: how likely are asymmetric shocks?&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 1–2&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;The lecture starts from a single question: &lt;em&gt;How likely are asymmetric shocks to happen?&lt;/em&gt; To see why it matters, two ideas that the slides take for granted are needed.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shock&lt;/b&gt;: a sudden, unexpected change in demand (for example, consumers stop buying a particular product) or in supply (for example, the price of oil doubles). An &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt; hits one country of the union and not the others, or hits them with different intensity or in different directions. A &lt;span class=&quot;term&quot;&gt;symmetric shock&lt;/span&gt; hits them all in the same way.&lt;/div&gt;

    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;This question comes from &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (OCA) theory. By joining a &lt;span class=&quot;term&quot;&gt;monetary union&lt;/span&gt; (MU), a country gives up its own exchange rate and its own monetary policy: the ECB sets a single interest rate for all members. If shocks are symmetric this is not a problem, because the same response suits everyone. If they are asymmetric, the affected country is left without the two classic instruments and must adjust in other ways: wage flexibility, labour mobility, fiscal transfers. Hence, &lt;strong&gt;the more likely asymmetric shocks are, the more costly the union is&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Three types of shock&lt;/h3&gt;
    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Symmetric&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Asymmetric&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;c&quot; aria-selected=&quot;false&quot;&gt;Symmetric, transmitted asymmetrically&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;a&quot; class=&quot;card&quot;&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;50&quot; style=&quot;fill:var(--ard)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;50&quot; style=&quot;fill:var(--ard)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;the same fall in demand for everyone&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;The shock hits all members in the same way. A single monetary policy response (for example, an ECB rate cut) suits everyone: the union costs nothing.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;b&quot; class=&quot;card&quot; hidden&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;80&quot; style=&quot;fill:var(--mat)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;98&quot; width=&quot;70&quot; height=&quot;12&quot; style=&quot;fill:var(--sal)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;A in recession, B almost unaffected&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;The shock hits A (for example, demand for its main sector collapses) but not B. A would like lower interest rates, B would not: the ECB cannot satisfy both.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;c&quot; class=&quot;card&quot; hidden&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;40&quot; width=&quot;70&quot; height=&quot;70&quot; style=&quot;fill:var(--ocr)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;80&quot; width=&quot;70&quot; height=&quot;30&quot; style=&quot;fill:var(--ocr)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Country B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;same shock, different institutions → different effects&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;The case the lecture stresses most. The initial shock is common (an oil shock, a central bank rate hike), but the labour market, the legal system and financial markets &lt;strong&gt;transmit&lt;/strong&gt; it differently. In the end the effect is asymmetric.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Sources of asymmetry (slide 2)&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sal)&quot;&gt;&lt;h4&gt;Different productive structures&lt;/h4&gt;&lt;p&gt;Countries produce different goods, so a demand shock to one sector affects them differently. → &lt;a href=&quot;#s1&quot;&gt;section 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ocr)&quot;&gt;&lt;h4&gt;Different labour market institutions&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Centralised&lt;/em&gt; or &lt;em&gt;decentralised&lt;/em&gt; wage bargaining. A symmetric shock (for example, an oil shock) is transmitted differently if institutions differ. → &lt;a href=&quot;#s2&quot;&gt;section 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ard)&quot;&gt;&lt;h4&gt;Different legal systems&lt;/h4&gt;&lt;p&gt;The same interest rate change decided by the CB (central bank) is transmitted differently. Anglo-Saxon and continental financial markets compared. → &lt;a href=&quot;#s3&quot;&gt;section 3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--mat)&quot;&gt;&lt;h4&gt;Different economic policies&lt;/h4&gt;&lt;p&gt;Taxation, spending, social and wage policies remain national and can themselves generate shocks. → &lt;a href=&quot;#s4&quot;&gt;section 4&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Slide 2 groups labour market and legal systems under &quot;different market structures and functioning&quot;; the lecture then develops four numbered parts (1–4), which follow the same numbering here.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why are asymmetric shocks a more serious problem in a monetary union than with national currencies?&lt;/summary&gt;&lt;p&gt;Because the affected country can no longer devalue or lower its own interest rates: monetary policy is single and is set for the area as a whole. It must adjust through wages, mobility or fiscal transfers.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Can an oil price increase that is the same for everyone become an asymmetric shock?&lt;/summary&gt;&lt;p&gt;Yes. If labour market institutions differ (for example, wages are indexed in one country and not in the other), the same shock produces different dynamics of wages, prices and employment. This is the case of the &quot;symmetric shock transmitted asymmetrically&quot;.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What are the four sources of asymmetry covered in the lecture?&lt;/summary&gt;&lt;p&gt;Different productive structures; different labour market institutions; different legal systems and financial markets; national economic policies (the very existence of nation-states).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part&quot; style=&quot;--c:var(--sal);--cb:var(--sal-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Different productive structures&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 3–7&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Starting question: &lt;em&gt;how likely is a demand shock to remain confined to the national level?&lt;/em&gt; It depends on how similar the countries&#x27; productive structures are. And the MU can &lt;strong&gt;either reduce or accentuate&lt;/strong&gt; existing differences. There are two views.&lt;/p&gt;

    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;opt&quot; aria-selected=&quot;true&quot;&gt;Optimistic view&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;pes&quot; aria-selected=&quot;false&quot;&gt;Pessimistic view&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;opt&quot; class=&quot;card&quot;&gt;
        &lt;h4&gt;Trade makes economies more similar&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;Trade among European countries is based on &lt;span class=&quot;term&quot;&gt;economies of scale&lt;/span&gt; (unit cost falls as output rises) and &lt;span class=&quot;term&quot;&gt;imperfect competition&lt;/span&gt; (in particular &lt;em&gt;product differentiation&lt;/em&gt;: each firm sells its own variety, like different car brands).&lt;/li&gt;
          &lt;li&gt;The result is trade in which countries buy and sell &lt;strong&gt;the same categories of products&lt;/strong&gt; to each other: Germany exports cars to France and France exports cars to Germany.&lt;/li&gt;
          &lt;li&gt;This is &lt;span class=&quot;term&quot;&gt;intra-industry trade&lt;/span&gt;: it leads to similar patterns of specialisation, so most demand shocks affect countries in a similar way.&lt;/li&gt;
          &lt;li&gt;Conclusion: more integration → more similar economic structures → &lt;strong&gt;fewer asymmetric shocks&lt;/strong&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;pes&quot; class=&quot;card&quot; hidden&gt;
        &lt;h4&gt;Trade leads to specialisation and concentration&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span class=&quot;term&quot;&gt;Economies of scale&lt;/span&gt; push production to concentrate in a few locations: &lt;span class=&quot;term&quot;&gt;agglomeration effects&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;clustering&lt;/span&gt; emerge.&lt;/li&gt;
          &lt;li&gt;Once trade barriers are removed, it pays to produce each good where the industry is already concentrated (suppliers, specialised workers, know-how).&lt;/li&gt;
          &lt;li&gt;Regions specialise in different sectors: a demand shock to one sector mainly hits the region that hosts it.&lt;/li&gt;
          &lt;li&gt;Conclusion: more integration → &lt;strong&gt;more asymmetric shocks&lt;/strong&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The car example: US versus EU (slide 4)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Regional distribution of car production, US and EU&quot;&gt;
        &lt;text x=&quot;20&quot; y=&quot;22&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;US&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;22&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;EU&lt;/text&gt;
        &lt;g id=&quot;autoBars&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Share of car production by region (%). Data from slide 4, &quot;Table 2.1 Regional distribution of auto production&quot;, source Krugman (1991).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;In the US, two thirds of cars are produced in the Midwest; in Europe, production is spread across four countries. The slides&#x27; reading: the US market is &lt;strong&gt;more integrated&lt;/strong&gt; (fewer obstacles to trade). If the EU moves towards a truly integrated market, it could see regional concentrations similar to the American ones: this is the empirical argument in favour of the pessimistic view.&lt;/p&gt;

    &lt;h3&gt;Two graphs, two predictions (slides 5–6)&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;How is symmetry measured?&lt;/b&gt; By the degree of &lt;span class=&quot;term&quot;&gt;statistical correlation&lt;/span&gt; of economic activity across countries, i.e. how much GDP and/or employment move together (&lt;em&gt;co-movements&lt;/em&gt;).&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;ρ&lt;sub&gt;AB&lt;/sub&gt; = cov(y&lt;sub&gt;A&lt;/sub&gt;, y&lt;sub&gt;B&lt;/sub&gt;) / (σ&lt;sub&gt;A&lt;/sub&gt; · σ&lt;sub&gt;B&lt;/sub&gt;) &amp;nbsp;&amp;nbsp; with −1 ≤ ρ ≤ 1&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;ρ close to 1: the two countries grow and slow down together, so shocks are mainly symmetric. ρ close to 0 or negative: each cycle goes its own way.&lt;/p&gt;

    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;viewsChart&quot; viewBox=&quot;0 0 520 320&quot; role=&quot;img&quot; aria-label=&quot;Symmetry and trade integration: EC view versus Krugman view&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;280&quot; x2=&quot;490&quot; y2=&quot;280&quot; style=&quot;stroke:var(--ink);stroke-width:1.5&quot;/&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;280&quot; x2=&quot;60&quot; y2=&quot;20&quot; style=&quot;stroke:var(--ink);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;275&quot; y=&quot;308&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;Trade integration&lt;/text&gt;
        &lt;text x=&quot;22&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 22 150)&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;Symmetry&lt;/text&gt;
        &lt;line x1=&quot;80&quot; y1=&quot;250&quot; x2=&quot;470&quot; y2=&quot;50&quot; style=&quot;stroke:var(--sal);stroke-width:3&quot;/&gt;
        &lt;line x1=&quot;80&quot; y1=&quot;50&quot; x2=&quot;470&quot; y2=&quot;250&quot; style=&quot;stroke:var(--mat);stroke-width:3&quot;/&gt;
        &lt;text x=&quot;470&quot; y=&quot;40&quot; text-anchor=&quot;end&quot; style=&quot;font-size:13px;font-weight:600;fill:var(--sal)&quot;&gt;EC view&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;270&quot; text-anchor=&quot;end&quot; style=&quot;font-size:13px;font-weight:600;fill:var(--mat)&quot;&gt;Krugman view&lt;/text&gt;
        &lt;line id=&quot;vcLine&quot; x1=&quot;275&quot; y1=&quot;280&quot; x2=&quot;275&quot; y2=&quot;30&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 4&quot;/&gt;
        &lt;circle id=&quot;vcEC&quot; cx=&quot;275&quot; cy=&quot;150&quot; r=&quot;7&quot; style=&quot;fill:var(--sal)&quot;/&gt;
        &lt;circle id=&quot;vcK&quot; cx=&quot;275&quot; cy=&quot;150&quot; r=&quot;7&quot; style=&quot;fill:var(--mat)&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Trade integration &lt;input type=&quot;range&quot; id=&quot;tiSlider&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;tiOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Redrawing of slides 5 (European Commission view) and 6 (Krugman view). Move the slider: with more integration the two views diverge more and more.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;vs&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--sal)&quot;&gt;European Commission view&lt;/h4&gt;&lt;p&gt;Positive slope: more trade → more symmetric shocks. This is the optimistic version, advocated by the Commission at the time of the monetary union project.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--mat)&quot;&gt;Krugman view&lt;/h4&gt;&lt;p&gt;Negative slope: more trade → regional specialisation → more asymmetric shocks. This is the pessimistic version, put forward by Paul Krugman.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Which view prevails? (slide 7)&lt;/h3&gt;
    &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;A bit of both, but…&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;Even if the pessimistic view prevailed, agglomeration effects &lt;strong&gt;do not respect national borders&lt;/strong&gt;: industrial districts extend across countries (&lt;em&gt;industrial agglomerations cut across countries&lt;/em&gt;).&lt;/p&gt;
      &lt;p&gt;Shocks would then hit &lt;em&gt;regions&lt;/em&gt; spanning several countries, and a national monetary policy would be of no use anyway: a country with half a region affected and half not would not know which interest rate to choose. Giving up the national currency is therefore less costly than it seems.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Empirical evidence: Rose (2000) and subsequent estimates&lt;/summary&gt;&lt;div&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Rose (2000)&lt;/strong&gt; and others support the optimistic view. Using panel data analysis (data on many countries over several years) and controlling for other variables, he finds that belonging to an MU &lt;strong&gt;doubles&lt;/strong&gt; trade flows among members.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;More recent&lt;/strong&gt; estimates are much lower: the increase in trade flows is between &lt;strong&gt;5% and 20%&lt;/strong&gt;.&lt;/li&gt;
        &lt;li&gt;Trade intensity is &lt;strong&gt;positively correlated&lt;/strong&gt; with the correlation of economic activity: countries that trade more have more synchronised business cycles.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;This last point is the idea of the &quot;endogeneity&quot; of the OCA criteria, made famous by Frankel and Rose (1998): an area can become &quot;optimal&quot; after it is created, because the single currency boosts trade and trade synchronises business cycles.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;The role of services&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;Services account for an ever larger share of GDP and are &lt;strong&gt;less subject to economies of scale&lt;/strong&gt;: a hairdresser, a medical practice or a restaurant does not concentrate in a single region of Europe. This dampens the agglomeration mechanism of the pessimistic view.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What is intra-industry trade and why does it reduce asymmetric shocks?&lt;/summary&gt;&lt;p&gt;It is the exchange of products of the same category between countries (cars for cars), driven by economies of scale and product differentiation. If countries produce the same goods, a demand shock to one sector affects them in a similar way.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why does the car table (US/EU) support the pessimistic view?&lt;/summary&gt;&lt;p&gt;The more integrated US market shows strong concentration (Midwest 66.3%). If the EU becomes equally integrated, it could concentrate production in the same way, hence more specialisation and more regional shocks.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;In the symmetry–trade integration graph, what is the slope of the Krugman curve, and why?&lt;/summary&gt;&lt;p&gt;Negative: economies of scale lead to agglomeration and specialisation, so more integration means less symmetry.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;If the pessimistic view were true, would a national monetary policy be needed?&lt;/summary&gt;&lt;p&gt;Not much: clusters cross borders, so shocks hit transnational regions and a national monetary policy would be unable to target them.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What do recent estimates say about the effect of an MU on trade?&lt;/summary&gt;&lt;p&gt;An increase in flows of 5–20%, much less than the doubling found by Rose (2000).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part&quot; style=&quot;--c:var(--ocr);--cb:var(--ocr-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Institutional differences in the labour market&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 8–12&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Institutional differences in labour markets create &lt;strong&gt;asymmetries in the transmission of shocks&lt;/strong&gt;. Within the MU, some of these differences tend to disappear, while others remain.&lt;/p&gt;

    &lt;div class=&quot;vs&quot;&gt;
      &lt;div&gt;&lt;h4&gt;Disappear in the MU&lt;/h4&gt;&lt;p&gt;The MU puts pressure on the wage demands of &lt;em&gt;trade unions&lt;/em&gt;. The mechanism can be seen with the McDonald and Solow (1981) model, below.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Remain&lt;/h4&gt;&lt;p&gt;The extent of &lt;em&gt;public employment&lt;/em&gt;; regulatory differences in EPL, unemployment benefits, active labour market policies, labour taxes. See &lt;a href=&quot;#s2rest&quot;&gt;below&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The McDonald–Solow monopoly union model&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monopoly union model&lt;/b&gt;: the union chooses the real wage &lt;i&gt;W/P&lt;/i&gt;; firms then decide how many workers &lt;i&gt;N&lt;/i&gt; to hire along the labour demand curve. The union has preferences over both, represented by an &lt;span class=&quot;term&quot;&gt;indifference curve&lt;/span&gt; (wage–employment combinations that give it the same utility). The optimum is the point of &lt;strong&gt;tangency&lt;/strong&gt; between the indifference curve and the &lt;span class=&quot;term&quot;&gt;employment curve&lt;/span&gt; (the labour demand curve of the whole economy).&lt;/div&gt;

    &lt;div class=&quot;stepper card&quot; id=&quot;msSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 1&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Union preferences.&lt;/strong&gt; The indifference curve assigns a weight to wage growth and one to employment growth. A higher wage at the same level of employment is better, and vice versa.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 2&lt;/span&gt;&lt;p&gt;&lt;strong&gt;The authorities give more weight to employment.&lt;/strong&gt; Suppose the authorities (government and national central bank) care about employment more than the union does. If high wage demands reduce employment too much, they respond with an &lt;em&gt;expansionary policy&lt;/em&gt; to create jobs and keep unemployment low.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 3&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Labour demand becomes steeper.&lt;/strong&gt; The authorities&#x27; preferences enter the economy&#x27;s labour demand curve: if wages rise, employment falls &lt;em&gt;less&lt;/em&gt;, because the expansionary policy compensates. A steeper curve = employment &lt;strong&gt;less responsive&lt;/strong&gt; to wage increases.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 4&lt;/span&gt;&lt;p&gt;&lt;strong&gt;The union anticipates this.&lt;/strong&gt; If the union takes this reaction into account, its demands stay high: with a steeper curve, asking for more costs fewer jobs. The new tangency point is higher (the dashed curve on the slides: &quot;Unions fix a higher wage objective&quot;).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;msChart&quot; viewBox=&quot;0 0 480 330&quot; role=&quot;img&quot; aria-label=&quot;Interactive McDonald-Solow model&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Weight the authorities place on employment &lt;input type=&quot;range&quot; id=&quot;msTheta&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot;&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;msOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Interactive version of slide 10. In grey, the initial situation; in colour, the one with more &quot;accommodating&quot; authorities. Teaching assumption (not in the slides): union utility U = √(w·N) and linear labour demand w = s·(10 − N), which rotates around the same point on the N axis as in the slide&#x27;s drawing.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;Under these assumptions the union&#x27;s optimum is N* = 5 and w* = 5·s: if the curve becomes steeper (larger s), the union obtains a higher wage and, thanks to the authorities&#x27; expansion, the same employment. This is precisely why it has an incentive to demand more.&lt;/p&gt;

    &lt;h3&gt;Two countries joining the MU (slide 11)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 620 230&quot; role=&quot;img&quot; aria-label=&quot;The Solow-McDonald model in two countries&quot;&gt;
        &lt;g style=&quot;stroke:var(--ink);stroke-width:1.4;fill:none&quot;&gt;
          &lt;path d=&quot;M40 20 V200 H290&quot;/&gt;&lt;path d=&quot;M340 20 V200 H590&quot;/&gt;
          &lt;path d=&quot;M60 70 L270 180&quot; style=&quot;stroke:var(--ocr);stroke-width:2.2&quot;/&gt;
          &lt;path d=&quot;M120 85 C 150 130, 190 150, 260 160&quot;/&gt;
          &lt;path d=&quot;M370 30 L480 185&quot; style=&quot;stroke:var(--ocr);stroke-width:2.2&quot;/&gt;
          &lt;path d=&quot;M385 35 C 400 80, 440 110, 520 120&quot;/&gt;
        &lt;/g&gt;
        &lt;circle cx=&quot;173&quot; cy=&quot;130&quot; r=&quot;5&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;124&quot; style=&quot;font-size:13px&quot;&gt;A&lt;/text&gt;
        &lt;circle cx=&quot;400&quot; cy=&quot;72&quot; r=&quot;5&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;408&quot; y=&quot;70&quot; style=&quot;font-size:13px&quot;&gt;B&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;18&quot; style=&quot;font-size:12px&quot;&gt;(W/P)&lt;tspan font-size=&quot;9&quot;&gt;A&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;18&quot; style=&quot;font-size:12px&quot;&gt;(W/P)&lt;tspan font-size=&quot;9&quot;&gt;B&lt;/tspan&gt;&lt;/text&gt;
        &lt;text x=&quot;280&quot; y=&quot;218&quot; style=&quot;font-size:12px&quot;&gt;N&lt;tspan font-size=&quot;9&quot;&gt;A&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;218&quot; style=&quot;font-size:12px&quot;&gt;N&lt;tspan font-size=&quot;9&quot;&gt;B&lt;/tspan&gt;&lt;/text&gt;
        &lt;text x=&quot;165&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px;fill:var(--muted)&quot;&gt;Country A: flat curve&lt;/text&gt;
        &lt;text x=&quot;465&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px;fill:var(--muted)&quot;&gt;Country B: steep curve&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Redrawing of &quot;Figure 2.3 The Solow–McDonald model in two countries&quot; (slide 11).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;Two countries may join the MU with different aggregate employment curves. The steeper the curve, the less wage increases affect employment (B has accommodating authorities, A does not).&lt;/li&gt;
      &lt;li&gt;In the MU, national monetary authorities are no longer independent and &lt;strong&gt;cannot respond with an expansionary monetary policy&lt;/strong&gt; → B&#x27;s curve flattens and the differences tend to disappear. B&#x27;s union now knows that high wages cost jobs.&lt;/li&gt;
      &lt;li&gt;The &lt;strong&gt;fiscal&lt;/strong&gt; authorities, however, can still behave differently and support employment even with wage increases exceeding productivity growth. This provides a bridge to &lt;a href=&quot;#s4&quot;&gt;section 4&lt;/a&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3 id=&quot;s2rest&quot;&gt;The differences that remain (slide 12)&lt;/h3&gt;
    &lt;p&gt;Even with the same currency, a symmetric shock &lt;strong&gt;can propagate differently and become asymmetric&lt;/strong&gt; depending on labour market institutions. Open the cards to see how each institution changes the transmission.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Extent of public employment&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The share of employed people working in the public sector. &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;Public-sector jobs do not respond to the cycle: where they are numerous, a negative shock affects a smaller share of workers, but wages across the whole economy may adjust more slowly.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;EPL — Employment Protection Legislation&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The rules on dismissals and contracts (notice periods, severance pay, restrictions on fixed-term contracts). &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;With strict EPL, firms dismiss fewer workers in a recession but hire fewer in a recovery: the shock falls more on hours worked, wages or temporary contracts than on the number of permanent employees.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Unemployment benefits&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Amount and duration of unemployment benefits. &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;They support income and hence demand during a crisis (automatic stabiliser), but may slow down job search and wage adjustment.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Active labour market policies&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Training, employment services, hiring incentives. &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;They make it easier to move workers from declining sectors to growing ones, thereby shortening the effects of a shock.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Labour taxes&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Taxes and social contributions on labour (the tax wedge). &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;They determine how much of an increase in labour costs reaches net wages: the same price shock can lead to different wage demands.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Centralized vs non-centralized wage bargaining&lt;/summary&gt;&lt;div&gt;&lt;p&gt;From slide 2. &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;With centralised bargaining, national unions can take into account the economy-wide effects of their demands and moderate them after an oil shock; with fragmented bargaining, each occupational group tries to recover its purchasing power, risking a wage–price spiral.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;In the McDonald–Solow model, what does the optimum point represent?&lt;/summary&gt;&lt;p&gt;The tangency between the union&#x27;s indifference curve (preferences over wages and employment) and the economy&#x27;s employment curve: it is the best wage–employment combination the union can obtain.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why does labour demand become steeper if the authorities care a lot about employment?&lt;/summary&gt;&lt;p&gt;Because when wages rise and employment falls, the authorities respond with expansionary policies that create jobs. Employment therefore reacts less to wages: the curve is steeper.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why does this cross-country difference tend to disappear in the MU?&lt;/summary&gt;&lt;p&gt;Because national monetary authorities no longer exist as independent actors: they can no longer respond to high wage demands with monetary expansion. Unions know this and moderate their demands.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which channel remains open to support employment despite excessive wages?&lt;/summary&gt;&lt;p&gt;National fiscal policy, which can continue to support employment even when wages grow faster than productivity.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Name three labour market institutions that remain different even in the MU.&lt;/summary&gt;&lt;p&gt;Any of: extent of public employment, EPL, unemployment benefits, active labour market policies, labour taxes.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Different legal systems and financial markets&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 13–15&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Financial markets continue to function differently across the EU, so &lt;strong&gt;the same monetary shock&lt;/strong&gt; (for example, an ECB rate hike) is likely to be transmitted in very different ways. The main cause is the &lt;strong&gt;legal systems&lt;/strong&gt; of the member states, which remain highly diverse and create &lt;em&gt;deep&lt;/em&gt; differences in financial systems.&lt;/p&gt;

    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;as&quot; aria-selected=&quot;true&quot;&gt;Anglo-Saxon&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;ce&quot; aria-selected=&quot;false&quot;&gt;Continental European&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;me&quot; aria-selected=&quot;false&quot;&gt;Mediterranean&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;as&quot; class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;&lt;strong&gt;Market-based&lt;/strong&gt;: firms raise much of their funding by issuing shares and bonds. A rate increase shows up immediately in security prices and in households&#x27; financial wealth.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-panel=&quot;ce&quot; class=&quot;card&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;&lt;strong&gt;Bank-based&lt;/strong&gt;: firms are financed mainly through bank loans, often within stable, long-term bank–firm relationships that can cushion the effect of a rate hike.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-panel=&quot;me&quot; class=&quot;card&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;Banks dominate here too, but the bank–firm relationship differs from the continental one: the slides compare precisely &quot;Continental and Mediterranean relative to bank-firm relationship&quot;. Smaller firms that depend more on short-term bank credit feel monetary tightening more strongly and sooner.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Other national differences that change transmission&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Taxes on financial and housing wealth&lt;/h4&gt;&lt;p&gt;Taxes on financial and housing wealth change how much a change in asset prices affects consumption and investment.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Incentives / disincentives wrt housing property&lt;/h4&gt;&lt;p&gt;Incentives or disincentives for home ownership (for example, mortgage interest deductions): they change how many households are indebted and therefore exposed to interest rates.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mortgage rules&lt;/h4&gt;&lt;p&gt;Mortgage rules: fixed or variable rate, how much can be lent relative to the value of the home or to income. &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;Where variable rates prevail, an ECB rate hike immediately hits household balance sheets.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Example: LTV and LTI in the euro area (slide 14)&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;LTV — Loan-to-Value&lt;/b&gt;&lt;br&gt;loan / property value × 100. An LTV of 80% means the bank finances 80% of the house price.&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;LTI — Loan-to-Income&lt;/b&gt;&lt;br&gt;loan / annual income. An LTI of 4.5 means the mortgage is worth 4.5 years of income.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Calculator&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;House price (k€) &lt;input type=&quot;range&quot; id=&quot;ltvPrice&quot; min=&quot;100&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;ltvPriceO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Mortgage (k€) &lt;input type=&quot;range&quot; id=&quot;ltvLoan&quot; min=&quot;20&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;240&quot;&gt;&lt;output id=&quot;ltvLoanO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Annual income (k€) &lt;input type=&quot;range&quot; id=&quot;ltvInc&quot; min=&quot;20&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;ltvIncO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ltvOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;ltvScatter&quot; viewBox=&quot;0 0 560 360&quot; role=&quot;img&quot; aria-label=&quot;Average LTV and LTI by country 2016-2018&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ltvPick&quot;&gt;Hover over or tap a point to see the country.&lt;/div&gt;
      &lt;figcaption&gt;Average LTV (%) and average LTI of new mortgages, 2016–2018. Values &lt;strong&gt;read by eye&lt;/strong&gt; from &quot;Chart A.2&quot; on slide 14 (stated source: SSM credit underwriting data collection exercise, 2019), hence approximate. In ochre, the euro area (EA) average. The lines divide the chart at LTV 70% and LTI 5, as in the original.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;The slide&#x27;s message: &lt;em&gt;lending standards and their dynamics differ widely across euro area countries&lt;/em&gt;. In France almost 90% of the home&#x27;s value is lent, with a low LTI; in Cyprus and Greece LTV is around 50–60%; in Luxembourg LTI is close to 7. The 2016–18 changes (right-hand panel of the slide) also go in different directions: Italy, Austria and Belgium rise, while Lithuania, the Netherlands and Greece fall. The same rate hike therefore meets households with very different levels of indebtedness.&lt;/p&gt;

    &lt;h3&gt;Not everything depends on the law: inflation and debt maturity (slide 15)&lt;/h3&gt;
    &lt;p&gt;Some differences in financial markets developed over time because countries pursued &lt;strong&gt;different monetary policies&lt;/strong&gt;. Example: inflation and the maturity of government bonds.&lt;/p&gt;
    &lt;div class=&quot;tscroll card&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;1998&lt;/th&gt;&lt;th&gt;Short term (&amp;lt;1 year)&lt;/th&gt;&lt;th&gt;Medium &amp;amp; long (&amp;gt;1 year)&lt;/th&gt;&lt;th&gt;of which long (&amp;gt;5 years)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Italy&lt;/td&gt;&lt;td&gt;49.4&lt;/td&gt;&lt;td&gt;50.6&lt;/td&gt;&lt;td&gt;24.8&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Germany&lt;/td&gt;&lt;td&gt;18.5&lt;/td&gt;&lt;td&gt;81.5&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Netherlands&lt;/td&gt;&lt;td&gt;6.7&lt;/td&gt;&lt;td&gt;93.3&lt;/td&gt;&lt;td&gt;63.0&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;&quot;Table 2.2 Maturity distribution of government bonds (% of total), 1998&quot;, source OECD (1999b), slide 15.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepper card&quot; id=&quot;matSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;p&gt;&lt;strong&gt;High inflation&lt;/strong&gt; → investors do not want to lock in a fixed rate for many years, because future inflation could &quot;eat up&quot; the return.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;p&gt;The government therefore issues mainly &lt;strong&gt;short-term debt&lt;/strong&gt; (Italy in 1998: almost half with maturity under one year).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;p&gt;Short-term debt must be rolled over frequently at current rates: &lt;strong&gt;when rates rise, interest expenditure and the deficit respond immediately&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;p&gt;Deficit and debt become highly &lt;strong&gt;dependent on inflation&lt;/strong&gt; and interest rates: the same monetary shock weighs much more heavily on Italian public finances than on Dutch ones.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5&lt;/span&gt;&lt;p&gt;In the MU, with common inflation and monetary policy, &lt;strong&gt;differences in maturity distribution narrow&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;How much does a rate hike weigh on the deficit?&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Δ interest expenditure (% GDP) ≈ debt/GDP × short-term share × Δi&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;A teaching simplification for the first year: only the short-term part is rolled over at the new rate, while the long-term part stays at the fixed rate already being paid.&lt;/p&gt;
      &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;49.4&quot;&gt;Italy 1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;18.5&quot;&gt;Germany 1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;6.7&quot;&gt;Netherlands 1998&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;Debt/GDP (%) &lt;input type=&quot;range&quot; id=&quot;dmDebt&quot; min=&quot;40&quot; max=&quot;140&quot; value=&quot;110&quot;&gt;&lt;output id=&quot;dmDebtO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Short-term share (%) &lt;input type=&quot;range&quot; id=&quot;dmShort&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.1&quot; value=&quot;49.4&quot;&gt;&lt;output id=&quot;dmShortO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Rate hike (percentage points) &lt;input type=&quot;range&quot; id=&quot;dmDi&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.25&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;dmDiO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;dmOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why do different legal systems make a common monetary shock asymmetric?&lt;/summary&gt;&lt;p&gt;Because they create different financial systems (market-based versus bank-based, bank–firm relationships, mortgage and tax rules): the same rate hike reaches firms and households through different channels and with different intensity.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What does LTV measure, and what does LTI measure?&lt;/summary&gt;&lt;p&gt;LTV = mortgage / home value (in %); LTI = mortgage / annual income (a multiple). They measure how indebted households are relative to collateral and to income.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why did Italy have much more short-term debt than the Netherlands in 1998?&lt;/summary&gt;&lt;p&gt;Because of its history of higher inflation: with high inflation, investors prefer short maturities. The result is a deficit that is very sensitive to interest rates.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Is this difference in maturities due to the legal system?&lt;/summary&gt;&lt;p&gt;No: the slides present it as an example of a difference arising from different monetary policies, which indeed narrows in the MU.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part&quot; style=&quot;--c:var(--mat);--cb:var(--mat-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Asymmetric shocks and the nation-state&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 16–21&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;The very existence of nation-states is a &lt;strong&gt;source of asymmetric shocks&lt;/strong&gt;, because the following remain national:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Taxation &amp;amp; spending&lt;/h4&gt;&lt;p&gt;Taxes and public spending remain within the sphere of national sovereignty.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Social policies&lt;/h4&gt;&lt;p&gt;Pensions, welfare, healthcare: national policies.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Wage policies&lt;/h4&gt;&lt;p&gt;Wage formation follows national rules and bargaining.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;These differences can lead to &lt;strong&gt;very strong divergences&lt;/strong&gt; in the growth of member countries. Some shocks are therefore the result of &lt;span class=&quot;term&quot;&gt;endogenous booms and busts&lt;/span&gt; (expansions and collapses generated within the economy, not by external events), which have continued to produce large divergences.&lt;/p&gt;

    &lt;h3&gt;Divergent growth before the financial crisis (slide 17)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;growthBars&quot; viewBox=&quot;0 0 600 270&quot; role=&quot;img&quot; aria-label=&quot;Cumulative GDP growth 1999-2007&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Cumulative GDP growth 1999–2007 (%), &quot;Fig. 2.4&quot;, source European Commission, AMECO. Values read from the slide&#x27;s chart, hence approximate.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Ireland, Greece and Spain grow by 33–60%, while Portugal, Italy and Germany grow by about 12%. Same currency, same ECB rate, very different outcomes.&lt;/p&gt;

    &lt;h3&gt;The cycle: synchronised, but with different amplitudes (slides 18–19)&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Output gap&lt;/b&gt;: the difference between actual GDP and trend (potential) GDP, as a % of trend. Positive = the economy is &quot;running&quot; above its trend (boom); negative = recession. It is the &lt;em&gt;business cycle component of GDP&lt;/em&gt;.&lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;div class=&quot;lg&quot; id=&quot;ogLegend&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;ogChart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;Output gap of selected countries 1995-2020&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Output gap (% of trend), 1995–2020, for four of the countries in the chart on slide 18. Values &lt;strong&gt;read by eye&lt;/strong&gt; from the slide and approximate: they serve to show the shape, not to quote figures. Toggle the series on and off.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;The cycles are synchronised&lt;/strong&gt;: all rise until 2007, collapse in 2009, and collapse again in 2020.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;The asymmetry lies in the amplitude&lt;/strong&gt;: the periphery countries (Greece, Ireland, Spain, Portugal) experienced very strong booms followed by deep recessions (Greece from +16% to −17%). In the core countries (Germany, France, Austria…) everything is much less pronounced.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;From imbalances to competitiveness (slides 19–20)&lt;/h3&gt;
    &lt;div class=&quot;stepper card&quot; id=&quot;ulcSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Boom&lt;/span&gt;&lt;p&gt;In the periphery countries the boom (easy credit, low real interest rates, housing bubbles) drives demand and employment sharply upwards.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Wages&lt;/span&gt;&lt;p&gt;Wages grow strongly, but mostly &lt;strong&gt;without corresponding productivity gains&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Costs&lt;/span&gt;&lt;p&gt;Unit labour costs (ULC) rise; firms set prices as a mark-up over costs (&lt;em&gt;price determination&lt;/em&gt;), so prices rise too.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Competitiveness&lt;/span&gt;&lt;p&gt;Prices higher than competitors&#x27; without the option to devalue = &lt;strong&gt;loss of competitiveness&lt;/strong&gt; (&lt;em&gt;Remember: price determination → competitiveness&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · Bust&lt;/span&gt;&lt;p&gt;When the boom ends, the country finds itself uncompetitive and must catch up through &quot;internal devaluation&quot; (wages and prices growing less than elsewhere): a slow and painful adjustment, as seen in Greece after 2011.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;&quot;Remember: price determination → competitiveness&quot; refers to a topic covered in an earlier lecture of the course, which was not consulted here. The chain in steps 1 and 5 (credit, internal devaluation) is an added explanation, consistent with the slides&#x27; charts.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unit labour cost (ULC)&lt;/b&gt;: labour cost per unit of output. &lt;em&gt;Relative&lt;/em&gt; ULC compares a country&#x27;s ULC with that of its partners: above 100 = it has lost competitiveness relative to the base year.&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;ULC = W·L / Y = W / (Y/L) &amp;nbsp;&amp;nbsp;⇒&amp;nbsp;&amp;nbsp; %ΔULC ≈ %ΔW − %Δ(Y/L)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Try it: wages versus productivity&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;Nominal wage growth (%/year) &lt;input type=&quot;range&quot; id=&quot;ulcW&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;ulcWO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Productivity growth (%/year) &lt;input type=&quot;range&quot; id=&quot;ulcP&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ulcPO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ulcOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;div class=&quot;lg&quot; id=&quot;ulcLegend&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;ulcChart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;Relative unit labour costs 2000-2020&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Relative unit labour costs (index, 2000 = 100), from the chart on slide 20 (source European Commission, AMECO). Values read by eye and approximate.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Germany: relative ULC from 100 to about 84 in 2008 → a strong gain in competitiveness. Greece: up to about 123 in 2011, followed by a forced correction. Italy: above 110 for a decade. These are the &lt;strong&gt;divergences in competitive positions&lt;/strong&gt;.&lt;/p&gt;

    &lt;h3 id=&quot;s4c&quot;&gt;Conclusion on the effects of integration (slide 21)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Micro level and macro level&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;120&quot; rx=&quot;10&quot; style=&quot;fill:var(--sal-bg);stroke:var(--sal)&quot;/&gt;
        &lt;text x=&quot;150&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600;fill:var(--sal)&quot;&gt;Microeconomic level&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;trade integration&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ more similar structures&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ fewer asymmetric shocks&lt;/text&gt;
        &lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;120&quot; rx=&quot;10&quot; style=&quot;fill:var(--mat-bg);stroke:var(--mat)&quot;/&gt;
        &lt;text x=&quot;490&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600;fill:var(--mat)&quot;&gt;Macroeconomic level&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;no political union&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ national dynamics, booms &amp;amp; busts&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ large asymmetric shocks&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:22px;fill:var(--muted)&quot;&gt;⇄&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;155&quot; width=&quot;300&quot; height=&quot;36&quot; rx=&quot;18&quot; style=&quot;fill:var(--acc-bg);stroke:var(--acc)&quot;/&gt;
        &lt;text x=&quot;320&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600&quot;&gt;MU within a stronger political union&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;Economic integration &lt;em&gt;can&lt;/em&gt; produce structures that lead to greater convergence.&lt;/li&gt;
      &lt;li&gt;However, the existence of nation-states can set in motion, within the MU, macroeconomic dynamics that lead to &lt;strong&gt;strong divergences&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Hence, even if at the micro level trade reduces asymmetric shocks, the &lt;strong&gt;absence of a political union&lt;/strong&gt; can generate macro dynamics with large asymmetric shocks.&lt;/li&gt;
      &lt;li&gt;The monetary union therefore needs to be embedded in a stronger &lt;strong&gt;political union&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;In what sense are nation-states a &quot;source&quot; of asymmetric shocks?&lt;/summary&gt;&lt;p&gt;Taxes, spending, social and wage policies remain national and can generate endogenous booms and busts that differ from country to country, even with the same currency.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;According to the slides, does the asymmetry among euro area countries lie in the synchronisation or in the amplitude of the cycles?&lt;/summary&gt;&lt;p&gt;In the amplitude: the cycles are synchronised, but the periphery has much more intense booms and recessions than the core.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;If wages grow by 5% and productivity by 1%, what happens to ULC?&lt;/summary&gt;&lt;p&gt;It rises by about 4% (5 − 1). If it grows less in partner countries, the country loses competitiveness.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What is the policy conclusion of slide 21?&lt;/summary&gt;&lt;p&gt;Trade can reduce shocks at the micro level, but without a political union national macro dynamics generate large asymmetric shocks: the MU must be embedded in a stronger political union.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Co-movements of the business cycles: empirical evidence&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 22–28&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;How can the nature of shocks be verified in the data? The procedure in the slides:&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;Decompose the GDP of each euro area country into a &lt;strong&gt;trend&lt;/strong&gt; and a &lt;strong&gt;cyclical component&lt;/strong&gt; using the &lt;span class=&quot;term&quot;&gt;Hodrick-Prescott filter&lt;/span&gt; (HP).&lt;/li&gt;
      &lt;li&gt;Use the components to measure: the &lt;strong&gt;synchronisation&lt;/strong&gt; of cycles (cross-country correlations of the cyclical components) and the &lt;strong&gt;relative variance&lt;/strong&gt; of cycle and trend.&lt;/li&gt;
    &lt;/ol&gt;

    &lt;h3&gt;The HP filter, a trend removing technique&lt;/h3&gt;
    &lt;div class=&quot;formula&quot;&gt;y&lt;sub&gt;t&lt;/sub&gt; = trend&lt;sub&gt;t&lt;/sub&gt; + cycle&lt;sub&gt;t&lt;/sub&gt; (+ residual&lt;sub&gt;t&lt;/sub&gt;)&lt;/div&gt;
    &lt;p&gt;Given T observations of y&lt;sub&gt;t&lt;/sub&gt;, Hodrick and Prescott (1981, 1997) interpret the trend g&lt;sub&gt;t&lt;/sub&gt; as a &lt;strong&gt;very smooth series that does not deviate too far&lt;/strong&gt; from the observed series. The trend solves:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;min&lt;sub&gt;g&lt;/sub&gt; &amp;nbsp;Σ&lt;sub&gt;t&lt;/sub&gt; (y&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;)² &amp;nbsp;+&amp;nbsp; λ · Σ&lt;sub&gt;t&lt;/sub&gt; [(g&lt;sub&gt;t+1&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;) − (g&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t−1&lt;/sub&gt;)]²&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;The first term rewards closeness to the data, the second penalises changes in the slope of the trend. The explicit formula is not in the slides, which describe the same problem in words.&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;The smoothness of the trend depends on the &lt;span class=&quot;term&quot;&gt;smoothness penalty&lt;/span&gt; λ.&lt;/li&gt;
      &lt;li&gt;λ → 0: g&lt;sub&gt;t&lt;/sub&gt; coincides with y&lt;sub&gt;t&lt;/sub&gt; (everything is trend, zero cycle).&lt;/li&gt;
      &lt;li&gt;λ → ∞: g&lt;sub&gt;t&lt;/sub&gt; is a &lt;strong&gt;linear trend&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Common practice: &lt;strong&gt;λ = 1600 for quarterly series&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;hpChart&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Series and HP trend&quot;&gt;&lt;/svg&gt;
      &lt;svg id=&quot;hpCycle&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Cyclical component&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;λ &lt;input type=&quot;range&quot; id=&quot;hpLam&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;hpLamO&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;hpOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;HP filter actually computed in the browser on a simulated series of 80 periods, like the example on slide 24. Top: the series (slate) and the trend (terracotta); bottom: the cycle = series − trend.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;note&quot;&gt;Slide 26 refers to an &quot;HP do file&quot; (a Stata script). &lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;In Stata the HP filter is applied with the &lt;code&gt;tsfilter hp&lt;/code&gt; command on a series declared with &lt;code&gt;tsset&lt;/code&gt;. The do-file was not among the files consulted for this summary.&lt;/p&gt;

    &lt;h3&gt;Cycle versus trend, 1999–2014 (slide 27)&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn on&quot; data-sort=&quot;ratio&quot;&gt;Sort by ratio&lt;/button&gt;&lt;button class=&quot;btn&quot; data-sort=&quot;cycle&quot;&gt;Sort by mean cycle&lt;/button&gt;&lt;button class=&quot;btn&quot; data-sort=&quot;trend&quot;&gt;Sort by mean trend&lt;/button&gt;&lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;ratioBars&quot; viewBox=&quot;0 0 640 340&quot; role=&quot;img&quot; aria-label=&quot;Absolute mean of cycle and trend by country&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;(Absolute) mean of trend growth and of cyclical GDP variation, 1999–2014, in %. Bars: slate = mean cycle, sage = mean trend; number on the right = cycle/trend ratio. Data from the table on slide 27.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Cyclical (temporary)&lt;/strong&gt; movements have been the dominant driver of GDP changes.&lt;/li&gt;
      &lt;li&gt;Especially in the periphery, where the cycle is &lt;em&gt;many times&lt;/em&gt; long-run growth: Greece ratio 10.1, Italy 7.1, Portugal 4.5 (compared with about 1 for Austria and Belgium).&lt;/li&gt;
      &lt;li&gt;Booms and busts are the dominant feature of GDP in the periphery.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Cross-country correlations of the cyclical components (slide 28)&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;Tap a country name to highlight its correlations.&lt;/p&gt;
    &lt;div class=&quot;tscroll card&quot;&gt;&lt;table class=&quot;heat&quot; id=&quot;corrMap&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;corrOut&quot;&gt;No country selected.&lt;/div&gt;
    &lt;ul&gt;
      &lt;li&gt;Cyclical GDP movements are &lt;strong&gt;highly correlated&lt;/strong&gt; across the euro area (often 0.85–0.98).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Germany&#x27;s&lt;/strong&gt; correlations are positive but the lowest (0.09 with Greece, 0.27 with Spain).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The key message&lt;/b&gt;: the asymmetry among euro area countries lies not so much in a &lt;em&gt;lack of correlation&lt;/em&gt; of growth rates as in the &lt;strong&gt;intensity&lt;/strong&gt; of boom and bust dynamics.&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What happens to the HP trend if λ = 0? And if λ → ∞?&lt;/summary&gt;&lt;p&gt;With λ = 0 the trend coincides with the series (zero cycle); with λ → ∞ it becomes a straight line (linear trend).&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What value of λ is usually used with quarterly data?&lt;/summary&gt;&lt;p&gt;1600.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What does a cycle/trend ratio of 10 for Greece indicate?&lt;/summary&gt;&lt;p&gt;That the average cyclical variation of GDP is about ten times trend growth: the path is dominated by booms and busts, not by long-run growth.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Do the high correlations rule out the existence of asymmetric shocks in the euro area?&lt;/summary&gt;&lt;p&gt;No: they show that the cycles are synchronised, but the asymmetry lies in the different amplitude of the cycles.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which country has the lowest correlations with the others?&lt;/summary&gt;&lt;p&gt;Germany (from 0.09 with Greece to 0.69 with Austria).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Benefits from budgetary union&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slides 29–30&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;If asymmetric shocks exist, what can help? The lecture closes with the benefits of a &lt;span class=&quot;term&quot;&gt;budgetary union&lt;/span&gt; (with a central European budget).&lt;/p&gt;

    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sal)&quot;&gt;&lt;h4&gt;1 · Insurance mechanism&lt;/h4&gt;&lt;p&gt;If there is an asymmetric shock, the centralised European budget &lt;strong&gt;automatically redistributes&lt;/strong&gt; income across countries: there is &lt;span class=&quot;term&quot;&gt;risk sharing&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ard)&quot;&gt;&lt;h4&gt;2 · Reduces fragility&lt;/h4&gt;&lt;p&gt;Centralisation means that a European government issues &lt;strong&gt;common bonds&lt;/strong&gt;. This is the situation of &quot;stand-alone&quot; countries, which issue debt in their own currency, over which they have full control.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--mat)&quot;&gt;&lt;h4&gt;3 · But the insurance can fail&lt;/h4&gt;&lt;p&gt;If countries are pushed into a &lt;strong&gt;bad equilibrium&lt;/strong&gt;: &lt;em&gt;loss of welfare&lt;/em&gt; and sustainability problems.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;stepper card&quot; id=&quot;insSteps&quot;&gt;
      &lt;svg viewBox=&quot;0 0 600 210&quot; role=&quot;img&quot; aria-label=&quot;The central budget as insurance&quot; id=&quot;insSvg&quot;&gt;
        &lt;rect x=&quot;230&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--acc-bg);stroke:var(--acc)&quot;/&gt;
        &lt;text x=&quot;300&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600&quot;&gt;EU budget&lt;/text&gt;
        &lt;rect x=&quot;40&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; id=&quot;insA&quot; style=&quot;fill:var(--card);stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;115&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px&quot;&gt;Country A&lt;/text&gt;
        &lt;rect x=&quot;410&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; id=&quot;insB&quot; style=&quot;fill:var(--card);stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;485&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px&quot;&gt;Country B&lt;/text&gt;
        &lt;g id=&quot;insArrows&quot; style=&quot;stroke-width:3;fill:none&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Normal&lt;/span&gt;&lt;p&gt;Both countries pay taxes into the common budget and receive spending. The flows balance out.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Shock to A&lt;/span&gt;&lt;p&gt;An asymmetric shock hits A: incomes fall, unemployment rises. B is doing well.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Insurance&lt;/span&gt;&lt;p&gt;Automatically, A pays less in taxes and receives more transfers (for example, European unemployment benefits); B pays a little more. The budget &lt;strong&gt;redistributes income&lt;/strong&gt; from B to A without the need for ad hoc political decisions.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reciprocity&lt;/span&gt;&lt;p&gt;Next time it could be B&#x27;s turn: it is insurance because each country pays a &quot;premium&quot; in good times and receives in bad times. It works if shocks are &lt;strong&gt;temporary&lt;/strong&gt; and hit countries in turn.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Why do common bonds reduce fragility?&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;A euro area country issues debt in a currency it does not control (the euro): if markets fear default and sell its bonds, interest rates rise, debt servicing worsens and the fear becomes self-fulfilling. This is a &lt;em&gt;bad equilibrium&lt;/em&gt; that can hit even a solvent country. A stand-alone country (with its own currency) always has the implicit guarantee that its central bank can provide liquidity, so this spiral is less likely. A central budget with common bonds brings the euro area back to a similar situation. This is the &quot;fragility&quot; thesis of the MU associated with Paul De Grauwe, the author of the textbook from which the lecture&#x27;s tables and figures appear to come.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;h3&gt;Temporary vs permanent shock (slide 30)&lt;/h3&gt;
    &lt;p&gt;An insurance system should be used &lt;strong&gt;only&lt;/strong&gt; for &lt;strong&gt;temporary&lt;/strong&gt; shocks. What type of shock is it?&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;shockTool&quot;&gt;
      &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn&quot; data-shock=&quot;t&quot;&gt;Temporary: non-synchronised cycles&lt;/button&gt;&lt;button class=&quot;btn&quot; data-shock=&quot;p&quot;&gt;Permanent: exogenous shock (e.g. a lasting collapse in demand for a sector)&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;shockOut&quot;&gt;Choose a type of shock.&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;Why not insure permanent shocks? Because the transfers would become permanent: a region that is subsidised forever does not adjust, and the paying countries would not accept this for long. Here the link with section 5 returns: the evidence shows that European asymmetries are mainly a matter of cycle amplitude, i.e. largely temporary, and therefore suited to insurance.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;How does a centralised budget work as an insurance mechanism?&lt;/summary&gt;&lt;p&gt;When an asymmetric shock hits a country, the common budget automatically redistributes income towards it (lower taxes, higher transfers): the risk is shared among members.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What do a union with common bonds and a stand-alone country have in common?&lt;/summary&gt;&lt;p&gt;The debt is issued by an issuer that controls the currency in which it is denominated; this reduces fragility in the face of confidence crises.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Temporary or permanent shock: when is insurance needed and when is flexibility needed?&lt;/summary&gt;&lt;p&gt;Temporary (non-synchronised cycles) → insurance through the central budget. Permanent/exogenous → flexibility (wages, prices, mobility); insurance only serves to temporarily reduce the cost of adjustment.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;When does insurance fail?&lt;/summary&gt;&lt;p&gt;When countries are pushed into a bad equilibrium: welfare is lost and sustainability (of debt and of the system) is at risk.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;sintesi&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2&gt;Summary in seven points&lt;/h2&gt;
    &lt;ol class=&quot;take&quot;&gt;
      &lt;li&gt;Asymmetric shocks are the main cost of an MU: without their own exchange rate or monetary policy, countries need other adjustment mechanisms.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Productive structures&lt;/strong&gt;: according to the EC view, trade makes economies more similar (intra-industry trade); according to the Krugman view, it creates agglomeration and specialisation. Probably a bit of both, but clusters cross borders and services carry ever more weight.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Labour market&lt;/strong&gt;: in the McDonald–Solow model, authorities that accommodate employment make labour demand steeper and unions more aggressive. The MU removes the monetary channel, not the fiscal one; EPL, benefits, ALMP, labour taxes and public employment remain different.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Legal &amp;amp; financial&lt;/strong&gt;: financial systems, mortgage rules (LTV, LTI) and taxation transmit the same monetary shock differently. Some differences, such as debt maturities, stem from monetary history and narrow in the MU.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Nation-state&lt;/strong&gt;: national policies generate endogenous booms and busts; wages above productivity in the periphery → higher ULC → loss of competitiveness.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Evidence&lt;/strong&gt;: using the HP filter, cycles turn out to be highly correlated; the asymmetry lies in their intensity (cycle/trend ratio up to 10 in Greece).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Policy&lt;/strong&gt;: a central budget provides insurance against temporary shocks and reduces fragility; permanent shocks require flexibility. More generally, the MU must be embedded in a political union.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2&gt;Further reading&lt;/h2&gt;
    &lt;p&gt;Authors, studies and data sources cited in the slides. Each card states where it appears in the lecture; bibliographic information and links are &lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;, found through a web search (October 2026). References to tables and figures (&quot;Table 2.1&quot;, &quot;Figure 2.3&quot;…) follow the numbering of a textbook that the slides do not name.&lt;/p&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Paul De Grauwe — &lt;em&gt;Economics of Monetary Union&lt;/em&gt; (Oxford University Press)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: not cited by name, but the tables and figures (Table 2.1, 2.2, Figure 2.3 &quot;The Solow–McDonald model in two countries&quot;, Fig. 2.4) carry the numbering of a textbook&#x27;s chapter 2 and most likely correspond to this text.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;external source&lt;/span&gt;The standard textbook on the theory and policy of monetary unions. The WorldCat record lists the 11th edition (2016) as the latest verified edition, covering the sovereign debt crisis and the ECB&#x27;s new supervisory role; a College of Europe catalogue also lists a 2020 OUP edition, with updates on fiscal rules, quantitative easing and housing markets. It matters because it fully develops the critique of OCA theory and the thesis of euro area fragility (section 6). Check which edition the course syllabus specifies.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://search.worldcat.org/th/title/Economics-of-monetary-union/oclc/951674387&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat: Economics of Monetary Union, 11th ed.&lt;/a&gt; · &lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;College of Europe: record of the 2020 edition&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Paul Krugman (1991) — &lt;em&gt;Geography and Trade&lt;/em&gt;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;In the slides: source of Table 2.1 on cars (slide 4) and the &quot;Krugman view&quot; (slide 6).&lt;/div&gt;
