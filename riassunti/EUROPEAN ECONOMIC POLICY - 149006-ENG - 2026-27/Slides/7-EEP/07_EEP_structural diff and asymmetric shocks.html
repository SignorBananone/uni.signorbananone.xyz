    &lt;p&gt;Autori, studi e fonti di dati citati nelle slide. Ogni scheda dice dove compare nella lezione; le informazioni bibliografiche e i link sono &lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;, trovati con una ricerca web (ottobre 2026). Le citazioni di tabelle e figure (&quot;Table 2.1&quot;, &quot;Figure 2.3&quot;…) seguono la numerazione di un manuale che le slide non nominano.&lt;/p&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Paul De Grauwe — &lt;em&gt;Economics of Monetary Union&lt;/em&gt; (Oxford University Press)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: non citato per nome, ma tabelle e figure (Table 2.1, 2.2, Figure 2.3 &quot;The Solow–McDonald model in two countries&quot;, Fig. 2.4) hanno la numerazione di un capitolo 2 di manuale e corrispondono, con buona probabilità, a questo testo.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;Il manuale di riferimento sulla teoria e la politica delle unioni monetarie. Il record WorldCat indica come ultima edizione verificata l&#x27;11ª (2016), con la crisi dei debiti sovrani e il nuovo ruolo di vigilanza della BCE; un catalogo del College of Europe elenca anche un&#x27;edizione OUP del 2020, con aggiornamenti su regole fiscali, quantitative easing e mercati immobiliari. Conta perché sviluppa per intero la critica alla teoria delle OCA e la tesi della fragilità dell&#x27;eurozona (sezione 6). Controlla quale edizione indica il programma del corso.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://search.worldcat.org/th/title/Economics-of-monetary-union/oclc/951674387&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WorldCat: Economics of Monetary Union, 11ª ed.&lt;/a&gt; · &lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;College of Europe: scheda dell&#x27;edizione 2020&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Paul Krugman (1991) — &lt;em&gt;Geography and Trade&lt;/em&gt;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: fonte della Table 2.1 sull&#x27;auto (slide 4) e &quot;Krugman view&quot; (slide 6).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;MIT Press, Cambridge (Mass.), 1991, xi + 142 pagine, nella serie delle Gaston Eyskens Lectures (anche Leuven University Press). Krugman vi sostiene che la localizzazione della produzione deve tornare al centro dell&#x27;analisi economica: economie di scala e costi di trasporto spiegano perché l&#x27;industria si concentra in poche regioni. È la base teorica della visione pessimista sull&#x27;integrazione.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://nantilus.univ-nantes.fr/vufind/Record/PPN002751038&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda di catalogo (Université de Nantes)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;European Commission (1990) — &lt;em&gt;One market, one money&lt;/em&gt;, European Economy n. 44&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: la &quot;European Commission view&quot; (slide 5) non cita un documento preciso; questo è lo studio della Commissione su costi e benefici dell&#x27;UEM a cui di solito si associa.&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;Studio della DG Affari economici e finanziari pubblicato nell&#x27;ottobre 1990, sottotitolo &quot;An evaluation of the potential benefits and costs of forming an economic and monetary union&quot; (351 pagine). Daniel Gros (CEPS) osserva che l&#x27;argomento centrale andava letto al contrario: è la moneta unica a creare il mercato unico; e che il rapporto non aveva previsto i grandi flussi finanziari transfrontalieri poi legati alla crisi.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://aei.pitt.edu/98210&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Archive of European Integration (Univ. of Pittsburgh)&lt;/a&gt; · &lt;a href=&quot;https://www.ceps.eu/?p=9856&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commento di D. Gros, CEPS&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Andrew K. Rose (2000) — &quot;One money, one market: the effect of common currencies on trade&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: evidenza empirica a favore della visione ottimista (slide 7).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;em&gt;Economic Policy&lt;/em&gt;, n. 30, aprile 2000, pp. 7–46 (prima come NBER Working Paper 7432, 1999). Usa un gravity model su dati panel di 186 paesi (1970–1990). &lt;strong&gt;Attenzione:&lt;/strong&gt; le slide parlano di flussi commerciali &quot;raddoppiati&quot;, mentre il capitolo di Frankel (2010) citato dalle fonti riporta per Rose una stima di commercio circa &lt;em&gt;triplo&lt;/em&gt; fra membri di un&#x27;unione valutaria. Rose stesso avvertiva che i risultati, ottenuti soprattutto su paesi piccoli o poveri, potevano non valere per l&#x27;UEM; da qui le stime successive molto più basse (5–20% nelle slide).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/1377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://nber.org/system/files/working_papers/w7432/w7432.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER WP 7432 (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/system/files/chapters/c11658/c11658.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Frankel (2010), capitolo NBER (PDF)&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Ian M. McDonald e Robert M. Solow (1981) — &quot;Wage Bargaining and Employment&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: modello usato nella sezione 2 (slide 9–11).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;em&gt;American Economic Review&lt;/em&gt;, vol. 71, n. 5, dicembre 1981, pp. 896–908. Analizza la contrattazione fra sindacato e imprese: oltre al caso standard del monopoly union (il sindacato fissa il salario, l&#x27;impresa sceglie l&#x27;occupazione, quello usato nelle slide) propone gli &lt;em&gt;efficient bargains&lt;/em&gt;, contratti in cui si negoziano insieme salario e occupazione. È il punto di partenza della letteratura sulla contrattazione salariale.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/e/c/pmc76.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS: pagina di Ian M. McDonald con l&#x27;articolo&lt;/a&gt; · &lt;a href=&quot;https://authors.repec.org/pro/pso18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc: Robert M. Solow&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;Robert J. Hodrick e Edward C. Prescott (1981, 1997) — &quot;Postwar U.S. Business Cycles: An Empirical Investigation&quot;&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: HP filter (slide 23–25).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;Circolato come Discussion Paper n. 451 della Northwestern University (1981) e pubblicato nel &lt;em&gt;Journal of Money, Credit and Banking&lt;/em&gt;, vol. 29, n. 1, febbraio 1997, pp. 1–16. Propone il metodo per separare una serie in un trend che si muove lentamente e una componente ciclica, e studia come si muovono insieme le componenti cicliche delle serie macro. È lo strumento standard per stimare output gap e cicli.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.2307/2953682&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell&#x27;articolo (JSTOR)&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/p/nwu/cmsems/451.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Working paper 1981 su RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;AMECO — Annual macro-economic database della Commissione europea&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: fonte di Fig. 2.4 (slide 17) e dei relative unit labour costs (slide 20).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;Banca dati annuale della DG ECFIN: serie macroeconomiche inviate dagli Stati membri e riviste dalla Commissione, per UE, Stati membri e altri paesi del G20 (conti nazionali, finanza pubblica, lavoro, prezzi, scambi). Alimenta le previsioni di primavera e d&#x27;autunno ed è la fonte ufficiale per alcune variabili di finanza pubblica. Ci trovi i dati veri dietro ai grafici di questa lezione, compresi output gap e ULC.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/data/datasets/AME/data-information&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AMECO sul portale dati della BCE&lt;/a&gt; · &lt;a href=&quot;https://db.nomics.world/AMECO&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AMECO su DBnomics&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;BCE / SSM — dati sugli standard di credito ipotecario (credit underwriting, 2019)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: fonte del Chart A.2 su LTV e LTI (slide 14).&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx ext&quot;&gt;fonte esterna&lt;/span&gt;Nel 2019 la vigilanza bancaria della BCE (SSM, Single Supervisory Mechanism) ha raccolto dalle banche significative i dati sui nuovi prestiti 2016–2018. Uno special feature della Financial Stability Review della BCE (maggio 2020, dall&#x27;indirizzo) riporta che nell&#x27;area euro il LTI medio è salito da 4,0 a 4,4 e il LTV medio dall&#x27;80,3% all&#x27;81,0%, e che la quota di mutui con LTV sopra l&#x27;80% o LTI sopra 5 cresce. Non è confermato che il Chart A.2 della slide venga proprio da questo articolo, ma i dati e la fonte coincidono.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/pub/financial-stability/fsr/special/html/ecb.fsrart202005_01~762d09d7a2.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE, special feature sugli standard dei mutui residenziali&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bib&quot;&gt;
      &lt;h4&gt;OECD (1999b)&lt;/h4&gt;
      &lt;div class=&quot;meta&quot;&gt;Nelle slide: fonte della Table 2.2 sulla scadenza dei titoli di stato (slide 15).&lt;/div&gt;
      &lt;p&gt;Le slide non danno il titolo della pubblicazione e la ricerca non ha permesso di identificarla con certezza, quindi qui non c&#x27;è un link. Il riferimento completo dovrebbe trovarsi nella bibliografia del manuale da cui viene la tabella.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
