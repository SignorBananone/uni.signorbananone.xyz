        &lt;text x=&quot;450&quot; y=&quot;458&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11.5px;fill:var(--muted)&quot;&gt;insurance · temporary vs permanent&lt;/text&gt;&lt;/a&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s0&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;0&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Il problema: quanto sono probabili gli asymmetric shocks?&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 1–2&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;La lezione parte da una domanda sola: &lt;em&gt;How likely are asymmetric shocks to happen?&lt;/em&gt; Per capire perché conta, servono due idee che le slide danno per scontate.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shock&lt;/b&gt;: un cambiamento improvviso e inatteso della domanda (per esempio i consumatori smettono di comprare un certo prodotto) o dell&#x27;offerta (per esempio il prezzo del petrolio raddoppia). Un &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt; (shock asimmetrico) colpisce un paese dell&#x27;unione e non gli altri, oppure li colpisce con intensità o direzione diverse. Un &lt;span class=&quot;term&quot;&gt;symmetric shock&lt;/span&gt; (shock simmetrico) li colpisce tutti allo stesso modo.&lt;/div&gt;

    &lt;div class=&quot;card tint&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Questa domanda viene dalla teoria dell&#x27;&lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (OCA, area valutaria ottimale). Entrando in una &lt;span class=&quot;term&quot;&gt;monetary union&lt;/span&gt; (MU, unione monetaria) un paese rinuncia al proprio tasso di cambio e alla propria politica monetaria: la BCE fissa un unico tasso d&#x27;interesse per tutti. Se gli shock sono simmetrici non è un problema, perché la stessa risposta va bene a tutti. Se sono asimmetrici, il paese colpito resta senza i due strumenti classici e deve adattarsi in altri modi: flessibilità dei salari, mobilità del lavoro, trasferimenti di bilancio. Quindi &lt;strong&gt;più gli shock asimmetrici sono probabili, più l&#x27;unione è costosa&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h3&gt;Tre tipi di shock&lt;/h3&gt;
    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Symmetric&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Asymmetric&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;c&quot; aria-selected=&quot;false&quot;&gt;Simmetrico, trasmesso in modo asimmetrico&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;a&quot; class=&quot;card&quot;&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;50&quot; style=&quot;fill:var(--ard)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;50&quot; style=&quot;fill:var(--ard)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;calo della domanda uguale per tutti&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;Lo shock colpisce tutti i membri allo stesso modo. Un&#x27;unica risposta di politica monetaria (per esempio un taglio dei tassi della BCE) va bene per tutti: l&#x27;unione non costa nulla.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;b&quot; class=&quot;card&quot; hidden&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;80&quot; style=&quot;fill:var(--mat)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;98&quot; width=&quot;70&quot; height=&quot;12&quot; style=&quot;fill:var(--sal)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;A in recessione, B quasi indenne&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;Lo shock colpisce A (per esempio crolla la domanda del suo settore principale) ma non B. A vorrebbe tassi più bassi, B no: la BCE non può accontentarli entrambi.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;c&quot; class=&quot;card&quot; hidden&gt;
        &lt;svg viewBox=&quot;0 0 520 150&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;rect x=&quot;95&quot; y=&quot;40&quot; width=&quot;70&quot; height=&quot;70&quot; style=&quot;fill:var(--ocr)&quot;/&gt;&lt;rect x=&quot;335&quot; y=&quot;80&quot; width=&quot;70&quot; height=&quot;30&quot; style=&quot;fill:var(--ocr)&quot;/&gt;
          &lt;text x=&quot;130&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese A&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;Paese B&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--muted)&quot;&gt;stesso shock, istituzioni diverse → effetti diversi&lt;/text&gt;
        &lt;/svg&gt;
        &lt;p&gt;Il caso su cui la lezione insiste di più. Lo shock iniziale è comune (un oil shock, un rialzo dei tassi della banca centrale), ma mercato del lavoro, sistema legale e mercati finanziari lo &lt;strong&gt;trasmettono&lt;/strong&gt; in modo diverso. Alla fine l&#x27;effetto è asimmetrico.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Le fonti di asimmetria (slide 2)&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sal)&quot;&gt;&lt;h4&gt;Different productive structures&lt;/h4&gt;&lt;p&gt;I paesi producono cose diverse, quindi uno shock di domanda su un settore li colpisce in modo diverso. → &lt;a href=&quot;#s1&quot;&gt;sezione 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ocr)&quot;&gt;&lt;h4&gt;Different labour market institutions&lt;/h4&gt;&lt;p&gt;Wage bargaining (contrattazione salariale) &lt;em&gt;centralizzato&lt;/em&gt; o &lt;em&gt;decentralizzato&lt;/em&gt;. Uno shock simmetrico (per esempio un oil shock) si trasmette in modo diverso se le istituzioni sono diverse. → &lt;a href=&quot;#s2&quot;&gt;sezione 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ard)&quot;&gt;&lt;h4&gt;Different legal systems&lt;/h4&gt;&lt;p&gt;Lo stesso cambio dei tassi deciso dalla CB (central bank) si trasmette in modo diverso. Mercati finanziari anglosassoni e continentali a confronto. → &lt;a href=&quot;#s3&quot;&gt;sezione 3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--mat)&quot;&gt;&lt;h4&gt;Different economic policies&lt;/h4&gt;&lt;p&gt;Fisco, spesa, politiche sociali e salariali restano nazionali e possono creare loro stessi gli shock. → &lt;a href=&quot;#s4&quot;&gt;sezione 4&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Le slide 2 raggruppano labour market e legal systems sotto &quot;different market structures and functioning&quot;; poi la lezione sviluppa quattro parti numerate (1–4), che qui seguono la stessa numerazione.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché in una monetary union gli asymmetric shocks sono un problema più grave che con valute nazionali?&lt;/summary&gt;&lt;p&gt;Perché il paese colpito non può più svalutare né abbassare i propri tassi: la politica monetaria è unica e viene decisa per l&#x27;area nel suo insieme. Deve adattarsi con salari, mobilità o trasferimenti fiscali.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Un aumento del prezzo del petrolio uguale per tutti può diventare uno shock asimmetrico?&lt;/summary&gt;&lt;p&gt;Sì. Se le istituzioni del mercato del lavoro sono diverse (per esempio salari indicizzati in un paese e no nell&#x27;altro), lo stesso shock produce dinamiche di salari, prezzi e occupazione diverse. È il caso dello &quot;shock simmetrico trasmesso in modo asimmetrico&quot;.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quali sono le quattro fonti di asimmetria trattate nella lezione?&lt;/summary&gt;&lt;p&gt;Strutture produttive diverse; istituzioni del mercato del lavoro diverse; sistemi legali e mercati finanziari diversi; politiche economiche nazionali (l&#x27;esistenza stessa degli stati nazionali).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part&quot; style=&quot;--c:var(--sal);--cb:var(--sal-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Different productive structures&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 3–7&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Domanda di partenza: &lt;em&gt;quanto è probabile che uno shock di domanda resti confinato a livello nazionale?&lt;/em&gt; Dipende da quanto le strutture produttive dei paesi si somigliano. E la MU può &lt;strong&gt;ridurre oppure accentuare&lt;/strong&gt; le differenze che ci sono già. Ci sono due visioni.&lt;/p&gt;

    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;opt&quot; aria-selected=&quot;true&quot;&gt;Optimistic view&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;pes&quot; aria-selected=&quot;false&quot;&gt;Pessimistic view&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;opt&quot; class=&quot;card&quot;&gt;
        &lt;h4&gt;Il commercio rende le economie più simili&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;Il commercio tra paesi europei si basa su &lt;span class=&quot;term&quot;&gt;economies of scale&lt;/span&gt; (economie di scala: il costo unitario scende quando cresce la produzione) e &lt;span class=&quot;term&quot;&gt;imperfect competition&lt;/span&gt; (concorrenza imperfetta, in particolare &lt;em&gt;product differentiation&lt;/em&gt;: ogni impresa vende una propria varietà, come marche di auto diverse).&lt;/li&gt;
          &lt;li&gt;Ne risulta un commercio in cui i paesi si comprano e si vendono a vicenda &lt;strong&gt;le stesse categorie di prodotti&lt;/strong&gt;: la Germania esporta auto in Francia e la Francia auto in Germania.&lt;/li&gt;
          &lt;li&gt;È l&#x27;&lt;span class=&quot;term&quot;&gt;intra-industry trade&lt;/span&gt; (commercio intra-industriale): porta a modelli di specializzazione simili, quindi la maggior parte degli shock di domanda colpisce i paesi in modo simile.&lt;/li&gt;
          &lt;li&gt;Conclusione: più integrazione → strutture economiche più uguali → &lt;strong&gt;meno asymmetric shocks&lt;/strong&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;pes&quot; class=&quot;card&quot; hidden&gt;
        &lt;h4&gt;Il commercio porta specializzazione e concentrazione&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;Le &lt;span class=&quot;term&quot;&gt;economies of scale&lt;/span&gt; spingono a concentrare la produzione in pochi luoghi: si creano &lt;span class=&quot;term&quot;&gt;agglomeration effects&lt;/span&gt; (effetti di agglomerazione) e &lt;span class=&quot;term&quot;&gt;clustering&lt;/span&gt; (formazione di distretti).&lt;/li&gt;
          &lt;li&gt;Abbattute le barriere al commercio, conviene produrre ogni bene dove l&#x27;industria è già concentrata (fornitori, lavoratori specializzati, conoscenze).&lt;/li&gt;
          &lt;li&gt;Le regioni si specializzano in settori diversi: uno shock di domanda su un settore colpisce soprattutto la regione che lo ospita.&lt;/li&gt;
          &lt;li&gt;Conclusione: più integrazione → &lt;strong&gt;più asymmetric shocks&lt;/strong&gt;.&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;L&#x27;esempio dell&#x27;auto: USA contro UE (slide 4)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Distribuzione regionale della produzione di auto, USA e UE&quot;&gt;
        &lt;text x=&quot;20&quot; y=&quot;22&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;USA&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;22&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;UE&lt;/text&gt;
        &lt;g id=&quot;autoBars&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Quota della produzione di auto per regione (%). Dati della slide 4, &quot;Table 2.1 Regional distribution of auto production&quot;, fonte Krugman (1991).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Negli USA due terzi delle auto si producono nel Midwest; in Europa la produzione è distribuita su quattro paesi. Lettura delle slide: il mercato USA è &lt;strong&gt;più integrato&lt;/strong&gt; (meno ostacoli al commercio). Se l&#x27;UE si muove verso un mercato davvero integrato, potrebbe vedere concentrazioni regionali simili a quelle americane: è l&#x27;argomento empirico a favore della visione pessimista.&lt;/p&gt;

    &lt;h3&gt;Due grafici, due previsioni (slide 5–6)&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Come si misura la symmetry?&lt;/b&gt; Con il grado di &lt;span class=&quot;term&quot;&gt;statistical correlation&lt;/span&gt; (correlazione statistica) dell&#x27;attività economica fra paesi, cioè quanto PIL e/o occupazione si muovono insieme (&lt;em&gt;co-movements&lt;/em&gt;).&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;ρ&lt;sub&gt;AB&lt;/sub&gt; = cov(y&lt;sub&gt;A&lt;/sub&gt;, y&lt;sub&gt;B&lt;/sub&gt;) / (σ&lt;sub&gt;A&lt;/sub&gt; · σ&lt;sub&gt;B&lt;/sub&gt;) &amp;nbsp;&amp;nbsp; con −1 ≤ ρ ≤ 1&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;ρ vicino a 1: i due paesi crescono e rallentano insieme, quindi gli shock sono soprattutto simmetrici. ρ vicino a 0 o negativo: i cicli vanno ognuno per conto suo.&lt;/p&gt;

    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;viewsChart&quot; viewBox=&quot;0 0 520 320&quot; role=&quot;img&quot; aria-label=&quot;Symmetry e trade integration: EC view contro Krugman view&quot;&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;280&quot; x2=&quot;490&quot; y2=&quot;280&quot; style=&quot;stroke:var(--ink);stroke-width:1.5&quot;/&gt;
        &lt;line x1=&quot;60&quot; y1=&quot;280&quot; x2=&quot;60&quot; y2=&quot;20&quot; style=&quot;stroke:var(--ink);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;275&quot; y=&quot;308&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;Trade integration&lt;/text&gt;
        &lt;text x=&quot;22&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 22 150)&quot; style=&quot;font-size:13px;font-weight:600&quot;&gt;Symmetry&lt;/text&gt;
        &lt;line x1=&quot;80&quot; y1=&quot;250&quot; x2=&quot;470&quot; y2=&quot;50&quot; style=&quot;stroke:var(--sal);stroke-width:3&quot;/&gt;
        &lt;line x1=&quot;80&quot; y1=&quot;50&quot; x2=&quot;470&quot; y2=&quot;250&quot; style=&quot;stroke:var(--mat);stroke-width:3&quot;/&gt;
        &lt;text x=&quot;470&quot; y=&quot;40&quot; text-anchor=&quot;end&quot; style=&quot;font-size:13px;font-weight:600;fill:var(--sal)&quot;&gt;EC view&lt;/text&gt;
        &lt;text x=&quot;470&quot; y=&quot;270&quot; text-anchor=&quot;end&quot; style=&quot;font-size:13px;font-weight:600;fill:var(--mat)&quot;&gt;Krugman view&lt;/text&gt;
        &lt;line id=&quot;vcLine&quot; x1=&quot;275&quot; y1=&quot;280&quot; x2=&quot;275&quot; y2=&quot;30&quot; style=&quot;stroke:var(--muted);stroke-dasharray:4 4&quot;/&gt;
        &lt;circle id=&quot;vcEC&quot; cx=&quot;275&quot; cy=&quot;150&quot; r=&quot;7&quot; style=&quot;fill:var(--sal)&quot;/&gt;
        &lt;circle id=&quot;vcK&quot; cx=&quot;275&quot; cy=&quot;150&quot; r=&quot;7&quot; style=&quot;fill:var(--mat)&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Integrazione commerciale &lt;input type=&quot;range&quot; id=&quot;tiSlider&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;tiOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Ridisegno delle slide 5 (European Commission view) e 6 (Krugman view). Muovi il cursore: con più integrazione le due visioni divergono sempre di più.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;vs&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--sal)&quot;&gt;European Commission view&lt;/h4&gt;&lt;p&gt;Pendenza positiva: più commercio → shock più simmetrici. È la versione ottimista, sostenuta dalla Commissione ai tempi del progetto di unione monetaria.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--mat)&quot;&gt;Krugman view&lt;/h4&gt;&lt;p&gt;Pendenza negativa: più commercio → specializzazione regionale → shock più asimmetrici. È la versione pessimista, di Paul Krugman.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Quale visione prevale? (slide 7)&lt;/h3&gt;
    &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Un po&#x27; tutte e due, ma…&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;Anche se prevalesse la visione pessimista, gli agglomeration effects &lt;strong&gt;non guardano ai confini nazionali&lt;/strong&gt;: i distretti industriali si estendono a cavallo dei paesi (&lt;em&gt;industrial agglomerations cut across countries&lt;/em&gt;).&lt;/p&gt;
      &lt;p&gt;Allora gli shock colpiscono &lt;em&gt;regioni&lt;/em&gt; che stanno in più paesi, e una politica monetaria nazionale non servirebbe comunque: un paese con mezza regione colpita e mezza no non saprebbe che tasso scegliere. Quindi rinunciare alla moneta nazionale costa meno di quanto sembri.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Empirical evidence: Rose (2000) e le stime successive&lt;/summary&gt;&lt;div&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Rose (2000)&lt;/strong&gt; e altri favoriscono la visione ottimista. Con analisi su panel data (dati di molti paesi su più anni), controllando per altre variabili, trova che far parte di una MU &lt;strong&gt;raddoppia&lt;/strong&gt; i flussi commerciali tra i membri.&lt;/li&gt;
        &lt;li&gt;Stime &lt;strong&gt;più recenti&lt;/strong&gt; sono molto più basse: l&#x27;aumento dei flussi commerciali è fra il &lt;strong&gt;5% e il 20%&lt;/strong&gt;.&lt;/li&gt;
        &lt;li&gt;L&#x27;intensità del commercio è &lt;strong&gt;positivamente correlata&lt;/strong&gt; con la correlazione dell&#x27;attività economica: chi commercia di più ha cicli più sincronizzati.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Quest&#x27;ultimo punto è l&#x27;idea della &quot;endogeneità&quot; dei criteri OCA, resa famosa da Frankel e Rose (1998): un&#x27;area può diventare &quot;ottimale&quot; dopo esser nata, perché la moneta unica fa crescere il commercio e il commercio sincronizza i cicli.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Il ruolo dei servizi&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;I servizi pesano sempre di più sul PIL e sono &lt;strong&gt;meno soggetti alle economie di scala&lt;/strong&gt;: un parrucchiere, uno studio medico, un ristorante non si concentrano in una sola regione d&#x27;Europa. Questo frena il meccanismo di agglomerazione della visione pessimista.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;intra-industry trade e perché riduce gli asymmetric shocks?&lt;/summary&gt;&lt;p&gt;È lo scambio di prodotti della stessa categoria fra paesi (auto contro auto), dovuto a economie di scala e differenziazione del prodotto. Se i paesi producono le stesse cose, uno shock di domanda su un settore li colpisce in modo simile.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché la tabella dell&#x27;auto (USA/UE) sostiene la visione pessimista?&lt;/summary&gt;&lt;p&gt;Il mercato USA, più integrato, mostra una forte concentrazione (Midwest 66,3%). Se l&#x27;UE diventa altrettanto integrata, potrebbe concentrare la produzione nello stesso modo, quindi più specializzazione e più shock regionali.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Nel grafico symmetry–trade integration, che pendenza ha la curva di Krugman e perché?&lt;/summary&gt;&lt;p&gt;Negativa: le economie di scala portano agglomerazione e specializzazione, quindi più integrazione significa meno simmetria.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Se la visione pessimista fosse vera, servirebbe una politica monetaria nazionale?&lt;/summary&gt;&lt;p&gt;Non molto: i cluster attraversano i confini, quindi gli shock colpiscono regioni transnazionali e una politica monetaria nazionale non riuscirebbe a mirarli.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa dicono le stime recenti sull&#x27;effetto della MU sul commercio?&lt;/summary&gt;&lt;p&gt;Un aumento dei flussi del 5–20%, molto meno del raddoppio trovato da Rose (2000).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part&quot; style=&quot;--c:var(--ocr);--cb:var(--ocr-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Institutional differences in the labour market&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 8–12&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Le differenze istituzionali nei mercati del lavoro creano &lt;strong&gt;asymmetries in the transmission of shocks&lt;/strong&gt; (asimmetrie nella trasmissione degli shock). Con la MU alcune di queste differenze tendono a sparire, altre restano.&lt;/p&gt;

    &lt;div class=&quot;vs&quot;&gt;
      &lt;div&gt;&lt;h4&gt;Spariscono nella MU&lt;/h4&gt;&lt;p&gt;La MU mette sotto pressione le richieste salariali dei &lt;em&gt;trade unions&lt;/em&gt; (sindacati). Il meccanismo si vede con il modello di McDonald e Solow (1981), qui sotto.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Restano&lt;/h4&gt;&lt;p&gt;Estensione del &lt;em&gt;public employment&lt;/em&gt;; differenze normative su EPL, unemployment benefits, active labour market policies, labour taxes. Vedi &lt;a href=&quot;#s2rest&quot;&gt;più sotto&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Il modello McDonald–Solow del monopoly union&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monopoly union model&lt;/b&gt;: il sindacato sceglie il salario reale &lt;i&gt;W/P&lt;/i&gt;; poi le imprese decidono quanti lavoratori &lt;i&gt;N&lt;/i&gt; assumere lungo la curva di domanda di lavoro. Il sindacato ha preferenze su entrambe le cose, rappresentate da una &lt;span class=&quot;term&quot;&gt;indifference curve&lt;/span&gt; (curva di indifferenza: combinazioni salario–occupazione che gli danno la stessa soddisfazione). L&#x27;ottimo è il punto di &lt;strong&gt;tangenza&lt;/strong&gt; fra curva di indifferenza e &lt;span class=&quot;term&quot;&gt;employment curve&lt;/span&gt; (curva di domanda di lavoro dell&#x27;intera economia).&lt;/div&gt;

    &lt;div class=&quot;stepper card&quot; id=&quot;msSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 1&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Preferenze del sindacato.&lt;/strong&gt; L&#x27;indifference curve dà un peso alla crescita dei salari e uno alla crescita dell&#x27;occupazione. Più salario a parità di occupazione è meglio, e viceversa.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 2&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Le autorità danno più peso all&#x27;occupazione.&lt;/strong&gt; Supponiamo che le authorities (governo e banca centrale nazionale) tengano all&#x27;occupazione più del sindacato. Se le richieste salariali alte fanno scendere troppo l&#x27;occupazione, reagiscono con una &lt;em&gt;expansionary policy&lt;/em&gt; (politica espansiva) per creare posti di lavoro e tenere bassa la disoccupazione.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 3&lt;/span&gt;&lt;p&gt;&lt;strong&gt;La labour demand diventa più ripida.&lt;/strong&gt; Le preferenze delle autorità entrano nella curva di domanda di lavoro dell&#x27;economia: se i salari salgono, l&#x27;occupazione scende &lt;em&gt;meno&lt;/em&gt;, perché la politica espansiva compensa. Una curva più ripida = occupazione &lt;strong&gt;meno reattiva&lt;/strong&gt; agli aumenti di salario.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 4&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Il sindacato lo prevede.&lt;/strong&gt; Se il sindacato tiene conto di questa reazione, le sue richieste restano alte: con una curva più ripida chiedere di più costa meno posti di lavoro. Il nuovo punto di tangenza è più in alto (la curva tratteggiata delle slide: &quot;Unions fix a higher wage objective&quot;).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;msChart&quot; viewBox=&quot;0 0 480 330&quot; role=&quot;img&quot; aria-label=&quot;Modello McDonald-Solow interattivo&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Peso delle autorità sull&#x27;occupazione &lt;input type=&quot;range&quot; id=&quot;msTheta&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot;&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;msOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Versione interattiva della slide 10. In grigio la situazione di partenza, a colori quella con autorità più &quot;accomodanti&quot;. Ipotesi didattica (non nelle slide): utilità del sindacato U = √(w·N) e domanda di lavoro lineare w = s·(10 − N), che ruota attorno allo stesso punto sull&#x27;asse N come nel disegno della slide.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Con queste ipotesi l&#x27;ottimo del sindacato è N* = 5 e w* = 5·s: se la curva diventa più ripida (s più grande) il sindacato ottiene un salario più alto e, grazie all&#x27;espansione delle autorità, la stessa occupazione. Proprio per questo ha un incentivo a chiedere di più.&lt;/p&gt;

    &lt;h3&gt;Due paesi che entrano nella MU (slide 11)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 620 230&quot; role=&quot;img&quot; aria-label=&quot;Il modello Solow-McDonald in due paesi&quot;&gt;
        &lt;g style=&quot;stroke:var(--ink);stroke-width:1.4;fill:none&quot;&gt;
          &lt;path d=&quot;M40 20 V200 H290&quot;/&gt;&lt;path d=&quot;M340 20 V200 H590&quot;/&gt;
          &lt;path d=&quot;M60 70 L270 180&quot; style=&quot;stroke:var(--ocr);stroke-width:2.2&quot;/&gt;
          &lt;path d=&quot;M120 85 C 150 130, 190 150, 260 160&quot;/&gt;
          &lt;path d=&quot;M370 30 L480 185&quot; style=&quot;stroke:var(--ocr);stroke-width:2.2&quot;/&gt;
          &lt;path d=&quot;M385 35 C 400 80, 440 110, 520 120&quot;/&gt;
        &lt;/g&gt;
        &lt;circle cx=&quot;173&quot; cy=&quot;130&quot; r=&quot;5&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;124&quot; style=&quot;font-size:13px&quot;&gt;A&lt;/text&gt;
        &lt;circle cx=&quot;400&quot; cy=&quot;72&quot; r=&quot;5&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;408&quot; y=&quot;70&quot; style=&quot;font-size:13px&quot;&gt;B&lt;/text&gt;
        &lt;text x=&quot;48&quot; y=&quot;18&quot; style=&quot;font-size:12px&quot;&gt;(W/P)&lt;tspan font-size=&quot;9&quot;&gt;A&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;18&quot; style=&quot;font-size:12px&quot;&gt;(W/P)&lt;tspan font-size=&quot;9&quot;&gt;B&lt;/tspan&gt;&lt;/text&gt;
        &lt;text x=&quot;280&quot; y=&quot;218&quot; style=&quot;font-size:12px&quot;&gt;N&lt;tspan font-size=&quot;9&quot;&gt;A&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;218&quot; style=&quot;font-size:12px&quot;&gt;N&lt;tspan font-size=&quot;9&quot;&gt;B&lt;/tspan&gt;&lt;/text&gt;
        &lt;text x=&quot;165&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px;fill:var(--muted)&quot;&gt;Paese A: curva piatta&lt;/text&gt;
        &lt;text x=&quot;465&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px;fill:var(--muted)&quot;&gt;Paese B: curva ripida&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ridisegno della &quot;Figure 2.3 The Solow–McDonald model in two countries&quot; (slide 11).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;Due paesi possono entrare nella MU con aggregate employment curves diverse. Più è ripida, meno gli aumenti di salario incidono sull&#x27;occupazione (B ha autorità che accomodano, A no).&lt;/li&gt;
      &lt;li&gt;Nella MU le autorità monetarie nazionali non sono più indipendenti e &lt;strong&gt;non possono reagire con una politica monetaria espansiva&lt;/strong&gt; → la curva di B si appiattisce e le differenze tendono a sparire. Il sindacato di B ora sa che salari alti costano posti di lavoro.&lt;/li&gt;
      &lt;li&gt;Le autorità &lt;strong&gt;fiscali&lt;/strong&gt; però possono ancora comportarsi in modo diverso e sostenere l&#x27;occupazione anche con aumenti salariali superiori alla crescita della produttività. Questo è un ponte verso la &lt;a href=&quot;#s4&quot;&gt;sezione 4&lt;/a&gt;.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3 id=&quot;s2rest&quot;&gt;Le differenze che restano (slide 12)&lt;/h3&gt;
    &lt;p&gt;Anche con la stessa moneta, uno shock simmetrico &lt;strong&gt;può propagarsi in modo diverso e diventare asimmetrico&lt;/strong&gt; a seconda delle istituzioni del mercato del lavoro. Apri le schede per vedere come ogni istituzione cambia la trasmissione.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Extent of public employment&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Quanta parte degli occupati lavora nel settore pubblico. &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Gli impieghi pubblici non reagiscono al ciclo: dove sono tanti, uno shock negativo tocca una quota minore di lavoratori, ma i salari dell&#x27;intera economia possono adattarsi più lentamente.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;EPL — Employment Protection Legislation&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le regole su licenziamenti e contratti (preavvisi, indennità, vincoli sui contratti a termine). &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Con EPL rigida le imprese licenziano meno in recessione ma assumono meno in ripresa: lo shock si scarica più su ore lavorate, salari o contratti temporanei che sul numero di occupati stabili.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Unemployment benefits&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sussidi di disoccupazione: importo e durata. &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Sostengono il reddito e quindi la domanda nella crisi (stabilizzatore automatico), ma possono rallentare la ricerca di lavoro e l&#x27;aggiustamento dei salari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Active labour market policies&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Formazione, servizi per l&#x27;impiego, incentivi all&#x27;assunzione. &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Rendono più facile spostare i lavoratori da settori in crisi a settori in crescita, quindi accorciano gli effetti di uno shock.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Labour taxes&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Tasse e contributi sul lavoro (il cuneo fiscale). &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Determinano quanto un aumento del costo del lavoro arriva ai salari netti: uno stesso shock sui prezzi può portare a richieste salariali diverse.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Centralized vs non-centralized wage bargaining&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dalla slide 2. &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Con contrattazione centralizzata, i sindacati nazionali possono tenere conto degli effetti delle loro richieste sull&#x27;intera economia e moderarle dopo un oil shock; con contrattazione frammentata ogni categoria cerca di recuperare il potere d&#x27;acquisto, rischiando una spirale salari–prezzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Nel modello di McDonald–Solow, che cosa rappresenta il punto ottimo?&lt;/summary&gt;&lt;p&gt;La tangenza fra la curva di indifferenza del sindacato (preferenze su salario e occupazione) e la employment curve dell&#x27;economia: è la combinazione salario–occupazione migliore che il sindacato può ottenere.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché la labour demand diventa più ripida se le autorità tengono molto all&#x27;occupazione?&lt;/summary&gt;&lt;p&gt;Perché quando i salari salgono e l&#x27;occupazione scende, le autorità rispondono con politiche espansive che creano lavoro. Così l&#x27;occupazione reagisce meno ai salari: la curva è più ripida.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché questa differenza fra paesi tende a sparire nella MU?&lt;/summary&gt;&lt;p&gt;Perché le autorità monetarie nazionali non esistono più come attori indipendenti: non possono più rispondere alle richieste salariali alte con espansione monetaria. I sindacati lo sanno e moderano le richieste.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale canale resta aperto per sostenere l&#x27;occupazione nonostante salari troppo alti?&lt;/summary&gt;&lt;p&gt;La politica fiscale nazionale, che può continuare a sostenere l&#x27;occupazione anche quando i salari crescono più della produttività.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Cita tre istituzioni del mercato del lavoro che restano diverse anche nella MU.&lt;/summary&gt;&lt;p&gt;Fra: estensione del public employment, EPL, unemployment benefits, active labour market policies, labour taxes.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Different legal systems and financial markets&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 13–15&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;I mercati finanziari continuano a funzionare in modo diverso nell&#x27;UE, quindi &lt;strong&gt;lo stesso shock monetario&lt;/strong&gt; (per esempio un rialzo dei tassi della BCE) rischia di trasmettersi in modi molto diversi. La causa principale sono i &lt;strong&gt;sistemi legali&lt;/strong&gt; dei paesi membri, che restano diversissimi e creano differenze &quot;profonde&quot; (&lt;em&gt;deep&lt;/em&gt;) nei sistemi finanziari.&lt;/p&gt;

    &lt;div class=&quot;tabset&quot;&gt;
      &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;as&quot; aria-selected=&quot;true&quot;&gt;Anglo-Saxon&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;ce&quot; aria-selected=&quot;false&quot;&gt;Continental European&lt;/button&gt;
        &lt;button role=&quot;tab&quot; data-tab=&quot;me&quot; aria-selected=&quot;false&quot;&gt;Mediterranean&lt;/button&gt;
      &lt;/div&gt;
      &lt;div data-panel=&quot;as&quot; class=&quot;card&quot;&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;&lt;strong&gt;Market-based&lt;/strong&gt; (sistema basato sui mercati): le imprese si finanziano molto emettendo azioni e obbligazioni. Un aumento dei tassi si vede subito nei prezzi di titoli e nella ricchezza finanziaria delle famiglie.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-panel=&quot;ce&quot; class=&quot;card&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;&lt;strong&gt;Bank-based&lt;/strong&gt; (sistema basato sulle banche): le imprese si finanziano soprattutto con prestiti bancari, spesso con rapporti stabili e di lungo periodo fra banca e impresa che possono attutire l&#x27;effetto di un rialzo dei tassi.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-panel=&quot;me&quot; class=&quot;card&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Anche qui domina la banca, ma il rapporto banca–impresa è diverso da quello continentale: le slide confrontano proprio &quot;Continental and Mediterranean relative to bank-firm relationship&quot;. Imprese più piccole e più dipendenti dal credito bancario a breve sentono di più e prima la stretta monetaria.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Altre differenze nazionali che cambiano la trasmissione&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Taxes on financial and housing wealth&lt;/h4&gt;&lt;p&gt;Le tasse su ricchezza finanziaria e immobiliare cambiano quanto una variazione dei prezzi degli attivi incide su consumi e investimenti.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Incentives / disincentives wrt housing property&lt;/h4&gt;&lt;p&gt;Incentivi o disincentivi alla casa di proprietà (per esempio detrazioni sugli interessi del mutuo): cambiano quante famiglie sono indebitate e quindi esposte ai tassi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Mortgage rules&lt;/h4&gt;&lt;p&gt;Regole sui mutui: tasso fisso o variabile, quanto si può prestare rispetto al valore della casa o al reddito. &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Dove prevale il tasso variabile, un rialzo della BCE colpisce subito i bilanci delle famiglie.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Esempio: LTV e LTI nell&#x27;eurozona (slide 14)&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;LTV — Loan-to-Value&lt;/b&gt;&lt;br&gt;prestito / valore dell&#x27;immobile × 100. Un LTV dell&#x27;80% vuol dire che la banca finanzia l&#x27;80% del prezzo della casa.&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;LTI — Loan-to-Income&lt;/b&gt;&lt;br&gt;prestito / reddito annuo. Un LTI di 4,5 vuol dire che il mutuo vale 4,5 anni di reddito.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Calcolatrice&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;Prezzo casa (k€) &lt;input type=&quot;range&quot; id=&quot;ltvPrice&quot; min=&quot;100&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;ltvPriceO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Mutuo (k€) &lt;input type=&quot;range&quot; id=&quot;ltvLoan&quot; min=&quot;20&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;240&quot;&gt;&lt;output id=&quot;ltvLoanO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Reddito annuo (k€) &lt;input type=&quot;range&quot; id=&quot;ltvInc&quot; min=&quot;20&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;ltvIncO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ltvOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;ltvScatter&quot; viewBox=&quot;0 0 560 360&quot; role=&quot;img&quot; aria-label=&quot;LTV e LTI medi per paese 2016-2018&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ltvPick&quot;&gt;Passa il mouse o tocca un punto per leggere il paese.&lt;/div&gt;
      &lt;figcaption&gt;LTV medio (%) e LTI medio dei nuovi mutui, 2016–2018. Valori &lt;strong&gt;letti a occhio&lt;/strong&gt; dal &quot;Chart A.2&quot; della slide 14 (fonte indicata: SSM credit underwriting data collection exercise, 2019), quindi approssimati. In ocra la media dell&#x27;area euro (EA). Le linee dividono il grafico a LTV 70% e LTI 5, come nell&#x27;originale.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Messaggio della slide: &lt;em&gt;lending standards and their dynamics differ widely across euro area countries&lt;/em&gt;. In Francia si presta quasi il 90% del valore della casa con LTI basso; a Cipro e in Grecia LTV intorno al 50–60%; in Lussemburgo LTI vicino a 7. Anche le variazioni 2016–18 (pannello destro della slide) vanno in direzioni diverse: Italia, Austria e Belgio salgono, Lituania, Paesi Bassi e Grecia scendono. Lo stesso rialzo dei tassi trova quindi famiglie con livelli di indebitamento molto diversi.&lt;/p&gt;

    &lt;h3&gt;Non tutto dipende dalla legge: inflazione e scadenza del debito (slide 15)&lt;/h3&gt;
    &lt;p&gt;Alcune differenze nei mercati finanziari sono nate nel tempo perché i paesi hanno seguito &lt;strong&gt;politiche monetarie diverse&lt;/strong&gt;. Esempio: inflazione e maturity (scadenza) dei titoli di stato.&lt;/p&gt;
    &lt;div class=&quot;tscroll card&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;1998&lt;/th&gt;&lt;th&gt;Short term (&amp;lt;1 anno)&lt;/th&gt;&lt;th&gt;Medium &amp;amp; long (&amp;gt;1 anno)&lt;/th&gt;&lt;th&gt;di cui long (&amp;gt;5 anni)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Italy&lt;/td&gt;&lt;td&gt;49,4&lt;/td&gt;&lt;td&gt;50,6&lt;/td&gt;&lt;td&gt;24,8&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Germany&lt;/td&gt;&lt;td&gt;18,5&lt;/td&gt;&lt;td&gt;81,5&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Netherlands&lt;/td&gt;&lt;td&gt;6,7&lt;/td&gt;&lt;td&gt;93,3&lt;/td&gt;&lt;td&gt;63,0&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
      &lt;p class=&quot;note&quot;&gt;&quot;Table 2.2 Maturity distribution of government bonds (% of total), 1998&quot;, fonte OECD (1999b), slide 15.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stepper card&quot; id=&quot;matSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Alta inflazione&lt;/strong&gt; → gli investitori non vogliono legarsi a un tasso fisso per molti anni, perché l&#x27;inflazione futura potrebbe &quot;mangiarsi&quot; il rendimento.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;p&gt;Lo Stato emette quindi soprattutto &lt;strong&gt;debito a breve&lt;/strong&gt; (l&#x27;Italia nel 1998: quasi metà sotto l&#x27;anno).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;p&gt;Il debito a breve va rinnovato spesso ai tassi correnti: &lt;strong&gt;quando i tassi salgono, la spesa per interessi e il deficit reagiscono subito&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;p&gt;Deficit e debito diventano molto &lt;strong&gt;dipendenti dall&#x27;inflazione&lt;/strong&gt; e dai tassi: lo stesso shock monetario pesa molto di più sui conti pubblici italiani che su quelli olandesi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5&lt;/span&gt;&lt;p&gt;Nella MU, con inflazione e politica monetaria comuni, &lt;strong&gt;le differenze nella distribuzione per scadenza si riducono&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Quanto pesa un rialzo dei tassi sul deficit?&lt;/h4&gt;
      &lt;div class=&quot;formula&quot;&gt;Δ spesa per interessi (% PIL) ≈ debito/PIL × quota a breve × Δi&lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Semplificazione didattica, per il primo anno: solo la parte a breve si rinnova al nuovo tasso, quella a lungo resta al tasso fisso già pagato.&lt;/p&gt;
      &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;49.4&quot;&gt;Italia 1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;18.5&quot;&gt;Germania 1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mat=&quot;6.7&quot;&gt;Paesi Bassi 1998&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;Debito/PIL (%) &lt;input type=&quot;range&quot; id=&quot;dmDebt&quot; min=&quot;40&quot; max=&quot;140&quot; value=&quot;110&quot;&gt;&lt;output id=&quot;dmDebtO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Quota a breve (%) &lt;input type=&quot;range&quot; id=&quot;dmShort&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.1&quot; value=&quot;49.4&quot;&gt;&lt;output id=&quot;dmShortO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Rialzo dei tassi (punti) &lt;input type=&quot;range&quot; id=&quot;dmDi&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.25&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;dmDiO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;dmOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché sistemi legali diversi rendono asimmetrico uno shock monetario comune?&lt;/summary&gt;&lt;p&gt;Perché creano sistemi finanziari diversi (market-based contro bank-based, rapporti banca–impresa, regole su mutui e tasse): lo stesso rialzo dei tassi arriva a imprese e famiglie con canali e intensità diversi.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa misura il LTV e che cosa il LTI?&lt;/summary&gt;&lt;p&gt;LTV = mutuo / valore della casa (in %); LTI = mutuo / reddito annuo (multiplo). Misurano quanto sono indebitate le famiglie rispetto alla garanzia e al reddito.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché nel 1998 l&#x27;Italia aveva molto più debito a breve dei Paesi Bassi?&lt;/summary&gt;&lt;p&gt;Per la storia di inflazione più alta: con inflazione alta gli investitori preferiscono scadenze brevi. Il risultato è un deficit molto sensibile ai tassi d&#x27;interesse.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Questa differenza di scadenze è dovuta al sistema legale?&lt;/summary&gt;&lt;p&gt;No: le slide la portano come esempio di differenza nata da politiche monetarie diverse, e che infatti si riduce nella MU.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part&quot; style=&quot;--c:var(--mat);--cb:var(--mat-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Asymmetric shocks and the nation-state&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 16–21&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;L&#x27;esistenza stessa degli stati nazionali è una &lt;strong&gt;fonte di asymmetric shocks&lt;/strong&gt;, perché restano nazionali:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Taxation &amp;amp; spending&lt;/h4&gt;&lt;p&gt;Tasse e spesa pubblica restano nel campo della sovranità nazionale.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Social policies&lt;/h4&gt;&lt;p&gt;Pensioni, welfare, sanità: politiche nazionali.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Wage policies&lt;/h4&gt;&lt;p&gt;La formazione dei salari segue regole e contrattazioni nazionali.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Queste differenze possono portare a &lt;strong&gt;divergenze molto forti&lt;/strong&gt; nella crescita dei paesi membri. Alcuni shock sono quindi il risultato di &lt;span class=&quot;term&quot;&gt;endogenous booms and busts&lt;/span&gt; (espansioni e crolli generati dall&#x27;interno dell&#x27;economia, non da eventi esterni), che hanno continuato a produrre grandi divergenze.&lt;/p&gt;

    &lt;h3&gt;Crescita divergente prima della crisi finanziaria (slide 17)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;growthBars&quot; viewBox=&quot;0 0 600 270&quot; role=&quot;img&quot; aria-label=&quot;Crescita cumulata del PIL 1999-2007&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Crescita cumulata del PIL 1999–2007 (%), &quot;Fig. 2.4&quot;, fonte European Commission, AMECO. Valori letti dal grafico della slide, quindi approssimati.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Irlanda, Grecia e Spagna crescono di 33–60%, mentre Portogallo, Italia e Germania di circa il 12%. Stessa moneta, stesso tasso BCE, risultati diversissimi.&lt;/p&gt;

    &lt;h3&gt;Il ciclo: sincronizzato, ma con ampiezze diverse (slide 18–19)&lt;/h3&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Output gap&lt;/b&gt;: differenza fra PIL effettivo e PIL di trend (potenziale), in % del trend. Positivo = l&#x27;economia &quot;corre&quot; sopra il suo trend (boom); negativo = recessione. È la &lt;em&gt;business cycle component of GDP&lt;/em&gt;.&lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;div class=&quot;lg&quot; id=&quot;ogLegend&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;ogChart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;Output gap di alcuni paesi 1995-2020&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Output gap (% del trend), 1995–2020, per quattro dei paesi del grafico della slide 18. Valori &lt;strong&gt;letti a occhio&lt;/strong&gt; dalla slide e approssimati: servono a vedere la forma, non a citare numeri. Attiva e disattiva le serie.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;I cicli sono sincronizzati&lt;/strong&gt;: tutti salgono fino al 2007, crollano nel 2009, crollano di nuovo nel 2020.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;L&#x27;asimmetria sta nell&#x27;ampiezza&lt;/strong&gt;: i paesi della periphery (periferia: Grecia, Irlanda, Spagna, Portogallo) hanno avuto boom fortissimi seguiti da recessioni profonde (Grecia da +16% a −17%). Nei paesi core (Germania, Francia, Austria…) tutto è molto meno pronunciato.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Dagli squilibri alla competitività (slide 19–20)&lt;/h3&gt;
    &lt;div class=&quot;stepper card&quot; id=&quot;ulcSteps&quot;&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Boom&lt;/span&gt;&lt;p&gt;Nei paesi della periferia il boom (credito facile, tassi reali bassi, bolle immobiliari) fa salire molto domanda e occupazione.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Salari&lt;/span&gt;&lt;p&gt;I salari crescono forte, ma per lo più &lt;strong&gt;senza aumenti corrispondenti della produttività&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Costi&lt;/span&gt;&lt;p&gt;Il costo del lavoro per unità di prodotto (ULC) sale; le imprese fissano i prezzi come margine sui costi (&lt;em&gt;price determination&lt;/em&gt;), quindi salgono anche i prezzi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Competitività&lt;/span&gt;&lt;p&gt;Prezzi più alti dei concorrenti senza poter svalutare = &lt;strong&gt;perdita di competitività&lt;/strong&gt; (&lt;em&gt;Remember: price determination → competitiveness&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5 · Bust&lt;/span&gt;&lt;p&gt;Quando il boom finisce, il paese si ritrova poco competitivo e deve recuperare con la &quot;svalutazione interna&quot; (salari e prezzi che crescono meno degli altri): un aggiustamento lento e doloroso, come si vede nella Grecia dopo il 2011.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;&quot;Remember: price determination → competitiveness&quot; richiama un argomento trattato in una lezione precedente del corso, che qui non è stata consultata. La catena dei passi 1 e 5 (credito, svalutazione interna) è una spiegazione aggiunta, coerente con i grafici delle slide.&lt;/p&gt;

    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unit labour cost (ULC)&lt;/b&gt;: costo del lavoro per unità di prodotto. Il &lt;em&gt;relative&lt;/em&gt; ULC confronta l&#x27;ULC di un paese con quello dei partner: sopra 100 = ha perso competitività rispetto all&#x27;anno base.&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;ULC = W·L / Y = W / (Y/L) &amp;nbsp;&amp;nbsp;⇒&amp;nbsp;&amp;nbsp; %ΔULC ≈ %ΔW − %Δ(Y/L)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Prova: salari contro produttività&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;
        &lt;label&gt;Crescita salari nominali (%/anno) &lt;input type=&quot;range&quot; id=&quot;ulcW&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;ulcWO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
        &lt;label&gt;Crescita produttività (%/anno) &lt;input type=&quot;range&quot; id=&quot;ulcP&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ulcPO&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;ulcOut&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;div class=&quot;lg&quot; id=&quot;ulcLegend&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;ulcChart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;Relative unit labour costs 2000-2020&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Relative unit labour costs (indice, 2000 = 100), dal grafico della slide 20 (fonte European Commission, AMECO). Valori letti a occhio e approssimati.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Germania: ULC relativo da 100 a circa 84 nel 2008 → forte guadagno di competitività. Grecia: fino a circa 123 nel 2011, poi rientro forzato. Italia: oltre 110 per un decennio. Sono le &lt;strong&gt;divergences in competitive positions&lt;/strong&gt;.&lt;/p&gt;

    &lt;h3 id=&quot;s4c&quot;&gt;Conclusione sugli effetti dell&#x27;integrazione (slide 21)&lt;/h3&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Livello micro e livello macro&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;120&quot; rx=&quot;10&quot; style=&quot;fill:var(--sal-bg);stroke:var(--sal)&quot;/&gt;
        &lt;text x=&quot;150&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600;fill:var(--sal)&quot;&gt;Livello microeconomico&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;trade integration&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ strutture più simili&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ meno asymmetric shocks&lt;/text&gt;
        &lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;280&quot; height=&quot;120&quot; rx=&quot;10&quot; style=&quot;fill:var(--mat-bg);stroke:var(--mat)&quot;/&gt;
        &lt;text x=&quot;490&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600;fill:var(--mat)&quot;&gt;Livello macroeconomico&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;niente political union&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ dinamiche nazionali, booms &amp;amp; busts&lt;/text&gt;
        &lt;text x=&quot;490&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;→ large asymmetric shocks&lt;/text&gt;
        &lt;text x=&quot;320&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:22px;fill:var(--muted)&quot;&gt;⇄&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;155&quot; width=&quot;300&quot; height=&quot;36&quot; rx=&quot;18&quot; style=&quot;fill:var(--acc-bg);stroke:var(--acc)&quot;/&gt;
        &lt;text x=&quot;320&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600&quot;&gt;MU dentro una political union più forte&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;L&#x27;integrazione economica &lt;em&gt;può&lt;/em&gt; produrre strutture che portano più convergenza.&lt;/li&gt;
      &lt;li&gt;Però l&#x27;esistenza degli stati nazionali può mettere in moto, nella MU, dinamiche macroeconomiche che portano a &lt;strong&gt;forti divergenze&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Quindi, anche se a livello micro il commercio riduce gli asymmetric shocks, l&#x27;&lt;strong&gt;assenza di una political union&lt;/strong&gt; può generare dinamiche macro con grandi asymmetric shocks.&lt;/li&gt;
      &lt;li&gt;Serve perciò inserire l&#x27;unione monetaria in una &lt;strong&gt;political union&lt;/strong&gt; più forte.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;In che senso gli stati nazionali sono &quot;fonte&quot; di asymmetric shocks?&lt;/summary&gt;&lt;p&gt;Tasse, spesa, politiche sociali e salariali restano nazionali e possono generare boom e crolli endogeni diversi da paese a paese anche con la stessa moneta.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Secondo le slide, l&#x27;asimmetria fra paesi dell&#x27;eurozona sta nella sincronia o nell&#x27;ampiezza dei cicli?&lt;/summary&gt;&lt;p&gt;Nell&#x27;ampiezza: i cicli sono sincronizzati, ma la periferia ha boom e recessioni molto più intensi del core.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Se i salari crescono del 5% e la produttività dell&#x27;1%, che succede all&#x27;ULC?&lt;/summary&gt;&lt;p&gt;Cresce di circa il 4% (5 − 1). Se nei paesi partner cresce meno, il paese perde competitività.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Qual è la conclusione politica della slide 21?&lt;/summary&gt;&lt;p&gt;Il commercio può ridurre gli shock a livello micro, ma senza political union le dinamiche macro nazionali generano grandi asymmetric shocks: la MU va inserita in una unione politica più forte.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Co-movements of the business cycles: evidenza empirica&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 22–28&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Come si verifica la natura degli shock nei dati? La procedura delle slide:&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;Scomporre il PIL di ogni paese dell&#x27;eurozona in &lt;strong&gt;trend&lt;/strong&gt; e &lt;strong&gt;componente ciclica&lt;/strong&gt; con l&#x27;&lt;span class=&quot;term&quot;&gt;Hodrick-Prescott filter&lt;/span&gt; (HP).&lt;/li&gt;
      &lt;li&gt;Usare le componenti per misurare: la &lt;strong&gt;sincronizzazione&lt;/strong&gt; dei cicli (correlazioni fra paesi delle componenti cicliche) e la &lt;strong&gt;varianza relativa&lt;/strong&gt; di ciclo e trend.&lt;/li&gt;
    &lt;/ol&gt;

    &lt;h3&gt;L&#x27;HP filter, a trend removing technique&lt;/h3&gt;
    &lt;div class=&quot;formula&quot;&gt;y&lt;sub&gt;t&lt;/sub&gt; = trend&lt;sub&gt;t&lt;/sub&gt; + cycle&lt;sub&gt;t&lt;/sub&gt; (+ residual&lt;sub&gt;t&lt;/sub&gt;)&lt;/div&gt;
    &lt;p&gt;Dati T osservazioni di y&lt;sub&gt;t&lt;/sub&gt;, Hodrick e Prescott (1981, 1997) interpretano il trend g&lt;sub&gt;t&lt;/sub&gt; come una serie &lt;strong&gt;molto liscia che non si allontana troppo&lt;/strong&gt; dalla serie osservata. Il trend risolve:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;min&lt;sub&gt;g&lt;/sub&gt; &amp;nbsp;Σ&lt;sub&gt;t&lt;/sub&gt; (y&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;)² &amp;nbsp;+&amp;nbsp; λ · Σ&lt;sub&gt;t&lt;/sub&gt; [(g&lt;sub&gt;t+1&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;) − (g&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t−1&lt;/sub&gt;)]²&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Il primo termine premia la vicinanza ai dati, il secondo punisce i cambi di pendenza del trend. La formula esplicita non è nelle slide, che descrivono a parole lo stesso problema.&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;La levigatezza del trend dipende dalla &lt;span class=&quot;term&quot;&gt;smoothness penalty&lt;/span&gt; λ (penalità di levigatezza).&lt;/li&gt;
      &lt;li&gt;λ → 0: g&lt;sub&gt;t&lt;/sub&gt; coincide con y&lt;sub&gt;t&lt;/sub&gt; (tutto è trend, ciclo nullo).&lt;/li&gt;
      &lt;li&gt;λ → ∞: g&lt;sub&gt;t&lt;/sub&gt; è un &lt;strong&gt;trend lineare&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Pratica comune: &lt;strong&gt;λ = 1600 per serie trimestrali&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;hpChart&quot; viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Serie e trend HP&quot;&gt;&lt;/svg&gt;
      &lt;svg id=&quot;hpCycle&quot; viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Componente ciclica&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;λ &lt;input type=&quot;range&quot; id=&quot;hpLam&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;hpLamO&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;hpOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Filtro HP calcolato davvero nel browser su una serie simulata di 80 periodi, come l&#x27;esempio della slide 24. In alto la serie (ardesia) e il trend (terracotta), in basso il ciclo = serie − trend.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;note&quot;&gt;La slide 26 rimanda a un &quot;HP do file&quot; (uno script Stata). &lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;In Stata l&#x27;HP filter si applica con il comando &lt;code&gt;tsfilter hp&lt;/code&gt; su una serie dichiarata con &lt;code&gt;tsset&lt;/code&gt;. Il do-file non era fra i file consultati per questo riassunto.&lt;/p&gt;

    &lt;h3&gt;Ciclo contro trend, 1999–2014 (slide 27)&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn on&quot; data-sort=&quot;ratio&quot;&gt;Ordina per ratio&lt;/button&gt;&lt;button class=&quot;btn&quot; data-sort=&quot;cycle&quot;&gt;Ordina per mean cycle&lt;/button&gt;&lt;button class=&quot;btn&quot; data-sort=&quot;trend&quot;&gt;Ordina per mean trend&lt;/button&gt;&lt;/div&gt;
    &lt;figure class=&quot;card&quot;&gt;
      &lt;svg id=&quot;ratioBars&quot; viewBox=&quot;0 0 640 340&quot; role=&quot;img&quot; aria-label=&quot;Media assoluta di ciclo e trend per paese&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Media (assoluta) della crescita di trend e della variazione ciclica del PIL, 1999–2014, in %. Barre: ardesia = mean cycle, salvia = mean trend; numero a destra = ratio ciclo/trend. Dati della tabella della slide 27.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;ul&gt;
      &lt;li&gt;I movimenti &lt;strong&gt;ciclici (temporanei)&lt;/strong&gt; sono stati il fattore dominante delle variazioni del PIL.&lt;/li&gt;
      &lt;li&gt;Soprattutto nella periferia, dove il ciclo è &lt;em&gt;molte volte&lt;/em&gt; la crescita di lungo periodo: Grecia ratio 10,1, Italia 7,1, Portogallo 4,5 (contro circa 1 per Austria e Belgio).&lt;/li&gt;
      &lt;li&gt;Booms and busts sono la caratteristica dominante del PIL nella periferia.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;h3&gt;Correlazioni fra paesi delle componenti cicliche (slide 28)&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;Tocca il nome di un paese per evidenziare le sue correlazioni.&lt;/p&gt;
    &lt;div class=&quot;tscroll card&quot;&gt;&lt;table class=&quot;heat&quot; id=&quot;corrMap&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;corrOut&quot;&gt;Nessun paese selezionato.&lt;/div&gt;
    &lt;ul&gt;
      &lt;li&gt;I movimenti ciclici del PIL sono &lt;strong&gt;fortemente correlati&lt;/strong&gt; nell&#x27;eurozona (spesso 0,85–0,98).&lt;/li&gt;
      &lt;li&gt;Le correlazioni della &lt;strong&gt;Germania&lt;/strong&gt; sono positive ma le più basse (0,09 con la Grecia, 0,27 con la Spagna).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il messaggio chiave&lt;/b&gt;: l&#x27;asimmetria fra paesi dell&#x27;eurozona non sta tanto in una &lt;em&gt;mancanza di correlazione&lt;/em&gt; dei tassi di crescita, quanto nell&#x27;&lt;strong&gt;intensity&lt;/strong&gt; (intensità) delle dinamiche di boom e bust.&lt;/div&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa succede al trend HP se λ = 0? E se λ → ∞?&lt;/summary&gt;&lt;p&gt;Con λ = 0 il trend coincide con la serie (ciclo nullo); con λ → ∞ diventa una retta (trend lineare).&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Qual è il valore di λ usato di solito con dati trimestrali?&lt;/summary&gt;&lt;p&gt;1600.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa indica un ratio ciclo/trend di 10 per la Grecia?&lt;/summary&gt;&lt;p&gt;Che la variazione ciclica media del PIL è circa dieci volte la crescita di trend: l&#x27;andamento è dominato dai booms and busts, non dalla crescita di lungo periodo.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Le correlazioni alte smentiscono l&#x27;esistenza di asymmetric shocks nell&#x27;eurozona?&lt;/summary&gt;&lt;p&gt;No: dicono che i cicli sono sincronizzati, ma l&#x27;asimmetria sta nella diversa ampiezza dei cicli.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale paese ha le correlazioni più basse con gli altri?&lt;/summary&gt;&lt;p&gt;La Germania (da 0,09 con la Grecia a 0,69 con l&#x27;Austria).&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;part-num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Benefits from budgetary union&lt;/h2&gt;&lt;div class=&quot;slides&quot;&gt;Slide 29–30&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;p&gt;Se gli asymmetric shocks ci sono, che cosa può aiutare? La lezione chiude sui benefici di una &lt;span class=&quot;term&quot;&gt;budgetary union&lt;/span&gt; (unione di bilancio, con un budget centrale europeo).&lt;/p&gt;

    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sal)&quot;&gt;&lt;h4&gt;1 · Insurance mechanism&lt;/h4&gt;&lt;p&gt;Se c&#x27;è uno shock asimmetrico, il budget europeo centralizzato &lt;strong&gt;redistribuisce automaticamente&lt;/strong&gt; reddito fra i paesi: c&#x27;è &lt;span class=&quot;term&quot;&gt;risk sharing&lt;/span&gt; (condivisione del rischio).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ard)&quot;&gt;&lt;h4&gt;2 · Reduces fragility&lt;/h4&gt;&lt;p&gt;Centralizzazione vuol dire che un governo europeo emette &lt;strong&gt;common bonds&lt;/strong&gt; (titoli comuni). È la situazione dei paesi &quot;stand-alone&quot;, che emettono debito nella propria valuta, di cui hanno pieno controllo.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--mat)&quot;&gt;&lt;h4&gt;3 · Ma l&#x27;assicurazione può fallire&lt;/h4&gt;&lt;p&gt;Se i paesi vengono spinti in un &lt;strong&gt;bad equilibrium&lt;/strong&gt;: perdita di benessere (&lt;em&gt;loss of welfare&lt;/em&gt;) e problemi di sostenibilità.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;stepper card&quot; id=&quot;insSteps&quot;&gt;
      &lt;svg viewBox=&quot;0 0 600 210&quot; role=&quot;img&quot; aria-label=&quot;Il budget centrale come assicurazione&quot; id=&quot;insSvg&quot;&gt;
        &lt;rect x=&quot;230&quot; y=&quot;10&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--acc-bg);stroke:var(--acc)&quot;/&gt;
        &lt;text x=&quot;300&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:600&quot;&gt;Budget UE&lt;/text&gt;
        &lt;rect x=&quot;40&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; id=&quot;insA&quot; style=&quot;fill:var(--card);stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;115&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px&quot;&gt;Paese A&lt;/text&gt;
        &lt;rect x=&quot;410&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;10&quot; id=&quot;insB&quot; style=&quot;fill:var(--card);stroke:var(--ink)&quot;/&gt;
        &lt;text x=&quot;485&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px&quot;&gt;Paese B&lt;/text&gt;
        &lt;g id=&quot;insArrows&quot; style=&quot;stroke-width:3;fill:none&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Normale&lt;/span&gt;&lt;p&gt;Entrambi i paesi pagano tasse al budget comune e ricevono spesa. I flussi si bilanciano.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Shock su A&lt;/span&gt;&lt;p&gt;Uno shock asimmetrico colpisce A: redditi in calo, disoccupazione in aumento. B va bene.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Assicurazione&lt;/span&gt;&lt;p&gt;Automaticamente A paga meno tasse e riceve più trasferimenti (per esempio sussidi di disoccupazione europei); B paga un po&#x27; di più. Il budget &lt;strong&gt;redistribuisce reddito&lt;/strong&gt; da B ad A senza bisogno di decisioni politiche ad hoc.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reciprocità&lt;/span&gt;&lt;p&gt;La prossima volta potrebbe toccare a B: è un&#x27;assicurazione perché ognuno paga un &quot;premio&quot; nei periodi buoni e riceve nei periodi cattivi. Funziona se gli shock sono &lt;strong&gt;temporanei&lt;/strong&gt; e colpiscono a turno.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Perché i common bonds riducono la fragilità?&lt;/summary&gt;&lt;div&gt;
      &lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Un paese dell&#x27;eurozona emette debito in una moneta che non controlla (l&#x27;euro): se i mercati temono il default e vendono i suoi titoli, i tassi salgono, il servizio del debito peggiora e la paura si autoavvera. È un &lt;em&gt;bad equilibrium&lt;/em&gt; che può colpire anche un paese solvibile. Un paese stand-alone (con moneta propria) ha sempre la garanzia implicita che la sua banca centrale può fornire liquidità, quindi questa spirale è meno probabile. Un budget centrale con titoli comuni riporta l&#x27;eurozona in una situazione simile. Questa è la tesi della &quot;fragility&quot; della MU associata a Paul De Grauwe, l&#x27;autore del manuale da cui sembrano venire tabelle e figure della lezione.&lt;/p&gt;
    &lt;/div&gt;&lt;/details&gt;

    &lt;h3&gt;Temporary vs permanent shock (slide 30)&lt;/h3&gt;
    &lt;p&gt;Un sistema assicurativo va usato &lt;strong&gt;solo&lt;/strong&gt; per gli shock &lt;strong&gt;temporanei&lt;/strong&gt;. Che tipo di shock è?&lt;/p&gt;
    &lt;div class=&quot;card&quot; id=&quot;shockTool&quot;&gt;
      &lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn&quot; data-shock=&quot;t&quot;&gt;Temporaneo: cicli non sincronizzati&lt;/button&gt;&lt;button class=&quot;btn&quot; data-shock=&quot;p&quot;&gt;Permanente: shock esogeno (es. crollo duraturo della domanda di un settore)&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;shockOut&quot;&gt;Scegli un tipo di shock.&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Perché non assicurare gli shock permanenti? Perché i trasferimenti diventerebbero permanenti: una regione sussidiata per sempre non si adatta, e i paesi che pagano non accetterebbero a lungo. Qui torna il collegamento con la sezione 5: l&#x27;evidenza dice che le asimmetrie europee sono soprattutto di ampiezza dei cicli, cioè in buona parte temporanee, quindi adatte all&#x27;assicurazione.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Come funziona un budget centralizzato come insurance mechanism?&lt;/summary&gt;&lt;p&gt;Quando uno shock asimmetrico colpisce un paese, il budget comune redistribuisce automaticamente reddito verso di esso (meno tasse, più trasferimenti): il rischio è condiviso fra i membri.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa hanno in comune un&#x27;unione con common bonds e un paese stand-alone?&lt;/summary&gt;&lt;p&gt;Il debito è emesso da un emittente che controlla la moneta in cui è denominato; questo riduce la fragilità di fronte alle crisi di fiducia.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Shock temporaneo o permanente: quando serve l&#x27;assicurazione e quando la flessibilità?&lt;/summary&gt;&lt;p&gt;Temporaneo (cicli non sincronizzati) → assicurazione del budget centrale. Permanente/esogeno → flessibilità (salari, prezzi, mobilità); l&#x27;assicurazione serve solo a ridurre temporaneamente il costo dell&#x27;aggiustamento.&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quando fallisce l&#x27;assicurazione?&lt;/summary&gt;&lt;p&gt;Quando i paesi vengono spinti in un bad equilibrium: si perde benessere e la sostenibilità (del debito e del sistema) è a rischio.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;sintesi&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2&gt;Sintesi in sette punti&lt;/h2&gt;
    &lt;ol class=&quot;take&quot;&gt;
      &lt;li&gt;Gli asymmetric shocks sono il costo principale di una MU: senza cambio né politica monetaria propri, servono altri meccanismi di aggiustamento.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Productive structures&lt;/strong&gt;: per la EC view il commercio rende le economie più simili (intra-industry trade); per la Krugman view crea agglomerazione e specializzazione. Probabilmente un po&#x27; tutte e due, ma i cluster attraversano i confini e i servizi pesano sempre di più.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Labour market&lt;/strong&gt;: con McDonald–Solow, autorità che accomodano l&#x27;occupazione rendono la labour demand più ripida e i sindacati più aggressivi. La MU elimina il canale monetario, non quello fiscale; EPL, benefits, ALMP, labour taxes e public employment restano diversi.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Legal &amp;amp; financial&lt;/strong&gt;: sistemi finanziari, regole sui mutui (LTV, LTI) e fisco trasmettono in modo diverso lo stesso shock monetario. Alcune differenze, come le scadenze del debito, nascono dalla storia monetaria e si riducono nella MU.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Nation-state&lt;/strong&gt;: politiche nazionali generano booms and busts endogeni; salari sopra la produttività nella periferia → ULC più alti → perdita di competitività.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Evidenza&lt;/strong&gt;: con l&#x27;HP filter i cicli risultano molto correlati; l&#x27;asimmetria è nell&#x27;intensità (ratio ciclo/trend fino a 10 in Grecia).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Policy&lt;/strong&gt;: un budget centrale assicura contro gli shock temporanei e riduce la fragilità; per quelli permanenti serve flessibilità. Più in generale, la MU va inserita in una political union.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part&quot; style=&quot;--c:var(--ard);--cb:var(--ard-bg)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;h2&gt;Per approfondire&lt;/h2&gt;
