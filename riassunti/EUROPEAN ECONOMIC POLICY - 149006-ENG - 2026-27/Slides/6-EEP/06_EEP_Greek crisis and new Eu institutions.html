&lt;h1&gt;La crisi del debito sovrano europeo e il suo quadro di risoluzione&lt;/h1&gt;
&lt;p class=&quot;muted&quot;&gt;&lt;span class=&quot;en&quot;&gt;The European sovereign debt crisis and its resolution framework&lt;/span&gt;. Le slide si basano su Corsetti, Erce &amp;amp; Uy (2017), Pisani-Ferry, Sapir &amp;amp; Wolff (2013) e Merler &amp;amp; Pisani-Ferry (2012). &lt;span class=&quot;sl&quot;&gt;slide 1&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;lead&quot;&gt;Nel 2010 la Grecia diventa il primo paese europeo da decenni a chiedere aiuto al Fondo Monetario Internazionale. Per capire perché, e perché l&#x27;eurozona non aveva gli strumenti per rispondere, la lezione mette in fila tre cose: che tipo di crisi era, come funziona una fuga di capitali dentro una moneta unica (TARGET2), e quali istituzioni sono state costruite in corsa: dai prestiti bilaterali a EFSF ed EFSM, fino all&#x27;ESM.&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;L&#x27;idea centrale: dentro l&#x27;euro le riserve in valuta di un paese non possono finire, perché l&#x27;Eurosistema fornisce liquidità alle banche. Il punto debole sono i &lt;b&gt;capitali privati&lt;/b&gt;, che possono andarsene di colpo (&lt;span class=&quot;en&quot;&gt;sudden stop&lt;/span&gt;). In più banche e Stato sono legati a filo doppio, e nel 2010 mancava qualsiasi meccanismo di gestione delle crisi.&lt;/div&gt;
&lt;/header&gt;

&lt;section id=&quot;mappa&quot; class=&quot;part accent&quot; style=&quot;padding-top:20px&quot;&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;◎&lt;/span&gt;Mappa della lezione&lt;/h2&gt;
&lt;p class=&quot;muted small&quot;&gt;Clicca un riquadro per andare alla sezione. Le frecce indicano come un tema porta al successivo. Colori: &lt;b style=&quot;color:var(--sage)&quot;&gt;salvia&lt;/b&gt; = diagnosi della crisi, &lt;b style=&quot;color:var(--ochre)&quot;&gt;ocra&lt;/b&gt; = flussi di capitale e TARGET2, &lt;b style=&quot;color:var(--slate)&quot;&gt;ardesia&lt;/b&gt; = risposta politica e regole, &lt;b style=&quot;color:var(--brick)&quot;&gt;mattone&lt;/b&gt; = nuove istituzioni.&lt;/p&gt;

&lt;!-- ============ S1 ============ --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 1 · Il punto di partenza&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;Aprile 2010: la Grecia bussa all&#x27;FMI&lt;/h2&gt;
&lt;p&gt;Il &lt;b&gt;23 aprile 2010&lt;/b&gt; la Grecia chiede assistenza ufficiale all&#x27;&lt;dfn&gt;International Monetary Fund&lt;/dfn&gt; (IMF, il Fondo Monetario Internazionale: un&#x27;istituzione che presta ai paesi in crisi di pagamenti in cambio di un programma di aggiustamento). È il primo paese europeo a farlo dopo circa 40 anni: l&#x27;FMI lavora soprattutto con i paesi emergenti. &lt;span class=&quot;sl&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Il primo programma di assistenza, nel &lt;b&gt;maggio 2010&lt;/b&gt;, è fatto di un prestito FMI e di una serie di &lt;b&gt;prestiti bilaterali&lt;/b&gt; dei governi europei. &lt;b&gt;Non è un prestito europeo comune&lt;/b&gt;: nell&#x27;eurozona (EZ) non esisteva nessuna infrastruttura per farlo. &lt;span class=&quot;sl&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo l&#x27;FMI il pacchetto valeva in tutto €110 miliardi: circa €30 miliardi dall&#x27;FMI con uno &lt;span class=&quot;en&quot;&gt;Stand-By Arrangement&lt;/span&gt; triennale approvato il 9 maggio 2010, più €80 miliardi di prestiti bilaterali coordinati dei paesi dell&#x27;euro. L&#x27;accesso concesso superava il 3.200% della quota greca, cioè molto oltre i limiti ordinari (vedi parte 8). &lt;a href=&quot;https://www.imf.org/external/np/sec/pr/2010/pr10187.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, comunicato stampa 10/187&lt;/a&gt;&lt;/div&gt;
&lt;p&gt;La domanda che apre la lezione è: &lt;b&gt;che tipo di crisi stava affrontando la Grecia?&lt;/b&gt; Per rispondere servono le categorie della parte 2.&lt;/p&gt;

&lt;h3&gt;Cronologia interattiva&lt;/h3&gt;
&lt;p class=&quot;small muted&quot;&gt;Tocca un punto sulla linea del tempo oppure usa le frecce.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;tl&quot; viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo 2007-2016&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;stepbox tlbox&quot;&gt;&lt;div class=&quot;lbl&quot; id=&quot;tlD&quot;&gt;&lt;/div&gt;&lt;div id=&quot;tlT&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;tlP&quot;&gt;←&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;tlN&quot;&gt;→&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché il primo aiuto alla Grecia non fu un prestito europeo comune?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;eurozona non aveva alcuno strumento di gestione delle crisi: c&#x27;erano solo regole per prevenirle (patto di stabilità e clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt;). Si ricorse quindi all&#x27;FMI e a prestiti bilaterali dei singoli governi.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché fece notizia che fosse l&#x27;FMI a intervenire?&lt;/summary&gt;&lt;div&gt;L&#x27;FMI lavora soprattutto con le economie emergenti. Un paese europeo, per di più membro di un&#x27;unione monetaria, non gli chiedeva aiuto da circa 40 anni.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S2 ============ --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 2 · Diagnosi&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;Tre tipi di crisi finanziaria&lt;/h2&gt;
&lt;p&gt;Di solito si distinguono tre tipi di crisi. Nell&#x27;eurozona del 2010 c&#x27;erano elementi di &lt;b&gt;tutti e tre&lt;/b&gt;, intrecciati tra loro. &lt;span class=&quot;sl&quot;&gt;slide 3-4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Bilancia dei pagamenti&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Bancaria&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Debito sovrano&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Balance-of-payment (BOP) crisis&lt;/b&gt;: crisi di bilancia dei pagamenti. Un paese non riesce più a onorare i propri impegni finanziari internazionali perché si verifica un &lt;dfn&gt;sudden stop&lt;/dfn&gt; (arresto improvviso) degli afflussi netti di capitale, dovuto a uno shock o a un &lt;dfn&gt;fundamental disequilibrium&lt;/dfn&gt;, cioè uno squilibrio di fondo come un deficit estero che dura da troppo tempo.&lt;/div&gt;
&lt;p&gt;È una minaccia potenziale per la maggior parte dei paesi. La &lt;dfn&gt;balance of payments&lt;/dfn&gt; (bilancia dei pagamenti) registra tutte le transazioni con l&#x27;estero. Se un paese spende all&#x27;estero più di quanto incassa (deficit di &lt;dfn&gt;current account&lt;/dfn&gt;, le partite correnti: commercio, redditi, trasferimenti), deve coprire la differenza con capitali in entrata. Se questi si fermano, deve usare le riserve.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;saldo di parte corrente + afflussi netti di capitale = Δ riserve ufficiali&lt;small&gt;Identità contabile semplificata (da manuale, non nelle slide): con un deficit corrente e afflussi a zero, le riserve possono solo calare.&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Banking crisis&lt;/b&gt;: crisi bancaria. Molte banche diventano insolventi o restano senza liquidità nello stesso momento.&lt;/div&gt;
&lt;p&gt;Di norma ci pensa lo Stato (il &lt;span class=&quot;en&quot;&gt;sovereign&lt;/span&gt;): ricapitalizza le banche, garantisce i depositi, fa da &lt;dfn&gt;backstop&lt;/dfn&gt; (rete di sicurezza di ultima istanza). Solo in seguito si è capito che i &lt;b&gt;legami stretti fra banche e Stati&lt;/b&gt;, il &lt;dfn&gt;doom loop&lt;/dfn&gt; (&quot;circolo vizioso&quot;, detto anche &lt;span class=&quot;en&quot;&gt;sovereign-bank nexus&lt;/span&gt;), potevano colpire duramente l&#x27;eurozona. &lt;span class=&quot;sl&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sovereign debt crisis&lt;/b&gt;: crisi del debito sovrano. Lo Stato non riesce più a finanziarsi sul mercato a tassi sostenibili, o non riesce a rimborsare.&lt;/div&gt;
&lt;p&gt;Può capitare con qualsiasi regime di politica economica, &lt;b&gt;ma&lt;/b&gt; sono più vulnerabili:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;gli Stati che si indebitano in &lt;b&gt;valuta estera&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;i paesi membri di un&#x27;&lt;b&gt;unione monetaria&lt;/b&gt;, che hanno rinunciato alla &lt;dfn&gt;debt monetisation&lt;/dfn&gt; (monetizzazione del debito: la banca centrale nazionale stampa moneta per comprare i titoli dello Stato). Per gli Stati membri manca un &lt;dfn&gt;lender of last resort&lt;/dfn&gt;, un prestatore di ultima istanza pronto a intervenire senza limiti.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;In pratica, per uno Stato dell&#x27;euro il debito in euro somiglia a un debito in valuta estera: è denominato in una moneta che lo Stato non controlla. &lt;span class=&quot;sl&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;La situazione nell&#x27;eurozona &lt;span class=&quot;sl&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① Sintomi da crisi BOP&lt;/h4&gt;&lt;p&gt;Nei primi anni dell&#x27;euro alcuni paesi vivono un &lt;dfn&gt;consumption boom&lt;/dfn&gt; (boom dei consumi), un apprezzamento del tasso di cambio reale e grandi deficit di parte corrente: i segnali tipici che precedono una crisi di BOP (parte 3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② Banche poco diversificate&lt;/h4&gt;&lt;p&gt;Gli attivi delle banche sono concentrati nel paese d&#x27;origine, quindi le banche si caricano il rischio di insolvenza dei privati &lt;i&gt;e&lt;/i&gt; dello Stato nazionale. E si affidano allo Stato come backstop.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ Interdipendenza&lt;/h4&gt;&lt;p&gt;Il legame stretto fra banche, imprese e famiglie e Stato aumenta il rischio percepito dai mercati, che smettono di finanziare &lt;b&gt;chiunque risieda nel paese&lt;/b&gt;, sano o malato che sia: è il doom loop.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Per evitare crisi del debito l&#x27;EZ aveva una sorveglianza fiscale severa (le regole del &lt;dfn&gt;Stability and Growth Pact&lt;/dfn&gt;, SGP: il patto di stabilità e crescita, che fissa i tetti a deficit e debito) e la regola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt;. Però &lt;b&gt;non c&#x27;era alcun sistema di gestione delle crisi&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Il doom loop, passo per passo&lt;/h3&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;doom&quot;&gt;
&lt;figure style=&quot;margin:0 0 10px&quot;&gt;&lt;svg id=&quot;doom&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Circolo vizioso fra Stato, banche ed economia&quot;&gt;
&lt;path id=&quot;d-sb&quot; class=&quot;edge&quot; d=&quot;M220 82 C150 110 120 160 118 206&quot;/&gt;
&lt;path id=&quot;d-bs&quot; class=&quot;edge&quot; d=&quot;M162 218 C190 160 225 120 252 96&quot;/&gt;
&lt;path id=&quot;d-be&quot; class=&quot;edge&quot; d=&quot;M178 248 L338 248&quot;/&gt;
&lt;path id=&quot;d-es&quot; class=&quot;edge&quot; d=&quot;M400 206 C398 160 360 110 300 82&quot;/&gt;

&lt;g&gt;&lt;rect x=&quot;40&quot; y=&quot;220&quot; width=&quot;130&quot; height=&quot;52&quot; rx=&quot;12&quot; class=&quot;fcb sc&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;252&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Banche&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;rect x=&quot;345&quot; y=&quot;220&quot; width=&quot;140&quot; height=&quot;52&quot; rx=&quot;12&quot; class=&quot;fcb sc&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;415&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Economia&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;imprese e famiglie&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;120&quot; y=&quot;140&quot; font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;end&quot;&gt;titoli di Stato&lt;/text&gt;
&lt;text x=&quot;232&quot; y=&quot;160&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;salvataggi&lt;/text&gt;
&lt;text x=&quot;258&quot; y=&quot;240&quot; font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;middle&quot;&gt;credito&lt;/text&gt;
&lt;text x=&quot;400&quot; y=&quot;140&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;entrate fiscali&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Il punto di partenza&lt;/div&gt;Stato, banche ed economia reale sono legati in tre direzioni. Finché tutto va bene, il legame passa inosservato.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;1 · Esposizione&lt;/div&gt;Le banche hanno in bilancio tanti titoli dello &lt;b&gt;Stato di casa&lt;/b&gt;: gli attivi non sono diversificati a livello internazionale.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;2 · Lo Stato vacilla&lt;/div&gt;Se i mercati dubitano dello Stato, il prezzo dei suoi titoli scende. Le banche che li detengono subiscono perdite e il loro capitale si riduce.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;3 · Stretta creditizia&lt;/div&gt;Le banche indebolite tagliano il credito a imprese e famiglie e l&#x27;economia rallenta. Anche le imprese sane faticano a finanziarsi solo perché si trovano in quel paese.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;4 · Conti pubblici&lt;/div&gt;Con la recessione calano le entrate fiscali e il deficit cresce: lo Stato sembra ancora meno solvibile.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;5 · Il cerchio si chiude&lt;/div&gt;Lo Stato è il backstop delle banche: se deve salvarle, il suo debito sale e i suoi titoli valgono ancora meno, il che indebolisce ancora le banche. È il &lt;b&gt;doom loop&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché un paese dell&#x27;euro è più vulnerabile a una crisi del debito di un paese con moneta propria?&lt;/summary&gt;&lt;div&gt;Perché ha rinunciato alla monetizzazione del debito: la banca centrale nazionale non può comprare titoli di Stato stampando moneta. A livello dei singoli Stati manca un &lt;span class=&quot;en&quot;&gt;lender of last resort&lt;/span&gt;, e il debito in euro si comporta come un debito in valuta estera.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che cos&#x27;è il doom loop, in una frase?&lt;/summary&gt;&lt;div&gt;Il circolo vizioso per cui le difficoltà dello Stato colpiscono le banche, che ne detengono i titoli, e le difficoltà delle banche colpiscono lo Stato, che deve salvarle. L&#x27;economia reale amplifica il tutto con meno credito e meno entrate fiscali.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Prima della crisi l&#x27;EZ aveva strumenti per prevenire le crisi e strumenti per gestirle?&lt;/summary&gt;&lt;div&gt;Solo per prevenirle: sorveglianza fiscale (SGP) e clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt;. Non c&#x27;era nessun meccanismo di gestione delle crisi.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S3 ============ --&gt;
&lt;section id=&quot;s3&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 3 · Le premesse&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;Gli squilibri dei primi anni dell&#x27;euro&lt;/h2&gt;
&lt;p&gt;Il primo dei tre elementi della slide 4 è il quadro tipico che precede una crisi di BOP: consumi in forte crescita, perdita di competitività e grandi deficit con l&#x27;estero. &lt;span class=&quot;sl&quot;&gt;slide 4-6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Real exchange rate&lt;/b&gt;: tasso di cambio reale, cioè il prezzo dei beni di un paese rispetto a quelli dei partner, espresso nella stessa moneta. Se sale (&lt;dfn&gt;real exchange rate appreciation&lt;/dfn&gt;, apprezzamento reale) i beni nazionali diventano relativamente più cari e il paese perde competitività.&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;q = e · P / P*&lt;small&gt;e = cambio nominale (prezzo della valuta nazionale in valuta estera), P = prezzi interni, P* = prezzi esteri. Dentro l&#x27;euro e è fisso a 1 fra i membri: q può muoversi solo tramite i prezzi relativi o i costi relativi.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unit labour cost&lt;/b&gt; (ULC): costo del lavoro per unità di prodotto, cioè quanto costa in salari produrre un&#x27;unità di output.&lt;br&gt;ULC = salario per occupato ÷ produttività per occupato. In tassi di crescita: &lt;b&gt;%ΔULC ≈ %Δsalari − %Δproduttività&lt;/b&gt;.&lt;/div&gt;
&lt;p&gt;Il grafico BCE della slide 5 mostra gli indicatori di competitività basati sull&#x27;ULC per Grecia, Irlanda, Italia, Portogallo e Spagna. Fra il 2000 e il 2008-10 crescono tutti più della media dell&#x27;area: l&#x27;Irlanda tocca un picco vicino a 140 nel 2008, gli altri fra 110 e 125. Dopo il 2010 scendono, e l&#x27;Irlanda crolla fino a circa 60 nel 2022. &lt;span class=&quot;sl&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Negli &lt;span class=&quot;en&quot;&gt;harmonised competitiveness indicators&lt;/span&gt; della BCE un aumento dell&#x27;indice indica una &lt;b&gt;perdita&lt;/b&gt; di competitività di prezzo/costo, una diminuzione un guadagno. &lt;a href=&quot;https://www.ecb.europa.eu/stats/exchange/hci/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE, Harmonised competitiveness indicators&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Simulatore: quanto pesa una piccola differenza annua?&lt;/h3&gt;
&lt;p class=&quot;small muted&quot;&gt;Esempio illustrativo, non dati reali. Imposta la crescita annua dell&#x27;ULC in un paese &quot;periferico&quot; e in Germania dal 1999 al 2008, con il cambio nominale fisso.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Crescita annua ULC periferia: &lt;b id=&quot;ulcPv&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ulcP&quot; min=&quot;-1&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Crescita annua ULC Germania: &lt;b id=&quot;ulcDv&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ulcD&quot; min=&quot;-1&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;
&lt;figure style=&quot;margin:10px 0&quot;&gt;&lt;svg id=&quot;ulcSvg&quot; viewBox=&quot;0 0 520 240&quot; role=&quot;img&quot; aria-label=&quot;Indici ULC simulati&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;periferia&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate)&quot;&gt;&lt;/i&gt;Germania&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;ulcOut&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;Senza cambio nominale, l&#x27;unico modo per recuperare la competitività persa è una &lt;b&gt;svalutazione interna&lt;/b&gt;: salari e prezzi che crescono meno dei partner, o calano, magari insieme a guadagni di produttività. È lenta e dolorosa, ed è uno degli obiettivi delle &lt;span class=&quot;en&quot;&gt;structural reforms&lt;/span&gt; chieste nei programmi (parte 8).&lt;/p&gt;

&lt;h3&gt;Deficit di parte corrente: chi presta e chi prende &lt;span class=&quot;sl&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;svg id=&quot;caSvg&quot; viewBox=&quot;0 0 600 380&quot; role=&quot;img&quot; aria-label=&quot;Saldo di parte corrente in percentuale del PIL, 2008 primo trimestre&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Saldo di parte corrente, % del PIL, 2008 T1 (dati della slide 6). Rosso = deficit, verde = surplus.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;Il grafico FMI della slide 6 (pubblicato da Abad, Löffler, Schnabl e Zemanek su &lt;span class=&quot;en&quot;&gt;Intereconomics&lt;/span&gt;, 2013) mostra l&#x27;immagine speculare: dal 2002 il surplus della Germania sale fino a circa 250 miliardi di dollari nel 2007. La somma dei deficit dei &lt;b&gt;GIIPS&lt;/b&gt; (Grecia, Irlanda, Italia, Portogallo, Spagna) scende a circa −320 miliardi nel 2008, per poi risalire verso −80 nel 2012 man mano che i deficit vengono corretti a forza.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;CA = S − I = − (afflussi netti di capitale)&lt;small&gt;Un deficit di parte corrente significa che il paese investe più di quanto risparmia, e la differenza la finanziano capitali esteri, qui soprattutto banche del &quot;centro&quot; dell&#x27;eurozona. È proprio questo finanziamento che può fermarsi.&lt;/small&gt;&lt;/div&gt;
&lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Perché i capitali affluivano verso la periferia?&lt;/summary&gt;&lt;p&gt;Con l&#x27;euro sparisce il rischio di cambio e i tassi d&#x27;interesse convergono verso quelli tedeschi. Nei paesi con inflazione più alta i tassi &lt;i&gt;reali&lt;/i&gt; diventano molto bassi: si alimentano credito, boom immobiliari e consumi. Una politica monetaria unica non può adattarsi a cicli nazionali diversi. Questo è il tema degli &lt;span class=&quot;en&quot;&gt;asymmetric shocks&lt;/span&gt; (shock che colpiscono i paesi in modo diverso) della teoria dell&#x27;&lt;span class=&quot;en&quot;&gt;optimum currency area&lt;/span&gt;, l&#x27;area valutaria ottimale. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;abstract di Abad et al. (2013) indica come motori degli squilibri politiche fiscali divergenti, boom immobiliari e ULC divergenti, sostenuti da tassi d&#x27;interesse bassi. &lt;a href=&quot;https://archive.intereconomics.eu/year/2013/1/fiscal-divergence-current-account-divergence-and-target2-imbalances-in-the-emu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intereconomics 48(1), 2013&lt;/a&gt;&lt;/p&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Se in un paese i salari crescono del 4% l&#x27;anno e la produttività dell&#x27;1%, cosa succede all&#x27;ULC?&lt;/summary&gt;&lt;div&gt;Cresce di circa il 3% l&#x27;anno (4 − 1). Se nei partner cresce meno, il tasso di cambio reale si apprezza e il paese perde competitività.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali paesi avevano i deficit di parte corrente più grandi nel 2008 T1, e chi i surplus?&lt;/summary&gt;&lt;div&gt;Deficit: Grecia (−14,5%), Cipro (−11,6%), Portogallo (−10,3%), Spagna (−9,9%), Irlanda (−6,9%). Surplus: Lussemburgo (8,2%), Germania (6,8%), Paesi Bassi (6,3%), Finlandia e Austria (4,2%).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché un grande deficit di parte corrente rende un paese vulnerabile?&lt;/summary&gt;&lt;div&gt;Perché va finanziato ogni anno con afflussi di capitale dall&#x27;estero. Se i finanziatori perdono fiducia e smettono di rinnovare i prestiti (sudden stop), il paese deve correggere il deficit di colpo o trovare altre fonti.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S4 ============ --&gt;
&lt;section id=&quot;s4&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 4 · Il meccanismo&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;Una crisi di bilancia dei pagamenti &quot;normale&quot;&lt;/h2&gt;
&lt;p&gt;Prima di vedere cosa cambia nell&#x27;euro, conviene seguire il copione classico, che riguarda un paese con moneta propria e debiti in valuta estera. &lt;span class=&quot;sl&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;bop&quot;&gt;
&lt;figure style=&quot;margin:0 0 8px&quot;&gt;&lt;svg viewBox=&quot;0 0 520 90&quot; role=&quot;img&quot; aria-label=&quot;Livello delle riserve in valuta&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;Riserve in valuta estera della banca centrale&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;fk sr&quot; stroke-width=&quot;1&quot;/&gt;
&lt;rect id=&quot;resv&quot; x=&quot;0&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;26&quot; rx=&quot;6&quot; style=&quot;fill:var(--sage);transition:width .5s,fill .5s&quot;/&gt;
&lt;text id=&quot;resvt&quot; x=&quot;0&quot; y=&quot;80&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;
&lt;g transform=&quot;translate(300 18)&quot;&gt;&lt;text font-size=&quot;12&quot; class=&quot;fm&quot; y=&quot;0&quot;&gt;Capitali esteri&lt;/text&gt;&lt;path id=&quot;flowA&quot; d=&quot;M0 26 H180&quot; stroke-width=&quot;6&quot; style=&quot;stroke:var(--ochre);transition:.4s&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text id=&quot;flowT&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 0 · Il deficit è finanziato&lt;/div&gt;Finanziatori e capitali esteri coprono il deficit di parte corrente del paese. Poi qualcosa cambia (uno shock, o la scoperta di uno squilibrio): i finanziatori perdono fiducia, smettono di rinnovare i prestiti e ritirano il denaro.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 1 · I finanziatori se ne vanno&lt;/div&gt;I prestiti non vengono rinnovati: il &lt;dfn&gt;rollover&lt;/dfn&gt; (rinnovo alla scadenza) si interrompe e il denaro esce dal paese. Per rimborsare serve &lt;b&gt;valuta estera&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 2 · Si consumano le riserve&lt;/div&gt;La banca centrale vende riserve per fornire valuta estera. Può stampare &lt;b&gt;la propria&lt;/b&gt; moneta, ma non dollari o euro.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 3 · Le riserve finiscono&lt;/div&gt;Non resta valuta estera per pagare importazioni e debiti. Gli esiti possibili sono tre: &lt;b&gt;svalutazione&lt;/b&gt; del cambio, &lt;b&gt;default&lt;/b&gt; (insolvenza) oppure &lt;dfn&gt;capital controls&lt;/dfn&gt; (limiti amministrativi ai movimenti di capitale).&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;key&quot;&gt;Il problema di fondo è un &lt;b&gt;limite rigido alla liquidità in valuta estera&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 7&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Nell&#x27;eurozona però i debiti fra paesi membri sono in euro, e la liquidità in euro per le banche la fornisce l&#x27;&lt;b&gt;Eurosistema&lt;/b&gt;. Lo step 2 non si verifica: le &quot;riserve&quot; non si esauriscono. Lo strumento contabile che lo rende visibile è TARGET2. &lt;span class=&quot;sl&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché in una crisi BOP classica la banca centrale nazionale non può semplicemente stampare moneta?&lt;/summary&gt;&lt;div&gt;Perché i debiti da rimborsare e le importazioni da pagare sono in valuta estera. La banca centrale crea solo la propria moneta, e una volta esaurite le riserve in dollari o euro non può compensare il ritiro dei prestiti esteri.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono i tre esiti tipici quando le riserve finiscono?&lt;/summary&gt;&lt;div&gt;Svalutazione (deprezzamento del cambio), default sul debito, controlli sui capitali.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S5 ============ --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 5 · Eurosistema&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;TARGET2: la bilancia dei pagamenti finanziata dall&#x27;Eurosistema&lt;/h2&gt;
&lt;p&gt;In una crisi BOP normale la banca centrale nazionale non può compensare il ritiro dei prestiti in valuta estera. Nell&#x27;EZ la liquidità la fornisce invece il sistema &lt;b&gt;TARGET2&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;TARGET2&lt;/b&gt; = &lt;span class=&quot;en&quot;&gt;Trans-European Automated Real-time Gross settlement Express Transfer system&lt;/span&gt;. È il sistema di pagamento dell&#x27;Eurosistema. &lt;span class=&quot;en&quot;&gt;Real-time gross settlement&lt;/span&gt; significa che ogni pagamento viene regolato singolarmente (al lordo, senza compensazioni) e subito, in moneta di banca centrale.&lt;/div&gt;
&lt;p&gt;L&#x27;&lt;dfn&gt;Eurosystem&lt;/dfn&gt; è l&#x27;insieme della BCE e delle banche centrali nazionali (NCB) dei paesi dell&#x27;euro. Il termine più ampio &lt;dfn&gt;ESCB&lt;/dfn&gt;, &lt;span class=&quot;en&quot;&gt;European System of Central Banks&lt;/span&gt;, comprende anche le banche centrali dei paesi UE fuori dall&#x27;euro. &lt;span class=&quot;sl&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cosa fa&lt;/h4&gt;&lt;p&gt;Sposta denaro da una banca all&#x27;altra, dentro un paese e fra paesi. Banche centrali e banche commerciali lo usano per regolare pagamenti in euro. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cosa registra&lt;/h4&gt;&lt;p&gt;Il flusso netto fra due paesi (ricevuto − inviato) va nei bilanci delle due NCB. L&#x27;accumulo nel tempo di questi flussi sono i &lt;dfn&gt;TARGET2 balances&lt;/dfn&gt;. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Segno del saldo&lt;/h4&gt;&lt;p&gt;Se le banche di un paese hanno &lt;b&gt;inviato&lt;/b&gt; più di quanto hanno ricevuto, la NCB ha un saldo &lt;b style=&quot;color:var(--brick)&quot;&gt;negativo&lt;/b&gt; (una passività, &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt;). Se hanno &lt;b&gt;ricevuto&lt;/b&gt; di più, il saldo è &lt;b style=&quot;color:var(--sage)&quot;&gt;positivo&lt;/b&gt; (un credito, &lt;span class=&quot;en&quot;&gt;claim&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Politica monetaria&lt;/h4&gt;&lt;p&gt;Anche tutte le operazioni di politica monetaria dell&#x27;Eurosistema passano da TARGET2. Se la liquidità di banca centrale si distribuisce in modo diseguale fra paesi, i saldi lo riflettono. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Per la BCE i saldi bilaterali vengono compensati ogni giorno in un&#x27;unica posizione di ciascuna NCB verso la BCE, e i saldi vengono pubblicati ogni mese. Oggi il sistema si chiama T2, e la BCE parla semplicemente di &quot;TARGET balances&quot;. &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/target2_balances.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE, &quot;What are TARGET balances?&quot;&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Come si registra una fuga di capitali &lt;span class=&quot;sl&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;cf&quot;&gt;
&lt;figure style=&quot;margin:0 0 8px&quot;&gt;&lt;svg id=&quot;cfsvg&quot; viewBox=&quot;0 0 620 236&quot; role=&quot;img&quot; aria-label=&quot;Fuga di capitali dalla Spagna alla Germania&quot;&gt;
&lt;text x=&quot;145&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; class=&quot;fm&quot;&gt;SPAGNA&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; class=&quot;fm&quot;&gt;GERMANIA&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;24&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Investitore / depositante&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;24&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Attività tedesche&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;94&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Banca spagnola&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;94&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Banca tedesca&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;164&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;Banco de España&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;164&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;Bundesbank&lt;/text&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 46 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;compra&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 116 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;pagamento&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--brick)&quot;&gt;riserve ↓ (si rifinanzia con collateral)&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--sage)&quot;&gt;riserve ↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 186 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;TARGET2&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--brick)&quot;&gt;passività TARGET2&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--sage)&quot;&gt;credito TARGET2&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 1 · Gli investitori spostano il denaro&lt;/div&gt;Un investitore vende attività spagnole, o ritira un deposito da una banca spagnola, e compra attività tedesche.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 2 · Banca spagnola e banca tedesca&lt;/div&gt;La banca spagnola perde fondi per pagare la banca tedesca: il suo conto di riserva presso il Banco de España scende. Può prendere a prestito altra liquidità dalla banca centrale dando in garanzia del &lt;dfn&gt;collateral&lt;/dfn&gt; (titoli o crediti accettati dalla banca centrale come pegno). Intanto il conto di riserva della banca tedesca presso la Bundesbank viene accreditato.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 3 · Le banche centrali regolano&lt;/div&gt;Il pagamento passa per TARGET2 fra le due NCB. Il Banco de España accumula una &lt;b&gt;passività TARGET2&lt;/b&gt;, la Bundesbank un &lt;b&gt;credito TARGET2&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Simulatore: perché in tempi normali i saldi restano piccoli&lt;/h3&gt;
&lt;p&gt;In tempi normali una banca tedesca con riserve in eccesso le &lt;b&gt;ripresterebbe&lt;/b&gt; alle banche spagnole sul &lt;dfn&gt;interbank market&lt;/dfn&gt;, il mercato interbancario, dove le banche si prestano riserve a vicenda, spesso &lt;span class=&quot;en&quot;&gt;overnight&lt;/span&gt; (per una notte). Questo riciclo rimanda i fondi in Spagna senza passare dalla banca centrale e tiene piccolo lo squilibrio TARGET2. Durante la crisi il mercato interbancario si è in gran parte fermato, perché le banche tedesche non si fidavano più di quelle spagnole. &lt;span class=&quot;sl&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Fuga di capitali dalla Spagna alla Germania: &lt;b&gt;&lt;span id=&quot;t2Fv&quot;&gt;&lt;/span&gt; mld €&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;t2F&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Quota riciclata dalle banche tedesche sul mercato interbancario: &lt;b&gt;&lt;span id=&quot;t2rv&quot;&gt;&lt;/span&gt;%&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;t2r&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tacc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Banco de España&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;&lt;b&gt;Attivo&lt;/b&gt;&lt;br&gt;prestiti alle banche ES: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Passivo&lt;/b&gt;&lt;br&gt;passività TARGET2: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tacc slate&quot;&gt;&lt;div class=&quot;h&quot;&gt;Bundesbank&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;&lt;b&gt;Attivo&lt;/b&gt;&lt;br&gt;credito TARGET2: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Passivo&lt;/b&gt;&lt;br&gt;riserve banche DE: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;t2Out&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;small muted&quot;&gt;Schema semplificato: la parte riciclata (&lt;span id=&quot;t2rec&quot;&gt;&lt;/span&gt; mld) torna in Spagna come prestito interbancario privato. Solo il resto viene sostituito da liquidità dell&#x27;Eurosistema e compare nei saldi TARGET2.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Cosa è successo davvero &lt;span class=&quot;sl&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Fino a luglio 2007 le posizioni TARGET2 erano in equilibrio: i pagamenti transfrontalieri andavano in entrambe le direzioni e si compensavano. Con l&#x27;inizio della crisi finanziaria (agosto 2007) i flussi diventano a senso unico, dalla periferia (GRE, IRL, POR) al centro (GER, NET). Le divergenze crescono con la crisi del debito sovrano (maggio 2010) e ancora di più dall&#x27;estate 2011, quando la crisi coinvolge Italia e Spagna.&lt;/p&gt;
&lt;div class=&quot;chips&quot; id=&quot;t2btns&quot;&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;t2chart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;Saldi TARGET2 2001-2012&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Saldi TARGET2 cumulati, miliardi di €. &lt;b&gt;Profili indicativi ricostruiti a occhio&lt;/b&gt; dai grafici di Cecioni e Ferrero (2012) nella slide 11, per vedere l&#x27;ordine di grandezza e i tempi: non sono dati ufficiali. Germania ≈ +700 a metà 2012, Spagna ≈ −345, Italia ≈ −280.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Cosa registra TARGET2, e cosa segnala &lt;span class=&quot;sl&quot;&gt;slide 12-14&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Registra…&lt;/h4&gt;&lt;p&gt;① i pagamenti transfrontalieri &lt;b&gt;netti&lt;/b&gt; regolati tramite banche centrali; ② pagamenti per beni, servizi e interessi, &lt;b&gt;non solo&lt;/b&gt; flussi di capitale; ③ ciò che le banche private &lt;b&gt;non hanno potuto regolare&lt;/b&gt; con fondi e liquidità propri.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Segnala…&lt;/h4&gt;&lt;p&gt;Tensioni nel sistema finanziario: le banche dei paesi con deflussi (es. fughe di depositi) hanno bisogno di liquidità ma non la trovano sul mercato interbancario (manca collateral di qualità, è sparita la fiducia), quindi ricorrono di più alla liquidità della banca centrale (Merler e Pisani-Ferry, 2012).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Un movimento simmetrico.&lt;/b&gt; In Germania il rifinanziamento di banca centrale delle banche tedesche passa da &lt;b&gt;€250 miliardi&lt;/b&gt; a inizio 2007 a &lt;b&gt;€130 miliardi&lt;/b&gt; nel 2010 (Deutsche Bundesbank, 2011b), mentre la domanda di liquidità BCE delle banche nei paesi in difficoltà cresce molto. Per questo i saldi TARGET2 vanno letti come una &lt;b&gt;diversa distribuzione fra paesi delle operazioni di rifinanziamento&lt;/b&gt;, e come un meccanismo di compensazione che permette alle banche sane dei paesi sotto stress di coprire il fabbisogno di liquidità. &lt;span class=&quot;sl&quot;&gt;slide 14&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il Monthly Report della Bundesbank di marzo 2011 indica crediti TARGET2 per €325,5 miliardi a fine 2010 e fa partire l&#x27;aumento sistematico dal 2007. &lt;a href=&quot;https://www.bundesbank.de/en/publications/reports/monthly-reports/monthly-report-march-2011-707108&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bundesbank, Monthly Report marzo 2011&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Una banca italiana paga una banca olandese tramite TARGET2. Cosa succede ai saldi delle due NCB?&lt;/summary&gt;&lt;div&gt;La Banca d&#x27;Italia registra una variazione negativa (più passività verso l&#x27;Eurosistema), De Nederlandsche Bank una positiva (più credito). Se il flusso non torna indietro, si accumula nei saldi.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché prima del 2007 i saldi TARGET2 erano vicini a zero?&lt;/summary&gt;&lt;div&gt;Perché i flussi andavano in entrambe le direzioni e le banche in surplus riprestavano le riserve sul mercato interbancario. Questo riciclo privato compensava gli squilibri.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il saldo TARGET2 misura solo la fuga di capitali?&lt;/summary&gt;&lt;div&gt;No: registra tutti i pagamenti netti regolati tramite banche centrali, compresi quelli per beni, servizi e interessi, cioè ciò che le banche non hanno saputo regolare con risorse proprie. Riflette anche la distribuzione fra paesi della liquidità BCE.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S6 ============ --&gt;
&lt;section id=&quot;s6&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 6 · 2008-2012&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;Sudden stop: i capitali privati scappano, quelli pubblici li sostituiscono&lt;/h2&gt;
&lt;h3&gt;Il ruolo dei flussi di capitale transfrontalieri &lt;span class=&quot;sl&quot;&gt;slide 16&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Nell&#x27;EZ l&#x27;Eurosistema copre, tramite TARGET2, i buchi di finanziamento dovuti a deficit commerciali o a deflussi netti di capitale: &lt;b&gt;non mancano mai i mezzi&lt;/b&gt; per effettuare pagamenti transfrontalieri.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Però&lt;/b&gt; il capitale privato può essere ritirato, quindi il sudden stop può colpire il &lt;i&gt;finanziamento di mercato&lt;/i&gt;. Le conseguenze:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;dfn&gt;spread&lt;/dfn&gt; variabili (lo spread è la differenza di rendimento fra i titoli di uno Stato e un titolo di riferimento, di solito il Bund tedesco) e fragilità finanziaria;&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;fragmentation&lt;/dfn&gt;: il sistema finanziario transfrontaliero si spezza lungo i confini nazionali, e le stesse condizioni di credito non valgono più ovunque nell&#x27;area.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Questo rischio era stato &lt;b&gt;sottovalutato&lt;/b&gt; nell&#x27;EZ, anche se gli squilibri nelle partite correnti interne all&#x27;area si accumulavano.&lt;/p&gt;

&lt;h3&gt;Quanto sono stati grandi i deflussi &lt;span class=&quot;sl&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Tutti e cinque i paesi del Sud hanno ricevuto forti afflussi di capitale privato dal 2002 al 2007-09, seguiti da deflussi netti e piuttosto improvvisi (Merler e Pisani-Ferry, 2012). Cumulati, in % del PIL 2007:&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 200&quot; role=&quot;img&quot; aria-label=&quot;Afflussi e deflussi privati in percentuale del PIL 2007&quot;&gt;
&lt;line x1=&quot;130&quot; x2=&quot;130&quot; y1=&quot;10&quot; y2=&quot;190&quot; class=&quot;sm&quot;/&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;text x=&quot;122&quot; y=&quot;34&quot; text-anchor=&quot;end&quot;&gt;Grecia&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;22&quot; width=&quot;160&quot; height=&quot;14&quot; rx=&quot;3&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;296&quot; y=&quot;34&quot; class=&quot;fm&quot;&gt;afflussi ≈ 40%&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;38&quot; width=&quot;160&quot; height=&quot;10&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;296&quot; y=&quot;48&quot; class=&quot;fm&quot;&gt;deflussi ≈ 40%&lt;/text&gt;
&lt;text x=&quot;122&quot; y=&quot;84&quot; text-anchor=&quot;end&quot;&gt;Irlanda&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;72&quot; width=&quot;40&quot; height=&quot;14&quot; rx=&quot;3&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;176&quot; y=&quot;84&quot; class=&quot;fm&quot;&gt;afflussi limitati&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;88&quot; width=&quot;280&quot; height=&quot;10&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;416&quot; y=&quot;98&quot; class=&quot;fm&quot;&gt;deflussi ≈ 70%&lt;/text&gt;
&lt;text x=&quot;122&quot; y=&quot;134&quot; text-anchor=&quot;end&quot;&gt;PT · ES · IT&lt;/text&gt;&lt;text x=&quot;138&quot; y=&quot;134&quot; class=&quot;fm&quot;&gt;deflussi più contenuti e più tardivi, ma comunque significativi&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;130&quot; y=&quot;180&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;barre proporzionali alle cifre citate nella slide 15 (afflussi irlandesi: solo &quot;limitati&quot;, nessuna cifra)&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;h3&gt;Il vuoto lasciato dai privati riempito da fondi pubblici &lt;span class=&quot;sl&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il sostegno pubblico nell&#x27;area euro ha preso &lt;b&gt;tre forme&lt;/b&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① Liquidità dell&#x27;Eurosistema&lt;/h4&gt;&lt;p&gt;Prestiti alle banche tramite &lt;dfn&gt;marginal lending facility&lt;/dfn&gt; (prestito overnight su richiesta, a tasso penalizzante), &lt;dfn&gt;MRO&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;Main Refinancing Operations&lt;/span&gt;, aste settimanali di rifinanziamento) e &lt;dfn&gt;LTRO&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;Longer-Term Refinancing Operations&lt;/span&gt;, scadenze più lunghe). Si vede nei saldi TARGET.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② Programmi UE/FMI&lt;/h4&gt;&lt;p&gt;Prestiti agli Stati in cambio di condizionalità (parti 8-9).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ Acquisti di titoli BCE&lt;/h4&gt;&lt;p&gt;Acquisti di titoli sovrani con il &lt;dfn&gt;SMP&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;Securities Markets Programme&lt;/span&gt;) e i programmi successivi: vedi le prossime lezioni sulla politica monetaria della BCE.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;afflussi totali (conto finanziario) ≈ afflussi privati + Δ passività TARGET + erogazioni dei programmi&lt;small&gt;Scomposizione di Merler e Pisani-Ferry: le tre componenti vengono cumulate separatamente (2002-11/12) e confrontate con gli afflussi totali dei dati ufficiali.&lt;/small&gt;&lt;/div&gt;

&lt;h3&gt;Scomposizione interattiva &lt;span class=&quot;sl&quot;&gt;slide 18&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;chips&quot; id=&quot;dcBtns&quot;&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;dcSvg&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione degli afflussi di capitale&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;afflussi privati&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;passività TARGET&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ochre)&quot;&gt;&lt;/i&gt;erogazioni dei programmi&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink);height:3px&quot;&gt;&lt;/i&gt;afflussi totali&lt;/span&gt;&lt;/div&gt;
&lt;figcaption&gt;% del PIL 2007, cumulato dal 2002. &lt;b&gt;Valori indicativi letti a occhio&lt;/b&gt; dalla figura Bruegel della slide 18 (aggiornata da Merler e Pisani-Ferry, 2012), solo per illustrare la composizione. Per l&#x27;Irlanda non ci sono dati mensili.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p class=&quot;out&quot; id=&quot;dcTxt&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;key&quot;&gt;&lt;b&gt;Però&lt;/b&gt; l&#x27;Eurosistema &lt;b&gt;non&lt;/b&gt; finanzia senza limiti i deficit di bilancia dei pagamenti. La liquidità BCE arriva dentro le procedure ordinarie (MRO, LTRO), contro collateral e a condizioni stabilite. Quando servono somme che le banche non possono coprire, entrano in gioco i programmi di assistenza agli Stati. &lt;span class=&quot;sl&quot;&gt;slide 19&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Cecioni e Ferrero (Banca d&#x27;Italia, 2012) trovano che i flussi TARGET2 abbiano finanziato il deficit corrente della Grecia, mentre per Italia, Spagna e Portogallo non c&#x27;è evidenza in questo senso. In tutti i paesi la liquidità TARGET2 ha soprattutto sostituito i deflussi privati dal mercato dei titoli e dal mercato interbancario. &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/qef/2012-0136/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca d&#x27;Italia, QEF n. 136&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché l&#x27;Eurosistema ha &quot;sostituito&quot; i capitali privati durante la crisi?&lt;/summary&gt;&lt;div&gt;Perché quando i privati ritiravano fondi dalla periferia e il mercato interbancario era bloccato, le banche di quei paesi coprivano il fabbisogno di liquidità chiedendo di più alla banca centrale (MRO, LTRO, marginal lending). Ogni deflusso privato veniva compensato da più rifinanziamento dell&#x27;Eurosistema, che compare come passività TARGET2.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che differenza c&#x27;è fra Grecia/Portogallo e Spagna/Italia nella scomposizione?&lt;/summary&gt;&lt;div&gt;In Grecia e Portogallo il rovesciamento degli afflussi privati è completo ed è stato compensato da un mix di finanziamento dei programmi e dell&#x27;Eurosistema. In Spagna e Italia, che non hanno chiesto un programma, il rovesciamento (quasi totale in Spagna, consistente in Italia) è stato compensato interamente dall&#x27;Eurosistema.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;La liquidità dell&#x27;Eurosistema bastava per tutti i paesi colpiti?&lt;/summary&gt;&lt;div&gt;No: non è un finanziamento illimitato dei deficit BOP. Passa per le operazioni ordinarie, con collateral e regole. Per gli Stati che avevano perso l&#x27;accesso al mercato (Grecia, Portogallo, Irlanda) sono serviti programmi UE/FMI.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S7 ============ --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 7 · Regole&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;La crisi greca e la clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;p&gt;Nel &lt;b&gt;2009&lt;/b&gt; emerge la vera dimensione del deficit pubblico greco: &lt;b&gt;dal 6,7% al 15,1% del PIL&lt;/b&gt;. La capacità del governo di pagare i debiti si rivela più bassa del previsto, e questo provoca una &lt;b&gt;revisione delle aspettative&lt;/b&gt; (&lt;span class=&quot;en&quot;&gt;revision in the beliefs&lt;/span&gt;) dei creditori. &lt;span class=&quot;sl&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;L&#x27;area euro non aveva nessuno strumento pronto per gestire un crollo della fiducia dei mercati.&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 300 200&quot; role=&quot;img&quot; aria-label=&quot;Deficit greco 2009: stima iniziale e rivista&quot;&gt;
&lt;line x1=&quot;40&quot; x2=&quot;290&quot; y1=&quot;170&quot; y2=&quot;170&quot; class=&quot;sm&quot;/&gt;
&lt;rect x=&quot;70&quot; y=&quot;170&quot; width=&quot;70&quot; height=&quot;0&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate)&quot;&gt;&lt;animate attributeName=&quot;height&quot; to=&quot;60.3&quot; dur=&quot;.8s&quot; fill=&quot;freeze&quot;/&gt;&lt;animate attributeName=&quot;y&quot; to=&quot;109.7&quot; dur=&quot;.8s&quot; fill=&quot;freeze&quot;/&gt;&lt;/rect&gt;
&lt;rect x=&quot;180&quot; y=&quot;170&quot; width=&quot;70&quot; height=&quot;0&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;&gt;&lt;animate attributeName=&quot;height&quot; to=&quot;135.9&quot; dur=&quot;1.2s&quot; fill=&quot;freeze&quot;/&gt;&lt;animate attributeName=&quot;y&quot; to=&quot;34.1&quot; dur=&quot;1.2s&quot; fill=&quot;freeze&quot;/&gt;&lt;/rect&gt;
&lt;line x1=&quot;40&quot; x2=&quot;290&quot; y1=&quot;143&quot; y2=&quot;143&quot; stroke-dasharray=&quot;5 4&quot; class=&quot;sm&quot;/&gt;&lt;text x=&quot;286&quot; y=&quot;138&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;3% (soglia SGP)&lt;/text&gt;
&lt;text x=&quot;105&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;6,7%&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;27&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;15,1%&lt;/text&gt;
&lt;text x=&quot;105&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;dato iniziale&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;dato rivisto&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Il disegno originario: perché il &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; doveva bastare &lt;span class=&quot;sl&quot;&gt;slide 20-21&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Nella governance economica dell&#x27;EZ si pensava che &lt;b&gt;SGP + una BCE che non fa da prestatore di ultima istanza&lt;/b&gt; bastassero a rendere vincolante la clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; dell&#x27;&lt;b&gt;art. 125 del TFUE&lt;/b&gt; (Trattato sul funzionamento dell&#x27;Unione europea), che vietava il finanziamento dei bilanci di altri Stati.&lt;/p&gt;
&lt;blockquote class=&quot;law&quot;&gt;&quot;The Union shall not be liable for or assume the commitments of central governments, regional, local or other public authorities, other bodies governed by public law, or public undertakings of any Member State, without prejudice to mutual financial guarantees for the joint execution of a specific project. A Member State shall not be liable for or assume the commitments of […] another Member State […].&quot; &lt;span class=&quot;sl&quot;&gt;art. 125 TFUE, slide 21&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;&lt;b&gt;In italiano:&lt;/b&gt; né l&#x27;Unione né un altro Stato membro rispondono dei debiti di un governo (o di enti pubblici) di uno Stato membro, né se li accollano. Fanno eccezione le garanzie reciproche per realizzare insieme un progetto specifico.&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;Logica della disciplina di mercato&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;4&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;74&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Nessun salvataggio&lt;/text&gt;&lt;text x=&quot;74&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;credibile&lt;/text&gt;
&lt;rect x=&quot;168&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;I mercati prezzano&lt;/text&gt;&lt;text x=&quot;238&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;il rischio Stato per Stato&lt;/text&gt;
&lt;rect x=&quot;332&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;402&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Spread alti per chi&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;spende troppo&lt;/text&gt;
&lt;rect x=&quot;496&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Incentivo a&lt;/text&gt;&lt;text x=&quot;566&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;bilanci sani&lt;/text&gt;
&lt;/g&gt;
&lt;path class=&quot;ed&quot; d=&quot;M146 55 H164&quot;/&gt;&lt;path class=&quot;ed&quot; d=&quot;M310 55 H328&quot;/&gt;&lt;path class=&quot;ed&quot; d=&quot;M474 55 H492&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;el&quot;&gt;= market discipline, la disciplina imposta dai mercati sugli emittenti di debito&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Lo scopo della regola è imporre politiche di bilancio sane sottoponendo chi emette debito (gli Stati) alla &lt;dfn&gt;market discipline&lt;/dfn&gt;, e così proteggere la stabilità finanziaria dell&#x27;unione monetaria. &lt;span class=&quot;sl&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;&lt;b&gt;Ma&lt;/b&gt; arriva il &lt;dfn&gt;contagion&lt;/dfn&gt;: la crisi si trasmette anche a Stati con conti pubblici virtuosi, come la Spagna. La disciplina di mercato non colpisce solo chi &quot;se lo merita&quot;, e serve una &lt;b&gt;riforma della governance economica&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 21&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Due compiti insieme, e due fronti &lt;span class=&quot;sl&quot;&gt;slide 22&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Compito 1&lt;/h4&gt;&lt;p&gt;Rispondere &lt;b&gt;in tempo&lt;/b&gt; a una crisi che minava la stabilità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Compito 2&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Riformare&lt;/b&gt; la governance mentre la crisi era in corso.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Arrivare a una visione condivisa era difficile anche per la polarizzazione fra &lt;b&gt;paesi creditori&lt;/b&gt; e &lt;b&gt;paesi travolti dagli &lt;span class=&quot;en&quot;&gt;spillovers&lt;/span&gt;&lt;/b&gt; negativi della crisi (spillover = effetti di ricaduta da un paese all&#x27;altro).&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Polarizzazione fra paesi creditori e paesi colpiti&quot;&gt;
&lt;line x1=&quot;300&quot; x2=&quot;300&quot; y1=&quot;10&quot; y2=&quot;140&quot; class=&quot;sr&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;rect x=&quot;330&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Paesi creditori&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;timore di pagare per gli altri&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;(moral hazard): condizioni severe,&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;rispetto dell&#x27;art. 125&lt;/text&gt;
&lt;text x=&quot;460&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Paesi colpiti dalla crisi&lt;/text&gt;
&lt;text x=&quot;460&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;serve finanziamento rapido&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;e solidarietà: il contagio&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;non è solo colpa loro&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Le slide dicono solo che le posizioni erano polarizzate. Gli argomenti dentro i riquadri sono una sintesi interpretativa, non testo delle slide. &lt;span class=&quot;en&quot;&gt;Moral hazard&lt;/span&gt; = l&#x27;incentivo a comportarsi in modo meno prudente quando ci si aspetta di essere salvati.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Prima della crisi, come spingeva il disegno dell&#x27;EZ i paesi a tenere i conti in ordine?&lt;/summary&gt;&lt;div&gt;Con le regole fiscali del patto di stabilità e crescita (sorveglianza) e con la clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; (art. 125 TFUE), unite al fatto che la BCE non era prestatore di ultima istanza degli Stati. Nessuno ti salva, quindi i mercati ti disciplinano con spread più alti se spendi troppo.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché il contagio alla Spagna mise in crisi la logica della disciplina di mercato?&lt;/summary&gt;&lt;div&gt;Perché la Spagna aveva conti pubblici virtuosi, eppure subì la fuga dei capitali e spread in aumento. I mercati non punivano soltanto la cattiva politica fiscale: punivano paesi interi per squilibri privati, legami banche-Stato e contagio. La regola non bastava più a garantire la stabilità.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Di quanto fu rivisto il deficit greco 2009?&lt;/summary&gt;&lt;div&gt;Dal 6,7% al 15,1% del PIL, oltre il doppio della stima iniziale e cinque volte la soglia del 3%.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S8 ============ --&gt;
&lt;section id=&quot;s8&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 8 · Prima risposta&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;Prestiti bilaterali, Troika, condizionalità e FMI&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Marzo 2010&lt;/b&gt;: per la Grecia l&#x27;EZ accetta un&#x27;assistenza finanziaria dell&#x27;FMI più &lt;b&gt;prestiti bilaterali&lt;/b&gt;, decisi all&#x27;unanimità dai paesi prestatori e &lt;b&gt;soggetti a condizionalità&lt;/b&gt;. A valutarla sono Commissione europea (EC), FMI e BCE, la &lt;dfn&gt;Troika&lt;/dfn&gt;, insieme alle autorità greche. &lt;span class=&quot;sl&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Conditionality&lt;/b&gt;: condizionalità, cioè l&#x27;aiuto arriva a rate e ogni rata è legata all&#x27;attuazione di misure concordate. Le tre famiglie di condizioni sono quelle qui sotto.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;Fiscal measures&lt;/h4&gt;&lt;p&gt;Misure di bilancio per ridurre deficit e debito pubblico: tagli di spesa, aumenti di entrate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;Financial measures&lt;/h4&gt;&lt;p&gt;Misure finanziarie per rimettere in salute il settore finanziario: ricapitalizzazioni, ristrutturazione delle banche.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card sage&quot;&gt;&lt;h4&gt;Structural reforms&lt;/h4&gt;&lt;p&gt;Riforme strutturali (mercato del lavoro, dei prodotti, pubblica amministrazione) per migliorare la competitività, cioè la svalutazione interna della parte 3.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Il quadro dei prestiti ufficiali dell&#x27;EZ era &lt;b&gt;frenato&lt;/b&gt; da visioni molto diverse sulla strategia di salvataggio e dalla necessità di &lt;b&gt;scavalcare la clausola dell&#x27;art. 125&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Anche l&#x27;FMI ha dovuto aggirare una regola &lt;span class=&quot;sl&quot;&gt;slide 24&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Debt Sustainability Assessment (DSA)&lt;/b&gt;: valutazione di sostenibilità del debito, cioè l&#x27;analisi che stabilisce se il debito di un paese potrà essere servito senza ristrutturazione, in diversi scenari.&lt;br&gt;&lt;b&gt;Exceptional access policy (EAP)&lt;/b&gt;: le regole per prestiti oltre i limiti normali, cioè più del &lt;b&gt;100% della &lt;span class=&quot;en&quot;&gt;quota&lt;/span&gt;&lt;/b&gt; del paese in un anno. La quota è la sottoscrizione di ciascun membro all&#x27;FMI e determina voti e accesso al credito. Per l&#x27;accesso eccezionale il debito deve risultare sostenibile &lt;b&gt;con alta probabilità&lt;/b&gt;.&lt;/div&gt;
&lt;p&gt;Per la Grecia nel 2010 la DSA &lt;b&gt;non&lt;/b&gt; dava questo risultato. Sotto la pressione del rischio di un crollo sistemico, l&#x27;FMI introdusse la &lt;dfn&gt;systemic exemption&lt;/dfn&gt;: si poteva derogare alla DSA se la crisi rischiava di diventare &lt;b&gt;sistemica&lt;/b&gt;, cioè di contagiare il sistema finanziario internazionale.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Regola 2010&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Dopo il 2016&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;Regola FMI del 2010&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Debito sostenibile con alta probabilità?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 35 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sì&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Accesso eccezionale OK&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M135 60 V100&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;86&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;no / incerto&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Rischio di contagio sistemico?&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;systemic exemption&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 132 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sì&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Prestito concesso lo stesso&lt;/text&gt;&lt;text x=&quot;459&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;Grecia 2010, poi Portogallo e Irlanda&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;Regola FMI dopo il 2016&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Debito sostenibile con alta probabilità?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 35 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sì&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Accesso eccezionale OK&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M135 60 V100&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;86&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sostenibilità incerta&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Altri prestatori ufficiali si impegnano&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;a coprire le possibili perdite?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 132 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sì&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Prestito possibile&lt;/text&gt;&lt;text x=&quot;459&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;la systemic exemption non c&#x27;è più&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;La stessa esenzione fu usata per salvare &lt;b&gt;Portogallo e Irlanda&lt;/b&gt;. È stata &lt;b&gt;abrogata nel 2016&lt;/b&gt;: da allora un salvataggio con sostenibilità del debito incerta richiede che altri prestatori ufficiali si impegnino a coprire le possibili perdite. &lt;span class=&quot;sl&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nel suo documento del 2016 l&#x27;FMI riconosce che l&#x27;esenzione &quot;non si è rivelata affidabile nel mitigare il contagio&quot; e comportava costi e rischi rilevanti. L&#x27;Ufficio di valutazione indipendente (IEO) aveva criticato le decisioni del 2010, dicendo che le regole sull&#x27;accesso eccezionale erano state seguite &quot;in modo perfunctorio&quot;. &lt;a href=&quot;https://www.imf.org/en/Publications/Policy-Papers/Issues/2016/12/31/The-Fund-s-Lending-Framework-and-Sovereign-Debt-Further-Considerations-PP5015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, The Fund&#x27;s Lending Framework and Sovereign Debt (2016)&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Chi componeva la Troika e che cosa valutava?&lt;/summary&gt;&lt;div&gt;Commissione europea, FMI e BCE, insieme alle autorità greche. Valutava il rispetto della condizionalità: misure fiscali, misure finanziarie e riforme strutturali.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che cos&#x27;era la systemic exemption e perché è stata introdotta?&lt;/summary&gt;&lt;div&gt;Una deroga alla regola per cui l&#x27;accesso eccezionale richiede un debito sostenibile con alta probabilità. Permetteva di prestare anche senza quella certezza se c&#x27;era rischio di contagio sistemico. Fu introdotta nel 2010 per la Grecia, usata poi per Portogallo e Irlanda e abrogata nel 2016.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali due &quot;clausole&quot; dovettero essere superate per salvare la Grecia?&lt;/summary&gt;&lt;div&gt;Lato UE la clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; dell&#x27;art. 125 TFUE; lato FMI il requisito di sostenibilità del debito (DSA) per l&#x27;accesso eccezionale.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S9 ============ --&gt;
&lt;section id=&quot;s9&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 9 · Nuove istituzioni&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;Il cambio di fondo: un quadro comune (EFSM, EFSF, ESM)&lt;/h2&gt;
&lt;p&gt;Il prestito FMI di maggio 2010 alla Grecia non calma i mercati, e le pressioni si estendono a Portogallo (PT) e Irlanda (IR). L&#x27;&lt;b&gt;Ecofin del 10 maggio 2010&lt;/b&gt; (il Consiglio dei ministri dell&#x27;economia e delle finanze UE) cambia approccio: dai &lt;b&gt;prestiti finanziati direttamente&lt;/b&gt; ai &lt;b&gt;prestiti garantiti dagli Stati&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Prestiti diretti e prestiti garantiti a confronto&quot;&gt;
&lt;text x=&quot;150&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Prestiti finanziati direttamente&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Prestiti garantiti&lt;/text&gt;
&lt;line x1=&quot;315&quot; x2=&quot;315&quot; y1=&quot;10&quot; y2=&quot;200&quot; class=&quot;sr&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
&lt;rect x=&quot;60&quot; y=&quot;34&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Governi dell&#x27;euro&lt;/text&gt;
&lt;path d=&quot;M150 76 V146&quot; stroke-width=&quot;5&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;contanti subito&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;150&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Grecia&lt;/text&gt;
&lt;rect x=&quot;335&quot; y=&quot;34&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Governi dell&#x27;euro&lt;/text&gt;
&lt;path d=&quot;M405 76 V100&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;2&quot; class=&quot;sm&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;412&quot; y=&quot;94&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;garanzie&lt;/text&gt;
&lt;rect x=&quot;335&quot; y=&quot;104&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick);&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; style=&quot;fill:var(--paper)&quot;&gt;Veicolo (EFSF)&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;104&quot; width=&quot;130&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Mercati&lt;/text&gt;
