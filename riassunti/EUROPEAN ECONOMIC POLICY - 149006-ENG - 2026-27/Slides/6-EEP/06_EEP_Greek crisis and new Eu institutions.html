&lt;path d=&quot;M498 118 H478&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;488&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;emette bond&lt;/text&gt;
&lt;path d=&quot;M405 146 V172&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;rect x=&quot;335&quot; y=&quot;174&quot; width=&quot;140&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Paese in difficoltà&lt;/text&gt;
&lt;text x=&quot;565&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;solo &quot;in caso di bisogno&quot;&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Nel primo modello i governi versano denaro. Nel secondo danno garanzie, mentre un veicolo comune raccoglie fondi sul mercato e li presta solo se serve.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;Il quadro comune si basa su &lt;b&gt;due strumenti temporanei&lt;/b&gt;, l&#x27;&lt;dfn&gt;EFSF&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;European Financial Stability Facility&lt;/span&gt;) e l&#x27;&lt;dfn&gt;EFSM&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;European Financial Stabilisation Mechanism&lt;/span&gt;), con una missione comune: tutelare la stabilità finanziaria in Europa fornendo assistenza ai paesi dell&#x27;area euro. &lt;span class=&quot;sl&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;EFSM&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;EFSF&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;ESM&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;EFSM: la Commissione prende a prestito per conto dell&#x27;Unione &lt;span class=&quot;sl&quot;&gt;slide 26&lt;/span&gt;&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;La Commissione si indebita sui mercati internazionali &lt;b&gt;per conto dell&#x27;Unione&lt;/b&gt;, con una &lt;b&gt;garanzia implicita del bilancio UE&lt;/b&gt;, e &lt;b&gt;ripresta&lt;/b&gt; (&lt;span class=&quot;en&quot;&gt;on-lends&lt;/span&gt;) il ricavato allo Stato beneficiario.&lt;/li&gt;
&lt;li&gt;Capacità: la Commissione può raccogliere &lt;b&gt;fino a €60 miliardi&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Per l&#x27;Unione il costo del servizio del debito è nullo: interessi e capitale li rimborsa lo Stato beneficiario, tramite la Commissione (prestito &lt;span class=&quot;en&quot;&gt;back-to-back&lt;/span&gt;).&lt;/li&gt;
&lt;li&gt;Decisa il 10 maggio 2010. Oggi resta disponibile per eventi futuri ma non viene usata. &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Base giuridica: regolamento (UE) n. 407/2010 del Consiglio, 11 maggio 2010. Il prestito si attiva per uno Stato UE in grave difficoltà &quot;a causa di eventi al di fuori del suo controllo&quot; (art. 122(2) TFUE). Usato per Irlanda (€22,5 mld) e Portogallo (€24,3 mld) nel 2011-14 e, nel luglio 2015, per un prestito ponte di €7,16 mld alla Grecia. &lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/summary/european-financial-stabilisation-mechanism.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, sintesi EFSM&lt;/a&gt; · &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;h4&gt;EFSF: garanzie degli Stati dell&#x27;euro &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt;&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;Fornisce finanziamenti agli Stati dell&#x27;area euro. I fondi sono garantiti &lt;b&gt;dagli Stati membri dell&#x27;euro&lt;/b&gt;, non dal bilancio UE.&lt;/li&gt;
&lt;li&gt;Autorizzato a prendere a prestito &lt;b&gt;fino a €440 miliardi&lt;/b&gt; emettendo obbligazioni garantite dagli Stati in proporzione alla loro quota nel capitale versato della BCE.&lt;/li&gt;
&lt;li&gt;Concordato il &lt;b&gt;9 maggio 2010&lt;/b&gt;, un giorno prima dell&#x27;EFSM.&lt;/li&gt;
&lt;li&gt;Dal 2012 è stato sostituito dall&#x27;ESM.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Con le modifiche del 2011 la capacità effettiva di prestito di €440 miliardi è stata coperta da garanzie per €780 miliardi, con una sovra-garanzia fino al 165%: le garanzie dovevano superare i prestiti per ottenere il rating massimo. &lt;a href=&quot;https://www.esm.europa.eu/press-releases/efsf-amendments-approved-all-member-states&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ESM, comunicato sulle modifiche EFSF&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;h4&gt;ESM: il meccanismo permanente &lt;span class=&quot;sl&quot;&gt;slide 28-31&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;Istituito dal &lt;b&gt;Consiglio europeo del 24-25 marzo 2011&lt;/b&gt;: è un meccanismo &lt;b&gt;permanente&lt;/b&gt; di gestione delle crisi, attivabile quando uno Stato membro è in difficoltà. Sostituisce l&#x27;EFSF temporaneo. Il sostegno è soggetto a &lt;b&gt;condizionalità rigorosa&lt;/b&gt; e a un&#x27;&lt;b&gt;analisi approfondita della solvibilità&lt;/b&gt;. Capacità di prestito: &lt;b&gt;€500 miliardi&lt;/b&gt;, con garanzie fornite dai singoli Stati.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;Scegli l&#x27;esito dell&#x27;analisi di solvibilità:&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; data-esm=&quot;s&quot;&gt;Paese solvibile&lt;/button&gt;&lt;button class=&quot;btn&quot; data-esm=&quot;i&quot;&gt;Paese insolvente&lt;/button&gt;&lt;/div&gt;
&lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;esmTree&quot; viewBox=&quot;0 0 600 190&quot; role=&quot;img&quot; aria-label=&quot;Albero decisionale ESM&quot;&gt;
&lt;rect x=&quot;200&quot; y=&quot;6&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Analisi di solvibilità&lt;/text&gt;
&lt;g class=&quot;br&quot; data-br=&quot;s&quot;&gt;&lt;path class=&quot;ed&quot; d=&quot;M260 52 L150 86&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;90&quot; width=&quot;270&quot; height=&quot;92&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Solvibile&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;i privati sono incoraggiati a mantenere&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;l&#x27;esposizione; l&#x27;ESM presta come&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;creditore privilegiato (dopo l&#x27;FMI)&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;br&quot; data-br=&quot;i&quot;&gt;&lt;path class=&quot;ed&quot; d=&quot;M340 52 L450 86&quot;/&gt;&lt;rect x=&quot;320&quot; y=&quot;90&quot; width=&quot;270&quot; height=&quot;92&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Insolvente&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;prima lo Stato negozia con i creditori&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;privati un piano di ristrutturazione&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;del debito&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p class=&quot;out&quot; id=&quot;esmTxt&quot;&gt;Scegli un ramo per leggere la spiegazione.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;ESM è stato inaugurato l&#x27;8 ottobre 2012. Finché l&#x27;EFSF gestiva ancora i programmi per Irlanda, Portogallo e Grecia, il tetto combinato EFSF+ESM era di €700 miliardi. Nell&#x27;aprile 2014 l&#x27;ESM ha raggiunto la piena capacità di €500 miliardi, con €80 miliardi di capitale versato. Le slide dicono &quot;dal 2011&quot; riferendosi alla decisione politica: la data di avvio operativo è il 2012. &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France, meccanismi di gestione delle crisi&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;cmp&quot;&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;EFSM&lt;/th&gt;&lt;th&gt;EFSF&lt;/th&gt;&lt;th&gt;ESM&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Natura&lt;/b&gt;&lt;/td&gt;&lt;td&gt;temporaneo, tutta l&#x27;UE (bilancio UE)&lt;/td&gt;&lt;td&gt;temporaneo, solo area euro&lt;/td&gt;&lt;td&gt;&lt;b&gt;permanente&lt;/b&gt;, area euro, intergovernativo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi si indebita&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Commissione, per l&#x27;Unione&lt;/td&gt;&lt;td&gt;il veicolo EFSF&lt;/td&gt;&lt;td&gt;l&#x27;ESM&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi garantisce&lt;/b&gt;&lt;/td&gt;&lt;td&gt;bilancio UE (implicitamente)&lt;/td&gt;&lt;td&gt;Stati dell&#x27;euro, pro quota capitale BCE&lt;/td&gt;&lt;td&gt;Stati membri (contributi e garanzie)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Capacità&lt;/b&gt;&lt;/td&gt;&lt;td&gt;€60 mld&lt;/td&gt;&lt;td&gt;€440 mld&lt;/td&gt;&lt;td&gt;€500 mld&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Nascita&lt;/b&gt;&lt;/td&gt;&lt;td&gt;10 maggio 2010&lt;/td&gt;&lt;td&gt;9 maggio 2010&lt;/td&gt;&lt;td&gt;decisione mar 2011, operativo 2012&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Condizioni&lt;/b&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;richiesta dello Stato + programma di aggiustamento macroeconomico con &lt;b&gt;condizionalità rigorosa&lt;/b&gt;, concordato con la Commissione in raccordo con la BCE&lt;/td&gt;&lt;td&gt;condizionalità rigorosa + analisi di solvibilità&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Oggi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;disponibile, non usato&lt;/td&gt;&lt;td&gt;sostituito dall&#x27;ESM&lt;/td&gt;&lt;td&gt;il fondo che presta ai paesi in difficoltà&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Capacità di prestito a confronto&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;text x=&quot;80&quot; y=&quot;34&quot; text-anchor=&quot;end&quot;&gt;EFSM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;20&quot; width=&quot;56&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;35&quot; class=&quot;fm&quot;&gt;€60 mld&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;74&quot; text-anchor=&quot;end&quot;&gt;EFSF&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;60&quot; width=&quot;411&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick);opacity:.75&quot;/&gt;&lt;text x=&quot;507&quot; y=&quot;75&quot; class=&quot;fm&quot;&gt;€440 mld&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;114&quot; text-anchor=&quot;end&quot;&gt;ESM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;100&quot; width=&quot;467&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick);opacity:.55&quot;/&gt;&lt;text x=&quot;562&quot; y=&quot;115&quot; class=&quot;fm&quot;&gt;€500&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;90&quot; y=&quot;144&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;capacità di prestito (slide 26-28)&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Attivazione di EFSM ed EFSF: solo dopo una &lt;b&gt;richiesta di assistenza&lt;/b&gt; dello Stato e un &lt;b&gt;programma di aggiustamento macroeconomico&lt;/b&gt; con condizionalità rigorosa concordato con la Commissione, in raccordo con la BCE. &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt; Per l&#x27;ESM, il &lt;dfn&gt;preferential creditor status&lt;/dfn&gt; (status di creditore privilegiato) significa che, in caso di problemi, l&#x27;ESM viene rimborsato prima dei creditori privati: solo l&#x27;FMI viene prima. &lt;span class=&quot;sl&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Le basi giuridiche &lt;span class=&quot;sl&quot;&gt;slide 29-30&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Art. 122(2) TFUE&lt;/h4&gt;&lt;p&gt;&quot;Where a Member State is in difficulty or is seriously threatened with severe difficulties caused by natural disasters or &lt;u&gt;exceptional circumstances beyond its control&lt;/u&gt;, the Council, on a proposal from the Commission, may grant […] Union financial assistance […]&quot;. Base dell&#x27;assistenza dell&#x27;Unione in circostanze eccezionali; le slide la indicano come base giuridica dell&#x27;ESM.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Art. 136(3) TFUE (aggiunto)&lt;/h4&gt;&lt;p&gt;&quot;Member States whose currency is the euro may establish a stability mechanism to be activated if indispensable to &lt;b&gt;safeguard the stability of the euro area as a whole&lt;/b&gt;. The granting of any required financial assistance under the mechanism will be made subject to &lt;b&gt;strict conditionality&lt;/b&gt;.&quot;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La modifica è la decisione del Consiglio europeo 2011/199/UE del 25 marzo 2011, adottata con la procedura di revisione semplificata (art. 48(6) TUE) e pubblicata in GU L 91 del 6 aprile 2011. Il considerando 6 precisa che la modifica non aumenta le competenze dell&#x27;Unione. &lt;a href=&quot;https://www.legislation.gov.uk/eudn/2011/199/contents&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo della decisione 2011/199/UE&lt;/a&gt; (archivio del testo EUR-Lex). Nelle fonti giuridiche l&#x27;art. 122(2) è la base del regolamento EFSM, mentre l&#x27;ESM è un trattato fra gli Stati dell&#x27;euro reso compatibile dall&#x27;art. 136(3).&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Una nota sull&#x27;ESM: è intergovernativo.&lt;/b&gt; L&#x27;art. 136 modificato autorizza gli Stati a creare il meccanismo su base &lt;b&gt;interamente intergovernativa&lt;/b&gt; (accordo fra governi, fuori dal metodo comunitario). Commissione e Parlamento europeo non hanno potere di proposta né di consultazione, e non c&#x27;è alcun intervento diretto del bilancio UE: l&#x27;assistenza si regge sui contributi degli Stati. &lt;span class=&quot;sl&quot;&gt;slide 31&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali strumenti temporanei ha creato l&#x27;UE nel 2010 per gestire la crisi?&lt;/summary&gt;&lt;div&gt;EFSF (9 maggio 2010, fino a €440 mld, garantito dagli Stati dell&#x27;euro) ed EFSM (10 maggio 2010, fino a €60 mld, la Commissione si indebita con garanzia implicita del bilancio UE). Prima ancora c&#x27;erano stati i prestiti bilaterali alla Grecia insieme all&#x27;FMI.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che differenza c&#x27;è fra prestiti finanziati direttamente e prestiti garantiti?&lt;/summary&gt;&lt;div&gt;Nei primi i governi danno subito contanti al paese in crisi. Nei secondi i governi offrono garanzie, un veicolo comune raccoglie fondi sul mercato e li presta solo in caso di bisogno.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Cosa succede se l&#x27;analisi ESM dichiara un paese insolvente?&lt;/summary&gt;&lt;div&gt;Il paese deve prima negoziare un piano di ristrutturazione del debito con i creditori privati. Se è solvibile, invece, i privati vengono incoraggiati a mantenere l&#x27;esposizione e l&#x27;ESM interviene come creditore privilegiato, secondo solo all&#x27;FMI.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché si dice che l&#x27;ESM è intergovernativo?&lt;/summary&gt;&lt;div&gt;Perché nasce da un accordo fra gli Stati dell&#x27;euro, autorizzato dall&#x27;art. 136(3). Commissione e Parlamento non hanno potere di proposta o consultazione, e le risorse vengono dagli Stati, non dal bilancio UE.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S10 ============ --&gt;
&lt;section id=&quot;s10&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 10 · Dopo la crisi&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;La Commissione sui mercati, e le altre riforme&lt;/h2&gt;
&lt;p&gt;L&#x27;EFSM è un esempio di Commissione europea che si indebita sui mercati internazionali dei capitali &lt;b&gt;per conto dell&#x27;Unione&lt;/b&gt;. Lo può fare perché glielo consentono i Trattati, e le emissioni sono denominate solo in euro. &lt;span class=&quot;sl&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;NextGenerationEU&lt;/h4&gt;&lt;p&gt;Il programma più grande: fino a circa &lt;b&gt;€850 miliardi&lt;/b&gt; (cifra della slide), circa il &lt;b&gt;5% del PIL UE&lt;/b&gt;. È finanziato con titoli emessi sui mercati, e circa il &lt;b&gt;30%&lt;/b&gt; con &lt;dfn&gt;green bonds&lt;/dfn&gt; (obbligazioni i cui proventi finanziano solo spese ambientali).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;SURE&lt;/h4&gt;&lt;p&gt;Fino a &lt;b&gt;€100 miliardi&lt;/b&gt; per sostenere l&#x27;occupazione e mantenere le persone al lavoro (cassa integrazione nella pandemia). È finanziato solo con &lt;dfn&gt;social bonds&lt;/dfn&gt; (obbligazioni a scopo sociale).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Dimensione dei programmi di indebitamento della Commissione&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;&lt;text x=&quot;80&quot; y=&quot;30&quot; text-anchor=&quot;end&quot;&gt;EFSM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;17&quot; width=&quot;31&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;127&quot; y=&quot;31&quot; class=&quot;fm&quot;&gt;60&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;62&quot; text-anchor=&quot;end&quot;&gt;SURE&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;49&quot; width=&quot;52&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;148&quot; y=&quot;63&quot; class=&quot;fm&quot;&gt;100&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;94&quot; text-anchor=&quot;end&quot;&gt;NGEU&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;81&quot; width=&quot;440&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;536&quot; y=&quot;95&quot; class=&quot;fm&quot;&gt;≈850&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;90&quot; y=&quot;116&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;miliardi di € (slide 26 e 32)&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Dall&#x27;EFSM della crisi del 2010 a NGEU, la capacità della Commissione di indebitarsi è cresciuta di oltre un ordine di grandezza.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La Commissione ha emesso €98,4 miliardi di social bond SURE fra ottobre 2020 e dicembre 2022. Il primo green bond NGEU (ottobre 2021) valeva €12 miliardi, la più grande emissione verde mai fatta fino ad allora. Oggi le emissioni seguono un approccio unificato con EU-Bonds a lungo termine ed EU-Bills a breve. &lt;a href=&quot;https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations/funding-instruments_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea, Funding instruments&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Le altre novità nate dalla crisi &lt;span class=&quot;sl&quot;&gt;slide 32&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Regole fiscali più severe&lt;/h4&gt;&lt;p&gt;Modifiche al patto di stabilità e crescita (SGP) per rafforzare la prevenzione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;Politica monetaria non convenzionale&lt;/h4&gt;&lt;p&gt;Nuovi strumenti BCE (acquisti di titoli, operazioni a lungo termine…). Le slide rimandano alle prossime lezioni sulla politica monetaria della BCE.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small muted&quot;&gt;Nota: non è stato possibile elencare il contenuto della cartella &lt;code&gt;corso/&lt;/code&gt; in questa sessione, quindi gli altri file del corso non sono stati consultati. I rimandi alle lezioni sulla BCE vengono dalle slide stesse (slide 13, 17, 19).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;In che cosa l&#x27;EFSM anticipa NGEU e SURE?&lt;/summary&gt;&lt;div&gt;In tutti e tre i casi la Commissione si indebita sui mercati in euro per conto dell&#x27;Unione e usa i fondi per prestiti (EFSM, SURE) o per finanziare programmi (NGEU). Cambia la scala: €60 mld contro €100 e circa €850 mld.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono le due &quot;altre&quot; riforme citate dalle slide?&lt;/summary&gt;&lt;div&gt;Regole fiscali più severe (modifiche al SGP) e nuovi strumenti non convenzionali di politica monetaria.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S11 ============ --&gt;
&lt;section id=&quot;s11&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Ripasso finale&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;?&lt;/span&gt;Le domande del corso&lt;/h2&gt;
&lt;p&gt;Le sei domande della slide 33, con una traccia di risposta. Prova a rispondere ad alta voce prima di aprire. &lt;span class=&quot;sl&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. Che cos&#x27;è TARGET2 e che cosa registra?&lt;/summary&gt;&lt;div&gt;È il sistema di regolamento lordo in tempo reale dell&#x27;Eurosistema (&lt;span class=&quot;en&quot;&gt;Trans-European Automated Real-time Gross settlement Express Transfer&lt;/span&gt;), con cui banche e banche centrali regolano pagamenti in euro, anche fra paesi. I flussi netti fra paesi finiscono nei bilanci delle NCB e, cumulati, formano i saldi TARGET2: negativi per chi invia più di quanto riceve, positivi per chi riceve. Registrano pagamenti transfrontalieri netti per beni, servizi, interessi e capitali, e in pratica tutto ciò che le banche non riescono a regolare con fondi propri. Riflettono quindi la distribuzione della liquidità BCE fra paesi. → &lt;a href=&quot;#s5&quot;&gt;parte 5&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Perché TARGET2 ha registrato squilibri crescenti dal 2008-09? In quale direzione?&lt;/summary&gt;&lt;div&gt;Con la crisi finanziaria (agosto 2007), poi con la crisi del debito (maggio 2010) e il contagio a Italia e Spagna (estate 2011), i capitali privati sono fuggiti dalla periferia (GR, IE, PT, poi ES, IT) verso il centro (DE, NL). Il mercato interbancario si è bloccato per sfiducia e mancanza di collateral, quindi le riserve accumulate dalle banche del centro non tornavano più in periferia. Le banche periferiche si sono rifinanziate presso l&#x27;Eurosistema. Risultato: passività TARGET2 in periferia e crediti TARGET2 nel centro (Germania circa +700 mld a metà 2012). → &lt;a href=&quot;#s5&quot;&gt;parte 5&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. Quali strumenti temporanei ha introdotto l&#x27;UE per salvare la Grecia?&lt;/summary&gt;&lt;div&gt;All&#x27;inizio (maggio 2010) prestiti bilaterali coordinati dei paesi dell&#x27;euro insieme al prestito FMI, con condizionalità sorvegliata dalla Troika. Poi il quadro comune dell&#x27;Ecofin del 9-10 maggio 2010: EFSF (fino a €440 mld, garanzie degli Stati dell&#x27;euro) ed EFSM (fino a €60 mld, la Commissione si indebita con garanzia implicita del bilancio UE). Il passaggio è da prestiti finanziati direttamente a prestiti garantiti. Dal 2012 l&#x27;ESM permanente sostituisce l&#x27;EFSF. → &lt;a href=&quot;#s9&quot;&gt;parte 9&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;4. Prima della crisi, come induceva il disegno dell&#x27;EZ a tenere bilanci sani?&lt;/summary&gt;&lt;div&gt;Con la sorveglianza fiscale del patto di stabilità e crescita e con la clausola di &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; (art. 125 TFUE), sostenuta dal fatto che la BCE non fa da prestatore di ultima istanza degli Stati. L&#x27;idea era la disciplina di mercato: senza salvataggi, i mercati chiedono spread più alti a chi spende troppo. Non c&#x27;era però alcuna gestione delle crisi. → &lt;a href=&quot;#s7&quot;&gt;parte 7&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;5. Perché l&#x27;Eurosistema ha &quot;sostituito&quot; i capitali privati durante la crisi?&lt;/summary&gt;&lt;div&gt;Perché nell&#x27;euro i pagamenti transfrontalieri si regolano in moneta di banca centrale. Quando i privati ritiravano fondi e il mercato interbancario era fermo, le banche dei paesi in deflusso hanno coperto il fabbisogno di liquidità chiedendo di più alla BCE (MRO, LTRO, marginal lending), mentre le banche tedesche ne chiedevano meno (da €250 a €130 mld). Così il finanziamento ufficiale (Eurosistema più programmi) ha compensato il rovesciamento degli afflussi privati: completamente in Grecia e Portogallo, e solo con l&#x27;Eurosistema in Spagna e Italia. → &lt;a href=&quot;#s6&quot;&gt;parte 6&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;6. La liquidità dell&#x27;Eurosistema era sufficiente per tutti i paesi colpiti?&lt;/summary&gt;&lt;div&gt;No. L&#x27;Eurosistema non finanzia senza limiti i deficit di bilancia dei pagamenti: presta alle banche tramite le operazioni ordinarie, contro collateral adeguato. Ha sostenuto le banche, ma non poteva sostituire l&#x27;accesso al mercato degli Stati, perché la BCE non è prestatore di ultima istanza dei governi e l&#x27;art. 125 vieta i salvataggi. Per Grecia, Portogallo e Irlanda sono serviti i programmi UE/FMI e poi EFSF/EFSM/ESM. Per le tensioni sui titoli sovrani sono serviti anche strumenti non convenzionali come l&#x27;SMP. → &lt;a href=&quot;#s6&quot;&gt;parte 6&lt;/a&gt;, &lt;a href=&quot;#s9&quot;&gt;parte 9&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;!-- ============ S12 ============ --&gt;
&lt;section id=&quot;s12&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Fonti citate nelle slide&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;Per approfondire&lt;/h2&gt;
&lt;p&gt;Tutte le schede qui sotto sono &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: descrizioni e link trovati con una ricerca web su siti istituzionali, editori e archivi accademici. Non vengono dalle slide, salvo l&#x27;indicazione della slide in cui la fonte è citata.&lt;/p&gt;
&lt;ol class=&quot;refs&quot;&gt;
&lt;li&gt;&lt;h4&gt;Corsetti, Erce &amp;amp; Uy (2017), &quot;Official Sector Lending Strategies During the Euro Area Crisis&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Cambridge-INET Working Paper 2017/12 (anche ADEMU WP 2017/070). Poi pubblicato in &lt;i&gt;The Review of International Organizations&lt;/i&gt;, vol. 15, 2020. Citato nella slide 1.&lt;/p&gt;
&lt;p&gt;Studia come i prestatori ufficiali dell&#x27;euro siano passati dall&#x27;impostazione dell&#x27;FMI a un quadro proprio. Con un&#x27;analisi per eventi verifica come scadenze e spread dei prestiti abbiano influito su rendimenti, liquidità e accesso al mercato. Trova che i prestiti europei più lunghi ed economici si associano a un miglior accesso al mercato, e propone di orientare DSA e programmi alla gestione dei flussi di cassa. &lt;b&gt;Perché conta:&lt;/b&gt; è la base della parte su programmi, Troika ed EFSF/ESM.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.janeway.econ.cam.ac.uk/publication/504&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Cambridge (Janeway Institute)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Pisani-Ferry, Sapir &amp;amp; Wolff (2013), &quot;EU-IMF assistance to euro-area countries: an early assessment&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Bruegel Blueprint n. 19, maggio 2013. Citato nella slide 1.&lt;/p&gt;
&lt;p&gt;Valutazione indipendente, non commissionata, dei programmi della Troika in Grecia, Irlanda e Portogallo: impatto economico e conseguenze dell&#x27;assetto istituzionale (cooperazione UE-FMI). È &quot;early&quot; perché i tre paesi erano ancora sotto programma quando è stato scritto. &lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento per capire pregi e limiti della prima risposta (parti 8-9).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://bruegel.org/book/eu-imf-assistance-euro-area-countries-early-assessment&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bruegel&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Merler &amp;amp; Pisani-Ferry (2012), &quot;Sudden stops in the euro area&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Bruegel Policy Contribution 2012/06, 29 marzo 2012. Anche in &lt;i&gt;Review of Economics and Institutions&lt;/i&gt; 3(3), 2012. Citato nelle slide 1, 13-15.&lt;/p&gt;
&lt;p&gt;Mostra che i rovesci dei capitali privati in Grecia, Irlanda, Italia, Portogallo e Spagna sono veri sudden stop, concentrati in tre momenti (crisi finanziaria globale, dopo il programma greco, estate 2011), segno di contagio. I fondi pubblici, soprattutto il rifinanziamento BCE delle banche deboli, hanno in parte sostituito quelli privati. &lt;b&gt;Perché conta:&lt;/b&gt; da qui vengono la lettura di TARGET2 e la scomposizione dei flussi delle parti 5-6.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bruegel.org/policy-contribution/sudden-stops-euro-area&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bruegel&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Cecioni &amp;amp; Ferrero (2012), &quot;Determinants of TARGET2 imbalances&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Banca d&#x27;Italia, Questioni di Economia e Finanza (Occasional Papers) n. 136, settembre 2012. Fonte dei grafici della slide 11.&lt;/p&gt;
&lt;p&gt;Collega i saldi TARGET2 dal 2007 alla liquidità dell&#x27;Eurosistema e alle bilance dei pagamenti di Grecia, Portogallo, Italia e Spagna. TARGET2 ha finanziato il deficit corrente greco, mentre negli altri paesi ha soprattutto sostituito i deflussi privati da titoli e interbancario. &lt;b&gt;Perché conta:&lt;/b&gt; distingue &quot;finanziare il deficit&quot; da &quot;compensare la fuga di capitali&quot;.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/qef/2012-0136/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca d&#x27;Italia&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Abad, Löffler, Schnabl &amp;amp; Zemanek (2013), &quot;Fiscal Divergence, Current Account Divergence and TARGET2 Imbalances in the EMU&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;&lt;i&gt;Intereconomics&lt;/i&gt; 48(1), pp. 51-58, gennaio/febbraio 2013. Fonte del grafico Germania-GIIPS nella slide 6.&lt;/p&gt;
&lt;p&gt;Attribuisce gli squilibri correnti interni all&#x27;euro a politiche fiscali divergenti, boom immobiliari e ULC divergenti, alimentati da tassi bassi. Sostiene che la crescita dei saldi TARGET2 abbia ritardato l&#x27;aggiustamento. &lt;b&gt;Perché conta:&lt;/b&gt; è una lettura critica di TARGET2, complementare a quella di Merler e Pisani-Ferry.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://archive.intereconomics.eu/year/2013/1/fiscal-divergence-current-account-divergence-and-target2-imbalances-in-the-emu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intereconomics (archivio)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Deutsche Bundesbank (2011b), Monthly Report marzo 2011, &quot;The dynamics of the Bundesbank&#x27;s TARGET2 balance&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Citata nella slide 14 (rifinanziamento delle banche tedesche da €250 a €130 mld).&lt;/p&gt;
&lt;p&gt;Spiega che i crediti TARGET2 della Bundesbank crescono in modo sistematico dal 2007 (€325,5 mld a fine 2010) e li collega al cambiamento nel modo in cui le banche dell&#x27;area si rifinanziano. &lt;b&gt;Perché conta:&lt;/b&gt; mostra dal lato tedesco la simmetria descritta nella slide 14.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bundesbank.de/en/publications/reports/monthly-reports/monthly-report-march-2011-707108&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bundesbank&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;BCE: TARGET balances e indicatori di competitività&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Fonte dei grafici delle slide 5 e 8-9.&lt;/p&gt;
&lt;p&gt;La spiegazione BCE di cosa sono i saldi TARGET, con dati mensili, e la pagina degli &lt;i&gt;harmonised competitiveness indicators&lt;/i&gt;: tassi di cambio reali deflazionati con prezzi al consumo, deflatore del PIL e ULC, dove un aumento indica una perdita di competitività. &lt;b&gt;Perché conta:&lt;/b&gt; sono i dati originali per aggiornare i grafici della lezione.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/target2_balances.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE, What are TARGET balances?&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/stats/exchange/hci/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE, Harmonised competitiveness indicators&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Art. 125 TFUE (clausola di no bailout)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Norma citata nelle slide 20-21 e 23.&lt;/p&gt;
&lt;p&gt;Testo ufficiale consolidato su EUR-Lex. &lt;b&gt;Perché conta:&lt;/b&gt; è la regola che il primo salvataggio ha dovuto &quot;scavalcare&quot;. La Corte di giustizia ha poi chiarito che non vieta l&#x27;assistenza tramite l&#x27;ESM, se soggetta a condizionalità rigorosa.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, art. 125 TFUE&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Decisione 2011/199/UE (modifica dell&#x27;art. 136 TFUE)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Norma citata nelle slide 30-31.&lt;/p&gt;
&lt;p&gt;Aggiunge all&#x27;art. 136 il paragrafo 3 che consente agli Stati dell&#x27;euro di istituire un meccanismo di stabilità, con procedura semplificata (art. 48(6) TUE) e senza ampliare le competenze UE. &lt;b&gt;Perché conta:&lt;/b&gt; è la base giuridica dell&#x27;ESM.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.legislation.gov.uk/eudn/2011/199/contents&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo della decisione (archivio legislation.gov.uk)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;EFSM: regolamento (UE) n. 407/2010&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Strumento descritto nelle slide 25-27 e 32.&lt;/p&gt;
&lt;p&gt;Sintesi ufficiale del regolamento che istituisce il meccanismo europeo di stabilizzazione finanziaria: la Commissione si indebita per conto dell&#x27;UE e ripresta allo Stato in difficoltà per eventi fuori dal suo controllo. &lt;b&gt;Perché conta:&lt;/b&gt; è il primo esempio di indebitamento comune &quot;in crisi&quot;.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/summary/european-financial-stabilisation-mechanism.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, sintesi&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;EFSF ed ESM&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Strumenti descritti nelle slide 25-31.&lt;/p&gt;
&lt;p&gt;Comunicati dell&#x27;ESM sulla nascita e sulle modifiche dell&#x27;EFSF (garanzie, capacità di €440 mld) e scheda della Banque de France sui meccanismi di gestione delle crisi (EFSM, EFSF, ESM, cifre effettivamente prestate). &lt;b&gt;Perché conta:&lt;/b&gt; numeri e date ufficiali da confrontare con le slide.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.esm.europa.eu/press-releases/efsf-becomes-fully-operational-0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ESM, EFSF operativo&lt;/a&gt; · &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;FMI: programma 2010 per la Grecia e riforma del 2016&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Eventi citati nelle slide 2 e 24.&lt;/p&gt;
&lt;p&gt;Il comunicato dell&#x27;approvazione dello &lt;i&gt;Stand-By Arrangement&lt;/i&gt; da circa €30 mld (9 maggio 2010) e il documento del 2016 con cui l&#x27;FMI rivede la politica di accesso eccezionale ed elimina la &lt;i&gt;systemic exemption&lt;/i&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; mostra dall&#x27;interno dell&#x27;FMI la deroga e il suo superamento.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.imf.org/external/np/sec/pr/2010/pr10187.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, PR 10/187&lt;/a&gt; · &lt;a href=&quot;https://www.imf.org/en/Publications/Policy-Papers/Issues/2016/12/31/The-Fund-s-Lending-Framework-and-Sovereign-Debt-Further-Considerations-PP5015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, policy paper 2016&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;NextGenerationEU green bonds e SURE social bonds&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Programmi citati (con link) nella slide 32.&lt;/p&gt;
&lt;p&gt;La pagina della Commissione &quot;EU as a borrower&quot; sugli strumenti di finanziamento: EU-Bonds, EU-Bills, green bond NGEU (fino al 30% di NGEU) e social bond SURE. &lt;b&gt;Perché conta:&lt;/b&gt; mostra come l&#x27;indebitamento comune sia passato dall&#x27;EFSM a una funzione stabile del bilancio UE.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations/funding-instruments_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea, Funding instruments&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;
