&lt;p&gt;The common framework rests on &lt;b&gt;two temporary instruments&lt;/b&gt;, the &lt;dfn&gt;EFSF&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;European Financial Stability Facility&lt;/span&gt;) and the &lt;dfn&gt;EFSM&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;European Financial Stabilisation Mechanism&lt;/span&gt;), with a shared mission: safeguarding financial stability in Europe by providing assistance to euro-area countries. &lt;span class=&quot;sl&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;EFSM&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;EFSF&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;ESM&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;EFSM: the Commission borrows on behalf of the Union &lt;span class=&quot;sl&quot;&gt;slide 26&lt;/span&gt;&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;The Commission borrows on international markets &lt;b&gt;on behalf of the Union&lt;/b&gt;, with an &lt;b&gt;implicit guarantee from the EU budget&lt;/b&gt;, and &lt;b&gt;on-lends&lt;/b&gt; the proceeds to the beneficiary state.&lt;/li&gt;
&lt;li&gt;Capacity: the Commission can raise &lt;b&gt;up to €60 billion&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;For the Union the cost of debt service is zero: interest and principal are repaid by the beneficiary state, through the Commission (&lt;span class=&quot;en&quot;&gt;back-to-back&lt;/span&gt; lending).&lt;/li&gt;
&lt;li&gt;Established on 10 May 2010. It remains available for future events but is not currently used. &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Legal basis: Council Regulation (EU) No 407/2010 of 11 May 2010. Lending is triggered for an EU member state in serious difficulty &quot;caused by exceptional occurrences beyond its control&quot; (Art. 122(2) TFEU). Used for Ireland (€22.5 bn) and Portugal (€24.3 bn) in 2011-14 and, in July 2015, for a €7.16 bn bridge loan to Greece. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-financial-stabilisation-mechanism.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, EFSM summary&lt;/a&gt; · &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;h4&gt;EFSF: guarantees from euro-area states &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt;&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;It provides financing to euro-area states. The funds are guaranteed &lt;b&gt;by euro-area member states&lt;/b&gt;, not by the EU budget.&lt;/li&gt;
&lt;li&gt;Authorised to borrow &lt;b&gt;up to €440 billion&lt;/b&gt; by issuing bonds guaranteed by the states in proportion to their share in the ECB&#x27;s paid-up capital.&lt;/li&gt;
&lt;li&gt;Agreed on &lt;b&gt;9 May 2010&lt;/b&gt;, one day before the EFSM.&lt;/li&gt;
&lt;li&gt;Since 2012 it has been replaced by the ESM.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; With the 2011 amendments, the effective lending capacity of €440 billion was backed by €780 billion in guarantees, with over-guarantees of up to 165%: guarantees had to exceed lending to obtain the highest credit rating. &lt;a href=&quot;https://www.esm.europa.eu/press-releases/efsf-amendments-approved-all-member-states&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ESM, press release on the EFSF amendments&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;h4&gt;ESM: the permanent mechanism &lt;span class=&quot;sl&quot;&gt;slides 28-31&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;Established by the &lt;b&gt;European Council of 24-25 March 2011&lt;/b&gt;: it is a &lt;b&gt;permanent&lt;/b&gt; crisis-management mechanism, which can be activated when a member state is in difficulty. It replaces the temporary EFSF. Support is subject to &lt;b&gt;strict conditionality&lt;/b&gt; and to a &lt;b&gt;rigorous debt sustainability analysis&lt;/b&gt;. Lending capacity: &lt;b&gt;€500 billion&lt;/b&gt;, with guarantees provided by individual states.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;Choose the outcome of the solvency analysis:&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; data-esm=&quot;s&quot;&gt;Solvent country&lt;/button&gt;&lt;button class=&quot;btn&quot; data-esm=&quot;i&quot;&gt;Insolvent country&lt;/button&gt;&lt;/div&gt;
&lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;esmTree&quot; viewBox=&quot;0 0 600 190&quot; role=&quot;img&quot; aria-label=&quot;ESM decision tree&quot;&gt;
&lt;rect x=&quot;200&quot; y=&quot;6&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Solvency analysis&lt;/text&gt;
&lt;g class=&quot;br&quot; data-br=&quot;s&quot;&gt;&lt;path class=&quot;ed&quot; d=&quot;M260 52 L150 86&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;90&quot; width=&quot;270&quot; height=&quot;92&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Solvent&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;private creditors are encouraged to&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;maintain exposure; the ESM lends as&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;a preferred creditor (after the IMF)&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;br&quot; data-br=&quot;i&quot;&gt;&lt;path class=&quot;ed&quot; d=&quot;M340 52 L450 86&quot;/&gt;&lt;rect x=&quot;320&quot; y=&quot;90&quot; width=&quot;270&quot; height=&quot;92&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Insolvent&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;the state first negotiates a debt&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;restructuring plan with its&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;private creditors&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p class=&quot;out&quot; id=&quot;esmTxt&quot;&gt;Choose a branch to read the explanation.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The ESM was inaugurated on 8 October 2012. While the EFSF was still managing the programmes for Ireland, Portugal and Greece, the combined EFSF+ESM ceiling was €700 billion. In April 2014 the ESM reached its full capacity of €500 billion, with €80 billion of paid-in capital. The slides say &quot;from 2011&quot;, referring to the political decision: the operational start date is 2012. &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France, crisis management mechanisms&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;cmp&quot;&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;EFSM&lt;/th&gt;&lt;th&gt;EFSF&lt;/th&gt;&lt;th&gt;ESM&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Nature&lt;/b&gt;&lt;/td&gt;&lt;td&gt;temporary, whole EU (EU budget)&lt;/td&gt;&lt;td&gt;temporary, euro area only&lt;/td&gt;&lt;td&gt;&lt;b&gt;permanent&lt;/b&gt;, euro area, intergovernmental&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Who borrows&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the Commission, on behalf of the Union&lt;/td&gt;&lt;td&gt;the EFSF vehicle&lt;/td&gt;&lt;td&gt;the ESM&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Who guarantees&lt;/b&gt;&lt;/td&gt;&lt;td&gt;EU budget (implicitly)&lt;/td&gt;&lt;td&gt;euro-area states, pro rata to ECB capital key&lt;/td&gt;&lt;td&gt;member states (contributions and guarantees)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Capacity&lt;/b&gt;&lt;/td&gt;&lt;td&gt;€60 bn&lt;/td&gt;&lt;td&gt;€440 bn&lt;/td&gt;&lt;td&gt;€500 bn&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Created&lt;/b&gt;&lt;/td&gt;&lt;td&gt;10 May 2010&lt;/td&gt;&lt;td&gt;9 May 2010&lt;/td&gt;&lt;td&gt;decided Mar 2011, operational 2012&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Conditions&lt;/b&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;request by the state + macroeconomic adjustment programme with &lt;b&gt;strict conditionality&lt;/b&gt;, agreed with the Commission in liaison with the ECB&lt;/td&gt;&lt;td&gt;strict conditionality + solvency analysis&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Today&lt;/b&gt;&lt;/td&gt;&lt;td&gt;available, not used&lt;/td&gt;&lt;td&gt;replaced by the ESM&lt;/td&gt;&lt;td&gt;the fund that lends to countries in difficulty&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Lending capacity compared&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;text x=&quot;80&quot; y=&quot;34&quot; text-anchor=&quot;end&quot;&gt;EFSM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;20&quot; width=&quot;56&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;35&quot; class=&quot;fm&quot;&gt;€60 bn&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;74&quot; text-anchor=&quot;end&quot;&gt;EFSF&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;60&quot; width=&quot;411&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick);opacity:.75&quot;/&gt;&lt;text x=&quot;507&quot; y=&quot;75&quot; class=&quot;fm&quot;&gt;€440 bn&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;114&quot; text-anchor=&quot;end&quot;&gt;ESM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;100&quot; width=&quot;467&quot; height=&quot;20&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick);opacity:.55&quot;/&gt;&lt;text x=&quot;562&quot; y=&quot;115&quot; class=&quot;fm&quot;&gt;€500&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;90&quot; y=&quot;144&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;lending capacity (slides 26-28)&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Activation of the EFSM and EFSF: only after a &lt;b&gt;request for assistance&lt;/b&gt; by the state and a &lt;b&gt;macroeconomic adjustment programme&lt;/b&gt; with strict conditionality agreed with the Commission, in liaison with the ECB. &lt;span class=&quot;sl&quot;&gt;slide 27&lt;/span&gt; For the ESM, &lt;dfn&gt;preferential creditor status&lt;/dfn&gt; means that, if problems arise, the ESM is repaid before private creditors: only the IMF ranks ahead of it. &lt;span class=&quot;sl&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The legal bases &lt;span class=&quot;sl&quot;&gt;slides 29-30&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Art. 122(2) TFEU&lt;/h4&gt;&lt;p&gt;&quot;Where a Member State is in difficulty or is seriously threatened with severe difficulties caused by natural disasters or &lt;u&gt;exceptional circumstances beyond its control&lt;/u&gt;, the Council, on a proposal from the Commission, may grant […] Union financial assistance […]&quot;. The basis for Union assistance in exceptional circumstances; the slides present it as the legal basis of the ESM.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Art. 136(3) TFEU (added)&lt;/h4&gt;&lt;p&gt;&quot;Member States whose currency is the euro may establish a stability mechanism to be activated if indispensable to &lt;b&gt;safeguard the stability of the euro area as a whole&lt;/b&gt;. The granting of any required financial assistance under the mechanism will be made subject to &lt;b&gt;strict conditionality&lt;/b&gt;.&quot;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The amendment is European Council Decision 2011/199/EU of 25 March 2011, adopted under the simplified revision procedure (Art. 48(6) TEU) and published in OJ L 91 of 6 April 2011. Recital 6 specifies that the amendment does not increase the competences conferred on the Union. &lt;a href=&quot;https://www.legislation.gov.uk/eudn/2011/199/contents&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of Decision 2011/199/EU&lt;/a&gt; (archive of the EUR-Lex text). In the legal sources, Art. 122(2) is the basis of the EFSM regulation, whereas the ESM is a treaty among euro-area states made compatible by Art. 136(3).&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;A note on the ESM: it is intergovernmental.&lt;/b&gt; The amended Art. 136 authorises the states to set up the mechanism on an &lt;b&gt;entirely intergovernmental&lt;/b&gt; basis (an agreement between governments, outside the Community method). The Commission and the European Parliament have no power of proposal or consultation, and there is no direct involvement of the EU budget: assistance relies on contributions from the states. &lt;span class=&quot;sl&quot;&gt;slide 31&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which temporary instruments did the EU create in 2010 to manage the crisis?&lt;/summary&gt;&lt;div&gt;The EFSF (9 May 2010, up to €440 bn, guaranteed by euro-area states) and the EFSM (10 May 2010, up to €60 bn, the Commission borrows with an implicit guarantee from the EU budget). Before that, there had been bilateral loans to Greece alongside the IMF.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the difference between directly funded loans and guaranteed loans?&lt;/summary&gt;&lt;div&gt;In the former, governments give cash to the crisis country up front. In the latter, governments provide guarantees, and a common vehicle raises funds on the market and lends them only if needed.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What happens if the ESM analysis finds a country insolvent?&lt;/summary&gt;&lt;div&gt;The country must first negotiate a debt restructuring plan with its private creditors. If it is solvent, by contrast, private creditors are encouraged to maintain their exposure and the ESM steps in as a preferred creditor, second only to the IMF.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is the ESM described as intergovernmental?&lt;/summary&gt;&lt;div&gt;Because it arises from an agreement among euro-area states, authorised by Art. 136(3). The Commission and Parliament have no power of proposal or consultation, and the resources come from the states, not from the EU budget.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S10 ============ --&gt;
&lt;section id=&quot;s10&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 10 · After the crisis&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;The Commission on the markets, and the other reforms&lt;/h2&gt;
&lt;p&gt;The EFSM is an example of the European Commission borrowing on international capital markets &lt;b&gt;on behalf of the Union&lt;/b&gt;. It can do so because the Treaties allow it, and the issuances are denominated only in euros. &lt;span class=&quot;sl&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;NextGenerationEU&lt;/h4&gt;&lt;p&gt;The largest programme: up to about &lt;b&gt;€850 billion&lt;/b&gt; (figure from the slide), roughly &lt;b&gt;5% of EU GDP&lt;/b&gt;. It is financed through bonds issued on the markets, about &lt;b&gt;30%&lt;/b&gt; of them &lt;dfn&gt;green bonds&lt;/dfn&gt; (bonds whose proceeds finance only environmental expenditure).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;SURE&lt;/h4&gt;&lt;p&gt;Up to &lt;b&gt;€100 billion&lt;/b&gt; to support employment and keep people in work (short-time work schemes during the pandemic). It is financed entirely through &lt;dfn&gt;social bonds&lt;/dfn&gt; (bonds with a social purpose).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Size of the Commission&#x27;s borrowing programmes&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;&lt;text x=&quot;80&quot; y=&quot;30&quot; text-anchor=&quot;end&quot;&gt;EFSM&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;17&quot; width=&quot;31&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;127&quot; y=&quot;31&quot; class=&quot;fm&quot;&gt;60&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;62&quot; text-anchor=&quot;end&quot;&gt;SURE&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;49&quot; width=&quot;52&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;148&quot; y=&quot;63&quot; class=&quot;fm&quot;&gt;100&lt;/text&gt;
&lt;text x=&quot;80&quot; y=&quot;94&quot; text-anchor=&quot;end&quot;&gt;NGEU&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;81&quot; width=&quot;440&quot; height=&quot;18&quot; rx=&quot;4&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;536&quot; y=&quot;95&quot; class=&quot;fm&quot;&gt;≈850&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;90&quot; y=&quot;116&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;€ billion (slides 26 and 32)&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;From the EFSM of the 2010 crisis to NGEU, the Commission&#x27;s borrowing capacity has grown by more than an order of magnitude.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The Commission issued €98.4 billion of SURE social bonds between October 2020 and December 2022. The first NGEU green bond (October 2021) amounted to €12 billion, the largest green issuance ever at the time. Issuance now follows a unified funding approach with long-term EU-Bonds and short-term EU-Bills. &lt;a href=&quot;https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations/funding-instruments_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission, Funding instruments&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Other innovations born of the crisis &lt;span class=&quot;sl&quot;&gt;slide 32&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;Stricter fiscal rules&lt;/h4&gt;&lt;p&gt;Amendments to the Stability and Growth Pact (SGP) to strengthen prevention.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;Unconventional monetary policy&lt;/h4&gt;&lt;p&gt;New ECB instruments (asset purchases, longer-term operations…). The slides refer to the upcoming lectures on ECB monetary policy.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small muted&quot;&gt;Note: it was not possible to list the contents of the &lt;code&gt;corso/&lt;/code&gt; folder in this session, so the other course files were not consulted. The references to the ECB lectures come from the slides themselves (slides 13, 17, 19).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;In what way does the EFSM anticipate NGEU and SURE?&lt;/summary&gt;&lt;div&gt;In all three cases the Commission borrows on the markets in euros on behalf of the Union and uses the funds for loans (EFSM, SURE) or to finance programmes (NGEU). What changes is the scale: €60 bn versus €100 bn and about €850 bn.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What are the two &quot;other&quot; reforms mentioned in the slides?&lt;/summary&gt;&lt;div&gt;Stricter fiscal rules (amendments to the SGP) and new unconventional monetary policy instruments.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S11 ============ --&gt;
&lt;section id=&quot;s11&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Final review&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;?&lt;/span&gt;The course questions&lt;/h2&gt;
&lt;p&gt;The six questions from slide 33, with an outline answer. Try answering aloud before opening each one. &lt;span class=&quot;sl&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. What is TARGET2 and what does it record?&lt;/summary&gt;&lt;div&gt;It is the Eurosystem&#x27;s real-time gross settlement system (&lt;span class=&quot;en&quot;&gt;Trans-European Automated Real-time Gross settlement Express Transfer&lt;/span&gt;), through which banks and central banks settle payments in euros, including across countries. Net flows between countries are booked on the NCBs&#x27; balance sheets and, cumulated, form the TARGET2 balances: negative for those that send more than they receive, positive for those that receive more. They record net cross-border payments for goods, services, interest and capital, and in practice everything banks cannot settle with their own funds. They therefore reflect the cross-country distribution of ECB liquidity. → &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Why did TARGET2 record growing imbalances from 2008-09? In which direction?&lt;/summary&gt;&lt;div&gt;With the financial crisis (August 2007), then the debt crisis (May 2010) and contagion to Italy and Spain (summer 2011), private capital fled from the periphery (GR, IE, PT, later ES, IT) to the core (DE, NL). The interbank market froze owing to mistrust and lack of collateral, so the reserves accumulated by core banks no longer flowed back to the periphery. Peripheral banks refinanced themselves with the Eurosystem. Result: TARGET2 liabilities in the periphery and TARGET2 claims in the core (Germany about +€700 bn in mid-2012). → &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. Which temporary instruments did the EU introduce to rescue Greece?&lt;/summary&gt;&lt;div&gt;Initially (May 2010), coordinated bilateral loans from euro-area countries alongside the IMF loan, with conditionality monitored by the Troika. Then the common framework of the Ecofin of 9-10 May 2010: the EFSF (up to €440 bn, guarantees from euro-area states) and the EFSM (up to €60 bn, the Commission borrows with an implicit guarantee from the EU budget). The shift is from directly funded loans to guaranteed loans. From 2012 the permanent ESM replaces the EFSF. → &lt;a href=&quot;#s9&quot;&gt;Part 9&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;4. Before the crisis, how did the EZ&#x27;s design induce sound budgets?&lt;/summary&gt;&lt;div&gt;Through the fiscal surveillance of the Stability and Growth Pact and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause (Art. 125 TFEU), reinforced by the fact that the ECB does not act as lender of last resort to sovereigns. The idea was market discipline: without bailouts, markets demand higher spreads from those who overspend. There was, however, no crisis management at all. → &lt;a href=&quot;#s7&quot;&gt;Part 7&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;5. Why did the Eurosystem &quot;replace&quot; private capital during the crisis?&lt;/summary&gt;&lt;div&gt;Because in the euro, cross-border payments are settled in central bank money. When private investors withdrew funds and the interbank market was frozen, banks in the countries experiencing outflows covered their liquidity needs by borrowing more from the ECB (MROs, LTROs, marginal lending), while German banks borrowed less (from €250 bn to €130 bn). Official financing (Eurosystem plus programmes) thus offset the reversal of private inflows: fully in Greece and Portugal, and through the Eurosystem alone in Spain and Italy. → &lt;a href=&quot;#s6&quot;&gt;Part 6&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;6. Was Eurosystem liquidity sufficient for all the affected countries?&lt;/summary&gt;&lt;div&gt;No. The Eurosystem does not finance balance-of-payments deficits without limit: it lends to banks through standard operations, against adequate collateral. It supported the banks, but it could not replace sovereigns&#x27; market access, because the ECB is not a lender of last resort to governments and Art. 125 prohibits bailouts. Greece, Portugal and Ireland needed EU/IMF programmes and then the EFSF/EFSM/ESM. Tensions in sovereign bond markets also required unconventional instruments such as the SMP. → &lt;a href=&quot;#s6&quot;&gt;Part 6&lt;/a&gt;, &lt;a href=&quot;#s9&quot;&gt;Part 9&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;!-- ============ S12 ============ --&gt;
&lt;section id=&quot;s12&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Sources cited in the slides&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;Further reading&lt;/h2&gt;
&lt;p&gt;All the entries below are &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;: descriptions and links found through a web search of institutional websites, publishers and academic archives. They do not come from the slides, except for the indication of the slide on which each source is cited.&lt;/p&gt;
&lt;ol class=&quot;refs&quot;&gt;
&lt;li&gt;&lt;h4&gt;Corsetti, Erce &amp;amp; Uy (2017), &quot;Official Sector Lending Strategies During the Euro Area Crisis&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Cambridge-INET Working Paper 2017/12 (also ADEMU WP 2017/070). Later published in &lt;i&gt;The Review of International Organizations&lt;/i&gt;, vol. 15, 2020. Cited on slide 1.&lt;/p&gt;
&lt;p&gt;Examines how euro-area official lenders moved from the IMF&#x27;s approach to a framework of their own. Using an event-study analysis, it tests how loan maturities and spreads affected yields, liquidity and market access. It finds that longer and cheaper European loans are associated with better market access, and proposes orienting DSAs and programmes towards cash-flow management. &lt;b&gt;Why it matters:&lt;/b&gt; it underpins the section on programmes, the Troika and the EFSF/ESM.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.janeway.econ.cam.ac.uk/publication/504&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge entry (Janeway Institute)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Pisani-Ferry, Sapir &amp;amp; Wolff (2013), &quot;EU-IMF assistance to euro-area countries: an early assessment&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Bruegel Blueprint no. 19, May 2013. Cited on slide 1.&lt;/p&gt;
&lt;p&gt;An independent, non-commissioned assessment of the Troika programmes in Greece, Ireland and Portugal: their economic impact and the consequences of the institutional set-up (EU-IMF cooperation). It is &quot;early&quot; because all three countries were still under a programme when it was written. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reference for understanding the strengths and limits of the first response (Parts 8-9).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://bruegel.org/book/eu-imf-assistance-euro-area-countries-early-assessment&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bruegel&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Merler &amp;amp; Pisani-Ferry (2012), &quot;Sudden stops in the euro area&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Bruegel Policy Contribution 2012/06, 29 March 2012. Also in &lt;i&gt;Review of Economics and Institutions&lt;/i&gt; 3(3), 2012. Cited on slides 1 and 13-15.&lt;/p&gt;
&lt;p&gt;Shows that the reversals of private capital in Greece, Ireland, Italy, Portugal and Spain are genuine sudden stops, concentrated in three episodes (the global financial crisis, after the Greek programme, summer 2011), a sign of contagion. Official funds, above all ECB refinancing of weak banks, partly replaced private ones. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the reading of TARGET2 and of the flow decomposition in Parts 5-6.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bruegel.org/policy-contribution/sudden-stops-euro-area&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bruegel&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Cecioni &amp;amp; Ferrero (2012), &quot;Determinants of TARGET2 imbalances&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Banca d&#x27;Italia, Questioni di Economia e Finanza (Occasional Papers) no. 136, September 2012. Source of the charts on slide 11.&lt;/p&gt;
&lt;p&gt;Links TARGET2 balances since 2007 to Eurosystem liquidity and to the balances of payments of Greece, Portugal, Italy and Spain. TARGET2 financed the Greek current account deficit, while in the other countries it mainly replaced private outflows from securities and the interbank market. &lt;b&gt;Why it matters:&lt;/b&gt; it distinguishes &quot;financing the deficit&quot; from &quot;offsetting capital flight&quot;.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/qef/2012-0136/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca d&#x27;Italia&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Abad, Löffler, Schnabl &amp;amp; Zemanek (2013), &quot;Fiscal Divergence, Current Account Divergence and TARGET2 Imbalances in the EMU&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;&lt;i&gt;Intereconomics&lt;/i&gt; 48(1), pp. 51-58, January/February 2013. Source of the Germany-GIIPS chart on slide 6.&lt;/p&gt;
&lt;p&gt;Attributes intra-euro current account imbalances to divergent fiscal policies, housing booms and diverging ULCs, fuelled by low interest rates. Argues that the growth of TARGET2 balances delayed adjustment. &lt;b&gt;Why it matters:&lt;/b&gt; it offers a critical reading of TARGET2, complementary to that of Merler and Pisani-Ferry.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://archive.intereconomics.eu/year/2013/1/fiscal-divergence-current-account-divergence-and-target2-imbalances-in-the-emu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intereconomics (archive)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Deutsche Bundesbank (2011b), Monthly Report March 2011, &quot;The dynamics of the Bundesbank&#x27;s TARGET2 balance&quot;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Cited on slide 14 (refinancing of German banks from €250 bn to €130 bn).&lt;/p&gt;
&lt;p&gt;Explains that the Bundesbank&#x27;s TARGET2 claims have grown systematically since 2007 (€325.5 bn at the end of 2010) and links them to the change in how euro-area banks obtain refinancing. &lt;b&gt;Why it matters:&lt;/b&gt; it shows, from the German side, the symmetry described on slide 14.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.bundesbank.de/en/publications/reports/monthly-reports/monthly-report-march-2011-707108&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bundesbank&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;ECB: TARGET balances and competitiveness indicators&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Source of the charts on slides 5 and 8-9.&lt;/p&gt;
&lt;p&gt;The ECB&#x27;s explainer on what TARGET balances are, with monthly data, and the page on the &lt;i&gt;harmonised competitiveness indicators&lt;/i&gt;: real exchange rates deflated by consumer prices, the GDP deflator and ULCs, where an increase signals a loss of competitiveness. &lt;b&gt;Why it matters:&lt;/b&gt; these are the original data for updating the lecture&#x27;s charts.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/target2_balances.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, What are TARGET balances?&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/stats/exchange/hci/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, Harmonised competitiveness indicators&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Art. 125 TFEU (no bailout clause)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Provision cited on slides 20-21 and 23.&lt;/p&gt;
&lt;p&gt;Official consolidated text on EUR-Lex. &lt;b&gt;Why it matters:&lt;/b&gt; it is the rule the first rescue had to &quot;get around&quot;. The Court of Justice later clarified that it does not prohibit assistance through the ESM, provided it is subject to strict conditionality.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, Art. 125 TFEU&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Decision 2011/199/EU (amendment of Art. 136 TFEU)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Provision cited on slides 30-31.&lt;/p&gt;
&lt;p&gt;Adds paragraph 3 to Art. 136, allowing euro-area states to establish a stability mechanism, through the simplified procedure (Art. 48(6) TEU) and without extending EU competences. &lt;b&gt;Why it matters:&lt;/b&gt; it is the legal basis of the ESM.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.legislation.gov.uk/eudn/2011/199/contents&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text of the decision (legislation.gov.uk archive)&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;EFSM: Regulation (EU) No 407/2010&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Instrument described on slides 25-27 and 32.&lt;/p&gt;
&lt;p&gt;Official summary of the regulation establishing the European financial stabilisation mechanism: the Commission borrows on behalf of the EU and on-lends to a state in difficulty owing to events beyond its control. &lt;b&gt;Why it matters:&lt;/b&gt; it is the first example of common borrowing &quot;in a crisis&quot;.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/european-financial-stabilisation-mechanism.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, summary&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;EFSF and ESM&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Instruments described on slides 25-31.&lt;/p&gt;
&lt;p&gt;ESM press releases on the creation and amendments of the EFSF (guarantees, €440 bn capacity) and the Banque de France page on crisis management mechanisms (EFSM, EFSF, ESM, amounts actually lent). &lt;b&gt;Why it matters:&lt;/b&gt; official figures and dates to check against the slides.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.esm.europa.eu/press-releases/efsf-becomes-fully-operational-0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ESM, EFSF fully operational&lt;/a&gt; · &lt;a href=&quot;https://banque-france.fr/en/banque-de-france/strong-transparent-governance/european-ecosystem/crisis-management-mechanisms&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IMF: the 2010 programme for Greece and the 2016 reform&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Events cited on slides 2 and 24.&lt;/p&gt;
&lt;p&gt;The press release on the approval of the roughly €30 bn &lt;i&gt;Stand-By Arrangement&lt;/i&gt; (9 May 2010) and the 2016 paper in which the IMF revises its exceptional access policy and eliminates the &lt;i&gt;systemic exemption&lt;/i&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it shows the waiver and its removal from inside the IMF.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.imf.org/external/np/sec/pr/2010/pr10187.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, PR 10/187&lt;/a&gt; · &lt;a href=&quot;https://www.imf.org/en/Publications/Policy-Papers/Issues/2016/12/31/The-Fund-s-Lending-Framework-and-Sovereign-Debt-Further-Considerations-PP5015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, 2016 policy paper&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;NextGenerationEU green bonds and SURE social bonds&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Programmes cited (with links) on slide 32.&lt;/p&gt;
&lt;p&gt;The Commission&#x27;s &quot;EU as a borrower&quot; page on funding instruments: EU-Bonds, EU-Bills, NGEU green bonds (up to 30% of NGEU) and SURE social bonds. &lt;b&gt;Why it matters:&lt;/b&gt; it shows how common borrowing has evolved from the EFSM into a permanent function of the EU budget.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations/funding-instruments_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission, Funding instruments&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/section&gt;
&lt;/main&gt;
