&lt;h1&gt;The European sovereign debt crisis and its resolution framework&lt;/h1&gt;
&lt;p class=&quot;muted&quot;&gt;&lt;span class=&quot;en&quot;&gt;The European sovereign debt crisis and its resolution framework&lt;/span&gt;. The slides draw on Corsetti, Erce &amp;amp; Uy (2017), Pisani-Ferry, Sapir &amp;amp; Wolff (2013) and Merler &amp;amp; Pisani-Ferry (2012). &lt;span class=&quot;sl&quot;&gt;slide 1&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;lead&quot;&gt;In 2010 Greece became the first European country in decades to request assistance from the International Monetary Fund. To understand why, and why the euro area lacked the tools to respond, the lecture sets out three things: what kind of crisis it was, how capital flight works within a single currency (TARGET2), and which institutions were built on the fly: from bilateral loans to the EFSF and EFSM, and eventually the ESM.&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;The core idea: within the euro, a country cannot run out of foreign-currency reserves, because the Eurosystem provides liquidity to banks. The weak point is &lt;b&gt;private capital&lt;/b&gt;, which can leave abruptly (&lt;span class=&quot;en&quot;&gt;sudden stop&lt;/span&gt;). In addition, banks and the sovereign are tightly intertwined, and in 2010 there was no crisis-management mechanism whatsoever.&lt;/div&gt;
&lt;/header&gt;

&lt;a href=&quot;#s7&quot; class=&quot;mn slate&quot;&gt;&lt;rect x=&quot;660&quot; y=&quot;120&quot; width=&quot;220&quot; height=&quot;58&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;k&quot; x=&quot;676&quot; y=&quot;142&quot;&gt;07 · RULES&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;676&quot; y=&quot;164&quot;&gt;Greek crisis and Art. 125&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s8&quot; class=&quot;mn slate&quot;&gt;&lt;rect x=&quot;660&quot; y=&quot;230&quot; width=&quot;220&quot; height=&quot;58&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;k&quot; x=&quot;676&quot; y=&quot;252&quot;&gt;08 · FIRST RESPONSE&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;676&quot; y=&quot;274&quot;&gt;Troika, conditionality, IMF&lt;/text&gt;&lt;/a&gt;

&lt;a href=&quot;#s10&quot; class=&quot;mn brick&quot;&gt;&lt;rect x=&quot;660&quot; y=&quot;430&quot; width=&quot;220&quot; height=&quot;58&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;k&quot; x=&quot;676&quot; y=&quot;452&quot;&gt;10 · AFTERWARDS&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;676&quot; y=&quot;474&quot;&gt;EU debt and other reforms&lt;/text&gt;&lt;/a&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;/section&gt;

&lt;!-- ============ S1 ============ --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part accent&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 1 · The starting point&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;April 2010: Greece knocks on the IMF&#x27;s door&lt;/h2&gt;
&lt;p&gt;On &lt;b&gt;23 April 2010&lt;/b&gt; Greece requested official assistance from the &lt;dfn&gt;International Monetary Fund&lt;/dfn&gt; (IMF: an institution that lends to countries facing balance-of-payments difficulties in exchange for an adjustment programme). It was the first European country to do so in about 40 years: the IMF works mainly with emerging economies. &lt;span class=&quot;sl&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The first assistance programme, in &lt;b&gt;May 2010&lt;/b&gt;, consisted of an IMF loan and a set of &lt;b&gt;bilateral loans&lt;/b&gt; from European governments. &lt;b&gt;It was not a common European loan&lt;/b&gt;: the euro area (EZ) had no infrastructure for one. &lt;span class=&quot;sl&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to the IMF, the package totalled €110 billion: about €30 billion from the IMF under a three-year &lt;span class=&quot;en&quot;&gt;Stand-By Arrangement&lt;/span&gt; approved on 9 May 2010, plus €80 billion in coordinated bilateral loans from euro-area countries. The access granted exceeded 3,200% of Greece&#x27;s quota, i.e. far beyond the normal limits (see Part 8). &lt;a href=&quot;https://www.imf.org/external/np/sec/pr/2010/pr10187.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, Press Release 10/187&lt;/a&gt;&lt;/div&gt;
&lt;p&gt;The question that opens the lecture is: &lt;b&gt;what kind of crisis was Greece facing?&lt;/b&gt; Answering it requires the categories of Part 2.&lt;/p&gt;

&lt;h3&gt;Interactive timeline&lt;/h3&gt;
&lt;p class=&quot;small muted&quot;&gt;Tap a point on the timeline or use the arrows.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;tl&quot; viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Timeline 2007-2016&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;stepbox tlbox&quot;&gt;&lt;div class=&quot;lbl&quot; id=&quot;tlD&quot;&gt;&lt;/div&gt;&lt;div id=&quot;tlT&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;tlP&quot;&gt;←&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;tlN&quot;&gt;→&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why was the first assistance to Greece not a common European loan?&lt;/summary&gt;&lt;div&gt;Because the euro area had no crisis-management instrument: there were only rules to prevent crises (the Stability and Growth Pact and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause). It therefore turned to the IMF and to bilateral loans from individual governments.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why was IMF involvement newsworthy?&lt;/summary&gt;&lt;div&gt;The IMF works mainly with emerging economies. No European country, let alone a member of a monetary union, had asked it for help in about 40 years.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S2 ============ --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 2 · Diagnosis&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;Three types of financial crisis&lt;/h2&gt;
&lt;p&gt;Three types of crisis are usually distinguished. The euro area in 2010 displayed elements of &lt;b&gt;all three&lt;/b&gt;, intertwined with one another. &lt;span class=&quot;sl&quot;&gt;slides 3-4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Balance of payments&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Banking&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Sovereign debt&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Balance-of-payment (BOP) crisis&lt;/b&gt;: a country can no longer meet its international financial obligations because of a &lt;dfn&gt;sudden stop&lt;/dfn&gt; in net capital inflows, caused by a shock or by a &lt;dfn&gt;fundamental disequilibrium&lt;/dfn&gt;, i.e. an underlying imbalance such as an external deficit that has persisted for too long.&lt;/div&gt;
&lt;p&gt;It is a potential threat for most countries. The &lt;dfn&gt;balance of payments&lt;/dfn&gt; records all transactions with the rest of the world. If a country spends more abroad than it earns (a &lt;dfn&gt;current account&lt;/dfn&gt; deficit, covering trade, income and transfers), it must cover the gap with capital inflows. If these stop, it has to draw on its reserves.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;current account balance + net capital inflows = Δ official reserves&lt;small&gt;Simplified accounting identity (textbook, not in the slides): with a current account deficit and zero inflows, reserves can only fall.&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Banking crisis&lt;/b&gt;: many banks become insolvent or run out of liquidity at the same time.&lt;/div&gt;
&lt;p&gt;Normally the state (the &lt;span class=&quot;en&quot;&gt;sovereign&lt;/span&gt;) steps in: it recapitalises the banks, guarantees deposits and acts as a &lt;dfn&gt;backstop&lt;/dfn&gt; (safety net of last resort). Only later was it understood that the &lt;b&gt;close links between banks and sovereigns&lt;/b&gt;, the &lt;dfn&gt;doom loop&lt;/dfn&gt; (also called the &lt;span class=&quot;en&quot;&gt;sovereign-bank nexus&lt;/span&gt;), could hit the euro area hard. &lt;span class=&quot;sl&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sovereign debt crisis&lt;/b&gt;: the state can no longer borrow on the market at sustainable rates, or cannot repay.&lt;/div&gt;
&lt;p&gt;It can occur under any policy regime, &lt;b&gt;but&lt;/b&gt; the most vulnerable are:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;sovereigns that borrow in &lt;b&gt;foreign currency&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;members of a &lt;b&gt;monetary union&lt;/b&gt;, which have given up &lt;dfn&gt;debt monetisation&lt;/dfn&gt; (the national central bank printing money to buy government bonds). Member states lack a &lt;dfn&gt;lender of last resort&lt;/dfn&gt; ready to intervene without limit.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;In practice, for a euro-area state, euro-denominated debt resembles foreign-currency debt: it is denominated in a currency the state does not control. &lt;span class=&quot;sl&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The situation in the euro area &lt;span class=&quot;sl&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① BOP crisis symptoms&lt;/h4&gt;&lt;p&gt;In the early years of the euro some countries experienced a &lt;dfn&gt;consumption boom&lt;/dfn&gt;, real exchange rate appreciation and large current account deficits: the typical warning signs of a BOP crisis (Part 3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② Poorly diversified banks&lt;/h4&gt;&lt;p&gt;Bank assets are concentrated in the home country, so banks take on the default risk of private borrowers &lt;i&gt;and&lt;/i&gt; of their own sovereign. And they rely on the sovereign as a backstop.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ Interdependence&lt;/h4&gt;&lt;p&gt;The tight link between banks, firms and households, and the sovereign raises the risk perceived by markets, which stop financing &lt;b&gt;anyone resident in the country&lt;/b&gt;, sound or not: this is the doom loop.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;To prevent debt crises the EZ had strict fiscal surveillance (the rules of the &lt;dfn&gt;Stability and Growth Pact&lt;/dfn&gt;, SGP, which sets ceilings on deficits and debt) and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; rule. However, &lt;b&gt;there was no crisis-management system&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The doom loop, step by step&lt;/h3&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;doom&quot;&gt;
&lt;figure style=&quot;margin:0 0 10px&quot;&gt;&lt;svg id=&quot;doom&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Vicious circle between sovereign, banks and the economy&quot;&gt;
&lt;path id=&quot;d-sb&quot; class=&quot;edge&quot; d=&quot;M220 82 C150 110 120 160 118 206&quot;/&gt;
&lt;path id=&quot;d-bs&quot; class=&quot;edge&quot; d=&quot;M162 218 C190 160 225 120 252 96&quot;/&gt;
&lt;path id=&quot;d-be&quot; class=&quot;edge&quot; d=&quot;M178 248 L338 248&quot;/&gt;
&lt;path id=&quot;d-es&quot; class=&quot;edge&quot; d=&quot;M400 206 C398 160 360 110 300 82&quot;/&gt;
&lt;g&gt;&lt;rect x=&quot;200&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;52&quot; rx=&quot;12&quot; class=&quot;fcb sc&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Sovereign&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;rect x=&quot;40&quot; y=&quot;220&quot; width=&quot;130&quot; height=&quot;52&quot; rx=&quot;12&quot; class=&quot;fcb sc&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;252&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Banks&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;rect x=&quot;345&quot; y=&quot;220&quot; width=&quot;140&quot; height=&quot;52&quot; rx=&quot;12&quot; class=&quot;fcb sc&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;415&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Economy&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;firms and households&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;120&quot; y=&quot;140&quot; font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;end&quot;&gt;government bonds&lt;/text&gt;
&lt;text x=&quot;232&quot; y=&quot;160&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;bailouts&lt;/text&gt;
&lt;text x=&quot;258&quot; y=&quot;240&quot; font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;middle&quot;&gt;credit&lt;/text&gt;
&lt;text x=&quot;400&quot; y=&quot;140&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;tax revenue&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;The starting point&lt;/div&gt;The sovereign, banks and the real economy are linked in three directions. As long as all is well, the link goes unnoticed.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;1 · Exposure&lt;/div&gt;Banks hold large amounts of bonds issued by their &lt;b&gt;home sovereign&lt;/b&gt;: their assets are not internationally diversified.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;2 · The sovereign wobbles&lt;/div&gt;If markets doubt the sovereign, the price of its bonds falls. The banks holding them incur losses and their capital shrinks.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;3 · Credit crunch&lt;/div&gt;Weakened banks cut lending to firms and households and the economy slows. Even sound firms struggle to obtain financing simply because they are located in that country.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;4 · Public finances&lt;/div&gt;The recession reduces tax revenue and the deficit widens: the sovereign looks even less solvent.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;5 · The loop closes&lt;/div&gt;The sovereign is the banks&#x27; backstop: if it has to bail them out, its debt rises and its bonds lose further value, which weakens the banks even more. This is the &lt;b&gt;doom loop&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is a euro-area country more vulnerable to a debt crisis than a country with its own currency?&lt;/summary&gt;&lt;div&gt;Because it has given up debt monetisation: the national central bank cannot buy government bonds by printing money. At the level of individual states there is no &lt;span class=&quot;en&quot;&gt;lender of last resort&lt;/span&gt;, and euro-denominated debt behaves like foreign-currency debt.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the doom loop, in one sentence?&lt;/summary&gt;&lt;div&gt;The vicious circle in which the sovereign&#x27;s difficulties hit the banks that hold its bonds, and the banks&#x27; difficulties hit the sovereign that has to bail them out. The real economy amplifies the whole process through less credit and lower tax revenue.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Before the crisis, did the EZ have tools both to prevent crises and to manage them?&lt;/summary&gt;&lt;div&gt;Only to prevent them: fiscal surveillance (SGP) and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause. There was no crisis-management mechanism.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S3 ============ --&gt;
&lt;section id=&quot;s3&quot; class=&quot;part sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 3 · The background&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;Imbalances in the early years of the euro&lt;/h2&gt;
&lt;p&gt;The first of the three elements on slide 4 is the typical pattern preceding a BOP crisis: rapidly growing consumption, loss of competitiveness and large external deficits. &lt;span class=&quot;sl&quot;&gt;slides 4-6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Real exchange rate&lt;/b&gt;: the price of a country&#x27;s goods relative to those of its trading partners, expressed in a common currency. When it rises (&lt;dfn&gt;real exchange rate appreciation&lt;/dfn&gt;) domestic goods become relatively more expensive and the country loses competitiveness.&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;q = e · P / P*&lt;small&gt;e = nominal exchange rate (price of the domestic currency in foreign currency), P = domestic prices, P* = foreign prices. Within the euro, e is fixed at 1 between members: q can only move through relative prices or relative costs.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Unit labour cost&lt;/b&gt; (ULC): the labour cost per unit of output, i.e. how much it costs in wages to produce one unit of output.&lt;br&gt;ULC = compensation per employee ÷ productivity per employee. In growth rates: &lt;b&gt;%ΔULC ≈ %Δwages − %Δproductivity&lt;/b&gt;.&lt;/div&gt;
&lt;p&gt;The ECB chart on slide 5 shows ULC-based competitiveness indicators for Greece, Ireland, Italy, Portugal and Spain. Between 2000 and 2008-10 they all rise faster than the euro-area average: Ireland peaks near 140 in 2008, the others between 110 and 125. After 2010 they decline, and Ireland plunges to about 60 by 2022. &lt;span class=&quot;sl&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In the ECB&#x27;s &lt;span class=&quot;en&quot;&gt;harmonised competitiveness indicators&lt;/span&gt;, an increase in the index signals a &lt;b&gt;loss&lt;/b&gt; of price/cost competitiveness, a decrease a gain. &lt;a href=&quot;https://www.ecb.europa.eu/stats/exchange/hci/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, Harmonised competitiveness indicators&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Simulator: how much does a small annual gap matter?&lt;/h3&gt;
&lt;p class=&quot;small muted&quot;&gt;Illustrative example, not real data. Set annual ULC growth in a &quot;peripheral&quot; country and in Germany from 1999 to 2008, with a fixed nominal exchange rate.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Annual ULC growth, periphery: &lt;b id=&quot;ulcPv&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ulcP&quot; min=&quot;-1&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Annual ULC growth, Germany: &lt;b id=&quot;ulcDv&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ulcD&quot; min=&quot;-1&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;
&lt;figure style=&quot;margin:10px 0&quot;&gt;&lt;svg id=&quot;ulcSvg&quot; viewBox=&quot;0 0 520 240&quot; role=&quot;img&quot; aria-label=&quot;Simulated ULC indices&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;periphery&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--slate)&quot;&gt;&lt;/i&gt;Germany&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;ulcOut&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;Without a nominal exchange rate, the only way to regain lost competitiveness is an &lt;b&gt;internal devaluation&lt;/b&gt;: wages and prices growing more slowly than in partner countries, or falling, possibly combined with productivity gains. It is slow and painful, and it is one of the aims of the &lt;span class=&quot;en&quot;&gt;structural reforms&lt;/span&gt; required under the programmes (Part 8).&lt;/p&gt;

&lt;h3&gt;Current account deficits: who lends and who borrows &lt;span class=&quot;sl&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;svg id=&quot;caSvg&quot; viewBox=&quot;0 0 600 380&quot; role=&quot;img&quot; aria-label=&quot;Current account balance as a percentage of GDP, 2008 Q1&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Current account balance, % of GDP, 2008 Q1 (data from slide 6). Red = deficit, green = surplus.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;The IMF chart on slide 6 (published by Abad, Löffler, Schnabl and Zemanek in &lt;span class=&quot;en&quot;&gt;Intereconomics&lt;/span&gt;, 2013) shows the mirror image: from 2002 Germany&#x27;s surplus rises to about 250 billion dollars in 2007. The combined deficit of the &lt;b&gt;GIIPS&lt;/b&gt; (Greece, Ireland, Italy, Portugal, Spain) falls to about −320 billion in 2008, then climbs back towards −80 in 2012 as the deficits are forcibly corrected.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;CA = S − I = − (net capital inflows)&lt;small&gt;A current account deficit means the country invests more than it saves, and the gap is financed by foreign capital, here mainly from banks in the euro-area &quot;core&quot;. It is precisely this financing that can stop.&lt;/small&gt;&lt;/div&gt;
&lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Why did capital flow towards the periphery?&lt;/summary&gt;&lt;p&gt;With the euro, exchange rate risk disappears and interest rates converge towards German levels. In higher-inflation countries &lt;i&gt;real&lt;/i&gt; interest rates become very low, fuelling credit, housing booms and consumption. A single monetary policy cannot adapt to divergent national cycles. This is the issue of &lt;span class=&quot;en&quot;&gt;asymmetric shocks&lt;/span&gt; (shocks that affect countries differently) in &lt;span class=&quot;en&quot;&gt;optimum currency area&lt;/span&gt; theory. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The abstract of Abad et al. (2013) identifies divergent fiscal policies, housing booms and diverging ULCs, sustained by low interest rates, as the drivers of the imbalances. &lt;a href=&quot;https://archive.intereconomics.eu/year/2013/1/fiscal-divergence-current-account-divergence-and-target2-imbalances-in-the-emu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intereconomics 48(1), 2013&lt;/a&gt;&lt;/p&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;If wages in a country grow by 4% a year and productivity by 1%, what happens to ULC?&lt;/summary&gt;&lt;div&gt;It grows by about 3% a year (4 − 1). If it grows more slowly in partner countries, the real exchange rate appreciates and the country loses competitiveness.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which countries had the largest current account deficits in 2008 Q1, and which had surpluses?&lt;/summary&gt;&lt;div&gt;Deficits: Greece (−14.5%), Cyprus (−11.6%), Portugal (−10.3%), Spain (−9.9%), Ireland (−6.9%). Surpluses: Luxembourg (8.2%), Germany (6.8%), the Netherlands (6.3%), Finland and Austria (4.2%).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does a large current account deficit make a country vulnerable?&lt;/summary&gt;&lt;div&gt;Because it has to be financed every year by capital inflows from abroad. If lenders lose confidence and stop rolling over their loans (sudden stop), the country must correct the deficit abruptly or find other sources of funding.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S4 ============ --&gt;
&lt;section id=&quot;s4&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 4 · The mechanism&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;A &quot;normal&quot; balance-of-payments crisis&lt;/h2&gt;
&lt;p&gt;Before looking at what changes within the euro, it helps to follow the classic script, which concerns a country with its own currency and foreign-currency debt. &lt;span class=&quot;sl&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;bop&quot;&gt;
&lt;figure style=&quot;margin:0 0 8px&quot;&gt;&lt;svg viewBox=&quot;0 0 520 90&quot; role=&quot;img&quot; aria-label=&quot;Level of foreign-currency reserves&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;Central bank foreign-currency reserves&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;fk sr&quot; stroke-width=&quot;1&quot;/&gt;
&lt;rect id=&quot;resv&quot; x=&quot;0&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;26&quot; rx=&quot;6&quot; style=&quot;fill:var(--sage);transition:width .5s,fill .5s&quot;/&gt;
&lt;text id=&quot;resvt&quot; x=&quot;0&quot; y=&quot;80&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;
&lt;g transform=&quot;translate(300 18)&quot;&gt;&lt;text font-size=&quot;12&quot; class=&quot;fm&quot; y=&quot;0&quot;&gt;Foreign capital&lt;/text&gt;&lt;path id=&quot;flowA&quot; d=&quot;M0 26 H180&quot; stroke-width=&quot;6&quot; style=&quot;stroke:var(--ochre);transition:.4s&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text id=&quot;flowT&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 0 · The deficit is financed&lt;/div&gt;Foreign lenders and capital cover the country&#x27;s current account deficit. Then something changes (a shock, or the discovery of an imbalance): lenders lose confidence, stop rolling over loans and withdraw their money.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 1 · Lenders leave&lt;/div&gt;Loans are not renewed: &lt;dfn&gt;rollover&lt;/dfn&gt; (renewal at maturity) stops and money flows out of the country. Repayment requires &lt;b&gt;foreign currency&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 2 · Reserves are drawn down&lt;/div&gt;The central bank sells reserves to supply foreign currency. It can print &lt;b&gt;its own&lt;/b&gt; currency, but not dollars or euros.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 3 · Reserves run out&lt;/div&gt;No foreign currency is left to pay for imports and debt. There are three possible outcomes: &lt;b&gt;devaluation&lt;/b&gt; of the exchange rate, &lt;b&gt;default&lt;/b&gt; or &lt;dfn&gt;capital controls&lt;/dfn&gt; (administrative limits on capital movements).&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;key&quot;&gt;The underlying problem is a &lt;b&gt;hard constraint on foreign-currency liquidity&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 7&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;In the euro area, however, debts between member countries are in euros, and euro liquidity for banks is provided by the &lt;b&gt;Eurosystem&lt;/b&gt;. Step 2 does not occur: the &quot;reserves&quot; do not run out. The accounting tool that makes this visible is TARGET2. &lt;span class=&quot;sl&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why, in a classic BOP crisis, can&#x27;t the national central bank simply print money?&lt;/summary&gt;&lt;div&gt;Because the debts to be repaid and the imports to be paid for are in foreign currency. The central bank creates only its own currency, and once its dollar or euro reserves are exhausted it cannot offset the withdrawal of foreign loans.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What are the three typical outcomes when reserves run out?&lt;/summary&gt;&lt;div&gt;Devaluation (exchange rate depreciation), default on the debt, capital controls.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S5 ============ --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 5 · Eurosystem&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;TARGET2: the balance of payments financed by the Eurosystem&lt;/h2&gt;
&lt;p&gt;In a normal BOP crisis the national central bank cannot offset the withdrawal of foreign-currency loans. In the EZ, instead, liquidity is provided through the &lt;b&gt;TARGET2&lt;/b&gt; system. &lt;span class=&quot;sl&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;TARGET2&lt;/b&gt; = &lt;span class=&quot;en&quot;&gt;Trans-European Automated Real-time Gross settlement Express Transfer system&lt;/span&gt;. It is the Eurosystem&#x27;s payment system. &lt;span class=&quot;en&quot;&gt;Real-time gross settlement&lt;/span&gt; means that each payment is settled individually (gross, without netting) and immediately, in central bank money.&lt;/div&gt;
&lt;p&gt;The &lt;dfn&gt;Eurosystem&lt;/dfn&gt; comprises the ECB and the national central banks (NCBs) of the euro-area countries. The broader term &lt;dfn&gt;ESCB&lt;/dfn&gt;, &lt;span class=&quot;en&quot;&gt;European System of Central Banks&lt;/span&gt;, also includes the central banks of EU countries outside the euro. &lt;span class=&quot;sl&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it does&lt;/h4&gt;&lt;p&gt;It moves money from one bank to another, within a country and across countries. Central banks and commercial banks use it to settle payments in euros. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it records&lt;/h4&gt;&lt;p&gt;The net flow between two countries (received − sent) is booked on the balance sheets of the two NCBs. The accumulation of these flows over time constitutes the &lt;dfn&gt;TARGET2 balances&lt;/dfn&gt;. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sign of the balance&lt;/h4&gt;&lt;p&gt;If a country&#x27;s banks have &lt;b&gt;sent&lt;/b&gt; more than they received, the NCB has a &lt;b style=&quot;color:var(--brick)&quot;&gt;negative&lt;/b&gt; balance (a &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt;). If they have &lt;b&gt;received&lt;/b&gt; more, the balance is &lt;b style=&quot;color:var(--sage)&quot;&gt;positive&lt;/b&gt; (a &lt;span class=&quot;en&quot;&gt;claim&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Monetary policy&lt;/h4&gt;&lt;p&gt;All Eurosystem monetary policy operations also run through TARGET2. If central bank liquidity is unevenly distributed across countries, the balances reflect this. &lt;span class=&quot;sl&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to the ECB, bilateral balances are netted every day into a single position of each NCB vis-à-vis the ECB, and the balances are published monthly. The system is now called T2, and the ECB simply refers to &quot;TARGET balances&quot;. &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/target2_balances.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, &quot;What are TARGET balances?&quot;&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;How capital flight is recorded &lt;span class=&quot;sl&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;stepbox&quot; data-stepper=&quot;cf&quot;&gt;
&lt;figure style=&quot;margin:0 0 8px&quot;&gt;&lt;svg id=&quot;cfsvg&quot; viewBox=&quot;0 0 620 236&quot; role=&quot;img&quot; aria-label=&quot;Capital flight from Spain to Germany&quot;&gt;
&lt;text x=&quot;145&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; class=&quot;fm&quot;&gt;SPAIN&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; class=&quot;fm&quot;&gt;GERMANY&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;24&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Investor / depositor&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;24&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;German assets&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;94&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Spanish bank&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;94&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;German bank&lt;/text&gt;
&lt;rect x=&quot;40&quot; y=&quot;164&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;Banco de España&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;164&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;191&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;Bundesbank&lt;/text&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 46 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;purchase&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 116 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;payment&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--brick)&quot;&gt;reserves ↓ (refinances against collateral)&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--sage)&quot;&gt;reserves ↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;cfs&quot;&gt;&lt;path d=&quot;M252 186 H366&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;TARGET2&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--brick)&quot;&gt;TARGET2 liability&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--sage)&quot;&gt;TARGET2 claim&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 1 · Investors move their money&lt;/div&gt;An investor sells Spanish assets, or withdraws a deposit from a Spanish bank, and buys German assets.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 2 · Spanish bank and German bank&lt;/div&gt;The Spanish bank loses funds to pay the German bank: its reserve account at the Banco de España falls. It can borrow additional liquidity from the central bank by pledging &lt;dfn&gt;collateral&lt;/dfn&gt; (securities or loans accepted by the central bank as security). Meanwhile the German bank&#x27;s reserve account at the Bundesbank is credited.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Step 3 · The central banks settle&lt;/div&gt;The payment goes through TARGET2 between the two NCBs. The Banco de España accumulates a &lt;b&gt;TARGET2 liability&lt;/b&gt;, the Bundesbank a &lt;b&gt;TARGET2 claim&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Simulator: why balances stay small in normal times&lt;/h3&gt;
&lt;p&gt;In normal times a German bank with excess reserves would &lt;b&gt;lend them back&lt;/b&gt; to Spanish banks on the &lt;dfn&gt;interbank market&lt;/dfn&gt;, where banks lend reserves to one another, often &lt;span class=&quot;en&quot;&gt;overnight&lt;/span&gt;. This recycling sends the funds back to Spain without going through the central bank and keeps the TARGET2 imbalance small. During the crisis the interbank market largely seized up, because German banks no longer trusted Spanish ones. &lt;span class=&quot;sl&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Capital flight from Spain to Germany: &lt;b&gt;€&lt;span id=&quot;t2Fv&quot;&gt;&lt;/span&gt; bn&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;t2F&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;
&lt;label class=&quot;sl2&quot;&gt;Share recycled by German banks on the interbank market: &lt;b&gt;&lt;span id=&quot;t2rv&quot;&gt;&lt;/span&gt;%&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;t2r&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tacc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Banco de España&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;br&gt;loans to ES banks: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;br&gt;TARGET2 liability: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tacc slate&quot;&gt;&lt;div class=&quot;h&quot;&gt;Bundesbank&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;br&gt;TARGET2 claim: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;br&gt;DE bank reserves: +&lt;span class=&quot;t2v&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;t2Out&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;small muted&quot;&gt;Simplified scheme: the recycled part (€&lt;span id=&quot;t2rec&quot;&gt;&lt;/span&gt; bn) returns to Spain as a private interbank loan. Only the remainder is replaced by Eurosystem liquidity and shows up in the TARGET2 balances.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;What actually happened &lt;span class=&quot;sl&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Until July 2007 TARGET2 positions were balanced: cross-border payments flowed in both directions and offset each other. With the onset of the financial crisis (August 2007) flows became one-way, from the periphery (GRE, IRL, POR) to the core (GER, NET). The divergence grew with the sovereign debt crisis (May 2010) and even more from summer 2011, when the crisis spread to Italy and Spain.&lt;/p&gt;
&lt;div class=&quot;chips&quot; id=&quot;t2btns&quot;&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;t2chart&quot; viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot;TARGET2 balances 2001-2012&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Cumulative TARGET2 balances, € billion. &lt;b&gt;Indicative profiles reconstructed by eye&lt;/b&gt; from the Cecioni and Ferrero (2012) charts on slide 11, to show orders of magnitude and timing: these are not official data. Germany ≈ +700 in mid-2012, Spain ≈ −345, Italy ≈ −280.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;What TARGET2 records, and what it signals &lt;span class=&quot;sl&quot;&gt;slides 12-14&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It records…&lt;/h4&gt;&lt;p&gt;① &lt;b&gt;net&lt;/b&gt; cross-border payments settled through central banks; ② payments for goods, services and interest, &lt;b&gt;not only&lt;/b&gt; capital flows; ③ what private banks &lt;b&gt;could not settle&lt;/b&gt; with their own funds and liquidity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It signals…&lt;/h4&gt;&lt;p&gt;Stress in the financial system: banks in countries experiencing outflows (e.g. deposit flight) need liquidity but cannot obtain it on the interbank market (lack of high-quality collateral, loss of trust), so they rely more heavily on central bank liquidity (Merler and Pisani-Ferry, 2012).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;A symmetric movement.&lt;/b&gt; In Germany, central bank refinancing of German banks fell from &lt;b&gt;€250 billion&lt;/b&gt; in early 2007 to &lt;b&gt;€130 billion&lt;/b&gt; in 2010 (Deutsche Bundesbank, 2011b), while demand for ECB liquidity from banks in distressed countries rose sharply. TARGET2 balances should therefore be read as a &lt;b&gt;different cross-country distribution of refinancing operations&lt;/b&gt;, and as an adjustment mechanism that allows sound banks in stressed countries to cover their liquidity needs. &lt;span class=&quot;sl&quot;&gt;slide 14&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The Bundesbank&#x27;s March 2011 Monthly Report shows TARGET2 claims of €325.5 billion at the end of 2010 and dates the systematic increase from 2007. &lt;a href=&quot;https://www.bundesbank.de/en/publications/reports/monthly-reports/monthly-report-march-2011-707108&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bundesbank, Monthly Report March 2011&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;An Italian bank pays a Dutch bank via TARGET2. What happens to the two NCBs&#x27; balances?&lt;/summary&gt;&lt;div&gt;The Banca d&#x27;Italia records a negative change (larger liability towards the Eurosystem), De Nederlandsche Bank a positive one (larger claim). If the flow does not reverse, it accumulates in the balances.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why were TARGET2 balances close to zero before 2007?&lt;/summary&gt;&lt;div&gt;Because flows went in both directions and surplus banks lent their reserves back on the interbank market. This private recycling offset the imbalances.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does the TARGET2 balance measure only capital flight?&lt;/summary&gt;&lt;div&gt;No: it records all net payments settled through central banks, including those for goods, services and interest, i.e. what banks could not settle with their own resources. It also reflects the cross-country distribution of ECB liquidity.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S6 ============ --&gt;
&lt;section id=&quot;s6&quot; class=&quot;part ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 6 · 2008-2012&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;Sudden stop: private capital flees, official capital replaces it&lt;/h2&gt;
&lt;h3&gt;The role of cross-border capital flows &lt;span class=&quot;sl&quot;&gt;slide 16&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;In the EZ the Eurosystem covers, through TARGET2, financing gaps arising from trade deficits or net capital outflows: &lt;b&gt;the means to make cross-border payments never run out&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;However&lt;/b&gt;, private capital can be withdrawn, so a sudden stop can hit &lt;i&gt;market funding&lt;/i&gt;. The consequences:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;volatile &lt;dfn&gt;spread&lt;/dfn&gt;s (the spread is the yield difference between a sovereign&#x27;s bonds and a benchmark bond, usually the German Bund) and financial fragility;&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;fragmentation&lt;/dfn&gt;: the cross-border financial system breaks up along national borders, and the same credit conditions no longer apply throughout the area.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;This risk had been &lt;b&gt;underestimated&lt;/b&gt; in the EZ, even as intra-area current account imbalances built up.&lt;/p&gt;

&lt;h3&gt;How large the outflows were &lt;span class=&quot;sl&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;All five southern countries received large private capital inflows from 2002 to 2007-09, followed by net and rather abrupt outflows (Merler and Pisani-Ferry, 2012). Cumulated, as % of 2007 GDP:&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 200&quot; role=&quot;img&quot; aria-label=&quot;Private inflows and outflows as a percentage of 2007 GDP&quot;&gt;
&lt;line x1=&quot;130&quot; x2=&quot;130&quot; y1=&quot;10&quot; y2=&quot;190&quot; class=&quot;sm&quot;/&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;text x=&quot;122&quot; y=&quot;34&quot; text-anchor=&quot;end&quot;&gt;Greece&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;22&quot; width=&quot;160&quot; height=&quot;14&quot; rx=&quot;3&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;296&quot; y=&quot;34&quot; class=&quot;fm&quot;&gt;inflows ≈ 40%&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;38&quot; width=&quot;160&quot; height=&quot;10&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;296&quot; y=&quot;48&quot; class=&quot;fm&quot;&gt;outflows ≈ 40%&lt;/text&gt;
&lt;text x=&quot;122&quot; y=&quot;84&quot; text-anchor=&quot;end&quot;&gt;Ireland&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;72&quot; width=&quot;40&quot; height=&quot;14&quot; rx=&quot;3&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;176&quot; y=&quot;84&quot; class=&quot;fm&quot;&gt;limited inflows&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;88&quot; width=&quot;280&quot; height=&quot;10&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;416&quot; y=&quot;98&quot; class=&quot;fm&quot;&gt;outflows ≈ 70%&lt;/text&gt;
&lt;text x=&quot;122&quot; y=&quot;134&quot; text-anchor=&quot;end&quot;&gt;PT · ES · IT&lt;/text&gt;&lt;text x=&quot;138&quot; y=&quot;134&quot; class=&quot;fm&quot;&gt;smaller and later outflows, but still significant&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;130&quot; y=&quot;180&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;bars proportional to the figures cited on slide 15 (Irish inflows: only &quot;limited&quot;, no figure)&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;h3&gt;The gap left by private capital filled by official funds &lt;span class=&quot;sl&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Official support in the euro area took &lt;b&gt;three forms&lt;/b&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① Eurosystem liquidity&lt;/h4&gt;&lt;p&gt;Loans to banks through the &lt;dfn&gt;marginal lending facility&lt;/dfn&gt; (overnight lending on demand, at a penalty rate), &lt;dfn&gt;MRO&lt;/dfn&gt;s (&lt;span class=&quot;en&quot;&gt;Main Refinancing Operations&lt;/span&gt;, weekly refinancing tenders) and &lt;dfn&gt;LTRO&lt;/dfn&gt;s (&lt;span class=&quot;en&quot;&gt;Longer-Term Refinancing Operations&lt;/span&gt;, longer maturities). It shows up in TARGET balances.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② EU/IMF programmes&lt;/h4&gt;&lt;p&gt;Loans to sovereigns in exchange for conditionality (Parts 8-9).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ ECB bond purchases&lt;/h4&gt;&lt;p&gt;Purchases of sovereign bonds under the &lt;dfn&gt;SMP&lt;/dfn&gt; (&lt;span class=&quot;en&quot;&gt;Securities Markets Programme&lt;/span&gt;) and subsequent programmes: see the upcoming lectures on ECB monetary policy.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;total inflows (financial account) ≈ private inflows + Δ TARGET liabilities + programme disbursements&lt;small&gt;Merler and Pisani-Ferry decomposition: the three components are cumulated separately (2002-11/12) and compared with total inflows from official data.&lt;/small&gt;&lt;/div&gt;

&lt;h3&gt;Interactive decomposition &lt;span class=&quot;sl&quot;&gt;slide 18&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;chips&quot; id=&quot;dcBtns&quot;&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;dcSvg&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Decomposition of capital inflows&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--brick)&quot;&gt;&lt;/i&gt;private inflows&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sage)&quot;&gt;&lt;/i&gt;TARGET liabilities&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ochre)&quot;&gt;&lt;/i&gt;programme disbursements&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink);height:3px&quot;&gt;&lt;/i&gt;total inflows&lt;/span&gt;&lt;/div&gt;
&lt;figcaption&gt;% of 2007 GDP, cumulated since 2002. &lt;b&gt;Indicative values read by eye&lt;/b&gt; from the Bruegel figure on slide 18 (updated from Merler and Pisani-Ferry, 2012), only to illustrate the composition. No monthly data are available for Ireland.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p class=&quot;out&quot; id=&quot;dcTxt&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;key&quot;&gt;&lt;b&gt;However&lt;/b&gt;, the Eurosystem does &lt;b&gt;not&lt;/b&gt; finance balance-of-payments deficits without limit. ECB liquidity is provided within standard procedures (MROs, LTROs), against collateral and on set terms. When sums are needed that banks cannot cover, sovereign assistance programmes come into play. &lt;span class=&quot;sl&quot;&gt;slide 19&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Cecioni and Ferrero (Banca d&#x27;Italia, 2012) find that TARGET2 flows financed Greece&#x27;s current account deficit, whereas for Italy, Spain and Portugal there is no evidence to that effect. In all countries TARGET2 liquidity mainly replaced private outflows from the securities market and the interbank market. &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/qef/2012-0136/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca d&#x27;Italia, QEF no. 136&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why did the Eurosystem &quot;replace&quot; private capital during the crisis?&lt;/summary&gt;&lt;div&gt;Because when private investors withdrew funds from the periphery and the interbank market was frozen, banks in those countries covered their liquidity needs by borrowing more from the central bank (MROs, LTROs, marginal lending). Each private outflow was offset by more Eurosystem refinancing, which shows up as a TARGET2 liability.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How do Greece/Portugal and Spain/Italy differ in the decomposition?&lt;/summary&gt;&lt;div&gt;In Greece and Portugal the reversal of private inflows is complete and was offset by a mix of programme and Eurosystem funding. In Spain and Italy, which did not request a programme, the reversal (almost total in Spain, substantial in Italy) was offset entirely by the Eurosystem.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Was Eurosystem liquidity enough for all the affected countries?&lt;/summary&gt;&lt;div&gt;No: it is not unlimited financing of BOP deficits. It goes through standard operations, with collateral and rules. Sovereigns that had lost market access (Greece, Portugal, Ireland) needed EU/IMF programmes.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S7 ============ --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 7 · Rules&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;The Greek crisis and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause&lt;/h2&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;p&gt;In &lt;b&gt;2009&lt;/b&gt; the true size of the Greek government deficit came to light: &lt;b&gt;from 6.7% to 15.1% of GDP&lt;/b&gt;. The government&#x27;s capacity to service its debt proved lower than expected, triggering a &lt;b&gt;revision in the beliefs&lt;/b&gt; of creditors. &lt;span class=&quot;sl&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The euro area had no ready instrument to handle a collapse in market confidence.&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 300 200&quot; role=&quot;img&quot; aria-label=&quot;Greek 2009 deficit: initial and revised estimate&quot;&gt;
&lt;line x1=&quot;40&quot; x2=&quot;290&quot; y1=&quot;170&quot; y2=&quot;170&quot; class=&quot;sm&quot;/&gt;
&lt;rect x=&quot;70&quot; y=&quot;170&quot; width=&quot;70&quot; height=&quot;0&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate)&quot;&gt;&lt;animate attributeName=&quot;height&quot; to=&quot;60.3&quot; dur=&quot;.8s&quot; fill=&quot;freeze&quot;/&gt;&lt;animate attributeName=&quot;y&quot; to=&quot;109.7&quot; dur=&quot;.8s&quot; fill=&quot;freeze&quot;/&gt;&lt;/rect&gt;
&lt;rect x=&quot;180&quot; y=&quot;170&quot; width=&quot;70&quot; height=&quot;0&quot; rx=&quot;4&quot; style=&quot;fill:var(--brick)&quot;&gt;&lt;animate attributeName=&quot;height&quot; to=&quot;135.9&quot; dur=&quot;1.2s&quot; fill=&quot;freeze&quot;/&gt;&lt;animate attributeName=&quot;y&quot; to=&quot;34.1&quot; dur=&quot;1.2s&quot; fill=&quot;freeze&quot;/&gt;&lt;/rect&gt;
&lt;line x1=&quot;40&quot; x2=&quot;290&quot; y1=&quot;143&quot; y2=&quot;143&quot; stroke-dasharray=&quot;5 4&quot; class=&quot;sm&quot;/&gt;&lt;text x=&quot;286&quot; y=&quot;138&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;3% (SGP threshold)&lt;/text&gt;
&lt;text x=&quot;105&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;6.7%&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;27&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;15.1%&lt;/text&gt;
&lt;text x=&quot;105&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;initial figure&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;revised figure&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;The original design: why &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; was supposed to suffice &lt;span class=&quot;sl&quot;&gt;slides 20-21&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;In EZ economic governance it was believed that &lt;b&gt;the SGP + an ECB that does not act as lender of last resort&lt;/b&gt; would be enough to make binding the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause of &lt;b&gt;Article 125 TFEU&lt;/b&gt; (Treaty on the Functioning of the European Union), which prohibited financing the budgets of other states.&lt;/p&gt;
&lt;blockquote class=&quot;law&quot;&gt;&quot;The Union shall not be liable for or assume the commitments of central governments, regional, local or other public authorities, other bodies governed by public law, or public undertakings of any Member State, without prejudice to mutual financial guarantees for the joint execution of a specific project. A Member State shall not be liable for or assume the commitments of […] another Member State […].&quot; &lt;span class=&quot;sl&quot;&gt;Art. 125 TFEU, slide 21&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;&lt;b&gt;In plain terms:&lt;/b&gt; neither the Union nor another member state is liable for, or takes on, the debts of a member state&#x27;s government (or public bodies). The exception is mutual guarantees for jointly carrying out a specific project.&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;The logic of market discipline&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;4&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;74&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;No credible&lt;/text&gt;&lt;text x=&quot;74&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;bailout&lt;/text&gt;
&lt;rect x=&quot;168&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Markets price&lt;/text&gt;&lt;text x=&quot;238&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;risk state by state&lt;/text&gt;
&lt;rect x=&quot;332&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;402&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;High spreads for&lt;/text&gt;&lt;text x=&quot;402&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;overspenders&lt;/text&gt;
&lt;rect x=&quot;496&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Incentive for&lt;/text&gt;&lt;text x=&quot;566&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;sound budgets&lt;/text&gt;
&lt;/g&gt;
&lt;path class=&quot;ed&quot; d=&quot;M146 55 H164&quot;/&gt;&lt;path class=&quot;ed&quot; d=&quot;M310 55 H328&quot;/&gt;&lt;path class=&quot;ed&quot; d=&quot;M474 55 H492&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;el&quot;&gt;= market discipline, the discipline imposed by markets on debt issuers&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;The purpose of the rule is to enforce sound fiscal policies by subjecting debt issuers (the states) to &lt;dfn&gt;market discipline&lt;/dfn&gt;, and thereby protect the financial stability of the monetary union. &lt;span class=&quot;sl&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;&lt;b&gt;But&lt;/b&gt; then came &lt;dfn&gt;contagion&lt;/dfn&gt;: the crisis spread even to states with sound public finances, such as Spain. Market discipline does not only hit those who &quot;deserve it&quot;, and a &lt;b&gt;reform of economic governance&lt;/b&gt; is needed. &lt;span class=&quot;sl&quot;&gt;slide 21&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Two tasks at once, and two camps &lt;span class=&quot;sl&quot;&gt;slide 22&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Task 1&lt;/h4&gt;&lt;p&gt;Respond &lt;b&gt;in time&lt;/b&gt; to a crisis that was undermining stability.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Task 2&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Reform&lt;/b&gt; governance while the crisis was under way.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Reaching a shared view was also difficult because of the polarisation between &lt;b&gt;creditor countries&lt;/b&gt; and &lt;b&gt;countries overwhelmed by the negative &lt;span class=&quot;en&quot;&gt;spillovers&lt;/span&gt;&lt;/b&gt; of the crisis (spillovers = effects transmitted from one country to another).&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 150&quot; role=&quot;img&quot; aria-label=&quot;Polarisation between creditor countries and affected countries&quot;&gt;
&lt;line x1=&quot;300&quot; x2=&quot;300&quot; y1=&quot;10&quot; y2=&quot;140&quot; class=&quot;sr&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;rect x=&quot;330&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Creditor countries&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;fear of paying for others&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;(moral hazard): strict conditions,&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;compliance with Art. 125&lt;/text&gt;
&lt;text x=&quot;460&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Crisis-hit countries&lt;/text&gt;
&lt;text x=&quot;460&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;need rapid financing&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;and solidarity: contagion&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;is not solely their fault&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;The slides only state that positions were polarised. The arguments inside the boxes are an interpretive summary, not text from the slides. &lt;span class=&quot;en&quot;&gt;Moral hazard&lt;/span&gt; = the incentive to behave less prudently when one expects to be rescued.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Before the crisis, how did the EZ&#x27;s design push countries to keep their public finances in order?&lt;/summary&gt;&lt;div&gt;Through the fiscal rules of the Stability and Growth Pact (surveillance) and the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause (Art. 125 TFEU), combined with the fact that the ECB was not a lender of last resort to sovereigns. Nobody bails you out, so markets discipline you with higher spreads if you overspend.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why did contagion to Spain undermine the logic of market discipline?&lt;/summary&gt;&lt;div&gt;Because Spain had sound public finances, yet it suffered capital flight and rising spreads. Markets were not only punishing bad fiscal policy: they were punishing entire countries for private imbalances, bank-sovereign links and contagion. The rule was no longer enough to guarantee stability.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;By how much was the Greek 2009 deficit revised?&lt;/summary&gt;&lt;div&gt;From 6.7% to 15.1% of GDP, more than double the initial estimate and five times the 3% threshold.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S8 ============ --&gt;
&lt;section id=&quot;s8&quot; class=&quot;part slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 8 · First response&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;Bilateral loans, the Troika, conditionality and the IMF&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;March 2010&lt;/b&gt;: for Greece the EZ agreed to IMF financial assistance plus &lt;b&gt;bilateral loans&lt;/b&gt;, decided unanimously by the lending countries and &lt;b&gt;subject to conditionality&lt;/b&gt;. Compliance was assessed by the European Commission (EC), the IMF and the ECB, the &lt;dfn&gt;Troika&lt;/dfn&gt;, together with the Greek authorities. &lt;span class=&quot;sl&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Conditionality&lt;/b&gt;: assistance is disbursed in tranches and each tranche is tied to the implementation of agreed measures. The three families of conditions are shown below.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;Fiscal measures&lt;/h4&gt;&lt;p&gt;Budgetary measures to reduce the deficit and public debt: spending cuts, revenue increases.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;Financial measures&lt;/h4&gt;&lt;p&gt;Financial measures to restore the health of the financial sector: recapitalisation and restructuring of banks.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card sage&quot;&gt;&lt;h4&gt;Structural reforms&lt;/h4&gt;&lt;p&gt;Structural reforms (labour and product markets, public administration) to improve competitiveness, i.e. the internal devaluation of Part 3.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The EZ&#x27;s official lending framework was &lt;b&gt;held back&lt;/b&gt; by sharply divergent views on the rescue strategy and by the need to &lt;b&gt;get around Article 125&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The IMF also had to circumvent a rule &lt;span class=&quot;sl&quot;&gt;slide 24&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Debt Sustainability Assessment (DSA)&lt;/b&gt;: the analysis that determines whether a country&#x27;s debt can be serviced without restructuring, under different scenarios.&lt;br&gt;&lt;b&gt;Exceptional access policy (EAP)&lt;/b&gt;: the rules for lending beyond normal limits, i.e. more than &lt;b&gt;100% of the country&#x27;s &lt;span class=&quot;en&quot;&gt;quota&lt;/span&gt;&lt;/b&gt; in a year. The quota is each member&#x27;s subscription to the IMF and determines voting power and access to financing. For exceptional access, debt must be judged sustainable &lt;b&gt;with high probability&lt;/b&gt;.&lt;/div&gt;
&lt;p&gt;For Greece in 2010 the DSA did &lt;b&gt;not&lt;/b&gt; reach that conclusion. Under pressure from the risk of a systemic collapse, the IMF introduced the &lt;dfn&gt;systemic exemption&lt;/dfn&gt;: the DSA requirement could be waived if the crisis risked becoming &lt;b&gt;systemic&lt;/b&gt;, i.e. spreading to the international financial system.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;2010 rule&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;After 2016&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;IMF rule in 2010&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Debt sustainable with high probability?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 35 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;yes&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Exceptional access OK&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M135 60 V100&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;86&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;no / uncertain&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Risk of systemic contagion?&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;systemic exemption&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 132 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;yes&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Loan granted anyway&lt;/text&gt;&lt;text x=&quot;459&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;Greece 2010, then Portugal and Ireland&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;IMF rule after 2016&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Debt sustainable with high probability?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 35 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;28&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;yes&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;10&quot; width=&quot;250&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Exceptional access OK&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M135 60 V100&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;86&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;sustainability uncertain&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Other official lenders commit&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;to cover possible losses?&lt;/text&gt;
&lt;path class=&quot;ed&quot; d=&quot;M260 132 H330&quot;/&gt;&lt;text x=&quot;295&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;yes&lt;/text&gt;
&lt;rect x=&quot;334&quot; y=&quot;104&quot; width=&quot;250&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;459&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Loan possible&lt;/text&gt;&lt;text x=&quot;459&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;the systemic exemption no longer exists&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The same exemption was used to rescue &lt;b&gt;Portugal and Ireland&lt;/b&gt;. It was &lt;b&gt;abolished in 2016&lt;/b&gt;: since then, a rescue with uncertain debt sustainability requires other official lenders to commit to covering possible losses. &lt;span class=&quot;sl&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In its 2016 paper the IMF acknowledges that the exemption &quot;has not proven effective in mitigating contagion&quot; and entailed significant costs and risks. The Independent Evaluation Office (IEO) had criticised the 2010 decisions, saying that the exceptional access rules had been followed &quot;perfunctorily&quot;. &lt;a href=&quot;https://www.imf.org/en/Publications/Policy-Papers/Issues/2016/12/31/The-Fund-s-Lending-Framework-and-Sovereign-Debt-Further-Considerations-PP5015&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, The Fund&#x27;s Lending Framework and Sovereign Debt (2016)&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Who made up the Troika and what did it assess?&lt;/summary&gt;&lt;div&gt;The European Commission, the IMF and the ECB, together with the Greek authorities. It assessed compliance with conditionality: fiscal measures, financial measures and structural reforms.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What was the systemic exemption and why was it introduced?&lt;/summary&gt;&lt;div&gt;A waiver of the rule that exceptional access requires debt to be sustainable with high probability. It allowed lending even without that assurance if there was a risk of systemic contagion. It was introduced in 2010 for Greece, later used for Portugal and Ireland, and abolished in 2016.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which two &quot;clauses&quot; had to be overcome to rescue Greece?&lt;/summary&gt;&lt;div&gt;On the EU side, the &lt;span class=&quot;en&quot;&gt;no bailout&lt;/span&gt; clause of Art. 125 TFEU; on the IMF side, the debt sustainability requirement (DSA) for exceptional access.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ S9 ============ --&gt;
&lt;section id=&quot;s9&quot; class=&quot;part brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 9 · New institutions&lt;/div&gt;
&lt;h2&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;The fundamental shift: a common framework (EFSM, EFSF, ESM)&lt;/h2&gt;
&lt;p&gt;The IMF loan to Greece in May 2010 did not calm markets, and pressure spread to Portugal (PT) and Ireland (IR). The &lt;b&gt;Ecofin of 10 May 2010&lt;/b&gt; (the Council of EU economic and finance ministers) changed approach: from &lt;b&gt;directly funded loans&lt;/b&gt; to &lt;b&gt;loans guaranteed by member states&lt;/b&gt;. &lt;span class=&quot;sl&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Direct loans and guaranteed loans compared&quot;&gt;
&lt;text x=&quot;150&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Directly funded loans&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Guaranteed loans&lt;/text&gt;
&lt;line x1=&quot;315&quot; x2=&quot;315&quot; y1=&quot;10&quot; y2=&quot;200&quot; class=&quot;sr&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
&lt;rect x=&quot;60&quot; y=&quot;34&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Euro-area governments&lt;/text&gt;
&lt;path d=&quot;M150 76 V146&quot; stroke-width=&quot;5&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;116&quot; font-size=&quot;12&quot;&gt;cash up front&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;150&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Greece&lt;/text&gt;
&lt;rect x=&quot;335&quot; y=&quot;34&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fcb sc&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Euro-area govts&lt;/text&gt;
&lt;path d=&quot;M405 76 V100&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;2&quot; class=&quot;sm&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;412&quot; y=&quot;94&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;guarantees&lt;/text&gt;
&lt;rect x=&quot;335&quot; y=&quot;104&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick);&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; style=&quot;fill:var(--paper)&quot;&gt;Vehicle (EFSF)&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;104&quot; width=&quot;130&quot; height=&quot;40&quot; rx=&quot;10&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;Markets&lt;/text&gt;
&lt;path d=&quot;M498 118 H478&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;488&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;issues bonds&lt;/text&gt;
&lt;path d=&quot;M405 146 V172&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--ochre)&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;rect x=&quot;335&quot; y=&quot;174&quot; width=&quot;140&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;fk sr&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Distressed country&lt;/text&gt;
&lt;text x=&quot;565&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;only &quot;if needed&quot;&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;In the first model governments pay in cash. In the second they provide guarantees, while a common vehicle raises funds on the market and lends them only when needed.&lt;/figcaption&gt;&lt;/figure&gt;
