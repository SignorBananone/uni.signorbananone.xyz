&lt;!-- S1 --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Che cos&#x27;è una self-fulfilling debt crisis e come la si riconosce&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 1-2&lt;/p&gt;

  &lt;p&gt;La domanda della lezione: &lt;strong&gt;c&#x27;è stata nell&#x27;Eurozona (EZ) una crisi del debito che si è auto-avverata?&lt;/strong&gt; E quali segnali la renderebbero visibile nei dati?&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Self-fulfilling debt crisis&lt;/h4&gt;
    &lt;p&gt;Una &lt;em class=&quot;t&quot;&gt;self-fulfilling crisis&lt;/em&gt; (crisi che si auto-avvera) è una crisi provocata dalle &lt;em&gt;aspettative stesse&lt;/em&gt;: se gli investitori temono un default e chiedono tassi più alti, il costo del debito sale tanto da rendere davvero il default più probabile. La profezia pessimista si realizza perché è stata creduta.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Spread&lt;/h4&gt;
    &lt;p&gt;Lo &lt;em class=&quot;t&quot;&gt;spread&lt;/em&gt; (differenziale) è la differenza tra il rendimento del titolo di Stato a 10 anni di un Paese e quello di un titolo di riferimento considerato sicuro (nell&#x27;Eurozona di solito il Bund tedesco). Misura il premio per il rischio che i mercati chiedono per prestare a quel governo. Esempio: BTP al 5,5% e Bund al 2,0% → spread = 3,5 punti percentuali = 350 &lt;em&gt;basis points&lt;/em&gt; (1 bp = 0,01%).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;La logica: perché in una unione monetaria?&lt;/h3&gt;
  &lt;p&gt;Nelle slide: «in una monetary union i movimenti di sfiducia verso un Paese portano a un aumento del rendimento dei suoi titoli di Stato → aumento dello spread». Il passaggio dato per scontato è il perché.&lt;/p&gt;
  &lt;div class=&quot;ctx&quot;&gt;
    &lt;p&gt;È la &lt;strong&gt;fragility hypothesis&lt;/strong&gt; di De Grauwe, citata nella slide 13 («fragility hypothesis»). Un Paese dell&#x27;Eurozona emette debito in una valuta che &lt;em&gt;non controlla&lt;/em&gt;: la sua banca centrale nazionale non può stampare euro per rimborsare i titoli in scadenza. Un Paese &lt;em class=&quot;t&quot;&gt;stand-alone&lt;/em&gt; (con moneta propria, come il Regno Unito) può invece sempre pagare in moneta propria, perché la banca centrale fa da &lt;em&gt;lender of last resort&lt;/em&gt; (prestatore di ultima istanza). Quindi nell&#x27;EZ un problema di &lt;em&gt;liquidity&lt;/em&gt; (non trovare chi rinnova il debito) può trasformarsi in un problema di &lt;em&gt;solvency&lt;/em&gt; (insolvenza). Questo rende possibili &lt;em class=&quot;t&quot;&gt;multiple equilibria&lt;/em&gt;: con gli stessi fondamentali si può finire in un equilibrio «buono» (tassi bassi) o «cattivo» (tassi alti e default).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Passo 1 · Shock di fiducia&lt;/span&gt;&lt;p&gt;Gli investitori iniziano a dubitare di un Paese dell&#x27;EZ (per un evento, una notizia, il contagio da un altro Paese). Vendono i suoi titoli.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Passo 2 · Sale lo spread&lt;/span&gt;&lt;p&gt;Il prezzo dei titoli scende, il rendimento sale: lo spread cresce. Il governo deve rifinanziarsi a tassi più alti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Passo 3 · Liquidity squeeze&lt;/span&gt;&lt;p&gt;Senza una banca centrale nazionale che garantisca il rinnovo del debito, il governo rischia di non trovare compratori: crisi di liquidità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Passo 4 · Forced austerity&lt;/span&gt;&lt;p&gt;Per rassicurare i mercati il governo taglia spesa e alza tasse in recessione. Il PIL cala (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Passo 5 · I fondamentali peggiorano davvero&lt;/span&gt;&lt;p&gt;Con PIL in calo e interessi alti il rapporto debito/PIL sale. Il pessimismo iniziale ora sembra «giustificato»: la crisi si è auto-avverata. Si torna al passo 1, più forte.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Circolo vizioso della crisi auto-avverata&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;350&quot; cy=&quot;130&quot; r=&quot;92&quot; class=&quot;s-sage&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 5&quot; fill=&quot;none&quot;/&gt;
        &lt;text x=&quot;350&quot; y=&quot;125&quot; class=&quot;serif&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;bad equilibrium&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;145&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;circolo che si autoalimenta&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;32&quot;&gt;sfiducia / panico&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;112&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;134&quot;&gt;spread ↑ (tassi ↑)&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;216&quot; width=&quot;160&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;238&quot;&gt;austerity · PIL ↓&lt;/text&gt;
        &lt;rect x=&quot;60&quot; y=&quot;112&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;134&quot;&gt;debito/PIL ↑&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-sage&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;
        &lt;path d=&quot;M430,30 Q520,40 545,108&quot;/&gt;&lt;path d=&quot;M545,150 Q520,220 432,232&quot;/&gt;&lt;path d=&quot;M268,232 Q180,220 150,150&quot;/&gt;&lt;path d=&quot;M150,110 Q180,40 268,30&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema del circolo vizioso descritto nelle slide 2, 8 e 20.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;I tre segnali di una crisi guidata dal sentiment&lt;/h3&gt;
  &lt;p&gt;Quando il &lt;em class=&quot;t&quot;&gt;market sentiment&lt;/em&gt; (l&#x27;umore, le aspettative collettive degli investitori) si rivolta contro un Paese, gli spread tendono a mostrare:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① Grandi salti in poco tempo&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Large movements over short periods: i fondamentali (debito, crescita) cambiano lentamente, trimestre dopo trimestre; lo spread invece può raddoppiare in settimane.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② Cluster nel tempo&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Clusters in time: i movimenti si concentrano in episodi (ondate di panico) e spesso colpiscono più Paesi insieme (contagion).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ Un «buco» non spiegato&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le variazioni dei fondamentali non bastano a spiegare la variazione totale dello spread. È proprio ciò che i due studi cercano di misurare.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;Perché la fragility hypothesis riguarda in particolare i Paesi di una monetary union?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Perché hanno debiti pubblici sempre più alti dei Paesi stand-alone&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Perché emettono debito in una moneta che la loro banca centrale nazionale non può creare&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Perché non possono emettere titoli a 10 anni&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Esatto il punto b: senza un prestatore di ultima istanza nazionale, la sfiducia può trasformare un problema di liquidità in insolvenza. Il punto a è falso: la slide 7 mostra che USA e UK avevano un debito/PIL in crescita simile o superiore a quello dell&#x27;area euro.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Se lo spread di un Paese passa da 100 a 400 bp in un trimestre mentre debito/PIL e crescita restano quasi invariati, quale dei tre segnali stai osservando?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Il ① (grandi salti in poco tempo) e soprattutto il ③: la variazione dei fondamentali non spiega la variazione dello spread. Se lo stesso accade insieme ad altri Paesi, anche il ② (cluster).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;De Grauwe &amp;amp; Ji (2013): l&#x27;ipotesi, la strategia, i fatti&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 3-8 · Paul De Grauwe (LSE) e Yuemei Ji (LICOS Leuven, CEPS), &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34 (2013) 15-36&lt;/p&gt;

  &lt;h3&gt;L&#x27;abstract in quattro mosse&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;We test&lt;/button&gt;&lt;button&gt;We find&lt;/button&gt;&lt;button&gt;We argue&lt;/button&gt;&lt;button&gt;We also find&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Ipotesi.&lt;/strong&gt; I mercati dei titoli di Stato dell&#x27;Eurozona sono &lt;em&gt;più fragili&lt;/em&gt; e più esposti a &lt;em class=&quot;t&quot;&gt;self-fulfilling liquidity crises&lt;/em&gt; (crisi di liquidità auto-avverate) rispetto a quelli dei Paesi &lt;em&gt;stand-alone&lt;/em&gt;, cioè con moneta e banca centrale propria.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Risultato.&lt;/strong&gt; Una parte significativa dell&#x27;impennata degli spread dei Paesi periferici nel 2010-11 era &lt;em&gt;scollegata&lt;/em&gt; dagli aumenti di debito/PIL e di fiscal space, e associata a un sentiment negativo auto-avverante, diventato molto forte dalla fine del 2010.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Implicazione.&lt;/strong&gt; Questo può spingere i Paesi membri dell&#x27;Eurozona in &lt;em class=&quot;t&quot;&gt;bad equilibria&lt;/em&gt;: equilibri cattivi con tassi alti, austerità e recessione, che con fondamentali identici si sarebbero potuti evitare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Secondo risultato.&lt;/strong&gt; Dopo anni in cui avevano &lt;em&gt;ignorato&lt;/em&gt; l&#x27;alto debito pubblico, gli investitori nell&#x27;EZ hanno iniziato a preoccuparsene e hanno alzato gli spread. Nei Paesi stand-alone questo non è successo, pur con debito/PIL e fiscal space altrettanto alti e in crescita.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La estimation strategy, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 1 · Modello con i fondamentali&lt;/span&gt;&lt;p&gt;Si stima un modello che spiega lo spread con alcune &lt;em&gt;fundamental variables&lt;/em&gt; (debito, conti con l&#x27;estero, cambio reale, crescita). È il «prezzo giusto» del rischio secondo i fondamentali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 2 · Si aggiungono le time dummies&lt;/span&gt;&lt;p&gt;Si ristima il modello con &lt;em class=&quot;t&quot;&gt;time dummies&lt;/em&gt; (variabili 0/1, una per trimestre). Il loro coefficiente cattura quanto lo spread di quel trimestre si discosta da ciò che spiegano i fondamentali: permette di individuare periodi di &lt;em class=&quot;t&quot;&gt;regime switching&lt;/em&gt;, in cui il sentiment allontana gli spread dai fondamentali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 3 · Quanto pesano?&lt;/span&gt;&lt;p&gt;Si misura quanta parte della variazione totale degli spread è attribuibile alle time dummies (→ sezione 6, decomposition).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 4 · Control group&lt;/span&gt;&lt;p&gt;Per essere convincenti si ripete tutto su un &lt;em class=&quot;t&quot;&gt;control group&lt;/em&gt; (gruppo di controllo) di Paesi che &lt;em&gt;non&lt;/em&gt; appartengono a un&#x27;unione monetaria. Se la fragilità viene dall&#x27;unione monetaria, lì le time dummies dovrebbero restare piatte.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Il control group: 14 Paesi stand-alone sviluppati&lt;/h4&gt;
  &lt;div class=&quot;countries&quot;&gt;&lt;span&gt;Australia&lt;/span&gt;&lt;span&gt;Canada&lt;/span&gt;&lt;span&gt;Czech Republic&lt;/span&gt;&lt;span&gt;Denmark&lt;/span&gt;&lt;span&gt;Hungary&lt;/span&gt;&lt;span&gt;Japan&lt;/span&gt;&lt;span&gt;South Korea&lt;/span&gt;&lt;span&gt;Norway&lt;/span&gt;&lt;span&gt;Poland&lt;/span&gt;&lt;span&gt;Singapore&lt;/span&gt;&lt;span&gt;Sweden&lt;/span&gt;&lt;span&gt;Switzerland&lt;/span&gt;&lt;span&gt;UK&lt;/span&gt;&lt;span&gt;US&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Nota: Danimarca, Rep. Ceca, Ungheria, Polonia, Svezia sono nell&#x27;UE ma non nell&#x27;euro; il criterio è la moneta propria, non l&#x27;appartenenza all&#x27;UE.&lt;/p&gt;

  &lt;h3&gt;I fatti (slide 7)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-cb=&quot;factsTab&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Fig. 1 · Debito/PIL&lt;/button&gt;&lt;button&gt;Fig. 2 · Spread&lt;/button&gt;&lt;button&gt;Fig. 4 vs 5 · Spread e debito&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;figure&gt;&lt;svg id=&quot;fig1&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;United States&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Euro area&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;UK&lt;/span&gt;&lt;/div&gt;
      &lt;figcaption&gt;Debito pubblico lordo, % del PIL, 2000-2011 (fonte nella slide: European Commission, Ameco). Ridisegnato con valori letti a occhio.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;&lt;strong&gt;Da notare:&lt;/strong&gt; dopo il 2008 il debito cresce &lt;em&gt;più&lt;/em&gt; negli USA e nel Regno Unito che nell&#x27;area euro. Eppure la crisi del debito esplode nell&#x27;EZ. Primo indizio che il livello del debito da solo non spiega tutto.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;figure&gt;&lt;svg id=&quot;fig2&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Greece&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Portugal&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Ireland&lt;/span&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Italy&lt;/span&gt;&lt;span style=&quot;--c:var(--accent)&quot;&gt;Belgium&lt;/span&gt;&lt;span style=&quot;--c:var(--muted)&quot;&gt;France / Netherlands&lt;/span&gt;&lt;/div&gt;
      &lt;figcaption&gt;Spread dei titoli a 10 anni rispetto alla Germania, % (fonte nella slide: Datastream). Andamento schematico ridisegnato, non dati puntuali.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;Dal 1999 al 2008 gli spread sono praticamente &lt;strong&gt;zero&lt;/strong&gt; per tutti: i mercati prezzavano il debito greco come quello olandese. Poi dal 2010 divergono in modo esplosivo (Grecia oltre 20 punti a fine 2011). Sono i segnali ① e ② della sezione 1.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;figure&gt;&lt;svg id=&quot;fig4&quot; viewBox=&quot;0 0 330 260&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Eurozona 2000Q1-2011Q3 (slide: Eurostat, Datastream).&lt;/figcaption&gt;&lt;/figure&gt;
        &lt;figure&gt;&lt;svg id=&quot;fig5&quot; viewBox=&quot;0 0 330 260&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Paesi stand-alone 2000Q1-2011Q3 (slide: OECD, Datastream).&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Nuvole di punti illustrative che riproducono la forma dei grafici originali, non i dati.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Eurozona:&lt;/strong&gt; la maggior parte delle osservazioni ha spread vicino a zero; poi un gruppo di punti (il triangolo rosso della slide: GR, PT, IR 2010Q2-2011Q3) schizza in alto. La relazione è &lt;em&gt;non lineare&lt;/em&gt;: oltre una certa soglia di debito lo spread esplode. &lt;strong&gt;Stand-alone:&lt;/strong&gt; nessuna relazione positiva; anzi Paesi con debito/PIL tra 100% e 200% (il Giappone) hanno spread negativi.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;A cosa serve il control group nello studio di De Grauwe e Ji?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Ad aumentare il numero di osservazioni per avere stime più precise&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;A stimare il valore «giusto» dello spread per i Paesi dell&#x27;EZ&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;A verificare che gli scostamenti dai fondamentali siano tipici dell&#x27;unione monetaria e non un fenomeno globale della crisi&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Giusto. Se anche nei Paesi stand-alone le time dummies salissero, il fenomeno sarebbe legato alla crisi finanziaria globale e non alla fragilità dell&#x27;unione monetaria. Il control group fa da termine di confronto, come in un esperimento.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Che cosa mostra il confronto tra Fig. 1 e Fig. 2 contro una spiegazione «solo fondamentali»?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;USA e UK hanno visto il debito/PIL salire più dell&#x27;area euro dopo il 2008, ma non hanno avuto una crisi degli spread. Nell&#x27;EZ invece gli spread della periferia esplodono. Se contasse solo il debito, ci aspetteremmo il contrario.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Fundamentals contro market sentiment · il fiscal space&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 8, 10&lt;/p&gt;

  &lt;div class=&quot;vs&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Spiegazione 1&lt;/span&gt;&lt;h4&gt;Fundamentals in peggioramento&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;I &lt;em class=&quot;t&quot;&gt;fundamentals&lt;/em&gt; sono le variabili economiche «oggettive» che determinano la capacità di un governo di ripagare. In questa letteratura le più usate misurano la &lt;strong&gt;sustainability&lt;/strong&gt; (sostenibilità) del debito pubblico. Il paper ne usa due: &lt;strong&gt;debt to GDP ratio&lt;/strong&gt; e &lt;strong&gt;fiscal space&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;mid&quot;&gt;versus&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Spiegazione 2&lt;/span&gt;&lt;h4&gt;Market sentiment&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Aspettative guidate da &lt;em&gt;panic and fear&lt;/em&gt;, che possono cambiare all&#x27;improvviso senza che cambino i fondamentali. Non si osservano direttamente: vanno misurate in modo indiretto (→ time dummies).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Conseguenza comune (slide 8 e 20): gli spread elevati hanno costretto i Paesi a &lt;strong&gt;severe austerity measures&lt;/strong&gt; che a loro volta hanno fatto &lt;em&gt;salire&lt;/em&gt; il debito/PIL (perché il PIL al denominatore cala).&lt;/p&gt;

  &lt;h3&gt;Fiscal space&lt;/h3&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Definizione (Aizenman e Hutchison, 2012, citati nella slide)&lt;/h4&gt;
    &lt;p class=&quot;formula&quot; style=&quot;background:transparent;border:0;margin:6px 0&quot;&gt;fiscal space = debito pubblico / entrate fiscali totali&lt;/p&gt;
    &lt;p&gt;Misura &lt;em&gt;quanti anni di entrate fiscali&lt;/em&gt; servirebbero per ripagare tutto il debito. Secondo gli autori è un indicatore di sostenibilità migliore del debito/PIL, perché tiene conto della &lt;strong&gt;capacità di riscuotere tasse&lt;/strong&gt;. Attenzione al nome: un valore &lt;em&gt;alto&lt;/em&gt; significa &lt;em&gt;poco&lt;/em&gt; spazio fiscale.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Un Paese può avere un debito/PIL basso ma faticare a servire il debito perché raccoglie poche tasse: allora il rapporto debito/entrate è alto, cioè servono molti anni di gettito. Provalo:&lt;/p&gt;

  &lt;div class=&quot;card&quot; id=&quot;fsCalc&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;h4&gt;Paese A&lt;/h4&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dA&quot;&gt;Debito / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dA&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;dAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tA&quot;&gt;Entrate fiscali / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tA&quot; min=&quot;10&quot; max=&quot;55&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;tAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;h4&gt;Paese B&lt;/h4&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dB&quot;&gt;Debito / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dB&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;dBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tB&quot;&gt;Entrate fiscali / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tB&quot; min=&quot;10&quot; max=&quot;55&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;tBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;fsSvg&quot; viewBox=&quot;0 0 640 120&quot; style=&quot;width:100%;height:auto&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;fsMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Esempio costruito per la pagina, non dalle slide. Il fiscal space = (debito/PIL) ÷ (entrate/PIL) = debito/entrate.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;Paese X: debito/PIL 60%, entrate/PIL 20%. Paese Y: debito/PIL 90%, entrate/PIL 45%. Chi ha il fiscal space «peggiore»?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;X: servono 3 anni di entrate contro 2 di Y&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Y, perché ha il debito più alto&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Sono uguali&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;X: 60/20 = 3,0; Y: 90/45 = 2,0. Pur con meno debito, X ha meno capacità di servirlo. È il caso descritto nella slide 10.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Perché l&#x27;austerità imposta dagli spread può far salire il rapporto debito/PIL invece di ridurlo?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Tagli di spesa e aumenti di tasse in recessione riducono il PIL (il denominatore) e le entrate; nel frattempo gli interessi alti aumentano il debito (il numeratore). Il rapporto può quindi salire nel breve periodo: è l&#x27;anello che chiude il circolo vizioso della sezione 1.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Il linear model e i suoi risultati&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 9, 11, 12&lt;/p&gt;

  &lt;p&gt;È una &lt;em class=&quot;t&quot;&gt;panel regression&lt;/em&gt;: dati con due dimensioni, Paesi (&lt;span class=&quot;f&quot;&gt;i&lt;/span&gt;) e trimestri (&lt;span class=&quot;f&quot;&gt;t&lt;/span&gt;), dal 2000Q1 al 2011Q3. Due versioni:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + α&lt;sub&gt;i&lt;/sub&gt; + u&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;1&lt;/sub&gt;·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;2&lt;/sub&gt;·(Debt&lt;sub&gt;it&lt;/sub&gt;)&lt;sup&gt;2&lt;/sup&gt; + α&lt;sub&gt;i&lt;/sub&gt; + u&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;I&lt;/button&gt;&lt;button&gt;CA&lt;/button&gt;&lt;button&gt;Debt&lt;/button&gt;&lt;button&gt;REE&lt;/button&gt;&lt;button&gt;Growth&lt;/button&gt;&lt;button&gt;α&lt;sub&gt;i&lt;/sub&gt;&lt;/button&gt;&lt;button&gt;(Debt)²&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;I&lt;/strong&gt; = spread del titolo di Stato a 10 anni. È la variabile dipendente, quella da spiegare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;CA&lt;/strong&gt; = deficit di &lt;em class=&quot;t&quot;&gt;current account&lt;/em&gt; (partite correnti) &lt;em&gt;accumulato&lt;/em&gt;, in rapporto al PIL. Misura il debito verso l&#x27;estero accumulato dall&#x27;intera economia, pubblica e privata: un Paese che ha accumulato deficit esterni dipende dai capitali stranieri.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Debt&lt;/strong&gt; = debito pubblico/PIL &lt;em&gt;oppure&lt;/em&gt; fiscal space (debito/entrate). Le due misure alternative di sostenibilità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;REE&lt;/strong&gt; = &lt;em class=&quot;t&quot;&gt;real effective exchange rate&lt;/em&gt; (tasso di cambio reale effettivo): cambio medio ponderato con i partner commerciali, corretto per i prezzi relativi. Se sale, il Paese perde competitività.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Growth&lt;/strong&gt; = tasso di crescita del PIL. Più crescita = più facile servire il debito, quindi ci si aspetta un segno negativo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;α&lt;sub&gt;i&lt;/sub&gt;&lt;/strong&gt; = &lt;em class=&quot;t&quot;&gt;country fixed effect&lt;/em&gt;: una costante diversa per ogni Paese. Cattura le caratteristiche specifiche che &lt;em&gt;non cambiano nel tempo&lt;/em&gt; e che influenzano lo spread: efficienza del sistema fiscale, qualità della governance, ecc. In pratica il modello confronta ogni Paese con se stesso nel tempo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;(Debt)²&lt;/strong&gt;: il termine al quadrato permette una relazione &lt;em&gt;non lineare&lt;/em&gt;. Se γ&lt;sub&gt;2&lt;/sub&gt; &amp;gt; 0, l&#x27;effetto di un punto di debito in più sullo spread &lt;em&gt;cresce&lt;/em&gt; col livello del debito. È la forma «a gomito» della Fig. 4.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Come leggere una tabella di regressione (prerequisito)&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Coefficiente&lt;/strong&gt;: di quanto cambia la variabile dipendente se la variabile cresce di 1, tenendo fisse le altre. Qui lo spread è in punti percentuali, quindi 0,0744 = +7,44 basis points per ogni punto di debito/PIL.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;[numero tra parentesi]&lt;/strong&gt;: lo &lt;em&gt;standard error&lt;/em&gt;, cioè l&#x27;incertezza della stima. Le stime sono &lt;em&gt;robust&lt;/em&gt; e &lt;em&gt;clustered at country level&lt;/em&gt;: si tiene conto che gli errori dello stesso Paese in trimestri diversi sono correlati.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Asterischi&lt;/strong&gt;: significatività statistica. *** p&amp;lt;0,01, ** p&amp;lt;0,05, * p&amp;lt;0,1. Senza asterischi non si può escludere che l&#x27;effetto vero sia zero.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;R²&lt;/strong&gt;: quota della variabilità dello spread spiegata dal modello (da 0 a 1).&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Risultati: Eurozona contro stand-alone&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Tab. 1 · Eurozona&lt;/button&gt;&lt;button&gt;Tab. 2 · Stand-alone&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;2000Q1-2011Q3&lt;/th&gt;&lt;th&gt;(1)&lt;/th&gt;&lt;th&gt;(2)&lt;/th&gt;&lt;th&gt;(3)&lt;/th&gt;&lt;th&gt;(4)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Accumulated current account/GDP&lt;/td&gt;&lt;td&gt;−0,0115&lt;/td&gt;&lt;td&gt;−0,0001&lt;/td&gt;&lt;td&gt;−0,0116&lt;/td&gt;&lt;td&gt;0,0011&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Real effective exchange rate&lt;/td&gt;&lt;td&gt;0,0119&lt;/td&gt;&lt;td&gt;0,0121&lt;/td&gt;&lt;td&gt;0,0060&lt;/td&gt;&lt;td&gt;0,0005&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;−0,0668&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0,0501***&lt;/td&gt;&lt;td&gt;−0,0571&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0,0405***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0,0744***&lt;/td&gt;&lt;td&gt;−0,0523&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP squared&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0,0009***&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;2,5008***&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−1,7636***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space squared&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0,9265***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Country fixed effect&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Observations&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;R²&lt;/td&gt;&lt;td&gt;0,67&lt;/td&gt;&lt;td&gt;0,80&lt;/td&gt;&lt;td&gt;0,71&lt;/td&gt;&lt;td&gt;0,85&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Standard error omessi per leggibilità (sono nella slide 11).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Lettura:&lt;/strong&gt; nell&#x27;EZ debito e fiscal space sono fortemente significativi, e la versione con il quadrato spiega di più (R² da 0,67 a 0,80; da 0,71 a 0,85): l&#x27;effetto del debito è &lt;em&gt;non lineare&lt;/em&gt;. Anche la crescita conta (segno negativo).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;2000Q1-2011Q3&lt;/th&gt;&lt;th&gt;(1)&lt;/th&gt;&lt;th&gt;(2)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Accumulated current account/GDP&lt;/td&gt;&lt;td&gt;−0,0012&lt;/td&gt;&lt;td&gt;−0,0023&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Real effective exchange rate&lt;/td&gt;&lt;td&gt;0,0019&lt;/td&gt;&lt;td&gt;0,0014&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Change in exchange rate&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0,0274**&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0,0278***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;−0,0216&lt;/td&gt;&lt;td&gt;−0,0231&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP&lt;/td&gt;&lt;td&gt;0,0105&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0,2653&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Country fixed effect&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Observations&lt;/td&gt;&lt;td&gt;658&lt;/td&gt;&lt;td&gt;658&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;R²&lt;/td&gt;&lt;td&gt;0,84&lt;/td&gt;&lt;td&gt;0,84&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;Lettura:&lt;/strong&gt; nei Paesi stand-alone né il debito/PIL né il fiscal space sono significativi: i mercati non puniscono il debito alto di chi ha una banca centrale propria. Conta invece la variazione del tasso di cambio, uno strumento di aggiustamento che i Paesi dell&#x27;euro non hanno.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Esplora la non-linearità&lt;/h3&gt;
  &lt;p&gt;Con i coefficienti della colonna (2) di Tab. 1 l&#x27;effetto di un punto di debito in più è la derivata: &lt;span class=&quot;f&quot;&gt;∂I/∂Debt = γ&lt;sub&gt;1&lt;/sub&gt; + 2γ&lt;sub&gt;2&lt;/sub&gt;·Debt = −0,0523 + 0,0018·Debt&lt;/span&gt;. Muovi il cursore:&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;qD&quot;&gt;Debito / PIL (%)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qD&quot; min=&quot;30&quot; max=&quot;160&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;qDo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;qSvg&quot; viewBox=&quot;0 0 640 280&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Eurozona: Tab. 1 col. (2)&lt;/span&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Stand-alone: Tab. 2 col. (1), non significativo&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p class=&quot;readout&quot; id=&quot;qMsg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Variazione dello spread rispetto a un Paese con debito/PIL = 60%, a parità di tutte le altre variabili. Calcolo illustrativo sui coefficienti stimati, non una previsione.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;Nella colonna (2) di Tab. 1 il coefficiente lineare del debito è negativo (−0,0523) e non significativo. Significa che il debito non conta?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Sì: il coefficiente lineare non è significativo&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;No: con il termine al quadrato l&#x27;effetto va letto insieme, e per livelli di debito realistici è positivo e crescente&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;No: significa che più debito riduce lo spread&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;L&#x27;effetto marginale è −0,0523 + 0,0018·Debt, positivo già sopra circa il 29% di debito/PIL e via via più forte. Il quadrato significativo (0,0009***) è proprio la prova della non-linearità.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Che cosa cattura il country fixed effect α&lt;sub&gt;i&lt;/sub&gt;, e cosa &lt;em&gt;non&lt;/em&gt; può catturare?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Cattura tutto ciò che è specifico del Paese e costante nel tempo (qualità delle istituzioni, efficienza fiscale…). Non può catturare ciò che cambia nel tempo, come un&#x27;ondata di panico nel 2010: per quello servono le time dummies (sezione 5).&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Perché nei Paesi stand-alone conta la «change in exchange rate» mentre debito e fiscal space no?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Chi ha una moneta propria può aggiustarsi con il cambio e non può essere costretto al default sul debito in moneta propria (la banca centrale fa da lender of last resort). Quindi gli investitori guardano meno al livello del debito. È coerente con la fragility hypothesis.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s5&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Time dummies: misurare il market sentiment&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 13-15&lt;/p&gt;

  &lt;p&gt;Un aspetto chiave della fragility hypothesis è che può generare movimenti degli spread &lt;strong&gt;apparentemente scollegati&lt;/strong&gt; dai fondamentali del modello. Per misurarli si aggiunge una componente temporale:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;1&lt;/sub&gt;·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;2&lt;/sub&gt;·(Debt&lt;sub&gt;it&lt;/sub&gt;)&lt;sup&gt;2&lt;/sup&gt; + α&lt;sub&gt;i&lt;/sub&gt; + &lt;b style=&quot;color:var(--tint)&quot;&gt;β&lt;sub&gt;t&lt;/sub&gt;&lt;/b&gt; + ε&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Time dummy β&lt;sub&gt;t&lt;/sub&gt;&lt;/h4&gt;
    &lt;p&gt;Una &lt;em class=&quot;t&quot;&gt;time dummy&lt;/em&gt; è una variabile che vale 1 in un certo trimestre e 0 negli altri; il suo coefficiente β&lt;sub&gt;t&lt;/sub&gt; è lo spread «in più» comune a tutti i Paesi del gruppo in quel trimestre, &lt;em&gt;al netto dei fondamentali&lt;/em&gt;. Per costruzione è esogena e non legata ai fondamentali: è ciò che resta quando i fondamentali hanno già spiegato tutto quello che potevano. Gli autori la interpretano come &lt;strong&gt;market sentiment&lt;/strong&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le time dummies stimate per gruppo&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;tdSvg&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Stand-alone&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Eurozone&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Core Eurozone&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Peripheral Eurozone&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tdQ&quot;&gt;Trimestre&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tdQ&quot; min=&quot;0&quot; max=&quot;46&quot; value=&quot;46&quot;&gt;&lt;output id=&quot;tdQo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div id=&quot;tdRead&quot; class=&quot;grid3 small&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Curve ridisegnate a occhio dai quattro grafici della slide 14 (valori in punti percentuali).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stand-alone&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Componente temporale piatta, attorno a 0 / −0,5 per tutto il periodo, anche nel 2008-09. Nessun regime di panico.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Periferia EZ&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Sale dal 2010 fino a circa +5 punti nel 2011Q3: cinque punti di spread che i fondamentali non spiegano. Prima, nel 2009, un calo: euforia e pessimismo si alternano.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Interpretazione: mispricing in entrambe le direzioni&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;Soprattutto nella periferia ci sono state &lt;em class=&quot;t&quot;&gt;departures&lt;/em&gt;: aumenti degli spread che non si spiegano con debito/PIL e fiscal space.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Prima della crisi&lt;/strong&gt; i mercati non vedevano rischio nel debito periferico e lo prezzavano come quello dei Paesi core → rischio &lt;em&gt;sottostimato&lt;/em&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Dopo la crisi&lt;/strong&gt; gli spread periferici sono saliti in modo drammatico e indipendente dai fondamentali osservati → i mercati, presi da sentiment negativo, &lt;em&gt;esageravano&lt;/em&gt; il rischio di default.&lt;/li&gt;
    &lt;li&gt;Conclusione: il &lt;em class=&quot;t&quot;&gt;mispricing of risks&lt;/em&gt; (errata valutazione del rischio), in entrambe le direzioni, sembra essere stato un tratto &lt;strong&gt;endemico&lt;/strong&gt; dell&#x27;Eurozona.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;Se nel 2011Q3 la time dummy della periferia vale circa 5, che cosa significa?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Che i fondamentali della periferia sono peggiorati di 5 punti&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Che lo spread medio della periferia era 5%&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Che lo spread era circa 5 punti più alto di quanto previsto dai fondamentali, in modo comune ai Paesi periferici&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;La time dummy misura lo scostamento comune non spiegato dai fondamentali, cioè la componente attribuita al sentiment.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Qual è un limite di interpretare le time dummies come «market sentiment»?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Catturano &lt;em&gt;tutto&lt;/em&gt; ciò che è comune ai Paesi del gruppo in un trimestre e non incluso nel modello: oltre al panico, anche variabili omesse (attese sui fondamentali futuri, rischi bancari, eventi politici). È una misura residuale, quindi indiretta. Lo stesso dubbio torna con lo studio di Aizenman et al. (sezione 9).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s6&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Decomposing the change in the spread&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 16-20 · Fig. 5.7 (fonte nella slide: De Grauwe e Ji, 2013a) e Fig. 11 del paper&lt;/p&gt;

  &lt;p&gt;La variazione dello spread tra 2008Q1 e 2011Q3 di ogni Paese viene scomposta in tre pezzi:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;ΔI&lt;sub&gt;i&lt;/sub&gt; = &lt;span style=&quot;color:var(--slate)&quot;&gt;Δβ&lt;sub&gt;t&lt;/sub&gt; (time component)&lt;/span&gt; + &lt;span style=&quot;color:var(--brick)&quot;&gt;Σ coeff × Δfondamentali (fundamental factors)&lt;/span&gt; + &lt;span style=&quot;color:var(--muted)&quot;&gt;residual&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px&quot;&gt;
      &lt;button class=&quot;btn&quot; id=&quot;dcEZ&quot; aria-pressed=&quot;true&quot;&gt;Eurozona&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;dcSA&quot; aria-pressed=&quot;false&quot;&gt;Stand-alone&lt;/button&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;dcSvg&quot; viewBox=&quot;0 0 680 320&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;time component&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;fundamental factors&lt;/span&gt;&lt;span style=&quot;--c:var(--rule)&quot;&gt;residual&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p id=&quot;dcMsg&quot; class=&quot;small&quot; style=&quot;min-height:3em&quot;&gt;Clicca una barra per il commento.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Altezze lette a occhio dai grafici delle slide 16-17 (punti percentuali); servono a confrontare le proporzioni.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;On the whole&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Portogallo e Irlanda&lt;/button&gt;&lt;button&gt;Spagna&lt;/button&gt;&lt;button&gt;Grecia&lt;/button&gt;&lt;button&gt;Core&lt;/button&gt;&lt;button&gt;Stand-alone&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Circa &lt;strong&gt;metà&lt;/strong&gt; della variazione dello spread è dovuta alle time dummies e metà ai fondamentali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Quasi tutto l&#x27;aumento è dovuto alle time dummies: i fondamentali c&#x27;entrano poco; la spiegazione è il cambiamento del sentiment verso la Spagna. Il &lt;strong&gt;caso più netto di sfiducia pura&lt;/strong&gt;: i mercati potrebbero aver &lt;em&gt;mispriced&lt;/em&gt; il rischio dei titoli spagnoli.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Circa il &lt;strong&gt;60%&lt;/strong&gt; dell&#x27;aumento è spiegato dal peggioramento dei fondamentali, meno del 40% dalle time dummies. Fondamentali cattivi &lt;em&gt;più&lt;/em&gt; sfiducia: i mercati prezzavano il rischio greco «con qualche fondamento».&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Fenomeno simile in &lt;strong&gt;sei Paesi core&lt;/strong&gt; (Austria, Belgio, Finlandia, Francia, Italia, Paesi Bassi nel grafico): la parte maggiore dell&#x27;aumento, comunque piccolo, viene dalle time dummies; i fondamentali spesso hanno contributo negativo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Variazioni minime per tutti, sotto i 2 punti: niente time component rilevante. Nessuna traccia di crisi auto-avverata fuori dall&#x27;unione monetaria.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;Il messaggio di policy&lt;/h4&gt;
    &lt;p&gt;C&#x27;è il &lt;strong&gt;rischio che i mercati spingano i Paesi in un bad equilibrium&lt;/strong&gt;, evitabile con politiche che tolgano il &lt;em&gt;fear factor&lt;/em&gt; dal mercato.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ctx&quot;&gt;&lt;p&gt;Un esempio storico di questo tipo di politica è l&#x27;annuncio del programma OMT (Outright Monetary Transactions) della BCE nel 2012, con cui la banca centrale si dichiarava pronta ad acquistare titoli dei Paesi in difficoltà: in pratica una funzione di lender of last resort. Le slide non lo nominano; se il corso lo tratta in un&#x27;altra lezione, collegalo qui.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;From liquidity crises to forced austerity&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 120&quot; role=&quot;img&quot; aria-label=&quot;Catena da sentiment ad austerità&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;57&quot;&gt;market sentiment&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;74&quot;&gt;(+ fundamentals)&lt;/text&gt;
        &lt;rect x=&quot;180&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;57&quot;&gt;spread ↑&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;74&quot;&gt;dal 2010&lt;/text&gt;
        &lt;rect x=&quot;355&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;57&quot;&gt;severe&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;74&quot;&gt;austerity&lt;/text&gt;
        &lt;rect x=&quot;530&quot; y=&quot;35&quot; width=&quot;145&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;602&quot; y=&quot;57&quot;&gt;debito/PIL ↑&lt;/text&gt;&lt;text x=&quot;602&quot; y=&quot;74&quot;&gt;(PIL ↓)&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-brick&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M146,60 H176&quot;/&gt;&lt;path d=&quot;M321,60 H351&quot;/&gt;&lt;path d=&quot;M496,60 H526&quot;/&gt;&lt;path d=&quot;M602,86 C602,118 75,118 75,90&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Slide 20: gli spread, guidati soprattutto dal sentiment, hanno imposto austerità che ha fatto salire il debito/PIL.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;Secondo la decomposizione, per quale Paese il caso di una crisi auto-avverata è più forte?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Spagna&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Grecia&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;Regno Unito&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Spagna: quasi tutto l&#x27;aumento viene dalla time component, cioè dal sentiment. In Grecia prevalgono i fondamentali (~60%); il Regno Unito è stand-alone e non mostra il fenomeno.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;La time component è uguale per Grecia, Irlanda, Portogallo e Spagna (circa 4,5 punti). Perché?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Perché le time dummies sono stimate per gruppo (periferia, core): β&lt;sub&gt;t&lt;/sub&gt; è comune a tutti i Paesi del gruppo in quel trimestre. Ciò che differenzia i Paesi sono i fondamentali e il residuo.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s7&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Altri studi: i credit default swap (CDS)&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 21-22, 25 · definizione da A. Carboni (2011), Banca d&#x27;Italia, Temi di discussione n. 821, citato nella slide&lt;/p&gt;

  &lt;p&gt;Altri studi arrivano a conclusioni simili? Il secondo paper, Aizenman, Hutchison e Jinjarak (2013), usa come misura del rischio non lo spread dei titoli ma lo &lt;strong&gt;spread dei CDS&lt;/strong&gt;.&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Credit default swap&lt;/h4&gt;
    &lt;p&gt;I &lt;em class=&quot;t&quot;&gt;credit default swap&lt;/em&gt; sono il tipo più comune di &lt;em&gt;credit derivatives&lt;/em&gt; (derivati sul credito). Un CDS è un &lt;strong&gt;contratto bilaterale&lt;/strong&gt; che assicura il valore nominale (&lt;em&gt;par value&lt;/em&gt;) di un titolo di riferimento: il &lt;em&gt;protection buyer&lt;/em&gt; paga una commissione periodica (lo spread) o un premio una tantum al &lt;em&gt;protection seller&lt;/em&gt;, che paga se durante il contratto si verifica un &lt;em&gt;credit event&lt;/em&gt; (default, ristrutturazione…).&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 170&quot; role=&quot;img&quot; aria-label=&quot;Schema di un CDS&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;78&quot; font-weight=&quot;600&quot;&gt;Protection buyer&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;98&quot; font-size=&quot;11&quot;&gt;detiene titoli di Stato&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;78&quot; font-weight=&quot;600&quot;&gt;Protection seller&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;98&quot; font-size=&quot;11&quot;&gt;banca, fondo…&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;40&quot;&gt;spread annuo (es. 197 bp del nozionale)&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;148&quot;&gt;se c&#x27;è un credit event: paga il valore nominale perso&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;65&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;f-paper s-rule&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;87&quot; font-size=&quot;11.5&quot;&gt;titolo di riferimento&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-slate&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M190,58 C300,40 380,40 488,58&quot;/&gt;&lt;path d=&quot;M490,108 C380,130 300,130 192,108&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Quotazione in basis points: calcolatore&lt;/h3&gt;
  &lt;p&gt;La convenzione è il premio &lt;em&gt;annuo&lt;/em&gt; in percentuale del nozionale. Nel paper: 1 bp = 1.000 $ per assicurare 10 milioni. Esempio della slide: 197 bp → 1,97% × 10 milioni = 197.000 $ l&#x27;anno.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;cdsBp&quot;&gt;CDS spread (bp)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cdsBp&quot; min=&quot;10&quot; max=&quot;2000&quot; step=&quot;1&quot; value=&quot;197&quot;&gt;&lt;output id=&quot;cdsBpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;cdsN&quot;&gt;Nozionale (milioni $)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cdsN&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cdsNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;cdsMsg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Prova 1026 bp: era il CDS medio della Grecia nel 2010 (Tab. 1 di Aizenman et al., slide 27).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cause comuni&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Secondo la letteratura, tassi sovrani e CDS spread hanno &lt;em&gt;cause sottostanti comuni&lt;/em&gt;, invece che l&#x27;uno guidare l&#x27;altro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Prima: OTC&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Prima della crisi i CDS erano scambiati &lt;em class=&quot;t&quot;&gt;over-the-counter&lt;/em&gt; (OTC): fuori dai mercati regolamentati, tramite broker o dealer.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dopo: più regole&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Dalla crisi finanziaria il trading di CDS è soggetto a più regolamentazione e contratti standardizzati.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;Nell&#x27;UE il Regolamento (UE) n. 236/2012 su short selling e CDS ha vietato, tra l&#x27;altro, i CDS «naked» sul debito sovrano, cioè acquistati senza detenere l&#x27;esposizione da assicurare. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/short-selling-of-securities.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;Chi era più assicurato? (slide 25)&lt;/h4&gt;
  &lt;p&gt;Ammontare nozionale lordo delle posizioni CDS sovrane in essere al 25 febbraio 2011 (miliardi $), cioè la somma dei capitali assicurati. Spiccano l&#x27;&lt;strong&gt;Italia&lt;/strong&gt; (quasi 300), poi &lt;strong&gt;Brasile&lt;/strong&gt;, &lt;strong&gt;Spagna&lt;/strong&gt;, &lt;strong&gt;Turchia&lt;/strong&gt; (circa 150-165), &lt;strong&gt;Messico&lt;/strong&gt; (~120), Russia (~100). L&#x27;Italia, il mercato di debito più grande della periferia, era il sovrano più assicurato al mondo.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;Un CDS sul debito portoghese quota 500 bp. Quanto costa l&#x27;anno assicurare 20 milioni di €?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;100.000 €&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;1.000.000 €&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;10.000.000 €&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;500 bp = 5% annuo; 5% × 20 milioni = 1 milione l&#x27;anno.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Perché un CDS spread è una buona misura del rischio di default percepito dai mercati?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;È il prezzo di mercato dell&#x27;assicurazione contro il default: più il mercato ritiene probabile un credit event, più il venditore di protezione chiede. A differenza dello spread sui titoli, non dipende dal benchmark tedesco ed è confrontabile tra Paesi con monete diverse: per questo si presta a un campione di 50 Paesi.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S8 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s8&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Aizenman, Hutchison &amp;amp; Jinjarak (2013)&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 21, 23-30 · &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34 (2013) 37-59&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Fatti&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;La percezione del rischio sovrano esplode nel 2010 in diversi Paesi europei e culmina nel &lt;em class=&quot;t&quot;&gt;selective default&lt;/em&gt; sul debito greco all&#x27;inizio del 2012.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Obiettivo&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Capire se l&#x27;alto rischio percepito per i Paesi dell&#x27;euro in difficoltà, misurato dai CDS spread, si spiega con i fondamentali passati o correnti: debito e deficit rispetto alle entrate fiscali, che chiamano &lt;em class=&quot;t&quot;&gt;de facto fiscal space&lt;/em&gt;, più altri determinanti.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;SWEAP&lt;/h4&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;South-West Euro Area Periphery&lt;/em&gt;: Grecia, Irlanda, Italia, Portogallo, Spagna. Notare che qui l&#x27;&lt;strong&gt;Italia è nella periferia&lt;/strong&gt;, mentre in De Grauwe e Ji compare tra i core.&lt;/p&gt;
  &lt;/div&gt;
  &lt;h4&gt;Domande di ricerca&lt;/h4&gt;
  &lt;ol&gt;
    &lt;li&gt;Il &lt;strong&gt;fiscal space&lt;/strong&gt; aiuta a spiegare in modo sistematico il prezzo del rischio, oltre a quanto già spiegato dagli altri indicatori macro?&lt;/li&gt;
    &lt;li&gt;Il rischio di alcuni mercati (es. SWEAP) era &lt;strong&gt;«overpriced»&lt;/strong&gt; (sopravvalutato) nel 2010, secondo le previsioni del modello basate sui valori effettivi di fiscal space e delle altre variabili?&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;I dati: CDS e fiscal space (Tab. 1, slide 27)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-cb=&quot;ahjTab&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;CDS 5 anni (bp)&lt;/button&gt;&lt;button&gt;Debito / base imponibile&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot; id=&quot;ahjT1&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot; id=&quot;ahjT2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;strong&gt;Il confronto chiave:&lt;/strong&gt; nel 2010 la Spagna ha debito/tasse di 1,7, &lt;em&gt;più basso&lt;/em&gt; della media OECD non-euro (1,9), ma un CDS di 348 bp contro 118. Il Portogallo (2,4) è simile ai Paesi a medio reddito (2,3) ma paga 497 bp contro 233. Tra parentesi nella slide le deviazioni standard dei gruppi.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Fig. 2 (slide 24): i CDS dei Paesi a medio reddito (Sudafrica, Panama, Malesia, Messico, Colombia) salgono nel 2008 e poi rientrano entro metà 2009; quelli SWEAP invece continuano a salire nel 2010-11 (Grecia oltre 8.000 bp a fine 2011). Lo stress finanziario globale era emerso a inizio 2008, drammatico a fine 2008, poi rientrato quasi ovunque tranne che nel gruppo SWEAP.&lt;/p&gt;

  &lt;h3&gt;Il modello: dynamic panel&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Y&lt;sub&gt;it&lt;/sub&gt; = a + θ·Y&lt;sub&gt;i,t−1&lt;/sub&gt; + X′&lt;sub&gt;it&lt;/sub&gt;β + ε&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card small&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Y&lt;/strong&gt;: CDS spread sovrano a 5 anni · &lt;strong&gt;50 Paesi&lt;/strong&gt; · 2005-2010 (annuale).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Y&lt;sub&gt;t−1&lt;/sub&gt;&lt;/strong&gt;: la variabile dipendente ritardata: il CDS di quest&#x27;anno dipende da quello dell&#x27;anno scorso (persistenza). Per questo il modello è &lt;em class=&quot;t&quot;&gt;dynamic&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;X&lt;/strong&gt;: vettore di controlli, incluse le misure di fiscal space (debito/tasse, saldo di bilancio/tasse), più TED spread, trade/GDP, inflazione, external debt/GDP, e le time dummies interagite con le dummies Euro e SWEAP.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Perché non OLS?&lt;/strong&gt; Con gli effetti fissi, la variabile ritardata Y&lt;sub&gt;t−1&lt;/sub&gt; è correlata con l&#x27;errore non osservabile: la stima sarebbe distorta.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Soluzione:&lt;/strong&gt; stimatore &lt;em class=&quot;t&quot;&gt;Arellano-Bond GMM&lt;/em&gt; a variabili strumentali: si prendono le differenze prime (eliminando l&#x27;effetto fisso) e si usano i ritardi più lontani di Y come strumenti.&lt;/p&gt;
      &lt;p&gt;Varianti con &lt;em&gt;fixed effects&lt;/em&gt; e con &lt;em&gt;clustered standard errors&lt;/em&gt;. Dopo la stima: &lt;strong&gt;prediction error&lt;/strong&gt; in-sample e out-of-sample (sezione 9).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Che cos&#x27;è il TED spread?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dalla nota della Tab. 2: tasso LIBOR a 3 mesi in dollari meno rendimento dei Treasury USA a 3 mesi. Misura lo stress nel mercato interbancario e il rischio globale: quando le banche non si fidano l&#x27;una dell&#x27;altra, il LIBOR sale rispetto al titolo sicuro.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Risultati (Tab. 2, slide 29-30)&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;+1 punto di &lt;strong&gt;debt/tax&lt;/strong&gt; → CDS spread &lt;strong&gt;+15 a +81 bp&lt;/strong&gt; (14,7*** con clustered s.e.; 81,0*** con fixed effects).&lt;/li&gt;
    &lt;li&gt;+1 punto di &lt;strong&gt;fiscal balance/tax base&lt;/strong&gt; (saldo di bilancio migliore) → CDS &lt;strong&gt;−194 a −829 bp&lt;/strong&gt;.&lt;/li&gt;
    &lt;li&gt;Stime molto significative; le basse vengono dai clustered standard errors, le alte dagli effetti fissi.&lt;/li&gt;
    &lt;li&gt;Da guardare anche le &lt;strong&gt;time dummies&lt;/strong&gt; e le loro interazioni con le dummies Euro e SWEAP:&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Calcola il «premio SWEAP» per anno&lt;/h4&gt;
    &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot; id=&quot;t2cols&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot; id=&quot;t2tbl&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;t2msg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Ipotesi di lettura: i Paesi SWEAP sono anche nell&#x27;euro, quindi il loro effetto d&#x27;anno è t + t×Euro + t×SWEAP. Coefficienti dalla Tab. 2; somma fatta per questa pagina.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Nel 2008 le interazioni Euro e SWEAP sono &lt;strong&gt;negative&lt;/strong&gt;: lo shock globale colpisce meno l&#x27;euro. Nel 2010 l&#x27;interazione SWEAP è grande e positiva (fino a +324 bp, *** in 3 colonne su 4): un premio di rischio che le variabili del modello non spiegano.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;Perché Aizenman et al. usano lo stimatore di Arellano-Bond invece di una semplice regressione con effetti fissi?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Perché hanno troppi Paesi&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Perché i CDS sono misurati in basis points&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Perché la variabile dipendente ritardata è correlata con l&#x27;errore non osservabile, e la stima sarebbe distorta&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;È il problema del dynamic panel: con Y&lt;sub&gt;t−1&lt;/sub&gt; tra i regressori, gli effetti fissi generano correlazione con l&#x27;errore. Arellano-Bond usa differenze prime e ritardi come strumenti (GMM).&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Che cosa indica un coefficiente t2010×SWEAP = +261,9***?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Nel 2010 i CDS dei Paesi SWEAP erano in media circa 262 bp più alti di quanto spiegato dalle altre variabili (fiscal space, macro, effetto anno comune e effetto euro). È l&#x27;equivalente della time dummy della periferia in De Grauwe e Ji.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S9 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s9&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;h2&gt;Prediction errors e due interpretazioni&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 31-34&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Prediction error = CDS effettivo / CDS previsto&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;Out-of-sample&lt;/strong&gt;: il modello è stimato solo sul periodo pre-crisi (2005-07) e poi usato per prevedere il 2008-10. &lt;strong&gt;In-sample&lt;/strong&gt;: stimato su tutto il periodo 2005-10. Un valore &amp;gt; 1 è &lt;em class=&quot;t&quot;&gt;under-prediction&lt;/em&gt;: il CDS effettivo supera quello previsto, cioè il rischio sovrano è &lt;strong&gt;over-priced&lt;/strong&gt; rispetto ai fondamentali. Esempio: 6,5 = il mercato chiede 6,5 volte quanto previsto.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot; id=&quot;peBtns&quot;&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:8px 0 0&quot;&gt;&lt;svg id=&quot;peSvg&quot; viewBox=&quot;0 0 680 280&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;out-of-sample&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;in-sample&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p id=&quot;peMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Dati dalla Tab. 4 (slide 32). Scala in rapporto: la linea a 1 = previsione perfetta.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h4&gt;Cosa dicono i numeri&lt;/h4&gt;
  &lt;ul&gt;
    &lt;li&gt;Gli errori sono enormi ovunque durante la crisi, soprattutto out-of-sample: nel 2008-10 i CDS effettivi superano le previsioni di &lt;strong&gt;2,3 volte&lt;/strong&gt; (medio reddito) fino a &lt;strong&gt;12,9&lt;/strong&gt; (OECD non-euro). Sottostime di questa entità sono &lt;em&gt;straordinarie&lt;/em&gt;.&lt;/li&gt;
    &lt;li&gt;Per i SWEAP, nella media 2008-10, gli errori non sono particolarmente alti in termini relativi: da 2,6 (Italia) a 5,3 (Irlanda).&lt;/li&gt;
    &lt;li&gt;Ma il &lt;strong&gt;profilo nel tempo&lt;/strong&gt; diverge: l&#x27;OECD non-euro ha un errore di 31,6 nel 2008 (shock globale), poi 1,6 nel 2009 e 5,4 nel 2010. I SWEAP hanno errori relativamente bassi nel 2008 che salgono nel 2009 e soprattutto nel 2010 (Spagna 6,5, Irlanda 7,9, Portogallo 6,9). Forse un effetto di &lt;em class=&quot;t&quot;&gt;contagion&lt;/em&gt; (contagio).&lt;/li&gt;
    &lt;li&gt;Anche l&#x27;euro esclusi i SWEAP ha un picco nel 2010 (13,7).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Inoltre, confrontando i SWEAP con cinque Paesi a medio reddito fuori dall&#x27;Europa con fiscal space simile, nel 2010 il rischio di default della periferia è prezzato &lt;strong&gt;molto più alto&lt;/strong&gt;, anche tenendo conto delle differenze nei fondamentali (abstract, slide 23).&lt;/p&gt;

  &lt;h3&gt;Due letture degli stessi dati&lt;/h3&gt;
  &lt;div class=&quot;vs&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;
      &lt;span class=&quot;pill&quot;&gt;Interpretazione A&lt;/span&gt;
      &lt;h4&gt;Future fundamentals&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;Il mercato CDS prezza il default non sui fondamentali &lt;em&gt;correnti&lt;/em&gt; ma su quelli &lt;em&gt;futuri&lt;/em&gt;, aspettandosi un forte peggioramento del fiscal space SWEAP.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Coerente con il &lt;strong&gt;selective default greco del 2012&lt;/strong&gt;. L&#x27;aggiustamento dei SWEAP è visto come &lt;em&gt;economicamente e politicamente più difficile&lt;/em&gt;, per la rigidità del cambio legata all&#x27;euro, vincolo che i Paesi a medio reddito non hanno.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;strong&gt;Mercati razionali&lt;/strong&gt;, che guardano avanti.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mid&quot;&gt;oppure&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;
      &lt;span class=&quot;pill&quot;&gt;Interpretazione B&lt;/span&gt;
      &lt;h4&gt;Multiple equilibria e contagion&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;Coerente con il modello di &lt;strong&gt;Calvo (1988)&lt;/strong&gt; e con De Grauwe e Ji (2012): il rischio sovrano segue &lt;em class=&quot;t&quot;&gt;waves of contagion&lt;/em&gt;, reagendo in eccesso e prezzando male il rischio per anni.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Prima, &lt;em class=&quot;t&quot;&gt;contagious optimism&lt;/em&gt;: rischio sottoprezzato, specie al decimo anniversario dell&#x27;euro. Nel 2010 si passa dall&#x27;equilibrio «buono» (ottimista) a quello «cattivo» (pessimista): CDS altissimi → peggiorano i bilanci → &lt;strong&gt;self-fulfilling prophecy crisis&lt;/strong&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;strong&gt;Mercati che sbagliano&lt;/strong&gt; in entrambe le direzioni.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 240&quot; role=&quot;img&quot; aria-label=&quot;Equilibri multipli: good e bad equilibrium&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;640&quot; y2=&quot;200&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;60&quot; y2=&quot;20&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;rischio di default atteso dagli investitori (→ tassi richiesti)&lt;/text&gt;
      &lt;text x=&quot;22&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 22 110)&quot;&gt;rischio di default che ne risulta&lt;/text&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;620&quot; y2=&quot;30&quot; class=&quot;s-rule&quot; stroke-dasharray=&quot;4 4&quot; style=&quot;stroke:var(--muted)&quot;/&gt;
      &lt;text x=&quot;610&quot; y=&quot;50&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;45°: aspettative = esito&lt;/text&gt;
      &lt;path d=&quot;M60,186 C110,178 135,172 160,170 S330,152 420,118 S505,70 534,56 S590,30 625,16&quot; class=&quot;s-slate&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;/&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;170&quot; r=&quot;7&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;190&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;good equilibrium&lt;/text&gt;
      &lt;circle cx=&quot;534&quot; cy=&quot;57&quot; r=&quot;7&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;85&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;end&quot;&gt;bad equilibrium&lt;/text&gt;
      &lt;path d=&quot;M200,160 Q360,150 500,70&quot; class=&quot;s-brick&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; stroke-dasharray=&quot;3 3&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;160&quot; font-size=&quot;11&quot; style=&quot;fill:var(--brick)&quot;&gt;panico: salto di equilibrio&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema qualitativo (non nelle slide) dell&#x27;idea di Calvo: dove le aspettative incrociano l&#x27;esito ci sono più punti di equilibrio con gli stessi fondamentali. Le aspettative decidono dove si finisce.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;Un prediction error out-of-sample di 7,9 per l&#x27;Irlanda nel 2010 significa che…&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;il modello ha sovrastimato il CDS irlandese di 7,9 bp&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;il CDS effettivo era 7,9 volte quello previsto dal modello stimato sul 2005-07&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;i fondamentali irlandesi sono peggiorati del 790%&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;L&#x27;errore è un rapporto effettivo/previsto. Valori &amp;gt; 1 indicano under-prediction, cioè rischio over-priced rispetto ai fondamentali.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Quale fatto sostiene l&#x27;interpretazione A (future fundamentals), e quale debolezza ha?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;A favore: il default selettivo greco del 2012 ha dimostrato che il rischio era reale, e i Paesi euro non possono svalutare. Debolezza: se il pessimismo stesso peggiora i fondamentali futuri (tassi alti → austerità → recessione), «prezzare i fondamentali futuri» e «crisi auto-avverata» diventano difficili da distinguere nei dati: i fondamentali futuri non sono indipendenti dalle aspettative.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S10 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s10&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;h2&gt;Confronto tra i due studi e domande d&#x27;esame&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 35 (domande); tabella di confronto costruita dalle slide 3-34&lt;/p&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;De Grauwe &amp;amp; Ji (2013)&lt;/th&gt;&lt;th&gt;Aizenman, Hutchison &amp;amp; Jinjarak (2013)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Variabile dipendente&lt;/td&gt;&lt;td&gt;Spread dei titoli a 10 anni&lt;/td&gt;&lt;td&gt;CDS spread sovrano a 5 anni (bp)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Campione&lt;/td&gt;&lt;td&gt;Eurozona + 14 stand-alone, trimestrale 2000Q1-2011Q3&lt;/td&gt;&lt;td&gt;50 Paesi, annuale 2005-2010&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fundamentals&lt;/td&gt;&lt;td&gt;Debt/GDP o fiscal space (anche al quadrato), current account accumulato, REE, growth (+ cambio per stand-alone)&lt;/td&gt;&lt;td&gt;Debt/tax, fiscal balance/tax (fiscal space de facto), TED spread, trade/GDP, inflazione, external debt/GDP&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Metodo&lt;/td&gt;&lt;td&gt;Panel con country fixed effects + time dummies&lt;/td&gt;&lt;td&gt;Dynamic panel (Y&lt;sub&gt;t−1&lt;/sub&gt;), Arellano-Bond GMM; time dummies × Euro × SWEAP&lt;/td&gt;&lt;/tr&gt;
