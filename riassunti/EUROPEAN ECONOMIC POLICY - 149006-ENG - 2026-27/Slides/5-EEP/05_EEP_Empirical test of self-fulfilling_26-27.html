      &lt;tr&gt;&lt;td&gt;Misura del sentiment&lt;/td&gt;&lt;td&gt;Coefficienti delle time dummies, decomposizione&lt;/td&gt;&lt;td&gt;Interazioni anno × SWEAP; prediction errors&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Confronto&lt;/td&gt;&lt;td&gt;14 Paesi stand-alone sviluppati&lt;/td&gt;&lt;td&gt;Gruppi di Paesi; 5 Paesi a medio reddito con fiscal space simile&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Conclusione&lt;/td&gt;&lt;td&gt;Parte rilevante degli spread periferici 2010-11 scollegata dai fondamentali: self-fulfilling, bad equilibria&lt;/td&gt;&lt;td&gt;Rischio SWEAP prezzato molto più alto nel 2010; due letture: future fundamentals o equilibrio pessimista&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Le domande della slide finale, con tracce di risposta&lt;/h3&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;1 · Se le percezioni di rischio sono guidate da panico e contagio, come misurarle in un modello empirico?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Non sono osservabili, quindi si misurano &lt;strong&gt;come residuo&lt;/strong&gt;: si stima ciò che i fondamentali spiegano e si attribuisce il resto al sentiment. Strumenti visti: time dummies β&lt;sub&gt;t&lt;/sub&gt; (De Grauwe-Ji), interazioni anno × gruppo e prediction errors (Aizenman et al.). Il control group serve a separare il panico specifico dell&#x27;unione monetaria dagli shock globali. Limite: il residuo contiene anche variabili omesse.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;2 · Quali fondamentali usano De Grauwe e Ji? Confrontali con Aizenman et al.&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Vedi la tabella sopra. In comune: il &lt;strong&gt;fiscal space&lt;/strong&gt; (debito/entrate). De Grauwe-Ji aggiungono debt/GDP, la non-linearità (quadrato), squilibri esterni (current account accumulato) e competitività (REE). Aizenman et al. aggiungono il saldo di bilancio/tasse, indicatori di rischio globale (TED spread), apertura, inflazione, debito estero e la dinamica (CDS ritardato). Commento: l&#x27;esito «c&#x27;è un residuo non spiegato» regge con due set di variabili diversi, il che rafforza il risultato, ma entrambi usano fondamentali &lt;em&gt;correnti&lt;/em&gt; e non le aspettative su quelli futuri.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;3 · Perché gli investitori prezzavano i CDS SWEAP più del control group?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;(a) &lt;strong&gt;Vincoli dell&#x27;euro&lt;/strong&gt;: niente svalutazione né banca centrale nazionale come lender of last resort, quindi aggiustamento più difficile economicamente e politicamente; (b) &lt;strong&gt;attese di fondamentali futuri peggiori&lt;/strong&gt; (confermate dal default greco 2012); (c) &lt;strong&gt;contagio e cambio di equilibrio&lt;/strong&gt;: dopo anni di ottimismo eccessivo, passaggio a un equilibrio pessimista (Calvo 1988; De Grauwe-Ji 2012).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;4 · L&#x27;analisi di De Grauwe e Ji sostiene l&#x27;ipotesi di self-fulfilling debt crisis?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;In larga parte sì: time component forte nella periferia e assente negli stand-alone; il debito pesa sugli spread solo nell&#x27;EZ; la Spagna è spiegata quasi solo dal sentiment. Con cautele: in Grecia contano soprattutto i fondamentali; la time dummy è un residuo e può includere fattori omessi (es. attese sul futuro, legame banche-Stato); il periodo finisce nel 2011Q3. Aizenman et al. confermano il prezzo anomalo ma lasciano aperta l&#x27;interpretazione «razionale».&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica finale&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;Quale risultato è comune ai due studi?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Nel 2010 il rischio della periferia euro è prezzato più di quanto spieghino i fondamentali correnti&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Il debito pubblico non influenza mai il prezzo del rischio&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;La Grecia è il caso più chiaro di crisi puramente auto-avverata&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Sì. b è falso: in entrambi i lavori debito e fiscal space sono significativi (nell&#x27;EZ). c è falso: in De Grauwe-Ji la Grecia è il caso con più peso dei fondamentali; il caso più «puro» è la Spagna.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Autori, studi e fonti citati nelle slide. Descrizioni e link da ricerca web (ottobre 2026): ogni voce è una &lt;strong&gt;fonte esterna&lt;/strong&gt;, distinta dal contenuto delle slide.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, Y. Ji (2013), «Self-fulfilling crises in the Eurozone: An empirical test», &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34, 15-36&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Il primo paper della lezione. Circolato nel 2012 come CESifo Working Paper n. 3821 e come paper CEPS, con lo stesso abstract. Conta perché è la prova empirica principale a sostegno della fragility hypothesis.
      &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/49648&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://www.cesifo.org/en/publications/2012/working-paper/self-fulfilling-crises-eurozone-empirical-test&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CESifo WP 3821&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;J. Aizenman, M. Hutchison, Y. Jinjarak (2013), «What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk», &lt;em&gt;JIMF&lt;/em&gt; 34, 37-59&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Il secondo paper. Uscito prima come NBER Working Paper 17407 (settembre 2011). Attenzione: alcune versioni parlano di sessanta Paesi, quella nelle slide di cinquanta. È il riferimento per il fiscal space «de facto» (debito e deficit rispetto alle entrate). La slide 10 cita la definizione come «Aizenman and Hutchison (2012)»: la ricerca non ha trovato un lavoro con quel titolo e anno esatti, ma questo paper usa la stessa definizione.
      &lt;a href=&quot;https://www.nber.org/papers/w17407&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w17407&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, Y. Ji (2012), «Mispricing of sovereign risk and macroeconomic stability in the Eurozone», &lt;em&gt;Journal of Common Market Studies&lt;/em&gt; 50(6), 866-880&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Citato nella slide 34 come base dell&#x27;interpretazione «multiple equilibria». Sostiene che il mispricing sistematico del rischio sovrano amplifica l&#x27;instabilità: bolle negli anni buoni, austerità eccessiva in quelli cattivi. Versione divulgativa su VoxEU.
      &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/47134&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://cepr.org/voxeu/columns/mispricing-sovereign-risk-and-multiple-equilibria-eurozone&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;G. A. Calvo (1988), «Servicing the public debt: the role of expectations», &lt;em&gt;American Economic Review&lt;/em&gt; 78(4), 647-661&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Il modello teorico di riferimento per gli equilibri multipli (slide 34). Mostra che il debito pubblico può generare più equilibri con aspettative perfette quando il ripudio, aperto o tramite inflazione, è possibile. L&#x27;AEA gli riconosce di aver introdotto per primo la sfiducia auto-avverante sul rimborso del debito sovrano.
      &lt;a href=&quot;https://ideas.repec.org/a/aea/aecrev/v78y1988i4p647-61.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://www.aeaweb.org/about-aea/honors-awards/distinguished-fellows/guillermo-calvo&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AEA, Distinguished Fellow 2023&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;A. Carboni (2011), «The sovereign credit default swap market: price discovery, volumes and links with banks&#x27; risk premia», Banca d&#x27;Italia, Temi di discussione n. 821&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Fonte della definizione di CDS nella slide 22. Dati bibliografici confermati; il contenuto del paper non è stato verificato oltre al titolo.
      &lt;a href=&quot;https://ideas.repec.org/p/bdi/wptemi/td_821_11.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;M. Arellano, S. Bond (1991), «Some tests of specification for panel data: Monte Carlo evidence and an application to employment equations», &lt;em&gt;Review of Economic Studies&lt;/em&gt; 58(2), 277-297&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Origine dello stimatore GMM usato da Aizenman et al. (slide 28) per i dynamic panel con effetti individuali e variabile dipendente ritardata. Propone anche un test di correlazione seriale sui residui.
      &lt;a href=&quot;https://ideas.repec.org/a/oup/restud/v58y1991i2p277-297..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Arellano%E2%80%93Bond_estimator&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia (introduzione)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, &lt;em&gt;Economics of Monetary Union&lt;/em&gt;, Oxford University Press&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Il manuale da cui proviene la «Figure 5.7» della slide 16. Le edizioni trovate arrivano almeno al 2020 (con aggiornamenti su regole fiscali UE e QE della BCE); controlla quale edizione adotta il corso.
      &lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda catalogo College of Europe&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;Il selective default della Grecia (2012)&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Citato nelle slide 26 e 33. A febbraio 2012 S&amp;amp;P ha abbassato la Grecia a «SD» dopo l&#x27;inserimento retroattivo di clausole di azione collettiva e il lancio dello scambio di titoli con i privati (PSI): taglio del valore nominale del 53,5%, e circa 74% in valore attuale.
      &lt;a href=&quot;https://www.streetinsider.com/Credit+Ratings/Standard+%26+Poor%27s+Downgrades+Greece+to+%27Selective+Default%27/7217704.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato S&amp;amp;P (riportato da StreetInsider)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;Fonte esterna&lt;/span&gt;
      &lt;h4&gt;Regolamento (UE) n. 236/2012 su short selling e credit default swap&lt;/h4&gt;
