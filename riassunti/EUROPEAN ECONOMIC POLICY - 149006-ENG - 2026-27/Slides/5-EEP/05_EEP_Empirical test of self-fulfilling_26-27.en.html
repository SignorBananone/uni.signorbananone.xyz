      &lt;tr&gt;&lt;td&gt;Sample&lt;/td&gt;&lt;td&gt;Eurozone + 14 stand-alone countries, quarterly 2000Q1-2011Q3&lt;/td&gt;&lt;td&gt;50 countries, annual 2005-2010&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Fundamentals&lt;/td&gt;&lt;td&gt;Debt/GDP or fiscal space (also squared), accumulated current account, REE, growth (+ exchange rate for stand-alone)&lt;/td&gt;&lt;td&gt;Debt/tax, fiscal balance/tax (de facto fiscal space), TED spread, trade/GDP, inflation, external debt/GDP&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Method&lt;/td&gt;&lt;td&gt;Panel with country fixed effects + time dummies&lt;/td&gt;&lt;td&gt;Dynamic panel (Y&lt;sub&gt;t−1&lt;/sub&gt;), Arellano-Bond GMM; time dummies × Euro × SWEAP&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Measure of sentiment&lt;/td&gt;&lt;td&gt;Time dummy coefficients, decomposition&lt;/td&gt;&lt;td&gt;Year × SWEAP interactions; prediction errors&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Comparison&lt;/td&gt;&lt;td&gt;14 developed stand-alone countries&lt;/td&gt;&lt;td&gt;Country groups; 5 middle-income countries with similar fiscal space&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Conclusion&lt;/td&gt;&lt;td&gt;A substantial part of peripheral spreads in 2010-11 disconnected from fundamentals: self-fulfilling, bad equilibria&lt;/td&gt;&lt;td&gt;SWEAP risk priced much higher in 2010; two readings: future fundamentals or pessimistic equilibrium&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;The questions on the final slide, with answer outlines&lt;/h3&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;1 · If risk perceptions are driven by panic and contagion, how can they be measured in an empirical model?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;They are unobservable, so they are measured &lt;strong&gt;as a residual&lt;/strong&gt;: one estimates what fundamentals explain and attributes the remainder to sentiment. Tools seen: time dummies β&lt;sub&gt;t&lt;/sub&gt; (De Grauwe-Ji), year × group interactions and prediction errors (Aizenman et al.). The control group serves to separate panic specific to the monetary union from global shocks. Limitation: the residual also contains omitted variables.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;2 · Which fundamentals do De Grauwe and Ji use? Compare them with Aizenman et al.&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;See the table above. In common: &lt;strong&gt;fiscal space&lt;/strong&gt; (debt/revenue). De Grauwe-Ji add debt/GDP, non-linearity (squared term), external imbalances (accumulated current account) and competitiveness (REE). Aizenman et al. add the fiscal balance/tax ratio, global risk indicators (TED spread), openness, inflation, external debt and dynamics (lagged CDS). Comment: the finding that “there is an unexplained residual” holds with two different sets of variables, which strengthens the result, but both use &lt;em&gt;current&lt;/em&gt; fundamentals rather than expectations of future ones.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;3 · Why did investors price SWEAP CDS higher than the control group?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;(a) &lt;strong&gt;Constraints of the euro&lt;/strong&gt;: no devaluation and no national central bank as lender of last resort, hence adjustment that is economically and politically harder; (b) &lt;strong&gt;expectations of worse future fundamentals&lt;/strong&gt; (confirmed by the Greek default of 2012); (c) &lt;strong&gt;contagion and a switch of equilibrium&lt;/strong&gt;: after years of excessive optimism, a shift to a pessimistic equilibrium (Calvo 1988; De Grauwe-Ji 2012).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;4 · Does De Grauwe and Ji&#x27;s analysis support the self-fulfilling debt crisis hypothesis?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Largely yes: a strong time component in the periphery and none in stand-alone countries; debt affects spreads only in the EZ; Spain is explained almost entirely by sentiment. With caveats: in Greece fundamentals matter most; the time dummy is a residual and may include omitted factors (e.g. expectations about the future, the bank-sovereign nexus); the sample ends in 2011Q3. Aizenman et al. confirm the anomalous pricing but leave the “rational” interpretation open.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Final self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;Which finding is common to both studies?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;In 2010 the risk of the euro periphery is priced higher than current fundamentals can explain&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Public debt never affects the pricing of risk&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Greece is the clearest case of a purely self-fulfilling crisis&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Yes. b is false: in both papers debt and fiscal space are significant (in the EZ). c is false: in De Grauwe-Ji, Greece is the case where fundamentals weigh most; the “purest” case is Spain.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Authors, studies and sources cited in the slides. Descriptions and links from web research (October 2026): each entry is an &lt;strong&gt;external source&lt;/strong&gt;, distinct from the content of the slides.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, Y. Ji (2013), “Self-fulfilling crises in the Eurozone: An empirical test”, &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34, 15-36&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;The first paper of the lecture. Circulated in 2012 as CESifo Working Paper no. 3821 and as a CEPS paper, with the same abstract. It matters because it is the main empirical evidence supporting the fragility hypothesis.
      &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/49648&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://www.cesifo.org/en/publications/2012/working-paper/self-fulfilling-crises-eurozone-empirical-test&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CESifo WP 3821&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;J. Aizenman, M. Hutchison, Y. Jinjarak (2013), “What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk”, &lt;em&gt;JIMF&lt;/em&gt; 34, 37-59&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;The second paper. First released as NBER Working Paper 17407 (September 2011). Note: some versions refer to sixty countries, the one in the slides to fifty. It is the reference for “de facto” fiscal space (debt and deficits relative to revenue). Slide 10 cites the definition as “Aizenman and Hutchison (2012)”: the search found no work with exactly that title and year, but this paper uses the same definition.
      &lt;a href=&quot;https://www.nber.org/papers/w17407&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w17407&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, Y. Ji (2012), “Mispricing of sovereign risk and macroeconomic stability in the Eurozone”, &lt;em&gt;Journal of Common Market Studies&lt;/em&gt; 50(6), 866-880&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Cited on slide 34 as the basis of the “multiple equilibria” interpretation. It argues that systematic mispricing of sovereign risk amplifies instability: bubbles in good years, excessive austerity in bad ones. Non-technical version on VoxEU.
      &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/47134&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt; · &lt;a href=&quot;https://cepr.org/voxeu/columns/mispricing-sovereign-risk-and-multiple-equilibria-eurozone&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VoxEU&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;G. A. Calvo (1988), “Servicing the public debt: the role of expectations”, &lt;em&gt;American Economic Review&lt;/em&gt; 78(4), 647-661&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;The reference theoretical model for multiple equilibria (slide 34). It shows that public debt can generate multiple equilibria under perfect foresight when repudiation, whether outright or through inflation, is possible. The AEA credits it with being the first to introduce self-fulfilling distrust about sovereign debt repayment.
      &lt;a href=&quot;https://ideas.repec.org/a/aea/aecrev/v78y1988i4p647-61.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://www.aeaweb.org/about-aea/honors-awards/distinguished-fellows/guillermo-calvo&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AEA, Distinguished Fellow 2023&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;A. Carboni (2011), “The sovereign credit default swap market: price discovery, volumes and links with banks&#x27; risk premia”, Banca d&#x27;Italia, Temi di discussione (Working Papers) no. 821&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Source of the CDS definition on slide 22. Bibliographic details confirmed; the content of the paper has not been verified beyond the title.
      &lt;a href=&quot;https://ideas.repec.org/p/bdi/wptemi/td_821_11.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;M. Arellano, S. Bond (1991), “Some tests of specification for panel data: Monte Carlo evidence and an application to employment equations”, &lt;em&gt;Review of Economic Studies&lt;/em&gt; 58(2), 277-297&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Origin of the GMM estimator used by Aizenman et al. (slide 28) for dynamic panels with individual effects and a lagged dependent variable. It also proposes a test for serial correlation in the residuals.
      &lt;a href=&quot;https://ideas.repec.org/a/oup/restud/v58y1991i2p277-297..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Arellano%E2%80%93Bond_estimator&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia (introduction)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;P. De Grauwe, &lt;em&gt;Economics of Monetary Union&lt;/em&gt;, Oxford University Press&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;The textbook from which “Figure 5.7” on slide 16 is taken. The editions found go up to at least 2020 (with updates on EU fiscal rules and ECB QE); check which edition the course adopts.
      &lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;College of Europe catalogue entry&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;Greece&#x27;s selective default (2012)&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Cited on slides 26 and 33. In February 2012 S&amp;amp;P downgraded Greece to “SD” after the retroactive insertion of collective action clauses and the launch of the bond exchange with private creditors (PSI): a 53.5% cut in nominal value, and about 74% in present-value terms.
      &lt;a href=&quot;https://www.streetinsider.com/Credit+Ratings/Standard+%26+Poor%27s+Downgrades+Greece+to+%27Selective+Default%27/7217704.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;S&amp;amp;P press release (reported by StreetInsider)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;Regulation (EU) No 236/2012 on short selling and credit default swaps&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;An example of the “more regulation” of CDS mentioned on slide 22: among other things, it bans “naked” sovereign CDS.
      &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/short-selling-of-securities.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex summary&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;span class=&quot;pill&quot; style=&quot;--tint:var(--slate);--tint-bg:var(--slate-bg)&quot;&gt;External source&lt;/span&gt;
      &lt;h4&gt;AMECO, the macroeconomic database of the European Commission (DG ECFIN)&lt;/h4&gt;
      &lt;p class=&quot;why&quot;&gt;Source of the debt data in Fig. 1 (slide 7). Annual series reported by Member States and checked by the Commission; an official, freely accessible source for various public finance aggregates. The other sources in the figures (Datastream, Eurostat, OECD) are databases of market data and official statistics.
      &lt;a href=&quot;https://data.ecb.europa.eu/data/datasets/AME/data-information&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AMECO on the ECB Data Portal&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
  &lt;/div&gt;
