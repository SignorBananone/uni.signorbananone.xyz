        &lt;a href=&quot;#s7&quot;&gt;&lt;rect x=&quot;580&quot; y=&quot;200&quot; width=&quot;240&quot; height=&quot;48&quot; rx=&quot;10&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;7 · CDS&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;239&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;credit default swaps and basis points&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s8&quot;&gt;&lt;rect x=&quot;570&quot; y=&quot;284&quot; width=&quot;260&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;8 · Aizenman et al. (2013)&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;321&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;dynamic panel · SWEAP dummies&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s9&quot;&gt;&lt;rect x=&quot;570&quot; y=&quot;366&quot; width=&quot;260&quot; height=&quot;46&quot; rx=&quot;10&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;386&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;9 · Prediction errors&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;403&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;future fundamentals or Calvo (1988)?&lt;/text&gt;&lt;/a&gt;

&lt;!-- S1 --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;What a self-fulfilling debt crisis is and how to recognise one&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 1-2&lt;/p&gt;

  &lt;p&gt;The question of the lecture: &lt;strong&gt;did the Eurozone (EZ) experience a self-fulfilling debt crisis?&lt;/strong&gt; And which signals would make it visible in the data?&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Self-fulfilling debt crisis&lt;/h4&gt;
    &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;self-fulfilling crisis&lt;/em&gt; is a crisis triggered by &lt;em&gt;expectations themselves&lt;/em&gt;: if investors fear a default and demand higher interest rates, the cost of debt rises so much that default actually becomes more likely. The pessimistic prophecy comes true because it was believed.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Spread&lt;/h4&gt;
    &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;spread&lt;/em&gt; is the difference between the yield on a country&#x27;s 10-year government bond and that on a benchmark bond regarded as safe (in the Eurozone, usually the German Bund). It measures the risk premium that markets demand for lending to that government. Example: Italian BTP at 5.5% and Bund at 2.0% → spread = 3.5 percentage points = 350 &lt;em&gt;basis points&lt;/em&gt; (1 bp = 0.01%).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The logic: why in a monetary union?&lt;/h3&gt;
  &lt;p&gt;In the slides: “in a monetary union, movements of distrust towards a country lead to an increase in the yield on its government bonds → an increase in the spread”. The step taken for granted is the reason why.&lt;/p&gt;
  &lt;div class=&quot;ctx&quot;&gt;
    &lt;p&gt;This is De Grauwe&#x27;s &lt;strong&gt;fragility hypothesis&lt;/strong&gt;, mentioned on slide 13 (“fragility hypothesis”). A Eurozone country issues debt in a currency it &lt;em&gt;does not control&lt;/em&gt;: its national central bank cannot print euros to repay maturing bonds. A &lt;em class=&quot;t&quot;&gt;stand-alone&lt;/em&gt; country (with its own currency, such as the United Kingdom) can instead always pay in its own currency, because the central bank acts as &lt;em&gt;lender of last resort&lt;/em&gt;. Hence in the EZ a &lt;em&gt;liquidity&lt;/em&gt; problem (being unable to find buyers to roll over the debt) can turn into a &lt;em&gt;solvency&lt;/em&gt; problem. This makes &lt;em class=&quot;t&quot;&gt;multiple equilibria&lt;/em&gt; possible: with the same fundamentals, a country can end up in a “good” equilibrium (low interest rates) or a “bad” one (high interest rates and default).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 1 · Confidence shock&lt;/span&gt;&lt;p&gt;Investors begin to doubt an EZ country (because of an event, a piece of news, contagion from another country). They sell its bonds.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 2 · The spread rises&lt;/span&gt;&lt;p&gt;Bond prices fall and yields rise: the spread widens. The government has to refinance itself at higher interest rates.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 3 · Liquidity squeeze&lt;/span&gt;&lt;p&gt;Without a national central bank guaranteeing the rollover of debt, the government risks finding no buyers: a liquidity crisis.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 4 · Forced austerity&lt;/span&gt;&lt;p&gt;To reassure markets, the government cuts spending and raises taxes during a recession. GDP falls (slide 20).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 5 · Fundamentals really do worsen&lt;/span&gt;&lt;p&gt;With falling GDP and high interest rates, the debt-to-GDP ratio rises. The initial pessimism now looks “justified”: the crisis has become self-fulfilling. The cycle returns to step 1, stronger.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Vicious circle of the self-fulfilling crisis&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;350&quot; cy=&quot;130&quot; r=&quot;92&quot; class=&quot;s-sage&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 5&quot; fill=&quot;none&quot;/&gt;
        &lt;text x=&quot;350&quot; y=&quot;125&quot; class=&quot;serif&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;bad equilibrium&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;145&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;self-reinforcing loop&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;32&quot;&gt;distrust / panic&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;112&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;134&quot;&gt;spread ↑ (rates ↑)&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;216&quot; width=&quot;160&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;238&quot;&gt;austerity · GDP ↓&lt;/text&gt;
        &lt;rect x=&quot;60&quot; y=&quot;112&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;fb-sage s-sage&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;134&quot;&gt;debt/GDP ↑&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-sage&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;
        &lt;path d=&quot;M430,30 Q520,40 545,108&quot;/&gt;&lt;path d=&quot;M545,150 Q520,220 432,232&quot;/&gt;&lt;path d=&quot;M268,232 Q180,220 150,150&quot;/&gt;&lt;path d=&quot;M150,110 Q180,40 268,30&quot;/&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Diagram of the vicious circle described on slides 2, 8 and 20.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The three signals of a sentiment-driven crisis&lt;/h3&gt;
  &lt;p&gt;When &lt;em class=&quot;t&quot;&gt;market sentiment&lt;/em&gt; (the mood, the collective expectations of investors) turns against a country, spreads tend to show:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;① Large jumps in a short time&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Large movements over short periods: fundamentals (debt, growth) change slowly, quarter after quarter; the spread, by contrast, can double within weeks.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;② Clusters in time&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Clusters in time: movements are concentrated in episodes (waves of panic) and often hit several countries at once (contagion).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;③ An unexplained “gap”&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Changes in fundamentals are not enough to explain the total change in the spread. This is precisely what the two studies try to measure.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;Why does the fragility hypothesis apply specifically to countries in a monetary union?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Because their public debt is always higher than that of stand-alone countries&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Because they issue debt in a currency that their national central bank cannot create&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Because they cannot issue 10-year bonds&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Option b is correct: without a national lender of last resort, distrust can turn a liquidity problem into insolvency. Option a is false: slide 7 shows that the US and the UK had debt-to-GDP ratios rising as fast as, or faster than, the euro area&#x27;s.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;If a country&#x27;s spread rises from 100 to 400 bp in one quarter while debt/GDP and growth remain almost unchanged, which of the three signals are you observing?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Signal ① (large jumps in a short time) and above all ③: the change in fundamentals does not explain the change in the spread. If the same happens simultaneously in other countries, signal ② (clusters) as well.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s2&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;De Grauwe &amp;amp; Ji (2013): hypothesis, strategy, facts&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 3-8 · Paul De Grauwe (LSE) and Yuemei Ji (LICOS Leuven, CEPS), &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34 (2013) 15-36&lt;/p&gt;

  &lt;h3&gt;The abstract in four moves&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;We test&lt;/button&gt;&lt;button&gt;We find&lt;/button&gt;&lt;button&gt;We argue&lt;/button&gt;&lt;button&gt;We also find&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Hypothesis.&lt;/strong&gt; Government bond markets in the Eurozone are &lt;em&gt;more fragile&lt;/em&gt; and more susceptible to &lt;em class=&quot;t&quot;&gt;self-fulfilling liquidity crises&lt;/em&gt; than those of &lt;em&gt;stand-alone&lt;/em&gt; countries, i.e. countries with their own currency and central bank.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Finding.&lt;/strong&gt; A significant part of the surge in peripheral countries&#x27; spreads in 2010-11 was &lt;em&gt;disconnected&lt;/em&gt; from increases in debt/GDP and fiscal space, and was associated with negative self-fulfilling sentiment, which became very strong from the end of 2010.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Implication.&lt;/strong&gt; This can push Eurozone member countries into &lt;em class=&quot;t&quot;&gt;bad equilibria&lt;/em&gt;: equilibria with high interest rates, austerity and recession which, with identical fundamentals, could have been avoided.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Second finding.&lt;/strong&gt; After years in which they had &lt;em&gt;ignored&lt;/em&gt; high public debt, investors in the EZ began to worry about it and pushed spreads up. This did not happen in stand-alone countries, despite equally high and rising debt/GDP and fiscal space.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The estimation strategy, step by step&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 1 · Model with fundamentals&lt;/span&gt;&lt;p&gt;A model is estimated that explains the spread with a set of &lt;em&gt;fundamental variables&lt;/em&gt; (debt, external accounts, real exchange rate, growth). This is the “fair price” of risk according to fundamentals.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 2 · Adding time dummies&lt;/span&gt;&lt;p&gt;The model is re-estimated with &lt;em class=&quot;t&quot;&gt;time dummies&lt;/em&gt; (0/1 variables, one per quarter). Their coefficient captures how far the spread in that quarter deviates from what fundamentals explain: this makes it possible to identify periods of &lt;em class=&quot;t&quot;&gt;regime switching&lt;/em&gt;, in which sentiment drives spreads away from fundamentals.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 3 · How much do they matter?&lt;/span&gt;&lt;p&gt;The share of the total change in spreads attributable to the time dummies is measured (→ section 6, decomposition).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Step 4 · Control group&lt;/span&gt;&lt;p&gt;To be convincing, the whole exercise is repeated on a &lt;em class=&quot;t&quot;&gt;control group&lt;/em&gt; of countries that do &lt;em&gt;not&lt;/em&gt; belong to a monetary union. If fragility stems from the monetary union, the time dummies should remain flat there.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;The control group: 14 developed stand-alone countries&lt;/h4&gt;
  &lt;div class=&quot;countries&quot;&gt;&lt;span&gt;Australia&lt;/span&gt;&lt;span&gt;Canada&lt;/span&gt;&lt;span&gt;Czech Republic&lt;/span&gt;&lt;span&gt;Denmark&lt;/span&gt;&lt;span&gt;Hungary&lt;/span&gt;&lt;span&gt;Japan&lt;/span&gt;&lt;span&gt;South Korea&lt;/span&gt;&lt;span&gt;Norway&lt;/span&gt;&lt;span&gt;Poland&lt;/span&gt;&lt;span&gt;Singapore&lt;/span&gt;&lt;span&gt;Sweden&lt;/span&gt;&lt;span&gt;Switzerland&lt;/span&gt;&lt;span&gt;UK&lt;/span&gt;&lt;span&gt;US&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Note: Denmark, the Czech Republic, Hungary, Poland and Sweden are in the EU but not in the euro; the criterion is having one&#x27;s own currency, not EU membership.&lt;/p&gt;

  &lt;h3&gt;The facts (slide 7)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-cb=&quot;factsTab&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Fig. 1 · Debt/GDP&lt;/button&gt;&lt;button&gt;Fig. 2 · Spreads&lt;/button&gt;&lt;button&gt;Fig. 4 vs 5 · Spreads and debt&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;figure&gt;&lt;svg id=&quot;fig1&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;United States&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Euro area&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;UK&lt;/span&gt;&lt;/div&gt;
      &lt;figcaption&gt;Gross government debt, % of GDP, 2000-2011 (source in the slide: European Commission, Ameco). Redrawn with values read by eye.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;&lt;strong&gt;Note:&lt;/strong&gt; after 2008 debt grows &lt;em&gt;more&lt;/em&gt; in the US and the United Kingdom than in the euro area. Yet the debt crisis erupts in the EZ. A first hint that the level of debt alone does not explain everything.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;figure&gt;&lt;svg id=&quot;fig2&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Greece&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Portugal&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Ireland&lt;/span&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Italy&lt;/span&gt;&lt;span style=&quot;--c:var(--accent)&quot;&gt;Belgium&lt;/span&gt;&lt;span style=&quot;--c:var(--muted)&quot;&gt;France / Netherlands&lt;/span&gt;&lt;/div&gt;
      &lt;figcaption&gt;10-year bond spreads against Germany, % (source in the slide: Datastream). Schematic pattern redrawn, not exact data.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;p&gt;From 1999 to 2008 spreads are practically &lt;strong&gt;zero&lt;/strong&gt; for all countries: markets priced Greek debt like Dutch debt. Then, from 2010, they diverge explosively (Greece above 20 points at the end of 2011). These are signals ① and ② from section 1.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;figure&gt;&lt;svg id=&quot;fig4&quot; viewBox=&quot;0 0 330 260&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Eurozone 2000Q1-2011Q3 (slide: Eurostat, Datastream).&lt;/figcaption&gt;&lt;/figure&gt;
        &lt;figure&gt;&lt;svg id=&quot;fig5&quot; viewBox=&quot;0 0 330 260&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Stand-alone countries 2000Q1-2011Q3 (slide: OECD, Datastream).&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;/div&gt;
      &lt;p class=&quot;note&quot;&gt;Illustrative scatter plots reproducing the shape of the original charts, not the data.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Eurozone:&lt;/strong&gt; most observations have spreads close to zero; then a group of points (the red triangle in the slide: GR, PT, IR 2010Q2-2011Q3) shoots up. The relationship is &lt;em&gt;non-linear&lt;/em&gt;: beyond a certain debt threshold the spread explodes. &lt;strong&gt;Stand-alone:&lt;/strong&gt; no positive relationship; indeed, countries with debt/GDP between 100% and 200% (Japan) have negative spreads.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;What is the purpose of the control group in De Grauwe and Ji&#x27;s study?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;To increase the number of observations and obtain more precise estimates&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;To estimate the “fair” value of the spread for EZ countries&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;To verify that deviations from fundamentals are specific to the monetary union and not a global feature of the crisis&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Correct. If the time dummies rose in stand-alone countries too, the phenomenon would be linked to the global financial crisis rather than to the fragility of the monetary union. The control group serves as a benchmark, as in an experiment.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;What does the comparison between Fig. 1 and Fig. 2 show against a “fundamentals only” explanation?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;The US and the UK saw their debt/GDP rise more than the euro area after 2008, but did not experience a spread crisis. In the EZ, by contrast, peripheral spreads exploded. If only debt mattered, we would expect the opposite.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Fundamentals versus market sentiment · fiscal space&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 8, 10&lt;/p&gt;

  &lt;div class=&quot;vs&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Explanation 1&lt;/span&gt;&lt;h4&gt;Deteriorating fundamentals&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Fundamentals&lt;/em&gt; are the “objective” economic variables that determine a government&#x27;s capacity to repay. In this literature the most commonly used ones measure the &lt;strong&gt;sustainability&lt;/strong&gt; of public debt. The paper uses two: the &lt;strong&gt;debt to GDP ratio&lt;/strong&gt; and &lt;strong&gt;fiscal space&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;mid&quot;&gt;versus&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Explanation 2&lt;/span&gt;&lt;h4&gt;Market sentiment&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Expectations driven by &lt;em&gt;panic and fear&lt;/em&gt;, which can change suddenly without any change in fundamentals. They are not directly observable and must be measured indirectly (→ time dummies).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Common consequence (slides 8 and 20): high spreads forced countries into &lt;strong&gt;severe austerity measures&lt;/strong&gt;, which in turn &lt;em&gt;raised&lt;/em&gt; debt/GDP (because GDP, the denominator, falls).&lt;/p&gt;

  &lt;h3&gt;Fiscal space&lt;/h3&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Definition (Aizenman and Hutchison, 2012, cited in the slide)&lt;/h4&gt;
    &lt;p class=&quot;formula&quot; style=&quot;background:transparent;border:0;margin:6px 0&quot;&gt;fiscal space = public debt / total tax revenue&lt;/p&gt;
    &lt;p&gt;It measures &lt;em&gt;how many years of tax revenue&lt;/em&gt; would be needed to repay the entire debt. According to the authors it is a better sustainability indicator than debt/GDP, because it takes into account the &lt;strong&gt;capacity to collect taxes&lt;/strong&gt;. Mind the name: a &lt;em&gt;high&lt;/em&gt; value means &lt;em&gt;little&lt;/em&gt; fiscal space.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;A country may have low debt/GDP yet struggle to service its debt because it collects little tax revenue: the debt-to-revenue ratio is then high, i.e. many years of revenue are needed. Try it:&lt;/p&gt;

  &lt;div class=&quot;card&quot; id=&quot;fsCalc&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;
        &lt;h4&gt;Country A&lt;/h4&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dA&quot;&gt;Debt / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dA&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;dAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tA&quot;&gt;Tax revenue / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tA&quot; min=&quot;10&quot; max=&quot;55&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;tAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;h4&gt;Country B&lt;/h4&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dB&quot;&gt;Debt / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dB&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;dBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tB&quot;&gt;Tax revenue / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tB&quot; min=&quot;10&quot; max=&quot;55&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;tBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;fsSvg&quot; viewBox=&quot;0 0 640 120&quot; style=&quot;width:100%;height:auto&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;fsMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Example constructed for this page, not taken from the slides. Fiscal space = (debt/GDP) ÷ (revenue/GDP) = debt/revenue.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;Country X: debt/GDP 60%, revenue/GDP 20%. Country Y: debt/GDP 90%, revenue/GDP 45%. Which has the “worse” fiscal space?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;X: it needs 3 years of revenue against Y&#x27;s 2&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Y, because it has higher debt&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;They are the same&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;X: 60/20 = 3.0; Y: 90/45 = 2.0. Despite having less debt, X has less capacity to service it. This is the case described on slide 10.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Why can the austerity imposed by spreads raise the debt-to-GDP ratio instead of reducing it?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Spending cuts and tax increases during a recession reduce GDP (the denominator) and revenue; meanwhile, high interest rates increase the debt (the numerator). The ratio can therefore rise in the short run: this is the link that closes the vicious circle of section 1.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;The linear model and its results&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 9, 11, 12&lt;/p&gt;

  &lt;p&gt;It is a &lt;em class=&quot;t&quot;&gt;panel regression&lt;/em&gt;: data with two dimensions, countries (&lt;span class=&quot;f&quot;&gt;i&lt;/span&gt;) and quarters (&lt;span class=&quot;f&quot;&gt;t&lt;/span&gt;), from 2000Q1 to 2011Q3. Two versions:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + α&lt;sub&gt;i&lt;/sub&gt; + u&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;1&lt;/sub&gt;·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;2&lt;/sub&gt;·(Debt&lt;sub&gt;it&lt;/sub&gt;)&lt;sup&gt;2&lt;/sup&gt; + α&lt;sub&gt;i&lt;/sub&gt; + u&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;I&lt;/button&gt;&lt;button&gt;CA&lt;/button&gt;&lt;button&gt;Debt&lt;/button&gt;&lt;button&gt;REE&lt;/button&gt;&lt;button&gt;Growth&lt;/button&gt;&lt;button&gt;α&lt;sub&gt;i&lt;/sub&gt;&lt;/button&gt;&lt;button&gt;(Debt)²&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;I&lt;/strong&gt; = 10-year government bond spread. It is the dependent variable, the one to be explained.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;CA&lt;/strong&gt; = &lt;em&gt;accumulated&lt;/em&gt; &lt;em class=&quot;t&quot;&gt;current account&lt;/em&gt; deficit, relative to GDP. It measures the external debt accumulated by the whole economy, public and private: a country that has accumulated external deficits depends on foreign capital.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Debt&lt;/strong&gt; = public debt/GDP &lt;em&gt;or&lt;/em&gt; fiscal space (debt/revenue). The two alternative measures of sustainability.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;REE&lt;/strong&gt; = &lt;em class=&quot;t&quot;&gt;real effective exchange rate&lt;/em&gt;: the weighted average exchange rate against trading partners, adjusted for relative prices. If it rises, the country loses competitiveness.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Growth&lt;/strong&gt; = GDP growth rate. More growth = easier debt servicing, so a negative sign is expected.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;α&lt;sub&gt;i&lt;/sub&gt;&lt;/strong&gt; = &lt;em class=&quot;t&quot;&gt;country fixed effect&lt;/em&gt;: a different constant for each country. It captures country-specific characteristics that &lt;em&gt;do not change over time&lt;/em&gt; and affect the spread: efficiency of the tax system, quality of governance, etc. In practice the model compares each country with itself over time.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;(Debt)²&lt;/strong&gt;: the squared term allows for a &lt;em&gt;non-linear&lt;/em&gt; relationship. If γ&lt;sub&gt;2&lt;/sub&gt; &amp;gt; 0, the effect of one additional point of debt on the spread &lt;em&gt;increases&lt;/em&gt; with the level of debt. This is the “kinked” shape of Fig. 4.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;How to read a regression table (prerequisite)&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Coefficient&lt;/strong&gt;: how much the dependent variable changes when the regressor increases by 1, holding the others constant. Here the spread is in percentage points, so 0.0744 = +7.44 basis points for each point of debt/GDP.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;[number in brackets]&lt;/strong&gt;: the &lt;em&gt;standard error&lt;/em&gt;, i.e. the uncertainty of the estimate. The estimates are &lt;em&gt;robust&lt;/em&gt; and &lt;em&gt;clustered at country level&lt;/em&gt;: they allow for the fact that errors for the same country in different quarters are correlated.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Asterisks&lt;/strong&gt;: statistical significance. *** p&amp;lt;0.01, ** p&amp;lt;0.05, * p&amp;lt;0.1. Without asterisks, one cannot rule out that the true effect is zero.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;R²&lt;/strong&gt;: the share of the variability of the spread explained by the model (from 0 to 1).&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Results: Eurozone versus stand-alone&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Table 1 · Eurozone&lt;/button&gt;&lt;button&gt;Table 2 · Stand-alone&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;2000Q1-2011Q3&lt;/th&gt;&lt;th&gt;(1)&lt;/th&gt;&lt;th&gt;(2)&lt;/th&gt;&lt;th&gt;(3)&lt;/th&gt;&lt;th&gt;(4)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Accumulated current account/GDP&lt;/td&gt;&lt;td&gt;−0.0115&lt;/td&gt;&lt;td&gt;−0.0001&lt;/td&gt;&lt;td&gt;−0.0116&lt;/td&gt;&lt;td&gt;0.0011&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Real effective exchange rate&lt;/td&gt;&lt;td&gt;0.0119&lt;/td&gt;&lt;td&gt;0.0121&lt;/td&gt;&lt;td&gt;0.0060&lt;/td&gt;&lt;td&gt;0.0005&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;−0.0668&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0.0501***&lt;/td&gt;&lt;td&gt;−0.0571&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0.0405***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0.0744***&lt;/td&gt;&lt;td&gt;−0.0523&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP squared&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0.0009***&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;2.5008***&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−1.7636***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space squared&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;0.9265***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Country fixed effect&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Observations&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;td&gt;470&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;R²&lt;/td&gt;&lt;td&gt;0.67&lt;/td&gt;&lt;td&gt;0.80&lt;/td&gt;&lt;td&gt;0.71&lt;/td&gt;&lt;td&gt;0.85&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Standard errors omitted for readability (they are on slide 11).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Reading:&lt;/strong&gt; in the EZ, debt and fiscal space are highly significant, and the version with the squared term explains more (R² from 0.67 to 0.80; from 0.71 to 0.85): the effect of debt is &lt;em&gt;non-linear&lt;/em&gt;. Growth also matters (negative sign).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;2000Q1-2011Q3&lt;/th&gt;&lt;th&gt;(1)&lt;/th&gt;&lt;th&gt;(2)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Accumulated current account/GDP&lt;/td&gt;&lt;td&gt;−0.0012&lt;/td&gt;&lt;td&gt;−0.0023&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Real effective exchange rate&lt;/td&gt;&lt;td&gt;0.0019&lt;/td&gt;&lt;td&gt;0.0014&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Change in exchange rate&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0.0274**&lt;/td&gt;&lt;td class=&quot;sig&quot;&gt;−0.0278***&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;−0.0216&lt;/td&gt;&lt;td&gt;−0.0231&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Debt/GDP&lt;/td&gt;&lt;td&gt;0.0105&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fiscal space&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;0.2653&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Country fixed effect&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Observations&lt;/td&gt;&lt;td&gt;658&lt;/td&gt;&lt;td&gt;658&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;R²&lt;/td&gt;&lt;td&gt;0.84&lt;/td&gt;&lt;td&gt;0.84&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;Reading:&lt;/strong&gt; in stand-alone countries neither debt/GDP nor fiscal space is significant: markets do not punish high debt in countries with their own central bank. What matters instead is the change in the exchange rate, an adjustment instrument that euro countries lack.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Explore the non-linearity&lt;/h3&gt;
  &lt;p&gt;Using the coefficients in column (2) of Table 1, the effect of one additional point of debt is the derivative: &lt;span class=&quot;f&quot;&gt;∂I/∂Debt = γ&lt;sub&gt;1&lt;/sub&gt; + 2γ&lt;sub&gt;2&lt;/sub&gt;·Debt = −0.0523 + 0.0018·Debt&lt;/span&gt;. Move the slider:&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;qD&quot;&gt;Debt / GDP (%)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;qD&quot; min=&quot;30&quot; max=&quot;160&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;qDo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;qSvg&quot; viewBox=&quot;0 0 640 280&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Eurozone: Table 1 col. (2)&lt;/span&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Stand-alone: Table 2 col. (1), not significant&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p class=&quot;readout&quot; id=&quot;qMsg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Change in the spread relative to a country with debt/GDP = 60%, all other variables held constant. Illustrative calculation based on the estimated coefficients, not a forecast.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;In column (2) of Table 1 the linear debt coefficient is negative (−0.0523) and not significant. Does this mean that debt does not matter?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Yes: the linear coefficient is not significant&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;No: with the squared term the effect must be read jointly, and for realistic debt levels it is positive and increasing&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;No: it means that more debt reduces the spread&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;The marginal effect is −0.0523 + 0.0018·Debt, positive above roughly 29% debt/GDP and increasingly strong. The significant squared term (0.0009***) is precisely the evidence of non-linearity.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;What does the country fixed effect α&lt;sub&gt;i&lt;/sub&gt; capture, and what can it &lt;em&gt;not&lt;/em&gt; capture?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;It captures everything that is country-specific and constant over time (quality of institutions, tax efficiency…). It cannot capture what changes over time, such as a wave of panic in 2010: that requires time dummies (section 5).&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Why does the “change in exchange rate” matter in stand-alone countries while debt and fiscal space do not?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;A country with its own currency can adjust through the exchange rate and cannot be forced into default on debt denominated in its own currency (the central bank acts as lender of last resort). Investors therefore pay less attention to the level of debt. This is consistent with the fragility hypothesis.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s5&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Time dummies: measuring market sentiment&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 13-15&lt;/p&gt;

  &lt;p&gt;A key feature of the fragility hypothesis is that it can generate movements in spreads that are &lt;strong&gt;seemingly disconnected&lt;/strong&gt; from the fundamentals in the model. To measure them, a time component is added:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;I&lt;sub&gt;it&lt;/sub&gt; = α + z·CA&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;1&lt;/sub&gt;·Debt&lt;sub&gt;it&lt;/sub&gt; + μ·REE&lt;sub&gt;it&lt;/sub&gt; + δ·Growth&lt;sub&gt;it&lt;/sub&gt; + γ&lt;sub&gt;2&lt;/sub&gt;·(Debt&lt;sub&gt;it&lt;/sub&gt;)&lt;sup&gt;2&lt;/sup&gt; + α&lt;sub&gt;i&lt;/sub&gt; + &lt;b style=&quot;color:var(--tint)&quot;&gt;β&lt;sub&gt;t&lt;/sub&gt;&lt;/b&gt; + ε&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Time dummy β&lt;sub&gt;t&lt;/sub&gt;&lt;/h4&gt;
    &lt;p&gt;A &lt;em class=&quot;t&quot;&gt;time dummy&lt;/em&gt; is a variable equal to 1 in a given quarter and 0 in all others; its coefficient β&lt;sub&gt;t&lt;/sub&gt; is the “extra” spread common to all countries in the group in that quarter, &lt;em&gt;net of fundamentals&lt;/em&gt;. By construction it is exogenous and unrelated to fundamentals: it is what remains once the fundamentals have explained everything they can. The authors interpret it as &lt;strong&gt;market sentiment&lt;/strong&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Estimated time dummies by group&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;tdSvg&quot; viewBox=&quot;0 0 680 300&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Stand-alone&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Eurozone&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Core Eurozone&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Peripheral Eurozone&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tdQ&quot;&gt;Quarter&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tdQ&quot; min=&quot;0&quot; max=&quot;46&quot; value=&quot;46&quot;&gt;&lt;output id=&quot;tdQo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div id=&quot;tdRead&quot; class=&quot;grid3 small&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Curves redrawn by eye from the four charts on slide 14 (values in percentage points).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stand-alone&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Flat time component, around 0 / −0.5 throughout the period, including 2008-09. No panic regime.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;EZ periphery&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Rises from 2010 to about +5 points in 2011Q3: five points of spread that fundamentals do not explain. Earlier, in 2009, a dip: euphoria and pessimism alternate.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Interpretation: mispricing in both directions&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;Especially in the periphery there were &lt;em class=&quot;t&quot;&gt;departures&lt;/em&gt;: increases in spreads that cannot be explained by debt/GDP and fiscal space.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Before the crisis&lt;/strong&gt; markets saw no risk in peripheral debt and priced it like that of core countries → risk was &lt;em&gt;underestimated&lt;/em&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;After the crisis&lt;/strong&gt; peripheral spreads rose dramatically and independently of observed fundamentals → markets, gripped by negative sentiment, &lt;em&gt;overestimated&lt;/em&gt; the risk of default.&lt;/li&gt;
    &lt;li&gt;Conclusion: the &lt;em class=&quot;t&quot;&gt;mispricing of risks&lt;/em&gt;, in both directions, appears to have been an &lt;strong&gt;endemic&lt;/strong&gt; feature of the Eurozone.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;If in 2011Q3 the periphery&#x27;s time dummy is about 5, what does this mean?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;That the periphery&#x27;s fundamentals worsened by 5 points&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;That the periphery&#x27;s average spread was 5%&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;That the spread was about 5 points higher than predicted by fundamentals, in a way common to the peripheral countries&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;The time dummy measures the common deviation not explained by fundamentals, i.e. the component attributed to sentiment.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;What is one limitation of interpreting time dummies as “market sentiment”?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;They capture &lt;em&gt;everything&lt;/em&gt; that is common to the countries in the group in a given quarter and not included in the model: besides panic, also omitted variables (expectations about future fundamentals, banking risks, political events). It is a residual, and therefore indirect, measure. The same doubt returns with the study by Aizenman et al. (section 9).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s6&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Decomposing the change in the spread&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 16-20 · Fig. 5.7 (source in the slide: De Grauwe and Ji, 2013a) and Fig. 11 of the paper&lt;/p&gt;

  &lt;p&gt;The change in each country&#x27;s spread between 2008Q1 and 2011Q3 is decomposed into three parts:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;ΔI&lt;sub&gt;i&lt;/sub&gt; = &lt;span style=&quot;color:var(--slate)&quot;&gt;Δβ&lt;sub&gt;t&lt;/sub&gt; (time component)&lt;/span&gt; + &lt;span style=&quot;color:var(--brick)&quot;&gt;Σ coeff × Δfundamentals (fundamental factors)&lt;/span&gt; + &lt;span style=&quot;color:var(--muted)&quot;&gt;residual&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px&quot;&gt;
      &lt;button class=&quot;btn&quot; id=&quot;dcEZ&quot; aria-pressed=&quot;true&quot;&gt;Eurozone&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;dcSA&quot; aria-pressed=&quot;false&quot;&gt;Stand-alone&lt;/button&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;dcSvg&quot; viewBox=&quot;0 0 680 320&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;time component&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;fundamental factors&lt;/span&gt;&lt;span style=&quot;--c:var(--rule)&quot;&gt;residual&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p id=&quot;dcMsg&quot; class=&quot;small&quot; style=&quot;min-height:3em&quot;&gt;Click a bar for a comment.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Heights read by eye from the charts on slides 16-17 (percentage points); they are meant for comparing proportions.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;On the whole&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Portugal and Ireland&lt;/button&gt;&lt;button&gt;Spain&lt;/button&gt;&lt;button&gt;Greece&lt;/button&gt;&lt;button&gt;Core&lt;/button&gt;&lt;button&gt;Stand-alone&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;About &lt;strong&gt;half&lt;/strong&gt; of the change in the spread is due to the time dummies and half to fundamentals.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Almost all of the increase is due to the time dummies: fundamentals play little role; the explanation is the change in sentiment towards Spain. The &lt;strong&gt;clearest case of pure loss of confidence&lt;/strong&gt;: markets may have &lt;em&gt;mispriced&lt;/em&gt; the risk of Spanish bonds.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;About &lt;strong&gt;60%&lt;/strong&gt; of the increase is explained by deteriorating fundamentals, less than 40% by the time dummies. Bad fundamentals &lt;em&gt;plus&lt;/em&gt; loss of confidence: markets priced Greek risk “with some justification”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;A similar pattern in &lt;strong&gt;six core countries&lt;/strong&gt; (Austria, Belgium, Finland, France, Italy, the Netherlands in the chart): most of the increase, small as it is, comes from the time dummies; fundamentals often made a negative contribution.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Minimal changes for all, below 2 points: no relevant time component. No trace of a self-fulfilling crisis outside the monetary union.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box&quot;&gt;
    &lt;h4&gt;The policy message&lt;/h4&gt;
    &lt;p&gt;There is a &lt;strong&gt;risk that markets push countries into a bad equilibrium&lt;/strong&gt;, which can be avoided through policies that remove the &lt;em&gt;fear factor&lt;/em&gt; from the market.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ctx&quot;&gt;&lt;p&gt;A historical example of this kind of policy is the ECB&#x27;s announcement of the OMT (Outright Monetary Transactions) programme in 2012, through which the central bank declared itself ready to purchase the bonds of countries in difficulty: in effect, a lender-of-last-resort function. The slides do not mention it; if the course covers it in another lecture, link it here.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;From liquidity crises to forced austerity&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 120&quot; role=&quot;img&quot; aria-label=&quot;Chain from sentiment to austerity&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;57&quot;&gt;market sentiment&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;74&quot;&gt;(+ fundamentals)&lt;/text&gt;
        &lt;rect x=&quot;180&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;57&quot;&gt;spread ↑&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;74&quot;&gt;from 2010&lt;/text&gt;
        &lt;rect x=&quot;355&quot; y=&quot;35&quot; width=&quot;140&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;57&quot;&gt;severe&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;74&quot;&gt;austerity&lt;/text&gt;
        &lt;rect x=&quot;530&quot; y=&quot;35&quot; width=&quot;145&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fb-brick s-brick&quot;/&gt;&lt;text x=&quot;602&quot; y=&quot;57&quot;&gt;debt/GDP ↑&lt;/text&gt;&lt;text x=&quot;602&quot; y=&quot;74&quot;&gt;(GDP ↓)&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-brick&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M146,60 H176&quot;/&gt;&lt;path d=&quot;M321,60 H351&quot;/&gt;&lt;path d=&quot;M496,60 H526&quot;/&gt;&lt;path d=&quot;M602,86 C602,118 75,118 75,90&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Slide 20: spreads, driven mainly by sentiment, imposed austerity that raised debt/GDP.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;a&quot;&gt;
      &lt;p&gt;According to the decomposition, for which country is the case for a self-fulfilling crisis strongest?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;Spain&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;Greece&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;United Kingdom&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;Spain: almost all of the increase comes from the time component, i.e. from sentiment. In Greece fundamentals prevail (~60%); the United Kingdom is stand-alone and does not show the phenomenon.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;The time component is the same for Greece, Ireland, Portugal and Spain (about 4.5 points). Why?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;Because the time dummies are estimated by group (periphery, core): β&lt;sub&gt;t&lt;/sub&gt; is common to all countries in the group in that quarter. What differentiates the countries are the fundamentals and the residual.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s7&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Other studies: credit default swaps (CDS)&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 21-22, 25 · definition from A. Carboni (2011), Banca d&#x27;Italia, Temi di discussione (Working Papers) no. 821, cited in the slide&lt;/p&gt;

  &lt;p&gt;Do other studies reach similar conclusions? The second paper, Aizenman, Hutchison and Jinjarak (2013), uses as its risk measure not the bond spread but the &lt;strong&gt;CDS spread&lt;/strong&gt;.&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Credit default swap&lt;/h4&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Credit default swaps&lt;/em&gt; are the most common type of &lt;em&gt;credit derivatives&lt;/em&gt;. A CDS is a &lt;strong&gt;bilateral contract&lt;/strong&gt; that insures the nominal value (&lt;em&gt;par value&lt;/em&gt;) of a reference bond: the &lt;em&gt;protection buyer&lt;/em&gt; pays a periodic fee (the spread) or a one-off premium to the &lt;em&gt;protection seller&lt;/em&gt;, who pays out if a &lt;em&gt;credit event&lt;/em&gt; (default, restructuring…) occurs during the life of the contract.&lt;/p&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 170&quot; role=&quot;img&quot; aria-label=&quot;Diagram of a CDS&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;78&quot; font-weight=&quot;600&quot;&gt;Protection buyer&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;98&quot; font-size=&quot;11&quot;&gt;holds government bonds&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;50&quot; width=&quot;170&quot; height=&quot;64&quot; rx=&quot;12&quot; class=&quot;fb-slate s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;78&quot; font-weight=&quot;600&quot;&gt;Protection seller&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;98&quot; font-size=&quot;11&quot;&gt;bank, fund…&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;40&quot;&gt;annual spread (e.g. 197 bp of notional)&lt;/text&gt;
        &lt;text x=&quot;340&quot; y=&quot;148&quot;&gt;if a credit event occurs: pays the lost nominal value&lt;/text&gt;
        &lt;rect x=&quot;270&quot; y=&quot;65&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;f-paper s-rule&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;87&quot; font-size=&quot;11.5&quot;&gt;reference bond&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;s-slate&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M190,58 C300,40 380,40 488,58&quot;/&gt;&lt;path d=&quot;M490,108 C380,130 300,130 192,108&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Quoting in basis points: calculator&lt;/h3&gt;
  &lt;p&gt;The convention is the &lt;em&gt;annual&lt;/em&gt; premium as a percentage of the notional. In the paper: 1 bp = $1,000 to insure 10 million. Example from the slide: 197 bp → 1.97% × 10 million = $197,000 per year.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;cdsBp&quot;&gt;CDS spread (bp)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cdsBp&quot; min=&quot;10&quot; max=&quot;2000&quot; step=&quot;1&quot; value=&quot;197&quot;&gt;&lt;output id=&quot;cdsBpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;cdsN&quot;&gt;Notional ($ million)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cdsN&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cdsNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;cdsMsg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Try 1026 bp: this was Greece&#x27;s average CDS in 2010 (Table 1 of Aizenman et al., slide 27).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Common causes&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;According to the literature, sovereign yields and CDS spreads have &lt;em&gt;common underlying causes&lt;/em&gt;, rather than one driving the other.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Before: OTC&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Before the crisis CDS were traded &lt;em class=&quot;t&quot;&gt;over-the-counter&lt;/em&gt; (OTC): outside regulated markets, through brokers or dealers.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;After: more rules&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Since the financial crisis, CDS trading has been subject to more regulation and standardised contracts.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;In the EU, Regulation (EU) No 236/2012 on short selling and CDS banned, among other things, “naked” sovereign CDS, i.e. CDS bought without holding the exposure to be insured. &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/short-selling-of-securities.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;Who was most insured? (slide 25)&lt;/h4&gt;
  &lt;p&gt;Gross notional amount of outstanding sovereign CDS positions as of 25 February 2011 ($ billion), i.e. the total insured capital. &lt;strong&gt;Italy&lt;/strong&gt; stands out (almost 300), followed by &lt;strong&gt;Brazil&lt;/strong&gt;, &lt;strong&gt;Spain&lt;/strong&gt;, &lt;strong&gt;Turkey&lt;/strong&gt; (about 150-165), &lt;strong&gt;Mexico&lt;/strong&gt; (~120) and Russia (~100). Italy, the largest debt market in the periphery, was the most insured sovereign in the world.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;A CDS on Portuguese debt is quoted at 500 bp. How much does it cost per year to insure €20 million?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;&lt;button data-k=&quot;a&quot;&gt;€100,000&lt;/button&gt;&lt;button data-k=&quot;b&quot;&gt;€1,000,000&lt;/button&gt;&lt;button data-k=&quot;c&quot;&gt;€10,000,000&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;500 bp = 5% per year; 5% × 20 million = 1 million per year.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Why is a CDS spread a good measure of the default risk perceived by markets?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;It is the market price of insurance against default: the more likely the market considers a credit event, the more the protection seller demands. Unlike the bond spread, it does not depend on the German benchmark and is comparable across countries with different currencies: this is why it suits a sample of 50 countries.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S8 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s8&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Aizenman, Hutchison &amp;amp; Jinjarak (2013)&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 21, 23-30 · &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34 (2013) 37-59&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Facts&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Perceived sovereign risk explodes in 2010 in several European countries and culminates in the &lt;em class=&quot;t&quot;&gt;selective default&lt;/em&gt; on Greek debt in early 2012.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Objective&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;To determine whether the high perceived risk of the troubled euro countries, as measured by CDS spreads, can be explained by past or current fundamentals: debt and deficits relative to tax revenue, which they call &lt;em class=&quot;t&quot;&gt;de facto fiscal space&lt;/em&gt;, plus other determinants.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;SWEAP&lt;/h4&gt;
    &lt;p&gt;&lt;em class=&quot;t&quot;&gt;South-West Euro Area Periphery&lt;/em&gt;: Greece, Ireland, Italy, Portugal, Spain. Note that here &lt;strong&gt;Italy is in the periphery&lt;/strong&gt;, whereas in De Grauwe and Ji it appears among the core countries.&lt;/p&gt;
  &lt;/div&gt;
  &lt;h4&gt;Research questions&lt;/h4&gt;
  &lt;ol&gt;
    &lt;li&gt;Does &lt;strong&gt;fiscal space&lt;/strong&gt; help to explain the pricing of risk systematically, beyond what is already explained by other macro indicators?&lt;/li&gt;
    &lt;li&gt;Was the risk of some markets (e.g. SWEAP) &lt;strong&gt;“overpriced”&lt;/strong&gt; in 2010, according to the model&#x27;s predictions based on actual values of fiscal space and the other variables?&lt;/li&gt;
  &lt;/ol&gt;

  &lt;h3&gt;The data: CDS and fiscal space (Table 1, slide 27)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-cb=&quot;ahjTab&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;5-year CDS (bp)&lt;/button&gt;&lt;button&gt;Debt / tax base&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot; id=&quot;ahjT1&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;tbl&quot; id=&quot;ahjT2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;strong&gt;The key comparison:&lt;/strong&gt; in 2010 Spain has a debt/tax ratio of 1.7, &lt;em&gt;lower&lt;/em&gt; than the non-euro OECD average (1.9), yet a CDS of 348 bp against 118. Portugal (2.4) is similar to the middle-income countries (2.3) but pays 497 bp against 233. The figures in brackets in the slide are the group standard deviations.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Fig. 2 (slide 24): CDS of middle-income countries (South Africa, Panama, Malaysia, Mexico, Colombia) rise in 2008 and then fall back by mid-2009; those of SWEAP countries, by contrast, keep rising in 2010-11 (Greece above 8,000 bp at the end of 2011). Global financial stress had emerged in early 2008, became dramatic in late 2008, and then subsided almost everywhere except in the SWEAP group.&lt;/p&gt;

  &lt;h3&gt;The model: dynamic panel&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;Y&lt;sub&gt;it&lt;/sub&gt; = a + θ·Y&lt;sub&gt;i,t−1&lt;/sub&gt; + X′&lt;sub&gt;it&lt;/sub&gt;β + ε&lt;sub&gt;it&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card small&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Y&lt;/strong&gt;: 5-year sovereign CDS spread · &lt;strong&gt;50 countries&lt;/strong&gt; · 2005-2010 (annual).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Y&lt;sub&gt;t−1&lt;/sub&gt;&lt;/strong&gt;: the lagged dependent variable: this year&#x27;s CDS depends on last year&#x27;s (persistence). This is why the model is &lt;em class=&quot;t&quot;&gt;dynamic&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;X&lt;/strong&gt;: vector of controls, including the fiscal space measures (debt/tax, fiscal balance/tax), plus the TED spread, trade/GDP, inflation, external debt/GDP, and time dummies interacted with the Euro and SWEAP dummies.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card small&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Why not OLS?&lt;/strong&gt; With fixed effects, the lagged variable Y&lt;sub&gt;t−1&lt;/sub&gt; is correlated with the unobservable error term: the estimate would be biased.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Solution:&lt;/strong&gt; the instrumental-variable &lt;em class=&quot;t&quot;&gt;Arellano-Bond GMM&lt;/em&gt; estimator: first differences are taken (eliminating the fixed effect) and deeper lags of Y are used as instruments.&lt;/p&gt;
      &lt;p&gt;Variants with &lt;em&gt;fixed effects&lt;/em&gt; and with &lt;em&gt;clustered standard errors&lt;/em&gt;. After estimation: in-sample and out-of-sample &lt;strong&gt;prediction errors&lt;/strong&gt; (section 9).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;What is the TED spread?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;From the note to Table 2: the 3-month US dollar LIBOR rate minus the 3-month US Treasury yield. It measures stress in the interbank market and global risk: when banks do not trust one another, LIBOR rises relative to the safe asset.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Results (Table 2, slides 29-30)&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;+1 point of &lt;strong&gt;debt/tax&lt;/strong&gt; → CDS spread &lt;strong&gt;+15 to +81 bp&lt;/strong&gt; (14.7*** with clustered s.e.; 81.0*** with fixed effects).&lt;/li&gt;
    &lt;li&gt;+1 point of &lt;strong&gt;fiscal balance/tax base&lt;/strong&gt; (better budget balance) → CDS &lt;strong&gt;−194 to −829 bp&lt;/strong&gt;.&lt;/li&gt;
    &lt;li&gt;Highly significant estimates; the low ones come from clustered standard errors, the high ones from fixed effects.&lt;/li&gt;
    &lt;li&gt;Also worth examining are the &lt;strong&gt;time dummies&lt;/strong&gt; and their interactions with the Euro and SWEAP dummies:&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Compute the “SWEAP premium” by year&lt;/h4&gt;
    &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot; id=&quot;t2cols&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;tbl&quot; id=&quot;t2tbl&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;readout&quot; id=&quot;t2msg&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Reading assumption: SWEAP countries are also in the euro, so their year effect is t + t×Euro + t×SWEAP. Coefficients from Table 2; the sum was computed for this page.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;In 2008 the Euro and SWEAP interactions are &lt;strong&gt;negative&lt;/strong&gt;: the global shock hits the euro area less. In 2010 the SWEAP interaction is large and positive (up to +324 bp, *** in 3 columns out of 4): a risk premium that the model&#x27;s variables do not explain.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;c&quot;&gt;
      &lt;p&gt;Why do Aizenman et al. use the Arellano-Bond estimator instead of a simple fixed-effects regression?&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;Because they have too many countries&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;Because CDS are measured in basis points&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Because the lagged dependent variable is correlated with the unobservable error, and the estimate would be biased&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;This is the dynamic panel problem: with Y&lt;sub&gt;t−1&lt;/sub&gt; among the regressors, fixed effects generate correlation with the error term. Arellano-Bond uses first differences and lags as instruments (GMM).&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;What does a coefficient t2010×SWEAP = +261.9*** indicate?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;In 2010 the CDS of SWEAP countries were on average about 262 bp higher than explained by the other variables (fiscal space, macro variables, the common year effect and the euro effect). It is the equivalent of the periphery time dummy in De Grauwe and Ji.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S9 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s9&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;h2&gt;Prediction errors and two interpretations&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slides 31-34&lt;/p&gt;

  &lt;div class=&quot;box def&quot;&gt;
    &lt;h4&gt;Prediction error = actual CDS / predicted CDS&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;Out-of-sample&lt;/strong&gt;: the model is estimated on the pre-crisis period only (2005-07) and then used to predict 2008-10. &lt;strong&gt;In-sample&lt;/strong&gt;: estimated over the whole 2005-10 period. A value &amp;gt; 1 is &lt;em class=&quot;t&quot;&gt;under-prediction&lt;/em&gt;: the actual CDS exceeds the predicted one, i.e. sovereign risk is &lt;strong&gt;over-priced&lt;/strong&gt; relative to fundamentals. Example: 6.5 = the market demands 6.5 times the predicted value.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot; id=&quot;peBtns&quot;&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:8px 0 0&quot;&gt;&lt;svg id=&quot;peSvg&quot; viewBox=&quot;0 0 680 280&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;out-of-sample&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;in-sample&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;
    &lt;p id=&quot;peMsg&quot; class=&quot;small&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Data from Table 4 (slide 32). Ratio scale: the line at 1 = perfect prediction.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h4&gt;What the numbers say&lt;/h4&gt;
  &lt;ul&gt;
    &lt;li&gt;Errors are huge everywhere during the crisis, especially out-of-sample: in 2008-10 actual CDS exceed predictions by a factor of &lt;strong&gt;2.3&lt;/strong&gt; (middle income) up to &lt;strong&gt;12.9&lt;/strong&gt; (non-euro OECD). Under-predictions of this magnitude are &lt;em&gt;extraordinary&lt;/em&gt;.&lt;/li&gt;
    &lt;li&gt;For the SWEAP countries, on the 2008-10 average, errors are not particularly high in relative terms: from 2.6 (Italy) to 5.3 (Ireland).&lt;/li&gt;
    &lt;li&gt;But the &lt;strong&gt;time profile&lt;/strong&gt; differs: the non-euro OECD has an error of 31.6 in 2008 (global shock), then 1.6 in 2009 and 5.4 in 2010. The SWEAP countries have relatively low errors in 2008 that rise in 2009 and above all in 2010 (Spain 6.5, Ireland 7.9, Portugal 6.9). Possibly a &lt;em class=&quot;t&quot;&gt;contagion&lt;/em&gt; effect.&lt;/li&gt;
    &lt;li&gt;The euro area excluding SWEAP also peaks in 2010 (13.7).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Moreover, comparing the SWEAP countries with five middle-income countries outside Europe with similar fiscal space, in 2010 the periphery&#x27;s default risk is priced &lt;strong&gt;much higher&lt;/strong&gt;, even after accounting for differences in fundamentals (abstract, slide 23).&lt;/p&gt;

  &lt;h3&gt;Two readings of the same data&lt;/h3&gt;
  &lt;div class=&quot;vs&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;
      &lt;span class=&quot;pill&quot;&gt;Interpretation A&lt;/span&gt;
      &lt;h4&gt;Future fundamentals&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;The CDS market prices default not on &lt;em&gt;current&lt;/em&gt; fundamentals but on &lt;em&gt;future&lt;/em&gt; ones, expecting a sharp deterioration in SWEAP fiscal space.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Consistent with the &lt;strong&gt;Greek selective default of 2012&lt;/strong&gt;. Adjustment in the SWEAP countries is seen as &lt;em&gt;economically and politically more difficult&lt;/em&gt;, owing to the exchange-rate rigidity tied to the euro, a constraint that middle-income countries do not face.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;strong&gt;Rational, forward-looking markets&lt;/strong&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mid&quot;&gt;or&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;
      &lt;span class=&quot;pill&quot;&gt;Interpretation B&lt;/span&gt;
      &lt;h4&gt;Multiple equilibria and contagion&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;Consistent with the &lt;strong&gt;Calvo (1988)&lt;/strong&gt; model and with De Grauwe and Ji (2012): sovereign risk follows &lt;em class=&quot;t&quot;&gt;waves of contagion&lt;/em&gt;, overreacting and mispricing risk for years.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Earlier, &lt;em class=&quot;t&quot;&gt;contagious optimism&lt;/em&gt;: risk was underpriced, especially around the euro&#x27;s tenth anniversary. In 2010 the shift is from the “good” (optimistic) equilibrium to the “bad” (pessimistic) one: very high CDS → public finances deteriorate → &lt;strong&gt;self-fulfilling prophecy crisis&lt;/strong&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;strong&gt;Markets that err&lt;/strong&gt; in both directions.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 240&quot; role=&quot;img&quot; aria-label=&quot;Multiple equilibria: good and bad equilibrium&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;640&quot; y2=&quot;200&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;60&quot; y2=&quot;20&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;default risk expected by investors (→ required yields)&lt;/text&gt;
      &lt;text x=&quot;22&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 22 110)&quot;&gt;resulting default risk&lt;/text&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;620&quot; y2=&quot;30&quot; class=&quot;s-rule&quot; stroke-dasharray=&quot;4 4&quot; style=&quot;stroke:var(--muted)&quot;/&gt;
      &lt;text x=&quot;610&quot; y=&quot;50&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--muted)&quot;&gt;45°: expectations = outcome&lt;/text&gt;
      &lt;path d=&quot;M60,186 C110,178 135,172 160,170 S330,152 420,118 S505,70 534,56 S590,30 625,16&quot; class=&quot;s-slate&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;/&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;170&quot; r=&quot;7&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;190&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;good equilibrium&lt;/text&gt;
      &lt;circle cx=&quot;534&quot; cy=&quot;57&quot; r=&quot;7&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;85&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;end&quot;&gt;bad equilibrium&lt;/text&gt;
      &lt;path d=&quot;M200,160 Q360,150 500,70&quot; class=&quot;s-brick&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; stroke-dasharray=&quot;3 3&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;160&quot; font-size=&quot;11&quot; style=&quot;fill:var(--brick)&quot;&gt;panic: equilibrium jump&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Qualitative diagram (not in the slides) of Calvo&#x27;s idea: where expectations intersect the outcome there are several equilibrium points with the same fundamentals. Expectations determine where the economy ends up.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot; data-mc=&quot;b&quot;&gt;
      &lt;p&gt;An out-of-sample prediction error of 7.9 for Ireland in 2010 means that…&lt;/p&gt;
      &lt;div class=&quot;opts&quot;&gt;
        &lt;button data-k=&quot;a&quot;&gt;the model overestimated the Irish CDS by 7.9 bp&lt;/button&gt;
        &lt;button data-k=&quot;b&quot;&gt;the actual CDS was 7.9 times the value predicted by the model estimated on 2005-07&lt;/button&gt;
        &lt;button data-k=&quot;c&quot;&gt;Irish fundamentals deteriorated by 790%&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fb&quot;&gt;The error is an actual/predicted ratio. Values &amp;gt; 1 indicate under-prediction, i.e. risk over-priced relative to fundamentals.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;
      &lt;p&gt;Which fact supports interpretation A (future fundamentals), and what is its weakness?&lt;/p&gt;
      &lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;fb&quot;&gt;In favour: the Greek selective default of 2012 showed that the risk was real, and euro countries cannot devalue. Weakness: if pessimism itself worsens future fundamentals (high rates → austerity → recession), “pricing future fundamentals” and “self-fulfilling crisis” become hard to tell apart in the data: future fundamentals are not independent of expectations.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S10 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s10&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;h2&gt;Comparing the two studies and exam questions&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;Slide 35 (questions); comparison table built from slides 3-34&lt;/p&gt;

  &lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;De Grauwe &amp;amp; Ji (2013)&lt;/th&gt;&lt;th&gt;Aizenman, Hutchison &amp;amp; Jinjarak (2013)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Dependent variable&lt;/td&gt;&lt;td&gt;10-year bond spread&lt;/td&gt;&lt;td&gt;5-year sovereign CDS spread (bp)&lt;/td&gt;&lt;/tr&gt;
