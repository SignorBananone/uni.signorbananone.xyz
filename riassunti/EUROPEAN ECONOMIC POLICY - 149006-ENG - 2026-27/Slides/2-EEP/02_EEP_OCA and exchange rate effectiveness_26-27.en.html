   &lt;details&gt;&lt;summary&gt;If the nominal exchange rate depreciates, competitiveness is sure to improve. Do you agree?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No, or only temporarily. Import prices rise, P&lt;sub&gt;C&lt;/sub&gt; rises, the consumption wage falls and workers demand increases: domestic costs and prices rise and erode the advantage (F → F″). The erosion is greater in open economies and with indexation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the automatic adjustment mechanisms that should work in a MU, according to Mundell?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Wage and price flexibility (W falls where U rises and rises where U falls, shifting the supply curves and relative prices) and labour mobility (the unemployed move to where there is demand).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What kind of shocks could be satisfactorily solved by an exchange rate policy?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Asymmetric, country-specific shocks aligned with national borders, and above all transitory ones. With permanent shocks the effect dissipates into inflation; with regional or cross-border sectoral shocks the national exchange rate is not targeted; with symmetric shocks it becomes beggar-thy-neighbour.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How do you expect consumption real wages to change after a devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;They fall: with W initially fixed, P&lt;sub&gt;C&lt;/sub&gt; rises by about &lt;span class=&quot;math&quot;&gt;s·(−ė)&lt;/span&gt;. Wage resistance follows.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In the presence of a centralized budget, would it make sense to manage permanent asymmetric shocks with fiscal policy? Why?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No: permanent transfers between regions create moral hazard and remove the incentive to adjust. They make sense for transitory shocks.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are competitive devaluations? When were they widespread in Europe? Do you expect them to be effective?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Devaluations aimed at gaining competitiveness over partners, frequent in pre-euro Europe. In the medium run they are not very effective: wage-price spiral, higher inflation expectations, loss of credibility, and retaliation by partners.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;When do countries adopt so-called internal devaluations?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;When they cannot use the exchange rate (members of an MU), suffer a negative asymmetric shock and the other mechanisms are not enough. They are more frequent in periods of high inflation or when partners have higher inflation, because less deflation is needed in absolute terms. Example: Greece.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;§&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;References cited in the slides&lt;/p&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Authors, texts, legal provisions and statistical sources mentioned in the lecture, with what they contain and why they matter.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;refs prose&quot;&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Article&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Robert Mundell, “A Theory of Optimum Currency Areas”, &lt;i&gt;American Economic Review&lt;/i&gt;, 1961&lt;/h4&gt;&lt;p&gt;The founding text of OCA theory: it defines the currency area, introduces the asymmetric shock between two countries and identifies flexibility and mobility as alternatives to the exchange rate. All the quotations in the lecture come from here.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Prize&lt;/span&gt;&lt;div&gt;&lt;h4&gt;1999 Nobel Prize in Economics to Robert Mundell&lt;/h4&gt;&lt;p&gt;Awarded for his analysis of monetary and fiscal policy under different exchange-rate regimes and for optimum currency areas. It matters because it came in the year the euro was born.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Author&lt;/span&gt;&lt;div&gt;&lt;h4&gt;James Meade (1957)&lt;/h4&gt;&lt;p&gt;Argued that Western Europe lacked the conditions for a common currency, above all because of low labour mobility. He is the first sceptic in the series.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Debate&lt;/span&gt;&lt;div&gt;&lt;h4&gt;MIT panel, 1992: Blanchard, Dornbusch, Fischer, Krugman&lt;/h4&gt;&lt;p&gt;Four leading macroeconomists agree on the «unfavourable economic repercussions» of a common European currency; Blanchard contrasts labour mobility across US states with Europe&#x27;s “negligible” mobility.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;VoxEU&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Dao et al. (2013)&lt;/h4&gt;&lt;p&gt;Evidence that adjustment through labour mobility in Europe has strengthened, especially in the 2008-09 recession, but remains insufficient.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;VoxEU&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Basso et al. (2019)&lt;/h4&gt;&lt;p&gt;Show that the elasticity of labour supply to shocks is still lower in the euro area than in the United States: Mundell&#x27;s channel works poorly.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;EU report&lt;/span&gt;&lt;div&gt;&lt;h4&gt;European Commission, &lt;i&gt;Annual Report on Intra-EU Labour Mobility 2024&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Source of the lecture&#x27;s “facts”: number of movers, nationalities, destinations, age and composition of inflows (Figure 6). Useful for updating the figures.&lt;br&gt;&lt;code&gt;employment-social-affairs.ec.europa.eu/annual-report-intra-eu-labour-mobility-2024_en&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Law&lt;/span&gt;&lt;div&gt;&lt;h4&gt;TFEU: Treaty on the Functioning of the European Union&lt;/h4&gt;&lt;p&gt;Sets the ECB&#x27;s objective: price stability (Art. 127). It determines how much inflation the common central bank is willing to tolerate to help deficit countries; this will be discussed in upcoming lectures.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Article&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Jay C. Shambaugh, “The Euro’s Three Crises”, &lt;i&gt;Brookings Papers on Economic Activity&lt;/i&gt;, 2012&lt;/h4&gt;&lt;p&gt;Analysis of the euro crisis (banking, sovereign debt, growth and competitiveness). The numerical example on internal devaluation and the observation that devaluing internally is easier with higher inflation come from here.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Case&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Italy 1992: abolition of the scala mobile (July) and devaluation of the lira (September)&lt;/h4&gt;&lt;p&gt;An example of how the absence of automatic wage indexation limits the second-round inflationary effects of a devaluation.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Case&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Greece: internal devaluation&lt;/h4&gt;&lt;p&gt;The best-known case of internal devaluation in the eurozone: it shows the output and employment costs of adjusting without an exchange rate.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;
const $=(s,r=document)=&gt;r.querySelector(s),$$=(s,r=document)=&gt;[...r.querySelectorAll(s)];

/* ---------- grafici AD-AS: P e Y su scala 0–10 ---------- */
const X=y=&gt;44+y*26,P=p=&gt;262-p*24;
function seg(k,sh){let a,b;if(k===&#x27;D&#x27;){a=Math.max(.8,10+sh-9.6);b=Math.min(9.6,10+sh-.6);return[a,10+sh-a,b,10+sh-b]}a=Math.max(.8,.6-sh);b=Math.min(9.6,9.6-sh);return[a,a+sh,b,b+sh]}
function eq(d,s){return[(10+d-s)/2,(10+d+s)/2]}
function arrow(x1,y1,x2,y2,c){const a=Math.atan2(y2-y1,x2-x1),h=7;return`&lt;g class=&quot;${c}&quot;&gt;&lt;line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2-3*Math.cos(a)}&quot; y2=&quot;${y2-3*Math.sin(a)}&quot;/&gt;&lt;polygon points=&quot;${x2},${y2} ${x2-h*Math.cos(a-.45)},${y2-h*Math.sin(a-.45)} ${x2-h*Math.cos(a+.45)},${y2-h*Math.sin(a+.45)}&quot;/&gt;&lt;/g&gt;`}
function chart(svg,c){
  if(!svg)return;
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 365 290&#x27;);
  const sb=c.sub||&#x27;&#x27;;
  let s=arrow(44,262,318,262,&#x27;axa&#x27;)+arrow(44,262,44,8,&#x27;axa&#x27;)+`&lt;text x=&quot;52&quot; y=&quot;20&quot;&gt;P&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;${sb}&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;306&quot; y=&quot;282&quot;&gt;Y&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;${sb}&lt;/tspan&gt;&lt;/text&gt;`;
  if(c.guide!=null)s+=`&lt;line class=&quot;guide&quot; x1=&quot;${X(c.guide)}&quot; y1=&quot;262&quot; x2=&quot;${X(c.guide)}&quot; y2=&quot;24&quot;/&gt;&lt;text x=&quot;${X(c.guide)}&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot;&gt;Y*&lt;/text&gt;`;
  (c.lines||[]).forEach(l=&gt;{const[a,pa,b,pb]=seg(l.k,l.sh);s+=`&lt;line class=&quot;ln ${l.c||&#x27;&#x27;}&quot; x1=&quot;${X(a)}&quot; y1=&quot;${P(pa)}&quot; x2=&quot;${X(b)}&quot; y2=&quot;${P(pb)}&quot;/&gt;`;if(l.lab)s+=`&lt;text class=&quot;ll ${l.c||&#x27;&#x27;}&quot; x=&quot;${X(b)+4}&quot; y=&quot;${P(pb)+(l.k===&#x27;D&#x27;?12:-2)}&quot;&gt;${l.lab}&lt;/text&gt;`});
  (c.arr||[]).forEach(r=&gt;s+=arrow(X(r[0]),P(r[1]),X(r[2]),P(r[3]),&#x27;arr &#x27;+(r[4]||&#x27;&#x27;)));
  (c.pts||[]).forEach(q=&gt;{const[y,p]=eq(q.d,q.s);s+=`&lt;circle class=&quot;pt ${q.c||&#x27;&#x27;}&quot; cx=&quot;${X(y)}&quot; cy=&quot;${P(p)}&quot; r=&quot;4.8&quot;/&gt;`;if(q.lab){const r=q.pos===&#x27;r&#x27;;s+=`&lt;text class=&quot;pl&quot; x=&quot;${X(y)+(r?9:-9)}&quot; y=&quot;${P(p)-8}&quot; text-anchor=&quot;${r?&#x27;start&#x27;:&#x27;end&#x27;}&quot;&gt;${q.lab}&lt;/text&gt;`}});
  svg.innerHTML=s;
}
const base=[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;}];

/* grafici statici */
const STATIC={
  &#x27;indip-F&#x27;:{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D″&#x27;,c:&#x27;adj&#x27;}],pts:[{d:-2,s:0,c:&#x27;sh&#x27;,lab:&#x27;shock&#x27;},{d:0,s:0,c:&#x27;adj&#x27;,lab:&#x27;after&#x27;,pos:&#x27;r&#x27;}],arr:[[4.7,3.4,6.5,3.4,&#x27;adj&#x27;]]},
  &#x27;indip-G&#x27;:{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D″&#x27;,c:&#x27;adj&#x27;}],pts:[{d:2,s:0,c:&#x27;sh&#x27;,lab:&#x27;shock&#x27;},{d:0,s:0,c:&#x27;adj&#x27;,lab:&#x27;after&#x27;,pos:&#x27;r&#x27;}],arr:[[6.5,5.4,4.7,5.4,&#x27;adj&#x27;]]},
  &#x27;open&#x27;:{sub:&#x27;O&#x27;,lines:[...base,{k:&#x27;D&#x27;,sh:2.4,lab:&#x27;D′&#x27;,c:&#x27;adj&#x27;},{k:&#x27;S&#x27;,sh:2,lab:&#x27;S′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,lab:&#x27;E₀&#x27;},{d:2.4,s:2,c:&#x27;sh&#x27;,lab:&#x27;E₁&#x27;}],arr:[[7.1,3,9.2,3,&#x27;adj&#x27;],[8,8.2,6.4,8.2,&#x27;sh&#x27;]]},
  &#x27;closed&#x27;:{sub:&#x27;C&#x27;,lines:[...base,{k:&#x27;D&#x27;,sh:1.2,lab:&#x27;D′&#x27;,c:&#x27;adj&#x27;},{k:&#x27;S&#x27;,sh:.4,lab:&#x27;S′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,lab:&#x27;E₀&#x27;},{d:1.2,s:.4,c:&#x27;sh&#x27;,lab:&#x27;E₁&#x27;,pos:&#x27;r&#x27;}],arr:[[7.05,3,8.1,3,&#x27;adj&#x27;]]},
  &#x27;sym-F&#x27;:{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-2,s:0,c:&#x27;sh&#x27;}],arr:[[6.3,3.6,4.5,3.6,&#x27;sh&#x27;]]},
  &#x27;sym-G&#x27;:{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-2,s:0,c:&#x27;sh&#x27;}],arr:[[6.3,3.6,4.5,3.6,&#x27;sh&#x27;]]}
};
$$(&#x27;svg[data-chart]&#x27;).forEach(s=&gt;chart(s,STATIC[s.dataset.chart]));

/* parte 2: shock asimmetrico */
function idx(y){return Math.round(y/5*100)}
function drawShock(){
  const r=$(&#x27;#shockRange&#x27;);if(!r)return;const v=+r.value;
  $(&#x27;#shockOut&#x27;).value=v.toFixed(1);
  chart($(&#x27;#chF2&#x27;),{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-v,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-v,s:0,c:&#x27;sh&#x27;,lab:&#x27;B′&#x27;}]});
  chart($(&#x27;#chG2&#x27;),{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:v,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:v,s:0,c:&#x27;sh&#x27;,lab:&#x27;A′&#x27;}]});
  const[yf,pf]=eq(-v,0),[yg,pg]=eq(v,0);
  $(&#x27;#shockF&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;Y ${idx(yf)} · P ${idx(pf)}&lt;/span&gt;${v?&#x27;income ↓, unemployment ↑, budget deficit and likely CA deficit&#x27;:&#x27;initial equilibrium (index 100)&#x27;}`;
  $(&#x27;#shockG&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;Y ${idx(yg)} · P ${idx(pg)}&lt;/span&gt;${v?&#x27;income ↑, inflationary pressure, budget surplus and likely CA surplus&#x27;:&#x27;initial equilibrium (index 100)&#x27;}`;
}
$(&#x27;#shockRange&#x27;)?.addEventListener(&#x27;input&#x27;,drawShock);drawShock();

/* parte 3: banca centrale comune */
function drawCB(){
  const r=$(&#x27;#cbRange&#x27;);if(!r)return;const m=+r.value;

  $(&#x27;#phV&#x27;).innerHTML=Math.abs(r.k)&lt;.05?&#x27;The term (a − q̇ + Δm) − bu is zero: inflation stays equal to expectations, no spiral.&#x27;:r.k&gt;0?`In each round inflation exceeds expectations by ${r.k.toFixed(1)} points: if expectations adjust, inflation &lt;b&gt;rises round after round&lt;/b&gt; (vicious circle).`:`Inflation falls below expectations by ${(-r.k).toFixed(1)} points per round: disinflation, but paid for with high unemployment.`;
}
$$(&#x27;#ph input&#x27;).forEach(i=&gt;i.addEventListener(&#x27;input&#x27;,()=&gt;{hist=[];drawPh()}));

$(&#x27;#phReset&#x27;)?.addEventListener(&#x27;click&#x27;,()=&gt;{hist=[];$(&#x27;#phE&#x27;).value=2;drawPh()});
