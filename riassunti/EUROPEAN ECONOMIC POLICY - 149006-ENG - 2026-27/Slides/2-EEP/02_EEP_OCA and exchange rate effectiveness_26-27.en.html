&lt;section class=&quot;part&quot; id=&quot;s1&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part I · slides 1–4&lt;/p&gt;&lt;h2&gt;Mundell and the starting question&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Is it really worth giving up one&#x27;s own currency? Before answering, we need to understand what is lost and what is gained.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;The lecture starts from an &lt;b&gt;economic&lt;/b&gt;, not a political, question: &lt;i&gt;when does it make sense&lt;/i&gt; to join a monetary union (&lt;span class=&quot;t&quot;&gt;monetary union&lt;/span&gt;, MU: a group of countries that adopts a single currency with a common central bank)? The answer rests on a &lt;b&gt;cost / benefit&lt;/b&gt; comparison. This lecture focuses mainly on the &lt;b&gt;costs&lt;/b&gt;: what happens when a country no longer has its own currency and exchange rate to use.&lt;/p&gt;
   &lt;h3&gt;Robert Mundell (1932–2021)&lt;/h3&gt;
   &lt;p&gt;Canadian economist, &lt;b&gt;1999 Nobel laureate&lt;/b&gt; for his pioneering work on monetary dynamics and &lt;span class=&quot;t&quot;&gt;optimum currency areas&lt;/span&gt; (OCA). His article &lt;i&gt;A Theory of Optimum Currency Areas&lt;/i&gt; (American Economic Review, 1961) is the text from which the entire literature on the euro originates.&lt;/p&gt;
   &lt;blockquote&gt;&lt;p&gt;«…supposing that the Common Market countries proceed with their plans for economic union, should these countries allow each national currency to fluctuate, or would a single currency area be preferable?»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;If the Common Market countries go ahead with economic union, should they let their currencies float, or is a single-currency area preferable?&lt;/span&gt;&lt;cite&gt;Mundell, AER 1961&lt;/cite&gt;&lt;/blockquote&gt;
   &lt;p&gt;In 1961 the European Economic Community had existed for only four years: Mundell&#x27;s question anticipates the birth of the euro (1999) by almost forty years.&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Currency area&lt;/span&gt;&lt;/b&gt;: a territory within which exchange rates are &lt;b&gt;fixed&lt;/b&gt;. A single currency is the extreme case: the exchange rate is fixed “forever” because it no longer exists.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Optimum currency area&lt;/b&gt;: the currency area of the “right” size, i.e. the one in which the benefits of the common currency exceed the costs of no longer being able to adjust the exchange rate.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;The key question therefore becomes: &lt;b&gt;what is the appropriate domain of a currency area?&lt;/b&gt; It need not coincide with national borders: it could be larger (several countries together) or smaller (different regions of the same country).&lt;/p&gt;
   &lt;blockquote&gt;&lt;p&gt;«It might seem at first that the question is purely academic… [But] certain parts of the world are undergoing processes of economic integration and disintegration, new experiments are being made, and a conception of what constitutes an optimum currency area can clarify the meaning of these experiments.»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;It looks like an academic question, since it is hard to imagine abandoning national currencies. But the world is going through processes of integration and disintegration: understanding what an optimum currency area is helps to interpret these experiments.&lt;/span&gt;&lt;/blockquote&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Benefits (intuition)&lt;/span&gt;&lt;h4&gt;Why join&lt;/h4&gt;&lt;p&gt;Lower transaction and currency-conversion costs, no exchange-rate uncertainty among members, more comparable prices, more trade and integration. &lt;small&gt;The lecture takes them as given and returns to them only in the final assessment.&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Costs (focus of the lecture)&lt;/span&gt;&lt;h4&gt;What is lost&lt;/h4&gt;&lt;p&gt;The ability to use the &lt;b&gt;national interest rate and exchange rate&lt;/b&gt; to respond to a shock that hits only one&#x27;s own country.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;How does Mundell define a currency area?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;A domain within which exchange rates are fixed. The single currency is its limiting case.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why, according to Mundell, is the question “what is the optimum currency area” not merely academic?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because some parts of the world are undergoing processes of economic integration and disintegration: the OCA concept helps make sense of these “experiments” (such as, decades later, the euro).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which side of the cost/benefit comparison does this lecture focus on?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The costs: the loss of monetary policy and the exchange rate as adjustment tools in the face of asymmetric shocks.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; data-tone=&quot;brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part II · slides 5–7&lt;/p&gt;&lt;h2&gt;The experiment: an asymmetric shock&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Two countries, with demand shifting from one to the other. This is the case in which having one&#x27;s own currency matters most.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;The analysis follows Mundell (1961). Two countries: &lt;b&gt;France (B)&lt;/b&gt; and &lt;b&gt;Germany (A)&lt;/b&gt;. A &lt;b&gt;permanent&lt;/b&gt; &lt;span class=&quot;t&quot;&gt;asymmetric shock&lt;/span&gt; to demand occurs (it hits the countries differently, here in opposite directions): consumers shift spending from French to German products.&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;aggregate demand &lt;b&gt;falls in France&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;aggregate demand &lt;b&gt;rises in Germany&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
   &lt;p&gt;The shock will be studied under &lt;b&gt;two regimes&lt;/b&gt;: (1) the two countries form a monetary union; (2) the two countries are independent, each with its own currency and central bank.&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Tool&lt;/span&gt;&lt;p&gt;The model is the standard &lt;b&gt;AD-AS&lt;/b&gt; framework: the price level P on the vertical axis, output (income) Y on the horizontal axis. Aggregate demand D slopes downward, aggregate supply S slopes upward. A demand shock &lt;i&gt;shifts&lt;/i&gt; the D curve; a change in nominal wages shifts the S curve, because it changes firms&#x27; costs.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Try it: adjust the size of the shock&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Indices start at 100 in the initial equilibrium. The dashed line is the new demand curve.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shockRange&quot;&gt;Shock size&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shockRange&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;shockOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;France (country B)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chF2&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;AD-AS diagram for France: demand shifts to the left&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germany (country A)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chG2&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;AD-AS diagram for Germany: demand shifts to the right&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i&gt;&lt;/i&gt;current curves&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;after the shock&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;ghost&quot;&gt;&lt;/i&gt;before the shock&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;shockF&quot;&gt;&lt;/div&gt;&lt;div id=&quot;shockG&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;What happens in the two countries&lt;/h3&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Germany · A&lt;/span&gt;&lt;h4&gt;Income ↑ and inflation&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Inflationary pressure.&lt;/b&gt; Income rises: tax revenues increase and expenditure falls (e.g. fewer unemployment benefits) → &lt;b&gt;budget surplus&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;External accounts: more exports to France → likely &lt;b&gt;CA surplus&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;France · B&lt;/span&gt;&lt;h4&gt;Income ↓ and unemployment&lt;/h4&gt;&lt;p&gt;Income falls and unemployment rises: lower revenues, higher social spending → &lt;b&gt;budget deficit&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Likely &lt;b&gt;CA deficit&lt;/b&gt;. Together they form the &lt;span class=&quot;t&quot;&gt;twin deficits&lt;/span&gt; (public budget and current account in deficit at the same time).&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Glossary&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Current account&lt;/span&gt; (CA)&lt;/b&gt;: the current-account balance of the balance of payments, i.e. mainly exports minus imports of goods and services (plus net primary income and transfers from abroad).&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Balance of payments&lt;/span&gt;&lt;/b&gt;: the record of all of a country&#x27;s transactions with the rest of the world. By changing incomes, the shock therefore also affects public finances and the external accounts.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;What makes the shock in the example “asymmetric”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It hits the two countries in opposite ways: demand falls in France and rises in Germany. A single common instrument therefore cannot correct both.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the shock create a budget deficit in France?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;With lower income, tax revenues fall and automatic expenditures, such as unemployment benefits, rise. The opposite happens in Germany: a surplus.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are twin deficits?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;A public budget deficit and a current-account deficit occurring together, as in the country hit by the negative shock.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part III · slides 8–12 · regime 1&lt;/p&gt;&lt;h2&gt;In a union: one central bank, two opposite problems&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;The common monetary policy cannot cure French unemployment and German inflation at the same time. And fiscal policy has its own limits.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Monetary policy: expansionary or contractionary?&lt;/h3&gt;
   &lt;p&gt;In a monetary union there is &lt;b&gt;a single interest rate&lt;/b&gt;, set by the common central bank (CB). Whatever it chooses helps one country and hurts the other:&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;expansionary&lt;/b&gt;: worsens &lt;b&gt;inflation&lt;/b&gt; in A but restores &lt;b&gt;full employment&lt;/b&gt; in B;&lt;/li&gt;&lt;li&gt;&lt;b&gt;contractionary&lt;/b&gt;: curbs inflation in A but worsens &lt;b&gt;unemployment&lt;/b&gt; in B.&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;You are the common central bank&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Move the slider: the common monetary policy shifts demand in both countries in the same direction. The light lines show demand before and after the shock.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cbRange&quot;&gt;Contractionary ← → Expansionary&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cbRange&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;cbOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;France (B)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chF3&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;France under the common monetary policy&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germany (A)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chG3&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germany under the common monetary policy&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;cbF&quot;&gt;&lt;/div&gt;&lt;div id=&quot;cbG&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;cbVerdict&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;blockquote&gt;&lt;p&gt;«…the principal way in which the monetary policy is effective in correcting full employment in the deficit region is by raising prices in the surplus region. Full employment thus imparts an inflationary bias to the multiregional economy…»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;The main way monetary policy restores employment in the deficit region is by raising prices in the surplus region. Targeting full employment therefore gives the currency area an &lt;span class=&quot;t&quot;&gt;inflationary bias&lt;/span&gt;.&lt;/span&gt;&lt;cite&gt;Mundell 1961&lt;/cite&gt;&lt;/blockquote&gt;
   &lt;blockquote&gt;&lt;p&gt;«…in a currency area comprising many regions and a single currency, the pace of inflation is set by the willingness of central authorities to allow unemployment in deficit regions.»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;In an area with many regions and a single currency, the rate of inflation depends on how much unemployment the central authorities are willing to tolerate in the deficit regions.&lt;/span&gt;&lt;/blockquote&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The crux&lt;/span&gt;&lt;p&gt;How willing is the CB to accept unemployment in deficit countries rather than inflation in surplus countries? It depends on its &lt;b&gt;preferences&lt;/b&gt; (theory, upcoming lectures) and on the objective the &lt;b&gt;TFEU&lt;/b&gt; assigns to the ECB: price stability.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;If the CB &lt;b&gt;does nothing&lt;/b&gt;, France cannot stimulate demand through monetary policy and Germany cannot restrain it: &lt;b&gt;monetary policy does not restore equilibrium.&lt;/b&gt;&lt;/p&gt;

   &lt;h3&gt;Fiscal policy: not ideal if shocks are permanent&lt;/h3&gt;
   &lt;p&gt;Key distinction: a &lt;span class=&quot;t&quot;&gt;transitory&lt;/span&gt; shock (bound to reverse) and a &lt;span class=&quot;t&quot;&gt;permanent&lt;/span&gt; shock (one that changes demand lastingly) call for different responses.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs prose&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Types of budget&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-c&quot; aria-controls=&quot;tp-c&quot; aria-selected=&quot;true&quot;&gt;1 · Centralised budget&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-n&quot; aria-controls=&quot;tp-n&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;2 · Non-centralised budget&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-c&quot; aria-labelledby=&quot;tb-c&quot;&gt;
    &lt;p&gt;If the Union has a sizeable common budget, it can shift income from one country to another: &lt;span class=&quot;t&quot;&gt;inter-regional transfers&lt;/span&gt;, from Germany in surplus to France in deficit.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Transitory shock&lt;/span&gt;&lt;p&gt;Transfers can be a &lt;b&gt;good solution&lt;/b&gt;: they cover the difficult period and then stop. (Are EU shocks mainly transitory or permanent? We will see in the upcoming lectures.)&lt;/p&gt;&lt;/div&gt;
     &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Permanent shock&lt;/span&gt;&lt;p&gt;Transfers would become permanent → &lt;span class=&quot;t&quot;&gt;moral hazard&lt;/span&gt; (the recipient no longer has an incentive to adjust: opportunistic behaviour), with serious consequences. &lt;b&gt;They should not be used.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-n&quot; aria-labelledby=&quot;tb-n&quot; hidden&gt;
    &lt;p&gt;Without a common budget, national &lt;span class=&quot;t&quot;&gt;automatic stabilisers&lt;/span&gt; can be used (taxes and expenditures that move on their own with the cycle, such as lower revenues and higher benefits in a recession). However:&lt;/p&gt;
    &lt;ul class=&quot;clean&quot;&gt;
     &lt;li&gt;they make sense &lt;b&gt;only for transitory shocks&lt;/b&gt;;&lt;/li&gt;
     &lt;li&gt;even then, the room for manoeuvre may be &lt;b&gt;too limited&lt;/b&gt; because of fiscal rules, especially if debt or deficit are already high;&lt;/li&gt;
     &lt;li&gt;it may be difficult to &lt;b&gt;obtain market financing&lt;/b&gt;: sometimes the stabilisers do not work at all or are “switched off” (see below: the role of financial investors);&lt;/li&gt;
     &lt;li&gt;with permanent shocks, fiscal policy can cause &lt;b&gt;public debt to rise&lt;/b&gt;;&lt;/li&gt;
     &lt;li&gt;public debt implies &lt;span class=&quot;t&quot;&gt;inter-generational transfers&lt;/span&gt;: the cost is passed on to future generations.&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;First conclusion&lt;/span&gt;&lt;p&gt;In a monetary union, monetary and/or fiscal policy &lt;b&gt;may not be effective&lt;/b&gt; against an asymmetric, permanent shock. &lt;b&gt;Alternative&lt;/b&gt; adjustment mechanisms are needed, which bring economies back to equilibrium on their own.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;What does Mundell mean by “inflationary bias”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;If the common central bank wants full employment in the deficit region, it must expand, and in doing so raises prices in the surplus region. A single-currency area that targets full employment therefore tends towards higher inflation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;With a centralised budget, does it make sense to handle a permanent asymmetric shock through fiscal policy? Why?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. Transfers would become permanent and create moral hazard: the assisted country no longer has incentives to adjust. Inter-regional transfers are appropriate for transitory shocks.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why may national automatic stabilisers be insufficient even with transitory shocks?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Fiscal rules limit the room for manoeuvre, especially when debt or deficit are already high, and the market may refuse to finance the government: in that case the stabilisers are effectively switched off.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; data-tone=&quot;sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part IV · slides 13–22&lt;/p&gt;&lt;h2&gt;Alternative mechanisms: wage flexibility and labour mobility&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;If monetary and fiscal policy are not enough, can markets adjust on their own? Mundell points to two routes.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;1 · Wage flexibility&lt;/h3&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Where unemployment U has &lt;b&gt;risen&lt;/b&gt; (France), wages W &lt;b&gt;fall&lt;/b&gt; → the French supply curve shifts &lt;b&gt;down&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Where U has &lt;b&gt;fallen&lt;/b&gt; (Germany), W &lt;b&gt;rises&lt;/b&gt; → the German supply curve shifts &lt;b&gt;up&lt;/b&gt;.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;p&gt;Wage flexibility translates into price flexibility through the price-setting rule:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt; = &lt;i&gt;ẇ&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;&lt;span class=&quot;note&quot;&gt;a dot over a letter denotes a growth rate (in %)&lt;/span&gt;&lt;/div&gt;
   &lt;dl class=&quot;legenda&quot;&gt;&lt;dt&gt;ṗ&lt;/dt&gt;&lt;dd&gt;price inflation&lt;/dd&gt;&lt;dt&gt;ẇ&lt;/dt&gt;&lt;dd&gt;nominal wage growth&lt;/dd&gt;&lt;dt&gt;q̇&lt;/dt&gt;&lt;dd&gt;labour productivity growth: it offsets wages, because the same worker produces more&lt;/dd&gt;&lt;dt&gt;Δm&lt;/dt&gt;&lt;dd&gt;change in the &lt;span class=&quot;t&quot;&gt;mark-up&lt;/span&gt; (firms&#x27; margin over costs)&lt;/dd&gt;&lt;/dl&gt;
   &lt;p&gt;Other things being equal (&lt;i&gt;ceteris paribus&lt;/i&gt;), lower wages mean lower prices: this is the shift of the S curve.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;wage&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Adjustment via wages, step by step&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Use the arrows or the dots.&lt;/p&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;France&lt;/b&gt;&lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;France: wage adjustment&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germany&lt;/b&gt;&lt;svg class=&quot;adas st-g&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germany: wage adjustment&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h4&gt;Second-order effects of the wage cut in France&lt;/h4&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Domestic demand ↓&lt;/span&gt;&lt;p&gt;The &lt;b&gt;real wage&lt;/b&gt; W/P falls, because W falls more than consumer prices P. French consumption and domestic demand decline.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Competitiveness ↑&lt;/span&gt;&lt;p&gt;The &lt;span class=&quot;t&quot;&gt;real exchange rate&lt;/span&gt; (ratio of price levels, a measure of competitiveness) &lt;span class=&quot;math&quot;&gt;E&lt;sup&gt;R&lt;/sup&gt;&lt;sub&gt;F&lt;/sub&gt; = P&lt;sub&gt;F&lt;/sub&gt; / P&lt;sub&gt;G&lt;/sub&gt;&lt;/span&gt; falls: French goods become relatively cheaper. Symmetrically, Germany loses competitiveness.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;p&gt;&lt;b&gt;Both countries “contribute”&lt;/b&gt; to the change in relative competitiveness: to restore equilibrium, prices must &lt;b&gt;fall in France and rise in Germany&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;But…&lt;/span&gt;&lt;p&gt;Are wages and prices flexible enough, and are they allowed to adjust? Wages may be &lt;b&gt;downwardly rigid&lt;/b&gt; in B (e.g. because of minimum wages), or the CB may fear inflationary pressure in A and prevent German prices from rising.&lt;/p&gt;&lt;/div&gt;
   &lt;blockquote&gt;&lt;p&gt;«…if A tightens credit restrictions to prevent prices from rising, all the burden of adjustment is thrust onto country B; what is needed is a reduction in B’s real income… and it must be accomplished by a decline in B’s output and employment. The policy of surplus countries in restraining prices therefore imparts a recessive tendency…»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;If A tightens credit to stop prices from rising, the entire burden of adjustment falls on B, whose real income must fall through lower output and employment. The policy of surplus countries in restraining prices gives the area a recessionary tendency.&lt;/span&gt;&lt;cite&gt;Mundell 1961&lt;/cite&gt;&lt;/blockquote&gt;

   &lt;h3&gt;2 · Labour mobility&lt;/h3&gt;
   &lt;p&gt;If unemployed French workers move to Germany, unemployment falls in France and wage pressure eases in Germany: &lt;b&gt;wages need not change&lt;/b&gt;. But does labour mobility work in Europe?&lt;/p&gt;
   &lt;ol class=&quot;tl&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;1957&lt;/span&gt;&lt;b&gt;Meade&lt;/b&gt;: Western Europe lacks the conditions for a common currency, above all because of low labour mobility.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;1992&lt;/span&gt;&lt;b&gt;MIT panel&lt;/b&gt; (Blanchard, Dornbusch, Fischer, Krugman): a common European currency would have «unfavourable economic repercussions». Blanchard: «currency unification works in the US because labour can move between states. The labour mobility in Europe is negligible».&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;2013&lt;/span&gt;&lt;b&gt;Dao et al.&lt;/b&gt; (VoxEU): Europe has strengthened adjustment via mobility, especially in the 2008-09 recession, but not enough.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;2019&lt;/span&gt;&lt;b&gt;Basso et al.&lt;/b&gt; (VoxEU): the elasticity of labour supply to economic shocks, i.e. how much workers relocate when conditions change, is still lower in the euro area than in the US.&lt;/li&gt;
   &lt;/ol&gt;
   &lt;p&gt;Why is there so little movement? Mobility is &lt;b&gt;very low, especially for low-skilled workers&lt;/b&gt;. Main reason: &lt;b&gt;social security systems&lt;/b&gt;, which are national and poorly “portable”. Other reasons: &lt;b&gt;cultural and language differences&lt;/b&gt;.&lt;/p&gt;
   &lt;h4&gt;The facts: EU 2024 Annual Report on intra-EU labour mobility&lt;/h4&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;~10 mn&lt;/div&gt;&lt;p&gt;working-age EU citizens living in another EU/EFTA country: a number that is &lt;b&gt;stable&lt;/b&gt; over time.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;~20 mn&lt;/div&gt;&lt;p&gt;third-country nationals, growing by 7% a year on average since 2019 (partly owing to the Russian invasion of Ukraine).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;26 · 11 · 10%&lt;/div&gt;&lt;p&gt;shares of &lt;span class=&quot;t&quot;&gt;movers&lt;/span&gt; (workers who move to another EU country): Romanians, Poles, Italians.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;3.2 mn&lt;/div&gt;&lt;p&gt;EU movers in &lt;b&gt;Germany&lt;/b&gt;, the top destination; followed by Spain, Switzerland and Italy (over 1 mn each).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;41% · 32%&lt;/div&gt;&lt;p&gt;of working-age movers are aged 35-49 (vs 34% of nationals) and 32% are aged 20-34: &lt;b&gt;relatively young&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Composition of inflows into EU and EFTA countries, 2022&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Reconstruction of Figure 6 of the 2024 Report. Values are read by eye from the chart in the slides: use them for proportions, not as exact data. Highlighted: EU-27 average, Italy, Germany and France.&lt;/p&gt;
   &lt;div class=&quot;bkey&quot;&gt;&lt;span&gt;&lt;i class=&quot;b1&quot;&gt;&lt;/i&gt;EU movers&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;b2&quot;&gt;&lt;/i&gt;Nationals (returning citizens)&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;b3&quot;&gt;&lt;/i&gt;Third-country nationals&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Sort by&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;a&quot;&gt;Sort by EU movers&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;b&quot;&gt;by nationals&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;c&quot;&gt;by third-country&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;bars&quot; id=&quot;mobBars&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;small&quot;&gt;How to read it: on the EU average, only about 1 inflow in 6 is a citizen of another EU country. Most new arrivals come from third countries: &lt;i&gt;internal&lt;/i&gt; mobility remains limited.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;First conclusion (slide 22)&lt;/span&gt;&lt;p&gt;In the face of an &lt;b&gt;asymmetric, permanent&lt;/b&gt; demand shock, monetary union is &lt;b&gt;costly&lt;/b&gt; if wages and prices are &lt;b&gt;not flexible&lt;/b&gt; and/or labour is &lt;b&gt;not sufficiently mobile&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;If monetary policy does not respond and the automatic mechanisms do not work, the affected country must find its own way back to equilibrium: often this has been &lt;span class=&quot;t&quot;&gt;internal devaluation&lt;/span&gt; (part 7).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;According to Mundell, what are the automatic adjustment mechanisms in an MU?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Wage and price flexibility, which shifts the supply curves and changes relative competitiveness, and labour mobility from struggling countries to expanding ones.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How is a country&#x27;s competitiveness relative to another measured?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;With the real exchange rate, the ratio of price levels: &lt;span class=&quot;math&quot;&gt;E&lt;sup&gt;R&lt;/sup&gt;&lt;sub&gt;F&lt;/sub&gt; = P&lt;sub&gt;F&lt;/sub&gt;/P&lt;sub&gt;G&lt;/sub&gt;&lt;/span&gt;. If it falls, France becomes more competitive. Outside an MU it is also multiplied by the nominal exchange rate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the anti-inflationary policy of surplus countries create a “recessionary tendency”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;If A prevents its own prices from rising, the entire change in relative prices must come from falling prices in B, and hence from lower output and employment in B.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the main reason for low labour mobility in the EU?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Social security systems, together with cultural and language differences. Mobility is particularly low among low-skilled workers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; data-tone=&quot;ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part V · slides 23–27 · regime 2&lt;/p&gt;&lt;h2&gt;Second regime: monetary independence&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;What if France and Germany had kept the franc, the mark and their own central banks?&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;With national currencies and central banks, each country can use the &lt;b&gt;interest rate&lt;/b&gt; and/or the &lt;b&gt;exchange rate&lt;/b&gt; to respond. The goal: reduce unemployment in France and inflation in Germany.&lt;/p&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;France&lt;/span&gt;&lt;h4&gt;Expansionary policy&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Depreciation&lt;/span&gt; (under flexible exchange rates) or &lt;span class=&quot;t&quot;&gt;devaluation&lt;/span&gt; (decided by the authorities, under fixed exchange rates) of the franc, or a &lt;b&gt;cut in the interest rate&lt;/b&gt;. French goods become cheaper abroad and demand picks up again.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Germany&lt;/span&gt;&lt;h4&gt;Contractionary policy&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Appreciation&lt;/span&gt; / &lt;span class=&quot;t&quot;&gt;revaluation&lt;/span&gt; of the mark, or a &lt;b&gt;rise in the interest rate&lt;/b&gt;. Excess demand cools down.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Effects of monetary expansion in France and contraction in Germany&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;D′ is demand after the shock; D″ is demand after the national monetary policy, which brings it back to its initial level.&lt;/p&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;France&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;indip-F&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;France: devaluation shifts demand back to the right&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germany&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;indip-G&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germany: revaluation shifts demand back to the left&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;after the shock&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;adj&quot;&gt;&lt;/i&gt;after the national policy&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Where shocks are asymmetric and markets are rigid, &lt;b&gt;being in a monetary union may cost more than staying out&lt;/b&gt;. The next step is to ask how effective the exchange-rate policy of an independent country really is in the face of a &lt;b&gt;permanent&lt;/b&gt; shock.&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Note&lt;/span&gt;&lt;p&gt;The exchange rate works well only if the shock coincides with &lt;b&gt;national borders&lt;/b&gt;. If the shock hits a &lt;b&gt;sector of production that spans borders&lt;/b&gt;, or only &lt;b&gt;one region&lt;/b&gt; of a country, the national exchange rate is too blunt an instrument: devaluing also helps those who do not need it.&lt;/p&gt;&lt;/div&gt;
   &lt;h3&gt;Three arguments that scale down the benefits of independence&lt;/h3&gt;
   &lt;p&gt;This is the critique of the idea that independent countries are better equipped against asymmetric shocks:&lt;/p&gt;
   &lt;div class=&quot;grid3&quot;&gt;
    &lt;a class=&quot;card&quot; href=&quot;#s6&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1 · Effectiveness&lt;/span&gt;&lt;h4&gt;Does it work?&lt;/h4&gt;&lt;p&gt;Is national monetary policy, including the exchange rate, &lt;b&gt;effective&lt;/b&gt;? → part 6&lt;/p&gt;&lt;/a&gt;
    &lt;a class=&quot;card&quot; href=&quot;#s8&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;span class=&quot;tag&quot;&gt;2 · Credibility&lt;/span&gt;&lt;h4&gt;Is it credible?&lt;/h4&gt;&lt;p&gt;Can a central bank that devalues frequently be &lt;b&gt;credible&lt;/b&gt; on price stability? → part 8&lt;/p&gt;&lt;/a&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;3 · Likelihood&lt;/span&gt;&lt;h4&gt;Does it really happen?&lt;/h4&gt;&lt;p&gt;How &lt;b&gt;likely&lt;/b&gt; are permanent asymmetric shocks? How much do differences between countries matter? → upcoming lectures&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between depreciation and devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Both reduce the external value of the currency. Depreciation is the term used under flexible exchange rates (the market decides), devaluation under fixed exchange rates (the authorities decide). The same applies to appreciation and revaluation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which kinds of shock are well addressed by exchange-rate policy?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Asymmetric shocks that coincide with national borders and, as we will see, preferably transitory ones. With cross-border sectoral or regional shocks the exchange rate is ill-suited, and with permanent shocks its effects erode.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; data-tone=&quot;ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part VI · slides 28–33&lt;/p&gt;&lt;h2&gt;How well does devaluation really work?&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Devaluing makes domestic goods cheaper, but it also makes imports more expensive. Workers notice.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Assumption: a negative, &lt;b&gt;permanent&lt;/b&gt; demand shock. The independent country depreciates or devalues. There are three effects:&lt;/p&gt;
   &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;1 · at given prices, competitiveness ↑ → AD ↑&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;2 · import prices ↑ → prices ↑&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;3 · &lt;span class=&quot;t&quot;&gt;second round effects&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;&lt;b&gt;Second-round effects&lt;/b&gt; operate through &lt;span class=&quot;t&quot;&gt;wage resistance&lt;/span&gt;, the demand for wage increases to protect the &lt;span class=&quot;t&quot;&gt;consumption wage&lt;/span&gt;, i.e. &lt;span class=&quot;t&quot;&gt;wage purchasing power&lt;/span&gt;: the ratio of the nominal wage to the consumer price index, &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt;.&lt;/p&gt;
   &lt;h3&gt;The effect of devaluation on the consumption wage&lt;/h3&gt;
   &lt;p&gt;Consumer prices P&lt;sub&gt;C&lt;/sub&gt; are a &lt;b&gt;weighted geometric mean&lt;/b&gt; of the prices of domestic goods (P&lt;sub&gt;E&lt;/sub&gt;) and imported goods (P&lt;sub&gt;M&lt;/sub&gt;):&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sub&gt;C&lt;/sub&gt; = P&lt;sub&gt;E&lt;/sub&gt;&lt;sup&gt;1−s&lt;/sup&gt; · P&lt;sub&gt;M&lt;/sub&gt;&lt;sup&gt;s&lt;/sup&gt; = P&lt;sub&gt;E&lt;/sub&gt;&lt;sup&gt;1−s&lt;/sup&gt; · (P&lt;sub&gt;M$&lt;/sub&gt; / E)&lt;sup&gt;s&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;s = share of imports in the consumption basket&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;The domestic-currency price of imports is the dollar price P&lt;sub&gt;M$&lt;/sub&gt; divided by the exchange rate E, expressed as units of foreign currency per unit of domestic currency. Taking logarithms and differentiating with respect to time:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;C&lt;/sub&gt; = (1 − s) &lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;E&lt;/sub&gt; + s (&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;M$&lt;/sub&gt; − &lt;i&gt;ė&lt;/i&gt;)&lt;span class=&quot;note&quot;&gt;a devaluation is a fall in E, so ė &amp;lt; 0 and − ė raises consumer price inflation&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;The larger &lt;b&gt;s&lt;/b&gt;, the more the devaluation passes through to consumer prices. In &lt;b&gt;small open economies&lt;/b&gt; s is large: they are more exposed to exchange-rate variability.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;cw&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Calculator: devaluation → consumer prices → real wage&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;The nominal wage W stays fixed. Set the import share and the size of the devaluation.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwS&quot;&gt;Import share s&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwS&quot; min=&quot;0&quot; max=&quot;0.8&quot; step=&quot;0.05&quot; value=&quot;0.3&quot;&gt;&lt;output id=&quot;cwSo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwDep&quot;&gt;Devaluation (−ė)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwDep&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cwDepo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwPE&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; domestic prices&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwPE&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwPEo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwPM&quot;&gt;ṗ&lt;sub&gt;M$&lt;/sub&gt; imports in $&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwPM&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwPMo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;cwPc&quot;&gt;&lt;/div&gt;&lt;div id=&quot;cwW&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;cwV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Very open vs relatively closed country&lt;/h3&gt;
   &lt;p&gt;In both, devaluation shifts demand to the right, but the wage response shifts supply up. In the &lt;b&gt;open&lt;/b&gt; country the pressure on prices is strong, the jump in wages and costs is large and the output gain almost vanishes. In the &lt;b&gt;closed&lt;/b&gt; country the two curves move less.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Very open country&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;open&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Open country: large shifts in demand and supply, sharp rise in prices&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Relatively closed country&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;closed&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Closed country: small shifts in demand and supply&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i class=&quot;adj&quot;&gt;&lt;/i&gt;demand after the devaluation&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;supply after the wage response&lt;/span&gt;&lt;/div&gt;
   &lt;p class=&quot;small&quot; style=&quot;text-align:center&quot;&gt;For European countries, the evidence shows that the erosion of the initial competitive advantage gained through devaluation is &lt;b&gt;very large&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Indexation and a historical case&lt;/h3&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;When devaluation raises consumer prices, the real wage &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt; falls (W is initially fixed): workers lose purchasing power.&lt;/li&gt;
    &lt;li&gt;Historically, &lt;b&gt;trade unions and wage bargaining&lt;/b&gt; have played an important role in resisting this loss.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;t&quot;&gt;Indexation mechanisms&lt;/span&gt; (which automatically adjust wages to inflation) can kick in and create a &lt;b&gt;vicious circle&lt;/b&gt; leading to more inflation.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Historical case · Italy 1992&lt;/span&gt;&lt;p&gt;In &lt;b&gt;July 1992&lt;/b&gt; the &lt;b&gt;scala mobile&lt;/b&gt;, Italy&#x27;s mechanism for automatically indexing wages to prices, was abolished. In &lt;b&gt;September 1992&lt;/b&gt; the lira was devalued and left the European exchange-rate arrangements. Without automatic indexation, the devaluation does not pass through automatically to wages and the wage-price spiral stops before it starts.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The interpretation of this case should be checked against what was said in the lecture: the slide contains only the title.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;depr&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Adjustment via devaluation in an independent country&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Reconstruction of slide 33: four steps from F to F″.&lt;/p&gt;
   &lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Devaluation in an independent country: from F to F prime, then F, then F double prime&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Takeaway&lt;/span&gt;&lt;p&gt;Wage resistance &lt;b&gt;reduces the effectiveness&lt;/b&gt; of exchange-rate policy. In the medium run, devaluing &lt;b&gt;does not raise competitiveness permanently&lt;/b&gt;: it raises inflation.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;“If the nominal exchange rate depreciates, competitiveness definitely improves.” Do you agree?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Only in the short run and at given prices. Devaluation raises import prices and hence P&lt;sub&gt;C&lt;/sub&gt;; workers demand higher wages (wage resistance, indexation), costs and prices rise and the advantage erodes, all the more so the more open the country is.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How does the consumption wage change after a devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It falls: W is initially fixed while P&lt;sub&gt;C&lt;/sub&gt; rises by an extra &lt;span class=&quot;math&quot;&gt;s·(−ė)&lt;/span&gt; because of import prices. It is this loss that triggers demands for wage increases.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why are small open economies more vulnerable to exchange-rate variability?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because they have a high import share s in the basket: every change in the exchange rate passes through strongly to consumer prices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; data-tone=&quot;brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;07&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part VII · slides 34–39&lt;/p&gt;&lt;h2&gt;Internal devaluation: devaluing without an exchange rate&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Within a monetary union, competitiveness can be regained only by moving relative prices, that is, wages.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Between member countries, competitiveness is simply the &lt;b&gt;ratio of the prices&lt;/b&gt; of domestic goods:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; / P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;span class=&quot;note&quot;&gt;prices of goods produced in B relative to those produced in A&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Internal devaluation&lt;/span&gt;&lt;/b&gt;: a member country of an MU responds to a negative asymmetric shock by &lt;b&gt;cutting wages&lt;/b&gt; to lower the prices of domestic goods and regain competitiveness, without touching the exchange rate.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;Effects on the consumption wage &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt;:&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;the nominal wage W &lt;b&gt;falls&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;P&lt;sub&gt;C&lt;/sub&gt; falls, but &lt;b&gt;only through domestic prices&lt;/b&gt;: import prices do not change;&lt;/li&gt;&lt;li&gt;hence the consumption wage &lt;b&gt;falls&lt;/b&gt; (the cut in W exceeds the fall in P&lt;sub&gt;C&lt;/sub&gt;) → likely &lt;b&gt;wage resistance&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;C&lt;/sub&gt; = (1 − s) &lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;E&lt;/sub&gt; + s (&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;M$&lt;/sub&gt; − &lt;i&gt;ė&lt;/i&gt;)&lt;span class=&quot;note&quot;&gt;here ė = 0: P&lt;sub&gt;C&lt;/sub&gt; falls only through the (1 − s) component linked to domestic prices&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;intdev&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Adjustment via internal devaluation&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Reconstruction of slide 36: three steps from F to F″.&lt;/p&gt;
   &lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Internal devaluation: from F to F prime, then F double prime with lower prices&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Two policies compared&lt;/h3&gt;
   &lt;p&gt;To have &lt;b&gt;lasting effects&lt;/b&gt;, both internal devaluation (in an MU) and exchange-rate devaluation (independent country) require the &lt;b&gt;consumption wage to fall&lt;/b&gt; in the affected country. What differs is &lt;i&gt;how&lt;/i&gt; this is achieved.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tscroll prose&quot;&gt;
   &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Exchange-rate devaluation&lt;/th&gt;&lt;th&gt;Internal devaluation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Where&lt;/td&gt;&lt;td&gt;independent country&lt;/td&gt;&lt;td&gt;member country of an MU&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;How W/P&lt;sub&gt;C&lt;/sub&gt; falls&lt;/td&gt;&lt;td&gt;mainly &lt;b&gt;P&lt;sub&gt;C&lt;/sub&gt; rises&lt;/b&gt; (more expensive imports)&lt;/td&gt;&lt;td&gt;mainly &lt;b&gt;W falls&lt;/b&gt; (nominal cuts)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Feasibility&lt;/td&gt;&lt;td&gt;a decision by the central bank or the government&lt;/td&gt;&lt;td&gt;nominal cuts are socially and politically &lt;b&gt;difficult&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Costs&lt;/td&gt;&lt;td&gt;risk of inflation&lt;/td&gt;&lt;td&gt;more &lt;b&gt;deflationary&lt;/b&gt;, larger output losses&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Money illusion&lt;/span&gt;&lt;/td&gt;&lt;td&gt;helps: a fixed nominal wage with rising prices is perceived less as a loss&lt;/td&gt;&lt;td&gt;&lt;b&gt;does not work&lt;/b&gt;: a pay cut is noticed immediately&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
   &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p class=&quot;small&quot;&gt;&lt;i&gt;Money illusion&lt;/i&gt;: the tendency to think in nominal rather than real terms. This is why monetary expansion can make the path to the new equilibrium &lt;b&gt;easier and less costly&lt;/b&gt; than the alternatives.&lt;/p&gt;
   &lt;h3&gt;Another route: letting prices rise in the strong countries&lt;/h3&gt;
   &lt;p&gt;In principle, &lt;span class=&quot;math&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;/P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt; can also fall because &lt;b&gt;P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; rises&lt;/b&gt;, i.e. by letting prices rise in the healthy countries: the point already made by Mundell. Historically, devaluations are far more common than internal devaluations, and the latter are more frequent in periods of &lt;b&gt;high inflation&lt;/b&gt; or when inflation is higher in the countries against which competitiveness is to be regained (Shambaugh, &lt;i&gt;The Euro’s Three Crises&lt;/i&gt;, 2012).&lt;/p&gt;
   &lt;h3&gt;Shambaugh&#x27;s example (2012)&lt;/h3&gt;
   &lt;p&gt;One third of the eurozone countries (the &lt;b&gt;periphery&lt;/b&gt;) must regain competitiveness through an internal devaluation of &lt;b&gt;3%&lt;/b&gt; relative to prices in the rest of the area (the &lt;b&gt;core&lt;/b&gt;): &lt;span class=&quot;math&quot;&gt;ṗ&lt;sub&gt;Periph&lt;/sub&gt; − ṗ&lt;sub&gt;core&lt;/sub&gt; = −0.03&lt;/span&gt;. Which combinations of inflation rates allow this?&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sh&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Calculator: average inflation vs differential&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Try the three combinations from the slide, then move the sliders yourself.&lt;/p&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;1,2.5&quot;&gt;1% / 2.5%&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;0,3&quot;&gt;0% / 3%&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;1,4&quot;&gt;1% / 4%&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shW&quot;&gt;Periphery weight&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shW&quot; min=&quot;0.1&quot; max=&quot;0.6&quot; step=&quot;0.0333&quot; value=&quot;0.3333&quot;&gt;&lt;output id=&quot;shWo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shPp&quot;&gt;ṗ periphery&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shPp&quot; min=&quot;-2&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;shPpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shPc&quot;&gt;ṗ core&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shPc&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;2.5&quot;&gt;&lt;output id=&quot;shPco&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;shEz&quot;&gt;&lt;/div&gt;&lt;div id=&quot;shDiff&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;shV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;1% and 2.5%&lt;/b&gt;: EZ inflation = ⅓·1 + ⅔·2.5 = &lt;b&gt;2%&lt;/b&gt;, the ECB target. But the differential is only &lt;b&gt;1.5 p.p.&lt;/b&gt;: too little.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;0% and 3%&lt;/b&gt;: a 3 p.p. differential with EZ inflation at 2%, but the periphery must have flat prices.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;1% and 4%&lt;/b&gt;: a 3 p.p. differential with EZ inflation at &lt;b&gt;3%&lt;/b&gt;.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Lesson&lt;/span&gt;&lt;p&gt;&lt;b&gt;Higher inflation in the currency area&lt;/b&gt;, at least in the short run, &lt;b&gt;facilitates the adjustment of relative prices&lt;/b&gt;: the periphery can regain competitiveness without deflation.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Historical case · Greece&lt;/span&gt;&lt;p&gt;After the 2010 debt crisis, Greece, with no exchange rate to devalue, pursued an &lt;b&gt;internal devaluation&lt;/b&gt; under its adjustment programmes: cuts in wages and costs to regain competitiveness, at the price of a sharp fall in output and employment. &lt;small&gt;The slide contains only the title: check data and details against the lecture material.&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;When do countries adopt an internal devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;When they belong to a monetary union (or have a fixed exchange rate they cannot give up), suffer a negative asymmetric shock, and the common monetary policy and automatic mechanisms (flexibility, mobility) are not enough. Historically it is more frequent with high inflation or when partner countries have higher inflation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why is internal devaluation more costly than exchange-rate devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It requires cuts in nominal wages: politically difficult, without the help of money illusion, more deflationary and with larger output losses.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In Shambaugh&#x27;s example, why is 1% / 2.5% not enough?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It meets the 2% average target, but yields a differential of 1.5 points instead of the 3 required. Reaching 3 requires flat prices in the periphery (0% / 3%) or higher average inflation (1% / 4%, average 3%).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;08&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part VIII · slides 40–42&lt;/p&gt;&lt;h2&gt;Repeated devaluations, expectations and credibility&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;If the effect of devaluation is only temporary, can one devalue again? Yes, but each time the price goes up.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Faced with a permanent shock, or a &lt;b&gt;structural weakness&lt;/b&gt;, the independent country could repeat the devaluation every time the effect wears off. But from the formula &lt;span class=&quot;math&quot;&gt;ṗ&lt;sub&gt;C&lt;/sub&gt; = (1−s)ṗ&lt;sub&gt;E&lt;/sub&gt; + s(ṗ&lt;sub&gt;M$&lt;/sub&gt; − ė)&lt;/span&gt;, each new devaluation &lt;b&gt;raises consumer price inflation&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;figure class=&quot;prose&quot;&gt;
   &lt;svg viewBox=&quot;0 0 640 330&quot; style=&quot;width:100%;height:auto&quot; role=&quot;img&quot; aria-labelledby=&quot;loopT&quot;&gt;
    &lt;title id=&quot;loopT&quot;&gt;Vicious circle: devaluation, prices, wages, inflation, new devaluation&lt;/title&gt;
    &lt;defs&gt;&lt;marker id=&quot;mh&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;circle cx=&quot;320&quot; cy=&quot;165&quot; r=&quot;118&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;g fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#mh)&quot;&gt;
     &lt;path d=&quot;M372 58 A118 118 0 0 1 434 118&quot;/&gt;&lt;path d=&quot;M438 210 A118 118 0 0 1 380 268&quot;/&gt;&lt;path d=&quot;M262 268 A118 118 0 0 1 204 210&quot;/&gt;&lt;path d=&quot;M206 118 A118 118 0 0 1 268 58&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-family=&quot;var(--sans)&quot; font-size=&quot;14&quot; fill=&quot;var(--ink)&quot; text-anchor=&quot;middle&quot;&gt;
     &lt;rect x=&quot;230&quot; y=&quot;22&quot; width=&quot;180&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;49&quot;&gt;Devaluation (ė &amp;lt; 0)&lt;/text&gt;
     &lt;rect x=&quot;420&quot; y=&quot;128&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;153&quot;&gt;Import prices ↑ → P&lt;tspan font-size=&quot;10&quot; dy=&quot;3&quot;&gt;C&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; ↑&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;174&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;W/P&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;C&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; ↓&lt;/tspan&gt;&lt;/text&gt;
     &lt;rect x=&quot;225&quot; y=&quot;264&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;288&quot;&gt;Wage demands ↑&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;307&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;wage resistance, indexation&lt;/text&gt;
     &lt;rect x=&quot;20&quot; y=&quot;128&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;153&quot;&gt;Costs and prices ↑&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;174&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;competitiveness lost&lt;/text&gt;
     &lt;text x=&quot;320&quot; y=&quot;158&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;var(--acc)&quot;&gt;inflation&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;180&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;var(--acc)&quot;&gt;expectations ↑&lt;/text&gt;
    &lt;/g&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Each turn of the spiral leaves inflation higher. If it persists, it becomes embedded in &lt;span class=&quot;t&quot;&gt;inflation expectations&lt;/span&gt; (the inflation expectations of workers and firms).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;The model: prices, wages and expectations&lt;/h3&gt;
   &lt;div class=&quot;formula&quot;&gt;
    &lt;i&gt;ẇ&lt;/i&gt; = &lt;i&gt;a&lt;/i&gt; − &lt;i&gt;b u&lt;/i&gt; + &lt;i&gt;ṗ&lt;/i&gt;&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;expectation-augmented Phillips curve&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;formula&quot;&gt;
    &lt;i&gt;ṗ&lt;/i&gt; = &lt;i&gt;ẇ&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;&lt;span class=&quot;note&quot;&gt;price determination&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;formula&quot; style=&quot;border-top:0&quot;&gt;
    &lt;i&gt;ṗ&lt;/i&gt; = (&lt;i&gt;a&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;) − &lt;i&gt;b u&lt;/i&gt; + &lt;i&gt;ṗ&lt;/i&gt;&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;substituting the first into the second&lt;/span&gt;
   &lt;/div&gt;
   &lt;dl class=&quot;legenda&quot;&gt;&lt;dt&gt;a&lt;/dt&gt;&lt;dd&gt;autonomous component of wage demands (bargaining power, institutions)&lt;/dd&gt;&lt;dt&gt;b u&lt;/dt&gt;&lt;dd&gt;effect of unemployment u: more unemployed, less wage pressure&lt;/dd&gt;&lt;dt&gt;ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;/dt&gt;&lt;dd&gt;expected inflation: workers demand compensation for the prices they expect&lt;/dd&gt;&lt;dt&gt;q̇, Δm&lt;/dt&gt;&lt;dd&gt;productivity growth and change in the mark-up&lt;/dd&gt;&lt;/dl&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;ph&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Wage-price spiral simulator&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Teaching assumption (not in the slides): &lt;i&gt;adaptive&lt;/i&gt; expectations. In each “round”, workers expect the inflation just observed. Lower u or raise Δm and press “Next round” several times.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phA&quot;&gt;a&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phA&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;phAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phB&quot;&gt;b&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phB&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;output id=&quot;phBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phU&quot;&gt;u unemployment %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phU&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;phUo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phQ&quot;&gt;q̇ productivity %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phQ&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;phQo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phM&quot;&gt;Δm mark-up&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phM&quot; min=&quot;-2&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;phMo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phE&quot;&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; expected %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phE&quot; min=&quot;-5&quot; max=&quot;30&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;phEo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn pri&quot; type=&quot;button&quot; id=&quot;phRun&quot;&gt;Next round: ṗ&lt;sup&gt;e&lt;/sup&gt; ← ṗ&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;phReset&quot;&gt;Reset&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;phW&quot;&gt;&lt;/div&gt;&lt;div id=&quot;phP&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;svg id=&quot;phSpark&quot; viewBox=&quot;0 0 300 120&quot; style=&quot;width:100%;max-width:30rem;height:auto;display:block;margin:.8rem auto 0;color:var(--ink2)&quot; role=&quot;img&quot; aria-label=&quot;Path of inflation across rounds&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;phV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;There is a &lt;b&gt;vicious circle&lt;/b&gt; between price and wage inflation, which can entrench inflation expectations in the economy.&lt;/li&gt;
    &lt;li&gt;Repeated devaluations raise inflation and, in the long run, inflation expectations.&lt;/li&gt;
    &lt;li&gt;In pre-euro Europe devaluation was used frequently: these are &lt;span class=&quot;t&quot;&gt;competitive devaluations&lt;/span&gt; (devaluations aimed at gaining market share at the expense of partners).&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;The final question&lt;/span&gt;&lt;p&gt;Can a monetary policy that claims to target price stability but repeatedly devalues be &lt;b&gt;credible&lt;/b&gt;? This is the second argument against the benefits of independence: &lt;b&gt;credibility&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;What are competitive devaluations? When were they widespread in Europe? Do they work?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Devaluations carried out to gain competitiveness relative to trading partners. They were frequent in pre-euro Europe. In the medium run they are not very effective: wage resistance and indexation erode the advantage, inflation and expectations rise, the central bank loses credibility, and partners may retaliate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In the formula ṗ = (a − q̇ + Δm) − bu + ṗ&lt;sup&gt;e&lt;/sup&gt;, why do expectations matter so much?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because they enter inflation one-for-one: if expectations rise, wage demands rise and hence prices, and the higher inflation confirms the expectations.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot; data-tone=&quot;sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;09&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part IX · slides 43–45&lt;/p&gt;&lt;h2&gt;The case of symmetric shocks&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;When the shock hits everyone in the same way, the single currency stops being a cost and becomes an advantage.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;A &lt;span class=&quot;t&quot;&gt;symmetric shock&lt;/span&gt; hits all countries in the same direction: here demand falls &lt;b&gt;in both France and Germany&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;France&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;sym-F&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;France: demand falls&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germany&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;sym-G&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germany: demand falls in the same way&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs prose&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Shock comparison&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-as&quot; aria-controls=&quot;tp-as&quot; aria-selected=&quot;true&quot;&gt;Asymmetric shocks&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-sy&quot; aria-controls=&quot;tp-sy&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Symmetric shocks&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-as&quot; aria-labelledby=&quot;tb-as&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Monetary union &lt;b&gt;creates costs&lt;/b&gt; compared with monetary independence.&lt;/li&gt;&lt;li&gt;The common central bank &lt;b&gt;cannot easily manage them&lt;/b&gt;: one instrument for two opposite needs.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-sy&quot; aria-labelledby=&quot;tb-sy&quot; hidden&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Monetary union becomes &lt;b&gt;more attractive&lt;/b&gt; than independence.&lt;/li&gt;&lt;li&gt;The common central bank &lt;b&gt;can manage them&lt;/b&gt;: a monetary expansion helps everyone.&lt;/li&gt;&lt;li&gt;Monetary independence, by contrast, can lead to &lt;b&gt;conflicts&lt;/b&gt; and &lt;span class=&quot;t&quot;&gt;beggar-thy-neighbour&lt;/span&gt; policies (a country solves its own problems by means that worsen those of others).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Why beggar-thy-neighbour&lt;/span&gt;&lt;p&gt;With a symmetric shock, if France devalues it shifts demand &lt;i&gt;away from&lt;/i&gt; Germany &lt;i&gt;towards&lt;/i&gt; itself. The exchange rate “solves” one country&#x27;s problem &lt;b&gt;by worsening the other&#x27;s&lt;/b&gt;, which is in turn tempted to devalue: a currency war in which nobody gains competitiveness and everyone imports inflation.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Try to answer before opening.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Why is monetary union preferable with symmetric shocks?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The common monetary policy suits everyone (same problem, same remedy), whereas with separate currencies each country would be tempted by beggar-thy-neighbour devaluations that harm partners and generate conflicts.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s10&quot; data-tone=&quot;acc&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Part X · assessment and slide 46&lt;/p&gt;&lt;h2&gt;Assessment and review questions&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;When does a single currency pay off? It depends on the type of shock and on how well markets adjust.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;tscroll prose&quot;&gt;
   &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Condition&lt;/th&gt;&lt;th&gt;Favours union&lt;/th&gt;&lt;th&gt;Favours independence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Type of shock&lt;/td&gt;&lt;td&gt;&lt;b&gt;symmetric&lt;/b&gt; shocks&lt;/td&gt;&lt;td&gt;&lt;b&gt;asymmetric&lt;/b&gt;, permanent shocks&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Wages and prices&lt;/td&gt;&lt;td&gt;&lt;b&gt;flexible&lt;/b&gt;&lt;/td&gt;&lt;td&gt;rigid (minimum wages, collective bargaining)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Labour mobility&lt;/td&gt;&lt;td&gt;&lt;b&gt;high&lt;/b&gt;&lt;/td&gt;&lt;td&gt;low (social security, language, culture)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Common budget&lt;/td&gt;&lt;td&gt;transfers for &lt;b&gt;transitory&lt;/b&gt; shocks&lt;/td&gt;&lt;td&gt;no budget, little fiscal space&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Exchange-rate effectiveness&lt;/td&gt;&lt;td&gt;low: &lt;b&gt;open&lt;/b&gt; economies, wage resistance, indexation&lt;/td&gt;&lt;td&gt;high: closed economies, moderate wages&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Credibility&lt;/td&gt;&lt;td&gt;history of devaluations and inflation&lt;/td&gt;&lt;td&gt;national central bank already credible&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
   &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot; style=&quot;margin-top:1.4rem&quot;&gt;
   &lt;h3&gt;Review questions (slide 46)&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;The official course questions, with an outline answer.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;How do you measure a country’s competitiveness?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;With the real exchange rate: the ratio of domestic prices to competitors&#x27; prices expressed in the same currency. Within an MU, &lt;span class=&quot;math&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;/P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt; is sufficient; outside an MU the nominal exchange rate also matters. A lower E&lt;sub&gt;R&lt;/sub&gt; means greater competitiveness.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
