&lt;section class=&quot;part&quot; id=&quot;s1&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte I · slide 1–4&lt;/p&gt;&lt;h2&gt;Mundell e la domanda di partenza&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Conviene davvero rinunciare alla propria moneta? Prima di rispondere bisogna capire cosa si perde e cosa si guadagna.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;La lezione parte da una domanda &lt;b&gt;economica&lt;/b&gt;, non politica: &lt;i&gt;quando ha senso&lt;/i&gt; entrare in un’unione monetaria (&lt;span class=&quot;t&quot;&gt;monetary union&lt;/span&gt;, MU: un gruppo di paesi che adotta una moneta unica con una banca centrale comune)? La risposta passa da un confronto &lt;b&gt;costi / benefici&lt;/b&gt;. Questa lezione si concentra soprattutto sui &lt;b&gt;costi&lt;/b&gt;: cosa succede quando un paese non ha più una moneta e un tasso di cambio propri da usare.&lt;/p&gt;
   &lt;h3&gt;Robert Mundell (1932–2021)&lt;/h3&gt;
   &lt;p&gt;Economista canadese, &lt;b&gt;premio Nobel 1999&lt;/b&gt; per i suoi studi pionieristici sulle dinamiche monetarie e sulle &lt;span class=&quot;t&quot;&gt;optimum currency areas&lt;/span&gt; (OCA, “aree valutarie ottimali”). Il suo articolo &lt;i&gt;A Theory of Optimum Currency Areas&lt;/i&gt; (American Economic Review, 1961) è il testo da cui nasce tutta la letteratura sull’euro.&lt;/p&gt;
   &lt;blockquote&gt;&lt;p&gt;«…supposing that the Common Market countries proceed with their plans for economic union, should these countries allow each national currency to fluctuate, or would a single currency area be preferable?»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;Se i paesi del Mercato comune vanno avanti con l’unione economica, devono lasciar fluttuare le loro monete o è meglio un’area a moneta unica?&lt;/span&gt;&lt;cite&gt;Mundell, AER 1961&lt;/cite&gt;&lt;/blockquote&gt;
   &lt;p&gt;Nel 1961 la Comunità economica europea esisteva da appena quattro anni: la domanda di Mundell anticipa di quasi quarant’anni la nascita dell’euro (1999).&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Currency area&lt;/span&gt;&lt;/b&gt; (area valutaria): un territorio all’interno del quale i tassi di cambio sono &lt;b&gt;fissi&lt;/b&gt;. Una moneta unica è il caso estremo: il cambio è fisso “per sempre” perché non esiste più.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Optimum currency area&lt;/b&gt;: l’area valutaria di estensione “giusta”, cioè quella in cui i benefici della moneta comune superano i costi di non poter più aggiustare il cambio.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;La domanda chiave diventa quindi: &lt;b&gt;qual è il dominio appropriato di un’area valutaria?&lt;/b&gt; Non è detto che coincida con i confini nazionali: potrebbe essere più ampio (più paesi insieme) o più piccolo (regioni diverse dello stesso paese).&lt;/p&gt;
   &lt;blockquote&gt;&lt;p&gt;«It might seem at first that the question is purely academic… [But] certain parts of the world are undergoing processes of economic integration and disintegration, new experiments are being made, and a conception of what constitutes an optimum currency area can clarify the meaning of these experiments.»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;Sembra una domanda accademica, perché è difficile immaginare di abbandonare le monete nazionali. Ma il mondo sta vivendo processi di integrazione e disintegrazione: capire cos’è un’area valutaria ottimale aiuta a leggere questi esperimenti.&lt;/span&gt;&lt;/blockquote&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Benefici (intuizione)&lt;/span&gt;&lt;h4&gt;Perché unirsi&lt;/h4&gt;&lt;p&gt;Meno costi di transazione e di cambio, nessuna incertezza sul cambio tra i membri, prezzi più confrontabili, più commercio e integrazione. &lt;small&gt;La lezione li dà per acquisiti e li riprende solo nel bilancio finale.&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Costi (focus della lezione)&lt;/span&gt;&lt;h4&gt;Cosa si perde&lt;/h4&gt;&lt;p&gt;La possibilità di usare &lt;b&gt;tasso d’interesse e tasso di cambio nazionali&lt;/b&gt; per reagire a uno shock che colpisce solo il proprio paese.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Come definisce Mundell una currency area?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Un dominio all’interno del quale i tassi di cambio sono fissi. La moneta unica ne è il caso limite.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché, secondo Mundell, la domanda “qual è l’area valutaria ottimale” non è solo accademica?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché alcune parti del mondo stanno attraversando processi di integrazione e disintegrazione economica: il concetto di OCA aiuta a capire il senso di questi “esperimenti” (come, decenni dopo, l’euro).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Su quale lato del confronto costi/benefici si concentra questa lezione?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Sui costi: la perdita della politica monetaria e del cambio come strumenti di aggiustamento di fronte a shock asimmetrici.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s2&quot; data-tone=&quot;brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte II · slide 5–7&lt;/p&gt;&lt;h2&gt;L’esperimento: uno shock asimmetrico&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Due paesi, una domanda che si sposta dall’uno all’altro. È il caso in cui avere una moneta propria serve di più.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;L’analisi segue Mundell (1961). Due paesi: &lt;b&gt;Francia (B)&lt;/b&gt; e &lt;b&gt;Germania (A)&lt;/b&gt;. Arriva uno &lt;span class=&quot;t&quot;&gt;asymmetric shock&lt;/span&gt; (shock asimmetrico: colpisce i paesi in modo diverso, qui in direzioni opposte) e &lt;b&gt;permanente&lt;/b&gt; della domanda: i consumatori spostano la spesa dai prodotti francesi a quelli tedeschi.&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;la domanda aggregata &lt;b&gt;cala in Francia&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;la domanda aggregata &lt;b&gt;cresce in Germania&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
   &lt;p&gt;Lo shock verrà studiato in &lt;b&gt;due regimi&lt;/b&gt;: (1) i due paesi formano un’unione monetaria; (2) i due paesi sono indipendenti, con moneta e banca centrale proprie.&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Strumento&lt;/span&gt;&lt;p&gt;Il modello è il classico &lt;b&gt;AD-AS&lt;/b&gt;: sull’asse verticale il livello dei prezzi P, sull’orizzontale la produzione (reddito) Y. La domanda aggregata D è inclinata negativamente, l’offerta aggregata S positivamente. Uno shock di domanda &lt;i&gt;sposta&lt;/i&gt; la curva D; un cambiamento dei salari nominali sposta la curva S, perché cambia i costi delle imprese.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Prova: regola l’intensità dello shock&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Gli indici partono da 100 nell’equilibrio iniziale. La linea tratteggiata è la nuova domanda.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shockRange&quot;&gt;Intensità dello shock&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shockRange&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;shockOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Francia (paese B)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chF2&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Grafico AD-AS Francia: la domanda si sposta a sinistra&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germania (paese A)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chG2&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Grafico AD-AS Germania: la domanda si sposta a destra&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i&gt;&lt;/i&gt;curve attuali&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;dopo lo shock&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;ghost&quot;&gt;&lt;/i&gt;prima dello shock&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;shockF&quot;&gt;&lt;/div&gt;&lt;div id=&quot;shockG&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Cosa succede nei due paesi&lt;/h3&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Germania · A&lt;/span&gt;&lt;h4&gt;Reddito ↑ e inflazione&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Pressione inflazionistica.&lt;/b&gt; Il reddito sale: aumentano le entrate fiscali e calano le spese (per esempio meno sussidi di disoccupazione) → &lt;b&gt;budget surplus&lt;/b&gt; (avanzo di bilancio pubblico).&lt;/p&gt;&lt;p&gt;Conto con l’estero: più esportazioni verso la Francia → probabile &lt;b&gt;CA surplus&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Francia · B&lt;/span&gt;&lt;h4&gt;Reddito ↓ e disoccupazione&lt;/h4&gt;&lt;p&gt;Il reddito cala, la disoccupazione sale: meno entrate, più spese sociali → &lt;b&gt;budget deficit&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Probabile &lt;b&gt;CA deficit&lt;/b&gt;. Insieme formano i &lt;span class=&quot;t&quot;&gt;twin deficits&lt;/span&gt; (“deficit gemelli”: bilancio pubblico e conto corrente in rosso insieme).&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Glossario&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Current account&lt;/span&gt; (CA)&lt;/b&gt;: il saldo delle partite correnti della bilancia dei pagamenti, cioè soprattutto esportazioni meno importazioni di beni e servizi (più redditi e trasferimenti dall’estero).&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Balance of payments&lt;/span&gt;&lt;/b&gt;: il registro di tutte le transazioni di un paese con il resto del mondo. Lo shock, cambiando i redditi, si riflette quindi anche su finanza pubblica e conti con l’estero.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Cosa rende “asimmetrico” lo shock dell’esempio?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Colpisce i due paesi in modo opposto: la domanda cala in Francia e cresce in Germania. Un unico strumento comune non può quindi correggerli entrambi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché lo shock fa nascere un deficit pubblico in Francia?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Con il reddito più basso calano le entrate fiscali e aumentano le spese automatiche, come i sussidi di disoccupazione. In Germania succede il contrario: surplus.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Cosa sono i twin deficits?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Deficit di bilancio pubblico e deficit di conto corrente presenti insieme, come nel paese colpito dallo shock negativo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte III · slide 8–12 · regime 1&lt;/p&gt;&lt;h2&gt;In unione: una sola banca centrale, due problemi opposti&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;La politica monetaria comune non può curare insieme la disoccupazione francese e l’inflazione tedesca. E la politica fiscale ha i suoi limiti.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Politica monetaria: espansiva o restrittiva?&lt;/h3&gt;
   &lt;p&gt;In unione monetaria c’è &lt;b&gt;un solo tasso d’interesse&lt;/b&gt;, deciso dalla banca centrale comune (CB). Qualunque scelta aiuta un paese e danneggia l’altro:&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;espansiva&lt;/b&gt;: aggrava l’&lt;b&gt;inflazione&lt;/b&gt; in A ma riporta la &lt;b&gt;piena occupazione&lt;/b&gt; in B;&lt;/li&gt;&lt;li&gt;&lt;b&gt;restrittiva&lt;/b&gt;: frena l’inflazione in A ma aggrava la &lt;b&gt;disoccupazione&lt;/b&gt; in B.&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Sei la banca centrale comune&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Muovi il cursore: la politica monetaria comune sposta la domanda di entrambi i paesi nella stessa direzione. Le linee chiare indicano la domanda prima e dopo lo shock.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cbRange&quot;&gt;Restrittiva ← → Espansiva&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cbRange&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;cbOut&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Francia (B)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chF3&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Francia sotto la politica monetaria comune&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germania (A)&lt;/b&gt;&lt;svg class=&quot;adas&quot; id=&quot;chG3&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germania sotto la politica monetaria comune&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;cbF&quot;&gt;&lt;/div&gt;&lt;div id=&quot;cbG&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;cbVerdict&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;blockquote&gt;&lt;p&gt;«…the principal way in which the monetary policy is effective in correcting full employment in the deficit region is by raising prices in the surplus region. Full employment thus imparts an inflationary bias to the multiregional economy…»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;Il modo principale in cui la politica monetaria ripristina l’occupazione nella regione in deficit è far salire i prezzi in quella in surplus. Puntare alla piena occupazione dà quindi all’area valutaria una distorsione verso l’inflazione (&lt;span class=&quot;t&quot;&gt;inflationary bias&lt;/span&gt;).&lt;/span&gt;&lt;cite&gt;Mundell 1961&lt;/cite&gt;&lt;/blockquote&gt;
   &lt;blockquote&gt;&lt;p&gt;«…in a currency area comprising many regions and a single currency, the pace of inflation is set by the willingness of central authorities to allow unemployment in deficit regions.»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;In un’area con molte regioni e una sola moneta, il ritmo dell’inflazione dipende da quanta disoccupazione le autorità centrali sono disposte a tollerare nelle regioni in deficit.&lt;/span&gt;&lt;/blockquote&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Il nodo&lt;/span&gt;&lt;p&gt;Quanto è disposta la CB ad accettare disoccupazione nei paesi in deficit, invece di inflazione nei paesi in surplus? Dipende dalle sue &lt;b&gt;preferenze&lt;/b&gt; (teoria, prossime lezioni) e dall’obiettivo che il &lt;b&gt;TFUE&lt;/b&gt; assegna alla BCE: la stabilità dei prezzi.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;Se la CB &lt;b&gt;sta ferma&lt;/b&gt;, la Francia non può stimolare la domanda con la politica monetaria e la Germania non può frenarla: &lt;b&gt;la politica monetaria non ripristina l’equilibrio.&lt;/b&gt;&lt;/p&gt;

   &lt;h3&gt;Politica fiscale: non ideale se gli shock sono permanenti&lt;/h3&gt;
   &lt;p&gt;Distinzione chiave: uno shock &lt;span class=&quot;t&quot;&gt;transitory&lt;/span&gt; (transitorio, destinato a rientrare) e uno &lt;span class=&quot;t&quot;&gt;permanent&lt;/span&gt; (permanente, cambia stabilmente la domanda) richiedono risposte diverse.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs prose&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Tipi di bilancio&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-c&quot; aria-controls=&quot;tp-c&quot; aria-selected=&quot;true&quot;&gt;1 · Bilancio centralizzato&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-n&quot; aria-controls=&quot;tp-n&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;2 · Bilancio non centralizzato&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-c&quot; aria-labelledby=&quot;tb-c&quot;&gt;
    &lt;p&gt;Se l’Unione ha un bilancio comune consistente, può spostare reddito da un paese all’altro: &lt;span class=&quot;t&quot;&gt;inter-regional transfers&lt;/span&gt; (trasferimenti tra regioni), dalla Germania in surplus alla Francia in deficit.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Shock transitorio&lt;/span&gt;&lt;p&gt;I trasferimenti possono essere una &lt;b&gt;buona soluzione&lt;/b&gt;: coprono il periodo difficile e poi si fermano. (Gli shock UE sono soprattutto transitori o permanenti? Lo vedremo nelle prossime lezioni.)&lt;/p&gt;&lt;/div&gt;
     &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Shock permanente&lt;/span&gt;&lt;p&gt;I trasferimenti diventerebbero permanenti → &lt;span class=&quot;t&quot;&gt;moral hazard&lt;/span&gt; (azzardo morale: chi riceve l’aiuto non ha più incentivo ad aggiustarsi, comportamento opportunistico), con conseguenze serie. &lt;b&gt;Non andrebbero usati.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-n&quot; aria-labelledby=&quot;tb-n&quot; hidden&gt;
    &lt;p&gt;Senza un bilancio comune si possono usare gli &lt;span class=&quot;t&quot;&gt;automatic stabilisers&lt;/span&gt; nazionali (stabilizzatori automatici: imposte e spese che si muovono da sole con il ciclo, come le minori entrate e i maggiori sussidi in recessione). Però:&lt;/p&gt;
    &lt;ul class=&quot;clean&quot;&gt;
     &lt;li&gt;hanno senso &lt;b&gt;solo per shock transitori&lt;/b&gt;;&lt;/li&gt;
     &lt;li&gt;anche allora lo spazio di manovra può essere &lt;b&gt;troppo ridotto&lt;/b&gt; per le regole fiscali, soprattutto se debito o deficit sono già alti;&lt;/li&gt;
     &lt;li&gt;può essere difficile &lt;b&gt;finanziarsi sul mercato&lt;/b&gt;: a volte gli stabilizzatori non funzionano affatto o vengono “spenti” (vedi più avanti: il ruolo degli investitori finanziari);&lt;/li&gt;
     &lt;li&gt;con shock permanenti la politica fiscale può far &lt;b&gt;crescere il debito pubblico&lt;/b&gt;;&lt;/li&gt;
     &lt;li&gt;il debito pubblico implica &lt;span class=&quot;t&quot;&gt;inter-generational transfers&lt;/span&gt;: il costo passa alle generazioni future.&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Prima conclusione&lt;/span&gt;&lt;p&gt;In un’unione monetaria la politica monetaria e/o fiscale &lt;b&gt;può non essere efficace&lt;/b&gt; contro uno shock asimmetrico e permanente. Servono meccanismi di aggiustamento &lt;b&gt;alternativi&lt;/b&gt;, che riportino le economie in equilibrio da sole.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Cosa intende Mundell con “inflationary bias”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Se la banca centrale comune vuole la piena occupazione nella regione in deficit, deve espandere, e così fa salire i prezzi nella regione in surplus. Un’area a moneta unica che punta alla piena occupazione tende quindi a un’inflazione più alta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Con un bilancio centralizzato, ha senso gestire con la politica fiscale uno shock asimmetrico permanente? Perché?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. I trasferimenti diventerebbero permanenti e creerebbero moral hazard: il paese aiutato non ha più incentivi ad aggiustarsi. I trasferimenti interregionali vanno bene per shock transitori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché gli stabilizzatori automatici nazionali possono non bastare anche con shock transitori?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Le regole fiscali limitano lo spazio di manovra, specialmente con debito o deficit già alti, e il mercato potrebbe non finanziare il governo: in quel caso gli stabilizzatori vengono di fatto spenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; data-tone=&quot;sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte IV · slide 13–22&lt;/p&gt;&lt;h2&gt;Meccanismi alternativi: salari flessibili e mobilità del lavoro&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Se moneta e fisco non bastano, possono aggiustarsi da soli i mercati? Mundell indica due strade.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;1 · Flessibilità dei salari&lt;/h3&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Dove la disoccupazione U è &lt;b&gt;salita&lt;/b&gt; (Francia), i salari W &lt;b&gt;scendono&lt;/b&gt; → la curva di offerta francese si sposta &lt;b&gt;in basso&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Dove U è &lt;b&gt;scesa&lt;/b&gt; (Germania), W &lt;b&gt;sale&lt;/b&gt; → la curva di offerta tedesca si sposta &lt;b&gt;in alto&lt;/b&gt;.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;p&gt;La flessibilità dei salari diventa flessibilità dei prezzi attraverso la regola di formazione dei prezzi:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt; = &lt;i&gt;ẇ&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;&lt;span class=&quot;note&quot;&gt;il punto sopra la lettera indica un tasso di crescita (in %)&lt;/span&gt;&lt;/div&gt;
   &lt;dl class=&quot;legenda&quot;&gt;&lt;dt&gt;ṗ&lt;/dt&gt;&lt;dd&gt;inflazione dei prezzi&lt;/dd&gt;&lt;dt&gt;ẇ&lt;/dt&gt;&lt;dd&gt;crescita dei salari nominali&lt;/dd&gt;&lt;dt&gt;q̇&lt;/dt&gt;&lt;dd&gt;crescita della produttività del lavoro: compensa i salari, perché lo stesso lavoratore produce di più&lt;/dd&gt;&lt;dt&gt;Δm&lt;/dt&gt;&lt;dd&gt;variazione del &lt;span class=&quot;t&quot;&gt;mark-up&lt;/span&gt; (ricarico delle imprese sui costi)&lt;/dd&gt;&lt;/dl&gt;
   &lt;p&gt;A parità di altre condizioni (&lt;i&gt;ceteris paribus&lt;/i&gt;) salari più bassi significano prezzi più bassi: è lo spostamento della curva S.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;wage&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;L’aggiustamento via salari, passo per passo&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Usa le frecce o i pallini.&lt;/p&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Francia&lt;/b&gt;&lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Francia: aggiustamento salariale&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germania&lt;/b&gt;&lt;svg class=&quot;adas st-g&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germania: aggiustamento salariale&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h4&gt;Effetti di secondo ordine del taglio dei salari in Francia&lt;/h4&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Domanda interna ↓&lt;/span&gt;&lt;p&gt;Il &lt;b&gt;salario reale&lt;/b&gt; W/P cala, perché W scende più dei prezzi al consumo P. Consumi e domanda interna francesi si riducono.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Competitività ↑&lt;/span&gt;&lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;real exchange rate&lt;/span&gt; (tasso di cambio reale: rapporto tra i livelli dei prezzi, misura di competitività) &lt;span class=&quot;math&quot;&gt;E&lt;sup&gt;R&lt;/sup&gt;&lt;sub&gt;F&lt;/sub&gt; = P&lt;sub&gt;F&lt;/sub&gt; / P&lt;sub&gt;G&lt;/sub&gt;&lt;/span&gt; scende: i beni francesi costano relativamente meno. Simmetricamente la Germania perde competitività.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;p&gt;&lt;b&gt;Entrambi i paesi “contribuiscono”&lt;/b&gt; al cambiamento della competitività relativa: per ristabilire l’equilibrio i prezzi devono &lt;b&gt;scendere in Francia e salire in Germania&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ma…&lt;/span&gt;&lt;p&gt;Salari e prezzi sono abbastanza flessibili, e li si lascia aggiustare? I salari possono essere &lt;b&gt;rigidi verso il basso&lt;/b&gt; in B (per esempio per i salari minimi), oppure la CB può temere la pressione inflazionistica in A e impedire ai prezzi tedeschi di salire.&lt;/p&gt;&lt;/div&gt;
   &lt;blockquote&gt;&lt;p&gt;«…if A tightens credit restrictions to prevent prices from rising, all the burden of adjustment is thrust onto country B; what is needed is a reduction in B’s real income… and it must be accomplished by a decline in B’s output and employment. The policy of surplus countries in restraining prices therefore imparts a recessive tendency…»&lt;/p&gt;&lt;span class=&quot;it&quot;&gt;Se A stringe il credito per non far salire i prezzi, tutto il peso dell’aggiustamento ricade su B, il cui reddito reale deve scendere attraverso meno produzione e occupazione. La politica dei paesi in surplus che frenano i prezzi dà all’area una tendenza recessiva.&lt;/span&gt;&lt;cite&gt;Mundell 1961&lt;/cite&gt;&lt;/blockquote&gt;

   &lt;h3&gt;2 · Mobilità del lavoro&lt;/h3&gt;
   &lt;p&gt;Se i disoccupati francesi si trasferiscono in Germania, la disoccupazione scende in Francia e la pressione sui salari cala in Germania: &lt;b&gt;i salari non devono cambiare&lt;/b&gt;. Ma la mobilità del lavoro funziona in Europa?&lt;/p&gt;
   &lt;ol class=&quot;tl&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;1957&lt;/span&gt;&lt;b&gt;Meade&lt;/b&gt;: in Europa occidentale non ci sono le condizioni per una moneta comune, soprattutto per la scarsa mobilità del lavoro.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;1992&lt;/span&gt;&lt;b&gt;Panel al MIT&lt;/b&gt; (Blanchard, Dornbusch, Fischer, Krugman): una moneta comune europea avrebbe «unfavourable economic repercussions». Blanchard: «currency unification works in the US because labour can move between states. The labour mobility in Europe is negligible».&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;2013&lt;/span&gt;&lt;b&gt;Dao et al.&lt;/b&gt; (VoxEU): l’Europa ha rafforzato l’aggiustamento via mobilità, soprattutto nella recessione 2008-09, ma non abbastanza.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;yr&quot;&gt;2019&lt;/span&gt;&lt;b&gt;Basso et al.&lt;/b&gt; (VoxEU): l’elasticità dell’offerta di lavoro agli shock economici, cioè quanto i lavoratori si spostano quando cambiano le condizioni, è ancora più bassa nell’area euro che negli USA.&lt;/li&gt;
   &lt;/ol&gt;
   &lt;p&gt;Perché ci si muove poco? Mobilità &lt;b&gt;molto bassa soprattutto per i lavoratori poco qualificati&lt;/b&gt;. Ragione principale: i &lt;b&gt;sistemi di sicurezza sociale&lt;/b&gt;, nazionali e poco “portabili”. Altre ragioni: &lt;b&gt;differenze culturali e lingua&lt;/b&gt;.&lt;/p&gt;
   &lt;h4&gt;I fatti: EU 2024 Annual Report on intra-EU labour mobility&lt;/h4&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;~10 mln&lt;/div&gt;&lt;p&gt;cittadini UE in età lavorativa che vivono in un altro paese UE/EFTA: numero &lt;b&gt;stabile&lt;/b&gt; nel tempo.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;~20 mln&lt;/div&gt;&lt;p&gt;cittadini di paesi terzi, in crescita del 7% medio annuo dal 2019 (anche per l’invasione russa dell’Ucraina).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;26 · 11 · 10%&lt;/div&gt;&lt;p&gt;quote dei &lt;span class=&quot;t&quot;&gt;movers&lt;/span&gt; (lavoratori che si spostano in un altro paese UE): rumeni, polacchi, italiani.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;3,2 mln&lt;/div&gt;&lt;p&gt;movers UE in &lt;b&gt;Germania&lt;/b&gt;, prima destinazione; poi Spagna, Svizzera e Italia (oltre 1 mln ciascuna).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;stat&quot;&gt;41% · 32%&lt;/div&gt;&lt;p&gt;dei movers in età lavorativa hanno 35-49 anni (vs 34% dei nazionali) e il 32% 20-34 anni: &lt;b&gt;relativamente giovani&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Composizione dei flussi in entrata nei paesi UE ed EFTA, 2022&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Ricostruzione della Figure 6 del Report 2024. I valori sono letti a occhio dal grafico delle slide: usali per le proporzioni, non come dati esatti. In evidenza la media EU-27, Italia, Germania e Francia.&lt;/p&gt;
   &lt;div class=&quot;bkey&quot;&gt;&lt;span&gt;&lt;i class=&quot;b1&quot;&gt;&lt;/i&gt;EU movers&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;b2&quot;&gt;&lt;/i&gt;Nationals (cittadini che rientrano)&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;b3&quot;&gt;&lt;/i&gt;Third-country nationals&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Ordina per&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;a&quot;&gt;Ordina per EU movers&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;b&quot;&gt;per nationals&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sort=&quot;c&quot;&gt;per third-country&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;bars&quot; id=&quot;mobBars&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;small&quot;&gt;Lettura: nella media UE solo circa 1 ingresso su 6 è un cittadino di un altro paese UE. La maggior parte dei nuovi arrivi viene da paesi terzi: la mobilità &lt;i&gt;interna&lt;/i&gt; resta limitata.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Prima conclusione (slide 22)&lt;/span&gt;&lt;p&gt;Di fronte a uno shock di domanda &lt;b&gt;asimmetrico e permanente&lt;/b&gt;, l’unione monetaria è &lt;b&gt;costosa&lt;/b&gt; se i salari e i prezzi &lt;b&gt;non sono flessibili&lt;/b&gt; e/o il lavoro &lt;b&gt;non è abbastanza mobile&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Se la politica monetaria non risponde e i meccanismi automatici non funzionano, il paese colpito deve trovare da solo la via del ritorno all’equilibrio: spesso è stata l’&lt;span class=&quot;t&quot;&gt;internal devaluation&lt;/span&gt; (parte 7).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono, secondo Mundell, i meccanismi di aggiustamento automatico in una MU?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;La flessibilità di salari e prezzi, che sposta le curve di offerta e cambia la competitività relativa, e la mobilità del lavoro dai paesi in difficoltà a quelli in espansione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Come si misura la competitività di un paese rispetto a un altro?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Con il tasso di cambio reale, il rapporto tra i livelli dei prezzi: &lt;span class=&quot;math&quot;&gt;E&lt;sup&gt;R&lt;/sup&gt;&lt;sub&gt;F&lt;/sub&gt; = P&lt;sub&gt;F&lt;/sub&gt;/P&lt;sub&gt;G&lt;/sub&gt;&lt;/span&gt;. Se scende, la Francia diventa più competitiva. Fuori da una MU si moltiplica anche per il cambio nominale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché la politica antinflazionistica dei paesi in surplus dà una “tendenza recessiva”?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Se A impedisce ai propri prezzi di salire, l’intero cambiamento dei prezzi relativi deve venire dal calo dei prezzi in B, e quindi da meno produzione e occupazione in B.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Qual è la ragione principale della scarsa mobilità del lavoro nella UE?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;I sistemi di sicurezza sociale, a cui si aggiungono differenze culturali e linguistiche. La mobilità è particolarmente bassa tra i lavoratori poco qualificati.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; data-tone=&quot;ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte V · slide 23–27 · regime 2&lt;/p&gt;&lt;h2&gt;Secondo regime: indipendenza monetaria&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;E se Francia e Germania avessero tenuto franco, marco e le proprie banche centrali?&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Con monete e banche centrali nazionali, ogni paese può usare il &lt;b&gt;tasso d’interesse&lt;/b&gt; e/o il &lt;b&gt;tasso di cambio&lt;/b&gt; per reagire. L’obiettivo: ridurre la disoccupazione in Francia e l’inflazione in Germania.&lt;/p&gt;
   &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Francia&lt;/span&gt;&lt;h4&gt;Politica espansiva&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Depreciation&lt;/span&gt; (deprezzamento, in cambi flessibili) o &lt;span class=&quot;t&quot;&gt;devaluation&lt;/span&gt; (svalutazione decisa dall’autorità, in cambi fissi) del franco, oppure &lt;b&gt;riduzione del tasso d’interesse&lt;/b&gt;. I beni francesi costano meno all’estero e la domanda torna a salire.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Germania&lt;/span&gt;&lt;h4&gt;Politica restrittiva&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Appreciation&lt;/span&gt; / &lt;span class=&quot;t&quot;&gt;revaluation&lt;/span&gt; del marco, oppure &lt;b&gt;aumento del tasso d’interesse&lt;/b&gt;. La domanda in eccesso si raffredda.&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Effetti dell’espansione monetaria in Francia e della restrizione in Germania&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;D′ è la domanda dopo lo shock; D″ quella dopo la politica monetaria nazionale, che la riporta al livello iniziale.&lt;/p&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Francia&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;indip-F&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Francia: la svalutazione riporta la domanda a destra&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germania&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;indip-G&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germania: la rivalutazione riporta la domanda a sinistra&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;dopo lo shock&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;adj&quot;&gt;&lt;/i&gt;dopo la politica nazionale&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Dove gli shock sono asimmetrici e i mercati rigidi, &lt;b&gt;stare in un’unione monetaria può costare più che restarne fuori&lt;/b&gt;. Il passo successivo è chiedersi quanto sia davvero efficace la politica del cambio di un paese indipendente di fronte a uno shock &lt;b&gt;permanente&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Nota bene&lt;/span&gt;&lt;p&gt;Il cambio funziona bene solo se lo shock coincide con i &lt;b&gt;confini nazionali&lt;/b&gt;. Se lo shock colpisce un &lt;b&gt;settore produttivo che attraversa i confini&lt;/b&gt;, oppure solo &lt;b&gt;una regione&lt;/b&gt; di un paese, il cambio nazionale è uno strumento troppo grossolano: svalutare aiuta anche chi non ne ha bisogno.&lt;/p&gt;&lt;/div&gt;
   &lt;h3&gt;Tre argomenti che ridimensionano i benefici dell’indipendenza&lt;/h3&gt;
   &lt;p&gt;È la critica all’idea che i paesi indipendenti siano più attrezzati contro gli shock asimmetrici:&lt;/p&gt;
   &lt;div class=&quot;grid3&quot;&gt;
    &lt;a class=&quot;card&quot; href=&quot;#s6&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;span class=&quot;tag&quot;&gt;1 · Efficacia&lt;/span&gt;&lt;h4&gt;Funziona?&lt;/h4&gt;&lt;p&gt;La politica monetaria nazionale, compreso il cambio, è &lt;b&gt;efficace&lt;/b&gt;? → parte 6&lt;/p&gt;&lt;/a&gt;
    &lt;a class=&quot;card&quot; href=&quot;#s8&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;span class=&quot;tag&quot;&gt;2 · Credibilità&lt;/span&gt;&lt;h4&gt;È credibile?&lt;/h4&gt;&lt;p&gt;Una banca centrale che svaluta spesso può essere &lt;b&gt;credibile&lt;/b&gt; sulla stabilità dei prezzi? → parte 8&lt;/p&gt;&lt;/a&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;3 · Probabilità&lt;/span&gt;&lt;h4&gt;Succede davvero?&lt;/h4&gt;&lt;p&gt;Quanto sono &lt;b&gt;probabili&lt;/b&gt; gli shock asimmetrici permanenti? Quanto contano le differenze tra paesi? → prossime lezioni&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Che differenza c’è tra depreciation e devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Entrambe riducono il valore esterno della moneta. Depreciation è il termine per i cambi flessibili (decide il mercato), devaluation per i cambi fissi (decide l’autorità). Lo stesso vale per appreciation e revaluation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali tipi di shock si risolvono bene con la politica del cambio?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Shock asimmetrici che coincidono con i confini nazionali e, come si vedrà, preferibilmente transitori. Con shock settoriali transnazionali o regionali il cambio è poco adatto, e con shock permanenti i suoi effetti si erodono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; data-tone=&quot;ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte VI · slide 28–33&lt;/p&gt;&lt;h2&gt;Quanto funziona davvero la svalutazione?&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Svalutare rende i beni nazionali più economici, ma rende anche più caro ciò che si importa. I lavoratori se ne accorgono.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Ipotesi: uno shock di domanda negativo e &lt;b&gt;permanente&lt;/b&gt;. Il paese indipendente deprezza o svaluta. Gli effetti sono tre:&lt;/p&gt;
   &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;1 · a prezzi dati, competitività ↑ → AD ↑&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;2 · prezzi import ↑ → prezzi ↑&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span&gt;3 · &lt;span class=&quot;t&quot;&gt;second round effects&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;Gli &lt;b&gt;effetti di secondo round&lt;/b&gt; passano dalla &lt;span class=&quot;t&quot;&gt;wage resistance&lt;/span&gt;, la richiesta di aumenti salariali per difendere il &lt;span class=&quot;t&quot;&gt;consumption wage&lt;/span&gt; (salario di consumo), cioè la &lt;span class=&quot;t&quot;&gt;wage purchasing power&lt;/span&gt;: il rapporto tra salario nominale e indice dei prezzi al consumo, &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt;.&lt;/p&gt;
   &lt;h3&gt;L’effetto della svalutazione sul consumption wage&lt;/h3&gt;
   &lt;p&gt;I prezzi al consumo P&lt;sub&gt;C&lt;/sub&gt; sono una &lt;b&gt;media geometrica ponderata&lt;/b&gt; dei prezzi dei beni interni (P&lt;sub&gt;E&lt;/sub&gt;) e di quelli importati (P&lt;sub&gt;M&lt;/sub&gt;):&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sub&gt;C&lt;/sub&gt; = P&lt;sub&gt;E&lt;/sub&gt;&lt;sup&gt;1−s&lt;/sup&gt; · P&lt;sub&gt;M&lt;/sub&gt;&lt;sup&gt;s&lt;/sup&gt; = P&lt;sub&gt;E&lt;/sub&gt;&lt;sup&gt;1−s&lt;/sup&gt; · (P&lt;sub&gt;M$&lt;/sub&gt; / E)&lt;sup&gt;s&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;s = quota delle importazioni nel paniere di consumo&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;Il prezzo in valuta nazionale delle importazioni è il prezzo in dollari P&lt;sub&gt;M$&lt;/sub&gt; diviso per il tasso di cambio E, espresso come valuta estera per unità di valuta nazionale. Prendendo i logaritmi e derivando rispetto al tempo:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;C&lt;/sub&gt; = (1 − s) &lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;E&lt;/sub&gt; + s (&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;M$&lt;/sub&gt; − &lt;i&gt;ė&lt;/i&gt;)&lt;span class=&quot;note&quot;&gt;la svalutazione è un calo di E, quindi ė &amp;lt; 0 e − ė fa salire l’inflazione al consumo&lt;/span&gt;&lt;/div&gt;
   &lt;p&gt;Più è grande &lt;b&gt;s&lt;/b&gt;, più la svalutazione si trasmette ai prezzi al consumo. Nelle &lt;b&gt;piccole economie aperte&lt;/b&gt; s è grande: sono più esposte alla variabilità del cambio.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;cw&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Calcolatore: svalutazione → prezzi al consumo → salario reale&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Il salario nominale W resta fermo. Imposta la quota di import e l’entità della svalutazione.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwS&quot;&gt;Quota import s&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwS&quot; min=&quot;0&quot; max=&quot;0.8&quot; step=&quot;0.05&quot; value=&quot;0.3&quot;&gt;&lt;output id=&quot;cwSo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwDep&quot;&gt;Svalutazione (−ė)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwDep&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cwDepo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwPE&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; prezzi interni&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwPE&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwPEo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cwPM&quot;&gt;ṗ&lt;sub&gt;M$&lt;/sub&gt; import in $&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cwPM&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;cwPMo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;cwPc&quot;&gt;&lt;/div&gt;&lt;div id=&quot;cwW&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;cwV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Paese molto aperto vs relativamente chiuso&lt;/h3&gt;
   &lt;p&gt;In entrambi la svalutazione sposta la domanda a destra, ma la reazione dei salari sposta l’offerta in alto. Nel paese &lt;b&gt;aperto&lt;/b&gt; la spinta sui prezzi è forte, il salto di salari e costi è grande e il guadagno di produzione quasi svanisce. Nel paese &lt;b&gt;chiuso&lt;/b&gt; le due curve si muovono meno.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Paese molto aperto&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;open&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Paese aperto: grandi spostamenti di domanda e offerta, forte aumento dei prezzi&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Paese relativamente chiuso&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;closed&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Paese chiuso: piccoli spostamenti di domanda e offerta&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
   &lt;div class=&quot;keyline&quot;&gt;&lt;span&gt;&lt;i class=&quot;adj&quot;&gt;&lt;/i&gt;domanda dopo la svalutazione&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;sh&quot;&gt;&lt;/i&gt;offerta dopo la reazione dei salari&lt;/span&gt;&lt;/div&gt;
   &lt;p class=&quot;small&quot; style=&quot;text-align:center&quot;&gt;Per i paesi europei l’evidenza mostra che l’erosione del vantaggio competitivo iniziale ottenuto con la svalutazione è &lt;b&gt;molto ampia&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Indicizzazione e un caso storico&lt;/h3&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Quando la svalutazione fa salire i prezzi al consumo, il salario reale &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt; scende (W è inizialmente fisso): i lavoratori perdono potere d’acquisto.&lt;/li&gt;
    &lt;li&gt;Storicamente &lt;b&gt;sindacati e contrattazione salariale&lt;/b&gt; hanno avuto un ruolo importante nel resistere a questa perdita.&lt;/li&gt;
    &lt;li&gt;I &lt;span class=&quot;t&quot;&gt;indexation mechanisms&lt;/span&gt; (meccanismi di indicizzazione, che adeguano automaticamente i salari all’inflazione) possono scattare e creare un &lt;b&gt;circolo vizioso&lt;/b&gt; che porta a più inflazione.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Caso storico · Italia 1992&lt;/span&gt;&lt;p&gt;A &lt;b&gt;luglio 1992&lt;/b&gt; viene abolita la &lt;b&gt;scala mobile&lt;/b&gt;, il meccanismo italiano di indicizzazione automatica dei salari ai prezzi. A &lt;b&gt;settembre 1992&lt;/b&gt; la lira si svaluta, uscendo dagli accordi di cambio europei. Senza indicizzazione automatica la svalutazione non si trasmette in automatico ai salari e la spirale prezzi-salari si ferma prima di partire.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;L’interpretazione del caso va confrontata con quanto detto a lezione: nella slide c’è solo il titolo.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;depr&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Aggiustamento via svalutazione in un paese indipendente&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Ricostruzione della slide 33: quattro passi da F a F″.&lt;/p&gt;
   &lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Svalutazione in un paese indipendente: da F a F primo, poi F, poi F secondo&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Morale&lt;/span&gt;&lt;p&gt;La wage resistance &lt;b&gt;riduce l’efficacia&lt;/b&gt; della politica del cambio. Nel medio periodo svalutare &lt;b&gt;non aumenta la competitività in modo permanente&lt;/b&gt;: aumenta l’inflazione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;“Se il cambio nominale si deprezza, la competitività migliora di sicuro.” Sei d’accordo?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Solo nel breve periodo e a prezzi dati. La svalutazione fa salire i prezzi all’import e quindi P&lt;sub&gt;C&lt;/sub&gt;; i lavoratori chiedono salari più alti (wage resistance, indicizzazione), costi e prezzi salgono e il vantaggio si erode, tanto più quanto più il paese è aperto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Come cambia il consumption wage dopo una svalutazione?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Scende: W è inizialmente fisso mentre P&lt;sub&gt;C&lt;/sub&gt; sale di &lt;span class=&quot;math&quot;&gt;s·(−ė)&lt;/span&gt; in più, per effetto dei prezzi all’import. È questa perdita a innescare la richiesta di aumenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché le piccole economie aperte sono più vulnerabili alla variabilità del cambio?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché hanno una quota di import s alta nel paniere: ogni variazione del cambio si trasmette molto ai prezzi al consumo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; data-tone=&quot;brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;07&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte VII · slide 34–39&lt;/p&gt;&lt;h2&gt;Internal devaluation: svalutare senza cambio&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Dentro un’unione monetaria la competitività si recupera solo muovendo i prezzi relativi, cioè i salari.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Tra paesi membri la competitività è semplicemente il &lt;b&gt;rapporto tra i prezzi&lt;/b&gt; dei beni interni:&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; / P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;span class=&quot;note&quot;&gt;prezzi dei beni prodotti in B rispetto a quelli prodotti in A&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione&lt;/span&gt;&lt;p&gt;&lt;b&gt;&lt;span class=&quot;t&quot;&gt;Internal devaluation&lt;/span&gt;&lt;/b&gt; (svalutazione interna): un paese membro di una MU reagisce a uno shock negativo asimmetrico &lt;b&gt;tagliando i salari&lt;/b&gt; per ridurre i prezzi dei beni interni e recuperare competitività, senza toccare il cambio.&lt;/p&gt;&lt;/div&gt;
   &lt;p&gt;Effetti sul consumption wage &lt;span class=&quot;math&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/span&gt;:&lt;/p&gt;
   &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;il salario nominale W &lt;b&gt;scende&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;P&lt;sub&gt;C&lt;/sub&gt; scende, ma &lt;b&gt;solo attraverso i prezzi interni&lt;/b&gt;: i prezzi delle importazioni non cambiano;&lt;/li&gt;&lt;li&gt;quindi il consumption wage &lt;b&gt;cala&lt;/b&gt; (il taglio di W supera il calo di P&lt;sub&gt;C&lt;/sub&gt;) → probabile &lt;b&gt;wage resistance&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
   &lt;div class=&quot;formula&quot;&gt;&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;C&lt;/sub&gt; = (1 − s) &lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;E&lt;/sub&gt; + s (&lt;i&gt;ṗ&lt;/i&gt;&lt;sub&gt;M$&lt;/sub&gt; − &lt;i&gt;ė&lt;/i&gt;)&lt;span class=&quot;note&quot;&gt;qui ė = 0: P&lt;sub&gt;C&lt;/sub&gt; scende solo per la parte (1 − s) legata ai prezzi interni&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel stepper&quot; data-steps=&quot;intdev&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Aggiustamento via internal devaluation&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Ricostruzione della slide 36: tre passi da F a F″.&lt;/p&gt;
   &lt;svg class=&quot;adas st-f&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Svalutazione interna: da F a F primo, poi F secondo con prezzi più bassi&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;st-cap&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn st-prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;st-dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small st-count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn pri st-next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Due politiche a confronto&lt;/h3&gt;
   &lt;p&gt;Per avere &lt;b&gt;effetti duraturi&lt;/b&gt;, sia la internal devaluation (in MU) sia la svalutazione del cambio (paese indipendente) richiedono che il &lt;b&gt;consumption wage cali&lt;/b&gt; nel paese colpito. Cambia il &lt;i&gt;modo&lt;/i&gt; in cui ci si arriva.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tscroll prose&quot;&gt;
   &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Svalutazione del cambio&lt;/th&gt;&lt;th&gt;Internal devaluation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Dove&lt;/td&gt;&lt;td&gt;paese indipendente&lt;/td&gt;&lt;td&gt;paese membro di una MU&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Come cala W/P&lt;sub&gt;C&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;soprattutto &lt;b&gt;P&lt;sub&gt;C&lt;/sub&gt; sale&lt;/b&gt; (import più cari)&lt;/td&gt;&lt;td&gt;soprattutto &lt;b&gt;W scende&lt;/b&gt; (tagli nominali)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Fattibilità&lt;/td&gt;&lt;td&gt;una decisione della banca centrale o del governo&lt;/td&gt;&lt;td&gt;tagli nominali socialmente e politicamente &lt;b&gt;difficili&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Costi&lt;/td&gt;&lt;td&gt;rischio di inflazione&lt;/td&gt;&lt;td&gt;più &lt;b&gt;deflazionistica&lt;/b&gt;, perdite di produzione maggiori&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Money illusion&lt;/span&gt;&lt;/td&gt;&lt;td&gt;aiuta: un salario nominale fermo con prezzi in salita viene percepito meno come una perdita&lt;/td&gt;&lt;td&gt;&lt;b&gt;non funziona&lt;/b&gt;: un taglio della busta paga si vede subito&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
   &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p class=&quot;small&quot;&gt;&lt;i&gt;Money illusion&lt;/i&gt; (illusione monetaria): la tendenza a ragionare in termini nominali anziché reali. Per questo l’espansione monetaria può rendere il percorso verso il nuovo equilibrio &lt;b&gt;più facile e meno costoso&lt;/b&gt; delle alternative.&lt;/p&gt;
   &lt;h3&gt;Un’altra via: lasciar salire i prezzi dei paesi forti&lt;/h3&gt;
   &lt;p&gt;In linea di principio, &lt;span class=&quot;math&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;/P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt; può scendere anche perché &lt;b&gt;sale P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/b&gt;, cioè lasciando salire i prezzi nei paesi in buona salute: è il punto già letto in Mundell. Storicamente le svalutazioni sono molto più diffuse delle svalutazioni interne, e queste ultime sono più frequenti nei periodi di &lt;b&gt;inflazione alta&lt;/b&gt; o quando l’inflazione dei paesi verso cui si vuole recuperare competitività è più alta (Shambaugh, &lt;i&gt;The Euro’s Three Crises&lt;/i&gt;, 2012).&lt;/p&gt;
   &lt;h3&gt;L’esempio di Shambaugh (2012)&lt;/h3&gt;
   &lt;p&gt;Un terzo dei paesi dell’eurozona (&lt;b&gt;periferia&lt;/b&gt;) deve recuperare competitività con una svalutazione interna del &lt;b&gt;3%&lt;/b&gt; rispetto ai prezzi del resto dell’area (&lt;b&gt;core&lt;/b&gt;): &lt;span class=&quot;math&quot;&gt;ṗ&lt;sub&gt;Periph&lt;/sub&gt; − ṗ&lt;sub&gt;core&lt;/sub&gt; = −0,03&lt;/span&gt;. Quali combinazioni di inflazione lo permettono?&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;sh&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Calcolatore: inflazione media vs differenziale&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Prova le tre combinazioni della slide, poi muovi tu i cursori.&lt;/p&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;1,2.5&quot;&gt;1% / 2,5%&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;0,3&quot;&gt;0% / 3%&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-preset=&quot;1,4&quot;&gt;1% / 4%&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shW&quot;&gt;Peso periferia&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shW&quot; min=&quot;0.1&quot; max=&quot;0.6&quot; step=&quot;0.0333&quot; value=&quot;0.3333&quot;&gt;&lt;output id=&quot;shWo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shPp&quot;&gt;ṗ periferia&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shPp&quot; min=&quot;-2&quot; max=&quot;5&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;shPpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;shPc&quot;&gt;ṗ core&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;shPc&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;2.5&quot;&gt;&lt;output id=&quot;shPco&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;shEz&quot;&gt;&lt;/div&gt;&lt;div id=&quot;shDiff&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;shV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;1% e 2,5%&lt;/b&gt;: inflazione EZ = ⅓·1 + ⅔·2,5 = &lt;b&gt;2%&lt;/b&gt;, l’obiettivo BCE. Ma il differenziale è solo &lt;b&gt;1,5 p.p.&lt;/b&gt;: troppo poco.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;0% e 3%&lt;/b&gt;: differenziale di 3 p.p. con inflazione EZ al 2%, ma la periferia deve avere prezzi fermi.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;1% e 4%&lt;/b&gt;: differenziale di 3 p.p. con inflazione EZ al &lt;b&gt;3%&lt;/b&gt;.&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Lezione&lt;/span&gt;&lt;p&gt;Un’inflazione &lt;b&gt;più alta nell’area monetaria&lt;/b&gt;, almeno nel breve periodo, &lt;b&gt;facilita l’aggiustamento dei prezzi relativi&lt;/b&gt;: la periferia può recuperare competitività senza deflazione.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Caso storico · Grecia&lt;/span&gt;&lt;p&gt;Dopo la crisi del debito del 2010 la Grecia, senza cambio da svalutare, ha seguito una &lt;b&gt;internal devaluation&lt;/b&gt; nell’ambito dei programmi di aggiustamento: tagli a salari e costi per recuperare competitività, al prezzo di una forte caduta di produzione e occupazione. &lt;small&gt;La slide riporta solo il titolo: verifica dati e dettagli sul materiale della lezione.&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Quando i paesi adottano una internal devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quando fanno parte di un’unione monetaria (o hanno un cambio fisso irrinunciabile), subiscono uno shock negativo asimmetrico e la politica monetaria comune e i meccanismi automatici (flessibilità, mobilità) non bastano. Storicamente è più frequente con inflazione alta o quando i paesi partner hanno inflazione più alta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché la internal devaluation costa di più della svalutazione del cambio?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Richiede tagli dei salari nominali: politicamente difficili, senza l’aiuto della money illusion, più deflazionistici e con maggiori perdite di produzione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Nell’esempio di Shambaugh, perché 1% / 2,5% non basta?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Rispetta l’obiettivo del 2% di media, ma dà un differenziale di 1,5 punti invece dei 3 necessari. Per arrivare a 3 servono prezzi fermi in periferia (0% / 3%) o un’inflazione media più alta (1% / 4%, media 3%).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;08&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte VIII · slide 40–42&lt;/p&gt;&lt;h2&gt;Svalutazioni ripetute, aspettative e credibilità&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Se l’effetto della svalutazione è solo temporaneo, si può svalutare di nuovo? Sì, ma ogni volta il prezzo sale.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Di fronte a uno shock permanente, o a una &lt;b&gt;debolezza strutturale&lt;/b&gt;, il paese indipendente potrebbe ripetere la svalutazione ogni volta che l’effetto si esaurisce. Ma dalla formula &lt;span class=&quot;math&quot;&gt;ṗ&lt;sub&gt;C&lt;/sub&gt; = (1−s)ṗ&lt;sub&gt;E&lt;/sub&gt; + s(ṗ&lt;sub&gt;M$&lt;/sub&gt; − ė)&lt;/span&gt; ogni nuova svalutazione fa &lt;b&gt;salire l’inflazione al consumo&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;figure class=&quot;prose&quot;&gt;
   &lt;svg viewBox=&quot;0 0 640 330&quot; style=&quot;width:100%;height:auto&quot; role=&quot;img&quot; aria-labelledby=&quot;loopT&quot;&gt;
    &lt;title id=&quot;loopT&quot;&gt;Circolo vizioso: svalutazione, prezzi, salari, inflazione, nuova svalutazione&lt;/title&gt;
    &lt;defs&gt;&lt;marker id=&quot;mh&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;circle cx=&quot;320&quot; cy=&quot;165&quot; r=&quot;118&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.5&quot;/&gt;
    &lt;g fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#mh)&quot;&gt;
     &lt;path d=&quot;M372 58 A118 118 0 0 1 434 118&quot;/&gt;&lt;path d=&quot;M438 210 A118 118 0 0 1 380 268&quot;/&gt;&lt;path d=&quot;M262 268 A118 118 0 0 1 204 210&quot;/&gt;&lt;path d=&quot;M206 118 A118 118 0 0 1 268 58&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-family=&quot;var(--sans)&quot; font-size=&quot;14&quot; fill=&quot;var(--ink)&quot; text-anchor=&quot;middle&quot;&gt;
     &lt;rect x=&quot;230&quot; y=&quot;22&quot; width=&quot;180&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;49&quot;&gt;Svalutazione (ė &amp;lt; 0)&lt;/text&gt;
     &lt;rect x=&quot;420&quot; y=&quot;128&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;153&quot;&gt;Prezzi import ↑ → P&lt;tspan font-size=&quot;10&quot; dy=&quot;3&quot;&gt;C&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; ↑&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;174&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;W/P&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;C&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; ↓&lt;/tspan&gt;&lt;/text&gt;
     &lt;rect x=&quot;225&quot; y=&quot;264&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;288&quot;&gt;Richieste salariali ↑&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;307&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;wage resistance, indicizzazione&lt;/text&gt;
     &lt;rect x=&quot;20&quot; y=&quot;128&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--tint)&quot; stroke=&quot;var(--tone)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;153&quot;&gt;Costi e prezzi ↑&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;174&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;competitività persa&lt;/text&gt;
     &lt;text x=&quot;320&quot; y=&quot;158&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;var(--acc)&quot;&gt;aspettative&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;180&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;var(--acc)&quot;&gt;d’inflazione ↑&lt;/text&gt;
    &lt;/g&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Ogni giro della spirale lascia un’inflazione più alta. Se dura, entra nelle &lt;span class=&quot;t&quot;&gt;inflation expectations&lt;/span&gt; (le aspettative d’inflazione di lavoratori e imprese).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;h3&gt;Il modello: prezzi, salari e aspettative&lt;/h3&gt;
   &lt;div class=&quot;formula&quot;&gt;
    &lt;i&gt;ẇ&lt;/i&gt; = &lt;i&gt;a&lt;/i&gt; − &lt;i&gt;b u&lt;/i&gt; + &lt;i&gt;ṗ&lt;/i&gt;&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;expectation-augmented Phillips curve: curva di Phillips aumentata con le aspettative&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;formula&quot;&gt;
    &lt;i&gt;ṗ&lt;/i&gt; = &lt;i&gt;ẇ&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;&lt;span class=&quot;note&quot;&gt;price determination: formazione dei prezzi&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;formula&quot; style=&quot;border-top:0&quot;&gt;
    &lt;i&gt;ṗ&lt;/i&gt; = (&lt;i&gt;a&lt;/i&gt; − &lt;i&gt;q̇&lt;/i&gt; + Δ&lt;i&gt;m&lt;/i&gt;) − &lt;i&gt;b u&lt;/i&gt; + &lt;i&gt;ṗ&lt;/i&gt;&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;note&quot;&gt;sostituendo la prima nella seconda&lt;/span&gt;
   &lt;/div&gt;
   &lt;dl class=&quot;legenda&quot;&gt;&lt;dt&gt;a&lt;/dt&gt;&lt;dd&gt;componente autonoma delle richieste salariali (forza contrattuale, istituzioni)&lt;/dd&gt;&lt;dt&gt;b u&lt;/dt&gt;&lt;dd&gt;effetto della disoccupazione u: più disoccupati, meno pressione salariale&lt;/dd&gt;&lt;dt&gt;ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;/dt&gt;&lt;dd&gt;inflazione attesa: i lavoratori chiedono di essere compensati per i prezzi che si aspettano&lt;/dd&gt;&lt;dt&gt;q̇, Δm&lt;/dt&gt;&lt;dd&gt;crescita della produttività e variazione del mark-up&lt;/dd&gt;&lt;/dl&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot; id=&quot;ph&quot;&gt;
   &lt;p class=&quot;ptitle&quot;&gt;Simulatore della spirale prezzi-salari&lt;/p&gt;
   &lt;p class=&quot;phint&quot;&gt;Ipotesi didattica (non nelle slide): aspettative &lt;i&gt;adattive&lt;/i&gt;. A ogni “round” i lavoratori si aspettano l’inflazione appena osservata. Abbassa u o alza Δm e premi più volte “Round successivo”.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phA&quot;&gt;a&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phA&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;phAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phB&quot;&gt;b&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phB&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;output id=&quot;phBo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phU&quot;&gt;u disoccupazione %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phU&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;phUo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phQ&quot;&gt;q̇ produttività %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phQ&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;phQo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phM&quot;&gt;Δm mark-up&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phM&quot; min=&quot;-2&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;phMo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;phE&quot;&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; attesa %&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;phE&quot; min=&quot;-5&quot; max=&quot;30&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;phEo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn pri&quot; type=&quot;button&quot; id=&quot;phRun&quot;&gt;Round successivo: ṗ&lt;sup&gt;e&lt;/sup&gt; ← ṗ&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;phReset&quot;&gt;Azzera&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;readout&quot;&gt;&lt;div id=&quot;phW&quot;&gt;&lt;/div&gt;&lt;div id=&quot;phP&quot;&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;svg id=&quot;phSpark&quot; viewBox=&quot;0 0 300 120&quot; style=&quot;width:100%;max-width:30rem;height:auto;display:block;margin:.8rem auto 0;color:var(--ink2)&quot; role=&quot;img&quot; aria-label=&quot;Andamento dell&#x27;inflazione nei round&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;phV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;C’è un &lt;b&gt;circolo vizioso&lt;/b&gt; tra inflazione dei prezzi e dei salari, che può radicare le aspettative d’inflazione nell’economia.&lt;/li&gt;
    &lt;li&gt;Le svalutazioni ripetute aumentano l’inflazione e, alla lunga, le aspettative d’inflazione.&lt;/li&gt;
    &lt;li&gt;Nell’Europa pre-euro la svalutazione è stata usata spesso: sono le &lt;span class=&quot;t&quot;&gt;competitive devaluations&lt;/span&gt; (svalutazioni competitive, per guadagnare quote di mercato a spese dei partner).&lt;/li&gt;
   &lt;/ul&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;La domanda finale&lt;/span&gt;&lt;p&gt;Può essere &lt;b&gt;credibile&lt;/b&gt; una politica monetaria che dichiara di puntare alla stabilità dei prezzi ma svaluta ripetutamente? È il secondo argomento contro i benefici dell’indipendenza: la &lt;b&gt;credibilità&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Cosa sono le svalutazioni competitive? Quando erano diffuse in Europa? Funzionano?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Svalutazioni fatte per guadagnare competitività rispetto ai partner commerciali. Erano frequenti nell’Europa pre-euro. Nel medio periodo sono poco efficaci: wage resistance e indicizzazione erodono il vantaggio, l’inflazione e le aspettative salgono, la banca centrale perde credibilità, e i partner possono reagire.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Nella formula ṗ = (a − q̇ + Δm) − bu + ṗ&lt;sup&gt;e&lt;/sup&gt;, perché le aspettative contano tanto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché entrano uno a uno nell’inflazione: se le aspettative salgono, salgono i salari richiesti e quindi i prezzi, e l’inflazione più alta conferma le aspettative.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot; data-tone=&quot;sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;09&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte IX · slide 43–45&lt;/p&gt;&lt;h2&gt;Il caso degli shock simmetrici&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Quando lo shock colpisce tutti allo stesso modo, la moneta unica smette di essere un costo e diventa un vantaggio.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;p&gt;Uno &lt;span class=&quot;t&quot;&gt;symmetric shock&lt;/span&gt; (shock simmetrico) colpisce tutti i paesi nella stessa direzione: qui la domanda cala &lt;b&gt;sia in Francia sia in Germania&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;
   &lt;div class=&quot;charts&quot;&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Francia&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;sym-F&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Francia: la domanda cala&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;figure class=&quot;ch&quot;&gt;&lt;b&gt;Germania&lt;/b&gt;&lt;svg class=&quot;adas&quot; data-chart=&quot;sym-G&quot; viewBox=&quot;0 0 340 290&quot; role=&quot;img&quot; aria-label=&quot;Germania: la domanda cala allo stesso modo&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs prose&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Confronto shock&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-as&quot; aria-controls=&quot;tp-as&quot; aria-selected=&quot;true&quot;&gt;Shock asimmetrici&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-sy&quot; aria-controls=&quot;tp-sy&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Shock simmetrici&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-as&quot; aria-labelledby=&quot;tb-as&quot;&gt;
    &lt;div class=&quot;card minus&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;L’unione monetaria &lt;b&gt;crea costi&lt;/b&gt; rispetto all’indipendenza monetaria.&lt;/li&gt;&lt;li&gt;La banca centrale comune &lt;b&gt;non può gestirli facilmente&lt;/b&gt;: un solo strumento per due esigenze opposte.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;tp-sy&quot; aria-labelledby=&quot;tb-sy&quot; hidden&gt;
    &lt;div class=&quot;card plus&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;L’unione monetaria diventa &lt;b&gt;più attraente&lt;/b&gt; dell’indipendenza.&lt;/li&gt;&lt;li&gt;La banca centrale comune &lt;b&gt;può gestirli&lt;/b&gt;: un’espansione monetaria aiuta tutti.&lt;/li&gt;&lt;li&gt;L’indipendenza monetaria può invece portare a &lt;b&gt;conflitti&lt;/b&gt; e a politiche &lt;span class=&quot;t&quot;&gt;beggar-thy-neighbour&lt;/span&gt; (“impoverisci il tuo vicino”: un paese risolve i propri problemi con mezzi che peggiorano quelli degli altri).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;prose&quot;&gt;
   &lt;div class=&quot;callout&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Perché beggar-thy-neighbour&lt;/span&gt;&lt;p&gt;Con uno shock simmetrico, se la Francia svaluta sposta domanda &lt;i&gt;dalla&lt;/i&gt; Germania &lt;i&gt;verso&lt;/i&gt; di sé. Il cambio “risolve” il problema di un paese &lt;b&gt;peggiorando quello dell’altro&lt;/b&gt;, che a sua volta è tentato di svalutare: una guerra valutaria in cui nessuno guadagna competitività e tutti importano inflazione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Prova a rispondere prima di aprire.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;Perché con shock simmetrici l’unione monetaria è preferibile?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;La politica monetaria comune va bene per tutti (stesso problema, stesso rimedio), mentre con monete separate ciascuno sarebbe tentato da svalutazioni beggar-thy-neighbour che danneggiano i partner e generano conflitti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s10&quot; data-tone=&quot;acc&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Parte X · bilancio e slide 46&lt;/p&gt;&lt;h2&gt;Bilancio e domande di ripasso&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Quando conviene la moneta unica? Dipende dal tipo di shock e da quanto si adattano i mercati.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;tscroll prose&quot;&gt;
   &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Condizione&lt;/th&gt;&lt;th&gt;Spinge verso l’unione&lt;/th&gt;&lt;th&gt;Spinge verso l’indipendenza&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Tipo di shock&lt;/td&gt;&lt;td&gt;shock &lt;b&gt;simmetrici&lt;/b&gt;&lt;/td&gt;&lt;td&gt;shock &lt;b&gt;asimmetrici&lt;/b&gt; e permanenti&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Salari e prezzi&lt;/td&gt;&lt;td&gt;&lt;b&gt;flessibili&lt;/b&gt;&lt;/td&gt;&lt;td&gt;rigidi (salari minimi, contrattazione)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Mobilità del lavoro&lt;/td&gt;&lt;td&gt;&lt;b&gt;alta&lt;/b&gt;&lt;/td&gt;&lt;td&gt;bassa (sicurezza sociale, lingua, cultura)&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Bilancio comune&lt;/td&gt;&lt;td&gt;trasferimenti per shock &lt;b&gt;transitori&lt;/b&gt;&lt;/td&gt;&lt;td&gt;nessun bilancio, poco spazio fiscale&lt;/td&gt;&lt;/tr&gt;
