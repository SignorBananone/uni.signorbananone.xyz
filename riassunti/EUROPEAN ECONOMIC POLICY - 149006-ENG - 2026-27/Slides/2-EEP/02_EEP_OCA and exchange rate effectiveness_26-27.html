     &lt;tr&gt;&lt;td&gt;Efficacia del cambio&lt;/td&gt;&lt;td&gt;bassa: economie &lt;b&gt;aperte&lt;/b&gt;, wage resistance, indicizzazione&lt;/td&gt;&lt;td&gt;alta: economie chiuse, salari moderati&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Credibilità&lt;/td&gt;&lt;td&gt;storia di svalutazioni e inflazione&lt;/td&gt;&lt;td&gt;banca centrale nazionale già credibile&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
   &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check prose&quot; style=&quot;margin-top:1.4rem&quot;&gt;
   &lt;h3&gt;Review questions (slide 46)&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Le domande ufficiali del corso, con una traccia di risposta.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;How do you measure a country’s competitiveness?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Con il tasso di cambio reale: il rapporto tra i prezzi interni e quelli dei concorrenti espressi nella stessa valuta. In MU basta &lt;span class=&quot;math&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sup&gt;B&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;/P&lt;sup&gt;A&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt;; fuori da una MU conta anche il cambio nominale. Un E&lt;sub&gt;R&lt;/sub&gt; più basso vuol dire più competitività.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;If the nominal exchange rate depreciates, competitiveness is sure to improve. Do you agree?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No, o solo temporaneamente. I prezzi all’import salgono, P&lt;sub&gt;C&lt;/sub&gt; sale, il consumption wage cala e i lavoratori chiedono aumenti: costi e prezzi interni salgono ed erodono il vantaggio (F → F″). L’erosione è maggiore nelle economie aperte e con indicizzazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the automatic adjustment mechanisms that should work in a MU, according to Mundell?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;La flessibilità di salari e prezzi (W scende dove U sale e cresce dove U scende, spostando le curve di offerta e i prezzi relativi) e la mobilità del lavoro (i disoccupati si spostano dove c’è domanda).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What kind of shocks could be satisfactorily solved by an exchange rate policy?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Shock asimmetrici, specifici di un paese e allineati ai confini nazionali, e soprattutto transitori. Con shock permanenti l’effetto si esaurisce in inflazione; con shock regionali o settoriali transnazionali il cambio nazionale non è mirato; con shock simmetrici diventa beggar-thy-neighbour.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How do you expect consumption real wages to change after a devaluation?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Calano: con W inizialmente fisso, P&lt;sub&gt;C&lt;/sub&gt; sale di circa &lt;span class=&quot;math&quot;&gt;s·(−ė)&lt;/span&gt;. Ne segue la wage resistance.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In the presence of a centralized budget, would it make sense to manage permanent asymmetric shocks with fiscal policy? Why?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No: trasferimenti permanenti tra regioni creano moral hazard e tolgono l’incentivo all’aggiustamento. Hanno senso per shock transitori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are competitive devaluations? When were they widespread in Europe? Do you expect them to be effective?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Svalutazioni per guadagnare competitività sui partner, frequenti nell’Europa pre-euro. Nel medio periodo sono poco efficaci: spirale prezzi-salari, aspettative d’inflazione più alte, perdita di credibilità, e reazioni dei partner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;When do countries adopt so-called internal devaluations?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Quando non possono usare il cambio (membri di una MU), subiscono uno shock negativo asimmetrico e gli altri meccanismi non bastano. Sono più frequenti nei periodi di inflazione alta o quando i partner hanno inflazione più alta, perché serve meno deflazione in termini assoluti. Esempio: la Grecia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; data-tone=&quot;slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;§&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Riferimenti citati nelle slide&lt;/p&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Autori, testi, norme e fonti statistiche nominati a lezione, con cosa contengono e perché contano.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;refs prose&quot;&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Articolo&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Robert Mundell, “A Theory of Optimum Currency Areas”, &lt;i&gt;American Economic Review&lt;/i&gt;, 1961&lt;/h4&gt;&lt;p&gt;Il testo fondativo della teoria OCA: definisce l’area valutaria, introduce lo shock asimmetrico tra due paesi e indica flessibilità e mobilità come meccanismi alternativi al cambio. Da qui vengono tutte le citazioni della lezione.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Premio&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Premio Nobel per l’economia 1999 a Robert Mundell&lt;/h4&gt;&lt;p&gt;Assegnato per l’analisi della politica monetaria e fiscale con diversi regimi di cambio e per le optimum currency areas. Conta perché arriva l’anno di nascita dell’euro.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Autore&lt;/span&gt;&lt;div&gt;&lt;h4&gt;James Meade (1957)&lt;/h4&gt;&lt;p&gt;Sostenne che in Europa occidentale mancavano le condizioni per una moneta comune, soprattutto per la scarsa mobilità del lavoro. È il primo scettico della serie.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Dibattito&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Panel al MIT, 1992: Blanchard, Dornbusch, Fischer, Krugman&lt;/h4&gt;&lt;p&gt;Quattro macroeconomisti di primo piano concordano sulle «unfavourable economic repercussions» di una moneta comune europea; Blanchard contrappone la mobilità del lavoro tra gli stati USA a quella “trascurabile” dell’Europa.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;VoxEU&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Dao et al. (2013)&lt;/h4&gt;&lt;p&gt;Evidenza che l’aggiustamento tramite mobilità del lavoro in Europa si è rafforzato, specie nella recessione 2008-09, ma resta insufficiente.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;VoxEU&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Basso et al. (2019)&lt;/h4&gt;&lt;p&gt;Mostrano che l’elasticità dell’offerta di lavoro agli shock è ancora più bassa nell’area euro che negli Stati Uniti: il canale di Mundell funziona poco.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Rapporto UE&lt;/span&gt;&lt;div&gt;&lt;h4&gt;European Commission, &lt;i&gt;Annual Report on Intra-EU Labour Mobility 2024&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Fonte dei “fatti” della lezione: numero di movers, nazionalità, destinazioni, età e composizione dei flussi (Figure 6). Utile per aggiornare i numeri.&lt;br&gt;&lt;code&gt;employment-social-affairs.ec.europa.eu/annual-report-intra-eu-labour-mobility-2024_en&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Norma&lt;/span&gt;&lt;div&gt;&lt;h4&gt;TFUE: Trattato sul funzionamento dell’Unione europea&lt;/h4&gt;&lt;p&gt;Fissa l’obiettivo della BCE: la stabilità dei prezzi (art. 127). Determina quanta inflazione la banca centrale comune è disposta a tollerare per aiutare i paesi in deficit; se ne parlerà nelle prossime lezioni.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Articolo&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Jay C. Shambaugh, “The Euro’s Three Crises”, &lt;i&gt;Brookings Papers on Economic Activity&lt;/i&gt;, 2012&lt;/h4&gt;&lt;p&gt;Analisi della crisi dell’euro (bancaria, del debito sovrano, di crescita e competitività). Da qui vengono l’esempio numerico sulla internal devaluation e l’osservazione che svalutare all’interno è più facile con inflazione più alta.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Caso&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Italia 1992: abolizione della scala mobile (luglio) e svalutazione della lira (settembre)&lt;/h4&gt;&lt;p&gt;Esempio di come l’assenza di indicizzazione automatica dei salari limiti gli effetti inflazionistici di secondo round di una svalutazione.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;kind&quot;&gt;Caso&lt;/span&gt;&lt;div&gt;&lt;h4&gt;Grecia: internal devaluation&lt;/h4&gt;&lt;p&gt;Il caso più noto di svalutazione interna in eurozona: mostra i costi in termini di produzione e occupazione dell’aggiustamento senza cambio.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

const $=(s,r=document)=&gt;r.querySelector(s),$$=(s,r=document)=&gt;[...r.querySelectorAll(s)];

const X=y=&gt;44+y*26,P=p=&gt;262-p*24;
function seg(k,sh){let a,b;if(k===&#x27;D&#x27;){a=Math.max(.8,10+sh-9.6);b=Math.min(9.6,10+sh-.6);return[a,10+sh-a,b,10+sh-b]}a=Math.max(.8,.6-sh);b=Math.min(9.6,9.6-sh);return[a,a+sh,b,b+sh]}
function eq(d,s){return[(10+d-s)/2,(10+d+s)/2]}
function arrow(x1,y1,x2,y2,c){const a=Math.atan2(y2-y1,x2-x1),h=7;return`&lt;g class=&quot;${c}&quot;&gt;&lt;line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2-3*Math.cos(a)}&quot; y2=&quot;${y2-3*Math.sin(a)}&quot;/&gt;&lt;polygon points=&quot;${x2},${y2} ${x2-h*Math.cos(a-.45)},${y2-h*Math.sin(a-.45)} ${x2-h*Math.cos(a+.45)},${y2-h*Math.sin(a+.45)}&quot;/&gt;&lt;/g&gt;`}
function chart(svg,c){
  if(!svg)return;
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 365 290&#x27;);
  const sb=c.sub||&#x27;&#x27;;
  let s=arrow(44,262,318,262,&#x27;axa&#x27;)+arrow(44,262,44,8,&#x27;axa&#x27;)+`&lt;text x=&quot;52&quot; y=&quot;20&quot;&gt;P&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;${sb}&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;306&quot; y=&quot;282&quot;&gt;Y&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;${sb}&lt;/tspan&gt;&lt;/text&gt;`;
  if(c.guide!=null)s+=`&lt;line class=&quot;guide&quot; x1=&quot;${X(c.guide)}&quot; y1=&quot;262&quot; x2=&quot;${X(c.guide)}&quot; y2=&quot;24&quot;/&gt;&lt;text x=&quot;${X(c.guide)}&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot;&gt;Y*&lt;/text&gt;`;
  (c.lines||[]).forEach(l=&gt;{const[a,pa,b,pb]=seg(l.k,l.sh);s+=`&lt;line class=&quot;ln ${l.c||&#x27;&#x27;}&quot; x1=&quot;${X(a)}&quot; y1=&quot;${P(pa)}&quot; x2=&quot;${X(b)}&quot; y2=&quot;${P(pb)}&quot;/&gt;`;if(l.lab)s+=`&lt;text class=&quot;ll ${l.c||&#x27;&#x27;}&quot; x=&quot;${X(b)+4}&quot; y=&quot;${P(pb)+(l.k===&#x27;D&#x27;?12:-2)}&quot;&gt;${l.lab}&lt;/text&gt;`});
  (c.arr||[]).forEach(r=&gt;s+=arrow(X(r[0]),P(r[1]),X(r[2]),P(r[3]),&#x27;arr &#x27;+(r[4]||&#x27;&#x27;)));

  svg.innerHTML=s;
}

  &#x27;sym-G&#x27;:{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-2,s:0,c:&#x27;sh&#x27;}],arr:[[6.3,3.6,4.5,3.6,&#x27;sh&#x27;]]}

/* parte 2: shock asimmetrico */
function idx(y){return Math.round(y/5*100)}
function drawShock(){
  const r=$(&#x27;#shockRange&#x27;);if(!r)return;const v=+r.value;
  $(&#x27;#shockOut&#x27;).value=v.toFixed(1);
  chart($(&#x27;#chF2&#x27;),{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-v,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-v,s:0,c:&#x27;sh&#x27;,lab:&#x27;B′&#x27;}]});
  chart($(&#x27;#chG2&#x27;),{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,lab:&#x27;D&#x27;,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:v,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:v,s:0,c:&#x27;sh&#x27;,lab:&#x27;A′&#x27;}]});
  const[yf,pf]=eq(-v,0),[yg,pg]=eq(v,0);
  $(&#x27;#shockF&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;Y ${idx(yf)} · P ${idx(pf)}&lt;/span&gt;${v?&#x27;reddito ↓, disoccupazione ↑, deficit di bilancio e probabile CA deficit&#x27;:&#x27;equilibrio iniziale (indice 100)&#x27;}`;
  $(&#x27;#shockG&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;Y ${idx(yg)} · P ${idx(pg)}&lt;/span&gt;${v?&#x27;reddito ↑, pressione inflazionistica, surplus di bilancio e probabile CA surplus&#x27;:&#x27;equilibrio iniziale (indice 100)&#x27;}`;
}
$(&#x27;#shockRange&#x27;)?.addEventListener(&#x27;input&#x27;,drawShock);drawShock();

/* parte 3: banca centrale comune */
function drawCB(){
  const r=$(&#x27;#cbRange&#x27;);if(!r)return;const m=+r.value;
  $(&#x27;#cbOut&#x27;).value=(m&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+m.toFixed(1);
  chart($(&#x27;#chF3&#x27;),{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2+m,lab:&#x27;D&#x27;,c:&#x27;adj&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:-2+m,s:0,c:&#x27;adj&#x27;,lab:&#x27;B&#x27;}],guide:5});
  chart($(&#x27;#chG3&#x27;),{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,lab:&#x27;S&#x27;},{k:&#x27;D&#x27;,sh:0,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:2,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:2+m,lab:&#x27;D&#x27;,c:&#x27;adj&#x27;}],pts:[{d:0,s:0,c:&#x27;ghost&#x27;},{d:2+m,s:0,c:&#x27;adj&#x27;,lab:&#x27;A&#x27;}],guide:5});
  const gf=(-2+m)/2,gg=(2+m)/2;
  $(&#x27;#cbF&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;Y ${idx(5+gf)}&lt;/span&gt;${gf&lt;-.05?&#x27;disoccupazione ancora sopra il livello iniziale&#x27;:gf&gt;.05?&#x27;surriscaldamento anche in Francia&#x27;:&#x27;piena occupazione ripristinata&#x27;}`;
  $(&#x27;#cbG&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;P ${idx(5+gg)}&lt;/span&gt;${gg&gt;.05?&#x27;inflazione sopra il livello iniziale&#x27;:gg&lt;-.05?&#x27;Germania spinta in recessione&#x27;:&#x27;prezzi stabili&#x27;}`;
  let t;
  if(m===0)t=&#x27;La BCE “sta ferma”: nessun paese può usare la moneta per sé. Francia in recessione, Germania sotto pressione inflazionistica.&#x27;;
  else if(m&gt;0)t=m&gt;=2?&#x27;Espansiva quanto basta per la piena occupazione in Francia: ma l’aggiustamento passa dai &lt;b&gt;prezzi più alti in Germania&lt;/b&gt; → &lt;span class=&quot;t&quot;&gt;inflationary bias&lt;/span&gt;.&#x27;:&#x27;Politica espansiva: la Francia recupera un po’, ma l’inflazione tedesca peggiora.&#x27;;
  else t=m&lt;=-2?&#x27;Restrittiva quanto basta per domare i prezzi tedeschi: tutto il peso ricade sulla Francia → &lt;b&gt;tendenza recessiva&lt;/b&gt;.&#x27;:&#x27;Politica restrittiva: meno inflazione in Germania, più disoccupazione in Francia.&#x27;;
  $(&#x27;#cbVerdict&#x27;).innerHTML=t+&#x27; &lt;br&gt;&lt;small&gt;Nessuna posizione del cursore riporta entrambi i paesi all’equilibrio: c’è un solo strumento per due problemi opposti.&lt;/small&gt;&#x27;;
}
$(&#x27;#cbRange&#x27;)?.addEventListener(&#x27;input&#x27;,drawCB);drawCB();

    {cap:&#x27;&lt;b&gt;2 · Salari flessibili.&lt;/b&gt; Dove U è salita, W scende: S&lt;sub&gt;F&lt;/sub&gt; si sposta in basso. Dove U è scesa, W sale: S&lt;sub&gt;G&lt;/sub&gt; si sposta in alto. Via &lt;span class=&quot;math&quot;&gt;ṗ = ẇ − q̇ + Δm&lt;/span&gt;, i salari muovono i prezzi.&#x27;,F:{sub:&#x27;F&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;S&#x27;,sh:-2,lab:&#x27;S′&#x27;,c:&#x27;adj&#x27;}],pts:[{d:-2,s:0,c:&#x27;ghost&#x27;},{d:-2,s:-2,c:&#x27;adj&#x27;,lab:&#x27;2&#x27;}],arr:[[2.4,2.6,2.4,1]],guide:5},G:{sub:&#x27;G&#x27;,lines:[{k:&#x27;S&#x27;,sh:0,c:&#x27;ghost&#x27;},{k:&#x27;D&#x27;,sh:2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;S&#x27;,sh:2,lab:&#x27;S′&#x27;,c:&#x27;adj&#x27;}],pts:[{d:2,s:0,c:&#x27;ghost&#x27;},{d:2,s:2,c:&#x27;adj&#x27;,lab:&#x27;2&#x27;}],arr:[[3.6,3.8,3.6,5.4]],guide:5}},
    {cap:&#x27;&lt;b&gt;Risultato.&lt;/b&gt; La produzione torna a Y* in entrambi i paesi; P&lt;sub&gt;F&lt;/sub&gt; è sceso e P&lt;sub&gt;G&lt;/sub&gt; è salito. Il cambio reale &lt;span class=&quot;math&quot;&gt;E&lt;sup&gt;R&lt;/sup&gt;&lt;sub&gt;F&lt;/sub&gt; = P&lt;sub&gt;F&lt;/sub&gt;/P&lt;sub&gt;G&lt;/sub&gt;&lt;/span&gt; si riduce: la Francia ha guadagnato competitività, e &lt;b&gt;tutti e due&lt;/b&gt; i paesi vi hanno contribuito.&#x27;,F:{sub:&#x27;F&#x27;,lines:[{k:&#x27;D&#x27;,sh:-2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;S&#x27;,sh:-2,lab:&#x27;S′&#x27;,c:&#x27;adj&#x27;}],pts:[{d:-2,s:-2,c:&#x27;adj&#x27;,lab:&#x27;P↓&#x27;}],guide:5},G:{sub:&#x27;G&#x27;,lines:[{k:&#x27;D&#x27;,sh:2,lab:&#x27;D′&#x27;,c:&#x27;sh&#x27;},{k:&#x27;S&#x27;,sh:2,lab:&#x27;S′&#x27;,c:&#x27;adj&#x27;}],pts:[{d:2,s:2,c:&#x27;adj&#x27;,lab:&#x27;P↑&#x27;}],guide:5}}
  ],
  depr:[

/* consumption wage */
function drawCW(){
  const s=$(&#x27;#cwS&#x27;);if(!s)return;
  const S=+s.value,dep=+$(&#x27;#cwDep&#x27;).value,pe=+$(&#x27;#cwPE&#x27;).value,pm=+$(&#x27;#cwPM&#x27;).value;

  $(&#x27;#cwW&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;W/P&lt;sub&gt;C&lt;/sub&gt; ≈ −${pc.toFixed(1)}%&lt;/span&gt;a salario nominale W fermo, il potere d’acquisto cala di circa ṗ&lt;sub&gt;C&lt;/sub&gt;`;
  $(&#x27;#cwV&#x27;).innerHTML=S&gt;=.4?&#x27;Economia molto aperta: gran parte della svalutazione si scarica sui prezzi al consumo. Forte incentivo alla &lt;span class=&quot;t&quot;&gt;wage resistance&lt;/span&gt;, il vantaggio competitivo si erode in fretta.&#x27;:S&lt;=.15?&#x27;Economia relativamente chiusa: i prezzi al consumo si muovono poco, il vantaggio competitivo dura di più.&#x27;:&#x27;Caso intermedio: la quota di import &lt;i&gt;s&lt;/i&gt; decide quanto della svalutazione arriva ai consumatori.&#x27;;
}

/* Phillips: spirale prezzi-salari */
let hist=[];
function phCalc(){const a=+$(&#x27;#phA&#x27;).value,b=+$(&#x27;#phB&#x27;).value,u=+$(&#x27;#phU&#x27;).value,q=+$(&#x27;#phQ&#x27;).value,m=+$(&#x27;#phM&#x27;).value,pe=+$(&#x27;#phE&#x27;).value;

function drawPh(){

  $(&#x27;#phW&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;ẇ = ${r.w.toFixed(1)}%&lt;/span&gt;inflazione salariale (curva di Phillips)`;
  $(&#x27;#phP&#x27;).innerHTML=`&lt;span class=&quot;big&quot;&gt;ṗ = ${r.p.toFixed(1)}%&lt;/span&gt;inflazione dei prezzi`;

  $(&#x27;#phSpark&#x27;).innerHTML=`&lt;line x1=&quot;0&quot; y1=&quot;60&quot; x2=&quot;300&quot; y2=&quot;60&quot; stroke=&quot;currentColor&quot; opacity=&quot;.25&quot;/&gt;`+`&lt;polyline fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.2&quot; points=&quot;${pts.map((v,i)=&gt;`${10+i*(280/Math.max(7,pts.length-1))},${60-v/mx*52}`).join(&#x27; &#x27;)}&quot;/&gt;`+pts.map((v,i)=&gt;`&lt;circle cx=&quot;${10+i*(280/Math.max(7,pts.length-1))}&quot; cy=&quot;${60-v/mx*52}&quot; r=&quot;3&quot; fill=&quot;var(--acc)&quot;/&gt;`).join(&#x27;&#x27;);
  $(&#x27;#phV&#x27;).innerHTML=Math.abs(r.k)&lt;.05?&#x27;Il termine (a − q̇ + Δm) − bu è zero: l’inflazione resta uguale alle aspettative, nessuna spirale.&#x27;:r.k&gt;0?`Ogni round l’inflazione supera le aspettative di ${r.k.toFixed(1)} punti: se le aspettative si adeguano, l’inflazione &lt;b&gt;sale round dopo round&lt;/b&gt; (circolo vizioso).`:`L’inflazione scende sotto le aspettative di ${(-r.k).toFixed(1)} punti per round: disinflazione, ma pagata con disoccupazione alta.`;
}
