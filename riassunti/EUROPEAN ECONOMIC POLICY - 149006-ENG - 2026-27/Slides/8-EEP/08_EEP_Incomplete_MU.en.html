&lt;!-- ============ 1 ============ --&gt;
&lt;section id=&quot;definizione&quot; class=&quot;part sage&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h2&gt;What is an incomplete monetary union?&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slides 1–2, 22&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;An &lt;em class=&quot;t&quot;&gt;incomplete monetary union&lt;/em&gt; is an arrangement in which several countries tie their currencies together — or adopt a single one — &lt;b&gt;without&lt;/b&gt; pooling all the instruments that make a currency sound: a common budget, a central bank acting as ultimate guarantor, or the permanent renunciation of the option to change the exchange rate. The definition in the slides covers two types that are &lt;i&gt;very different but have similar problems&lt;/i&gt;.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Type 1 · MU without fiscal union&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Type 2 · Fixed exchange rates&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary Union without fiscal union.&lt;/b&gt; There is a single currency and a single central bank, but fiscal policy (taxes, spending, public debt) remains national: there is no &lt;em class=&quot;t&quot;&gt;fiscal union&lt;/em&gt;, i.e. no federal budget able to transfer resources across regions and to issue common debt.&lt;/div&gt;
      &lt;p&gt;According to the slides, &lt;b&gt;perhaps the only example is EMU&lt;/b&gt; (&lt;i&gt;Economic and Monetary Union&lt;/i&gt;, i.e. the Eurozone). Each state issues debt in euros, a currency it &lt;i&gt;does not control&lt;/i&gt;: this is precisely the point of the &quot;parallel&quot; with which the lecture closes (section 6).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Exchange rate arrangements.&lt;/b&gt; Agreements through which the authorities &lt;i&gt;fix&lt;/i&gt; the exchange rate of their currency against another currency (or a basket), committing themselves to defend it.&lt;/div&gt;
      &lt;p&gt;Historical examples from the slides: &lt;b&gt;Bretton Woods&lt;/b&gt;, the &lt;b&gt;EMS&lt;/b&gt; (&lt;i&gt;European Monetary System&lt;/i&gt;) and the peg of one currency to another, such as the &lt;b&gt;Argentine peso to the dollar between 1991 and 2001&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;Exchange rate arrangements &lt;b&gt;are usually fragile and sooner or later run into crisis&lt;/b&gt;: the authorities&#x27; promise to maintain the fixed rate is, at some point, &lt;i&gt;reneged&lt;/i&gt; on.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;t&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Fixed exchange rate (type 2)&lt;/th&gt;&lt;th&gt;Eurozone (type 1)&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Currencies&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Remain national, linked by a parity&lt;/td&gt;&lt;td&gt;A single currency&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Promise&lt;/b&gt;&lt;/td&gt;&lt;td&gt;To convert the national currency at the announced parity&lt;/td&gt;&lt;td&gt;To repay the public debt (in euros)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Liquidity that may run short&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Foreign exchange reserves&lt;/td&gt;&lt;td&gt;Liquidity in the &quot;national&quot; currency (the euro, which the state does not print)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Outcome of the crisis&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Devaluation&lt;/td&gt;&lt;td&gt;Default&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Summary based on slide 22 (Conclusions).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the fixed exchange rate examples and of EMU&quot;&gt;

    &lt;g font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;60&quot; y=&quot;142&quot;&gt;1940&lt;/text&gt;&lt;text x=&quot;206&quot; y=&quot;142&quot;&gt;1960&lt;/text&gt;&lt;text x=&quot;352&quot; y=&quot;142&quot;&gt;1980&lt;/text&gt;&lt;text x=&quot;498&quot; y=&quot;142&quot;&gt;2000&lt;/text&gt;&lt;text x=&quot;644&quot; y=&quot;142&quot;&gt;2020&lt;/text&gt;
    &lt;/g&gt;
    &lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;114&quot; x2=&quot;60&quot; y2=&quot;126&quot;/&gt;&lt;line x1=&quot;206&quot; y1=&quot;114&quot; x2=&quot;206&quot; y2=&quot;126&quot;/&gt;&lt;line x1=&quot;352&quot; y1=&quot;114&quot; x2=&quot;352&quot; y2=&quot;126&quot;/&gt;&lt;line x1=&quot;498&quot; y1=&quot;114&quot; x2=&quot;498&quot; y2=&quot;126&quot;/&gt;&lt;line x1=&quot;644&quot; y1=&quot;114&quot; x2=&quot;644&quot; y2=&quot;126&quot;/&gt;&lt;/g&gt;

    &lt;rect x=&quot;345&quot; y=&quot;88&quot; width=&quot;138&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;414&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;EMS 1979–98&lt;/text&gt;
    &lt;rect x=&quot;432&quot; y=&quot;56&quot; width=&quot;73&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;468&quot; y=&quot;71&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot;&gt;Argentina 91–01&lt;/text&gt;

    &lt;line x1=&quot;425&quot; y1=&quot;120&quot; x2=&quot;425&quot; y2=&quot;160&quot; stroke=&quot;var(--soft)&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;176&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;1990: full capital mobility in the EEC →&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The dates of the systems are a &lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; (see &quot;Further reading&quot;); the slides only mention Argentina 1991–2001 and capital controls in Europe until 1991.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Supplement · how a fixed exchange rate is defended in practice&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; If the central bank announces &quot;1 unit of national currency = x dollars&quot;, it must be ready to trade at that price with anyone. When many agents want to &lt;b&gt;sell&lt;/b&gt; the national currency, the central bank &lt;b&gt;buys&lt;/b&gt; it, paying with its &lt;em class=&quot;t&quot;&gt;foreign exchange reserves&lt;/em&gt; (dollars, euros, gold…). Reserves fall. If they run out, the parity can no longer be defended and a &lt;em class=&quot;t&quot;&gt;devaluation&lt;/em&gt; follows (the national currency is officially worth less foreign currency).&lt;/p&gt;
    &lt;p&gt;Buying national currency with reserves also reduces the quantity of money in circulation: it is an automatic monetary tightening, which adds to the rise in interest rates described in section 3.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What are the two types of incomplete monetary union?&lt;/summary&gt;&lt;div&gt;(1) &lt;strong&gt;Monetary union without fiscal union&lt;/strong&gt; (example: EMU); (2) &lt;strong&gt;fixed exchange rate arrangements&lt;/strong&gt; (Bretton Woods, EMS, the Argentine peso pegged to the dollar 1991–2001).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why, according to the slides, do exchange rate arrangements &quot;sooner or later run into crisis&quot;?&lt;/summary&gt;&lt;div&gt;Because they rest on a &lt;strong&gt;promise&lt;/strong&gt; by the authorities that at some point may become too costly to keep and be &lt;strong&gt;reneged&lt;/strong&gt; on; markets know this and anticipate it.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does EMU lack to be a &quot;complete&quot; union?&lt;/summary&gt;&lt;div&gt;A &lt;strong&gt;fiscal union&lt;/strong&gt;: a common budget, transfers and common debt. Member states issue debt in a currency they do not control.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section id=&quot;fragilita&quot; class=&quot;part ochre&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Where fragility comes from: credibility and liquidity&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slides 3–6&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The slides identify &lt;b&gt;two problems&lt;/b&gt; which, taken on their own, are manageable but which together reinforce each other.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h3 style=&quot;margin-top:.2em&quot;&gt;Credibility &lt;span class=&quot;pill&quot;&gt;credibility&lt;/span&gt;&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Announcing a fixed exchange rate means making a &lt;b&gt;promise about the future&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;As with any promise, the question is whether it can be kept.&lt;/li&gt;
        &lt;li&gt;Circumstances may change and make the promise &lt;b&gt;incompatible with the country&#x27;s welfare&lt;/b&gt; (for instance, with high unemployment).&lt;/li&gt;
        &lt;li&gt;The authorities then have an &lt;b&gt;incentive to renege on it&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Private agents suspect this and &lt;b&gt;attack the currency&lt;/b&gt; → a &lt;em class=&quot;t&quot;&gt;speculative crisis&lt;/em&gt; arises.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h3 style=&quot;margin-top:.2em&quot;&gt;Liquidity &lt;span class=&quot;pill&quot;&gt;liquidity&lt;/span&gt;&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;A country&#x27;s &lt;b&gt;official foreign exchange reserves&lt;/b&gt; are &lt;b&gt;limited&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;The defence of the fixed rate, i.e. the promise to convert national currency into foreign currency at the parity, &lt;b&gt;may not be guaranteed&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Investors know this and &lt;b&gt;become worried when reserves run low&lt;/b&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;src&quot;&gt;In a monetary union such as the Eurozone, the &quot;liquidity&quot; that may run short is liquidity in the currency in which the debt is issued (slide 22).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The vicious circle: credibility and liquidity interact&lt;/h3&gt;
  &lt;p&gt;Step through the stages (slide 6). Each step highlights the corresponding node of the cycle.&lt;/p&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper id=&quot;circ&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 330&quot; role=&quot;img&quot; aria-label=&quot;Cycle linking reserves, credibility, sales and interventions&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;&gt;
          &lt;path d=&quot;M235 62 Q300 90 300 135&quot;/&gt;&lt;path d=&quot;M300 200 Q300 250 235 272&quot;/&gt;&lt;path d=&quot;M125 272 Q60 250 60 200&quot;/&gt;&lt;path d=&quot;M60 135 Q60 90 125 62&quot;/&gt;
        &lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;1&quot;&gt;&lt;rect x=&quot;105&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Limited reserves&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;liquidity&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;2&quot;&gt;&lt;rect x=&quot;215&quot; y=&quot;140&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;285&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Credibility ↓&lt;/text&gt;&lt;text x=&quot;285&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;devaluation expectations&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;3&quot;&gt;&lt;rect x=&quot;105&quot; y=&quot;256&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Currency sales&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;capital flight&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;4&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;140&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;CB sells FX&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;reserves ↓ further&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;180&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;it spirals&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 1&lt;/span&gt;&lt;p&gt;A &lt;b&gt;limited stock of foreign exchange reserves reduces credibility&lt;/b&gt;: everyone knows that the central bank can defend the parity only until its stock runs out.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 2&lt;/span&gt;&lt;p&gt;&lt;b&gt;Reduced credibility induces investors to sell the national currency&lt;/b&gt;: if a devaluation is expected, it pays to get out before it happens (those who stay lose).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 3&lt;/span&gt;&lt;p&gt;The central bank is &lt;b&gt;forced to sell foreign currency&lt;/b&gt; to keep the exchange rate at the announced level: it buys the national currency that everyone is selling.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 4&lt;/span&gt;&lt;p&gt;As a result, &lt;b&gt;reserves fall even further&lt;/b&gt;…&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 5 · and the cycle starts again&lt;/span&gt;&lt;p&gt;…and &lt;b&gt;credibility falls even more&lt;/b&gt;. The mechanism is self-reinforcing: this is the root of the &lt;i&gt;intrinsic fragility&lt;/i&gt; of incomplete monetary unions.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;/style&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is a country with very large reserves less exposed to attacks?&lt;/summary&gt;&lt;div&gt;Because the promise to convert at the parity is more &lt;strong&gt;credible&lt;/strong&gt;: investors do not fear that the central bank will run out of ammunition, so they have no reason to sell in advance. Liquidity and credibility support each other.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Describe the vicious circle in four arrows.&lt;/summary&gt;&lt;div&gt;Limited reserves → credibility ↓ → sales of national currency → the CB sells reserves to defend the exchange rate → reserves ↓ → credibility ↓ further.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The authorities may have an incentive to renege on the promise even if they have reserves. Why?&lt;/summary&gt;&lt;div&gt;Because circumstances (a shock, unemployment) may make the parity &lt;strong&gt;incompatible with the country&#x27;s welfare&lt;/strong&gt;: maintaining it costs more than abandoning it. This is the &quot;pure&quot; credibility problem, which the model in section 4 formalizes.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section id=&quot;parita&quot; class=&quot;part slate&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Interest rate parity&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slides 7–15&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;To understand &lt;i&gt;how&lt;/i&gt; markets punish a promise that lacks credibility, we need &lt;em class=&quot;t&quot;&gt;interest rate parity&lt;/em&gt;. The idea, in one line:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;domestic rate = foreign rate + &lt;span class=&quot;hl&quot;&gt;expected devaluation&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Uncovered interest rate parity&lt;/em&gt; (UIP: without hedging against exchange rate risk) makes the equilibrium of capital flows &lt;b&gt;highly vulnerable&lt;/b&gt; and can severely constrain monetary policy: to prevent capital flight when devaluation expectations are high, the central bank is &lt;b&gt;forced to raise interest rates to very high levels&lt;/b&gt; (slide 7).&lt;/p&gt;

  &lt;h3&gt;The example from the slides, step by step&lt;/h3&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Data&lt;/span&gt;&lt;p&gt;You have &lt;b&gt;€2000&lt;/b&gt; to invest in identical bonds, one denominated in euros and one in dollars. Interest rates: &lt;b&gt;i&lt;sub&gt;€&lt;/sub&gt; = i&lt;sub&gt;$&lt;/sub&gt; = 5%&lt;/b&gt;. Exchange rate &lt;b&gt;E = 1.2 $/€&lt;/b&gt; (1 euro buys 1.2 dollars). Is there any difference in the expected return?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Investing in euros&lt;/span&gt;&lt;div class=&quot;formula&quot;&gt;2000 × 1.05 = &lt;span class=&quot;hl&quot;&gt;€2100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Investing in dollars&lt;/span&gt;&lt;p&gt;Convert: 2000 × 1.2 = $2400. After one year: 2400 × 1.05 = $2520. Convert back at today&#x27;s exchange rate:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;2520 / 1.2 = &lt;span class=&quot;hl&quot;&gt;€2100&lt;/span&gt;&lt;/div&gt;&lt;p&gt;→ &lt;b&gt;No difference.&lt;/b&gt; But what implicit assumption have we made?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;The hidden assumption&lt;/span&gt;&lt;p&gt;We assumed that &lt;b&gt;the exchange rate will still be 1.2 one year from now&lt;/b&gt;. Suppose instead that it becomes &lt;b&gt;E&lt;sub&gt;t+1&lt;/sub&gt; = 1&lt;/b&gt;: one euro will buy only 1 dollar, i.e. &lt;b&gt;the euro depreciates&lt;/b&gt;.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;$2520 / 1 = &lt;span class=&quot;hl&quot;&gt;€2520&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Extra return relative to the euro bond: (2520 − 2100)/2100 = &lt;b&gt;20%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;How much must the euro rate rise?&lt;/span&gt;&lt;p&gt;For the euro bond to yield as much as the dollar bond, its interest rate must rise by about 20 points. The exact calculation in the slides:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;2000 × (1 + 0.05 + &lt;span class=&quot;hl&quot;&gt;0.21&lt;/span&gt;) = 2520&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Note: the exact increase is &lt;b&gt;21 points&lt;/b&gt; (euro rate at 26%); &quot;about 20%&quot; is the linear approximation. The difference stems from the &lt;i&gt;Ė·r&lt;/i&gt; term neglected in the derivation below.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The general rule and the no-arbitrage condition&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;On each € invested in euro bonds&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;(1 + r)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;On each € invested in dollar bonds (in €)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;(1 + r*)&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;E in $/€: convert at E&lt;sub&gt;t&lt;/sub&gt;, earn r*, convert back at E&lt;sub&gt;t+1&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;No arbitrage condition.&lt;/b&gt; The two returns must be equal: absence of arbitrage means that no profit can be made by buying and selling &lt;i&gt;the same&lt;/i&gt; asset in different markets. If one return were higher, everyone would shift capital there until the difference disappeared.&lt;/div&gt;

  &lt;h4&gt;Derivation (slide 12)&lt;/h4&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;p&gt;Equating the returns (using the &lt;i&gt;expected&lt;/i&gt; future exchange rate, E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;):&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Add and subtract 1 inside the brackets (a trick that changes nothing):&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;(&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; − 1 + 1)(1 + r) = (1 + r*)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Rewrite the ratio as the expected percentage change in the exchange rate:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;(&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; − E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; + 1)(1 + r) = (1 + r*)&lt;/div&gt;&lt;p&gt;Let &lt;b&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/b&gt; = (E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; − E&lt;sub&gt;t&lt;/sub&gt;)/E&lt;sub&gt;t&lt;/sub&gt; denote the expected rate of change of the exchange rate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Multiply out:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; + Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;·r + 1 + r = 1 + r*&lt;/div&gt;&lt;p&gt;The product of two small numbers (e.g. 0.02 × 0.05 = 0.001) is negligible: set &lt;b&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;·r ≈ 0&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Result:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;hl&quot;&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; = r* − r&lt;/span&gt; &amp;nbsp;⇔&amp;nbsp; r = r* − Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;With E in $/€, an expected depreciation of the euro means Ė&lt;sup&gt;e&lt;/sup&gt; &amp;lt; 0: the domestic rate must exceed the foreign rate &lt;b&gt;by exactly the expected devaluation&lt;/b&gt;. In the example Ė = (1 − 1.2)/1.2 ≈ −16.7%, so r ≈ 5% + 16.7% ≈ 21.7% with the approximate formula, 26% with the exact one. The approximation works well only for small changes.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Try it yourself: how much does it cost to defend the currency?&lt;/h3&gt;
  &lt;p&gt;Move the sliders: choose the foreign interest rate and the exchange rate that markets expect one year from now. The chart shows the domestic rate the central bank must offer in order not to lose capital.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;uip&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-rs&quot;&gt;Foreign rate r*&lt;/label&gt;&lt;input id=&quot;u-rs&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;u-rs-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-e&quot;&gt;Current exchange rate E&lt;sub&gt;t&lt;/sub&gt; ($/€)&lt;/label&gt;&lt;input id=&quot;u-e&quot; type=&quot;range&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.2&quot;&gt;&lt;output id=&quot;u-e-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-ee&quot;&gt;Expected exchange rate E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; ($/€)&lt;/label&gt;&lt;input id=&quot;u-ee&quot; type=&quot;range&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.2&quot;&gt;&lt;output id=&quot;u-ee-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;&lt;small&gt;Expected change Ė&lt;sup&gt;e&lt;/sup&gt;&lt;/small&gt;&lt;b id=&quot;u-d&quot;&gt;0%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Required r (approximate)&lt;/small&gt;&lt;b id=&quot;u-ra&quot;&gt;5%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Required r (exact)&lt;/small&gt;&lt;b id=&quot;u-rx&quot;&gt;5%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Spread r − r*&lt;/small&gt;&lt;b id=&quot;u-sp&quot;&gt;0 bp&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Bars showing the foreign rate and the required domestic rate&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;36&quot; font-size=&quot;13&quot;&gt;foreign r*&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;86&quot; font-size=&quot;13&quot;&gt;exact domestic r&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;132&quot; font-size=&quot;13&quot;&gt;approximate r&lt;/text&gt;
      &lt;rect x=&quot;130&quot; y=&quot;22&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b1&quot; fill=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;130&quot; y=&quot;72&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b2&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;rect x=&quot;130&quot; y=&quot;118&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b3&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;text id=&quot;u-t1&quot; y=&quot;37&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;text id=&quot;u-t2&quot; y=&quot;87&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;text id=&quot;u-t3&quot; y=&quot;133&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;u-v&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;When it holds, and why it hurts&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Parity holds for…&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;identical assets&lt;/b&gt; (same risk, same maturity): only the currency differs;&lt;/li&gt;&lt;li&gt;&lt;b&gt;free capital mobility&lt;/b&gt;: otherwise arbitrage cannot take place.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;…and its price&lt;/h4&gt;&lt;p&gt;Interest rate parity &lt;b&gt;can make it very costly to prevent capital flight&lt;/b&gt; (slide 13): very high interest rates hit public debt, investment and domestic demand. This is the bridge to the model in section 4.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Uncovered (UIP)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Covered (CIP)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;
      &lt;p&gt;This is &quot;our example&quot;: the investor &lt;b&gt;does not hedge&lt;/b&gt; and bears the exchange rate risk; what matters is the &lt;i&gt;expected&lt;/i&gt; exchange rate, which nobody observes directly. This is where expectations, and hence credibility, come in.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;F&lt;/span&gt;&lt;span&gt;S&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;F&lt;/b&gt; = &lt;em class=&quot;t&quot;&gt;forward exchange rate&lt;/em&gt; (set today for an exchange at a future date); &lt;b&gt;S&lt;/b&gt; = &lt;em class=&quot;t&quot;&gt;spot exchange rate&lt;/em&gt; (today&#x27;s rate). The no-arbitrage condition is satisfied by using a &lt;b&gt;forward contract&lt;/b&gt; that hedges the investor against exchange rate risk: all terms are known today.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; After the 2008 crisis even CIP, long regarded as almost a law of nature, has shown persistent deviations (the &quot;cross-currency basis&quot;), linked to banks&#x27; balance-sheet costs and to hedging demand: &lt;a href=&quot;https://ideas.repec.org/h/bis/bisbpc/96-08.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Borio, McCauley, McGuire, Sushko — BIS Quarterly Review, Sept. 2016&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;A real-world case: the Italy–Germany spread (slide 15)&lt;/h3&gt;
  &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;yield spread&lt;/em&gt; is the difference between the yields on the two countries&#x27; ten-year government bonds, measured in &lt;em class=&quot;t&quot;&gt;basis points&lt;/em&gt; (100 bp = 1 percentage point).&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 620 260&quot; role=&quot;img&quot; aria-label=&quot;Italy–Germany ten-year spread: 444, 81, 29, 17 basis points&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;220&quot; x2=&quot;600&quot; y2=&quot;220&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;g font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;52&quot; y=&quot;224&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;124&quot;&gt;250&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;24&quot;&gt;500&lt;/text&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;2 4&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;120&quot; x2=&quot;600&quot; y2=&quot;120&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;600&quot; y2=&quot;20&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;90&quot; y=&quot;42.4&quot; width=&quot;90&quot; height=&quot;177.6&quot; rx=&quot;4&quot; fill=&quot;var(--slate)&quot;/&gt;
    &lt;rect x=&quot;220&quot; y=&quot;187.6&quot; width=&quot;90&quot; height=&quot;32.4&quot; rx=&quot;4&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;rect x=&quot;350&quot; y=&quot;208.4&quot; width=&quot;90&quot; height=&quot;11.6&quot; rx=&quot;4&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
    &lt;rect x=&quot;480&quot; y=&quot;213.2&quot; width=&quot;90&quot; height=&quot;6.8&quot; rx=&quot;4&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
    &lt;g font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;135&quot; y=&quot;36&quot;&gt;444&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;181&quot;&gt;81&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;202&quot;&gt;29&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;207&quot;&gt;17&lt;/text&gt;&lt;/g&gt;
    &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;135&quot; y=&quot;238&quot;&gt;Mar 1996&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;252&quot; fill=&quot;var(--soft)&quot;&gt;in lire&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;238&quot;&gt;Mar 1996&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;252&quot; fill=&quot;var(--soft)&quot;&gt;in marks (DM)&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;238&quot;&gt;Aug 1999&lt;/text&gt;&lt;text x=&quot;395&quot; y=&quot;252&quot; fill=&quot;var(--soft)&quot;&gt;in euros&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;238&quot;&gt;Sep 2004&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;252&quot; fill=&quot;var(--soft)&quot;&gt;in euros&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M185 110 Q215 110 220 175&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;100&quot; font-size=&quot;11&quot; fill=&quot;var(--brick)&quot;&gt;≈ 363 bp of exchange rate risk&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Data from slide 15. Interpretation: &lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;How to read the table through interest rate parity&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; In March 1996 the Italian state issued bonds both in lire and in German marks. Comparing the two spreads in the same month isolates the components:&lt;/p&gt;
    &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;Spread in lire &lt;b&gt;444&lt;/b&gt;&lt;/span&gt;=&lt;span&gt;exchange rate risk / expected devaluation of the lira &lt;b&gt;≈ 363&lt;/b&gt;&lt;/span&gt;+&lt;span&gt;Italian credit risk &lt;b&gt;≈ 81&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;For an investor reasoning in marks, the mark-denominated bond carries no exchange rate risk: its 81 bp measure only distrust of the borrower. The remainder is the expected devaluation of the lira, precisely the Ė&lt;sup&gt;e&lt;/sup&gt; term of the parity condition. With the euro (1999, 2004) exchange rate risk disappears and the spread collapses to 29 and then 17 bp. Subsequent history (the sovereign debt crisis from 2010) would show, however, that &lt;i&gt;default&lt;/i&gt; risk can reopen the spread even within the single currency: this is the &quot;parallel&quot; of section 6.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;r* = 3%, and markets expect the national currency to lose 10% over the year. What interest rate must the central bank offer?&lt;/summary&gt;&lt;div&gt;With the approximate formula, &lt;strong&gt;r ≈ 3% + 10% = 13%&lt;/strong&gt;. Each point of expected devaluation translates into one extra point of interest.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What was the implicit assumption in the first calculation (€2100 = €2100)?&lt;/summary&gt;&lt;div&gt;That the &lt;strong&gt;future exchange rate would equal today&#x27;s&lt;/strong&gt; (no expected change).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between UIP and CIP?&lt;/summary&gt;&lt;div&gt;Under UIP the investor remains exposed to exchange rate risk and what matters is the &lt;strong&gt;expected&lt;/strong&gt; exchange rate; under CIP the investor hedges with a &lt;strong&gt;forward&lt;/strong&gt; and what matters is the forward rate F, known today.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the Italy–Germany spread in lire (444) much higher than the one in marks (81)?&lt;/summary&gt;&lt;div&gt;Because it includes &lt;strong&gt;expectations of a lira devaluation&lt;/strong&gt; (about 363 bp), in addition to credit risk.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Under what conditions does interest rate parity hold?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Identical assets&lt;/strong&gt; and &lt;strong&gt;free capital mobility&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section id=&quot;modello&quot; class=&quot;part brick&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;h2&gt;The cost–benefit model of devaluation&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slides 16–19&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Returning to the credibility of exchange rate arrangements, the slides analyse it with a &quot;well-known model&quot;: the authorities decide whether to maintain the parity or devalue by comparing &lt;b&gt;costs&lt;/b&gt; and &lt;b&gt;benefits&lt;/b&gt;. It is the same framework that De Grauwe&#x27;s textbook uses for incomplete monetary unions (see &quot;Further reading&quot;).&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Benefit B&lt;sub&gt;U&lt;/sub&gt; (U = unanticipated).&lt;/b&gt; The benefit, or &lt;i&gt;temptation&lt;/i&gt;, of devaluing when markets do &lt;b&gt;not&lt;/b&gt; expect it. It &lt;b&gt;increases with the size of the&lt;/b&gt; balance-of-payments &lt;b&gt;shock&lt;/b&gt;: the more severe the crisis (falling exports, unemployment), the more it pays to regain competitiveness through devaluation. The curve is convex: for large shocks the temptation explodes.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost C.&lt;/b&gt; The cost of reneging on the promise, represented as a horizontal line (independent of the shock). &lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; It typically includes the loss of reputation and future credibility, imported inflation, and political or institutional sanctions.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shock.&lt;/b&gt; An adverse event that hits the balance of payments (the account of the country&#x27;s transactions with the rest of the world). If it affects only one country in the arrangement it is an &lt;em class=&quot;t&quot;&gt;asymmetric shock&lt;/em&gt;: precisely the case in which a fixed exchange rate, or the single currency, &quot;binds&quot; most tightly.&lt;/div&gt;

  &lt;h3&gt;The role of market expectations (slide 18)&lt;/h3&gt;
  &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;Investors &lt;b&gt;expect&lt;/b&gt; a devaluation&lt;/span&gt;→&lt;span&gt;they sell domestic currency and bonds&lt;/span&gt;→&lt;span&gt;by &lt;b&gt;interest rate parity&lt;/b&gt; the interest rate must rise&lt;/span&gt;→&lt;span&gt;higher cost of public debt, less investment: &lt;b&gt;squeeze on domestic demand&lt;/b&gt;&lt;/span&gt;→&lt;span&gt;devaluing becomes &lt;b&gt;more attractive&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Hence, &lt;b&gt;for any given shock, the benefit of devaluation is higher&lt;/b&gt; if the devaluation is anticipated: the &lt;b&gt;B&lt;sub&gt;E&lt;/sub&gt;&lt;/b&gt; curve (E = expected) lies above and to the left of B&lt;sub&gt;U&lt;/sub&gt;.&lt;/p&gt;

  &lt;h3&gt;Explore the graph&lt;/h3&gt;
  &lt;p&gt;Move the shock and see which of the three zones you fall into. Then change market expectations: in the middle zone, they determine the outcome.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;cb&quot;&gt;

  &lt;h3&gt;The three zones at a glance&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;h4&gt;Shock &amp;lt; S₁&lt;/h4&gt;&lt;p&gt;Even if markets expected a devaluation, B&lt;sub&gt;E&lt;/sub&gt; &amp;lt; C: the authorities maintain the parity. An attack would be bound to fail, so it does not start. &lt;b&gt;Credible exchange rate.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--ochre-bg);border:0&quot;&gt;&lt;h4&gt;S₁ &amp;lt; shock &amp;lt; S₂&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Multiple equilibria&lt;/b&gt; (along the green line in the slides). If markets expect a devaluation, the economy ends up at &lt;b&gt;D&lt;/b&gt; (B&lt;sub&gt;E&lt;/sub&gt; &amp;gt; C → devaluation); if they do not, it stays at &lt;b&gt;N&lt;/b&gt; (B&lt;sub&gt;U&lt;/sub&gt; &amp;lt; C → the parity is maintained). Expectations are self-fulfilling.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;h4&gt;Shock &amp;gt; S₂&lt;/h4&gt;&lt;p&gt;Even without expectations B&lt;sub&gt;U&lt;/sub&gt; &amp;gt; C: devaluation pays off in any case. Markets understand this and attack: an &lt;b&gt;unavoidable crisis&lt;/b&gt;, driven by fundamentals.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-fulfilling expectations.&lt;/b&gt; In the intermediate zone the crisis is neither the &quot;fault&quot; of the fundamentals nor a mistake by the markets: &lt;i&gt;if&lt;/i&gt; everyone expects a devaluation, their behaviour (selling, rising interest rates) makes it optimal for the government, and the expectation turns out to be correct ex post. If nobody expects it, the parity holds. The same country, facing the same shock, can end up in two different equilibria.&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Note the title of slide 19.&lt;/strong&gt; It reads &quot;Cost and benefit of &lt;i&gt;default&lt;/i&gt;&quot;, but the graph is about &lt;i&gt;devaluation&lt;/i&gt;. This is not (only) a typo: it is exactly the parallel drawn in the lecture. Replacing &quot;devaluation&quot; with &quot;default&quot; and &quot;foreign exchange reserves&quot; with &quot;liquidity in euros&quot;, the graph describes a Eurozone country (section 6).&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does B&lt;sub&gt;E&lt;/sub&gt; lie above B&lt;sub&gt;U&lt;/sub&gt;?&lt;/summary&gt;&lt;div&gt;Because if a devaluation is expected, capital flows out, interest rates rise (interest rate parity), and the cost of debt and the squeeze on demand increase: &lt;strong&gt;maintaining the parity becomes more costly&lt;/strong&gt;, so devaluing yields more for any given shock.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What happens between S₁ and S₂?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Multiple equilibria&lt;/strong&gt;: the outcome (D or N) depends solely on market expectations, which are self-fulfilling.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If C increases (the line shifts up), what happens to S₁ and S₂?&lt;/summary&gt;&lt;div&gt;Both shift &lt;strong&gt;to the right&lt;/strong&gt;: larger shocks are needed to trigger a devaluation. This is why one of the remedies is to &lt;strong&gt;raise the cost of reneging on the commitment&lt;/strong&gt; (section 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If expectations matter less (B&lt;sub&gt;E&lt;/sub&gt; moves closer to B&lt;sub&gt;U&lt;/sub&gt;), what happens to the zone of multiple equilibria?&lt;/summary&gt;&lt;div&gt;It &lt;strong&gt;narrows&lt;/strong&gt;: S₁ moves closer to S₂. The less weight markets carry, the less room there is for self-fulfilling crises.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section id=&quot;rimedi&quot; class=&quot;part sage&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;h2&gt;How to deal with fragility&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slides 20–21&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The slides first propose &lt;b&gt;eliminating the root&lt;/b&gt; of the fixed exchange rate problem, then some intermediate alternatives. Open the panels.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Spectrum of exchange rate regimes from a single currency to a flexible exchange rate&quot;&gt;
    &lt;defs&gt;&lt;linearGradient id=&quot;gr&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--accent-bg)&quot;/&gt;&lt;stop offset=&quot;.5&quot; stop-color=&quot;var(--ochre-bg)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--slate-bg)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
    &lt;rect x=&quot;30&quot; y=&quot;50&quot; width=&quot;840&quot; height=&quot;34&quot; rx=&quot;17&quot; fill=&quot;url(#gr)&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;circle cx=&quot;70&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Monetary union&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;108&quot;&gt;no exchange rate&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;124&quot; fill=&quot;var(--soft)&quot;&gt;(EMS → EMU)&lt;/text&gt;
      &lt;circle cx=&quot;250&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Currency board&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;108&quot;&gt;&quot;constitutional&quot; parity&lt;/text&gt;
      &lt;circle cx=&quot;450&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Adjustable peg&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;108&quot;&gt;EMS, Bretton Woods&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;124&quot; fill=&quot;var(--brick)&quot;&gt;fragile zone&lt;/text&gt;
      &lt;circle cx=&quot;830&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;830&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Flexible&lt;/text&gt;&lt;text x=&quot;830&quot; y=&quot;108&quot;&gt;free float&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;70&quot; y=&quot;146&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;← fixed &quot;corner&quot;&lt;/text&gt;&lt;text x=&quot;830&quot; y=&quot;146&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;end&quot;&gt;flexible &quot;corner&quot; →&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The spectrum diagram is a &lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; to organize the options in the slides.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Eliminating the root of the problem&lt;/h3&gt;
  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Moving towards a monetary union (no exchange rate)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If there is no exchange rate, there is no parity to attack. This is the logic behind the European decision to move &lt;b&gt;from the EMS to EMU&lt;/b&gt; after the crises of the early 1990s. The price: the credibility problem shifts from the parity to &lt;b&gt;debt repayment&lt;/b&gt; (section 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Letting the exchange rate float (flexible exchange rates)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If no parity is promised, there is no promise to renege on: the shock is absorbed by the exchange rate rather than by reserves and interest rates.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Polarization.&lt;/b&gt; However, the choice &quot;either completely fixed or completely flexible&quot; (&lt;em class=&quot;t&quot;&gt;polarization&lt;/em&gt;, also known as &lt;i&gt;corner solutions&lt;/i&gt; or the &lt;i&gt;bipolar view&lt;/i&gt;) &lt;b&gt;does not enjoy general consensus&lt;/b&gt;.&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The &quot;bipolar view&quot; is associated with Stanley Fischer (IMF): with free capital mobility, intermediate regimes (soft pegs) are crisis-prone and countries tend to move towards the extremes. &lt;a href=&quot;https://www.imf.org/external/np/speeches/2001/010601a.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fischer, &quot;Exchange Rate Regimes: Is the Bipolar View Correct?&quot;, 2001&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Other alternatives&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Capital controls&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Raising the cost of reneging&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Currency board&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Capital controls&lt;/em&gt;: legal limits on the purchase of foreign assets. If capital cannot leave, interest rate parity does not hold (one of its conditions is missing) and an attack is more difficult.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;In Europe &lt;b&gt;until 1991&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;in some European countries &lt;b&gt;temporarily after the collapse of the EMS&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;in &lt;b&gt;China&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;But&lt;/b&gt;: financial and trade integration requires free capital mobility. The remedy conflicts with the single market.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; Directive 88/361/EEC established full freedom of capital movements among EEC countries from 1 July 1990, with transitional periods for some countries and a safeguard clause: &lt;a href=&quot;https://eur-lex.europa.eu/ES/legal-content/summary/free-movement-of-capital-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex summary on the free movement of capital&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;In the model: &lt;b&gt;shift the C line upwards&lt;/b&gt;. The more costly it is to renege on the commitment, the further to the right S₁ and S₂ move, and the wider the safe zone. The slides cite &lt;b&gt;Maastricht&lt;/b&gt; as an interesting example.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; The Maastricht convergence criteria made entry into the euro conditional, among other things, on exchange rate stability within the ERM with no devaluations in the preceding two years: devaluing meant forfeiting the &quot;prize&quot; of admission to the euro, so C increased.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; Criteria: inflation, public finances (deficit 3%, debt 60% of GDP), long-term interest rates, exchange rate stability. &lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/glossary/convergence-criteria.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex glossary, &quot;convergence criteria&quot;&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;A parity defined by law, even in the constitution (&lt;em class=&quot;t&quot;&gt;constitutionally defined parity&lt;/em&gt;). Under a &lt;em class=&quot;t&quot;&gt;currency board&lt;/em&gt;, &lt;b&gt;every issue of national currency is matched by an equal amount of the anchor currency&lt;/b&gt;: the monetary base is fully backed by reserves, so the liquidity problem is in principle solved.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; The credibility problem remains, however: if the shock is huge, even a law can be changed. Argentina in 1991–2001, cited in slide 2, had a regime of this kind and it collapsed.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.imf.org/external/pubs/ft/fandd/1998/12/enoch.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Enoch and Gulde, &quot;Are Currency Boards a Cure for All Monetary Problems?&quot;, IMF Finance &amp;amp; Development, Dec. 1998&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why do capital controls protect a fixed exchange rate, and why are they a problematic remedy in the EU?&lt;/summary&gt;&lt;div&gt;Because without free capital mobility &lt;strong&gt;interest rate parity does not hold&lt;/strong&gt; and speculative attacks are hindered; but &lt;strong&gt;financial and trade integration requires free capital mobility&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In what sense does Maastricht &quot;raise the cost of reneging&quot;?&lt;/summary&gt;&lt;div&gt;By linking entry into the euro to exchange rate stability: devaluing would have meant losing access to the union. In the graph the &lt;strong&gt;C line shifts up&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does a currency board guarantee, and what does it not?&lt;/summary&gt;&lt;div&gt;It guarantees that every unit of currency is backed by foreign currency (&lt;strong&gt;liquidity&lt;/strong&gt;), but it does not fully eliminate &lt;strong&gt;credibility&lt;/strong&gt; risk: the rule can be abandoned (Argentina 2001).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section id=&quot;parallelo&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;h2&gt;The interesting parallel and conclusions&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 22&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The subtitle of the lecture becomes clear here: &lt;b&gt;the same type of model applies to both cases&lt;/b&gt;. A fixed exchange rate and a Eurozone country suffer from the same fragility; only the names of the variables change. Use the toggle to &quot;translate&quot; the chain from one case to the other.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;par&quot;&gt;
    &lt;div class=&quot;ctrls&quot; style=&quot;margin-top:0&quot;&gt;&lt;button class=&quot;btn&quot; data-mode=&quot;fx&quot; aria-pressed=&quot;true&quot;&gt;Fixed exchange rate&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mode=&quot;ez&quot; aria-pressed=&quot;false&quot;&gt;Eurozone country&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Chain of a self-fulfilling crisis&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;235&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;460&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;685&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar3)&quot;&gt;&lt;line x1=&quot;212&quot; y1=&quot;85&quot; x2=&quot;232&quot; y2=&quot;85&quot;/&gt;&lt;line x1=&quot;437&quot; y1=&quot;85&quot; x2=&quot;457&quot; y2=&quot;85&quot;/&gt;&lt;line x1=&quot;662&quot; y1=&quot;85&quot; x2=&quot;682&quot; y2=&quot;85&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;110&quot; y=&quot;30&quot;&gt;promise&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;30&quot;&gt;missing liquidity&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;30&quot;&gt;market reaction&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;30&quot;&gt;outcome&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;110&quot; y=&quot;80&quot; data-fx=&quot;Maintain the&quot; data-ez=&quot;Repay the&quot;&gt;Maintain the&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;100&quot; data-fx=&quot;exchange rate parity&quot; data-ez=&quot;public debt&quot;&gt;exchange rate parity&lt;/text&gt;
        &lt;text x=&quot;335&quot; y=&quot;80&quot; data-fx=&quot;Foreign exchange&quot; data-ez=&quot;Euro liquidity:&quot;&gt;Foreign exchange&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;100&quot; data-fx=&quot;reserves&quot; data-ez=&quot;not its own CB&quot;&gt;reserves&lt;/text&gt;
        &lt;text x=&quot;560&quot; y=&quot;80&quot; data-fx=&quot;They sell the currency,&quot; data-ez=&quot;They sell the bonds,&quot;&gt;They sell the currency,&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;100&quot; data-fx=&quot;interest rates ↑&quot; data-ez=&quot;spreads ↑&quot;&gt;interest rates ↑&lt;/text&gt;
        &lt;text x=&quot;785&quot; y=&quot;80&quot; data-fx=&quot;Devaluation&quot; data-ez=&quot;Default&quot;&gt;Devaluation&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;100&quot; font-weight=&quot;400&quot; font-size=&quot;12&quot; data-fx=&quot;(of the currency)&quot; data-ez=&quot;(on the debt)&quot;&gt;(of the currency)&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;var(--soft)&quot;&gt;lack of credibility generates self-fulfilling expectations&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;
  &lt;style&gt;#par button[aria-pressed=true]{background:var(--accent);color:var(--paper)}&lt;/style&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Why does a Eurozone country resemble a country with a fixed exchange rate?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;supplement&lt;/span&gt; A country with its own currency that issues debt in that currency can always, as a last resort, repay it by printing money (at the price of inflation): default due to lack of liquidity is all but ruled out. A Eurozone country issues debt in euros, which its national central bank cannot create on its own: like a country with a fixed exchange rate that needs reserves, it needs liquidity in a currency it does not control. If markets fear a default they sell the bonds, spreads rise, the cost of debt increases and default becomes more likely: the same graph as in section 4, with &quot;default&quot; in place of &quot;devaluation&quot;.&lt;/p&gt;
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; This is the thesis of &lt;a href=&quot;https://econpapers.repec.org/paper/epscepswp/5523.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;De Grauwe, &quot;The Governance of a Fragile Eurozone&quot;, CEPS WD 346, 2011&lt;/a&gt;: members of a monetary union are &quot;downgraded&quot; to the status of emerging economies and can end up in self-fulfilling multiple equilibria.&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Conclusions of the lecture&lt;/h3&gt;
  &lt;ol class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Intrinsic fragility&lt;/b&gt; of incomplete MUs.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Two types&lt;/b&gt;: fixed exchange rates and the Eurozone.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Doubts may arise about the credibility of the commitment&lt;/b&gt;: to maintain the fixed exchange rate or to repay the debt…&lt;/li&gt;
    &lt;li&gt;…&lt;b&gt;because of insufficient liquidity&lt;/b&gt;: foreign exchange reserves or liquidity in the national currency.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Common fragility&lt;/b&gt;: lack of credibility leads to &lt;b&gt;self-fulfilling expectations&lt;/b&gt;, which in turn push the country into devaluation or default; this is a sustainability problem for incomplete MUs and for the Eurozone.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;The same type of model&lt;/b&gt; applies to both cases.&lt;/li&gt;
  &lt;/ol&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Final self-assessment&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Complete the correspondence: foreign exchange reserves ↔ ? ; devaluation ↔ ?&lt;/summary&gt;&lt;div&gt;Foreign exchange reserves ↔ &lt;strong&gt;liquidity in euros&lt;/strong&gt; (in the currency in which the debt is issued); devaluation ↔ &lt;strong&gt;default&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Explain in three lines why a crisis can occur even with fundamentals that are &quot;not disastrous&quot;.&lt;/summary&gt;&lt;div&gt;With an intermediate shock (between S₁ and S₂), if markets expect a crisis they sell, interest rates rise through interest rate parity, the cost of keeping the commitment increases and abandoning it becomes optimal: &lt;strong&gt;the expectation is self-fulfilling&lt;/strong&gt;. Without that expectation the parity (or repayment) would have held.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why did the Italy–Germany spread fall after 1999, and why does this not mean that the risk had disappeared?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Exchange rate risk&lt;/strong&gt; disappeared; but with debt issued in a currency the country does not control, &lt;strong&gt;default risk&lt;/strong&gt; remained (and later re-emerged), which is the Eurozone version of the same fragility.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ Further reading ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;✦&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;All entries are &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;: found through web searches, to be consulted directly&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The slides do not cite any authors or texts by name. Below are, first, the agreements, legal acts and historical cases that the slides mention, and then the texts from which the &quot;well-known model&quot; and the theory of self-fulfilling crises originate.&lt;/p&gt;

  &lt;h3&gt;Agreements, legal acts and cases cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Bretton Woods (1944–1971)&lt;/h4&gt;&lt;p&gt;A par value system: currencies pegged to the dollar, the dollar convertible into gold, parities adjustable only in the case of &quot;fundamental disequilibrium&quot; and with the agreement of the IMF; it ended when the US suspended gold convertibility in 1971. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the first &quot;type 2&quot; example in slide 2 and shows how a parity promise is eventually reneged on.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/about/histcoop.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF — Cooperation and reconstruction (1944–71)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The EMS and the 1992–93 ERM crisis&lt;/h4&gt;&lt;p&gt;The EMS was established in 1979; there were twelve realignments between 1979 and 1987, none between 1987 and 1992, and then the 1992–93 crisis (with the Danish &quot;no&quot; to Maastricht and high German interest rates after reunification among the factors cited in the literature). The Banque de France working paper interprets it as a failure of coordination between monetary authorities. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the &quot;collapse of the EMS&quot; in slide 21 and the reason for the EMS → EMU choice in slide 20.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://banque-france.fr/system/files/2023-01/wp793_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France, Working Paper 793 (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Argentina: the Convertibility Plan (1991–2001)&lt;/h4&gt;&lt;p&gt;From 1991 the peso was at par with the dollar, under a regime similar to a currency board that severely restricted money creation. Recession from 1999, capital flight, then between December 2001 and January 2002 a partial freeze on deposits, partial default and abandonment of the parity. The IMF&#x27;s Independent Evaluation Office examined the Fund&#x27;s role. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the example in slide 2, and evidence that even a parity &quot;set by law&quot; can collapse.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/np/ieo/2003/arg/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF, Independent Evaluation Office — Argentina 1991–2002&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The Maastricht Treaty and the convergence criteria&lt;/h4&gt;&lt;p&gt;Criteria agreed at Maastricht (1991, treaty signed in 1992): price stability, public finances (deficit ≤ 3%, debt ≤ 60% of GDP), long-term interest rates, exchange rate stability within the ERM for at least two years without devaluations. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the example in slide 21 of &quot;raising the cost of reneging&quot;.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/glossary/convergence-criteria.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Glossary: convergence criteria&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Directive 88/361/EEC on the free movement of capital&lt;/h4&gt;&lt;p&gt;Adopted on 24 June 1988; full liberalization of capital movements from 1 July 1990, with transitional periods for Spain, Greece, Ireland and Portugal and a safeguard clause for severe currency turbulence. Now superseded by Art. 63 TFEU. &lt;span class=&quot;why&quot;&gt;Why it matters: it marks the end of the capital controls in Europe cited in slide 21.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/ES/legal-content/summary/free-movement-of-capital-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Summary on the free movement of capital&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Currency boards — Enoch and Gulde (IMF, 1998)&lt;/h4&gt;&lt;p&gt;An IMF article for a general audience: a currency board is not a guaranteed cure; it cites estimates by Ghosh, Gulde and Wolf according to which it reduces inflation by about 3.5 points a year relative to other regimes, thanks to a confidence effect. &lt;span class=&quot;why&quot;&gt;Why it matters: it expands on the &quot;constitutionally defined parity&quot; in slide 21.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/pubs/ft/fandd/1998/12/enoch.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF Finance &amp;amp; Development, December 1998&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;The model and the theory&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Paul De Grauwe — &lt;i&gt;Economics of Monetary Union&lt;/i&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;The standard textbook on European monetary union; earlier editions contain a chapter entitled &quot;Incomplete Monetary Unions: The European Monetary System, Dollarization&quot;. Latest edition identified: Oxford 2020 (edition number not verified). &lt;span class=&quot;why&quot;&gt;Why it matters: the title and the cost–benefit framework of the lecture match that chapter (a link suggested by Claude, not stated in the slides: check the course syllabus).&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;College of Europe — book page&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Paul De Grauwe — &quot;The Governance of a Fragile Eurozone&quot; (CEPS, 2011)&lt;/h4&gt;&lt;p&gt;CEPS Working Document 346: the countries of the monetary union issue debt in a currency they do not control and are exposed to market-driven defaults and self-fulfilling multiple equilibria; it criticizes the design of the ESM. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the Eurozone version of the &quot;parallel&quot; (section 6).&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/paper/epscepswp/5523.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers — abstract and full text&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Maurice Obstfeld — &quot;Models of currency crises with self-fulfilling features&quot; (1996)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;European Economic Review&lt;/i&gt; 40(3–5), pp. 1037–1047. An illustrative model in which high unemployment can cause a self-fulfilling currency crisis; a survey of other self-reinforcing mechanisms. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the theoretical basis of the graph with B&lt;sub&gt;U&lt;/sub&gt;, B&lt;sub&gt;E&lt;/sub&gt; and the zone of multiple equilibria.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=225349&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN — working paper version (NBER WP 5285)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Obstfeld and Rogoff — &quot;The Mirage of Fixed Exchange Rates&quot; (1995)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Economic Perspectives&lt;/i&gt; 9(4), pp. 73–96. The central banks of industrialized countries would have the resources to defend almost any parity; the problem is whether markets believe they will use them, because the defence can be very costly for the economy (the cases of Sweden and the United Kingdom in 1992, Mexico in 1994–95). &lt;span class=&quot;why&quot;&gt;Why it matters: it shows that credibility matters more than liquidity alone.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/article/aeajecper/v_3a9_3ay_3a1995_3ai_3a4_3ap_3a73-96.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers — article page&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Stanley Fischer — &quot;Exchange Rate Regimes: Is the Bipolar View Correct?&quot; (2001)&lt;/h4&gt;&lt;p&gt;Address to the American Economic Association (later published in the &lt;i&gt;Journal of Economic Perspectives&lt;/i&gt;): with free capital mobility, soft pegs are crisis-prone and countries move towards hard pegs or flexible exchange rates. &lt;span class=&quot;why&quot;&gt;Why it matters: it is the debate on &quot;polarization&quot; in slide 20.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/np/speeches/2001/010601a.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF — text of the speech&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Borio, McCauley, McGuire, Sushko — &quot;Covered interest parity lost&quot; (BIS, 2016)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;BIS Quarterly Review&lt;/i&gt;, September 2016: deviations from CIP after the financial crisis (the cross-currency basis), linked to hedging demand and balance-sheet costs. &lt;span class=&quot;why&quot;&gt;Why it matters: it shows the limits of the perfect-arbitrage assumption in slide 14.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/h/bis/bisbpc/96-08.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc — record&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;

  /* active table of contents */
  var links=document.querySelectorAll(&#x27;#toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)})}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}
  function pct(x,d){return (x*100).toFixed(d===undefined?1:d)+&#x27;%&#x27;}

  /* UIP calculator */
  function uip(){
    var rs=+$(&#x27;u-rs&#x27;).value/100, e=+$(&#x27;u-e&#x27;).value, ee=+$(&#x27;u-ee&#x27;).value;
