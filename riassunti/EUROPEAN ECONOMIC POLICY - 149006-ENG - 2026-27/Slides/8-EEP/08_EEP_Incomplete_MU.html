&lt;!-- ============ 1 ============ --&gt;
&lt;section id=&quot;definizione&quot; class=&quot;part sage&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Che cos&#x27;è una incomplete monetary union&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 1–2, 22&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Una &lt;em class=&quot;t&quot;&gt;incomplete monetary union&lt;/em&gt; (unione monetaria incompleta) è un assetto in cui più paesi legano le loro monete — o ne adottano una sola — &lt;b&gt;senza&lt;/b&gt; mettere in comune tutti gli strumenti che rendono una moneta solida: un bilancio comune, una banca centrale che fa da garante ultimo, oppure la rinuncia definitiva alla possibilità di cambiare il tasso. La definizione delle slide comprende due tipi &lt;i&gt;molto diversi ma con problemi simili&lt;/i&gt;.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Tipo 1 · MU senza fiscal union&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Tipo 2 · Cambi fissi&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary Union without fiscal union.&lt;/b&gt; C&#x27;è una moneta unica e una banca centrale unica, ma la politica di bilancio (tasse, spesa, debito pubblico) resta nazionale: non c&#x27;è una &lt;em class=&quot;t&quot;&gt;fiscal union&lt;/em&gt;, cioè un bilancio federale capace di trasferire risorse tra regioni e di emettere debito comune.&lt;/div&gt;
      &lt;p&gt;Secondo le slide, &lt;b&gt;forse l&#x27;unico esempio è la EMU&lt;/b&gt; (&lt;i&gt;Economic and Monetary Union&lt;/i&gt;, l&#x27;Unione economica e monetaria europea, cioè l&#x27;Eurozona). Ogni Stato emette debito in euro, una moneta che &lt;i&gt;non controlla&lt;/i&gt;: è proprio questo il punto del &quot;parallelo&quot; su cui si chiude la lezione (sezione 6).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Exchange rate arrangements.&lt;/b&gt; Accordi con cui le autorità &lt;i&gt;fissano&lt;/i&gt; il tasso di cambio della propria moneta rispetto a un&#x27;altra (o a un paniere), impegnandosi a difenderlo.&lt;/div&gt;
      &lt;p&gt;Esempi storici dalle slide: &lt;b&gt;Bretton Woods&lt;/b&gt;, l&#x27;&lt;b&gt;EMS&lt;/b&gt; (&lt;i&gt;European Monetary System&lt;/i&gt;, Sistema monetario europeo) e l&#x27;aggancio di una valuta a un&#x27;altra, come il &lt;b&gt;peso argentino al dollaro tra il 1991 e il 2001&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;Gli accordi di cambio &lt;b&gt;sono di solito fragili ed entrano in crisi prima o poi&lt;/b&gt;: la promessa delle autorità di mantenere il cambio fisso, a un certo punto, viene rinnegata (&lt;i&gt;reneged&lt;/i&gt;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;t&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Cambio fisso (tipo 2)&lt;/th&gt;&lt;th&gt;Eurozona (tipo 1)&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Monete&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Restano nazionali, legate da una parità&lt;/td&gt;&lt;td&gt;Una sola moneta&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Promessa&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Convertire la moneta nazionale alla parità annunciata&lt;/td&gt;&lt;td&gt;Rimborsare il debito pubblico (in euro)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Liquidità che può mancare&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Riserve in valuta estera&lt;/td&gt;&lt;td&gt;Liquidità nella moneta &quot;nazionale&quot; (l&#x27;euro, che lo Stato non stampa)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Esito della crisi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Devaluation (svalutazione)&lt;/td&gt;&lt;td&gt;Default (insolvenza)&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;Sintesi costruita a partire dalla slide 22 (Conclusions).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;

    &lt;/g&gt;

  &lt;figcaption&gt;Le date dei sistemi sono un &lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; (vedi &quot;Per approfondire&quot;); le slide citano solo Argentina 1991–2001 e i controlli sui capitali in Europa fino al 1991.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Complemento · come si difende un cambio fisso, in pratica&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; Se la banca centrale annuncia &quot;1 unità di moneta nazionale = x dollari&quot;, deve essere pronta a scambiare a quel prezzo con chiunque. Quando molti vogliono &lt;b&gt;vendere&lt;/b&gt; moneta nazionale, la banca centrale la &lt;b&gt;compra&lt;/b&gt; pagando con le sue &lt;em class=&quot;t&quot;&gt;foreign exchange reserves&lt;/em&gt; (riserve valutarie: dollari, euro, oro…). Le riserve calano. Se finiscono, la parità non si può più difendere e arriva la &lt;em class=&quot;t&quot;&gt;devaluation&lt;/em&gt; (svalutazione: la moneta nazionale vale ufficialmente meno valuta estera).&lt;/p&gt;
    &lt;p&gt;Comprare moneta nazionale con riserve riduce anche la quantità di moneta in circolazione: è una stretta monetaria automatica, che si somma all&#x27;aumento dei tassi descritto nella sezione 3.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i due tipi di incomplete monetary union?&lt;/summary&gt;&lt;div&gt;(1) &lt;strong&gt;Monetary union senza fiscal union&lt;/strong&gt; (esempio: EMU); (2) &lt;strong&gt;accordi di cambio fisso&lt;/strong&gt; (Bretton Woods, EMS, peso argentino agganciato al dollaro 1991–2001).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché, secondo le slide, gli accordi di cambio &quot;entrano in crisi prima o poi&quot;?&lt;/summary&gt;&lt;div&gt;Perché si reggono su una &lt;strong&gt;promessa&lt;/strong&gt; delle autorità che a un certo punto può diventare troppo costosa da mantenere ed essere &lt;strong&gt;rinnegata&lt;/strong&gt;; i mercati lo sanno e lo anticipano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa manca alla EMU per essere un&#x27;unione &quot;completa&quot;?&lt;/summary&gt;&lt;div&gt;Una &lt;strong&gt;fiscal union&lt;/strong&gt;: bilancio comune, trasferimenti e debito comune. Gli Stati emettono debito in una moneta che non controllano.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section id=&quot;fragilita&quot; class=&quot;part ochre&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Da dove viene la fragilità: credibility e liquidity&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 3–6&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide individuano &lt;b&gt;due problemi&lt;/b&gt;, che presi da soli sono gestibili ma che insieme si rinforzano a vicenda.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h3 style=&quot;margin-top:.2em&quot;&gt;Credibility &lt;span class=&quot;pill&quot;&gt;credibilità&lt;/span&gt;&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Annunciare un cambio fisso significa fare una &lt;b&gt;promessa per il futuro&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Come per ogni promessa, il dubbio è se potrà essere mantenuta.&lt;/li&gt;
        &lt;li&gt;Le circostanze possono cambiare e rendere la promessa &lt;b&gt;incompatibile con il benessere del paese&lt;/b&gt; (ad esempio con disoccupazione alta).&lt;/li&gt;
        &lt;li&gt;Allora le autorità hanno un &lt;b&gt;incentivo a rinnegarla&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;I privati lo sospettano e &lt;b&gt;attaccano la moneta&lt;/b&gt; → nasce una &lt;em class=&quot;t&quot;&gt;speculative crisis&lt;/em&gt; (crisi speculativa).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h3 style=&quot;margin-top:.2em&quot;&gt;Liquidity &lt;span class=&quot;pill&quot;&gt;liquidità&lt;/span&gt;&lt;/h3&gt;
      &lt;ul class=&quot;clean&quot;&gt;
        &lt;li&gt;Le &lt;b&gt;riserve valutarie ufficiali&lt;/b&gt; di un paese sono &lt;b&gt;limitate&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;La difesa del cambio fisso, cioè la promessa di convertire moneta nazionale in valuta estera alla parità, &lt;b&gt;può non essere garantita&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Gli investitori lo sanno e &lt;b&gt;si preoccupano quando le riserve si assottigliano&lt;/b&gt;.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;src&quot;&gt;In un&#x27;unione monetaria come l&#x27;Eurozona la &quot;liquidità&quot; che può mancare è quella nella moneta in cui è emesso il debito (slide 22).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il circolo vizioso: credibility e liquidity interagiscono&lt;/h3&gt;
  &lt;p&gt;Scorri i passi (slide 6). Ogni passo accende il nodo corrispondente del ciclo.&lt;/p&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper id=&quot;circ&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 330&quot; role=&quot;img&quot; aria-label=&quot;Ciclo tra riserve, credibilità, vendite e interventi&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;&gt;
          &lt;path d=&quot;M235 62 Q300 90 300 135&quot;/&gt;&lt;path d=&quot;M300 200 Q300 250 235 272&quot;/&gt;&lt;path d=&quot;M125 272 Q60 250 60 200&quot;/&gt;&lt;path d=&quot;M60 135 Q60 90 125 62&quot;/&gt;
        &lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;1&quot;&gt;&lt;rect x=&quot;105&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Riserve limitate&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;liquidity&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;2&quot;&gt;&lt;rect x=&quot;215&quot; y=&quot;140&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;285&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Credibilità ↓&lt;/text&gt;&lt;text x=&quot;285&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;attese di svalutazione&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;3&quot;&gt;&lt;rect x=&quot;105&quot; y=&quot;256&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Vendite di moneta&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;fuga di capitali&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;cn&quot; data-n=&quot;4&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;140&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;BC vende valuta&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;riserve ↓ ancora&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;180&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;si avvita&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 1&lt;/span&gt;&lt;p&gt;Uno &lt;b&gt;stock limitato di riserve valutarie riduce la credibilità&lt;/b&gt;: tutti sanno che la banca centrale può difendere la parità solo fino a esaurimento scorte.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 2&lt;/span&gt;&lt;p&gt;La &lt;b&gt;credibilità ridotta induce gli investitori a vendere la moneta nazionale&lt;/b&gt;: se ci si aspetta una svalutazione, conviene uscire prima che accada (chi resta perde).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 3&lt;/span&gt;&lt;p&gt;La banca centrale è &lt;b&gt;costretta a vendere valuta estera&lt;/b&gt; per tenere il cambio al livello annunciato: compra la moneta nazionale che tutti vendono.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 4&lt;/span&gt;&lt;p&gt;Così le &lt;b&gt;riserve si riducono ulteriormente&lt;/b&gt;…&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 5 · e il ciclo riparte&lt;/span&gt;&lt;p&gt;…e la &lt;b&gt;credibilità si riduce ancora di più&lt;/b&gt;. Il meccanismo si autoalimenta: è questa la radice della &lt;i&gt;intrinsic fragility&lt;/i&gt; delle unioni monetarie incomplete.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

    #circ .cn rect{fill:var(--card);stroke:var(--rule);stroke-width:1.5;transition:all .3s}
    #circ[data-step=&quot;1&quot;] .cn[data-n=&quot;1&quot;] rect,#circ[data-step=&quot;2&quot;] .cn[data-n=&quot;2&quot;] rect,#circ[data-step=&quot;3&quot;] .cn[data-n=&quot;3&quot;] rect,#circ[data-step=&quot;4&quot;] .cn[data-n=&quot;4&quot;] rect,#circ[data-step=&quot;5&quot;] .cn[data-n=&quot;1&quot;] rect,#circ[data-step=&quot;5&quot;] .cn[data-n=&quot;2&quot;] rect{fill:var(--ochre-bg);stroke:var(--ochre);stroke-width:3}
  &lt;/style&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché un paese con riserve molto ampie è meno esposto agli attacchi?&lt;/summary&gt;&lt;div&gt;Perché la promessa di convertire alla parità è più &lt;strong&gt;credibile&lt;/strong&gt;: gli investitori non temono che la banca centrale resti senza munizioni, quindi non hanno motivo di vendere in anticipo. Liquidità e credibilità si sostengono a vicenda.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Descrivi il circolo vizioso in quattro frecce.&lt;/summary&gt;&lt;div&gt;Riserve limitate → credibilità ↓ → vendite di moneta nazionale → la BC vende riserve per difendere il cambio → riserve ↓ → credibilità ↓ ancora.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le autorità possono avere un incentivo a rinnegare la promessa anche se hanno riserve. Perché?&lt;/summary&gt;&lt;div&gt;Perché le circostanze (uno shock, disoccupazione) possono rendere la parità &lt;strong&gt;incompatibile con il benessere del paese&lt;/strong&gt;: mantenerla costa più che abbandonarla. È il problema di credibility &quot;puro&quot;, che il modello della sezione 4 formalizza.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section id=&quot;parita&quot; class=&quot;part slate&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Interest rate parity&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 7–15&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Per capire &lt;i&gt;come&lt;/i&gt; i mercati puniscono una promessa poco credibile serve la &lt;em class=&quot;t&quot;&gt;interest rate parity&lt;/em&gt; (parità dei tassi d&#x27;interesse). L&#x27;idea, in una riga:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;tasso interno = tasso estero + &lt;span class=&quot;hl&quot;&gt;attese di svalutazione&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;La &lt;em class=&quot;t&quot;&gt;uncovered interest rate parity&lt;/em&gt; (UIP, parità scoperta: senza copertura dal rischio di cambio) rende l&#x27;equilibrio dei movimenti di capitale &lt;b&gt;molto vulnerabile&lt;/b&gt; e può condizionare pesantemente la politica monetaria: per evitare fughe di capitali quando le attese di svalutazione sono alte, la banca centrale è &lt;b&gt;costretta ad alzare i tassi a livelli molto elevati&lt;/b&gt; (slide 7).&lt;/p&gt;

  &lt;h3&gt;L&#x27;esempio delle slide, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Dati&lt;/span&gt;&lt;p&gt;Hai &lt;b&gt;2000 €&lt;/b&gt; da investire in obbligazioni identiche, una denominata in euro e una in dollari. Tassi: &lt;b&gt;i&lt;sub&gt;€&lt;/sub&gt; = i&lt;sub&gt;$&lt;/sub&gt; = 5%&lt;/b&gt;. Tasso di cambio &lt;b&gt;E = 1,2 $/€&lt;/b&gt; (1 euro compra 1,2 dollari). C&#x27;è differenza nel guadagno atteso?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Investo in euro&lt;/span&gt;&lt;div class=&quot;formula&quot;&gt;2000 × 1,05 = &lt;span class=&quot;hl&quot;&gt;2100 €&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Investo in dollari&lt;/span&gt;&lt;p&gt;Converto: 2000 × 1,2 = 2400 $. Dopo un anno: 2400 × 1,05 = 2520 $. Riconverto al cambio di oggi:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;2520 / 1,2 = &lt;span class=&quot;hl&quot;&gt;2100 €&lt;/span&gt;&lt;/div&gt;&lt;p&gt;→ &lt;b&gt;Nessuna differenza.&lt;/b&gt; Ma quale ipotesi implicita abbiamo fatto?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;L&#x27;ipotesi nascosta&lt;/span&gt;&lt;p&gt;Abbiamo supposto che &lt;b&gt;il cambio resti 1,2 anche fra un anno&lt;/b&gt;. Supponiamo invece che diventi &lt;b&gt;E&lt;sub&gt;t+1&lt;/sub&gt; = 1&lt;/b&gt;: un euro comprerà solo 1 dollaro, cioè &lt;b&gt;l&#x27;euro si deprezza&lt;/b&gt;.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;2520 $ / 1 = &lt;span class=&quot;hl&quot;&gt;2520 €&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Guadagno extra rispetto all&#x27;euro: (2520 − 2100)/2100 = &lt;b&gt;20%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Quanto deve salire il tasso sull&#x27;euro?&lt;/span&gt;&lt;p&gt;Perché l&#x27;obbligazione in euro renda quanto quella in dollari, il suo tasso deve salire di circa 20 punti. Il calcolo esatto delle slide:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;2000 × (1 + 0,05 + &lt;span class=&quot;hl&quot;&gt;0,21&lt;/span&gt;) = 2520&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Nota: l&#x27;aumento esatto è di &lt;b&gt;21 punti&lt;/b&gt; (tasso in euro al 26%); &quot;circa 20%&quot; è l&#x27;approssimazione lineare. La differenza nasce dal termine &lt;i&gt;Ė·r&lt;/i&gt; trascurato nella derivazione qui sotto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La regola generale e la no arbitrage condition&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Su ogni € investito in bond in euro&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;(1 + r)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Su ogni € investito in bond in dollari (in €)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;(1 + r*)&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;E in $/€: converto a E&lt;sub&gt;t&lt;/sub&gt;, incasso r*, riconverto a E&lt;sub&gt;t+1&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;No arbitrage condition.&lt;/b&gt; I due rendimenti devono essere uguali: assenza di arbitraggio significa che non si può guadagnare comprando e vendendo &lt;i&gt;lo stesso&lt;/i&gt; titolo su mercati diversi. Se un rendimento fosse più alto, tutti sposterebbero i capitali lì finché la differenza non sparisce.&lt;/div&gt;

  &lt;h4&gt;Derivazione (slide 12)&lt;/h4&gt;
  &lt;div class=&quot;card stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step on&quot;&gt;&lt;p&gt;Uguagliando i rendimenti (con il cambio futuro &lt;i&gt;atteso&lt;/i&gt;, E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;):&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Aggiungo e tolgo 1 dentro la parentesi (un trucco che non cambia nulla):&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;(&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; − 1 + 1)(1 + r) = (1 + r*)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Riscrivo il rapporto come variazione percentuale attesa del cambio:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;(&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; − E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; + 1)(1 + r) = (1 + r*)&lt;/div&gt;&lt;p&gt;Chiamo &lt;b&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/b&gt; = (E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; − E&lt;sub&gt;t&lt;/sub&gt;)/E&lt;sub&gt;t&lt;/sub&gt; il tasso di variazione atteso del cambio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Moltiplico:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; + Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;·r + 1 + r = 1 + r*&lt;/div&gt;&lt;p&gt;Il prodotto di due numeri piccoli (es. 0,02 × 0,05 = 0,001) è trascurabile: pongo &lt;b&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;·r ≈ 0&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;Risultato:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;hl&quot;&gt;Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; = r* − r&lt;/span&gt; &amp;nbsp;⇔&amp;nbsp; r = r* − Ė&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;Con E in $/€, un deprezzamento atteso dell&#x27;euro è Ė&lt;sup&gt;e&lt;/sup&gt; &amp;lt; 0: il tasso interno deve superare quello estero &lt;b&gt;esattamente della svalutazione attesa&lt;/b&gt;. Nell&#x27;esempio Ė = (1 − 1,2)/1,2 ≈ −16,7%, quindi r ≈ 5% + 16,7% ≈ 21,7% con la formula approssimata, 26% con quella esatta. L&#x27;approssimazione funziona bene solo per variazioni piccole.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Prova tu: quanto costa difendere la moneta?&lt;/h3&gt;
  &lt;p&gt;Muovi i cursori: scegli il tasso estero e il cambio che i mercati si aspettano fra un anno. Il grafico mostra il tasso interno che la banca centrale deve offrire per non perdere capitali.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;uip&quot;&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-rs&quot;&gt;Tasso estero r*&lt;/label&gt;&lt;input id=&quot;u-rs&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;u-rs-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-e&quot;&gt;Cambio oggi E&lt;sub&gt;t&lt;/sub&gt; ($/€)&lt;/label&gt;&lt;input id=&quot;u-e&quot; type=&quot;range&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.2&quot;&gt;&lt;output id=&quot;u-e-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;slider&quot;&gt;&lt;label for=&quot;u-ee&quot;&gt;Cambio atteso E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt; ($/€)&lt;/label&gt;&lt;input id=&quot;u-ee&quot; type=&quot;range&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.2&quot;&gt;&lt;output id=&quot;u-ee-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot;&gt;
      &lt;div&gt;&lt;small&gt;Variazione attesa Ė&lt;sup&gt;e&lt;/sup&gt;&lt;/small&gt;&lt;b id=&quot;u-d&quot;&gt;0%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;r richiesto (approssimato)&lt;/small&gt;&lt;b id=&quot;u-ra&quot;&gt;5%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;r richiesto (esatto)&lt;/small&gt;&lt;b id=&quot;u-rx&quot;&gt;5%&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;&lt;small&gt;Spread r − r*&lt;/small&gt;&lt;b id=&quot;u-sp&quot;&gt;0 bp&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Barre del tasso estero e del tasso interno richiesto&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;36&quot; font-size=&quot;13&quot;&gt;r* estero&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;86&quot; font-size=&quot;13&quot;&gt;r interno esatto&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;132&quot; font-size=&quot;13&quot;&gt;r approssimato&lt;/text&gt;
      &lt;rect x=&quot;130&quot; y=&quot;22&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b1&quot; fill=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;130&quot; y=&quot;72&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b2&quot; fill=&quot;var(--slate)&quot;/&gt;
      &lt;rect x=&quot;130&quot; y=&quot;118&quot; height=&quot;20&quot; rx=&quot;4&quot; id=&quot;u-b3&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;text id=&quot;u-t1&quot; y=&quot;37&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;text id=&quot;u-t2&quot; y=&quot;87&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;&lt;text id=&quot;u-t3&quot; y=&quot;133&quot; font-size=&quot;12&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;u-v&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Quando vale, e perché fa male&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;La parità vale per…&lt;/h4&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;b&gt;titoli uguali&lt;/b&gt; (stesso rischio, stessa scadenza): cambia solo la valuta;&lt;/li&gt;&lt;li&gt;&lt;b&gt;libera circolazione dei capitali&lt;/b&gt;: altrimenti l&#x27;arbitraggio non può avvenire.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;…e il suo prezzo&lt;/h4&gt;&lt;p&gt;La parità dei tassi &lt;b&gt;può rendere molto costoso evitare le fughe di capitali&lt;/b&gt; (slide 13): tassi altissimi colpiscono debito pubblico, investimenti e domanda interna. È il ponte verso il modello della sezione 4.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Uncovered (UIP)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Covered (CIP)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sup&gt;e&lt;/sup&gt;&lt;sub&gt;t+1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;
      &lt;p&gt;È &quot;il nostro esempio&quot;: l&#x27;investitore &lt;b&gt;non si copre&lt;/b&gt; e sopporta il rischio di cambio; conta il cambio &lt;i&gt;atteso&lt;/i&gt;, che nessuno osserva direttamente. È qui che entrano le aspettative, quindi la credibilità.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;F&lt;/span&gt;&lt;span&gt;S&lt;/span&gt;&lt;/span&gt;(1 + r) = (1 + r*)&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;F&lt;/b&gt; = &lt;em class=&quot;t&quot;&gt;forward exchange rate&lt;/em&gt; (cambio a termine, fissato oggi per uno scambio futuro); &lt;b&gt;S&lt;/b&gt; = &lt;em class=&quot;t&quot;&gt;spot exchange rate&lt;/em&gt; (cambio a pronti, di oggi). La no arbitrage condition è soddisfatta usando un &lt;b&gt;contratto forward&lt;/b&gt; che copre l&#x27;investitore dal rischio di cambio: tutti i termini sono noti oggi.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Dopo la crisi del 2008 anche la CIP, ritenuta quasi una legge di natura, ha mostrato deviazioni persistenti (il &quot;cross-currency basis&quot;), legate ai costi di bilancio delle banche e alla domanda di copertura: &lt;a href=&quot;https://ideas.repec.org/h/bis/bisbpc/96-08.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Borio, McCauley, McGuire, Sushko — BIS Quarterly Review, set. 2016&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un caso reale: lo spread Italia–Germania (slide 15)&lt;/h3&gt;
  &lt;p&gt;Lo &lt;em class=&quot;t&quot;&gt;yield spread&lt;/em&gt; è la differenza tra i rendimenti dei titoli decennali dei due paesi, in &lt;em class=&quot;t&quot;&gt;basis points&lt;/em&gt; (punti base: 100 bp = 1 punto percentuale).&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 620 260&quot; role=&quot;img&quot; aria-label=&quot;Spread decennale Italia-Germania: 444, 81, 29, 17 punti base&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;220&quot; x2=&quot;600&quot; y2=&quot;220&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;g font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;52&quot; y=&quot;224&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;124&quot;&gt;250&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;24&quot;&gt;500&lt;/text&gt;&lt;/g&gt;
    &lt;g stroke=&quot;var(--rule)&quot; stroke-dasharray=&quot;2 4&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;120&quot; x2=&quot;600&quot; y2=&quot;120&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;600&quot; y2=&quot;20&quot;/&gt;&lt;/g&gt;
    &lt;rect x=&quot;90&quot; y=&quot;42.4&quot; width=&quot;90&quot; height=&quot;177.6&quot; rx=&quot;4&quot; fill=&quot;var(--slate)&quot;/&gt;
    &lt;rect x=&quot;220&quot; y=&quot;187.6&quot; width=&quot;90&quot; height=&quot;32.4&quot; rx=&quot;4&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;rect x=&quot;350&quot; y=&quot;208.4&quot; width=&quot;90&quot; height=&quot;11.6&quot; rx=&quot;4&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
    &lt;rect x=&quot;480&quot; y=&quot;213.2&quot; width=&quot;90&quot; height=&quot;6.8&quot; rx=&quot;4&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;

    &lt;path d=&quot;M185 110 Q215 110 220 175&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;100&quot; font-size=&quot;11&quot; fill=&quot;var(--brick)&quot;&gt;≈ 363 bp di rischio di cambio&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dati dalla slide 15. Interpretazione: &lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Come leggere la tabella con la interest rate parity&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; Nel marzo 1996 lo Stato italiano emetteva titoli sia in lire sia in marchi tedeschi. Confrontare i due spread nello stesso mese isola le componenti:&lt;/p&gt;
    &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;Spread in lire &lt;b&gt;444&lt;/b&gt;&lt;/span&gt;=&lt;span&gt;rischio di cambio / attese di svalutazione della lira &lt;b&gt;≈ 363&lt;/b&gt;&lt;/span&gt;+&lt;span&gt;rischio di credito Italia &lt;b&gt;≈ 81&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Il titolo in marchi non ha rischio di cambio per chi ragiona in marchi: i suoi 81 bp misurano solo la sfiducia nel debitore. La parte restante è la svalutazione attesa della lira, proprio il termine Ė&lt;sup&gt;e&lt;/sup&gt; della parità. Con l&#x27;euro (1999, 2004) il rischio di cambio sparisce e lo spread crolla a 29 e poi a 17 bp. La storia successiva (crisi dei debiti sovrani dal 2010) mostrerà che il rischio di &lt;i&gt;default&lt;/i&gt; può però riaprire lo spread anche dentro la moneta unica: è il &quot;parallelo&quot; della sezione 6.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;r* = 3%, i mercati si aspettano che la moneta nazionale perda il 10% nell&#x27;anno. Che tasso deve offrire la banca centrale?&lt;/summary&gt;&lt;div&gt;Con la formula approssimata &lt;strong&gt;r ≈ 3% + 10% = 13%&lt;/strong&gt;. Ogni punto di svalutazione attesa si traduce in un punto di tasso in più.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual era l&#x27;ipotesi implicita nel primo calcolo (2100 € = 2100 €)?&lt;/summary&gt;&lt;div&gt;Che il &lt;strong&gt;tasso di cambio futuro fosse uguale a quello di oggi&lt;/strong&gt; (nessuna variazione attesa).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Differenza tra UIP e CIP?&lt;/summary&gt;&lt;div&gt;Nella UIP l&#x27;investitore resta esposto al rischio di cambio e conta il cambio &lt;strong&gt;atteso&lt;/strong&gt;; nella CIP si copre con un &lt;strong&gt;forward&lt;/strong&gt; e conta il cambio a termine F, noto oggi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché lo spread Italia–Germania in lire (444) è molto più alto di quello in marchi (81)?&lt;/summary&gt;&lt;div&gt;Perché include le &lt;strong&gt;attese di svalutazione della lira&lt;/strong&gt; (circa 363 bp), oltre al rischio di credito.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A quali condizioni vale la interest rate parity?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Titoli identici&lt;/strong&gt; e &lt;strong&gt;libera circolazione dei capitali&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section id=&quot;modello&quot; class=&quot;part brick&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Il modello costi-benefici della svalutazione&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 16–19&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Tornati alla credibilità degli accordi di cambio, le slide la analizzano con un &quot;modello noto&quot;: le autorità decidono se mantenere la parità o svalutare confrontando &lt;b&gt;costi&lt;/b&gt; e &lt;b&gt;benefici&lt;/b&gt;. È lo stesso schema che il manuale di De Grauwe usa per le unioni monetarie incomplete (vedi &quot;Per approfondire&quot;).&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Benefit B&lt;sub&gt;U&lt;/sub&gt; (U = unanticipated).&lt;/b&gt; Il beneficio, o la &lt;i&gt;tentazione&lt;/i&gt;, di svalutare quando i mercati &lt;b&gt;non&lt;/b&gt; se lo aspettano. &lt;b&gt;Cresce con l&#x27;ampiezza dello shock&lt;/b&gt; di bilancia dei pagamenti: più grave la crisi (calo di export, disoccupazione), più conviene recuperare competitività svalutando. La curva è convessa: per shock grandi la tentazione esplode.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost C.&lt;/b&gt; Il costo di rinnegare la promessa, rappresentato come una retta orizzontale (indipendente dallo shock). &lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; Comprende tipicamente la perdita di reputazione e credibilità futura, l&#x27;inflazione importata, le sanzioni politiche o istituzionali.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Shock.&lt;/b&gt; Un evento negativo che colpisce la bilancia dei pagamenti (il conto degli scambi del paese con l&#x27;estero). Se coinvolge un solo paese dell&#x27;accordo è un &lt;em class=&quot;t&quot;&gt;asymmetric shock&lt;/em&gt; (shock asimmetrico): proprio il caso in cui un cambio fisso, o la moneta unica, &quot;stringe&quot; di più.&lt;/div&gt;

  &lt;h3&gt;Il ruolo delle aspettative dei mercati (slide 18)&lt;/h3&gt;
  &lt;div class=&quot;flow&quot;&gt;&lt;span&gt;Gli investitori &lt;b&gt;si aspettano&lt;/b&gt; una svalutazione&lt;/span&gt;→&lt;span&gt;vendono moneta e titoli nazionali&lt;/span&gt;→&lt;span&gt;per la &lt;b&gt;interest rate parity&lt;/b&gt; il tasso deve salire&lt;/span&gt;→&lt;span&gt;più costo del debito pubblico, meno investimenti: &lt;b&gt;stretta sulla domanda interna&lt;/b&gt;&lt;/span&gt;→&lt;span&gt;svalutare diventa &lt;b&gt;più attraente&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Quindi, &lt;b&gt;per ogni shock, il beneficio della svalutazione è più alto&lt;/b&gt; se questa è anticipata: la curva &lt;b&gt;B&lt;sub&gt;E&lt;/sub&gt;&lt;/b&gt; (E = expected) sta sopra e a sinistra di B&lt;sub&gt;U&lt;/sub&gt;.&lt;/p&gt;

  &lt;h3&gt;Esplora il grafico&lt;/h3&gt;
  &lt;p&gt;Sposta lo shock e osserva in quale delle tre zone cadi. Poi cambia le aspettative dei mercati: nella zona centrale decidono loro l&#x27;esito.&lt;/p&gt;

  &lt;h3&gt;Le tre zone, in sintesi&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;h4&gt;Shock &amp;lt; S₁&lt;/h4&gt;&lt;p&gt;Anche se i mercati si aspettassero la svalutazione, B&lt;sub&gt;E&lt;/sub&gt; &amp;lt; C: le autorità mantengono la parità. Un attacco sarebbe destinato a fallire, quindi non parte. &lt;b&gt;Cambio credibile.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--ochre-bg);border:0&quot;&gt;&lt;h4&gt;S₁ &amp;lt; shock &amp;lt; S₂&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Equilibri multipli&lt;/b&gt; (lungo la linea verde delle slide). Se i mercati si aspettano la svalutazione si va in &lt;b&gt;D&lt;/b&gt; (B&lt;sub&gt;E&lt;/sub&gt; &amp;gt; C → si svaluta); se non se l&#x27;aspettano si resta in &lt;b&gt;N&lt;/b&gt; (B&lt;sub&gt;U&lt;/sub&gt; &amp;lt; C → si mantiene). Le aspettative si autorealizzano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;h4&gt;Shock &amp;gt; S₂&lt;/h4&gt;&lt;p&gt;Perfino senza aspettative B&lt;sub&gt;U&lt;/sub&gt; &amp;gt; C: la svalutazione conviene comunque. I mercati lo capiscono e attaccano: &lt;b&gt;crisi inevitabile&lt;/b&gt;, dovuta ai fondamentali.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-fulfilling expectations&lt;/b&gt; (aspettative che si autorealizzano). Nella zona intermedia la crisi non è &quot;colpa&quot; dei fondamentali né un errore dei mercati: &lt;i&gt;se&lt;/i&gt; tutti si aspettano la svalutazione, il loro comportamento (vendite, tassi in salita) la rende ottimale per il governo, e l&#x27;aspettativa risulta corretta a posteriori. Se nessuno se l&#x27;aspetta, la parità regge. Lo stesso paese, con lo stesso shock, può finire in due equilibri diversi.&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Attenzione al titolo della slide 19.&lt;/strong&gt; Dice &quot;Cost and benefit of &lt;i&gt;default&lt;/i&gt;&quot;, ma il grafico parla di &lt;i&gt;devaluation&lt;/i&gt;. Non è (solo) un refuso: è esattamente il parallelo della lezione. Sostituendo &quot;svalutazione&quot; con &quot;default&quot; e &quot;riserve valutarie&quot; con &quot;liquidità in euro&quot;, il grafico descrive un paese dell&#x27;Eurozona (sezione 6).&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché B&lt;sub&gt;E&lt;/sub&gt; sta sopra B&lt;sub&gt;U&lt;/sub&gt;?&lt;/summary&gt;&lt;div&gt;Perché se la svalutazione è attesa i capitali escono, i tassi salgono (interest rate parity), costo del debito e stretta sulla domanda aumentano: &lt;strong&gt;mantenere la parità costa di più&lt;/strong&gt;, quindi svalutare rende di più per ogni shock.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa succede tra S₁ e S₂?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Equilibri multipli&lt;/strong&gt;: l&#x27;esito (D o N) dipende solo dalle aspettative dei mercati, che si autorealizzano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se C aumenta (la retta sale), che cosa succede a S₁ e S₂?&lt;/summary&gt;&lt;div&gt;Si spostano entrambi &lt;strong&gt;a destra&lt;/strong&gt;: servono shock più grandi per arrivare alla svalutazione. Per questo uno dei rimedi è &lt;strong&gt;alzare il costo del rinnegare l&#x27;impegno&lt;/strong&gt; (sezione 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se le aspettative contano meno (B&lt;sub&gt;E&lt;/sub&gt; si avvicina a B&lt;sub&gt;U&lt;/sub&gt;), cosa succede alla zona degli equilibri multipli?&lt;/summary&gt;&lt;div&gt;Si &lt;strong&gt;restringe&lt;/strong&gt;: S₁ si avvicina a S₂. Meno peso hanno i mercati, meno spazio c&#x27;è per crisi che si autorealizzano.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section id=&quot;rimedi&quot; class=&quot;part sage&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Come affrontare la fragilità&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 20–21&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide propongono prima di &lt;b&gt;eliminare alla radice&lt;/b&gt; il problema dei cambi fissi, poi alcune alternative intermedie. Apri le schede.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
