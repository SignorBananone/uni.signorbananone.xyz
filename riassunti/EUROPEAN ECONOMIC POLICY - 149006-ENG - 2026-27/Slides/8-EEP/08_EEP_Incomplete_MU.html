    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;circle cx=&quot;70&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Monetary union&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;108&quot;&gt;nessun cambio&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;124&quot; fill=&quot;var(--soft)&quot;&gt;(EMS → EMU)&lt;/text&gt;
      &lt;circle cx=&quot;250&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Currency board&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;108&quot;&gt;parità &quot;costituzionale&quot;&lt;/text&gt;
      &lt;circle cx=&quot;450&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Cambio fisso aggiustabile&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;108&quot;&gt;EMS, Bretton Woods&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;124&quot; fill=&quot;var(--brick)&quot;&gt;zona fragile&lt;/text&gt;
      &lt;circle cx=&quot;830&quot; cy=&quot;67&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;830&quot; y=&quot;36&quot; font-weight=&quot;600&quot;&gt;Flexible&lt;/text&gt;&lt;text x=&quot;830&quot; y=&quot;108&quot;&gt;cambio libero&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;70&quot; y=&quot;146&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;← &quot;corner&quot; fisso&lt;/text&gt;&lt;text x=&quot;830&quot; y=&quot;146&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;end&quot;&gt;&quot;corner&quot; flessibile →&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Lo schema a spettro è un &lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; per ordinare le opzioni delle slide.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Eliminare la radice del problema&lt;/h3&gt;
  &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Andare verso una monetary union (nessun tasso di cambio)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se il cambio non esiste, non c&#x27;è nessuna parità da attaccare. È la logica della decisione europea di passare &lt;b&gt;dall&#x27;EMS all&#x27;EMU&lt;/b&gt; dopo le crisi dei primi anni &#x27;90. Il prezzo: il problema di credibilità si sposta dalla parità al &lt;b&gt;rimborso del debito&lt;/b&gt; (sezione 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Lasciar fluttuare il cambio (flexible exchange rates)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se non si promette alcuna parità, non c&#x27;è promessa da rinnegare: lo shock si scarica sul cambio invece che sulle riserve e sui tassi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Polarizzazione.&lt;/b&gt; Però la scelta &quot;o completamente fisso o completamente flessibile&quot; (&lt;em class=&quot;t&quot;&gt;polarization&lt;/em&gt;, detta anche &lt;i&gt;corner solutions&lt;/i&gt; o &lt;i&gt;bipolar view&lt;/i&gt;) &lt;b&gt;non gode di un consenso generalizzato&lt;/b&gt;.&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; La &quot;bipolar view&quot; è associata a Stanley Fischer (FMI): con capitali liberi i regimi intermedi (soft pegs) sono soggetti a crisi e i paesi tendono verso gli estremi. &lt;a href=&quot;https://www.imf.org/external/np/speeches/2001/010601a.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fischer, &quot;Exchange Rate Regimes: Is the Bipolar View Correct?&quot;, 2001&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Altre alternative&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Controlli sui capitali&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Alzare il costo del reneging&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Currency board&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Capital controls&lt;/em&gt; (controlli sui movimenti di capitale): limiti legali all&#x27;acquisto di attività estere. Se i capitali non possono uscire, la interest rate parity non vale (manca una delle sue condizioni) e l&#x27;attacco è più difficile.&lt;/p&gt;
      &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;In Europa &lt;b&gt;fino al 1991&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;in alcuni paesi europei &lt;b&gt;temporaneamente dopo il collasso dell&#x27;EMS&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;in &lt;b&gt;Cina&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
      &lt;p&gt;&lt;b&gt;Ma&lt;/b&gt;: l&#x27;integrazione finanziaria e commerciale richiede la libertà dei capitali. Il rimedio è in contrasto con il mercato unico.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; La direttiva 88/361/CEE ha reso piena la libertà dei movimenti di capitale tra i paesi CEE dal 1° luglio 1990, con periodi transitori per alcuni paesi e una clausola di salvaguardia: &lt;a href=&quot;https://eur-lex.europa.eu/ES/legal-content/summary/free-movement-of-capital-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi EUR-Lex sulla libera circolazione dei capitali&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Nel modello: &lt;b&gt;alzare la retta C&lt;/b&gt;. Più costa rinnegare l&#x27;impegno, più a destra si spostano S₁ e S₂, più ampia è la zona sicura. Le slide citano come esempio interessante &lt;b&gt;Maastricht&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; I criteri di convergenza di Maastricht rendevano l&#x27;ingresso nell&#x27;euro condizionato, tra l&#x27;altro, alla stabilità del cambio nell&#x27;ERM senza svalutazioni nei due anni precedenti: svalutare significava perdere il &quot;premio&quot; dell&#x27;ammissione all&#x27;euro, quindi C aumentava.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Criteri: inflazione, finanze pubbliche (deficit 3%, debito 60% del PIL), tassi a lungo termine, stabilità del cambio. &lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/glossary/convergence-criteria.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Glossario EUR-Lex, &quot;criteri di convergenza&quot;&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Una parità definita per legge, persino nella costituzione (&lt;em class=&quot;t&quot;&gt;constitutionally defined parity&lt;/em&gt;). Nel &lt;em class=&quot;t&quot;&gt;currency board&lt;/em&gt; &lt;b&gt;ogni emissione di moneta nazionale corrisponde a una pari quantità della valuta a cui è agganciata&lt;/b&gt;: la base monetaria è interamente coperta da riserve, quindi il problema di liquidity è in principio risolto.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; Resta però il problema di credibility: se lo shock è enorme, anche una legge si può cambiare. L&#x27;Argentina del 1991–2001, citata nella slide 2, aveva un regime di questo tipo ed è crollata.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.imf.org/external/pubs/ft/fandd/1998/12/enoch.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Enoch e Gulde, &quot;Are Currency Boards a Cure for All Monetary Problems?&quot;, IMF Finance &amp;amp; Development, dic. 1998&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché i controlli sui capitali proteggono un cambio fisso, e perché sono un rimedio problematico in UE?&lt;/summary&gt;&lt;div&gt;Perché senza libertà dei capitali la &lt;strong&gt;interest rate parity non vale&lt;/strong&gt; e l&#x27;attacco speculativo è ostacolato; ma l&#x27;&lt;strong&gt;integrazione finanziaria e commerciale richiede la libertà dei capitali&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In che senso Maastricht &quot;aumenta il costo del reneging&quot;?&lt;/summary&gt;&lt;div&gt;Collegando l&#x27;ingresso nell&#x27;euro alla stabilità del cambio: svalutare avrebbe significato perdere l&#x27;accesso all&#x27;unione. Nel grafico la retta &lt;strong&gt;C sale&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa garantisce un currency board, e cosa no?&lt;/summary&gt;&lt;div&gt;Garantisce che ogni unità di moneta sia coperta da valuta estera (&lt;strong&gt;liquidity&lt;/strong&gt;), ma non elimina del tutto il rischio di &lt;strong&gt;credibility&lt;/strong&gt;: la regola si può abbandonare (Argentina 2001).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section id=&quot;parallelo&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Il parallelo interessante e le conclusioni&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Slide 22&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Il sottotitolo della lezione si chiarisce qui: &lt;b&gt;lo stesso tipo di modello si applica a entrambi i casi&lt;/b&gt;. Un cambio fisso e un paese dell&#x27;Eurozona soffrono la stessa fragilità; cambiano solo i nomi delle variabili. Usa l&#x27;interruttore per &quot;tradurre&quot; la catena da un caso all&#x27;altro.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;par&quot;&gt;
    &lt;div class=&quot;ctrls&quot; style=&quot;margin-top:0&quot;&gt;&lt;button class=&quot;btn&quot; data-mode=&quot;fx&quot; aria-pressed=&quot;true&quot;&gt;Cambio fisso&lt;/button&gt;&lt;button class=&quot;btn&quot; data-mode=&quot;ez&quot; aria-pressed=&quot;false&quot;&gt;Paese dell&#x27;Eurozona&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Catena della crisi che si autorealizza&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;g fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;235&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;460&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;rect x=&quot;685&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar3)&quot;&gt;&lt;line x1=&quot;212&quot; y1=&quot;85&quot; x2=&quot;232&quot; y2=&quot;85&quot;/&gt;&lt;line x1=&quot;437&quot; y1=&quot;85&quot; x2=&quot;457&quot; y2=&quot;85&quot;/&gt;&lt;line x1=&quot;662&quot; y1=&quot;85&quot; x2=&quot;682&quot; y2=&quot;85&quot;/&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; fill=&quot;var(--soft)&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;110&quot; y=&quot;30&quot;&gt;promessa&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;30&quot;&gt;liquidità che manca&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;30&quot;&gt;reazione dei mercati&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;30&quot;&gt;esito&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;110&quot; y=&quot;80&quot; data-fx=&quot;Mantenere la&quot; data-ez=&quot;Rimborsare il&quot;&gt;Mantenere la&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;100&quot; data-fx=&quot;parità di cambio&quot; data-ez=&quot;debito pubblico&quot;&gt;parità di cambio&lt;/text&gt;
        &lt;text x=&quot;335&quot; y=&quot;80&quot; data-fx=&quot;Riserve in&quot; data-ez=&quot;Liquidità in euro:&quot;&gt;Riserve in&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;100&quot; data-fx=&quot;valuta estera&quot; data-ez=&quot;la BC non è sua&quot;&gt;valuta estera&lt;/text&gt;
        &lt;text x=&quot;560&quot; y=&quot;80&quot; data-fx=&quot;Vendono la moneta,&quot; data-ez=&quot;Vendono i titoli,&quot;&gt;Vendono la moneta,&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;100&quot; data-fx=&quot;tassi ↑&quot; data-ez=&quot;spread ↑&quot;&gt;tassi ↑&lt;/text&gt;
        &lt;text x=&quot;785&quot; y=&quot;80&quot; data-fx=&quot;Devaluation&quot; data-ez=&quot;Default&quot;&gt;Devaluation&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;100&quot; font-weight=&quot;400&quot; font-size=&quot;12&quot; data-fx=&quot;(svalutazione)&quot; data-ez=&quot;(insolvenza)&quot;&gt;(svalutazione)&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;var(--soft)&quot;&gt;la mancanza di credibilità genera aspettative che si autorealizzano&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;
  &lt;style&gt;#par button[aria-pressed=true]{background:var(--accent);color:var(--paper)}&lt;/style&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Perché un paese dell&#x27;Eurozona assomiglia a un paese con cambio fisso?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-add&quot;&gt;complemento&lt;/span&gt; Un paese con moneta propria che emette debito nella sua moneta può sempre, in ultima istanza, ripagarlo stampando moneta (al prezzo dell&#x27;inflazione): il default per mancanza di liquidità è quasi escluso. Un paese dell&#x27;Eurozona emette debito in euro, che la sua banca centrale nazionale non può creare da sola: come un paese con cambio fisso che ha bisogno di riserve, ha bisogno di liquidità in una moneta che non controlla. Se i mercati temono il default vendono i titoli, gli spread salgono, il costo del debito cresce e il default diventa più probabile: lo stesso grafico della sezione 4 con &quot;default&quot; al posto di &quot;devaluation&quot;.&lt;/p&gt;
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; È la tesi di &lt;a href=&quot;https://econpapers.repec.org/paper/epscepswp/5523.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;De Grauwe, &quot;The Governance of a Fragile Eurozone&quot;, CEPS WD 346, 2011&lt;/a&gt;: i membri di un&#x27;unione monetaria sono &quot;declassati&quot; allo status di economie emergenti e possono finire in equilibri multipli che si autorealizzano.&lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Conclusioni della lezione&lt;/h3&gt;
  &lt;ol class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Fragilità intrinseca&lt;/b&gt; delle incomplete MU.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Due tipi&lt;/b&gt;: cambio fisso ed Eurozona.&lt;/li&gt;
    &lt;li&gt;Possono nascere &lt;b&gt;dubbi sulla credibilità dell&#x27;impegno&lt;/b&gt;: mantenere il cambio fisso o rimborsare il debito…&lt;/li&gt;
    &lt;li&gt;…&lt;b&gt;a causa di liquidità insufficiente&lt;/b&gt;: riserve valutarie o liquidità nella moneta nazionale.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Fragilità comune&lt;/b&gt;: la mancanza di credibilità porta ad &lt;b&gt;aspettative che si autorealizzano&lt;/b&gt;, che a loro volta spingono il paese alla svalutazione o al default; è un problema di sostenibilità delle incomplete MU e dell&#x27;Eurozona.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Lo stesso tipo di modello&lt;/b&gt; si applica a entrambi i casi.&lt;/li&gt;
  &lt;/ol&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica finale&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Completa la corrispondenza: riserve valutarie ↔ ? ; svalutazione ↔ ?&lt;/summary&gt;&lt;div&gt;Riserve valutarie ↔ &lt;strong&gt;liquidità in euro&lt;/strong&gt; (nella moneta in cui è emesso il debito); svalutazione ↔ &lt;strong&gt;default&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Spiega in tre righe perché una crisi può avvenire anche con fondamentali &quot;non disastrosi&quot;.&lt;/summary&gt;&lt;div&gt;Con uno shock intermedio (tra S₁ e S₂), se i mercati si aspettano la crisi vendono, i tassi salgono per la interest rate parity, il costo di mantenere l&#x27;impegno cresce e rinunciarvi diventa ottimale: &lt;strong&gt;l&#x27;aspettativa si autorealizza&lt;/strong&gt;. Senza quell&#x27;aspettativa la parità (o il rimborso) avrebbe retto.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché lo spread Italia–Germania è sceso dopo il 1999, e perché questo non significa che il rischio sia sparito?&lt;/summary&gt;&lt;div&gt;È scomparso il &lt;strong&gt;rischio di cambio&lt;/strong&gt;; ma con debito emesso in una moneta non controllata è rimasto (e poi riemerso) il &lt;strong&gt;rischio di default&lt;/strong&gt;, che è la versione Eurozona della stessa fragilità.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ Per approfondire ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;✦&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;div class=&quot;src&quot;&gt;Tutte le voci sono &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;: trovate con ricerca web, da consultare direttamente&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide non citano autori o testi per nome. Di seguito: prima gli accordi, le norme e i casi storici che le slide nominano, poi i testi da cui proviene il &quot;modello noto&quot; e la teoria delle crisi che si autorealizzano.&lt;/p&gt;

  &lt;h3&gt;Accordi, norme e casi citati nelle slide&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Bretton Woods (1944–1971)&lt;/h4&gt;&lt;p&gt;Sistema delle parità: valute agganciate al dollaro, dollaro convertibile in oro, parità modificabili solo per &quot;squilibrio fondamentale&quot; e con l&#x27;accordo del FMI; finisce quando gli USA sospendono la convertibilità in oro nel 1971. &lt;span class=&quot;why&quot;&gt;Perché conta: è il primo esempio di &quot;tipo 2&quot; nella slide 2 e mostra come una promessa di parità venga infine rinnegata.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/about/histcoop.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FMI — Cooperation and reconstruction (1944–71)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;EMS e la crisi dell&#x27;ERM del 1992–93&lt;/h4&gt;&lt;p&gt;L&#x27;EMS nasce nel 1979; dodici riallineamenti tra il 1979 e il 1987, nessuno tra il 1987 e il 1992, poi la crisi del 1992–93 (con il no danese a Maastricht e i tassi tedeschi alti dopo la riunificazione tra i fattori citati in letteratura). Il working paper della Banque de France la legge come un fallimento del coordinamento tra autorità monetarie. &lt;span class=&quot;why&quot;&gt;Perché conta: è il &quot;collasso dell&#x27;EMS&quot; della slide 21 e il motivo della scelta EMS → EMU della slide 20.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://banque-france.fr/system/files/2023-01/wp793_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banque de France, Working Paper 793 (PDF)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Argentina: il Convertibility Plan (1991–2001)&lt;/h4&gt;&lt;p&gt;Dal 1991 peso alla pari con il dollaro, in un regime simile a un currency board che limitava fortemente la creazione di moneta. Recessione dal 1999, fuga di capitali, poi tra dicembre 2001 e gennaio 2002 congelamento parziale dei depositi, default parziale e abbandono della parità. L&#x27;Ufficio di valutazione indipendente del FMI ha esaminato il ruolo del Fondo. &lt;span class=&quot;why&quot;&gt;Perché conta: esempio della slide 2, e prova che anche una parità &quot;di legge&quot; può crollare.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/np/ieo/2003/arg/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FMI, Independent Evaluation Office — Argentina 1991–2002&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Trattato di Maastricht e criteri di convergenza&lt;/h4&gt;&lt;p&gt;Criteri concordati a Maastricht (1991, trattato firmato nel 1992): stabilità dei prezzi, finanze pubbliche (deficit ≤ 3%, debito ≤ 60% del PIL), tassi a lungo termine, stabilità del cambio nell&#x27;ERM per almeno due anni senza svalutazioni. &lt;span class=&quot;why&quot;&gt;Perché conta: è l&#x27;esempio della slide 21 per &quot;aumentare il costo del reneging&quot;.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/IT/legal-content/glossary/convergence-criteria.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Glossario: criteri di convergenza&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Direttiva 88/361/CEE sulla libera circolazione dei capitali&lt;/h4&gt;&lt;p&gt;Adottata il 24 giugno 1988; piena liberalizzazione dei movimenti di capitale dal 1° luglio 1990, con periodi transitori per Spagna, Grecia, Irlanda e Portogallo e una clausola di salvaguardia per gravi turbolenze valutarie. Oggi superata dall&#x27;art. 63 TFUE. &lt;span class=&quot;why&quot;&gt;Perché conta: segna la fine dei controlli sui capitali in Europa citati nella slide 21.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/ES/legal-content/summary/free-movement-of-capital-in-the-eu.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Sintesi sulla libera circolazione dei capitali&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Currency boards — Enoch e Gulde (FMI, 1998)&lt;/h4&gt;&lt;p&gt;Articolo divulgativo del FMI: il currency board non è una cura garantita; cita stime di Ghosh, Gulde e Wolf secondo cui riduce l&#x27;inflazione di circa 3,5 punti l&#x27;anno rispetto ad altri regimi, grazie a un effetto fiducia. &lt;span class=&quot;why&quot;&gt;Perché conta: approfondisce la &quot;constitutionally defined parity&quot; della slide 21.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/pubs/ft/fandd/1998/12/enoch.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF Finance &amp;amp; Development, dicembre 1998&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Il modello e la teoria&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Paul De Grauwe — &lt;i&gt;Economics of Monetary Union&lt;/i&gt; (Oxford University Press)&lt;/h4&gt;&lt;p&gt;Il manuale di riferimento sull&#x27;unione monetaria europea; le edizioni precedenti contengono un capitolo intitolato &quot;Incomplete Monetary Unions: The European Monetary System, Dollarization&quot;. Ultima edizione individuata: Oxford 2020 (numero di edizione non verificato). &lt;span class=&quot;why&quot;&gt;Perché conta: titolo e schema costi-benefici della lezione corrispondono a quel capitolo (collegamento proposto da Claude, non dichiarato nelle slide: controlla il programma del corso).&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.coleurope.eu/fr/economics-monetary-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;College of Europe — scheda del libro&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Paul De Grauwe — &quot;The Governance of a Fragile Eurozone&quot; (CEPS, 2011)&lt;/h4&gt;&lt;p&gt;CEPS Working Document 346: i paesi dell&#x27;unione monetaria emettono debito in una moneta che non controllano, sono esposti a default guidati dai mercati ed equilibri multipli che si autorealizzano; critica il disegno dell&#x27;ESM. &lt;span class=&quot;why&quot;&gt;Perché conta: è la versione Eurozona del &quot;parallelo&quot; (sezione 6).&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/paper/epscepswp/5523.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers — scheda e testo&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Maurice Obstfeld — &quot;Models of currency crises with self-fulfilling features&quot; (1996)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;European Economic Review&lt;/i&gt; 40(3–5), pp. 1037–1047. Modello illustrativo in cui una disoccupazione elevata può causare una crisi di cambio che si autorealizza; rassegna di altri meccanismi che si autorinforzano. &lt;span class=&quot;why&quot;&gt;Perché conta: è la base teorica del grafico con B&lt;sub&gt;U&lt;/sub&gt;, B&lt;sub&gt;E&lt;/sub&gt; e la zona di equilibri multipli.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=225349&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN — versione working paper (NBER WP 5285)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Obstfeld e Rogoff — &quot;The Mirage of Fixed Exchange Rates&quot; (1995)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Journal of Economic Perspectives&lt;/i&gt; 9(4), pp. 73–96. Le banche centrali dei paesi industrializzati avrebbero le risorse per difendere quasi ogni parità; il problema è se i mercati credono che le useranno, perché la difesa può costare molto all&#x27;economia (casi di Svezia e Regno Unito nel 1992, Messico nel 1994–95). &lt;span class=&quot;why&quot;&gt;Perché conta: mostra che credibility conta più della pura liquidity.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/article/aeajecper/v_3a9_3ay_3a1995_3ai_3a4_3ap_3a73-96.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers — scheda dell&#x27;articolo&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Stanley Fischer — &quot;Exchange Rate Regimes: Is the Bipolar View Correct?&quot; (2001)&lt;/h4&gt;&lt;p&gt;Discorso all&#x27;American Economic Association (poi sul &lt;i&gt;Journal of Economic Perspectives&lt;/i&gt;): con capitali liberi i soft pegs sono soggetti a crisi e i paesi si spostano verso hard pegs o cambi flessibili. &lt;span class=&quot;why&quot;&gt;Perché conta: è il dibattito sulla &quot;polarization&quot; della slide 20.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://www.imf.org/external/np/speeches/2001/010601a.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FMI — testo del discorso&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Borio, McCauley, McGuire, Sushko — &quot;Covered interest parity lost&quot; (BIS, 2016)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;BIS Quarterly Review&lt;/i&gt;, settembre 2016: le deviazioni dalla CIP dopo la crisi finanziaria (cross-currency basis), legate alla domanda di copertura e ai costi di bilancio. &lt;span class=&quot;why&quot;&gt;Perché conta: mostra i limiti dell&#x27;ipotesi di arbitraggio perfetto della slide 14.&lt;/span&gt;&lt;/p&gt;&lt;a href=&quot;https://ideas.repec.org/h/bis/bisbpc/96-08.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc — scheda&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
  &lt;p&gt;&lt;b&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/b&gt;&lt;/p&gt;
  &lt;p&gt;Fonte principale: &lt;code&gt;corso/Slides/8-EEP/08_EEP_Incomplete_MU.pdf&lt;/code&gt; — European Economic Policy 2026-27.&lt;/p&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  /* linguette */
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(box){
    var btns=box.querySelectorAll(&#x27;.tablist button&#x27;), panels=box.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i)});
      panels.forEach(function(p,j){p.hidden=j!==i});
    })});
  });
  /* passi */
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(box){
    var steps=box.querySelectorAll(&#x27;.step&#x27;), prev=box.querySelector(&#x27;[data-prev]&#x27;), next=box.querySelector(&#x27;[data-next]&#x27;), dots=box.querySelector(&#x27;.dots&#x27;), k=0;
    steps.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function show(){
      steps.forEach(function(s,i){s.classList.toggle(&#x27;on&#x27;,i===k)});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,i){d.classList.toggle(&#x27;on&#x27;,i===k)});
      prev.disabled=k===0; next.disabled=k===steps.length-1; box.setAttribute(&#x27;data-step&#x27;,k+1);
    }
    prev.addEventListener(&#x27;click&#x27;,function(){if(k&gt;0){k--;show()}});
    next.addEventListener(&#x27;click&#x27;,function(){if(k&lt;steps.length-1){k++;show()}});
    show();
  });
  /* indice attivo */
  var links=document.querySelectorAll(&#x27;#toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)})}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s)});
  }
  function $(id){return document.getElementById(id)}
  function pct(x,d){return (x*100).toFixed(d===undefined?1:d).replace(&#x27;.&#x27;,&#x27;,&#x27;)+&#x27;%&#x27;}

  /* calcolatore UIP */
  function uip(){
    var rs=+$(&#x27;u-rs&#x27;).value/100, e=+$(&#x27;u-e&#x27;).value, ee=+$(&#x27;u-ee&#x27;).value;
    var d=(ee-e)/e, ra=rs-d, rx=(1+rs)*e/ee-1;
    $(&#x27;u-rs-o&#x27;).textContent=pct(rs,2); $(&#x27;u-e-o&#x27;).textContent=e.toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;); $(&#x27;u-ee-o&#x27;).textContent=ee.toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;);
    $(&#x27;u-d&#x27;).textContent=(d&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+pct(d); $(&#x27;u-ra&#x27;).textContent=pct(ra); $(&#x27;u-rx&#x27;).textContent=pct(rx);
    $(&#x27;u-sp&#x27;).textContent=Math.round((rx-rs)*10000)+&#x27; bp&#x27;;
    var sc=380/0.8, vals=[rs,rx,ra];
    [&#x27;u-b1&#x27;,&#x27;u-b2&#x27;,&#x27;u-b3&#x27;].forEach(function(id,i){var w=Math.max(0,Math.min(400,vals[i]*sc));$(id).setAttribute(&#x27;width&#x27;,w);var t=$(&#x27;u-t&#x27;+(i+1));t.setAttribute(&#x27;x&#x27;,130+w+6);t.textContent=pct(vals[i])});
    var v;
    if(Math.abs(d)&lt;0.0005) v=&#x27;Nessuna variazione attesa: basta offrire lo stesso tasso estero.&#x27;;
    else if(d&lt;0) v=&#x27;I mercati si aspettano un deprezzamento dell’euro del &#x27;+pct(-d)+&#x27;: per trattenere i capitali la banca centrale deve pagare &#x27;+Math.round((rx-rs)*10000)+&#x27; punti base in più. &#x27;+(-d&gt;0.08?&#x27;Con attese così forti la formula approssimata sbaglia di &#x27;+pct(rx-ra)+&#x27;.&#x27;:&#x27;&#x27;);
    else v=&#x27;I mercati si aspettano un apprezzamento: il tasso interno può stare sotto quello estero.&#x27;;
    $(&#x27;u-v&#x27;).textContent=v;
  }
  [&#x27;u-rs&#x27;,&#x27;u-e&#x27;,&#x27;u-ee&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,uip)}); uip();

  /* grafico costi-benefici */
  var X0=60,Y0=330,SX=50,SY=30,A=0.15,K=0.42,expect=false;
  function BU(s){return A*(Math.exp(K*s)-1)}
  function px(s){return X0+SX*s} function py(b){return Y0-SY*Math.min(b,10.5)}
  function curve(m){var d=&#x27;&#x27;,s;for(s=0;s&lt;=10.001;s+=0.1){var b=BU(s*m);if(b&gt;10.3){d+=&#x27;L&#x27;+px(s).toFixed(1)+&#x27; &#x27;+py(10.3).toFixed(1);break}d+=(d?&#x27;L&#x27;:&#x27;M&#x27;)+px(s).toFixed(1)+&#x27; &#x27;+py(b).toFixed(1)}return d}
  function cb(){
    var s=+$(&#x27;cb-s&#x27;).value, C=+$(&#x27;cb-cv&#x27;).value, m=+$(&#x27;cb-m&#x27;).value;
    $(&#x27;cb-s-o&#x27;).textContent=s.toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;); $(&#x27;cb-cv-o&#x27;).textContent=C.toFixed(1).replace(&#x27;.&#x27;,&#x27;,&#x27;); $(&#x27;cb-m-o&#x27;).textContent=&#x27;×&#x27;+m.toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;);
    var s2=Math.log(C/A+1)/K, s1=s2/m, S2=Math.min(s2,10.3), S1=Math.min(s1,10.3);
    $(&#x27;cb-c&#x27;).setAttribute(&#x27;y1&#x27;,py(C)); $(&#x27;cb-c&#x27;).setAttribute(&#x27;y2&#x27;,py(C)); $(&#x27;cb-ct&#x27;).setAttribute(&#x27;y&#x27;,py(C)+5);
    $(&#x27;cb-bu&#x27;).setAttribute(&#x27;d&#x27;,curve(1)); $(&#x27;cb-be&#x27;).setAttribute(&#x27;d&#x27;,curve(m));
    var tu=Math.min(10,Math.log(10/A+1)/K), te=tu/m;
    $(&#x27;cb-but&#x27;).setAttribute(&#x27;x&#x27;,px(tu)+6); $(&#x27;cb-but&#x27;).setAttribute(&#x27;y&#x27;,py(10)+14);
    $(&#x27;cb-bet&#x27;).setAttribute(&#x27;x&#x27;,px(te)-24); $(&#x27;cb-bet&#x27;).setAttribute(&#x27;y&#x27;,py(10)+14);
    [[&#x27;cb-s1&#x27;,S1,&#x27;cb-s1t&#x27;],[&#x27;cb-s2&#x27;,S2,&#x27;cb-s2t&#x27;]].forEach(function(a){var x=px(a[1]);$(a[0]).setAttribute(&#x27;x1&#x27;,x);$(a[0]).setAttribute(&#x27;x2&#x27;,x);$(a[0]).setAttribute(&#x27;y2&#x27;,py(C));$(a[2]).setAttribute(&#x27;x&#x27;,x)});
    var z=[[0,S1],[S1,S2],[S2,10.3]];
    z.forEach(function(r,i){var el=$(&#x27;cb-z&#x27;+(i+1)),w=Math.max(0,px(r[1])-px(r[0]));el.setAttribute(&#x27;x&#x27;,px(r[0]));el.setAttribute(&#x27;width&#x27;,w);var l=$(&#x27;cb-l&#x27;+(i+1));l.setAttribute(&#x27;x&#x27;,px(r[0])+w/2);l.style.display=w&gt;70?&#x27;&#x27;:&#x27;none&#x27;});
    var x=px(s); $(&#x27;cb-sh&#x27;).setAttribute(&#x27;x1&#x27;,x); $(&#x27;cb-sh&#x27;).setAttribute(&#x27;x2&#x27;,x);
    var be=BU(s*m), bu=BU(s);
    $(&#x27;cb-d&#x27;).setAttribute(&#x27;cx&#x27;,x); $(&#x27;cb-d&#x27;).setAttribute(&#x27;cy&#x27;,py(be)); $(&#x27;cb-dt&#x27;).setAttribute(&#x27;x&#x27;,x-20); $(&#x27;cb-dt&#x27;).setAttribute(&#x27;y&#x27;,py(be)+4);
    $(&#x27;cb-n&#x27;).setAttribute(&#x27;cx&#x27;,x); $(&#x27;cb-n&#x27;).setAttribute(&#x27;cy&#x27;,py(bu)); $(&#x27;cb-nt&#x27;).setAttribute(&#x27;x&#x27;,x+10); $(&#x27;cb-nt&#x27;).setAttribute(&#x27;y&#x27;,py(bu)+4);
    $(&#x27;cb-be&#x27;).setAttribute(&#x27;opacity&#x27;,expect?1:.35); $(&#x27;cb-bu&#x27;).setAttribute(&#x27;opacity&#x27;,expect?.35:1);
    $(&#x27;cb-d&#x27;).setAttribute(&#x27;r&#x27;,expect?8:5); $(&#x27;cb-n&#x27;).setAttribute(&#x27;r&#x27;,expect?5:8);
    var v;
    if(s&lt;s1) v=&#x27;Zona sicura (shock &lt; S₁): anche con attese di svalutazione il beneficio resta sotto il costo. La parità regge, qualunque cosa pensino i mercati.&#x27;;
    else if(s&lt;s2) v=&#x27;Zona degli equilibri multipli (S₁ &lt; shock &lt; S₂). &#x27;+(expect?&#x27;I mercati si aspettano la svalutazione: Bₑ = &#x27;+be.toFixed(1)+&#x27; &gt; C = &#x27;+C.toFixed(1)+&#x27; → il governo svaluta (punto D). L’aspettativa si è autorealizzata.&#x27;:&#x27;I mercati non se l’aspettano: Bᵤ = &#x27;+bu.toFixed(1)+&#x27; &lt; C = &#x27;+C.toFixed(1)+&#x27; → la parità regge (punto N). Prova a premere &quot;Sì&quot;.&#x27;);
    else v=&#x27;Shock &gt; S₂: anche senza attese Bᵤ = &#x27;+Math.min(bu,99).toFixed(1)+&#x27; &gt; C. La svalutazione conviene comunque: crisi dovuta ai fondamentali.&#x27;;
    $(&#x27;cb-v&#x27;).textContent=v;
  }
  [&#x27;cb-s&#x27;,&#x27;cb-cv&#x27;,&#x27;cb-m&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,cb)});
  $(&#x27;cb-yes&#x27;).addEventListener(&#x27;click&#x27;,function(){expect=true;this.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);$(&#x27;cb-no&#x27;).setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);cb()});
  $(&#x27;cb-no&#x27;).addEventListener(&#x27;click&#x27;,function(){expect=false;this.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);$(&#x27;cb-yes&#x27;).setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);cb()});
  cb();

  /* parallelo */
  var pb=document.querySelectorAll(&#x27;#par [data-mode]&#x27;);
  pb.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    var m=b.getAttribute(&#x27;data-mode&#x27;);
    pb.forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,x===b)});
    document.querySelectorAll(&#x27;#par text[data-fx]&#x27;).forEach(function(t){t.textContent=t.getAttribute(&#x27;data-&#x27;+m)});
  })});
})();
&lt;/script&gt;
