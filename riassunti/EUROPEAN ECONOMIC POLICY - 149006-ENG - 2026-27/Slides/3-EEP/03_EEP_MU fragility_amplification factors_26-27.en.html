    &lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 1–2&lt;/span&gt;
    &lt;h2&gt;Monetary independence and government budgets&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Previous lectures showed the first cost of the euro: without its own monetary policy, a country finds it harder to respond to asymmetric shocks. The 2008 crisis and the sovereign debt crisis revealed a second, less visible cost: it changes the way a state can finance its deficit.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary independence&lt;/b&gt;: a country&#x27;s ability to set its own interest rates, let its exchange rate float and, if necessary, create the currency in which its debt is denominated.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Asymmetric shock&lt;/b&gt;: an event that hits one country in the union, or hits it harder than the others. A single central bank cannot give each member the policy it needs.&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;First cost (already covered)&lt;/h4&gt;&lt;p&gt;No national interest rate or exchange rate: &lt;b&gt;fewer instruments&lt;/b&gt; to absorb a shock that hits only you. This is the subject of optimum currency area theory.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--acc)&quot;&gt;&lt;h4&gt;Second cost (this lecture)&lt;/h4&gt;&lt;p&gt;The government borrows in a currency it &lt;b&gt;does not control&lt;/b&gt;: this changes its &lt;span style=&quot;color:var(--acc)&quot;&gt;capacity to finance deficits&lt;/span&gt;, and financial markets gain power over it.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Links: the slides refer back to previous lectures on asymmetric shocks (slide 2), to the lectures on fiscal policy for the CAB (slide 8) and forward to upcoming lectures on the risk premium linked to expected devaluation (slide 31).&lt;/p&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What are the two costs of losing monetary independence?&lt;/summary&gt;&lt;div&gt;(1) Fewer instruments against asymmetric shocks: no national interest rate or exchange rate. (2) A different and more fragile capacity to finance deficits, because debt is issued in a currency the state does not control.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why is the 2008 crisis an &quot;add-on&quot; to the theory?&lt;/summary&gt;&lt;div&gt;The traditional theory of monetary union focused mainly on macroeconomic adjustment: exchange rates, wages, labour mobility. The crisis showed that financial markets and public debt can also make a union unstable.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section id=&quot;stabilizzatori&quot; class=&quot;part s-salvia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 3–8&lt;/span&gt;
    &lt;h2&gt;Budget deficits and automatic stabilizers&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;In a recession the government deficit grows on its own, without any decision by the government. This is not necessarily a mistake: the budget is acting as a buffer.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Automatic stabilizers&lt;/b&gt;: items of the government budget that move with the cycle on their own and support income during downturns. The examples in the slides are &lt;i&gt;unemployment benefits&lt;/i&gt; and &lt;i&gt;progressive taxation&lt;/i&gt;.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Transitory shocks&lt;/b&gt;: the &lt;i&gt;booms and busts&lt;/i&gt; associated with the phases of the business cycle. They are temporary by definition, so a temporary deficit is the natural way to absorb them.&lt;/div&gt;

    &lt;h3&gt;How they work: follow the chain&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;A recession hits: income &lt;i&gt;Y&lt;/i&gt; falls and unemployment rises.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;b&gt;Expenditure side:&lt;/b&gt; &lt;i&gt;unemployment benefits&lt;/i&gt; increase, so government spending &lt;i&gt;G&lt;/i&gt; rises. The government acts as a &lt;i&gt;buffer&lt;/i&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;Revenue side:&lt;/b&gt; the income distribution shifts to the left; more people fall into the lower brackets and the average tax rate &lt;i&gt;t&lt;/i&gt; falls.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;Tax revenue &lt;i&gt;T&lt;/i&gt; falls &lt;b&gt;twice over&lt;/b&gt;: because &lt;i&gt;Y&lt;/i&gt; has fallen and because &lt;i&gt;t&lt;/i&gt; has fallen.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;Result: the deficit (&lt;i&gt;G − T&lt;/i&gt;) widens automatically and households&#x27; disposable income falls by less than gross income. The recession is dampened.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Progressive taxation and the income distribution&lt;/h3&gt;
    &lt;p&gt;Under progressive taxation the tax rate rises with income. This is the typical rule for personal income tax. Brackets and rates are set by each government and differ across countries and over time. Because rates depend on income, the &lt;b&gt;average tax rate changes when the income distribution changes&lt;/b&gt;, for example over the cycle. This is why it is an important automatic stabilizer.&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;t = Σ&lt;sub&gt;i=1&lt;/sub&gt;&lt;sup&gt;n&lt;/sup&gt; t&lt;sub&gt;i&lt;/sub&gt; · Y&lt;sub&gt;i&lt;/sub&gt; / Y &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; T = Σ&lt;sub&gt;i=1&lt;/sub&gt;&lt;sup&gt;n&lt;/sup&gt; t&lt;sub&gt;i&lt;/sub&gt; · Y&lt;sub&gt;i&lt;/sub&gt; = t · Y&lt;small&gt;t&lt;sub&gt;i&lt;/sub&gt; = tax rate of bracket i · Y&lt;sub&gt;i&lt;/sub&gt; = income falling in bracket i · Y = total income. The average tax rate is a &lt;b&gt;weighted average&lt;/b&gt; of the bracket rates, with weights Y&lt;sub&gt;i&lt;/sub&gt;/Y.&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Real-world distributions are &lt;i&gt;right skewed&lt;/i&gt;: many low or middle incomes and a long tail of high incomes. In the example in the slides (Italy 2010, ISTAT data) the peaks lie around €11–18 thousand: pensions are more concentrated at the bottom, employees peak around €18 thousand, and the self-employed are more dispersed, with a longer tail.&lt;/p&gt;

    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Negative income shock &lt;input type=&quot;range&quot; id=&quot;taxShock&quot; min=&quot;0&quot; max=&quot;25&quot; value=&quot;10&quot; step=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;taxShockV&quot;&gt;10%&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;taxSvg&quot; viewBox=&quot;0 0 620 290&quot; role=&quot;img&quot; aria-label=&quot;Income distribution before and after the shock, with tax brackets&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;readout&quot; id=&quot;taxOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Interactive reconstruction of the chart on slide 7. Solid curve: initial distribution; dashed: after the shock, shifted to the left. Brackets and rates (23, 27, 38, 41, 43%) are illustrative, inspired by IRPEF (Italian personal income tax); the distribution is a gamma curve with a mean of €30 thousand. As in the slide, each income is taxed at the rate of its bracket. Watch tax revenue: it falls by more than income.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Key points (slide 8)&lt;/h3&gt;
    &lt;details open&gt;&lt;summary&gt;The budget&#x27;s response to the cycle is a policy indicator&lt;/summary&gt;&lt;p&gt;Measuring how revenue and spending react to the cycle is needed to compute the &lt;b&gt;Cyclically Adjusted Budget Balance (CAB)&lt;/b&gt;: the budget balance that would prevail if the economy were at potential output. The CAB separates the &quot;automatic&quot; part of the deficit from the part decided by the government. It is covered in the lectures on fiscal policy.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In a monetary union, little room for national stabilization&lt;/summary&gt;&lt;p&gt;Common fiscal rules and the initial &lt;i&gt;budgetary stance&lt;/i&gt; may leave &lt;span style=&quot;color:var(--acc)&quot;&gt;little room for stabilization policies&lt;/span&gt; at national level.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The cycle can be exacerbated&lt;/summary&gt;&lt;p&gt;If governments are forced into &lt;b&gt;austerity&lt;/b&gt; (spending cuts and tax increases in the middle of a recession), the budget loses its stabilizing capacity and instead pushes in the same direction as the shock: &lt;span style=&quot;color:var(--acc)&quot;&gt;business cycle movements may be exacerbated&lt;/span&gt;.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cross-country differences fuel asymmetries&lt;/summary&gt;&lt;p&gt;If one country can let its stabilizers work while another must impose austerity, their economies diverge even further: policies themselves become a source of asymmetry within the union.&lt;/p&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why, with progressive taxes, does revenue fall more than proportionally to income?&lt;/summary&gt;&lt;div&gt;Because T = t·Y and in a recession both factors fall: Y falls, and the distribution shifts towards brackets with lower rates, so the average tax rate t falls too.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What does the CAB measure and why is it useful?&lt;/summary&gt;&lt;div&gt;The cyclically adjusted budget balance. By removing the effect of automatic stabilizers, it reveals the discretionary or structural component of fiscal policy.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Would automatic stabilizers disappear under a pure flat tax (single rate)?&lt;/summary&gt;&lt;div&gt;No, they would be weaker. Revenue would still fall in proportion to income, but t would stay constant, so the &quot;second&quot; effect would be missing. Unemployment benefits on the expenditure side would also remain.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section id=&quot;fragilita&quot; class=&quot;part s-ocra&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 9–13 and 21&lt;/span&gt;
    &lt;h2&gt;Debt in a currency you do not control&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;When the deficit grows during a recession, only one question matters: do investors believe the government will be able to repay the bonds as they mature?&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&quot;Stand-alone&quot; country&lt;/h4&gt;&lt;p&gt;Issues debt in its &lt;b&gt;own&lt;/b&gt; currency. Its central bank is (usually) ready to provide liquidity in a &lt;i&gt;liquidity crisis&lt;/i&gt;. Creditors are guaranteed payment at maturity, at least in nominal terms.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Member of an MU&lt;/h4&gt;&lt;p&gt;Issues debt in a currency over which it has &lt;b&gt;no control&lt;/b&gt;. The central bank belongs to the &lt;b&gt;whole&lt;/b&gt; currency area, not to the individual state, and is independent of governments. The government &lt;b&gt;cannot guarantee&lt;/b&gt; that bondholders will be paid.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;The slides&#x27; conclusion: &lt;span style=&quot;color:var(--acc);font-weight:600&quot;&gt;financial markets acquire power&lt;/span&gt;. Financial markets gain the power to force these member countries into default. How? By selling.&lt;/p&gt;

    &lt;h3&gt;Two scenarios during an asynchronous cycle&lt;/h3&gt;
    &lt;p&gt;In the euro zone (EZ), investors hold government bonds of many member countries in their portfolios. Suppose country B is in recession and issues new bonds, while country A is in a boom and its deficit is falling.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Investors trust&lt;/button&gt;&lt;button&gt;Investors distrust&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;If they trust the union, investors &lt;b&gt;buy more of B&#x27;s bonds&lt;/b&gt;, since B is issuing new ones, and reduce their holdings of A&#x27;s, since A is issuing fewer. Savings flow to where they are needed: the union works as insurance and B&#x27;s deficit is financed without difficulty.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;If they distrust the union and B, they &lt;b&gt;refuse to buy&lt;/b&gt; B&#x27;s new bonds, &lt;b&gt;sell&lt;/b&gt; the ones they already hold and buy A&#x27;s bonds. This is the step that starts the fragility chain below.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;&quot;Monetary union is fragile&quot;: the chain&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;b&gt;Distrust.&lt;/b&gt; Investors distrust a member government and sell its bonds.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;The bond &lt;b&gt;price&lt;/b&gt; falls, which is the same as saying the required &lt;b&gt;yield&lt;/b&gt; rises. A bond&#x27;s price and yield always move in opposite directions.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;Liquidity crisis.&lt;/b&gt; The government struggles to find buyers at a reasonable rate to roll over maturing debt.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;b&gt;Solvency crisis.&lt;/b&gt; With higher rates the debt burden grows: higher taxes and lower spending are needed.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;b&gt;Forced austerity.&lt;/b&gt; Contractionary fiscal policies arrive precisely during the recession and amplify the initial shock.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;b&gt;Sovereign debt crisis.&lt;/b&gt; It becomes increasingly likely that the only option is to stop servicing the debt. If fundamentals were sound, the crisis is &lt;b&gt;self-fulfilling&lt;/b&gt;.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Liquidity crisis or solvency crisis?&lt;/h3&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Liquidity crisis&lt;/th&gt;&lt;th&gt;Solvency crisis&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;What it is&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The state is &lt;i&gt;temporarily&lt;/i&gt; short of cash or liquid assets to meet short-term obligations, perhaps because of market conditions or creditor panic.&lt;/td&gt;&lt;td&gt;Total liabilities exceed the capacity to repay &lt;i&gt;in the long run&lt;/i&gt;. An underlying fiscal imbalance makes the debt unpayable.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Does borrowing help?&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Yes: it is enough to get through the difficult moment.&lt;/td&gt;&lt;td&gt;No: more debt does not solve the problem.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Solution&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Short-term loans or temporary support from external lenders, such as international institutions.&lt;/td&gt;&lt;td&gt;Drastic measures: debt restructuring, austerity, in extreme cases default.&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-fulfilling debt crisis&lt;/b&gt;: a sovereign debt crisis that hits a country with relatively sound fundamentals. Pessimistic market expectations raise &lt;i&gt;sovereign spreads&lt;/i&gt; (the yield differential relative to the safest country), weaken the public finances and ultimately make default genuinely more likely. Fear produces what it fears: a liquidity crisis turns into a solvency crisis.&lt;/div&gt;

    &lt;h4&gt;Try it: how much does the spread weigh on a high debt?&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;Teaching supplement (not in the slides): this is the standard debt sustainability arithmetic, useful for understanding the transition from liquidity to solvency. The primary balance (the balance net of interest payments) that keeps the debt-to-GDP ratio constant is approximately (i − g)·d.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Debt/GDP d &lt;input type=&quot;range&quot; id=&quot;dD&quot; min=&quot;40&quot; max=&quot;160&quot; value=&quot;100&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dDv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Spread &lt;input type=&quot;range&quot; id=&quot;dS&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.25&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dSv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Nominal growth g &lt;input type=&quot;range&quot; id=&quot;dG&quot; min=&quot;-3&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dGv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;debtSvg&quot; viewBox=&quot;0 0 620 100&quot; role=&quot;img&quot; aria-label=&quot;Interest expenditure and required primary surplus&quot;&gt;&lt;/svg&gt;
      &lt;p id=&quot;debtMsg&quot; class=&quot;def&quot; style=&quot;margin:8px 0 0&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;figcaption&gt;Risk-free rate set at 2%, so i = 2% + spread. Simplification: in reality the higher rate applies only to debt being rolled over, so the effect builds up gradually.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why does selling a country&#x27;s bonds raise its interest rate?&lt;/summary&gt;&lt;div&gt;The bond pays fixed coupons. If the price falls, a buyer gets the same cash flow for less money, so the effective yield rises. New issues will also have to offer that higher yield.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;How can a liquidity crisis become a solvency crisis?&lt;/summary&gt;&lt;div&gt;High rates over a long period increase interest expenditure and the debt burden. This forces austerity, which reduces growth, and sustainable debt becomes unsustainable.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;When do we speak of a self-fulfilling crisis?&lt;/summary&gt;&lt;div&gt;When a country falls into crisis despite relatively sound fundamentals: it is pessimistic expectations, through higher spreads, that create the conditions for default.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section id=&quot;uk-spagna&quot; class=&quot;part s-ardesia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 14–20&lt;/span&gt;
    &lt;h2&gt;UK (&quot;stand-alone&quot;) vs Spain (MU member)&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Two countries with similar public finances, in fact worse in the United Kingdom until 2011, but with opposite fortunes in the markets. The difference is whether or not they have their own central bank.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;tabs&quot; data-tabs id=&quot;ukTabs&quot; style=&quot;margin:0&quot;&gt;
        &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Debt/GDP&lt;/button&gt;&lt;button&gt;Deficit/GDP&lt;/button&gt;&lt;button&gt;10-year yield&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;ukSvg&quot; viewBox=&quot;0 0 620 300&quot; role=&quot;img&quot; aria-label=&quot;Comparison of Spain and the United Kingdom&quot;&gt;&lt;/svg&gt;
      &lt;figcaption id=&quot;ukCap&quot;&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;&lt;b&gt;Reading the charts:&lt;/b&gt; until 2011 the United Kingdom had more debt than Spain and similar deficits. Yet from 2010 the Spanish 10-year yield rises to about 6.8% (summer 2012), while the British one falls towards 1.5%. Markets do not price only the public accounts: they price who guarantees liquidity.&lt;/p&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;stepper&quot; data-stepper style=&quot;--c:var(--ardesia)&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;🇬🇧 If investors fear a UK default&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;They sell UK government bonds: prices fall and yields rise.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Some move their funds abroad and &lt;b&gt;sell pounds&lt;/b&gt; for other currencies.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;The downward pressure causes the pound to &lt;b&gt;depreciate&lt;/b&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;The &lt;b&gt;forex&lt;/b&gt; (foreign exchange) market matters: competitiveness improves.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;The &lt;b&gt;Bank of England&lt;/b&gt; tolerates the depreciation and can lower its policy rate.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;Capital outflows shrink and may reverse: the weak pound attracts investors looking for undervalued UK assets.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;Liquidity stays in pounds and is gradually reinvested in UK assets, including government bonds.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;If needed, the BoE &lt;b&gt;buys government bonds&lt;/b&gt;: it is a &lt;i&gt;lender of last resort&lt;/i&gt; to the sovereign. Investors cannot force a default and, knowing this, do not try.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;→&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepper&quot; data-stepper style=&quot;--c:var(--mattone)&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;🇪🇸 If investors fear a Spanish default&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;They sell Spanish government bonds: yields rise.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;With the proceeds they buy other euro-area assets, for example German Bunds.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;No foreign exchange market or flexible exchange rate&lt;/b&gt; slows the movement: the euros simply leave.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;The Spanish money stock falls: the pool of liquidity available to buy Spanish bonds shrinks. Where do those euros go? Elsewhere in the area.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;b&gt;There is no Spanish central bank&lt;/b&gt; that can be made to buy Spanish bonds.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;A liquidity crisis becomes possible: the government cannot fund its issues at a reasonable rate.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;It may be forced into default.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;Investors know this, and are &lt;b&gt;tempted to try&lt;/b&gt;.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;→&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;The paradox: like an emerging economy&lt;/h3&gt;
    &lt;p&gt;Joining an MU &lt;b&gt;weakens&lt;/b&gt; a country&#x27;s position vis-à-vis financial markets. Spain resembles the emerging economies that are forced to borrow in foreign currency and are therefore financially fragile.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sudden stop&lt;/h4&gt;&lt;p&gt;An abrupt halt in capital inflows that leads to a liquidity crisis.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Liability dollarization&lt;/h4&gt;&lt;p&gt;Debts denominated in foreign currency, typically in dollars (Calvo et al., 2006). If the exchange rate collapses, the value of the debt explodes in local-currency terms.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Original sin&lt;/h4&gt;&lt;p&gt;A country&#x27;s inability to borrow abroad in its own currency (Eichengreen, Hausmann and Panizza).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;blockquote class=&quot;def&quot; style=&quot;font-family:var(--serif);font-style:italic&quot;&gt;&quot;Capital flows are more volatile and prone to reversal. Countries burdened with original sin have lower credit ratings and hence more tenuous access to international capital markets than their levels of indebtedness and other creditworthiness indicators would lead one to predict.&quot; &lt;span class=&quot;src&quot;&gt;(EHP, 2005, quoted on slide 21)&lt;/span&gt;&lt;/blockquote&gt;
    &lt;p class=&quot;note&quot;&gt;The link: a euro member effectively has &quot;original sin&quot; without being an emerging economy. It borrows in a currency that, for it, behaves like a foreign currency.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;What is the &quot;superior force&quot; that protects the United Kingdom?&lt;/summary&gt;&lt;div&gt;The Bank of England, which can create pounds without limit and buy government bonds as lender of last resort. Speculation cannot win against it, so it does not even start.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why does liquidity &quot;leave&quot; Spain but not the United Kingdom?&lt;/summary&gt;&lt;div&gt;Whoever sells gilts (UK government bonds) and wants to get out must sell pounds: the pound depreciates and the pounds remain in the UK system. Whoever sells Spanish bonds receives euros and can move them to Germany or the Netherlands with no exchange rate risk at all: the Spanish money supply genuinely shrinks.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Explain the analogy with original sin.&lt;/summary&gt;&lt;div&gt;Emerging economies borrow in a currency they do not issue, the dollar. Euro countries borrow in euros, which are issued by the ECB rather than by the national central bank. In both cases there is no national lender of last resort, and the country is exposed to sudden stops.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section id=&quot;amplificazione&quot; class=&quot;part s-mattone&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 21–24&lt;/span&gt;
    &lt;h2&gt;Amplification of asymmetric shocks&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;If the shock was already asymmetric, the loss of confidence in B&#x27;s government &lt;span style=&quot;color:var(--acc)&quot;&gt;amplifies it in both countries&lt;/span&gt;: B goes further down, A goes further up.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;&lt;label&gt;Loss of market confidence in country B &lt;input type=&quot;range&quot; id=&quot;adS&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;adSv&quot;&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;svg id=&quot;adSvg&quot; viewBox=&quot;0 0 620 270&quot; role=&quot;img&quot; aria-label=&quot;Aggregate demand and aggregate supply in countries B and A&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Reconstruction of slide 22 (AD-AS model: aggregate demand and aggregate supply). D = initial demand; D′ = after the asymmetric shock (leftward in B, rightward in A); D″ = after capital flows from B to A. The dot marks the equilibrium: prices and output.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Country with a negative shock (B)&lt;/th&gt;&lt;th&gt;Country without a shock (A)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Investors sell the bonds of the country that has been hit and that they distrust.&lt;/td&gt;&lt;td&gt;Investors buy the bonds of the country they trust.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;The bond price falls and the interest rate rises: a liquidity crisis emerges.&lt;/td&gt;&lt;td&gt;The bond price rises and the interest rate falls.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Aggregate demand shifts further to the left: &lt;b&gt;amplification of the negative shock&lt;/b&gt;.&lt;/td&gt;&lt;td&gt;Aggregate demand shifts further to the right: &lt;b&gt;amplification of the positive shock&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Interest rate changes &lt;b&gt;destabilize&lt;/b&gt; the system instead of stabilizing it. With its own currency, the country in recession would have lower rates; here it has higher ones.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ardesia)&quot;&gt;&lt;h4&gt;Short-term interest rate&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Common&lt;/b&gt; to all members: set by the central bank for the whole union.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--acc)&quot;&gt;&lt;h4&gt;Long-term government bond rates&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Diverge&lt;/b&gt; if investors attach different risks to different governments&#x27; bonds.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;What a long-term yield is made of&lt;/h3&gt;
    &lt;div class=&quot;formula&quot;&gt;long-term yield = expected short rate + term premium + credit risk premium&lt;small&gt;expected short rate: expected future short-term rates (monetary policy) · term premium: compensation for long maturity (inflation, interest rate and liquidity risks) · credit risk premium: compensation for default, redenomination (conversion into a new currency) or devaluation&lt;/small&gt;&lt;/div&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Expected short rate (common) &lt;input type=&quot;range&quot; id=&quot;yR&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yRv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Term premium (common) &lt;input type=&quot;range&quot; id=&quot;yT&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.8&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yTv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Credit risk premium core &lt;input type=&quot;range&quot; id=&quot;yC&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;0.2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yCv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Credit risk premium periphery &lt;input type=&quot;range&quot; id=&quot;yP&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;4.5&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yPv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;ySvg&quot; viewBox=&quot;0 0 620 150&quot; role=&quot;img&quot; aria-label=&quot;Yield decomposition&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;The first two components are the same for all members, so the &lt;b&gt;spread&lt;/b&gt; (the difference between the two yields) measures only the difference in credit risk premium. Illustrative values; the initial ones are close to 2012.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why can long-term rates be destabilizing in an MU?&lt;/summary&gt;&lt;div&gt;Capital flees from the country in difficulty to the safe one: rates rise where there is a recession and fall where there is a boom. This is the opposite of a stabilizing policy, and the two economies diverge.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Which yield component explains the spread between euro countries?&lt;/summary&gt;&lt;div&gt;The credit risk premium. The expected short rate depends on the ECB and is common to all; the term premium is also similar.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;In the AD-AS chart, what does the move from D′ to D″ represent?&lt;/summary&gt;&lt;div&gt;The additional effect of capital flows and interest rates: higher rates and austerity in B, lower rates in A. It is not a new external shock: it is the endogenous amplification of the initial shock.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section id=&quot;spread&quot; class=&quot;part s-salvia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 25–31&lt;/span&gt;
    &lt;h2&gt;Investors&#x27; distrust, spreads and safe assets&lt;/h2&gt;
    &lt;h3&gt;What a safe asset is&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;01&lt;/div&gt;&lt;p&gt;&lt;b&gt;Limited risk:&lt;/b&gt; the same payoff across many future scenarios. Easy to sell even to people with different beliefs and risk appetites.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;02&lt;/div&gt;&lt;p&gt;&lt;b&gt;Value in crises:&lt;/b&gt; precisely in times of crisis, low risk and high liquidity protect the holder.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;03&lt;/div&gt;&lt;p&gt;&lt;b&gt;It is safe because everyone considers it safe:&lt;/b&gt; trading is highly liquid and the price does not fall. Safety is also a &lt;i&gt;shared belief&lt;/i&gt;, which can vanish.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Periphery vs core: beliefs change&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg id=&quot;cpSvg&quot; viewBox=&quot;0 0 620 270&quot; role=&quot;img&quot; aria-label=&quot;Core and periphery 10-year yields, stylized profile&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Stylized profile, reconstructed by eye from the chart in Brunnermeier and Reis (2019), slide 28. Core = Germany and France; periphery = Spain, Italy, Ireland, Portugal and Greece; GDP-weighted averages. Until 2008 the two series almost coincide: all bonds were considered safe assets. In 2010–2012 they diverge because &lt;b&gt;beliefs change&lt;/b&gt;, with large capital flows from the periphery to the core. During the crisis Greece reaches around 29% (slide 27).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;&lt;b&gt;A longer view (slide 29, Shambaugh 2012).&lt;/b&gt; In the 1990s, before the euro, spreads were wide: Greece started at around 25% in 1993, and Italy and Spain between 10 and 13%. As EMU (Economic and Monetary Union) approached, yields converged and remained almost identical until 2008. Then they opened up again. What explained spreads before EMU?&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Exchange rate risk&lt;/button&gt;&lt;button&gt;Default risk&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;
        &lt;ul&gt;
          &lt;li&gt;The periphery&#x27;s currency (lira, peseta, drachma…) could &lt;b&gt;devalue&lt;/b&gt; against the core&#x27;s: lenders demanded a premium.&lt;/li&gt;
          &lt;li&gt;The introduction of the euro eliminated the &lt;i&gt;perception&lt;/i&gt; of this risk.&lt;/li&gt;
          &lt;li&gt;But the risk re-emerged as &lt;b&gt;redenomination risk&lt;/b&gt; (the slides say &quot;denomination risk&quot;): the fear that euro debts would be converted into new national currencies worth less than the euro.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p class=&quot;note&quot;&gt;Why an expected devaluation raises the risk premium: a topic for upcoming lectures (slide 31).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;
        &lt;ul&gt;
          &lt;li&gt;The periphery was considered at greater risk of default than the core.&lt;/li&gt;
          &lt;li&gt;The Maastricht Treaty introduced the &lt;b&gt;no bail-out&lt;/b&gt; clause: it is formally illegal for EU institutions, including the ECB, to bail out a country. The prohibition of monetary financing also prevents &quot;printing&quot; money to pay off the debt.&lt;/li&gt;
          &lt;li&gt;This eliminated the &lt;b&gt;inflation&lt;/b&gt; risk, i.e. repaying the debt by inflating it away, but left default risk fully in place.&lt;/li&gt;
          &lt;li&gt;So peripheral bonds &lt;b&gt;were not safe&lt;/b&gt;: they did not maintain payments in all circumstances (property 01) nor safety during a crisis (property 02).&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why does property 03 make safe-asset status fragile?&lt;/summary&gt;&lt;div&gt;If an asset is safe because everyone believes it is safe, a change in beliefs is enough for liquidity to disappear, the price to collapse and the asset to stop being safe. It is a form of multiple equilibria, as in 2010–2012.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What is redenomination risk?&lt;/summary&gt;&lt;div&gt;The risk that a bond issued in euros will be repaid in a new, less valuable national currency if the country leaves the euro. It is exchange rate risk &quot;reborn&quot; inside the union.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Did the no bail-out clause reduce or increase perceived default risk?&lt;/summary&gt;&lt;div&gt;It made it explicit: without bail-outs and without monetary financing, the inflationary &quot;way out&quot; disappears and only default remains. Before the crisis markets ignored it; during the crisis they priced it in.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section id=&quot;doom-loop&quot; class=&quot;part s-ocra&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slides 32–36&lt;/span&gt;
    &lt;h2&gt;Other amplifiers: banking crisis, doom loop and austerity&lt;/h2&gt;
    &lt;h3&gt;From sovereign crisis to banking crisis&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;Investors leave the domestic government bond market: rates rise and prices collapse.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Domestic banks, which normally &lt;b&gt;hold large amounts of government bonds&lt;/b&gt;, suffer heavy losses.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;There is also a &lt;b&gt;funding problem&lt;/b&gt;: domestic liquidity dries up as the money stock falls, and banks struggle to roll over deposits except by paying prohibitive rates.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;The sovereign debt crisis is thus transmitted to the banking system, &lt;b&gt;even if the banks were sound to begin with&lt;/b&gt;.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Doom loop&lt;/b&gt; (also called the &lt;i&gt;diabolic loop&lt;/i&gt;): a country is at risk of one when a shock to one part of the economic system is amplified through its effects on another part. The riskiest link is between &lt;b&gt;banks and the government&lt;/b&gt;, i.e. the sovereign and its debt. The second is between &lt;b&gt;banks and the economy&lt;/b&gt;, the third between &lt;b&gt;the sovereign and the economy&lt;/b&gt;.&lt;/div&gt;
    &lt;figure class=&quot;loop&quot;&gt;
      &lt;svg id=&quot;loopSvg&quot; viewBox=&quot;0 0 620 360&quot; role=&quot;img&quot; aria-label=&quot;The three interlinked crises according to Shambaugh&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;loopTxt&quot; class=&quot;def&quot; style=&quot;margin:6px 0 0&quot;&gt;Click an arrow to read the mechanism.&lt;/div&gt;
      &lt;figcaption&gt;The euro&#x27;s three crises according to Shambaugh, &quot;The Euro&#x27;s Three Crises&quot;, Brookings Papers on Economic Activity, 2012 (slide 35). For further reading, see the &quot;Doom Loop&quot; reading on Moodle indicated on slide 34.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;The link between banks and crises recalls the &lt;b&gt;2022 Nobel Prize in Economic Sciences&lt;/b&gt; awarded to Bernanke, Diamond and Dybvig (slide 32): banks are inherently exposed to depositor &quot;runs&quot;, and bank failures deepen and prolong recessions.&lt;/p&gt;

    &lt;h3&gt;Automatic stabilizers &quot;switched off&quot;&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 620 210&quot; role=&quot;img&quot; aria-label=&quot;Cycle that switches off the automatic stabilizers&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ah3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Recession&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;stabilizers at work&lt;/text&gt;
          &lt;rect x=&quot;225&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Higher deficits&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;G rises, T falls&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Market distrust&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;in the ability to pay&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;130&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;154&quot; font-weight=&quot;600&quot;&gt;Liquidity and solvency&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;172&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;crisis&lt;/text&gt;
          &lt;rect x=&quot;225&quot; y=&quot;130&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;154&quot; font-weight=&quot;600&quot;&gt;Austerity&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;172&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;in the middle of a recession&lt;/text&gt;
          &lt;path d=&quot;M190 58 H222 M395 58 H427 M515 86 V127 M430 158 H398 M225 158 H105 V89&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ah3)&quot;/&gt;
          &lt;text x=&quot;140&quot; y=&quot;178&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;deeper recession&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Slide 36: these dynamics make it very difficult for EMU members to use automatic stabilizers. The budget, which was supposed to act as a buffer, ends up amplifying the cycle.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Self-check&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Why can even sound banks get into trouble?&lt;/summary&gt;&lt;div&gt;Through two channels: losses on the government bonds they hold, whose price collapses, and funding problems because domestic liquidity dries up with capital flight.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;What are the three sides of the doom loop?&lt;/summary&gt;&lt;div&gt;Banks ↔ sovereign: bank bail-outs and government bonds on bank balance sheets. Banks ↔ economy: less credit, and a weak economy damages banks. Sovereign ↔ economy: austerity holds back growth, and low growth makes the sovereign insolvent.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Why are the stabilizers said to be &quot;switched off&quot;?&lt;/summary&gt;&lt;div&gt;Because the deficit they produce in a recession triggers distrust and a debt crisis. This forces the government into austerity, which cancels out the stabilizing effect and even reverses it.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- REFS --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part refs&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Annotated bibliography&lt;/div&gt;
    &lt;h2&gt;Further reading&lt;/h2&gt;
    &lt;p&gt;Authors, studies, legal provisions and data sources cited in the slides. The descriptions and links come from a web search: each entry is marked as &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;. The slide reference shows where it appears in the lecture.&lt;/p&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eichengreen, Hausmann, Panizza: &quot;Original Sin&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;They define original sin as the inability of emerging countries to borrow abroad in their own currency. They argue that it stems mainly from structural features of international capital markets and not only from bad policies. The 2005 version is a chapter in the volume &lt;i&gt;Other People&#x27;s Money&lt;/i&gt; (University of Chicago Press); earlier working papers exist (&quot;The Pain, the Mystery, and the Road to Redemption&quot;, 2002; &quot;The Road to Redemption&quot;, 2003).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the analogy on which slide 21 rests. A euro country finds itself in the same position as a borrower in foreign currency.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eml.berkeley.edu/~eichengr/research/osroadaug21-03.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eichengreen, Hausmann, Panizza, &quot;Original Sin: The Road to Redemption&quot; (PDF, Eichengreen&#x27;s website, UC Berkeley)&lt;/a&gt; · &lt;a href=&quot;https://repository.graduateinstitute.ch/record/286974/files/hausmann2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2002 version (PDF, Graduate Institute Geneva)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Calvo et al., 2006: sudden stop and liability dollarization&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The 2006 paper found on this topic is by Guillermo A. Calvo alone: &quot;Monetary Policy Challenges in Emerging Markets: Sudden Stop, Liability Dollarization, and Lender of Last Resort&quot;, NBER Working Paper 12788. It argues that emerging markets&#x27; financial fragilities reduce the effectiveness of a domestic lender of last resort and that during a sudden stop the central bank should use international reserves. With co-authors (Calvo, Izquierdo, Talvi, NBER WP 9828, 2003) he analyses the Argentine case: sudden stop plus dollar-denominated debt.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it explains the &quot;sudden stop&quot; mechanism that slide 21 applies to Spain. Note: the slide says &quot;Calvo et al., 2006&quot;; check the course bibliography to see which text it refers to.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w12788&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w12788 (Calvo, 2006)&lt;/a&gt; · &lt;a href=&quot;https://nber.org/system/files/working_papers/w9828/w9828.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w9828 (Calvo, Izquierdo, Talvi, PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Brunnermeier and Reis (2019), &quot;A Crash Course on the Euro Crisis&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Markus K. Brunnermeier (Princeton) and Ricardo Reis (LSE). A text designed for teaching: it presents seven models, including the misallocation of capital inflows, shadow banking, the diabolic loop and regional &quot;flights to safety&quot;, and uses them to reconstruct the 2010–12 euro crisis. Several versions exist: NBER WP 26229, CEPR DP 14016, CFM DP 1915.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the core vs periphery chart (slide 28) and covers almost all the topics of the lecture with simple models.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/p/nbr/nberwo/26229.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc entry (NBER WP 26229)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jay C. Shambaugh (2012), &quot;The Euro&#x27;s Three Crises&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Brookings Papers on Economic Activity, Spring 2012, pp. 157–231, with comments by Hélène Rey and Ricardo Reis. Thesis: the euro area is experiencing three interlocking crises: a banking crisis, a sovereign debt crisis and a growth crisis. Weak banks and high debt reinforce each other, low growth worsens both, and austerity holds back growth. Policies that ignore these interdependencies risk being incomplete or counterproductive.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the doom loop diagram (slide 35) and of the long-run spread chart (slide 29).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.brookings.edu/articles/the-euros-three-crises/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brookings page&lt;/a&gt; · &lt;a href=&quot;https://www.brookings.edu/wp-content/uploads/2012/03/2012a_Shambaugh.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2022 Nobel Prize in Economic Sciences: Bernanke, Diamond, Dybvig&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Awarded &quot;for research on banks and financial crises&quot;. Diamond and Dybvig (1983) explain why banks exist and why their role, transforming demand deposits into long-term loans, makes them vulnerable to rumours of failure and to bank runs. They also show that deposit insurance and a lender of last resort can prevent them. Bernanke showed that bank failures made the Great Depression longer and deeper.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it provides the theoretical foundation for the banking crisis as an amplifier (slides 32–33) and for the idea of multiple equilibria underlying self-fulfilling crises.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2022/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official press release (nobelprize.org)&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/uploads/2022/10/popular-economicsciencesprize2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Popular science background (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Maastricht Treaty: no bail-out clause (now Art. 125 TFEU)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Article 125 of the Treaty on the Functioning of the European Union (ex Art. 103 TEC) states that the Union shall not be liable for or assume the commitments of member states&#x27; public authorities, and that no member state shall be liable for another. It is linked to the prohibition of monetary financing in Art. 123. In the &lt;i&gt;Pringle&lt;/i&gt; judgment (2012) the Court of Justice held that financial assistance from the ESM (European Stability Mechanism) is compatible with Art. 125, provided it is indispensable for the stability of the euro area and subject to strict conditionality.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the provision referred to on slide 31. It explains why inflation risk disappeared while default risk remained.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 125 TFEU on EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eurostat: government deficit and debt&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The debt-to-GDP and deficit-to-GDP data for Spain and the United Kingdom (slides 15–16) come from Eurostat. The reference dataset is &lt;i&gt;gov_10dd_edpt1&lt;/i&gt; (&quot;Government deficit/surplus, debt and associated data&quot;): consolidated gross debt according to the excessive deficit procedure (EDP) definition, at year end, under the ESA 2010 standard.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it lets you repeat the UK–Spain comparison yourself or extend it to other countries.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat Data Browser: gov_10dd_edpt1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ISTAT: income distribution in Italy&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The Italian National Institute of Statistics is the source of the chart on the distribution of Italian incomes in 2010 (slide 6), broken down into pensions, employee income and self-employment income.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it shows with real data the right-skewed shape on which the argument about progressive taxation rests.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.istat.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;istat.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bank of England&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The central bank of the United Kingdom, responsible for monetary policy for sterling. In the case on slide 19 it is the &quot;superior force&quot;: it can buy UK government bonds and act as lender of last resort to the sovereign.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bankofengland.co.uk/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bankofengland.co.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot; style=&quot;border-style:dashed&quot;&gt;&lt;h4&gt;Related reading (not cited in the slides): De Grauwe (2011), &quot;The Governance of a Fragile Eurozone&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;CEPS Working Document No. 346, May 2011. It is the well-known origin of the UK vs Spain argument: by joining an MU, governments lose control over the currency of their debt and become exposed to market-induced defaults and self-fulfilling crises. The paper also criticizes the ESM for failing to take this fragility into account and for possibly discouraging the use of automatic stabilizers.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://cdn.ceps.eu/wp-content/uploads/2011/05/WD%20346%20De%20Grauwe%20on%20Eurozone%20Governance.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF on CEPS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;p class=&quot;note&quot;&gt;The &quot;Doom Loop&quot; reading cited on slide 34 is on the course&#x27;s Moodle platform, so it cannot be linked here.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

})();

    var msg=pb&lt;=0?&quot;With g ≥ i the debt-to-GDP ratio falls even with a small primary deficit: no tightening needed.&quot;:pb&lt;2?&quot;Modest effort: the situation is manageable.&quot;:pb&lt;4?&quot;A sizeable primary surplus is needed: higher taxes or lower spending.&quot;:&quot;Very high primary surplus, hard to sustain for long: here the liquidity crisis risks turning into a solvency crisis.&quot;;
