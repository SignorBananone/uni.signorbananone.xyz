      &lt;figcaption&gt;La freccia tratteggiata chiude il cerchio: la dinamica dei punti 3–7 rende difficile usare proprio gli automatic stabilizers del punto 2 (slide 36).&lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S1 --&gt;
&lt;section id=&quot;indipendenza&quot; class=&quot;part s-ardesia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 1–2&lt;/span&gt;
    &lt;h2&gt;Monetary independence e government budgets&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Le lezioni precedenti hanno mostrato il primo costo dell&#x27;euro: senza politica monetaria propria è più difficile reagire agli asymmetric shocks. La crisi del 2008 e quella dei debiti sovrani hanno mostrato un secondo costo, meno visibile: cambia il modo in cui uno Stato può finanziare il proprio deficit.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary independence&lt;/b&gt; (indipendenza monetaria): la possibilità per un Paese di fissare i propri tassi d&#x27;interesse, lasciar variare il proprio cambio e, all&#x27;occorrenza, creare la moneta in cui è denominato il suo debito.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Asymmetric shock&lt;/b&gt; (shock asimmetrico): un evento che colpisce un Paese dell&#x27;unione, o lo colpisce più degli altri. Una sola banca centrale non può dare a ciascuno la politica di cui ha bisogno.&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Primo costo (già visto)&lt;/h4&gt;&lt;p&gt;Niente tassi né cambio nazionali: &lt;b&gt;meno strumenti&lt;/b&gt; per assorbire uno shock che colpisce solo te. È il tema della teoria della optimum currency area (area valutaria ottimale).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--acc)&quot;&gt;&lt;h4&gt;Secondo costo (questa lezione)&lt;/h4&gt;&lt;p&gt;Il governo si indebita in una moneta che &lt;b&gt;non controlla&lt;/b&gt;: cambia la sua &lt;span style=&quot;color:var(--acc)&quot;&gt;capacità di finanziare i deficit&lt;/span&gt;, e i mercati acquistano potere su di lui.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Collegamenti: le slide richiamano le lezioni precedenti sugli asymmetric shocks (slide 2), le lezioni sulla politica fiscale per il CAB (slide 8) e le prossime lezioni sul premio al rischio legato alla svalutazione attesa (slide 31).&lt;/p&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Quali sono i due costi della perdita di monetary independence?&lt;/summary&gt;&lt;div&gt;(1) Meno strumenti contro gli asymmetric shocks: niente tasso d&#x27;interesse né cambio nazionali. (2) Una diversa e più fragile capacità di finanziare i deficit, perché il debito è emesso in una valuta che lo Stato non controlla.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché la crisi del 2008 è un &quot;add-on&quot;, un&#x27;aggiunta, alla teoria?&lt;/summary&gt;&lt;div&gt;La teoria tradizionale dell&#x27;unione monetaria guardava soprattutto all&#x27;aggiustamento macro: cambio, salari, mobilità del lavoro. La crisi ha mostrato che anche i mercati finanziari e il debito pubblico possono rendere instabile un&#x27;unione.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section id=&quot;stabilizzatori&quot; class=&quot;part s-salvia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 3–8&lt;/span&gt;
    &lt;h2&gt;Budget deficits e automatic stabilizers&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;In recessione il deficit pubblico cresce da solo, senza che il governo decida nulla. Non è necessariamente un errore: è il bilancio che fa da cuscinetto.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Automatic stabilizers&lt;/b&gt; (stabilizzatori automatici): voci del bilancio pubblico che si muovono da sole con il ciclo e sostengono il reddito nelle fasi negative. Gli esempi delle slide sono gli &lt;i&gt;unemployment benefits&lt;/i&gt; (sussidi di disoccupazione) e la &lt;i&gt;progressive taxation&lt;/i&gt; (tassazione progressiva).&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Transitory shocks&lt;/b&gt; (shock transitori): i boom e le recessioni (&lt;i&gt;booms and busts&lt;/i&gt;) legati alle fasi del business cycle, il ciclo economico. Sono temporanei per definizione, e quindi un deficit temporaneo è il modo naturale per assorbirli.&lt;/div&gt;

    &lt;h3&gt;Come funzionano: segui la catena&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;Arriva una recessione: il reddito &lt;i&gt;Y&lt;/i&gt; scende e la disoccupazione sale.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;b&gt;Lato spesa:&lt;/b&gt; crescono gli &lt;i&gt;unemployment benefits&lt;/i&gt;, quindi la spesa pubblica &lt;i&gt;G&lt;/i&gt; aumenta. Il governo agisce da &lt;i&gt;buffer&lt;/i&gt;, cioè da cuscinetto.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;Lato entrate:&lt;/b&gt; la distribuzione dei redditi si sposta a sinistra; più persone finiscono negli scaglioni bassi e l&#x27;aliquota media &lt;i&gt;t&lt;/i&gt; scende.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;Il gettito &lt;i&gt;T&lt;/i&gt; cala &lt;b&gt;due volte&lt;/b&gt;: perché &lt;i&gt;Y&lt;/i&gt; è sceso e perché &lt;i&gt;t&lt;/i&gt; è sceso.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;Risultato: il deficit (&lt;i&gt;G − T&lt;/i&gt;) si allarga automaticamente e il reddito disponibile delle famiglie cala meno del reddito lordo. La recessione è attenuata.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Progressive taxation e distribuzione dei redditi&lt;/h3&gt;
    &lt;p&gt;Con la tassazione progressiva l&#x27;aliquota cresce con il reddito. È la regola tipica dell&#x27;imposta sul reddito personale. Scaglioni e aliquote li decide ciascun governo e cambiano da Paese a Paese e nel tempo. Poiché le aliquote dipendono dal reddito, l&#x27;&lt;b&gt;aliquota media cambia quando cambia la distribuzione dei redditi&lt;/b&gt;, per esempio lungo il ciclo. Per questo è un automatic stabilizer importante.&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;t = Σ&lt;sub&gt;i=1&lt;/sub&gt;&lt;sup&gt;n&lt;/sup&gt; t&lt;sub&gt;i&lt;/sub&gt; · Y&lt;sub&gt;i&lt;/sub&gt; / Y &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; T = Σ&lt;sub&gt;i=1&lt;/sub&gt;&lt;sup&gt;n&lt;/sup&gt; t&lt;sub&gt;i&lt;/sub&gt; · Y&lt;sub&gt;i&lt;/sub&gt; = t · Y&lt;small&gt;t&lt;sub&gt;i&lt;/sub&gt; = aliquota dello scaglione i · Y&lt;sub&gt;i&lt;/sub&gt; = reddito che ricade nello scaglione i · Y = reddito totale. L&#x27;aliquota media è una &lt;b&gt;media ponderata&lt;/b&gt; delle aliquote, con pesi Y&lt;sub&gt;i&lt;/sub&gt;/Y.&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;Le distribuzioni reali sono &lt;i&gt;right skewed&lt;/i&gt; (asimmetriche a destra): tanti redditi bassi o medi e una lunga coda di redditi alti. Nell&#x27;esempio delle slide (Italia 2010, dati ISTAT) i picchi stanno intorno ai 11–18 mila euro: pensioni più concentrate in basso, dipendenti con picco verso i 18 mila, autonomi più dispersi e con una coda più lunga.&lt;/p&gt;

    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Shock negativo al reddito &lt;input type=&quot;range&quot; id=&quot;taxShock&quot; min=&quot;0&quot; max=&quot;25&quot; value=&quot;10&quot; step=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;taxShockV&quot;&gt;10%&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;taxSvg&quot; viewBox=&quot;0 0 620 290&quot; role=&quot;img&quot; aria-label=&quot;Distribuzione dei redditi prima e dopo lo shock, con scaglioni&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;readout&quot; id=&quot;taxOut&quot;&gt;&lt;/div&gt;
      &lt;figcaption&gt;Ricostruzione interattiva del grafico della slide 7. Curva piena: distribuzione iniziale; tratteggiata: dopo lo shock, spostata a sinistra. Scaglioni e aliquote (23, 27, 38, 41, 43%) sono illustrativi, ispirati all&#x27;IRPEF; la distribuzione è una curva gamma con media 30 mila euro. Come nella slide, a ogni reddito si applica l&#x27;aliquota del suo scaglione. Guarda il gettito: scende più del reddito.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;h3&gt;Da ricordare (slide 8)&lt;/h3&gt;
    &lt;details open&gt;&lt;summary&gt;La risposta del bilancio al ciclo è un indicatore di policy&lt;/summary&gt;&lt;p&gt;Misurare quanto entrate e spese reagiscono al ciclo serve a calcolare il &lt;b&gt;Cyclically Adjusted Budget Balance (CAB)&lt;/b&gt;, cioè il saldo di bilancio corretto per il ciclo: il saldo che si avrebbe con l&#x27;economia al potenziale. Il CAB separa la parte &quot;automatica&quot; del deficit da quella decisa dal governo. Se ne parla nelle lezioni sulla politica fiscale.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nell&#x27;unione monetaria, poco spazio per la stabilizzazione nazionale&lt;/summary&gt;&lt;p&gt;Le regole fiscali comuni e la situazione di bilancio di partenza (&lt;i&gt;budgetary stance&lt;/i&gt;) possono lasciare &lt;span style=&quot;color:var(--acc)&quot;&gt;poco spazio alle stabilization policies&lt;/span&gt; a livello nazionale.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il ciclo può essere esasperato&lt;/summary&gt;&lt;p&gt;Se i governi sono costretti all&#x27;&lt;b&gt;austerity&lt;/b&gt; (tagli di spesa e aumenti di tasse in piena recessione), il bilancio perde la sua capacità stabilizzatrice e anzi spinge nella stessa direzione dello shock: &lt;span style=&quot;color:var(--acc)&quot;&gt;business cycle movements may be exacerbated&lt;/span&gt;.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le differenze tra Paesi alimentano asimmetrie&lt;/summary&gt;&lt;p&gt;Se un Paese può lasciar lavorare gli stabilizzatori e un altro deve fare austerità, le loro economie divergono ancora di più: le politiche stesse diventano fonte di asimmetria dentro l&#x27;unione.&lt;/p&gt;&lt;/details&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché, con tasse progressive, il gettito cala più che proporzionalmente al reddito?&lt;/summary&gt;&lt;div&gt;Perché T = t·Y e in recessione scendono entrambi i fattori: Y cala, e la distribuzione si sposta verso scaglioni con aliquote più basse, quindi anche l&#x27;aliquota media t cala.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cosa misura il CAB e perché serve?&lt;/summary&gt;&lt;div&gt;Il saldo di bilancio corretto per il ciclo. Togliendo l&#x27;effetto degli automatic stabilizers mostra la componente discrezionale o strutturale della politica fiscale.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Con una flat tax pura (aliquota unica) gli stabilizzatori sparirebbero?&lt;/summary&gt;&lt;div&gt;No, si indebolirebbero. Il gettito scenderebbe comunque in proporzione al reddito, ma t resterebbe costante, quindi mancherebbe il &quot;secondo&quot; effetto. Resterebbero anche gli unemployment benefits dal lato della spesa.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section id=&quot;fragilita&quot; class=&quot;part s-ocra&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 9–13 e 21&lt;/span&gt;
    &lt;h2&gt;Debito in una valuta che non si controlla&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Quando in recessione il deficit cresce, conta una sola domanda: gli investitori credono che il governo potrà rimborsare i titoli in scadenza?&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Paese &quot;stand-alone&quot;&lt;/h4&gt;&lt;p&gt;Emette debito nella &lt;b&gt;propria&lt;/b&gt; valuta. La sua banca centrale (di solito) è pronta a fornire liquidità in caso di &lt;i&gt;liquidity crisis&lt;/i&gt;. Ai creditori un pagamento alla scadenza è garantito, almeno in termini nominali.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Membro di una MU&lt;/h4&gt;&lt;p&gt;Emette debito in una valuta su cui &lt;b&gt;non ha controllo&lt;/b&gt;. La banca centrale è quella di &lt;b&gt;tutta&lt;/b&gt; l&#x27;area valutaria, non del singolo Stato, ed è indipendente dai governi. Il governo &lt;b&gt;non può garantire&lt;/b&gt; che i bondholders (i detentori dei titoli) saranno pagati.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Conclusione delle slide: &lt;span style=&quot;color:var(--acc);font-weight:600&quot;&gt;financial markets acquire power&lt;/span&gt;. I mercati finanziari acquistano il potere di forzare un default (l&#x27;insolvenza) di questi Paesi membri. Come? Vendendo.&lt;/p&gt;

    &lt;h3&gt;Due scenari durante un ciclo asincrono&lt;/h3&gt;
    &lt;p&gt;Nell&#x27;eurozona (EZ) gli investitori hanno in portafoglio titoli di Stato di molti Paesi membri. Supponi che il Paese B sia in recessione ed emetta nuovi titoli, mentre il Paese A è in boom e il suo deficit scende.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Gli investitori si fidano&lt;/button&gt;&lt;button&gt;Gli investitori non si fidano&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Se si fidano dell&#x27;unione, gli investitori &lt;b&gt;comprano più titoli di B&lt;/b&gt;, che ne emette di nuovi, e riducono quelli di A, che ne emette meno. I risparmi si spostano verso chi ne ha bisogno: l&#x27;unione fa da assicurazione e il deficit di B si finanzia senza problemi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Se diffidano dell&#x27;unione e di B, si &lt;b&gt;rifiutano di comprare&lt;/b&gt; nuovi titoli di B, &lt;b&gt;vendono&lt;/b&gt; quelli che hanno già e comprano titoli di A. È il passo da cui parte la catena della fragilità, qui sotto.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;&quot;Monetary union is fragile&quot;: la catena&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;b&gt;Distrust.&lt;/b&gt; Gli investitori diffidano di un governo membro e vendono i suoi titoli.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Il &lt;b&gt;prezzo&lt;/b&gt; dei titoli scende, il che equivale a dire che il &lt;b&gt;rendimento&lt;/b&gt; richiesto sale. Prezzo e rendimento di un titolo si muovono sempre in direzioni opposte.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;Liquidity crisis.&lt;/b&gt; Il governo fatica a trovare compratori a un tasso ragionevole per rinnovare il debito in scadenza.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;b&gt;Solvency crisis.&lt;/b&gt; Con tassi più alti il peso del debito cresce: servono più tasse e meno spesa.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;b&gt;Forced austerity.&lt;/b&gt; Le politiche fiscali restrittive arrivano proprio in recessione e amplificano lo shock iniziale.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;b&gt;Sovereign debt crisis.&lt;/b&gt; Diventa sempre più probabile che l&#x27;unica scelta sia smettere di servire il debito. Se i fondamentali erano sani, la crisi è &lt;b&gt;self-fulfilling&lt;/b&gt;.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Liquidity crisis o solvency crisis?&lt;/h3&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Liquidity crisis&lt;/th&gt;&lt;th&gt;Solvency crisis&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Che cos&#x27;è&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Lo Stato è &lt;i&gt;temporaneamente&lt;/i&gt; a corto di contante o di attività liquide per gli obblighi a breve, magari per le condizioni di mercato o per il panico dei creditori.&lt;/td&gt;&lt;td&gt;Le passività totali superano la capacità di rimborso &lt;i&gt;nel lungo periodo&lt;/i&gt;. Uno squilibrio fiscale di fondo rende il debito impagabile.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Indebitarsi aiuta?&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sì: basta superare il momento.&lt;/td&gt;&lt;td&gt;No: altro debito non risolve.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Soluzione&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Prestiti a breve o sostegno temporaneo di prestatori esterni, come le istituzioni internazionali.&lt;/td&gt;&lt;td&gt;Misure drastiche: ristrutturazione del debito, austerity, nei casi estremi default.&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Self-fulfilling debt crisis&lt;/b&gt; (crisi del debito che si autoavvera): una crisi del debito sovrano che colpisce un Paese con fondamentali relativamente sani. Le aspettative pessimistiche del mercato alzano i &lt;i&gt;sovereign spreads&lt;/i&gt; (il differenziale di rendimento rispetto al Paese più sicuro), indeboliscono i conti pubblici e alla fine rendono davvero più probabile il default. La paura produce ciò che teme: una liquidity crisis si trasforma in solvency crisis.&lt;/div&gt;

    &lt;h4&gt;Prova: quanto pesa lo spread su un debito alto?&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;Integrazione didattica (non nelle slide): è l&#x27;aritmetica standard della sostenibilità del debito, utile a capire il passaggio da liquidity a solvency. Il saldo primario (saldo al netto degli interessi) che tiene fermo il rapporto debito/PIL è circa (i − g)·d.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Debito/PIL d &lt;input type=&quot;range&quot; id=&quot;dD&quot; min=&quot;40&quot; max=&quot;160&quot; value=&quot;100&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dDv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Spread &lt;input type=&quot;range&quot; id=&quot;dS&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.25&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dSv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Crescita nominale g &lt;input type=&quot;range&quot; id=&quot;dG&quot; min=&quot;-3&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;dGv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;debtSvg&quot; viewBox=&quot;0 0 620 100&quot; role=&quot;img&quot; aria-label=&quot;Spesa per interessi e avanzo primario richiesto&quot;&gt;&lt;/svg&gt;
      &lt;p id=&quot;debtMsg&quot; class=&quot;def&quot; style=&quot;margin:8px 0 0&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;figcaption&gt;Tasso privo di rischio fissato al 2%, quindi i = 2% + spread. Semplificazione: nella realtà il tasso più alto colpisce solo il debito che viene rinnovato, quindi l&#x27;effetto arriva gradualmente.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché la vendita di titoli di un Paese ne fa salire il tasso?&lt;/summary&gt;&lt;div&gt;Il titolo paga cedole fisse. Se il prezzo scende, chi lo compra ottiene lo stesso flusso pagando meno, quindi il rendimento effettivo sale. Anche le nuove emissioni dovranno offrire quel rendimento più alto.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Come può una liquidity crisis diventare una solvency crisis?&lt;/summary&gt;&lt;div&gt;Tassi alti per un periodo lungo aumentano la spesa per interessi e il peso del debito. Questo impone austerità, che riduce la crescita, e un debito sostenibile diventa insostenibile.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quando si parla di crisi self-fulfilling?&lt;/summary&gt;&lt;div&gt;Quando il Paese entra in crisi pur avendo fondamentali relativamente sani: sono le aspettative pessimistiche, attraverso spread più alti, a creare le condizioni del default.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section id=&quot;uk-spagna&quot; class=&quot;part s-ardesia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 14–20&lt;/span&gt;
    &lt;h2&gt;UK (&quot;stand-alone&quot;) vs Spagna (membro della MU)&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Due Paesi con conti pubblici simili, anzi peggiori nel Regno Unito fino al 2011, ma con destini opposti sui mercati. La differenza è avere o non avere una propria banca centrale.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;tabs&quot; data-tabs id=&quot;ukTabs&quot; style=&quot;margin:0&quot;&gt;
        &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Debito/PIL&lt;/button&gt;&lt;button&gt;Deficit/PIL&lt;/button&gt;&lt;button&gt;Rendimento a 10 anni&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;ukSvg&quot; viewBox=&quot;0 0 620 300&quot; role=&quot;img&quot; aria-label=&quot;Confronto Spagna e Regno Unito&quot;&gt;&lt;/svg&gt;
      &lt;figcaption id=&quot;ukCap&quot;&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;&lt;b&gt;Lettura:&lt;/b&gt; fino al 2011 il Regno Unito aveva più debito della Spagna e deficit simili. Eppure dal 2010 il rendimento spagnolo a 10 anni sale fino a circa il 6,8% (estate 2012), mentre quello britannico scende verso l&#x27;1,5%. I mercati non prezzano soltanto i conti: prezzano chi garantisce la liquidità.&lt;/p&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;stepper&quot; data-stepper style=&quot;--c:var(--ardesia)&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;🇬🇧 Se gli investitori temono il default del Regno Unito&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;Vendono titoli di Stato britannici: i prezzi scendono e i rendimenti salgono.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Alcuni portano i fondi all&#x27;estero e &lt;b&gt;vendono sterline&lt;/b&gt; in cambio di altre valute.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;La pressione al ribasso fa &lt;b&gt;svalutare&lt;/b&gt; la sterlina.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;Conta il &lt;b&gt;forex&lt;/b&gt; (il mercato dei cambi): la competitività migliora.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;La &lt;b&gt;Bank of England&lt;/b&gt; tollera la svalutazione e può abbassare il tasso di policy.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;I deflussi di capitale si riducono e possono invertirsi: la sterlina debole attira chi cerca attività britanniche sottovalutate.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;La liquidità resta in sterline e viene via via reinvestita in attività britanniche, titoli di Stato compresi.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;Se serve, la BoE &lt;b&gt;compra titoli di Stato&lt;/b&gt;: è un &lt;i&gt;lender of last resort&lt;/i&gt; (prestatore di ultima istanza) per il sovrano. Gli investitori non possono forzare il default e, sapendolo, non ci provano.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;→&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepper&quot; data-stepper style=&quot;--c:var(--mattone)&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;🇪🇸 Se gli investitori temono il default della Spagna&lt;/h4&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;Vendono titoli di Stato spagnoli: i rendimenti salgono.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Con il ricavato comprano altre attività dell&#x27;eurozona, per esempio i Bund tedeschi.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;b&gt;Nessun mercato dei cambi né cambio flessibile&lt;/b&gt; frena il movimento: gli euro escono e basta.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;Lo stock di moneta spagnolo cala: si restringe la riserva di liquidità per comprare titoli spagnoli. Dove finiscono quegli euro? Altrove nell&#x27;area.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;b&gt;Non esiste una banca centrale spagnola&lt;/b&gt; che possa essere obbligata a comprare titoli spagnoli.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;Liquidity crisis possibile: il governo non riesce a finanziare le emissioni a un tasso ragionevole.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;Può essere costretto al default.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;Gli investitori lo sanno, e sono &lt;b&gt;tentati di provarci&lt;/b&gt;.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;→&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Il paradosso: come un&#x27;economia emergente&lt;/h3&gt;
    &lt;p&gt;Entrare in una MU &lt;b&gt;indebolisce&lt;/b&gt; la posizione di un Paese verso i mercati finanziari. La Spagna somiglia alle economie emergenti costrette a indebitarsi in valuta estera, e per questo finanziariamente fragili.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sudden stop&lt;/h4&gt;&lt;p&gt;Un improvviso blocco degli afflussi di capitale che porta a una liquidity crisis.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Liability dollarization&lt;/h4&gt;&lt;p&gt;Debiti denominati in valuta estera, tipicamente in dollari (Calvo et al., 2006). Se il cambio crolla, il valore dei debiti esplode in moneta locale.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Original sin&lt;/h4&gt;&lt;p&gt;L&#x27;incapacità di un Paese di indebitarsi all&#x27;estero nella propria valuta (Eichengreen, Hausmann e Panizza).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;blockquote class=&quot;def&quot; style=&quot;font-family:var(--serif);font-style:italic&quot;&gt;&quot;Capital flows are more volatile and prone to reversal. Countries burdened with original sin have lower credit ratings and hence more tenuous access to international capital markets than their levels of indebtedness and other creditworthiness indicators would lead one to predict.&quot; &lt;span class=&quot;src&quot;&gt;(EHP, 2005, citato nella slide 21)&lt;/span&gt;&lt;/blockquote&gt;
    &lt;p class=&quot;note&quot;&gt;Il nesso: un membro dell&#x27;euro ha in pratica un &quot;original sin&quot; senza essere un Paese emergente. Si indebita in una moneta che, per lui, si comporta come una valuta estera.&lt;/p&gt;

    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Qual è la &quot;superior force&quot; che protegge il Regno Unito?&lt;/summary&gt;&lt;div&gt;La Bank of England, che può creare sterline senza limiti e comprare titoli di Stato come lender of last resort. Contro di lei la speculazione non può vincere, quindi non parte nemmeno.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché in Spagna la liquidità &quot;esce&quot; e nel Regno Unito no?&lt;/summary&gt;&lt;div&gt;Chi vende gilt (i titoli di Stato britannici) e vuole uscire deve vendere sterline: la sterlina si svaluta e le sterline restano nel sistema britannico. Chi vende titoli spagnoli riceve euro e può spostarli in Germania o in Olanda senza alcun rischio di cambio: la massa monetaria spagnola si riduce davvero.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Spiega l&#x27;analogia con l&#x27;original sin.&lt;/summary&gt;&lt;div&gt;Le economie emergenti si indebitano in una valuta che non emettono, il dollaro. I Paesi dell&#x27;euro si indebitano in euro, che però è emesso dalla BCE e non dalla banca centrale nazionale. In entrambi i casi manca un prestatore di ultima istanza nazionale e si è esposti ai sudden stops.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section id=&quot;amplificazione&quot; class=&quot;part s-mattone&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 21–24&lt;/span&gt;
    &lt;h2&gt;Amplificazione degli asymmetric shocks&lt;/h2&gt;
    &lt;p class=&quot;lead&quot;&gt;Se lo shock era già asimmetrico, la perdita di fiducia nel governo di B lo &lt;span style=&quot;color:var(--acc)&quot;&gt;amplifica in entrambi i Paesi&lt;/span&gt;: B va più giù, A va più su.&lt;/p&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;&lt;label&gt;Perdita di fiducia dei mercati nel Paese B &lt;input type=&quot;range&quot; id=&quot;adS&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;adSv&quot;&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;svg id=&quot;adSvg&quot; viewBox=&quot;0 0 620 270&quot; role=&quot;img&quot; aria-label=&quot;Domanda e offerta aggregata nei Paesi B e A&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Ricostruzione della slide 22 (modello AD-AS: domanda aggregata e offerta aggregata). D = domanda iniziale; D′ = dopo lo shock asimmetrico (a sinistra in B, a destra in A); D″ = dopo i flussi di capitale da B verso A. Il punto indica l&#x27;equilibrio: prezzi e output.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Paese con shock negativo (B)&lt;/th&gt;&lt;th&gt;Paese senza shock (A)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Gli investitori vendono i titoli del Paese colpito e di cui diffidano.&lt;/td&gt;&lt;td&gt;Gli investitori comprano i titoli del Paese di cui si fidano.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Il prezzo del titolo cala e il tasso sale: nasce una liquidity crisis.&lt;/td&gt;&lt;td&gt;Il prezzo del titolo sale e il tasso scende.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;La domanda aggregata si sposta ancora più a sinistra: &lt;b&gt;amplificazione dello shock negativo&lt;/b&gt;.&lt;/td&gt;&lt;td&gt;La domanda aggregata si sposta ancora più a destra: &lt;b&gt;amplificazione dello shock positivo&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;p&gt;Le variazioni dei tassi &lt;b&gt;destabilizzano&lt;/b&gt; il sistema invece di stabilizzarlo. Con una moneta propria il Paese in recessione avrebbe tassi più bassi; qui li ha più alti.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--ardesia)&quot;&gt;&lt;h4&gt;Short-term interest rate&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Comune&lt;/b&gt; a tutti i membri: lo fissa la banca centrale per l&#x27;intera unione.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;--c:var(--acc)&quot;&gt;&lt;h4&gt;Long-term government bond rates&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Divergono&lt;/b&gt; se gli investitori attribuiscono rischi diversi ai titoli dei vari governi.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Di che cosa è fatto un rendimento a lungo termine&lt;/h3&gt;
    &lt;div class=&quot;formula&quot;&gt;long-term yield = expected short rate + term premium + credit risk premium&lt;small&gt;expected short rate: tassi a breve attesi in futuro (politica monetaria) · term premium: compenso per la scadenza lunga (rischi di inflazione, di tasso e di liquidità) · credit risk premium: compenso per default, redenomination (conversione in nuova valuta) o svalutazione&lt;/small&gt;&lt;/div&gt;
    &lt;figure&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Tasso a breve atteso (comune) &lt;input type=&quot;range&quot; id=&quot;yR&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yRv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Term premium (comune) &lt;input type=&quot;range&quot; id=&quot;yT&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.8&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yTv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ctrlrow&quot;&gt;
        &lt;label&gt;Credit risk premium core &lt;input type=&quot;range&quot; id=&quot;yC&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;0.2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yCv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;Credit risk premium periferia &lt;input type=&quot;range&quot; id=&quot;yP&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;4.5&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;yPv&quot;&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;svg id=&quot;ySvg&quot; viewBox=&quot;0 0 620 150&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione dei rendimenti&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Le prime due componenti sono uguali per tutti i membri, quindi lo &lt;b&gt;spread&lt;/b&gt; (differenza tra i due rendimenti) misura solo la differenza di credit risk premium. Valori illustrativi; quelli iniziali sono vicini al 2012.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché in una MU i tassi a lungo termine possono destabilizzare?&lt;/summary&gt;&lt;div&gt;Il capitale fugge dal Paese in difficoltà verso quello sicuro: i tassi salgono dove c&#x27;è recessione e scendono dove c&#x27;è boom. È il contrario di una politica stabilizzante, e le due economie divergono.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quale componente del rendimento spiega lo spread tra Paesi dell&#x27;euro?&lt;/summary&gt;&lt;div&gt;Il credit risk premium. Il tasso a breve atteso dipende dalla BCE ed è comune a tutti; anche il term premium è simile.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Nel grafico AD-AS, che cosa rappresenta il passaggio da D′ a D″?&lt;/summary&gt;&lt;div&gt;L&#x27;effetto aggiuntivo dei flussi di capitale e dei tassi: tassi più alti e austerity in B, tassi più bassi in A. Non è un nuovo shock esterno: è l&#x27;amplificazione endogena dello shock iniziale.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section id=&quot;spread&quot; class=&quot;part s-salvia&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 25–31&lt;/span&gt;
    &lt;h2&gt;Investors&#x27; distrust, spread e safe asset&lt;/h2&gt;
    &lt;h3&gt;Che cos&#x27;è un safe asset&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;01&lt;/div&gt;&lt;p&gt;&lt;b&gt;Rischio limitato:&lt;/b&gt; lo stesso payoff in molti scenari futuri. Facile da vendere anche a persone con convinzioni e propensioni al rischio diverse.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;02&lt;/div&gt;&lt;p&gt;&lt;b&gt;Valore nelle crisi:&lt;/b&gt; proprio nei momenti di crisi il basso rischio e l&#x27;alta liquidità proteggono chi lo detiene.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;03&lt;/div&gt;&lt;p&gt;&lt;b&gt;È sicuro perché tutti lo considerano sicuro:&lt;/b&gt; gli scambi sono liquidissimi e il prezzo non scende. La sicurezza è anche una &lt;i&gt;credenza condivisa&lt;/i&gt;, che può svanire.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Periphery vs core: le credenze cambiano&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg id=&quot;cpSvg&quot; viewBox=&quot;0 0 620 270&quot; role=&quot;img&quot; aria-label=&quot;Rendimenti decennali core e periferia, profilo stilizzato&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Profilo stilizzato, ricostruito a occhio dal grafico di Brunnermeier e Reis (2019), slide 28. Core = Germania e Francia; periphery = Spagna, Italia, Irlanda, Portogallo e Grecia; medie ponderate per il PIL. Fino al 2008 le due serie quasi coincidono: tutti i titoli erano considerati safe assets. Nel 2010–2012 divergono perché &lt;b&gt;cambiano le credenze&lt;/b&gt;, con grandi flussi di capitale dalla periferia al core. Nella crisi la Grecia arriva intorno al 29% (slide 27).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;&lt;b&gt;Uno sguardo più lungo (slide 29, Shambaugh 2012).&lt;/b&gt; Negli anni &#x27;90, prima dell&#x27;euro, gli spread erano ampi: la Grecia partiva intorno al 25% nel 1993 e Italia e Spagna tra il 10 e il 13%. Con l&#x27;avvicinarsi della UEM (Unione economica e monetaria) i rendimenti convergono e restano quasi identici fino al 2008. Poi si riaprono. Che cosa spiegava gli spread prima della UEM?&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Exchange rate risk&lt;/button&gt;&lt;button&gt;Default risk&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;
        &lt;ul&gt;
          &lt;li&gt;La valuta della periferia (lira, peseta, dracma…) poteva &lt;b&gt;svalutarsi&lt;/b&gt; rispetto a quella del core: chi prestava chiedeva un premio.&lt;/li&gt;
          &lt;li&gt;L&#x27;introduzione dell&#x27;euro ha eliminato la &lt;i&gt;percezione&lt;/i&gt; di questo rischio.&lt;/li&gt;
          &lt;li&gt;Ma il rischio è riemerso come &lt;b&gt;redenomination risk&lt;/b&gt; (le slide scrivono &quot;denomination risk&quot;): il timore che debiti in euro venissero riconvertiti in nuove valute nazionali di valore inferiore all&#x27;euro.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p class=&quot;note&quot;&gt;Perché una svalutazione attesa alza il premio al rischio: tema delle prossime lezioni (slide 31).&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot;&gt;
        &lt;ul&gt;
          &lt;li&gt;La periferia era considerata più a rischio di default del core.&lt;/li&gt;
          &lt;li&gt;Il Trattato di Maastricht ha introdotto la clausola di &lt;b&gt;no bail-out&lt;/b&gt;: è formalmente illegale che le istituzioni europee, BCE compresa, salvino un Paese. Il divieto di finanziamento monetario impedisce inoltre di &quot;stampare&quot; moneta per pagare il debito.&lt;/li&gt;
          &lt;li&gt;Questo ha eliminato il rischio di &lt;b&gt;inflazione&lt;/b&gt;, cioè di ripagare il debito svalutandolo, ma ha lasciato intero il rischio di default.&lt;/li&gt;
          &lt;li&gt;Così i titoli periferici &lt;b&gt;non erano safe&lt;/b&gt;: non mantenevano i pagamenti in tutte le circostanze (proprietà 01) né la sicurezza durante una crisi (proprietà 02).&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché la proprietà 03 rende fragile lo status di safe asset?&lt;/summary&gt;&lt;div&gt;Se un titolo è sicuro perché tutti lo credono sicuro, basta che le credenze cambino e la liquidità sparisce, il prezzo crolla e il titolo smette di essere sicuro. È una forma di equilibri multipli, come nel 2010–2012.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Che cos&#x27;è il redenomination risk?&lt;/summary&gt;&lt;div&gt;Il rischio che un titolo emesso in euro venga rimborsato in una nuova valuta nazionale, che vale meno, in caso di uscita dall&#x27;euro. È il rischio di cambio &quot;rinato&quot; dentro l&#x27;unione.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Il no bail-out ha ridotto o aumentato il rischio di default percepito?&lt;/summary&gt;&lt;div&gt;L&#x27;ha reso esplicito: senza salvataggi e senza finanziamento monetario sparisce la &quot;via d&#x27;uscita&quot; inflazionistica e resta solo il default. Prima della crisi i mercati lo ignoravano, durante la crisi lo hanno prezzato.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section id=&quot;doom-loop&quot; class=&quot;part s-ocra&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;
    &lt;span class=&quot;tag&quot;&gt;Slide 32–36&lt;/span&gt;
    &lt;h2&gt;Altri amplificatori: banking crisis, doom loop e austerity&lt;/h2&gt;
    &lt;h3&gt;Dalla crisi del sovrano alla crisi bancaria&lt;/h3&gt;
    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;Gli investitori lasciano il mercato dei titoli nazionali: i tassi salgono e i prezzi crollano.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Le banche nazionali, che di norma &lt;b&gt;detengono molti titoli di Stato&lt;/b&gt;, subiscono grosse perdite.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;C&#x27;è anche un &lt;b&gt;funding problem&lt;/b&gt; (problema di raccolta): la liquidità interna si prosciuga perché lo stock di moneta cala, e le banche faticano a rinnovare i depositi, se non pagando tassi proibitivi.&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;La crisi del debito sovrano si trasmette così al sistema bancario, &lt;b&gt;anche se le banche erano sane in partenza&lt;/b&gt;.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Doom loop&lt;/b&gt; (circolo vizioso, detto anche &lt;i&gt;diabolic loop&lt;/i&gt;): un Paese ne è a rischio quando uno shock a una parte del sistema economico viene amplificato dai suoi effetti su un&#x27;altra parte. Il legame più rischioso è tra &lt;b&gt;banche e governo&lt;/b&gt;, cioè il sovrano e il suo debito. Il secondo è tra &lt;b&gt;banche ed economia&lt;/b&gt;, il terzo tra &lt;b&gt;sovrano ed economia&lt;/b&gt;.&lt;/div&gt;
    &lt;figure class=&quot;loop&quot;&gt;
      &lt;svg id=&quot;loopSvg&quot; viewBox=&quot;0 0 620 360&quot; role=&quot;img&quot; aria-label=&quot;Le tre crisi collegate secondo Shambaugh&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;/svg&gt;
      &lt;div id=&quot;loopTxt&quot; class=&quot;def&quot; style=&quot;margin:6px 0 0&quot;&gt;Clicca una freccia per leggere il meccanismo.&lt;/div&gt;
      &lt;figcaption&gt;Le tre crisi dell&#x27;euro secondo Shambaugh, &quot;The Euro&#x27;s Three Crises&quot;, Brookings Papers on Economic Activity, 2012 (slide 35). Per approfondire, la lettura &quot;Doom Loop&quot; su Moodle indicata nella slide 34.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;p&gt;Il legame tra banche e crisi richiama il &lt;b&gt;Premio Nobel per l&#x27;economia 2022&lt;/b&gt; a Bernanke, Diamond e Dybvig (slide 32): le banche sono per natura esposte alle &quot;corse&quot; dei depositanti, e i fallimenti bancari aggravano e prolungano le recessioni.&lt;/p&gt;

    &lt;h3&gt;Automatic stabilizers &quot;switched off&quot;&lt;/h3&gt;
    &lt;figure&gt;
      &lt;svg viewBox=&quot;0 0 620 210&quot; role=&quot;img&quot; aria-label=&quot;Ciclo che spegne gli stabilizzatori automatici&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ah3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Recessione&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;stabilizers al lavoro&lt;/text&gt;
          &lt;rect x=&quot;225&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Deficit più alti&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;G sale, T scende&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;54&quot; font-weight=&quot;600&quot;&gt;Sfiducia dei mercati&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;72&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;sulla capacità di pagare&lt;/text&gt;
          &lt;rect x=&quot;430&quot; y=&quot;130&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;154&quot; font-weight=&quot;600&quot;&gt;Liquidity e solvency&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;172&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;crisis&lt;/text&gt;
          &lt;rect x=&quot;225&quot; y=&quot;130&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;154&quot; font-weight=&quot;600&quot;&gt;Austerity&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;172&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;in piena recessione&lt;/text&gt;
          &lt;path d=&quot;M190 58 H222 M395 58 H427 M515 86 V127 M430 158 H398 M225 158 H105 V89&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ah3)&quot;/&gt;
          &lt;text x=&quot;140&quot; y=&quot;178&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;recessione più profonda&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Slide 36: questa dinamica rende molto difficile per i membri della UEM usare gli automatic stabilizers. Il bilancio, che doveva fare da cuscinetto, finisce per amplificare il ciclo.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;quiz&quot;&gt;
      &lt;h3&gt;Autoverifica&lt;/h3&gt;
      &lt;details&gt;&lt;summary&gt;Perché anche banche sane possono entrare in crisi?&lt;/summary&gt;&lt;div&gt;Per due canali: perdite sui titoli di Stato che detengono, il cui prezzo crolla, e problemi di raccolta perché la liquidità interna si prosciuga con la fuga di capitali.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Quali sono i tre lati del doom loop?&lt;/summary&gt;&lt;div&gt;Banche ↔ sovrano: salvataggi bancari e titoli pubblici nei bilanci delle banche. Banche ↔ economia: meno credito, e un&#x27;economia debole danneggia le banche. Sovrano ↔ economia: l&#x27;austerity frena la crescita, e la bassa crescita rende insolvente il sovrano.&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;Perché si dice che gli stabilizzatori sono &quot;switched off&quot;?&lt;/summary&gt;&lt;div&gt;Perché il deficit che producono in recessione provoca sfiducia e crisi del debito. Questo costringe il governo all&#x27;austerity, che annulla l&#x27;effetto stabilizzante e anzi lo rovescia.&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- REFS --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part refs&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;Bibliografia ragionata&lt;/div&gt;
    &lt;h2&gt;Per approfondire&lt;/h2&gt;
    &lt;p&gt;Autori, studi, norme e fonti di dati citati nelle slide. Le descrizioni e i link vengono da una ricerca web: ogni voce è segnata come &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;. Il riferimento alla slide indica dove compare nella lezione.&lt;/p&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eichengreen, Hausmann, Panizza: &quot;Original Sin&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Definiscono l&#x27;original sin come l&#x27;incapacità dei Paesi emergenti di indebitarsi all&#x27;estero nella propria valuta. Sostengono che dipenda soprattutto da caratteristiche strutturali dei mercati internazionali dei capitali e non solo da cattive politiche. La versione del 2005 è un capitolo del volume &lt;i&gt;Other People&#x27;s Money&lt;/i&gt; (University of Chicago Press); esistono working paper precedenti (&quot;The Pain, the Mystery, and the Road to Redemption&quot;, 2002; &quot;The Road to Redemption&quot;, 2003).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;analogia su cui si regge la slide 21. Un Paese dell&#x27;euro si trova nella stessa posizione di chi si indebita in valuta estera.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eml.berkeley.edu/~eichengr/research/osroadaug21-03.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eichengreen, Hausmann, Panizza, &quot;Original Sin: The Road to Redemption&quot; (PDF, sito di Eichengreen, UC Berkeley)&lt;/a&gt; · &lt;a href=&quot;https://repository.graduateinstitute.ch/record/286974/files/hausmann2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;versione 2002 (PDF, Graduate Institute Geneva)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Calvo et al., 2006: sudden stop e liability dollarization&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il lavoro del 2006 che si trova con questo tema è di Guillermo A. Calvo da solo: &quot;Monetary Policy Challenges in Emerging Markets: Sudden Stop, Liability Dollarization, and Lender of Last Resort&quot;, NBER Working Paper 12788. Sostiene che le fragilità finanziarie degli emergenti riducono l&#x27;efficacia di un prestatore di ultima istanza nazionale e che durante un sudden stop la banca centrale dovrebbe usare le riserve internazionali. Con coautori (Calvo, Izquierdo, Talvi, NBER WP 9828, 2003) analizza il caso argentino: sudden stop più debiti in dollari.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; spiega il meccanismo del &quot;sudden stop&quot; che la slide 21 applica alla Spagna. Nota: la slide scrive &quot;Calvo et al., 2006&quot;; verifica sulla bibliografia del corso a quale testo si riferisce.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w12788&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w12788 (Calvo, 2006)&lt;/a&gt; · &lt;a href=&quot;https://nber.org/system/files/working_papers/w9828/w9828.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w9828 (Calvo, Izquierdo, Talvi, PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Brunnermeier e Reis (2019), &quot;A Crash Course on the Euro Crisis&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Markus K. Brunnermeier (Princeton) e Ricardo Reis (LSE). È un testo pensato per l&#x27;insegnamento: presenta sette modelli, tra cui la cattiva allocazione degli afflussi di capitale, lo shadow banking, il diabolic loop e i &quot;flights to safety&quot; regionali, e li usa per ricostruire la crisi dell&#x27;euro del 2010–12. Ne esistono più versioni: NBER WP 26229, CEPR DP 14016, CFM DP 1915.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la fonte del grafico core vs periphery (slide 28) e copre quasi tutti i temi della lezione con modelli semplici.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/p/nbr/nberwo/26229.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda RePEc (NBER WP 26229)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jay C. Shambaugh (2012), &quot;The Euro&#x27;s Three Crises&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Brookings Papers on Economic Activity, primavera 2012, pp. 157–231, con commenti di Hélène Rey e Ricardo Reis. Tesi: l&#x27;area euro vive tre crisi intrecciate, bancaria, del debito sovrano e della crescita. Banche deboli e debito alto si rafforzano a vicenda, la bassa crescita peggiora entrambe e l&#x27;austerità frena la crescita. Le politiche che ignorano queste interdipendenze rischiano di essere incomplete o controproducenti.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la fonte del diagramma del doom loop (slide 35) e del grafico di lungo periodo degli spread (slide 29).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.brookings.edu/articles/the-euros-three-crises/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina Brookings&lt;/a&gt; · &lt;a href=&quot;https://www.brookings.edu/wp-content/uploads/2012/03/2012a_Shambaugh.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Premio Nobel per l&#x27;economia 2022: Bernanke, Diamond, Dybvig&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Assegnato &quot;for research on banks and financial crises&quot;. Diamond e Dybvig (1983) spiegano perché le banche esistono e perché il loro ruolo, trasformare depositi a vista in prestiti a lungo termine, le rende vulnerabili alle voci di fallimento e alle corse agli sportelli. Mostrano anche che assicurazione dei depositi e lender of last resort possono prevenirle. Bernanke ha mostrato che i fallimenti bancari resero più lunga e profonda la Grande Depressione.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà il fondamento teorico della crisi bancaria come amplificatore (slide 32–33) e dell&#x27;idea di equilibri multipli alla base delle crisi self-fulfilling.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2022/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato ufficiale (nobelprize.org)&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/uploads/2022/10/popular-economicsciencesprize2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Popular science background (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trattato di Maastricht: clausola di no bail-out (oggi art. 125 TFUE)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;L&#x27;art. 125 del Trattato sul funzionamento dell&#x27;UE (ex art. 103 TCE) stabilisce che l&#x27;Unione non risponde né si fa carico degli impegni delle amministrazioni pubbliche degli Stati membri, e che nessuno Stato risponde per un altro. È collegato al divieto di finanziamento monetario dell&#x27;art. 123. Nella sentenza &lt;i&gt;Pringle&lt;/i&gt; (2012) la Corte di giustizia ha ritenuto compatibile con l&#x27;art. 125 l&#x27;assistenza finanziaria del MES (il Meccanismo europeo di stabilità), purché indispensabile per la stabilità dell&#x27;area e soggetta a condizioni rigorose.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la norma richiamata nella slide 31. Spiega perché il rischio di inflazione è sparito ed è rimasto il rischio di default.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 125 TFUE su EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eurostat: deficit e debito pubblico&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;I dati di debito/PIL e deficit/PIL di Spagna e Regno Unito (slide 15–16) vengono da Eurostat. Il dataset di riferimento è &lt;i&gt;gov_10dd_edpt1&lt;/i&gt; (&quot;Government deficit/surplus, debt and associated data&quot;): debito lordo consolidato secondo la definizione della procedura per i disavanzi eccessivi (EDP), a fine anno, con standard SEC 2010.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; permette di ripetere da sé il confronto UK–Spagna o di estenderlo ad altri Paesi.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/databrowser/view/gov_10dd_edpt1/default/table&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat Data Browser: gov_10dd_edpt1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ISTAT: distribuzione dei redditi in Italia&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;L&#x27;Istituto nazionale di statistica è la fonte del grafico sulla distribuzione dei redditi italiani nel 2010 (slide 6), divisa tra pensioni, lavoro dipendente e lavoro autonomo.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra con dati reali la forma right skewed su cui si basa il ragionamento sulla progressive taxation.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.istat.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;istat.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bank of England&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;La banca centrale del Regno Unito, responsabile della politica monetaria della sterlina. Nel caso della slide 19 è la &quot;superior force&quot;: può comprare titoli di Stato britannici e fare da lender of last resort al sovrano.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bankofengland.co.uk/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bankofengland.co.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot; style=&quot;border-style:dashed&quot;&gt;&lt;h4&gt;Lettura collegata (non citata nelle slide): De Grauwe (2011), &quot;The Governance of a Fragile Eurozone&quot;&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;CEPS Working Document n. 346, maggio 2011. È l&#x27;origine nota del ragionamento UK vs Spagna: entrando in una MU i governi perdono il controllo della valuta del proprio debito e diventano esposti a default indotti dai mercati e a crisi self-fulfilling. Il paper critica anche il MES perché non tiene conto di questa fragilità e potrebbe scoraggiare l&#x27;uso degli stabilizzatori automatici.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://cdn.ceps.eu/wp-content/uploads/2011/05/WD%20346%20De%20Grauwe%20on%20Eurozone%20Governance.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF su CEPS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;p class=&quot;note&quot;&gt;La lettura &quot;Doom Loop&quot; citata nella slide 34 è sulla piattaforma Moodle del corso, quindi non è linkabile qui.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

document.querySelectorAll(&quot;[data-stepper]&quot;).forEach(function(s){
  var items=s.querySelectorAll(&quot;li&quot;),dots=s.querySelector(&quot;.dots&quot;),i=0;
  items.forEach(function(){dots.appendChild(document.createElement(&quot;i&quot;));});

  function show(){items.forEach(function(li,k){li.classList.toggle(&quot;on&quot;,k===i);});
    dots.querySelectorAll(&quot;i&quot;).forEach(function(d,k){d.classList.toggle(&quot;on&quot;,k&lt;=i);});

  next.addEventListener(&quot;click&quot;,function(){if(i&lt;items.length-1){i++;show();}});
