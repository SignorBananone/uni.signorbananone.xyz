&lt;script&gt;
(function(){
&quot;use strict&quot;;
var A=0.12,K=0.42;
function B(m,s){return m*A*(Math.exp(K*s)-1)}
function Sat(m,c){return Math.log(c/(A*m)+1)/K}
function f1(v){return (Math.round(v*10)/10).toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}
var W=560,H=340,L=58,R=22,T=16,BT=48,w=W-L-R,h=H-T-BT;
function X(s){return L+s/10*w}
function Y(b){return T+h-b/8*h}
function path(m){var d=&quot;&quot;,s;for(s=0;s&lt;=10.001;s+=0.1){var b=B(m,s);d+=(d?&quot;L&quot;:&quot;M&quot;)+X(s).toFixed(1)+&quot; &quot;+Y(Math.min(b,9)).toFixed(1);if(b&gt;9)break}return d}
function draw(svg,o){
  var id=svg.id+&quot;c&quot;,g=&#x27;&lt;defs&gt;&lt;clipPath id=&quot;&#x27;+id+&#x27;&quot;&gt;&lt;rect x=&quot;&#x27;+L+&#x27;&quot; y=&quot;&#x27;+(T-6)+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+(h+6)+&#x27;&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;&#x27;;
  (o.zones||[]).forEach(function(z){g+=&#x27;&lt;rect class=&quot;&#x27;+z[2]+&#x27;&quot; x=&quot;&#x27;+X(z[0])+&#x27;&quot; y=&quot;&#x27;+T+&#x27;&quot; width=&quot;&#x27;+(X(z[1])-X(z[0]))+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot;/&gt;&#x27;});
  g+=&#x27;&lt;line class=&quot;ax&quot; x1=&quot;&#x27;+L+&#x27;&quot; y1=&quot;&#x27;+(T+h)+&#x27;&quot; x2=&quot;&#x27;+(L+w+8)+&#x27;&quot; y2=&quot;&#x27;+(T+h)+&#x27;&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;ax&quot; x1=&quot;&#x27;+L+&#x27;&quot; y1=&quot;&#x27;+(T+h)+&#x27;&quot; x2=&quot;&#x27;+L+&#x27;&quot; y2=&quot;&#x27;+(T-4)+&#x27;&quot; marker-end=&quot;url(#arr)&quot;/&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;axl&quot; x=&quot;&#x27;+(L+w)+&#x27;&quot; y=&quot;&#x27;+(T+h+38)+&#x27;&quot; text-anchor=&quot;end&quot;&gt;solvency shock S →&lt;/text&gt;&lt;text class=&quot;axl&quot; transform=&quot;translate(18 &#x27;+(T+h/2)+&#x27;) rotate(-90)&quot; text-anchor=&quot;middle&quot;&gt;benefit, cost&lt;/text&gt;&#x27;;
  (o.v||[]).forEach(function(v){g+=&#x27;&lt;line class=&quot;vl&quot; x1=&quot;&#x27;+X(v[0])+&#x27;&quot; y1=&quot;&#x27;+Y(v[1])+&#x27;&quot; x2=&quot;&#x27;+X(v[0])+&#x27;&quot; y2=&quot;&#x27;+(T+h)+&#x27;&quot;/&gt;&lt;text class=&quot;axl&quot; x=&quot;&#x27;+X(v[0])+&#x27;&quot; y=&quot;&#x27;+(T+h+18)+&#x27;&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--ink)&quot;&gt;&#x27;+v[2]+&#x27;&lt;/text&gt;&#x27;});
  if(o.cost!=null){g+=&#x27;&lt;line class=&quot;c-cost&quot; x1=&quot;&#x27;+L+&#x27;&quot; y1=&quot;&#x27;+Y(o.cost)+&#x27;&quot; x2=&quot;&#x27;+(L+w)+&#x27;&quot; y2=&quot;&#x27;+Y(o.cost)+&#x27;&quot;/&gt;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(L+w-4)+&#x27;&quot; y=&quot;&#x27;+(Y(o.cost)-7)+&#x27;&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--ochre)&quot;&gt;C&lt;/text&gt;&#x27;}
  g+=&#x27;&lt;g clip-path=&quot;url(#&#x27;+id+&#x27;)&quot;&gt;&#x27;;
  o.curves.forEach(function(c){g+=&#x27;&lt;path class=&quot;cl &#x27;+c.cls+&#x27;&quot; d=&quot;&#x27;+path(c.m)+&#x27;&quot;/&gt;&#x27;});
  g+=&#x27;&lt;/g&gt;&#x27;;
  o.curves.forEach(function(c){if(!c.lab)return;var s=Math.min(Sat(c.m,8.2),9.6);g+=&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(X(s)+6)+&#x27;&quot; y=&quot;&#x27;+(Y(Math.min(B(c.m,s),8))+14)+&#x27;&quot; style=&quot;fill:&#x27;+c.col+&#x27;&quot;&gt;&#x27;+c.lab+&#x27;&lt;/text&gt;&#x27;});
  (o.dots||[]).forEach(function(d){if(d[1]&gt;8.3)return;g+=&#x27;&lt;circle class=&quot;dot&quot; cx=&quot;&#x27;+X(d[0])+&#x27;&quot; cy=&quot;&#x27;+Y(d[1])+&#x27;&quot; r=&quot;6.5&quot; style=&quot;fill:&#x27;+d[2]+&#x27;&quot;/&gt;&#x27;+(d[3]?&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(X(d[0])-10)+&#x27;&quot; y=&quot;&#x27;+(Y(d[1])-8)+&#x27;&quot; text-anchor=&quot;end&quot; style=&quot;fill:&#x27;+d[2]+&#x27;&quot;&gt;&#x27;+d[3]+&#x27;&lt;/text&gt;&#x27;:&#x27;&#x27;)});
  svg.innerHTML=g;
}
function $(i){return document.getElementById(i)}
var SUB=function(t){return &#x27;B&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;&#x27;+t+&#x27;&lt;/tspan&gt;&#x27;};

/* Parte 2 */
function upBU(){
  if(!$(&quot;chBU&quot;))return;
  var d=+$(&quot;fDebt&quot;).value,t=+$(&quot;fTax&quot;).value,e=+$(&quot;fExt&quot;).value;
  var lv=function(v){return v&lt;.7?&quot;basso&quot;:v&gt;1.3?&quot;alto&quot;:&quot;medio&quot;};
  $(&quot;oDebt&quot;).textContent=lv(d);$(&quot;oTax&quot;).textContent=lv(t);$(&quot;oExt&quot;).textContent=lv(e);
  var m=(0.6+0.4*d)*(0.6+0.4*t)*(0.75+0.25*e);
  draw($(&quot;chBU&quot;),{curves:[{m:1,cls:&quot;c-ghost&quot;},{m:m,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}]});
  var s=5;$(&quot;rBU&quot;).innerHTML=&quot;Con uno shock S = 5 il beneficio è &lt;b&gt;&quot;+(B(m,s)/B(1,s)*100).toFixed(0)+&quot;%&lt;/b&gt; di quello del caso base (linea tratteggiata). &quot;+(m&gt;1.02?&quot;La curva è &lt;b&gt;ruotata verso l&#x27;alto&lt;/b&gt;: il default è più tentante per ogni shock.&quot;:m&lt;0.98?&quot;La curva è &lt;b&gt;ruotata verso il basso&lt;/b&gt;: il default è meno tentante.&quot;:&quot;Caso base.&quot;);
}
[&quot;fDebt&quot;,&quot;fTax&quot;,&quot;fExt&quot;].forEach(function(i){var x=$(i);if(x)x.addEventListener(&quot;input&quot;,upBU)});

/* Parte 3 */
function upC(){
  if(!$(&quot;chC&quot;))return;
  var s=+$(&quot;cS&quot;).value,c=+$(&quot;cC&quot;).value,s0=Sat(1,c),b=B(1,s),def=b&gt;c;
  $(&quot;oCS&quot;).textContent=f1(s);$(&quot;oCC&quot;).textContent=f1(c);
  draw($(&quot;chC&quot;),{curves:[{m:1,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}],cost:c,v:[[s0,c,&quot;S₀&quot;]],dots:[[s,b,def?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;]],zones:[[s0,10,&quot;zone-b&quot;]]});
  $(&quot;rC&quot;).innerHTML=&quot;S₀ ≈ &lt;b&gt;&quot;+f1(s0)+&quot;&lt;/b&gt;. Con S = &quot;+f1(s)+&quot; il beneficio vale &quot;+f1(b)+&quot; contro un costo di &quot;+f1(c)+&quot; → &quot;+(def?&quot;&lt;b&gt;default&lt;/b&gt; (B &amp;gt; C)&quot;:&quot;&lt;b&gt;nessun default&lt;/b&gt; (B &amp;lt; C)&quot;)+&quot;.&quot;;
}
[&quot;cS&quot;,&quot;cC&quot;].forEach(function(i){var x=$(i);if(x)x.addEventListener(&quot;input&quot;,upC)});

/* Parte 4 */
var expD=0;
function upEq(){
  if(!$(&quot;chEq&quot;))return;
  var s=+$(&quot;eS&quot;).value,C=3,mU=1,mE=3,s1=Sat(mE,C),s2=Sat(mU,C);
  $(&quot;oES&quot;).textContent=f1(s);
  var bu=B(mU,s),be=B(mE,s),b=expD?be:bu,dec=b&gt;C;
  draw($(&quot;chEq&quot;),{curves:[{m:mE,cls:&quot;c-be&quot;,lab:SUB(&quot;E&quot;),col:&quot;var(--brick)&quot;},{m:mU,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}],cost:C,
    v:[[s1,C,&quot;S₁&quot;],[s2,C,&quot;S₂&quot;],[s,Math.min(be,8),&quot;S&quot;]],zones:[[0,s1,&quot;zone-g&quot;],[s1,s2,&quot;zone-m&quot;],[s2,10,&quot;zone-b&quot;]],
    dots:[[s,bu,expD?&quot;var(--muted)&quot;:&quot;var(--sage)&quot;,expD?&quot;&quot;:&quot;N&quot;],[s,be,expD?&quot;var(--brick)&quot;:&quot;var(--muted)&quot;,expD?&quot;D&quot;:&quot;&quot;]]});
  var zone=s&lt;s1?&quot;&lt;b&gt;shock piccolo&lt;/b&gt; (S &amp;lt; S₁)&quot;:s&gt;s2?&quot;&lt;b&gt;shock grande&lt;/b&gt; (S &amp;gt; S₂)&quot;:&quot;&lt;b&gt;shock intermedio&lt;/b&gt; (S₁ &amp;lt; S &amp;lt; S₂)&quot;;
  var cons=(dec===!!expD);
  var t=zone+&quot;. Aspettativa: &quot;+(expD?&quot;default&quot;:&quot;nessun default&quot;)+&quot; → curva rilevante &quot;+(expD?&quot;B&lt;sub&gt;E&lt;/sub&gt;&quot;:&quot;B&lt;sub&gt;U&lt;/sub&gt;&quot;)+&quot;, beneficio &quot;+f1(b)+&quot; vs costo 3,0 → il governo &quot;+(dec?&quot;&lt;b&gt;fa default&lt;/b&gt;&quot;:&quot;&lt;b&gt;paga&lt;/b&gt;&quot;)+&quot;. &quot;;
  t+=cons?&quot;L&#x27;aspettativa si &lt;b&gt;conferma&lt;/b&gt;: è un equilibrio.&quot;:&quot;L&#x27;aspettativa viene &lt;b&gt;smentita&lt;/b&gt;: non è un equilibrio, gli investitori correggeranno le attese.&quot;;
  if(s&gt;=s1&amp;&amp;s&lt;=s2)t+=&quot; Prova a cambiare l&#x27;aspettativa: anche l&#x27;altra si conferma (coordination failure).&quot;;
  $(&quot;rEq&quot;).innerHTML=t;
}
var eS=$(&quot;eS&quot;);if(eS)eS.addEventListener(&quot;input&quot;,upEq);
document.querySelectorAll(&quot;#eExp button&quot;).forEach(function(bt){bt.addEventListener(&quot;click&quot;,function(){expD=+bt.dataset.v;document.querySelectorAll(&quot;#eExp button&quot;).forEach(function(x){x.setAttribute(&quot;aria-pressed&quot;,x===bt)});upEq()})});

/* Parte 5 */
var cbMode=0;
function upPol(){
  if(!$(&quot;chPol&quot;))return;
  var s=+$(&quot;pS&quot;).value,aid=$(&quot;pAid&quot;).checked,C=3;
  $(&quot;oPS&quot;).textContent=f1(s);
  var mU=aid?0.6:1,gap=cbMode===0?3:cbMode===1?1.8:1,mE=mU*gap;
  var cur=[{m:3,cls:&quot;c-ghost&quot;},{m:1,cls:&quot;c-ghost&quot;}];
  cur.push({m:mE,cls:(cbMode||aid)?&quot;c-new&quot;:&quot;c-be&quot;,lab:(cbMode||aid)?&quot;B′&quot;+&#x27;&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;E&lt;/tspan&gt;&#x27;:SUB(&quot;E&quot;),col:(cbMode||aid)?&quot;var(--sage)&quot;:&quot;var(--brick)&quot;});
  if(cbMode!==2)cur.push({m:mU,cls:aid?&quot;c-newu&quot;:&quot;c-bu&quot;,lab:aid?&quot;B′&quot;+&#x27;&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;U&lt;/tspan&gt;&#x27;:SUB(&quot;U&quot;),col:aid?&quot;var(--ochre)&quot;:&quot;var(--slate)&quot;});
  var be=B(mE,s),s1=Sat(mE,C),s2=Sat(mU,C);
  var v=[[s,Math.min(be,8),&quot;S′&quot;]];if(cbMode!==2)v.push([s1,C,&quot;S₁&quot;]);v.push([s2,C,cbMode===2?&quot;S₁=S₂&quot;:&quot;S₂&quot;]);
  draw($(&quot;chPol&quot;),{curves:cur,cost:C,v:v,dots:[[s,be,be&gt;C?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;,be&gt;C?&quot;D&quot;:&quot;ok&quot;]]});
  var t=&quot;Con lo shock S′ = &quot;+f1(s)+&quot;, anche se i mercati si aspettano il default, il beneficio vale &quot;+f1(be)+&quot; contro un costo di 3,0: &quot;;
  t+=be&gt;C?&quot;&lt;b&gt;il default atteso si avvera&lt;/b&gt; (equilibrio cattivo possibile).&quot;:&quot;&lt;b&gt;il default non conviene&lt;/b&gt;, quindi l&#x27;attesa di default non regge e resta solo l&#x27;equilibrio buono.&quot;;
  if(cbMode===2)t+=&quot; Con la garanzia piena B&lt;sub&gt;E&lt;/sub&gt; = B&lt;sub&gt;U&lt;/sub&gt;: resta &lt;b&gt;una sola soglia&lt;/b&gt; e gli equilibri multipli spariscono.&quot;;
  else t+=&quot; Zona a rischio di equilibri multipli: da S₁ ≈ &quot;+f1(s1)+&quot; a S₂ ≈ &quot;+f1(s2)+&quot;.&quot;;
  $(&quot;rPol&quot;).innerHTML=t;
}
var pS=$(&quot;pS&quot;);if(pS){pS.addEventListener(&quot;input&quot;,upPol);$(&quot;pAid&quot;).addEventListener(&quot;change&quot;,upPol)}
document.querySelectorAll(&quot;#pCB button&quot;).forEach(function(bt){bt.addEventListener(&quot;click&quot;,function(){cbMode=+bt.dataset.v;document.querySelectorAll(&quot;#pCB button&quot;).forEach(function(x){x.setAttribute(&quot;aria-pressed&quot;,x===bt)});upPol()})});

/* Parte 6: barre bilanci */
function bars(id,data,max,unit){
  var svg=$(id);if(!svg)return;var rowH=30,lw=176,ww=520-lw-96,g=&quot;&quot;;
  data.forEach(function(d,i){var y=8+i*rowH,bw=Math.max(2,d[1]/max*ww);
    g+=&#x27;&lt;text class=&quot;bar-l&quot; x=&quot;&#x27;+(lw-8)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; text-anchor=&quot;end&quot;&gt;&#x27;+d[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;&#x27;+lw+&#x27;&quot; y=&quot;&#x27;+(y+2)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:&#x27;+(d[2]||&quot;var(--sage)&quot;)+&#x27;&quot;/&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(lw+bw+6)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot;&gt;&#x27;+d[1].toLocaleString(&quot;it-IT&quot;)+unit+&#x27;&lt;/text&gt;&#x27;});
  svg.setAttribute(&quot;viewBox&quot;,&quot;0 0 520 &quot;+(data.length*rowH+12));svg.innerHTML=g;
}
bars(&quot;barCountries&quot;,[[&quot;Germania&quot;,1552],[&quot;Francia&quot;,1342],[&quot;Italia&quot;,871],[&quot;Spagna&quot;,516],[&quot;Belgio&quot;,242],[&quot;Polonia&quot;,223],[&quot;Austria&quot;,192],[&quot;Danimarca&quot;,157],[&quot;Bilancio UE&quot;,148,&quot;var(--accent)&quot;]],1552,&quot; mld €&quot;);
bars(&quot;barShare&quot;,[[&quot;Bilancio UE&quot;,1,&quot;var(--accent)&quot;],[&quot;Bilancio nazionale medio&quot;,46]],46,&quot;% del PIL&quot;);

/* Parte 7: tranching */
function upTr(){
  if(!$(&quot;chTr&quot;))return;
  var loss=+$(&quot;tL&quot;).value,jun=+$(&quot;tJ&quot;).value,sen=100-jun;
  $(&quot;oTL&quot;).textContent=loss+&quot; mld&quot;;$(&quot;oTJ&quot;).textContent=jun+&quot; mld&quot;;
  var lj=Math.min(loss,jun),ls=Math.max(0,loss-jun),x0=40,bw=150,H0=260,sc=H0/100;
  var g=&#x27;&lt;text class=&quot;bar-l&quot; x=&quot;&#x27;+(x0+bw/2)+&#x27;&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Portafoglio · 100 mld di bond sovrani&lt;/text&gt;&#x27;;
  var ySen=24,hSen=sen*sc,yJun=ySen+hSen,hJun=jun*sc;
  g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+ySen+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+hSen+&#x27;&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&#x27;;
  g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+yJun+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+hJun+&#x27;&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&#x27;;
  if(lj&gt;0)g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun-lj*sc)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+(lj*sc)+&#x27;&quot; style=&quot;fill:var(--brick);opacity:.55&quot;/&gt;&#x27;;
  if(ls&gt;0)g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+(yJun-ls*sc)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+(ls*sc)+&#x27;&quot; style=&quot;fill:var(--brick);opacity:.8&quot;/&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(ySen+hSen/2)+&#x27;&quot; style=&quot;fill:var(--slate)&quot;&gt;Senior tranche · ESBies&lt;/text&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(ySen+hSen/2+18)+&#x27;&quot;&gt;&#x27;+sen+&#x27; mld · perdita &#x27;+ls+&#x27; mld (&#x27;+(sen?Math.round(ls/sen*100):0)+&#x27;%)&lt;/text&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun/2)+&#x27;&quot; style=&quot;fill:var(--ochre)&quot;&gt;Junior tranche&lt;/text&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun/2+18)+&#x27;&quot;&gt;&#x27;+jun+&#x27; mld · perdita &#x27;+lj+&#x27; mld (&#x27;+(jun?Math.round(lj/jun*100):0)+&#x27;%)&lt;/text&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;axl&quot; x=&quot;&#x27;+(x0+bw/2)+&#x27;&quot; y=&quot;&#x27;+(ySen+H0+22)+&#x27;&quot; text-anchor=&quot;middle&quot;&gt;le perdite salgono dal basso ↑&lt;/text&gt;&#x27;;
