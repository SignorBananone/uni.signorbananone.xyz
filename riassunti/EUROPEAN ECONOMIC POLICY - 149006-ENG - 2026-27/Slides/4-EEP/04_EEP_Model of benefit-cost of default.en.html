  (o.dots||[]).forEach(function(d){if(d[1]&gt;8.3)return;g+=&#x27;&lt;circle class=&quot;dot&quot; cx=&quot;&#x27;+X(d[0])+&#x27;&quot; cy=&quot;&#x27;+Y(d[1])+&#x27;&quot; r=&quot;6.5&quot; style=&quot;fill:&#x27;+d[2]+&#x27;&quot;/&gt;&#x27;+(d[3]?&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(X(d[0])-10)+&#x27;&quot; y=&quot;&#x27;+(Y(d[1])-8)+&#x27;&quot; text-anchor=&quot;end&quot; style=&quot;fill:&#x27;+d[2]+&#x27;&quot;&gt;&#x27;+d[3]+&#x27;&lt;/text&gt;&#x27;:&#x27;&#x27;)});
  svg.innerHTML=g;
}
function $(i){return document.getElementById(i)}
var SUB=function(t){return &#x27;B&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;&#x27;+t+&#x27;&lt;/tspan&gt;&#x27;};

/* Part 2 */
function upBU(){
  if(!$(&quot;chBU&quot;))return;
  var d=+$(&quot;fDebt&quot;).value,t=+$(&quot;fTax&quot;).value,e=+$(&quot;fExt&quot;).value;
  var lv=function(v){return v&lt;.7?&quot;low&quot;:v&gt;1.3?&quot;high&quot;:&quot;medium&quot;};
  $(&quot;oDebt&quot;).textContent=lv(d);$(&quot;oTax&quot;).textContent=lv(t);$(&quot;oExt&quot;).textContent=lv(e);
  var m=(0.6+0.4*d)*(0.6+0.4*t)*(0.75+0.25*e);
  draw($(&quot;chBU&quot;),{curves:[{m:1,cls:&quot;c-ghost&quot;},{m:m,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}]});
  var s=5;$(&quot;rBU&quot;).innerHTML=&quot;With a shock S = 5 the benefit is &lt;b&gt;&quot;+(B(m,s)/B(1,s)*100).toFixed(0)+&quot;%&lt;/b&gt; of that in the baseline case (dashed line). &quot;+(m&gt;1.02?&quot;The curve has &lt;b&gt;rotated upwards&lt;/b&gt;: default is more tempting for every shock.&quot;:m&lt;0.98?&quot;The curve has &lt;b&gt;rotated downwards&lt;/b&gt;: default is less tempting.&quot;:&quot;Baseline case.&quot;);
}
[&quot;fDebt&quot;,&quot;fTax&quot;,&quot;fExt&quot;].forEach(function(i){var x=$(i);if(x)x.addEventListener(&quot;input&quot;,upBU)});

/* Part 3 */
function upC(){
  if(!$(&quot;chC&quot;))return;
  var s=+$(&quot;cS&quot;).value,c=+$(&quot;cC&quot;).value,s0=Sat(1,c),b=B(1,s),def=b&gt;c;
  $(&quot;oCS&quot;).textContent=f1(s);$(&quot;oCC&quot;).textContent=f1(c);
  draw($(&quot;chC&quot;),{curves:[{m:1,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}],cost:c,v:[[s0,c,&quot;S₀&quot;]],dots:[[s,b,def?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;]],zones:[[s0,10,&quot;zone-b&quot;]]});
  $(&quot;rC&quot;).innerHTML=&quot;S₀ ≈ &lt;b&gt;&quot;+f1(s0)+&quot;&lt;/b&gt;. With S = &quot;+f1(s)+&quot; the benefit is &quot;+f1(b)+&quot; against a cost of &quot;+f1(c)+&quot; → &quot;+(def?&quot;&lt;b&gt;default&lt;/b&gt; (B &amp;gt; C)&quot;:&quot;&lt;b&gt;no default&lt;/b&gt; (B &amp;lt; C)&quot;)+&quot;.&quot;;
}
[&quot;cS&quot;,&quot;cC&quot;].forEach(function(i){var x=$(i);if(x)x.addEventListener(&quot;input&quot;,upC)});

/* Part 4 */
var expD=0;
function upEq(){
  if(!$(&quot;chEq&quot;))return;
  var s=+$(&quot;eS&quot;).value,C=3,mU=1,mE=3,s1=Sat(mE,C),s2=Sat(mU,C);
  $(&quot;oES&quot;).textContent=f1(s);
  var bu=B(mU,s),be=B(mE,s),b=expD?be:bu,dec=b&gt;C;
  draw($(&quot;chEq&quot;),{curves:[{m:mE,cls:&quot;c-be&quot;,lab:SUB(&quot;E&quot;),col:&quot;var(--brick)&quot;},{m:mU,cls:&quot;c-bu&quot;,lab:SUB(&quot;U&quot;),col:&quot;var(--slate)&quot;}],cost:C,
    v:[[s1,C,&quot;S₁&quot;],[s2,C,&quot;S₂&quot;],[s,Math.min(be,8),&quot;S&quot;]],zones:[[0,s1,&quot;zone-g&quot;],[s1,s2,&quot;zone-m&quot;],[s2,10,&quot;zone-b&quot;]],
    dots:[[s,bu,expD?&quot;var(--muted)&quot;:&quot;var(--sage)&quot;,expD?&quot;&quot;:&quot;N&quot;],[s,be,expD?&quot;var(--brick)&quot;:&quot;var(--muted)&quot;,expD?&quot;D&quot;:&quot;&quot;]]});
  var zone=s&lt;s1?&quot;&lt;b&gt;small shock&lt;/b&gt; (S &amp;lt; S₁)&quot;:s&gt;s2?&quot;&lt;b&gt;large shock&lt;/b&gt; (S &amp;gt; S₂)&quot;:&quot;&lt;b&gt;intermediate shock&lt;/b&gt; (S₁ &amp;lt; S &amp;lt; S₂)&quot;;
  var cons=(dec===!!expD);
  var t=zone+&quot;. Expectation: &quot;+(expD?&quot;default&quot;:&quot;no default&quot;)+&quot; → relevant curve &quot;+(expD?&quot;B&lt;sub&gt;E&lt;/sub&gt;&quot;:&quot;B&lt;sub&gt;U&lt;/sub&gt;&quot;)+&quot;, benefit &quot;+f1(b)+&quot; vs cost 3.0 → the government &quot;+(dec?&quot;&lt;b&gt;defaults&lt;/b&gt;&quot;:&quot;&lt;b&gt;pays&lt;/b&gt;&quot;)+&quot;. &quot;;
  t+=cons?&quot;The expectation is &lt;b&gt;confirmed&lt;/b&gt;: this is an equilibrium.&quot;:&quot;The expectation is &lt;b&gt;proved wrong&lt;/b&gt;: this is not an equilibrium, and investors will revise their expectations.&quot;;
  if(s&gt;=s1&amp;&amp;s&lt;=s2)t+=&quot; Try switching the expectation: the other one is confirmed too (coordination failure).&quot;;
  $(&quot;rEq&quot;).innerHTML=t;
}
var eS=$(&quot;eS&quot;);if(eS)eS.addEventListener(&quot;input&quot;,upEq);
document.querySelectorAll(&quot;#eExp button&quot;).forEach(function(bt){bt.addEventListener(&quot;click&quot;,function(){expD=+bt.dataset.v;document.querySelectorAll(&quot;#eExp button&quot;).forEach(function(x){x.setAttribute(&quot;aria-pressed&quot;,x===bt)});upEq()})});

/* Part 5 */
var cbMode=0;
function upPol(){
  if(!$(&quot;chPol&quot;))return;
  var s=+$(&quot;pS&quot;).value,aid=$(&quot;pAid&quot;).checked,C=3;
  $(&quot;oPS&quot;).textContent=f1(s);
  var mU=aid?0.6:1,gap=cbMode===0?3:cbMode===1?1.8:1,mE=mU*gap;
  var cur=[{m:3,cls:&quot;c-ghost&quot;},{m:1,cls:&quot;c-ghost&quot;}];
  cur.push({m:mE,cls:(cbMode||aid)?&quot;c-new&quot;:&quot;c-be&quot;,lab:(cbMode||aid)?&quot;B′&quot;+&#x27;&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;E&lt;/tspan&gt;&#x27;:SUB(&quot;E&quot;),col:(cbMode||aid)?&quot;var(--sage)&quot;:&quot;var(--brick)&quot;});
  if(cbMode!==2)cur.push({m:mU,cls:aid?&quot;c-newu&quot;:&quot;c-bu&quot;,lab:aid?&quot;B′&quot;+&#x27;&lt;tspan baseline-shift=&quot;sub&quot; font-size=&quot;10&quot;&gt;U&lt;/tspan&gt;&#x27;:SUB(&quot;U&quot;),col:aid?&quot;var(--ochre)&quot;:&quot;var(--slate)&quot;});
  var be=B(mE,s),s1=Sat(mE,C),s2=Sat(mU,C);
  var v=[[s,Math.min(be,8),&quot;S′&quot;]];if(cbMode!==2)v.push([s1,C,&quot;S₁&quot;]);v.push([s2,C,cbMode===2?&quot;S₁=S₂&quot;:&quot;S₂&quot;]);
  draw($(&quot;chPol&quot;),{curves:cur,cost:C,v:v,dots:[[s,be,be&gt;C?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;,be&gt;C?&quot;D&quot;:&quot;ok&quot;]]});
  var t=&quot;With the shock S′ = &quot;+f1(s)+&quot;, even if markets expect default, the benefit is &quot;+f1(be)+&quot; against a cost of 3.0: &quot;;
  t+=be&gt;C?&quot;&lt;b&gt;the expected default materialises&lt;/b&gt; (bad equilibrium possible).&quot;:&quot;&lt;b&gt;default does not pay&lt;/b&gt;, so the expectation of default cannot be sustained and only the good equilibrium remains.&quot;;
  if(cbMode===2)t+=&quot; With the full guarantee B&lt;sub&gt;E&lt;/sub&gt; = B&lt;sub&gt;U&lt;/sub&gt;: &lt;b&gt;only one threshold&lt;/b&gt; remains and multiple equilibria disappear.&quot;;
  else t+=&quot; Zone at risk of multiple equilibria: from S₁ ≈ &quot;+f1(s1)+&quot; to S₂ ≈ &quot;+f1(s2)+&quot;.&quot;;
  $(&quot;rPol&quot;).innerHTML=t;
}
var pS=$(&quot;pS&quot;);if(pS){pS.addEventListener(&quot;input&quot;,upPol);$(&quot;pAid&quot;).addEventListener(&quot;change&quot;,upPol)}
document.querySelectorAll(&quot;#pCB button&quot;).forEach(function(bt){bt.addEventListener(&quot;click&quot;,function(){cbMode=+bt.dataset.v;document.querySelectorAll(&quot;#pCB button&quot;).forEach(function(x){x.setAttribute(&quot;aria-pressed&quot;,x===bt)});upPol()})});

/* Part 6: budget bars */
function bars(id,data,max,unit){
  var svg=$(id);if(!svg)return;var rowH=30,lw=176,ww=520-lw-96,g=&quot;&quot;;

    g+=&#x27;&lt;text class=&quot;bar-l&quot; x=&quot;&#x27;+(lw-8)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; text-anchor=&quot;end&quot;&gt;&#x27;+d[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;&#x27;+lw+&#x27;&quot; y=&quot;&#x27;+(y+2)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:&#x27;+(d[2]||&quot;var(--sage)&quot;)+&#x27;&quot;/&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(lw+bw+6)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot;&gt;&#x27;+d[1].toLocaleString(&quot;en-GB&quot;)+unit+&#x27;&lt;/text&gt;&#x27;});
  svg.setAttribute(&quot;viewBox&quot;,&quot;0 0 520 &quot;+(data.length*rowH+12));svg.innerHTML=g;
}

/* Part 7: tranching */
function upTr(){
  if(!$(&quot;chTr&quot;))return;
  var loss=+$(&quot;tL&quot;).value,jun=+$(&quot;tJ&quot;).value,sen=100-jun;
  $(&quot;oTL&quot;).textContent=loss+&quot; bn&quot;;$(&quot;oTJ&quot;).textContent=jun+&quot; bn&quot;;
  var lj=Math.min(loss,jun),ls=Math.max(0,loss-jun),x0=40,bw=150,H0=260,sc=H0/100;
  var g=&#x27;&lt;text class=&quot;bar-l&quot; x=&quot;&#x27;+(x0+bw/2)+&#x27;&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Portfolio · €100 bn of sovereign bonds&lt;/text&gt;&#x27;;
  var ySen=24,hSen=sen*sc,yJun=ySen+hSen,hJun=jun*sc;
  g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+ySen+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+hSen+&#x27;&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&#x27;;
  g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+yJun+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+hJun+&#x27;&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;&#x27;;
  if(lj&gt;0)g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun-lj*sc)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+(lj*sc)+&#x27;&quot; style=&quot;fill:var(--brick);opacity:.55&quot;/&gt;&#x27;;
  if(ls&gt;0)g+=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+(yJun-ls*sc)+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+(ls*sc)+&#x27;&quot; style=&quot;fill:var(--brick);opacity:.8&quot;/&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(ySen+hSen/2)+&#x27;&quot; style=&quot;fill:var(--slate)&quot;&gt;Senior tranche · ESBies&lt;/text&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(ySen+hSen/2+18)+&#x27;&quot;&gt;&#x27;+sen+&#x27; bn · loss &#x27;+ls+&#x27; bn (&#x27;+(sen?Math.round(ls/sen*100):0)+&#x27;%)&lt;/text&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;lab&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun/2)+&#x27;&quot; style=&quot;fill:var(--ochre)&quot;&gt;Junior tranche&lt;/text&gt;&lt;text class=&quot;bar-v&quot; x=&quot;&#x27;+(x0+bw+14)+&#x27;&quot; y=&quot;&#x27;+(yJun+hJun/2+18)+&#x27;&quot;&gt;&#x27;+jun+&#x27; bn · loss &#x27;+lj+&#x27; bn (&#x27;+(jun?Math.round(lj/jun*100):0)+&#x27;%)&lt;/text&gt;&#x27;;
  g+=&#x27;&lt;text class=&quot;axl&quot; x=&quot;&#x27;+(x0+bw/2)+&#x27;&quot; y=&quot;&#x27;+(ySen+H0+22)+&#x27;&quot; text-anchor=&quot;middle&quot;&gt;losses build up from the bottom ↑&lt;/text&gt;&#x27;;
  $(&quot;chTr&quot;).innerHTML=g;
  $(&quot;rTr&quot;).innerHTML=ls&gt;0?&quot;The losses (&quot;+loss+&quot; bn) exceed the thickness of the junior tranche: &lt;b&gt;the senior tranche loses too&lt;/b&gt;. This is the scenario feared in slide 33, a crisis that spreads to the large countries.&quot;:&quot;The junior tranche absorbs all the losses: the senior tranche (ESBies) &lt;b&gt;remains intact&lt;/b&gt;. This is why it is called a “safe bond”.&quot;;
}
