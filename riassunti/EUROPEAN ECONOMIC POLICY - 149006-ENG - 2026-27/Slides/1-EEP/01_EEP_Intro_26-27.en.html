&lt;div class=&quot;part&quot; id=&quot;parteF&quot; style=&quot;--c:var(--muted);--cb:transparent&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;section class=&quot;sec&quot; id=&quot;s-fonti&quot;&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--acc)&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Texts, legislation, data and websites cited in the slides&lt;/h2&gt;
  &lt;p style=&quot;color:var(--muted)&quot;&gt;For each entry: what the slide says and, marked &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;, what I verified through a web search and where. I searched for study material only.&lt;/p&gt;

  &lt;h3&gt;Texts&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul De Grauwe, &lt;i&gt;Economics of Monetary Union&lt;/i&gt;, Oxford University Press, 14th ed.&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Course textbook (slide 3, which gives 2023). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; ISBN 9780192849779; some catalogues date the edition to 2022 (the date given varies across sources). The book has two parts: the costs and benefits of a common currency (theory) and how a monetary union works (policy). It therefore follows the same structure as the course. Each chapter ends with a summary and questions. OUP offers student resources: &lt;a href=&quot;https://learninglink.oup.com/access/degrauwe14e-student-resources&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Learning Link, De Grauwe 14e&lt;/a&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reference text for the exam.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul Krugman, Maurice Obstfeld (and Marc Melitz), &lt;i&gt;International Economics: Theory and Policy&lt;/i&gt;, Pearson&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Cited on slide 26 for the exchange rate, the law of one price and PPP («6th Ed., 2015»). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The 2015 Pearson edition, also co-authored by Melitz, appears to be the &lt;b&gt;10th&lt;/b&gt;, not the 6th: check with the lecturer which edition is meant. It covers international trade and international finance, with theory followed by policy applications. Catalogue record: &lt;a href=&quot;https://eld.bl.uk/catalog/018480030&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;British Library&lt;/a&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it explains PPP and the real exchange rate at a gentle pace, which the lecture largely takes for granted.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Martin Schmitz, Andreas Dietrich, Rémy Brisson (2024), «The ECB&#x27;s enhanced effective exchange rates and harmonised competitiveness indicators: An updated weighting scheme including trade in services», ECB Statistics Paper Series No. 49&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Source of the charts on EER-41 weights (slides 39–42). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Published on 25 June 2024. It explains how the trade weights of the EERs and HCIs now incorporate trade in services; missing data are estimated with imputation techniques and a gravity model. The underlying method, which also accounts for competition in third markets, is unchanged. &lt;a href=&quot;https://www.ecb.europa.eu/pub/pdf/scpsps/ecb.sps49~655da0a6cb.en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF on the ECB website&lt;/a&gt; · &lt;a href=&quot;https://econpapers.repec.org/paper/ecbecbsps/202449.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc record&lt;/a&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it shows how a REER is constructed in practice.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Treaties and legislation&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treaty on European Union (TEU) and Treaty on the Functioning of the EU (TFEU)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slides 13–16 (Arts. 3, 9, 13 TEU; Title VIII TFEU). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; EUR-Lex publishes the consolidated versions; it warns that they are documentation tools and that only the texts published in the Official Journal are authentic. &lt;a href=&quot;https://eur-lex.europa.eu/collection/eu-law/treaties/treaties-force.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, treaties in force&lt;/a&gt; (link from the slide) · &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016E&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;consolidated TFEU (2016)&lt;/a&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; the ECB&#x27;s mandate and the fiscal rules, studied in part 2, are set out here.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treaty of Lisbon&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 13. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Signed on 13 December 2007, in force since 1 December 2009, after the second Irish referendum. Italy has been the depositary of the treaties since 1957. &lt;a href=&quot;https://www.europarl.europa.eu/about-parliament/en/in-the-past/the-parliament-and-the-treaties/treaty-of-lisbon&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Parliament&lt;/a&gt; · &lt;a href=&quot;https://www.esteri.it/en/temi/unione_europea/architettura-istituzionale-ue/il-trattato-di-lisbona/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Italian Ministry of Foreign Affairs&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Maastricht Treaty: convergence criteria&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 10. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The criteria of Art. 140 TFEU (prices, public finances, exchange rate, long-term interest rates) and the convergence reports of the ECB and the Commission, at least every two years. &lt;a href=&quot;https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB explainer&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Bulgaria&#x27;s entry into the euro (2026) and the Icelandic referendum (2026)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slides 11–12. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Bulgaria: Ecofin decision of 8 July 2025, euro since 1 January 2026, 21st member (&lt;a href=&quot;https://www.europarl.europa.eu/thinktank/en/document/EPRS_ATA(2025)775850&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPRS&lt;/a&gt;). Iceland: on 29 August 2026, 52.8% voted against resuming negotiations suspended for 13 years; the country remains in the European Economic Area and in Schengen (&lt;a href=&quot;https://www.aljazeera.com/news/2026/8/30/iceland-votes-to-reject-eu-accession-talks-what-happens-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Al Jazeera&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Data and indicators&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Economist, Big Mac index&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slides 28–29. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Published since 1986; it compares the price of a Big Mac across countries as an informal test of PPP. There is also a version adjusted for GDP per capita. Since 2018 the data and code have been public. &lt;a href=&quot;https://www.economist.com/interactive/big-mac-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Economist, Big Mac index&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it is the most immediate way to practise with PPP and over/undervaluation.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB: effective exchange rates and Harmonised Competitiveness Indicators&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slides 38, 43–46. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The HCIs are built with the same method and data as the euro&#x27;s effective exchange rates. For euro countries they are computed against 40 partners plus the other euro area countries; an increase indicates lower competitiveness. &lt;a href=&quot;https://data.ecb.europa.eu/main-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, HCI&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/mopo/eaec/eer/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EER page (link from the slide)&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB Data Portal: key figures&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slides 19–20. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Summary indicators for the euro area and individual countries (interest rates, exchange rates, prices, macroeconomics, external sector), with tools to compare them. &lt;a href=&quot;https://data.ecb.europa.eu/key-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;data.ecb.europa.eu/key-figures&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Bank, GDP (constant 2015 US$), NY.GDP.MKTP.KD&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 18. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; GDP at constant 2015 dollars from national sources, the OECD and World Bank estimates, under a CC BY-4.0 licence. It is adjusted for inflation but not for differences in the cost of living. &lt;a href=&quot;https://data.worldbank.org/indicator/NY.GDP.MKTP.KD?locations=XC-US-CN&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank Data&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Eurostat, «Extra-euro area trade in goods» (Statistics Explained)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 22. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In 2024 the euro area recorded a trade surplus of €173 billion. Machinery and vehicles are the main goods traded. Between 2014 and 2024 China&#x27;s share of imports and the US share of exports increased. &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Extra-euro_area_trade_in_goods&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Other websites listed on slide 20&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;European Commission, DG ECFIN&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Spring and autumn forecasts and the annual macroeconomic database &lt;b&gt;AMECO&lt;/b&gt; (over 40 countries, free of charge). &lt;a href=&quot;https://economy-finance.ec.europa.eu/index_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;economy-finance.ec.europa.eu&lt;/a&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Banca d&#x27;Italia&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The &lt;b&gt;Statistical Database&lt;/b&gt; (BDS) provides statistical indicators and aggregates. &lt;a href=&quot;https://www.bancaditalia.it/statistiche/basi-dati/bds/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bancaditalia.it, BDS&lt;/a&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;DBnomics&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Free aggregator of economic series (over 90–100 providers), developed by CEPREMAP; it does not modify the data and archives their revisions. &lt;a href=&quot;https://db.nomics.world/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;db.nomics.world&lt;/a&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Eurostat · OECD · ONS · FRED&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ec.europa.eu/eurostat&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat&lt;/a&gt; (EU statistics); &lt;a href=&quot;https://data-explorer.oecd.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD Data Explorer&lt;/a&gt; (formerly OECD.Stat, since 2024); &lt;a href=&quot;https://www.ons.gov.uk/aboutus/whatwedo&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ONS&lt;/a&gt;, the UK&#x27;s national statistical institute; &lt;a href=&quot;https://fredhelp.stlouisfed.org/fred/about/about-fred/what-is-fred&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FRED&lt;/a&gt;, the Federal Reserve Bank of St. Louis database with hundreds of thousands of series.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bruegel&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Brussels-based economic think tank (since 2005), devoted to independent, fact-based policy research. &lt;a href=&quot;https://www.bruegel.org/about&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bruegel.org&lt;/a&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;VoxEU (CEPR)&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; CEPR&#x27;s portal, founded in 2007, with short research-based policy articles written by economists. &lt;a href=&quot;https://cepr.org/voxeu/columns/what-voxeuorg&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cepr.org/voxeu&lt;/a&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;The slides also cite &lt;i&gt;The Economist&lt;/i&gt; and the &lt;i&gt;Financial Times&lt;/i&gt; for commentary and articles: these are news publications, not databases, and partly paywalled.&lt;/p&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;
