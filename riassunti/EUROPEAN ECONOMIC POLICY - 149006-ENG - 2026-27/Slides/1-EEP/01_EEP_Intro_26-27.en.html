    &lt;span data-y=&quot;2001&quot;&gt;Greece 2001&lt;/span&gt;&lt;span data-y=&quot;2007&quot;&gt;Slovenia 2007&lt;/span&gt;&lt;span data-y=&quot;2008&quot;&gt;Cyprus 2008&lt;/span&gt;&lt;span data-y=&quot;2008&quot;&gt;Malta 2008&lt;/span&gt;&lt;span data-y=&quot;2009&quot;&gt;Slovakia 2009&lt;/span&gt;&lt;span data-y=&quot;2011&quot;&gt;Estonia 2011&lt;/span&gt;&lt;span data-y=&quot;2014&quot;&gt;Latvia 2014&lt;/span&gt;&lt;span data-y=&quot;2015&quot;&gt;Lithuania 2015&lt;/span&gt;&lt;span data-y=&quot;2023&quot;&gt;Croatia 2023&lt;/span&gt;&lt;span data-y=&quot;2026&quot;&gt;Bulgaria 2026&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;out&quot;&gt;Czech Rep.&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Denmark (opt-out)&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Hungary&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Poland&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Romania&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Sweden&lt;/span&gt;&lt;/div&gt;
   &lt;p id=&quot;yrTxt&quot; style=&quot;font-size:.92rem;margin:.2rem 0 0&quot;&gt;&lt;/p&gt;
   &lt;p style=&quot;font-size:.82rem;color:var(--muted);margin:.4rem 0 0&quot;&gt;First row: the 21 euro countries (the 11 without a year are the 1999 founders, in red on slide 12). Second row: the 6 EU countries that do not use the euro. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Bulgaria adopted the euro on 1 January 2026 at the fixed conversion rate of 1.95583 lev per euro (&lt;a href=&quot;https://www.europarl.europa.eu/thinktank/en/document/EPRS_ATA(2025)775850&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPRS&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Who is in EMU&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Under EMU rules, can a country adopt the euro without being an EU member?&lt;/summary&gt;&lt;p&gt;No. The first requirement is EU membership. (There are cases of unilateral use of the euro outside the EU, but these countries are not EMU members.)&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Sweden does not use the euro. Does it have an exemption like Denmark?&lt;/summary&gt;&lt;p&gt;No. According to the slides, the only exemption is Denmark. Sweden is formally obliged to adopt the euro, but does not meet (in practice does not seek to meet) all the Maastricht conditions.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How many countries founded the euro in 1999, and which is the most recent to join?&lt;/summary&gt;&lt;p&gt;11 founders; the most recent is Bulgaria (2026), the 21st member.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-trattati&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;3 · Treaties and institutions &lt;span class=&quot;src&quot;&gt;slides 13–16&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;The Union&#x27;s two «constitutions»&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;TEU · Treaty on European Union&lt;/h4&gt;55 articles: main objectives and rights. It is the treaty «of principles».&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;TFEU · Treaty on the Functioning of the EU&lt;/h4&gt;358 articles, more detailed. It contains the part on &lt;b&gt;Economic and Monetary Policy&lt;/b&gt; (Title VIII), the one we will use most. It was formerly called the &lt;i&gt;Treaty establishing the European Community&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The &lt;b&gt;Treaty of Lisbon&lt;/b&gt; (in force since 2009), ratified by all Member States, amended the earlier versions of the treaties. &lt;b&gt;Italy is the &lt;span style=&quot;color:var(--acc)&quot;&gt;depositary country&lt;/span&gt;&lt;/b&gt; of the 1957 founding treaties and of all subsequent ones: the Treaty of Lisbon, drawn up in a single original in the 23 official languages of the time, is «deposited in the archives of the Government of the Italian Republic». &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Lisbon was signed on 13 December 2007 and entered into force on 1 December 2009 (&lt;a href=&quot;https://www.europarl.europa.eu/about-parliament/en/in-the-past/the-parliament-and-the-treaties/treaty-of-lisbon&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Parliament&lt;/a&gt;).&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-a3&quot;&gt;Art. 3 TEU&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-a9&quot;&gt;Art. 9 TEU&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-a13&quot;&gt;Art. 13 TEU&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a3&quot;&gt;
    &lt;p&gt;&lt;b&gt;Art. 3.3&lt;/b&gt;: the Union establishes an &lt;em class=&quot;t&quot;&gt;internal market&lt;/em&gt; and works for the sustainable development of Europe. The slides highlight the economic objectives:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card&quot;&gt;sustainable development&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;balanced economic growth&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;price stability&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;full employment&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;quality of the environment&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;highly competitive social market economy&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;These are followed by combating social exclusion and discrimination, economic, social and territorial cohesion, solidarity among Member States and respect for cultural and linguistic diversity.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Art. 3.4&lt;/b&gt;: «The Union shall establish an &lt;span style=&quot;color:var(--acc)&quot;&gt;economic and monetary union whose currency is the euro&lt;/span&gt;». EMU is therefore an objective written into the treaties, not an ancillary agreement.&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Note: &lt;i&gt;price stability&lt;/i&gt; and &lt;i&gt;full employment&lt;/i&gt; appear in the same list. This tension will resurface in part 2, when we discuss the mandate of the ECB, whose primary objective is price stability. &lt;span class=&quot;gen&quot;&gt;connection&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a9&quot; hidden&gt;
    &lt;p&gt;In all its activities the Union observes the &lt;b&gt;principle of the equality of its citizens&lt;/b&gt;. Every national of a Member State is a citizen of the Union; EU citizenship is &lt;b&gt;additional to&lt;/b&gt; national citizenship and does not replace it.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a13&quot; hidden&gt;
    &lt;p&gt;The 7 institutions of the Union (those central to this course in bold):&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card&quot;&gt;European Parliament&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;European Council&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;heads of state or government&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;Council&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;national ministers, by policy area&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;European Commission&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;executive, proposals and surveillance&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;Court of Justice of the EU&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;European Central Bank&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;monetary policy of the euro&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;Court of Auditors&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure&gt;
     &lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;ECOFIN contains the Eurogroup&quot;&gt;
      &lt;ellipse cx=&quot;320&quot; cy=&quot;85&quot; rx=&quot;300&quot; ry=&quot;75&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;ellipse cx=&quot;400&quot; cy=&quot;90&quot; rx=&quot;160&quot; ry=&quot;50&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;80&quot; y=&quot;70&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;ECOFIN&lt;/text&gt;
      &lt;text x=&quot;80&quot; y=&quot;90&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;economy and finance ministers&lt;/text&gt;
      &lt;text x=&quot;80&quot; y=&quot;106&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;of the 27 EU countries&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;Eurogroup&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;ministers of the 21 euro countries&lt;/text&gt;
     &lt;/svg&gt;
     &lt;figcaption&gt;ECOFIN (&lt;i&gt;Economic and Financial Affairs Council&lt;/i&gt;) is a configuration of the Council; the Eurogroup brings together only the ministers of the euro countries. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Official collection of the treaties in force: &lt;a href=&quot;https://eur-lex.europa.eu/collection/eu-law/treaties/treaties-force.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, Treaties currently in force&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Treaties and institutions&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Which of the two treaties contains the detailed rules on economic and monetary policy?&lt;/summary&gt;&lt;p&gt;The TFEU (Treaty on the Functioning of the EU), Title VIII «Economic and Monetary Policy».&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which article of the TEU states that the Union establishes an EMU whose currency is the euro?&lt;/summary&gt;&lt;p&gt;Art. 3, paragraph 4.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between ECOFIN and the Eurogroup?&lt;/summary&gt;&lt;p&gt;ECOFIN brings together the economy and finance ministers of all 27 EU countries and is a configuration of the Council. The Eurogroup brings together only the ministers of the 21 countries that use the euro.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What role does Italy play with respect to the treaties?&lt;/summary&gt;&lt;p&gt;It is the depositary country: it keeps the originals of the 1957 treaties and of all subsequent ones, including Lisbon.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PART B ============ --&gt;
&lt;div class=&quot;part p-ochre&quot; id=&quot;parteB&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;B&lt;/span&gt;&lt;h2&gt;The euro area in figures&lt;/h2&gt;&lt;p&gt;How much weight the euro area carries in the world, and how different the countries within it are.&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ea&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;4 · Features of the Euro Area (EA) &lt;span class=&quot;src&quot;&gt;slides 17–22&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;The EA and the United States compared&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-e1&quot;&gt;Population and GDP&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-e2&quot;&gt;Labour and public finances&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-e3&quot;&gt;Structure&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e1&quot;&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Population and GDP of the euro area, US and China&quot;&gt;
     &lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Population (millions)&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;48&quot; font-size=&quot;12&quot;&gt;Euro area&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;36&quot; width=&quot;358.7&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;50&quot; font-size=&quot;12&quot;&gt;358.7&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;64&quot; width=&quot;341.8&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;438&quot; y=&quot;78&quot; font-size=&quot;12&quot;&gt;341.8&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;128&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;GDP 2025 (trillions of constant 2015 $)&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;158&quot; font-size=&quot;12&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;146&quot; width=&quot;464.4&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;23.2&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;186&quot; font-size=&quot;12&quot;&gt;China&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;174&quot; width=&quot;388&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;484&quot; y=&quot;188&quot; font-size=&quot;12&quot;&gt;19.4&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;214&quot; font-size=&quot;12&quot;&gt;Euro area&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;202&quot; width=&quot;273.8&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;216&quot; font-size=&quot;12&quot;&gt;13.7&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;244&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;World Bank data reported on slide 18 (NY.GDP.MKTP.KD).&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;According to the slides, the EA is the &lt;b&gt;second-largest area in the world by population&lt;/b&gt; (ahead of the US) and the &lt;b&gt;third by share of world GDP&lt;/b&gt;, after the US and China. The World Bank chart in the slides shows that China overtook the EA around 2017.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Why «constant 2015 US$»?&lt;/b&gt; GDP is expressed at constant prices (adjusted for inflation) and converted into dollars, so that different periods and areas can be compared. Note: it does not adjust for differences in the cost of living across countries, i.e. it is not at purchasing power parity. That is precisely the topic of PPP, later on. &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e2&quot; hidden&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Unemployment, debt and deficit, EA and US&quot;&gt;
     &lt;g font-size=&quot;12&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;20&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Unemployment 2025 (%)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;46&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;70&quot; y=&quot;34&quot; width=&quot;124&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;47&quot;&gt;6.2&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;70&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;70&quot; y=&quot;58&quot; width=&quot;84&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;71&quot;&gt;4.2&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;20&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Debt/GDP 2023 (%)&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;46&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;360&quot; y=&quot;34&quot; width=&quot;174&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;47&quot;&gt;87&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;70&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;360&quot; y=&quot;58&quot; width=&quot;228&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;594&quot; y=&quot;71&quot;&gt;114&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;120&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Budget balance/GDP 2023 (%): deficit to the left&lt;/text&gt;
      &lt;line x1=&quot;320&quot; y1=&quot;130&quot; x2=&quot;320&quot; y2=&quot;200&quot; class=&quot;ax&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;152&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;258&quot; y=&quot;140&quot; width=&quot;62&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;153&quot;&gt;−3.1&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;180&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;168&quot; width=&quot;152&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;181&quot;&gt;−7.6&lt;/text&gt;
     &lt;/g&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;ul class=&quot;tight&quot;&gt;
     &lt;li&gt;Unemployment is &lt;b&gt;usually lower in the US&lt;/b&gt;.&lt;/li&gt;
     &lt;li&gt;Public finances (debt and deficit as a % of GDP) are &lt;b&gt;more contained in the EA&lt;/b&gt; than in the US.&lt;/li&gt;
     &lt;li&gt;The &lt;b&gt;role of the state&lt;/b&gt; is larger in the EA: public revenue and expenditure, including social transfers, are larger shares of GDP than in the US.&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e3&quot; hidden&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Developed economy&lt;/h4&gt;The tertiary sector (services) dominates, but less than in the US: manufacturing counts for more.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Open economy&lt;/h4&gt;The EA is more open (exports + imports relative to GDP) than other large areas such as the US and Japan. For individual countries, trade is a sizeable share of GDP.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Internal differences&lt;/h4&gt;EA countries differ in GDP growth, GDP per capita, inflation and competitiveness. Data: &lt;a href=&quot;https://data.ecb.europa.eu/key-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, key figures&lt;/a&gt;.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;A single exchange rate&lt;/h4&gt;An MU has one currency and therefore &lt;b&gt;a single exchange rate&lt;/b&gt; vis-à-vis the outside world. Yet each country&#x27;s competitiveness, measured by the &lt;em class=&quot;t&quot;&gt;real exchange rate&lt;/em&gt;, remains different.&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Who exports outside the euro area&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg id=&quot;expChart&quot; viewBox=&quot;0 0 640 520&quot; role=&quot;img&quot; aria-label=&quot;Extra-euro area exports of goods in 2024 by country&quot;&gt;&lt;/svg&gt;
   &lt;figcaption&gt;Exports of goods to countries outside the euro area, 2024 (€ billion). Values &lt;b&gt;read by eye&lt;/b&gt; from the Eurostat chart on slide 22, hence approximate. Hover or tap a bar to see its value. Germany alone exports more than Italy, the Netherlands and France combined.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The key point of part B.&lt;/b&gt; The euro&#x27;s exchange rate against the dollar is the same for all EA countries. Countries differ, however, in competitiveness, as measured by the real exchange rate: this is why, &lt;i&gt;other things being equal&lt;/i&gt;, exports and imports can vary enormously from one country to another. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · The euro area in figures&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;According to the slides, on which indicators does the EA «beat» the US, and on which does it not?&lt;/summary&gt;&lt;p&gt;The EA has a larger population, lower public debt and deficits as a % of GDP, and is more open to trade. The US has higher GDP, lower unemployment and a larger tertiary sector; the state plays a smaller role there.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;If the €/$ exchange rate is the same for everyone, why can Italy and Germany have such different export performance?&lt;/summary&gt;&lt;p&gt;Because competitiveness also depends on each country&#x27;s domestic prices and costs: the real exchange rate differs even though the nominal exchange rate is common. Specialisation, size and product quality also matter.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why is competitiveness so important for an open economy?&lt;/summary&gt;&lt;p&gt;Because a large share of demand (exports) and supply (imports) depends on how domestic prices and costs compare with foreign ones: losing competitiveness takes away demand, output and employment.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PART C ============ --&gt;
&lt;div class=&quot;part p-slate&quot; id=&quot;parteC&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;C&lt;/span&gt;&lt;h2&gt;Competitiveness in a monetary union&lt;/h2&gt;&lt;p&gt;Competitiveness is a key macroeconomic indicator for an open economy, and in an MU divergences in competitiveness create problems. To understand why, we first review some basic concepts. &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-cambio&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;5 · Exchange rate and the law of one price &lt;span class=&quot;src&quot;&gt;slides 24–25&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;The nominal exchange rate E&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Exchange rate E (euro/dollar).&lt;/b&gt; With the euro as the &lt;em class=&quot;t&quot;&gt;base currency&lt;/em&gt;, &lt;i&gt;E&lt;/i&gt; = number of &lt;b&gt;dollars&lt;/b&gt; that can be bought with &lt;b&gt;1 euro&lt;/b&gt;. Example: E = 1.10 means €1 = $1.10.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Appreciation ↑&lt;/h4&gt;&lt;i&gt;E&lt;/i&gt; rises: €1 buys more dollars. The euro is worth more and European goods become more expensive for Americans.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Depreciation ↓&lt;/h4&gt;&lt;i&gt;E&lt;/i&gt; falls: €1 buys fewer dollars. European goods become cheaper for Americans.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Mind the convention.&lt;/b&gt; Many textbooks define the exchange rate the other way round (euros per 1 dollar): there an &lt;i&gt;increase&lt;/i&gt; is a depreciation. In these slides, with the euro as the base currency, &lt;b&gt;a lower E = a depreciated euro&lt;/b&gt;. &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Let &lt;i&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt; be the dollar price of good &lt;i&gt;i&lt;/i&gt; sold in the US and &lt;i&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/i&gt; the euro price of the same good sold in the eurozone (EZ). To compare them, they must be expressed in the same currency:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; · E&lt;small&gt;price of the European good expressed in dollars&lt;/small&gt;&lt;/div&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E&lt;small&gt;price of the American good expressed in euros&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Law of one price&lt;/h3&gt;
  &lt;p&gt;If an identical good costs the same in the two countries once expressed in the same currency, the &lt;em class=&quot;t&quot;&gt;law of one price&lt;/em&gt; holds for that good:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;small&gt;the two expressions are equivalent: just divide both sides by E&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;The idea behind the law is &lt;b&gt;arbitrage&lt;/b&gt;: if a good were cheaper in the US, it would pay to buy it there and resell it in Europe until prices realign. Transport costs, tariffs, taxes and non-tradable goods prevent this. &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt;&lt;/p&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ppp&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;6 · Purchasing Power Parity and the Big Mac index &lt;span class=&quot;src&quot;&gt;slides 26–30&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;From the law of one price to PPP&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Purchasing Power Parity (PPP).&lt;/b&gt; If the law of one price holds &lt;b&gt;for all goods&lt;/b&gt; in a reference basket, then PPP holds: &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E = P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt;, where &lt;i&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt; is the average dollar price of the basket in the US and &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;&lt;/i&gt; the average euro price of the same basket in Europe.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;E&lt;/sub&gt;&lt;small&gt;in this special case the exchange rate equals the ratio of average price levels: measured in the same currency, price levels are the same everywhere&lt;/small&gt;&lt;/div&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Reference given in the slides for this part: Krugman and Obstfeld, &lt;i&gt;International Economics: Theory and Policy&lt;/i&gt; (see &lt;a href=&quot;#s-fonti&quot;&gt;Further reading&lt;/a&gt;).&lt;/p&gt;

  &lt;h3&gt;Does PPP really hold? The Big Mac index&lt;/h3&gt;
  &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;Economist&lt;/em&gt; uses a basket of a single good that is identical worldwide: the Big Mac. The «PPP» exchange rate is the one that would equalise the price of the burger in the two countries; it is compared with the market exchange rate.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 1 · The data (August 2023)&lt;/h4&gt;&lt;p&gt;Big Mac in the EZ: &lt;b&gt;€5.28&lt;/b&gt;. Big Mac in the US: &lt;b&gt;$5.58&lt;/b&gt;. Market exchange rate: &lt;b&gt;E = 1.10&lt;/b&gt; $ per €. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · The PPP exchange rate&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = 5.58 / 5.28 = 1.06&lt;/div&gt;&lt;p&gt;At €1 = $1.06 the Big Mac would cost the same in both countries.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Comparison with the market&lt;/h4&gt;&lt;p&gt;The market rate (1.10) is &lt;b&gt;higher&lt;/b&gt; than the PPP rate (1.06): the euro buys more dollars than it «should». The euro is therefore &lt;b&gt;overvalued&lt;/b&gt;; put differently, the dollar is &lt;span style=&quot;color:var(--slate)&quot;&gt;&lt;b&gt;undervalued&lt;/b&gt;&lt;/span&gt; against the euro.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Check in euros&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;5.58 / 1.10 = €5.07  &amp;lt;  €5.28&lt;/div&gt;&lt;p&gt;The American Big Mac, converted into euros, is cheaper: (5.07 − 5.28)/5.28 ≈ &lt;b&gt;−4%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 5 · Check in dollars&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;5.28 × 1.10 = $5.81  &amp;gt;  $5.58&lt;/div&gt;&lt;p&gt;A European with euros finds it cheaper to buy in the US. Both routes lead to the same conclusion.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;pppW&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;PPP lab: move prices and the exchange rate&lt;/div&gt;
   &lt;div class=&quot;presets&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;5.28,5.58,1.10&quot;&gt;August 2023&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;6.19,6.22,1.14&quot;&gt;July 2026&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;6.00,6.30,1.05&quot;&gt;Exact PPP&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pe&quot;&gt;Big Mac EZ (€)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pe&quot; min=&quot;3&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;5.28&quot;&gt;&lt;output id=&quot;peO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pu&quot;&gt;Big Mac US ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pu&quot; min=&quot;3&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;5.58&quot;&gt;&lt;output id=&quot;puO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ee&quot;&gt;Exchange rate E ($ per €)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ee&quot; min=&quot;0.8&quot; max=&quot;1.5&quot; step=&quot;0.01&quot; value=&quot;1.10&quot;&gt;&lt;output id=&quot;eeO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;pppSvg&quot; viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Price comparison in dollars&quot; style=&quot;width:100%;margin-top:.6rem&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;PPP E = P&lt;sub&gt;US&lt;/sub&gt;/P&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt;&lt;b id=&quot;rP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;EZ Big Mac in $ = P&lt;sub&gt;E&lt;/sub&gt;·E&lt;/span&gt;&lt;b id=&quot;rD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;US Big Mac in € = P&lt;sub&gt;US&lt;/sub&gt;/E&lt;/span&gt;&lt;b id=&quot;rE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Real exchange rate E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;E&lt;/sub&gt;E/P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;b id=&quot;rR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;rV&quot;&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.5rem 0 0&quot;&gt;The «Exact PPP» preset uses made-up numbers (6.30/6.00 = 1.05) to show the case E&lt;sub&gt;R&lt;/sub&gt; = 1.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Challenge yourself (slide 29)&lt;/h3&gt;
   &lt;p style=&quot;margin:.2rem 0 .6rem&quot;&gt;July 2025: Big Mac $6.01 in the US and €5.96 in the EZ. July 2026: $6.22 and €6.19. Market exchange rate in July 2026: 1.14. Try the lab above first.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;1. Big Mac price inflation between July 2025 and July 2026, in the EZ and in the US?&lt;/summary&gt;&lt;p&gt;EZ: (6.19 − 5.96)/5.96 = &lt;b&gt;+3.86%&lt;/b&gt;. US: (6.22 − 6.01)/6.01 = &lt;b&gt;+3.49%&lt;/b&gt;. The Big Mac became slightly more expensive in the eurozone.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;2. In July 2026, is the euro overvalued or undervalued against the dollar?&lt;/summary&gt;&lt;p&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = 6.22/6.19 ≈ &lt;b&gt;1.005&lt;/b&gt;. The market rate (1.14) is higher: the euro is &lt;b&gt;overvalued&lt;/b&gt;, by about 1.14/1.005 − 1 ≈ &lt;b&gt;+13%&lt;/b&gt; (equivalently: 6.19 × 1.14 = $7.06 versus $6.22).&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;3. In July 2026, is it cheaper to buy a Big Mac in the US or in the EZ?&lt;/summary&gt;&lt;p&gt;In the &lt;b&gt;US&lt;/b&gt;: 6.22/1.14 = &lt;b&gt;€5.46&lt;/b&gt; versus €6.19 in the EZ, about 12% less for someone paying in euros.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-reale&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;7 · Bilateral real exchange rate &lt;span class=&quot;src&quot;&gt;slides 31–33, 43&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;The real exchange rate as a measure of competitiveness&lt;/h3&gt;
  &lt;p&gt;If PPP holds, &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E = P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt;, that is &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E/P&lt;sub&gt;US&lt;/sub&gt; = 1&lt;/i&gt;. &lt;b&gt;Deviations from PPP&lt;/b&gt; define the &lt;em class=&quot;t&quot;&gt;bilateral real exchange rate&lt;/em&gt;, a measure of competitiveness between two countries:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sub&gt;E&lt;/sub&gt; · E&lt;/span&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;small&gt;how many times more a European basket (converted into $) costs than the American basket&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1&lt;/h4&gt;Goods cost more in the EZ than in the US: the EZ is &lt;b&gt;less price-competitive&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;lt; 1&lt;/h4&gt;Goods cost less in the EZ than in the US: the EZ is &lt;b&gt;more competitive&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; can move for three reasons: European prices, American prices or the &lt;em class=&quot;t&quot;&gt;nominal exchange rate&lt;/em&gt; &lt;i&gt;E&lt;/i&gt;. The latter can therefore become an &lt;b&gt;economic policy instrument&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Country with its own currency: the exchange rate as an instrument&lt;/div&gt;
   &lt;p style=&quot;font-size:.92rem;margin-top:0&quot;&gt;Start from E&lt;sub&gt;R&lt;/sub&gt; = 1. Prices in the EZ rise relative to US prices (&lt;i&gt;ceteris paribus&lt;/i&gt;, i.e. all else being equal). Then try to correct this with the exchange rate.&lt;/p&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dp&quot;&gt;Relative increase in P&lt;sub&gt;E&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;dpO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;de&quot;&gt;Change in E&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;de&quot; min=&quot;-30&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;deO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;rerSvg&quot; viewBox=&quot;0 0 600 90&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Real exchange rate indicator&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;rerV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;And within a monetary union?&lt;/h3&gt;
  &lt;p&gt;Two countries A and B in the same MU, with average prices &lt;i&gt;P&lt;sub&gt;A&lt;/sub&gt;&lt;/i&gt; and &lt;i&gt;P&lt;sub&gt;B&lt;/sub&gt;&lt;/i&gt;. What is the exchange rate between A and B? There is none: they use the same currency, so &lt;b&gt;E = 1 forever&lt;/b&gt;. The real exchange rate reduces to:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;A&lt;/sub&gt; / P&lt;sub&gt;B&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Two countries in the MU&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pa&quot;&gt;Prices in A (index)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pa&quot; min=&quot;80&quot; max=&quot;130&quot; step=&quot;1&quot; value=&quot;112&quot;&gt;&lt;output id=&quot;paO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pb&quot;&gt;Prices in B (index)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pb&quot; min=&quot;80&quot; max=&quot;130&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;pbO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label&gt;A/B exchange rate&lt;/label&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2&quot; value=&quot;1&quot; disabled aria-label=&quot;Exchange rate locked&quot;&gt;&lt;output&gt;1 🔒&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;presets&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;devBtn&quot;&gt;Try to devalue A&#x27;s currency&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;muV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The message of the lecture.&lt;/b&gt; If A loses competitiveness relative to B, within the MU it &lt;b&gt;cannot devalue&lt;/b&gt;. Adjustment must come through relative prices: P&lt;sub&gt;A&lt;/sub&gt; must grow less than P&lt;sub&gt;B&lt;/sub&gt; (or fall). This is the so-called &lt;em class=&quot;t&quot;&gt;internal devaluation&lt;/em&gt;, slow and costly in terms of employment. This is why competitiveness divergences are a problem in an MU, and why we need to understand &lt;b&gt;what prices depend on&lt;/b&gt;, i.e. the next section. &lt;span class=&quot;gen&quot;&gt;connection&lt;/span&gt;&lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Connection with the theoretical part of the course&lt;/summary&gt;&lt;p&gt;The loss of the exchange rate as an instrument is at the heart of the &lt;i&gt;costs&lt;/i&gt; of a monetary union in the theory of &lt;em class=&quot;t&quot;&gt;optimum currency areas&lt;/em&gt;: when a country is hit by an &lt;em class=&quot;t&quot;&gt;asymmetric shock&lt;/em&gt; (a shock that affects one country and not the others), without its own exchange rate it needs wage and price flexibility, labour mobility or fiscal transfers. This lecture prepares the vocabulary: on slides 7–8, part 1 of the course is announced as a &lt;i&gt;costs and benefits analysis&lt;/i&gt; of an MU. &lt;span class=&quot;gen&quot;&gt;general connection, not from the slides&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Real exchange rate&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Prices in the EZ rise 5% more than in the US and E does not change. What happens to E&lt;sub&gt;R&lt;/sub&gt; and to competitiveness?&lt;/summary&gt;&lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; rises by about 5%: this is a &lt;i&gt;real appreciation&lt;/i&gt; and the EZ loses price competitiveness.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;To offset this, should E rise or fall? What does that mean for the euro?&lt;/summary&gt;&lt;p&gt;Fall by about 5% (more precisely 1/1.05 − 1 ≈ −4.8%): a &lt;b&gt;depreciation&lt;/b&gt; of the euro, because under the slides&#x27; convention a lower E means fewer dollars per euro.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;A&lt;/sub&gt;/P&lt;sub&gt;B&lt;/sub&gt; hold in an MU?&lt;/summary&gt;&lt;p&gt;Because A and B use the same currency: the nominal exchange rate between them is 1 and cannot change. Relative competitiveness depends only on prices (or costs).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ulc&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;8 · Prices, mark-up and Unit Labour Cost &lt;span class=&quot;src&quot;&gt;slides 34–38, 46&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;What do prices depend on?&lt;/h3&gt;
  &lt;p&gt;Market prices include &lt;b&gt;indirect taxes&lt;/b&gt; (such as &lt;em class=&quot;t&quot;&gt;VAT&lt;/em&gt;) that differ across countries. So we look at the &lt;b&gt;producer price&lt;/b&gt;. From the profit-maximising condition of a firm under &lt;em class=&quot;t&quot;&gt;imperfect competition&lt;/em&gt; we obtain a result similar to the &lt;em class=&quot;t&quot;&gt;mark-up rule&lt;/em&gt;: price equals unit cost plus a mark-up.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 1 · The assumption&lt;/h4&gt;&lt;p&gt;Labour is the only input. Notation: &lt;i&gt;P&lt;/i&gt; output price, &lt;i&gt;W&lt;/i&gt; wage or labour cost per employee (&lt;em class=&quot;t&quot;&gt;compensation per employee&lt;/em&gt;), &lt;i&gt;N&lt;/i&gt; employees, &lt;i&gt;Y&lt;/i&gt; output, &lt;i&gt;m&lt;/i&gt; mark-up.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 2 · The mark-up rule&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;P = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W N&lt;/span&gt;&lt;span&gt;Y&lt;/span&gt;&lt;/span&gt; (1 + m)&lt;small&gt;WN = total labour cost; divided by Y = labour cost per unit of output&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 3 · Unit labour cost&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ULC = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W N&lt;/span&gt;&lt;span&gt;Y&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;Y / N&lt;/span&gt;&lt;/span&gt;&lt;small&gt;&lt;em class=&quot;t&quot;&gt;unit labour cost&lt;/em&gt; = compensation per employee / labour productivity&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 4 · Rewriting in terms of productivity&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;P = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;Q&lt;/span&gt;&lt;/span&gt; (1 + m), &amp;nbsp; Q = Y/N&lt;small&gt;Q = &lt;em class=&quot;t&quot;&gt;average labour productivity&lt;/em&gt;&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Three factors determine the average price: &lt;b&gt;labour cost&lt;/b&gt; (W, pushes it up), &lt;b&gt;average productivity&lt;/b&gt; (Q, pushes it down) and the &lt;b&gt;mark-up&lt;/b&gt; (m, pushes it up).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Price calculator: P = (W/Q)(1+m)&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;w&quot;&gt;W annual wage (€)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w&quot; min=&quot;20000&quot; max=&quot;70000&quot; step=&quot;500&quot; value=&quot;40000&quot;&gt;&lt;output id=&quot;wO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;q&quot;&gt;Q = Y/N output per employee (units)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;10000&quot; max=&quot;40000&quot; step=&quot;500&quot; value=&quot;20000&quot;&gt;&lt;output id=&quot;qO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;m&quot;&gt;m mark-up&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;m&quot; min=&quot;0&quot; max=&quot;60&quot; step=&quot;1&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;mO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;ulcSvg&quot; viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:.5rem&quot; role=&quot;img&quot; aria-label=&quot;Price breakdown&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;ULC = W/Q (€ per unit)&lt;/span&gt;&lt;b id=&quot;uU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Price P (€ per unit)&lt;/span&gt;&lt;b id=&quot;uP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;of which margin&lt;/span&gt;&lt;b id=&quot;uM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin:.5rem 0 0&quot;&gt;Try this: raise W by 10% and then Q by 10%. The price returns to its original level, because what matters is the &lt;b&gt;ratio&lt;/b&gt; of wages to productivity, not the wage as such.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost competitiveness.&lt;/b&gt; In the real exchange rate the average price can be replaced by a cost measure, such as ULC. This yields cost competitiveness, which looks at wages and productivity rather than final prices. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Mark-up and ULC&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why is the producer price preferred to the market price when comparing competitiveness?&lt;/summary&gt;&lt;p&gt;Because market prices include indirect taxes such as VAT, which vary from country to country and do not depend on firms&#x27; efficiency.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Wages grow by 3%, productivity by 3%, the mark-up stays constant. What happens to ULC and to the price?&lt;/summary&gt;&lt;p&gt;ULC does not change (W/Q constant), and so neither does the price: wage growth is «paid for» by productivity.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the three factors that determine the average price?&lt;/summary&gt;&lt;p&gt;Labour cost (W), average labour productivity (Q = Y/N) and the mark-up (m).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-eer&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;9 · Effective exchange rate, REER and HCI &lt;span class=&quot;src&quot;&gt;slides 38–46&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;A country has many competitors, not just one&lt;/h3&gt;
  &lt;p&gt;So far the comparison has been bilateral (EZ versus US). A country, however, competes with many partners, including the other euro area countries. Summary indicators are therefore needed.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Effective exchange rate (EER)&lt;/h4&gt;Measures the &lt;b&gt;nominal&lt;/b&gt; value of the euro against the currencies of a Member State&#x27;s main competitors.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Real EER (REER)&lt;/h4&gt;Measures the &lt;b&gt;overall&lt;/b&gt; competitiveness of a Member State relative to its main trading partners, also taking prices or costs into account.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;EER = ∏&lt;sub&gt;j&lt;/sub&gt; (E&lt;sub&gt;j&lt;/sub&gt;)&lt;sup&gt;w&lt;sub&gt;j&lt;/sub&gt;&lt;/sup&gt;, &amp;nbsp; Σ w&lt;sub&gt;j&lt;/sub&gt; = 1&lt;small&gt;weighted &lt;b&gt;geometric&lt;/b&gt; mean of bilateral (nominal or real) exchange rates; the weights w&lt;sub&gt;j&lt;/sub&gt; are the &lt;b style=&quot;color:var(--acc)&quot;&gt;trade shares&lt;/b&gt; with each partner j&lt;/small&gt;&lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Numerical example: why a geometric mean&lt;/summary&gt;
   &lt;p&gt;Weights: US 0.40 · China 0.35 · United Kingdom 0.25. The euro appreciates by 10% against the dollar, depreciates by 5% against the yuan and is unchanged against sterling.&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;1.10&lt;sup&gt;0.40&lt;/sup&gt; × 0.95&lt;sup&gt;0.35&lt;/sup&gt; × 1.00&lt;sup&gt;0.25&lt;/sup&gt; ≈ 1.020 → EER +2.0%&lt;/div&gt;
   &lt;p&gt;With the geometric mean, the change in logarithms is the &lt;b&gt;weighted average of the changes&lt;/b&gt; in logarithms (0.4·9.5% − 0.35·5.1% ≈ 2.0%): this is the link with part D on growth rates. The numbers are made up for the example. &lt;span class=&quot;gen&quot;&gt;example&lt;/span&gt;&lt;/p&gt;
  &lt;/details&gt;

  &lt;h3&gt;How the weights change: the euro&#x27;s partners (EER-41)&lt;/h3&gt;
  &lt;p&gt;Since 2020 the weights also include trade in &lt;b&gt;services&lt;/b&gt; (Schmitz, Dietrich and Brisson, 2024, ECB). Toggle the series on or off:&lt;/p&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;presets&quot; id=&quot;twBtns&quot;&gt;&lt;/div&gt;
   &lt;svg id=&quot;twSvg&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;EER-41 trade weights over time&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.3rem 0 0&quot;&gt;Combined weights (goods + services) in %, by three-year period from 1995-97 to 2019-21. Values reconstructed &lt;b&gt;by eye&lt;/b&gt; from ECB Chart 6 on slide 39, hence approximate.&lt;/p&gt;
  &lt;/div&gt;
  &lt;ul class=&quot;tight&quot;&gt;
   &lt;li&gt;&lt;b&gt;US, United Kingdom and other advanced economies&lt;/b&gt;: declining weights; for the US the decline has stopped and partly reversed over the last decade.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;China&lt;/b&gt;: sharply rising weight, which increased further in the latest three-year period.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Other emerging economies&lt;/b&gt;: important in the 2000s, declining over the last decade.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Central and eastern EU Member States&lt;/b&gt;: increasingly important, thanks to integration into European &lt;em class=&quot;t&quot;&gt;value chains&lt;/em&gt;.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-m1&quot;&gt;Manufacturing vs services&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-m2&quot;&gt;Why it matters&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-m1&quot;&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 160&quot; role=&quot;img&quot; aria-label=&quot;Weight of China and the US in manufacturing and services&quot;&gt;
     &lt;g font-size=&quot;12&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;30&quot; font-weight=&quot;600&quot;&gt;China&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;16&quot; width=&quot;420&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;536&quot; y=&quot;29&quot;&gt;21% manufacturing (1st)&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;36&quot; width=&quot;120&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;236&quot; y=&quot;49&quot;&gt;6% services (4th)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;100&quot; font-weight=&quot;600&quot;&gt;USA&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;86&quot; width=&quot;260&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;376&quot; y=&quot;99&quot;&gt;13% manufacturing&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;106&quot; width=&quot;440&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;556&quot; y=&quot;119&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--paper)&quot;&gt;22% services (1st)&lt;/text&gt;
     &lt;/g&gt;
     &lt;g font-size=&quot;11&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;140&quot; width=&quot;10&quot; height=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;149&quot;&gt;manufacturing&lt;/text&gt;&lt;rect x=&quot;220&quot; y=&quot;140&quot; width=&quot;10&quot; height=&quot;10&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;149&quot;&gt;services&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;China is the euro area&#x27;s largest partner for manufactured goods (21%) but only the fourth for services (6%). The US is the largest partner for services (22% versus 13% in manufacturing): its share in services fell in the 1990s and has risen again over the last decade (telecommunications, computer and information services, other business services). The slide invites you to check the differences with the United Kingdom. &lt;span class=&quot;src&quot;&gt;slides 41–42&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-m2&quot; hidden&gt;
    &lt;p&gt;Shifts in partners&#x27; importance reflect trends that are sometimes &lt;b&gt;divergent between trade in goods and trade in services&lt;/b&gt;. If the weights included only goods, the REER would overstate the role of China and understate that of the US. A movement in the €/$ rate therefore matters more for overall competitiveness than manufacturing alone would suggest. &lt;span class=&quot;gen&quot;&gt;interpretation&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Harmonised Competitiveness Indicators (HCI)&lt;/h3&gt;
  &lt;p&gt;The ECB&#x27;s HCIs are designed to measure the price and cost competitiveness of euro area countries in a &lt;b&gt;comparable&lt;/b&gt; way, consistent with the euro&#x27;s REERs. For an EA country:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = E · &lt;span style=&quot;color:var(--acc)&quot;&gt;P&lt;sub&gt;EA country&lt;/sub&gt;&lt;/span&gt; / &lt;span style=&quot;color:var(--acc)&quot;&gt;P&lt;sub&gt;other&lt;/sub&gt;&lt;/span&gt;&lt;small&gt;the partners include the other euro countries (for which E = 1) and non-euro countries&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;CPI-based HCI&lt;/h4&gt;&lt;em class=&quot;t&quot;&gt;Consumer price indices&lt;/em&gt;: the average change over time in the prices paid by households for a basket of goods and services. Measures &lt;b&gt;price competitiveness&lt;/b&gt;. (Eurostat also uses GDP deflators.)&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;ULC-based HCI&lt;/h4&gt;Compensation per employee / labour productivity, where productivity is GDP at constant prices divided by employment: &lt;i&gt;ULC = W/(Y/N) = WN/Y&lt;/i&gt;. Measures &lt;b&gt;cost competitiveness&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Italy and Germany: ULC-based HCI (1999 Q1 = 100)&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;hy&quot;&gt;Year&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;hy&quot; min=&quot;1999&quot; max=&quot;2025&quot; value=&quot;2009&quot;&gt;&lt;output id=&quot;hyO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;hciSvg&quot; viewBox=&quot;0 0 640 280&quot; role=&quot;img&quot; aria-label=&quot;HCI for Italy and Germany&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;hciV&quot;&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.4rem 0 0&quot;&gt;Annual series &lt;b&gt;approximated by eye&lt;/b&gt; from the quarterly ECB chart on slide 44 (HCI-17 + euro area countries, ULC for the total economy). They are meant to show the shape, not to be quoted as figures. ↑ = loss of competitiveness.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;What the original chart shows: after 1999 the Italian indicator rises to about 114 in 2008-09 (a sharp &lt;b&gt;loss&lt;/b&gt; of cost competitiveness), while the German one falls towards 85-90. The divergence closes only partly after 2012. Slide 45 compares the ULC and CPI versions: for Italy the CPI version stays below the ULC one (costs grew faster than prices, so margins narrowed). &lt;span class=&quot;gen&quot;&gt;chart reading&lt;/span&gt;&lt;/p&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Data: &lt;a href=&quot;https://data.ecb.europa.eu/main-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, main figures&lt;/a&gt; → ECB interest rates and exchange rates → Harmonised competitiveness indicators &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · EER, REER, HCI&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between the EER and the REER?&lt;/summary&gt;&lt;p&gt;The EER is a weighted average of &lt;i&gt;nominal&lt;/i&gt; exchange rates against partners. The REER uses &lt;i&gt;real&lt;/i&gt; exchange rates (adjusted for relative prices or costs) and therefore measures overall competitiveness.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What do the weights depend on, and why have they changed?&lt;/summary&gt;&lt;p&gt;On trade shares with each partner. They have changed because of the rise of China, the integration of central and eastern Europe and, since 2020, because services are now included in the calculation.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;An Italian ULC-based HCI goes from 100 to 110. Good or bad news?&lt;/summary&gt;&lt;p&gt;Bad: an increase indicates a loss of cost competitiveness (real appreciation) of about 10%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the HCI of a euro country also include the other euro countries?&lt;/summary&gt;&lt;p&gt;Because they are important competitors. With them the nominal exchange rate is fixed (E = 1), so competitiveness depends only on relative prices and costs.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PART D ============ --&gt;
&lt;div class=&quot;part p-brick&quot; id=&quot;parteD&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;D&lt;/span&gt;&lt;h2&gt;From levels to growth rates&lt;/h2&gt;&lt;p&gt;We often want to know by how much competitiveness &lt;i&gt;changes&lt;/i&gt;, and what is driving it. This requires a brief mathematical review. &lt;span class=&quot;src&quot;&gt;slides 47–57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-mate&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;10 · Brief math revision &lt;span class=&quot;src&quot;&gt;slides 50–55&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Change, rate of change, discrete and continuous time&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · The change over an interval&lt;/h4&gt;&lt;p&gt;Given X(t), the change over a time interval Δt = s is:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ΔX = X(t + s) − X(t)&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Per unit of time&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X(t + s) − X(t)&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;ΔX&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt;&lt;small&gt;this is the slope of the «chord» between two points on the curve&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Continuous time: the derivative&lt;/h4&gt;&lt;p&gt;If the interval shrinks to zero we obtain the instantaneous change, the derivative with respect to time:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;lim&lt;sub&gt;s→0&lt;/sub&gt; &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X(t + s) − X(t)&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = Ẋ&lt;small&gt;the dot above the variable denotes the derivative with respect to time&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · The (proportional) growth rate&lt;/h4&gt;&lt;p&gt;We are usually interested in the change &lt;b&gt;relative to the level&lt;/b&gt;. Multiplied by 100 it becomes a percentage.&lt;/p&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;small&gt;discrete time&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;sub&gt;t&lt;/sub&gt;/dt&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Ẋ&lt;/span&gt;&lt;span&gt;X&lt;/span&gt;&lt;/span&gt;&lt;small&gt;continuous (instantaneous) time&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · The logarithm trick&lt;/h4&gt;&lt;p&gt;By the chain rule, the derivative of the logarithm is exactly the instantaneous growth rate:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;d log X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; · &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Ẋ&lt;/span&gt;&lt;span&gt;X&lt;/span&gt;&lt;/span&gt;&lt;small&gt;«This is the (instant) rate of change!!»&lt;/small&gt;&lt;/div&gt;&lt;p&gt;The advantage: the logarithm turns &lt;b&gt;products into sums&lt;/b&gt; and &lt;b&gt;ratios into differences&lt;/b&gt;. The growth rate of a product thus becomes the sum of the growth rates.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;The numerical comparison from the slides&lt;/h4&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;X&lt;/th&gt;&lt;th&gt;(X&lt;sub&gt;t&lt;/sub&gt; − X&lt;sub&gt;t−1&lt;/sub&gt;)/X&lt;sub&gt;t−1&lt;/sub&gt;&lt;/th&gt;&lt;th&gt;ln X&lt;/th&gt;&lt;th&gt;ln X&lt;sub&gt;t&lt;/sub&gt; − ln X&lt;sub&gt;t−1&lt;/sub&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;100.1&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;4.60616969&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;100.4&lt;/td&gt;&lt;td&gt;0.002988048&lt;/td&gt;&lt;td&gt;4.60916221&lt;/td&gt;&lt;td&gt;0.002992521&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;99.9&lt;/td&gt;&lt;td&gt;−0.00500501&lt;/td&gt;&lt;td&gt;4.60416969&lt;/td&gt;&lt;td&gt;−0.004992522&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;For small changes the difference in logarithms is practically equal to the discrete growth rate: they coincide up to the third or fourth decimal place. &lt;span class=&quot;src&quot;&gt;slide 54&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;When does the log approximation hold?&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;gx&quot;&gt;X&lt;sub&gt;t+1&lt;/sub&gt; (with X&lt;sub&gt;t&lt;/sub&gt; = 100)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;gx&quot; min=&quot;50&quot; max=&quot;200&quot; step=&quot;0.5&quot; value=&quot;103&quot;&gt;&lt;output id=&quot;gxO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;gSvg&quot; viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Discrete rate versus log difference&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;Discrete rate&lt;/span&gt;&lt;b id=&quot;gD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Log difference&lt;/span&gt;&lt;b id=&quot;gL&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Gap&lt;/span&gt;&lt;b id=&quot;gS&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Summary &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/h4&gt;
   &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Discrete time&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Change over an interval&lt;/td&gt;&lt;td&gt;&lt;i&gt;X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Growth rate&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;(X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;)/X&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Continuous time&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Instantaneous change&lt;/td&gt;&lt;td&gt;&lt;i&gt;dX/dt = Ẋ&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Instantaneous growth rate&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Ẋ/X = d log X(t)/dt&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Growth rates&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;X goes from 200 to 206. Discrete growth rate and log difference?&lt;/summary&gt;&lt;p&gt;Discrete: 6/200 = 3.00%. Log: ln(206) − ln(200) = ln(1.03) ≈ 2.96%. They are very close because the change is small.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why is d log X / dt equal to Ẋ/X?&lt;/summary&gt;&lt;p&gt;By the chain rule: the derivative of log X with respect to X is 1/X, which is multiplied by the derivative of X with respect to time, Ẋ.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;If Z = X·Y, what is the growth rate of Z? And if Z = X/Y?&lt;/summary&gt;&lt;p&gt;log Z = log X + log Y, so Ż/Z = Ẋ/X + Ẏ/Y. For the ratio: Ż/Z = Ẋ/X − Ẏ/Y.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-tassi&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;11 · Competitiveness dynamics, inflation and relative PPP &lt;span class=&quot;src&quot;&gt;slides 47–49, 56–57&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Rate of change of competitiveness&lt;/h3&gt;
  &lt;p&gt;The change in competitiveness in discrete time is &lt;i&gt;(E&lt;sub&gt;R,t&lt;/sub&gt; − E&lt;sub&gt;R,t−1&lt;/sub&gt;)/E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; increases&lt;/h4&gt;Loss of competitiveness: &lt;b&gt;real appreciation&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; decreases&lt;/h4&gt;Gain in competitiveness: &lt;b&gt;real depreciation&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;A change in E&lt;sub&gt;R&lt;/sub&gt; may be due to P&lt;sub&gt;E&lt;/sub&gt;, P&lt;sub&gt;US&lt;/sub&gt;, E or all three. Can we measure the contribution of each factor? Yes, using logarithms (denoted by lower-case letters, log X = x):&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · The level&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = P&lt;sub&gt;E,t&lt;/sub&gt; · E&lt;sub&gt;t&lt;/sub&gt; / P&lt;sub&gt;US,t&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Logarithms: the product becomes a sum&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;e&lt;sub&gt;R,t&lt;/sub&gt; = p&lt;sub&gt;E,t&lt;/sub&gt; + e&lt;sub&gt;t&lt;/sub&gt; − p&lt;sub&gt;US,t&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Derivative with respect to time&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;de&lt;sub&gt;R,t&lt;/sub&gt;/dt = dp&lt;sub&gt;E,t&lt;/sub&gt;/dt + de&lt;sub&gt;t&lt;/sub&gt;/dt − dp&lt;sub&gt;US,t&lt;/sub&gt;/dt&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · The result&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ė&lt;sub&gt;R&lt;/sub&gt; = (ṗ&lt;sub&gt;E&lt;/sub&gt; − ṗ&lt;sub&gt;US&lt;/sub&gt;) + ė&lt;small&gt;change in competitiveness = &lt;b&gt;inflation differential&lt;/b&gt; + change in the nominal exchange rate&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Here the dot over the lower-case letter already denotes a growth rate: ṗ&lt;sub&gt;E&lt;/sub&gt; is European inflation, ė the percentage change in E.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Decompose the change in competitiveness&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ie&quot;&gt;EZ inflation ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ie&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;ieO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iu&quot;&gt;US inflation ṗ&lt;sub&gt;US&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iu&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;iuO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ge&quot;&gt;Exchange-rate change ė&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ge&quot; min=&quot;-15&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;geO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;decSvg&quot; viewBox=&quot;0 0 600 150&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Decomposition of ė_R&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;decV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The inflation rate from the mark-up rule&lt;/h3&gt;
  &lt;p&gt;The same trick applies to the mark-up rule &lt;i&gt;P = (W/Q)(1 + m)&lt;/i&gt;. Taking logarithms and differentiating with respect to time:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;ṗ = ẇ − q̇ + Δm&lt;small&gt;where log(1+m) ≅ m, so d log(1+m)/dt ≅ dm/dt = Δm&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Key relationship.&lt;/b&gt; Inflation is zero if productivity growth is enough to cover the growth of wages and profit margins. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Inflation = wages − productivity + margins&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iw&quot;&gt;Wage growth ẇ&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iw&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;iwO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iq&quot;&gt;Productivity growth q̇&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iq&quot; min=&quot;-3&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;iqO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;im&quot;&gt;Change in mark-up Δm&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;im&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;imO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;ULC growth = ẇ − q̇&lt;/span&gt;&lt;b id=&quot;iU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Inflation ṗ&lt;/span&gt;&lt;b id=&quot;iP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;iV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Putting the pieces together.&lt;/b&gt; For two countries A and B in the same MU, ė = 0, so &lt;br&gt;&lt;span style=&quot;font-family:var(--serif);font-style:italic;font-size:1.1rem&quot;&gt;ė&lt;sub&gt;R&lt;/sub&gt; = ṗ&lt;sub&gt;A&lt;/sub&gt; − ṗ&lt;sub&gt;B&lt;/sub&gt; = (ẇ&lt;sub&gt;A&lt;/sub&gt; − q̇&lt;sub&gt;A&lt;/sub&gt; + Δm&lt;sub&gt;A&lt;/sub&gt;) − (ẇ&lt;sub&gt;B&lt;/sub&gt; − q̇&lt;sub&gt;B&lt;/sub&gt; + Δm&lt;sub&gt;B&lt;/sub&gt;)&lt;/span&gt;&lt;br&gt;If in A wages grow faster than productivity relative to B, A loses competitiveness year after year and cannot correct this through the exchange rate. This is the mechanism behind the divergence between Italy and Germany seen in the HCIs. &lt;span class=&quot;gen&quot;&gt;synthesis&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;A final note on PPP&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-p1&quot;&gt;Absolute vs relative&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-p2&quot;&gt;Does it work in the data?&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-p1&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Absolute PPP&lt;/h4&gt;The exchange rate equals the ratio of price &lt;b&gt;levels&lt;/b&gt;: E = P&lt;sub&gt;US&lt;/sub&gt;/P&lt;sub&gt;E&lt;/sub&gt;.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Relative PPP&lt;/h4&gt;The percentage change in the exchange rate over a period equals the &lt;b&gt;inflation differential&lt;/b&gt;:&lt;div class=&quot;formula&quot; style=&quot;font-size:1.2rem;margin:.5rem 0 0&quot;&gt;ė = ṗ&lt;sub&gt;US&lt;/sub&gt; − ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Connection: relative PPP is equivalent to &lt;b&gt;ė&lt;sub&gt;R&lt;/sub&gt; = 0&lt;/b&gt; in the formula above, i.e. a constant real exchange rate. If Europe has higher inflation than the US, the euro must depreciate (ė &amp;lt; 0) by the same amount. Relative PPP can hold even when absolute PPP does not (for example if taxes or transport costs create a constant gap between price levels). &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-p2&quot; hidden&gt;
    &lt;p&gt;Empirical support for PPP and the law of one price is &lt;b&gt;weak&lt;/b&gt; in recent data:&lt;/p&gt;
    &lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;the prices of identical baskets, converted into a single currency, differ widely across countries;&lt;/li&gt;&lt;li&gt;relative PPP sometimes approximates the data reasonably well, but overall it performs poorly.&lt;/li&gt;&lt;/ul&gt;
    &lt;p&gt;Possible reasons: transport costs and trade barriers, non-tradable goods and services (rents, personal services), imperfect competition allowing different prices in different markets, and baskets that differ across countries. &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt; This is precisely why the real exchange rate actually moves and competitiveness is a variable worth monitoring.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Competitiveness dynamics&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;EZ inflation 4%, US 2%, the euro appreciates by 3% (ė = +3%). What happens to EZ competitiveness?&lt;/summary&gt;&lt;p&gt;ė&lt;sub&gt;R&lt;/sub&gt; = (4 − 2) + 3 = +5%: real appreciation, a loss of competitiveness of about 5%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;With the same inflation rates, by how much should E change for relative PPP to hold?&lt;/summary&gt;&lt;p&gt;ė = ṗ&lt;sub&gt;US&lt;/sub&gt; − ṗ&lt;sub&gt;E&lt;/sub&gt; = 2 − 4 = −2%: the euro should depreciate by 2%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Wages +4%, productivity +1.5%, mark-up unchanged. Inflation?&lt;/summary&gt;&lt;p&gt;ṗ = 4 − 1.5 + 0 = 2.5%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why do inflation differences between member countries matter so much in an MU?&lt;/summary&gt;&lt;p&gt;Because with ė = 0 the change in bilateral competitiveness coincides with the inflation differential: a country with systematically higher inflation loses competitiveness cumulatively.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;
