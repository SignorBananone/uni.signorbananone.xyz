 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;A&lt;/span&gt;&lt;h2&gt;The course, the Union and its treaties&lt;/h2&gt;&lt;p&gt;What the course is about, who uses the euro and which rules the Union is founded on.&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-corso&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;1 · Why study EMU &lt;span class=&quot;src&quot;&gt;slides 1–9&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;A historic event: a common currency without force of arms&lt;/h3&gt;
  &lt;p&gt;On 1 January 1999 the &lt;em class=&quot;t&quot;&gt;Economic and Monetary Union&lt;/em&gt; (EMU) begins: 11 countries irrevocably fix their exchange rates and entrust monetary policy to a single central bank, the &lt;em class=&quot;t&quot;&gt;European Central Bank&lt;/em&gt; (ECB). The slides stress its novelty: history records very few attempts to create a &lt;em class=&quot;t&quot;&gt;monetary union&lt;/em&gt; (MU) &lt;b&gt;without military conquest&lt;/b&gt;, that is, with the consent of sovereign states.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary union (MU).&lt;/b&gt; A group of countries that adopts &lt;b&gt;a single currency&lt;/b&gt;. It follows that there is a single exchange rate vis-à-vis the rest of the world, a single central bank and a single monetary policy (one official interest rate). Each country therefore gives up its own exchange rate and its own monetary policy as policy instruments. &lt;span class=&quot;gen&quot;&gt;general explanation&lt;/span&gt;&lt;/div&gt;

    &lt;ul class=&quot;tight&quot;&gt;
     &lt;li&gt;What does economic theory say about monetary unions?&lt;/li&gt;
     &lt;li&gt;What did &lt;b&gt;economists&lt;/b&gt; in the 1980s and 1990s think of the idea of a European MU?&lt;/li&gt;
     &lt;li&gt;What comes out of the &lt;b&gt;costs and benefits analysis&lt;/b&gt;?&lt;/li&gt;
     &lt;li&gt;How was the ECB designed to conduct a single monetary policy? Does the design have flaws, and why?&lt;/li&gt;
     &lt;li&gt;How does fiscal policy work in the European MU? How has EMU responded to crises, and how is it tackling climate change?&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-c2&quot; hidden&gt;
    &lt;p&gt;Slide 9 lists three basic issues:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Different types of MU&lt;/h4&gt;Not all monetary unions are alike: they differ in how integrated public budgets, banks and labour markets are.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;MUs that are «fragile» because &lt;span style=&quot;color:var(--acc)&quot;&gt;incomplete&lt;/span&gt;&lt;/h4&gt;An MU with a common currency but no common budget or banking union has fewer defences against shocks. &lt;span class=&quot;gen&quot;&gt;interpretation&lt;/span&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Different institutions&lt;/h4&gt;Who decides what (ECB, Commission, Council, national governments) shapes how the union works.&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Are there problems specific to the European MU? Did they emerge from the start? The course answers these questions later on.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-c3&quot; hidden&gt;

     &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Exam&lt;/h4&gt;&lt;b&gt;70%&lt;/b&gt; written exam · &lt;b&gt;30%&lt;/b&gt; class project and active participation (topics and references provided in class). &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · Why study EMU&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why is the launch of EMU in 1999 considered «historic»?&lt;/summary&gt;&lt;p&gt;Because a group of sovereign states voluntarily gave up their own currencies. In the past, monetary unions almost always arose from conquest or from political unification imposed by force.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the two parts of the course, and what kind of question does each ask?&lt;/summary&gt;&lt;p&gt;(1) Theory: what are the costs and benefits of forming an MU and giving up one&#x27;s own currency? (2) Economic policy: how does EMU actually work (ECB, fiscal policy, crises, climate) and what problems does it create?&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What does it mean for an MU to be «incomplete»?&lt;/summary&gt;&lt;p&gt;It has the single currency but lacks other common institutions (for example a federal budget or a complete banking union) that help absorb crises. This makes it more fragile.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ue&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;2 · Who is in EMU &lt;span class=&quot;src&quot;&gt;slides 10–12&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;From the EU to the euro: the entry rules&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;1 · EU first&lt;/h4&gt;To join EMU a country must be a member of the European Union.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;2 · Obligation to adopt the euro&lt;/h4&gt;Once in the EU, a country is &lt;b&gt;legally obliged&lt;/b&gt; to adopt the euro when it meets the conditions of the &lt;em class=&quot;t&quot;&gt;Maastricht Treaty&lt;/em&gt;. The only exemption: Denmark (DK).&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;3 · A democratic choice&lt;/h4&gt;Accession to the EU was decided by a parliamentary vote or by a &lt;b&gt;referendum&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;What are the «Maastricht conditions»?&lt;/summary&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; They are the &lt;em class=&quot;t&quot;&gt;convergence criteria&lt;/em&gt; of Art. 140(1) TFEU: price stability, sound public finances, exchange-rate stability (participation in the European exchange-rate mechanism, ERM II) and convergence of long-term interest rates. It is also checked that national central bank legislation is compatible with EU law. At least every two years the ECB and the Commission publish a &lt;em class=&quot;t&quot;&gt;convergence report&lt;/em&gt;; the final decision rests with the Council of the EU. Source: &lt;a href=&quot;https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, «What does a country need to do to join the euro area?»&lt;/a&gt;&lt;/p&gt;
  &lt;/details&gt;
