 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;A&lt;/span&gt;&lt;h2&gt;Il corso, l&#x27;Unione e i suoi trattati&lt;/h2&gt;&lt;p&gt;Di cosa parla il corso, chi usa l&#x27;euro e su quali regole si fonda l&#x27;Unione.&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-corso&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;1 · Perché studiare l&#x27;EMU &lt;span class=&quot;src&quot;&gt;slide 1–9&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Un evento storico: una moneta comune senza la forza delle armi&lt;/h3&gt;
  &lt;p&gt;Il 1° gennaio 1999 parte l&#x27;&lt;em class=&quot;t&quot;&gt;Economic and Monetary Union&lt;/em&gt; (EMU, unione economica e monetaria): 11 paesi fissano irrevocabilmente i cambi e affidano la politica monetaria a una sola banca centrale, la &lt;em class=&quot;t&quot;&gt;European Central Bank&lt;/em&gt; (ECB, Banca centrale europea). Le slide ne sottolineano la novità: nella storia si contano pochissimi tentativi di creare un&#x27;unione monetaria (&lt;em class=&quot;t&quot;&gt;monetary union&lt;/em&gt;, MU) &lt;b&gt;senza conquista militare&lt;/b&gt;, cioè con il consenso di Stati sovrani.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Monetary union (MU).&lt;/b&gt; Gruppo di paesi che adotta &lt;b&gt;una sola moneta&lt;/b&gt;. Ne seguono un solo tasso di cambio verso il resto del mondo, una sola banca centrale e una sola politica monetaria (un unico tasso d&#x27;interesse ufficiale). Ogni paese rinuncia quindi al proprio cambio e alla propria politica monetaria come strumenti. &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt;&lt;/div&gt;

  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 760 230&quot; role=&quot;img&quot; aria-label=&quot;Le due parti del corso&quot;&gt;

    &lt;text x=&quot;30&quot; y=&quot;74&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Conviene formare una MU?&lt;/text&gt;

    &lt;rect x=&quot;242&quot; y=&quot;106&quot; width=&quot;66&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;benefici&lt;/text&gt;

    &lt;text x=&quot;420&quot; y=&quot;74&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Come funziona l&#x27;EMU?&lt;/text&gt;
    &lt;g font-size=&quot;13&quot;&gt;&lt;text x=&quot;430&quot; y=&quot;104&quot;&gt;• ECB e politica monetaria unica&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;128&quot;&gt;• politica fiscale in una MU&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;152&quot;&gt;• le crisi e le riforme&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;176&quot;&gt;• EMU e cambiamento climatico&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M362 115h34&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-c1&quot;&gt;Domande guida&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-c2&quot;&gt;Basic issues&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-c3&quot;&gt;Organizzazione&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-c1&quot;&gt;
    &lt;ul class=&quot;tight&quot;&gt;
     &lt;li&gt;Che cosa dice la teoria economica sulle unioni monetarie?&lt;/li&gt;
     &lt;li&gt;Che cosa pensavano gli &lt;b&gt;economisti&lt;/b&gt; negli anni &#x27;80–&#x27;90 dell&#x27;idea di una MU europea?&lt;/li&gt;
     &lt;li&gt;Che cosa ne esce dalla &lt;b&gt;costs and benefits analysis&lt;/b&gt; (analisi costi-benefici)?&lt;/li&gt;
     &lt;li&gt;Come è stata disegnata la ECB per condurre una politica monetaria unica? Il disegno ha difetti, e perché?&lt;/li&gt;
     &lt;li&gt;Come funziona la politica fiscale nella MU europea? Come ha reagito l&#x27;EMU alle crisi, e come affronta il cambiamento climatico?&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-c2&quot; hidden&gt;
    &lt;p&gt;La slide 9 elenca tre questioni di fondo:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Diversi tipi di MU&lt;/h4&gt;Non tutte le unioni monetarie sono uguali: cambia quanto sono integrati bilancio pubblico, banche e mercato del lavoro.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;MU «fragili» perché &lt;span style=&quot;color:var(--acc)&quot;&gt;incomplete&lt;/span&gt;&lt;/h4&gt;Una MU con moneta comune ma senza bilancio comune né unione bancaria ha meno difese davanti agli shock. &lt;span class=&quot;gen&quot;&gt;interpretazione&lt;/span&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Istituzioni diverse&lt;/h4&gt;Chi decide che cosa (ECB, Commissione, Consiglio, governi nazionali) cambia il funzionamento dell&#x27;unione.&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Ci sono problemi tipici della MU europea? Sono emersi fin dall&#x27;inizio? Il corso risponde a queste domande più avanti.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-c3&quot; hidden&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Orario e ricevimento&lt;/h4&gt;Mar 8.30–10.30 (aula 10) · Mer 10.30–12.30 (aula 5 Moroni). Ricevimento: gio 14.30–16.30 o online su richiesta via email. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Esame&lt;/h4&gt;&lt;b&gt;70%&lt;/b&gt; esame scritto · &lt;b&gt;30%&lt;/b&gt; class project e partecipazione attiva (temi e riferimenti forniti a lezione). &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Testo&lt;/h4&gt;Paul De Grauwe, &lt;i&gt;Economics of Monetary Union&lt;/i&gt;, OUP, 14ª ed. Altri materiali su Moodle, in «Slides and course materials» (chiave d&#x27;iscrizione sulla slide 4). &lt;span class=&quot;src&quot;&gt;slide 3–4&lt;/span&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Calendario&lt;/h4&gt;48 ore da settembre a dicembre (12 + 14 + 14 + 8); ultima lezione evidenziata: 16 dicembre. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Perché studiare l&#x27;EMU&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché l&#x27;avvio dell&#x27;EMU nel 1999 è considerato «storico»?&lt;/summary&gt;&lt;p&gt;Perché un gruppo di Stati sovrani ha rinunciato volontariamente alla propria moneta. In passato le unioni monetarie nascevano quasi sempre da conquiste o unificazioni politiche imposte con la forza.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono le due parti del corso e che tipo di domanda pone ciascuna?&lt;/summary&gt;&lt;p&gt;(1) Teoria: quali sono i costi e i benefici di formare una MU e abbandonare la propria moneta? (2) Politica economica: come funziona davvero l&#x27;EMU (ECB, politica fiscale, crisi, clima) e quali problemi crea?&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cosa significa che una MU è «incompleta»?&lt;/summary&gt;&lt;p&gt;Che ha la moneta unica ma le mancano altre istituzioni comuni (per esempio un bilancio federale o un&#x27;unione bancaria completa) che aiutano ad assorbire le crisi. Per questo è più fragile.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ue&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;2 · Chi è nell&#x27;EMU &lt;span class=&quot;src&quot;&gt;slide 10–12&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Dall&#x27;UE all&#x27;euro: le regole d&#x27;ingresso&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;1 · Prima l&#x27;UE&lt;/h4&gt;Per entrare nell&#x27;EMU un paese deve essere membro dell&#x27;Unione europea.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;2 · Obbligo dell&#x27;euro&lt;/h4&gt;Una volta nell&#x27;UE, il paese è &lt;b&gt;legalmente obbligato&lt;/b&gt; ad adottare l&#x27;euro quando soddisfa le condizioni del &lt;em class=&quot;t&quot;&gt;Maastricht Treaty&lt;/em&gt;. Unica esenzione: la Danimarca (DK).&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;3 · Scelta democratica&lt;/h4&gt;L&#x27;ingresso nell&#x27;UE è stato deciso con un voto parlamentare o con un &lt;b&gt;referendum&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Che cosa sono le «condizioni di Maastricht»?&lt;/summary&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Sono i &lt;em class=&quot;t&quot;&gt;convergence criteria&lt;/em&gt; (criteri di convergenza) dell&#x27;art. 140(1) TFEU: stabilità dei prezzi, finanze pubbliche sane, stabilità del cambio (partecipazione agli accordi di cambio europei, ERM II) e convergenza dei tassi d&#x27;interesse a lungo termine. Si verifica anche che la legislazione della banca centrale nazionale sia compatibile con quella europea. Almeno ogni due anni ECB e Commissione pubblicano un &lt;em class=&quot;t&quot;&gt;convergence report&lt;/em&gt;; la decisione finale spetta al Consiglio dell&#x27;UE. Fonte: &lt;a href=&quot;https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, «What does a country need to do to join the euro area?»&lt;/a&gt;&lt;/p&gt;
  &lt;/details&gt;

  &lt;h4&gt;Entrate e uscite dall&#x27;UE: clicca un anno&lt;/h4&gt;
  &lt;div class=&quot;tl&quot; id=&quot;tl&quot;&gt;
   &lt;button data-t=&quot;&lt;b&gt;1958, i «founding countries»:&lt;/b&gt; Belgio, Francia, Germania, Italia, Lussemburgo, Paesi Bassi.&quot;&gt;1958&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;1973:&lt;/b&gt; Danimarca, Irlanda, Regno Unito (referendum). La Norvegia vota per non entrare.&quot;&gt;1973&lt;/button&gt;
   &lt;button class=&quot;exit&quot; data-t=&quot;&lt;b&gt;1975:&lt;/b&gt; nel Regno Unito gli elettori scelgono di restare, con il 67% dei voti.&quot;&gt;1975&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;1981:&lt;/b&gt; Grecia.&quot;&gt;1981&lt;/button&gt;
   &lt;button class=&quot;exit&quot; data-t=&quot;&lt;b&gt;1982:&lt;/b&gt; la Groenlandia (territorio autonomo danese) vota per uscire; l&#x27;uscita avviene nel 1985.&quot;&gt;1982–85&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;1986:&lt;/b&gt; Portogallo e Spagna.&quot;&gt;1986&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;1995:&lt;/b&gt; Austria, Finlandia, Svezia (referendum).&quot;&gt;1995&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;2004, il grande allargamento:&lt;/b&gt; Estonia, Lettonia, Lituania, Malta, Polonia, Slovacchia, Slovenia, Repubblica Ceca, Ungheria (referendum) e Cipro.&quot;&gt;2004&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;2007:&lt;/b&gt; Bulgaria e Romania.&quot;&gt;2007&lt;/button&gt;
   &lt;button data-t=&quot;&lt;b&gt;2013:&lt;/b&gt; Croazia (referendum). L&#x27;UE arriva a 28 membri.&quot;&gt;2013&lt;/button&gt;
   &lt;button class=&quot;exit&quot; data-t=&quot;&lt;b&gt;2020, Brexit&lt;/b&gt;, dopo il referendum del 2016. L&#x27;UE torna a 27 membri.&quot;&gt;2020&lt;/button&gt;
   &lt;button class=&quot;exit&quot; data-t=&quot;&lt;b&gt;2026:&lt;/b&gt; l&#x27;Islanda vota contro la riapertura dei negoziati formali di adesione (52,8% di no). &lt;span class=&#x27;ext&#x27;&gt;fonte esterna&lt;/span&gt; Il referendum si è tenuto il 29 agosto 2026; affluenza oltre l&#x27;80%; il voto è consultivo ma il governo ha detto che lo rispetterà (&lt;a href=&#x27;https://www.aljazeera.com/news/2026/8/30/iceland-votes-to-reject-eu-accession-talks-what-happens-next&#x27; target=&#x27;_blank&#x27; rel=&#x27;noopener&#x27;&gt;Al Jazeera&lt;/a&gt;).&quot;&gt;2026&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tlout&quot; id=&quot;tlout&quot; aria-live=&quot;polite&quot;&gt;Seleziona un anno per leggere chi entra o esce. I bottoni tratteggiati indicano uscite o voti contrari.&lt;/div&gt;

  &lt;h4 style=&quot;margin-top:1.6rem&quot;&gt;Oggi: UE a 27, di cui 21 nell&#x27;euro&lt;/h4&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Come si è allargata l&#x27;area euro&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;yr&quot;&gt;Anno&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;yr&quot; min=&quot;1999&quot; max=&quot;2026&quot; value=&quot;2026&quot;&gt;&lt;output id=&quot;yrO&quot;&gt;2026&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;chips&quot; id=&quot;chips&quot;&gt;
    &lt;span data-y=&quot;1999&quot;&gt;Austria&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Belgio&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Finlandia&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Francia&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Germania&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Irlanda&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Italia&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Lussemburgo&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Paesi Bassi&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Portogallo&lt;/span&gt;&lt;span data-y=&quot;1999&quot;&gt;Spagna&lt;/span&gt;
    &lt;span data-y=&quot;2001&quot;&gt;Grecia 2001&lt;/span&gt;&lt;span data-y=&quot;2007&quot;&gt;Slovenia 2007&lt;/span&gt;&lt;span data-y=&quot;2008&quot;&gt;Cipro 2008&lt;/span&gt;&lt;span data-y=&quot;2008&quot;&gt;Malta 2008&lt;/span&gt;&lt;span data-y=&quot;2009&quot;&gt;Slovacchia 2009&lt;/span&gt;&lt;span data-y=&quot;2011&quot;&gt;Estonia 2011&lt;/span&gt;&lt;span data-y=&quot;2014&quot;&gt;Lettonia 2014&lt;/span&gt;&lt;span data-y=&quot;2015&quot;&gt;Lituania 2015&lt;/span&gt;&lt;span data-y=&quot;2023&quot;&gt;Croazia 2023&lt;/span&gt;&lt;span data-y=&quot;2026&quot;&gt;Bulgaria 2026&lt;/span&gt;
   &lt;/div&gt;
   &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;out&quot;&gt;Rep. Ceca&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Danimarca (opt-out)&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Ungheria&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Polonia&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Romania&lt;/span&gt;&lt;span class=&quot;out&quot;&gt;Svezia&lt;/span&gt;&lt;/div&gt;
   &lt;p id=&quot;yrTxt&quot; style=&quot;font-size:.92rem;margin:.2rem 0 0&quot;&gt;&lt;/p&gt;
   &lt;p style=&quot;font-size:.82rem;color:var(--muted);margin:.4rem 0 0&quot;&gt;Prima riga: i 21 paesi dell&#x27;euro (gli 11 senza anno sono i fondatori del 1999, in rosso nella slide 12). Seconda riga: i 6 paesi UE che non usano l&#x27;euro. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La Bulgaria ha adottato l&#x27;euro il 1° gennaio 2026 al cambio fisso di 1,95583 lev per euro (&lt;a href=&quot;https://www.europarl.europa.eu/thinktank/en/document/EPRS_ATA(2025)775850&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPRS&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Chi è nell&#x27;EMU&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Un paese può adottare l&#x27;euro senza essere membro dell&#x27;UE, secondo le regole dell&#x27;EMU?&lt;/summary&gt;&lt;p&gt;No. Il primo requisito è l&#x27;appartenenza all&#x27;UE. (Esistono casi di uso unilaterale dell&#x27;euro fuori dall&#x27;UE, ma non sono membri dell&#x27;EMU.)&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;La Svezia non usa l&#x27;euro. Ha un&#x27;esenzione come la Danimarca?&lt;/summary&gt;&lt;p&gt;No. Secondo le slide l&#x27;unica esenzione è la Danimarca. La Svezia è formalmente obbligata ad adottare l&#x27;euro, ma non soddisfa (di fatto non cerca di soddisfare) tutte le condizioni di Maastricht.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quanti paesi fondarono l&#x27;euro nel 1999 e qual è l&#x27;ultimo entrato?&lt;/summary&gt;&lt;p&gt;11 fondatori; l&#x27;ultimo è la Bulgaria (2026), il 21° membro.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-trattati&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;3 · Trattati e istituzioni &lt;span class=&quot;src&quot;&gt;slide 13–16&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Le due «costituzioni» dell&#x27;Unione&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;TEU · Treaty on European Union&lt;/h4&gt;55 articoli: obiettivi principali e diritti. È il trattato «dei principi».&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;TFEU · Treaty on the Functioning of the EU&lt;/h4&gt;358 articoli, più dettagliato. Contiene la parte su &lt;b&gt;Economic and Monetary Policy&lt;/b&gt; (Titolo VIII), quella che useremo di più. Prima si chiamava &lt;i&gt;Treaty establishing the European Community&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il &lt;b&gt;Treaty of Lisbon&lt;/b&gt; (in vigore dal 2009), ratificato da tutti gli Stati membri, ha modificato le versioni precedenti dei trattati. &lt;b&gt;L&#x27;Italia è il &lt;span style=&quot;color:var(--acc)&quot;&gt;paese depositario&lt;/span&gt;&lt;/b&gt; dei trattati fondativi del 1957 e di tutti i successivi: il Trattato di Lisbona, redatto in un&#x27;unica copia nelle 23 lingue ufficiali di allora, è «depositato negli archivi del Governo della Repubblica italiana». &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Lisbona fu firmato il 13 dicembre 2007 ed entrò in vigore il 1° dicembre 2009 (&lt;a href=&quot;https://www.europarl.europa.eu/about-parliament/en/in-the-past/the-parliament-and-the-treaties/treaty-of-lisbon&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Parlamento europeo&lt;/a&gt;).&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-a3&quot;&gt;Art. 3 TEU&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-a9&quot;&gt;Art. 9 TEU&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-a13&quot;&gt;Art. 13 TEU&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a3&quot;&gt;
    &lt;p&gt;&lt;b&gt;Art. 3.3&lt;/b&gt;: l&#x27;Unione instaura un &lt;em class=&quot;t&quot;&gt;internal market&lt;/em&gt; (mercato interno) e lavora per lo sviluppo sostenibile dell&#x27;Europa. Le slide sottolineano gli obiettivi economici:&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card&quot;&gt;sustainable development&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;balanced economic growth&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;price stability&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;full employment&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;quality of the environment&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;social market economy, altamente competitiva&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Seguono la lotta all&#x27;esclusione sociale e alle discriminazioni, la coesione economica, sociale e territoriale, la solidarietà tra Stati membri e il rispetto della diversità culturale e linguistica.&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Art. 3.4&lt;/b&gt;: «The Union shall establish an &lt;span style=&quot;color:var(--acc)&quot;&gt;economic and monetary union whose currency is the euro&lt;/span&gt;». L&#x27;EMU è quindi un obiettivo scritto nei trattati, non un accordo accessorio.&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Da notare: &lt;i&gt;price stability&lt;/i&gt; e &lt;i&gt;full employment&lt;/i&gt; stanno nello stesso elenco. Quando nella parte 2 si discute il mandato della ECB, che ha come obiettivo primario la stabilità dei prezzi, questa tensione tornerà. &lt;span class=&quot;gen&quot;&gt;collegamento&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a9&quot; hidden&gt;
    &lt;p&gt;L&#x27;Unione rispetta in tutte le sue attività il &lt;b&gt;principio di uguaglianza dei cittadini&lt;/b&gt;. Ogni cittadino di uno Stato membro è cittadino dell&#x27;Unione; la cittadinanza europea &lt;b&gt;si aggiunge&lt;/b&gt; a quella nazionale e non la sostituisce.&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-a13&quot; hidden&gt;
    &lt;p&gt;Le 7 istituzioni dell&#x27;Unione (in grassetto quelle centrali per questo corso):&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
     &lt;div class=&quot;card&quot;&gt;European Parliament&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;European Council&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;capi di Stato e di governo&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;Council&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;ministri nazionali, per materia&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;European Commission&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;esecutivo, proposta e sorveglianza&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;Court of Justice of the EU&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;b&gt;European Central Bank&lt;/b&gt;&lt;br&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;politica monetaria dell&#x27;euro&lt;/small&gt;&lt;/div&gt;
     &lt;div class=&quot;card&quot;&gt;Court of Auditors&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure&gt;
     &lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;ECOFIN contiene l&#x27;Eurogruppo&quot;&gt;
      &lt;ellipse cx=&quot;320&quot; cy=&quot;85&quot; rx=&quot;300&quot; ry=&quot;75&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;ellipse cx=&quot;400&quot; cy=&quot;90&quot; rx=&quot;160&quot; ry=&quot;50&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;80&quot; y=&quot;70&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;ECOFIN&lt;/text&gt;
      &lt;text x=&quot;80&quot; y=&quot;90&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;ministri economia e finanze&lt;/text&gt;
      &lt;text x=&quot;80&quot; y=&quot;106&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;dei 27 paesi UE&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;Eurogroup&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;ministri dei 21 paesi dell&#x27;euro&lt;/text&gt;
     &lt;/svg&gt;
     &lt;figcaption&gt;ECOFIN (&lt;i&gt;Economic and Financial Affairs Council&lt;/i&gt;) è una formazione del Consiglio; l&#x27;Eurogruppo riunisce solo i ministri dei paesi dell&#x27;euro. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/figcaption&gt;
    &lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Raccolta ufficiale dei trattati in vigore: &lt;a href=&quot;https://eur-lex.europa.eu/collection/eu-law/treaties/treaties-force.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, Treaties currently in force&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Trattati e istituzioni&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Quale dei due trattati contiene le regole dettagliate di politica economica e monetaria?&lt;/summary&gt;&lt;p&gt;Il TFEU (Treaty on the Functioning of the EU), Titolo VIII «Economic and Monetary Policy».&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In quale articolo del TEU si dice che l&#x27;Unione instaura un&#x27;EMU la cui moneta è l&#x27;euro?&lt;/summary&gt;&lt;p&gt;Art. 3, paragrafo 4.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Qual è la differenza tra ECOFIN ed Eurogruppo?&lt;/summary&gt;&lt;p&gt;ECOFIN riunisce i ministri dell&#x27;economia e delle finanze di tutti i 27 paesi UE ed è una formazione del Consiglio. L&#x27;Eurogruppo riunisce solo i ministri dei 21 paesi che usano l&#x27;euro.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che ruolo ha l&#x27;Italia rispetto ai trattati?&lt;/summary&gt;&lt;p&gt;È il paese depositario: conserva gli originali dei trattati del 1957 e di tutti i successivi, compreso Lisbona.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE B ============ --&gt;
&lt;div class=&quot;part p-ochre&quot; id=&quot;parteB&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;B&lt;/span&gt;&lt;h2&gt;L&#x27;area euro in cifre&lt;/h2&gt;&lt;p&gt;Quanto pesa l&#x27;area euro nel mondo e quanto sono diversi i paesi al suo interno.&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ea&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;4 · Caratteristiche dell&#x27;Euro Area (EA) &lt;span class=&quot;src&quot;&gt;slide 17–22&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;EA e Stati Uniti a confronto&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-e1&quot;&gt;Popolazione e PIL&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-e2&quot;&gt;Lavoro e conti pubblici&lt;/button&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-e3&quot;&gt;Struttura&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e1&quot;&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Popolazione e PIL di area euro, USA e Cina&quot;&gt;
     &lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Popolazione (milioni)&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;48&quot; font-size=&quot;12&quot;&gt;Euro area&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;36&quot; width=&quot;358.7&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;50&quot; font-size=&quot;12&quot;&gt;358,7&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;64&quot; width=&quot;341.8&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;438&quot; y=&quot;78&quot; font-size=&quot;12&quot;&gt;341,8&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;128&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;PIL 2025 (migliaia di mld di $ costanti 2015)&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;158&quot; font-size=&quot;12&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;146&quot; width=&quot;464.4&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;160&quot; font-size=&quot;12&quot;&gt;23,2&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;186&quot; font-size=&quot;12&quot;&gt;Cina&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;174&quot; width=&quot;388&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;484&quot; y=&quot;188&quot; font-size=&quot;12&quot;&gt;19,4&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;214&quot; font-size=&quot;12&quot;&gt;Euro area&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;202&quot; width=&quot;273.8&quot; height=&quot;18&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;216&quot; font-size=&quot;12&quot;&gt;13,7&lt;/text&gt;
     &lt;text x=&quot;0&quot; y=&quot;244&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;Dati World Bank riportati nella slide 18 (NY.GDP.MKTP.KD).&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;Secondo le slide l&#x27;EA è la &lt;b&gt;seconda grande area del mondo per popolazione&lt;/b&gt; (supera gli USA) e la &lt;b&gt;terza per quota del PIL mondiale&lt;/b&gt;, dopo USA e Cina. Il grafico della World Bank nelle slide mostra che la Cina ha superato l&#x27;EA intorno al 2017.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Perché «constant 2015 US$»?&lt;/b&gt; Il PIL è espresso a prezzi costanti (corretto per l&#x27;inflazione) e convertito in dollari: si possono così confrontare periodi e aree diverse. Attenzione: non corregge per il diverso costo della vita tra paesi, cioè non è a parità di potere d&#x27;acquisto. È proprio il tema della PPP, più avanti. &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e2&quot; hidden&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 220&quot; role=&quot;img&quot; aria-label=&quot;Disoccupazione, debito e deficit EA e USA&quot;&gt;
     &lt;g font-size=&quot;12&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;20&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Disoccupazione 2025 (%)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;46&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;70&quot; y=&quot;34&quot; width=&quot;124&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;47&quot;&gt;6,2&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;70&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;70&quot; y=&quot;58&quot; width=&quot;84&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;71&quot;&gt;4,2&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;20&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Debito/PIL 2023 (%)&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;46&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;360&quot; y=&quot;34&quot; width=&quot;174&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;47&quot;&gt;87&lt;/text&gt;
      &lt;text x=&quot;320&quot; y=&quot;70&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;360&quot; y=&quot;58&quot; width=&quot;228&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;594&quot; y=&quot;71&quot;&gt;114&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;120&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Saldo di bilancio/PIL 2023 (%): deficit verso sinistra&lt;/text&gt;
      &lt;line x1=&quot;320&quot; y1=&quot;130&quot; x2=&quot;320&quot; y2=&quot;200&quot; class=&quot;ax&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;152&quot;&gt;EA&lt;/text&gt;&lt;rect x=&quot;258&quot; y=&quot;140&quot; width=&quot;62&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;153&quot;&gt;−3,1&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;180&quot;&gt;USA&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;168&quot; width=&quot;152&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;181&quot;&gt;−7,6&lt;/text&gt;
     &lt;/g&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;ul class=&quot;tight&quot;&gt;
     &lt;li&gt;La disoccupazione è &lt;b&gt;di norma più bassa negli USA&lt;/b&gt;.&lt;/li&gt;
     &lt;li&gt;Le finanze pubbliche (debito e deficit in % del PIL) sono &lt;b&gt;più contenute nell&#x27;EA&lt;/b&gt; che negli USA.&lt;/li&gt;
     &lt;li&gt;Il &lt;b&gt;ruolo dello Stato&lt;/b&gt; è più ampio nell&#x27;EA: entrate e spese pubbliche, compresi i trasferimenti sociali, sono quote del PIL maggiori che negli USA.&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-e3&quot; hidden&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Economia sviluppata&lt;/h4&gt;Domina il terziario (servizi), ma meno che negli USA: l&#x27;industria manifatturiera conta di più.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Economia aperta&lt;/h4&gt;L&#x27;EA è più aperta (esportazioni + importazioni in rapporto al PIL) di altre grandi aree come USA e Giappone. Per i singoli paesi il commercio è una parte rilevante del PIL.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Differenze interne&lt;/h4&gt;I paesi dell&#x27;EA differiscono per crescita del PIL, PIL pro capite, inflazione e competitività. Dati: &lt;a href=&quot;https://data.ecb.europa.eu/key-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, key figures&lt;/a&gt;.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Un solo cambio&lt;/h4&gt;Una MU ha una sola moneta e quindi &lt;b&gt;un solo tasso di cambio&lt;/b&gt; verso l&#x27;esterno. Ma la competitività di ciascun paese, misurata dal &lt;em class=&quot;t&quot;&gt;real exchange rate&lt;/em&gt;, resta diversa.&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Chi esporta fuori dall&#x27;area euro&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg id=&quot;expChart&quot; viewBox=&quot;0 0 640 520&quot; role=&quot;img&quot; aria-label=&quot;Esportazioni extra area euro di beni 2024 per paese&quot;&gt;&lt;/svg&gt;
   &lt;figcaption&gt;Esportazioni di beni verso paesi fuori dall&#x27;area euro, 2024 (miliardi di €). Valori &lt;b&gt;letti a occhio&lt;/b&gt; dal grafico Eurostat della slide 22, quindi approssimativi. Passa il dito o il mouse su una barra per il valore. La Germania da sola esporta più di Italia, Paesi Bassi e Francia messi insieme.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il punto chiave della parte B.&lt;/b&gt; Il cambio dell&#x27;euro rispetto al dollaro è lo stesso per tutti i paesi dell&#x27;EA. I paesi però differiscono per competitività, misurata dal cambio reale: per questo, &lt;i&gt;a parità di altre condizioni&lt;/i&gt;, export e import possono variare moltissimo da un paese all&#x27;altro. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · L&#x27;area euro in cifre&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Su quali indicatori l&#x27;EA «batte» gli USA e su quali no, secondo le slide?&lt;/summary&gt;&lt;p&gt;L&#x27;EA ha più popolazione, debito e deficit pubblici più bassi in % del PIL ed è più aperta al commercio. Gli USA hanno un PIL maggiore, disoccupazione più bassa e un terziario più esteso; lo Stato vi pesa meno.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Se il cambio €/$ è uguale per tutti, perché l&#x27;Italia e la Germania possono avere risultati di export così diversi?&lt;/summary&gt;&lt;p&gt;Perché la competitività dipende anche dai prezzi e dai costi interni di ciascun paese: il cambio reale differisce anche se il cambio nominale è comune. Contano anche specializzazione, dimensione e qualità dei prodotti.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché per un&#x27;economia aperta la competitività è così importante?&lt;/summary&gt;&lt;p&gt;Perché una quota ampia della domanda (le esportazioni) e dell&#x27;offerta (le importazioni) dipende dal confronto di prezzi e costi con l&#x27;estero: perdere competitività toglie domanda, produzione e occupazione.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE C ============ --&gt;
&lt;div class=&quot;part p-slate&quot; id=&quot;parteC&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;C&lt;/span&gt;&lt;h2&gt;Competitiveness in una monetary union&lt;/h2&gt;&lt;p&gt;La competitività è un indicatore macroeconomico chiave per un paese aperto, e in una MU le divergenze di competitività creano problemi. Per capire perché, si riprendono alcuni concetti di base. &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-cambio&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;5 · Tasso di cambio e law of one price &lt;span class=&quot;src&quot;&gt;slide 24–25&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Il tasso di cambio nominale E&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Exchange rate E (euro/dollaro).&lt;/b&gt; Con l&#x27;euro come &lt;em class=&quot;t&quot;&gt;base currency&lt;/em&gt; (valuta base), &lt;i&gt;E&lt;/i&gt; = numero di &lt;b&gt;dollari&lt;/b&gt; che si comprano con &lt;b&gt;1 euro&lt;/b&gt;. Esempio: E = 1,10 significa 1 € = 1,10 $.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Appreciation (apprezzamento) ↑&lt;/h4&gt;&lt;i&gt;E&lt;/i&gt; sale: con 1 € compro più dollari. L&#x27;euro vale di più e i beni europei costano di più agli americani.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Depreciation (deprezzamento) ↓&lt;/h4&gt;&lt;i&gt;E&lt;/i&gt; scende: con 1 € compro meno dollari. I beni europei diventano più economici per gli americani.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Attenzione alla convenzione.&lt;/b&gt; In molti testi il cambio è definito al contrario (euro per 1 dollaro): lì un &lt;i&gt;aumento&lt;/i&gt; è un deprezzamento. In queste slide, con l&#x27;euro come valuta base, &lt;b&gt;E più basso = euro deprezzato&lt;/b&gt;. &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Chiamiamo &lt;i&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt; il prezzo in dollari del bene &lt;i&gt;i&lt;/i&gt; venduto negli USA e &lt;i&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;/i&gt; il prezzo in euro dello stesso bene venduto nell&#x27;eurozona (EZ). Per confrontarli bisogna esprimerli nella stessa valuta:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; · E&lt;small&gt;prezzo del bene europeo espresso in dollari&lt;/small&gt;&lt;/div&gt;
   &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E&lt;small&gt;prezzo del bene americano espresso in euro&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Law of one price (legge del prezzo unico)&lt;/h3&gt;
  &lt;p&gt;Se un bene identico costa lo stesso nei due paesi una volta espresso nella stessa valuta, per quel bene vale la &lt;em class=&quot;t&quot;&gt;law of one price&lt;/em&gt;:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;E&lt;/sub&gt;&lt;small&gt;le due scritture sono equivalenti: basta dividere entrambi i lati per E&lt;/small&gt;&lt;/div&gt;
  &lt;p&gt;L&#x27;idea dietro la legge è l&#x27;&lt;b&gt;arbitraggio&lt;/b&gt;: se un bene costasse meno negli USA, converrebbe comprarlo lì e rivenderlo in Europa, finché i prezzi non si riallineano. Lo impediscono costi di trasporto, dazi, imposte e beni non commerciabili. &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt;&lt;/p&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ppp&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;6 · Purchasing Power Parity e Big Mac index &lt;span class=&quot;src&quot;&gt;slide 26–30&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Dalla legge del prezzo unico alla PPP&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Purchasing Power Parity (PPP, parità dei poteri d&#x27;acquisto).&lt;/b&gt; Se la law of one price vale &lt;b&gt;per tutti i beni&lt;/b&gt; di un paniere di riferimento, allora vale la PPP: &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E = P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt;, dove &lt;i&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt; è il prezzo medio in dollari del paniere negli USA e &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;&lt;/i&gt; il prezzo medio in euro dello stesso paniere in Europa.&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;E&lt;/sub&gt;&lt;small&gt;in questo caso particolare il cambio è uguale al rapporto tra i livelli medi dei prezzi: misurati nella stessa valuta, i livelli dei prezzi sono uguali ovunque&lt;/small&gt;&lt;/div&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Riferimento indicato nelle slide per questa parte: Krugman e Obstfeld, &lt;i&gt;International Economics: Theory and Policy&lt;/i&gt; (vedi &lt;a href=&quot;#s-fonti&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/p&gt;

  &lt;h3&gt;La PPP vale davvero? Il Big Mac index&lt;/h3&gt;
  &lt;p&gt;L&#x27;&lt;em class=&quot;t&quot;&gt;Economist&lt;/em&gt; usa un paniere di un solo bene, identico in tutto il mondo: il Big Mac. Il cambio «di PPP» è quello che renderebbe uguale il prezzo del panino nei due paesi; si confronta con il cambio di mercato.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 1 · I dati (agosto 2023)&lt;/h4&gt;&lt;p&gt;Big Mac nell&#x27;EZ: &lt;b&gt;5,28 €&lt;/b&gt;. Big Mac negli USA: &lt;b&gt;5,58 $&lt;/b&gt;. Cambio di mercato: &lt;b&gt;E = 1,10&lt;/b&gt; $ per €. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · Il cambio di PPP&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = 5,58 / 5,28 = 1,06&lt;/div&gt;&lt;p&gt;Con 1 € = 1,06 $ il Big Mac costerebbe uguale nei due paesi.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Confronto con il mercato&lt;/h4&gt;&lt;p&gt;Il cambio di mercato (1,10) è &lt;b&gt;più alto&lt;/b&gt; di quello di PPP (1,06): l&#x27;euro compra più dollari di quanto «dovrebbe». L&#x27;euro è quindi &lt;b&gt;sopravvalutato&lt;/b&gt;; detto altrimenti, il dollaro è &lt;span style=&quot;color:var(--slate)&quot;&gt;&lt;b&gt;sottovalutato&lt;/b&gt;&lt;/span&gt; rispetto all&#x27;euro.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Verifica in euro&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;5,58 / 1,10 = 5,07 €  &amp;lt;  5,28 €&lt;/div&gt;&lt;p&gt;Il Big Mac americano, convertito in euro, costa meno: (5,07 − 5,28)/5,28 ≈ &lt;b&gt;−4%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 5 · Verifica in dollari&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;5,28 × 1,10 = 5,81 $  &amp;gt;  5,58 $&lt;/div&gt;&lt;p&gt;Un europeo con i suoi euro trova più conveniente comprare negli USA. Stessa conclusione per entrambe le strade.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;pppW&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Laboratorio PPP: muovi prezzi e cambio&lt;/div&gt;
   &lt;div class=&quot;presets&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;5.28,5.58,1.10&quot;&gt;Agosto 2023&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;6.19,6.22,1.14&quot;&gt;Luglio 2026&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-p=&quot;6.00,6.30,1.05&quot;&gt;PPP esatta&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pe&quot;&gt;Big Mac EZ (€)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pe&quot; min=&quot;3&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;5.28&quot;&gt;&lt;output id=&quot;peO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pu&quot;&gt;Big Mac USA ($)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pu&quot; min=&quot;3&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;5.58&quot;&gt;&lt;output id=&quot;puO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ee&quot;&gt;Cambio E ($ per €)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ee&quot; min=&quot;0.8&quot; max=&quot;1.5&quot; step=&quot;0.01&quot; value=&quot;1.10&quot;&gt;&lt;output id=&quot;eeO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;pppSvg&quot; viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Confronto prezzi in dollari&quot; style=&quot;width:100%;margin-top:.6rem&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;E di PPP = P&lt;sub&gt;US&lt;/sub&gt;/P&lt;sub&gt;E&lt;/sub&gt;&lt;/span&gt;&lt;b id=&quot;rP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Big Mac EZ in $ = P&lt;sub&gt;E&lt;/sub&gt;·E&lt;/span&gt;&lt;b id=&quot;rD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Big Mac USA in € = P&lt;sub&gt;US&lt;/sub&gt;/E&lt;/span&gt;&lt;b id=&quot;rE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Cambio reale E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;E&lt;/sub&gt;E/P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;b id=&quot;rR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;rV&quot;&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.5rem 0 0&quot;&gt;Il preset «PPP esatta» usa numeri inventati (6,30/6,00 = 1,05) per mostrare il caso E&lt;sub&gt;R&lt;/sub&gt; = 1.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Challenge yourself (slide 29)&lt;/h3&gt;
   &lt;p style=&quot;margin:.2rem 0 .6rem&quot;&gt;Luglio 2025: Big Mac 6,01 $ negli USA e 5,96 € nell&#x27;EZ. Luglio 2026: 6,22 $ e 6,19 €. Cambio di mercato a luglio 2026: 1,14. Prova prima con il laboratorio qui sopra.&lt;/p&gt;
   &lt;details&gt;&lt;summary&gt;1. Inflazione del prezzo del Big Mac tra luglio 2025 e luglio 2026, nell&#x27;EZ e negli USA?&lt;/summary&gt;&lt;p&gt;EZ: (6,19 − 5,96)/5,96 = &lt;b&gt;+3,86%&lt;/b&gt;. USA: (6,22 − 6,01)/6,01 = &lt;b&gt;+3,49%&lt;/b&gt;. Il Big Mac è rincarato un po&#x27; di più nell&#x27;eurozona.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;2. A luglio 2026 l&#x27;euro è sopravvalutato o sottovalutato rispetto al dollaro?&lt;/summary&gt;&lt;p&gt;E&lt;sub&gt;PPP&lt;/sub&gt; = 6,22/6,19 ≈ &lt;b&gt;1,005&lt;/b&gt;. Il cambio di mercato (1,14) è più alto: l&#x27;euro è &lt;b&gt;sopravvalutato&lt;/b&gt;, di circa 1,14/1,005 − 1 ≈ &lt;b&gt;+13%&lt;/b&gt; (equivalente: 6,19 × 1,14 = 7,06 $ contro 6,22 $).&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;3. A luglio 2026 conviene comprare il Big Mac negli USA o nell&#x27;EZ?&lt;/summary&gt;&lt;p&gt;Negli &lt;b&gt;USA&lt;/b&gt;: 6,22/1,14 = &lt;b&gt;5,46 €&lt;/b&gt; contro 6,19 € nell&#x27;EZ, circa il 12% in meno per chi paga in euro.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-reale&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;7 · Bilateral real exchange rate &lt;span class=&quot;src&quot;&gt;slide 31–33, 43&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Il cambio reale come misura di competitività&lt;/h3&gt;
  &lt;p&gt;Se vale la PPP, &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E = P&lt;sub&gt;US&lt;/sub&gt;&lt;/i&gt;, cioè &lt;i&gt;P&lt;sub&gt;E&lt;/sub&gt;E/P&lt;sub&gt;US&lt;/sub&gt; = 1&lt;/i&gt;. Le &lt;b&gt;deviazioni dalla PPP&lt;/b&gt; definiscono il &lt;em class=&quot;t&quot;&gt;bilateral real exchange rate&lt;/em&gt; (tasso di cambio reale bilaterale), una misura della competitività tra due paesi:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sub&gt;E&lt;/sub&gt; · E&lt;/span&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;small&gt;quante volte un paniere europeo (convertito in $) costa più del paniere americano&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1&lt;/h4&gt;I beni costano più nell&#x27;EZ che negli USA: l&#x27;EZ è &lt;b&gt;meno competitiva&lt;/b&gt; sui prezzi.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;lt; 1&lt;/h4&gt;I beni costano meno nell&#x27;EZ che negli USA: l&#x27;EZ è &lt;b&gt;più competitiva&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; può muoversi per tre motivi: i prezzi europei, i prezzi americani o il &lt;em class=&quot;t&quot;&gt;nominal exchange rate&lt;/em&gt; &lt;i&gt;E&lt;/i&gt;. Quest&#x27;ultimo può quindi diventare uno &lt;b&gt;strumento di politica economica&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Paese con moneta propria: il cambio come strumento&lt;/div&gt;
   &lt;p style=&quot;font-size:.92rem;margin-top:0&quot;&gt;Partiamo da E&lt;sub&gt;R&lt;/sub&gt; = 1. I prezzi nell&#x27;EZ salgono rispetto a quelli USA (&lt;i&gt;ceteris paribus&lt;/i&gt;, cioè a parità di tutto il resto). Poi prova a correggere con il cambio.&lt;/p&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dp&quot;&gt;Aumento relativo di P&lt;sub&gt;E&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;dpO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;de&quot;&gt;Variazione di E&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;de&quot; min=&quot;-30&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;deO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;rerSvg&quot; viewBox=&quot;0 0 600 90&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Indicatore del cambio reale&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;rerV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;E dentro un&#x27;unione monetaria?&lt;/h3&gt;
  &lt;p&gt;Due paesi A e B nella stessa MU, con prezzi medi &lt;i&gt;P&lt;sub&gt;A&lt;/sub&gt;&lt;/i&gt; e &lt;i&gt;P&lt;sub&gt;B&lt;/sub&gt;&lt;/i&gt;. Qual è il cambio tra A e B? Non esiste: usano la stessa moneta, quindi &lt;b&gt;E = 1 per sempre&lt;/b&gt;. Il cambio reale si riduce a:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;A&lt;/sub&gt; / P&lt;sub&gt;B&lt;/sub&gt;&lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Due paesi nella MU&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pa&quot;&gt;Prezzi in A (indice)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pa&quot; min=&quot;80&quot; max=&quot;130&quot; step=&quot;1&quot; value=&quot;112&quot;&gt;&lt;output id=&quot;paO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pb&quot;&gt;Prezzi in B (indice)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pb&quot; min=&quot;80&quot; max=&quot;130&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;pbO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label&gt;Cambio A/B&lt;/label&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2&quot; value=&quot;1&quot; disabled aria-label=&quot;Cambio bloccato&quot;&gt;&lt;output&gt;1 🔒&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;presets&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;devBtn&quot;&gt;Prova a svalutare la moneta di A&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;muV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il messaggio della lezione.&lt;/b&gt; Se A perde competitività rispetto a B, nella MU &lt;b&gt;non può svalutare&lt;/b&gt;. L&#x27;aggiustamento deve passare dai prezzi relativi: P&lt;sub&gt;A&lt;/sub&gt; deve crescere meno di P&lt;sub&gt;B&lt;/sub&gt; (o scendere). È la cosiddetta &lt;em class=&quot;t&quot;&gt;internal devaluation&lt;/em&gt; (svalutazione interna), lenta e costosa in termini di occupazione. Ecco perché le divergenze di competitività sono un problema in una MU, e perché serve capire &lt;b&gt;da che cosa dipendono i prezzi&lt;/b&gt;, cioè la prossima sezione. &lt;span class=&quot;gen&quot;&gt;collegamento&lt;/span&gt;&lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Collegamento con la parte teorica del corso&lt;/summary&gt;&lt;p&gt;La perdita del cambio come strumento è il cuore dei &lt;i&gt;costi&lt;/i&gt; di un&#x27;unione monetaria nella teoria delle &lt;em class=&quot;t&quot;&gt;optimum currency areas&lt;/em&gt; (aree valutarie ottimali): quando un paese subisce un &lt;em class=&quot;t&quot;&gt;asymmetric shock&lt;/em&gt; (shock che colpisce un paese e non gli altri), senza cambio proprio servono flessibilità di salari e prezzi, mobilità del lavoro o trasferimenti fiscali. Questa lezione ne prepara il linguaggio: nelle slide 7–8 la parte 1 del corso è annunciata come &lt;i&gt;costs and benefits analysis&lt;/i&gt; di una MU. &lt;span class=&quot;gen&quot;&gt;collegamento generale, non dalle slide&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Cambio reale&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;I prezzi nell&#x27;EZ salgono del 5% più che negli USA ed E non cambia. Che succede a E&lt;sub&gt;R&lt;/sub&gt; e alla competitività?&lt;/summary&gt;&lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; sale di circa il 5%: è una &lt;i&gt;real appreciation&lt;/i&gt; (apprezzamento reale) e l&#x27;EZ perde competitività di prezzo.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Per compensare, E dovrebbe salire o scendere? Che cosa significa per l&#x27;euro?&lt;/summary&gt;&lt;p&gt;Scendere di circa il 5% (più precisamente 1/1,05 − 1 ≈ −4,8%): un &lt;b&gt;deprezzamento&lt;/b&gt; dell&#x27;euro, perché con la convenzione delle slide un E più basso significa meno dollari per euro.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché in una MU vale E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;A&lt;/sub&gt;/P&lt;sub&gt;B&lt;/sub&gt;?&lt;/summary&gt;&lt;p&gt;Perché A e B usano la stessa moneta: il cambio nominale tra loro è 1 e non può variare. La competitività relativa dipende solo dai prezzi (o dai costi).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-ulc&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;8 · Prezzi, mark-up e Unit Labour Cost &lt;span class=&quot;src&quot;&gt;slide 34–38, 46&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Da che cosa dipendono i prezzi?&lt;/h3&gt;
  &lt;p&gt;I prezzi di mercato includono le &lt;b&gt;imposte indirette&lt;/b&gt; (come l&#x27;IVA, &lt;em class=&quot;t&quot;&gt;VAT&lt;/em&gt;) che differiscono tra paesi. Guardiamo allora il &lt;b&gt;prezzo alla produzione&lt;/b&gt;. Dalla condizione di massimo profitto di un&#x27;impresa in &lt;em class=&quot;t&quot;&gt;imperfect competition&lt;/em&gt; (concorrenza imperfetta) si ottiene un risultato simile alla &lt;em class=&quot;t&quot;&gt;mark-up rule&lt;/em&gt;: il prezzo è il costo unitario più un ricarico.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 1 · L&#x27;ipotesi&lt;/h4&gt;&lt;p&gt;Il lavoro è l&#x27;unico input. Notazione: &lt;i&gt;P&lt;/i&gt; prezzo dell&#x27;output, &lt;i&gt;W&lt;/i&gt; salario o costo del lavoro per occupato (&lt;em class=&quot;t&quot;&gt;compensation per employee&lt;/em&gt;), &lt;i&gt;N&lt;/i&gt; occupati, &lt;i&gt;Y&lt;/i&gt; output, &lt;i&gt;m&lt;/i&gt; mark-up.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 2 · La regola del mark-up&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;P = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W N&lt;/span&gt;&lt;span&gt;Y&lt;/span&gt;&lt;/span&gt; (1 + m)&lt;small&gt;WN = costo totale del lavoro; diviso Y = costo del lavoro per unità di prodotto&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 3 · Il costo del lavoro per unità di prodotto&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ULC = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W N&lt;/span&gt;&lt;span&gt;Y&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;Y / N&lt;/span&gt;&lt;/span&gt;&lt;small&gt;&lt;em class=&quot;t&quot;&gt;unit labour cost&lt;/em&gt; = salario per occupato / produttività del lavoro&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 4 · Riscrivere con la produttività&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;P = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;Q&lt;/span&gt;&lt;/span&gt; (1 + m), &amp;nbsp; Q = Y/N&lt;small&gt;Q = &lt;em class=&quot;t&quot;&gt;average labour productivity&lt;/em&gt;, produttività media del lavoro&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Tre fattori determinano il prezzo medio: &lt;b&gt;costo del lavoro&lt;/b&gt; (W, lo spinge su), &lt;b&gt;produttività media&lt;/b&gt; (Q, lo spinge giù) e &lt;b&gt;mark-up&lt;/b&gt; (m, lo spinge su).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Calcolatore del prezzo: P = (W/Q)(1+m)&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;w&quot;&gt;W salario annuo (€)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w&quot; min=&quot;20000&quot; max=&quot;70000&quot; step=&quot;500&quot; value=&quot;40000&quot;&gt;&lt;output id=&quot;wO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;q&quot;&gt;Q = Y/N output per occupato (unità)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;10000&quot; max=&quot;40000&quot; step=&quot;500&quot; value=&quot;20000&quot;&gt;&lt;output id=&quot;qO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;m&quot;&gt;m mark-up&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;m&quot; min=&quot;0&quot; max=&quot;60&quot; step=&quot;1&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;mO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;ulcSvg&quot; viewBox=&quot;0 0 600 70&quot; style=&quot;width:100%;margin-top:.5rem&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione del prezzo&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;ULC = W/Q (€ per unità)&lt;/span&gt;&lt;b id=&quot;uU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Prezzo P (€ per unità)&lt;/span&gt;&lt;b id=&quot;uP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;di cui margine&lt;/span&gt;&lt;b id=&quot;uM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.85rem;color:var(--muted);margin:.5rem 0 0&quot;&gt;Prova: aumenta W del 10% e poi Q del 10%. Il prezzo torna uguale, perché conta il &lt;b&gt;rapporto&lt;/b&gt; tra salario e produttività, non il salario in sé.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost competitiveness.&lt;/b&gt; Nel cambio reale si può sostituire il prezzo medio con una misura dei costi, come l&#x27;ULC. Si ottiene così la competitività di costo, che guarda a salari e produttività invece che ai prezzi finali. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Mark-up e ULC&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché per confrontare la competitività si preferisce il prezzo alla produzione a quello di mercato?&lt;/summary&gt;&lt;p&gt;Perché i prezzi di mercato includono imposte indirette come l&#x27;IVA, che variano da paese a paese e non dipendono dall&#x27;efficienza delle imprese.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;I salari crescono del 3%, la produttività del 3%, il mark-up resta fermo. Che succede all&#x27;ULC e al prezzo?&lt;/summary&gt;&lt;p&gt;L&#x27;ULC non cambia (W/Q costante) e quindi nemmeno il prezzo: la crescita dei salari è «pagata» dalla produttività.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono i tre fattori che determinano il prezzo medio?&lt;/summary&gt;&lt;p&gt;Costo del lavoro (W), produttività media del lavoro (Q = Y/N) e mark-up (m).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-eer&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;9 · Effective exchange rate, REER e HCI &lt;span class=&quot;src&quot;&gt;slide 38–46&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Un paese ha tanti concorrenti, non uno solo&lt;/h3&gt;
  &lt;p&gt;Finora il confronto era bilaterale (EZ contro USA). Un paese però compete con molti partner, compresi gli altri paesi dell&#x27;area euro. Servono quindi indicatori di sintesi.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Effective exchange rate (EER)&lt;/h4&gt;Misura il valore &lt;b&gt;nominale&lt;/b&gt; dell&#x27;euro rispetto alle valute dei principali concorrenti di uno Stato membro.&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Real EER (REER)&lt;/h4&gt;Misura la competitività &lt;b&gt;complessiva&lt;/b&gt; di uno Stato membro rispetto ai suoi principali partner commerciali, tenendo conto anche dei prezzi o dei costi.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;EER = ∏&lt;sub&gt;j&lt;/sub&gt; (E&lt;sub&gt;j&lt;/sub&gt;)&lt;sup&gt;w&lt;sub&gt;j&lt;/sub&gt;&lt;/sup&gt;, &amp;nbsp; Σ w&lt;sub&gt;j&lt;/sub&gt; = 1&lt;small&gt;media &lt;b&gt;geometrica&lt;/b&gt; ponderata dei cambi bilaterali (nominali o reali); i pesi w&lt;sub&gt;j&lt;/sub&gt; sono le &lt;b style=&quot;color:var(--acc)&quot;&gt;quote di commercio&lt;/b&gt; con ciascun partner j&lt;/small&gt;&lt;/div&gt;
  &lt;details class=&quot;more&quot;&gt;&lt;summary&gt;Esempio numerico: perché media geometrica&lt;/summary&gt;
   &lt;p&gt;Pesi: USA 0,40 · Cina 0,35 · Regno Unito 0,25. L&#x27;euro si apprezza del 10% sul dollaro, si deprezza del 5% sullo yuan e resta fermo sulla sterlina.&lt;/p&gt;
   &lt;div class=&quot;formula&quot;&gt;1,10&lt;sup&gt;0,40&lt;/sup&gt; × 0,95&lt;sup&gt;0,35&lt;/sup&gt; × 1,00&lt;sup&gt;0,25&lt;/sup&gt; ≈ 1,020 → EER +2,0%&lt;/div&gt;
   &lt;p&gt;Con la media geometrica la variazione in logaritmi è la &lt;b&gt;media ponderata delle variazioni&lt;/b&gt; in logaritmi (0,4·9,5% − 0,35·5,1% ≈ 2,0%): è il legame con la parte D sui tassi di crescita. I numeri sono inventati per l&#x27;esempio. &lt;span class=&quot;gen&quot;&gt;esempio&lt;/span&gt;&lt;/p&gt;
  &lt;/details&gt;

  &lt;h3&gt;Come cambiano i pesi: i partner dell&#x27;euro (EER-41)&lt;/h3&gt;
  &lt;p&gt;Dal 2020 i pesi includono anche il commercio di &lt;b&gt;servizi&lt;/b&gt; (Schmitz, Dietrich e Brisson, 2024, ECB). Attiva o disattiva le serie:&lt;/p&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;presets&quot; id=&quot;twBtns&quot;&gt;&lt;/div&gt;
   &lt;svg id=&quot;twSvg&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Pesi commerciali EER-41 nel tempo&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.3rem 0 0&quot;&gt;Pesi combinati (beni + servizi) in %, per trienni dal 1995-97 al 2019-21. Valori ricostruiti &lt;b&gt;a occhio&lt;/b&gt; dal Chart 6 della ECB nella slide 39, quindi approssimativi.&lt;/p&gt;
  &lt;/div&gt;
  &lt;ul class=&quot;tight&quot;&gt;
   &lt;li&gt;&lt;b&gt;USA, Regno Unito e altre economie avanzate&lt;/b&gt;: pesi in calo; per gli USA il calo si è fermato e in parte invertito nell&#x27;ultimo decennio.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Cina&lt;/b&gt;: peso in forte aumento, cresciuto ancora nell&#x27;ultimo triennio.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Altri emergenti&lt;/b&gt;: importanti negli anni 2000, in calo nell&#x27;ultimo decennio.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Europa centro-orientale UE&lt;/b&gt;: sempre più importante, grazie all&#x27;integrazione nelle catene del valore europee (&lt;em class=&quot;t&quot;&gt;value chains&lt;/em&gt;).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-m1&quot;&gt;Manifattura vs servizi&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-m2&quot;&gt;Perché conta&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-m1&quot;&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 600 160&quot; role=&quot;img&quot; aria-label=&quot;Peso di Cina e USA in manifattura e servizi&quot;&gt;
     &lt;g font-size=&quot;12&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;30&quot; font-weight=&quot;600&quot;&gt;Cina&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;16&quot; width=&quot;420&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;536&quot; y=&quot;29&quot;&gt;21% manifattura (1°)&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;36&quot; width=&quot;120&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;236&quot; y=&quot;49&quot;&gt;6% servizi (4°)&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;100&quot; font-weight=&quot;600&quot;&gt;USA&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;86&quot; width=&quot;260&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;376&quot; y=&quot;99&quot;&gt;13% manifattura&lt;/text&gt;
      &lt;rect x=&quot;110&quot; y=&quot;106&quot; width=&quot;440&quot; height=&quot;16&quot; rx=&quot;3&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;556&quot; y=&quot;119&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--paper)&quot;&gt;22% servizi (1°)&lt;/text&gt;
     &lt;/g&gt;
     &lt;g font-size=&quot;11&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;140&quot; width=&quot;10&quot; height=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;149&quot;&gt;manifattura&lt;/text&gt;&lt;rect x=&quot;220&quot; y=&quot;140&quot; width=&quot;10&quot; height=&quot;10&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;149&quot;&gt;servizi&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;La Cina è il primo partner dell&#x27;area euro per i manufatti (21%) ma solo il quarto per i servizi (6%). Gli USA sono il primo partner per i servizi (22% contro 13% nella manifattura): la loro quota nei servizi è scesa negli anni &#x27;90 ed è risalita nell&#x27;ultimo decennio (telecomunicazioni, servizi informatici e d&#x27;informazione, altri servizi alle imprese). La slide invita a verificare le differenze con il Regno Unito. &lt;span class=&quot;src&quot;&gt;slide 41–42&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-m2&quot; hidden&gt;
    &lt;p&gt;Gli spostamenti di importanza dei partner riflettono andamenti a volte &lt;b&gt;divergenti tra commercio di beni e di servizi&lt;/b&gt;. Se i pesi includessero solo i beni, il REER sovrastimerebbe il ruolo della Cina e sottostimerebbe quello degli USA. Un movimento del cambio €/$ conta quindi di più per la competitività complessiva di quanto suggerirebbero i soli manufatti. &lt;span class=&quot;gen&quot;&gt;interpretazione&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Harmonised Competitiveness Indicators (HCI)&lt;/h3&gt;
  &lt;p&gt;Gli HCI della ECB servono a misurare in modo &lt;b&gt;confrontabile&lt;/b&gt; la competitività di prezzo e di costo dei paesi dell&#x27;area euro, in modo coerente con i REER dell&#x27;euro. Per un paese dell&#x27;EA:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = E · &lt;span style=&quot;color:var(--acc)&quot;&gt;P&lt;sub&gt;EA country&lt;/sub&gt;&lt;/span&gt; / &lt;span style=&quot;color:var(--acc)&quot;&gt;P&lt;sub&gt;other&lt;/sub&gt;&lt;/span&gt;&lt;small&gt;i partner includono gli altri paesi dell&#x27;euro (per loro E = 1) e i paesi esterni&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;HCI basato sui CPI&lt;/h4&gt;&lt;em class=&quot;t&quot;&gt;Consumer price indices&lt;/em&gt;: variazione media nel tempo dei prezzi pagati dalle famiglie per un paniere di beni e servizi. Misura la &lt;b&gt;competitività di prezzo&lt;/b&gt;. (Eurostat usa anche i deflatori del PIL.)&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;HCI basato sugli ULC&lt;/h4&gt;Compenso per occupato / produttività del lavoro, dove la produttività è il PIL a prezzi costanti diviso per gli occupati: &lt;i&gt;ULC = W/(Y/N) = WN/Y&lt;/i&gt;. Misura la &lt;b&gt;competitività di costo&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Italia e Germania: HCI basato sugli ULC (1999 T1 = 100)&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;hy&quot;&gt;Anno&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;hy&quot; min=&quot;1999&quot; max=&quot;2025&quot; value=&quot;2009&quot;&gt;&lt;output id=&quot;hyO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;hciSvg&quot; viewBox=&quot;0 0 640 280&quot; role=&quot;img&quot; aria-label=&quot;HCI Italia e Germania&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;hciV&quot;&gt;&lt;/div&gt;
   &lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:.4rem 0 0&quot;&gt;Serie annuali &lt;b&gt;approssimate a occhio&lt;/b&gt; dal grafico ECB trimestrale della slide 44 (HCI-17 + paesi dell&#x27;euro, ULC del totale dell&#x27;economia). Servono a vedere la forma, non a citare numeri. ↑ = perdita di competitività.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Che cosa si legge nel grafico originale: dopo il 1999 l&#x27;indicatore italiano sale fino a circa 114 nel 2008-09 (forte &lt;b&gt;perdita&lt;/b&gt; di competitività di costo), mentre quello tedesco scende verso 85-90. La divergenza si chiude solo in parte dopo il 2012. La slide 45 confronta le versioni ULC e CPI: per l&#x27;Italia la versione CPI resta sotto quella ULC (i costi sono cresciuti più dei prezzi, quindi i margini si sono ridotti). &lt;span class=&quot;gen&quot;&gt;lettura del grafico&lt;/span&gt;&lt;/p&gt;
  &lt;p style=&quot;font-size:.9rem&quot;&gt;Dati: &lt;a href=&quot;https://data.ecb.europa.eu/main-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, main figures&lt;/a&gt; → ECB interest rates and exchange rates → Harmonised competitiveness indicators &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · EER, REER, HCI&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra EER e REER?&lt;/summary&gt;&lt;p&gt;L&#x27;EER è una media ponderata dei cambi &lt;i&gt;nominali&lt;/i&gt; verso i partner. Il REER usa i cambi &lt;i&gt;reali&lt;/i&gt; (corretti per prezzi o costi relativi) e misura quindi la competitività complessiva.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Da che cosa dipendono i pesi e perché sono cambiati?&lt;/summary&gt;&lt;p&gt;Dalle quote di commercio con ciascun partner. Sono cambiati per l&#x27;ascesa della Cina, l&#x27;integrazione dell&#x27;Europa centro-orientale e, dal 2020, perché nel calcolo entrano anche i servizi.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Un HCI italiano basato sugli ULC passa da 100 a 110. Buona o cattiva notizia?&lt;/summary&gt;&lt;p&gt;Cattiva: un aumento indica una perdita di competitività di costo (apprezzamento reale) del 10% circa.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché per un paese dell&#x27;euro l&#x27;HCI include anche gli altri paesi dell&#x27;euro?&lt;/summary&gt;&lt;p&gt;Perché sono concorrenti importanti. Con loro il cambio nominale è fisso (E = 1), quindi la competitività dipende solo da prezzi e costi relativi.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE D ============ --&gt;
&lt;div class=&quot;part p-brick&quot; id=&quot;parteD&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;n&quot;&gt;D&lt;/span&gt;&lt;h2&gt;Dai livelli ai tassi di crescita&lt;/h2&gt;&lt;p&gt;Spesso interessa capire di quanto &lt;i&gt;varia&lt;/i&gt; la competitività, e per colpa di chi. Serve un breve ripasso di matematica. &lt;span class=&quot;src&quot;&gt;slide 47–57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-mate&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;10 · Brief math revision &lt;span class=&quot;src&quot;&gt;slide 50–55&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Variazione, tasso di variazione, tempo discreto e continuo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · La variazione in un intervallo&lt;/h4&gt;&lt;p&gt;Data X(t), la variazione in un intervallo di tempo Δt = s è:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ΔX = X(t + s) − X(t)&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Per unità di tempo&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X(t + s) − X(t)&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;ΔX&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt;&lt;small&gt;è la pendenza della «corda» tra due punti della curva&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Tempo continuo: la derivata&lt;/h4&gt;&lt;p&gt;Se l&#x27;intervallo si restringe fino a zero si ottiene la variazione nell&#x27;istante, la derivata rispetto al tempo:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;lim&lt;sub&gt;s→0&lt;/sub&gt; &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X(t + s) − X(t)&lt;/span&gt;&lt;span&gt;s&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = Ẋ&lt;small&gt;il puntino sopra la variabile indica la derivata rispetto al tempo&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Il tasso di crescita (proporzionale)&lt;/h4&gt;&lt;p&gt;Di solito interessa la variazione &lt;b&gt;in rapporto al livello&lt;/b&gt;. Moltiplicata per 100 diventa una percentuale.&lt;/p&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;small&gt;tempo discreto&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;sub&gt;t&lt;/sub&gt;/dt&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Ẋ&lt;/span&gt;&lt;span&gt;X&lt;/span&gt;&lt;/span&gt;&lt;small&gt;tempo continuo (istantaneo)&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Il trucco del logaritmo&lt;/h4&gt;&lt;p&gt;Per la regola della catena, la derivata del logaritmo è proprio il tasso di crescita istantaneo:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;d log X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;X&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; · &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;dX&lt;sub&gt;t&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;dt&lt;/span&gt;&lt;/span&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Ẋ&lt;/span&gt;&lt;span&gt;X&lt;/span&gt;&lt;/span&gt;&lt;small&gt;«This is the (instant) rate of change!!»&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Il vantaggio: il logaritmo trasforma &lt;b&gt;prodotti in somme&lt;/b&gt; e &lt;b&gt;rapporti in differenze&lt;/b&gt;. Il tasso di crescita di un prodotto diventa così la somma dei tassi di crescita.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Il confronto numerico delle slide&lt;/h4&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;X&lt;/th&gt;&lt;th&gt;(X&lt;sub&gt;t&lt;/sub&gt; − X&lt;sub&gt;t−1&lt;/sub&gt;)/X&lt;sub&gt;t−1&lt;/sub&gt;&lt;/th&gt;&lt;th&gt;ln X&lt;/th&gt;&lt;th&gt;ln X&lt;sub&gt;t&lt;/sub&gt; − ln X&lt;sub&gt;t−1&lt;/sub&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;100,1&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;4,60616969&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;100,4&lt;/td&gt;&lt;td&gt;0,002988048&lt;/td&gt;&lt;td&gt;4,60916221&lt;/td&gt;&lt;td&gt;0,002992521&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;99,9&lt;/td&gt;&lt;td&gt;−0,00500501&lt;/td&gt;&lt;td&gt;4,60416969&lt;/td&gt;&lt;td&gt;−0,004992522&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Per variazioni piccole la differenza dei logaritmi è praticamente uguale al tasso di crescita discreto: coincidono fino alla terza o quarta cifra decimale. &lt;span class=&quot;src&quot;&gt;slide 54&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Quando l&#x27;approssimazione logaritmica regge?&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;gx&quot;&gt;X&lt;sub&gt;t+1&lt;/sub&gt; (con X&lt;sub&gt;t&lt;/sub&gt; = 100)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;gx&quot; min=&quot;50&quot; max=&quot;200&quot; step=&quot;0.5&quot; value=&quot;103&quot;&gt;&lt;output id=&quot;gxO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;gSvg&quot; viewBox=&quot;0 0 600 260&quot; role=&quot;img&quot; aria-label=&quot;Tasso discreto contro differenza logaritmica&quot; style=&quot;width:100%&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;Tasso discreto&lt;/span&gt;&lt;b id=&quot;gD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Differenza dei log&lt;/span&gt;&lt;b id=&quot;gL&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Scarto&lt;/span&gt;&lt;b id=&quot;gS&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Riassunto &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/h4&gt;
   &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;&lt;tbody&gt;
