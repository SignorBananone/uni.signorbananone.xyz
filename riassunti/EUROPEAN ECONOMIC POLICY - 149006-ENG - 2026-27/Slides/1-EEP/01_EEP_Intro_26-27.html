    &lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Tempo discreto&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Variazione in un intervallo&lt;/td&gt;&lt;td&gt;&lt;i&gt;X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Tasso di crescita&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;(X&lt;sub&gt;t+s&lt;/sub&gt; − X&lt;sub&gt;t&lt;/sub&gt;)/X&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Tempo continuo&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Variazione istantanea&lt;/td&gt;&lt;td&gt;&lt;i&gt;dX/dt = Ẋ&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Tasso di crescita istantaneo&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Ẋ/X = d log X(t)/dt&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Tassi di crescita&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;X passa da 200 a 206. Tasso di crescita discreto e differenza dei log?&lt;/summary&gt;&lt;p&gt;Discreto: 6/200 = 3,00%. Log: ln(206) − ln(200) = ln(1,03) ≈ 2,96%. Sono molto vicini perché la variazione è piccola.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché d log X / dt è uguale a Ẋ/X?&lt;/summary&gt;&lt;p&gt;Per la regola della catena: la derivata di log X rispetto a X è 1/X, che si moltiplica per la derivata di X rispetto al tempo, Ẋ.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Se Z = X·Y, qual è il tasso di crescita di Z? E se Z = X/Y?&lt;/summary&gt;&lt;p&gt;log Z = log X + log Y, quindi Ż/Z = Ẋ/X + Ẏ/Y. Per il rapporto: Ż/Z = Ẋ/X − Ẏ/Y.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;

 &lt;section class=&quot;sec&quot; id=&quot;s-tassi&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;11 · Dinamica della competitività, inflazione e PPP relativa &lt;span class=&quot;src&quot;&gt;slide 47–49, 56–57&lt;/span&gt;&lt;/div&gt;
  &lt;h3&gt;Tasso di variazione della competitività&lt;/h3&gt;
  &lt;p&gt;La variazione della competitività in tempo discreto è &lt;i&gt;(E&lt;sub&gt;R,t&lt;/sub&gt; − E&lt;sub&gt;R,t−1&lt;/sub&gt;)/E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/i&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; aumenta&lt;/h4&gt;Perdita di competitività: &lt;b&gt;real appreciation&lt;/b&gt; (apprezzamento reale).&lt;/div&gt;
   &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;E&lt;sub&gt;R&lt;/sub&gt; diminuisce&lt;/h4&gt;Guadagno di competitività: &lt;b&gt;real depreciation&lt;/b&gt; (deprezzamento reale).&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Una variazione di E&lt;sub&gt;R&lt;/sub&gt; può dipendere da P&lt;sub&gt;E&lt;/sub&gt;, da P&lt;sub&gt;US&lt;/sub&gt;, da E o da tutti e tre. Si può misurare quanto pesa ciascun fattore? Sì, con i logaritmi (indicati con le lettere minuscole, log X = x):&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Il livello&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = P&lt;sub&gt;E,t&lt;/sub&gt; · E&lt;sub&gt;t&lt;/sub&gt; / P&lt;sub&gt;US,t&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Logaritmi: il prodotto diventa somma&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;e&lt;sub&gt;R,t&lt;/sub&gt; = p&lt;sub&gt;E,t&lt;/sub&gt; + e&lt;sub&gt;t&lt;/sub&gt; − p&lt;sub&gt;US,t&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Derivata rispetto al tempo&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;de&lt;sub&gt;R,t&lt;/sub&gt;/dt = dp&lt;sub&gt;E,t&lt;/sub&gt;/dt + de&lt;sub&gt;t&lt;/sub&gt;/dt − dp&lt;sub&gt;US,t&lt;/sub&gt;/dt&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Il risultato&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;ė&lt;sub&gt;R&lt;/sub&gt; = (ṗ&lt;sub&gt;E&lt;/sub&gt; − ṗ&lt;sub&gt;US&lt;/sub&gt;) + ė&lt;small&gt;variazione della competitività = &lt;b&gt;differenziale d&#x27;inflazione&lt;/b&gt; + variazione del cambio nominale&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Qui il puntino sulla minuscola indica già un tasso di crescita: ṗ&lt;sub&gt;E&lt;/sub&gt; è l&#x27;inflazione europea, ė la variazione percentuale di E.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Scomponi la variazione della competitività&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ie&quot;&gt;Inflazione EZ ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ie&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;ieO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iu&quot;&gt;Inflazione USA ṗ&lt;sub&gt;US&lt;/sub&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iu&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;iuO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ge&quot;&gt;Variazione cambio ė&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ge&quot; min=&quot;-15&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;geO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg id=&quot;decSvg&quot; viewBox=&quot;0 0 600 150&quot; style=&quot;width:100%&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione di ė_R&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;decV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il tasso d&#x27;inflazione dalla regola del mark-up&lt;/h3&gt;
  &lt;p&gt;Lo stesso trucco si applica alla regola del mark-up &lt;i&gt;P = (W/Q)(1 + m)&lt;/i&gt;. Prendendo i logaritmi e derivando rispetto al tempo:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;ṗ = ẇ − q̇ + Δm&lt;small&gt;dove log(1+m) ≅ m, quindi d log(1+m)/dt ≅ dm/dt = Δm&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Relazione chiave.&lt;/b&gt; L&#x27;inflazione è nulla se la crescita della produttività basta a coprire la crescita dei salari e dei margini di profitto. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;widget&quot;&gt;
   &lt;div class=&quot;wt&quot;&gt;Inflazione = salari − produttività + margini&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iw&quot;&gt;Crescita salari ẇ&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iw&quot; min=&quot;-2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;iwO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iq&quot;&gt;Crescita produttività q̇&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;iq&quot; min=&quot;-3&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;iqO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;im&quot;&gt;Variazione mark-up Δm&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;im&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;imO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;span&gt;Crescita ULC = ẇ − q̇&lt;/span&gt;&lt;b id=&quot;iU&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Inflazione ṗ&lt;/span&gt;&lt;b id=&quot;iP&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;iV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Mettiamo insieme i pezzi.&lt;/b&gt; Per due paesi A e B nella stessa MU, ė = 0, quindi &lt;br&gt;&lt;span style=&quot;font-family:var(--serif);font-style:italic;font-size:1.1rem&quot;&gt;ė&lt;sub&gt;R&lt;/sub&gt; = ṗ&lt;sub&gt;A&lt;/sub&gt; − ṗ&lt;sub&gt;B&lt;/sub&gt; = (ẇ&lt;sub&gt;A&lt;/sub&gt; − q̇&lt;sub&gt;A&lt;/sub&gt; + Δm&lt;sub&gt;A&lt;/sub&gt;) − (ẇ&lt;sub&gt;B&lt;/sub&gt; − q̇&lt;sub&gt;B&lt;/sub&gt; + Δm&lt;sub&gt;B&lt;/sub&gt;)&lt;/span&gt;&lt;br&gt;Se in A i salari crescono più della produttività rispetto a B, A perde competitività anno dopo anno e non può correggere con il cambio. È il meccanismo dietro la divergenza tra Italia e Germania vista negli HCI. &lt;span class=&quot;gen&quot;&gt;sintesi&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;Un&#x27;ultima nota sulla PPP&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-p1&quot;&gt;Assoluta vs relativa&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-p2&quot;&gt;Funziona nei dati?&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-p1&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Absolute PPP&lt;/h4&gt;Il cambio è uguale al rapporto tra i &lt;b&gt;livelli&lt;/b&gt; dei prezzi: E = P&lt;sub&gt;US&lt;/sub&gt;/P&lt;sub&gt;E&lt;/sub&gt;.&lt;/div&gt;
     &lt;div class=&quot;card c&quot;&gt;&lt;h4&gt;Relative PPP&lt;/h4&gt;La variazione percentuale del cambio in un periodo è uguale al &lt;b&gt;differenziale d&#x27;inflazione&lt;/b&gt;:&lt;div class=&quot;formula&quot; style=&quot;font-size:1.2rem;margin:.5rem 0 0&quot;&gt;ė = ṗ&lt;sub&gt;US&lt;/sub&gt; − ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;Collegamento: la PPP relativa equivale a &lt;b&gt;ė&lt;sub&gt;R&lt;/sub&gt; = 0&lt;/b&gt; nella formula sopra, cioè a un cambio reale costante. Se l&#x27;Europa ha più inflazione degli USA, l&#x27;euro deve deprezzarsi (ė &amp;lt; 0) dello stesso tanto. La PPP relativa può valere anche quando quella assoluta non vale (per esempio se tasse o costi di trasporto creano uno scarto costante tra i livelli). &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt;&lt;/p&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;t-p2&quot; hidden&gt;
    &lt;p&gt;Il sostegno empirico alla PPP e alla law of one price è &lt;b&gt;debole&lt;/b&gt; nei dati recenti:&lt;/p&gt;
    &lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;i prezzi di panieri identici, convertiti in una sola valuta, differiscono molto tra paesi;&lt;/li&gt;&lt;li&gt;la PPP relativa a volte approssima ragionevolmente i dati, ma nel complesso funziona male.&lt;/li&gt;&lt;/ul&gt;
    &lt;p&gt;Possibili motivi: costi di trasporto e barriere commerciali, beni e servizi non commerciabili (affitti, servizi alla persona), concorrenza imperfetta che consente prezzi diversi per mercati diversi, panieri diversi tra paesi. &lt;span class=&quot;gen&quot;&gt;spiegazione generale&lt;/span&gt; Proprio per questo il cambio reale si muove davvero e la competitività è una variabile da monitorare.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · Dinamica della competitività&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Inflazione EZ 4%, USA 2%, l&#x27;euro si apprezza del 3% (ė = +3%). Che succede alla competitività dell&#x27;EZ?&lt;/summary&gt;&lt;p&gt;ė&lt;sub&gt;R&lt;/sub&gt; = (4 − 2) + 3 = +5%: apprezzamento reale, perdita di competitività di circa il 5%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Con gli stessi tassi d&#x27;inflazione, di quanto dovrebbe variare E perché valga la PPP relativa?&lt;/summary&gt;&lt;p&gt;ė = ṗ&lt;sub&gt;US&lt;/sub&gt; − ṗ&lt;sub&gt;E&lt;/sub&gt; = 2 − 4 = −2%: l&#x27;euro dovrebbe deprezzarsi del 2%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Salari +4%, produttività +1,5%, mark-up invariato. Inflazione?&lt;/summary&gt;&lt;p&gt;ṗ = 4 − 1,5 + 0 = 2,5%.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché in una MU la differenza di inflazione tra paesi membri conta così tanto?&lt;/summary&gt;&lt;p&gt;Perché con ė = 0 la variazione della competitività bilaterale coincide con il differenziale d&#x27;inflazione: un paese con inflazione sistematicamente più alta perde competitività in modo cumulativo.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;div class=&quot;part&quot; id=&quot;parteF&quot; style=&quot;--c:var(--muted);--cb:transparent&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;section class=&quot;sec&quot; id=&quot;s-fonti&quot;&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--acc)&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Testi, norme, dati e siti citati nelle slide&lt;/h2&gt;
  &lt;p style=&quot;color:var(--muted)&quot;&gt;Per ogni voce: che cosa dice la slide e, marcato &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;, che cosa ho verificato con una ricerca web e dove. Ho cercato solo materiale di studio.&lt;/p&gt;

  &lt;h3&gt;Testi&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul De Grauwe, &lt;i&gt;Economics of Monetary Union&lt;/i&gt;, Oxford University Press, 14ª ed.&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Libro di testo del corso (slide 3, che indica il 2023). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; ISBN 9780192849779; alcuni cataloghi datano l&#x27;edizione al 2022 (la data riportata varia tra le fonti). Il libro ha due parti: costi e benefici di una moneta comune (la teoria) e funzionamento di un&#x27;unione monetaria (la politica). Segue quindi la stessa struttura del corso. Ogni capitolo si chiude con un riepilogo e delle domande. OUP offre risorse per studenti: &lt;a href=&quot;https://learninglink.oup.com/access/degrauwe14e-student-resources&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OUP Learning Link, De Grauwe 14e&lt;/a&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento d&#x27;esame.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul Krugman, Maurice Obstfeld (e Marc Melitz), &lt;i&gt;International Economics: Theory and Policy&lt;/i&gt;, Pearson&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Indicato nella slide 26 per cambio, law of one price e PPP («6th Ed., 2015»). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;edizione Pearson del 2015, firmata anche da Melitz, risulta essere la &lt;b&gt;10ª&lt;/b&gt;, non la 6ª: verifica con la docente quale edizione intende. Copre commercio internazionale e finanza internazionale, con la teoria seguita dalle applicazioni di policy. Scheda di catalogo: &lt;a href=&quot;https://eld.bl.uk/catalog/018480030&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;British Library&lt;/a&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; spiega con calma PPP e cambio reale, che la lezione dà quasi per scontati.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Martin Schmitz, Andreas Dietrich, Rémy Brisson (2024), «The ECB&#x27;s enhanced effective exchange rates and harmonised competitiveness indicators: An updated weighting scheme including trade in services», ECB Statistics Paper Series n. 49&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Fonte dei grafici sui pesi EER-41 (slide 39–42). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Pubblicato il 25 giugno 2024. Spiega come i pesi commerciali di EER e HCI incorporano ora il commercio di servizi; i dati mancanti sono stimati con tecniche di imputazione e un modello gravitazionale. Il metodo di base, che tiene conto anche della concorrenza sui mercati terzi, resta invariato. &lt;a href=&quot;https://www.ecb.europa.eu/pub/pdf/scpsps/ecb.sps49~655da0a6cb.en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF sul sito ECB&lt;/a&gt; · &lt;a href=&quot;https://econpapers.repec.org/paper/ecbecbsps/202449.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda RePEc&lt;/a&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; mostra come si costruisce in pratica un REER.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Trattati e norme&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treaty on European Union (TEU) e Treaty on the Functioning of the EU (TFEU)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 13–16 (art. 3, 9, 13 TEU; Titolo VIII TFEU). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; EUR-Lex pubblica le versioni consolidate; avverte che sono strumenti di documentazione e che fanno fede i testi della Gazzetta ufficiale. &lt;a href=&quot;https://eur-lex.europa.eu/collection/eu-law/treaties/treaties-force.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, trattati in vigore&lt;/a&gt; (link della slide) · &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016E&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;TFEU consolidato (2016)&lt;/a&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; mandato della ECB e regole fiscali, che si studiano nella parte 2, stanno qui.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treaty of Lisbon&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 13. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Firmato il 13 dicembre 2007, in vigore dal 1° dicembre 2009, dopo il secondo referendum irlandese. L&#x27;Italia è depositaria dei trattati dal 1957. &lt;a href=&quot;https://www.europarl.europa.eu/about-parliament/en/in-the-past/the-parliament-and-the-treaties/treaty-of-lisbon&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Parlamento europeo&lt;/a&gt; · &lt;a href=&quot;https://www.esteri.it/en/temi/unione_europea/architettura-istituzionale-ue/il-trattato-di-lisbona/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ministero degli Esteri&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Maastricht Treaty: criteri di convergenza&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 10. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; I criteri dell&#x27;art. 140 TFEU (prezzi, conti pubblici, cambio, tassi a lungo termine) e i convergence report di ECB e Commissione, almeno biennali. &lt;a href=&quot;https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB explainer&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ingresso della Bulgaria nell&#x27;euro (2026) e referendum islandese (2026)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 11–12. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Bulgaria: decisione Ecofin dell&#x27;8 luglio 2025, euro dal 1° gennaio 2026, 21° membro (&lt;a href=&quot;https://www.europarl.europa.eu/thinktank/en/document/EPRS_ATA(2025)775850&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EPRS&lt;/a&gt;). Islanda: il 29 agosto 2026 il 52,8% vota contro la ripresa dei negoziati sospesi da 13 anni; il paese resta nello Spazio economico europeo e in Schengen (&lt;a href=&quot;https://www.aljazeera.com/news/2026/8/30/iceland-votes-to-reject-eu-accession-talks-what-happens-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Al Jazeera&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Dati e indicatori&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Economist, Big Mac index&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 28–29. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Pubblicato dal 1986; confronta il prezzo del Big Mac tra paesi come test informale della PPP. Esiste anche una versione corretta per il PIL pro capite. Dal 2018 dati e codice sono pubblici. &lt;a href=&quot;https://www.economist.com/interactive/big-mac-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Economist, Big Mac index&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;voce Wikipedia&lt;/a&gt;. &lt;b&gt;Perché conta:&lt;/b&gt; è il modo più immediato per fare pratica con PPP e sopra/sottovalutazione.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB: effective exchange rates e Harmonised Competitiveness Indicators&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 38, 43–46. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Gli HCI sono costruiti con lo stesso metodo e gli stessi dati dei cambi effettivi dell&#x27;euro. Per i paesi dell&#x27;euro si calcolano verso 40 partner più gli altri paesi dell&#x27;area; un aumento indica minore competitività. &lt;a href=&quot;https://data.ecb.europa.eu/main-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Data Portal, HCI&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/mopo/eaec/eer/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina EER (link della slide)&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB Data Portal: key figures&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 19–20. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Indicatori di sintesi per l&#x27;area euro e per i singoli paesi (tassi, cambi, prezzi, macro, settore estero), con strumenti per confrontarli. &lt;a href=&quot;https://data.ecb.europa.eu/key-figures&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;data.ecb.europa.eu/key-figures&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Bank, GDP (constant 2015 US$), NY.GDP.MKTP.KD&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 18. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; PIL a prezzi costanti in dollari 2015 da fonti nazionali, OECD e stime World Bank, con licenza CC BY-4.0. È corretto per l&#x27;inflazione ma non per il diverso costo della vita. &lt;a href=&quot;https://data.worldbank.org/indicator/NY.GDP.MKTP.KD?locations=XC-US-CN&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank Data&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Eurostat, «Extra-euro area trade in goods» (Statistics Explained)&lt;/h4&gt;
   &lt;p class=&quot;why&quot;&gt;Slide 22. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nel 2024 l&#x27;area euro ha registrato un avanzo commerciale di 173 miliardi di €. Macchinari e veicoli sono i principali beni scambiati. Dal 2014 al 2024 sono aumentate le quote della Cina nelle importazioni e degli USA nelle esportazioni. &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Extra-euro_area_trade_in_goods&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Altri siti indicati nella slide 20&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;European Commission, DG ECFIN&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Previsioni di primavera e d&#x27;autunno e la banca dati macro annuale &lt;b&gt;AMECO&lt;/b&gt; (oltre 40 paesi, gratuita). &lt;a href=&quot;https://economy-finance.ec.europa.eu/index_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;economy-finance.ec.europa.eu&lt;/a&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Banca d&#x27;Italia&lt;/h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La &lt;b&gt;Base Dati Statistica&lt;/b&gt; (BDS) mette a disposizione indicatori e aggregati statistici. &lt;a href=&quot;https://www.bancaditalia.it/statistiche/basi-dati/bds/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bancaditalia.it, BDS&lt;/a&gt;&lt;/div&gt;
