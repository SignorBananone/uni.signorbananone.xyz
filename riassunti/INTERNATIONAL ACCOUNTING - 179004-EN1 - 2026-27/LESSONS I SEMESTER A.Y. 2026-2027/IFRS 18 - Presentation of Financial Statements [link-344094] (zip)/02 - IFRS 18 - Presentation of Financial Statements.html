  (function(){var c=[1,2,3,4].map(function(i){return document.getElementById(&#x27;lc&#x27;+i)}),o=document.getElementById(&#x27;lc-out&#x27;);
    function f(){var br=c[0].checked,gp=c[1].checked,wv=c[2].checked,fut=c[3].checked,cur,why=[];
      if(br&amp;&amp;!gp){cur=true;why.push(&#x27;Covenant violato entro la chiusura e nessun diritto di differire di 12 mesi a quella data (IAS 1.74; Appendix B dell\&#x27;IFRS 18).&#x27;);if(wv)why.push(&#x27;Il waiver di febbraio 2027 arriva dopo la chiusura: non cambia la classificazione, è un non-adjusting event da indicare in nota.&#x27;);}
      else if(br&amp;&amp;gp){cur=false;why.push(&#x27;La violazione c\&#x27;è, ma il grace period di almeno 12 mesi è stato concesso entro la chiusura (IAS 1.75 / IFRS 18.B103).&#x27;);}
      else{cur=false;why.push(&#x27;A fine periodo l\&#x27;entità ha il diritto di differire il pagamento oltre 12 mesi.&#x27;);if(wv)why.push(&#x27;Il waiver è irrilevante: non c\&#x27;era alcuna violazione da sanare.&#x27;);}
      if(fut)why.push(&#x27;Il covenant da rispettare solo dopo la chiusura &lt;b&gt;non&lt;/b&gt; incide sulla classificazione (emendamenti ottobre 2022), e conta poco anche l\&#x27;aspettativa di non rispettarlo: la classificazione non dipende dalle aspettative.&#x27;);
      if(gp&amp;&amp;!br)why.push(&#x27;Il grace period non serve: non c\&#x27;è violazione.&#x27;);
      o.className=&#x27;result &#x27;+(cur?&#x27;cur&#x27;:&#x27;nc&#x27;);o.innerHTML=(cur?&#x27;CURRENT liability&#x27;:&#x27;NON-CURRENT liability&#x27;)+&#x27;&lt;small&gt;&#x27;+why.join(&#x27; &#x27;)+&#x27;&lt;/small&gt;&#x27;;}
    c.forEach(function(x){x.onchange=f});f();})();
  &lt;/script&gt;

  &lt;h3&gt;Gli emendamenti 2020 e 2022 allo IAS 1&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;23 gennaio 2020 · &lt;em&gt;Classification of Liabilities as Current or Non-current&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;La IASB dà un approccio più generale alla classificazione, basato sugli &lt;b&gt;accordi contrattuali in essere alla data di chiusura&lt;/b&gt;. Gli emendamenti toccano &lt;b&gt;solo la presentazione&lt;/b&gt; nello SFP: non importi, tempi di rilevazione o informativa.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Che cosa chiariscono (1/3)&lt;/h4&gt;&lt;p&gt;La classificazione si basa sui &lt;b&gt;diritti esistenti alla fine del periodo&lt;/b&gt;; tutto il testo parla ora di &quot;&lt;b&gt;right&lt;/b&gt;&quot; a differire di almeno 12 mesi, e solo i diritti in essere &quot;&lt;em&gt;at the end of the reporting period&lt;/em&gt;&quot; contano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Che cosa chiariscono (2/3)&lt;/h4&gt;&lt;p&gt;La classificazione &lt;b&gt;non dipende dalle aspettative&lt;/b&gt; sull&#x27;esercizio di quel diritto. Se ho il diritto di rinviare ma penso di pagare entro l&#x27;anno, il debito resta non corrente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Che cosa chiariscono (3/3)&lt;/h4&gt;&lt;p&gt;&quot;&lt;b&gt;Settlement&lt;/b&gt;&quot; (estinzione) significa trasferire alla controparte cassa, strumenti di equity, altre attività o servizi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Ottobre 2022 · &lt;em&gt;Non-current Liabilities with Covenants&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Solo i &lt;b&gt;covenants da rispettare entro o alla data di chiusura&lt;/b&gt; incidono sulla classificazione. L&#x27;effetto combinato 2020 + 2022 cambia la prassi: le entità devono riesaminare i contratti di finanziamento esistenti e pianificati. Applicazione &lt;b&gt;retroattiva&lt;/b&gt; per i periodi dal &lt;b&gt;1° gennaio 2024&lt;/b&gt;, con applicazione anticipata ammessa; regole di transizione per chi aveva adottato in anticipo il testo 2020.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Gli emendamenti 2022 (pubblicati il 31 ottobre 2022) hanno anche introdotto nuova &lt;b&gt;informativa&lt;/b&gt; per le passività non correnti soggette a covenants da rispettare nei 12 mesi successivi. Fonte: &lt;a href=&quot;https://www.ey.com/en_gl/technical/ifrs-technical-resources/the-iasb-amends-requirements-for-classification-of-non-current-liabilities-with-covenants&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – IFRS technical resources&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte C&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Quale voce compare come line item separato nell&#x27;IFRS 18.103 ma non nello IAS 1.54? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Il &lt;b&gt;goodwill&lt;/b&gt; (avviamento), lettera (d).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;Il waiver dopo la chiusura è un non-adjusting event (IAS 10).&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Covenant violato il 15/12, debito esigibile a vista; la banca rinuncia al rimborso il 20/1, prima dell&#x27;approvazione. Classificazione al 31/12?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Non-current, grazie al waiver&lt;/button&gt;&lt;button data-ok&gt;Current&lt;/button&gt;&lt;button&gt;Dipende dalle intenzioni del management&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Qual è la differenza tra IAS 1.55A(b) e IFRS 18.24(b) sui subtotali? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;IAS 1: le voci che compongono il subtotale devono essere chiare e comprensibili. IFRS 18: il subtotale deve essere &lt;b&gt;compatibile con la struttura del prospetto&lt;/b&gt; imposta dal par. 22.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Quando è ammessa la presentazione per liquidità nell&#x27;IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Quando fornisce un &lt;em&gt;more useful structured summary&lt;/em&gt; della distinzione corrente/non corrente (IAS 1: informazioni &lt;em&gt;reliable and more relevant&lt;/em&gt;).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Scrivi l&#x27;equazione del &lt;em&gt;long-term financing approach&lt;/em&gt;. &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Fixed assets + Current assets − Short-term payables = Long-term debt + Equity.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Quale evento dopo la chiusura aggiunge l&#x27;IFRS 18.B105 rispetto allo IAS 1.76? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;(d) l&#x27;&lt;b&gt;estinzione&lt;/b&gt; (settlement) di una passività classificata non corrente.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE D --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte D · Performance, equity, cassa, note&lt;/span&gt;
  &lt;h2&gt;7 · Statement of profit or loss and other comprehensive income&lt;/h2&gt;

  &lt;h3&gt;Tre definizioni (IAS 1.7 = IFRS 18 Appendix A)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Profit or loss&lt;/b&gt; — totale dei ricavi meno i costi, &lt;b&gt;esclusi&lt;/b&gt; i componenti di other comprehensive income.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Other comprehensive income (OCI)&lt;/b&gt; — ricavi e costi (comprese le &lt;span class=&quot;term&quot;&gt;reclassification adjustments&lt;/span&gt;) &lt;b&gt;non&lt;/b&gt; rilevati nel profit or loss perché altri IFRS lo richiedono o lo permettono.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;b class=&quot;t&quot;&gt;Total comprehensive income&lt;/b&gt; — la variazione del patrimonio netto nel periodo dovuta a operazioni ed eventi &lt;b&gt;diversi&lt;/b&gt; dalle operazioni con i soci in quanto soci (aumenti di capitale, dividendi…).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Comprehensive income for the period = Profit or loss + Other comprehensive income&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Reclassification adjustment&lt;/span&gt; (il vecchio &lt;em&gt;recycling&lt;/em&gt;): importo prima rilevato in OCI che in un periodo successivo &quot;passa&quot; nel profit or loss. Esempio: la riserva di cash flow hedge che si riversa a conto economico quando l&#x27;operazione coperta si realizza.&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;oci&quot;&gt;
    &lt;h4&gt;Gioca con i componenti&lt;/h4&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;&lt;label&gt;Profit or loss: &lt;b id=&quot;pl-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pl&quot; min=&quot;-200&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;180&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;OCI che &lt;b&gt;non&lt;/b&gt; sarà riclassificato (es. revaluation surplus): &lt;b id=&quot;o1-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;o1&quot; min=&quot;-150&quot; max=&quot;150&quot; step=&quot;10&quot; value=&quot;40&quot;&gt;
      &lt;label&gt;OCI che &lt;b&gt;sarà&lt;/b&gt; riclassificato (es. cash flow hedge): &lt;b id=&quot;o2-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;o2&quot; min=&quot;-150&quot; max=&quot;150&quot; step=&quot;10&quot; value=&quot;-30&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 200&quot; id=&quot;oci-svg&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata del comprehensive income&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;src&quot;&gt;Grafico a cascata (waterfall): ogni barra parte dove finisce la precedente. Numeri a scelta dell&#x27;utente.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var s=document.getElementById(&#x27;oci-svg&#x27;);
    function v(i){return +document.getElementById(i).value}
    function draw(){[&#x27;pl&#x27;,&#x27;o1&#x27;,&#x27;o2&#x27;].forEach(function(i){document.getElementById(i+&#x27;-v&#x27;).textContent=v(i)});
      var pl=v(&#x27;pl&#x27;),o1=v(&#x27;o1&#x27;),o2=v(&#x27;o2&#x27;),tot=pl+o1+o2,zero=120,k=0.17,h=&#x27;&#x27;;
      h+=&#x27;&lt;line x1=&quot;20&quot; y1=&quot;&#x27;+zero+&#x27;&quot; x2=&quot;800&quot; y2=&quot;&#x27;+zero+&#x27;&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      var steps=[[&#x27;Profit or loss&#x27;,0,pl,&#x27;var(--brick)&#x27;],[&#x27;OCI – no recycling&#x27;,pl,o1,&#x27;var(--ochre)&#x27;],[&#x27;OCI – recycling&#x27;,pl+o1,o2,&#x27;oklch(65% 0.1 85)&#x27;],[&#x27;Total comprehensive income&#x27;,0,tot,&#x27;var(--sage)&#x27;]];
      steps.forEach(function(st,i){var a=st[1],b=st[1]+st[2],y1=zero-Math.max(a,b)*k,hh=Math.abs(st[2])*k,x=40+i*195;
        h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;140&quot; height=&quot;&#x27;+Math.max(hh,1)+&#x27;&quot; fill=&quot;&#x27;+st[3]+&#x27;&quot; rx=&quot;3&quot;/&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+70)+&#x27;&quot; y=&quot;&#x27;+(y1-6)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&#x27;+(st[2]&gt;0&amp;&amp;i&gt;0&amp;&amp;i&lt;3?&#x27;+&#x27;:&#x27;&#x27;)+st[2]+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+70)+&#x27;&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;&#x27;+st[0]+&#x27;&lt;/text&gt;&#x27;;});
      s.innerHTML=h;}
    [&#x27;pl&#x27;,&#x27;o1&#x27;,&#x27;o2&#x27;].forEach(function(i){document.getElementById(i).addEventListener(&#x27;input&#x27;,draw)});draw();})();
  &lt;/script&gt;

  &lt;h3&gt;Dove si rileva un provento o un costo&lt;/h3&gt;
  &lt;p&gt;IAS 1.88: tutti i ricavi e costi vanno nel &lt;b&gt;profit or loss&lt;/b&gt;, salvo che un IFRS richieda o permetta altrimenti. IAS 1.89 (↔ IFRS 18 B86-B89, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;): alcuni IFRS fanno rilevare elementi &lt;b&gt;fuori&lt;/b&gt; dal profit or loss.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;IAS 8: direttamente nell&#x27;equity&lt;/b&gt;&lt;br&gt;• &lt;b&gt;correzione di errori&lt;/b&gt;&lt;br&gt;• &lt;b&gt;effetto dei cambiamenti di accounting policy&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;gloss&quot;&gt;Rettificano il saldo di apertura degli utili portati a nuovo: non sono performance del periodo.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Altri IFRS: in OCI&lt;/b&gt;&lt;br&gt;Componenti che rispettano la definizione di ricavo o costo del Conceptual Framework ma che gli standard escludono dal profit or loss. Elenco qui sotto.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Esempi di voci di OCI (IAS 1.7; IFRS 18.B87 con &quot;different alphabetical order&quot;)&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;a · Revaluation surplus (IAS 16, IAS 38)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Le variazioni della riserva di rivalutazione di immobili, impianti e macchinari o di attività immateriali valutate con il &lt;span class=&quot;term&quot;&gt;revaluation model&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;b · Remeasurements dei defined benefit plans (IAS 19)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Utili e perdite attuariali sui piani a benefici definiti per i dipendenti (in Italia, ad esempio, il TFR nei bilanci IFRS).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;c · Differenze di conversione delle gestioni estere (IAS 21)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Utili e perdite dalla conversione del bilancio di una controllata estera nella presentation currency del gruppo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;d · Strumenti di equity designati a FVOCI (IFRS 9 par. 5.7.5)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Partecipazioni non di trading che l&#x27;entità sceglie irrevocabilmente di valutare al &lt;span class=&quot;term&quot;&gt;fair value through other comprehensive income&lt;/span&gt; (FVOCI).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;da · Attività finanziarie a FVOCI (IFRS 9 par. 4.1.2A)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Tipicamente titoli di debito detenuti sia per incassare i flussi contrattuali sia per la vendita.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;e · Cash flow hedge (IFRS 9 cap. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;La &lt;b&gt;parte efficace&lt;/b&gt; degli utili e perdite sugli strumenti di copertura in un cash flow hedge, e sugli strumenti che coprono investimenti in equity a FVOCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;f · Own credit risk (IFRS 9 par. 5.7.7)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Per alcune passività designate al fair value through profit or loss, la parte della variazione di fair value dovuta al cambiamento del &lt;b&gt;rischio di credito proprio&lt;/b&gt; dell&#x27;entità.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;g · Time value delle opzioni (IFRS 9 cap. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Quando si designa come copertura solo il valore intrinseco dell&#x27;opzione, le variazioni del valore temporale vanno in OCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;h · Forward elements e foreign currency basis spread (IFRS 9 cap. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Quando si designa come copertura solo l&#x27;elemento spot di un forward, le variazioni dell&#x27;elemento forward (e del basis spread in valuta escluso dalla designazione) vanno in OCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;i · Insurance finance income/expenses (IFRS 17 par. 88(b), 89(b))&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Per i contratti assicurativi, la parte dei proventi/oneri finanziari esclusa dal profit or loss quando l&#x27;entità disaggrega il totale con un&#x27;allocazione sistematica o per eliminare &lt;span class=&quot;term&quot;&gt;accounting mismatches&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;j · Reinsurance contracts held (IFRS 17 par. 88(b))&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Lo stesso meccanismo per i contratti di riassicurazione detenuti.&lt;/div&gt;&lt;/details&gt;

  &lt;h4&gt;Sezione OCI: due gruppi (IAS 1.82A)&lt;/h4&gt;
  &lt;svg viewBox=&quot;0 0 820 170&quot; role=&quot;img&quot; aria-label=&quot;OCI riclassificabile e non riclassificabile&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;130&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Will NOT be reclassified to P/L&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;revaluation surplus · remeasurements IAS 19&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot;&gt;equity a FVOCI · own credit risk&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;restano per sempre fuori dal P/L&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;130&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Will be reclassified when conditions met&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;conversione gestioni estere · cash flow hedge&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot;&gt;titoli di debito a FVOCI&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;prima o poi &quot;passano&quot; nel P/L&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;p&gt;Stessa distinzione per la quota di OCI di collegate e joint venture a equity method. Classificazione per &lt;b&gt;natura&lt;/b&gt; all&#x27;interno di ciascun gruppo.&lt;/p&gt;

  &lt;h3&gt;Scelte di presentazione e requisiti di base&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Un prospetto o due&lt;/b&gt;: IAS 1.10A = IFRS 18.12 (v. sezione 1).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;IAS 1.81A&lt;/b&gt;: oltre alle due sezioni, il prospetto presenta profit or loss, totale OCI e comprehensive income; se il P/L è separato, non si ripete nella sezione OCI. &lt;span class=&quot;verdict v-diff&quot;&gt;Not found in IFRS 18&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Attribuzione&lt;/b&gt; (IAS 1.81B ↔ IFRS 18.76 e 18.87, &lt;span class=&quot;verdict v-mean&quot;&gt;same content in separate paragraphs&lt;/span&gt;): profit or loss e comprehensive income attribuibili a &lt;b&gt;non-controlling interests&lt;/b&gt; e a &lt;b&gt;owners of the parent&lt;/b&gt;. Nell&#x27;IFRS 18 l&#x27;allocazione del P/L sta &lt;b&gt;fuori da tutte le categorie&lt;/b&gt; del par. 47.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Line items minimi del profit or loss&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;IFRS 18.75&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;IAS 1.82&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Che cosa cambia&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;(a) Richiesti dall&#x27;IFRS 18:&lt;/b&gt; (i) revenue; (ii) &lt;mark&gt;operating expenses&lt;/mark&gt; (con le voci richieste dai par. 78 e 82(a)); (iii) quota di risultato di collegate e JV a equity method; (iv) income tax expense or income; (v) un unico importo per le discontinued operations (IFRS 5).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;(b) Richiesti dall&#x27;IFRS 9:&lt;/b&gt; (i) interest revenue col metodo dell&#x27;interesse effettivo; (ii) impairment losses (Section 5.5); (iii) utili/perdite da derecognition di attività al costo ammortizzato; (iv) differenza fair value/costo ammortizzato alla riclassifica verso FVTPL; (v) utili/perdite cumulati in OCI riclassificati a P/L alla riclassifica da FVOCI a FVTPL.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;(c) Richiesti dall&#x27;IFRS 17:&lt;/b&gt; (i) insurance revenue; (ii) insurance service expenses; (iii) proventi/costi da riassicurazione; (iv) insurance finance income/expenses; (v) finance income/expenses da riassicurazione.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;(a) revenue, con separati interest revenue (metodo dell&#x27;interesse effettivo) e insurance revenue; (aa) derecognition di attività al costo ammortizzato; (ab) insurance service expenses; (ac) riassicurazione; &lt;mark&gt;(b) finance costs&lt;/mark&gt;; (ba) impairment losses IFRS 9; (bb)-(bc) insurance finance; (c) quota collegate e JV; (ca)-(cb) riclassifiche di attività finanziarie; (d) tax expense; (ea) unico importo per discontinued operations.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;verdict v-diff&quot;&gt;There are differences compared to IAS 1.82&lt;/span&gt;&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;L&#x27;IFRS 18 &lt;b&gt;riorganizza&lt;/b&gt; l&#x27;elenco per fonte: requisiti propri, IFRS 9, IFRS 17.&lt;/li&gt;&lt;li&gt;Compare la voce &lt;b&gt;operating expenses&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Nell&#x27;elenco IFRS 18 delle slide non c&#x27;è più &lt;b&gt;finance costs&lt;/b&gt; come voce minima autonoma: si lega alla nuova struttura per categorie (v. sezione 11).&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Nature vs function&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.99 / 1.104&lt;/h5&gt;Analisi dei costi per &lt;b&gt;natura&lt;/b&gt; o per &lt;b&gt;funzione&lt;/b&gt;, scegliendo quella che dà informazioni &lt;em&gt;reliable and more relevant&lt;/em&gt;. Chi usa la funzione dà in nota informazioni sulla natura, compresi ammortamenti e costo del personale.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.78, 18.81&lt;/h5&gt;Nella &lt;b&gt;operating category&lt;/b&gt; i costi si classificano nel modo che dà il &lt;em&gt;most useful structured summary&lt;/em&gt;, usando &lt;b&gt;una o entrambe&lt;/b&gt; le caratteristiche (B80-B85). Esempio: il &lt;span class=&quot;term&quot;&gt;cost of sales&lt;/span&gt; è una voce per funzione che combina materie prime, personale, ammortamenti.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning, with more detail&lt;/span&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Per natura&lt;/b&gt; (&lt;em&gt;nature expenses&lt;/em&gt;): costi secondo la risorsa consumata, &lt;b&gt;senza&lt;/b&gt; riferimento all&#x27;attività per cui è stata consumata (materie prime, personale, ammortamenti).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Per funzione&lt;/b&gt;: costi allocati e aggregati secondo l&#x27;&lt;b&gt;attività&lt;/b&gt; a cui si riferisce la risorsa (produzione, vendita, amministrazione, R&amp;amp;D). Una stessa natura può finire in più funzioni (il personale in cost of sales e in R&amp;amp;D) e una funzione può contenere più nature.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;sim&quot; id=&quot;nf&quot;&gt;
    &lt;h4&gt;Lo stesso conto economico, due viste&lt;/h4&gt;
    &lt;label&gt;Quota del costo del personale attribuita alla produzione: &lt;b id=&quot;nf-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;nf-r&quot; min=&quot;20&quot; max=&quot;90&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;
    &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;n&quot;&gt;By nature&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;f&quot;&gt;By function&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;nf-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div id=&quot;nf-note&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var r=document.getElementById(&#x27;nf-r&#x27;),t=document.getElementById(&#x27;nf-t&#x27;),n=document.getElementById(&#x27;nf-note&#x27;),m=&#x27;n&#x27;;
    var bs=document.querySelectorAll(&#x27;#nf .btnrow button&#x27;);bs.forEach(function(b){b.onclick=function(){m=b.dataset.m;bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});draw()}});
    function row(a,b,bold){return &#x27;&lt;tr&#x27;+(bold?&#x27; style=&quot;font-weight:600;border-top:2px solid var(--ink)&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+a+&#x27;&lt;/td&gt;&lt;td style=&quot;text-align:right&quot;&gt;&#x27;+b+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;}
    function draw(){var p=+r.value/100;document.getElementById(&#x27;nf-v&#x27;).textContent=Math.round(p*100)+&#x27;%&#x27;;
      var rev=1000,mat=300,emp=250,da=100,oth=50,op=rev-mat-emp-da-oth,h=&#x27;&#x27;;
      if(m===&#x27;n&#x27;){h=row(&#x27;Revenue&#x27;,rev)+row(&#x27;Raw materials used&#x27;,-mat)+row(&#x27;Employee benefits expense&#x27;,-emp)+row(&#x27;Depreciation and amortisation&#x27;,-da)+row(&#x27;Other operating expenses&#x27;,-oth)+row(&#x27;Operating profit&#x27;,op,1);n.innerHTML=&#x27;&#x27;;}
      else{var es=emp*p,ea=emp*(1-p)*0.6,er=emp*(1-p)*0.4,cos=mat+es+da*0.7,dist=oth*0.6+ea*0.5,adm=oth*0.4+ea*0.5+da*0.3;
        h=row(&#x27;Revenue&#x27;,rev)+row(&#x27;Cost of sales&#x27;,-Math.round(cos))+row(&#x27;Gross profit&#x27;,rev-Math.round(cos),1)+row(&#x27;Distribution costs&#x27;,-Math.round(dist))+row(&#x27;Administrative expenses&#x27;,-Math.round(adm))+row(&#x27;Research and development&#x27;,-Math.round(er))+row(&#x27;Operating profit&#x27;,rev-Math.round(cos)-Math.round(dist)-Math.round(adm)-Math.round(er),1);
        n.innerHTML=&#x27;&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Chi presenta per funzione deve dare in &lt;b&gt;un\&#x27;unica nota&lt;/b&gt;, per ogni voce per funzione, i totali di ammortamenti, amortisation, benefici ai dipendenti, impairment e svalutazioni del magazzino (IFRS 18.83; ne ha trattato anche un\&#x27;agenda decision dell\&#x27;IFRS Interpretations Committee ad aprile 2026). Qui: personale &#x27;+emp+&#x27; (di cui &#x27;+Math.round(es)+&#x27; nel cost of sales), D&amp;amp;A &#x27;+da+&#x27;. Fonte: &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/more-disclosure-when-presenting-operating-expenses-by-function-under-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO Australia&lt;/a&gt;.&lt;/div&gt;&#x27;;}
      t.innerHTML=h;}
    r.addEventListener(&#x27;input&#x27;,draw);draw();})();
  &lt;/script&gt;
  &lt;p class=&quot;src&quot;&gt;Numeri inventati per l&#x27;esempio. Nota che l&#x27;&lt;b&gt;operating profit non cambia&lt;/b&gt; (≈ 300) spostando il cursore: cambia solo la ripartizione tra funzioni (piccole differenze sono arrotondamenti).&lt;/p&gt;

  &lt;h3&gt;Voci da evidenziare separatamente&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.98&lt;/h5&gt;Svalutazioni di magazzino (a valore netto di realizzo) o di PP&amp;amp;E (a valore recuperabile) e loro ripristini · ristrutturazioni e rilascio dei fondi · dismissioni di PP&amp;amp;E · dismissioni di investimenti · &lt;b&gt;discontinued operations&lt;/b&gt; · chiusura di contenziosi · altri rilasci di fondi.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B79&lt;/h5&gt;(a) svalutazioni del magazzino e ripristini; (b) &lt;b&gt;impairment&lt;/b&gt; di PP&amp;amp;E e ripristini (voce a sé); (c) ristrutturazioni; (d) dismissioni di PP&amp;amp;E; (e) dismissioni di investimenti; (f) contenziosi; (g) rilasci di fondi; &lt;mark&gt;(h) proventi e costi &lt;b&gt;non ricorrenti&lt;/b&gt; non compresi in (a)-(g)&lt;/mark&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-diff&quot;&gt;There are differences compared to IAS 1.98&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Spariscono le discontinued operations (già voce minima autonoma), compaiono i non-recurring items.&lt;/span&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Divieto di extraordinary items&lt;/b&gt; (IAS 1.87): nessun ricavo o costo può essere presentato come &quot;straordinario&quot;, né nei prospetti né nelle note. Un evento raro va mostrato per quello che è (es. &quot;costi di ristrutturazione&quot;), non etichettato come straordinario. Notare che lo IAS 1.85 chiede comunque voci aggiuntive, intestazioni e subtotali quando servono a capire la performance, con gli stessi quattro requisiti dei subtotali (IAS 1.85A-85B) e la riconciliazione con i totali richiesti dagli IFRS.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s8&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte D · Performance, equity, cassa, note&lt;/span&gt;
  &lt;h2&gt;8 · Statement of cash flows e statement of changes in equity&lt;/h2&gt;
  &lt;h3&gt;Statement of cash flows&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.111&lt;/h5&gt;Nessun requisito proprio: rinvio allo &lt;b&gt;IAS 7 &lt;em&gt;Statement of Cash Flows&lt;/em&gt;&lt;/b&gt;. I flussi di cassa servono a valutare la capacità di generare cassa e mezzi equivalenti e il fabbisogno di utilizzarli.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.3&lt;/h5&gt;Rinvio allo IAS 7, &lt;b&gt;ma&lt;/b&gt; i requisiti generali dell&#x27;IFRS 18 (par. 9-43 e 113-114) si applicano anche al cash flow statement. L&#x27;IFRS 18 riporta inoltre i paragrafi dello IAS 7 emendati.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Tra le modifiche allo IAS 7 introdotte dall&#x27;IFRS 18 c&#x27;è l&#x27;eliminazione della scelta su come classificare i flussi di &lt;b&gt;interessi e dividendi&lt;/b&gt; incassati e pagati; EY indica lo IAS 7 tra le modifiche conseguenti più rilevanti, insieme a IAS 33 e IAS 34. Fonti: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://ifrscommunity.com/?p=7666&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRScommunity – Transition to IFRS 18&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Statement of changes in equity&lt;/h3&gt;
  &lt;p&gt;IAS 1.106 ↔ IFRS 18.107 &lt;span class=&quot;verdict v-same&quot;&gt;remained the same&lt;/span&gt;. Il prospetto contiene:&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 820 230&quot; role=&quot;img&quot; aria-label=&quot;Riconciliazione del patrimonio netto&quot;&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;di apertura&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± IAS 8&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;retrospective&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;restatement&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;80&quot; width=&quot;110&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± Profit&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;or loss&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;80&quot; width=&quot;90&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± OCI&lt;/text&gt;
      &lt;rect x=&quot;530&quot; y=&quot;80&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± Transazioni&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;119&quot; text-anchor=&quot;middle&quot;&gt;con i soci&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;conferimenti, dividendi&lt;/text&gt;
      &lt;rect x=&quot;690&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;di chiusura&lt;/text&gt;
      &lt;text x=&quot;410&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;per ogni componente di equity (capitale, riserve, utili a nuovo, NCI…)&lt;/text&gt;
      &lt;path d=&quot;M290,170 L510,170&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot;&gt;= total comprehensive income (owners / NCI)&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;+ variazioni di quote in controllate&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;senza perdita di controllo&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Analisi dell&#x27;OCI per voce&lt;/b&gt;, per ogni componente di equity, nel prospetto o nelle note: IAS 1.106A ↔ IFRS 18.109 &lt;span class=&quot;verdict v-same&quot;&gt;remained the same&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Dividendi&lt;/b&gt; rilevati come distribuzioni ai soci nel periodo e &lt;b&gt;dividendo per azione&lt;/b&gt;: IAS 1.107 ↔ IFRS 18.110 &lt;span class=&quot;verdict v-same&quot;&gt;same content&lt;/span&gt;.&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s9&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte D · Performance, equity, cassa, note&lt;/span&gt;
  &lt;h2&gt;9 · Notes to the financial statements&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Notes&lt;/b&gt; (IFRS 18 Appendix A) — informazioni del bilancio fornite &lt;b&gt;in aggiunta&lt;/b&gt; a quelle presentate nei primary financial statements.&lt;/div&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.112&lt;/h5&gt;Le note: presentano la &lt;b&gt;base di redazione&lt;/b&gt; e le accounting policies specifiche; danno l&#x27;informativa richiesta dagli IFRS non presentata altrove; danno informazioni non presentate altrove ma &lt;b&gt;relevant&lt;/b&gt; per capire il bilancio.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.113&lt;/h5&gt;Stesso contenuto, con &quot;non presentato nei &lt;b&gt;primary financial statements&lt;/b&gt;&quot; e &quot;&lt;mark&gt;necessary&lt;/mark&gt;&quot; al posto di &quot;relevant&quot;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning explained differently&lt;/span&gt;

  &lt;h3&gt;Ordine sistematico e rimandi&lt;/h3&gt;
  &lt;p&gt;IAS 1.113 ↔ IFRS 18.114: note presentate, per quanto possibile, in modo &lt;b&gt;sistematico&lt;/b&gt;, pensando a comprensibilità e comparabilità; ogni voce dei prospetti ha un &lt;b&gt;cross-reference&lt;/b&gt; alla nota collegata. &lt;span class=&quot;verdict v-diff&quot;&gt;An additional sentence was added&lt;/span&gt;: &lt;mark&gt;se importi indicati in nota sono compresi in una o più voci dei prospetti, la nota deve dire in quali voci&lt;/mark&gt;. Così il lettore può &quot;ricostruire&quot; i numeri tra nota e prospetto.&lt;/p&gt;
  &lt;p&gt;Esempi di ordinamento (IAS 1.114 ↔ IFRS 18.B112, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;). Scorri le tre opzioni:&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(a) Per rilevanza&lt;/h4&gt;&lt;p&gt;Dare risalto alle aree di attività che l&#x27;entità ritiene &lt;b&gt;più rilevanti&lt;/b&gt; per capire performance e posizione, ad esempio raggruppando le informazioni su particolari attività operative.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(b) Per criterio di valutazione&lt;/h4&gt;&lt;p&gt;Raggruppare le voci &lt;b&gt;valutate allo stesso modo&lt;/b&gt;, ad esempio tutte le attività al fair value.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(c) Seguendo l&#x27;ordine dei prospetti&lt;/h4&gt;&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;dichiarazione di conformità agli IFRS (IFRS 18: v. IAS 8 par. 6B);&lt;/li&gt;&lt;li&gt;material accounting policy information (IFRS 18: v. IAS 8 par. 27A);&lt;/li&gt;&lt;li&gt;informazioni a supporto delle voci dei prospetti, nell&#x27;ordine dei prospetti e delle voci;&lt;/li&gt;&lt;li&gt;altre informazioni: &lt;b&gt;passività potenziali&lt;/b&gt; (IAS 37) e impegni contrattuali non rilevati; informazioni non finanziarie, es. obiettivi e politiche di gestione del rischio finanziario (IFRS 7).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Contingent liability&lt;/span&gt; (passività potenziale): obbligazione possibile che dipende da eventi futuri incerti, o obbligazione attuale non rilevata perché improbabile o non stimabile; si indica in nota, non si iscrive (IAS 37).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte D&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Scrivi la relazione tra comprehensive income, profit or loss e OCI. &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Comprehensive income = Profit or loss + Other comprehensive income.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;I remeasurements IAS 19 restano per sempre fuori dal P/L.&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Quale voce di OCI &lt;b&gt;non&lt;/b&gt; sarà mai riclassificata nel profit or loss?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Parte efficace di un cash flow hedge&lt;/button&gt;&lt;button&gt;Differenze di conversione di una gestione estera&lt;/button&gt;&lt;button data-ok&gt;Remeasurements di un defined benefit plan&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Correzione di un errore di un esercizio precedente: P/L, OCI o equity? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Direttamente nell&#x27;&lt;b&gt;equity&lt;/b&gt; (rettifica retroattiva secondo lo IAS 8); compare nello statement of changes in equity come effetto del retrospective restatement.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Un&#x27;impresa vuole etichettare come &quot;extraordinary&quot; il risarcimento di un&#x27;alluvione. Può farlo? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No (IAS 1.87). Può però presentarlo separatamente se material, con una descrizione chiara; nell&#x27;IFRS 18.B79 rientrerebbe tra le voci con caratteristiche diverse, eventualmente come provento/costo non ricorrente (h).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Che cosa aggiunge l&#x27;IFRS 18.114 rispetto allo IAS 1.113? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Se gli importi in nota sono compresi in voci dei prospetti, la nota deve indicare &lt;b&gt;in quali voci&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Il cash flow statement è escluso dai requisiti generali dell&#x27;IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: la disciplina specifica è nello IAS 7, ma i requisiti generali dell&#x27;IFRS 18 (par. 9-43 e 113-114) si applicano anche a esso (IFRS 18.3).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- LESSICO --&gt;
&lt;section id=&quot;s10&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte A · Lessico&lt;/span&gt;
  &lt;h2&gt;10 · Terminologia: vecchi nomi, nuovi nomi, defined terms&lt;/h2&gt;
  &lt;p&gt;Con la revisione del 2007 lo IAS 1 ha cambiato molti nomi; in libri, bilanci e conversazioni si incontrano ancora i vecchi. Mettiti alla prova: nascondi la colonna di destra e prova a ricordare.&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;term-t&quot;&gt;Nascondi i termini 2007&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;term-tab&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Prima della revisione 2007&lt;/th&gt;&lt;th&gt;IAS 1 (2007)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;balance sheet&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of financial position&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;cash flow statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of cash flows&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;income statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of comprehensive income (income statement resta nell&#x27;approccio a due prospetti)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised in the income statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised in profit or loss&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised [directly] in equity (solo componenti OCI)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised in other comprehensive income&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised [directly] in equity (rilevazione sia in OCI sia in equity)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised outside profit or loss (in OCI o in equity)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;removed from equity and recognised in profit or loss (&quot;recycling&quot;)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;reclassified from equity to profit or loss as a reclassification adjustment&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Standard or/and Interpretation&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;IFRSs&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;equity holders&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;owners (eccezione: &quot;ordinary equity holders&quot;)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;balance sheet date&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;end of the reporting period&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;reporting date&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;end of the reporting period&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){var b=document.getElementById(&#x27;term-t&#x27;),h=false;b.onclick=function(){h=!h;document.querySelectorAll(&#x27;#term-tab .nw&#x27;).forEach(function(c){c.style.color=h?&#x27;transparent&#x27;:&#x27;&#x27;;c.style.background=h?&#x27;var(--sage-bg)&#x27;:&#x27;&#x27;;c.title=h?&#x27;clicca per vedere&#x27;:&#x27;&#x27;;});b.textContent=h?&#x27;Mostra i termini 2007&#x27;:&#x27;Nascondi i termini 2007&#x27;;b.classList.toggle(&#x27;on&#x27;,h)};
    document.querySelectorAll(&#x27;#term-tab .nw&#x27;).forEach(function(c){c.onclick=function(){c.style.color=&#x27;&#x27;;c.style.background=&#x27;&#x27;}});})();
  &lt;/script&gt;

  &lt;h3&gt;IFRS 18 – Appendix A, defined terms citati nelle slide&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Termine&lt;/th&gt;&lt;th&gt;Definizione (parafrasi)&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Notes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Informazioni del bilancio in aggiunta a quelle dei primary financial statements.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Operating profit or loss&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Totale di tutti i ricavi e costi classificati nella &lt;b&gt;operating category&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Other comprehensive income&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ricavi e costi (comprese le reclassification adjustments) rilevati fuori dal profit or loss come richiesto o permesso da altri IFRS.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Aggregation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sommare elementi che condividono caratteristiche e stanno nella stessa classificazione.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Classification&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ordinare gli elementi in base a caratteristiche condivise.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Disaggregation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Separare una voce in componenti con caratteristiche non condivise.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Material information&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Omettere, esporre male od oscurare l&#x27;informazione potrebbe ragionevolmente influenzare le decisioni dei primary users.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s11&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Contesto · fonte esterna&lt;/span&gt;
  &lt;h2&gt;11 · Che cosa porta di davvero nuovo l&#x27;IFRS 18&lt;/h2&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Le slide si concentrano su ciò che l&#x27;IFRS 18 &lt;b&gt;conserva&lt;/b&gt; dello IAS 1, ma citano di passaggio la &lt;em&gt;operating category&lt;/em&gt;, le &quot;categories described in paragraph 47&quot; e la &quot;statement structure created by paragraph 22&quot;. Questa sezione spiega in breve queste novità, che le slide danno per scontate. Tutto il contenuto viene da fonti web: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://www.ey.com/en_om/insights/ifrs/ifrs-18-changes-financial-performance-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – IFRS 18 changes financial performance reporting&lt;/a&gt;; &lt;a href=&quot;https://dib.no/fagartikler/summary-of-ifrs-18-presentation-and-disclosure-in-the-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DIB – Summary of IFRS 18&lt;/a&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Cinque categorie&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Management-defined performance measures&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Grouping&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Nel profit or loss ricavi e costi vanno in &lt;b&gt;cinque categorie&lt;/b&gt;: &lt;b&gt;operating&lt;/b&gt;, &lt;b&gt;investing&lt;/b&gt;, &lt;b&gt;financing&lt;/b&gt;, &lt;b&gt;income taxes&lt;/b&gt;, &lt;b&gt;discontinued operations&lt;/b&gt;. La operating è la categoria &lt;em&gt;residuale&lt;/em&gt; (default): ci finisce tutto ciò che non rientra nelle altre. Due nuovi subtotali obbligatori:&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Struttura del profit or loss secondo IFRS 18&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;560&quot; height=&quot;55&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;Operating&lt;/text&gt;&lt;text x=&quot;35&quot; y=&quot;54&quot; font-size=&quot;12&quot;&gt;ricavi e costi operativi (categoria residuale)&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;22&quot; width=&quot;200&quot; height=&quot;32&quot; rx=&quot;16&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Operating profit or loss&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;75&quot; width=&quot;560&quot; height=&quot;45&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;102&quot; font-weight=&quot;700&quot;&gt;Investing&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;102&quot; font-size=&quot;12&quot;&gt;es. rendimenti di investimenti, quote a equity method&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;125&quot; width=&quot;200&quot; height=&quot;45&quot; rx=&quot;16&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;Profit or loss before&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;financing and income taxes&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;560&quot; height=&quot;35&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;202&quot; font-weight=&quot;700&quot;&gt;Financing&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;202&quot; font-size=&quot;12&quot;&gt;es. interessi passivi sui finanziamenti&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;222&quot; width=&quot;560&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;242&quot; font-weight=&quot;700&quot;&gt;Income taxes&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;259&quot; width=&quot;560&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;279&quot; font-weight=&quot;700&quot;&gt;Discontinued operations&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;262&quot; width=&quot;200&quot; height=&quot;28&quot; rx=&quot;14&quot; fill=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;281&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Profit or loss&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;p&gt;Le entità con &lt;b&gt;specified main business activities&lt;/b&gt; (es. banche che finanziano clienti, società che investono in attività come main business) classificano nella operating alcuni proventi e oneri che altrimenti andrebbero in investing o financing.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Le &lt;span class=&quot;term&quot;&gt;management-defined performance measures&lt;/span&gt; (MPM) sono subtotali di ricavi e costi &lt;b&gt;non&lt;/b&gt; previsti dagli IFRS, usati nelle comunicazioni pubbliche fuori dal bilancio per dare la visione del management sulla performance (es. un &quot;EBITDA rettificato&quot;). L&#x27;IFRS 18 non le vieta, ma le porta &lt;b&gt;dentro&lt;/b&gt; il bilancio: in &lt;b&gt;un&#x27;unica nota&lt;/b&gt; va spiegato perché sono utili e va data la &lt;b&gt;riconciliazione&lt;/b&gt; con il subtotale IFRS più vicino.&lt;/p&gt;
      &lt;p&gt;Collegamento con le slide: è lo stesso spirito dei requisiti sui subtotali aggiuntivi (IAS 1.55A/85A ↔ IFRS 18.24): ok le misure &quot;su misura&quot;, purché trasparenti, coerenti nel tempo e non più evidenti dei totali IFRS.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;L&#x27;IFRS 18 aggiunge indicazioni sul &lt;b&gt;grouping&lt;/b&gt; delle informazioni: quando aggregare o disaggregare e se un&#x27;informazione debba stare nei primary financial statements (per un useful structured summary) o nelle note (per dare material information). Sono le definizioni di aggregation, classification e disaggregation viste nella sezione 3, rese operative.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Effetti pratici: l&#x27;IFRS 18 si applica &lt;b&gt;retroattivamente&lt;/b&gt;, con riesposizione dei comparativi; ammessa l&#x27;applicazione anticipata.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Testi, norme e siti citati nelle slide&lt;/h2&gt;
  &lt;p&gt;Tutte le schede qui sotto sono &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;: dati e link vengono da ricerche web e vanno controllati sul testo ufficiale. Le slide citano anche molti altri standard (IAS 2, 12, 16, 19, 21, 32, 37, 38, 41; IFRS 5, 7, 9, 17): i loro testi sono raccolti nell&#x27;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;elenco degli standard IFRS Foundation&lt;/a&gt;.&lt;/p&gt;
  &lt;ul class=&quot;res-list&quot;&gt;
    &lt;li&gt;&lt;h4&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;Emesso dalla IASB il 9 aprile 2024, sostituisce lo IAS 1; si applica ai periodi annuali dal 1° gennaio 2027, anche ai bilanci intermedi, con applicazione anticipata ammessa e applicazione retroattiva. Introduce le categorie del profit or loss, i nuovi subtotali e le MPM. &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;oggetto della lezione e il più grande cambiamento di presentazione da circa vent&#x27;anni.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-accounting-standards-tracker/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW – IFRS 18 tracker&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/part-i-ifrs/international-financial-reporting-standards/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IFRS 18&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 1 &lt;em&gt;Presentation of Financial Statements&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;Requisiti generali di presentazione, struttura e contenuto minimo del bilancio (par. 1-140 più appendice). Superato dall&#x27;IFRS 18 dal 2027. &lt;b&gt;Perché conta:&lt;/b&gt; è il termine di confronto di tutte le slide; serve leggerlo per capire da dove vengono le regole che l&#x27;IFRS 18 conserva.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;&lt;em&gt;Conceptual Framework for Financial Reporting&lt;/em&gt; (2018)&lt;/h4&gt;
      &lt;p&gt;Pubblicato dalla IASB il 29 marzo 2018, sostituisce la versione 2010. Contiene obiettivo del bilancio, caratteristiche qualitative, definizioni degli elementi, criteri di rilevazione, un capitolo nuovo sulla misurazione, chiarimenti su stewardship e prudenza. Non è uno standard e non prevale sugli IFRS. &lt;b&gt;Perché conta:&lt;/b&gt; le slide lo richiamano per fair presentation, going concern (par. 3.9) e definizioni di ricavo e costo.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2018/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – Conceptual Framework (progetto 2018)&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/part-i-ifrs/international-financial-reporting-standards/iasb-conceptual-framework-for-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – sintesi&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 8 &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt; (già &lt;em&gt;Accounting Policies, Changes in Accounting Estimates and Errors&lt;/em&gt;)&lt;/h4&gt;
      &lt;p&gt;Con l&#x27;IFRS 18 ha ricevuto dallo IAS 1 fair presentation e compliance, going concern, accrual basis e informativa sulle policy, ed è stato rinominato. Resta lo standard su policy, stime ed errori. &lt;b&gt;Perché conta:&lt;/b&gt; spiega i rimandi &quot;6A-6N&quot;, &quot;IAS 8 par. 6B&quot; e &quot;27A&quot; e il trattamento in equity di errori e cambi di policy.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 8&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Amendments to IAS 1: &lt;em&gt;Classification of Liabilities as Current or Non-current&lt;/em&gt; (2020) e &lt;em&gt;Non-current Liabilities with Covenants&lt;/em&gt; (2022)&lt;/h4&gt;
      &lt;p&gt;Il primo (gennaio 2020) basa la classificazione sul diritto esistente a fine periodo; il secondo (31 ottobre 2022) chiarisce che contano solo i covenants da rispettare entro la chiusura e aggiunge informativa sui debiti con covenants. In vigore dal 1° gennaio 2024. &lt;b&gt;Perché conta:&lt;/b&gt; è il fondamento della sezione 6 e ha cambiato la prassi sui contratti di finanziamento.&lt;/p&gt;
      &lt;a href=&quot;https://www.ey.com/en_gl/technical/ifrs-technical-resources/the-iasb-amends-requirements-for-classification-of-non-current-liabilities-with-covenants&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – sintesi emendamenti 2022&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2022/10/ias-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – notizia ottobre 2022&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 7 &lt;em&gt;Statement of Cash Flows&lt;/em&gt; e supplier finance arrangements&lt;/h4&gt;
      &lt;p&gt;Disciplina il rendiconto finanziario, a cui rinviano IAS 1.111 e IFRS 18.3. Gli emendamenti a IAS 7 e IFRS 7 del 25 maggio 2023 hanno introdotto informativa sui supplier finance arrangements (par. 44F-44H), in vigore dal 2024. &lt;b&gt;Perché conta:&lt;/b&gt; spiega il nuovo punto (d) di IFRS 18.B111 sui debiti commerciali.&lt;/p&gt;
      &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – emendamenti maggio 2023&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 10 &lt;em&gt;Events after the Reporting Period&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;Stabilisce quando rettificare il bilancio per eventi successivi alla chiusura (adjusting) e quando solo informare in nota (non-adjusting). &lt;b&gt;Perché conta:&lt;/b&gt; rifinanziamenti, rimedi e grace period concessi dopo la chiusura sono non-adjusting events (IAS 1.76, IFRS 18.B105).&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-10-events-after-the-reporting-period/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 10&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-faqs/how-to-distinguish-adjusting-from-non-adjusting-events-after-the-reporting-period-under-ias-10&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW – adjusting vs non-adjusting&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Recepimento dell&#x27;IFRS 18 nell&#x27;Unione Europea&lt;/h4&gt;
      &lt;p&gt;EFRAG ha dato parere favorevole all&#x27;omologazione (rispetto dei criteri tecnici, coerenza con il principio del &lt;em&gt;true and fair view&lt;/em&gt;, interesse pubblico europeo). Secondo BDO l&#x27;UE ha omologato l&#x27;IFRS 18 il 13 febbraio 2026, con efficacia dal 1° gennaio 2027; questo dato non è stato verificato su EUR-Lex. &lt;b&gt;Perché conta:&lt;/b&gt; per le società quotate europee lo standard si applica solo dopo l&#x27;omologazione.&lt;/p&gt;
      &lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-submits-to-the-european-commission-its-endorsement-advice-on-ifrs-18-presentation-and&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG – endorsement advice&lt;/a&gt; · &lt;a href=&quot;https://www.bdo.global/en-gb/news/ifrs-news/the-european-union-endorses-ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO – EU endorses IFRS 18&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Expenses by function: IFRS 18 par. 83&lt;/h4&gt;
      &lt;p&gt;Chi presenta i costi operativi per funzione deve indicare in un&#x27;unica nota ammortamenti, amortisation, benefici ai dipendenti, impairment e svalutazioni del magazzino per ogni voce per funzione; un&#x27;agenda decision IFRIC di aprile 2026 ne ha chiarito l&#x27;ambito. &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;evoluzione di IAS 1.104 citato nelle slide.&lt;/p&gt;
      &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/more-disclosure-when-presenting-operating-expenses-by-function-under-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO Australia – disclosure by function&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;src&quot;&gt;Le slide non citano autori o articoli accademici: i riferimenti sono tutti a standard e documenti IASB. I collegamenti ad altre lezioni del corso si basano solo sui rimandi interni a questa presentazione.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;&lt;b&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/b&gt;&lt;/p&gt;
  &lt;p&gt;Fonte principale: &lt;em&gt;02 – IFRS 18 – Presentation of Financial Statements&lt;/em&gt;, Prof. Roberto Aprile, Università degli Studi di Bergamo, A.A. 2026-2027 (104 slide). Le parti segnate &quot;fonte esterna&quot; provengono dal web e sono indicate con il link.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var bs=t.querySelectorAll(&#x27;.tablist button&#x27;),ps=t.querySelectorAll(&#x27;:scope &gt; .panel&#x27;);
    bs.forEach(function(b,i){
      b.setAttribute(&#x27;aria-selected&#x27;,i===0?&#x27;true&#x27;:&#x27;false&#x27;);
      b.addEventListener(&#x27;click&#x27;,function(){
        bs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;)});

  document.querySelectorAll(&#x27;.reveal&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){

      b.textContent=q.classList.contains(&#x27;open&#x27;)?&#x27;Nascondi&#x27;:&#x27;Mostra risposta&#x27;;
    });
  });
  // mcq
  document.querySelectorAll(&#x27;.mcq&#x27;).forEach(function(m){
    var fb=m.querySelector(&#x27;.fb&#x27;);
    m.querySelectorAll(&#x27;.opts button&#x27;).forEach(function(b){
      b.addEventListener(&#x27;click&#x27;,function(){
        var ok=b.hasAttribute(&#x27;data-ok&#x27;);
        b.classList.add(ok?&#x27;ok&#x27;:&#x27;ko&#x27;);
        if(ok){m.querySelectorAll(&#x27;.opts button&#x27;).forEach(function(x){x.disabled=true});}
        fb.textContent=ok?&#x27;✓ Corretto. &#x27;+(m.dataset.why||&#x27;&#x27;):&#x27;✗ Non è questa: riprova.&#x27;;
      });
    });
  });
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),pv=s.querySelector(&#x27;.prev&#x27;),nx=s.querySelector(&#x27;.next&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function go(n){i=Math.max(0,Math.min(st.length-1,n));st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j===i)});pv.disabled=i===0;nx.disabled=i===st.length-1;}
    pv.addEventListener(&#x27;click&#x27;,function(){go(i-1)});nx.addEventListener(&#x27;click&#x27;,function(){go(i+1)});go(0);
  });
  // progress + nav
  var prog=document.getElementById(&#x27;prog&#x27;),links=[].slice.call(document.querySelectorAll(&#x27;nav.top a&#x27;)),secs=links.map(function(a){return document.querySelector(a.getAttribute(&#x27;href&#x27;))});
  function onScroll(){

    var cur=-1;secs.forEach(function(s,k){if(s&amp;&amp;s.getBoundingClientRect().top&lt;120)cur=k});
    links.forEach(function(a,k){a.classList.toggle(&#x27;on&#x27;,k===cur)});
  }
  window.addEventListener(&#x27;scroll&#x27;,onScroll,{passive:true});onScroll();
  window.__ifrs=window.__ifrs||[];window.__ifrs.forEach(function(f){f()});
})();
