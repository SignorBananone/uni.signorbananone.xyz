  &lt;h1&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Dallo IAS 1 al nuovo standard: che cosa resta, che cosa cambia, e perché conta.&lt;/p&gt;
  &lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&lt;b&gt;Corso&lt;/b&gt; Master Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;&lt;b&gt;Docente&lt;/b&gt; Prof. Roberto Aprile&lt;/span&gt;&lt;span&gt;&lt;b&gt;Sede&lt;/b&gt; Università degli Studi di Bergamo – Dip. di Scienze Aziendali&lt;/span&gt;&lt;span&gt;&lt;b&gt;A.A.&lt;/b&gt; 2026-2027&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot; style=&quot;margin-top:1.6rem&quot;&gt;Le slide procedono quasi sempre per &lt;b&gt;coppie&lt;/b&gt;: un paragrafo dello &lt;span class=&quot;term&quot;&gt;IAS 1&lt;/span&gt; (in blu nel materiale) accanto al paragrafo corrispondente dell&#x27;&lt;span class=&quot;term&quot;&gt;IFRS 18&lt;/span&gt; (in rosso), con un verdetto in verde: &lt;em&gt;exactly the same content&lt;/em&gt;, &lt;em&gt;same meaning&lt;/em&gt;, &lt;em&gt;slight changes&lt;/em&gt;, &lt;em&gt;there are differences&lt;/em&gt;. Questo canvas segue lo stesso schema, ma spiega in italiano ciò che sta dietro ai testi normativi e segnala con chiarezza dove la sostanza cambia davvero.&lt;/p&gt;
  &lt;div class=&quot;box&quot; style=&quot;margin-top:1.4rem&quot;&gt;
    &lt;b&gt;Come leggere questa pagina.&lt;/b&gt; I riquadri blu/rossi affiancati confrontano &lt;span style=&quot;color:var(--ias);font-weight:600&quot;&gt;IAS 1&lt;/span&gt; e &lt;span style=&quot;color:var(--ifrs);font-weight:600&quot;&gt;IFRS 18&lt;/span&gt;. Le etichette
    &lt;span class=&quot;verdict v-same&quot;&gt;identico&lt;/span&gt; &lt;span class=&quot;verdict v-mean&quot;&gt;stesso significato&lt;/span&gt; &lt;span class=&quot;verdict v-diff&quot;&gt;differenze&lt;/span&gt; riprendono il giudizio delle slide.
    I riquadri tratteggiati con &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt; contengono informazioni prese dal web, &lt;b&gt;non&lt;/b&gt; dalle slide. In fondo a ogni parte c&#x27;è un&#x27;autoverifica.

  &lt;p class=&quot;src&quot; style=&quot;margin-bottom:1rem&quot;&gt;Clicca un nodo per saltare alla sezione. I colori indicano le quattro parti: &lt;span style=&quot;color:var(--sage)&quot;&gt;quadro e lessico&lt;/span&gt;, &lt;span style=&quot;color:var(--ochre)&quot;&gt;principi generali&lt;/span&gt;, &lt;span style=&quot;color:var(--slate)&quot;&gt;situazione patrimoniale&lt;/span&gt;, &lt;span style=&quot;color:var(--brick)&quot;&gt;performance, equity, cassa e note&lt;/span&gt;.&lt;/p&gt;

&lt;!-- PARTE A --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte A · Quadro&lt;/span&gt;
  &lt;h2&gt;1 · Dallo IAS 1 all&#x27;IFRS 18: obiettivo, ambito, complete set&lt;/h2&gt;

  &lt;p&gt;Lo &lt;span class=&quot;term&quot;&gt;IAS 1 Presentation of Financial Statements&lt;/span&gt; è lo standard &quot;cornice&quot; del bilancio IFRS: non dice &lt;em&gt;come&lt;/em&gt; valutare un magazzino o un leasing (quello lo fanno gli altri standard), ma &lt;b&gt;come presentare&lt;/b&gt; il bilancio nel suo insieme: quali prospetti, che struttura, quale contenuto minimo, e alcuni concetti trasversali come &lt;span class=&quot;term&quot;&gt;going concern&lt;/span&gt; (continuità aziendale), &lt;span class=&quot;term&quot;&gt;accrual basis&lt;/span&gt; (principio di competenza) e la distinzione &lt;span class=&quot;term&quot;&gt;current/non-current&lt;/span&gt; (corrente/non corrente).&lt;/p&gt;

  &lt;h3&gt;Obiettivo (par. 1)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.1&lt;/h5&gt;Lo standard &lt;b&gt;prescribes&lt;/b&gt; la base per la presentazione dei &lt;span class=&quot;term&quot;&gt;general purpose financial statements&lt;/span&gt; (bilanci &quot;a scopo generale&quot;, destinati a una platea ampia di utilizzatori, non a un destinatario specifico), per garantire &lt;b&gt;comparabilità&lt;/b&gt; nel tempo e con altre entità. Fissa requisiti di presentazione, linee guida sulla struttura e contenuto minimo.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.1&lt;/h5&gt;Lo standard &lt;b&gt;sets out requirements&lt;/b&gt; per la &lt;b&gt;presentation&lt;/b&gt; e la &lt;b&gt;disclosure&lt;/b&gt; (informativa, tipicamente nelle note) delle informazioni nei bilanci, perché forniscano &lt;b&gt;informazioni rilevanti&lt;/b&gt; che rappresentino fedelmente attività, passività, patrimonio netto, ricavi e costi.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning&lt;/span&gt;
  &lt;p&gt;Due sfumature da notare: l&#x27;IFRS 18 nomina esplicitamente la &lt;b&gt;disclosure&lt;/b&gt; accanto alla presentation (lo dice anche il titolo: &lt;em&gt;Presentation and Disclosure&lt;/em&gt;), e aggancia l&#x27;obiettivo alle due qualità fondamentali del &lt;span class=&quot;term&quot;&gt;Conceptual Framework&lt;/span&gt;: &lt;span class=&quot;term&quot;&gt;relevance&lt;/span&gt; (pertinenza) e &lt;span class=&quot;term&quot;&gt;faithful representation&lt;/span&gt; (rappresentazione fedele).&lt;/p&gt;

  &lt;h3&gt;Ambito (par. 2-8)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.2-3&lt;/h5&gt;Si applica nel &lt;b&gt;preparing&lt;/b&gt; e presenting i general purpose financial statements conformi agli IFRS. Gli altri IFRS disciplinano rilevazione, valutazione e informativa di specifiche operazioni.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.2, 18.4&lt;/h5&gt;Si applica nel presenting e &lt;b&gt;disclosing&lt;/b&gt; informazioni nei bilanci redatti secondo gli IFRS Accounting Standards. Gli altri IFRS disciplinano rilevazione, valutazione, &lt;b&gt;presentazione&lt;/b&gt; e informativa.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning&lt;/span&gt;

  &lt;h3&gt;A che cosa serve il bilancio (par. 9)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.9&lt;/h5&gt;Rappresentazione strutturata della &lt;span class=&quot;term&quot;&gt;financial position&lt;/span&gt; (situazione patrimoniale-finanziaria) e della &lt;span class=&quot;term&quot;&gt;financial performance&lt;/span&gt; (risultato economico), con le informazioni su &lt;span class=&quot;term&quot;&gt;cash flows&lt;/span&gt;, utili a &lt;b&gt;un&#x27;ampia gamma di utilizzatori&lt;/b&gt; per prendere decisioni economiche. Insieme alle note aiuta a prevedere i flussi di cassa futuri, i loro &lt;em&gt;tempi&lt;/em&gt; e la loro &lt;em&gt;certezza&lt;/em&gt;.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.9&lt;/h5&gt;Fornire informazioni su attività, passività, patrimonio netto, ricavi e costi utili per valutare (1) le &lt;b&gt;prospettive di flussi di cassa netti futuri in entrata&lt;/b&gt; e (2) la &lt;span class=&quot;term&quot;&gt;stewardship&lt;/span&gt; del management, cioè quanto bene il management amministra le risorse economiche affidategli.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning of IAS 1.9&lt;/span&gt;

  &lt;h3&gt;Il complete set of financial statements (par. 10-14)&lt;/h3&gt;
  &lt;p&gt;Clicca sui prospetti per vedere che cosa rispondono, e confronta l&#x27;elenco nei due standard.&lt;/p&gt;

          &lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Changes&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;in equity&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Perché è cambiato&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;il patrimonio&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;dei soci?&lt;/text&gt;
          &lt;rect x=&quot;520&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Cash&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;flows&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Da dove è entrata&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;e dove è uscita&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;la cassa?&lt;/text&gt;
          &lt;rect x=&quot;690&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;770&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Notes&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Come leggo e&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;scompongo i&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;numeri sopra?&lt;/text&gt;
        &lt;/g&gt;
        &lt;text x=&quot;430&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;+ comparative information (esercizio precedente) · + eventuale 3° statement of financial position&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;verdict v-same&quot;&gt;The complete set remains the same&lt;/span&gt; L&#x27;unica novità di forma: l&#x27;IFRS 18 elenca per primo lo &lt;span class=&quot;term&quot;&gt;statement of financial performance&lt;/span&gt;, nome che copre sia il prospetto unico di profit or loss e OCI sia i due prospetti separati.&lt;/p&gt;

  &lt;h4&gt;Titoli dei prospetti e scelta &quot;uno o due prospetti&quot;&lt;/h4&gt;
  &lt;p&gt;Lo IAS 1.10 permette di usare &lt;b&gt;titoli diversi&lt;/b&gt; (es. &quot;statement of comprehensive income&quot;). Per la performance, IAS 1.10A e IFRS 18.12 offrono la stessa scelta, illustrata qui sotto. &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Approccio a un prospetto o a due prospetti&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;text x=&quot;200&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;(a) Single statement&lt;/text&gt;
      &lt;rect x=&quot;80&quot; y=&quot;32&quot; width=&quot;240&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;92&quot; y=&quot;44&quot; width=&quot;216&quot; height=&quot;80&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Sezione profit or loss&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;(prima)&lt;/text&gt;
      &lt;rect x=&quot;92&quot; y=&quot;130&quot; width=&quot;216&quot; height=&quot;52&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Sezione OCI (subito dopo)&lt;/text&gt;
      &lt;text x=&quot;630&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;(b) Two statements&lt;/text&gt;
      &lt;rect x=&quot;470&quot; y=&quot;32&quot; width=&quot;150&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Statement of&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;profit or loss&lt;/text&gt;
      &lt;path d=&quot;M625,112 L660,112&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;rect x=&quot;665&quot; y=&quot;32&quot; width=&quot;170&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Statement of&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;comprehensive income&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inizia con&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;profit or loss&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;+ OCI&lt;/text&gt;
      &lt;text x=&quot;645&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;il primo precede immediatamente il secondo&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;h4&gt;Che cosa sta &lt;em&gt;fuori&lt;/em&gt; dal bilancio&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Financial review by management&lt;/b&gt; (IAS 1.13 ↔ IFRS 18.8). Una relazione del management, &lt;b&gt;separata&lt;/b&gt; dal bilancio, che spiega le caratteristiche principali di performance e posizione finanziaria e le principali &lt;b&gt;incertezze&lt;/b&gt;. Può trattare: i fattori che influenzano la performance (ambiente, risposta dell&#x27;impresa, politica di investimento e dei dividendi); le fonti di finanziamento e il rapporto obiettivo tra debito e patrimonio; le risorse &lt;b&gt;non&lt;/b&gt; rilevate in bilancio secondo gli IFRS. &lt;br&gt;&lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; In Italia è, in sostanza, il ruolo della relazione sulla gestione.&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Environmental reports e value added statements&lt;/b&gt; (IAS 1.14). Rapporti ambientali e prospetti del valore aggiunto, frequenti nei settori in cui i fattori ambientali pesano o quando i dipendenti sono un gruppo di utilizzatori importante. &lt;br&gt;&lt;b&gt;Tutto ciò che è presentato fuori dal bilancio è fuori dallo scope degli IFRS.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte A&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Da quale data l&#x27;IFRS 18 sostituisce lo IAS 1, e da quando era in vigore lo IAS 1 nella versione 2007? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;IFRS 18: periodi annuali dal &lt;b&gt;1° gennaio 2027&lt;/b&gt;. IAS 1 (riemesso a settembre 2007): periodi dal &lt;b&gt;1° gennaio 2009&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Quali due finalità aggiunge esplicitamente l&#x27;IFRS 18.9 rispetto alla formulazione dello IAS 1.9? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Valutare le &lt;b&gt;prospettive di flussi di cassa netti futuri in entrata&lt;/b&gt; e valutare la &lt;b&gt;stewardship&lt;/b&gt; del management sulle risorse economiche. Le slide giudicano comunque il significato &quot;substantially the same&quot;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Quale di questi documenti rientra nello scope degli IFRS?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;La financial review by management&lt;/button&gt;&lt;button data-ok&gt;Le notes&lt;/button&gt;&lt;button&gt;Il value added statement&lt;/button&gt;&lt;button&gt;L&#x27;environmental report&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Il complete set cambia passando all&#x27;IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: le slide concludono &quot;the complete set of financial statements remains the same&quot;. Cambia il nome del prospetto della performance (&lt;em&gt;statement(s) of financial performance&lt;/em&gt;), che viene elencato per primo.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE B --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte B · Principi generali&lt;/span&gt;
  &lt;h2&gt;2 · Basis of preparation: fair presentation, going concern, accrual&lt;/h2&gt;
  &lt;p&gt;Nello IAS 1 questi principi erano ai par. 15-28; nelle slide il corrispettivo IFRS 18 è indicato come &lt;b&gt;&quot;Basis of preparation – General matters&quot;, par. 6A-6N&lt;/b&gt;, con contenuto &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Dove stanno davvero questi paragrafi? Con l&#x27;emissione dell&#x27;IFRS 18 la IASB ha spostato fair presentation e compliance, going concern, accrual basis e informativa sulle policy dallo IAS 1 allo &lt;b&gt;IAS 8&lt;/b&gt;, ribattezzato &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt;. Lo conferma anche una slide del corso (IFRS 18.B112), che rimanda a &quot;paragraph 6B of IAS 8&quot; per lo statement of compliance. Quindi &quot;6A-6N&quot; va letto come &lt;b&gt;IAS 8.6A-6N&lt;/b&gt; nella versione modificata dall&#x27;IFRS 18. Fonte: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 8 Basis of Preparation of Financial Statements&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Fair presentation and compliance with IFRSs&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Fair presentation&lt;/b&gt; (IAS 1.15) — il bilancio deve rappresentare &lt;em&gt;fairly&lt;/em&gt; posizione finanziaria, performance e flussi di cassa. Significa rappresentare fedelmente gli effetti di operazioni, eventi e condizioni secondo le &lt;b&gt;definizioni e i criteri di rilevazione&lt;/b&gt; di attività, passività, ricavi e costi del &lt;span class=&quot;term&quot;&gt;Conceptual Framework for Financial Reporting&lt;/span&gt; (il documento concettuale della IASB che fissa obiettivi e concetti di base del bilancio). Si &lt;b&gt;presume&lt;/b&gt; che applicare gli IFRS, con informativa aggiuntiva se serve, produca una fair presentation.&lt;/div&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Dichiarazione di conformità&lt;/b&gt; (IAS 1.16 ↔ 6A-6B): chi rispetta gli IFRS lo dichiara nelle note in modo &lt;b&gt;esplicito e senza riserve&lt;/b&gt;; non si può dire &quot;conforme agli IFRS&quot; se non si rispettano &lt;b&gt;tutti&lt;/b&gt; i requisiti.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Le note non sanano gli errori&lt;/b&gt; (IAS 1.18 ↔ 6D): una policy contabile inappropriata non si rettifica spiegandola nelle note.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Departure&lt;/b&gt; (deroga, IAS 1.19 ↔ 6E): in circostanze &lt;b&gt;estremamente rare&lt;/b&gt;, se applicare una norma fosse così fuorviante da contrastare con l&#x27;obiettivo del bilancio fissato dal Conceptual Framework, l&#x27;entità &lt;b&gt;deve&lt;/b&gt; derogare, se il quadro regolamentare lo richiede o non lo vieta.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;b&gt;Che cosa deve dire chi deroga?&lt;/b&gt; Scorri i passi (IAS 1.20 ↔ IFRS 18.6F, &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same content&lt;/span&gt;).&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Passo 0 · Il presupposto&lt;/h4&gt;&lt;p&gt;Il management conclude che applicare un requisito IFRS sarebbe &lt;b&gt;così fuorviante&lt;/b&gt; da contrastare con l&#x27;obiettivo del bilancio. È un caso eccezionale, non una scappatoia: la regola resta l&#x27;applicazione degli IFRS.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(a) Fair presentation&lt;/h4&gt;&lt;p&gt;Che il management ha concluso che il bilancio rappresenta fairly posizione finanziaria, performance e flussi di cassa.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(b) Conformità con eccezione&lt;/h4&gt;&lt;p&gt;Che l&#x27;entità ha rispettato gli IFRS applicabili &lt;b&gt;tranne&lt;/b&gt; un requisito specifico, da cui ha derogato per ottenere la fair presentation.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(c) Che cosa, perché, come&lt;/h4&gt;&lt;p&gt;Il titolo dell&#x27;IFRS derogato, la natura della deroga, il trattamento che l&#x27;IFRS avrebbe richiesto, il &lt;b&gt;motivo&lt;/b&gt; per cui sarebbe stato fuorviante e il trattamento adottato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(d) L&#x27;effetto numerico&lt;/h4&gt;&lt;p&gt;Per ogni periodo presentato, l&#x27;&lt;b&gt;effetto finanziario&lt;/b&gt; della deroga su ogni voce che sarebbe stata riportata applicando il requisito.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Deroghe passate&lt;/h4&gt;&lt;p&gt;Se una deroga di un periodo &lt;b&gt;precedente&lt;/b&gt; influenza ancora gli importi del periodo corrente, vanno date le informazioni (c) e (d) (IAS 1.21 ↔ IFRS 18.6G, &lt;span class=&quot;verdict v-same&quot;&gt;same content&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Going concern&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Going concern&lt;/b&gt; (continuità aziendale) — il Conceptual Framework (par. 3.9) nota che il bilancio si redige normalmente assumendo che l&#x27;entità &lt;b&gt;continuerà a operare nel prevedibile futuro&lt;/b&gt;. Per questo le attività si valutano in funzione dell&#x27;uso, non del prezzo di una vendita forzata.&lt;/div&gt;
  &lt;p&gt;IAS 1.25 ↔ IFRS 18 &quot;6K-6L&quot; &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same content&lt;/span&gt;. Prova il percorso decisionale:&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;gc&quot;&gt;
    &lt;h4&gt;Albero decisionale del management&lt;/h4&gt;
    &lt;div id=&quot;gc-q&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;btnrow&quot; id=&quot;gc-b&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;gc-r&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var Q={
      s:{q:&#x27;Il management intende liquidare l\&#x27;entità o cessare l\&#x27;attività, oppure non ha alternative realistiche a farlo?&#x27;,a:[[&#x27;Sì&#x27;,&#x27;nogc&#x27;],[&#x27;No&#x27;,&#x27;u&#x27;]]},
      u:{q:&#x27;Nel valutare la continuità, il management è a conoscenza di incertezze significative (material uncertainties) su eventi o condizioni che possono far sorgere dubbi significativi sulla capacità di continuare?&#x27;,a:[[&#x27;Sì&#x27;,&#x27;mu&#x27;],[&#x27;No&#x27;,&#x27;ok&#x27;]]},
      nogc:{r:&#x27;Bilancio &lt;b&gt;non&lt;/b&gt; su base going concern. Va indicato questo fatto, la &lt;b&gt;base&lt;/b&gt; di redazione usata e il &lt;b&gt;motivo&lt;/b&gt; per cui l\&#x27;entità non è considerata in funzionamento.&#x27;,c:&#x27;cur&#x27;},
      mu:{r:&#x27;Bilancio su base going concern, ma con &lt;b&gt;informativa sulle incertezze&lt;/b&gt; significative.&#x27;,c:&#x27;nc&#x27;},
      ok:{r:&#x27;Bilancio su base going concern, senza informativa specifica.&#x27;,c:&#x27;nc&#x27;}
    };
    var q=document.getElementById(&#x27;gc-q&#x27;),b=document.getElementById(&#x27;gc-b&#x27;),r=document.getElementById(&#x27;gc-r&#x27;);
    function show(k){var n=Q[k];b.innerHTML=&#x27;&#x27;;r.innerHTML=&#x27;&#x27;;
      if(n.q){q.innerHTML=&#x27;&lt;p&gt;&#x27;+n.q+&#x27;&lt;/p&gt;&#x27;;n.a.forEach(function(x){var e=document.createElement(&#x27;button&#x27;);e.className=&#x27;btn&#x27;;e.textContent=x[0];e.onclick=function(){show(x[1])};b.appendChild(e)});}
      else{q.innerHTML=&#x27;&#x27;;r.innerHTML=&#x27;&lt;div class=&quot;result &#x27;+n.c+&#x27;&quot;&gt;&#x27;+n.r+&#x27;&lt;/div&gt;&#x27;;var e=document.createElement(&#x27;button&#x27;);e.className=&#x27;btn&#x27;;e.textContent=&#x27;↺ Ricomincia&#x27;;e.onclick=function(){show(&#x27;s&#x27;)};b.appendChild(e);}
    }
    show(&#x27;s&#x27;);
  })();
  &lt;/script&gt;
  &lt;p class=&quot;src&quot;&gt;Il primo passo è sempre lo stesso: preparando il bilancio, il management &lt;b&gt;deve&lt;/b&gt; valutare la capacità dell&#x27;entità di continuare in funzionamento (IAS 1.25).&lt;/p&gt;

  &lt;h3&gt;Accrual basis of accounting&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Accrual basis&lt;/b&gt; (competenza economica) — IAS 1.27 ↔ IFRS 18 &quot;6M&quot;: il bilancio si redige per competenza, &lt;b&gt;tranne le informazioni sui flussi di cassa&lt;/b&gt;. Ricavi e costi si imputano al periodo in cui avvengono le operazioni, non a quello dell&#x27;incasso o del pagamento.&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Esempio.&lt;/b&gt; A dicembre 2026 l&#x27;impresa vende merce per 100 con incasso a febbraio 2027. Per competenza il ricavo di 100 è del &lt;b&gt;2026&lt;/b&gt; (sorge un credito); nel cash flow statement l&#x27;incasso di 100 comparirà nel &lt;b&gt;2027&lt;/b&gt;. È per questo che il cash flow statement è l&#x27;unica eccezione.&lt;/div&gt;

  &lt;h3&gt;Consistency of presentation (par. 45-46)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.45&lt;/h5&gt;Si mantengono &lt;b&gt;presentazione e classificazione&lt;/b&gt; delle voci da un periodo all&#x27;altro, salvo che (a) dopo un cambiamento significativo dell&#x27;attività o una revisione del bilancio un&#x27;altra presentazione sia più appropriata secondo i criteri dello IAS 8, o (b) un IFRS richieda il cambiamento.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.45&lt;/h5&gt;Si mantengono presentazione, &lt;mark&gt;disclosure&lt;/mark&gt; e classificazione, con le stesse due eccezioni; il rimando è allo &quot;IAS 8 &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt;&quot; (v. B12).&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;La coerenza ora copre esplicitamente anche l&#x27;informativa nelle note.&lt;/span&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte B · Principi generali&lt;/span&gt;
  &lt;h2&gt;3 · Materiality, aggregation e offsetting&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Material information&lt;/b&gt; (IAS 1.7 = IFRS 18.B1 e Appendix A) — un&#x27;informazione è &lt;span class=&quot;term&quot;&gt;material&lt;/span&gt; (rilevante) se &lt;b&gt;omettere&lt;/b&gt;, &lt;b&gt;esporre in modo errato&lt;/b&gt; o &lt;b&gt;oscurare&lt;/b&gt; quell&#x27;informazione potrebbe ragionevolmente influenzare le decisioni che i &lt;span class=&quot;term&quot;&gt;primary users&lt;/span&gt; (investitori, finanziatori e altri creditori, attuali e potenziali) prendono sulla base di quel bilancio.&lt;/div&gt;
  &lt;span class=&quot;verdict v-same&quot;&gt;Kept the same definition&lt;/span&gt;

  &lt;svg viewBox=&quot;0 0 860 170&quot; role=&quot;img&quot; aria-label=&quot;Tre modi di rendere un&#x27;informazione inutilizzabile&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Omitting&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;l&#x27;informazione non c&#x27;è&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;es. manca un contenzioso&lt;/text&gt;
      &lt;rect x=&quot;305&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Misstating&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;c&#x27;è, ma è sbagliata&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;es. importo errato&lt;/text&gt;
      &lt;rect x=&quot;590&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;715&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Obscuring&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;c&#x27;è, ma è nascosta&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;es. sepolta tra dettagli inutili&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;430&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;in tutti e tre i casi conta l&#x27;effetto possibile sulle decisioni dei primary users&lt;/text&gt;
  &lt;/svg&gt;

  &lt;p&gt;&lt;b&gt;IFRS 18.B4&lt;/b&gt; aggiunge che per valutare la materialità bisogna considerare le &lt;b&gt;caratteristiche degli utilizzatori&lt;/b&gt; &lt;em&gt;e&lt;/em&gt; le &lt;b&gt;circostanze proprie dell&#x27;entità&lt;/b&gt;. La materialità quindi non è una soglia numerica fissa: dipende da chi legge e dal contesto (natura e importo insieme).&lt;/p&gt;

  &lt;h3&gt;Aggregation: che cosa va mostrato separatamente&lt;/h3&gt;
  &lt;p&gt;IAS 1.29: si presenta separatamente &lt;b&gt;ogni classe material di voci simili&lt;/b&gt;; le voci di &lt;b&gt;natura o funzione diversa&lt;/b&gt; si presentano separatamente salvo che siano immaterial. Le definizioni dell&#x27;IFRS 18 (Appendix A) rendono il meccanismo esplicito:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Classification&lt;/b&gt; — ordinare attività, passività, equity, ricavi, costi e flussi di cassa in base a &lt;b&gt;caratteristiche condivise&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Aggregation&lt;/b&gt; — &lt;b&gt;sommare&lt;/b&gt; elementi che condividono caratteristiche e stanno nella stessa classificazione.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Disaggregation&lt;/b&gt; — &lt;b&gt;separare&lt;/b&gt; una voce in componenti con caratteristiche &lt;b&gt;non&lt;/b&gt; condivise.&lt;/div&gt;
    &lt;div class=&quot;box tint&quot; style=&quot;margin:1rem 0&quot;&gt;&lt;b&gt;Regola pratica.&lt;/b&gt; Si aggrega ciò che si somiglia, si disaggrega ciò che è diverso, fino al punto in cui l&#x27;informazione resta material senza diventare &quot;rumore&quot;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sim&quot; id=&quot;agg&quot;&gt;
    &lt;h4&gt;Prova: aggregare o disaggregare?&lt;/h4&gt;
    &lt;p style=&quot;font-size:.92rem&quot;&gt;Cinque crediti da 20 a 400. Sposta la soglia di materialità (giudizio dell&#x27;entità) e guarda come cambia la presentazione: le voci sotto soglia e di natura simile confluiscono in &quot;other receivables&quot;.&lt;/p&gt;
    &lt;label for=&quot;agg-r&quot;&gt;Soglia di materialità: &lt;b id=&quot;agg-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;agg-r&quot; min=&quot;10&quot; max=&quot;450&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;
    &lt;svg viewBox=&quot;0 0 820 200&quot; id=&quot;agg-svg&quot; role=&quot;img&quot; aria-label=&quot;Grafico di aggregazione&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;src&quot;&gt;Esempio didattico costruito per questo riassunto (numeri inventati). Nella realtà la materialità considera anche la natura della voce, non solo l&#x27;importo: un credito verso parti correlate può essere material anche se piccolo.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var items=[[&#x27;Trade receivables&#x27;,400,&#x27;t&#x27;],[&#x27;Receivables from related parties&#x27;,35,&#x27;r&#x27;],[&#x27;Prepayments&#x27;,60,&#x27;p&#x27;],[&#x27;Other: deposits&#x27;,20,&#x27;o&#x27;],[&#x27;Other: tax refunds&#x27;,45,&#x27;o&#x27;]];
    var r=document.getElementById(&#x27;agg-r&#x27;),v=document.getElementById(&#x27;agg-v&#x27;),s=document.getElementById(&#x27;agg-svg&#x27;);
    function draw(){var th=+r.value;v.textContent=th;var shown=[],other=0;
      items.forEach(function(it){if(it[1]&gt;=th||it[2]===&#x27;r&#x27;)shown.push(it);else other+=it[1]});
      if(other)shown.push([&#x27;Other receivables (aggregato)&#x27;,other,&#x27;agg&#x27;]);
      var h=&#x27;&#x27;;shown.forEach(function(it,i){var y=12+i*31,w=it[1]*1.1;var c=it[2]===&#x27;agg&#x27;?&#x27;var(--ochre)&#x27;:it[2]===&#x27;r&#x27;?&#x27;var(--brick)&#x27;:&#x27;var(--slate)&#x27;;
        h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12.5&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;240&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;&#x27;+c+&#x27;&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;&#x27;+(246+w)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12.5&quot;&gt;&#x27;+it[1]+&#x27;&lt;/text&gt;&#x27;;});
      h+=&#x27;&lt;line x1=&quot;&#x27;+(240+th*1.1)+&#x27;&quot; y1=&quot;0&quot; x2=&quot;&#x27;+(240+th*1.1)+&#x27;&quot; y2=&quot;195&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&#x27;;
      s.innerHTML=h;}
    r.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;h3&gt;Disclosure &quot;obbligatorie&quot; ma non material&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.31&lt;/h5&gt;Non serve fornire una disclosure richiesta da un IFRS se l&#x27;informazione &lt;b&gt;non è material&lt;/b&gt;, anche se l&#x27;IFRS la elenca come requisito minimo. Viceversa, si valuta se dare &lt;b&gt;informazioni aggiuntive&lt;/b&gt; quando i requisiti specifici non bastano a far capire l&#x27;impatto di operazioni, eventi e condizioni.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.19-20&lt;/h5&gt;Stesso principio, esteso a &lt;b&gt;presentation&lt;/b&gt; nei primary financial statements &lt;b&gt;e&lt;/b&gt; disclosure nelle note: niente obbligo se non material; informazioni aggiuntive se la compliance non basta.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.31&lt;/span&gt;
  &lt;p&gt;La materialità funziona quindi in &lt;b&gt;due direzioni&lt;/b&gt;: toglie ciò che è superfluo (anche se &quot;richiesto&quot;) e aggiunge ciò che manca (anche se &quot;non richiesto&quot;).&lt;/p&gt;

  &lt;h3&gt;Offsetting&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Offsetting&lt;/b&gt; (compensazione) — IAS 1.32 ↔ IFRS 18.44: &lt;b&gt;non&lt;/b&gt; si compensano attività con passività, né ricavi con costi, salvo che un IFRS lo richieda o lo permetta (IFRS 18 rimanda a B27-B28).&lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Perché conta.&lt;/b&gt; Un credito di 500 verso un cliente e un debito di 450 verso lo stesso soggetto, mostrati come &quot;credito netto 50&quot;, nascondono l&#x27;esposizione reale: il lettore vedrebbe 50 invece di un rischio di credito su 500 e un&#x27;obbligazione di 450.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte B · Principi generali&lt;/span&gt;
  &lt;h2&gt;4 · Comparative information, identificazione, frequenza&lt;/h2&gt;

  &lt;h3&gt;Comparative information&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.38 / 38A&lt;/h5&gt;Salvo diversa previsione, informazioni comparative dell&#x27;esercizio precedente per &lt;b&gt;tutti gli importi&lt;/b&gt;; per le informazioni narrative, se &lt;b&gt;relevant&lt;/b&gt;. Minimo: &lt;b&gt;due&lt;/b&gt; statement of financial position, due prospetti di P&amp;amp;L e OCI (o due P&amp;amp;L separati), due cash flow statement, due statement of changes in equity, e note collegate.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.31-32&lt;/h5&gt;Comparativi per tutti gli importi; per le informazioni narrative se &lt;mark&gt;necessary&lt;/mark&gt; per capire il bilancio corrente (v. B13). Si presentano periodo corrente e precedente in &lt;b&gt;ogni&lt;/b&gt; primary financial statement e nelle note (comparativi aggiuntivi: B14-B15).&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Nella slide il secondo titolo è &quot;IAS 1 – Comparative information&quot; ma il testo e il rimando sono quelli dell&#x27;IFRS 18.32.&lt;/span&gt;

  &lt;h3&gt;Il terzo statement of financial position&lt;/h3&gt;
  &lt;p&gt;IAS 1.40A ↔ IFRS 18.37: si aggiunge uno statement of financial position &lt;b&gt;all&#x27;inizio dell&#x27;esercizio precedente&lt;/b&gt; quando si verificano &lt;b&gt;entrambe&lt;/b&gt; le condizioni. Attiva le due caselle:&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;tsfp&quot;&gt;
    &lt;div class=&quot;cls&quot;&gt;
      &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;t1&quot;&gt; (a) l&#x27;entità applica una accounting policy &lt;b&gt;retrospectively&lt;/b&gt;, fa un &lt;b&gt;retrospective restatement&lt;/b&gt; o &lt;b&gt;riclassifica&lt;/b&gt; voci&lt;/label&gt;
      &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;t2&quot;&gt; (b) l&#x27;effetto sull&#x27;informazione nello SFP di apertura dell&#x27;esercizio precedente è &lt;b&gt;material&lt;/b&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 150&quot; role=&quot;img&quot; aria-label=&quot;Prospetti da presentare&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;120&quot; x2=&quot;780&quot; y2=&quot;120&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g font-size=&quot;12.5&quot;&gt;
        &lt;text x=&quot;140&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;1/1/2025&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;31/12/2025&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;31/12/2026&lt;/text&gt;
        &lt;g id=&quot;t3&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3° SFP&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;apertura anno prec.&lt;/text&gt;&lt;/g&gt;
        &lt;rect x=&quot;350&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;SFP comparativo&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;anno precedente&lt;/text&gt;
        &lt;rect x=&quot;630&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;SFP corrente&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;bilancio 2026&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;t-out&quot; class=&quot;result&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var a=document.getElementById(&#x27;t1&#x27;),b=document.getElementById(&#x27;t2&#x27;),g=document.getElementById(&#x27;t3&#x27;),o=document.getElementById(&#x27;t-out&#x27;);
    function f(){var on=a.checked&amp;&amp;b.checked;g.style.opacity=on?1:.15;o.className=&#x27;result &#x27;+(on?&#x27;cur&#x27;:&#x27;nc&#x27;);
      o.innerHTML=on?&#x27;Servono &lt;b&gt;tre&lt;/b&gt; statement of financial position.&lt;small&gt;Entrambe le condizioni sono soddisfatte (IFRS 18.37).&lt;/small&gt;&#x27;:&#x27;Bastano &lt;b&gt;due&lt;/b&gt; statement of financial position (corrente e comparativo).&lt;small&gt;&#x27;+(a.checked?&#x27;C\&#x27;è un cambiamento retroattivo, ma senza effetto material sull\&#x27;apertura.&#x27;:&#x27;Nessuna applicazione retroattiva, restatement o riclassifica.&#x27;)+&#x27;&lt;/small&gt;&#x27;;}
    a.onchange=b.onchange=f;f();})();
  &lt;/script&gt;
  &lt;p&gt;&lt;b&gt;Riclassifiche dei comparativi&lt;/b&gt; (IAS 1.41 ↔ IFRS 18.33, &lt;span class=&quot;verdict v-same&quot;&gt;kept the same content&lt;/span&gt;): se cambia presentazione o classificazione, si riclassificano anche i comparativi, salvo sia &lt;span class=&quot;term&quot;&gt;impracticable&lt;/span&gt; (impossibile dopo ogni ragionevole sforzo). Va indicato: (a) la &lt;b&gt;natura&lt;/b&gt; della riclassifica, (b) l&#x27;&lt;b&gt;importo&lt;/b&gt; di ogni voce riclassificata, (c) il &lt;b&gt;motivo&lt;/b&gt;.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Collegamento interno alla lezione: retrospective application e restatement sono disciplinati dallo IAS 8, che le slide citano anche per gli effetti rilevati direttamente nell&#x27;equity (sezione 7 e 8).&lt;/p&gt;

  &lt;h3&gt;Identification of the financial statements&lt;/h3&gt;
  &lt;p&gt;IAS 1.49-50 ↔ IFRS 18.25-26 &lt;span class=&quot;verdict v-same&quot;&gt;same exact content&lt;/span&gt;: il bilancio va &lt;b&gt;identificato chiaramente&lt;/b&gt; e distinto dalle altre informazioni dello stesso documento (relazione annuale, deposito regolamentare…), perché gli IFRS si applicano &lt;b&gt;solo&lt;/b&gt; al bilancio. Il lettore deve capire che cosa è redatto secondo gli IFRS e che cosa no.&lt;/p&gt;
  &lt;p&gt;IAS 1.51 ↔ IFRS 18.27 (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;; &quot;display&quot; diventa &quot;&lt;b&gt;disclose&lt;/b&gt;&quot;): va indicato con evidenza, e ripetuto quando serve:&lt;/p&gt;
  &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;a · nome dell&#x27;entità e sue variazioni&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;b · bilancio individuale o di gruppo&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;c · data di chiusura o periodo coperto&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;d · presentation currency (IAS 21)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;e · livello di arrotondamento (B11)&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Presentation currency&lt;/span&gt;: la valuta in cui è presentato il bilancio, definita dallo IAS 21 &lt;em&gt;The Effects of Changes in Foreign Exchange Rates&lt;/em&gt;. Il livello di arrotondamento indica, ad esempio, &quot;importi in migliaia di euro&quot;.&lt;/p&gt;

  &lt;h3&gt;Frequency of reporting&lt;/h3&gt;
  &lt;p&gt;IAS 1.36 ↔ IFRS 18.28 (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;; &quot;present&quot; → &quot;&lt;b&gt;provide&lt;/b&gt;&quot;): un complete set &lt;b&gt;almeno una volta l&#x27;anno&lt;/b&gt;. Se cambia la data di chiusura e il periodo è più lungo o più corto di un anno, oltre al periodo coperto vanno indicati: il &lt;b&gt;motivo&lt;/b&gt; e il fatto che gli importi &lt;b&gt;non sono del tutto comparabili&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Esempio.&lt;/b&gt; Un gruppo sposta la chiusura dal 30 giugno al 31 dicembre: il bilancio di transizione copre 18 mesi (1/7/2025-31/12/2026). Il conto economico di 18 mesi non è confrontabile con quello di 12 mesi dell&#x27;anno prima, e va detto.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte B&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Un&#x27;entità usa una policy non conforme ma la descrive accuratamente nelle note. Il bilancio è a posto? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No. IAS 1.18 (= 6D): le policy inappropriate &lt;b&gt;non&lt;/b&gt; si rettificano con l&#x27;informativa o con materiale esplicativo.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;Le informazioni sui flussi di cassa sono l&#x27;unica eccezione al principio di competenza.&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Quale parte del bilancio NON si redige secondo l&#x27;accrual basis?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Le note&lt;/button&gt;&lt;button&gt;Lo statement of changes in equity&lt;/button&gt;&lt;button data-ok&gt;Le informazioni sui cash flows&lt;/button&gt;&lt;button&gt;Lo statement of financial position&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Quali sono i tre verbi della definizione di materialità? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Omitting, misstating, obscuring&lt;/b&gt;: omettere, esporre in modo errato, oscurare.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Un IFRS elenca una disclosure come &quot;minimum requirement&quot;, ma per l&#x27;entità l&#x27;informazione è immaterial. Va data? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No (IAS 1.31 / IFRS 18.19): non serve anche se è descritta come requisito minimo. Al contrario, se i requisiti non bastano, servono disclosure aggiuntive (IFRS 18.20).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Quando serve il terzo statement of financial position? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Quando (a) c&#x27;è applicazione retroattiva di una policy, restatement retroattivo o riclassifica &lt;b&gt;e&lt;/b&gt; (b) l&#x27;effetto sullo SFP all&#x27;inizio dell&#x27;esercizio precedente è material (IAS 1.40A / IFRS 18.37).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Che cosa deve fare il management se ha incertezze significative sulla continuità ma non intende liquidare? &lt;button class=&quot;btn reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Redige il bilancio su base going concern e &lt;b&gt;fornisce informativa&lt;/b&gt; su quelle incertezze (IAS 1.25).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE C --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte C · Situazione patrimoniale-finanziaria&lt;/span&gt;
  &lt;h2&gt;5 · Statement of financial position&lt;/h2&gt;
  &lt;p&gt;Lo &lt;span class=&quot;term&quot;&gt;statement of financial position&lt;/span&gt; (fino al 2007 &lt;em&gt;balance sheet&lt;/em&gt;, lo stato patrimoniale) fotografa a una data attività, passività e patrimonio netto. IAS 1 par. 54-80A ↔ IFRS 18 par. 96-106 e Appendix B (B96-B111).&lt;/p&gt;

  &lt;h3&gt;Current / non-current distinction&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.60-61&lt;/h5&gt;Attività e passività correnti e non correnti come classificazioni separate, salvo che una presentazione per &lt;b&gt;liquidità&lt;/b&gt; fornisca informazioni &lt;em&gt;reliable and more relevant&lt;/em&gt;; in quel caso tutto in ordine di liquidità.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18 par. 96-106&lt;/h5&gt;Stessa regola, ma l&#x27;eccezione scatta se la presentazione per liquidità fornisce &lt;em&gt;a more useful &lt;b&gt;structured summary&lt;/b&gt;&lt;/em&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.60-61&lt;/span&gt;
  &lt;p&gt;Con qualunque metodo, per ogni voce che mescola importi da recuperare/estinguere &lt;b&gt;entro&lt;/b&gt; e &lt;b&gt;oltre&lt;/b&gt; 12 mesi va indicata la quota oltre i 12 mesi. La presentazione per liquidità si usa tipicamente nelle &lt;b&gt;banche&lt;/b&gt; e nelle istituzioni finanziarie, dove un ciclo operativo chiaramente identificabile non esiste.&lt;/p&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Structured summary&lt;/span&gt;: espressione chiave dell&#x27;IFRS 18. Ogni primary financial statement deve essere un riassunto strutturato e utile; ciò che non serve al riassunto va nelle note.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Current assets&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Current liabilities&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Che cos&#x27;è il normal operating cycle&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Un&#x27;attività è &lt;b&gt;current&lt;/b&gt; se (IAS 1.66 = IFRS 18.99, &lt;span class=&quot;verdict v-same&quot;&gt;same exact content&lt;/span&gt;):&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;si prevede di realizzarla, venderla o consumarla nel &lt;b&gt;normal operating cycle&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;è detenuta principalmente &lt;b&gt;per trading&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;si prevede di realizzarla &lt;b&gt;entro 12 mesi&lt;/b&gt; dalla chiusura;&lt;/li&gt;&lt;li&gt;è &lt;b&gt;cash or cash equivalent&lt;/b&gt; (IAS 7), salvo vincoli che ne impediscano l&#x27;uso per almeno 12 mesi.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Tutte le altre sono &lt;b&gt;non-current&lt;/b&gt; (IAS 1.66 ↔ IFRS 18.100 &quot;all assets other than those specified in paragraph 99&quot;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Una passività è &lt;b&gt;current&lt;/b&gt; se (IAS 1.69 ↔ IFRS 18, &lt;span class=&quot;verdict v-diff&quot;&gt;slight changes&lt;/span&gt;):&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;si prevede di estinguerla nel &lt;b&gt;normal operating cycle&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;è detenuta principalmente &lt;b&gt;per trading&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;va estinta &lt;b&gt;entro 12 mesi&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;l&#x27;entità non ha il &lt;b&gt;diritto&lt;/b&gt; di differirne l&#x27;estinzione per almeno 12 mesi dalla chiusura.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;&lt;b&gt;Le differenze:&lt;/b&gt; lo IAS 1 parlava di diritto &lt;mark&gt;&quot;unconditional&quot;&lt;/mark&gt;; nella versione IFRS 18 l&#x27;aggettivo sparisce (resta &quot;the right&quot;). Inoltre la slide IFRS 18 non riporta la frase IAS 1 secondo cui le clausole che, a scelta della controparte, possono portare all&#x27;estinzione tramite emissione di strumenti di equity &lt;b&gt;non incidono&lt;/b&gt; sulla classificazione. Tutte le altre passività sono non-current.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Il &lt;b&gt;normal operating cycle&lt;/b&gt; è il tempo che passa tra l&#x27;acquisizione delle risorse destinate alla trasformazione e il loro realizzo in cassa; quando non è chiaramente identificabile si assume di 12 mesi (IAS 1.68, testo dello standard su &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt;). Per un&#x27;azienda vinicola che invecchia il vino tre anni, il magazzino è comunque current.&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 820 130&quot; role=&quot;img&quot; aria-label=&quot;Ciclo operativo&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Cassa&lt;/text&gt;
        &lt;rect x=&quot;230&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Materie prime&lt;/text&gt;
        &lt;rect x=&quot;440&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Prodotti finiti&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;725&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Crediti&lt;/text&gt;
        &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M170,65 L228,65&quot;/&gt;&lt;path d=&quot;M380,65 L438,65&quot;/&gt;&lt;path d=&quot;M590,65 L648,65&quot;/&gt;&lt;path d=&quot;M725,92 C725,125 95,125 95,94&quot;/&gt;&lt;/g&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Line items minimi&lt;/h3&gt;
  &lt;p&gt;Filtra l&#x27;elenco per vedere che cosa cambia tra IAS 1.54 e IFRS 18.103-104 (&lt;span class=&quot;verdict v-mean&quot;&gt;same items but different structure&lt;/span&gt;).&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot; id=&quot;li-f&quot;&gt;&lt;button class=&quot;btn on&quot; data-f=&quot;all&quot;&gt;Tutte&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;new&quot;&gt;Novità IFRS 18&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;moved&quot;&gt;Spostate&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;filt&quot; id=&quot;li-t&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th&gt;IAS 1.54&lt;/th&gt;&lt;th&gt;IFRS 18&lt;/th&gt;&lt;th&gt;Nota&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Property, plant and equipment&lt;/td&gt;&lt;td&gt;a&lt;/td&gt;&lt;td&gt;103 a&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Investment property&lt;/td&gt;&lt;td&gt;b&lt;/td&gt;&lt;td&gt;103 b&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Intangible assets&lt;/td&gt;&lt;td&gt;c&lt;/td&gt;&lt;td&gt;103 c&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;new&quot;&gt;&lt;td&gt;&lt;b&gt;Goodwill&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;103 d&lt;/b&gt;&lt;/td&gt;&lt;td&gt;voce separata, nuova&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Financial assets (escl. altre voci)&lt;/td&gt;&lt;td&gt;d&lt;/td&gt;&lt;td&gt;103 e&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Portafogli IFRS 17 attivi&lt;/td&gt;&lt;td&gt;da&lt;/td&gt;&lt;td&gt;103 f&lt;/td&gt;&lt;td&gt;assicurazioni&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Investments a equity method&lt;/td&gt;&lt;td&gt;e&lt;/td&gt;&lt;td&gt;103 g&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Biological assets (IAS 41)&lt;/td&gt;&lt;td&gt;f&lt;/td&gt;&lt;td&gt;103 h&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Inventories&lt;/td&gt;&lt;td&gt;g&lt;/td&gt;&lt;td&gt;103 i&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Trade and other receivables&lt;/td&gt;&lt;td&gt;h&lt;/td&gt;&lt;td&gt;103 j&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Cash and cash equivalents&lt;/td&gt;&lt;td&gt;i&lt;/td&gt;&lt;td&gt;103 k&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Assets held for sale (IFRS 5)&lt;/td&gt;&lt;td&gt;j&lt;/td&gt;&lt;td&gt;103 l&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Trade and other payables&lt;/td&gt;&lt;td&gt;k&lt;/td&gt;&lt;td&gt;103 m&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Provisions&lt;/td&gt;&lt;td&gt;l&lt;/td&gt;&lt;td&gt;103 m (sic)&lt;/td&gt;&lt;td&gt;la slide ripete la lettera &quot;m&quot;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Financial liabilities&lt;/td&gt;&lt;td&gt;m&lt;/td&gt;&lt;td&gt;103 o&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Portafogli IFRS 17 passivi&lt;/td&gt;&lt;td&gt;ma&lt;/td&gt;&lt;td&gt;103 p&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Current tax (IAS 12)&lt;/td&gt;&lt;td&gt;n&lt;/td&gt;&lt;td&gt;103 q&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Deferred tax (IAS 12)&lt;/td&gt;&lt;td&gt;o&lt;/td&gt;&lt;td&gt;103 r&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Liabilities in disposal groups (IFRS 5)&lt;/td&gt;&lt;td&gt;p&lt;/td&gt;&lt;td&gt;103 s&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;moved&quot;&gt;&lt;td&gt;Non-controlling interests&lt;/td&gt;&lt;td&gt;q&lt;/td&gt;&lt;td&gt;&lt;b&gt;104 a&lt;/b&gt;&lt;/td&gt;&lt;td&gt;voci di equity in un paragrafo a sé&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;moved&quot;&gt;&lt;td&gt;Issued capital and reserves (owners of the parent)&lt;/td&gt;&lt;td&gt;r&lt;/td&gt;&lt;td&gt;&lt;b&gt;104 b&lt;/b&gt;&lt;/td&gt;&lt;td&gt;idem&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){var bs=document.querySelectorAll(&#x27;#li-f button&#x27;),rs=document.querySelectorAll(&#x27;#li-t tbody tr&#x27;);
    bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});var f=b.dataset.f;rs.forEach(function(r){r.hidden=!(f===&#x27;all&#x27;||r.dataset.k===f)})}});})();
  &lt;/script&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Non-controlling interests&lt;/span&gt; (NCI, interessenze di minoranza): la quota di patrimonio delle controllate che non appartiene alla capogruppo. &lt;span class=&quot;term&quot;&gt;Equity method&lt;/span&gt;: metodo del patrimonio netto per collegate e joint venture. &lt;span class=&quot;term&quot;&gt;Disposal group&lt;/span&gt;: gruppo di attività (e passività) destinato alla vendita come un tutt&#x27;uno (IFRS 5).&lt;/p&gt;

  &lt;h3&gt;Voci aggiuntive e subtotali&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.55 / 55A&lt;/h5&gt;Voci aggiuntive, intestazioni e subtotali quando sono &lt;b&gt;relevant&lt;/b&gt; per capire la posizione finanziaria. I subtotali devono: (a) essere fatti di importi rilevati e valutati secondo IFRS; &lt;mark&gt;(b) essere presentati ed etichettati in modo che le voci che li compongono siano chiare e comprensibili&lt;/mark&gt;; (c) essere coerenti nel tempo; (d) non avere più evidenza dei subtotali e totali richiesti dagli IFRS.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.24 (v. B9)&lt;/h5&gt;Voci aggiuntive e subtotali se &lt;b&gt;necessari&lt;/b&gt; per un &lt;em&gt;useful structured summary&lt;/em&gt;. Requisiti uguali, tranne il punto &lt;mark&gt;(b): essere compatibili con la struttura del prospetto creata dai requisiti del par. 22&lt;/mark&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-diff&quot;&gt;Point b) is different&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Il senso: nell&#x27;IFRS 18 un subtotale &quot;creativo&quot; non può rompere lo schema obbligatorio del prospetto.&lt;/span&gt;

  &lt;h3&gt;Sotto-classificazioni (IAS 1.77-78 ↔ IFRS 18.B109-B111)&lt;/h3&gt;
  &lt;p&gt;Nel prospetto o nelle note si disaggregano le voci in modo adatto all&#x27;attività dell&#x27;entità. Apri le schede:&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;a · Property, plant and equipment&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;In classi secondo lo IAS 16 (terreni, fabbricati, impianti…).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;b · Receivables&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Crediti commerciali verso clienti, verso &lt;span class=&quot;term&quot;&gt;related parties&lt;/span&gt; (parti correlate), &lt;span class=&quot;term&quot;&gt;prepayments&lt;/span&gt; (risconti/anticipi) e altri.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;c · Inventories&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Secondo lo IAS 2: merci, materiali di consumo per la produzione, materie prime, &lt;span class=&quot;term&quot;&gt;work in progress&lt;/span&gt; (semilavorati/prodotti in corso), prodotti finiti.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;d · Trade payables in supplier finance arrangements &lt;span class=&quot;verdict v-diff&quot;&gt;nuovo in IFRS 18&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;IFRS 18.B111 aggiunge questo punto: i debiti commerciali vanno disaggregati, applicando lo IAS 7, per mostrare separatamente quelli che fanno parte di &lt;span class=&quot;term&quot;&gt;supplier finance arrangements&lt;/span&gt; (accordi in cui una banca paga i fornitori dell&#x27;entità e l&#x27;entità rimborsa la banca più tardi; noti anche come &lt;em&gt;reverse factoring&lt;/em&gt;).
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;Il collegamento con lo IAS 7 nasce dagli emendamenti IASB a IAS 7 e IFRS 7 del &lt;b&gt;25 maggio 2023&lt;/b&gt; sulla disclosure dei supplier finance arrangements (nuovi par. 44F-44H dello IAS 7), in vigore dal 1° gennaio 2024. Fonte: &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;e · Provisions&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;IAS 1: benefici ai dipendenti e altre voci. IFRS 18 aggiunge l&#x27;esempio delle &lt;span class=&quot;term&quot;&gt;decommissioning liabilities&lt;/span&gt; (oneri di smantellamento e ripristino).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;f · Equity capital and reserves&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Capitale versato, &lt;span class=&quot;term&quot;&gt;share premium&lt;/span&gt; (sovrapprezzo azioni), riserve.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Format of statement&lt;/h3&gt;
  &lt;p&gt;Né lo IAS 1.57 né l&#x27;IFRS 18.106 prescrivono &lt;b&gt;ordine o formato&lt;/b&gt; (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;). Si possono presentare prima le correnti o prima le non correnti; ammessa anche una presentazione per &lt;b&gt;net assets&lt;/b&gt; (attività meno passività) e il formato &lt;em&gt;long-term financing approach&lt;/em&gt; usato nel Regno Unito. Muovi i cursori: i due formati mostrano gli stessi numeri.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;fmt&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;&lt;label&gt;Fixed (non-current) assets: &lt;b id=&quot;fa-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fa&quot; min=&quot;200&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;800&quot;&gt;
      &lt;label&gt;Current assets: &lt;b id=&quot;ca-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ca&quot; min=&quot;100&quot; max=&quot;800&quot; step=&quot;10&quot; value=&quot;400&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;Short-term payables: &lt;b id=&quot;sp-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sp&quot; min=&quot;50&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;
      &lt;label&gt;Long-term debt: &lt;b id=&quot;ld-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ld&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;10&quot; value=&quot;350&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;std&quot;&gt;Formato &quot;a sezioni contrapposte&quot;&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;uk&quot;&gt;Long-term financing approach (UK)&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 260&quot; id=&quot;fmt-svg&quot; role=&quot;img&quot; aria-label=&quot;Confronto dei formati di stato patrimoniale&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;formula&quot; id=&quot;fmt-f&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var ids=[&#x27;fa&#x27;,&#x27;ca&#x27;,&#x27;sp&#x27;,&#x27;ld&#x27;],m=&#x27;std&#x27;,s=document.getElementById(&#x27;fmt-svg&#x27;),f=document.getElementById(&#x27;fmt-f&#x27;);
    var bs=document.querySelectorAll(&#x27;#fmt .btnrow button&#x27;);bs.forEach(function(b){b.onclick=function(){m=b.dataset.m;bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});draw()}});
    function v(i){return +document.getElementById(i).value}
    function bar(x,y,w,h,c,t,val){return &#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+Math.max(h,0)+&#x27;&quot; fill=&quot;&#x27;+c+&#x27;&quot; rx=&quot;3&quot; opacity=&quot;.85&quot;/&gt;&#x27;+(h&gt;16?&#x27;&lt;text x=&quot;&#x27;+(x+w/2)+&#x27;&quot; y=&quot;&#x27;+(y+h/2+5)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--paper)&quot;&gt;&#x27;+t+&#x27; &#x27;+val+&#x27;&lt;/text&gt;&#x27;:&#x27;&#x27;);}
    function draw(){ids.forEach(function(i){document.getElementById(i+&#x27;-v&#x27;).textContent=v(i)});
      var fa=v(&#x27;fa&#x27;),ca=v(&#x27;ca&#x27;),sp=v(&#x27;sp&#x27;),ld=v(&#x27;ld&#x27;),eq=fa+ca-sp-ld,k=0.115,h=&#x27;&#x27;;
      if(m===&#x27;std&#x27;){var y=10;
        h+=&#x27;&lt;text x=&quot;160&quot; y=&quot;&#x27;+(y+8)+&#x27;&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;ASSETS&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;&#x27;+(y+8)+&#x27;&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;EQUITY AND LIABILITIES&lt;/text&gt;&#x27;;
        var yy=20;h+=bar(60,yy,200,fa*k,&#x27;var(--slate)&#x27;,&#x27;Fixed&#x27;,fa);h+=bar(60,yy+fa*k,200,ca*k,&#x27;oklch(60% 0.07 250)&#x27;,&#x27;Current&#x27;,ca);
        var ey=20;if(eq&gt;0){h+=bar(460,ey,200,eq*k,&#x27;var(--sage)&#x27;,&#x27;Equity&#x27;,eq);ey+=eq*k;}
        h+=bar(460,ey,200,ld*k,&#x27;var(--ochre)&#x27;,&#x27;LT debt&#x27;,ld);h+=bar(460,ey+ld*k,200,sp*k,&#x27;var(--brick)&#x27;,&#x27;ST payables&#x27;,sp);
        f.innerHTML=&#x27;Assets &#x27;+(fa+ca)+&#x27; = Equity &#x27;+eq+&#x27; + Liabilities &#x27;+(sp+ld);
      }else{
        h+=&#x27;&lt;text x=&quot;20&quot; y=&quot;20&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Fixed assets + Current assets − Short-term payables = Long-term debt + Equity&lt;/text&gt;&#x27;;
        var x=20,y=40,sc=0.33;h+=bar(x,y,fa*sc,40,&#x27;var(--slate)&#x27;,&#x27;FA&#x27;,fa);h+=bar(x+fa*sc,y,ca*sc,40,&#x27;oklch(60% 0.07 250)&#x27;,&#x27;CA&#x27;,ca);
        var na=fa+ca-sp;h+=&#x27;&lt;rect x=&quot;&#x27;+(x+(fa+ca-sp)*sc)+&#x27;&quot; y=&quot;&#x27;+(y+45)+&#x27;&quot; width=&quot;&#x27;+sp*sc+&#x27;&quot; height=&quot;30&quot; fill=&quot;var(--brick)&quot; rx=&quot;3&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(x+(fa+ca-sp/2)*sc)+&#x27;&quot; y=&quot;&#x27;+(y+65)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--paper)&quot;&gt;− ST &#x27;+sp+&#x27;&lt;/text&gt;&#x27;;
        h+=bar(x,y+110,ld*sc,40,&#x27;var(--ochre)&#x27;,&#x27;LT&#x27;,ld);if(eq&gt;0)h+=bar(x+ld*sc,y+110,eq*sc,40,&#x27;var(--sage)&#x27;,&#x27;Eq&#x27;,eq);
        h+=&#x27;&lt;line x1=&quot;&#x27;+(x+na*sc)+&#x27;&quot; y1=&quot;&#x27;+(y-5)+&#x27;&quot; x2=&quot;&#x27;+(x+na*sc)+&#x27;&quot; y2=&quot;&#x27;+(y+160)+&#x27;&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(x+na*sc+6)+&#x27;&quot; y=&quot;&#x27;+(y+100)+&#x27;&quot; font-size=&quot;12&quot; fill=&quot;var(--accent)&quot;&gt;capitale investito netto &#x27;+na+&#x27;&lt;/text&gt;&#x27;;
        f.innerHTML=fa+&#x27; + &#x27;+ca+&#x27; − &#x27;+sp+&#x27; = &#x27;+ld+&#x27; + &#x27;+eq+&#x27;  →  &#x27;+na+&#x27; = &#x27;+(ld+eq);
      }
      if(eq&lt;=0)h+=&#x27;&lt;text x=&quot;410&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--brick)&quot;&gt;Patrimonio netto negativo: le passività superano le attività.&lt;/text&gt;&#x27;;
      s.innerHTML=h;}
    ids.forEach(function(i){document.getElementById(i).addEventListener(&#x27;input&#x27;,draw)});draw();})();
  &lt;/script&gt;

  &lt;h3&gt;Share capital and reserves&lt;/h3&gt;
  &lt;p&gt;IAS 1.79: nel prospetto, nello statement of changes in equity o nelle note, per &lt;b&gt;ogni classe di azioni&lt;/b&gt;:&lt;/p&gt;
  &lt;ul class=&quot;toc-mini&quot;&gt;&lt;li&gt;numero di azioni autorizzate&lt;/li&gt;&lt;li&gt;emesse e interamente versate / emesse e non interamente versate&lt;/li&gt;&lt;li&gt;valore nominale (o assenza di valore nominale)&lt;/li&gt;&lt;li&gt;riconciliazione delle azioni in circolazione inizio-fine&lt;/li&gt;&lt;li&gt;diritti, privilegi e restrizioni (anche su dividendi e rimborso del capitale)&lt;/li&gt;&lt;li&gt;azioni proprie, detenute dall&#x27;entità, da controllate o collegate&lt;/li&gt;&lt;li&gt;azioni riservate per opzioni e contratti di vendita&lt;/li&gt;&lt;li&gt;(b) natura e scopo di ogni riserva&lt;/li&gt;&lt;/ul&gt;
  &lt;p&gt;Le entità &lt;b&gt;senza capitale azionario&lt;/b&gt; (partnership, trust) danno informazioni equivalenti per ogni categoria di interessenza (IAS 1.80).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Riclassifiche tra passività ed equity&lt;/b&gt; (IAS 1.80A ↔ IFRS 18.19B, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning, expressed differently&lt;/span&gt;): se si riclassifica (a) un &lt;span class=&quot;term&quot;&gt;puttable financial instrument&lt;/span&gt; (strumento che il possessore può &quot;rivendere&quot; all&#x27;emittente in cambio di cassa) classificato come equity, o (b) uno strumento che obbliga a consegnare una quota pro rata dell&#x27;attivo netto solo in liquidazione, si indicano importo, tempi e motivo. L&#x27;IFRS 18 rimanda esplicitamente ai par. 16A-16D dello IAS 32.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Parte C · Situazione patrimoniale-finanziaria&lt;/span&gt;
  &lt;h2&gt;6 · Passività correnti o non correnti: rifinanziamenti e covenants&lt;/h2&gt;
  &lt;p&gt;È la parte più &quot;tecnica&quot; della lezione e quella con più casi pratici. L&#x27;idea di fondo: conta &lt;b&gt;il diritto esistente alla data di chiusura&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;end of the reporting period&lt;/span&gt;) di rinviare il pagamento di almeno 12 mesi, non le intenzioni né ciò che succede dopo.&lt;/p&gt;

  &lt;h3&gt;Le regole, una per una&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Rifinanziamento&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Violazione di covenant&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Grace period&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Eventi dopo la chiusura&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.73&lt;/h5&gt;Se l&#x27;entità &lt;b&gt;si aspetta e ha la discrezionalità&lt;/b&gt; di rifinanziare o prorogare (&lt;span class=&quot;term&quot;&gt;roll over&lt;/span&gt;) l&#x27;obbligazione per almeno 12 mesi in base a una linea di credito esistente, la classifica non corrente anche se scadrebbe prima. Se il rifinanziamento &lt;b&gt;non&lt;/b&gt; è a sua discrezione, è corrente.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B101&lt;/h5&gt;Se l&#x27;entità &lt;b&gt;ha il diritto, alla fine del periodo&lt;/b&gt;, di prorogare l&#x27;obbligazione per almeno 12 mesi in base a una linea di credito esistente, la classifica non corrente. Senza quel diritto non considera la possibilità di rifinanziare: è corrente.&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.73&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Ma il linguaggio passa da &quot;aspettativa + discrezionalità&quot; a &quot;diritto alla data di chiusura&quot;: è l&#x27;effetto degli emendamenti 2020.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.74&lt;/h5&gt;Se l&#x27;entità viola una clausola (&lt;b&gt;provision&lt;/b&gt;) di un finanziamento a lungo termine entro la chiusura, e il debito diventa &lt;b&gt;esigibile a vista&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;payable on demand&lt;/span&gt;), è corrente, &lt;b&gt;anche se&lt;/b&gt; dopo la chiusura e prima dell&#x27;approvazione del bilancio il finanziatore accetta di non chiedere il rimborso.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B112 (come da slide)&lt;/h5&gt;Stessa regola, con &quot;&lt;b&gt;covenant&lt;/b&gt;&quot; al posto di &quot;provision&quot;. Motivo: a fine periodo l&#x27;entità non ha il diritto di differire di almeno 12 mesi.&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;La slide cita &quot;IFRS 18.B112&quot;, ma la slide su B105(b) rimanda per la violazione al &quot;paragraph B102&quot;: verifica il numero sul testo dello standard.&lt;/span&gt;
      &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Covenant&lt;/span&gt;: clausola di un contratto di finanziamento che impone all&#x27;impresa certi parametri (es. rapporto debito/EBITDA sotto una soglia). Se violata, il finanziatore può chiedere il rimborso anticipato.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.75&lt;/h5&gt;Il debito è non corrente se il finanziatore ha concordato &lt;b&gt;entro la data di chiusura&lt;/b&gt; un &lt;span class=&quot;term&quot;&gt;period of grace&lt;/span&gt; (periodo di tolleranza) che termina almeno 12 mesi dopo, durante il quale l&#x27;entità può sanare la violazione e il finanziatore non può chiedere il rimborso immediato.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B103&lt;/h5&gt;Identica regola (&quot;by the end of the reporting period&quot;).&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Eventi tra la chiusura e l&#x27;autorizzazione alla pubblicazione: sono &lt;b&gt;non-adjusting events&lt;/b&gt; secondo lo &lt;span class=&quot;term&quot;&gt;IAS 10 Events after the Reporting Period&lt;/span&gt;: non cambiano la classificazione, si danno solo in nota.&lt;/p&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.76&lt;/h5&gt;(a) rifinanziamento a lungo termine; (b) rimedio alla violazione di un finanziamento a lungo termine; (c) concessione di un grace period di almeno 12 mesi.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B105&lt;/h5&gt;(a)-(c) come IAS 1, riferiti a passività &lt;b&gt;classificate correnti&lt;/b&gt; (B98, B102, B103), più &lt;mark&gt;(d) estinzione di una passività classificata non corrente&lt;/mark&gt; (B104).&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-diff&quot;&gt;Changes with respect to IAS 1.76&lt;/span&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;fonte esterna&lt;/span&gt;&lt;b&gt;Adjusting vs non-adjusting.&lt;/b&gt; Gli &lt;em&gt;adjusting events&lt;/em&gt; danno evidenza di condizioni già esistenti alla chiusura e modificano gli importi (es. fallimento di un cliente dopo la chiusura che conferma l&#x27;inesigibilità di un credito); i &lt;em&gt;non-adjusting events&lt;/em&gt; riflettono condizioni sorte dopo, e si danno in nota se material. Fonte: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-10-events-after-the-reporting-period/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 10&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Classificatore interattivo&lt;/h3&gt;
  &lt;div class=&quot;sim cls&quot; id=&quot;lc&quot;&gt;
    &lt;h4&gt;Un finanziamento a lungo termine scade contrattualmente nel 2030. Che cosa succede al 31/12/2026?&lt;/h4&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc1&quot;&gt; Entro il 31/12/2026 l&#x27;entità ha &lt;b&gt;violato un covenant&lt;/b&gt; da rispettare a quella data, e il debito è diventato esigibile a vista&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc2&quot;&gt; Entro il 31/12/2026 la banca ha concesso un &lt;b&gt;grace period&lt;/b&gt; che termina almeno il 31/12/2027&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc3&quot;&gt; A &lt;b&gt;febbraio 2027&lt;/b&gt; (prima dell&#x27;approvazione del bilancio) la banca rinuncia a chiedere il rimborso (waiver)&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc4&quot;&gt; Esiste un covenant da verificare solo al &lt;b&gt;30/6/2027&lt;/b&gt;, che l&#x27;entità prevede di non rispettare&lt;/label&gt;
    &lt;div id=&quot;lc-out&quot; class=&quot;result&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
