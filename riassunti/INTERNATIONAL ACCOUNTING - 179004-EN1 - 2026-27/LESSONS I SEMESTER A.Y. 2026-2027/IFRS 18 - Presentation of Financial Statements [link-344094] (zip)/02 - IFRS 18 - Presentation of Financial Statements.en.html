      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.75&lt;/h5&gt;The liability is non-current if the lender agreed &lt;b&gt;by the end of the reporting period&lt;/b&gt; to provide a &lt;span class=&quot;term&quot;&gt;period of grace&lt;/span&gt; ending at least 12 months after that date, within which the entity can rectify the breach and during which the lender cannot demand immediate repayment.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B103&lt;/h5&gt;Identical rule (&quot;by the end of the reporting period&quot;).&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Events between the end of the reporting period and the date the financial statements are authorised for issue: these are &lt;b&gt;non-adjusting events&lt;/b&gt; under &lt;span class=&quot;term&quot;&gt;IAS 10 Events after the Reporting Period&lt;/span&gt;: they do not change the classification and are only disclosed in the notes.&lt;/p&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.76&lt;/h5&gt;(a) refinancing on a long-term basis; (b) rectification of a breach of a long-term loan arrangement; (c) granting of a period of grace of at least 12 months.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B105&lt;/h5&gt;(a)-(c) as in IAS 1, referring to liabilities &lt;b&gt;classified as current&lt;/b&gt; (B98, B102, B103), plus &lt;mark&gt;(d) settlement of a liability classified as non-current&lt;/mark&gt; (B104).&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-diff&quot;&gt;Changes with respect to IAS 1.76&lt;/span&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;&lt;b&gt;Adjusting vs non-adjusting.&lt;/b&gt; &lt;em&gt;Adjusting events&lt;/em&gt; provide evidence of conditions that existed at the end of the reporting period and change the amounts recognised (e.g. the bankruptcy of a customer after the reporting period, confirming that a receivable was impaired); &lt;em&gt;non-adjusting events&lt;/em&gt; reflect conditions that arose afterwards and are disclosed in the notes if material. Source: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-10-events-after-the-reporting-period/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 10&lt;/a&gt;.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Interactive classifier&lt;/h3&gt;
  &lt;div class=&quot;sim cls&quot; id=&quot;lc&quot;&gt;
    &lt;h4&gt;A long-term loan is contractually due in 2030. What happens at 31/12/2026?&lt;/h4&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc1&quot;&gt; On or before 31/12/2026 the entity &lt;b&gt;breached a covenant&lt;/b&gt; to be complied with at that date, and the loan became payable on demand&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc2&quot;&gt; On or before 31/12/2026 the bank granted a &lt;b&gt;grace period&lt;/b&gt; ending no earlier than 31/12/2027&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc3&quot;&gt; In &lt;b&gt;February 2027&lt;/b&gt; (before the financial statements are authorised) the bank agrees not to demand repayment (waiver)&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lc4&quot;&gt; There is a covenant to be tested only at &lt;b&gt;30/6/2027&lt;/b&gt;, which the entity expects not to meet&lt;/label&gt;
    &lt;div id=&quot;lc-out&quot; class=&quot;result&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var c=[1,2,3,4].map(function(i){return document.getElementById(&#x27;lc&#x27;+i)}),o=document.getElementById(&#x27;lc-out&#x27;);
    function f(){var br=c[0].checked,gp=c[1].checked,wv=c[2].checked,fut=c[3].checked,cur,why=[];
      if(br&amp;&amp;!gp){cur=true;why.push(&#x27;Covenant breached by the end of the reporting period and no right to defer settlement for 12 months at that date (IAS 1.74; Appendix B of IFRS 18).&#x27;);if(wv)why.push(&#x27;The February 2027 waiver comes after the end of the reporting period: it does not change the classification; it is a non-adjusting event to be disclosed in the notes.&#x27;);}
      else if(br&amp;&amp;gp){cur=false;why.push(&#x27;The breach exists, but the grace period of at least 12 months was granted by the end of the reporting period (IAS 1.75 / IFRS 18.B103).&#x27;);}
      else{cur=false;why.push(&#x27;At the end of the period the entity has the right to defer settlement for more than 12 months.&#x27;);if(wv)why.push(&#x27;The waiver is irrelevant: there was no breach to rectify.&#x27;);}
      if(fut)why.push(&#x27;A covenant to be complied with only after the reporting period does &lt;b&gt;not&lt;/b&gt; affect classification (October 2022 amendments), and the expectation of not meeting it is also irrelevant: classification does not depend on expectations.&#x27;);
      if(gp&amp;&amp;!br)why.push(&#x27;The grace period is not needed: there is no breach.&#x27;);
      o.className=&#x27;result &#x27;+(cur?&#x27;cur&#x27;:&#x27;nc&#x27;);o.innerHTML=(cur?&#x27;CURRENT liability&#x27;:&#x27;NON-CURRENT liability&#x27;)+&#x27;&lt;small&gt;&#x27;+why.join(&#x27; &#x27;)+&#x27;&lt;/small&gt;&#x27;;}
    c.forEach(function(x){x.onchange=f});f();})();
  &lt;/script&gt;

  &lt;h3&gt;The 2020 and 2022 amendments to IAS 1&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;23 January 2020 · &lt;em&gt;Classification of Liabilities as Current or Non-current&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;The IASB provides a more general approach to classification, based on the &lt;b&gt;contractual arrangements in place at the reporting date&lt;/b&gt;. The amendments affect &lt;b&gt;only the presentation&lt;/b&gt; of liabilities in the SFP: not the amount or timing of recognition, nor the disclosures.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;What they clarify (1/3)&lt;/h4&gt;&lt;p&gt;Classification is based on &lt;b&gt;rights existing at the end of the reporting period&lt;/b&gt;; the text now consistently refers to a &quot;&lt;b&gt;right&lt;/b&gt;&quot; to defer settlement by at least 12 months, and only rights in place &quot;&lt;em&gt;at the end of the reporting period&lt;/em&gt;&quot; count.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;What they clarify (2/3)&lt;/h4&gt;&lt;p&gt;Classification is &lt;b&gt;unaffected by expectations&lt;/b&gt; about whether the entity will exercise that right. If I have the right to defer but expect to settle within the year, the liability remains non-current.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;What they clarify (3/3)&lt;/h4&gt;&lt;p&gt;&quot;&lt;b&gt;Settlement&lt;/b&gt;&quot; means a transfer to the counterparty of cash, equity instruments, other assets or services.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;October 2022 · &lt;em&gt;Non-current Liabilities with Covenants&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Only &lt;b&gt;covenants to be complied with on or before the reporting date&lt;/b&gt; affect classification. The combined effect of the 2020 and 2022 amendments changes practice: entities must review their existing and planned loan agreements. &lt;b&gt;Retrospective&lt;/b&gt; application for periods beginning on or after &lt;b&gt;1 January 2024&lt;/b&gt;, with earlier application permitted; transition rules apply to entities that early-adopted the 2020 text.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;The 2022 amendments (published on 31 October 2022) also introduced new &lt;b&gt;disclosure&lt;/b&gt; requirements for non-current liabilities subject to covenants to be complied with within the following 12 months. Source: &lt;a href=&quot;https://www.ey.com/en_gl/technical/ifrs-technical-resources/the-iasb-amends-requirements-for-classification-of-non-current-liabilities-with-covenants&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – IFRS technical resources&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part C&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Which item appears as a separate line item in IFRS 18.103 but not in IAS 1.54? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Goodwill&lt;/b&gt;, letter (d).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;A waiver granted after the reporting period is a non-adjusting event (IAS 10).&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Covenant breached on 15/12, loan payable on demand; the bank waives repayment on 20/1, before the financial statements are authorised. Classification at 31/12?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Non-current, thanks to the waiver&lt;/button&gt;&lt;button data-ok&gt;Current&lt;/button&gt;&lt;button&gt;It depends on management&#x27;s intentions&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; What is the difference between IAS 1.55A(b) and IFRS 18.24(b) on subtotals? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;IAS 1: the line items that make up the subtotal must be clear and understandable. IFRS 18: the subtotal must be &lt;b&gt;compatible with the structure of the statement&lt;/b&gt; required by para. 22.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; When is a liquidity-based presentation permitted under IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;When it provides a &lt;em&gt;more useful structured summary&lt;/em&gt; than the current/non-current distinction (IAS 1: information that is &lt;em&gt;reliable and more relevant&lt;/em&gt;).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; Write the equation of the &lt;em&gt;long-term financing approach&lt;/em&gt;. &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Fixed assets + Current assets − Short-term payables = Long-term debt + Equity.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Which event after the reporting period does IFRS 18.B105 add compared with IAS 1.76? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;(d) the &lt;b&gt;settlement&lt;/b&gt; of a liability classified as non-current.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE D --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part D · Performance, equity, cash flows, notes&lt;/span&gt;
  &lt;h2&gt;7 · Statement of profit or loss and other comprehensive income&lt;/h2&gt;

  &lt;h3&gt;Three definitions (IAS 1.7 = IFRS 18 Appendix A)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Profit or loss&lt;/b&gt; — the total of income less expenses, &lt;b&gt;excluding&lt;/b&gt; the components of other comprehensive income.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Other comprehensive income (OCI)&lt;/b&gt; — items of income and expense (including &lt;span class=&quot;term&quot;&gt;reclassification adjustments&lt;/span&gt;) that are &lt;b&gt;not&lt;/b&gt; recognised in profit or loss as required or permitted by other IFRSs.&lt;/div&gt;
    &lt;div class=&quot;def&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;b class=&quot;t&quot;&gt;Total comprehensive income&lt;/b&gt; — the change in equity during a period resulting from transactions and other events, &lt;b&gt;other than&lt;/b&gt; changes resulting from transactions with owners in their capacity as owners (capital increases, dividends…).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Comprehensive income for the period = Profit or loss + Other comprehensive income&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Reclassification adjustment&lt;/span&gt; (formerly known as &lt;em&gt;recycling&lt;/em&gt;): an amount previously recognised in OCI that is reclassified to profit or loss in a subsequent period. Example: the cash flow hedge reserve that is reclassified to profit or loss when the hedged transaction affects profit or loss.&lt;/p&gt;

  &lt;div class=&quot;sim&quot; id=&quot;oci&quot;&gt;
    &lt;h4&gt;Play with the components&lt;/h4&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;&lt;label&gt;Profit or loss: &lt;b id=&quot;pl-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pl&quot; min=&quot;-200&quot; max=&quot;400&quot; step=&quot;10&quot; value=&quot;180&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;OCI that will &lt;b&gt;not&lt;/b&gt; be reclassified (e.g. revaluation surplus): &lt;b id=&quot;o1-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;o1&quot; min=&quot;-150&quot; max=&quot;150&quot; step=&quot;10&quot; value=&quot;40&quot;&gt;
      &lt;label&gt;OCI that &lt;b&gt;will&lt;/b&gt; be reclassified (e.g. cash flow hedge): &lt;b id=&quot;o2-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;o2&quot; min=&quot;-150&quot; max=&quot;150&quot; step=&quot;10&quot; value=&quot;-30&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 200&quot; id=&quot;oci-svg&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart of comprehensive income&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;src&quot;&gt;Waterfall chart: each bar starts where the previous one ends. Figures are chosen by the user.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var s=document.getElementById(&#x27;oci-svg&#x27;);
    function v(i){return +document.getElementById(i).value}
    function draw(){[&#x27;pl&#x27;,&#x27;o1&#x27;,&#x27;o2&#x27;].forEach(function(i){document.getElementById(i+&#x27;-v&#x27;).textContent=v(i)});
      var pl=v(&#x27;pl&#x27;),o1=v(&#x27;o1&#x27;),o2=v(&#x27;o2&#x27;),tot=pl+o1+o2,zero=120,k=0.17,h=&#x27;&#x27;;
      h+=&#x27;&lt;line x1=&quot;20&quot; y1=&quot;&#x27;+zero+&#x27;&quot; x2=&quot;800&quot; y2=&quot;&#x27;+zero+&#x27;&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      var steps=[[&#x27;Profit or loss&#x27;,0,pl,&#x27;var(--brick)&#x27;],[&#x27;OCI – no recycling&#x27;,pl,o1,&#x27;var(--ochre)&#x27;],[&#x27;OCI – recycling&#x27;,pl+o1,o2,&#x27;oklch(65% 0.1 85)&#x27;],[&#x27;Total comprehensive income&#x27;,0,tot,&#x27;var(--sage)&#x27;]];
      steps.forEach(function(st,i){var a=st[1],b=st[1]+st[2],y1=zero-Math.max(a,b)*k,hh=Math.abs(st[2])*k,x=40+i*195;
        h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;140&quot; height=&quot;&#x27;+Math.max(hh,1)+&#x27;&quot; fill=&quot;&#x27;+st[3]+&#x27;&quot; rx=&quot;3&quot;/&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+70)+&#x27;&quot; y=&quot;&#x27;+(y1-6)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&#x27;+(st[2]&gt;0&amp;&amp;i&gt;0&amp;&amp;i&lt;3?&#x27;+&#x27;:&#x27;&#x27;)+st[2]+&#x27;&lt;/text&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(x+70)+&#x27;&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;&#x27;+st[0]+&#x27;&lt;/text&gt;&#x27;;});
      s.innerHTML=h;}
    [&#x27;pl&#x27;,&#x27;o1&#x27;,&#x27;o2&#x27;].forEach(function(i){document.getElementById(i).addEventListener(&#x27;input&#x27;,draw)});draw();})();
  &lt;/script&gt;

  &lt;h3&gt;Where an item of income or expense is recognised&lt;/h3&gt;
  &lt;p&gt;IAS 1.88: all items of income and expense are recognised in &lt;b&gt;profit or loss&lt;/b&gt; unless an IFRS requires or permits otherwise. IAS 1.89 (↔ IFRS 18 B86-B89, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;): some IFRSs require or permit certain items to be recognised &lt;b&gt;outside&lt;/b&gt; profit or loss.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;IAS 8: directly in equity&lt;/b&gt;&lt;br&gt;• &lt;b&gt;correction of errors&lt;/b&gt;&lt;br&gt;• &lt;b&gt;effect of changes in accounting policies&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;gloss&quot;&gt;They adjust the opening balance of retained earnings: they are not performance of the period.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Other IFRSs: in OCI&lt;/b&gt;&lt;br&gt;Components that meet the Conceptual Framework&#x27;s definition of income or expense but that the standards exclude from profit or loss. List below.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Examples of OCI items (IAS 1.7; IFRS 18.B87 with a &quot;different alphabetical order&quot;)&lt;/h4&gt;
  &lt;details&gt;&lt;summary&gt;a · Revaluation surplus (IAS 16, IAS 38)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Changes in the revaluation surplus on property, plant and equipment or intangible assets measured under the &lt;span class=&quot;term&quot;&gt;revaluation model&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;b · Remeasurements of defined benefit plans (IAS 19)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Actuarial gains and losses on defined benefit employee plans (in Italy, for example, the TFR – employee severance indemnity – in IFRS financial statements).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;c · Exchange differences on foreign operations (IAS 21)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Gains and losses arising from translating the financial statements of a foreign subsidiary into the group&#x27;s presentation currency.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;d · Equity instruments designated at FVOCI (IFRS 9 para. 5.7.5)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Non-trading equity investments that the entity irrevocably elects to measure at &lt;span class=&quot;term&quot;&gt;fair value through other comprehensive income&lt;/span&gt; (FVOCI).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;da · Financial assets at FVOCI (IFRS 9 para. 4.1.2A)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Typically debt instruments held both to collect contractual cash flows and for sale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;e · Cash flow hedges (IFRS 9 ch. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;The &lt;b&gt;effective portion&lt;/b&gt; of gains and losses on hedging instruments in a cash flow hedge, and on instruments hedging investments in equity instruments measured at FVOCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;f · Own credit risk (IFRS 9 para. 5.7.7)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;For certain liabilities designated at fair value through profit or loss, the portion of the change in fair value attributable to changes in the entity&#x27;s &lt;b&gt;own credit risk&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;g · Time value of options (IFRS 9 ch. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;When only the intrinsic value of an option is designated as the hedging instrument, changes in its time value are recognised in OCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;h · Forward elements and foreign currency basis spreads (IFRS 9 ch. 6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;When only the spot element of a forward contract is designated as the hedging instrument, changes in the forward element (and in the foreign currency basis spread excluded from the designation) are recognised in OCI.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;i · Insurance finance income/expenses (IFRS 17 para. 88(b), 89(b))&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;For insurance contracts, the portion of insurance finance income or expenses excluded from profit or loss when the entity disaggregates the total using a systematic allocation or to eliminate &lt;span class=&quot;term&quot;&gt;accounting mismatches&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;j · Reinsurance contracts held (IFRS 17 para. 88(b))&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;The same mechanism for reinsurance contracts held.&lt;/div&gt;&lt;/details&gt;

  &lt;h4&gt;OCI section: two groups (IAS 1.82A)&lt;/h4&gt;
  &lt;svg viewBox=&quot;0 0 820 170&quot; role=&quot;img&quot; aria-label=&quot;OCI that will and will not be reclassified&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;130&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Will NOT be reclassified to P/L&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;revaluation surplus · IAS 19 remeasurements&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot;&gt;equity at FVOCI · own credit risk&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;remain outside P/L permanently&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;130&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Will be reclassified when conditions met&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;foreign operation translation · cash flow hedge&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot;&gt;debt instruments at FVOCI&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;sooner or later &quot;pass through&quot; P/L&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;p&gt;The same distinction applies to the share of OCI of associates and joint ventures accounted for using the equity method. Items are classified by &lt;b&gt;nature&lt;/b&gt; within each group.&lt;/p&gt;

  &lt;h3&gt;Presentation choices and basic requirements&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;One statement or two&lt;/b&gt;: IAS 1.10A = IFRS 18.12 (see section 1).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;IAS 1.81A&lt;/b&gt;: in addition to the two sections, the statement presents profit or loss, total OCI and comprehensive income; if P/L is presented separately, it is not repeated in the OCI section. &lt;span class=&quot;verdict v-diff&quot;&gt;Not found in IFRS 18&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Allocation&lt;/b&gt; (IAS 1.81B ↔ IFRS 18.76 and 18.87, &lt;span class=&quot;verdict v-mean&quot;&gt;same content in separate paragraphs&lt;/span&gt;): profit or loss and comprehensive income attributable to &lt;b&gt;non-controlling interests&lt;/b&gt; and to &lt;b&gt;owners of the parent&lt;/b&gt;. In IFRS 18 the allocation of P/L sits &lt;b&gt;outside all the categories&lt;/b&gt; of para. 47.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Minimum line items in profit or loss&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;IFRS 18.75&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;IAS 1.82&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;What changes&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;(a) Required by IFRS 18:&lt;/b&gt; (i) revenue; (ii) &lt;mark&gt;operating expenses&lt;/mark&gt; (with the line items required by para. 78 and 82(a)); (iii) share of the profit or loss of associates and JVs accounted for using the equity method; (iv) income tax expense or income; (v) a single amount for discontinued operations (IFRS 5).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;(b) Required by IFRS 9:&lt;/b&gt; (i) interest revenue calculated using the effective interest method; (ii) impairment losses (Section 5.5); (iii) gains/losses arising from the derecognition of financial assets measured at amortised cost; (iv) the difference between fair value and amortised cost on reclassification to FVTPL; (v) cumulative gains/losses previously recognised in OCI reclassified to P/L on reclassification from FVOCI to FVTPL.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;(c) Required by IFRS 17:&lt;/b&gt; (i) insurance revenue; (ii) insurance service expenses; (iii) income/expenses from reinsurance contracts held; (iv) insurance finance income/expenses; (v) finance income/expenses from reinsurance contracts held.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;(a) revenue, presenting separately interest revenue (effective interest method) and insurance revenue; (aa) derecognition of financial assets measured at amortised cost; (ab) insurance service expenses; (ac) reinsurance; &lt;mark&gt;(b) finance costs&lt;/mark&gt;; (ba) IFRS 9 impairment losses; (bb)-(bc) insurance finance; (c) share of associates and JVs; (ca)-(cb) reclassifications of financial assets; (d) tax expense; (ea) a single amount for discontinued operations.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;verdict v-diff&quot;&gt;There are differences compared to IAS 1.82&lt;/span&gt;&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;IFRS 18 &lt;b&gt;reorganises&lt;/b&gt; the list by source: its own requirements, IFRS 9, IFRS 17.&lt;/li&gt;&lt;li&gt;The line item &lt;b&gt;operating expenses&lt;/b&gt; appears.&lt;/li&gt;&lt;li&gt;In the IFRS 18 list shown in the slides, &lt;b&gt;finance costs&lt;/b&gt; no longer appears as a stand-alone minimum line item: this is linked to the new category-based structure (see section 11).&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Nature vs function&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.99 / 1.104&lt;/h5&gt;An analysis of expenses by &lt;b&gt;nature&lt;/b&gt; or by &lt;b&gt;function&lt;/b&gt;, whichever provides information that is &lt;em&gt;reliable and more relevant&lt;/em&gt;. Entities classifying by function disclose additional information on the nature of expenses, including depreciation and amortisation expense and employee benefits expense.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.78, 18.81&lt;/h5&gt;In the &lt;b&gt;operating category&lt;/b&gt;, expenses are classified in the way that provides the &lt;em&gt;most useful structured summary&lt;/em&gt;, using &lt;b&gt;one or both&lt;/b&gt; characteristics (B80-B85). Example: &lt;span class=&quot;term&quot;&gt;cost of sales&lt;/span&gt; is a by-function line item combining raw materials, employee costs and depreciation.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning, with more detail&lt;/span&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;By nature&lt;/b&gt; (&lt;em&gt;nature expenses&lt;/em&gt;): expenses classified according to the resource consumed, &lt;b&gt;without&lt;/b&gt; reference to the activity for which it was consumed (raw materials, employee benefits, depreciation).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;By function&lt;/b&gt;: expenses allocated and aggregated according to the &lt;b&gt;activity&lt;/b&gt; to which the consumed resource relates (production, selling, administration, R&amp;amp;D). A single nature may be spread across several functions (employee costs in cost of sales and in R&amp;amp;D), and a function may contain several natures.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;sim&quot; id=&quot;nf&quot;&gt;
    &lt;h4&gt;The same statement of profit or loss, two views&lt;/h4&gt;
    &lt;label&gt;Share of employee costs attributed to production: &lt;b id=&quot;nf-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;nf-r&quot; min=&quot;20&quot; max=&quot;90&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;
    &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;n&quot;&gt;By nature&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;f&quot;&gt;By function&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;nf-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div id=&quot;nf-note&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var r=document.getElementById(&#x27;nf-r&#x27;),t=document.getElementById(&#x27;nf-t&#x27;),n=document.getElementById(&#x27;nf-note&#x27;),m=&#x27;n&#x27;;
    var bs=document.querySelectorAll(&#x27;#nf .btnrow button&#x27;);bs.forEach(function(b){b.onclick=function(){m=b.dataset.m;bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});draw()}});
    function row(a,b,bold){return &#x27;&lt;tr&#x27;+(bold?&#x27; style=&quot;font-weight:600;border-top:2px solid var(--ink)&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+a+&#x27;&lt;/td&gt;&lt;td style=&quot;text-align:right&quot;&gt;&#x27;+b+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;}
    function draw(){var p=+r.value/100;document.getElementById(&#x27;nf-v&#x27;).textContent=Math.round(p*100)+&#x27;%&#x27;;
      var rev=1000,mat=300,emp=250,da=100,oth=50,op=rev-mat-emp-da-oth,h=&#x27;&#x27;;
      if(m===&#x27;n&#x27;){h=row(&#x27;Revenue&#x27;,rev)+row(&#x27;Raw materials used&#x27;,-mat)+row(&#x27;Employee benefits expense&#x27;,-emp)+row(&#x27;Depreciation and amortisation&#x27;,-da)+row(&#x27;Other operating expenses&#x27;,-oth)+row(&#x27;Operating profit&#x27;,op,1);n.innerHTML=&#x27;&#x27;;}
      else{var es=emp*p,ea=emp*(1-p)*0.6,er=emp*(1-p)*0.4,cos=mat+es+da*0.7,dist=oth*0.6+ea*0.5,adm=oth*0.4+ea*0.5+da*0.3;
        h=row(&#x27;Revenue&#x27;,rev)+row(&#x27;Cost of sales&#x27;,-Math.round(cos))+row(&#x27;Gross profit&#x27;,rev-Math.round(cos),1)+row(&#x27;Distribution costs&#x27;,-Math.round(dist))+row(&#x27;Administrative expenses&#x27;,-Math.round(adm))+row(&#x27;Research and development&#x27;,-Math.round(er))+row(&#x27;Operating profit&#x27;,rev-Math.round(cos)-Math.round(dist)-Math.round(adm)-Math.round(er),1);
        n.innerHTML=&#x27;&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;An entity presenting by function must disclose in &lt;b&gt;a single note&lt;/b&gt;, for each by-function line item, the totals of depreciation, amortisation, employee benefits, impairment losses and inventory write-downs (IFRS 18.83; this was also addressed in an IFRS Interpretations Committee agenda decision in April 2026). Here: employee costs &#x27;+emp+&#x27; (of which &#x27;+Math.round(es)+&#x27; in cost of sales), D&amp;amp;A &#x27;+da+&#x27;. Source: &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/more-disclosure-when-presenting-operating-expenses-by-function-under-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO Australia&lt;/a&gt;.&lt;/div&gt;&#x27;;}
      t.innerHTML=h;}
    r.addEventListener(&#x27;input&#x27;,draw);draw();})();
  &lt;/script&gt;
  &lt;p class=&quot;src&quot;&gt;Figures invented for the example. Note that &lt;b&gt;operating profit does not change&lt;/b&gt; (≈ 300) as you move the slider: only the allocation across functions changes (small differences are due to rounding).&lt;/p&gt;

  &lt;h3&gt;Items to be disclosed separately&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.98&lt;/h5&gt;Write-downs of inventories (to net realisable value) or of PP&amp;amp;E (to recoverable amount) and their reversals · restructurings and reversals of provisions · disposals of PP&amp;amp;E · disposals of investments · &lt;b&gt;discontinued operations&lt;/b&gt; · litigation settlements · other reversals of provisions.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B79&lt;/h5&gt;(a) inventory write-downs and reversals; (b) &lt;b&gt;impairment&lt;/b&gt; of PP&amp;amp;E and reversals (a separate item); (c) restructurings; (d) disposals of PP&amp;amp;E; (e) disposals of investments; (f) litigation settlements; (g) reversals of provisions; &lt;mark&gt;(h) &lt;b&gt;non-recurring&lt;/b&gt; income and expenses not included in (a)-(g)&lt;/mark&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-diff&quot;&gt;There are differences compared to IAS 1.98&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Discontinued operations disappear (already a stand-alone minimum line item); non-recurring items appear.&lt;/span&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Prohibition of extraordinary items&lt;/b&gt; (IAS 1.87): no items of income or expense may be presented as &quot;extraordinary&quot;, either in the statements or in the notes. A rare event must be shown for what it is (e.g. &quot;restructuring costs&quot;), not labelled as extraordinary. Note that IAS 1.85 nonetheless requires additional line items, headings and subtotals when relevant to an understanding of performance, subject to the same four requirements as subtotals (IAS 1.85A-85B) and a reconciliation with the totals required by IFRSs.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s8&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part D · Performance, equity, cash flows, notes&lt;/span&gt;
  &lt;h2&gt;8 · Statement of cash flows and statement of changes in equity&lt;/h2&gt;
  &lt;h3&gt;Statement of cash flows&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.111&lt;/h5&gt;No requirements of its own: reference to &lt;b&gt;IAS 7 &lt;em&gt;Statement of Cash Flows&lt;/em&gt;&lt;/b&gt;. Cash flow information provides users with a basis to assess the entity&#x27;s ability to generate cash and cash equivalents and its needs to utilise those cash flows.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.3&lt;/h5&gt;Reference to IAS 7, &lt;b&gt;but&lt;/b&gt; the general requirements of IFRS 18 (para. 9-43 and 113-114) also apply to the statement of cash flows. IFRS 18 also sets out the amended paragraphs of IAS 7.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;Among the amendments to IAS 7 introduced by IFRS 18 is the removal of the choice of how to classify &lt;b&gt;interest and dividend&lt;/b&gt; cash flows received and paid; EY lists IAS 7 among the most significant consequential amendments, together with IAS 33 and IAS 34. Sources: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://ifrscommunity.com/?p=7666&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRScommunity – Transition to IFRS 18&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Statement of changes in equity&lt;/h3&gt;
  &lt;p&gt;IAS 1.106 ↔ IFRS 18.107 &lt;span class=&quot;verdict v-same&quot;&gt;remained the same&lt;/span&gt;. The statement includes:&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 820 230&quot; role=&quot;img&quot; aria-label=&quot;Reconciliation of equity&quot;&gt;
    &lt;g font-size=&quot;12.5&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Opening&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;equity&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± IAS 8&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;retrospective&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;restatement&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;80&quot; width=&quot;110&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± Profit&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;or loss&lt;/text&gt;
      &lt;rect x=&quot;420&quot; y=&quot;80&quot; width=&quot;90&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± OCI&lt;/text&gt;
      &lt;rect x=&quot;530&quot; y=&quot;80&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;± Transactions&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;119&quot; text-anchor=&quot;middle&quot;&gt;with owners&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;contributions, dividends&lt;/text&gt;
      &lt;rect x=&quot;690&quot; y=&quot;80&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Closing&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;equity&lt;/text&gt;
      &lt;text x=&quot;410&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;for each component of equity (share capital, reserves, retained earnings, NCI…)&lt;/text&gt;
      &lt;path d=&quot;M290,170 L510,170&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot;&gt;= total comprehensive income (owners / NCI)&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;+ changes in ownership interests in subsidiaries&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;that do not result in a loss of control&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Analysis of OCI by item&lt;/b&gt;, for each component of equity, in the statement or in the notes: IAS 1.106A ↔ IFRS 18.109 &lt;span class=&quot;verdict v-same&quot;&gt;remained the same&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Dividends&lt;/b&gt; recognised as distributions to owners during the period and the related &lt;b&gt;amount per share&lt;/b&gt;: IAS 1.107 ↔ IFRS 18.110 &lt;span class=&quot;verdict v-same&quot;&gt;same content&lt;/span&gt;.&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s9&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part D · Performance, equity, cash flows, notes&lt;/span&gt;
  &lt;h2&gt;9 · Notes to the financial statements&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Notes&lt;/b&gt; (IFRS 18 Appendix A) — information provided in the financial statements &lt;b&gt;in addition&lt;/b&gt; to that presented in the primary financial statements.&lt;/div&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.112&lt;/h5&gt;The notes: present information about the &lt;b&gt;basis of preparation&lt;/b&gt; and the specific accounting policies used; disclose the information required by IFRSs that is not presented elsewhere; provide information not presented elsewhere but &lt;b&gt;relevant&lt;/b&gt; to an understanding of the financial statements.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.113&lt;/h5&gt;Same content, with &quot;not presented in the &lt;b&gt;primary financial statements&lt;/b&gt;&quot; and &quot;&lt;mark&gt;necessary&lt;/mark&gt;&quot; instead of &quot;relevant&quot;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning explained differently&lt;/span&gt;

  &lt;h3&gt;Systematic order and cross-references&lt;/h3&gt;
  &lt;p&gt;IAS 1.113 ↔ IFRS 18.114: notes are presented, as far as practicable, in a &lt;b&gt;systematic&lt;/b&gt; manner, considering understandability and comparability; each item in the statements is &lt;b&gt;cross-referenced&lt;/b&gt; to the related note. &lt;span class=&quot;verdict v-diff&quot;&gt;An additional sentence was added&lt;/span&gt;: &lt;mark&gt;if amounts disclosed in a note are included in one or more line items in the statements, the note must identify those line items&lt;/mark&gt;. This allows the reader to &quot;reconstruct&quot; the figures between note and statement.&lt;/p&gt;
  &lt;p&gt;Examples of ordering (IAS 1.114 ↔ IFRS 18.B112, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;). Step through the three options:&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(a) By relevance&lt;/h4&gt;&lt;p&gt;Giving prominence to the areas of activity that the entity considers &lt;b&gt;most relevant&lt;/b&gt; to an understanding of its performance and position, for example by grouping together information about particular operating activities.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(b) By measurement basis&lt;/h4&gt;&lt;p&gt;Grouping together items &lt;b&gt;measured similarly&lt;/b&gt;, for example all assets measured at fair value.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(c) Following the order of the statements&lt;/h4&gt;&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;statement of compliance with IFRSs (IFRS 18: see IAS 8 para. 6B);&lt;/li&gt;&lt;li&gt;material accounting policy information (IFRS 18: see IAS 8 para. 27A);&lt;/li&gt;&lt;li&gt;supporting information for items presented in the statements, in the order in which each statement and each line item is presented;&lt;/li&gt;&lt;li&gt;other disclosures: &lt;b&gt;contingent liabilities&lt;/b&gt; (IAS 37) and unrecognised contractual commitments; non-financial disclosures, e.g. financial risk management objectives and policies (IFRS 7).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Contingent liability&lt;/span&gt;: a possible obligation whose existence depends on uncertain future events, or a present obligation that is not recognised because an outflow is not probable or cannot be measured reliably; it is disclosed in the notes, not recognised (IAS 37).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part D&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; Write the relationship between comprehensive income, profit or loss and OCI. &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Comprehensive income = Profit or loss + Other comprehensive income.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;IAS 19 remeasurements remain outside P/L permanently.&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Which OCI item will &lt;b&gt;never&lt;/b&gt; be reclassified to profit or loss?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Effective portion of a cash flow hedge&lt;/button&gt;&lt;button&gt;Exchange differences on translating a foreign operation&lt;/button&gt;&lt;button data-ok&gt;Remeasurements of a defined benefit plan&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Correction of a prior-period error: P/L, OCI or equity? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Directly in &lt;b&gt;equity&lt;/b&gt; (retrospective restatement under IAS 8); it appears in the statement of changes in equity as the effect of retrospective restatement.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; An entity wants to label a flood compensation payment as &quot;extraordinary&quot;. May it do so? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No (IAS 1.87). It may, however, present it separately if material, with a clear description; under IFRS 18.B79 it would fall among items with dissimilar characteristics, possibly as non-recurring income/expense (h).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; What does IFRS 18.114 add compared with IAS 1.113? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;If amounts disclosed in a note are included in line items in the statements, the note must identify &lt;b&gt;which line items&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Is the statement of cash flows excluded from the general requirements of IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: the specific requirements are in IAS 7, but the general requirements of IFRS 18 (para. 9-43 and 113-114) also apply to it (IFRS 18.3).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- LESSICO --&gt;
&lt;section id=&quot;s10&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part A · Terminology&lt;/span&gt;
  &lt;h2&gt;10 · Terminology: old names, new names, defined terms&lt;/h2&gt;
  &lt;p&gt;With the 2007 revision, IAS 1 changed many names; the old ones are still found in textbooks, financial statements and conversation. Test yourself: hide the right-hand column and try to recall the terms.&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;term-t&quot;&gt;Hide the 2007 terms&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table id=&quot;term-tab&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Before the 2007 revision&lt;/th&gt;&lt;th&gt;IAS 1 (2007)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;balance sheet&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of financial position&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;cash flow statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of cash flows&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;income statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;statement of comprehensive income (income statement is retained in the two-statement approach)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised in the income statement&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised in profit or loss&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised [directly] in equity (OCI components only)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised in other comprehensive income&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;recognised [directly] in equity (recognition both in OCI and in equity)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;recognised outside profit or loss (in OCI or in equity)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;removed from equity and recognised in profit or loss (&quot;recycling&quot;)&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;reclassified from equity to profit or loss as a reclassification adjustment&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Standard or/and Interpretation&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;IFRSs&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;equity holders&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;owners (exception: &quot;ordinary equity holders&quot;)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;balance sheet date&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;end of the reporting period&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;reporting date&lt;/td&gt;&lt;td class=&quot;nw&quot;&gt;end of the reporting period&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){var b=document.getElementById(&#x27;term-t&#x27;),h=false;b.onclick=function(){h=!h;document.querySelectorAll(&#x27;#term-tab .nw&#x27;).forEach(function(c){c.style.color=h?&#x27;transparent&#x27;:&#x27;&#x27;;c.style.background=h?&#x27;var(--sage-bg)&#x27;:&#x27;&#x27;;c.title=h?&#x27;click to reveal&#x27;:&#x27;&#x27;;});b.textContent=h?&#x27;Show the 2007 terms&#x27;:&#x27;Hide the 2007 terms&#x27;;b.classList.toggle(&#x27;on&#x27;,h)};
    document.querySelectorAll(&#x27;#term-tab .nw&#x27;).forEach(function(c){c.onclick=function(){c.style.color=&#x27;&#x27;;c.style.background=&#x27;&#x27;}});})();
  &lt;/script&gt;

  &lt;h3&gt;IFRS 18 – Appendix A, defined terms cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Definition (paraphrase)&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Notes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Information in the financial statements in addition to that in the primary financial statements.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Operating profit or loss&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The total of all income and expenses classified in the &lt;b&gt;operating category&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Other comprehensive income&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Items of income and expense (including reclassification adjustments) recognised outside profit or loss as required or permitted by other IFRSs.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Aggregation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Adding together items that share characteristics and are included in the same classification.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Classification&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sorting items on the basis of shared characteristics.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Disaggregation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Separating an item into component parts that do not share characteristics.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Material information&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Omitting, misstating or obscuring the information could reasonably be expected to influence the decisions of primary users.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s11&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Context · external source&lt;/span&gt;
  &lt;h2&gt;11 · What IFRS 18 really brings that is new&lt;/h2&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;The slides focus on what IFRS 18 &lt;b&gt;retains&lt;/b&gt; from IAS 1, but mention in passing the &lt;em&gt;operating category&lt;/em&gt;, the &quot;categories described in paragraph 47&quot; and the &quot;statement structure created by paragraph 22&quot;. This section briefly explains these new features, which the slides take for granted. All the content comes from web sources: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://www.ey.com/en_om/insights/ifrs/ifrs-18-changes-financial-performance-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – IFRS 18 changes financial performance reporting&lt;/a&gt;; &lt;a href=&quot;https://dib.no/fagartikler/summary-of-ifrs-18-presentation-and-disclosure-in-the-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DIB – Summary of IFRS 18&lt;/a&gt;.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Five categories&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Management-defined performance measures&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Grouping&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;In profit or loss, income and expenses are classified into &lt;b&gt;five categories&lt;/b&gt;: &lt;b&gt;operating&lt;/b&gt;, &lt;b&gt;investing&lt;/b&gt;, &lt;b&gt;financing&lt;/b&gt;, &lt;b&gt;income taxes&lt;/b&gt; and &lt;b&gt;discontinued operations&lt;/b&gt;. The operating category is the &lt;em&gt;residual&lt;/em&gt; (default) category: it includes everything not classified in the others. Two new required subtotals:&lt;/p&gt;
      &lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-label=&quot;Structure of profit or loss under IFRS 18&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;560&quot; height=&quot;55&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;Operating&lt;/text&gt;&lt;text x=&quot;35&quot; y=&quot;54&quot; font-size=&quot;12&quot;&gt;operating income and expenses (residual category)&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;22&quot; width=&quot;200&quot; height=&quot;32&quot; rx=&quot;16&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Operating profit or loss&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;75&quot; width=&quot;560&quot; height=&quot;45&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;102&quot; font-weight=&quot;700&quot;&gt;Investing&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;102&quot; font-size=&quot;12&quot;&gt;e.g. returns on investments, equity-accounted shares&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;125&quot; width=&quot;200&quot; height=&quot;45&quot; rx=&quot;16&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;Profit or loss before&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;financing and income taxes&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;560&quot; height=&quot;35&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;202&quot; font-weight=&quot;700&quot;&gt;Financing&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;202&quot; font-size=&quot;12&quot;&gt;e.g. interest expense on borrowings&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;222&quot; width=&quot;560&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;242&quot; font-weight=&quot;700&quot;&gt;Income taxes&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;259&quot; width=&quot;560&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;35&quot; y=&quot;279&quot; font-weight=&quot;700&quot;&gt;Discontinued operations&lt;/text&gt;
          &lt;rect x=&quot;600&quot; y=&quot;262&quot; width=&quot;200&quot; height=&quot;28&quot; rx=&quot;14&quot; fill=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;281&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Profit or loss&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;p&gt;Entities with &lt;b&gt;specified main business activities&lt;/b&gt; (e.g. banks that provide financing to customers, entities that invest in assets as a main business activity) classify in the operating category certain income and expenses that would otherwise be classified in investing or financing.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Management-defined performance measures&lt;/span&gt; (MPMs) are subtotals of income and expenses &lt;b&gt;not&lt;/b&gt; specified by IFRSs, used in public communications outside the financial statements to convey management&#x27;s view of performance (e.g. an &quot;adjusted EBITDA&quot;). IFRS 18 does not prohibit them, but brings them &lt;b&gt;inside&lt;/b&gt; the financial statements: &lt;b&gt;a single note&lt;/b&gt; must explain why they are useful and provide a &lt;b&gt;reconciliation&lt;/b&gt; to the most directly comparable IFRS subtotal.&lt;/p&gt;
      &lt;p&gt;Link with the slides: this is the same spirit as the requirements on additional subtotals (IAS 1.55A/85A ↔ IFRS 18.24): &quot;tailor-made&quot; measures are fine, provided they are transparent, consistent over time and not more prominent than IFRS totals.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;IFRS 18 adds guidance on the &lt;b&gt;grouping&lt;/b&gt; of information: when to aggregate or disaggregate, and whether information should be in the primary financial statements (to provide a useful structured summary) or in the notes (to provide material information). These are the definitions of aggregation, classification and disaggregation seen in section 3, made operational.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Practical effects: IFRS 18 applies &lt;b&gt;retrospectively&lt;/b&gt;, with restatement of comparatives; earlier application is permitted.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot; style=&quot;--c:var(--accent);--cb:var(--accent-bg)&quot;&gt;
  &lt;span class=&quot;part-label&quot; style=&quot;background:var(--accent-bg);color:var(--accent)&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Texts, standards and websites cited in the slides&lt;/h2&gt;
  &lt;p&gt;All the entries below are &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;: data and links come from web searches and should be checked against the official text. The slides also cite many other standards (IAS 2, 12, 16, 19, 21, 32, 37, 38, 41; IFRS 5, 7, 9, 17): their texts are collected in the &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation list of standards&lt;/a&gt;.&lt;/p&gt;
  &lt;ul class=&quot;res-list&quot;&gt;
    &lt;li&gt;&lt;h4&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;Issued by the IASB on 9 April 2024, it replaces IAS 1; it applies to annual reporting periods beginning on or after 1 January 2027, including interim financial statements, with earlier application permitted and retrospective application required. It introduces the profit or loss categories, the new subtotals and MPMs. &lt;b&gt;Why it matters:&lt;/b&gt; it is the subject of the lecture and the biggest change in presentation in about twenty years.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-accounting-standards-tracker/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW – IFRS 18 tracker&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/part-i-ifrs/international-financial-reporting-standards/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IFRS 18&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 1 &lt;em&gt;Presentation of Financial Statements&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;General requirements for the presentation, structure and minimum content of financial statements (para. 1-140 plus appendix). Superseded by IFRS 18 from 2027. &lt;b&gt;Why it matters:&lt;/b&gt; it is the benchmark for all the slides; reading it helps to understand where the rules retained by IFRS 18 come from.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;&lt;em&gt;Conceptual Framework for Financial Reporting&lt;/em&gt; (2018)&lt;/h4&gt;
      &lt;p&gt;Published by the IASB on 29 March 2018, it replaces the 2010 version. It sets out the objective of financial reporting, the qualitative characteristics, the definitions of the elements, recognition criteria, a new chapter on measurement, and clarifications on stewardship and prudence. It is not a standard and does not override IFRSs. &lt;b&gt;Why it matters:&lt;/b&gt; the slides refer to it for fair presentation, going concern (para. 3.9) and the definitions of income and expenses.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2018/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – Conceptual Framework (2018 project)&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/part-i-ifrs/international-financial-reporting-standards/iasb-conceptual-framework-for-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – summary&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 8 &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt; (formerly &lt;em&gt;Accounting Policies, Changes in Accounting Estimates and Errors&lt;/em&gt;)&lt;/h4&gt;
      &lt;p&gt;With IFRS 18 it took over from IAS 1 fair presentation and compliance, going concern, the accrual basis and accounting policy disclosures, and was renamed. It remains the standard on accounting policies, estimates and errors. &lt;b&gt;Why it matters:&lt;/b&gt; it explains the references to &quot;6A-6N&quot;, &quot;IAS 8 para. 6B&quot; and &quot;27A&quot;, and the treatment of errors and policy changes in equity.&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 8&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Amendments to IAS 1: &lt;em&gt;Classification of Liabilities as Current or Non-current&lt;/em&gt; (2020) and &lt;em&gt;Non-current Liabilities with Covenants&lt;/em&gt; (2022)&lt;/h4&gt;
      &lt;p&gt;The first (January 2020) bases classification on the right existing at the end of the reporting period; the second (31 October 2022) clarifies that only covenants to be complied with on or before the reporting date count, and adds disclosures on liabilities subject to covenants. Effective from 1 January 2024. &lt;b&gt;Why it matters:&lt;/b&gt; it underpins section 6 and has changed practice regarding loan agreements.&lt;/p&gt;
      &lt;a href=&quot;https://www.ey.com/en_gl/technical/ifrs-technical-resources/the-iasb-amends-requirements-for-classification-of-non-current-liabilities-with-covenants&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY – summary of the 2022 amendments&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2022/10/ias-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – October 2022 news&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 7 &lt;em&gt;Statement of Cash Flows&lt;/em&gt; and supplier finance arrangements&lt;/h4&gt;
      &lt;p&gt;Governs the statement of cash flows, to which IAS 1.111 and IFRS 18.3 refer. The amendments to IAS 7 and IFRS 7 of 25 May 2023 introduced disclosures on supplier finance arrangements (para. 44F-44H), effective from 2024. &lt;b&gt;Why it matters:&lt;/b&gt; it explains the new point (d) of IFRS 18.B111 on trade payables.&lt;/p&gt;
      &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – May 2023 amendments&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;IAS 10 &lt;em&gt;Events after the Reporting Period&lt;/em&gt;&lt;/h4&gt;
      &lt;p&gt;Establishes when financial statements are adjusted for events after the reporting period (adjusting) and when only disclosure in the notes is required (non-adjusting). &lt;b&gt;Why it matters:&lt;/b&gt; refinancing, rectification of breaches and grace periods granted after the reporting period are non-adjusting events (IAS 1.76, IFRS 18.B105).&lt;/p&gt;
      &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-10-events-after-the-reporting-period/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 10&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-faqs/how-to-distinguish-adjusting-from-non-adjusting-events-after-the-reporting-period-under-ias-10&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW – adjusting vs non-adjusting&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Endorsement of IFRS 18 in the European Union&lt;/h4&gt;
      &lt;p&gt;EFRAG issued positive endorsement advice (meeting the technical criteria, consistency with the &lt;em&gt;true and fair view&lt;/em&gt; principle, European public good). According to BDO, the EU endorsed IFRS 18 on 13 February 2026, effective from 1 January 2027; this has not been verified on EUR-Lex. &lt;b&gt;Why it matters:&lt;/b&gt; for European listed companies the standard applies only after endorsement.&lt;/p&gt;
      &lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-submits-to-the-european-commission-its-endorsement-advice-on-ifrs-18-presentation-and&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG – endorsement advice&lt;/a&gt; · &lt;a href=&quot;https://www.bdo.global/en-gb/news/ifrs-news/the-european-union-endorses-ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO – EU endorses IFRS 18&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;h4&gt;Expenses by function: IFRS 18 para. 83&lt;/h4&gt;
      &lt;p&gt;An entity presenting operating expenses by function must disclose in a single note depreciation, amortisation, employee benefits, impairment losses and inventory write-downs for each by-function line item; an IFRIC agenda decision of April 2026 clarified its scope. &lt;b&gt;Why it matters:&lt;/b&gt; it is the evolution of IAS 1.104 cited in the slides.&lt;/p&gt;
      &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/more-disclosure-when-presenting-operating-expenses-by-function-under-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO Australia – disclosure by function&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;src&quot;&gt;The slides do not cite any authors or academic articles: all references are to standards and IASB documents. Links to other lectures of the course are based only on the internal cross-references in this presentation.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;&lt;b&gt;Summary written by Claude from the slides: always check against the material.&lt;/b&gt;&lt;/p&gt;

&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs

    bs.forEach(function(b,i){
      b.setAttribute(&#x27;aria-selected&#x27;,i===0?&#x27;true&#x27;:&#x27;false&#x27;);
      b.addEventListener(&#x27;click&#x27;,function(){
        bs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;)});
        ps.forEach(function(p,j){p.hidden=j!==i});
      });
    });
  });
  // reveal
  document.querySelectorAll(&#x27;.reveal&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){
      var q=b.closest(&#x27;.qa&#x27;);q.classList.toggle(&#x27;open&#x27;);
      b.textContent=q.classList.contains(&#x27;open&#x27;)?&#x27;Hide&#x27;:&#x27;Show answer&#x27;;
    });
  });
  // mcq
  document.querySelectorAll(&#x27;.mcq&#x27;).forEach(function(m){
    var fb=m.querySelector(&#x27;.fb&#x27;);
    m.querySelectorAll(&#x27;.opts button&#x27;).forEach(function(b){
      b.addEventListener(&#x27;click&#x27;,function(){
        var ok=b.hasAttribute(&#x27;data-ok&#x27;);
        b.classList.add(ok?&#x27;ok&#x27;:&#x27;ko&#x27;);
        if(ok){m.querySelectorAll(&#x27;.opts button&#x27;).forEach(function(x){x.disabled=true});}
        fb.textContent=ok?&#x27;✓ Correct. &#x27;+(m.dataset.why||&#x27;&#x27;):&#x27;✗ Not this one: try again.&#x27;;
      });
    });
  });
  // steppers
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),pv=s.querySelector(&#x27;.prev&#x27;),nx=s.querySelector(&#x27;.next&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function go(n){i=Math.max(0,Math.min(st.length-1,n));st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j===i)});pv.disabled=i===0;nx.disabled=i===st.length-1;}
    pv.addEventListener(&#x27;click&#x27;,function(){go(i-1)});nx.addEventListener(&#x27;click&#x27;,function(){go(i+1)});go(0);
  });
  // progress + nav
  var prog=document.getElementById(&#x27;prog&#x27;),links=[].slice.call(document.querySelectorAll(&#x27;nav.top a&#x27;)),secs=links.map(function(a){return document.querySelector(a.getAttribute(&#x27;href&#x27;))});

  window.addEventListener(&#x27;scroll&#x27;,onScroll,{passive:true});onScroll();
  window.__ifrs=window.__ifrs||[];window.__ifrs.forEach(function(f){f()});
})();
