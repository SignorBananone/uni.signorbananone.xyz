  &lt;h1&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;From IAS 1 to the new standard: what stays, what changes, and why it matters.&lt;/p&gt;
  &lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&lt;b&gt;Course&lt;/b&gt; Master Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;&lt;b&gt;Lecturer&lt;/b&gt; Prof. Roberto Aprile&lt;/span&gt;&lt;span&gt;&lt;b&gt;Institution&lt;/b&gt; University of Bergamo – Department of Management&lt;/span&gt;&lt;span&gt;&lt;b&gt;Academic year&lt;/b&gt; 2026-2027&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot; style=&quot;margin-top:1.6rem&quot;&gt;The slides almost always proceed in &lt;b&gt;pairs&lt;/b&gt;: a paragraph of &lt;span class=&quot;term&quot;&gt;IAS 1&lt;/span&gt; (in blue in the material) next to the corresponding paragraph of &lt;span class=&quot;term&quot;&gt;IFRS 18&lt;/span&gt; (in red), with a verdict in green: &lt;em&gt;exactly the same content&lt;/em&gt;, &lt;em&gt;same meaning&lt;/em&gt;, &lt;em&gt;slight changes&lt;/em&gt;, &lt;em&gt;there are differences&lt;/em&gt;. This canvas follows the same pattern, but explains in plain language what lies behind the wording of the standards and clearly flags where the substance actually changes.&lt;/p&gt;
  &lt;div class=&quot;box&quot; style=&quot;margin-top:1.4rem&quot;&gt;
    &lt;b&gt;How to read this page.&lt;/b&gt; The blue/red boxes side by side compare &lt;span style=&quot;color:var(--ias);font-weight:600&quot;&gt;IAS 1&lt;/span&gt; and &lt;span style=&quot;color:var(--ifrs);font-weight:600&quot;&gt;IFRS 18&lt;/span&gt;. The labels
    &lt;span class=&quot;verdict v-same&quot;&gt;identical&lt;/span&gt; &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt; &lt;span class=&quot;verdict v-diff&quot;&gt;differences&lt;/span&gt; reflect the assessment given in the slides.
    The dashed boxes marked &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt; contain information taken from the web, &lt;b&gt;not&lt;/b&gt; from the slides. Each part ends with a self-assessment.
  &lt;/div&gt;

&lt;!-- PARTE A --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part A · Framework&lt;/span&gt;
  &lt;h2&gt;1 · From IAS 1 to IFRS 18: objective, scope, complete set&lt;/h2&gt;

  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;IAS 1 Presentation of Financial Statements&lt;/span&gt; is the &quot;umbrella&quot; standard of IFRS financial statements: it does not say &lt;em&gt;how&lt;/em&gt; to measure inventories or a lease (the other standards do that), but &lt;b&gt;how to present&lt;/b&gt; the financial statements as a whole: which statements, what structure, what minimum content, and some general concepts such as &lt;span class=&quot;term&quot;&gt;going concern&lt;/span&gt;, the &lt;span class=&quot;term&quot;&gt;accrual basis&lt;/span&gt; of accounting and the &lt;span class=&quot;term&quot;&gt;current/non-current&lt;/span&gt; distinction.&lt;/p&gt;

  &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Timeline IAS 1 – IFRS 18&quot;&gt;
    &lt;line x1=&quot;40&quot; y1=&quot;70&quot; x2=&quot;870&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;

      &lt;circle cx=&quot;210&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--ias)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1/1/2009&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;IAS 1 (2007) effective&lt;/text&gt;

  &lt;h3&gt;Objective (para. 1)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.1&lt;/h5&gt;The standard &lt;b&gt;prescribes&lt;/b&gt; the basis for the presentation of &lt;span class=&quot;term&quot;&gt;general purpose financial statements&lt;/span&gt; (financial statements intended for a broad range of users rather than a specific recipient), to ensure &lt;b&gt;comparability&lt;/b&gt; over time and with other entities. It sets out presentation requirements, guidelines on structure and minimum content.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.1&lt;/h5&gt;The standard &lt;b&gt;sets out requirements&lt;/b&gt; for the &lt;b&gt;presentation&lt;/b&gt; and &lt;b&gt;disclosure&lt;/b&gt; (typically in the notes) of information in financial statements, so that they provide &lt;b&gt;relevant information&lt;/b&gt; that faithfully represents assets, liabilities, equity, income and expenses.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning&lt;/span&gt;
  &lt;p&gt;Two nuances are worth noting: IFRS 18 explicitly names &lt;b&gt;disclosure&lt;/b&gt; alongside presentation (as its title also says: &lt;em&gt;Presentation and Disclosure&lt;/em&gt;), and it links the objective to the two fundamental qualitative characteristics of the &lt;span class=&quot;term&quot;&gt;Conceptual Framework&lt;/span&gt;: &lt;span class=&quot;term&quot;&gt;relevance&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;faithful representation&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Scope (para. 2-8)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.2-3&lt;/h5&gt;Applies in &lt;b&gt;preparing&lt;/b&gt; and presenting general purpose financial statements in accordance with IFRSs. Other IFRSs set out the recognition, measurement and disclosure requirements for specific transactions.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.2, 18.4&lt;/h5&gt;Applies in presenting and &lt;b&gt;disclosing&lt;/b&gt; information in financial statements prepared in accordance with IFRS Accounting Standards. Other IFRSs set out recognition, measurement, &lt;b&gt;presentation&lt;/b&gt; and disclosure requirements.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning&lt;/span&gt;

  &lt;h3&gt;The purpose of financial statements (para. 9)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.9&lt;/h5&gt;A structured representation of the &lt;span class=&quot;term&quot;&gt;financial position&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;financial performance&lt;/span&gt; of an entity, with information on &lt;span class=&quot;term&quot;&gt;cash flows&lt;/span&gt;, useful to &lt;b&gt;a wide range of users&lt;/b&gt; in making economic decisions. Together with the notes, it helps users predict future cash flows, their &lt;em&gt;timing&lt;/em&gt; and their &lt;em&gt;certainty&lt;/em&gt;.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.9&lt;/h5&gt;To provide information about assets, liabilities, equity, income and expenses that is useful in assessing (1) the &lt;b&gt;prospects for future net cash inflows&lt;/b&gt; and (2) management&#x27;s &lt;span class=&quot;term&quot;&gt;stewardship&lt;/span&gt;, i.e. how well management discharges its responsibilities over the entity&#x27;s economic resources.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Substantially the same meaning of IAS 1.9&lt;/span&gt;

  &lt;h3&gt;The complete set of financial statements (para. 10-14)&lt;/h3&gt;
  &lt;p&gt;Click on the statements to see what question each answers, and compare the lists in the two standards.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;IFRS 18.10&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;IAS 1.10&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The questions they answer&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;&lt;mark&gt;statement (or statements) of &lt;b&gt;financial performance&lt;/b&gt;&lt;/mark&gt; for the reporting period (see para. 12)&lt;/li&gt;
        &lt;li&gt;statement of &lt;b&gt;financial position&lt;/b&gt; as at the end of the period&lt;/li&gt;
        &lt;li&gt;statement of &lt;b&gt;changes in equity&lt;/b&gt;&lt;/li&gt;
        &lt;li&gt;statement of &lt;b&gt;cash flows&lt;/b&gt;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;notes&lt;/b&gt;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;comparative information&lt;/b&gt; in respect of the preceding period (para. 31-32)&lt;/li&gt;
        &lt;li&gt;statement of financial position &lt;b&gt;as at the beginning of the preceding period&lt;/b&gt;, if required by para. 37&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;statement of financial position as at the end of the period&lt;/li&gt;
        &lt;li&gt;&lt;mark&gt;statement of profit or loss and other comprehensive income&lt;/mark&gt; and statement of changes in equity&lt;/li&gt;
        &lt;li&gt;statement of cash flows&lt;/li&gt;
        &lt;li&gt;notes, comprising material accounting policy information and other explanatory information&lt;/li&gt;
        &lt;li&gt;(ea) comparative information (para. 38 and 38A)&lt;/li&gt;
        &lt;li&gt;(f) statement of financial position as at the beginning of the preceding period in the case of retrospective application, restatement or reclassification (para. 40A-40D)&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;svg viewBox=&quot;0 0 860 230&quot; role=&quot;img&quot; aria-label=&quot;The five components of the financial statements&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;performance&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;How much did&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;I earn in the&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;period?&lt;/text&gt;
          &lt;rect x=&quot;180&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;position&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;What do I own and&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;what do I owe&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;at period end?&lt;/text&gt;

          &lt;rect x=&quot;690&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;770&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Notes&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;How do I read and&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot;&gt;break down the&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;figures above?&lt;/text&gt;

  &lt;p&gt;&lt;span class=&quot;verdict v-same&quot;&gt;The complete set remains the same&lt;/span&gt; The only change in form: IFRS 18 lists the &lt;span class=&quot;term&quot;&gt;statement of financial performance&lt;/span&gt; first, a name that covers both the single statement of profit or loss and OCI and the two separate statements.&lt;/p&gt;

  &lt;h4&gt;Titles of the statements and the &quot;one or two statements&quot; choice&lt;/h4&gt;
  &lt;p&gt;IAS 1.10 allows &lt;b&gt;other titles&lt;/b&gt; to be used (e.g. &quot;statement of comprehensive income&quot;). For performance, IAS 1.10A and IFRS 18.12 offer the same choice, illustrated below. &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Single-statement and two-statement approach&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;text x=&quot;200&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;(a) Single statement&lt;/text&gt;
      &lt;rect x=&quot;80&quot; y=&quot;32&quot; width=&quot;240&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;rect x=&quot;92&quot; y=&quot;44&quot; width=&quot;216&quot; height=&quot;80&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Profit or loss section&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;(first)&lt;/text&gt;
      &lt;rect x=&quot;92&quot; y=&quot;130&quot; width=&quot;216&quot; height=&quot;52&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;OCI section (directly after)&lt;/text&gt;
      &lt;text x=&quot;630&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;(b) Two statements&lt;/text&gt;
      &lt;rect x=&quot;470&quot; y=&quot;32&quot; width=&quot;150&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Statement of&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;profit or loss&lt;/text&gt;
      &lt;path d=&quot;M625,112 L660,112&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
      &lt;rect x=&quot;665&quot; y=&quot;32&quot; width=&quot;170&quot; height=&quot;160&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Statement of&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;comprehensive income&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;begins with&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;profit or loss&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;+ OCI&lt;/text&gt;
      &lt;text x=&quot;645&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;the first immediately precedes the second&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;h4&gt;What lies &lt;em&gt;outside&lt;/em&gt; the financial statements&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Financial review by management&lt;/b&gt; (IAS 1.13 ↔ IFRS 18.8). A report by management, &lt;b&gt;separate&lt;/b&gt; from the financial statements, that describes and explains the main features of the entity&#x27;s financial performance and financial position and the principal &lt;b&gt;uncertainties&lt;/b&gt; it faces. It may cover: the main factors influencing performance (the changing environment, the entity&#x27;s response, its investment and dividend policy); the sources of funding and the targeted ratio of liabilities to equity; and resources &lt;b&gt;not&lt;/b&gt; recognised in the statement of financial position under IFRSs. &lt;br&gt;&lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; In Italy, this is essentially the role of the &lt;em&gt;relazione sulla gestione&lt;/em&gt; (management report).&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Environmental reports and value added statements&lt;/b&gt; (IAS 1.14). Environmental reports and value added statements, common in industries where environmental factors are significant or where employees are an important user group. &lt;br&gt;&lt;b&gt;Anything presented outside the financial statements is outside the scope of IFRSs.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part A&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; From what date does IFRS 18 replace IAS 1, and from when was the 2007 version of IAS 1 effective? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;IFRS 18: annual periods beginning on or after &lt;b&gt;1 January 2027&lt;/b&gt;. IAS 1 (reissued in September 2007): periods beginning on or after &lt;b&gt;1 January 2009&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Which two purposes does IFRS 18.9 add explicitly compared with the wording of IAS 1.9? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Assessing the &lt;b&gt;prospects for future net cash inflows&lt;/b&gt; and assessing management&#x27;s &lt;b&gt;stewardship&lt;/b&gt; of the entity&#x27;s economic resources. The slides nonetheless judge the meaning to be &quot;substantially the same&quot;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Which of these documents falls within the scope of IFRSs?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;The financial review by management&lt;/button&gt;&lt;button data-ok&gt;The notes&lt;/button&gt;&lt;button&gt;The value added statement&lt;/button&gt;&lt;button&gt;The environmental report&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; Does the complete set change with the move to IFRS 18? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No: the slides conclude that &quot;the complete set of financial statements remains the same&quot;. What changes is the name of the performance statement (&lt;em&gt;statement(s) of financial performance&lt;/em&gt;), which is now listed first.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE B --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part B · General principles&lt;/span&gt;
  &lt;h2&gt;2 · Basis of preparation: fair presentation, going concern, accrual&lt;/h2&gt;
  &lt;p&gt;In IAS 1 these principles were in para. 15-28; in the slides the IFRS 18 counterpart is shown as &lt;b&gt;&quot;Basis of preparation – General matters&quot;, para. 6A-6N&lt;/b&gt;, with content that is &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;Where do these paragraphs actually sit? With the issue of IFRS 18, the IASB moved fair presentation and compliance, going concern, the accrual basis and the disclosure of accounting policies from IAS 1 to &lt;b&gt;IAS 8&lt;/b&gt;, renamed &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt;. This is also confirmed by one of the course slides (IFRS 18.B112), which refers to &quot;paragraph 6B of IAS 8&quot; for the statement of compliance. &quot;6A-6N&quot; should therefore be read as &lt;b&gt;IAS 8.6A-6N&lt;/b&gt; as amended by IFRS 18. Source: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 8 Basis of Preparation of Financial Statements&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Fair presentation and compliance with IFRSs&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Fair presentation&lt;/b&gt; (IAS 1.15) — financial statements shall present &lt;em&gt;fairly&lt;/em&gt; the financial position, financial performance and cash flows of an entity. This requires the faithful representation of the effects of transactions, other events and conditions in accordance with the &lt;b&gt;definitions and recognition criteria&lt;/b&gt; for assets, liabilities, income and expenses set out in the &lt;span class=&quot;term&quot;&gt;Conceptual Framework for Financial Reporting&lt;/span&gt; (the IASB document that establishes the objective and fundamental concepts of financial reporting). The application of IFRSs, with additional disclosure when necessary, is &lt;b&gt;presumed&lt;/b&gt; to result in a fair presentation.&lt;/div&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Statement of compliance&lt;/b&gt; (IAS 1.16 ↔ 6A-6B): an entity complying with IFRSs makes an &lt;b&gt;explicit and unreserved&lt;/b&gt; statement of such compliance in the notes; financial statements cannot be described as complying with IFRSs unless they comply with &lt;b&gt;all&lt;/b&gt; the requirements.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Notes do not rectify errors&lt;/b&gt; (IAS 1.18 ↔ 6D): inappropriate accounting policies are not rectified by disclosing them in the notes.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Departure&lt;/b&gt; (IAS 1.19 ↔ 6E): in &lt;b&gt;extremely rare&lt;/b&gt; circumstances, if compliance with a requirement would be so misleading that it would conflict with the objective of financial statements set out in the Conceptual Framework, the entity &lt;b&gt;shall&lt;/b&gt; depart from it, if the relevant regulatory framework requires, or does not prohibit, such a departure.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;b&gt;What must an entity that departs from a requirement disclose?&lt;/b&gt; Step through the requirements (IAS 1.20 ↔ IFRS 18.6F, &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same content&lt;/span&gt;).&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Step 0 · The precondition&lt;/h4&gt;&lt;p&gt;Management concludes that compliance with an IFRS requirement would be &lt;b&gt;so misleading&lt;/b&gt; that it would conflict with the objective of financial statements. This is an exceptional case, not a loophole: the rule remains the application of IFRSs.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(a) Fair presentation&lt;/h4&gt;&lt;p&gt;That management has concluded that the financial statements present fairly the entity&#x27;s financial position, financial performance and cash flows.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(b) Compliance with an exception&lt;/h4&gt;&lt;p&gt;That the entity has complied with applicable IFRSs &lt;b&gt;except&lt;/b&gt; that it has departed from a particular requirement to achieve a fair presentation.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(c) What, why, how&lt;/h4&gt;&lt;p&gt;The title of the IFRS from which the entity has departed, the nature of the departure, the treatment that the IFRS would require, the &lt;b&gt;reason&lt;/b&gt; why that treatment would be misleading, and the treatment adopted.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;(d) The numerical effect&lt;/h4&gt;&lt;p&gt;For each period presented, the &lt;b&gt;financial effect&lt;/b&gt; of the departure on each item that would have been reported in complying with the requirement.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Past departures&lt;/h4&gt;&lt;p&gt;If a departure in a &lt;b&gt;prior&lt;/b&gt; period still affects the amounts recognised in the current period, disclosures (c) and (d) must be provided (IAS 1.21 ↔ IFRS 18.6G, &lt;span class=&quot;verdict v-same&quot;&gt;same content&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Going concern&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Going concern&lt;/b&gt; — the Conceptual Framework (para. 3.9) notes that financial statements are normally prepared on the assumption that the entity &lt;b&gt;will continue in operation for the foreseeable future&lt;/b&gt;. This is why assets are measured with reference to their use, not to the price obtainable in a forced sale.&lt;/div&gt;
  &lt;p&gt;IAS 1.25 ↔ IFRS 18 &quot;6K-6L&quot; &lt;span class=&quot;verdict v-same&quot;&gt;exactly the same content&lt;/span&gt;. Try the decision path:&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;gc&quot;&gt;
    &lt;h4&gt;Management&#x27;s decision tree&lt;/h4&gt;
    &lt;div id=&quot;gc-q&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;btnrow&quot; id=&quot;gc-b&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;gc-r&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var Q={
      s:{q:&#x27;Does management intend to liquidate the entity or to cease trading, or does it have no realistic alternative but to do so?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;nogc&#x27;],[&#x27;No&#x27;,&#x27;u&#x27;]]},
      u:{q:&#x27;In making its going concern assessment, is management aware of material uncertainties related to events or conditions that may cast significant doubt upon the entity\&#x27;s ability to continue as a going concern?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;mu&#x27;],[&#x27;No&#x27;,&#x27;ok&#x27;]]},
      nogc:{r:&#x27;Financial statements &lt;b&gt;not&lt;/b&gt; prepared on a going concern basis. The entity must disclose that fact, the &lt;b&gt;basis&lt;/b&gt; on which the financial statements are prepared and the &lt;b&gt;reason&lt;/b&gt; why the entity is not regarded as a going concern.&#x27;,c:&#x27;cur&#x27;},
      mu:{r:&#x27;Financial statements prepared on a going concern basis, but with &lt;b&gt;disclosure of the material uncertainties&lt;/b&gt;.&#x27;,c:&#x27;nc&#x27;},
      ok:{r:&#x27;Financial statements prepared on a going concern basis, with no specific disclosure.&#x27;,c:&#x27;nc&#x27;}
    };
    var q=document.getElementById(&#x27;gc-q&#x27;),b=document.getElementById(&#x27;gc-b&#x27;),r=document.getElementById(&#x27;gc-r&#x27;);
    function show(k){var n=Q[k];b.innerHTML=&#x27;&#x27;;r.innerHTML=&#x27;&#x27;;
      if(n.q){q.innerHTML=&#x27;&lt;p&gt;&#x27;+n.q+&#x27;&lt;/p&gt;&#x27;;n.a.forEach(function(x){var e=document.createElement(&#x27;button&#x27;);e.className=&#x27;btn&#x27;;e.textContent=x[0];e.onclick=function(){show(x[1])};b.appendChild(e)});}
      else{q.innerHTML=&#x27;&#x27;;r.innerHTML=&#x27;&lt;div class=&quot;result &#x27;+n.c+&#x27;&quot;&gt;&#x27;+n.r+&#x27;&lt;/div&gt;&#x27;;var e=document.createElement(&#x27;button&#x27;);e.className=&#x27;btn&#x27;;e.textContent=&#x27;↺ Start again&#x27;;e.onclick=function(){show(&#x27;s&#x27;)};b.appendChild(e);}
    }
    show(&#x27;s&#x27;);
  })();
  &lt;/script&gt;
  &lt;p class=&quot;src&quot;&gt;The first step is always the same: when preparing financial statements, management &lt;b&gt;shall&lt;/b&gt; make an assessment of the entity&#x27;s ability to continue as a going concern (IAS 1.25).&lt;/p&gt;

  &lt;h3&gt;Accrual basis of accounting&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Accrual basis&lt;/b&gt; — IAS 1.27 ↔ IFRS 18 &quot;6M&quot;: financial statements are prepared using the accrual basis of accounting, &lt;b&gt;except for cash flow information&lt;/b&gt;. Income and expenses are recognised in the period in which the transactions occur, not in the period in which cash is received or paid.&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Example.&lt;/b&gt; In December 2026 an entity sells goods for 100, with payment received in February 2027. Under the accrual basis, the revenue of 100 belongs to &lt;b&gt;2026&lt;/b&gt; (a receivable arises); in the statement of cash flows the receipt of 100 will appear in &lt;b&gt;2027&lt;/b&gt;. This is why the statement of cash flows is the only exception.&lt;/div&gt;

  &lt;h3&gt;Consistency of presentation (para. 45-46)&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.45&lt;/h5&gt;The &lt;b&gt;presentation and classification&lt;/b&gt; of items is retained from one period to the next unless (a) after a significant change in the nature of operations or a review of the financial statements another presentation would be more appropriate under the criteria of IAS 8, or (b) an IFRS requires a change.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.45&lt;/h5&gt;Presentation, &lt;mark&gt;disclosure&lt;/mark&gt; and classification are retained, with the same two exceptions; the reference is to &quot;IAS 8 &lt;em&gt;Basis of Preparation of Financial Statements&lt;/em&gt;&quot; (see B12).&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;Consistency now explicitly covers disclosure in the notes as well.&lt;/span&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part B · General principles&lt;/span&gt;
  &lt;h2&gt;3 · Materiality, aggregation and offsetting&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Material information&lt;/b&gt; (IAS 1.7 = IFRS 18.B1 and Appendix A) — information is &lt;span class=&quot;term&quot;&gt;material&lt;/span&gt; if &lt;b&gt;omitting&lt;/b&gt;, &lt;b&gt;misstating&lt;/b&gt; or &lt;b&gt;obscuring&lt;/b&gt; it could reasonably be expected to influence decisions that the &lt;span class=&quot;term&quot;&gt;primary users&lt;/span&gt; (existing and potential investors, lenders and other creditors) make on the basis of those financial statements.&lt;/div&gt;
  &lt;span class=&quot;verdict v-same&quot;&gt;Kept the same definition&lt;/span&gt;

  &lt;svg viewBox=&quot;0 0 860 170&quot; role=&quot;img&quot; aria-label=&quot;Three ways of making information unusable&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;145&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Omitting&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;the information is missing&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;e.g. a litigation is not disclosed&lt;/text&gt;
      &lt;rect x=&quot;305&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Misstating&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;it is there, but it is wrong&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;e.g. incorrect amount&lt;/text&gt;
      &lt;rect x=&quot;590&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;120&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;&lt;text x=&quot;715&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Obscuring&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;it is there, but it is hidden&lt;/text&gt;&lt;text x=&quot;715&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;e.g. buried in immaterial detail&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;430&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink2)&quot;&gt;in all three cases what matters is the possible effect on primary users&#x27; decisions&lt;/text&gt;
  &lt;/svg&gt;

  &lt;p&gt;&lt;b&gt;IFRS 18.B4&lt;/b&gt; adds that, in assessing materiality, an entity must consider both the &lt;b&gt;characteristics of the users&lt;/b&gt; &lt;em&gt;and&lt;/em&gt; its &lt;b&gt;own circumstances&lt;/b&gt;. Materiality is therefore not a fixed numerical threshold: it depends on who reads the financial statements and on the context (nature and amount together).&lt;/p&gt;

  &lt;h3&gt;Aggregation: what must be shown separately&lt;/h3&gt;
  &lt;p&gt;IAS 1.29: an entity presents separately &lt;b&gt;each material class of similar items&lt;/b&gt;; items of a &lt;b&gt;dissimilar nature or function&lt;/b&gt; are presented separately unless they are immaterial. The IFRS 18 definitions (Appendix A) make the mechanism explicit:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Classification&lt;/b&gt; — sorting assets, liabilities, equity, income, expenses and cash flows on the basis of &lt;b&gt;shared characteristics&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Aggregation&lt;/b&gt; — &lt;b&gt;adding together&lt;/b&gt; items that share characteristics and are included in the same classification.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Disaggregation&lt;/b&gt; — &lt;b&gt;separating&lt;/b&gt; an item into component parts that do &lt;b&gt;not&lt;/b&gt; share characteristics.&lt;/div&gt;
    &lt;div class=&quot;box tint&quot; style=&quot;margin:1rem 0&quot;&gt;&lt;b&gt;Rule of thumb.&lt;/b&gt; Aggregate what is similar, disaggregate what is different, up to the point where the information remains material without becoming &quot;noise&quot;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sim&quot; id=&quot;agg&quot;&gt;
    &lt;h4&gt;Try it: aggregate or disaggregate?&lt;/h4&gt;
    &lt;p style=&quot;font-size:.92rem&quot;&gt;Five receivables ranging from 20 to 400. Move the materiality threshold (the entity&#x27;s judgement) and see how the presentation changes: items below the threshold and of a similar nature are combined into &quot;other receivables&quot;.&lt;/p&gt;
    &lt;label for=&quot;agg-r&quot;&gt;Materiality threshold: &lt;b id=&quot;agg-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;agg-r&quot; min=&quot;10&quot; max=&quot;450&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;
    &lt;svg viewBox=&quot;0 0 820 200&quot; id=&quot;agg-svg&quot; role=&quot;img&quot; aria-label=&quot;Aggregation chart&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;src&quot;&gt;Teaching example built for this summary (invented figures). In practice, materiality also considers the nature of the item, not just its amount: a receivable from related parties may be material even if small.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var items=[[&#x27;Trade receivables&#x27;,400,&#x27;t&#x27;],[&#x27;Receivables from related parties&#x27;,35,&#x27;r&#x27;],[&#x27;Prepayments&#x27;,60,&#x27;p&#x27;],[&#x27;Other: deposits&#x27;,20,&#x27;o&#x27;],[&#x27;Other: tax refunds&#x27;,45,&#x27;o&#x27;]];
    var r=document.getElementById(&#x27;agg-r&#x27;),v=document.getElementById(&#x27;agg-v&#x27;),s=document.getElementById(&#x27;agg-svg&#x27;);
    function draw(){var th=+r.value;v.textContent=th;var shown=[],other=0;
      items.forEach(function(it){if(it[1]&gt;=th||it[2]===&#x27;r&#x27;)shown.push(it);else other+=it[1]});
      if(other)shown.push([&#x27;Other receivables (aggregated)&#x27;,other,&#x27;agg&#x27;]);
      var h=&#x27;&#x27;;shown.forEach(function(it,i){var y=12+i*31,w=it[1]*1.1;var c=it[2]===&#x27;agg&#x27;?&#x27;var(--ochre)&#x27;:it[2]===&#x27;r&#x27;?&#x27;var(--brick)&#x27;:&#x27;var(--slate)&#x27;;
        h+=&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12.5&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;240&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;&#x27;+c+&#x27;&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;&#x27;+(246+w)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12.5&quot;&gt;&#x27;+it[1]+&#x27;&lt;/text&gt;&#x27;;});
      h+=&#x27;&lt;line x1=&quot;&#x27;+(240+th*1.1)+&#x27;&quot; y1=&quot;0&quot; x2=&quot;&#x27;+(240+th*1.1)+&#x27;&quot; y2=&quot;195&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&#x27;;
      s.innerHTML=h;}
    r.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;h3&gt;&quot;Required&quot; but immaterial disclosures&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.31&lt;/h5&gt;An entity need not provide a specific disclosure required by an IFRS if the information is &lt;b&gt;not material&lt;/b&gt;, even if the IFRS lists it as a minimum requirement. Conversely, it considers whether to provide &lt;b&gt;additional disclosures&lt;/b&gt; when compliance with the specific requirements is insufficient to enable users to understand the impact of transactions, other events and conditions.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.19-20&lt;/h5&gt;Same principle, extended to &lt;b&gt;presentation&lt;/b&gt; in the primary financial statements &lt;b&gt;and&lt;/b&gt; disclosure in the notes: no requirement if not material; additional information if compliance is insufficient.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.31&lt;/span&gt;
  &lt;p&gt;Materiality therefore works in &lt;b&gt;two directions&lt;/b&gt;: it removes what is superfluous (even if &quot;required&quot;) and adds what is missing (even if &quot;not required&quot;).&lt;/p&gt;

  &lt;h3&gt;Offsetting&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;t&quot;&gt;Offsetting&lt;/b&gt; — IAS 1.32 ↔ IFRS 18.44: an entity does &lt;b&gt;not&lt;/b&gt; offset assets and liabilities or income and expenses, unless required or permitted by an IFRS (IFRS 18 refers to B27-B28).&lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Why it matters.&lt;/b&gt; A receivable of 500 from a customer and a payable of 450 to the same counterparty, shown as a &quot;net receivable of 50&quot;, conceal the real exposure: the reader would see 50 instead of a credit risk on 500 and an obligation of 450.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part B · General principles&lt;/span&gt;
  &lt;h2&gt;4 · Comparative information, identification, frequency&lt;/h2&gt;

  &lt;h3&gt;Comparative information&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.38 / 38A&lt;/h5&gt;Unless otherwise permitted or required, comparative information in respect of the preceding period for &lt;b&gt;all amounts&lt;/b&gt;; for narrative and descriptive information, if &lt;b&gt;relevant&lt;/b&gt;. Minimum: &lt;b&gt;two&lt;/b&gt; statements of financial position, two statements of P&amp;amp;L and OCI (or two separate statements of P&amp;amp;L), two statements of cash flows, two statements of changes in equity, and related notes.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.31-32&lt;/h5&gt;Comparatives for all amounts; for narrative and descriptive information if &lt;mark&gt;necessary&lt;/mark&gt; to understand the current period&#x27;s financial statements (see B13). The current and preceding periods are presented in &lt;b&gt;each&lt;/b&gt; primary financial statement and in the notes (additional comparatives: B14-B15).&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;On the slide the second heading reads &quot;IAS 1 – Comparative information&quot;, but the text and the cross-reference are those of IFRS 18.32.&lt;/span&gt;

  &lt;h3&gt;The third statement of financial position&lt;/h3&gt;
  &lt;p&gt;IAS 1.40A ↔ IFRS 18.37: an additional statement of financial position &lt;b&gt;as at the beginning of the preceding period&lt;/b&gt; is presented when &lt;b&gt;both&lt;/b&gt; conditions are met. Tick the two boxes:&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;tsfp&quot;&gt;
    &lt;div class=&quot;cls&quot;&gt;
      &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;t1&quot;&gt; (a) the entity applies an accounting policy &lt;b&gt;retrospectively&lt;/b&gt;, makes a &lt;b&gt;retrospective restatement&lt;/b&gt; or &lt;b&gt;reclassifies&lt;/b&gt; items&lt;/label&gt;
      &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;t2&quot;&gt; (b) the effect on the information in the opening SFP of the preceding period is &lt;b&gt;material&lt;/b&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 150&quot; role=&quot;img&quot; aria-label=&quot;Statements to be presented&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;120&quot; x2=&quot;780&quot; y2=&quot;120&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g font-size=&quot;12.5&quot;&gt;
        &lt;text x=&quot;140&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;1/1/2025&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;31/12/2025&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;31/12/2026&lt;/text&gt;
        &lt;g id=&quot;t3&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3rd SFP&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;opening prior year&lt;/text&gt;&lt;/g&gt;
        &lt;rect x=&quot;350&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Comparative SFP&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;preceding year&lt;/text&gt;
        &lt;rect x=&quot;630&quot; y=&quot;30&quot; width=&quot;140&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Current SFP&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;2026 statements&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;t-out&quot; class=&quot;result&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var a=document.getElementById(&#x27;t1&#x27;),b=document.getElementById(&#x27;t2&#x27;),g=document.getElementById(&#x27;t3&#x27;),o=document.getElementById(&#x27;t-out&#x27;);
    function f(){var on=a.checked&amp;&amp;b.checked;g.style.opacity=on?1:.15;o.className=&#x27;result &#x27;+(on?&#x27;cur&#x27;:&#x27;nc&#x27;);
      o.innerHTML=on?&#x27;&lt;b&gt;Three&lt;/b&gt; statements of financial position are required.&lt;small&gt;Both conditions are met (IFRS 18.37).&lt;/small&gt;&#x27;:&#x27;&lt;b&gt;Two&lt;/b&gt; statements of financial position are sufficient (current and comparative).&lt;small&gt;&#x27;+(a.checked?&#x27;There is a retrospective change, but with no material effect on the opening position.&#x27;:&#x27;No retrospective application, restatement or reclassification.&#x27;)+&#x27;&lt;/small&gt;&#x27;;}
    a.onchange=b.onchange=f;f();})();
  &lt;/script&gt;
  &lt;p&gt;&lt;b&gt;Reclassification of comparatives&lt;/b&gt; (IAS 1.41 ↔ IFRS 18.33, &lt;span class=&quot;verdict v-same&quot;&gt;kept the same content&lt;/span&gt;): if the presentation or classification of items changes, comparative amounts are reclassified too, unless this is &lt;span class=&quot;term&quot;&gt;impracticable&lt;/span&gt; (the entity cannot apply the requirement after making every reasonable effort to do so). The entity discloses: (a) the &lt;b&gt;nature&lt;/b&gt; of the reclassification, (b) the &lt;b&gt;amount&lt;/b&gt; of each item reclassified, (c) the &lt;b&gt;reason&lt;/b&gt; for it.&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;Internal link within the lecture: retrospective application and restatement are governed by IAS 8, which the slides also cite for effects recognised directly in equity (sections 7 and 8).&lt;/p&gt;

  &lt;h3&gt;Identification of the financial statements&lt;/h3&gt;
  &lt;p&gt;IAS 1.49-50 ↔ IFRS 18.25-26 &lt;span class=&quot;verdict v-same&quot;&gt;same exact content&lt;/span&gt;: the financial statements must be &lt;b&gt;clearly identified&lt;/b&gt; and distinguished from other information in the same published document (annual report, regulatory filing…), because IFRSs apply &lt;b&gt;only&lt;/b&gt; to the financial statements. Users must be able to tell what is prepared in accordance with IFRSs and what is not.&lt;/p&gt;
  &lt;p&gt;IAS 1.51 ↔ IFRS 18.27 (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;; &quot;display&quot; becomes &quot;&lt;b&gt;disclose&lt;/b&gt;&quot;): the following must be shown prominently, and repeated when necessary:&lt;/p&gt;
  &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;a · name of the reporting entity and any change in it&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;b · separate or consolidated financial statements&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;c · reporting date or period covered&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;d · presentation currency (IAS 21)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;e · level of rounding (B11)&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Presentation currency&lt;/span&gt;: the currency in which the financial statements are presented, as defined in IAS 21 &lt;em&gt;The Effects of Changes in Foreign Exchange Rates&lt;/em&gt;. The level of rounding states, for example, &quot;amounts in thousands of euros&quot;.&lt;/p&gt;

  &lt;h3&gt;Frequency of reporting&lt;/h3&gt;
  &lt;p&gt;IAS 1.36 ↔ IFRS 18.28 (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;; &quot;present&quot; → &quot;&lt;b&gt;provide&lt;/b&gt;&quot;): a complete set &lt;b&gt;at least annually&lt;/b&gt;. If the end of the reporting period changes and the period is longer or shorter than one year, in addition to the period covered the entity discloses: the &lt;b&gt;reason&lt;/b&gt; and the fact that the amounts are &lt;b&gt;not entirely comparable&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Example.&lt;/b&gt; A group moves its year end from 30 June to 31 December: the transitional financial statements cover 18 months (1/7/2025-31/12/2026). The 18-month statement of profit or loss is not comparable with the 12-month one of the previous year, and this must be stated.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part B&lt;/h3&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;1.&lt;/b&gt; An entity uses a non-compliant policy but describes it accurately in the notes. Are the financial statements acceptable? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No. IAS 1.18 (= 6D): inappropriate accounting policies are &lt;b&gt;not&lt;/b&gt; rectified by disclosure or by explanatory material.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa mcq&quot; data-why=&quot;Cash flow information is the only exception to the accrual basis.&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Which part of the financial statements is NOT prepared on the accrual basis?
      &lt;div class=&quot;opts&quot;&gt;&lt;button&gt;The notes&lt;/button&gt;&lt;button&gt;The statement of changes in equity&lt;/button&gt;&lt;button data-ok&gt;Cash flow information&lt;/button&gt;&lt;button&gt;The statement of financial position&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;3.&lt;/b&gt; What are the three verbs in the definition of materiality? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Omitting, misstating, obscuring&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;4.&lt;/b&gt; An IFRS lists a disclosure as a &quot;minimum requirement&quot;, but for the entity the information is immaterial. Must it be provided? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No (IAS 1.31 / IFRS 18.19): it is not required even if it is described as a minimum requirement. Conversely, if the requirements are insufficient, additional disclosures are needed (IFRS 18.20).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;5.&lt;/b&gt; When is a third statement of financial position required? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;When (a) there is retrospective application of a policy, retrospective restatement or reclassification &lt;b&gt;and&lt;/b&gt; (b) the effect on the SFP at the beginning of the preceding period is material (IAS 1.40A / IFRS 18.37).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;b&gt;6.&lt;/b&gt; What must management do if it has material uncertainties about going concern but does not intend to liquidate? &lt;button class=&quot;btn reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;It prepares the financial statements on a going concern basis and &lt;b&gt;discloses&lt;/b&gt; those uncertainties (IAS 1.25).&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- PARTE C --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part C · Financial position&lt;/span&gt;
  &lt;h2&gt;5 · Statement of financial position&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;statement of financial position&lt;/span&gt; (called the &lt;em&gt;balance sheet&lt;/em&gt; until 2007) is a snapshot of assets, liabilities and equity at a given date. IAS 1 para. 54-80A ↔ IFRS 18 para. 96-106 and Appendix B (B96-B111).&lt;/p&gt;

  &lt;h3&gt;Current / non-current distinction&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.60-61&lt;/h5&gt;Current and non-current assets and liabilities as separate classifications, unless a presentation based on &lt;b&gt;liquidity&lt;/b&gt; provides information that is &lt;em&gt;reliable and more relevant&lt;/em&gt;; in that case all items are presented in order of liquidity.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18 para. 96-106&lt;/h5&gt;Same rule, but the exception applies if a liquidity-based presentation provides &lt;em&gt;a more useful &lt;b&gt;structured summary&lt;/b&gt;&lt;/em&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.60-61&lt;/span&gt;
  &lt;p&gt;Whichever method is used, for each line item that combines amounts expected to be recovered or settled &lt;b&gt;within&lt;/b&gt; and &lt;b&gt;after more than&lt;/b&gt; 12 months, the amount expected after more than 12 months must be disclosed. Liquidity-based presentation is typically used by &lt;b&gt;banks&lt;/b&gt; and other financial institutions, where no clearly identifiable operating cycle exists.&lt;/p&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Structured summary&lt;/span&gt;: a key expression in IFRS 18. Each primary financial statement must be a useful structured summary; whatever is not needed for the summary belongs in the notes.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Current assets&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Current liabilities&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;What the normal operating cycle is&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;An asset is &lt;b&gt;current&lt;/b&gt; when (IAS 1.66 = IFRS 18.99, &lt;span class=&quot;verdict v-same&quot;&gt;same exact content&lt;/span&gt;):&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;it is expected to be realised, sold or consumed in the &lt;b&gt;normal operating cycle&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;it is held primarily &lt;b&gt;for the purpose of trading&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;it is expected to be realised &lt;b&gt;within 12 months&lt;/b&gt; after the reporting period;&lt;/li&gt;&lt;li&gt;it is &lt;b&gt;cash or a cash equivalent&lt;/b&gt; (IAS 7), unless restricted from being used for at least 12 months.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;All other assets are &lt;b&gt;non-current&lt;/b&gt; (IAS 1.66 ↔ IFRS 18.100 &quot;all assets other than those specified in paragraph 99&quot;).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;A liability is &lt;b&gt;current&lt;/b&gt; when (IAS 1.69 ↔ IFRS 18, &lt;span class=&quot;verdict v-diff&quot;&gt;slight changes&lt;/span&gt;):&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;it is expected to be settled in the &lt;b&gt;normal operating cycle&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;it is held primarily &lt;b&gt;for the purpose of trading&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;it is due to be settled &lt;b&gt;within 12 months&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;the entity does not have the &lt;b&gt;right&lt;/b&gt; to defer its settlement for at least 12 months after the reporting period.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;&lt;b&gt;The differences:&lt;/b&gt; IAS 1 referred to an &lt;mark&gt;&quot;unconditional&quot;&lt;/mark&gt; right; in the IFRS 18 version the adjective disappears (only &quot;the right&quot; remains). In addition, the IFRS 18 slide does not include the IAS 1 sentence stating that terms which could, at the option of the counterparty, result in settlement by the issue of equity instruments &lt;b&gt;do not affect&lt;/b&gt; classification. All other liabilities are non-current.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;The &lt;b&gt;normal operating cycle&lt;/b&gt; is the time between the acquisition of assets for processing and their realisation in cash; when it is not clearly identifiable, it is assumed to be 12 months (IAS 1.68, text of the standard at &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt;). For a winery that ages its wine for three years, inventories are nevertheless current.&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 820 130&quot; role=&quot;img&quot; aria-label=&quot;Operating cycle&quot;&gt;
        &lt;g font-size=&quot;13&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Cash&lt;/text&gt;
        &lt;rect x=&quot;230&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;305&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Raw materials&lt;/text&gt;
        &lt;rect x=&quot;440&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;515&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Finished goods&lt;/text&gt;
        &lt;rect x=&quot;650&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;25&quot; fill=&quot;var(--slate-bg)&quot;/&gt;&lt;text x=&quot;725&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;Receivables&lt;/text&gt;
        &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M170,65 L228,65&quot;/&gt;&lt;path d=&quot;M380,65 L438,65&quot;/&gt;&lt;path d=&quot;M590,65 L648,65&quot;/&gt;&lt;path d=&quot;M725,92 C725,125 95,125 95,94&quot;/&gt;&lt;/g&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Minimum line items&lt;/h3&gt;
  &lt;p&gt;Filter the list to see what changes between IAS 1.54 and IFRS 18.103-104 (&lt;span class=&quot;verdict v-mean&quot;&gt;same items but different structure&lt;/span&gt;).&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot; id=&quot;li-f&quot;&gt;&lt;button class=&quot;btn on&quot; data-f=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;new&quot;&gt;New in IFRS 18&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;moved&quot;&gt;Moved&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tblwrap&quot;&gt;&lt;table class=&quot;filt&quot; id=&quot;li-t&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Line item&lt;/th&gt;&lt;th&gt;IAS 1.54&lt;/th&gt;&lt;th&gt;IFRS 18&lt;/th&gt;&lt;th&gt;Note&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Property, plant and equipment&lt;/td&gt;&lt;td&gt;a&lt;/td&gt;&lt;td&gt;103 a&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Investment property&lt;/td&gt;&lt;td&gt;b&lt;/td&gt;&lt;td&gt;103 b&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Intangible assets&lt;/td&gt;&lt;td&gt;c&lt;/td&gt;&lt;td&gt;103 c&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;new&quot;&gt;&lt;td&gt;&lt;b&gt;Goodwill&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;103 d&lt;/b&gt;&lt;/td&gt;&lt;td&gt;separate line item, new&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Financial assets (excl. other line items)&lt;/td&gt;&lt;td&gt;d&lt;/td&gt;&lt;td&gt;103 e&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;IFRS 17 portfolios that are assets&lt;/td&gt;&lt;td&gt;da&lt;/td&gt;&lt;td&gt;103 f&lt;/td&gt;&lt;td&gt;insurance&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Investments accounted for using the equity method&lt;/td&gt;&lt;td&gt;e&lt;/td&gt;&lt;td&gt;103 g&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Biological assets (IAS 41)&lt;/td&gt;&lt;td&gt;f&lt;/td&gt;&lt;td&gt;103 h&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Inventories&lt;/td&gt;&lt;td&gt;g&lt;/td&gt;&lt;td&gt;103 i&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Trade and other receivables&lt;/td&gt;&lt;td&gt;h&lt;/td&gt;&lt;td&gt;103 j&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Cash and cash equivalents&lt;/td&gt;&lt;td&gt;i&lt;/td&gt;&lt;td&gt;103 k&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Assets held for sale (IFRS 5)&lt;/td&gt;&lt;td&gt;j&lt;/td&gt;&lt;td&gt;103 l&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Trade and other payables&lt;/td&gt;&lt;td&gt;k&lt;/td&gt;&lt;td&gt;103 m&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Provisions&lt;/td&gt;&lt;td&gt;l&lt;/td&gt;&lt;td&gt;103 m (sic)&lt;/td&gt;&lt;td&gt;the slide repeats the letter &quot;m&quot;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Financial liabilities&lt;/td&gt;&lt;td&gt;m&lt;/td&gt;&lt;td&gt;103 o&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;IFRS 17 portfolios that are liabilities&lt;/td&gt;&lt;td&gt;ma&lt;/td&gt;&lt;td&gt;103 p&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Current tax (IAS 12)&lt;/td&gt;&lt;td&gt;n&lt;/td&gt;&lt;td&gt;103 q&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Deferred tax (IAS 12)&lt;/td&gt;&lt;td&gt;o&lt;/td&gt;&lt;td&gt;103 r&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;same&quot;&gt;&lt;td&gt;Liabilities in disposal groups (IFRS 5)&lt;/td&gt;&lt;td&gt;p&lt;/td&gt;&lt;td&gt;103 s&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;moved&quot;&gt;&lt;td&gt;Non-controlling interests&lt;/td&gt;&lt;td&gt;q&lt;/td&gt;&lt;td&gt;&lt;b&gt;104 a&lt;/b&gt;&lt;/td&gt;&lt;td&gt;equity items in a paragraph of their own&lt;/td&gt;&lt;/tr&gt;
      &lt;tr data-k=&quot;moved&quot;&gt;&lt;td&gt;Issued capital and reserves (owners of the parent)&lt;/td&gt;&lt;td&gt;r&lt;/td&gt;&lt;td&gt;&lt;b&gt;104 b&lt;/b&gt;&lt;/td&gt;&lt;td&gt;as above&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;script&gt;
  (function(){var bs=document.querySelectorAll(&#x27;#li-f button&#x27;),rs=document.querySelectorAll(&#x27;#li-t tbody tr&#x27;);
    bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});var f=b.dataset.f;rs.forEach(function(r){r.hidden=!(f===&#x27;all&#x27;||r.dataset.k===f)})}});})();
  &lt;/script&gt;
  &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Non-controlling interests&lt;/span&gt; (NCI): the equity in subsidiaries not attributable to the parent. &lt;span class=&quot;term&quot;&gt;Equity method&lt;/span&gt;: the method used to account for associates and joint ventures. &lt;span class=&quot;term&quot;&gt;Disposal group&lt;/span&gt;: a group of assets (and liabilities) to be disposed of together as a whole (IFRS 5).&lt;/p&gt;

  &lt;h3&gt;Additional line items and subtotals&lt;/h3&gt;
  &lt;div class=&quot;cmp&quot;&gt;
    &lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.55 / 55A&lt;/h5&gt;Additional line items, headings and subtotals when &lt;b&gt;relevant&lt;/b&gt; to an understanding of the financial position. Subtotals shall: (a) comprise amounts recognised and measured in accordance with IFRSs; &lt;mark&gt;(b) be presented and labelled in a manner that makes the line items that constitute the subtotal clear and understandable&lt;/mark&gt;; (c) be consistent from period to period; (d) not be displayed with more prominence than the subtotals and totals required by IFRSs.&lt;/div&gt;
    &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.24 (see B9)&lt;/h5&gt;Additional line items and subtotals if &lt;b&gt;necessary&lt;/b&gt; to provide a &lt;em&gt;useful structured summary&lt;/em&gt;. Same requirements, except for point &lt;mark&gt;(b): be compatible with the structure of the statement created by the requirements of para. 22&lt;/mark&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;span class=&quot;verdict v-diff&quot;&gt;Point b) is different&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;The point: under IFRS 18 a &quot;creative&quot; subtotal cannot break the mandatory structure of the statement.&lt;/span&gt;

  &lt;h3&gt;Sub-classifications (IAS 1.77-78 ↔ IFRS 18.B109-B111)&lt;/h3&gt;
  &lt;p&gt;In the statement or in the notes, line items are disaggregated in a manner appropriate to the entity&#x27;s operations. Open the panels:&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;a · Property, plant and equipment&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Into classes in accordance with IAS 16 (land, buildings, plant…).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;b · Receivables&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Amounts receivable from trade customers, from &lt;span class=&quot;term&quot;&gt;related parties&lt;/span&gt;, &lt;span class=&quot;term&quot;&gt;prepayments&lt;/span&gt; and other amounts.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;c · Inventories&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;In accordance with IAS 2: merchandise, production supplies, materials, &lt;span class=&quot;term&quot;&gt;work in progress&lt;/span&gt; and finished goods.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;d · Trade payables in supplier finance arrangements &lt;span class=&quot;verdict v-diff&quot;&gt;new in IFRS 18&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;IFRS 18.B111 adds this point: trade payables are disaggregated, applying IAS 7, to show separately those that are part of &lt;span class=&quot;term&quot;&gt;supplier finance arrangements&lt;/span&gt; (arrangements in which a finance provider pays the entity&#x27;s suppliers and the entity repays the finance provider at a later date; also known as &lt;em&gt;reverse factoring&lt;/em&gt;).
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag&quot;&gt;external source&lt;/span&gt;The link with IAS 7 stems from the IASB amendments to IAS 7 and IFRS 7 of &lt;b&gt;25 May 2023&lt;/b&gt; on the disclosure of supplier finance arrangements (new para. 44F-44H of IAS 7), effective from 1 January 2024. Source: &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;e · Provisions&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;IAS 1: employee benefits and other items. IFRS 18 adds the example of &lt;span class=&quot;term&quot;&gt;decommissioning liabilities&lt;/span&gt; (dismantling and restoration obligations).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;f · Equity capital and reserves&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Paid-in capital, &lt;span class=&quot;term&quot;&gt;share premium&lt;/span&gt;, reserves.&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Format of statement&lt;/h3&gt;
  &lt;p&gt;Neither IAS 1.57 nor IFRS 18.106 prescribes the &lt;b&gt;order or format&lt;/b&gt; (&lt;span class=&quot;verdict v-mean&quot;&gt;same meaning&lt;/span&gt;). Current items may be presented before non-current ones or vice versa; a &lt;b&gt;net assets&lt;/b&gt; presentation (assets minus liabilities) is also permitted, as is the &lt;em&gt;long-term financing approach&lt;/em&gt; format used in the United Kingdom. Move the sliders: the two formats show the same figures.&lt;/p&gt;
  &lt;div class=&quot;sim&quot; id=&quot;fmt&quot;&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div&gt;&lt;label&gt;Fixed (non-current) assets: &lt;b id=&quot;fa-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;fa&quot; min=&quot;200&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;800&quot;&gt;
      &lt;label&gt;Current assets: &lt;b id=&quot;ca-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ca&quot; min=&quot;100&quot; max=&quot;800&quot; step=&quot;10&quot; value=&quot;400&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;Short-term payables: &lt;b id=&quot;sp-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sp&quot; min=&quot;50&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;
      &lt;label&gt;Long-term debt: &lt;b id=&quot;ld-v&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ld&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;10&quot; value=&quot;350&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;std&quot;&gt;Two-sided (account) format&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;uk&quot;&gt;Long-term financing approach (UK)&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 820 260&quot; id=&quot;fmt-svg&quot; role=&quot;img&quot; aria-label=&quot;Comparison of statement of financial position formats&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;formula&quot; id=&quot;fmt-f&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){var ids=[&#x27;fa&#x27;,&#x27;ca&#x27;,&#x27;sp&#x27;,&#x27;ld&#x27;],m=&#x27;std&#x27;,s=document.getElementById(&#x27;fmt-svg&#x27;),f=document.getElementById(&#x27;fmt-f&#x27;);
    var bs=document.querySelectorAll(&#x27;#fmt .btnrow button&#x27;);bs.forEach(function(b){b.onclick=function(){m=b.dataset.m;bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});draw()}});
    function v(i){return +document.getElementById(i).value}
    function bar(x,y,w,h,c,t,val){return &#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+Math.max(h,0)+&#x27;&quot; fill=&quot;&#x27;+c+&#x27;&quot; rx=&quot;3&quot; opacity=&quot;.85&quot;/&gt;&#x27;+(h&gt;16?&#x27;&lt;text x=&quot;&#x27;+(x+w/2)+&#x27;&quot; y=&quot;&#x27;+(y+h/2+5)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--paper)&quot;&gt;&#x27;+t+&#x27; &#x27;+val+&#x27;&lt;/text&gt;&#x27;:&#x27;&#x27;);}
    function draw(){ids.forEach(function(i){document.getElementById(i+&#x27;-v&#x27;).textContent=v(i)});
      var fa=v(&#x27;fa&#x27;),ca=v(&#x27;ca&#x27;),sp=v(&#x27;sp&#x27;),ld=v(&#x27;ld&#x27;),eq=fa+ca-sp-ld,k=0.115,h=&#x27;&#x27;;
      if(m===&#x27;std&#x27;){var y=10;
        h+=&#x27;&lt;text x=&quot;160&quot; y=&quot;&#x27;+(y+8)+&#x27;&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;ASSETS&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;&#x27;+(y+8)+&#x27;&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;EQUITY AND LIABILITIES&lt;/text&gt;&#x27;;
        var yy=20;h+=bar(60,yy,200,fa*k,&#x27;var(--slate)&#x27;,&#x27;Fixed&#x27;,fa);h+=bar(60,yy+fa*k,200,ca*k,&#x27;oklch(60% 0.07 250)&#x27;,&#x27;Current&#x27;,ca);
        var ey=20;if(eq&gt;0){h+=bar(460,ey,200,eq*k,&#x27;var(--sage)&#x27;,&#x27;Equity&#x27;,eq);ey+=eq*k;}
        h+=bar(460,ey,200,ld*k,&#x27;var(--ochre)&#x27;,&#x27;LT debt&#x27;,ld);h+=bar(460,ey+ld*k,200,sp*k,&#x27;var(--brick)&#x27;,&#x27;ST payables&#x27;,sp);
        f.innerHTML=&#x27;Assets &#x27;+(fa+ca)+&#x27; = Equity &#x27;+eq+&#x27; + Liabilities &#x27;+(sp+ld);
      }else{
        h+=&#x27;&lt;text x=&quot;20&quot; y=&quot;20&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Fixed assets + Current assets − Short-term payables = Long-term debt + Equity&lt;/text&gt;&#x27;;
        var x=20,y=40,sc=0.33;h+=bar(x,y,fa*sc,40,&#x27;var(--slate)&#x27;,&#x27;FA&#x27;,fa);h+=bar(x+fa*sc,y,ca*sc,40,&#x27;oklch(60% 0.07 250)&#x27;,&#x27;CA&#x27;,ca);
        var na=fa+ca-sp;h+=&#x27;&lt;rect x=&quot;&#x27;+(x+(fa+ca-sp)*sc)+&#x27;&quot; y=&quot;&#x27;+(y+45)+&#x27;&quot; width=&quot;&#x27;+sp*sc+&#x27;&quot; height=&quot;30&quot; fill=&quot;var(--brick)&quot; rx=&quot;3&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;&#x27;+(x+(fa+ca-sp/2)*sc)+&#x27;&quot; y=&quot;&#x27;+(y+65)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--paper)&quot;&gt;− ST &#x27;+sp+&#x27;&lt;/text&gt;&#x27;;
        h+=bar(x,y+110,ld*sc,40,&#x27;var(--ochre)&#x27;,&#x27;LT&#x27;,ld);if(eq&gt;0)h+=bar(x+ld*sc,y+110,eq*sc,40,&#x27;var(--sage)&#x27;,&#x27;Eq&#x27;,eq);
        h+=&#x27;&lt;line x1=&quot;&#x27;+(x+na*sc)+&#x27;&quot; y1=&quot;&#x27;+(y-5)+&#x27;&quot; x2=&quot;&#x27;+(x+na*sc)+&#x27;&quot; y2=&quot;&#x27;+(y+160)+&#x27;&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;&#x27;+(x+na*sc+6)+&#x27;&quot; y=&quot;&#x27;+(y+100)+&#x27;&quot; font-size=&quot;12&quot; fill=&quot;var(--accent)&quot;&gt;net capital employed &#x27;+na+&#x27;&lt;/text&gt;&#x27;;
        f.innerHTML=fa+&#x27; + &#x27;+ca+&#x27; − &#x27;+sp+&#x27; = &#x27;+ld+&#x27; + &#x27;+eq+&#x27;  →  &#x27;+na+&#x27; = &#x27;+(ld+eq);
      }
      if(eq&lt;=0)h+=&#x27;&lt;text x=&quot;410&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--brick)&quot;&gt;Negative equity: liabilities exceed assets.&lt;/text&gt;&#x27;;
      s.innerHTML=h;}
    ids.forEach(function(i){document.getElementById(i).addEventListener(&#x27;input&#x27;,draw)});draw();})();
  &lt;/script&gt;

  &lt;h3&gt;Share capital and reserves&lt;/h3&gt;
  &lt;p&gt;IAS 1.79: in the statement, in the statement of changes in equity or in the notes, for &lt;b&gt;each class of share capital&lt;/b&gt;:&lt;/p&gt;
  &lt;ul class=&quot;toc-mini&quot;&gt;&lt;li&gt;number of shares authorised&lt;/li&gt;&lt;li&gt;issued and fully paid / issued but not fully paid&lt;/li&gt;&lt;li&gt;par value per share (or that shares have no par value)&lt;/li&gt;&lt;li&gt;reconciliation of shares outstanding at the beginning and end of the period&lt;/li&gt;&lt;li&gt;rights, preferences and restrictions (including on dividends and repayment of capital)&lt;/li&gt;&lt;li&gt;shares held by the entity itself or by its subsidiaries or associates&lt;/li&gt;&lt;li&gt;shares reserved for issue under options and contracts for sale&lt;/li&gt;&lt;li&gt;(b) nature and purpose of each reserve&lt;/li&gt;&lt;/ul&gt;
  &lt;p&gt;Entities &lt;b&gt;without share capital&lt;/b&gt; (partnerships, trusts) disclose equivalent information for each category of equity interest (IAS 1.80).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Reclassifications between liabilities and equity&lt;/b&gt; (IAS 1.80A ↔ IFRS 18.19B, &lt;span class=&quot;verdict v-mean&quot;&gt;same meaning, expressed differently&lt;/span&gt;): if an entity reclassifies (a) a &lt;span class=&quot;term&quot;&gt;puttable financial instrument&lt;/span&gt; (an instrument that gives the holder the right to put it back to the issuer for cash) classified as equity, or (b) an instrument that imposes an obligation to deliver a pro rata share of net assets only on liquidation, it discloses the amount, timing and reason. IFRS 18 refers explicitly to para. 16A-16D of IAS 32.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;span class=&quot;part-label&quot;&gt;Part C · Financial position&lt;/span&gt;
  &lt;h2&gt;6 · Current or non-current liabilities: refinancing and covenants&lt;/h2&gt;
  &lt;p&gt;This is the most &quot;technical&quot; part of the lecture and the one with the most practical cases. The underlying idea: what matters is &lt;b&gt;the right existing at the end of the reporting period&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;end of the reporting period&lt;/span&gt;) to defer settlement for at least 12 months, not intentions or what happens afterwards.&lt;/p&gt;

  &lt;h3&gt;The rules, one by one&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Refinancing&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Covenant breach&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Grace period&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Events after the reporting period&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.73&lt;/h5&gt;If an entity &lt;b&gt;expects, and has the discretion&lt;/b&gt;, to refinance or &lt;span class=&quot;term&quot;&gt;roll over&lt;/span&gt; an obligation for at least 12 months under an existing loan facility, it classifies the obligation as non-current, even if it would otherwise be due within a shorter period. If refinancing is &lt;b&gt;not&lt;/b&gt; at its discretion, the obligation is current.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B101&lt;/h5&gt;If an entity &lt;b&gt;has the right, at the end of the reporting period&lt;/b&gt;, to roll over an obligation for at least 12 months under an existing loan facility, it classifies the obligation as non-current. Without that right, it does not consider the potential to refinance: the obligation is current.&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning of IAS 1.73&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;But the wording shifts from &quot;expectation + discretion&quot; to &quot;right at the reporting date&quot;: this is the effect of the 2020 amendments.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;cmp&quot;&gt;&lt;div class=&quot;ias&quot;&gt;&lt;h5&gt;IAS 1.74&lt;/h5&gt;If an entity breaches a &lt;b&gt;provision&lt;/b&gt; of a long-term loan arrangement on or before the end of the reporting period, with the effect that the liability becomes &lt;span class=&quot;term&quot;&gt;payable on demand&lt;/span&gt;, it is classified as current, &lt;b&gt;even if&lt;/b&gt; the lender agreed, after the reporting period and before the authorisation of the financial statements for issue, not to demand payment.&lt;/div&gt;
      &lt;div class=&quot;ifrs&quot;&gt;&lt;h5&gt;IFRS 18.B112 (as per slide)&lt;/h5&gt;Same rule, with &quot;&lt;b&gt;covenant&lt;/b&gt;&quot; instead of &quot;provision&quot;. Reason: at the end of the period the entity does not have the right to defer settlement for at least 12 months.&lt;/div&gt;&lt;/div&gt;
      &lt;span class=&quot;verdict v-mean&quot;&gt;Same meaning&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;The slide cites &quot;IFRS 18.B112&quot;, but the slide on B105(b) refers to &quot;paragraph B102&quot; for the breach: check the paragraph number against the text of the standard.&lt;/span&gt;
      &lt;p class=&quot;gloss&quot;&gt;&lt;span class=&quot;term&quot;&gt;Covenant&lt;/span&gt;: a clause in a loan agreement that requires the entity to comply with certain conditions (e.g. a debt/EBITDA ratio below a threshold). If it is breached, the lender may demand early repayment.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
