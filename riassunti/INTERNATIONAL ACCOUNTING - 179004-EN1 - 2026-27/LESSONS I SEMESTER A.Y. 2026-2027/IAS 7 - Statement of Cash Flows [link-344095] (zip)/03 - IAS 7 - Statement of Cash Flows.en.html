&lt;div&gt;
&lt;svg viewBox=&quot;0 0 580 230&quot; id=&quot;wf&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart from EBIT to cash flow&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:8px;font-size:.88rem&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Indirect&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_R&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− cost of goods sold (A − ΔI)&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cogs&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− TFR&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_T&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− bad debt allowance&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_S&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;EBIT&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b id=&quot;r_e2&quot;&gt;&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Δ NCWC&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_nwc2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Δ TFR fund&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_dt&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Operating CF&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cfi&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Direct&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Receipts from customers&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_inc&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Payments to suppliers&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_pay&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;TFR paid&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_tp&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Operating CF&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cfd&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;note&quot;&gt;EBIT &lt;span id=&quot;r_ebit&quot;&gt;&lt;/span&gt; · NCWC &lt;span id=&quot;r_nwc&quot;&gt;&lt;/span&gt; · profit–cash gap &lt;b id=&quot;r_gap&quot;&gt;&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The model is the one in the slides: a single year, no depreciation, taxes or interest. CF = collections − payments to suppliers − TFR paid, and the same figure is obtained as EBIT − ΔNCWC + ΔTFR fund.&lt;/p&gt;

&lt;h3 id=&quot;imposte&quot;&gt;The role of income taxes&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt; In theory, taxes should be &lt;b&gt;allocated across the different areas&lt;/b&gt; of the statement, to see how much they &quot;weigh&quot; on each. Since this is usually not possible, &lt;b&gt;they are all attributed to current operating activities&lt;/b&gt;. In practice, one must consider both the &lt;b&gt;income statement impact&lt;/b&gt; (the tax expense for the period) and the &lt;b&gt;change in tax payables&lt;/b&gt;, because some taxes are paid during the year and others in subsequent years.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Taxes paid = Tax expense − Δ tax payables&lt;small&gt;Teaching example: tax expense 120, tax payables from 40 to 70 (+30) → taxes paid 90.&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;This is the same rule that IAS 7 sets out in para. 35 (&lt;a href=&quot;#tasse&quot;&gt;see Part IV&lt;/a&gt;).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part II&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;EBIT 500, receivables +80, inventories −30, trade payables +20. What is the operating cash flow under the indirect method?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;ΔNCWC = 80 − 30 − 20 = +30. CF = 500 − 30 = &lt;b&gt;470&lt;/b&gt;. The decrease in inventories releases cash; the increase in payables retains it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why in H3 does profit rise from 400 to 600 while cash stays at 300?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because the 200 of goods left in inventory are removed from cost of goods sold (accrual basis), but they have already been paid for or are owed: the expense is &quot;deferred&quot;, the cash outflow is not. The indirect method corrects this by deducting the increase in inventories.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In H5, why do we add +30 and not +50?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because the TFR fund grew by only 30 (accrual 50 minus utilisation 20). The 20 paid is an actual outflow and remains in the cash flow.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What do &quot;gross potential&quot; and &quot;gross current&quot; operating CF represent?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;The first is EBIT, i.e. the flow there would be if everything were settled in cash. The second is the flow actually generated, after adjustments for working capital and non-cash items.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;If taxes cannot be allocated across the areas, where do they go?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;In current operating activities, with the outflow calculated as tax expense minus the increase in tax payables.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p3&quot; id=&quot;ias7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Part III · The IAS 7 standard&lt;/span&gt;
&lt;h2&gt;IAS 7: what the standard requires&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;IAS 7 is the &lt;i&gt;International Accounting Standard&lt;/i&gt; that governs the statement of cash flows. The slides present it in the version &lt;b&gt;amended by IFRS 18&lt;/b&gt;: &lt;ins&gt;underlined&lt;/ins&gt; text is added, &lt;del&gt;struck-through&lt;/del&gt; text is deleted. &lt;span class=&quot;src&quot;&gt;slides 29–51&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;A history in four dates&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 170&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the amendments to IAS 7&quot;&gt;
&lt;line x1=&quot;40&quot; x2=&quot;830&quot; y1=&quot;80&quot; y2=&quot;80&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;circle cx=&quot;90&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Sep 2007&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;title: from “Cash Flow&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;Statements” to “Statement&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot;&gt;of Cash Flows” (IAS 1)&lt;/text&gt;
&lt;circle cx=&quot;300&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Jan 2023&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;Reg. (EU) 2021/2036:&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;item (e) deleted&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot;&gt;from para. 14 (insurance)&lt;/text&gt;
&lt;circle cx=&quot;500&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Jan 2024&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;amendments effective&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;(slide 51)&lt;/text&gt;
&lt;circle cx=&quot;640&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Apr 2024&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;IFRS 18 issued,&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;amending IAS 7&lt;/text&gt;
&lt;circle cx=&quot;790&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--acc)&quot;&gt;1 Jan 2027&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot;&gt;IFRS 18 effective&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot;&gt;external source&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;The first four dates come from slides 30, 37 and 51. The effective date of IFRS 18 comes from an external source (see below).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;In September 2007 the IASB (&lt;i&gt;International Accounting Standards Board&lt;/i&gt;, the body that issues IFRS Standards) changed the title of the standard following the revision of IAS 1 &lt;i&gt;Presentation of Financial Statements&lt;/i&gt;. In April 2024 it issued &lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;, which replaces IAS 1 and carries forward many of its requirements. IFRS 18 amended paras. 6, 10, 12, 14, 16–18, 20, 31, 32, 35, 46 and 47, added paras. 33A and 34A–34D and deleted paras. 33 and 34. The amendments apply &lt;b&gt;when IFRS 18 is applied&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 30 · IAS 7.64&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to the official IFRS Foundation page, IFRS 18 applies to annual reporting periods beginning on or after &lt;b&gt;1 January 2027&lt;/b&gt;, with earlier application permitted. In the European Union it was endorsed by Regulation (EU) 2026/338 of February 2026, with the same date. It applies retrospectively: entities with a calendar year end will also have to present 2026 comparatives in the new format. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, EU adopts IFRS 18&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Objective&lt;/h4&gt;&lt;p&gt;Information about cash flows helps users of financial statements assess the &lt;b&gt;entity&#x27;s ability to generate cash and cash equivalents&lt;/b&gt; and its &lt;b&gt;needs&lt;/b&gt; to utilise those cash flows, as well as their &lt;b&gt;timing and certainty&lt;/b&gt;. The standard requires information about &lt;b&gt;historical changes&lt;/b&gt; in cash and cash equivalents through a statement that classifies cash flows into &lt;b&gt;operating, investing and financing activities&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Scope · paras. 1–3&lt;/h4&gt;&lt;p&gt;Every entity must prepare the statement as an &lt;b&gt;integral part&lt;/b&gt; of its financial statements for each period presented. This applies &lt;b&gt;regardless of the nature of its activities&lt;/b&gt;, even to a bank, where cash is almost &quot;the product&quot;. All entities need cash for the same reasons: &lt;b&gt;to conduct their operations, pay their obligations and provide returns to their investors&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 32 · IAS 7.1, 7.3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Definitions · para. 6&lt;/h3&gt;
&lt;p&gt;Open each card for the definition in the standard and what it means. &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Cash comprises cash on hand and demand deposits.&lt;/p&gt;&lt;p&gt;Notes and coins plus demand deposits: bank and postal current accounts that can be withdrawn at any time.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash equivalents&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Short-term, highly liquid investments that are readily convertible to known amounts of cash and which are subject to an insignificant risk of changes in value.&lt;/p&gt;&lt;p&gt;Three requirements together: &lt;b&gt;short term&lt;/b&gt;, &lt;b&gt;convertibility&lt;/b&gt; into a &lt;b&gt;known&lt;/b&gt; amount of cash, and an &lt;b&gt;insignificant&lt;/b&gt; risk of changes in value. In practice the benchmark is a maturity of about three months from acquisition, as slide 7 also states. Listed shares, for example, do not qualify: their price fluctuates.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash flows&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Inflows and outflows of cash and cash equivalents.&lt;/p&gt;&lt;p&gt;A movement &lt;i&gt;between&lt;/i&gt; cash and cash equivalents (e.g. depositing cash in a 2-month investment) is not a cash flow: the reference aggregate does not change.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Operating activities&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;The principal revenue-producing activities of the entity and other activities that are not investing or financing activities.&lt;/p&gt;&lt;p&gt;It is the &lt;b&gt;residual&lt;/b&gt; category: whatever is neither investing nor financing ends up here.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Investing activities&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;The acquisition and disposal of long-term assets and other investments not included in cash equivalents &lt;ins&gt;and the receipt of interest and dividends as described in paragraphs 34A–34D&lt;/ins&gt;.&lt;/p&gt;&lt;p&gt;IFRS 18 explicitly adds interest and dividends &lt;b&gt;received&lt;/b&gt; to this category (see &lt;a href=&quot;#interessi&quot;&gt;Part IV&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Financing activities&lt;/b&gt;&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Activities that result in changes in the size and composition of the contributed equity and borrowings of the entity.&lt;/p&gt;&lt;p&gt;Everything that changes the equity contributed by shareholders and the entity&#x27;s borrowings.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Presentation · paras. 10–12&lt;/h3&gt;
&lt;p&gt;The statement reports the cash flows of the period classified into &lt;b&gt;operating, investing and financing&lt;/b&gt;. &lt;ins&gt;IFRS 18 adds&lt;/ins&gt; that, in preparing it, the general requirements of paras. 9–43 and 113–114 of IFRS 18 also apply. &lt;b&gt;A single transaction may include cash flows that are classified differently.&lt;/b&gt; However, IFRS 18 removes the classic example of a loan instalment with an &quot;operating&quot; interest element and a &quot;financing&quot; principal element: since interest paid now goes, as a rule, into financing, the example no longer holds. &lt;span class=&quot;src&quot;&gt;slide 34 · IAS 7.10, 7.12&lt;/span&gt;&lt;/p&gt;

&lt;h3 id=&quot;attivita&quot;&gt;The three activities with the standard&#x27;s examples&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;Operating · paras. 13–15&lt;/button&gt;&lt;button&gt;Investing · para. 16&lt;/button&gt;&lt;button&gt;Financing · para. 17&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;These derive mainly from the &lt;b&gt;principal revenue-producing activities&lt;/b&gt;, and therefore generally result from the transactions that enter into the determination of profit or loss. &lt;span class=&quot;src&quot;&gt;slides 35–36 · IAS 7.14&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;cash receipts from the sale of goods and the rendering of services;&lt;/li&gt;&lt;li&gt;cash receipts from royalties, fees, commissions and other revenue;&lt;/li&gt;&lt;li&gt;cash payments to suppliers for goods and services;&lt;/li&gt;&lt;li&gt;cash payments to and on behalf of employees;&lt;/li&gt;&lt;li&gt;&lt;del&gt;[deleted]&lt;/del&gt; premiums and claims of insurance entities, removed by Regulation (EU) 2021/2036 of 19 November 2021, to be applied at the latest from financial years beginning on or after 1 January 2023;&lt;/li&gt;&lt;li&gt;cash payments or refunds of income taxes &lt;b&gt;unless&lt;/b&gt; they can be specifically identified with financing or investing activities;&lt;/li&gt;&lt;li&gt;cash receipts and payments from contracts held for &lt;i&gt;dealing or trading&lt;/i&gt; purposes;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;cash receipts of dividends and cash receipts and payments of interest as described in paras. 34B–34D&lt;/ins&gt; (i.e. for entities whose main business activity is investing or providing financing).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Presenting them &lt;ins&gt;separately&lt;/ins&gt; (IFRS 18 changes &lt;del&gt;disclosure&lt;/del&gt; to &lt;ins&gt;presentation&lt;/ins&gt;) is important because they show the extent to which expenditures have been made for resources intended to generate &lt;b&gt;future income and cash flows&lt;/b&gt;. &lt;b&gt;Only expenditures that result in a recognised asset in the statement of financial position&lt;/b&gt; are eligible for classification as investing activities. For example, research expensed in profit or loss is not an investment. &lt;span class=&quot;src&quot;&gt;slides 37–39 · IAS 7.16&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;cash payments to acquire &lt;i&gt;property, plant and equipment&lt;/i&gt;, intangibles and other long-term assets, including capitalised development costs and self-constructed property, plant and equipment;&lt;/li&gt;&lt;li&gt;cash receipts from sales of these assets;&lt;/li&gt;&lt;li&gt;cash payments to acquire equity or debt instruments of other entities, &lt;ins&gt;including&lt;/ins&gt; interests in &lt;ins&gt;associates and&lt;/ins&gt; joint ventures (other than instruments considered cash equivalents or held for trading);&lt;/li&gt;&lt;li&gt;cash receipts from their sale (with the same exclusions);&lt;/li&gt;&lt;li&gt;cash advances and loans made to other parties (other than those made by a financial institution);&lt;/li&gt;&lt;li&gt;cash receipts from the repayment of those loans;&lt;/li&gt;&lt;li&gt;cash payments for futures, forward, option and swap contracts, except when held for trading or classified as financing;&lt;/li&gt;&lt;li&gt;cash receipts from the same contracts, with the same exceptions;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;cash receipts of interest and dividends as described in paras. 34A–34D&lt;/ins&gt;.&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;Hedging rule: when a contract is accounted for as a &lt;i&gt;hedge&lt;/i&gt; of an identifiable position, its cash flows are classified in the same way as those of the position being hedged.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Presenting them &lt;ins&gt;separately&lt;/ins&gt; is useful in &lt;b&gt;predicting claims&lt;/b&gt; on future cash flows by providers of capital to the entity. &lt;span class=&quot;src&quot;&gt;slides 40–41 · IAS 7.17&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;cash proceeds from issuing shares or other equity instruments;&lt;/li&gt;&lt;li&gt;cash payments to owners to acquire or redeem the entity&#x27;s shares;&lt;/li&gt;&lt;li&gt;cash proceeds from issuing debentures, loans, notes, bonds, mortgages and other short-term or long-term borrowings;&lt;/li&gt;&lt;li&gt;cash repayments of amounts borrowed;&lt;/li&gt;&lt;li&gt;cash payments by a &lt;i&gt;lessee&lt;/i&gt; for the reduction of the outstanding lease liability;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;cash payments of dividends as described in para. 33A&lt;/ins&gt;;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;cash payments of interest as described in paras. 34A–34D&lt;/ins&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Exercise: where would you classify it?&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Assume a manufacturing company &lt;b&gt;without&lt;/b&gt; a main business activity of investing or providing financing, applying IAS 7 as amended by IFRS 18. &lt;span class=&quot;pill pO&quot;&gt;O&lt;/span&gt; operating · &lt;span class=&quot;pill pI&quot;&gt;I&lt;/span&gt; investing · &lt;span class=&quot;pill pF&quot;&gt;F&lt;/span&gt; financing.&lt;/p&gt;
&lt;div class=&quot;cls&quot;&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Cash collected from a customer for a supply made in the previous year&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Receipt from the sale of goods: para. 14(a), operating.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Purchase of a new machine&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Acquisition of PP&amp;amp;E: para. 16(a), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Principal portion of the lease payment made by the lessee&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Reduction of the lease liability: para. 17(e), financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Dividends paid to shareholders&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 33A: dividends paid always go into financing. The former &quot;operating&quot; option in para. 34 has been deleted.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Interest paid on the bank loan&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 34A(a): for a &quot;general&quot; entity, interest paid is financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Dividends received from an investee&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 34A(b): interest and dividends received are investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Income taxes paid (not attributable to specific transactions)&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 35: operating, unless specifically identified with investing or financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Capitalised development costs paid during the year&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; They give rise to a recognised intangible asset: para. 16(a), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Issue of a bond&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 17(c), financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Loan granted to another group company&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Advances and loans to other parties (not by a financial institution): para. 16(e), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Purchase of securities held for trading&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 14(g): contracts held for dealing or trading are operating; para. 16(c) expressly excludes them from investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Wages paid to employees&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Para. 14(d), operating.&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;metodi&quot;&gt;Reporting operating cash flows: direct or indirect · paras. 18–20&lt;/h3&gt;
&lt;p&gt;The standard permits both methods already seen in the lab. &lt;span class=&quot;src&quot;&gt;slides 42–44 · IAS 7.18, 7.20&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;a) Direct method&lt;/h4&gt;&lt;p&gt;The &lt;b&gt;major classes of gross cash receipts and gross cash payments&lt;/b&gt; are disclosed: receipts from customers, payments to suppliers, to employees…&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;It provides more information about what actually happened, but requires internal data (slide 3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b) Indirect method&lt;/h4&gt;&lt;p&gt;One starts from &lt;b&gt;&lt;ins&gt;operating profit or loss&lt;/ins&gt;&lt;/b&gt; and adjusts it for:&lt;/p&gt;
&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;the effects of transactions of a non-cash nature;&lt;/li&gt;&lt;li&gt;any deferrals or accruals of past or future operating cash receipts or payments;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;items of income or expense classified in the &lt;i&gt;operating&lt;/i&gt; category of the statement of profit or loss whose cash flows are investing or financing;&lt;/ins&gt;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;operating cash flows whose related income or expense is not in the &lt;i&gt;operating&lt;/i&gt; category of the statement of profit or loss.&lt;/ins&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Para. 20 details the adjustments under the indirect method:&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;changes during the period in &lt;b&gt;inventories and operating receivables and payables&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;non-cash items such as &lt;b&gt;depreciation, provisions&lt;/b&gt; and unrealised foreign currency gains and losses &lt;ins&gt;classified in the operating category&lt;/ins&gt;. The items &lt;del&gt;deferred taxes&lt;/del&gt; and &lt;del&gt;undistributed profits of associates&lt;/del&gt; are deleted from the list;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;income or expense in the operating category&lt;/ins&gt; whose cash effects are investing or financing (e.g. a gain on the sale of a plant: the proceeds go into investing);&lt;/li&gt;&lt;li&gt;&lt;ins&gt;operating cash flows, such as income taxes (para. 35), whose related income or expense is not in the operating category&lt;/ins&gt; of the statement of profit or loss.&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;There is also a variant of the indirect method: showing the revenues and expenses &lt;ins&gt;classified in the operating category&lt;/ins&gt;, the changes in inventories and operating receivables and payables &lt;ins&gt;and any other operating cash flows whose related income or expense is not in the operating category&lt;/ins&gt;.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Why the reference to the &quot;operating category&quot;? IFRS 18 divides the statement of profit or loss into categories (&lt;i&gt;operating, investing, financing, income taxes, discontinued operations&lt;/i&gt;) and introduces the required subtotal &lt;b&gt;operating profit or loss&lt;/b&gt;. This subtotal becomes the single starting point for the indirect method, replacing net profit or other measures chosen by entities. — &lt;a href=&quot;https://kpmg.com/us/en/articles/2026/ifrs-18-changes-statement-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KPMG, IFRS 18 changes to the statement of cash flows&lt;/a&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Link between the indirect method in the slides and the standard&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Lab (slides 11–27)&lt;/text&gt;
&lt;text x=&quot;40&quot; y=&quot;72&quot;&gt;EBIT&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;96&quot;&gt;− Δ Net Commercial Working Capital&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;120&quot;&gt;+ Δ TFR fund, provisions&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;= Gross current operating CF&lt;/text&gt;
&lt;rect x=&quot;410&quot; y=&quot;20&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;IAS 7.20 (with IFRS 18)&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;72&quot;&gt;Operating profit or loss&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;96&quot;&gt;± (a) Δ inventories, receivables, payables&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;120&quot;&gt;+ (b) depreciation, provisions…&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;= Net cash from operating activities&lt;/text&gt;
&lt;path d=&quot;M352,96 L408,96&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M352,120 L408,120&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M352,72 L408,72&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;The model from the first part of the lecture is the teaching version of items (a) and (b) of para. 20.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part III&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What three requirements must an investment meet to be a cash equivalent?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Short-term and highly liquid; readily convertible to a known amount of cash; subject to an insignificant risk of changes in value.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why are operating activities defined &quot;negatively&quot;?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because they comprise the principal revenue-producing activities and &lt;i&gt;all other&lt;/i&gt; activities that are not investing or financing: it is the residual category.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can research expenditure paid and expensed in profit or loss be an investing cash flow?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. Para. 16 allows into investing only expenditures that result in a recognised asset in the statement of financial position.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is a bank exempt from the statement of cash flows because cash is its product?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. Para. 3 rules this out: all entities need cash to conduct their operations, pay their obligations and provide returns to their investors, so all must present it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Under IFRS 18, what figure does the indirect method start from?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;From &lt;i&gt;operating profit or loss&lt;/i&gt;, the subtotal required by IFRS 18 (amended para. 18(b)).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p4&quot; id=&quot;interessi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Part IV · IFRS 18 and cases&lt;/span&gt;
&lt;h2&gt;Interest and dividends · paras. 31–34D&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;This is the most visible change IFRS 18 makes to the statement of cash flows: the &lt;b&gt;classification options&lt;/b&gt; disappear. They are replaced by fixed rules that depend on the entity&#x27;s main business activity. &lt;span class=&quot;src&quot;&gt;slides 45–49&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Two principles of para. 31 remain in force: cash flows from interest and dividends received and paid shall each be &lt;b&gt;&lt;ins&gt;presented&lt;/ins&gt;&lt;/b&gt; (no longer &lt;del&gt;disclosed&lt;/del&gt;) &lt;b&gt;separately&lt;/b&gt;, and classified &lt;b&gt;consistently&lt;/b&gt; from period to period, &lt;ins&gt;applying paras. 32, 33A and 34A–34D&lt;/ins&gt;.&lt;/p&gt;

&lt;div data-tabs&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;Before IFRS 18&lt;/button&gt;&lt;button&gt;Under IFRS 18&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;The former para. 33, now &lt;del&gt;deleted&lt;/del&gt;, acknowledged that for non-financial entities there was &lt;b&gt;no consensus&lt;/b&gt; on classification. &lt;span class=&quot;src&quot;&gt;slides 45–46&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Interest paid and interest and dividends received could be classified as &lt;b&gt;operating&lt;/b&gt;, because they enter into the determination of profit or loss;&lt;/li&gt;
&lt;li&gt;or, respectively, as &lt;b&gt;financing&lt;/b&gt; (cost of obtaining financial resources) and &lt;b&gt;investing&lt;/b&gt; (return on investments);&lt;/li&gt;
&lt;li&gt;dividends paid: &lt;b&gt;financing&lt;/b&gt; (cost of obtaining financial resources) or &lt;b&gt;operating&lt;/b&gt;, to show the entity&#x27;s ability to pay dividends out of operating cash flows (former para. 34).&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;Practical effect: two identical companies could report different operating cash flows purely because of classification choices. This was a comparability problem.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Cash flow&lt;/th&gt;&lt;th&gt;“General” entity (34A, 33A)&lt;/th&gt;&lt;th&gt;Main business activity (34B–34D)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dividends paid&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt; (33A)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt; (33A)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest paid&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;As in the statement of profit or loss&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest received&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pI&quot;&gt;Investing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;As in the statement of profit or loss&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dividends received&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pI&quot;&gt;Investing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;As in the statement of profit or loss&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;note&quot;&gt;An entity with a &lt;i&gt;main business activity&lt;/i&gt; is one that invests in assets or provides financing to customers as its main business activity (banks, investment holding companies, consumer credit companies…), identified using paras. B30–B41 of IFRS 18. &lt;span class=&quot;src&quot;&gt;slide 47&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Decision tree for classifying interest and dividends&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;250&quot; y=&quot;12&quot; width=&quot;360&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Is investing in assets or financing customers&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;its main business activity? (IFRS 18 B30–B41)&lt;/text&gt;
&lt;path d=&quot;M330,68 L180,110&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;No&lt;/text&gt;
&lt;path d=&quot;M530,68 L650,110&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Yes&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;112&quot; width=&quot;320&quot; height=&quot;100&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Para. 34A · fixed rule&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;160&quot;&gt;interest paid → &lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;160&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Financing&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;182&quot;&gt;interest &amp;amp; dividends received → &lt;/text&gt;&lt;text x=&quot;226&quot; y=&quot;182&quot; font-weight=&quot;600&quot; fill=&quot;var(--ochre)&quot;&gt;Investing&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;204&quot;&gt;dividends paid (33A) → &lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;204&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Financing&lt;/text&gt;
&lt;rect x=&quot;460&quot; y=&quot;112&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Para. 34B · follow the statement of P&amp;amp;L&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot;&gt;total of each cash flow in &lt;tspan font-weight=&quot;600&quot;&gt;a single&lt;/tspan&gt; category&lt;/text&gt;
&lt;path d=&quot;M560,168 L520,206&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M740,168 L780,206&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;400&quot; y=&quot;208&quot; width=&quot;225&quot; height=&quot;82&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;512&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;34C · in 1 P&amp;amp;L category&lt;/text&gt;&lt;text x=&quot;512&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;→ same activity in the&lt;/text&gt;&lt;text x=&quot;512&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;statement of cash flows&lt;/text&gt;
&lt;rect x=&quot;640&quot; y=&quot;208&quot; width=&quot;200&quot; height=&quot;82&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;740&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;34D · in several categories&lt;/text&gt;&lt;text x=&quot;740&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;→ accounting policy&lt;/text&gt;&lt;text x=&quot;740&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;choice, a single activity&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Decision tree reconstructed from paras. 33A and 34A–34D as reported in slides 46–49.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;The standard&#x27;s examples for 34C and 34D&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
&lt;p&gt;&lt;b&gt;34C&lt;/b&gt;: if the entity classifies &lt;i&gt;all&lt;/i&gt; interest expense in the financing category of the statement of profit or loss, it classifies all interest paid as financing in the statement of cash flows. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;34D&lt;/b&gt;: if interest expense is classified partly in the operating category and partly in the financing category, the entity makes an &lt;i&gt;accounting policy&lt;/i&gt; choice (a policy to be applied consistently) and classifies &lt;b&gt;all&lt;/b&gt; interest paid either as operating or as financing. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;tasse&quot;&gt;Taxes on income · paras. 35–36&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;Cash flows arising from taxes on income shall be &lt;b&gt;&lt;ins&gt;presented&lt;/ins&gt; separately&lt;/b&gt; and classified as &lt;b&gt;operating&lt;/b&gt;, &lt;b&gt;unless&lt;/b&gt; they can be specifically identified with financing or investing activities. &lt;span class=&quot;src&quot;&gt;slide 50 · IAS 7.35&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;This is the regulatory version of what we saw in &lt;a href=&quot;#imposte&quot;&gt;Part II&lt;/a&gt;: in theory taxes should be allocated across the areas, but in practice they almost always end up in operating. Under IFRS 18, income taxes have their own category in the statement of profit or loss, outside &lt;i&gt;operating&lt;/i&gt;. For this reason, under the indirect method they must be added as an adjustment, in accordance with para. 20(d).&lt;/p&gt;

&lt;h3&gt;Amendments · effective from 1 January 2024&lt;/h3&gt;
&lt;p&gt;The slides state that &quot;the amendments became effective for annual reporting periods beginning on or after &lt;b&gt;1 January 2024&lt;/b&gt;&quot;. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The slide does not say which amendments these are, and the date does not match IFRS 18, effective from 2027. 1 January 2024 is the effective date of the amendments to IAS 7 and IFRS 7 on &lt;b&gt;Supplier Finance Arrangements&lt;/b&gt; (&lt;i&gt;reverse factoring&lt;/i&gt; arrangements, in which a bank pays suppliers on the company&#x27;s behalf), issued by the IASB on 25 May 2023. They require additional disclosures about the terms, amounts and maturities of these arrangements and their effect on liabilities and cash flows. They do not change recognition or measurement. It is advisable to ask the lecturer to confirm whether the slide refers to these. — &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IASB publishes amendments on supplier finance arrangements&lt;/a&gt;&lt;/div&gt;

&lt;h3 id=&quot;esempio&quot;&gt;Example: the indirect method in a real case&lt;/h3&gt;
&lt;p&gt;The final example comes from &lt;b&gt;David Alexander and Simon Archer (2017), &lt;i&gt;International Accounting / Financial Reporting Standards Guide&lt;/i&gt;, Wolters Kluwer&lt;/b&gt;. It is a schedule calculating operating cash flow with the indirect method, starting from net income. &lt;span class=&quot;src&quot;&gt;slides 52–53&lt;/span&gt; Press “Next row” to build it one row at a time and read the reason for each adjustment.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Net income&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;8,000&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;note&quot;&gt;Adjustments to reconcile net income to net cash provided by operating activities:&lt;/td&gt;&lt;/tr&gt;
&lt;tbody id=&quot;exrows&quot;&gt;
&lt;tr data-v=&quot;8600&quot; data-e=&quot;&lt;b&gt;Depreciation and amortization +8,600&lt;/b&gt;: non-cash expenses that reduced profit without any cash outflow. They are added back, like the TFR in H4.&quot;&gt;&lt;td&gt;Depreciation and amortization&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,600&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;750&quot; data-e=&quot;&lt;b&gt;Provisions for doubtful accounts receivable +750&lt;/b&gt;: a non-cash provision, as in H6. Here it is added back because the change in receivables further down is calculated gross.&quot;&gt;&lt;td&gt;Provisions for doubtful accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;1000&quot; data-e=&quot;&lt;b&gt;Provision for deferred income taxes +1,000&lt;/b&gt;: tax expense for the period that will be paid in the future. It is not an outflow of the year (slide 28: some taxes are paid in subsequent years).&quot;&gt;&lt;td&gt;&lt;i&gt;Provision for deferred income taxes&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-2100&quot; data-e=&quot;&lt;b&gt;Undistributed earnings of affiliate −2,100&lt;/b&gt;: share of an investee&#x27;s profit (equity method) that enters profit or loss but has not been distributed as a dividend. No cash received: it is deducted.&quot;&gt;&lt;td&gt;&lt;i&gt;Undistributed earnings of affiliate&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(2,100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-2500&quot; data-e=&quot;&lt;b&gt;Gain on sale of equipment −2,500&lt;/b&gt;: the gain is included in profit, but the entire sale proceeds go into &lt;i&gt;investing&lt;/i&gt; (para. 16(b)). It is removed to avoid counting it twice. This is the case covered by para. 20(c).&quot;&gt;&lt;td&gt;&lt;i&gt;Gain on sale of equipment&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(2,500)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;2500&quot; data-e=&quot;&lt;b&gt;Payment received on installment sale of product +2,500&lt;/b&gt;: collection of an instalment on a sale already recognised as revenue in previous years. It is an inflow without revenue in the year: a “deferral” under para. 18(b)(ii).&quot;&gt;&lt;td&gt;&lt;i&gt;Payment received on installment sale of product&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-7750&quot; data-e=&quot;&lt;b&gt;Increase in accounts receivable −7,750&lt;/b&gt;: sales not yet collected. An increase in working capital, deducted (H1). The changes are “net of effects from purchase of XYZ Company”: working capital acquired with a subsidiary does not count here, because the acquisition goes into investing as a single line item.&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in accounts receivable&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(7,750)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-4000&quot; data-e=&quot;&lt;b&gt;Increase in inventory −4,000&lt;/b&gt;: inventory absorbs cash (H3).&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in inventory&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(4,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;3850&quot; data-e=&quot;&lt;b&gt;Increase in accounts payable and accrued expenses +3,850&lt;/b&gt;: expenses not yet paid. Operating financing, added back (H2). Total adjustments: &lt;b&gt;+350&lt;/b&gt;.&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in accounts payable and accrued expenses&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,850&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net cash provided (used) by operating activities&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;extot&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;exexpl&quot; style=&quot;min-height:4.5em;margin-top:12px&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;exnext&quot;&gt;Next row →&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;exreset&quot;&gt;Start over&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;8,000 + (8,600 + 750 + 1,000 − 2,100 − 2,500 + 2,500 − 7,750 − 4,000 + 3,850) = 8,000 + 350 = &lt;b&gt;8,350&lt;/b&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The book dates from 2017, before IFRS 18, so it starts from &lt;i&gt;net income&lt;/i&gt;. Under IFRS 18 one would start from &lt;i&gt;operating profit or loss&lt;/i&gt;: rows such as deferred taxes or the share of the associate&#x27;s profit would not appear, because those items are not in the operating category. Not by chance, IFRS 18 removed &lt;del&gt;deferred taxes&lt;/del&gt; and &lt;del&gt;undistributed profits of associates&lt;/del&gt; from para. 20(b) (slide 43).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part IV&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A manufacturing company pays 40 of interest and 100 of dividends and receives 15 of dividends. How does it classify them under IFRS 18?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Interest paid 40 → financing (34A(a)); dividends paid 100 → financing (33A); dividends received 15 → investing (34A(b)).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can a bank classify interest paid as operating?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Yes, if it is an entity whose main business activity is providing financing and it classifies interest expense in the operating category of the statement of profit or loss (34B–34C). If it classifies it in more than one category, it chooses a single policy (34D).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the gain on disposal of a plant deducted under the indirect method?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Because it is included in profit, but the total sale proceeds (carrying amount + gain) are presented in investing. Leaving it in operating would count it twice.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Do income taxes paid always go into operating?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;As a rule yes, unless they can be specifically identified with investing or financing activities (para. 35). In any case they must be presented separately.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the example, what does &quot;undistributed earnings of affiliate (2,100)&quot; mean?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;It is the share of an investee&#x27;s profit, recognised using the equity method, that has not been received as a dividend. It increases profit but not cash, so it is deducted.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p5&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Further reading&lt;/span&gt;
&lt;h2&gt;Texts, regulations and standards cited in the slides&lt;/h2&gt;
&lt;p&gt;For each reference cited in the slides I looked for a reliable source. Everything below is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;, except the “In the slides” line.&lt;/p&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 7 &lt;i&gt;Statement of Cash Flows&lt;/i&gt; — IASB / IFRS Foundation&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; it is the subject of the lecture (slides 29–51).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The official IFRS Foundation page provides the text of the standard (updated to the 2026 edition), a summary and related documents: &lt;i&gt;Basis for Conclusions&lt;/i&gt; and illustrative examples. It is the reference to use for the current text, rather than the copies circulating online. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 7&lt;/a&gt; · summary and history: &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · IAS 7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; (April 2024)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; it amends numerous paragraphs of IAS 7 (slide 30 onwards).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; It replaces IAS 1. It introduces categories in the statement of profit or loss (operating, investing, financing…), required subtotals such as &lt;i&gt;operating profit or loss&lt;/i&gt;, and new requirements on aggregation and disclosure. It applies from &lt;b&gt;1 January 2027&lt;/b&gt;, retrospectively, with earlier application permitted. It matters because it changes the starting point of the indirect method and removes the options for interest and dividends. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt; · analysis of the effects on the statement of cash flows: &lt;a href=&quot;https://kpmg.com/us/en/articles/2026/ifrs-18-changes-statement-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KPMG&lt;/a&gt;, &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/how-will-ifrs-18-impact-the-classification-of-interest-and-dividends-in-your-statement-of-cash-flows&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Regulation (EU) 2026/338 — endorsement of IFRS 18&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; not cited. It is linked to IFRS 18 and helps to understand when the amendments apply in Italy.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Adopted on 13 February 2026 and published in the Official Journal on 16 February 2026. It makes IFRS 18 and the related amendments (including those to IAS 7) applicable in the EU from 1 January 2027. — &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.fondazioneoic.eu/31086/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione OIC&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 1 &lt;i&gt;Presentation of Financial Statements&lt;/i&gt; (2007 revision)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; its 2007 revision led to the change of title of IAS 7 (slide 30).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The revision, issued on 6 September 2007 and effective from 1 January 2009, changed the names of the statements (for example “statement of financial position”) and introduced the statement of &lt;i&gt;comprehensive income&lt;/i&gt;. This is where “Statement of Cash Flows” comes from. From 2027 IAS 1 is replaced by IFRS 18. — &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2007/revised-ias-1-phase-a/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Revised IAS 1 (Phase A)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Commission Regulation (EU) 2021/2036 (19 November 2021)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; it deleted item (e) of para. 14 of IAS 7 (slide 36).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; This is the regulation that endorsed &lt;b&gt;IFRS 17 &lt;i&gt;Insurance Contracts&lt;/i&gt;&lt;/b&gt; in the EU, with the June 2020 amendments and an optional exemption on “annual cohorts”. This is why the item on insurance premiums and claims was removed from IAS 7. It applies to financial years beginning on or after 1 January 2023. On EUR-Lex it is shown as no longer in force from 15/10/2023, because it was absorbed by Regulation (EU) 2023/1803, which consolidated all endorsed standards. — &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2021/2036/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · Reg. (EU) 2021/2036&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Amendments to IAS 7 and IFRS 7: &lt;i&gt;Supplier Finance Arrangements&lt;/i&gt; (May 2023)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; slide 51 mentions “amendments” effective from 1 January 2024 without specifying them. They are probably these.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Issued on 25 May 2023 and effective from 1 January 2024. They introduce disclosures about the terms and conditions of &lt;i&gt;supplier finance&lt;/i&gt; arrangements, the amounts of the liabilities involved and their effects on cash flows and liquidity risk. — &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · news&lt;/a&gt; · &lt;a href=&quot;https://www.pwc.ch/en/insights/accounting/new-ifrs-disclosures-on-supplier-finance-arrangements-effective-in-2024.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC Switzerland&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;David Alexander, Simon Archer — &lt;i&gt;International Accounting / Financial Reporting Standards Guide&lt;/i&gt; (2017), Wolters Kluwer&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;In the slides:&lt;/b&gt; it is the source of the final example on the indirect method (slides 52–53).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; A professional guide updated annually (editions from 2009 onwards; formerly published as &lt;i&gt;Miller International Accounting/Financial Reporting Standards Guide&lt;/i&gt; by CCH). It comments on IAS/IFRS, divided into general standards and industry-specific standards, with application examples. In the catalogue record the “2017” edition is listed as published in 2016. Useful for numerical examples; for the current text the IFRS website is always preferable, because this edition predates IFRS 18. — &lt;a href=&quot;https://search.ub.tum.de/vufind/Record/DE-604.BV043840803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bibliographic record (TUM)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Main source: “03 - IAS 7 - Statement of Cash Flows.pdf”, Prof. Roberto Aprile, University of Bergamo, Academic Year 2026-2027. References to “slide n” point to the pages of the PDF.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

      document.getElementById(&#x27;r_gap&#x27;).textContent=fmt(ebit-cfi);
      // waterfall
      var items=[[&#x27;EBIT&#x27;,ebit,&#x27;t&#x27;],[&#x27;Δ net receiv.&#x27;,-netC],[&#x27;Δ inventories&#x27;,-v.dI],[&#x27;Δ payables&#x27;,v.dP],[&#x27;Δ TFR fund&#x27;,dT],[&#x27;Cash flow&#x27;,cfi,&#x27;t&#x27;]];
      var W=560,top=22,bot=200,acc=0,vals=[0];
      items.forEach(function(it){acc=it[2]?it[1]:acc+it[1];vals.push(acc);});
      var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);if(max-min&lt;100)max=min+100;
      var pad=(max-min)*0.08;max+=pad;min-=pad;
      function y(x){return top+(max-x)/(max-min)*(bot-top);}
      var s=&#x27;&lt;line x1=&quot;40&quot; x2=&quot;&#x27;+W+&#x27;&quot; y1=&quot;&#x27;+y(0)+&#x27;&quot; y2=&quot;&#x27;+y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
      var run=0,bw=62,gap=20,x0=50;
      items.forEach(function(it,k){
        var x=x0+k*(bw+gap),a,b,col;
        if(it[2]===&#x27;t&#x27;){a=0;b=it[1];run=it[1];col=k===0?&#x27;var(--sage)&#x27;:&#x27;var(--acc)&#x27;;}
        else{a=run;b=run+it[1];run=b;col=it[1]&gt;=0?&#x27;var(--pos)&#x27;:&#x27;var(--neg)&#x27;;}
        var y1=y(Math.max(a,b)),y2=y(Math.min(a,b)),h=Math.max(1.5,y2-y1);
        s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; rx=&quot;3&quot; fill=&quot;&#x27;+col+&#x27;&quot; opacity=&quot;&#x27;+(it[2]?&#x27;.9&#x27;:&#x27;.65&#x27;)+&#x27;&quot;/&gt;&#x27;;
        s+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+(y1-5)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+fmt(it[1])+&#x27;&lt;/text&gt;&#x27;;
        s+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+(bot+22)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&#x27;;
        if(k&lt;items.length-1&amp;&amp;!(items[k+1][2]))s+=&#x27;&lt;line x1=&quot;&#x27;+(x+bw)+&#x27;&quot; x2=&quot;&#x27;+(x+bw+gap)+&#x27;&quot; y1=&quot;&#x27;+y(run)+&#x27;&quot; y2=&quot;&#x27;+y(run)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&#x27;;
      });
      document.getElementById(&#x27;wf&#x27;).innerHTML=s;
    }
    ids.forEach(function(k){document.getElementById(&#x27;s_&#x27;+k).addEventListener(&#x27;input&#x27;,upd);});
    document.querySelectorAll(&#x27;[data-preset]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var p=JSON.parse(b.getAttribute(&#x27;data-preset&#x27;));ids.forEach(function(k){document.getElementById(&#x27;s_&#x27;+k).value=p[k]||0;});upd();});});
    upd();
  }
  // esempio passo-passo
  var ex=document.getElementById(&#x27;exrows&#x27;);
  if(ex){
    var rows=ex.querySelectorAll(&#x27;tr[data-v]&#x27;),n=0,btn=document.getElementById(&#x27;exnext&#x27;),rb=document.getElementById(&#x27;exreset&#x27;),tot=document.getElementById(&#x27;extot&#x27;),expl=document.getElementById(&#x27;exexpl&#x27;);
    function draw(){var s=8000;rows.forEach(function(r,k){r.style.opacity=k&lt;n?1:.25;if(k&lt;n)s+=+r.getAttribute(&#x27;data-v&#x27;);});
      tot.textContent=s.toLocaleString(&#x27;en-US&#x27;);expl.innerHTML=n?rows[n-1].getAttribute(&#x27;data-e&#x27;):&#x27;We start from net income: 8,000. Press “Next row”.&#x27;;btn.disabled=n&gt;=rows.length;}
    btn.addEventListener(&#x27;click&#x27;,function(){if(n&lt;rows.length){n++;draw();}});
    rb.addEventListener(&#x27;click&#x27;,function(){n=0;draw();});
    draw();
  }
})();
