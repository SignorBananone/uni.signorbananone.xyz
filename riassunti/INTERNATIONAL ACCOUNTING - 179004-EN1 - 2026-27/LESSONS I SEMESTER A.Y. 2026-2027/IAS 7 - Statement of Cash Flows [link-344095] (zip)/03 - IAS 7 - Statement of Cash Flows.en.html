&lt;h1&gt;IAS 7 &lt;i&gt;Statement of Cash Flows&lt;/i&gt;&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Where a company&#x27;s cash comes from and where it goes: how the statement of cash flows is prepared, how IAS 7 regulates it and what changes with IFRS 18.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Lecture 03 · Prof. Roberto Aprile&lt;/span&gt;&lt;span&gt;Master Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;54 slides · &lt;span class=&quot;t&quot;&gt;Theoretical aspects · Professional aspects · Examples&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

&lt;h2&gt;The lecture at a glance&lt;/h2&gt;

&lt;!-- PARTE I --&gt;
&lt;section class=&quot;part p1&quot; id=&quot;obiettivo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Part I · Theory&lt;/span&gt;
&lt;h2&gt;Why a statement of cash flows is needed&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;A company can be profitable and still run out of money. The &lt;i&gt;cash flows statement&lt;/i&gt; exists precisely to &lt;b&gt;show which areas of the business generated cash and which absorbed it&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The other two statements are not enough:&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Income statement&lt;/h4&gt;&lt;p&gt;The income statement is prepared on an &lt;b&gt;accrual basis&lt;/b&gt;: it records revenues and expenses when they are earned or incurred, not when cash is received or paid. A credit sale increases profit without bringing in a single euro.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Balance sheet&lt;/h4&gt;&lt;p&gt;The balance sheet is a &lt;b&gt;snapshot&lt;/b&gt; at a given date. Comparing two snapshots shows that cash has changed, but not &lt;i&gt;why&lt;/i&gt; it has changed.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cash flows statement&lt;/h4&gt;&lt;p&gt;It is the &lt;b&gt;film&lt;/b&gt; between the two snapshots: it uses both statements, &lt;b&gt;reclassified&lt;/b&gt;, together with &lt;b&gt;internal accounting data&lt;/b&gt;, and explains the change in cash. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Opening and closing balance sheets and the cash flow statement linking them&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;130&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Balance sheet t₀&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;opening cash&lt;/text&gt;&lt;rect x=&quot;60&quot; y=&quot;104&quot; width=&quot;90&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Cash₀&lt;/text&gt;
&lt;rect x=&quot;670&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;130&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Balance sheet t₁&lt;/text&gt;&lt;text x=&quot;755&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;closing cash&lt;/text&gt;&lt;rect x=&quot;710&quot; y=&quot;104&quot; width=&quot;90&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Cash₁&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;170&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-family=&quot;Newsreader,serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Cash flows statement&lt;/text&gt;
&lt;rect x=&quot;275&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Operating&lt;/text&gt;
&lt;rect x=&quot;380&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Investing&lt;/text&gt;
&lt;rect x=&quot;485&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Financing&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Σ flows (+ and −) = Cash₁ − Cash₀&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;built from reclassified IS + BS + internal data&lt;/text&gt;
&lt;path d=&quot;M190,124 L248,124&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M612,124 L668,124&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The statement explains how opening cash becomes closing cash, area by area. The three areas are those made mandatory by IAS 7 (see &lt;a href=&quot;#attivita&quot;&gt;below&lt;/a&gt;).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3 id=&quot;costruzione&quot;&gt;Construction in 4 phases&lt;/h3&gt;
&lt;p&gt;The slides divide the construction of the model into four phases &lt;span class=&quot;src&quot;&gt;slides 4–7&lt;/span&gt;. Go through them one at a time.&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Define the reference aggregate&lt;/h4&gt;
&lt;p&gt;First of all, one chooses &lt;b&gt;which aggregate&lt;/b&gt; the statement must explain. The options mentioned are: &lt;i&gt;cash&lt;/i&gt;, &lt;i&gt;cash equivalents&lt;/i&gt;, &lt;i&gt;net working capital&lt;/i&gt;, &lt;i&gt;net financial position&lt;/i&gt; (financial debt minus cash and short-term financial assets).&lt;/p&gt;
&lt;p&gt;Given its operational value, the most useful is &lt;b&gt;immediate liquidity&lt;/b&gt;: cash on hand and bank and postal current accounts in credit, immediately convertible into cash. Alternatively, &lt;b&gt;extended liquidity&lt;/b&gt; is used, which adds &lt;b&gt;risk-free short-term investments&lt;/b&gt; convertible into cash within a short time, usually &lt;b&gt;less than three months&lt;/b&gt;: these are the &lt;i&gt;cash equivalents&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Gross changes and &lt;i&gt;Sources and Uses&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;The &lt;b&gt;gross changes&lt;/b&gt; in each balance sheet item between the beginning and the end of the year are calculated and split into two groups &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;pos&quot;&gt;Sources&lt;/h4&gt;Changes that &lt;b&gt;release&lt;/b&gt; cash: a decrease in assets (e.g. receivables collected, plant sold), an increase in liabilities or equity (new debt, capital increase, profit).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;neg&quot;&gt;Uses&lt;/h4&gt;Changes that &lt;b&gt;absorb&lt;/b&gt; cash: an increase in assets (more inventory, new investments), a decrease in liabilities or equity (debt repayment, dividends, loss).&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The sign rule is not on the slide, but it is the logic the slide takes for granted: every euro &quot;tied up&quot; in additional assets is a euro that is not in the cash account.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · &lt;i&gt;Adjustments to Raw Data&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;We move from the &lt;b&gt;income logic&lt;/b&gt; (revenues and expenses, cash and non-cash) to the &lt;b&gt;cash flow logic&lt;/b&gt; (cash inflows and outflows) &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;. Two purposes:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;bring hidden movements to light&lt;/b&gt;: for example &lt;i&gt;dividends&lt;/i&gt;. If reserves rise by 60 but profit was 100, the net change &quot;hides&quot; 40 of dividends paid: they must be separated out;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;eliminate purely accounting changes&lt;/b&gt;: &lt;i&gt;depreciation and amortization&lt;/i&gt;, &lt;i&gt;provisions&lt;/i&gt;, &lt;i&gt;inventory write-downs&lt;/i&gt;. They reduce profit but involve no cash outflow.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Aggregate the flows&lt;/h4&gt;
&lt;p&gt;The resulting flows are &lt;b&gt;aggregated by area&lt;/b&gt;, so as to show how much each area contributes to generating or absorbing monetary resources. The result is an &lt;b&gt;overall view of the company&#x27;s financial dynamics&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Δ Cash and cash equivalents = Σ positive flows + Σ negative flows&lt;small&gt;the final change is the algebraic sum of all the flows of the year&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;span data-count&gt;1 / 4&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;ebitda&quot;&gt;EBIT and EBITDA: the starting point&lt;/h3&gt;
&lt;p&gt;To isolate first the contribution of &lt;b&gt;operating activities&lt;/b&gt;, the income statement is reclassified to highlight &lt;b&gt;EBIT&lt;/b&gt; and &lt;b&gt;EBITDA&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;. The acronym spells out:&lt;/p&gt;
&lt;div class=&quot;chips&quot; style=&quot;margin:10px 0&quot;&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;E&lt;/b&gt;arnings&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;B&lt;/b&gt;efore&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;I&lt;/b&gt;nterest&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;T&lt;/b&gt;axation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;D&lt;/b&gt;epreciation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;A&lt;/b&gt;mortisation&lt;/span&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 270&quot; role=&quot;img&quot; aria-label=&quot;Reclassified income statement in vertical format&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;42&quot;&gt;Operating revenue (&lt;tspan font-style=&quot;italic&quot;&gt;income&lt;/tspan&gt;)&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;62&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;82&quot;&gt;− cash operating costs (purchases, personnel, services…)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;100&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;122&quot; font-weight=&quot;600&quot;&gt;= EBITDA&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;122&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;margin before depreciation and amortisation&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;142&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;162&quot;&gt;− Depreciation &amp;amp; Amortisation (non-cash)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;202&quot; font-weight=&quot;600&quot;&gt;= EBIT&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;202&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;operating income&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;222&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;242&quot;&gt;− Interest − Taxation → Net income&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;560&quot; y=&quot;122&quot;&gt;≈ &quot;potential&quot; operating&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;138&quot;&gt;cash flow if everything&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;154&quot;&gt;were collected/paid&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Teaching diagram (not shown as a chart in the slides). In cases H1–H6 there is no depreciation, so EBIT and EBITDA coincide.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;formula&quot;&gt;EBITDA = EBIT + Depreciation + Amortisation&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part I&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does the income statement alone not explain the change in cash?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Because it is prepared on an accrual basis: it includes revenues not yet collected (receivables), expenses not yet paid (payables) and non-cash expenses (depreciation, provisions). Cash depends on the timing of collections and payments, which the income statement does not show.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between immediate liquidity and extended liquidity?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Immediate liquidity comprises cash on hand and bank and postal current accounts in credit. Extended liquidity adds &lt;i&gt;cash equivalents&lt;/i&gt;: risk-free short-term investments convertible into cash within about three months.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the two purposes of the &quot;adjustments to raw data&quot;? Give an example of each.&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;1) Bringing to light movements hidden in net changes, such as dividends paid. 2) Eliminating purely accounting changes, such as depreciation, provisions and inventory write-downs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is an increase in trade payables a source or a use?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;A &lt;b&gt;source&lt;/b&gt;: you received goods without paying for them, so the cash stays in the company.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p2&quot; id=&quot;lab&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Part II · Guided exercise&lt;/span&gt;
&lt;h2&gt;Lab: six hypotheses, two methods, one cash figure&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;The slides take a company in its &lt;b&gt;first year of activity&lt;/b&gt; and make the situation more complex one step at a time (H1→H6). Each time they calculate the operating cash flow in two ways and obtain the same figure. &lt;span class=&quot;src&quot;&gt;slides 9–27&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Direct method&lt;/b&gt;. One starts from the items of the reclassified income statement and &lt;b&gt;adjusts each one&lt;/b&gt; to turn it into an actual inflow or outflow: revenues → collections, expenses → payments. Three columns: &lt;span class=&quot;t&quot;&gt;Reclassified income statement · Adjustments · Financial situation&lt;/span&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Indirect method&lt;/b&gt;. One starts from &lt;b&gt;EBIT&lt;/b&gt; as a single figure and adjusts it for the change in &lt;b&gt;Net Commercial Working Capital&lt;/b&gt; and in other non-cash items. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross potential operating CF&lt;/h4&gt;This is EBIT: the flow that operating activities &lt;b&gt;would generate&lt;/b&gt; if all revenues were collected and all expenses paid immediately. A &lt;i&gt;potential&lt;/i&gt; flow, measured on an accrual basis.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross current operating CF&lt;/h4&gt;This is the cash that operating activities &lt;b&gt;actually&lt;/b&gt; produced during the year, after the adjustments. In Italian terminology it corresponds to the &lt;i&gt;flusso di cassa della gestione corrente&lt;/i&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Net Commercial Working Capital = Commercial Receivables + Inventories − Commercial Payables
&lt;small&gt;&lt;b&gt;Increases&lt;/b&gt; in net commercial working capital are &lt;b&gt;deducted&lt;/b&gt; from EBIT; &lt;b&gt;decreases&lt;/b&gt; are &lt;b&gt;added&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;TFR (&lt;i&gt;Trattamento di Fine Rapporto&lt;/i&gt;, &lt;i&gt;severance pay&lt;/i&gt;) is the end-of-service allowance that an Italian company accrues every year for each employee and pays when the employment relationship ends. The accrual is an expense, but it becomes a cash outflow only when the TFR is paid. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;

&lt;div data-tabs style=&quot;margin-top:22px&quot;&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;H1 · Receivables&lt;/button&gt;&lt;button&gt;H2 · Payables&lt;/button&gt;&lt;button&gt;H3 · Inventories&lt;/button&gt;&lt;button&gt;H4 · TFR&lt;/button&gt;&lt;button&gt;H5 · TFR paid&lt;/button&gt;&lt;button&gt;H6 · Bad debt allowance&lt;/button&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H1.&lt;/b&gt; Revenue 1,000, of which 100 not yet collected; purchases 600, all paid. &lt;span class=&quot;src&quot;&gt;slides 9–12&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;900 − 600 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories / − Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;100&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: profit is 400 but cash is 300, because 100 of sales are still &quot;parked&quot; in receivables.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H2.&lt;/b&gt; Receivables rise to 200 (800 collected) and 100 of purchases are not yet paid (500 paid). &lt;span class=&quot;src&quot;&gt;slides 13–15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(500)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;100&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: trade payables are a form of operating financing. The extra 100 of receivables is offset by the extra 100 of payables: the cash flow remains 300.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H3.&lt;/b&gt; Of the 600 purchased, 200 remain in inventory. In the income statement the positive change in inventories reduces expenses: cost of goods sold falls to 400 and profit rises to 600. Cash does not change. &lt;span class=&quot;src&quot;&gt;slides 16–18&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: inventory &quot;absorbs&quot; cash. Profit grows by 200, but those 200 are goods paid for and not yet sold. Total payments to suppliers: 300 + 200 = 500.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H4.&lt;/b&gt; 50 of TFR is accrued, not paid. Profit falls to 550 and the TFR fund rises by 50. &lt;span class=&quot;src&quot;&gt;slides 19–21&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 50&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt; (200 + 200 − 100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;50&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: a non-cash expense lowers EBIT but not cash. Under the indirect method the increase in the fund is added back. It is the same logic as depreciation.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H5.&lt;/b&gt; During the year 20 of TFR is paid (for example to an employee who leaves the company). The fund falls from 50 to 30 and cash to 280. &lt;span class=&quot;src&quot;&gt;slides 22–24&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 − 20 = 280&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;30&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase (net)&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;30&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: under the indirect method what matters is the &lt;b&gt;net&lt;/b&gt; change in the fund (accrual 50 − utilisation 20 = 30). The utilisation is the only part of the TFR that actually leaves the cash account.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H6.&lt;/b&gt; 10 is set aside as an &lt;i&gt;allowance for doubtful accounts&lt;/i&gt;, because some customers may not pay. Net receivables fall to 190 and profit to 540. &lt;span class=&quot;src&quot;&gt;slides 25–27&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;280&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Allowances&lt;/span&gt;&lt;span&gt;(10)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;= net&lt;/span&gt;&lt;span&gt;190&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;540&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;30&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Provisions doubtful a/r&lt;/span&gt;&lt;span&gt;10&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;540&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1,000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;IS&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;− Receivables incr. (190)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;810&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Provisions&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(10)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(10)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;540&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables (net)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;190&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;290&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;540&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(290)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;30&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Interpretation: the allowance does not affect cash (it stays at 280). Under the direct method the slide adjusts revenue for the change in &lt;i&gt;net&lt;/i&gt; receivables (190 → 810) and then reports the 10 of provision: 810 − 10 = 800, i.e. the actual collections. Under the indirect method the effect is &quot;inside&quot; working capital: using net receivables, NCWC grows by 10 less.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Comparison of EBIT and operating cash flow across the six cases&quot;&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;text x=&quot;20&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;EBIT (light bar) and gross current operating CF (solid bar), H1–H6&lt;/text&gt;

&lt;/svg&gt;
&lt;figcaption&gt;EBIT changes with every hypothesis (400 → 600 → 540), while cash barely moves (300 → 280): the income statement and cash tell different stories.&lt;/figcaption&gt;

&lt;script&gt;
(function(){var d=[[&#x27;H1&#x27;,400,300],[&#x27;H2&#x27;,400,300],[&#x27;H3&#x27;,600,300],[&#x27;H4&#x27;,550,300],[&#x27;H5&#x27;,550,280],[&#x27;H6&#x27;,540,280]],s=&#x27;&#x27;;
d.forEach(function(r,k){var x=60+k*115,h1=r[1]/650*150,h2=r[2]/650*150;
s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(180-h1)+&#x27;&quot; width=&quot;38&quot; height=&quot;&#x27;+h1+&#x27;&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&#x27;;
s+=&#x27;&lt;rect x=&quot;&#x27;+(x+42)+&#x27;&quot; y=&quot;&#x27;+(180-h2)+&#x27;&quot; width=&quot;38&quot; height=&quot;&#x27;+h2+&#x27;&quot; fill=&quot;var(--ochre)&quot;/&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+19)+&#x27;&quot; y=&quot;&#x27;+(175-h1)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;&#x27;+r[1]+&#x27;&lt;/text&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+61)+&#x27;&quot; y=&quot;&#x27;+(175-h2)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;&#x27;+r[2]+&#x27;&lt;/text&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+40)+&#x27;&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;});
document.getElementById(&#x27;hbars&#x27;).innerHTML=s;})();
&lt;/script&gt;

&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:100}&#x27;&gt;H1&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100}&#x27;&gt;H2&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200}&#x27;&gt;H3&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50}&#x27;&gt;H4&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50,&quot;Tp&quot;:20}&#x27;&gt;H5&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50,&quot;Tp&quot;:20,&quot;S&quot;:10}&#x27;&gt;H6&lt;/button&gt;
&lt;/div&gt;

&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_dC&quot;&gt;Δ gross trade receivables &lt;output id=&quot;o_dC&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_dC&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_dI&quot;&gt;Δ inventories &lt;output id=&quot;o_dI&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_dI&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;&lt;/div&gt;
