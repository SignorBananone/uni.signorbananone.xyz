&lt;/figure&gt;
&lt;script&gt;
(function(){var d=[[&#x27;H1&#x27;,400,300],[&#x27;H2&#x27;,400,300],[&#x27;H3&#x27;,600,300],[&#x27;H4&#x27;,550,300],[&#x27;H5&#x27;,550,280],[&#x27;H6&#x27;,540,280]],s=&#x27;&#x27;;
d.forEach(function(r,k){var x=60+k*115,h1=r[1]/650*150,h2=r[2]/650*150;
s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(180-h1)+&#x27;&quot; width=&quot;38&quot; height=&quot;&#x27;+h1+&#x27;&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&#x27;;
s+=&#x27;&lt;rect x=&quot;&#x27;+(x+42)+&#x27;&quot; y=&quot;&#x27;+(180-h2)+&#x27;&quot; width=&quot;38&quot; height=&quot;&#x27;+h2+&#x27;&quot; fill=&quot;var(--ochre)&quot;/&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+19)+&#x27;&quot; y=&quot;&#x27;+(175-h1)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;&#x27;+r[1]+&#x27;&lt;/text&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+61)+&#x27;&quot; y=&quot;&#x27;+(175-h2)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;&#x27;+r[2]+&#x27;&lt;/text&gt;&#x27;;
s+=&#x27;&lt;text x=&quot;&#x27;+(x+40)+&#x27;&quot; y=&quot;198&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+r[0]+&#x27;&lt;/text&gt;&#x27;;});
document.getElementById(&#x27;hbars&#x27;).innerHTML=s;})();
&lt;/script&gt;

&lt;h3 id=&quot;simulatore&quot;&gt;Simulatore: costruisci il tuo caso&lt;/h3&gt;
&lt;p&gt;Muovi i cursori. Il simulatore applica la stessa logica delle slide e calcola il flusso con entrambi i metodi, che coincidono sempre. I pulsanti caricano le ipotesi H1–H6.&lt;/p&gt;
&lt;div class=&quot;chips&quot; style=&quot;margin-bottom:12px&quot;&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:100}&#x27;&gt;H1&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100}&#x27;&gt;H2&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200}&#x27;&gt;H3&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50}&#x27;&gt;H4&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50,&quot;Tp&quot;:20}&#x27;&gt;H5&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-preset=&#x27;{&quot;R&quot;:1000,&quot;A&quot;:600,&quot;dC&quot;:200,&quot;dP&quot;:100,&quot;dI&quot;:200,&quot;T&quot;:50,&quot;Tp&quot;:20,&quot;S&quot;:10}&#x27;&gt;H6&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;sim card&quot; id=&quot;simbox&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_R&quot;&gt;Ricavi (income) &lt;output id=&quot;o_R&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_R&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_A&quot;&gt;Acquisti (purchase costs) &lt;output id=&quot;o_A&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_A&quot; min=&quot;0&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;600&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_dC&quot;&gt;Δ crediti commerciali lordi &lt;output id=&quot;o_dC&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_dC&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_dI&quot;&gt;Δ rimanenze &lt;output id=&quot;o_dI&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_dI&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_dP&quot;&gt;Δ debiti commerciali &lt;output id=&quot;o_dP&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_dP&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_T&quot;&gt;TFR accantonato &lt;output id=&quot;o_T&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_T&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_Tp&quot;&gt;TFR pagato (≤ accantonato) &lt;output id=&quot;o_Tp&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_Tp&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;20&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;s_S&quot;&gt;Svalutazione crediti (≤ Δ crediti) &lt;output id=&quot;o_S&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s_S&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;svg viewBox=&quot;0 0 580 230&quot; id=&quot;wf&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata da EBIT a cash flow&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:8px;font-size:.88rem&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Indirect&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Ricavi&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_R&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− costo del venduto (A − ΔI)&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cogs&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− TFR&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_T&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− svalutazione&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_S&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;EBIT&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b id=&quot;r_e2&quot;&gt;&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Δ NCWC&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_nwc2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Δ fondo TFR&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_dt&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;CF operativo&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cfi&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Direct&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Incassi da clienti&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_inc&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pagamenti a fornitori&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_pay&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;TFR pagato&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_tp&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;CF operativo&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;r_cfd&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;note&quot;&gt;EBIT &lt;span id=&quot;r_ebit&quot;&gt;&lt;/span&gt; · NCWC &lt;span id=&quot;r_nwc&quot;&gt;&lt;/span&gt; · scarto utile/cassa &lt;b id=&quot;r_gap&quot;&gt;&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Il modello è quello delle slide: un solo anno, nessun ammortamento, imposta o interesse. Vale CF = incassi − pagamenti a fornitori − TFR pagato, e lo stesso numero si ottiene come EBIT − ΔNCWC + Δfondo TFR.&lt;/p&gt;

&lt;h3 id=&quot;imposte&quot;&gt;Il ruolo delle imposte sul reddito&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt; In teoria le imposte andrebbero &lt;b&gt;ripartite tra le diverse aree&lt;/b&gt; del rendiconto, per vedere quanto &quot;pesano&quot; su ciascuna. Poiché di solito non è possibile, &lt;b&gt;si attribuiscono tutte alla gestione operativa corrente&lt;/b&gt;. Sul piano pratico, bisogna considerare sia l&#x27;&lt;b&gt;impatto economico&lt;/b&gt; (l&#x27;imposta di competenza nel CE) sia la &lt;b&gt;variazione dei debiti tributari&lt;/b&gt;, perché alcune imposte si pagano nell&#x27;anno e altre negli anni successivi.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Imposte pagate = Imposte di competenza − Δ debiti tributari&lt;small&gt;Esempio didattico: imposte a CE 120, debiti tributari da 40 a 70 (+30) → imposte pagate 90.&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;È la stessa regola che IAS 7 fissa al par. 35 (&lt;a href=&quot;#tasse&quot;&gt;vedi Parte IV&lt;/a&gt;).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;EBIT 500, crediti +80, rimanenze −30, debiti fornitori +20. Quanto vale il flusso operativo con il metodo indiretto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;ΔNCWC = 80 − 30 − 20 = +30. CF = 500 − 30 = &lt;b&gt;470&lt;/b&gt;. La diminuzione delle rimanenze libera cassa, l&#x27;aumento dei debiti la trattiene.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché in H3 l&#x27;utile sale da 400 a 600 ma la cassa resta 300?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché i 200 di beni rimasti in magazzino escono dal costo del venduto (competenza), ma sono già stati pagati o sono a debito: il costo è &quot;rinviato&quot;, l&#x27;uscita di cassa no. Il metodo indiretto lo corregge sottraendo l&#x27;aumento delle rimanenze.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In H5 perché si somma +30 e non +50?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché il fondo TFR è cresciuto solo di 30 (accantonamento 50 meno utilizzo 20). I 20 pagati sono un&#x27;uscita reale e restano nel flusso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa rappresentano &quot;gross potential&quot; e &quot;gross current&quot; operating CF?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Il primo è l&#x27;EBIT, cioè il flusso che si avrebbe se tutto fosse regolato per cassa. Il secondo è il flusso effettivamente generato, dopo le rettifiche per circolante e poste non monetarie.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Se le imposte non si possono ripartire tra le aree, dove vanno?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Nella gestione operativa corrente, calcolando l&#x27;uscita come imposte di competenza meno l&#x27;aumento dei debiti tributari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p3&quot; id=&quot;ias7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Parte III · Il principio IAS 7&lt;/span&gt;
&lt;h2&gt;IAS 7: che cosa chiede lo standard&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;IAS 7 è il principio contabile internazionale (&lt;i&gt;International Accounting Standard&lt;/i&gt;) che disciplina il rendiconto finanziario. Le slide lo presentano nella versione &lt;b&gt;modificata da IFRS 18&lt;/b&gt;: il testo &lt;ins&gt;sottolineato&lt;/ins&gt; è aggiunto, quello &lt;del&gt;barrato&lt;/del&gt; è eliminato. &lt;span class=&quot;src&quot;&gt;slide 29–51&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Una storia in quattro date&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 170&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo delle modifiche a IAS 7&quot;&gt;
&lt;line x1=&quot;40&quot; x2=&quot;830&quot; y1=&quot;80&quot; y2=&quot;80&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;circle cx=&quot;90&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;set. 2007&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;titolo: da «Cash Flow&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;Statements» a «Statement&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot;&gt;of Cash Flows» (IAS 1)&lt;/text&gt;
&lt;circle cx=&quot;300&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 gen. 2023&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;Reg. (UE) 2021/2036:&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;eliminata la lettera e)&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot;&gt;del par. 14 (assicurazioni)&lt;/text&gt;
&lt;circle cx=&quot;500&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 gen. 2024&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;amendments in vigore&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;(slide 51)&lt;/text&gt;
&lt;circle cx=&quot;640&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;apr. 2024&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;emesso IFRS 18,&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot;&gt;modifica IAS 7&lt;/text&gt;
&lt;circle cx=&quot;790&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--acc)&quot;&gt;1 gen. 2027&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot;&gt;IFRS 18 in vigore&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot;&gt;fonte esterna&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Le prime quattro date vengono dalle slide 30, 37 e 51. La data di efficacia di IFRS 18 è una fonte esterna (vedi sotto).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Nel settembre 2007 lo IASB (&lt;i&gt;International Accounting Standards Board&lt;/i&gt;, l&#x27;organismo che emana i principi IFRS) ha cambiato il titolo dello standard, in seguito alla revisione di IAS 1 &lt;i&gt;Presentation of Financial Statements&lt;/i&gt;. Nell&#x27;aprile 2024 ha emesso &lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;, che sostituisce IAS 1 e ne riprende i requisiti. IFRS 18 ha modificato i par. 6, 10, 12, 14, 16–18, 20, 31, 32, 35, 46 e 47, aggiunto i par. 33A e 34A–34D ed eliminato i par. 33 e 34. Le modifiche si applicano &lt;b&gt;quando si applica IFRS 18&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 30 · IAS 7.64&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo la pagina ufficiale dell&#x27;IFRS Foundation, IFRS 18 si applica agli esercizi che iniziano dal &lt;b&gt;1° gennaio 2027&lt;/b&gt; o dopo, ed è consentita l&#x27;applicazione anticipata. Nell&#x27;Unione europea è stato omologato con il Regolamento (UE) 2026/338 del febbraio 2026, con la stessa data. Si applica retroattivamente: chi chiude il bilancio a fine anno dovrà presentare anche i comparativi 2026 nel nuovo formato. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, EU adopts IFRS 18&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Objective&lt;/h4&gt;&lt;p&gt;Le informazioni sui flussi servono a chi legge il bilancio per valutare la &lt;b&gt;capacità dell&#x27;entità di generare cash and cash equivalents&lt;/b&gt; e i suoi &lt;b&gt;fabbisogni&lt;/b&gt; di cassa, insieme a &lt;b&gt;tempi e certezza&lt;/b&gt; di questi flussi. Lo standard chiede di fornire informazioni sulle &lt;b&gt;variazioni storiche&lt;/b&gt; di cassa ed equivalenti, tramite un rendiconto che classifica i flussi in &lt;b&gt;operating, investing e financing activities&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Scope · par. 1–3&lt;/h4&gt;&lt;p&gt;Ogni entità deve redigere il rendiconto come &lt;b&gt;parte integrante&lt;/b&gt; del bilancio, per ogni periodo presentato. Vale &lt;b&gt;qualunque sia l&#x27;attività&lt;/b&gt;, anche per una banca, dove la cassa è quasi &quot;il prodotto&quot;. Tutte le imprese hanno bisogno di cassa per gli stessi motivi: &lt;b&gt;operare, pagare le obbligazioni, remunerare gli investitori&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 32 · IAS 7.1, 7.3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Definizioni · par. 6&lt;/h3&gt;
&lt;p&gt;Apri ogni scheda per la definizione dello standard e il suo significato. &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash&lt;/b&gt; — cassa&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Cash comprises cash on hand and demand deposits.&lt;/p&gt;&lt;p&gt;Contanti e depositi a vista: conti correnti bancari e postali che si possono prelevare in qualsiasi momento.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash equivalents&lt;/b&gt; — mezzi equivalenti&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Short-term, highly liquid investments that are readily convertible to known amounts of cash and which are subject to an insignificant risk of changes in value.&lt;/p&gt;&lt;p&gt;Tre requisiti insieme: &lt;b&gt;breve termine&lt;/b&gt;, &lt;b&gt;convertibilità&lt;/b&gt; in un importo &lt;b&gt;noto&lt;/b&gt; di cassa, rischio di variazione del valore &lt;b&gt;trascurabile&lt;/b&gt;. Nella prassi il riferimento è una scadenza di circa tre mesi dall&#x27;acquisto, come dice anche la slide 7. Le azioni quotate, per esempio, non lo sono: il loro prezzo oscilla.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Cash flows&lt;/b&gt; — flussi finanziari&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Inflows and outflows of cash and cash equivalents.&lt;/p&gt;&lt;p&gt;Uno spostamento &lt;i&gt;tra&lt;/i&gt; cassa ed equivalenti (es. depositare contanti in un investimento a 2 mesi) non è un flusso: la grandezza di riferimento non cambia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Operating activities&lt;/b&gt; — attività operativa&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;The principal revenue-producing activities of the entity and other activities that are not investing or financing activities.&lt;/p&gt;&lt;p&gt;È la categoria &lt;b&gt;residuale&lt;/b&gt;: ciò che non è investimento né finanziamento finisce qui.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Investing activities&lt;/b&gt; — attività di investimento&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;The acquisition and disposal of long-term assets and other investments not included in cash equivalents &lt;ins&gt;and the receipt of interest and dividends as described in paragraphs 34A–34D&lt;/ins&gt;.&lt;/p&gt;&lt;p&gt;IFRS 18 aggiunge esplicitamente a questa categoria interessi e dividendi &lt;b&gt;ricevuti&lt;/b&gt; (vedi &lt;a href=&quot;#interessi&quot;&gt;Parte IV&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Financing activities&lt;/b&gt; — attività di finanziamento&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p class=&quot;quote&quot;&gt;Activities that result in changes in the size and composition of the contributed equity and borrowings of the entity.&lt;/p&gt;&lt;p&gt;Tutto ciò che modifica capitale apportato dai soci e debiti finanziari.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Presentazione · par. 10–12&lt;/h3&gt;
&lt;p&gt;Il rendiconto riporta i flussi del periodo classificati in &lt;b&gt;operating, investing e financing&lt;/b&gt;. &lt;ins&gt;IFRS 18 aggiunge&lt;/ins&gt; che nel prepararlo si applicano anche i requisiti generali dei par. 9–43 e 113–114 di IFRS 18. &lt;b&gt;Una singola operazione può contenere flussi classificati in modo diverso.&lt;/b&gt; IFRS 18 elimina però l&#x27;esempio classico della rata di un mutuo con quota interessi &quot;operativa&quot; e quota capitale &quot;finanziaria&quot;: dal momento che ora gli interessi pagati vanno di regola nel financing, l&#x27;esempio non regge più. &lt;span class=&quot;src&quot;&gt;slide 34 · IAS 7.10, 7.12&lt;/span&gt;&lt;/p&gt;

&lt;h3 id=&quot;attivita&quot;&gt;Le tre attività con gli esempi dello standard&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;Operating · par. 13–15&lt;/button&gt;&lt;button&gt;Investing · par. 16&lt;/button&gt;&lt;button&gt;Financing · par. 17&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Derivano soprattutto dalle &lt;b&gt;principali attività generatrici di ricavi&lt;/b&gt;, quindi in genere dalle operazioni che entrano nel calcolo dell&#x27;utile o della perdita. &lt;span class=&quot;src&quot;&gt;slide 35–36 · IAS 7.14&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;incassi dalla vendita di beni e dalla prestazione di servizi;&lt;/li&gt;&lt;li&gt;incassi da royalties, compensi, commissioni e altri ricavi;&lt;/li&gt;&lt;li&gt;pagamenti a fornitori di beni e servizi;&lt;/li&gt;&lt;li&gt;pagamenti ai dipendenti e per loro conto;&lt;/li&gt;&lt;li&gt;&lt;del&gt;[eliminata]&lt;/del&gt; premi e sinistri delle imprese di assicurazione, tolta dal Regolamento (UE) 2021/2036 del 19 novembre 2021, da applicare al più tardi dagli esercizi che iniziano dal 1° gennaio 2023;&lt;/li&gt;&lt;li&gt;pagamenti o rimborsi di imposte sul reddito, &lt;b&gt;salvo&lt;/b&gt; che siano specificamente riconducibili ad attività di finanziamento o investimento;&lt;/li&gt;&lt;li&gt;incassi e pagamenti da contratti detenuti per &lt;i&gt;dealing or trading&lt;/i&gt; (negoziazione);&lt;/li&gt;&lt;li&gt;&lt;ins&gt;incassi di dividendi e incassi e pagamenti di interessi come descritto nei par. 34B–34D&lt;/ins&gt; (cioè per le entità con attività principale di investimento o finanziamento).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Presentarli &lt;ins&gt;separatamente&lt;/ins&gt; (IFRS 18 cambia &lt;del&gt;disclosure&lt;/del&gt; in &lt;ins&gt;presentation&lt;/ins&gt;) è importante perché mostrano quanto si è speso per risorse destinate a generare &lt;b&gt;redditi e flussi futuri&lt;/b&gt;. &lt;b&gt;Solo le spese che portano a rilevare un&#x27;attività nello stato patrimoniale&lt;/b&gt; possono essere classificate come investimento. Per esempio, la ricerca spesata a conto economico non è un investimento. &lt;span class=&quot;src&quot;&gt;slide 37–39 · IAS 7.16&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;pagamenti per acquisire immobili, impianti e macchinari (&lt;i&gt;property, plant and equipment&lt;/i&gt;), immateriali e altre attività a lungo termine, compresi i costi di sviluppo capitalizzati e le costruzioni in economia;&lt;/li&gt;&lt;li&gt;incassi dalla vendita di queste attività;&lt;/li&gt;&lt;li&gt;pagamenti per acquisire strumenti di capitale o di debito di altre entità, &lt;ins&gt;including&lt;/ins&gt; partecipazioni in &lt;ins&gt;associates and&lt;/ins&gt; joint ventures (escluse le partecipazioni che sono cash equivalents o detenute per trading);&lt;/li&gt;&lt;li&gt;incassi dalla loro vendita (con le stesse esclusioni);&lt;/li&gt;&lt;li&gt;anticipi e prestiti concessi a terzi (salvo che a concederli sia un&#x27;istituzione finanziaria);&lt;/li&gt;&lt;li&gt;incassi dal rimborso di quei prestiti;&lt;/li&gt;&lt;li&gt;pagamenti per futures, forward, opzioni e swap, salvo che siano detenuti per trading o classificati come financing;&lt;/li&gt;&lt;li&gt;incassi dagli stessi contratti, con le stesse eccezioni;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;incassi di interessi e dividendi come descritto nei par. 34A–34D&lt;/ins&gt;.&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;Regola di copertura: se un contratto è contabilizzato come &lt;i&gt;hedge&lt;/i&gt; (copertura) di una posizione identificabile, i suoi flussi si classificano come quelli della posizione coperta.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Presentarli &lt;ins&gt;separatamente&lt;/ins&gt; serve a &lt;b&gt;prevedere le pretese&lt;/b&gt; dei finanziatori sui flussi futuri dell&#x27;impresa. &lt;span class=&quot;src&quot;&gt;slide 40–41 · IAS 7.17&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;incassi dall&#x27;emissione di azioni o altri strumenti di capitale;&lt;/li&gt;&lt;li&gt;pagamenti ai soci per acquistare o rimborsare azioni proprie;&lt;/li&gt;&lt;li&gt;incassi dall&#x27;emissione di obbligazioni, prestiti, cambiali, mutui e altri finanziamenti a breve o lungo termine;&lt;/li&gt;&lt;li&gt;rimborsi di importi presi a prestito;&lt;/li&gt;&lt;li&gt;pagamenti del locatario (&lt;i&gt;lessee&lt;/i&gt;) per ridurre la passività per leasing;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;pagamenti di dividendi come descritto nel par. 33A&lt;/ins&gt;;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;pagamenti di interessi come descritto nei par. 34A–34D&lt;/ins&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Esercizio: dove lo classifichi?&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Si assume un&#x27;impresa industriale &lt;b&gt;senza&lt;/b&gt; attività principale di investimento o finanziamento e che applica IAS 7 come modificato da IFRS 18. &lt;span class=&quot;pill pO&quot;&gt;O&lt;/span&gt; operating · &lt;span class=&quot;pill pI&quot;&gt;I&lt;/span&gt; investing · &lt;span class=&quot;pill pF&quot;&gt;F&lt;/span&gt; financing.&lt;/p&gt;
&lt;div class=&quot;cls&quot;&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Incasso da un cliente per una fornitura dell&#x27;anno precedente&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Incasso da vendita di beni: par. 14(a), operating.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Acquisto di un nuovo macchinario&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Acquisto di PP&amp;amp;E: par. 16(a), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Quota capitale del canone di leasing pagata dal lessee&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Riduzione della passività per leasing: par. 17(e), financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Dividendi pagati agli azionisti&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 33A: i dividendi pagati vanno sempre nel financing. La vecchia opzione &quot;operating&quot; del par. 34 è stata eliminata.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Interessi pagati sul mutuo bancario&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 34A(a): per un&#x27;entità &quot;generica&quot; gli interessi pagati sono financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Dividendi ricevuti da una partecipata&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 34A(b): interessi e dividendi ricevuti sono investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Imposte sul reddito pagate (non riconducibili a operazioni specifiche)&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 35: operating, salvo identificazione specifica con investing o financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Costi di sviluppo capitalizzati, pagati nell&#x27;anno&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Generano un&#x27;attività immateriale rilevata: par. 16(a), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;F&quot;&gt;&lt;span&gt;Emissione di un prestito obbligazionario&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 17(c), financing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;I&quot;&gt;&lt;span&gt;Prestito concesso a un&#x27;altra società del gruppo&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Anticipi e prestiti a terzi (non da istituzione finanziaria): par. 16(e), investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Acquisto di titoli detenuti per trading&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 14(g): contratti per dealing o trading sono operating; il par. 16(c) li esclude espressamente dall&#x27;investing.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot; data-a=&quot;O&quot;&gt;&lt;span&gt;Stipendi pagati ai dipendenti&lt;/span&gt;&lt;span class=&quot;b&quot;&gt;&lt;button data-v=&quot;O&quot;&gt;O&lt;/button&gt;&lt;button data-v=&quot;I&quot;&gt;I&lt;/button&gt;&lt;button data-v=&quot;F&quot;&gt;F&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt; Par. 14(d), operating.&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;metodi&quot;&gt;Reporting dei flussi operativi: direct o indirect · par. 18–20&lt;/h3&gt;
&lt;p&gt;Lo standard ammette entrambi i metodi già visti nel laboratorio. &lt;span class=&quot;src&quot;&gt;slide 42–44 · IAS 7.18, 7.20&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;a) Direct method&lt;/h4&gt;&lt;p&gt;Si espongono le &lt;b&gt;principali classi di incassi e pagamenti lordi&lt;/b&gt;: incassi da clienti, pagamenti a fornitori, al personale…&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Dà più informazioni su quanto è successo davvero, ma richiede dati interni (slide 3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b) Indirect method&lt;/h4&gt;&lt;p&gt;Si parte dall&#x27;&lt;b&gt;&lt;ins&gt;operating profit or loss&lt;/ins&gt;&lt;/b&gt; e lo si rettifica per:&lt;/p&gt;
&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;effetti delle operazioni di natura non monetaria;&lt;/li&gt;&lt;li&gt;differimenti o ratei di incassi e pagamenti operativi passati o futuri;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;proventi od oneri classificati nella categoria &lt;i&gt;operating&lt;/i&gt; del conto economico i cui flussi sono investing o financing;&lt;/ins&gt;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;flussi operativi i cui proventi od oneri non sono nella categoria &lt;i&gt;operating&lt;/i&gt; del conto economico.&lt;/ins&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Il par. 20 dettaglia le rettifiche del metodo indiretto:&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;variazioni nel periodo di &lt;b&gt;rimanenze, crediti e debiti operativi&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;poste non monetarie come &lt;b&gt;ammortamenti, accantonamenti&lt;/b&gt; e utili/perdite su cambi non realizzati &lt;ins&gt;classificati nella categoria operating&lt;/ins&gt;. Le voci &lt;del&gt;deferred taxes&lt;/del&gt; e &lt;del&gt;undistributed profits of associates&lt;/del&gt; sono eliminate dall&#x27;elenco;&lt;/li&gt;&lt;li&gt;&lt;ins&gt;proventi od oneri della categoria operating&lt;/ins&gt; i cui effetti di cassa sono investing o financing (es. una plusvalenza da vendita di un impianto: l&#x27;incasso va nell&#x27;investing);&lt;/li&gt;&lt;li&gt;&lt;ins&gt;flussi operativi, come le imposte sul reddito (par. 35), i cui proventi od oneri non sono nella categoria operating&lt;/ins&gt; del conto economico.&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;Esiste anche una variante del metodo indiretto: mostrare i ricavi e i costi &lt;ins&gt;classificati nella categoria operating&lt;/ins&gt;, le variazioni di rimanenze, crediti e debiti operativi &lt;ins&gt;e ogni altro flusso operativo i cui proventi od oneri non sono nella categoria operating&lt;/ins&gt;.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Perché si parla di &quot;categoria operating&quot;? IFRS 18 divide il conto economico in categorie (&lt;i&gt;operating, investing, financing, income taxes, discontinued operations&lt;/i&gt;) e introduce il subtotale obbligatorio &lt;b&gt;operating profit or loss&lt;/b&gt;. Questo subtotale diventa il punto di partenza unico del metodo indiretto, al posto dell&#x27;utile netto o di altri risultati scelti dalle imprese. — &lt;a href=&quot;https://kpmg.com/us/en/articles/2026/ifrs-18-changes-statement-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KPMG, IFRS 18 changes to the statement of cash flows&lt;/a&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Collegamento tra il metodo indiretto delle slide e lo standard&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Laboratorio (slide 11–27)&lt;/text&gt;
&lt;text x=&quot;40&quot; y=&quot;72&quot;&gt;EBIT&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;96&quot;&gt;− Δ Net Commercial Working Capital&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;120&quot;&gt;+ Δ fondo TFR, accantonamenti&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;= Gross current operating CF&lt;/text&gt;
&lt;rect x=&quot;410&quot; y=&quot;20&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;IAS 7.20 (con IFRS 18)&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;72&quot;&gt;Operating profit or loss&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;96&quot;&gt;± (a) Δ inventories, receivables, payables&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;120&quot;&gt;+ (b) depreciation, provisions…&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;= Net cash from operating activities&lt;/text&gt;
&lt;path d=&quot;M352,96 L408,96&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M352,120 L408,120&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M352,72 L408,72&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Il modello della prima parte della lezione è la versione didattica delle lettere (a) e (b) del par. 20.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quali tre requisiti deve avere un investimento per essere un cash equivalent?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Breve termine ed elevata liquidità; prontamente convertibile in un importo noto di cassa; rischio di variazione del valore trascurabile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;attività operativa è definita &quot;in negativo&quot;?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché comprende le principali attività generatrici di ricavi e &lt;i&gt;tutte le altre&lt;/i&gt; che non sono investing o financing: è la categoria residuale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una spesa di ricerca pagata e spesata a conto economico può essere un investing cash flow?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. Il par. 16 ammette nell&#x27;investing solo le spese che danno luogo a un&#x27;attività rilevata nello stato patrimoniale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una banca è esentata dal rendiconto finanziario perché la cassa è il suo prodotto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;No. Il par. 3 lo esclude: tutte le entità hanno bisogno di cassa per operare, pagare le obbligazioni e remunerare gli investitori, quindi tutte devono presentarlo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Con IFRS 18, da quale grandezza parte il metodo indiretto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Dall&#x27;&lt;i&gt;operating profit or loss&lt;/i&gt;, il subtotale obbligatorio di IFRS 18 (par. 18(b) modificato).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p4&quot; id=&quot;interessi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Parte IV · IFRS 18 e casi&lt;/span&gt;
&lt;h2&gt;Interest and dividends · par. 31–34D&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;È il cambiamento più visibile di IFRS 18 sul rendiconto: le &lt;b&gt;opzioni di classificazione&lt;/b&gt; spariscono. Al loro posto ci sono regole fisse, che dipendono dall&#x27;attività principale dell&#x27;entità. &lt;span class=&quot;src&quot;&gt;slide 45–49&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Restano in vigore due principi del par. 31: i flussi da interessi e dividendi, ricevuti e pagati, vanno &lt;b&gt;&lt;ins&gt;presentati&lt;/ins&gt;&lt;/b&gt; (non più &lt;del&gt;disclosed&lt;/del&gt;) &lt;b&gt;separatamente&lt;/b&gt;, e classificati in modo &lt;b&gt;coerente&lt;/b&gt; da un esercizio all&#x27;altro, &lt;ins&gt;applicando i par. 32, 33A e 34A–34D&lt;/ins&gt;.&lt;/p&gt;

&lt;div data-tabs&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;Prima di IFRS 18&lt;/button&gt;&lt;button&gt;Con IFRS 18&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Il vecchio par. 33, ora &lt;del&gt;eliminato&lt;/del&gt;, ammetteva che per le entità non finanziarie &lt;b&gt;non ci fosse consenso&lt;/b&gt; sulla classificazione. &lt;span class=&quot;src&quot;&gt;slide 45–46&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Interessi pagati e interessi e dividendi ricevuti potevano andare nell&#x27;&lt;b&gt;operating&lt;/b&gt;, perché entrano nel calcolo dell&#x27;utile;&lt;/li&gt;
&lt;li&gt;oppure, rispettivamente, nel &lt;b&gt;financing&lt;/b&gt; (costo per ottenere risorse) e nell&#x27;&lt;b&gt;investing&lt;/b&gt; (rendimento di investimenti);&lt;/li&gt;
&lt;li&gt;dividendi pagati: &lt;b&gt;financing&lt;/b&gt; (costo delle risorse finanziarie) oppure &lt;b&gt;operating&lt;/b&gt;, per mostrare se l&#x27;impresa riesce a pagarli con i flussi operativi (vecchio par. 34).&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;Effetto pratico: due imprese identiche potevano mostrare flussi operativi diversi solo per scelte di classificazione. Era un problema di comparabilità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Flusso&lt;/th&gt;&lt;th&gt;Entità &quot;generica&quot; (34A, 33A)&lt;/th&gt;&lt;th&gt;Main business activity (34B–34D)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dividendi pagati&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt; (33A)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt; (33A)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interessi pagati&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pF&quot;&gt;Financing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Come nel conto economico&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interessi ricevuti&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pI&quot;&gt;Investing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Come nel conto economico&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dividendi ricevuti&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill pI&quot;&gt;Investing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Come nel conto economico&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;note&quot;&gt;L&#x27;entità con &lt;i&gt;main business activity&lt;/i&gt; è quella che investe in attività o fornisce finanziamenti ai clienti come attività principale (banche, holding di investimento, società di credito al consumo…), individuata con i par. B30–B41 di IFRS 18. &lt;span class=&quot;src&quot;&gt;slide 47&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Albero decisionale per classificare interessi e dividendi&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;rect x=&quot;250&quot; y=&quot;12&quot; width=&quot;360&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;L&#x27;entità investe in attività o finanzia clienti&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;come main business activity? (IFRS 18 B30–B41)&lt;/text&gt;
&lt;path d=&quot;M330,68 L180,110&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;No&lt;/text&gt;
&lt;path d=&quot;M530,68 L650,110&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Sì&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;112&quot; width=&quot;320&quot; height=&quot;100&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Par. 34A · regola fissa&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;160&quot;&gt;interessi pagati → &lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;160&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Financing&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;182&quot;&gt;interessi e dividendi ricevuti → &lt;/text&gt;&lt;text x=&quot;226&quot; y=&quot;182&quot; font-weight=&quot;600&quot; fill=&quot;var(--ochre)&quot;&gt;Investing&lt;/text&gt;
&lt;text x=&quot;36&quot; y=&quot;204&quot;&gt;dividendi pagati (33A) → &lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;204&quot; font-weight=&quot;600&quot; fill=&quot;var(--slate)&quot;&gt;Financing&lt;/text&gt;
&lt;rect x=&quot;460&quot; y=&quot;112&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;650&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Par. 34B · segui il conto economico&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot;&gt;totale di ciascun flusso in &lt;tspan font-weight=&quot;600&quot;&gt;una sola&lt;/tspan&gt; categoria&lt;/text&gt;
&lt;path d=&quot;M560,168 L520,206&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M740,168 L780,206&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;400&quot; y=&quot;208&quot; width=&quot;225&quot; height=&quot;82&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;512&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;34C · a CE in 1 categoria&lt;/text&gt;&lt;text x=&quot;512&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;→ stessa attività nel&lt;/text&gt;&lt;text x=&quot;512&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;rendiconto&lt;/text&gt;
&lt;rect x=&quot;640&quot; y=&quot;208&quot; width=&quot;200&quot; height=&quot;82&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;740&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;34D · a CE in più categorie&lt;/text&gt;&lt;text x=&quot;740&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;→ accounting policy&lt;/text&gt;&lt;text x=&quot;740&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot;&gt;choice, una sola attività&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Albero decisionale ricostruito dai par. 33A e 34A–34D riportati nelle slide 46–49.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Esempi dello standard per 34C e 34D&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
&lt;p&gt;&lt;b&gt;34C&lt;/b&gt;: se l&#x27;entità classifica &lt;i&gt;tutti&lt;/i&gt; gli interessi passivi nella categoria financing del conto economico, classificherà tutti gli interessi pagati come financing nel rendiconto. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;34D&lt;/b&gt;: se gli interessi passivi stanno in parte nella categoria operating e in parte nella financing, l&#x27;entità sceglie una &lt;i&gt;accounting policy&lt;/i&gt; (un criterio contabile da applicare sempre) e mette &lt;b&gt;tutti&lt;/b&gt; gli interessi pagati o nell&#x27;operating o nel financing. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;tasse&quot;&gt;Taxes on income · par. 35–36&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;I flussi da imposte sul reddito vanno &lt;b&gt;&lt;ins&gt;presentati&lt;/ins&gt; separatamente&lt;/b&gt; e classificati come &lt;b&gt;operating&lt;/b&gt;, &lt;b&gt;a meno che&lt;/b&gt; non siano specificamente riconducibili ad attività di finanziamento o di investimento. &lt;span class=&quot;src&quot;&gt;slide 50 · IAS 7.35&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;È la versione normativa di quanto visto nella &lt;a href=&quot;#imposte&quot;&gt;Parte II&lt;/a&gt;: in teoria andrebbero ripartite tra le aree, ma nella pratica quasi sempre finiscono nell&#x27;operating. Con IFRS 18 le imposte hanno una propria categoria nel conto economico, fuori dall&#x27;&lt;i&gt;operating&lt;/i&gt;. Per questo nel metodo indiretto vanno aggiunte come rettifica, secondo il par. 20(d).&lt;/p&gt;

&lt;h3&gt;Amendments · in vigore dal 1° gennaio 2024&lt;/h3&gt;
&lt;p&gt;Le slide indicano che &quot;the amendments became effective for annual reporting periods beginning on or after &lt;b&gt;1 January 2024&lt;/b&gt;&quot;. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La slide non dice di quali modifiche si tratti, e la data non coincide con IFRS 18, in vigore dal 2027. Il 1° gennaio 2024 è la data di efficacia degli emendamenti a IAS 7 e IFRS 7 sui &lt;b&gt;Supplier Finance Arrangements&lt;/b&gt; (accordi di &lt;i&gt;reverse factoring&lt;/i&gt;, in cui una banca paga i fornitori al posto dell&#x27;impresa), emessi dallo IASB il 25 maggio 2023. Chiedono informazioni aggiuntive su termini, importi e scadenze di questi accordi e sul loro effetto sulle passività e sui flussi. Non cambiano rilevazione né valutazione. Conviene chiedere conferma al docente se la slide si riferisca proprio a questi. — &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IASB publishes amendments on supplier finance arrangements&lt;/a&gt;&lt;/div&gt;

&lt;h3 id=&quot;esempio&quot;&gt;Esempio: il metodo indiretto in un caso reale&lt;/h3&gt;
&lt;p&gt;L&#x27;ultimo esempio viene da &lt;b&gt;David Alexander e Simon Archer (2017), &lt;i&gt;International Accounting / Financial Reporting Standards Guide&lt;/i&gt;, Wolters Kluwer&lt;/b&gt;. È un prospetto di calcolo del flusso operativo con il metodo indiretto, che parte dall&#x27;utile netto. &lt;span class=&quot;src&quot;&gt;slide 52–53&lt;/span&gt; Premi «Riga successiva» per costruirlo una riga alla volta e leggere il perché di ogni rettifica.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Net income&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;8,000&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot; class=&quot;note&quot;&gt;Adjustments to reconcile net income to net cash provided by operating activities:&lt;/td&gt;&lt;/tr&gt;
&lt;tbody id=&quot;exrows&quot;&gt;
&lt;tr data-v=&quot;8600&quot; data-e=&quot;&lt;b&gt;Depreciation and amortization +8,600&lt;/b&gt;: costi non monetari che hanno ridotto l&#x27;utile senza far uscire cassa. Si sommano, come il TFR in H4.&quot;&gt;&lt;td&gt;Depreciation and amortization&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,600&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;750&quot; data-e=&quot;&lt;b&gt;Provisions for doubtful accounts receivable +750&lt;/b&gt;: accantonamento non monetario, come in H6. Qui si somma perché la variazione dei crediti più sotto è calcolata al lordo.&quot;&gt;&lt;td&gt;Provisions for doubtful accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;1000&quot; data-e=&quot;&lt;b&gt;Provision for deferred income taxes +1,000&lt;/b&gt;: imposte di competenza che si pagheranno in futuro. Non sono uscite dell&#x27;anno (slide 28: alcune imposte si pagano negli anni successivi).&quot;&gt;&lt;td&gt;&lt;i&gt;Provision for deferred income taxes&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-2100&quot; data-e=&quot;&lt;b&gt;Undistributed earnings of affiliate −2,100&lt;/b&gt;: quota dell&#x27;utile di una partecipata (metodo del patrimonio netto) che entra nel conto economico ma non è stata distribuita come dividendo. Nessun incasso: si sottrae.&quot;&gt;&lt;td&gt;&lt;i&gt;Undistributed earnings of affiliate&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(2,100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-2500&quot; data-e=&quot;&lt;b&gt;Gain on sale of equipment −2,500&lt;/b&gt;: la plusvalenza è nell&#x27;utile, ma l&#x27;intero incasso della vendita va nell&#x27;&lt;i&gt;investing&lt;/i&gt; (par. 16(b)). Si toglie per non contarla due volte. È il caso del par. 20(c).&quot;&gt;&lt;td&gt;&lt;i&gt;Gain on sale of equipment&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(2,500)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;2500&quot; data-e=&quot;&lt;b&gt;Payment received on installment sale of product +2,500&lt;/b&gt;: incasso di una rata di una vendita già registrata come ricavo negli anni passati. È un&#x27;entrata senza ricavo nell&#x27;anno: è un «deferral» del par. 18(b)(ii).&quot;&gt;&lt;td&gt;&lt;i&gt;Payment received on installment sale of product&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-7750&quot; data-e=&quot;&lt;b&gt;Increase in accounts receivable −7,750&lt;/b&gt;: vendite non ancora incassate. Aumento del circolante, si sottrae (H1). Le variazioni sono «net of effects from purchase of XYZ Company»: il circolante entrato con l&#x27;acquisizione di una controllata non conta qui, perché l&#x27;acquisto va nell&#x27;investing come voce unica.&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in accounts receivable&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(7,750)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;-4000&quot; data-e=&quot;&lt;b&gt;Increase in inventory −4,000&lt;/b&gt;: il magazzino assorbe cassa (H3).&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in inventory&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(4,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-v=&quot;3850&quot; data-e=&quot;&lt;b&gt;Increase in accounts payable and accrued expenses +3,850&lt;/b&gt;: costi non ancora pagati. Finanziamento operativo, si sommano (H2). Totale rettifiche: &lt;b&gt;+350&lt;/b&gt;.&quot;&gt;&lt;td&gt;&lt;i&gt;Increase in accounts payable and accrued expenses&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,850&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net cash provided (used) by operating activities&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;extot&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;exexpl&quot; style=&quot;min-height:4.5em;margin-top:12px&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;exnext&quot;&gt;Riga successiva →&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;exreset&quot;&gt;Ricomincia&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;8,000 + (8,600 + 750 + 1,000 − 2,100 − 2,500 + 2,500 − 7,750 − 4,000 + 3,850) = 8,000 + 350 = &lt;b&gt;8,350&lt;/b&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Il libro è del 2017, prima di IFRS 18, quindi parte dal &lt;i&gt;net income&lt;/i&gt;. Con IFRS 18 si partirebbe dall&#x27;&lt;i&gt;operating profit or loss&lt;/i&gt;: righe come le imposte differite o la quota di utile della collegata non comparirebbero, perché quelle voci non sono nella categoria operating. Non a caso IFRS 18 ha tolto &lt;del&gt;deferred taxes&lt;/del&gt; e &lt;del&gt;undistributed profits of associates&lt;/del&gt; dal par. 20(b) (slide 43).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un&#x27;impresa manifatturiera paga 40 di interessi e 100 di dividendi e riceve 15 di dividendi. Come li classifica con IFRS 18?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Interessi pagati 40 → financing (34A(a)); dividendi pagati 100 → financing (33A); dividendi ricevuti 15 → investing (34A(b)).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una banca può classificare gli interessi pagati come operating?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Sì, se è un&#x27;entità con main business activity di finanziamento e nel conto economico classifica gli interessi passivi nella categoria operating (34B–34C). Se li classifica in più categorie, sceglie una policy unica (34D).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la plusvalenza da cessione di un impianto si sottrae nel metodo indiretto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Perché è inclusa nell&#x27;utile, ma l&#x27;incasso complessivo della vendita (valore contabile + plusvalenza) si presenta nell&#x27;investing. Lasciarla nell&#x27;operating la conterebbe due volte.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le imposte sul reddito pagate vanno sempre nell&#x27;operating?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;Di regola sì, a meno che non siano specificamente identificabili con attività di investimento o finanziamento (par. 35). Vanno comunque presentate separatamente.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nell&#x27;esempio, che cosa vuol dire &quot;undistributed earnings of affiliate (2,100)&quot;?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;&lt;p&gt;È la quota dell&#x27;utile di una partecipata, rilevata con il metodo del patrimonio netto, che non è stata incassata come dividendo. Aumenta l&#x27;utile ma non la cassa, quindi si sottrae.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p5&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Per approfondire&lt;/span&gt;
&lt;h2&gt;Testi, norme e standard citati nelle slide&lt;/h2&gt;
&lt;p&gt;Per ogni riferimento citato nelle slide ho cercato una fonte affidabile. Tutto ciò che segue è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;, salvo la riga «Nelle slide».&lt;/p&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 7 &lt;i&gt;Statement of Cash Flows&lt;/i&gt; — IASB / IFRS Foundation&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; è l&#x27;argomento della lezione (slide 29–51).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La pagina ufficiale dell&#x27;IFRS Foundation offre il testo dello standard (aggiornato all&#x27;edizione 2026), la sintesi e i documenti collegati: &lt;i&gt;Basis for Conclusions&lt;/i&gt; ed esempi illustrativi. È il riferimento da usare per il testo vigente, al posto delle copie che circolano in rete. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 7&lt;/a&gt; · sintesi e cronologia: &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · IAS 7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; (aprile 2024)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; modifica numerosi paragrafi di IAS 7 (slide 30 e seguenti).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Sostituisce IAS 1. Introduce le categorie del conto economico (operating, investing, financing…), i subtotali obbligatori come l&#x27;&lt;i&gt;operating profit or loss&lt;/i&gt; e nuove regole di aggregazione e informativa. Si applica dal &lt;b&gt;1° gennaio 2027&lt;/b&gt;, retroattivamente, ed è consentita l&#x27;applicazione anticipata. Conta perché cambia il punto di partenza del metodo indiretto ed elimina le opzioni su interessi e dividendi. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt; · analisi degli effetti sul rendiconto: &lt;a href=&quot;https://kpmg.com/us/en/articles/2026/ifrs-18-changes-statement-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KPMG&lt;/a&gt;, &lt;a href=&quot;https://www.bdo.com.au/en-au/blogs/corporate-reporting/how-will-ifrs-18-impact-the-classification-of-interest-and-dividends-in-your-statement-of-cash-flows&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Regolamento (UE) 2026/338 — omologazione di IFRS 18&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; non citato. È collegato a IFRS 18 e serve a capire quando le modifiche si applicano in Italia.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Adottato il 13 febbraio 2026 e pubblicato in Gazzetta ufficiale il 16 febbraio 2026. Rende IFRS 18 e le modifiche collegate (comprese quelle a IAS 7) applicabili nell&#x27;UE dal 1° gennaio 2027. — &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.fondazioneoic.eu/31086/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione OIC&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 1 &lt;i&gt;Presentation of Financial Statements&lt;/i&gt; (revisione 2007)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; la sua revisione del 2007 ha portato al cambio di titolo di IAS 7 (slide 30).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La revisione, emessa il 6 settembre 2007 ed efficace dal 1° gennaio 2009, ha cambiato i nomi dei prospetti (per esempio «statement of financial position») e introdotto il prospetto del &lt;i&gt;comprehensive income&lt;/i&gt;. Da qui nasce «Statement of Cash Flows». Dal 2027 IAS 1 è sostituito da IFRS 18. — &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2007/revised-ias-1-phase-a/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Revised IAS 1 (Phase A)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Regolamento (UE) 2021/2036 della Commissione (19 novembre 2021)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; ha eliminato la lettera e) del par. 14 di IAS 7 (slide 36).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; È il regolamento che ha omologato nell&#x27;UE &lt;b&gt;IFRS 17 &lt;i&gt;Insurance Contracts&lt;/i&gt;&lt;/b&gt;, con le modifiche di giugno 2020 e un&#x27;esenzione facoltativa sulle «annual cohorts». Per questo la voce sui premi e sinistri assicurativi è uscita da IAS 7. Si applica dagli esercizi che iniziano dal 1° gennaio 2023. Su EUR-Lex risulta non più in vigore dal 15/10/2023, perché assorbito dal Regolamento (UE) 2023/1803, che ha consolidato tutti i principi omologati. — &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2021/2036/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · Reg. (UE) 2021/2036&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Amendments a IAS 7 e IFRS 7: &lt;i&gt;Supplier Finance Arrangements&lt;/i&gt; (maggio 2023)&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; la slide 51 cita «amendments» efficaci dal 1° gennaio 2024, senza indicarli. Si tratta probabilmente di questi.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Emessi il 25 maggio 2023 ed efficaci dal 1° gennaio 2024. Introducono informativa su termini e condizioni degli accordi di &lt;i&gt;supplier finance&lt;/i&gt;, sugli importi delle passività coinvolte e sui loro effetti su flussi e rischio di liquidità. — &lt;a href=&quot;https://www.iasplus.com/en/news/2023/05/sfa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · news&lt;/a&gt; · &lt;a href=&quot;https://www.pwc.ch/en/insights/accounting/new-ifrs-disclosures-on-supplier-finance-arrangements-effective-in-2024.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC Svizzera&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;David Alexander, Simon Archer — &lt;i&gt;International Accounting / Financial Reporting Standards Guide&lt;/i&gt; (2017), Wolters Kluwer&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Nelle slide:&lt;/b&gt; è la fonte dell&#x27;esempio finale sul metodo indiretto (slide 52–53).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Guida professionale aggiornata ogni anno (edizioni dal 2009 in poi; un tempo uscita come &lt;i&gt;Miller International Accounting/Financial Reporting Standards Guide&lt;/i&gt; per CCH). Commenta i principi IAS/IFRS divisi in standard generali e standard di settore, con esempi applicativi. Nella scheda del catalogo l&#x27;edizione «2017» risulta pubblicata nel 2016. Utile per esempi numerici; per il testo vigente conviene sempre il sito IFRS, perché l&#x27;edizione è precedente a IFRS 18. — &lt;a href=&quot;https://search.ub.tum.de/vufind/Record/DE-604.BV043840803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda bibliografica (TUM)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Fonte principale: «03 - IAS 7 - Statement of Cash Flows.pdf», Prof. Roberto Aprile, Università degli Studi di Bergamo, A.A. 2026-2027. I riferimenti «slide n» rimandano alle pagine del PDF.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // mappa cliccabile
  document.querySelectorAll(&#x27;.mapnode&#x27;).forEach(function(g){
    function go(){var t=g.getAttribute(&#x27;data-go&#x27;);var el=t===&#x27;#top&#x27;?document.body:document.querySelector(t);if(el)el.scrollIntoView({behavior:&#x27;smooth&#x27;});}
    g.addEventListener(&#x27;click&#x27;,go);
    g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go();}});
  });
  // passi
  document.querySelectorAll(&#x27;[data-steps]&#x27;).forEach(function(box){
    var steps=box.querySelectorAll(&#x27;.step&#x27;),bars=box.querySelectorAll(&#x27;.bar span&#x27;),i=0;
    var prev=box.querySelector(&#x27;[data-prev]&#x27;),next=box.querySelector(&#x27;[data-next]&#x27;),cnt=box.querySelector(&#x27;[data-count]&#x27;);
    function show(){steps.forEach(function(s,k){s.hidden=k!==i;});bars.forEach(function(b,k){b.classList.toggle(&#x27;on&#x27;,k&lt;=i);});
      prev.disabled=i===0;next.disabled=i===steps.length-1;cnt.textContent=(i+1)+&#x27; / &#x27;+steps.length;}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    show();
  });
  // linguette
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(box){
    var btns=box.querySelectorAll(&#x27;.tabs button&#x27;),panels=box.querySelectorAll(&#x27;.tabpanel&#x27;);
    btns.forEach(function(b,k){b.setAttribute(&#x27;role&#x27;,&#x27;tab&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===k?&#x27;true&#x27;:&#x27;false&#x27;);});
      panels.forEach(function(p,j){p.hidden=j!==k;});});});
    btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===0?&#x27;true&#x27;:&#x27;false&#x27;);});
    panels.forEach(function(p,j){p.hidden=j!==0;});
  });
  // classificazione
  document.querySelectorAll(&#x27;.cls .it&#x27;).forEach(function(it){
    var ok=it.getAttribute(&#x27;data-a&#x27;);
    it.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var r=b.getAttribute(&#x27;data-v&#x27;)===ok;it.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;);it.classList.add(r?&#x27;ok&#x27;:&#x27;ko&#x27;);
      var fb=it.querySelector(&#x27;.fb&#x27;);if(!fb.dataset.t)fb.dataset.t=fb.textContent;
      fb.innerHTML=&#x27;&lt;b&gt;&#x27;+(r?&#x27;✓ Corretto.&#x27;:&#x27;✗ Non proprio.&#x27;)+&#x27;&lt;/b&gt;&#x27;+fb.dataset.t;});});
  });
  // simulatore
  var sim=document.getElementById(&#x27;simbox&#x27;);
  if(sim){
    var ids=[&#x27;R&#x27;,&#x27;A&#x27;,&#x27;dC&#x27;,&#x27;dI&#x27;,&#x27;dP&#x27;,&#x27;T&#x27;,&#x27;Tp&#x27;,&#x27;S&#x27;],v={};
    function fmt(n){return n&lt;0?&#x27;(&#x27;+Math.abs(n)+&#x27;)&#x27;:String(n);}
    function upd(){
      ids.forEach(function(k){var el=document.getElementById(&#x27;s_&#x27;+k);v[k]=+el.value;document.getElementById(&#x27;o_&#x27;+k).textContent=el.value;});
      if(v.Tp&gt;v.T){v.Tp=v.T;document.getElementById(&#x27;s_Tp&#x27;).value=v.T;document.getElementById(&#x27;o_Tp&#x27;).textContent=v.T;}
      if(v.S&gt;v.dC){v.S=v.dC;document.getElementById(&#x27;s_S&#x27;).value=v.dC;document.getElementById(&#x27;o_S&#x27;).textContent=v.dC;}
      var cogs=v.A-v.dI,ebit=v.R-cogs-v.T-v.S,netC=v.dC-v.S,nwc=netC+v.dI-v.dP,dT=v.T-v.Tp;
      var cfi=ebit-nwc+dT,inc=v.R-v.dC,pay=v.A-v.dP,cfd=inc-pay-v.Tp;
      var set=function(id,x){var e=document.getElementById(id);if(e)e.textContent=fmt(x);};
      set(&#x27;r_ebit&#x27;,ebit);set(&#x27;r_cogs&#x27;,-cogs);set(&#x27;r_R&#x27;,v.R);set(&#x27;r_T&#x27;,-v.T);set(&#x27;r_S&#x27;,-v.S);
      set(&#x27;r_nc&#x27;,netC);set(&#x27;r_ni&#x27;,v.dI);set(&#x27;r_np&#x27;,-v.dP);set(&#x27;r_nwc&#x27;,nwc);
      set(&#x27;r_e2&#x27;,ebit);set(&#x27;r_nwc2&#x27;,-nwc);set(&#x27;r_dt&#x27;,dT);set(&#x27;r_cfi&#x27;,cfi);
      set(&#x27;r_inc&#x27;,inc);set(&#x27;r_pay&#x27;,-pay);set(&#x27;r_tp&#x27;,-v.Tp);set(&#x27;r_cfd&#x27;,cfd);
      document.getElementById(&#x27;r_gap&#x27;).textContent=fmt(ebit-cfi);
      // waterfall
      var items=[[&#x27;EBIT&#x27;,ebit,&#x27;t&#x27;],[&#x27;Δ crediti netti&#x27;,-netC],[&#x27;Δ rimanenze&#x27;,-v.dI],[&#x27;Δ debiti forn.&#x27;,v.dP],[&#x27;Δ fondo TFR&#x27;,dT],[&#x27;Cash flow&#x27;,cfi,&#x27;t&#x27;]];
      var W=560,top=22,bot=200,acc=0,vals=[0];
      items.forEach(function(it){acc=it[2]?it[1]:acc+it[1];vals.push(acc);});
      var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);if(max-min&lt;100)max=min+100;
      var pad=(max-min)*0.08;max+=pad;min-=pad;
      function y(x){return top+(max-x)/(max-min)*(bot-top);}
      var s=&#x27;&lt;line x1=&quot;40&quot; x2=&quot;&#x27;+W+&#x27;&quot; y1=&quot;&#x27;+y(0)+&#x27;&quot; y2=&quot;&#x27;+y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
      var run=0,bw=62,gap=20,x0=50;
      items.forEach(function(it,k){
        var x=x0+k*(bw+gap),a,b,col;
        if(it[2]===&#x27;t&#x27;){a=0;b=it[1];run=it[1];col=k===0?&#x27;var(--sage)&#x27;:&#x27;var(--acc)&#x27;;}
        else{a=run;b=run+it[1];run=b;col=it[1]&gt;=0?&#x27;var(--pos)&#x27;:&#x27;var(--neg)&#x27;;}
        var y1=y(Math.max(a,b)),y2=y(Math.min(a,b)),h=Math.max(1.5,y2-y1);
        s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; rx=&quot;3&quot; fill=&quot;&#x27;+col+&#x27;&quot; opacity=&quot;&#x27;+(it[2]?&#x27;.9&#x27;:&#x27;.65&#x27;)+&#x27;&quot;/&gt;&#x27;;
        s+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+(y1-5)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+fmt(it[1])+&#x27;&lt;/text&gt;&#x27;;
        s+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+(bot+22)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;var(--ink2)&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&#x27;;
        if(k&lt;items.length-1&amp;&amp;!(items[k+1][2]))s+=&#x27;&lt;line x1=&quot;&#x27;+(x+bw)+&#x27;&quot; x2=&quot;&#x27;+(x+bw+gap)+&#x27;&quot; y1=&quot;&#x27;+y(run)+&#x27;&quot; y2=&quot;&#x27;+y(run)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&#x27;;
      });
      document.getElementById(&#x27;wf&#x27;).innerHTML=s;
    }
    ids.forEach(function(k){document.getElementById(&#x27;s_&#x27;+k).addEventListener(&#x27;input&#x27;,upd);});
    document.querySelectorAll(&#x27;[data-preset]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var p=JSON.parse(b.getAttribute(&#x27;data-preset&#x27;));ids.forEach(function(k){document.getElementById(&#x27;s_&#x27;+k).value=p[k]||0;});upd();});});
    upd();
  }
  // esempio passo-passo
  var ex=document.getElementById(&#x27;exrows&#x27;);
  if(ex){
    var rows=ex.querySelectorAll(&#x27;tr[data-v]&#x27;),n=0,btn=document.getElementById(&#x27;exnext&#x27;),rb=document.getElementById(&#x27;exreset&#x27;),tot=document.getElementById(&#x27;extot&#x27;),expl=document.getElementById(&#x27;exexpl&#x27;);
    function draw(){var s=8000;rows.forEach(function(r,k){r.style.opacity=k&lt;n?1:.25;if(k&lt;n)s+=+r.getAttribute(&#x27;data-v&#x27;);});
      tot.textContent=s.toLocaleString(&#x27;en-US&#x27;);expl.innerHTML=n?rows[n-1].getAttribute(&#x27;data-e&#x27;):&#x27;Si parte dall\&#x27;utile netto: 8,000. Premi «Riga successiva».&#x27;;btn.disabled=n&gt;=rows.length;}
    btn.addEventListener(&#x27;click&#x27;,function(){if(n&lt;rows.length){n++;draw();}});
    rb.addEventListener(&#x27;click&#x27;,function(){n=0;draw();});
    draw();
  }
})();
&lt;/script&gt;
