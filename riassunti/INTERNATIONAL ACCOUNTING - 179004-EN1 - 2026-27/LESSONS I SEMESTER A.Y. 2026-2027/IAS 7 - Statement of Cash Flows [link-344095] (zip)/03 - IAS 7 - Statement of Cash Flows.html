&lt;h1&gt;IAS 7 &lt;i&gt;Statement of Cash Flows&lt;/i&gt;&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Da dove arriva la cassa di un&#x27;impresa e dove se ne va: come si costruisce il rendiconto finanziario, come lo regola il principio IAS 7 e che cosa cambia con IFRS 18.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Lezione 03 · Prof. Roberto Aprile&lt;/span&gt;&lt;span&gt;Master Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;54 slide · &lt;span class=&quot;t&quot;&gt;Theoretical aspects · Professional aspects · Examples&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/header&gt;

&lt;main&gt;
&lt;!-- MAPPA --&gt;
&lt;section class=&quot;part p5&quot; id=&quot;mappa&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Mappa concettuale&lt;/span&gt;
&lt;h2&gt;La lezione in un colpo d&#x27;occhio&lt;/h2&gt;
&lt;p&gt;La lezione ha due metà. La prima è &lt;b&gt;teorica e operativa&lt;/b&gt;: perché serve un rendiconto, come si costruisce, e sei casi numerici (H1–H6) che confrontano &lt;i&gt;direct&lt;/i&gt; e &lt;i&gt;indirect method&lt;/i&gt;. La seconda è &lt;b&gt;normativa&lt;/b&gt;: cosa chiede il principio IAS 7, con le modifiche di IFRS 18. Clicca un riquadro per andare alla sezione.&lt;/p&gt;

&lt;!-- PARTE I --&gt;
&lt;section class=&quot;part p1&quot; id=&quot;obiettivo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Parte I · Teoria&lt;/span&gt;
&lt;h2&gt;Perché serve un rendiconto finanziario&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Un&#x27;impresa può essere in utile e restare senza soldi. Il &lt;i&gt;cash flows statement&lt;/i&gt; (rendiconto finanziario) serve proprio a &lt;b&gt;mostrare quali aree della gestione hanno generato cassa e quali l&#x27;hanno assorbita&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Gli altri due prospetti non bastano:&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Income statement&lt;/h4&gt;&lt;p&gt;Il conto economico ragiona per &lt;b&gt;competenza&lt;/b&gt; (&lt;i&gt;accrual basis&lt;/i&gt;): registra ricavi e costi quando maturano, non quando si incassano o si pagano. Una vendita a credito fa salire l&#x27;utile senza far entrare un euro.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Balance sheet&lt;/h4&gt;&lt;p&gt;Lo stato patrimoniale è una &lt;b&gt;fotografia&lt;/b&gt; a una certa data. Confrontando due fotografie vedi che la cassa è cambiata, ma non &lt;i&gt;perché&lt;/i&gt; è cambiata.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cash flows statement&lt;/h4&gt;&lt;p&gt;È il &lt;b&gt;film&lt;/b&gt; tra le due fotografie: usa entrambi i prospetti, &lt;b&gt;riclassificati&lt;/b&gt;, insieme a &lt;b&gt;dati contabili interni&lt;/b&gt;, e spiega la variazione della cassa. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Lo stato patrimoniale iniziale e finale e il rendiconto che li collega&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;130&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Balance sheet t₀&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;cassa iniziale&lt;/text&gt;&lt;rect x=&quot;60&quot; y=&quot;104&quot; width=&quot;90&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Cash₀&lt;/text&gt;
&lt;rect x=&quot;670&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;130&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Balance sheet t₁&lt;/text&gt;&lt;text x=&quot;755&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;cassa finale&lt;/text&gt;&lt;rect x=&quot;710&quot; y=&quot;104&quot; width=&quot;90&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Cash₁&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;170&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-family=&quot;Newsreader,serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Cash flows statement&lt;/text&gt;
&lt;rect x=&quot;275&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Operating&lt;/text&gt;
&lt;rect x=&quot;380&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Investing&lt;/text&gt;
&lt;rect x=&quot;485&quot; y=&quot;62&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Financing&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Σ flussi (+ e −) = Cash₁ − Cash₀&lt;/text&gt;
&lt;text x=&quot;430&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;costruito con CE + SP riclassificati + dati interni&lt;/text&gt;
&lt;path d=&quot;M190,124 L248,124&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M612,124 L668,124&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Il rendiconto spiega come si passa dalla cassa iniziale a quella finale, area per area. Le tre aree sono quelle che IAS 7 rende obbligatorie (vedi &lt;a href=&quot;#attivita&quot;&gt;più avanti&lt;/a&gt;).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3 id=&quot;costruzione&quot;&gt;La costruzione in 4 fasi&lt;/h3&gt;
&lt;p&gt;Le slide dividono la costruzione del modello in quattro fasi &lt;span class=&quot;src&quot;&gt;slide 4–7&lt;/span&gt;. Scorrile una alla volta.&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Definire l&#x27;oggetto di riferimento&lt;/h4&gt;
&lt;p&gt;Prima di tutto si sceglie &lt;b&gt;quale grandezza&lt;/b&gt; il rendiconto deve spiegare. Le opzioni citate: &lt;i&gt;cash&lt;/i&gt;, &lt;i&gt;cash equivalents&lt;/i&gt;, &lt;i&gt;net working capital&lt;/i&gt; (capitale circolante netto), &lt;i&gt;net financial position&lt;/i&gt; (posizione finanziaria netta: debiti finanziari meno liquidità e attività finanziarie a breve).&lt;/p&gt;
&lt;p&gt;Per il suo valore operativo, la più utile è l&#x27;&lt;b&gt;immediate liquidity&lt;/b&gt; (liquidità immediata): denaro in cassa e conti correnti attivi, bancari e postali, convertibili subito in liquidità. In alternativa si usa l&#x27;&lt;b&gt;extended liquidity&lt;/b&gt; (liquidità allargata), che aggiunge gli &lt;b&gt;investimenti a breve senza rischio&lt;/b&gt;, convertibili in cassa in poco tempo, di solito &lt;b&gt;meno di tre mesi&lt;/b&gt;: sono i &lt;i&gt;cash equivalents&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Variazioni lorde e &lt;i&gt;Sources and Uses&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Si calcolano le &lt;b&gt;variazioni lorde&lt;/b&gt; di ogni voce dello stato patrimoniale tra inizio e fine anno e le si divide in due gruppi &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;pos&quot;&gt;Sources (fonti)&lt;/h4&gt;Variazioni che &lt;b&gt;liberano&lt;/b&gt; cassa: diminuzione di attività (es. crediti incassati, impianto venduto), aumento di passività o di patrimonio (nuovo debito, aumento di capitale, utile).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 class=&quot;neg&quot;&gt;Uses (impieghi)&lt;/h4&gt;Variazioni che &lt;b&gt;assorbono&lt;/b&gt; cassa: aumento di attività (più magazzino, nuovi investimenti), diminuzione di passività o di patrimonio (rimborso di debiti, dividendi, perdita).&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;La regola dei segni non è nella slide, ma è la logica che la slide dà per scontata: ogni euro &quot;fermo&quot; in un&#x27;attività in più è un euro che non è in cassa.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Rettifiche ai dati grezzi (&lt;i&gt;Adjustments to Raw Data&lt;/i&gt;)&lt;/h4&gt;
&lt;p&gt;Si passa dalla &lt;b&gt;logica del reddito&lt;/b&gt; (costi e ricavi, monetari e non monetari) alla &lt;b&gt;logica dei flussi&lt;/b&gt; (entrate e uscite di cassa) &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;. Due scopi:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;far emergere i movimenti nascosti&lt;/b&gt;: per esempio i &lt;i&gt;dividends&lt;/i&gt;. Se le riserve salgono di 60 ma l&#x27;utile era 100, nella variazione netta si &quot;nascondono&quot; 40 di dividendi pagati: bisogna separarli;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;eliminare le variazioni puramente contabili&lt;/b&gt;: &lt;i&gt;depreciation and amortization&lt;/i&gt; (ammortamenti materiali e immateriali), &lt;i&gt;provisions&lt;/i&gt; (accantonamenti a fondi), &lt;i&gt;inventory write-downs&lt;/i&gt; (svalutazioni delle rimanenze). Riducono l&#x27;utile ma non fanno uscire cassa.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Aggregare i flussi&lt;/h4&gt;
&lt;p&gt;I flussi ottenuti si &lt;b&gt;aggregano per area&lt;/b&gt;, così da mostrare quanto ogni area contribuisce a creare o assorbire risorse monetarie. Ne esce una &lt;b&gt;visione d&#x27;insieme della dinamica finanziaria&lt;/b&gt; dell&#x27;impresa. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Δ Cash and cash equivalents = Σ flussi positivi + Σ flussi negativi&lt;small&gt;la variazione finale è la somma algebrica di tutti i flussi dell&#x27;anno&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;span data-count&gt;1 / 4&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;ebitda&quot;&gt;EBIT ed EBITDA: il punto di partenza&lt;/h3&gt;
&lt;p&gt;Per isolare prima di tutto il contributo della &lt;b&gt;gestione operativa&lt;/b&gt;, si riclassifica il conto economico evidenziando &lt;b&gt;EBIT&lt;/b&gt; ed &lt;b&gt;EBITDA&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;. La sigla si legge a ritroso:&lt;/p&gt;
&lt;div class=&quot;chips&quot; style=&quot;margin:10px 0&quot;&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;E&lt;/b&gt;arnings&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;B&lt;/b&gt;efore&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;I&lt;/b&gt;nterest&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;T&lt;/b&gt;axation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;D&lt;/b&gt;epreciation&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;&lt;b&gt;A&lt;/b&gt;mortisation&lt;/span&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 270&quot; role=&quot;img&quot; aria-label=&quot;Scalare del conto economico riclassificato&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;42&quot;&gt;Ricavi operativi (&lt;tspan font-style=&quot;italic&quot;&gt;income&lt;/tspan&gt;)&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;62&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;82&quot;&gt;− costi operativi monetari (acquisti, personale, servizi…)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;100&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;122&quot; font-weight=&quot;600&quot;&gt;= EBITDA&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;122&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;margine prima di ammortamenti&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;142&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;162&quot;&gt;− Depreciation &amp;amp; Amortisation (non monetari)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;180&quot; width=&quot;520&quot; height=&quot;34&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;202&quot; font-weight=&quot;600&quot;&gt;= EBIT&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;202&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;reddito operativo&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;222&quot; width=&quot;480&quot; height=&quot;30&quot; fill=&quot;var(--paper2)&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;242&quot;&gt;− Interest − Taxation → Net income (utile netto)&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;560&quot; y=&quot;122&quot;&gt;≈ flusso operativo&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;138&quot;&gt;&quot;potenziale&quot; se tutto&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;154&quot;&gt;fosse incassato/pagato&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schema didattico (non presente come grafico nelle slide). Nei casi H1–H6 non ci sono ammortamenti, quindi EBIT ed EBITDA coincidono.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;formula&quot;&gt;EBITDA = EBIT + Depreciation + Amortisation&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché il conto economico da solo non spiega la variazione della cassa?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Perché è redatto per competenza: contiene ricavi non ancora incassati (crediti), costi non ancora pagati (debiti) e costi non monetari (ammortamenti, accantonamenti). La cassa dipende dai tempi di incasso e pagamento, che il CE non mostra.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra immediate liquidity ed extended liquidity?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;L&#x27;immediate liquidity comprende cassa e conti correnti bancari e postali attivi. L&#x27;extended liquidity aggiunge i &lt;i&gt;cash equivalents&lt;/i&gt;: investimenti a breve senza rischio, convertibili in cassa entro circa tre mesi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono i due scopi delle &quot;adjustments to raw data&quot;? Fai un esempio per ciascuno.&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;1) Far emergere movimenti nascosti nelle variazioni nette, come i dividendi pagati. 2) Eliminare variazioni solo contabili, come ammortamenti, accantonamenti e svalutazioni delle rimanenze.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un aumento dei debiti verso fornitori è una source o una use?&lt;/summary&gt;&lt;div class=&quot;in ans&quot;&gt;&lt;p&gt;Una &lt;b&gt;source&lt;/b&gt;: hai ricevuto beni senza pagarli, quindi la cassa resta in azienda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p2&quot; id=&quot;lab&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;part-label&quot;&gt;Parte II · Esercizio guidato&lt;/span&gt;
&lt;h2&gt;Laboratorio: sei ipotesi, due metodi, una sola cassa&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Le slide prendono un&#x27;impresa al &lt;b&gt;primo anno di attività&lt;/b&gt; e complicano la situazione un passo alla volta (H1→H6). Ogni volta calcolano il flusso operativo in due modi e ottengono lo stesso numero. &lt;span class=&quot;src&quot;&gt;slide 9–27&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Direct method&lt;/b&gt; (metodo diretto). Si parte dalle voci del conto economico riclassificato e si &lt;b&gt;rettifica ciascuna&lt;/b&gt; per trasformarla in entrata o uscita reale: ricavi → incassi, costi → pagamenti. Tre colonne: &lt;span class=&quot;t&quot;&gt;Reclassified income statement · Adjustments · Financial situation&lt;/span&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Indirect method&lt;/b&gt; (metodo indiretto). Si parte dall&#x27;&lt;b&gt;EBIT&lt;/b&gt; in un colpo solo e lo si corregge per la variazione del &lt;b&gt;Net Commercial Working Capital&lt;/b&gt; e delle altre poste non monetarie. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross potential operating CF&lt;/h4&gt;È l&#x27;EBIT: il flusso che la gestione operativa &lt;b&gt;genererebbe&lt;/b&gt; se tutti i ricavi fossero incassati e tutti i costi pagati subito. Un flusso &lt;i&gt;potenziale&lt;/i&gt;, misurato per competenza.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross current operating CF&lt;/h4&gt;È la cassa che la gestione operativa ha &lt;b&gt;davvero&lt;/b&gt; prodotto nell&#x27;anno, dopo le rettifiche. Nella terminologia italiana corrisponde al flusso di cassa della gestione corrente.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Net Commercial Working Capital = Commercial Receivables + Inventories − Commercial Payables
&lt;small&gt;Gli &lt;b&gt;aumenti&lt;/b&gt; del capitale circolante commerciale netto si &lt;b&gt;sottraggono&lt;/b&gt; all&#x27;EBIT; le &lt;b&gt;diminuzioni&lt;/b&gt; si &lt;b&gt;sommano&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;Il TFR (&lt;i&gt;Trattamento di Fine Rapporto&lt;/i&gt;, in inglese &lt;i&gt;severance pay&lt;/i&gt;) è la liquidazione che l&#x27;impresa italiana accantona ogni anno per ciascun dipendente e paga alla fine del rapporto di lavoro. L&#x27;accantonamento è un costo, ma diventa uscita di cassa solo quando il TFR viene pagato. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;

&lt;div data-tabs style=&quot;margin-top:22px&quot;&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button&gt;H1 · Crediti&lt;/button&gt;&lt;button&gt;H2 · Debiti&lt;/button&gt;&lt;button&gt;H3 · Rimanenze&lt;/button&gt;&lt;button&gt;H4 · TFR&lt;/button&gt;&lt;button&gt;H5 · TFR pagato&lt;/button&gt;&lt;button&gt;H6 · Svalutazione crediti&lt;/button&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H1.&lt;/b&gt; Ricavi 1.000, di cui 100 non ancora incassati; acquisti 600, tutti pagati. &lt;span class=&quot;src&quot;&gt;slide 9–12&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;900 − 600 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories / − Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;100&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: l&#x27;utile è 400 ma la cassa è 300, perché 100 di vendite sono ancora &quot;parcheggiate&quot; nei crediti.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H2.&lt;/b&gt; I crediti salgono a 200 (incassati 800) e 100 di acquisti non sono ancora pagati (pagati 500). &lt;span class=&quot;src&quot;&gt;slide 13–15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;400&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(600)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(500)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;100&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: i debiti verso fornitori sono una forma di finanziamento operativo. I 100 di crediti in più sono compensati dai 100 di debiti in più: il flusso resta 300.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H3.&lt;/b&gt; Dei 600 acquistati, 200 restano in magazzino. Nel CE la variazione positiva delle rimanenze riduce il costo: il costo del venduto scende a 400 e l&#x27;utile sale a 600. La cassa non cambia. &lt;span class=&quot;src&quot;&gt;slide 16–18&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: il magazzino &quot;assorbe&quot; cassa. L&#x27;utile cresce di 200 ma i 200 sono beni pagati e non ancora venduti. Uscite totali ai fornitori: 300 + 200 = 500.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H4.&lt;/b&gt; Si accantonano 50 di TFR, non pagati. L&#x27;utile scende a 550, il fondo TFR sale di 50. &lt;span class=&quot;src&quot;&gt;slide 19–21&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 = 300&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 50&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt; (200 + 200 − 100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;50&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: un costo non monetario abbassa l&#x27;EBIT ma non la cassa. Con il metodo indiretto si somma l&#x27;aumento del fondo. È la stessa logica degli ammortamenti.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H5.&lt;/b&gt; Durante l&#x27;anno si pagano 20 di TFR (per esempio a un dipendente che lascia l&#x27;azienda). Il fondo scende da 50 a 30 e la cassa a 280. &lt;span class=&quot;src&quot;&gt;slide 22–24&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;800 − 500 − 20 = 280&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;30&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;550&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;300&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase (netto)&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;30&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: nel metodo indiretto conta la variazione &lt;b&gt;netta&lt;/b&gt; del fondo (accantonamento 50 − utilizzo 20 = 30). L&#x27;utilizzo è l&#x27;unica parte del TFR che esce davvero dalla cassa.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;H6.&lt;/b&gt; Si accantonano 10 a fondo svalutazione crediti (&lt;i&gt;allowance for doubtful accounts&lt;/i&gt;), perché alcuni clienti potrebbero non pagare. I crediti netti scendono a 190 e l&#x27;utile a 540. &lt;span class=&quot;src&quot;&gt;slide 25–27&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tacc-h&quot;&gt;&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Balance Sheet&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Cash&lt;/span&gt;&lt;span&gt;280&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Receivables&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Allowances&lt;/span&gt;&lt;span&gt;(10)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;= net&lt;/span&gt;&lt;span&gt;190&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Inventories&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;540&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Payables&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR fund&lt;/span&gt;&lt;span&gt;30&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;tacc-t&quot;&gt;Income Statement&lt;/div&gt;&lt;div class=&quot;tacc&quot;&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Purchase costs&lt;/span&gt;&lt;span&gt;600&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;− Inventories incr.&lt;/span&gt;&lt;span&gt;(200)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;TFR&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Provisions doubtful a/r&lt;/span&gt;&lt;span&gt;10&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;span&gt;540&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;Income&lt;/span&gt;&lt;span&gt;1.000&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Direct&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CE&lt;/th&gt;&lt;th&gt;Adjustment&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cassa&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;− Receivables incr. (190)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;810&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Purchase costs&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(400)&lt;/td&gt;&lt;td&gt;+ Payables incr. 100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;− Inventories incr. (200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;TFR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(50)&lt;/td&gt;&lt;td&gt;+ TFR fund incr. 30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Provisions&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(10)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(10)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT → CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;540&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Indirect&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Receivables (netti)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;190&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Inventories&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Payables&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;NCWC&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;290&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;540&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− NCWC increase&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(290)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ TFR fund increase&lt;/td&gt;&lt;td class=&quot;n pos&quot;&gt;30&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross current operating CF&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;280&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Lettura: la svalutazione non tocca la cassa (resta 280). Nel metodo diretto la slide rettifica i ricavi per la variazione dei crediti &lt;i&gt;netti&lt;/i&gt; (190 → 810) e poi riporta i 10 di accantonamento: 810 − 10 = 800, cioè gli incassi effettivi. Nel metodo indiretto l&#x27;effetto è &quot;dentro&quot; il circolante: usando i crediti netti, il CCN cresce di 10 in meno.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Confronto EBIT e cassa operativa nei sei casi&quot;&gt;
&lt;g font-size=&quot;12&quot;&gt;
&lt;text x=&quot;20&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;EBIT (barra chiara) e gross current operating CF (barra piena), H1–H6&lt;/text&gt;
&lt;line x1=&quot;40&quot; x2=&quot;740&quot; y1=&quot;180&quot; y2=&quot;180&quot; stroke=&quot;var(--rule)&quot;/&gt;
