&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;dove&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Where we are&lt;/small&gt;La catena della contabilità&lt;/h2&gt;
 &lt;p&gt;Le prime tre lezioni (slide 1–62 del corso: la sandwich company, &lt;em class=&quot;t&quot;&gt;use / source&lt;/em&gt;, journal entries, chart of accounts, T-accounts) hanno costruito i primi tre anelli. Oggi si arriva al quarto, il &lt;em class=&quot;t&quot;&gt;trial balance&lt;/em&gt; (bilancio di verifica: la lista dei saldi di tutti i conti a una data), e si guarda il quinto, i &lt;em class=&quot;t&quot;&gt;financial statements&lt;/em&gt; (il bilancio d&#x27;esercizio), che sarà il tema di lunedì 28.&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Transaction, Journal, Ledger, Trial balance, Financial statements&quot;&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;82&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Transaction&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;four questions&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;186&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;266&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Journal&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;date order&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;370&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;450&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Ledger / T-accounts&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;by account&lt;/text&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;554&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:3&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;634&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Trial balance&lt;/text&gt;&lt;text x=&quot;634&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;list of balances · OGGI&lt;/text&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;738&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;818&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Financial statements&lt;/text&gt;&lt;text x=&quot;818&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;Monday 28&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M164 50H184&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M348 50H368&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M532 50H552&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M716 50H736&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;text x=&quot;450&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;ogni passaggio riordina le stesse informazioni: prima per data, poi per conto, poi per saldo, poi per documento&lt;/text&gt;
 &lt;/svg&gt;

 &lt;h3&gt;Un esempio che attraversa tutta la catena&lt;/h3&gt;
 &lt;p&gt;Il caso della lezione è una piccola impresa che vende spazi pubblicitari su un sito web. Scorri i passi: a novembre il titolare versa 1.500 e l&#x27;impresa paga sei spese dal conto corrente. &lt;span class=&quot;ours&quot;&gt;ricostruzione nostra&lt;/span&gt; I singoli importi sono quelli del trial balance di novembre (slide 11); la sequenza delle registrazioni è ricostruita perché il saldo del conto corrente torni a 190.&lt;/p&gt;
 &lt;div class=&quot;stepper&quot; id=&quot;st1&quot;&gt;
  &lt;div class=&quot;step cur&quot;&gt;&lt;h4&gt;1 · Transaction&lt;/h4&gt;&lt;p&gt;Il titolare apporta 1.500 sul &lt;b&gt;Checking Account&lt;/b&gt; (il conto corrente bancario). Le domande di base: quali conti tocca? di che tipo sono? aumentano o diminuiscono? vanno in debit o in credit? In logica &lt;em class=&quot;t&quot;&gt;use / source&lt;/em&gt; (impiego / fonte): il denaro in banca è un &lt;b&gt;use&lt;/b&gt; (dove sono finite le risorse), il capitale del titolare è la &lt;b&gt;source&lt;/b&gt; (da dove vengono).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Journal&lt;/h4&gt;&lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;journal&lt;/em&gt; (libro giornale) registra le operazioni in ordine di data, una riga per conto movimentato:&lt;/p&gt;
   &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Data&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Nov&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Owners&#x27; Equity&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Nov&lt;/td&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Checking Account&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;mut&quot;&gt;… e così per Office Equipment 225, Computer Hardware 500, Office Supplies 75, Bank Charges 10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Ledger / T-account&lt;/h4&gt;&lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;ledger&lt;/em&gt; (libro mastro) riordina le stesse righe &lt;b&gt;per conto&lt;/b&gt;. Ogni conto è un &lt;em class=&quot;t&quot;&gt;T-account&lt;/em&gt;: debit a sinistra, credit a destra.&lt;/p&gt;
   &lt;svg viewBox=&quot;0 0 420 190&quot; style=&quot;max-width:420px&quot; role=&quot;img&quot; aria-label=&quot;T-account del Checking Account&quot;&gt;
    &lt;text x=&quot;210&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Checking Account&lt;/text&gt;
    &lt;path class=&quot;lnI&quot; d=&quot;M20 28H400M210 28V160&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;46&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;DEBIT&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;46&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;CREDIT&lt;/text&gt;
    &lt;text x=&quot;190&quot; y=&quot;66&quot; text-anchor=&quot;end&quot;&gt;1,500&lt;/text&gt;
    &lt;text x=&quot;390&quot; y=&quot;66&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;84&quot; text-anchor=&quot;end&quot;&gt;225&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;102&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;120&quot; text-anchor=&quot;end&quot;&gt;75&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;138&quot; text-anchor=&quot;end&quot;&gt;10&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M20 150H400&quot;/&gt;
    &lt;text x=&quot;190&quot; y=&quot;178&quot; text-anchor=&quot;end&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--slate)&quot;&gt;saldo 190 Dr&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;178&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;1,500 − 1,310&lt;/text&gt;
   &lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Trial balance&lt;/h4&gt;&lt;p&gt;Da ogni T-account si prende &lt;b&gt;solo il saldo&lt;/b&gt; e lo si mette in una lista: una riga per conto (non per operazione). Se il totale dei debit è uguale a quello dei credit, l&#x27;aritmetica è corretta: a novembre 1,500 = 1,500.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Financial statements&lt;/h4&gt;&lt;p&gt;I saldi vengono poi smistati: i conti patrimoniali vanno nel &lt;em class=&quot;t&quot;&gt;balance sheet&lt;/em&gt; (stato patrimoniale), quelli di ricavo e costo nell&#x27;&lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt; (conto economico). Lo si vedrà in anteprima nella sezione 10 e per esteso lunedì.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt mut&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti ›&lt;/button&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot; style=&quot;margin-top:1.2em&quot;&gt;&lt;h4&gt;Compiti assegnati (dalla slide 2)&lt;/h4&gt;
 &lt;p&gt;&lt;b&gt;Set 1&lt;/b&gt;, per lunedì 28: esercizi 1–4 (Tables 1–2, T-accounts, trial balance). &lt;b&gt;Set 2&lt;/b&gt;, per mercoledì 30: esercizi 5–7 (The Library, the retail shop, Bergamo Bikes). Il debriefing occupa i primi 20 minuti di ogni lezione. File «Homework – double-entry exercises» su Moodle.&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è fra journal e ledger, se contengono le stesse cifre?&lt;/summary&gt;&lt;div&gt;L&#x27;ordine. Il journal è cronologico (una registrazione per operazione), il ledger è organizzato per conto (tutti i movimenti di un conto insieme). Il trial balance fa un passo in più: tiene solo il saldo finale di ogni conto.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché il Checking Account a fine novembre ha saldo 190 in debit?&lt;/summary&gt;&lt;div&gt;Sono entrati 1.500 (debit) e usciti in tutto 1.310 (credit: 500 + 225 + 500 + 75 + 10). La differenza è 190 dal lato debit, il lato su cui aumenta un asset.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;coa&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Organising the chart of accounts&lt;/small&gt;Sette account types, nell&#x27;ordine del bilancio&lt;/h2&gt;
 &lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;chart of accounts&lt;/em&gt; (piano dei conti) è l&#x27;elenco di tutti i conti che l&#x27;impresa usa. All&#x27;inizio è una lista in ordine sparso, cioè nell&#x27;ordine in cui i conti sono stati aperti. Per renderla utile la si ordina con &lt;b&gt;due chiavi&lt;/b&gt;: prima il &lt;b&gt;tipo&lt;/b&gt; di conto, che segue l&#x27;ordine dei financial statements, poi la &lt;b&gt;liquidità&lt;/b&gt; (sezione 3).&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Cosa contiene&lt;/th&gt;&lt;th&gt;Statement&lt;/th&gt;&lt;th&gt;Normal balance&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ciò che l&#x27;impresa possiede o controlla&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ciò che l&#x27;impresa deve a terzi&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Equity&lt;/b&gt;&lt;/td&gt;&lt;td&gt;la quota dei proprietari: capitale + utili trattenuti (&lt;i&gt;retained profits&lt;/i&gt;)&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Revenue&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ricavi dalla vendita di prodotti o servizi&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Cost of goods sold&lt;/b&gt;&lt;/td&gt;&lt;td&gt;costo diretto di ciò che è stato venduto&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Expenses&lt;/b&gt;&lt;/td&gt;&lt;td&gt;costi operativi senza valore durevole&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Other revenue and expenses&lt;/b&gt;&lt;/td&gt;&lt;td&gt;voci insolite, estranee alla gestione ordinaria&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td&gt;either&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 3.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot; style=&quot;margin-top:1em&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost o expense?&lt;/b&gt;&lt;br&gt;Un &lt;em class=&quot;t&quot;&gt;cost&lt;/em&gt; (in senso stretto, qui: cost of goods sold) è ciò che serve per &lt;i&gt;produrre o comprare ciò che vendi&lt;/i&gt;; un &lt;em class=&quot;t&quot;&gt;expense&lt;/em&gt; è ciò che serve per &lt;i&gt;far funzionare l&#x27;impresa&lt;/i&gt;. Si possono distinguere &lt;b&gt;solo se sai che cosa vende l&#x27;impresa&lt;/b&gt;. Nel dubbio, la slide consiglia di classificare come expense.&lt;/div&gt;
  &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Nel nostro esempio&lt;/h4&gt;&lt;p&gt;L&#x27;impresa vende spazio pubblicitario su un sito. L&#x27;unico costo diretto è il &lt;b&gt;website hosting&lt;/b&gt;: senza il sito non c&#x27;è prodotto. Affitto, telefono, carburante, pasti servono a far funzionare l&#x27;impresa, quindi sono expenses.&lt;/p&gt;&lt;p class=&quot;mut&quot; style=&quot;font-size:.9rem&quot;&gt;Per una pizzeria, al contrario, la farina sarebbe cost of goods sold e il sito web un expense: la classificazione dipende dal business, non dal nome del conto.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p&gt;Il &lt;b&gt;gross profit&lt;/b&gt; (margine lordo) è revenue − cost of goods sold, ed è per questo che la distinzione conta: separa quanto rende il prodotto da quanto costa la struttura. Il termine non compare in questa lezione; lo si incontrerà con i formati di income statement.&lt;/p&gt;

 &lt;h3&gt;Prova tu: classifica i conti &lt;span class=&quot;pill&quot;&gt;interattivo&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;È l&#x27;esercizio &quot;Classify together&quot; della slide 4. Scegli il tipo per ogni conto e premi &lt;b&gt;Controlla&lt;/b&gt;; la soluzione è quella della slide 6.&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;classify&quot; id=&quot;classify&quot;&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p style=&quot;margin-top:10px&quot;&gt;&lt;button class=&quot;btn on&quot; id=&quot;clsCheck&quot;&gt;Controlla&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;clsShow&quot;&gt;Mostra soluzione&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;clsReset&quot;&gt;Ricomincia&lt;/button&gt; &lt;span id=&quot;clsScore&quot; class=&quot;mut&quot;&gt;&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Due dettagli delle slide.&lt;/b&gt; Nella lista della slide 4 il conto dei ricavi si chiama «Advertising Sales», nella soluzione (slide 6) «Sales»: è lo stesso conto. &lt;b&gt;Rent&lt;/b&gt; manca da entrambe le liste ma compare nel trial balance (slide 10–11): è un expense, e qui l&#x27;abbiamo aggiunto.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Perché Website Hosting è cost of goods sold e Phone Service no?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;impresa vende spazio pubblicitario &lt;i&gt;sul sito&lt;/i&gt;: l&#x27;hosting è il costo diretto del prodotto. Il telefono serve a gestire l&#x27;impresa, ma non è legato a ciascuna vendita.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Office Equipment, Computer Hardware e Office Furniture sono expenses?&lt;/summary&gt;&lt;div&gt;No: sono &lt;b&gt;fixed assets&lt;/b&gt;. Hanno valore durevole, cioè servono per più esercizi. Gli expenses sono «costi operativi senza valore durevole», come Office Supplies, consumati nel periodo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quale tipo di conto può avere saldo normale sia debit sia credit?&lt;/summary&gt;&lt;div&gt;Other revenue and expenses: raccoglie sia proventi sia oneri insoliti, estranei alla gestione ordinaria.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;liq&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Order of liquidity&lt;/small&gt;La seconda chiave d&#x27;ordinamento&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liquidity&lt;/b&gt;&lt;br&gt;Quanto rapidamente una voce si trasforma in denaro &lt;b&gt;senza perdere valore&lt;/b&gt;. Gli assets si elencano partendo dal cash; le liabilities partendo da quelle che scadono prima.&lt;/div&gt;
 &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Current&lt;/em&gt; (corrente, a breve) = ci si aspetta che giri entro un anno, o entro l&#x27;&lt;em class=&quot;t&quot;&gt;operating cycle&lt;/em&gt; (ciclo operativo: il tempo che va dall&#x27;acquisto dei fattori all&#x27;incasso delle vendite). &lt;em class=&quot;t&quot;&gt;Fixed / long-term&lt;/em&gt; (immobilizzato, a lungo termine) = oltre quel periodo.&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Balance sheet ordinato per liquidità&quot;&gt;
  &lt;text x=&quot;215&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Liabilities and equity&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;34&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;24&quot; y=&quot;58&quot; font-weight=&quot;700&quot;&gt;Current&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;82&quot;&gt;cash · receivables · inventory · prepayments&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;104&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;crediti verso clienti · magazzino · risconti attivi&lt;/text&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;152&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;24&quot; y=&quot;176&quot; font-weight=&quot;700&quot;&gt;Fixed&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;200&quot;&gt;property, plant, equipment · intangibles · investments&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;222&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;immobilizzazioni materiali, immateriali, finanziarie&lt;/text&gt;
  &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;34&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;58&quot; font-weight=&quot;700&quot;&gt;Current liabilities&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;82&quot;&gt;payables · accrued expenses · short-term loans&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;104&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;debiti verso fornitori · ratei passivi · prestiti a breve&lt;/text&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;152&quot; width=&quot;410&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;176&quot; font-weight=&quot;700&quot;&gt;Long-term&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;196&quot; font-size=&quot;14&quot;&gt;bank loans · bonds&lt;/text&gt;
  &lt;g class=&quot;n-acc&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;212&quot; width=&quot;410&quot; height=&quot;50&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;242&quot; font-weight=&quot;700&quot;&gt;then equity&lt;/text&gt;
  &lt;path class=&quot;lnI&quot; d=&quot;M430 40V258&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;text x=&quot;430&quot; y=&quot;288&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;↓ dal più liquido / più urgente al meno liquido / più lontano&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 5. Le traduzioni in grigio sono nostre.&lt;/p&gt;

 &lt;h3&gt;Perché «current» conta: il working capital &lt;span class=&quot;pill&quot;&gt;cursori&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;Le current liabilities si pagano di norma con i current assets. La differenza fra i due è il &lt;em class=&quot;t&quot;&gt;working capital&lt;/em&gt; (capitale circolante netto). Se le passività correnti superano le attività correnti, la gestione della cassa va tenuta d&#x27;occhio: è &lt;b&gt;un segnale d&#x27;allarme, non una sentenza&lt;/b&gt;. Un supermercato vive ogni giorno con working capital negativo: incassa subito dai clienti e paga i fornitori a 60–90 giorni.&lt;/p&gt;
 &lt;div class=&quot;card&quot;&gt;
  &lt;label&gt;Current assets: &lt;b id=&quot;caV&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;ca&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;550&quot;&gt;&lt;/label&gt;
  &lt;label&gt;Current liabilities: &lt;b id=&quot;clV&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;cl&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;680&quot;&gt;&lt;/label&gt;
  &lt;svg viewBox=&quot;0 0 600 70&quot; id=&quot;wcBar&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;Working capital&lt;b id=&quot;wcV&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Current ratio&lt;b id=&quot;crV&quot;&gt;&lt;/b&gt;&lt;span class=&quot;mut&quot; style=&quot;font-size:.8rem&quot;&gt;current assets / current liabilities&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p id=&quot;wcMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;I valori iniziali (550 e 680) sono quelli del sito web al 31 dicembre (slide 17): Checking Account 550 è l&#x27;unico current asset, Accounts Payable 680 l&#x27;unica current liability. &lt;span class=&quot;ours&quot;&gt;calcolo nostro&lt;/span&gt; Anche l&#x27;impresa dell&#x27;esempio chiude con working capital negativo (−130).&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Un prestito bancario quinquennale: current o long-term? E la rata che scade fra sei mesi?&lt;/summary&gt;&lt;div&gt;Il prestito è long-term. La quota che scade entro dodici mesi è, a rigore, una current liability: la slide elenca i «short-term loans» fra le current. Nella prassi la si separa dal resto del debito.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Working capital negativo significa che l&#x27;impresa sta per fallire?&lt;/summary&gt;&lt;div&gt;No. La slide lo chiama «a warning sign, not a verdict». Dipende dal business: un supermercato incassa in contanti e paga a dilazione, quindi convive normalmente con working capital negativo.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;nb&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Normal balances&lt;/small&gt;Da che lato sta il saldo&lt;/h2&gt;
 &lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;normal balance&lt;/em&gt; (saldo normale) è il lato, debit o credit, su cui un conto &lt;b&gt;aumenta&lt;/b&gt;, e quindi il lato in cui ci si aspetta di trovare il suo saldo. Discende dall&#x27;equazione contabile:&lt;/p&gt;
 &lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Equity&lt;br&gt;&lt;span style=&quot;font-size:1rem;color:var(--muted)&quot;&gt;ed estesa con i conti di risultato:&lt;/span&gt;&lt;br&gt;Assets + Expenses (+ COGS) = Liabilities + Equity + Revenue&lt;/div&gt;
 &lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-label=&quot;Lato debit e lato credit&quot;&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;410&quot; height=&quot;130&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
  &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;10&quot; width=&quot;410&quot; height=&quot;130&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;215&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;DEBIT · lato sinistro&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;CREDIT · lato destro&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Assets · Cost of goods sold · Expenses&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Liabilities · Equity · Revenue&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;use / acquisition: dove sono andate le risorse&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;source: da dove sono venute le risorse&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;gli expenses sono «consumables»: risorse usate e consumate&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;i ricavi aumentano l&#x27;equity, perciò stanno dal suo lato&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p&gt;La slide 8 lo applica ai conti di novembre: ogni conto «increases as» &lt;i&gt;Acquisition/Use&lt;/i&gt; (debit) oppure &lt;i&gt;Source&lt;/i&gt; (credit).&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;th&gt;Increases as&lt;/th&gt;&lt;th&gt;Expected balance&lt;/th&gt;&lt;th&gt;Descrizione&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;190.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;qualcosa che l&#x27;impresa possiede&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;225.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;qualcosa che l&#x27;impresa possiede&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;qualcosa che l&#x27;impresa possiede&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Owners&#x27; Equity&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1500.00&lt;/td&gt;&lt;td&gt;Source&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;Credit&lt;/td&gt;&lt;td&gt;investimento dei titolari nell&#x27;impresa&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Bank Charges&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 8.&lt;/p&gt;
 &lt;details&gt;&lt;summary&gt;A cosa serve sapere il normal balance? Un controllo rapido&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Un saldo dal lato «sbagliato» è un indizio d&#x27;errore: un Office Supplies con saldo credit, per esempio, è quasi certamente una registrazione invertita. Ci sono però eccezioni legittime. Un conto corrente scoperto ha saldo credit, perché in quel momento è un debito verso la banca, e i conti «contra» (es. il fondo ammortamento) hanno di proposito il saldo opposto a quello del conto cui si riferiscono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Prelievi del titolare (withdrawals / drawings)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Quando il titolare preleva denaro per sé, l&#x27;equity &lt;b&gt;diminuisce&lt;/b&gt;: il conto dei prelievi ha saldo normale debit e va a ridurre l&#x27;equity. Per l&#x27;equity, in un periodo:&lt;/p&gt;&lt;div class=&quot;formula&quot; style=&quot;font-size:1.1rem&quot;&gt;Equity finale = Equity iniziale + nuovi apporti + net income − withdrawals&lt;/div&gt;&lt;p&gt;Se i prelievi superano l&#x27;utile, l&#x27;equity cala anche se l&#x27;impresa ha guadagnato.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica: Quick check (slide 7)&lt;/h3&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;1. Il saldo normale di un conto di revenue è il lato debit.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;Falso: le revenue aumentano l&#x27;equity, quindi crescono e hanno saldo in &lt;b&gt;credit&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;V&quot;&gt;&lt;p&gt;2. Il saldo normale di un conto di expense è il lato debit.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;Vero: un expense è un consumo di risorse (use), quindi ha saldo in debit.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;3. Se i prelievi superano il net income, l&#x27;owner&#x27;s equity aumenta.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;Falso: diminuisce. Es.: utile 400, prelievi 600 → equity −200, a parità di apporti.&lt;/div&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Accounts Payable ha saldo normale…?&lt;/summary&gt;&lt;div&gt;Credit: è una liability, una fonte di finanziamento (il fornitore che non è ancora stato pagato).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;tb&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;The trial balance&lt;/small&gt;La lista dei saldi a una data&lt;/h2&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cos&#x27;è&lt;/h4&gt;&lt;p&gt;Dopo aver registrato tutte le scritture, ogni conto ha un saldo. Il trial balance elenca i conti con il loro saldo debit o credit. Ha la stessa griglia del journal, ma &lt;b&gt;una riga per conto&lt;/b&gt; invece che una per operazione.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Totale debit = totale credit&lt;/b&gt;: se non è così, c&#x27;è un errore da qualche parte.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cosa prova, e cosa no&lt;/h4&gt;&lt;p&gt;Prova l&#x27;&lt;b&gt;aritmetica&lt;/b&gt;: ogni scrittura è stata registrata con debit e credit uguali.&lt;/p&gt;&lt;p&gt;Non rileva: una transazione omessa, una registrazione sul conto sbagliato, un importo errato su entrambi i lati, gli errori che si compensano. &lt;i&gt;Per questo il revisore (auditor) non si ferma al trial balance.&lt;/i&gt;&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Simulatore di errori &lt;span class=&quot;pill&quot;&gt;interattivo&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;Parti dal trial balance di novembre e introduci un errore: il trial balance se ne accorge?&lt;/p&gt;
 &lt;div class=&quot;card&quot;&gt;
  &lt;div id=&quot;errBtns&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;errDesc&quot; style=&quot;min-height:3em&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;errTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div id=&quot;errVerdict&quot; class=&quot;verdict&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;Un trucco da manuale: la differenza divisibile per 9&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se il trial balance non quadra e la differenza è divisibile per 9, è probabile una &lt;b&gt;trasposizione&lt;/b&gt; o uno spostamento di cifre (500 scritto 50, 54 scritto 45). Nel simulatore: 1,500 − 1,050 = 450 = 9 × 50. È una regola pratica, non viene dalle slide.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;h3&gt;Tre versioni della stessa cosa&lt;/h3&gt;
 &lt;p&gt;Il &lt;b&gt;monthly trial balance&lt;/b&gt; riporta i movimenti del mese; il &lt;b&gt;cumulative trial balance&lt;/b&gt; i saldi dall&#x27;inizio; il &lt;b&gt;comparative&lt;/b&gt; mette una colonna per periodo. Nella versione comparativa delle slide i credit sono scritti con il segno meno (Owners&#x27; Equity −1,500), quindi ogni colonna somma a &lt;b&gt;zero&lt;/b&gt; invece di mostrare due totali uguali.&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; id=&quot;tbTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;nov&quot;&gt;Novembre&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;dec&quot;&gt;Dicembre&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;cum&quot;&gt;Cumulativo al 31/12&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;cmp&quot;&gt;Comparativo&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tbTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;tbNote&quot; class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 10–11. Nelle slide il cumulativo e la colonna Dicembre/Total del comparativo sono vuoti, da compilare: qui sono calcolati sommando novembre e dicembre &lt;span class=&quot;ours&quot;&gt;calcolo nostro&lt;/span&gt;, ed è proprio l&#x27;esercizio 4 dei compiti, quindi provaci prima da solo. Le date «2010» sono quelle dell&#x27;esempio originale.&lt;/p&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Perché il trial balance quadra anche se manca una transazione? (domanda 1 della slide 18)&lt;/summary&gt;&lt;div&gt;Perché la transazione mancante avrebbe aggiunto lo stesso importo in debit e in credit. Toglierla abbassa entrambi i totali della stessa cifra e l&#x27;uguaglianza resta. Il trial balance controlla l&#x27;equilibrio, non la completezza.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;A dicembre Owners&#x27; Equity ha 1,100 in credit. Cosa vuol dire?&lt;/summary&gt;&lt;div&gt;Nel mese i titolari hanno fatto un nuovo apporto di 1,100. Nel cumulativo l&#x27;equity diventa 1,500 + 1,100 = 2,600 credit, come nella slide 17.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Nel comparativo il totale di ogni colonna è 0.00: è un errore?&lt;/summary&gt;&lt;div&gt;No. I credit sono registrati con il segno negativo, quindi la somma algebrica di debit (+) e credit (−) è zero quando il trial balance quadra.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fs&quot; data-c=&quot;slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;What is a financial statement?&lt;/small&gt;Un processo e un documento&lt;/h2&gt;
 &lt;div class=&quot;tabs&quot; id=&quot;fsTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;fsP&quot;&gt;Processo&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-p=&quot;fsD&quot;&gt;Documento&lt;/button&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;fsP&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;Raccogliere, classificare e riassumere migliaia di transazioni in poche pagine, a intervalli regolari (anno, trimestre, mese).&lt;/p&gt;
   &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Form&lt;/h4&gt;i documenti, la loro struttura e il loro contenuto: quali prospetti, quali voci, in che ordine.&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Substance&lt;/h4&gt;la &lt;b&gt;misurazione&lt;/b&gt; dei valori che entrano in quei documenti: a quanto iscrivo un computer, un credito, un debito?&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;fsD&quot; hidden&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;Rappresenta per un periodo:&lt;/p&gt;
   &lt;ul&gt;&lt;li&gt;la &lt;em class=&quot;t&quot;&gt;financial performance&lt;/em&gt; (risultato economico) → &lt;b&gt;income statement&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;la &lt;em class=&quot;t&quot;&gt;financial position&lt;/em&gt; (situazione patrimoniale e finanziaria) → &lt;b&gt;balance sheet&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;i &lt;em class=&quot;t&quot;&gt;cash flows&lt;/em&gt; (flussi di cassa) → &lt;b&gt;statement of cash flows&lt;/b&gt; (rendiconto finanziario).&lt;/li&gt;&lt;/ul&gt;
   &lt;p&gt;&lt;b&gt;Due domande decidono tutto il resto: che cosa rappresenta, e per chi è?&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;Dalle migliaia di transazioni a poche pagine&quot;&gt;
  &lt;g style=&quot;fill:var(--slate)&quot; opacity=&quot;.35&quot;&gt;&lt;circle cx=&quot;30&quot; cy=&quot;30&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;62&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;80&quot; cy=&quot;24&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;96&quot; cy=&quot;86&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;50&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;96&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;140&quot; cy=&quot;20&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;158&quot; cy=&quot;76&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;44&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;104&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;180&quot; cy=&quot;40&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;96&quot; r=&quot;4&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;110&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;migliaia di transazioni&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M230 60H300&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;collect&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;310&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;370&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;classify&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M432 60H500&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;510&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;summarise&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M632 60H700&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;710&quot; y=&quot;12&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;rect x=&quot;726&quot; y=&quot;22&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;rect x=&quot;742&quot; y=&quot;32&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;772&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;poche pagine&lt;/text&gt;
 &lt;/svg&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Esercizio della slide 12&lt;/b&gt; (2 minuti): scrivi tre utilizzatori del bilancio e, per ciascuno, l&#x27;unica domanda a cui vuole una risposta. Poi confronta con la sezione 7.&lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Form e substance: a quale dei due appartiene la scelta di valutare il magazzino a costo o a valore di mercato?&lt;/summary&gt;&lt;div&gt;Alla substance: è una questione di misurazione del valore. Decidere se il magazzino compare come voce separata nel balance sheet è invece form.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Quali sono i tre oggetti che un financial statement rappresenta?&lt;/summary&gt;&lt;div&gt;Financial performance (income statement), financial position (balance sheet), cash flows (statement of cash flows), tutti riferiti a un periodo.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;users&quot; data-c=&quot;slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Stakeholders · Users and their questions&lt;/small&gt;Lettori diversi, decisioni diverse&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt;&lt;br&gt;Una persona, un gruppo o un&#x27;organizzazione che ha un interesse o una preoccupazione rispetto a un&#x27;organizzazione (slide 13).&lt;/div&gt;
 &lt;p&gt;Tocca un portatore di interesse per vedere la sua domanda e che cosa guarda nel bilancio.&lt;/p&gt;
 &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
  &lt;svg class=&quot;wheel&quot; viewBox=&quot;0 0 860 340&quot; id=&quot;wheel&quot; role=&quot;img&quot; aria-label=&quot;Stakeholder attorno all&#x27;impresa&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;card tint&quot; id=&quot;shBox&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;mut&quot;&gt;Seleziona uno stakeholder.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 13 (gli otto stakeholder) e 14 (domande e indicatori).&lt;/p&gt;
 &lt;div class=&quot;card&quot; style=&quot;margin-top:1em&quot;&gt;&lt;h4&gt;Gli intermediari&lt;/h4&gt;&lt;p&gt;Analisti, giornalisti, &lt;em class=&quot;t&quot;&gt;rating agencies&lt;/em&gt; (agenzie che danno un giudizio sul merito di credito) e regulators (autorità di vigilanza) stanno in mezzo: &lt;b&gt;elaborano l&#x27;informazione per conto degli altri&lt;/b&gt;. Non sono lettori finali, ma sono spesso i più attenti.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;warn&quot;&gt;Per il pubblico e la comunità (occupazione, ambiente, salute e sicurezza) i financial statements &lt;b&gt;non danno ancora risposte adeguate&lt;/b&gt;: è lo spazio del &lt;em class=&quot;t&quot;&gt;sustainability reporting&lt;/em&gt; (la rendicontazione di sostenibilità, sezione &quot;Per approfondire&quot;).&lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Un fornitore e una banca leggono lo stesso balance sheet: quale riga guarda per prima ciascuno? (domanda 2 della slide 18)&lt;/summary&gt;&lt;div&gt;Il &lt;b&gt;fornitore&lt;/b&gt; guarda la liquidità a breve, cioè current assets contro current liabilities (lo pagheranno?). Il &lt;b&gt;lender&lt;/b&gt; guarda l&#x27;indebitamento complessivo e la struttura del passivo: debt/equity, debiti a lungo termine, e poi nell&#x27;income statement e nel cash flow la capacità di generare cassa per pagare interessi e rate.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa sono i covenants di cui si preoccupano i lenders?&lt;/summary&gt;&lt;div&gt;Clausole del contratto di finanziamento che impongono limiti misurati sui dati di bilancio, per esempio un rapporto debt/equity massimo. Se vengono violate, la banca può chiedere il rimborso anticipato. Il bilancio diventa così anche uno strumento contrattuale.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;ass&quot; data-c=&quot;brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Objective and underlying assumptions&lt;/small&gt;Perché si rendiconta, e su quali premesse&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective of financial reporting&lt;/b&gt;&lt;br&gt;Comunicare misure economiche e informazioni sulle risorse e sulla performance dell&#x27;entità che redige il bilancio (&lt;em class=&quot;t&quot;&gt;reporting entity&lt;/em&gt;), utili a chi ha ragionevoli diritti a riceverle. Gli utilizzatori devono poter &lt;b&gt;prendere decisioni&lt;/b&gt; e &lt;b&gt;chiedere conto al management&lt;/b&gt; del suo operato (&lt;em class=&quot;t&quot;&gt;accountability&lt;/em&gt;).&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 15. Per il confronto con la definizione dell&#x27;IASB vedi &quot;Per approfondire&quot; (Conceptual Framework, The Corporate Report).&lt;/p&gt;

 &lt;div class=&quot;tabs&quot; id=&quot;assTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;gc&quot;&gt;Going concern&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-p=&quot;acc&quot;&gt;Accrual basis&lt;/button&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;gc&quot;&gt;
   &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Going concern&lt;/em&gt; (continuità aziendale): si presume che l&#x27;entità continui a operare nel prevedibile futuro, cioè &lt;b&gt;almeno dodici mesi&lt;/b&gt;. Conseguenza: gli assets si valutano per il loro &lt;b&gt;uso&lt;/b&gt;, non per una vendita forzata. Se la premessa cade, tutto si rimisura a &lt;b&gt;valori di liquidazione&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;button class=&quot;btn on&quot; id=&quot;gcOn&quot;&gt;Going concern regge&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;gcOff&quot;&gt;Going concern cade&lt;/button&gt;&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 600 200&quot; id=&quot;gcSvg&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;gcMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;ours&quot;&gt;esempio nostro&lt;/span&gt; Valori contabili dalla slide 17; i valori di liquidazione sono inventati per illustrare l&#x27;idea.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;acc&quot; hidden&gt;
   &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Accrual basis&lt;/em&gt; (principio di competenza): gli effetti delle transazioni si rilevano &lt;b&gt;quando avvengono&lt;/b&gt;, nel periodo a cui si riferiscono, non quando si muove il denaro. Conseguenze: crediti (&lt;i&gt;receivables&lt;/i&gt;), debiti (&lt;i&gt;payables&lt;/i&gt;), risconti attivi (&lt;i&gt;prepayments&lt;/i&gt;), ratei passivi (&lt;i&gt;accruals&lt;/i&gt;), ammortamenti (&lt;i&gt;depreciation&lt;/i&gt;). &lt;b&gt;Cash is not profit&lt;/b&gt;: la cassa non è l&#x27;utile.&lt;/p&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;p&gt;Dicembre: l&#x27;impresa fattura 500 di pubblicità, che il cliente pagherà a gennaio, e paga in anticipo 1.200 di hosting per i 12 mesi da dicembre a novembre. &lt;span class=&quot;ours&quot;&gt;esempio nostro&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;accCash&quot;&gt;Cash basis&lt;/button&gt; &lt;button class=&quot;btn on&quot; id=&quot;accAcc&quot;&gt;Accrual basis&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;accTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p id=&quot;accMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;p class=&quot;mut&quot;&gt;Il caso Bergamo Bikes (compiti, esercizio 7) è costruito interamente su questa seconda premessa.&lt;/p&gt;
  &lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa cambia nel balance sheet se la going concern assumption cade? (domanda 3 della slide 18)&lt;/summary&gt;&lt;div&gt;Gli assets non si valutano più per l&#x27;uso ma a valore di liquidazione, di solito più basso. La distinzione current/fixed perde senso, perché tutto va realizzato a breve, e possono emergere passività nuove (penali, costi di chiusura). L&#x27;equity si riduce di conseguenza.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Un&#x27;impresa ha un utile di 400 ma il conto corrente cala di 800 nello stesso periodo. È possibile?&lt;/summary&gt;&lt;div&gt;Sì: cash is not profit. Per esempio ha venduto a credito (ricavo senza incasso), ha comprato attrezzature (uscita di cassa senza costo immediato) o ha rimborsato un prestito. Il principio di competenza separa il risultato dai movimenti di cassa.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;comp&quot; data-c=&quot;brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;The components of the financial statements&lt;/small&gt;IFRS e Codice civile a confronto&lt;/h2&gt;
 &lt;p&gt;Gli &lt;em class=&quot;t&quot;&gt;IFRS&lt;/em&gt; (International Financial Reporting Standards, emanati dall&#x27;IASB) e il Codice civile italiano chiamano in modo diverso componenti quasi uguali.&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;IFRS (IAS 1 / IFRS 18)&lt;/th&gt;&lt;th&gt;Codice civile (art. 2423)&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Statement of financial position (balance sheet)&lt;/td&gt;&lt;td&gt;Stato patrimoniale&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Statement of profit or loss and other comprehensive income&lt;/td&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;/tr&gt;
  &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Statement of changes in equity&lt;/td&gt;&lt;td&gt;— (informazioni in nota integrativa)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Statement of cash flows&lt;/td&gt;&lt;td&gt;Rendiconto finanziario (dal 2016; non per small e micro entities)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Notes&lt;/td&gt;&lt;td&gt;Nota integrativa&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;i&gt;Fuori dai prospetti:&lt;/i&gt; management commentary (non richiesta dagli IFRS)&lt;/td&gt;&lt;td&gt;&lt;i&gt;Fuori dai prospetti:&lt;/i&gt; relazione sulla gestione (obbligatoria, art. 2428)&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 16. In evidenza le righe in cui i due sistemi differiscono.&lt;/p&gt;
 &lt;details&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;«other comprehensive income»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;&lt;em class=&quot;t&quot;&gt;OCI&lt;/em&gt; (altre componenti di conto economico complessivo) raccoglie utili e perdite che gli IFRS non fanno passare dal profit or loss, per esempio alcune rivalutazioni di immobili o le differenze di conversione delle partecipate estere. Profit or loss + OCI = total comprehensive income. Il Codice civile non ha un equivalente nel conto economico.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Perché «IAS 1 / IFRS 18»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; sostituisce IAS 1 per gli esercizi che iniziano dal 1° gennaio 2027 (adozione anticipata consentita). Introduce nell&#x27;income statement le categorie operating, investing e financing con due nuovi subtotali, e un&#x27;informativa sulle &lt;i&gt;management-defined performance measures&lt;/i&gt;. L&#x27;elenco dei componenti del bilancio resta sostanzialmente lo stesso. &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2024/primary-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, progetto Primary Financial Statements&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Errore comune.&lt;/b&gt; La relazione sulla gestione (directors&#x27; report) &lt;b&gt;accompagna&lt;/b&gt; il bilancio ma &lt;b&gt;non ne fa parte&lt;/b&gt;: ha regole diverse, responsabilità diverse e un giudizio del revisore diverso.&lt;/div&gt;
 &lt;p class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Precisazione: le società che redigono il bilancio in forma abbreviata (art. 2435-bis) e le micro-imprese (art. 2435-ter) possono omettere la relazione sulla gestione se riportano in nota integrativa le informazioni su azioni proprie e della controllante. Così riporta un prontuario professionale (&lt;a href=&quot;https://www.studiopizzano.it/relazione-sulla-gestione-art-2428-c-c-prontuario-bilancio/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;studiopizzano.it&lt;/a&gt;); da verificare sul testo vigente.&lt;/p&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Quale prospetto IFRS non ha un equivalente autonomo nel bilancio civilistico?&lt;/summary&gt;&lt;div&gt;Lo statement of changes in equity: nel Codice civile le variazioni del patrimonio netto si illustrano in nota integrativa.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Una piccola srl in forma abbreviata deve redigere il rendiconto finanziario?&lt;/summary&gt;&lt;div&gt;No: small e micro entities ne sono esonerate. È obbligatorio dagli esercizi che iniziano dal 2016, dopo il D.Lgs. 139/2015.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 10 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;prev&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Preview: from the trial balance to the statements&lt;/small&gt;Il sito web al 31 dicembre&lt;/h2&gt;
 &lt;p&gt;Che cosa costruirà la lezione di lunedì, in quattro passi.&lt;/p&gt;
 &lt;div class=&quot;stepper&quot; id=&quot;st2&quot;&gt;

    &lt;path class=&quot;ln&quot; d=&quot;M212 70C300 70 300 55 380 55&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M212 140C300 140 300 155 380 155&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;390&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;72&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Balance sheet&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;assets, liabilities, equity: si riportano all&#x27;anno dopo&lt;/text&gt;
    &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;390&quot; y=&quot;118&quot; width=&quot;360&quot; height=&quot;72&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;revenue, COGS, expenses: si azzerano ogni anno&lt;/text&gt;

   &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(500)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Phone Service&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(150)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Website Hosting&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(120)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Electric Service&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Subscriptions&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(65)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Meals&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(45)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Credit Card Fees &amp;amp; Interest&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Repairs &amp;amp; Maint. 25 · Fuel 25 · Bank Charges 25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;

   &lt;p class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;Nella slide l&#x27;hosting compare fra le altre spese. Presentandolo come cost of goods sold (sezione 2) si avrebbe un gross profit di 500 − 120 = 380, prima delle spese operative per 1,040. Il risultato finale non cambia. &lt;span class=&quot;ours&quot;&gt;calcolo nostro&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Balance sheet al 31 dicembre&lt;/h4&gt;
   &lt;div class=&quot;grid2&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;225&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Furniture&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;945&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
   &lt;table&gt;&lt;tr&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;680&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Owners&#x27; Equity (1,500 + 1,100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,600&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(660)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total liabilities + equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · La regola di chiusura&lt;/h4&gt;
   &lt;svg viewBox=&quot;0 0 760 160&quot; role=&quot;img&quot; aria-label=&quot;Il risultato passa all&#x27;equity&quot;&gt;
    &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;125&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;net loss (660)&lt;/text&gt;
    &lt;path class=&quot;lnI&quot; d=&quot;M244 80H500&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;372&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;il risultato netto passa all&#x27;equity&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;i conti di reddito ripartono da zero&lt;/text&gt;
    &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;510&quot; y=&quot;40&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;630&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;2,600 − 660 = 1,940&lt;/text&gt;
   &lt;/svg&gt;
   &lt;p&gt;&lt;b&gt;I conti del balance sheet si riportano all&#x27;esercizio successivo; quelli dell&#x27;income statement si azzerano ogni anno e il loro risultato netto confluisce nell&#x27;equity.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt mut&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti ›&lt;/button&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Fonte: slide 17. Il calcolo 2,600 − 660 = 1,940 è nostro: verifica che 680 + 1,940 = 2,620.&lt;/p&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Bank Charges vale 25 nell&#x27;income statement: da dove viene?&lt;/summary&gt;&lt;div&gt;10 a novembre + 15 a dicembre. L&#x27;income statement copre i due mesi, quindi usa i saldi del trial balance cumulativo.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Perché il balance sheet quadra solo dopo aver inserito la net loss?&lt;/summary&gt;&lt;div&gt;Perché senza il risultato mancano i conti di reddito: assets 2,620 contro liabilities + capitale apportato 3,280. La differenza, −660, è esattamente la perdita, che riduce l&#x27;equity.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;

&lt;!-- ============ 11 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fine&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;11&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Before you go&lt;/small&gt;Compiti e tre domande&lt;/h2&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Homework set 1, per lunedì 28&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Esercizio 1: Table 1, use / source e journal&lt;/li&gt;&lt;li&gt;Esercizio 2: Table 2, operazioni «on account» (a credito/debito) e scritture su più righe&lt;/li&gt;&lt;li&gt;Esercizio 3: T-accounts di dicembre&lt;/li&gt;&lt;li&gt;Esercizio 4: trial balance, dicembre e cumulativo&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;mut&quot;&gt;File «Homework – double-entry exercises» su Moodle. Le soluzioni sono in fondo: prova prima da solo.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lunedì 28 settembre&lt;/h4&gt;&lt;p&gt;Debriefing del set 1, poi balance sheet e income statement: definizioni, formati, il passaggio dal trial balance ai prospetti e le scritture di fine anno (&lt;em class=&quot;t&quot;&gt;year-end adjustments&lt;/em&gt;, le rettifiche di fine esercizio).&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Sapresti rispondere in tre righe?&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;1. Perché il trial balance quadra anche quando manca una transazione?&lt;/summary&gt;&lt;div&gt;Perché ogni scrittura ha debit = credit: omettendola, entrambi i totali calano dello stesso importo. Il trial balance verifica l&#x27;aritmetica, non la completezza (sezione 5).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;2. Un fornitore e un lender leggono lo stesso balance sheet: quale riga guarda per prima ciascuno?&lt;/summary&gt;&lt;div&gt;Il fornitore guarda la liquidità a breve (current assets contro current liabilities); il lender guarda l&#x27;indebitamento e la capacità di generare cassa (debt/equity, debiti a lungo termine). Vedi sezione 7.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;3. Che cosa cambia nel balance sheet se la going concern assumption cade?&lt;/summary&gt;&lt;div&gt;Si abbandona la valutazione per l&#x27;uso e tutto si rimisura a valori di liquidazione; la distinzione current/fixed perde significato. Vedi sezione 8.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;approf&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;→&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Per approfondire&lt;/small&gt;Norme, standard e testi citati&lt;/h2&gt;
 &lt;p&gt;Ogni voce è una &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;, trovata con una ricerca web: non viene dalle slide. Le slide citano le norme; descrizioni e link sono stati aggiunti qui.&lt;/p&gt;
 &lt;ol class=&quot;ref&quot;&gt;
  &lt;li&gt;&lt;b&gt;IAS 1 – Presentation of Financial Statements&lt;/b&gt; (IASB). Lo standard che finora ha definito i componenti del bilancio IFRS (slide 16) e le premesse di going concern e accrual basis (slide 15). Richiede al management di valutare la continuità per &lt;b&gt;almeno&lt;/b&gt; dodici mesi dalla data di riferimento: è un minimo, non un tetto. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt; · materiale educativo IFRS Foundation sulla going concern, citato da &lt;a href=&quot;https://icaew.com/insights/viewpoints-on-the-news/2021/feb-2021/202021-reporting-season-ifrs-foundation-releases-going-concern-guidance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW (2021)&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; è la base normativa delle slide 15–16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;IFRS 18 – Presentation and Disclosure in Financial Statements&lt;/b&gt; (IASB, 2024). Sostituisce IAS 1 dal 1° gennaio 2027, con applicazione retrospettiva: chi chiude l&#x27;esercizio a dicembre deve rideterminare il 2026 come comparativo. Introduce le categorie operating/investing/financing nell&#x27;income statement e l&#x27;informativa sulle performance measures definite dal management. &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2024/primary-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – Primary Financial Statements&lt;/a&gt; · sintesi &lt;a href=&quot;https://www.bdo.co.uk/en-gb/services/audit-assurance/ifrs/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; l&#x27;anno accademico 2026-27 cade proprio nella transizione.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Codice civile, art. 2423 – Redazione del bilancio.&lt;/b&gt; Elenca i componenti del bilancio d&#x27;esercizio: stato patrimoniale, conto economico, rendiconto finanziario e nota integrativa. Il rendiconto finanziario è stato aggiunto dal &lt;b&gt;D.Lgs. 18 agosto 2015 n. 139&lt;/b&gt;, per gli esercizi dal 1° gennaio 2016, che ha introdotto anche il principio di rilevanza (comma 4). Small e micro (artt. 2435-bis e 2435-ter) sono esonerate. &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2423.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi – art. 2423&lt;/a&gt; · &lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;D.Lgs. 139/2015&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; è la colonna di destra della slide 16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Codice civile, art. 2428 – Relazione sulla gestione.&lt;/b&gt; Gli amministratori analizzano situazione, andamento e risultato della gestione, i principali rischi e incertezze, con indicatori finanziari e, se serve, non finanziari. Il comma 3 elenca informazioni sempre obbligatorie (ricerca e sviluppo, rapporti con controllate, azioni proprie). &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2428.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi – art. 2428&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; è l&#x27;esempio della slide 16 di documento che accompagna il bilancio senza farne parte.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;IFRS Practice Statement 1 – Management Commentary&lt;/b&gt; (IASB, 2010; rivisto il 23 giugno 2025). È una guida &lt;b&gt;non obbligatoria&lt;/b&gt; per la relazione narrativa del management: non serve applicarla per dichiararsi conformi agli IFRS. La revisione del 2025 si concentra sulle esigenze informative degli investitori e collega fattori finanziari e di sostenibilità. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/management-commentary-practice-statement-1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – Practice Statement 1&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; spiega la nota «not required by IFRS» della slide 16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Conceptual Framework for Financial Reporting&lt;/b&gt; (IASB, 2018). Non è uno standard, ma fissa l&#x27;obiettivo del general purpose financial reporting: fornire informazioni utili a investitori, lenders e altri creditori, esistenti e potenziali, per decidere se fornire risorse all&#x27;entità. Nel 2018 ha reintrodotto la &lt;b&gt;stewardship&lt;/b&gt; (la valutazione dell&#x27;operato del management). &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – Conceptual Framework&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; da confrontare con l&#x27;obiettivo della slide 15, più ampio quanto a destinatari («those having reasonable rights»).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;The Corporate Report&lt;/b&gt; (Accounting Standards Steering Committee, Regno Unito, 1975). Documento di discussione che ha classificato gli utilizzatori dei bilanci e i loro bisogni informativi (sezione 2) e definito l&#x27;obiettivo dei corporate reports (sezione 3). La formulazione della slide 15 («those having reasonable rights to such information») richiama questo testo; non è stato possibile verificare la citazione parola per parola. &lt;a href=&quot;https://www.icaew.com/Library/subject-gateways/corporate-reporting/the-corporate-report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library – The Corporate Report&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; è all&#x27;origine della visione «stakeholder» delle slide 13–14.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Sustainability reporting: CSRD ed ESRS.&lt;/b&gt; La slide 14 rimanda al sustainability reporting per le domande di pubblico e comunità. Nell&#x27;UE il riferimento è la Direttiva (UE) 2022/2464 (&lt;i&gt;Corporate Sustainability Reporting Directive&lt;/i&gt;), che sostituisce la direttiva sull&#x27;informativa non finanziaria 2014/95/UE, insieme agli &lt;i&gt;European Sustainability Reporting Standards&lt;/i&gt; adottati dalla Commissione il 31 luglio 2023 su proposta tecnica dell&#x27;EFRAG. &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/sustainability-1/european-sustainability-reporting-standards-esrs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – ESRS&lt;/a&gt;. &lt;i&gt;Perché conta:&lt;/i&gt; è il nome del corso di laurea (Accounting, Governance &lt;b&gt;and Sustainability&lt;/b&gt;). Nota: calendario e perimetro della CSRD sono stati modificati più volte dopo il 2023, quindi controlla la versione in vigore.&lt;/li&gt;
 &lt;/ol&gt;
 &lt;p class=&quot;mut&quot; style=&quot;font-size:.9rem&quot;&gt;Il «Quick check» della slide 7 riporta la numerazione «4-7», tipica di un manuale americano di principles of accounting: la slide non dice quale, e qui non lo si è cercato.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

const NS=&#x27;http://www.w3.org/2000/svg&#x27;;

/* steppers */
$$(&#x27;.stepper&#x27;).forEach(st=&gt;{
