(function(){
const $=(s,r=document)=&gt;r.querySelector(s), $$=(s,r=document)=&gt;Array.from(r.querySelectorAll(s));
const fmt=(n,d=2)=&gt;n.toLocaleString(&#x27;en-US&#x27;,{minimumFractionDigits:d,maximumFractionDigits:d});
const NS=&#x27;http://www.w3.org/2000/svg&#x27;;

/* steppers */
$$(&#x27;.stepper&#x27;).forEach(st=&gt;{
 const steps=$$(&#x27;.step&#x27;,st), dots=$(&#x27;.dots&#x27;,st), cnt=$(&#x27;.cnt&#x27;,st); let i=0;
 steps.forEach(()=&gt;dots.appendChild(document.createElement(&#x27;i&#x27;)));
 const show=()=&gt;{steps.forEach((s,k)=&gt;s.classList.toggle(&#x27;cur&#x27;,k===i));$$(&#x27;i&#x27;,dots).forEach((d,k)=&gt;d.classList.toggle(&#x27;on&#x27;,k&lt;=i));cnt.textContent=(i+1)+&#x27; / &#x27;+steps.length;$(&#x27;.prev&#x27;,st).disabled=i===0;$(&#x27;.next&#x27;,st).disabled=i===steps.length-1;};
 $(&#x27;.prev&#x27;,st).onclick=()=&gt;{if(i&gt;0){i--;show();}};
 $(&#x27;.next&#x27;,st).onclick=()=&gt;{if(i&lt;steps.length-1){i++;show();}};
 show();
});

/* generic tabs with panels */
$$(&#x27;.tabs&#x27;).forEach(t=&gt;{
 const btns=$$(&#x27;[role=tab][data-p]&#x27;,t); if(!btns.length) return;
 btns.forEach(b=&gt;b.onclick=()=&gt;{btns.forEach(x=&gt;{const on=x===b;x.setAttribute(&#x27;aria-selected&#x27;,on);$(&#x27;#&#x27;+x.dataset.p).hidden=!on;});});
});

/* true/false */
$$(&#x27;.tf&#x27;).forEach(q=&gt;{
 const [v,f]=$$(&#x27;button&#x27;,q);
 [v,f].forEach(b=&gt;b.onclick=()=&gt;{const ans=b===v?&#x27;V&#x27;:&#x27;F&#x27;;const ok=ans===q.dataset.a;[v,f].forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);q.classList.add(&#x27;done&#x27;);$(&#x27;.fb&#x27;,q).style.color=ok?&#x27;var(--ok)&#x27;:&#x27;var(--ko)&#x27;;$(&#x27;.fb&#x27;,q).firstChild.textContent=ok?&#x27;Correct. &#x27;:&#x27;Not quite. &#x27;;});
 const fb=$(&#x27;.fb&#x27;,q); fb.insertBefore(document.createTextNode(&#x27;&#x27;),fb.firstChild);
});

/* classification */
const TYPES=[&#x27;Current Asset&#x27;,&#x27;Fixed Asset&#x27;,&#x27;Current Liability&#x27;,&#x27;Equity&#x27;,&#x27;Revenue&#x27;,&#x27;Cost of Goods Sold&#x27;,&#x27;Expense&#x27;];
const ACC=[[&#x27;Checking Account&#x27;,0],[&quot;Owners&#x27; Equity&quot;,3],[&#x27;Office Equipment&#x27;,1],[&#x27;Office Supplies&#x27;,6],[&#x27;Computer Hardware&#x27;,1],[&#x27;Bank Charges&#x27;,6],[&#x27;Office Furniture&#x27;,1],[&#x27;Repairs and Maintenance&#x27;,6],[&#x27;Advertising Sales&#x27;,4],[&#x27;Phone Service&#x27;,6],[&#x27;Accounts Payable&#x27;,2],[&#x27;Electric Service&#x27;,6],[&#x27;Credit Card Interest and Fees&#x27;,6],[&#x27;Fuel&#x27;,6],[&#x27;Subscriptions&#x27;,6],[&#x27;Meals&#x27;,6],[&#x27;Website Hosting&#x27;,5],[&#x27;Rent (added)&#x27;,6]];
const ct=$(&#x27;#classify&#x27;);
ct.innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Accounting type&lt;/th&gt;&lt;/tr&gt;&#x27;+ACC.map((a,k)=&gt;&#x27;&lt;tr data-k=&quot;&#x27;+k+&#x27;&quot;&gt;&lt;td&gt;&#x27;+a[0]+&#x27;&lt;/td&gt;&lt;td&gt;&lt;select aria-label=&quot;Type of &#x27;+a[0]+&#x27;&quot;&gt;&lt;option value=&quot;&quot;&gt;— choose —&lt;/option&gt;&#x27;+TYPES.map((t,j)=&gt;&#x27;&lt;option value=&quot;&#x27;+j+&#x27;&quot;&gt;&#x27;+t+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;);
const rows=$$(&#x27;tr[data-k]&#x27;,ct);
$(&#x27;#clsCheck&#x27;).onclick=()=&gt;{let ok=0;rows.forEach(r=&gt;{const s=$(&#x27;select&#x27;,r).value,c=String(ACC[r.dataset.k][1]);r.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;);if(s!==&#x27;&#x27;){r.classList.add(s===c?&#x27;ok&#x27;:&#x27;ko&#x27;);}if(s===c)ok++;});$(&#x27;#clsScore&#x27;).textContent=ok+&#x27; / &#x27;+ACC.length+&#x27; correct&#x27;;};
$(&#x27;#clsShow&#x27;).onclick=()=&gt;{rows.forEach(r=&gt;{$(&#x27;select&#x27;,r).value=ACC[r.dataset.k][1];});$(&#x27;#clsCheck&#x27;).onclick();};
$(&#x27;#clsReset&#x27;).onclick=()=&gt;{rows.forEach(r=&gt;{$(&#x27;select&#x27;,r).value=&#x27;&#x27;;r.classList.remove(&#x27;ok&#x27;,&#x27;ko&#x27;);});$(&#x27;#clsScore&#x27;).textContent=&#x27;&#x27;;};

/* working capital */
const ca=$(&#x27;#ca&#x27;),cl=$(&#x27;#cl&#x27;);
function wc(){const a=+ca.value,l=+cl.value,w=a-l;$(&#x27;#caV&#x27;).textContent=fmt(a,0);$(&#x27;#clV&#x27;).textContent=fmt(l,0);$(&#x27;#wcV&#x27;).textContent=(w&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+fmt(Math.abs(w),0);$(&#x27;#wcV&#x27;).style.color=w&lt;0?&#x27;var(--ko)&#x27;:&#x27;var(--ok)&#x27;;$(&#x27;#crV&#x27;).textContent=l?fmt(a/l):&#x27;—&#x27;;
 const sc=560/2000;$(&#x27;#wcBar&#x27;).innerHTML=&#x27;&lt;rect x=&quot;20&quot; y=&quot;8&quot; width=&quot;&#x27;+(a*sc)+&#x27;&quot; height=&quot;22&quot; rx=&quot;3&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;text x=&quot;&#x27;+(26+a*sc)+&#x27;&quot; y=&quot;24&quot; font-size=&quot;12&quot;&gt;CA&lt;/text&gt;&lt;rect x=&quot;20&quot; y=&quot;38&quot; width=&quot;&#x27;+(l*sc)+&#x27;&quot; height=&quot;22&quot; rx=&quot;3&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;&#x27;+(26+l*sc)+&#x27;&quot; y=&quot;54&quot; font-size=&quot;12&quot;&gt;CL&lt;/text&gt;&#x27;;
 $(&#x27;#wcMsg&#x27;).innerHTML=w&gt;=0?&#x27;&lt;b&gt;Positive working capital:&lt;/b&gt; current assets cover current liabilities.&#x27;:&#x27;&lt;b&gt;Negative working capital:&lt;/b&gt; short-term liabilities exceed short-term assets. Cash needs watching, but it is not a verdict: it depends on the cycle of collections and payments.&#x27;;}
ca.oninput=cl.oninput=wc; wc();
