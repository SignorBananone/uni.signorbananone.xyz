   &lt;a href=&quot;#ass&quot;&gt;&lt;g class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;610&quot; y=&quot;310&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;335&quot; text-anchor=&quot;middle&quot;&gt;Objective&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;690&quot; y=&quot;352&quot; text-anchor=&quot;middle&quot;&gt;going concern · accrual&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
   &lt;a href=&quot;#comp&quot;&gt;&lt;g class=&quot;node n-brick&quot;&gt;&lt;rect x=&quot;784&quot; y=&quot;310&quot; width=&quot;156&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;862&quot; y=&quot;335&quot; text-anchor=&quot;middle&quot;&gt;Components&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;862&quot; y=&quot;352&quot; text-anchor=&quot;middle&quot;&gt;IFRS vs Civil Code&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;src&quot;&gt;Colours: &lt;span style=&quot;color:var(--sage)&quot;&gt;sage&lt;/span&gt; = recording and organising the accounts · &lt;span style=&quot;color:var(--ocra)&quot;&gt;ochre&lt;/span&gt; = balances and trial balance · &lt;span style=&quot;color:var(--slate)&quot;&gt;slate&lt;/span&gt; = financial statements and their users · &lt;span style=&quot;color:var(--brick)&quot;&gt;brick&lt;/span&gt; = assumptions and rules. The dashed lines are the bridge to Monday 28&#x27;s lecture.&lt;/p&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;dove&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Where we are&lt;/small&gt;The accounting chain&lt;/h2&gt;
 &lt;p&gt;The first three lectures (slides 1–62 of the course: the sandwich company, &lt;em class=&quot;t&quot;&gt;use / source&lt;/em&gt;, journal entries, chart of accounts, T-accounts) built the first three links. Today we reach the fourth, the &lt;em class=&quot;t&quot;&gt;trial balance&lt;/em&gt; (the list of the balances of all accounts at a given date), and we look ahead to the fifth, the &lt;em class=&quot;t&quot;&gt;financial statements&lt;/em&gt; (the annual accounts), which will be the topic of Monday 28.&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Transaction, Journal, Ledger, Trial balance, Financial statements&quot;&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;82&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Transaction&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;four questions&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;186&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;266&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Journal&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;date order&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;370&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;450&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Ledger / T-accounts&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;by account&lt;/text&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;554&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:3&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;634&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Trial balance&lt;/text&gt;&lt;text x=&quot;634&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;list of balances · TODAY&lt;/text&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;738&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;818&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Financial statements&lt;/text&gt;&lt;text x=&quot;818&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;Monday 28&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M164 50H184&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M348 50H368&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M532 50H552&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M716 50H736&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;text x=&quot;450&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;each step rearranges the same information: first by date, then by account, then by balance, then by statement&lt;/text&gt;
 &lt;/svg&gt;

 &lt;h3&gt;One example through the whole chain&lt;/h3&gt;
 &lt;p&gt;The case used in the lecture is a small business that sells advertising space on a website. Step through it: in November the owner contributes 1,500 and the business pays six expenses from its current account. &lt;span class=&quot;ours&quot;&gt;our reconstruction&lt;/span&gt; The individual amounts are those of the November trial balance (slide 11); the sequence of entries has been reconstructed so that the current account balance comes back to 190.&lt;/p&gt;
 &lt;div class=&quot;stepper&quot; id=&quot;st1&quot;&gt;
  &lt;div class=&quot;step cur&quot;&gt;&lt;h4&gt;1 · Transaction&lt;/h4&gt;&lt;p&gt;The owner contributes 1,500 to the &lt;b&gt;Checking Account&lt;/b&gt; (the business bank account). The basic questions: which accounts are affected? what type are they? do they increase or decrease? are they debited or credited? In &lt;em class=&quot;t&quot;&gt;use / source&lt;/em&gt; terms: the money in the bank is a &lt;b&gt;use&lt;/b&gt; (where the resources have gone), the owner&#x27;s capital is the &lt;b&gt;source&lt;/b&gt; (where they came from).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Journal&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;journal&lt;/em&gt; (book of original entry) records transactions in date order, one line per account affected:&lt;/p&gt;
   &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Nov&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Owners&#x27; Equity&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td&gt;Nov&lt;/td&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Checking Account&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
   &lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;mut&quot;&gt;… and likewise for Office Equipment 225, Computer Hardware 500, Office Supplies 75, Bank Charges 10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Ledger / T-account&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;ledger&lt;/em&gt; (general ledger) rearranges the same lines &lt;b&gt;by account&lt;/b&gt;. Each account is a &lt;em class=&quot;t&quot;&gt;T-account&lt;/em&gt;: debits on the left, credits on the right.&lt;/p&gt;
   &lt;svg viewBox=&quot;0 0 420 190&quot; style=&quot;max-width:420px&quot; role=&quot;img&quot; aria-label=&quot;T-account for the Checking Account&quot;&gt;
    &lt;text x=&quot;210&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Checking Account&lt;/text&gt;
    &lt;path class=&quot;lnI&quot; d=&quot;M20 28H400M210 28V160&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;46&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;DEBIT&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;46&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;CREDIT&lt;/text&gt;
    &lt;text x=&quot;190&quot; y=&quot;66&quot; text-anchor=&quot;end&quot;&gt;1,500&lt;/text&gt;
    &lt;text x=&quot;390&quot; y=&quot;66&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;84&quot; text-anchor=&quot;end&quot;&gt;225&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;102&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;120&quot; text-anchor=&quot;end&quot;&gt;75&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;138&quot; text-anchor=&quot;end&quot;&gt;10&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M20 150H400&quot;/&gt;
    &lt;text x=&quot;190&quot; y=&quot;178&quot; text-anchor=&quot;end&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--slate)&quot;&gt;balance 190 Dr&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;178&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;1,500 − 1,310&lt;/text&gt;
   &lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Trial balance&lt;/h4&gt;&lt;p&gt;From each T-account we take &lt;b&gt;only the balance&lt;/b&gt; and place it in a list: one line per account (not per transaction). If total debits equal total credits, the arithmetic is correct: in November, 1,500 = 1,500.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Financial statements&lt;/h4&gt;&lt;p&gt;The balances are then sorted: asset, liability and equity accounts go to the &lt;em class=&quot;t&quot;&gt;balance sheet&lt;/em&gt;, revenue and expense accounts to the &lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt;. A preview follows in section 10, with the full treatment on Monday.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt mut&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next ›&lt;/button&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot; style=&quot;margin-top:1.2em&quot;&gt;&lt;h4&gt;Homework assigned (from slide 2)&lt;/h4&gt;
 &lt;p&gt;&lt;b&gt;Set 1&lt;/b&gt;, due Monday 28: exercises 1–4 (Tables 1–2, T-accounts, trial balance). &lt;b&gt;Set 2&lt;/b&gt;, due Wednesday 30: exercises 5–7 (The Library, the retail shop, Bergamo Bikes). The debriefing takes up the first 20 minutes of each lecture. File “Homework – double-entry exercises” on Moodle.&lt;/p&gt;&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;What is the difference between the journal and the ledger, if they contain the same figures?&lt;/summary&gt;&lt;div&gt;The order. The journal is chronological (one entry per transaction); the ledger is organised by account (all the movements of one account together). The trial balance goes one step further: it keeps only the closing balance of each account.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why does the Checking Account have a debit balance of 190 at the end of November?&lt;/summary&gt;&lt;div&gt;1,500 came in (debit) and a total of 1,310 went out (credit: 500 + 225 + 500 + 75 + 10). The difference is 190 on the debit side, the side on which an asset increases.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;coa&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Organising the chart of accounts&lt;/small&gt;Seven account types, in financial statement order&lt;/h2&gt;
 &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;chart of accounts&lt;/em&gt; is the list of all the accounts the business uses. At first it is an unordered list, i.e. in the order in which the accounts were opened. To make it useful it is sorted by &lt;b&gt;two keys&lt;/b&gt;: first the &lt;b&gt;type&lt;/b&gt; of account, following the order of the financial statements, then &lt;b&gt;liquidity&lt;/b&gt; (section 3).&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;What it contains&lt;/th&gt;&lt;th&gt;Statement&lt;/th&gt;&lt;th&gt;Normal balance&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;/td&gt;&lt;td&gt;what the business owns or controls&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;/td&gt;&lt;td&gt;what the business owes to third parties&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Equity&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the owners&#x27; interest: capital + &lt;i&gt;retained profits&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Balance sheet&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Revenue&lt;/b&gt;&lt;/td&gt;&lt;td&gt;income from selling products or services&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;credit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Cost of goods sold&lt;/b&gt;&lt;/td&gt;&lt;td&gt;direct cost of what has been sold&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Expenses&lt;/b&gt;&lt;/td&gt;&lt;td&gt;operating costs with no lasting value&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;debit&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Other revenue and expenses&lt;/b&gt;&lt;/td&gt;&lt;td&gt;unusual items, outside ordinary operations&lt;/td&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td&gt;either&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 3.&lt;/p&gt;

 &lt;div class=&quot;grid2&quot; style=&quot;margin-top:1em&quot;&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cost or expense?&lt;/b&gt;&lt;br&gt;A &lt;em class=&quot;t&quot;&gt;cost&lt;/em&gt; (in the narrow sense used here: cost of goods sold) is what you need to &lt;i&gt;produce or buy what you sell&lt;/i&gt;; an &lt;em class=&quot;t&quot;&gt;expense&lt;/em&gt; is what you need to &lt;i&gt;keep the business running&lt;/i&gt;. The two can be told apart &lt;b&gt;only if you know what the business sells&lt;/b&gt;. When in doubt, the slide advises classifying the item as an expense.&lt;/div&gt;
  &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;In our example&lt;/h4&gt;&lt;p&gt;The business sells advertising space on a website. The only direct cost is &lt;b&gt;website hosting&lt;/b&gt;: without the website there is no product. Rent, phone, fuel and meals keep the business running, so they are expenses.&lt;/p&gt;&lt;p class=&quot;mut&quot; style=&quot;font-size:.9rem&quot;&gt;For a pizzeria, by contrast, flour would be cost of goods sold and the website an expense: classification depends on the business, not on the name of the account.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p&gt;&lt;b&gt;Gross profit&lt;/b&gt; is revenue − cost of goods sold, and this is why the distinction matters: it separates what the product earns from what the organisation costs to run. The term does not appear in this lecture; it will come up with the income statement formats.&lt;/p&gt;

 &lt;h3&gt;Try it: classify the accounts &lt;span class=&quot;pill&quot;&gt;interactive&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;This is the “Classify together” exercise from slide 4. Choose the type for each account and press &lt;b&gt;Check&lt;/b&gt;; the solution is the one on slide 6.&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;classify&quot; id=&quot;classify&quot;&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;p style=&quot;margin-top:10px&quot;&gt;&lt;button class=&quot;btn on&quot; id=&quot;clsCheck&quot;&gt;Check&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;clsShow&quot;&gt;Show solution&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;clsReset&quot;&gt;Start over&lt;/button&gt; &lt;span id=&quot;clsScore&quot; class=&quot;mut&quot;&gt;&lt;/span&gt;&lt;/p&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Two details from the slides.&lt;/b&gt; In the list on slide 4 the revenue account is called “Advertising Sales”, in the solution (slide 6) “Sales”: it is the same account. &lt;b&gt;Rent&lt;/b&gt; is missing from both lists but appears in the trial balance (slides 10–11): it is an expense, and we have added it here.&lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Why is Website Hosting cost of goods sold, while Phone Service is not?&lt;/summary&gt;&lt;div&gt;Because the business sells advertising space &lt;i&gt;on the website&lt;/i&gt;: hosting is the direct cost of the product. The phone is needed to run the business, but it is not linked to each sale.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Are Office Equipment, Computer Hardware and Office Furniture expenses?&lt;/summary&gt;&lt;div&gt;No: they are &lt;b&gt;fixed assets&lt;/b&gt;. They have lasting value, i.e. they serve the business over several financial years. Expenses are “operating costs with no lasting value”, such as Office Supplies, consumed within the period.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Which account type can have either a debit or a credit normal balance?&lt;/summary&gt;&lt;div&gt;Other revenue and expenses: it collects both unusual income and unusual charges outside ordinary operations.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;liq&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Order of liquidity&lt;/small&gt;The second sorting key&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liquidity&lt;/b&gt;&lt;br&gt;How quickly an item can be turned into cash &lt;b&gt;without losing value&lt;/b&gt;. Assets are listed starting from cash; liabilities starting from those that fall due first.&lt;/div&gt;
 &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Current&lt;/em&gt; (short-term) = expected to be realised or settled within one year, or within the &lt;em class=&quot;t&quot;&gt;operating cycle&lt;/em&gt; (the time from the purchase of inputs to the collection of cash from sales). &lt;em class=&quot;t&quot;&gt;Fixed / long-term&lt;/em&gt; (non-current) = beyond that period.&lt;/p&gt;
 &lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Balance sheet ordered by liquidity&quot;&gt;
  &lt;text x=&quot;215&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Liabilities and equity&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;34&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;24&quot; y=&quot;58&quot; font-weight=&quot;700&quot;&gt;Current&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;82&quot;&gt;cash · receivables · inventory · prepayments&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;104&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;crediti verso clienti · magazzino · risconti attivi&lt;/text&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;152&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;24&quot; y=&quot;176&quot; font-weight=&quot;700&quot;&gt;Fixed&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;200&quot;&gt;property, plant, equipment · intangibles · investments&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;222&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;immobilizzazioni materiali, immateriali, finanziarie&lt;/text&gt;
  &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;34&quot; width=&quot;410&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;58&quot; font-weight=&quot;700&quot;&gt;Current liabilities&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;82&quot;&gt;payables · accrued expenses · short-term loans&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;104&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;debiti verso fornitori · ratei passivi · prestiti a breve&lt;/text&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;152&quot; width=&quot;410&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;176&quot; font-weight=&quot;700&quot;&gt;Long-term&lt;/text&gt;&lt;text x=&quot;454&quot; y=&quot;196&quot; font-size=&quot;14&quot;&gt;bank loans · bonds&lt;/text&gt;
  &lt;g class=&quot;n-acc&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;212&quot; width=&quot;410&quot; height=&quot;50&quot; rx=&quot;6&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;454&quot; y=&quot;242&quot; font-weight=&quot;700&quot;&gt;then equity&lt;/text&gt;
  &lt;path class=&quot;lnI&quot; d=&quot;M430 40V258&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;text x=&quot;430&quot; y=&quot;288&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;↓ from most liquid / most urgent to least liquid / most distant&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 5. The Italian equivalents in grey are ours.&lt;/p&gt;

 &lt;h3&gt;Why “current” matters: working capital &lt;span class=&quot;pill&quot;&gt;sliders&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;Current liabilities are normally paid out of current assets. The difference between the two is &lt;em class=&quot;t&quot;&gt;working capital&lt;/em&gt; (net working capital). If current liabilities exceed current assets, cash management needs watching: it is &lt;b&gt;a warning sign, not a verdict&lt;/b&gt;. A supermarket operates every day with negative working capital: it collects from customers immediately and pays suppliers at 60–90 days.&lt;/p&gt;
 &lt;div class=&quot;card&quot;&gt;
  &lt;label&gt;Current assets: &lt;b id=&quot;caV&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;ca&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;550&quot;&gt;&lt;/label&gt;
  &lt;label&gt;Current liabilities: &lt;b id=&quot;clV&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;cl&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;680&quot;&gt;&lt;/label&gt;
  &lt;svg viewBox=&quot;0 0 600 70&quot; id=&quot;wcBar&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;Working capital&lt;b id=&quot;wcV&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Current ratio&lt;b id=&quot;crV&quot;&gt;&lt;/b&gt;&lt;span class=&quot;mut&quot; style=&quot;font-size:.8rem&quot;&gt;current assets / current liabilities&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p id=&quot;wcMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;The starting values (550 and 680) are those of the website business at 31 December (slide 17): the Checking Account (550) is the only current asset, Accounts Payable (680) the only current liability. &lt;span class=&quot;ours&quot;&gt;our calculation&lt;/span&gt; The business in the example also closes with negative working capital (−130).&lt;/p&gt;
 &lt;/div&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;A five-year bank loan: current or long-term? And the instalment due in six months?&lt;/summary&gt;&lt;div&gt;The loan is long-term. The portion due within twelve months is, strictly speaking, a current liability: the slide lists “short-term loans” among current liabilities. In practice it is presented separately from the rest of the debt.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Does negative working capital mean the business is about to fail?&lt;/summary&gt;&lt;div&gt;No. The slide calls it “a warning sign, not a verdict”. It depends on the business: a supermarket collects in cash and pays on deferred terms, so it routinely lives with negative working capital.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;nb&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Normal balances&lt;/small&gt;Which side the balance sits on&lt;/h2&gt;
 &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;normal balance&lt;/em&gt; is the side, debit or credit, on which an account &lt;b&gt;increases&lt;/b&gt;, and therefore the side on which its balance is expected to appear. It follows from the accounting equation:&lt;/p&gt;
 &lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Equity&lt;br&gt;&lt;span style=&quot;font-size:1rem;color:var(--muted)&quot;&gt;and, extended with the income statement accounts:&lt;/span&gt;&lt;br&gt;Assets + Expenses (+ COGS) = Liabilities + Equity + Revenue&lt;/div&gt;
 &lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-label=&quot;Debit side and credit side&quot;&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;410&quot; height=&quot;130&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
  &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;440&quot; y=&quot;10&quot; width=&quot;410&quot; height=&quot;130&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;215&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;DEBIT · left side&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;CREDIT · right side&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Assets · Cost of goods sold · Expenses&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Liabilities · Equity · Revenue&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;use / acquisition: where the resources went&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;source: where the resources came from&lt;/text&gt;
  &lt;text x=&quot;215&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;expenses are “consumables”: resources used up&lt;/text&gt;
  &lt;text x=&quot;645&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;revenue increases equity, so it sits on the same side&lt;/text&gt;
 &lt;/svg&gt;
 &lt;p&gt;Slide 8 applies this to the November accounts: each account “increases as” &lt;i&gt;Acquisition/Use&lt;/i&gt; (debit) or &lt;i&gt;Source&lt;/i&gt; (credit).&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;th&gt;Increases as&lt;/th&gt;&lt;th&gt;Expected balance&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;190.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;something the business owns&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;225.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;something the business owns&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;something the business owns&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Owners&#x27; Equity&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1500.00&lt;/td&gt;&lt;td&gt;Source&lt;/td&gt;&lt;td class=&quot;cr&quot;&gt;Credit&lt;/td&gt;&lt;td&gt;the owners&#x27; investment in the business&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Bank Charges&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Acquisition/Use&lt;/td&gt;&lt;td class=&quot;dr&quot;&gt;Debit&lt;/td&gt;&lt;td&gt;consumable (acquisition/use)&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 8.&lt;/p&gt;
 &lt;details&gt;&lt;summary&gt;Why know the normal balance? A quick check&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A balance on the “wrong” side is a sign of error: an Office Supplies account with a credit balance, for example, is almost certainly a reversed entry. There are, however, legitimate exceptions. An overdrawn current account has a credit balance, because at that moment it is a liability to the bank, and “contra” accounts (e.g. accumulated depreciation) deliberately carry the opposite balance to the account they relate to.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Owner&#x27;s withdrawals (drawings)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;When the owner takes money out for personal use, equity &lt;b&gt;decreases&lt;/b&gt;: the drawings account has a normal debit balance and reduces equity. For equity, over a period:&lt;/p&gt;&lt;div class=&quot;formula&quot; style=&quot;font-size:1.1rem&quot;&gt;Closing equity = Opening equity + new contributions + net income − withdrawals&lt;/div&gt;&lt;p&gt;If drawings exceed profit, equity falls even though the business has made a profit.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check: Quick check (slide 7)&lt;/h3&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;1. The normal balance of a revenue account is the debit side.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;False: revenue increases equity, so it increases on, and has its balance on, the &lt;b&gt;credit&lt;/b&gt; side.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;V&quot;&gt;&lt;p&gt;2. The normal balance of an expense account is the debit side.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;True: an expense is a consumption of resources (use), so it has a debit balance.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;3. If withdrawals exceed net income, owner&#x27;s equity increases.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;False: it decreases. E.g. profit 400, drawings 600 → equity −200, with contributions unchanged.&lt;/div&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Accounts Payable has a normal balance of…?&lt;/summary&gt;&lt;div&gt;Credit: it is a liability, a source of financing (the supplier who has not yet been paid).&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;tb&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;The trial balance&lt;/small&gt;The list of balances at a given date&lt;/h2&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it is&lt;/h4&gt;&lt;p&gt;Once all entries have been posted, every account has a balance. The trial balance lists the accounts with their debit or credit balance. It uses the same grid as the journal, but with &lt;b&gt;one line per account&lt;/b&gt; instead of one per transaction.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Total debits = total credits&lt;/b&gt;: if not, there is an error somewhere.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it proves, and what it does not&lt;/h4&gt;&lt;p&gt;It proves the &lt;b&gt;arithmetic&lt;/b&gt;: every entry has been recorded with equal debits and credits.&lt;/p&gt;&lt;p&gt;It does not detect: an omitted transaction, a posting to the wrong account, a wrong amount on both sides, or compensating errors. &lt;i&gt;This is why the auditor does not stop at the trial balance.&lt;/i&gt;&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;h3&gt;Error simulator &lt;span class=&quot;pill&quot;&gt;interactive&lt;/span&gt;&lt;/h3&gt;
 &lt;p&gt;Start from the November trial balance and introduce an error: does the trial balance pick it up?&lt;/p&gt;
 &lt;div class=&quot;card&quot;&gt;
  &lt;div id=&quot;errBtns&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;errDesc&quot; style=&quot;min-height:3em&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;errTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div id=&quot;errVerdict&quot; class=&quot;verdict&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;A textbook trick: the difference divisible by 9&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If the trial balance does not agree and the difference is divisible by 9, a &lt;b&gt;transposition&lt;/b&gt; or slide error is likely (500 written as 50, 54 written as 45). In the simulator: 1,500 − 1,050 = 450 = 9 × 50. This is a rule of thumb; it does not come from the slides.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

 &lt;h3&gt;Three versions of the same thing&lt;/h3&gt;
 &lt;p&gt;The &lt;b&gt;monthly trial balance&lt;/b&gt; shows the movements of the month; the &lt;b&gt;cumulative trial balance&lt;/b&gt; the balances since inception; the &lt;b&gt;comparative&lt;/b&gt; one has a column per period. In the comparative version on the slides, credits are written with a minus sign (Owners&#x27; Equity −1,500), so each column sums to &lt;b&gt;zero&lt;/b&gt; instead of showing two equal totals.&lt;/p&gt;
 &lt;div class=&quot;tabs&quot; id=&quot;tbTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;nov&quot;&gt;November&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;dec&quot;&gt;December&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;cum&quot;&gt;Cumulative at 31/12&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-v=&quot;cmp&quot;&gt;Comparative&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;tbTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;tbNote&quot; class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;/p&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slides 10–11. On the slides the cumulative trial balance and the December/Total columns of the comparative one are blank, to be filled in: here they are computed by adding November and December &lt;span class=&quot;ours&quot;&gt;our calculation&lt;/span&gt;. This is exactly homework exercise 4, so try it on your own first. The “2010” dates are those of the original example.&lt;/p&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Why does the trial balance agree even if a transaction is missing? (question 1 on slide 18)&lt;/summary&gt;&lt;div&gt;Because the missing transaction would have added the same amount to debits and to credits. Leaving it out lowers both totals by the same figure, and the equality holds. The trial balance checks balance, not completeness.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In December Owners&#x27; Equity shows 1,100 in credit. What does this mean?&lt;/summary&gt;&lt;div&gt;During the month the owners made a new contribution of 1,100. In the cumulative trial balance equity becomes 1,500 + 1,100 = 2,600 credit, as on slide 17.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;In the comparative trial balance every column totals 0.00: is that an error?&lt;/summary&gt;&lt;div&gt;No. Credits are recorded with a negative sign, so the algebraic sum of debits (+) and credits (−) is zero when the trial balance agrees.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fs&quot; data-c=&quot;slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;What is a financial statement?&lt;/small&gt;A process and a document&lt;/h2&gt;
 &lt;div class=&quot;tabs&quot; id=&quot;fsTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;fsP&quot;&gt;Process&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-p=&quot;fsD&quot;&gt;Document&lt;/button&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;fsP&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;Collecting, classifying and summarising thousands of transactions into a few pages, at regular intervals (year, quarter, month).&lt;/p&gt;
   &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Form&lt;/h4&gt;the documents, their structure and their content: which statements, which line items, in what order.&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Substance&lt;/h4&gt;the &lt;b&gt;measurement&lt;/b&gt; of the amounts that go into those documents: at what value do I recognise a computer, a receivable, a payable?&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;fsD&quot; hidden&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;For a period, it represents:&lt;/p&gt;
   &lt;ul&gt;&lt;li&gt;&lt;em class=&quot;t&quot;&gt;financial performance&lt;/em&gt; → &lt;b&gt;income statement&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;&lt;em class=&quot;t&quot;&gt;financial position&lt;/em&gt; → &lt;b&gt;balance sheet&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;&lt;em class=&quot;t&quot;&gt;cash flows&lt;/em&gt; → &lt;b&gt;statement of cash flows&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
   &lt;p&gt;&lt;b&gt;Two questions determine everything else: what does it represent, and who is it for?&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;From thousands of transactions to a few pages&quot;&gt;
  &lt;g style=&quot;fill:var(--slate)&quot; opacity=&quot;.35&quot;&gt;&lt;circle cx=&quot;30&quot; cy=&quot;30&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;62&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;80&quot; cy=&quot;24&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;96&quot; cy=&quot;86&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;50&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;96&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;140&quot; cy=&quot;20&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;158&quot; cy=&quot;76&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;44&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;104&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;180&quot; cy=&quot;40&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;96&quot; r=&quot;4&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;110&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;thousands of transactions&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M230 60H300&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;collect&lt;/text&gt;
  &lt;g class=&quot;n-sage&quot;&gt;&lt;rect x=&quot;310&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;370&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;classify&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M432 60H500&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;510&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;summarise&lt;/text&gt;
  &lt;path class=&quot;ln&quot; d=&quot;M632 60H700&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;710&quot; y=&quot;12&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;rect x=&quot;726&quot; y=&quot;22&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;rect x=&quot;742&quot; y=&quot;32&quot; width=&quot;60&quot; height=&quot;80&quot; rx=&quot;3&quot;/&gt;&lt;/g&gt;
  &lt;text x=&quot;772&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;a few pages&lt;/text&gt;
 &lt;/svg&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Exercise on slide 12&lt;/b&gt; (2 minutes): write down three users of financial statements and, for each, the one question they want answered. Then compare with section 7.&lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Form and substance: which does the choice of measuring inventory at cost or at market value belong to?&lt;/summary&gt;&lt;div&gt;Substance: it is a question of measurement. Deciding whether inventory appears as a separate line item in the balance sheet, on the other hand, is form.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What are the three things a financial statement represents?&lt;/summary&gt;&lt;div&gt;Financial performance (income statement), financial position (balance sheet) and cash flows (statement of cash flows), all relating to a period.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;users&quot; data-c=&quot;slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Stakeholders · Users and their questions&lt;/small&gt;Different readers, different decisions&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt;&lt;br&gt;A person, group or organisation that has an interest or concern in an organisation (slide 13).&lt;/div&gt;
 &lt;p&gt;Tap a stakeholder to see their question and what they look at in the financial statements.&lt;/p&gt;
 &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
  &lt;svg class=&quot;wheel&quot; viewBox=&quot;0 0 860 340&quot; id=&quot;wheel&quot; role=&quot;img&quot; aria-label=&quot;Stakeholders around the business&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;card tint&quot; id=&quot;shBox&quot; aria-live=&quot;polite&quot;&gt;&lt;p class=&quot;mut&quot;&gt;Select a stakeholder.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slides 13 (the eight stakeholders) and 14 (questions and indicators).&lt;/p&gt;
 &lt;div class=&quot;card&quot; style=&quot;margin-top:1em&quot;&gt;&lt;h4&gt;The intermediaries&lt;/h4&gt;&lt;p&gt;Analysts, journalists, &lt;em class=&quot;t&quot;&gt;rating agencies&lt;/em&gt; (which assess creditworthiness) and regulators sit in between: &lt;b&gt;they process the information on behalf of others&lt;/b&gt;. They are not end users, but they are often the most attentive readers.&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;warn&quot;&gt;For the public and the community (employment, environment, health and safety) financial statements &lt;b&gt;do not yet provide adequate answers&lt;/b&gt;: this is the domain of &lt;em class=&quot;t&quot;&gt;sustainability reporting&lt;/em&gt; (see “Further reading”).&lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;A supplier and a bank read the same balance sheet: which line does each look at first? (question 2 on slide 18)&lt;/summary&gt;&lt;div&gt;The &lt;b&gt;supplier&lt;/b&gt; looks at short-term liquidity, i.e. current assets against current liabilities (will I be paid?). The &lt;b&gt;lender&lt;/b&gt; looks at overall indebtedness and the structure of liabilities: debt/equity, long-term debt, and then, in the income statement and cash flow statement, the ability to generate cash to pay interest and repayments.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What are the covenants that lenders worry about?&lt;/summary&gt;&lt;div&gt;Clauses in the loan agreement that impose limits measured on financial statement figures, for example a maximum debt/equity ratio. If they are breached, the bank can demand early repayment. The financial statements thus also become a contractual instrument.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;ass&quot; data-c=&quot;brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Objective and underlying assumptions&lt;/small&gt;Why we report, and on what assumptions&lt;/h2&gt;
 &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective of financial reporting&lt;/b&gt;&lt;br&gt;To communicate economic measurements of, and information about, the resources and performance of the &lt;em class=&quot;t&quot;&gt;reporting entity&lt;/em&gt;, useful to those having reasonable rights to such information. Users must be able to &lt;b&gt;make decisions&lt;/b&gt; and to &lt;b&gt;hold management to account&lt;/b&gt; for its stewardship (&lt;em class=&quot;t&quot;&gt;accountability&lt;/em&gt;).&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 15. For a comparison with the IASB definition see “Further reading” (Conceptual Framework, The Corporate Report).&lt;/p&gt;

 &lt;div class=&quot;tabs&quot; id=&quot;assTabs&quot;&gt;
  &lt;div role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;gc&quot;&gt;Going concern&lt;/button&gt;&lt;button class=&quot;btn&quot; role=&quot;tab&quot; data-p=&quot;acc&quot;&gt;Accrual basis&lt;/button&gt;&lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;gc&quot;&gt;
   &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Going concern&lt;/em&gt;: the entity is assumed to continue in operation for the foreseeable future, i.e. &lt;b&gt;at least twelve months&lt;/b&gt;. Consequence: assets are measured on the basis of their &lt;b&gt;use&lt;/b&gt;, not of a forced sale. If the assumption fails, everything is remeasured at &lt;b&gt;liquidation values&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;p&gt;&lt;button class=&quot;btn on&quot; id=&quot;gcOn&quot;&gt;Going concern holds&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;gcOff&quot;&gt;Going concern fails&lt;/button&gt;&lt;/p&gt;
    &lt;svg viewBox=&quot;0 0 600 200&quot; id=&quot;gcSvg&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;gcMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;ours&quot;&gt;our example&lt;/span&gt; Carrying amounts from slide 17; the liquidation values are invented to illustrate the idea.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div role=&quot;tabpanel&quot; id=&quot;acc&quot; hidden&gt;
   &lt;p&gt;&lt;em class=&quot;t&quot;&gt;Accrual basis&lt;/em&gt;: the effects of transactions are recognised &lt;b&gt;when they occur&lt;/b&gt;, in the period to which they relate, not when cash moves. Consequences: &lt;i&gt;receivables&lt;/i&gt;, &lt;i&gt;payables&lt;/i&gt;, &lt;i&gt;prepayments&lt;/i&gt;, &lt;i&gt;accruals&lt;/i&gt;, &lt;i&gt;depreciation&lt;/i&gt;. &lt;b&gt;Cash is not profit&lt;/b&gt;.&lt;/p&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;p&gt;December: the business invoices 500 of advertising, which the customer will pay in January, and pays 1,200 in advance for 12 months of hosting, December to November. &lt;span class=&quot;ours&quot;&gt;our example&lt;/span&gt;&lt;/p&gt;
    &lt;p&gt;&lt;button class=&quot;btn&quot; id=&quot;accCash&quot;&gt;Cash basis&lt;/button&gt; &lt;button class=&quot;btn on&quot; id=&quot;accAcc&quot;&gt;Accrual basis&lt;/button&gt;&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;accTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;p id=&quot;accMsg&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;p class=&quot;mut&quot;&gt;The Bergamo Bikes case (homework, exercise 7) is built entirely on this second assumption.&lt;/p&gt;
  &lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;What changes in the balance sheet if the going concern assumption fails? (question 3 on slide 18)&lt;/summary&gt;&lt;div&gt;Assets are no longer measured on the basis of use but at liquidation value, usually lower. The current/fixed distinction loses its meaning, because everything has to be realised in the short term, and new liabilities may arise (penalties, closure costs). Equity falls accordingly.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;A business reports a profit of 400, yet its current account falls by 800 over the same period. Is this possible?&lt;/summary&gt;&lt;div&gt;Yes: cash is not profit. For example, it sold on credit (revenue without cash received), bought equipment (cash outflow with no immediate expense) or repaid a loan. The accrual basis separates the result from cash movements.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;comp&quot; data-c=&quot;brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;The components of the financial statements&lt;/small&gt;IFRS and the Italian Civil Code compared&lt;/h2&gt;
 &lt;p&gt;&lt;em class=&quot;t&quot;&gt;IFRS&lt;/em&gt; (International Financial Reporting Standards, issued by the IASB) and the Italian Civil Code use different names for almost identical components.&lt;/p&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;IFRS (IAS 1 / IFRS 18)&lt;/th&gt;&lt;th&gt;Civil Code (art. 2423)&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Statement of financial position (balance sheet)&lt;/td&gt;&lt;td&gt;Stato patrimoniale (balance sheet)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Statement of profit or loss and other comprehensive income&lt;/td&gt;&lt;td&gt;Conto economico (income statement)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Statement of changes in equity&lt;/td&gt;&lt;td&gt;— (information given in the notes)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Statement of cash flows&lt;/td&gt;&lt;td&gt;Rendiconto finanziario (since 2016; not for small and micro entities)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Notes&lt;/td&gt;&lt;td&gt;Nota integrativa (notes)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;i&gt;Outside the statements:&lt;/i&gt; management commentary (not required by IFRS)&lt;/td&gt;&lt;td&gt;&lt;i&gt;Outside the statements:&lt;/i&gt; relazione sulla gestione, the directors&#x27; report (mandatory, art. 2428)&lt;/td&gt;&lt;/tr&gt;
 &lt;/table&gt;&lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 16. Highlighted rows are those where the two frameworks differ.&lt;/p&gt;
 &lt;details&gt;&lt;summary&gt;What is “other comprehensive income”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;em class=&quot;t&quot;&gt;OCI&lt;/em&gt; collects gains and losses that IFRS do not route through profit or loss, for example certain property revaluations or exchange differences on translating foreign operations. Profit or loss + OCI = total comprehensive income. The Civil Code has no equivalent in the income statement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;Why “IAS 1 / IFRS 18”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; replaces IAS 1 for annual periods beginning on or after 1 January 2027 (early application permitted). It introduces operating, investing and financing categories in the income statement with two new subtotals, and disclosures on &lt;i&gt;management-defined performance measures&lt;/i&gt;. The list of components of the financial statements remains substantially the same. &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2024/primary-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, Primary Financial Statements project&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Common mistake.&lt;/b&gt; The directors&#x27; report (relazione sulla gestione) &lt;b&gt;accompanies&lt;/b&gt; the financial statements but &lt;b&gt;is not part of them&lt;/b&gt;: it has different rules, different responsibilities and a different auditor&#x27;s opinion.&lt;/div&gt;
 &lt;p class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Note: companies preparing abridged financial statements (art. 2435-bis) and micro-enterprises (art. 2435-ter) may omit the directors&#x27; report if they disclose in the notes the information on treasury shares and shares of the parent company. This is according to a professional handbook (&lt;a href=&quot;https://www.studiopizzano.it/relazione-sulla-gestione-art-2428-c-c-prontuario-bilancio/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;studiopizzano.it&lt;/a&gt;); check against the law currently in force.&lt;/p&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Which IFRS statement has no stand-alone equivalent in Civil Code financial statements?&lt;/summary&gt;&lt;div&gt;The statement of changes in equity: under the Civil Code, changes in equity are explained in the notes.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Must a small srl (limited liability company) preparing abridged financial statements present a statement of cash flows?&lt;/summary&gt;&lt;div&gt;No: small and micro entities are exempt. It has been mandatory for financial years beginning from 2016, following Legislative Decree 139/2015.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 10 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;prev&quot; data-c=&quot;ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Preview: from the trial balance to the statements&lt;/small&gt;The website business at 31 December&lt;/h2&gt;
 &lt;p&gt;What Monday&#x27;s lecture will build, in four steps.&lt;/p&gt;
 &lt;div class=&quot;stepper&quot; id=&quot;st2&quot;&gt;
  &lt;div class=&quot;step cur&quot;&gt;&lt;h4&gt;1 · Split the balances of the cumulative trial balance&lt;/h4&gt;
   &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Splitting the accounts&quot;&gt;
    &lt;g class=&quot;n-ocra&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;170&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;110&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Trial balance&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;18 accounts · 3,780 = 3,780&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M212 70C300 70 300 55 380 55&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M212 140C300 140 300 155 380 155&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;390&quot; y=&quot;20&quot; width=&quot;360&quot; height=&quot;72&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Balance sheet&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;assets, liabilities, equity: carried forward to next year&lt;/text&gt;
    &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;390&quot; y=&quot;118&quot; width=&quot;360&quot; height=&quot;72&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;570&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;revenue, COGS, expenses: reset to zero each year&lt;/text&gt;
   &lt;/svg&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Income statement (Nov–Dec)&lt;/h4&gt;
   &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(500)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Phone Service&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(150)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Website Hosting&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(120)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Electric Service&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Subscriptions&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(65)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Meals&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(45)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Credit Card Fees &amp;amp; Interest&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Repairs &amp;amp; Maint. 25 · Fuel 25 · Bank Charges 25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(660)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
   &lt;p class=&quot;mut&quot; style=&quot;font-size:.92rem&quot;&gt;On the slide, hosting appears among the other expenses. Presenting it as cost of goods sold (section 2) would give a gross profit of 500 − 120 = 380, before operating expenses of 1,040. The bottom line does not change. &lt;span class=&quot;ours&quot;&gt;our calculation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Balance sheet at 31 December&lt;/h4&gt;
   &lt;div class=&quot;grid2&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;225&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Furniture&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;945&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
   &lt;table&gt;&lt;tr&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;680&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Owners&#x27; Equity (1,500 + 1,100)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,600&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(660)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total liabilities + equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · The closing rule&lt;/h4&gt;
   &lt;svg viewBox=&quot;0 0 760 160&quot; role=&quot;img&quot; aria-label=&quot;The result is transferred to equity&quot;&gt;
    &lt;g class=&quot;n-brick&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;125&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;net loss (660)&lt;/text&gt;
    &lt;path class=&quot;lnI&quot; d=&quot;M244 80H500&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;372&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;the net result is transferred to equity&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;income statement accounts restart from zero&lt;/text&gt;
    &lt;g class=&quot;n-slate&quot;&gt;&lt;rect x=&quot;510&quot; y=&quot;40&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;630&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;2,600 − 660 = 1,940&lt;/text&gt;
   &lt;/svg&gt;
   &lt;p&gt;&lt;b&gt;Balance sheet accounts are carried forward to the next financial year; income statement accounts are reset to zero each year and their net result is closed to equity.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ctl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;cnt mut&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next ›&lt;/button&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;p class=&quot;src&quot;&gt;Source: slide 17. The calculation 2,600 − 660 = 1,940 is ours: check that 680 + 1,940 = 2,620.&lt;/p&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Bank Charges is 25 in the income statement: where does that come from?&lt;/summary&gt;&lt;div&gt;10 in November + 15 in December. The income statement covers both months, so it uses the balances of the cumulative trial balance.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Why does the balance sheet balance only after the net loss is included?&lt;/summary&gt;&lt;div&gt;Because without the result the income statement accounts are missing: assets of 2,620 against liabilities + contributed capital of 3,280. The difference, −660, is exactly the loss, which reduces equity.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 11 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fine&quot; data-c=&quot;sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;num&quot;&gt;11&lt;/div&gt;
 &lt;h2&gt;&lt;small&gt;Before you go&lt;/small&gt;Homework and three questions&lt;/h2&gt;
 &lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Homework set 1, due Monday 28&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Exercise 1: Table 1, use / source and journal&lt;/li&gt;&lt;li&gt;Exercise 2: Table 2, transactions “on account” (on credit) and compound entries&lt;/li&gt;&lt;li&gt;Exercise 3: December T-accounts&lt;/li&gt;&lt;li&gt;Exercise 4: trial balance, December and cumulative&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;mut&quot;&gt;File “Homework – double-entry exercises” on Moodle. The solutions are at the end: try on your own first.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Monday 28 September&lt;/h4&gt;&lt;p&gt;Debriefing of set 1, then balance sheet and income statement: definitions, formats, the move from the trial balance to the statements, and the &lt;em class=&quot;t&quot;&gt;year-end adjustments&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Could you answer in three lines?&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;1. Why does the trial balance agree even when a transaction is missing?&lt;/summary&gt;&lt;div&gt;Because every entry has debits = credits: omitting it lowers both totals by the same amount. The trial balance checks arithmetic, not completeness (section 5).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;2. A supplier and a lender read the same balance sheet: which line does each look at first?&lt;/summary&gt;&lt;div&gt;The supplier looks at short-term liquidity (current assets against current liabilities); the lender looks at indebtedness and the ability to generate cash (debt/equity, long-term debt). See section 7.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;3. What changes in the balance sheet if the going concern assumption fails?&lt;/summary&gt;&lt;div&gt;Measurement on the basis of use is abandoned and everything is remeasured at liquidation values; the current/fixed distinction loses its meaning. See section 8.&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approf&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;

 &lt;h2&gt;&lt;small&gt;Further reading&lt;/small&gt;Laws, standards and texts cited&lt;/h2&gt;
 &lt;p&gt;Every item is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;, found through a web search: none of it comes from the slides. The slides cite the rules; the descriptions and links have been added here.&lt;/p&gt;
 &lt;ol class=&quot;ref&quot;&gt;
  &lt;li&gt;&lt;b&gt;IAS 1 – Presentation of Financial Statements&lt;/b&gt; (IASB). The standard that has so far defined the components of IFRS financial statements (slide 16) and the going concern and accrual basis assumptions (slide 15). It requires management to assess going concern for &lt;b&gt;at least&lt;/b&gt; twelve months from the reporting date: this is a minimum, not a cap. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 1&lt;/a&gt; · IFRS Foundation educational material on going concern, cited by &lt;a href=&quot;https://icaew.com/insights/viewpoints-on-the-news/2021/feb-2021/202021-reporting-season-ifrs-foundation-releases-going-concern-guidance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW (2021)&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it is the regulatory basis of slides 15–16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;IFRS 18 – Presentation and Disclosure in Financial Statements&lt;/b&gt; (IASB, 2024). It replaces IAS 1 from 1 January 2027, with retrospective application: entities with a December year-end must restate 2026 as the comparative period. It introduces operating/investing/financing categories in the income statement and disclosures on management-defined performance measures. &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2024/primary-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – Primary Financial Statements&lt;/a&gt; · summary by &lt;a href=&quot;https://www.bdo.co.uk/en-gb/services/audit-assurance/ifrs/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; the 2026-27 academic year falls right in the transition.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Italian Civil Code, art. 2423 – Preparation of the financial statements.&lt;/b&gt; It lists the components of the annual financial statements: balance sheet (stato patrimoniale), income statement (conto economico), statement of cash flows (rendiconto finanziario) and notes (nota integrativa). The statement of cash flows was added by &lt;b&gt;Legislative Decree no. 139 of 18 August 2015&lt;/b&gt;, for financial years from 1 January 2016, which also introduced the materiality principle (paragraph 4). Small and micro entities (arts. 2435-bis and 2435-ter) are exempt. &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2423.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi – art. 2423&lt;/a&gt; · &lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Legislative Decree 139/2015&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it is the right-hand column of slide 16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Italian Civil Code, art. 2428 – Directors&#x27; report.&lt;/b&gt; The directors analyse the position, performance and results of operations and the main risks and uncertainties, using financial and, where relevant, non-financial indicators. Paragraph 3 lists information that is always required (research and development, relations with subsidiaries, treasury shares). &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2428.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi – art. 2428&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it is slide 16&#x27;s example of a document that accompanies the financial statements without being part of them.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;IFRS Practice Statement 1 – Management Commentary&lt;/b&gt; (IASB, 2010; revised 23 June 2025). It is &lt;b&gt;non-mandatory&lt;/b&gt; guidance for management&#x27;s narrative report: applying it is not required to state compliance with IFRS. The 2025 revision focuses on investors&#x27; information needs and links financial and sustainability factors. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/management-commentary-practice-statement-1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – Practice Statement 1&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it explains the note “not required by IFRS” on slide 16.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Conceptual Framework for Financial Reporting&lt;/b&gt; (IASB, 2018). It is not a standard, but it sets the objective of general purpose financial reporting: to provide information useful to existing and potential investors, lenders and other creditors in deciding whether to provide resources to the entity. In 2018 it reintroduced &lt;b&gt;stewardship&lt;/b&gt; (the assessment of management&#x27;s performance). &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – Conceptual Framework&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; compare it with the objective on slide 15, which is broader in terms of addressees (“those having reasonable rights”).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;The Corporate Report&lt;/b&gt; (Accounting Standards Steering Committee, United Kingdom, 1975). A discussion paper that classified the users of financial statements and their information needs (section 2) and defined the objective of corporate reports (section 3). The wording on slide 15 (“those having reasonable rights to such information”) echoes this text; it was not possible to verify the quotation word for word. &lt;a href=&quot;https://www.icaew.com/Library/subject-gateways/corporate-reporting/the-corporate-report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library – The Corporate Report&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it is the origin of the “stakeholder” view in slides 13–14.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Sustainability reporting: CSRD and ESRS.&lt;/b&gt; Slide 14 refers to sustainability reporting for the questions of the public and the community. In the EU the reference point is Directive (EU) 2022/2464 (&lt;i&gt;Corporate Sustainability Reporting Directive&lt;/i&gt;), which replaces the Non-Financial Reporting Directive 2014/95/EU, together with the &lt;i&gt;European Sustainability Reporting Standards&lt;/i&gt; adopted by the Commission on 31 July 2023 on the basis of EFRAG&#x27;s technical advice. &lt;a href=&quot;https://www.iasplus.com/en-ca/standards/sustainability-1/european-sustainability-reporting-standards-esrs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – ESRS&lt;/a&gt;. &lt;i&gt;Why it matters:&lt;/i&gt; it is in the name of the degree programme (Accounting, Governance &lt;b&gt;and Sustainability&lt;/b&gt;). Note: the timetable and scope of the CSRD have been amended several times since 2023, so check the version in force.&lt;/li&gt;
 &lt;/ol&gt;
 &lt;p class=&quot;mut&quot; style=&quot;font-size:.9rem&quot;&gt;The “Quick check” on slide 7 carries the numbering “4-7”, typical of an American principles of accounting textbook: the slide does not say which one, and we have not looked it up here.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
