&lt;!-- ============ PARTE I ============ --&gt;
&lt;div class=&quot;part p-ochre&quot; id=&quot;parte1&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;I&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Part I&lt;/p&gt;&lt;h2&gt;Why and where accounting rules originate&lt;/h2&gt;&lt;p&gt;Slides 2–3&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s1&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt; The evolution of accounting &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 2&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;“Accounting develops where economies develop.”&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why?&lt;/strong&gt; “Because accounting follows economic developments and innovations.”&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;The lecture starts from a simple but crucial idea: accounting (&lt;em class=&quot;en&quot;&gt;accounting&lt;/em&gt;, i.e. the system that measures an entity&#x27;s economic events and communicates them to decision-makers) &lt;strong&gt;is not a set of abstract rules&lt;/strong&gt;. It is a technique that arises wherever there are exchanges, credit, investments and partners to whom an account must be rendered. When the economy changes — new contracts, new forms of business, new markets — the questions asked of the numbers change, and so do the rules for producing them.&lt;/p&gt;
    &lt;p&gt;Two consequences follow, and they underpin the whole lecture:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;accounting rules are constantly evolving&lt;/strong&gt;: they chase economic innovation (hence the continuous process of issuing and amending standards, section 8);&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;each country has developed its own accounting&lt;/strong&gt;, because each economy is different: hence the variety of rules worldwide (section 2) and the convergence effort (sections 5–6).&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;Accounting follows the economy: five stages &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;90&quot; y1=&quot;40&quot; x2=&quot;810&quot; y2=&quot;40&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;90&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;90&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;90&quot; y=&quot;88&quot;&gt;Merchants&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;270&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;270&quot; y=&quot;44&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;270&quot; y=&quot;88&quot;&gt;Industry&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;450&quot; y=&quot;44&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;450&quot; y=&quot;88&quot;&gt;Stock exchanges&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;630&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;630&quot; y=&quot;44&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;630&quot; y=&quot;88&quot;&gt;Single market&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;810&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;810&quot; y=&quot;44&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;810&quot; y=&quot;88&quot;&gt;Globalisation&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Italian merchants and double entry&lt;/h4&gt;&lt;p&gt;Long-distance trade, partnerships between merchants, credit: one needs to know who owes what to whom and how much each partner has earned. &lt;em class=&quot;en&quot;&gt;Double-entry bookkeeping&lt;/em&gt; is born (every transaction is recorded in two accounts, one on the debit side and one on the credit side, which balance each other).&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Luca Pacioli describes it in the &lt;em&gt;Summa de arithmetica&lt;/em&gt; (Venice, 1494), in the treatise &lt;em&gt;Particularis de computis et scripturis&lt;/em&gt;; he did not invent it, but codified “the method of Venice”, which had long been in use. &lt;a href=&quot;https://www.icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library — Earliest books on bookkeeping&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · The Industrial Revolution&lt;/h4&gt;&lt;p&gt;Businesses invest in plant that lasts many years. It becomes necessary to distinguish &lt;em&gt;capital&lt;/em&gt; from &lt;em&gt;income&lt;/em&gt; and to allocate the cost of long-lived assets over several financial years: this is the idea of &lt;em class=&quot;en&quot;&gt;depreciation&lt;/em&gt; and of the &lt;em class=&quot;en&quot;&gt;accrual&lt;/em&gt; principle (see section 2).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Joint-stock companies and stock exchanges&lt;/h4&gt;&lt;p&gt;Ownership (dispersed shareholders) separates from control (managers). External investors need reliable and comparable financial statements: market disclosure emerges, with external audit and supervisory authorities. In the United States, after the 1929 crash, the SEC (1934) entrusts private bodies with writing accounting principles: this is the origin of US GAAP.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · The European single market&lt;/h4&gt;&lt;p&gt;If goods and capital move across countries, companies&#x27; financial statements must be at least partly comparable. The European Community harmonises the rules through the accounting directives (1978, 1983): section 6.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Global capital markets&lt;/h4&gt;&lt;p&gt;Large companies list and raise funds in several countries. A group listed in Milan and New York cannot prepare two sets of financial statements under different rules: a common accounting language is needed. This is the driver behind IAS/IFRS and convergence (sections 5–7).&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Why national accounting systems differ &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;The slides take it for granted, but it is the key to the next section: if accounting “follows” the economy, countries with differently organised economies produce different rules. The classic factors are:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Who finances companies&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Where &lt;strong&gt;banks&lt;/strong&gt; dominate (the Italian and German tradition), financial statements mainly protect creditors: prudence, historical values, little volatility. Where the &lt;strong&gt;stock market&lt;/strong&gt; dominates (USA, United Kingdom), financial statements help investors estimate future cash flows: more disclosure, current values (&lt;em class=&quot;en&quot;&gt;fair value&lt;/em&gt;, the price at which an asset would be sold today between independent parties).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;The legal system&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In &lt;em class=&quot;en&quot;&gt;civil law&lt;/em&gt; countries (Italy, France, Germany) accounting rules are laid down in codes and statutes. In &lt;em class=&quot;en&quot;&gt;common law&lt;/em&gt; countries (USA, United Kingdom) they are written mainly by private professional bodies, the &lt;em class=&quot;en&quot;&gt;standard setters&lt;/em&gt; (bodies that issue accounting standards).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;The link with taxation&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Where taxable income is derived from accounting profit (as in Italy, under the derivation principle), accounting choices have tax effects and financial statements tend to be prepared “with an eye on” the tax authorities. Where the two are separate, financial statements can focus on investors.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Culture and the profession&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The weight of the accounting profession, the academic tradition (in Italy, &lt;em&gt;economia aziendale&lt;/em&gt;) and the inclination towards prudence or transparency shape how items are measured and presented.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s2&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt; Accounting around the world &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 3&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Slide 3 asks: &lt;em&gt;what are the main regulatory frameworks worldwide?&lt;/em&gt; It lists five. Note that they are not five “competitors” of the same kind. Some are &lt;strong&gt;sets of standards&lt;/strong&gt; written by standard setters, others are &lt;strong&gt;legislative acts&lt;/strong&gt;, and the last is a &lt;strong&gt;recognition basis&lt;/strong&gt;. Open the tabs.&lt;/p&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;The five regulatory frameworks&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;IAS / IFRS&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;US GAAP&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Dir. 2013/34/EU&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;National laws&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Cash basis&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;strong&gt;IAS&lt;/strong&gt; = &lt;em class=&quot;en&quot;&gt;International Accounting Standards&lt;/em&gt;, issued by the IASC (&lt;em class=&quot;en&quot;&gt;International Accounting Standards Committee&lt;/em&gt;) until 2001. &lt;strong&gt;IFRS&lt;/strong&gt; = &lt;em class=&quot;en&quot;&gt;International Financial Reporting Standards&lt;/em&gt;, issued since 2001 by the IASB (&lt;em class=&quot;en&quot;&gt;International Accounting Standards Board&lt;/em&gt;), which inherited the IAS still in force and keeps them in effect.&lt;/p&gt;
        &lt;p&gt;They are written by a private body based in London, overseen by the IFRS Foundation. They become mandatory only when a jurisdiction adopts them: in the EU, through Regulation 1606/2002 (section 6). They are regarded as &lt;em class=&quot;en&quot;&gt;principles-based&lt;/em&gt;: they set general principles and require professional judgement. They are the core of the course: architecture in section 7.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;US GAAP&lt;/strong&gt; = the United States&#x27; &lt;em class=&quot;en&quot;&gt;Generally Accepted Accounting Principles&lt;/em&gt;. They are issued by the FASB (&lt;em class=&quot;en&quot;&gt;Financial Accounting Standards Board&lt;/em&gt;), a private body recognised by the SEC (the US securities market regulator). They are traditionally more detailed, with many rules for specific cases (&lt;em class=&quot;en&quot;&gt;rules-based&lt;/em&gt;).&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Since 1 July 2009 the &lt;em&gt;FASB Accounting Standards Codification&lt;/em&gt; (ASC) has been the single authoritative source of non-governmental US GAAP: it replaced the old hierarchy of FASB, AICPA and EITF pronouncements. &lt;a href=&quot;https://dart.deloitte.com/USDART/home/accounting/archive-1/us-gaap/fasb-reports-news-items/2009/fasb-accounting-standards-codification-launches-today&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte DART — FASB Codification launches&lt;/a&gt;&lt;/p&gt;
        &lt;p&gt;IAS/IFRS and US GAAP are the &lt;strong&gt;two poles&lt;/strong&gt; of global accounting: their convergence is the subject of section 5.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;Directive 2013/34/EU&lt;/strong&gt; is the European legislative act on the annual and consolidated financial statements of limited liability companies. It is not a complete set of standards: it lays down formats, basic measurement bases, the minimum content of the notes, and different rules according to company size (micro, small, medium-sized, large). It replaced the Fourth and Seventh Directives (section 6).&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Published in the Official Journal of the EU on 29 June 2013, to be transposed by 20 July 2015. The financial statements form a single whole comprising at least the balance sheet, the profit and loss account and the notes, and must give a &lt;em class=&quot;en&quot;&gt;true and fair view&lt;/em&gt; of assets, liabilities, financial position and profit or loss. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Directive 2013/34/EU&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;A directive does not apply on its own: each Member State turns it into a &lt;strong&gt;national implementing law&lt;/strong&gt;, choosing among the options left open. That is why the slide lists national laws as a separate item: in Europe, the rule that actually applies to an unlisted company is the law of its own country.&lt;/p&gt;
        &lt;p&gt;Examples: in Italy the Civil Code (Arts. 2423 et seq.) as amended by Legislative Decree 139/2015 (section 4); in Germany the &lt;em&gt;Handelsgesetzbuch&lt;/em&gt;; in France the &lt;em&gt;Code de commerce&lt;/em&gt; together with the &lt;em&gt;Plan comptable général&lt;/em&gt;. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;Cash basis&lt;/strong&gt;: revenue is recorded when cash is received and an expense when cash is paid. It is simple and objective, but it does not measure the result for the period: a service rendered in December and collected in January ends up in the wrong year.&lt;/p&gt;
        &lt;p&gt;Its opposite is the &lt;strong&gt;accrual basis&lt;/strong&gt;: income and expenses are recognised in the financial year in which the economic event occurs, regardless of when cash is received or paid. It is the basis used by IFRS, US GAAP and the Italian Civil Code (Art. 2423-bis(1)(3)). The cash basis survives in simple settings: very small businesses, some non-profit entities, parts of the public sector, simplified tax accounting. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Try out the difference with the chart below.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table class=&quot;cmp&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Who produces it&lt;/th&gt;&lt;th&gt;Nature&lt;/th&gt;&lt;th&gt;Who it applies to&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;IAS / IFRS&lt;/th&gt;&lt;td&gt;IASB (private, London)&lt;/td&gt;&lt;td&gt;Accounting standards&lt;/td&gt;&lt;td&gt;Wherever a jurisdiction adopts them (in the EU: consolidated statements of listed companies and others)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;US GAAP&lt;/th&gt;&lt;td&gt;FASB, under the SEC&lt;/td&gt;&lt;td&gt;Accounting standards&lt;/td&gt;&lt;td&gt;US companies; companies listed in the USA&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Dir. 2013/34/EU&lt;/th&gt;&lt;td&gt;EU Parliament and Council&lt;/td&gt;&lt;td&gt;Legislative act (binding on Member States)&lt;/td&gt;&lt;td&gt;Member States, which must transpose it&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;National laws&lt;/th&gt;&lt;td&gt;National parliaments/governments&lt;/td&gt;&lt;td&gt;Laws&lt;/td&gt;&lt;td&gt;Companies of that country&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Cash basis&lt;/th&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Recognition basis&lt;/td&gt;&lt;td&gt;Small entities, non-profits, parts of the public sector&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;cashw&quot;&gt;
      &lt;h4&gt;Cash basis versus accrual basis: move the sliders&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.92rem;color:var(--soft)&quot;&gt;A company signs a 12-month service contract worth €12,000 (€1,000 of service per month). The customer pays the full amount in a single instalment.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-start&quot;&gt;Month in which the service starts in 2026: &lt;output id=&quot;o-start&quot;&gt;October&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-start&quot; min=&quot;1&quot; max=&quot;12&quot; value=&quot;10&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-delay&quot;&gt;Months between the start of the service and payment: &lt;output id=&quot;o-delay&quot;&gt;0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-delay&quot; min=&quot;0&quot; max=&quot;18&quot; value=&quot;0&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;cash-chart&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Revenue per year under the cash basis and the accrual basis&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;cash-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part I&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. According to slide 2, why does accounting develop where economies develop?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Because governments impose accounting only on wealthy countries.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Because it follows economic developments and innovations: new economic events require new ways of measuring them.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Because double entry only works with large trading volumes.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Accounting responds to economic needs: when new contracts, businesses and markets emerge, so do the rules for representing them.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. A service is rendered entirely in December 2026 and collected in February 2027. Under the accrual basis, the revenue belongs to…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;2026&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;2027&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;half to 2026 and half to 2027&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The accrual basis looks at when the economic event occurs (the service rendered), not at when the cash comes in. Under the cash basis, by contrast, it would fall in 2027.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Among the items on slide 3, which one is a legislative act rather than a set of standards issued by a standard setter?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;IAS/IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;US GAAP&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Directive 2013/34/EU&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The directive is adopted by the EU Parliament and Council and is binding on Member States. The IASB and FASB, by contrast, are private bodies.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Open question: why does slide 3 list “European Directive 34/2013” and “National application laws” separately? &lt;span&gt;Show answer&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because a directive does not apply directly to companies: each Member State transposes it through its own law, choosing among the options. For an unlisted European company, the rule that actually applies is therefore national law (in Italy, the Civil Code), which may differ from country to country within the same European framework.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE II ============ --&gt;
&lt;div class=&quot;part p-slate&quot; id=&quot;parte2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;II&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Part II&lt;/p&gt;&lt;h2&gt;The sources of accounting law: European Union and Italy&lt;/h2&gt;&lt;p&gt;Slides 4–7&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s3&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt; European legislation &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 4–5&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;To understand how IAS/IFRS and the accounting directive reach an Italian company, one needs to know the instruments through which the EU legislates. Slide 4 lists three: &lt;strong&gt;Regulations&lt;/strong&gt;, &lt;strong&gt;Directives&lt;/strong&gt; and &lt;strong&gt;Recommendations&lt;/strong&gt;, the latter being &lt;em class=&quot;en&quot;&gt;non-binding acts&lt;/em&gt;.&lt;/p&gt;

    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;eu-t&quot;&gt;
        &lt;title id=&quot;eu-t&quot;&gt;How regulations, directives and recommendations reach the Member States&lt;/title&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path class=&quot;arrowhead&quot; d=&quot;M0 0L10 5L0 10z&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;28&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Regulation&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;directly applicable&lt;/text&gt;
          &lt;path class=&quot;ln&quot; d=&quot;M195 56L428 25M195 56H428M195 56L428 87&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;12&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;30&quot; font-size=&quot;13&quot;&gt;State 1 — same text, from day t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;43&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;61&quot; font-size=&quot;13&quot;&gt;State 2 — same text, from day t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;74&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;92&quot; font-size=&quot;13&quot;&gt;State 3 — same text, from day t&lt;/text&gt;
        &lt;/g&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;138&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Directive&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;binding as to the result&lt;/text&gt;
          &lt;path class=&quot;ln&quot; d=&quot;M195 166L428 135M195 166H428M195 166L428 197&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;g class=&quot;cfill&quot;&gt;&lt;circle cx=&quot;312&quot; cy=&quot;150.5&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;312&quot; cy=&quot;166&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;312&quot; cy=&quot;181.5&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
          &lt;text x=&quot;312&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;soft&quot;&gt;national law&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;122&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;140&quot; font-size=&quot;13&quot;&gt;State 1 — option A, from day t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;153&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;171&quot; font-size=&quot;13&quot;&gt;State 2 — option B, from day t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;184&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;202&quot; font-size=&quot;13&quot;&gt;State 3 — option A, one year later&lt;/text&gt;
        &lt;/g&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;248&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;stroke-dasharray:5 4&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Recommendation&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;non-binding&lt;/text&gt;
          &lt;path class=&quot;ln dash&quot; d=&quot;M195 276H428&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;263&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;281&quot; font-size=&quot;13&quot;&gt;States or EU bodies — invitation to act&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;Illustrative diagram: with a regulation the text is identical everywhere and at the same time; with a directive each State goes through its own law, with different options and dates; a recommendation provides guidance without imposing obligations.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;EU instruments&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Regulation&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Directive&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Recommendation&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;sl. 5&lt;/span&gt; “EU Regulations are applied within all countries and in the same way; simultaneously.”&lt;/p&gt;
        &lt;p&gt;A regulation is binding in its entirety and &lt;strong&gt;directly applicable&lt;/strong&gt;: no national law is needed. The result: complete uniformity, same date for everyone. Key accounting example: &lt;strong&gt;Regulation (EC) 1606/2002&lt;/strong&gt;, which imposes IAS/IFRS, and the subsequent regulations through which the Commission endorses each new standard.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;sl. 5&lt;/span&gt; Directives “must be adopted by each country through a national law, which should allow for a certain degree of freedom within a framework defined by the European directives. This means that perfect comparability between countries does not exist and that the adoption date may vary.”&lt;/p&gt;
        &lt;p&gt;A directive is binding on the State as to the &lt;strong&gt;result&lt;/strong&gt; to be achieved, leaving it the choice of form and methods. The accounting directives contain many &lt;em class=&quot;en&quot;&gt;Member State options&lt;/em&gt;: for example, exempting small companies from certain requirements. The slide stresses two consequences: &lt;strong&gt;no perfect comparability&lt;/strong&gt; and &lt;strong&gt;different adoption dates&lt;/strong&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;sl. 5&lt;/span&gt; Recommendations “may be addressed to the individual member states or to European bodies to encourage legislation and action on specific issues.”&lt;/p&gt;
        &lt;p&gt;They are not binding, but they provide direction. Accounting example &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;: Commission Recommendation 2003/361/EC on the definition of micro, small and medium-sized enterprises, used as a reference in many pieces of legislation.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table class=&quot;cmp&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Binding?&lt;/th&gt;&lt;th&gt;National law required?&lt;/th&gt;&lt;th&gt;Uniformity across countries&lt;/th&gt;&lt;th&gt;Date of application&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Regulation&lt;/th&gt;&lt;td&gt;Yes, in its entirety&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;Complete&lt;/td&gt;&lt;td&gt;Simultaneous&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Directive&lt;/th&gt;&lt;td&gt;Yes, as to the result&lt;/td&gt;&lt;td&gt;Yes (transposition)&lt;/td&gt;&lt;td&gt;Partial (options)&lt;/td&gt;&lt;td&gt;May vary&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Recommendation&lt;/th&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Key point&lt;/strong&gt;&lt;p&gt;The legal basis for these instruments is Article 288 of the Treaty on the Functioning of the European Union (TFEU), which also lists decisions and opinions, not mentioned in the slide. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s4&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt; Italian legislation &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 6–7&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;“In Italy, the transposition of EU Directives occurs through the adoption of Legislative Decrees (D.Lgs.).”&lt;/p&gt;
      &lt;p&gt;“In Italy, the EU Directive n. 34/2013 is included in the Civil Code.”&lt;/p&gt;
      &lt;p&gt;“EU Regulations are applicable immediately.”&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;A &lt;strong&gt;legislative decree&lt;/strong&gt; (D.Lgs.) is an act of the Government having the force of law, adopted under a delegation from Parliament: for directives, the delegation normally comes through the annual European delegation law. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt; The content of Directive 34/2013 is not contained in a separate statute but has been &lt;strong&gt;incorporated into the Civil Code&lt;/strong&gt;, in the provisions on financial statements (Arts. 2423 et seq.).&lt;/p&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;p&gt;Transposition took place through &lt;strong&gt;Legislative Decree no. 139 of 18 August 2015&lt;/strong&gt; (Official Gazette no. 205 of 4 September 2015), applicable to financial statements for financial years beginning on or after 1 January 2016. Among others, it amended Arts. 2423, 2423-bis, 2424, 2425, 2425-ter, 2426, 2427, 2435-bis and 2435-ter of the Civil Code, as well as Legislative Decree 127/1991 on consolidated financial statements. &lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Legislazione Tecnica — D.Lgs. 139/2015&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Two tracks for Italian financial statements&lt;/h3&gt;
    &lt;p&gt;Slide 7 shows the two routes of the Italian system: &lt;strong&gt;IAS/IFRS&lt;/strong&gt; “for listed companies and other companies” and &lt;strong&gt;Civil Code + OIC standards&lt;/strong&gt; “for non-listed companies with some exceptions”.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 370&quot; role=&quot;img&quot; aria-labelledby=&quot;it-t&quot;&gt;
        &lt;title id=&quot;it-t&quot;&gt;Two tracks: EU regulation and IAS/IFRS on one side, directive, Civil Code and OIC on the other&lt;/title&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path class=&quot;arrowhead&quot; d=&quot;M0 0L10 5L0 10z&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;190&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;IAS/IFRS track&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;National track&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;28&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Regulation (EC) 1606/2002&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;directly applicable&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;30&quot; y=&quot;114&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;D.Lgs. 38/2005&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;exercises the options in Art. 5 of the Regulation&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;30&quot; y=&quot;200&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;223&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;EU-endorsed IAS/IFRS&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;+ SIC/IFRIC interpretations&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;286&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Listed and other companies&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;banks, supervised intermediaries, insurers…&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M190 82V112M190 168V198M190 254V284&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;410&quot; y=&quot;28&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Directive 2013/34/EU&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;binding on the State&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;410&quot; y=&quot;114&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;D.Lgs. 139/2015&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;transposition&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;410&quot; y=&quot;200&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;223&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Civil Code Arts. 2423 et seq.&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;+ OIC accounting standards&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;410&quot; y=&quot;286&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Unlisted companies&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;with some exceptions&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M570 82V112M570 168V198M570 254V284&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;path class=&quot;lnc dash&quot; d=&quot;M410 300C385 300 375 240 352 232&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;282&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;soft&quot; font-style=&quot;italic&quot;&gt;option&lt;/text&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;The regulation enters the Italian legal system without transposition (D.Lgs. 38/2005 merely exercises the options the regulation leaves to Member States); the directive passes through a D.Lgs. that amends the Civil Code. The dashed arrow indicates that some unlisted companies may opt for IAS/IFRS.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;What is the OIC?&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;The &lt;strong&gt;Organismo Italiano di Contabilità&lt;/strong&gt; (Italian Accounting Standard Setter) is the national standard setter: it writes the OIC accounting standards (OIC 12 on formats, OIC 16 on property, plant and equipment, OIC 15 on receivables…), which interpret and supplement the provisions of the Civil Code.&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; A private-law foundation established on 27 November 2001; Law no. 116 of 11 August 2014 recognised it as the “national institute for accounting standards”. Its standards are approved after public consultation and after obtaining the opinion of, among others, the Italian Revenue Agency and the Bank of Italy. &lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;D.Lgs. 38/2005 and the options in the Regulation&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;Regulation 1606/2002 imposes IAS/IFRS only on the consolidated financial statements of listed companies, but Art. 5 allows Member States to extend them. Italy did so through D.Lgs. 38/2005.&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; The decree makes IAS/IFRS mandatory for, among others, listed companies, companies with financial instruments widely distributed among the public, banks, investment firms (SIM), asset management companies (SGR) and supervised financial institutions; for other unlisted entities it provides an option (Art. 2-bis). It also makes unrealised &lt;em&gt;fair value&lt;/em&gt; gains non-distributable. &lt;a href=&quot;https://www.fondazionenazionalecommercialisti.it/system/files/imce/aree-tematiche/pac/DOC_2005_23_Adozione%20IAS.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione Nazionale Commercialisti — paper on the adoption of IAS&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;treew&quot;&gt;
      &lt;h4&gt;Which standards does this company apply? Choose a case&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.9rem;color:var(--soft)&quot;&gt;Decision tree simplified for teaching purposes: the exact categories are in the current text of D.Lgs. 38/2005.&lt;/p&gt;
      &lt;div class=&quot;choices&quot; role=&quot;group&quot; aria-label=&quot;Type of company&quot;&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;quot&quot;&gt;Group listed on the stock exchange&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;banca&quot;&gt;Bank&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;grande&quot;&gt;Large unlisted S.p.A. (joint-stock company)&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;piccola&quot;&gt;Small S.r.l. (abridged financial statements)&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;micro&quot;&gt;Micro-entity&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;tree-out&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Select a type of company.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part II&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. “It applies in all Member States in the same way and at the same time.” Which instrument is this?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Regulation&lt;/button&gt;&lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Directive&lt;/button&gt;&lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Recommendation&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;A regulation is directly applicable and identical everywhere: it is the instrument chosen to impose IAS/IFRS (Reg. 1606/2002).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. According to slide 5, why does “perfect comparability between countries” not exist with directives?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Because directives are not binding.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Because each Member State transposes them through its own law, choosing among options and on different dates.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Because directives apply only to listed companies.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;A directive is binding as to the result but leaves room for discretion: two countries may choose different options.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. In Italy, Directive 2013/34/EU was transposed…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;by a directly applicable regulation&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;by a legislative decree that amended the Civil Code&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;by an OIC accounting standard&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The instrument is a D.Lgs. (no. 139/2015) and the content lives in the Civil Code; the OIC then interprets and supplements those provisions.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Open question: why can IAS/IFRS financial statements and OIC financial statements coexist in Italy? &lt;span&gt;Show answer&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they derive from two different EU instruments. Regulation 1606/2002 makes IAS/IFRS mandatory for the consolidated financial statements of listed companies and allows Member States to extend them (in Italy, through D.Lgs. 38/2005, to banks, supervised intermediaries and others). All other companies are governed by Directive 2013/34, transposed into the Civil Code and supplemented by the OIC standards. The result is a “two-track” system.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE III ============ --&gt;
&lt;div class=&quot;part p-sage&quot; id=&quot;parte3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;III&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Part III&lt;/p&gt;&lt;h2&gt;Convergence: towards a common accounting language&lt;/h2&gt;&lt;p&gt;Slides 8–9&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s5&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt; Worldwide convergence process &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 8&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;em class=&quot;en&quot;&gt;Convergence&lt;/em&gt; is the process by which different accounting systems are brought closer together until they produce comparable financial statements. It differs from &lt;em class=&quot;en&quot;&gt;adoption&lt;/em&gt;, in which a country takes over a set of standards as it is. Slide 8 lists the stages:&lt;/p&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;The Role of &lt;strong&gt;IOSCO&lt;/strong&gt; · Widespread adoption of IAS/IFRS (&lt;em&gt;isomorphism&lt;/em&gt;) · Convergence process with IASB – FASB 2002 – Norfolk Agreement · Participation in the revival of the project in 2006 · G20 Leaders Group – 2009 – support for the international convergence program · Slowdown of the project and widespread adoption after the crises&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Mind the name&lt;/strong&gt;&lt;p&gt;The slide says “Norfolk Agreement”, but the 2002 FASB–IASB agreement is known as the &lt;strong&gt;Norwalk Agreement&lt;/strong&gt;, after the Connecticut town (home of the FASB) where it was signed. See the external source below.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;Timeline of worldwide convergence&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;50&quot; y1=&quot;40&quot; x2=&quot;850&quot; y2=&quot;40&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;50&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;50&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;50&quot; y=&quot;85&quot;&gt;1973&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;150&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;150&quot; y=&quot;44&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;150&quot; y=&quot;85&quot;&gt;1983&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;250&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;250&quot; y=&quot;44&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;250&quot; y=&quot;85&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;350&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;350&quot; y=&quot;44&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;350&quot; y=&quot;85&quot;&gt;2001&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;450&quot; y=&quot;44&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;450&quot; y=&quot;85&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;5&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;550&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;550&quot; y=&quot;44&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;550&quot; y=&quot;85&quot;&gt;2006&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;6&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;650&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;650&quot; y=&quot;44&quot;&gt;7&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;650&quot; y=&quot;85&quot;&gt;2007&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;7&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;750&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;750&quot; y=&quot;44&quot;&gt;8&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;750&quot; y=&quot;85&quot;&gt;2009&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;8&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;850&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;850&quot; y=&quot;44&quot;&gt;9&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;850&quot; y=&quot;85&quot;&gt;from 2010&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1973 · The IASC is founded &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The professional accountancy bodies of several countries (including the USA, the United Kingdom, France, Germany and Japan) found the &lt;em class=&quot;en&quot;&gt;International Accounting Standards Committee&lt;/em&gt;, which issues the IAS. For years these are “weak” standards: full of alternatives and with no authority to enforce them.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;1983 · IOSCO is founded&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;en&quot;&gt;International Organization of Securities Commissions&lt;/em&gt; brings together securities market regulators (the US SEC, Italy&#x27;s CONSOB…). It is the body that can give standards teeth: it decides which financial statements to accept from companies seeking a listing.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Founded in 1983, with its General Secretariat in Madrid; ordinary members are the national securities regulators, with one vote each. &lt;a href=&quot;https://www.iosco.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iosco.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2000 · IOSCO endorses the IASC standards&lt;/h4&gt;&lt;p&gt;This is the “role of IOSCO” in the slide: after assessing the IASC&#x27;s &lt;em class=&quot;en&quot;&gt;core standards&lt;/em&gt;, IOSCO recommends that its members accept them for foreign companies seeking a listing. It is the first major international recognition of IAS.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Presidents Committee resolution of 17 May 2000: it covers the 30 “IASC 2000 standards” together with the related SIC interpretations; the endorsement is conditional, as each authority may require supplemental treatments such as reconciliations. &lt;a href=&quot;https://www.iosco.org/library/resolutions/pdf/IOSCORES19.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IOSCO — Resolution on IASC Standards (2000)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2001 · The IASB replaces the IASC&lt;/h4&gt;&lt;p&gt;The IASC is restructured: the IASB is created, an independent board of full-time experts under a foundation (today the IFRS Foundation). From 1 April 2001 the IASB adopts the existing IAS and SIC and has since issued IFRS. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2002 · Norwalk Agreement&lt;/h4&gt;&lt;p&gt;The FASB and IASB formally commit to making their standards compatible: this marks the start of the IASB–FASB convergence mentioned in the slide.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; Memorandum of Understanding signed after the joint meeting in Norwalk (Connecticut) on 18 September 2002: the two boards undertake to use their “best efforts” to make existing standards compatible and to coordinate future work, through short- and long-term projects. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — text of the Norwalk Agreement&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2006 · The project is revived&lt;/h4&gt;&lt;p&gt;The slide refers to the “revival of the project in 2006”: the two boards update their agreement with a &lt;em class=&quot;en&quot;&gt;roadmap&lt;/em&gt; of joint projects (updated again in 2008).&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; The February 2006 Memorandum of Understanding sets out the convergence projects to be completed; in 2008 the goal becomes completing the major joint projects by 2011. &lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) — IASB-FASB convergence&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2007 · The SEC opens up to IFRS &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The SEC removes the requirement to reconcile to US GAAP for foreign private issuers listed in the USA that prepare their financial statements under IFRS as issued by the IASB. US companies, however, continue to use US GAAP.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2009 · The G20&lt;/h4&gt;&lt;p&gt;After the financial crisis, G20 leaders support the convergence programme: a single set of high-quality global standards.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; At the Pittsburgh summit (September 2009) the G20 calls on the boards to redouble their efforts and complete convergence by June 2011; the IASB and FASB respond with monthly meetings from 2010. &lt;a href=&quot;https://www.iasplus.com/en/news/2009/September/news5386&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — G20 call for global standards by 2011&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;From 2010 · Slowdown and widespread adoption&lt;/h4&gt;&lt;p&gt;Full convergence with the USA slows down: some joint projects are completed (e.g. revenue, IFRS 15 / ASC 606), others end with different solutions (leases: IFRS 16 / ASC 842). &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt; Meanwhile, IFRS spread across much of the world: this is the slide&#x27;s “widespread adoption after the crises”.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; At the Toronto summit (June 2010) the G20 reaffirms the goal of a single set of standards, but the declaration no longer mentions the June 2011 deadline. &lt;a href=&quot;https://www.iasplus.com/en/news/2010/June/news5908&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — G20 reiterates support for global accounting standards&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Isomorphism: why everyone ends up adopting IFRS&lt;/h3&gt;
    &lt;p&gt;The slide links the widespread adoption of IAS/IFRS to the concept of &lt;em class=&quot;en&quot;&gt;isomorphism&lt;/em&gt;: the tendency of organisations operating in the same field to become similar to one another. The term comes from institutional theory (DiMaggio and Powell, 1983: see “Further reading”), which distinguishes three mechanisms. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Types of isomorphism&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Coercive&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Mimetic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Normative&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Coercive&lt;/strong&gt;: adoption because someone imposes it. Example: Regulation 1606/2002 makes it mandatory for European listed groups; bodies such as the World Bank and the IMF have pushed emerging economies towards IFRS as a condition for support and access to capital.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Mimetic&lt;/strong&gt;: under uncertainty, organisations copy those that appear successful. If the largest markets use IFRS, adopting them signals credibility to foreign investors, even without any obligation.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Normative&lt;/strong&gt;: the professions spread it. Large audit firms, universities, professional bodies and shared training make IFRS the “normal” language of accounting experts.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s6&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt; EU convergence process &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 9&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;In Europe convergence follows two tracks, which slide 9 lists one below the other: first &lt;strong&gt;harmonisation through directives&lt;/strong&gt;, then the &lt;strong&gt;IAS strategy&lt;/strong&gt;. Click the points on the timeline.&lt;/p&gt;

        &lt;title id=&quot;eutl-t&quot;&gt;Two-track timeline: accounting directives and the IAS strategy in the EU&lt;/title&gt;
        &lt;text x=&quot;40&quot; y=&quot;44&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Track 1 · Accounting directives&lt;/text&gt;
        &lt;text x=&quot;40&quot; y=&quot;154&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Track 2 · IAS strategy&lt;/text&gt;

        &lt;g class=&quot;tlp&quot; data-k=&quot;d83&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;80&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;1983&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tlp&quot; data-k=&quot;dmod&quot;&gt;&lt;circle cx=&quot;580&quot; cy=&quot;80&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;2001–06&lt;/text&gt;&lt;/g&gt;

        &lt;g class=&quot;tlp&quot; data-k=&quot;s95&quot;&gt;&lt;circle cx=&quot;460&quot; cy=&quot;190&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;1995&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tlp&quot; data-k=&quot;s00&quot;&gt;&lt;circle cx=&quot;560&quot; cy=&quot;190&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tlp&quot; data-k=&quot;r02&quot;&gt;&lt;circle cx=&quot;600&quot; cy=&quot;190&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;606&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tlp&quot; data-k=&quot;a05&quot;&gt;&lt;circle cx=&quot;660&quot; cy=&quot;190&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;660&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;2005&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tlp&quot; data-k=&quot;r08&quot;&gt;&lt;circle cx=&quot;720&quot; cy=&quot;190&quot; r=&quot;9&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;2008→&lt;/text&gt;&lt;/g&gt;
