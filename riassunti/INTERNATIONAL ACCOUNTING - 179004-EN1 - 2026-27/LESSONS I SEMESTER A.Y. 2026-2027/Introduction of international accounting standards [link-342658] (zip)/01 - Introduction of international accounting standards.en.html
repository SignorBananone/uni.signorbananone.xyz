    &lt;/figure&gt;

    &lt;h3&gt;Why the EU changes course&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;The limits of the directives&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The 1978 and 1983 directives contained a great many options: the financial statements of companies from different countries remained hard to compare. Moreover, amending them required a lengthy legislative procedure, far too slow compared with financial innovation (recall slides 2 and 5). &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;The capital-markets problem&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Large European companies wishing to list in New York also had to prepare their accounts under US GAAP. Rather than creating its own set of standards, the EU chose to rely on IAS, which were already internationally recognised. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Regulation 1606/2002 in four points&lt;/strong&gt; &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Art. 4&lt;/strong&gt; — IAS/IFRS mandatory for the consolidated financial statements of companies listed on an EU regulated market, for financial years beginning on or after 1 January 2005.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 5&lt;/strong&gt; — options for Member States: to permit or require IAS/IFRS also in annual (separate) financial statements and for unlisted companies (in Italy: D.Lgs. 38/2005).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 3&lt;/strong&gt; — standards apply in the EU only after &lt;em class=&quot;en&quot;&gt;endorsement&lt;/em&gt;: they must not be contrary to the true and fair view principle, must be conducive to the European public good and must meet the criteria of understandability, relevance, reliability and comparability.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 6&lt;/strong&gt; — the Commission is assisted by an accounting regulatory committee, the ARC (section 8).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;p&gt;Regulation (EC) No 1606/2002 of 19 July 2002, OJ L 243 of 11 September 2002; Art. 1 defines “international accounting standards” as IAS, IFRS and SIC/IFRIC interpretations. The consolidated list of endorsed standards is in Regulation (EC) No 1126/2008. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Regulation 1606/2002&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part III&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. What was IOSCO&#x27;s role in the convergence process?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Writing IFRS in place of the IASB.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Endorsing the IASC standards (2000) by recommending their use to securities regulators for foreign listed companies.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Transposing the accounting directives in EU countries.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IOSCO brings together market regulators: its support gave IAS an authority that a private standard setter could not have achieved on its own.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. What does the 2002 FASB–IASB agreement (Norwalk) establish?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;The adoption of IFRS by US companies.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;The merger of the two boards.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;A commitment to make existing standards compatible and to coordinate future work.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;It is a convergence agreement, not an adoption agreement: US companies continue to use US GAAP.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. From 2005, Regulation 1606/2002 makes IAS/IFRS mandatory for…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;all European limited liability companies.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;the consolidated financial statements of companies listed on an EU regulated market.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;the annual financial statements of small companies.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Any further extension (annual financial statements, unlisted companies) depends on the Art. 5 options exercised by Member States.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Open question: explain with an example what “isomorphism” means when applied to IFRS. &lt;span&gt;Show answer&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Isomorphism means that organisations in the same field tend to resemble one another. An emerging economy may adopt IFRS because international lenders require it (coercive), because the countries whose markets it wishes to attract have adopted them (mimetic), or because its professionals are trained in those standards (normative). The result: widespread adoption even where formal convergence with the USA has stalled.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE IV ============ --&gt;
&lt;div class=&quot;part p-brick&quot; id=&quot;parte4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;IV&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Part IV&lt;/p&gt;&lt;h2&gt;Inside IAS/IFRS: structure, development, application&lt;/h2&gt;&lt;p&gt;Slides 10–13&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s7&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt; IAS / IFRS standards &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 10&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Slide 10 shows the three levels of the IAS/IFRS body of standards: the &lt;strong&gt;Framework&lt;/strong&gt; (“the Conceptual Framework is not a standard”), the &lt;strong&gt;Standards&lt;/strong&gt; (IAS and IFRS) and the &lt;strong&gt;Interpretations&lt;/strong&gt; (SIC and IFRIC). Think of them as a building: click its parts.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot; id=&quot;bld&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 360&quot; role=&quot;img&quot; aria-labelledby=&quot;bld-t&quot;&gt;
        &lt;title id=&quot;bld-t&quot;&gt;The IAS/IFRS building: Conceptual Framework as the foundation, IAS and IFRS as the pillars, interpretations as the lintel, financial statements as the roof&lt;/title&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;fs&quot;&gt;&lt;path d=&quot;M380 18L705 100H55Z&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;IAS/IFRS financial statements&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;int&quot;&gt;&lt;rect x=&quot;80&quot; y=&quot;110&quot; width=&quot;600&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Interpretations · SIC → IFRIC (IFRS Interpretations Committee)&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;ias&quot;&gt;&lt;rect x=&quot;115&quot; y=&quot;166&quot; width=&quot;225&quot; height=&quot;120&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;227&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;26&quot; font-weight=&quot;600&quot;&gt;IAS&lt;/text&gt;&lt;text x=&quot;227&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;issued by the IASC, 1973–2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;ifrs&quot;&gt;&lt;rect x=&quot;420&quot; y=&quot;166&quot; width=&quot;225&quot; height=&quot;120&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;532&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;26&quot; font-weight=&quot;600&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;532&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;issued by the IASB, since 2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;cf&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;296&quot; width=&quot;680&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;326&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Conceptual Framework — not a standard&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;bld-out&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Click a part of the building.&lt;/p&gt;&lt;/div&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;p&gt;The &lt;em&gt;Preface to IFRS Standards&lt;/em&gt; confirms that the Conceptual Framework is not a standard and does not override any standard; the IASB may depart from it in a specific standard, but must explain why in the &lt;em&gt;Basis for Conclusions&lt;/em&gt;. The version currently in use is the one revised in 2018. &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/preface-to-ifrs-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Preface to IFRS Standards&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;What the Conceptual Framework contains &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Objective of financial reporting&lt;/summary&gt;&lt;div&gt;&lt;p&gt;To provide information that is useful to existing and potential investors, lenders and other creditors in deciding whether to provide resources to the entity. This is the investor perspective, unlike the Italian tradition, which centres on creditors.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Qualitative characteristics&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Fundamental&lt;/strong&gt;: &lt;em class=&quot;en&quot;&gt;relevance&lt;/em&gt; (the information can make a difference to a decision; it includes &lt;em class=&quot;en&quot;&gt;materiality&lt;/em&gt;) and &lt;em class=&quot;en&quot;&gt;faithful representation&lt;/em&gt; (complete, neutral and free from error).&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Enhancing&lt;/strong&gt;: &lt;em class=&quot;en&quot;&gt;comparability, verifiability, timeliness, understandability&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Elements of financial statements&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;em class=&quot;en&quot;&gt;Asset&lt;/em&gt; (a present economic resource controlled as a result of past events), &lt;em class=&quot;en&quot;&gt;liability&lt;/em&gt; (a present obligation to transfer an economic resource), &lt;em class=&quot;en&quot;&gt;equity&lt;/em&gt; (the residual interest: assets minus liabilities), &lt;em class=&quot;en&quot;&gt;income&lt;/em&gt; and &lt;em class=&quot;en&quot;&gt;expenses&lt;/em&gt; (increases and decreases in assets or liabilities that change equity, excluding transactions with owners).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Recognition and measurement&lt;/summary&gt;&lt;div&gt;&lt;p&gt;When to include an element in the financial statements (&lt;em class=&quot;en&quot;&gt;recognition&lt;/em&gt;) and on which measurement basis (&lt;em class=&quot;en&quot;&gt;measurement&lt;/em&gt;): historical cost or current values, including &lt;em class=&quot;en&quot;&gt;fair value&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;What if no standard covers the case? The IAS 8 hierarchy &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 100&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;110&quot; y1=&quot;38&quot; x2=&quot;790&quot; y2=&quot;38&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;110&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;110&quot; y=&quot;42&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;82&quot;&gt;Specific standard&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;337&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;337&quot; y=&quot;42&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;337&quot; y=&quot;82&quot;&gt;Similar issues&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;563&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;563&quot; y=&quot;42&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;563&quot; y=&quot;82&quot;&gt;Framework&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;790&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;790&quot; y=&quot;42&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;790&quot; y=&quot;82&quot;&gt;Other sources&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Is there a standard or interpretation that applies?&lt;/h4&gt;&lt;p&gt;If so, apply it. Standards and interpretations always prevail over the Framework.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Standards dealing with similar issues&lt;/h4&gt;&lt;p&gt;If not, management uses its judgement and looks first at the requirements of IFRS dealing with similar and related issues.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Definitions and criteria in the Conceptual Framework&lt;/h4&gt;&lt;p&gt;Next, it applies the Framework&#x27;s definitions of assets, liabilities, income and expenses and its recognition and measurement criteria. Here the Framework, although not a standard, becomes operational.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Other standard setters and practice&lt;/h4&gt;&lt;p&gt;Finally, it may consider the pronouncements of other standard setters using a similar framework (e.g. the FASB), accounting literature and industry practice, provided they are consistent with the previous steps.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;IAS ≠ “old and outdated”&lt;/strong&gt;&lt;p&gt;IAS and IFRS have the same standing: the only difference is the body that issued them. Many IAS are fully in force (IAS 2 Inventories, IAS 16 Property, Plant and Equipment, IAS 36 Impairment of Assets, IAS 38 Intangible Assets); others have been replaced by IFRS (IAS 39 → IFRS 9 Financial Instruments; IAS 18 → IFRS 15 Revenue; IAS 17 → IFRS 16 Leases; IAS 1 → IFRS 18 Presentation and Disclosure in Financial Statements, from 2027). In the EU only what has been endorsed applies: hence the expression “IFRS as adopted by the EU”. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s8&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt; IAS/IFRS developing process &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 11&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;A standard is developed through a &lt;em class=&quot;en&quot;&gt;due process&lt;/em&gt; (a public and transparent consultation procedure): the IASB proposes, anyone may comment, the IASB revises. Slide 11 summarises the stages and adds that, for the EU, an approval and application process (&lt;strong&gt;EFRAG&lt;/strong&gt; and &lt;strong&gt;ARC&lt;/strong&gt;) and &lt;strong&gt;translation&lt;/strong&gt; are required. Step through the stages.&lt;/p&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 200&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;path class=&quot;track&quot; d=&quot;M75 50H825V150H150&quot; fill=&quot;none&quot;/&gt;
        &lt;text x=&quot;20&quot; y=&quot;18&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; class=&quot;soft&quot;&gt;IASB · DUE PROCESS&lt;/text&gt;
        &lt;text x=&quot;880&quot; y=&quot;118&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; class=&quot;soft&quot; text-anchor=&quot;end&quot;&gt;EUROPEAN UNION · ENDORSEMENT&lt;/text&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;75&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;75&quot; y=&quot;54&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;75&quot; y=&quot;90&quot;&gt;Agenda&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;225&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;225&quot; y=&quot;54&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;225&quot; y=&quot;90&quot;&gt;DP&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;375&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;375&quot; y=&quot;54&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;375&quot; y=&quot;90&quot;&gt;Comment letters&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;525&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;525&quot; y=&quot;54&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;525&quot; y=&quot;90&quot;&gt;ED&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;675&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;675&quot; y=&quot;54&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;675&quot; y=&quot;90&quot;&gt;Comment letters&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;5&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;825&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;825&quot; y=&quot;54&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;790&quot; y=&quot;90&quot;&gt;IAS/IFRS&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;6&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;825&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;825&quot; y=&quot;154&quot;&gt;7&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;825&quot; y=&quot;190&quot;&gt;EFRAG&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;7&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;600&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;600&quot; y=&quot;154&quot;&gt;8&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;600&quot; y=&quot;190&quot;&gt;ARC&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;8&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;375&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;375&quot; y=&quot;154&quot;&gt;9&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;375&quot; y=&quot;190&quot;&gt;Commission&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;9&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;150&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;150&quot; y=&quot;154&quot;&gt;10&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;150&quot; y=&quot;190&quot;&gt;OJEU and translation&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Agenda and research &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The IASB identifies an issue (diverging practice, a new type of economic transaction, a request from stakeholders) and decides whether to add it to its work plan. This is where “accounting follows the economy” (slide 2).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · DP — Discussion Paper&lt;/h4&gt;&lt;p&gt;A consultation document: it describes the issue, possible solutions and the IASB&#x27;s preliminary views. It is not yet the text of a standard. It may be skipped for narrow-scope amendments.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Comment letters&lt;/h4&gt;&lt;p&gt;Companies, auditors, analysts, national standard setters (such as the OIC), regulators and academics respond in writing. The letters are public and posted on the IASB website.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · ED — Exposure Draft&lt;/h4&gt;&lt;p&gt;A draft standard: the proposed text, together with its rationale (&lt;em class=&quot;en&quot;&gt;Basis for Conclusions&lt;/em&gt;). It is the concrete proposal on which comments will be invited.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Comment letters (again)&lt;/h4&gt;&lt;p&gt;A second round of comments on the Exposure Draft, alongside outreach meetings and field tests. If the changes are substantial, the IASB may re-expose a new draft.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;6 · Issuance of the standard&lt;/h4&gt;&lt;p&gt;The IASB approves and publishes the new IFRS (or the amendment to an existing IAS/IFRS), with an effective date often a few years away to give companies time to prepare.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; A recent example: IFRS 20 &lt;em&gt;Regulatory Assets and Regulatory Liabilities&lt;/em&gt;, issued on 27 May 2026 and effective from 1 January 2029, appears in EFRAG&#x27;s July 2026 report among the standards awaiting EU endorsement. &lt;a href=&quot;https://www.efrag.org/sites/default/files/media/document/2026-07/EFRAG%20Endorsement%20Status%20Report%2023%20July%202026.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG — Endorsement Status Report, 23 July 2026&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;7 · EFRAG — technical advice&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;en&quot;&gt;European Financial Reporting Advisory Group&lt;/em&gt; assesses the standard and advises the European Commission on whether to endorse it.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt; EFRAG issues &lt;em&gt;endorsement advice&lt;/em&gt; on compliance with the criteria of the IAS Regulation, including the &lt;em&gt;European public good&lt;/em&gt;; its role is advisory, and the decision rests with the Commission. &lt;a href=&quot;https://www.efrag.org/en/financial-reporting/about-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG — About Financial Reporting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;8 · ARC — Member States&#x27; vote&lt;/h4&gt;&lt;p&gt;The &lt;em class=&quot;en&quot;&gt;Accounting Regulatory Committee&lt;/em&gt;, composed of representatives of the Member States and chaired by the Commission, votes on the endorsement proposal.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;9 · Adoption by the Commission &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;After the ARC vote and a scrutiny period by the European Parliament and the Council, the Commission adopts a regulation amending Regulation 1126/2008, the “container” of endorsed IAS/IFRS.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;10 · Publication and translation&lt;/h4&gt;&lt;p&gt;The regulation is published in the Official Journal of the EU in all official languages. &lt;strong&gt;Translation&lt;/strong&gt; matters: for an Italian company the legally binding text is the Italian version published in the OJEU, not the IASB&#x27;s English original. Translating technical terms (e.g. &lt;em class=&quot;en&quot;&gt;impairment&lt;/em&gt; = &lt;em&gt;riduzione di valore&lt;/em&gt;) involves choices that can affect interpretation.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Why two separate phases?&lt;/strong&gt;&lt;p&gt;The IASB is a private body: its standards do not have the force of law. In the EU they become mandatory only through a public act, the endorsement regulation. This is why a standard issued by the IASB may not yet be applicable in Europe or, in rare cases, may be endorsed only in part (&lt;em class=&quot;en&quot;&gt;carve-out&lt;/em&gt;). &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s9&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt; Accounting systems / Bookkeeping system &lt;span class=&quot;src sl&quot;&gt;From the slides · sl. 12–13&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;“Accounting systems are relevant as they influence the ways in which businesses are recorded.”&lt;/p&gt;
      &lt;p&gt;“Understanding and applying the rules set out in the accounting principles is necessary to contextualise them within the framework of accounting system rules.”&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;An &lt;strong&gt;accounting system&lt;/strong&gt; (&lt;em class=&quot;en&quot;&gt;accounting system&lt;/em&gt; or &lt;em class=&quot;en&quot;&gt;bookkeeping system&lt;/em&gt;) is the coordinated set of accounts used to record transactions under double entry. Each system has an &lt;strong&gt;object&lt;/strong&gt; (what it sets out to measure) and classifies the changes produced by each transaction accordingly. Accounting standards determine &lt;em&gt;how much&lt;/em&gt; and &lt;em&gt;when&lt;/em&gt; to recognise; the system determines &lt;em&gt;how&lt;/em&gt; to represent it. Slide 13 compares two systems.&lt;/p&gt;

    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;sys-t&quot;&gt;
        &lt;title id=&quot;sys-t&quot;&gt;Patrimonial system: equity/asset and economic changes. Income system: financial and economic changes.&lt;/title&gt;
        &lt;text x=&quot;190&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Patrimonial Accounting System&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Income Accounting System&lt;/text&gt;
        &lt;text x=&quot;190&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;object: net assets&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;object: income&lt;/text&gt;
        &lt;circle cx=&quot;120&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;120&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Equity/Asset&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;changes&lt;/text&gt;
        &lt;circle cx=&quot;262&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;262&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;changes&lt;/text&gt;
        &lt;circle cx=&quot;500&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;500&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;(numerical) changes&lt;/text&gt;
        &lt;circle cx=&quot;642&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;642&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;642&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;changes&lt;/text&gt;
        &lt;line x1=&quot;380&quot; y1=&quot;40&quot; x2=&quot;380&quot; y2=&quot;235&quot; class=&quot;ln dash&quot;/&gt;
        &lt;text x=&quot;190&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;assets, liabilities, equity ↔ expenses and income&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;cash, receivables, payables ↔ costs, revenue, equity&lt;/text&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;Every transaction produces two changes (double entry). The two systems classify them differently.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;The two systems&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Patrimonial system&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Income system&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;At its centre are the entity&#x27;s &lt;strong&gt;net assets&lt;/strong&gt;: assets, liabilities and equity. Changes are classified as &lt;strong&gt;patrimonial&lt;/strong&gt; (increases and decreases in assets, liabilities and capital) and &lt;strong&gt;economic&lt;/strong&gt; (expenses and income, i.e. the causes of the changes in equity generated by operations). This is the logic of international practice and of IAS/IFRS, which define income and expenses in terms of changes in assets and liabilities.&lt;/p&gt;
        &lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Equity&lt;small&gt;Closing equity = Opening equity + contributions − distributions + (Income − Expenses)&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;At its centre is &lt;strong&gt;income&lt;/strong&gt;. Changes are classified as &lt;strong&gt;financial&lt;/strong&gt; (or &lt;em&gt;numerical&lt;/em&gt;: cash in hand and at bank, trade and financing receivables and payables) and &lt;strong&gt;economic&lt;/strong&gt; (costs, revenue and equity accounts). Net assets emerge only at the end of the financial year, as a result of determining income. It is traditionally the most widespread system in Italian teaching and practice.&lt;/p&gt;
        &lt;div class=&quot;formula&quot;&gt;Income = Revenue − Accrued costs&lt;small&gt;Long-lived assets purchased are “deferred” costs, carried forward to future financial years through depreciation&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;p&gt;Historians attribute the patrimonial system to &lt;strong&gt;Fabio Besta&lt;/strong&gt; (late nineteenth century) and the income system to &lt;strong&gt;Gino Zappa&lt;/strong&gt; (1879–1960), his student and the founder of Italian &lt;em&gt;economia aziendale&lt;/em&gt;; the income system spread in Italy, whereas the patrimonial system prevailed in international practice. &lt;a href=&quot;https://www.emeraldinsight.com/doi/abs/10.1108/eb043403&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald — “Italian Accounting Research in the First Half of the 20th Century”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;sysw&quot;&gt;
      &lt;h4&gt;Same transaction, two systems: choose a transaction&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.9rem;color:var(--soft)&quot;&gt;Simplified entries, excluding VAT. &lt;span class=&quot;chip pat&quot;&gt;patrimonial&lt;/span&gt; &lt;span class=&quot;chip fin&quot;&gt;financial&lt;/span&gt; &lt;span class=&quot;chip eco&quot;&gt;economic&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;choices&quot; role=&quot;group&quot; aria-label=&quot;Transactions&quot;&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t1&quot;&gt;Shareholders&#x27; contribution 50,000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t2&quot;&gt;Bank loan 20,000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t3&quot;&gt;Machinery bought on credit 30,000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t4&quot;&gt;Goods paid by bank transfer 8,000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t5&quot;&gt;Credit sale 12,000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t6&quot;&gt;Wages paid 4,000&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;sys-out&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;result&quot;&gt;&lt;p&gt;Select a transaction.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Why it matters for this course&lt;/strong&gt;&lt;p&gt;Slide 12 says it: to understand and apply an accounting standard, one must place it within the rules of the accounting system. IAS/IFRS reason in terms of assets and liabilities (patrimonial logic): anyone who learned bookkeeping under the income system has to “translate”. Example: under IAS 16 the purchase of a machine is the recognition of an asset; under the income system it is a deferred multi-year cost. The final figure in the financial statements is the same, but the reading changes. &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Part IV&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. The Conceptual Framework conflicts with a specific IFRS. Which prevails?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;The Conceptual Framework, because it is the foundation of everything.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;The standard: the Framework is not a standard and does not override any standard.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;The auditor decides case by case.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;This is exactly the point of slide 10: “the Conceptual Framework is not a standard”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. According to slide 11, in what order is an IASB standard developed?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Exposure Draft → Discussion Paper → IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Discussion Paper → comment letters → Exposure Draft → comment letters → IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;IFRS → EFRAG → Exposure Draft&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;First the issue is discussed (DP), then a text is proposed (ED); both phases are followed by public comments. In the EU, EFRAG, the ARC and translation follow.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Purchase of a machine with deferred payment: under the income system, the Machinery account records a change that is…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;financial&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;economic (deferred multi-year cost)&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;patrimonial&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Under the income system only changes in cash, receivables and payables are financial. The machine is a cost carried forward to future financial years through depreciation. Under the patrimonial system it would instead be a patrimonial change (asset ↑).&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Open question: what roles do EFRAG and the ARC play, and why is translation needed? &lt;span&gt;Show answer&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IASB standards are not mandatory in the EU until they have been endorsed. EFRAG provides the Commission with technical advice on compliance with the criteria of Regulation 1606/2002; the ARC, made up of Member State representatives, votes on the proposal; the Commission adopts the regulation. The text is then published in all EU languages: the translated version is the legally binding one in each country.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;div class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;↗&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Further reading&lt;/p&gt;&lt;h2&gt;Legislation, standards, bodies and studies cited in the slides&lt;/h2&gt;&lt;p&gt;Every card is an &lt;strong&gt;external source&lt;/strong&gt;: information found on the web, with links. The slides contain no bibliographic references; here you will find the documents they refer to.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;European legislation&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Regulation (EC) No 1606/2002&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 9&lt;/p&gt;&lt;p&gt;Regulation of 19 July 2002 (OJ L 243 of 11/9/2002) on the application of international accounting standards. It defines IAS/IFRS and interpretations, establishes the endorsement mechanism and imposes IAS/IFRS on the consolidated financial statements of listed companies from 2005.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is the act that makes IAS/IFRS part of EU law.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Reg. 1606/2002&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Directive 2013/34/EU&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slides 3, 6 and 9&lt;/p&gt;&lt;p&gt;Directive on annual financial statements, consolidated financial statements and related reports. Published on 29/6/2013, to be transposed by 20/7/2015. Financial statements as a single whole (balance sheet, profit and loss account, notes), true and fair view, rules according to company size.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is the basis of Italian statutory financial statements.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 2013/34/EU&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Fourth Directive 78/660/EEC&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 9&lt;/p&gt;&lt;p&gt;The first accounting directive: annual accounts of limited liability companies, with the requirement to give a &lt;em&gt;true and fair view&lt;/em&gt; of assets, liabilities, financial position and profit or loss. Amended several times (including in 2006), then repealed and replaced by Dir. 2013/34/EU.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it launched European accounting harmonisation.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/1978/660/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 78/660/EEC&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Seventh Directive 83/349/EEC&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 9&lt;/p&gt;&lt;p&gt;Coordinates national rules on consolidated (group) financial statements, with thresholds for exempting small groups. It too was merged into Dir. 2013/34/EU.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it introduced consolidated financial statements on a harmonised basis.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/1983/349/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 83/349/EEC&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;1995 Commission Strategy — COM(95) 508&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 9 (“European Commission Strategy – 1995”)&lt;/p&gt;&lt;p&gt;“Accounting harmonisation: a new strategy vis-à-vis international harmonisation”, 14 November 1995. The Commission chooses to work with the IASC instead of relying solely on directives; a review of the conformity of IAS with the directives follows.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it marks the EU&#x27;s turn towards international standards.&lt;/p&gt;&lt;a href=&quot;https://op.europa.eu/en/publication-detail/-/publication/5fccfaf1-382b-429e-a66a-8e195805b566&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;op.europa.eu — publication record&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Communication COM(2000) 359 — “EU Financial Reporting Strategy: the way forward”&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 9, which cites “COM/2000 692/2 – Action plan for financial services”&lt;/p&gt;&lt;p&gt;Communication of 13 June 2000: it proposes requiring EU listed companies to prepare consolidated financial statements under IAS from 2005. It forms part of the 1999 Financial Services Action Plan. The number given in the slide does not match the one found: check with the lecturer.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is the policy document from which Reg. 1606/2002 originates.&lt;/p&gt;&lt;a href=&quot;https://eumonitor.nl/9353000/1/j4nvke1fm2yd1u0_j9vvik7m1c3gyxp/vkcweeb4w3zv/v=s7z/f=/com(2000)359_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eumonitor.nl — text of COM(2000) 359 (PDF)&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Italian legislation&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Legislative Decree no. 139 of 18 August 2015&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 6 (Dir. 34/2013 in the Civil Code)&lt;/p&gt;&lt;p&gt;Transposes Dir. 2013/34/EU by amending Arts. 2423 et seq. of the Civil Code and D.Lgs. 127/1991 on consolidated financial statements; applies to financial years beginning on or after 1/1/2016.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is the actual “D.Lgs.” the slide refers to.&lt;/p&gt;&lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislazionetecnica.it — D.Lgs. 139/2015&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Legislative Decree no. 38 of 28 February 2005&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 7 (IAS/IFRS “for listed companies and other companies”)&lt;/p&gt;&lt;p&gt;Exercises the options in Art. 5 of Reg. 1606/2002: IAS/IFRS mandatory for listed companies, issuers of widely distributed financial instruments, banks, SIM, SGR and supervised financial institutions; optional for other unlisted companies; rules on fair value gains.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it defines the slide&#x27;s “other companies”.&lt;/p&gt;&lt;a href=&quot;https://www.fondazionenazionalecommercialisti.it/system/files/imce/aree-tematiche/pac/DOC_2005_23_Adozione%20IAS.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione Nazionale Commercialisti — paper (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;OIC — Organismo Italiano di Contabilità&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 7&lt;/p&gt;&lt;p&gt;Foundation established in 2001 and recognised by Law 116/2014 as the national institute for accounting standards. It issues the OIC standards for financial statements prepared under the Civil Code, after public consultation.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: the OIC standards are the practical rulebook for unlisted companies.&lt;/p&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Standard setters, agreements and international bodies&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IFRS Foundation — Preface and Conceptual Framework&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 10&lt;/p&gt;&lt;p&gt;The Preface explains that the Conceptual Framework describes the objective of and concepts for financial reporting, is not a standard and does not override standards; revised version issued in 2018.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it clarifies the hierarchy of the IAS/IFRS body of standards.&lt;/p&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/preface-to-ifrs-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — Preface to IFRS Standards&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;SIC and IFRIC — the interpretations&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 10&lt;/p&gt;&lt;p&gt;In 2001 the IASB adopted the existing IAS and SIC; the IFRIC replaced the Standing Interpretations Committee in 2002 and was renamed the IFRS Interpretations Committee in 2010. Many SIC and IFRIC interpretations have since been superseded.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: interpretations are as binding as the standards.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/library/research-guides/international-accounting-standards/superseded-ifrs-accounting-standards/superseded-ifric-and-sic-interpretations&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Superseded IFRIC and SIC interpretations&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;FASB Accounting Standards Codification (US GAAP)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 3 (US GAAP)&lt;/p&gt;&lt;p&gt;Since 1 July 2009 it has been the single authoritative source of non-governmental US GAAP; it superseded FASB, AICPA and EITF pronouncements. The “basic view” can be accessed free of charge.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is where US GAAP are found today.&lt;/p&gt;&lt;a href=&quot;https://dart.deloitte.com/USDART/home/accounting/archive-1/us-gaap/fasb-reports-news-items/2009/fasb-accounting-standards-codification-launches-today&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte DART — FASB Codification launches&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IOSCO — 2000 resolution on IASC standards&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 8 (“The Role of IOSCO”)&lt;/p&gt;&lt;p&gt;On 17 May 2000 IOSCO recommends that its members accept the 30 “IASC 2000 standards” for multinational issuers, with possible supplemental treatments (reconciliations, disclosures).&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: the first recognition of IAS by securities regulators.&lt;/p&gt;&lt;a href=&quot;https://www.iosco.org/library/resolutions/pdf/IOSCORES19.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iosco.org — Resolution (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Norwalk Agreement (2002)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 8 (as “Norfolk Agreement”)&lt;/p&gt;&lt;p&gt;FASB–IASB Memorandum of Understanding, joint meeting in Norwalk (Connecticut) on 18 September 2002: commitment to make standards compatible and to coordinate future work.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it formally launched IFRS–US GAAP convergence.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — text of the agreement (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IASB–FASB convergence: 2006 and 2008 MoUs&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 8 (“revival of the project in 2006”)&lt;/p&gt;&lt;p&gt;Project timeline: the 2006 roadmap and the 2008 update, with the goal of completing the major joint projects by 2011.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it shows how convergence was revived and then slowed down.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iasplus.com — IASB-FASB convergence&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Pittsburgh G20 (2009)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 8&lt;/p&gt;&lt;p&gt;Leaders call for a single set of high-quality global standards and for convergence to be completed by June 2011; in Toronto (2010) the deadline is not reiterated.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it represents the strongest political support for convergence.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2009/September/news5386&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iasplus.com — G20 call for global standards by 2011&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;EFRAG and ARC — EU endorsement&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Cited in slide 11&lt;/p&gt;&lt;p&gt;EFRAG advises the Commission on the endorsement of new or amended standards, assessing the criteria of the IAS Regulation and the European public good; the ARC votes; EFRAG&#x27;s periodic reports show the status of each standard.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: without these steps an IFRS does not apply in the EU.&lt;/p&gt;&lt;a href=&quot;https://www.efrag.org/en/financial-reporting/about-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;efrag.org — About Financial Reporting&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Studies and history of the discipline&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;DiMaggio and Powell (1983), “The Iron Cage Revisited”&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Linked to slide 8 (&lt;em&gt;isomorphism&lt;/em&gt;)&lt;/p&gt;&lt;p&gt;Article published in the &lt;em&gt;American Sociological Review&lt;/em&gt;: it explains why organisations in the same field become similar, distinguishing coercive, mimetic and normative isomorphism. Many studies use it to explain the adoption of IFRS and IPSAS.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it is the theoretical origin of the term used in the slide.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/2095101&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.2307/2095101&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Luca Pacioli, &lt;em&gt;Summa de arithmetica&lt;/em&gt; (1494)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Context for slide 2 (not cited in the slides)&lt;/p&gt;&lt;p&gt;Printed in Venice; the treatise &lt;em&gt;Particularis de computis et scripturis&lt;/em&gt; describes double entry as the “method of Venice”, which had long been in use, and served as a manual throughout Europe.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: an example of accounting arising where the economy develops.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library — Earliest books on bookkeeping&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Besta and Zappa: patrimonial system and income system&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Context for slide 13 (authors not cited in the slides)&lt;/p&gt;&lt;p&gt;A study of Italian accounting research in the first half of the twentieth century: the shift from Fabio Besta&#x27;s patrimonial view to Gino Zappa&#x27;s income-based view.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Why it matters: it explains where the two systems compared in the slide come from.&lt;/p&gt;&lt;a href=&quot;https://www.emeraldinsight.com/doi/abs/10.1108/eb043403&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald — Italian Accounting Research in the First Half of the 20th Century&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;/main&gt;

    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});

  /* passi da scorrere */
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),marks=s.querySelectorAll(&#x27;[data-s]&#x27;),
        prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),count=s.querySelector(&#x27;.count&#x27;),i=0;
    function show(){
      steps.forEach(function(st,j){st.hidden=j!==i;});
      marks.forEach(function(m){var k=+m.getAttribute(&#x27;data-s&#x27;);m.classList.toggle(&#x27;on&#x27;,k&lt;=i);m.classList.toggle(&#x27;cur&#x27;,k===i);});
      prev.disabled=i===0;next.disabled=i===steps.length-1;
      count.textContent=&#x27;Step &#x27;+(i+1)+&#x27; of &#x27;+steps.length;
    }
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    marks.forEach(function(m){
      m.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);m.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
      function go(){i=+m.getAttribute(&#x27;data-s&#x27;);show();}
      m.addEventListener(&#x27;click&#x27;,go);
      m.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go();}});
    });
    show();
  });

  /* autoverifica */
  document.querySelectorAll(&#x27;.q&#x27;).forEach(function(q){
    var opts=q.querySelectorAll(&#x27;.opt&#x27;),why=q.querySelector(&#x27;.why&#x27;);
    opts.forEach(function(o){o.addEventListener(&#x27;click&#x27;,function(){
      opts.forEach(function(x){x.disabled=true;if(x.hasAttribute(&#x27;data-ok&#x27;))x.classList.add(&#x27;ok&#x27;);});
      if(!o.hasAttribute(&#x27;data-ok&#x27;))o.classList.add(&#x27;no&#x27;);
      if(why){why.hidden=false;why.insertAdjacentText(&#x27;afterbegin&#x27;,o.hasAttribute(&#x27;data-ok&#x27;)?&#x27;Correct. &#x27;:&#x27;Not quite. &#x27;);}
    });});
  });

  /* scelte con pulsanti */
  function choices(root,render){
    var bs=root.querySelectorAll(&#x27;.choice&#x27;);
    bs.forEach(function(b){b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,x===b);});render(b.getAttribute(&#x27;data-k&#x27;));
    });});
  }

  /* cash vs accrual */
  var mesi=[&#x27;January&#x27;,&#x27;February&#x27;,&#x27;March&#x27;,&#x27;April&#x27;,&#x27;May&#x27;,&#x27;June&#x27;,&#x27;July&#x27;,&#x27;August&#x27;,&#x27;September&#x27;,&#x27;October&#x27;,&#x27;November&#x27;,&#x27;December&#x27;];
  var ws=document.getElementById(&#x27;w-start&#x27;),wd=document.getElementById(&#x27;w-delay&#x27;);
  function fmt(n){return &#x27;€&#x27;+n.toLocaleString(&#x27;en-GB&#x27;);}
  function drawCash(){
    var S=+ws.value,D=+wd.value,yrs=[2026,2027,2028],acc=[0,0,0],cash=[0,0,0];
    for(var m=S;m&lt;S+12;m++){acc[Math.floor((m-1)/12)]+=1000;}
    var pm=S+D;cash[Math.floor((pm-1)/12)]+=12000;
    document.getElementById(&#x27;o-start&#x27;).textContent=mesi[S-1];
    document.getElementById(&#x27;o-delay&#x27;).textContent=D;
    var h=&#x27;&#x27;,base=200,sc=170/12000;
    h+=&#x27;&lt;line x1=&quot;40&quot; y1=&quot;&#x27;+base+&#x27;&quot; x2=&quot;620&quot; y2=&quot;&#x27;+base+&#x27;&quot; class=&quot;ln&quot;/&gt;&#x27;;
    yrs.forEach(function(y,i){
      var x=70+i*190;
      [[&#x27;cash&#x27;,cash[i],&#x27;var(--ochre)&#x27;],[&#x27;acc&#x27;,acc[i],&#x27;var(--slate)&#x27;]].forEach(function(b,k){
        var bh=b[1]*sc,bx=x+k*62;
        h+=&#x27;&lt;rect x=&quot;&#x27;+bx+&#x27;&quot; y=&quot;&#x27;+(base-bh)+&#x27;&quot; width=&quot;54&quot; height=&quot;&#x27;+bh+&#x27;&quot; rx=&quot;4&quot; style=&quot;fill:&#x27;+b[2]+&#x27;&quot;/&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(bx+27)+&#x27;&quot; y=&quot;&#x27;+(base-bh-6)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+(b[1]/1000).toLocaleString(&#x27;en-GB&#x27;)+&#x27;k&lt;/text&gt;&#x27;;
      });
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+58)+&#x27;&quot; y=&quot;&#x27;+(base+20)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; class=&quot;serif&quot; font-weight=&quot;600&quot;&gt;&#x27;+y+&#x27;&lt;/text&gt;&#x27;;
    });
    h+=&#x27;&lt;rect x=&quot;40&quot; y=&quot;228&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;2&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;58&quot; y=&quot;239&quot; font-size=&quot;12.5&quot;&gt;cash basis (receipts)&lt;/text&gt;&#x27;;
    h+=&#x27;&lt;rect x=&quot;220&quot; y=&quot;228&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;2&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;239&quot; font-size=&quot;12.5&quot;&gt;accrual basis (accrued revenue)&lt;/text&gt;&#x27;;
    document.getElementById(&#x27;cash-chart&#x27;).innerHTML=h;
    var y0=2026+Math.floor((pm-1)/12),mesiIn=13-S;
    document.getElementById(&#x27;cash-msg&#x27;).innerHTML=&#x27;&lt;p&gt;The service runs for 12 months from &#x27;+mesi[S-1]+&#x27; 2026: &lt;strong&gt;&#x27;+mesiIn+&#x27; of the 12 months fall in 2026&lt;/strong&gt;, so on an accrual basis 2026 revenue is &lt;strong&gt;&#x27;+fmt(acc[0])+&#x27;&lt;/strong&gt;&#x27;+(acc[1]?&#x27; and the remainder (&#x27;+fmt(acc[1])+&#x27;) goes to 2027&#x27;:&#x27;&#x27;)+&#x27;.&lt;/p&gt;&lt;p&gt;The customer pays in &#x27;+mesi[(pm-1)%12]+&#x27; &#x27;+y0+&#x27;: on a cash basis the full €12,000 falls in &lt;strong&gt;&#x27;+y0+&#x27;&lt;/strong&gt;. &#x27;+(acc[0]===cash[0]&amp;&amp;acc[1]===cash[1]?&#x27;In this case the two bases coincide.&#x27;:&#x27;The two bases give different annual results: only the accrual basis measures the work performed in each year.&#x27;)+&#x27;&lt;/p&gt;&#x27;;
  }
  ws.addEventListener(&#x27;input&#x27;,drawCash);wd.addEventListener(&#x27;input&#x27;,drawCash);drawCash();

  /* albero Italia */
  var tree={
    quot:&#x27;&lt;p&gt;&lt;strong&gt;IAS/IFRS mandatory&lt;/strong&gt; for the consolidated financial statements (directly under Reg. 1606/2002, Art. 4) and, in Italy, also for the separate annual financial statements (D.Lgs. 38/2005).&lt;/p&gt;&#x27;,
    banca:&#x27;&lt;p&gt;&lt;strong&gt;IAS/IFRS mandatory&lt;/strong&gt;: D.Lgs. 38/2005 extends them to banks and supervised financial intermediaries, even if unlisted. The financial statement formats are then laid down by the Bank of Italy.&lt;/p&gt;&#x27;,
    grande:&#x27;&lt;p&gt;&lt;strong&gt;Civil Code + OIC standards&lt;/strong&gt; as the general rule. But this is one of the cases in which D.Lgs. 38/2005 (Art. 2-bis) grants the &lt;strong&gt;option&lt;/strong&gt; to adopt IAS/IFRS: it is the dashed arrow in the diagram.&lt;/p&gt;&#x27;,
    piccola:&#x27;&lt;p&gt;&lt;strong&gt;Civil Code + OIC standards&lt;/strong&gt;, with the simplifications of abridged financial statements (Art. 2435-bis of the Civil Code). Companies eligible to prepare abridged financial statements may not opt for IAS/IFRS.&lt;/p&gt;&#x27;,
    micro:&#x27;&lt;p&gt;&lt;strong&gt;Civil Code + OIC standards&lt;/strong&gt;, with the further simplifications for micro-entities (Art. 2435-ter of the Civil Code, introduced by D.Lgs. 139/2015 in transposing Directive 34/2013).&lt;/p&gt;&#x27;
  };
  choices(document.getElementById(&#x27;treew&#x27;),function(k){document.getElementById(&#x27;tree-out&#x27;).innerHTML=tree[k];});

  /* elementi SVG cliccabili con pannello di dettaglio */
  function clickable(sel,out,data){
    var els=document.querySelectorAll(sel);
    els.forEach(function(g){
      g.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);g.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
      function go(){els.forEach(function(x){x.classList.toggle(&#x27;act&#x27;,x===g);});document.getElementById(out).innerHTML=data[g.getAttribute(&#x27;data-k&#x27;)];}
      g.addEventListener(&#x27;click&#x27;,go);
      g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go();}});
    });
  }
  var X=&#x27; &lt;span class=&quot;src ext&quot;&gt;External source&lt;/span&gt;&#x27;,C=&#x27; &lt;span class=&quot;src ctx&quot;&gt;Context&lt;/span&gt;&#x27;;
  clickable(&#x27;#eutl .tlp&#x27;,&#x27;eutl-out&#x27;,{
    d78:&#x27;&lt;p&gt;&lt;strong&gt;1978 · Fourth Directive 78/660/EEC&lt;/strong&gt; — annual accounts of limited liability companies: financial statement formats, measurement bases, the true and fair view principle.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    d83:&#x27;&lt;p&gt;&lt;strong&gt;1983 · Seventh Directive 83/349/EEC&lt;/strong&gt; — consolidated financial statements of groups.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    dmod:&#x27;&lt;p&gt;&lt;strong&gt;2001–2006 · “Further modifications and updates”&lt;/strong&gt; — the two directives are amended several times to bring them closer to IAS: for example, the &lt;em&gt;fair value&lt;/em&gt; directive (2001/65/EC), the modernisation directive (2003/51/EC) and Directive 2006/46/EC.&#x27;+C+&#x27;&lt;/p&gt;&#x27;,
    d13:&#x27;&lt;p&gt;&lt;strong&gt;2013 · Directive 2013/34/EU&lt;/strong&gt; — repeals and replaces the Fourth and Seventh Directives, merging them; transposed in Italy by D.Lgs. 139/2015.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    s95:&#x27;&lt;p&gt;&lt;strong&gt;1995 · Commission Strategy&lt;/strong&gt; — COM(95) 508, “Accounting harmonisation: a new strategy vis-à-vis international harmonisation”: instead of new directives, the EU chooses to cooperate with the IASC.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    s00:&#x27;&lt;p&gt;&lt;strong&gt;2000 · Commission Communication&lt;/strong&gt; — the slide cites “COM/2000 692/2 – Action plan for financial services”. The key document of June 2000 is COM(2000) 359 “EU Financial Reporting Strategy: the way forward”, which implements the 1999 Financial Services Action Plan and proposes mandatory IAS for listed companies from 2005.&#x27;+X+&#x27;&lt;/p&gt;&lt;p&gt;The document number in the slide does not match the one found: it is worth asking the lecturer to confirm.&lt;/p&gt;&#x27;,
    r02:&#x27;&lt;p&gt;&lt;strong&gt;2002 · Regulation (EC) 1606/2002&lt;/strong&gt; — makes endorsed IAS/IFRS mandatory for the consolidated financial statements of listed companies from 2005.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    a05:&#x27;&lt;p&gt;&lt;strong&gt;2005 · First-time application&lt;/strong&gt; — European listed groups prepare their first IAS/IFRS consolidated financial statements (financial years beginning on or after 1 January 2005).&#x27;+C+&#x27;&lt;/p&gt;&#x27;,
    r08:&#x27;&lt;p&gt;&lt;strong&gt;2008 onwards · Regulation (EC) 1126/2008&lt;/strong&gt; — brings together all endorsed IAS/IFRS in a single text; every new standard or amendment updates it. These are the slide\&#x27;s “further modifications and updates”.&#x27;+X+&#x27;&lt;/p&gt;&#x27;
  });
  clickable(&#x27;#bld .bp&#x27;,&#x27;bld-out&#x27;,{
    fs:&#x27;&lt;p&gt;&lt;strong&gt;The outcome: IAS/IFRS financial statements&lt;/strong&gt; (&lt;em class=&quot;en&quot;&gt;financial statements&lt;/em&gt;) — statement of financial position, statement of comprehensive income, statement of changes in equity, statement of cash flows, notes. It rests on all the levels below.&lt;/p&gt;&#x27;,
    int:&#x27;&lt;p&gt;&lt;strong&gt;Interpretations&lt;/strong&gt; — clarify how to apply a standard where practice diverges. &lt;strong&gt;SIC&lt;/strong&gt;: issued by the IASC\&#x27;s &lt;em class=&quot;en&quot;&gt;Standing Interpretations Committee&lt;/em&gt; until 2001. &lt;strong&gt;IFRIC&lt;/strong&gt;: issued by the &lt;em class=&quot;en&quot;&gt;International Financial Reporting Interpretations Committee&lt;/em&gt; since 2002, renamed the IFRS Interpretations Committee in 2010. They are as binding as the standards.&lt;/p&gt;&#x27;,
    ias:&#x27;&lt;p&gt;&lt;strong&gt;IAS · International Accounting Standards&lt;/strong&gt; — issued by the IASC (1973–2001), numbered from IAS 1 to IAS 41. The IASB adopted them in 2001; those not replaced remain fully in force (e.g. IAS 2, 12, 16, 19, 36, 37, 38).&lt;/p&gt;&#x27;,
    ifrs:&#x27;&lt;p&gt;&lt;strong&gt;IFRS · International Financial Reporting Standards&lt;/strong&gt; — issued by the IASB since 2001, starting with IFRS 1 (first-time adoption). Among the most important: IFRS 3 Business Combinations, IFRS 9 Financial Instruments, IFRS 10 Consolidated Financial Statements, IFRS 15 Revenue, IFRS 16 Leases, IFRS 18 Presentation. In a broad sense, the term “IFRS” also denotes the whole body of standards (IAS + IFRS + interpretations).&lt;/p&gt;&#x27;,
    cf:&#x27;&lt;p&gt;&lt;strong&gt;Conceptual Framework&lt;/strong&gt; — “is not a standard” (slide 10). It sets out the objective, qualitative characteristics, definitions of the elements, and recognition and measurement criteria. The IASB uses it to write consistent standards, and entities use it when no standard applies (IAS 8). It never overrides a standard.&lt;/p&gt;&#x27;
  });

  /* due sistemi contabili */
  var P=[&#x27;pat&#x27;,&#x27;patrimonial&#x27;],E=[&#x27;eco&#x27;,&#x27;economic&#x27;],F=[&#x27;fin&#x27;,&#x27;financial&#x27;];
  var sys={
    t1:{r:[[&#x27;Bank account&#x27;,&#x27;Bank account&#x27;,&#x27;D&#x27;,50000,P,&#x27;asset ↑&#x27;,F,&#x27;cash ↑&#x27;],[&#x27;Share capital&#x27;,&#x27;Share capital&#x27;,&#x27;A&#x27;,50000,P,&#x27;equity ↑ (contribution)&#x27;,E,&#x27;equity ↑&#x27;]],n:&#x27;The contribution increases equity but is &lt;strong&gt;not income&lt;/strong&gt; in either system. In the income system, share capital is an economic “equity” account.&#x27;},
    t2:{r:[[&#x27;Bank account&#x27;,&#x27;Bank account&#x27;,&#x27;D&#x27;,20000,P,&#x27;asset ↑&#x27;,F,&#x27;cash ↑&#x27;],[&#x27;Bank loans&#x27;,&#x27;Bank loans&#x27;,&#x27;A&#x27;,20000,P,&#x27;liability ↑&#x27;,F,&#x27;payable ↑&#x27;]],n:&#x27;A pure exchange: no effect on equity or income. In the income system both changes are financial.&#x27;},
    t3:{r:[[&#x27;Machinery&#x27;,&#x27;Machinery&#x27;,&#x27;D&#x27;,30000,P,&#x27;asset ↑&#x27;,E,&#x27;multi-year cost (deferred)&#x27;],[&#x27;Trade payables&#x27;,&#x27;Trade payables&#x27;,&#x27;A&#x27;,30000,P,&#x27;liability ↑&#x27;,F,&#x27;payable ↑&#x27;]],n:&#x27;&lt;strong&gt;This is where the two systems diverge most.&lt;/strong&gt; For the patrimonial system (and for IAS 16) the machine is an asset. For the income system it is a cost that will be allocated to future financial years through depreciation.&#x27;},
    t4:{r:[[&#x27;Goods (inventory)&#x27;,&#x27;Purchases of goods&#x27;,&#x27;D&#x27;,8000,P,&#x27;asset ↑&#x27;,E,&#x27;expense for the year&#x27;],[&#x27;Bank account&#x27;,&#x27;Bank account&#x27;,&#x27;A&#x27;,8000,P,&#x27;asset ↓&#x27;,F,&#x27;cash ↓&#x27;]],n:&#x27;Even the account names change. In the patrimonial system goods enter the warehouse as an asset and become an expense when sold. In the income system they are an immediate cost; at year-end, closing inventory adjusts it.&#x27;},
    t5:{r:[[&#x27;Trade receivables&#x27;,&#x27;Trade receivables&#x27;,&#x27;D&#x27;,12000,P,&#x27;asset ↑&#x27;,F,&#x27;receivable ↑&#x27;],[&#x27;Sales revenue&#x27;,&#x27;Sales of goods&#x27;,&#x27;A&#x27;,12000,E,&#x27;revenue → equity ↑&#x27;,E,&#x27;revenue&#x27;]],n:&#x27;Revenue arises at the time of sale, not on collection (accrual basis). In the patrimonial system with a perpetual inventory, the cost of goods sold would also be recognised: it is omitted here.&#x27;},
    t6:{r:[[&#x27;Wages and salaries&#x27;,&#x27;Wages and salaries&#x27;,&#x27;D&#x27;,4000,E,&#x27;expense → equity ↓&#x27;,E,&#x27;cost&#x27;],[&#x27;Bank account&#x27;,&#x27;Bank account&#x27;,&#x27;A&#x27;,4000,P,&#x27;asset ↓&#x27;,F,&#x27;cash ↓&#x27;]],n:&#x27;A case in which the two systems substantially coincide: a cost against a cash outflow.&#x27;}
  };
  function chip(c,t){return &#x27;&lt;span class=&quot;chip &#x27;+c[0]+&#x27;&quot;&gt;&#x27;+c[1]+&#x27;&lt;/span&gt; &#x27;+t;}
  choices(document.getElementById(&#x27;sysw&#x27;),function(k){
    var d=sys[k],h=&#x27;&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;cmp&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dr/Cr&lt;/th&gt;&lt;th&gt;Amount&lt;/th&gt;&lt;th&gt;Patrimonial system&lt;/th&gt;&lt;th&gt;Income system&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    d.r.forEach(function(r){
      h+=&#x27;&lt;tr&gt;&lt;th&gt;&#x27;+(r[2]===&#x27;D&#x27;?&#x27;Debit&#x27;:&#x27;Credit&#x27;)+&#x27;&lt;/th&gt;&lt;td&gt;€&#x27;+r[3].toLocaleString(&#x27;en-GB&#x27;)+&#x27;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;&#x27;+r[0]+&#x27;&lt;/strong&gt;&lt;br&gt;&#x27;+chip(r[4],r[5])+&#x27;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;&#x27;+r[1]+&#x27;&lt;/strong&gt;&lt;br&gt;&#x27;+chip(r[6],r[7])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    });
    h+=&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;p&gt;&#x27;+d.n+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    document.getElementById(&#x27;sys-out&#x27;).innerHTML=h;
  });
})();
&lt;/script&gt;
