*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.02rem/1.62 var(--sans)}
a{color:var(--accent);text-underline-offset:.18em}

/* hero */
header.hero{padding:3.5rem 0 2rem;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:300;margin:.4rem 0 .3rem}
.hero h1 i{font-weight:500;color:var(--accent)}
.hero .sub{font-family:var(--serif);font-size:1.3rem;color:var(--ink2);max-width:46ch}
.meta{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin-top:1.2rem;font-size:.86rem;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:600}
.mapbox{margin-top:2rem;border:1px solid var(--rule);border-radius:14px;background:var(--paper2);padding:1rem}
.mapbox svg{width:100%;height:auto;display:block}
.map a{cursor:pointer}
.map a rect{transition:transform .2s,filter .2s}
.map a:hover rect,.map a:focus rect{filter:brightness(.96);stroke-width:2.2}
.map text{font-family:var(--sans);fill:var(--ink)}
.map .ttl{font-family:var(--serif);font-weight:600;font-size:15px}
.map .lbl{font-size:10.5px;fill:var(--ink2);font-style:italic}
/* sections */
section.part{padding:3.5rem 0 3rem;border-bottom:1px solid var(--rule)}
section.part &gt; .wrap &gt; header{margin-bottom:1.6rem;padding-left:1rem;border-left:4px solid var(--c)}
.p-slate{--c:var(--slate);--cbg:var(--slate-bg)}
.p-sage{--c:var(--sage);--cbg:var(--sage-bg)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.card{background:var(--paper2);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.1rem}

.tint{background:var(--cbg);border-color:color-mix(in oklch,var(--c) 30%,var(--rule))}

.quiz{margin-top:2.2rem;padding:1.2rem;border-radius:14px;background:var(--cbg);border:1px solid color-mix(in oklch,var(--c) 30%,var(--rule))}

.dots button{width:26px;height:26px;padding:0;border-radius:50%;font-size:.75rem}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.st-head{padding:1rem 1rem .3rem}
.st-head h4{margin:0 0 .3rem;font-size:1.3rem}
.st-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:0;border-top:1px solid var(--rule)}
.st-col{padding:.9rem 1rem;border-right:1px solid var(--rule);background:var(--paper)}

.st-col h5{margin:0 0 .4rem;font:600 .78rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}

.bal div{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;border-bottom:1px dotted var(--rule)}
.bal span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bal .h{font-weight:600;color:var(--ink2);border:none;margin-top:.4rem;text-transform:uppercase;font-size:.68rem;letter-spacing:.1em}

.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.6rem 1.4rem;padding:1rem;border:1px solid var(--rule);border-radius:12px;background:var(--paper2);margin:1rem 0}

.ctrl output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.badge{display:inline-block;font:700 .9rem var(--sans);padding:.25rem .7rem;border-radius:99px;background:var(--accent);color:var(--paper)}
/* biblio */
.bib{display:grid;gap:.9rem}
.bib article{border:1px solid var(--rule);border-radius:12px;padding:1rem 1.1rem;background:var(--paper2)}
.bib h4{margin:0 0 .2rem}
.bib .who{font-size:.85rem;color:var(--ink2);margin-bottom:.5rem}
.bib ul{margin:.3rem 0 0;padding-left:1.1rem;font-size:.88rem}
footer{padding:2.5rem 0 3rem;font-size:.9rem;color:var(--ink2);text-align:center}
footer p{max-width:60ch;margin:0 auto .5rem}

}

      &lt;a href=&quot;#anglo&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;255&quot; y=&quot;270&quot; width=&quot;210&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;text class=&quot;ttl&quot; x=&quot;360&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot;&gt;Anglo-Saxon variant&lt;/text&gt;
        &lt;text x=&quot;360&quot; y=&quot;313&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;Revenues − COGS&lt;/text&gt;&lt;/a&gt;

      &lt;a href=&quot;#reddito&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;600&quot; y=&quot;270&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text class=&quot;ttl&quot; x=&quot;710&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot;&gt;Costs by nature&lt;/text&gt;
        &lt;text x=&quot;710&quot; y=&quot;313&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;no internal entries&lt;/text&gt;&lt;/a&gt;

      &lt;a href=&quot;#confronto&quot; tabindex=&quot;0&quot;&gt;&lt;rect x=&quot;380&quot; y=&quot;372&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;
        &lt;text class=&quot;ttl&quot; x=&quot;480&quot; y=&quot;395&quot; text-anchor=&quot;middle&quot;&gt;Comparison and purposes&lt;/text&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Part 1 · slides 2–4&lt;/div&gt;&lt;h2&gt;The framework: one double-entry method, two systems&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;There are several ways of keeping accounts around the world, but almost all of them rest on &lt;em class=&quot;t&quot;&gt;double-entry bookkeeping&lt;/em&gt;: every business transaction is recorded in &lt;b&gt;at least two accounts&lt;/b&gt;, once on the &lt;b&gt;debit&lt;/b&gt; side (&lt;em class=&quot;t&quot;&gt;debit&lt;/em&gt;, left-hand column) and once on the &lt;b&gt;credit&lt;/b&gt; side (&lt;em class=&quot;t&quot;&gt;credit&lt;/em&gt;, right-hand column), for the same amount. Total debits in each entry always equal total credits.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Σ Debits = Σ Credits &amp;nbsp;·&amp;nbsp; &lt;span class=&quot;small&quot;&gt;for every entry&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Double entry is the &lt;i&gt;method&lt;/i&gt; (the recording technique). The &lt;b&gt;accounting system&lt;/b&gt; is the &lt;i&gt;object&lt;/i&gt; observed through that method: which accounts are opened, which transactions are recorded and how the result is read. The lecture distinguishes two broad families &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;:&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Patrimonial accounting system&lt;/div&gt;
      &lt;h4&gt;Patrimonial Accounting System&lt;/h4&gt;
      &lt;p&gt;The focus is on &lt;b&gt;net assets&lt;/b&gt; (the company&#x27;s &lt;i&gt;patrimonio&lt;/i&gt;): every change in the value of assets and liabilities is recorded, including internal ones (raw materials turning into work in progress, work in progress turning into finished goods).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Adopted in &lt;b&gt;Anglo-Saxon countries&lt;/b&gt;. Contributions: &lt;b&gt;Besta&lt;/b&gt; in Italy (Venice) and &lt;b&gt;Paton&lt;/b&gt; in the USA (founder of the American Accounting Association), 1920; followed by practical developments in Anglo-Saxon countries &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Income accounting system&lt;/div&gt;
      &lt;h4&gt;Income Accounting System&lt;/h4&gt;
      &lt;p&gt;The focus is on &lt;b&gt;income&lt;/b&gt;: only exchanges with third parties are recorded, i.e. a financial change (bank, receivables, payables) and its economic cause (a cost or a revenue). Internal transformations generate no entries.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Adopted in &lt;b&gt;Italy and Germany&lt;/b&gt; and in the other “Latin European” countries. Contributions: &lt;b&gt;Zappa&lt;/b&gt; in Italy (Venice), around 1950, with later developments; then &lt;b&gt;Onida&lt;/b&gt; and &lt;b&gt;Amaduzzi&lt;/b&gt;; &lt;b&gt;Schmalenbach&lt;/b&gt; in Germany &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the authors cited&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;95&quot; x2=&quot;860&quot; y2=&quot;95&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;circle cx=&quot;120&quot; cy=&quot;95&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1880&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Besta, inaugural lecture&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;“La Ragioneria” (Venice)&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--accent)&quot;&gt;external source&lt;/text&gt;

        &lt;circle cx=&quot;470&quot; cy=&quot;95&quot; r=&quot;7&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1919–20&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Schmalenbach,&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;“dynamische Bilanz”&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--accent)&quot;&gt;external source&lt;/text&gt;

        &lt;circle cx=&quot;760&quot; cy=&quot;95&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; class=&quot;serif&quot; font-size=&quot;17&quot;&gt;≈ 1950&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Zappa → Onida, Amaduzzi;&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot;&gt;Schmalenbach · income system&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;var(--ink2)&quot;&gt;slide 3&lt;/text&gt;

    &lt;figcaption&gt;Timeline. The large dots are the dates given in the slides; the small ones come from external sources (see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;). The slides date the income system to “around 1950”, i.e. when it became widespread; Zappa&#x27;s foundational works date from the 1920s.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;How to read the entries in the slides: VP, VE, VF&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Next to each account the slides place an abbreviation with a sign. The abbreviation tells you &lt;b&gt;what type of value&lt;/b&gt; is moving; the sign tells you &lt;b&gt;whether it increases or decreases&lt;/b&gt;. The slide colours on VE items (green = +, red = −) indicate the effect on the result.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Abbreviations&quot;&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-vp&quot; aria-controls=&quot;p-vp&quot; style=&quot;--tc:var(--sage)&quot;&gt;VP · patrimonial change&lt;/button&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-ve&quot; aria-controls=&quot;p-ve&quot; style=&quot;--tc:var(--ochre)&quot;&gt;VE · economic change&lt;/button&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-vf&quot; aria-controls=&quot;p-vf&quot; style=&quot;--tc:var(--brick)&quot;&gt;VF · financial change&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-vp&quot; aria-labelledby=&quot;t-vp&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VP+&lt;/b&gt; = an asset item increases (e.g. &lt;i&gt;Inventory&lt;/i&gt;, &lt;i&gt;Bank&lt;/i&gt;): recorded as a &lt;b&gt;debit&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VP−&lt;/b&gt; = an asset item decreases: recorded as a &lt;b&gt;credit&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Used in the patrimonial system (Besta and the Anglo-Saxon variant) for &lt;b&gt;all&lt;/b&gt; asset and liability items, bank included: in the patrimonial system the bank is an element of net assets just like inventory.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-ve&quot; aria-labelledby=&quot;t-ve&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VE−&lt;/b&gt; = a negative income component, i.e. a cost (e.g. &lt;i&gt;Wages&lt;/i&gt;, &lt;i&gt;COGS&lt;/i&gt;): recorded as a &lt;b&gt;debit&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VE+&lt;/b&gt; = a positive income component (e.g. &lt;i&gt;Revenues&lt;/i&gt;, &lt;i&gt;Profit on sales&lt;/i&gt;) or an adjustment to a cost: recorded as a &lt;b&gt;credit&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;VE items feed the income statement and, at period end, equity. They exist in both systems.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-vf&quot; aria-labelledby=&quot;t-vf&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VF+&lt;/b&gt; = cash comes in or a receivable arises (e.g. &lt;i&gt;Bank&lt;/i&gt; increasing): &lt;b&gt;debit&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VF−&lt;/b&gt; = cash goes out or a payable arises: &lt;b&gt;credit&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Typical of the income system: every exchange with third parties has a &lt;b&gt;financial aspect&lt;/b&gt; (VF: how much cash, receivables or payables move) and an &lt;b&gt;economic aspect&lt;/b&gt; (VE: why they move — a cost or a revenue). This is the “two faces” of the entry according to Zappa.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The test case: a typical production cycle&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;To compare the systems the slides use &lt;b&gt;three practical examples&lt;/b&gt; on the same cycle: purchase of raw materials, production of finished goods, sale. The examples end with the “natural logic” structure of the &lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt; that results from the entries &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between double-entry bookkeeping and an accounting system?&lt;/summary&gt;&lt;div&gt;Double entry is the recording &lt;b&gt;method&lt;/b&gt; (each transaction is recorded as a debit and a credit for the same amount). The accounting system is the &lt;b&gt;object&lt;/b&gt; observed, and it determines which accounts and which transactions to record: net assets and their changes (patrimonial system) or income and its causes (income system).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which system is adopted in Anglo-Saxon countries, and which in Italy and Germany?&lt;/summary&gt;&lt;div&gt;Anglo-Saxon countries: &lt;i&gt;Patrimonial Accounting System&lt;/i&gt;. Italy, Germany and the other “Latin European” countries: &lt;i&gt;Income Accounting System&lt;/i&gt; (slide 2).&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;In the income system the bank is a financial value: VF−.&quot;&gt;
      &lt;p&gt;In the income system, a payment from the bank account is recorded as…&lt;/p&gt;
      &lt;button&gt;VP−&lt;/button&gt;&lt;button&gt;VF−&lt;/button&gt;&lt;button&gt;VE−&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;Paton, in the USA, was among the founders of the American Accounting Association.&quot;&gt;
      &lt;p&gt;According to the slides, who is the founder of the American Accounting Association?&lt;/p&gt;
      &lt;button&gt;Zappa&lt;/button&gt;&lt;button&gt;Schmalenbach&lt;/button&gt;&lt;button&gt;Paton&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;besta&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Part 2 · slides 5–17&lt;/div&gt;&lt;h2&gt;The patrimonial system according to Besta&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;In the &lt;em class=&quot;t&quot;&gt;Patrimonial Accounting System&lt;/em&gt; each account represents an element of net assets. An entry describes how net assets change: one element goes up, another goes down. If the algebraic sum is not zero, the difference is a &lt;b&gt;change in equity&lt;/b&gt;, i.e. an income component (VE).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Key idea.&lt;/b&gt; In Besta&#x27;s version, separate “revenues” and “costs” are not recorded at the time of sale: only the &lt;b&gt;gain&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Profit on sales&lt;/em&gt;) is recorded, i.e. the difference between the cash received and the value of the goods leaving inventory.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Example 1 · Merchandising company: the bottle of water&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;A company buys a bottle of water (&lt;em class=&quot;t&quot;&gt;inventory&lt;/em&gt;, goods held for resale) for 0.30 and resells it for 1.00 &lt;span class=&quot;src&quot;&gt;slides 6–9&lt;/span&gt;. Move the slider to change the selling price.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot; style=&quot;grid-template-columns:1fr&quot;&gt;
    &lt;label&gt;Selling price of the bottle: &lt;output id=&quot;bt-o&quot;&gt;1.00&lt;/output&gt;
      &lt;input type=&quot;range&quot; id=&quot;bt&quot; min=&quot;0.10&quot; max=&quot;2.50&quot; step=&quot;0.05&quot; value=&quot;1.00&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;caption&gt;Purchase of goods &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Inventory (bottle of water)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;caption&gt;Goods have been sold &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-c&quot;&gt;1.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr id=&quot;bt-row&quot;&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot; id=&quot;bt-tag&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot; id=&quot;bt-acc&quot;&gt;Profit on sales&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-d&quot;&gt;&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-a&quot;&gt;0.70&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;table class=&quot;is&quot;&gt;&lt;caption class=&quot;small&quot; style=&quot;text-align:left;padding-bottom:.4rem&quot;&gt;Theoretical Income Statement &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Profit on sales&lt;/i&gt;&lt;/td&gt;&lt;td id=&quot;bt-p&quot;&gt;0.70&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Other costs&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(0.00)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td id=&quot;bt-e&quot;&gt;0.70&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;EBIT&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Earnings before interest and taxes&lt;/em&gt;) is operating profit before financial expenses and taxes. Note what is &lt;b&gt;missing&lt;/b&gt;: the income statement shows neither how much was sold (1.00) nor what the goods cost (0.30). It shows only the margin.&lt;/p&gt;
      &lt;p class=&quot;small&quot; id=&quot;bt-msg&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Example 2 · Manufacturing company&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Now the cycle is complete: raw materials, processing, finished goods, sale &lt;span class=&quot;src&quot;&gt;slides 10–17&lt;/span&gt;. Step through the events: on the right you can see the accumulating account &lt;b&gt;balances&lt;/b&gt; (movements from an opening balance of zero; a “Cr” balance on the bank indicates a net outflow).&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;b&quot;&gt;&lt;/div&gt;

  &lt;h4&gt;The tricky step: capitalizing wages&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;p&gt;Wages paid amount to 500,000 and are initially recognized as a cost (&lt;b&gt;VE−&lt;/b&gt;, slide 13). However, 400,000 are &lt;b&gt;production&lt;/b&gt; wages (&lt;em class=&quot;t&quot;&gt;Operations&lt;/em&gt;): this labour processed the materials and forms part of the value of work in progress. The slides &lt;b&gt;capitalize&lt;/b&gt; them (&lt;em class=&quot;t&quot;&gt;capitalization&lt;/em&gt;: they are moved from a period expense to the carrying amount of an asset) by debiting &lt;b&gt;WIP Inventory VP+&lt;/b&gt; and crediting &lt;b&gt;Wages VE+&lt;/b&gt; (slide 14).&lt;/p&gt;
      &lt;p&gt;The Wages account is left with a balance of 100,000: these are &lt;b&gt;S.G.&amp;amp;A.&lt;/b&gt; wages (&lt;em class=&quot;t&quot;&gt;Sales, General and Administrative&lt;/em&gt;), also called &lt;b&gt;S.G.&amp;amp;O.&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Sales, General and Others&lt;/em&gt;). They remain a period cost.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Watch out for the typo.&lt;/b&gt; Slide 13 reads “and 100 for S.G.&amp;amp;A.”: this means &lt;b&gt;100,000&lt;/b&gt;, as confirmed by slide 17 and by the 500,000 total.&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 420 250&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of wages&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;210&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Wages paid 500,000 (VE−)&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;130&quot; width=&quot;304&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;172&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Production 400,000&lt;/text&gt;&lt;text x=&quot;172&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;→ WIP Inventory (capitalized)&lt;/text&gt;
        &lt;rect x=&quot;328&quot; y=&quot;130&quot; width=&quot;72&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;364&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;S.G.&amp;amp;O.&lt;/text&gt;&lt;text x=&quot;364&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;100,000&lt;/text&gt;
        &lt;path d=&quot;M172,76 V126 M364,76 V126&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;172&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;becomes part of the cost of finished goods&lt;/text&gt;
        &lt;text x=&quot;172&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;and reaches the income statement only on sale&lt;/text&gt;
        &lt;text x=&quot;364&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;period&lt;/text&gt;&lt;text x=&quot;364&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;cost&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h4&gt;The resulting income statement&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Profits on sales&lt;/i&gt;&lt;/td&gt;&lt;td&gt;300,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Wages (S.G.&amp;amp;O.)&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(100,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div class=&quot;small&quot;&gt;&lt;p&gt;&lt;b&gt;Where the figures come from.&lt;/b&gt; The cost of finished goods is 400,000 (materials) + 400,000 (production wages) = 800,000 (slide 15). On sale, the bank increases by 1,100,000 and finished goods inventory decreases by 800,000: the difference, 300,000, is the &lt;i&gt;Profit on sales&lt;/i&gt; (slide 16). After deducting the 100,000 of non-production wages, EBIT is 200,000 (slide 17).&lt;/p&gt;&lt;p&gt;The slides state that this income statement would result “&lt;i&gt;theoretically&lt;/i&gt;”: it is the structure the entries produce on their own, before any reclassification.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the entry at the start of production VP+ WIP / VP− Raw Materials, with no VE at all?&lt;/summary&gt;&lt;div&gt;Because the value of net assets does not change: 400,000 of materials become 400,000 of work in progress. Value moves between two asset items; equity is unchanged, so there is no income.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does the entry “VP+ WIP Inventory / VE+ Wages 400,000” mean?&lt;/summary&gt;&lt;div&gt;It is the capitalization of production wages: their value is added to work in progress (an asset) and reversed out of the Wages expense. In this way the cost of production labour will reach the income statement only when the products are sold.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What information is missing from the “Besta-style” income statement?&lt;/summary&gt;&lt;div&gt;Sales volume (revenues) and cost of goods sold: only the margin appears (&lt;i&gt;Profit on sales&lt;/i&gt;). Two companies with very different turnover but the same margin would have the same income statement.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot; data-why=&quot;Sale 1.50 minus cost 0.30 = 1.20 of Profit on sales.&quot;&gt;
      &lt;p&gt;If the bottle (cost 0.30) is sold for 1.50, what is the Profit on sales?&lt;/p&gt;
      &lt;button&gt;1.20&lt;/button&gt;&lt;button&gt;1.50&lt;/button&gt;&lt;button&gt;0.30&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;anglo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Part 3 · slides 18–25&lt;/div&gt;&lt;h2&gt;The Anglo-Saxon variant&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;The &lt;em class=&quot;t&quot;&gt;Anglo-Saxon variant&lt;/em&gt; is still a patrimonial system: the first five events are recorded &lt;b&gt;exactly as in Besta&lt;/b&gt; (slides 19–23). Only one thing changes — the &lt;b&gt;sale&lt;/b&gt;, which is split into two entries (slide 24):&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Besta: one entry&lt;/h4&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Bank&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,100,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Finished Goods Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Profits on sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Revenue and cost are offset immediately: only the net amount remains.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Anglo-Saxon: two entries&lt;/h4&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Bank&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,100,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Revenues&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,100,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag neg&quot;&gt;VE−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;COGS (Cost of Goods Sold)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Finished Goods Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Revenues&lt;/em&gt; (sales revenue) and &lt;em class=&quot;t&quot;&gt;COGS&lt;/em&gt; (&lt;i&gt;Cost of Goods Sold&lt;/i&gt;: the carrying amount of the products sold) are recorded separately.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Step by step&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;a&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;The “cost of sales” income statement&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Revenues&lt;/i&gt;&lt;/td&gt;&lt;td&gt;1,100,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;COGS&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(800,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;&lt;b&gt;Operating Profit&lt;/b&gt;&lt;/td&gt;&lt;td&gt;300,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Sales, Generals and Others – SG&amp;amp;O&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(100,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div&gt;
      &lt;p&gt;The final result is identical (200,000), but the income statement now shows &lt;b&gt;turnover&lt;/b&gt; and &lt;b&gt;gross margin&lt;/b&gt;. The line the slides call &lt;i&gt;Operating Profit&lt;/i&gt; (300,000) coincides with Besta&#x27;s &lt;i&gt;Profit on sales&lt;/i&gt;: in Anglo-Saxon financial statements it is often also called &lt;em class=&quot;t&quot;&gt;gross profit&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;Costs are grouped &lt;b&gt;by function&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;by function&lt;/em&gt;, or &lt;em class=&quot;t&quot;&gt;cost of sales method&lt;/em&gt;): production (within COGS) and selling/general/administrative (SG&amp;amp;O). A wage does not appear as a “wage”: it appears where the work was done.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Under IAS/IFRS, the subject of this module, the choice between presenting operating expenses &lt;b&gt;by nature&lt;/b&gt; or &lt;b&gt;by function&lt;/b&gt; was governed by IAS 1; from 1 January 2027 IAS 1 is replaced by &lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;, which revises the structure of the income statement (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;). The slides for this lecture do not mention the standard: this link should be checked against later lectures.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In which events does the Anglo-Saxon variant differ from Besta?&lt;/summary&gt;&lt;div&gt;Only in the sale: instead of recording the net &lt;i&gt;Profit on sales&lt;/i&gt;, it records &lt;i&gt;Revenues&lt;/i&gt; (1,100,000) and, in a second entry, &lt;i&gt;COGS&lt;/i&gt; (800,000), which derecognizes the finished goods inventory.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the Anglo-Saxon Operating Profit equal to Besta&#x27;s Profit on sales?&lt;/summary&gt;&lt;div&gt;Because Revenues − COGS = 1,100,000 − 800,000 = 300,000: it is the same margin, simply presented gross (revenue and cost shown separately) rather than net.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;COGS is a cost: VE− on the debit side; inventory decreases with VP− on the credit side.&quot;&gt;
      &lt;p&gt;The COGS entry is…&lt;/p&gt;
      &lt;button&gt;VP+ COGS / VE+ Finished Goods&lt;/button&gt;&lt;button&gt;VE− COGS / VP− Finished Goods Inventory&lt;/button&gt;&lt;button&gt;VF− Bank / VE+ COGS&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;reddito&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Part 4 · slides 26–33&lt;/div&gt;&lt;h2&gt;The income system&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;In the &lt;em class=&quot;t&quot;&gt;Income Accounting System&lt;/em&gt; (Zappa&#x27;s school) accounting follows &lt;b&gt;exchanges with third parties&lt;/b&gt;. Every exchange has two faces:&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Financial face · VF&lt;/h4&gt;&lt;p&gt;How much cash (or receivables/payables) moves: &lt;i&gt;Bank&lt;/i&gt;, &lt;i&gt;Cash&lt;/i&gt;, trade receivables, trade payables.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Economic face · VE&lt;/h4&gt;&lt;p&gt;Why it moves: a cost (purchase of materials, wages) or a revenue (sales). It is the cause of the financial change.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Consequence.&lt;/b&gt; &lt;b&gt;Internal&lt;/b&gt; transformations (materials entering production, wages absorbed into work in progress, work in progress becoming finished goods) are not exchanges with third parties, so they &lt;b&gt;are not recorded&lt;/b&gt; (slides 28, 30, 31). Purchased materials are immediately a &lt;b&gt;cost&lt;/b&gt; (VE−), not an asset (slide 27).&lt;/div&gt;

  &lt;h3&gt;Step by step&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;r&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;The income statement “by nature”&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Revenues&lt;/i&gt;&lt;/td&gt;&lt;td&gt;1,100,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Costs of Raw Materials&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(400,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Wages&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(500,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div&gt;
      &lt;p&gt;Costs are presented &lt;b&gt;by nature&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;by nature&lt;/em&gt;): materials, wages, depreciation… regardless of function (production, selling, administration). All 500,000 of wages form a single line. This is the “&lt;b&gt;natural logic&lt;/b&gt;” structure announced in slide 4: it arises directly from the entries, without any need to transfer costs between accounts.&lt;/p&gt;
      &lt;p&gt;Here too EBIT is &lt;b&gt;200,000&lt;/b&gt;: the form changes, not the substance.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;What the slides take for granted: what if inventory remains at year end?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;In the example everything produced is sold in the same period, so no inventory remains at year end. In practice, under the income system, &lt;b&gt;year-end adjusting entries&lt;/b&gt; are made: the value of &lt;b&gt;closing inventories&lt;/b&gt; (materials, work in progress, finished goods still held) is measured and a positive &lt;em class=&quot;t&quot;&gt;change in inventories&lt;/em&gt; is recognized in the income statement. In this way the costs incurred for goods not yet sold are “deferred” to the following period, and the result again equals that of the patrimonial system.&lt;/p&gt;
    &lt;p&gt;You can check this with the “share sold” slider in the &lt;a href=&quot;#confronto&quot;&gt;Part 5 simulator&lt;/a&gt;. &lt;span class=&quot;small&quot;&gt;(Added explanation: not in the slides.)&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does the completion of the production cycle generate no entries in the income system?&lt;/summary&gt;&lt;div&gt;Because there is no exchange with third parties: no financial movement and no new cost or revenue. The income system records only transactions that have both a financial face (VF) and an economic face (VE).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Where do the 400,000 of production wages end up in the income statement by nature?&lt;/summary&gt;&lt;div&gt;In the &lt;i&gt;Wages&lt;/i&gt; line together with the other 100,000: 500,000 in total. There is no breakdown by function and no capitalization into work in progress.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;In the income system the purchase is immediately a cost (VE−) paid from the bank (VF−).&quot;&gt;
      &lt;p&gt;Purchase of raw materials for 400,000 in the income system:&lt;/p&gt;
      &lt;button&gt;VP+ Raw Materials / VP− Bank&lt;/button&gt;&lt;button&gt;VP+ WIP / VF− Bank&lt;/button&gt;&lt;button&gt;VE− Cost of Purchase / VF− Bank&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-acc&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Part 5 · slides 33–34 and synthesis&lt;/div&gt;&lt;h2&gt;Comparison: same result, three narratives&lt;/h2&gt;&lt;/header&gt;

  &lt;h3&gt;The three systems side by side, event by event&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;The same manufacturing cycle in three columns. Note how many cells remain empty in the income system and how the sale splits in two in the Anglo-Saxon variant.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;bar&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Simulator: change the data, watch the income statements&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Materials (400,000) and total wages (500,000) are fixed. You can change the selling price of the entire output, the share of wages that relates to &lt;b&gt;production&lt;/b&gt; and the proportion of products actually &lt;b&gt;sold&lt;/b&gt; within the year. With 100% sold you get the figures from the slides.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;
    &lt;label&gt;Price of the entire output: &lt;output id=&quot;s-p&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sp&quot; min=&quot;600000&quot; max=&quot;1600000&quot; step=&quot;50000&quot; value=&quot;1100000&quot;&gt;&lt;/label&gt;
    &lt;label&gt;Production wages (out of 500,000): &lt;output id=&quot;s-w&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sw&quot; min=&quot;0&quot; max=&quot;500000&quot; step=&quot;50000&quot; value=&quot;400000&quot;&gt;&lt;/label&gt;
    &lt;label&gt;Share sold: &lt;output id=&quot;s-s&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ss&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot; id=&quot;sim&quot;&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart of the three income statements&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;&lt;em class=&quot;t&quot;&gt;Waterfall&lt;/em&gt; chart: each bar starts where the previous one ends; positive items in green, negative items in brick red, EBIT in terracotta. The three waterfalls always end at the same height.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot; id=&quot;sim-msg&quot;&gt;&lt;/p&gt;

  &lt;h3&gt;Summary table&lt;/h3&gt;
  &lt;div style=&quot;overflow-x:auto&quot;&gt;
  &lt;table class=&quot;is card&quot; style=&quot;min-width:620px&quot;&gt;
    &lt;tr style=&quot;font-weight:600&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Besta&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Anglo-Saxon&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Income system&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Object observed&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;net assets&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;net assets&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;income&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Abbreviations used&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VP, VE&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VP, VE&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VF, VE&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Internal movements&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;recorded&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;recorded&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;not recorded&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Purchase of materials&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;asset (inventory)&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;asset (inventory)&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;cost&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Sale&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;Profit on sales only&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;Revenues + COGS&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;Revenues&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Income statement&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;margin − other costs&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;by function&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;by nature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Entries in the example&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;6&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;7&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;3&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Final remarks: what each system is for&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--sage)&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Patrimonial Accounting System&lt;/div&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;Its purpose is to &lt;b&gt;identify the value of the company&#x27;s net assets at any moment&lt;/b&gt; and to understand how it changes as a result of transactions or even of market trends &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;This is why it records every internal step: at any moment the inventories of materials, work in progress and finished goods carry an up-to-date value.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Income Accounting System&lt;/div&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;Its purpose is to &lt;b&gt;determine the company&#x27;s overall economic performance&lt;/b&gt; on the basis of &lt;b&gt;realized revenues&lt;/b&gt; and the related costs &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;This is why it follows exchanges with the market and defers to period end the measurement of what remains within the company.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;Only in the income system is the completion of production not recorded.&quot;&gt;
      &lt;p&gt;“Production cycle completed”: in which system is nothing recorded?&lt;/p&gt;
      &lt;button&gt;Besta&lt;/button&gt;&lt;button&gt;Anglo-Saxon&lt;/button&gt;&lt;button&gt;Income system&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;The Anglo-Saxon variant shows Revenues and COGS, hence both turnover and gross margin.&quot;&gt;
      &lt;p&gt;Which income statement shows both turnover and gross margin?&lt;/p&gt;
      &lt;button&gt;Besta&lt;/button&gt;&lt;button&gt;Anglo-Saxon&lt;/button&gt;&lt;button&gt;Income system&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot; data-why=&quot;The patrimonial system continuously updates the value of net assets (slide 34).&quot;&gt;
      &lt;p&gt;You want to know the value of work-in-progress inventory at any moment. Which system do you need?&lt;/p&gt;
      &lt;button&gt;Patrimonial&lt;/button&gt;&lt;button&gt;Income&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Why do the three systems produce the same EBIT?&lt;/summary&gt;&lt;div&gt;Because they record the same economic events with the same method (double entry): only &lt;i&gt;when&lt;/i&gt; and &lt;i&gt;in which accounts&lt;/i&gt; they are recorded changes. At the end of the cycle, with everything sold, production costs have become expenses in all three cases (as COGS, as a net margin or as costs by nature). If inventory remains, the income system balances through the change in inventories.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Explain in words the difference between an income statement by nature and one by function.&lt;/summary&gt;&lt;div&gt;&lt;b&gt;By nature&lt;/b&gt;: costs are grouped by &lt;i&gt;what they are&lt;/i&gt; (materials, wages…). &lt;b&gt;By function&lt;/b&gt;: by &lt;i&gt;what they are for&lt;/i&gt; (production → COGS; selling, general, administrative → SG&amp;amp;O). The former arises naturally from the income system, the latter from the Anglo-Saxon variant of the patrimonial system.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;External sources · web research, October 2026&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/header&gt;
  &lt;p class=&quot;narrow&quot;&gt;The authors and institutions cited in slides 2–3, each with one reliable reference. Everything below is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;, not slide content: check it against the course texts. Biographical dates vary slightly across sources.&lt;/p&gt;
  &lt;div class=&quot;bib&quot;&gt;
    &lt;article&gt;&lt;h4&gt;Fabio Besta · patrimonial system&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 (1920, Venice) &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Professor at the Scuola Superiore di Commercio in Venice (today&#x27;s Ca&#x27; Foscari) for about 45 years. With his inaugural lecture &lt;i&gt;La Ragioneria&lt;/i&gt; (academic year 1880-81) he broke away from Cerboni&#x27;s personalistic theory of accounts and founded a theory based on &lt;b&gt;values&lt;/b&gt; and &lt;b&gt;net assets&lt;/b&gt;: this is the origin of the “patrimonial system”. His work &lt;i&gt;La Ragioneria&lt;/i&gt; went through several editions (3rd ed. Vallardi, 1916, reprinted in 1922). He matters because he is the starting point of the Italian school and Zappa&#x27;s teacher.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://edizionicafoscari.it/media/pdf/books/978-88-6969-647-3/978-88-6969-647-3-ch-01.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edizioni Ca&#x27; Foscari, volume by Sattin and Coronella (2022) on Besta&#x27;s lectures, ch. 1 (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://phaidra.unipd.it/detail/o:29121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Phaidra – University of Padua: Besta&#x27;s “Ragioneria generale”, vol. 2, digitized&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;William A. Paton · patrimonial system in the USA&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 (1920, USA, “founder of the American Accounting Association”) &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1889–1991). Taught accounting at the University of Michigan for about 45 years. Among the founders of the American Accounting Association in 1916 and its president in 1922-23; first editor of &lt;i&gt;The Accounting Review&lt;/i&gt;. His &lt;i&gt;Accounting Theory, with Special Reference to the Corporate Enterprise&lt;/i&gt; (1922) is a key text of American accounting theory centred on the enterprise&#x27;s assets and equities. The AICPA named him “Educator of the Century” (1987).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://paton.bus.umich.edu/node/11&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Michigan – William Paton Biography&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/William_Andrew_Paton&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia – William Andrew Paton&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;American Accounting Association (AAA)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;American academic accounting association, established in 1916 as the &lt;i&gt;American Association of University Instructors in Accounting&lt;/i&gt; and renamed in the mid-1930s (sources give 1935 or 1936). It has published &lt;i&gt;The Accounting Review&lt;/i&gt; since 1925–26. It matters because it was the vehicle through which American academic accounting theory spread.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://aaahq.org/node/34059&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AAA – “The AAA has a Rich History, Captured in Three Volumes”&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Gino Zappa · income system&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 (Venice, “around 1950”) &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1879–1960). A student of Besta at Ca&#x27; Foscari, where he held the chair from 1921; he also taught at Bocconi. He is regarded as the founder of Italian &lt;b&gt;Economia aziendale&lt;/b&gt; (inaugural lecture of 13 November 1926 on the “new tendencies” in accounting studies). With &lt;i&gt;La determinazione del reddito nelle imprese commerciali&lt;/i&gt; (1920-1929) and &lt;i&gt;Il reddito di impresa&lt;/i&gt; he shifted the object of accounting from net assets to &lt;b&gt;income&lt;/b&gt;: costs and revenues as the causes of financial changes. His system became established after the Second World War, hence the slides&#x27; date of “around 1950”.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://edizionicafoscari.it/media/pdf/books/978-88-6969-259-8/978-88-6969-259-8-ch-06_GIrBnJD.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edizioni Ca&#x27; Foscari – Coronella and Santaniello, chapter on Zappa (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Gino_Zappa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia – Gino Zappa&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://moodle2.units.it/pluginfile.php/420731/mod_resource/content/1/04-Sistema%20del%20reddito.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Trieste – teaching notes “Sistema del reddito” (PDF)&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Pietro Onida&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;A student of Zappa and one of the main continuators of his school. Notable works: &lt;i&gt;Le discipline economico-aziendali. Oggetto e metodo&lt;/i&gt; (1947) and &lt;i&gt;Economia d&#x27;azienda&lt;/i&gt; (UTET, Turin, 1965), a synthesis of the discipline; he also studied North American accounting doctrine (Giuffrè, 1974). I did not find a reliable encyclopaedic biography: the reference below is bibliographic.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://boa.unimib.it/retrieve/e39773b1-daa3-35a3-e053-3a05fe0aac26/From%20Accounting%20to%20Economia%20Aziendale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Milano-Bicocca – “From Accounting to Economia Aziendale” (PDF), on Zappa&#x27;s school and its continuators&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Aldo Amaduzzi&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1904–1991). In the 1950s he developed the “system of capital and economic result”, presented as a variant and evolution of Zappa&#x27;s income system: it distinguishes financial accounts from economic accounts and treats capital and reserves as economic capital accounts. He conceived the firm as an open system interacting with its environment. Reference work: &lt;i&gt;L&#x27;azienda nel suo sistema e nei suoi principi&lt;/i&gt; (UTET).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://www.rmci.ase.ro/no14vol3/02.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review of International Comparative Management – article on Amaduzzi and the firm as an open system (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://iris.unisalento.it/handle/11587/408693&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IRIS University of Salento – study on Amaduzzi&#x27;s thought&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Eugen Schmalenbach · dynamische Bilanz&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 3 (Germany) &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1873–1955). Father of German business economics (&lt;i&gt;Betriebswirtschaftslehre&lt;/i&gt;). In &lt;i&gt;Grundlagen dynamischer Bilanzlehre&lt;/i&gt; (1919-1920, later &lt;i&gt;Dynamische Bilanz&lt;/i&gt;) he argues that the purpose of financial statements is to measure the &lt;b&gt;period result&lt;/b&gt; correctly and compare it over time, not to take a snapshot of net assets (the “static” approach): this is why the slides place him alongside the income system. Translated into English as &lt;i&gt;Dynamic Accounting&lt;/i&gt; (1959).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://cfuc.vse.cz/artkey/cfu-200901-0006_Devadesat-let-dynamicke-bilancni-teorie-Johanna-Wilhelma-Eugena-Schmalenbacha-1873-1955.php?l=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Český finanční a účetní časopis (2009) – “Ninety years of Schmalenbach&#x27;s dynamic balance sheet theory”&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://eaa-online.org/app/uploads/2021/10/7-Accounting-Research-in-Germany-May-2011-1.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Accounting Association – “Accounting Research in Germany” (PDF)&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Double-entry bookkeeping&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Cited on slide 2 &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;The first printed exposition of the method is in Luca Pacioli&#x27;s &lt;i&gt;Summa de arithmetica&lt;/i&gt; (Venice, 1494), which did not invent it but described a practice already in use, the “Venetian method” (&lt;i&gt;modo di Vinegia&lt;/i&gt;). Complete double-entry records exist from at least the late thirteenth century. It matters because it is the common foundation of all the systems in this lecture.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library – Earliest books on bookkeeping&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://www.nls.uk/collections/rare-books/collections/icas/pacioli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;National Library of Scotland – Pacioli&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot; style=&quot;margin-top:1rem&quot;&gt;Link to the course: this is lecture 01a of the module &lt;i&gt;Introduction of international accounting standards&lt;/i&gt; (from the file path). The other materials in the &lt;code&gt;corso/&lt;/code&gt; folder were not used for this summary.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

    var h=&quot;&quot;;[&quot;b&quot;,&quot;a&quot;,&quot;r&quot;].forEach(function(k){h+=&#x27;&lt;div class=&quot;card&quot; style=&quot;--c:&#x27;+COLS[k]+&#x27;&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;&#x27;+NAMES[k]+&#x27;&lt;/div&gt;&#x27;+isHTML(R[k],1)+&#x27;&lt;/div&gt;&#x27;});
