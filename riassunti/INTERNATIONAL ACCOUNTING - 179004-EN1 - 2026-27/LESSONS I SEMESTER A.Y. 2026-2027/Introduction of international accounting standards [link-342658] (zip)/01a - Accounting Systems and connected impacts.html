*{box-sizing:border-box}

&lt;section class=&quot;part p-slate&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Parte 1 · slide 2–4&lt;/div&gt;&lt;h2&gt;Il quadro: una partita doppia, due sistemi&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;Nel mondo esistono vari modi di tenere la contabilità, ma quasi tutti si appoggiano alla &lt;em class=&quot;t&quot;&gt;double-entry bookkeeping&lt;/em&gt; (partita doppia): ogni fatto di gestione si registra &lt;b&gt;almeno in due conti&lt;/b&gt;, una volta in &lt;b&gt;Dare&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;debit&lt;/em&gt;, colonna di sinistra) e una volta in &lt;b&gt;Avere&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;credit&lt;/em&gt;, colonna di destra), per lo stesso importo. Il totale Dare di ogni scrittura è sempre uguale al totale Avere.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Σ Dare = Σ Avere &amp;nbsp;·&amp;nbsp; &lt;span class=&quot;small&quot;&gt;per ogni scrittura&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;La partita doppia è il &lt;i&gt;metodo&lt;/i&gt; (la tecnica di registrazione). Il &lt;b&gt;sistema contabile&lt;/b&gt; è l&#x27;&lt;i&gt;oggetto&lt;/i&gt; che si osserva con quel metodo: quali conti si aprono, quali fatti si registrano e come si legge il risultato. La lezione distingue due grandi famiglie &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;:&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--sage);--cbg:var(--sage-bg)&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Sistema contabile patrimoniale&lt;/div&gt;
      &lt;h4&gt;Patrimonial Accounting System&lt;/h4&gt;
      &lt;p&gt;Al centro c&#x27;è il &lt;b&gt;patrimonio&lt;/b&gt;: si registra ogni variazione del valore degli elementi attivi e passivi, anche quelle interne (materie che diventano semilavorati, semilavorati che diventano prodotti finiti).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Adottato nei &lt;b&gt;paesi anglosassoni&lt;/b&gt;. Contributi: &lt;b&gt;Besta&lt;/b&gt; in Italia (Venezia) e &lt;b&gt;Paton&lt;/b&gt; negli USA (fondatore dell&#x27;American Accounting Association), 1920; poi evoluzioni pratiche nei paesi anglosassoni &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick);--cbg:var(--brick-bg)&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Sistema contabile del reddito&lt;/div&gt;
      &lt;h4&gt;Income Accounting System&lt;/h4&gt;
      &lt;p&gt;Al centro c&#x27;è il &lt;b&gt;reddito&lt;/b&gt;: si registrano solo gli scambi con l&#x27;esterno, cioè una variazione finanziaria (banca, crediti, debiti) e la sua causa economica (costo o ricavo). Le trasformazioni interne non generano scritture.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Adottato in &lt;b&gt;Italia e Germania&lt;/b&gt; e negli altri paesi «Latin European». Contributi: &lt;b&gt;Zappa&lt;/b&gt; in Italia (Venezia), intorno al 1950 e sviluppi successivi; poi &lt;b&gt;Onida&lt;/b&gt; e &lt;b&gt;Amaduzzi&lt;/b&gt;; &lt;b&gt;Schmalenbach&lt;/b&gt; in Germania &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo degli autori citati&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;95&quot; x2=&quot;860&quot; y2=&quot;95&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;

  &lt;h3&gt;Come leggere le scritture delle slide: VP, VE, VF&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Accanto a ogni conto le slide mettono una sigla con un segno. La sigla dice &lt;b&gt;che tipo di valore&lt;/b&gt; si muove, il segno dice &lt;b&gt;se aumenta o diminuisce&lt;/b&gt;. Il colore delle slide (verde = +, rosso = −) sulle VE segnala l&#x27;effetto sul risultato.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Sigle&quot;&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-vp&quot; aria-controls=&quot;p-vp&quot; style=&quot;--tc:var(--sage)&quot;&gt;VP · variazione patrimoniale&lt;/button&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-ve&quot; aria-controls=&quot;p-ve&quot; style=&quot;--tc:var(--ochre)&quot;&gt;VE · variazione economica&lt;/button&gt;
      &lt;button role=&quot;tab&quot; id=&quot;t-vf&quot; aria-controls=&quot;p-vf&quot; style=&quot;--tc:var(--brick)&quot;&gt;VF · variazione finanziaria&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-vp&quot; aria-labelledby=&quot;t-vp&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VP+&lt;/b&gt; = aumenta un elemento attivo del patrimonio (es. &lt;i&gt;Inventory&lt;/i&gt;, &lt;i&gt;Bank&lt;/i&gt;): si scrive in &lt;b&gt;Dare&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VP−&lt;/b&gt; = diminuisce un elemento attivo: si scrive in &lt;b&gt;Avere&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Usata nel sistema patrimoniale (Besta e variante anglosassone) per &lt;b&gt;tutti&lt;/b&gt; gli elementi dell&#x27;attivo e del passivo, banca compresa: nel patrimoniale la banca è un elemento del patrimonio come il magazzino.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-ve&quot; aria-labelledby=&quot;t-ve&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VE−&lt;/b&gt; = componente negativo di reddito, cioè un costo (es. &lt;i&gt;Wages&lt;/i&gt;, &lt;i&gt;COGS&lt;/i&gt;): si scrive in &lt;b&gt;Dare&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VE+&lt;/b&gt; = componente positivo di reddito (es. &lt;i&gt;Revenues&lt;/i&gt;, &lt;i&gt;Profit on sales&lt;/i&gt;) oppure rettifica di un costo: si scrive in &lt;b&gt;Avere&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Le VE alimentano il conto economico e, a fine periodo, il patrimonio netto. Esiste in entrambi i sistemi.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;p-vf&quot; aria-labelledby=&quot;t-vf&quot; class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;b&gt;VF+&lt;/b&gt; = entra denaro o nasce un credito (es. &lt;i&gt;Bank&lt;/i&gt; che aumenta): &lt;b&gt;Dare&lt;/b&gt;.&lt;br&gt;&lt;b&gt;VF−&lt;/b&gt; = esce denaro o nasce un debito: &lt;b&gt;Avere&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Tipica del sistema del reddito: ogni scambio con l&#x27;esterno ha un &lt;b&gt;aspetto finanziario&lt;/b&gt; (VF: quanto denaro, crediti o debiti si muovono) e un &lt;b&gt;aspetto economico&lt;/b&gt; (VE: perché si muovono: costo o ricavo). È la «doppia faccia» della scrittura secondo Zappa.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il banco di prova: un ciclo produttivo tipico&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Per confrontare i sistemi le slide usano &lt;b&gt;tre esempi pratici&lt;/b&gt; sullo stesso ciclo: acquisto delle materie prime, produzione dei prodotti finiti, vendita. Gli esempi si chiudono con la struttura «logica naturale» del conto economico (&lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt;) che esce dalle scritture &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra partita doppia e sistema contabile?&lt;/summary&gt;&lt;div&gt;La partita doppia è il &lt;b&gt;metodo&lt;/b&gt; di registrazione (ogni fatto in Dare e in Avere per lo stesso importo). Il sistema contabile è l&#x27;&lt;b&gt;oggetto&lt;/b&gt; osservato e dice quali conti e quali fatti registrare: il patrimonio e le sue variazioni (patrimoniale) oppure il reddito e le sue cause (del reddito).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale sistema adottano i paesi anglosassoni e quale l&#x27;Italia e la Germania?&lt;/summary&gt;&lt;div&gt;Anglosassoni: &lt;i&gt;Patrimonial Accounting System&lt;/i&gt;. Italia, Germania e altri paesi «Latin European»: &lt;i&gt;Income Accounting System&lt;/i&gt; (slide 2).&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;Nel sistema del reddito la banca è un valore finanziario: VF−.&quot;&gt;
      &lt;p&gt;Nel sistema del reddito, il pagamento in banca si scrive come…&lt;/p&gt;
      &lt;button&gt;VP−&lt;/button&gt;&lt;button&gt;VF−&lt;/button&gt;&lt;button&gt;VE−&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;Paton, negli USA, fu tra i fondatori dell&#x27;American Accounting Association.&quot;&gt;
      &lt;p&gt;Chi, secondo le slide, è il fondatore dell&#x27;American Accounting Association?&lt;/p&gt;
      &lt;button&gt;Zappa&lt;/button&gt;&lt;button&gt;Schmalenbach&lt;/button&gt;&lt;button&gt;Paton&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;besta&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Parte 2 · slide 5–17&lt;/div&gt;&lt;h2&gt;Il sistema patrimoniale secondo Besta&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;Nel &lt;em class=&quot;t&quot;&gt;Patrimonial Accounting System&lt;/em&gt; (sistema patrimoniale) ogni conto rappresenta un elemento del patrimonio. Una scrittura racconta come cambia il patrimonio: un elemento sale, un altro scende. Se la somma algebrica non è zero, la differenza è una &lt;b&gt;variazione del patrimonio netto&lt;/b&gt;, cioè un componente di reddito (VE).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Idea chiave.&lt;/b&gt; Nella versione di Besta, alla vendita non si registrano «ricavi» e «costi» separati: si registra solo il &lt;b&gt;guadagno&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Profit on sales&lt;/em&gt;), cioè la differenza tra quanto entra in cassa e il valore del bene che esce dal magazzino.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Esempio 1 · Azienda commerciale: la bottiglia d&#x27;acqua&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Un&#x27;azienda compra una bottiglia d&#x27;acqua (&lt;em class=&quot;t&quot;&gt;inventory&lt;/em&gt;, merce in magazzino) per 0,30 e la rivende a 1,00 &lt;span class=&quot;src&quot;&gt;slide 6–9&lt;/span&gt;. Muovi il cursore per cambiare il prezzo di vendita.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot; style=&quot;grid-template-columns:1fr&quot;&gt;
    &lt;label&gt;Prezzo di vendita della bottiglia: &lt;output id=&quot;bt-o&quot;&gt;1,00&lt;/output&gt;
      &lt;input type=&quot;range&quot; id=&quot;bt&quot; min=&quot;0.10&quot; max=&quot;2.50&quot; step=&quot;0.05&quot; value=&quot;1.00&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;caption&gt;Purchase of goods &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;th&gt;Sigla&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Inventory (bottle of water)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;caption&gt;Goods have been sold &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;th&gt;Sigla&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-c&quot;&gt;1,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr id=&quot;bt-row&quot;&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot; id=&quot;bt-tag&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot; id=&quot;bt-acc&quot;&gt;Profit on sales&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-d&quot;&gt;&lt;/td&gt;&lt;td class=&quot;n&quot; id=&quot;bt-a&quot;&gt;0,70&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;table class=&quot;is&quot;&gt;&lt;caption class=&quot;small&quot; style=&quot;text-align:left;padding-bottom:.4rem&quot;&gt;Income Statement teorico &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/caption&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Profit on sales&lt;/i&gt;&lt;/td&gt;&lt;td id=&quot;bt-p&quot;&gt;0,70&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;i&gt;Other costs&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(0,00)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td id=&quot;bt-e&quot;&gt;0,70&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;EBIT&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Earnings before interest and taxes&lt;/em&gt;) è il risultato operativo prima di oneri finanziari e imposte. Nota cosa &lt;b&gt;manca&lt;/b&gt;: il conto economico non dice quanto si è venduto (1,00) né quanto costava la merce (0,30). Mostra solo il margine.&lt;/p&gt;
      &lt;p class=&quot;small&quot; id=&quot;bt-msg&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Esempio 2 · Azienda industriale&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Ora il ciclo è completo: materie prime, lavorazione, prodotti finiti, vendita &lt;span class=&quot;src&quot;&gt;slide 10–17&lt;/span&gt;. Scorri i passi: a destra vedi i &lt;b&gt;saldi&lt;/b&gt; dei conti che si accumulano (movimenti dal saldo iniziale zero; un saldo «A» sulla banca indica un&#x27;uscita netta).&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;b&quot;&gt;&lt;/div&gt;

  &lt;h4&gt;Il passaggio delicato: la capitalizzazione dei salari&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;p&gt;I salari pagati sono 500.000 e nascono come costo (&lt;b&gt;VE−&lt;/b&gt;, slide 13). Ma 400.000 sono salari di &lt;b&gt;produzione&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Operations&lt;/em&gt;): hanno lavorato le materie e fanno parte del valore dei semilavorati. Le slide li &lt;b&gt;capitalizzano&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;capitalization&lt;/em&gt;: si spostano da costo dell&#x27;esercizio a valore di un&#x27;attività) con &lt;b&gt;WIP Inventory VP+&lt;/b&gt; in Dare e &lt;b&gt;Wages VE+&lt;/b&gt; in Avere (slide 14).&lt;/p&gt;
      &lt;p&gt;Il conto Wages resta con un saldo di 100.000: sono i salari &lt;b&gt;S.G.&amp;amp;A.&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Sales, General and Administrative&lt;/em&gt;: commerciali, generali e amministrativi), detti anche &lt;b&gt;S.G.&amp;amp;O.&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;Sales, General and Others&lt;/em&gt;). Restano costo del periodo.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Attenzione al refuso.&lt;/b&gt; La slide 13 scrive «and 100 for S.G.&amp;amp;A.»: si intende &lt;b&gt;100.000&lt;/b&gt;, come confermano la slide 17 e il totale di 500.000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 420 250&quot; role=&quot;img&quot; aria-label=&quot;Ripartizione dei salari&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;380&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;210&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Wages pagati 500.000 (VE−)&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;130&quot; width=&quot;304&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
        &lt;text x=&quot;172&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Production 400.000&lt;/text&gt;&lt;text x=&quot;172&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;→ WIP Inventory (capitalizzati)&lt;/text&gt;
        &lt;rect x=&quot;328&quot; y=&quot;130&quot; width=&quot;72&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;364&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;12&quot;&gt;S.G.&amp;amp;O.&lt;/text&gt;&lt;text x=&quot;364&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;100.000&lt;/text&gt;
        &lt;path d=&quot;M172,76 V126 M364,76 V126&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;172&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;entra nel costo dei prodotti finiti&lt;/text&gt;
        &lt;text x=&quot;172&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;e va a conto economico solo con la vendita&lt;/text&gt;
        &lt;text x=&quot;364&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;costo&lt;/text&gt;&lt;text x=&quot;364&quot; y=&quot;221&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;del periodo&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h4&gt;Il conto economico che ne risulta&lt;/h4&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Profits on sales&lt;/i&gt;&lt;/td&gt;&lt;td&gt;300.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Wages (S.G.&amp;amp;O.)&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(100.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div class=&quot;small&quot;&gt;&lt;p&gt;&lt;b&gt;Da dove vengono i numeri.&lt;/b&gt; Il costo dei prodotti finiti è 400.000 (materie) + 400.000 (salari di produzione) = 800.000 (slide 15). Alla vendita la banca sale di 1.100.000, il magazzino prodotti finiti scende di 800.000: la differenza, 300.000, è il &lt;i&gt;Profit on sales&lt;/i&gt; (slide 16). Tolti i 100.000 di salari non di produzione, l&#x27;EBIT è 200.000 (slide 17).&lt;/p&gt;&lt;p&gt;Le slide dicono che questo conto economico risulterebbe «&lt;i&gt;theoretically&lt;/i&gt;»: è la struttura che le scritture producono da sole, prima di qualsiasi riclassificazione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché all&#x27;avvio della produzione la scrittura è VP+ WIP / VP− Raw Materials e non contiene alcuna VE?&lt;/summary&gt;&lt;div&gt;Perché il patrimonio non cambia di valore: 400.000 di materie diventano 400.000 di semilavorati. Si spostano valori tra due elementi dell&#x27;attivo; il patrimonio netto resta uguale, quindi non c&#x27;è reddito.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa significa la scrittura «VP+ WIP Inventory / VE+ Wages 400.000»?&lt;/summary&gt;&lt;div&gt;È la capitalizzazione dei salari di produzione: il loro valore si aggiunge ai semilavorati (attivo) e si storna dal costo Wages. Così il costo del lavoro di produzione andrà a conto economico solo quando i prodotti saranno venduti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale informazione manca nel conto economico «alla Besta»?&lt;/summary&gt;&lt;div&gt;Il volume delle vendite (ricavi) e il costo del venduto: appare solo il margine (&lt;i&gt;Profit on sales&lt;/i&gt;). Due aziende con fatturati molto diversi ma lo stesso margine avrebbero lo stesso conto economico.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot; data-why=&quot;Vendita 1,50 meno costo 0,30 = 1,20 di Profit on sales.&quot;&gt;
      &lt;p&gt;Se la bottiglia (costo 0,30) è venduta a 1,50, quanto vale il Profit on sales?&lt;/p&gt;
      &lt;button&gt;1,20&lt;/button&gt;&lt;button&gt;1,50&lt;/button&gt;&lt;button&gt;0,30&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;anglo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Parte 3 · slide 18–25&lt;/div&gt;&lt;h2&gt;La variante anglosassone&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;La &lt;em class=&quot;t&quot;&gt;Anglo-Saxon variant&lt;/em&gt; resta un sistema patrimoniale: i primi cinque eventi si registrano &lt;b&gt;esattamente come in Besta&lt;/b&gt; (slide 19–23). Cambia una cosa sola, la &lt;b&gt;vendita&lt;/b&gt;, che si scompone in due scritture (slide 24):&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Besta: una scrittura&lt;/h4&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Sigla&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Bank&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.100.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Finished Goods Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800.000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Profits on sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Il ricavo e il costo si compensano subito: resta il netto.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;
      &lt;h4&gt;Anglo-Saxon: due scritture&lt;/h4&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Sigla&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Bank&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.100.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag pos&quot;&gt;VE+&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Revenues&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.100.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;table class=&quot;je&quot;&gt;&lt;tr&gt;&lt;th&gt;Sigla&lt;/th&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag neg&quot;&gt;VE−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;COGS (Cost of Goods Sold)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag&quot;&gt;VP−&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;acc&quot;&gt;Finished Goods Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;800.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Si registrano separatamente i &lt;em class=&quot;t&quot;&gt;Revenues&lt;/em&gt; (ricavi di vendita) e il &lt;em class=&quot;t&quot;&gt;COGS&lt;/em&gt; (&lt;i&gt;Cost of Goods Sold&lt;/i&gt;, costo del venduto: il valore a magazzino dei prodotti ceduti).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;a&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Il conto economico «a costo del venduto»&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Revenues&lt;/i&gt;&lt;/td&gt;&lt;td&gt;1.100.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;COGS&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(800.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;sub&quot;&gt;&lt;td&gt;&lt;b&gt;Operating Profit&lt;/b&gt;&lt;/td&gt;&lt;td&gt;300.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Sales, Generals and Others – SG&amp;amp;O&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(100.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div&gt;
      &lt;p&gt;Il risultato finale è identico (200.000), ma ora il conto economico mostra il &lt;b&gt;fatturato&lt;/b&gt; e il &lt;b&gt;margine lordo&lt;/b&gt;. La riga che le slide chiamano &lt;i&gt;Operating Profit&lt;/i&gt; (300.000) coincide con il &lt;i&gt;Profit on sales&lt;/i&gt; di Besta: nei bilanci anglosassoni è spesso chiamata anche &lt;em class=&quot;t&quot;&gt;gross profit&lt;/em&gt; (margine lordo).&lt;/p&gt;
      &lt;p&gt;I costi sono raggruppati &lt;b&gt;per funzione&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;by function&lt;/em&gt;, o &lt;em class=&quot;t&quot;&gt;cost of sales method&lt;/em&gt;): produzione (dentro il COGS), vendita/generale/amministrazione (SG&amp;amp;O). Un salario non appare come «salario»: appare dove ha lavorato.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Nei principi IAS/IFRS, che sono il tema del modulo, la scelta tra presentare i costi operativi &lt;b&gt;per natura&lt;/b&gt; o &lt;b&gt;per funzione&lt;/b&gt; era disciplinata dallo IAS 1; dal 1° gennaio 2027 lo IAS 1 è sostituito dall&#x27;&lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;, che rivede la struttura del conto economico (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;). Le slide di questa lezione non citano lo standard: è un collegamento da verificare con le lezioni successive.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;In quali eventi la variante anglosassone differisce da Besta?&lt;/summary&gt;&lt;div&gt;Solo nella vendita: invece di registrare il &lt;i&gt;Profit on sales&lt;/i&gt; netto, registra i &lt;i&gt;Revenues&lt;/i&gt; (1.100.000) e, con una seconda scrittura, il &lt;i&gt;COGS&lt;/i&gt; (800.000) che scarica il magazzino prodotti finiti.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;Operating Profit anglosassone è uguale al Profit on sales di Besta?&lt;/summary&gt;&lt;div&gt;Perché Revenues − COGS = 1.100.000 − 800.000 = 300.000: è lo stesso margine, solo esposto in forma lorda (ricavi e costo separati) invece che netta.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;Il COGS è un costo: VE− in Dare; il magazzino scende con VP− in Avere.&quot;&gt;
      &lt;p&gt;La scrittura del COGS è…&lt;/p&gt;
      &lt;button&gt;VP+ COGS / VE+ Finished Goods&lt;/button&gt;&lt;button&gt;VE− COGS / VP− Finished Goods Inventory&lt;/button&gt;&lt;button&gt;VF− Bank / VE+ COGS&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;reddito&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Parte 4 · slide 26–33&lt;/div&gt;&lt;h2&gt;Il sistema del reddito&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;narrow&quot;&gt;
  &lt;p&gt;Nell&#x27;&lt;em class=&quot;t&quot;&gt;Income Accounting System&lt;/em&gt; (sistema del reddito, scuola di Zappa) la contabilità segue gli &lt;b&gt;scambi con l&#x27;esterno&lt;/b&gt;. Ogni scambio ha due facce:&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Faccia finanziaria · VF&lt;/h4&gt;&lt;p&gt;Quanto denaro (o credito/debito) si muove: &lt;i&gt;Bank&lt;/i&gt;, &lt;i&gt;Cash&lt;/i&gt;, crediti verso clienti, debiti verso fornitori.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Faccia economica · VE&lt;/h4&gt;&lt;p&gt;Perché si muove: un costo (acquisto di materie, salari) o un ricavo (vendite). È la causa della variazione finanziaria.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Conseguenza.&lt;/b&gt; Le trasformazioni &lt;b&gt;interne&lt;/b&gt; (materie che entrano in lavorazione, salari che si incorporano nei semilavorati, semilavorati che diventano prodotti finiti) non sono scambi con l&#x27;esterno, quindi &lt;b&gt;non si registrano&lt;/b&gt; (slide 28, 30, 31). Le materie acquistate sono subito un &lt;b&gt;costo&lt;/b&gt; (VE−), non un&#x27;attività (slide 27).&lt;/div&gt;

  &lt;h3&gt;Passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;r&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Il conto economico «per natura»&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;table class=&quot;is card&quot;&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Revenues&lt;/i&gt;&lt;/td&gt;&lt;td&gt;1.100.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Costs of Raw Materials&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(400.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;i&gt;Wages&lt;/i&gt;&lt;/td&gt;&lt;td class=&quot;minus&quot;&gt;(500.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Earnings before interest and taxes&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;div&gt;
      &lt;p&gt;I costi compaiono per &lt;b&gt;natura&lt;/b&gt; (&lt;em class=&quot;t&quot;&gt;by nature&lt;/em&gt;): materie, salari, ammortamenti… indipendentemente dalla funzione (produzione, vendite, amministrazione). Tutti i 500.000 di salari sono una riga sola. È questa la struttura «&lt;b&gt;logica naturale&lt;/b&gt;» annunciata nella slide 4: nasce direttamente dalle scritture, senza bisogno di spostare costi tra conti.&lt;/p&gt;
      &lt;p&gt;Anche qui l&#x27;EBIT è &lt;b&gt;200.000&lt;/b&gt;: cambia la forma, non la sostanza.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;Ciò che le slide danno per scontato: e se a fine anno restano scorte?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Nell&#x27;esempio tutto ciò che si produce viene venduto nello stesso periodo, quindi nessun magazzino resta a fine anno. Nella realtà, nel sistema del reddito, a fine esercizio si fanno le &lt;b&gt;scritture di assestamento&lt;/b&gt;: si rileva il valore delle &lt;b&gt;rimanenze finali&lt;/b&gt; (materie, semilavorati, prodotti finiti ancora in azienda) e si porta a conto economico una &lt;em class=&quot;t&quot;&gt;change in inventories&lt;/em&gt; (variazione delle rimanenze) positiva. Così i costi sostenuti per beni non ancora venduti vengono «rinviati» al periodo successivo e il risultato torna uguale a quello del sistema patrimoniale.&lt;/p&gt;
    &lt;p&gt;Puoi verificarlo con il cursore «quota venduta» nel &lt;a href=&quot;#confronto&quot;&gt;simulatore della Parte 5&lt;/a&gt;. &lt;span class=&quot;small&quot;&gt;(Spiegazione aggiunta: non è nelle slide.)&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché la conclusione del ciclo produttivo non genera scritture nel sistema del reddito?&lt;/summary&gt;&lt;div&gt;Perché non c&#x27;è alcuno scambio con l&#x27;esterno: nessun movimento finanziario e nessun costo o ricavo nuovo. Il sistema del reddito registra solo le operazioni che hanno una faccia finanziaria (VF) e una economica (VE).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dove finiscono i 400.000 di salari di produzione nel conto economico per natura?&lt;/summary&gt;&lt;div&gt;Nella riga &lt;i&gt;Wages&lt;/i&gt; insieme agli altri 100.000: 500.000 in tutto. Non c&#x27;è distinzione per funzione e non c&#x27;è capitalizzazione nei semilavorati.&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;Nel reddito l&#x27;acquisto è subito un costo (VE−) pagato dalla banca (VF−).&quot;&gt;
      &lt;p&gt;Acquisto di materie prime per 400.000 nel sistema del reddito:&lt;/p&gt;
      &lt;button&gt;VP+ Raw Materials / VP− Bank&lt;/button&gt;&lt;button&gt;VP+ WIP / VF− Bank&lt;/button&gt;&lt;button&gt;VE− Cost of Purchase / VF− Bank&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-acc&quot; id=&quot;confronto&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Parte 5 · slide 33–34 e sintesi&lt;/div&gt;&lt;h2&gt;Confronto: stesso risultato, tre racconti&lt;/h2&gt;&lt;/header&gt;

  &lt;h3&gt;I tre sistemi affiancati, evento per evento&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Lo stesso ciclo industriale nelle tre colonne. Nota quante celle restano vuote nel sistema del reddito e come la vendita si sdoppia nella variante anglosassone.&lt;/p&gt;
  &lt;div class=&quot;stepper&quot; data-sys=&quot;bar&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Simulatore: cambia i dati, guarda i conti economici&lt;/h3&gt;
  &lt;p class=&quot;narrow&quot;&gt;Le materie (400.000) e i salari totali (500.000) restano fissi. Puoi cambiare il prezzo di vendita dell&#x27;intera produzione, la parte di salari che è di &lt;b&gt;produzione&lt;/b&gt; e la quota di prodotti effettivamente &lt;b&gt;venduta&lt;/b&gt; entro l&#x27;anno. Con il 100% venduto ritrovi i numeri delle slide.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot;&gt;
    &lt;label&gt;Prezzo dell&#x27;intera produzione: &lt;output id=&quot;s-p&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sp&quot; min=&quot;600000&quot; max=&quot;1600000&quot; step=&quot;50000&quot; value=&quot;1100000&quot;&gt;&lt;/label&gt;
    &lt;label&gt;Salari di produzione (su 500.000): &lt;output id=&quot;s-w&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sw&quot; min=&quot;0&quot; max=&quot;500000&quot; step=&quot;50000&quot; value=&quot;400000&quot;&gt;&lt;/label&gt;
    &lt;label&gt;Quota venduta: &lt;output id=&quot;s-s&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ss&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot; id=&quot;sim&quot;&gt;&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata dei tre conti economici&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Grafico a cascata (&lt;em class=&quot;t&quot;&gt;waterfall&lt;/em&gt;): ogni barra parte da dove finisce la precedente; in verde le voci positive, in mattone le negative, in terracotta l&#x27;EBIT. Le tre cascate arrivano sempre alla stessa altezza.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot; id=&quot;sim-msg&quot;&gt;&lt;/p&gt;

  &lt;h3&gt;Tabella di sintesi&lt;/h3&gt;
  &lt;div style=&quot;overflow-x:auto&quot;&gt;
  &lt;table class=&quot;is card&quot; style=&quot;min-width:620px&quot;&gt;
    &lt;tr style=&quot;font-weight:600&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Besta&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Anglo-Saxon&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Income system&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Oggetto osservato&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;patrimonio&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;patrimonio&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;reddito&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Sigle usate&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VP, VE&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VP, VE&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;VF, VE&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Movimenti interni&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;registrati&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;registrati&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;non registrati&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Acquisto materie&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;attività (inventory)&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;attività (inventory)&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;costo&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Vendita&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;solo Profit on sales&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;Revenues + COGS&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;Revenues&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;margine − altri costi&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;per funzione&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;per natura&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Scritture nell&#x27;esempio&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;6&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;7&lt;/td&gt;&lt;td style=&quot;text-align:left;font-weight:400&quot;&gt;3&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;td&gt;200.000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;/div&gt;

  &lt;h3&gt;Final remarks: a che cosa serve ciascun sistema&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--sage)&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Patrimonial Accounting System&lt;/div&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;Serve a &lt;b&gt;identificare in ogni momento il valore del patrimonio&lt;/b&gt; dell&#x27;azienda e a capire come cambia con le operazioni o anche con l&#x27;andamento del mercato &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Per questo registra ogni passaggio interno: in qualsiasi istante il magazzino materie, semilavorati e prodotti finiti ha un valore aggiornato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Income Accounting System&lt;/div&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;Serve a &lt;b&gt;definire la performance economica complessiva&lt;/b&gt; dell&#x27;azienda sulla base dei &lt;b&gt;ricavi realizzati&lt;/b&gt; e dei costi correlati &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Per questo segue gli scambi con il mercato e rimanda a fine periodo la valutazione di ciò che resta in azienda.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot; data-why=&quot;Solo nel sistema del reddito la fine della produzione non si registra.&quot;&gt;
      &lt;p&gt;«Production cycle completed»: in quale sistema non si registra nulla?&lt;/p&gt;
      &lt;button&gt;Besta&lt;/button&gt;&lt;button&gt;Anglo-Saxon&lt;/button&gt;&lt;button&gt;Income system&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot; data-why=&quot;La variante anglosassone mostra Revenues e COGS, quindi ricavi e margine lordo.&quot;&gt;
      &lt;p&gt;Quale conto economico permette di leggere sia il fatturato sia il margine lordo?&lt;/p&gt;
      &lt;button&gt;Besta&lt;/button&gt;&lt;button&gt;Anglo-Saxon&lt;/button&gt;&lt;button&gt;Income system&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot; data-why=&quot;Il patrimoniale aggiorna di continuo il valore del patrimonio (slide 34).&quot;&gt;
      &lt;p&gt;Vuoi conoscere in ogni momento il valore del magazzino semilavorati. Quale sistema ti serve?&lt;/p&gt;
      &lt;button&gt;Patrimoniale&lt;/button&gt;&lt;button&gt;Del reddito&lt;/button&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Perché i tre sistemi danno lo stesso EBIT?&lt;/summary&gt;&lt;div&gt;Perché registrano gli stessi fatti economici con lo stesso metodo (partita doppia): cambia solo &lt;i&gt;quando&lt;/i&gt; e &lt;i&gt;in quali conti&lt;/i&gt; si registrano. Alla fine del ciclo, con tutto venduto, i costi di produzione sono diventati costo in tutti e tre i casi (come COGS, come margine netto o come costi per natura). Se restano scorte, il sistema del reddito pareggia con la variazione delle rimanenze.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Spiega a parole la differenza tra conto economico per natura e per funzione.&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Per natura&lt;/b&gt;: i costi sono raggruppati per &lt;i&gt;che cosa sono&lt;/i&gt; (materie, salari…). &lt;b&gt;Per funzione&lt;/b&gt;: per &lt;i&gt;a che cosa servono&lt;/i&gt; (produzione → COGS; vendite, generali, amministrative → SG&amp;amp;O). Il primo nasce naturalmente dal sistema del reddito, il secondo dalla variante anglosassone del patrimoniale.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne · ricerche web, ottobre 2026&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/header&gt;
  &lt;p class=&quot;narrow&quot;&gt;Gli autori e le istituzioni citati nelle slide 2–3, con un riferimento affidabile ciascuno. Tutto ciò che segue è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;, non contenuto delle slide: verificalo sui testi del corso. Le date biografiche variano un po&#x27; tra le fonti.&lt;/p&gt;
  &lt;div class=&quot;bib&quot;&gt;
    &lt;article&gt;&lt;h4&gt;Fabio Besta · sistema patrimoniale&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 (1920, Venezia) &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Docente alla Scuola Superiore di Commercio di Venezia (l&#x27;attuale Ca&#x27; Foscari) per circa 45 anni. Con la prolusione &lt;i&gt;La Ragioneria&lt;/i&gt; (anno accademico 1880-81) si stacca dalla teoria personalistica dei conti di Cerboni e fonda una teoria basata sui &lt;b&gt;valori&lt;/b&gt; e sul &lt;b&gt;patrimonio&lt;/b&gt;: è l&#x27;origine del «sistema patrimoniale». L&#x27;opera &lt;i&gt;La Ragioneria&lt;/i&gt; ebbe più edizioni (3ª ed. Vallardi, 1916, ristampata nel 1922). Conta perché è il punto di partenza della scuola italiana e il maestro di Zappa.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://edizionicafoscari.it/media/pdf/books/978-88-6969-647-3/978-88-6969-647-3-ch-01.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edizioni Ca&#x27; Foscari, volume di Sattin e Coronella (2022) sulle lezioni di Besta, cap. 1 (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://phaidra.unipd.it/detail/o:29121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Phaidra – Università di Padova: «Ragioneria generale» di Besta, vol. 2, digitalizzato&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;William A. Paton · patrimonial system negli USA&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 (1920, USA, «founder of the American Accounting Association») &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1889–1991). Ha insegnato contabilità all&#x27;Università del Michigan per circa 45 anni. Tra i fondatori dell&#x27;American Accounting Association nel 1916 e presidente nel 1922-23; primo direttore di &lt;i&gt;The Accounting Review&lt;/i&gt;. Il suo &lt;i&gt;Accounting Theory, with Special Reference to the Corporate Enterprise&lt;/i&gt; (1922) è un testo chiave della teoria contabile americana centrata sul patrimonio dell&#x27;impresa. L&#x27;AICPA lo ha nominato «Educator of the Century» (1987).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://paton.bus.umich.edu/node/11&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Michigan – William Paton Biography&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/William_Andrew_Paton&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia – William Andrew Paton&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;American Accounting Association (AAA)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citata a slide 3 &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Associazione accademica americana di contabilità, costituita nel 1916 come &lt;i&gt;American Association of University Instructors in Accounting&lt;/i&gt; e rinominata a metà anni Trenta (le fonti indicano 1935 o 1936). Pubblica &lt;i&gt;The Accounting Review&lt;/i&gt; dal 1925–26. Conta perché è stata il veicolo con cui la teoria contabile accademica americana si è diffusa.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://aaahq.org/node/34059&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AAA – «The AAA has a Rich History, Captured in Three Volumes»&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Gino Zappa · sistema del reddito&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 (Venezia, «around 1950») &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1879–1960). Allievo di Besta a Ca&#x27; Foscari, dove ebbe la cattedra dal 1921; insegnò anche alla Bocconi. È considerato il fondatore dell&#x27;&lt;b&gt;Economia aziendale&lt;/b&gt; italiana (prolusione del 13 novembre 1926 sulle «tendenze nuove» negli studi di ragioneria). Con &lt;i&gt;La determinazione del reddito nelle imprese commerciali&lt;/i&gt; (1920-1929) e &lt;i&gt;Il reddito di impresa&lt;/i&gt; sposta l&#x27;oggetto della contabilità dal patrimonio al &lt;b&gt;reddito&lt;/b&gt;: costi e ricavi come cause delle variazioni finanziarie. Il suo sistema si afferma nel secondo dopoguerra, da cui la data «around 1950» delle slide.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://edizionicafoscari.it/media/pdf/books/978-88-6969-259-8/978-88-6969-259-8-ch-06_GIrBnJD.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edizioni Ca&#x27; Foscari – Coronella e Santaniello, capitolo su Zappa (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Gino_Zappa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia – Gino Zappa&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://moodle2.units.it/pluginfile.php/420731/mod_resource/content/1/04-Sistema%20del%20reddito.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Trieste – dispensa didattica «Sistema del reddito» (PDF)&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Pietro Onida&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;Allievo di Zappa e tra i principali continuatori della sua scuola. Opere ricordate: &lt;i&gt;Le discipline economico-aziendali. Oggetto e metodo&lt;/i&gt; (1947) ed &lt;i&gt;Economia d&#x27;azienda&lt;/i&gt; (UTET, Torino, 1965), sintesi della disciplina; ha studiato anche la dottrina contabile nordamericana (Giuffrè, 1974). Non ho trovato una voce biografica enciclopedica affidabile: il riferimento qui sotto è bibliografico.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://boa.unimib.it/retrieve/e39773b1-daa3-35a3-e053-3a05fe0aac26/From%20Accounting%20to%20Economia%20Aziendale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Milano-Bicocca – «From Accounting to Economia Aziendale» (PDF), sulla scuola di Zappa e i suoi continuatori&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Aldo Amaduzzi&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1904–1991). Elabora negli anni Cinquanta il «sistema del capitale e del risultato economico», presentato come variante ed evoluzione del sistema del reddito di Zappa: distingue conti finanziari e conti economici e tratta capitale e riserve come conti economici di capitale. Concepisce l&#x27;azienda come sistema aperto in relazione con l&#x27;ambiente. Opera di riferimento: &lt;i&gt;L&#x27;azienda nel suo sistema e nei suoi principi&lt;/i&gt; (UTET).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://www.rmci.ase.ro/no14vol3/02.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review of International Comparative Management – articolo su Amaduzzi e l&#x27;azienda come sistema aperto (PDF)&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://iris.unisalento.it/handle/11587/408693&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IRIS Università del Salento – studio sul pensiero di Amaduzzi&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Eugen Schmalenbach · dynamische Bilanz&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citato a slide 3 (Germania) &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;(1873–1955). Padre dell&#x27;economia aziendale tedesca (&lt;i&gt;Betriebswirtschaftslehre&lt;/i&gt;). Nella &lt;i&gt;Grundlagen dynamischer Bilanzlehre&lt;/i&gt; (1919-1920, poi &lt;i&gt;Dynamische Bilanz&lt;/i&gt;) sostiene che lo scopo del bilancio è misurare correttamente il &lt;b&gt;risultato di periodo&lt;/b&gt; e confrontarlo nel tempo, non fotografare il patrimonio (approccio «statico»): per questo le slide lo affiancano al sistema del reddito. Tradotto in inglese come &lt;i&gt;Dynamic Accounting&lt;/i&gt; (1959).&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://cfuc.vse.cz/artkey/cfu-200901-0006_Devadesat-let-dynamicke-bilancni-teorie-Johanna-Wilhelma-Eugena-Schmalenbacha-1873-1955.php?l=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Český finanční a účetní časopis (2009) – «Novant&#x27;anni di teoria dinamica del bilancio di Schmalenbach»&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://eaa-online.org/app/uploads/2021/10/7-Accounting-Research-in-Germany-May-2011-1.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Accounting Association – «Accounting Research in Germany» (PDF)&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;

    &lt;article&gt;&lt;h4&gt;Double-entry bookkeeping · la partita doppia&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Citata a slide 2 &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;La prima esposizione a stampa del metodo è nella &lt;i&gt;Summa de arithmetica&lt;/i&gt; di Luca Pacioli (Venezia, 1494), che però non la inventa: descrive una prassi già in uso, il «modo di Vinegia». Registri in partita doppia completa esistono almeno dalla fine del Duecento. Conta perché è la base comune a tutti i sistemi della lezione.&lt;/p&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library – Earliest books on bookkeeping&lt;/a&gt;&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://www.nls.uk/collections/rare-books/collections/icas/pacioli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;National Library of Scotland – Pacioli&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot; style=&quot;margin-top:1rem&quot;&gt;Collegamento al corso: questa è la lezione 01a del modulo &lt;i&gt;Introduction of international accounting standards&lt;/i&gt; (dal percorso del file). Gli altri materiali della cartella &lt;code&gt;corso/&lt;/code&gt; non sono stati usati per questo riassunto.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;

    var h=&quot;&quot;;
    sys.forEach(function(k){
      h+=&#x27;&lt;div class=&quot;st-col flash&quot; style=&quot;--c:&#x27;+COLS[k]+&#x27;&quot;&gt;&#x27;+(sys.length&gt;1?&quot;&lt;h5&gt;&quot;+NAMES[k]+&quot;&lt;/h5&gt;&quot;:&quot;&quot;);
      if(s.is){h+=isHTML(IS[k])+balances(k,5)}
      else{
        var e=s[k];
        h+=e?e.map(jeHTML).join(&quot;&quot;):&#x27;&lt;div class=&quot;noentry&quot;&gt;&#x27;+esc(s.nr)+&#x27;&lt;/div&gt;&#x27;;
        h+=&#x27;&lt;p class=&quot;small&quot; style=&quot;margin:.5rem 0 0&quot;&gt;&#x27;+esc(s.w[k])+&#x27;&lt;/p&gt;&#x27;+balances(k,cur);
      }
      h+=&quot;&lt;/div&gt;&quot;;
    });
    cols.innerHTML=h;
    db.forEach(function(b,i){b.classList.toggle(&quot;on&quot;,i===cur);b.setAttribute(&quot;aria-current&quot;,i===cur?&quot;step&quot;:&quot;false&quot;)});
    pv.disabled=cur===0;nx.disabled=cur===STEPS.length-1;
  }
  pv.addEventListener(&quot;click&quot;,function(){if(cur&gt;0){cur--;render()}});
  nx.addEventListener(&quot;click&quot;,function(){if(cur&lt;STEPS.length-1){cur++;render()}});
  db.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){cur=i;render()})});
  render();
});

/* ---------- bottiglia ---------- */
var bt=$(&quot;#bt&quot;);
if(bt){
  var f2=function(n){return Math.abs(n).toFixed(2).replace(&quot;.&quot;,&quot;,&quot;)};
  var upd=function(){
    var p=+bt.value,g=Math.round((p-0.30)*100)/100;
    $(&quot;#bt-o&quot;).textContent=f2(p);$(&quot;#bt-c&quot;).textContent=f2(p);
    var tag=$(&quot;#bt-tag&quot;);
    if(g&gt;=0){tag.textContent=&quot;VE+&quot;;tag.className=&quot;tag pos&quot;;$(&quot;#bt-acc&quot;).textContent=&quot;Profit on sales&quot;;$(&quot;#bt-a&quot;).textContent=f2(g);$(&quot;#bt-d&quot;).textContent=&quot;&quot;}
    else{tag.textContent=&quot;VE−&quot;;tag.className=&quot;tag neg&quot;;$(&quot;#bt-acc&quot;).textContent=&quot;Loss on sales&quot;;$(&quot;#bt-d&quot;).textContent=f2(g);$(&quot;#bt-a&quot;).textContent=&quot;&quot;}
    $(&quot;#bt-p&quot;).textContent=g&lt;0?&quot;(&quot;+f2(g)+&quot;)&quot;:f2(g);$(&quot;#bt-p&quot;).className=g&lt;0?&quot;minus&quot;:&quot;&quot;;
    $(&quot;#bt-e&quot;).textContent=g&lt;0?&quot;(&quot;+f2(g)+&quot;)&quot;:f2(g);
    $(&quot;#bt-msg&quot;).textContent=g&lt;0?&quot;Prezzo sotto il costo: l&#x27;incasso non copre il valore della merce che esce, la differenza è una perdita (VE− in Dare). Questa variante non è nelle slide.&quot;:g===0?&quot;Prezzo uguale al costo: il patrimonio cambia composizione (merce → cassa) ma non valore. Nessun reddito.&quot;:&quot;&quot;;
  };
  bt.addEventListener(&quot;input&quot;,upd);upd();
}

/* ---------- simulatore ---------- */
var sp=$(&quot;#sp&quot;),sw=$(&quot;#sw&quot;),ss=$(&quot;#ss&quot;);
if(sp){
  var NS=&quot;http://www.w3.org/2000/svg&quot;,wf=$(&quot;#wf&quot;);
  var simUpd=function(){
    var P=+sp.value,Wp=+sw.value,s=+ss.value/100,cost=400000+Wp,rev=P*s,cogs=cost*s,clo=cost-cogs,sgo=500000-Wp,ebit=rev-cogs-sgo;
    $(&quot;#s-p&quot;).textContent=fmt(P);$(&quot;#s-w&quot;).textContent=fmt(Wp);$(&quot;#s-s&quot;).textContent=Math.round(s*100)+&quot;%&quot;;
    var R={
      b:[[&quot;Profits on sales&quot;,rev-cogs],[&quot;Wages (S.G.&amp;O.)&quot;,-sgo],[&quot;Earnings before interest and taxes&quot;,ebit,&quot;tot&quot;]],
      a:[[&quot;Revenues&quot;,rev],[&quot;COGS&quot;,-cogs],[&quot;Operating Profit&quot;,rev-cogs,&quot;sub&quot;],[&quot;SG&amp;O&quot;,-sgo],[&quot;Earnings before interest and taxes&quot;,ebit,&quot;tot&quot;]],
      r:[[&quot;Revenues&quot;,rev],[&quot;Costs of Raw Materials&quot;,-400000],[&quot;Wages&quot;,-500000],[&quot;Change in inventories *&quot;,clo],[&quot;Earnings before interest and taxes&quot;,ebit,&quot;tot&quot;]]
    };
    var h=&quot;&quot;;[&quot;b&quot;,&quot;a&quot;,&quot;r&quot;].forEach(function(k){h+=&#x27;&lt;div class=&quot;card&quot; style=&quot;--c:&#x27;+COLS[k]+&#x27;&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;&#x27;+NAMES[k]+&#x27;&lt;/div&gt;&#x27;+isHTML(R[k],1)+&#x27;&lt;/div&gt;&#x27;});
    $(&quot;#sim&quot;).innerHTML=h;
    $(&quot;#sim-msg&quot;).innerHTML=s===1?&quot;&lt;b&gt;Tutto venduto.&lt;/b&gt; I salari di produzione spostano costi tra le righe (da SG&amp;amp;O a COGS) ma non cambiano l&#x27;EBIT. * La riga «Change in inventories» è un&#x27;aggiunta che spiega le scritture di fine anno; nelle slide non c&#x27;è perché le scorte finali sono zero.&quot;:
      &quot;&lt;b&gt;Restano a magazzino prodotti finiti per &quot;+fmt(clo)+&quot;.&lt;/b&gt; Il sistema patrimoniale li ha già nel conto &lt;i&gt;Finished Goods Inventory&lt;/i&gt;; il sistema del reddito li recupera a fine anno con la &lt;i&gt;change in inventories&lt;/i&gt; (*, aggiunta non presente nelle slide). Ora i salari di produzione contano: più salari capitalizzati significa più costo rinviato in magazzino e un EBIT più alto nell&#x27;anno.&quot;;
    /* waterfall */
    var W={b:[[&quot;Profit&quot;,rev-cogs],[&quot;SG&amp;O&quot;,-sgo],[&quot;EBIT&quot;,ebit,1]],a:[[&quot;Rev.&quot;,rev],[&quot;COGS&quot;,-cogs],[&quot;Op. P.&quot;,rev-cogs,1],[&quot;SG&amp;O&quot;,-sgo],[&quot;EBIT&quot;,ebit,1]],r:[[&quot;Rev.&quot;,rev],[&quot;Mat.&quot;,-400000],[&quot;Wages&quot;,-500000],[&quot;ΔInv&quot;,clo],[&quot;EBIT&quot;,ebit,1]]};
    var mx=0,mn=0;[&quot;b&quot;,&quot;a&quot;,&quot;r&quot;].forEach(function(k){var c=0;W[k].forEach(function(it){if(it[2]){mx=Math.max(mx,it[1]);mn=Math.min(mn,it[1]);c=it[1]}else{c+=it[1];mx=Math.max(mx,c,c-it[1]);mn=Math.min(mn,c,c-it[1])}})});
    var top=48,bot=262,y=function(v){return top+(mx-v)/((mx-mn)||1)*(bot-top)};
    while(wf.firstChild)wf.removeChild(wf.firstChild);
    var el=function(n,a,t){var e=document.createElementNS(NS,n);for(var x in a)e.setAttribute(x,a[x]);if(t!=null)e.textContent=t;wf.appendChild(e);return e};
    [&quot;b&quot;,&quot;a&quot;,&quot;r&quot;].forEach(function(k,gi){
      var x0=gi*300+20,bw=38,gap=14,c=0,n=W[k].length,xs=x0+(260-n*(bw+gap)+gap)/2;
      el(&quot;text&quot;,{x:x0+130,y:20,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-weight&quot;:&quot;600&quot;,&quot;font-size&quot;:&quot;13&quot;,fill:COLS[k]},NAMES[k]);
      el(&quot;line&quot;,{x1:x0,x2:x0+260,y1:y(0),y2:y(0),stroke:&quot;var(--ink2)&quot;,&quot;stroke-width&quot;:&quot;1&quot;});
      W[k].forEach(function(it,i){
        var a,b2,col;
        if(it[2]){a=0;b2=it[1];c=it[1];col=&quot;var(--accent)&quot;}else{a=c;b2=c+it[1];c=b2;col=it[1]&gt;=0?&quot;var(--sage)&quot;:&quot;var(--brick)&quot;}
        var xx=xs+i*(bw+gap),y1=y(Math.max(a,b2)),hh=Math.max(1,Math.abs(y(a)-y(b2)));
        el(&quot;rect&quot;,{x:xx,y:y1,width:bw,height:hh,rx:3,fill:col,opacity:it[2]?1:.85});
        el(&quot;text&quot;,{x:xx+bw/2,y:y1-5,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:&quot;10&quot;},fmt(it[1]/1000));
        el(&quot;text&quot;,{x:xx+bw/2,y:288,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:&quot;10.5&quot;,fill:&quot;var(--ink2)&quot;},it[0]);
      });
    });
    el(&quot;text&quot;,{x:890,y:20,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:&quot;10&quot;,fill:&quot;var(--ink2)&quot;},&quot;valori in migliaia&quot;);
  };
  [sp,sw,ss].forEach(function(i){i.addEventListener(&quot;input&quot;,simUpd)});simUpd();
}
})();
&lt;/script&gt;
