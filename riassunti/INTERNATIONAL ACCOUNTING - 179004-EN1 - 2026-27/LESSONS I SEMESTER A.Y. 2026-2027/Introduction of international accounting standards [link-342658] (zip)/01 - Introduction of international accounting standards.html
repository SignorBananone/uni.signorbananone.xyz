&lt;!-- ============ PARTE I ============ --&gt;
&lt;div class=&quot;part p-ochre&quot; id=&quot;parte1&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;I&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Parte I&lt;/p&gt;&lt;h2&gt;Perché e dove nascono le regole contabili&lt;/h2&gt;&lt;p&gt;Slide 2–3&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s1&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt; L&#x27;evoluzione della contabilità &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 2&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;«Accounting develops where economies develop.»&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why?&lt;/strong&gt; «Because accounting follows economic developments and innovations.»&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;Il punto di partenza della lezione è un&#x27;idea semplice ma decisiva: la contabilità (&lt;em class=&quot;en&quot;&gt;accounting&lt;/em&gt;, cioè il sistema che misura i fatti economici di un&#x27;impresa e li comunica a chi deve prendere decisioni) &lt;strong&gt;non è un insieme di regole astratte&lt;/strong&gt;. È una tecnica che nasce dove ci sono scambi, crediti, investimenti e soci da cui rendere conto. Quando l&#x27;economia cambia — nuovi contratti, nuove forme d&#x27;impresa, nuovi mercati — cambiano le domande che si fanno ai numeri, e quindi le regole per produrli.&lt;/p&gt;
    &lt;p&gt;Ne discendono due conseguenze, che reggono tutta la lezione:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;le regole contabili sono sempre in movimento&lt;/strong&gt;: inseguono l&#x27;innovazione economica (di qui il processo continuo di emanazione e modifica degli standard, sezione 8);&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;ogni Paese ha sviluppato la propria contabilità&lt;/strong&gt;, perché ogni economia è diversa: di qui la varietà di regole nel mondo (sezione 2) e lo sforzo di convergenza (sezioni 5–6).&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;La contabilità insegue l&#x27;economia: cinque tappe &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;90&quot; y1=&quot;40&quot; x2=&quot;810&quot; y2=&quot;40&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;90&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;90&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;90&quot; y=&quot;88&quot;&gt;Mercanti&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;270&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;270&quot; y=&quot;44&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;270&quot; y=&quot;88&quot;&gt;Industria&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;450&quot; y=&quot;44&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;450&quot; y=&quot;88&quot;&gt;Borse&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;630&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;630&quot; y=&quot;44&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;630&quot; y=&quot;88&quot;&gt;Mercato unico&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;810&quot; cy=&quot;40&quot; r=&quot;20&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;810&quot; y=&quot;44&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;810&quot; y=&quot;88&quot;&gt;Globalizzazione&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · I mercanti italiani e la partita doppia&lt;/h4&gt;&lt;p&gt;Commercio a lunga distanza, società tra mercanti, credito: serve sapere chi deve cosa a chi e quanto ha guadagnato ciascun socio. Nasce la &lt;em class=&quot;en&quot;&gt;double-entry bookkeeping&lt;/em&gt; (partita doppia: ogni fatto è registrato in due conti, uno in Dare e uno in Avere, che si bilanciano).&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Luca Pacioli la descrive nella &lt;em&gt;Summa de arithmetica&lt;/em&gt; (Venezia, 1494), nel trattato &lt;em&gt;Particularis de computis et scripturis&lt;/em&gt;; non la inventa, ma codifica «il metodo di Venezia» già in uso da tempo. &lt;a href=&quot;https://www.icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library — Earliest books on bookkeeping&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · La rivoluzione industriale&lt;/h4&gt;&lt;p&gt;Le imprese investono in impianti che durano molti anni. Diventa necessario distinguere il &lt;em&gt;capitale&lt;/em&gt; dal &lt;em&gt;reddito&lt;/em&gt; e ripartire il costo dei beni durevoli tra più esercizi: è l&#x27;idea di ammortamento (&lt;em class=&quot;en&quot;&gt;depreciation&lt;/em&gt;) e della competenza (&lt;em class=&quot;en&quot;&gt;accrual&lt;/em&gt;, vedi sezione 2).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Società per azioni e borse&lt;/h4&gt;&lt;p&gt;La proprietà (azionisti dispersi) si separa dal controllo (manager). Gli investitori esterni hanno bisogno di bilanci affidabili e confrontabili: nasce l&#x27;informativa per il mercato, con revisione esterna e autorità di vigilanza. Negli Stati Uniti, dopo la crisi del 1929, la SEC (1934) affida a organismi privati la scrittura dei principi: è l&#x27;origine degli US GAAP.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Il mercato unico europeo&lt;/h4&gt;&lt;p&gt;Se merci e capitali circolano tra Paesi, i bilanci delle società devono essere almeno in parte confrontabili. La Comunità europea armonizza le regole con le direttive contabili (1978, 1983): sezione 6.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Mercati dei capitali globali&lt;/h4&gt;&lt;p&gt;Le grandi imprese si quotano e si finanziano in più Paesi. Un gruppo quotato a Milano e a New York non può redigere due bilanci con regole diverse: serve un linguaggio contabile comune. È la spinta verso gli IAS/IFRS e la convergenza (sezioni 5–7).&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Perché le contabilità nazionali sono diverse &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;Le slide lo danno per scontato, ma è la chiave per capire la sezione successiva: se la contabilità «segue» l&#x27;economia, Paesi con economie organizzate diversamente producono regole diverse. I fattori classici:&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Chi finanzia le imprese&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dove dominano le &lt;strong&gt;banche&lt;/strong&gt; (tradizione italiana e tedesca) il bilancio protegge soprattutto i creditori: prudenza, valori storici, poca volatilità. Dove domina il &lt;strong&gt;mercato azionario&lt;/strong&gt; (USA, Regno Unito) il bilancio serve agli investitori per stimare i flussi futuri: più informativa, valori correnti (&lt;em class=&quot;en&quot;&gt;fair value&lt;/em&gt;, il prezzo a cui un&#x27;attività si venderebbe oggi tra parti indipendenti).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Il sistema giuridico&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nei Paesi di &lt;em class=&quot;en&quot;&gt;civil law&lt;/em&gt; (Italia, Francia, Germania) le regole contabili stanno nei codici e nelle leggi. Nei Paesi di &lt;em class=&quot;en&quot;&gt;common law&lt;/em&gt; (USA, Regno Unito) sono scritte soprattutto da organismi professionali privati, i &lt;em class=&quot;en&quot;&gt;standard setters&lt;/em&gt; (enti che emanano i principi contabili).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Il legame con il fisco&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dove il reddito imponibile deriva dall&#x27;utile di bilancio (come in Italia, con il principio di derivazione), le scelte contabili hanno effetti fiscali e il bilancio tende a «pensare» al fisco. Dove i due mondi sono separati, il bilancio può concentrarsi sugli investitori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Cultura e professione&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il peso della professione contabile, la tradizione accademica (in Italia l&#x27;economia aziendale) e la propensione alla prudenza o alla trasparenza influenzano il modo di valutare e di presentare.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s2&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt; Accounting around the world &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 3&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;La slide 3 chiede: &lt;em&gt;quali sono le principali regolamentazioni nel mondo?&lt;/em&gt; E ne elenca cinque. Attenzione: non sono cinque «concorrenti» dello stesso tipo. Alcune sono &lt;strong&gt;insiemi di principi&lt;/strong&gt; scritti da standard setter, altre sono &lt;strong&gt;atti legislativi&lt;/strong&gt;, l&#x27;ultima è un &lt;strong&gt;criterio di rilevazione&lt;/strong&gt;. Apri le linguette.&lt;/p&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Le cinque regolamentazioni&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;IAS / IFRS&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;US GAAP&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Dir. 2013/34/UE&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Leggi nazionali&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Cash basis&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;strong&gt;IAS&lt;/strong&gt; = &lt;em class=&quot;en&quot;&gt;International Accounting Standards&lt;/em&gt;, emessi dallo IASC (&lt;em class=&quot;en&quot;&gt;International Accounting Standards Committee&lt;/em&gt;) fino al 2001. &lt;strong&gt;IFRS&lt;/strong&gt; = &lt;em class=&quot;en&quot;&gt;International Financial Reporting Standards&lt;/em&gt;, emessi dal 2001 dallo IASB (&lt;em class=&quot;en&quot;&gt;International Accounting Standards Board&lt;/em&gt;), che ha ereditato e mantiene in vigore gli IAS ancora validi.&lt;/p&gt;
        &lt;p&gt;Sono scritti da un organismo privato con sede a Londra, sorvegliato dalla IFRS Foundation. Diventano obbligatori solo quando un ordinamento li adotta: nell&#x27;UE, tramite il Regolamento 1606/2002 (sezione 6). Sono considerati &lt;em class=&quot;en&quot;&gt;principles-based&lt;/em&gt;: fissano principi generali e chiedono giudizio professionale. È il cuore del corso: architettura nella sezione 7.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;US GAAP&lt;/strong&gt; = &lt;em class=&quot;en&quot;&gt;Generally Accepted Accounting Principles&lt;/em&gt; degli Stati Uniti. Li emana il FASB (&lt;em class=&quot;en&quot;&gt;Financial Accounting Standards Board&lt;/em&gt;), organismo privato riconosciuto dalla SEC (l&#x27;autorità di vigilanza sui mercati USA). Sono tradizionalmente più dettagliati, con molte regole per casi specifici (&lt;em class=&quot;en&quot;&gt;rules-based&lt;/em&gt;).&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Dal 1° luglio 2009 la &lt;em&gt;FASB Accounting Standards Codification&lt;/em&gt; (ASC) è l&#x27;unica fonte autorevole degli US GAAP non governativi: ha sostituito la vecchia gerarchia di pronunciamenti FASB, AICPA, EITF. &lt;a href=&quot;https://dart.deloitte.com/USDART/home/accounting/archive-1/us-gaap/fasb-reports-news-items/2009/fasb-accounting-standards-codification-launches-today&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte DART — FASB Codification launches&lt;/a&gt;&lt;/p&gt;
        &lt;p&gt;IAS/IFRS e US GAAP sono i &lt;strong&gt;due poli&lt;/strong&gt; della contabilità mondiale: la loro convergenza è il tema della sezione 5.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;La &lt;strong&gt;Direttiva 2013/34/UE&lt;/strong&gt; è l&#x27;atto legislativo europeo sui bilanci d&#x27;esercizio e consolidati delle società di capitali. Non è un set di principi completo: fissa schemi, criteri di valutazione di base, contenuto minimo della nota integrativa, regole diverse per dimensione dell&#x27;impresa (micro, piccole, medie, grandi). Ha sostituito la IV e la VII direttiva (sezione 6).&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Pubblicata in Gazzetta ufficiale UE il 29 giugno 2013, recepimento entro il 20 luglio 2015. Il bilancio è un insieme unitario composto almeno da stato patrimoniale, conto economico e nota integrativa, e deve dare un quadro fedele (&lt;em class=&quot;en&quot;&gt;true and fair view&lt;/em&gt;) di attività, passività, situazione finanziaria e risultato. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Direttiva 2013/34/UE&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;Una direttiva non vale da sola: ogni Stato la trasforma in &lt;strong&gt;legge nazionale di applicazione&lt;/strong&gt;, scegliendo tra le opzioni lasciate aperte. Per questo la slide elenca le leggi nazionali come voce a sé: in Europa la regola concreta per una società non quotata è la legge del suo Paese.&lt;/p&gt;
        &lt;p&gt;Esempi: in Italia il Codice civile (artt. 2423 ss.) riformato dal D.Lgs. 139/2015 (sezione 4); in Germania l&#x27;&lt;em&gt;Handelsgesetzbuch&lt;/em&gt;; in Francia il &lt;em&gt;Code de commerce&lt;/em&gt; con il &lt;em&gt;Plan comptable général&lt;/em&gt;. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;strong&gt;Cash basis&lt;/strong&gt; (contabilità per cassa): si registra un ricavo quando si incassa e un costo quando si paga. È semplice e oggettiva, ma non misura il risultato del periodo: un servizio reso a dicembre e incassato a gennaio finisce nell&#x27;anno sbagliato.&lt;/p&gt;
        &lt;p&gt;Il suo contrario è l&#x27;&lt;strong&gt;accrual basis&lt;/strong&gt; (principio di competenza economica): ricavi e costi si imputano all&#x27;esercizio in cui avviene il fatto economico, indipendentemente dall&#x27;incasso o dal pagamento. È il criterio di IFRS, US GAAP e Codice civile (art. 2423-bis, c. 1, n. 3). La cassa sopravvive in contesti semplici: piccolissime attività, alcuni enti non profit, parte del settore pubblico, contabilità fiscali semplificate. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Prova la differenza con il grafico qui sotto.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table class=&quot;cmp&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Chi la produce&lt;/th&gt;&lt;th&gt;Natura&lt;/th&gt;&lt;th&gt;A chi si applica&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;IAS / IFRS&lt;/th&gt;&lt;td&gt;IASB (privato, Londra)&lt;/td&gt;&lt;td&gt;Principi contabili&lt;/td&gt;&lt;td&gt;Dove un ordinamento li adotta (nell&#x27;UE: consolidati delle quotate e altri)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;US GAAP&lt;/th&gt;&lt;td&gt;FASB, sotto la SEC&lt;/td&gt;&lt;td&gt;Principi contabili&lt;/td&gt;&lt;td&gt;Società statunitensi; società quotate negli USA&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Dir. 2013/34/UE&lt;/th&gt;&lt;td&gt;Parlamento e Consiglio UE&lt;/td&gt;&lt;td&gt;Atto legislativo (vincola gli Stati)&lt;/td&gt;&lt;td&gt;Gli Stati membri, che devono recepirla&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Leggi nazionali&lt;/th&gt;&lt;td&gt;Parlamenti/governi nazionali&lt;/td&gt;&lt;td&gt;Leggi&lt;/td&gt;&lt;td&gt;Le società di quel Paese&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Cash basis&lt;/th&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Criterio di rilevazione&lt;/td&gt;&lt;td&gt;Realtà piccole, non profit, parte del settore pubblico&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;cashw&quot;&gt;
      &lt;h4&gt;Cash basis contro accrual basis: sposta i cursori&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.92rem;color:var(--soft)&quot;&gt;Un&#x27;impresa firma un contratto di assistenza di 12 mesi da 12.000 € (1.000 € al mese di servizio). Il cliente paga tutto in un&#x27;unica soluzione.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-start&quot;&gt;Mese in cui inizia il servizio nel 2026: &lt;output id=&quot;o-start&quot;&gt;ottobre&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-start&quot; min=&quot;1&quot; max=&quot;12&quot; value=&quot;10&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;w-delay&quot;&gt;Il cliente paga dopo quanti mesi dall&#x27;inizio: &lt;output id=&quot;o-delay&quot;&gt;0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;w-delay&quot; min=&quot;0&quot; max=&quot;18&quot; value=&quot;0&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;cash-chart&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Ricavi per anno con cash basis e accrual basis&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;cash-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Secondo la slide 2, perché la contabilità si sviluppa dove si sviluppano le economie?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Perché i governi impongono la contabilità solo ai Paesi ricchi.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Perché segue gli sviluppi e le innovazioni economiche: nuovi fatti economici richiedono nuovi modi di misurarli.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Perché la partita doppia funziona solo con grandi volumi di scambi.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;La contabilità risponde a bisogni economici: quando nascono nuovi contratti, imprese e mercati, nascono anche le regole per rappresentarli.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Servizio reso interamente a dicembre 2026, incassato a febbraio 2027. Con l&#x27;accrual basis il ricavo va nel…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;2026&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;2027&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;metà nel 2026 e metà nel 2027&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;La competenza guarda a quando avviene il fatto economico (il servizio reso), non a quando entra il denaro. Con la cash basis, invece, finirebbe nel 2027.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Tra le voci della slide 3, quale è un atto legislativo e non un insieme di principi emanato da uno standard setter?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;IAS/IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;US GAAP&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Direttiva 2013/34/UE&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;La direttiva è adottata da Parlamento e Consiglio UE e vincola gli Stati membri. IASB e FASB sono invece organismi privati.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Domanda aperta: perché la slide 3 elenca separatamente «European Directive 34/2013» e «National application laws»? &lt;span&gt;Mostra risposta&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché una direttiva non si applica direttamente alle imprese: ogni Stato la recepisce con una propria legge, scegliendo tra le opzioni. Per una società europea non quotata, la regola concreta è quindi la legge nazionale (in Italia il Codice civile), che può differire da Paese a Paese pur nello stesso quadro europeo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE II ============ --&gt;
&lt;div class=&quot;part p-slate&quot; id=&quot;parte2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;II&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Parte II&lt;/p&gt;&lt;h2&gt;Le fonti del diritto contabile: Unione europea e Italia&lt;/h2&gt;&lt;p&gt;Slide 4–7&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s3&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt; European legislation &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 4–5&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Per capire come gli IAS/IFRS e la direttiva contabile arrivano a un&#x27;impresa italiana bisogna conoscere gli strumenti con cui l&#x27;UE legifera. La slide 4 ne indica tre: &lt;strong&gt;Regulations&lt;/strong&gt; (regolamenti), &lt;strong&gt;Directives&lt;/strong&gt; (direttive) e &lt;strong&gt;Recommendations&lt;/strong&gt; (raccomandazioni), queste ultime &lt;em class=&quot;en&quot;&gt;non-binding acts&lt;/em&gt;, atti non vincolanti.&lt;/p&gt;

    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-labelledby=&quot;eu-t&quot;&gt;
        &lt;title id=&quot;eu-t&quot;&gt;Come arrivano agli Stati regolamenti, direttive e raccomandazioni&lt;/title&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path class=&quot;arrowhead&quot; d=&quot;M0 0L10 5L0 10z&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;28&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Regolamento&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;si applica direttamente&lt;/text&gt;
          &lt;path class=&quot;ln&quot; d=&quot;M195 56L428 25M195 56H428M195 56L428 87&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;12&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;30&quot; font-size=&quot;13&quot;&gt;Stato 1 — stesso testo, dal giorno t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;43&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;61&quot; font-size=&quot;13&quot;&gt;Stato 2 — stesso testo, dal giorno t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;74&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;92&quot; font-size=&quot;13&quot;&gt;Stato 3 — stesso testo, dal giorno t&lt;/text&gt;
        &lt;/g&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;138&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Direttiva&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;182&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;vincola il risultato&lt;/text&gt;
          &lt;path class=&quot;ln&quot; d=&quot;M195 166L428 135M195 166H428M195 166L428 197&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;g class=&quot;cfill&quot;&gt;&lt;circle cx=&quot;312&quot; cy=&quot;150.5&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;312&quot; cy=&quot;166&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;312&quot; cy=&quot;181.5&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
          &lt;text x=&quot;312&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;soft&quot;&gt;legge nazionale&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;122&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;140&quot; font-size=&quot;13&quot;&gt;Stato 1 — opzione A, dal giorno t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;153&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;171&quot; font-size=&quot;13&quot;&gt;Stato 2 — opzione B, dal giorno t&lt;/text&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;184&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;202&quot; font-size=&quot;13&quot;&gt;Stato 3 — opzione A, un anno dopo&lt;/text&gt;
        &lt;/g&gt;
        &lt;g&gt;
          &lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;248&quot; width=&quot;185&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;stroke-dasharray:5 4&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Raccomandazione&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;non vincolante&lt;/text&gt;
          &lt;path class=&quot;ln dash&quot; d=&quot;M195 276H428&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
          &lt;rect class=&quot;bx2&quot; x=&quot;430&quot; y=&quot;263&quot; width=&quot;320&quot; height=&quot;26&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;442&quot; y=&quot;281&quot; font-size=&quot;13&quot;&gt;Stati o organi UE — invito ad agire&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;Schema illustrativo: con il regolamento il testo è identico ovunque e nello stesso momento; con la direttiva ogni Stato passa per una propria legge, con opzioni e date diverse; la raccomandazione orienta senza obbligare.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Strumenti UE&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Regulation&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Directive&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Recommendation&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;s. 5&lt;/span&gt; «EU Regulations are applied within all countries and in the same way; simultaneously.»&lt;/p&gt;
        &lt;p&gt;Il regolamento è obbligatorio in tutti i suoi elementi e &lt;strong&gt;direttamente applicabile&lt;/strong&gt;: non serve una legge nazionale. Risultato: uniformità totale, stessa data per tutti. Esempio contabile chiave: il &lt;strong&gt;Regolamento (CE) 1606/2002&lt;/strong&gt;, che impone gli IAS/IFRS, e i successivi regolamenti con cui la Commissione omologa ogni nuovo standard.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;s. 5&lt;/span&gt; Le direttive «must be adopted by each country through a national law, which should allow for a certain degree of freedom within a framework defined by the European directives. This means that perfect comparability between countries does not exist and that the adoption date may vary.»&lt;/p&gt;
        &lt;p&gt;La direttiva vincola lo Stato quanto al &lt;strong&gt;risultato&lt;/strong&gt;, lasciandogli la scelta di forma e mezzi. Le direttive contabili contengono molte &lt;em class=&quot;en&quot;&gt;Member State options&lt;/em&gt; (opzioni per gli Stati membri): per esempio esonerare le piccole imprese da alcuni obblighi. Due conseguenze sottolineate dalla slide: &lt;strong&gt;niente comparabilità perfetta&lt;/strong&gt; e &lt;strong&gt;date di adozione diverse&lt;/strong&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;s. 5&lt;/span&gt; Le raccomandazioni «may be addressed to the individual member states or to European bodies to encourage legislation and action on specific issues.»&lt;/p&gt;
        &lt;p&gt;Non vincolano, ma orientano. Esempio contabile &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;: la Raccomandazione della Commissione 2003/361/CE sulla definizione di micro, piccole e medie imprese, usata come riferimento in molte normative.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tscroll&quot;&gt;
    &lt;table class=&quot;cmp&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Vincolante?&lt;/th&gt;&lt;th&gt;Serve una legge nazionale?&lt;/th&gt;&lt;th&gt;Uniformità tra Paesi&lt;/th&gt;&lt;th&gt;Data di applicazione&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;Regulation&lt;/th&gt;&lt;td&gt;Sì, in tutto&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;Simultanea&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Directive&lt;/th&gt;&lt;td&gt;Sì, quanto al risultato&lt;/td&gt;&lt;td&gt;Sì (recepimento)&lt;/td&gt;&lt;td&gt;Parziale (opzioni)&lt;/td&gt;&lt;td&gt;Può variare&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;Recommendation&lt;/th&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Da ricordare&lt;/strong&gt;&lt;p&gt;La base giuridica di questi strumenti è l&#x27;art. 288 del Trattato sul funzionamento dell&#x27;UE (TFUE), che elenca anche decisioni e pareri, non citati nella slide. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s4&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt; Italian legislation &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 6–7&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;«In Italy, the transposition of EU Directives occurs through the adoption of Legislative Decrees (D.Lgs.).»&lt;/p&gt;
      &lt;p&gt;«In Italy, the EU Directive n. 34/2013 is included in the Civil Code.»&lt;/p&gt;
      &lt;p&gt;«EU Regulations are applicable immediately.»&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;Il &lt;strong&gt;decreto legislativo&lt;/strong&gt; (D.Lgs.) è un atto del Governo con forza di legge, adottato su delega del Parlamento: per le direttive la delega arriva di norma con la legge di delegazione europea. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt; Il contenuto della Direttiva 34/2013 non sta in una legge separata, ma è stato &lt;strong&gt;inserito nel Codice civile&lt;/strong&gt;, nelle norme sul bilancio (artt. 2423 ss.).&lt;/p&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;p&gt;Il recepimento è avvenuto con il &lt;strong&gt;D.Lgs. 18 agosto 2015, n. 139&lt;/strong&gt; (G.U. n. 205 del 4 settembre 2015), applicabile dai bilanci degli esercizi iniziati dal 1° gennaio 2016. Ha modificato tra gli altri gli artt. 2423, 2423-bis, 2424, 2425, 2425-ter, 2426, 2427, 2435-bis e 2435-ter c.c., oltre al D.Lgs. 127/1991 sul consolidato. &lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Legislazione Tecnica — D.Lgs. 139/2015&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Due binari per i bilanci italiani&lt;/h3&gt;
    &lt;p&gt;La slide 7 mostra le due strade del sistema italiano: &lt;strong&gt;IAS/IFRS&lt;/strong&gt; «for listed companies and other companies» e &lt;strong&gt;Codice civile + principi OIC&lt;/strong&gt; «for non-listed companies with some exceptions».&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 370&quot; role=&quot;img&quot; aria-labelledby=&quot;it-t&quot;&gt;
        &lt;title id=&quot;it-t&quot;&gt;Due binari: regolamento UE e IAS/IFRS da una parte, direttiva, Codice civile e OIC dall&#x27;altra&lt;/title&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path class=&quot;arrowhead&quot; d=&quot;M0 0L10 5L0 10z&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;190&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Binario IAS/IFRS&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Binario nazionale&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;28&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Regolamento (CE) 1606/2002&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;direttamente applicabile&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;30&quot; y=&quot;114&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;D.Lgs. 38/2005&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;esercita le opzioni dell&#x27;art. 5 del Regolamento&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;30&quot; y=&quot;200&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;223&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;IAS/IFRS omologati dall&#x27;UE&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;+ interpretazioni SIC/IFRIC&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;286&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Quotate e altre società&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;banche, intermediari vigilati, assicurazioni…&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M190 82V112M190 168V198M190 254V284&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;410&quot; y=&quot;28&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Direttiva 2013/34/UE&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;vincola lo Stato&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;410&quot; y=&quot;114&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;D.Lgs. 139/2015&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;recepimento&lt;/text&gt;
        &lt;rect class=&quot;bx2&quot; x=&quot;410&quot; y=&quot;200&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;223&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Codice civile artt. 2423 ss.&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;+ principi contabili OIC&lt;/text&gt;
        &lt;rect class=&quot;bx&quot; x=&quot;410&quot; y=&quot;286&quot; width=&quot;320&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Società non quotate&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;con alcune eccezioni&lt;/text&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M570 82V112M570 168V198M570 254V284&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;path class=&quot;lnc dash&quot; d=&quot;M410 300C385 300 375 240 352 232&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;282&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;soft&quot; font-style=&quot;italic&quot;&gt;facoltà&lt;/text&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;Il regolamento entra in Italia senza recepimento (il D.Lgs. 38/2005 esercita solo le opzioni che il regolamento lascia agli Stati); la direttiva passa per un D.Lgs. che modifica il Codice civile. La freccia tratteggiata indica che alcune non quotate possono scegliere gli IAS/IFRS.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;OIC&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;L&#x27;&lt;strong&gt;Organismo Italiano di Contabilità&lt;/strong&gt; è lo standard setter nazionale: scrive i principi contabili OIC (OIC 12 sugli schemi, OIC 16 sulle immobilizzazioni materiali, OIC 15 sui crediti…) che interpretano e integrano le norme del Codice civile.&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Fondazione di diritto privato costituita il 27 novembre 2001; la legge 11 agosto 2014, n. 116 lo ha riconosciuto come «istituto nazionale per i principi contabili». I principi sono approvati dopo consultazione pubblica e il parere, tra gli altri, di Agenzia delle Entrate e Banca d&#x27;Italia. &lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Il D.Lgs. 38/2005 e le opzioni del Regolamento&lt;/summary&gt;&lt;div&gt;
        &lt;p&gt;Il Regolamento 1606/2002 impone gli IAS/IFRS solo ai consolidati delle quotate, ma l&#x27;art. 5 consente agli Stati di estenderli. L&#x27;Italia lo ha fatto con il D.Lgs. 38/2005.&lt;/p&gt;
        &lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Il decreto rende obbligatori gli IAS/IFRS, tra gli altri, per società quotate, società con strumenti finanziari diffusi, banche, SIM, SGR ed enti finanziari vigilati; per altri soggetti non quotati prevede una facoltà (art. 2-bis). Prevede anche la non distribuibilità delle plusvalenze da &lt;em&gt;fair value&lt;/em&gt; non realizzate. &lt;a href=&quot;https://www.fondazionenazionalecommercialisti.it/system/files/imce/aree-tematiche/pac/DOC_2005_23_Adozione%20IAS.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione Nazionale Commercialisti — documento sull&#x27;adozione degli IAS&lt;/a&gt;&lt;/p&gt;
      &lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;treew&quot;&gt;
      &lt;h4&gt;Che principi usa questa società? Scegli un caso&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.9rem;color:var(--soft)&quot;&gt;Albero semplificato a scopo didattico: le categorie esatte sono nel testo vigente del D.Lgs. 38/2005.&lt;/p&gt;
      &lt;div class=&quot;choices&quot; role=&quot;group&quot; aria-label=&quot;Tipo di società&quot;&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;quot&quot;&gt;Gruppo quotato in Borsa&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;banca&quot;&gt;Banca&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;grande&quot;&gt;S.p.A. non quotata, grande&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;piccola&quot;&gt;S.r.l. piccola (bilancio abbreviato)&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;micro&quot;&gt;Micro-impresa&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;tree-out&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Seleziona un tipo di società.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. «Si applica in tutti gli Stati nello stesso modo e nello stesso momento.» Di quale strumento si tratta?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Regulation&lt;/button&gt;&lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Directive&lt;/button&gt;&lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Recommendation&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Il regolamento è direttamente applicabile e identico ovunque: è lo strumento scelto per imporre gli IAS/IFRS (Reg. 1606/2002).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Perché, secondo la slide 5, con le direttive «perfect comparability between countries does not exist»?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Perché le direttive non sono vincolanti.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Perché ogni Stato le recepisce con una propria legge, scegliendo tra opzioni e con date diverse.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Perché le direttive valgono solo per le società quotate.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;La direttiva vincola il risultato, ma lascia margini di libertà: due Paesi possono scegliere opzioni diverse.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. In Italia, la Direttiva 2013/34/UE è stata trasposta…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;con un regolamento direttamente applicabile&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;con un decreto legislativo che ha modificato il Codice civile&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;con un principio contabile OIC&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Lo strumento è il D.Lgs. (il 139/2015) e il contenuto vive nel Codice civile; l&#x27;OIC poi interpreta e integra quelle norme.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Domanda aperta: perché in Italia possono convivere bilanci IAS/IFRS e bilanci OIC? &lt;span&gt;Mostra risposta&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché provengono da due strumenti UE diversi. Il Regolamento 1606/2002 rende obbligatori gli IAS/IFRS per i consolidati delle quotate e lascia agli Stati la possibilità di estenderli (in Italia con il D.Lgs. 38/2005 a banche, intermediari vigilati e altri). Per tutte le altre società vale la Direttiva 2013/34, recepita nel Codice civile e integrata dai principi OIC. Il risultato è un sistema «a due binari».&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE III ============ --&gt;
&lt;div class=&quot;part p-sage&quot; id=&quot;parte3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;III&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Parte III&lt;/p&gt;&lt;h2&gt;La convergenza: verso un linguaggio contabile comune&lt;/h2&gt;&lt;p&gt;Slide 8–9&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s5&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt; Worldwide convergence process &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 8&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;em class=&quot;en&quot;&gt;Convergence&lt;/em&gt; (convergenza) è il processo con cui sistemi contabili diversi vengono avvicinati fino a produrre bilanci confrontabili. Si distingue dall&#x27;&lt;em class=&quot;en&quot;&gt;adoption&lt;/em&gt; (adozione), in cui un Paese prende un set di standard così com&#x27;è. La slide 8 ne indica i passaggi:&lt;/p&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;The Role of &lt;strong&gt;IOSCO&lt;/strong&gt; · Widespread adoption of IAS/IFRS (&lt;em&gt;isomorphism&lt;/em&gt;) · Convergence process with IASB – FASB 2002 – Norfolk Agreement · Participation in the revival of the project in 2006 · G20 Leaders Group – 2009 – support for the international convergence program · Slowdown of the project and widespread adoption after the crises&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Attenzione al nome&lt;/strong&gt;&lt;p&gt;La slide scrive «Norfolk Agreement», ma l&#x27;accordo FASB–IASB del 2002 è noto come &lt;strong&gt;Norwalk Agreement&lt;/strong&gt;, dal nome della città del Connecticut (sede del FASB) in cui fu firmato. Vedi la fonte esterna qui sotto.&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;Linea del tempo della convergenza mondiale&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 110&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;50&quot; y1=&quot;40&quot; x2=&quot;850&quot; y2=&quot;40&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;50&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;50&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;50&quot; y=&quot;85&quot;&gt;1973&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;150&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;150&quot; y=&quot;44&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;150&quot; y=&quot;85&quot;&gt;1983&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;250&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;250&quot; y=&quot;44&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;250&quot; y=&quot;85&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;350&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;350&quot; y=&quot;44&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;350&quot; y=&quot;85&quot;&gt;2001&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;450&quot; y=&quot;44&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;450&quot; y=&quot;85&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;5&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;550&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;550&quot; y=&quot;44&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;550&quot; y=&quot;85&quot;&gt;2006&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;6&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;650&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;650&quot; y=&quot;44&quot;&gt;7&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;650&quot; y=&quot;85&quot;&gt;2007&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;7&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;750&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;750&quot; y=&quot;44&quot;&gt;8&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;750&quot; y=&quot;85&quot;&gt;2009&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;8&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;850&quot; cy=&quot;40&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;850&quot; y=&quot;44&quot;&gt;9&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;850&quot; y=&quot;85&quot;&gt;dal 2010&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1973 · Nasce lo IASC &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Gli ordini professionali contabili di alcuni Paesi (tra cui USA, Regno Unito, Francia, Germania, Giappone) fondano l&#x27;&lt;em class=&quot;en&quot;&gt;International Accounting Standards Committee&lt;/em&gt;, che emette gli IAS. Per anni sono standard «deboli»: pieni di alternative e senza un&#x27;autorità che li imponga.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;1983 · Nasce IOSCO&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;em class=&quot;en&quot;&gt;International Organization of Securities Commissions&lt;/em&gt; riunisce le autorità di vigilanza sui mercati finanziari (la SEC americana, la CONSOB italiana…). È il soggetto che può dare forza agli standard: decide quali bilanci accettare dalle società che si quotano.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Fondata nel 1983, segretariato generale a Madrid; i membri ordinari sono i regolatori nazionali dei mercati mobiliari, con un voto ciascuno. &lt;a href=&quot;https://www.iosco.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iosco.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2000 · IOSCO approva gli standard IASC&lt;/h4&gt;&lt;p&gt;È il «ruolo di IOSCO» della slide: dopo aver valutato i &lt;em class=&quot;en&quot;&gt;core standards&lt;/em&gt; dello IASC, IOSCO raccomanda ai propri membri di accettarli per le società estere che si quotano. È il primo grande riconoscimento internazionale degli IAS.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Risoluzione del Presidents Committee del 17 maggio 2000: riguarda i 30 «IASC 2000 standards» con le relative interpretazioni SIC; l&#x27;approvazione è condizionata, perché ogni autorità può chiedere trattamenti supplementari, come riconciliazioni. &lt;a href=&quot;https://www.iosco.org/library/resolutions/pdf/IOSCORES19.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IOSCO — Resolution on IASC Standards (2000)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2001 · Lo IASB sostituisce lo IASC&lt;/h4&gt;&lt;p&gt;Lo IASC viene ristrutturato: nasce lo IASB, un board indipendente di esperti a tempo pieno, sotto una fondazione (oggi IFRS Foundation). Dal 1° aprile 2001 lo IASB adotta gli IAS e le SIC esistenti e da allora emette gli IFRS. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2002 · Norwalk Agreement&lt;/h4&gt;&lt;p&gt;FASB e IASB si impegnano formalmente a rendere compatibili i propri standard: è l&#x27;avvio della convergenza IASB–FASB citata nella slide.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Memorandum of Understanding firmato dopo la riunione congiunta di Norwalk (Connecticut) del 18 settembre 2002: i due board si impegnano a usare «best efforts» per rendere compatibili gli standard esistenti e coordinare i lavori futuri, con progetti a breve e lungo termine. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — testo del Norwalk Agreement&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2006 · Rilancio del progetto&lt;/h4&gt;&lt;p&gt;La slide parla di «revival of the project in 2006»: i due board aggiornano il loro accordo con una &lt;em class=&quot;en&quot;&gt;roadmap&lt;/em&gt; di progetti comuni (aggiornata ancora nel 2008).&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Il Memorandum of Understanding del febbraio 2006 fissa i progetti di convergenza da completare; nel 2008 l&#x27;obiettivo diventa chiudere i grandi progetti comuni entro il 2011. &lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) — IASB-FASB convergence&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2007 · La SEC apre agli IFRS &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;La SEC elimina l&#x27;obbligo di riconciliazione con gli US GAAP per le società estere quotate negli USA che redigono il bilancio secondo gli IFRS dello IASB. Le società americane, invece, continuano a usare gli US GAAP.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2009 · Il G20&lt;/h4&gt;&lt;p&gt;Dopo la crisi finanziaria, i leader del G20 sostengono il programma di convergenza: un unico set di standard globali di alta qualità.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Al vertice di Pittsburgh (settembre 2009) il G20 chiede ai board di raddoppiare gli sforzi e completare la convergenza entro giugno 2011; IASB e FASB rispondono con riunioni mensili dal 2010. &lt;a href=&quot;https://www.iasplus.com/en/news/2009/September/news5386&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — G20 call for global standards by 2011&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Dal 2010 · Rallentamento e adozione diffusa&lt;/h4&gt;&lt;p&gt;La convergenza piena con gli USA rallenta: alcuni progetti comuni si chiudono (ad esempio i ricavi, IFRS 15 / ASC 606), altri finiscono con soluzioni diverse (leasing: IFRS 16 / ASC 842). &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt; Intanto gli IFRS si diffondono in gran parte del mondo: è l&#x27;«adozione diffusa dopo le crisi» della slide.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Al vertice di Toronto (giugno 2010) il G20 riconferma l&#x27;obiettivo di un set unico di standard, ma la dichiarazione non riporta più la scadenza di giugno 2011. &lt;a href=&quot;https://www.iasplus.com/en/news/2010/June/news5908&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — G20 reiterates support for global accounting standards&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;Isomorphism: perché tutti finiscono per adottare gli IFRS&lt;/h3&gt;
    &lt;p&gt;La slide collega l&#x27;adozione diffusa degli IAS/IFRS al concetto di &lt;em class=&quot;en&quot;&gt;isomorphism&lt;/em&gt; (isomorfismo): la tendenza delle organizzazioni che operano nello stesso campo a diventare simili tra loro. Il termine viene dalla teoria istituzionale (DiMaggio e Powell, 1983: vedi «Per approfondire»), che ne distingue tre meccanismi. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Tipi di isomorfismo&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Coercive&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Mimetic&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Normative&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Coercitivo&lt;/strong&gt;: si adotta perché qualcuno lo impone. Esempio: il Regolamento 1606/2002 obbliga i gruppi quotati europei; organismi come Banca mondiale o FMI hanno spinto i Paesi emergenti verso gli IFRS come condizione per sostegni e accesso ai capitali.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Mimetico&lt;/strong&gt;: in condizioni di incertezza si copia chi sembra avere successo. Se i mercati più grandi usano gli IFRS, adottarli segnala credibilità agli investitori esteri, anche senza obbligo.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Normativo&lt;/strong&gt;: lo diffondono le professioni. Grandi società di revisione, università, ordini professionali e formazione condivisa rendono gli IFRS il linguaggio «normale» degli esperti contabili.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s6&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt; EU convergence process &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 9&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;In Europa la convergenza segue due binari, che la slide 9 elenca uno sotto l&#x27;altro: prima l&#x27;&lt;strong&gt;armonizzazione con le direttive&lt;/strong&gt;, poi la &lt;strong&gt;strategia IAS&lt;/strong&gt;. Clicca i punti della linea del tempo.&lt;/p&gt;
