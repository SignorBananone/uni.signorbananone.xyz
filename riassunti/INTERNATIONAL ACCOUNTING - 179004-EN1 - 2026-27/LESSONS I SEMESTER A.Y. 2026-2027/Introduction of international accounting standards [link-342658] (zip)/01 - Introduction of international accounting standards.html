    &lt;h3&gt;Perché l&#x27;UE cambia strada&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;I limiti delle direttive&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le direttive del 1978 e del 1983 contenevano moltissime opzioni: i bilanci di società di Paesi diversi restavano poco confrontabili. Inoltre modificarle richiedeva un lungo iter legislativo, troppo lento rispetto all&#x27;innovazione finanziaria (tornano le slide 2 e 5). &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Il problema dei mercati&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le grandi imprese europee che volevano quotarsi a New York dovevano preparare i conti anche secondo gli US GAAP. Invece di creare un proprio set di standard, l&#x27;UE sceglie di appoggiarsi agli IAS, già riconosciuti a livello internazionale. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Il Regolamento 1606/2002 in quattro punti&lt;/strong&gt; &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;
      &lt;p&gt;&lt;strong&gt;Art. 4&lt;/strong&gt; — obbligo IAS/IFRS per i bilanci consolidati delle società quotate in un mercato regolamentato UE, dagli esercizi che iniziano dal 1° gennaio 2005.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 5&lt;/strong&gt; — opzioni per gli Stati: permettere o imporre gli IAS/IFRS anche nei bilanci d&#x27;esercizio e nelle società non quotate (in Italia: D.Lgs. 38/2005).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 3&lt;/strong&gt; — gli standard valgono nell&#x27;UE solo dopo l&#x27;&lt;em class=&quot;en&quot;&gt;endorsement&lt;/em&gt; (omologazione): non devono essere contrari al principio del quadro fedele, devono rispondere all&#x27;interesse pubblico europeo e soddisfare criteri di comprensibilità, rilevanza, affidabilità e comparabilità.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Art. 6&lt;/strong&gt; — la Commissione è assistita da un comitato di regolamentazione contabile, l&#x27;ARC (sezione 8).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;p&gt;Regolamento (CE) n. 1606/2002 del 19 luglio 2002, G.U. L 243 dell&#x27;11 settembre 2002; l&#x27;art. 1 definisce i «principi contabili internazionali» come IAS, IFRS e interpretazioni SIC/IFRIC. L&#x27;elenco consolidato degli standard omologati è nel Regolamento (CE) n. 1126/2008. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Regolamento 1606/2002&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Qual è stato il ruolo di IOSCO nel processo di convergenza?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Scrivere gli IFRS al posto dello IASB.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Riconoscere gli standard IASC (2000) raccomandandone l&#x27;uso alle autorità di borsa per le società estere quotate.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Recepire le direttive contabili nei Paesi UE.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IOSCO riunisce i regolatori dei mercati: il suo sostegno ha dato agli IAS un&#x27;autorevolezza che uno standard setter privato da solo non poteva avere.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. Che cosa stabilisce l&#x27;accordo FASB–IASB del 2002 (Norwalk)?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;L&#x27;adozione degli IFRS da parte delle società statunitensi.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;La fusione dei due board.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;L&#x27;impegno a rendere compatibili gli standard esistenti e a coordinare i lavori futuri.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;È un accordo di convergenza, non di adozione: le società americane continuano a usare gli US GAAP.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Dal 2005, il Regolamento 1606/2002 rende obbligatori gli IAS/IFRS per…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;tutte le società di capitali europee.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;i bilanci consolidati delle società quotate in un mercato regolamentato UE.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;i bilanci d&#x27;esercizio delle piccole imprese.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Ogni estensione ulteriore (bilancio d&#x27;esercizio, non quotate) dipende dalle opzioni dell&#x27;art. 5 esercitate dagli Stati.&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Domanda aperta: spiega con un esempio cosa significa «isomorphism» applicato agli IFRS. &lt;span&gt;Mostra risposta&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Isomorfismo indica che le organizzazioni di uno stesso campo tendono a somigliarsi. Un Paese emergente può adottare gli IFRS perché richiesto da finanziatori internazionali (coercitivo), perché li hanno adottati i Paesi i cui mercati vuole attrarre (mimetico) o perché i suoi professionisti sono formati su quegli standard (normativo). Risultato: adozione diffusa anche dove la convergenza formale con gli USA si è fermata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PARTE IV ============ --&gt;
&lt;div class=&quot;part p-brick&quot; id=&quot;parte4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;IV&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Parte IV&lt;/p&gt;&lt;h2&gt;Dentro gli IAS/IFRS: struttura, nascita, applicazione&lt;/h2&gt;&lt;p&gt;Slide 10–13&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s7&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt; IAS / IFRS standards &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 10&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;La slide 10 mostra i tre livelli del corpus IAS/IFRS: il &lt;strong&gt;Framework&lt;/strong&gt; («the Conceptual Framework is not a standard»), gli &lt;strong&gt;Standards&lt;/strong&gt; (IAS e IFRS) e le &lt;strong&gt;Interpretations&lt;/strong&gt; (SIC e IFRIC). Pensali come un edificio: clicca le sue parti.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot; id=&quot;bld&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 360&quot; role=&quot;img&quot; aria-labelledby=&quot;bld-t&quot;&gt;
        &lt;title id=&quot;bld-t&quot;&gt;L&#x27;edificio IAS/IFRS: Conceptual Framework come fondamenta, IAS e IFRS come pilastri, interpretazioni come architrave, bilancio come tetto&lt;/title&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;fs&quot;&gt;&lt;path d=&quot;M380 18L705 100H55Z&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Bilancio IAS/IFRS&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;int&quot;&gt;&lt;rect x=&quot;80&quot; y=&quot;110&quot; width=&quot;600&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Interpretations · SIC → IFRIC (IFRS Interpretations Committee)&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;ias&quot;&gt;&lt;rect x=&quot;115&quot; y=&quot;166&quot; width=&quot;225&quot; height=&quot;120&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;227&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;26&quot; font-weight=&quot;600&quot;&gt;IAS&lt;/text&gt;&lt;text x=&quot;227&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;emessi dallo IASC, 1973–2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;ifrs&quot;&gt;&lt;rect x=&quot;420&quot; y=&quot;166&quot; width=&quot;225&quot; height=&quot;120&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;532&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;26&quot; font-weight=&quot;600&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;532&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;emessi dallo IASB, dal 2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;bp&quot; data-k=&quot;cf&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;296&quot; width=&quot;680&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;326&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Conceptual Framework — non è uno standard&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;bld-out&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Clicca una parte dell&#x27;edificio.&lt;/p&gt;&lt;/div&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;p&gt;La &lt;em&gt;Preface to IFRS Standards&lt;/em&gt; conferma che il Conceptual Framework non è uno standard e non prevale su nessuno standard; lo IASB può discostarsene in uno standard specifico, ma deve spiegarlo nelle &lt;em&gt;Basis for Conclusions&lt;/em&gt;. La versione in uso è quella rivista nel 2018. &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/preface-to-ifrs-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Preface to IFRS Standards&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Che cosa c&#x27;è nel Conceptual Framework &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Obiettivo dell&#x27;informativa&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Fornire informazioni utili a investitori, finanziatori e altri creditori, attuali e potenziali, per decidere se fornire risorse all&#x27;entità. È la prospettiva dell&#x27;investitore, diversa dalla tradizione italiana centrata sui creditori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Caratteristiche qualitative&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Fondamentali&lt;/strong&gt;: &lt;em class=&quot;en&quot;&gt;relevance&lt;/em&gt; (rilevanza: l&#x27;informazione può cambiare una decisione; include la &lt;em class=&quot;en&quot;&gt;materiality&lt;/em&gt;, significatività) e &lt;em class=&quot;en&quot;&gt;faithful representation&lt;/em&gt; (rappresentazione fedele: completa, neutrale, senza errori).&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Migliorative&lt;/strong&gt;: &lt;em class=&quot;en&quot;&gt;comparability, verifiability, timeliness, understandability&lt;/em&gt; (comparabilità, verificabilità, tempestività, comprensibilità).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Elementi del bilancio&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;em class=&quot;en&quot;&gt;Asset&lt;/em&gt; (risorsa economica presente controllata per effetto di eventi passati), &lt;em class=&quot;en&quot;&gt;liability&lt;/em&gt; (obbligazione presente a trasferire una risorsa economica), &lt;em class=&quot;en&quot;&gt;equity&lt;/em&gt; (interessenza residua: attività meno passività), &lt;em class=&quot;en&quot;&gt;income&lt;/em&gt; ed &lt;em class=&quot;en&quot;&gt;expenses&lt;/em&gt; (aumenti e diminuzioni di attività o passività che modificano il patrimonio netto, esclusi i rapporti con i soci).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Rilevazione e valutazione&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Quando inserire un elemento in bilancio (&lt;em class=&quot;en&quot;&gt;recognition&lt;/em&gt;) e con quale base di misurazione (&lt;em class=&quot;en&quot;&gt;measurement&lt;/em&gt;): costo storico o valori correnti, tra cui il &lt;em class=&quot;en&quot;&gt;fair value&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;h3 style=&quot;margin:.2rem 0 .6rem&quot;&gt;E se nessuno standard regola il caso? La gerarchia dello IAS 8 &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h3&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 100&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line class=&quot;track&quot; x1=&quot;110&quot; y1=&quot;38&quot; x2=&quot;790&quot; y2=&quot;38&quot;/&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;110&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;110&quot; y=&quot;42&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;110&quot; y=&quot;82&quot;&gt;Standard specifico&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;337&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;337&quot; y=&quot;42&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;337&quot; y=&quot;82&quot;&gt;Casi simili&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;563&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;563&quot; y=&quot;42&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;563&quot; y=&quot;82&quot;&gt;Framework&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;790&quot; cy=&quot;38&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;790&quot; y=&quot;42&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;790&quot; y=&quot;82&quot;&gt;Altre fonti&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · C&#x27;è uno standard o un&#x27;interpretazione che si applica?&lt;/h4&gt;&lt;p&gt;Si applica quello. Gli standard e le interpretazioni prevalgono sempre sul Framework.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Standard su questioni simili&lt;/h4&gt;&lt;p&gt;Se manca, la direzione usa il giudizio professionale e guarda prima ai requisiti di IFRS che trattano casi simili o collegati.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Definizioni e criteri del Conceptual Framework&lt;/h4&gt;&lt;p&gt;Poi applica le definizioni di attività, passività, ricavi e costi e i criteri di rilevazione e valutazione del Framework. Qui il Framework, pur non essendo uno standard, diventa operativo.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Altri standard setter e prassi&lt;/h4&gt;&lt;p&gt;Infine può considerare i pronunciamenti di altri standard setter con un framework simile (ad esempio il FASB), la letteratura e le prassi di settore, purché coerenti con i punti precedenti.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;IAS ≠ «vecchi e superati»&lt;/strong&gt;&lt;p&gt;IAS e IFRS hanno lo stesso valore: la differenza è solo l&#x27;ente che li ha emessi. Molti IAS sono pienamente in vigore (IAS 2 rimanenze, IAS 16 immobili, impianti e macchinari, IAS 36 riduzione di valore, IAS 38 attività immateriali); altri sono stati sostituiti da IFRS (IAS 39 → IFRS 9 strumenti finanziari; IAS 18 → IFRS 15 ricavi; IAS 17 → IFRS 16 leasing; IAS 1 → IFRS 18 presentazione del bilancio, dal 2027). Nell&#x27;UE vale solo ciò che è stato omologato: si parla di «IFRS as adopted by the EU». &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s8&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt; IAS/IFRS developing process &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 11&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Uno standard nasce da un &lt;em class=&quot;en&quot;&gt;due process&lt;/em&gt; (procedura pubblica e trasparente di consultazione): lo IASB propone, chiunque può commentare, lo IASB rivede. La slide 11 ne riassume le tappe e aggiunge che, per l&#x27;UE, servono un processo di approvazione e applicazione (&lt;strong&gt;EFRAG&lt;/strong&gt; e &lt;strong&gt;ARC&lt;/strong&gt;) e la &lt;strong&gt;traduzione&lt;/strong&gt;. Scorri i passi.&lt;/p&gt;

    &lt;div class=&quot;stepper&quot; data-stepper&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 900 200&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;path class=&quot;track&quot; d=&quot;M75 50H825V150H150&quot; fill=&quot;none&quot;/&gt;
        &lt;text x=&quot;20&quot; y=&quot;18&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; class=&quot;soft&quot;&gt;IASB · DUE PROCESS&lt;/text&gt;
        &lt;text x=&quot;880&quot; y=&quot;118&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; class=&quot;soft&quot; text-anchor=&quot;end&quot;&gt;UNIONE EUROPEA · ENDORSEMENT&lt;/text&gt;
        &lt;g data-s=&quot;0&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;75&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;75&quot; y=&quot;54&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;75&quot; y=&quot;90&quot;&gt;Agenda&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;1&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;225&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;225&quot; y=&quot;54&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;225&quot; y=&quot;90&quot;&gt;DP&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;2&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;375&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;375&quot; y=&quot;54&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;375&quot; y=&quot;90&quot;&gt;Comment letters&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;3&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;525&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;525&quot; y=&quot;54&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;525&quot; y=&quot;90&quot;&gt;ED&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;4&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;675&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;675&quot; y=&quot;54&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;675&quot; y=&quot;90&quot;&gt;Comment letters&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;5&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;825&quot; cy=&quot;50&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;825&quot; y=&quot;54&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;790&quot; y=&quot;90&quot;&gt;IAS/IFRS&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;6&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;825&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;825&quot; y=&quot;154&quot;&gt;7&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;825&quot; y=&quot;190&quot;&gt;EFRAG&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;7&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;600&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;600&quot; y=&quot;154&quot;&gt;8&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;600&quot; y=&quot;190&quot;&gt;ARC&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;8&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;375&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;375&quot; y=&quot;154&quot;&gt;9&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;375&quot; y=&quot;190&quot;&gt;Commissione&lt;/text&gt;&lt;/g&gt;
        &lt;g data-s=&quot;9&quot;&gt;&lt;circle class=&quot;dot&quot; cx=&quot;150&quot; cy=&quot;150&quot; r=&quot;18&quot;/&gt;&lt;text class=&quot;dn&quot; x=&quot;150&quot; y=&quot;154&quot;&gt;10&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;150&quot; y=&quot;190&quot;&gt;G.U. UE e traduzione&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Agenda e ricerca &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Lo IASB individua un problema (una prassi divergente, una nuova operazione economica, una richiesta degli stakeholder) e decide se inserirlo nel proprio piano di lavoro. È qui che «la contabilità segue l&#x27;economia» (slide 2).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · DP — Discussion Paper&lt;/h4&gt;&lt;p&gt;Documento di discussione: descrive il problema, le possibili soluzioni e le opinioni preliminari dello IASB. Non è ancora un testo di standard. Per modifiche di portata limitata può essere saltato.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Comment letters&lt;/h4&gt;&lt;p&gt;Lettere di commento: imprese, revisori, analisti, standard setter nazionali (come l&#x27;OIC), autorità, accademici rispondono per iscritto. Le lettere sono pubbliche e pubblicate sul sito dello IASB.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · ED — Exposure Draft&lt;/h4&gt;&lt;p&gt;Bozza di standard: il testo proposto, con le motivazioni (&lt;em class=&quot;en&quot;&gt;Basis for Conclusions&lt;/em&gt;). È la proposta concreta che verrà commentata.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Comment letters (di nuovo)&lt;/h4&gt;&lt;p&gt;Seconda tornata di commenti sull&#x27;Exposure Draft, insieme a incontri e test sul campo. Se le modifiche sono sostanziali, lo IASB può ripubblicare una nuova bozza.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;6 · Emanazione dello standard&lt;/h4&gt;&lt;p&gt;Lo IASB approva e pubblica il nuovo IFRS (o la modifica di un IAS/IFRS esistente), con una data di entrata in vigore spesso lontana di qualche anno per permettere alle imprese di prepararsi.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; Esempio recente: l&#x27;IFRS 20 &lt;em&gt;Regulatory Assets and Regulatory Liabilities&lt;/em&gt;, emesso il 27 maggio 2026, in vigore dal 1° gennaio 2029, risulta nel rapporto EFRAG di luglio 2026 tra gli standard in attesa di omologazione UE. &lt;a href=&quot;https://www.efrag.org/sites/default/files/media/document/2026-07/EFRAG%20Endorsement%20Status%20Report%2023%20July%202026.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG — Endorsement Status Report, 23 luglio 2026&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;7 · EFRAG — parere tecnico&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;em class=&quot;en&quot;&gt;European Financial Reporting Advisory Group&lt;/em&gt; valuta lo standard e consiglia alla Commissione europea se omologarlo.&lt;/p&gt;&lt;p class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt; L&#x27;EFRAG esprime un &lt;em&gt;endorsement advice&lt;/em&gt; sulla conformità ai criteri del Regolamento IAS, incluso l&#x27;interesse pubblico europeo (&lt;em&gt;European public good&lt;/em&gt;); il ruolo è consultivo, la decisione spetta alla Commissione. &lt;a href=&quot;https://www.efrag.org/en/financial-reporting/about-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG — About Financial Reporting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;8 · ARC — voto degli Stati&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;em class=&quot;en&quot;&gt;Accounting Regulatory Committee&lt;/em&gt;, composto da rappresentanti degli Stati membri e presieduto dalla Commissione, vota la proposta di omologazione.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;9 · Adozione da parte della Commissione &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Dopo il voto dell&#x27;ARC e un periodo di controllo di Parlamento europeo e Consiglio, la Commissione adotta un regolamento che modifica il Regolamento 1126/2008, il «contenitore» degli IAS/IFRS omologati.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;10 · Pubblicazione e traduzione&lt;/h4&gt;&lt;p&gt;Il regolamento è pubblicato nella Gazzetta ufficiale dell&#x27;UE in tutte le lingue ufficiali. La &lt;strong&gt;traduzione&lt;/strong&gt; conta: per un&#x27;impresa italiana il testo giuridicamente vincolante è la versione italiana pubblicata in G.U.UE, non l&#x27;originale inglese dello IASB. Tradurre termini tecnici (es. &lt;em class=&quot;en&quot;&gt;impairment&lt;/em&gt; = riduzione di valore) richiede scelte che possono influenzare l&#x27;interpretazione.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Perché due fasi distinte?&lt;/strong&gt;&lt;p&gt;Lo IASB è un organismo privato: i suoi standard non hanno forza di legge. Nell&#x27;UE diventano obbligatori solo attraverso un atto pubblico, il regolamento di omologazione. Per questo uno standard emesso dallo IASB può non essere ancora applicabile in Europa, o in casi rari essere omologato in modo parziale (&lt;em class=&quot;en&quot;&gt;carve-out&lt;/em&gt;). &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s9&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt; Accounting systems / Bookkeeping system &lt;span class=&quot;src sl&quot;&gt;Dalle slide · s. 12–13&lt;/span&gt;&lt;/h2&gt;
    &lt;blockquote class=&quot;slide&quot;&gt;
      &lt;p&gt;«Accounting systems are relevant as they influence the ways in which businesses are recorded.»&lt;/p&gt;
      &lt;p&gt;«Understanding and applying the rules set out in the accounting principles is necessary to contextualise them within the framework of accounting system rules.»&lt;/p&gt;
    &lt;/blockquote&gt;
    &lt;p&gt;Un &lt;strong&gt;sistema contabile&lt;/strong&gt; (&lt;em class=&quot;en&quot;&gt;accounting system&lt;/em&gt; o &lt;em class=&quot;en&quot;&gt;bookkeeping system&lt;/em&gt;) è l&#x27;insieme coordinato dei conti con cui si registrano le operazioni in partita doppia. Ogni sistema ha un &lt;strong&gt;oggetto&lt;/strong&gt; (che cosa vuole misurare) e classifica di conseguenza le variazioni prodotte da ogni operazione. I principi contabili dicono &lt;em&gt;quanto&lt;/em&gt; e &lt;em&gt;quando&lt;/em&gt; rilevare; il sistema decide &lt;em&gt;come&lt;/em&gt; rappresentarlo. La slide 13 confronta due sistemi.&lt;/p&gt;

    &lt;figure class=&quot;fig&quot;&gt;
      &lt;div class=&quot;fig-scroll&quot;&gt;
      &lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;sys-t&quot;&gt;
        &lt;title id=&quot;sys-t&quot;&gt;Sistema patrimoniale: variazioni patrimoniali ed economiche. Sistema del reddito: variazioni finanziarie ed economiche.&lt;/title&gt;
        &lt;text x=&quot;190&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Patrimonial Accounting System&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Income Accounting System&lt;/text&gt;
        &lt;text x=&quot;190&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;oggetto: il patrimonio&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; class=&quot;soft&quot;&gt;oggetto: il reddito&lt;/text&gt;
        &lt;circle cx=&quot;120&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;120&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Equity/Asset&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;patrimoniali&lt;/text&gt;
        &lt;circle cx=&quot;262&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;262&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;262&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;economiche&lt;/text&gt;
        &lt;circle cx=&quot;500&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;500&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;(numerical) finanziarie&lt;/text&gt;
        &lt;circle cx=&quot;642&quot; cy=&quot;130&quot; r=&quot;62&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:1.5&quot;/&gt;
        &lt;text x=&quot;642&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot;&gt;Economic&lt;/text&gt;&lt;text x=&quot;642&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;soft&quot;&gt;economiche&lt;/text&gt;
        &lt;line x1=&quot;380&quot; y1=&quot;40&quot; x2=&quot;380&quot; y2=&quot;235&quot; class=&quot;ln dash&quot;/&gt;
        &lt;text x=&quot;190&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;attività, passività, netto ↔ costi e ricavi&lt;/text&gt;
        &lt;text x=&quot;570&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;denaro, crediti, debiti ↔ costi, ricavi, netto&lt;/text&gt;
      &lt;/svg&gt;
      &lt;/div&gt;
      &lt;figcaption&gt;Ogni operazione produce due variazioni (partita doppia). I due sistemi le classificano in modo diverso.&lt;/figcaption&gt;
    &lt;/figure&gt;

    &lt;div class=&quot;tabs&quot; data-tabs&gt;
      &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;I due sistemi&quot;&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Sistema patrimoniale&lt;/button&gt;
        &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Sistema del reddito&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
        &lt;p&gt;Al centro c&#x27;è il &lt;strong&gt;patrimonio&lt;/strong&gt;: attività, passività e netto. Le variazioni si dividono in &lt;strong&gt;patrimoniali&lt;/strong&gt; (aumenti e diminuzioni di attività, passività e capitale) ed &lt;strong&gt;economiche&lt;/strong&gt; (costi e ricavi, cioè le cause delle variazioni del netto prodotte dalla gestione). È la logica della prassi internazionale e degli IAS/IFRS, che definiscono i ricavi e i costi a partire da variazioni di attività e passività.&lt;/p&gt;
        &lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Equity&lt;small&gt;Equity finale = Equity iniziale + apporti − prelievi + (Income − Expenses)&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
        &lt;p&gt;Al centro c&#x27;è il &lt;strong&gt;reddito&lt;/strong&gt;. Le variazioni si dividono in &lt;strong&gt;finanziarie&lt;/strong&gt; (o &lt;em&gt;numerarie&lt;/em&gt;: denaro in cassa e in banca, crediti e debiti di regolamento e di finanziamento) ed &lt;strong&gt;economiche&lt;/strong&gt; (costi, ricavi e conti del netto). Il patrimonio emerge solo a fine esercizio, come effetto della determinazione del reddito. È il sistema tradizionalmente più diffuso nell&#x27;insegnamento e nella prassi italiana.&lt;/p&gt;
        &lt;div class=&quot;formula&quot;&gt;Reddito = Ricavi − Costi di competenza&lt;small&gt;I beni durevoli acquistati sono costi «sospesi», rinviati agli esercizi futuri con l&#x27;ammortamento&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext-box&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;p&gt;La storiografia attribuisce il sistema patrimoniale a &lt;strong&gt;Fabio Besta&lt;/strong&gt; (fine Ottocento) e il sistema del reddito a &lt;strong&gt;Gino Zappa&lt;/strong&gt; (1879–1960), suo allievo e fondatore dell&#x27;economia aziendale italiana; il sistema del reddito si è diffuso in Italia, mentre nella prassi internazionale è prevalso quello patrimoniale. &lt;a href=&quot;https://www.emeraldinsight.com/doi/abs/10.1108/eb043403&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald — «Italian Accounting Research in the First Half of the 20th Century»&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;widget&quot; id=&quot;sysw&quot;&gt;
      &lt;h4&gt;Stessa operazione, due sistemi: scegli un&#x27;operazione&lt;/h4&gt;
      &lt;p style=&quot;margin:.2rem 0;font-size:.9rem;color:var(--soft)&quot;&gt;Scritture semplificate, senza IVA. &lt;span class=&quot;chip pat&quot;&gt;patrimoniale&lt;/span&gt; &lt;span class=&quot;chip fin&quot;&gt;finanziaria&lt;/span&gt; &lt;span class=&quot;chip eco&quot;&gt;economica&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;choices&quot; role=&quot;group&quot; aria-label=&quot;Operazioni&quot;&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t1&quot;&gt;Apporto dei soci 50.000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t2&quot;&gt;Mutuo bancario 20.000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t3&quot;&gt;Macchinario a debito 30.000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t4&quot;&gt;Merci pagate con banca 8.000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t5&quot;&gt;Vendita a credito 12.000&lt;/button&gt;
        &lt;button class=&quot;choice&quot; type=&quot;button&quot; data-k=&quot;t6&quot;&gt;Salari pagati 4.000&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;sys-out&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;result&quot;&gt;&lt;p&gt;Seleziona un&#x27;operazione.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Perché conta per questo corso&lt;/strong&gt;&lt;p&gt;La slide 12 lo dice: per capire e applicare un principio contabile bisogna collocarlo nelle regole del sistema contabile. Gli IAS/IFRS ragionano per attività e passività (logica patrimoniale): chi ha imparato a registrare con il sistema del reddito deve «tradurre». Esempio: l&#x27;acquisto di un macchinario, per lo IAS 16 è la rilevazione di un&#x27;attività; nel sistema del reddito è un costo pluriennale sospeso. Il numero finale in bilancio è lo stesso, ma la lettura cambia. &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;1. Il Conceptual Framework è in conflitto con uno specifico IFRS. Che cosa prevale?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Il Conceptual Framework, perché è il fondamento di tutto.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Lo standard: il Framework non è uno standard e non prevale su nessuno standard.&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Decide il revisore caso per caso.&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;È esattamente il senso della slide 10: «the Conceptual Framework is not a standard».&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;2. In quale ordine si sviluppa uno standard IASB, secondo la slide 11?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;Exposure Draft → Discussion Paper → IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;Discussion Paper → comment letters → Exposure Draft → comment letters → IFRS&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;IFRS → EFRAG → Exposure Draft&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Prima si discute il problema (DP), poi si propone un testo (ED); entrambe le fasi sono seguite da commenti pubblici. Nell&#x27;UE seguono poi EFRAG, ARC e la traduzione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p class=&quot;qt&quot;&gt;3. Acquisto di un macchinario con pagamento differito: nel sistema del reddito, il conto Macchinari accoglie una variazione…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;finanziaria&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot; data-ok&gt;economica (costo pluriennale sospeso)&lt;/button&gt;
      &lt;button class=&quot;opt&quot; type=&quot;button&quot;&gt;patrimoniale&lt;/button&gt;
    &lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Nel sistema del reddito sono finanziarie solo le variazioni di denaro, crediti e debiti. Il macchinario è un costo che si rinvia agli esercizi futuri con l&#x27;ammortamento. Nel sistema patrimoniale sarebbe invece una variazione patrimoniale (attività ↑).&lt;/p&gt;&lt;/div&gt;
    &lt;details class=&quot;open-q&quot;&gt;&lt;summary&gt;Domanda aperta: che ruolo hanno EFRAG e ARC, e perché serve la traduzione? &lt;span&gt;Mostra risposta&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli standard dello IASB non sono obbligatori nell&#x27;UE finché non vengono omologati. L&#x27;EFRAG fornisce alla Commissione un parere tecnico sulla conformità ai criteri del Regolamento 1606/2002; l&#x27;ARC, con i rappresentanti degli Stati membri, vota la proposta; la Commissione adotta il regolamento. Il testo è poi pubblicato in tutte le lingue UE: la versione tradotta è quella giuridicamente vincolante nel singolo Paese.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;div class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;
    &lt;div class=&quot;part-num&quot;&gt;↗&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;kicker&quot;&gt;Per approfondire&lt;/p&gt;&lt;h2&gt;Norme, standard, enti e studi citati nelle slide&lt;/h2&gt;&lt;p&gt;Ogni scheda è &lt;strong&gt;fonte esterna&lt;/strong&gt;: dati cercati sul web, con link. Le slide non contengono riferimenti bibliografici; qui trovi i documenti a cui rimandano.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme europee&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Regolamento (CE) n. 1606/2002&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citato nella slide 9&lt;/p&gt;&lt;p&gt;Regolamento del 19 luglio 2002 (G.U. L 243 dell&#x27;11/9/2002) sull&#x27;applicazione dei principi contabili internazionali. Definisce IAS/IFRS e interpretazioni, crea il meccanismo di omologazione, impone gli IAS/IFRS ai consolidati delle quotate dal 2005.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è l&#x27;atto che rende gli IAS/IFRS diritto europeo.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Reg. 1606/2002&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Direttiva 2013/34/UE&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citata nelle slide 3, 6 e 9&lt;/p&gt;&lt;p&gt;Direttiva sui bilanci d&#x27;esercizio e consolidati e relative relazioni. Pubblicata il 29/6/2013, recepimento entro il 20/7/2015. Bilancio come insieme unitario (stato patrimoniale, conto economico, nota integrativa), quadro fedele, regole per dimensione d&#x27;impresa.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è la base del bilancio civilistico italiano.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 2013/34/UE&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IV Direttiva 78/660/CEE&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citata nella slide 9&lt;/p&gt;&lt;p&gt;Prima direttiva contabile: conti annuali delle società di capitali, con il requisito di un quadro fedele (&lt;em&gt;true and fair view&lt;/em&gt;) di patrimonio, situazione finanziaria e risultato. Modificata più volte (anche nel 2006), poi abrogata e sostituita dalla Dir. 2013/34/UE.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: avvia l&#x27;armonizzazione contabile europea.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/1978/660/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 78/660/CEE&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;VII Direttiva 83/349/CEE&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citata nella slide 9&lt;/p&gt;&lt;p&gt;Coordina le norme nazionali sui bilanci consolidati (di gruppo), con soglie per l&#x27;esonero dei piccoli gruppi. Anch&#x27;essa confluita nella Dir. 2013/34/UE.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: introduce in modo armonizzato il bilancio consolidato.&lt;/p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/1983/349/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eur-lex.europa.eu — Dir. 83/349/CEE&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Strategia della Commissione 1995 — COM(95) 508&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citata nella slide 9 («European Commission Strategy – 1995»)&lt;/p&gt;&lt;p&gt;«Accounting harmonisation: a new strategy vis-à-vis international harmonisation», 14 novembre 1995. La Commissione sceglie di lavorare con lo IASC invece di affidarsi solo alle direttive; ne segue la verifica di conformità degli IAS alle direttive.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è la svolta dell&#x27;UE verso gli standard internazionali.&lt;/p&gt;&lt;a href=&quot;https://op.europa.eu/en/publication-detail/-/publication/5fccfaf1-382b-429e-a66a-8e195805b566&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;op.europa.eu — scheda della pubblicazione&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Comunicazione COM(2000) 359 — «EU Financial Reporting Strategy: the way forward»&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegata alla slide 9, che indica «COM/2000 692/2 – Action plan for financial services»&lt;/p&gt;&lt;p&gt;Comunicazione del 13 giugno 2000: propone di obbligare le società quotate UE a redigere il consolidato secondo gli IAS dal 2005. Si inserisce nel Piano d&#x27;azione per i servizi finanziari del 1999. Il numero indicato nella slide non corrisponde a quello trovato: verifica con il docente.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è il documento politico da cui nasce il Reg. 1606/2002.&lt;/p&gt;&lt;a href=&quot;https://eumonitor.nl/9353000/1/j4nvke1fm2yd1u0_j9vvik7m1c3gyxp/vkcweeb4w3zv/v=s7z/f=/com(2000)359_en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eumonitor.nl — testo COM(2000) 359 (PDF)&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme italiane&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 18 agosto 2015, n. 139&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegato alla slide 6 (Dir. 34/2013 nel Codice civile)&lt;/p&gt;&lt;p&gt;Recepisce la Dir. 2013/34/UE modificando gli artt. 2423 ss. c.c. e il D.Lgs. 127/1991 sul consolidato; si applica dagli esercizi iniziati dal 1/1/2016.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è il «D.Lgs.» concreto di cui parla la slide.&lt;/p&gt;&lt;a href=&quot;https://legislazionetecnica.it/node/2158681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislazionetecnica.it — D.Lgs. 139/2015&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 28 febbraio 2005, n. 38&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegato alla slide 7 (IAS/IFRS «for listed companies and other companies»)&lt;/p&gt;&lt;p&gt;Esercita le opzioni dell&#x27;art. 5 del Reg. 1606/2002: obbligo IAS/IFRS per quotate, emittenti di strumenti diffusi, banche, SIM, SGR, enti finanziari vigilati; facoltà per altre non quotate; regole su utili da fair value.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: definisce gli «other companies» della slide.&lt;/p&gt;&lt;a href=&quot;https://www.fondazionenazionalecommercialisti.it/system/files/imce/aree-tematiche/pac/DOC_2005_23_Adozione%20IAS.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione Nazionale Commercialisti — documento (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;OIC — Organismo Italiano di Contabilità&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citato nella slide 7&lt;/p&gt;&lt;p&gt;Fondazione costituita nel 2001, riconosciuta dalla L. 116/2014 come istituto nazionale per i principi contabili. Emana i principi OIC per i bilanci redatti secondo il Codice civile, dopo consultazione pubblica.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: i principi OIC sono la regola pratica per le non quotate.&lt;/p&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Standard setter, accordi ed enti internazionali&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS Foundation — Preface e Conceptual Framework&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citati nella slide 10&lt;/p&gt;&lt;p&gt;La Preface spiega che il Conceptual Framework descrive obiettivo e concetti dell&#x27;informativa finanziaria, non è uno standard e non prevale sugli standard; versione rivista nel 2018.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: chiarisce la gerarchia del corpus IAS/IFRS.&lt;/p&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/preface-to-ifrs-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — Preface to IFRS Standards&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;SIC e IFRIC — le interpretazioni&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citate nella slide 10&lt;/p&gt;&lt;p&gt;Lo IASB ha adottato nel 2001 gli IAS e le SIC esistenti; l&#x27;IFRIC ha sostituito lo Standing Interpretations Committee nel 2002 ed è stato rinominato IFRS Interpretations Committee nel 2010. Molte SIC e IFRIC sono state poi superate.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: le interpretazioni sono vincolanti come gli standard.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/library/research-guides/international-accounting-standards/superseded-ifrs-accounting-standards/superseded-ifric-and-sic-interpretations&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW — Superseded IFRIC and SIC interpretations&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;FASB Accounting Standards Codification (US GAAP)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegata alla slide 3 (US GAAP)&lt;/p&gt;&lt;p&gt;Dal 1° luglio 2009 è l&#x27;unica fonte autorevole degli US GAAP non governativi; ha sostituito i pronunciamenti FASB, AICPA, EITF. La «basic view» è consultabile gratuitamente.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è dove si trovano oggi gli US GAAP.&lt;/p&gt;&lt;a href=&quot;https://dart.deloitte.com/USDART/home/accounting/archive-1/us-gaap/fasb-reports-news-items/2009/fasb-accounting-standards-codification-launches-today&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte DART — FASB Codification launches&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IOSCO — risoluzione del 2000 sugli standard IASC&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citata nella slide 8 («The Role of IOSCO»)&lt;/p&gt;&lt;p&gt;Il 17 maggio 2000 IOSCO raccomanda ai membri di accettare per gli emittenti multinazionali i 30 «IASC 2000 standards», con possibili trattamenti supplementari (riconciliazioni, informativa).&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: primo riconoscimento degli IAS da parte delle autorità di borsa.&lt;/p&gt;&lt;a href=&quot;https://www.iosco.org/library/resolutions/pdf/IOSCORES19.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iosco.org — Resolution (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Norwalk Agreement (2002)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citato nella slide 8 (come «Norfolk Agreement»)&lt;/p&gt;&lt;p&gt;Memorandum of Understanding FASB–IASB, riunione congiunta di Norwalk (Connecticut) del 18 settembre 2002: impegno a rendere compatibili gli standard e a coordinare i lavori futuri.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: avvia formalmente la convergenza IFRS–US GAAP.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — testo dell&#x27;accordo (PDF)&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IASB–FASB convergence: MoU 2006 e 2008&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegato alla slide 8 («revival of the project in 2006»)&lt;/p&gt;&lt;p&gt;Cronologia del progetto: la roadmap del 2006, l&#x27;aggiornamento del 2008 con l&#x27;obiettivo di chiudere i grandi progetti comuni entro il 2011.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: mostra come la convergenza è stata rilanciata e poi rallentata.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iasplus.com — IASB-FASB convergence&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;G20 di Pittsburgh (2009)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citato nella slide 8&lt;/p&gt;&lt;p&gt;I leader chiedono un unico set di standard globali di alta qualità e la fine della convergenza entro giugno 2011; a Toronto (2010) la scadenza non viene ribadita.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è il massimo sostegno politico alla convergenza.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2009/September/news5386&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iasplus.com — G20 call for global standards by 2011&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;EFRAG e ARC — l&#x27;omologazione UE&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Citati nella slide 11&lt;/p&gt;&lt;p&gt;L&#x27;EFRAG consiglia la Commissione sull&#x27;omologazione di standard nuovi o modificati, verificando i criteri del Regolamento IAS e l&#x27;interesse pubblico europeo; l&#x27;ARC vota; i rapporti periodici di EFRAG mostrano lo stato di ogni standard.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: senza questi passaggi un IFRS non si applica nell&#x27;UE.&lt;/p&gt;&lt;a href=&quot;https://www.efrag.org/en/financial-reporting/about-financial-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;efrag.org — About Financial Reporting&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;

  &lt;h3&gt;Studi e storia della disciplina&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;DiMaggio e Powell (1983), «The Iron Cage Revisited»&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Collegato alla slide 8 (&lt;em&gt;isomorphism&lt;/em&gt;)&lt;/p&gt;&lt;p&gt;Articolo pubblicato sull&#x27;&lt;em&gt;American Sociological Review&lt;/em&gt;: spiega perché le organizzazioni di uno stesso campo diventano simili, distinguendo isomorfismo coercitivo, mimetico e normativo. Molti studi lo usano per spiegare l&#x27;adozione degli IFRS e degli IPSAS.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: è l&#x27;origine teorica del termine usato nella slide.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.2307/2095101&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.2307/2095101&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Luca Pacioli, &lt;em&gt;Summa de arithmetica&lt;/em&gt; (1494)&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Contesto per la slide 2 (non citato nelle slide)&lt;/p&gt;&lt;p&gt;Stampata a Venezia; il trattato &lt;em&gt;Particularis de computis et scripturis&lt;/em&gt; descrive la partita doppia come «metodo di Venezia», già in uso da tempo, e fu usato come manuale in tutta Europa.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: esempio di contabilità che nasce dove si sviluppa l&#x27;economia.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/library/library-collection/historical-accounting-literature/earliest-books-on-bookkeeping&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW Library — Earliest books on bookkeeping&lt;/a&gt;&lt;/article&gt;
    &lt;article class=&quot;ref&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Besta e Zappa: sistema patrimoniale e sistema del reddito&lt;/h4&gt;&lt;p class=&quot;where&quot;&gt;Contesto per la slide 13 (autori non citati nelle slide)&lt;/p&gt;&lt;p&gt;Studio sulla ricerca contabile italiana della prima metà del Novecento: il passaggio dalla visione patrimoniale di Fabio Besta a quella reddituale di Gino Zappa.&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Perché conta: spiega da dove vengono i due sistemi confrontati nella slide.&lt;/p&gt;&lt;a href=&quot;https://www.emeraldinsight.com/doi/abs/10.1108/eb043403&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emerald — Italian Accounting Research in the First Half of the 20th Century&lt;/a&gt;&lt;/article&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  /* linguette */
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
    var btns=t.querySelectorAll(&#x27;[role=tab]&#x27;),panels=t.querySelectorAll(&#x27;[role=tabpanel]&#x27;);
    btns.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
      btns.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);panels[j].hidden=j!==i;});
    });});
  });

  /* passi da scorrere */
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(s){
    var steps=s.querySelectorAll(&#x27;.step&#x27;),marks=s.querySelectorAll(&#x27;[data-s]&#x27;),
        prev=s.querySelector(&#x27;.prev&#x27;),next=s.querySelector(&#x27;.next&#x27;),count=s.querySelector(&#x27;.count&#x27;),i=0;
    function show(){
      steps.forEach(function(st,j){st.hidden=j!==i;});
      marks.forEach(function(m){var k=+m.getAttribute(&#x27;data-s&#x27;);m.classList.toggle(&#x27;on&#x27;,k&lt;=i);m.classList.toggle(&#x27;cur&#x27;,k===i);});
      prev.disabled=i===0;next.disabled=i===steps.length-1;
      count.textContent=&#x27;Passo &#x27;+(i+1)+&#x27; di &#x27;+steps.length;
    }
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    marks.forEach(function(m){
      m.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);m.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
      function go(){i=+m.getAttribute(&#x27;data-s&#x27;);show();}
      m.addEventListener(&#x27;click&#x27;,go);
      m.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go();}});
    });
    show();
  });

  /* autoverifica */
  document.querySelectorAll(&#x27;.q&#x27;).forEach(function(q){
    var opts=q.querySelectorAll(&#x27;.opt&#x27;),why=q.querySelector(&#x27;.why&#x27;);
    opts.forEach(function(o){o.addEventListener(&#x27;click&#x27;,function(){
      opts.forEach(function(x){x.disabled=true;if(x.hasAttribute(&#x27;data-ok&#x27;))x.classList.add(&#x27;ok&#x27;);});
      if(!o.hasAttribute(&#x27;data-ok&#x27;))o.classList.add(&#x27;no&#x27;);
      if(why){why.hidden=false;why.insertAdjacentText(&#x27;afterbegin&#x27;,o.hasAttribute(&#x27;data-ok&#x27;)?&#x27;Esatto. &#x27;:&#x27;Non proprio. &#x27;);}
    });});
  });

  /* scelte con pulsanti */
  function choices(root,render){
    var bs=root.querySelectorAll(&#x27;.choice&#x27;);
    bs.forEach(function(b){b.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.setAttribute(&#x27;aria-pressed&#x27;,x===b);});render(b.getAttribute(&#x27;data-k&#x27;));
    });});
  }

  /* cash vs accrual */
  var mesi=[&#x27;gennaio&#x27;,&#x27;febbraio&#x27;,&#x27;marzo&#x27;,&#x27;aprile&#x27;,&#x27;maggio&#x27;,&#x27;giugno&#x27;,&#x27;luglio&#x27;,&#x27;agosto&#x27;,&#x27;settembre&#x27;,&#x27;ottobre&#x27;,&#x27;novembre&#x27;,&#x27;dicembre&#x27;];
  var ws=document.getElementById(&#x27;w-start&#x27;),wd=document.getElementById(&#x27;w-delay&#x27;);
  function fmt(n){return n.toLocaleString(&#x27;it-IT&#x27;)+&#x27; €&#x27;;}
  function drawCash(){
    var S=+ws.value,D=+wd.value,yrs=[2026,2027,2028],acc=[0,0,0],cash=[0,0,0];
    for(var m=S;m&lt;S+12;m++){acc[Math.floor((m-1)/12)]+=1000;}
    var pm=S+D;cash[Math.floor((pm-1)/12)]+=12000;
    document.getElementById(&#x27;o-start&#x27;).textContent=mesi[S-1];
    document.getElementById(&#x27;o-delay&#x27;).textContent=D;
    var h=&#x27;&#x27;,base=200,sc=170/12000;
    h+=&#x27;&lt;line x1=&quot;40&quot; y1=&quot;&#x27;+base+&#x27;&quot; x2=&quot;620&quot; y2=&quot;&#x27;+base+&#x27;&quot; class=&quot;ln&quot;/&gt;&#x27;;
    yrs.forEach(function(y,i){
      var x=70+i*190;
      [[&#x27;cash&#x27;,cash[i],&#x27;var(--ochre)&#x27;],[&#x27;acc&#x27;,acc[i],&#x27;var(--slate)&#x27;]].forEach(function(b,k){
        var bh=b[1]*sc,bx=x+k*62;
        h+=&#x27;&lt;rect x=&quot;&#x27;+bx+&#x27;&quot; y=&quot;&#x27;+(base-bh)+&#x27;&quot; width=&quot;54&quot; height=&quot;&#x27;+bh+&#x27;&quot; rx=&quot;4&quot; style=&quot;fill:&#x27;+b[2]+&#x27;&quot;/&gt;&#x27;;
        h+=&#x27;&lt;text x=&quot;&#x27;+(bx+27)+&#x27;&quot; y=&quot;&#x27;+(base-bh-6)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+(b[1]/1000).toLocaleString(&#x27;it-IT&#x27;)+&#x27;k&lt;/text&gt;&#x27;;
      });
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+58)+&#x27;&quot; y=&quot;&#x27;+(base+20)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; class=&quot;serif&quot; font-weight=&quot;600&quot;&gt;&#x27;+y+&#x27;&lt;/text&gt;&#x27;;
    });
    h+=&#x27;&lt;rect x=&quot;40&quot; y=&quot;228&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;2&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;58&quot; y=&quot;239&quot; font-size=&quot;12.5&quot;&gt;cash basis (incassi)&lt;/text&gt;&#x27;;
    h+=&#x27;&lt;rect x=&quot;220&quot; y=&quot;228&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;2&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;239&quot; font-size=&quot;12.5&quot;&gt;accrual basis (ricavi di competenza)&lt;/text&gt;&#x27;;
    document.getElementById(&#x27;cash-chart&#x27;).innerHTML=h;
    var y0=2026+Math.floor((pm-1)/12),mesiIn=13-S;
    document.getElementById(&#x27;cash-msg&#x27;).innerHTML=&#x27;&lt;p&gt;Il servizio dura 12 mesi da &#x27;+mesi[S-1]+&#x27; 2026: &lt;strong&gt;&#x27;+mesiIn+&#x27; mesi cadono nel 2026&lt;/strong&gt;, quindi per competenza il ricavo 2026 è &lt;strong&gt;&#x27;+fmt(acc[0])+&#x27;&lt;/strong&gt;&#x27;+(acc[1]?&#x27; e il resto (&#x27;+fmt(acc[1])+&#x27;) va nel 2027&#x27;:&#x27;&#x27;)+&#x27;.&lt;/p&gt;&lt;p&gt;Il cliente paga a &#x27;+mesi[(pm-1)%12]+&#x27; &#x27;+y0+&#x27;: per cassa tutti i 12.000 € finiscono nel &lt;strong&gt;&#x27;+y0+&#x27;&lt;/strong&gt;. &#x27;+(acc[0]===cash[0]&amp;&amp;acc[1]===cash[1]?&#x27;In questo caso i due criteri coincidono.&#x27;:&#x27;I due criteri danno risultati annuali diversi: solo la competenza misura il lavoro svolto in ciascun anno.&#x27;)+&#x27;&lt;/p&gt;&#x27;;
  }
  ws.addEventListener(&#x27;input&#x27;,drawCash);wd.addEventListener(&#x27;input&#x27;,drawCash);drawCash();

  /* albero Italia */
  var tree={
    quot:&#x27;&lt;p&gt;&lt;strong&gt;IAS/IFRS obbligatori&lt;/strong&gt; per il bilancio consolidato (direttamente dal Reg. 1606/2002, art. 4) e, in Italia, anche per il bilancio d\&#x27;esercizio (D.Lgs. 38/2005).&lt;/p&gt;&#x27;,
    banca:&#x27;&lt;p&gt;&lt;strong&gt;IAS/IFRS obbligatori&lt;/strong&gt;: il D.Lgs. 38/2005 li estende a banche e intermediari finanziari vigilati, anche se non quotati. Gli schemi di bilancio sono poi fissati dalla Banca d\&#x27;Italia.&lt;/p&gt;&#x27;,
    grande:&#x27;&lt;p&gt;&lt;strong&gt;Codice civile + principi OIC&lt;/strong&gt; come regola. Ma è uno dei casi in cui il D.Lgs. 38/2005 (art. 2-bis) consente la &lt;strong&gt;facoltà&lt;/strong&gt; di adottare gli IAS/IFRS: è la freccia tratteggiata dello schema.&lt;/p&gt;&#x27;,
    piccola:&#x27;&lt;p&gt;&lt;strong&gt;Codice civile + principi OIC&lt;/strong&gt;, con le semplificazioni del bilancio in forma abbreviata (art. 2435-bis c.c.). Le società che possono redigere il bilancio abbreviato non rientrano nella facoltà di usare gli IAS/IFRS.&lt;/p&gt;&#x27;,
    micro:&#x27;&lt;p&gt;&lt;strong&gt;Codice civile + principi OIC&lt;/strong&gt;, con le ulteriori semplificazioni per le micro-imprese (art. 2435-ter c.c., introdotto dal D.Lgs. 139/2015 recependo la Direttiva 34/2013).&lt;/p&gt;&#x27;
  };
  choices(document.getElementById(&#x27;treew&#x27;),function(k){document.getElementById(&#x27;tree-out&#x27;).innerHTML=tree[k];});

  /* elementi SVG cliccabili con pannello di dettaglio */
  function clickable(sel,out,data){
    var els=document.querySelectorAll(sel);
    els.forEach(function(g){
      g.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);g.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
      function go(){els.forEach(function(x){x.classList.toggle(&#x27;act&#x27;,x===g);});document.getElementById(out).innerHTML=data[g.getAttribute(&#x27;data-k&#x27;)];}
      g.addEventListener(&#x27;click&#x27;,go);
      g.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go();}});
    });
  }
  var X=&#x27; &lt;span class=&quot;src ext&quot;&gt;Fonte esterna&lt;/span&gt;&#x27;,C=&#x27; &lt;span class=&quot;src ctx&quot;&gt;Contesto&lt;/span&gt;&#x27;;
  clickable(&#x27;#eutl .tlp&#x27;,&#x27;eutl-out&#x27;,{
    d78:&#x27;&lt;p&gt;&lt;strong&gt;1978 · IV Direttiva 78/660/CEE&lt;/strong&gt; — conti annuali delle società di capitali: schemi di bilancio, criteri di valutazione, principio del quadro fedele.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    d83:&#x27;&lt;p&gt;&lt;strong&gt;1983 · VII Direttiva 83/349/CEE&lt;/strong&gt; — bilancio consolidato dei gruppi.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    dmod:&#x27;&lt;p&gt;&lt;strong&gt;2001–2006 · «Further modifications and updates»&lt;/strong&gt; — le due direttive vengono aggiornate più volte per avvicinarle agli IAS: ad esempio la direttiva sul &lt;em&gt;fair value&lt;/em&gt; (2001/65/CE), quella di modernizzazione (2003/51/CE) e la 2006/46/CE.&#x27;+C+&#x27;&lt;/p&gt;&#x27;,
    d13:&#x27;&lt;p&gt;&lt;strong&gt;2013 · Direttiva 2013/34/UE&lt;/strong&gt; — abroga e sostituisce la IV e la VII direttiva, unificandole; recepita in Italia con il D.Lgs. 139/2015.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    s95:&#x27;&lt;p&gt;&lt;strong&gt;1995 · Strategia della Commissione&lt;/strong&gt; — COM(95) 508, «Accounting harmonisation: a new strategy vis-à-vis international harmonisation»: invece di nuove direttive, l\&#x27;UE sceglie di collaborare con lo IASC.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    s00:&#x27;&lt;p&gt;&lt;strong&gt;2000 · Comunicazione della Commissione&lt;/strong&gt; — la slide indica «COM/2000 692/2 – Action plan for financial services». Il documento chiave del giugno 2000 è la COM(2000) 359 «EU Financial Reporting Strategy: the way forward», che attua il Piano d\&#x27;azione per i servizi finanziari del 1999 e propone gli IAS obbligatori per le quotate dal 2005.&#x27;+X+&#x27;&lt;/p&gt;&lt;p&gt;Il riferimento numerico della slide non coincide con quello trovato: conviene chiedere conferma al docente.&lt;/p&gt;&#x27;,
    r02:&#x27;&lt;p&gt;&lt;strong&gt;2002 · Regolamento (CE) 1606/2002&lt;/strong&gt; — rende obbligatori gli IAS/IFRS omologati per i consolidati delle società quotate a partire dal 2005.&#x27;+X+&#x27;&lt;/p&gt;&#x27;,
    a05:&#x27;&lt;p&gt;&lt;strong&gt;2005 · Prima applicazione&lt;/strong&gt; — i gruppi quotati europei redigono il primo bilancio consolidato IAS/IFRS (esercizi iniziati dal 1° gennaio 2005).&#x27;+C+&#x27;&lt;/p&gt;&#x27;,
    r08:&#x27;&lt;p&gt;&lt;strong&gt;2008 e oltre · Regolamento (CE) 1126/2008&lt;/strong&gt; — raccoglie in un unico testo tutti gli IAS/IFRS omologati; ogni nuovo standard o modifica lo aggiorna. Sono i «further modifications and updates» della slide.&#x27;+X+&#x27;&lt;/p&gt;&#x27;
  });
  clickable(&#x27;#bld .bp&#x27;,&#x27;bld-out&#x27;,{
    fs:&#x27;&lt;p&gt;&lt;strong&gt;Il risultato: il bilancio IAS/IFRS&lt;/strong&gt; (&lt;em class=&quot;en&quot;&gt;financial statements&lt;/em&gt;) — prospetto della situazione patrimoniale-finanziaria, prospetto di conto economico complessivo, variazioni del patrimonio netto, rendiconto finanziario, note. Si regge su tutti i livelli sottostanti.&lt;/p&gt;&#x27;,
    int:&#x27;&lt;p&gt;&lt;strong&gt;Interpretations&lt;/strong&gt; — chiariscono come applicare uno standard quando la prassi diverge. &lt;strong&gt;SIC&lt;/strong&gt;: emesse dallo &lt;em class=&quot;en&quot;&gt;Standing Interpretations Committee&lt;/em&gt; dello IASC fino al 2001. &lt;strong&gt;IFRIC&lt;/strong&gt;: emesse dall\&#x27;&lt;em class=&quot;en&quot;&gt;International Financial Reporting Interpretations Committee&lt;/em&gt; dal 2002, rinominato IFRS Interpretations Committee nel 2010. Hanno la stessa forza vincolante degli standard.&lt;/p&gt;&#x27;,
    ias:&#x27;&lt;p&gt;&lt;strong&gt;IAS · International Accounting Standards&lt;/strong&gt; — emessi dallo IASC (1973–2001), numerati da IAS 1 a IAS 41. Lo IASB li ha adottati nel 2001; quelli non sostituiti restano pienamente in vigore (es. IAS 2, 12, 16, 19, 36, 37, 38).&lt;/p&gt;&#x27;,
    ifrs:&#x27;&lt;p&gt;&lt;strong&gt;IFRS · International Financial Reporting Standards&lt;/strong&gt; — emessi dallo IASB dal 2001, a partire da IFRS 1 (prima adozione). Tra i più importanti: IFRS 3 aggregazioni aziendali, IFRS 9 strumenti finanziari, IFRS 10 consolidato, IFRS 15 ricavi, IFRS 16 leasing, IFRS 18 presentazione. Il termine «IFRS» indica anche, in senso ampio, l\&#x27;intero corpus (IAS + IFRS + interpretazioni).&lt;/p&gt;&#x27;,
    cf:&#x27;&lt;p&gt;&lt;strong&gt;Conceptual Framework&lt;/strong&gt; — «is not a standard» (slide 10). Fissa obiettivo, caratteristiche qualitative, definizioni degli elementi, criteri di rilevazione e misurazione. Serve allo IASB per scrivere standard coerenti e alle imprese quando manca uno standard (IAS 8). Non prevale mai su uno standard.&lt;/p&gt;&#x27;
  });

  /* due sistemi contabili */
  var P=[&#x27;pat&#x27;,&#x27;patrimoniale&#x27;],E=[&#x27;eco&#x27;,&#x27;economica&#x27;],F=[&#x27;fin&#x27;,&#x27;finanziaria&#x27;];
  var sys={
    t1:{r:[[&#x27;Banca c/c&#x27;,&#x27;Banca c/c&#x27;,&#x27;D&#x27;,50000,P,&#x27;attività ↑&#x27;,F,&#x27;denaro ↑&#x27;],[&#x27;Capitale sociale&#x27;,&#x27;Capitale sociale&#x27;,&#x27;A&#x27;,50000,P,&#x27;netto ↑ (apporto)&#x27;,E,&#x27;netto ↑&#x27;]],n:&#x27;L\&#x27;apporto aumenta il netto ma &lt;strong&gt;non è un ricavo&lt;/strong&gt; in nessuno dei due sistemi. Nel sistema del reddito il capitale è un conto economico «di netto».&#x27;},
    t2:{r:[[&#x27;Banca c/c&#x27;,&#x27;Banca c/c&#x27;,&#x27;D&#x27;,20000,P,&#x27;attività ↑&#x27;,F,&#x27;denaro ↑&#x27;],[&#x27;Mutui passivi&#x27;,&#x27;Mutui passivi&#x27;,&#x27;A&#x27;,20000,P,&#x27;passività ↑&#x27;,F,&#x27;debito ↑&#x27;]],n:&#x27;Pura permutazione: nessun effetto su netto e reddito. Nel sistema del reddito entrambe le variazioni sono finanziarie.&#x27;},
    t3:{r:[[&#x27;Macchinari&#x27;,&#x27;Macchinari&#x27;,&#x27;D&#x27;,30000,P,&#x27;attività ↑&#x27;,E,&#x27;costo pluriennale (sospeso)&#x27;],[&#x27;Debiti v/fornitori&#x27;,&#x27;Debiti v/fornitori&#x27;,&#x27;A&#x27;,30000,P,&#x27;passività ↑&#x27;,F,&#x27;debito ↑&#x27;]],n:&#x27;&lt;strong&gt;Qui i due sistemi divergono di più.&lt;/strong&gt; Per il sistema patrimoniale (e per lo IAS 16) il macchinario è un\&#x27;attività. Per il sistema del reddito è un costo che verrà ripartito sugli esercizi futuri con l\&#x27;ammortamento.&#x27;},
    t4:{r:[[&#x27;Merci (rimanenze)&#x27;,&#x27;Merci c/acquisti&#x27;,&#x27;D&#x27;,8000,P,&#x27;attività ↑&#x27;,E,&#x27;costo d\&#x27;esercizio&#x27;],[&#x27;Banca c/c&#x27;,&#x27;Banca c/c&#x27;,&#x27;A&#x27;,8000,P,&#x27;attività ↓&#x27;,F,&#x27;denaro ↓&#x27;]],n:&#x27;Anche i nomi dei conti cambiano. Nel sistema patrimoniale le merci entrano in magazzino come attività e diventano costo quando vendute. Nel sistema del reddito sono subito un costo; a fine anno le rimanenze lo rettificano.&#x27;},
    t5:{r:[[&#x27;Crediti v/clienti&#x27;,&#x27;Crediti v/clienti&#x27;,&#x27;D&#x27;,12000,P,&#x27;attività ↑&#x27;,F,&#x27;credito ↑&#x27;],[&#x27;Ricavi di vendita&#x27;,&#x27;Merci c/vendite&#x27;,&#x27;A&#x27;,12000,E,&#x27;ricavo → netto ↑&#x27;,E,&#x27;ricavo&#x27;]],n:&#x27;Il ricavo nasce alla vendita, non all\&#x27;incasso (competenza). Nel sistema patrimoniale con inventario permanente si rileverebbe anche il costo del venduto: qui è omesso.&#x27;},
    t6:{r:[[&#x27;Salari e stipendi&#x27;,&#x27;Salari e stipendi&#x27;,&#x27;D&#x27;,4000,E,&#x27;costo → netto ↓&#x27;,E,&#x27;costo&#x27;],[&#x27;Banca c/c&#x27;,&#x27;Banca c/c&#x27;,&#x27;A&#x27;,4000,P,&#x27;attività ↓&#x27;,F,&#x27;denaro ↓&#x27;]],n:&#x27;Caso in cui i due sistemi coincidono nella sostanza: un costo contro un\&#x27;uscita di denaro.&#x27;}
  };
  function chip(c,t){return &#x27;&lt;span class=&quot;chip &#x27;+c[0]+&#x27;&quot;&gt;&#x27;+c[1]+&#x27;&lt;/span&gt; &#x27;+t;}
  choices(document.getElementById(&#x27;sysw&#x27;),function(k){
    var d=sys[k],h=&#x27;&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;cmp&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;D/A&lt;/th&gt;&lt;th&gt;Importo&lt;/th&gt;&lt;th&gt;Sistema patrimoniale&lt;/th&gt;&lt;th&gt;Sistema del reddito&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    d.r.forEach(function(r){
      h+=&#x27;&lt;tr&gt;&lt;th&gt;&#x27;+(r[2]===&#x27;D&#x27;?&#x27;Dare&#x27;:&#x27;Avere&#x27;)+&#x27;&lt;/th&gt;&lt;td&gt;&#x27;+r[3].toLocaleString(&#x27;it-IT&#x27;)+&#x27; €&lt;/td&gt;&lt;td&gt;&lt;strong&gt;&#x27;+r[0]+&#x27;&lt;/strong&gt;&lt;br&gt;&#x27;+chip(r[4],r[5])+&#x27;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;&#x27;+r[1]+&#x27;&lt;/strong&gt;&lt;br&gt;&#x27;+chip(r[6],r[7])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    });
    h+=&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;result&quot;&gt;&lt;p&gt;&#x27;+d.n+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
    document.getElementById(&#x27;sys-out&#x27;).innerHTML=h;
  });
})();
