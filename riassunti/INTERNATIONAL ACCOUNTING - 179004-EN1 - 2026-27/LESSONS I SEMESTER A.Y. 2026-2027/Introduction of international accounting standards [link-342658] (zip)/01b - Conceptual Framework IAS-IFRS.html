   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;Usa informazioni ricavate, almeno in parte, dal &lt;b&gt;prezzo dell&#x27;operazione&lt;/b&gt; che ha generato la voce. Non riflette le variazioni di valore, &lt;b&gt;salvo&lt;/b&gt; l&#x27;impairment (perdita di valore) di un asset o una passività diventata &lt;i&gt;onerous&lt;/i&gt; (onerosa) &lt;span class=&quot;ref&quot;&gt;6.4&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Asset&lt;/b&gt;: costi sostenuti per acquisirlo o crearlo = corrispettivo pagato &lt;b&gt;+&lt;/b&gt; costi di transazione.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Liability&lt;/b&gt;: corrispettivo ricevuto &lt;b&gt;−&lt;/b&gt; costi di transazione &lt;span class=&quot;ref&quot;&gt;6.5&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Se l&#x27;operazione non avviene a condizioni di mercato, il costo può non esistere o non essere rilevante. Allora si usa un current value come &lt;b&gt;deemed cost&lt;/b&gt; (costo presunto) alla prima iscrizione, che diventa il punto di partenza per il costo storico &lt;span class=&quot;ref&quot;&gt;6.6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def quote&quot; style=&quot;margin-top:4px&quot;&gt;Il &lt;b&gt;fair value&lt;/b&gt; è il prezzo che si riceverebbe per vendere un&#x27;attività, o che si pagherebbe per trasferire una passività, in una &lt;b&gt;orderly transaction&lt;/b&gt; (operazione ordinaria, non forzata) tra &lt;b&gt;market participants&lt;/b&gt; alla data di misurazione &lt;span class=&quot;ref&quot;&gt;6.12&lt;/span&gt;.&lt;/div&gt;&lt;p&gt;Riflette il punto di vista dei partecipanti a un mercato a cui l&#x27;entità ha accesso, che agiscono nel proprio interesse economico &lt;span class=&quot;ref&quot;&gt;6.13&lt;/span&gt;. Si osserva &lt;b&gt;direttamente&lt;/b&gt; in un mercato attivo, oppure si stima &lt;b&gt;indirettamente&lt;/b&gt; con tecniche di misurazione, come quelle basate sui flussi di cassa &lt;span class=&quot;ref&quot;&gt;6.14&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;Lo Standard che disciplina in dettaglio come si misura il fair value è l&#x27;&lt;b&gt;IFRS 13&lt;/b&gt;, con la gerarchia a tre livelli di input (&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Value in use&lt;/b&gt; (valore d&#x27;uso): valore attuale dei flussi di cassa o benefici che l&#x27;entità si aspetta dall&#x27;&lt;b&gt;uso&lt;/b&gt; dell&#x27;asset e dalla sua dismissione finale. &lt;b&gt;Fulfilment value&lt;/b&gt; (valore di adempimento): valore attuale della cassa o delle risorse che l&#x27;entità si aspetta di dover trasferire per &lt;b&gt;adempiere&lt;/b&gt; una passività, anche verso terzi diversi dalla controparte &lt;span class=&quot;ref&quot;&gt;6.17&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Non includono i costi di transazione dell&#x27;acquisto, ma &lt;b&gt;includono il valore attuale&lt;/b&gt; di quelli attesi per dismettere o adempiere &lt;span class=&quot;ref&quot;&gt;6.18&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;Usano &lt;b&gt;ipotesi entity-specific&lt;/b&gt;, cioè dell&#x27;entità, e non del mercato &lt;span class=&quot;ref&quot;&gt;6.19&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;Non si osservano: si calcolano con &lt;b&gt;cash-flow-based measurement techniques&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;6.20&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;Il value in use è usato dallo &lt;b&gt;IAS 36&lt;/b&gt; per l&#x27;impairment test: il &lt;i&gt;recoverable amount&lt;/i&gt; è il maggiore tra fair value less costs of disposal e value in use (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Asset&lt;/b&gt;: costo di un asset equivalente alla data di misurazione = corrispettivo che si pagherebbe &lt;b&gt;+&lt;/b&gt; costi di transazione di quella data. &lt;b&gt;Liability&lt;/b&gt;: corrispettivo che si riceverebbe per una passività equivalente &lt;b&gt;−&lt;/b&gt; costi di transazione &lt;span class=&quot;ref&quot;&gt;6.21&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Come il costo storico è un &lt;b&gt;entry value&lt;/b&gt; (prezzo del mercato in cui si &lt;i&gt;acquista&lt;/i&gt;), ma &lt;b&gt;riflette le condizioni attuali&lt;/b&gt;. Fair value, value in use e fulfilment value sono invece &lt;b&gt;exit values&lt;/b&gt;. Se esistono solo prezzi di beni nuovi, il current cost di un bene usato si stima &lt;b&gt;rettificando il prezzo del nuovo&lt;/b&gt; per età e condizioni &lt;span class=&quot;ref&quot;&gt;6.22&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-meas&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · numeri inventati&lt;/div&gt;
   &lt;h4&gt;Un macchinario, quattro misure&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;Comprato a 100 più 5 di costi di transazione, vita utile 5 anni, ammortamento a quote costanti (per il costo storico e il current cost del bene usato).&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mAge&quot;&gt;Anni trascorsi&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mAge&quot; min=&quot;0&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;mAgeO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mFv&quot;&gt;Prezzo di vendita oggi sul mercato dell&#x27;usato&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mFv&quot; min=&quot;20&quot; max=&quot;140&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;mFvO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mNew&quot;&gt;Prezzo oggi di un macchinario nuovo equivalente&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mNew&quot; min=&quot;70&quot; max=&quot;160&quot; value=&quot;120&quot;&gt;&lt;output id=&quot;mNewO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mCf&quot;&gt;Flusso di cassa annuo atteso dall&#x27;uso&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mCf&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;mCfO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mR&quot;&gt;Tasso di attualizzazione&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mR&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;8&quot;&gt;&lt;output id=&quot;mRO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 640 200&quot; id=&quot;measSvg&quot; aria-label=&quot;Confronto delle basi di misurazione&quot;&gt;&lt;/svg&gt;
   &lt;p class=&quot;fs&quot;&gt;Value in use = Σ CF / (1+r)&lt;sup&gt;t&lt;/sup&gt; sugli anni residui (senza costi di dismissione, per semplicità). Current cost = (nuovo + 5) × quota di vita residua. Come vedi, le basi danno cifre molto diverse per lo stesso bene: per questo la scelta della base conta (6.43 ss.).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cash-flow-based measurement techniques&lt;/h3&gt;
  &lt;p&gt;Quando una misura non si osserva, la si può stimare con tecniche basate sui flussi di cassa. &lt;b&gt;Non sono basi di misurazione&lt;/b&gt;: sono strumenti per &lt;i&gt;applicarne&lt;/i&gt; una. Bisogna quindi dire quale base si sta applicando e quanto la tecnica ne riflette i fattori &lt;span class=&quot;ref&quot;&gt;6.91&lt;/span&gt;. Per il fair value i fattori sono &lt;span class=&quot;ref&quot;&gt;6.14&lt;/span&gt;:&lt;/p&gt;
  &lt;ol class=&quot;steps&quot;&gt;
   &lt;li&gt;&lt;b&gt;stime dei flussi di cassa futuri&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;possibili variazioni di importo o tempistica&lt;/b&gt; dovute all&#x27;incertezza dei flussi;&lt;/li&gt;
   &lt;li&gt;il &lt;b&gt;valore temporale del denaro&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;il &lt;b&gt;prezzo per sopportare l&#x27;incertezza&lt;/b&gt; (premio o sconto per il rischio): chi compra paga meno per flussi incerti e chiede di più per assumersi passività incerte;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;altri fattori&lt;/b&gt;, per esempio la liquidità, se i partecipanti al mercato ne terrebbero conto.&lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;formula&quot;&gt;PV = Σ&lt;sub&gt;t=1…n&lt;/sub&gt; E[CF&lt;sub&gt;t&lt;/sub&gt;] / (1 + r)&lt;sup&gt;t&lt;/sup&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;La formula del valore attuale non è nelle slide: è la forma standard con cui i fattori a)–d) entrano nel calcolo. Il rischio può stare nel tasso r (premio) oppure nei flussi E[CF] (equivalente certo).&lt;/p&gt;
  &lt;p&gt;Si possono anche usare &lt;b&gt;basi modificate&lt;/b&gt;, per esempio un fulfilment value che esclude il rischio che l&#x27;entità non adempia (&lt;i&gt;own credit risk&lt;/i&gt;, il proprio rischio di credito). Possono essere più rilevanti o meno costose, ma anche &lt;b&gt;più difficili da capire&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;6.92&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Quali basi sono entry values e quali exit values?&lt;/summary&gt;&lt;div&gt;Entry: historical cost e current cost. Exit: fair value, value in use e fulfilment value [6.21].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra fair value e value in use?&lt;/summary&gt;&lt;div&gt;Il fair value usa le ipotesi dei market participants (è market-based); il value in use usa le ipotesi dell&#x27;entità (è entity-specific) e non è mai osservabile [6.13, 6.19–6.20].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Il costo storico non cambia mai dopo l&#x27;iscrizione?&lt;/summary&gt;&lt;div&gt;Non riflette le variazioni di valore, tranne l&#x27;impairment di un asset o una passività diventata onerosa [6.4]. Cambia anche con ammortamenti e consumo.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Un discounted cash flow è una base di misurazione?&lt;/summary&gt;&lt;div&gt;No: è una tecnica per applicare una base (fair value, value in use…). Va sempre indicata la base che si sta applicando [6.91].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section class=&quot;part mattone&quot; id=&quot;s7&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Presentation and disclosure&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 92–97 · Framework, capitolo 7&lt;/p&gt;
  &lt;p&gt;Con la &lt;span class=&quot;t&quot;&gt;presentation&lt;/span&gt; (esposizione nei prospetti) e la &lt;span class=&quot;t&quot;&gt;disclosure&lt;/span&gt; (informativa, soprattutto nelle note) l&#x27;entità &lt;b&gt;comunica&lt;/b&gt; le informazioni sui propri elementi &lt;span class=&quot;ref&quot;&gt;7.1&lt;/span&gt;. Comunicare bene rende l&#x27;informazione più rilevante, ne aiuta la rappresentazione fedele e ne migliora comprensibilità e comparabilità.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principi, non regole&lt;/h4&gt;Concentrarsi su &lt;b&gt;obiettivi e principi&lt;/b&gt; di presentation e disclosure, non su regole meccaniche &lt;span class=&quot;ref&quot;&gt;7.2&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Classificare&lt;/h4&gt;&lt;b&gt;Raggruppare voci simili&lt;/b&gt; e &lt;b&gt;separare voci diverse&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Aggregare&lt;/h4&gt;Senza oscurare l&#x27;informazione con &lt;b&gt;troppi dettagli&lt;/b&gt; né con &lt;b&gt;troppa aggregazione&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Negli Standard serve un &lt;b&gt;equilibrio&lt;/b&gt; tra la flessibilità lasciata all&#x27;entità per dare informazioni rilevanti e fedeli e l&#x27;obbligo di informazioni &lt;b&gt;comparabili&lt;/b&gt; nel tempo e tra entità &lt;span class=&quot;ref&quot;&gt;7.4&lt;/span&gt;. Gli obiettivi di disclosure aiutano l&#x27;entità a capire che cosa comunicare e come &lt;span class=&quot;ref&quot;&gt;7.5&lt;/span&gt;. Altri due principi &lt;span class=&quot;ref&quot;&gt;7.6&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No boilerplate&lt;/h4&gt;L&#x27;informazione &lt;b&gt;entity-specific&lt;/b&gt; vale più delle formule standard e generiche, il cosiddetto &lt;i&gt;boilerplate&lt;/i&gt;: testo “da modulo” copiato da un bilancio all&#x27;altro.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No duplicazioni&lt;/h4&gt;Ripetere la stessa informazione in punti diversi del bilancio di solito non serve e lo rende meno comprensibile.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Classification&lt;/h3&gt;
  &lt;p&gt;È l&#x27;ordinamento di attività, passività, equity, ricavi e costi secondo &lt;b&gt;caratteristiche comuni&lt;/b&gt;: la &lt;b&gt;natura&lt;/b&gt; della voce, il suo &lt;b&gt;ruolo o funzione&lt;/b&gt; nell&#x27;attività, il &lt;b&gt;modo in cui è misurata&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;7.7&lt;/span&gt;. Mettere insieme voci dissimili oscura l&#x27;informazione e può non dare una rappresentazione fedele &lt;span class=&quot;ref&quot;&gt;7.8&lt;/span&gt;.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Offsetting, equity e “profit or loss vs OCI”: che cosa sono? (slide 12, solo indice)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le slide elencano questi sotto-paragrafi senza svilupparli. In breve:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Offsetting&lt;/b&gt; (compensazione): presentare attività e passività al netto, come un&#x27;unica cifra. Di norma è sconsigliato, perché unisce voci dissimili &lt;span class=&quot;ref&quot;&gt;7.10&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Classification of equity&lt;/b&gt;: può servire separare componenti dell&#x27;equity con caratteristiche diverse &lt;span class=&quot;ref&quot;&gt;7.12&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Profit or loss e other comprehensive income (OCI)&lt;/b&gt;: il conto economico (profit or loss) è la fonte principale sulla performance. Alcune variazioni, per esempio certe rivalutazioni, possono andare nell&#x27;&lt;i&gt;altro risultato complessivo&lt;/i&gt; (OCI) e in linea di principio tornare poi a conto economico (&lt;i&gt;recycling&lt;/i&gt;) &lt;span class=&quot;ref&quot;&gt;7.15–7.19&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;h3&gt;Aggregation&lt;/h3&gt;
  &lt;p&gt;L&#x27;&lt;span class=&quot;t&quot;&gt;aggregation&lt;/span&gt; somma voci con caratteristiche comuni e nella stessa classe &lt;span class=&quot;ref&quot;&gt;7.20&lt;/span&gt;. Riassume tanti dettagli, ma ne nasconde alcuni: serve un equilibrio &lt;span class=&quot;ref&quot;&gt;7.21&lt;/span&gt;. Livelli diversi convivono: i prospetti sono sintetici, le note più analitiche &lt;span class=&quot;ref&quot;&gt;7.22&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-agg&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · numeri inventati&lt;/div&gt;
   &lt;h4&gt;Quanto aggregare le attività?&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;agg&quot;&gt;Livello di dettaglio&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;agg&quot; min=&quot;1&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;aggO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div id=&quot;aggOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;Dal 1° gennaio 2027 l&#x27;&lt;b&gt;IFRS 18 Presentation and Disclosure in Financial Statements&lt;/b&gt; sostituisce lo IAS 1. Introduce subtotali definiti nel conto economico, regole su aggregazione e disaggregazione e informativa sulle &lt;i&gt;management-defined performance measures&lt;/i&gt; (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;). Applica i principi del capitolo 7.&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Su quali caratteristiche si basa la classificazione?&lt;/summary&gt;&lt;div&gt;Natura della voce, ruolo o funzione nell&#x27;attività, modo in cui è misurata, ma non solo queste [7.7].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cos&#x27;è il boilerplate e perché è sconsigliato?&lt;/summary&gt;&lt;div&gt;Testo standard e generico, uguale per tutte le imprese. È meno utile dell&#x27;informazione entity-specific [7.6].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché sia troppo dettaglio sia troppa aggregazione sono un problema?&lt;/summary&gt;&lt;div&gt;Perché in entrambi i casi l&#x27;informazione rilevante viene oscurata: sommersa dai dettagli inutili o nascosta nei totali [7.21].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S8 --&gt;
&lt;section class=&quot;part mattone&quot; id=&quot;s8&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Concepts of capital and capital maintenance&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 98–103 · Framework, capitolo 8&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Financial concept of capital&lt;/h4&gt;Il capitale è denaro investito o potere d&#x27;acquisto investito: coincide con le &lt;b&gt;net assets o equity&lt;/b&gt;. È il concetto adottato dalla maggior parte delle entità &lt;span class=&quot;ref&quot;&gt;8.1&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Physical concept of capital&lt;/h4&gt;Il capitale è la &lt;b&gt;capacità produttiva&lt;/b&gt; (&lt;i&gt;operating capability&lt;/i&gt;), misurata per esempio in &lt;b&gt;unità prodotte al giorno&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La scelta dipende dai &lt;b&gt;bisogni degli utenti&lt;/b&gt;: se a loro interessa conservare il capitale nominale o il suo potere d&#x27;acquisto, si usa il concetto finanziario; se interessa la capacità operativa, quello fisico &lt;span class=&quot;ref&quot;&gt;8.2&lt;/span&gt;.&lt;/p&gt;
  &lt;h3&gt;Capital maintenance: quando c&#x27;è un utile?&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;capital maintenance&lt;/span&gt; (mantenimento del capitale) definisce quale capitale l&#x27;entità cerca di conservare. È il &lt;b&gt;punto di riferimento&lt;/b&gt; per misurare l&#x27;utile e permette di distinguere il &lt;i&gt;return &lt;b&gt;on&lt;/b&gt; capital&lt;/i&gt; (remunerazione del capitale) dal &lt;i&gt;return &lt;b&gt;of&lt;/b&gt; capital&lt;/i&gt; (restituzione del capitale). È utile solo ciò che eccede l&#x27;importo necessario a mantenere il capitale &lt;span class=&quot;ref&quot;&gt;8.4&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Profit = Income − Expenses (comprese le capital maintenance adjustments) &amp;nbsp;·&amp;nbsp; se negativo: loss&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial – nominal&lt;/th&gt;&lt;th&gt;Financial – constant purchasing power&lt;/th&gt;&lt;th&gt;Physical&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Capitale da mantenere&lt;/b&gt;&lt;/td&gt;&lt;td&gt;net assets in moneta nominale&lt;/td&gt;&lt;td&gt;net assets in potere d&#x27;acquisto&lt;/td&gt;&lt;td&gt;capacità produttiva&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Base di misura&lt;/b&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;nessuna base obbligatoria: dipende dal capitale scelto &lt;span class=&quot;ref&quot;&gt;8.5&lt;/span&gt;&lt;/td&gt;&lt;td&gt;richiede il &lt;b&gt;current cost&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;8.5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Aumenti di prezzo dei beni (holding gains)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;sono &lt;b&gt;utile&lt;/b&gt;, anche se magari rilevato solo alla vendita&lt;/td&gt;&lt;td&gt;è utile solo la parte che &lt;b&gt;eccede l&#x27;inflazione generale&lt;/b&gt;; il resto è rettifica di equity &lt;span class=&quot;ref&quot;&gt;8.7&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;non sono utile&lt;/b&gt;: sono capital maintenance adjustments nell&#x27;equity &lt;span class=&quot;ref&quot;&gt;8.8&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Differenza principale&lt;/b&gt;: come si trattano gli effetti delle &lt;b&gt;variazioni di prezzo&lt;/b&gt; di attività e passività. In generale il capitale è mantenuto se a fine periodo è pari a quello di inizio periodo; l&#x27;eccedenza è utile &lt;span class=&quot;ref&quot;&gt;8.6&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-cap&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · esempio costruito&lt;/div&gt;
   &lt;h4&gt;Stesso anno, tre utili diversi&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;I soci conferiscono 1.000 in denaro. Con quella cifra l&#x27;entità compra merce e a fine anno la vende. Nessun altro costo.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cS&quot;&gt;Prezzo di vendita della merce&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cS&quot; min=&quot;800&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1500&quot;&gt;&lt;output id=&quot;cSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cI&quot;&gt;Inflazione generale dell&#x27;anno&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cI&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cIO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cR&quot;&gt;Costo di riacquisto della stessa merce a fine anno&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cR&quot; min=&quot;800&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1300&quot;&gt;&lt;output id=&quot;cRO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 660 230&quot; id=&quot;capSvg&quot; aria-label=&quot;Utile secondo i tre concetti&quot;&gt;&lt;/svg&gt;
   &lt;div id=&quot;capTxt&quot; class=&quot;fs&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Le &lt;span class=&quot;t&quot;&gt;capital maintenance adjustments&lt;/span&gt; nascono dalla rivalutazione o riespressione di attività e passività. Sono aumenti o diminuzioni di equity che rientrano nella definizione di income ed expenses, ma che con certi concetti di mantenimento non passano dal conto economico: restano nell&#x27;equity come rettifiche o &lt;b&gt;riserve di rivalutazione&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;8.10&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;band&quot;&gt;Il Framework vale per diversi modelli contabili. &lt;b&gt;Al momento il Board non intende imporne uno&lt;/b&gt;, salvo casi eccezionali come le entità che presentano il bilancio nella valuta di un&#x27;&lt;b&gt;economia iperinflazionata&lt;/b&gt;. L&#x27;intenzione sarà rivista in base all&#x27;evoluzione mondiale &lt;span class=&quot;ref&quot;&gt;8.9&lt;/span&gt;.&lt;/div&gt;
  &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;Il caso eccezionale è disciplinato dallo &lt;b&gt;IAS 29 Financial Reporting in Hyperinflationary Economies&lt;/b&gt;, che chiede di riesprimere il bilancio. Tra gli indicatori di iperinflazione c&#x27;è un&#x27;inflazione cumulata su tre anni vicina o superiore al 100% (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;).&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Quale concetto di capitale usano quasi tutte le entità?&lt;/summary&gt;&lt;div&gt;Il concetto finanziario: capitale = net assets o equity [8.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Con il physical capital maintenance, l&#x27;aumento del costo di riacquisto delle scorte è utile?&lt;/summary&gt;&lt;div&gt;No. È una capital maintenance adjustment che va nell&#x27;equity, perché serve a mantenere la capacità produttiva [8.8].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quale base di misura richiede il concetto fisico?&lt;/summary&gt;&lt;div&gt;Il current cost [8.5]. È un collegamento diretto con il capitolo 6.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Cosa distingue il return on capital dal return of capital?&lt;/summary&gt;&lt;div&gt;Il primo è l&#x27;utile, cioè ciò che eccede il capitale da mantenere; il secondo è la restituzione del capitale stesso. Il concetto di mantenimento fissa il confine tra i due [8.4].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Documenti, standard e norme citati nelle slide o direttamente richiamati dai loro esempi. &lt;b&gt;Tutto ciò che segue è &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/b&gt;, trovato con ricerca web; non viene dalle slide. Verifica sempre la versione in vigore sul sito ufficiale.&lt;/p&gt;
  &lt;ul class=&quot;src&quot;&gt;
   &lt;li&gt;&lt;h4&gt;Conceptual Framework for Financial Reporting (IASB, marzo 2018)&lt;/h4&gt;&lt;p&gt;È il testo integrale e ufficiale, citato in ogni slide con i numeri di paragrafo. Si applica subito allo IASB e all&#x27;IFRS Interpretations Committee e, per chi lo usa in assenza di uno Standard specifico, dagli esercizi che iniziano dal 1° gennaio 2020. Serve per leggere i paragrafi che le slide riassumono o citano solo nell&#x27;indice (5.6–5.25, 6.43–6.90, 7.10–7.19).&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Conceptual Framework&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Conceptual Framework – Project Summary (IFRS Foundation, 2018)&lt;/h4&gt;&lt;p&gt;Sintesi ufficiale delle novità del 2018: definizioni di asset e liability, ritorno di prudence e stewardship, measurement uncertainty, derecognition. Utile per capire perché il Framework è cambiato.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/-/media/project/conceptual-framework/fact-sheet-project-summary-and-feedback-statement/conceptual-framework-project-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Project summary (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2018/october/wss/wss4-conceptual-framework-overview.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;slide di overview 2018 (PDF)&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Basis for Conclusions del Conceptual Framework (BC2.32–BC2.33)&lt;/h4&gt;&lt;p&gt;Le slide 26–27 citano i paragrafi BC sulla substance over form. La &lt;i&gt;Basis for Conclusions&lt;/i&gt; spiega il ragionamento del Board dietro ogni scelta. Il link porta alla copia pubblicata dall&#x27;AASB, lo standard setter australiano.&lt;/p&gt;&lt;a href=&quot;https://www.aasb.gov.au/admin/file/content105/c9/CF_BC_1-22.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;aasb.gov.au · CF Basis for Conclusions (PDF)&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Storia: Framework 1989 → 2010 → 2018&lt;/h4&gt;&lt;p&gt;Il testo del 1989 fu emanato dallo IASC. Il progetto congiunto IASB–FASB portò nel 2010 a riscrivere solo i capitoli sull&#x27;obiettivo e sulle caratteristiche qualitative; il resto rimase invariato fino alla revisione del 2018.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2018/03/cf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · notizia marzo 2018&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 8 – Accounting Policies, Changes in Accounting Estimates and Errors&lt;/h4&gt;&lt;p&gt;Richiamato nella slide 39 sulla comparabilità. Disciplina la scelta e il cambio dei criteri contabili (di regola con effetto retroattivo), i cambi di stima (prospettici) e la correzione degli errori. Con l&#x27;arrivo dell&#x27;IFRS 18 alcune parti dello IAS 1 sono confluite nello IAS 8, e lo IASB ha deciso di rinominarlo: controlla il titolo attuale.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 8&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Codice civile, art. 2423-bis – Principi di redazione del bilancio&lt;/h4&gt;&lt;p&gt;È la norma del “classical Italian approach” della slide 47: la valutazione va fatta secondo prudenza e nella prospettiva della continuazione dell&#x27;attività. Dal 2016 (D.Lgs. 139/2015) prevede anche la prevalenza della sostanza sulla forma. È interpretata dal principio contabile nazionale OIC 11.&lt;/p&gt;&lt;a href=&quot;https://www.filodiritto.com/codici/codice-civile/capo-v-societa-azioni/art-2423-bis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;filodiritto.com · art. 2423-bis c.c.&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 16 – Leases&lt;/h4&gt;&lt;p&gt;Collegato all&#x27;esempio del leasing di slide 29. Dal 2019 il locatario iscrive per quasi tutti i leasing un right-of-use asset e una lease liability: è la substance over form applicata.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · IFRS 16&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 13 – Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Sviluppa la definizione di fair value del par. 6.12: exit price, prospettiva dei market participants, gerarchia degli input su tre livelli.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · IFRS 13&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 36 – Impairment of Assets&lt;/h4&gt;&lt;p&gt;Lo Standard in cui si usa il value in use (6.17) e l&#x27;impairment che è l&#x27;eccezione del costo storico (6.4). Il recoverable amount è il maggiore tra fair value less costs of disposal e value in use.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 36&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 18 – Presentation and Disclosure in Financial Statements&lt;/h4&gt;&lt;p&gt;Sostituisce lo IAS 1 dagli esercizi che iniziano dal 1° gennaio 2027. Mette in pratica i principi del capitolo 7 (classificazione, aggregazione, subtotali del conto economico). Lo status dell&#x27;endorsement UE va verificato.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 29 – Financial Reporting in Hyperinflationary Economies&lt;/h4&gt;&lt;p&gt;È il caso eccezionale del par. 8.9 in cui il Board impone un modello: le entità con valuta funzionale iperinflazionata riesprimono il bilancio.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 29&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;fs&quot;&gt;Altri materiali del corso: non è stato possibile elencare il contenuto della cartella &lt;i&gt;corso/&lt;/i&gt;, quindi questo riassunto si basa solo sul file &lt;i&gt;01b - Conceptual Framework IAS-IFRS.pdf&lt;/i&gt;. Il nome “01b” suggerisce una lezione 01a precedente da leggere insieme a questa.&lt;/p&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
