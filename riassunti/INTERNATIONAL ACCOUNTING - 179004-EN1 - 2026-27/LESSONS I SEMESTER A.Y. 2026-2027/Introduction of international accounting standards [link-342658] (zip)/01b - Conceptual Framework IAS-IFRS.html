  &lt;h1&gt;Il &lt;em&gt;Conceptual Framework&lt;/em&gt; dello IASB&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;Il quadro concettuale, cioè l&#x27;insieme di concetti su cui poggiano tutti gli IAS/IFRS: a chi serve il bilancio, cosa rende utile un&#x27;informazione, cos&#x27;è un&#x27;attività o una passività, quando e come si iscrive e si misura una voce, che cosa significa “mantenere il capitale”.&lt;/p&gt;

  &lt;p&gt;Gli otto capitoli del Framework non sono un elenco: ognuno si appoggia ai precedenti. L&#x27;&lt;b&gt;obiettivo&lt;/b&gt; (cap. 1) dice a chi serve l&#x27;informazione; le &lt;b&gt;caratteristiche qualitative&lt;/b&gt; (cap. 2) dicono quando è utile; le &lt;b&gt;definizioni degli elementi&lt;/b&gt; (cap. 4) dicono che cosa può finire in bilancio; &lt;b&gt;recognition&lt;/b&gt; (iscrizione), &lt;b&gt;measurement&lt;/b&gt; (misurazione) e &lt;b&gt;presentation&lt;/b&gt; (esposizione) dicono se, per quanto e come. Clicca su un riquadro per andare alla sezione.&lt;/p&gt;

   &lt;g class=&quot;node mattone&quot; data-go=&quot;s7&quot; tabindex=&quot;0&quot; role=&quot;link&quot; aria-label=&quot;Capitolo 7&quot;&gt;&lt;rect x=&quot;650&quot; y=&quot;414&quot; width=&quot;250&quot; height=&quot;54&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;ch&quot; x=&quot;775&quot; y=&quot;436&quot;&gt;CAP. 7&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;455&quot;&gt;Presentation &amp;amp; disclosure&lt;/text&gt;&lt;/g&gt;
   &lt;g class=&quot;node mattone&quot; data-go=&quot;s8&quot; tabindex=&quot;0&quot; role=&quot;link&quot; aria-label=&quot;Capitolo 8&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;496&quot; width=&quot;300&quot; height=&quot;54&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;ch&quot; x=&quot;480&quot; y=&quot;518&quot;&gt;CAP. 8&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;537&quot;&gt;Capital &amp;amp; capital maintenance&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Linea tratteggiata: i due requisiti fondamentali del cap. 2 tornano come criteri di iscrizione nel cap. 5. Colori: ardesia = cornice e processi, salvia = qualità dell&#x27;informazione, ocra = contenuto del bilancio, mattone = comunicazione e capitale.&lt;/figcaption&gt;
  &lt;/figure&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S0 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s0&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;0&lt;/span&gt;&lt;h2&gt;La cornice: status, storia e scopo&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 2–14 · I rimandi tra parentesi quadre ([SP1.1], [2.12]…) sono i paragrafi del Framework; “SP” è la sezione introduttiva &lt;i&gt;Status and Purpose&lt;/i&gt;.&lt;/p&gt;

  &lt;h3&gt;A che cosa serve&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;Conceptual Framework for Financial Reporting&lt;/span&gt; (quadro concettuale per l&#x27;informativa finanziaria) è il documento che fissa i concetti di base dell&#x27;informativa di bilancio secondo IAS/IFRS. Ha tre destinatari &lt;span class=&quot;ref&quot;&gt;SP1.1&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Lo IASB (il Board)&lt;/h4&gt;Per scrivere &lt;b&gt;IFRS Standards&lt;/b&gt; coerenti tra loro, fondati sugli stessi concetti.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;I &lt;i&gt;preparers&lt;/i&gt;&lt;/h4&gt;Chi redige il bilancio, per definire &lt;b&gt;accounting policies&lt;/b&gt; (criteri contabili) coerenti quando nessuno Standard copre l&#x27;operazione, o quando uno Standard lascia una scelta.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Tutti gli altri&lt;/h4&gt;Revisori, analisti, autorità: per &lt;b&gt;capire e interpretare&lt;/b&gt; gli Standard.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Attenzione.&lt;/b&gt; Il Conceptual Framework &lt;b&gt;non è uno Standard&lt;/b&gt;. Nulla di quanto contiene prevale su uno Standard o su una sua singola disposizione &lt;span class=&quot;ref&quot;&gt;SP1.2&lt;/span&gt;. Se il Framework e un IFRS dicono cose diverse, vince l&#x27;IFRS.&lt;/div&gt;

  &lt;h3&gt;Tre versioni in trent&#x27;anni&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo 1989, 2010, 2018&quot;&gt;
   &lt;line x1=&quot;40&quot; y1=&quot;80&quot; x2=&quot;860&quot; y2=&quot;80&quot; stroke=&quot;currentColor&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
   &lt;g&gt;&lt;circle cx=&quot;110&quot; cy=&quot;80&quot; r=&quot;11&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;1989&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;“Framework”&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;emanato dallo IASC&lt;/text&gt;&lt;/g&gt;
   &lt;g&gt;&lt;circle cx=&quot;450&quot; cy=&quot;80&quot; r=&quot;11&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;2010&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;aggiornamento parziale&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;nuovi capp. 1 e 3; via “substance over form” e “prudence”&lt;/text&gt;&lt;/g&gt;
   &lt;g&gt;&lt;circle cx=&quot;790&quot; cy=&quot;80&quot; r=&quot;13&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;2018&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Conceptual Framework&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;approvato a marzo, 8 capitoli&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dalle slide 3 e 26–27. Che il testo del 1989 sia stato emanato dallo IASC, l&#x27;organismo che ha preceduto lo IASB, e che nel 2010 siano stati riscritti solo i capitoli 1 e 3 viene da &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2018/03/cf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Il Framework del 2018 è pensato per funzionare con &lt;b&gt;sistemi contabili diversi&lt;/b&gt; e con &lt;b&gt;concetti diversi di capitale e di mantenimento del capitale&lt;/b&gt; (slide 3). È un punto che tornerà nel capitolo 8.&lt;/p&gt;

  &lt;h3&gt;La struttura del 2018&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1–2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3–4&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;5–6&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;7–8&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;b&gt;Cap. 1 – The Objective of General Purpose Financial Reporting&lt;/b&gt;: obiettivo, utilità e limiti; risorse economiche e &lt;i&gt;claims&lt;/i&gt; (pretese verso l&#x27;entità); performance per competenza (&lt;i&gt;accrual accounting&lt;/i&gt;) e per flussi di cassa.&lt;br&gt;&lt;b&gt;Cap. 2 – Qualitative characteristics&lt;/b&gt;: &lt;i&gt;fundamental&lt;/i&gt; (relevance, materiality, faithful representation), &lt;i&gt;enhancing&lt;/i&gt; (comparability, verifiability, timeliness, understandability), &lt;i&gt;cost constraint&lt;/i&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Cap. 3 – Financial statements and the reporting entity&lt;/b&gt;: obiettivo e ambito del bilancio, periodo, prospettiva, &lt;i&gt;going concern&lt;/i&gt;, entità che redige il bilancio, consolidato e non consolidato.&lt;br&gt;&lt;b&gt;Cap. 4 – The elements&lt;/b&gt;: asset (right, potential, control), liability (obligation, transfer, present obligation), unit of account, executory contracts, substance of contractual rights, equity, income ed expenses.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Cap. 5 – Recognition and derecognition&lt;/b&gt;: processo, criteri (relevance: existence uncertainty, bassa probabilità; faithful representation: measurement uncertainty, altri fattori), derecognition.&lt;br&gt;&lt;b&gt;Cap. 6 – Measurement&lt;/b&gt;: historical cost, current value (fair value, value in use / fulfilment value, current cost), informazioni fornite da ciascuna base, fattori di scelta, misurazione dell&#x27;equity, tecniche basate sui flussi di cassa.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Cap. 7 – Presentation and disclosure&lt;/b&gt;: strumenti di comunicazione, obiettivi e principi, classificazione (offsetting, equity, profit or loss vs OCI), aggregazione.&lt;br&gt;&lt;b&gt;Cap. 8 – Concepts of capital and capital maintenance&lt;/b&gt;: concetti di capitale, mantenimento del capitale e determinazione del risultato, rettifiche di mantenimento.&lt;br&gt;&lt;b&gt;Appendix – Defined terms&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Perché conta: lo scopo dichiarato &lt;span class=&quot;ref&quot;&gt;SP1.5&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Transparency&lt;/h4&gt;Più comparabilità internazionale e più qualità dell&#x27;informazione: chi investe decide sapendo quello che fa.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Accountability&lt;/h4&gt;Riduce l&#x27;&lt;b&gt;information gap&lt;/b&gt;, il divario informativo, tra chi fornisce capitale e chi lo gestisce, cioè il management. Serve anche alle autorità di vigilanza.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Economic efficiency&lt;/h4&gt;Aiuta a individuare opportunità e rischi nel mondo e quindi ad allocare meglio il capitale. Una lingua contabile unica riduce il costo del capitale e i costi di reporting.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il filo che lega i tre punti è la &lt;span class=&quot;t&quot;&gt;stewardship&lt;/span&gt;: il modo in cui il management amministra le risorse che gli sono state affidate. Gli utenti del bilancio hanno bisogno di informazioni per verificarla (slide 14).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Uno Standard e il Conceptual Framework sono in conflitto. Quale si applica?&lt;/summary&gt;&lt;div&gt;Lo Standard. Il Framework non è uno Standard e non prevale su nessuna sua disposizione [SP1.2]. Serve soprattutto allo IASB quando scrive nuove regole, e a chi redige il bilancio quando nessuno Standard copre il caso.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In quali due situazioni un &lt;i&gt;preparer&lt;/i&gt; usa direttamente il Framework?&lt;/summary&gt;&lt;div&gt;Quando nessuno Standard si applica a una certa operazione o evento, e quando uno Standard consente di scegliere tra più accounting policies [SP1.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cos&#x27;è la &lt;i&gt;stewardship&lt;/i&gt; e perché compare già nello scopo del Framework?&lt;/summary&gt;&lt;div&gt;È la gestione delle risorse dell&#x27;entità da parte del management. Dato che i fornitori di capitale affidano il proprio denaro ad altri, il bilancio deve permettere di valutare come è stato gestito (accountability).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S1 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s1&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;L&#x27;obiettivo del general purpose financial reporting&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 15–17 · Framework, capitolo 1&lt;/p&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;general purpose financial reporting&lt;/span&gt; è l&#x27;informativa finanziaria “a scopo generale”: non viene preparata su misura per un singolo destinatario ma per una platea ampia di utenti, che di solito non può pretendere dall&#x27;impresa report personalizzati.&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;L&#x27;obiettivo è &lt;b&gt;fornire informazioni finanziarie sulla reporting entity utili agli investitori esistenti e potenziali, ai finanziatori e agli altri creditori&lt;/b&gt; per prendere decisioni sul fornire risorse all&#x27;entità &lt;span class=&quot;ref&quot;&gt;1.2&lt;/span&gt;.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;Dall&#x27;informazione alle decisioni dei primary users&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;110&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
   &lt;text x=&quot;115&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Financial report&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;della reporting entity&lt;/text&gt;
   &lt;path d=&quot;M210 150 H300&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;300&quot; y=&quot;60&quot; width=&quot;260&quot; height=&quot;180&quot; rx=&quot;12&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
   &lt;text x=&quot;430&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Gli utenti valutano [1.3]&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;120&quot; font-size=&quot;13&quot;&gt;• &lt;tspan font-weight=&quot;600&quot;&gt;amount&lt;/tspan&gt; (importo)&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;144&quot; font-size=&quot;13&quot;&gt;• &lt;tspan font-weight=&quot;600&quot;&gt;timing&lt;/tspan&gt; (tempistica)&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;168&quot; font-size=&quot;13&quot;&gt;• &lt;tspan font-weight=&quot;600&quot;&gt;uncertainty&lt;/tspan&gt; (incertezza)&lt;/text&gt;
   &lt;text x=&quot;336&quot; y=&quot;190&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;dei futuri net cash inflows&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;220&quot; font-size=&quot;13&quot;&gt;• la &lt;tspan font-weight=&quot;600&quot;&gt;stewardship&lt;/tspan&gt; del management&lt;/text&gt;
   &lt;path d=&quot;M560 150 H640&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;640&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;a) comprare / vendere / tenere&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;equity e debt instruments&lt;/text&gt;
   &lt;rect x=&quot;640&quot; y=&quot;115&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;b) concedere o estinguere&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;prestiti e altre forme di credito&lt;/text&gt;
   &lt;rect x=&quot;640&quot; y=&quot;210&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;c) votare o influenzare&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;le azioni del management&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;I &lt;i&gt;primary users&lt;/i&gt; e le tre famiglie di decisioni [1.2–1.3].&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;p&gt;Chi investe o presta denaro si aspetta un ritorno: dividendi, interessi, rimborso del capitale, aumento di valore dei titoli. Quel ritorno dipende dalla capacità dell&#x27;impresa di &lt;b&gt;generare cassa in futuro&lt;/b&gt; e da come il management usa le risorse. Il bilancio non fa previsioni al posto dell&#x27;utente: gli dà il materiale per farle.&lt;/p&gt;

  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Working theory del Framework&lt;/h4&gt;Prevalgono i &lt;b&gt;bisogni informativi degli investitori&lt;/b&gt; (slide 17). Il Framework non prova a soddisfare tutti: sceglie un utente di riferimento.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conseguenza&lt;/h4&gt;Il modello è centrato sui &lt;b&gt;flussi di cassa attesi&lt;/b&gt; e sulla &lt;b&gt;posizione finanziaria&lt;/b&gt; dell&#x27;entità. Da qui l&#x27;attenzione per il fair value, per la sostanza economica e per il controllo delle risorse, che ritroveremo nei capitoli 2, 4 e 6.&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa intendono le slide con “accrual accounting” e “past cash flows” (1.17–1.20)?&lt;/summary&gt;&lt;div&gt;Sono due lenti sulla performance. La competenza economica (&lt;i&gt;accrual accounting&lt;/i&gt;) registra gli effetti delle operazioni nel periodo in cui avvengono, anche se incasso o pagamento arrivano in un altro periodo: per il Framework è la base migliore per valutare la performance. I flussi di cassa passati la completano, perché mostrano come l&#x27;entità ottiene e spende la cassa (prospetto dei flussi finanziari). Le slide citano questi paragrafi solo nell&#x27;indice: la spiegazione qui è un&#x27;integrazione.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Chi sono i &lt;i&gt;primary users&lt;/i&gt; del general purpose financial reporting?&lt;/summary&gt;&lt;div&gt;Gli investitori esistenti e potenziali, i finanziatori (lenders) e gli altri creditori: chi fornisce o potrebbe fornire risorse all&#x27;entità [1.2].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali tre caratteristiche dei flussi di cassa futuri vogliono stimare gli utenti?&lt;/summary&gt;&lt;div&gt;Amount, timing e uncertainty, cioè importo, tempistica e incertezza dei futuri net cash inflows [1.3]. In più vogliono valutare la stewardship del management.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché la prevalenza degli investitori orienta tutto il modello verso i flussi di cassa?&lt;/summary&gt;&lt;div&gt;Perché il rendimento dell&#x27;investitore dipende dalla cassa che l&#x27;entità genererà. Così l&#x27;informazione è giudicata in base a quanto aiuta a prevedere quei flussi e a valutare la posizione finanziaria (slide 17).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section class=&quot;part salvia&quot; id=&quot;s2&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Qualitative characteristics of useful financial information&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 18–50 · Framework, capitolo 2&lt;/p&gt;
  &lt;p&gt;Le &lt;span class=&quot;t&quot;&gt;qualitative characteristics&lt;/span&gt; (caratteristiche qualitative) sono le proprietà che rendono un&#x27;informazione finanziaria &lt;b&gt;utile&lt;/b&gt;. Valgono per l&#x27;informazione in bilancio e per quella fornita in altri modi; il &lt;b&gt;costo&lt;/b&gt; è il vincolo che le attraversa tutte &lt;span class=&quot;ref&quot;&gt;2.3&lt;/span&gt;.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 330&quot; role=&quot;img&quot; aria-label=&quot;Gerarchia delle caratteristiche qualitative&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;860&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--acc);opacity:.14&quot;/&gt;
   &lt;text x=&quot;450&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;COST CONSTRAINT: i benefici devono giustificare i costi [2.39]&lt;/text&gt;
   &lt;text x=&quot;450&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot; letter-spacing=&quot;2&quot;&gt;FUNDAMENTAL (necessarie)&lt;/text&gt;
   &lt;rect x=&quot;110&quot; y=&quot;92&quot; width=&quot;320&quot; height=&quot;104&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-width=&quot;1.6&quot;/&gt;
   &lt;text x=&quot;270&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Relevance&lt;/text&gt;
   &lt;text x=&quot;270&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;predictive value · confirmatory value&lt;/text&gt;
   &lt;text x=&quot;270&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;materiality: aspetto entity-specific&lt;/text&gt;
   &lt;rect x=&quot;470&quot; y=&quot;92&quot; width=&quot;320&quot; height=&quot;104&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-width=&quot;1.6&quot;/&gt;
   &lt;text x=&quot;630&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Faithful representation&lt;/text&gt;
   &lt;text x=&quot;630&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;complete · neutral · free from error&lt;/text&gt;
   &lt;text x=&quot;630&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;substance over form&lt;/text&gt;
   &lt;text x=&quot;450&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot; letter-spacing=&quot;2&quot;&gt;ENHANCING (migliorano, non salvano)&lt;/text&gt;
   &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;60&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;274&quot;&gt;Comparability&lt;/text&gt;
    &lt;rect x=&quot;260&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;274&quot;&gt;Verifiability&lt;/text&gt;
    &lt;rect x=&quot;460&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;274&quot;&gt;Timeliness&lt;/text&gt;
    &lt;rect x=&quot;660&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;274&quot;&gt;Understandability&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;450&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;Le enhancing non rendono utile un&#x27;informazione irrilevante o non fedele (slide 18)&lt;/text&gt;

  &lt;figcaption&gt;Ricostruzione dello schema di slide 18.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Relevance&lt;/h3&gt;
  &lt;p&gt;Un&#x27;informazione è &lt;span class=&quot;t&quot;&gt;relevant&lt;/span&gt; (rilevante, pertinente) se &lt;b&gt;può fare la differenza&lt;/b&gt; nelle decisioni degli utenti. Lo è anche se qualcuno sceglie di non usarla o la conosce già da altre fonti &lt;span class=&quot;ref&quot;&gt;2.6&lt;/span&gt;. Può fare la differenza se ha &lt;span class=&quot;ref&quot;&gt;2.7&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Predictive value&lt;/h4&gt;Può essere usata come &lt;i&gt;input&lt;/i&gt; nei processi con cui gli utenti prevedono risultati futuri. Non deve essere essa stessa una previsione &lt;span class=&quot;ref&quot;&gt;2.8&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Confirmatory value&lt;/h4&gt;Dà un &lt;i&gt;feedback&lt;/i&gt;: conferma o corregge valutazioni fatte in passato &lt;span class=&quot;ref&quot;&gt;2.9&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Entrambi&lt;/h4&gt;Spesso vanno insieme. I ricavi dell&#x27;anno servono a prevedere quelli futuri e, confrontati con le previsioni fatte in passato, a migliorare il metodo di previsione &lt;span class=&quot;ref&quot;&gt;2.10&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Materiality&lt;/h4&gt;
  &lt;div class=&quot;def quote&quot;&gt;Un&#x27;informazione è &lt;b&gt;material&lt;/b&gt; se ometterla o esporla in modo errato potrebbe influenzare le decisioni dei primary users. La materiality è un &lt;b&gt;aspetto entity-specific della relevance&lt;/b&gt;, basato sulla &lt;b&gt;natura&lt;/b&gt;, sulla &lt;b&gt;dimensione&lt;/b&gt; o su entrambe, nel contesto del bilancio di quella singola entità. Per questo il Board &lt;b&gt;non può fissare una soglia quantitativa uniforme&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;2.11&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-mat&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · modello illustrativo&lt;/div&gt;
   &lt;h4&gt;Natura o dimensione?&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mag&quot;&gt;Peso della voce rispetto a una grandezza di riferimento dell&#x27;entità&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mag&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;magO&quot;&gt;1%&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;nat&quot; aria-pressed=&quot;false&quot;&gt;La voce ha una natura delicata (es. operazione con parti correlate, violazione di legge)&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;matV&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;fs&quot;&gt;Le fasce del cursore sono inventate per l&#x27;esercizio: lo IASB non fissa soglie [2.11]. Serve solo a vedere che &lt;b&gt;la natura può rendere material anche un importo piccolo&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Faithful representation&lt;/h3&gt;
  &lt;p&gt;La &lt;span class=&quot;t&quot;&gt;faithful representation&lt;/span&gt; (rappresentazione fedele) chiede che l&#x27;informazione rappresenti &lt;b&gt;la sostanza del fenomeno&lt;/b&gt; che intende descrivere. Chi legge non deve essere tratto in inganno: una voce compare tra le &lt;i&gt;assets&lt;/i&gt; solo se ne soddisfa la definizione (slide 25).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Complete&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Neutral&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Free from error&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Measurement uncertainty&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;b&gt;Completezza.&lt;/b&gt; Il quadro deve contenere tutto ciò che serve per capire il fenomeno, comprese descrizioni e spiegazioni. Per un gruppo di attività servono almeno: la natura degli elementi, il loro valore numerico e che cosa quel numero rappresenta (historical cost o fair value?) &lt;span class=&quot;ref&quot;&gt;2.14&lt;/span&gt;. La completezza ha due limiti: la materiality e il costo. Omissioni importanti rendono il bilancio fuorviante (slide 32).&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Neutralità.&lt;/b&gt; Niente &lt;i&gt;bias&lt;/i&gt; nella scelta o nella presentazione: l&#x27;informazione non è inclinata, enfatizzata, sminuita o manipolata per essere accolta in modo favorevole o sfavorevole. Neutrale non vuol dire senza effetto: un&#x27;informazione rilevante, per definizione, cambia le decisioni &lt;span class=&quot;ref&quot;&gt;2.15&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Assenza di errori.&lt;/b&gt; Non significa precisione assoluta. Vuol dire niente errori od omissioni nella descrizione e un processo di stima scelto e applicato senza errori. Il prezzo di un bene che non si osserva sul mercato non è “esatto” né “sbagliato”, ma la sua rappresentazione è fedele se è presentato chiaramente come stima, se se ne spiegano natura e limiti e se il processo è corretto &lt;span class=&quot;ref&quot;&gt;2.18&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Measurement uncertainty&lt;/b&gt; (incertezza di misurazione): nasce quando un importo va stimato perché non si può osservare. Le stime ragionevoli sono parte essenziale del bilancio e, se ben descritte, non ne riducono l&#x27;utilità, nemmeno con incertezza elevata &lt;span class=&quot;ref&quot;&gt;2.19&lt;/span&gt;. Ma a volte l&#x27;informazione più utile è una &lt;b&gt;un po&#x27; meno rilevante ma molto meno incerta&lt;/b&gt; (slide 36). Prova lo strumento qui sotto.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-trade&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · modello illustrativo&lt;/div&gt;
   &lt;h4&gt;Relevance contro measurement uncertainty&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;Misura A: la più rilevante (100) ma stimata. Misura B: meno rilevante (70) ma con incertezza fissa al 10%. Utilità ≈ rilevanza × (1 − incertezza). È una semplificazione didattica, non una formula del Framework.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;unc&quot;&gt;Incertezza della misura A&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;unc&quot; min=&quot;0&quot; max=&quot;80&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;uncO&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 120&quot; id=&quot;tradeSvg&quot; aria-label=&quot;Confronto di utilità&quot;&gt;
    &lt;text x=&quot;0&quot; y=&quot;34&quot; font-size=&quot;14&quot;&gt;A · più rilevante&lt;/text&gt;&lt;rect id=&quot;barA&quot; x=&quot;150&quot; y=&quot;18&quot; height=&quot;24&quot; rx=&quot;5&quot; style=&quot;fill:var(--deep)&quot;/&gt;&lt;text id=&quot;tA&quot; y=&quot;35&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;text x=&quot;0&quot; y=&quot;84&quot; font-size=&quot;14&quot;&gt;B · meno incerta&lt;/text&gt;&lt;rect id=&quot;barB&quot; x=&quot;150&quot; y=&quot;68&quot; height=&quot;24&quot; rx=&quot;5&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text id=&quot;tB&quot; y=&quot;85&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;tradeV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Substance over form&lt;/h4&gt;
  &lt;p&gt;Se la &lt;b&gt;sostanza economica&lt;/b&gt; di un fenomeno e la sua &lt;b&gt;forma legale&lt;/b&gt; non coincidono, rappresentare solo la forma non è fedele &lt;span class=&quot;ref&quot;&gt;2.12&lt;/span&gt;. Nel contratto contano tutti i termini, espliciti o impliciti, salvo quelli privi di sostanza, cioè senza effetti apprezzabili sull&#x27;economia del contratto. Più contratti pensati per produrre un unico effetto commerciale possono essere trattati come &lt;b&gt;una sola unit of account&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.60–4.62&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;band&quot;&gt;&lt;b&gt;Un pezzo di storia (slide 26–27).&lt;/b&gt; Nel 2010 il principio della &lt;i&gt;substance over form&lt;/i&gt; non compariva più come componente autonoma, perché il Board lo riteneva già compreso nella faithful representation. Alcuni hanno letto quella cancellazione come un passo indietro, e così nel 2018 il Board ha &lt;b&gt;reinserito un riferimento esplicito&lt;/b&gt; alla sostanza nel par. 2.12 &lt;span class=&quot;ref&quot;&gt;BC2.32–2.33&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-lease&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Esempio dalle slide (slide 29)&lt;/div&gt;
   &lt;h4&gt;Il leasing di un macchinario per tutta la sua vita utile&lt;/h4&gt;
   &lt;p&gt;L&#x27;entità si impegna a pagare canoni per usare un macchinario per tutta la sua vita economica attesa. In sostanza è come prendere un prestito e comprare il macchinario.&lt;/p&gt;
   &lt;div class=&quot;btns&quot; role=&quot;group&quot;&gt;&lt;button class=&quot;btn&quot; data-lease=&quot;form&quot; aria-pressed=&quot;true&quot;&gt;Forma legale&lt;/button&gt;&lt;button class=&quot;btn&quot; data-lease=&quot;sub&quot; aria-pressed=&quot;false&quot;&gt;Sostanza economica&lt;/button&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 190&quot; aria-label=&quot;Stato patrimoniale secondo forma e sostanza&quot;&gt;
    &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;520&quot; height=&quot;30&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Statement of financial position&lt;/text&gt;
    &lt;line x1=&quot;300&quot; y1=&quot;40&quot; x2=&quot;300&quot; y2=&quot;180&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;170&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;ASSETS&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;LIABILITIES&lt;/text&gt;
    &lt;g id=&quot;leaseForm&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;nessun macchinario&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;nessun debito&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--acc)&quot;&gt;solo canoni a conto economico, anno per anno&lt;/text&gt;&lt;/g&gt;
    &lt;g id=&quot;leaseSub&quot; style=&quot;display:none&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;80&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--mid);opacity:.5&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Macchinario&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;risorsa controllata&lt;/text&gt;&lt;rect x=&quot;330&quot; y=&quot;80&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--acc);opacity:.25&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Debito per canoni&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;obbligo di pagare&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--deep)&quot;&gt;un&#x27;attività e una passività&lt;/text&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;È la logica che l&#x27;&lt;b&gt;IFRS 16 Leases&lt;/b&gt; applica a tutti i leasing del locatario, che iscrive un &lt;i&gt;right-of-use asset&lt;/i&gt; e una &lt;i&gt;lease liability&lt;/i&gt; (&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;). Le slide non citano l&#x27;IFRS 16.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Secondo le slide (30) la substance over form è &lt;b&gt;pervasiva&lt;/b&gt; negli IAS/IFRS: spinge verso i &lt;b&gt;flussi finanziari futuri probabili&lt;/b&gt; e verso la disponibilità economica intesa come &lt;b&gt;controllo della risorsa&lt;/b&gt;, mentre prima si guardava a &lt;i&gt;rischi e benefici&lt;/i&gt;. È dalla disponibilità che discendono i flussi: rappresentandola in modo economico, si stimano meglio i flussi attesi.&lt;/p&gt;

  &lt;h3&gt;Enhancing characteristics&lt;/h3&gt;
  &lt;p&gt;Le &lt;span class=&quot;t&quot;&gt;enhancing characteristics&lt;/span&gt; (caratteristiche “rafforzative”) aumentano l&#x27;utilità di un&#x27;informazione che è già rilevante e fedele, ma &lt;b&gt;non possono rendere utile un&#x27;informazione che non lo è&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Comparability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Verifiability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Timeliness&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Understandability&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Comparabilità&lt;/b&gt;: permette di cogliere somiglianze e differenze tra voci. È l&#x27;unica caratteristica che non riguarda una voce isolata &lt;span class=&quot;ref&quot;&gt;2.25&lt;/span&gt;. Si confronta &lt;b&gt;nel tempo&lt;/b&gt; (la stessa impresa in anni diversi, per le analisi di trend) e &lt;b&gt;nello spazio&lt;/b&gt; (imprese diverse).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Consistency ≠ comparability&lt;/b&gt;: la comparabilità è l&#x27;obiettivo, la coerenza (stessi metodi nel tempo) è lo strumento per raggiungerlo &lt;span class=&quot;ref&quot;&gt;2.26&lt;/span&gt;. Ne seguono due corollari: criteri costanti e &lt;b&gt;informativa sui cambi di criterio&lt;/b&gt;, con gli effetti anche sui periodi precedenti (rinvio allo &lt;b&gt;IAS 8&lt;/b&gt;). Le modifiche agli Standard decise dallo IASB non devono ostacolare la comparabilità (slide 39).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Verificabilità&lt;/b&gt;: osservatori informati e indipendenti potrebbero arrivare a un consenso, anche non completo, sul fatto che una rappresentazione sia fedele. Si possono verificare anche un intervallo di importi e le relative probabilità, non solo una stima puntuale &lt;span class=&quot;ref&quot;&gt;2.30&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Diretta&lt;/b&gt;: osservazione diretta, per esempio &lt;i&gt;contare la cassa&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Indiretta&lt;/b&gt;: si controllano gli input di un modello e si ricalcola il risultato con lo stesso metodo, per esempio quantità e costi del magazzino ricalcolati con il FIFO (first-in, first-out) &lt;span class=&quot;ref&quot;&gt;2.31&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Le informazioni prospettiche possono non essere verificabili fino a un periodo futuro, o mai: allora bisogna esporre ipotesi, metodi e circostanze che le sostengono &lt;span class=&quot;ref&quot;&gt;2.32&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Tempestività&lt;/b&gt;: l&#x27;informazione arriva in tempo per influenzare le decisioni. Di solito più è vecchia, meno serve, ma alcune informazioni restano utili a lungo, per esempio per analizzare i trend &lt;span class=&quot;ref&quot;&gt;2.33&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;C&#x27;è un &lt;i&gt;trade-off&lt;/i&gt; tra &lt;b&gt;disponibilità e affidabilità&lt;/b&gt;: un&#x27;informazione accurata ma tardiva può essere inutile, una tempestiva ma poco curata può essere inaffidabile. Per questo i regolatori fissano termini di pubblicazione e chiedono report più volte l&#x27;anno (slide 43–44).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Comprensibilità&lt;/b&gt;: classificare, caratterizzare e presentare in modo chiaro e conciso &lt;span class=&quot;ref&quot;&gt;2.34&lt;/span&gt;. Riguarda la forma espositiva dei prospetti e la qualità delle note.&lt;/p&gt;&lt;p&gt;L&#x27;utente di riferimento ha una &lt;b&gt;ragionevole conoscenza&lt;/b&gt; del business e analizza con diligenza. A volte anche lui ha bisogno di un consulente &lt;span class=&quot;ref&quot;&gt;2.36&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;warn&quot; style=&quot;margin:8px 0&quot;&gt;&lt;b&gt;Mai omettere perché è complicato.&lt;/b&gt; Togliere dal bilancio un fenomeno complesso lo renderebbe più semplice da leggere, ma incompleto e quindi potenzialmente fuorviante &lt;span class=&quot;ref&quot;&gt;2.35&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Prudence o conservatism&lt;/h4&gt;
  &lt;p&gt;La &lt;span class=&quot;t&quot;&gt;prudence&lt;/span&gt; (prudenza, o &lt;i&gt;conservatism&lt;/i&gt;) è il &lt;i&gt;bias&lt;/i&gt; più famoso della contabilità: sottovalutare attività e ricavi, sopravvalutare passività e costi per difendere i creditori dall&#x27;ottimismo degli amministratori. Le slide la presentano come “&lt;b&gt;now deleted from the Framework&lt;/b&gt;” (slide 47).&lt;/p&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Differenza con il Codice civile.&lt;/b&gt; Nella tradizione dottrinale italiana e nel Codice civile la prudenza è un principio cardine di redazione del bilancio, con un&#x27;&lt;b&gt;asimmetria valutativa&lt;/b&gt;: le perdite si rilevano anche se solo probabili, gli utili solo se realizzati. Nel Framework IASB la prudenza &lt;b&gt;non è un principio del bilancio&lt;/b&gt;: compare al massimo tra le caratteristiche qualitative dell&#x27;informazione, come sotto-punto dell&#x27;affidabilità (oggi faithful representation), &lt;b&gt;senza asimmetria valutativa&lt;/b&gt; (slide 47).&lt;/div&gt;
  &lt;div class=&quot;def ext&quot;&gt;Nel Framework del 2018 la prudence è ricomparsa nel par. 2.16, come &lt;b&gt;cautela nei giudizi in condizioni di incertezza&lt;/b&gt; a sostegno della neutralità, e non come licenza di sottovalutare in modo sistematico (&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2018/october/wss/wss4-conceptual-framework-overview.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, overview 2018&lt;/a&gt;). Per l&#x27;Italia la prudenza è all&#x27;&lt;b&gt;art. 2423-bis c.c.&lt;/b&gt; (&lt;a href=&quot;https://www.filodiritto.com/codici/codice-civile/capo-v-societa-azioni/art-2423-bis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo&lt;/a&gt;). Confronta con il materiale del corso: “now deleted” descrive la situazione dopo il 2010.&lt;/div&gt;

  &lt;h3&gt;The cost constraint&lt;/h3&gt;
  &lt;div class=&quot;band&quot;&gt;&lt;b&gt;Regola generale:&lt;/b&gt; il costo dell&#x27;informazione deve essere giustificato dal beneficio per gli utenti, valutando tipo per tipo (slide 48).&lt;/div&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costi&lt;/h4&gt;Chi redige il bilancio sostiene il grosso dello sforzo: raccogliere, elaborare, verificare e diffondere i dati. Ma alla fine i costi ricadono sugli utenti sotto forma di minori rendimenti. Gli utenti pagano anche l&#x27;analisi e, se manca un&#x27;informazione, il costo di cercarla altrove o di stimarla &lt;span class=&quot;ref&quot;&gt;2.39–2.40&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Benefici&lt;/h4&gt;Decisioni prese con più fiducia, mercati dei capitali più efficienti, &lt;b&gt;minor costo del capitale&lt;/b&gt; per l&#x27;intera economia. Ma nessun bilancio può dare a ogni utente tutto ciò che gli interessa &lt;span class=&quot;ref&quot;&gt;2.41&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Poiché la valutazione di costi e benefici è soggettiva, il Board la fa per il &lt;b&gt;financial reporting in generale&lt;/b&gt; e non per la singola entità &lt;span class=&quot;ref&quot;&gt;2.42–2.43&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Perché il Board non fissa una soglia percentuale di materiality?&lt;/summary&gt;&lt;div&gt;Perché la materiality è un aspetto entity-specific della relevance: dipende da natura e dimensione della voce nel contesto del bilancio di quella specifica entità [2.11].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Una stima molto incerta è per forza inutile?&lt;/summary&gt;&lt;div&gt;No. Se è ragionevole e descritta con chiarezza può restare utile anche con alta incertezza [2.19]. A volte però conviene un&#x27;informazione un po&#x27; meno rilevante e molto meno incerta (slide 36).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Consistency e comparability sono la stessa cosa?&lt;/summary&gt;&lt;div&gt;No. La comparabilità è il fine, la coerenza dei metodi nel tempo e tra entità è un mezzo per raggiungerlo [2.26].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Fai un esempio di verifica indiretta.&lt;/summary&gt;&lt;div&gt;Ricalcolare il valore del magazzino partendo dagli input (quantità e costi) con lo stesso metodo di flusso dei costi, per esempio il FIFO [2.31].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché il Framework IASB tratta la prudenza diversamente dal Codice civile?&lt;/summary&gt;&lt;div&gt;Perché una prudenza asimmetrica introduce un bias e contrasta con la neutralità. Nel Framework non è un principio del bilancio e non ammette asimmetria valutativa (slide 47).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s3&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Financial statements and the reporting entity&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 51–56 · Framework, capitolo 3&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;L&#x27;obiettivo dei &lt;b&gt;financial statements&lt;/b&gt; (il bilancio) è fornire informazioni su &lt;b&gt;assets, liabilities, equity, income ed expenses&lt;/b&gt; dell&#x27;entità, utili per valutare le prospettive di futuri flussi di cassa netti in entrata e la stewardship del management &lt;span class=&quot;ref&quot;&gt;3.2&lt;/span&gt;.&lt;/div&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Dove si trovano gli elementi&quot;&gt;
   &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Statement of financial position&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(stato patrimoniale)&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;104&quot;&gt;assets · liabilities · equity&lt;/text&gt;
   &lt;rect x=&quot;315&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Statement(s) of financial performance&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(conto economico e OCI)&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;104&quot;&gt;income · expenses&lt;/text&gt;
   &lt;rect x=&quot;610&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;745&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Other statements &amp;amp; notes&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(rendiconto finanziario, prospetto&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;94&quot; font-size=&quot;12&quot;&gt;del patrimonio netto, note)&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;118&quot;&gt;dettagli, rischi, stime&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;450&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;Si “riconoscono” (recognise) voci nei primi due; il resto è disclosure [3.3]&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reporting period&lt;/h4&gt;Il bilancio copre un &lt;b&gt;periodo definito&lt;/b&gt;. Informa su attività, passività ed equity, comprese quelle &lt;i&gt;non iscritte&lt;/i&gt;, esistenti alla fine o durante il periodo, e su ricavi e costi del periodo &lt;span class=&quot;ref&quot;&gt;3.4&lt;/span&gt;. Riporta i dati comparativi di &lt;b&gt;almeno un periodo precedente&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.5&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward-looking information&lt;/h4&gt;Le informazioni su possibili operazioni o eventi futuri entrano nel bilancio solo se riguardano elementi del periodo, iscritti o no, &lt;b&gt;e&lt;/b&gt; se sono utili agli utenti &lt;span class=&quot;ref&quot;&gt;3.6&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perspective&lt;/h4&gt;Il bilancio guarda le operazioni dal punto di vista dell&#x27;&lt;b&gt;entità nel suo insieme&lt;/b&gt;, non di un particolare gruppo di investitori o creditori &lt;span class=&quot;ref&quot;&gt;3.8&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Going concern assumption&lt;/h4&gt;Il bilancio si redige di norma supponendo che l&#x27;entità &lt;b&gt;continui a operare nel prevedibile futuro&lt;/b&gt; (continuità aziendale), senza intenzione né necessità di liquidarsi o cessare l&#x27;attività. Se invece c&#x27;è, si può dover usare una base diversa, che va descritta &lt;span class=&quot;ref&quot;&gt;3.9&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;La reporting entity&lt;/h3&gt;
  &lt;p&gt;Una &lt;span class=&quot;t&quot;&gt;reporting entity&lt;/span&gt; è un&#x27;entità &lt;b&gt;tenuta a redigere, o che sceglie di redigere&lt;/b&gt;, un bilancio. Può essere una singola entità, una parte di essa o un insieme di più entità, e &lt;b&gt;non è necessariamente un soggetto giuridico&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.10&lt;/span&gt;. Se non è un soggetto giuridico e non è fatta solo di società legate da rapporti controllante-controllata, i suoi confini si tracciano in base ai &lt;b&gt;bisogni informativi dei primary users&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.13–3.14&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 210&quot; role=&quot;img&quot; aria-label=&quot;Bilancio consolidato e non consolidato&quot;&gt;
   &lt;rect x=&quot;30&quot; y=&quot;20&quot; width=&quot;400&quot; height=&quot;170&quot; rx=&quot;16&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-dasharray=&quot;6 4&quot;/&gt;
   &lt;text x=&quot;230&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Consolidated: parent + subsidiaries&lt;/text&gt;
   &lt;rect x=&quot;170&quot; y=&quot;62&quot; width=&quot;120&quot; height=&quot;44&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Parent&lt;/text&gt;
   &lt;rect x=&quot;70&quot; y=&quot;134&quot; width=&quot;110&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;159&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Sub A&lt;/text&gt;
   &lt;rect x=&quot;280&quot; y=&quot;134&quot; width=&quot;110&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;335&quot; y=&quot;159&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Sub B&lt;/text&gt;
   &lt;path d=&quot;M210 106 L135 134 M250 106 L325 134&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
   &lt;rect x=&quot;500&quot; y=&quot;62&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;585&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Parent da sola&lt;/text&gt;
   &lt;text x=&quot;585&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Unconsolidated&lt;/text&gt;
   &lt;text x=&quot;690&quot; y=&quot;140&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;non basta ai creditori e&lt;/text&gt;&lt;text x=&quot;690&quot; y=&quot;156&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;investitori della parent:&lt;/text&gt;&lt;text x=&quot;690&quot; y=&quot;172&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;non sostituisce il consolidato&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Slide 56 [3.18]: se il consolidato è richiesto, il bilancio separato non può sostituirlo, ma la parent può redigerlo in aggiunta.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Una reporting entity deve essere una società con personalità giuridica?&lt;/summary&gt;&lt;div&gt;No: può essere una parte di un&#x27;entità o più entità insieme. Non è necessariamente un soggetto giuridico [3.10].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cosa succede al bilancio se l&#x27;impresa deve andare in liquidazione?&lt;/summary&gt;&lt;div&gt;Viene meno l&#x27;ipotesi di going concern: il bilancio può dover essere redatto su una base diversa, che va descritta [3.9].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;A quali condizioni un&#x27;informazione prospettica entra nel bilancio?&lt;/summary&gt;&lt;div&gt;Se riguarda elementi (iscritti o no) esistenti alla fine o durante il periodo, o ricavi e costi del periodo, e se è utile agli utenti [3.6].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s4&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;The elements of financial statements&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 57–73 · Framework, capitolo 4&lt;/p&gt;
  &lt;p&gt;Gli &lt;span class=&quot;t&quot;&gt;elements&lt;/span&gt; sono le cinque categorie di base del bilancio. &lt;b&gt;Assets, liabilities ed equity&lt;/b&gt; descrivono la &lt;i&gt;financial position&lt;/i&gt; (la situazione patrimoniale e finanziaria); &lt;b&gt;income ed expenses&lt;/b&gt; descrivono la &lt;i&gt;financial performance&lt;/i&gt; (il risultato). Corrispondono alle risorse economiche, ai claims e alle loro variazioni del capitolo 1 &lt;span class=&quot;ref&quot;&gt;4.1–4.2&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Assets − Liabilities = Equity &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Income − Expenses = Profit (o loss)&lt;/div&gt;

  &lt;h3&gt;Asset&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione della definizione di asset&quot;&gt;
   &lt;text x=&quot;450&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; style=&quot;font-family:var(--serif)&quot;&gt;An asset is a &lt;tspan font-weight=&quot;700&quot;&gt;present economic resource&lt;/tspan&gt; &lt;tspan font-weight=&quot;700&quot;&gt;controlled&lt;/tspan&gt; by the entity as a result of &lt;tspan font-weight=&quot;700&quot;&gt;past events&lt;/tspan&gt; [4.3]&lt;/text&gt;
   &lt;path d=&quot;M330 46 V80&quot; style=&quot;stroke:var(--muted)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;text x=&quot;330&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;economic resource = a right that has the potential to produce economic benefits [4.4]&lt;/text&gt;
   &lt;g text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;60&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Right&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;un diritto (contratto, legge…)&lt;/text&gt;
   &lt;rect x=&quot;340&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Potential&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;basta che esista, non che sia probabile&lt;/text&gt;
   &lt;rect x=&quot;620&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Control&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;lega la risorsa all&#x27;entità&lt;/text&gt;
   &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;I tre aspetti della definizione [4.5].&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Right&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Potential&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Control&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;a) Diritti che corrispondono a un&#x27;obbligazione altrui&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.6&lt;/span&gt;: ricevere cassa; ricevere beni o servizi; scambiare risorse a condizioni favorevoli (es. un &lt;i&gt;forward&lt;/i&gt; d&#x27;acquisto oggi favorevole o un&#x27;opzione d&#x27;acquisto); beneficiare dell&#x27;obbligo altrui di trasferire una risorsa se si verifica un evento incerto.&lt;/p&gt;&lt;p&gt;&lt;b&gt;b) Diritti che non corrispondono a un&#x27;obbligazione altrui&lt;/b&gt;: diritti su oggetti fisici (immobili, impianti, rimanenze), come il diritto di usarli o di beneficiare del valore residuo di un bene in leasing; diritti d&#x27;uso di proprietà intellettuale.&lt;/p&gt;&lt;p&gt;I diritti nascono da &lt;b&gt;contratto, legge o mezzi simili&lt;/b&gt;: possedere o prendere in leasing un bene, possedere titoli di debito o di capitale, possedere un brevetto registrato &lt;span class=&quot;ref&quot;&gt;4.7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Perché il potenziale esista &lt;b&gt;non serve che i benefici siano certi, e nemmeno probabili&lt;/b&gt;. Basta che il diritto esista già e che, in almeno una circostanza, produca per l&#x27;entità benefici in più rispetto a quelli disponibili a tutti gli altri &lt;span class=&quot;ref&quot;&gt;4.14&lt;/span&gt;. Una probabilità bassa non toglie lo status di asset, ma conta per decidere &lt;b&gt;se iscriverlo e come misurarlo&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.15&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Come si producono benefici &lt;span class=&quot;ref&quot;&gt;4.16&lt;/span&gt;: ricevere flussi contrattuali; scambiare a condizioni favorevoli; generare entrate o evitare uscite (usando la risorsa per produrre, per valorizzare altre risorse, dandola in leasing); vendere la risorsa; estinguere passività trasferendola.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Il &lt;b&gt;controllo&lt;/b&gt; collega una risorsa a un&#x27;entità e aiuta a capire &lt;i&gt;quale&lt;/i&gt; risorsa va contabilizzata. Chi possiede una quota di un immobile controlla la quota, non l&#x27;intero immobile: il suo asset è la quota &lt;span class=&quot;ref&quot;&gt;4.19&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Si controlla una risorsa quando si ha la &lt;b&gt;capacità attuale di dirigerne l&#x27;uso&lt;/b&gt; e di ottenerne i benefici, compresa la capacità di &lt;b&gt;impedire agli altri&lt;/b&gt; di fare lo stesso. Quindi una risorsa è controllata da una sola parte &lt;span class=&quot;ref&quot;&gt;4.20&lt;/span&gt;. Dirigere l&#x27;uso significa poterla impiegare nelle proprie attività o lasciarla impiegare ad altri &lt;span class=&quot;ref&quot;&gt;4.21&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;fs&quot;&gt;Collegamento con slide 30: il criterio del controllo ha preso il posto del vecchio criterio di “rischi e benefici”.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Liability&lt;/h3&gt;
  &lt;div class=&quot;def quote&quot;&gt;A &lt;b&gt;liability&lt;/b&gt; is a &lt;b&gt;present obligation&lt;/b&gt; of the entity &lt;b&gt;to transfer an economic resource&lt;/b&gt; as a &lt;b&gt;result of past events&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.26&lt;/span&gt;. Servono &lt;b&gt;tutti e tre&lt;/b&gt; i criteri &lt;span class=&quot;ref&quot;&gt;4.27&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;1 · Obligation&lt;/h4&gt;Un dovere o una responsabilità che l&#x27;entità &lt;b&gt;non ha la possibilità pratica di evitare&lt;/b&gt;. È sempre verso un&#x27;altra parte (persona, entità, gruppo, la società in generale), che non serve conoscere per nome &lt;span class=&quot;ref&quot;&gt;4.29&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;2 · Transfer of an economic resource&lt;/h4&gt;L&#x27;obbligo deve avere il &lt;b&gt;potenziale&lt;/b&gt; di richiedere un trasferimento. Non serve certezza né probabilità: basta una circostanza in cui il trasferimento sarebbe dovuto &lt;span class=&quot;ref&quot;&gt;4.37–4.38&lt;/span&gt;. Esempi: pagare cassa, consegnare beni o servizi, scambiare a condizioni sfavorevoli (forward di vendita sfavorevole, opzione venduta), trasferire se accade un evento incerto, emettere uno strumento che obbligherà a trasferire &lt;span class=&quot;ref&quot;&gt;4.39&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;3 · Present obligation da past events&lt;/h4&gt;Esiste solo se l&#x27;entità ha &lt;b&gt;già ottenuto benefici o compiuto un&#x27;azione&lt;/b&gt; e, &lt;b&gt;di conseguenza&lt;/b&gt;, dovrà o potrebbe dover trasferire una risorsa che altrimenti non avrebbe trasferito &lt;span class=&quot;ref&quot;&gt;4.43&lt;/span&gt;. Può accumularsi nel tempo &lt;span class=&quot;ref&quot;&gt;4.44&lt;/span&gt;. Può esistere anche se il trasferimento è esigibile solo in futuro &lt;span class=&quot;ref&quot;&gt;4.46&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Una nuova legge non basta.&lt;/b&gt; L&#x27;emanazione di una legge da sola non crea una present obligation. L&#x27;obbligo nasce quando l&#x27;entità ottiene benefici o compie l&#x27;azione a cui la legge si applica &lt;span class=&quot;ref&quot;&gt;4.45&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-el&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu · casi costruiti per l&#x27;esercizio&lt;/div&gt;
   &lt;h4&gt;È un asset? È una liability?&lt;/h4&gt;
   &lt;div class=&quot;btns&quot; id=&quot;elBtns&quot;&gt;&lt;/div&gt;
   &lt;div id=&quot;elOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Equity, income ed expenses&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Equity&lt;/h4&gt;È il &lt;b&gt;residual interest&lt;/b&gt;, l&#x27;interesse residuo nelle attività dopo aver dedotto tutte le passività &lt;span class=&quot;ref&quot;&gt;4.63&lt;/span&gt;. Gli &lt;i&gt;equity claims&lt;/i&gt; sono le pretese verso l&#x27;entità che non rientrano nella definizione di liability: azioni di vari tipi e alcuni obblighi di emettere altri strumenti di capitale &lt;span class=&quot;ref&quot;&gt;4.64&lt;/span&gt;. La definizione vale per ogni reporting entity &lt;span class=&quot;ref&quot;&gt;4.67&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Income / Expenses&lt;/h4&gt;&lt;b&gt;Income&lt;/b&gt;: aumenti di attività o diminuzioni di passività che fanno crescere l&#x27;equity, &lt;i&gt;esclusi i conferimenti&lt;/i&gt; dei soci &lt;span class=&quot;ref&quot;&gt;4.68&lt;/span&gt;. &lt;b&gt;Expenses&lt;/b&gt;: diminuzioni di attività o aumenti di passività che riducono l&#x27;equity, &lt;i&gt;escluse le distribuzioni&lt;/i&gt; ai soci &lt;span class=&quot;ref&quot;&gt;4.69&lt;/span&gt;.&lt;br&gt;⇒ conferimenti ≠ ricavi, dividendi ≠ costi &lt;span class=&quot;ref&quot;&gt;4.70&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Le definizioni sono &lt;b&gt;derivate&lt;/b&gt;: prima si definiscono attività e passività, poi l&#x27;equity per differenza, poi ricavi e costi come variazioni. È il cosiddetto approccio &lt;i&gt;balance sheet&lt;/i&gt;. Le slide aggiungono che esporre separatamente ricavi e costi con caratteristiche diverse aiuta a capire la performance &lt;span class=&quot;ref&quot;&gt;4.71–4.72&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Un diritto con bassissima probabilità di produrre benefici può essere un asset?&lt;/summary&gt;&lt;div&gt;Sì: per la definizione basta il potenziale [4.14–4.15]. La bassa probabilità conta per le decisioni di iscrizione e misurazione (cap. 5–6).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono i tre criteri di una liability?&lt;/summary&gt;&lt;div&gt;Un&#x27;obbligazione; che consiste nel trasferire una risorsa economica; attuale e derivante da eventi passati [4.27].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Un aumento di capitale sottoscritto dai soci è income?&lt;/summary&gt;&lt;div&gt;No. Aumenta l&#x27;equity, ma i conferimenti dei titolari di equity claims sono esclusi per definizione [4.68, 4.70].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Due soggetti possono controllare la stessa risorsa?&lt;/summary&gt;&lt;div&gt;No: se una parte la controlla, nessun altro la controlla [4.20]. Si può però controllare una quota di un bene, che è un&#x27;altra risorsa [4.19].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s5&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Recognition and derecognition&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 74–79 · Framework, capitolo 5&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;&lt;b&gt;Recognition&lt;/b&gt; (iscrizione o rilevazione) è il processo con cui una voce che soddisfa la definizione di un elemento entra nello stato patrimoniale o nel prospetto della performance: &lt;b&gt;a parole e con un importo&lt;/b&gt;, incluso in uno o più totali. L&#x27;importo con cui un&#x27;attività, una passività o l&#x27;equity compare nello stato patrimoniale è il &lt;span class=&quot;t&quot;&gt;carrying amount&lt;/span&gt; (valore contabile) &lt;span class=&quot;ref&quot;&gt;5.1&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;I prospetti sono &lt;b&gt;sintesi strutturate&lt;/b&gt; pensate per essere comparabili e comprensibili, con totali e subtotali che collegano le voci &lt;span class=&quot;ref&quot;&gt;5.2&lt;/span&gt;. La recognition collega elementi e prospetti così &lt;span class=&quot;ref&quot;&gt;5.3&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-link&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Prova tu&lt;/div&gt;
   &lt;h4&gt;Dall&#x27;equity iniziale a quella finale&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lE0&quot;&gt;Equity iniziale (A − L)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lE0&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;lE0o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lInc&quot;&gt;Income&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lInc&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;lInco&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lExp&quot;&gt;Expenses&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lExp&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;lExpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lCon&quot;&gt;Contributions dai soci&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lCon&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;50&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;lCono&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lDis&quot;&gt;Distributions ai soci&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lDis&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;50&quot; value=&quot;150&quot;&gt;&lt;output id=&quot;lDiso&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;formula&quot; id=&quot;lForm&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;fs&quot;&gt;Lo schema di slide 75 in numeri: stato patrimoniale iniziale + (income − expenses) + (contributions − distributions) = stato patrimoniale finale.&lt;/p&gt;
  &lt;/div&gt;
  &lt;h4&gt;Recognition criteria&lt;/h4&gt;
  &lt;p&gt;Le slide (indice, slide 9) elencano i criteri senza svilupparli: si iscrive un elemento se ne derivano informazioni &lt;b&gt;rilevanti&lt;/b&gt; e una &lt;b&gt;rappresentazione fedele&lt;/b&gt;, cioè le due caratteristiche fondamentali del capitolo 2. Sotto la relevance pesano l&#x27;&lt;i&gt;existence uncertainty&lt;/i&gt; (incertezza sull&#x27;esistenza stessa dell&#x27;elemento) e la &lt;i&gt;low probability&lt;/i&gt; di flussi in entrata o in uscita. Sotto la faithful representation pesano la &lt;i&gt;measurement uncertainty&lt;/i&gt; e altri fattori &lt;span class=&quot;ref&quot;&gt;5.6–5.25&lt;/span&gt;. Ecco il legame con il capitolo 4: la definizione può essere soddisfatta anche se la probabilità è bassa, ma l&#x27;iscrizione no.&lt;/p&gt;

  &lt;h3&gt;Derecognition&lt;/h3&gt;
  &lt;div class=&quot;def quote&quot;&gt;&lt;b&gt;Derecognition&lt;/b&gt; (eliminazione contabile) è la rimozione, totale o parziale, di un&#x27;attività o passività dallo stato patrimoniale, quando non soddisfa più la definizione. Per un asset avviene quando l&#x27;entità &lt;b&gt;perde il controllo&lt;/b&gt;, per una liability quando &lt;b&gt;non ha più l&#x27;obbligazione attuale&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;5.26&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;stepper widget&quot; data-stepper&gt;
   &lt;div class=&quot;wtag&quot;&gt;Passi da scorrere&lt;/div&gt;
   &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Due obiettivi da rappresentare fedelmente &lt;span class=&quot;ref&quot;&gt;5.27&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;(1) Le attività e passività &lt;b&gt;che restano&lt;/b&gt; dopo l&#x27;operazione, comprese quelle nuove acquisite o assunte con l&#x27;operazione; (2) la &lt;b&gt;variazione&lt;/b&gt; di attività e passività prodotta dall&#x27;operazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;a) Eliminare ciò che è uscito&lt;/h4&gt;&lt;p&gt;Si eliminano le attività o passività scadute, consumate, incassate, adempiute o trasferite, e si rilevano i relativi income ed expenses &lt;span class=&quot;ref&quot;&gt;5.28&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;b) Tenere il &lt;i&gt;retained component&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Si continua a iscrivere la parte trattenuta, che diventa un&#x27;unit of account separata. Sulla parte trattenuta &lt;b&gt;non&lt;/b&gt; si rilevano ricavi o costi per effetto dell&#x27;eliminazione dell&#x27;altra parte, a meno che cambino i criteri di misurazione applicabili.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;c) Se serve, procedure aggiuntive&lt;/h4&gt;&lt;p&gt;Presentare a parte il retained component nello stato patrimoniale; presentare a parte i ricavi e costi da derecognition nel prospetto della performance; fornire informazioni esplicative (slide 79).&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Che cos&#x27;è il carrying amount?&lt;/summary&gt;&lt;div&gt;L&#x27;importo con cui un&#x27;attività, una passività o l&#x27;equity è iscritta nello stato patrimoniale [5.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quando si elimina un asset dal bilancio?&lt;/summary&gt;&lt;div&gt;Di norma quando l&#x27;entità perde il controllo di tutto o di parte dell&#x27;asset [5.26].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché sul retained component di solito non si rilevano utili o perdite?&lt;/summary&gt;&lt;div&gt;Perché la parte trattenuta non è stata trasferita: diventa un&#x27;unit of account separata e resta misurata come prima, a meno che la derecognition cambi i requisiti di misurazione che le si applicano [5.28 b].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s6&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Measurement&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slide 80–91 · Framework, capitolo 6&lt;/p&gt;
  &lt;p&gt;Gli elementi iscritti vanno espressi in moneta. Serve una &lt;span class=&quot;t&quot;&gt;measurement basis&lt;/span&gt; (base di misurazione), cioè la caratteristica dell&#x27;elemento che si sceglie di misurare: costo storico, fair value, fulfilment value… Applicata a un&#x27;attività o passività, genera la misura di quella voce e dei relativi ricavi e costi &lt;span class=&quot;ref&quot;&gt;6.1&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Albero delle basi di misurazione&quot;&gt;
   &lt;g text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;350&quot; y=&quot;10&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;38&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Measurement bases&lt;/text&gt;
   &lt;path d=&quot;M420 54 L200 92 M480 54 L640 92&quot; style=&quot;stroke:var(--muted)&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;90&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;118&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Historical cost&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;136&quot; font-size=&quot;11&quot;&gt;entry value · prezzo dell&#x27;operazione&lt;/text&gt;
   &lt;rect x=&quot;530&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;118&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Current value&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;136&quot; font-size=&quot;11&quot;&gt;aggiornato alla data di misurazione&lt;/text&gt;
   &lt;path d=&quot;M580 144 L430 182 M640 144 V182 M700 144 L830 182&quot; style=&quot;stroke:var(--muted)&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;350&quot; y=&quot;184&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;208&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Fair value&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;226&quot; font-size=&quot;11&quot;&gt;exit · market participants&lt;/text&gt;
   &lt;rect x=&quot;540&quot; y=&quot;184&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;204&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Value in use /&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;220&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Fulfilment value&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;235&quot; font-size=&quot;11&quot;&gt;exit · entity-specific&lt;/text&gt;
   &lt;rect x=&quot;760&quot; y=&quot;184&quot; width=&quot;130&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;825&quot; y=&quot;208&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Current cost&lt;/text&gt;&lt;text x=&quot;825&quot; y=&quot;226&quot; font-size=&quot;11&quot;&gt;entry · oggi&lt;/text&gt;
   &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Historical cost&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Fair value&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Value in use / Fulfilment&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Current cost&lt;/button&gt;&lt;/div&gt;
