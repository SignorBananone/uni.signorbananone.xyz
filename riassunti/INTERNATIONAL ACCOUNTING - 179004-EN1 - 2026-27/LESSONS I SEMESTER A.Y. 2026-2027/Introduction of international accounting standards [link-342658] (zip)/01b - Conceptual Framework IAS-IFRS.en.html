   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Historical cost&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Fair value&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Value in use / Fulfilment&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Current cost&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;Uses information derived, at least in part, from the &lt;b&gt;price of the transaction&lt;/b&gt; that gave rise to the item. It does not reflect changes in value, &lt;b&gt;except&lt;/b&gt; for impairment of an asset or a liability that has become &lt;i&gt;onerous&lt;/i&gt; &lt;span class=&quot;ref&quot;&gt;6.4&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Asset&lt;/b&gt;: costs incurred to acquire or create it = consideration paid &lt;b&gt;+&lt;/b&gt; transaction costs.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Liability&lt;/b&gt;: consideration received &lt;b&gt;−&lt;/b&gt; transaction costs &lt;span class=&quot;ref&quot;&gt;6.5&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;If the transaction is not on market terms, cost may not exist or may not be relevant. A current value is then used as &lt;b&gt;deemed cost&lt;/b&gt; on initial recognition, which becomes the starting point for subsequent historical cost measurement &lt;span class=&quot;ref&quot;&gt;6.6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;def quote&quot; style=&quot;margin-top:4px&quot;&gt;&lt;b&gt;Fair value&lt;/b&gt; is the price that would be received to sell an asset, or paid to transfer a liability, in an &lt;b&gt;orderly transaction&lt;/b&gt; (not a forced one) between &lt;b&gt;market participants&lt;/b&gt; at the measurement date &lt;span class=&quot;ref&quot;&gt;6.12&lt;/span&gt;.&lt;/div&gt;&lt;p&gt;It reflects the perspective of participants in a market to which the entity has access, who act in their own economic best interest &lt;span class=&quot;ref&quot;&gt;6.13&lt;/span&gt;. It is observed &lt;b&gt;directly&lt;/b&gt; in an active market, or estimated &lt;b&gt;indirectly&lt;/b&gt; using measurement techniques, such as cash-flow-based ones &lt;span class=&quot;ref&quot;&gt;6.14&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;The Standard that sets out in detail how fair value is measured is &lt;b&gt;IFRS 13&lt;/b&gt;, with its three-level hierarchy of inputs (&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Value in use&lt;/b&gt;: the present value of the cash flows or other economic benefits that the entity expects to derive from the &lt;b&gt;use&lt;/b&gt; of an asset and from its ultimate disposal. &lt;b&gt;Fulfilment value&lt;/b&gt;: the present value of the cash or other resources that the entity expects to be obliged to transfer to &lt;b&gt;fulfil&lt;/b&gt; a liability, including to parties other than the counterparty &lt;span class=&quot;ref&quot;&gt;6.17&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;They do not include transaction costs incurred on acquisition, but &lt;b&gt;do include the present value&lt;/b&gt; of those expected on disposal or fulfilment &lt;span class=&quot;ref&quot;&gt;6.18&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;They use &lt;b&gt;entity-specific assumptions&lt;/b&gt; rather than market-participant assumptions &lt;span class=&quot;ref&quot;&gt;6.19&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;They cannot be observed directly: they are determined using &lt;b&gt;cash-flow-based measurement techniques&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;6.20&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;Value in use is used by &lt;b&gt;IAS 36&lt;/b&gt; for the impairment test: the &lt;i&gt;recoverable amount&lt;/i&gt; is the higher of fair value less costs of disposal and value in use (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Asset&lt;/b&gt;: the cost of an equivalent asset at the measurement date = consideration that would be paid &lt;b&gt;+&lt;/b&gt; transaction costs at that date. &lt;b&gt;Liability&lt;/b&gt;: consideration that would be received for an equivalent liability &lt;b&gt;−&lt;/b&gt; transaction costs &lt;span class=&quot;ref&quot;&gt;6.21&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Like historical cost, it is an &lt;b&gt;entry value&lt;/b&gt; (the price in the market in which the asset would be &lt;i&gt;acquired&lt;/i&gt;), but it &lt;b&gt;reflects current conditions&lt;/b&gt;. Fair value, value in use and fulfilment value, by contrast, are &lt;b&gt;exit values&lt;/b&gt;. If only prices of new assets are available, the current cost of a used asset is estimated by &lt;b&gt;adjusting the price of a new one&lt;/b&gt; for age and condition &lt;span class=&quot;ref&quot;&gt;6.22&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-meas&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · invented figures&lt;/div&gt;
   &lt;h4&gt;One machine, four measures&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;Bought for 100 plus 5 of transaction costs, useful life 5 years, straight-line depreciation (for historical cost and for the current cost of the used asset).&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mAge&quot;&gt;Years elapsed&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mAge&quot; min=&quot;0&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;mAgeO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mFv&quot;&gt;Current selling price on the second-hand market&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mFv&quot; min=&quot;20&quot; max=&quot;140&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;mFvO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mNew&quot;&gt;Current price of an equivalent new machine&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mNew&quot; min=&quot;70&quot; max=&quot;160&quot; value=&quot;120&quot;&gt;&lt;output id=&quot;mNewO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mCf&quot;&gt;Expected annual cash flow from use&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mCf&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;mCfO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mR&quot;&gt;Discount rate&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mR&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;8&quot;&gt;&lt;output id=&quot;mRO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 640 200&quot; id=&quot;measSvg&quot; aria-label=&quot;Comparison of measurement bases&quot;&gt;&lt;/svg&gt;
   &lt;p class=&quot;fs&quot;&gt;Value in use = Σ CF / (1+r)&lt;sup&gt;t&lt;/sup&gt; over the remaining years (ignoring disposal costs, for simplicity). Current cost = (new + 5) × fraction of remaining life. As you can see, the bases give very different figures for the same asset: this is why the choice of basis matters (6.43 ff.).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cash-flow-based measurement techniques&lt;/h3&gt;
  &lt;p&gt;When a measure cannot be observed, it can be estimated using cash-flow-based techniques. &lt;b&gt;They are not measurement bases&lt;/b&gt;: they are tools for &lt;i&gt;applying&lt;/i&gt; one. It is therefore necessary to identify which basis is being applied and the extent to which the technique reflects its factors &lt;span class=&quot;ref&quot;&gt;6.91&lt;/span&gt;. For fair value the factors are &lt;span class=&quot;ref&quot;&gt;6.14&lt;/span&gt;:&lt;/p&gt;
  &lt;ol class=&quot;steps&quot;&gt;
   &lt;li&gt;&lt;b&gt;estimates of future cash flows&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;possible variations in the amount or timing&lt;/b&gt; of cash flows, arising from their uncertainty;&lt;/li&gt;
   &lt;li&gt;the &lt;b&gt;time value of money&lt;/b&gt;;&lt;/li&gt;
   &lt;li&gt;the &lt;b&gt;price for bearing the uncertainty&lt;/b&gt; (risk premium or discount): buyers pay less for uncertain cash flows and demand more to assume uncertain liabilities;&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;other factors&lt;/b&gt;, for example liquidity, if market participants would take them into account.&lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;formula&quot;&gt;PV = Σ&lt;sub&gt;t=1…n&lt;/sub&gt; E[CF&lt;sub&gt;t&lt;/sub&gt;] / (1 + r)&lt;sup&gt;t&lt;/sup&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;The present value formula is not in the slides: it is the standard form in which factors a)–d) enter the calculation. Risk can be reflected in the rate r (risk premium) or in the cash flows E[CF] (certainty equivalent).&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Modified bases&lt;/b&gt; can also be used, for example a fulfilment value that excludes the risk that the entity may fail to fulfil the liability (&lt;i&gt;own credit risk&lt;/i&gt;). They may be more relevant or less costly, but also &lt;b&gt;harder to understand&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;6.92&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Which bases are entry values and which are exit values?&lt;/summary&gt;&lt;div&gt;Entry: historical cost and current cost. Exit: fair value, value in use and fulfilment value [6.21].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between fair value and value in use?&lt;/summary&gt;&lt;div&gt;Fair value uses market-participant assumptions (it is market-based); value in use uses the entity&#x27;s own assumptions (it is entity-specific) and can never be observed directly [6.13, 6.19–6.20].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does historical cost never change after recognition?&lt;/summary&gt;&lt;div&gt;It does not reflect changes in value, except for impairment of an asset or a liability that has become onerous [6.4]. It also changes through depreciation and consumption.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Is a discounted cash flow a measurement basis?&lt;/summary&gt;&lt;div&gt;No: it is a technique for applying a basis (fair value, value in use…). The basis being applied must always be identified [6.91].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section class=&quot;part mattone&quot; id=&quot;s7&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Presentation and disclosure&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 92–97 · Framework, Chapter 7&lt;/p&gt;
  &lt;p&gt;Through &lt;span class=&quot;t&quot;&gt;presentation&lt;/span&gt; (in the primary statements) and &lt;span class=&quot;t&quot;&gt;disclosure&lt;/span&gt; (mainly in the notes), the entity &lt;b&gt;communicates&lt;/b&gt; information about its elements &lt;span class=&quot;ref&quot;&gt;7.1&lt;/span&gt;. Effective communication makes information more relevant, contributes to its faithful representation and enhances its understandability and comparability.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Principles, not rules&lt;/h4&gt;Focus on presentation and disclosure &lt;b&gt;objectives and principles&lt;/b&gt; rather than on mechanical rules &lt;span class=&quot;ref&quot;&gt;7.2&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Classify&lt;/h4&gt;&lt;b&gt;Group similar items&lt;/b&gt; and &lt;b&gt;separate dissimilar items&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Aggregate&lt;/h4&gt;Without obscuring information with &lt;b&gt;excessive detail&lt;/b&gt; or &lt;b&gt;excessive aggregation&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Standards need to &lt;b&gt;balance&lt;/b&gt; the flexibility given to the entity to provide relevant and faithful information with the requirement for information that is &lt;b&gt;comparable&lt;/b&gt; over time and across entities &lt;span class=&quot;ref&quot;&gt;7.4&lt;/span&gt;. Disclosure objectives help the entity identify what to communicate and how &lt;span class=&quot;ref&quot;&gt;7.5&lt;/span&gt;. Two further principles &lt;span class=&quot;ref&quot;&gt;7.6&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No boilerplate&lt;/h4&gt;&lt;b&gt;Entity-specific&lt;/b&gt; information is more useful than standardised, generic wording, known as &lt;i&gt;boilerplate&lt;/i&gt;: “form” text copied from one set of financial statements to another.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;No duplication&lt;/h4&gt;Repeating the same information in different parts of the financial statements is usually unnecessary and makes them less understandable.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;Classification&lt;/h3&gt;
  &lt;p&gt;It is the sorting of assets, liabilities, equity, income and expenses on the basis of &lt;b&gt;shared characteristics&lt;/b&gt;: the &lt;b&gt;nature&lt;/b&gt; of the item, its &lt;b&gt;role or function&lt;/b&gt; within the business activities, and &lt;b&gt;how it is measured&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;7.7&lt;/span&gt;. Classifying dissimilar items together obscures information and may not provide a faithful representation &lt;span class=&quot;ref&quot;&gt;7.8&lt;/span&gt;.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Offsetting, equity and “profit or loss vs OCI”: what are they? (slide 12, table of contents only)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The slides list these sub-sections without developing them. In brief:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Offsetting&lt;/b&gt;: presenting an asset and a liability net, as a single figure. It is generally not appropriate, because it combines dissimilar items &lt;span class=&quot;ref&quot;&gt;7.10&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Classification of equity&lt;/b&gt;: it may be useful to classify separately components of equity with different characteristics &lt;span class=&quot;ref&quot;&gt;7.12&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Profit or loss and other comprehensive income (OCI)&lt;/b&gt;: the statement of profit or loss is the primary source of information about performance. Some changes, for example certain revaluations, may be included in &lt;i&gt;other comprehensive income&lt;/i&gt; (OCI) and, in principle, later reclassified to profit or loss (&lt;i&gt;recycling&lt;/i&gt;) &lt;span class=&quot;ref&quot;&gt;7.15–7.19&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;h3&gt;Aggregation&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Aggregation&lt;/span&gt; is the adding together of items that share characteristics and belong to the same classification &lt;span class=&quot;ref&quot;&gt;7.20&lt;/span&gt;. It summarises a large volume of detail but conceals some of it: a balance is needed &lt;span class=&quot;ref&quot;&gt;7.21&lt;/span&gt;. Different levels coexist: the primary statements are summarised, the notes more detailed &lt;span class=&quot;ref&quot;&gt;7.22&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-agg&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · invented figures&lt;/div&gt;
   &lt;h4&gt;How far should assets be aggregated?&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;agg&quot;&gt;Level of detail&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;agg&quot; min=&quot;1&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;aggO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div id=&quot;aggOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;From 1 January 2027 &lt;b&gt;IFRS 18 Presentation and Disclosure in Financial Statements&lt;/b&gt; replaces IAS 1. It introduces defined subtotals in the statement of profit or loss, requirements on aggregation and disaggregation, and disclosures on &lt;i&gt;management-defined performance measures&lt;/i&gt; (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;). It applies the principles of Chapter 7.&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;On which characteristics is classification based?&lt;/summary&gt;&lt;div&gt;The nature of the item, its role or function within the business activities, and how it is measured, among others [7.7].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is boilerplate, and why is it discouraged?&lt;/summary&gt;&lt;div&gt;Standardised, generic wording that is the same for all entities. It is less useful than entity-specific information [7.6].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why are both excessive detail and excessive aggregation a problem?&lt;/summary&gt;&lt;div&gt;Because in both cases relevant information is obscured: buried under unnecessary detail or hidden in totals [7.21].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S8 --&gt;
&lt;section class=&quot;part mattone&quot; id=&quot;s8&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Concepts of capital and capital maintenance&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 98–103 · Framework, Chapter 8&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Financial concept of capital&lt;/h4&gt;Capital is invested money or invested purchasing power: it is synonymous with &lt;b&gt;net assets or equity&lt;/b&gt;. It is the concept adopted by most entities &lt;span class=&quot;ref&quot;&gt;8.1&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Physical concept of capital&lt;/h4&gt;Capital is the &lt;b&gt;productive capacity&lt;/b&gt; (&lt;i&gt;operating capability&lt;/i&gt;), measured for example in &lt;b&gt;units of output per day&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The choice depends on the &lt;b&gt;needs of users&lt;/b&gt;: if they are concerned with maintaining nominal invested capital or its purchasing power, the financial concept is used; if they are concerned with operating capability, the physical one &lt;span class=&quot;ref&quot;&gt;8.2&lt;/span&gt;.&lt;/p&gt;
  &lt;h3&gt;Capital maintenance: when is there a profit?&lt;/h3&gt;
  &lt;p&gt;The concept of &lt;span class=&quot;t&quot;&gt;capital maintenance&lt;/span&gt; defines the capital that the entity seeks to maintain. It is the &lt;b&gt;point of reference&lt;/b&gt; for measuring profit and makes it possible to distinguish the &lt;i&gt;return &lt;b&gt;on&lt;/b&gt; capital&lt;/i&gt; from the &lt;i&gt;return &lt;b&gt;of&lt;/b&gt; capital&lt;/i&gt;. Only amounts in excess of those needed to maintain capital are profit &lt;span class=&quot;ref&quot;&gt;8.4&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Profit = Income − Expenses (including capital maintenance adjustments) &amp;nbsp;·&amp;nbsp; if negative: loss&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Financial – nominal&lt;/th&gt;&lt;th&gt;Financial – constant purchasing power&lt;/th&gt;&lt;th&gt;Physical&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Capital to be maintained&lt;/b&gt;&lt;/td&gt;&lt;td&gt;net assets in nominal monetary units&lt;/td&gt;&lt;td&gt;net assets in purchasing power&lt;/td&gt;&lt;td&gt;productive capacity&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Measurement basis&lt;/b&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;no particular basis required: depends on the capital chosen &lt;span class=&quot;ref&quot;&gt;8.5&lt;/span&gt;&lt;/td&gt;&lt;td&gt;requires &lt;b&gt;current cost&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;8.5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Increases in asset prices (holding gains)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;are &lt;b&gt;profit&lt;/b&gt;, though possibly recognised only on disposal&lt;/td&gt;&lt;td&gt;only the part &lt;b&gt;in excess of general inflation&lt;/b&gt; is profit; the rest is an equity adjustment &lt;span class=&quot;ref&quot;&gt;8.7&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;are not profit&lt;/b&gt;: they are capital maintenance adjustments within equity &lt;span class=&quot;ref&quot;&gt;8.8&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Main difference&lt;/b&gt;: how the effects of &lt;b&gt;changes in the prices&lt;/b&gt; of assets and liabilities are treated. In general, capital is maintained if it is the same at the end of the period as at the beginning; any excess is profit &lt;span class=&quot;ref&quot;&gt;8.6&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-cap&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · constructed example&lt;/div&gt;
   &lt;h4&gt;Same year, three different profits&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;Shareholders contribute 1,000 in cash. With that amount the entity buys goods and sells them at year end. No other costs.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cS&quot;&gt;Selling price of the goods&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cS&quot; min=&quot;800&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1500&quot;&gt;&lt;output id=&quot;cSO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cI&quot;&gt;General inflation for the year&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cI&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;cIO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cR&quot;&gt;Replacement cost of the same goods at year end&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cR&quot; min=&quot;800&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1300&quot;&gt;&lt;output id=&quot;cRO&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 660 230&quot; id=&quot;capSvg&quot; aria-label=&quot;Profit under the three concepts&quot;&gt;&lt;/svg&gt;
   &lt;div id=&quot;capTxt&quot; class=&quot;fs&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Capital maintenance adjustments&lt;/span&gt; arise from the revaluation or restatement of assets and liabilities. They are increases or decreases in equity that meet the definition of income and expenses but, under certain capital maintenance concepts, are not included in profit or loss: they remain in equity as adjustments or &lt;b&gt;revaluation reserves&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;8.10&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;band&quot;&gt;The Framework is applicable to a range of accounting models. &lt;b&gt;At present the Board does not intend to prescribe a particular model&lt;/b&gt;, other than in exceptional circumstances such as entities reporting in the currency of a &lt;b&gt;hyperinflationary economy&lt;/b&gt;. This intention will be reviewed in the light of world developments &lt;span class=&quot;ref&quot;&gt;8.9&lt;/span&gt;.&lt;/div&gt;
  &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;The exceptional case is governed by &lt;b&gt;IAS 29 Financial Reporting in Hyperinflationary Economies&lt;/b&gt;, which requires the financial statements to be restated. Indicators of hyperinflation include a cumulative inflation rate over three years approaching or exceeding 100% (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;).&lt;/p&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Which concept of capital do almost all entities use?&lt;/summary&gt;&lt;div&gt;The financial concept: capital = net assets or equity [8.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Under physical capital maintenance, is an increase in the replacement cost of inventories profit?&lt;/summary&gt;&lt;div&gt;No. It is a capital maintenance adjustment recognised in equity, because it is needed to maintain productive capacity [8.8].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which measurement basis does the physical concept require?&lt;/summary&gt;&lt;div&gt;Current cost [8.5]. This is a direct link with Chapter 6.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What distinguishes the return on capital from the return of capital?&lt;/summary&gt;&lt;div&gt;The former is profit, i.e. the excess over the capital to be maintained; the latter is the recovery of the capital itself. The capital maintenance concept draws the line between the two [8.4].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;fonti&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Documents, standards and legislation cited in the slides or directly referred to by their examples. &lt;b&gt;Everything below is an &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/b&gt;, found through web searches; it does not come from the slides. Always check the version currently in force on the official website.&lt;/p&gt;
  &lt;ul class=&quot;src&quot;&gt;
   &lt;li&gt;&lt;h4&gt;Conceptual Framework for Financial Reporting (IASB, March 2018)&lt;/h4&gt;&lt;p&gt;The full official text, cited throughout the slides by paragraph number. It applied immediately to the IASB and the IFRS Interpretations Committee and, for those who use it in the absence of a specific Standard, for annual periods beginning on or after 1 January 2020. Use it to read the paragraphs that the slides summarise or cite only in the table of contents (5.6–5.25, 6.43–6.90, 7.10–7.19).&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Conceptual Framework&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Conceptual Framework – Project Summary (IFRS Foundation, 2018)&lt;/h4&gt;&lt;p&gt;Official summary of the 2018 changes: definitions of asset and liability, the return of prudence and stewardship, measurement uncertainty, derecognition. Useful for understanding why the Framework changed.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/-/media/project/conceptual-framework/fact-sheet-project-summary-and-feedback-statement/conceptual-framework-project-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Project summary (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2018/october/wss/wss4-conceptual-framework-overview.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2018 overview slides (PDF)&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Basis for Conclusions on the Conceptual Framework (BC2.32–BC2.33)&lt;/h4&gt;&lt;p&gt;Slides 26–27 cite the BC paragraphs on substance over form. The &lt;i&gt;Basis for Conclusions&lt;/i&gt; explains the Board&#x27;s reasoning behind each decision. The link leads to the copy published by the AASB, the Australian standard setter.&lt;/p&gt;&lt;a href=&quot;https://www.aasb.gov.au/admin/file/content105/c9/CF_BC_1-22.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;aasb.gov.au · CF Basis for Conclusions (PDF)&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;History: Framework 1989 → 2010 → 2018&lt;/h4&gt;&lt;p&gt;The 1989 text was issued by the IASC. The joint IASB–FASB project led in 2010 to the rewriting of only the chapters on the objective and on the qualitative characteristics; the rest remained unchanged until the 2018 revision.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2018/03/cf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · news, March 2018&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 8 – Accounting Policies, Changes in Accounting Estimates and Errors&lt;/h4&gt;&lt;p&gt;Referred to on slide 39 on comparability. It governs the selection of and changes in accounting policies (as a rule applied retrospectively), changes in estimates (applied prospectively) and the correction of errors. With the arrival of IFRS 18, some parts of IAS 1 were moved into IAS 8, and the IASB decided to rename it: check the current title.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 8&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Italian Civil Code, art. 2423-bis – Principles for preparing financial statements&lt;/h4&gt;&lt;p&gt;The provision behind the “classical Italian approach” on slide 47: valuation must be prudent and made on a going concern basis. Since 2016 (Legislative Decree 139/2015) it also provides for the prevalence of substance over form. It is interpreted by the Italian national accounting standard OIC 11.&lt;/p&gt;&lt;a href=&quot;https://www.filodiritto.com/codici/codice-civile/capo-v-societa-azioni/art-2423-bis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;filodiritto.com · art. 2423-bis Civil Code&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 16 – Leases&lt;/h4&gt;&lt;p&gt;Linked to the lease example on slide 29. Since 2019 lessees recognise a right-of-use asset and a lease liability for almost all leases: substance over form in practice.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · IFRS 16&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 13 – Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Develops the definition of fair value in para. 6.12: exit price, market-participant perspective, three-level fair value hierarchy of inputs.&lt;/p&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · IFRS 13&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 36 – Impairment of Assets&lt;/h4&gt;&lt;p&gt;The Standard that uses value in use (6.17) and the impairment that is the exception to historical cost (6.4). The recoverable amount is the higher of fair value less costs of disposal and value in use.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 36&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IFRS 18 – Presentation and Disclosure in Financial Statements&lt;/h4&gt;&lt;p&gt;Replaces IAS 1 for annual periods beginning on or after 1 January 2027. It puts into practice the principles of Chapter 7 (classification, aggregation, subtotals in the statement of profit or loss). The status of EU endorsement should be checked.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;IAS 29 – Financial Reporting in Hyperinflationary Economies&lt;/h4&gt;&lt;p&gt;The exceptional case in para. 8.9 in which the Board prescribes a model: entities whose functional currency is that of a hyperinflationary economy restate their financial statements.&lt;/p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 29&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;fs&quot;&gt;Other course materials: it was not possible to list the contents of the &lt;i&gt;corso/&lt;/i&gt; folder, so this summary is based solely on the file &lt;i&gt;01b - Conceptual Framework IAS-IFRS.pdf&lt;/i&gt;. The name “01b” suggests a preceding lecture 01a to be read together with this one.&lt;/p&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;
