  &lt;h1&gt;The IASB &lt;em&gt;Conceptual Framework&lt;/em&gt;&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;The conceptual framework is the set of concepts that underpins all IAS/IFRS: who financial statements are for, what makes information useful, what an asset or a liability is, when and how an item is recognised and measured, and what “maintaining capital” means.&lt;/p&gt;
  &lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Prof. Roberto Aprile · University of Bergamo&lt;/span&gt;&lt;span&gt;Master Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;Academic year 2026-2027&lt;/span&gt;&lt;span&gt;Source: &lt;i&gt;01b - Conceptual Framework IAS-IFRS.pdf&lt;/i&gt; (104 slides)&lt;/span&gt;&lt;/div&gt;
 &lt;/div&gt;
&lt;/header&gt;

  &lt;p&gt;The eight chapters of the Framework are not a mere list: each builds on the ones before it. The &lt;b&gt;objective&lt;/b&gt; (Ch. 1) states whom the information serves; the &lt;b&gt;qualitative characteristics&lt;/b&gt; (Ch. 2) state when it is useful; the &lt;b&gt;definitions of the elements&lt;/b&gt; (Ch. 4) state what may appear in the financial statements; &lt;b&gt;recognition&lt;/b&gt;, &lt;b&gt;measurement&lt;/b&gt; and &lt;b&gt;presentation&lt;/b&gt; state whether, at what amount and how. Click a box to jump to the section.&lt;/p&gt;

   &lt;g class=&quot;node mattone&quot; data-go=&quot;s7&quot; tabindex=&quot;0&quot; role=&quot;link&quot; aria-label=&quot;Chapter 7&quot;&gt;&lt;rect x=&quot;650&quot; y=&quot;414&quot; width=&quot;250&quot; height=&quot;54&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;ch&quot; x=&quot;775&quot; y=&quot;436&quot;&gt;CH. 7&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;455&quot;&gt;Presentation &amp;amp; disclosure&lt;/text&gt;&lt;/g&gt;
   &lt;g class=&quot;node mattone&quot; data-go=&quot;s8&quot; tabindex=&quot;0&quot; role=&quot;link&quot; aria-label=&quot;Chapter 8&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;496&quot; width=&quot;300&quot; height=&quot;54&quot; rx=&quot;12&quot;/&gt;&lt;text class=&quot;ch&quot; x=&quot;480&quot; y=&quot;518&quot;&gt;CH. 8&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;537&quot;&gt;Capital &amp;amp; capital maintenance&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dashed line: the two fundamental qualitative characteristics of Ch. 2 return as recognition criteria in Ch. 5. Colours: slate = overview and processes, sage = quality of information, ochre = content of the financial statements, brick = communication and capital.&lt;/figcaption&gt;
  &lt;/figure&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S0 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s0&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;0&lt;/span&gt;&lt;h2&gt;The overview: status, history and purpose&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 2–14 · References in square brackets ([SP1.1], [2.12]…) are paragraphs of the Framework; “SP” is the introductory section &lt;i&gt;Status and Purpose&lt;/i&gt;.&lt;/p&gt;

  &lt;h3&gt;What it is for&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;Conceptual Framework for Financial Reporting&lt;/span&gt; is the document that sets out the basic concepts of financial reporting under IAS/IFRS. It has three audiences &lt;span class=&quot;ref&quot;&gt;SP1.1&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;The IASB (the Board)&lt;/h4&gt;To develop &lt;b&gt;IFRS Standards&lt;/b&gt; that are consistent with one another and based on the same concepts.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;&lt;i&gt;Preparers&lt;/i&gt;&lt;/h4&gt;Those who prepare financial statements, to develop consistent &lt;b&gt;accounting policies&lt;/b&gt; when no Standard applies to a transaction, or when a Standard allows a choice.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Everyone else&lt;/h4&gt;Auditors, analysts, regulators: to &lt;b&gt;understand and interpret&lt;/b&gt; the Standards.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Caution.&lt;/b&gt; The Conceptual Framework &lt;b&gt;is not a Standard&lt;/b&gt;. Nothing in it overrides any Standard or any requirement in a Standard &lt;span class=&quot;ref&quot;&gt;SP1.2&lt;/span&gt;. If the Framework and an IFRS say different things, the IFRS prevails.&lt;/div&gt;

  &lt;h3&gt;Three versions in thirty years&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Timeline 1989, 2010, 2018&quot;&gt;
   &lt;line x1=&quot;40&quot; y1=&quot;80&quot; x2=&quot;860&quot; y2=&quot;80&quot; stroke=&quot;currentColor&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
   &lt;g&gt;&lt;circle cx=&quot;110&quot; cy=&quot;80&quot; r=&quot;11&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;1989&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;“Framework”&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;issued by the IASC&lt;/text&gt;&lt;/g&gt;
   &lt;g&gt;&lt;circle cx=&quot;450&quot; cy=&quot;80&quot; r=&quot;11&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;2010&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;partial revision&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;new Chs. 1 and 3; “substance over form” and “prudence” removed&lt;/text&gt;&lt;/g&gt;
   &lt;g&gt;&lt;circle cx=&quot;790&quot; cy=&quot;80&quot; r=&quot;13&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; style=&quot;font-family:var(--serif)&quot;&gt;2018&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Conceptual Framework&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;approved in March, 8 chapters&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;From slides 3 and 26–27. That the 1989 text was issued by the IASC, the predecessor body of the IASB, and that in 2010 only Chapters 1 and 3 were rewritten, comes from an &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2018/03/cf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;The 2018 Framework is designed to work with &lt;b&gt;different accounting models&lt;/b&gt; and with &lt;b&gt;different concepts of capital and capital maintenance&lt;/b&gt; (slide 3). This point will come back in Chapter 8.&lt;/p&gt;

  &lt;h3&gt;The structure of the 2018 Framework&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
    &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1–2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3–4&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;5–6&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;7–8&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;b&gt;Ch. 1 – The Objective of General Purpose Financial Reporting&lt;/b&gt;: objective, usefulness and limitations; economic resources and &lt;i&gt;claims&lt;/i&gt; against the entity; performance reflected by accrual accounting and by cash flows.&lt;br&gt;&lt;b&gt;Ch. 2 – Qualitative characteristics&lt;/b&gt;: &lt;i&gt;fundamental&lt;/i&gt; (relevance, materiality, faithful representation), &lt;i&gt;enhancing&lt;/i&gt; (comparability, verifiability, timeliness, understandability), &lt;i&gt;cost constraint&lt;/i&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Ch. 3 – Financial statements and the reporting entity&lt;/b&gt;: objective and scope of financial statements, reporting period, perspective, &lt;i&gt;going concern&lt;/i&gt;, the reporting entity, consolidated and unconsolidated financial statements.&lt;br&gt;&lt;b&gt;Ch. 4 – The elements&lt;/b&gt;: asset (right, potential, control), liability (obligation, transfer, present obligation), unit of account, executory contracts, substance of contractual rights, equity, income and expenses.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Ch. 5 – Recognition and derecognition&lt;/b&gt;: the recognition process, criteria (relevance: existence uncertainty, low probability; faithful representation: measurement uncertainty, other factors), derecognition.&lt;br&gt;&lt;b&gt;Ch. 6 – Measurement&lt;/b&gt;: historical cost, current value (fair value, value in use / fulfilment value, current cost), information provided by each basis, factors in selecting a basis, measurement of equity, cash-flow-based techniques.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Ch. 7 – Presentation and disclosure&lt;/b&gt;: communication tools, objectives and principles, classification (offsetting, equity, profit or loss vs OCI), aggregation.&lt;br&gt;&lt;b&gt;Ch. 8 – Concepts of capital and capital maintenance&lt;/b&gt;: concepts of capital, capital maintenance and the determination of profit, capital maintenance adjustments.&lt;br&gt;&lt;b&gt;Appendix – Defined terms&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Why it matters: the stated purpose &lt;span class=&quot;ref&quot;&gt;SP1.5&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Transparency&lt;/h4&gt;Greater international comparability and higher-quality information: investors make decisions knowing what they are doing.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Accountability&lt;/h4&gt;Reduces the &lt;b&gt;information gap&lt;/b&gt; between the providers of capital and those who manage it, i.e. management. It also serves supervisory authorities.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Economic efficiency&lt;/h4&gt;Helps identify opportunities and risks worldwide and therefore improves capital allocation. A single accounting language lowers the cost of capital and reporting costs.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The thread linking the three points is &lt;span class=&quot;t&quot;&gt;stewardship&lt;/span&gt;: the way management discharges its responsibility for the resources entrusted to it. Users of financial statements need information to assess it (slide 14).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;A Standard and the Conceptual Framework conflict. Which one applies?&lt;/summary&gt;&lt;div&gt;The Standard. The Framework is not a Standard and does not override any of its requirements [SP1.2]. It serves mainly the IASB when developing new requirements, and preparers when no Standard covers the case.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In which two situations does a &lt;i&gt;preparer&lt;/i&gt; use the Framework directly?&lt;/summary&gt;&lt;div&gt;When no Standard applies to a particular transaction or event, and when a Standard allows a choice among accounting policies [SP1.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is &lt;i&gt;stewardship&lt;/i&gt;, and why does it already appear in the purpose of the Framework?&lt;/summary&gt;&lt;div&gt;It is management&#x27;s administration of the entity&#x27;s resources. Since capital providers entrust their money to others, the financial statements must allow them to assess how it has been managed (accountability).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S1 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s1&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;The objective of general purpose financial reporting&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 15–17 · Framework, Chapter 1&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;General purpose financial reporting&lt;/span&gt; is financial reporting that is not tailored to a single recipient but prepared for a broad range of users, who usually cannot require the entity to provide reports tailored to their needs.&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;The objective is &lt;b&gt;to provide financial information about the reporting entity that is useful to existing and potential investors, lenders and other creditors&lt;/b&gt; in making decisions relating to providing resources to the entity &lt;span class=&quot;ref&quot;&gt;1.2&lt;/span&gt;.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;From information to the decisions of primary users&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;110&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
   &lt;text x=&quot;115&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Financial report&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;of the reporting entity&lt;/text&gt;
   &lt;path d=&quot;M210 150 H300&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;300&quot; y=&quot;60&quot; width=&quot;260&quot; height=&quot;180&quot; rx=&quot;12&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
   &lt;text x=&quot;430&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Users assess [1.3]&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;120&quot; font-size=&quot;13&quot;&gt;• the &lt;tspan font-weight=&quot;600&quot;&gt;amount&lt;/tspan&gt;&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;144&quot; font-size=&quot;13&quot;&gt;• the &lt;tspan font-weight=&quot;600&quot;&gt;timing&lt;/tspan&gt;&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;168&quot; font-size=&quot;13&quot;&gt;• the &lt;tspan font-weight=&quot;600&quot;&gt;uncertainty&lt;/tspan&gt;&lt;/text&gt;
   &lt;text x=&quot;336&quot; y=&quot;190&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;of future net cash inflows&lt;/text&gt;
   &lt;text x=&quot;320&quot; y=&quot;220&quot; font-size=&quot;13&quot;&gt;• management&#x27;s &lt;tspan font-weight=&quot;600&quot;&gt;stewardship&lt;/tspan&gt;&lt;/text&gt;
   &lt;path d=&quot;M560 150 H640&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;640&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;a) buy / sell / hold&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;equity and debt instruments&lt;/text&gt;
   &lt;rect x=&quot;640&quot; y=&quot;115&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;b) provide or settle&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;loans and other forms of credit&lt;/text&gt;
   &lt;rect x=&quot;640&quot; y=&quot;210&quot; width=&quot;240&quot; height=&quot;70&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;c) vote on or influence&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;management&#x27;s actions&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The &lt;i&gt;primary users&lt;/i&gt; and the three types of decision [1.2–1.3].&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;p&gt;Those who invest or lend money expect a return: dividends, interest, repayment of principal, increases in the market price of securities. That return depends on the entity&#x27;s ability to &lt;b&gt;generate cash in the future&lt;/b&gt; and on how management uses its resources. Financial statements do not make forecasts on the user&#x27;s behalf: they provide the inputs for making them.&lt;/p&gt;

  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The Framework&#x27;s working theory&lt;/h4&gt;The &lt;b&gt;information needs of investors&lt;/b&gt; prevail (slide 17). The Framework does not try to satisfy everyone: it chooses a reference user.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Consequence&lt;/h4&gt;The model is centred on &lt;b&gt;expected cash flows&lt;/b&gt; and on the entity&#x27;s &lt;b&gt;financial position&lt;/b&gt;. Hence the emphasis on fair value, economic substance and control of resources, which we will meet again in Chapters 2, 4 and 6.&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;What do the slides mean by “accrual accounting” and “past cash flows” (1.17–1.20)?&lt;/summary&gt;&lt;div&gt;They are two lenses on performance. &lt;i&gt;Accrual accounting&lt;/i&gt; depicts the effects of transactions in the periods in which they occur, even if the resulting cash receipts and payments occur in a different period: for the Framework it is the better basis for assessing performance. Past cash flows complement it, because they show how the entity obtains and spends cash (statement of cash flows). The slides cite these paragraphs only in the table of contents: the explanation here is a supplement.&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Who are the &lt;i&gt;primary users&lt;/i&gt; of general purpose financial reporting?&lt;/summary&gt;&lt;div&gt;Existing and potential investors, lenders and other creditors: those who provide, or could provide, resources to the entity [1.2].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which three characteristics of future cash flows do users want to estimate?&lt;/summary&gt;&lt;div&gt;The amount, timing and uncertainty of future net cash inflows [1.3]. In addition, they want to assess management&#x27;s stewardship.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the primacy of investors steer the whole model towards cash flows?&lt;/summary&gt;&lt;div&gt;Because the investor&#x27;s return depends on the cash the entity will generate. Information is therefore judged by how far it helps predict those flows and assess the financial position (slide 17).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section class=&quot;part salvia&quot; id=&quot;s2&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Qualitative characteristics of useful financial information&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 18–50 · Framework, Chapter 2&lt;/p&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;qualitative characteristics&lt;/span&gt; are the properties that make financial information &lt;b&gt;useful&lt;/b&gt;. They apply to information in the financial statements and to information provided in other ways; &lt;b&gt;cost&lt;/b&gt; is the constraint that runs across all of them &lt;span class=&quot;ref&quot;&gt;2.3&lt;/span&gt;.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 330&quot; role=&quot;img&quot; aria-label=&quot;Hierarchy of the qualitative characteristics&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;10&quot; width=&quot;860&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--acc);opacity:.14&quot;/&gt;
   &lt;text x=&quot;450&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;COST CONSTRAINT: benefits must justify costs [2.39]&lt;/text&gt;
   &lt;text x=&quot;450&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot; letter-spacing=&quot;2&quot;&gt;FUNDAMENTAL (necessary)&lt;/text&gt;
   &lt;rect x=&quot;110&quot; y=&quot;92&quot; width=&quot;320&quot; height=&quot;104&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-width=&quot;1.6&quot;/&gt;
   &lt;text x=&quot;270&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Relevance&lt;/text&gt;
   &lt;text x=&quot;270&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;predictive value · confirmatory value&lt;/text&gt;
   &lt;text x=&quot;270&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;materiality: entity-specific aspect&lt;/text&gt;
   &lt;rect x=&quot;470&quot; y=&quot;92&quot; width=&quot;320&quot; height=&quot;104&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-width=&quot;1.6&quot;/&gt;
   &lt;text x=&quot;630&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot;&gt;Faithful representation&lt;/text&gt;
   &lt;text x=&quot;630&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;complete · neutral · free from error&lt;/text&gt;
   &lt;text x=&quot;630&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot;&gt;substance over form&lt;/text&gt;
   &lt;text x=&quot;450&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot; letter-spacing=&quot;2&quot;&gt;ENHANCING (improve, but cannot rescue)&lt;/text&gt;
   &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
    &lt;rect x=&quot;60&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;274&quot;&gt;Comparability&lt;/text&gt;
    &lt;rect x=&quot;260&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;274&quot;&gt;Verifiability&lt;/text&gt;
    &lt;rect x=&quot;460&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;274&quot;&gt;Timeliness&lt;/text&gt;
    &lt;rect x=&quot;660&quot; y=&quot;246&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;23&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;274&quot;&gt;Understandability&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;450&quot; y=&quot;318&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;Enhancing characteristics cannot make irrelevant or unfaithful information useful (slide 18)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Reconstruction of the diagram on slide 18.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Relevance&lt;/h3&gt;
  &lt;p&gt;Information is &lt;span class=&quot;t&quot;&gt;relevant&lt;/span&gt; if it &lt;b&gt;is capable of making a difference&lt;/b&gt; to users&#x27; decisions. This holds even if some users choose not to use it or are already aware of it from other sources &lt;span class=&quot;ref&quot;&gt;2.6&lt;/span&gt;. It is capable of making a difference if it has &lt;span class=&quot;ref&quot;&gt;2.7&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Predictive value&lt;/h4&gt;It can be used as an &lt;i&gt;input&lt;/i&gt; to the processes users employ to predict future outcomes. It need not itself be a prediction or forecast &lt;span class=&quot;ref&quot;&gt;2.8&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Confirmatory value&lt;/h4&gt;It provides &lt;i&gt;feedback&lt;/i&gt;: it confirms or changes previous evaluations &lt;span class=&quot;ref&quot;&gt;2.9&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;Both&lt;/h4&gt;The two are often interrelated. Current-year revenue can be used to predict future revenue and, compared with past predictions, to improve the forecasting process &lt;span class=&quot;ref&quot;&gt;2.10&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Materiality&lt;/h4&gt;
  &lt;div class=&quot;def quote&quot;&gt;Information is &lt;b&gt;material&lt;/b&gt; if omitting, misstating or obscuring it could reasonably be expected to influence the decisions of the primary users. Materiality is an &lt;b&gt;entity-specific aspect of relevance&lt;/b&gt;, based on the &lt;b&gt;nature&lt;/b&gt; or &lt;b&gt;magnitude&lt;/b&gt;, or both, of the items in the context of that individual entity&#x27;s financial report. For this reason the Board &lt;b&gt;cannot specify a uniform quantitative threshold&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;2.11&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-mat&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · illustrative model&lt;/div&gt;
   &lt;h4&gt;Nature or magnitude?&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mag&quot;&gt;Size of the item relative to a benchmark measure of the entity&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;mag&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;magO&quot;&gt;1%&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;nat&quot; aria-pressed=&quot;false&quot;&gt;The item is sensitive by nature (e.g. related-party transaction, breach of law)&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;matV&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;fs&quot;&gt;The slider bands are invented for this exercise: the IASB sets no thresholds [2.11]. Its only purpose is to show that &lt;b&gt;nature can make even a small amount material&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Faithful representation&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Faithful representation&lt;/span&gt; requires information to represent &lt;b&gt;the substance of the phenomenon&lt;/b&gt; it purports to depict. Readers must not be misled: an item appears among the &lt;i&gt;assets&lt;/i&gt; only if it meets the definition of an asset (slide 25).&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Complete&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Neutral&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Free from error&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Measurement uncertainty&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;b&gt;Completeness.&lt;/b&gt; The depiction must include all the information needed to understand the phenomenon, including descriptions and explanations. For a group of assets this means at least: the nature of the items, their numerical amount and what that amount represents (historical cost or fair value?) &lt;span class=&quot;ref&quot;&gt;2.14&lt;/span&gt;. Completeness has two limits: materiality and cost. Significant omissions make the financial statements misleading (slide 32).&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Neutrality.&lt;/b&gt; No &lt;i&gt;bias&lt;/i&gt; in the selection or presentation: information is not slanted, weighted, emphasised, de-emphasised or otherwise manipulated to make it more likely to be received favourably or unfavourably. Neutral does not mean without effect: relevant information, by definition, is capable of making a difference to decisions &lt;span class=&quot;ref&quot;&gt;2.15&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Free from error.&lt;/b&gt; This does not mean perfectly accurate in all respects. It means there are no errors or omissions in the description and that the process used to produce the estimate has been selected and applied without errors. The estimate of an unobservable price is neither “accurate” nor “inaccurate”, but its representation is faithful if it is clearly described as an estimate, its nature and limitations are explained and the process is sound &lt;span class=&quot;ref&quot;&gt;2.18&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Measurement uncertainty&lt;/b&gt; arises when a monetary amount must be estimated because it cannot be observed directly. Reasonable estimates are an essential part of financial reporting and, if clearly described, do not undermine its usefulness, even when the level of uncertainty is high &lt;span class=&quot;ref&quot;&gt;2.19&lt;/span&gt;. Sometimes, however, the most useful information is &lt;b&gt;slightly less relevant but subject to much lower uncertainty&lt;/b&gt; (slide 36). Try the tool below.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-trade&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · illustrative model&lt;/div&gt;
   &lt;h4&gt;Relevance versus measurement uncertainty&lt;/h4&gt;
   &lt;p class=&quot;fs&quot;&gt;Measure A: the most relevant (100) but estimated. Measure B: less relevant (70) but with uncertainty fixed at 10%. Usefulness ≈ relevance × (1 − uncertainty). This is a teaching simplification, not a formula from the Framework.&lt;/p&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;unc&quot;&gt;Uncertainty of measure A&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;unc&quot; min=&quot;0&quot; max=&quot;80&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;uncO&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 120&quot; id=&quot;tradeSvg&quot; aria-label=&quot;Usefulness comparison&quot;&gt;
    &lt;text x=&quot;0&quot; y=&quot;34&quot; font-size=&quot;14&quot;&gt;A · more relevant&lt;/text&gt;&lt;rect id=&quot;barA&quot; x=&quot;150&quot; y=&quot;18&quot; height=&quot;24&quot; rx=&quot;5&quot; style=&quot;fill:var(--deep)&quot;/&gt;&lt;text id=&quot;tA&quot; y=&quot;35&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
    &lt;text x=&quot;0&quot; y=&quot;84&quot; font-size=&quot;14&quot;&gt;B · less uncertain&lt;/text&gt;&lt;rect id=&quot;barB&quot; x=&quot;150&quot; y=&quot;68&quot; height=&quot;24&quot; rx=&quot;5&quot; style=&quot;fill:var(--mid)&quot;/&gt;&lt;text id=&quot;tB&quot; y=&quot;85&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;&lt;/text&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;verdict&quot; id=&quot;tradeV&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Substance over form&lt;/h4&gt;
  &lt;p&gt;When the &lt;b&gt;economic substance&lt;/b&gt; of a phenomenon differs from its &lt;b&gt;legal form&lt;/b&gt;, representing only the legal form would not be faithful &lt;span class=&quot;ref&quot;&gt;2.12&lt;/span&gt;. All the terms of a contract count, whether explicit or implicit, except those that have no substance, i.e. no discernible effect on the economics of the contract. A group of contracts designed to achieve a single overall commercial effect may be treated as &lt;b&gt;a single unit of account&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.60–4.62&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;band&quot;&gt;&lt;b&gt;A piece of history (slides 26–27).&lt;/b&gt; In 2010 the principle of &lt;i&gt;substance over form&lt;/i&gt; no longer appeared as a separate component, because the Board considered it already implied by faithful representation. Some read the deletion as a step backwards, so in 2018 the Board &lt;b&gt;reinstated an explicit reference&lt;/b&gt; to substance in para. 2.12 &lt;span class=&quot;ref&quot;&gt;BC2.32–2.33&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-lease&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Example from the slides (slide 29)&lt;/div&gt;
   &lt;h4&gt;Leasing a machine for its entire useful life&lt;/h4&gt;
   &lt;p&gt;The entity undertakes to pay lease instalments to use a machine for its entire expected economic life. In substance, this is equivalent to borrowing money and buying the machine.&lt;/p&gt;
   &lt;div class=&quot;btns&quot; role=&quot;group&quot;&gt;&lt;button class=&quot;btn&quot; data-lease=&quot;form&quot; aria-pressed=&quot;true&quot;&gt;Legal form&lt;/button&gt;&lt;button class=&quot;btn&quot; data-lease=&quot;sub&quot; aria-pressed=&quot;false&quot;&gt;Economic substance&lt;/button&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 190&quot; aria-label=&quot;Statement of financial position under form and substance&quot;&gt;
    &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;520&quot; height=&quot;30&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Statement of financial position&lt;/text&gt;
    &lt;line x1=&quot;300&quot; y1=&quot;40&quot; x2=&quot;300&quot; y2=&quot;180&quot; style=&quot;stroke:var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;170&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;ASSETS&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;LIABILITIES&lt;/text&gt;
    &lt;g id=&quot;leaseForm&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;no machine&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;no liability&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--acc)&quot;&gt;only lease payments in profit or loss, year by year&lt;/text&gt;&lt;/g&gt;
    &lt;g id=&quot;leaseSub&quot; style=&quot;display:none&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;80&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--mid);opacity:.5&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Machine&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;controlled resource&lt;/text&gt;&lt;rect x=&quot;330&quot; y=&quot;80&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--acc);opacity:.25&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Lease liability&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;obligation to pay&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--deep)&quot;&gt;an asset and a liability&lt;/text&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;p class=&quot;ext-note&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;This is the logic that &lt;b&gt;IFRS 16 Leases&lt;/b&gt; applies to all of a lessee&#x27;s leases: the lessee recognises a &lt;i&gt;right-of-use asset&lt;/i&gt; and a &lt;i&gt;lease liability&lt;/i&gt; (&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;). The slides do not mention IFRS 16.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;According to the slides (30), substance over form is &lt;b&gt;pervasive&lt;/b&gt; in IAS/IFRS: it points towards &lt;b&gt;probable future cash flows&lt;/b&gt; and towards economic availability understood as &lt;b&gt;control of the resource&lt;/b&gt;, whereas earlier the focus was on &lt;i&gt;risks and rewards&lt;/i&gt;. Cash flows derive from that availability: by representing it in economic terms, expected cash flows can be estimated more reliably.&lt;/p&gt;

  &lt;h3&gt;Enhancing characteristics&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;enhancing characteristics&lt;/span&gt; increase the usefulness of information that is already relevant and faithfully represented, but &lt;b&gt;cannot make useful information that is not&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Comparability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Verifiability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Timeliness&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Understandability&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Comparability&lt;/b&gt; enables users to identify similarities and differences among items. It is the only characteristic that does not relate to a single item &lt;span class=&quot;ref&quot;&gt;2.25&lt;/span&gt;. Comparisons are made &lt;b&gt;over time&lt;/b&gt; (the same entity in different years, for trend analysis) and &lt;b&gt;across entities&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Consistency ≠ comparability&lt;/b&gt;: comparability is the goal, consistency (the same methods over time) is the means of achieving it &lt;span class=&quot;ref&quot;&gt;2.26&lt;/span&gt;. Two corollaries follow: consistent policies and &lt;b&gt;disclosure of changes in accounting policies&lt;/b&gt;, including their effects on prior periods (see &lt;b&gt;IAS 8&lt;/b&gt;). Amendments to Standards made by the IASB should not impair comparability (slide 39).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Verifiability&lt;/b&gt;: different knowledgeable and independent observers could reach consensus, although not necessarily complete agreement, that a depiction is a faithful representation. A range of possible amounts and the related probabilities can also be verified, not just a single point estimate &lt;span class=&quot;ref&quot;&gt;2.30&lt;/span&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Direct&lt;/b&gt;: through direct observation, for example &lt;i&gt;counting cash&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Indirect&lt;/b&gt;: checking the inputs to a model and recalculating the outputs using the same methodology, for example recalculating the carrying amount of inventory from quantities and costs using FIFO (first-in, first-out) &lt;span class=&quot;ref&quot;&gt;2.31&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Forward-looking information may not be verifiable until a future period, if at all: the underlying assumptions, methods and circumstances must then be disclosed &lt;span class=&quot;ref&quot;&gt;2.32&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Timeliness&lt;/b&gt;: information is available to decision-makers in time to influence their decisions. Generally, the older the information, the less useful it is, but some information remains useful for a long time, for example for trend analysis &lt;span class=&quot;ref&quot;&gt;2.33&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;There is a &lt;i&gt;trade-off&lt;/i&gt; between &lt;b&gt;availability and reliability&lt;/b&gt;: accurate but late information may be useless, while timely but poorly prepared information may be unreliable. This is why regulators set filing deadlines and require reporting several times a year (slides 43–44).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Understandability&lt;/b&gt;: classifying, characterising and presenting information clearly and concisely &lt;span class=&quot;ref&quot;&gt;2.34&lt;/span&gt;. It concerns the layout of the statements and the quality of the notes.&lt;/p&gt;&lt;p&gt;The reference user has &lt;b&gt;reasonable knowledge&lt;/b&gt; of business activities and reviews information diligently. At times even such users may need the help of an adviser &lt;span class=&quot;ref&quot;&gt;2.36&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;warn&quot; style=&quot;margin:8px 0&quot;&gt;&lt;b&gt;Never omit something because it is complex.&lt;/b&gt; Excluding a complex phenomenon from the financial statements would make them easier to read, but incomplete and therefore potentially misleading &lt;span class=&quot;ref&quot;&gt;2.35&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Prudence or conservatism&lt;/h4&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Prudence&lt;/span&gt; (or &lt;i&gt;conservatism&lt;/i&gt;) is the best-known &lt;i&gt;bias&lt;/i&gt; in accounting: understating assets and income and overstating liabilities and expenses to protect creditors from directors&#x27; optimism. The slides present it as “&lt;b&gt;now deleted from the Framework&lt;/b&gt;” (slide 47).&lt;/p&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Difference from the Italian Civil Code.&lt;/b&gt; In the Italian accounting tradition and in the Civil Code, prudence is a cornerstone principle for preparing financial statements, with an &lt;b&gt;asymmetric valuation&lt;/b&gt;: losses are recognised even if merely probable, gains only once realised. In the IASB Framework, prudence &lt;b&gt;is not a principle of financial statements&lt;/b&gt;: at most it appears among the qualitative characteristics of information, as a sub-point of reliability (now faithful representation), &lt;b&gt;without asymmetric valuation&lt;/b&gt; (slide 47).&lt;/div&gt;
  &lt;div class=&quot;def ext&quot;&gt;In the 2018 Framework prudence reappeared in para. 2.16, as &lt;b&gt;the exercise of caution when making judgements under conditions of uncertainty&lt;/b&gt; in support of neutrality, and not as a licence for systematic understatement (&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2018/october/wss/wss4-conceptual-framework-overview.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, 2018 overview&lt;/a&gt;). In Italy, prudence is set out in &lt;b&gt;art. 2423-bis of the Civil Code&lt;/b&gt; (&lt;a href=&quot;https://www.filodiritto.com/codici/codice-civile/capo-v-societa-azioni/art-2423-bis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text&lt;/a&gt;). Compare with the course material: “now deleted” describes the position after 2010.&lt;/div&gt;

  &lt;h3&gt;The cost constraint&lt;/h3&gt;
  &lt;div class=&quot;band&quot;&gt;&lt;b&gt;General rule:&lt;/b&gt; the cost of information must be justified by the benefits to users, assessed type by type (slide 48).&lt;/div&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;Preparers bear most of the effort: collecting, processing, verifying and disseminating data. Ultimately, however, the costs fall on users in the form of lower returns. Users also bear the cost of analysis and, if information is missing, the cost of obtaining it elsewhere or estimating it &lt;span class=&quot;ref&quot;&gt;2.39–2.40&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Benefits&lt;/h4&gt;Decisions made with greater confidence, more efficient capital markets, a &lt;b&gt;lower cost of capital&lt;/b&gt; for the economy as a whole. But no financial report can provide every user with all the information they find relevant &lt;span class=&quot;ref&quot;&gt;2.41&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Because the assessment of costs and benefits is subjective, the Board makes it for &lt;b&gt;financial reporting generally&lt;/b&gt;, not for individual reporting entities &lt;span class=&quot;ref&quot;&gt;2.42–2.43&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Why does the Board not set a percentage threshold for materiality?&lt;/summary&gt;&lt;div&gt;Because materiality is an entity-specific aspect of relevance: it depends on the nature and magnitude of the item in the context of that specific entity&#x27;s financial report [2.11].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Is a highly uncertain estimate necessarily useless?&lt;/summary&gt;&lt;div&gt;No. If it is reasonable and clearly described, it can remain useful even with high uncertainty [2.19]. Sometimes, however, slightly less relevant but much less uncertain information is preferable (slide 36).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Are consistency and comparability the same thing?&lt;/summary&gt;&lt;div&gt;No. Comparability is the goal; consistency of methods over time and across entities is a means of achieving it [2.26].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Give an example of indirect verification.&lt;/summary&gt;&lt;div&gt;Recalculating the carrying amount of inventory from its inputs (quantities and costs) using the same cost flow assumption, for example FIFO [2.31].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the IASB Framework treat prudence differently from the Italian Civil Code?&lt;/summary&gt;&lt;div&gt;Because asymmetric prudence introduces bias and conflicts with neutrality. In the Framework it is not a principle of financial statements and does not allow asymmetric valuation (slide 47).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s3&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Financial statements and the reporting entity&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 51–56 · Framework, Chapter 3&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;The objective of &lt;b&gt;financial statements&lt;/b&gt; is to provide information about the entity&#x27;s &lt;b&gt;assets, liabilities, equity, income and expenses&lt;/b&gt; that is useful in assessing the prospects for future net cash inflows and management&#x27;s stewardship &lt;span class=&quot;ref&quot;&gt;3.2&lt;/span&gt;.&lt;/div&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Where the elements are found&quot;&gt;
   &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Statement of financial position&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(balance sheet)&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;104&quot;&gt;assets · liabilities · equity&lt;/text&gt;
   &lt;rect x=&quot;315&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Statement(s) of financial performance&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(profit or loss and OCI)&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;104&quot;&gt;income · expenses&lt;/text&gt;
   &lt;rect x=&quot;610&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;110&quot; rx=&quot;12&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;&lt;text x=&quot;745&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Other statements &amp;amp; notes&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;76&quot; font-size=&quot;12&quot;&gt;(statement of cash flows, statement&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;94&quot; font-size=&quot;12&quot;&gt;of changes in equity, notes)&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;118&quot;&gt;details, risks, estimates&lt;/text&gt;
   &lt;/g&gt;
   &lt;text x=&quot;450&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;Items are recognised in the first two; the rest is disclosure [3.3]&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reporting period&lt;/h4&gt;Financial statements cover a &lt;b&gt;specified period&lt;/b&gt;. They provide information about assets, liabilities and equity, including &lt;i&gt;unrecognised&lt;/i&gt; ones, that existed at the end of or during the period, and about income and expenses for the period &lt;span class=&quot;ref&quot;&gt;3.4&lt;/span&gt;. They include comparative information for &lt;b&gt;at least one preceding period&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.5&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward-looking information&lt;/h4&gt;Information about possible future transactions or events is included only if it relates to elements of the period, recognised or not, &lt;b&gt;and&lt;/b&gt; is useful to users &lt;span class=&quot;ref&quot;&gt;3.6&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perspective&lt;/h4&gt;Financial statements view transactions from the perspective of &lt;b&gt;the entity as a whole&lt;/b&gt;, not from that of any particular group of investors or creditors &lt;span class=&quot;ref&quot;&gt;3.8&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Going concern assumption&lt;/h4&gt;Financial statements are normally prepared on the assumption that the entity &lt;b&gt;will continue in operation for the foreseeable future&lt;/b&gt;, with neither the intention nor the need to enter liquidation or cease trading. If such an intention or need exists, a different basis may have to be used, and it must be described &lt;span class=&quot;ref&quot;&gt;3.9&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3&gt;The reporting entity&lt;/h3&gt;
  &lt;p&gt;A &lt;span class=&quot;t&quot;&gt;reporting entity&lt;/span&gt; is an entity that &lt;b&gt;is required, or chooses, to prepare&lt;/b&gt; financial statements. It can be a single entity, a portion of an entity or more than one entity, and &lt;b&gt;is not necessarily a legal entity&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.10&lt;/span&gt;. If it is not a legal entity and does not consist solely of entities linked by a parent-subsidiary relationship, its boundary is determined by the &lt;b&gt;information needs of the primary users&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;3.13–3.14&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 210&quot; role=&quot;img&quot; aria-label=&quot;Consolidated and unconsolidated financial statements&quot;&gt;
   &lt;rect x=&quot;30&quot; y=&quot;20&quot; width=&quot;400&quot; height=&quot;170&quot; rx=&quot;16&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot; stroke-dasharray=&quot;6 4&quot;/&gt;
   &lt;text x=&quot;230&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Consolidated: parent + subsidiaries&lt;/text&gt;
   &lt;rect x=&quot;170&quot; y=&quot;62&quot; width=&quot;120&quot; height=&quot;44&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Parent&lt;/text&gt;
   &lt;rect x=&quot;70&quot; y=&quot;134&quot; width=&quot;110&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;159&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Sub A&lt;/text&gt;
   &lt;rect x=&quot;280&quot; y=&quot;134&quot; width=&quot;110&quot; height=&quot;40&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--mid)&quot;/&gt;&lt;text x=&quot;335&quot; y=&quot;159&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Sub B&lt;/text&gt;
   &lt;path d=&quot;M210 106 L135 134 M250 106 L325 134&quot; style=&quot;stroke:var(--muted)&quot; stroke-width=&quot;1.5&quot;/&gt;
   &lt;rect x=&quot;500&quot; y=&quot;62&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;585&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Parent alone&lt;/text&gt;
   &lt;text x=&quot;585&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Unconsolidated&lt;/text&gt;
   &lt;text x=&quot;690&quot; y=&quot;140&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;not sufficient for the parent&#x27;s&lt;/text&gt;&lt;text x=&quot;690&quot; y=&quot;156&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;creditors and investors:&lt;/text&gt;&lt;text x=&quot;690&quot; y=&quot;172&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;no substitute for consolidation&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Slide 56 [3.18]: if consolidated financial statements are required, unconsolidated statements cannot replace them, but the parent may prepare them in addition.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Must a reporting entity be a company with legal personality?&lt;/summary&gt;&lt;div&gt;No: it can be a portion of an entity or several entities together. It is not necessarily a legal entity [3.10].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What happens to the financial statements if the entity has to go into liquidation?&lt;/summary&gt;&lt;div&gt;The going concern assumption no longer holds: the financial statements may have to be prepared on a different basis, which must be described [3.9].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Under what conditions is forward-looking information included in the financial statements?&lt;/summary&gt;&lt;div&gt;If it relates to elements (recognised or not) that existed at the end of or during the period, or to income and expenses for the period, and if it is useful to users [3.6].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s4&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;The elements of financial statements&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 57–73 · Framework, Chapter 4&lt;/p&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;elements&lt;/span&gt; are the five basic categories of financial statements. &lt;b&gt;Assets, liabilities and equity&lt;/b&gt; describe the &lt;i&gt;financial position&lt;/i&gt;; &lt;b&gt;income and expenses&lt;/b&gt; describe &lt;i&gt;financial performance&lt;/i&gt;. They correspond to the economic resources, claims and changes in them discussed in Chapter 1 &lt;span class=&quot;ref&quot;&gt;4.1–4.2&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Assets − Liabilities = Equity &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Income − Expenses = Profit (or loss)&lt;/div&gt;

  &lt;h3&gt;Asset&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of the definition of an asset&quot;&gt;
   &lt;text x=&quot;450&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; style=&quot;font-family:var(--serif)&quot;&gt;An asset is a &lt;tspan font-weight=&quot;700&quot;&gt;present economic resource&lt;/tspan&gt; &lt;tspan font-weight=&quot;700&quot;&gt;controlled&lt;/tspan&gt; by the entity as a result of &lt;tspan font-weight=&quot;700&quot;&gt;past events&lt;/tspan&gt; [4.3]&lt;/text&gt;
   &lt;path d=&quot;M330 46 V80&quot; style=&quot;stroke:var(--muted)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;text x=&quot;330&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;economic resource = a right that has the potential to produce economic benefits [4.4]&lt;/text&gt;
   &lt;g text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;60&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Right&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;a right (contract, law…)&lt;/text&gt;
   &lt;rect x=&quot;340&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Potential&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;must exist, need not be probable&lt;/text&gt;
   &lt;rect x=&quot;620&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;160&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Control&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;184&quot; font-size=&quot;12&quot;&gt;links the resource to the entity&lt;/text&gt;
   &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The three aspects of the definition [4.5].&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
   &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Right&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Potential&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Control&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;a) Rights that correspond to an obligation of another party&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.6&lt;/span&gt;: to receive cash; to receive goods or services; to exchange economic resources on favourable terms (e.g. a &lt;i&gt;forward&lt;/i&gt; purchase contract currently on favourable terms, or a purchase option); to benefit from another party&#x27;s obligation to transfer a resource if a specified uncertain future event occurs.&lt;/p&gt;&lt;p&gt;&lt;b&gt;b) Rights that do not correspond to an obligation of another party&lt;/b&gt;: rights over physical objects (property, plant and equipment, inventories), such as the right to use them or to benefit from the residual value of a leased object; rights to use intellectual property.&lt;/p&gt;&lt;p&gt;Rights are established by &lt;b&gt;contract, legislation or similar means&lt;/b&gt;: owning or leasing an asset, holding debt or equity instruments, owning a registered patent &lt;span class=&quot;ref&quot;&gt;4.7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;For the potential to exist, &lt;b&gt;it need not be certain, or even likely, that benefits will arise&lt;/b&gt;. It is enough that the right already exists and that, in at least one circumstance, it would produce for the entity economic benefits beyond those available to all other parties &lt;span class=&quot;ref&quot;&gt;4.14&lt;/span&gt;. A low probability does not remove asset status, but it matters in deciding &lt;b&gt;whether to recognise it and how to measure it&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.15&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;How benefits are produced &lt;span class=&quot;ref&quot;&gt;4.16&lt;/span&gt;: receiving contractual cash flows; exchanging resources on favourable terms; generating cash inflows or avoiding outflows (using the resource to produce goods, to enhance the value of other resources, or leasing it out); selling the resource; extinguishing liabilities by transferring it.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Control&lt;/b&gt; links a resource to an entity and helps determine &lt;i&gt;which&lt;/i&gt; resource is to be accounted for. A party holding a proportionate share in a property controls the share, not the whole property: its asset is the share &lt;span class=&quot;ref&quot;&gt;4.19&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;An entity controls a resource when it has the &lt;b&gt;present ability to direct its use&lt;/b&gt; and obtain the benefits from it, including the ability to &lt;b&gt;prevent other parties&lt;/b&gt; from doing so. Hence a resource is controlled by only one party &lt;span class=&quot;ref&quot;&gt;4.20&lt;/span&gt;. Directing the use means being able to deploy it in one&#x27;s own activities or to allow others to deploy it &lt;span class=&quot;ref&quot;&gt;4.21&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;fs&quot;&gt;Link to slide 30: the control criterion has replaced the old “risks and rewards” criterion.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Liability&lt;/h3&gt;
  &lt;div class=&quot;def quote&quot;&gt;A &lt;b&gt;liability&lt;/b&gt; is a &lt;b&gt;present obligation&lt;/b&gt; of the entity &lt;b&gt;to transfer an economic resource&lt;/b&gt; as a &lt;b&gt;result of past events&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;4.26&lt;/span&gt;. &lt;b&gt;All three&lt;/b&gt; criteria must be met &lt;span class=&quot;ref&quot;&gt;4.27&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;1 · Obligation&lt;/h4&gt;A duty or responsibility that the entity &lt;b&gt;has no practical ability to avoid&lt;/b&gt;. It is always owed to another party (a person, an entity, a group, society at large), whose identity need not be known &lt;span class=&quot;ref&quot;&gt;4.29&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;2 · Transfer of an economic resource&lt;/h4&gt;The obligation must have the &lt;b&gt;potential&lt;/b&gt; to require a transfer. Neither certainty nor probability is required: one circumstance in which the transfer would be required is enough &lt;span class=&quot;ref&quot;&gt;4.37–4.38&lt;/span&gt;. Examples: paying cash, delivering goods or services, exchanging on unfavourable terms (an unfavourable forward sale, a written option), transferring if an uncertain event occurs, issuing an instrument that will oblige the entity to transfer &lt;span class=&quot;ref&quot;&gt;4.39&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card tinted&quot;&gt;&lt;h4&gt;3 · Present obligation from past events&lt;/h4&gt;It exists only if the entity has &lt;b&gt;already obtained economic benefits or taken an action&lt;/b&gt; and, &lt;b&gt;as a consequence&lt;/b&gt;, will or may have to transfer a resource that it would not otherwise have had to transfer &lt;span class=&quot;ref&quot;&gt;4.43&lt;/span&gt;. It may build up over time &lt;span class=&quot;ref&quot;&gt;4.44&lt;/span&gt;. It can exist even if the transfer cannot be enforced until a future date &lt;span class=&quot;ref&quot;&gt;4.46&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;A new law is not enough.&lt;/b&gt; The enactment of a law is not in itself sufficient to give an entity a present obligation. The obligation arises when the entity obtains benefits or takes the action to which the law applies &lt;span class=&quot;ref&quot;&gt;4.45&lt;/span&gt;.&lt;/div&gt;

  &lt;div class=&quot;widget&quot; id=&quot;w-el&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it · cases built for the exercise&lt;/div&gt;
   &lt;h4&gt;Is it an asset? Is it a liability?&lt;/h4&gt;
   &lt;div class=&quot;btns&quot; id=&quot;elBtns&quot;&gt;&lt;/div&gt;
   &lt;div id=&quot;elOut&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Equity, income and expenses&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Equity&lt;/h4&gt;It is the &lt;b&gt;residual interest&lt;/b&gt; in the assets after deducting all liabilities &lt;span class=&quot;ref&quot;&gt;4.63&lt;/span&gt;. &lt;i&gt;Equity claims&lt;/i&gt; are claims against the entity that do not meet the definition of a liability: shares of various types and some obligations to issue other equity instruments &lt;span class=&quot;ref&quot;&gt;4.64&lt;/span&gt;. The definition applies to every reporting entity &lt;span class=&quot;ref&quot;&gt;4.67&lt;/span&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Income / Expenses&lt;/h4&gt;&lt;b&gt;Income&lt;/b&gt;: increases in assets or decreases in liabilities that result in increases in equity, &lt;i&gt;other than contributions&lt;/i&gt; from holders of equity claims &lt;span class=&quot;ref&quot;&gt;4.68&lt;/span&gt;. &lt;b&gt;Expenses&lt;/b&gt;: decreases in assets or increases in liabilities that result in decreases in equity, &lt;i&gt;other than distributions&lt;/i&gt; to holders of equity claims &lt;span class=&quot;ref&quot;&gt;4.69&lt;/span&gt;.&lt;br&gt;⇒ contributions ≠ income, dividends ≠ expenses &lt;span class=&quot;ref&quot;&gt;4.70&lt;/span&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The definitions are &lt;b&gt;derived&lt;/b&gt;: assets and liabilities are defined first, then equity as the difference, then income and expenses as changes. This is the so-called &lt;i&gt;balance sheet&lt;/i&gt; approach. The slides add that presenting separately income and expenses with different characteristics helps users understand performance &lt;span class=&quot;ref&quot;&gt;4.71–4.72&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;Can a right with a very low probability of producing benefits be an asset?&lt;/summary&gt;&lt;div&gt;Yes: potential is enough for the definition [4.14–4.15]. Low probability matters for recognition and measurement decisions (Chs. 5–6).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What are the three criteria of a liability?&lt;/summary&gt;&lt;div&gt;An obligation; to transfer an economic resource; that is a present obligation arising from past events [4.27].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Is a capital increase subscribed by shareholders income?&lt;/summary&gt;&lt;div&gt;No. It increases equity, but contributions from holders of equity claims are excluded by definition [4.68, 4.70].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can two parties control the same resource?&lt;/summary&gt;&lt;div&gt;No: if one party controls it, no other party does [4.20]. One can, however, control a share of an asset, which is a different resource [4.19].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s5&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Recognition and derecognition&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 74–79 · Framework, Chapter 5&lt;/p&gt;
  &lt;div class=&quot;def quote&quot;&gt;&lt;b&gt;Recognition&lt;/b&gt; is the process of capturing, for inclusion in the statement of financial position or the statement(s) of financial performance, an item that meets the definition of an element: depicting it &lt;b&gt;in words and by a monetary amount&lt;/b&gt;, and including that amount in one or more totals. The amount at which an asset, a liability or equity is recognised in the statement of financial position is its &lt;span class=&quot;t&quot;&gt;carrying amount&lt;/span&gt; &lt;span class=&quot;ref&quot;&gt;5.1&lt;/span&gt;.&lt;/div&gt;
  &lt;p&gt;The statements are &lt;b&gt;structured summaries&lt;/b&gt; designed to be comparable and understandable, with totals and subtotals that link the items &lt;span class=&quot;ref&quot;&gt;5.2&lt;/span&gt;. Recognition links the elements and the statements as follows &lt;span class=&quot;ref&quot;&gt;5.3&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;widget&quot; id=&quot;w-link&quot;&gt;
   &lt;div class=&quot;wtag&quot;&gt;Try it&lt;/div&gt;
   &lt;h4&gt;From opening to closing equity&lt;/h4&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lE0&quot;&gt;Opening equity (A − L)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lE0&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;lE0o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lInc&quot;&gt;Income&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lInc&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;lInco&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lExp&quot;&gt;Expenses&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lExp&quot; min=&quot;0&quot; max=&quot;1500&quot; step=&quot;50&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;lExpo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lCon&quot;&gt;Contributions from equity holders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lCon&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;50&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;lCono&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lDis&quot;&gt;Distributions to equity holders&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lDis&quot; min=&quot;0&quot; max=&quot;800&quot; step=&quot;50&quot; value=&quot;150&quot;&gt;&lt;output id=&quot;lDiso&quot;&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;formula&quot; id=&quot;lForm&quot;&gt;&lt;/div&gt;
   &lt;p class=&quot;fs&quot;&gt;The diagram on slide 75 in numbers: opening statement of financial position + (income − expenses) + (contributions − distributions) = closing statement of financial position.&lt;/p&gt;
  &lt;/div&gt;
  &lt;h4&gt;Recognition criteria&lt;/h4&gt;
  &lt;p&gt;The slides (table of contents, slide 9) list the criteria without developing them: an element is recognised if doing so provides &lt;b&gt;relevant&lt;/b&gt; information and a &lt;b&gt;faithful representation&lt;/b&gt;, i.e. the two fundamental characteristics of Chapter 2. Under relevance, &lt;i&gt;existence uncertainty&lt;/i&gt; (uncertainty about whether the element exists at all) and a &lt;i&gt;low probability&lt;/i&gt; of inflows or outflows are considered. Under faithful representation, &lt;i&gt;measurement uncertainty&lt;/i&gt; and other factors are considered &lt;span class=&quot;ref&quot;&gt;5.6–5.25&lt;/span&gt;. This is the link with Chapter 4: the definition can be met even if the probability is low, but recognition may not be.&lt;/p&gt;

  &lt;h3&gt;Derecognition&lt;/h3&gt;
  &lt;div class=&quot;def quote&quot;&gt;&lt;b&gt;Derecognition&lt;/b&gt; is the removal of all or part of a recognised asset or liability from the statement of financial position when it no longer meets the definition. For an asset this normally occurs when the entity &lt;b&gt;loses control&lt;/b&gt;; for a liability, when it &lt;b&gt;no longer has a present obligation&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;5.26&lt;/span&gt;.&lt;/div&gt;
  &lt;div class=&quot;stepper widget&quot; data-stepper&gt;
   &lt;div class=&quot;wtag&quot;&gt;Step through&lt;/div&gt;
   &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Two aims to represent faithfully &lt;span class=&quot;ref&quot;&gt;5.27&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;(1) The assets and liabilities &lt;b&gt;retained&lt;/b&gt; after the transaction, including any acquired, incurred or created in it; (2) the &lt;b&gt;change&lt;/b&gt; in assets and liabilities resulting from the transaction.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;a) Remove what has gone&lt;/h4&gt;&lt;p&gt;Derecognise the assets or liabilities that have expired, been consumed, collected, fulfilled or transferred, and recognise the related income and expenses &lt;span class=&quot;ref&quot;&gt;5.28&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;b) Keep the &lt;i&gt;retained component&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Continue to recognise the retained component, which becomes a separate unit of account. &lt;b&gt;No&lt;/b&gt; income or expenses are recognised on the retained component as a result of derecognising the other part, unless the applicable measurement requirements change.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;c) Additional procedures, if needed&lt;/h4&gt;&lt;p&gt;Present the retained component separately in the statement of financial position; present separately the income and expenses arising from derecognition in the statement of financial performance; provide explanatory information (slide 79).&lt;/p&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-assessment&lt;/h4&gt;
   &lt;details&gt;&lt;summary&gt;What is the carrying amount?&lt;/summary&gt;&lt;div&gt;The amount at which an asset, a liability or equity is recognised in the statement of financial position [5.1].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;When is an asset derecognised?&lt;/summary&gt;&lt;div&gt;Normally when the entity loses control of all or part of the asset [5.26].&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why are gains or losses usually not recognised on the retained component?&lt;/summary&gt;&lt;div&gt;Because the retained part has not been transferred: it becomes a separate unit of account and is measured as before, unless derecognition changes the measurement requirements that apply to it [5.28 b].&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s6&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Measurement&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;fs&quot;&gt;Slides 80–91 · Framework, Chapter 6&lt;/p&gt;
  &lt;p&gt;Recognised elements must be quantified in monetary terms. This requires a &lt;span class=&quot;t&quot;&gt;measurement basis&lt;/span&gt;, i.e. an identified feature of the item being measured: historical cost, fair value, fulfilment value… Applying a measurement basis to an asset or liability creates a measure for that item and for the related income and expenses &lt;span class=&quot;ref&quot;&gt;6.1&lt;/span&gt;.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Tree of measurement bases&quot;&gt;
   &lt;g text-anchor=&quot;middle&quot;&gt;
   &lt;rect x=&quot;350&quot; y=&quot;10&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;38&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Measurement bases&lt;/text&gt;
   &lt;path d=&quot;M420 54 L200 92 M480 54 L640 92&quot; style=&quot;stroke:var(--muted)&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;90&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;118&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Historical cost&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;136&quot; font-size=&quot;11&quot;&gt;entry value · transaction price&lt;/text&gt;
   &lt;rect x=&quot;530&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--deep)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;118&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Current value&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;136&quot; font-size=&quot;11&quot;&gt;updated to the measurement date&lt;/text&gt;
   &lt;path d=&quot;M580 144 L430 182 M640 144 V182 M700 144 L830 182&quot; style=&quot;stroke:var(--muted)&quot; fill=&quot;none&quot; marker-end=&quot;url(#arr)&quot;/&gt;
   &lt;rect x=&quot;350&quot; y=&quot;184&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;208&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Fair value&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;226&quot; font-size=&quot;11&quot;&gt;exit · market participants&lt;/text&gt;
   &lt;rect x=&quot;540&quot; y=&quot;184&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;204&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Value in use /&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;220&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Fulfilment value&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;235&quot; font-size=&quot;11&quot;&gt;exit · entity-specific&lt;/text&gt;
   &lt;rect x=&quot;760&quot; y=&quot;184&quot; width=&quot;130&quot; height=&quot;56&quot; rx=&quot;10&quot; style=&quot;fill:var(--tint)&quot;/&gt;&lt;text x=&quot;825&quot; y=&quot;208&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Current cost&lt;/text&gt;&lt;text x=&quot;825&quot; y=&quot;226&quot; font-size=&quot;11&quot;&gt;entry · today&lt;/text&gt;
   &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
