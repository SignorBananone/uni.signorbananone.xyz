    &lt;/svg&gt;
    &lt;figcaption&gt;I quadrati sono gli Stati membri. Con la directive la cornice è comune (bordo) ma il contenuto (riempimento) varia da Stato a Stato.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Regulation&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Directive&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Recommendation&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;b&gt;Come funziona:&lt;/b&gt; è direttamente applicabile in tutti gli Stati membri, con lo stesso testo e dalla stessa data. Non serve una legge nazionale di recepimento.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio contabile:&lt;/b&gt; il &lt;b&gt;Reg. (CE) 1606/2002&lt;/b&gt; rende gli IFRS obbligatori per i bilanci consolidati delle società quotate dal 2005. Ogni singolo IFRS entra poi nel diritto UE con un proprio regolamento della Commissione (l&#x27;&lt;i&gt;endorsement&lt;/i&gt;, sezione 5).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Come funziona:&lt;/b&gt; fissa obiettivi e una cornice; ogni Stato la &lt;span class=&quot;term&quot;&gt;transposes&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(recepisce)&lt;/span&gt; con una legge nazionale, con le proprie opzioni e i propri tempi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempi contabili:&lt;/b&gt; Dir. &lt;b&gt;2013/34/UE&lt;/b&gt; (bilanci d&#x27;esercizio e consolidati), recepita in Italia dal &lt;b&gt;D.Lgs. 139/2015&lt;/b&gt;, che modifica il Codice civile; Dir. &lt;b&gt;2022/2464&lt;/b&gt; (CSRD), recepita dal &lt;b&gt;D.Lgs. 125/2024&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Come funziona:&lt;/b&gt; non è vincolante; invita Stati o enti ad agire. Incide sulla comparabilità solo se viene seguita.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio contabile:&lt;/b&gt; &lt;b&gt;Rec. 2001/453/CE&lt;/b&gt; sulle informazioni ambientali nei bilanci annuali, un precursore della rendicontazione di sostenibilità (sezione 7).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;In Italia&lt;/h4&gt;&lt;p&gt;Le direttive → &lt;b&gt;decreti legislativi&lt;/b&gt; (D.Lgs.) che riscrivono il Codice civile (artt. 2423-2435-ter).&lt;/p&gt;&lt;p style=&quot;margin:0&quot;&gt;I regolamenti → immediatamente applicabili; il &lt;b&gt;D.Lgs. 38/2005&lt;/b&gt; si limita a stabilire chi può o deve usare gli IFRS.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box line&quot;&gt;&lt;h4&gt;Domanda della slide&lt;/h4&gt;&lt;p&gt;Due società, una a Milano e una a Madrid, entrambe non quotate, entrambe soggette alla Direttiva 2013/34: i loro bilanci possono essere diversi? Perché?&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì: per via delle &lt;b&gt;opzioni nazionali&lt;/b&gt;. Per esempio il LIFO è ammesso in Italia, e cambiano gli schemi e le soglie. La direttiva armonizza lo scheletro, non ogni scelta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Perché due società soggette a un regolamento UE non possono presentare bilanci diversi, mentre due soggette alla stessa direttiva sì?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il regolamento si applica direttamente con lo stesso testo ovunque. La direttiva passa per leggi nazionali che scelgono tra le opzioni previste e decidono i tempi: stessa cornice, contenuti diversi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Il D.Lgs. 38/2005 «recepisce» il Reg. 1606/2002?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: i regolamenti non hanno bisogno di recepimento. Il D.Lgs. 38/2005 esercita le opzioni che il regolamento lascia agli Stati, cioè decide quali altre società possono o devono usare gli IFRS.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Collega ogni atto al suo strumento: Rec. 2001/453 · Dir. 2022/2464 · Reg. 1606/2002.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Raccomandazione (informazioni ambientali, non vincolante) · Direttiva (CSRD, recepita col D.Lgs. 125/2024) · Regolamento (IFRS obbligatori per i consolidati delle quotate).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-italy&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Italia: chi applica cosa&lt;/div&gt;&lt;h2&gt;Tre livelli di regole nello stesso Paese&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;In Italia convivono gli IFRS (via D.Lgs. 38/2005) e il Codice civile integrato dai principi OIC. Quale insieme si applica dipende dal tipo di società.&lt;/p&gt;

  &lt;p&gt;&lt;b&gt;Scegli un tipo di società:&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;chips&quot; data-chips=&quot;#it-out&quot;&gt;
    &lt;button class=&quot;btn on&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: obbligatori&amp;lt;/b&amp;gt; per il consolidato e, con eccezioni, anche per il bilancio separato (D.Lgs. 38/2005). Codice civile + OIC come set di principi contabili: —. Il Codice civile resta però rilevante per approvazione, distribuzione degli utili e riserve.&quot;&gt;Quotate, banche, intermediari finanziari, gruppi assicurativi&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: facoltativi&amp;lt;/b&amp;gt;, con scelta irrevocabile. &amp;lt;b&amp;gt;Codice civile + OIC: regime di default.&amp;lt;/b&amp;gt; Se non scelgono gli IFRS, applicano le regole nazionali.&quot;&gt;Altre società che redigono (o sono incluse in) un consolidato, e altre società più grandi&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: non ammessi.&amp;lt;/b&amp;gt; &amp;lt;b&amp;gt;Codice civile + OIC: obbligatori&amp;lt;/b&amp;gt;, con gli schemi semplificati del bilancio abbreviato (art. 2435-bis) o delle micro-imprese (art. 2435-ter).&quot;&gt;Società che possono redigere il bilancio abbreviato e micro-imprese&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;info&quot; id=&quot;it-out&quot;&gt;&lt;b&gt;IFRS: obbligatori&lt;/b&gt; per il consolidato e, con eccezioni, anche per il bilancio separato (D.Lgs. 38/2005). Codice civile + OIC come set di principi contabili: —. Il Codice civile resta però rilevante per approvazione, distribuzione degli utili e riserve.&lt;/div&gt;

  &lt;h3&gt;Un&#x27;italiana che adotta gli IFRS vive su tre livelli&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Tre livelli di regole per un&#x27;impresa italiana che adotta gli IFRS&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;120&quot; y=&quot;20&quot; width=&quot;660&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;slatef&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;140&quot; y=&quot;46&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;68&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;misurazione (measurement) e presentazione delle voci di bilancio&lt;/text&gt;
        &lt;rect x=&quot;90&quot; y=&quot;96&quot; width=&quot;720&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;sagef&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;122&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Codice civile&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;144&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;approvazione del bilancio · distribuzione degli utili · riserve · relazione sulla gestione&lt;/text&gt;
        &lt;rect x=&quot;60&quot; y=&quot;172&quot; width=&quot;780&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;brickf&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;80&quot; y=&quot;198&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Diritto tributario (IRES / IRAP)&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;220&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;imposte calcolate partendo dal risultato contabile&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;b&gt;IRES&lt;/b&gt; = imposta sul reddito delle società; &lt;b&gt;IRAP&lt;/b&gt; = imposta regionale sulle attività produttive. Il risultato contabile è il punto di partenza del reddito imponibile. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Le società non quotate applicano Codice civile + OIC, con alcune definizioni «prese in prestito» dagli IFRS tramite l&#x27;&lt;b&gt;art. 2426, comma 2 c.c.&lt;/b&gt; &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt; Quel comma rinvia ai principi contabili internazionali adottati dall&#x27;UE per definizioni come strumento finanziario, derivato e fair value: così anche il bilancio «nazionale» parla in parte la lingua IFRS.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;OIC – Organismo Italiano di Contabilità&lt;/h4&gt;
      &lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
        &lt;li&gt;Standard setter nazionale dal 2001; riconosciuto per legge dalla &lt;b&gt;L. 116/2014&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Emana i principi OIC, che interpretano e integrano il Codice civile (da OIC 11 a OIC 35).&lt;/li&gt;
        &lt;li&gt;Rappresenta l&#x27;Italia in EFRAG.&lt;/li&gt;
      &lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box line&quot;&gt;&lt;h4&gt;Glossario rapido&lt;/h4&gt;
      &lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;Bilancio separato&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;separate financial statements&lt;/span&gt;): il bilancio della singola società quando questa redige anche il consolidato. &lt;b&gt;Consolidato&lt;/b&gt;: il bilancio del gruppo come un&#x27;unica entità. &lt;b&gt;Abbreviato&lt;/b&gt;: bilancio con schemi ridotti per le società sotto certe soglie dimensionali. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Una S.p.A. italiana non quotata con 300 dipendenti può adottare gli IFRS? Deve? Quali regole governano la distribuzione dell&#x27;utile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Con 300 dipendenti non rientra nel bilancio abbreviato, quindi è tra le «altre società più grandi»: &lt;b&gt;può&lt;/b&gt; adottare gli IFRS (scelta facoltativa e irrevocabile), ma &lt;b&gt;non deve&lt;/b&gt;, perché non è quotata, non è una banca e non è un&#x27;assicurazione. Il default è Codice civile + OIC. Approvazione, riserve e distribuzione dell&#x27;utile restano comunque regolate dal &lt;b&gt;Codice civile&lt;/b&gt;, anche se adotta gli IFRS. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt; Per chi adotta gli IFRS il D.Lgs. 38/2005 aggiunge limiti alla distribuzione degli utili non realizzati da fair value: verificalo sul testo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Bergamo Bikes, se rientra nel bilancio abbreviato, può usare gli IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: per le società che possono redigere il bilancio abbreviato (art. 2435-bis) e per le micro-imprese (2435-ter) gli IFRS non sono ammessi; si applicano Codice civile + OIC.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Quali sono i tre livelli di regole per una società italiana IFRS adopter?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IFRS per misurazione e presentazione; Codice civile per approvazione, distribuzione degli utili, riserve e relazione sulla gestione; diritto tributario (IRES/IRAP) costruito sul risultato contabile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-timeline&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Convergenza&lt;/div&gt;&lt;h2&gt;Due linee del tempo: il mondo e l&#x27;UE&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Tocca un punto per leggerne il significato. Le due storie corrono parallele e si incontrano nel &lt;b&gt;2002–2005&lt;/b&gt;: l&#x27;UE sceglie di non scrivere principi propri e adotta quelli dello IASB.&lt;/p&gt;
  &lt;div data-chips=&quot;#tl-out&quot;&gt;
  &lt;figure style=&quot;margin-bottom:6px&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Linee del tempo interattive&quot;&gt;
      &lt;style&gt;.tl{cursor:pointer}.tl circle{transition:r .15s}.tl:hover circle,.tl:focus circle,.tl.on circle{r:15}.tl.on circle{stroke:var(--ink);stroke-width:2}.tl:focus{outline:none}&lt;/style&gt;
      &lt;text x=&quot;20&quot; y=&quot;40&quot; class=&quot;slatef serif&quot; font-size=&quot;18&quot;&gt;Mondo&lt;/text&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;80&quot; x2=&quot;880&quot; y2=&quot;80&quot; class=&quot;slates&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;text x=&quot;20&quot; y=&quot;160&quot; class=&quot;brickf serif&quot; font-size=&quot;18&quot;&gt;UE&lt;/text&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;200&quot; x2=&quot;880&quot; y2=&quot;200&quot; class=&quot;bricks&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1973 · Nasce lo IASC&amp;lt;/b&amp;gt; (International Accounting Standards Committee), che emette i primi IAS. &amp;lt;span class=from&amp;gt;spiegazione&amp;lt;/span&amp;gt; Era un comitato degli ordini professionali di alcuni Paesi, senza poteri per imporre i propri principi.&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;112&quot;&gt;1973&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2001 · Lo IASB sostituisce lo IASC.&amp;lt;/b&amp;gt; Gli IAS già emessi restano in vigore (in parte ancora oggi); i nuovi principi si chiamano IFRS.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;112&quot;&gt;2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2002 · Norwalk Agreement&amp;lt;/b&amp;gt; tra IASB e FASB (Norwalk, Connecticut): i due board si impegnano a rendere compatibili IFRS e US GAAP.&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;112&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2005 · L&#x27;UE e l&#x27;Australia adottano gli IFRS.&amp;lt;/b&amp;gt; Per l&#x27;UE è il primo anno di applicazione del Reg. 1606/2002 ai consolidati delle quotate.&quot;&gt;&lt;circle cx=&quot;440&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;112&quot;&gt;2005&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2006–09 · MoU IASB–FASB&amp;lt;/b&amp;gt; (Memorandum of Understanding, un programma di progetti comuni); il &amp;lt;b&amp;gt;G20&amp;lt;/b&amp;gt; sostiene la convergenza. &amp;lt;span class=from&amp;gt;spiegazione&amp;lt;/span&amp;gt; Dopo la crisi finanziaria globale, il G20 chiede un unico insieme di principi di alta qualità.&quot;&gt;&lt;circle cx=&quot;560&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;112&quot;&gt;2006–09&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Anni 2010 · La convergenza rallenta&amp;lt;/b&amp;gt;: gli USA non adottano gli IFRS per le società domestiche; gli IFRS sono però adottati in oltre 140 giurisdizioni.&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;112&quot;&gt;2010s&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2021 · Nasce l&#x27;ISSB&amp;lt;/b&amp;gt; (International Sustainability Standards Board), dentro la IFRS Foundation: standard di sostenibilità IFRS S1 e S2. &amp;lt;span class=ext&amp;gt;fonte esterna&amp;lt;/span&amp;gt; S1 e S2 sono stati pubblicati il 26 giugno 2023 (&amp;lt;a href=&#x27;https://www.icaew.com/technical/corporate-reporting/non-financial-reporting/international-sustainability-disclosure-standards&#x27; target=&#x27;_blank&#x27; rel=&#x27;noopener&#x27;&amp;gt;ICAEW&amp;lt;/a&amp;gt;).&quot;&gt;&lt;circle cx=&quot;800&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;112&quot;&gt;2021&lt;/text&gt;&lt;/g&gt;

        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1978 · IV Direttiva&amp;lt;/b&amp;gt; sui conti annuali delle società di capitali. &amp;lt;span class=from&amp;gt;spiegazione&amp;lt;/span&amp;gt; In Italia è stata recepita, insieme alla VII, dal D.Lgs. 127/1991.&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;232&quot;&gt;1978&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1983 · VII Direttiva&amp;lt;/b&amp;gt; sui conti consolidati.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;232&quot;&gt;1983&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1995 · Strategia della Commissione sugli IAS.&amp;lt;/b&amp;gt; &amp;lt;span class=from&amp;gt;spiegazione&amp;lt;/span&amp;gt; L&#x27;UE rinuncia a creare uno standard setter europeo e guarda agli IAS come riferimento.&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;232&quot;&gt;1995&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2000 · Piano d&#x27;azione per i servizi finanziari&amp;lt;/b&amp;gt; (Financial Services Action Plan): un mercato dei capitali integrato richiede bilanci comparabili.&quot;&gt;&lt;circle cx=&quot;440&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;232&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2002 · Reg. 1606/2002&amp;lt;/b&amp;gt;: IFRS obbligatori dal 2005 per i consolidati delle società quotate UE, previo endorsement.&quot;&gt;&lt;circle cx=&quot;560&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;232&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2013 · Dir. 2013/34/UE&amp;lt;/b&amp;gt;: un&#x27;unica direttiva per bilanci d&#x27;esercizio e consolidati, recepita in Italia dal D.Lgs. 139/2015. &amp;lt;span class=ext&amp;gt;fonte esterna&amp;lt;/span&amp;gt; Abroga le direttive 78/660/CEE e 83/349/CEE (&amp;lt;a href=&#x27;https://www.legislation.gov.uk/eudr/2013/34&#x27; target=&#x27;_blank&#x27; rel=&#x27;noopener&#x27;&amp;gt;testo della direttiva&amp;lt;/a&amp;gt;).&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;232&quot;&gt;2013&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2022–25 · CSRD, poi Omnibus.&amp;lt;/b&amp;gt; La rendicontazione di sostenibilità diventa obbligatoria per molte imprese, poi il pacchetto Omnibus ne restringe l&#x27;ambito (sezione 7).&quot;&gt;&lt;circle cx=&quot;800&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;232&quot;&gt;2022–25&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M440 92 C 470 140 530 150 560 188&quot; fill=&quot;none&quot; class=&quot;accs&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;info&quot; id=&quot;tl-out&quot;&gt;Tocca un punto delle due linee del tempo.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Nota della slide: l&#x27;accordo IASB–FASB del 2002 è il «Norwalk Agreement» (Norwalk, Connecticut).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Che differenza c&#x27;è tra IAS e IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli IAS (1-41) sono stati emessi dallo IASC fino al 2001; gli IFRS (1-19) dallo IASB dopo il 2001. Si parla di «IFRS» per l&#x27;insieme dei due, più le interpretazioni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; In che anno l&#x27;UE rende obbligatori gli IFRS, e con quale atto?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Con il Reg. (CE) 1606/2002, per i bilanci consolidati delle quotate a partire dal 2005.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Che cos&#x27;è il Norwalk Agreement?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;accordo del 2002 tra IASB e FASB per rendere compatibili IFRS e US GAAP (convergenza).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-ifrs&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Che cosa contengono gli «IFRS»&lt;/div&gt;&lt;h2&gt;Organi, documenti, e come nasce uno standard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Gli organi&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;&lt;b&gt;IFRS Foundation&lt;/b&gt;: trustees e monitoring board (chi governa e chi vigila sulla fondazione).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IASB&lt;/b&gt;: 14 membri, emette IAS/IFRS.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IFRS Interpretations Committee&lt;/b&gt;: risolve i dubbi applicativi.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;ISSB&lt;/b&gt; (2021): standard di sostenibilità IFRS S1 e S2.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;I documenti&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;&lt;b&gt;Conceptual Framework&lt;/b&gt; (2018): non è uno standard, ma la base di tutti gli standard.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IAS 1-41&lt;/b&gt; (emessi dallo IASC, ancora in vigore in parte) e &lt;b&gt;IFRS 1-19&lt;/b&gt; (IFRS 18 e 19 emessi nel 2024).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Interpretazioni&lt;/b&gt;: SIC (vecchie) e IFRIC.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--accent)&quot;&gt;&lt;h4 style=&quot;color:var(--accent)&quot;&gt;Nomi da ricordare&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;IAS 1 → &lt;b&gt;IFRS 18&lt;/b&gt; dal 2027 (presentazione).&lt;/li&gt;
      &lt;li&gt;IAS 16, 38, 36, 40 (attività).&lt;/li&gt;
      &lt;li&gt;IFRS 15 (ricavi), IFRS 16 (leasing), IFRS 9 (strumenti finanziari).&lt;/li&gt;&lt;/ul&gt;
      &lt;p style=&quot;margin-top:.5em;color:var(--accent);font-weight:600&quot;&gt;È il programma del corso dal 5 ottobre.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Che cosa trattano IAS 16, 38, 36 e 40 &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;b&gt;IAS 16&lt;/b&gt; Property, plant and equipment (immobili, impianti e macchinari) · &lt;b&gt;IAS 38&lt;/b&gt; Intangible assets (attività immateriali) · &lt;b&gt;IAS 36&lt;/b&gt; Impairment of assets (riduzione di valore: quando il valore recuperabile scende sotto il valore contabile) · &lt;b&gt;IAS 40&lt;/b&gt; Investment property (immobili detenuti per affitto o rivalutazione).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;La gerarchia in pratica (IAS 8)&lt;/h3&gt;
  &lt;p&gt;Che cosa fa chi prepara il bilancio se un&#x27;operazione non è coperta da nessuno standard?&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Gerarchia IAS 8 a gradini&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;150&quot; width=&quot;280&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;36&quot; y=&quot;176&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;① Standard o interpretazione&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;196&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;che si applica all&#x27;operazione&lt;/text&gt;
        &lt;rect x=&quot;310&quot; y=&quot;95&quot; width=&quot;280&quot; height=&quot;115&quot; rx=&quot;8&quot; class=&quot;slatef&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;326&quot; y=&quot;121&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;② Giudizio (judgement)&lt;/text&gt;&lt;text x=&quot;326&quot; y=&quot;141&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;basato su standard simili&lt;/text&gt;&lt;text x=&quot;326&quot; y=&quot;159&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;e sul Conceptual Framework&lt;/text&gt;
        &lt;rect x=&quot;600&quot; y=&quot;40&quot; width=&quot;280&quot; height=&quot;170&quot; rx=&quot;8&quot; class=&quot;slatef&quot; opacity=&quot;.5&quot;/&gt;&lt;text x=&quot;616&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;③ Altri standard setter&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;86&quot; font-size=&quot;12.5&quot;&gt;con un framework simile&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;104&quot; font-size=&quot;12.5&quot;&gt;(es. FASB)&lt;/text&gt;
        &lt;text x=&quot;20&quot; y=&quot;30&quot; class=&quot;accf serif&quot; font-size=&quot;16&quot; font-style=&quot;italic&quot;&gt;Il Framework non prevale mai su uno standard.&lt;/text&gt;
        &lt;path d=&quot;M160 140 C 200 80 260 80 300 100&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;path d=&quot;M450 85 C 490 30 550 30 595 50&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;210&quot; y=&quot;74&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;middle&quot;&gt;se non c&#x27;è&lt;/text&gt;
        &lt;text x=&quot;520&quot; y=&quot;22&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;middle&quot;&gt;se ancora non basta&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;s-due&quot;&gt;Come nasce uno standard ed entra nel diritto UE&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-generic&gt;
    &lt;svg viewBox=&quot;0 0 900 70&quot; role=&quot;img&quot; aria-label=&quot;Le sei fasi: tre dello IASB, tre dell&#x27;UE&quot; style=&quot;width:100%;height:auto;margin-bottom:10px&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;
        &lt;path d=&quot;M0 5 H130 L150 35 L130 65 H0 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Research&lt;/text&gt;
        &lt;path d=&quot;M150 5 H280 L300 35 L280 65 H150 L170 35 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;228&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Exposure Draft&lt;/text&gt;
        &lt;path d=&quot;M300 5 H430 L450 35 L430 65 H300 L320 35 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;378&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Standard&lt;/text&gt;
        &lt;path d=&quot;M450 5 H580 L600 35 L580 65 H450 L470 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;528&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;EFRAG&lt;/text&gt;
        &lt;path d=&quot;M600 5 H730 L750 35 L730 65 H600 L620 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;678&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;ARC&lt;/text&gt;
        &lt;path d=&quot;M750 5 H880 L900 35 L880 65 H750 L770 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;828&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;EU regulation&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;steplab muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;1 · Research &lt;small&gt;(IASB, globale)&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;Lo IASB decide di inserire un tema nella propria agenda (&lt;span class=&quot;term&quot;&gt;agenda decision&lt;/span&gt;) e può pubblicare un &lt;span class=&quot;term&quot;&gt;Discussion Paper&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(documento di discussione con le prime idee e le alternative)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;2 · Exposure Draft&lt;/h4&gt;&lt;p&gt;La bozza di standard è messa in consultazione: chiunque può inviare &lt;span class=&quot;term&quot;&gt;comment letters&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(lettere di commento pubbliche)&lt;/span&gt;, di solito entro &lt;b&gt;120 giorni&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;3 · Standard&lt;/h4&gt;&lt;p&gt;Lo IASB vota il testo finale, fissa la &lt;span class=&quot;term&quot;&gt;effective date&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(data da cui si applica)&lt;/span&gt; e, dopo qualche anno, svolge una &lt;span class=&quot;term&quot;&gt;post-implementation review&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(verifica di come funziona in pratica)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;4 · EFRAG &lt;small&gt;(UE, endorsement)&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;L&#x27;EFRAG (European Financial Reporting Advisory Group) dà un parere tecnico alla Commissione: lo standard soddisfa i criteri ed è &lt;i&gt;conducive to the European public good&lt;/i&gt;, cioè favorevole al bene pubblico europeo?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;5 · ARC&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;span class=&quot;term&quot;&gt;Accounting Regulatory Committee&lt;/span&gt;, composto dai rappresentanti degli Stati membri, vota.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;6 · EU regulation&lt;/h4&gt;&lt;p&gt;La Commissione pubblica un regolamento nella Gazzetta ufficiale dell&#x27;UE in tutte le lingue: &lt;b&gt;ora è legge&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;box extbox&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;h4&gt;Un esempio fresco &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;IFRS 18 è stato omologato con il &lt;b&gt;Regolamento (UE) 2026/338&lt;/b&gt;, adottato il 13 febbraio 2026 e pubblicato in Gazzetta il 16 febbraio 2026; si applica dagli esercizi che iniziano dal 1° gennaio 2027. &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.fondazioneoic.eu/31086/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Perché l&#x27;endorsement conta&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;L&#x27;UE può adottare, respingere o fare un &lt;span class=&quot;term&quot;&gt;carve out&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(ritaglio: adottare uno standard togliendone alcune parti)&lt;/span&gt; di uno standard. Lo ha fatto con lo &lt;b&gt;IAS 39 nel 2004&lt;/b&gt;. La versione UE degli IFRS è «IFRS &lt;i&gt;as adopted by the EU&lt;/i&gt;».&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Tempi&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Tra lo standard IASB e il regolamento UE passano di solito &lt;b&gt;6-18 mesi&lt;/b&gt;. Uno standard non si può applicare nell&#x27;UE prima dell&#x27;endorsement; l&#x27;applicazione anticipata è ammessa solo se lo standard è già omologato.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box extbox&quot;&gt;&lt;h4&gt;Il carve-out dello IAS 39 &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Nel novembre 2004 la Commissione omologò lo IAS 39 escludendo due parti: la &lt;i&gt;fair value option&lt;/i&gt; per le passività finanziarie e alcune regole sull&#x27;&lt;i&gt;hedge accounting&lt;/i&gt; di portafoglio (macro hedging) chieste dalle banche. Il ritaglio sulla fair value option cadde nel 2005, dopo una modifica dello IASB; quello sul macro hedging restò. &lt;a href=&quot;https://www.iasplus.com/en/news/2004/September/news1751&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.gov.uk/hmrc-internal-manuals/corporate-finance-manual/cfm21020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HMRC CFM21020&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Il Conceptual Framework è uno standard? Può prevalere su uno standard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No e no. È la base concettuale degli standard e serve quando nessuno standard si applica (IAS 8), ma non prevale mai su uno standard.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Metti in ordine: ARC · Exposure Draft · EFRAG · Research · EU regulation · Standard.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Research → Exposure Draft → Standard → EFRAG → ARC → EU regulation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Che cosa significa «IFRS as adopted by the EU»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Che nell&#x27;UE valgono solo gli IFRS omologati con regolamento, eventualmente con carve-out. Possono quindi differire dagli IFRS dello IASB, come nel caso dello IAS 39 nel 2004.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;4.&lt;/b&gt; Quale standard sostituisce lo IAS 1 e da quando?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;IFRS 18, dal 2027.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-qual&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Che cosa rende utile l&#x27;informazione&lt;/div&gt;&lt;h2&gt;Qualitative characteristics (Conceptual Framework 2018)&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Sono il metro con cui si può giudicare ogni standard e ogni regola nazionale. Tocca un elemento dell&#x27;edificio.&lt;/p&gt;
  &lt;div data-chips=&quot;#q-out&quot;&gt;
  &lt;figure style=&quot;margin-bottom:6px&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 360&quot; role=&quot;img&quot; aria-label=&quot;Edificio delle caratteristiche qualitative&quot;&gt;
      &lt;style&gt;.qk{cursor:pointer}.qk:hover rect,.qk:focus rect,.qk.on rect,.qk.on path{stroke:var(--ink);stroke-width:2.5}.qk:focus{outline:none}&lt;/style&gt;
      &lt;g font-size=&quot;15&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;path d=&quot;M120 70 L450 10 L780 70 Z&quot; class=&quot;accf&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;58&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;18&quot;&gt;Useful financial information&lt;/text&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Relevance&amp;lt;/b&amp;gt; (rilevanza): l&#x27;informazione è capace di fare la differenza nelle decisioni, perché ha valore &amp;lt;i&amp;gt;predictive&amp;lt;/i&amp;gt; (aiuta a prevedere) o &amp;lt;i&amp;gt;confirmatory&amp;lt;/i&amp;gt; (conferma o corregge previsioni passate). La &amp;lt;b&amp;gt;materiality&amp;lt;/b&amp;gt; è una rilevanza specifica dell&#x27;entità: un&#x27;informazione è significativa se ometterla o sbagliarla può influenzare le decisioni degli utilizzatori.&quot;&gt;&lt;rect x=&quot;150&quot; y=&quot;80&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;6&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;148&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Relevance&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;170&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;materiality&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Faithful representation&amp;lt;/b&amp;gt; (rappresentazione fedele): completa, neutrale (sostenuta dalla &amp;lt;i&amp;gt;prudence&amp;lt;/i&amp;gt;, cioè cautela in condizioni di incertezza), priva di errori. Ne fa parte la &amp;lt;b&amp;gt;substance over form&amp;lt;/b&amp;gt; (prevalenza della sostanza economica sulla forma giuridica).&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;80&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;6&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;625&quot; y=&quot;148&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Faithful representation&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;170&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;complete · neutral · free from error&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Comparability&amp;lt;/b&amp;gt;: confrontabilità tra periodi e tra entità. Richiede &amp;lt;i&amp;gt;consistency&amp;lt;/i&amp;gt;, cioè applicare gli stessi criteri nel tempo.&quot;&gt;&lt;rect x=&quot;120&quot; y=&quot;240&quot; width=&quot;160&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;270&quot;&gt;Comparability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Verifiability&amp;lt;/b&amp;gt;: osservatori indipendenti e informati arriverebbero a un accordo (anche non totale) sul fatto che la rappresentazione è fedele.&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;240&quot; width=&quot;155&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;367&quot; y=&quot;270&quot;&gt;Verifiability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Timeliness&amp;lt;/b&amp;gt;: l&#x27;informazione è disponibile in tempo per influenzare le decisioni. Un bilancio perfetto pubblicato troppo tardi serve poco.&quot;&gt;&lt;rect x=&quot;455&quot; y=&quot;240&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;270&quot;&gt;Timeliness&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Understandability&amp;lt;/b&amp;gt;: comprensibile per utilizzatori con ragionevole conoscenza e diligenza. Le questioni complesse &amp;lt;i&amp;gt;non&amp;lt;/i&amp;gt; si omettono perché difficili.&quot;&gt;&lt;rect x=&quot;615&quot; y=&quot;240&quot; width=&quot;165&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;697&quot; y=&quot;270&quot;&gt;Understandability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Cost constraint&amp;lt;/b&amp;gt;: i benefici dell&#x27;informativa devono giustificarne i costi. Per questo le piccole e micro imprese hanno schemi semplificati ed esenzioni in ogni ordinamento, come il bilancio abbreviato e quello delle micro-imprese in Italia.&quot;&gt;&lt;rect x=&quot;80&quot; y=&quot;300&quot; width=&quot;740&quot; height=&quot;44&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;328&quot; font-weight=&quot;600&quot;&gt;Cost constraint&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;50&quot; y=&quot;160&quot; font-size=&quot;12&quot; class=&quot;mut&quot; transform=&quot;rotate(-90 50 160)&quot;&gt;fondamentali&lt;/text&gt;
        &lt;text x=&quot;50&quot; y=&quot;268&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;start&quot; transform=&quot;rotate(-90 50 268)&quot; dy=&quot;0&quot;&gt;rafforzative&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;info&quot; id=&quot;q-out&quot;&gt;Le due colonne sono le caratteristiche &lt;b&gt;fondamentali&lt;/b&gt;; la fascia sotto contiene le &lt;b&gt;enhancing&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(rafforzative: migliorano un&#x27;informazione già rilevante e fedele, ma non la salvano se manca una delle due fondamentali)&lt;/span&gt;; alla base c&#x27;è il vincolo dei costi.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;La slide ricorda che il corso riparte da qui il 5 ottobre con Prof. Aprile da qui il 5 ottobre (prossima lezione: &lt;i&gt;the IFRS Conceptual Framework&lt;/i&gt;).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Quali sono le due caratteristiche fondamentali?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Relevance e faithful representation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Dove si colloca la prudence nel Framework 2018?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Come sostegno alla neutralità, dentro la faithful representation: cautela nei giudizi in condizioni di incertezza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Perché le micro-imprese hanno schemi semplificati?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Per il cost constraint: il costo di un&#x27;informativa completa supererebbe i benefici per i loro utilizzatori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-sust&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Oltre il financial reporting&lt;/div&gt;&lt;h2&gt;Sustainability reporting: da NFRD a CSRD, e l&#x27;Omnibus&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;NFRD · Dir. 2014/95, D.Lgs. 254/2016&lt;/th&gt;&lt;th&gt;CSRD · Dir. 2022/2464, D.Lgs. 125/2024&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;grandi enti di interesse pubblico con più di 500 dipendenti (circa 200 in Italia)&lt;/td&gt;&lt;td&gt;grandi imprese e PMI quotate, a ondate; ambito in restrizione con il pacchetto Omnibus (soglie intorno ai 1.000 dipendenti)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Cosa&lt;/b&gt;&lt;/td&gt;&lt;td&gt;dichiarazione non finanziaria, con standard a scelta dell&#x27;impresa (GRI)&lt;/td&gt;&lt;td&gt;sustainability statement secondo gli &lt;b&gt;ESRS&lt;/b&gt; obbligatori, &lt;b&gt;double materiality&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;digital tagging&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(marcatura digitale dei dati)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Dove&lt;/b&gt;&lt;/td&gt;&lt;td&gt;report separato o nella relazione sulla gestione&lt;/td&gt;&lt;td&gt;una sezione dedicata della relazione sulla gestione&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Assurance&lt;/b&gt;&lt;/td&gt;&lt;td&gt;solo verifica di coerenza&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;term&quot;&gt;limited assurance&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(verifica limitata)&lt;/span&gt; del revisore legale o di un prestatore indipendente&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Double materiality &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 220&quot; role=&quot;img&quot; aria-label=&quot;Doppia rilevanza: impatto e finanziaria&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;200&quot; cy=&quot;110&quot; r=&quot;80&quot; class=&quot;sagef&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;104&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Ambiente&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;124&quot; fill=&quot;var(--paper)&quot;&gt;e persone&lt;/text&gt;
        &lt;rect x=&quot;610&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;140&quot; rx=&quot;14&quot; class=&quot;slatef&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;710&quot; y=&quot;106&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Impresa&lt;/text&gt;&lt;text x=&quot;710&quot; y=&quot;126&quot; fill=&quot;var(--paper)&quot;&gt;(valore, flussi)&lt;/text&gt;
        &lt;path d=&quot;M610 80 C 470 40 380 40 285 80&quot; fill=&quot;none&quot; class=&quot;bricks&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M285 140 C 380 180 470 180 610 140&quot; fill=&quot;none&quot; class=&quot;ochres&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;450&quot; y=&quot;36&quot; class=&quot;brickf&quot; font-weight=&quot;600&quot;&gt;impact materiality (inside-out)&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;202&quot; class=&quot;ochref&quot; font-weight=&quot;600&quot;&gt;financial materiality (outside-in)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Con la double materiality un tema va rendicontato se è rilevante &lt;i&gt;almeno in una&lt;/i&gt; delle due direzioni: l&#x27;impatto dell&#x27;impresa su ambiente e persone, oppure l&#x27;effetto dei temi di sostenibilità sui risultati e sul valore dell&#x27;impresa. Gli IFRS S1/S2 guardano soprattutto alla seconda.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Per questo corso&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;L&#x27;informativa di sostenibilità sta &lt;b&gt;accanto&lt;/b&gt; al bilancio, non dentro, ma i due devono collegarsi: i rischi climatici incidono su &lt;span class=&quot;term&quot;&gt;impairment&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(svalutazioni)&lt;/span&gt;, &lt;span class=&quot;term&quot;&gt;provisions&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(accantonamenti a fondi rischi)&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;useful lives&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(vite utili, e quindi ammortamenti)&lt;/span&gt;. Gli IFRS S1/S2 (ISSB) svolgono a livello globale il ruolo che gli ESRS svolgono nell&#x27;UE.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;box extbox&quot;&gt;&lt;h4&gt;Stato dell&#x27;Omnibus &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;La slide invita a verificare lo stato dell&#x27;Omnibus e del recepimento italiano prima di ogni edizione della lezione. Ecco cosa risulta dal web (ottobre 2026):&lt;/p&gt;
    &lt;ul style=&quot;margin:0 0 .6em;padding-left:1.1em&quot;&gt;
      &lt;li&gt;La direttiva &lt;b&gt;Omnibus I&lt;/b&gt; è stata approvata dal Parlamento europeo il 16 dicembre 2025 e adottata dal Consiglio il 24 febbraio 2026; è entrata in vigore a marzo 2026 dopo la pubblicazione in Gazzetta.&lt;/li&gt;
      &lt;li&gt;La CSRD si applica solo alle imprese UE con &lt;b&gt;più di 1.000 dipendenti&lt;/b&gt; e &lt;b&gt;più di 450 milioni di euro&lt;/b&gt; di fatturato netto; i commentatori stimano che circa l&#x27;80% delle imprese esca dall&#x27;ambito.&lt;/li&gt;
      &lt;li&gt;Gli &lt;b&gt;ESRS semplificati&lt;/b&gt; sono stati adottati dalla Commissione il 3 luglio 2026 (Reg. delegato (UE) 2026/1563).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p style=&quot;margin:0;font-size:.88rem&quot;&gt;&lt;a href=&quot;https://www.regulationtomorrow.com/2026/02/omnibus-i-csrd-and-cs3d-simplification-council-of-european-union-adopts-final-text-t-simplify-sustainability-reporting-and-due-diligence-requirements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regulation Tomorrow&lt;/a&gt; · &lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt; · &lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/european-commission-publishes-delegated-act-on-revised-esrs-and-voluntary-sustainability-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG&lt;/a&gt;. Il recepimento italiano dell&#x27;Omnibus non è emerso dalle ricerche: verificalo.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Nomina tre differenze tra NFRD e CSRD.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Standard: a scelta (GRI) → ESRS obbligatori. Collocazione: report separato possibile → sezione della relazione sulla gestione. Assurance: solo coerenza → limited assurance. In più, la CSRD introduce double materiality e digital tagging.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Come può il clima entrare nel bilancio finanziario?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Attraverso impairment di attività esposte al rischio, accantonamenti (provisions) e revisione delle vite utili, quindi degli ammortamenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; ESRS e IFRS S1/S2: chi li emana e dove valgono?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ESRS: sviluppati da EFRAG e adottati dalla Commissione, valgono nell&#x27;UE con la CSRD. IFRS S1/S2: emanati dall&#x27;ISSB, sono il riferimento globale, adottato dalle singole giurisdizioni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-systems&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte B · Dalle regole alla tenuta dei conti&lt;/div&gt;&lt;h2&gt;Stessi standard, motori diversi&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;I principi contabili dicono &lt;b&gt;cosa&lt;/b&gt; rilevare, &lt;b&gt;come&lt;/b&gt; misurarlo e &lt;b&gt;come&lt;/b&gt; presentarlo, ma non dicono come tenere i libri. Nel mondo della partita doppia esistono due «sistemi» contabili, e dalle stesse operazioni producono conti economici di forma diversa.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--slate)&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Sistema patrimoniale &lt;small&gt;(patrimonial, asset-based)&lt;/small&gt;&lt;/h4&gt;
      &lt;p&gt;Ogni scrittura si legge come una variazione di attività/passività (&lt;b&gt;VP&lt;/b&gt;) oppure come una variazione del netto attraverso il risultato (&lt;b&gt;VE&lt;/b&gt;). Rimanenze e semilavorati sono seguiti &lt;b&gt;in continuo&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;muted&quot; style=&quot;font-size:.9rem;margin:0&quot;&gt;Fabio Besta, &lt;i&gt;La Ragioneria&lt;/i&gt; (1891-1916); W.A. Paton, &lt;i&gt;Accounting Theory&lt;/i&gt; (1922); prassi anglosassone: &lt;span class=&quot;term&quot;&gt;cost of goods sold&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--brick)&quot;&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Sistema del reddito &lt;small&gt;(income accounting system)&lt;/small&gt;&lt;/h4&gt;
      &lt;p&gt;Ogni scrittura si legge come una variazione finanziaria (&lt;b&gt;VF&lt;/b&gt;: cassa, crediti, debiti) oppure come una variazione economica (&lt;b&gt;VE&lt;/b&gt;: costi e ricavi). Le rimanenze compaiono &lt;b&gt;solo a fine anno&lt;/b&gt;, come rettifica.&lt;/p&gt;
      &lt;p class=&quot;muted&quot; style=&quot;font-size:.9rem;margin:0&quot;&gt;Gino Zappa, &lt;i&gt;Tendenze nuove&lt;/i&gt; (1927) e &lt;i&gt;Il reddito di impresa&lt;/i&gt; (1937); Onida, Amaduzzi; E. Schmalenbach, &lt;i&gt;Dynamische Bilanz&lt;/i&gt; (1919).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La notazione&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Regole di Dare e Avere nei due sistemi&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;225&quot; y=&quot;24&quot; class=&quot;slatef serif&quot; font-size=&quot;17&quot;&gt;Patrimoniale&lt;/text&gt;
        &lt;text x=&quot;675&quot; y=&quot;24&quot; class=&quot;brickf serif&quot; font-size=&quot;17&quot;&gt;Reddito&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Dare (Debit)&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Avere (Credit)&lt;/text&gt;
        &lt;text x=&quot;600&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Dare (Debit)&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Avere (Credit)&lt;/text&gt;
        &lt;line x1=&quot;225&quot; y1=&quot;38&quot; x2=&quot;225&quot; y2=&quot;230&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;675&quot; y1=&quot;38&quot; x2=&quot;675&quot; y2=&quot;230&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;line x1=&quot;80&quot; y1=&quot;62&quot; x2=&quot;370&quot; y2=&quot;62&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;530&quot; y1=&quot;62&quot; x2=&quot;820&quot; y2=&quot;62&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;rect x=&quot;90&quot; y=&quot;76&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--slate-bg)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;104&quot; style=&quot;fill:var(--slate)&quot; font-weight=&quot;700&quot;&gt;VP +&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;124&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;attività ↑&lt;/text&gt;
        &lt;rect x=&quot;240&quot; y=&quot;76&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--slate-bg)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;104&quot; style=&quot;fill:var(--slate)&quot; font-weight=&quot;700&quot;&gt;VP −&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;124&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;attività ↓&lt;/text&gt;
        &lt;rect x=&quot;90&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE −&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;costo&lt;/text&gt;
        &lt;rect x=&quot;240&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE +&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;ricavo / utile&lt;/text&gt;
        &lt;rect x=&quot;540&quot; y=&quot;76&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;104&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;700&quot;&gt;VF +&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;124&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;cassa, crediti ↑&lt;/text&gt;
        &lt;rect x=&quot;690&quot; y=&quot;76&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;104&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;700&quot;&gt;VF −&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;124&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;cassa ↓, debiti ↑&lt;/text&gt;
        &lt;rect x=&quot;540&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE −&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;costo&lt;/text&gt;
        &lt;rect x=&quot;690&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE +&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;ricavo&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Notazione delle slide: &lt;b&gt;VP ±&lt;/b&gt; variazione di attività o passività; &lt;b&gt;VE ±&lt;/b&gt; variazione economica (ricavo/costo); &lt;b&gt;VF ±&lt;/b&gt; variazione finanziaria (cassa, crediti, debiti). Le sigle vengono dall&#x27;italiano: variazione patrimoniale, economica, finanziaria. La posizione in Dare/Avere è ricostruita dagli esempi delle slide. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;L&#x27;idea di fondo &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il &lt;b&gt;patrimoniale&lt;/b&gt; guarda allo &lt;i&gt;stock&lt;/i&gt;: vuole conoscere in ogni momento quanto vale ciò che l&#x27;impresa possiede, e il reddito è la variazione di quel valore. Il &lt;b&gt;reddito&lt;/b&gt; guarda al &lt;i&gt;flusso&lt;/i&gt;: ogni operazione di scambio con l&#x27;esterno ha una faccia finanziaria (denaro, crediti, debiti) e una economica (costo o ricavo). Il capitale di fine anno è un residuo, fatto di costi e ricavi «sospesi» da rinviare al futuro, come le rimanenze.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; In quale sistema le rimanenze sono seguite in continuo durante l&#x27;anno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nel sistema patrimoniale. Nel sistema del reddito entrano solo con la rettifica di fine anno.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Associa ciascun autore a un sistema: Besta, Zappa, Paton, Schmalenbach.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Patrimoniale: Besta, Paton. Reddito: Zappa (con Onida e Amaduzzi), Schmalenbach.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Gli standard contabili dicono come tenere i libri?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: dicono cosa rilevare, come misurarlo e come presentarlo. Il «motore» di registrazione è una scelta separata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-bottle&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte B · La notazione su una bottiglia d&#x27;acqua&lt;/div&gt;&lt;h2&gt;Compro a 0,30, vendo a 1,00&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Patrimoniale (Besta)&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Reddito (Zappa)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;

        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Inventory (bottiglia)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt; Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt; Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Profit on sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,70&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Conto economico&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Profit on sales 0,70 → EBIT 0,70. Il conto economico mostra &lt;b&gt;margini&lt;/b&gt;, non acquisti.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Dare&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Avere&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt; Purchase cost&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vf&quot;&gt;VF−&lt;/span&gt; Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0,30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vf&quot;&gt;VF+&lt;/span&gt; Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Sales revenue&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td colspan=&quot;3&quot; class=&quot;muted&quot;&gt;(nessun conto di magazzino durante l&#x27;anno)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Conto economico&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Ricavi 1,00 − acquisti 0,30 → EBIT 0,70. Il conto economico mostra &lt;b&gt;flussi lordi per natura&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

        &lt;rect x=&quot;170&quot; y=&quot;74&quot; width=&quot;700&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;brickf&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;92&quot; fill=&quot;var(--paper)&quot;&gt;Sales revenue 1,00&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;106&quot; width=&quot;210&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;124&quot;&gt;Purchases −0,30&lt;/text&gt;
        &lt;rect x=&quot;380&quot; y=&quot;106&quot; width=&quot;490&quot; height=&quot;26&quot; rx=&quot;4&quot; fill=&quot;none&quot; class=&quot;bricks&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;390&quot; y=&quot;124&quot; class=&quot;brickf&quot;&gt;EBIT 0,70&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot;&gt;Same profit, different information.&lt;/text&gt;
