  &lt;p class=&quot;lead&quot;&gt;I primi 20 minuti ripassano tre esercizi. Servono a ripassare la partita doppia, ma soprattutto preparano la domanda della lezione: &lt;i&gt;perché la cassa cresce mentre l&#x27;azienda è in perdita?&lt;/i&gt;&lt;/p&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Un&#x27;impresa nasce il 1° gennaio con capitale 20.000 (16.000 in cassa e un edificio da 4.000), compra un terreno, compra e vende merci, emette obbligazioni, rivende il terreno con plusvalenza e a fine anno ammortizza l&#x27;edificio.&lt;/p&gt;

        &lt;tr&gt;&lt;td&gt;15 giu&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.200&lt;/td&gt;&lt;/tr&gt;

      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Da notare &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;L&#x27;8 giugno la vendita genera &lt;b&gt;due&lt;/b&gt; scritture: il ricavo (1.200) e lo scarico del magazzino come &lt;span class=&quot;term&quot;&gt;cost of goods sold&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(costo del venduto)&lt;/span&gt; per 1.000. È esattamente la logica della «variante anglosassone» del sistema patrimoniale che si vede nella parte B. I debiti verso fornitori si chiudono a zero (4.000 + 2.000 − 2.000 − 4.000), perciò nello stato patrimoniale non compaiono. La plusvalenza sul terreno (1.000) è un provento che non viene dall&#x27;attività tipica: senza quella, l&#x27;utile sarebbe −100.&lt;/p&gt;
        &lt;p&gt;Verifica della cassa: 16.000 − 2.000 + 1.200 − 2.000 − 100 + 2.000 − 4.000 + 7.000 = &lt;b&gt;18.100&lt;/b&gt;.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;p&gt;Le slide riportano solo il risultato dell&#x27;esercizio 6:&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;attività 67 + 19 + 105 = 191 = passività 75 + capitale e utile 116&lt;/div&gt;
      &lt;p&gt;L&#x27;utile del periodo è &lt;b&gt;16 = 20 − 4&lt;/b&gt;. Il punto chiave: le &lt;b&gt;25&lt;/b&gt; di merce comprata a credito &lt;b&gt;non entrano nell&#x27;utile&lt;/b&gt;, perché non sono ancora state vendute. Restano nell&#x27;attivo come rimanenze e hanno come contropartita un debito.&lt;/p&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Perché conta &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Questo è il &lt;span class=&quot;term&quot;&gt;matching principle&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(principio di correlazione costi-ricavi)&lt;/span&gt;: un acquisto diventa costo dell&#x27;esercizio solo quando la merce genera ricavo. È la stessa idea che nella parte B il sistema del reddito realizza con la rettifica delle rimanenze finali.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;p&gt;Bergamo Bikes nasce con 50.000 di capitale e 20.000 di mutuo bancario al 5%. Compra attrezzature per 24.000 (vita utile 6 anni), 100 bici a 300 l&#x27;una e ne vende 70 per 35.000 (500 l&#x27;una). Paga affitto anticipato per 12 mesi (6.000) e salari (8.000). Le rettifiche A1–A3 sono le scritture di assestamento di fine periodo.&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Libro giornale e rettifiche&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Importo&lt;/th&gt;&lt;/tr&gt;

      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;EBIT&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;Earnings Before Interest and Taxes&lt;/span&gt;): il risultato operativo, prima degli oneri finanziari e delle imposte. Qui è −1.000; con gli interessi si arriva alla perdita netta di −1.250.&lt;/div&gt;
    &lt;/div&gt;

  &lt;h3&gt;La domanda che apre la lezione: cassa +34.000, perdita 1.250. Come?&lt;/h3&gt;
  &lt;p&gt;Le slide rispondono così: i finanziamenti (70.000) non sono ricavi; l&#x27;attrezzatura pagata 24.000 è costo solo per 4.000; le bici invendute (9.000) non sono costo; i crediti (15.000) sono ricavi non ancora incassati; l&#x27;affitto anticipato (3.000) non è costo. Il grafico ricostruisce il passaggio dalla perdita alla cassa voce per voce. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 900 340&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata dalla perdita di 1.250 alla cassa di 34.000&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Ricostruzione mia, con il &lt;span class=&quot;term&quot;&gt;indirect method&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(metodo indiretto del rendiconto finanziario: si parte dal risultato e si tolgono le voci non monetarie)&lt;/span&gt;. Le voci operative danno −12.000, gli investimenti −24.000, i finanziamenti +70.000.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Break-even: quante bici servivano?&lt;/h3&gt;
  &lt;p&gt;Ogni bici si vende a 500 e costa 300, quindi lascia un &lt;span class=&quot;term&quot;&gt;contribution margin&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(margine di contribuzione: prezzo meno costo variabile)&lt;/span&gt; di 200. I costi fissi del periodo sono 8.000 + 3.000 + 4.000 + 250 = &lt;b&gt;15.250&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Break-even = costi fissi ÷ margine unitario = 15.250 ÷ 200 ≈ 76 bici&lt;/div&gt;
  &lt;div class=&quot;box line&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;be&quot;&gt;Bici vendute&lt;/label&gt;&lt;output id=&quot;be-n&quot;&gt;70&lt;/output&gt;&lt;input id=&quot;be&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;be-svg&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Risultato in funzione delle bici vendute&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;p id=&quot;be-txt&quot; class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Nota: con 76 bici il risultato è ancora −50; la prima bici che porta in utile è la 77ª. Il simulatore tiene fissi i costi del periodo e il prezzo di 500.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Perché i 70.000 del capitale e del mutuo non entrano nel conto economico?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sono &lt;i&gt;fonti di finanziamento&lt;/i&gt;: aumentano la cassa ma anche il patrimonio netto (capitale) o i debiti (mutuo). Non derivano dalla vendita di beni o servizi, quindi non sono ricavi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Un&#x27;attrezzatura da 24.000 con vita utile 6 anni: quanto costo va nel primo anno, e perché?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;4.000, cioè l&#x27;ammortamento. Il costo si distribuisce sugli anni in cui il bene contribuisce a produrre ricavi; il resto (20.000) rimane nell&#x27;attivo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Nell&#x27;esercizio 6, perché le 25 di merce acquistata non riducono l&#x27;utile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché non è ancora stata venduta: resta in magazzino come rimanenza (attività), con un debito di pari importo verso il fornitore. Diventerà costo del venduto quando sarà venduta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;4.&lt;/b&gt; Calcola gli interessi maturati su 20.000 al 5% per 3 mesi.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;20.000 × 5% × 3/12 = 250. Vanno rilevati come costo (Interest expense) con contropartita un debito (Accrued interest payable), anche se non sono ancora stati pagati.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-world&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · Chi scrive le regole&lt;/div&gt;&lt;h2&gt;La contabilità nel mondo: cinque famiglie di regole&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;La contabilità si sviluppa dove si sviluppa l&#x27;economia. Per questo non esiste una regola unica, ma «famiglie» di regole, ognuna figlia di un modo diverso di finanziare le imprese.&lt;/p&gt;

  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;IFRS&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;US GAAP&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Dir. 2013/34/EU&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Leggi nazionali&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Cash basis&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h4&gt;IFRS (IAS/IFRS)&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Chi le emana:&lt;/b&gt; lo IASB (IFRS Foundation), con sede a Londra. &lt;b&gt;Chi le usa:&lt;/b&gt; le società quotate in oltre 140 giurisdizioni; nell&#x27;UE sono obbligatorie per i bilanci consolidati delle quotate dal 2005. &lt;b&gt;Logica:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;principle-based&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(basate su principi generali da applicare con giudizio professionale)&lt;/span&gt;; &lt;span class=&quot;term&quot;&gt;investors first&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(il destinatario principale è chi investe nel capitale)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;US GAAP&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Chi le emana:&lt;/b&gt; il FASB (Financial Accounting Standards Board), sotto la vigilanza della SEC (Securities and Exchange Commission). &lt;b&gt;Chi le usa:&lt;/b&gt; le società statunitensi; negli USA gli emittenti esteri possono usare anche gli IFRS. &lt;b&gt;Logica:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;rule-based&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(fatte di regole molto dettagliate, con soglie e casistiche precise)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;Direttiva 2013/34/UE&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Chi la emana:&lt;/b&gt; Parlamento europeo e Consiglio. &lt;b&gt;Chi la usa:&lt;/b&gt; tutte le società di capitali dell&#x27;UE, attraverso le leggi nazionali che la recepiscono. &lt;b&gt;Logica:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;minimum harmonisation&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(armonizzazione minima: fissa un nucleo comune e lascia molte opzioni agli Stati)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;Leggi e principi nazionali&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Chi li emana:&lt;/b&gt; i parlamenti e gli standard setter nazionali; in Italia il Codice civile più i principi OIC. &lt;b&gt;Chi li usa:&lt;/b&gt; le società non quotate. &lt;b&gt;Logica:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;creditor protection&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(tutela dei creditori, quindi prudenza e capitale da preservare)&lt;/span&gt; e stretto legame con la fiscalità.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;Cash basis&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Chi la usa:&lt;/b&gt; regole del settore pubblico e, in alcuni Paesi, le micro-imprese: piccoli enti e parti della pubblica amministrazione. &lt;b&gt;Logica:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;cash in, cash out&lt;/span&gt;, cioè si registra quando il denaro entra o esce.&lt;/p&gt;
    &lt;p class=&quot;muted&quot;&gt;&lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt; Le altre quattro famiglie usano invece l&#x27;&lt;span class=&quot;term&quot;&gt;accrual basis&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(competenza economica)&lt;/span&gt;: costi e ricavi si imputano al periodo in cui maturano, a prescindere dall&#x27;incasso. Bergamo Bikes mostra la differenza: con la cassa il periodo sembrerebbe +34.000, per competenza è −1.250.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

      &lt;text x=&quot;840&quot; y=&quot;168&quot; class=&quot;mut&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;destinatari: creditori e fisco&lt;/text&gt;

        &lt;circle cx=&quot;130&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;US GAAP&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;rule-based&lt;/text&gt;
        &lt;circle cx=&quot;250&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;principle-based&lt;/text&gt;
        &lt;circle cx=&quot;450&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;sagef&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;Dir. 2013/34&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;opzioni nazionali&lt;/text&gt;
        &lt;circle cx=&quot;640&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;C.c. + OIC&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;prudenza, fisco&lt;/text&gt;
        &lt;circle cx=&quot;780&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;brickf&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;780&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;Cash basis&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;entrate/uscite&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot;&gt;tre fattori: chi finanzia le imprese · chi tutela i creditori · quanto la contabilità è vicina al fisco&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt; Schema mio: la posizione sull&#x27;asse è indicativa e serve a visualizzare il «perché così tante?» della slide.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Perché così tante?&lt;/h4&gt;&lt;p&gt;Perché la contabilità segue l&#x27;economia che la usa: chi finanzia le imprese (banche o mercati), chi tutela i creditori, quanto la contabilità è vicina al diritto tributario. Le due «culture» dietro le regole sono i due sistemi contabili della parte B.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Principle-based&lt;/h4&gt;&lt;p&gt;Pochi principi generali e molta attenzione alla sostanza economica. Chi prepara il bilancio deve esercitare giudizio, e il risultato è più flessibile ma meno uniforme. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Rule-based&lt;/h4&gt;&lt;p&gt;Regole dettagliate, soglie numeriche, guide per settore. È più facile da verificare, ma invita a «costruire» operazioni che stiano appena sotto la soglia. &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Quali tre fattori spiegano perché esistono tante famiglie di regole contabili?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Chi finanzia le imprese (banche o mercati), chi tutela i creditori e quanto la contabilità è legata al diritto tributario.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Chi emana gli US GAAP e chi vigila?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il FASB, sotto la vigilanza della SEC.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Che cosa vuol dire «minimum harmonisation» per la Direttiva 2013/34?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La direttiva fissa un nucleo comune obbligatorio ma lascia agli Stati membri molte opzioni (schemi, criteri, soglie). Il risultato è un&#x27;armonizzazione parziale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-eu&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte A · The EU toolbox&lt;/div&gt;&lt;h2&gt;Regulation, directive, recommendation&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;L&#x27;UE ha tre strumenti, e ciascuno incide in modo diverso sulla &lt;span class=&quot;term&quot;&gt;comparability&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(comparabilità tra bilanci di imprese e Paesi diversi)&lt;/span&gt;.&lt;/p&gt;

        &lt;g&gt;&lt;rect x=&quot;35&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;rect x=&quot;125&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;rect x=&quot;215&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;/g&gt;
        &lt;text x=&quot;150&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;comparabilità &lt;b&gt;massima&lt;/b&gt;&lt;/text&gt;
        &lt;!-- directive --&gt;
        &lt;rect x=&quot;320&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;bgf&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;pcf&quot;&gt;Directive&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;obiettivi e cornice&lt;/text&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M450 76 L360 130&quot;/&gt;&lt;path d=&quot;M450 76 L450 130&quot;/&gt;&lt;path d=&quot;M450 76 L540 130&quot;/&gt;&lt;/g&gt;
        &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;325&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;150&quot;&gt;legge naz.&lt;/text&gt;&lt;rect x=&quot;415&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;150&quot;&gt;legge naz.&lt;/text&gt;&lt;rect x=&quot;505&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;150&quot;&gt;legge naz.&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M360 160 V180&quot;/&gt;&lt;path d=&quot;M450 160 V180&quot;/&gt;&lt;path d=&quot;M540 160 V180&quot;/&gt;&lt;/g&gt;
        &lt;rect x=&quot;335&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;341&quot; y=&quot;200&quot; width=&quot;38&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;ochref&quot;/&gt;
        &lt;rect x=&quot;425&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;431&quot; y=&quot;190&quot; width=&quot;38&quot; height=&quot;34&quot; rx=&quot;3&quot; class=&quot;slatef&quot;/&gt;
        &lt;rect x=&quot;515&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;521&quot; y=&quot;210&quot; width=&quot;38&quot; height=&quot;14&quot; rx=&quot;3&quot; class=&quot;brickf&quot;/&gt;
        &lt;text x=&quot;450&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;comparabilità &lt;b&gt;parziale&lt;/b&gt;: stesso scheletro, «carne» diversa&lt;/text&gt;
        &lt;!-- recommendation --&gt;
        &lt;rect x=&quot;620&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;bgf&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;pcf&quot;&gt;Recommendation&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;non vincolante&lt;/text&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 6&quot;&gt;&lt;path d=&quot;M750 76 L660 180&quot;/&gt;&lt;path d=&quot;M750 76 L750 180&quot;/&gt;&lt;path d=&quot;M750 76 L840 180&quot;/&gt;&lt;/g&gt;
        &lt;rect x=&quot;635&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;&lt;rect x=&quot;725&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot; opacity=&quot;.5&quot;/&gt;&lt;rect x=&quot;815&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;
        &lt;text x=&quot;750&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;comparabilità &lt;b&gt;nulla&lt;/b&gt;, salvo adesione&lt;/text&gt;
