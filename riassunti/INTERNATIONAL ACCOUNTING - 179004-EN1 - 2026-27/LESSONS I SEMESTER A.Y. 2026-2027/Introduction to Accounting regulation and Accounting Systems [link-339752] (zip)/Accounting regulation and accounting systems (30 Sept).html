&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-cycle&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;10&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte B · Worked example&lt;/div&gt;&lt;h2&gt;Un ciclo produttivo, tre serie di scritture&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Impresa industriale, importi in euro. Lo stesso ciclo si registra in tre modi: &lt;b&gt;A&lt;/b&gt; patrimoniale secondo Besta (profit on sales), &lt;b&gt;B&lt;/b&gt; patrimoniale variante anglosassone (revenues e cost of goods sold), &lt;b&gt;C&lt;/b&gt; sistema del reddito (Zappa).&lt;/p&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Evento&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Acquisto di materie prime, pagate con banca: 400.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Avvio della produzione: tutte le materie prime vanno in &lt;span class=&quot;term&quot;&gt;work in progress&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(WIP, semilavorati / prodotti in corso di lavorazione)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Salari pagati con banca: 500.000, di cui 400.000 di produzione e 100.000 SG&amp;amp;A &lt;span class=&quot;gl&quot;&gt;(Selling, General &amp;amp; Administrative: costi commerciali e amministrativi)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;I salari di produzione vengono capitalizzati sul WIP&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Produzione completata: prodotti finiti 800.000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Tutti i prodotti finiti venduti, incasso in banca: 1.100.000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;Prevedi prima di guardare:&lt;/b&gt; l&#x27;EBIT sarà uguale nei tre sistemi? E il numero di scritture?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;EBIT &lt;b&gt;uguale&lt;/b&gt;: 200.000 in tutti e tre. Scritture &lt;b&gt;diverse&lt;/b&gt;: 6 in A, 7 in B (la vendita si sdoppia), 3 in C (la produzione è invisibile fino a fine anno).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;stepper&quot; id=&quot;cyc&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;steplab muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;h4 id=&quot;cyc-ev&quot; class=&quot;serif&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/h4&gt;
    &lt;div class=&quot;cols3&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;A · Besta&lt;/h4&gt;&lt;div id=&quot;cyc-a&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;B · Anglo-Saxon&lt;/h4&gt;&lt;div id=&quot;cyc-b&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;C · Zappa&lt;/h4&gt;&lt;div id=&quot;cyc-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin-top:12px;font-size:.9rem&quot;&gt;
      &lt;div class=&quot;info&quot; id=&quot;cyc-stock&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;info&quot; id=&quot;cyc-count&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;I tre conti economici fino all&#x27;EBIT&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;A · Besta&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Profit on sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Wages (SG&amp;amp;A)&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;B · Anglo-Saxon&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.100.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(800.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;SG&amp;amp;A&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;C · Zappa&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.100.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw materials&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(400.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(500.000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200.000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Che cosa dice ciascuno &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;A mostra solo il margine sulle vendite. B aggiunge ricavi e costo del prodotto venduto, quindi il &lt;span class=&quot;term&quot;&gt;gross profit&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(margine lordo industriale)&lt;/span&gt;. C mostra i fattori produttivi consumati per natura (materie, lavoro) ma non dice quanto è costato il prodotto venduto. Notate che in A e B i 400.000 di salari di produzione «spariscono» dal conto economico (scrittura 4) e rientrano dentro il costo del prodotto.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-unsold&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;11&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte B · E se una parte resta invenduta?&lt;/div&gt;&lt;h2&gt;Le rimanenze finali&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Stesso ciclo, eventi 1-5 invariati. Nella slide si vende solo l&#x27;80% dei prodotti finiti, per 880.000. Muovi il cursore per vedere che cosa succede con altre percentuali.&lt;/p&gt;
  &lt;div class=&quot;box line&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;us&quot;&gt;Quota di prodotti finiti venduta&lt;/label&gt;&lt;output id=&quot;us-n&quot;&gt;80%&lt;/output&gt;&lt;input id=&quot;us&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table id=&quot;us-a&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table id=&quot;us-c&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:8px 0 0&quot;&gt;&lt;svg id=&quot;us-svg&quot; viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Confronto dei due conti economici&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Barre in migliaia di euro. Nel sistema del reddito la variazione delle rimanenze si somma ai ricavi e «compensa» i costi di produzione non ancora venduti.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;EBIT = 300.000 × quota venduta − 100.000 &amp;nbsp;·&amp;nbsp; uguale nei due sistemi&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;La lezione&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Nel sistema del reddito il magazzino entra nei libri &lt;b&gt;solo&lt;/b&gt; con la rettifica di fine anno, le &lt;b&gt;«rimanenze finali»&lt;/b&gt; (&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Variazione rimanenze / &lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Inventory), che corregge i costi del periodo. Stesso EBIT, stesso stato patrimoniale: cambia &lt;b&gt;quando e come&lt;/b&gt; l&#x27;informazione viene prodotta.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Con l&#x27;80% venduto, quanto vale l&#x27;EBIT e quanto il magazzino prodotti finiti?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;EBIT 140.000 in entrambi i sistemi; magazzino 160.000 in entrambi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Perché nel sistema del reddito la variazione delle rimanenze ha segno «+»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché i costi di materie e lavoro (900.000) sono stati spesati per intero, ma una parte (160.000) riguarda beni non ancora venduti. La rettifica toglie quella parte dai costi del periodo rinviandola al futuro: per il conto economico è un componente positivo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Nella variante anglosassone, dove «stanno» quei 160.000?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Non sono mai passati dal conto economico: sono rimasti nel conto Finished goods (attività) perché il cost of goods sold scarica solo l&#x27;80% × 800.000 = 640.000.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-formats&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;12&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte B · Dove vivono oggi i due sistemi&lt;/div&gt;&lt;h2&gt;Gli schemi di conto economico&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Sistema del reddito · &lt;i&gt;by nature&lt;/i&gt;&lt;/th&gt;&lt;th&gt;Sistema patrimoniale · &lt;i&gt;by function&lt;/i&gt;&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Schema&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ricavi, variazione delle rimanenze, materie prime, servizi, personale, ammortamenti&lt;/td&gt;&lt;td&gt;ricavi, costo del venduto, margine lordo, costi di distribuzione, spese amministrative&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Codice civile art. 2425 (obbligatorio); molte imprese dell&#x27;Europa continentale; ammesso da IAS 1 par. 102&lt;/td&gt;&lt;td&gt;prassi anglosassone; US GAAP; ammesso da IAS 1 par. 103 con informativa dei costi per natura&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Punto di forza&lt;/b&gt;&lt;/td&gt;&lt;td&gt;mostra flussi lordi e &lt;span class=&quot;term&quot;&gt;value added&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(valore aggiunto)&lt;/span&gt;; facile collegamento con fisco e contabilità nazionale&lt;/td&gt;&lt;td&gt;mostra i margini (gross profit) e il costo del prodotto venduto&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Debolezza&lt;/b&gt;&lt;/td&gt;&lt;td&gt;nessun margine lordo; servono le rettifiche di fine anno sulle rimanenze&lt;/td&gt;&lt;td&gt;l&#x27;allocazione dei costi alle funzioni richiede giudizio&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Le due forme di conto economico a confronto&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;text x=&quot;20&quot; y=&quot;22&quot; class=&quot;brickf serif&quot; font-size=&quot;16&quot;&gt;By nature (art. 2425 c.c.)&lt;/text&gt;
        &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;34&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;brickf&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;51&quot; fill=&quot;var(--paper)&quot;&gt;Ricavi&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;brickf&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;79&quot; fill=&quot;var(--paper)&quot;&gt;± Variazione rimanenze&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;90&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;107&quot;&gt;− Materie prime&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;118&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;135&quot;&gt;− Servizi&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;146&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;163&quot;&gt;− Personale&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;174&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;191&quot;&gt;− Ammortamenti&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;206&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; class=&quot;bricks&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;225&quot; font-weight=&quot;600&quot;&gt;= Risultato operativo&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;480&quot; y=&quot;22&quot; class=&quot;slatef serif&quot; font-size=&quot;16&quot;&gt;By function (IAS 1 par. 103)&lt;/text&gt;
        &lt;g&gt;&lt;rect x=&quot;480&quot; y=&quot;34&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;slatef&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; fill=&quot;var(--paper)&quot;&gt;Revenue&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;79&quot;&gt;− Cost of sales&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;90&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; class=&quot;slatef&quot; opacity=&quot;.35&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;109&quot; font-weight=&quot;600&quot;&gt;= Gross profit&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;122&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;139&quot;&gt;− Distribution costs&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;150&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;167&quot;&gt;− Administrative expenses&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;206&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; class=&quot;slates&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;225&quot; font-weight=&quot;600&quot;&gt;= Operating profit&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le stesse operazioni, raggruppate per natura (che cosa si è consumato) o per funzione (a che cosa è servito). &lt;span class=&quot;from&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot; style=&quot;--pc:var(--slate);--pc-bg:var(--slate-bg)&quot;&gt;&lt;h4&gt;IFRS 18 (dal 2027)&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Mantiene la scelta by nature / by function, ma aggiunge categorie obbligatorie (&lt;i&gt;operating, investing, financing&lt;/i&gt;), un subtotale di &lt;span class=&quot;term&quot;&gt;operating profit&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(risultato operativo)&lt;/span&gt; e l&#x27;informativa dei costi per natura quando si usa lo schema per funzione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Osservazione finale&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il sistema patrimoniale conosce in ogni momento il valore delle attività dell&#x27;impresa. Il sistema del reddito misura il reddito del periodo a partire dai ricavi realizzati e dai costi correlati. Stessa partita doppia, due filosofie.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Quale schema impone l&#x27;art. 2425 c.c., e a quale sistema contabile corrisponde?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lo schema per natura, che corrisponde al sistema del reddito (con la variazione delle rimanenze tra i componenti positivi).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Un&#x27;impresa IFRS che presenta per funzione che cosa deve aggiungere?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;informativa dei costi per natura (IAS 1 par. 103; anche con l&#x27;IFRS 18).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Un punto di forza e un punto debole di ciascuno schema.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;By nature: mostra flussi lordi e valore aggiunto, ma non il margine lordo. By function: mostra margine e costo del venduto, ma l&#x27;allocazione alle funzioni richiede giudizio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;s-wrap&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;✦&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Wrap-up&lt;/div&gt;&lt;h2&gt;Tre domande d&#x27;esame e la risposta alla domanda iniziale&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;«Sapresti rispondere in cinque righe?» Prova prima a voce, poi apri la traccia di risposta.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Perché due società soggette alla stessa direttiva UE possono presentare bilanci diversi, mentre due società soggette a un regolamento UE no?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il regolamento è direttamente applicabile: stesso testo, stessa data, in tutti gli Stati, quindi comparabilità massima. La direttiva fissa obiettivi e una cornice, ma ogni Stato la recepisce con una legge propria, con opzioni e tempi propri (es. LIFO ammesso in Italia, schemi, soglie). Stesso scheletro, carne diversa: comparabilità solo parziale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Una S.p.A. italiana non quotata con 300 dipendenti: può adottare gli IFRS? Deve? Quali regole governano la distribuzione dell&#x27;utile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Può, come scelta facoltativa e irrevocabile, perché è una società «più grande» che non rientra nel bilancio abbreviato. Non deve, perché non è quotata né banca né assicurazione: il default è Codice civile + OIC. La distribuzione dell&#x27;utile, le riserve e l&#x27;approvazione restano regolate dal Codice civile in ogni caso. Se adotta gli IFRS vive su tre livelli: IFRS, Codice civile, fisco.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Registra la vendita di merci che costano 80 a 100 nel sistema patrimoniale (anglosassone) e in quello del reddito, e spiega perché i conti economici differiscono.&lt;/summary&gt;&lt;div&gt;
    &lt;div class=&quot;cols3&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Patrimoniale (Anglo-Saxon)&lt;/h4&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt;Cash D 100&lt;br&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt;Revenues A 100&lt;/div&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt;COGS D 80&lt;br&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt;Inventory A 80&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Reddito (Zappa)&lt;/h4&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag vf&quot;&gt;VF+&lt;/span&gt;Cash D 100&lt;br&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt;Revenues A 100&lt;/div&gt;&lt;div class=&quot;entry none&quot;&gt;L&#x27;acquisto era già stato registrato come costo (&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt; Purchases 80); nessun conto di magazzino durante l&#x27;anno.&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Conti economici&lt;/h4&gt;&lt;p style=&quot;font-size:.92rem&quot;&gt;Patrimoniale: Revenues 100 − COGS 80 = &lt;b&gt;gross profit 20&lt;/b&gt;. Reddito: Revenues 100 − Purchases 80 = 20, per natura e senza margine lordo. Stesso utile: uno mostra il margine e il costo del venduto, l&#x27;altro i flussi lordi.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;box&quot; style=&quot;margin-top:22px&quot;&gt;&lt;h4&gt;Ritorno alla domanda iniziale&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Bergamo Bikes segue Codice civile e OIC (non può usare gli IFRS se rientra nel bilancio abbreviato). Il suo conto economico è &lt;b&gt;per natura&lt;/b&gt;, quindi le bici invendute compaiono come &lt;b&gt;variazione delle rimanenze&lt;/b&gt;. L&#x27;impresa di Manchester mostrerebbe &lt;b&gt;cost of sales e gross profit&lt;/b&gt;. Stesse operazioni, stesso utile, quadro diverso.&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;muted&quot; style=&quot;margin-top:14px&quot;&gt;Prossima lezione: Prof. Aprile, &lt;i&gt;the IFRS Conceptual Framework&lt;/i&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;s-refs&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Autori, testi, norme e organismi citati&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Tutto ciò che segue è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: dati trovati con ricerche web (ottobre 2026), ciascuno con il suo link. Per le norme fa fede il testo ufficiale (EUR-Lex, Gazzetta Ufficiale, Normattiva) nella versione consolidata più recente.&lt;/p&gt;

  &lt;h3&gt;Autori e testi&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Fabio Besta, &lt;i&gt;La Ragioneria&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Opera in tre volumi edita da Vallardi, con più edizioni tra il 1891 e il 1922, preceduta dalla prolusione veneziana del 1880. Fonda la teoria dei conti «a valore» e il sistema patrimoniale, centrato sul capitale (attivo − passivo = netto).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la radice del sistema A della lezione; alcuni studi lo collegano alla logica patrimoniale del modello IASB.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://phaidra.unipd.it/detail/o:29121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scansione vol. 2 (Phaidra, Univ. Padova)&lt;/a&gt;&lt;a href=&quot;https://ideas.repec.org/a/taf/acbsfi/v22y2012i3p249-267.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sargiacomo, Servalli, Andrei (2012)&lt;/a&gt;&lt;a href=&quot;https://aisberg.unibg.it/retrieve/e40f7b89-7f5e-afca-e053-6605fe0aeaf2/From%20Capital%20Accounting%20System%20to%20Ias-Ifrs%20through%20a%20national%20and%20international%20literature%20analysis.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Studio UniBG: «From Capital Accounting System to IAS-IFRS»&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Gino Zappa, &lt;i&gt;Il reddito d&#x27;impresa&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Seconda edizione Giuffrè, Milano, 1937, sviluppo delle &lt;i&gt;Tendenze nuove negli studi di ragioneria&lt;/i&gt; (1927). Zappa sposta il centro dal patrimonio al reddito e fonda l&#x27;Economia aziendale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il sistema C della lezione, alla base dello schema per natura dell&#x27;art. 2425 c.c.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://edizionicafoscari.unive.it/en/edizioni/libri/978-88-6969-259-8/gino-zappa-il-fondatore-delleconomia-aziendale/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Coronella, «Gino Zappa: il fondatore dell&#x27;Economia aziendale» (Ed. Ca&#x27; Foscari)&lt;/a&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Gino_Zappa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;W.A. Paton, &lt;i&gt;Accounting Theory&lt;/i&gt; (1922)&lt;/h4&gt;&lt;p&gt;Titolo completo &lt;i&gt;Accounting Theory, with Special Reference to the Corporate Enterprise&lt;/i&gt;, Ronald Press, New York. È il primo libro di Paton, decisivo per le basi teoriche della contabilità negli USA (postulati, costo corrente, avviamento).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il riferimento anglosassone del sistema patrimoniale nelle slide.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/William_Andrew_Paton&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;a href=&quot;https://aaahq.org/node/36713&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;American Accounting Association&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Eugen Schmalenbach, &lt;i&gt;Dynamische Bilanz&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Teoria del bilancio «dinamico» (1919; poi &lt;i&gt;Grundlagen dynamischer Bilanzlehre&lt;/i&gt;, 1920). Il bilancio serve a misurare correttamente il risultato del periodo secondo competenza, e non a fotografare il patrimonio. Tradotto in inglese come &lt;i&gt;Dynamic Accounting&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il corrispettivo tedesco della prospettiva reddituale di Zappa.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://cfuc.vse.cz/artkey/cfu-200901-0006_Devadesat-let-dynamicke-bilancni-teorie-Johanna-Wilhelma-Eugena-Schmalenbacha-1873-1955.php?l=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;«Novant&#x27;anni di teoria dinamica» (Český finanční a účetní časopis, 2009)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme UE&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Reg. (CE) 1606/2002&lt;/h4&gt;&lt;p&gt;Del 19 luglio 2002, in vigore dal 14 settembre 2002. Istituisce il meccanismo UE di endorsement degli IFRS e li rende obbligatori per i consolidati delle quotate. Gli IFRS omologati sono raccolti nel Reg. (CE) 1126/2008.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dir. 2013/34/UE&lt;/h4&gt;&lt;p&gt;Del 26 giugno 2013, recepimento entro il 20 luglio 2015. Sostituisce la IV e la VII direttiva; il bilancio comprende almeno stato patrimoniale, conto economico e nota integrativa e deve dare un quadro fedele (true and fair view).&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;a href=&quot;https://www.legislation.gov.uk/eudr/2013/34&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislation.gov.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dir. (UE) 2022/2464 · CSRD&lt;/h4&gt;&lt;p&gt;Del 14 dicembre 2022; modifica la Dir. 2013/34 e altre norme e sostituisce la NFRD. I primi ESRS sono nel Reg. delegato (UE) 2023/2772, poi semplificati con il Reg. 2026/1563.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/european-commission-publishes-delegated-act-on-revised-esrs-and-voluntary-sustainability-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG: ESRS rivisti&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Omnibus I&lt;/h4&gt;&lt;p&gt;Direttiva che semplifica CSRD e CSDDD: soglie CSRD a più di 1.000 dipendenti e più di 450 milioni di fatturato. Adottata dal Consiglio il 24 febbraio 2026, in vigore da marzo 2026.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt;&lt;a href=&quot;https://www.regulationtomorrow.com/2026/02/omnibus-i-csrd-and-cs3d-simplification-council-of-european-union-adopts-final-text-t-simplify-sustainability-reporting-and-due-diligence-requirements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regulation Tomorrow&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Dir. 2014/95/UE · NFRD&lt;/h4&gt;&lt;p&gt;La direttiva sull&#x27;informativa non finanziaria, recepita in Italia dal D.Lgs. 254/2016 (GU 10 gennaio 2017): obbligo di dichiarazione non finanziaria (DNF) per gli enti di interesse pubblico rilevanti.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.borsaitaliana.it/finanza-sostenibile/materiali/nfrd.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Borsa Italiana&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Rac. 2001/453/CE&lt;/h4&gt;&lt;p&gt;Raccomandazione della Commissione del 30 maggio 2001 su rilevazione, valutazione e informativa delle questioni ambientali nei bilanci e nelle relazioni annuali; vale per conti individuali e consolidati.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reco/2001/453/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Norme italiane&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 38/2005&lt;/h4&gt;&lt;p&gt;Esercita le opzioni del Reg. 1606/2002: l&#x27;art. 2 elenca chi deve applicare gli IFRS. La L. 145/2018 ha aggiunto l&#x27;art. 2-bis, che trasforma in facoltà l&#x27;obbligo per alcuni soggetti non quotati.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ecnews.it/fiscale/societa-e-bilancio/bilancio/soggetti-non-quotati-e-principi-contabili-internazionali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Euroconference News&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 139/2015&lt;/h4&gt;&lt;p&gt;Del 18 agosto 2015, recepisce la Dir. 2013/34: modifica il Codice civile (tra l&#x27;altro introduce l&#x27;art. 2435-ter sulle micro-imprese e il principio di rilevanza sostanziale) e il D.Lgs. 127/1991. Si applica dagli esercizi 2016.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/2016-12-Presentazione-Nuovi-Principi-contabili1.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC: presentazione dei nuovi principi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 125/2024&lt;/h4&gt;&lt;p&gt;Del 6 settembre 2024 (GU n. 212 del 10 settembre 2024), in vigore dal 25 settembre 2024. Recepisce la CSRD e richiede l&#x27;attestazione da parte di un revisore della sostenibilità.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://edotto.com/articolo/con-il-dlgs1252024-recepita-la-direttiva-sulla-sostenibilita&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edotto&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Codice civile, art. 2425&lt;/h4&gt;&lt;p&gt;Fissa lo schema obbligatorio e scalare del conto economico: A) valore della produzione, B) costi della produzione per natura, fino al risultato d&#x27;esercizio. L&#x27;OIC 12 ne guida l&#x27;applicazione.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;OIC e L. 116/2014&lt;/h4&gt;&lt;p&gt;Fondazione di diritto privato nata nel 2001; la L. 116 dell&#x27;11 agosto 2014 le attribuisce il ruolo di emanare i principi contabili nazionali per i bilanci secondo il Codice civile. Pubblica anche l&#x27;elenco dei regolamenti UE di omologazione IFRS.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione OIC&lt;/a&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/category/international-activity/regulations/european-regulations-adopting-international-accounting-standards/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regolamenti UE di omologazione&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Standard e organismi&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Conceptual Framework (2018)&lt;/h4&gt;&lt;p&gt;Emesso a marzo 2018, sostituisce la versione 2010; non è uno standard. Tratta obiettivo dell&#x27;informativa, caratteristiche qualitative, entità che redige il bilancio, prudenza, sostanza sulla forma e incertezza di misurazione.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 18 (sostituisce IAS 1)&lt;/h4&gt;&lt;p&gt;Emesso ad aprile 2024, efficace dal 1° gennaio 2027; omologato nell&#x27;UE con il Reg. (UE) 2026/338. Va applicato retroattivamente, quindi i comparativi 2026 vanno riesposti.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus: endorsement UE&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IAS 8&lt;/h4&gt;&lt;p&gt;I paragrafi 10-12 fissano la gerarchia: in assenza di uno standard applicabile, il management usa il giudizio facendo riferimento a standard simili, al Framework e, se serve, a standard setter con framework simile.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ifrs.org/content/dam/ifrs/publications/html-standards/english/2023/issued/ias8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo IAS 8 (IFRS Foundation)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS S1 e S2 (ISSB)&lt;/h4&gt;&lt;p&gt;Pubblicati il 26 giugno 2023, efficaci dal 2024. S1 contiene i requisiti generali sulle informazioni finanziarie legate alla sostenibilità; S2 riguarda il clima e incorpora indicazioni degli standard SASB.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/non-financial-reporting/international-sustainability-disclosure-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Due Process Handbook&lt;/h4&gt;&lt;p&gt;Il manuale che regola il processo di emanazione: periodo di commento normalmente di 120 giorni (minimo 30 per temi urgenti e circoscritti). Rivisto nel 2024-2026 per includere l&#x27;ISSB.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2026/2024-due-process-handbook-review/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Norwalk Agreement (2002)&lt;/h4&gt;&lt;p&gt;Memorandum d&#x27;intesa FASB-IASB, nato dall&#x27;incontro di settembre 2002 a Norwalk (Connecticut): impegno a rendere compatibili gli standard. Aggiornato nel 2006 e nel 2008.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (IFRS Foundation)&lt;/a&gt;&lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus: convergenza&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;FASB e SEC (US GAAP)&lt;/h4&gt;&lt;p&gt;Dal 2009 la FASB &lt;i&gt;Accounting Standards Codification&lt;/i&gt; è la fonte unica degli US GAAP; le regole SEC restano autonome e la Codification non le sostituisce.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.sec.gov/rules-regulations/2009/08/commission-guidance-regarding-financial-accounting-standards-boards-accounting-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEC, interpretive release 2009&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;EFRAG ed endorsement&lt;/h4&gt;&lt;p&gt;EFRAG pubblica un &lt;i&gt;Endorsement Status Report&lt;/i&gt; periodico, con lo stato di ogni standard nel percorso verso il regolamento UE. È utile per sapere se uno standard è già applicabile nell&#x27;UE.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-endorsement-status-report-update-59&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IAS 39 carve-out (2004)&lt;/h4&gt;&lt;p&gt;Omologazione del 19 novembre 2004 senza la fair value option per le passività e senza alcune regole di copertura di portafoglio. Il primo ritaglio cadde nel 2005, il secondo restò.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2004/September/news1751&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;a href=&quot;https://www.gov.uk/hmrc-internal-manuals/corporate-finance-manual/cfm21020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HMRC CFM21020&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;GRI Standards&lt;/h4&gt;&lt;p&gt;Standard volontari della Global Reporting Initiative, organizzati in Universal (GRI 1, 2, 3), Sector e Topic Standards; gli Universal rivisti valgono dal 2023. Erano la scelta più diffusa sotto la NFRD.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GRI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var fmt=function(n){var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,&quot;.&quot;);return (n&lt;0?&quot;−&quot;:&quot;&quot;)+s};

  /* tabs */
  $$(&quot;.tabset&quot;).forEach(function(ts){
    var btns=$$(&quot;.tabs button&quot;,ts), panels=$$(&quot;.panel&quot;,ts);
    btns.forEach(function(b,i){
      b.setAttribute(&quot;role&quot;,&quot;tab&quot;);
      b.addEventListener(&quot;click&quot;,function(){
        btns.forEach(function(x,j){x.setAttribute(&quot;aria-selected&quot;,j===i?&quot;true&quot;:&quot;false&quot;);panels[j].hidden=j!==i});
      });
    });
  });

  /* generic steppers */
  $$(&quot;.stepper[data-generic]&quot;).forEach(function(st){
    var steps=$$(&quot;.step&quot;,st), i=0, dots=$(&quot;.dots&quot;,st), prev=$(&quot;.prev&quot;,st), next=$(&quot;.next&quot;,st), lab=$(&quot;.steplab&quot;,st);
    steps.forEach(function(_,k){var d=document.createElement(&quot;span&quot;);d.title=&quot;Passo &quot;+(k+1);d.addEventListener(&quot;click&quot;,function(){i=k;show()});dots.appendChild(d)});
    function show(){steps.forEach(function(s,k){s.hidden=k!==i});$$(&quot;span&quot;,dots).forEach(function(d,k){d.className=k&lt;=i?&quot;on&quot;:&quot;&quot;});prev.disabled=i===0;next.disabled=i===steps.length-1;if(lab)lab.textContent=(i+1)+&quot; / &quot;+steps.length}
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;steps.length-1){i++;show()}});
    show();
  });

  /* chip → info boxes */
  $$(&quot;[data-chips]&quot;).forEach(function(g){
    var out=$(g.getAttribute(&quot;data-chips&quot;)), items=$$(&quot;[data-info]&quot;,g);
    items.forEach(function(b){
      var act=function(){items.forEach(function(x){x.classList.remove(&quot;on&quot;)});b.classList.add(&quot;on&quot;);out.innerHTML=b.getAttribute(&quot;data-info&quot;)};
      b.addEventListener(&quot;click&quot;,act);
      b.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();act()}});
    });
  });

  window.__u={$:$,$$:$$,fmt:fmt};
})();
&lt;/script&gt;
&lt;script&gt;
(function(){
  var $=__u.$, $$=__u.$$, fmt=__u.fmt;

  /* waterfall: net loss → cash (Bergamo Bikes) */
  (function(){
    var svg=$(&quot;#wf&quot;); if(!svg) return;
    var items=[
      {l:&quot;Perdita|netta&quot;,v:-1250,t:&quot;tot&quot;},{l:&quot;+ Ammorta-|mento&quot;,v:4000},{l:&quot;+ Interessi|maturati&quot;,v:250},
      {l:&quot;− Bici|invendute&quot;,v:-9000},{l:&quot;− Crediti|non incassati&quot;,v:-15000},{l:&quot;− Affitto|anticipato&quot;,v:-3000},
      {l:&quot;+ Debiti|fornitori&quot;,v:12000},{l:&quot;= Cassa|operativa&quot;,t:&quot;sub&quot;},{l:&quot;− Attrezza-|tura&quot;,v:-24000},
      {l:&quot;+ Capitale|e mutuo&quot;,v:70000},{l:&quot;= Cassa|finale&quot;,t:&quot;sub&quot;}];
    var y=function(v){return 30+(40000-v)*250/80000}, bw=58, step=80, h=&quot;&quot;, cum=0, prevTop=null;
    h+=&#x27;&lt;line x1=&quot;10&quot; x2=&quot;890&quot; y1=&quot;&#x27;+y(0)+&#x27;&quot; y2=&quot;&#x27;+y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
    h+=&#x27;&lt;text x=&quot;12&quot; y=&quot;&#x27;+(y(0)-6)+&#x27;&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;0&lt;/text&gt;&#x27;;
    items.forEach(function(it,i){
      var x=30+i*step, a, b, col;
      if(it.t===&quot;tot&quot;){a=0;b=it.v;cum=it.v;col=&quot;var(--slate)&quot;}
      else if(it.t===&quot;sub&quot;){a=0;b=cum;col=&quot;var(--accent)&quot;}
      else{a=cum;b=cum+it.v;cum=b;col=it.v&gt;=0?&quot;var(--sage)&quot;:&quot;var(--brick)&quot;}
      var top=Math.min(y(a),y(b)), ht=Math.max(2,Math.abs(y(a)-y(b))), val=it.t?(it.t===&quot;sub&quot;?cum:it.v):it.v;
      if(prevTop!==null) h+=&#x27;&lt;line x1=&quot;&#x27;+(x-step+bw)+&#x27;&quot; x2=&quot;&#x27;+x+&#x27;&quot; y1=&quot;&#x27;+y(it.t===&quot;sub&quot;?cum:a)+&#x27;&quot; y2=&quot;&#x27;+y(it.t===&quot;sub&quot;?cum:a)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+top+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+ht+&#x27;&quot; rx=&quot;3&quot; fill=&quot;&#x27;+col+&#x27;&quot;/&gt;&#x27;;
      var ly=(val&gt;=0||it.t===&quot;sub&quot;&amp;&amp;cum&gt;=0)?top-6:top+ht+14;
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+ly+&#x27;&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+(val&gt;0&amp;&amp;!it.t?&quot;+&quot;:&quot;&quot;)+fmt(val)+&#x27;&lt;/text&gt;&#x27;;
      var p=it.l.split(&quot;|&quot;);
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;306&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+p[0]+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;320&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+p[1]+&#x27;&lt;/text&gt;&#x27;;
      prevTop=top;
    });
    svg.innerHTML=h;
  })();

  /* break-even */
  (function(){
    var r=$(&quot;#be&quot;), svg=$(&quot;#be-svg&quot;); if(!r) return;
    var X=function(n){return 50+n*5.7}, Y=function(v){return 20+(6000-v)*190/22000};
    function draw(){
      var n=+r.value, res=200*n-15250, h=&quot;&quot;;
      h+=&#x27;&lt;line x1=&quot;50&quot; x2=&quot;620&quot; y1=&quot;&#x27;+Y(0)+&#x27;&quot; y2=&quot;&#x27;+Y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
      [0,25,50,75,100].forEach(function(t){h+=&#x27;&lt;text x=&quot;&#x27;+X(t)+&#x27;&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+t+&#x27;&lt;/text&gt;&#x27;});
      [-15000,-10000,-5000,0,5000].forEach(function(v){h+=&#x27;&lt;text x=&quot;44&quot; y=&quot;&#x27;+(Y(v)+4)+&#x27;&quot; font-size=&quot;10.5&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot;&gt;&#x27;+fmt(v)+&#x27;&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;620&quot; y1=&quot;&#x27;+Y(v)+&#x27;&quot; y2=&quot;&#x27;+Y(v)+&#x27;&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;.6&quot;/&gt;&#x27;});
      h+=&#x27;&lt;path d=&quot;M&#x27;+X(0)+&#x27; &#x27;+Y(-15250)+&#x27; L&#x27;+X(76.25)+&#x27; &#x27;+Y(0)+&#x27;&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;path d=&quot;M&#x27;+X(76.25)+&#x27; &#x27;+Y(0)+&#x27; L&#x27;+X(100)+&#x27; &#x27;+Y(4750)+&#x27;&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+X(76.25)+&#x27;&quot; x2=&quot;&#x27;+X(76.25)+&#x27;&quot; y1=&quot;20&quot; y2=&quot;210&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;&#x27;+(X(76.25)+5)+&#x27;&quot; y=&quot;32&quot; font-size=&quot;11.5&quot; class=&quot;accf&quot;&gt;break-even ≈ 76&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;circle cx=&quot;&#x27;+X(70)+&#x27;&quot; cy=&quot;&#x27;+Y(-1250)+&#x27;&quot; r=&quot;4&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+(X(70)-6)+&#x27;&quot; y=&quot;&#x27;+(Y(-1250)+18)+&#x27;&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot;&gt;reale: 70 bici&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+X(n)+&#x27;&quot; x2=&quot;&#x27;+X(n)+&#x27;&quot; y1=&quot;&#x27;+Y(0)+&#x27;&quot; y2=&quot;&#x27;+Y(res)+&#x27;&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;&#x27;+X(n)+&#x27;&quot; cy=&quot;&#x27;+Y(res)+&#x27;&quot; r=&quot;7&quot; fill=&quot;var(--ochre)&quot;/&gt;&#x27;;
      h+=&#x27;&lt;text x=&quot;335&quot; y=&quot;246&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;bici vendute&lt;/text&gt;&#x27;;
      svg.innerHTML=h;
      $(&quot;#be-n&quot;).textContent=n;
      $(&quot;#be-txt&quot;).innerHTML=&quot;Ricavi &quot;+fmt(500*n)+&quot; − costo del venduto &quot;+fmt(300*n)+&quot; = margine &quot;+fmt(200*n)+&quot;; − costi fissi 15.250 = &lt;b class=&#x27;&quot;+(res&lt;0?&quot;neg&quot;:&quot;pos&quot;)+&quot;&#x27;&gt;risultato &quot;+fmt(res)+&quot;&lt;/b&gt;. Invendute in magazzino: &quot;+(100-n)+&quot; bici = &quot;+fmt(300*(100-n))+&quot;.&quot;;
    }
    r.addEventListener(&quot;input&quot;,draw); draw();
  })();

  /* production cycle stepper */
  (function(){
    var st=$(&quot;#cyc&quot;); if(!st) return;
    var E=function(lines){return &#x27;&lt;div class=&quot;entry&quot;&gt;&#x27;+lines.join(&quot;&lt;br&gt;&quot;)+&#x27;&lt;/div&gt;&#x27;}, N=function(t){return &#x27;&lt;div class=&quot;entry none&quot;&gt;&#x27;+t+&#x27;&lt;/div&gt;&#x27;};
    var vp=function(s){return &#x27;&lt;span class=&quot;tag vp&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;}, ve=function(s){return &#x27;&lt;span class=&quot;tag ve&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;}, vf=function(s){return &#x27;&lt;span class=&quot;tag vf&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;};
    var S=[
      {ev:&quot;1 · Acquisto materie prime, pagate con banca: 400.000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;RM inventory D 400.000&quot;,vp(&quot;VP−&quot;)+&quot;Bank A 400.000&quot;]), same:1,
       c:E([ve(&quot;VE−&quot;)+&quot;Cost of raw materials D 400.000&quot;,vf(&quot;VF−&quot;)+&quot;Bank A 400.000&quot;]),
       stock:&quot;Materie prime 400.000&quot;, n:[1,1,1]},
      {ev:&quot;2 · Le materie prime entrano in produzione (WIP)&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;WIP inventory D 400.000&quot;,vp(&quot;VP−&quot;)+&quot;RM inventory A 400.000&quot;]), same:1,
       c:N(&quot;Nessuna scrittura: è una trasformazione interna, senza scambio con l&#x27;esterno.&quot;),
       stock:&quot;WIP 400.000 · materie prime 0&quot;, n:[2,2,1]},
      {ev:&quot;3 · Salari pagati con banca: 500.000 (400.000 produzione, 100.000 SG&amp;A)&quot;,
       a:E([ve(&quot;VE−&quot;)+&quot;Wages D 500.000&quot;,vp(&quot;VP−&quot;)+&quot;Bank A 500.000&quot;]), same:1,
       c:E([ve(&quot;VE−&quot;)+&quot;Wages D 500.000&quot;,vf(&quot;VF−&quot;)+&quot;Bank A 500.000&quot;]),
       stock:&quot;WIP 400.000&quot;, n:[3,3,2]},
      {ev:&quot;4 · I salari di produzione si capitalizzano sul WIP&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;WIP inventory D 400.000&quot;,ve(&quot;VE+&quot;)+&quot;Wages (capitalised) A 400.000&quot;]), same:1,
       c:N(&quot;Nessuna scrittura.&quot;),
       stock:&quot;WIP 800.000 (materie 400.000 + lavoro 400.000)&quot;, n:[4,4,2]},
      {ev:&quot;5 · Produzione completata: prodotti finiti 800.000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;Finished goods D 800.000&quot;,vp(&quot;VP−&quot;)+&quot;WIP inventory A 800.000&quot;]), same:1,
       c:N(&quot;Nessuna scrittura.&quot;),
       stock:&quot;Prodotti finiti 800.000 · WIP 0&quot;, n:[5,5,2]},
      {ev:&quot;6 · Tutto venduto, incasso in banca: 1.100.000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;Bank D 1.100.000&quot;,vp(&quot;VP−&quot;)+&quot;Finished goods A 800.000&quot;,ve(&quot;VE+&quot;)+&quot;Profit on sales A 300.000&quot;]),
       b:E([&quot;&lt;b&gt;6a&lt;/b&gt; &quot;+vp(&quot;VP+&quot;)+&quot;Bank D 1.100.000&quot;,ve(&quot;VE+&quot;)+&quot;Revenues A 1.100.000&quot;])+E([&quot;&lt;b&gt;6b&lt;/b&gt; &quot;+ve(&quot;VE−&quot;)+&quot;Cost of goods sold D 800.000&quot;,vp(&quot;VP−&quot;)+&quot;Finished goods A 800.000&quot;]),
       c:E([vf(&quot;VF+&quot;)+&quot;Bank D 1.100.000&quot;,ve(&quot;VE+&quot;)+&quot;Revenues A 1.100.000&quot;]),
       stock:&quot;Magazzino a zero&quot;, n:[6,7,3]}
    ];
    var i=0, dots=$(&quot;.dots&quot;,st), prev=$(&quot;.prev&quot;,st), next=$(&quot;.next&quot;,st), lab=$(&quot;.steplab&quot;,st);
    S.forEach(function(_,k){var d=document.createElement(&quot;span&quot;);d.title=&quot;Evento &quot;+(k+1);d.addEventListener(&quot;click&quot;,function(){i=k;show()});dots.appendChild(d)});
    function show(){
      var s=S[i];
      $(&quot;#cyc-ev&quot;).textContent=s.ev;
      $(&quot;#cyc-a&quot;).innerHTML=s.a; $(&quot;#cyc-b&quot;).innerHTML=s.b||s.a; $(&quot;#cyc-c&quot;).innerHTML=s.c;
      $(&quot;#cyc-stock&quot;).innerHTML=&quot;&lt;b&gt;Magazzino in A e B:&lt;/b&gt; &quot;+s.stock+&quot;&lt;br&gt;&lt;b&gt;In C:&lt;/b&gt; non rilevato durante l&#x27;anno&quot;;
      $(&quot;#cyc-count&quot;).innerHTML=&quot;&lt;b&gt;Scritture finora&lt;/b&gt;&lt;br&gt;A: &quot;+s.n[0]+&quot; · B: &quot;+s.n[1]+&quot; · C: &quot;+s.n[2];
      $$(&quot;span&quot;,dots).forEach(function(d,k){d.className=k&lt;=i?&quot;on&quot;:&quot;&quot;});
      prev.disabled=i===0; next.disabled=i===S.length-1; lab.textContent=(i+1)+&quot; / &quot;+S.length;
    }
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;S.length-1){i++;show()}});
    show();
  })();

  /* unsold goods slider */
  (function(){
    var r=$(&quot;#us&quot;); if(!r) return;
    function row(l,v,cls){return &#x27;&lt;tr&#x27;+(cls?&#x27; class=&quot;&#x27;+cls+&#x27;&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+l+&#x27;&lt;/td&gt;&lt;td class=&quot;n&#x27;+(v&lt;0?&#x27; neg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+(v&lt;0?&quot;(&quot;+fmt(-v)+&quot;)&quot;:fmt(v))+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;}
    function draw(){
      var s=r.value/100, rev=1100000*s, cogs=800000*s, inv=800000*(1-s), ebit=300000*s-100000, pct=Math.round(s*100);
      $(&quot;#us-n&quot;).textContent=pct+&quot;%&quot;;
      $(&quot;#us-a&quot;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;Anglo-Saxon (by function)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;+row(&quot;Revenues&quot;,rev)+row(&quot;Cost of goods sold (&quot;+pct+&quot;% × 800.000)&quot;,-cogs)+row(&quot;Gross profit&quot;,rev-cogs,&quot;tot&quot;)+row(&quot;SG&amp;amp;A&quot;,-100000)+row(&quot;EBIT&quot;,ebit,&quot;tot&quot;)+row(&quot;Stato patrimoniale: prodotti finiti&quot;,inv);
      $(&quot;#us-c&quot;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;Reddito (by nature)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;+row(&quot;Revenues&quot;,rev)+row(&quot;Raw materials&quot;,-400000)+row(&quot;Wages&quot;,-500000)+row(&quot;Variazione rimanenze prodotti finiti (+)&quot;,inv)+row(&quot;EBIT&quot;,ebit,&quot;tot&quot;)+row(&quot;Stato patrimoniale: prodotti finiti&quot;,inv);
      var k=function(v){return v*720/1100000}, h=&quot;&quot;, x0=150;
      function bar(y,parts,label){var x=x0;h+=&#x27;&lt;text x=&quot;10&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+label+&#x27;&lt;/text&gt;&#x27;;parts.forEach(function(p){if(p[0]&lt;=0)return;var w=k(p[0]);h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;22&quot; fill=&quot;&#x27;+p[1]+&#x27;&quot; rx=&quot;2&quot;/&gt;&#x27;;if(w&gt;46)h+=&#x27;&lt;text x=&quot;&#x27;+(x+4)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;10.5&quot; fill=&quot;&#x27;+(p[2]||&quot;var(--paper)&quot;)+&#x27;&quot;&gt;&#x27;+p[3]+&#x27; &#x27;+Math.round(p[0]/1000)+&#x27;&lt;/text&gt;&#x27;;x+=w})}
      bar(10,[[rev,&quot;var(--ochre)&quot;,0,&quot;ricavi&quot;]],&quot;B · positivi&quot;);
      bar(36,[[cogs,&quot;var(--rule)&quot;,&quot;var(--ink)&quot;,&quot;COGS&quot;],[100000,&quot;var(--ink2)&quot;,0,&quot;SG&amp;A&quot;]],&quot;B · negativi&quot;);
      bar(90,[[rev,&quot;var(--brick)&quot;,0,&quot;ricavi&quot;],[inv,&quot;var(--accent)&quot;,0,&quot;Δ riman.&quot;]],&quot;C · positivi&quot;);
      bar(116,[[400000,&quot;var(--rule)&quot;,&quot;var(--ink)&quot;,&quot;materie&quot;],[500000,&quot;var(--ink2)&quot;,0,&quot;salari&quot;]],&quot;C · negativi&quot;);
      h+=&#x27;&lt;text x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;176&quot; font-size=&quot;13&quot;&gt;EBIT in entrambi: &lt;tspan font-weight=&quot;700&quot; fill=&quot;&#x27;+(ebit&lt;0?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;)+&#x27;&quot;&gt;&#x27;+fmt(ebit)+&#x27;&lt;/tspan&gt; · magazzino: &lt;tspan font-weight=&quot;700&quot;&gt;&#x27;+fmt(inv)+&#x27;&lt;/tspan&gt;&lt;/text&gt;&#x27;;
      $(&quot;#us-svg&quot;).innerHTML=h;
    }
    r.addEventListener(&quot;input&quot;,draw); draw();
  })();
})();
