    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Who&lt;/b&gt;&lt;/td&gt;&lt;td&gt;large public-interest entities with more than 500 employees (about 200 in Italy)&lt;/td&gt;&lt;td&gt;large companies and listed SMEs, in waves; scope narrowing under the Omnibus package (thresholds around 1,000 employees)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;What&lt;/b&gt;&lt;/td&gt;&lt;td&gt;non-financial statement, using standards chosen by the company (GRI)&lt;/td&gt;&lt;td&gt;sustainability statement under the mandatory &lt;b&gt;ESRS&lt;/b&gt;, &lt;b&gt;double materiality&lt;/b&gt;, &lt;span class=&quot;term&quot;&gt;digital tagging&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(machine-readable marking of the data)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Where&lt;/b&gt;&lt;/td&gt;&lt;td&gt;separate report or within the management report&lt;/td&gt;&lt;td&gt;a dedicated section of the management report&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Assurance&lt;/b&gt;&lt;/td&gt;&lt;td&gt;consistency check only&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;term&quot;&gt;limited assurance&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(a lower level of assurance than an audit)&lt;/span&gt; by the statutory auditor or an independent assurance provider&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Double materiality &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 220&quot; role=&quot;img&quot; aria-label=&quot;Double materiality: impact and financial&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;200&quot; cy=&quot;110&quot; r=&quot;80&quot; class=&quot;sagef&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;104&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Environment&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;124&quot; fill=&quot;var(--paper)&quot;&gt;and people&lt;/text&gt;
        &lt;rect x=&quot;610&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;140&quot; rx=&quot;14&quot; class=&quot;slatef&quot; opacity=&quot;.9&quot;/&gt;&lt;text x=&quot;710&quot; y=&quot;106&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Company&lt;/text&gt;&lt;text x=&quot;710&quot; y=&quot;126&quot; fill=&quot;var(--paper)&quot;&gt;(value, cash flows)&lt;/text&gt;
        &lt;path d=&quot;M610 80 C 470 40 380 40 285 80&quot; fill=&quot;none&quot; class=&quot;bricks&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M285 140 C 380 180 470 180 610 140&quot; fill=&quot;none&quot; class=&quot;ochres&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;450&quot; y=&quot;36&quot; class=&quot;brickf&quot; font-weight=&quot;600&quot;&gt;impact materiality (inside-out)&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;202&quot; class=&quot;ochref&quot; font-weight=&quot;600&quot;&gt;financial materiality (outside-in)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Under double materiality a topic must be reported if it is material in &lt;i&gt;at least one&lt;/i&gt; of the two directions: the company&#x27;s impact on the environment and people, or the effect of sustainability matters on the company&#x27;s performance and value. IFRS S1/S2 focus mainly on the latter.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;For this course&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Sustainability reporting sits &lt;b&gt;alongside&lt;/b&gt; the financial statements, not within them, but the two must connect: climate risks affect &lt;span class=&quot;term&quot;&gt;impairment&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(write-downs of assets)&lt;/span&gt;, &lt;span class=&quot;term&quot;&gt;provisions&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(liabilities of uncertain timing or amount)&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;useful lives&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(and hence depreciation)&lt;/span&gt;. IFRS S1/S2 (ISSB) play at global level the role that the ESRS play in the EU.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;box extbox&quot;&gt;&lt;h4&gt;Status of the Omnibus &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;The slide invites you to check the status of the Omnibus and of its Italian transposition before each edition of the lecture. Here is what the web shows (October 2026):&lt;/p&gt;
    &lt;ul style=&quot;margin:0 0 .6em;padding-left:1.1em&quot;&gt;
      &lt;li&gt;The &lt;b&gt;Omnibus I&lt;/b&gt; directive was approved by the European Parliament on 16 December 2025 and adopted by the Council on 24 February 2026; it entered into force in March 2026 after publication in the Official Journal.&lt;/li&gt;
      &lt;li&gt;The CSRD applies only to EU companies with &lt;b&gt;more than 1,000 employees&lt;/b&gt; and &lt;b&gt;more than €450 million&lt;/b&gt; in net turnover; commentators estimate that about 80% of companies fall out of scope.&lt;/li&gt;
      &lt;li&gt;The &lt;b&gt;simplified ESRS&lt;/b&gt; were adopted by the Commission on 3 July 2026 (Delegated Regulation (EU) 2026/1563).&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p style=&quot;margin:0;font-size:.88rem&quot;&gt;&lt;a href=&quot;https://www.regulationtomorrow.com/2026/02/omnibus-i-csrd-and-cs3d-simplification-council-of-european-union-adopts-final-text-t-simplify-sustainability-reporting-and-due-diligence-requirements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regulation Tomorrow&lt;/a&gt; · &lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt; · &lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/european-commission-publishes-delegated-act-on-revised-esrs-and-voluntary-sustainability-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG&lt;/a&gt;. The Italian transposition of the Omnibus did not emerge from the searches: check it.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Name three differences between the NFRD and the CSRD.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Standards: chosen by the company (GRI) → mandatory ESRS. Location: separate report possible → section of the management report. Assurance: consistency only → limited assurance. In addition, the CSRD introduces double materiality and digital tagging.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; How can climate enter the financial statements?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Through impairment of assets exposed to risk, provisions, and revision of useful lives, and hence of depreciation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; ESRS and IFRS S1/S2: who issues them and where do they apply?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ESRS: developed by EFRAG and adopted by the Commission, they apply in the EU under the CSRD. IFRS S1/S2: issued by the ISSB, they are the global baseline, adopted by individual jurisdictions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-systems&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part B · From rules to bookkeeping&lt;/div&gt;&lt;h2&gt;Same standards, different engines&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Accounting standards say &lt;b&gt;what&lt;/b&gt; to recognise, &lt;b&gt;how&lt;/b&gt; to measure it and &lt;b&gt;how&lt;/b&gt; to present it, but they do not say how to keep the books. Within double-entry bookkeeping there are two accounting “systems”, and from the same transactions they produce income statements of different form.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--slate)&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Patrimonial system &lt;small&gt;(sistema patrimoniale, asset-based)&lt;/small&gt;&lt;/h4&gt;
      &lt;p&gt;Each entry is read either as a change in assets/liabilities (&lt;b&gt;VP&lt;/b&gt;) or as a change in equity through the result (&lt;b&gt;VE&lt;/b&gt;). Inventories and work in progress are tracked &lt;b&gt;continuously&lt;/b&gt;.&lt;/p&gt;
      &lt;p class=&quot;muted&quot; style=&quot;font-size:.9rem;margin:0&quot;&gt;Fabio Besta, &lt;i&gt;La Ragioneria&lt;/i&gt; (1891-1916); W.A. Paton, &lt;i&gt;Accounting Theory&lt;/i&gt; (1922); Anglo-Saxon practice: &lt;span class=&quot;term&quot;&gt;cost of goods sold&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--brick)&quot;&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Income system &lt;small&gt;(sistema del reddito, income accounting system)&lt;/small&gt;&lt;/h4&gt;
      &lt;p&gt;Each entry is read either as a financial change (&lt;b&gt;VF&lt;/b&gt;: cash, receivables, payables) or as an economic change (&lt;b&gt;VE&lt;/b&gt;: expenses and revenues). Inventories appear &lt;b&gt;only at year-end&lt;/b&gt;, as an adjustment.&lt;/p&gt;
      &lt;p class=&quot;muted&quot; style=&quot;font-size:.9rem;margin:0&quot;&gt;Gino Zappa, &lt;i&gt;Tendenze nuove&lt;/i&gt; (1927) and &lt;i&gt;Il reddito di impresa&lt;/i&gt; (1937); Onida, Amaduzzi; E. Schmalenbach, &lt;i&gt;Dynamische Bilanz&lt;/i&gt; (1919).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The notation&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Debit and Credit rules in the two systems&quot;&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;225&quot; y=&quot;24&quot; class=&quot;slatef serif&quot; font-size=&quot;17&quot;&gt;Patrimonial&lt;/text&gt;
        &lt;text x=&quot;675&quot; y=&quot;24&quot; class=&quot;brickf serif&quot; font-size=&quot;17&quot;&gt;Income&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Debit&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Credit&lt;/text&gt;
        &lt;text x=&quot;600&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Debit&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;52&quot; font-weight=&quot;600&quot;&gt;Credit&lt;/text&gt;
        &lt;line x1=&quot;225&quot; y1=&quot;38&quot; x2=&quot;225&quot; y2=&quot;230&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;675&quot; y1=&quot;38&quot; x2=&quot;675&quot; y2=&quot;230&quot; class=&quot;rules&quot; stroke-width=&quot;2&quot;/&gt;

        &lt;rect x=&quot;690&quot; y=&quot;76&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;104&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;700&quot;&gt;VF −&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;124&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;cash ↓, payables ↑&lt;/text&gt;
        &lt;rect x=&quot;540&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE −&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;expense&lt;/text&gt;
        &lt;rect x=&quot;690&quot; y=&quot;150&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;8&quot; style=&quot;fill:var(--brick-bg)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;178&quot; style=&quot;fill:var(--brick)&quot; font-weight=&quot;700&quot;&gt;VE +&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;198&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;revenue&lt;/text&gt;

    &lt;figcaption&gt;Notation used in the slides: &lt;b&gt;VP ±&lt;/b&gt; change in assets or liabilities; &lt;b&gt;VE ±&lt;/b&gt; economic change (revenue/expense); &lt;b&gt;VF ±&lt;/b&gt; financial change (cash, receivables, payables). The abbreviations come from Italian: &lt;i&gt;variazione patrimoniale, economica, finanziaria&lt;/i&gt;. The Debit/Credit positions are reconstructed from the examples in the slides. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;The underlying idea &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The &lt;b&gt;patrimonial&lt;/b&gt; system looks at the &lt;i&gt;stock&lt;/i&gt;: it wants to know at any moment what the company&#x27;s assets are worth, and income is the change in that value. The &lt;b&gt;income&lt;/b&gt; system looks at the &lt;i&gt;flow&lt;/i&gt;: every exchange transaction with third parties has a financial side (money, receivables, payables) and an economic side (expense or revenue). Year-end capital is a residual, made up of “suspended” expenses and revenues to be deferred to future periods, such as inventories.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; In which system are inventories tracked continuously during the year?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In the patrimonial system. In the income system they enter only through the year-end adjustment.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Match each author to a system: Besta, Zappa, Paton, Schmalenbach.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Patrimonial: Besta, Paton. Income: Zappa (with Onida and Amaduzzi), Schmalenbach.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Do accounting standards say how to keep the books?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: they say what to recognise, how to measure it and how to present it. The recording “engine” is a separate choice.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-bottle&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part B · The notation applied to a bottle of water&lt;/div&gt;&lt;h2&gt;Buy at 0.30, sell at 1.00&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tabset&quot;&gt;

    &lt;div class=&quot;panel&quot;&gt;

        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Inventory (bottle)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt; Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt; Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Profit on sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.70&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Income statement&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Profit on sales 0.70 → EBIT 0.70. The income statement shows &lt;b&gt;margins&lt;/b&gt;, not purchases.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt; Purchase cost&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vf&quot;&gt;VF−&lt;/span&gt; Cash&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag vf&quot;&gt;VF+&lt;/span&gt; Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Sales revenue&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.00&lt;/td&gt;&lt;/tr&gt;

      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Income statement&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Revenue 1.00 − purchases 0.30 → EBIT 0.70. The income statement shows &lt;b&gt;gross flows by nature&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-cycle&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;10&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part B · Worked example&lt;/div&gt;&lt;h2&gt;One production cycle, three sets of entries&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;A manufacturing company, amounts in euro. The same cycle is recorded in three ways: &lt;b&gt;A&lt;/b&gt; patrimonial system following Besta (profit on sales), &lt;b&gt;B&lt;/b&gt; patrimonial system, Anglo-Saxon variant (revenues and cost of goods sold), &lt;b&gt;C&lt;/b&gt; income system (Zappa).&lt;/p&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Event&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Purchase of raw materials, paid by bank: 400,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Production starts: all raw materials go into &lt;span class=&quot;term&quot;&gt;work in progress&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(WIP, goods partly through the production process)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Wages paid by bank: 500,000, of which 400,000 production and 100,000 SG&amp;amp;A &lt;span class=&quot;gl&quot;&gt;(Selling, General &amp;amp; Administrative expenses)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Production wages are capitalised into WIP&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Production completed: finished goods 800,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;All finished goods sold, proceeds received by bank: 1,100,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;Predict before you look:&lt;/b&gt; will EBIT be the same in the three systems? And the number of entries?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;EBIT is &lt;b&gt;the same&lt;/b&gt;: 200,000 in all three. The entries are &lt;b&gt;different&lt;/b&gt;: 6 in A, 7 in B (the sale splits in two), 3 in C (production is invisible until year-end).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;stepper&quot; id=&quot;cyc&quot;&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;steplab muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
    &lt;h4 id=&quot;cyc-ev&quot; class=&quot;serif&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/h4&gt;
    &lt;div class=&quot;cols3&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;A · Besta&lt;/h4&gt;&lt;div id=&quot;cyc-a&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--ochre)&quot;&gt;B · Anglo-Saxon&lt;/h4&gt;&lt;div id=&quot;cyc-b&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;C · Zappa&lt;/h4&gt;&lt;div id=&quot;cyc-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin-top:12px;font-size:.9rem&quot;&gt;
      &lt;div class=&quot;info&quot; id=&quot;cyc-stock&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;info&quot; id=&quot;cyc-count&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three income statements down to EBIT&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;A · Besta&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Profit on sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Wages (SG&amp;amp;A)&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;B · Anglo-Saxon&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,100,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(800,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;SG&amp;amp;A&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;C · Zappa&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,100,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw materials&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(400,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(500,000)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;EBIT&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;What each one tells you &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;A shows only the margin on sales. B adds revenues and the cost of the products sold, and hence &lt;span class=&quot;term&quot;&gt;gross profit&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(revenue minus cost of goods sold)&lt;/span&gt;. C shows the production inputs consumed by nature (materials, labour) but does not say what the products sold cost. Note that in A and B the 400,000 of production wages “disappear” from the income statement (entry 4) and re-enter within the cost of the product.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-unsold&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;11&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part B · What if part of it remains unsold?&lt;/div&gt;&lt;h2&gt;Closing inventories&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Same cycle, events 1-5 unchanged. In the slide only 80% of the finished goods are sold, for 880,000. Move the slider to see what happens with other percentages.&lt;/p&gt;
  &lt;div class=&quot;box line&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;us&quot;&gt;Share of finished goods sold&lt;/label&gt;&lt;output id=&quot;us-n&quot;&gt;80%&lt;/output&gt;&lt;input id=&quot;us&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table id=&quot;us-a&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table id=&quot;us-c&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;figure style=&quot;margin:8px 0 0&quot;&gt;&lt;svg id=&quot;us-svg&quot; viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Comparison of the two income statements&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Bars in thousands of euro. In the income system the change in inventories is added to revenues and “offsets” the production costs of goods not yet sold.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;EBIT = 300,000 × share sold − 100,000 &amp;nbsp;·&amp;nbsp; the same in both systems&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;The lesson&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;In the income system inventory enters the books &lt;b&gt;only&lt;/b&gt; through the year-end adjustment, the &lt;b&gt;“closing inventories”&lt;/b&gt; (&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt; Change in inventories / &lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt; Inventory), which corrects the costs of the period. Same EBIT, same balance sheet: what changes is &lt;b&gt;when and how&lt;/b&gt; the information is produced.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; With 80% sold, what is EBIT and what is the finished goods inventory?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;EBIT 140,000 in both systems; inventory 160,000 in both.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Why does the change in inventories carry a “+” sign in the income system?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the costs of materials and labour (900,000) were expensed in full, but part of them (160,000) relates to goods not yet sold. The adjustment removes that part from the period&#x27;s costs and defers it to the future: for the income statement it is a positive component.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; In the Anglo-Saxon variant, where do those 160,000 “sit”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;They never passed through the income statement: they remained in the Finished goods account (an asset) because cost of goods sold releases only 80% × 800,000 = 640,000.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;s-formats&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;12&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part B · Where the two systems live today&lt;/div&gt;&lt;h2&gt;Income statement formats&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Income system · &lt;i&gt;by nature&lt;/i&gt;&lt;/th&gt;&lt;th&gt;Patrimonial system · &lt;i&gt;by function&lt;/i&gt;&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Format&lt;/b&gt;&lt;/td&gt;&lt;td&gt;revenues, change in inventories, raw materials, services, personnel, depreciation and amortisation&lt;/td&gt;&lt;td&gt;revenues, cost of sales, gross profit, distribution costs, administrative expenses&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Who&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Civil Code Art. 2425 (mandatory); many continental European companies; permitted by IAS 1 para. 102&lt;/td&gt;&lt;td&gt;Anglo-Saxon practice; US GAAP; permitted by IAS 1 para. 103 with disclosure of expenses by nature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Strength&lt;/b&gt;&lt;/td&gt;&lt;td&gt;shows gross flows and &lt;span class=&quot;term&quot;&gt;value added&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(output minus bought-in goods and services)&lt;/span&gt;; easy link with taxation and national accounts&lt;/td&gt;&lt;td&gt;shows margins (gross profit) and the cost of products sold&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Weakness&lt;/b&gt;&lt;/td&gt;&lt;td&gt;no gross margin; requires year-end inventory adjustments&lt;/td&gt;&lt;td&gt;allocating costs to functions requires judgement&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;The two income statement formats compared&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;text x=&quot;20&quot; y=&quot;22&quot; class=&quot;brickf serif&quot; font-size=&quot;16&quot;&gt;By nature (Art. 2425 Civil Code)&lt;/text&gt;
        &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;34&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;brickf&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;51&quot; fill=&quot;var(--paper)&quot;&gt;Revenues&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;brickf&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;79&quot; fill=&quot;var(--paper)&quot;&gt;± Change in inventories&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;90&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;107&quot;&gt;− Raw materials&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;118&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;135&quot;&gt;− Services&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;146&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;163&quot;&gt;− Personnel&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;174&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;191&quot;&gt;− Depreciation and amortisation&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;206&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; class=&quot;bricks&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;225&quot; font-weight=&quot;600&quot;&gt;= Operating result&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;480&quot; y=&quot;22&quot; class=&quot;slatef serif&quot; font-size=&quot;16&quot;&gt;By function (IAS 1 para. 103)&lt;/text&gt;
        &lt;g&gt;&lt;rect x=&quot;480&quot; y=&quot;34&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;slatef&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; fill=&quot;var(--paper)&quot;&gt;Revenue&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;79&quot;&gt;− Cost of sales&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;90&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; class=&quot;slatef&quot; opacity=&quot;.35&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;109&quot; font-weight=&quot;600&quot;&gt;= Gross profit&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;122&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;139&quot;&gt;− Distribution costs&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;150&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;167&quot;&gt;− Administrative expenses&lt;/text&gt;
        &lt;rect x=&quot;480&quot; y=&quot;206&quot; width=&quot;400&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; class=&quot;slates&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;225&quot; font-weight=&quot;600&quot;&gt;= Operating profit&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The same transactions, grouped by nature (what was consumed) or by function (what it was used for). &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot; style=&quot;--pc:var(--slate);--pc-bg:var(--slate-bg)&quot;&gt;&lt;h4&gt;IFRS 18 (from 2027)&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;It keeps the choice between by nature and by function, but adds mandatory categories (&lt;i&gt;operating, investing, financing&lt;/i&gt;), an &lt;span class=&quot;term&quot;&gt;operating profit&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(the operating result, now a required subtotal)&lt;/span&gt; subtotal, and disclosure of expenses by nature when the by-function format is used.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Final remark&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The patrimonial system knows at every moment the value of the company&#x27;s assets. The income system measures the income of the period starting from realised revenues and the related costs. Same double entry, two philosophies.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Which format does Art. 2425 of the Civil Code require, and which accounting system does it correspond to?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The by-nature format, which corresponds to the income system (with the change in inventories among the positive components).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; What must an IFRS company presenting by function add?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Disclosure of expenses by nature (IAS 1 para. 103; also under IFRS 18).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; One strength and one weakness of each format.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;By nature: shows gross flows and value added, but not the gross margin. By function: shows the margin and cost of sales, but allocation to functions requires judgement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;s-wrap&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;✦&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Wrap-up&lt;/div&gt;&lt;h2&gt;Three exam questions and the answer to the opening question&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;“Could you answer in five lines?” Try out loud first, then open the answer outline.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Why can two companies subject to the same EU directive present different financial statements, whereas two companies subject to an EU regulation cannot?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A regulation is directly applicable: same text, same date, in all Member States, hence maximum comparability. A directive sets objectives and a framework, but each State transposes it through its own law, with its own options and timing (e.g. LIFO permitted in Italy, formats, thresholds). Same skeleton, different flesh: only partial comparability.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; An unlisted Italian S.p.A. with 300 employees: may it adopt IFRS? Must it? Which rules govern profit distribution?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It may, as an optional and irrevocable choice, because it is a “larger” company that does not qualify for abridged financial statements. It need not, because it is neither listed nor a bank nor an insurer: the default is Civil Code + OIC. Profit distribution, reserves and approval remain governed by the Civil Code in any case. If it adopts IFRS, it lives on three layers: IFRS, Civil Code, tax law.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Record the sale for 100 of goods costing 80 in the patrimonial (Anglo-Saxon) system and in the income system, and explain why the income statements differ.&lt;/summary&gt;&lt;div&gt;
    &lt;div class=&quot;cols3&quot;&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Patrimonial (Anglo-Saxon)&lt;/h4&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag vp&quot;&gt;VP+&lt;/span&gt;Cash Dr 100&lt;br&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt;Revenues Cr 100&lt;/div&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt;COGS Dr 80&lt;br&gt;&lt;span class=&quot;tag vp&quot;&gt;VP−&lt;/span&gt;Inventory Cr 80&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Income (Zappa)&lt;/h4&gt;&lt;div class=&quot;entry&quot;&gt;&lt;span class=&quot;tag vf&quot;&gt;VF+&lt;/span&gt;Cash Dr 100&lt;br&gt;&lt;span class=&quot;tag ve&quot;&gt;VE+&lt;/span&gt;Revenues Cr 100&lt;/div&gt;&lt;div class=&quot;entry none&quot;&gt;The purchase had already been recorded as an expense (&lt;span class=&quot;tag ve&quot;&gt;VE−&lt;/span&gt; Purchases 80); no inventory account during the year.&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Income statements&lt;/h4&gt;&lt;p style=&quot;font-size:.92rem&quot;&gt;Patrimonial: Revenues 100 − COGS 80 = &lt;b&gt;gross profit 20&lt;/b&gt;. Income: Revenues 100 − Purchases 80 = 20, by nature and with no gross margin. Same profit: one shows the margin and cost of goods sold, the other the gross flows.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;box&quot; style=&quot;margin-top:22px&quot;&gt;&lt;h4&gt;Back to the opening question&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Bergamo Bikes follows the Civil Code and OIC (it cannot use IFRS if it qualifies for abridged financial statements). Its income statement is &lt;b&gt;by nature&lt;/b&gt;, so the unsold bikes appear as a &lt;b&gt;change in inventories&lt;/b&gt;. The Manchester company would show &lt;b&gt;cost of sales and gross profit&lt;/b&gt;. Same transactions, same profit, different picture.&lt;/p&gt;&lt;/div&gt;
  &lt;p class=&quot;muted&quot; style=&quot;margin-top:14px&quot;&gt;Next lecture: Prof. Aprile, &lt;i&gt;the IFRS Conceptual Framework&lt;/i&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;s-refs&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;&lt;h2&gt;Authors, texts, laws and bodies cited&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Everything below is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;: information found through web searches (October 2026), each item with its link. For legislation, the official text (EUR-Lex, Gazzetta Ufficiale, Normattiva) in its latest consolidated version is authoritative.&lt;/p&gt;

  &lt;h3&gt;Authors and texts&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Fabio Besta, &lt;i&gt;La Ragioneria&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;A three-volume work published by Vallardi, in several editions between 1891 and 1922, preceded by his Venice inaugural lecture of 1880. It founds the theory of accounts “in value” and the patrimonial system, centred on capital (assets − liabilities = equity).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the root of system A in the lecture; some studies link it to the balance-sheet logic of the IASB model.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://phaidra.unipd.it/detail/o:29121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scan of vol. 2 (Phaidra, Univ. of Padua)&lt;/a&gt;&lt;a href=&quot;https://ideas.repec.org/a/taf/acbsfi/v22y2012i3p249-267.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sargiacomo, Servalli, Andrei (2012)&lt;/a&gt;&lt;a href=&quot;https://aisberg.unibg.it/retrieve/e40f7b89-7f5e-afca-e053-6605fe0aeaf2/From%20Capital%20Accounting%20System%20to%20Ias-Ifrs%20through%20a%20national%20and%20international%20literature%20analysis.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UniBG study: “From Capital Accounting System to IAS-IFRS”&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Gino Zappa, &lt;i&gt;Il reddito d&#x27;impresa&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Second edition, Giuffrè, Milan, 1937, a development of &lt;i&gt;Tendenze nuove negli studi di ragioneria&lt;/i&gt; (1927). Zappa shifts the focus from capital to income and founds &lt;i&gt;Economia aziendale&lt;/i&gt; (Italian business economics).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is system C in the lecture, underlying the by-nature format of Art. 2425 of the Civil Code.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://edizionicafoscari.unive.it/en/edizioni/libri/978-88-6969-259-8/gino-zappa-il-fondatore-delleconomia-aziendale/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Coronella, “Gino Zappa: il fondatore dell&#x27;Economia aziendale” (Ed. Ca&#x27; Foscari)&lt;/a&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Gino_Zappa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;W.A. Paton, &lt;i&gt;Accounting Theory&lt;/i&gt; (1922)&lt;/h4&gt;&lt;p&gt;Full title &lt;i&gt;Accounting Theory, with Special Reference to the Corporate Enterprise&lt;/i&gt;, Ronald Press, New York. Paton&#x27;s first book, decisive for the theoretical foundations of accounting in the US (postulates, current cost, goodwill).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the Anglo-Saxon reference for the patrimonial system in the slides.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/William_Andrew_Paton&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;a href=&quot;https://aaahq.org/node/36713&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;American Accounting Association&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Eugen Schmalenbach, &lt;i&gt;Dynamische Bilanz&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Theory of the “dynamic” balance sheet (1919; later &lt;i&gt;Grundlagen dynamischer Bilanzlehre&lt;/i&gt;, 1920). Financial statements serve to measure the period&#x27;s result correctly on an accrual basis, not to take a snapshot of the company&#x27;s wealth. Translated into English as &lt;i&gt;Dynamic Accounting&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the German counterpart of Zappa&#x27;s income perspective.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://cfuc.vse.cz/artkey/cfu-200901-0006_Devadesat-let-dynamicke-bilancni-teorie-Johanna-Wilhelma-Eugena-Schmalenbacha-1873-1955.php?l=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Ninety years of dynamic balance sheet theory” (Český finanční a účetní časopis, 2009)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;EU legislation&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Reg. (EC) 1606/2002&lt;/h4&gt;&lt;p&gt;Of 19 July 2002, in force from 14 September 2002. It establishes the EU endorsement mechanism for IFRS and makes them mandatory for the consolidated statements of listed companies. Endorsed IFRSs are collected in Reg. (EC) 1126/2008.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Dir. 2013/34/EU&lt;/h4&gt;&lt;p&gt;Of 26 June 2013, to be transposed by 20 July 2015. It replaces the Fourth and Seventh Directives; financial statements comprise at least the balance sheet, the profit and loss account and the notes, and must give a true and fair view.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;a href=&quot;https://www.legislation.gov.uk/eudr/2013/34&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislation.gov.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Dir. (EU) 2022/2464 · CSRD&lt;/h4&gt;&lt;p&gt;Of 14 December 2022; it amends Dir. 2013/34 and other legislation and replaces the NFRD. The first ESRS are in Delegated Reg. (EU) 2023/2772, later simplified by Reg. 2026/1563.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/european-commission-publishes-delegated-act-on-revised-esrs-and-voluntary-sustainability-reporting&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG: revised ESRS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Omnibus I&lt;/h4&gt;&lt;p&gt;Directive simplifying the CSRD and CSDDD: CSRD thresholds raised to more than 1,000 employees and more than €450 million in turnover. Adopted by the Council on 24 February 2026, in force from March 2026.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt;&lt;a href=&quot;https://www.regulationtomorrow.com/2026/02/omnibus-i-csrd-and-cs3d-simplification-council-of-european-union-adopts-final-text-t-simplify-sustainability-reporting-and-due-diligence-requirements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regulation Tomorrow&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Dir. 2014/95/EU · NFRD&lt;/h4&gt;&lt;p&gt;The Non-Financial Reporting Directive, transposed in Italy by Legislative Decree 254/2016 (Official Gazette of 10 January 2017): obligation to publish a non-financial statement (DNF) for large public-interest entities.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.borsaitaliana.it/finanza-sostenibile/materiali/nfrd.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Borsa Italiana&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Rec. 2001/453/EC&lt;/h4&gt;&lt;p&gt;Commission Recommendation of 30 May 2001 on the recognition, measurement and disclosure of environmental issues in annual accounts and annual reports; it applies to both individual and consolidated accounts.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reco/2001/453/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Italian legislation&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Legislative Decree 38/2005&lt;/h4&gt;&lt;p&gt;Exercises the options of Reg. 1606/2002: Art. 2 lists who must apply IFRS. Law 145/2018 added Art. 2-bis, which turns the obligation into an option for certain unlisted entities.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ecnews.it/fiscale/societa-e-bilancio/bilancio/soggetti-non-quotati-e-principi-contabili-internazionali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Euroconference News&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Legislative Decree 139/2015&lt;/h4&gt;&lt;p&gt;Of 18 August 2015, it transposes Dir. 2013/34: it amends the Civil Code (among other things introducing Art. 2435-ter on micro-entities and the materiality principle) and Legislative Decree 127/1991. It applies from the 2016 financial year.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/2016-12-Presentazione-Nuovi-Principi-contabili1.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC: presentation of the new standards&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Legislative Decree 125/2024&lt;/h4&gt;&lt;p&gt;Of 6 September 2024 (Official Gazette no. 212 of 10 September 2024), in force from 25 September 2024. It transposes the CSRD and requires assurance by a sustainability auditor.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://edotto.com/articolo/con-il-dlgs1252024-recepita-la-direttiva-sulla-sostenibilita&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edotto&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Civil Code, Art. 2425&lt;/h4&gt;&lt;p&gt;Sets the mandatory vertical format of the income statement: A) value of production, B) costs of production by nature, down to the profit for the year. OIC 12 guides its application.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;OIC and Law 116/2014&lt;/h4&gt;&lt;p&gt;A private-law foundation established in 2001; Law 116 of 11 August 2014 assigns it the role of issuing national accounting standards for financial statements prepared under the Civil Code. It also publishes the list of EU regulations endorsing IFRS.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC Foundation&lt;/a&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/category/international-activity/regulations/european-regulations-adopting-international-accounting-standards/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EU endorsement regulations&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Standards and bodies&lt;/h3&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Conceptual Framework (2018)&lt;/h4&gt;&lt;p&gt;Issued in March 2018, it replaces the 2010 version; it is not a standard. It covers the objective of financial reporting, qualitative characteristics, the reporting entity, prudence, substance over form and measurement uncertainty.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 18 (replaces IAS 1)&lt;/h4&gt;&lt;p&gt;Issued in April 2024, effective from 1 January 2027; endorsed in the EU by Reg. (EU) 2026/338. It must be applied retrospectively, so 2026 comparatives must be restated.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus: EU endorsement&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IAS 8&lt;/h4&gt;&lt;p&gt;Paragraphs 10-12 set out the hierarchy: in the absence of an applicable standard, management uses judgement by reference to similar standards, the Framework and, if needed, standard setters with a similar framework.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://ifrs.org/content/dam/ifrs/publications/html-standards/english/2023/issued/ias8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8 text (IFRS Foundation)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS S1 and S2 (ISSB)&lt;/h4&gt;&lt;p&gt;Published on 26 June 2023, effective from 2024. S1 contains the general requirements for sustainability-related financial information; S2 covers climate and incorporates guidance from the SASB standards.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/non-financial-reporting/international-sustainability-disclosure-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Due Process Handbook&lt;/h4&gt;&lt;p&gt;The handbook governing the standard-setting process: comment period normally 120 days (minimum 30 for urgent and narrow-scope matters). Revised in 2024-2026 to include the ISSB.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2026/2024-due-process-handbook-review/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Norwalk Agreement (2002)&lt;/h4&gt;&lt;p&gt;FASB-IASB memorandum of understanding, resulting from the September 2002 meeting in Norwalk (Connecticut): a commitment to make the standards compatible. Updated in 2006 and 2008.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/around-the-world/mous/norwalk-agreement-2002.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (IFRS Foundation)&lt;/a&gt;&lt;a href=&quot;https://www.iasplus.com/en/projects/completed/other/iasb-fasb-convergence&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus: convergence&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;FASB and SEC (US GAAP)&lt;/h4&gt;&lt;p&gt;Since 2009 the FASB &lt;i&gt;Accounting Standards Codification&lt;/i&gt; has been the single source of US GAAP; SEC rules remain separate and are not superseded by the Codification.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.sec.gov/rules-regulations/2009/08/commission-guidance-regarding-financial-accounting-standards-boards-accounting-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEC, 2009 interpretive release&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;EFRAG and endorsement&lt;/h4&gt;&lt;p&gt;EFRAG publishes a periodic &lt;i&gt;Endorsement Status Report&lt;/i&gt;, showing where each standard stands on its way to an EU regulation. It is useful for knowing whether a standard is already applicable in the EU.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-endorsement-status-report-update-59&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IAS 39 carve-out (2004)&lt;/h4&gt;&lt;p&gt;Endorsement of 19 November 2004 without the fair value option for liabilities and without certain portfolio hedging rules. The first carve-out was lifted in 2005; the second remained.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2004/September/news1751&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;a href=&quot;https://www.gov.uk/hmrc-internal-manuals/corporate-finance-manual/cfm21020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HMRC CFM21020&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;GRI Standards&lt;/h4&gt;&lt;p&gt;Voluntary standards of the Global Reporting Initiative, organised into Universal (GRI 1, 2, 3), Sector and Topic Standards; the revised Universal Standards apply from 2023. They were the most common choice under the NFRD.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GRI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;

(function(){

  var fmt=function(n){var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,&quot;,&quot;);return (n&lt;0?&quot;−&quot;:&quot;&quot;)+s};

  /* tabs */
  $$(&quot;.tabset&quot;).forEach(function(ts){

    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show()}});

    items.forEach(function(b){

&lt;script&gt;
(function(){
  var $=__u.$, $$=__u.$$, fmt=__u.fmt;

  /* waterfall: net loss → cash (Bergamo Bikes) */
  (function(){
    var svg=$(&quot;#wf&quot;); if(!svg) return;
    var items=[
      {l:&quot;Net|loss&quot;,v:-1250,t:&quot;tot&quot;},{l:&quot;+ Depre-|ciation&quot;,v:4000},{l:&quot;+ Accrued|interest&quot;,v:250},
      {l:&quot;− Unsold|bikes&quot;,v:-9000},{l:&quot;− Uncollected|receivables&quot;,v:-15000},{l:&quot;− Prepaid|rent&quot;,v:-3000},
      {l:&quot;+ Accounts|payable&quot;,v:12000},{l:&quot;= Operating|cash&quot;,t:&quot;sub&quot;},{l:&quot;− Equip-|ment&quot;,v:-24000},
      {l:&quot;+ Capital|and loan&quot;,v:70000},{l:&quot;= Closing|cash&quot;,t:&quot;sub&quot;}];
    var y=function(v){return 30+(40000-v)*250/80000}, bw=58, step=80, h=&quot;&quot;, cum=0, prevTop=null;
    h+=&#x27;&lt;line x1=&quot;10&quot; x2=&quot;890&quot; y1=&quot;&#x27;+y(0)+&#x27;&quot; y2=&quot;&#x27;+y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
    h+=&#x27;&lt;text x=&quot;12&quot; y=&quot;&#x27;+(y(0)-6)+&#x27;&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;0&lt;/text&gt;&#x27;;
    items.forEach(function(it,i){
      var x=30+i*step, a, b, col;
      if(it.t===&quot;tot&quot;){a=0;b=it.v;cum=it.v;col=&quot;var(--slate)&quot;}
      else if(it.t===&quot;sub&quot;){a=0;b=cum;col=&quot;var(--accent)&quot;}
      else{a=cum;b=cum+it.v;cum=b;col=it.v&gt;=0?&quot;var(--sage)&quot;:&quot;var(--brick)&quot;}
      var top=Math.min(y(a),y(b)), ht=Math.max(2,Math.abs(y(a)-y(b))), val=it.t?(it.t===&quot;sub&quot;?cum:it.v):it.v;
      if(prevTop!==null) h+=&#x27;&lt;line x1=&quot;&#x27;+(x-step+bw)+&#x27;&quot; x2=&quot;&#x27;+x+&#x27;&quot; y1=&quot;&#x27;+y(it.t===&quot;sub&quot;?cum:a)+&#x27;&quot; y2=&quot;&#x27;+y(it.t===&quot;sub&quot;?cum:a)+&#x27;&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+top+&#x27;&quot; width=&quot;&#x27;+bw+&#x27;&quot; height=&quot;&#x27;+ht+&#x27;&quot; rx=&quot;3&quot; fill=&quot;&#x27;+col+&#x27;&quot;/&gt;&#x27;;
      var ly=(val&gt;=0||it.t===&quot;sub&quot;&amp;&amp;cum&gt;=0)?top-6:top+ht+14;
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;&#x27;+ly+&#x27;&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+(val&gt;0&amp;&amp;!it.t?&quot;+&quot;:&quot;&quot;)+fmt(val)+&#x27;&lt;/text&gt;&#x27;;
      var p=it.l.split(&quot;|&quot;);
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;306&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+p[0]+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(x+bw/2)+&#x27;&quot; y=&quot;320&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+p[1]+&#x27;&lt;/text&gt;&#x27;;
      prevTop=top;

    svg.innerHTML=h;
  })();

  /* break-even */
  (function(){
    var r=$(&quot;#be&quot;), svg=$(&quot;#be-svg&quot;); if(!r) return;
    var X=function(n){return 50+n*5.7}, Y=function(v){return 20+(6000-v)*190/22000};
    function draw(){
      var n=+r.value, res=200*n-15250, h=&quot;&quot;;
      h+=&#x27;&lt;line x1=&quot;50&quot; x2=&quot;620&quot; y1=&quot;&#x27;+Y(0)+&#x27;&quot; y2=&quot;&#x27;+Y(0)+&#x27;&quot; stroke=&quot;var(--ink2)&quot;/&gt;&#x27;;
      [0,25,50,75,100].forEach(function(t){h+=&#x27;&lt;text x=&quot;&#x27;+X(t)+&#x27;&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;&#x27;+t+&#x27;&lt;/text&gt;&#x27;});
      [-15000,-10000,-5000,0,5000].forEach(function(v){h+=&#x27;&lt;text x=&quot;44&quot; y=&quot;&#x27;+(Y(v)+4)+&#x27;&quot; font-size=&quot;10.5&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot;&gt;&#x27;+fmt(v)+&#x27;&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;620&quot; y1=&quot;&#x27;+Y(v)+&#x27;&quot; y2=&quot;&#x27;+Y(v)+&#x27;&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;.6&quot;/&gt;&#x27;});
      h+=&#x27;&lt;path d=&quot;M&#x27;+X(0)+&#x27; &#x27;+Y(-15250)+&#x27; L&#x27;+X(76.25)+&#x27; &#x27;+Y(0)+&#x27;&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;path d=&quot;M&#x27;+X(76.25)+&#x27; &#x27;+Y(0)+&#x27; L&#x27;+X(100)+&#x27; &#x27;+Y(4750)+&#x27;&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+X(76.25)+&#x27;&quot; x2=&quot;&#x27;+X(76.25)+&#x27;&quot; y1=&quot;20&quot; y2=&quot;210&quot; stroke=&quot;var(--accent)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;text x=&quot;&#x27;+(X(76.25)+5)+&#x27;&quot; y=&quot;32&quot; font-size=&quot;11.5&quot; class=&quot;accf&quot;&gt;break-even ≈ 76&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;circle cx=&quot;&#x27;+X(70)+&#x27;&quot; cy=&quot;&#x27;+Y(-1250)+&#x27;&quot; r=&quot;4&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;&#x27;+(X(70)-6)+&#x27;&quot; y=&quot;&#x27;+(Y(-1250)+18)+&#x27;&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; class=&quot;mut&quot;&gt;actual: 70 bikes&lt;/text&gt;&#x27;;
      h+=&#x27;&lt;line x1=&quot;&#x27;+X(n)+&#x27;&quot; x2=&quot;&#x27;+X(n)+&#x27;&quot; y1=&quot;&#x27;+Y(0)+&#x27;&quot; y2=&quot;&#x27;+Y(res)+&#x27;&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;&#x27;+X(n)+&#x27;&quot; cy=&quot;&#x27;+Y(res)+&#x27;&quot; r=&quot;7&quot; fill=&quot;var(--ochre)&quot;/&gt;&#x27;;
      h+=&#x27;&lt;text x=&quot;335&quot; y=&quot;246&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot;&gt;bikes sold&lt;/text&gt;&#x27;;
      svg.innerHTML=h;
      $(&quot;#be-n&quot;).textContent=n;
      $(&quot;#be-txt&quot;).innerHTML=&quot;Revenue &quot;+fmt(500*n)+&quot; − cost of goods sold &quot;+fmt(300*n)+&quot; = margin &quot;+fmt(200*n)+&quot;; − fixed costs 15,250 = &lt;b class=&#x27;&quot;+(res&lt;0?&quot;neg&quot;:&quot;pos&quot;)+&quot;&#x27;&gt;result &quot;+fmt(res)+&quot;&lt;/b&gt;. Unsold in inventory: &quot;+(100-n)+&quot; bikes = &quot;+fmt(300*(100-n))+&quot;.&quot;;
    }
    r.addEventListener(&quot;input&quot;,draw); draw();
  })();

  /* production cycle stepper */
  (function(){
    var st=$(&quot;#cyc&quot;); if(!st) return;
    var E=function(lines){return &#x27;&lt;div class=&quot;entry&quot;&gt;&#x27;+lines.join(&quot;&lt;br&gt;&quot;)+&#x27;&lt;/div&gt;&#x27;}, N=function(t){return &#x27;&lt;div class=&quot;entry none&quot;&gt;&#x27;+t+&#x27;&lt;/div&gt;&#x27;};
    var vp=function(s){return &#x27;&lt;span class=&quot;tag vp&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;}, ve=function(s){return &#x27;&lt;span class=&quot;tag ve&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;}, vf=function(s){return &#x27;&lt;span class=&quot;tag vf&quot;&gt;&#x27;+s+&#x27;&lt;/span&gt;&#x27;};
    var S=[
      {ev:&quot;1 · Purchase of raw materials, paid by bank: 400,000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;RM inventory Dr 400,000&quot;,vp(&quot;VP−&quot;)+&quot;Bank Cr 400,000&quot;]), same:1,
       c:E([ve(&quot;VE−&quot;)+&quot;Cost of raw materials Dr 400,000&quot;,vf(&quot;VF−&quot;)+&quot;Bank Cr 400,000&quot;]),
       stock:&quot;Raw materials 400,000&quot;, n:[1,1,1]},
      {ev:&quot;2 · Raw materials enter production (WIP)&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;WIP inventory Dr 400,000&quot;,vp(&quot;VP−&quot;)+&quot;RM inventory Cr 400,000&quot;]), same:1,
       c:N(&quot;No entry: it is an internal transformation, with no exchange with third parties.&quot;),
       stock:&quot;WIP 400,000 · raw materials 0&quot;, n:[2,2,1]},
      {ev:&quot;3 · Wages paid by bank: 500,000 (400,000 production, 100,000 SG&amp;A)&quot;,
       a:E([ve(&quot;VE−&quot;)+&quot;Wages Dr 500,000&quot;,vp(&quot;VP−&quot;)+&quot;Bank Cr 500,000&quot;]), same:1,
       c:E([ve(&quot;VE−&quot;)+&quot;Wages Dr 500,000&quot;,vf(&quot;VF−&quot;)+&quot;Bank Cr 500,000&quot;]),
       stock:&quot;WIP 400,000&quot;, n:[3,3,2]},
      {ev:&quot;4 · Production wages are capitalised into WIP&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;WIP inventory Dr 400,000&quot;,ve(&quot;VE+&quot;)+&quot;Wages (capitalised) Cr 400,000&quot;]), same:1,
       c:N(&quot;No entry.&quot;),
       stock:&quot;WIP 800,000 (materials 400,000 + labour 400,000)&quot;, n:[4,4,2]},
      {ev:&quot;5 · Production completed: finished goods 800,000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;Finished goods Dr 800,000&quot;,vp(&quot;VP−&quot;)+&quot;WIP inventory Cr 800,000&quot;]), same:1,
       c:N(&quot;No entry.&quot;),
       stock:&quot;Finished goods 800,000 · WIP 0&quot;, n:[5,5,2]},
      {ev:&quot;6 · Everything sold, proceeds received by bank: 1,100,000&quot;,
       a:E([vp(&quot;VP+&quot;)+&quot;Bank Dr 1,100,000&quot;,vp(&quot;VP−&quot;)+&quot;Finished goods Cr 800,000&quot;,ve(&quot;VE+&quot;)+&quot;Profit on sales Cr 300,000&quot;]),
       b:E([&quot;&lt;b&gt;6a&lt;/b&gt; &quot;+vp(&quot;VP+&quot;)+&quot;Bank Dr 1,100,000&quot;,ve(&quot;VE+&quot;)+&quot;Revenues Cr 1,100,000&quot;])+E([&quot;&lt;b&gt;6b&lt;/b&gt; &quot;+ve(&quot;VE−&quot;)+&quot;Cost of goods sold Dr 800,000&quot;,vp(&quot;VP−&quot;)+&quot;Finished goods Cr 800,000&quot;]),
       c:E([vf(&quot;VF+&quot;)+&quot;Bank Dr 1,100,000&quot;,ve(&quot;VE+&quot;)+&quot;Revenues Cr 1,100,000&quot;]),
       stock:&quot;Inventory at zero&quot;, n:[6,7,3]}
    ];
    var i=0, dots=$(&quot;.dots&quot;,st), prev=$(&quot;.prev&quot;,st), next=$(&quot;.next&quot;,st), lab=$(&quot;.steplab&quot;,st);
    S.forEach(function(_,k){var d=document.createElement(&quot;span&quot;);d.title=&quot;Event &quot;+(k+1);d.addEventListener(&quot;click&quot;,function(){i=k;show()});dots.appendChild(d)});
    function show(){
      var s=S[i];
      $(&quot;#cyc-ev&quot;).textContent=s.ev;
      $(&quot;#cyc-a&quot;).innerHTML=s.a; $(&quot;#cyc-b&quot;).innerHTML=s.b||s.a; $(&quot;#cyc-c&quot;).innerHTML=s.c;
      $(&quot;#cyc-stock&quot;).innerHTML=&quot;&lt;b&gt;Inventory in A and B:&lt;/b&gt; &quot;+s.stock+&quot;&lt;br&gt;&lt;b&gt;In C:&lt;/b&gt; not recorded during the year&quot;;
      $(&quot;#cyc-count&quot;).innerHTML=&quot;&lt;b&gt;Entries so far&lt;/b&gt;&lt;br&gt;A: &quot;+s.n[0]+&quot; · B: &quot;+s.n[1]+&quot; · C: &quot;+s.n[2];
      $$(&quot;span&quot;,dots).forEach(function(d,k){d.className=k&lt;=i?&quot;on&quot;:&quot;&quot;});
      prev.disabled=i===0; next.disabled=i===S.length-1; lab.textContent=(i+1)+&quot; / &quot;+S.length;
    }
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show()}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;S.length-1){i++;show()}});
    show();
  })();

  /* unsold goods slider */
  (function(){
    var r=$(&quot;#us&quot;); if(!r) return;
    function row(l,v,cls){return &#x27;&lt;tr&#x27;+(cls?&#x27; class=&quot;&#x27;+cls+&#x27;&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+l+&#x27;&lt;/td&gt;&lt;td class=&quot;n&#x27;+(v&lt;0?&#x27; neg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+(v&lt;0?&quot;(&quot;+fmt(-v)+&quot;)&quot;:fmt(v))+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;}
    function draw(){
      var s=r.value/100, rev=1100000*s, cogs=800000*s, inv=800000*(1-s), ebit=300000*s-100000, pct=Math.round(s*100);
      $(&quot;#us-n&quot;).textContent=pct+&quot;%&quot;;
      $(&quot;#us-a&quot;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;Anglo-Saxon (by function)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;+row(&quot;Revenues&quot;,rev)+row(&quot;Cost of goods sold (&quot;+pct+&quot;% × 800,000)&quot;,-cogs)+row(&quot;Gross profit&quot;,rev-cogs,&quot;tot&quot;)+row(&quot;SG&amp;amp;A&quot;,-100000)+row(&quot;EBIT&quot;,ebit,&quot;tot&quot;)+row(&quot;Balance sheet: finished goods&quot;,inv);
      $(&quot;#us-c&quot;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;Income (by nature)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;+row(&quot;Revenues&quot;,rev)+row(&quot;Raw materials&quot;,-400000)+row(&quot;Wages&quot;,-500000)+row(&quot;Change in finished goods inventories (+)&quot;,inv)+row(&quot;EBIT&quot;,ebit,&quot;tot&quot;)+row(&quot;Balance sheet: finished goods&quot;,inv);
      var k=function(v){return v*720/1100000}, h=&quot;&quot;, x0=150;
      function bar(y,parts,label){var x=x0;h+=&#x27;&lt;text x=&quot;10&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&#x27;+label+&#x27;&lt;/text&gt;&#x27;;parts.forEach(function(p){if(p[0]&lt;=0)return;var w=k(p[0]);h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;22&quot; fill=&quot;&#x27;+p[1]+&#x27;&quot; rx=&quot;2&quot;/&gt;&#x27;;if(w&gt;46)h+=&#x27;&lt;text x=&quot;&#x27;+(x+4)+&#x27;&quot; y=&quot;&#x27;+(y+15)+&#x27;&quot; font-size=&quot;10.5&quot; fill=&quot;&#x27;+(p[2]||&quot;var(--paper)&quot;)+&#x27;&quot;&gt;&#x27;+p[3]+&#x27; &#x27;+Math.round(p[0]/1000)+&#x27;&lt;/text&gt;&#x27;;x+=w})}
      bar(10,[[rev,&quot;var(--ochre)&quot;,0,&quot;revenues&quot;]],&quot;B · positive&quot;);
      bar(36,[[cogs,&quot;var(--rule)&quot;,&quot;var(--ink)&quot;,&quot;COGS&quot;],[100000,&quot;var(--ink2)&quot;,0,&quot;SG&amp;A&quot;]],&quot;B · negative&quot;);
      bar(90,[[rev,&quot;var(--brick)&quot;,0,&quot;revenues&quot;],[inv,&quot;var(--accent)&quot;,0,&quot;Δ invent.&quot;]],&quot;C · positive&quot;);
      bar(116,[[400000,&quot;var(--rule)&quot;,&quot;var(--ink)&quot;,&quot;materials&quot;],[500000,&quot;var(--ink2)&quot;,0,&quot;wages&quot;]],&quot;C · negative&quot;);
      h+=&#x27;&lt;text x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;176&quot; font-size=&quot;13&quot;&gt;EBIT in both: &lt;tspan font-weight=&quot;700&quot; fill=&quot;&#x27;+(ebit&lt;0?&quot;var(--brick)&quot;:&quot;var(--sage)&quot;)+&#x27;&quot;&gt;&#x27;+fmt(ebit)+&#x27;&lt;/tspan&gt; · inventory: &lt;tspan font-weight=&quot;700&quot;&gt;&#x27;+fmt(inv)+&#x27;&lt;/tspan&gt;&lt;/text&gt;&#x27;;
      $(&quot;#us-svg&quot;).innerHTML=h;
    }
    r.addEventListener(&quot;input&quot;,draw); draw();
  })();
})();
&lt;/script&gt;
