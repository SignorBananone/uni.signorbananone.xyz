&lt;section class=&quot;part p-ochre&quot; id=&quot;s-debrief&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;0&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Debriefing · Homework set 2&lt;/div&gt;&lt;h2&gt;Before we start: the corrected homework&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The first 20 minutes review three exercises. They serve as a refresher on double-entry bookkeeping, but above all they set up the lecture&#x27;s question: &lt;i&gt;why does cash grow while the company is making a loss?&lt;/i&gt;&lt;/p&gt;

  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Ex. 5 · The Library&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Ex. 6 · Retail shop&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Ex. 7 · Bergamo Bikes&lt;/button&gt;&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;A company is set up on 1 January with share capital of 20,000 (16,000 in cash and a building worth 4,000). It buys land, buys and sells goods, issues bonds, resells the land at a gain and, at year-end, depreciates the building.&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Full general journal (12 entries)&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Amount&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;1 Jan&lt;/td&gt;&lt;td&gt;Cash 16,000 · Building 4,000&lt;/td&gt;&lt;td&gt;Common stock&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;15 Mar&lt;/td&gt;&lt;td&gt;Land&lt;/td&gt;&lt;td&gt;Cash 2,000 · Accounts payable 4,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3 Jun&lt;/td&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8 Jun&lt;/td&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td&gt;Sales revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8 Jun&lt;/td&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;15 Jun&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;30 Jun&lt;/td&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;30 Jun&lt;/td&gt;&lt;td&gt;Wages and salaries&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;100&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;31 Jul&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Bonds payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;15 Sep&lt;/td&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;4,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;30 Oct&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Land 6,000 · Gain on sale of land 1,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;31 Dec&lt;/td&gt;&lt;td&gt;Depreciation expense&lt;/td&gt;&lt;td&gt;Accumulated depreciation – building&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
          &lt;tr&gt;&lt;th&gt;Balance sheet 31/12&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Building 4,000 − 200&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,800&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,100&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Bonds payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Common stock&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Net profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total liabilities + equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
          &lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Sales revenues&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(1,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Gain on the sale of land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Wages and salaries&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Points to note &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;On 8 June the sale generates &lt;b&gt;two&lt;/b&gt; entries: the revenue (1,200) and the release of inventory as &lt;span class=&quot;term&quot;&gt;cost of goods sold&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(the cost of the goods actually sold in the period)&lt;/span&gt; for 1,000. This is exactly the logic of the “Anglo-Saxon variant” of the patrimonial system seen in part B. Accounts payable close at zero (4,000 + 2,000 − 2,000 − 4,000), so they do not appear in the balance sheet. The gain on the land (1,000) is income that does not arise from ordinary operations: without it, profit would be −100.&lt;/p&gt;
        &lt;p&gt;Cash check: 16,000 − 2,000 + 1,200 − 2,000 − 100 + 2,000 − 4,000 + 7,000 = &lt;b&gt;18,100&lt;/b&gt;.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;p&gt;The slides report only the result of exercise 6:&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;assets 67 + 19 + 105 = 191 = liabilities 75 + capital and profit 116&lt;/div&gt;
      &lt;p&gt;Profit for the period is &lt;b&gt;16 = 20 − 4&lt;/b&gt;. The key point: the &lt;b&gt;25&lt;/b&gt; of goods bought on credit &lt;b&gt;do not enter profit&lt;/b&gt;, because they have not yet been sold. They remain among assets as inventory, with a payable as the corresponding entry.&lt;/p&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Why it matters &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;This is the &lt;span class=&quot;term&quot;&gt;matching principle&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(expenses are recognised in the same period as the revenues they help to generate)&lt;/span&gt;: a purchase becomes an expense of the period only when the goods generate revenue. It is the same idea that, in part B, the income system implements through the closing inventory adjustment.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot; hidden&gt;
      &lt;p&gt;Bergamo Bikes starts with 50,000 of share capital and a 20,000 bank loan at 5%. It buys equipment for 24,000 (useful life 6 years) and 100 bikes at 300 each, and sells 70 of them for 35,000 (500 each). It pays 12 months&#x27; rent in advance (6,000) and wages (8,000). Adjustments A1–A3 are the period-end adjusting entries.&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;General journal and adjustments&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Amount&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Share capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Equipment&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Inventory (100 × 300)&lt;/td&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;5a&lt;/td&gt;&lt;td&gt;Cash 20,000 · Accounts receivable 15,000&lt;/td&gt;&lt;td&gt;Sales revenue&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;5b&lt;/td&gt;&lt;td&gt;Cost of goods sold (70 × 300)&lt;/td&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Prepaid rent&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;A1&lt;/td&gt;&lt;td&gt;Depreciation expense (24,000 / 6)&lt;/td&gt;&lt;td&gt;Accumulated depreciation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;4,000&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;A2&lt;/td&gt;&lt;td&gt;Interest expense (20,000 × 5% × 3/12)&lt;/td&gt;&lt;td&gt;Accrued interest payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;250&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;A3&lt;/td&gt;&lt;td&gt;Rent expense (6,000 × 6/12)&lt;/td&gt;&lt;td&gt;Prepaid rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
          &lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Sales revenue&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(21,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;14,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(8,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Rent expense&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(3,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(4,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Operating result (EBIT)&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(1,000)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Interest expense&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(250)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;n neg&quot;&gt;(1,250)&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
        &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
          &lt;tr&gt;&lt;th&gt;Balance sheet&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Equipment 24,000 − 4,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Inventory (30 × 300)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;15,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Prepaid rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;34,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;81,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Share capital 50,000 − loss 1,250&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;48,750&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Accounts payable (30,000 − 18,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Accrued interest&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;250&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total equity + liabilities&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;81,000&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;EBIT&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;Earnings Before Interest and Taxes&lt;/span&gt;): the operating result, before finance costs and taxes. Here it is −1,000; after interest we reach the net loss of −1,250.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The question that opens the lecture: cash +34,000, loss 1,250. How?&lt;/h3&gt;
  &lt;p&gt;The slides answer as follows: financing (70,000) is not revenue; the equipment paid 24,000 is an expense only for 4,000; the unsold bikes (9,000) are not an expense; receivables (15,000) are revenue not yet collected; prepaid rent (3,000) is not an expense. The chart reconstructs the bridge from the loss to cash item by item. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 900 340&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart from the loss of 1,250 to cash of 34,000&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;My own reconstruction, using the &lt;span class=&quot;term&quot;&gt;indirect method&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(of the cash flow statement: start from the result and remove non-cash items)&lt;/span&gt;. Operating items give −12,000, investing −24,000, financing +70,000.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Break-even: how many bikes were needed?&lt;/h3&gt;
  &lt;p&gt;Each bike sells for 500 and costs 300, so it leaves a &lt;span class=&quot;term&quot;&gt;contribution margin&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(price minus variable cost)&lt;/span&gt; of 200. Fixed costs for the period are 8,000 + 3,000 + 4,000 + 250 = &lt;b&gt;15,250&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Break-even = fixed costs ÷ unit margin = 15,250 ÷ 200 ≈ 76 bikes&lt;/div&gt;
  &lt;div class=&quot;box line&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;be&quot;&gt;Bikes sold&lt;/label&gt;&lt;output id=&quot;be-n&quot;&gt;70&lt;/output&gt;&lt;input id=&quot;be&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;/div&gt;
    &lt;figure style=&quot;margin:6px 0&quot;&gt;&lt;svg id=&quot;be-svg&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Result as a function of bikes sold&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;p id=&quot;be-txt&quot; class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Note: with 76 bikes the result is still −50; the first bike that brings a profit is the 77th. The simulator holds the period&#x27;s costs and the price of 500 constant.&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Why do the 70,000 of share capital and bank loan not enter the income statement?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;They are &lt;i&gt;sources of financing&lt;/i&gt;: they increase cash but also equity (capital) or liabilities (loan). They do not arise from the sale of goods or services, so they are not revenue.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Equipment costing 24,000 with a useful life of 6 years: how much expense goes into the first year, and why?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;4,000, i.e. the depreciation charge. The cost is spread over the years in which the asset helps to generate revenue; the remainder (20,000) stays among assets.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; In exercise 6, why do the 25 of goods purchased not reduce profit?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they have not yet been sold: they remain in the warehouse as inventory (an asset), with a payable of equal amount to the supplier. They will become cost of goods sold when they are sold.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;4.&lt;/b&gt; Calculate the interest accrued on 20,000 at 5% for 3 months.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;20,000 × 5% × 3/12 = 250. It must be recognised as an expense (Interest expense) with a liability as the corresponding entry (Accrued interest payable), even though it has not yet been paid.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-world&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · Who writes the rules&lt;/div&gt;&lt;h2&gt;Accounting around the world: five families of rules&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Accounting develops where the economy develops. This is why there is no single rule, but “families” of rules, each the offspring of a different way of financing companies.&lt;/p&gt;

  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;IFRS&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;US GAAP&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Dir. 2013/34/EU&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;National laws&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Cash basis&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h4&gt;IFRS (IAS/IFRS)&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Issued by:&lt;/b&gt; the IASB (IFRS Foundation), based in London. &lt;b&gt;Used by:&lt;/b&gt; listed companies in more than 140 jurisdictions; in the EU they have been mandatory for the consolidated financial statements of listed companies since 2005. &lt;b&gt;Logic:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;principle-based&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(built on general principles to be applied with professional judgement)&lt;/span&gt;; &lt;span class=&quot;term&quot;&gt;investors first&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(the primary users are providers of equity capital)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;US GAAP&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Issued by:&lt;/b&gt; the FASB (Financial Accounting Standards Board), under the oversight of the SEC (Securities and Exchange Commission). &lt;b&gt;Used by:&lt;/b&gt; US companies; in the US, foreign issuers may also use IFRS. &lt;b&gt;Logic:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;rule-based&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(made of very detailed rules, with precise thresholds and cases)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;Directive 2013/34/EU&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Issued by:&lt;/b&gt; the European Parliament and the Council. &lt;b&gt;Used by:&lt;/b&gt; all EU limited liability companies, through the national laws that transpose it. &lt;b&gt;Logic:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;minimum harmonisation&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(sets a common core and leaves many options to Member States)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;National laws and standards&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Issued by:&lt;/b&gt; national parliaments and standard setters; in Italy, the Civil Code plus the OIC standards. &lt;b&gt;Used by:&lt;/b&gt; unlisted companies. &lt;b&gt;Logic:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;creditor protection&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(hence prudence and capital maintenance)&lt;/span&gt; and a close link with taxation.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;h4&gt;Cash basis&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Used by:&lt;/b&gt; public-sector rules and, in some countries, micro-entities: small organisations and parts of public administration. &lt;b&gt;Logic:&lt;/b&gt; &lt;span class=&quot;term&quot;&gt;cash in, cash out&lt;/span&gt;, i.e. transactions are recorded when money comes in or goes out.&lt;/p&gt;
    &lt;p class=&quot;muted&quot;&gt;&lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt; The other four families use the &lt;span class=&quot;term&quot;&gt;accrual basis&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(accrual accounting)&lt;/span&gt; instead: expenses and revenues are allocated to the period in which they accrue, regardless of when cash is received or paid. Bergamo Bikes shows the difference: on a cash basis the period would look like +34,000; on an accrual basis it is −1,250.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Spectrum of rule families: from financial markets to banks and tax&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gsp&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--slate)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;rect x=&quot;60&quot; y=&quot;104&quot; width=&quot;780&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;url(#gsp)&quot; opacity=&quot;.7&quot;/&gt;
      &lt;text x=&quot;60&quot; y=&quot;150&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;market-based financing&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;168&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;user: the investor&lt;/text&gt;
      &lt;text x=&quot;840&quot; y=&quot;150&quot; class=&quot;mut&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;bank financing&lt;/text&gt;
      &lt;text x=&quot;840&quot; y=&quot;168&quot; class=&quot;mut&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;users: creditors and tax authorities&lt;/text&gt;
      &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;circle cx=&quot;130&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;US GAAP&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;rule-based&lt;/text&gt;
        &lt;circle cx=&quot;250&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;principle-based&lt;/text&gt;
        &lt;circle cx=&quot;450&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;sagef&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;Dir. 2013/34&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;national options&lt;/text&gt;
        &lt;circle cx=&quot;640&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;C.C. + OIC&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;prudence, tax&lt;/text&gt;
        &lt;circle cx=&quot;780&quot; cy=&quot;108&quot; r=&quot;11&quot; class=&quot;brickf&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;780&quot; y=&quot;84&quot; font-weight=&quot;600&quot;&gt;Cash basis&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;66&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;receipts/payments&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot;&gt;three factors: who finances companies · who protects creditors · how close accounting is to tax&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt; My own diagram: positions on the axis are indicative and serve to visualise the slide&#x27;s “why so many?”.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Why so many?&lt;/h4&gt;&lt;p&gt;Because accounting follows the economy that uses it: who finances companies (banks or markets), who protects creditors, how close accounting is to tax law. The two “cultures” behind the rules are the two accounting systems of part B.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Principle-based&lt;/h4&gt;&lt;p&gt;A few general principles and close attention to economic substance. Preparers must exercise judgement, and the outcome is more flexible but less uniform. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;Rule-based&lt;/h4&gt;&lt;p&gt;Detailed rules, numerical thresholds, industry guidance. Easier to verify, but it invites “structuring” transactions that fall just below the threshold. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Which three factors explain why so many families of accounting rules exist?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Who finances companies (banks or markets), who protects creditors, and how closely accounting is tied to tax law.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Who issues US GAAP and who oversees them?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The FASB, under the oversight of the SEC.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; What does “minimum harmonisation” mean for Directive 2013/34?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The directive sets a mandatory common core but leaves Member States many options (formats, measurement criteria, thresholds). The result is partial harmonisation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-eu&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · The EU toolbox&lt;/div&gt;&lt;h2&gt;Regulation, directive, recommendation&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The EU has three instruments, and each affects &lt;span class=&quot;term&quot;&gt;comparability&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(between the financial statements of different companies and countries)&lt;/span&gt; in a different way.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;How the three EU instruments reach the Member States&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;!-- regulation --&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;bgf&quot; /&gt;&lt;text x=&quot;150&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;pcf&quot;&gt;Regulation&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;same text, same date&lt;/text&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M150 76 L60 180&quot;/&gt;&lt;path d=&quot;M150 76 L150 180&quot;/&gt;&lt;path d=&quot;M150 76 L240 180&quot;/&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;35&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;rect x=&quot;125&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;rect x=&quot;215&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot;/&gt;&lt;/g&gt;
        &lt;text x=&quot;150&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;&lt;b&gt;maximum&lt;/b&gt; comparability&lt;/text&gt;
        &lt;!-- directive --&gt;
        &lt;rect x=&quot;320&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;bgf&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;pcf&quot;&gt;Directive&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;objectives and framework&lt;/text&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M450 76 L360 130&quot;/&gt;&lt;path d=&quot;M450 76 L450 130&quot;/&gt;&lt;path d=&quot;M450 76 L540 130&quot;/&gt;&lt;/g&gt;
        &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;325&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;150&quot;&gt;nat. law&lt;/text&gt;&lt;rect x=&quot;415&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;150&quot;&gt;nat. law&lt;/text&gt;&lt;rect x=&quot;505&quot; y=&quot;130&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;paperf pcs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;540&quot; y=&quot;150&quot;&gt;nat. law&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;M360 160 V180&quot;/&gt;&lt;path d=&quot;M450 160 V180&quot;/&gt;&lt;path d=&quot;M540 160 V180&quot;/&gt;&lt;/g&gt;
        &lt;rect x=&quot;335&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;341&quot; y=&quot;200&quot; width=&quot;38&quot; height=&quot;24&quot; rx=&quot;3&quot; class=&quot;ochref&quot;/&gt;
        &lt;rect x=&quot;425&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;431&quot; y=&quot;190&quot; width=&quot;38&quot; height=&quot;34&quot; rx=&quot;3&quot; class=&quot;slatef&quot;/&gt;
        &lt;rect x=&quot;515&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcs paperf&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;521&quot; y=&quot;210&quot; width=&quot;38&quot; height=&quot;14&quot; rx=&quot;3&quot; class=&quot;brickf&quot;/&gt;
        &lt;text x=&quot;450&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;&lt;b&gt;partial&lt;/b&gt; comparability: same skeleton, different “flesh”&lt;/text&gt;
        &lt;!-- recommendation --&gt;
        &lt;rect x=&quot;620&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;bgf&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; class=&quot;pcf&quot;&gt;Recommendation&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;non-binding&lt;/text&gt;
        &lt;g class=&quot;pcs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-dasharray=&quot;4 6&quot;&gt;&lt;path d=&quot;M750 76 L660 180&quot;/&gt;&lt;path d=&quot;M750 76 L750 180&quot;/&gt;&lt;path d=&quot;M750 76 L840 180&quot;/&gt;&lt;/g&gt;
        &lt;rect x=&quot;635&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;&lt;rect x=&quot;725&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;pcf&quot; opacity=&quot;.5&quot;/&gt;&lt;rect x=&quot;815&quot; y=&quot;180&quot; width=&quot;50&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;
        &lt;text x=&quot;750&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;&lt;b&gt;no&lt;/b&gt; comparability, unless followed&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The squares are the Member States. With a directive the framework is common (border) but the content (fill) varies from State to State.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabset&quot;&gt;
    &lt;div class=&quot;tabs&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Regulation&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Directive&lt;/button&gt;&lt;button aria-selected=&quot;false&quot;&gt;Recommendation&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;b&gt;How it works:&lt;/b&gt; it is directly applicable in all Member States, with the same text and from the same date. No national transposing law is needed.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Accounting example:&lt;/b&gt; &lt;b&gt;Regulation (EC) 1606/2002&lt;/b&gt; makes IFRS mandatory for the consolidated financial statements of listed companies from 2005. Each individual IFRS then enters EU law through its own Commission regulation (&lt;i&gt;endorsement&lt;/i&gt;, section 5).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;How it works:&lt;/b&gt; it sets objectives and a framework; each State &lt;span class=&quot;term&quot;&gt;transposes&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(incorporates it into national law)&lt;/span&gt; it through a national law, with its own options and timing.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Accounting examples:&lt;/b&gt; Dir. &lt;b&gt;2013/34/EU&lt;/b&gt; (annual and consolidated financial statements), transposed in Italy by &lt;b&gt;Legislative Decree 139/2015&lt;/b&gt;, which amends the Civil Code; Dir. &lt;b&gt;2022/2464&lt;/b&gt; (CSRD), transposed by &lt;b&gt;Legislative Decree 125/2024&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;How it works:&lt;/b&gt; it is not binding; it invites States or bodies to act. It affects comparability only if it is followed.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Accounting example:&lt;/b&gt; &lt;b&gt;Rec. 2001/453/EC&lt;/b&gt; on environmental information in annual reports, a forerunner of sustainability reporting (section 7).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;In Italy&lt;/h4&gt;&lt;p&gt;Directives → &lt;b&gt;legislative decrees&lt;/b&gt; (D.Lgs.) that rewrite the Civil Code (Arts. 2423-2435-ter).&lt;/p&gt;&lt;p style=&quot;margin:0&quot;&gt;Regulations → immediately applicable; &lt;b&gt;Legislative Decree 38/2005&lt;/b&gt; merely establishes who may or must use IFRS.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box line&quot;&gt;&lt;h4&gt;Question from the slide&lt;/h4&gt;&lt;p&gt;Two companies, one in Milan and one in Madrid, both unlisted, both subject to Directive 2013/34: can their financial statements differ? Why?&lt;/p&gt;
      &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes: because of &lt;b&gt;national options&lt;/b&gt;. For example, LIFO is permitted in Italy, and formats and thresholds differ. The directive harmonises the skeleton, not every choice.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Why can two companies subject to an EU regulation not present different financial statements, whereas two subject to the same directive can?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A regulation applies directly with the same text everywhere. A directive goes through national laws that choose among the available options and set the timing: same framework, different content.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Does Legislative Decree 38/2005 “transpose” Regulation 1606/2002?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: regulations do not need transposition. Legislative Decree 38/2005 exercises the options that the regulation leaves to Member States, i.e. it decides which other companies may or must use IFRS.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Match each act to its instrument: Rec. 2001/453 · Dir. 2022/2464 · Reg. 1606/2002.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Recommendation (environmental information, non-binding) · Directive (CSRD, transposed by Legislative Decree 125/2024) · Regulation (IFRS mandatory for the consolidated statements of listed companies).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;s-italy&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · Italy: who applies what&lt;/div&gt;&lt;h2&gt;Three layers of rules in the same country&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;In Italy, IFRS (via Legislative Decree 38/2005) coexist with the Civil Code supplemented by the OIC standards. Which set applies depends on the type of company.&lt;/p&gt;

  &lt;p&gt;&lt;b&gt;Choose a type of company:&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;chips&quot; data-chips=&quot;#it-out&quot;&gt;
    &lt;button class=&quot;btn on&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: mandatory&amp;lt;/b&amp;gt; for the consolidated statements and, with exceptions, also for the separate financial statements (Legislative Decree 38/2005). Civil Code + OIC as the set of accounting standards: —. The Civil Code nonetheless remains relevant for approval, profit distribution and reserves.&quot;&gt;Listed companies, banks, financial intermediaries, insurance groups&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: optional&amp;lt;/b&amp;gt;, as an irrevocable choice. &amp;lt;b&amp;gt;Civil Code + OIC: default regime.&amp;lt;/b&amp;gt; If they do not opt for IFRS, they apply the national rules.&quot;&gt;Other companies that prepare (or are included in) consolidated statements, and other larger companies&lt;/button&gt;
    &lt;button class=&quot;btn&quot; data-info=&quot;&amp;lt;b&amp;gt;IFRS: not permitted.&amp;lt;/b&amp;gt; &amp;lt;b&amp;gt;Civil Code + OIC: mandatory&amp;lt;/b&amp;gt;, with the simplified formats of abridged financial statements (Art. 2435-bis) or of micro-entities (Art. 2435-ter).&quot;&gt;Companies eligible for abridged financial statements, and micro-entities&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;info&quot; id=&quot;it-out&quot;&gt;&lt;b&gt;IFRS: mandatory&lt;/b&gt; for the consolidated statements and, with exceptions, also for the separate financial statements (Legislative Decree 38/2005). Civil Code + OIC as the set of accounting standards: —. The Civil Code nonetheless remains relevant for approval, profit distribution and reserves.&lt;/div&gt;

  &lt;h3&gt;An Italian IFRS adopter lives on three layers&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Three layers of rules for an Italian company that adopts IFRS&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;120&quot; y=&quot;20&quot; width=&quot;660&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;slatef&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;140&quot; y=&quot;46&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;IFRS&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;68&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;measurement and presentation of financial statement items&lt;/text&gt;
        &lt;rect x=&quot;90&quot; y=&quot;96&quot; width=&quot;720&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;sagef&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;122&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Civil Code&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;144&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;approval of the financial statements · profit distribution · reserves · management report&lt;/text&gt;
        &lt;rect x=&quot;60&quot; y=&quot;172&quot; width=&quot;780&quot; height=&quot;62&quot; rx=&quot;10&quot; class=&quot;brickf&quot; opacity=&quot;.9&quot;/&gt;
        &lt;text x=&quot;80&quot; y=&quot;198&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; font-size=&quot;16&quot;&gt;Tax law (IRES / IRAP)&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;220&quot; fill=&quot;var(--paper)&quot; font-size=&quot;13&quot;&gt;taxes calculated starting from the accounting result&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;b&gt;IRES&lt;/b&gt; = corporate income tax; &lt;b&gt;IRAP&lt;/b&gt; = regional tax on productive activities. The accounting result is the starting point for taxable income. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;Unlisted companies apply the Civil Code + OIC, with some definitions “borrowed” from IFRS through &lt;b&gt;Art. 2426(2) of the Civil Code&lt;/b&gt;. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt; That paragraph refers to the international accounting standards adopted by the EU for definitions such as financial instrument, derivative and fair value: in this way even the “national” financial statements partly speak the language of IFRS.&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;OIC – Organismo Italiano di Contabilità (Italian Accounting Standard Setter)&lt;/h4&gt;
      &lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
        &lt;li&gt;National standard setter since 2001; recognised by law through &lt;b&gt;Law 116/2014&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;Issues the OIC standards, which interpret and supplement the Civil Code (from OIC 11 to OIC 35).&lt;/li&gt;
        &lt;li&gt;Represents Italy in EFRAG.&lt;/li&gt;
      &lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box line&quot;&gt;&lt;h4&gt;Quick glossary&lt;/h4&gt;
      &lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;Separate financial statements&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;bilancio separato&lt;/span&gt;): the statements of the individual company when it also prepares consolidated statements. &lt;b&gt;Consolidated&lt;/b&gt;: the statements of the group as a single entity. &lt;b&gt;Abridged&lt;/b&gt;: financial statements with reduced formats for companies below certain size thresholds. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Can an unlisted Italian S.p.A. with 300 employees adopt IFRS? Must it? Which rules govern profit distribution?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;With 300 employees it does not qualify for abridged financial statements, so it falls among the “other larger companies”: it &lt;b&gt;may&lt;/b&gt; adopt IFRS (an optional and irrevocable choice), but it &lt;b&gt;need not&lt;/b&gt;, because it is not listed, not a bank and not an insurer. The default is Civil Code + OIC. Approval, reserves and profit distribution remain governed by the &lt;b&gt;Civil Code&lt;/b&gt; in any case, even if it adopts IFRS. &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt; For IFRS adopters, Legislative Decree 38/2005 adds limits on distributing unrealised fair value gains: check this against the text.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; If Bergamo Bikes qualifies for abridged financial statements, can it use IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: for companies eligible for abridged financial statements (Art. 2435-bis) and for micro-entities (2435-ter) IFRS are not permitted; the Civil Code + OIC apply.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; What are the three layers of rules for an Italian IFRS adopter?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IFRS for measurement and presentation; the Civil Code for approval, profit distribution, reserves and the management report; tax law (IRES/IRAP) built on the accounting result.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-timeline&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · Convergence&lt;/div&gt;&lt;h2&gt;Two timelines: the world and the EU&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Tap a point to read its meaning. The two stories run in parallel and meet in &lt;b&gt;2002–2005&lt;/b&gt;: the EU chooses not to write its own standards and adopts those of the IASB.&lt;/p&gt;
  &lt;div data-chips=&quot;#tl-out&quot;&gt;
  &lt;figure style=&quot;margin-bottom:6px&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Interactive timelines&quot;&gt;
      &lt;style&gt;.tl{cursor:pointer}.tl circle{transition:r .15s}.tl:hover circle,.tl:focus circle,.tl.on circle{r:15}.tl.on circle{stroke:var(--ink);stroke-width:2}.tl:focus{outline:none}&lt;/style&gt;
      &lt;text x=&quot;20&quot; y=&quot;40&quot; class=&quot;slatef serif&quot; font-size=&quot;18&quot;&gt;World&lt;/text&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;80&quot; x2=&quot;880&quot; y2=&quot;80&quot; class=&quot;slates&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;text x=&quot;20&quot; y=&quot;160&quot; class=&quot;brickf serif&quot; font-size=&quot;18&quot;&gt;EU&lt;/text&gt;
      &lt;line x1=&quot;20&quot; y1=&quot;200&quot; x2=&quot;880&quot; y2=&quot;200&quot; class=&quot;bricks&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1973 · The IASC is founded&amp;lt;/b&amp;gt; (International Accounting Standards Committee), which issues the first IASs. &amp;lt;span class=from&amp;gt;explanation&amp;lt;/span&amp;gt; It was a committee of the professional accountancy bodies of a few countries, with no power to enforce its standards.&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;112&quot;&gt;1973&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2001 · The IASB replaces the IASC.&amp;lt;/b&amp;gt; The IASs already issued remain in force (some of them still today); new standards are called IFRSs.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;112&quot;&gt;2001&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2002 · Norwalk Agreement&amp;lt;/b&amp;gt; between the IASB and the FASB (Norwalk, Connecticut): the two boards commit to making IFRS and US GAAP compatible.&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;112&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2005 · The EU and Australia adopt IFRS.&amp;lt;/b&amp;gt; For the EU it is the first year in which Reg. 1606/2002 applies to the consolidated statements of listed companies.&quot;&gt;&lt;circle cx=&quot;440&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;112&quot;&gt;2005&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2006–09 · IASB–FASB MoU&amp;lt;/b&amp;gt; (Memorandum of Understanding, a programme of joint projects); the &amp;lt;b&amp;gt;G20&amp;lt;/b&amp;gt; supports convergence. &amp;lt;span class=from&amp;gt;explanation&amp;lt;/span&amp;gt; After the global financial crisis, the G20 calls for a single set of high-quality standards.&quot;&gt;&lt;circle cx=&quot;560&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;112&quot;&gt;2006–09&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2010s · Convergence slows down&amp;lt;/b&amp;gt;: the US does not adopt IFRS for domestic companies; IFRS are nonetheless adopted in more than 140 jurisdictions.&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;112&quot;&gt;2010s&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2021 · The ISSB is founded&amp;lt;/b&amp;gt; (International Sustainability Standards Board), within the IFRS Foundation: sustainability standards IFRS S1 and S2. &amp;lt;span class=ext&amp;gt;external source&amp;lt;/span&amp;gt; S1 and S2 were published on 26 June 2023 (&amp;lt;a href=&#x27;https://www.icaew.com/technical/corporate-reporting/non-financial-reporting/international-sustainability-disclosure-standards&#x27; target=&#x27;_blank&#x27; rel=&#x27;noopener&#x27;&amp;gt;ICAEW&amp;lt;/a&amp;gt;).&quot;&gt;&lt;circle cx=&quot;800&quot; cy=&quot;80&quot; r=&quot;11&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;112&quot;&gt;2021&lt;/text&gt;&lt;/g&gt;

        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1978 · Fourth Directive&amp;lt;/b&amp;gt; on the annual accounts of limited liability companies. &amp;lt;span class=from&amp;gt;explanation&amp;lt;/span&amp;gt; In Italy it was transposed, together with the Seventh, by Legislative Decree 127/1991.&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;232&quot;&gt;1978&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1983 · Seventh Directive&amp;lt;/b&amp;gt; on consolidated accounts.&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;232&quot;&gt;1983&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;1995 · Commission strategy on IAS.&amp;lt;/b&amp;gt; &amp;lt;span class=from&amp;gt;explanation&amp;lt;/span&amp;gt; The EU gives up on creating a European standard setter and looks to IAS as the reference.&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;232&quot;&gt;1995&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2000 · Financial Services Action Plan&amp;lt;/b&amp;gt;: an integrated capital market requires comparable financial statements.&quot;&gt;&lt;circle cx=&quot;440&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;232&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2002 · Reg. 1606/2002&amp;lt;/b&amp;gt;: IFRS mandatory from 2005 for the consolidated statements of EU listed companies, subject to endorsement.&quot;&gt;&lt;circle cx=&quot;560&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;232&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2013 · Dir. 2013/34/EU&amp;lt;/b&amp;gt;: a single directive for annual and consolidated financial statements, transposed in Italy by Legislative Decree 139/2015. &amp;lt;span class=ext&amp;gt;external source&amp;lt;/span&amp;gt; It repeals Directives 78/660/EEC and 83/349/EEC (&amp;lt;a href=&#x27;https://www.legislation.gov.uk/eudr/2013/34&#x27; target=&#x27;_blank&#x27; rel=&#x27;noopener&#x27;&amp;gt;text of the directive&amp;lt;/a&amp;gt;).&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;232&quot;&gt;2013&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;2022–25 · CSRD, then Omnibus.&amp;lt;/b&amp;gt; Sustainability reporting becomes mandatory for many companies, then the Omnibus package narrows its scope (section 7).&quot;&gt;&lt;circle cx=&quot;800&quot; cy=&quot;200&quot; r=&quot;11&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;800&quot; y=&quot;232&quot;&gt;2022–25&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M440 92 C 470 140 530 150 560 188&quot; fill=&quot;none&quot; class=&quot;accs&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;info&quot; id=&quot;tl-out&quot;&gt;Tap a point on either timeline.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;Note from the slide: the 2002 IASB–FASB agreement is the “Norwalk Agreement” (Norwalk, Connecticut).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; What is the difference between IAS and IFRS?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IASs (1-41) were issued by the IASC up to 2001; IFRSs (1-19) by the IASB after 2001. “IFRS” is used for the two together, plus the interpretations.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; In which year does the EU make IFRS mandatory, and through which act?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Through Regulation (EC) 1606/2002, for the consolidated statements of listed companies from 2005.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; What is the Norwalk Agreement?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The 2002 agreement between the IASB and the FASB to make IFRS and US GAAP compatible (convergence).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-ifrs&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · What “IFRS” contains&lt;/div&gt;&lt;h2&gt;Bodies, documents, and how a standard is born&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;The bodies&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;&lt;b&gt;IFRS Foundation&lt;/b&gt;: trustees and monitoring board (who governs and who oversees the foundation).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IASB&lt;/b&gt;: 14 members, issues IAS/IFRS.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IFRS Interpretations Committee&lt;/b&gt;: resolves application issues.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;ISSB&lt;/b&gt; (2021): sustainability standards IFRS S1 and S2.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;The documents&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;&lt;b&gt;Conceptual Framework&lt;/b&gt; (2018): not a standard, but the basis of all standards.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;IAS 1-41&lt;/b&gt; (issued by the IASC, some still in force) and &lt;b&gt;IFRS 1-19&lt;/b&gt; (IFRS 18 and 19 issued in 2024).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Interpretations&lt;/b&gt;: SIC (older) and IFRIC.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--accent)&quot;&gt;&lt;h4 style=&quot;color:var(--accent)&quot;&gt;Names to remember&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;
      &lt;li&gt;IAS 1 → &lt;b&gt;IFRS 18&lt;/b&gt; from 2027 (presentation).&lt;/li&gt;
      &lt;li&gt;IAS 16, 38, 36, 40 (assets).&lt;/li&gt;
      &lt;li&gt;IFRS 15 (revenue), IFRS 16 (leases), IFRS 9 (financial instruments).&lt;/li&gt;&lt;/ul&gt;
      &lt;p style=&quot;margin-top:.5em;color:var(--accent);font-weight:600&quot;&gt;This is the course syllabus from 5 October.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;What IAS 16, 38, 36 and 40 cover &lt;span class=&quot;from&quot;&gt;explanation&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;b&gt;IAS 16&lt;/b&gt; Property, plant and equipment · &lt;b&gt;IAS 38&lt;/b&gt; Intangible assets · &lt;b&gt;IAS 36&lt;/b&gt; Impairment of assets (when the recoverable amount falls below the carrying amount) · &lt;b&gt;IAS 40&lt;/b&gt; Investment property (property held to earn rentals or for capital appreciation).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The hierarchy in practice (IAS 8)&lt;/h3&gt;
  &lt;p&gt;What does a preparer do if a transaction is not covered by any standard?&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;IAS 8 hierarchy as steps&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;150&quot; width=&quot;280&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;36&quot; y=&quot;176&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;① Standard or interpretation&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;196&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;that applies to the transaction&lt;/text&gt;
        &lt;rect x=&quot;310&quot; y=&quot;95&quot; width=&quot;280&quot; height=&quot;115&quot; rx=&quot;8&quot; class=&quot;slatef&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;326&quot; y=&quot;121&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;② Judgement&lt;/text&gt;&lt;text x=&quot;326&quot; y=&quot;141&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;based on similar standards&lt;/text&gt;&lt;text x=&quot;326&quot; y=&quot;159&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;and on the Conceptual Framework&lt;/text&gt;
        &lt;rect x=&quot;600&quot; y=&quot;40&quot; width=&quot;280&quot; height=&quot;170&quot; rx=&quot;8&quot; class=&quot;slatef&quot; opacity=&quot;.5&quot;/&gt;&lt;text x=&quot;616&quot; y=&quot;66&quot; font-weight=&quot;600&quot;&gt;③ Other standard setters&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;86&quot; font-size=&quot;12.5&quot;&gt;with a similar framework&lt;/text&gt;&lt;text x=&quot;616&quot; y=&quot;104&quot; font-size=&quot;12.5&quot;&gt;(e.g. FASB)&lt;/text&gt;
        &lt;text x=&quot;20&quot; y=&quot;30&quot; class=&quot;accf serif&quot; font-size=&quot;16&quot; font-style=&quot;italic&quot;&gt;The Framework never overrides a standard.&lt;/text&gt;
        &lt;path d=&quot;M160 140 C 200 80 260 80 300 100&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;path d=&quot;M450 85 C 490 30 550 30 595 50&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;text x=&quot;210&quot; y=&quot;74&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;middle&quot;&gt;if there is none&lt;/text&gt;
        &lt;text x=&quot;520&quot; y=&quot;22&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;middle&quot;&gt;if still not enough&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;s-due&quot;&gt;How a standard is born and enters EU law&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-generic&gt;
    &lt;svg viewBox=&quot;0 0 900 70&quot; role=&quot;img&quot; aria-label=&quot;The six stages: three at the IASB, three in the EU&quot; style=&quot;width:100%;height:auto;margin-bottom:10px&quot;&gt;
      &lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;
        &lt;path d=&quot;M0 5 H130 L150 35 L130 65 H0 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Research&lt;/text&gt;
        &lt;path d=&quot;M150 5 H280 L300 35 L280 65 H150 L170 35 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;228&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Exposure Draft&lt;/text&gt;
        &lt;path d=&quot;M300 5 H430 L450 35 L430 65 H300 L320 35 Z&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;378&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;Standard&lt;/text&gt;
        &lt;path d=&quot;M450 5 H580 L600 35 L580 65 H450 L470 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;528&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;EFRAG&lt;/text&gt;
        &lt;path d=&quot;M600 5 H730 L750 35 L730 65 H600 L620 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;678&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;ARC&lt;/text&gt;
        &lt;path d=&quot;M750 5 H880 L900 35 L880 65 H750 L770 35 Z&quot; class=&quot;brickf&quot;/&gt;&lt;text x=&quot;828&quot; y=&quot;40&quot; fill=&quot;var(--paper)&quot;&gt;EU regulation&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;steplab muted&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;1 · Research &lt;small&gt;(IASB, global)&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;The IASB decides to add a topic to its agenda (&lt;span class=&quot;term&quot;&gt;agenda decision&lt;/span&gt;) and may publish a &lt;span class=&quot;term&quot;&gt;Discussion Paper&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(a document setting out initial views and alternatives)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;2 · Exposure Draft&lt;/h4&gt;&lt;p&gt;The draft standard is put out for consultation: anyone can submit &lt;span class=&quot;term&quot;&gt;comment letters&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(public written responses)&lt;/span&gt;, usually within &lt;b&gt;120 days&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--slate)&quot;&gt;3 · Standard&lt;/h4&gt;&lt;p&gt;The IASB votes on the final text, sets the &lt;span class=&quot;term&quot;&gt;effective date&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(the date from which it applies)&lt;/span&gt; and, after a few years, carries out a &lt;span class=&quot;term&quot;&gt;post-implementation review&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(an assessment of how it works in practice)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;4 · EFRAG &lt;small&gt;(EU, endorsement)&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;EFRAG (European Financial Reporting Advisory Group) gives the Commission technical advice: does the standard meet the criteria and is it &lt;i&gt;conducive to the European public good&lt;/i&gt;?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;5 · ARC&lt;/h4&gt;&lt;p&gt;The &lt;span class=&quot;term&quot;&gt;Accounting Regulatory Committee&lt;/span&gt;, made up of Member State representatives, votes.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4 style=&quot;color:var(--brick)&quot;&gt;6 · EU regulation&lt;/h4&gt;&lt;p&gt;The Commission publishes a regulation in the Official Journal of the EU in all languages: &lt;b&gt;it is now law&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;box extbox&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;h4&gt;A recent example &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;IFRS 18 was endorsed by &lt;b&gt;Regulation (EU) 2026/338&lt;/b&gt;, adopted on 13 February 2026 and published in the Official Journal on 16 February 2026; it applies to reporting periods beginning on or after 1 January 2027. &lt;a href=&quot;https://www.iasplus.com/en/news/2026/02/eu-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.fondazioneoic.eu/31086/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Why endorsement matters&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The EU can adopt, reject or &lt;span class=&quot;term&quot;&gt;carve out&lt;/span&gt; &lt;span class=&quot;gl&quot;&gt;(adopt a standard while removing some of its parts)&lt;/span&gt; a standard. It did so with &lt;b&gt;IAS 39 in 2004&lt;/b&gt;. The EU version of IFRS is “IFRS &lt;i&gt;as adopted by the EU&lt;/i&gt;”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Timing&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Between the IASB standard and the EU regulation there are usually &lt;b&gt;6-18 months&lt;/b&gt;. A standard cannot be applied in the EU before endorsement; early application is allowed only if the standard has already been endorsed.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box extbox&quot;&gt;&lt;h4&gt;The IAS 39 carve-out &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;In November 2004 the Commission endorsed IAS 39 excluding two parts: the &lt;i&gt;fair value option&lt;/i&gt; for financial liabilities and some portfolio &lt;i&gt;hedge accounting&lt;/i&gt; rules (macro hedging) requested by banks. The fair value option carve-out was lifted in 2005, after an amendment by the IASB; the macro hedging one remained. &lt;a href=&quot;https://www.iasplus.com/en/news/2004/September/news1751&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.gov.uk/hmrc-internal-manuals/corporate-finance-manual/cfm21020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HMRC CFM21020&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; Is the Conceptual Framework a standard? Can it override a standard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No and no. It is the conceptual basis of the standards and is used when no standard applies (IAS 8), but it never overrides a standard.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Put in order: ARC · Exposure Draft · EFRAG · Research · EU regulation · Standard.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Research → Exposure Draft → Standard → EFRAG → ARC → EU regulation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; What does “IFRS as adopted by the EU” mean?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;That in the EU only the IFRSs endorsed by regulation apply, possibly with carve-outs. They may therefore differ from the IASB&#x27;s IFRS, as in the case of IAS 39 in 2004.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;4.&lt;/b&gt; Which standard replaces IAS 1, and from when?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IFRS 18, from 2027.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-qual&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · What makes information useful&lt;/div&gt;&lt;h2&gt;Qualitative characteristics (Conceptual Framework 2018)&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;They are the yardstick against which every standard and every national rule can be judged. Tap an element of the building.&lt;/p&gt;
  &lt;div data-chips=&quot;#q-out&quot;&gt;
  &lt;figure style=&quot;margin-bottom:6px&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 360&quot; role=&quot;img&quot; aria-label=&quot;Building of the qualitative characteristics&quot;&gt;
      &lt;style&gt;.qk{cursor:pointer}.qk:hover rect,.qk:focus rect,.qk.on rect,.qk.on path{stroke:var(--ink);stroke-width:2.5}.qk:focus{outline:none}&lt;/style&gt;
      &lt;g font-size=&quot;15&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;path d=&quot;M120 70 L450 10 L780 70 Z&quot; class=&quot;accf&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;58&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;18&quot;&gt;Useful financial information&lt;/text&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Relevance&amp;lt;/b&amp;gt;: the information is capable of making a difference to decisions, because it has &amp;lt;i&amp;gt;predictive&amp;lt;/i&amp;gt; value (helps to forecast) or &amp;lt;i&amp;gt;confirmatory&amp;lt;/i&amp;gt; value (confirms or corrects past expectations). &amp;lt;b&amp;gt;Materiality&amp;lt;/b&amp;gt; is an entity-specific aspect of relevance: information is material if omitting or misstating it could influence users&#x27; decisions.&quot;&gt;&lt;rect x=&quot;150&quot; y=&quot;80&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;6&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;148&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Relevance&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;170&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;materiality&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Faithful representation&amp;lt;/b&amp;gt;: complete, neutral (supported by &amp;lt;i&amp;gt;prudence&amp;lt;/i&amp;gt;, i.e. caution under conditions of uncertainty) and free from error. It includes &amp;lt;b&amp;gt;substance over form&amp;lt;/b&amp;gt; (economic substance prevails over legal form).&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;80&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;6&quot; class=&quot;slatef&quot;/&gt;&lt;text x=&quot;625&quot; y=&quot;148&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;Faithful representation&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;170&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12.5&quot;&gt;complete · neutral · free from error&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Comparability&amp;lt;/b&amp;gt;: across periods and across entities. It requires &amp;lt;i&amp;gt;consistency&amp;lt;/i&amp;gt;, i.e. applying the same methods over time.&quot;&gt;&lt;rect x=&quot;120&quot; y=&quot;240&quot; width=&quot;160&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;270&quot;&gt;Comparability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Verifiability&amp;lt;/b&amp;gt;: different knowledgeable and independent observers could reach consensus (though not necessarily complete agreement) that the depiction is faithful.&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;240&quot; width=&quot;155&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;367&quot; y=&quot;270&quot;&gt;Verifiability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Timeliness&amp;lt;/b&amp;gt;: the information is available in time to influence decisions. A perfect set of financial statements published too late is of little use.&quot;&gt;&lt;rect x=&quot;455&quot; y=&quot;240&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;270&quot;&gt;Timeliness&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Understandability&amp;lt;/b&amp;gt;: comprehensible to users with reasonable knowledge who apply reasonable diligence. Complex matters are &amp;lt;i&amp;gt;not&amp;lt;/i&amp;gt; omitted because they are difficult.&quot;&gt;&lt;rect x=&quot;615&quot; y=&quot;240&quot; width=&quot;165&quot; height=&quot;50&quot; rx=&quot;6&quot; class=&quot;bgf&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;697&quot; y=&quot;270&quot;&gt;Understandability&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;qk&quot; tabindex=&quot;0&quot; role=&quot;button&quot; data-info=&quot;&amp;lt;b&amp;gt;Cost constraint&amp;lt;/b&amp;gt;: the benefits of reporting must justify its costs. This is why small and micro-entities have simplified formats and exemptions in every jurisdiction, such as abridged and micro-entity financial statements in Italy.&quot;&gt;&lt;rect x=&quot;80&quot; y=&quot;300&quot; width=&quot;740&quot; height=&quot;44&quot; rx=&quot;6&quot; class=&quot;rulef&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;328&quot; font-weight=&quot;600&quot;&gt;Cost constraint&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;50&quot; y=&quot;160&quot; font-size=&quot;12&quot; class=&quot;mut&quot; transform=&quot;rotate(-90 50 160)&quot;&gt;fundamental&lt;/text&gt;
        &lt;text x=&quot;50&quot; y=&quot;268&quot; font-size=&quot;12&quot; class=&quot;mut&quot; text-anchor=&quot;start&quot; transform=&quot;rotate(-90 50 268)&quot; dy=&quot;0&quot;&gt;enhancing&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;info&quot; id=&quot;q-out&quot;&gt;The two columns are the &lt;b&gt;fundamental&lt;/b&gt; characteristics; the band below contains the &lt;b&gt;enhancing&lt;/b&gt; ones &lt;span class=&quot;gl&quot;&gt;(they improve information that is already relevant and faithfully represented, but cannot rescue it if either fundamental characteristic is missing)&lt;/span&gt;; at the base lies the cost constraint.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;muted&quot;&gt;The slide notes that the course picks up from here on 5 October with Prof. Aprile (next lecture: &lt;i&gt;the IFRS Conceptual Framework&lt;/i&gt;).&lt;/p&gt;

  &lt;div class=&quot;check&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;1.&lt;/b&gt; What are the two fundamental characteristics?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Relevance and faithful representation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;2.&lt;/b&gt; Where does prudence sit in the 2018 Framework?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;As support for neutrality, within faithful representation: caution in making judgements under conditions of uncertainty.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;&lt;b&gt;3.&lt;/b&gt; Why do micro-entities have simplified formats?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because of the cost constraint: the cost of full reporting would exceed the benefits to their users.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;s-sust&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;part-num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part A · Beyond financial reporting&lt;/div&gt;&lt;h2&gt;Sustainability reporting: from NFRD to CSRD, and the Omnibus&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;NFRD · Dir. 2014/95, Legislative Decree 254/2016&lt;/th&gt;&lt;th&gt;CSRD · Dir. 2022/2464, Legislative Decree 125/2024&lt;/th&gt;&lt;/tr&gt;
