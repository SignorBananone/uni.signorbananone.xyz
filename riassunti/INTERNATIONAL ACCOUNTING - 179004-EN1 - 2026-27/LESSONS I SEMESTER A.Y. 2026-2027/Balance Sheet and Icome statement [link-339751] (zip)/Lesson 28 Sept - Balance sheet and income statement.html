  &lt;h3&gt;Il ponte tra i due prospetti&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 230&quot; role=&quot;img&quot; aria-label=&quot;Il risultato del conto economico confluisce nell&#x27;equity&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;190&quot; rx=&quot;10&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;text x=&quot;145&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Income statement&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Sales 500&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Expenses (1.160)&lt;/text&gt;
      &lt;line x1=&quot;70&quot; x2=&quot;220&quot; y1=&quot;114&quot; y2=&quot;114&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
      &lt;text x=&quot;145&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Net loss (660)&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;azzerato a fine anno: «closing»&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M272 132C380 132 420 170 560 170&quot; marker-end=&quot;url(#ar2)&quot; style=&quot;stroke:var(--accent);stroke-width:2.5&quot;/&gt;
      &lt;text x=&quot;415&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; class=&quot;elab&quot;&gt;il risultato passa all&#x27;equity&lt;/text&gt;
      &lt;rect x=&quot;570&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;190&quot; rx=&quot;10&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text x=&quot;705&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Balance sheet&lt;/text&gt;
      &lt;text x=&quot;640&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Assets 2.620&lt;/text&gt;
      &lt;text x=&quot;770&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Payables 680&lt;/text&gt;
      &lt;line x1=&quot;705&quot; x2=&quot;705&quot; y1=&quot;62&quot; y2=&quot;200&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;text x=&quot;770&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Capitale 2.600&lt;/text&gt;
      &lt;rect x=&quot;712&quot; y=&quot;152&quot; width=&quot;120&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
      &lt;text x=&quot;772&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12.5px;font-weight:600&quot;&gt;Net loss (660)&lt;/text&gt;
      &lt;text x=&quot;705&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;riportato all&#x27;anno successivo&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Regola&lt;/b&gt;: i conti di balance sheet si riportano; quelli di income statement si &lt;b&gt;azzerano ogni anno&lt;/b&gt; e il loro risultato netto passa nell&#x27;equity.&lt;/div&gt;
  &lt;p&gt;Per questo il balance sheet quadra solo &lt;em&gt;dopo&lt;/em&gt; aver aggiunto il net loss: 680 + 2.600 − 660 = 2.620. Nel trial balance la perdita «non si vede» perché è dispersa in 12 conti di costo e ricavo; i prospetti la fanno emergere come un unico numero. È anche il primo pezzo della risposta alla domanda guida.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché Office Supplies (75) va nel conto economico mentre Office Equipment (225) nel balance sheet?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;La cancelleria si consuma in poche settimane (nessun valore durevole), mentre telefono, fax e stampante servono per anni. In realtà anche l&#x27;attrezzatura si consuma col tempo: lo si registra con l&#x27;ammortamento, una delle rettifiche di fine anno (sezione 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quanto vale l&#x27;equity del website business al 31/12 e come si calcola in due modi?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;1.940. Per differenza: assets 2.620 − liabilities 680. Per composizione: capitale conferito 2.600 − perdita 660.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il 1° gennaio, che saldo avranno i conti Rent e Checking Account?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Rent riparte da zero: è un conto di income statement, chiuso e trasferito all&#x27;equity. Checking Account riparte da 550: è un conto di balance sheet e si riporta.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--h:var(--brick);--hb:var(--brick-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;5&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Nella realtà delle imprese · slide 18&lt;/div&gt;&lt;h2&gt;Year-end adjustments&lt;/h2&gt;
  &lt;p&gt;Prima di potersi fidare dei prospetti servono le &lt;span class=&quot;t&quot;&gt;adjusting entries&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(scritture di rettifica / di assestamento di fine esercizio)&lt;/i&gt;.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;formula&quot;&gt;Profit si misura su &lt;b&gt;accrual basis&lt;/b&gt;: i ricavi del periodo − i costi degli input &lt;b&gt;consumati&lt;/b&gt; per ottenerli&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Accrual basis&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(principio di competenza economica)&lt;/i&gt;: un costo appartiene all&#x27;anno in cui la risorsa viene consumata, non a quello in cui viene pagata; un ricavo all&#x27;anno in cui viene guadagnato, non a quello in cui si incassa. Il libro mastro al 31 dicembre registra ancora &lt;b&gt;pagamenti e incassi&lt;/b&gt;. Le rettifiche li trasformano in &lt;b&gt;ricavi e costi del periodo&lt;/b&gt;.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;Cassa contro competenza&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Ledger al 31/12&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;pagamenti e incassi (cash)&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M266 60H330&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;340&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Adjusting entries&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;5 famiglie&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M546 60H600&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;610&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Prospetti affidabili&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;ricavi e costi di competenza&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le cinque rettifiche, con Bergamo Bikes (esercizio 7)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Inventory&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Depreciation&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Accruals&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Prepayments&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Provisions&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Scrittura tipica:&lt;/b&gt; si rileva il &lt;span class=&quot;t&quot;&gt;closing inventory&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(rimanenze finali)&lt;/i&gt;; il &lt;span class=&quot;t&quot;&gt;cost of goods sold&lt;/span&gt; comprende solo ciò che è stato venduto.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; 30 bici invendute → inventory &lt;b&gt;9.000&lt;/b&gt;. Quei 9.000 sono stati pagati ma non sono un costo dell&#x27;anno: restano un asset e diventeranno costo quando le bici saranno vendute.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Scrittura tipica:&lt;/b&gt; dr &lt;span class=&quot;t&quot;&gt;Depreciation expense&lt;/span&gt; / cr &lt;span class=&quot;t&quot;&gt;Accumulated depreciation&lt;/span&gt;. L&#x27;&lt;i&gt;ammortamento&lt;/i&gt; ripartisce il costo di un bene durevole sugli anni in cui viene usato (per gli intangibles si parla di &lt;span class=&quot;t&quot;&gt;amortisation&lt;/span&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; equipment 24.000 su 6 anni → &lt;b&gt;4.000&lt;/b&gt; l&#x27;anno (metodo a quote costanti).&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Vita utile &lt;input type=&quot;range&quot; id=&quot;depN&quot; min=&quot;2&quot; max=&quot;12&quot; step=&quot;1&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;depNo&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;depmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Scrittura tipica:&lt;/b&gt; dr expense / cr &lt;span class=&quot;t&quot;&gt;accrued liability&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(ratei passivi / debiti maturati)&lt;/i&gt;: costi già maturati ma non ancora pagati né fatturati (simmetricamente, ricavi maturati e non ancora fatturati sono &lt;i&gt;accrued revenues&lt;/i&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; interessi su un prestito per 3 mesi → &lt;b&gt;250&lt;/b&gt;. Il costo è dell&#x27;anno anche se la banca li addebiterà dopo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Scrittura tipica:&lt;/b&gt; dr &lt;span class=&quot;t&quot;&gt;prepaid asset&lt;/span&gt; / cr expense &lt;i class=&quot;gl&quot;&gt;(risconto attivo: pagato ma non ancora consumato)&lt;/i&gt;. Il caso speculare è la &lt;span class=&quot;t&quot;&gt;deferred revenue&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(risconto passivo: incassato ma non ancora guadagnato)&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; affitto pagato per 12 mesi, 6 consumati → prepaid &lt;b&gt;3.000&lt;/b&gt;. Sposta il cursore per cambiare i mesi già consumati al 31/12:&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Mesi consumati &lt;input type=&quot;range&quot; id=&quot;rentM&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;1&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;rentMo&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;rentsvg&quot; viewBox=&quot;0 0 640 130&quot; role=&quot;img&quot; aria-label=&quot;Mesi di affitto consumati e anticipati&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;rentmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;Le slide danno 6 mesi e 3.000 di prepaid: l&#x27;affitto annuo è quindi 6.000 (500 al mese), ricavato da questi due dati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Scrittura tipica:&lt;/b&gt; dr expense / cr &lt;span class=&quot;t&quot;&gt;provision&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(fondo rischi e oneri)&lt;/i&gt; per un&#x27;uscita futura probabile; &lt;span class=&quot;t&quot;&gt;write-downs&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(svalutazioni)&lt;/i&gt;, per esempio dei crediti con i &lt;span class=&quot;t&quot;&gt;bad debts&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(crediti inesigibili)&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; non presenti nel caso, se ne parla nelle prossime lezioni.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Perché Bergamo Bikes ha 34.000 di cassa e chiude in perdita?&lt;/h3&gt;
  &lt;p&gt;È la domanda dell&#x27;esercizio 7. Senza risolverlo, ecco come ragionare: cassa e risultato si muovono per motivi diversi, e le rettifiche sono proprio il punto in cui si separano.&lt;/p&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Voce (dati della slide 18–19)&lt;/th&gt;&lt;th&gt;Effetto sulla cassa&lt;/th&gt;&lt;th&gt;Effetto sul risultato&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Finanziamenti (financing)&lt;/td&gt;&lt;td&gt;+70.000&lt;/td&gt;&lt;td&gt;nessuno: soci e banca non sono income&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Acquisto equipment&lt;/td&gt;&lt;td&gt;−24.000&lt;/td&gt;&lt;td&gt;solo −4.000 di depreciation&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;30 bici invendute&lt;/td&gt;&lt;td&gt;uscita quando vengono pagate&lt;/td&gt;&lt;td&gt;nessuno: 9.000 restano inventory&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Affitto di 12 mesi&lt;/td&gt;&lt;td&gt;pagato in anticipo per intero&lt;/td&gt;&lt;td&gt;solo i 6 mesi consumati; 3.000 prepaid&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Interessi di 3 mesi&lt;/td&gt;&lt;td&gt;nessuna uscita (non ancora pagati)&lt;/td&gt;&lt;td&gt;−250 accrued&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Si può avere molta cassa perché soci e banca l&#x27;hanno appena fornita, e allo stesso tempo una perdita perché i costi di competenza superano i ricavi. Dalla slide 19 (equity 0 + 50.000 − 1.250) si ricava una perdita di &lt;b&gt;1.250&lt;/b&gt;. Il dettaglio di ricavi e costi è nel testo dell&#x27;esercizio 7.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Affitto di 12 mesi pagato il 1° ottobre (domanda 3 della slide 20): qual è il costo dell&#x27;anno e qual è l&#x27;asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Al 31 dicembre sono consumati 3 mesi (ottobre, novembre, dicembre): &lt;b&gt;3/12&lt;/b&gt; del canone è rent expense dell&#x27;anno. I restanti &lt;b&gt;9/12&lt;/b&gt; sono un prepaid rent (risconto attivo) nel balance sheet, che diventerà costo l&#x27;anno dopo. Con un canone di 6.000: expense 1.500, prepaid 4.500. Prova col cursore impostando 3 mesi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;ammortamento riduce l&#x27;utile ma non la cassa?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Il denaro è uscito tutto il giorno dell&#x27;acquisto (flusso di investing). La depreciation ripartisce quel costo negli anni d&#x27;uso: è una scrittura senza movimento di cassa (dr Depreciation expense / cr Accumulated depreciation).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Differenza tra accrued expense e prepaid expense?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Accrued: consumato ma non ancora pagato → crea una liability. Prepaid: pagato ma non ancora consumato → crea un asset. In entrambi i casi la rettifica allinea il costo al periodo in cui la risorsa è usata.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se Bergamo Bikes registrasse come costo tutte le bici acquistate, il risultato sarebbe più alto o più basso?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Più basso di 9.000: le 30 bici invendute sarebbero trattate come consumate. Il closing inventory corregge l&#x27;errore e le tiene come asset finché non vengono vendute.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; style=&quot;--h:var(--sage);--hb:var(--sage-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;6&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;In una slide · slide 19&lt;/div&gt;&lt;h2&gt;Gli altri due prospetti&lt;/h2&gt;
  &lt;p&gt;Il bilancio completo non si ferma a balance sheet e income statement. Gli altri due prospetti spiegano come sono cambiati, durante l&#x27;anno, due blocchi del balance sheet: la cassa e l&#x27;equity.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Statement of cash flows (IAS 7)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Statement of changes in equity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;statement of cash flows&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(rendiconto finanziario)&lt;/i&gt; spiega la variazione di &lt;span class=&quot;t&quot;&gt;cash and cash equivalents&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(cassa e mezzi equivalenti)&lt;/i&gt; nel periodo, divisa in tre attività:&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;operating&lt;/b&gt;: la cassa generata (o assorbita) dalla gestione corrente;&lt;/li&gt;&lt;li&gt;&lt;b&gt;investing&lt;/b&gt;: acquisti e vendite di attività a lungo termine;&lt;/li&gt;&lt;li&gt;&lt;b&gt;financing&lt;/b&gt;: prestiti ottenuti o rimborsati, emissioni di azioni, dividendi.&lt;/li&gt;&lt;/ul&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;cfsvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Cascata dei flussi di cassa di Bergamo Bikes&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Bergamo Bikes: operating −12.000, investing −24.000, financing +70.000 → cassa +34.000 (slide 19).&lt;/figcaption&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;La gestione operativa ha &lt;em&gt;assorbito&lt;/em&gt; cassa e gli investimenti pure: i 34.000 finali esistono solo grazie ai finanziamenti. Ecco la risposta all&#x27;apparente paradosso della sezione 5.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;statement of changes in equity&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(prospetto delle variazioni del patrimonio netto)&lt;/i&gt; riconcilia l&#x27;equity di apertura con quella di chiusura: net income, &lt;span class=&quot;t&quot;&gt;other comprehensive income&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(OCI: utili e perdite rilevati direttamente nell&#x27;equity, non nel conto economico)&lt;/i&gt;, dividendi, emissioni e riacquisti di azioni, correzioni di errori.&lt;/p&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;eqbsvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Variazioni dell&#x27;equity di Bergamo Bikes&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Bergamo Bikes: 0 + 50.000 − 1.250 = 48.750 (slide 19). L&#x27;aumento di 50.000 è il capitale apportato dai soci.&lt;/figcaption&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Obbligatorio negli IFRS&lt;/b&gt;; in Italia le stesse informazioni stanno nella nota integrativa (&lt;b&gt;art. 2427 c.c.&lt;/b&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Collegamenti nel corso&lt;/b&gt; (dalla slide 19): entrambi i prospetti si approfondiscono più avanti: changes in equity con &lt;b&gt;IAS 1 il 12 ottobre&lt;/b&gt;, cash flow statement con &lt;b&gt;IAS 7 il 14 ottobre&lt;/b&gt;.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 190&quot; role=&quot;img&quot; aria-label=&quot;Come i quattro prospetti si collegano&quot;&gt;
      &lt;rect x=&quot;320&quot; y=&quot;10&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Balance sheet 31/12&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;cash 34.000 · equity 48.750&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-paper&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Cash flows&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;spiega Δ cash&lt;/text&gt;
      &lt;rect x=&quot;315&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;net loss −1.250&lt;/text&gt;
      &lt;rect x=&quot;610&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-paper&quot;/&gt;&lt;text x=&quot;725&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Changes in equity&lt;/text&gt;&lt;text x=&quot;725&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;spiega Δ equity&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M135 118V95H360V74&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M725 118V95H500V74&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M547 150H606&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Il net income entra nel changes in equity, che a sua volta spiega l&#x27;equity del balance sheet; il cash flow statement spiega la riga «cash».&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Un prestito bancario di 20.000: in quale attività del cash flow statement compare? E nell&#x27;income statement?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Financing activities (+20.000). Nell&#x27;income statement non compare: ricevere un prestito non è income, perché crea una liability. Compariranno solo gli interessi, come finance costs.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;equity di Bergamo Bikes (48.750) è molto più alta della cassa (34.000)?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Le due grandezze misurano cose diverse. L&#x27;equity è assets − liabilities, e tra gli assets ci sono anche equipment (netto 20.000), inventory (9.000) e prepaid rent (3.000). Fra le liabilities ci sono il prestito e gli interessi maturati. La cassa è solo una delle attività.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In un bilancio italiano non IFRS dove trovo le variazioni del patrimonio netto?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Nella nota integrativa, secondo l&#x27;art. 2427 c.c., non in un prospetto autonomo obbligatorio come negli IFRS.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--h:var(--accent);--hb:var(--accent-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;7&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Before you go · slide 2 e 20&lt;/div&gt;&lt;h2&gt;Compiti e tre domande&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Homework set 2 · consegna mercoledì 30&lt;/h4&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;Esercizio 5&lt;/b&gt; · The Library: journal, income statement, balance sheet&lt;/li&gt;&lt;li&gt;&lt;b&gt;Esercizio 6&lt;/b&gt; · The retail shop: l&#x27;equazione in una tabella&lt;/li&gt;&lt;li&gt;&lt;b&gt;Esercizio 7&lt;/b&gt; · Bergamo Bikes: adjustments e prospetti. Usa la tabella delle rettifiche (sezione 5); va iniziato dopo questa lezione.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Debriefing all&#x27;inizio della lezione di mercoledì.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Prossima lezione · mercoledì 30 settembre&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Dopo il debriefing del set 2: &lt;b&gt;chi scrive le regole contabili&lt;/b&gt; (UE, Italia, IASB) e i &lt;b&gt;due sistemi di contabilità&lt;/b&gt; che stanno dietro i due schemi di conto economico visti oggi (by nature / by function).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;«Could you answer in three lines?» — le domande della slide 20&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché la perdita del website business non si vede nel trial balance, anche se tutti i numeri ci sono?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Perché il trial balance elenca i saldi conto per conto, mescolando voci patrimoniali e di reddito: la perdita è distribuita su 12 conti (Sales e 11 di costo) e non esiste come numero. Solo separando income statement e balance sheet si calcola 500 − 1.160 = −660 e la si vede passare nell&#x27;equity.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Un&#x27;impresa vende un edificio a più del suo book value: revenue o gain? Dove compare?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;È un &lt;b&gt;gain&lt;/b&gt;: vendere edifici non fa parte dell&#x27;attività ordinaria. Compare nell&#x27;income statement (aumenta l&#x27;equity) per la differenza tra prezzo e book value, non per l&#x27;intero prezzo. L&#x27;edificio esce dal balance sheet. &lt;span class=&quot;muted&quot;&gt;(Nello schema civilistico, dopo il 2016, finisce tra gli altri ricavi e proventi della sezione A, essendo stata abolita la sezione E: è un&#x27;inferenza dalle slide 12 e 15, da verificare nella lezione sulle regole.)&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Affitto di dodici mesi pagato il 1° ottobre: qual è il costo dell&#x27;anno e qual è l&#x27;asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Costo: 3/12 del canone (ottobre–dicembre). Asset: 9/12 come prepaid rent, che sarà costo l&#x27;anno successivo. Vedi il cursore nella sezione 5.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;E la domanda guida: perché due prospetti, e perché rettificarli?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Due prospetti perché rispondono a domande diverse: &lt;em&gt;quanto vale oggi&lt;/em&gt; l&#x27;impresa (balance sheet, voci durevoli) e &lt;em&gt;quanto ha guadagnato nel periodo&lt;/em&gt; (income statement, voci consumate, azzerate a fine anno). Rettificarli perché il ledger registra incassi e pagamenti, mentre il profit si misura per competenza: inventory, depreciation, accruals, prepayments e provisions spostano i costi e i ricavi nel periodo giusto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--h:var(--accent);--hb:var(--accent-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne · ricerca web, ottobre 2026&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Le norme e gli standard citati nelle slide. Ogni scheda è &lt;b&gt;fonte esterna&lt;/b&gt;: le informazioni vengono dal sito indicato, non dalle slide. Le slide non citano autori o manuali specifici.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS Conceptual Framework for Financial Reporting (2018)&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Conceptual Framework&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; pubblicato dallo IASB nel marzo 2018 in sostituzione della versione 2010. Tratta obiettivo dell&#x27;informativa, caratteristiche qualitative, entità che redige il bilancio, definizioni di asset, liability, equity, income ed expenses, recognition e derecognition, measurement, presentazione e capital maintenance. Per le imprese che lo usano dove nessuno standard si applica vale dagli esercizi iniziati dal 1° gennaio 2020. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte delle definizioni delle slide 8 e 12 e il riferimento quando un principio non copre un&#x27;operazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IAS 1 · Presentation of Financial Statements&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 1&lt;/a&gt; · sintesi: &lt;a href=&quot;https://www.iasplus.com/standard/ias01.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; le basi per presentare i bilanci IFRS. Componenti minime (financial position, profit or loss e OCI, changes in equity, cash flows, note) e caratteristiche generali: fair presentation, going concern, accrual basis, materialità e aggregazione, compensazioni, informativa comparativa. &lt;b&gt;Perché conta:&lt;/b&gt; è lo standard di riferimento per le slide 9 e 19; viene sostituito da IFRS 18 dal 2027.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 18 · Presentation and Disclosure in Financial Statements&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt; · approfondimento: &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY · a closer look at IFRS 18&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; sostituisce IAS 1 per gli esercizi dal 1° gennaio 2027 (con applicazione retrospettiva). Introduce le categorie operating / investing / financing nel conto economico, i subtotali «operating profit» e «operating profit before financing and income taxes» e l&#x27;informativa sulle management-defined performance measures. Nell&#x27;UE l&#x27;applicazione dipende dall&#x27;omologazione (endorsement). &lt;b&gt;Perché conta:&lt;/b&gt; le slide 9 e 15 lo indicano come il nuovo termine di confronto con lo schema italiano.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;IAS 7 · Statement of Cash Flows&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 7&lt;/a&gt; · sintesi: &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; come presentare le variazioni di cassa e mezzi equivalenti, suddivise in operating, investing e financing. Per i flussi operativi incoraggia il metodo diretto e ammette quello indiretto. Il titolo originale era «Cash Flow Statements», cambiato nel 2007. &lt;b&gt;Perché conta:&lt;/b&gt; slide 19; è l&#x27;argomento della lezione del 14 ottobre.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Codice civile, art. 2424 · Contenuto dello stato patrimoniale&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2424 c.c.&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; lo schema obbligatorio dello stato patrimoniale, a sezioni contrapposte (Attivo e Passivo), con macroclassi indicate da lettere maiuscole. Testo sostituito dall&#x27;art. 6 del D.Lgs. 139/2015; nella prassi si integra con il principio contabile nazionale OIC 12. &lt;b&gt;Perché conta:&lt;/b&gt; è lo schema delle slide 9 e 11.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Codice civile, art. 2425 · Contenuto del conto economico&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2425 c.c.&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; lo schema obbligatorio del conto economico in forma scalare. A) valore della produzione, B) costi della produzione (materie prime, servizi, godimento beni di terzi, personale…), poi le sezioni finanziarie, fino al risultato d&#x27;esercizio. &lt;b&gt;Perché conta:&lt;/b&gt; è lo schema della slide 15.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Codice civile, art. 2427 · Contenuto della nota integrativa&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2427.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2427 c.c.&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;elenco delle informazioni minime della nota integrativa: criteri di valutazione, movimenti delle immobilizzazioni, composizione di specifiche voci, variazioni del patrimonio netto… presentate nell&#x27;ordine delle voci dei prospetti. Il n. 13 riguarda gli elementi di ricavo e costo di entità o incidenza eccezionali. &lt;b&gt;Perché conta:&lt;/b&gt; slide 15 (voci non ricorrenti dopo l&#x27;abolizione della sezione E) e 19 (variazioni dell&#x27;equity in Italia).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;D.Lgs. 18 agosto 2015, n. 139&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.gazzettaufficiale.it/eli/id/2015/09/04/15G00153/sg&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gazzetta Ufficiale n. 205 del 4/9/2015&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; attua la direttiva 2013/34/UE e modifica il codice civile e il D.Lgs. 127/1991 sul bilancio d&#x27;esercizio e consolidato. Si applica ai bilanci degli esercizi iniziati dal 1° gennaio 2016. &lt;b&gt;Perché conta:&lt;/b&gt; è la riforma che ha abolito la sezione E «straordinari» del conto economico (slide 15).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge inf&quot;&gt;Contesto&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Direttiva 2013/34/UE (Accounting Directive)&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/legal-content/IT/TXT/?uri=CELEX:32013L0034&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · CELEX 32013L0034&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la direttiva UE sui bilanci d&#x27;esercizio e consolidati. Il bilancio comprende almeno stato patrimoniale, conto economico e nota integrativa e deve dare un quadro fedele (true and fair view). Pubblicata in GU UE il 29 giugno 2013, recepimento entro il 20 luglio 2015. &lt;b&gt;Perché conta:&lt;/b&gt; non è citata nelle slide, ma è l&#x27;origine europea del D.Lgs. 139/2015 e introduce il tema «chi scrive le regole» della lezione del 30 settembre.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;script&gt;
(function(){
const $=(s,r)=&gt;(r||document).querySelector(s),$$=(s,r)=&gt;[...(r||document).querySelectorAll(s)];
const fmt=n=&gt;(n&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+Math.abs(Math.round(n)).toLocaleString(&#x27;it-IT&#x27;);

/* linguette */
$$(&#x27;[data-tabs]&#x27;).forEach(w=&gt;{
  const bs=$$(&#x27;:scope&gt;.tabbar&gt;button&#x27;,w),ps=$$(&#x27;:scope&gt;.panel&#x27;,w);
  const sel=i=&gt;bs.forEach((b,j)=&gt;{b.setAttribute(&#x27;aria-selected&#x27;,i===j);if(ps[j])ps[j].hidden=i!==j});
  bs.forEach((b,i)=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;sel(i)));sel(0);
});

/* grafico a cascata generico: items {l,a,b,c,v} */
function wf(svg,items){
  if(!svg)return;
  const W=640,top=26,bot=200,pad=20;
  const vals=items.flatMap(i=&gt;[i.a,i.b]).concat(0);
  let mx=Math.max(...vals),mn=Math.min(...vals);if(mx===mn)mx=mn+1;
  const y=v=&gt;top+(mx-v)/(mx-mn)*(bot-top),bw=(W-2*pad)/items.length;
  let s=`&lt;line class=&quot;axis&quot; x1=&quot;${pad}&quot; x2=&quot;${W-pad}&quot; y1=&quot;${y(0)}&quot; y2=&quot;${y(0)}&quot;/&gt;`;
  items.forEach((it,i)=&gt;{
    const x=pad+i*bw+bw*.17,w=bw*.66,y1=y(Math.max(it.a,it.b)),h=Math.max(1.5,Math.abs(y(it.a)-y(it.b)));
    if(i&lt;items.length-1){const nx=pad+(i+1)*bw+bw*.17;s+=`&lt;line class=&quot;conn&quot; x1=&quot;${x+w}&quot; x2=&quot;${nx}&quot; y1=&quot;${y(it.b)}&quot; y2=&quot;${y(it.b)}&quot;/&gt;`}
    s+=`&lt;rect x=&quot;${x}&quot; y=&quot;${y1}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; class=&quot;${it.c}&quot;/&gt;`;
    s+=`&lt;text class=&quot;vl&quot; x=&quot;${x+w/2}&quot; y=&quot;${y1-7}&quot;&gt;${it.v}&lt;/text&gt;`;
    const ls=it.l.split(&#x27;|&#x27;);ls.forEach((t,k)=&gt;s+=`&lt;text class=&quot;lb&quot; x=&quot;${x+w/2}&quot; y=&quot;${bot+20+k*14}&quot;&gt;${t}&lt;/text&gt;`);
  });
  svg.innerHTML=s;
}
const sg=n=&gt;(n&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+fmt(n);

/* 1 · conto a T passo-passo */
const tx=[[1,&quot;conferimento del titolare (Owner&#x27;s Equity)&quot;,1100],[2,&quot;sedia da ufficio (Office Furniture)&quot;,-700],[3,&quot;cambio olio (Repairs &amp; Maintenance)&quot;,-25],[4,&quot;incasso per pubblicità (Sales)&quot;,500],[8,&quot;pagamento a fornitori (Accounts Payable)&quot;,-500],[9,&quot;spese bancarie (Bank Charges)&quot;,-15]];
let k=0;
function drawT(){
  const T=$(&#x27;#tacc&#x27;);if(!T)return;
  const d=tx.slice(0,k),dr=d.filter(t=&gt;t[2]&gt;0),cr=d.filter(t=&gt;t[2]&lt;0);
  const sd=dr.reduce((a,t)=&gt;a+t[2],0),sc=-cr.reduce((a,t)=&gt;a+t[2],0);
  $(&#x27;#tdr&#x27;).innerHTML=dr.map(t=&gt;`&lt;li&gt;&lt;span&gt;${t[0]}&lt;/span&gt;${fmt(t[2])}&lt;/li&gt;`).join(&#x27;&#x27;);
  $(&#x27;#tcr&#x27;).innerHTML=cr.map(t=&gt;`&lt;li&gt;&lt;span&gt;${t[0]}&lt;/span&gt;${fmt(-t[2])}&lt;/li&gt;`).join(&#x27;&#x27;);
  $(&#x27;#tbal&#x27;).textContent=`dr ${fmt(sd)} − cr ${fmt(sc)} = saldo dr ${fmt(sd-sc)}`;
  const c=tx[k-1];
  $(&#x27;#tmsg&#x27;).textContent=k?`Passo ${k}/${tx.length} · rif. ${c[0]}: ${c[1]} → ${c[2]&gt;0?&#x27;debit (entra denaro)&#x27;:&#x27;credit (esce denaro)&#x27;} ${fmt(Math.abs(c[2]))}${k===tx.length?&#x27;. Saldo finale di dicembre: 360, come nella slide 5.&#x27;:&#x27;&#x27;}`:&#x27;Il conto di dicembre parte da zero: il saldo di novembre (190) si somma solo nel trial balance cumulativo.&#x27;;
  $(&#x27;#tprev&#x27;).disabled=k===0;$(&#x27;#tnext&#x27;).disabled=k===tx.length;
}
if($(&#x27;#tacc&#x27;)){$(&#x27;#tprev&#x27;).onclick=()=&gt;{k--;drawT()};$(&#x27;#tnext&#x27;).onclick=()=&gt;{k++;drawT()};$(&#x27;#treset&#x27;).onclick=()=&gt;{k=0;drawT()};drawT()}

/* 2 · equazione di bilancio */
function eq(){
  const svg=$(&#x27;#eqsvg&#x27;);if(!svg)return;
  const A=+$(&#x27;#eqA&#x27;).value,L=+$(&#x27;#eqL&#x27;).value,E=A-L;
  $(&#x27;#eqAo&#x27;).value=fmt(A);$(&#x27;#eqLo&#x27;).value=fmt(L);$(&#x27;#eqEo&#x27;).value=fmt(E);
  const s=240/4000,base=270,hA=A*s,hL=L*s,hE=Math.max(E,0)*s;
  let g=`&lt;line class=&quot;axis&quot; x1=&quot;40&quot; x2=&quot;520&quot; y1=&quot;${base}&quot; y2=&quot;${base}&quot;/&gt;`;
  g+=`&lt;rect x=&quot;80&quot; y=&quot;${base-hA}&quot; width=&quot;150&quot; height=&quot;${hA}&quot; rx=&quot;4&quot; class=&quot;f-sage&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;155&quot; y=&quot;${base-hA/2+4}&quot;&gt;Assets ${fmt(A)}&lt;/text&gt;`;
  g+=`&lt;rect x=&quot;320&quot; y=&quot;${base-hL}&quot; width=&quot;150&quot; height=&quot;${hL}&quot; rx=&quot;4&quot; class=&quot;f-brick&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hL/2+4}&quot;&gt;Liabilities ${fmt(L)}&lt;/text&gt;`;
  if(E&gt;=0){g+=`&lt;rect x=&quot;320&quot; y=&quot;${base-hL-hE}&quot; width=&quot;150&quot; height=&quot;${hE}&quot; rx=&quot;4&quot; class=&quot;f-acc&quot;/&gt;`+(hE&gt;16?`&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hL-hE/2+4}&quot;&gt;Equity ${fmt(E)}&lt;/text&gt;`:&#x27;&#x27;)}
  else{g+=`&lt;line x1=&quot;300&quot; x2=&quot;490&quot; y1=&quot;${base-hA}&quot; y2=&quot;${base-hA}&quot; stroke=&quot;var(--brick)&quot; style=&quot;stroke:var(--brick)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hA-8}&quot; style=&quot;fill:var(--brick)&quot;&gt;Equity negativa: ${fmt(E)}&lt;/text&gt;`}
  g+=`&lt;text class=&quot;lb&quot; x=&quot;155&quot; y=&quot;${base+18}&quot;&gt;che cosa possiede&lt;/text&gt;&lt;text class=&quot;lb&quot; x=&quot;395&quot; y=&quot;${base+18}&quot;&gt;chi lo ha finanziato&lt;/text&gt;`;
  svg.innerHTML=g;
  $(&#x27;#eqmsg&#x27;).textContent=E&gt;=0?`Equity = ${fmt(A)} − ${fmt(L)} = ${fmt(E)}: il valore contabile (book value) che resta ai proprietari.`:`Le liabilities superano gli assets di ${fmt(-E)}: l&#x27;equity è negativa, i creditori non sarebbero coperti dalle attività iscritte.`;
}
[&#x27;#eqA&#x27;,&#x27;#eqL&#x27;].forEach(id=&gt;{const e=$(id);if(e)e.addEventListener(&#x27;input&#x27;,eq)});eq();
$$(&#x27;[data-eq]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const[a,l]=b.dataset.eq.split(&#x27;,&#x27;);$(&#x27;#eqA&#x27;).value=a;$(&#x27;#eqL&#x27;).value=l;eq()}));

/* 3 · conto economico a cascata */
function isw(){
  const svg=$(&#x27;#issvg&#x27;);if(!svg)return;
  const R=+$(&#x27;#isR&#x27;).value,C=+$(&#x27;#isC&#x27;).value,X=+$(&#x27;#isX&#x27;).value,G=R-C,N=G-X;
  $(&#x27;#isRo&#x27;).value=fmt(R);$(&#x27;#isCo&#x27;).value=fmt(C);$(&#x27;#isXo&#x27;).value=fmt(X);
  wf(svg,[{l:&#x27;Revenue&#x27;,a:0,b:R,c:&#x27;s-sage&#x27;,v:fmt(R)},{l:&#x27;Cost of|goods sold&#x27;,a:R,b:G,c:&#x27;s-brick&#x27;,v:sg(-C)},{l:&#x27;Gross|margin&#x27;,a:0,b:G,c:&#x27;s-slate&#x27;,v:fmt(G)},{l:&#x27;Expenses&#x27;,a:G,b:N,c:&#x27;s-brick&#x27;,v:sg(-X)},{l:&#x27;Net income|(loss)&#x27;,a:0,b:N,c:N&gt;=0?&#x27;s-acc&#x27;:&#x27;s-brick&#x27;,v:fmt(N)}]);
  $(&#x27;#ismsg&#x27;).textContent=`Gross margin ${fmt(G)} (${R?Math.round(G/R*100):0}% dei ricavi) · net ${N&gt;=0?&#x27;income&#x27;:&#x27;loss&#x27;} ${fmt(N)}: è di quanto ${N&gt;=0?&#x27;aumenta&#x27;:&#x27;diminuisce&#x27;} l&#x27;equity nell&#x27;anno.`;
}
[&#x27;#isR&#x27;,&#x27;#isC&#x27;,&#x27;#isX&#x27;].forEach(id=&gt;{const e=$(id);if(e)e.addEventListener(&#x27;input&#x27;,isw)});isw();
$$(&#x27;[data-is]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const v=b.dataset.is.split(&#x27;,&#x27;);$(&#x27;#isR&#x27;).value=v[0];$(&#x27;#isC&#x27;).value=v[1];$(&#x27;#isX&#x27;).value=v[2];isw()}));

/* 4 · smistamento dei conti */
const accs=[[&quot;Checking Account&quot;,&quot;SP&quot;,&quot;asset: denaro in banca, resta finché non lo spendi&quot;],[&quot;Office Equipment&quot;,&quot;SP&quot;,&quot;asset durevole (telefono, fax, stampante)&quot;],[&quot;Computer Hardware&quot;,&quot;SP&quot;,&quot;asset durevole (parti del server)&quot;],[&quot;Office Furniture&quot;,&quot;SP&quot;,&quot;asset durevole (sedia, mobili)&quot;],[&quot;Accounts Payable&quot;,&quot;SP&quot;,&quot;liability: debito verso fornitori ancora da pagare&quot;],[&quot;Owners&#x27; Equity&quot;,&quot;SP&quot;,&quot;equity: capitale conferito dal titolare&quot;],[&quot;Sales&quot;,&quot;CE&quot;,&quot;income: ricavo del periodo&quot;],[&quot;Website Hosting&quot;,&quot;CE&quot;,&quot;expense: servizio consumato nel periodo&quot;],[&quot;Rent&quot;,&quot;CE&quot;,&quot;expense: l&#x27;affitto di novembre è già consumato&quot;],[&quot;Repairs &amp; Maintenance&quot;,&quot;CE&quot;,&quot;expense: nessun valore durevole&quot;],[&quot;Fuel&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Subscriptions&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Meals&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Phone Service&quot;,&quot;CE&quot;,&quot;expense: servizio, non apparecchio&quot;],[&quot;Electric Service&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Office Supplies&quot;,&quot;CE&quot;,&quot;expense: cancelleria consumata (trattata come costo)&quot;],[&quot;Bank Charges&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Credit Card Fees &amp; Int&quot;,&quot;CE&quot;,&quot;expense: commissioni e interessi&quot;]];
const box=$(&#x27;#sort&#x27;);let ok=0,done=0;
if(box){

/* 5 · risconto dell&#x27;affitto e ammortamento */
function rent(){
  const svg=$(&#x27;#rentsvg&#x27;);if(!svg)return;
  const m=+$(&#x27;#rentM&#x27;).value,exp=500*m,pre=6000-exp;
  $(&#x27;#rentMo&#x27;).value=m+&#x27; mesi&#x27;;
  let g=&#x27;&#x27;;
  for(let i=0;i&lt;12;i++){g+=`&lt;rect x=&quot;${20+i*50}&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;5&quot; class=&quot;${i&lt;m?&#x27;f-ochre&#x27;:&#x27;f-sage&#x27;}&quot;/&gt;&lt;text class=&quot;lb&quot; x=&quot;${43+i*50}&quot; y=&quot;58&quot;&gt;${i+1}°&lt;/text&gt;`}
  g+=`&lt;text class=&quot;lb&quot; x=&quot;20&quot; y=&quot;20&quot; style=&quot;text-anchor:start&quot;&gt;12 mesi di affitto pagati in anticipo: 6.000 (500 al mese)&lt;/text&gt;`;
  g+=`&lt;text class=&quot;vl&quot; x=&quot;${Math.max(70,20+m*25)}&quot; y=&quot;100&quot; style=&quot;fill:var(--ochre)&quot;&gt;${m?&#x27;expense &#x27;+fmt(exp):&#x27;&#x27;}&lt;/text&gt;&lt;text class=&quot;vl&quot; x=&quot;${Math.min(565,20+m*50+(12-m)*25)}&quot; y=&quot;100&quot; style=&quot;fill:var(--sage)&quot;&gt;${m&lt;12?&#x27;prepaid (asset) &#x27;+fmt(pre):&#x27;&#x27;}&lt;/text&gt;`;
  if(m&gt;0&amp;&amp;m&lt;12)g+=`&lt;line x1=&quot;${18+m*50}&quot; x2=&quot;${18+m*50}&quot; y1=&quot;22&quot; y2=&quot;84&quot; stroke=&quot;var(--accent)&quot; style=&quot;stroke:var(--accent)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text class=&quot;lb&quot; x=&quot;${18+m*50}&quot; y=&quot;120&quot; style=&quot;fill:var(--accent)&quot;&gt;31 dicembre&lt;/text&gt;`;
  svg.innerHTML=g;
  $(&#x27;#rentmsg&#x27;).textContent=`Al 31/12 sono consumati ${m} mesi: rent expense ${fmt(exp)} nel conto economico, prepaid rent ${fmt(pre)} tra gli assets. Scrittura di rettifica: dr Prepaid Rent ${fmt(pre)} / cr Rent expense ${fmt(pre)}.`;
}
const rM=$(&#x27;#rentM&#x27;);if(rM){rM.addEventListener(&#x27;input&#x27;,rent);rent()}
function dep(){
  const o=$(&#x27;#depN&#x27;);if(!o)return;const n=+o.value,a=24000/n;
  $(&#x27;#depNo&#x27;).value=n+&#x27; anni&#x27;;

}
const dN=$(&#x27;#depN&#x27;);if(dN){dN.addEventListener(&#x27;input&#x27;,dep);dep()}
