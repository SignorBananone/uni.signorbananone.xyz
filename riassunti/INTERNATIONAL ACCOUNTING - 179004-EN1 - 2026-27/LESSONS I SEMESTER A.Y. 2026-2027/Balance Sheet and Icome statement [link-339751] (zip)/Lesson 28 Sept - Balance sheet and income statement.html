&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--h:var(--slate);--hb:var(--slate-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;1&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Ripasso · slide 3–6&lt;/div&gt;&lt;h2&gt;Debriefing del homework set 1&lt;/h2&gt;
  &lt;p&gt;La lezione parte dalla correzione degli esercizi 1–4: un piccolo business di siti web registra le operazioni di novembre e dicembre. È il punto di partenza di tutto il resto: i due prospetti di oggi si costruiscono proprio con questi numeri.&lt;/p&gt;&lt;/header&gt;

  &lt;h3&gt;Il percorso dei dati: tre passi&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;

      &lt;text x=&quot;130&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;esercizi 1–2&lt;/text&gt;

      &lt;text x=&quot;430&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;esercizio 3 · un conto per voce&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M556 75H600&quot; marker-end=&quot;url(#ar2)&quot;/&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Journal entry&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Journal entry&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(scrittura in partita doppia nel libro giornale)&lt;/i&gt;: ogni operazione tocca almeno due conti, uno in &lt;span class=&quot;t&quot;&gt;debit&lt;/span&gt; e uno in &lt;span class=&quot;t&quot;&gt;credit&lt;/span&gt;, per lo stesso importo. Le slide le chiamano &lt;b&gt;Debit (use)&lt;/b&gt; e &lt;b&gt;Credit (source)&lt;/b&gt;: il credit dice &lt;em&gt;da dove&lt;/em&gt; vengono le risorse, il debit &lt;em&gt;dove&lt;/em&gt; sono finite.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;T-account&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;T-account&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(conto a T, il «mastrino»)&lt;/i&gt;: per ogni conto si riportano a sinistra i debit e a destra i credit; il &lt;span class=&quot;t&quot;&gt;balance&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(saldo)&lt;/i&gt; è la differenza e sta dalla parte maggiore (dr o cr).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trial balance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Trial balance&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(bilancio di verifica)&lt;/i&gt;: la lista dei saldi di tutti i conti. Se la partita doppia è rispettata, il totale dei debit è uguale a quello dei credit. Non è ancora un bilancio: mescola voci patrimoniali e di reddito.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Prova tu: il conto Checking Account di dicembre&lt;/h3&gt;
  &lt;p&gt;Scorri le operazioni di dicembre che toccano il conto corrente (numerazione del T-account nella slide 5). Le entrate di denaro vanno in debit, le uscite in credit.&lt;/p&gt;

  &lt;/div&gt;

  &lt;h3&gt;Le soluzioni degli esercizi&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;Esercizio 1 · journal di novembre (slide 3)&lt;/summary&gt;&lt;div class=&quot;in scroll&quot;&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Rif.&lt;/th&gt;&lt;th&gt;Debit (use)&lt;/th&gt;&lt;th&gt;Credit (source)&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Importo&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td&gt;Owner&#x27;s Equity&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Office Equipment (phone/fax)&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Office Equipment (printer)&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;150&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Computer Hardware (server parts)&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Bank Charges&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;10&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Totali&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.810 = 2.810&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;small&quot;&gt;Checking Account a fine novembre: 1.500 − 1.310 = &lt;b&gt;190&lt;/b&gt; (saldo dare).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Esercizio 2 · journal di dicembre (slide 4)&lt;/summary&gt;&lt;div class=&quot;in scroll&quot;&gt;
    &lt;table&gt;&lt;tr&gt;&lt;th&gt;Rif.&lt;/th&gt;&lt;th&gt;Debit (use)&lt;/th&gt;&lt;th&gt;Credit (source)&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Importo&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td&gt;Owner&#x27;s Equity&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.100&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;Office Furniture (chair)&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;700&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;Repairs &amp;amp; Maintenance (oil change)&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;25&lt;/td&gt;&lt;/tr&gt;

    &lt;tr&gt;&lt;td&gt;14&lt;/td&gt;&lt;td&gt;Credit Card Fees &amp;amp; Interest 30 · Office Furniture 245 · Fuel 25 · Subscriptions 65 · Meals 45 · Website Hosting 120 · Computer Hardware 400&lt;/td&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;930&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;Bank Charges&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;15&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Totali&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;4.020 = 4.020&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Accounts Payable&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(debiti verso fornitori)&lt;/i&gt;: le spese con la carta di credito o le bollette non ancora pagate non toccano subito la banca, ma creano un debito. Il rif. 15 è il pagamento parziale di quel debito: nessun costo, solo un debito che si riduce.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Attenzione: nella slide 5 i T-accounts di dicembre usano la numerazione 1–9 invece di 8–16 (es. il conferimento è «1», il pagamento a fornitori «8»). Le cifre coincidono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Esercizi 3–4 · T-accounts e trial balance (slide 5–6)&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;
    &lt;p class=&quot;small&quot;&gt;Nei T-accounts di dicembre i saldi principali sono: Checking Account dr 360 (1.600 − 1.240), Office Furniture dr 945, Computer Hardware dr 400, Accounts Payable cr 680 (1.180 − 500), Owner&#x27;s Equity cr 1.100, Sales cr 500.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;La slide 6 mostra due versioni del trial balance al 31 dicembre:&lt;/p&gt;
    &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;Cumulative&lt;/b&gt;: saldi di novembre + dicembre in due colonne, debits e credits; totali &lt;b&gt;3.780 = 3.780&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Comparative&lt;/b&gt;: una colonna per mese con i credit scritti col segno meno. La somma di ogni colonna fa &lt;b&gt;0&lt;/b&gt;: è un altro modo di verificare che debit = credit. Ad es. Checking Account 190 + 360 = 550; Owners&#x27; Equity −1.500 − 1.100 = −2.600.&lt;/li&gt;&lt;/ul&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Debits&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Credits&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;550&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;225&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;900&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Furniture&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;945&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;680&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Owners&#x27; Equity&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Website Hosting&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Repairs &amp;amp; Maintenance&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fuel&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Subscriptions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;65&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Meals&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;45&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Phone Service&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;150&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Electric Service&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;100&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;75&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bank Charges&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Credit Card Fees &amp;amp; Int&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totals&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3.780&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3.780&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché il pagamento di 500 ai fornitori (rif. 15) non è un costo?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Perché il costo è già stato registrato quando è nato il debito (rif. 12–14: dr spesa / cr Accounts Payable). Pagare significa solo scambiare un asset (banca) con l&#x27;estinzione di una liability: dr Accounts Payable / cr Checking Account. L&#x27;equity non cambia.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il trial balance quadra (3.780 = 3.780). Vuol dire che i conti sono giusti?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No: dice solo che ogni scrittura ha dare = avere. Una scrittura nel conto sbagliato, un&#x27;operazione dimenticata o un costo non ancora di competenza non fanno «saltare» la quadratura. È proprio per questo che servono le rettifiche di fine anno (sezione 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nel comparative trial balance, perché ogni colonna somma a zero?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Perché i saldi in credit sono scritti col segno meno: se debit = credit, la somma algebrica è zero. È la stessa verifica del cumulative, in un&#x27;altra forma.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--h:var(--sage);--hb:var(--sage-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;2&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Stato patrimoniale · slide 7–11&lt;/div&gt;&lt;h2&gt;The balance sheet&lt;/h2&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;balance sheet&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(stato patrimoniale; negli IFRS «statement of financial position»)&lt;/i&gt; è come la X sulla mappa con scritto «&lt;b&gt;you are here&lt;/b&gt;»: dice che cosa l&#x27;impresa possiede, che cosa deve e quanto vale per i libri contabili (&lt;span class=&quot;t&quot;&gt;book value&lt;/span&gt;, &lt;i class=&quot;gl&quot;&gt;valore contabile&lt;/i&gt;) in un preciso giorno.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Voci con valore durevole&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le voci del balance sheet hanno &lt;b&gt;lasting value&lt;/b&gt; &lt;i&gt;(valore che dura nel tempo)&lt;/i&gt;: restano in bilancio finché non vengono cedute o consumate, e si trasferiscono da un anno all&#x27;altro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Voci senza valore durevole&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Tutto ciò che si consuma nel periodo (affitto del mese, bollette, carburante) va nell&#x27;&lt;b&gt;income statement&lt;/b&gt;. È la prima regola pratica per smistare i conti del trial balance.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le tre definizioni (IFRS Conceptual Framework, 2018)&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;Conceptual Framework&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(il «quadro concettuale» dello IASB, che fissa le definizioni di base usate in tutti i principi)&lt;/i&gt; definisce così i tre elementi:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Asset&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Liability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Equity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;«A present economic resource controlled by the entity as a result of past events.»&lt;/b&gt; Un&#x27;&lt;span class=&quot;t&quot;&gt;economic resource&lt;/span&gt; è «a right that has the potential to produce economic benefits».&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;present&lt;/b&gt;: esiste già oggi, alla data di bilancio;&lt;/li&gt;&lt;li&gt;&lt;b&gt;controlled&lt;/b&gt;: conta il controllo, non la proprietà legale (si pensi a un bene in leasing);&lt;/li&gt;&lt;li&gt;&lt;b&gt;past events&lt;/b&gt;: nasce da qualcosa già successo (un acquisto, un contratto);&lt;/li&gt;&lt;li&gt;&lt;b&gt;potential&lt;/b&gt;: basta il potenziale di generare benefici, non serve che siano «attesi» con certezza.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Esempi: cash, receivables &lt;i&gt;(crediti)&lt;/i&gt;, inventory &lt;i&gt;(magazzino)&lt;/i&gt;, prepayments &lt;i&gt;(costi pagati in anticipo)&lt;/i&gt;, buildings, equipment, patents.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;«A present obligation of the entity to transfer an economic resource as a result of past events.»&lt;/b&gt;&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;L&#x27;obbligazione può essere &lt;b&gt;legally enforceable&lt;/b&gt; &lt;i&gt;(nata da contratto o legge)&lt;/i&gt; oppure &lt;b&gt;constructive&lt;/b&gt; &lt;i&gt;(implicita)&lt;/i&gt;: per esempio riparare i difetti anche dopo la scadenza della garanzia perché è la politica abituale dell&#x27;impresa.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Esempi: payables, wages and interest payable &lt;i&gt;(salari e interessi maturati da pagare)&lt;/i&gt;, loans, bonds, customer deposits, unearned revenue &lt;i&gt;(incassi per servizi non ancora resi)&lt;/i&gt;, warranty provisions &lt;i&gt;(fondi garanzia)&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;«The residual interest in the assets of the entity after deducting all its liabilities.»&lt;/b&gt; L&#x27;equity non ha una definizione autonoma: è ciò che resta.&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;Si suddivide in share capital, share premium &lt;i&gt;(sovrapprezzo azioni)&lt;/i&gt;, reserves, retained earnings &lt;i&gt;(utili non distribuiti)&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;Alcune riserve sono vincolate per legge a tutela dei creditori (in Italia la riserva legale).&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;&lt;b&gt;Book value ≠ market value&lt;/b&gt;: l&#x27;equity contabile non è il prezzo a cui si venderebbe l&#x27;impresa.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Cosa è cambiato nel 2018.&lt;/b&gt; Prima le definizioni parlavano di «expected future economic benefits». La nuova formulazione toglie la soglia di probabilità dalla &lt;em&gt;definizione&lt;/em&gt; e la sposta alla &lt;span class=&quot;t&quot;&gt;recognition&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(la decisione se iscrivere o no la voce in bilancio)&lt;/i&gt;. Un elemento può quindi rientrare nella definizione di asset e tuttavia non essere iscritto, se l&#x27;informazione non sarebbe utile o attendibile.&lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Assets&lt;/b&gt; = &lt;b&gt;Liabilities&lt;/b&gt; + &lt;b&gt;Equity&lt;/b&gt; &amp;nbsp;⇔&amp;nbsp; Equity = Assets − Liabilities&lt;/div&gt;

  &lt;h3&gt;L&#x27;equazione con i cursori&lt;/h3&gt;
  &lt;p&gt;Sposta assets e liabilities: l&#x27;equity si adegua sempre, perché è per definizione la differenza.&lt;/p&gt;

  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Italian Civil Code (art. 2424)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Attivo ordinato per &lt;b&gt;destinazione&lt;/b&gt; (fixed vs current: il bene resta in azienda a lungo o gira nel ciclo operativo?), con le scadenze indicate dentro le voci; passivo per &lt;b&gt;fonte&lt;/b&gt; (equity, provisions, &lt;span class=&quot;t&quot;&gt;TFR&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;— trattamento di fine rapporto, l&#x27;indennità maturata dai dipendenti&lt;/i&gt;, payables). &lt;b&gt;Lo schema è obbligatorio, voce per voce.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS (IAS 1 / IFRS 18)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Un elenco di &lt;b&gt;minimum line items&lt;/b&gt; &lt;i&gt;(voci minime da esporre)&lt;/i&gt; e la distinzione current / non-current, ma &lt;b&gt;nessun formato obbligatorio&lt;/b&gt;: ogni impresa sceglie il layout. «Current» indica in sostanza ciò che si realizza o si estingue entro il ciclo operativo o i 12 mesi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

        &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;770.000&lt;/td&gt;&lt;td&gt;Total liabilities &amp;amp; equity&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;770.000&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Da notare: &lt;span class=&quot;t&quot;&gt;accumulated depreciation&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(fondo ammortamento)&lt;/i&gt; si sottrae al costo dei beni; &lt;span class=&quot;t&quot;&gt;treasury stock&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(azioni proprie riacquistate)&lt;/i&gt; riduce l&#x27;equity; &lt;span class=&quot;t&quot;&gt;goodwill&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(avviamento)&lt;/i&gt; è un intangible. Verifica: 89.000 + 36.000 + 337.000 + 305.000 + 3.000 = 770.000 = 481.000 + 289.000.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Attivo&lt;/th&gt;&lt;th&gt;Passivo&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;A)&lt;/b&gt; Crediti verso soci &lt;i class=&quot;muted&quot;&gt;(receivables from shareholders)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;A) Patrimonio netto&lt;/b&gt; &lt;i class=&quot;muted&quot;&gt;(owners&#x27; equity)&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;B) Immobilizzazioni&lt;/b&gt; &lt;i class=&quot;muted&quot;&gt;(fixed assets)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;I – Capitale · II – Riserva da sovrapprezzo&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;I – immateriali · II – materiali · III – finanziarie&lt;/td&gt;&lt;td&gt;III – Rivalutazione · IV – Legale · V – Statutarie&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;C) Attivo circolante&lt;/b&gt; &lt;i class=&quot;muted&quot;&gt;(current assets)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;VI – Riserva negativa per azioni proprie &lt;i class=&quot;muted&quot;&gt;(treasury reserve)&lt;/i&gt; · VII – Altre&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;I – Rimanenze · II – Crediti&lt;/td&gt;&lt;td&gt;VIII – Utili (perdite) portati a nuovo · IX – Utile (perdita) dell&#x27;esercizio&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;III – Attività finanziarie non immobilizzate · IV – Disponibilità liquide&lt;/td&gt;&lt;td&gt;&lt;b&gt;B)&lt;/b&gt; Fondi per rischi e oneri &lt;i class=&quot;muted&quot;&gt;(provisions)&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;D)&lt;/b&gt; Ratei e risconti &lt;i class=&quot;muted&quot;&gt;(accruals and prepayments)&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;C)&lt;/b&gt; TFR · &lt;b&gt;D)&lt;/b&gt; Debiti · &lt;b&gt;E)&lt;/b&gt; Ratei e risconti&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Le slide riportano lo schema con etichette in inglese; qui affiancate ai nomi italiani della norma. La voce IX del patrimonio netto è il punto in cui il risultato del conto economico entra nello stato patrimoniale.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa ha un brevetto sviluppato internamente, oggi senza mercato ma con potenziale. Secondo il Framework 2018 è un asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Rientra nella &lt;em&gt;definizione&lt;/em&gt; (diritto presente, controllato, frutto di eventi passati, con potenziale di benefici: non serve che siano probabili). Se iscriverlo è però una questione di &lt;em&gt;recognition&lt;/em&gt;, che dipende dall&#x27;utilità e attendibilità dell&#x27;informazione, e dalle regole dei singoli principi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;L&#x27;equity di un&#x27;impresa è 289.000. Un investitore offre 500.000 per tutte le azioni: c&#x27;è un errore?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No. L&#x27;equity è un book value, cioè una differenza tra valori contabili (spesso a costo storico). Il market value riflette le aspettative sui flussi futuri e risorse non iscritte, come il marchio interno o il capitale umano.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza di fondo tra lo schema italiano e quello IFRS?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Il c.c. impone uno schema rigido (art. 2424), ordinato per destinazione (attivo) e fonte (passivo). Gli IFRS impongono solo voci minime e la distinzione current/non-current; il layout è libero e nella prassi segue di solito l&#x27;ordine di liquidità.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Garanzia scaduta, ma l&#x27;impresa ripara sempre gratis i difetti: c&#x27;è una liability?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Sì, una &lt;b&gt;constructive obligation&lt;/b&gt;: la prassi consolidata crea nei clienti un&#x27;aspettativa legittima. Si rileva come provision (warranty provision).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--h:var(--ochre);--hb:var(--ochre-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;3&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Conto economico · slide 12–16&lt;/div&gt;&lt;h2&gt;The income statement&lt;/h2&gt;
  &lt;p&gt;L&#x27;&lt;span class=&quot;t&quot;&gt;income statement&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(conto economico; negli IFRS «statement of profit or loss»)&lt;/i&gt; misura la redditività di un &lt;b&gt;periodo&lt;/b&gt;: se il balance sheet è una foto, questo è il film. L&#x27;intestazione dice sempre di quale periodo si tratta: un anno, un trimestre, un mese.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Revenues&lt;/b&gt; + &lt;b&gt;gains&lt;/b&gt; − &lt;b&gt;expenses&lt;/b&gt; − &lt;b&gt;losses&lt;/b&gt; = &lt;b&gt;net income&lt;/b&gt; (o net loss)&lt;/div&gt;

  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Income (Framework 2018)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Aumenti di assets o diminuzioni di liabilities che &lt;b&gt;aumentano l&#x27;equity&lt;/b&gt;, esclusi i conferimenti dei proprietari.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Expenses (Framework 2018)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Diminuzioni di assets o aumenti di liabilities che &lt;b&gt;riducono l&#x27;equity&lt;/b&gt;, escluse le distribuzioni ai proprietari.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Le definizioni partono dal balance sheet: income ed expenses sono &lt;em&gt;variazioni dell&#x27;equity&lt;/em&gt; che non vengono dai soci. Per questo i 1.100 conferiti dal titolare a dicembre non sono un ricavo, mentre i 500 di pubblicità venduta lo sono.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Revenues vs gains&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Revenues&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(ricavi)&lt;/i&gt; nascono dall&#x27;attività ordinaria (vendere biciclette, siti web). &lt;span class=&quot;t&quot;&gt;Gains&lt;/span&gt; e &lt;span class=&quot;t&quot;&gt;losses&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(plusvalenze/minusvalenze, proventi e oneri occasionali)&lt;/i&gt; no: vendita di un edificio, una causa legale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conti «a tempo»&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;I conti del conto economico non hanno valore durevole: si &lt;b&gt;azzerano ogni anno&lt;/b&gt; e il risultato netto passa nell&#x27;equity (sezione 4).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Più misure di performance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Raggruppando le voci in modi diversi si ottengono subtotali diversi: &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;operating profit&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(risultato operativo)&lt;/i&gt;, &lt;span class=&quot;t&quot;&gt;profit before tax&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;net income&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il conto economico più semplice (slide 16)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Cost of goods sold&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(COGS, costo del venduto: ciò che è costato acquistare o produrre ciò che si è venduto)&lt;/i&gt; si toglie per primo; resta il &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(margine lordo)&lt;/i&gt;, che deve coprire le spese operative. Il &lt;b&gt;net income&lt;/b&gt; è l&#x27;aumento (o la diminuzione) nell&#x27;anno di ciò che il business vale.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Revenue &lt;input type=&quot;range&quot; id=&quot;isR&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;isRo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Cost of goods sold &lt;input type=&quot;range&quot; id=&quot;isC&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;isCo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Expenses &lt;input type=&quot;range&quot; id=&quot;isX&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;&lt;output id=&quot;isXo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;issvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata del conto economico&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;p class=&quot;msg&quot; id=&quot;ismsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;row&quot; style=&quot;justify-content:center&quot;&gt;&lt;button class=&quot;btn&quot; data-is=&quot;1000,600,250&quot;&gt;Esempio generico&lt;/button&gt;&lt;button class=&quot;btn&quot; data-is=&quot;500,0,1160&quot;&gt;Website business (nov–dic)&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;text-align:center&quot;&gt;I valori dell&#x27;«esempio generico» sono inventati; quelli del website business vengono dalla slide 17.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Due layout: by nature e by function&lt;/h3&gt;
  &lt;p&gt;I due schemi classici differiscono solo nel &lt;b&gt;modo di raggruppare i costi&lt;/b&gt;. &lt;span class=&quot;t&quot;&gt;By nature&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(per natura)&lt;/i&gt;: che cosa si è comprato (materie, personale, ammortamenti). &lt;span class=&quot;t&quot;&gt;By function&lt;/span&gt; o &lt;i&gt;by destination&lt;/i&gt; &lt;i class=&quot;gl&quot;&gt;(per destinazione)&lt;/i&gt;: a che cosa è servito (produzione, vendita, amministrazione). Il risultato finale è identico.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;Per vederlo, ecco la stessa impresa (numeri inventati a scopo didattico) nei due layout delle slide 13–14.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;By nature (slide 13)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;By function (slide 14)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Come si passa dall&#x27;uno all&#x27;altro&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales revenues&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other income · Changes in inventories of finished goods and WIP · Work performed by entity and capitalised&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw material and consumables used&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(400)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee benefit expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Depreciation and amortisation expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Impairment of PP&amp;amp;E · Other expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(50)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Finance costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Share of profit/loss of associates (equity method)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit before tax&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income tax expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(36)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit for the period&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;84&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Changes in inventories&lt;/span&gt;: se produco più di quanto vendo, i costi di produzione includono beni rimasti in magazzino; la variazione positiva delle rimanenze li «neutralizza». &lt;span class=&quot;t&quot;&gt;Work performed and capitalised&lt;/span&gt;: costi sostenuti per costruire internamente un bene durevole, che vengono stornati perché diventano un asset. &lt;span class=&quot;t&quot;&gt;WIP&lt;/span&gt; = work in progress &lt;i&gt;(semilavorati)&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales revenue&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of sales&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Distribution costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(120)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;General and administrative expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(130)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other operating income / expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Finance costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Share of profit of associates&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit before income tax&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income tax expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(36)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit/loss for the period&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;84&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;In entrambi gli schemi il profit si divide poi tra &lt;span class=&quot;t&quot;&gt;minority interests&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(soci di minoranza delle controllate)&lt;/i&gt; e &lt;span class=&quot;t&quot;&gt;equity holders of the parent&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(soci della capogruppo)&lt;/i&gt;: riguarda i bilanci consolidati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Costo per natura ↓ / funzione →&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Cost of sales&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Distribution&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;G&amp;amp;A&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Totale&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw materials&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee benefits&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;150&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;90&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;60&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;30&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;20&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;600&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;130&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;850&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;Per passare alla classificazione per funzione bisogna &lt;b&gt;ripartire&lt;/b&gt; ogni costo tra produzione, vendita e amministrazione: serve una contabilità analitica e qualche scelta discrezionale. Lo schema per natura invece si legge direttamente dai conti. Il totale dei costi operativi (850) e il risultato (84) non cambiano.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lo schema italiano: art. 2425 c.c. (slide 15)&lt;/h3&gt;
  &lt;p&gt;Il codice civile impone un conto economico &lt;b&gt;per natura&lt;/b&gt;, &lt;b&gt;scalare&lt;/b&gt; &lt;i&gt;(in verticale, con risultati intermedi)&lt;/i&gt; e a struttura fissa, nella versione modificata nel 2016:&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Sezioni A-D del conto economico civilistico&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;A) Valore della&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;produzione&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;ricavi, Δ rimanenze, altri&lt;/text&gt;
      &lt;text x=&quot;215&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;−&lt;/text&gt;
      &lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;B) Costi della&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;produzione&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;materie, servizi, personale…&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;=&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;A − B&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;≠ operating profit!&lt;/text&gt;
      &lt;text x=&quot;642&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;±&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;C) Proventi e oneri finanziari&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;64&quot; width=&quot;190&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;D) Rettifiche att. finanziarie&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M755 104V130H430V150&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;290&quot; y=&quot;152&quot; width=&quot;280&quot; height=&quot;44&quot; rx=&quot;22&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Risultato prima delle imposte → utile&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;140&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-paper&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;text-decoration:line-through&quot;&gt;E) Straordinari&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;abolita dal D.Lgs. 139/2015&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perché A − B non è l&#x27;operating profit&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;La differenza A − B contiene anche componenti &lt;b&gt;non operative&lt;/b&gt; e &lt;b&gt;non ricorrenti&lt;/b&gt;: dopo l&#x27;abolizione della sezione E sono finite dentro A e B secondo la loro natura. Chi analizza il bilancio deve quindi riclassificarlo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Cosa è cambiato nel 2016&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;La sezione E) «proventi e oneri straordinari» è stata abolita dal &lt;b&gt;D.Lgs. 139/2015&lt;/b&gt;: le voci non ricorrenti ora si classificano per natura e si illustrano nella nota integrativa (art. 2427 n. 13). &lt;b&gt;Libri e slide più vecchi mostrano ancora la sezione E: non esiste più.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;IFRS 18 (dal 2027).&lt;/b&gt; Le slide lo indicano come termine di confronto: il conto economico IFRS avrà le categorie &lt;b&gt;operating / investing / financing&lt;/b&gt;, un subtotale &lt;b&gt;operating profit&lt;/b&gt; obbligatorio e regole per le &lt;span class=&quot;t&quot;&gt;management-defined performance measures&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(indicatori definiti dal management, come l&#x27;adjusted EBITDA)&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt; Secondo l&#x27;IASB, IFRS 18 si applica agli esercizi che iniziano dal 1° gennaio 2027 (applicazione anticipata ammessa), &lt;b&gt;sostituisce IAS 1&lt;/b&gt; e introduce due nuovi subtotali obbligatori: «operating profit» e «operating profit before financing and income taxes»; parte dei paragrafi di IAS 1 è stata spostata in IAS 8 e IFRS 7. Per le imprese con esercizio solare va riesposto il 2026 come comparativo. Non cambia &lt;em&gt;come&lt;/em&gt; si misura il risultato, solo come si presenta. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY · Applying IFRS: a closer look at IFRS 18&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Il titolare versa altri 1.100 nell&#x27;impresa. È income?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No. Aumenta l&#x27;equity, ma la definizione di income esclude espressamente i &lt;em&gt;contributions from owners&lt;/em&gt;. È un movimento di capitale, non un risultato della gestione.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché un&#x27;impresa potrebbe preferire il layout by function?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Perché mostra subito il gross profit e il peso delle funzioni (vendita, amministrazione), utile per l&#x27;analisi dei margini. Il prezzo è la necessità di ripartire i costi, con un margine di discrezionalità. Lo schema by nature è più oggettivo e semplice da compilare.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In un manuale del 2012 trovi la voce E) «proventi straordinari». Che cosa ne pensi?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;È lo schema precedente al D.Lgs. 139/2015: dal 2016 la sezione E non esiste più. Le componenti non ricorrenti si classificano per natura in A, B, C o D e si descrivono in nota integrativa.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una differenza A − B positiva garantisce che la gestione caratteristica sia in utile?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No: A − B include anche voci non operative e non ricorrenti (per es. la plusvalenza su un immobile). Bisogna riclassificare per isolare il risultato operativo vero e proprio.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; style=&quot;--h:var(--slate);--hb:var(--slate-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;4&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Dal trial balance ai prospetti · slide 17&lt;/div&gt;&lt;h2&gt;Il website business diventa due prospetti&lt;/h2&gt;
  &lt;p&gt;Il cumulative trial balance al 31 dicembre (sezione 1) contiene già tutti i numeri. Basta smistare ogni conto: ha valore durevole, quindi va nel balance sheet, oppure è stato consumato nel periodo, quindi va nell&#x27;income statement?&lt;/p&gt;&lt;/header&gt;

  &lt;h3&gt;Gioco: dove va ogni conto?&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;p class=&quot;small&quot;&gt;Per ciascun conto del trial balance scegli il prospetto. &lt;span class=&quot;score&quot; id=&quot;sscore&quot; aria-live=&quot;polite&quot;&gt;Nessuna risposta ancora&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;sort&quot; id=&quot;sort&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;sreset&quot;&gt;Ricomincia&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il risultato (slide 17)&lt;/h3&gt;
