/* generic waterfall chart: items {l,a,b,c,v} */
function wf(svg,items){
  if(!svg)return;
  const W=640,top=26,bot=200,pad=20;
  const vals=items.flatMap(i=&gt;[i.a,i.b]).concat(0);
  let mx=Math.max(...vals),mn=Math.min(...vals);if(mx===mn)mx=mn+1;
  const y=v=&gt;top+(mx-v)/(mx-mn)*(bot-top),bw=(W-2*pad)/items.length;
  let s=`&lt;line class=&quot;axis&quot; x1=&quot;${pad}&quot; x2=&quot;${W-pad}&quot; y1=&quot;${y(0)}&quot; y2=&quot;${y(0)}&quot;/&gt;`;
  items.forEach((it,i)=&gt;{
    const x=pad+i*bw+bw*.17,w=bw*.66,y1=y(Math.max(it.a,it.b)),h=Math.max(1.5,Math.abs(y(it.a)-y(it.b)));
    if(i&lt;items.length-1){const nx=pad+(i+1)*bw+bw*.17;s+=`&lt;line class=&quot;conn&quot; x1=&quot;${x+w}&quot; x2=&quot;${nx}&quot; y1=&quot;${y(it.b)}&quot; y2=&quot;${y(it.b)}&quot;/&gt;`}
    s+=`&lt;rect x=&quot;${x}&quot; y=&quot;${y1}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; class=&quot;${it.c}&quot;/&gt;`;
    s+=`&lt;text class=&quot;vl&quot; x=&quot;${x+w/2}&quot; y=&quot;${y1-7}&quot;&gt;${it.v}&lt;/text&gt;`;
    const ls=it.l.split(&#x27;|&#x27;);ls.forEach((t,k)=&gt;s+=`&lt;text class=&quot;lb&quot; x=&quot;${x+w/2}&quot; y=&quot;${bot+20+k*14}&quot;&gt;${t}&lt;/text&gt;`);
  });
  svg.innerHTML=s;
}
const sg=n=&gt;(n&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+fmt(n);

/* 1 · step-by-step T-account */
const tx=[[1,&quot;owner&#x27;s contribution (Owner&#x27;s Equity)&quot;,1100],[2,&quot;office chair (Office Furniture)&quot;,-700],[3,&quot;oil change (Repairs &amp; Maintenance)&quot;,-25],[4,&quot;cash received for advertising (Sales)&quot;,500],[8,&quot;payment to suppliers (Accounts Payable)&quot;,-500],[9,&quot;bank charges (Bank Charges)&quot;,-15]];
let k=0;
function drawT(){
  const T=$(&#x27;#tacc&#x27;);if(!T)return;
  const d=tx.slice(0,k),dr=d.filter(t=&gt;t[2]&gt;0),cr=d.filter(t=&gt;t[2]&lt;0);
  const sd=dr.reduce((a,t)=&gt;a+t[2],0),sc=-cr.reduce((a,t)=&gt;a+t[2],0);
  $(&#x27;#tdr&#x27;).innerHTML=dr.map(t=&gt;`&lt;li&gt;&lt;span&gt;${t[0]}&lt;/span&gt;${fmt(t[2])}&lt;/li&gt;`).join(&#x27;&#x27;);
  $(&#x27;#tcr&#x27;).innerHTML=cr.map(t=&gt;`&lt;li&gt;&lt;span&gt;${t[0]}&lt;/span&gt;${fmt(-t[2])}&lt;/li&gt;`).join(&#x27;&#x27;);
  $(&#x27;#tbal&#x27;).textContent=`dr ${fmt(sd)} − cr ${fmt(sc)} = debit balance ${fmt(sd-sc)}`;
  const c=tx[k-1];
  $(&#x27;#tmsg&#x27;).textContent=k?`Step ${k}/${tx.length} · ref. ${c[0]}: ${c[1]} → ${c[2]&gt;0?&#x27;debit (cash in)&#x27;:&#x27;credit (cash out)&#x27;} ${fmt(Math.abs(c[2]))}${k===tx.length?&#x27;. Closing December balance: 360, as on slide 5.&#x27;:&#x27;&#x27;}`:&#x27;The December account starts from zero: the November balance (190) is added only in the cumulative trial balance.&#x27;;
  $(&#x27;#tprev&#x27;).disabled=k===0;$(&#x27;#tnext&#x27;).disabled=k===tx.length;
}
if($(&#x27;#tacc&#x27;)){$(&#x27;#tprev&#x27;).onclick=()=&gt;{k--;drawT()};$(&#x27;#tnext&#x27;).onclick=()=&gt;{k++;drawT()};$(&#x27;#treset&#x27;).onclick=()=&gt;{k=0;drawT()};drawT()}

/* 2 · accounting equation */
function eq(){
  const svg=$(&#x27;#eqsvg&#x27;);if(!svg)return;
  const A=+$(&#x27;#eqA&#x27;).value,L=+$(&#x27;#eqL&#x27;).value,E=A-L;
  $(&#x27;#eqAo&#x27;).value=fmt(A);$(&#x27;#eqLo&#x27;).value=fmt(L);$(&#x27;#eqEo&#x27;).value=fmt(E);
  const s=240/4000,base=270,hA=A*s,hL=L*s,hE=Math.max(E,0)*s;
  let g=`&lt;line class=&quot;axis&quot; x1=&quot;40&quot; x2=&quot;520&quot; y1=&quot;${base}&quot; y2=&quot;${base}&quot;/&gt;`;
  g+=`&lt;rect x=&quot;80&quot; y=&quot;${base-hA}&quot; width=&quot;150&quot; height=&quot;${hA}&quot; rx=&quot;4&quot; class=&quot;f-sage&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;155&quot; y=&quot;${base-hA/2+4}&quot;&gt;Assets ${fmt(A)}&lt;/text&gt;`;
  g+=`&lt;rect x=&quot;320&quot; y=&quot;${base-hL}&quot; width=&quot;150&quot; height=&quot;${hL}&quot; rx=&quot;4&quot; class=&quot;f-brick&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hL/2+4}&quot;&gt;Liabilities ${fmt(L)}&lt;/text&gt;`;
  if(E&gt;=0){g+=`&lt;rect x=&quot;320&quot; y=&quot;${base-hL-hE}&quot; width=&quot;150&quot; height=&quot;${hE}&quot; rx=&quot;4&quot; class=&quot;f-acc&quot;/&gt;`+(hE&gt;16?`&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hL-hE/2+4}&quot;&gt;Equity ${fmt(E)}&lt;/text&gt;`:&#x27;&#x27;)}
  else{g+=`&lt;line x1=&quot;300&quot; x2=&quot;490&quot; y1=&quot;${base-hA}&quot; y2=&quot;${base-hA}&quot; stroke=&quot;var(--brick)&quot; style=&quot;stroke:var(--brick)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text class=&quot;vl&quot; x=&quot;395&quot; y=&quot;${base-hA-8}&quot; style=&quot;fill:var(--brick)&quot;&gt;Negative equity: ${fmt(E)}&lt;/text&gt;`}
  g+=`&lt;text class=&quot;lb&quot; x=&quot;155&quot; y=&quot;${base+18}&quot;&gt;what it owns&lt;/text&gt;&lt;text class=&quot;lb&quot; x=&quot;395&quot; y=&quot;${base+18}&quot;&gt;who financed it&lt;/text&gt;`;
  svg.innerHTML=g;
  $(&#x27;#eqmsg&#x27;).textContent=E&gt;=0?`Equity = ${fmt(A)} − ${fmt(L)} = ${fmt(E)}: the book value left to the owners.`:`Liabilities exceed assets by ${fmt(-E)}: equity is negative, and creditors would not be covered by the recognised assets.`;
}
[&#x27;#eqA&#x27;,&#x27;#eqL&#x27;].forEach(id=&gt;{const e=$(id);if(e)e.addEventListener(&#x27;input&#x27;,eq)});eq();
$$(&#x27;[data-eq]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const[a,l]=b.dataset.eq.split(&#x27;,&#x27;);$(&#x27;#eqA&#x27;).value=a;$(&#x27;#eqL&#x27;).value=l;eq()}));

/* 3 · income statement waterfall */
function isw(){
  const svg=$(&#x27;#issvg&#x27;);if(!svg)return;
  const R=+$(&#x27;#isR&#x27;).value,C=+$(&#x27;#isC&#x27;).value,X=+$(&#x27;#isX&#x27;).value,G=R-C,N=G-X;
  $(&#x27;#isRo&#x27;).value=fmt(R);$(&#x27;#isCo&#x27;).value=fmt(C);$(&#x27;#isXo&#x27;).value=fmt(X);
  wf(svg,[{l:&#x27;Revenue&#x27;,a:0,b:R,c:&#x27;s-sage&#x27;,v:fmt(R)},{l:&#x27;Cost of|goods sold&#x27;,a:R,b:G,c:&#x27;s-brick&#x27;,v:sg(-C)},{l:&#x27;Gross|margin&#x27;,a:0,b:G,c:&#x27;s-slate&#x27;,v:fmt(G)},{l:&#x27;Expenses&#x27;,a:G,b:N,c:&#x27;s-brick&#x27;,v:sg(-X)},{l:&#x27;Net income|(loss)&#x27;,a:0,b:N,c:N&gt;=0?&#x27;s-acc&#x27;:&#x27;s-brick&#x27;,v:fmt(N)}]);
  $(&#x27;#ismsg&#x27;).textContent=`Gross margin ${fmt(G)} (${R?Math.round(G/R*100):0}% of revenue) · net ${N&gt;=0?&#x27;income&#x27;:&#x27;loss&#x27;} ${fmt(N)}: this is how much equity ${N&gt;=0?&#x27;increases&#x27;:&#x27;decreases&#x27;} during the year.`;
}
[&#x27;#isR&#x27;,&#x27;#isC&#x27;,&#x27;#isX&#x27;].forEach(id=&gt;{const e=$(id);if(e)e.addEventListener(&#x27;input&#x27;,isw)});isw();
$$(&#x27;[data-is]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const v=b.dataset.is.split(&#x27;,&#x27;);$(&#x27;#isR&#x27;).value=v[0];$(&#x27;#isC&#x27;).value=v[1];$(&#x27;#isX&#x27;).value=v[2];isw()}));

/* 4 · sorting the accounts */
const accs=[[&quot;Checking Account&quot;,&quot;SP&quot;,&quot;asset: cash at bank, stays until you spend it&quot;],[&quot;Office Equipment&quot;,&quot;SP&quot;,&quot;long-lived asset (phone, fax, printer)&quot;],[&quot;Computer Hardware&quot;,&quot;SP&quot;,&quot;long-lived asset (server parts)&quot;],[&quot;Office Furniture&quot;,&quot;SP&quot;,&quot;long-lived asset (chair, furniture)&quot;],[&quot;Accounts Payable&quot;,&quot;SP&quot;,&quot;liability: amount still owed to suppliers&quot;],[&quot;Owners&#x27; Equity&quot;,&quot;SP&quot;,&quot;equity: capital contributed by the owner&quot;],[&quot;Sales&quot;,&quot;CE&quot;,&quot;income: revenue of the period&quot;],[&quot;Website Hosting&quot;,&quot;CE&quot;,&quot;expense: service consumed in the period&quot;],[&quot;Rent&quot;,&quot;CE&quot;,&quot;expense: November&#x27;s rent has already been consumed&quot;],[&quot;Repairs &amp; Maintenance&quot;,&quot;CE&quot;,&quot;expense: no lasting value&quot;],[&quot;Fuel&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Subscriptions&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Meals&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Phone Service&quot;,&quot;CE&quot;,&quot;expense: a service, not a device&quot;],[&quot;Electric Service&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Office Supplies&quot;,&quot;CE&quot;,&quot;expense: stationery consumed (treated as an expense)&quot;],[&quot;Bank Charges&quot;,&quot;CE&quot;,&quot;expense&quot;],[&quot;Credit Card Fees &amp; Int&quot;,&quot;CE&quot;,&quot;expense: fees and interest&quot;]];
const box=$(&#x27;#sort&#x27;);let ok=0,done=0;
if(box){
  box.innerHTML=accs.map((a,i)=&gt;`&lt;div class=&quot;acc&quot; data-i=&quot;${i}&quot;&gt;&lt;b&gt;${a[0]}&lt;/b&gt;&lt;div class=&quot;row&quot;&gt;&lt;button data-g=&quot;SP&quot;&gt;Balance sheet&lt;/button&gt;&lt;button data-g=&quot;CE&quot;&gt;Income statement&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  box.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;button&#x27;);if(!b)return;const c=b.closest(&#x27;.acc&#x27;);if(c.dataset.d)return;const a=accs[+c.dataset.i];const r=b.dataset.g===a[1];c.dataset.d=1;c.classList.add(r?&#x27;ok&#x27;:&#x27;ko&#x27;);done++;if(r)ok++;$(&#x27;.fb&#x27;,c).textContent=(r?&#x27;Correct · &#x27;:&#x27;No: it belongs in the &#x27;+(a[1]===&#x27;SP&#x27;?&#x27;balance sheet&#x27;:&#x27;income statement&#x27;)+&#x27; · &#x27;)+a[2];$(&#x27;#sscore&#x27;).textContent=`${ok} correct out of ${done} (total ${accs.length})`});
  $(&#x27;#sreset&#x27;).onclick=()=&gt;{ok=0;done=0;$$(&#x27;.acc&#x27;,box).forEach(c=&gt;{delete c.dataset.d;c.className=&#x27;acc&#x27;;$(&#x27;.fb&#x27;,c).textContent=&#x27;&#x27;});$(&#x27;#sscore&#x27;).textContent=&#x27;No answers yet&#x27;};
}

/* 5 · prepaid rent and depreciation */
function rent(){
  const svg=$(&#x27;#rentsvg&#x27;);if(!svg)return;
  const m=+$(&#x27;#rentM&#x27;).value,exp=500*m,pre=6000-exp;
  $(&#x27;#rentMo&#x27;).value=m+&#x27; months&#x27;;
  let g=&#x27;&#x27;;
  for(let i=0;i&lt;12;i++){g+=`&lt;rect x=&quot;${20+i*50}&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;5&quot; class=&quot;${i&lt;m?&#x27;f-ochre&#x27;:&#x27;f-sage&#x27;}&quot;/&gt;&lt;text class=&quot;lb&quot; x=&quot;${43+i*50}&quot; y=&quot;58&quot;&gt;${i+1}&lt;/text&gt;`}
  g+=`&lt;text class=&quot;lb&quot; x=&quot;20&quot; y=&quot;20&quot; style=&quot;text-anchor:start&quot;&gt;12 months of rent paid in advance: 6,000 (500 a month)&lt;/text&gt;`;
  g+=`&lt;text class=&quot;vl&quot; x=&quot;${Math.max(70,20+m*25)}&quot; y=&quot;100&quot; style=&quot;fill:var(--ochre)&quot;&gt;${m?&#x27;expense &#x27;+fmt(exp):&#x27;&#x27;}&lt;/text&gt;&lt;text class=&quot;vl&quot; x=&quot;${Math.min(565,20+m*50+(12-m)*25)}&quot; y=&quot;100&quot; style=&quot;fill:var(--sage)&quot;&gt;${m&lt;12?&#x27;prepaid (asset) &#x27;+fmt(pre):&#x27;&#x27;}&lt;/text&gt;`;
  if(m&gt;0&amp;&amp;m&lt;12)g+=`&lt;line x1=&quot;${18+m*50}&quot; x2=&quot;${18+m*50}&quot; y1=&quot;22&quot; y2=&quot;84&quot; stroke=&quot;var(--accent)&quot; style=&quot;stroke:var(--accent)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text class=&quot;lb&quot; x=&quot;${18+m*50}&quot; y=&quot;120&quot; style=&quot;fill:var(--accent)&quot;&gt;31 December&lt;/text&gt;`;
  svg.innerHTML=g;
  $(&#x27;#rentmsg&#x27;).textContent=`At 31/12, ${m} months have been consumed: rent expense ${fmt(exp)} in the income statement, prepaid rent ${fmt(pre)} among the assets. Adjusting entry: dr Prepaid Rent ${fmt(pre)} / cr Rent expense ${fmt(pre)}.`;
}
const rM=$(&#x27;#rentM&#x27;);if(rM){rM.addEventListener(&#x27;input&#x27;,rent);rent()}
function dep(){
  const o=$(&#x27;#depN&#x27;);if(!o)return;const n=+o.value,a=24000/n;
  $(&#x27;#depNo&#x27;).value=n+&#x27; years&#x27;;
  $(&#x27;#depmsg&#x27;).innerHTML=`Annual depreciation expense = 24,000 / ${n} = &lt;b&gt;${fmt(a)}&lt;/b&gt;. Net book value of the equipment after the first year: 24,000 − ${fmt(a)} = &lt;b&gt;${fmt(24000-a)}&lt;/b&gt;.`;
}
const dN=$(&#x27;#depN&#x27;);if(dN){dN.addEventListener(&#x27;input&#x27;,dep);dep()}

/* 6 · Bergamo Bikes cash flow and equity */
wf($(&#x27;#cfsvg&#x27;),[{l:&#x27;Opening|cash&#x27;,a:0,b:0,c:&#x27;s-slate&#x27;,v:&#x27;0&#x27;},{l:&#x27;Operating&#x27;,a:0,b:-12000,c:&#x27;s-brick&#x27;,v:&#x27;−12,000&#x27;},{l:&#x27;Investing&#x27;,a:-12000,b:-36000,c:&#x27;s-brick&#x27;,v:&#x27;−24,000&#x27;},{l:&#x27;Financing&#x27;,a:-36000,b:34000,c:&#x27;s-sage&#x27;,v:&#x27;+70,000&#x27;},{l:&#x27;Closing|cash&#x27;,a:0,b:34000,c:&#x27;s-acc&#x27;,v:&#x27;34,000&#x27;}]);
wf($(&#x27;#eqbsvg&#x27;),[{l:&#x27;Opening|equity&#x27;,a:0,b:0,c:&#x27;s-slate&#x27;,v:&#x27;0&#x27;},{l:&#x27;Contributed|capital&#x27;,a:0,b:50000,c:&#x27;s-sage&#x27;,v:&#x27;+50,000&#x27;},{l:&#x27;Net loss&#x27;,a:50000,b:48750,c:&#x27;s-brick&#x27;,v:&#x27;−1,250&#x27;},{l:&#x27;Closing|equity&#x27;,a:0,b:48750,c:&#x27;s-acc&#x27;,v:&#x27;48,750&#x27;}]);
})();
&lt;/script&gt;
