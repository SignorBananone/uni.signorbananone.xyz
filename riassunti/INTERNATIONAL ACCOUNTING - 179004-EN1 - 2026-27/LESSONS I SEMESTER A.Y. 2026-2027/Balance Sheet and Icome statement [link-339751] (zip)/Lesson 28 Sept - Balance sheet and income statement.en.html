&lt;section class=&quot;part&quot; id=&quot;s1&quot; style=&quot;--h:var(--slate);--hb:var(--slate-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;1&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Review · slides 3–6&lt;/div&gt;&lt;h2&gt;Debriefing of homework set 1&lt;/h2&gt;
  &lt;p&gt;The lecture opens with the solutions to exercises 1–4: a small website business records its November and December transactions. This is the starting point for everything else: today&#x27;s two statements are built from exactly these figures.&lt;/p&gt;&lt;/header&gt;

  &lt;h3&gt;The path of the data: three steps&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;

      &lt;text x=&quot;130&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;dr Rent 500 / cr Checking 500&lt;/text&gt;
      &lt;text x=&quot;130&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;exercises 1–2&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M256 75H300&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;310&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;110&quot; rx=&quot;10&quot; class=&quot;f-slate&quot;/&gt;
      &lt;text x=&quot;430&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;font-size:16px&quot;&gt;T-accounts (ledger)&lt;/text&gt;
      &lt;line x1=&quot;370&quot; x2=&quot;490&quot; y1=&quot;70&quot; y2=&quot;70&quot; style=&quot;stroke:var(--ink)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;430&quot; x2=&quot;430&quot; y1=&quot;70&quot; y2=&quot;104&quot; style=&quot;stroke:var(--ink)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;debit&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;credit&lt;/text&gt;
      &lt;text x=&quot;430&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;exercise 3 · one account per item&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M556 75H600&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;610&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;110&quot; rx=&quot;10&quot; class=&quot;f-slate&quot;/&gt;
      &lt;text x=&quot;730&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;font-size:16px&quot;&gt;Trial balance&lt;/text&gt;

    &lt;figcaption&gt;Summary diagram of exercises 1–4 (slides 3–6).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Journal entry&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Journal entry&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(a double-entry record in the general journal)&lt;/i&gt;: every transaction affects at least two accounts, one on the &lt;span class=&quot;t&quot;&gt;debit&lt;/span&gt; side and one on the &lt;span class=&quot;t&quot;&gt;credit&lt;/span&gt; side, for the same amount. The slides label them &lt;b&gt;Debit (use)&lt;/b&gt; and &lt;b&gt;Credit (source)&lt;/b&gt;: the credit shows &lt;em&gt;where&lt;/em&gt; resources come from, the debit &lt;em&gt;where&lt;/em&gt; they have gone.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;T-account&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;T-account&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(the ledger account in T form)&lt;/i&gt;: for each account, debits are posted on the left and credits on the right; the &lt;span class=&quot;t&quot;&gt;balance&lt;/span&gt; is the difference and sits on the larger side (dr or cr).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trial balance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Trial balance&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(list of balances used to check the ledger)&lt;/i&gt;: the list of the balances of all accounts. If double entry has been respected, total debits equal total credits. It is not yet a set of financial statements: it mixes balance sheet and income items.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Try it yourself: the December Checking Account&lt;/h3&gt;

    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Accounts Payable&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(amounts owed to suppliers)&lt;/i&gt;: credit card purchases and unpaid utility bills do not hit the bank immediately; they create a liability. Ref. 15 is the partial settlement of that liability: no expense, only a liability that decreases.&lt;/p&gt;

    &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totals&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3,780&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3,780&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the 500 payment to suppliers (ref. 15) not an expense?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Because the expense was already recognised when the liability arose (refs. 12–14: dr expense / cr Accounts Payable). Paying merely exchanges an asset (cash at bank) for the settlement of a liability: dr Accounts Payable / cr Checking Account. Equity does not change.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The trial balance balances (3,780 = 3,780). Does that mean the accounts are correct?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No: it only shows that every entry has debits = credits. An entry posted to the wrong account, a forgotten transaction or an expense that does not yet belong to the period do not “break” the balance. This is precisely why year-end adjustments are needed (section 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the comparative trial balance, why does each column sum to zero?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Because credit balances are shown as negative amounts: if debits = credits, the algebraic sum is zero. It is the same check as the cumulative version, in a different form.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;section class=&quot;part&quot; id=&quot;s2&quot; style=&quot;--h:var(--sage);--hb:var(--sage-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;2&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Statement of financial position · slides 7–11&lt;/div&gt;&lt;h2&gt;The balance sheet&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;balance sheet&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(under IFRS, the “statement of financial position”)&lt;/i&gt; is like the X on a map marked “&lt;b&gt;you are here&lt;/b&gt;”: it shows what the business owns, what it owes and what it is worth according to the books (&lt;span class=&quot;t&quot;&gt;book value&lt;/span&gt;, &lt;i class=&quot;gl&quot;&gt;carrying amount&lt;/i&gt;) on a specific date.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Items with lasting value&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Balance sheet items have &lt;b&gt;lasting value&lt;/b&gt;: they remain in the accounts until they are disposed of or used up, and they are carried forward from one year to the next.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Items without lasting value&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Everything consumed within the period (the month&#x27;s rent, utility bills, fuel) goes to the &lt;b&gt;income statement&lt;/b&gt;. This is the first practical rule for sorting the accounts in the trial balance.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three definitions (IFRS Conceptual Framework, 2018)&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;Conceptual Framework&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(the IASB framework that sets out the basic definitions used across all standards)&lt;/i&gt; defines the three elements as follows:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Asset&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Liability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Equity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;“A present economic resource controlled by the entity as a result of past events.”&lt;/b&gt; An &lt;span class=&quot;t&quot;&gt;economic resource&lt;/span&gt; is “a right that has the potential to produce economic benefits”.&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;present&lt;/b&gt;: it already exists today, at the reporting date;&lt;/li&gt;&lt;li&gt;&lt;b&gt;controlled&lt;/b&gt;: what matters is control, not legal ownership (think of a leased asset);&lt;/li&gt;&lt;li&gt;&lt;b&gt;past events&lt;/b&gt;: it arises from something that has already happened (a purchase, a contract);&lt;/li&gt;&lt;li&gt;&lt;b&gt;potential&lt;/b&gt;: the potential to generate benefits is enough; they need not be “expected” with certainty.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Examples: cash, receivables, inventory, prepayments &lt;i&gt;(expenses paid in advance)&lt;/i&gt;, buildings, equipment, patents.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;“A present obligation of the entity to transfer an economic resource as a result of past events.”&lt;/b&gt;&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;The obligation may be &lt;b&gt;legally enforceable&lt;/b&gt; &lt;i&gt;(arising from a contract or legislation)&lt;/i&gt; or &lt;b&gt;constructive&lt;/b&gt; &lt;i&gt;(implied)&lt;/i&gt;: for example, repairing defects even after the warranty has expired because that is the entity&#x27;s established practice.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Examples: payables, wages and interest payable &lt;i&gt;(accrued wages and interest not yet paid)&lt;/i&gt;, loans, bonds, customer deposits, unearned revenue &lt;i&gt;(cash received for services not yet rendered)&lt;/i&gt;, warranty provisions.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;“The residual interest in the assets of the entity after deducting all its liabilities.”&lt;/b&gt; Equity has no independent definition: it is what is left over.&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;It is broken down into share capital, share premium, reserves and retained earnings.&lt;/li&gt;&lt;li&gt;Some reserves are restricted by law to protect creditors (in Italy, the legal reserve).&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;&lt;b&gt;Book value ≠ market value&lt;/b&gt;: accounting equity is not the price at which the business would sell.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;What changed in 2018.&lt;/b&gt; The earlier definitions referred to “expected future economic benefits”. The new wording removes the probability threshold from the &lt;em&gt;definition&lt;/em&gt; and moves it to &lt;span class=&quot;t&quot;&gt;recognition&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(the decision whether or not to include the item in the financial statements)&lt;/i&gt;. An item may therefore meet the definition of an asset and yet not be recognised, if the information would not be relevant or reliable.&lt;/div&gt;

  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Assets&lt;/b&gt; = &lt;b&gt;Liabilities&lt;/b&gt; + &lt;b&gt;Equity&lt;/b&gt; &amp;nbsp;⇔&amp;nbsp; Equity = Assets − Liabilities&lt;/div&gt;

  &lt;h3&gt;The equation with sliders&lt;/h3&gt;
  &lt;p&gt;Move assets and liabilities: equity always adjusts, because by definition it is the difference.&lt;/p&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Italian Civil Code (art. 2424)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Assets ordered by &lt;b&gt;destination&lt;/b&gt; (fixed vs current: does the item stay in the business for a long time or circulate within the operating cycle?), with maturities shown within the items; liabilities and equity ordered by &lt;b&gt;source&lt;/b&gt; (equity, provisions, &lt;span class=&quot;t&quot;&gt;TFR&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;— trattamento di fine rapporto, the severance pay accrued by employees&lt;/i&gt;, payables). &lt;b&gt;The format is mandatory, line by line.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS (IAS 1 / IFRS 18)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;A list of &lt;b&gt;minimum line items&lt;/b&gt; and the current / non-current distinction, but &lt;b&gt;no mandatory format&lt;/b&gt;: each entity chooses its own layout. “Current” essentially means what is realised or settled within the operating cycle or within 12 months.&lt;/p&gt;&lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;A business has an internally developed patent, currently with no market but with potential. Under the 2018 Framework, is it an asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;It meets the &lt;em&gt;definition&lt;/em&gt; (a present right, controlled, arising from past events, with the potential to produce benefits: they need not be probable). Whether to include it in the accounts, however, is a matter of &lt;em&gt;recognition&lt;/em&gt;, which depends on the relevance and reliability of the information and on the rules of the individual standards.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A business&#x27;s equity is 289,000. An investor offers 500,000 for all the shares: is there a mistake?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No. Equity is a book value, i.e. a difference between carrying amounts (often at historical cost). Market value reflects expectations about future cash flows and unrecognised resources, such as internally generated brands or human capital.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the fundamental difference between the Italian format and the IFRS one?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;The Civil Code imposes a rigid format (art. 2424), ordered by destination (assets) and by source (liabilities and equity). IFRS require only minimum line items and the current/non-current distinction; the layout is free and in practice usually follows the order of liquidity.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The warranty has expired, but the business always repairs defects free of charge: is there a liability?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Yes, a &lt;b&gt;constructive obligation&lt;/b&gt;: established practice creates a valid expectation among customers. It is recognised as a provision (warranty provision).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s3&quot; style=&quot;--h:var(--ochre);--hb:var(--ochre-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;3&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Statement of profit or loss · slides 12–16&lt;/div&gt;&lt;h2&gt;The income statement&lt;/h2&gt;
  &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;income statement&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(under IFRS, the “statement of profit or loss”)&lt;/i&gt; measures profitability over a &lt;b&gt;period&lt;/b&gt;: if the balance sheet is a snapshot, this is the film. The heading always states the period covered: a year, a quarter, a month.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Revenues&lt;/b&gt; + &lt;b&gt;gains&lt;/b&gt; − &lt;b&gt;expenses&lt;/b&gt; − &lt;b&gt;losses&lt;/b&gt; = &lt;b&gt;net income&lt;/b&gt; (or net loss)&lt;/div&gt;

  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Income (Framework 2018)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Increases in assets or decreases in liabilities that &lt;b&gt;increase equity&lt;/b&gt;, other than contributions from owners.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Expenses (Framework 2018)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Decreases in assets or increases in liabilities that &lt;b&gt;decrease equity&lt;/b&gt;, other than distributions to owners.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The definitions start from the balance sheet: income and expenses are &lt;em&gt;changes in equity&lt;/em&gt; that do not come from the owners. This is why the 1,100 contributed by the owner in December is not revenue, whereas the 500 of advertising sold is.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Revenues vs gains&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Revenues&lt;/span&gt; arise from ordinary activities (selling bicycles, websites). &lt;span class=&quot;t&quot;&gt;Gains&lt;/span&gt; and &lt;span class=&quot;t&quot;&gt;losses&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(gains/losses on disposal, incidental income and charges)&lt;/i&gt; do not: the sale of a building, a lawsuit.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;“Temporary” accounts&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Income statement accounts have no lasting value: they are &lt;b&gt;reset to zero every year&lt;/b&gt; and the net result is transferred to equity (section 4).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Several performance measures&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Grouping the items in different ways produces different subtotals: &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;operating profit&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;profit before tax&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;net income&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The simplest income statement (slide 16)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Cost of goods sold&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(COGS: what it cost to buy or produce the goods that were sold)&lt;/i&gt; is deducted first; what remains is the &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt;, which must cover operating expenses. &lt;b&gt;Net income&lt;/b&gt; is the increase (or decrease) during the year in what the business is worth.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Revenue &lt;input type=&quot;range&quot; id=&quot;isR&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;isRo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Cost of goods sold &lt;input type=&quot;range&quot; id=&quot;isC&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;600&quot;&gt;&lt;output id=&quot;isCo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Expenses &lt;input type=&quot;range&quot; id=&quot;isX&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;250&quot;&gt;&lt;output id=&quot;isXo&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;issvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart of the income statement&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;p class=&quot;msg&quot; id=&quot;ismsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;row&quot; style=&quot;justify-content:center&quot;&gt;&lt;button class=&quot;btn&quot; data-is=&quot;1000,600,250&quot;&gt;Generic example&lt;/button&gt;&lt;button class=&quot;btn&quot; data-is=&quot;500,0,1160&quot;&gt;Website business (Nov–Dec)&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;text-align:center&quot;&gt;The figures in the “generic example” are invented; those for the website business come from slide 17.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Two layouts: by nature and by function&lt;/h3&gt;
  &lt;p&gt;The two classic formats differ only in &lt;b&gt;how expenses are grouped&lt;/b&gt;. &lt;span class=&quot;t&quot;&gt;By nature&lt;/span&gt;: what was purchased (materials, staff, depreciation). &lt;span class=&quot;t&quot;&gt;By function&lt;/span&gt; or &lt;i&gt;by destination&lt;/i&gt;: what it was used for (production, selling, administration). The bottom line is identical.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;To show this, here is the same business (figures invented for teaching purposes) in the two layouts of slides 13–14.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;By nature (slide 13)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;By function (slide 14)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;How to move from one to the other&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales revenues&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other income · Changes in inventories of finished goods and WIP · Work performed by entity and capitalised&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw material and consumables used&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(400)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee benefit expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(300)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Depreciation and amortisation expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Impairment of PP&amp;amp;E · Other expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(50)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Finance costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Share of profit/loss of associates (equity method)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit before tax&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income tax expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(36)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit for the period&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;84&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;t&quot;&gt;Changes in inventories&lt;/span&gt;: if more is produced than sold, production costs include goods still held in inventory; the positive change in inventories “neutralises” them. &lt;span class=&quot;t&quot;&gt;Work performed and capitalised&lt;/span&gt;: costs incurred to build a long-lived asset internally, which are reversed because they become an asset. &lt;span class=&quot;t&quot;&gt;WIP&lt;/span&gt; = work in progress &lt;i&gt;(partly finished goods)&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Sales revenue&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cost of sales&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(600)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Gross profit&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Distribution costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(120)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;General and administrative expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(130)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other operating income / expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Finance costs&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(30)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Share of profit of associates&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit before income tax&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income tax expense&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(36)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit/loss for the period&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;84&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;In both formats the profit is then attributed to &lt;span class=&quot;t&quot;&gt;minority interests&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(non-controlling shareholders of subsidiaries)&lt;/i&gt; and to &lt;span class=&quot;t&quot;&gt;equity holders of the parent&lt;/span&gt;: this concerns consolidated financial statements.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel scroll&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Expense by nature ↓ / function →&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Cost of sales&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Distribution&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;G&amp;amp;A&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Raw materials&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;400&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Employee benefits&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;150&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;90&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;60&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;300&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;100&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Other expenses&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;–&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;30&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;20&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;50&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;600&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;120&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;130&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;850&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;To move to the classification by function, each expense must be &lt;b&gt;allocated&lt;/b&gt; among production, selling and administration: this requires cost accounting and some discretionary choices. The by-nature format, by contrast, can be read directly from the accounts. Total operating expenses (850) and the result (84) do not change.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Italian format: art. 2425 Civil Code (slide 15)&lt;/h3&gt;
  &lt;p&gt;The Civil Code requires an income statement &lt;b&gt;by nature&lt;/b&gt;, in &lt;b&gt;vertical form&lt;/b&gt; &lt;i&gt;(with intermediate results)&lt;/i&gt; and with a fixed structure, in the version amended in 2016:&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Sections A–D of the statutory income statement&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;A) Value of&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;production&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;revenues, Δ inventories, other&lt;/text&gt;
      &lt;text x=&quot;215&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;−&lt;/text&gt;
      &lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;B) Costs of&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;production&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;materials, services, staff…&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;=&lt;/text&gt;
      &lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;8&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;A − B&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;≠ operating profit!&lt;/text&gt;
      &lt;text x=&quot;642&quot; y=&quot;66&quot; style=&quot;font-size:22px&quot;&gt;±&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;43&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;C) Financial income and charges&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;64&quot; width=&quot;190&quot; height=&quot;36&quot; rx=&quot;8&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px&quot;&gt;D) Value adj. of fin. assets&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M755 104V130H430V150&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;290&quot; y=&quot;152&quot; width=&quot;280&quot; height=&quot;44&quot; rx=&quot;22&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Profit before tax → net profit&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;140&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;8&quot; class=&quot;f-paper&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;text-decoration:line-through&quot;&gt;E) Extraordinary items&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;abolished by Leg. Decree 139/2015&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Why A − B is not operating profit&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The difference A − B also includes &lt;b&gt;non-operating&lt;/b&gt; and &lt;b&gt;non-recurring&lt;/b&gt; components: after section E was abolished, these were moved into A and B according to their nature. Anyone analysing the financial statements must therefore reclassify them.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What changed in 2016&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Section E) “extraordinary income and charges” was abolished by &lt;b&gt;Legislative Decree 139/2015&lt;/b&gt;: non-recurring items are now classified by nature and disclosed in the notes to the financial statements (art. 2427 no. 13). &lt;b&gt;Older textbooks and slides still show section E: it no longer exists.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;IFRS 18 (from 2027).&lt;/b&gt; The slides use it as a point of comparison: the IFRS income statement will have &lt;b&gt;operating / investing / financing&lt;/b&gt; categories, a mandatory &lt;b&gt;operating profit&lt;/b&gt; subtotal and rules for &lt;span class=&quot;t&quot;&gt;management-defined performance measures&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(measures defined by management, such as adjusted EBITDA)&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt; According to the IASB, IFRS 18 applies to annual reporting periods beginning on or after 1 January 2027 (earlier application permitted), &lt;b&gt;replaces IAS 1&lt;/b&gt; and introduces two new mandatory subtotals: “operating profit” and “operating profit before financing and income taxes”; some paragraphs of IAS 1 have been moved to IAS 8 and IFRS 7. Entities with a calendar year-end must restate 2026 as the comparative period. It does not change &lt;em&gt;how&lt;/em&gt; profit is measured, only how it is presented. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt;; &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY · Applying IFRS: a closer look at IFRS 18&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;The owner puts another 1,100 into the business. Is it income?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No. It increases equity, but the definition of income expressly excludes &lt;em&gt;contributions from owners&lt;/em&gt;. It is a capital transaction, not a result of operations.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why might a business prefer the by-function layout?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Because it shows gross profit straight away, along with the weight of each function (selling, administration), which is useful for margin analysis. The price is the need to allocate costs, which involves some discretion. The by-nature format is more objective and simpler to prepare.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In a 2012 textbook you find item E) “extraordinary income”. What do you make of it?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;It is the format that preceded Legislative Decree 139/2015: since 2016 section E no longer exists. Non-recurring components are classified by nature in A, B, C or D and described in the notes.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does a positive A − B difference guarantee that core operations are profitable?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;No: A − B also includes non-operating and non-recurring items (e.g. a gain on the sale of a property). The statement must be reclassified to isolate the true operating result.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s4&quot; style=&quot;--h:var(--slate);--hb:var(--slate-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;4&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;From the trial balance to the statements · slide 17&lt;/div&gt;&lt;h2&gt;The website business becomes two statements&lt;/h2&gt;
  &lt;p&gt;The cumulative trial balance at 31 December (section 1) already contains all the figures. All that is needed is to sort each account: does it have lasting value, and so belong in the balance sheet, or was it consumed during the period, and so belong in the income statement?&lt;/p&gt;&lt;/header&gt;

  &lt;h3&gt;Game: where does each account go?&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;p class=&quot;small&quot;&gt;For each account in the trial balance, choose the statement. &lt;span class=&quot;score&quot; id=&quot;sscore&quot; aria-live=&quot;polite&quot;&gt;No answers yet&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;sort&quot; id=&quot;sort&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;sreset&quot;&gt;Start over&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The result (slide 17)&lt;/h3&gt;
  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table style=&quot;--hb:var(--ochre-bg)&quot;&gt;

      &lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;

      &lt;tr&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Subscriptions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(65)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Meals&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(45)&lt;/td&gt;&lt;/tr&gt;

      &lt;tr&gt;&lt;td&gt;Repairs &amp;amp; Maint. 25 · Fuel 25 · Bank Charges 25&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(75)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(660)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table style=&quot;--hb:var(--sage-bg)&quot;&gt;
      &lt;tr&gt;&lt;th&gt;Balance sheet at 31 December&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Amount&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;550&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Office Equipment&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;225&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Computer Hardware&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Office Furniture&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;945&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Accounts Payable&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;680&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Owners&#x27; Equity (1,500 + 1,100)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,600&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(660)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total liabilities + equity&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,620&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The bridge between the two statements&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 230&quot; role=&quot;img&quot; aria-label=&quot;The income statement result flows into equity&quot;&gt;
      &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;190&quot; rx=&quot;10&quot; class=&quot;f-ochre&quot;/&gt;
      &lt;text x=&quot;145&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Income statement&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Sales 500&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Expenses (1,160)&lt;/text&gt;
      &lt;line x1=&quot;70&quot; x2=&quot;220&quot; y1=&quot;114&quot; y2=&quot;114&quot; style=&quot;stroke:var(--ink)&quot;/&gt;
      &lt;text x=&quot;145&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Net loss (660)&lt;/text&gt;
      &lt;text x=&quot;145&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;reset to zero at year-end: “closing”&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M272 132C380 132 420 170 560 170&quot; marker-end=&quot;url(#ar2)&quot; style=&quot;stroke:var(--accent);stroke-width:2.5&quot;/&gt;
      &lt;text x=&quot;415&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; class=&quot;elab&quot;&gt;the result is transferred to equity&lt;/text&gt;
      &lt;rect x=&quot;570&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;190&quot; rx=&quot;10&quot; class=&quot;f-sage&quot;/&gt;
      &lt;text x=&quot;705&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Balance sheet&lt;/text&gt;
      &lt;text x=&quot;640&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Assets 2,620&lt;/text&gt;
      &lt;text x=&quot;770&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Payables 680&lt;/text&gt;
      &lt;line x1=&quot;705&quot; x2=&quot;705&quot; y1=&quot;62&quot; y2=&quot;200&quot; style=&quot;stroke:var(--rule)&quot;/&gt;
      &lt;text x=&quot;770&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;Capital 2,600&lt;/text&gt;
      &lt;rect x=&quot;712&quot; y=&quot;152&quot; width=&quot;120&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
      &lt;text x=&quot;772&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12.5px;font-weight:600&quot;&gt;Net loss (660)&lt;/text&gt;
      &lt;text x=&quot;705&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;carried forward to the next year&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Rule&lt;/b&gt;: balance sheet accounts are carried forward; income statement accounts are &lt;b&gt;reset to zero every year&lt;/b&gt; and their net result is transferred to equity.&lt;/div&gt;
  &lt;p&gt;This is why the balance sheet balances only &lt;em&gt;after&lt;/em&gt; adding the net loss: 680 + 2,600 − 660 = 2,620. In the trial balance the loss “cannot be seen” because it is spread across 12 revenue and expense accounts; the statements bring it out as a single figure. This is also the first part of the answer to the guiding question.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why does Office Supplies (75) go to the income statement while Office Equipment (225) goes to the balance sheet?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Stationery is used up within a few weeks (no lasting value), whereas the phone, fax and printer will be used for years. In fact equipment is also consumed over time: this is recorded through depreciation, one of the year-end adjustments (section 5).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the equity of the website business at 31/12, and how can it be calculated in two ways?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;1,940. As a difference: assets 2,620 − liabilities 680. By composition: contributed capital 2,600 − loss 660.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;On 1 January, what balance will the Rent and Checking Account accounts have?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Rent starts again from zero: it is an income statement account, closed and transferred to equity. Checking Account starts from 550: it is a balance sheet account and is carried forward.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot; style=&quot;--h:var(--brick);--hb:var(--brick-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;5&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;In real businesses · slide 18&lt;/div&gt;&lt;h2&gt;Year-end adjustments&lt;/h2&gt;
  &lt;p&gt;Before the statements can be relied upon, &lt;span class=&quot;t&quot;&gt;adjusting entries&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(year-end adjusting entries)&lt;/i&gt; are required.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;formula&quot;&gt;Profit is measured on an &lt;b&gt;accrual basis&lt;/b&gt;: revenues of the period − the costs of the inputs &lt;b&gt;consumed&lt;/b&gt; to earn them&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;t&quot;&gt;Accrual basis&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(accrual accounting)&lt;/i&gt;: an expense belongs to the year in which the resource is consumed, not the year in which it is paid; revenue belongs to the year in which it is earned, not the year in which cash is received. At 31 December the ledger still records &lt;b&gt;payments and receipts&lt;/b&gt;. The adjustments turn them into &lt;b&gt;revenues and expenses of the period&lt;/b&gt;.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;Cash basis versus accrual basis&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Ledger at 31/12&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;payments and receipts (cash)&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M266 60H330&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;340&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Adjusting entries&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;5 families&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M546 60H600&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;rect x=&quot;610&quot; y=&quot;20&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Reliable statements&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;accrued revenues and expenses&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The five adjustments, with Bergamo Bikes (exercise 7)&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Inventory&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Depreciation&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Accruals&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Prepayments&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Provisions&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Typical entry:&lt;/b&gt; the &lt;span class=&quot;t&quot;&gt;closing inventory&lt;/span&gt; is recognised; &lt;span class=&quot;t&quot;&gt;cost of goods sold&lt;/span&gt; includes only what has been sold.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; 30 unsold bikes → inventory &lt;b&gt;9,000&lt;/b&gt;. That 9,000 has been paid but is not an expense of the year: it remains an asset and will become an expense when the bikes are sold.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Typical entry:&lt;/b&gt; dr &lt;span class=&quot;t&quot;&gt;Depreciation expense&lt;/span&gt; / cr &lt;span class=&quot;t&quot;&gt;Accumulated depreciation&lt;/span&gt;. &lt;i&gt;Depreciation&lt;/i&gt; spreads the cost of a long-lived asset over the years in which it is used (for intangibles the term is &lt;span class=&quot;t&quot;&gt;amortisation&lt;/span&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; equipment 24,000 over 6 years → &lt;b&gt;4,000&lt;/b&gt; a year (straight-line method).&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Useful life &lt;input type=&quot;range&quot; id=&quot;depN&quot; min=&quot;2&quot; max=&quot;12&quot; step=&quot;1&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;depNo&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;depmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Typical entry:&lt;/b&gt; dr expense / cr &lt;span class=&quot;t&quot;&gt;accrued liability&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(accrued expenses payable)&lt;/i&gt;: expenses already incurred but not yet paid or invoiced (symmetrically, revenues earned but not yet invoiced are &lt;i&gt;accrued revenues&lt;/i&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; 3 months&#x27; interest on a loan → &lt;b&gt;250&lt;/b&gt;. The expense belongs to this year even though the bank will charge it later.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Typical entry:&lt;/b&gt; dr &lt;span class=&quot;t&quot;&gt;prepaid asset&lt;/span&gt; / cr expense &lt;i class=&quot;gl&quot;&gt;(prepaid expense: paid but not yet consumed)&lt;/i&gt;. The mirror case is &lt;span class=&quot;t&quot;&gt;deferred revenue&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(cash received but not yet earned)&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; rent paid for 12 months, 6 consumed → prepaid &lt;b&gt;3,000&lt;/b&gt;. Move the slider to change the number of months already consumed at 31/12:&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Months consumed &lt;input type=&quot;range&quot; id=&quot;rentM&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;1&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;rentMo&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;rentsvg&quot; viewBox=&quot;0 0 640 130&quot; role=&quot;img&quot; aria-label=&quot;Months of rent consumed and prepaid&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;rentmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;The slides give 6 months and 3,000 of prepaid rent: the annual rent is therefore 6,000 (500 a month), derived from these two figures.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Typical entry:&lt;/b&gt; dr expense / cr &lt;span class=&quot;t&quot;&gt;provision&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(provision for risks and charges)&lt;/i&gt; for a probable future outflow; &lt;span class=&quot;t&quot;&gt;write-downs&lt;/span&gt;, for example of receivables for &lt;span class=&quot;t&quot;&gt;bad debts&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(uncollectible receivables)&lt;/i&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Bergamo Bikes:&lt;/b&gt; not present in the case; covered in later lectures.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Why does Bergamo Bikes have 34,000 in cash and still make a loss?&lt;/h3&gt;
  &lt;p&gt;This is the question in exercise 7. Without solving it, here is how to reason: cash and profit move for different reasons, and the adjustments are exactly where the two diverge.&lt;/p&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Item (data from slides 18–19)&lt;/th&gt;&lt;th&gt;Effect on cash&lt;/th&gt;&lt;th&gt;Effect on profit&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Financing&lt;/td&gt;&lt;td&gt;+70,000&lt;/td&gt;&lt;td&gt;none: owners and the bank are not income&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Purchase of equipment&lt;/td&gt;&lt;td&gt;−24,000&lt;/td&gt;&lt;td&gt;only −4,000 of depreciation&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;30 unsold bikes&lt;/td&gt;&lt;td&gt;outflow when they are paid for&lt;/td&gt;&lt;td&gt;none: 9,000 remains inventory&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;12 months&#x27; rent&lt;/td&gt;&lt;td&gt;paid in full in advance&lt;/td&gt;&lt;td&gt;only the 6 months consumed; 3,000 prepaid&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3 months&#x27; interest&lt;/td&gt;&lt;td&gt;no outflow (not yet paid)&lt;/td&gt;&lt;td&gt;−250 accrued&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;A business can hold a lot of cash because the owners and the bank have just provided it, and at the same time make a loss because accrued expenses exceed revenues. From slide 19 (equity 0 + 50,000 − 1,250) a loss of &lt;b&gt;1,250&lt;/b&gt; can be derived. The breakdown of revenues and expenses is in the text of exercise 7.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;12 months&#x27; rent paid on 1 October (question 3 on slide 20): what is the expense for the year and what is the asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;At 31 December 3 months have been consumed (October, November, December): &lt;b&gt;3/12&lt;/b&gt; of the rent is rent expense for the year. The remaining &lt;b&gt;9/12&lt;/b&gt; is prepaid rent (a prepaid expense) on the balance sheet, which will become an expense the following year. With annual rent of 6,000: expense 1,500, prepaid 4,500. Try it with the slider set to 3 months.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does depreciation reduce profit but not cash?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;The cash left the business in full on the day of purchase (an investing cash flow). Depreciation spreads that cost over the years of use: it is a non-cash entry (dr Depreciation expense / cr Accumulated depreciation).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between an accrued expense and a prepaid expense?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Accrued: consumed but not yet paid → creates a liability. Prepaid: paid but not yet consumed → creates an asset. In both cases the adjustment matches the expense to the period in which the resource is used.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If Bergamo Bikes expensed all the bikes it purchased, would profit be higher or lower?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Lower by 9,000: the 30 unsold bikes would be treated as consumed. The closing inventory corrects the error and keeps them as an asset until they are sold.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s6&quot; style=&quot;--h:var(--sage);--hb:var(--sage-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;6&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;In one slide · slide 19&lt;/div&gt;&lt;h2&gt;The other two statements&lt;/h2&gt;
  &lt;p&gt;A complete set of financial statements does not stop at the balance sheet and the income statement. The other two statements explain how two blocks of the balance sheet changed during the year: cash and equity.&lt;/p&gt;&lt;/header&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tabbar&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Statement of cash flows (IAS 7)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Statement of changes in equity&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;statement of cash flows&lt;/span&gt; explains the change in &lt;span class=&quot;t&quot;&gt;cash and cash equivalents&lt;/span&gt; during the period, broken down into three activities:&lt;/p&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;operating&lt;/b&gt;: cash generated (or absorbed) by day-to-day operations;&lt;/li&gt;&lt;li&gt;&lt;b&gt;investing&lt;/b&gt;: purchases and sales of long-term assets;&lt;/li&gt;&lt;li&gt;&lt;b&gt;financing&lt;/b&gt;: loans obtained or repaid, share issues, dividends.&lt;/li&gt;&lt;/ul&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;cfsvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Waterfall of Bergamo Bikes&#x27; cash flows&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Bergamo Bikes: operating −12,000, investing −24,000, financing +70,000 → cash +34,000 (slide 19).&lt;/figcaption&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Operations &lt;em&gt;absorbed&lt;/em&gt; cash and so did investments: the closing 34,000 exists only thanks to financing. This resolves the apparent paradox of section 5.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;The &lt;span class=&quot;t&quot;&gt;statement of changes in equity&lt;/span&gt; reconciles opening and closing equity: net income, &lt;span class=&quot;t&quot;&gt;other comprehensive income&lt;/span&gt; &lt;i class=&quot;gl&quot;&gt;(OCI: gains and losses recognised directly in equity, not in profit or loss)&lt;/i&gt;, dividends, share issues and buy-backs, corrections of errors.&lt;/p&gt;
      &lt;div class=&quot;fig&quot;&gt;&lt;svg id=&quot;eqbsvg&quot; viewBox=&quot;0 0 640 245&quot; role=&quot;img&quot; aria-label=&quot;Changes in Bergamo Bikes&#x27; equity&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Bergamo Bikes: 0 + 50,000 − 1,250 = 48,750 (slide 19). The 50,000 increase is the capital contributed by the owners.&lt;/figcaption&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Mandatory under IFRS&lt;/b&gt;; in Italy the same information is given in the notes to the financial statements (&lt;b&gt;art. 2427 Civil Code&lt;/b&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Links within the course&lt;/b&gt; (from slide 19): both statements are covered in more depth later: changes in equity with &lt;b&gt;IAS 1 on 12 October&lt;/b&gt;, the cash flow statement with &lt;b&gt;IAS 7 on 14 October&lt;/b&gt;.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 860 190&quot; role=&quot;img&quot; aria-label=&quot;How the four statements are linked&quot;&gt;
      &lt;rect x=&quot;320&quot; y=&quot;10&quot; width=&quot;220&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Balance sheet 31/12&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;cash 34,000 · equity 48,750&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-paper&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Cash flows&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;explains Δ cash&lt;/text&gt;
      &lt;rect x=&quot;315&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;net loss −1,250&lt;/text&gt;
      &lt;rect x=&quot;610&quot; y=&quot;120&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-paper&quot;/&gt;&lt;text x=&quot;725&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Changes in equity&lt;/text&gt;&lt;text x=&quot;725&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; class=&quot;lb&quot;&gt;explains Δ equity&lt;/text&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M135 118V95H360V74&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M725 118V95H500V74&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
      &lt;path class=&quot;edge&quot; d=&quot;M547 150H606&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Net income flows into the statement of changes in equity, which in turn explains equity in the balance sheet; the cash flow statement explains the “cash” line.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;A bank loan of 20,000: in which activity of the cash flow statement does it appear? And in the income statement?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Financing activities (+20,000). It does not appear in the income statement: receiving a loan is not income, because it creates a liability. Only the interest will appear, as finance costs.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is Bergamo Bikes&#x27; equity (48,750) much higher than its cash (34,000)?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;The two measure different things. Equity is assets − liabilities, and the assets also include equipment (net 20,000), inventory (9,000) and prepaid rent (3,000). The liabilities include the loan and accrued interest. Cash is just one of the assets.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In Italian non-IFRS financial statements, where do I find the changes in equity?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;In the notes to the financial statements, under art. 2427 of the Civil Code, not in a separate mandatory statement as under IFRS.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot; style=&quot;--h:var(--accent);--hb:var(--accent-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;span class=&quot;num-badge&quot;&gt;7&lt;/span&gt;&lt;div class=&quot;kicker&quot;&gt;Before you go · slides 2 and 20&lt;/div&gt;&lt;h2&gt;Homework and three questions&lt;/h2&gt;&lt;/header&gt;
  &lt;div class=&quot;split&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Homework set 2 · due Wednesday 30&lt;/h4&gt;
      &lt;ul class=&quot;small&quot;&gt;&lt;li&gt;&lt;b&gt;Exercise 5&lt;/b&gt; · The Library: journal, income statement, balance sheet&lt;/li&gt;&lt;li&gt;&lt;b&gt;Exercise 6&lt;/b&gt; · The retail shop: the equation in a table&lt;/li&gt;&lt;li&gt;&lt;b&gt;Exercise 7&lt;/b&gt; · Bergamo Bikes: adjustments and statements. Use the adjustments table (section 5); start it after this lecture.&lt;/li&gt;&lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Debriefing at the start of Wednesday&#x27;s lecture.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Next lecture · Wednesday 30 September&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;After the debriefing of set 2: &lt;b&gt;who writes the accounting rules&lt;/b&gt; (EU, Italy, IASB) and the &lt;b&gt;two accounting systems&lt;/b&gt; behind the two income statement formats seen today (by nature / by function).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;“Could you answer in three lines?” — the questions on slide 20&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why can&#x27;t the website business&#x27;s loss be seen in the trial balance, even though all the figures are there?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Because the trial balance lists balances account by account, mixing balance sheet and income items: the loss is spread across 12 accounts (Sales and 11 expense accounts) and does not exist as a single figure. Only by separating the income statement from the balance sheet can 500 − 1,160 = −660 be calculated and seen flowing into equity.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. A business sells a building for more than its book value: revenue or gain? Where does it appear?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;It is a &lt;b&gt;gain&lt;/b&gt;: selling buildings is not part of ordinary activities. It appears in the income statement (increasing equity) for the difference between the price and the book value, not for the full price. The building is removed from the balance sheet. &lt;span class=&quot;muted&quot;&gt;(In the Italian statutory format, since 2016, it falls under other revenues and income in section A, section E having been abolished: this is an inference from slides 12 and 15, to be checked in the lecture on the rules.)&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Twelve months&#x27; rent paid on 1 October: what is the expense for the year and what is the asset?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Expense: 3/12 of the rent (October–December). Asset: 9/12 as prepaid rent, which will be an expense the following year. See the slider in section 5.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;And the guiding question: why two statements, and why adjust them?&lt;/summary&gt;&lt;div class=&quot;in&quot;&gt;Two statements because they answer different questions: &lt;em&gt;what the business is worth today&lt;/em&gt; (balance sheet, lasting items) and &lt;em&gt;how much it earned during the period&lt;/em&gt; (income statement, consumed items, reset to zero at year-end). They must be adjusted because the ledger records receipts and payments, whereas profit is measured on an accrual basis: inventory, depreciation, accruals, prepayments and provisions move revenues and expenses into the right period.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot; style=&quot;--h:var(--accent);--hb:var(--accent-bg)&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;&lt;div class=&quot;kicker&quot;&gt;External sources · web research, October 2026&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;The laws and standards cited in the slides. Each card is an &lt;b&gt;external source&lt;/b&gt;: the information comes from the website indicated, not from the slides. The slides do not cite specific authors or textbooks.&lt;/p&gt;&lt;/header&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IFRS Conceptual Framework for Financial Reporting (2018)&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · Conceptual Framework&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; issued by the IASB in March 2018 to replace the 2010 version. It covers the objective of financial reporting, qualitative characteristics, the reporting entity, the definitions of asset, liability, equity, income and expenses, recognition and derecognition, measurement, presentation and capital maintenance. For entities that use it where no standard applies, it is effective for periods beginning on or after 1 January 2020. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the definitions on slides 8 and 12 and the point of reference when no standard covers a transaction.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IAS 1 · Presentation of Financial Statements&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 1&lt;/a&gt; · summary: &lt;a href=&quot;https://www.iasplus.com/standard/ias01.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; the basis for presenting IFRS financial statements. Minimum components (financial position, profit or loss and OCI, changes in equity, cash flows, notes) and general features: fair presentation, going concern, accrual basis, materiality and aggregation, offsetting, comparative information. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reference standard for slides 9 and 19; it is replaced by IFRS 18 from 2027.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IFRS 18 · Presentation and Disclosure in Financial Statements&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 18&lt;/a&gt; · in depth: &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY · a closer look at IFRS 18&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; it replaces IAS 1 for periods beginning on or after 1 January 2027 (with retrospective application). It introduces the operating / investing / financing categories in the income statement, the subtotals “operating profit” and “operating profit before financing and income taxes”, and disclosures on management-defined performance measures. In the EU its application depends on endorsement. &lt;b&gt;Why it matters:&lt;/b&gt; slides 9 and 15 present it as the new benchmark for comparison with the Italian format.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;IAS 7 · Statement of Cash Flows&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 7&lt;/a&gt; · summary: &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; how to present changes in cash and cash equivalents, broken down into operating, investing and financing activities. For operating cash flows it encourages the direct method and permits the indirect method. The original title was “Cash Flow Statements”, changed in 2007. &lt;b&gt;Why it matters:&lt;/b&gt; slide 19; it is the topic of the 14 October lecture.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Italian Civil Code, art. 2424 · Content of the balance sheet&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2424 Civil Code&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; the mandatory balance sheet format, in two-sided (account) form (Assets and Liabilities), with main classes identified by capital letters. The text was replaced by art. 6 of Legislative Decree 139/2015; in practice it is supplemented by the Italian accounting standard OIC 12. &lt;b&gt;Why it matters:&lt;/b&gt; it is the format shown on slides 9 and 11.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Italian Civil Code, art. 2425 · Content of the income statement&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2425 Civil Code&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; the mandatory income statement format in vertical form. A) value of production, B) costs of production (raw materials, services, use of third-party assets, staff…), then the financial sections, down to the profit or loss for the year. &lt;b&gt;Why it matters:&lt;/b&gt; it is the format shown on slide 15.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Italian Civil Code, art. 2427 · Content of the notes to the financial statements&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2427.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2427 Civil Code&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; the list of minimum disclosures in the notes: valuation criteria, movements in fixed assets, composition of specific items, changes in equity… presented in the order of the items in the statements. No. 13 concerns revenue and expense items of exceptional size or incidence. &lt;b&gt;Why it matters:&lt;/b&gt; slide 15 (non-recurring items after the abolition of section E) and slide 19 (changes in equity in Italy).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Legislative Decree no. 139 of 18 August 2015&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.gazzettaufficiale.it/eli/id/2015/09/04/15G00153/sg&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official Gazette (Gazzetta Ufficiale) no. 205 of 4/9/2015&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; it transposes Directive 2013/34/EU and amends the Civil Code and Legislative Decree 127/1991 on annual and consolidated financial statements. It applies to financial statements for periods beginning on or after 1 January 2016. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reform that abolished section E “extraordinary items” from the income statement (slide 15).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;badge inf&quot;&gt;Context&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Directive 2013/34/EU (Accounting Directive)&lt;/h4&gt;
      &lt;p class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/legal-content/IT/TXT/?uri=CELEX:32013L0034&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · CELEX 32013L0034&lt;/a&gt;&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;What it contains:&lt;/b&gt; the EU directive on annual and consolidated financial statements. The financial statements comprise at least the balance sheet, the profit and loss account and the notes, and must give a true and fair view. Published in the Official Journal of the EU on 29 June 2013, with transposition due by 20 July 2015. &lt;b&gt;Why it matters:&lt;/b&gt; it is not cited in the slides, but it is the European origin of Legislative Decree 139/2015 and introduces the “who writes the rules” theme of the 30 September lecture.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
    &lt;span&gt;Main source: “Lesson 28 Sept – Balance sheet and income statement.pdf” (20 slides). The “external source” boxes come from web research and are given with their links.&lt;/span&gt;
  &lt;/div&gt;

/* tabs */
$$(&#x27;[data-tabs]&#x27;).forEach(w=&gt;{
  const bs=$$(&#x27;:scope&gt;.tabbar&gt;button&#x27;,w),ps=$$(&#x27;:scope&gt;.panel&#x27;,w);
