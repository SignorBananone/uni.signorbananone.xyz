&lt;h1&gt;Homework: double-entry exercises&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Sette esercizi, un solo percorso: dalla prima transazione fino al &lt;em&gt;balance sheet&lt;/em&gt; e all&#x27;&lt;em&gt;income statement&lt;/em&gt;. Questa pagina spiega le regole della partita doppia, svolge passo per passo ogni esercizio e ti lascia verificare da solo prima di guardare le soluzioni.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Corso di Laurea Magistrale in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;Prof. Daniele Gervasio&lt;/span&gt;&lt;span&gt;Set 1 (es. 1–4): lunedì 28 settembre&lt;/span&gt;&lt;span&gt;Set 2 (es. 5–7): mercoledì 30 settembre&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box tint-ochre&quot; style=&quot;margin-top:1.4rem&quot;&gt;
&lt;strong&gt;Come usare questa pagina.&lt;/strong&gt; Le slide chiedono di lavorare prima da soli, su carta o in un foglio di calcolo, poi confrontarsi con un compagno; il &lt;em&gt;debriefing&lt;/em&gt; in aula occupa i primi 20 minuti di ogni lezione. Qui ogni soluzione è nascosta: tocca le caselle «mostra» solo dopo averci provato.&lt;br&gt;
&lt;small&gt;Nota: la sezione «Solutions» del file PDF contiene solo le istruzioni (le soluzioni vere non sono incluse). Le soluzioni qui sotto sono quindi &lt;strong&gt;ricostruite&lt;/strong&gt; da Claude applicando le regole delle slide, e quadrate con i totali che le slide forniscono (es. il &lt;em&gt;trial balance&lt;/em&gt; di novembre). Confrontale con quanto viene detto al debriefing.&lt;/small&gt;
&lt;/div&gt;
&lt;/header&gt;

&lt;section id=&quot;mappa&quot; class=&quot;part&quot;&gt;
&lt;span class=&quot;tag&quot; style=&quot;background:var(--acc-bg);color:var(--acc)&quot;&gt;Mappa concettuale&lt;/span&gt;
&lt;h2&gt;Il percorso in un colpo d&#x27;occhio&lt;/h2&gt;
&lt;p&gt;Ogni riquadro è cliccabile e porta alla sezione. La riga in alto è il &lt;strong&gt;ciclo contabile&lt;/strong&gt; (registrare → smistare → verificare); la riga in basso porta ai &lt;strong&gt;bilanci&lt;/strong&gt;. Sotto tutto c&#x27;è l&#x27;&lt;em&gt;accounting equation&lt;/em&gt;, che regge ogni passaggio.&lt;/p&gt;

&lt;section id=&quot;regole&quot; class=&quot;part sage&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Le regole · slide 3 «The rules on one page»&lt;/span&gt;
&lt;h2&gt;La partita doppia su una pagina&lt;/h2&gt;
&lt;p&gt;La &lt;em class=&quot;t&quot;&gt;double-entry bookkeeping&lt;/em&gt; (partita doppia) registra ogni operazione &lt;strong&gt;due volte&lt;/strong&gt;, con lo stesso importo: una volta su un lato chiamato &lt;em class=&quot;t&quot;&gt;debit&lt;/em&gt; (in italiano «dare», colonna sinistra) e una volta sul lato &lt;em class=&quot;t&quot;&gt;credit&lt;/em&gt; («avere», colonna destra). Non c&#x27;entra con «debito» e «credito» nel senso comune: sono solo i &lt;strong&gt;due lati&lt;/strong&gt; di un conto.&lt;/p&gt;

&lt;div class=&quot;box key&quot;&gt;
&lt;h4&gt;Le quattro domande per ogni transazione&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;strong&gt;Come sono stati usati i soldi?&lt;/strong&gt; → &lt;em class=&quot;t&quot;&gt;DEBIT&lt;/em&gt; (acquisition / use: cosa ho ottenuto).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Da dove arrivano?&lt;/strong&gt; → &lt;em class=&quot;t&quot;&gt;CREDIT&lt;/em&gt; (source: chi ha fornito le risorse).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Quanto?&lt;/strong&gt; Lo stesso importo sui due lati.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Quando?&lt;/strong&gt; La data della transazione.&lt;/li&gt;
&lt;/ol&gt;
&lt;p style=&quot;color:var(--acc);font-weight:600;margin-bottom:0&quot;&gt;Total debits = total credits. Always.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Che cosa aumenta con il debit e che cosa con il credit&lt;/h3&gt;
&lt;p&gt;Ogni conto appartiene a uno di cinque tipi. Prova il simulatore: scegli il tipo di conto e se aumenta o diminuisce.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;simType&quot; role=&quot;group&quot; aria-label=&quot;Tipo di conto&quot;&gt;
&lt;button data-v=&quot;A&quot; aria-pressed=&quot;true&quot;&gt;Assets&lt;/button&gt;&lt;button data-v=&quot;E&quot;&gt;Expenses&lt;/button&gt;&lt;button data-v=&quot;L&quot;&gt;Liabilities&lt;/button&gt;&lt;button data-v=&quot;OE&quot;&gt;Equity&lt;/button&gt;&lt;button data-v=&quot;R&quot;&gt;Revenue&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;simDir&quot; role=&quot;group&quot; aria-label=&quot;Direzione&quot;&gt;
&lt;button data-v=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;aumenta ↑&lt;/button&gt;&lt;button data-v=&quot;1&quot;&gt;diminuisce ↓&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;out&quot; id=&quot;simOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Account type&lt;/th&gt;&lt;th&gt;Che cos&#x27;è&lt;/th&gt;&lt;th&gt;Increases with&lt;/th&gt;&lt;th&gt;Normal balance&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Assets&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;attività: ciò che l&#x27;impresa possiede o controlla (cassa, impianti, crediti, merci)&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Expenses / costs&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;costi: risorse consumate per produrre ricavi&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Liabilities&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;passività: ciò che l&#x27;impresa deve a terzi&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Equity&lt;/strong&gt; (owners&#x27; stake)&lt;/td&gt;&lt;td&gt;patrimonio netto: la quota dei proprietari&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Revenue / income&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;ricavi e proventi&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;Tabella dalla slide 3; la colonna «Che cos&#x27;è» è una spiegazione aggiunta.&lt;/p&gt;
&lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;normal balance&lt;/em&gt; (saldo normale) è il lato su cui il conto di solito chiude: un conto cassa con saldo &lt;em&gt;credit&lt;/em&gt; vorrebbe dire cassa negativa, cioè quasi sempre un errore. Un piccolo aiuto mnemonico (non nelle slide): &lt;strong&gt;DEA-LER&lt;/strong&gt; → &lt;em&gt;Dividends, Expenses, Assets&lt;/em&gt; salgono in dare; &lt;em&gt;Liabilities, Equity, Revenue&lt;/em&gt; salgono in avere.&lt;/p&gt;

&lt;h3&gt;L&#x27;accounting equation&lt;/h3&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Assets&lt;/b&gt; = &lt;b&gt;Liabilities&lt;/b&gt; + &lt;b&gt;Equity&lt;/b&gt;&lt;/div&gt;
&lt;p&gt;L&#x27;&lt;em class=&quot;t&quot;&gt;accounting equation&lt;/em&gt; (equazione contabile) dice che ogni risorsa dell&#x27;impresa ha una fonte: o i creditori (liabilities) o i proprietari (equity). Le slide aggiungono: &lt;strong&gt;l&#x27;equity cresce con i revenues e si riduce con le expenses&lt;/strong&gt;. Ecco perché ricavi e costi seguono le stesse regole dell&#x27;equity: sono sue «sottovoci» temporanee, che a fine anno confluiscono nel risultato (profit o loss).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Schema dell&#x27;equazione contabile&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;190&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;text x=&quot;135&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:24px;font-weight:600&quot;&gt;Assets&lt;/text&gt;
&lt;text x=&quot;135&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;usi delle risorse (debit)&lt;/text&gt;
&lt;text x=&quot;300&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:34px&quot;&gt;=&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;75&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
&lt;text x=&quot;485&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:20px;font-weight:600&quot;&gt;Liabilities&lt;/text&gt;
&lt;text x=&quot;485&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;fonti dai creditori (credit)&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;103&quot; width=&quot;270&quot; height=&quot;107&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;485&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:20px;font-weight:600&quot;&gt;Equity&lt;/text&gt;
&lt;text x=&quot;485&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;fonti dai proprietari (credit)&lt;/text&gt;
&lt;rect x=&quot;366&quot; y=&quot;162&quot; width=&quot;114&quot; height=&quot;36&quot; rx=&quot;7&quot; style=&quot;fill:var(--paper);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;423&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;+ Revenue&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;162&quot; width=&quot;114&quot; height=&quot;36&quot; rx=&quot;7&quot; style=&quot;fill:var(--paper);stroke:var(--acc)&quot;/&gt;
&lt;text x=&quot;547&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;− Expenses&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Ricavi e costi vivono «dentro» l&#x27;equity: per questo i ricavi crescono in avere come l&#x27;equity, e i costi (che la riducono) crescono in dare.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Journal → Ledger → Trial balance&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Flusso journal ledger trial balance&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;95&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Journal&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;22&quot; y=&quot;68&quot;&gt;01/11 Checking   1,500&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;84&quot;&gt;  Owner&#x27;s Equity  1,500&lt;/text&gt;&lt;text x=&quot;22&quot; y=&quot;104&quot;&gt;02/11 Rent         500&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;120&quot;&gt;  Checking    500&lt;/text&gt;&lt;/g&gt;
&lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Ledger&lt;/text&gt;
&lt;path d=&quot;M255,62 H385 M320,62 V120&quot; style=&quot;stroke:var(--ink);stroke-width:2&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:10.5px&quot;&gt;Checking Account&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;262&quot; y=&quot;80&quot;&gt;1,500&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;80&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;96&quot;&gt;75&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;112&quot;&gt;…&lt;/text&gt;&lt;/g&gt;
&lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;545&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Trial balance&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;472&quot; y=&quot;70&quot;&gt;Checking&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;70&quot;&gt;190&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;86&quot;&gt;Owners&#x27; Equity&lt;/text&gt;&lt;text x=&quot;605&quot; y=&quot;86&quot;&gt;1,500&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;102&quot;&gt;…&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;120&quot; style=&quot;font-weight:700&quot;&gt;Totals 1,500 = 1,500&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M183,75 H230&quot; style=&quot;stroke:var(--acc);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;path d=&quot;M408,75 H455&quot; style=&quot;stroke:var(--acc);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Gli stessi importi, tre ordinamenti diversi.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;dl class=&quot;gl&quot;&gt;
&lt;dt&gt;Journal&lt;/dt&gt;&lt;dd&gt;(libro giornale) una riga — o un gruppo di righe — per transazione, in &lt;strong&gt;ordine di data&lt;/strong&gt;. Ogni registrazione si chiama &lt;em class=&quot;t&quot;&gt;journal entry&lt;/em&gt;.&lt;/dd&gt;
&lt;dt&gt;Ledger / T-accounts&lt;/dt&gt;&lt;dd&gt;(libro mastro, conti «a T») gli stessi importi &lt;strong&gt;ordinati per conto&lt;/strong&gt;: ogni conto ha un lato debit (sinistra) e uno credit (destra).&lt;/dd&gt;
&lt;dt&gt;Trial balance&lt;/dt&gt;&lt;dd&gt;(bilancio di verifica) l&#x27;elenco dei &lt;strong&gt;saldi&lt;/strong&gt; di tutti i conti; se il totale dei saldi debit non coincide con quello credit, c&#x27;è un errore da qualche parte.&lt;/dd&gt;
&lt;/dl&gt;
&lt;p&gt;Attenzione: un trial balance che quadra non garantisce che tutto sia giusto. Se registri un acquisto sul conto sbagliato, oppure dimentichi un&#x27;intera transazione, i totali quadrano lo stesso. Per questo le slide suggeriscono di controllare prima il &lt;strong&gt;conto&lt;/strong&gt; (il tipo è giusto?), poi il &lt;strong&gt;lato&lt;/strong&gt; (use o source?) e solo alla fine l&#x27;aritmetica (slide 11).&lt;/p&gt;

&lt;h3&gt;Cash vs on account&lt;/h3&gt;
&lt;p&gt;«&lt;em class=&quot;t&quot;&gt;On account&lt;/em&gt;» / «&lt;em class=&quot;t&quot;&gt;on credit&lt;/em&gt;» (a credito, con pagamento differito) significa che il costo o la vendita si registrano &lt;strong&gt;quando viene emessa la fattura&lt;/strong&gt;, usando &lt;em class=&quot;t&quot;&gt;Accounts Payable&lt;/em&gt; (debiti verso fornitori) o &lt;em class=&quot;t&quot;&gt;Accounts Receivable&lt;/em&gt; (crediti verso clienti). Il movimento di cassa si registra &lt;strong&gt;dopo&lt;/strong&gt;, quando avviene.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo acquisto on account&quot;&gt;
&lt;path d=&quot;M30,85 H610&quot; style=&quot;stroke:var(--rule);stroke-width:3&quot;/&gt;
&lt;circle cx=&quot;140&quot; cy=&quot;85&quot; r=&quot;9&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;circle cx=&quot;480&quot; cy=&quot;85&quot; r=&quot;9&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Arriva la fattura&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Dr Phone Service 150&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Cr Accounts Payable 150&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;il costo nasce qui&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Si paga&lt;/text&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · le regole&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Paghi un affitto con un assegno: quale conto va in debit?&lt;/summary&gt;&lt;div&gt;Rent (expense). L&#x27;affitto è l&#x27;&lt;em&gt;uso&lt;/em&gt; dei soldi; la &lt;em&gt;fonte&lt;/em&gt; è il Checking Account, che va in credit e diminuisce.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché i revenues aumentano con il credit?&lt;/summary&gt;&lt;div&gt;Perché fanno crescere l&#x27;equity, che aumenta in avere. I ricavi sono una «fonte» di risorse, come il capitale portato dai soci.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il trial balance quadra. Puoi essere sicuro che non ci siano errori?&lt;/summary&gt;&lt;div&gt;No. Quadra anche se usi il conto sbagliato con l&#x27;importo giusto, se ometti una transazione intera o se scambi due conti dello stesso tipo. Prova solo che dare = avere.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es1&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Esercizio 1 · Table 1 (November)&lt;/span&gt;
&lt;h2&gt;Use e source: le prime registrazioni&lt;/h2&gt;
&lt;p&gt;Sette transazioni di novembre di una piccola attività web, tutte &lt;strong&gt;per cassa&lt;/strong&gt; (pagate con assegno dal conto corrente, il &lt;em class=&quot;t&quot;&gt;Checking Account&lt;/em&gt;). Compito: per ogni riga individuare &lt;em&gt;use&lt;/em&gt; (debit) e &lt;em&gt;source&lt;/em&gt; (credit), poi scrivere la journal entry (data, descrizione, debit, credit).&lt;/p&gt;
&lt;p&gt;Un indizio nascosto: il &lt;em&gt;trial balance&lt;/em&gt; di novembre già fornito nell&#x27;esercizio 4 (slide 7) svela i nomi dei conti da usare. Telefono/fax (75) e stampante (150) finiscono in &lt;strong&gt;Office Equipment&lt;/strong&gt; = 225; le parti del server in &lt;strong&gt;Computer Hardware&lt;/strong&gt; = 500.&lt;/p&gt;

&lt;h3&gt;Che cosa succede al conto corrente&lt;/h3&gt;
&lt;p&gt;Una sola entrata (il capitale del titolare) e sei uscite. Il saldo finale, 190, è proprio quello del trial balance di novembre nella slide 7: la ricostruzione quadra.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;wfNov&quot; viewBox=&quot;0 0 640 240&quot; role=&quot;img&quot; aria-label=&quot;Andamento del Checking Account a novembre&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Cascata del saldo di Checking Account, novembre. Verde = entrata (debit), terracotta = uscita (credit).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Asset o expense? La domanda chiave dell&#x27;esercizio&lt;/h4&gt;
&lt;p&gt;Telefono, stampante e parti del server durano più di un periodo: sono &lt;strong&gt;assets&lt;/strong&gt;, beni che restano in azienda. Affitto, cancelleria (&lt;em&gt;office supplies&lt;/em&gt;, consumata in fretta) e commissioni bancarie sono &lt;strong&gt;expenses&lt;/strong&gt;: risorse consumate subito. Entrambi vanno in debit, ma finiscono in bilanci diversi: gli asset nel &lt;em&gt;balance sheet&lt;/em&gt;, le spese nell&#x27;&lt;em&gt;income statement&lt;/em&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Scrivi la journal entry della transazione 2.&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Nov XX · Paid rent, check #100 — Dr Rent 500 / Cr Checking Account 500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il versamento del titolare non è un revenue?&lt;/summary&gt;&lt;div&gt;Perché non nasce dall&#x27;attività con i clienti: è un apporto di capitale. Va in Owner&#x27;s Equity, non in Sales.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è il saldo di Checking a fine novembre e su che lato?&lt;/summary&gt;&lt;div&gt;190 in debit: 1,500 − (500 + 75 + 150 + 75 + 500 + 10).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es2&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Esercizio 2 · Table 2 (December)&lt;/span&gt;
&lt;h2&gt;On account e multi-line entries&lt;/h2&gt;

&lt;p class=&quot;src&quot;&gt;I nomi dei conti sono quelli dei T-accounts della slide 6 e del trial balance di dicembre della slide 7.&lt;/p&gt;

&lt;h3&gt;Anatomia dell&#x27;estratto conto della carta&lt;/h3&gt;
&lt;p&gt;Le sette voci sommano esattamente a 930: è il controllo che la multi-line entry sia in equilibrio. Due voci (scrivania e parti del server) sono &lt;strong&gt;assets&lt;/strong&gt;, le altre cinque sono &lt;strong&gt;expenses&lt;/strong&gt;: anche se arrivano sullo stesso documento, ognuna va nel suo conto.&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 130&quot; role=&quot;img&quot; aria-label=&quot;Composizione dell&#x27;estratto conto da 930&quot;&gt;
&lt;g id=&quot;ccbar&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Barra proporzionale delle voci dell&#x27;estratto conto (930 = 100%). Ardesia = asset, terracotta = expense.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Il saldo di cassa a dicembre&lt;/h3&gt;
&lt;p&gt;Le bollette e le spese con la carta &lt;strong&gt;non toccano&lt;/strong&gt; il conto corrente: lo tocca solo il pagamento parziale di 500 (transazione 15). Partendo dai 190 di novembre, il conto chiude dicembre a 550.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;wfDec&quot; viewBox=&quot;0 0 640 240&quot; role=&quot;img&quot; aria-label=&quot;Andamento del Checking Account a dicembre&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Cascata del saldo di Checking Account a dicembre, partendo dal saldo di novembre.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Perché la carta di credito è Accounts Payable&lt;/h4&gt;
&lt;p&gt;Quando usi la carta, è la società emittente a pagare per te: le devi dei soldi. Le slide registrano tutto quando arriva l&#x27;estratto (slide 3: «record the expense … when the bill is issued»), con source &lt;em&gt;Accounts Payable&lt;/em&gt;. Il pagamento del 15 riduce il debito (debit AP) e la cassa (credit Checking). Restano da pagare 930 − 500 = &lt;strong&gt;430&lt;/strong&gt; alla carta, più 250 di bollette: totale AP &lt;strong&gt;680&lt;/strong&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;La bolletta elettrica ricevuta il 13 riduce la cassa?&lt;/summary&gt;&lt;div&gt;No. Nasce un costo (Electric Service, debit) e un debito (Accounts Payable, credit). La cassa si muoverà solo quando la paghi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quanti conti compaiono nella journal entry n. 14?&lt;/summary&gt;&lt;div&gt;Otto: sette in debit (CC Fees &amp;amp; Int, Office Furniture, Fuel, Subscriptions, Meals, Website Hosting, Computer Hardware) e uno in credit (Accounts Payable 930).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il pagamento della transazione 15 è un costo?&lt;/summary&gt;&lt;div&gt;No: estingue in parte un debito già registrato. I costi erano già stati rilevati alla transazione 14.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es3&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Esercizio 3 · T-accounts&lt;/span&gt;
&lt;h2&gt;Dal journal al ledger&lt;/h2&gt;
&lt;p&gt;Un &lt;em class=&quot;t&quot;&gt;T-account&lt;/em&gt; (conto a T) è un conto disegnato come una T: il nome in alto, i &lt;strong&gt;debit a sinistra&lt;/strong&gt;, i &lt;strong&gt;credit a destra&lt;/strong&gt;. Si «riporta» (&lt;em&gt;posting&lt;/em&gt;) ogni riga del journal nel conto corrispondente; il &lt;strong&gt;saldo&lt;/strong&gt; è la differenza fra i due lati, scritta sul lato più grande.&lt;/p&gt;
&lt;div class=&quot;box tint-ochre&quot;&gt;&lt;small&gt;&lt;strong&gt;Nota sul testo della slide 6.&lt;/strong&gt; La consegna dice «December transactions from Tables 1 and 2», ma la Table 1 contiene novembre. I conti a T proposti (Checking, Owner&#x27;s Equity, Computer Hardware, Bank Charges, Office Furniture, Repairs &amp;amp; Maintenance, Sales, Accounts Payable, Phone, Electric, Credit Card Fees, Fuel, Subscriptions, Meals, Website Hosting) sono proprio quelli di &lt;strong&gt;dicembre&lt;/strong&gt;: Rent, Office Supplies e Office Equipment non ci sono. Qui puoi vedere sia dicembre sia novembre sia il cumulato.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;taPer&quot; role=&quot;group&quot; aria-label=&quot;Periodo dei T-accounts&quot;&gt;&lt;button data-v=&quot;D&quot; aria-pressed=&quot;true&quot;&gt;Dicembre (#8–16)&lt;/button&gt;&lt;button data-v=&quot;N&quot;&gt;Novembre (#1–7)&lt;/button&gt;&lt;button data-v=&quot;ALL&quot;&gt;Cumulato al 31 dic&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Asset&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Liability&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Equity&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Revenue&lt;/span&gt;&lt;span style=&quot;--c:var(--acc)&quot;&gt;Expense&lt;/span&gt;&lt;span class=&quot;muted&quot;&gt;· il piccolo numero grigio è il n. della transazione&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tacc&quot; id=&quot;tacc&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Leggere un T-account&lt;/h4&gt;
&lt;p&gt;Checking Account a dicembre: a sinistra 1,100 (#8) e 500 (#11), a destra 700, 25, 500, 15. Debit 1,600 − credit 1,240 = &lt;strong&gt;saldo debit 360&lt;/strong&gt; (la variazione di dicembre). Aggiungendo i 190 di novembre si arriva a 550. Accounts Payable: a destra 150 + 100 + 930, a sinistra 500 → &lt;strong&gt;saldo credit 680&lt;/strong&gt;, quanto l&#x27;impresa deve ancora.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 3&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;In quale lato del T-account di Sales compare la transazione 11?&lt;/summary&gt;&lt;div&gt;A destra (credit): i ricavi aumentano in avere.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Office Furniture a dicembre: quali registrazioni e che saldo?&lt;/summary&gt;&lt;div&gt;Debit 700 (#9, sedia) + 245 (#14, scrivania con la carta) = saldo debit 945.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché Computer Hardware riceve un movimento a dicembre?&lt;/summary&gt;&lt;div&gt;Per le parti del server da 400 pagate con la carta di credito (#14). Sommate ai 500 di novembre, fanno 900 a fine anno.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es4&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Esercizio 4 · Trial balance&lt;/span&gt;
&lt;h2&gt;Il trial balance: dicembre e cumulato&lt;/h2&gt;
&lt;p&gt;Il &lt;em class=&quot;t&quot;&gt;trial balance&lt;/em&gt; mette in colonna i saldi di tutti i conti: i saldi debit a sinistra, i saldi credit a destra. La slide 7 dà già quello di &lt;strong&gt;novembre&lt;/strong&gt; (totali 1,500 = 1,500) e chiede di preparare quello di &lt;strong&gt;dicembre&lt;/strong&gt;, poi di &lt;strong&gt;combinare&lt;/strong&gt; i saldi dei due mesi in un trial balance al 31 dicembre.&lt;/p&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;tbPer&quot; role=&quot;group&quot; aria-label=&quot;Periodo del trial balance&quot;&gt;&lt;button data-v=&quot;N&quot;&gt;Novembre (dato)&lt;/button&gt;&lt;button data-v=&quot;D&quot; aria-pressed=&quot;true&quot;&gt;Dicembre&lt;/button&gt;&lt;button data-v=&quot;ALL&quot;&gt;Cumulato al 31 dic&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tb&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;tbChk&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;tbBars&quot; viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra totale debit e credit&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Le due colonne devono essere alte uguali.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Combinare due periodi&lt;/h4&gt;
&lt;p&gt;Il cumulato si ottiene sommando, conto per conto, i saldi dei due mesi (con il segno: debit +, credit −). Esempi: Checking 190 + 360 = 550; Owners&#x27; Equity 1,500 + 1,100 = 2,600; Computer Hardware 500 + 400 = 900. Il modello di dicembre della slide non ha la riga &lt;strong&gt;Rent&lt;/strong&gt;, perché a dicembre non si paga affitto: nel cumulato va aggiunta (500).&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Qual è il totale del trial balance di dicembre?&lt;/summary&gt;&lt;div&gt;2,280 = 2,280. Credit: Accounts Payable 680 + Owners&#x27; Equity 1,100 + Sales 500.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;E del cumulato al 31 dicembre?&lt;/summary&gt;&lt;div&gt;3,780 = 3,780 (credit: AP 680 + Equity 2,600 + Sales 500).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Office Equipment ha saldo zero a dicembre: perché resta 225 nel cumulato?&lt;/summary&gt;&lt;div&gt;Perché è un asset acquistato a novembre che è ancora in azienda: il saldo di un conto patrimoniale si porta avanti da un periodo all&#x27;altro.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es5&quot; class=&quot;part brick&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Esercizio 5 · «The Library»&lt;/span&gt;
&lt;h2&gt;Da dieci transazioni ai bilanci&lt;/h2&gt;
&lt;p&gt;Una libreria nasce il 1° gennaio e in un anno compie dieci operazioni. Compito: classificare ogni conto come &lt;strong&gt;A&lt;/strong&gt; (asset), &lt;strong&gt;L&lt;/strong&gt; (liability), &lt;strong&gt;OE&lt;/strong&gt; (owners&#x27; equity), &lt;strong&gt;R&lt;/strong&gt; (revenue) o &lt;strong&gt;E&lt;/strong&gt; (expense); scrivere il journal; preparare &lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt; (conto economico) e &lt;em class=&quot;t&quot;&gt;balance sheet&lt;/em&gt; (stato patrimoniale) al 31 dicembre.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Transaction&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Jan 1&lt;/td&gt;&lt;td&gt;Costituzione; share capital 20,000: i soci versano cash 16,000 e un building (edificio) da 4,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Mar 15&lt;/td&gt;&lt;td&gt;Compra land (terreno) per 6,000: 2,000 cash, 4,000 da pagare entro il 15 settembre&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Jun 3&lt;/td&gt;&lt;td&gt;Compra libri per 2,000, pagamento entro il 30 giugno&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Jun 8&lt;/td&gt;&lt;td&gt;Vende metà dei libri per 1,200, pagamento rinviato al 15 giugno (&lt;em&gt;perpetual inventory&lt;/em&gt;)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Jun 30&lt;/td&gt;&lt;td&gt;Paga il debito per i libri&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Jun 30&lt;/td&gt;&lt;td&gt;Paga salari in contanti per 100&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Jul 31&lt;/td&gt;&lt;td&gt;Emette bonds (obbligazioni) per 2,000, incassando cash&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Sept 15&lt;/td&gt;&lt;td&gt;Paga il debito per il terreno&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;Oct 30&lt;/td&gt;&lt;td&gt;Vende il terreno per 7,000 in contanti&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;Dec 31&lt;/td&gt;&lt;td&gt;Ammortizza l&#x27;edificio del 5% del suo valore&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Passo 1 · Classifica i conti&lt;/h3&gt;
&lt;p&gt;Tocca ogni conto per vedere il tipo.&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;
&lt;button class=&quot;chip&quot;&gt;Cash&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Building&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Share capital&lt;b&gt;OE&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Land&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Payable for land&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Inventory&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accounts payable&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accounts receivable&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Sales revenue&lt;b&gt;R&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Cost of goods sold&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Salaries expense&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Bonds payable&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Gain on sale of land&lt;b&gt;R&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Depreciation expense&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accumulated depreciation&lt;b&gt;contro-A&lt;/b&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;p class=&quot;t-it&quot;&gt;&lt;em&gt;Accumulated depreciation&lt;/em&gt; (fondo ammortamento) è un conto rettificativo dell&#x27;attivo: ha saldo credit e si sottrae al valore dell&#x27;edificio.&lt;/p&gt;

&lt;h3&gt;Passo 2 · Il journal&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;1 · Jan 1 — costituzione con conferimento misto&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 16,000 · Dr Building 4,000 / Cr Share capital 20,000&lt;/span&gt;&lt;br&gt;Il capitale può essere versato anche in natura: l&#x27;edificio è un asset portato dai soci.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · Mar 15 — terreno pagato in parte&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Land 6,000 / Cr Cash 2,000 · Cr Payable for land 4,000&lt;/span&gt;&lt;br&gt;Il costo del terreno è tutto 6,000 subito, anche se se ne paga solo un terzo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · Jun 3 — acquisto libri on account&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Inventory 2,000 / Cr Accounts payable 2,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · Jun 8 — vendita con perpetual inventory (due scritture)&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Accounts receivable 1,200 / Cr Sales revenue 1,200&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cost of goods sold 1,000 / Cr Inventory 1,000&lt;/span&gt;&lt;br&gt;Con il &lt;em class=&quot;t&quot;&gt;perpetual inventory&lt;/em&gt; (inventario permanente) il magazzino si aggiorna a ogni vendita: si rileva subito il &lt;em class=&quot;t&quot;&gt;cost of goods sold&lt;/em&gt; (COGS, costo del venduto) pari al costo della metà venduta, 2,000 ÷ 2.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;5 · Jun 30 — pagamento ai fornitori&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Accounts payable 2,000 / Cr Cash 2,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;6 · Jun 30 — salari&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Salaries expense 100 / Cr Cash 100&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;7 · Jul 31 — emissione di bonds&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 2,000 / Cr Bonds payable 2,000&lt;/span&gt;&lt;br&gt;Un prestito obbligazionario è una liability, non equity: va restituito. Il testo non indica interessi, quindi non se ne registrano.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;8 · Sept 15 — si paga il terreno&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Payable for land 4,000 / Cr Cash 4,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;9 · Oct 30 — vendita del terreno con plusvalenza&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 7,000 / Cr Land 6,000 · Cr Gain on sale of land 1,000&lt;/span&gt;&lt;br&gt;Il terreno esce al suo costo; la differenza è un &lt;em class=&quot;t&quot;&gt;gain&lt;/em&gt; (plusvalenza), un provento che non nasce dall&#x27;attività tipica (vendere libri).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;10 · Dec 31 — ammortamento&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Depreciation expense 200 / Cr Accumulated depreciation 200&lt;/span&gt;&lt;br&gt;La &lt;em class=&quot;t&quot;&gt;depreciation&lt;/em&gt; (ammortamento) ripartisce il costo di un bene durevole sugli anni in cui lo si usa: 5% × 4,000 = 200. Il terreno non si ammortizza.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Passo 3 · I bilanci al 31 dicembre&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tab-btns&quot;&gt;&lt;button data-t=&quot;lib-is&quot; aria-selected=&quot;true&quot;&gt;Income statement&lt;/button&gt;&lt;button data-t=&quot;lib-bs&quot; aria-selected=&quot;false&quot;&gt;Balance sheet&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;lib-is&quot;&gt;
&lt;table&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Sales revenue&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr style=&quot;font-weight:600&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Salaries expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Depreciation expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gain on sale of land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;L&#x27;utile è tutto merito della plusvalenza sul terreno: senza quella, l&#x27;attività di libreria chiuderebbe a −100.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;lib-bs&quot; hidden&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16,900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Building 4,000 − acc. dep. 200&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,800&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Liabilities + Equity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Bonds payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Net income (retained)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&amp;nbsp;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total L + E&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;/div&gt;
&lt;p&gt;Cash: 16,000 − 2,000 − 2,000 − 100 + 2,000 − 4,000 + 7,000 = 16,900.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 280&quot; role=&quot;img&quot; aria-label=&quot;Balance sheet della Library in proporzione&quot;&gt;
&lt;text x=&quot;160&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Assets 22,900&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;L + E 22,900&lt;/text&gt;
&lt;rect x=&quot;80&quot; y=&quot;32&quot; width=&quot;160&quot; height=&quot;162&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--paper)&quot;&gt;Cash 16,900&lt;/text&gt;
&lt;rect x=&quot;80&quot; y=&quot;194&quot; width=&quot;160&quot; height=&quot;11.5&quot; style=&quot;fill:var(--slate);opacity:.75&quot;/&gt;&lt;rect x=&quot;80&quot; y=&quot;205.5&quot; width=&quot;160&quot; height=&quot;9.6&quot; style=&quot;fill:var(--slate);opacity:.55&quot;/&gt;

&lt;rect x=&quot;400&quot; y=&quot;32&quot; width=&quot;160&quot; height=&quot;19.2&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;46&quot; style=&quot;font-size:11px&quot;&gt;Bonds 2,000&lt;/text&gt;
&lt;rect x=&quot;400&quot; y=&quot;51.2&quot; width=&quot;160&quot; height=&quot;191.7&quot; style=&quot;fill:var(--sage);opacity:.85&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--paper)&quot;&gt;Share capital 20,000&lt;/text&gt;
&lt;rect x=&quot;400&quot; y=&quot;242.9&quot; width=&quot;160&quot; height=&quot;8.6&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;251&quot; style=&quot;font-size:11px&quot;&gt;Net income 900&lt;/text&gt;

&lt;div class=&quot;box tint-brick&quot;&gt;&lt;small&gt;&lt;strong&gt;Ipotesi da verificare al debriefing.&lt;/strong&gt; Il testo dice che il cliente della transazione 4 pagherà il 15 giugno, ma non c&#x27;è una riga che registri l&#x27;incasso. Qui l&#x27;incasso &lt;strong&gt;non&lt;/strong&gt; è stato registrato (AR resta 1,200). Se lo si registra (Dr Cash / Cr AR 1,200), il cash diventa 18,100, AR va a 0 e il totale dell&#x27;attivo resta 22,900.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 5&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché alla transazione 4 servono due scritture?&lt;/summary&gt;&lt;div&gt;Con il perpetual inventory si registra il ricavo (1,200) e, nello stesso momento, l&#x27;uscita dal magazzino al costo (1,000 → COGS).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;La vendita del terreno a 7,000 è un ricavo da 7,000?&lt;/summary&gt;&lt;div&gt;No. Il terreno esce dal bilancio al costo, 6,000; nell&#x27;income statement entra solo la plusvalenza di 1,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che valore ha l&#x27;edificio nel balance sheet?&lt;/summary&gt;&lt;div&gt;3,800, il &lt;em&gt;net book value&lt;/em&gt; (valore netto contabile): costo 4,000 meno fondo ammortamento 200.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es6&quot; class=&quot;part ochre&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Esercizio 6 · The retail shop&lt;/span&gt;
&lt;h2&gt;L&#x27;accounting equation in una tabella&lt;/h2&gt;
&lt;p&gt;Stessa logica, senza debit e credit: ogni transazione è una riga con &lt;strong&gt;+&lt;/strong&gt; e &lt;strong&gt;−&lt;/strong&gt; nelle colonne di attivo, passivo, capitale e profitto. Dopo ogni riga, &lt;em&gt;Assets = Liabilities + Capital + Profit&lt;/em&gt; deve restare vero. Si parte da un capitale iniziale di € 100,000.&lt;/p&gt;
&lt;p class=&quot;src&quot;&gt;La consegna della slide 9 è parzialmente coperta dal testo della transazione 7; si legge «fill a table with columns Cash, Receivables, … Liabilities, Owner&#x27;s capital, Profit, one row per transaction, with + and −. No debits and credits: only the accounting equation». Qui le altre attività sono separate in Inventory e Property.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;eqStep&quot;&gt;Transazione&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eqStep&quot; min=&quot;0&quot; max=&quot;7&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;eqOut&quot; for=&quot;eqStep&quot;&gt;0&lt;/output&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;eqTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;eqT&quot; style=&quot;font-size:.84rem&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;eqSvg&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Attivo contro passivo più capitale&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Muovi il cursore: le due colonne cambiano composizione ma restano sempre alte uguali.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-ochre&quot;&gt;
&lt;h4&gt;Il punto chiave: la vendita della transazione 4&lt;/h4&gt;
&lt;p&gt;Si vende un terzo delle merci, che erano costate 45,000: escono merci per &lt;strong&gt;15,000&lt;/strong&gt; e nasce un credito di &lt;strong&gt;35,000&lt;/strong&gt;. La differenza, &lt;strong&gt;20,000&lt;/strong&gt;, è profitto. Un&#x27;unica operazione fa scendere un asset, salirne un altro e crescere l&#x27;equity. Nella transazione 6 invece l&#x27;incasso di 16,000 sposta solo valore da Receivables a Cash: il profitto non cambia.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 6&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quali transazioni modificano il profitto?&lt;/summary&gt;&lt;div&gt;Solo la 4 (+20,000) e la 5 (−4,000, salari). Profitto finale 16,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quanto vale il totale dell&#x27;attivo alla fine?&lt;/summary&gt;&lt;div&gt;191,000 = Cash 67,000 + Receivables 19,000 + Inventory 55,000 + Property 50,000 = Liabilities 75,000 + Capital 100,000 + Profit 16,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Scrivi la transazione 7 con debit e credit.&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Inventory 25,000 / Cr Accounts payable 25,000&lt;/span&gt; — un asset sale, una liability sale: l&#x27;equazione resta in equilibrio.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es7&quot; class=&quot;part brick&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Esercizio 7 · «Bergamo Bikes S.r.l.»&lt;/span&gt;
&lt;h2&gt;Year-end adjustments: pagare non è consumare&lt;/h2&gt;
&lt;p&gt;Primo anno di un negozio di bici. Dopo le otto transazioni dell&#x27;anno servono le &lt;em class=&quot;t&quot;&gt;year-end adjustments&lt;/em&gt; (scritture di assestamento): costo del venduto e rimanenze finali, ammortamento, &lt;em class=&quot;t&quot;&gt;accrued interest&lt;/em&gt; (rateo di interessi passivi) e &lt;em class=&quot;t&quot;&gt;prepaid rent&lt;/em&gt; (risconto attivo sull&#x27;affitto). Il suggerimento della slide 10 dice tutto: &lt;strong&gt;«the difference between paying and consuming is the whole point of this exercise»&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;box key&quot;&gt;
&lt;h4&gt;Il principio sotto: accrual basis&lt;/h4&gt;
&lt;p&gt;Con la contabilità per competenza (&lt;em class=&quot;t&quot;&gt;accrual basis&lt;/em&gt;) un costo entra nel risultato dell&#x27;anno in cui la risorsa è &lt;strong&gt;consumata&lt;/strong&gt;, e un ricavo in cui è &lt;strong&gt;guadagnato&lt;/strong&gt;, indipendentemente da quando si paga o si incassa. È il &lt;em class=&quot;t&quot;&gt;matching principle&lt;/em&gt;: ai ricavi dell&#x27;anno si abbinano i costi sostenuti per ottenerli.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;

&lt;figcaption&gt;Affitto: pagato tutto, consumato a metà → metà è costo, metà resta un asset. Interessi: consumati 3 mesi ma non ancora pagati → costo + debito (accrued).&lt;/figcaption&gt;

&lt;p class=&quot;t-it&quot;&gt;Alla 7 l&#x27;affitto è registrato come asset (Prepaid rent) e poi rettificato a fine anno. Un metodo equivalente: tutto a Rent expense 6,000 e a fine anno si stornano 3,000 su Prepaid rent. Il risultato finale è identico.&lt;/p&gt;

&lt;li&gt;&lt;strong&gt;Cost of goods sold e closing inventory.&lt;/strong&gt; Vendute 70 bici × 300 = &lt;strong&gt;21,000&lt;/strong&gt; di costo; restano 30 × 300 = &lt;strong&gt;9,000&lt;/strong&gt; in magazzino.&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cost of goods sold 21,000 / Cr Inventory 21,000&lt;/span&gt;&lt;/li&gt;

&lt;p&gt;Cash: 50,000 + 20,000 − 24,000 + 20,000 − 18,000 − 6,000 − 8,000 = 34,000.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;bb-d&quot; hidden&gt;
&lt;p class=&quot;out&quot;&gt;Una proposta: «Primo anno in leggera perdita contabile (−1,250), ma con un margine lordo del 40% sulle vendite: le bici si vendono bene, solo che i costi fissi non sono ancora coperti; con qualche vendita in più l&#x27;impresa va in utile.»&lt;/p&gt;
&lt;p&gt;Attenzione al trabocchetto: guardando solo la cassa, che chiude a 34,000, l&#x27;anno sembrerebbe buono. Ma l&#x27;impresa ha speso 24,000 in equipment e 6,000 di affitto anticipato, non ha ancora pagato interessi e ha 15,000 di crediti. Il risultato per competenza racconta un&#x27;altra storia. Il cursore qui sotto mostra quante bici in più servirebbero.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Quante bici servono per andare in pari?&lt;/h3&gt;
&lt;p&gt;Costi fissi del primo anno (wages + rent + depreciation + interest) = &lt;strong&gt;15,250&lt;/strong&gt;. Ogni bici venduta porta un margine di &lt;em&gt;prezzo − 300&lt;/em&gt;. Profitto = q × (p − 300) − 15,250.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;bkQ&quot;&gt;Bici vendute&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bkQ&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;bkQo&quot;&gt;70&lt;/output&gt;&lt;/div&gt;

&lt;p class=&quot;out&quot; id=&quot;bkOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figure style=&quot;margin:.4rem 0&quot;&gt;&lt;svg id=&quot;bkSvg&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Profitto in funzione delle bici vendute&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Retta del profitto al prezzo scelto; il punto è la situazione attuale, il cerchio vuoto il &lt;em&gt;break-even&lt;/em&gt; (pareggio). Le bici invendute restano in inventory al costo, quindi non pesano sul risultato.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · esercizio 7&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché i 6,000 di affitto non sono tutti costo dell&#x27;anno 1?&lt;/summary&gt;&lt;div&gt;Perché coprono luglio–giugno: a fine dicembre metà del servizio non è ancora stato consumato. Quei 3,000 sono un diritto futuro, quindi un asset (prepaid rent).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Gli interessi si pagano solo il 30 settembre dell&#x27;anno 2: perché registrarli adesso?&lt;/summary&gt;&lt;div&gt;Perché il denaro è stato usato da ottobre a dicembre: 250 di interessi sono già maturati e spettano all&#x27;anno 1 (costo e debito: accrued interest).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le 100 bici costano 30,000: perché il costo nell&#x27;income statement è solo 21,000?&lt;/summary&gt;&lt;div&gt;Si imputa solo il costo delle 70 vendute (matching con i ricavi). Le 30 rimaste (9,000) sono closing inventory, un asset.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A 500 € a bici, quante bici servono per il pareggio?&lt;/summary&gt;&lt;div&gt;15,250 ÷ 200 = 76.25 → 77 bici.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part ochre&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Per approfondire&lt;/span&gt;
&lt;h2&gt;Testi, norme e storia&lt;/h2&gt;
&lt;p&gt;Le slide di questo homework &lt;strong&gt;non citano&lt;/strong&gt; autori, studi, testi o standard: sono un eserciziario. I riferimenti che seguono sono stati scelti da Claude con una ricerca web perché coprono proprio gli argomenti degli esercizi (partita doppia, competenza, magazzino, ammortamento). Sono tutti &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;, non contenuto delle slide.&lt;/p&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Luca Pacioli, &lt;em&gt;Summa de arithmetica, geometria, proportioni et proportionalità&lt;/em&gt; (Venezia, 1494) &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;È la prima descrizione a stampa della partita doppia, nella sezione «Particularis de computis et scripturis». Pacioli non pretende di averla inventata: descrive la pratica dei mercanti, il «metodo di Venezia». Conta perché le regole di questo homework (ogni importo due volte, dare = avere, giornale e mastro) sono le sue. La National Library of Scotland, che ne conserva una copia, la definisce l&#x27;opera più influente nella storia della contabilità europea.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.nls.uk/collections/rare-books/collections/icas/pacioli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;National Library of Scotland — Pacioli&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IASB, &lt;em&gt;Conceptual Framework for Financial Reporting&lt;/em&gt; (2018) &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;È il quadro concettuale degli IFRS: obiettivo dell&#x27;informativa, caratteristiche qualitative, definizioni di asset, liability, equity, income ed expense, criteri di rilevazione e misurazione. Pubblicato nel marzo 2018, sostituisce la versione del 2010; per le imprese vale dagli esercizi iniziati dal 1° gennaio 2020. Non è uno standard e non si applica direttamente alle singole transazioni, ma dà le definizioni che usi negli esercizi 5 e 7 (che cos&#x27;è un asset? quando un costo è di competenza?).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Conceptual Framework&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 2 &lt;em&gt;Inventories&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;È lo standard internazionale sulle rimanenze: misurazione al minore tra costo e &lt;em&gt;net realisable value&lt;/em&gt; (valore netto di realizzo), formule di costo e rilevazione del costo del venduto come expense quando le merci si vendono. Collega gli esercizi 5, 6 e 7: il COGS e la closing inventory delle bici sono applicazioni di base di queste regole.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — IAS 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 16 &lt;em&gt;Property, Plant and Equipment&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;Regola gli immobili, impianti e macchinari: beni tangibili usati per più di un periodo. Si rilevano al costo e si ammortizzano lungo la vita utile; tratta anche le dismissioni. Riguarda l&#x27;edificio e il terreno della Library (il terreno non si ammortizza) e l&#x27;equipment di Bergamo Bikes (24,000 su 6 anni).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — IAS 16&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OIC 13 &lt;em&gt;Rimanenze&lt;/em&gt; (Organismo Italiano di Contabilità) &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;È il corrispondente italiano di IAS 2, per i bilanci redatti secondo il codice civile: serve per confrontare la prassi nazionale con gli IFRS, tema centrale di un corso di &lt;em&gt;international&lt;/em&gt; accounting. Il link porta al testo del 2014 sul sito della Fondazione OIC; il principio è stato poi aggiornato (dicembre 2016, emendamenti 2017), quindi verifica la versione in vigore sul sito ufficiale.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/2014-08-05-OIC-13-Rimanenze-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fondazione OIC — OIC 13 (PDF, versione 2014)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OpenStax, &lt;em&gt;Principles of Accounting, Volume 1: Financial Accounting&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;È un manuale universitario gratuito (licenza CC BY-NC-SA) che copre, in inglese, esattamente questi passaggi: analisi delle transazioni, journal e ledger, trial balance, adjusting entries, ciclo contabile e merchandising. Ha molti esercizi svolti, utili per allenarti oltre l&#x27;homework.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-financial-accounting/pages/preface&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OpenStax — Principles of Financial Accounting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;
