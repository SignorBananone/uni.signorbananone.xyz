&lt;h1&gt;Homework: double-entry exercises&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Seven exercises, one path: from the first transaction all the way to the &lt;em&gt;balance sheet&lt;/em&gt; and the &lt;em&gt;income statement&lt;/em&gt;. This page explains the rules of double-entry bookkeeping, works through each exercise step by step and lets you check your own answers before looking at the solutions.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Master&#x27;s Degree in Accounting, Governance and Sustainability&lt;/span&gt;&lt;span&gt;Prof. Daniele Gervasio&lt;/span&gt;&lt;span&gt;Set 1 (ex. 1–4): Monday 28 September&lt;/span&gt;&lt;span&gt;Set 2 (ex. 5–7): Wednesday 30 September&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box tint-ochre&quot; style=&quot;margin-top:1.4rem&quot;&gt;
&lt;strong&gt;How to use this page.&lt;/strong&gt; The slides ask you to work on your own first, on paper or in a spreadsheet, and then compare with a classmate; the in-class &lt;em&gt;debriefing&lt;/em&gt; takes up the first 20 minutes of each lecture. Every solution here is hidden: tap the «show» boxes only after you have had a go.&lt;br&gt;
&lt;small&gt;Note: the «Solutions» section of the PDF contains only the instructions (the actual solutions are not included). The solutions below have therefore been &lt;strong&gt;reconstructed&lt;/strong&gt; by Claude by applying the rules in the slides, and reconciled with the totals the slides provide (e.g. the November &lt;em&gt;trial balance&lt;/em&gt;). Compare them with what is said at the debriefing.&lt;/small&gt;
&lt;/div&gt;
&lt;/header&gt;

&lt;section id=&quot;mappa&quot; class=&quot;part&quot;&gt;
&lt;span class=&quot;tag&quot; style=&quot;background:var(--acc-bg);color:var(--acc)&quot;&gt;Concept map&lt;/span&gt;
&lt;h2&gt;The path at a glance&lt;/h2&gt;
&lt;p&gt;Each box is clickable and takes you to its section. The top row is the &lt;strong&gt;accounting cycle&lt;/strong&gt; (record → classify → verify); the bottom row leads to the &lt;strong&gt;financial statements&lt;/strong&gt;. Underpinning everything is the &lt;em&gt;accounting equation&lt;/em&gt;, which supports every step.&lt;/p&gt;

&lt;section id=&quot;regole&quot; class=&quot;part sage&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;The rules · slide 3 «The rules on one page»&lt;/span&gt;
&lt;h2&gt;Double-entry bookkeeping on one page&lt;/h2&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Double-entry bookkeeping&lt;/em&gt; records every transaction &lt;strong&gt;twice&lt;/strong&gt;, for the same amount: once on the side called &lt;em class=&quot;t&quot;&gt;debit&lt;/em&gt; (the left-hand column) and once on the &lt;em class=&quot;t&quot;&gt;credit&lt;/em&gt; side (the right-hand column). The terms have nothing to do with «debt» and «credit» in the everyday sense: they are simply the &lt;strong&gt;two sides&lt;/strong&gt; of an account.&lt;/p&gt;

&lt;div class=&quot;box key&quot;&gt;
&lt;h4&gt;The four questions for every transaction&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;strong&gt;How was the money used?&lt;/strong&gt; → &lt;em class=&quot;t&quot;&gt;DEBIT&lt;/em&gt; (acquisition / use: what was obtained).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Where did it come from?&lt;/strong&gt; → &lt;em class=&quot;t&quot;&gt;CREDIT&lt;/em&gt; (source: who provided the resources).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;How much?&lt;/strong&gt; The same amount on both sides.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;When?&lt;/strong&gt; The date of the transaction.&lt;/li&gt;
&lt;/ol&gt;
&lt;p style=&quot;color:var(--acc);font-weight:600;margin-bottom:0&quot;&gt;Total debits = total credits. Always.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;What increases with a debit and what with a credit&lt;/h3&gt;
&lt;p&gt;Every account belongs to one of five types. Try the simulator: choose the account type and whether it increases or decreases.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;simType&quot; role=&quot;group&quot; aria-label=&quot;Account type&quot;&gt;
&lt;button data-v=&quot;A&quot; aria-pressed=&quot;true&quot;&gt;Assets&lt;/button&gt;&lt;button data-v=&quot;E&quot;&gt;Expenses&lt;/button&gt;&lt;button data-v=&quot;L&quot;&gt;Liabilities&lt;/button&gt;&lt;button data-v=&quot;OE&quot;&gt;Equity&lt;/button&gt;&lt;button data-v=&quot;R&quot;&gt;Revenue&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;simDir&quot; role=&quot;group&quot; aria-label=&quot;Direction&quot;&gt;
&lt;button data-v=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;increases ↑&lt;/button&gt;&lt;button data-v=&quot;1&quot;&gt;decreases ↓&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;out&quot; id=&quot;simOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Account type&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;th&gt;Increases with&lt;/th&gt;&lt;th&gt;Normal balance&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Assets&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;what the business owns or controls (cash, equipment, receivables, inventory)&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Expenses / costs&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;resources consumed to generate revenue&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;td&gt;Debit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Liabilities&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;what the business owes to third parties&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Equity&lt;/strong&gt; (owners&#x27; stake)&lt;/td&gt;&lt;td&gt;the owners&#x27; residual interest&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Revenue / income&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;revenues and other income&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;Table from slide 3; the «What it is» column is an added explanation.&lt;/p&gt;
&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;normal balance&lt;/em&gt; is the side on which an account usually closes: a cash account with a &lt;em&gt;credit&lt;/em&gt; balance would mean negative cash, which is almost always an error. A small mnemonic (not in the slides): &lt;strong&gt;DEA-LER&lt;/strong&gt; → &lt;em&gt;Dividends, Expenses, Assets&lt;/em&gt; increase on the debit side; &lt;em&gt;Liabilities, Equity, Revenue&lt;/em&gt; increase on the credit side.&lt;/p&gt;

&lt;h3&gt;The accounting equation&lt;/h3&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Assets&lt;/b&gt; = &lt;b&gt;Liabilities&lt;/b&gt; + &lt;b&gt;Equity&lt;/b&gt;&lt;/div&gt;
&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;accounting equation&lt;/em&gt; states that every resource of the business has a source: either creditors (liabilities) or owners (equity). The slides add: &lt;strong&gt;equity increases with revenues and decreases with expenses&lt;/strong&gt;. This is why revenues and expenses follow the same rules as equity: they are temporary «sub-accounts» of it, which at year-end are closed into the result for the period (profit or loss).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the accounting equation&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;190&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;text x=&quot;135&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:24px;font-weight:600&quot;&gt;Assets&lt;/text&gt;
&lt;text x=&quot;135&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;uses of resources (debit)&lt;/text&gt;
&lt;text x=&quot;300&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:34px&quot;&gt;=&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;75&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot;/&gt;
&lt;text x=&quot;485&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:20px;font-weight:600&quot;&gt;Liabilities&lt;/text&gt;
&lt;text x=&quot;485&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;sources from creditors (credit)&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;103&quot; width=&quot;270&quot; height=&quot;107&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;485&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:20px;font-weight:600&quot;&gt;Equity&lt;/text&gt;
&lt;text x=&quot;485&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;sources from owners (credit)&lt;/text&gt;
&lt;rect x=&quot;366&quot; y=&quot;162&quot; width=&quot;114&quot; height=&quot;36&quot; rx=&quot;7&quot; style=&quot;fill:var(--paper);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;423&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;+ Revenue&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;162&quot; width=&quot;114&quot; height=&quot;36&quot; rx=&quot;7&quot; style=&quot;fill:var(--paper);stroke:var(--acc)&quot;/&gt;
&lt;text x=&quot;547&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;− Expenses&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Revenues and expenses live «inside» equity: this is why revenues increase on the credit side, like equity, while expenses (which reduce it) increase on the debit side.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Journal → Ledger → Trial balance&lt;/h3&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 150&quot; role=&quot;img&quot; aria-label=&quot;Flow from journal to ledger to trial balance&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;95&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Journal&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;22&quot; y=&quot;68&quot;&gt;01/11 Checking   1,500&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;84&quot;&gt;  Owner&#x27;s Equity  1,500&lt;/text&gt;&lt;text x=&quot;22&quot; y=&quot;104&quot;&gt;02/11 Rent         500&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;120&quot;&gt;  Checking    500&lt;/text&gt;&lt;/g&gt;
&lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Ledger&lt;/text&gt;
&lt;path d=&quot;M255,62 H385 M320,62 V120&quot; style=&quot;stroke:var(--ink);stroke-width:2&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:10.5px&quot;&gt;Checking Account&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;262&quot; y=&quot;80&quot;&gt;1,500&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;80&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;96&quot;&gt;75&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;112&quot;&gt;…&lt;/text&gt;&lt;/g&gt;
&lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;110&quot; rx=&quot;10&quot; style=&quot;fill:var(--card);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;545&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:18px;font-weight:600&quot;&gt;Trial balance&lt;/text&gt;
&lt;g style=&quot;font-size:10.5px&quot;&gt;&lt;text x=&quot;472&quot; y=&quot;70&quot;&gt;Checking&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;70&quot;&gt;190&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;86&quot;&gt;Owners&#x27; Equity&lt;/text&gt;&lt;text x=&quot;605&quot; y=&quot;86&quot;&gt;1,500&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;102&quot;&gt;…&lt;/text&gt;&lt;text x=&quot;472&quot; y=&quot;120&quot; style=&quot;font-weight:700&quot;&gt;Totals 1,500 = 1,500&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M183,75 H230&quot; style=&quot;stroke:var(--acc);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;path d=&quot;M408,75 H455&quot; style=&quot;stroke:var(--acc);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The same amounts, arranged in three different ways.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;dl class=&quot;gl&quot;&gt;
&lt;dt&gt;Journal&lt;/dt&gt;&lt;dd&gt;one line — or a group of lines — per transaction, in &lt;strong&gt;date order&lt;/strong&gt;. Each record is called a &lt;em class=&quot;t&quot;&gt;journal entry&lt;/em&gt;.&lt;/dd&gt;
&lt;dt&gt;Ledger / T-accounts&lt;/dt&gt;&lt;dd&gt;the same amounts &lt;strong&gt;arranged by account&lt;/strong&gt;: each account has a debit side (left) and a credit side (right).&lt;/dd&gt;
&lt;dt&gt;Trial balance&lt;/dt&gt;&lt;dd&gt;the list of the &lt;strong&gt;balances&lt;/strong&gt; of all accounts; if total debit balances do not equal total credit balances, there is an error somewhere.&lt;/dd&gt;
&lt;/dl&gt;
&lt;p&gt;Note: a trial balance that balances does not guarantee that everything is correct. If you post a purchase to the wrong account, or omit an entire transaction, the totals still agree. This is why the slides suggest checking the &lt;strong&gt;account&lt;/strong&gt; first (is the type right?), then the &lt;strong&gt;side&lt;/strong&gt; (use or source?), and only at the end the arithmetic (slide 11).&lt;/p&gt;

&lt;h3&gt;Cash vs on account&lt;/h3&gt;
&lt;p&gt;«&lt;em class=&quot;t&quot;&gt;On account&lt;/em&gt;» / «&lt;em class=&quot;t&quot;&gt;on credit&lt;/em&gt;» (with deferred payment) means that the expense or the sale is recorded &lt;strong&gt;when the invoice is issued&lt;/strong&gt;, using &lt;em class=&quot;t&quot;&gt;Accounts Payable&lt;/em&gt; (amounts owed to suppliers) or &lt;em class=&quot;t&quot;&gt;Accounts Receivable&lt;/em&gt; (amounts owed by customers). The cash movement is recorded &lt;strong&gt;later&lt;/strong&gt;, when it takes place.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Timeline of a purchase on account&quot;&gt;
&lt;path d=&quot;M30,85 H610&quot; style=&quot;stroke:var(--rule);stroke-width:3&quot;/&gt;
&lt;circle cx=&quot;140&quot; cy=&quot;85&quot; r=&quot;9&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;circle cx=&quot;480&quot; cy=&quot;85&quot; r=&quot;9&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Invoice received&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Dr Phone Service 150&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Cr Accounts Payable 150&lt;/text&gt;
&lt;text x=&quot;140&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;the expense arises here&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Payment&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Dr Accounts Payable 150&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Cr Checking Account 150&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--muted)&quot;&gt;cash goes out, no new expense&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Example built on the phone bill from exercise 2 (the payment is hypothetical).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · the rules&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;You pay rent by check: which account is debited?&lt;/summary&gt;&lt;div&gt;Rent (expense). The rent is the &lt;em&gt;use&lt;/em&gt; of the money; the &lt;em&gt;source&lt;/em&gt; is the Checking Account, which is credited and decreases.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why do revenues increase with a credit?&lt;/summary&gt;&lt;div&gt;Because they increase equity, which increases on the credit side. Revenues are a «source» of resources, like the capital contributed by the owners.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The trial balance balances. Can you be sure there are no errors?&lt;/summary&gt;&lt;div&gt;No. It still balances if you use the wrong account with the right amount, omit an entire transaction or swap two accounts of the same type. It only proves that debits = credits.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es1&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Exercise 1 · Table 1 (November)&lt;/span&gt;
&lt;h2&gt;Use and source: the first entries&lt;/h2&gt;
&lt;p&gt;Seven November transactions of a small web business, all &lt;strong&gt;in cash&lt;/strong&gt; (paid by check from the current account, the &lt;em class=&quot;t&quot;&gt;Checking Account&lt;/em&gt;). Task: for each line identify the &lt;em&gt;use&lt;/em&gt; (debit) and the &lt;em&gt;source&lt;/em&gt; (credit), then write the journal entry (date, description, debit, credit).&lt;/p&gt;
&lt;p&gt;A hidden clue: the November &lt;em&gt;trial balance&lt;/em&gt; already provided in exercise 4 (slide 7) reveals the account names to use. The phone/fax (75) and the printer (150) go to &lt;strong&gt;Office Equipment&lt;/strong&gt; = 225; the server parts to &lt;strong&gt;Computer Hardware&lt;/strong&gt; = 500.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;t1&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;th&gt;Acquisition / Use (Debit)&lt;/th&gt;&lt;th&gt;Source (Credit)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;$&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Owner invested and deposited $1,500 into the Business Checking Account&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account &lt;small&gt;(A↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Owner&#x27;s Equity &lt;small&gt;(OE↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Paid Rent with Check #100&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Rent &lt;small&gt;(E↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account &lt;small&gt;(A↓)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Bought Office Phone/Fax with Check #101&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Office Equipment &lt;small&gt;(A↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Used Check #102 to buy new Printer&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Office Equipment &lt;small&gt;(A↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Bought Office Supplies with Check #103&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Office Supplies &lt;small&gt;(E↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Bought parts for Server with Check #104&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Computer Hardware &lt;small&gt;(A↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Bank Charges deducted from Checking Account&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Bank Charges &lt;small&gt;(E↑)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;button data-revealall=&quot;t1&quot;&gt;Show all solutions&lt;/button&gt;
&lt;h3&gt;What happens to the current account&lt;/h3&gt;
&lt;p&gt;One inflow (the owner&#x27;s capital) and six outflows. The closing balance, 190, is exactly the one in the November trial balance on slide 7: the reconstruction reconciles.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;wfNov&quot; viewBox=&quot;0 0 640 240&quot; role=&quot;img&quot; aria-label=&quot;Checking Account balance over November&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Waterfall of the Checking Account balance, November. Green = inflow (debit), terracotta = outflow (credit).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Asset or expense? The key question of the exercise&lt;/h4&gt;
&lt;p&gt;The phone, the printer and the server parts last for more than one period: they are &lt;strong&gt;assets&lt;/strong&gt;, resources that remain in the business. Rent, stationery (&lt;em&gt;office supplies&lt;/em&gt;, used up quickly) and bank charges are &lt;strong&gt;expenses&lt;/strong&gt;: resources consumed immediately. Both are debited, but they end up in different statements: assets in the &lt;em&gt;balance sheet&lt;/em&gt;, expenses in the &lt;em&gt;income statement&lt;/em&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Write the journal entry for transaction 2.&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Nov XX · Paid rent, check #100 — Dr Rent 500 / Cr Checking Account 500&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the owner&#x27;s deposit not revenue?&lt;/summary&gt;&lt;div&gt;Because it does not arise from operating activities with customers: it is a capital contribution. It goes to Owner&#x27;s Equity, not to Sales.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the Checking balance at the end of November, and on which side?&lt;/summary&gt;&lt;div&gt;190 debit: 1,500 − (500 + 75 + 150 + 75 + 500 + 10).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es2&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Exercise 2 · Table 2 (December)&lt;/span&gt;
&lt;h2&gt;On account and multi-line entries&lt;/h2&gt;
&lt;p&gt;December brings two new features. The utility bills and the credit card statement are &lt;strong&gt;received but not yet paid&lt;/strong&gt;: they are recorded &lt;em&gt;on account&lt;/em&gt;, with &lt;em class=&quot;t&quot;&gt;Accounts Payable&lt;/em&gt; as the source. The card statement groups seven different expenses: it becomes a single &lt;em class=&quot;t&quot;&gt;multi-line entry&lt;/em&gt; (compound entry), with several accounts debited and a single credit of 930.&lt;/p&gt;

&lt;tr&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;Deposited check for Advertising Space on site&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Checking Account&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Sales &lt;small&gt;(R)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;Received Phone Bill&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Phone Service &lt;small&gt;(E)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span&gt;Accounts Payable &lt;small&gt;(L)&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150&lt;/td&gt;&lt;/tr&gt;

&lt;p class=&quot;src&quot;&gt;The account names are those of the T-accounts on slide 6 and of the December trial balance on slide 7.&lt;/p&gt;

&lt;h3&gt;Anatomy of the credit card statement&lt;/h3&gt;
&lt;p&gt;The seven items add up to exactly 930: this is the check that the multi-line entry balances. Two items (the desk and the server parts) are &lt;strong&gt;assets&lt;/strong&gt;, the other five are &lt;strong&gt;expenses&lt;/strong&gt;: even though they arrive on the same document, each goes to its own account.&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 130&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of the 930 statement&quot;&gt;
&lt;g id=&quot;ccbar&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Proportional bar of the statement items (930 = 100%). Slate = asset, terracotta = expense.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;The cash balance in December&lt;/h3&gt;
&lt;p&gt;The bills and the card expenses &lt;strong&gt;do not affect&lt;/strong&gt; the current account: only the partial payment of 500 does (transaction 15). Starting from November&#x27;s 190, the account closes December at 550.&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;wfDec&quot; viewBox=&quot;0 0 640 240&quot; role=&quot;img&quot; aria-label=&quot;Checking Account balance over December&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Waterfall of the Checking Account balance in December, starting from the November balance.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Why the credit card is Accounts Payable&lt;/h4&gt;
&lt;p&gt;When you use the card, the issuing company pays on your behalf: you owe it money. The slides record everything when the statement arrives (slide 3: «record the expense … when the bill is issued»), with &lt;em&gt;Accounts Payable&lt;/em&gt; as the source. The payment in transaction 15 reduces the liability (debit AP) and cash (credit Checking). Still outstanding: 930 − 500 = &lt;strong&gt;430&lt;/strong&gt; on the card, plus 250 in bills: total AP &lt;strong&gt;680&lt;/strong&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Does the electricity bill received in transaction 13 reduce cash?&lt;/summary&gt;&lt;div&gt;No. It gives rise to an expense (Electric Service, debit) and a liability (Accounts Payable, credit). Cash will move only when you pay it.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How many accounts appear in journal entry no. 14?&lt;/summary&gt;&lt;div&gt;Eight: seven debited (CC Fees &amp;amp; Int, Office Furniture, Fuel, Subscriptions, Meals, Website Hosting, Computer Hardware) and one credited (Accounts Payable 930).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is the payment in transaction 15 an expense?&lt;/summary&gt;&lt;div&gt;No: it partly settles a liability already recorded. The expenses were already recognised in transaction 14.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es3&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Exercise 3 · T-accounts&lt;/span&gt;
&lt;h2&gt;From the journal to the ledger&lt;/h2&gt;
&lt;p&gt;A &lt;em class=&quot;t&quot;&gt;T-account&lt;/em&gt; is an account drawn as a T: the name at the top, &lt;strong&gt;debits on the left&lt;/strong&gt;, &lt;strong&gt;credits on the right&lt;/strong&gt;. Each journal line is transferred (&lt;em&gt;posting&lt;/em&gt;) to the corresponding account; the &lt;strong&gt;balance&lt;/strong&gt; is the difference between the two sides, written on the larger side.&lt;/p&gt;
&lt;div class=&quot;box tint-ochre&quot;&gt;&lt;small&gt;&lt;strong&gt;Note on the text of slide 6.&lt;/strong&gt; The instructions say «December transactions from Tables 1 and 2», but Table 1 contains November. The T-accounts listed (Checking, Owner&#x27;s Equity, Computer Hardware, Bank Charges, Office Furniture, Repairs &amp;amp; Maintenance, Sales, Accounts Payable, Phone, Electric, Credit Card Fees, Fuel, Subscriptions, Meals, Website Hosting) are precisely the &lt;strong&gt;December&lt;/strong&gt; ones: Rent, Office Supplies and Office Equipment are not there. Here you can view December, November and the cumulative figures.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;taPer&quot; role=&quot;group&quot; aria-label=&quot;T-account period&quot;&gt;&lt;button data-v=&quot;D&quot; aria-pressed=&quot;true&quot;&gt;December (#8–16)&lt;/button&gt;&lt;button data-v=&quot;N&quot;&gt;November (#1–7)&lt;/button&gt;&lt;button data-v=&quot;ALL&quot;&gt;Cumulative to 31 Dec&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--slate)&quot;&gt;Asset&lt;/span&gt;&lt;span style=&quot;--c:var(--brick)&quot;&gt;Liability&lt;/span&gt;&lt;span style=&quot;--c:var(--sage)&quot;&gt;Equity&lt;/span&gt;&lt;span style=&quot;--c:var(--ochre)&quot;&gt;Revenue&lt;/span&gt;&lt;span style=&quot;--c:var(--acc)&quot;&gt;Expense&lt;/span&gt;&lt;span class=&quot;muted&quot;&gt;· the small grey number is the transaction no.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tacc&quot; id=&quot;tacc&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Reading a T-account&lt;/h4&gt;
&lt;p&gt;Checking Account in December: on the left 1,100 (#8) and 500 (#11), on the right 700, 25, 500, 15. Debits 1,600 − credits 1,240 = &lt;strong&gt;debit balance 360&lt;/strong&gt; (the December change). Adding November&#x27;s 190 gives 550. Accounts Payable: on the right 150 + 100 + 930, on the left 500 → &lt;strong&gt;credit balance 680&lt;/strong&gt;, the amount the business still owes.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 3&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;On which side of the Sales T-account does transaction 11 appear?&lt;/summary&gt;&lt;div&gt;On the right (credit): revenues increase on the credit side.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Office Furniture in December: which postings, and what balance?&lt;/summary&gt;&lt;div&gt;Debit 700 (#9, chair) + 245 (#14, desk paid by card) = debit balance 945.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does Computer Hardware have a movement in December?&lt;/summary&gt;&lt;div&gt;Because of the 400 of server parts paid by credit card (#14). Added to November&#x27;s 500, they make 900 at year-end.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es4&quot; class=&quot;part slate&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 1 · Exercise 4 · Trial balance&lt;/span&gt;
&lt;h2&gt;The trial balance: December and cumulative&lt;/h2&gt;
&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;trial balance&lt;/em&gt; lists the balances of all accounts in columns: debit balances on the left, credit balances on the right. Slide 7 already gives the &lt;strong&gt;November&lt;/strong&gt; one (totals 1,500 = 1,500) and asks you to prepare the &lt;strong&gt;December&lt;/strong&gt; one, then to &lt;strong&gt;combine&lt;/strong&gt; the balances of the two months into a trial balance at 31 December.&lt;/p&gt;
&lt;div class=&quot;tab-btns&quot; id=&quot;tbPer&quot; role=&quot;group&quot; aria-label=&quot;Trial balance period&quot;&gt;&lt;button data-v=&quot;N&quot;&gt;November (given)&lt;/button&gt;&lt;button data-v=&quot;D&quot; aria-pressed=&quot;true&quot;&gt;December&lt;/button&gt;&lt;button data-v=&quot;ALL&quot;&gt;Cumulative to 31 Dec&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tb&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;tbChk&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figure&gt;&lt;svg id=&quot;tbBars&quot; viewBox=&quot;0 0 640 120&quot; role=&quot;img&quot; aria-label=&quot;Comparison of total debits and credits&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;The two bars must be the same length.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-slate&quot;&gt;
&lt;h4&gt;Combining two periods&lt;/h4&gt;
&lt;p&gt;The cumulative figures are obtained by adding, account by account, the balances of the two months (with sign: debit +, credit −). Examples: Checking 190 + 360 = 550; Owners&#x27; Equity 1,500 + 1,100 = 2,600; Computer Hardware 500 + 400 = 900. The December template on the slide has no &lt;strong&gt;Rent&lt;/strong&gt; line, because no rent is paid in December: it must be added in the cumulative figures (500).&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the total of the December trial balance?&lt;/summary&gt;&lt;div&gt;2,280 = 2,280. Credits: Accounts Payable 680 + Owners&#x27; Equity 1,100 + Sales 500.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;And of the cumulative trial balance at 31 December?&lt;/summary&gt;&lt;div&gt;3,780 = 3,780 (credits: AP 680 + Equity 2,600 + Sales 500).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Office Equipment has a zero balance in December: why does it stay at 225 in the cumulative figures?&lt;/summary&gt;&lt;div&gt;Because it is an asset bought in November that is still in the business: the balance of a balance-sheet account is carried forward from one period to the next.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es5&quot; class=&quot;part brick&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Exercise 5 · «The Library»&lt;/span&gt;
&lt;h2&gt;From ten transactions to the financial statements&lt;/h2&gt;
&lt;p&gt;A bookshop is set up on 1 January and carries out ten transactions during the year. Task: classify each account as &lt;strong&gt;A&lt;/strong&gt; (asset), &lt;strong&gt;L&lt;/strong&gt; (liability), &lt;strong&gt;OE&lt;/strong&gt; (owners&#x27; equity), &lt;strong&gt;R&lt;/strong&gt; (revenue) or &lt;strong&gt;E&lt;/strong&gt; (expense); write the journal; prepare the &lt;em class=&quot;t&quot;&gt;income statement&lt;/em&gt; and the &lt;em class=&quot;t&quot;&gt;balance sheet&lt;/em&gt; at 31 December.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Transaction&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Jan 1&lt;/td&gt;&lt;td&gt;Incorporation; share capital 20,000: the shareholders contribute cash 16,000 and a building worth 4,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Mar 15&lt;/td&gt;&lt;td&gt;Buys land for 6,000: 2,000 in cash, 4,000 payable by 15 September&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Jun 3&lt;/td&gt;&lt;td&gt;Buys books for 2,000, payment due by 30 June&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Jun 8&lt;/td&gt;&lt;td&gt;Sells half of the books for 1,200, payment deferred to 15 June (&lt;em&gt;perpetual inventory&lt;/em&gt;)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Jun 30&lt;/td&gt;&lt;td&gt;Pays the amount owed for the books&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Jun 30&lt;/td&gt;&lt;td&gt;Pays salaries of 100 in cash&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Jul 31&lt;/td&gt;&lt;td&gt;Issues bonds for 2,000, receiving cash&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Sept 15&lt;/td&gt;&lt;td&gt;Pays the amount owed for the land&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;Oct 30&lt;/td&gt;&lt;td&gt;Sells the land for 7,000 in cash&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;Dec 31&lt;/td&gt;&lt;td&gt;Depreciates the building by 5% of its value&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Step 1 · Classify the accounts&lt;/h3&gt;
&lt;p&gt;Tap each account to see its type.&lt;/p&gt;
&lt;div class=&quot;chips&quot;&gt;
&lt;button class=&quot;chip&quot;&gt;Cash&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Building&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Share capital&lt;b&gt;OE&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Land&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Payable for land&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Inventory&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accounts payable&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accounts receivable&lt;b&gt;A&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Sales revenue&lt;b&gt;R&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Cost of goods sold&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Salaries expense&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Bonds payable&lt;b&gt;L&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Gain on sale of land&lt;b&gt;R&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Depreciation expense&lt;b&gt;E&lt;/b&gt;&lt;/button&gt;&lt;button class=&quot;chip&quot;&gt;Accumulated depreciation&lt;b&gt;contra-A&lt;/b&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;p class=&quot;t-it&quot;&gt;&lt;em&gt;Accumulated depreciation&lt;/em&gt; is a contra-asset account: it has a credit balance and is deducted from the carrying amount of the building.&lt;/p&gt;

&lt;h3&gt;Step 2 · The journal&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;1 · Jan 1 — incorporation with a mixed contribution&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 16,000 · Dr Building 4,000 / Cr Share capital 20,000&lt;/span&gt;&lt;br&gt;Capital can also be contributed in kind: the building is an asset contributed by the shareholders.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · Mar 15 — land partly paid&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Land 6,000 / Cr Cash 2,000 · Cr Payable for land 4,000&lt;/span&gt;&lt;br&gt;The full cost of the land, 6,000, is recognised immediately, even though only one third of it is paid.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · Jun 3 — books bought on account&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Inventory 2,000 / Cr Accounts payable 2,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · Jun 8 — sale under perpetual inventory (two entries)&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Accounts receivable 1,200 / Cr Sales revenue 1,200&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cost of goods sold 1,000 / Cr Inventory 1,000&lt;/span&gt;&lt;br&gt;Under the &lt;em class=&quot;t&quot;&gt;perpetual inventory&lt;/em&gt; system, inventory is updated at every sale: the &lt;em class=&quot;t&quot;&gt;cost of goods sold&lt;/em&gt; (COGS) is recognised immediately, equal to the cost of the half sold, 2,000 ÷ 2.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;5 · Jun 30 — payment to suppliers&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Accounts payable 2,000 / Cr Cash 2,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;6 · Jun 30 — salaries&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Salaries expense 100 / Cr Cash 100&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;7 · Jul 31 — bond issue&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 2,000 / Cr Bonds payable 2,000&lt;/span&gt;&lt;br&gt;A bond loan is a liability, not equity: it must be repaid. The text mentions no interest, so none is recorded.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;8 · Sept 15 — the land is paid for&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Payable for land 4,000 / Cr Cash 4,000&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;9 · Oct 30 — sale of the land at a gain&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 7,000 / Cr Land 6,000 · Cr Gain on sale of land 1,000&lt;/span&gt;&lt;br&gt;The land is derecognised at its cost; the difference is a &lt;em class=&quot;t&quot;&gt;gain&lt;/em&gt;, income that does not arise from ordinary activities (selling books).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;10 · Dec 31 — depreciation&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Depreciation expense 200 / Cr Accumulated depreciation 200&lt;/span&gt;&lt;br&gt;&lt;em class=&quot;t&quot;&gt;Depreciation&lt;/em&gt; allocates the cost of a long-lived asset over the years in which it is used: 5% × 4,000 = 200. Land is not depreciated.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Step 3 · The financial statements at 31 December&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tab-btns&quot;&gt;&lt;button data-t=&quot;lib-is&quot; aria-selected=&quot;true&quot;&gt;Income statement&lt;/button&gt;&lt;button data-t=&quot;lib-bs&quot; aria-selected=&quot;false&quot;&gt;Balance sheet&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;lib-is&quot;&gt;
&lt;table&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Sales revenue&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr style=&quot;font-weight:600&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Salaries expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(100)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Depreciation expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(200)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gain on sale of land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The profit is entirely due to the gain on the land: without it, the bookshop business would close at −100.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;lib-bs&quot; hidden&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16,900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,200&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Building 4,000 − acc. dep. 200&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,800&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Liabilities + Equity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Bonds payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Net income (retained)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&amp;nbsp;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total L + E&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;/div&gt;
&lt;p&gt;Cash: 16,000 − 2,000 − 2,000 − 100 + 2,000 − 4,000 + 7,000 = 16,900.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 280&quot; role=&quot;img&quot; aria-label=&quot;The Library&#x27;s balance sheet drawn to scale&quot;&gt;
&lt;text x=&quot;160&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;Assets 22,900&lt;/text&gt;
&lt;text x=&quot;480&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; style=&quot;font-size:16px;font-weight:600&quot;&gt;L + E 22,900&lt;/text&gt;
&lt;rect x=&quot;80&quot; y=&quot;32&quot; width=&quot;160&quot; height=&quot;162&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--paper)&quot;&gt;Cash 16,900&lt;/text&gt;
&lt;rect x=&quot;80&quot; y=&quot;194&quot; width=&quot;160&quot; height=&quot;11.5&quot; style=&quot;fill:var(--slate);opacity:.75&quot;/&gt;&lt;rect x=&quot;80&quot; y=&quot;205.5&quot; width=&quot;160&quot; height=&quot;9.6&quot; style=&quot;fill:var(--slate);opacity:.55&quot;/&gt;
&lt;rect x=&quot;80&quot; y=&quot;215&quot; width=&quot;160&quot; height=&quot;36.5&quot; style=&quot;fill:var(--slate);opacity:.4&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;238&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:12px&quot;&gt;Building net 3,800&lt;/text&gt;
&lt;text x=&quot;74&quot; y=&quot;203&quot; text-anchor=&quot;end&quot; style=&quot;font-size:11px&quot;&gt;AR 1,200&lt;/text&gt;&lt;text x=&quot;74&quot; y=&quot;216&quot; text-anchor=&quot;end&quot; style=&quot;font-size:11px&quot;&gt;Inventory 1,000&lt;/text&gt;
&lt;rect x=&quot;400&quot; y=&quot;32&quot; width=&quot;160&quot; height=&quot;19.2&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;46&quot; style=&quot;font-size:11px&quot;&gt;Bonds 2,000&lt;/text&gt;
&lt;rect x=&quot;400&quot; y=&quot;51.2&quot; width=&quot;160&quot; height=&quot;191.7&quot; style=&quot;fill:var(--sage);opacity:.85&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:13px;fill:var(--paper)&quot;&gt;Share capital 20,000&lt;/text&gt;
&lt;rect x=&quot;400&quot; y=&quot;242.9&quot; width=&quot;160&quot; height=&quot;8.6&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;566&quot; y=&quot;251&quot; style=&quot;font-size:11px&quot;&gt;Net income 900&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Heights proportional to the amounts: the two columns are equal, as the accounting equation requires.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;box tint-brick&quot;&gt;&lt;small&gt;&lt;strong&gt;Assumption to check at the debriefing.&lt;/strong&gt; The text says that the customer in transaction 4 will pay on 15 June, but there is no line recording the collection. Here the collection has &lt;strong&gt;not&lt;/strong&gt; been recorded (AR remains 1,200). If it is recorded (Dr Cash / Cr AR 1,200), cash becomes 18,100, AR falls to 0 and total assets remain 22,900.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 5&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does transaction 4 require two entries?&lt;/summary&gt;&lt;div&gt;Under the perpetual inventory system, the revenue (1,200) is recorded and, at the same time, the outflow from inventory at cost (1,000 → COGS).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is the sale of the land for 7,000 revenue of 7,000?&lt;/summary&gt;&lt;div&gt;No. The land is removed from the balance sheet at cost, 6,000; only the gain of 1,000 enters the income statement.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;At what amount is the building shown in the balance sheet?&lt;/summary&gt;&lt;div&gt;3,800, its &lt;em&gt;net book value&lt;/em&gt;: cost of 4,000 less accumulated depreciation of 200.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es6&quot; class=&quot;part ochre&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Exercise 6 · The retail shop&lt;/span&gt;
&lt;h2&gt;The accounting equation in a table&lt;/h2&gt;
&lt;p&gt;Same logic, without debits and credits: each transaction is a row with &lt;strong&gt;+&lt;/strong&gt; and &lt;strong&gt;−&lt;/strong&gt; in the asset, liability, capital and profit columns. After every row, &lt;em&gt;Assets = Liabilities + Capital + Profit&lt;/em&gt; must still hold. The starting point is initial capital of € 100,000.&lt;/p&gt;
&lt;p class=&quot;src&quot;&gt;The instructions on slide 9 are partly covered by the text of transaction 7; they read «fill a table with columns Cash, Receivables, … Liabilities, Owner&#x27;s capital, Profit, one row per transaction, with + and −. No debits and credits: only the accounting equation». Here the other assets are split into Inventory and Property.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;eqStep&quot;&gt;Transaction&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;eqStep&quot; min=&quot;0&quot; max=&quot;7&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;eqOut&quot; for=&quot;eqStep&quot;&gt;0&lt;/output&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;eqTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;eqT&quot; style=&quot;font-size:.84rem&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg id=&quot;eqSvg&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Assets versus liabilities plus capital&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Move the slider: the two columns change composition but always remain the same height.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;box tint-ochre&quot;&gt;
&lt;h4&gt;The key point: the sale in transaction 4&lt;/h4&gt;
&lt;p&gt;One third of the goods, which had cost 45,000, is sold: goods worth &lt;strong&gt;15,000&lt;/strong&gt; leave inventory and a receivable of &lt;strong&gt;35,000&lt;/strong&gt; arises. The difference, &lt;strong&gt;20,000&lt;/strong&gt;, is profit. A single transaction decreases one asset, increases another and increases equity. In transaction 6, by contrast, the collection of 16,000 merely shifts value from Receivables to Cash: profit does not change.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 6&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Which transactions change profit?&lt;/summary&gt;&lt;div&gt;Only 4 (+20,000) and 5 (−4,000, wages). Final profit 16,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are total assets at the end?&lt;/summary&gt;&lt;div&gt;191,000 = Cash 67,000 + Receivables 19,000 + Inventory 55,000 + Property 50,000 = Liabilities 75,000 + Capital 100,000 + Profit 16,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Write transaction 7 with debits and credits.&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;mono&quot;&gt;Dr Inventory 25,000 / Cr Accounts payable 25,000&lt;/span&gt; — an asset increases, a liability increases: the equation stays in balance.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;es7&quot; class=&quot;part brick&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Set 2 · Exercise 7 · «Bergamo Bikes S.r.l.»&lt;/span&gt;
&lt;h2&gt;Year-end adjustments: paying is not consuming&lt;/h2&gt;
&lt;p&gt;The first year of a bicycle shop. After the eight transactions of the year, &lt;em class=&quot;t&quot;&gt;year-end adjustments&lt;/em&gt; are required: cost of goods sold and closing inventory, depreciation, &lt;em class=&quot;t&quot;&gt;accrued interest&lt;/em&gt; (interest expense incurred but not yet paid) and &lt;em class=&quot;t&quot;&gt;prepaid rent&lt;/em&gt; (rent paid in advance for a future period). The hint on slide 10 says it all: &lt;strong&gt;«the difference between paying and consuming is the whole point of this exercise»&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;box key&quot;&gt;
&lt;h4&gt;The underlying principle: accrual basis&lt;/h4&gt;
&lt;p&gt;Under &lt;em class=&quot;t&quot;&gt;accrual basis&lt;/em&gt; accounting, an expense enters the result of the year in which the resource is &lt;strong&gt;consumed&lt;/strong&gt;, and revenue the year in which it is &lt;strong&gt;earned&lt;/strong&gt;, regardless of when cash is paid or received. This is the &lt;em class=&quot;t&quot;&gt;matching principle&lt;/em&gt;: the year&#x27;s revenues are matched with the costs incurred to generate them.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 230&quot; role=&quot;img&quot; aria-label=&quot;Timeline of rent and interest&quot;&gt;
&lt;text x=&quot;20&quot; y=&quot;22&quot; class=&quot;serif&quot; style=&quot;font-size:15px;font-weight:600&quot;&gt;Year 1&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;22&quot; class=&quot;serif&quot; style=&quot;font-size:15px;font-weight:600&quot;&gt;Year 2&lt;/text&gt;
&lt;line x1=&quot;420&quot; y1=&quot;10&quot; x2=&quot;420&quot; y2=&quot;220&quot; style=&quot;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;218&quot; style=&quot;font-size:11px;fill:var(--acc)&quot;&gt;31 Dec&lt;/text&gt;
&lt;g style=&quot;font-size:10px;fill:var(--muted)&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;44&quot;&gt;Jan&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;44&quot;&gt;Jul&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;44&quot;&gt;Oct&lt;/text&gt;&lt;text x=&quot;430&quot; y=&quot;44&quot;&gt;Jan&lt;/text&gt;&lt;text x=&quot;605&quot; y=&quot;44&quot;&gt;Jun/Sep&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;20&quot; y=&quot;74&quot; style=&quot;font-size:12px;font-weight:600&quot;&gt;Rent&lt;/text&gt;
&lt;rect x=&quot;215&quot; y=&quot;82&quot; width=&quot;205&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--acc);opacity:.85&quot;/&gt;&lt;text x=&quot;317&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--paper)&quot;&gt;consumed: 3,000 → Rent expense&lt;/text&gt;
&lt;rect x=&quot;420&quot; y=&quot;82&quot; width=&quot;205&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate);opacity:.7&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--paper)&quot;&gt;prepaid: 3,000 → Prepaid rent (A)&lt;/text&gt;
&lt;text x=&quot;215&quot; y=&quot;128&quot; style=&quot;font-size:10.5px;fill:var(--muted)&quot;&gt;1 Jul: 6,000 paid for 12 months&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;160&quot; style=&quot;font-size:12px;font-weight:600&quot;&gt;Interest&lt;/text&gt;
&lt;rect x=&quot;320&quot; y=&quot;168&quot; width=&quot;100&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--acc);opacity:.85&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px;fill:var(--paper)&quot;&gt;accrued 250&lt;/text&gt;
&lt;rect x=&quot;420&quot; y=&quot;168&quot; width=&quot;205&quot; height=&quot;30&quot; rx=&quot;4&quot; style=&quot;fill:var(--rule)&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:11px&quot;&gt;year 2: 750 (1,000 paid on 30/9)&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;214&quot; style=&quot;font-size:10.5px;fill:var(--muted)&quot;&gt;1 Oct: loan 20,000 at 5%&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Rent: paid in full, half consumed → half is an expense, half remains an asset. Interest: 3 months consumed but not yet paid → expense + liability (accrued).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div data-tabs&gt;
&lt;div class=&quot;tab-btns&quot;&gt;&lt;button data-t=&quot;bb-a&quot; aria-selected=&quot;true&quot;&gt;a) Journal&lt;/button&gt;&lt;button data-t=&quot;bb-b&quot; aria-selected=&quot;false&quot;&gt;b) Adjustments&lt;/button&gt;&lt;button data-t=&quot;bb-c&quot; aria-selected=&quot;false&quot;&gt;c) Statements&lt;/button&gt;&lt;button data-t=&quot;bb-d&quot; aria-selected=&quot;false&quot;&gt;d) Assessment&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;bb-a&quot;&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Transaction&lt;/th&gt;&lt;th&gt;Journal entry&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Shareholders contribute cash 50,000&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 50,000 / Cr Share capital 50,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;1 Oct: bank loan 20,000, 5% per year, paid every 30 September&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 20,000 / Cr Bank loan 20,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Equipment 24,000 cash; useful life 6 years, no residual value&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Equipment 24,000 / Cr Cash 24,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;100 bikes at 300 = 30,000 on account&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Inventory 30,000 / Cr Accounts payable 30,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;70 bikes at 500 = 35,000: 20,000 cash, 15,000 on account&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cash 20,000 · Dr Accounts receivable 15,000 / Cr Sales 35,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Pays suppliers 18,000&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Accounts payable 18,000 / Cr Cash 18,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;1 Jul: rent 6,000 for 12 months in advance&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Prepaid rent 6,000 / Cr Cash 6,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Wages 8,000&lt;/td&gt;&lt;td class=&quot;rv&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;mono&quot;&gt;Dr Wages expense 8,000 / Cr Cash 8,000&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;t-it&quot;&gt;In transaction 7 the rent is recorded as an asset (Prepaid rent) and then adjusted at year-end. An equivalent method: debit the full 6,000 to Rent expense and at year-end transfer 3,000 to Prepaid rent. The final result is identical.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;bb-b&quot; hidden&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;strong&gt;Cost of goods sold and closing inventory.&lt;/strong&gt; 70 bikes sold × 300 = &lt;strong&gt;21,000&lt;/strong&gt; of cost; 30 × 300 = &lt;strong&gt;9,000&lt;/strong&gt; remain in inventory.&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Cost of goods sold 21,000 / Cr Inventory 21,000&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Depreciation.&lt;/strong&gt; 24,000 ÷ 6 years = &lt;strong&gt;4,000&lt;/strong&gt; per year (&lt;em&gt;straight-line&lt;/em&gt; method).&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Depreciation expense 4,000 / Cr Accumulated depreciation 4,000&lt;/span&gt;&lt;br&gt;&lt;small&gt;Assumption: a full year, since the purchase date is not given. Had the purchase taken place during the year, the charge would be pro-rated by months.&lt;/small&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Accrued interest.&lt;/strong&gt; 20,000 × 5% × 3/12 (October–December) = &lt;strong&gt;250&lt;/strong&gt;, accrued but payable on 30 September.&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Interest expense 250 / Cr Accrued interest payable 250&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Prepaid rent.&lt;/strong&gt; Of the 12 months paid, 6 (Jul–Dec) have been consumed: &lt;strong&gt;3,000&lt;/strong&gt; becomes an expense, 3,000 remains an asset.&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;Dr Rent expense 3,000 / Cr Prepaid rent 3,000&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;bb-c&quot; hidden&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Income statement&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;35,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(21,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr style=&quot;font-weight:600&quot;&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;14,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Wages&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(8,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(3,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(4,000)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(250)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net loss&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1,250)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Balance sheet 31 Dec&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;34,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accounts receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;15,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Prepaid rent&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Equipment 24,000 − 4,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;81,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accounts payable (30,000 − 18,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accrued interest payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;250&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Loss of the year&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1,250)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total L + E&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;81,000&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;/div&gt;
&lt;p&gt;Cash: 50,000 + 20,000 − 24,000 + 20,000 − 18,000 − 6,000 − 8,000 = 34,000.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tab-panel&quot; id=&quot;bb-d&quot; hidden&gt;
&lt;p class=&quot;out&quot;&gt;A suggested answer: «A first year with a small accounting loss (−1,250), but with a 40% gross margin on sales: the bikes sell well, it is just that fixed costs are not yet covered; with a few more sales the business would move into profit.»&lt;/p&gt;
&lt;p&gt;Beware of the trap: looking only at cash, which closes at 34,000, the year would seem good. But the business has spent 24,000 on equipment and 6,000 on prepaid rent, has not yet paid any interest and holds 15,000 of receivables. The accrual-basis result tells a different story. The slider below shows how many more bikes would be needed.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;How many bikes are needed to break even?&lt;/h3&gt;
&lt;p&gt;Fixed costs for the first year (wages + rent + depreciation + interest) = &lt;strong&gt;15,250&lt;/strong&gt;. Each bike sold contributes a margin of &lt;em&gt;price − 300&lt;/em&gt;. Profit = q × (p − 300) − 15,250.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;bkQ&quot;&gt;Bikes sold&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bkQ&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;bkQo&quot;&gt;70&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;bkP&quot;&gt;Price&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bkP&quot; min=&quot;320&quot; max=&quot;800&quot; step=&quot;10&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;bkPo&quot;&gt;500&lt;/output&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;bkOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figure style=&quot;margin:.4rem 0&quot;&gt;&lt;svg id=&quot;bkSvg&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Profit as a function of bikes sold&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Profit line at the selected price; the dot is the current position, the hollow circle the &lt;em&gt;break-even&lt;/em&gt; point. Unsold bikes remain in inventory at cost, so they do not affect the result.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · exercise 7&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why is the 6,000 of rent not entirely an expense of year 1?&lt;/summary&gt;&lt;div&gt;Because it covers July–June: at the end of December half of the service has not yet been consumed. That 3,000 is a future right, and therefore an asset (prepaid rent).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Interest is paid only on 30 September of year 2: why record it now?&lt;/summary&gt;&lt;div&gt;Because the money was used from October to December: 250 of interest has already accrued and belongs to year 1 (expense and liability: accrued interest).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The 100 bikes cost 30,000: why is the expense in the income statement only 21,000?&lt;/summary&gt;&lt;div&gt;Only the cost of the 70 sold is charged (matching with revenues). The remaining 30 (9,000) are closing inventory, an asset.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;At €500 per bike, how many bikes are needed to break even?&lt;/summary&gt;&lt;div&gt;15,250 ÷ 200 = 76.25 → 77 bikes.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part ochre&quot;&gt;
&lt;span class=&quot;tag&quot;&gt;Further reading&lt;/span&gt;
&lt;h2&gt;Texts, standards and history&lt;/h2&gt;
&lt;p&gt;The slides for this homework &lt;strong&gt;do not cite&lt;/strong&gt; any authors, studies, textbooks or standards: they are an exercise book. The references below were selected by Claude through a web search because they cover exactly the topics of the exercises (double entry, accruals, inventory, depreciation). They are all &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;, not slide content.&lt;/p&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Luca Pacioli, &lt;em&gt;Summa de arithmetica, geometria, proportioni et proportionalità&lt;/em&gt; (Venice, 1494) &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It is the first printed description of double-entry bookkeeping, in the section «Particularis de computis et scripturis». Pacioli does not claim to have invented it: he describes merchants&#x27; practice, the «Venetian method». It matters because the rules of this homework (every amount recorded twice, debits = credits, journal and ledger) are his. The National Library of Scotland, which holds a copy, describes it as the most influential work in the history of European accounting.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.nls.uk/collections/rare-books/collections/icas/pacioli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;National Library of Scotland — Pacioli&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IASB, &lt;em&gt;Conceptual Framework for Financial Reporting&lt;/em&gt; (2018) &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It is the conceptual framework underlying IFRS: the objective of financial reporting, qualitative characteristics, definitions of asset, liability, equity, income and expense, and recognition and measurement criteria. Published in March 2018, it replaces the 2010 version; for preparers it is effective for periods beginning on or after 1 January 2020. It is not a standard and does not apply directly to individual transactions, but it provides the definitions you use in exercises 5 and 7 (what is an asset? to which period does an expense belong?).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — Conceptual Framework&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 2 &lt;em&gt;Inventories&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It is the international standard on inventories: measurement at the lower of cost and &lt;em&gt;net realisable value&lt;/em&gt;, cost formulas, and recognition of the cost of goods sold as an expense when the goods are sold. It links exercises 5, 6 and 7: the COGS and the closing inventory of the bikes are basic applications of these rules.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — IAS 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 16 &lt;em&gt;Property, Plant and Equipment&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It governs property, plant and equipment: tangible assets used for more than one period. They are recognised at cost and depreciated over their useful life; the standard also deals with disposals. It applies to the Library&#x27;s building and land (land is not depreciated) and to Bergamo Bikes&#x27; equipment (24,000 over 6 years).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation — IAS 16&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OIC 13 &lt;em&gt;Rimanenze&lt;/em&gt; (Inventories; Organismo Italiano di Contabilità) &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It is the Italian counterpart of IAS 2, for financial statements prepared under the Italian Civil Code: it is useful for comparing national practice with IFRS, a central theme of an &lt;em&gt;international&lt;/em&gt; accounting course. The link points to the 2014 text on the OIC Foundation website; the standard was subsequently updated (December 2016, 2017 amendments), so check the version currently in force on the official website.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/2014-08-05-OIC-13-Rimanenze-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC Foundation — OIC 13 (PDF, 2014 version)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OpenStax, &lt;em&gt;Principles of Accounting, Volume 1: Financial Accounting&lt;/em&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;It is a free university textbook (CC BY-NC-SA licence) that covers exactly these steps: transaction analysis, journal and ledger, trial balance, adjusting entries, the accounting cycle and merchandising. It contains many worked examples, useful for practising beyond the homework.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://openstax.org/books/principles-financial-accounting/pages/preface&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OpenStax — Principles of Financial Accounting&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
