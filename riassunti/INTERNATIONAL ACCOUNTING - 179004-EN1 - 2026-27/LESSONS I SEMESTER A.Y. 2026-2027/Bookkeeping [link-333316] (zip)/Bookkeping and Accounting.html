&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Relevance&lt;/summary&gt;&lt;div&gt;Rilevante è l&#x27;informazione che &lt;b&gt;influenza le decisioni&lt;/b&gt;: aiuta a valutare eventi passati, presenti o futuri, o conferma e corregge valutazioni passate. I bisogni cambiano tra gruppi e nel tempo; i dati storici servono da base per le previsioni. Si è rilevanti per &lt;b&gt;natura&lt;/b&gt; (una causa clamorosa, l&#x27;avvio di attività in un Paese instabile) o per &lt;b&gt;materiality&lt;/b&gt;: è &lt;span class=&quot;t&quot;&gt;material&lt;/span&gt; ciò la cui omissione o errata indicazione può influenzare le decisioni. Serve anche tempestività. &lt;span class=&quot;src&quot;&gt;slide 135–138&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Faithful representation&lt;/summary&gt;&lt;div&gt;Rappresentare fedelmente le transazioni massimizzando &lt;b&gt;completeness&lt;/b&gt; (un&#x27;omissione può rendere l&#x27;informazione fuorviante), &lt;b&gt;neutrality&lt;/b&gt; (assenza di distorsioni, aiutata da standard neutrali) e &lt;b&gt;freedom from error&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 139–140&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Comparability&lt;/summary&gt;&lt;div&gt;Coerenza nelle politiche contabili, per confrontare l&#x27;impresa nel tempo e con le altre; l&#x27;utente deve poter vedere i cambi di politica e le differenze tra imprese. &lt;span class=&quot;src&quot;&gt;slide 141&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Verifiability: substance over form e prudence&lt;/summary&gt;&lt;div&gt;Rassicura che la rappresentazione sia fedele ed è rafforzata dalla revisione indipendente. Implica la &lt;b&gt;substance over form&lt;/b&gt; (conta la realtà economica, non la forma giuridica) e la &lt;b&gt;prudence&lt;/b&gt;: cautela nelle stime (magazzino, vite utili, crediti), che però non giustifica fondi eccessivi, passività gonfiate o attività e ricavi sottovalutati. &lt;span class=&quot;src&quot;&gt;slide 142–143&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Timeliness e understandability&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Timeliness&lt;/b&gt;: l&#x27;utilità cala se l&#x27;informazione arriva tardi o a intervalli troppo lunghi. &lt;b&gt;Understandability&lt;/b&gt;: si presume un utente competente e diligente; i temi complessi non si omettono, ma troppo dettaglio è un difetto quanto troppo poco. &lt;span class=&quot;src&quot;&gt;slide 144–145&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;ext&quot;&gt;Nel &lt;b&gt;Conceptual Framework IASB 2018&lt;/b&gt; le caratteristiche &lt;em&gt;fondamentali&lt;/em&gt; sono relevance (valore predittivo e/o confermativo; la materiality ne è un aspetto) e faithful representation; comparability, verifiability, timeliness e understandability sono &lt;em&gt;enhancing&lt;/em&gt; e non rendono utile un&#x27;informazione che non lo è. La &lt;b&gt;prudence&lt;/b&gt; torna come supporto alla neutralità, la sostanza economica rientra nella faithful representation e il &lt;b&gt;costo&lt;/b&gt; è un vincolo generale. &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · Conceptual Framework 2018&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/-/media/project/conceptual-framework/fact-sheet-project-summary-and-feedback-statement/conceptual-framework-project-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB · Project summary (PDF)&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 10&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un leasing che giuridicamente è un affitto ma economicamente equivale a comprare il bene a rate: quale principio guida la contabilizzazione?&lt;/summary&gt;&lt;div&gt;Substance over form: si rappresenta la realtà economica (acquisto finanziato), non la forma giuridica.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Accantonare un fondo rischi «abbondante per sicurezza» è prudenza?&lt;/summary&gt;&lt;div&gt;No: la prudenza non giustifica fondi eccessivi né passività sopravvalutate (slide 143), che violerebbero la neutralità.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Paghi a novembre l&#x27;affitto di novembre–gennaio. Quanto costo va nell&#x27;esercizio che chiude a dicembre?&lt;/summary&gt;&lt;div&gt;Due mesi su tre (novembre e dicembre). Il terzo mese è un prepaid (risconto attivo), un asset a fine anno.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa significa che un&#x27;informazione è «material»?&lt;/summary&gt;&lt;div&gt;Che la sua omissione o errata indicazione potrebbe influenzare le decisioni degli utenti.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;standards&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 11 · Accounting practice, standards, ESG&lt;/div&gt;
&lt;h2&gt;Le regole del gioco: GAAP, standard, armonizzazione&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;GAAP&lt;/b&gt; (Generally Accepted Accounting Principles): il quadro di linee guida per la contabilità finanziaria in una data giurisdizione, cioè standard, convenzioni e regole per registrare, riassumere e redigere il bilancio. Stabiliscono: quali fatti registrare; come contabilizzarli; i criteri di valutazione di attività e passività; i criteri di presentazione; il contenuto delle note. &lt;span class=&quot;src&quot;&gt;slide 148&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting standard&lt;/b&gt;: una regola o un insieme di regole che prescrive come preparare e presentare il bilancio. Lo emana un organismo professionale nazionale o internazionale, vale per i bilanci che devono dare un &lt;span class=&quot;t&quot;&gt;true and fair view&lt;/span&gt; (rappresentazione veritiera e corretta) e opera dentro la legge, coprendo le aree in cui la legge tace. &lt;span class=&quot;src&quot;&gt;slide 149&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 380 230&quot; role=&quot;img&quot; aria-label=&quot;Rapporto tra prassi contabile e legislazione&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;110&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;37&quot; font-weight=&quot;600&quot;&gt;Accounting practice&lt;/text&gt;
&lt;rect x=&quot;110&quot; y=&quot;170&quot; width=&quot;160&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;197&quot; font-weight=&quot;600&quot;&gt;Jurisdiction (legge)&lt;/text&gt;
&lt;text x=&quot;55&quot; y=&quot;118&quot;&gt;help to&lt;/text&gt;&lt;text x=&quot;55&quot; y=&quot;134&quot;&gt;interpret&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;126&quot;&gt;integrate&lt;/text&gt;&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M110,32 H55 V100&quot;/&gt;&lt;path d=&quot;M55,142 V192 H108&quot;/&gt;&lt;path d=&quot;M270,32 H325 V110&quot;/&gt;&lt;path d=&quot;M325,135 V192 H272&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;La prassi contabile aiuta a interpretare la legge e la integra (slide 150).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;p&gt;Globalizzazione, internazionalizzazione e integrazione economica moltiplicano gli scambi e il bisogno di informazioni per decidere: tutto spinge verso l&#x27;&lt;b&gt;accounting harmonization&lt;/b&gt; (armonizzazione contabile), cioè bilanci confrontabili tra Paesi. &lt;span class=&quot;src&quot;&gt;slide 151&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;Nell&#x27;UE il passo decisivo è il &lt;b&gt;Regolamento (CE) n. 1606/2002&lt;/b&gt;, che impone gli IAS/IFRS ai bilanci consolidati delle quotate: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;. Negli USA i GAAP sono raccolti nella &lt;b&gt;FASB Accounting Standards Codification&lt;/b&gt; (vedi Per approfondire).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Non financial reporting · ESG&lt;/h3&gt;
&lt;p&gt;Le slide chiudono con la &lt;b&gt;Corporate Sustainability Reporting Directive&lt;/b&gt; (CSRD, direttiva UE 2022/2464): il reporting su temi ambientali, sociali e di governance (ESG) affianca quello finanziario. Ecco la tabella delle slide e, accanto, lo stato aggiornato. &lt;span class=&quot;src&quot;&gt;slide 152&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Nelle slide&lt;/th&gt;&lt;th&gt;Aggiornamento (fonte esterna, ottobre 2026)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A chi si applica?&lt;/td&gt;&lt;td&gt;Imprese con almeno 2 su 3: &amp;gt;250 dipendenti, &amp;gt;40 M€ di fatturato, &amp;gt;20 M€ di attivo; PMI quotate&lt;/td&gt;&lt;td&gt;La direttiva &lt;b&gt;Omnibus I (UE) 2026/470&lt;/b&gt; restringe il campo alle imprese con &lt;b&gt;più di 1.000 dipendenti e più di 450 M€ di fatturato&lt;/b&gt; (entrambi i requisiti); escluse le PMI quotate. Si applica dagli esercizi che iniziano dal 1/1/2027.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quante imprese?&lt;/td&gt;&lt;td&gt;Circa 50.000&lt;/td&gt;&lt;td&gt;Perimetro ridotto di circa l&#x27;80% secondo le stime di settore.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quali standard?&lt;/td&gt;&lt;td&gt;«EFRS»&lt;/td&gt;&lt;td&gt;Sono gli &lt;b&gt;ESRS&lt;/b&gt; (European Sustainability Reporting Standards) di EFRAG; la versione semplificata risulta adottata nel 2026, da applicare dagli esercizi 2027.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Pubblicazione e assurance&lt;/td&gt;&lt;td&gt;Nella relazione sulla gestione; certificazione di un terzo indipendente, requisiti in definizione&lt;/td&gt;&lt;td&gt;Invariati nella sostanza.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;Fonti: testo della &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CSRD su EUR-Lex&lt;/a&gt;; direttiva &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202600470&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Omnibus I 2026/470 su EUR-Lex&lt;/a&gt;; sintesi di &lt;a href=&quot;https://sustainablefutures.linklaters.com/post/102mkjf/eu-omnibus-i-directive-published-in-the-official-journal-of-the-eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Linklaters&lt;/a&gt;; stima della riduzione del perimetro: &lt;a href=&quot;https://financialregulations.eu/blog/eu-omnibus-csrd-simplification-2026&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;financialregulations.eu&lt;/a&gt;; sugli ESRS semplificati &lt;a href=&quot;https://viewpoint.pwc.com/gx/en/pwc/in-briefs/2026/ib_int202617.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC Viewpoint&lt;/a&gt;. Verifica sempre lo stato del recepimento in Italia.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 11&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che rapporto c&#x27;è tra standard contabili e legge?&lt;/summary&gt;&lt;div&gt;Gli standard operano dentro il quadro legislativo: aiutano a interpretarlo e lo integrano dove la legge tace (slide 149–150).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa spinge verso l&#x27;armonizzazione contabile?&lt;/summary&gt;&lt;div&gt;Globalizzazione, internazionalizzazione e integrazione economica: più scambi e più bisogno di informazioni confrontabili per decidere.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cinque cose che i principi contabili stabiliscono?&lt;/summary&gt;&lt;div&gt;Fatti da registrare; modalità di contabilizzazione; criteri di valutazione di attività e passività; criteri di presentazione; contenuto delle note.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick refs&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Per approfondire&lt;/div&gt;
&lt;h2&gt;Norme, standard e testi citati nelle slide&lt;/h2&gt;
&lt;p class=&quot;note&quot;&gt;Le slide non citano autori o studi accademici: i riferimenti sono norme e standard, esplicitamente (art. 2424 e 2425 c.c., GAAP, CSRD, «EFRS») o implicitamente (le definizioni di asset, liability, equity, income ed expense e le qualitative characteristics vengono dal Conceptual Framework IASB; l&#x27;elenco dei prospetti da IAS 1; le tre aree del cash flow da IAS 7). Tutto ciò che segue è &lt;b&gt;fonte esterna&lt;/b&gt;.&lt;/p&gt;

&lt;article&gt;&lt;h4&gt;Conceptual Framework for Financial Reporting (IASB, 2018)&lt;/h4&gt;
&lt;p&gt;Scopo del bilancio, caratteristiche qualitative, elementi (asset, liability, equity, income, expenses), rilevazione e misurazione. &lt;b&gt;Perché conta&lt;/b&gt;: da qui vengono le definizioni delle parti 7 e 10 e il «framework» della slide 134. &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://accaglobal.com/an/en/student/exam-support-resources/professional-exams-study-resources/strategic-business-reporting/technical-articles/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo ACCA&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;IAS 1 Presentation of Financial Statements → IFRS 18 (dal 2027)&lt;/h4&gt;
&lt;p&gt;IAS 1 fissa il set completo dei prospetti e la scelta tra costi per natura e per funzione; IFRS 18 lo sostituisce dal 2027 con categorie e subtotali obbligatori. &lt;b&gt;Perché conta&lt;/b&gt;: gli schemi delle slide 119–120 stanno per cambiare. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.cpdbox.com/ias-1-presentation-of-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi IAS 1&lt;/a&gt; · &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY su IFRS 18&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;IAS 7 Statement of Cash Flows&lt;/h4&gt;
&lt;p&gt;Definisce le attività operative, di investimento e di finanziamento e chiede di indicare a parte le operazioni senza movimento di cassa. &lt;b&gt;Perché conta&lt;/b&gt;: è la base della slide 146 e dell&#x27;esercizio extra sulla Library. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IAS 7&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;Codice civile, artt. 2424 e 2425 · D.Lgs. 139/2015 · OIC 12&lt;/h4&gt;
&lt;p&gt;Schemi obbligatori di stato patrimoniale e conto economico civilistici; il D.Lgs. 139/2015 ha tolto l&#x27;area straordinaria; l&#x27;OIC 12 li interpreta. &lt;b&gt;Perché conta&lt;/b&gt;: la slide 121 è precedente alla riforma. &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2424&lt;/a&gt; · &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2425&lt;/a&gt; · &lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/OIC-12-composizione-e-schemi-del-bilancio-desercizio.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC 12 (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.eutekne.info/Sezioni/Art_606692_eliminazione_dell_area_straordinaria_con_impatto_fiscale.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eutekne sull&#x27;area straordinaria&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;GAAP · FASB Accounting Standards Codification&lt;/h4&gt;
&lt;p&gt;Dal 2009 è l&#x27;unica fonte autorevole degli US GAAP non governativi (le regole SEC restano a parte). &lt;b&gt;Perché conta&lt;/b&gt;: i GAAP (slide 148) dipendono dalla giurisdizione, e gli US GAAP sono il termine di confronto degli IFRS. &lt;a href=&quot;https://kenanflaglerresearchtools.web.unc.edu/research-resource/fasb-accounting-standards-codification/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNC research guide&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/resources/regional/fasb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · FASB&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;Regolamento (CE) n. 1606/2002&lt;/h4&gt;
&lt;p&gt;Il regolamento con cui l&#x27;UE ha adottato i principi contabili internazionali per migliorare trasparenza e confrontabilità dei bilanci e il funzionamento del mercato dei capitali. &lt;b&gt;Perché conta&lt;/b&gt;: è la risposta normativa europea alla spinta verso l&#x27;armonizzazione della slide 151. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;CSRD (Direttiva UE 2022/2464), Omnibus I (2026/470) ed ESRS&lt;/h4&gt;
&lt;p&gt;Reporting di sostenibilità nella relazione sulla gestione, secondo gli ESRS e con assurance esterna; l&#x27;Omnibus I ne ha ristretto l&#x27;ambito. &lt;b&gt;Perché conta&lt;/b&gt;: i numeri della slide 152 sono superati. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CSRD&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202600470&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Omnibus I&lt;/a&gt; · &lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt; · &lt;a href=&quot;https://viewpoint.pwc.com/gx/en/pwc/in-briefs/2026/ib_int202617.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC · Simplified ESRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

function bar(x,y,w,h,fill,lab){
  if(h&lt;=0)return &#x27;&#x27;;
  return `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; fill=&quot;${fill}&quot;/&gt;`+
    (h&gt;17?`&lt;text x=&quot;${x+w/2}&quot; y=&quot;${y+h/2+5}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; style=&quot;fill:var(--paper)&quot;&gt;${lab}&lt;/text&gt;`:&#x27;&#x27;);
}
function drawEq(){
  const v={}; for(const k in eq){v[k]=+eq[k].value; $(&#x27;#o-&#x27;+k).textContent=v[k];}
  const A=v.ca+v.fa, L=v.cl+v.ll, E=A-L, k=0.6, B=275;
  let s=`&lt;defs&gt;&lt;pattern id=&quot;hatch&quot; width=&quot;8&quot; height=&quot;8&quot; patternUnits=&quot;userSpaceOnUse&quot; patternTransform=&quot;rotate(45)&quot;&gt;&lt;rect width=&quot;8&quot; height=&quot;8&quot; fill=&quot;none&quot;/&gt;&lt;line x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;8&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;3&quot;/&gt;&lt;/pattern&gt;&lt;/defs&gt;`;
  s+=`&lt;line x1=&quot;20&quot; y1=&quot;${B}&quot; x2=&quot;500&quot; y2=&quot;${B}&quot; stroke=&quot;var(--rule)&quot;/&gt;`;
  s+=bar(70,B-v.fa*k,150,v.fa*k,&#x27;var(--slate)&#x27;,&#x27;Fixed &#x27;+v.fa);
  s+=bar(70,B-A*k,150,v.ca*k,&#x27;var(--sage)&#x27;,&#x27;Current &#x27;+v.ca);
  s+=bar(300,B-v.ll*k,150,v.ll*k,&#x27;var(--brick)&#x27;,&#x27;Long-term &#x27;+v.ll);
  s+=bar(300,B-L*k,150,v.cl*k,&#x27;var(--ochre)&#x27;,&#x27;Current liab. &#x27;+v.cl);
  if(E&gt;=0) s+=bar(300,B-A*k,150,E*k,&#x27;var(--accent)&#x27;,&#x27;Equity &#x27;+E);
  else s+=`&lt;rect x=&quot;300&quot; y=&quot;${B-L*k}&quot; width=&quot;150&quot; height=&quot;${-E*k}&quot; fill=&quot;url(#hatch)&quot; stroke=&quot;var(--bad)&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;${B-(L+A)/2*k+4}&quot; font-size=&quot;12&quot; style=&quot;fill:var(--bad)&quot;&gt;equity ${E}&lt;/text&gt;`;
  s+=`&lt;line x1=&quot;60&quot; y1=&quot;${B-A*k}&quot; x2=&quot;470&quot; y2=&quot;${B-A*k}&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`;
  s+=`&lt;text x=&quot;145&quot; y=&quot;${B-A*k-8}&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Assets ${A}&lt;/text&gt;`;
  s+=`&lt;text x=&quot;375&quot; y=&quot;${B-Math.max(A,L)*k-8}&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;L ${L} + E ${E} = ${A}&lt;/text&gt;`;
  $(&#x27;#eqsvg&#x27;).innerHTML=s;
  const st=$(&#x27;#eqstatus&#x27;); const msg=[];
  if(E&lt;0) msg.push(&#x27;&lt;b&gt;Equity negativa&lt;/b&gt;: le passività superano le attività, il patrimonio netto è eroso.&#x27;);
  if(v.cl&gt;v.ca) msg.push(&#x27;&lt;b&gt;Warning sign&lt;/b&gt;: current liabilities (&#x27;+v.cl+&#x27;) &amp;gt; current assets (&#x27;+v.ca+&#x27;). Si rischia di non pagare i debiti a breve (slide 67).&#x27;);
  st.className=&#x27;status &#x27;+(msg.length?&#x27;warn&#x27;:&#x27;good&#x27;);
  st.innerHTML=msg.length?msg.join(&#x27;&lt;br&gt;&#x27;):&#x27;Equilibrio: Assets = Liabilities + Equity, e le attività correnti coprono le passività correnti.&#x27;;
}
if(eq.ca){Object.values(eq).forEach(i=&gt;i.addEventListener(&#x27;input&#x27;,drawEq)); drawEq();}

 [&#x27;Shareholders&#x27;,&#x27;Investors / owners: il capitale rende abbastanza o renderebbe di più altrove? L\&#x27;impresa rischia l\&#x27;insolvenza? Conviene investire ancora? Guardano rischio e rendimento, dividendi, efficienza del management, liquidità, prospettive, confronto con i concorrenti. Includono analisti, giornalisti finanziari, ricercatori, stockbroker. (slide 75–76)&#x27;],

const MS=[&#x27;gen&#x27;,&#x27;feb&#x27;,&#x27;mar&#x27;,&#x27;apr&#x27;,&#x27;mag&#x27;,&#x27;giu&#x27;,&#x27;lug&#x27;,&#x27;ago&#x27;,&#x27;set&#x27;,&#x27;ott&#x27;,&#x27;nov&#x27;,&#x27;dic&#x27;];

  const m=+sa.value, inY=13-m, exp=100*inY, pre=1200-exp, w=21.5;
  $(&#x27;#o-acc&#x27;).textContent=MS[m-1];
  let s=&#x27;&#x27;;
  for(let k=0;k&lt;24;k++){const cov=k&gt;=m-1&amp;&amp;k&lt;m+11; s+=`&lt;rect x=&quot;${20+k*w}&quot; y=&quot;18&quot; width=&quot;${w-2}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;${cov?(k&lt;12?&#x27;var(--sage)&#x27;:&#x27;var(--ochre)&#x27;):&#x27;var(--rule)&#x27;}&quot; opacity=&quot;${cov?1:.5}&quot;/&gt;`; if(k%2===0)s+=`&lt;text x=&quot;${20+k*w+w/2}&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;9.5&quot; fill=&quot;var(--muted)&quot;&gt;${MS[k%12]}&lt;/text&gt;`;}
  s+=`&lt;line x1=&quot;${20+12*w-1}&quot; y1=&quot;10&quot; x2=&quot;${20+12*w-1}&quot; y2=&quot;60&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;esercizio corrente&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;esercizio successivo&lt;/text&gt;`;
  const k=0.35;
  s+=`&lt;text x=&quot;20&quot; y=&quot;88&quot; font-size=&quot;12.5&quot;&gt;Cash basis: costo dell&#x27;anno = tutto il pagato&lt;/text&gt;&lt;rect x=&quot;20&quot; y=&quot;94&quot; width=&quot;${1200*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;${28+1200*k}&quot; y=&quot;111&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;1.200&lt;/text&gt;`;
  s+=`&lt;text x=&quot;20&quot; y=&quot;146&quot; font-size=&quot;12.5&quot;&gt;Accrual basis: costo dell&#x27;anno + prepaid (asset)&lt;/text&gt;&lt;rect x=&quot;20&quot; y=&quot;152&quot; width=&quot;${exp*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;`+(pre?`&lt;rect x=&quot;${20+exp*k}&quot; y=&quot;152&quot; width=&quot;${pre*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`:&#x27;&#x27;)+`&lt;text x=&quot;${28+1200*k}&quot; y=&quot;169&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;${f(exp)} + ${f(pre)}&lt;/text&gt;`;

}
