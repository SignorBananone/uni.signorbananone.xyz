    &lt;a href=&quot;#esercizi&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;330&quot; width=&quot;290&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;358&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;8 · Esercizi guidati&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;378&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;«The Library» · retail shop&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#stakeholders&quot;&gt;&lt;rect x=&quot;760&quot; y=&quot;330&quot; width=&quot;180&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;850&quot; y=&quot;358&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;9 · Stakeholders&lt;/text&gt;&lt;text x=&quot;850&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;chi legge e perché&lt;/text&gt;&lt;/a&gt;

  &lt;/svg&gt;

&lt;main&gt;
&lt;section class=&quot;part sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 1 · Some fundamentals&lt;/div&gt;
&lt;h2&gt;Che cos&#x27;è l&#x27;accounting e a cosa serve&lt;/h2&gt;
&lt;p&gt;Le slide partono dalla vita quotidiana: decidere dove andare in vacanza vuol dire chiedersi qual è il &lt;b&gt;budget&lt;/b&gt;, cioè il preventivo delle risorse; il contabile che dice «the accounts don&#x27;t balance» («i conti non tornano») ci ricorda che ogni euro speso deve avere una provenienza. Il messaggio è semplice: &lt;em&gt;ovunque servano denaro e risorse economiche serve anche una contabilità che ne renda conto&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slide 2–4&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt; (contabilità): la registrazione sistematica e completa delle &lt;span class=&quot;t&quot;&gt;financial transactions&lt;/span&gt; (transazioni con un valore economico) di un&#x27;impresa, e il processo con cui le si riassume, analizza e comunica (&lt;span class=&quot;t&quot;&gt;summarizing, analyzing, reporting&lt;/span&gt;). Il bilancio di una grande società riassume in poche pagine centinaia di migliaia di transazioni. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Le cinque operazioni dell&#x27;accounting&lt;/h3&gt;
&lt;p&gt;Le slide la definiscono «an Art of» cinque verbi in sequenza. Scorrili uno per uno: ogni passo prepara il successivo. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Recording&lt;/h4&gt;&lt;p&gt;Si annota ogni transazione, con data, importo e controparte, nei &lt;span class=&quot;t&quot;&gt;books of account&lt;/span&gt; (i libri contabili). È il compito di base del &lt;span class=&quot;t&quot;&gt;bookkeeping&lt;/span&gt; (tenuta dei conti). Nella lezione questo passo diventa la &lt;a href=&quot;#journal&quot;&gt;journal entry&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Classifying&lt;/h4&gt;&lt;p&gt;Le registrazioni si raggruppano in &lt;b&gt;conti&lt;/b&gt; omogenei (cassa, affitti, debiti verso fornitori…). L&#x27;elenco dei conti è il &lt;a href=&quot;#ledger&quot;&gt;chart of accounts&lt;/a&gt; (piano dei conti); il registro per conto è il &lt;span class=&quot;t&quot;&gt;general ledger&lt;/span&gt; (libro mastro).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Summarizing&lt;/h4&gt;&lt;p&gt;Si calcolano i saldi di ogni conto e si riassumono in una tabella, la &lt;a href=&quot;#trial&quot;&gt;trial balance&lt;/a&gt; (bilancio di verifica), poi nei prospetti di bilancio.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Interpreting&lt;/h4&gt;&lt;p&gt;Si legge il significato dei numeri: l&#x27;impresa guadagna? È liquida? È solida? Per esempio confrontando le attività correnti con le passività correnti (slide 67).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Reporting&lt;/h4&gt;&lt;p&gt;Si comunicano le informazioni a chi le usa (gli &lt;a href=&quot;#stakeholders&quot;&gt;stakeholders&lt;/a&gt;) con i &lt;a href=&quot;#statements&quot;&gt;financial statements&lt;/a&gt;, secondo regole condivise (&lt;a href=&quot;#standards&quot;&gt;GAAP / standard&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Gli obiettivi della contabilità&lt;/h3&gt;
&lt;p&gt;Possono variare da impresa a impresa, ma le slide ne elencano sette generali. Apri le schede. &lt;span class=&quot;src&quot;&gt;slide 6–9&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;details&gt;&lt;summary&gt;Keep systematic records&lt;/summary&gt;&lt;div&gt;Ricordare tutte le transazioni è impossibile: la contabilità le registra subito nei libri contabili.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ascertain the results of the operation&lt;/summary&gt;&lt;div&gt;Calcolare profitto o perdita del periodo confrontando ricavi e costi: è il &lt;span class=&quot;t&quot;&gt;Trading and Profit and Loss account&lt;/span&gt; (o l&#x27;&lt;span class=&quot;t&quot;&gt;Income and Expenditure account&lt;/span&gt; dei non profit), oggi &lt;a href=&quot;#statements&quot;&gt;income statement&lt;/a&gt; (conto economico).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ascertain the financial position&lt;/summary&gt;&lt;div&gt;Sapere cosa si possiede e cosa si deve, e quanta cassa c&#x27;è: la solidità mostrata dal &lt;span class=&quot;t&quot;&gt;balance sheet&lt;/span&gt; (stato patrimoniale).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Portray the liquidity position&lt;/summary&gt;&lt;div&gt;Come l&#x27;impresa ottiene e spende cassa, prende e rimborsa prestiti, distribuisce dividendi: ciò che incide su &lt;span class=&quot;t&quot;&gt;liquidity&lt;/span&gt; (pagare a breve) e &lt;span class=&quot;t&quot;&gt;solvency&lt;/span&gt; (onorare i debiti nel lungo periodo).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Protect business properties&lt;/summary&gt;&lt;div&gt;Con dati aggiornati su beni e debiti nessuno può pretendere pagamenti non dovuti.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Facilitate rational decision-making&lt;/summary&gt;&lt;div&gt;I dati contabili sono la base delle decisioni: investire, assumere, chiedere un prestito.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Satisfy the requirements of law&lt;/summary&gt;&lt;div&gt;La legge impone scritture e bilancio; in Italia gli schemi sono negli artt. 2424 e 2425 c.c. (&lt;a href=&quot;#statements&quot;&gt;Parte 7&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Double entry system&lt;/b&gt; (partita doppia): il nome tecnico del «sistema di registrazione delle informazioni su un&#x27;impresa». Tutta la lezione ne sviluppa la logica. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Elenca in ordine le cinque operazioni dell&#x27;accounting.&lt;/summary&gt;&lt;div&gt;Recording → Classifying → Summarizing → Interpreting → Reporting.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra «financial position» e «results of the operation»?&lt;/summary&gt;&lt;div&gt;La prima è una fotografia in una data (cosa si possiede e si deve: balance sheet). La seconda è un flusso su un periodo (ricavi meno costi: income statement).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Liquidity e solvency sono sinonimi?&lt;/summary&gt;&lt;div&gt;No. La liquidity è la capacità di far fronte ai pagamenti a breve con la cassa disponibile o in arrivo; la solvency è la capacità complessiva di onorare tutti i debiti, anche nel lungo periodo.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;partita-doppia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 2 · Double entry accounting&lt;/div&gt;
&lt;h2&gt;La bilancia, l&#x27;equazione e l&#x27;impresa dei panini&lt;/h2&gt;
&lt;p&gt;La partita doppia è paragonata a una &lt;b&gt;bilancia&lt;/b&gt;: per restare in equilibrio, se il peso di un piatto cresce o cala, lo stesso peso va aggiunto o tolto sull&#x27;altro. La forma più comune di questa idea è l&#x27;&lt;span class=&quot;t&quot;&gt;accounting equation&lt;/span&gt; (equazione contabile). &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Owner&#x27;s Equity&lt;small&gt;impieghi (uses) = fonti (sources) · Equity = Assets − Liabilities · slide 105 e 110&lt;/small&gt;&lt;/div&gt;

&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;br&gt;ciò che l&#x27;impresa possiede o controlla e che porterà benefici futuri: cassa, crediti, magazzino, macchinari.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;br&gt;ciò che l&#x27;impresa deve a terzi e dovrà rimborsare: debiti verso banche, fornitori, dipendenti.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Owner&#x27;s Equity&lt;/b&gt;&lt;br&gt;il patrimonio netto: quanto hanno investito i soci più gli utili accumulati. È la «residual interest», ciò che resta degli assets dopo aver pagato tutte le liabilities.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Prova la bilancia: l&#x27;equazione con i cursori&lt;/h3&gt;
&lt;p&gt;Muovi i cursori. L&#x27;equity non si sceglie: è sempre la differenza tra attività e passività, ed è per questo che i due lati sono &lt;em&gt;per costruzione&lt;/em&gt; uguali. L&#x27;avviso in basso applica la regola della slide 67: se le passività correnti superano le attività correnti è un &lt;span class=&quot;t&quot;&gt;warning sign&lt;/span&gt; per la cassa.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;sliders&quot;&gt;
 &lt;label&gt;Current assets (cassa, crediti, scorte): &lt;output id=&quot;o-ca&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-ca&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Fixed assets (immobili, impianti): &lt;output id=&quot;o-fa&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-fa&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;90&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Current liabilities (entro 12 mesi): &lt;output id=&quot;o-cl&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-cl&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Long-term liabilities (oltre 12 mesi): &lt;output id=&quot;o-ll&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-ll&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg id=&quot;eqsvg&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Barre impilate di attività e di passività più patrimonio netto&quot;&gt;&lt;/svg&gt;
&lt;div id=&quot;eqstatus&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il caso di Peter: un&#x27;impresa di panini in otto passi&lt;/h3&gt;
&lt;p&gt;Per introdurre la contabilità le slide costituiscono una società semplicissima e ne seguono la gestione. Peter vende panini allo stadio; lui e un amico versano 2 € a testa: &lt;b&gt;2 soci al 50%, capitale iniziale 4 €&lt;/b&gt;. Scorri i passi: a sinistra gli &lt;span class=&quot;t&quot;&gt;uses&lt;/span&gt; (impieghi: dove sono le risorse), a destra le &lt;span class=&quot;t&quot;&gt;sources&lt;/span&gt; (fonti: da dove vengono). La bilancia in alto confronta &lt;em&gt;solo&lt;/em&gt; lo stato patrimoniale. &lt;span class=&quot;src&quot;&gt;slide 13–32&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;peter&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;peter-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Cosa insegna il caso.&lt;/b&gt; Alcune transazioni toccano solo gli impieghi (il pane), altre aggiungono insieme fonte e impiego (il prestito). Ciò che si &lt;em&gt;consuma&lt;/em&gt; (pane, prosciutto) diventa costo nell&#x27;&lt;span class=&quot;t&quot;&gt;income statement&lt;/span&gt;; il coltello, &lt;span class=&quot;t&quot;&gt;instrumental good&lt;/span&gt; (bene strumentale), resta tra gli assets. Il profitto di 1 € accresce l&#x27;equity e riporta l&#x27;equilibrio: 16 = 16. Nelle slide 28 e 30 le colonne del conto economico si chiamano «Loss / Profit» e «COSTI / RICAVI». &lt;span class=&quot;src&quot;&gt;slide 21–32&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Assets 250, liabilities 180: quanto vale l&#x27;equity?&lt;/summary&gt;&lt;div&gt;Equity = 250 − 180 = 70.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché, dopo che il pane e il prosciutto sono stati consumati, lo stato patrimoniale di Peter «non quadra»?&lt;/summary&gt;&lt;div&gt;Perché 10 € di impieghi sono usciti dallo stato patrimoniale e sono diventati costi nel conto economico. L&#x27;equilibrio torna solo quando si chiude il conto economico: ricavi 11 − costi 10 = utile 1, che si somma all&#x27;equity.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il coltello è un costo o un asset? E il prosciutto?&lt;/summary&gt;&lt;div&gt;Il coltello è un asset (bene strumentale, usato in molti cicli produttivi). Il prosciutto è un costo di materie prime: si consuma e va ricomprato.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;uses-sources&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 3 · Learn to identify transaction elements&lt;/div&gt;
&lt;h2&gt;Use e source: le due facce di ogni transazione&lt;/h2&gt;
&lt;p&gt;L&#x27;obiettivo della partita doppia è un quadro finanziario &lt;em&gt;bilanciato&lt;/em&gt;: sapere non solo come è stato usato il denaro, ma anche da dove è arrivato. Una transazione è uno scambio di cose di valore; per registrarla bisogna rispondere a &lt;b&gt;quattro domande&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;How was the money used?&lt;/b&gt; Cosa è stato acquisito o pagato? → l&#x27;&lt;span class=&quot;t&quot;&gt;acquisition/use&lt;/span&gt; (impiego)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Where did the money come from?&lt;/b&gt; Qual è la fonte? → la &lt;span class=&quot;t&quot;&gt;source&lt;/span&gt; (fonte)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;What is the value of the exchange?&lt;/b&gt; → l&#x27;importo&lt;/li&gt;
&lt;li&gt;&lt;b&gt;When?&lt;/b&gt; → la data della transazione&lt;/li&gt;
&lt;/ol&gt;

&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 300&quot; role=&quot;img&quot; aria-labelledby=&quot;usst&quot;&gt;&lt;title id=&quot;usst&quot;&gt;Confronto speculare tra uses e sources&lt;/title&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;280&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
&lt;rect x=&quot;390&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;280&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
&lt;text x=&quot;190&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;22&quot; font-weight=&quot;600&quot;&gt;Acquisition / Use = DEBIT&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;22&quot; font-weight=&quot;600&quot;&gt;Source = CREDIT&lt;/text&gt;
&lt;g font-size=&quot;15&quot;&gt;
&lt;text x=&quot;34&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;↑ Expenses&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;116&quot; font-size=&quot;12.5&quot;&gt;consumabili: affitto, telefono, cibo, carburante&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;166&quot; font-weight=&quot;600&quot;&gt;↑ Increases in what you own&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;186&quot; font-size=&quot;12.5&quot;&gt;cassa, veicoli, edifici, attrezzature&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;236&quot; font-weight=&quot;600&quot;&gt;↓ Decreases in what you owe&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;256&quot; font-size=&quot;12.5&quot;&gt;rimborsare il prestito dell&#x27;auto&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;↑ Income&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;116&quot; font-size=&quot;12.5&quot;&gt;quanto incassi per prodotti o servizi&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;166&quot; font-weight=&quot;600&quot;&gt;↑ Increases in what you owe&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;186&quot; font-size=&quot;12.5&quot;&gt;prestiti; investimenti dei soci (equity)&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;236&quot; font-weight=&quot;600&quot;&gt;↓ Decreases in what you own&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;256&quot; font-size=&quot;12.5&quot;&gt;pagare con la cassa, dare via la vecchia auto&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;4 4&quot;&gt;&lt;line x1=&quot;370&quot; y1=&quot;170&quot; x2=&quot;390&quot; y2=&quot;170&quot;/&gt;&lt;line x1=&quot;370&quot; y1=&quot;240&quot; x2=&quot;390&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le due liste sono speculari: «increase in what you owe» è una source, «decrease in what you owe» è un use. &lt;span class=&quot;src&quot;&gt;slide 35–36&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Regola d&#x27;oro&lt;/b&gt; (slide 43): da qui in avanti si usa il linguaggio tecnico. &lt;span class=&quot;dr&quot;&gt;Debit&lt;/span&gt; (dare) significa sempre «acquisition/use»; &lt;span class=&quot;cr&quot;&gt;Credit&lt;/span&gt; (avere) significa sempre «source». «No exceptions.»&lt;/div&gt;
&lt;p&gt;Due dettagli utili dalle slide: (a) un pagamento di un debito è un &lt;em&gt;use&lt;/em&gt;, perché «possiedo di più» del bene (la banca ne possiede meno); (b) gli investimenti dei soci sono &lt;em&gt;sources&lt;/em&gt;: l&#x27;impresa «deve» ai soci quanto hanno investito. Questo è il principio dell&#x27;&lt;b&gt;entità separata&lt;/b&gt;: l&#x27;impresa è distinta dal proprietario, e il suo conferimento appare come un diritto (&lt;span class=&quot;t&quot;&gt;claim&lt;/span&gt;) verso l&#x27;impresa. &lt;span class=&quot;src&quot;&gt;slide 36, 131–132&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Esempi dalle slide&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Affitto con assegno&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Affitto in baratto&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Lavoro per un&#x27;altra inquilina&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Il socio apre il conto&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;1 novembre: pagati 500 $ al proprietario per l&#x27;affitto con l&#x27;assegno n. 100.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Rent · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Checking Account (il conto corrente)&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;E se invece della cassa offrissi al proprietario servizi contabili in cambio dell&#x27;affitto?&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Rent (ho comunque usato i locali) · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Accounting Services (Sales = Income). La fonte non è più la cassa ma un ricavo.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Un&#x27;altra inquilina mi chiede un lavoro contabile e mi paga.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Checking Account (entra denaro) · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Accounting Services (Sales/Income).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Uso 1.500 $ miei per aprire un nuovo conto corrente per l&#x27;impresa.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Checking Account · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Owner&#x27;s Investment (Owner&#x27;s Equity). Registriamo le transazioni &lt;em&gt;dell&#x27;impresa&lt;/em&gt;: l&#x27;impresa ha acquisito denaro e aumentato il debito «verso il socio».&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slide 37–38&lt;/p&gt;

&lt;h3&gt;Transazioni «on account» (a credito)&lt;/h3&gt;
&lt;p&gt;Spesso beni e servizi si ricevono o si forniscono &lt;span class=&quot;t&quot;&gt;on account / on credit&lt;/span&gt;, cioè con pagamento differito. Si registra quando arriva (o parte) la fattura, non alla consegna. &lt;span class=&quot;src&quot;&gt;slide 40–41&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;oat&quot;&gt;&lt;title id=&quot;oat&quot;&gt;Sequenza in tre passi per acquisti e vendite a credito&lt;/title&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;text x=&quot;10&quot; y=&quot;30&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;17&quot;&gt;Acquisto (Accounts Payable = debiti verso fornitori)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · Ricevo i beni&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;nessuna scrittura&lt;/text&gt;
&lt;rect x=&quot;265&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · Arriva la fattura&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;Dr Goods/Services · Cr A/P&lt;/text&gt;
&lt;rect x=&quot;520&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · Pago&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;Dr A/P · Cr Checking&lt;/text&gt;
&lt;text x=&quot;10&quot; y=&quot;150&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;17&quot;&gt;Vendita (Accounts Receivable = crediti verso clienti)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · Fornisco i beni&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;nessuna scrittura&lt;/text&gt;
&lt;rect x=&quot;265&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · Emetto la fattura&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;Dr A/R · Cr Sales&lt;/text&gt;
&lt;rect x=&quot;520&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · Incasso&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;Dr Checking · Cr A/R&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;240&quot; y1=&quot;79&quot; x2=&quot;263&quot; y2=&quot;79&quot;/&gt;&lt;line x1=&quot;495&quot; y1=&quot;79&quot; x2=&quot;518&quot; y2=&quot;79&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;199&quot; x2=&quot;263&quot; y2=&quot;199&quot;/&gt;&lt;line x1=&quot;495&quot; y1=&quot;199&quot; x2=&quot;518&quot; y2=&quot;199&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Nel passo 3 il debito pagato (A/P) è un &lt;em&gt;use&lt;/em&gt; («decrease what I owe»); il credito incassato (A/R) è una &lt;em&gt;source&lt;/em&gt; («decrease what I own»).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;La slide segue la logica didattica «registro alla fattura». Negli standard internazionali il ricavo si rileva quando il controllo del bene o servizio passa al cliente (IFRS 15); in pratica la fattura spesso coincide con quel momento, ma il criterio è il trasferimento del controllo (&lt;span class=&quot;t&quot;&gt;transfer of control&lt;/span&gt;), non il documento. Vedi la sintesi di &lt;a href=&quot;https://www.rsm.global/southafrica/node/301&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RSM su IFRS 15&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 3: identifica use (Dr) e source (Cr)&lt;/h3&gt;
&lt;p class=&quot;note&quot;&gt;Tabelle 1 e 2 (slide 39 e 42); soluzioni ricostruite dai T-account delle slide 61 e 91.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1–7 (novembre): versamento del socio 1.500; affitto 500; telefono/fax 75; stampante 150; cancelleria 75; parti server 500; spese bancarie 10&lt;/summary&gt;&lt;div&gt;1: Dr Checking / Cr Owner&#x27;s Equity. Poi tutte in avere Checking, in dare: 2 Rent · 3 e 4 Office Equipment · 5 Office Supplies · 6 Computer Hardware · 7 Bank Charges.&lt;/div&gt;&lt;/details&gt;

&lt;details&gt;&lt;summary&gt;14: estratto conto della carta di credito 930 con sette addebiti&lt;/summary&gt;&lt;div&gt;Una scrittura su più righe: Dr CC Interest and Fees 30, Office Furniture 245, Fuel 25, Subscriptions 65, Meals 45, Website Hosting 120, Computer Hardware 400 · Cr Accounts Payable 930.&lt;/div&gt;&lt;/details&gt;

&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;journal&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 4 · Journal entries&lt;/div&gt;
&lt;h2&gt;La scrittura nel libro giornale&lt;/h2&gt;
&lt;p&gt;Le risposte alle quattro domande si annotano in un &lt;b&gt;journal&lt;/b&gt; (libro giornale), da cui il nome &lt;span class=&quot;t&quot;&gt;journal entry&lt;/span&gt; (scrittura contabile). Il giornale è una griglia con colonne &lt;b&gt;Date · Description · Ref · Debit · Credit&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 44–46&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Regola di impaginazione.&lt;/b&gt; La colonna numerica di sinistra è sempre il &lt;span class=&quot;dr&quot;&gt;Debit&lt;/span&gt;, quella di destra sempre il &lt;span class=&quot;cr&quot;&gt;Credit&lt;/span&gt;. Per convenzione i conti in avere si scrivono rientrati. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/div&gt;

&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-labelledby=&quot;cyct&quot;&gt;&lt;title id=&quot;cyct&quot;&gt;Il ciclo contabile dalla transazione al bilancio&lt;/title&gt;

&lt;rect x=&quot;150&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Journal&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;88&quot;&gt;per data&lt;/text&gt;
&lt;rect x=&quot;295&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;355&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Chart of acc.&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;88&quot;&gt;elenco conti&lt;/text&gt;

&lt;rect x=&quot;730&quot; y=&quot;40&quot; width=&quot;125&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;792&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Fin. statements&lt;/text&gt;&lt;text x=&quot;792&quot; y=&quot;88&quot;&gt;BS · IS&lt;/text&gt;
&lt;/g&gt;

&lt;text x=&quot;430&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;«Journal entries gather great information but they don&#x27;t really tell you anything by themselves» (slide 52)&lt;/text&gt;

&lt;h3&gt;Tre scritture tipo&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Versamento del socio&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Più righe: carta di credito&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Vendita a credito con COGS&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Example 4 (slide 47). Risposte: 1) i soldi sono andati sul conto corrente; 2) sono arrivati dal socio; 3) 1.500 $; 4) novembre 2010.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;th&gt;Ref&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Nov/2010&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.500,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Owner Investment&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.500,00&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;4&quot;&gt;&lt;i&gt;Deposited $1500 from owner into checking account&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;L&#x27;importo della domanda 3 è scritto &lt;b&gt;due volte&lt;/b&gt;, una in dare e una in avere: per questo si chiama &lt;span class=&quot;t&quot;&gt;double entry&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Example 5 (slide 50). Quando una domanda ha più risposte si usano &lt;span class=&quot;t&quot;&gt;multiple lines&lt;/span&gt;: le righe si sommano, ma il totale dare resta uguale al totale avere.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;th&gt;Ref&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dec/2010&lt;/td&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td&gt;299&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Fuel&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Magazine Subscription&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Accounts Payable&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150,00&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Totals&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150,00&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150,00&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Slide 46: vendita di merce a credito. Le scritture sono due e si leggono insieme.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Jan 1&lt;/td&gt;&lt;td&gt;Accounts Receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Cost of Goods Sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Revenues (Sales)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Si rileva il ricavo (1.000, con un credito verso il cliente) e il &lt;b&gt;costo del venduto&lt;/b&gt; (&lt;span class=&quot;t&quot;&gt;Cost of Goods Sold&lt;/span&gt;, COGS): la merce esce dal magazzino (&lt;span class=&quot;t&quot;&gt;inventory&lt;/span&gt;) al costo di 750. Il margine è 250. Questo è il &lt;span class=&quot;t&quot;&gt;perpetual inventory system&lt;/span&gt; (inventario permanente) che ritroverai nell&#x27;esercizio della Library.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;formula&quot;&gt;Total Debits = Total Credits&lt;small&gt;«the most basic rule of accounting»: se vale per ogni scrittura, i libri sono «in balance» · slide 47–48&lt;/small&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le cinque colonne del giornale e quale numerica sta a sinistra?&lt;/summary&gt;&lt;div&gt;Date, Description, Ref, Debit, Credit. A sinistra c&#x27;è sempre il Debit.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A cosa serve la colonna «Ref»?&lt;/summary&gt;&lt;div&gt;Collega la scrittura del giornale alle registrazioni nel mastro: partendo da un conto del ledger si ritrova l&#x27;intera scrittura con tutte le contropartite (slide 58).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una scrittura ha tre righe in dare (40 + 35 + 25). Quanto deve valere l&#x27;avere?&lt;/summary&gt;&lt;div&gt;100: il totale dare deve sempre uguagliare il totale avere.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;ledger&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 5 · Chart of accounts, general ledger, T-accounts&lt;/div&gt;
&lt;h2&gt;Dare un senso alle scritture&lt;/h2&gt;
&lt;h3&gt;1. Il chart of accounts (piano dei conti)&lt;/h3&gt;
&lt;p&gt;Il primo passo è fare la lista delle descrizioni usate nelle risposte alle domande 1 e 2: questa lista è il &lt;b&gt;chart of accounts&lt;/b&gt;, «really just a list of transaction descriptions». Di solito il contabile la prepara prima e la amplia quando serve; in ogni caso bisogna controllare i conti esistenti per &lt;b&gt;non creare duplicati&lt;/b&gt;. Poi si &lt;b&gt;raggruppano&lt;/b&gt; i conti troppo specifici: carta, penne e graffette diventano tutte «Office Supplies»; sedia e scrivania diventano «Office Furniture». &lt;span class=&quot;src&quot;&gt;slide 53–56&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Nella slide 56 la lista diventa piano dei conti in tre colonne (originale → rivista → senza duplicati): Phone/Fax + Printer → Office Equipment; Chair + Desk → Office Furniture; Server Parts → Computer Hardware; Oil Change → Repairs and Maintenance; Magazine → Subscriptions; Business Lunch → Meals.&lt;/p&gt;

&lt;h3&gt;2. Il general ledger e il T-account&lt;/h3&gt;
&lt;p&gt;Il &lt;b&gt;general ledger&lt;/b&gt; (libro mastro) riorganizza le scritture &lt;em&gt;per conto&lt;/em&gt; invece che per numero di transazione. Nel mastro cartaceo ogni conto ha la sua pagina con un saldo progressivo. Attenzione: in un singolo conto dare e avere &lt;b&gt;non&lt;/b&gt; si pareggiano, perché si vede solo una metà di ogni scrittura. Il &lt;span class=&quot;t&quot;&gt;T-account&lt;/span&gt; è la versione grafica e compatta: titolo in alto, &lt;span class=&quot;dr&quot;&gt;debits a sinistra&lt;/span&gt;, &lt;span class=&quot;cr&quot;&gt;credits a destra&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 57–60&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;b&gt;Simulazione&lt;/b&gt;: registra una alla volta le sette transazioni di novembre (tabella 1) e guarda i T-account riempirsi. L&#x27;ultima registrazione è evidenziata. &lt;span class=&quot;src&quot;&gt;slide 61, 87&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;tacc&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Registra →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;tacc-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;3. Organizzare il piano dei conti&lt;/h3&gt;
&lt;p&gt;Per produrre i bilanci i conti si ordinano con tre criteri: &lt;b&gt;accounting type&lt;/b&gt;, &lt;b&gt;order of liquidity&lt;/b&gt;, &lt;b&gt;account numbers&lt;/b&gt; (numerazione). &lt;span class=&quot;src&quot;&gt;slide 63&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;7 accounting types&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Order of liquidity&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Cost o expense?&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Assets&lt;/b&gt;: things you own&lt;/li&gt;&lt;li&gt;&lt;b&gt;Liabilities&lt;/b&gt;: things you owe&lt;/li&gt;&lt;li&gt;&lt;b&gt;Equity&lt;/b&gt;: owner&#x27;s stake in company&lt;/li&gt;&lt;li&gt;&lt;b&gt;Revenue&lt;/b&gt;: entrate da vendite di beni o servizi dell&#x27;impresa&lt;/li&gt;&lt;li&gt;&lt;b&gt;Cost of Goods Sold&lt;/b&gt;: costi per produrre o acquistare ciò che si vende&lt;/li&gt;&lt;li&gt;&lt;b&gt;Expenses&lt;/b&gt;: costi operativi, senza valore duraturo, che servono a far funzionare l&#x27;impresa&lt;/li&gt;&lt;li&gt;&lt;b&gt;Other Revenue and Expenses&lt;/b&gt;: voci insolite, non legate al prodotto né al normale funzionamento&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;Il costo di un bene a volte lo fa classificare come expense invece che come asset: le slide rimandano l&#x27;eccezione alla lezione sull&#x27;ammortamento (&lt;span class=&quot;t&quot;&gt;depreciation&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Vale per assets e liabilities. La &lt;span class=&quot;t&quot;&gt;liquidity&lt;/span&gt; è la facilità di trasformare un elemento in cassa senza perdita di valore. Si elenca in ordine &lt;b&gt;decrescente&lt;/b&gt; di liquidità, con la cassa in cima. &lt;span class=&quot;t&quot;&gt;Current&lt;/span&gt; = si converte («turnover») entro &lt;b&gt;un anno&lt;/b&gt;; &lt;span class=&quot;t&quot;&gt;Fixed / Long term&lt;/span&gt; = oltre l&#x27;anno. &lt;span class=&quot;src&quot;&gt;slide 66–67&lt;/span&gt;&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Scala di liquidità dalla cassa agli impianti&quot;&gt;&lt;defs&gt;&lt;linearGradient id=&quot;lg&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;580&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;url(#lg)&quot;/&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;30&quot;&gt;Cash&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;30&quot;&gt;Receivables&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;30&quot;&gt;Inventory&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;30&quot;&gt;Equipment&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;30&quot;&gt;Plant&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;30&quot;&gt;Property&lt;/text&gt;&lt;/g&gt;
&lt;g font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;80&quot;&gt;più liquido · Current assets&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;80&quot; text-anchor=&quot;end&quot;&gt;meno liquido · Fixed assets&lt;/text&gt;&lt;/g&gt;
&lt;line x1=&quot;320&quot; y1=&quot;34&quot; x2=&quot;320&quot; y2=&quot;62&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;soglia: 1 anno&lt;/text&gt;&lt;/svg&gt;
&lt;p&gt;Perché conta la distinzione current? Raggruppa voci che girano rapidamente e dà un &lt;b&gt;segnale d&#x27;allarme&lt;/b&gt; per la cassa: le passività correnti si pagano di solito con le attività correnti, quindi passività correnti maggiori delle attività correnti sono un warning sign, anche se non infallibile.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Costs (COGS) ed expenses si somigliano; per distinguerli bisogna sapere cosa vende l&#x27;impresa («what does it do for a living?»). Nel caso delle slide l&#x27;impresa &lt;b&gt;vende spazi pubblicitari sul proprio sito&lt;/b&gt;; il titolare crea le pagine senza stipendio e il software è gratuito, quindi l&#x27;unico costo diretto è il &lt;b&gt;Website Hosting&lt;/b&gt; (COGS). Nel dubbio: &lt;b&gt;classificalo come expense&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 64&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 5: assegna il tipo a ogni conto&lt;/h3&gt;
&lt;p class=&quot;note&quot;&gt;Clicca la categoria giusta per ogni conto (slide 65, soluzione a slide 68).&lt;/p&gt;
&lt;div id=&quot;game&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; id=&quot;game-fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;trial&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 6 · The trial balance&lt;/div&gt;
&lt;h2&gt;Il bilancio di verifica&lt;/h2&gt;
&lt;p&gt;Completati i T-account e calcolati i saldi, si crea un riepilogo dei conti e dei loro saldi: la &lt;b&gt;trial balance&lt;/b&gt; (bilancio di verifica). La griglia somiglia a quella del giornale, ma elenca i &lt;em&gt;conti&lt;/em&gt; col saldo alla data, non le singole transazioni. Il controllo resta lo stesso: &lt;b&gt;total debits = total credits&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 87–88&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Saldo normale: chi «cresce» in dare e chi in avere&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Saldo in dare (debit balance)&lt;/b&gt;&lt;br&gt;Conti che aumentano quando sono &lt;em&gt;use&lt;/em&gt;: &lt;b&gt;Assets&lt;/b&gt;, &lt;b&gt;Costs&lt;/b&gt;, &lt;b&gt;Expenses&lt;/b&gt;. Se il conto corrente ha saldo avere vuol dire che sei &lt;span class=&quot;t&quot;&gt;overdrawn&lt;/span&gt; (scoperto). &lt;span class=&quot;src&quot;&gt;slide 89&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Saldo in avere (credit balance)&lt;/b&gt;&lt;br&gt;Conti che aumentano quando sono &lt;em&gt;source&lt;/em&gt;: acquisti a credito (A/P), &lt;b&gt;Loans&lt;/b&gt;, investimenti dei soci (&lt;b&gt;Equity&lt;/b&gt;), &lt;b&gt;Income&lt;/b&gt;. Se A/P ha saldo dare hai pagato più del dovuto. &lt;span class=&quot;src&quot;&gt;slide 88&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Nella colonna «saldo» di un mastro elettronico l&#x27;equity compare con il segno meno (−1.500): &lt;b&gt;non&lt;/b&gt; significa equity negativo, solo che il saldo è in avere. Per questo nella &lt;span class=&quot;t&quot;&gt;comparative trial balance&lt;/span&gt; (bilancio di verifica comparativo) la somma con segno di tutti i saldi fa &lt;b&gt;0&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 88, 95&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;Scegli il periodo: la tabella mostra i saldi in dare e in avere e, nella colonna «±», il saldo con segno usato dalla &lt;span class=&quot;t&quot;&gt;comparative trial balance&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 87, 94–95&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;button class=&quot;btn tbp on&quot; data-p=&quot;0&quot;&gt;Novembre&lt;/button&gt; &lt;button class=&quot;btn tbp&quot; data-p=&quot;1&quot;&gt;Dicembre&lt;/button&gt; &lt;button class=&quot;btn tbp&quot; data-p=&quot;2&quot;&gt;Cumulativo al 31/12&lt;/button&gt;
&lt;div class=&quot;tbl-wrap&quot; id=&quot;tbout&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Dicembre: il Checking ha 1.100 + 500 in dare e 700 + 25 + 500 + 15 in avere, quindi saldo 360; l&#x27;A/P fa 150 + 100 + 930 − 500 = 680.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Dalla trial balance si passa ai &lt;b&gt;financial statements&lt;/b&gt;: i conti con valore duraturo vanno nel balance sheet, quelli consumati nel periodo nell&#x27;income statement. &lt;span class=&quot;src&quot;&gt;slide 86, 96&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 6 (quiz vero/falso delle slide)&lt;/h3&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;1. Il saldo normale di un conto di ricavo (revenue) è in dare.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;I ricavi sono sources: crescono in avere, quindi saldo normale in avere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;V&quot;&gt;&lt;p&gt;2. Il saldo normale di un conto di costo (expense) è in dare.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;Le spese sono uses consumabili: crescono in dare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;3. Se i prelievi del titolare (withdrawals) superano l&#x27;utile netto, l&#x27;owner&#x27;s equity aumenta.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Vero&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;Falso&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;L&#x27;equity cambia di (utile − prelievi): se i prelievi sono maggiori, l&#x27;equity diminuisce.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Il conto corrente mostra un saldo in avere. Cosa significa?&lt;/summary&gt;&lt;div&gt;Che il conto è scoperto (overdrawn): hai pagato più di quanto c&#x27;era.&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;src&quot;&gt;slide 69&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;statements&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 7 · Financial statements&lt;/div&gt;
&lt;h2&gt;Il bilancio: cosa riporta e com&#x27;è fatto&lt;/h2&gt;
&lt;p&gt;Un &lt;span class=&quot;t&quot;&gt;financial statement&lt;/span&gt; è insieme un &lt;b&gt;processo&lt;/b&gt; di comunicazione e un &lt;b&gt;documento&lt;/b&gt; che riporta performance e risorse dell&#x27;impresa. Due domande lo guidano: &lt;em&gt;cosa riporta?&lt;/em&gt; e &lt;em&gt;per chi è?&lt;/em&gt; (vedi &lt;a href=&quot;#stakeholders&quot;&gt;Parte 9&lt;/a&gt;). &lt;span class=&quot;src&quot;&gt;slide 70–71&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Form&lt;/b&gt; (forma)&lt;br&gt;i documenti che compongono il bilancio, la loro struttura e il loro contenuto: gli &lt;em&gt;schemi&lt;/em&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Substance&lt;/b&gt; (sostanza)&lt;br&gt;la misurazione e quantificazione dei valori da inserire nei documenti: i &lt;em&gt;criteri di valutazione&lt;/em&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slide 72 (le slide usano «budget documents» nel senso di documenti di bilancio)&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective of financial reporting&lt;/b&gt;: comunicare misure economiche e informazioni su risorse e performance dell&#x27;entità che siano &lt;b&gt;useful&lt;/b&gt; (utili) a chi ha ragionevole diritto a tali informazioni. &lt;span class=&quot;src&quot;&gt;slide 83&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Cosa contiene un financial report&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;The financial statements&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Statement of financial position (&lt;b&gt;balance sheet&lt;/b&gt;, stato patrimoniale)&lt;/li&gt;&lt;li&gt;Statement of comprehensive income (&lt;b&gt;income statement&lt;/b&gt;, conto economico)&lt;/li&gt;&lt;li&gt;Statement of changes in equity (variazioni del patrimonio netto)&lt;/li&gt;&lt;li&gt;Statement of cash flows (rendiconto finanziario)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;E inoltre&lt;/b&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Notes&lt;/b&gt; to the financial statements (nota integrativa)&lt;/li&gt;&lt;li&gt;&lt;b&gt;Narrative information&lt;/b&gt;, per esempio il directors&#x27; report (relazione sulla gestione)&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 85&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;L&#x27;elenco segue &lt;b&gt;IAS 1&lt;/b&gt; (che chiede anche i dati comparativi). Dagli esercizi che iniziano il &lt;b&gt;1° gennaio 2027&lt;/b&gt; lo sostituisce &lt;b&gt;IFRS 18&lt;/b&gt;: categorie e subtotali obbligatori nel conto economico e informativa sulle &lt;span class=&quot;t&quot;&gt;management-defined performance measures&lt;/span&gt;. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IFRS 18&lt;/a&gt;, &lt;a href=&quot;https://www.bdo.co.uk/en-gb/services/audit-assurance/ifrs/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Balance sheet&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Income statement&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Cash flows&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Changes in equity&lt;/button&gt;&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Il balance sheet è una &lt;b&gt;fotografia&lt;/b&gt; della consistenza qualitativa e quantitativa degli elementi attivi e passivi del capitale dell&#x27;impresa: come la «X» sulla mappa che dice &lt;span class=&quot;t&quot;&gt;You are here&lt;/span&gt;. Dice cosa l&#x27;impresa possiede, cosa deve e quanto vale contabilmente (&lt;span class=&quot;t&quot;&gt;book value&lt;/span&gt;). Contiene le voci con &lt;b&gt;valore duraturo&lt;/b&gt;, che restano finché non vengono cedute. &lt;span class=&quot;src&quot;&gt;slide 97–98&lt;/span&gt;&lt;/p&gt;
&lt;h4&gt;Le tre sezioni e le definizioni&lt;/h4&gt;
&lt;details open&gt;&lt;summary&gt;Assets&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Due definizioni (slide 100): (1) risorse acquisite con transazioni e dotate di valore economico &lt;b&gt;futuro&lt;/b&gt;, compresi i costi pagati in anticipo e non ancora maturati (&lt;span class=&quot;t&quot;&gt;prepaid&lt;/span&gt; rent, insurance, advertising, legal fees); (2) la definizione di impostazione IASB: «a resource controlled by the entity as a result of past events and from which future economic benefits are expected to flow to the entity». Il beneficio futuro è il potenziale di contribuire ai flussi di cassa.&lt;/p&gt;
&lt;p&gt;Ordine delle classi (slide 101): &lt;span class=&quot;chip&quot;&gt;Current Assets&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Investments&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Property, Plant &amp;amp; Equipment&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Intangible Assets&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Other Assets&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Liabilities&lt;/summary&gt;&lt;div&gt;&lt;p&gt;«A present obligation of the entity arising from past events, the settlement of which is expected to result in an outflow of resources». Può essere legalmente vincolante (un contratto) o nascere dalla &lt;b&gt;prassi&lt;/b&gt; (per esempio la politica di riparare i guasti anche dopo la garanzia). Include anche gli incassi anticipati per servizi futuri. Spesso il nome contiene «payable». &lt;span class=&quot;src&quot;&gt;slide 99, 102–103&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Esempi: notes, accounts, salaries, wages, interest e income taxes payable; customer deposits; warranty liability; lawsuits payable; unearned revenues; bonds payable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Equity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;«The residual interest in the assets of an entity after deducting all its liabilities». Si suddivide in componenti con diritti o vincoli diversi, per esempio le &lt;b&gt;riserve&lt;/b&gt;, a volte imposte dalla legge per proteggere i creditori. Importante: l&#x27;equity contabile &lt;b&gt;difficilmente coincide col valore di mercato&lt;/b&gt; dell&#x27;impresa o con quanto si ricaverebbe vendendone i beni. &lt;span class=&quot;src&quot;&gt;slide 104–106&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Esempi: common e preferred stock, paid-in capital (in excess of par, from treasury stock), retained earnings.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h4&gt;Struttura e schema civilistico italiano&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;Liabilities &amp;amp; Owner&#x27;s equity&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Current assets&lt;/td&gt;&lt;td&gt;Current liabilities&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Investments&lt;/td&gt;&lt;td&gt;Long-term liabilities&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Property, plant &amp;amp; equipment&lt;/td&gt;&lt;td&gt;&lt;i&gt;Total liabilities&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Intangible assets&lt;/td&gt;&lt;td&gt;Owner&#x27;s equity&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Other assets&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td&gt;Total liabilities &amp;amp; equity&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;src&quot;&gt;slide 107 (struttura «internazionale», per liquidità decrescente)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Attivo (art. 2424 c.c.)&lt;/th&gt;&lt;th&gt;Passivo&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A) Crediti verso soci&lt;/td&gt;&lt;td&gt;A) Patrimonio netto (I capitale … IX utile d&#x27;esercizio)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;B) Immobilizzazioni: I immateriali, II materiali, III finanziarie&lt;/td&gt;&lt;td&gt;B) Fondi per rischi e oneri&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;C) Attivo circolante: I rimanenze, II crediti, III attività finanziarie, IV disponibilità liquide&lt;/td&gt;&lt;td&gt;C) Trattamento di fine rapporto&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;D) Ratei e risconti&lt;/td&gt;&lt;td&gt;D) Debiti · E) Ratei e risconti&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;src&quot;&gt;slide 109 (le slide traducono in inglese: Fixed assets, Current assets, Accruals and Prepayments…)&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Nota il contrasto: lo schema civilistico parte dalle immobilizzazioni (liquidità &lt;em&gt;crescente&lt;/em&gt;), quello delle slide 101 e 107 dalle attività correnti (liquidità decrescente). La logica resta la stessa (slide 110): &lt;b&gt;What we have&lt;/b&gt; (assets) = &lt;b&gt;Where it came from&lt;/b&gt; (liabilities + equity).&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;Il testo vigente dell&#x27;art. 2424 c.c. (contenuto dello stato patrimoniale) è consultabile su &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it&lt;/a&gt;. Il principio contabile &lt;b&gt;OIC 12&lt;/b&gt; dell&#x27;Organismo Italiano di Contabilità dettaglia composizione e schemi del bilancio civilistico: &lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/OIC-12-composizione-e-schemi-del-bilancio-desercizio.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC 12 (PDF)&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;L&#x27;income statement riporta la &lt;b&gt;redditività in un periodo&lt;/b&gt; (un anno, un trimestre, 13 settimane…). Le sue voci &lt;b&gt;non hanno valore duraturo&lt;/b&gt;: si consumano nell&#x27;esercizio, e i saldi ripartono da zero a ogni nuovo esercizio (a differenza di quelli del balance sheet). Componenti: &lt;b&gt;revenues, expenses, gains, losses&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 111–114&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Income&lt;/b&gt;&lt;br&gt;aumenti di benefici economici nel periodo (entrate o aumenti di attività, o diminuzioni di passività) che aumentano l&#x27;equity, &lt;em&gt;esclusi&lt;/em&gt; i conferimenti dei soci. Comprende &lt;b&gt;revenues&lt;/b&gt; (attività ordinaria: vendite, royalties, affitti, commissioni, interessi) e &lt;b&gt;gains&lt;/b&gt; (non ordinari, come la plusvalenza sulla vendita di un cespite, o non realizzati, come una rivalutazione). &lt;span class=&quot;src&quot;&gt;slide 115–116&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Expenses&lt;/b&gt;&lt;br&gt;diminuzioni di benefici economici (uscite o riduzioni di attività) che diminuiscono l&#x27;equity, &lt;em&gt;escluse&lt;/em&gt; le distribuzioni ai soci. Comprendono le spese ordinarie (salari, ammortamento, energia) e le &lt;b&gt;losses&lt;/b&gt;, anche non realizzate (per esempio sulle operazioni in valuta). &lt;span class=&quot;src&quot;&gt;slide 117&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Se ricavi e proventi meno costi e perdite è positivo, la &lt;span class=&quot;t&quot;&gt;bottom line&lt;/span&gt; è &lt;b&gt;net income&lt;/b&gt;; se è negativo è &lt;b&gt;net loss&lt;/b&gt;. Combinando le voci si ottengono più misure di performance: &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;profit before taxation&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;profit after taxation&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 114, 118&lt;/span&gt;&lt;/p&gt;
&lt;h4&gt;Due modi di classificare i costi&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;By nature&lt;/b&gt; (per natura, cioè per tipo di fattore) · slide 119&lt;br&gt;Sales revenues, other income · changes in inventories of finished goods and WIP · work performed and capitalised · raw materials · employee benefits · depreciation, amortisation, impairment · other expenses · finance costs · share of associates → &lt;b&gt;profit before tax&lt;/b&gt; − tax = &lt;b&gt;profit for the period&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;By destination / function&lt;/b&gt; (per destinazione, cioè per area aziendale) · slide 120&lt;br&gt;Sales revenue − &lt;b&gt;cost of sales&lt;/b&gt; = &lt;b&gt;gross profit&lt;/b&gt; − distribution costs − general and administrative ± other operating items − finance costs ± associates = &lt;b&gt;profit before income tax&lt;/b&gt; − tax = &lt;b&gt;profit for the period&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In entrambi l&#x27;utile finale si ripartisce tra &lt;span class=&quot;t&quot;&gt;minority interests&lt;/span&gt; (soci di minoranza delle controllate) ed &lt;span class=&quot;t&quot;&gt;equity holders of the parent&lt;/span&gt; (soci della capogruppo): è l&#x27;informativa dei bilanci consolidati.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;IAS 1 lascia scegliere tra natura e funzione ma &lt;b&gt;vieta di mescolarle&lt;/b&gt;; chi usa la funzione indica in nota ammortamenti e costo del personale. &lt;a href=&quot;https://www.cpdbox.com/ias-1-presentation-of-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CPDbox · IAS 1&lt;/a&gt;.&lt;/div&gt;
&lt;h4&gt;Lo schema italiano (art. 2425 c.c.) e il formato semplice&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Art. 2425 c.c. (slide 121)&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A) Valore della produzione&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B) Costi della produzione&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;A − B) Differenza (operating gross margin)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C) Proventi e oneri finanziari&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;D) Rettifiche di valore di attività finanziarie&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;E) Proventi e oneri straordinari &lt;b&gt;(vedi nota)&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Risultato prima delle imposte (EBT)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Imposte (correnti, differite, anticipate)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Utile (perdita) dell&#x27;esercizio&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Income statement format (slide 122)&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Revenue&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Cost of Goods Sold&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;= Gross Margin: ciò che resta per coprire le spese operative&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Expenses (operating costs consumed)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;= Net Income (Loss): variazione nell&#x27;anno di «quanto vale l&#x27;impresa»&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;b&gt;Aggiornamento normativo.&lt;/b&gt; La slide 121 riporta ancora l&#x27;area &lt;b&gt;E) straordinaria&lt;/b&gt;, che il D.Lgs. 139/2015 (bilanci dal 2016) ha &lt;b&gt;eliminato&lt;/b&gt; dall&#x27;art. 2425 c.c., riclassificandone le voci; l&#x27;area D oggi è «Rettifiche di valore di attività e passività finanziarie». Testo vigente: &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · art. 2425&lt;/a&gt;; sull&#x27;effetto della soppressione: &lt;a href=&quot;https://www.eutekne.info/Sezioni/Art_606692_eliminazione_dell_area_straordinaria_con_impatto_fiscale.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eutekne&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Lo &lt;b&gt;statement of cash flows&lt;/b&gt; spiega la variazione della cassa e degli equivalenti di cassa nel periodo, divisa in tre aree. &lt;span class=&quot;src&quot;&gt;slide 146&lt;/span&gt;&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Le tre aree del rendiconto finanziario che spiegano la variazione di cassa&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Operating&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;70&quot;&gt;cassa generata dalla&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;88&quot;&gt;gestione caratteristica&lt;/text&gt;
&lt;rect x=&quot;225&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Investing&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;70&quot;&gt;acquisti e vendite&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;88&quot;&gt;di attività a lungo termine&lt;/text&gt;
&lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Financing&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;70&quot;&gt;emissione di azioni o debito,&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;88&quot;&gt;rimborsi di passività&lt;/text&gt;
&lt;rect x=&quot;200&quot; y=&quot;150&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;178&quot; font-weight=&quot;600&quot;&gt;Δ Cash = O + I + F&lt;/text&gt;&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;105&quot; y1=&quot;110&quot; x2=&quot;250&quot; y2=&quot;150&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;110&quot; x2=&quot;320&quot; y2=&quot;148&quot;/&gt;&lt;line x1=&quot;535&quot; y1=&quot;110&quot; x2=&quot;390&quot; y2=&quot;150&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;Nell&#x27;&lt;a href=&quot;#esercizi&quot;&gt;esercizio della Library&lt;/a&gt; trovi un rendiconto ricostruito passo per passo.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;Riferimento: &lt;b&gt;IAS 7&lt;/b&gt;. Le operazioni senza movimento di cassa (per esempio un immobile conferito dai soci) restano fuori dal prospetto ma vanno illustrate a parte. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IAS 7&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Lo &lt;b&gt;statement of stockholders&#x27; equity&lt;/b&gt; elenca le variazioni del patrimonio netto nello stesso periodo dell&#x27;income statement e del cash flow statement: &lt;span class=&quot;t&quot;&gt;net income&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;other comprehensive income&lt;/span&gt; (utili e perdite rilevati direttamente nel patrimonio, per esempio da rivalutazioni), dividendi, riacquisto di azioni proprie, esercizio di stock option. &lt;span class=&quot;src&quot;&gt;slide 147&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Equity finale = Equity iniziale + conferimenti + net income ± OCI − dividendi − buyback&lt;/div&gt;
&lt;p&gt;È il prospetto che «chiude il cerchio» tra conto economico e stato patrimoniale: nel caso di Peter, 4 € di capitale + 1 € di utile = 5 € di equity.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 7&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un acconto ricevuto da un cliente per un servizio futuro è un&#x27;attività o una passività?&lt;/summary&gt;&lt;div&gt;Una passività (customer deposit / unearned revenue): l&#x27;impresa ha l&#x27;obbligo di rendere il servizio.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;equity contabile non è il «valore» dell&#x27;impresa?&lt;/summary&gt;&lt;div&gt;Perché deriva da valori di bilancio (spesso costi storici) e non dalla valutazione di mercato né dal prezzo di realizzo dei beni (slide 104).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel prospetto per destinazione dove trovi lo stipendio di un venditore? E in quello per natura?&lt;/summary&gt;&lt;div&gt;Per destinazione: tra i distribution costs. Per natura: nell&#x27;employee benefit expense.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Plusvalenza sulla vendita di un terreno: revenue o gain?&lt;/summary&gt;&lt;div&gt;Gain: è un provento che non nasce dall&#x27;attività ordinaria (slide 115).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;esercizi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 8 · Exercises&lt;/div&gt;
&lt;h2&gt;Esercizi guidati: «The Library» e il negozio&lt;/h2&gt;
&lt;h3&gt;A · The Library (2011)&lt;/h3&gt;
&lt;p&gt;Consegna (slide 123): riconoscere la &lt;b&gt;natura&lt;/b&gt; dei conti (A = Assets, L = Liabilities, OE = Owners&#x27; Equity, R = Revenues, E = Expenses) e preparare income statement e balance sheet al 31/12/2011. Prima prova da solo, poi scorri: per ogni passo ci sono la scrittura (soluzione slide 127) e i saldi progressivi.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;lib&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;lib-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Balance sheet 31/12/2011&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Non-current assets&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Building, net (4.000 − 200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Current assets&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18.100&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22.900&lt;/td&gt;&lt;/tr&gt;

&lt;details&gt;&lt;summary&gt;Note critiche sulla soluzione&lt;/summary&gt;&lt;div&gt;• La slide 128 mette i &lt;b&gt;bonds payable&lt;/b&gt; tra le current liabilities: di solito le obbligazioni sono non correnti, ma la consegna non indica la scadenza, quindi all&#x27;esame dichiara l&#x27;ipotesi.&lt;br&gt;• La plusvalenza sul terreno (7.000 − 6.000) è un &lt;em&gt;gain&lt;/em&gt;: per questo sta sotto il gross profit.&lt;br&gt;• L&#x27;ammortamento va in un fondo rettificativo (&lt;span class=&quot;t&quot;&gt;accumulated depreciation&lt;/span&gt;); l&#x27;edificio si espone al netto.&lt;br&gt;• Verifica: 20.000 + 900 + 2.000 = 22.900 = totale attivo.&lt;/div&gt;&lt;/details&gt;

&lt;p class=&quot;note&quot;&gt;L&#x27;edificio conferito (4.000) e l&#x27;ammortamento (200) non muovono cassa: per IAS 7 il conferimento in natura si indica a parte. Nota come l&#x27;utile (900) e la variazione di cassa (18.100) siano numeri molto diversi: è l&#x27;&lt;a href=&quot;#qualita&quot;&gt;accrual basis&lt;/a&gt; in azione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;B · Il negozio al dettaglio: resources e claims&lt;/h3&gt;
&lt;p&gt;Un&#x27;impresa nasce con 100.000 € di capitale (slide 131–133): la cassa è una &lt;span class=&quot;t&quot;&gt;resource&lt;/span&gt;, il capitale un &lt;span class=&quot;t&quot;&gt;claim&lt;/span&gt; del proprietario. Segui l&#x27;effetto di ogni transazione (importi in migliaia). Clicca «Avanti» per aggiungere una riga.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;shop&quot;&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 8&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Nella transazione 4 del negozio, perché l&#x27;owner aumenta di 20 e non di 35?&lt;/summary&gt;&lt;div&gt;Perché il ricavo (35) è accompagnato dall&#x27;uscita di merce al costo (1/3 di 45 = 15): l&#x27;utile è 35 − 15 = 20, ed è l&#x27;utile che accresce l&#x27;equity.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quadra il negozio? Somma resources e claims.&lt;/summary&gt;&lt;div&gt;Resources 67 + 19 + 105 = 191; claims 75 + 116 = 191. Sì.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Library, 8 giugno: perché due scritture?&lt;/summary&gt;&lt;div&gt;Con il &lt;span class=&quot;t&quot;&gt;perpetual inventory system&lt;/span&gt; si rileva subito sia il ricavo (Dr A/R 1.200 / Cr Sales 1.200) sia lo scarico di magazzino al costo (Dr COGS 1.000 / Cr Inventory 1.000): metà dei libri comprati a 2.000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che natura ha il conto «Accumulated depreciation»?&lt;/summary&gt;&lt;div&gt;È un conto rettificativo dell&#x27;attivo (contra-asset): ha saldo avere e si sottrae dal costo dell&#x27;edificio.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part sage&quot; id=&quot;stakeholders&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 9 · Users of financial reports&lt;/div&gt;
&lt;h2&gt;Gli stakeholders: chi legge il bilancio e cosa cerca&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt;: una persona, un gruppo o un&#x27;organizzazione che ha un interesse (&lt;span class=&quot;t&quot;&gt;interest or concern&lt;/span&gt;) in un&#x27;organizzazione. &lt;span class=&quot;src&quot;&gt;slide 74&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Clicca su un gruppo per vedere le sue domande al bilancio. &lt;span class=&quot;src&quot;&gt;slide 73–82&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;svg id=&quot;shsvg&quot; viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;Mappa radiale degli stakeholder intorno all&#x27;impresa&quot;&gt;&lt;/svg&gt;
&lt;div id=&quot;sh-out&quot; class=&quot;def&quot; aria-live=&quot;polite&quot;&gt;&lt;b&gt;Seleziona uno stakeholder&lt;/b&gt;&lt;br&gt;Ogni gruppo ha bisogni informativi diversi: per questo la &lt;a href=&quot;#qualita&quot;&gt;relevance&lt;/a&gt; dipende dall&#x27;utente.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Parte 9&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quale stakeholder controlla che non siano stati violati i covenant, come un rapporto debt/equity massimo?&lt;/summary&gt;&lt;div&gt;I lenders (finanziatori terzi): verificano anche che le garanzie mantengano un valore adeguato.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Per quale gruppo le slide dicono che il bilancio non risponde ancora bene ai bisogni informativi?&lt;/summary&gt;&lt;div&gt;Il pubblico (public): occupazione, inquinamento, salute e sicurezza sono poco coperti dal bilancio finanziario. È il ponte verso il reporting di sostenibilità (ESG, &lt;a href=&quot;#standards&quot;&gt;Parte 11&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché lo Stato è interessato al bilancio?&lt;/summary&gt;&lt;div&gt;Perché il risultato contabile è il punto di partenza per calcolare il reddito imponibile, e per verificare il rispetto delle leggi a tutela di soci, creditori e ambiente.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;qualita&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Parte 10 · Assumptions &amp;amp; qualitative characteristics&lt;/div&gt;
&lt;h2&gt;Ipotesi di base e qualità dell&#x27;informazione&lt;/h2&gt;
&lt;h3&gt;Le due assumptions di fondo&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Going concern&lt;/b&gt; (continuità aziendale)&lt;br&gt;si presume che l&#x27;entità continui a operare nel futuro prevedibile, di solito almeno un anno. Per questo ha senso valutare i beni per il loro uso e non per il prezzo di liquidazione.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accruals accounting&lt;/b&gt; (competenza economica)&lt;br&gt;gli effetti delle transazioni si rilevano quando avvengono e si attribuiscono al periodo a cui si riferiscono, &lt;em&gt;indipendentemente&lt;/em&gt; da quando si incassa o si paga.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slide 84&lt;/p&gt;
&lt;p&gt;Nella realtà, dicono le slide, il risultato va calcolato secondo l&#x27;&lt;span class=&quot;t&quot;&gt;accrual basis&lt;/span&gt; e un &lt;span class=&quot;t&quot;&gt;framework&lt;/span&gt; di principi: servono &lt;b&gt;adjusting entries&lt;/b&gt; (scritture di assestamento) perché i ricavi esprimano ciò che si è venduto nel periodo e i costi ciò che si è consumato per produrlo. Esempi: &lt;span class=&quot;chip&quot;&gt;inventories&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;amortization&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;provisions for future expenses&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 134&lt;/span&gt;&lt;/p&gt;

&lt;h4&gt;Prova la competenza: un premio assicurativo annuale&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Esempio costruito per questo riassunto. Paghi 1.200 € per 12 mesi di copertura; l&#x27;esercizio va da gennaio a dicembre. Sposta il mese di pagamento.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;label class=&quot;sliders&quot; style=&quot;display:block&quot;&gt;Pagamento a inizio mese: &lt;output id=&quot;o-acc&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-acc&quot; min=&quot;1&quot; max=&quot;12&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;accsvg&quot; viewBox=&quot;0 0 560 210&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra costo per cassa e costo per competenza&quot;&gt;&lt;/svg&gt;
&lt;p id=&quot;acc-txt&quot; class=&quot;note&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
