&lt;tr data-r=&quot;1&quot;&gt;&lt;td&gt;1 · Bank loan&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;2&quot;&gt;&lt;td&gt;2 · Purchase of premises&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+50&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;3&quot;&gt;&lt;td&gt;3 · Goods paid in cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−45&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+45&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;4&quot;&gt;&lt;td&gt;4 · Sells 1/3 of the goods on credit for 35&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+35&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−15&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+20&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;5&quot;&gt;&lt;td&gt;5 · Wages paid&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−4&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−4&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;6&quot;&gt;&lt;td&gt;6 · The customer pays 16&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+16&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−16&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;7&quot;&gt;&lt;td&gt;7 · Goods bought on credit&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+25&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;8&quot; class=&quot;tot&quot;&gt;&lt;td&gt;Totals&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;67&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;105&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;116&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;shop-note&quot; class=&quot;note&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 8&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;In the shop&#x27;s transaction 4, why does the owner&#x27;s claim increase by 20 and not by 35?&lt;/summary&gt;&lt;div&gt;Because the revenue (35) is accompanied by the outflow of goods at cost (1/3 of 45 = 15): profit is 35 − 15 = 20, and it is profit that increases equity.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does the shop balance? Add up resources and claims.&lt;/summary&gt;&lt;div&gt;Resources 67 + 19 + 105 = 191; claims 75 + 116 = 191. Yes.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Library, 8 June: why two entries?&lt;/summary&gt;&lt;div&gt;Under the &lt;span class=&quot;t&quot;&gt;perpetual inventory system&lt;/span&gt; both the revenue (Dr A/R 1,200 / Cr Sales 1,200) and the release of inventory at cost (Dr COGS 1,000 / Cr Inventory 1,000) are recognised immediately: half of the books bought for 2,000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the nature of the “Accumulated depreciation” account?&lt;/summary&gt;&lt;div&gt;It is a contra-asset account: it has a credit balance and is deducted from the cost of the building.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part sage&quot; id=&quot;stakeholders&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 9 · Users of financial reports&lt;/div&gt;
&lt;h2&gt;Stakeholders: who reads the financial statements and what they look for&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stakeholder&lt;/b&gt;: a person, group or organisation that has an &lt;span class=&quot;t&quot;&gt;interest or concern&lt;/span&gt; in an organisation. &lt;span class=&quot;src&quot;&gt;slide 74&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Click a group to see the questions it asks of the financial statements. &lt;span class=&quot;src&quot;&gt;slides 73–82&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;svg id=&quot;shsvg&quot; viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;Radial map of the stakeholders around the business&quot;&gt;&lt;/svg&gt;
&lt;div id=&quot;sh-out&quot; class=&quot;def&quot; aria-live=&quot;polite&quot;&gt;&lt;b&gt;Select a stakeholder&lt;/b&gt;&lt;br&gt;Each group has different information needs: this is why &lt;a href=&quot;#qualita&quot;&gt;relevance&lt;/a&gt; depends on the user.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 9&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Which stakeholder checks that covenants, such as a maximum debt/equity ratio, have not been breached?&lt;/summary&gt;&lt;div&gt;Lenders (third-party providers of finance): they also check that collateral retains adequate value.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;For which group do the slides say that financial statements do not yet meet information needs well?&lt;/summary&gt;&lt;div&gt;The public: employment, pollution, health and safety are poorly covered by financial statements. This is the bridge to sustainability reporting (ESG, &lt;a href=&quot;#standards&quot;&gt;Part 11&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the government interested in financial statements?&lt;/summary&gt;&lt;div&gt;Because the accounting result is the starting point for calculating taxable income, and for checking compliance with laws protecting shareholders, creditors and the environment.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;qualita&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 10 · Assumptions &amp;amp; qualitative characteristics&lt;/div&gt;
&lt;h2&gt;Underlying assumptions and the qualities of information&lt;/h2&gt;
&lt;h3&gt;The two underlying assumptions&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Going concern&lt;/b&gt;&lt;br&gt;the entity is assumed to continue operating for the foreseeable future, usually at least one year. This is why it makes sense to measure assets by their use rather than by their liquidation price.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accruals accounting&lt;/b&gt;&lt;br&gt;the effects of transactions are recognised when they occur and are attributed to the period to which they relate, &lt;em&gt;regardless&lt;/em&gt; of when cash is received or paid.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slide 84&lt;/p&gt;
&lt;p&gt;In practice, the slides say, profit must be calculated on an &lt;span class=&quot;t&quot;&gt;accrual basis&lt;/span&gt; and within a &lt;span class=&quot;t&quot;&gt;framework&lt;/span&gt; of principles: &lt;b&gt;adjusting entries&lt;/b&gt; are needed so that revenues reflect what was sold in the period and costs reflect what was consumed to produce it. Examples: &lt;span class=&quot;chip&quot;&gt;inventories&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;amortization&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;provisions for future expenses&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 134&lt;/span&gt;&lt;/p&gt;

&lt;h4&gt;Try accruals: an annual insurance premium&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Example built for this summary. You pay €1,200 for 12 months of cover; the financial year runs from January to December. Move the month of payment.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;label class=&quot;sliders&quot; style=&quot;display:block&quot;&gt;Payment at the start of: &lt;output id=&quot;o-acc&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-acc&quot; min=&quot;1&quot; max=&quot;12&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;accsvg&quot; viewBox=&quot;0 0 560 210&quot; role=&quot;img&quot; aria-label=&quot;Comparison between cash-basis and accrual-basis expense&quot;&gt;&lt;/svg&gt;
&lt;p id=&quot;acc-txt&quot; class=&quot;note&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Qualitative characteristics of useful financial information&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 820 300&quot; role=&quot;img&quot; aria-labelledby=&quot;qct&quot;&gt;&lt;title id=&quot;qct&quot;&gt;Tree of the qualitative characteristics according to the slides&lt;/title&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;300&quot; y=&quot;8&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;33&quot; font-weight=&quot;600&quot;&gt;Useful financial information&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;90&quot; width=&quot;230&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;115&quot; font-weight=&quot;600&quot;&gt;Relevance&lt;/text&gt;
&lt;rect x=&quot;290&quot; y=&quot;90&quot; width=&quot;240&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;115&quot; font-weight=&quot;600&quot;&gt;Faithful representation&lt;/text&gt;
&lt;rect x=&quot;570&quot; y=&quot;90&quot; width=&quot;230&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;685&quot; y=&quot;115&quot; font-weight=&quot;600&quot;&gt;Other qualities&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;
&lt;text x=&quot;135&quot; y=&quot;160&quot;&gt;nature&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;180&quot;&gt;materiality&lt;/text&gt;&lt;text x=&quot;135&quot; y=&quot;200&quot;&gt;timeliness&lt;/text&gt;
&lt;text x=&quot;410&quot; y=&quot;160&quot;&gt;completeness&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;180&quot;&gt;neutrality&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;200&quot;&gt;freedom from error&lt;/text&gt;
&lt;text x=&quot;685&quot; y=&quot;160&quot;&gt;comparability&lt;/text&gt;&lt;text x=&quot;685&quot; y=&quot;180&quot;&gt;verifiability&lt;/text&gt;&lt;text x=&quot;685&quot; y=&quot;197&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;substance over form · prudence&lt;/text&gt;&lt;text x=&quot;685&quot; y=&quot;217&quot;&gt;timeliness&lt;/text&gt;&lt;text x=&quot;685&quot; y=&quot;237&quot;&gt;understandability&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; fill=&quot;none&quot; stroke-width=&quot;1.4&quot;&gt;&lt;path d=&quot;M410,48 V70 H135 V90&quot;/&gt;&lt;path d=&quot;M410,48 V90&quot;/&gt;&lt;path d=&quot;M410,70 H685 V90&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;410&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;green = fundamental · slate = the other characteristics listed on slides 135–145&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Relevance&lt;/summary&gt;&lt;div&gt;Information is relevant if it &lt;b&gt;influences decisions&lt;/b&gt;: it helps users evaluate past, present or future events, or confirms or corrects their past evaluations. Needs vary across groups and over time; historical data serve as a basis for forecasts. Information can be relevant by its &lt;b&gt;nature&lt;/b&gt; (a high-profile lawsuit, starting operations in an unstable country) or by its &lt;b&gt;materiality&lt;/b&gt;: information is &lt;span class=&quot;t&quot;&gt;material&lt;/span&gt; if omitting or misstating it could influence decisions. Timeliness is also required. &lt;span class=&quot;src&quot;&gt;slides 135–138&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Faithful representation&lt;/summary&gt;&lt;div&gt;Transactions must be represented faithfully, maximising &lt;b&gt;completeness&lt;/b&gt; (an omission can make information misleading), &lt;b&gt;neutrality&lt;/b&gt; (absence of bias, supported by neutral standards) and &lt;b&gt;freedom from error&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 139–140&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Comparability&lt;/summary&gt;&lt;div&gt;Consistency in accounting policies, so that the business can be compared over time and with other businesses; users must be able to identify changes in policy and differences between businesses. &lt;span class=&quot;src&quot;&gt;slide 141&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Verifiability: substance over form and prudence&lt;/summary&gt;&lt;div&gt;It provides assurance that the representation is faithful and is strengthened by independent audit. It implies &lt;b&gt;substance over form&lt;/b&gt; (economic reality matters, not legal form) and &lt;b&gt;prudence&lt;/b&gt;: caution in estimates (inventory, useful lives, receivables), which however does not justify excessive provisions, overstated liabilities or understated assets and income. &lt;span class=&quot;src&quot;&gt;slides 142–143&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Timeliness and understandability&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Timeliness&lt;/b&gt;: usefulness declines if information arrives late or at intervals that are too long. &lt;b&gt;Understandability&lt;/b&gt;: users are assumed to be knowledgeable and diligent; complex matters are not omitted, but too much detail is as much a flaw as too little. &lt;span class=&quot;src&quot;&gt;slides 144–145&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;ext&quot;&gt;In the &lt;b&gt;2018 IASB Conceptual Framework&lt;/b&gt; the &lt;em&gt;fundamental&lt;/em&gt; characteristics are relevance (predictive and/or confirmatory value; materiality is an aspect of it) and faithful representation; comparability, verifiability, timeliness and understandability are &lt;em&gt;enhancing&lt;/em&gt; characteristics and cannot make useful information that is not. &lt;b&gt;Prudence&lt;/b&gt; is reintroduced in support of neutrality, economic substance falls within faithful representation, and &lt;b&gt;cost&lt;/b&gt; is a pervasive constraint. &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · Conceptual Framework 2018&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/-/media/project/conceptual-framework/fact-sheet-project-summary-and-feedback-statement/conceptual-framework-project-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB · Project summary (PDF)&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 10&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A lease that is legally a rental but economically equivalent to buying the asset in instalments: which principle guides its accounting treatment?&lt;/summary&gt;&lt;div&gt;Substance over form: the economic reality (a financed purchase) is represented, not the legal form.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is setting aside a provision that is “generous, just to be safe” an example of prudence?&lt;/summary&gt;&lt;div&gt;No: prudence does not justify excessive provisions or overstated liabilities (slide 143), which would breach neutrality.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In November you pay the rent for November–January. How much expense belongs to the financial year ending in December?&lt;/summary&gt;&lt;div&gt;Two months out of three (November and December). The third month is a prepayment (prepaid expense), an asset at year end.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does it mean for information to be “material”?&lt;/summary&gt;&lt;div&gt;That omitting or misstating it could influence users&#x27; decisions.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;standards&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 11 · Accounting practice, standards, ESG&lt;/div&gt;
&lt;h2&gt;The rules of the game: GAAP, standards, harmonization&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;GAAP&lt;/b&gt; (Generally Accepted Accounting Principles): the framework of guidelines for financial accounting in a given jurisdiction, i.e. the standards, conventions and rules for recording, summarizing and preparing financial statements. They establish: which events to record; how to account for them; the measurement bases for assets and liabilities; the presentation criteria; the content of the notes. &lt;span class=&quot;src&quot;&gt;slide 148&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting standard&lt;/b&gt;: a rule or set of rules prescribing how financial statements are to be prepared and presented. It is issued by a national or international professional body, applies to financial statements intended to give a &lt;span class=&quot;t&quot;&gt;true and fair view&lt;/span&gt;, and operates within the law, covering areas on which the law is silent. &lt;span class=&quot;src&quot;&gt;slide 149&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 380 230&quot; role=&quot;img&quot; aria-label=&quot;Relationship between accounting practice and legislation&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;110&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;37&quot; font-weight=&quot;600&quot;&gt;Accounting practice&lt;/text&gt;
&lt;rect x=&quot;110&quot; y=&quot;170&quot; width=&quot;160&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;197&quot; font-weight=&quot;600&quot;&gt;Jurisdiction (law)&lt;/text&gt;
&lt;text x=&quot;55&quot; y=&quot;118&quot;&gt;help to&lt;/text&gt;&lt;text x=&quot;55&quot; y=&quot;134&quot;&gt;interpret&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;126&quot;&gt;integrate&lt;/text&gt;&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M110,32 H55 V100&quot;/&gt;&lt;path d=&quot;M55,142 V192 H108&quot;/&gt;&lt;path d=&quot;M270,32 H325 V110&quot;/&gt;&lt;path d=&quot;M325,135 V192 H272&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Accounting practice helps to interpret the law and supplements it (slide 150).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;p&gt;Globalisation, internationalisation and economic integration multiply exchanges and the need for information on which to base decisions: everything pushes towards &lt;b&gt;accounting harmonization&lt;/b&gt;, i.e. financial statements that are comparable across countries. &lt;span class=&quot;src&quot;&gt;slide 151&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;In the EU the decisive step is &lt;b&gt;Regulation (EC) No 1606/2002&lt;/b&gt;, which requires IAS/IFRS for the consolidated financial statements of listed companies: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;. In the US, GAAP are collected in the &lt;b&gt;FASB Accounting Standards Codification&lt;/b&gt; (see Further reading).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Non-financial reporting · ESG&lt;/h3&gt;
&lt;p&gt;The slides close with the &lt;b&gt;Corporate Sustainability Reporting Directive&lt;/b&gt; (CSRD, EU Directive 2022/2464): reporting on environmental, social and governance (ESG) matters alongside financial reporting. Below is the table from the slides and, next to it, the current status. &lt;span class=&quot;src&quot;&gt;slide 152&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;In the slides&lt;/th&gt;&lt;th&gt;Update (external source, October 2026)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Who does it apply to?&lt;/td&gt;&lt;td&gt;Companies meeting at least 2 of 3 criteria: &amp;gt;250 employees, &amp;gt;€40m turnover, &amp;gt;€20m total assets; listed SMEs&lt;/td&gt;&lt;td&gt;The &lt;b&gt;Omnibus I Directive (EU) 2026/470&lt;/b&gt; narrows the scope to companies with &lt;b&gt;more than 1,000 employees and more than €450m turnover&lt;/b&gt; (both criteria); listed SMEs are excluded. It applies to financial years beginning on or after 1/1/2027.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;How many companies?&lt;/td&gt;&lt;td&gt;About 50,000&lt;/td&gt;&lt;td&gt;Scope reduced by about 80% according to industry estimates.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Which standards?&lt;/td&gt;&lt;td&gt;“EFRS”&lt;/td&gt;&lt;td&gt;They are EFRAG&#x27;s &lt;b&gt;ESRS&lt;/b&gt; (European Sustainability Reporting Standards); the simplified version appears to have been adopted in 2026, to apply from 2027 financial years.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Publication and assurance&lt;/td&gt;&lt;td&gt;In the management report; assurance by an independent third party, requirements being defined&lt;/td&gt;&lt;td&gt;Substantially unchanged.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 11&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the relationship between accounting standards and the law?&lt;/summary&gt;&lt;div&gt;Standards operate within the legislative framework: they help to interpret it and supplement it where the law is silent (slides 149–150).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What drives accounting harmonization?&lt;/summary&gt;&lt;div&gt;Globalisation, internationalisation and economic integration: more exchanges and a greater need for comparable information for decision-making.&lt;/div&gt;&lt;/details&gt;

&lt;section class=&quot;part brick refs&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Further reading&lt;/div&gt;
&lt;h2&gt;Laws, standards and texts cited in the slides&lt;/h2&gt;
&lt;p class=&quot;note&quot;&gt;The slides do not cite authors or academic studies: their references are laws and standards, either explicitly (Arts. 2424 and 2425 of the Italian Civil Code, GAAP, CSRD, “EFRS”) or implicitly (the definitions of asset, liability, equity, income and expense and the qualitative characteristics come from the IASB Conceptual Framework; the list of statements from IAS 1; the three cash flow areas from IAS 7). Everything below is an &lt;b&gt;external source&lt;/b&gt;.&lt;/p&gt;

&lt;article&gt;&lt;h4&gt;Conceptual Framework for Financial Reporting (IASB, 2018)&lt;/h4&gt;
&lt;p&gt;Objective of financial reporting, qualitative characteristics, elements (asset, liability, equity, income, expenses), recognition and measurement. &lt;b&gt;Why it matters&lt;/b&gt;: it is the source of the definitions in Parts 7 and 10 and of the “framework” on slide 134. &lt;a href=&quot;https://www.iasplus.com/standard/framewk.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://accaglobal.com/an/en/student/exam-support-resources/professional-exams-study-resources/strategic-business-reporting/technical-articles/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ACCA article&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;IAS 1 Presentation of Financial Statements → IFRS 18 (from 2027)&lt;/h4&gt;
&lt;p&gt;IAS 1 sets out the complete set of financial statements and the choice between classifying expenses by nature or by function; IFRS 18 replaces it from 2027 with mandatory categories and subtotals. &lt;b&gt;Why it matters&lt;/b&gt;: the formats on slides 119–120 are about to change. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18&lt;/a&gt; · &lt;a href=&quot;https://www.cpdbox.com/ias-1-presentation-of-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 1 summary&lt;/a&gt; · &lt;a href=&quot;https://ey.com/en_gl/ifrs-technical-resources/applying-ifrs-a-closer-look-at-ifrs-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EY on IFRS 18&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;IAS 7 Statement of Cash Flows&lt;/h4&gt;
&lt;p&gt;Defines operating, investing and financing activities and requires non-cash transactions to be disclosed separately. &lt;b&gt;Why it matters&lt;/b&gt;: it underlies slide 146 and the extra exercise on the Library. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IAS 7&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/standard/ias07.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;Italian Civil Code, Arts. 2424 and 2425 · Legislative Decree 139/2015 · OIC 12&lt;/h4&gt;
&lt;p&gt;Mandatory statutory formats for the balance sheet and income statement; Legislative Decree 139/2015 removed the extraordinary items section; OIC 12 interprets them. &lt;b&gt;Why it matters&lt;/b&gt;: slide 121 predates the reform. &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2424&lt;/a&gt; · &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 2425&lt;/a&gt; · &lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/OIC-12-composizione-e-schemi-del-bilancio-desercizio.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC 12 (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.eutekne.info/Sezioni/Art_606692_eliminazione_dell_area_straordinaria_con_impatto_fiscale.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eutekne on the extraordinary items section&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;GAAP · FASB Accounting Standards Codification&lt;/h4&gt;
&lt;p&gt;Since 2009 it has been the single authoritative source of non-governmental US GAAP (SEC rules remain separate). &lt;b&gt;Why it matters&lt;/b&gt;: GAAP (slide 148) depend on the jurisdiction, and US GAAP are the main benchmark for IFRS. &lt;a href=&quot;https://kenanflaglerresearchtools.web.unc.edu/research-resource/fasb-accounting-standards-codification/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNC research guide&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/resources/regional/fasb&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus · FASB&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;Regulation (EC) No 1606/2002&lt;/h4&gt;
&lt;p&gt;The regulation through which the EU adopted international accounting standards to improve the transparency and comparability of financial statements and the functioning of the capital market. &lt;b&gt;Why it matters&lt;/b&gt;: it is the European regulatory response to the push towards harmonization described on slide 151. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2002/1606/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

&lt;article&gt;&lt;h4&gt;CSRD (EU Directive 2022/2464), Omnibus I (2026/470) and ESRS&lt;/h4&gt;
&lt;p&gt;Sustainability reporting in the management report, in accordance with ESRS and subject to external assurance; Omnibus I has narrowed its scope. &lt;b&gt;Why it matters&lt;/b&gt;: the figures on slide 152 are out of date. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CSRD&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202600470&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Omnibus I&lt;/a&gt; · &lt;a href=&quot;https://www.lw.com/en/insights/eu-sustainability-omnibus-published-in-the-official-journal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Latham &amp;amp; Watkins&lt;/a&gt; · &lt;a href=&quot;https://viewpoint.pwc.com/gx/en/pwc/in-briefs/2026/ib_int202617.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC · Simplified ESRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
const $=(s,r=document)=&gt;r.querySelector(s), $$=(s,r=document)=&gt;Array.from(r.querySelectorAll(s));
const f=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);

// tabs
$$(&#x27;.tabs&#x27;).forEach(t=&gt;{
  const b=$$(&#x27;[role=tab]&#x27;,t), p=$$(&#x27;:scope&gt;[role=tabpanel]&#x27;,t);
  b.forEach((x,i)=&gt;x.addEventListener(&#x27;click&#x27;,()=&gt;b.forEach((y,j)=&gt;{y.setAttribute(&#x27;aria-selected&#x27;,i===j);p[j].hidden=i!==j;})));
});

// step-through panels
function stepper(el,n,render){
  let i=0; const pv=$(&#x27;.prev&#x27;,el), nx=$(&#x27;.next&#x27;,el), c=$(&#x27;.cnt&#x27;,el);
  function go(){c.textContent=&#x27;Step &#x27;+(i+1)+&#x27; of &#x27;+n; pv.disabled=i===0; nx.disabled=i===n-1; render(i);}
  pv.addEventListener(&#x27;click&#x27;,()=&gt;{if(i&gt;0){i--;go();}});
  nx.addEventListener(&#x27;click&#x27;,()=&gt;{if(i&lt;n-1){i++;go();}});
  go();
}
$$(&#x27;.stepper&#x27;).forEach(s=&gt;{if(s.id)return; const st=$$(&#x27;.step&#x27;,s); stepper(s,st.length,i=&gt;st.forEach((x,j)=&gt;x.hidden=j!==i));});

// accounting equation with sliders
const eq={ca:$(&#x27;#s-ca&#x27;),fa:$(&#x27;#s-fa&#x27;),cl:$(&#x27;#s-cl&#x27;),ll:$(&#x27;#s-ll&#x27;)};
function bar(x,y,w,h,fill,lab){
  if(h&lt;=0)return &#x27;&#x27;;
  return `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; fill=&quot;${fill}&quot;/&gt;`+
    (h&gt;17?`&lt;text x=&quot;${x+w/2}&quot; y=&quot;${y+h/2+5}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; style=&quot;fill:var(--paper)&quot;&gt;${lab}&lt;/text&gt;`:&#x27;&#x27;);
}
function drawEq(){
  const v={}; for(const k in eq){v[k]=+eq[k].value; $(&#x27;#o-&#x27;+k).textContent=v[k];}
  const A=v.ca+v.fa, L=v.cl+v.ll, E=A-L, k=0.6, B=275;
  let s=`&lt;defs&gt;&lt;pattern id=&quot;hatch&quot; width=&quot;8&quot; height=&quot;8&quot; patternUnits=&quot;userSpaceOnUse&quot; patternTransform=&quot;rotate(45)&quot;&gt;&lt;rect width=&quot;8&quot; height=&quot;8&quot; fill=&quot;none&quot;/&gt;&lt;line x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;8&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;3&quot;/&gt;&lt;/pattern&gt;&lt;/defs&gt;`;
  s+=`&lt;line x1=&quot;20&quot; y1=&quot;${B}&quot; x2=&quot;500&quot; y2=&quot;${B}&quot; stroke=&quot;var(--rule)&quot;/&gt;`;
  s+=bar(70,B-v.fa*k,150,v.fa*k,&#x27;var(--slate)&#x27;,&#x27;Fixed &#x27;+v.fa);
  s+=bar(70,B-A*k,150,v.ca*k,&#x27;var(--sage)&#x27;,&#x27;Current &#x27;+v.ca);
  s+=bar(300,B-v.ll*k,150,v.ll*k,&#x27;var(--brick)&#x27;,&#x27;Long-term &#x27;+v.ll);
  s+=bar(300,B-L*k,150,v.cl*k,&#x27;var(--ochre)&#x27;,&#x27;Current liab. &#x27;+v.cl);
  if(E&gt;=0) s+=bar(300,B-A*k,150,E*k,&#x27;var(--accent)&#x27;,&#x27;Equity &#x27;+E);
  else s+=`&lt;rect x=&quot;300&quot; y=&quot;${B-L*k}&quot; width=&quot;150&quot; height=&quot;${-E*k}&quot; fill=&quot;url(#hatch)&quot; stroke=&quot;var(--bad)&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;${B-(L+A)/2*k+4}&quot; font-size=&quot;12&quot; style=&quot;fill:var(--bad)&quot;&gt;equity ${E}&lt;/text&gt;`;
  s+=`&lt;line x1=&quot;60&quot; y1=&quot;${B-A*k}&quot; x2=&quot;470&quot; y2=&quot;${B-A*k}&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`;
  s+=`&lt;text x=&quot;145&quot; y=&quot;${B-A*k-8}&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Assets ${A}&lt;/text&gt;`;
  s+=`&lt;text x=&quot;375&quot; y=&quot;${B-Math.max(A,L)*k-8}&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;L ${L} + E ${E} = ${A}&lt;/text&gt;`;
  $(&#x27;#eqsvg&#x27;).innerHTML=s;
  const st=$(&#x27;#eqstatus&#x27;); const msg=[];
  if(E&lt;0) msg.push(&#x27;&lt;b&gt;Negative equity&lt;/b&gt;: liabilities exceed assets, and equity has been eroded.&#x27;);
  if(v.cl&gt;v.ca) msg.push(&#x27;&lt;b&gt;Warning sign&lt;/b&gt;: current liabilities (&#x27;+v.cl+&#x27;) &amp;gt; current assets (&#x27;+v.ca+&#x27;). The business risks being unable to pay its short-term debts (slide 67).&#x27;);
  st.className=&#x27;status &#x27;+(msg.length?&#x27;warn&#x27;:&#x27;good&#x27;);
  st.innerHTML=msg.length?msg.join(&#x27;&lt;br&gt;&#x27;):&#x27;In balance: Assets = Liabilities + Equity, and current assets cover current liabilities.&#x27;;
}
if(eq.ca){Object.values(eq).forEach(i=&gt;i.addEventListener(&#x27;input&#x27;,drawEq)); drawEq();}

// Peter&#x27;s case
const P=[
 {t:&#x27;Setting up the company&#x27;,d:&#x27;Peter and his friend each deposit €2 in the bank. The assets are €4 of cash, which comes from the two partners\&#x27; savings (slides 14–16).&#x27;,u:[[&#x27;Cash&#x27;,4]],s:[[&#x27;Equity&#x27;,4]],c:[],r:[]},
 {t:&#x27;Buying the bread · €2&#x27;,d:&#x27;Peter buys the bread, paying €2. Only the uses change: part of the cash becomes bread. The sources stay the same (slides 17, 21).&#x27;,u:[[&#x27;Cash&#x27;,2],[&#x27;Bread&#x27;,2]],s:[[&#x27;Equity&#x27;,4]],c:[],r:[]},
 {t:&#x27;Loan from his father · €11&#x27;,d:&#x27;The initial resources are not enough: his father lends him €11. A new source (financial debts) and a new use (cash) come in together (slides 17–19).&#x27;,u:[[&#x27;Cash&#x27;,13],[&#x27;Bread&#x27;,2]],s:[[&#x27;Equity&#x27;,4],[&#x27;Financial debts&#x27;,11]],c:[],r:[]},
 {t:&#x27;Buying the ham · €8&#x27;,d:&#x27;With the money obtained, Peter buys €8 of ham (slide 20).&#x27;,u:[[&#x27;Cash&#x27;,5],[&#x27;Bread&#x27;,2],[&#x27;Ham&#x27;,8]],s:[[&#x27;Equity&#x27;,4],[&#x27;Financial debts&#x27;,11]],c:[],r:[]},
 {t:&#x27;Buying the knife · €4&#x27;,d:&#x27;Without a knife it is hard to cut the sandwiches: the partners buy a €4 knife to improve the product (slides 20, 22).&#x27;,u:[[&#x27;Cash&#x27;,1],[&#x27;Bread&#x27;,2],[&#x27;Ham&#x27;,8],[&#x27;Equipment (knife)&#x27;,4]],s:[[&#x27;Equity&#x27;,4],[&#x27;Financial debts&#x27;,11]],c:[],r:[]},
 {t:&#x27;Making the sandwiches&#x27;,d:&#x27;Bread and ham are consumed: they leave the balance sheet and become “purchase costs of raw materials” (€10) in the income statement. The knife remains, because it is an instrumental good (slides 23–24). The balance sheet alone no longer balances.&#x27;,u:[[&#x27;Cash&#x27;,1],[&#x27;Equipment&#x27;,4]],s:[[&#x27;Equity&#x27;,4],[&#x27;Financial debts&#x27;,11]],c:[[&#x27;Raw materials&#x27;,10]],r:[]},
 {t:&#x27;Sale · €11&#x27;,d:&#x27;Peter sells the sandwiches to two customers, collecting €11 (slide 24). Cash rises to €12; revenues are €11.&#x27;,u:[[&#x27;Cash&#x27;,12],[&#x27;Equipment&#x27;,4]],s:[[&#x27;Equity&#x27;,4],[&#x27;Financial debts&#x27;,11]],c:[[&#x27;Raw materials&#x27;,10]],r:[[&#x27;Revenues&#x27;,11]]},
 {t:&#x27;The result for the period&#x27;,d:&#x27;Revenues 11 − costs 10 = profit of €1. The profit is added to capital (4 + 1) and brings sources and uses back into balance: 16 = 16 (slides 30–32).&#x27;,u:[[&#x27;Cash&#x27;,12],[&#x27;Equipment&#x27;,4]],s:[[&#x27;Equity&#x27;,4],[&#x27;Profit&#x27;,1],[&#x27;Financial debts&#x27;,11]],c:[[&#x27;Raw materials&#x27;,10]],r:[[&#x27;Revenues&#x27;,11]],closed:true}
];
const sum=a=&gt;a.reduce((x,y)=&gt;x+y[1],0);
function tbl(h1,h2,a,b){
  const n=Math.max(a.length,b.length); let r=&#x27;&#x27;;
  for(let i=0;i&lt;n;i++) r+=`&lt;tr&gt;&lt;td&gt;${a[i]?a[i][0]:&#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${a[i]?f(a[i][1]):&#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${b[i]?b[i][0]:&#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${b[i]?f(b[i][1]):&#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`;
  return `&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;${h1}&lt;/th&gt;&lt;th colspan=&quot;2&quot;&gt;${h2}&lt;/th&gt;&lt;/tr&gt;${r}&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${f(sum(a))}&lt;/td&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${f(sum(b))}&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;`;
}
function scale(U,S){
  const d=Math.max(-14,Math.min(14,(S-U)*2.2)), a=d*Math.PI/180, c=Math.cos(a), sn=Math.sin(a);
  const lx=200-130*c, ly=50-130*sn, rx=200+130*c, ry=50+130*sn, ok=U===S;
  const pan=(x,y,lab,val)=&gt;`&lt;line x1=&quot;${x}&quot; y1=&quot;${y}&quot; x2=&quot;${x-40}&quot; y2=&quot;${y+55}&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;line x1=&quot;${x}&quot; y1=&quot;${y}&quot; x2=&quot;${x+40}&quot; y2=&quot;${y+55}&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;path d=&quot;M${x-48},${y+55} Q${x},${y+80} ${x+48},${y+55}Z&quot; fill=&quot;var(--cbg)&quot; stroke=&quot;var(--c)&quot;/&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y+70}&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;${lab} ${val}&lt;/text&gt;`;
  return `&lt;svg viewBox=&quot;0 0 400 170&quot; role=&quot;img&quot; aria-label=&quot;Balance scale: uses ${U}, sources ${S}&quot;&gt;&lt;path d=&quot;M185,160 L200,50 L215,160Z&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;line x1=&quot;${lx}&quot; y1=&quot;${ly}&quot; x2=&quot;${rx}&quot; y2=&quot;${ry}&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;50&quot; r=&quot;6&quot; fill=&quot;var(--accent)&quot;/&gt;${pan(lx,ly,&#x27;Uses&#x27;,U)}${pan(rx,ry,&#x27;Sources&#x27;,S)}&lt;text x=&quot;200&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:${ok?&#x27;var(--ok)&#x27;:&#x27;var(--bad)&#x27;}&quot;&gt;${ok?&#x27;balance sheet in balance&#x27;:&#x27;balance sheet out of balance by €&#x27;+Math.abs(S-U)}&lt;/text&gt;&lt;/svg&gt;`;
}
const pb=$(&#x27;#peter-body&#x27;);
if(pb) stepper($(&#x27;#peter&#x27;),P.length,i=&gt;{
  const p=P[i], U=sum(p.u), S=sum(p.s);
  let h=`&lt;h4&gt;${p.t}&lt;/h4&gt;&lt;p&gt;${p.d}&lt;/p&gt;${scale(U,S)}&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;tbl-wrap&quot;&gt;${tbl(&#x27;Uses&#x27;,&#x27;Sources&#x27;,p.u,p.s)}&lt;p class=&quot;note&quot;&gt;Balance sheet&lt;/p&gt;&lt;/div&gt;`;

  const pick=g=&gt;{const d=SH[+g.dataset.i]; $$(&#x27;.shn rect&#x27;,sv).forEach(r=&gt;r.setAttribute(&#x27;fill&#x27;,&#x27;var(--card)&#x27;)); $(&#x27;rect&#x27;,g).setAttribute(&#x27;fill&#x27;,&#x27;var(--cbg)&#x27;); $(&#x27;#sh-out&#x27;).innerHTML=`&lt;b&gt;${d[0]}&lt;/b&gt;&lt;br&gt;${d[1]}`;};
  $$(&#x27;.shn&#x27;,sv).forEach(g=&gt;{g.addEventListener(&#x27;click&#x27;,()=&gt;pick(g)); g.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();pick(g);}});});
}

// accruals: insurance premium
const MS=[&#x27;Jan&#x27;,&#x27;Feb&#x27;,&#x27;Mar&#x27;,&#x27;Apr&#x27;,&#x27;May&#x27;,&#x27;Jun&#x27;,&#x27;Jul&#x27;,&#x27;Aug&#x27;,&#x27;Sep&#x27;,&#x27;Oct&#x27;,&#x27;Nov&#x27;,&#x27;Dec&#x27;];
const sa=$(&#x27;#s-acc&#x27;);
function drawAcc(){
  const m=+sa.value, inY=13-m, exp=100*inY, pre=1200-exp, w=21.5;
  $(&#x27;#o-acc&#x27;).textContent=MS[m-1];
  let s=&#x27;&#x27;;
  for(let k=0;k&lt;24;k++){const cov=k&gt;=m-1&amp;&amp;k&lt;m+11; s+=`&lt;rect x=&quot;${20+k*w}&quot; y=&quot;18&quot; width=&quot;${w-2}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;${cov?(k&lt;12?&#x27;var(--sage)&#x27;:&#x27;var(--ochre)&#x27;):&#x27;var(--rule)&#x27;}&quot; opacity=&quot;${cov?1:.5}&quot;/&gt;`; if(k%2===0)s+=`&lt;text x=&quot;${20+k*w+w/2}&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;9.5&quot; fill=&quot;var(--muted)&quot;&gt;${MS[k%12]}&lt;/text&gt;`;}
  s+=`&lt;line x1=&quot;${20+12*w-1}&quot; y1=&quot;10&quot; x2=&quot;${20+12*w-1}&quot; y2=&quot;60&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;current financial year&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;following financial year&lt;/text&gt;`;
  const k=0.35;
  s+=`&lt;text x=&quot;20&quot; y=&quot;88&quot; font-size=&quot;12.5&quot;&gt;Cash basis: expense for the year = everything paid&lt;/text&gt;&lt;rect x=&quot;20&quot; y=&quot;94&quot; width=&quot;${1200*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;${28+1200*k}&quot; y=&quot;111&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;1,200&lt;/text&gt;`;
  s+=`&lt;text x=&quot;20&quot; y=&quot;146&quot; font-size=&quot;12.5&quot;&gt;Accrual basis: expense for the year + prepaid (asset)&lt;/text&gt;&lt;rect x=&quot;20&quot; y=&quot;152&quot; width=&quot;${exp*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;var(--sage)&quot;/&gt;`+(pre?`&lt;rect x=&quot;${20+exp*k}&quot; y=&quot;152&quot; width=&quot;${pre*k}&quot; height=&quot;24&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`:&#x27;&#x27;)+`&lt;text x=&quot;${28+1200*k}&quot; y=&quot;169&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;${f(exp)} + ${f(pre)}&lt;/text&gt;`;
  $(&#x27;#accsvg&#x27;).innerHTML=s;
  $(&#x27;#acc-txt&#x27;).innerHTML=`Cover from ${MS[m-1]} for 12 months: &lt;b&gt;${inY}&lt;/b&gt; months fall in the current financial year → accrued expense of &lt;b&gt;€${f(exp)}&lt;/b&gt;. The remaining ${12-inY} months (€${f(pre)}) are &lt;span class=&quot;t&quot;&gt;prepaid insurance&lt;/span&gt;: an asset that will become an expense next year (slide 100). On a cash basis alone, the expense for the year would always be €1,200.`;
}
if(sa){sa.addEventListener(&#x27;input&#x27;,drawAcc); drawAcc();}
})();
&lt;/script&gt;
