*{box-sizing:border-box}

    &lt;a href=&quot;#qualita&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;470&quot; width=&quot;290&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;498&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;10 · Assumptions &amp;amp; qualities&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;517&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;going concern, accrual, relevance…&lt;/text&gt;&lt;/a&gt;

&lt;main&gt;
&lt;section class=&quot;part sage&quot; id=&quot;fondamenti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 1 · Some fundamentals&lt;/div&gt;
&lt;h2&gt;What accounting is and what it is for&lt;/h2&gt;
&lt;p&gt;The slides start from everyday life: deciding where to go on holiday means asking what the &lt;b&gt;budget&lt;/b&gt; is, i.e. the planned allocation of resources; the accountant who says “the accounts don&#x27;t balance” reminds us that every euro spent must have come from somewhere. The message is simple: &lt;em&gt;wherever money and economic resources are involved, there must also be an accounting system that accounts for them&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slides 2–4&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accounting&lt;/b&gt;: the systematic and comprehensive recording of a business&#x27;s &lt;span class=&quot;t&quot;&gt;financial transactions&lt;/span&gt; (transactions with an economic value), together with the process of &lt;span class=&quot;t&quot;&gt;summarizing, analyzing and reporting&lt;/span&gt; them. The financial statements of a large company condense hundreds of thousands of transactions into a few pages. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;The five operations of accounting&lt;/h3&gt;
&lt;p&gt;The slides define accounting as “an Art of” five verbs in sequence. Go through them one at a time: each step prepares the next. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Recording&lt;/h4&gt;&lt;p&gt;Every transaction is entered, with its date, amount and counterparty, in the &lt;span class=&quot;t&quot;&gt;books of account&lt;/span&gt;. This is the core task of &lt;span class=&quot;t&quot;&gt;bookkeeping&lt;/span&gt;. In the lecture this step becomes the &lt;a href=&quot;#journal&quot;&gt;journal entry&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Classifying&lt;/h4&gt;&lt;p&gt;Entries are grouped into homogeneous &lt;b&gt;accounts&lt;/b&gt; (cash, rent, accounts payable…). The list of accounts is the &lt;a href=&quot;#ledger&quot;&gt;chart of accounts&lt;/a&gt;; the record kept account by account is the &lt;span class=&quot;t&quot;&gt;general ledger&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Summarizing&lt;/h4&gt;&lt;p&gt;The balance of each account is computed and summarised in a table, the &lt;a href=&quot;#trial&quot;&gt;trial balance&lt;/a&gt;, and then in the financial statements.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Interpreting&lt;/h4&gt;&lt;p&gt;The figures are interpreted: is the business profitable? Is it liquid? Is it financially sound? For example, by comparing current assets with current liabilities (slide 67).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Reporting&lt;/h4&gt;&lt;p&gt;The information is communicated to those who use it (the &lt;a href=&quot;#stakeholders&quot;&gt;stakeholders&lt;/a&gt;) through the &lt;a href=&quot;#statements&quot;&gt;financial statements&lt;/a&gt;, according to shared rules (&lt;a href=&quot;#standards&quot;&gt;GAAP / standards&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The objectives of accounting&lt;/h3&gt;
&lt;p&gt;They can vary from one business to another, but the slides list seven general ones. Open the cards. &lt;span class=&quot;src&quot;&gt;slides 6–9&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;details&gt;&lt;summary&gt;Keep systematic records&lt;/summary&gt;&lt;div&gt;Remembering every transaction is impossible: accounting records them immediately in the books of account.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ascertain the results of the operation&lt;/summary&gt;&lt;div&gt;Calculate the profit or loss for the period by matching revenues against costs: this is the &lt;span class=&quot;t&quot;&gt;Trading and Profit and Loss account&lt;/span&gt; (or the &lt;span class=&quot;t&quot;&gt;Income and Expenditure account&lt;/span&gt; of non-profit entities), today the &lt;a href=&quot;#statements&quot;&gt;income statement&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ascertain the financial position&lt;/summary&gt;&lt;div&gt;Know what the business owns and what it owes, and how much cash it holds: the financial soundness shown by the &lt;span class=&quot;t&quot;&gt;balance sheet&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Portray the liquidity position&lt;/summary&gt;&lt;div&gt;How the business obtains and spends cash, borrows and repays loans, and distributes dividends: everything that affects &lt;span class=&quot;t&quot;&gt;liquidity&lt;/span&gt; (the ability to pay in the short term) and &lt;span class=&quot;t&quot;&gt;solvency&lt;/span&gt; (the ability to meet obligations in the long term).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Protect business properties&lt;/summary&gt;&lt;div&gt;With up-to-date records of assets and liabilities, no one can demand payments that are not owed.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Facilitate rational decision-making&lt;/summary&gt;&lt;div&gt;Accounting data are the basis for decisions: investing, hiring, applying for a loan.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Satisfy the requirements of law&lt;/summary&gt;&lt;div&gt;The law requires books of account and financial statements; in Italy the formats are set out in Arts. 2424 and 2425 of the Civil Code (&lt;a href=&quot;#statements&quot;&gt;Part 7&lt;/a&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Double entry system&lt;/b&gt;: the technical name for the “system of recording information about a business”. The whole lecture develops its logic. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;List the five operations of accounting in order.&lt;/summary&gt;&lt;div&gt;Recording → Classifying → Summarizing → Interpreting → Reporting.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between “financial position” and “results of the operation”?&lt;/summary&gt;&lt;div&gt;The former is a snapshot at a given date (what the business owns and owes: balance sheet). The latter is a flow over a period (revenues minus costs: income statement).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are liquidity and solvency synonyms?&lt;/summary&gt;&lt;div&gt;No. Liquidity is the ability to meet short-term payments with cash on hand or cash about to come in; solvency is the overall ability to meet all obligations, including long-term ones.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;partita-doppia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 2 · Double entry accounting&lt;/div&gt;
&lt;h2&gt;The balance scale, the equation and the sandwich business&lt;/h2&gt;
&lt;p&gt;Double entry is compared to a &lt;b&gt;balance scale&lt;/b&gt;: to stay in equilibrium, if the weight on one pan increases or decreases, the same weight must be added to or removed from the other. The most common form of this idea is the &lt;span class=&quot;t&quot;&gt;accounting equation&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;formula&quot;&gt;Assets = Liabilities + Owner&#x27;s Equity&lt;small&gt;uses = sources · Equity = Assets − Liabilities · slides 105 and 110&lt;/small&gt;&lt;/div&gt;

&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Assets&lt;/b&gt;&lt;br&gt;what the business owns or controls and what will bring future benefits: cash, receivables, inventory, machinery.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liabilities&lt;/b&gt;&lt;br&gt;what the business owes to third parties and will have to repay: amounts owed to banks, suppliers, employees.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Owner&#x27;s Equity&lt;/b&gt;&lt;br&gt;net worth: what the owners have invested plus accumulated profits. It is the “residual interest”, what remains of the assets after all liabilities have been paid.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Try the scale: the equation with sliders&lt;/h3&gt;
&lt;p&gt;Move the sliders. Equity is not chosen: it is always the difference between assets and liabilities, which is why the two sides are equal &lt;em&gt;by construction&lt;/em&gt;. The message at the bottom applies the rule of slide 67: if current liabilities exceed current assets, this is a &lt;span class=&quot;t&quot;&gt;warning sign&lt;/span&gt; for cash.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;sliders&quot;&gt;
 &lt;label&gt;Current assets (cash, receivables, inventory): &lt;output id=&quot;o-ca&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-ca&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Fixed assets (property, plant): &lt;output id=&quot;o-fa&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-fa&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;90&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Current liabilities (within 12 months): &lt;output id=&quot;o-cl&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-cl&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
 &lt;label&gt;Long-term liabilities (beyond 12 months): &lt;output id=&quot;o-ll&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s-ll&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg id=&quot;eqsvg&quot; viewBox=&quot;0 0 520 300&quot; role=&quot;img&quot; aria-label=&quot;Stacked bars of assets and of liabilities plus equity&quot;&gt;&lt;/svg&gt;
&lt;div id=&quot;eqstatus&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Peter&#x27;s case: a sandwich business in eight steps&lt;/h3&gt;
&lt;p&gt;To introduce accounting, the slides set up a very simple company and follow its operations. Peter sells sandwiches at the stadium; he and a friend each contribute €2: &lt;b&gt;2 partners with 50% each, initial capital €4&lt;/b&gt;. Go through the steps: on the left are the &lt;span class=&quot;t&quot;&gt;uses&lt;/span&gt; (where the resources are), on the right the &lt;span class=&quot;t&quot;&gt;sources&lt;/span&gt; (where they come from). The scale at the top compares the balance sheet &lt;em&gt;only&lt;/em&gt;. &lt;span class=&quot;src&quot;&gt;slides 13–32&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;peter&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;peter-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;What the case teaches.&lt;/b&gt; Some transactions affect uses only (the bread); others add a source and a use together (the loan). What is &lt;em&gt;consumed&lt;/em&gt; (bread, ham) becomes a cost in the &lt;span class=&quot;t&quot;&gt;income statement&lt;/span&gt;; the knife, an &lt;span class=&quot;t&quot;&gt;instrumental good&lt;/span&gt; (a capital good), remains among the assets. The €1 profit increases equity and restores the balance: 16 = 16. On slides 28 and 30 the income statement columns are headed “Loss / Profit” and “COSTI / RICAVI” (costs / revenues). &lt;span class=&quot;src&quot;&gt;slides 21–32&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Assets 250, liabilities 180: what is equity?&lt;/summary&gt;&lt;div&gt;Equity = 250 − 180 = 70.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why, once the bread and ham have been consumed, does Peter&#x27;s balance sheet “not balance”?&lt;/summary&gt;&lt;div&gt;Because €10 of uses have left the balance sheet and become costs in the income statement. Balance is restored only when the income statement is closed: revenues 11 − costs 10 = profit 1, which is added to equity.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is the knife a cost or an asset? And the ham?&lt;/summary&gt;&lt;div&gt;The knife is an asset (a capital good, used over many production cycles). The ham is a raw-material cost: it is consumed and has to be bought again.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;uses-sources&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 3 · Learn to identify transaction elements&lt;/div&gt;
&lt;h2&gt;Use and source: the two sides of every transaction&lt;/h2&gt;
&lt;p&gt;The aim of double entry is a &lt;em&gt;balanced&lt;/em&gt; financial picture: knowing not only how money was used, but also where it came from. A transaction is an exchange of things of value; to record it, &lt;b&gt;four questions&lt;/b&gt; must be answered. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;How was the money used?&lt;/b&gt; What was acquired or paid for? → the &lt;span class=&quot;t&quot;&gt;acquisition/use&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Where did the money come from?&lt;/b&gt; What is the source? → the &lt;span class=&quot;t&quot;&gt;source&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;What is the value of the exchange?&lt;/b&gt; → the amount&lt;/li&gt;
&lt;li&gt;&lt;b&gt;When?&lt;/b&gt; → the date of the transaction&lt;/li&gt;
&lt;/ol&gt;

&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 300&quot; role=&quot;img&quot; aria-labelledby=&quot;usst&quot;&gt;&lt;title id=&quot;usst&quot;&gt;Mirror-image comparison of uses and sources&lt;/title&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;280&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
&lt;rect x=&quot;390&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;280&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
&lt;text x=&quot;190&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;22&quot; font-weight=&quot;600&quot;&gt;Acquisition / Use = DEBIT&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;22&quot; font-weight=&quot;600&quot;&gt;Source = CREDIT&lt;/text&gt;
&lt;g font-size=&quot;15&quot;&gt;
&lt;text x=&quot;34&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;↑ Expenses&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;116&quot; font-size=&quot;12.5&quot;&gt;consumables: rent, telephone, food, fuel&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;166&quot; font-weight=&quot;600&quot;&gt;↑ Increases in what you own&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;186&quot; font-size=&quot;12.5&quot;&gt;cash, vehicles, buildings, equipment&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;236&quot; font-weight=&quot;600&quot;&gt;↓ Decreases in what you owe&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;256&quot; font-size=&quot;12.5&quot;&gt;paying off the car loan&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;96&quot; font-weight=&quot;600&quot;&gt;↑ Income&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;116&quot; font-size=&quot;12.5&quot;&gt;what you receive for products or services&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;166&quot; font-weight=&quot;600&quot;&gt;↑ Increases in what you owe&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;186&quot; font-size=&quot;12.5&quot;&gt;loans; owners&#x27; investments (equity)&lt;/text&gt;
&lt;text x=&quot;414&quot; y=&quot;236&quot; font-weight=&quot;600&quot;&gt;↓ Decreases in what you own&lt;/text&gt;&lt;text x=&quot;414&quot; y=&quot;256&quot; font-size=&quot;12.5&quot;&gt;paying with cash, giving away the old car&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;4 4&quot;&gt;&lt;line x1=&quot;370&quot; y1=&quot;170&quot; x2=&quot;390&quot; y2=&quot;170&quot;/&gt;&lt;line x1=&quot;370&quot; y1=&quot;240&quot; x2=&quot;390&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The two lists mirror each other: an “increase in what you owe” is a source, a “decrease in what you owe” is a use. &lt;span class=&quot;src&quot;&gt;slides 35–36&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Golden rule&lt;/b&gt; (slide 43): from here on, technical language is used. &lt;span class=&quot;dr&quot;&gt;Debit&lt;/span&gt; always means “acquisition/use”; &lt;span class=&quot;cr&quot;&gt;Credit&lt;/span&gt; always means “source”. “No exceptions.”&lt;/div&gt;
&lt;p&gt;Two useful details from the slides: (a) paying off a debt is a &lt;em&gt;use&lt;/em&gt;, because I “own more” of the asset (the bank owns less of it); (b) owners&#x27; investments are &lt;em&gt;sources&lt;/em&gt;: the business “owes” the owners what they have invested. This is the &lt;b&gt;separate entity&lt;/b&gt; principle: the business is distinct from its owner, and the owner&#x27;s contribution appears as a &lt;span class=&quot;t&quot;&gt;claim&lt;/span&gt; on the business. &lt;span class=&quot;src&quot;&gt;slides 36, 131–132&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Examples from the slides&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Rent paid by check&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Rent paid in kind&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Work for another tenant&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;The owner opens the account&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;1 November: paid $500 to the landlord for rent with check no. 100.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Rent · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Checking Account (the current account)&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;What if, instead of cash, I offered the landlord accounting services in exchange for the rent?&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Rent (I still used the premises) · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Accounting Services (Sales = Income). The source is no longer cash but revenue.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Another tenant asks me to do some accounting work and pays me.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Checking Account (money comes in) · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Accounting Services (Sales/Income).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;I use $1,500 of my own money to open a new checking account for the business.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;dr&quot;&gt;Use&lt;/span&gt; = Checking Account · &lt;span class=&quot;cr&quot;&gt;Source&lt;/span&gt; = Owner&#x27;s Investment (Owner&#x27;s Equity). We record the transactions &lt;em&gt;of the business&lt;/em&gt;: the business has acquired money and increased what it owes “to the owner”.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slides 37–38&lt;/p&gt;

&lt;h3&gt;Transactions “on account”&lt;/h3&gt;
&lt;p&gt;Goods and services are often received or supplied &lt;span class=&quot;t&quot;&gt;on account / on credit&lt;/span&gt;, i.e. with deferred payment. The transaction is recorded when the invoice arrives (or is issued), not on delivery. &lt;span class=&quot;src&quot;&gt;slides 40–41&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-labelledby=&quot;oat&quot;&gt;&lt;title id=&quot;oat&quot;&gt;Three-step sequence for purchases and sales on credit&lt;/title&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;text x=&quot;10&quot; y=&quot;30&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;17&quot;&gt;Purchase (Accounts Payable = amounts owed to suppliers)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · I receive the goods&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;no entry&lt;/text&gt;
&lt;rect x=&quot;265&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · The invoice arrives&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;Dr Goods/Services · Cr A/P&lt;/text&gt;
&lt;rect x=&quot;520&quot; y=&quot;44&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · I pay&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;Dr A/P · Cr Checking&lt;/text&gt;
&lt;text x=&quot;10&quot; y=&quot;150&quot; font-weight=&quot;600&quot; class=&quot;serif&quot; font-size=&quot;17&quot;&gt;Sale (Accounts Receivable = amounts owed by customers)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 · I supply the goods&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;no entry&lt;/text&gt;
&lt;rect x=&quot;265&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2 · I issue the invoice&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;Dr A/R · Cr Sales&lt;/text&gt;
&lt;rect x=&quot;520&quot; y=&quot;164&quot; width=&quot;230&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;635&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;3 · I collect&lt;/text&gt;&lt;text x=&quot;635&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot;&gt;Dr Checking · Cr A/R&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;240&quot; y1=&quot;79&quot; x2=&quot;263&quot; y2=&quot;79&quot;/&gt;&lt;line x1=&quot;495&quot; y1=&quot;79&quot; x2=&quot;518&quot; y2=&quot;79&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;199&quot; x2=&quot;263&quot; y2=&quot;199&quot;/&gt;&lt;line x1=&quot;495&quot; y1=&quot;199&quot; x2=&quot;518&quot; y2=&quot;199&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;In step 3 the payable settled (A/P) is a &lt;em&gt;use&lt;/em&gt; (“decrease what I owe”); the receivable collected (A/R) is a &lt;em&gt;source&lt;/em&gt; (“decrease what I own”).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;The slide follows the teaching convention of “record on the invoice”. Under international standards, revenue is recognised when control of the good or service passes to the customer (IFRS 15); in practice the invoice often coincides with that moment, but the criterion is the &lt;span class=&quot;t&quot;&gt;transfer of control&lt;/span&gt;, not the document. See the summary by &lt;a href=&quot;https://www.rsm.global/southafrica/node/301&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RSM on IFRS 15&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 3: identify the use (Dr) and the source (Cr)&lt;/h3&gt;
&lt;p class=&quot;note&quot;&gt;Tables 1 and 2 (slides 39 and 42); solutions reconstructed from the T-accounts on slides 61 and 91.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1–7 (November): owner&#x27;s deposit 1,500; rent 500; phone/fax 75; printer 150; stationery 75; server parts 500; bank charges 10&lt;/summary&gt;&lt;div&gt;1: Dr Checking / Cr Owner&#x27;s Equity. All the others credit Checking and debit: 2 Rent · 3 and 4 Office Equipment · 5 Office Supplies · 6 Computer Hardware · 7 Bank Charges.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;8–11: further deposit 1,100; chair 700; oil change 25; check for 500 received for advertising space&lt;/summary&gt;&lt;div&gt;8: Dr Checking / Cr Owner&#x27;s Equity · 9: Dr Office Furniture / Cr Checking · 10: Dr Repairs and Maintenance / Cr Checking · 11: Dr Checking / Cr Advertising Sales.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;12–13: phone bill 150 and electricity bill 100, received but not paid&lt;/summary&gt;&lt;div&gt;Dr Phone Service 150, Dr Electric Service 100 · Cr Accounts Payable.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;14: credit card statement of 930 with seven charges&lt;/summary&gt;&lt;div&gt;A single multi-line entry: Dr CC Interest and Fees 30, Office Furniture 245, Fuel 25, Subscriptions 65, Meals 45, Website Hosting 120, Computer Hardware 400 · Cr Accounts Payable 930.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;15–16: 500 paid on the card; bank charges 15&lt;/summary&gt;&lt;div&gt;15: Dr Accounts Payable / Cr Checking · 16: Dr Bank Charges / Cr Checking.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;journal&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 4 · Journal entries&lt;/div&gt;
&lt;h2&gt;Recording the entry in the journal&lt;/h2&gt;
&lt;p&gt;The answers to the four questions are written in a &lt;b&gt;journal&lt;/b&gt;, hence the name &lt;span class=&quot;t&quot;&gt;journal entry&lt;/span&gt;. The journal is a grid with the columns &lt;b&gt;Date · Description · Ref · Debit · Credit&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 44–46&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Layout rule.&lt;/b&gt; The left-hand amount column is always the &lt;span class=&quot;dr&quot;&gt;Debit&lt;/span&gt;, the right-hand one always the &lt;span class=&quot;cr&quot;&gt;Credit&lt;/span&gt;. By convention, credited accounts are indented. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/div&gt;

&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-labelledby=&quot;cyct&quot;&gt;&lt;title id=&quot;cyct&quot;&gt;The accounting cycle from transaction to financial statements&lt;/title&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;5&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;65&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Transaction&lt;/text&gt;&lt;text x=&quot;65&quot; y=&quot;88&quot;&gt;document&lt;/text&gt;
&lt;rect x=&quot;150&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Journal&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;88&quot;&gt;by date&lt;/text&gt;
&lt;rect x=&quot;295&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;355&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Chart of acc.&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;88&quot;&gt;list of accounts&lt;/text&gt;
&lt;rect x=&quot;440&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;500&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;General ledger&lt;/text&gt;&lt;text x=&quot;500&quot; y=&quot;88&quot;&gt;by account · T&lt;/text&gt;
&lt;rect x=&quot;585&quot; y=&quot;40&quot; width=&quot;120&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;645&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Trial balance&lt;/text&gt;&lt;text x=&quot;645&quot; y=&quot;88&quot;&gt;balances Dr = Cr&lt;/text&gt;
&lt;rect x=&quot;730&quot; y=&quot;40&quot; width=&quot;125&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;792&quot; y=&quot;68&quot; font-weight=&quot;600&quot;&gt;Fin. statements&lt;/text&gt;&lt;text x=&quot;792&quot; y=&quot;88&quot;&gt;BS · IS&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;125&quot; y1=&quot;72&quot; x2=&quot;148&quot; y2=&quot;72&quot;/&gt;&lt;line x1=&quot;270&quot; y1=&quot;72&quot; x2=&quot;293&quot; y2=&quot;72&quot;/&gt;&lt;line x1=&quot;415&quot; y1=&quot;72&quot; x2=&quot;438&quot; y2=&quot;72&quot;/&gt;&lt;line x1=&quot;560&quot; y1=&quot;72&quot; x2=&quot;583&quot; y2=&quot;72&quot;/&gt;&lt;line x1=&quot;705&quot; y1=&quot;72&quot; x2=&quot;728&quot; y2=&quot;72&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;430&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;“Journal entries gather great information but they don&#x27;t really tell you anything by themselves” (slide 52)&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The accounting cycle as the lecture builds it, step by step.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Three typical entries&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Owner&#x27;s deposit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Multiple lines: credit card&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Credit sale with COGS&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Example 4 (slide 47). Answers: 1) the money went into the checking account; 2) it came from the owner; 3) $1,500; 4) November 2010.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;th&gt;Ref&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Nov/2010&lt;/td&gt;&lt;td&gt;Checking Account&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Owner Investment&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,500.00&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td colspan=&quot;4&quot;&gt;&lt;i&gt;Deposited $1500 from owner into checking account&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;The amount from question 3 is written &lt;b&gt;twice&lt;/b&gt;, once as a debit and once as a credit: hence the name &lt;span class=&quot;t&quot;&gt;double entry&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Example 5 (slide 50). When a question has more than one answer, &lt;span class=&quot;t&quot;&gt;multiple lines&lt;/span&gt; are used: the lines add up, but total debits still equal total credits.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Description&lt;/th&gt;&lt;th&gt;Ref&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dec/2010&lt;/td&gt;&lt;td&gt;Office Supplies&lt;/td&gt;&lt;td&gt;299&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;75.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Fuel&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Magazine Subscription&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50.00&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Accounts Payable&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150.00&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Totals&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150.00&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150.00&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Slide 46: sale of goods on credit. There are two entries, to be read together.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Jan 1&lt;/td&gt;&lt;td&gt;Accounts Receivable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Cost of Goods Sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Revenues (Sales)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&amp;emsp;Inventory&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;750&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;The entries recognise the revenue (1,000, with a receivable from the customer) and the &lt;b&gt;cost of sales&lt;/b&gt; (&lt;span class=&quot;t&quot;&gt;Cost of Goods Sold&lt;/span&gt;, COGS): the goods leave &lt;span class=&quot;t&quot;&gt;inventory&lt;/span&gt; at their cost of 750. The margin is 250. This is the &lt;span class=&quot;t&quot;&gt;perpetual inventory system&lt;/span&gt;, which you will meet again in the Library exercise.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;formula&quot;&gt;Total Debits = Total Credits&lt;small&gt;“the most basic rule of accounting”: if it holds for every entry, the books are “in balance” · slides 47–48&lt;/small&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What are the five columns of the journal, and which amount column is on the left?&lt;/summary&gt;&lt;div&gt;Date, Description, Ref, Debit, Credit. The Debit column is always on the left.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the “Ref” column for?&lt;/summary&gt;&lt;div&gt;It links the journal entry to the postings in the ledger: starting from a ledger account, you can trace the whole entry with all its contra accounts (slide 58).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;An entry has three debit lines (40 + 35 + 25). What must the credit side total?&lt;/summary&gt;&lt;div&gt;100: total debits must always equal total credits.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;ledger&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 5 · Chart of accounts, general ledger, T-accounts&lt;/div&gt;
&lt;h2&gt;Making sense of the entries&lt;/h2&gt;
&lt;h3&gt;1. The chart of accounts&lt;/h3&gt;
&lt;p&gt;The first step is to list the descriptions used in the answers to questions 1 and 2: this list is the &lt;b&gt;chart of accounts&lt;/b&gt;, “really just a list of transaction descriptions”. The accountant usually prepares it in advance and extends it as needed; in any case, existing accounts must be checked so as &lt;b&gt;not to create duplicates&lt;/b&gt;. Overly specific accounts are then &lt;b&gt;grouped&lt;/b&gt;: paper, pens and paper clips all become “Office Supplies”; chair and desk become “Office Furniture”. &lt;span class=&quot;src&quot;&gt;slides 53–56&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;On slide 56 the list becomes a chart of accounts in three columns (original → revised → without duplicates): Phone/Fax + Printer → Office Equipment; Chair + Desk → Office Furniture; Server Parts → Computer Hardware; Oil Change → Repairs and Maintenance; Magazine → Subscriptions; Business Lunch → Meals.&lt;/p&gt;

&lt;h3&gt;2. The general ledger and the T-account&lt;/h3&gt;
&lt;p&gt;The &lt;b&gt;general ledger&lt;/b&gt; reorganises the entries &lt;em&gt;by account&lt;/em&gt; rather than by transaction number. In a paper ledger each account has its own page with a running balance. Note that within a single account debits and credits do &lt;b&gt;not&lt;/b&gt; balance, because only one half of each entry is visible. The &lt;span class=&quot;t&quot;&gt;T-account&lt;/span&gt; is the compact graphical version: the title at the top, &lt;span class=&quot;dr&quot;&gt;debits on the left&lt;/span&gt;, &lt;span class=&quot;cr&quot;&gt;credits on the right&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slides 57–60&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;b&gt;Simulation&lt;/b&gt;: post the seven November transactions (Table 1) one at a time and watch the T-accounts fill up. The latest posting is highlighted. &lt;span class=&quot;src&quot;&gt;slides 61, 87&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;tacc&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Post →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;tacc-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;3. Organising the chart of accounts&lt;/h3&gt;
&lt;p&gt;To produce the financial statements, accounts are ordered by three criteria: &lt;b&gt;accounting type&lt;/b&gt;, &lt;b&gt;order of liquidity&lt;/b&gt; and &lt;b&gt;account numbers&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 63&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;7 accounting types&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Order of liquidity&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Cost or expense?&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Assets&lt;/b&gt;: things you own&lt;/li&gt;&lt;li&gt;&lt;b&gt;Liabilities&lt;/b&gt;: things you owe&lt;/li&gt;&lt;li&gt;&lt;b&gt;Equity&lt;/b&gt;: owner&#x27;s stake in company&lt;/li&gt;&lt;li&gt;&lt;b&gt;Revenue&lt;/b&gt;: income from sales of the business&#x27;s goods or services&lt;/li&gt;&lt;li&gt;&lt;b&gt;Cost of Goods Sold&lt;/b&gt;: costs of producing or purchasing what is sold&lt;/li&gt;&lt;li&gt;&lt;b&gt;Expenses&lt;/b&gt;: operating costs, with no lasting value, needed to keep the business running&lt;/li&gt;&lt;li&gt;&lt;b&gt;Other Revenue and Expenses&lt;/b&gt;: unusual items, related neither to the product nor to normal operations&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;The cost of an item sometimes leads to its classification as an expense rather than an asset: the slides defer this exception to the lecture on &lt;span class=&quot;t&quot;&gt;depreciation&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;This applies to assets and liabilities. &lt;span class=&quot;t&quot;&gt;Liquidity&lt;/span&gt; is the ease with which an item can be converted into cash without loss of value. Items are listed in &lt;b&gt;decreasing&lt;/b&gt; order of liquidity, with cash at the top. &lt;span class=&quot;t&quot;&gt;Current&lt;/span&gt; = converted (“turnover”) within &lt;b&gt;one year&lt;/b&gt;; &lt;span class=&quot;t&quot;&gt;Fixed / Long term&lt;/span&gt; = beyond one year. &lt;span class=&quot;src&quot;&gt;slides 66–67&lt;/span&gt;&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;Liquidity scale from cash to plant&quot;&gt;&lt;defs&gt;&lt;linearGradient id=&quot;lg&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--brick)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;580&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;url(#lg)&quot;/&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;40&quot; y=&quot;30&quot;&gt;Cash&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;30&quot;&gt;Receivables&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;30&quot;&gt;Inventory&lt;/text&gt;&lt;text x=&quot;390&quot; y=&quot;30&quot;&gt;Equipment&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;30&quot;&gt;Plant&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;30&quot;&gt;Property&lt;/text&gt;&lt;/g&gt;
&lt;g font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;80&quot;&gt;most liquid · Current assets&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;80&quot; text-anchor=&quot;end&quot;&gt;least liquid · Fixed assets&lt;/text&gt;&lt;/g&gt;
&lt;line x1=&quot;320&quot; y1=&quot;34&quot; x2=&quot;320&quot; y2=&quot;62&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;threshold: 1 year&lt;/text&gt;&lt;/svg&gt;
&lt;p&gt;Why does the current classification matter? It groups items that turn over quickly and provides an &lt;b&gt;early warning&lt;/b&gt; about cash: current liabilities are usually paid out of current assets, so current liabilities exceeding current assets are a warning sign, though not an infallible one.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;Costs (COGS) and expenses look alike; to tell them apart you need to know what the business sells (“what does it do for a living?”). In the slides&#x27; case the business &lt;b&gt;sells advertising space on its own website&lt;/b&gt;; the owner builds the pages without a salary and the software is free, so the only direct cost is &lt;b&gt;Website Hosting&lt;/b&gt; (COGS). When in doubt, &lt;b&gt;classify it as an expense&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 64&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 5: assign a type to each account&lt;/h3&gt;
&lt;p class=&quot;note&quot;&gt;Click the correct category for each account (slide 65, solution on slide 68).&lt;/p&gt;
&lt;div id=&quot;game&quot;&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; id=&quot;game-fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;trial&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 6 · The trial balance&lt;/div&gt;
&lt;h2&gt;The trial balance&lt;/h2&gt;
&lt;p&gt;Once the T-accounts are complete and their balances calculated, a summary of the accounts and their balances is prepared: the &lt;b&gt;trial balance&lt;/b&gt;. The grid resembles the journal, but it lists &lt;em&gt;accounts&lt;/em&gt; with their balance at a given date, not individual transactions. The check remains the same: &lt;b&gt;total debits = total credits&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 87–88&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Normal balance: which accounts “grow” on the debit side and which on the credit side&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Debit balance&lt;/b&gt;&lt;br&gt;Accounts that increase when they are a &lt;em&gt;use&lt;/em&gt;: &lt;b&gt;Assets&lt;/b&gt;, &lt;b&gt;Costs&lt;/b&gt;, &lt;b&gt;Expenses&lt;/b&gt;. If the checking account has a credit balance, you are &lt;span class=&quot;t&quot;&gt;overdrawn&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slide 89&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Credit balance&lt;/b&gt;&lt;br&gt;Accounts that increase when they are a &lt;em&gt;source&lt;/em&gt;: purchases on credit (A/P), &lt;b&gt;Loans&lt;/b&gt;, owners&#x27; investments (&lt;b&gt;Equity&lt;/b&gt;), &lt;b&gt;Income&lt;/b&gt;. If A/P has a debit balance, you have paid more than you owed. &lt;span class=&quot;src&quot;&gt;slide 88&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In the balance column of an electronic ledger, equity appears with a minus sign (−1,500): this does &lt;b&gt;not&lt;/b&gt; mean negative equity, only that the balance is a credit. This is why, in the &lt;span class=&quot;t&quot;&gt;comparative trial balance&lt;/span&gt;, the signed sum of all balances is &lt;b&gt;0&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 88, 95&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;Choose the period: the table shows debit and credit balances and, in the “±” column, the signed balance used in the &lt;span class=&quot;t&quot;&gt;comparative trial balance&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slides 87, 94–95&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;button class=&quot;btn tbp on&quot; data-p=&quot;0&quot;&gt;November&lt;/button&gt; &lt;button class=&quot;btn tbp&quot; data-p=&quot;1&quot;&gt;December&lt;/button&gt; &lt;button class=&quot;btn tbp&quot; data-p=&quot;2&quot;&gt;Cumulative to 31/12&lt;/button&gt;
&lt;div class=&quot;tbl-wrap&quot; id=&quot;tbout&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;December: Checking has 1,100 + 500 in debits and 700 + 25 + 500 + 15 in credits, hence a balance of 360; A/P is 150 + 100 + 930 − 500 = 680.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;The trial balance leads to the &lt;b&gt;financial statements&lt;/b&gt;: accounts with lasting value go to the balance sheet, those consumed during the period to the income statement. &lt;span class=&quot;src&quot;&gt;slides 86, 96&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 6 (true/false quiz from the slides)&lt;/h3&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;1. The normal balance of a revenue account is a debit.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;Revenues are sources: they increase on the credit side, so their normal balance is a credit.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;V&quot;&gt;&lt;p&gt;2. The normal balance of an expense account is a debit.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;Expenses are consumable uses: they increase on the debit side.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tf&quot; data-a=&quot;F&quot;&gt;&lt;p&gt;3. If the owner&#x27;s withdrawals exceed net income, owner&#x27;s equity increases.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;True&lt;/button&gt; &lt;button class=&quot;btn&quot;&gt;False&lt;/button&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;p class=&quot;note&quot; hidden&gt;Equity changes by (net income − withdrawals): if withdrawals are larger, equity decreases.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;The checking account shows a credit balance. What does that mean?&lt;/summary&gt;&lt;div&gt;That the account is overdrawn: you have paid out more than there was in it.&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;src&quot;&gt;slide 69&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;statements&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 7 · Financial statements&lt;/div&gt;
&lt;h2&gt;Financial statements: what they report and how they are structured&lt;/h2&gt;
&lt;p&gt;A &lt;span class=&quot;t&quot;&gt;financial statement&lt;/span&gt; is both a communication &lt;b&gt;process&lt;/b&gt; and a &lt;b&gt;document&lt;/b&gt; reporting the performance and resources of the business. Two questions guide it: &lt;em&gt;what does it report?&lt;/em&gt; and &lt;em&gt;who is it for?&lt;/em&gt; (see &lt;a href=&quot;#stakeholders&quot;&gt;Part 9&lt;/a&gt;). &lt;span class=&quot;src&quot;&gt;slides 70–71&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Form&lt;/b&gt;&lt;br&gt;the documents that make up the financial statements, their structure and their content: the &lt;em&gt;formats&lt;/em&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Substance&lt;/b&gt;&lt;br&gt;the measurement and quantification of the amounts to be included in the documents: the &lt;em&gt;measurement bases&lt;/em&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;slide 72 (the slides use “budget documents” in the sense of financial statement documents)&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective of financial reporting&lt;/b&gt;: to communicate economic measures of, and information about, an entity&#x27;s resources and performance that are &lt;b&gt;useful&lt;/b&gt; to those with reasonable rights to such information. &lt;span class=&quot;src&quot;&gt;slide 83&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;What a financial report contains&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;The financial statements&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Statement of financial position (&lt;b&gt;balance sheet&lt;/b&gt;)&lt;/li&gt;&lt;li&gt;Statement of comprehensive income (&lt;b&gt;income statement&lt;/b&gt;)&lt;/li&gt;&lt;li&gt;Statement of changes in equity&lt;/li&gt;&lt;li&gt;Statement of cash flows&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;In addition&lt;/b&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Notes&lt;/b&gt; to the financial statements&lt;/li&gt;&lt;li&gt;&lt;b&gt;Narrative information&lt;/b&gt;, for example the directors&#x27; report&lt;/li&gt;&lt;/ul&gt;&lt;span class=&quot;src&quot;&gt;slide 85&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;This list follows &lt;b&gt;IAS 1&lt;/b&gt; (which also requires comparative information). For reporting periods beginning on or after &lt;b&gt;1 January 2027&lt;/b&gt; it is replaced by &lt;b&gt;IFRS 18&lt;/b&gt;: mandatory categories and subtotals in the income statement and disclosure of &lt;span class=&quot;t&quot;&gt;management-defined performance measures&lt;/span&gt;. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IFRS 18&lt;/a&gt;, &lt;a href=&quot;https://www.bdo.co.uk/en-gb/services/audit-assurance/ifrs/ifrs-18-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Balance sheet&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Income statement&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Cash flows&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Changes in equity&lt;/button&gt;&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;The balance sheet is a &lt;b&gt;snapshot&lt;/b&gt; of the qualitative and quantitative composition of the business&#x27;s assets and liabilities: like the “X” on a map that says &lt;span class=&quot;t&quot;&gt;You are here&lt;/span&gt;. It shows what the business owns, what it owes and what it is worth in accounting terms (&lt;span class=&quot;t&quot;&gt;book value&lt;/span&gt;). It contains items with &lt;b&gt;lasting value&lt;/b&gt;, which remain until they are disposed of. &lt;span class=&quot;src&quot;&gt;slides 97–98&lt;/span&gt;&lt;/p&gt;
&lt;h4&gt;The three sections and their definitions&lt;/h4&gt;
&lt;details open&gt;&lt;summary&gt;Assets&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Two definitions (slide 100): (1) resources acquired through transactions and having &lt;b&gt;future&lt;/b&gt; economic value, including costs paid in advance and not yet incurred (&lt;span class=&quot;t&quot;&gt;prepaid&lt;/span&gt; rent, insurance, advertising, legal fees); (2) the IASB-style definition: “a resource controlled by the entity as a result of past events and from which future economic benefits are expected to flow to the entity”. The future benefit is the potential to contribute to cash flows.&lt;/p&gt;
&lt;p&gt;Order of the classes (slide 101): &lt;span class=&quot;chip&quot;&gt;Current Assets&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Investments&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Property, Plant &amp;amp; Equipment&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Intangible Assets&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Other Assets&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Liabilities&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“A present obligation of the entity arising from past events, the settlement of which is expected to result in an outflow of resources”. It may be legally binding (a contract) or arise from &lt;b&gt;practice&lt;/b&gt; (for example, a policy of repairing faults even after the warranty has expired). It also includes advance receipts for future services. The name often contains “payable”. &lt;span class=&quot;src&quot;&gt;slides 99, 102–103&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Examples: notes, accounts, salaries, wages, interest and income taxes payable; customer deposits; warranty liability; lawsuits payable; unearned revenues; bonds payable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Equity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“The residual interest in the assets of an entity after deducting all its liabilities”. It is subdivided into components with different rights or restrictions, for example &lt;b&gt;reserves&lt;/b&gt;, sometimes required by law to protect creditors. Importantly, book equity &lt;b&gt;rarely coincides with the market value&lt;/b&gt; of the business or with what would be obtained by selling its assets. &lt;span class=&quot;src&quot;&gt;slides 104–106&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Examples: common and preferred stock, paid-in capital (in excess of par, from treasury stock), retained earnings.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h4&gt;Structure and the Italian statutory format&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;Liabilities &amp;amp; Owner&#x27;s equity&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Current assets&lt;/td&gt;&lt;td&gt;Current liabilities&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Investments&lt;/td&gt;&lt;td&gt;Long-term liabilities&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Property, plant &amp;amp; equipment&lt;/td&gt;&lt;td&gt;&lt;i&gt;Total liabilities&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Intangible assets&lt;/td&gt;&lt;td&gt;Owner&#x27;s equity&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Other assets&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td&gt;Total liabilities &amp;amp; equity&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;src&quot;&gt;slide 107 (“international” structure, in decreasing order of liquidity)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Assets (Art. 2424 Italian Civil Code)&lt;/th&gt;&lt;th&gt;Liabilities and equity&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A) Receivables from shareholders&lt;/td&gt;&lt;td&gt;A) Equity (I share capital … IX profit for the year)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;B) Fixed assets: I intangible, II tangible, III financial&lt;/td&gt;&lt;td&gt;B) Provisions for risks and charges&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;C) Current assets: I inventories, II receivables, III financial assets, IV cash and cash equivalents&lt;/td&gt;&lt;td&gt;C) Employee severance indemnity (TFR)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;D) Accruals and prepayments&lt;/td&gt;&lt;td&gt;D) Payables · E) Accruals and deferred income&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;src&quot;&gt;slide 109 (the slides translate into English: Fixed assets, Current assets, Accruals and Prepayments…)&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Note the contrast: the Italian statutory format starts from fixed assets (&lt;em&gt;increasing&lt;/em&gt; liquidity), whereas the one on slides 101 and 107 starts from current assets (decreasing liquidity). The logic is the same (slide 110): &lt;b&gt;What we have&lt;/b&gt; (assets) = &lt;b&gt;Where it came from&lt;/b&gt; (liabilities + equity).&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;The current text of Art. 2424 of the Italian Civil Code (content of the balance sheet) is available on &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2424.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it&lt;/a&gt;. Accounting standard &lt;b&gt;OIC 12&lt;/b&gt;, issued by the Italian Accounting Standards Setter (Organismo Italiano di Contabilità), details the composition and formats of statutory financial statements: &lt;a href=&quot;https://fondazioneoic.eu/wp-content/uploads/2024/09/OIC-12-composizione-e-schemi-del-bilancio-desercizio.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OIC 12 (PDF)&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;The income statement reports &lt;b&gt;profitability over a period&lt;/b&gt; (a year, a quarter, 13 weeks…). Its items have &lt;b&gt;no lasting value&lt;/b&gt;: they are consumed during the period, and their balances restart from zero at the beginning of each new period (unlike those of the balance sheet). Components: &lt;b&gt;revenues, expenses, gains, losses&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 111–114&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Income&lt;/b&gt;&lt;br&gt;increases in economic benefits during the period (inflows or enhancements of assets, or decreases in liabilities) that increase equity, &lt;em&gt;other than&lt;/em&gt; contributions from owners. It comprises &lt;b&gt;revenues&lt;/b&gt; (ordinary activities: sales, royalties, rents, fees, interest) and &lt;b&gt;gains&lt;/b&gt; (non-ordinary, such as the gain on the disposal of a non-current asset, or unrealised, such as a revaluation). &lt;span class=&quot;src&quot;&gt;slides 115–116&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Expenses&lt;/b&gt;&lt;br&gt;decreases in economic benefits (outflows or depletions of assets) that decrease equity, &lt;em&gt;other than&lt;/em&gt; distributions to owners. They comprise ordinary expenses (wages, depreciation, utilities) and &lt;b&gt;losses&lt;/b&gt;, including unrealised ones (for example on foreign-currency transactions). &lt;span class=&quot;src&quot;&gt;slide 117&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;If revenues and gains minus expenses and losses is positive, the &lt;span class=&quot;t&quot;&gt;bottom line&lt;/span&gt; is &lt;b&gt;net income&lt;/b&gt;; if negative, it is a &lt;b&gt;net loss&lt;/b&gt;. Combining the items yields several performance measures: &lt;span class=&quot;t&quot;&gt;gross margin&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;profit before taxation&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;profit after taxation&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;slides 114, 118&lt;/span&gt;&lt;/p&gt;
&lt;h4&gt;Two ways of classifying expenses&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;By nature&lt;/b&gt; (by type of input) · slide 119&lt;br&gt;Sales revenues, other income · changes in inventories of finished goods and WIP · work performed and capitalised · raw materials · employee benefits · depreciation, amortisation, impairment · other expenses · finance costs · share of associates → &lt;b&gt;profit before tax&lt;/b&gt; − tax = &lt;b&gt;profit for the period&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;By destination / function&lt;/b&gt; (by business function) · slide 120&lt;br&gt;Sales revenue − &lt;b&gt;cost of sales&lt;/b&gt; = &lt;b&gt;gross profit&lt;/b&gt; − distribution costs − general and administrative ± other operating items − finance costs ± associates = &lt;b&gt;profit before income tax&lt;/b&gt; − tax = &lt;b&gt;profit for the period&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In both formats the final profit is attributed to &lt;span class=&quot;t&quot;&gt;minority interests&lt;/span&gt; (non-controlling shareholders of subsidiaries) and to &lt;span class=&quot;t&quot;&gt;equity holders of the parent&lt;/span&gt;: this is the disclosure found in consolidated financial statements.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;IAS 1 allows a choice between nature and function but &lt;b&gt;prohibits mixing them&lt;/b&gt;; entities using the function method disclose depreciation and employee benefits expense in the notes. &lt;a href=&quot;https://www.cpdbox.com/ias-1-presentation-of-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CPDbox · IAS 1&lt;/a&gt;.&lt;/div&gt;
&lt;h4&gt;The Italian format (Art. 2425 Civil Code) and the simple format&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Art. 2425 Civil Code (slide 121)&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A) Value of production&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B) Costs of production&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;A − B) Difference (operating gross margin)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C) Financial income and expenses&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;D) Value adjustments to financial assets&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;E) Extraordinary income and expenses &lt;b&gt;(see note)&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Profit before taxes (EBT)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Income taxes (current, deferred and prepaid)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Profit (loss) for the year&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Income statement format (slide 122)&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+ Revenue&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Cost of Goods Sold&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;= Gross Margin: what remains to cover operating expenses&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;− Expenses (operating costs consumed)&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;= Net Income (Loss): the change during the year in “what the business is worth”&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;b&gt;Regulatory update.&lt;/b&gt; Slide 121 still shows section &lt;b&gt;E) extraordinary items&lt;/b&gt;, which Legislative Decree 139/2015 (financial statements from 2016) &lt;b&gt;removed&lt;/b&gt; from Art. 2425 of the Civil Code, reclassifying its items; section D is now “Value adjustments to financial assets and liabilities”. Current text: &lt;a href=&quot;https://brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/art2425.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it · Art. 2425&lt;/a&gt;; on the effect of the removal: &lt;a href=&quot;https://www.eutekne.info/Sezioni/Art_606692_eliminazione_dell_area_straordinaria_con_impatto_fiscale.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eutekne&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;The &lt;b&gt;statement of cash flows&lt;/b&gt; explains the change in cash and cash equivalents during the period, divided into three areas. &lt;span class=&quot;src&quot;&gt;slide 146&lt;/span&gt;&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;The three areas of the statement of cash flows that explain the change in cash&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Operating&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;70&quot;&gt;cash generated by&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;88&quot;&gt;core operations&lt;/text&gt;
&lt;rect x=&quot;225&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Investing&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;70&quot;&gt;purchases and sales&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;88&quot;&gt;of long-term assets&lt;/text&gt;
&lt;rect x=&quot;440&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;48&quot; font-weight=&quot;600&quot;&gt;Financing&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;70&quot;&gt;issuing shares or debt,&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;88&quot;&gt;repaying liabilities&lt;/text&gt;
&lt;rect x=&quot;200&quot; y=&quot;150&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;178&quot; font-weight=&quot;600&quot;&gt;Δ Cash = O + I + F&lt;/text&gt;&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;105&quot; y1=&quot;110&quot; x2=&quot;250&quot; y2=&quot;150&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;110&quot; x2=&quot;320&quot; y2=&quot;148&quot;/&gt;&lt;line x1=&quot;535&quot; y1=&quot;110&quot; x2=&quot;390&quot; y2=&quot;150&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;In the &lt;a href=&quot;#esercizi&quot;&gt;Library exercise&lt;/a&gt; you will find a statement reconstructed step by step.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;Reference: &lt;b&gt;IAS 7&lt;/b&gt;. Non-cash transactions (for example a building contributed by the owners) are excluded from the statement but must be disclosed separately. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation · IAS 7&lt;/a&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;The &lt;b&gt;statement of stockholders&#x27; equity&lt;/b&gt; lists the changes in equity over the same period as the income statement and the cash flow statement: &lt;span class=&quot;t&quot;&gt;net income&lt;/span&gt;, &lt;span class=&quot;t&quot;&gt;other comprehensive income&lt;/span&gt; (gains and losses recognised directly in equity, for example from revaluations), dividends, share buybacks, exercise of stock options. &lt;span class=&quot;src&quot;&gt;slide 147&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Closing equity = Opening equity + contributions + net income ± OCI − dividends − buybacks&lt;/div&gt;
&lt;p&gt;It is the statement that “closes the loop” between the income statement and the balance sheet: in Peter&#x27;s case, €4 of capital + €1 of profit = €5 of equity.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 7&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Is an advance received from a customer for a future service an asset or a liability?&lt;/summary&gt;&lt;div&gt;A liability (customer deposit / unearned revenue): the business has an obligation to provide the service.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is book equity not the “value” of the business?&lt;/summary&gt;&lt;div&gt;Because it derives from carrying amounts (often historical costs), not from a market valuation or from the realisable value of the assets (slide 104).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the function-based format, where do you find a salesperson&#x27;s salary? And in the nature-based format?&lt;/summary&gt;&lt;div&gt;By function: in distribution costs. By nature: in employee benefits expense.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Gain on the sale of land: revenue or gain?&lt;/summary&gt;&lt;div&gt;Gain: it is income that does not arise from ordinary activities (slide 115).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;esercizi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;partno&quot;&gt;Part 8 · Exercises&lt;/div&gt;
&lt;h2&gt;Guided exercises: “The Library” and the shop&lt;/h2&gt;
&lt;h3&gt;A · The Library (2011)&lt;/h3&gt;
&lt;p&gt;Task (slide 123): identify the &lt;b&gt;nature&lt;/b&gt; of the accounts (A = Assets, L = Liabilities, OE = Owners&#x27; Equity, R = Revenues, E = Expenses) and prepare the income statement and balance sheet at 31/12/2011. Try it on your own first, then go through the steps: each one shows the entry (solution on slide 127) and the running balances.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;lib&quot;&gt;
  &lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;stepbody&quot; id=&quot;lib-body&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Balance sheet 31/12/2011&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Non-current assets&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Building, net (4,000 − 200)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,800&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Current assets&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,100&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;Liabilities + equity&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Bonds payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Common stock&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Net profit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;900&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;22,900&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;src&quot;&gt;slide 128&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;&lt;svg viewBox=&quot;0 0 650 240&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart of the Library&#x27;s income statement: from revenues of 1,200 to a profit of 900&quot;&gt;
&lt;line x1=&quot;10&quot; y1=&quot;180&quot; x2=&quot;640&quot; y2=&quot;180&quot; stroke=&quot;var(--rule)&quot;/&gt;
&lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;144&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;110&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;120&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;rect x=&quot;200&quot; y=&quot;156&quot; width=&quot;70&quot; height=&quot;24&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;rect x=&quot;290&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;120&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;rect x=&quot;380&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;12&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;rect x=&quot;470&quot; y=&quot;48&quot; width=&quot;70&quot; height=&quot;24&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;rect x=&quot;560&quot; y=&quot;72&quot; width=&quot;70&quot; height=&quot;108&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;55&quot; y=&quot;28&quot;&gt;1,200&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;28&quot;&gt;−1,000&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;148&quot;&gt;200&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;28&quot;&gt;+1,000&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;28&quot;&gt;−100&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;42&quot;&gt;−200&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;64&quot;&gt;900&lt;/text&gt;&lt;/g&gt;
&lt;g font-size=&quot;11.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;55&quot; y=&quot;200&quot;&gt;Sales&lt;/text&gt;&lt;text x=&quot;145&quot; y=&quot;200&quot;&gt;COGS&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;200&quot;&gt;Gross profit&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;200&quot;&gt;Gain on land&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;200&quot;&gt;Wages&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;200&quot;&gt;Depreciation&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;200&quot;&gt;Net profit&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;p class=&quot;note&quot; style=&quot;text-align:center&quot;&gt;The Library&#x27;s income statement as a waterfall (data from slide 129).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Critical notes on the solution&lt;/summary&gt;&lt;div&gt;• Slide 128 places &lt;b&gt;bonds payable&lt;/b&gt; among current liabilities: bonds are usually non-current, but the task does not state the maturity, so in the exam state your assumption.&lt;br&gt;• The gain on the land (7,000 − 6,000) is a &lt;em&gt;gain&lt;/em&gt;: that is why it appears below gross profit.&lt;br&gt;• Depreciation is credited to a contra account (&lt;span class=&quot;t&quot;&gt;accumulated depreciation&lt;/span&gt;); the building is presented net.&lt;br&gt;• Check: 20,000 + 900 + 2,000 = 22,900 = total assets.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Extra exercise: reconstruct the Library&#x27;s cash flow statement (our own elaboration, not in the slides)&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Movements&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Total&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Operating&lt;/td&gt;&lt;td&gt;+1,200 collected from the customer · −2,000 paid for books · −100 wages&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−900&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Investing&lt;/td&gt;&lt;td&gt;−2,000 and −4,000 paid for the land · +7,000 sale of the land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financing&lt;/td&gt;&lt;td&gt;+16,000 owners&#x27; contribution · +2,000 bond issue&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+18,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Δ Cash&lt;/td&gt;&lt;td&gt;from 0 to 18,100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,100&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The contributed building (4,000) and depreciation (200) involve no cash: under IAS 7 a contribution in kind is disclosed separately. Note how profit (900) and the change in cash (18,100) are very different figures: this is the &lt;a href=&quot;#qualita&quot;&gt;accrual basis&lt;/a&gt; at work.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;B · The retail shop: resources and claims&lt;/h3&gt;
&lt;p&gt;A business is set up with €100,000 of capital (slides 131–133): cash is a &lt;span class=&quot;t&quot;&gt;resource&lt;/span&gt;, capital is the owner&#x27;s &lt;span class=&quot;t&quot;&gt;claim&lt;/span&gt;. Follow the effect of each transaction (amounts in thousands). Click “Next” to add a row.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;shop&quot;&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;stepbody&quot;&gt;&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Transaction&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cash&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Receiv.&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Other assets&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Liabilities&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Owner: capital &amp;amp; profit&lt;/th&gt;&lt;/tr&gt;
&lt;tr data-r=&quot;0&quot;&gt;&lt;td&gt;0 · Initial capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+100&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+100&lt;/td&gt;&lt;/tr&gt;
