        &lt;text x=&quot;731&quot; y=&quot;449&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;impacts&lt;/text&gt;
        &lt;text x=&quot;731&quot; y=&quot;468&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;tourists · residents · gov · users&lt;/text&gt;&lt;/a&gt;

  &lt;/figure&gt;
&lt;/section&gt;

&lt;section id=&quot;territorio&quot; class=&quot;part p-sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 1 · slides 1–2&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;Territory and its configurations&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · week five.pdf, slides 1–2&lt;/span&gt;
  &lt;p&gt;The title of the lecture combines two ideas. &lt;b&gt;Urbanity&lt;/b&gt; refers to the “urban” character of a space: how far it concentrates people, activities and differences. &lt;b&gt;Territorial processes&lt;/b&gt; are the transformations through which societies organise and reorganise the space they live in. The lecture therefore examines how global processes change the way urban spaces are experienced and used.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;plus&quot;&gt;beyond the slides&lt;/span&gt;In the French school of geography that the lecture cites later on, Jacques Lévy defines &lt;i&gt;urbanité&lt;/i&gt; as the combination of &lt;b&gt;density&lt;/b&gt; and &lt;b&gt;diversity&lt;/b&gt;: more people and more differences in a small space mean more urbanity. This helps explain why proximity and co-presence matter so much in the following sections.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Territory&lt;/b&gt;&lt;br&gt;Geographical space as &lt;i&gt;organised and appropriated&lt;/i&gt; by a society: not just a physical surface, but a space in which someone acts, makes decisions and builds meanings. Slide 2 breaks it down into three &lt;b&gt;configurations&lt;/b&gt;, that is, three ways in which the same territory presents itself and can be analysed.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
   &lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-labelledby=&quot;prt&quot;&gt;
    &lt;title id=&quot;prt&quot;&gt;A single territory read through three lenses: environment, place, landscape&lt;/title&gt;

    &lt;circle cx=&quot;120&quot; cy=&quot;150&quot; r=&quot;78&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;path d=&quot;M70 165 q25-40 50-10 t50-5&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;/&gt;
    &lt;path d=&quot;M78 125 l10-15 l10 15 z M100 125 l12-20 l12 20 z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.5&quot;/&gt;
    &lt;rect x=&quot;128&quot; y=&quot;168&quot; width=&quot;10&quot; height=&quot;14&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;142&quot; y=&quot;162&quot; width=&quot;10&quot; height=&quot;20&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.6&quot;/&gt;
    &lt;text x=&quot;120&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;territory&lt;/text&gt;
    &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar2)&quot;&gt;
     &lt;path d=&quot;M200 120 C260 70 300 60 350 60&quot;/&gt;&lt;path d=&quot;M202 150 L350 150&quot;/&gt;&lt;path d=&quot;M200 180 C260 230 300 240 350 240&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot;&gt;
     &lt;rect x=&quot;355&quot; y=&quot;28&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
     &lt;text x=&quot;370&quot; y=&quot;52&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;environment&lt;/text&gt;
     &lt;text x=&quot;370&quot; y=&quot;74&quot; class=&quot;mut&quot;&gt;What is there? Ecosystems, resources, risks&lt;/text&gt;
     &lt;rect x=&quot;355&quot; y=&quot;118&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
     &lt;text x=&quot;370&quot; y=&quot;142&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;place&lt;/text&gt;
     &lt;text x=&quot;370&quot; y=&quot;164&quot; class=&quot;mut&quot;&gt;What does it mean, and to whom?&lt;/text&gt;
     &lt;rect x=&quot;355&quot; y=&quot;208&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
     &lt;text x=&quot;370&quot; y=&quot;232&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;landscape&lt;/text&gt;
     &lt;text x=&quot;370&quot; y=&quot;254&quot; class=&quot;mut&quot;&gt;How does it look? Perception, image&lt;/text&gt;

   &lt;/svg&gt;
   &lt;figcaption&gt;The three configurations are not three different territories: they are three readings of the same space. The lecture focuses on &lt;b&gt;place&lt;/b&gt; (in ochre).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The three configurations compared&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;The slides only list the three terms; the explanations below develop them. We use a single example throughout, the lagoon and historic centre of Venice, which will return in part 4.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Configurations of territory&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-env&quot; aria-controls=&quot;p-env&quot; aria-selected=&quot;true&quot;&gt;environment&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-pla&quot; aria-controls=&quot;p-pla&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;place&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-lan&quot; aria-controls=&quot;p-lan&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;landscape&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-env&quot; aria-labelledby=&quot;t-env&quot;&gt;
    &lt;p&gt;&lt;b&gt;Environment&lt;/b&gt; is territory read as a &lt;b&gt;system of physical and ecological relations&lt;/b&gt; between society and nature: water, soil, climate, biodiversity, resources, but also pollution and risks. What matters here is what can be measured.&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venice seen as environment:&lt;/i&gt; the balance of the lagoon, &lt;i&gt;acqua alta&lt;/i&gt; (high tides), erosion, and the waste and water consumption generated by visitor flows.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Guiding question: which natural and human processes interact here, and within what limits?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-pla&quot; aria-labelledby=&quot;t-pla&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Place&lt;/b&gt; is territory read as &lt;b&gt;lived space endowed with social meaning&lt;/b&gt;: it belongs to someone, carries an identity, and is where people meet. It is the core of the lecture (parts 2 and 3).&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venice seen as place:&lt;/i&gt; the &lt;i&gt;campo&lt;/i&gt; where residents meet, the neighbourhood festival, the feeling that “this is our city”. Or, for millions of people, a place that symbolises the whole world.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Guiding question: who identifies with this space, and who uses it?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-lan&quot; aria-labelledby=&quot;t-lan&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Landscape&lt;/b&gt; is territory read as a &lt;b&gt;perceived and represented form&lt;/b&gt;: what is seen, painted and photographed, and the value attributed to it.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The &lt;a href=&quot;https://rm.coe.int/16800805ce&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Landscape Convention&lt;/a&gt; (Council of Europe, Florence 2000, art. 1a) defines landscape as “an area, as perceived by people, whose character is the result of the action and interaction of natural and/or human factors”.&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venice seen as landscape:&lt;/i&gt; the view of the Bacino di San Marco, the postcard image that attracts visitors and that visitors themselves reproduce.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Guiding question: how is this space perceived, and by whom?&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card small&quot;&gt;&lt;b&gt;Link to the group work.&lt;/b&gt; The group work outline (&lt;i&gt;week four.pdf&lt;/i&gt;, page 12, “Main points of group work”) asks for a &lt;b&gt;territorial analysis&lt;/b&gt; of the chosen portion of territory (the &lt;i&gt;patch&lt;/i&gt;), a socio-economic and actor analysis, and a section on “global challenges and the &lt;b&gt;perception of the landscape&lt;/b&gt;”. The three configurations provide a ready-made framework for that work: environment → territorial analysis; place → actors and meanings; landscape → perception.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · part 1&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;What are the three configurations of territory on slide 2?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Environment, place and landscape: three readings of the same territory.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What distinguishes landscape from environment?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Environment concerns physical and ecological relations, which are measurable; landscape concerns perception and representation (“an area, as perceived by people”). The same wood is environment as an ecosystem and landscape as a view.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does the lecture focus specifically on place?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because it is the configuration in which social meaning matters, that is, belonging and identity. This is precisely what changes with mondialization, when some places become meaningful to the whole world (hyperplaces).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;luogo&quot; class=&quot;part p-ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 2 · slides 3–5&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;Place in the mondialization process&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · week five.pdf, slides 3–5&lt;/span&gt;
  &lt;p&gt;Slide 3 introduces the central theme: what becomes of &lt;b&gt;place&lt;/b&gt; when the world globalises? To answer, two theoretical tools are needed first: the Greek distinction between &lt;b&gt;topos&lt;/b&gt; and &lt;b&gt;chora&lt;/b&gt;, and the definition of place as &lt;b&gt;coprésence&lt;/b&gt;.&lt;/p&gt;

  &lt;h3 id=&quot;topos-chora&quot;&gt;From topos to chora · Augustin Berque and Yi-Fu Tuan&lt;/h3&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · slide 4&lt;/span&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Topos&lt;/b&gt;&lt;br&gt;&lt;i&gt;Place of the localisation&lt;/i&gt;, i.e. place as &lt;b&gt;position&lt;/b&gt;: a point &lt;i&gt;georeferenced in a map&lt;/i&gt; (with precise coordinates on a map). It answers the question “where?”.&lt;/div&gt;
   &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Chora&lt;/b&gt;&lt;br&gt;&lt;i&gt;Belonging of the place to someone&lt;/i&gt;, i.e. place as &lt;b&gt;belonging&lt;/b&gt; to someone: a &lt;i&gt;place of social meaning&lt;/i&gt;, charged with social significance. It answers the question “what does it mean, and to whom?”.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;margin-top:1rem&quot;&gt;The arrow “from topos to chora” marks a shift in perspective: from a geography that &lt;i&gt;locates&lt;/i&gt; to a geography that &lt;i&gt;interprets&lt;/i&gt;. Two people can stand in the same topos and inhabit different chorai: the tourist&#x27;s square is not the resident&#x27;s square.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;

   &lt;/div&gt;

    &lt;title id=&quot;tct&quot;&gt;The same square read as topos (coordinates on a map) and as chora (social meanings)&lt;/title&gt;

     #tc .chora,#tc .topos{transition:opacity .4s}
     #tc .chora{opacity:0}
     #tc.is-chora .chora{opacity:1}

    &lt;/style&gt;
    &lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;520&quot; height=&quot;300&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot;/&gt;
    &lt;g class=&quot;topos&quot;&gt;
     &lt;g class=&quot;rl&quot;&gt;&lt;path d=&quot;M0 60H520M0 120H520M0 180H520M0 240H520M104 0V300M208 0V300M312 0V300M416 0V300&quot;/&gt;&lt;/g&gt;

    &lt;/g&gt;

     &lt;g&gt;&lt;rect x=&quot;345&quot; y=&quot;18&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;357&quot; y=&quot;35&quot;&gt;“the fountain where&lt;/text&gt;&lt;text x=&quot;357&quot; y=&quot;50&quot;&gt;people arrange to meet”&lt;/text&gt;&lt;/g&gt;
     &lt;g&gt;&lt;rect x=&quot;20&quot; y=&quot;132&quot; width=&quot;170&quot; height=&quot;40&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;32&quot; y=&quot;149&quot;&gt;“the patron saint&#x27;s feast,&lt;/text&gt;&lt;text x=&quot;32&quot; y=&quot;164&quot;&gt;every year for centuries”&lt;/text&gt;&lt;/g&gt;
     &lt;g&gt;&lt;rect x=&quot;335&quot; y=&quot;132&quot; width=&quot;170&quot; height=&quot;40&quot; rx=&quot;14&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;347&quot; y=&quot;149&quot;&gt;“for the tourist: the photo&lt;/text&gt;&lt;text x=&quot;347&quot; y=&quot;164&quot;&gt;to take and to post”&lt;/text&gt;&lt;/g&gt;
     &lt;g&gt;&lt;rect x=&quot;160&quot; y=&quot;250&quot; width=&quot;200&quot; height=&quot;34&quot; rx=&quot;14&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;271&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;chora: “our square”&lt;/text&gt;&lt;/g&gt;

   &lt;figcaption&gt;Coordinates and names are illustrative. As topos, the square is a point with coordinates; as chora, it is a set of uses, memories and forms of belonging, not always shared between residents and visitors.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Who are Berque and Tuan, and where do topos and chora come from?&lt;/summary&gt;&lt;div&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;b&gt;Augustin Berque&lt;/b&gt; is a French geographer and a scholar of Japan. In &lt;i&gt;Écoumène. Introduction à l&#x27;étude des milieux humains&lt;/i&gt; (Belin, 2000) he takes up the pair &lt;i&gt;topos&lt;/i&gt;/&lt;i&gt;chôra&lt;/i&gt; from Plato&#x27;s &lt;i&gt;Timaeus&lt;/i&gt;: topos is the material layer, the physical position; chôra is the existential layer, defined by relations with other things and people. He calls the moment in which the two meet &lt;b&gt;médiance&lt;/b&gt; (sources: &lt;a href=&quot;https://journals.openedition.org/vertigo/9384&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VertigO&lt;/a&gt;; &lt;a href=&quot;https://espacestemps.net/articles/lieu-def1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;entry “Lieu” on EspacesTemps&lt;/a&gt;).&lt;/p&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;b&gt;Yi-Fu Tuan&lt;/b&gt; is a Chinese-American geographer, the father of humanistic geography. In &lt;i&gt;Space and Place: The Perspective of Experience&lt;/i&gt; (University of Minnesota Press, 1977) he distinguishes &lt;b&gt;space&lt;/b&gt;, which is open and abstract, associated with freedom and movement, from &lt;b&gt;place&lt;/b&gt;, space to which experience has given value, security and pause: “place is security, space is freedom” (&lt;a href=&quot;https://www.wikipedia.org/wiki/Yi-Fu_Tuan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;entry on Yi-Fu Tuan&lt;/a&gt;).&lt;/p&gt;
   &lt;p class=&quot;small muted&quot;&gt;The parallel: topos ≈ space (neutral position); chora ≈ place (lived space). For both authors, place arises from the relationship between people and space.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;levy&quot;&gt;Place according to Jacques Lévy · coprésence&lt;/h3&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · slide 5 (first half)&lt;/span&gt;
  &lt;blockquote&gt;«Le noyau central du concept de lieu au sein de la connaissance de l&#x27;espace des sociétés porterait plutôt sur la &lt;b&gt;coprésence&lt;/b&gt;, c&#x27;est-à-dire aussi sur la &lt;b&gt;cospatialité&lt;/b&gt; poussée jusqu&#x27;au bout.»
   &lt;cite&gt;J. Lévy &amp;amp; M. Lussault (eds.), &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt;, Paris, Belin, 2003. Translation: “The central core of the concept of place, within the knowledge of the space of societies, would rather concern co-presence, that is, also cospatiality pushed to its limit.”&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;b&gt;Coprésence&lt;/b&gt; (co-presence) means being present together, in the same space at the same time. &lt;b&gt;Cospatialité&lt;/b&gt; (cospatiality) means sharing a space. For Lévy, a place is where this sharing is at its maximum. Two properties on the slide follow from this:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;1 · Distance is not relevant&lt;/b&gt;&lt;br&gt;Within a place, distance carries no weight: everything and everyone is “within reach”. There is no need to move or to communicate at a distance in order to interact.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;2 · Transfert of the identity of a society&lt;/b&gt;&lt;br&gt;Place transfers and makes visible the identity of a society: those who frequent it recognise and reproduce a “we” there.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;plus&quot;&gt;beyond the slides&lt;/span&gt;Lévy distinguishes three ways in which societies manage distance: &lt;b&gt;coprésence&lt;/b&gt; (cancelling it by being together), &lt;b&gt;mobilité&lt;/b&gt; (overcoming it by moving), &lt;b&gt;télécommunication&lt;/b&gt; (overcoming it by communicating). Place is the domain of the first, which is why it applies at any scale: a room, a square, a dense city.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
   &lt;label for=&quot;cop&quot; class=&quot;small&quot;&gt;&lt;b&gt;Try it:&lt;/b&gt; bring the people closer together and watch co-presence emerge&lt;/label&gt;
   &lt;input type=&quot;range&quot; id=&quot;cop&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; aria-describedby=&quot;cop-out&quot;&gt;
   &lt;svg id=&quot;copsvg&quot; viewBox=&quot;0 0 520 250&quot; role=&quot;img&quot; aria-label=&quot;Twelve people moving from scattered to gathered in a place; the lines show who can interact without moving&quot;&gt;
    &lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;520&quot; height=&quot;250&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot;/&gt;
    &lt;circle id=&quot;cop-ring&quot; cx=&quot;260&quot; cy=&quot;125&quot; r=&quot;70&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;5 4&quot; opacity=&quot;0&quot;/&gt;
    &lt;text id=&quot;cop-lab&quot; x=&quot;260&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot; opacity=&quot;0&quot;&gt;place&lt;/text&gt;
    &lt;g id=&quot;cop-links&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.2&quot; opacity=&quot;.75&quot;&gt;&lt;/g&gt;
    &lt;g id=&quot;cop-dots&quot;&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;readout&quot; id=&quot;cop-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;Illustrative model: two people are co-present if they can interact without moving (distance &amp;lt; threshold). The more cospatiality grows, the less distance matters.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;card small&quot;&gt;&lt;b&gt;Link to week four.&lt;/b&gt; The &lt;i&gt;Indigenous Systems Framework&lt;/i&gt; shown in &lt;i&gt;week four.pdf&lt;/i&gt; (page 8) centres relationality, reciprocity and &lt;i&gt;spiritual relationship to land&lt;/i&gt;: it is a strong example of chora, a territory that belongs to a community before it is a position on a map. The same page contrasts &lt;b&gt;legitimacy&lt;/b&gt; (legitimacy recognised by a community) with &lt;b&gt;legality&lt;/b&gt; (conformity with formal law): chora often grounds the former, the land registry the latter.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · part 2&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Explain the difference between topos and chora with an example.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Topos is localisation (the georeferenced point on a map); chora is the belonging of the place to someone, its social meaning. The same football pitch is a topos with coordinates; for a neighbourhood team it is chora: “our pitch”.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;According to Lévy, what is the “core” of the concept of place?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Coprésence, i.e. cospatiality pushed to its limit: being together in the same space.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What does it mean that in a place “distance is not relevant”?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;That within the place distance is no obstacle to interaction: everyone can be reached without mobility or telecommunication.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In what way are Lévy&#x27;s and Tuan&#x27;s notions of place similar?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;For both, place is not a neutral point: it arises from a social, lived relationship with space. Tuan describes it in terms of experience and attachment; Lévy in terms of co-presence and the transfer of a society&#x27;s identity.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;iperluogo&quot; class=&quot;part p-slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 3 · slides 5–7&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;Hyperplace · Michel Lussault&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · week five.pdf, slide 5 (second half), 6, 7&lt;/span&gt;
  &lt;p&gt;With mondialization, some places cease to belong only to a local society and become places of the whole world. Michel Lussault calls them &lt;b&gt;hyperplaces&lt;/b&gt; (&lt;i&gt;hyper-lieux&lt;/i&gt;).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Hyperplace&lt;/b&gt;&lt;br&gt;A spatial extent in which:&lt;br&gt;1) there is a &lt;b&gt;political or touristic function&lt;/b&gt; (the slide leaves the list open with “…”);&lt;br&gt;2) the &lt;b&gt;transfert of the identity of the world society&lt;/b&gt; takes place: the identity of &lt;i&gt;world society&lt;/i&gt;, no longer only that of a local society, is transferred and staged there.&lt;/div&gt;

  &lt;h3&gt;Place and hyperplace compared&lt;/h3&gt;
  &lt;p&gt;The two definitions on slide 5 are built in parallel: what changes above all is &lt;b&gt;whose&lt;/b&gt; identity the place transfers.&lt;/p&gt;

    &lt;/g&gt;

    &lt;g transform=&quot;translate(470 130)&quot;&gt;

     &lt;g stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;path d=&quot;M0 -32V-106M0 32V106M-32 0H-106M32 0H106M23 -23L77 -77M-23 23L-77 77M23 23L77 77M-23 -23L-77 -77&quot;/&gt;&lt;/g&gt;
     &lt;text y=&quot;-88&quot; x=&quot;40&quot; font-size=&quot;10&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;world&lt;/text&gt;

    &lt;text x=&quot;470&quot; y=&quot;254&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;identity of &lt;tspan font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot;&gt;world society&lt;/tspan&gt;&lt;/text&gt;

   &lt;figcaption&gt;Place is rooted in one society; hyperplace is connected to all scales at once: local, national, global.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Place (Lévy)&lt;/th&gt;&lt;th&gt;Hyperplace (Lussault)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Principle&lt;/b&gt;&lt;/td&gt;&lt;td&gt;co-presence: distance does not matter&lt;/td&gt;&lt;td&gt;co-presence on a world scale: people, goods, images from everywhere&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Identity transferred&lt;/b&gt;&lt;/td&gt;&lt;td&gt;of &lt;i&gt;a&lt;/i&gt; society&lt;/td&gt;&lt;td&gt;of &lt;i&gt;world society&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;

   &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Table built from slide 5; the rows “who frequents it” and “risk” are an interpretive synthesis.&lt;/p&gt;

    &lt;p&gt;&lt;b&gt;What the photo shows.&lt;/b&gt; A New York square saturated with screens and billboards of global brands (in the photo: McDonald&#x27;s, Bank of America, Broadway musicals) and a crowd of visitors from all over the world.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it is a hyperplace.&lt;/b&gt; Its function is touristic and commercial; the identity staged there is not that of a neighbourhood but that of the world society of consumption and media. It is known to people who have never been there, and people go there in order to have been there.&lt;/p&gt;

    &lt;p&gt;&lt;b&gt;What the photo shows.&lt;/b&gt; The Piazzetta di San Marco in Venice, between the Doge&#x27;s Palace and the Biblioteca Marciana, with the two columns facing the basin, packed with groups of tourists.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Why it is a hyperplace.&lt;/b&gt; It was the political heart of the Republic of Venice, that is, the place of one society. Today its dominant function is touristic and its identity is that of a World Heritage site: symbolically, it belongs to the world. It is also the image that introduces slide 8 on overtourism.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Lussault&#x27;s book on hyper-lieux&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
   &lt;p&gt;Michel Lussault, a geographer and professor at the École normale supérieure de Lyon, developed the concept in his book &lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt; (Seuil, 2017). His thesis is that mondialization does not make the world uniform but &lt;b&gt;differentiates&lt;/b&gt; it: places emerge that act as “footholds” and anchor points of mondialization, where people and material and immaterial realities converge (&lt;a href=&quot;https://journals.openedition.org/lectures/22515&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review on OpenEdition Lectures&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Place or hyperplace? Test yourself&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;Open each box after you have decided. There are no sharp boundaries: what counts is reasoning with the two criteria on the slide.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Your neighbourhood market&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Place.&lt;/b&gt; Co-presence and the identity of a local community; no global function.&lt;/div&gt;&lt;/details&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;A major international airport&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Leans towards hyperplace.&lt;/b&gt; Flows from all over the world intersect there and its function is global, although the identity it stages is weaker than in a symbolic square.&lt;/div&gt;&lt;/details&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;A city during the Olympic Games&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Temporary hyperplace.&lt;/b&gt; For a few weeks the city stages world society. The impact of the Games was one of last year&#x27;s group topics (&lt;i&gt;week four.pdf&lt;/i&gt;, page 13).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · part 3&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;What are the two criteria for a hyperplace according to slide 5?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) A political or touristic function (the list is open); 2) the transfer of the identity of world society.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the key difference between place (Lévy) and hyperplace (Lussault)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Place transfers the identity of a society; hyperplace transfers that of world society. The shift is from the local to the global scale.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why is Piazza San Marco a good example of the shift from place to hyperplace?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because it was the political and identity centre of a specific society, the Republic of Venice, and today it is above all a tourist site representing a heritage of the whole world.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;overtourism&quot; class=&quot;part p-brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 4 · slide 8&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;Hyperplaces and overtourism&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · week five.pdf, slide 8&lt;/span&gt;
  &lt;p&gt;If a hyperplace attracts the whole world, what happens when the world actually arrives, all at once? Slide 8 answers with an almost medical concept.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Overtourism&lt;/b&gt;&lt;br&gt;A &lt;b&gt;territorial pathology&lt;/b&gt; linked to the &lt;b&gt;massive presence of tourists and tourism services&lt;/b&gt; in a place, which creates &lt;b&gt;problems to the territory carrying capacity&lt;/b&gt;.&lt;/div&gt;
  &lt;p&gt;Let us read the definition piece by piece:&lt;/p&gt;
  &lt;ul&gt;
   &lt;li&gt;&lt;b&gt;Pathology&lt;/b&gt;: the territory is treated as an organism that falls ill. Tourism is not harmful in itself; it becomes so beyond a certain threshold.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Tourists and tourism services&lt;/b&gt;: it is not only people that count but also what tourism gives rise to, such as short-term rentals, souvenir shops, catering, dedicated transport. These services replace those for residents.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Carrying capacity&lt;/b&gt;: the threshold beyond which the place stops functioning (see below).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The UNWTO report &lt;i&gt;&#x27;Overtourism&#x27;? Understanding and Managing Urban Tourism Growth beyond Perceptions&lt;/i&gt; (2018) defines overtourism as “the impact of tourism on a destination, or parts thereof, that excessively influences perceived quality of life of citizens and/or quality of visitors&#x27; experiences in a negative way” (&lt;a href=&quot;https://unwto.org/global/publication/overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNWTO page&lt;/a&gt;; definition reported by &lt;a href=&quot;https://www.etoa.org/research/unwto-and-celth-report-overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ETOA&lt;/a&gt;). Compared with the slide, this definition emphasises &lt;i&gt;perception&lt;/i&gt;: that of residents and of visitors.&lt;/p&gt;

  &lt;h3 id=&quot;capacity&quot;&gt;Carrying capacity · the threshold&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;plus&quot;&gt;beyond the slides&lt;/span&gt;The &lt;b&gt;carrying capacity&lt;/b&gt; of a tourist place is the maximum number of visitors it can accommodate without degrading the environment, residents&#x27; lives and the quality of the visit. It is not a single number: there are several thresholds, and the first one to be exceeded triggers the problem.&lt;/p&gt;
  &lt;div class=&quot;grid3 small&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Physical&lt;/b&gt;&lt;br&gt;How many people physically fit: bridges, &lt;i&gt;calli&lt;/i&gt; (narrow streets), public transport.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Ecological&lt;/b&gt;&lt;br&gt;What the environment can sustain: water, waste, wildlife, soil.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Social and perceptual&lt;/b&gt;&lt;br&gt;How much residents tolerate and how much crowding visitors accept.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def small&quot;&gt;&lt;b&gt;Two simple indicators&lt;/b&gt; &lt;span class=&quot;plus&quot;&gt;beyond the slides&lt;/span&gt;&lt;br&gt;
   &lt;b&gt;Tourism intensity&lt;/b&gt; = tourist overnight stays (nights spent) ÷ residents, over a given period.&lt;br&gt;
   &lt;b&gt;Tourism density&lt;/b&gt; = visitors ÷ area (km²).&lt;br&gt;
   Example: 5 million nights in a year for 50,000 residents give an intensity of 100 nights per inhabitant. The figure shows how much tourism weighs relative to those who live there; on its own it does not tell you whether the threshold has been exceeded.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot; id=&quot;chartfig&quot;&gt;
   &lt;label for=&quot;vis&quot; class=&quot;small&quot;&gt;&lt;b&gt;Move the slider:&lt;/b&gt; visitors per day, as a % of carrying capacity&lt;/label&gt;
   &lt;input type=&quot;range&quot; id=&quot;vis&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;40&quot; aria-describedby=&quot;vis-out&quot;&gt;
   &lt;svg id=&quot;chart&quot; viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Chart: as visitor numbers grow, economic benefits grow ever more slowly, while the quality of the visit and of residents&#x27; lives declines beyond the threshold&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;readout&quot; id=&quot;vis-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;Illustrative model, not taken from the slides: the curves show the qualitative logic, not real data. Residents&#x27; mood follows Doxey&#x27;s &lt;i&gt;Irridex&lt;/i&gt; (see “Further reading”).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;impatti&quot;&gt;Impacts · who pays the bill&lt;/h3&gt;
  &lt;p&gt;Slide 8 arranges the impacts as a cascade of arrows. Tap an actor to read what it suffers.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
   &lt;svg id=&quot;actors&quot; viewBox=&quot;0 0 600 300&quot; role=&quot;group&quot; aria-label=&quot;Diagram of the impacts of overtourism on four actors&quot;&gt;

    &lt;g stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar3)&quot;&gt;
     &lt;path d=&quot;M250 50 L160 100&quot;/&gt;&lt;path d=&quot;M350 50 L440 100&quot;/&gt;&lt;path d=&quot;M300 58 L300 180&quot;/&gt;&lt;path d=&quot;M450 150 L470 210&quot;/&gt;
    &lt;/g&gt;
    &lt;rect x=&quot;230&quot; y=&quot;18&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;20&quot; fill=&quot;var(--brick)&quot;/&gt;

    &lt;g class=&quot;actor&quot; data-a=&quot;0&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Tourists&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;100&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;131&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Tourists&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;actor&quot; data-a=&quot;1&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Residents&quot;&gt;&lt;rect x=&quot;360&quot; y=&quot;100&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;131&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Residents&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;actor&quot; data-a=&quot;2&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Local government&quot;&gt;&lt;rect x=&quot;200&quot; y=&quot;180&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;211&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Local government&lt;/text&gt;&lt;/g&gt;
    &lt;g class=&quot;actor&quot; data-a=&quot;3&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Other city-users&quot;&gt;&lt;rect x=&quot;410&quot; y=&quot;212&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;495&quot; y=&quot;243&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Other city-users&lt;/text&gt;&lt;/g&gt;
    &lt;text x=&quot;155&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;experience in the place&lt;/text&gt;

    &lt;text x=&quot;300&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;social · environmental · economic&lt;/text&gt;

  &lt;h3&gt;How a place reaches its limit · Butler&#x27;s life cycle&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A classic model, not cited in the slides but helpful for understanding carrying capacity over time, is Richard Butler&#x27;s &lt;b&gt;Tourism Area Life Cycle&lt;/b&gt; (&lt;i&gt;The Canadian Geographer&lt;/i&gt;, 1980). A destination grows along an S-shaped curve until it reaches the critical range of carrying capacity; it may then decline or be rejuvenated. Step through the stages.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
   &lt;svg id=&quot;butler&quot; viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Life-cycle curve of a tourist destination according to Butler&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bu-prev&quot; aria-label=&quot;Previous stage&quot;&gt;← Back&lt;/button&gt;
    &lt;span class=&quot;small muted&quot; id=&quot;bu-count&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bu-next&quot; aria-label=&quot;Next stage&quot;&gt;Next →&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;panel&quot; id=&quot;bu-panel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;x-axis: time; y-axis: number of visitors. The model is widely cited but also criticised, because it is difficult to apply and real curves often diverge from it (&lt;a href=&quot;https://strathprints.strath.ac.uk/88392/1/Butler-TG-2024-Tourism-destination-development-the-tourism.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Butler, 2024, on Strathprints&lt;/a&gt;).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Possible responses&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Responses to overtourism&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r1&quot; aria-controls=&quot;p-r1&quot; aria-selected=&quot;true&quot;&gt;UNWTO strategies&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r2&quot; aria-controls=&quot;p-r2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;The Venice case&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r3&quot; aria-controls=&quot;p-r3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;The political crux&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r1&quot; aria-labelledby=&quot;t-r1&quot;&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The 2018 UNWTO report analyses residents&#x27; perceptions in eight European cities (Amsterdam, Barcelona, Berlin, Copenhagen, Lisbon, Munich, Salzburg, Tallinn) and proposes &lt;b&gt;11 strategies and 68 measures&lt;/b&gt;. Among them: involving the local community, managing congestion, reducing seasonality, setting capacity limits, diversifying the offer. The underlying message is that there is no single solution: tourism must be embedded in an urban strategy for sustainable development (&lt;a href=&quot;https://www.etoa.org/research/unwto-and-celth-report-overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ETOA summary&lt;/a&gt;).&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r2&quot; aria-labelledby=&quot;t-r2&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Since spring 2024 the Municipality of Venice has been trialling an &lt;b&gt;access fee&lt;/b&gt; for day-trippers who visit the city without staying overnight. It is charged on peak days and at peak times and is booked online; overnight visitors already pay the tourist tax. It is an attempt to act on carrying capacity by regulating flows rather than banning them. Days, amounts and exemptions change from year to year: check them on the &lt;a href=&quot;https://veneziaunica.it/en/content/venice_access_fee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;official website&lt;/a&gt;.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Critical prompt: an entry ticket to a city turns a place into a paid attraction. Does it solve overtourism, or does it confirm that the place has by now become a hyperplace?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r3&quot; aria-labelledby=&quot;t-r3&quot; hidden&gt;
    &lt;p&gt;Every measure redistributes costs and benefits among the actors in the diagram: those who profit from tourism (operators, short-term rental owners, the municipal budget) are not the same as those who bear its costs (residents, city-users). This is the same logic that &lt;i&gt;week four.pdf&lt;/i&gt; (page 9) sums up as &lt;b&gt;“Justice is geopolitical”&lt;/b&gt;: the distribution of costs and benefits determines whether there will be cooperation. &lt;b&gt;“Scale matters”&lt;/b&gt; also applies: local impacts depend on global markets and institutions, such as low-cost flights, cruises and rental platforms.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check · part 4&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Restate the definition of overtourism from slide 8 in your own words.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;It is a territorial pathology: the massive presence of tourists and tourism services in a place exceeds its carrying capacity and creates problems for the place and for those who use it.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which actors suffer the impacts, and what kind of problem does each face?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Tourists: problems in the experience of the place. Residents: problems with everyday life services. Local government: social, environmental and economic problems. Other city-users: problems that also affect commuters, students and workers.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Why does overtourism mainly affect hyperplaces?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because a hyperplace attracts world society: its touristic function and global identity draw enormous flows, concentrated in a limited space. Co-presence, which defines place, turns into congestion beyond the threshold.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Is carrying capacity a fixed number?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;No. It has several dimensions (physical, ecological, social, perceptual) and also depends on how the place is managed: opening hours, distribution of flows, seasonality.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;collegamenti&quot; class=&quot;part&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Connections within the course&lt;/div&gt;
  &lt;h2&gt;Week five and the rest of the course&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;from the slides · week four.pdf (pages indicated) · week five.pdf&lt;/span&gt;
  &lt;p&gt;Week four, devoted to case studies on sustainability and power, closes with a synthesis that applies well to hyperplaces. Here is where the two lectures intersect.&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;“Scale matters” → hyperplace&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; “Local impacts are tied to global markets and institutions”. This is exactly what a hyperplace is: a local place in which world society is concentrated. The impacts of overtourism are visible in a square but depend on global flows.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;“Justice is geopolitical” → who pays for overtourism&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; “Distribution of costs and benefits shapes cooperation”. The impact diagram on slide 8 is a map of costs distributed unequally among tourists, residents, local government and city-users.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;“Institutions lag behind change” → governing flows&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; “Rules remain fragmented while systems are connected”. Tourist flows are global, while the tools for managing them, such as tickets, limits and rules on short-term rentals, are municipal. It is the same asymmetry seen for digital data, which “cross borders faster than political institutions can regulate them” (p. 5).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Indigenous perspectives → chora and belonging&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, pp. 7–8:&lt;/i&gt; Knowledge, Authority, Justice, &lt;b&gt;Resilience: “Adaptation rooted in place”&lt;/b&gt;, and the contrast &lt;b&gt;legitimacy versus legality&lt;/b&gt;. This is an idea of territory as chora: relations between people, land and non-human life, not just coordinates and property.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Group work → applying the concepts to a patch&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, pp. 12–15:&lt;/i&gt; the structure of the group work (territorial analysis, socio-economic analysis, social actors, global challenges and perception of the landscape) and the examples of places discussed in class (Greenland, Malaysia, Cyprus, Australia). For each place you can ask: is it a place, a hyperplace or both? Which actors suffer its impacts, as in the diagram on slide 8?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, texts and sources&lt;/h2&gt;
  &lt;p&gt;For each entry: what it contains and why it matters for this lecture. Bibliographic details and links come from web searches (&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;). Entries cited in the slides are kept separate from those added as supplementary material.&lt;/p&gt;

  &lt;h3 style=&quot;color:var(--accent)&quot;&gt;Cited in the slides&lt;/h3&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;h4&gt;Augustin Berque · topos and chôra, &lt;i&gt;Écoumène&lt;/i&gt; (Belin, 2000)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A French geographer who takes the pair topos/chôra from Plato&#x27;s &lt;i&gt;Timaeus&lt;/i&gt;: physical position versus existential and relational field. He links the two notions through the concept of &lt;i&gt;médiance&lt;/i&gt;, the moment in which they meet, and defines the ecumene as humanity&#x27;s ecological, technical and symbolic relationship with the Earth&#x27;s surface. &lt;b&gt;Why it matters:&lt;/b&gt; it is the theoretical source of slide 4. Links: &lt;a href=&quot;https://espacestemps.net/articles/lieu-def1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Berque&#x27;s entry “Lieu” (EspacesTemps)&lt;/a&gt; · &lt;a href=&quot;https://journals.openedition.org/vertigo/9384&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;article in VertigO&lt;/a&gt; · &lt;a href=&quot;https://rosa.uniroma1.it/rosa03/semestrale_di_geografia/article/view/14948&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Geografia e spatial turn: la lettura di Augustin Berque” (Semestrale di Geografia, in Italian)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Yi-Fu Tuan · &lt;i&gt;Space and Place: The Perspective of Experience&lt;/i&gt; (University of Minnesota Press, 1977)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A founding text of humanistic geography: space is freedom and abstraction, place is security and space made meaningful by experience. Chapters on the body, crowding, mythical space and attachment to homeland. &lt;b&gt;Why it matters:&lt;/b&gt; he is the second author on slide 4 and explains how a space becomes a lived place. Links: &lt;a href=&quot;https://www.wikipedia.org/wiki/Yi-Fu_Tuan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Yi-Fu Tuan (Wikipedia)&lt;/a&gt; · &lt;a href=&quot;https://theologyandsociety.com/review-space-and-place-the-perspective-of-experience-by-yi-fu-tuan/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review of the book&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Jacques Lévy &amp;amp; Michel Lussault (eds.) · &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt; (Belin, 2003; new ed. 2013)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A critical dictionary written by more than a hundred authors: not a gazetteer of places but a systematisation of the concepts of geography (theory of space, epistemology, thinkers). &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the quotation on coprésence on slide 5, and contains the entry “Lieu”. Links: &lt;a href=&quot;https://espacestemps.net/articles/dictionnaire-de-la-geographie-et-de-lespace-des-societes/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;presentation on EspacesTemps&lt;/a&gt; · &lt;a href=&quot;https://ugr.es/~cuadgeo/docs/articulos/035/035-011.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in Cuadernos Geográficos (2004, PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Michel Lussault · &lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt; (Seuil, 2017)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The book in which Lussault develops the concept of hyper-lieu: mondialization differentiates the world and brings out places that act as footholds and anchors of global social life. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the definition of hyperplace (slide 5) and of the examples on slides 6–7. Links: &lt;a href=&quot;https://journals.openedition.org/lectures/22515&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review on OpenEdition Lectures&lt;/a&gt; · &lt;a href=&quot;https://www.mollat.com/videos/rencontre-avec-michel-lussault-hyper-lieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;video talk with the author (Mollat)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3 style=&quot;color:var(--accent)&quot;&gt;Useful additions (not cited in the slides)&lt;/h3&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;h4&gt;UNWTO · &lt;i&gt;&#x27;Overtourism&#x27;? Understanding and Managing Urban Tourism Growth beyond Perceptions&lt;/i&gt; (2018)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A report by the World Tourism Organization with CELTH and ETFI (authors Koens, Postma, Papp). It offers a perception-based definition of overtourism, a survey of residents in eight European cities, and 11 strategies with 68 measures. &lt;b&gt;Why it matters:&lt;/b&gt; it is the most frequently cited institutional reference on the topic of slide 8. Link: &lt;a href=&quot;https://unwto.org/global/publication/overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNWTO page&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Richard Butler · “The Concept of a Tourist Area Cycle of Evolution” (&lt;i&gt;The Canadian Geographer&lt;/i&gt;, 24(1), 1980)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A model of the development stages of a destination (exploration → stagnation → decline or rejuvenation), linked to exceeding carrying capacity. Widely cited and widely debated. &lt;b&gt;Why it matters:&lt;/b&gt; it adds a temporal dimension to carrying capacity. Link: &lt;a href=&quot;https://strathprints.strath.ac.uk/88392/1/Butler-TG-2024-Tourism-destination-development-the-tourism.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Butler (2024), the author&#x27;s reflection on the model (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;George Doxey · Irridex, “A Causation Theory of Visitor–Resident Irritants” (1975)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;An index of residents&#x27; irritation: euphoria → apathy → annoyance → antagonism as tourist numbers grow. Criticised for being linear and never systematically tested. &lt;b&gt;Why it matters:&lt;/b&gt; it describes the impact on the “residents” of slide 8. Link: &lt;a href=&quot;https://www.hosteltur.com/hosteltur-responde/indice-irritacion-doxey&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;explanation on Hosteltur (in Spanish)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Council of Europe · European Landscape Convention (Florence, 2000)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;A treaty that defines landscape as an area perceived by people and calls for its protection, management and planning. &lt;b&gt;Why it matters:&lt;/b&gt; it clarifies the “landscape” configuration on slide 2. Link: &lt;a href=&quot;https://rm.coe.int/16800805ce&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;official text (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Municipality of Venice · Venice Access Fee&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Official page on the access fee for day-trippers: who pays, on which days and at what times, how to book. &lt;b&gt;Why it matters:&lt;/b&gt; it is a concrete case of carrying-capacity management in the hyperplace of slide 7. Link: &lt;a href=&quot;https://veneziaunica.it/en/content/venice_access_fee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;veneziaunica.it&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;&lt;b&gt;Summary written by Claude from the slides: always check against the material.&lt;/b&gt;&lt;/p&gt;
    &lt;p&gt;Content marked &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; comes from web searches, with a link to the source; content marked &lt;span class=&quot;plus&quot;&gt;beyond the slides&lt;/span&gt; is additional explanation of points the slides take for granted.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var NS=&quot;http://www.w3.org/2000/svg&quot;;
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

  /* linguette */
  $$(&quot;.tabs&quot;).forEach(function(box){
    var tabs=$$(&quot;[role=tab]&quot;,box);
    function sel(t){tabs.forEach(function(x){var on=x===t;x.setAttribute(&quot;aria-selected&quot;,on);x.tabIndex=on?0:-1;var p=document.getElementById(x.getAttribute(&quot;aria-controls&quot;));if(p)p.hidden=!on})}
    tabs.forEach(function(t,i){
      t.addEventListener(&quot;click&quot;,function(){sel(t)});
      t.addEventListener(&quot;keydown&quot;,function(e){var d=e.key===&quot;ArrowRight&quot;?1:e.key===&quot;ArrowLeft&quot;?-1:0;if(d){var n=tabs[(i+d+tabs.length)%tabs.length];sel(n);n.focus();e.preventDefault()}});
    });
  });

  /* topos / chora */
  var tc=$(&quot;#tc&quot;),bT=$(&quot;#b-topos&quot;),bC=$(&quot;#b-chora&quot;);
  if(tc&amp;&amp;bT&amp;&amp;bC){
    function mode(ch){tc.classList.toggle(&quot;is-chora&quot;,ch);bT.classList.toggle(&quot;on&quot;,!ch);bC.classList.toggle(&quot;on&quot;,ch);bT.setAttribute(&quot;aria-pressed&quot;,!ch);bC.setAttribute(&quot;aria-pressed&quot;,ch)}
    bT.addEventListener(&quot;click&quot;,function(){mode(false)});
    bC.addEventListener(&quot;click&quot;,function(){mode(true)});
  }

  /* copresenza */
  var cop=$(&quot;#cop&quot;),cs=$(&quot;#copsvg&quot;);
  if(cop&amp;&amp;cs){
    var far=[[40,40],[140,210],[480,30],[90,130],[400,215],[300,25],[500,140],[210,60],[30,225],[350,120],[440,85],[180,170]];
    var near=[];
    for(var i=0;i&lt;12;i++){var a=i/12*Math.PI*2,r=i%2?44:22;near.push([260+Math.cos(a)*r,125+Math.sin(a)*r])}
    var gD=$(&quot;#cop-dots&quot;),gL=$(&quot;#cop-links&quot;),dots=[];
    far.forEach(function(){dots.push(el(&quot;circle&quot;,{r:7,fill:&quot;var(--ink)&quot;},gD))});
    var TH=60,ring=$(&quot;#cop-ring&quot;),lab=$(&quot;#cop-lab&quot;),out=$(&quot;#cop-out&quot;);
    function drawCop(){
      var t=cop.value/100,e=t*t*(3-2*t),P=[];
      for(var i=0;i&lt;12;i++){var x=far[i][0]+(near[i][0]-far[i][0])*e,y=far[i][1]+(near[i][1]-far[i][1])*e;P.push([x,y]);dots[i].setAttribute(&quot;cx&quot;,x);dots[i].setAttribute(&quot;cy&quot;,y)}
      while(gL.firstChild)gL.removeChild(gL.firstChild);
      var n=0,sum=0,m=0;
      for(var a=0;a&lt;12;a++)for(var b=a+1;b&lt;12;b++){var d=Math.hypot(P[a][0]-P[b][0],P[a][1]-P[b][1]);sum+=d;m++;if(d&lt;TH){n++;el(&quot;line&quot;,{x1:P[a][0],y1:P[a][1],x2:P[b][0],y2:P[b][1]},gL)}}
      ring.setAttribute(&quot;opacity&quot;,Math.max(0,(t-.6)/.4));lab.setAttribute(&quot;opacity&quot;,Math.max(0,(t-.75)/.25));
      var msg=t&lt;.35?&quot;scattered people: interaction requires mobility or telecommunication&quot;:t&lt;.8?&quot;cospatiality grows: co-present groups form&quot;:&quot;place: everyone within reach, distance is no longer relevant&quot;;
      out.innerHTML=&quot;&lt;span&gt;Co-present pairs: &lt;b&gt;&quot;+n+&quot;&lt;/b&gt; / 66&lt;/span&gt;&lt;span&gt;Mean distance: &lt;b&gt;&quot;+Math.round(sum/m)+&quot;&lt;/b&gt; units&lt;/span&gt;&lt;span&gt;&quot;+msg+&quot;&lt;/span&gt;&quot;;
    }
    cop.addEventListener(&quot;input&quot;,drawCop);drawCop();
  }

  /* attori overtourism */
  var AT=[
    [&quot;Tourists · problems in the experience in the place&quot;,&quot;Queues, crowds, inflated prices, the feeling of a place “staged” for visitors. This is the paradox of the hyperplace: tourists help to consume the very thing they came to find.&quot;],
    [&quot;Residents · problems in every day life services&quot;,&quot;Overcrowded public transport, neighbourhood shops replaced by souvenir shops and catering, homes converted into short-term rentals, hence higher rents and inhabitants moving away. The residents&#x27; place loses its chora: “our square” is no longer theirs.&quot;],
    [&quot;Local government · social, environmental, economic problems&quot;,&quot;Social: tensions between residents and visitors, depopulation. Environmental: waste, water consumption, wear and tear on heritage. Economic: tourism brings revenue but also costs for cleaning, security and maintenance, and makes the local economy dependent on a single sector. Local government has to choose whom to protect.&quot;],
    [&quot;Other city-users · knock-on effects&quot;,&quot;On the slide the arrow starts from the residents: the problems spread to those who use the city without living in it, such as commuters, students, workers and service users. They too find transport, spaces and services congested. (&lt;i&gt;City users&lt;/i&gt; is a term from urban sociology for people who frequent a city for work, study or consumption.)&quot;]
  ];
  var actors=$$(&quot;#actors .actor&quot;),ap=$(&quot;#actor-panel&quot;);
  actors.forEach(function(g){
    function pick(){actors.forEach(function(x){x.classList.toggle(&quot;sel&quot;,x===g);x.setAttribute(&quot;aria-pressed&quot;,x===g)});var a=AT[+g.getAttribute(&quot;data-a&quot;)];ap.innerHTML=&quot;&lt;b&gt;&quot;+a[0]+&quot;&lt;/b&gt;&lt;br&gt;&quot;+a[1]}
    g.setAttribute(&quot;aria-pressed&quot;,&quot;false&quot;);
    g.addEventListener(&quot;click&quot;,pick);
    g.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();pick()}});
  });

  /* grafico carrying capacity */
  var ch=$(&quot;#chart&quot;),vis=$(&quot;#vis&quot;);
  if(ch&amp;&amp;vis){
    var X=function(v){return 50+v/200*490},Y=function(q){return 255-q*2.3};
    var econ=function(v){return 100*(1-Math.exp(-v/70))};
    var tour=function(v){return v&lt;70?88:Math.max(4,88-.011*(v-70)*(v-70))};
    var res=function(v){return Math.max(3,85-.12*v-(v&gt;80?.009*(v-80)*(v-80):0))};
    el(&quot;rect&quot;,{x:X(100),y:15,width:X(200)-X(100),height:240,fill:&quot;var(--brick-bg)&quot;},ch);
    el(&quot;path&quot;,{d:&quot;M50 15V255H540&quot;,class:&quot;ln&quot;},ch);
    [0,50,100,150,200].forEach(function(v){var t=el(&quot;text&quot;,{x:X(v),y:272,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},ch);t.textContent=v+&quot;%&quot;});
    var t1=el(&quot;text&quot;,{x:295,y:292,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},ch);t1.textContent=&quot;visitors / carrying capacity&quot;;
    var t2=el(&quot;text&quot;,{x:14,y:135,&quot;font-size&quot;:11,class:&quot;mut&quot;,transform:&quot;rotate(-90 14 135)&quot;,&quot;text-anchor&quot;:&quot;middle&quot;},ch);t2.textContent=&quot;index (0–100)&quot;;
    el(&quot;path&quot;,{d:&quot;M&quot;+X(100)+&quot; 15V255&quot;,stroke:&quot;var(--brick)&quot;,&quot;stroke-width&quot;:2,&quot;stroke-dasharray&quot;:&quot;6 4&quot;},ch);
    var t3=el(&quot;text&quot;,{x:X(100)+6,y:30,&quot;font-size&quot;:11,fill:&quot;var(--brick)&quot;,&quot;font-weight&quot;:600},ch);t3.textContent=&quot;carrying capacity&quot;;
    var C=[[econ,&quot;var(--ochre)&quot;,&quot;economic benefits&quot;],[tour,&quot;var(--slate)&quot;,&quot;visitor experience&quot;],[res,&quot;var(--brick)&quot;,&quot;residents&#x27; quality of life&quot;]];
    var mk=[];
    C.forEach(function(c,k){
      var d=&quot;&quot;;for(var v=0;v&lt;=200;v+=2)d+=(v?&quot;L&quot;:&quot;M&quot;)+X(v).toFixed(1)+&quot; &quot;+Y(c[0](v)).toFixed(1);
      el(&quot;path&quot;,{d:d,stroke:c[1],&quot;stroke-width&quot;:2.5,fill:&quot;none&quot;},ch);
      el(&quot;rect&quot;,{x:60+k*160,y:-2,width:12,height:4,fill:c[1],transform:&quot;translate(0 0)&quot;},ch);
      var lt=el(&quot;text&quot;,{x:76+k*160,y:3,&quot;font-size&quot;:11},ch);lt.textContent=c[2];
      mk.push(el(&quot;circle&quot;,{r:5,fill:c[1],stroke:&quot;var(--card)&quot;,&quot;stroke-width&quot;:2},ch));
    });
    ch.setAttribute(&quot;viewBox&quot;,&quot;0 -12 560 312&quot;);
    var cur=el(&quot;path&quot;,{stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1,&quot;stroke-dasharray&quot;:&quot;2 3&quot;},ch);
    var out2=$(&quot;#vis-out&quot;);
    var DX=[[&quot;Euphoria&quot;,&quot;residents willingly welcome the few visitors&quot;],[&quot;Apathy&quot;,&quot;tourism becomes normal, relations become commercial&quot;],[&quot;Annoyance&quot;,&quot;irritation: congestion and saturated services&quot;],[&quot;Antagonism&quot;,&quot;open hostility towards tourists&quot;]];
    function drawCh(){
      var v=+vis.value;cur.setAttribute(&quot;d&quot;,&quot;M&quot;+X(v)+&quot; 15V255&quot;);
      C.forEach(function(c,k){mk[k].setAttribute(&quot;cx&quot;,X(v));mk[k].setAttribute(&quot;cy&quot;,Y(c[0](v)))});
      var s=v&lt;45?0:v&lt;85?1:v&lt;125?2:3;
      out2.innerHTML=&quot;&lt;span&gt;Benefits: &lt;b&gt;&quot;+Math.round(econ(v))+&quot;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Experience: &lt;b&gt;&quot;+Math.round(tour(v))+&quot;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Residents: &lt;b&gt;&quot;+Math.round(res(v))+&quot;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Residents&#x27; mood (Doxey): &lt;b&gt;&quot;+DX[s][0]+&quot;&lt;/b&gt;, &quot;+DX[s][1]+&quot;&lt;/span&gt;&quot;+(v&gt;100?&quot;&lt;span style=&#x27;color:var(--brick);font-weight:600&#x27;&gt;Threshold exceeded: overtourism&lt;/span&gt;&quot;:&quot;&quot;);
    }
    vis.addEventListener(&quot;input&quot;,drawCh);drawCh();
  }

  /* Butler */
  var bu=$(&quot;#butler&quot;);
  if(bu){
    var BY=function(x){return 255-190/(1+Math.exp(-(x-230)/38))};
    var ST=[
      [&quot;Exploration&quot;,60,120,&quot;Few visitors, often adventurous; no dedicated facilities. The place is still fully the residents&#x27; &lt;i&gt;place&lt;/i&gt;.&quot;],
      [&quot;Involvement&quot;,120,190,&quot;Residents begin to offer services to visitors: a tourist season and a first form of organisation emerge.&quot;],
      [&quot;Development&quot;,190,290,&quot;Rapid growth: external investors and marketing arrive, and the image of the place (its &lt;i&gt;landscape&lt;/i&gt;) is constructed for the market. Residents lose control.&quot;],
      [&quot;Consolidation&quot;,290,360,&quot;Growth slows but tourism is now the main sector. The first frictions with residents appear.&quot;],
      [&quot;Stagnation&quot;,360,420,&quot;Peak visitor numbers: the critical range of carrying capacity is reached or exceeded. Environmental, social and economic problems: this is the moment of &lt;b&gt;overtourism&lt;/b&gt;.&quot;],
      [&quot;Post-stagnation&quot;,420,540,&quot;Three possible outcomes: &lt;b&gt;rejuvenation&lt;/b&gt; (renewal through new attractions and new management), stabilisation, or &lt;b&gt;decline&lt;/b&gt; (the place loses its appeal).&quot;]
    ];
    var band=el(&quot;rect&quot;,{y:15,height:240,fill:&quot;var(--brick-bg)&quot;},bu);
    el(&quot;rect&quot;,{x:290,y:52,width:250,height:34,fill:&quot;none&quot;,stroke:&quot;var(--brick)&quot;,&quot;stroke-dasharray&quot;:&quot;5 4&quot;},bu);
    var cc=el(&quot;text&quot;,{x:296,y:47,&quot;font-size&quot;:10,fill:&quot;var(--brick)&quot;},bu);cc.textContent=&quot;critical range of carrying capacity&quot;;
    el(&quot;path&quot;,{d:&quot;M50 15V255H545&quot;,class:&quot;ln&quot;},bu);
    var d=&quot;&quot;;for(var x=60;x&lt;=420;x+=4)d+=(x&gt;60?&quot;L&quot;:&quot;M&quot;)+x+&quot; &quot;+BY(x).toFixed(1);
    el(&quot;path&quot;,{d:d,stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:2.5,fill:&quot;none&quot;},bu);
    var y0=BY(420);
    [[&quot;M420 &quot;+y0+&quot; C470 &quot;+(y0-10)+&quot; 500 35 540 28&quot;,&quot;rejuvenation&quot;],[&quot;M420 &quot;+y0+&quot; C470 &quot;+y0+&quot; 500 &quot;+(y0+4)+&quot; 540 &quot;+(y0+4),&quot;stabilisation&quot;],[&quot;M420 &quot;+y0+&quot; C470 &quot;+(y0+10)+&quot; 500 170 540 195&quot;,&quot;decline&quot;]].forEach(function(b,k){
      el(&quot;path&quot;,{d:b[0],stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.8,fill:&quot;none&quot;,&quot;stroke-dasharray&quot;:k?&quot;6 4&quot;:&quot;0&quot;},bu);
      var t=el(&quot;text&quot;,{x:470,y:[22,y0+22,200][k],&quot;font-size&quot;:10,class:&quot;mut&quot;},bu);t.textContent=b[1];
    });
    ST.forEach(function(s,i){var t=el(&quot;text&quot;,{x:(s[1]+s[2])/2,y:272,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,&quot;font-weight&quot;:600},bu);t.textContent=i+1});
    var tx=el(&quot;text&quot;,{x:295,y:292,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},bu);tx.textContent=&quot;time →&quot;;
    var ty=el(&quot;text&quot;,{x:14,y:135,&quot;font-size&quot;:11,class:&quot;mut&quot;,transform:&quot;rotate(-90 14 135)&quot;,&quot;text-anchor&quot;:&quot;middle&quot;},bu);ty.textContent=&quot;visitors&quot;;
    var dot=el(&quot;circle&quot;,{r:6,fill:&quot;var(--brick)&quot;,stroke:&quot;var(--card)&quot;,&quot;stroke-width&quot;:2},bu);
    var k=0,prev=$(&quot;#bu-prev&quot;),next=$(&quot;#bu-next&quot;),pn=$(&quot;#bu-panel&quot;),cnt=$(&quot;#bu-count&quot;);
    function drawBu(){var s=ST[k],mx=Math.min((s[1]+s[2])/2,420);band.setAttribute(&quot;x&quot;,s[1]);band.setAttribute(&quot;width&quot;,s[2]-s[1]);dot.setAttribute(&quot;cx&quot;,mx);dot.setAttribute(&quot;cy&quot;,BY(mx));pn.innerHTML=&quot;&lt;b&gt;&quot;+(k+1)+&quot; · &quot;+s[0]+&quot;&lt;/b&gt;&lt;br&gt;&quot;+s[3];cnt.textContent=&quot;stage &quot;+(k+1)+&quot; of &quot;+ST.length;prev.disabled=k===0;next.disabled=k===ST.length-1}
    prev.addEventListener(&quot;click&quot;,function(){if(k&gt;0){k--;drawBu()}});
    next.addEventListener(&quot;click&quot;,function(){if(k&lt;ST.length-1){k++;drawBu()}});
    drawBu();
  }
})();
&lt;/script&gt;
