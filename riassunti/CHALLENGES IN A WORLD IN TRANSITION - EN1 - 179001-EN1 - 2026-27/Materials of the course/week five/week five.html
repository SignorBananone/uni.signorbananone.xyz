        &lt;text x=&quot;731&quot; y=&quot;468&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11&quot;&gt;tourists · residents · gov · users&lt;/text&gt;&lt;/a&gt;

&lt;/section&gt;

&lt;section id=&quot;territorio&quot; class=&quot;part p-sage&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 1 · slide 1–2&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;Territory e le sue configurazioni&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · week five.pdf, slide 1–2&lt;/span&gt;
  &lt;p&gt;Il titolo della lezione unisce due idee. &lt;b&gt;Urbanity&lt;/b&gt; (urbanità) indica il carattere «urbano» di uno spazio: quanto concentra persone, attività e differenze. &lt;b&gt;Territorial processes&lt;/b&gt; sono le trasformazioni con cui le società organizzano e riorganizzano lo spazio in cui vivono. La lezione guarda dunque a come i processi globali cambiano il modo in cui gli spazi urbani vengono vissuti e usati.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;plus&quot;&gt;oltre le slide&lt;/span&gt;Nella scuola geografica francese che la lezione cita più avanti, Jacques Lévy definisce l&#x27;&lt;i&gt;urbanité&lt;/i&gt; come la combinazione di &lt;b&gt;densità&lt;/b&gt; e &lt;b&gt;diversità&lt;/b&gt;: più persone e più differenze in poco spazio significano più urbanità. È utile per capire perché nelle sezioni seguenti contano tanto la vicinanza e la copresenza.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Territory&lt;/b&gt; · territorio&lt;br&gt;Lo spazio geografico in quanto &lt;i&gt;organizzato e appropriato&lt;/i&gt; da una società: non solo superficie fisica, ma spazio su cui qualcuno agisce, decide, costruisce significati. La slide 2 lo scompone in tre &lt;b&gt;configurations&lt;/b&gt;, cioè tre modi in cui lo stesso territorio si presenta e può essere analizzato.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;

    &lt;title id=&quot;prt&quot;&gt;Un unico territorio letto attraverso tre lenti: environment, place, landscape&lt;/title&gt;

    &lt;circle cx=&quot;120&quot; cy=&quot;150&quot; r=&quot;78&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;path d=&quot;M70 165 q25-40 50-10 t50-5&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;/&gt;
    &lt;path d=&quot;M78 125 l10-15 l10 15 z M100 125 l12-20 l12 20 z&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.5&quot;/&gt;
    &lt;rect x=&quot;128&quot; y=&quot;168&quot; width=&quot;10&quot; height=&quot;14&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.6&quot;/&gt;&lt;rect x=&quot;142&quot; y=&quot;162&quot; width=&quot;10&quot; height=&quot;20&quot; fill=&quot;var(--sage)&quot; opacity=&quot;.6&quot;/&gt;
    &lt;text x=&quot;120&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot;&gt;territory&lt;/text&gt;
    &lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.8&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar2)&quot;&gt;
     &lt;path d=&quot;M200 120 C260 70 300 60 350 60&quot;/&gt;&lt;path d=&quot;M202 150 L350 150&quot;/&gt;&lt;path d=&quot;M200 180 C260 230 300 240 350 240&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot;&gt;
     &lt;rect x=&quot;355&quot; y=&quot;28&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;

     &lt;text x=&quot;370&quot; y=&quot;74&quot; class=&quot;mut&quot;&gt;Che cosa c&#x27;è? Ecosistemi, risorse, rischi&lt;/text&gt;
     &lt;rect x=&quot;355&quot; y=&quot;118&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
     &lt;text x=&quot;370&quot; y=&quot;142&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;place&lt;/text&gt;
     &lt;text x=&quot;370&quot; y=&quot;164&quot; class=&quot;mut&quot;&gt;Che cosa significa, e per chi?&lt;/text&gt;
     &lt;rect x=&quot;355&quot; y=&quot;208&quot; width=&quot;270&quot; height=&quot;64&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
     &lt;text x=&quot;370&quot; y=&quot;232&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;landscape&lt;/text&gt;
     &lt;text x=&quot;370&quot; y=&quot;254&quot; class=&quot;mut&quot;&gt;Come appare? Percezione, immagine&lt;/text&gt;
    &lt;/g&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Le tre configurazioni non sono tre territori diversi: sono tre letture dello stesso spazio. La lezione approfondisce il &lt;b&gt;place&lt;/b&gt; (in ocra).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Le tre configurazioni a confronto&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;Le slide elencano solo i tre termini; le spiegazioni qui sotto li sviluppano. Prendiamo un unico esempio, la laguna e il centro storico di Venezia, che torneranno nella parte 4.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Configurazioni del territorio&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-env&quot; aria-controls=&quot;p-env&quot; aria-selected=&quot;true&quot;&gt;environment&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-pla&quot; aria-controls=&quot;p-pla&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;place&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-lan&quot; aria-controls=&quot;p-lan&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;landscape&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-env&quot; aria-labelledby=&quot;t-env&quot;&gt;
    &lt;p&gt;&lt;b&gt;Environment&lt;/b&gt; (ambiente) è il territorio letto come &lt;b&gt;sistema di relazioni fisiche ed ecologiche&lt;/b&gt; tra società e natura: acqua, suolo, clima, biodiversità, risorse, ma anche inquinamento e rischi. Qui conta ciò che si può misurare.&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venezia vista come environment:&lt;/i&gt; l&#x27;equilibrio della laguna, l&#x27;acqua alta, l&#x27;erosione, i rifiuti e i consumi d&#x27;acqua prodotti dai flussi di visitatori.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Domanda guida: quali processi naturali e umani interagiscono qui, e con quali limiti?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-pla&quot; aria-labelledby=&quot;t-pla&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Place&lt;/b&gt; (luogo) è il territorio letto come &lt;b&gt;spazio vissuto e dotato di significato sociale&lt;/b&gt;: appartiene a qualcuno, porta un&#x27;identità, è dove le persone si incontrano. È il cuore della lezione (parti 2 e 3).&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venezia vista come place:&lt;/i&gt; il campo dove i residenti si incontrano, la festa del quartiere, la sensazione che «questa è la nostra città». Oppure, per milioni di persone, un luogo-simbolo del mondo intero.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Domanda guida: chi si riconosce in questo spazio, e chi lo usa?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-lan&quot; aria-labelledby=&quot;t-lan&quot; hidden&gt;
    &lt;p&gt;&lt;b&gt;Landscape&lt;/b&gt; (paesaggio) è il territorio letto come &lt;b&gt;forma percepita e rappresentata&lt;/b&gt;: ciò che si vede, si dipinge, si fotografa, e il valore che gli si attribuisce.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;La &lt;a href=&quot;https://rm.coe.int/16800805ce&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Convenzione europea del paesaggio&lt;/a&gt; (Consiglio d&#x27;Europa, Firenze 2000, art. 1a) definisce il landscape come «un&#x27;area, così come è percepita dalle persone, il cui carattere deriva dall&#x27;azione e dall&#x27;interazione di fattori naturali e/o umani».&lt;/p&gt;
    &lt;p&gt;&lt;i&gt;Venezia vista come landscape:&lt;/i&gt; la veduta del Bacino di San Marco, l&#x27;immagine da cartolina che attira i visitatori e che i visitatori stessi riproducono.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Domanda guida: come viene percepito questo spazio, e da chi?&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card small&quot;&gt;&lt;b&gt;Collegamento al lavoro di gruppo.&lt;/b&gt; Lo schema del lavoro di gruppo (&lt;i&gt;week four.pdf&lt;/i&gt;, pagina 12, «Main points of group work») chiede una &lt;b&gt;territorial analysis&lt;/b&gt; della porzione di territorio scelta (il &lt;i&gt;patch&lt;/i&gt;), un&#x27;analisi socio-economica e degli attori, e una parte su «global challenges and the &lt;b&gt;perception of the landscape&lt;/b&gt;». Le tre configurazioni sono una griglia pronta per quel lavoro: environment → analisi territoriale; place → attori e significati; landscape → percezione.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · parte 1&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono le tre configurations of territory della slide 2?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Environment, place e landscape: tre letture dello stesso territorio.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cosa distingue landscape da environment?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;L&#x27;environment riguarda le relazioni fisiche ed ecologiche, misurabili; il landscape riguarda la percezione e la rappresentazione («an area, as perceived by people»). Lo stesso bosco è environment come ecosistema e landscape come veduta.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché la lezione si concentra proprio sul place?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché è la configurazione in cui conta il significato sociale, cioè l&#x27;appartenenza e l&#x27;identità. Proprio questo cambia con la mondialization, quando alcuni luoghi diventano significativi per il mondo intero (hyperplaces).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;luogo&quot; class=&quot;part p-ochre&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 2 · slide 3–5&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;Place in the mondialization process&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · week five.pdf, slide 3–5&lt;/span&gt;
  &lt;p&gt;La slide 3 apre il tema centrale: che cosa diventa il &lt;b&gt;place&lt;/b&gt; quando il mondo si globalizza? Per rispondere servono prima due strumenti teorici: la distinzione greca tra &lt;b&gt;topos&lt;/b&gt; e &lt;b&gt;chora&lt;/b&gt;, e la definizione di luogo come &lt;b&gt;coprésence&lt;/b&gt;.&lt;/p&gt;

  &lt;h3 id=&quot;topos-chora&quot;&gt;Da topos a chora · Augustin Berque e Yi-Fu Tuan&lt;/h3&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · slide 4&lt;/span&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Topos&lt;/b&gt;&lt;br&gt;&lt;i&gt;Place of the localisation&lt;/i&gt;, cioè il luogo come &lt;b&gt;posizione&lt;/b&gt;: un punto &lt;i&gt;georeferenced in a map&lt;/i&gt; (georeferenziato: con coordinate precise su una carta). Risponde alla domanda «dove?».&lt;/div&gt;
   &lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;Chora&lt;/b&gt;&lt;br&gt;&lt;i&gt;Belonging of the place to someone&lt;/i&gt;, cioè il luogo come &lt;b&gt;appartenenza&lt;/b&gt; a qualcuno: un &lt;i&gt;place of social meaning&lt;/i&gt;, carico di significato sociale. Risponde alla domanda «che cosa significa, e per chi?».&lt;/div&gt;
  &lt;/div&gt;
  &lt;p style=&quot;margin-top:1rem&quot;&gt;La freccia «from topos to chora» indica un passaggio di sguardo: dalla geografia che &lt;i&gt;localizza&lt;/i&gt; alla geografia che &lt;i&gt;interpreta&lt;/i&gt;. Due persone possono stare nello stesso topos e vivere chorai diverse: la piazza del turista non è la piazza del residente.&lt;/p&gt;

  &lt;/figure&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Chi sono Berque e Tuan, e da dove vengono topos e chora?&lt;/summary&gt;&lt;div&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;b&gt;Augustin Berque&lt;/b&gt; è un geografo francese, studioso del Giappone. In &lt;i&gt;Écoumène. Introduction à l&#x27;étude des milieux humains&lt;/i&gt; (Belin, 2000) riprende la coppia &lt;i&gt;topos&lt;/i&gt;/&lt;i&gt;chôra&lt;/i&gt; dal &lt;i&gt;Timeo&lt;/i&gt; di Platone: il topos è lo strato materiale, la posizione fisica; la chôra è lo strato esistenziale, definito dalle relazioni con altre cose e persone. Il momento in cui i due si incontrano lo chiama &lt;b&gt;médiance&lt;/b&gt; (fonti: &lt;a href=&quot;https://journals.openedition.org/vertigo/9384&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VertigO&lt;/a&gt;; &lt;a href=&quot;https://espacestemps.net/articles/lieu-def1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;voce «Lieu» su EspacesTemps&lt;/a&gt;).&lt;/p&gt;
   &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;b&gt;Yi-Fu Tuan&lt;/b&gt; è un geografo sino-americano, padre della geografia umanistica. Nel libro &lt;i&gt;Space and Place: The Perspective of Experience&lt;/i&gt; (University of Minnesota Press, 1977) distingue lo &lt;b&gt;space&lt;/b&gt;, aperto, astratto, libertà e movimento, dal &lt;b&gt;place&lt;/b&gt;, spazio a cui l&#x27;esperienza ha dato valore, sicurezza e pausa: «place is security, space is freedom» (&lt;a href=&quot;https://www.wikipedia.org/wiki/Yi-Fu_Tuan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;voce su Yi-Fu Tuan&lt;/a&gt;).&lt;/p&gt;
   &lt;p class=&quot;small muted&quot;&gt;Il parallelo: topos ≈ space (posizione neutra); chora ≈ place (spazio vissuto). In entrambi gli autori il luogo nasce dalla relazione tra persone e spazio.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;levy&quot;&gt;Place secondo Jacques Lévy · la coprésence&lt;/h3&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · slide 5 (prima metà)&lt;/span&gt;
  &lt;blockquote&gt;«Le noyau central du concept de lieu au sein de la connaissance de l&#x27;espace des sociétés porterait plutôt sur la &lt;b&gt;coprésence&lt;/b&gt;, c&#x27;est-à-dire aussi sur la &lt;b&gt;cospatialité&lt;/b&gt; poussée jusqu&#x27;au bout.»
   &lt;cite&gt;J. Lévy &amp;amp; M. Lussault (dir.), &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt;, Paris, Belin, 2003. Traduzione: «Il nucleo centrale del concetto di luogo, nella conoscenza dello spazio delle società, riguarderebbe piuttosto la copresenza, cioè anche la cospazialità spinta fino in fondo.»&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;b&gt;Coprésence&lt;/b&gt; (copresenza) significa essere presenti insieme, nello stesso spazio e nello stesso momento. &lt;b&gt;Cospatialité&lt;/b&gt; (cospazialità) significa condividere uno spazio. Per Lévy un luogo è dove questa condivisione è massima. Ne seguono le due proprietà della slide:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;1 · Distance is not relevant&lt;/b&gt;&lt;br&gt;Dentro un luogo la distanza non pesa: tutto e tutti sono «a portata». Non serve spostarsi né comunicare a distanza per interagire.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;2 · Transfert of the identity of a society&lt;/b&gt;&lt;br&gt;Il luogo trasferisce e rende visibile l&#x27;identità di una società: chi lo frequenta vi riconosce e vi riproduce un «noi».&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;plus&quot;&gt;oltre le slide&lt;/span&gt;Lévy distingue tre modi in cui le società gestiscono la distanza: &lt;b&gt;coprésence&lt;/b&gt; (annullarla stando insieme), &lt;b&gt;mobilité&lt;/b&gt; (superarla spostandosi), &lt;b&gt;télécommunication&lt;/b&gt; (superarla comunicando). Il luogo è il dominio della prima, e per questo vale a qualunque scala: una stanza, una piazza, una città densa.&lt;/p&gt;

  &lt;figure class=&quot;fig&quot;&gt;
   &lt;label for=&quot;cop&quot; class=&quot;small&quot;&gt;&lt;b&gt;Prova:&lt;/b&gt; avvicina le persone e guarda nascere la copresenza&lt;/label&gt;
   &lt;input type=&quot;range&quot; id=&quot;cop&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; aria-describedby=&quot;cop-out&quot;&gt;
   &lt;svg id=&quot;copsvg&quot; viewBox=&quot;0 0 520 250&quot; role=&quot;img&quot; aria-label=&quot;Dodici persone che passano da sparse a raccolte in un luogo; le linee indicano chi può interagire senza spostarsi&quot;&gt;
    &lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;520&quot; height=&quot;250&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot;/&gt;
    &lt;circle id=&quot;cop-ring&quot; cx=&quot;260&quot; cy=&quot;125&quot; r=&quot;70&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-dasharray=&quot;5 4&quot; opacity=&quot;0&quot;/&gt;
    &lt;text id=&quot;cop-lab&quot; x=&quot;260&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ochre)&quot; font-weight=&quot;600&quot; opacity=&quot;0&quot;&gt;place&lt;/text&gt;
    &lt;g id=&quot;cop-links&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;1.2&quot; opacity=&quot;.75&quot;&gt;&lt;/g&gt;
    &lt;g id=&quot;cop-dots&quot;&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;div class=&quot;readout&quot; id=&quot;cop-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;Modello illustrativo: due persone sono in copresenza se possono interagire senza spostarsi (distanza &amp;lt; soglia). Più cresce la cospazialità, meno la distanza conta.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;card small&quot;&gt;&lt;b&gt;Collegamento con week four.&lt;/b&gt; L&#x27;&lt;i&gt;Indigenous Systems Framework&lt;/i&gt; mostrato in &lt;i&gt;week four.pdf&lt;/i&gt; (pagina 8) mette al centro relazionalità, reciprocità e &lt;i&gt;spiritual relationship to land&lt;/i&gt;: è un esempio forte di chora, un territorio che appartiene a una comunità prima ancora di essere una posizione sulla carta. La stessa pagina oppone &lt;b&gt;legitimacy&lt;/b&gt; (legittimità riconosciuta da una comunità) a &lt;b&gt;legality&lt;/b&gt; (conformità alla legge formale): spesso la chora fonda la prima, il catasto la seconda.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · parte 2&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Spiega la differenza tra topos e chora con un esempio.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Il topos è la localizzazione (il punto georeferenziato su una carta); la chora è l&#x27;appartenenza del luogo a qualcuno, il suo significato sociale. Lo stesso campo di calcio è un topos con coordinate; per una squadra di quartiere è chora: «il nostro campo».&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Secondo Lévy, qual è il «nucleo» del concetto di luogo?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;La coprésence, cioè la cospazialità spinta fino in fondo: stare insieme nello stesso spazio.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cosa vuol dire che in un place «distance is not relevant»?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Che all&#x27;interno del luogo la distanza non è un ostacolo all&#x27;interazione: tutti sono raggiungibili senza mobilità né telecomunicazione.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In che cosa il place di Lévy e quello di Tuan si somigliano?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Per entrambi il luogo non è un punto neutro: nasce dalla relazione sociale e vissuta con lo spazio. Tuan lo descrive come esperienza e attaccamento; Lévy come copresenza e trasferimento dell&#x27;identità di una società.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;iperluogo&quot; class=&quot;part p-slate&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 3 · slide 5–7&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;Hyperplace · Michel Lussault&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · week five.pdf, slide 5 (seconda metà), 6, 7&lt;/span&gt;
  &lt;p&gt;Con la mondialization alcuni luoghi smettono di appartenere soltanto a una società locale e diventano luoghi del mondo intero. Michel Lussault li chiama &lt;b&gt;hyperplaces&lt;/b&gt; (&lt;i&gt;hyper-lieux&lt;/i&gt;, iperluoghi).&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Hyperplace&lt;/b&gt; · iperluogo&lt;br&gt;Estensione spaziale in cui:&lt;br&gt;1) c&#x27;è una &lt;b&gt;funzione politica o turistica&lt;/b&gt; (la slide lascia l&#x27;elenco aperto con «…»);&lt;br&gt;2) avviene il &lt;b&gt;transfert of the identity of the world society&lt;/b&gt;: vi si trasferisce e si mette in scena l&#x27;identità della &lt;i&gt;società-mondo&lt;/i&gt;, non più soltanto quella di una società locale.&lt;/div&gt;

  &lt;h3&gt;Place e hyperplace a confronto&lt;/h3&gt;
  &lt;p&gt;Le due definizioni della slide 5 sono costruite in parallelo: cambia soprattutto &lt;b&gt;di chi&lt;/b&gt; è l&#x27;identità che il luogo trasferisce.&lt;/p&gt;

    &lt;/g&gt;
    &lt;text x=&quot;160&quot; y=&quot;254&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;identità di &lt;tspan font-weight=&quot;700&quot; fill=&quot;var(--ochre)&quot;&gt;una società&lt;/tspan&gt;&lt;/text&gt;
    &lt;g transform=&quot;translate(470 130)&quot;&gt;
     &lt;circle r=&quot;110&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;
     &lt;circle r=&quot;70&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 4&quot; opacity=&quot;.6&quot;/&gt;

     &lt;text y=&quot;-88&quot; x=&quot;40&quot; font-size=&quot;10&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;mondo&lt;/text&gt;
    &lt;/g&gt;

   &lt;/svg&gt;
   &lt;figcaption&gt;Il place è radicato in una società; l&#x27;hyperplace è collegato a tutte le scale contemporaneamente: locale, nazionale, globale.&lt;/figcaption&gt;

  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Place (Lévy)&lt;/th&gt;&lt;th&gt;Hyperplace (Lussault)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Principio&lt;/b&gt;&lt;/td&gt;&lt;td&gt;copresenza: la distanza non conta&lt;/td&gt;&lt;td&gt;copresenza su scala mondiale: persone, merci, immagini da ovunque&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Identità trasferita&lt;/b&gt;&lt;/td&gt;&lt;td&gt;di &lt;i&gt;una&lt;/i&gt; società&lt;/td&gt;&lt;td&gt;della &lt;i&gt;world society&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Funzione&lt;/b&gt;&lt;/td&gt;&lt;td&gt;vita quotidiana, incontro&lt;/td&gt;&lt;td&gt;politica, turistica, simbolica, commerciale…&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Chi lo frequenta&lt;/b&gt;&lt;/td&gt;&lt;td&gt;soprattutto chi ci vive&lt;/td&gt;&lt;td&gt;residenti, visitatori, marchi globali, media&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Rischio&lt;/b&gt;&lt;/td&gt;&lt;td&gt;chiusura, esclusione&lt;/td&gt;&lt;td&gt;saturazione: &lt;a href=&quot;#overtourism&quot;&gt;overtourism&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Tabella costruita a partire dalla slide 5; le righe «chi lo frequenta» e «rischio» sono una sintesi interpretativa.&lt;/p&gt;

    &lt;p&gt;&lt;b&gt;Che cosa mostra la foto.&lt;/b&gt; Una piazza di New York saturata da schermi e cartelloni di marchi globali (nella foto: McDonald&#x27;s, Bank of America, musical di Broadway) e una folla di visitatori da tutto il mondo.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché è un hyperplace.&lt;/b&gt; La funzione è turistica e commerciale; l&#x27;identità messa in scena non è quella di un quartiere ma quella della società-mondo dei consumi e dei media. È conosciuta da chi non ci è mai stato e ci si va per esserci stati.&lt;/p&gt;

      &lt;g fill=&quot;none&quot; stroke=&quot;var(--brick)&quot;&gt;&lt;path d=&quot;M350 140v-22a7 7 0 0 1 14 0v22M374 140v-22a7 7 0 0 1 14 0v22M398 140v-22a7 7 0 0 1 14 0v22M422 140v-22a7 7 0 0 1 14 0v22M446 140v-22a7 7 0 0 1 14 0v22M470 140v-22a7 7 0 0 1 14 0v22&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;232&quot; y=&quot;50&quot; width=&quot;7&quot; height=&quot;90&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;rect x=&quot;282&quot; y=&quot;45&quot; width=&quot;7&quot; height=&quot;95&quot; fill=&quot;var(--brick)&quot;/&gt;
      &lt;g fill=&quot;var(--slate)&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;150&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;222&quot; cy=&quot;146&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;236&quot; cy=&quot;152&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;250&quot; cy=&quot;148&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;262&quot; cy=&quot;151&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;276&quot; cy=&quot;147&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;290&quot; cy=&quot;152&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;304&quot; cy=&quot;148&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;318&quot; cy=&quot;151&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;152&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;330&quot; cy=&quot;147&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;156&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;156&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;440&quot; cy=&quot;153&quot; r=&quot;3&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;260&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; class=&quot;mut&quot;&gt;palazzi storici, colonne, folla&lt;/text&gt;
     &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;p&gt;&lt;b&gt;Che cosa mostra la foto.&lt;/b&gt; La Piazzetta di San Marco a Venezia, tra Palazzo Ducale e la Biblioteca Marciana, con le due colonne verso il bacino, gremita di gruppi di turisti.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Perché è un hyperplace.&lt;/b&gt; Era il cuore politico della Repubblica di Venezia, cioè il place di una società. Oggi la sua funzione dominante è turistica e la sua identità è quella di un patrimonio dell&#x27;umanità: appartiene simbolicamente al mondo. È anche l&#x27;immagine che introduce la slide 8 sull&#x27;overtourism.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il libro di Lussault sugli hyper-lieux&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
   &lt;p&gt;Michel Lussault, geografo e professore all&#x27;École normale supérieure di Lione, ha sviluppato il concetto nel libro &lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt; (Seuil, 2017). La sua tesi è che la mondializzazione non rende il mondo uniforme ma lo &lt;b&gt;differenzia&lt;/b&gt;: emergono luoghi che fanno da «appigli» e punti di ancoraggio della mondializzazione, dove convergono persone e realtà materiali e immateriali (&lt;a href=&quot;https://journals.openedition.org/lectures/22515&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su OpenEdition Lectures&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Place o hyperplace? Mettiti alla prova&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;Apri ogni riquadro dopo aver deciso. Non ci sono confini netti: conta il ragionamento sui due criteri della slide.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Il mercato rionale del tuo quartiere&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Place.&lt;/b&gt; Copresenza e identità di una comunità locale; nessuna funzione mondiale.&lt;/div&gt;&lt;/details&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Un grande aeroporto internazionale&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Tende all&#x27;hyperplace.&lt;/b&gt; Vi si incrociano flussi da tutto il mondo e la funzione è globale, anche se l&#x27;identità messa in scena è più debole che in una piazza simbolo.&lt;/div&gt;&lt;/details&gt;
   &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Una città durante le Olimpiadi&lt;/summary&gt;&lt;div class=&quot;small&quot;&gt;&lt;b&gt;Hyperplace temporaneo.&lt;/b&gt; Per alcune settimane la città mette in scena la società-mondo. L&#x27;impatto dei Giochi era uno dei temi dei gruppi dell&#x27;anno scorso (&lt;i&gt;week four.pdf&lt;/i&gt;, pagina 13).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · parte 3&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Quali sono i due criteri dell&#x27;hyperplace secondo la slide 5?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) Una funzione politica o turistica (l&#x27;elenco è aperto); 2) il trasferimento dell&#x27;identità della world society.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Qual è la differenza chiave tra place (Lévy) e hyperplace (Lussault)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Il place trasferisce l&#x27;identità di una società, l&#x27;hyperplace quella della società-mondo. Si passa dalla scala locale a quella globale.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché Piazza San Marco è un buon esempio di passaggio da place a hyperplace?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché era il centro politico e identitario di una società specifica, la Repubblica di Venezia, e oggi è soprattutto un luogo turistico che rappresenta un patrimonio di tutto il mondo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;overtourism&quot; class=&quot;part p-brick&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 4 · slide 8&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;Hyperplaces and overtourism&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · week five.pdf, slide 8&lt;/span&gt;
  &lt;p&gt;Se un hyperplace attira il mondo intero, che cosa succede quando il mondo arriva davvero, tutto insieme? La slide 8 risponde con un concetto quasi medico.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Overtourism&lt;/b&gt; · sovraturismo&lt;br&gt;Una &lt;b&gt;territorial pathology&lt;/b&gt; (patologia territoriale) legata alla &lt;b&gt;massive presence of tourists and tourism services&lt;/b&gt; in un luogo, che crea &lt;b&gt;problems to the territory carrying capacity&lt;/b&gt;.&lt;/div&gt;
  &lt;p&gt;Leggiamo la definizione pezzo per pezzo:&lt;/p&gt;
  &lt;ul&gt;
   &lt;li&gt;&lt;b&gt;Pathology&lt;/b&gt;: il territorio è trattato come un organismo che si ammala. Il turismo non è un male in sé; lo diventa oltre una certa soglia.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Tourists and tourism services&lt;/b&gt;: non contano solo le persone ma anche ciò che il turismo fa nascere, come affitti brevi, negozi di souvenir, ristorazione, trasporti dedicati. Questi servizi sostituiscono quelli dei residenti.&lt;/li&gt;
   &lt;li&gt;&lt;b&gt;Carrying capacity&lt;/b&gt;: la soglia oltre la quale il luogo smette di funzionare (vedi sotto).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il rapporto UNWTO &lt;i&gt;&#x27;Overtourism&#x27;? Understanding and Managing Urban Tourism Growth beyond Perceptions&lt;/i&gt; (2018) definisce l&#x27;overtourism come «l&#x27;impatto del turismo su una destinazione, o su parti di essa, che influenza in modo eccessivamente negativo la qualità della vita percepita dai cittadini e/o la qualità dell&#x27;esperienza dei visitatori» (&lt;a href=&quot;https://unwto.org/global/publication/overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina UNWTO&lt;/a&gt;; definizione riportata da &lt;a href=&quot;https://www.etoa.org/research/unwto-and-celth-report-overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ETOA&lt;/a&gt;). Rispetto alla slide, questa definizione insiste sulla &lt;i&gt;percezione&lt;/i&gt;: residenti e visitatori.&lt;/p&gt;

  &lt;h3 id=&quot;capacity&quot;&gt;Carrying capacity · la soglia&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;plus&quot;&gt;oltre le slide&lt;/span&gt;La &lt;b&gt;carrying capacity&lt;/b&gt; (capacità di carico) di un luogo turistico è il numero massimo di visitatori che può accogliere senza degradare l&#x27;ambiente, la vita dei residenti e la qualità della visita. Non è un numero unico: ci sono più soglie, e la prima che si supera fa scattare il problema.&lt;/p&gt;
  &lt;div class=&quot;grid3 small&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Fisica&lt;/b&gt;&lt;br&gt;Quante persone ci stanno, materialmente: ponti, calli, mezzi pubblici.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Ecologica&lt;/b&gt;&lt;br&gt;Che cosa regge l&#x27;ambiente: acqua, rifiuti, fauna, suolo.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Sociale e percettiva&lt;/b&gt;&lt;br&gt;Quanto tollerano i residenti e quanto affollamento accettano i visitatori.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def small&quot;&gt;&lt;b&gt;Due indicatori semplici&lt;/b&gt; &lt;span class=&quot;plus&quot;&gt;oltre le slide&lt;/span&gt;&lt;br&gt;
   &lt;b&gt;Tourism intensity&lt;/b&gt; = presenze turistiche (notti trascorse) ÷ residenti, in un periodo dato.&lt;br&gt;
   &lt;b&gt;Tourism density&lt;/b&gt; = visitatori ÷ superficie (km²).&lt;br&gt;
   Esempio: 5 milioni di notti in un anno per 50.000 residenti danno un&#x27;intensità di 100 notti per abitante. Il numero dice quanto pesa il turismo rispetto a chi ci vive; da solo non dice se la soglia è superata.&lt;/div&gt;

  &lt;figure class=&quot;fig&quot; id=&quot;chartfig&quot;&gt;
   &lt;label for=&quot;vis&quot; class=&quot;small&quot;&gt;&lt;b&gt;Muovi il cursore:&lt;/b&gt; visitatori al giorno, in % della carrying capacity&lt;/label&gt;
   &lt;input type=&quot;range&quot; id=&quot;vis&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;40&quot; aria-describedby=&quot;vis-out&quot;&gt;
   &lt;svg id=&quot;chart&quot; viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico: al crescere dei visitatori i benefici economici crescono sempre meno, mentre qualità della visita e della vita dei residenti calano oltre la soglia&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;readout&quot; id=&quot;vis-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;Modello illustrativo, non tratto dalle slide: le curve mostrano la logica qualitativa, non dati reali. Lo stato d&#x27;animo dei residenti segue l&#x27;&lt;i&gt;Irridex&lt;/i&gt; di Doxey (vedi «Per approfondire»).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;impatti&quot;&gt;Impacts · chi paga il conto&lt;/h3&gt;

  &lt;h3&gt;Come un luogo arriva al limite · il ciclo di vita di Butler&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Un modello classico, che le slide non citano ma che aiuta a capire la carrying capacity nel tempo, è il &lt;b&gt;Tourism Area Life Cycle&lt;/b&gt; di Richard Butler (&lt;i&gt;The Canadian Geographer&lt;/i&gt;, 1980). Una destinazione cresce a forma di S finché raggiunge la zona critica della capacità di carico; poi può declinare o rinnovarsi. Scorri le fasi.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
   &lt;svg id=&quot;butler&quot; viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Curva del ciclo di vita di una destinazione turistica secondo Butler&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bu-prev&quot; aria-label=&quot;Fase precedente&quot;&gt;← Indietro&lt;/button&gt;
    &lt;span class=&quot;small muted&quot; id=&quot;bu-count&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bu-next&quot; aria-label=&quot;Fase successiva&quot;&gt;Avanti →&lt;/button&gt;
   &lt;/div&gt;
   &lt;div class=&quot;panel&quot; id=&quot;bu-panel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
   &lt;figcaption&gt;Asse x: tempo; asse y: numero di visitatori. Il modello è molto citato ma anche criticato perché difficile da applicare e perché le curve reali spesso si discostano (&lt;a href=&quot;https://strathprints.strath.ac.uk/88392/1/Butler-TG-2024-Tourism-destination-development-the-tourism.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Butler, 2024, su Strathprints&lt;/a&gt;).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Risposte possibili&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
   &lt;div role=&quot;tablist&quot; aria-label=&quot;Risposte all&#x27;overtourism&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r1&quot; aria-controls=&quot;p-r1&quot; aria-selected=&quot;true&quot;&gt;Strategie UNWTO&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r2&quot; aria-controls=&quot;p-r2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Il caso Venezia&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;t-r3&quot; aria-controls=&quot;p-r3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Il nodo politico&lt;/button&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r1&quot; aria-labelledby=&quot;t-r1&quot;&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il rapporto UNWTO del 2018 analizza la percezione dei residenti in otto città europee (Amsterdam, Barcellona, Berlino, Copenaghen, Lisbona, Monaco, Salisburgo, Tallinn) e propone &lt;b&gt;11 strategie e 68 misure&lt;/b&gt;. Tra queste: coinvolgere la comunità locale, gestire la congestione, ridurre la stagionalità, porre limiti di capacità, diversificare l&#x27;offerta. Il messaggio di fondo è che non esiste una soluzione unica: il turismo va inserito in una strategia urbana di sviluppo sostenibile (&lt;a href=&quot;https://www.etoa.org/research/unwto-and-celth-report-overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi ETOA&lt;/a&gt;).&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r2&quot; aria-labelledby=&quot;t-r2&quot; hidden&gt;
    &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Dalla primavera 2024 il Comune di Venezia sperimenta un &lt;b&gt;contributo di accesso&lt;/b&gt; per chi visita la città in giornata senza pernottare. Si paga nei giorni e nelle fasce orarie di punta e si prenota online; chi pernotta paga già l&#x27;imposta di soggiorno. È un tentativo di agire sulla carrying capacity regolando i flussi invece di vietarli. Giorni, importi ed esenzioni cambiano di anno in anno: verificali sul &lt;a href=&quot;https://veneziaunica.it/en/content/venice_access_fee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito ufficiale&lt;/a&gt;.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Spunto critico: un ticket d&#x27;ingresso a una città trasforma un place in un&#x27;attrazione a pagamento. Risolve l&#x27;overtourism o conferma che il luogo è ormai un hyperplace?&lt;/p&gt;
   &lt;/div&gt;
   &lt;div role=&quot;tabpanel&quot; id=&quot;p-r3&quot; aria-labelledby=&quot;t-r3&quot; hidden&gt;
    &lt;p&gt;Ogni misura redistribuisce costi e benefici tra gli attori dello schema: chi guadagna dal turismo (operatori, proprietari di affitti brevi, bilancio comunale) non coincide con chi ne sopporta i costi (residenti, city-users). È la stessa logica che &lt;i&gt;week four.pdf&lt;/i&gt; (pagina 9) riassume come &lt;b&gt;«Justice is geopolitical»&lt;/b&gt;: è la distribuzione di costi e benefici a decidere se ci sarà cooperazione. Vale anche &lt;b&gt;«Scale matters»&lt;/b&gt;: gli impatti locali dipendono da mercati e istituzioni globali, come voli low cost, crociere e piattaforme di affitto.&lt;/p&gt;
   &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica · parte 4&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Riformula con parole tue la definizione di overtourism della slide 8.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;È una patologia territoriale: la presenza massiccia di turisti e di servizi turistici in un luogo supera la sua carrying capacity e crea problemi al luogo e a chi lo usa.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quali attori subiscono gli impatti, e che tipo di problema ha ciascuno?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Tourists: problemi nell&#x27;esperienza del luogo. Residents: problemi nei servizi della vita quotidiana. Local government: problemi sociali, ambientali, economici. Other city-users: problemi che ricadono anche su pendolari, studenti, lavoratori.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Perché l&#x27;overtourism colpisce soprattutto gli hyperplaces?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché un hyperplace attira la società-mondo: la sua funzione turistica e la sua identità globale richiamano flussi enormi, concentrati in uno spazio limitato. La copresenza, che definisce il luogo, oltre la soglia diventa congestione.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;La carrying capacity è un numero fisso?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;No. Ha più dimensioni (fisica, ecologica, sociale, percettiva) e dipende anche da come il luogo è gestito: orari, distribuzione dei flussi, stagionalità.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;collegamenti&quot; class=&quot;part&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Collegamenti nel corso&lt;/div&gt;
  &lt;h2&gt;Week five e il resto del corso&lt;/h2&gt;
  &lt;span class=&quot;src&quot;&gt;dalle slide · week four.pdf (pagine indicate) · week five.pdf&lt;/span&gt;
  &lt;p&gt;La week four, dedicata a casi di studio su sostenibilità e potere, si chiude con una sintesi che si applica bene agli hyperplaces. Ecco dove si incrociano le due lezioni.&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;«Scale matters» → hyperplace&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; «Local impacts are tied to global markets and institutions». L&#x27;hyperplace è proprio questo: un luogo locale in cui si concentra la società-mondo. Gli impatti dell&#x27;overtourism si vedono in una piazza ma dipendono da flussi globali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;«Justice is geopolitical» → chi paga l&#x27;overtourism&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; «Distribution of costs and benefits shapes cooperation». Lo schema degli impatti della slide 8 è una mappa di costi distribuiti in modo diseguale tra turisti, residenti, governo locale e city-users.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;«Institutions lag behind change» → governare i flussi&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, p. 9:&lt;/i&gt; «Rules remain fragmented while systems are connected». I flussi turistici sono globali, mentre gli strumenti per gestirli, come ticket, limiti e regole sugli affitti brevi, sono comunali. È la stessa asimmetria vista per i dati digitali, che «cross borders faster than political institutions can regulate them» (p. 5).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Indigenous perspectives → chora e appartenenza&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, pp. 7–8:&lt;/i&gt; Knowledge, Authority, Justice, &lt;b&gt;Resilience: «Adaptation rooted in place»&lt;/b&gt;, e l&#x27;opposizione &lt;b&gt;legitimacy versus legality&lt;/b&gt;. È un&#x27;idea di territorio come chora: relazioni tra persone, terra e vita non umana, non solo coordinate e proprietà.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Lavoro di gruppo → applicare i concetti a un patch&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;i&gt;week four.pdf, pp. 12–15:&lt;/i&gt; la struttura del lavoro di gruppo (territorial analysis, socio-economic analysis, social actors, global challenges e perception of the landscape) e gli esempi di luoghi discussi in aula (Groenlandia, Malesia, Cipro, Australia). Per ciascun luogo puoi chiederti: è place, hyperplace o entrambi? Quali attori ne subiscono gli impatti, come nello schema della slide 8?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Autori, testi e fonti&lt;/h2&gt;
  &lt;p&gt;Per ogni voce: che cosa contiene e perché conta per questa lezione. I dati bibliografici e i link vengono da ricerche web (&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;). Le voci citate nelle slide sono distinte da quelle aggiunte come integrazione.&lt;/p&gt;

  &lt;h3 style=&quot;color:var(--accent)&quot;&gt;Citati nelle slide&lt;/h3&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;h4&gt;Augustin Berque · topos e chôra, &lt;i&gt;Écoumène&lt;/i&gt; (Belin, 2000)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Geografo francese che riprende dal &lt;i&gt;Timeo&lt;/i&gt; di Platone la coppia topos/chôra: posizione fisica contro campo esistenziale e relazionale. Lega le due nozioni con il concetto di &lt;i&gt;médiance&lt;/i&gt;, il momento in cui si incontrano, e definisce l&#x27;ecumene come la relazione ecologica, tecnica e simbolica dell&#x27;umanità con la superficie terrestre. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte teorica della slide 4. Link: &lt;a href=&quot;https://espacestemps.net/articles/lieu-def1/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;voce «Lieu» di Berque (EspacesTemps)&lt;/a&gt; · &lt;a href=&quot;https://journals.openedition.org/vertigo/9384&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo su VertigO&lt;/a&gt; · &lt;a href=&quot;https://rosa.uniroma1.it/rosa03/semestrale_di_geografia/article/view/14948&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;«Geografia e spatial turn: la lettura di Augustin Berque» (Semestrale di Geografia, in italiano)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Yi-Fu Tuan · &lt;i&gt;Space and Place: The Perspective of Experience&lt;/i&gt; (University of Minnesota Press, 1977)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Testo fondativo della geografia umanistica: lo space è libertà e astrazione, il place è sicurezza e spazio reso significativo dall&#x27;esperienza. Capitoli sul corpo, sull&#x27;affollamento, sullo spazio mitico, sull&#x27;attaccamento alla patria. &lt;b&gt;Perché conta:&lt;/b&gt; è il secondo autore della slide 4 e spiega come uno spazio diventa luogo vissuto. Link: &lt;a href=&quot;https://www.wikipedia.org/wiki/Yi-Fu_Tuan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Yi-Fu Tuan (Wikipedia)&lt;/a&gt; · &lt;a href=&quot;https://theologyandsociety.com/review-space-and-place-the-perspective-of-experience-by-yi-fu-tuan/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione del libro&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Jacques Lévy &amp;amp; Michel Lussault (dir.) · &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt; (Belin, 2003; nuova ed. 2013)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Dizionario critico curato da oltre cento autori: non un elenco di luoghi ma una sistemazione dei concetti della geografia (teoria dello spazio, epistemologia, pensatori). &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della citazione sulla coprésence della slide 5, e contiene la voce «Lieu». Link: &lt;a href=&quot;https://espacestemps.net/articles/dictionnaire-de-la-geographie-et-de-lespace-des-societes/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;presentazione su EspacesTemps&lt;/a&gt; · &lt;a href=&quot;https://ugr.es/~cuadgeo/docs/articulos/035/035-011.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione in Cuadernos Geográficos (2004, PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Michel Lussault · &lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt; (Seuil, 2017)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Il libro in cui Lussault sviluppa il concetto di hyper-lieu: la mondializzazione differenzia il mondo e fa emergere luoghi che fanno da appigli e ancore della vita sociale globale. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della definizione di hyperplace (slide 5) e degli esempi delle slide 6–7. Link: &lt;a href=&quot;https://journals.openedition.org/lectures/22515&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su OpenEdition Lectures&lt;/a&gt; · &lt;a href=&quot;https://www.mollat.com/videos/rencontre-avec-michel-lussault-hyper-lieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;incontro video con l&#x27;autore (Mollat)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3 style=&quot;color:var(--accent)&quot;&gt;Integrazioni utili (non citate nelle slide)&lt;/h3&gt;
  &lt;ul class=&quot;refs&quot;&gt;
   &lt;li&gt;&lt;h4&gt;UNWTO · &lt;i&gt;&#x27;Overtourism&#x27;? Understanding and Managing Urban Tourism Growth beyond Perceptions&lt;/i&gt; (2018)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Rapporto dell&#x27;Organizzazione mondiale del turismo con CELTH ed ETFI (autori Koens, Postma, Papp). Offre una definizione di overtourism basata sulla percezione, un&#x27;indagine sui residenti di otto città europee e 11 strategie con 68 misure. &lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento istituzionale più citato sul tema della slide 8. Link: &lt;a href=&quot;https://unwto.org/global/publication/overtourism-understanding-and-managing-urban-tourism-growth-beyond-perceptions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina UNWTO&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Richard Butler · «The Concept of a Tourist Area Cycle of Evolution» (&lt;i&gt;The Canadian Geographer&lt;/i&gt;, 24(1), 1980)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Modello delle fasi di sviluppo di una destinazione (exploration → stagnation → decline o rejuvenation), legato al superamento della capacità di carico. Molto citato e molto discusso. &lt;b&gt;Perché conta:&lt;/b&gt; dà una dimensione temporale alla carrying capacity. Link: &lt;a href=&quot;https://strathprints.strath.ac.uk/88392/1/Butler-TG-2024-Tourism-destination-development-the-tourism.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Butler (2024), riflessione dell&#x27;autore sul modello (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;George Doxey · Irridex, «A Causation Theory of Visitor–Resident Irritants» (1975)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Indice di irritazione dei residenti: euphoria → apathy → annoyance → antagonism al crescere dei turisti. Criticato perché lineare e mai verificato in modo sistematico. &lt;b&gt;Perché conta:&lt;/b&gt; descrive l&#x27;impatto sui «residents» della slide 8. Link: &lt;a href=&quot;https://www.hosteltur.com/hosteltur-responde/indice-irritacion-doxey&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;spiegazione su Hosteltur (in spagnolo)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Consiglio d&#x27;Europa · Convenzione europea del paesaggio (Firenze, 2000)&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Trattato che definisce il paesaggio come area percepita dalle persone e ne chiede tutela, gestione e pianificazione. &lt;b&gt;Perché conta:&lt;/b&gt; chiarisce la configurazione «landscape» della slide 2. Link: &lt;a href=&quot;https://rm.coe.int/16800805ce&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo ufficiale (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h4&gt;Comune di Venezia · Venice Access Fee&lt;/h4&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Pagina ufficiale sul contributo di accesso per chi visita in giornata: chi paga, in quali giorni e orari, come prenotare. &lt;b&gt;Perché conta:&lt;/b&gt; è un caso concreto di gestione della carrying capacity nell&#x27;hyperplace della slide 7. Link: &lt;a href=&quot;https://veneziaunica.it/en/content/venice_access_fee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;veneziaunica.it&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
  &lt;/ul&gt;
 &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

    &lt;p&gt;&lt;b&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/b&gt;&lt;/p&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var NS=&quot;http://www.w3.org/2000/svg&quot;;
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

  /* linguette */
  $$(&quot;.tabs&quot;).forEach(function(box){
    var tabs=$$(&quot;[role=tab]&quot;,box);

    tabs.forEach(function(t,i){
      t.addEventListener(&quot;click&quot;,function(){sel(t)});
      t.addEventListener(&quot;keydown&quot;,function(e){var d=e.key===&quot;ArrowRight&quot;?1:e.key===&quot;ArrowLeft&quot;?-1:0;if(d){var n=tabs[(i+d+tabs.length)%tabs.length];sel(n);n.focus();e.preventDefault()}});

  /* topos / chora */
  var tc=$(&quot;#tc&quot;),bT=$(&quot;#b-topos&quot;),bC=$(&quot;#b-chora&quot;);

    function mode(ch){tc.classList.toggle(&quot;is-chora&quot;,ch);bT.classList.toggle(&quot;on&quot;,!ch);bC.classList.toggle(&quot;on&quot;,ch);bT.setAttribute(&quot;aria-pressed&quot;,!ch);bC.setAttribute(&quot;aria-pressed&quot;,ch)}
    bT.addEventListener(&quot;click&quot;,function(){mode(false)});
    bC.addEventListener(&quot;click&quot;,function(){mode(true)});
  }

  /* copresenza */
  var cop=$(&quot;#cop&quot;),cs=$(&quot;#copsvg&quot;);
  if(cop&amp;&amp;cs){
    var far=[[40,40],[140,210],[480,30],[90,130],[400,215],[300,25],[500,140],[210,60],[30,225],[350,120],[440,85],[180,170]];
    var near=[];
    for(var i=0;i&lt;12;i++){var a=i/12*Math.PI*2,r=i%2?44:22;near.push([260+Math.cos(a)*r,125+Math.sin(a)*r])}
    var gD=$(&quot;#cop-dots&quot;),gL=$(&quot;#cop-links&quot;),dots=[];
    far.forEach(function(){dots.push(el(&quot;circle&quot;,{r:7,fill:&quot;var(--ink)&quot;},gD))});
    var TH=60,ring=$(&quot;#cop-ring&quot;),lab=$(&quot;#cop-lab&quot;),out=$(&quot;#cop-out&quot;);
    function drawCop(){
      var t=cop.value/100,e=t*t*(3-2*t),P=[];
      for(var i=0;i&lt;12;i++){var x=far[i][0]+(near[i][0]-far[i][0])*e,y=far[i][1]+(near[i][1]-far[i][1])*e;P.push([x,y]);dots[i].setAttribute(&quot;cx&quot;,x);dots[i].setAttribute(&quot;cy&quot;,y)}
      while(gL.firstChild)gL.removeChild(gL.firstChild);
      var n=0,sum=0,m=0;
      for(var a=0;a&lt;12;a++)for(var b=a+1;b&lt;12;b++){var d=Math.hypot(P[a][0]-P[b][0],P[a][1]-P[b][1]);sum+=d;m++;if(d&lt;TH){n++;el(&quot;line&quot;,{x1:P[a][0],y1:P[a][1],x2:P[b][0],y2:P[b][1]},gL)}}
      ring.setAttribute(&quot;opacity&quot;,Math.max(0,(t-.6)/.4));lab.setAttribute(&quot;opacity&quot;,Math.max(0,(t-.75)/.25));
      var msg=t&lt;.35?&quot;persone disperse: per interagire servono mobilità o telecomunicazione&quot;:t&lt;.8?&quot;la cospazialità cresce: si formano gruppi in copresenza&quot;:&quot;place: tutti a portata, la distanza non è più rilevante&quot;;
      out.innerHTML=&quot;&lt;span&gt;Coppie in copresenza: &lt;b&gt;&quot;+n+&quot;&lt;/b&gt; / 66&lt;/span&gt;&lt;span&gt;Distanza media: &lt;b&gt;&quot;+Math.round(sum/m)+&quot;&lt;/b&gt; unità&lt;/span&gt;&lt;span&gt;&quot;+msg+&quot;&lt;/span&gt;&quot;;
    }
    cop.addEventListener(&quot;input&quot;,drawCop);drawCop();
  }

  /* attori overtourism */
  var AT=[
    [&quot;Tourists · problems in the experience in the place&quot;,&quot;Code, ressa, prezzi gonfiati, la sensazione di un luogo «messo in scena» per i visitatori. È il paradosso dell&#x27;hyperplace: il turista contribuisce a consumare proprio ciò che è venuto a cercare.&quot;],
    [&quot;Residents · problems in every day life services&quot;,&quot;Mezzi pubblici saturi, negozi di vicinato sostituiti da souvenir e ristorazione, case trasformate in affitti brevi, quindi affitti più cari e abitanti che se ne vanno. Il place dei residenti perde la sua chora: «la nostra piazza» non è più loro.&quot;],
    [&quot;Local government · social, environmental, economic problems&quot;,&quot;Sociali: tensioni tra residenti e visitatori, spopolamento. Ambientali: rifiuti, consumo d&#x27;acqua, usura del patrimonio. Economici: il turismo porta entrate ma anche costi di pulizia, sicurezza e manutenzione, e rende l&#x27;economia locale dipendente da un solo settore. Il governo locale deve scegliere chi tutelare.&quot;],
    [&quot;Other city-users · effetti a cascata&quot;,&quot;Nella slide la freccia parte dai residenti: i problemi si propagano a chi usa la città senza abitarci, come pendolari, studenti, lavoratori, utenti dei servizi. Anche loro trovano trasporti, spazi e servizi congestionati. (&lt;i&gt;City users&lt;/i&gt; è un termine della sociologia urbana per chi frequenta una città per lavoro, studio o consumo.)&quot;]
  ];
  var actors=$$(&quot;#actors .actor&quot;),ap=$(&quot;#actor-panel&quot;);
  actors.forEach(function(g){
    function pick(){actors.forEach(function(x){x.classList.toggle(&quot;sel&quot;,x===g);x.setAttribute(&quot;aria-pressed&quot;,x===g)});var a=AT[+g.getAttribute(&quot;data-a&quot;)];ap.innerHTML=&quot;&lt;b&gt;&quot;+a[0]+&quot;&lt;/b&gt;&lt;br&gt;&quot;+a[1]}
    g.setAttribute(&quot;aria-pressed&quot;,&quot;false&quot;);
    g.addEventListener(&quot;click&quot;,pick);
    g.addEventListener(&quot;keydown&quot;,function(e){if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();pick()}});
  });

  /* grafico carrying capacity */
  var ch=$(&quot;#chart&quot;),vis=$(&quot;#vis&quot;);
  if(ch&amp;&amp;vis){
    var X=function(v){return 50+v/200*490},Y=function(q){return 255-q*2.3};
    var econ=function(v){return 100*(1-Math.exp(-v/70))};
    var tour=function(v){return v&lt;70?88:Math.max(4,88-.011*(v-70)*(v-70))};
    var res=function(v){return Math.max(3,85-.12*v-(v&gt;80?.009*(v-80)*(v-80):0))};
    el(&quot;rect&quot;,{x:X(100),y:15,width:X(200)-X(100),height:240,fill:&quot;var(--brick-bg)&quot;},ch);
    el(&quot;path&quot;,{d:&quot;M50 15V255H540&quot;,class:&quot;ln&quot;},ch);
    [0,50,100,150,200].forEach(function(v){var t=el(&quot;text&quot;,{x:X(v),y:272,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},ch);t.textContent=v+&quot;%&quot;});
    var t1=el(&quot;text&quot;,{x:295,y:292,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},ch);t1.textContent=&quot;visitatori / carrying capacity&quot;;
    var t2=el(&quot;text&quot;,{x:14,y:135,&quot;font-size&quot;:11,class:&quot;mut&quot;,transform:&quot;rotate(-90 14 135)&quot;,&quot;text-anchor&quot;:&quot;middle&quot;},ch);t2.textContent=&quot;indice (0–100)&quot;;

  /* Butler */

      [&quot;Exploration&quot;,60,120,&quot;Pochi visitatori, spesso avventurosi; nessuna struttura dedicata. Il luogo è ancora pienamente il &lt;i&gt;place&lt;/i&gt; dei residenti.&quot;],

    var cc=el(&quot;text&quot;,{x:296,y:47,&quot;font-size&quot;:10,fill:&quot;var(--brick)&quot;},bu);cc.textContent=&quot;zona critica della capacità di carico&quot;;
    el(&quot;path&quot;,{d:&quot;M50 15V255H545&quot;,class:&quot;ln&quot;},bu);
    var d=&quot;&quot;;for(var x=60;x&lt;=420;x+=4)d+=(x&gt;60?&quot;L&quot;:&quot;M&quot;)+x+&quot; &quot;+BY(x).toFixed(1);

    var y0=BY(420);
    [[&quot;M420 &quot;+y0+&quot; C470 &quot;+(y0-10)+&quot; 500 35 540 28&quot;,&quot;rejuvenation&quot;],[&quot;M420 &quot;+y0+&quot; C470 &quot;+y0+&quot; 500 &quot;+(y0+4)+&quot; 540 &quot;+(y0+4),&quot;stabilizzazione&quot;],[&quot;M420 &quot;+y0+&quot; C470 &quot;+(y0+10)+&quot; 500 170 540 195&quot;,&quot;decline&quot;]].forEach(function(b,k){
      el(&quot;path&quot;,{d:b[0],stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.8,fill:&quot;none&quot;,&quot;stroke-dasharray&quot;:k?&quot;6 4&quot;:&quot;0&quot;},bu);
      var t=el(&quot;text&quot;,{x:470,y:[22,y0+22,200][k],&quot;font-size&quot;:10,class:&quot;mut&quot;},bu);t.textContent=b[1];
    });
    ST.forEach(function(s,i){var t=el(&quot;text&quot;,{x:(s[1]+s[2])/2,y:272,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,&quot;font-weight&quot;:600},bu);t.textContent=i+1});
    var tx=el(&quot;text&quot;,{x:295,y:292,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,class:&quot;mut&quot;},bu);tx.textContent=&quot;tempo →&quot;;
    var ty=el(&quot;text&quot;,{x:14,y:135,&quot;font-size&quot;:11,class:&quot;mut&quot;,transform:&quot;rotate(-90 14 135)&quot;,&quot;text-anchor&quot;:&quot;middle&quot;},bu);ty.textContent=&quot;visitatori&quot;;
    var dot=el(&quot;circle&quot;,{r:6,fill:&quot;var(--brick)&quot;,stroke:&quot;var(--card)&quot;,&quot;stroke-width&quot;:2},bu);
    var k=0,prev=$(&quot;#bu-prev&quot;),next=$(&quot;#bu-next&quot;),pn=$(&quot;#bu-panel&quot;),cnt=$(&quot;#bu-count&quot;);
    function drawBu(){var s=ST[k],mx=Math.min((s[1]+s[2])/2,420);band.setAttribute(&quot;x&quot;,s[1]);band.setAttribute(&quot;width&quot;,s[2]-s[1]);dot.setAttribute(&quot;cx&quot;,mx);dot.setAttribute(&quot;cy&quot;,BY(mx));pn.innerHTML=&quot;&lt;b&gt;&quot;+(k+1)+&quot; · &quot;+s[0]+&quot;&lt;/b&gt;&lt;br&gt;&quot;+s[3];cnt.textContent=&quot;fase &quot;+(k+1)+&quot; di &quot;+ST.length;prev.disabled=k===0;next.disabled=k===ST.length-1}
    prev.addEventListener(&quot;click&quot;,function(){if(k&gt;0){k--;drawBu()}});
    next.addEventListener(&quot;click&quot;,function(){if(k&lt;ST.length-1){k++;drawBu()}});
    drawBu();
  }
})();
