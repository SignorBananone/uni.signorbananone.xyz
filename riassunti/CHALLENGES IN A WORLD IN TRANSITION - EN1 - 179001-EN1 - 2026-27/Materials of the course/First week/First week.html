  &lt;p class=&quot;col small muted&quot;&gt;Come leggere la lezione in una frase: la geografia studia il rapporto fra &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;society&lt;/span&gt;; il &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; è lo spazio sociale costruito da questo rapporto alla scala globale; questo spazio è sempre più urbano, e il mondo urbanizzato lascia sull&#x27;&lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt; un&#x27;impronta tanto forte da far parlare di &lt;span class=&quot;en&quot;&gt;Anthropocene&lt;/span&gt;. Da qui nascono le &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt; che il corso chiede di leggere in un &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part hue&quot; style=&quot;--h:250&quot; aria-labelledby=&quot;s1-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Course introduction&lt;/div&gt;&lt;h2 id=&quot;s1-t&quot;&gt;Com&#x27;è fatto il corso&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Struttura, programma, valutazione e group work &lt;span class=&quot;src&quot;&gt;slide 1–6&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Il corso fa parte della laurea magistrale &lt;span class=&quot;en&quot;&gt;Accounting, Governance and Sustainability&lt;/span&gt; e guarda le grandi sfide contemporanee con due lenti diverse: la &lt;dfn class=&quot;en&quot;&gt;geographical perspective&lt;/dfn&gt; (prospettiva geografica, cioè come le società organizzano e abitano lo spazio), affidata alla Prof. Federica Burini, e la &lt;dfn class=&quot;en&quot;&gt;sociological perspective&lt;/dfn&gt; (prospettiva sociologica, cioè come si strutturano gruppi, valori e relazioni sociali), affidata alla Prof. Vera Lomazzi &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il calendario in un colpo d&#x27;occhio&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;margin:0 0 .3rem&quot;&gt;25 incontri di due ore, dal 14 settembre al 15 dicembre (lunedì 16:30–18:30, mercoledì 12:30–14:30). &lt;span class=&quot;pill&quot;&gt;Burini&lt;/span&gt; in colore, Lomazzi in grigio; bordo terracotta = questa prima settimana &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

      &lt;span class=&quot;b w1&quot; title=&quot;1 · 14 set · Burini · Course introduction&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;b w1&quot; title=&quot;2 · 16 set · Burini · Basic concepts about the World&quot;&gt;2&lt;/span&gt;&lt;span title=&quot;3 · 21 set · Lomazzi&quot;&gt;3&lt;/span&gt;&lt;span title=&quot;4 · 23 set · Lomazzi&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;5 · 28 set · Burini&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;6 · 30 set · Burini&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;7 · 5 ott · Burini&quot;&gt;7&lt;/span&gt;&lt;span title=&quot;8 · 7 ott · Lomazzi&quot;&gt;8&lt;/span&gt;&lt;span title=&quot;9 · 12 ott · Lomazzi&quot;&gt;9&lt;/span&gt;&lt;span title=&quot;10 · 14 ott · Lomazzi&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;11 · 19 ott · Burini&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;12 · 26 ott · Burini&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;13 · 28 ott · Burini&quot;&gt;13&lt;/span&gt;&lt;span title=&quot;14 · 3 nov · Lomazzi&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;15 · 4 nov · Burini&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;16 · 10 nov · Burini&quot;&gt;16&lt;/span&gt;&lt;span title=&quot;17 · 11 nov · Lomazzi&quot;&gt;17&lt;/span&gt;&lt;span title=&quot;18 · 17 nov · Lomazzi&quot;&gt;18&lt;/span&gt;&lt;span title=&quot;19 · 18 nov · Lomazzi&quot;&gt;19&lt;/span&gt;&lt;span title=&quot;20 · 24 nov · Lomazzi&quot;&gt;20&lt;/span&gt;&lt;span title=&quot;21 · 25 nov · Lomazzi&quot;&gt;21&lt;/span&gt;&lt;span title=&quot;22 · 1 dic · Lomazzi&quot;&gt;22&lt;/span&gt;&lt;span title=&quot;23 · 2 dic · Lomazzi&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;24 · 9 dic · Burini&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;b&quot; title=&quot;25 · 15 dic · Burini · presentazioni finali&quot;&gt;25&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;margin:.4rem 0 0&quot;&gt;Burini tiene 12 incontri, tanti quanti i 12 argomenti della prima parte; Lomazzi ne tiene 13. La slide indica “From 15 September”, ma il primo incontro in calendario è il 14.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il programma della prima parte &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;Dodici incontri che vanno dai concetti di base alla &lt;span class=&quot;en&quot;&gt;spatial justice&lt;/span&gt; (giustizia spaziale, cioè la distribuzione equa di risorse, opportunità e qualità dei luoghi) e al group work. &lt;b&gt;Questa prima settimana copre gli argomenti 1 e 2&lt;/b&gt; e anticipa l&#x27;Anthropocene, che torna nell&#x27;argomento 3.&lt;/p&gt;
  &lt;details class=&quot;fold&quot; open&gt;&lt;summary&gt;Gli argomenti uno per uno&lt;small&gt;Apri per la lista completa, con il legame a questa lezione&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;

  &lt;h3&gt;Il group work e il &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione&lt;/span&gt;&lt;p&gt;&lt;dfn class=&quot;en&quot;&gt;Territorial patch&lt;/dfn&gt;: un ritaglio di territorio usato come “laboratorio” (&lt;span class=&quot;en&quot;&gt;territorial lab&lt;/span&gt;), in cui scoprire le connessioni &lt;span class=&quot;en&quot;&gt;global/local&lt;/span&gt; con le &lt;span class=&quot;en&quot;&gt;global challenges&lt;/span&gt;: ambientali, sociali, economico-produttive e di &lt;span class=&quot;en&quot;&gt;governance&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Obiettivo:&lt;/b&gt; leggere le connessioni &lt;dfn class=&quot;en&quot;&gt;multiscale-intersectional&lt;/dfn&gt; legate alle sfide globali, cioè quelle che passano da una scala all&#x27;altra (dal quartiere al mondo) e incrociano più dimensioni (ambiente, società, economia, potere), e proporre un&#x27;analisi su come affrontarle. &lt;b&gt;Organizzazione:&lt;/b&gt; 4 gruppi formati con criteri di equilibrio (genere, nazionalità…).&lt;/p&gt;
  &lt;/div&gt;

        &lt;g&gt;&lt;rect x=&quot;545&quot; y=&quot;30&quot; width=&quot;160&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;625&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; class=&quot;f-t&quot; font-weight=&quot;700&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; class=&quot;f-ink&quot;&gt;Sfide e paesaggio&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; class=&quot;f-muted&quot; font-size=&quot;11&quot;&gt;pollution, mobility&lt;/text&gt;&lt;/g&gt;

        &lt;g class=&quot;s-t&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;167&quot; y1=&quot;70&quot; x2=&quot;183&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;347&quot; y1=&quot;70&quot; x2=&quot;363&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;527&quot; y1=&quot;70&quot; x2=&quot;543&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;707&quot; y1=&quot;70&quot; x2=&quot;723&quot; y2=&quot;70&quot;/&gt;&lt;/g&gt;
        &lt;text x=&quot;450&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;+ autovalutazione · lunedì 15 dicembre · 10 minuti per gruppo · discussione finale&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le parti della presentazione come sono numerate nella &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;. La numerazione salta il punto 3: probabilmente è un refuso, conviene chiedere alla docente se manca un passaggio.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;Il punto 5 parla di &lt;span class=&quot;en&quot;&gt;perception of the landscape&lt;/span&gt;: il &lt;span class=&quot;en&quot;&gt;landscape&lt;/span&gt; (paesaggio) in geografia non è solo il panorama, ma il territorio &lt;em&gt;così come lo percepiscono&lt;/em&gt; le persone che lo abitano. Inquinamento e mobilità sono sfide globali che si “vedono” e si vivono nel paesaggio locale: è qui che lo sguardo &lt;span class=&quot;en&quot;&gt;multiscale&lt;/span&gt; della sezione 3 diventa uno strumento di lavoro.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Bibliografia del corso &lt;span class=&quot;src&quot;&gt;slide 3–4&lt;/span&gt;&lt;/h3&gt;
  &lt;ul class=&quot;clean col&quot;&gt;
    &lt;li&gt;&lt;i&gt;Handbook on the Geopolitics of Sustainability&lt;/i&gt;, a cura di Björn-Ola Linnér, Therese Bennich e Henrik Carlsen (Edward Elgar, open access, licenza CC BY-NC-ND 4.0). Parole chiave: &lt;span class=&quot;en&quot;&gt;geopolitics, sustainability transformations, governance, system analysis, complexity, security, environmental change&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;Michel Lussault, &lt;i&gt;Inhabiting the world&lt;/i&gt; (testo online su pca-stream.com).&lt;/li&gt;
    &lt;li&gt;Ramos-Mejía, Franco-Garcia, Jauregui-Becker, &lt;i&gt;Sustainability transitions in the developing world: Challenges of socio-technical transformations unfolding in contexts of poverty&lt;/i&gt; (University of Twente, open access).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;col small muted&quot;&gt;Schede, dati e link verificati di ciascun testo sono in &lt;a href=&quot;#refs&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · il corso&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Che cos&#x27;è un &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt; e a cosa serve nel group work?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;È un ritaglio di territorio usato come laboratorio (&lt;span class=&quot;en&quot;&gt;territorial lab&lt;/span&gt;) per scoprire come le sfide globali (ambientali, sociali, economico-produttive, di governance) si collegano a quel luogo, cioè le connessioni global/local, e per proporre come affrontarle.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Quali sono i tre criteri dell&#x27;esame scritto?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;1) conoscenza generale degli argomenti; 2) elaborazione corretta dei concetti; 3) approccio critico. Lo scritto vale il 50% del voto, il project work l&#x27;altro 50%.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Che cosa significa leggere connessioni “multiscale-intersectional”?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Seguire un problema attraverso più scale (locale, urbana, regionale, globale) e incrociare più dimensioni (ambientale, sociale, economica, di governance), invece di guardarne una sola.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part hue&quot; style=&quot;--h:150&quot; aria-labelledby=&quot;s2-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Geography&lt;/div&gt;&lt;h2 id=&quot;s2-t&quot;&gt;La geografia come scienza del rapporto territorio–società&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Che cosa studia la geografia contemporanea &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 420 330&quot; aria-label=&quot;Schema: la geografia analizza il rapporto reciproco tra territorio e società&quot;&gt;

        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;46&quot; rx=&quot;23&quot; class=&quot;f-acc&quot;/&gt;

        &lt;rect x=&quot;240&quot; y=&quot;210&quot; width=&quot;160&quot; height=&quot;50&quot; rx=&quot;25&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;2&quot;/&gt;

        &lt;path d=&quot;M290 125 C 270 150, 270 180, 290 205&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M350 205 C 370 180, 370 150, 350 125&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;text x=&quot;262&quot; y=&quot;170&quot; text-anchor=&quot;end&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;condiziona,&lt;/text&gt;
        &lt;text x=&quot;262&quot; y=&quot;184&quot; text-anchor=&quot;end&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;offre risorse&lt;/text&gt;
        &lt;text x=&quot;378&quot; y=&quot;170&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;organizza,&lt;/text&gt;
        &lt;text x=&quot;378&quot; y=&quot;184&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;trasforma&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;282&quot; width=&quot;380&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-tb&quot;/&gt;
        &lt;text x=&quot;210&quot; y=&quot;299&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;11&quot;&gt;FOCUS: critical approach to&lt;/text&gt;
        &lt;text x=&quot;210&quot; y=&quot;314&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;INHABITANTS / SPATIALITY – URBANITY&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ridisegnato dalla &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;; le etichette sulle frecce sono una spiegazione aggiunta.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;La slide riassume la disciplina in uno schema: la &lt;b&gt;geografia&lt;/b&gt; è una &lt;span class=&quot;en&quot;&gt;science for analysing&lt;/span&gt; il rapporto tra &lt;b&gt;territory&lt;/b&gt; e &lt;b&gt;society&lt;/b&gt;. La doppia freccia dice che il rapporto va nei due sensi: le società trasformano lo spazio, e lo spazio così trasformato influenza a sua volta le società.&lt;/p&gt;
      &lt;p&gt;Il &lt;b&gt;focus della geografia contemporanea&lt;/b&gt; è un &lt;dfn class=&quot;en&quot;&gt;critical approach&lt;/dfn&gt; (approccio critico, che non dà per scontate le categorie e si chiede chi produce lo spazio e a vantaggio di chi) a tre nodi: &lt;span class=&quot;en&quot;&gt;inhabitants&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;spatiality&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;I termini chiave&lt;/h3&gt;
  &lt;p class=&quot;col muted small&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; La slide nomina questi concetti senza definirli: ecco come si usano di solito in geografia umana.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Territory&lt;small&gt;territorio&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Non è un pezzo di superficie terrestre qualunque, ma lo spazio &lt;em&gt;appropriato, organizzato e dotato di senso&lt;/em&gt; da una società: confini, infrastrutture, usi del suolo, nomi, regole. Un bosco diventa territorio quando qualcuno lo gestisce, lo protegge, lo sfrutta o lo racconta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Society&lt;small&gt;società&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;insieme degli individui e dei gruppi, con le loro istituzioni, economie, culture e relazioni di potere. Per il geografo conta come la società &lt;em&gt;si organizza nello spazio&lt;/em&gt;: dove abita, come si sposta, come usa e divide le risorse.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Inhabitants&lt;small&gt;abitanti&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le persone viste come attori che &lt;em&gt;abitano&lt;/em&gt; lo spazio, non solo come “popolazione” da contare. È un&#x27;idea centrale in Michel Lussault, autore di &lt;i&gt;Inhabiting the world&lt;/i&gt; in bibliografia: abitare vuol dire costruire ogni giorno il proprio rapporto con i luoghi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Spatiality&lt;small&gt;spazialità&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La dimensione spaziale di ogni fatto sociale: distanze, posizioni, reti, accessibilità, prossimità. Ogni azione umana avviene da qualche parte, e il “dove” cambia il suo significato e i suoi effetti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Urbanity&lt;small&gt;urbanità&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La qualità propria dell&#x27;urbano: la combinazione di &lt;em&gt;densità&lt;/em&gt; (molte persone e cose vicine) e &lt;em&gt;diversità&lt;/em&gt; (molte funzioni, persone e attività diverse) che rende possibili incontro e scambio. In questa visione l&#x27;urbanità non è un sì/no (città/campagna) ma un continuum: luoghi più o meno urbani. È il concetto che il corso riprende con Jacques Lévy (argomento 6, &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · geografia&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Perché nella slide la freccia tra &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;society&lt;/span&gt; è doppia?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché il rapporto è reciproco: la società organizza e trasforma il territorio, e il territorio così prodotto condiziona la società (risorse, vincoli, opportunità). La geografia studia proprio questa interazione.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Che differenza c&#x27;è tra “spazio” e &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Il territorio è spazio appropriato, organizzato e carico di significato da parte di una società; lo spazio in sé è una categoria più generale e astratta.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Su quali tre elementi la geografia contemporanea applica un &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Inhabitants, spatiality e urbanity.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part hue&quot; style=&quot;--h:85&quot; aria-labelledby=&quot;s3-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Brainstorming&lt;/div&gt;&lt;h2 id=&quot;s3-t&quot;&gt;Challenges / World / in Transition: smontare il titolo&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Le tre parole del titolo del corso, una alla volta &lt;span class=&quot;src&quot;&gt;slide 8–11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;La lezione parte da un brainstorming sul titolo del corso, diviso in tre parole: &lt;span class=&quot;en&quot;&gt;Challenges&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;in Transition&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;. Questa sezione tratta la prima e la terza; il &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; ha una sezione tutta sua (la 4).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Challenges: quattro sfide che portano all&#x27;urbanity &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 300&quot; aria-label=&quot;Le quattro challenges convergono verso l&#x27;urbanity&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-t&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g class=&quot;sv&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;65&quot; class=&quot;f-ink&quot;&gt;Environmental&lt;/text&gt;
          &lt;circle cx=&quot;320&quot; cy=&quot;60&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;65&quot; class=&quot;f-ink&quot;&gt;Social&lt;/text&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;240&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;245&quot; class=&quot;f-ink&quot;&gt;Economic&lt;/text&gt;
          &lt;circle cx=&quot;320&quot; cy=&quot;240&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;245&quot; class=&quot;f-ink&quot;&gt;Governance&lt;/text&gt;
          &lt;g class=&quot;s-t&quot; stroke-width=&quot;2.2&quot;&gt;&lt;line x1=&quot;122&quot; y1=&quot;88&quot; x2=&quot;160&quot; y2=&quot;118&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;278&quot; y1=&quot;88&quot; x2=&quot;240&quot; y2=&quot;118&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;122&quot; y1=&quot;212&quot; x2=&quot;160&quot; y2=&quot;182&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;278&quot; y1=&quot;212&quot; x2=&quot;240&quot; y2=&quot;182&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;/g&gt;
          &lt;circle cx=&quot;200&quot; cy=&quot;150&quot; r=&quot;46&quot; class=&quot;f-acc&quot;/&gt;
          &lt;text x=&quot;200&quot; y=&quot;155&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; letter-spacing=&quot;1&quot;&gt;URBANITY&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;Le sfide del mondo in transizione sono di quattro tipi, e la slide le fa convergere tutte su una parola scritta con tre punti esclamativi: &lt;b&gt;URBANITY&lt;/b&gt;. Il messaggio è che oggi le sfide si concentrano, si producono e si affrontano soprattutto negli spazi urbani, perché è lì che vive e agisce la maggior parte dell&#x27;umanità (vedi i dati della sezione 5).&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;Nell&#x27;argomento 7 del programma le stesse categorie tornano come &lt;span class=&quot;en&quot;&gt;vulnerabilities&lt;/span&gt; (vulnerabilità), con l&#x27;aggiunta di quella &lt;span class=&quot;en&quot;&gt;digital&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Environmental&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Clima, risorse, biodiversità, inquinamento. Esempio: isole di calore e qualità dell&#x27;aria in città.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Social&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Disuguaglianze, inclusione, accesso a casa e servizi, migrazioni. Esempio: quartieri segregati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Economic&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Produzione, lavoro, catene globali del valore, crisi. Esempio: deindustrializzazione di un&#x27;area.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Governance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Chi decide e come: istituzioni, partecipazione, coordinamento tra livelli (comune, Stato, UE, ONU).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; Gli esempi delle schede sono aggiunti per orientarsi; la slide elenca soltanto le quattro categorie.&lt;/p&gt;

  &lt;h3&gt;In transition: cinque chiavi di lettura &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;“In transizione” non vuol dire solo “che cambia”: la slide indica &lt;b&gt;cinque modi di guardare il cambiamento&lt;/b&gt;, che sono anche il metodo del corso.&lt;/p&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Spatio-temporal perspective&lt;/span&gt;&lt;small&gt;prospettiva spazio-temporale&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Spazio e tempo vanno letti insieme: ogni luogo è il risultato di una storia, e ogni processo storico si svolge in luoghi precisi. Una periferia industriale di oggi si capisce solo ricostruendo come e quando è nata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Human–non human relations&lt;/span&gt;&lt;small&gt;relazioni tra umani e non umani&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il mondo non è fatto solo di persone: animali, piante, acque, suoli, clima, ma anche tecnologie e infrastrutture partecipano alla costruzione dello spazio. È la stessa idea della definizione di &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt; della sezione 4: terra che dà vita a &lt;span class=&quot;en&quot;&gt;human and non human beings&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Dynamic evolution&lt;/span&gt;&lt;small&gt;evoluzione dinamica&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le transizioni non sono passaggi lineari da A a B: sono processi aperti, con accelerazioni, retromarce ed effetti imprevisti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Multiscale perspective&lt;/span&gt;&lt;small&gt;prospettiva multiscalare&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lo stesso fenomeno appare diverso alle diverse scale, e le scale si influenzano a vicenda. Prova il cursore qui sotto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Systemic approach&lt;/span&gt;&lt;small&gt;approccio sistemico&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si guarda all&#x27;insieme delle relazioni, non agli elementi isolati: un cambiamento in una parte del sistema (per esempio la mobilità) si riflette sulle altre (aria, salute, economia, disuguaglianze). Prepara il concetto di &lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt; della sezione 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; Le spiegazioni delle cinque chiavi sono aggiunte: la slide le elenca soltanto.&lt;/p&gt;

  &lt;h3&gt;Laboratorio: la &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; applicata al group work&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;scaleSvg&quot; viewBox=&quot;0 0 260 260&quot; aria-hidden=&quot;true&quot; style=&quot;max-width:260px;margin:0 auto&quot;&gt;
        &lt;circle data-i=&quot;4&quot; cx=&quot;130&quot; cy=&quot;130&quot; r=&quot;122&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;3&quot; cx=&quot;130&quot; cy=&quot;140&quot; r=&quot;96&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;2&quot; cx=&quot;130&quot; cy=&quot;150&quot; r=&quot;70&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;1&quot; cx=&quot;130&quot; cy=&quot;160&quot; r=&quot;45&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;0&quot; cx=&quot;130&quot; cy=&quot;170&quot; r=&quot;20&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;g class=&quot;sv f-ink&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;130&quot; y=&quot;22&quot;&gt;World&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;58&quot;&gt;regione · Stato · UE&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;94&quot;&gt;città&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;128&quot;&gt;patch&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;173&quot;&gt;casa&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label for=&quot;scaleR&quot; class=&quot;small muted&quot;&gt;Scegli la scala&lt;/label&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;input type=&quot;range&quot; id=&quot;scaleR&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;&lt;/div&gt;
        &lt;h4 id=&quot;scaleT&quot; style=&quot;margin-top:.2rem&quot;&gt;&lt;/h4&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Pollution:&lt;/b&gt; &lt;span id=&quot;scaleP&quot;&gt;&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Mobility:&lt;/b&gt; &lt;span id=&quot;scaleM&quot;&gt;&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;margin:0&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; Esercizio costruito sui due temi del punto 5 della presentazione di gruppo (&lt;span class=&quot;en&quot;&gt;pollution and mobility&lt;/span&gt;, &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;): a ogni scala cambiano attori, dati e possibili risposte.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script type=&quot;application/json&quot; id=&quot;scaleData&quot;&gt;[[&quot;Corpo e casa&quot;,&quot;l&#x27;aria che si respira ogni giorno, gli effetti sulla salute, le scelte domestiche (riscaldamento, consumi).&quot;,&quot;come ci si sposta ogni giorno: a piedi, in bici, in bus, in auto; quanto tempo e quanta fatica costa.&quot;],[&quot;Quartiere · territorial patch&quot;,&quot;il traffico in una via, una centralina di misura, una fabbrica o uno svincolo vicino alle case; come gli abitanti percepiscono il paesaggio.&quot;,&quot;fermate, piste ciclabili, parcheggi, barriere; chi è ben servito e chi no; gli attori locali (residenti, commercianti, associazioni).&quot;],[&quot;Città · area urbana&quot;,&quot;isole di calore, zone a traffico limitato, verde urbano, piani comunali per l&#x27;aria.&quot;,&quot;pendolarismo, trasporto pubblico, piani della mobilità; il rapporto tra centro e periferie.&quot;],[&quot;Regione · Stato · UE&quot;,&quot;bacini d&#x27;aria che vanno oltre i confini comunali (per esempio la Pianura Padana), norme nazionali ed europee sulla qualità dell&#x27;aria.&quot;,&quot;reti ferroviarie e autostradali, logistica, politiche di trasporto e fondi europei.&quot;],[&quot;World&quot;,&quot;cambiamento climatico, emissioni globali, inquinanti che viaggiano tra continenti.&quot;,&quot;flussi globali di merci, persone e turisti; aviazione e trasporto marittimo; catene logistiche mondiali.&quot;]]&lt;/script&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · challenges e transition&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Quali sono i quattro tipi di &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt; e verso quale concetto convergono?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Environmental, social, economic, governance. Convergono sull&#x27;&lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt;, perché le sfide si concentrano negli spazi urbanizzati in cui vive e agisce la maggior parte dell&#x27;umanità.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Elenca le cinque chiavi di lettura di “in transition”.
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Spatio-temporal perspective, human–non human relations, dynamic evolution, multiscale perspective, systemic approach.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Fai un esempio di &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; applicata alla mobilità.
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Una nuova linea di tram cambia gli spostamenti quotidiani degli abitanti (scala locale), dipende da piani comunali e fondi nazionali o europei (scale intermedie) e incide sulle emissioni globali (scala mondiale). Le decisioni a una scala hanno effetti sulle altre.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part hue&quot; style=&quot;--h:25&quot; aria-labelledby=&quot;s4-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;World&lt;/div&gt;&lt;h2 id=&quot;s4-t&quot;&gt;Earth, Planet, Globe, World: quattro parole, quattro oggetti&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Il cuore concettuale della lezione &lt;span class=&quot;src&quot;&gt;slide 9, 12–17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Nel linguaggio di tutti i giorni le quattro parole sembrano sinonimi. In geografia indicano &lt;b&gt;quattro oggetti diversi&lt;/b&gt;, e confonderli è proprio l&#x27;errore di “elaborazione dei concetti” che l&#x27;esame valuta. Apri le linguette.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Earth, Planet, Globe, World&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-e&quot; aria-controls=&quot;tp-e&quot; aria-selected=&quot;true&quot;&gt;Earth&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-p&quot; aria-controls=&quot;tp-p&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Planet&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-g&quot; aria-controls=&quot;tp-g&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Globe&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-w&quot; aria-controls=&quot;tp-w&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;World&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-e&quot; aria-labelledby=&quot;tb-e&quot;&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;path d=&quot;M20 110 Q45 70 70 92 T120 80 L130 125 L20 125Z&quot; class=&quot;f-t&quot; opacity=&quot;.75&quot;/&gt;&lt;path d=&quot;M75 92 q5 -25 22 -32 q-4 18 -22 32z&quot; class=&quot;f-t&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;96&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;105&quot; cy=&quot;104&quot; r=&quot;4&quot; class=&quot;f-ink&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione dalla slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;Earth&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;extension of land which gives life to human and non human beings&lt;/span&gt;, cioè la distesa di terre che dà vita a esseri umani e non umani &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;È la Terra come &lt;b&gt;suolo vivente&lt;/b&gt;, ambiente fisico e biologico: rilievi, acque, suoli, ecosistemi. Ricollega alla chiave &lt;span class=&quot;en&quot;&gt;human–non human relations&lt;/span&gt; della sezione 3. La slide la illustra con una carta fisica in rilievo del mondo.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-p&quot; aria-labelledby=&quot;tb-p&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;30&quot; cy=&quot;75&quot; r=&quot;16&quot; class=&quot;f-acc&quot;/&gt;&lt;ellipse cx=&quot;75&quot; cy=&quot;75&quot; rx=&quot;60&quot; ry=&quot;22&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;circle cx=&quot;118&quot; cy=&quot;62&quot; r=&quot;9&quot; class=&quot;f-t&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione dalla slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;«The Planet»&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;celestial body which orbits around a star&lt;/span&gt;, cioè un corpo celeste che orbita attorno a una stella &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;È la Terra vista dall&#x27;&lt;b&gt;astronomia&lt;/b&gt;: uno dei pianeti del sistema solare, definito dalla sua orbita attorno al Sole e non da chi lo abita. Le virgolette della slide («The Planet») ricordano che nel discorso pubblico “il Pianeta” si usa spesso in senso ambientale (“salvare il Pianeta”), ma in senso stretto è una categoria astronomica.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-g&quot; aria-labelledby=&quot;tb-g&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;65&quot; r=&quot;40&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M35 65h80M75 25v80M45 42q30 10 60 0M45 88q30 -10 60 0&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;1&quot;/&gt;&lt;path d=&quot;M75 105v18M55 125h40&quot; class=&quot;s-ink&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M28 65a47 47 0 0 0 94 0&quot; fill=&quot;none&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione dalla slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;The Globe&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;reproduction/representation of the Earth/Planet&lt;/span&gt;, cioè la riproduzione o rappresentazione della Terra o del pianeta &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;È un &lt;b&gt;artefatto culturale&lt;/b&gt;: un modello che rappresenta la Terra e quindi contiene sempre scelte (che cosa mostrare, con quali nomi, da quale punto di vista). L&#x27;esempio della slide è di Bergamo: il &lt;b&gt;globo terracqueo di Vincenzo Maria Coronelli (1688)&lt;/b&gt;, conservato alla Biblioteca Angelo Mai in Piazza Vecchia.&lt;/p&gt;
        &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;La Biblioteca Civica Angelo Mai conserva una coppia di grandi globi di Coronelli (uno terrestre e uno celeste). Arrivarono a Bergamo nel 1692, acquistati a Venezia dal frate Angelo Finardi, e sono nella biblioteca dal 1834. Sono esposti nell&#x27;atrio, e nel 2016 una mostra (“L&#x27;immagine del mondo”) ha presentato il globo terrestre restaurato. Fonti: &lt;a href=&quot;https://www.bibliotecamai.org/wp-content/uploads/2012/10/PANNELLI-MOSTRA-GLOBI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pannelli della mostra, Biblioteca Mai&lt;/a&gt;; &lt;a href=&quot;https://en.wikipedia.org/wiki/Vincenzo_Coronelli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Vincenzo Coronelli&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-w&quot; aria-labelledby=&quot;tb-w&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;75&quot; r=&quot;48&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;2&quot;/&gt;&lt;g class=&quot;s-acc&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M48 60Q75 30 104 58&quot;/&gt;&lt;path d=&quot;M48 60Q70 100 100 96&quot;/&gt;&lt;path d=&quot;M104 58Q90 80 100 96&quot;/&gt;&lt;path d=&quot;M48 60L75 78L104 58M75 78L100 96&quot;/&gt;&lt;/g&gt;&lt;g class=&quot;f-acc&quot;&gt;&lt;circle cx=&quot;48&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;58&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;96&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;78&quot; r=&quot;4&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione dalla slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;The World&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;socially constructed social space at the global scale shaped by human activities&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;. Più esteso: &lt;i&gt;“It&#x27;s not the Planet, it&#x27;s not the earth, but a (socially) constructed social-space at the global scale, historically shaped by human activities”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;Ogni parola della definizione conta:&lt;/p&gt;
        &lt;ul class=&quot;clean&quot;&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;socially constructed&lt;/span&gt;&lt;/b&gt;: il World non è un dato di natura, lo producono le società (relazioni, scambi, istituzioni, immaginari);&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;social space&lt;/span&gt;&lt;/b&gt;: è uno spazio di relazioni tra persone e gruppi;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;at the global scale&lt;/span&gt;&lt;/b&gt;: è la scala più ampia di queste relazioni, quella in cui tutto il pianeta è interconnesso;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;historically shaped&lt;/span&gt;&lt;/b&gt;: ha una storia, cioè è nato e cambia nel tempo (scambi, imperi, rivoluzione industriale, globalizzazione).&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p&gt;L&#x27;immagine è &lt;b&gt;&lt;span class=&quot;en&quot;&gt;Earthrise&lt;/span&gt;&lt;/b&gt;: la &lt;span class=&quot;en&quot;&gt;first picture of the Earth from Apollo 8&lt;/span&gt;, 1968 &lt;span class=&quot;src&quot;&gt;slide 12, 16&lt;/span&gt;. Vedere la Terra intera da fuori ha reso visibile un&#x27;unica casa comune: un&#x27;icona del &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; come idea condivisa.&lt;/p&gt;
        &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;La foto fu scattata dall&#x27;astronauta William Anders il 24 dicembre 1968, durante l&#x27;orbita lunare di Apollo 8, ed è considerata una delle spinte del movimento ambientalista. Fonte: &lt;a href=&quot;https://www.space.com/earthrise-christmas-eve-image-that-changed-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Space.com&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Dal dato naturale alla costruzione sociale&lt;/h3&gt;
  &lt;figure&gt;

  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Termine&lt;/th&gt;&lt;th&gt;Che cos&#x27;è&lt;/th&gt;&lt;th&gt;Chi lo studia&lt;/th&gt;&lt;th&gt;Esempio della slide&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Earth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;terre che danno vita a umani e non umani&lt;/td&gt;&lt;td&gt;scienze della Terra, ecologia, geografia fisica&lt;/td&gt;&lt;td&gt;carta fisica del mondo&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Planet&lt;/b&gt;&lt;/td&gt;&lt;td&gt;corpo celeste in orbita attorno a una stella&lt;/td&gt;&lt;td&gt;astronomia&lt;/td&gt;&lt;td&gt;sistema solare&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Globe&lt;/b&gt;&lt;/td&gt;&lt;td&gt;rappresentazione della Terra o del pianeta&lt;/td&gt;&lt;td&gt;cartografia, storia&lt;/td&gt;&lt;td&gt;globo di Coronelli, 1688&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;World&lt;/b&gt;&lt;/td&gt;&lt;td&gt;spazio sociale globale costruito storicamente&lt;/td&gt;&lt;td&gt;geografia umana, scienze sociali&lt;/td&gt;&lt;td&gt;Earthrise, 1968&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · World&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Definisci il &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; in senso geografico, e spiega perché non coincide con &lt;span class=&quot;en&quot;&gt;Planet&lt;/span&gt; ed &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt;.
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;È uno spazio sociale alla scala globale, costruito socialmente e plasmato nella storia dalle attività umane. Il Planet è un corpo celeste definito dall&#x27;orbita; l&#x27;Earth è la terra vivente che sostiene umani e non umani. Entrambi esisterebbero anche senza società umane; il World no.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Perché il globo di Coronelli è un esempio di &lt;span class=&quot;en&quot;&gt;Globe&lt;/span&gt; e non di &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché è una rappresentazione costruita da un cartografo nel 1688, con le conoscenze e le scelte del suo tempo: rappresenta la Terra, non è la Terra.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Che cosa vuol dire &lt;span class=&quot;en&quot;&gt;historically shaped&lt;/span&gt; nella definizione di World?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Che il World cambia nel tempo con le attività umane (commerci, colonizzazioni, industrializzazione, urbanizzazione, reti digitali): non è dato una volta per tutte.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part hue&quot; style=&quot;--h:35&quot; aria-labelledby=&quot;s5-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Globalization = urbanization&lt;/div&gt;&lt;h2 id=&quot;s5-t&quot;&gt;Un mondo che si fa urbano&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Dati, &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; e tratti delle &lt;span class=&quot;en&quot;&gt;life-forms&lt;/span&gt; urbane &lt;span class=&quot;src&quot;&gt;slide 17–20&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;blockquote&gt;Globalization = urbanization&lt;footer&gt;&lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
    &lt;p&gt;Subito dopo aver definito il &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;, la slide pone un&#x27;equazione forte: &lt;b&gt;globalizzarsi e urbanizzarsi sono lo stesso processo&lt;/b&gt;. La &lt;dfn class=&quot;en&quot;&gt;globalization&lt;/dfn&gt; (l&#x27;integrazione crescente di economie, società e culture alla scala mondiale) si realizza attraverso le città e le loro reti; e il World, come spazio sociale globale, prende sempre più la forma di uno spazio urbano.&lt;/p&gt;
  &lt;/div&gt;
