  &lt;div class=&quot;grid2&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cosa dicono i dati&lt;/h4&gt;
      &lt;ul class=&quot;clean small&quot;&gt;
        &lt;li&gt;Dal 1900 al 2017 la popolazione mondiale cresce di 5 volte (da 1,5 a 7,5 miliardi), quella urbana di &lt;b&gt;18 volte&lt;/b&gt; (da 220 milioni a 4 miliardi).&lt;/li&gt;
        &lt;li&gt;La quota urbana passa da circa il &lt;b&gt;15%&lt;/b&gt; (1900) al &lt;b&gt;53%&lt;/b&gt; (2017): tra 2000 e 2017 si supera la soglia simbolica della metà.&lt;/li&gt;
        &lt;li&gt;Per il 2050 si prevede che circa &lt;b&gt;7 abitanti su 10&lt;/b&gt; vivranno in aree urbane (6,7 su 9,6 miliardi).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;Le percentuali sono calcolate dai valori della &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin-top:.5rem&quot;&gt;Il rapporto ONU &lt;i&gt;World Urbanization Prospects 2025&lt;/i&gt; (novembre 2025) usa un nuovo metodo, il &lt;span class=&quot;en&quot;&gt;Degree of Urbanization&lt;/span&gt;, che distingue &lt;b&gt;cities&lt;/b&gt;, &lt;b&gt;towns&lt;/b&gt; e aree rurali: le città ospitano il &lt;b&gt;45%&lt;/b&gt; degli 8,2 miliardi di abitanti, le &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt; il 36%, le aree rurali il 19%. Le megacittà (oltre 10 milioni di abitanti) sono passate da 8 nel 1975 a 33 nel 2025.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; “quanto è urbano il mondo” dipende da come si definisce l&#x27;urbano. È un buon esempio di &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt;: i numeri vanno sempre letti insieme alle definizioni.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Fonte: &lt;a href=&quot;https://www.un.org/sustainabledevelopment/blog/2025/11/press-release-wup2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN, comunicato stampa WUP 2025&lt;/a&gt;; &lt;a href=&quot;https://www.un.org/development/desa/pd/node/4442&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, Summary of Results&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Planetary urbanization&lt;/span&gt;: non solo demografia &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;La &lt;dfn class=&quot;en&quot;&gt;planetary urbanization&lt;/dfn&gt; (urbanizzazione planetaria, cioè l&#x27;estensione dell&#x27;urbano all&#x27;intero pianeta) &lt;b&gt;non è solo un fenomeno demografico&lt;/b&gt;: non basta contare quante persone vivono in città. La slide propone due chiavi di lettura.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;1 · Una «revolution»&lt;/h4&gt;&lt;p&gt;L&#x27;urbanizzazione è una specie di &lt;b&gt;rivoluzione&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;a complete shift in the social organization and cultures&lt;/span&gt;, un cambiamento completo dell&#x27;organizzazione sociale e delle culture.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Riferimento: Henri Lefebvre, &lt;i&gt;La révolution urbaine&lt;/i&gt;, Paris, Gallimard (in italiano &lt;i&gt;La rivoluzione urbana&lt;/i&gt;, Armando, 1973). La slide indica il 1971; la prima edizione francese risulta del 1970 (vedi &lt;a href=&quot;#refs&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;2 · Una «widespread diffusion»&lt;/h4&gt;&lt;p&gt;L&#x27;urbanizzazione è una &lt;b&gt;diffusione capillare&lt;/b&gt; di &lt;span class=&quot;en&quot;&gt;urban spatial patterns&lt;/span&gt; (forme spaziali urbane) e di &lt;span class=&quot;en&quot;&gt;urban «life-forms»&lt;/span&gt; (forme di vita urbane), che hanno tutte un &lt;b&gt;«family trait»&lt;/b&gt;, un&#x27;aria di famiglia, &lt;span class=&quot;en&quot;&gt;whatever the context&lt;/span&gt;: qualunque sia il contesto.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; aria-label=&quot;Tre livelli dell&#x27;urbanizzazione: demografico, spaziale, delle forme di vita&quot;&gt;
      &lt;g class=&quot;sv&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;130&quot; width=&quot;860&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-rule&quot;/&gt;
        &lt;text x=&quot;40&quot; y=&quot;153&quot; class=&quot;f-ink&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Livello demografico&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;172&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;più persone vivono in aree urbane (slide 18)&lt;/text&gt;
        &lt;rect x=&quot;80&quot; y=&quot;70&quot; width=&quot;740&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;93&quot; class=&quot;f-ink&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Urban spatial patterns&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;112&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;forme spaziali urbane ovunque: reti, infrastrutture, centri commerciali, periferie diffuse&lt;/text&gt;
        &lt;rect x=&quot;140&quot; y=&quot;10&quot; width=&quot;620&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-t&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;33&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Urban «life-forms»&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;52&quot; class=&quot;f-paper&quot; font-size=&quot;12&quot;&gt;modi di vivere urbani con un «family trait», anche lontano dalle città&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; Schema interpretativo: la &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; va oltre il dato demografico (base) e investe le forme dello spazio e i modi di vivere. Per questo si può essere “urbani” anche in un paese di montagna connesso a internet.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;I tratti principali delle &lt;span class=&quot;en&quot;&gt;life-forms&lt;/span&gt; urbane &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;La slide elenca sette &lt;span class=&quot;en&quot;&gt;major traits&lt;/span&gt; che orientano forme spaziali e modi di vivere urbani. Apri ogni tratto per una spiegazione e un esempio.&lt;/p&gt;
  &lt;p class=&quot;col small muted&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; Spiegazioni ed esempi sono aggiunti: la slide riporta solo l&#x27;elenco.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;1 · &lt;span class=&quot;en&quot;&gt;Individualization / Anonymity&lt;/span&gt;&lt;small&gt;individualizzazione, anonimato&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In città l&#x27;individuo è meno legato a comunità tradizionali (famiglia allargata, paese) e sceglie di più i propri legami; l&#x27;altra faccia è l&#x27;anonimato tra sconosciuti. Esempio: vivere per anni in un condominio senza conoscere i vicini.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;2 · &lt;span class=&quot;en&quot;&gt;Illimitation&lt;/span&gt;&lt;small&gt;assenza di limiti&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;urbano tende a non avere confini netti: la città si espande, si diffonde nelle campagne, si estende in reti senza un “fuori”. Esempio: la dispersione urbana (&lt;span class=&quot;en&quot;&gt;urban sprawl&lt;/span&gt;) lungo strade e autostrade.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;3 · &lt;span class=&quot;en&quot;&gt;«Mobilization»&lt;/span&gt;&lt;small&gt;tutto è in movimento&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Everything is on the move&lt;/span&gt;: persone, merci, capitali, informazioni, rifiuti. La mobilità diventa una condizione normale della vita. Esempio: pendolarismo quotidiano, turismo di massa, logistica.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;4 · &lt;span class=&quot;en&quot;&gt;Place consumption (iper-places)&lt;/span&gt;&lt;small&gt;consumo dei luoghi, iper-luoghi&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I luoghi stessi diventano oggetti di consumo, e nascono &lt;span class=&quot;en&quot;&gt;hyper-places&lt;/span&gt; (iper-luoghi): spazi molto connessi e frequentati che concentrano funzioni e flussi globali. Esempio: aeroporti, grandi stazioni, centri commerciali, piazze turistiche iconiche.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;5 · &lt;span class=&quot;en&quot;&gt;Digitalization&lt;/span&gt;&lt;small&gt;digitalizzazione&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le pratiche urbane passano dalle piattaforme digitali: orientarsi, spostarsi, comprare, lavorare, incontrarsi. Esempio: app di mobilità, consegne a domicilio, lavoro da remoto. È la base della vulnerabilità &lt;span class=&quot;en&quot;&gt;digital&lt;/span&gt; dell&#x27;argomento 7.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;6 · &lt;span class=&quot;en&quot;&gt;Connexions (hyperspatiality)&lt;/span&gt;&lt;small&gt;connessioni, iperspazialità&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli spazi sono collegati da reti che rendono vicino il lontano: lo spazio vissuto combina luoghi fisici e connessioni a distanza (iperspazialità). Esempio: lavorare a Bergamo con un team in un altro continente, in tempo reale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;7 · &lt;span class=&quot;en&quot;&gt;Standardization and «Normation»&lt;/span&gt;&lt;small&gt;standardizzazione e normazione&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Forme, servizi e comportamenti si uniformano secondo modelli e norme simili ovunque: è il &lt;span class=&quot;en&quot;&gt;«family trait»&lt;/span&gt;. Esempio: lo stesso tipo di catene, centri commerciali e quartieri residenziali in città lontanissime tra loro.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;I termini &lt;span class=&quot;en&quot;&gt;hyper-places&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;hyperspatiality&lt;/span&gt; sono legati al lavoro del geografo francese Michel Lussault, autore in bibliografia (sui &lt;span class=&quot;en&quot;&gt;hyper-lieux&lt;/span&gt; ha scritto un libro nel 2017). Non è indicato nelle slide: verifica a lezione se la docente fa riferimento a lui.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · urbanization&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Perché si dice che la &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; “non è solo un fenomeno demografico”?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché oltre all&#x27;aumento della popolazione urbana comporta un cambiamento completo dell&#x27;organizzazione sociale e delle culture (la “rivoluzione urbana” di Lefebvre) e la diffusione ovunque di forme spaziali e modi di vivere urbani con un&#x27;aria di famiglia comune.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Usando i dati della slide, di quanto cresce la quota di popolazione urbana tra il 1900 e il 2017?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Da circa il 15% (0,22 su 1,5 miliardi) a circa il 53% (4 su 7,5 miliardi). In valore assoluto la popolazione urbana diventa circa 18 volte più grande.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Che cosa significa che le &lt;span class=&quot;en&quot;&gt;urban life-forms&lt;/span&gt; hanno un &lt;span class=&quot;en&quot;&gt;«family trait»&lt;/span&gt;? Cita almeno tre tratti.
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Che si somigliano in contesti molto diversi. Tratti: individualization/anonymity, illimitation, mobilization, place consumption (iper-places), digitalization, connexions (hyperspatiality), standardization and normation.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Perché lo stesso mondo può risultare urbano al 53% o al 45%?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché le stime dipendono dalla definizione di “urbano” e dall&#x27;anno. Il WUP 2025 dell&#x27;ONU (fonte esterna) conta il 45% nelle &lt;span class=&quot;en&quot;&gt;cities&lt;/span&gt; e un altro 36% nelle &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt;: cambiando metodo cambia il numero.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part hue&quot; style=&quot;--h:150&quot; aria-labelledby=&quot;s6-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Global environmental change&lt;/div&gt;&lt;h2 id=&quot;s6-t&quot;&gt;Il mondo urbanizzato e l&#x27;Anthropocene&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;La grande sfida, la nascita di un concetto e la lettura del testo di Crutzen e Stoermer &lt;span class=&quot;src&quot;&gt;slide 21–23&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Il mondo urbanizzato affronta &lt;i&gt;“right now an impressive challenge”&lt;/i&gt;: il &lt;dfn class=&quot;en&quot;&gt;global environmental change&lt;/dfn&gt; (cambiamento ambientale globale), dovuto agli impatti delle attività umane sull&#x27;&lt;dfn class=&quot;en&quot;&gt;earth system&lt;/dfn&gt;, cioè la Terra intesa come un unico sistema di parti che interagiscono (atmosfera, oceani, suoli, ghiacci, esseri viventi e società) &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le quattro componenti del cambiamento&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;i&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Global warming&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il riscaldamento globale &lt;b&gt;e i suoi effetti multiscalari&lt;/b&gt;: un fenomeno planetario che si manifesta in modo diverso a ogni scala (ondate di calore in città, siccità regionali, innalzamento del mare).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;ii&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Depletion of resources&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;L&#x27;esaurimento delle risorse &lt;b&gt;non rinnovabili e persino di quelle rinnovabili&lt;/b&gt;: anche acqua, suoli fertili o pesce si esauriscono se il prelievo è più veloce della rigenerazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;iii&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Biodiversity loss&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;La &lt;b&gt;rapida riduzione della biodiversità&lt;/b&gt; su scala globale, cioè della varietà di specie, geni ed ecosistemi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;iv&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Metabolism of biotic systems&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Una modifica &lt;b&gt;senza precedenti del metabolismo dei sistemi biotici&lt;/b&gt; (suoli, oceani, acque), causata dai primi tre fenomeni e dagli inquinanti, incluse le molecole chimiche di sintesi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt; “Metabolismo” qui indica i cicli di materia ed energia con cui suoli, acque e oceani funzionano: carbonio, azoto, nutrienti. Quando questi cicli cambiano, cambia il funzionamento dell&#x27;intero sistema.&lt;/p&gt;

  &lt;blockquote&gt;«The human imprint on the global environment has now become so large and active that it rivals some of the great forces of Nature in its impact on the functioning of the Earth system»
    &lt;footer&gt;Will Steffen, Jacques Grinevald, Paul Crutzen, John McNeill, “The Anthropocene: conceptual and historical perspectives”, &lt;i&gt;Philosophical Transactions of the Royal Society A&lt;/i&gt;, vol. 369, 2011, pp. 842–867 &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;col box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definizione&lt;/span&gt;&lt;p&gt;&lt;dfn class=&quot;en&quot;&gt;Anthropocene&lt;/dfn&gt; (dal greco &lt;i&gt;anthropos&lt;/i&gt;, “essere umano”): nome proposto per l&#x27;epoca geologica attuale, in cui l&#x27;umanità è diventata una forza capace di modificare il funzionamento della Terra al pari delle grandi forze naturali. Viene contrapposto all&#x27;&lt;span class=&quot;en&quot;&gt;Holocene&lt;/span&gt; (“interamente recente”), l&#x27;epoca post-glaciale degli ultimi 10–12 mila anni &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Reading and discussing: le cifre di Crutzen e Stoermer &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;La lezione si chiude con la lettura del testo che ha lanciato il termine (Crutzen e Stoermer, 2000). Ecco le principali prove dell&#x27;impronta umana che elenca.&lt;/p&gt;
  &lt;figure class=&quot;panel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 800 290&quot; aria-label=&quot;Grafico a barre: indicatori dell&#x27;impatto umano secondo Crutzen e Stoermer&quot;&gt;
      &lt;g class=&quot;sv&quot; font-size=&quot;12.5&quot;&gt;
        &lt;g class=&quot;s-rule&quot;&gt;&lt;line x1=&quot;300&quot; y1=&quot;10&quot; x2=&quot;300&quot; y2=&quot;262&quot;/&gt;&lt;line x1=&quot;530&quot; y1=&quot;10&quot; x2=&quot;530&quot; y2=&quot;262&quot; stroke-dasharray=&quot;3 4&quot;/&gt;&lt;line x1=&quot;760&quot; y1=&quot;10&quot; x2=&quot;760&quot; y2=&quot;262&quot; stroke-dasharray=&quot;3 4&quot;/&gt;&lt;/g&gt;
        &lt;text x=&quot;290&quot; y=&quot;34&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Superficie terrestre trasformata&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;230&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot; opacity=&quot;.35&quot;/&gt;&lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;138&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot;/&gt;&lt;text x=&quot;538&quot; y=&quot;36&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;30–50%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;76&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Acqua dolce accessibile usata&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;62&quot; width=&quot;230&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot;/&gt;&lt;text x=&quot;538&quot; y=&quot;78&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;&amp;gt; 50%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;118&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Mangrovie perdute nel mondo&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;104&quot; width=&quot;230&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot;/&gt;&lt;text x=&quot;538&quot; y=&quot;120&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;50%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;160&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Aumento di CO₂ in atmosfera&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;146&quot; width=&quot;138&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;446&quot; y=&quot;162&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;&amp;gt; 30%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;202&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Aumento di CH₄ (metano)&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;188&quot; width=&quot;460&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;752&quot; y=&quot;204&quot; text-anchor=&quot;end&quot; class=&quot;f-paper&quot; font-weight=&quot;600&quot;&gt;&amp;gt; 100%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;244&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Produzione primaria oceanica pescata&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;230&quot; width=&quot;161&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;469&quot; y=&quot;246&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;25% (upwelling) · 35% (piattaforma)&lt;/text&gt;
        &lt;g class=&quot;f-muted&quot; font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;300&quot; y=&quot;282&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;282&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;282&quot;&gt;100%&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Valori dal testo riportato nella &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt; (Crutzen e Stoermer, 2000). Per la pesca la barra mostra il 35%.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;×10&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;popolazione umana in tre secoli, fino a 6 miliardi; urbanizzazione decuplicata nell&#x27;ultimo secolo&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;1,4 mld&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;capi di bestiame (circa una mucca per famiglia media)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;160 Tg/anno&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;di SO₂ da carbone e petrolio: almeno il doppio di tutte le emissioni naturali&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;×1.000–10.000&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;tasso di estinzione delle specie nelle foreste pluviali tropicali&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;N &amp;gt; N&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;più azoto fissato in modo sintetico (fertilizzanti) che in modo naturale negli ecosistemi terrestri; le emissioni di NO producono smog fotochimico&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;50.000 anni&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;per cui il clima potrebbe discostarsi dal comportamento naturale (studio di Berger e Loutre)&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;Il testo cita anche i clorofluorocarburi (CFC), che hanno causato il “buco dell&#x27;ozono” sull&#x27;Antartide e avrebbero distrutto gran parte dello strato di ozono senza le regole internazionali che ne hanno fermato la produzione &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Una storia dell&#x27;idea, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 90&quot; aria-label=&quot;Linea del tempo: scegli un passo&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;40&quot; x2=&quot;840&quot; y2=&quot;40&quot; class=&quot;s-t&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g class=&quot;sv f-muted&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1784&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;72&quot;&gt;1784&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1833&quot;&gt;&lt;circle cx=&quot;157.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;157.5&quot; y=&quot;72&quot;&gt;1833&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1864&quot;&gt;&lt;circle cx=&quot;255&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;255&quot; y=&quot;72&quot;&gt;1864&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1873&quot;&gt;&lt;circle cx=&quot;352.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;352.5&quot; y=&quot;72&quot;&gt;1873&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1924-1926&quot;&gt;&lt;circle cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;72&quot;&gt;1924–26&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2000&quot;&gt;&lt;circle cx=&quot;547.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;547.5&quot; y=&quot;72&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2002&quot;&gt;&lt;circle cx=&quot;645&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;645&quot; y=&quot;72&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2004-2011&quot;&gt;&lt;circle cx=&quot;742.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;742.5&quot; y=&quot;72&quot;&gt;2004–11&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2024&quot;&gt;&lt;circle cx=&quot;840&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;840&quot; y=&quot;72&quot;&gt;2024&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;tlSteps&quot; style=&quot;min-height:11rem&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1784&lt;/div&gt;&lt;h4&gt;Il motore a vapore di James Watt&lt;/h4&gt;&lt;p&gt;Crutzen e Stoermer propongono di far iniziare l&#x27;Anthropocene nella &lt;b&gt;seconda metà del Settecento&lt;/b&gt;: è da allora che le carote di ghiaccio registrano l&#x27;aumento di CO₂ e CH₄, e la data coincide con il motore a vapore di Watt (1784). Gli autori ammettono che la scelta è “in parte arbitraria”: c&#x27;è chi propone date diverse, fino a includere l&#x27;intero Olocene &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1833 · 1885&lt;/div&gt;&lt;h4&gt;Lyell e l&#x27;Holocene&lt;/h4&gt;&lt;p&gt;Il nome &lt;span class=&quot;en&quot;&gt;Holocene&lt;/span&gt;, “interamente recente”, per l&#x27;epoca post-glaciale degli ultimi 10–12 mila anni fu proposto da Sir Charles Lyell nel 1833 e adottato dal Congresso Geologico Internazionale di Bologna nel 1885. È la “cornice” geologica da cui l&#x27;Anthropocene vorrebbe distinguersi &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1864&lt;/div&gt;&lt;h4&gt;G. P. Marsh, &lt;i&gt;Man and Nature&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Uno dei primi libri sull&#x27;uomo come forza che modifica la Terra, ripubblicato con il titolo &lt;i&gt;The Earth as Modified by Human Action&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt; Il sottotitolo originale è &lt;i&gt;Physical Geography as Modified by Human Action&lt;/i&gt;; il libro sosteneva che le società antiche del Mediterraneo si erano indebolite disboscando e impoverendo i suoli, ed è considerato uno dei testi fondativi del conservazionismo. &lt;a href=&quot;https://www.environmentandsociety.org/mml/man-and-nature-or-physical-geography-modified-human-action&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Environment &amp;amp; Society Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1873&lt;/div&gt;&lt;h4&gt;Antonio Stoppani e l&#x27;“era antropozoica”&lt;/h4&gt;&lt;p&gt;Il geologo italiano descriveva l&#x27;attività umana come una &lt;i&gt;“new telluric force”&lt;/i&gt;, una nuova forza tellurica paragonabile per potenza e universalità alle grandi forze della Terra, e parlava già di &lt;span class=&quot;en&quot;&gt;anthropozoic era&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1924 · 1926&lt;/div&gt;&lt;h4&gt;Noösphere e biosfera&lt;/h4&gt;&lt;p&gt;Il gesuita francese Pierre Teilhard de Chardin ed Édouard Le Roy coniano nel 1924 il termine &lt;span class=&quot;en&quot;&gt;noösphere&lt;/span&gt;, il “mondo del pensiero”, per indicare il ruolo crescente dell&#x27;ingegno e della tecnologia umani. Nel 1926 il geologo russo V. I. Vernadsky riconosce il potere crescente dell&#x27;umanità come parte della biosfera &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2000&lt;/div&gt;&lt;h4&gt;Crutzen e Stoermer propongono “Anthropocene”&lt;/h4&gt;&lt;p&gt;Il chimico dell&#x27;atmosfera Paul J. Crutzen e il biologo Eugene F. Stoermer propongono il termine nel &lt;i&gt;Global Change Newsletter&lt;/i&gt; n. 41 dell&#x27;IGBP (International Geosphere-Biosphere Programme) per sottolineare &lt;i&gt;“the central role of mankind in geology and ecology”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 22–23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2002&lt;/div&gt;&lt;h4&gt;“Geology of mankind”, su &lt;i&gt;Nature&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Crutzen rilancia l&#x27;idea in una pagina su &lt;i&gt;Nature&lt;/i&gt; (vol. 415), con un riquadro intitolato “The Anthropocene” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;. Il concetto esce dalla nicchia ed entra nel dibattito scientifico e pubblico.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2004 · 2011&lt;/div&gt;&lt;h4&gt;Earth system science&lt;/h4&gt;&lt;p&gt;Il libro dell&#x27;IGBP &lt;i&gt;Global Change and the Earth System: A Planet Under Pressure&lt;/i&gt; (Steffen e altri) sintetizza un decennio di ricerche &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;; nel 2011 Steffen, Grinevald, Crutzen e McNeill pubblicano l&#x27;articolo con la citazione riportata sopra.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2024&lt;/div&gt;&lt;h4&gt;Il voto dei geologi&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt; Nel marzo 2024 la &lt;span class=&quot;en&quot;&gt;Subcommission on Quaternary Stratigraphy&lt;/span&gt; ha respinto la proposta di inserire l&#x27;Anthropocene come epoca formale nella scala dei tempi geologici, e IUGS e ICS hanno approvato il voto. La stessa dichiarazione sottolinea però che il termine continuerà a essere usato da scienziati e pubblico. Il presidente della sottocommissione ha contestato la regolarità del voto. &lt;a href=&quot;https://stratigraphy.org/news/152&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dichiarazione congiunta IUGS–ICS&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Utile per l&#x27;&lt;span class=&quot;en&quot;&gt;approccio critico&lt;/span&gt;: per la geologia ufficiale l&#x27;Anthropocene non è (per ora) un&#x27;epoca formale, ma resta un concetto centrale per le scienze ambientali e sociali, e per questo corso.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrl&quot; style=&quot;justify-content:space-between&quot;&gt;
      &lt;button class=&quot;btn ghost&quot; id=&quot;tlPrev&quot;&gt;← Indietro&lt;/button&gt;
      &lt;span id=&quot;tlCount&quot; class=&quot;small muted&quot;&gt;&lt;/span&gt;
      &lt;button class=&quot;btn&quot; id=&quot;tlNext&quot;&gt;Avanti →&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;oltre le slide&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;&lt;b&gt;Come si lega al resto della lezione.&lt;/b&gt; La sezione 5 mostra che il World è sempre più urbano; questa mostra che le attività di quel mondo urbanizzato sono ormai una forza geologica. Città, consumi, mobilità ed energia fossile sono il motore dei quattro cambiamenti globali. Per questo il programma prosegue con &lt;span class=&quot;en&quot;&gt;Geography and Urbanity in the Anthropocene&lt;/span&gt; (argomento 3, &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;), e il group work chiede di leggere &lt;span class=&quot;en&quot;&gt;pollution and mobility&lt;/span&gt; in un luogo concreto.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Anthropocene&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Quali sono le quattro componenti del &lt;span class=&quot;en&quot;&gt;global environmental change&lt;/span&gt; indicate nella slide?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;1) global warming e i suoi effetti multiscalari; 2) esaurimento delle risorse non rinnovabili e anche rinnovabili; 3) rapida riduzione della biodiversità globale; 4) modifica senza precedenti del metabolismo dei sistemi biotici (suoli, oceani, acque), dovuta ai primi tre fenomeni e agli inquinanti, comprese le molecole chimiche di sintesi.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Che cosa significa che l&#x27;impronta umana “rivals some of the great forces of Nature”?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Che le attività umane incidono sul funzionamento dell&#x27;earth system (clima, cicli chimici, biosfera) con una forza paragonabile a quella dei grandi processi naturali. È l&#x27;idea alla base del termine Anthropocene (Steffen e altri, 2011).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Quale data d&#x27;inizio propongono Crutzen e Stoermer, e perché?
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;La seconda metà del Settecento: le carote di ghiaccio mostrano da allora l&#x27;aumento di CO₂ e CH₄, e la data coincide con il motore a vapore di Watt (1784). Loro stessi la definiscono in parte arbitraria.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Cita due precursori dell&#x27;idea di Anthropocene ricordati nel testo.
        &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Per esempio G. P. Marsh (&lt;i&gt;Man and Nature&lt;/i&gt;, 1864), Antonio Stoppani (“era antropozoica”, 1873), Teilhard de Chardin e Le Roy (noösphere, 1924), V. I. Vernadsky (1926).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;refs&quot; class=&quot;part&quot; aria-labelledby=&quot;refs-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2 id=&quot;refs-t&quot;&gt;Autori, testi e fonti citati nelle slide&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Ogni scheda indica in quale slide compare il riferimento. Dati bibliografici, descrizioni e link vengono dalla ricerca web: sono tutti &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;h3 style=&quot;margin-top:0&quot;&gt;Testi della bibliografia del corso&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;i&gt;Handbook on the Geopolitics of Sustainability&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;a cura di Björn-Ola Linnér, Therese Bennich, Henrik Carlsen · Edward Elgar, 2026 · open access (CC BY-NC-ND 4.0) · DOI 10.4337/9781035342549 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; oltre 60 ricercatori di discipline diverse esaminano l&#x27;intreccio tra geopolitica e sostenibilità: come le sfide della sostenibilità ridisegnano la geopolitica e viceversa. Lo Stockholm Environment Institute lo presenta come un contributo alla nascita della “geopolitics of sustainability” come campo di studi.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il manuale del corso. Collega le &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt; ambientali a governance, sicurezza e complessità, cioè le stesse dimensioni del group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.4337/9781035342549&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo open access (DOI, Elgaronline)&lt;/a&gt; · &lt;a href=&quot;https://www.e-elgar.com/shop/gbp/handbook-on-the-geopolitics-of-sustainability-9781035342532.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;editore&lt;/a&gt; · &lt;a href=&quot;https://www.sei.org/publications/handbook-on-the-geopolitics-of-sustainability/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina SEI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Michel Lussault, &lt;i&gt;Inhabiting the world&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Michel Lussault, geografo (ENS de Lyon) · testo online su PCA-Stream &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la ricerca non ha permesso di verificare il contenuto della pagina indicata nella slide. Lussault studia i modi in cui gli esseri umani abitano gli spazi terrestri a tutte le scale; sullo stesso tema ha scritto &lt;i&gt;L&#x27;avènement du Monde. Essai sur l&#x27;habitation humaine de la Terre&lt;/i&gt; (Seuil, 2013) e il capitolo “How to Change the World by Inhabiting It” nel volume &lt;i&gt;Constellation.s. Inhabiting the World&lt;/i&gt; (Actes Sud, 2017). PCA-Stream è lo studio di architettura parigino di Philippe Chiambaretta, che pubblica la rivista di ricerca &lt;i&gt;Stream&lt;/i&gt;, dedicata tra l&#x27;altro al rapporto tra umanità, città e natura nell&#x27;Anthropocene.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà fondamento all&#x27;idea di &lt;span class=&quot;en&quot;&gt;inhabitants&lt;/span&gt; e alla distinzione tra Terra e &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; (in francese &lt;i&gt;Monde&lt;/i&gt;) che è il cuore della lezione.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.pca-stream.com/en/explore/inhabiting-the-world/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Link indicato nella slide&lt;/a&gt; · &lt;a href=&quot;https://hal.archives-ouvertes.fr/hal-02047997&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Capitolo su HAL&lt;/a&gt; · &lt;a href=&quot;https://publicspace.org/authors/-/author/michel-lussault&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Profilo dell&#x27;autore (publicspace.org)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ramos-Mejía, Franco-Garcia, Jauregui-Becker, &lt;i&gt;Sustainability transitions in the developing world&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Environmental Science &amp;amp; Policy&lt;/i&gt;, vol. 84, 2018, pp. 217–223 · University of Twente &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; si chiede se le teorie delle &lt;span class=&quot;en&quot;&gt;sustainability transitions&lt;/span&gt; nate dall&#x27;esperienza europea, come la &lt;span class=&quot;en&quot;&gt;Multi-level perspective&lt;/span&gt; e la &lt;span class=&quot;en&quot;&gt;Strategic Niche Management&lt;/span&gt;, funzionino nei paesi in via di sviluppo. In quei contesti istituzioni efficienti convivono con istituzioni deboli, mercati imperfetti e comunità clientelari o escluse.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra che le transizioni dipendono dal contesto territoriale e sociale: è la &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; e il &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt; applicati alla povertà.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://perfilesycapacidades.javeriana.edu.co/en/publications/sustainability-transitions-in-the-developing-world-challenges-of-/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda della pubblicazione&lt;/a&gt; · &lt;a href=&quot;https://research.utwente.nl/en/publications/transitions-to-sustainability-at-the-bottom-the-role-of-grassroot/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ricerca collegata degli stessi autori (U. Twente)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Autori e testi citati nella lezione&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Henri Lefebvre, &lt;i&gt;La révolution urbaine&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Paris, Gallimard; la slide indica il 1971, le fonti consultate datano la prima edizione al 1970 · trad. it. &lt;i&gt;La rivoluzione urbana&lt;/i&gt;, Armando, 1973 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; uscito subito dopo il Sessantotto, avanza l&#x27;ipotesi che la società sia diventata “completamente urbanizzata” e che l&#x27;urbano sia una possibilità planetaria, non solo la città come oggetto di studio. Concetti chiave: urbanizzazione generalizzata, &lt;span class=&quot;en&quot;&gt;implosion–explosion&lt;/span&gt;, spazio planetario.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la radice dell&#x27;idea di &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt;, ripresa dagli anni 2010 dal gruppo di Neil Brenner (&lt;i&gt;Implosions/Explosions&lt;/i&gt;, 2014).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.wcfia.harvard.edu/publications/implosionsexplosions-towards-study-planetary-urbanization&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Implosions/Explosions: Towards a Study of Planetary Urbanization (Harvard)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Steffen, Grinevald, Crutzen, McNeill, “The Anthropocene: conceptual and historical perspectives” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Philosophical Transactions of the Royal Society A&lt;/i&gt;, 369 (1938), 2011, pp. 842–867 · DOI 10.1098/rsta.2010.0327 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; sostiene l&#x27;adozione dell&#x27;Anthropocene come nuova epoca, con inizio verso il 1800 (rivoluzione industriale); ricostruisce la storia del concetto e discute le tendenze recenti, comprese le prime proposte di gestire i grandi cicli geofisici (geo-ingegneria).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della citazione chiave della lezione (“rivals some of the great forces of Nature”).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1098/rsta.2010.0327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Articolo (DOI)&lt;/a&gt; · &lt;a href=&quot;https://openresearch-repository.anu.edu.au/items/15d0ac64-ec08-4682-bfef-08027f6f4a38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Repository ANU&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul J. Crutzen, Eugene F. Stoermer, “The Anthropocene” &lt;span class=&quot;src&quot;&gt;slide 22–23&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt;, n. 41, maggio 2000, pp. 17–18 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il testo letto in classe (slide 23). Parte dall&#x27;Olocene, ricorda i precursori (Marsh, Stoppani, Vernadsky, Teilhard), elenca le prove dell&#x27;impatto umano e propone come inizio la fine del Settecento.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;atto di nascita del termine, pubblicato in modo insolito in una newsletter e non in una rivista scientifica.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul J. Crutzen, “Geology of mankind” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Nature&lt;/i&gt;, 415, 3 gennaio 2002, p. 23 · DOI 10.1038/415023a &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una pagina nella sezione “Concepts” di &lt;i&gt;Nature&lt;/i&gt;, con il riquadro “The Anthropocene”: l&#x27;impatto umano è cresciuto tanto da poter alterare il clima per un lungo periodo.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; ha portato il concetto al grande pubblico scientifico.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1038/415023a&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Articolo (DOI)&lt;/a&gt; · &lt;a href=&quot;https://pubmed.ncbi.nlm.nih.gov/11780095/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PubMed&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;W. Steffen et al., &lt;i&gt;Global Change and the Earth System: A Planet Under Pressure&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Springer, serie IGBP, 2004 (© 2005) · Steffen, Sanderson, Tyson, Jäger, Matson, Moore III, Oldfield, Richardson, Schellnhuber, Turner II, Wasson &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la sintesi di un decennio di ricerche dell&#x27;IGBP, con capitoli sull&#x27;&lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt; integrato, sull&#x27;“Anthropocene Era” e sulla sostenibilità globale. Conclude che l&#x27;umanità è ormai il principale motore del cambiamento planetario e che la Terra si trova in uno stato “no analogue”, senza precedenti.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; fonda la &lt;span class=&quot;en&quot;&gt;Earth system science&lt;/span&gt;, lo sguardo sistemico che la lezione chiama &lt;span class=&quot;en&quot;&gt;systemic approach&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://link.springer.com/book/10.1007/b137870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;George Perkins Marsh, &lt;i&gt;Man and Nature&lt;/i&gt; (1864) &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;New York, Scribner, 1864 · sottotitolo &lt;i&gt;Physical Geography as Modified by Human Action&lt;/i&gt; &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; rovescia il punto di vista dell&#x27;epoca: non è solo la Terra a plasmare l&#x27;uomo, ma l&#x27;uomo a trasformare la Terra, spesso in modo distruttivo (disboscamento ed erosione nel Mediterraneo antico).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è un precursore dell&#x27;Anthropocene e del conservazionismo; il testo integrale è libero.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.gutenberg.org/ebooks/37957&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Gutenberg (testo integrale)&lt;/a&gt; · &lt;a href=&quot;https://www.environmentandsociety.org/mml/man-and-nature-or-physical-geography-modified-human-action&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Environment &amp;amp; Society Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Jacques Lévy e l&#x27;urbanità &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Geografo, professore all&#x27;EPFL di Losanna, cofondatore di EspacesTemps.net &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; Lévy ha proposto di misurare l&#x27;urbanità (densità più diversità) e di leggere lo spazio lungo un &lt;span class=&quot;en&quot;&gt;gradient d&#x27;urbanité&lt;/span&gt;, un continuum invece della coppia città/campagna. Nell&#x27;articolo “Périphérisation de l&#x27;urbain” (2014, con Michel Lussault) descrive un&#x27;urbanizzazione a basso gradiente di urbanità, in cui calano insieme densità e diversità.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;autore dell&#x27;argomento 6 del programma (&lt;span class=&quot;en&quot;&gt;Urbanities&lt;/span&gt;) e dà gli strumenti per misurare l&#x27;&lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt; introdotta in questa lezione.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://espacestemps.net/articles/peripherisation-de-lurbain/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Périphérisation de l&#x27;urbain”, EspacesTemps.net&lt;/a&gt; · &lt;a href=&quot;https://metropolitics.org/_Levy-Jacques_.html?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Profilo su Metropolitics&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vincenzo Maria Coronelli, globo terracqueo (1688) &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Biblioteca Civica Angelo Mai, Piazza Vecchia, Bergamo &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una coppia di grandi globi (terrestre e celeste) del cartografo veneziano, arrivati a Bergamo nel 1692 e nella biblioteca dal 1834, restaurati anche con il progetto FAI “Save the Globes”.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;esempio “sotto casa” di &lt;span class=&quot;en&quot;&gt;Globe&lt;/span&gt; come rappresentazione storica del mondo, e si può andare a vedere.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bibliotecamai.org/wp-content/uploads/2012/10/PANNELLI-MOSTRA-GLOBI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pannelli della mostra sui globi (Biblioteca Mai)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;i&gt;Earthrise&lt;/i&gt;, Apollo 8 (1968) &lt;span class=&quot;src&quot;&gt;slide 12, 16&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Foto di William Anders, 24 dicembre 1968 &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la Terra che sorge sull&#x27;orizzonte lunare, fotografata mentre la navicella orbitava attorno alla Luna.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; ha reso visibile la Terra come un insieme unico e fragile ed è considerata una delle spinte del movimento ambientalista; nella lezione illustra il &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.space.com/earthrise-christmas-eve-image-that-changed-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Space.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Fonti aggiuntive usate in questa pagina&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN DESA, &lt;i&gt;World Urbanization Prospects 2025&lt;/i&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Nazioni Unite, novembre 2025 · non citato nelle slide &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; le stime ufficiali dell&#x27;ONU sull&#x27;urbanizzazione, rifatte con il metodo &lt;span class=&quot;en&quot;&gt;Degree of Urbanization&lt;/span&gt; (città, &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt;, aree rurali): 45% della popolazione nelle città nel 2025, 33 megacittà.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; aggiorna la tabella della slide 18 e mostra quanto le definizioni cambino i numeri.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.un.org/development/desa/pd/node/4442&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary of Results&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IUGS–ICS, dichiarazione sul voto sull&#x27;Anthropocene (2024)&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;International Union of Geological Sciences e International Commission on Stratigraphy · non citato nelle slide &lt;span class=&quot;tag-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;approvazione del voto che ha respinto l&#x27;Anthropocene come unità formale della scala dei tempi geologici, con la precisazione che il termine resterà in uso.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; chiarisce lo stato attuale del dibattito, utile per un &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt; all&#x27;esame.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://stratigraphy.org/news/152&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;stratigraphy.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer class=&quot;end&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
    &lt;p&gt;Fonte principale: &lt;i&gt;First week.pdf&lt;/i&gt;, corso “Challenges in a World in Transition”, Università degli Studi di Bergamo, a.a. 2026-2027. I contenuti segnati “fonte esterna” vengono dal web e hanno il loro link; quelli segnati “oltre le slide” sono spiegazioni aggiunte.&lt;/p&gt;
  &lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  // linguette
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var bs=t.querySelectorAll(&#x27;[role=tab]&#x27;);
    bs.forEach(function(b,i){
      b.addEventListener(&#x27;click&#x27;,function(){sel(b)});
      b.addEventListener(&#x27;keydown&#x27;,function(e){
        var k=e.key===&#x27;ArrowRight&#x27;?1:e.key===&#x27;ArrowLeft&#x27;?-1:0;
        if(k){var n=bs[(i+k+bs.length)%bs.length];n.focus();sel(n)}
      });
    });
    function sel(b){bs.forEach(function(x){var on=x===b;x.setAttribute(&#x27;aria-selected&#x27;,on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute(&#x27;aria-controls&#x27;)).hidden=!on})}
  });

  // evidenzia la sezione corrente nella barra
  var links=[].slice.call(document.querySelectorAll(&#x27;nav.top a&#x27;));
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id)})}})
    },{rootMargin:&#x27;-45% 0px -50% 0px&#x27;});
    document.querySelectorAll(&#x27;main &gt; section[id]&#x27;).forEach(function(s){io.observe(s)});
  }

  function fmt(v,d){return v.toFixed(d).replace(&#x27;.&#x27;,&#x27;,&#x27;)}

  // grafico popolazione urbana
  var D=[[1900,1.5,.22],[1950,2.6,.745],[2000,6.1,2.8],[2017,7.5,4],[2050,9.6,6.7]];
  var pr=document.getElementById(&#x27;popYear&#x27;);
  if(pr){
    var X=function(y){return 60+(y-1900)*700/150},Y=function(v){return 300-27*v};
    var at=function(y){for(var i=0;i&lt;D.length-1;i++){var a=D[i],b=D[i+1];if(y&gt;=a[0]&amp;&amp;y&lt;=b[0]){var k=(y-a[0])/(b[0]-a[0]);return[a[1]+k*(b[1]-a[1]),a[2]+k*(b[2]-a[2])]}}return[D[4][1],D[4][2]]};
    var upd=function(){
      var y=+pr.value,v=at(y),x=X(y),exact=D.some(function(d){return d[0]===y});
      document.getElementById(&#x27;popCur&#x27;).setAttribute(&#x27;x1&#x27;,x);document.getElementById(&#x27;popCur&#x27;).setAttribute(&#x27;x2&#x27;,x);
      var w=document.getElementById(&#x27;popDW&#x27;),u=document.getElementById(&#x27;popDU&#x27;);
      w.setAttribute(&#x27;cx&#x27;,x);w.setAttribute(&#x27;cy&#x27;,Y(v[0]));u.setAttribute(&#x27;cx&#x27;,x);u.setAttribute(&#x27;cy&#x27;,Y(v[1]));
      document.getElementById(&#x27;popY&#x27;).textContent=y;
      document.getElementById(&#x27;popW&#x27;).textContent=fmt(v[0],2)+&#x27; mld&#x27;;
      document.getElementById(&#x27;popU&#x27;).textContent=v[1]&lt;1?Math.round(v[1]*1000)+&#x27; mln&#x27;:fmt(v[1],2)+&#x27; mld&#x27;;
      var s=v[1]/v[0]*100;
      document.getElementById(&#x27;popS&#x27;).textContent=fmt(s,1)+&#x27; %&#x27;;
      document.getElementById(&#x27;popBar&#x27;).style.width=s+&#x27;%&#x27;;
      document.getElementById(&#x27;popNote&#x27;).textContent=exact?(y===2050?&#x27;Dato delle slide (proiezione: “at least”).&#x27;:&#x27;Dato delle slide.&#x27;):&#x27;Valore interpolato in linea retta tra due dati delle slide: è una stima per orientarsi, non un dato.&#x27;;
    };
    pr.addEventListener(&#x27;input&#x27;,upd);upd();
    document.querySelectorAll(&#x27;[data-year]&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){pr.value=b.dataset.year;upd()})});
  }

  // cursore delle scale
  var SC=document.getElementById(&#x27;scaleR&#x27;);
  if(SC){
    var L=JSON.parse(document.getElementById(&#x27;scaleData&#x27;).textContent);
    var su=function(){
      var i=+SC.value;
      document.getElementById(&#x27;scaleT&#x27;).textContent=L[i][0];
      document.getElementById(&#x27;scaleP&#x27;).textContent=L[i][1];
      document.getElementById(&#x27;scaleM&#x27;).textContent=L[i][2];
      document.querySelectorAll(&#x27;#scaleSvg circle[data-i]&#x27;).forEach(function(c){var k=+c.dataset.i;c.style.fillOpacity=k&lt;=i?.18+.1*(i-k):0;c.style.strokeWidth=k===i?3:1.2});
    };
    SC.addEventListener(&#x27;input&#x27;,su);su();
  }

  // passi della timeline Anthropocene
  var steps=[].slice.call(document.querySelectorAll(&#x27;#tlSteps .step&#x27;));
  if(steps.length){
    var cur=0,prev=document.getElementById(&#x27;tlPrev&#x27;),next=document.getElementById(&#x27;tlNext&#x27;),dots=[].slice.call(document.querySelectorAll(&#x27;.tl-dot&#x27;));
    var go=function(i){
      cur=Math.max(0,Math.min(steps.length-1,i));
      steps.forEach(function(s,k){s.classList.toggle(&#x27;on&#x27;,k===cur)});
      dots.forEach(function(d,k){var c=d.querySelector(&#x27;circle&#x27;);c.setAttribute(&#x27;r&#x27;,k===cur?9:5.5);c.setAttribute(&#x27;class&#x27;,k===cur?&#x27;f-t&#x27;:&#x27;f-card s-t&#x27;)});
      prev.disabled=cur===0;next.disabled=cur===steps.length-1;
      document.getElementById(&#x27;tlCount&#x27;).textContent=(cur+1)+&#x27; / &#x27;+steps.length;
    };
    prev.addEventListener(&#x27;click&#x27;,function(){go(cur-1)});
    next.addEventListener(&#x27;click&#x27;,function(){go(cur+1)});
    dots.forEach(function(d,k){d.addEventListener(&#x27;click&#x27;,function(){go(k)});d.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();go(k)}})});
    go(0);
  }
})();
&lt;/script&gt;
