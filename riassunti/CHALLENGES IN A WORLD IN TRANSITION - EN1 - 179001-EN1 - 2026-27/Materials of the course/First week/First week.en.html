  &lt;p class=&quot;col small muted&quot;&gt;The lecture in one sentence: geography studies the relationship between &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;society&lt;/span&gt;; the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; is the social space produced by this relationship at the global scale; this space is increasingly urban, and the urbanized world leaves such a strong imprint on the &lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt; that we now speak of the &lt;span class=&quot;en&quot;&gt;Anthropocene&lt;/span&gt;. This is where the &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt; come from that the course asks you to read within a &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part hue&quot; style=&quot;--h:250&quot; aria-labelledby=&quot;s1-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Course introduction&lt;/div&gt;&lt;h2 id=&quot;s1-t&quot;&gt;How the course is organized&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Structure, syllabus, assessment and group work &lt;span class=&quot;src&quot;&gt;slide 1–6&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;The course is part of the Master&#x27;s degree in &lt;span class=&quot;en&quot;&gt;Accounting, Governance and Sustainability&lt;/span&gt; and examines the major contemporary challenges through two different lenses: the &lt;dfn class=&quot;en&quot;&gt;geographical perspective&lt;/dfn&gt; (how societies organize and inhabit space), taught by Prof. Federica Burini, and the &lt;dfn class=&quot;en&quot;&gt;sociological perspective&lt;/dfn&gt; (how groups, values and social relations are structured), taught by Prof. Vera Lomazzi &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The calendar at a glance&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;margin:0 0 .3rem&quot;&gt;25 two-hour sessions, from 14 September to 15 December (Mondays 16:30–18:30, Wednesdays 12:30–14:30). &lt;span class=&quot;pill&quot;&gt;Burini&lt;/span&gt; in colour, Lomazzi in grey; terracotta border = this first week &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;The syllabus of the first part &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;Twelve sessions ranging from the basic concepts to &lt;span class=&quot;en&quot;&gt;spatial justice&lt;/span&gt; (the fair distribution of resources, opportunities and quality of places) and the group work. &lt;b&gt;This first week covers topics 1 and 2&lt;/b&gt; and anticipates the Anthropocene, which returns in topic 3.&lt;/p&gt;

  &lt;h3&gt;The group work and the &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition&lt;/span&gt;&lt;p&gt;&lt;dfn class=&quot;en&quot;&gt;Territorial patch&lt;/dfn&gt;: a portion of territory used as a “laboratory” (&lt;span class=&quot;en&quot;&gt;territorial lab&lt;/span&gt;) in which to uncover the &lt;span class=&quot;en&quot;&gt;global/local&lt;/span&gt; connections with the &lt;span class=&quot;en&quot;&gt;global challenges&lt;/span&gt;: environmental, social, economic-productive and &lt;span class=&quot;en&quot;&gt;governance&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Aim:&lt;/b&gt; to read the &lt;dfn class=&quot;en&quot;&gt;multiscale-intersectional&lt;/dfn&gt; connections related to global challenges, that is, connections that move from one scale to another (from the neighbourhood to the world) and cut across several dimensions (environment, society, economy, power), and to propose an analysis of how to address them. &lt;b&gt;Organization:&lt;/b&gt; 4 groups formed according to balance criteria (gender, nationality…).&lt;/p&gt;

  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;Point 5 refers to the &lt;span class=&quot;en&quot;&gt;perception of the landscape&lt;/span&gt;: in geography, &lt;span class=&quot;en&quot;&gt;landscape&lt;/span&gt; is not just the view, but territory &lt;em&gt;as it is perceived&lt;/em&gt; by the people who inhabit it. Pollution and mobility are global challenges that are “seen” and experienced in the local landscape: this is where the &lt;span class=&quot;en&quot;&gt;multiscale&lt;/span&gt; perspective of section 3 becomes a working tool.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Course bibliography &lt;span class=&quot;src&quot;&gt;slide 3–4&lt;/span&gt;&lt;/h3&gt;
  &lt;ul class=&quot;clean col&quot;&gt;
    &lt;li&gt;&lt;i&gt;Handbook on the Geopolitics of Sustainability&lt;/i&gt;, edited by Björn-Ola Linnér, Therese Bennich and Henrik Carlsen (Edward Elgar, open access, CC BY-NC-ND 4.0 licence). Keywords: &lt;span class=&quot;en&quot;&gt;geopolitics, sustainability transformations, governance, system analysis, complexity, security, environmental change&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;Michel Lussault, &lt;i&gt;Inhabiting the world&lt;/i&gt; (online text on pca-stream.com).&lt;/li&gt;
    &lt;li&gt;Ramos-Mejía, Franco-Garcia, Jauregui-Becker, &lt;i&gt;Sustainability transitions in the developing world: Challenges of socio-technical transformations unfolding in contexts of poverty&lt;/i&gt; (University of Twente, open access).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;col small muted&quot;&gt;Summaries, bibliographic details and verified links for each text are in &lt;a href=&quot;#refs&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · the course&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;What is a &lt;span class=&quot;en&quot;&gt;territorial patch&lt;/span&gt; and what is it used for in the group work?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;It is a portion of territory used as a laboratory (&lt;span class=&quot;en&quot;&gt;territorial lab&lt;/span&gt;) to discover how global challenges (environmental, social, economic-productive, governance) connect to that place, i.e. the global/local connections, and to propose ways of addressing them.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What are the three criteria of the written exam?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;1) general knowledge of the topics; 2) correct elaboration of concepts; 3) critical approach. The written exam accounts for 50% of the final grade, the project work for the other 50%.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What does it mean to read “multiscale-intersectional” connections?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Following a problem across several scales (local, urban, regional, global) and cutting across several dimensions (environmental, social, economic, governance), instead of looking at only one.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part hue&quot; style=&quot;--h:150&quot; aria-labelledby=&quot;s2-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Geography&lt;/div&gt;&lt;h2 id=&quot;s2-t&quot;&gt;Geography as the science of the territory–society relationship&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;What contemporary geography studies &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 420 330&quot; aria-label=&quot;Diagram: geography analyses the reciprocal relationship between territory and society&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-t&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;46&quot; rx=&quot;23&quot; class=&quot;f-acc&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-paper&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; letter-spacing=&quot;1&quot;&gt;GEOGRAPHY&lt;/text&gt;
        &lt;line x1=&quot;100&quot; y1=&quot;68&quot; x2=&quot;100&quot; y2=&quot;118&quot; class=&quot;s-t&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;science for analysing&lt;/text&gt;
        &lt;path d=&quot;M185 140 C 215 140, 225 120, 245 108&quot; fill=&quot;none&quot; class=&quot;s-muted&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;rect x=&quot;240&quot; y=&quot;70&quot; width=&quot;160&quot; height=&quot;50&quot; rx=&quot;25&quot; class=&quot;f-t&quot;/&gt;
        &lt;text x=&quot;320&quot; y=&quot;101&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-paper&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; letter-spacing=&quot;1&quot;&gt;TERRITORY&lt;/text&gt;
        &lt;rect x=&quot;240&quot; y=&quot;210&quot; width=&quot;160&quot; height=&quot;50&quot; rx=&quot;25&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;text x=&quot;320&quot; y=&quot;241&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; letter-spacing=&quot;1&quot;&gt;SOCIETY&lt;/text&gt;
        &lt;path d=&quot;M290 125 C 270 150, 270 180, 290 205&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;path d=&quot;M350 205 C 370 180, 370 150, 350 125&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
        &lt;text x=&quot;262&quot; y=&quot;170&quot; text-anchor=&quot;end&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;conditions,&lt;/text&gt;
        &lt;text x=&quot;262&quot; y=&quot;184&quot; text-anchor=&quot;end&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;provides resources&lt;/text&gt;
        &lt;text x=&quot;378&quot; y=&quot;170&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;organizes,&lt;/text&gt;
        &lt;text x=&quot;378&quot; y=&quot;184&quot; class=&quot;sv f-muted&quot; font-size=&quot;11&quot;&gt;transforms&lt;/text&gt;
        &lt;rect x=&quot;20&quot; y=&quot;282&quot; width=&quot;380&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-tb&quot;/&gt;
        &lt;text x=&quot;210&quot; y=&quot;299&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;11&quot;&gt;FOCUS: critical approach to&lt;/text&gt;
        &lt;text x=&quot;210&quot; y=&quot;314&quot; text-anchor=&quot;middle&quot; class=&quot;sv f-ink&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;INHABITANTS / SPATIALITY – URBANITY&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Redrawn from &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;; the labels on the arrows are an added explanation.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;The slide sums up the discipline in a diagram: &lt;b&gt;geography&lt;/b&gt; is a &lt;span class=&quot;en&quot;&gt;science for analysing&lt;/span&gt; the relationship between &lt;b&gt;territory&lt;/b&gt; and &lt;b&gt;society&lt;/b&gt;. The double arrow indicates that the relationship runs both ways: societies transform space, and the space thus transformed in turn influences societies.&lt;/p&gt;
      &lt;p&gt;The &lt;b&gt;focus of contemporary geography&lt;/b&gt; is a &lt;dfn class=&quot;en&quot;&gt;critical approach&lt;/dfn&gt; (one that does not take categories for granted and asks who produces space and to whose advantage) to three key notions: &lt;span class=&quot;en&quot;&gt;inhabitants&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;spatiality&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Key terms&lt;/h3&gt;
  &lt;p class=&quot;col muted small&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; The slide names these concepts without defining them: here is how they are commonly used in human geography.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Territory&lt;small&gt;space appropriated by a society&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Not just any portion of the Earth&#x27;s surface, but space that has been &lt;em&gt;appropriated, organized and given meaning&lt;/em&gt; by a society: borders, infrastructure, land uses, place names, rules. A forest becomes territory when someone manages it, protects it, exploits it or tells its story.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Society&lt;small&gt;individuals, groups, institutions&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The set of individuals and groups, with their institutions, economies, cultures and power relations. What matters to the geographer is how society &lt;em&gt;organizes itself in space&lt;/em&gt;: where it lives, how it moves, how it uses and divides resources.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Inhabitants&lt;small&gt;people as actors of space&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;People seen as actors who &lt;em&gt;inhabit&lt;/em&gt; space, not just as a “population” to be counted. This idea is central to Michel Lussault, author of &lt;i&gt;Inhabiting the world&lt;/i&gt; in the bibliography: to inhabit means building one&#x27;s relationship with places day by day.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Spatiality&lt;small&gt;the spatial dimension of social facts&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The spatial dimension of every social fact: distances, positions, networks, accessibility, proximity. Every human action takes place somewhere, and the “where” changes its meaning and its effects.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary class=&quot;en&quot;&gt;Urbanity&lt;small&gt;density plus diversity&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The quality specific to the urban: the combination of &lt;em&gt;density&lt;/em&gt; (many people and things close together) and &lt;em&gt;diversity&lt;/em&gt; (many different functions, people and activities) that makes encounter and exchange possible. In this view urbanity is not a yes/no matter (city/countryside) but a continuum: places are more or less urban. It is the concept the course takes up with Jacques Lévy (topic 6, &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · geography&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Why is the arrow between &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;society&lt;/span&gt; in the slide a double one?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because the relationship is reciprocal: society organizes and transforms territory, and the territory thus produced conditions society (resources, constraints, opportunities). Geography studies precisely this interaction.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What is the difference between “space” and &lt;span class=&quot;en&quot;&gt;territory&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Territory is space appropriated, organized and charged with meaning by a society; space as such is a more general and abstract category.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;To which three elements does contemporary geography apply a &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Inhabitants, spatiality and urbanity.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part hue&quot; style=&quot;--h:85&quot; aria-labelledby=&quot;s3-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Brainstorming&lt;/div&gt;&lt;h2 id=&quot;s3-t&quot;&gt;Challenges / World / in Transition: unpacking the title&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;The three words of the course title, one at a time &lt;span class=&quot;src&quot;&gt;slide 8–11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;The lecture opens with a brainstorming session on the course title, broken down into three words: &lt;span class=&quot;en&quot;&gt;Challenges&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;in Transition&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;. This section deals with the first and the third; the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; has a section of its own (section 4).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Challenges: four challenges that lead to urbanity &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 400 300&quot; aria-label=&quot;The four challenges converge on urbanity&quot;&gt;
        &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-t&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
        &lt;g class=&quot;sv&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;65&quot; class=&quot;f-ink&quot;&gt;Environmental&lt;/text&gt;
          &lt;circle cx=&quot;320&quot; cy=&quot;60&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;65&quot; class=&quot;f-ink&quot;&gt;Social&lt;/text&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;240&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;245&quot; class=&quot;f-ink&quot;&gt;Economic&lt;/text&gt;
          &lt;circle cx=&quot;320&quot; cy=&quot;240&quot; r=&quot;50&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;245&quot; class=&quot;f-ink&quot;&gt;Governance&lt;/text&gt;
          &lt;g class=&quot;s-t&quot; stroke-width=&quot;2.2&quot;&gt;&lt;line x1=&quot;122&quot; y1=&quot;88&quot; x2=&quot;160&quot; y2=&quot;118&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;278&quot; y1=&quot;88&quot; x2=&quot;240&quot; y2=&quot;118&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;122&quot; y1=&quot;212&quot; x2=&quot;160&quot; y2=&quot;182&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;line x1=&quot;278&quot; y1=&quot;212&quot; x2=&quot;240&quot; y2=&quot;182&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;/g&gt;
          &lt;circle cx=&quot;200&quot; cy=&quot;150&quot; r=&quot;46&quot; class=&quot;f-acc&quot;/&gt;
          &lt;text x=&quot;200&quot; y=&quot;155&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; letter-spacing=&quot;1&quot;&gt;URBANITY&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;The challenges of a world in transition are of four kinds, and the slide makes them all converge on a single word followed by three exclamation marks: &lt;b&gt;URBANITY&lt;/b&gt;. The message is that today challenges are concentrated, produced and addressed mainly in urban spaces, because that is where most of humanity lives and acts (see the data in section 5).&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;In topic 7 of the syllabus the same categories return as &lt;span class=&quot;en&quot;&gt;vulnerabilities&lt;/span&gt;, with the addition of the &lt;span class=&quot;en&quot;&gt;digital&lt;/span&gt; one &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid3&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Environmental&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Climate, resources, biodiversity, pollution. Example: urban heat islands and air quality in cities.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Social&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Inequalities, inclusion, access to housing and services, migration. Example: segregated neighbourhoods.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Economic&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Production, labour, global value chains, crises. Example: the deindustrialization of an area.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4 class=&quot;en&quot;&gt;Governance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Who decides and how: institutions, participation, coordination across levels (municipality, State, EU, UN).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; The examples on the cards have been added for orientation; the slide only lists the four categories.&lt;/p&gt;

  &lt;h3&gt;In transition: five interpretive keys &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;“In transition” does not simply mean “changing”: the slide sets out &lt;b&gt;five ways of looking at change&lt;/b&gt;, which are also the method of the course.&lt;/p&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Spatio-temporal perspective&lt;/span&gt;&lt;small&gt;reading space and time together&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Space and time must be read together: every place is the outcome of a history, and every historical process unfolds in specific places. Today&#x27;s industrial periphery can only be understood by reconstructing how and when it came into being.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Human–non human relations&lt;/span&gt;&lt;small&gt;people, other living beings, things&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The world is not made of people alone: animals, plants, water, soils, climate, but also technologies and infrastructure take part in the making of space. It is the same idea found in the definition of &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt; in section 4: land that gives life to &lt;span class=&quot;en&quot;&gt;human and non human beings&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Dynamic evolution&lt;/span&gt;&lt;small&gt;open, non-linear processes&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Transitions are not linear shifts from A to B: they are open processes, with accelerations, reversals and unintended effects.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Multiscale perspective&lt;/span&gt;&lt;small&gt;from the home to the World&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The same phenomenon looks different at different scales, and scales influence one another. Try the slider below.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;&lt;span class=&quot;en&quot;&gt;Systemic approach&lt;/span&gt;&lt;small&gt;relations rather than isolated elements&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The focus is on the whole set of relations, not on isolated elements: a change in one part of the system (for example mobility) affects the others (air, health, economy, inequalities). It paves the way for the concept of the &lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt; in section 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; The explanations of the five keys have been added: the slide only lists them.&lt;/p&gt;

  &lt;h3&gt;Workshop: the &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; applied to the group work&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
      &lt;svg id=&quot;scaleSvg&quot; viewBox=&quot;0 0 260 260&quot; aria-hidden=&quot;true&quot; style=&quot;max-width:260px;margin:0 auto&quot;&gt;
        &lt;circle data-i=&quot;4&quot; cx=&quot;130&quot; cy=&quot;130&quot; r=&quot;122&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;3&quot; cx=&quot;130&quot; cy=&quot;140&quot; r=&quot;96&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;2&quot; cx=&quot;130&quot; cy=&quot;150&quot; r=&quot;70&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;1&quot; cx=&quot;130&quot; cy=&quot;160&quot; r=&quot;45&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;circle data-i=&quot;0&quot; cx=&quot;130&quot; cy=&quot;170&quot; r=&quot;20&quot; class=&quot;f-t s-t&quot;/&gt;
        &lt;g class=&quot;sv f-ink&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;130&quot; y=&quot;22&quot;&gt;World&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;58&quot;&gt;region · State · EU&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;94&quot;&gt;city&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;128&quot;&gt;patch&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;173&quot;&gt;home&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;label for=&quot;scaleR&quot; class=&quot;small muted&quot;&gt;Choose the scale&lt;/label&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;input type=&quot;range&quot; id=&quot;scaleR&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;&lt;/div&gt;
        &lt;h4 id=&quot;scaleT&quot; style=&quot;margin-top:.2rem&quot;&gt;&lt;/h4&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Pollution:&lt;/b&gt; &lt;span id=&quot;scaleP&quot;&gt;&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Mobility:&lt;/b&gt; &lt;span id=&quot;scaleM&quot;&gt;&lt;/span&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small muted&quot; style=&quot;margin:0&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; An exercise built on the two themes of point 5 of the group presentation (&lt;span class=&quot;en&quot;&gt;pollution and mobility&lt;/span&gt;, &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;): at each scale the actors, the data and the possible responses change.&lt;/p&gt;
  &lt;/div&gt;
  &lt;script type=&quot;application/json&quot; id=&quot;scaleData&quot;&gt;[[&quot;Body and home&quot;,&quot;the air breathed every day, the effects on health, household choices (heating, consumption).&quot;,&quot;how people get around every day: on foot, by bike, by bus, by car; how much time and effort it takes.&quot;],[&quot;Neighbourhood · territorial patch&quot;,&quot;traffic in a street, an air-quality monitoring station, a factory or a road junction close to homes; how inhabitants perceive the landscape.&quot;,&quot;stops, cycle lanes, car parks, barriers; who is well served and who is not; local actors (residents, shopkeepers, associations).&quot;],[&quot;City · urban area&quot;,&quot;heat islands, limited traffic zones, urban green spaces, municipal air-quality plans.&quot;,&quot;commuting, public transport, mobility plans; the relationship between the centre and the peripheries.&quot;],[&quot;Region · State · EU&quot;,&quot;air basins that extend beyond municipal boundaries (for example the Po Valley), national and European air-quality regulations.&quot;,&quot;rail and motorway networks, logistics, transport policies and EU funds.&quot;],[&quot;World&quot;,&quot;climate change, global emissions, pollutants travelling between continents.&quot;,&quot;global flows of goods, people and tourists; aviation and shipping; worldwide logistics chains.&quot;]]&lt;/script&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · challenges and transition&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;What are the four types of &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt;, and towards which concept do they converge?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Environmental, social, economic, governance. They converge on &lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt;, because challenges are concentrated in the urbanized spaces where most of humanity lives and acts.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;List the five interpretive keys of “in transition”.
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Spatio-temporal perspective, human–non human relations, dynamic evolution, multiscale perspective, systemic approach.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Give an example of the &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; applied to mobility.
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;A new tram line changes the daily journeys of residents (local scale), depends on municipal plans and national or European funding (intermediate scales) and affects global emissions (world scale). Decisions taken at one scale have effects on the others.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part hue&quot; style=&quot;--h:25&quot; aria-labelledby=&quot;s4-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;World&lt;/div&gt;&lt;h2 id=&quot;s4-t&quot;&gt;Earth, Planet, Globe, World: four words, four objects&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;The conceptual core of the lecture &lt;span class=&quot;src&quot;&gt;slide 9, 12–17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;In everyday language the four words seem to be synonyms. In geography they denote &lt;b&gt;four different objects&lt;/b&gt;, and confusing them is precisely the error in the “elaboration of concepts” that the exam assesses. Open the tabs.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Earth, Planet, Globe, World&quot;&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-e&quot; aria-controls=&quot;tp-e&quot; aria-selected=&quot;true&quot;&gt;Earth&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-p&quot; aria-controls=&quot;tp-p&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Planet&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-g&quot; aria-controls=&quot;tp-g&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;Globe&lt;/button&gt;
    &lt;button role=&quot;tab&quot; id=&quot;tb-w&quot; aria-controls=&quot;tp-w&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;World&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-e&quot; aria-labelledby=&quot;tb-e&quot;&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;path d=&quot;M20 110 Q45 70 70 92 T120 80 L130 125 L20 125Z&quot; class=&quot;f-t&quot; opacity=&quot;.75&quot;/&gt;&lt;path d=&quot;M75 92 q5 -25 22 -32 q-4 18 -22 32z&quot; class=&quot;f-t&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;96&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;105&quot; cy=&quot;104&quot; r=&quot;4&quot; class=&quot;f-ink&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition from the slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;Earth&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;extension of land which gives life to human and non human beings&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;This is the Earth as &lt;b&gt;living ground&lt;/b&gt;, a physical and biological environment: landforms, waters, soils, ecosystems. It links back to the &lt;span class=&quot;en&quot;&gt;human–non human relations&lt;/span&gt; key in section 3. The slide illustrates it with a physical relief map of the world.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-p&quot; aria-labelledby=&quot;tb-p&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;30&quot; cy=&quot;75&quot; r=&quot;16&quot; class=&quot;f-acc&quot;/&gt;&lt;ellipse cx=&quot;75&quot; cy=&quot;75&quot; rx=&quot;60&quot; ry=&quot;22&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;circle cx=&quot;118&quot; cy=&quot;62&quot; r=&quot;9&quot; class=&quot;f-t&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition from the slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;«The Planet»&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;celestial body which orbits around a star&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;This is the Earth as seen by &lt;b&gt;astronomy&lt;/b&gt;: one of the planets of the solar system, defined by its orbit around the Sun and not by who inhabits it. The quotation marks on the slide («The Planet») are a reminder that in public discourse “the Planet” is often used in an environmental sense (“save the Planet”), whereas strictly speaking it is an astronomical category.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-g&quot; aria-labelledby=&quot;tb-g&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;65&quot; r=&quot;40&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M35 65h80M75 25v80M45 42q30 10 60 0M45 88q30 -10 60 0&quot; fill=&quot;none&quot; class=&quot;s-t&quot; stroke-width=&quot;1&quot;/&gt;&lt;path d=&quot;M75 105v18M55 125h40&quot; class=&quot;s-ink&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M28 65a47 47 0 0 0 94 0&quot; fill=&quot;none&quot; class=&quot;s-ink&quot; stroke-width=&quot;2&quot;/&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition from the slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;The Globe&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;reproduction/representation of the Earth/Planet&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;This is a &lt;b&gt;cultural artefact&lt;/b&gt;: a model that represents the Earth and therefore always embodies choices (what to show, with which names, from which point of view). The slide&#x27;s example comes from Bergamo: the &lt;b&gt;terrestrial globe by Vincenzo Maria Coronelli (1688)&lt;/b&gt;, held at the Angelo Mai Library in Piazza Vecchia.&lt;/p&gt;
        &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;The Biblioteca Civica Angelo Mai holds a pair of large Coronelli globes (one terrestrial and one celestial). They arrived in Bergamo in 1692, purchased in Venice by the friar Angelo Finardi, and have been in the library since 1834. They are on display in the entrance hall, and in 2016 an exhibition (“L&#x27;immagine del mondo”, “The image of the world”) presented the restored terrestrial globe. Sources: &lt;a href=&quot;https://www.bibliotecamai.org/wp-content/uploads/2012/10/PANNELLI-MOSTRA-GLOBI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;exhibition panels, Biblioteca Mai&lt;/a&gt;; &lt;a href=&quot;https://en.wikipedia.org/wiki/Vincenzo_Coronelli&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Vincenzo Coronelli&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; id=&quot;tp-w&quot; aria-labelledby=&quot;tb-w&quot; hidden&gt;
    &lt;div class=&quot;tp-grid&quot;&gt;
      &lt;svg viewBox=&quot;0 0 150 150&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;140&quot; height=&quot;140&quot; rx=&quot;20&quot; class=&quot;f-tb&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;75&quot; r=&quot;48&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;2&quot;/&gt;&lt;g class=&quot;s-acc&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M48 60Q75 30 104 58&quot;/&gt;&lt;path d=&quot;M48 60Q70 100 100 96&quot;/&gt;&lt;path d=&quot;M104 58Q90 80 100 96&quot;/&gt;&lt;path d=&quot;M48 60L75 78L104 58M75 78L100 96&quot;/&gt;&lt;/g&gt;&lt;g class=&quot;f-acc&quot;&gt;&lt;circle cx=&quot;48&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;58&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;96&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;75&quot; cy=&quot;78&quot; r=&quot;4&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;
      &lt;div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition from the slide&lt;/span&gt;&lt;p&gt;&lt;b&gt;The World&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;socially constructed social space at the global scale shaped by human activities&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;. In its extended form: &lt;i&gt;“It&#x27;s not the Planet, it&#x27;s not the earth, but a (socially) constructed social-space at the global scale, historically shaped by human activities”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;p&gt;Every word of the definition matters:&lt;/p&gt;
        &lt;ul class=&quot;clean&quot;&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;socially constructed&lt;/span&gt;&lt;/b&gt;: the World is not a natural given; it is produced by societies (relations, exchanges, institutions, imaginaries);&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;social space&lt;/span&gt;&lt;/b&gt;: it is a space of relations between people and groups;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;at the global scale&lt;/span&gt;&lt;/b&gt;: it is the widest scale of these relations, the one at which the whole planet is interconnected;&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;&lt;span class=&quot;en&quot;&gt;historically shaped&lt;/span&gt;&lt;/b&gt;: it has a history, i.e. it came into being and changes over time (trade, empires, the Industrial Revolution, globalization).&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p&gt;The image is &lt;b&gt;&lt;span class=&quot;en&quot;&gt;Earthrise&lt;/span&gt;&lt;/b&gt;: the &lt;span class=&quot;en&quot;&gt;first picture of the Earth from Apollo 8&lt;/span&gt;, 1968 &lt;span class=&quot;src&quot;&gt;slide 12, 16&lt;/span&gt;. Seeing the whole Earth from outside made a single common home visible: an icon of the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; as a shared idea.&lt;/p&gt;
        &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;p style=&quot;margin-top:.5rem&quot;&gt;The photograph was taken by astronaut William Anders on 24 December 1968, during Apollo 8&#x27;s lunar orbit, and is regarded as one of the catalysts of the environmental movement. Source: &lt;a href=&quot;https://www.space.com/earthrise-christmas-eve-image-that-changed-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Space.com&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;From natural given to social construction&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; aria-label=&quot;Axis: Planet and Earth as natural givens, Globe as representation, World as social construction&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;gax&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; style=&quot;stop-color:var(--rule)&quot;/&gt;&lt;stop offset=&quot;1&quot; style=&quot;stop-color:var(--accent)&quot;/&gt;&lt;/linearGradient&gt;
      &lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-acc&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;95&quot; x2=&quot;860&quot; y2=&quot;95&quot; stroke=&quot;url(#gax)&quot; stroke-width=&quot;5&quot; marker-end=&quot;url(#ar4)&quot;/&gt;
      &lt;g class=&quot;sv&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;text x=&quot;40&quot; y=&quot;150&quot; text-anchor=&quot;start&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;natural given&lt;/text&gt;
        &lt;text x=&quot;860&quot; y=&quot;150&quot; text-anchor=&quot;end&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;social construction&lt;/text&gt;
        &lt;circle cx=&quot;130&quot; cy=&quot;95&quot; r=&quot;12&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;62&quot; class=&quot;f-ink&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Planet&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;128&quot; class=&quot;f-muted&quot; font-size=&quot;11.5&quot;&gt;astronomy&lt;/text&gt;
        &lt;circle cx=&quot;340&quot; cy=&quot;95&quot; r=&quot;12&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;62&quot; class=&quot;f-ink&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Earth&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;128&quot; class=&quot;f-muted&quot; font-size=&quot;11.5&quot;&gt;living environment&lt;/text&gt;
        &lt;circle cx=&quot;560&quot; cy=&quot;95&quot; r=&quot;12&quot; class=&quot;f-card s-t&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;62&quot; class=&quot;f-ink&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Globe&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;128&quot; class=&quot;f-muted&quot; font-size=&quot;11.5&quot;&gt;representation&lt;/text&gt;
        &lt;circle cx=&quot;770&quot; cy=&quot;95&quot; r=&quot;14&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;770&quot; y=&quot;62&quot; class=&quot;f-ink&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;World&lt;/text&gt;&lt;text x=&quot;770&quot; y=&quot;128&quot; class=&quot;f-muted&quot; font-size=&quot;11.5&quot;&gt;global social space&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; Interpretive diagram: it orders the four definitions in the slides from the most “natural” to the most “social”.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;th&gt;Who studies it&lt;/th&gt;&lt;th&gt;Example in the slides&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Earth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;land that gives life to human and non-human beings&lt;/td&gt;&lt;td&gt;Earth sciences, ecology, physical geography&lt;/td&gt;&lt;td&gt;physical map of the world&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Planet&lt;/b&gt;&lt;/td&gt;&lt;td&gt;celestial body orbiting a star&lt;/td&gt;&lt;td&gt;astronomy&lt;/td&gt;&lt;td&gt;solar system&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Globe&lt;/b&gt;&lt;/td&gt;&lt;td&gt;representation of the Earth or the planet&lt;/td&gt;&lt;td&gt;cartography, history&lt;/td&gt;&lt;td&gt;Coronelli&#x27;s globe, 1688&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;World&lt;/b&gt;&lt;/td&gt;&lt;td&gt;historically constructed global social space&lt;/td&gt;&lt;td&gt;human geography, social sciences&lt;/td&gt;&lt;td&gt;Earthrise, 1968&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · World&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Define the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; in the geographical sense, and explain why it does not coincide with &lt;span class=&quot;en&quot;&gt;Planet&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt;.
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;It is a social space at the global scale, socially constructed and historically shaped by human activities. The Planet is a celestial body defined by its orbit; the Earth is the living land that sustains human and non-human beings. Both would exist even without human societies; the World would not.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Why is Coronelli&#x27;s globe an example of a &lt;span class=&quot;en&quot;&gt;Globe&lt;/span&gt; and not of the &lt;span class=&quot;en&quot;&gt;Earth&lt;/span&gt;?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because it is a representation built by a cartographer in 1688, with the knowledge and choices of his time: it represents the Earth, it is not the Earth.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What does &lt;span class=&quot;en&quot;&gt;historically shaped&lt;/span&gt; mean in the definition of the World?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;That the World changes over time through human activities (trade, colonization, industrialization, urbanization, digital networks): it is not given once and for all.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part hue&quot; style=&quot;--h:35&quot; aria-labelledby=&quot;s5-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Globalization = urbanization&lt;/div&gt;&lt;h2 id=&quot;s5-t&quot;&gt;A world becoming urban&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Data, &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; and traits of urban &lt;span class=&quot;en&quot;&gt;life-forms&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 17–20&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;blockquote&gt;Globalization = urbanization&lt;footer&gt;&lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
    &lt;p&gt;Right after defining the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;, the slide sets out a strong equation: &lt;b&gt;globalizing and urbanizing are the same process&lt;/b&gt;. &lt;dfn class=&quot;en&quot;&gt;Globalization&lt;/dfn&gt; (the growing integration of economies, societies and cultures at the world scale) takes place through cities and their networks; and the World, as a global social space, increasingly takes the form of an urban space.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The figures &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/h3&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What the data show&lt;/h4&gt;
      &lt;ul class=&quot;clean small&quot;&gt;
        &lt;li&gt;From 1900 to 2017 the world population grows fivefold (from 1.5 to 7.5 billion), while the urban population grows &lt;b&gt;eighteenfold&lt;/b&gt; (from 220 million to 4 billion).&lt;/li&gt;
        &lt;li&gt;The urban share rises from about &lt;b&gt;15%&lt;/b&gt; (1900) to &lt;b&gt;53%&lt;/b&gt; (2017): the symbolic threshold of one half is crossed between 2000 and 2017.&lt;/li&gt;
        &lt;li&gt;By 2050, about &lt;b&gt;7 in 10 people&lt;/b&gt; are expected to live in urban areas (6.7 out of 9.6 billion).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small muted&quot;&gt;The percentages are calculated from the values in &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;
      &lt;p class=&quot;small&quot; style=&quot;margin-top:.5rem&quot;&gt;The UN report &lt;i&gt;World Urbanization Prospects 2025&lt;/i&gt; (November 2025) uses a new method, the &lt;span class=&quot;en&quot;&gt;Degree of Urbanization&lt;/span&gt;, which distinguishes &lt;b&gt;cities&lt;/b&gt;, &lt;b&gt;towns&lt;/b&gt; and rural areas: cities are home to &lt;b&gt;45%&lt;/b&gt; of the 8.2 billion people, &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt; to 36% and rural areas to 19%. Megacities (more than 10 million inhabitants) have risen from 8 in 1975 to 33 in 2025.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; “how urban the world is” depends on how the urban is defined. It is a good example of a &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt;: numbers must always be read together with their definitions.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Source: &lt;a href=&quot;https://www.un.org/sustainabledevelopment/blog/2025/11/press-release-wup2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN, WUP 2025 press release&lt;/a&gt;; &lt;a href=&quot;https://www.un.org/development/desa/pd/node/4442&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, Summary of Results&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Planetary urbanization&lt;/span&gt;: not just demography &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;&lt;dfn class=&quot;en&quot;&gt;Planetary urbanization&lt;/dfn&gt; (the extension of the urban to the entire planet) &lt;b&gt;is not only a demographic phenomenon&lt;/b&gt;: counting how many people live in cities is not enough. The slide offers two interpretive keys.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;1 · A «revolution»&lt;/h4&gt;&lt;p&gt;Urbanization is a kind of &lt;b&gt;revolution&lt;/b&gt;: &lt;span class=&quot;en&quot;&gt;a complete shift in the social organization and cultures&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Reference: Henri Lefebvre, &lt;i&gt;La révolution urbaine&lt;/i&gt;, Paris, Gallimard (Italian translation &lt;i&gt;La rivoluzione urbana&lt;/i&gt;, Armando, 1973). The slide gives 1971; the first French edition appears to date from 1970 (see &lt;a href=&quot;#refs&quot;&gt;Further reading&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;2 · A «widespread diffusion»&lt;/h4&gt;&lt;p&gt;Urbanization is the &lt;b&gt;pervasive spread&lt;/b&gt; of &lt;span class=&quot;en&quot;&gt;urban spatial patterns&lt;/span&gt; and of &lt;span class=&quot;en&quot;&gt;urban «life-forms»&lt;/span&gt;, all of which share a &lt;b&gt;«family trait»&lt;/b&gt;, a family resemblance, &lt;span class=&quot;en&quot;&gt;whatever the context&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; aria-label=&quot;Three levels of urbanization: demographic, spatial, life-forms&quot;&gt;
      &lt;g class=&quot;sv&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;130&quot; width=&quot;860&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-rule&quot;/&gt;
        &lt;text x=&quot;40&quot; y=&quot;153&quot; class=&quot;f-ink&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Demographic level&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;172&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;more people live in urban areas (slide 18)&lt;/text&gt;
        &lt;rect x=&quot;80&quot; y=&quot;70&quot; width=&quot;740&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-tb s-t&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;93&quot; class=&quot;f-ink&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Urban spatial patterns&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;112&quot; class=&quot;f-muted&quot; font-size=&quot;12&quot;&gt;urban spatial forms everywhere: networks, infrastructure, shopping centres, sprawling peripheries&lt;/text&gt;
        &lt;rect x=&quot;140&quot; y=&quot;10&quot; width=&quot;620&quot; height=&quot;54&quot; rx=&quot;10&quot; class=&quot;f-t&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;33&quot; class=&quot;f-paper&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot;&gt;Urban «life-forms»&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;52&quot; class=&quot;f-paper&quot; font-size=&quot;12&quot;&gt;urban ways of life with a «family trait», even far from cities&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; Interpretive diagram: &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; goes beyond the demographic data (the base) and affects the forms of space and ways of life. This is why one can be “urban” even in a mountain village connected to the internet.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The major traits of urban &lt;span class=&quot;en&quot;&gt;life-forms&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;The slide lists seven &lt;span class=&quot;en&quot;&gt;major traits&lt;/span&gt; that shape urban spatial forms and ways of life. Open each trait for an explanation and an example.&lt;/p&gt;
  &lt;p class=&quot;col small muted&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; Explanations and examples have been added: the slide only gives the list.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;1 · &lt;span class=&quot;en&quot;&gt;Individualization / Anonymity&lt;/span&gt;&lt;small&gt;weaker community ties, anonymity among strangers&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In the city the individual is less bound to traditional communities (extended family, village) and chooses their own ties more freely; the other side of the coin is anonymity among strangers. Example: living for years in a block of flats without knowing the neighbours.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;2 · &lt;span class=&quot;en&quot;&gt;Illimitation&lt;/span&gt;&lt;small&gt;absence of limits&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The urban tends to have no clear boundaries: the city expands, spreads into the countryside, extends into networks with no “outside”. Example: &lt;span class=&quot;en&quot;&gt;urban sprawl&lt;/span&gt; along roads and motorways.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;3 · &lt;span class=&quot;en&quot;&gt;«Mobilization»&lt;/span&gt;&lt;small&gt;everything is on the move&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Everything is on the move&lt;/span&gt;: people, goods, capital, information, waste. Mobility becomes a normal condition of life. Example: daily commuting, mass tourism, logistics.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;4 · &lt;span class=&quot;en&quot;&gt;Place consumption (iper-places)&lt;/span&gt;&lt;small&gt;consumption of places, hyper-places&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Places themselves become objects of consumption, and &lt;span class=&quot;en&quot;&gt;hyper-places&lt;/span&gt; emerge: highly connected and highly frequented spaces that concentrate global functions and flows. Example: airports, major railway stations, shopping centres, iconic tourist squares.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;5 · &lt;span class=&quot;en&quot;&gt;Digitalization&lt;/span&gt;&lt;small&gt;urban practices via digital platforms&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Urban practices are mediated by digital platforms: finding one&#x27;s way, getting around, shopping, working, meeting people. Example: mobility apps, home deliveries, remote working. It underlies the &lt;span class=&quot;en&quot;&gt;digital&lt;/span&gt; vulnerability of topic 7.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;6 · &lt;span class=&quot;en&quot;&gt;Connexions (hyperspatiality)&lt;/span&gt;&lt;small&gt;connections, hyperspatiality&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Spaces are linked by networks that bring the distant close: lived space combines physical places and connections at a distance (hyperspatiality). Example: working in Bergamo with a team on another continent, in real time.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;fold&quot;&gt;&lt;summary&gt;7 · &lt;span class=&quot;en&quot;&gt;Standardization and «Normation»&lt;/span&gt;&lt;small&gt;uniform models and norms&lt;/small&gt;&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Forms, services and behaviours become uniform, following similar models and norms everywhere: this is the &lt;span class=&quot;en&quot;&gt;«family trait»&lt;/span&gt;. Example: the same kinds of chain stores, shopping centres and residential neighbourhoods in cities very far apart.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;The terms &lt;span class=&quot;en&quot;&gt;hyper-places&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;hyperspatiality&lt;/span&gt; are associated with the work of the French geographer Michel Lussault, an author in the bibliography (he wrote a book on &lt;span class=&quot;en&quot;&gt;hyper-lieux&lt;/span&gt; in 2017). This is not stated in the slides: check in class whether the lecturer refers to him.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · urbanization&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;Why is &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt; said to be “not only a demographic phenomenon”?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because, beyond the growth of the urban population, it involves a complete shift in social organization and cultures (Lefebvre&#x27;s “urban revolution”) and the spread everywhere of urban spatial forms and ways of life sharing a common family resemblance.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Using the data in the slide, by how much does the urban share of the population grow between 1900 and 2017?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;From about 15% (0.22 out of 1.5 billion) to about 53% (4 out of 7.5 billion). In absolute terms the urban population becomes about 18 times larger.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What does it mean that &lt;span class=&quot;en&quot;&gt;urban life-forms&lt;/span&gt; have a &lt;span class=&quot;en&quot;&gt;«family trait»&lt;/span&gt;? Name at least three traits.
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;That they resemble one another in very different contexts. Traits: individualization/anonymity, illimitation, mobilization, place consumption (iper-places), digitalization, connexions (hyperspatiality), standardization and normation.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Why can the same world turn out to be 53% or 45% urban?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because estimates depend on the definition of “urban” and on the year. The UN&#x27;s WUP 2025 (external source) counts 45% in &lt;span class=&quot;en&quot;&gt;cities&lt;/span&gt; and a further 36% in &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt;: change the method and the number changes.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part hue&quot; style=&quot;--h:150&quot; aria-labelledby=&quot;s6-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Global environmental change&lt;/div&gt;&lt;h2 id=&quot;s6-t&quot;&gt;The urbanized world and the Anthropocene&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;The great challenge, the birth of a concept and the reading of Crutzen and Stoermer&#x27;s text &lt;span class=&quot;src&quot;&gt;slide 21–23&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;The urbanized world is facing &lt;i&gt;“right now an impressive challenge”&lt;/i&gt;: &lt;dfn class=&quot;en&quot;&gt;global environmental change&lt;/dfn&gt;, caused by the impacts of human activities on the &lt;dfn class=&quot;en&quot;&gt;earth system&lt;/dfn&gt;, that is, the Earth understood as a single system of interacting parts (atmosphere, oceans, soils, ice, living beings and societies) &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The four components of change&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;i&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Global warming&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Global warming &lt;b&gt;and its multiscalar effects&lt;/b&gt;: a planetary phenomenon that manifests itself differently at each scale (urban heatwaves, regional droughts, sea-level rise).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;ii&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Depletion of resources&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The depletion of &lt;b&gt;non-renewable and even renewable&lt;/b&gt; resources: water, fertile soils or fish stocks also run out if they are extracted faster than they regenerate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;iii&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Biodiversity loss&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The &lt;b&gt;rapid reduction of biodiversity&lt;/b&gt; on a global scale, i.e. of the variety of species, genes and ecosystems.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;&lt;span class=&quot;pill&quot;&gt;iv&lt;/span&gt; &lt;span class=&quot;en&quot;&gt;Metabolism of biotic systems&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;An &lt;b&gt;unprecedented modification of the metabolism of biotic systems&lt;/b&gt; (soils, oceans, waters), caused by the first three phenomena and by pollutants, including synthetic chemical molecules.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt; “Metabolism” here refers to the cycles of matter and energy through which soils, waters and oceans function: carbon, nitrogen, nutrients. When these cycles change, the functioning of the whole system changes.&lt;/p&gt;

  &lt;blockquote&gt;«The human imprint on the global environment has now become so large and active that it rivals some of the great forces of Nature in its impact on the functioning of the Earth system»
    &lt;footer&gt;Will Steffen, Jacques Grinevald, Paul Crutzen, John McNeill, “The Anthropocene: conceptual and historical perspectives”, &lt;i&gt;Philosophical Transactions of the Royal Society A&lt;/i&gt;, vol. 369, 2011, pp. 842–867 &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;col box&quot;&gt;&lt;span class=&quot;k&quot;&gt;Definition&lt;/span&gt;&lt;p&gt;&lt;dfn class=&quot;en&quot;&gt;Anthropocene&lt;/dfn&gt; (from the Greek &lt;i&gt;anthropos&lt;/i&gt;, “human being”): the name proposed for the current geological epoch, in which humankind has become a force capable of altering the functioning of the Earth on a par with the great natural forces. It is contrasted with the &lt;span class=&quot;en&quot;&gt;Holocene&lt;/span&gt; (“entirely recent”), the post-glacial epoch of the last 10,000–12,000 years &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Reading and discussing: Crutzen and Stoermer&#x27;s figures &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;col&quot;&gt;The lecture ends with a reading of the text that launched the term (Crutzen and Stoermer, 2000). Here is the main evidence of the human imprint that it lists.&lt;/p&gt;
  &lt;figure class=&quot;panel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 800 290&quot; aria-label=&quot;Bar chart: indicators of human impact according to Crutzen and Stoermer&quot;&gt;

        &lt;g class=&quot;s-rule&quot;&gt;&lt;line x1=&quot;300&quot; y1=&quot;10&quot; x2=&quot;300&quot; y2=&quot;262&quot;/&gt;&lt;line x1=&quot;530&quot; y1=&quot;10&quot; x2=&quot;530&quot; y2=&quot;262&quot; stroke-dasharray=&quot;3 4&quot;/&gt;&lt;line x1=&quot;760&quot; y1=&quot;10&quot; x2=&quot;760&quot; y2=&quot;262&quot; stroke-dasharray=&quot;3 4&quot;/&gt;&lt;/g&gt;

        &lt;text x=&quot;290&quot; y=&quot;118&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Mangroves lost worldwide&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;104&quot; width=&quot;230&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-t&quot;/&gt;&lt;text x=&quot;538&quot; y=&quot;120&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;50%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;160&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Increase in atmospheric CO₂&lt;/text&gt;
        &lt;rect x=&quot;300&quot; y=&quot;146&quot; width=&quot;138&quot; height=&quot;22&quot; rx=&quot;4&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;446&quot; y=&quot;162&quot; class=&quot;f-ink&quot; font-weight=&quot;600&quot;&gt;&amp;gt; 30%&lt;/text&gt;
        &lt;text x=&quot;290&quot; y=&quot;202&quot; text-anchor=&quot;end&quot; class=&quot;f-ink&quot;&gt;Increase in CH₄ (methane)&lt;/text&gt;

        &lt;g class=&quot;f-muted&quot; font-size=&quot;10.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;300&quot; y=&quot;282&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;530&quot; y=&quot;282&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;282&quot;&gt;100%&lt;/text&gt;&lt;/g&gt;
