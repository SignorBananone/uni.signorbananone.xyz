  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;×10&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;human population over three centuries, reaching 6 billion; urbanization has increased tenfold in the past century&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;1.4 bn&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;head of cattle (roughly one cow per average-sized family)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;160 Tg/year&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;of SO₂ from coal and oil burning: at least twice the sum of all natural emissions&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;×1,000–10,000&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;rate of species extinction in tropical rainforests&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;N &amp;gt; N&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;more nitrogen fixed synthetically (fertilizers) than fixed naturally in all terrestrial ecosystems; NO emissions produce photochemical smog&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font:300 2rem var(--serif)&quot;&gt;50,000 years&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;during which the climate may depart significantly from its natural behaviour (study by Berger and Loutre)&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted col&quot;&gt;The text also mentions chlorofluorocarbons (CFCs), which caused the Antarctic “ozone hole” and would have destroyed much of the ozone layer had international regulations not halted their production &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;A history of the idea, step by step&lt;/h3&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 90&quot; aria-label=&quot;Timeline: choose a step&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;40&quot; x2=&quot;840&quot; y2=&quot;40&quot; class=&quot;s-t&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g class=&quot;sv f-muted&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1784&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;72&quot;&gt;1784&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1833&quot;&gt;&lt;circle cx=&quot;157.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;157.5&quot; y=&quot;72&quot;&gt;1833&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1864&quot;&gt;&lt;circle cx=&quot;255&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;255&quot; y=&quot;72&quot;&gt;1864&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1873&quot;&gt;&lt;circle cx=&quot;352.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;352.5&quot; y=&quot;72&quot;&gt;1873&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;1924-1926&quot;&gt;&lt;circle cx=&quot;450&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;72&quot;&gt;1924–26&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2000&quot;&gt;&lt;circle cx=&quot;547.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;547.5&quot; y=&quot;72&quot;&gt;2000&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2002&quot;&gt;&lt;circle cx=&quot;645&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;645&quot; y=&quot;72&quot;&gt;2002&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2004-2011&quot;&gt;&lt;circle cx=&quot;742.5&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;742.5&quot; y=&quot;72&quot;&gt;2004–11&lt;/text&gt;&lt;/g&gt;
        &lt;g class=&quot;tl-dot&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;2024&quot;&gt;&lt;circle cx=&quot;840&quot; cy=&quot;40&quot; r=&quot;5.5&quot;/&gt;&lt;text x=&quot;840&quot; y=&quot;72&quot;&gt;2024&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;div id=&quot;tlSteps&quot; style=&quot;min-height:11rem&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1784&lt;/div&gt;&lt;h4&gt;James Watt&#x27;s steam engine&lt;/h4&gt;&lt;p&gt;Crutzen and Stoermer propose dating the start of the Anthropocene to the &lt;b&gt;latter part of the eighteenth century&lt;/b&gt;: from that time onwards ice cores record the rise in CO₂ and CH₄, and the date coincides with Watt&#x27;s steam engine (1784). The authors admit that the choice is “somewhat arbitrary”: others propose different dates, even including the entire Holocene &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1833 · 1885&lt;/div&gt;&lt;h4&gt;Lyell and the Holocene&lt;/h4&gt;&lt;p&gt;The name &lt;span class=&quot;en&quot;&gt;Holocene&lt;/span&gt;, “entirely recent”, for the post-glacial epoch of the last 10,000–12,000 years was proposed by Sir Charles Lyell in 1833 and adopted by the International Geological Congress in Bologna in 1885. It is the geological “frame” from which the Anthropocene seeks to distinguish itself &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1864&lt;/div&gt;&lt;h4&gt;G. P. Marsh, &lt;i&gt;Man and Nature&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;One of the first books on humankind as a force that modifies the Earth, republished under the title &lt;i&gt;The Earth as Modified by Human Action&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt; The original subtitle is &lt;i&gt;Physical Geography as Modified by Human Action&lt;/i&gt;; the book argued that the ancient societies of the Mediterranean had declined by clearing forests and depleting soils, and it is regarded as one of the founding texts of conservationism. &lt;a href=&quot;https://www.environmentandsociety.org/mml/man-and-nature-or-physical-geography-modified-human-action&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Environment &amp;amp; Society Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1873&lt;/div&gt;&lt;h4&gt;Antonio Stoppani and the “anthropozoic era”&lt;/h4&gt;&lt;p&gt;The Italian geologist described human activity as a &lt;i&gt;“new telluric force”&lt;/i&gt;, comparable in power and universality to the great forces of the Earth, and was already speaking of an &lt;span class=&quot;en&quot;&gt;anthropozoic era&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1924 · 1926&lt;/div&gt;&lt;h4&gt;Noösphere and biosphere&lt;/h4&gt;&lt;p&gt;In 1924 the French Jesuit Pierre Teilhard de Chardin and Édouard Le Roy coined the term &lt;span class=&quot;en&quot;&gt;noösphere&lt;/span&gt;, the “world of thought”, to mark the growing role of human ingenuity and technology. In 1926 the Russian geologist V. I. Vernadsky acknowledged the growing power of humankind as part of the biosphere &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2000&lt;/div&gt;&lt;h4&gt;Crutzen and Stoermer propose “Anthropocene”&lt;/h4&gt;&lt;p&gt;The atmospheric chemist Paul J. Crutzen and the biologist Eugene F. Stoermer propose the term in issue 41 of the &lt;i&gt;Global Change Newsletter&lt;/i&gt; of the IGBP (International Geosphere-Biosphere Programme) to emphasize &lt;i&gt;“the central role of mankind in geology and ecology”&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 22–23&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2002&lt;/div&gt;&lt;h4&gt;“Geology of mankind”, in &lt;i&gt;Nature&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Crutzen relaunches the idea in a one-page piece in &lt;i&gt;Nature&lt;/i&gt; (vol. 415), with a box entitled “The Anthropocene” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;. The concept leaves its niche and enters scientific and public debate.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2004 · 2011&lt;/div&gt;&lt;h4&gt;Earth system science&lt;/h4&gt;&lt;p&gt;The IGBP book &lt;i&gt;Global Change and the Earth System: A Planet Under Pressure&lt;/i&gt; (Steffen et al.) synthesizes a decade of research &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;; in 2011 Steffen, Grinevald, Crutzen and McNeill publish the article containing the quotation given above.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2024&lt;/div&gt;&lt;h4&gt;The geologists&#x27; vote&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt; In March 2024 the &lt;span class=&quot;en&quot;&gt;Subcommission on Quaternary Stratigraphy&lt;/span&gt; rejected the proposal to include the Anthropocene as a formal epoch in the Geologic Time Scale, and the IUGS and ICS endorsed the vote. The same statement stresses, however, that the term will continue to be used by scientists and the public. The chair of the subcommission disputed the validity of the vote. &lt;a href=&quot;https://stratigraphy.org/news/152&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Joint IUGS–ICS statement&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Useful for a &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt;: for official geology the Anthropocene is not (for now) a formal epoch, but it remains a central concept for the environmental and social sciences, and for this course.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrl&quot; style=&quot;justify-content:space-between&quot;&gt;
      &lt;button class=&quot;btn ghost&quot; id=&quot;tlPrev&quot;&gt;← Back&lt;/button&gt;
      &lt;span id=&quot;tlCount&quot; class=&quot;small muted&quot;&gt;&lt;/span&gt;
      &lt;button class=&quot;btn&quot; id=&quot;tlNext&quot;&gt;Next →&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;col add&quot;&gt;&lt;span class=&quot;tag-add&quot;&gt;beyond the slides&lt;/span&gt;
    &lt;p style=&quot;margin-top:.5rem&quot;&gt;&lt;b&gt;How it connects to the rest of the lecture.&lt;/b&gt; Section 5 shows that the World is increasingly urban; this section shows that the activities of that urbanized world have now become a geological force. Cities, consumption, mobility and fossil energy drive the four global changes. This is why the syllabus continues with &lt;span class=&quot;en&quot;&gt;Geography and Urbanity in the Anthropocene&lt;/span&gt; (topic 3, &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;), and why the group work asks you to read &lt;span class=&quot;en&quot;&gt;pollution and mobility&lt;/span&gt; in a concrete place.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Anthropocene&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;What are the four components of &lt;span class=&quot;en&quot;&gt;global environmental change&lt;/span&gt; identified in the slide?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;1) global warming and its multiscalar effects; 2) depletion of non-renewable and even renewable resources; 3) rapid reduction of global biodiversity; 4) unprecedented modification of the metabolism of biotic systems (soils, oceans, waters), due to the first three phenomena and to pollutants, including synthetic chemical molecules.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What does it mean that the human imprint “rivals some of the great forces of Nature”?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;That human activities affect the functioning of the earth system (climate, chemical cycles, biosphere) with a force comparable to that of the great natural processes. This is the idea underlying the term Anthropocene (Steffen et al., 2011).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;What starting date do Crutzen and Stoermer propose, and why?
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;The latter part of the eighteenth century: from then on ice cores show the rise in CO₂ and CH₄, and the date coincides with Watt&#x27;s steam engine (1784). They themselves describe it as somewhat arbitrary.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
      &lt;li&gt;Name two forerunners of the idea of the Anthropocene mentioned in the text.
        &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;For example G. P. Marsh (&lt;i&gt;Man and Nature&lt;/i&gt;, 1864), Antonio Stoppani (“anthropozoic era”, 1873), Teilhard de Chardin and Le Roy (noösphere, 1924), V. I. Vernadsky (1926).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;refs&quot; class=&quot;part&quot; aria-labelledby=&quot;refs-t&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;&lt;h2 id=&quot;refs-t&quot;&gt;Authors, texts and sources cited in the slides&lt;/h2&gt;&lt;/div&gt;
  &lt;p&gt;Each entry states the slide in which the reference appears. Bibliographic details, descriptions and links come from web research: they are all &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;
    &lt;h3 style=&quot;margin-top:0&quot;&gt;Texts in the course bibliography&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;i&gt;Handbook on the Geopolitics of Sustainability&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;edited by Björn-Ola Linnér, Therese Bennich, Henrik Carlsen · Edward Elgar, 2026 · open access (CC BY-NC-ND 4.0) · DOI 10.4337/9781035342549 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; more than 60 researchers from different disciplines examine the interplay between geopolitics and sustainability: how sustainability challenges reshape geopolitics and vice versa. The Stockholm Environment Institute presents it as a contribution to the emergence of the “geopolitics of sustainability” as a field of study.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the course textbook. It links environmental &lt;span class=&quot;en&quot;&gt;challenges&lt;/span&gt; to governance, security and complexity, the same dimensions as the group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.4337/9781035342549&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open access text (DOI, Elgaronline)&lt;/a&gt; · &lt;a href=&quot;https://www.e-elgar.com/shop/gbp/handbook-on-the-geopolitics-of-sustainability-9781035342532.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher&#x27;s page&lt;/a&gt; · &lt;a href=&quot;https://www.sei.org/publications/handbook-on-the-geopolitics-of-sustainability/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEI page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Michel Lussault, &lt;i&gt;Inhabiting the world&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Michel Lussault, geographer (ENS de Lyon) · online text on PCA-Stream &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the research could not verify the content of the page indicated in the slide. Lussault studies the ways in which human beings inhabit terrestrial spaces at all scales; on the same theme he wrote &lt;i&gt;L&#x27;avènement du Monde. Essai sur l&#x27;habitation humaine de la Terre&lt;/i&gt; (Seuil, 2013) and the chapter “How to Change the World by Inhabiting It” in the volume &lt;i&gt;Constellation.s. Inhabiting the World&lt;/i&gt; (Actes Sud, 2017). PCA-Stream is Philippe Chiambaretta&#x27;s Paris-based architecture practice, which publishes the research journal &lt;i&gt;Stream&lt;/i&gt;, devoted among other things to the relationship between humankind, cities and nature in the Anthropocene.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it grounds the idea of &lt;span class=&quot;en&quot;&gt;inhabitants&lt;/span&gt; and the distinction between Earth and &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt; (French &lt;i&gt;Monde&lt;/i&gt;) that lies at the heart of the lecture.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.pca-stream.com/en/explore/inhabiting-the-world/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Link given in the slide&lt;/a&gt; · &lt;a href=&quot;https://hal.archives-ouvertes.fr/hal-02047997&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Chapter on HAL&lt;/a&gt; · &lt;a href=&quot;https://publicspace.org/authors/-/author/michel-lussault&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Author profile (publicspace.org)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ramos-Mejía, Franco-Garcia, Jauregui-Becker, &lt;i&gt;Sustainability transitions in the developing world&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Environmental Science &amp;amp; Policy&lt;/i&gt;, vol. 84, 2018, pp. 217–223 · University of Twente &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it asks whether theories of &lt;span class=&quot;en&quot;&gt;sustainability transitions&lt;/span&gt; developed from the European experience, such as the &lt;span class=&quot;en&quot;&gt;Multi-level perspective&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;Strategic Niche Management&lt;/span&gt;, work in developing countries. In those contexts efficient institutions coexist with weak institutions, imperfect markets and clientelist or excluded communities.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it shows that transitions depend on the territorial and social context: the &lt;span class=&quot;en&quot;&gt;multiscale perspective&lt;/span&gt; and the &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt; applied to poverty.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://perfilesycapacidades.javeriana.edu.co/en/publications/sustainability-transitions-in-the-developing-world-challenges-of-/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publication record&lt;/a&gt; · &lt;a href=&quot;https://research.utwente.nl/en/publications/transitions-to-sustainability-at-the-bottom-the-role-of-grassroot/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Related research by the same authors (U. Twente)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Authors and texts cited in the lecture&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Henri Lefebvre, &lt;i&gt;La révolution urbaine&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Paris, Gallimard; the slide gives 1971, while the sources consulted date the first edition to 1970 · Italian translation &lt;i&gt;La rivoluzione urbana&lt;/i&gt;, Armando, 1973 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; published shortly after 1968, it puts forward the hypothesis that society has become “completely urbanized” and that the urban is a planetary possibility, not merely the city as an object of study. Key concepts: generalized urbanization, &lt;span class=&quot;en&quot;&gt;implosion–explosion&lt;/span&gt;, planetary space.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the root of the idea of &lt;span class=&quot;en&quot;&gt;planetary urbanization&lt;/span&gt;, taken up from the 2010s by Neil Brenner&#x27;s group (&lt;i&gt;Implosions/Explosions&lt;/i&gt;, 2014).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.wcfia.harvard.edu/publications/implosionsexplosions-towards-study-planetary-urbanization&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Implosions/Explosions: Towards a Study of Planetary Urbanization (Harvard)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Steffen, Grinevald, Crutzen, McNeill, “The Anthropocene: conceptual and historical perspectives” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Philosophical Transactions of the Royal Society A&lt;/i&gt;, 369 (1938), 2011, pp. 842–867 · DOI 10.1098/rsta.2010.0327 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it argues for adopting the Anthropocene as a new epoch, beginning around 1800 (the Industrial Revolution); it reconstructs the history of the concept and discusses recent trends, including early proposals to manage the major geophysical cycles (geoengineering).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the lecture&#x27;s key quotation (“rivals some of the great forces of Nature”).&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1098/rsta.2010.0327&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article (DOI)&lt;/a&gt; · &lt;a href=&quot;https://openresearch-repository.anu.edu.au/items/15d0ac64-ec08-4682-bfef-08027f6f4a38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ANU repository&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul J. Crutzen, Eugene F. Stoermer, “The Anthropocene” &lt;span class=&quot;src&quot;&gt;slide 22–23&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt;, no. 41, May 2000, pp. 17–18 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the text read in class (slide 23). It starts from the Holocene, recalls the forerunners (Marsh, Stoppani, Vernadsky, Teilhard), lists the evidence of human impact and proposes the late eighteenth century as the starting point.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the birth certificate of the term, published, unusually, in a newsletter rather than a scientific journal.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul J. Crutzen, “Geology of mankind” &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;i&gt;Nature&lt;/i&gt;, 415, 3 January 2002, p. 23 · DOI 10.1038/415023a &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a one-page piece in the “Concepts” section of &lt;i&gt;Nature&lt;/i&gt;, with the box “The Anthropocene”: human impact has grown so much that it may alter the climate for a long period.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it brought the concept to the wider scientific community.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1038/415023a&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article (DOI)&lt;/a&gt; · &lt;a href=&quot;https://pubmed.ncbi.nlm.nih.gov/11780095/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PubMed&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;W. Steffen et al., &lt;i&gt;Global Change and the Earth System: A Planet Under Pressure&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Springer, IGBP series, 2004 (© 2005) · Steffen, Sanderson, Tyson, Jäger, Matson, Moore III, Oldfield, Richardson, Schellnhuber, Turner II, Wasson &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the synthesis of a decade of IGBP research, with chapters on the integrated &lt;span class=&quot;en&quot;&gt;earth system&lt;/span&gt;, the “Anthropocene Era” and global sustainability. It concludes that humankind is now the main driver of planetary change and that the Earth is in a “no-analogue” state, without precedent.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it lays the foundations of &lt;span class=&quot;en&quot;&gt;Earth system science&lt;/span&gt;, the systemic outlook that the lecture calls the &lt;span class=&quot;en&quot;&gt;systemic approach&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://link.springer.com/book/10.1007/b137870&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;George Perkins Marsh, &lt;i&gt;Man and Nature&lt;/i&gt; (1864) &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;New York, Scribner, 1864 · subtitle &lt;i&gt;Physical Geography as Modified by Human Action&lt;/i&gt; &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it overturns the view of its time: it is not only the Earth that shapes humankind, but humankind that transforms the Earth, often destructively (deforestation and erosion in the ancient Mediterranean).&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is a forerunner of the Anthropocene and of conservationism; the full text is freely available.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.gutenberg.org/ebooks/37957&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Gutenberg (full text)&lt;/a&gt; · &lt;a href=&quot;https://www.environmentandsociety.org/mml/man-and-nature-or-physical-geography-modified-human-action&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Environment &amp;amp; Society Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Jacques Lévy and urbanity &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Geographer, professor at EPFL in Lausanne, co-founder of EspacesTemps.net &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; Lévy proposed measuring urbanity (density plus diversity) and reading space along a &lt;span class=&quot;en&quot;&gt;gradient d&#x27;urbanité&lt;/span&gt;, a continuum instead of the city/countryside pair. In the article “Périphérisation de l&#x27;urbain” (2014, with Michel Lussault) he describes a form of urbanization with a low urbanity gradient, in which density and diversity decline together.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; he is the author behind topic 6 of the syllabus (&lt;span class=&quot;en&quot;&gt;Urbanities&lt;/span&gt;) and provides the tools for measuring the &lt;span class=&quot;en&quot;&gt;urbanity&lt;/span&gt; introduced in this lecture.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://espacestemps.net/articles/peripherisation-de-lurbain/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Périphérisation de l&#x27;urbain”, EspacesTemps.net&lt;/a&gt; · &lt;a href=&quot;https://metropolitics.org/_Levy-Jacques_.html?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Profile on Metropolitics&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vincenzo Maria Coronelli, terrestrial globe (1688) &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Biblioteca Civica Angelo Mai, Piazza Vecchia, Bergamo &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a pair of large globes (terrestrial and celestial) by the Venetian cartographer, which arrived in Bergamo in 1692 and have been in the library since 1834, restored partly through the FAI project “Save the Globes”.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the “on your doorstep” example of the &lt;span class=&quot;en&quot;&gt;Globe&lt;/span&gt; as a historical representation of the world, and you can go and see it.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bibliotecamai.org/wp-content/uploads/2012/10/PANNELLI-MOSTRA-GLOBI.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Exhibition panels on the globes (Biblioteca Mai)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;i&gt;Earthrise&lt;/i&gt;, Apollo 8 (1968) &lt;span class=&quot;src&quot;&gt;slide 12, 16&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;Photograph by William Anders, 24 December 1968 &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the Earth rising over the lunar horizon, photographed while the spacecraft was orbiting the Moon.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it made the Earth visible as a single, fragile whole and is regarded as one of the catalysts of the environmental movement; in the lecture it illustrates the &lt;span class=&quot;en&quot;&gt;World&lt;/span&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.space.com/earthrise-christmas-eve-image-that-changed-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Space.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

    &lt;h3&gt;Additional sources used on this page&lt;/h3&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN DESA, &lt;i&gt;World Urbanization Prospects 2025&lt;/i&gt;&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;United Nations, November 2025 · not cited in the slides &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the UN&#x27;s official urbanization estimates, recalculated with the &lt;span class=&quot;en&quot;&gt;Degree of Urbanization&lt;/span&gt; method (cities, &lt;span class=&quot;en&quot;&gt;towns&lt;/span&gt;, rural areas): 45% of the population living in cities in 2025, 33 megacities.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it updates the table in slide 18 and shows how much definitions change the numbers.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.un.org/development/desa/pd/node/4442&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary of Results&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IUGS–ICS, statement on the Anthropocene vote (2024)&lt;/h4&gt;
      &lt;div class=&quot;who&quot;&gt;International Union of Geological Sciences and International Commission on Stratigraphy · not cited in the slides &lt;span class=&quot;tag-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the endorsement of the vote that rejected the Anthropocene as a formal unit of the Geologic Time Scale, with the clarification that the term will remain in use.&lt;/p&gt;
      &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it clarifies the current state of the debate, useful for a &lt;span class=&quot;en&quot;&gt;critical approach&lt;/span&gt; in the exam.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://stratigraphy.org/news/152&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;stratigraphy.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

  // urban population chart
