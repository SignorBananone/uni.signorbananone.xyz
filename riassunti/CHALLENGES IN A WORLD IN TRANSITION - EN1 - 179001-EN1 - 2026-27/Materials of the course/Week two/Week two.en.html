&lt;/figure&gt;
&lt;div id=&quot;luInfo&quot; class=&quot;panel info&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;template data-for=&quot;sh&quot;&gt;&lt;p&gt;&lt;b&gt;Sustainability &amp;amp; Health&lt;/b&gt; · global goal. &lt;span class=&quot;tech&quot;&gt;Sustainability&lt;/span&gt;: meeting present needs without compromising those of the future. Here it is linked to health: a degraded urban environment makes people ill. It is connected to the local node &lt;i&gt;Accessibility &amp;amp; Hospitality&lt;/i&gt;.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ef&quot;&gt;&lt;p&gt;&lt;b&gt;Efficiency&lt;/b&gt; · global goal: achieving more with less energy, land and material. It is the idea of “sobriety” in the outer ring, and its local counterpart is the &lt;i&gt;Circular economy&lt;/i&gt;.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;dj&quot;&gt;&lt;p&gt;&lt;b&gt;Democracy &amp;amp; Spatial justice&lt;/b&gt; · global goal. &lt;span class=&quot;tech&quot;&gt;Spatial justice&lt;/span&gt;: the fair distribution across space of resources, services, risks and opportunities to take part in decisions. Those who live next to a landfill or far from public transport suffer a spatial injustice. It is linked to the &lt;i&gt;Urban ecosystem&lt;/i&gt;: air, green space and water are goods to be distributed fairly.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;vr&quot;&gt;&lt;p&gt;&lt;b&gt;Vulnerability &amp;amp; Resilience&lt;/b&gt; · global goal. &lt;span class=&quot;tech&quot;&gt;Vulnerability&lt;/span&gt;: how far a system can be damaged by an event (flood, heatwave). &lt;span class=&quot;tech&quot;&gt;Resilience&lt;/span&gt;: the capacity to absorb the shock and reorganise. It is linked to &lt;i&gt;Social and cultural diversity&lt;/i&gt;: diverse and connected societies respond better.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ah&quot;&gt;&lt;p&gt;&lt;b&gt;Accessibility &amp;amp; Hospitality&lt;/b&gt; · local quality. Cities that everyone can reach and move around in (accessibility) and where newcomers, including migrants and visitors, are welcomed (hospitality). It sits on the &lt;b&gt;SPACE&lt;/b&gt; side of the diamond.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ce&quot;&gt;&lt;p&gt;&lt;b&gt;Circular economy&lt;/b&gt; · local quality. &lt;span class=&quot;tech&quot;&gt;Circular economy&lt;/span&gt;: an economy that reuses, repairs and recycles instead of following the linear “take, make, dispose” model. It reduces the material flows that the city imports and exports.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ue&quot;&gt;&lt;p&gt;&lt;b&gt;Urban ecosystem&lt;/b&gt; · local quality. The city seen as an ecosystem: soil, water, trees, animals and microclimate, not just buildings. It sits above the &lt;b&gt;bio-physical milieu&lt;/b&gt;, the physical and biological environment on which everything rests.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;sc&quot;&gt;&lt;p&gt;&lt;b&gt;Social and cultural diversity&lt;/b&gt; · local quality. The coexistence of different groups, ages, cultures and income levels. It is a resource for liveability and resilience, countering segregation and &lt;span class=&quot;tech&quot;&gt;gentrification&lt;/span&gt; (see &lt;a href=&quot;#s7&quot;&gt;cases&lt;/a&gt;).&lt;/p&gt;&lt;/template&gt;
&lt;div class=&quot;tablist&quot; style=&quot;margin-top:12px&quot; aria-label=&quot;Choose a node&quot;&gt;
&lt;button class=&quot;chip&quot; data-k=&quot;sh&quot;&gt;Sustainability&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ef&quot;&gt;Efficiency&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;dj&quot;&gt;Democracy&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;vr&quot;&gt;Resilience&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ah&quot;&gt;Accessibility&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ce&quot;&gt;Circular economy&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ue&quot;&gt;Urban ecosystem&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;sc&quot;&gt;Diversity&lt;/button&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;The four actions in the corners of the slide&lt;/h4&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Spatial diplomacies&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Inventing new spatial and geopolitical diplomacies (“gepolicies”) between human and &lt;i&gt;non-human&lt;/i&gt; agents: rivers, animals and the climate enter politics.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Spatial caring&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Taking care of places, territories and the Earth as a whole.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Empowerment&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Promoting responsibility, social and political engagement, and the &lt;span class=&quot;tech&quot;&gt;empowerment&lt;/span&gt; (giving power and capacity to act) of &lt;span class=&quot;tech&quot;&gt;stakeholders&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Design &amp;amp; planning&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Inventing a new sustainable design and a qualitative planning of urban spaces at every scale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Three books by Michel Lussault&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 6&lt;/span&gt; Covers of three volumes published by Seuil in the series “La couleur des idées”.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;l1&quot;&gt;L&#x27;Homme spatial&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;l2&quot;&gt;L&#x27;Avènement du monde&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;l3&quot;&gt;Hyper-lieux&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l1&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;L&#x27;Homme spatial. La construction sociale de l&#x27;espace humain&lt;/i&gt;&lt;/b&gt; (2007). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Space is a social construction: human beings are “spatial”, always acting by managing distances, places and limits. The theoretical basis for the concepts of &lt;a href=&quot;#s5&quot;&gt;space and spatiality&lt;/a&gt;. (&lt;a href=&quot;https://espacestemps.net/articles/homme-spatial-prend-places/?pdf=28628&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in EspacesTemps.net&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l2&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;L&#x27;Avènement du monde. Essai sur l&#x27;habitation humaine de la Terre&lt;/i&gt;&lt;/b&gt; (2013). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The &lt;i&gt;Monde&lt;/i&gt; (World, capitalised) as a new reality: humankind now inhabits the whole Earth as a single space. Lussault places its emergence in the post-war period, partly thanks to space exploration, which allowed us to see the planet as a whole (the Earth on the cover). Linked to &lt;a href=&quot;#s4&quot;&gt;mondialization&lt;/a&gt; and &lt;a href=&quot;#s5&quot;&gt;inhabiting&lt;/a&gt;. (&lt;a href=&quot;https://www.letemps.ch/culture/une-habitation-humaine-planete&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l3&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt;&lt;/b&gt; (2017). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;span class=&quot;tech&quot;&gt;Hyper-lieux&lt;/span&gt; (hyper-places) are places intensely connected at the world scale (airports, shopping centres, iconic squares; Dubai on the cover), where flows of people, objects and information intersect. The concept challenges the idea that globalization makes all space the same. They are the &lt;span class=&quot;tech&quot;&gt;urban nodes&lt;/span&gt; of &lt;a href=&quot;#s4&quot;&gt;Part 4&lt;/a&gt;. (&lt;a href=&quot;https://www.letemps.ch/suisse/arpenter-geneve-recherche-hyperlieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;What does it mean to say that the “human imprint” is an “urban imprint”?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;That only city dwellers pollute&lt;/button&gt;&lt;button&gt;That human impact on the planet passes mainly through urban systems and what they consume&lt;/button&gt;&lt;button&gt;That cities cover most of the Earth&#x27;s land surface&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Cities occupy little surface area, but they organise the flows of energy, materials and people that transform the entire planet.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;In Lussault&#x27;s diagram, what lies at the centre?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Efficiency&lt;/button&gt;&lt;button&gt;Bio-physical milieu&lt;/button&gt;&lt;button&gt;Spatiality&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;At the centre is spatiality, i.e. the spatial practices of actors; the bio-physical milieu is at the base and efficiency is one of the 4 global goals.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: match each local quality to its global goal&lt;/summary&gt;&lt;div&gt;Accessibility &amp;amp; Hospitality → Sustainability &amp;amp; Health; Circular economy → Efficiency; Urban ecosystem → Democracy &amp;amp; Spatial justice; Social and cultural diversity → Vulnerability &amp;amp; Resilience (following the arrangement of the arrows in the slide).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S4 --&gt;
&lt;section id=&quot;s4&quot; class=&quot;part&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 4 · slides 7–9&lt;/div&gt;
&lt;h2&gt;Reading the world in the process of Mondialization&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Mondialization&lt;/b&gt; (Fr. &lt;i&gt;mondialisation&lt;/i&gt;) — the process through which the world becomes a single space of relations. In French-language geography it is often distinguished from &lt;i&gt;globalization&lt;/i&gt; in the economic sense: mondialization also concerns people, cultures, information and imaginaries. It is the “making of the World” that Lussault writes about.&lt;/div&gt;

&lt;h3&gt;Movement: mobility and networks at local and global scales&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 8&lt;/span&gt; Globe → exchanges/fluxes → MOVEMENT → urban nodes → socio-territorial systems.&lt;/p&gt;
&lt;p&gt;Step through the diagram.&lt;/p&gt;
&lt;div data-steps&gt;
&lt;svg viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;Diagram: from the globe to flows, to urban nodes, to socio-territorial systems&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;d250&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;0&quot;&gt;&lt;rect x=&quot;250&quot; y=&quot;12&quot; width=&quot;140&quot; height=&quot;48&quot; rx=&quot;8&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;GLOBE&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;42&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;mondialisation&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;1&quot;&gt;&lt;line x1=&quot;320&quot; y1=&quot;62&quot; x2=&quot;320&quot; y2=&quot;96&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;exchanges / fluxes&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;700&quot;&gt;MOVEMENT&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;2&quot; font-size=&quot;14&quot;&gt;
&lt;g class=&quot;s-ink&quot; stroke-width=&quot;1&quot; style=&quot;stroke:var(--muted)&quot;&gt;&lt;line x1=&quot;320&quot; y1=&quot;148&quot; x2=&quot;90&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;148&quot; x2=&quot;230&quot; y2=&quot;215&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;148&quot; x2=&quot;400&quot; y2=&quot;215&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;148&quot; x2=&quot;550&quot; y2=&quot;190&quot;/&gt;&lt;/g&gt;
&lt;rect x=&quot;45&quot; y=&quot;190&quot; width=&quot;90&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;trade&lt;/text&gt;
&lt;rect x=&quot;170&quot; y=&quot;215&quot; width=&quot;120&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot;&gt;information&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;190&quot; width=&quot;110&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;objects&lt;/text&gt;
&lt;ellipse cx=&quot;400&quot; cy=&quot;230&quot; rx=&quot;60&quot; ry=&quot;26&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;people&lt;/text&gt;
&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;3&quot;&gt;&lt;path d=&quot;M90 222 C 60 300, 260 300, 330 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M545 222 C 600 290, 480 300, 470 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M230 247 C 220 290, 300 300, 330 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;400&quot; y1=&quot;258&quot; x2=&quot;400&quot; y2=&quot;284&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;320&quot; y=&quot;286&quot; width=&quot;160&quot; height=&quot;36&quot; rx=&quot;6&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;URBAN NODES&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;4&quot;&gt;&lt;line x1=&quot;400&quot; y1=&quot;324&quot; x2=&quot;400&quot; y2=&quot;350&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;170&quot; y=&quot;352&quot; width=&quot;460&quot; height=&quot;38&quot; rx=&quot;6&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Creating changes in &lt;tspan font-weight=&quot;700&quot;&gt;socio-territorial systems&lt;/tspan&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Back&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Step&quot;&gt;&lt;button class=&quot;btn next&quot;&gt;Next ›&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;1 · Globe.&lt;/b&gt; Mondialization acts on the planet as a whole: the world becomes a single system. The curved arrow in the slide indicates a continuous, self-reinforcing process.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;2 · Movement.&lt;/b&gt; Mondialization manifests itself as &lt;span class=&quot;tech&quot;&gt;exchanges/fluxes&lt;/span&gt;. The world is read through what moves, not through what stays still.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;3 · Four flows.&lt;/b&gt; &lt;b&gt;Trade&lt;/b&gt; (in goods and services), &lt;b&gt;information&lt;/b&gt; (data, media, finance), &lt;b&gt;objects&lt;/b&gt; (things in circulation: containers, waste, invasive species), &lt;b&gt;people&lt;/b&gt; (migrants, tourists, commuters). The slide circles &lt;b&gt;people&lt;/b&gt;: for this course the central flow is people, who inhabit places (&lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;).&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;4 · Urban nodes.&lt;/b&gt; All flows converge in cities, which function as the nodes of a network: ports, airports, financial centres, arrival neighbourhoods for migrants. The dashed lines indicate that trade, information and objects also pass through urban nodes.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;5 · Socio-territorial systems.&lt;/b&gt; The flows entering the nodes transform socio-territorial systems: the combination of society, institutions and organised space in a given place. Example: international tourism changes the inhabitants, house prices and the uses of the historic centre (Venice, &lt;a href=&quot;#s7&quot;&gt;Part 7&lt;/a&gt;).&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;From the &lt;span class=&quot;tech&quot;&gt;areal approach&lt;/span&gt; to the &lt;span class=&quot;tech&quot;&gt;networks approach&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 9&lt;/span&gt; “The mondialization process: SPACE from areal approach to NETWORKS approach” → “NETWORK of urban nodes”.&lt;/p&gt;
&lt;p&gt;A shift in how we look at space. Try switching between the two:&lt;/p&gt;
&lt;div data-toggle&gt;
&lt;div class=&quot;tablist&quot; style=&quot;margin-bottom:10px&quot;&gt;&lt;button class=&quot;chip&quot; data-mode=&quot;area&quot;&gt;Areal approach&lt;/button&gt;&lt;button class=&quot;chip&quot; data-mode=&quot;net&quot;&gt;Networks approach&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the areal and the networks approach&quot;&gt;
&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;640&quot; height=&quot;300&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;
&lt;g data-show=&quot;area&quot;&gt;
&lt;path d=&quot;M20 30 L250 20 L270 140 L180 170 L30 150Z&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M250 20 L460 30 L440 150 L270 140Z&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M460 30 L620 40 L610 180 L440 150Z&quot; class=&quot;t25 sd25&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M30 150 L180 170 L270 140 L300 280 L20 280Z&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M270 140 L440 150 L610 180 L620 280 L300 280Z&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;140&quot; y=&quot;95&quot;&gt;region A&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;90&quot;&gt;region B&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;110&quot;&gt;region C&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;225&quot;&gt;region D&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;225&quot;&gt;region E&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;g data-show=&quot;net&quot;&gt;
&lt;g fill=&quot;none&quot; stroke-width=&quot;1.6&quot; class=&quot;sd85&quot;&gt;&lt;path d=&quot;M110 200 Q 230 40 330 120&quot;/&gt;&lt;path d=&quot;M110 200 Q 300 260 470 210&quot;/&gt;&lt;path d=&quot;M330 120 Q 400 30 540 90&quot;/&gt;&lt;path d=&quot;M330 120 Q 420 200 470 210&quot;/&gt;&lt;path d=&quot;M540 90 Q 560 160 470 210&quot;/&gt;&lt;path d=&quot;M110 200 Q 300 0 540 90&quot;/&gt;&lt;path d=&quot;M200 90 Q 260 70 330 120&quot;/&gt;&lt;/g&gt;
&lt;g class=&quot;d250&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;200&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;330&quot; cy=&quot;120&quot; r=&quot;26&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;90&quot; r=&quot;20&quot;/&gt;&lt;circle cx=&quot;470&quot; cy=&quot;210&quot; r=&quot;18&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;90&quot; r=&quot;11&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;110&quot; y=&quot;240&quot;&gt;departure&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;164&quot;&gt;transition (hub)&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;128&quot;&gt;arrival&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;245&quot;&gt;arrival&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;40&quot;&gt;paths&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;320&quot; y=&quot;285&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot; style=&quot;fill:var(--muted)&quot;&gt;between one node and another, space almost “disappears”: connection matters, not contiguity&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot; data-show=&quot;area&quot;&gt;&lt;b&gt;Areal approach&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Space as a mosaic of contiguous, bounded &lt;i&gt;areas&lt;/i&gt; (regions, states, zones): what matters is the boundary, proximity and internal homogeneity. Topographic metric.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-show=&quot;net&quot;&gt;&lt;b&gt;Networks approach&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Space as a &lt;i&gt;network&lt;/i&gt; of nodes (cities) linked by flows. Two distant but well-connected cities are “closer” than two neighbouring villages. Topological metric: what matters is who is connected to whom.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Four elements can be distinguished in the network, indicated by the arrows in slide 9:&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Element&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;th&gt;Example&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of departure&lt;/b&gt;&lt;/td&gt;&lt;td&gt;places from which flows originate&lt;/td&gt;&lt;td&gt;a migrant&#x27;s city of origin&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of transition&lt;/b&gt;&lt;/td&gt;&lt;td&gt;places of passage, stopover and redistribution&lt;/td&gt;&lt;td&gt;a hub airport, a refugee camp, a transshipment port&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of arrival&lt;/b&gt;&lt;/td&gt;&lt;td&gt;destinations where flows stop and settle&lt;/td&gt;&lt;td&gt;an arrival neighbourhood in a metropolis, a tourist resort&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Paths&lt;/b&gt;&lt;/td&gt;&lt;td&gt;the routes linking places&lt;/td&gt;&lt;td&gt;air routes, submarine cables, migration routes&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;The result is a &lt;b&gt;NETWORK of urban nodes&lt;/b&gt;: the local (the blue patches on the hemisphere in the slide) is always connected to the global (the yellow arcs). Every place must be read together with its connections.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;In the networks approach, two cities are “close” when…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;they are well connected by flows, even if far apart in kilometres&lt;/button&gt;&lt;button&gt;they share a border&lt;/button&gt;&lt;button&gt;they belong to the same administrative region&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;In a network, distance is measured in connections (topology), not in contiguity (topography).&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Which flow does slide 8 highlight with a circle?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Trade&lt;/button&gt;&lt;button&gt;Information&lt;/button&gt;&lt;button&gt;People&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;People: it is people who link mondialization to the themes of inhabiting.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: is a major airport a place of departure, transition or arrival?&lt;/summary&gt;&lt;div&gt;It depends on the flow: it can be all three. This is why urban nodes are complex: the same place plays different roles for different people.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 5 · slide 10&lt;/div&gt;
&lt;h2&gt;Inhabiting: a social theory of space&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 10&lt;/span&gt; “INHABITING – A social theory of space”.&lt;/p&gt;
&lt;p&gt;Three definitions to learn by heart, each more “active” than the previous one:&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Space&lt;/b&gt; — &lt;i&gt;the environmental dimension of social actions&lt;/i&gt;. Every action takes place somewhere, involving distances, places and objects. Space is not an empty container but a dimension of society.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Spatiality&lt;/b&gt; — &lt;i&gt;spatial component of social action&lt;/i&gt;: what actors &lt;i&gt;do&lt;/i&gt; with space: choosing a route, avoiding a neighbourhood, drawing a boundary, moving closer.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inhabiting&lt;/b&gt; — &lt;i&gt;interactive relation between social actors and space&lt;/i&gt;. Inhabiting is not just “having a home”: it is the two-way relationship whereby people transform space and space conditions people.&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Interactive relation between social actors and space&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;d150&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;45&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Social actors&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inhabitants, institutions…&lt;/text&gt;
&lt;rect x=&quot;430&quot; y=&quot;45&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Space&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;places, distances, objects&lt;/text&gt;
&lt;path d=&quot;M215 70 Q 320 20 425 70&quot; fill=&quot;none&quot; class=&quot;sd150&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;spatiality: they act, name, build&lt;/text&gt;
&lt;path d=&quot;M425 102 Q 320 152 215 102&quot; fill=&quot;none&quot; class=&quot;sd150&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;space offers and limits possibilities&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot;&gt;inhabiting&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;

&lt;h3&gt;Who are the &lt;span class=&quot;tech&quot;&gt;inhabitants&lt;/span&gt;?&lt;/h3&gt;
&lt;p&gt;The relation of inhabiting gives rise to &lt;b&gt;inhabitants&lt;/b&gt;: not only residents. The slide distinguishes them &lt;b&gt;“by the way they stay in a place or move”&lt;/b&gt;. Click a type:&lt;/p&gt;
&lt;div data-info-group=&quot;whoInfo&quot;&gt;
&lt;div class=&quot;tablist&quot;&gt;
&lt;button class=&quot;chip&quot; data-k=&quot;res&quot;&gt;Residents&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;com&quot;&gt;Commuters&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;mig&quot;&gt;Migrants&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;tou&quot;&gt;Tourists&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;vis&quot;&gt;Visitors&lt;/button&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:14px 0 6px&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 110&quot; role=&quot;img&quot; aria-label=&quot;Scale from staying to moving&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;55&quot; x2=&quot;600&quot; y2=&quot;55&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--muted)&quot;/&gt;
&lt;text x=&quot;40&quot; y=&quot;95&quot; font-size=&quot;12.5&quot;&gt;stay for a long time&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;95&quot; font-size=&quot;12.5&quot; text-anchor=&quot;end&quot;&gt;pass through, return, move on&lt;/text&gt;
&lt;g data-mark=&quot;res&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d150&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;residents&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;mig&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;migrants&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;com&quot;&gt;&lt;circle cx=&quot;350&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;commuters&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;tou&quot;&gt;&lt;circle cx=&quot;460&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d25&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;tourists&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;vis&quot;&gt;&lt;circle cx=&quot;570&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;visitors&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Indicative positions, as an aid to reasoning: in reality the profiles overlap.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div id=&quot;whoInfo&quot; class=&quot;panel info&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;template data-for=&quot;res&quot;&gt;&lt;p&gt;&lt;b&gt;Residents&lt;/b&gt; · live permanently in the place: they sleep, vote and pay local taxes there. They are the “classic” inhabitants, but today no longer the only ones.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;com&quot;&gt;&lt;p&gt;&lt;b&gt;Commuters&lt;/b&gt; · live in one place and use another every day (work, study). They inhabit two places on a daily rhythm, and a city counts them only during the day.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;mig&quot;&gt;&lt;p&gt;&lt;b&gt;Migrants&lt;/b&gt; · move in order to settle elsewhere, for a long period or permanently. They connect places of departure and arrival (Part 4) and often inhabit the space “between” two places.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;tou&quot;&gt;&lt;p&gt;&lt;b&gt;Tourists&lt;/b&gt; · stay briefly (at least one night), for leisure. Only a few days, but in huge numbers: they can change a historic centre (&lt;a href=&quot;#s7&quot;&gt;overtourism in Venice&lt;/a&gt;).&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;vis&quot;&gt;&lt;p&gt;&lt;b&gt;Visitors&lt;/b&gt; · pass through for various reasons (business, visiting relatives, day trips), even without staying overnight. The “…” in the slide is a reminder that the list is open: city users, non-local students, seasonal workers…&lt;/p&gt;&lt;/template&gt;
&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;b&gt;Other criteria.&lt;/b&gt; Inhabitants also differ by &lt;span class=&quot;tag&quot;&gt;age&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;gender&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;profession&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;ethnicity&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;…&lt;/span&gt;. Cross-referencing mobility with social criteria reveals different, often conflicting needs: an elderly resident and a young tourist do not ask for the same city. These very conflicts appear in the &lt;a href=&quot;#s7&quot;&gt;cases&lt;/a&gt; (ageing, different needs from inhabitants).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The triad space / spatiality / inhabiting (&lt;i&gt;espace, spatialité, habiter&lt;/i&gt;) draws on the French-language social geography of Jacques Lévy and Michel Lussault, who in the &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt; (Belin, 2003; new ed. 2013) treat inhabiting as the relationship between human beings and space, and spatialité as the central object of study (&lt;a href=&quot;https://www.usherbrooke.ca/dep-com/actualites/nouvelles/details/42022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Université de Sherbrooke, on “habiter”&lt;/a&gt;; &lt;a href=&quot;https://www.espacestemps.net/articles/une-geographie-dialogique/?output=pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in EspacesTemps.net&lt;/a&gt;).&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;What is the difference between &lt;i&gt;space&lt;/i&gt; and &lt;i&gt;spatiality&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;They are synonyms&lt;/button&gt;&lt;button&gt;Space is the environmental dimension of social actions; spatiality is the spatial component of action, what actors do with space&lt;/button&gt;&lt;button&gt;Space concerns cities, spatiality the countryside&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Space is the dimension; spatiality is the spatial agency of actors.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;What is the main criterion the slide uses to distinguish residents, commuters, migrants, tourists and visitors?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;The way they stay in a place or move&lt;/button&gt;&lt;button&gt;Income&lt;/button&gt;&lt;button&gt;Nationality&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;“By the way they stay in a place or move”; age, gender, profession and ethnicity are “other criteria”.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: why does “inhabiting” not coincide with “residing”?&lt;/summary&gt;&lt;div&gt;Because inhabiting is a relationship with space that commuters, tourists and migrants also have. A city is inhabited by those who use it, not only by those on the population register.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section id=&quot;s6&quot; class=&quot;part&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 6 · slides 11–12&lt;/div&gt;
&lt;h2&gt;Process of territorialisation: how space becomes territory&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slides 11–12&lt;/span&gt; Denomination, reification, structuration; layered model “Nature → Territory”.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Territory&lt;/b&gt; and &lt;b&gt;territorialisation&lt;/b&gt; — &lt;i&gt;space&lt;/i&gt; becomes &lt;i&gt;territory&lt;/i&gt; when a society appropriates it: it names it, transforms it materially and organises it through institutions. &lt;span class=&quot;tech&quot;&gt;Territorialisation&lt;/span&gt; is the process through which this happens; territory is therefore a social product, not a natural given.&lt;/div&gt;
&lt;p&gt;The three arrows in slide 11 are three &lt;b&gt;territorialising acts&lt;/b&gt;, from the most symbolic to the most organisational:&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Denomination&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Symbolic appropriation&lt;/i&gt;: giving names and social meanings. Calling a mountain “sacred”, a neighbourhood “Chinatown”.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Reification&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Practical transformation&lt;/i&gt;: modifying the environment or building new &lt;i&gt;artifacts&lt;/i&gt;: canals, fields, roads, houses.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Structuration&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Functional organisation&lt;/i&gt;: creating structures with specific institutions: municipalities, consortia, port authorities, master plans.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Build the territory layer by layer&lt;/h3&gt;
&lt;p&gt;The model in slide 12 is a box made of stacked levels. It starts from &lt;b&gt;nature&lt;/b&gt; and moves upwards. On the left is what each act produces; on the right, the form it takes in the territory.&lt;/p&gt;
&lt;div data-steps&gt;
&lt;svg viewBox=&quot;0 0 640 420&quot; role=&quot;img&quot; aria-label=&quot;Layered model of territorialisation&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;0&quot;&gt;&lt;polygon points=&quot;190,350 440,350 490,310 240,310&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,350 440,350 440,390 190,390&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; font-family=&quot;var(--serif)&quot;&gt;NATURE&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;1&quot;&gt;&lt;polygon points=&quot;190,290 440,290 490,250 240,250&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,290 440,290 440,320 190,320&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;311&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;DENOMINATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;306&quot; text-anchor=&quot;end&quot;&gt;Symbols&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;290&quot;&gt;Designators /&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;306&quot;&gt;place-names&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;2&quot;&gt;&lt;polygon points=&quot;190,215 440,215 490,175 240,175&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,215 440,215 440,245 190,245&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;REIFICATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;232&quot; text-anchor=&quot;end&quot;&gt;Practices&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;225&quot;&gt;Materiality&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;3&quot;&gt;&lt;polygon points=&quot;190,140 440,140 490,100 240,100&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,140 440,140 440,170 190,170&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;STRUCTURATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;157&quot; text-anchor=&quot;end&quot;&gt;Structures&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;140&quot;&gt;Operational&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;156&quot;&gt;contexts&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;4&quot;&gt;&lt;rect x=&quot;190&quot; y=&quot;40&quot; width=&quot;250&quot; height=&quot;350&quot; fill=&quot;none&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polyline points=&quot;440,40 490,10 490,350 440,390&quot; fill=&quot;none&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;line x1=&quot;190&quot; y1=&quot;40&quot; x2=&quot;240&quot; y2=&quot;10&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;10&quot; x2=&quot;490&quot; y2=&quot;10&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; font-weight=&quot;700&quot; font-family=&quot;var(--serif)&quot; letter-spacing=&quot;.25em&quot; class=&quot;d25&quot;&gt;TERRITORY&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Down&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Layer&quot;&gt;&lt;button class=&quot;btn next&quot;&gt;Up ›&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;0 · Nature.&lt;/b&gt; The starting point: a physical environment (a lagoon, a plain, a bay) before social intervention. Not yet territory, only natural space.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;1 · Denomination → Symbols → place-names.&lt;/b&gt; Names (toponyms, i.e. place-names) and meanings are assigned. The concrete outcome is &lt;span class=&quot;tech&quot;&gt;designators&lt;/span&gt;: names, boundaries drawn on maps, symbols that say “this place is like this”.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;2 · Reification → Practices → materiality.&lt;/b&gt; Practices physically transform space: canals are dug, fields ploughed, houses and ports built. The territory acquires &lt;i&gt;materiality&lt;/i&gt;, a material consistency.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;3 · Structuration → Structures → operational contexts.&lt;/b&gt; Institutions and rules (property, administrations, plans) are created that organise functions and uses. The territory becomes an &lt;i&gt;operational context&lt;/i&gt;, i.e. a context in which action follows rules.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;4 · Territory.&lt;/b&gt; The territory is the whole box: the three layers superimposed on nature, always in motion, because names, artifacts and institutions change. The vertical label TERRITORY runs through all the levels.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;&lt;span class=&quot;tech&quot;&gt;Territorialisation logic&lt;/span&gt;: self-centered or external?&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;sc&quot;&gt;Self-centered&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;ex&quot;&gt;External&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;sc&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Self-centered logic.&lt;/b&gt; Territorialising acts are decided by the community inhabiting the place, according to its own needs and values: those who name, build and organise are those who live there.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;ex&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;External logic&lt;/b&gt; (hetero-centred). Names, transformations and institutions are imposed by external actors: a colonial power, a central state, global investors, tourist flows. In the mondialized world (Part 4) this is increasingly common: the flows reaching urban nodes bring external logics with them.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Worked example: the Venetian lagoon&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Denomination&lt;/b&gt;: “la Serenissima”, the names of the &lt;i&gt;sestieri&lt;/i&gt; and &lt;i&gt;calli&lt;/i&gt;, the image of the “romantic city” sold worldwide. &lt;b&gt;Reification&lt;/b&gt;: pile foundations, canals, river diversions, the MOSE mobile barrier system. &lt;b&gt;Structuration&lt;/b&gt;: the Republic, today the Municipality, the Lagoon Authority, UNESCO. Many recent acts follow an &lt;i&gt;external&lt;/i&gt; logic (global tourism). &lt;i&gt;Example added for this study guide, not present in the slides.&lt;/i&gt;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The triad &lt;i&gt;denomination, reification, structuration&lt;/i&gt; is associated with the Italian geographer &lt;b&gt;Angelo Turco&lt;/b&gt;, for whom territory is a social artifact produced by human action and built up gradually (geographical theory of complexity, 1988; &lt;i&gt;Configurazioni della territorialità&lt;/i&gt;, 2010). The slides do not cite the author. See &lt;a href=&quot;https://web.unica.it/static/resources/cms/documents/1.0.CattedraTerritorio_Territorializzazione.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Cagliari, “Territorializzazione”&lt;/a&gt; and the &lt;a href=&quot;https://gh.copernicus.org/articles/70/89/2015/gh-70-89-2015.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;discussion in &lt;i&gt;Geographica Helvetica&lt;/i&gt;&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 6&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Building a dam and draining a marsh is an act of…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Denomination&lt;/button&gt;&lt;button&gt;Structuration&lt;/button&gt;&lt;button&gt;Reification&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;It is a practical, material transformation, hence reification.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;In the model, what sits beside &lt;i&gt;structuration&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Structures (on the left) and operational contexts (on the right)&lt;/button&gt;&lt;button&gt;Symbols and place-names&lt;/button&gt;&lt;button&gt;Practices and materiality&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Symbols/place-names go with denomination, practices/materiality with reification.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Renaming a city&#x27;s streets in English to make it “more attractive” to foreign investors follows a logic that is…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Self-centered&lt;/button&gt;&lt;button&gt;External&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;It is a denomination driven by actors and needs external to the local community.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part&quot; style=&quot;--h:25&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 7 · slide 13&lt;/div&gt;
&lt;h2&gt;Four places, the same concepts&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 13&lt;/span&gt; Venice · Poland · Middle East · Osaka, each with keywords. It appears to summarise a class discussion (perhaps group work): the slide gives only the words; the explanations below are a suggested reading that links them to the concepts of the lecture.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;ve&quot;&gt;Venice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;po&quot;&gt;Poland&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;me&quot;&gt;Middle East&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;os&quot;&gt;Osaka&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;ve&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Climate change&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Overtourism&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Different needs from inhabitants&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Gentrification&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Structuration&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Climate change&lt;/b&gt;: &lt;i&gt;acqua alta&lt;/i&gt; (exceptional high tides) and sea-level rise, a local example of the global effects of the &lt;a href=&quot;#s1&quot;&gt;Anthropocene&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Overtourism&lt;/b&gt;: a flow of &lt;i&gt;people&lt;/i&gt; so intense that it exceeds what the place can sustain (&lt;a href=&quot;#s4&quot;&gt;Part 4&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Different needs from inhabitants&lt;/b&gt;: residents, commuters and tourists ask for different things (&lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Gentrification&lt;/b&gt;: wealthier inhabitants or uses arrive (short-term rentals, second homes), prices rise and the original inhabitants leave.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Structuration&lt;/b&gt;: the key issue is institutional, i.e. who governs the flows and with what rules.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;po&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Seasonality&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ageing&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Climate change&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Denomination&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Seasonality&lt;/b&gt;: the population present changes with the seasons (tourism, agricultural work), so the inhabitants vary over time.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ageing&lt;/b&gt;: population ageing and therefore different needs (the &lt;i&gt;age&lt;/i&gt; criterion).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Climate change&lt;/b&gt;: once again, the global scale entering the local.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Denomination&lt;/b&gt;: the key act is symbolic, i.e. how places are named, renamed and represented (in a country whose borders and names have changed several times in history).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;me&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Ethnical and gender division&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Unequal distribution of resources&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Different external processes of territorialisation&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Ethnical and gender division&lt;/b&gt;: space is divided according to the &lt;i&gt;other criteria&lt;/i&gt; of slide 10 (ethnicity, gender), so access to places is not equal for everyone.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Unequal distribution of resources&lt;/b&gt;: water, land and energy are unequally distributed, i.e. a problem of &lt;i&gt;spatial justice&lt;/i&gt; (&lt;a href=&quot;#s3&quot;&gt;Part 3&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Different external processes of territorialisation&lt;/b&gt;: borders, names and infrastructure imposed by external actors (&lt;i&gt;external&lt;/i&gt; logic, &lt;a href=&quot;#s6&quot;&gt;Part 6&lt;/a&gt;), often competing with one another.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;os&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Water level&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ageing&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Denomination&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Water level&lt;/b&gt;: a coastal delta city exposed to sea-level rise, storm surges and subsidence, hence an issue of &lt;i&gt;vulnerability &amp;amp; resilience&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ageing&lt;/b&gt;: Japan is one of the oldest societies in the world.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Denomination&lt;/b&gt;: how the city constructs and communicates its own identity and place-names.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Overview&lt;/h3&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Theme&lt;/th&gt;&lt;th&gt;Venice&lt;/th&gt;&lt;th&gt;Poland&lt;/th&gt;&lt;th&gt;Middle East&lt;/th&gt;&lt;th&gt;Osaka&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Climate / water&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Ageing&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Flows of people&lt;/td&gt;&lt;td&gt;● overtourism&lt;/td&gt;&lt;td&gt;● seasonality&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inequalities&lt;/td&gt;&lt;td&gt;● gentrification&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;● resources, ethnicity, gender&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Act of territorialisation&lt;/td&gt;&lt;td&gt;structuration&lt;/td&gt;&lt;td&gt;denomination&lt;/td&gt;&lt;td&gt;external processes&lt;/td&gt;&lt;td&gt;denomination&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;The table shows the point of the lecture: the global challenges of the &lt;a href=&quot;#s3&quot;&gt;Urbanocene&lt;/a&gt; (climate, flows, ageing) always arrive &lt;i&gt;in a place&lt;/i&gt;, filtered through its way of inhabiting and territorialising.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 7&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Which two cases share both &lt;i&gt;ageing&lt;/i&gt; and &lt;i&gt;denomination&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Venice and Middle East&lt;/button&gt;&lt;button&gt;Poland and Osaka&lt;/button&gt;&lt;button&gt;Venice and Osaka&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Poland and Osaka; Poland adds seasonality and climate change, Osaka water level.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Exercise: choose a city you know and fill in its row&lt;/summary&gt;&lt;div&gt;Answer four questions. Which flows (trade, information, objects, people) pass through it? Who are its inhabitants (residents, commuters, migrants, tourists…)? Which act of territorialisation is decisive today, and does it follow a self-centered or an external logic? Which goal of Lussault&#x27;s model is most at risk?&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Further reading&lt;/div&gt;
&lt;h2&gt;Authors, studies and texts cited in the slides&lt;/h2&gt;
&lt;p&gt;Each card shows what appears in the slides and adds &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; information found through web research, with the link. Always verify bibliographic details in a library catalogue.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crutzen, P. J. &amp;amp; Stoermer, E. F. (2000), “The ‘Anthropocene’”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt; 41, pp. 17–18. In the slides: full text (slide 1).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry, text&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;The article that introduced the term into scientific debate: short, readable, worth reading in full.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Steffen, W., Broadgate, W., Deutsch, L., Gaffney, O. &amp;amp; Ludwig, C. (2015), “The trajectory of the Anthropocene: The Great Acceleration”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;The Anthropocene Review&lt;/i&gt; 2(1), pp. 81–98. DOI 10.1177/2053019614564785. In the slides: the 24 graphs (slides 2–3).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://journals.sagepub.com/doi/10.1177/2053019614564785&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sage&lt;/a&gt; · &lt;a href=&quot;https://openresearch-repository.anu.edu.au/bitstream/1885/66463/8/01_Steffen_GREAT%20ACCELERATION_2015.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF in the ANU repository&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Updates the 2004 graphs to 2010 and distinguishes OECD countries, emerging economies and the rest of the world. Useful for discussing who is really driving the acceleration.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vitousek, P. M., Mooney, H. A., Lubchenco, J. &amp;amp; Melillo, J. M. (1997), “Human Domination of Earth&#x27;s Ecosystems”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Science&lt;/i&gt; 277(5325), pp. 494–499. Cited in slide 1 for the figure of 30–50% of land transformed.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://doi.org/10.1126/science.277.5325.494&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.1126/science.277.5325.494&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;One of the most cited texts on human impact: land, CO₂, the nitrogen cycle, water, extinctions. It concludes that we live on a “human-dominated planet”.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Berger, A. &amp;amp; Loutre, M.-F. (2002), “An Exceptionally Long Interglacial Ahead?”&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Science&lt;/i&gt; 297, pp. 1287–1288. In slide 1 for the 50,000-year horizon.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://dial.uclouvain.be/pr/boreal/fr/object/boreal%3A9224&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UCLouvain record&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/spr/climat/v46y2000i1d10.1023_a1005559827189.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;related article in &lt;i&gt;Climatic Change&lt;/i&gt; (2000)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Shows with climate models that the current interglacial could last ~50,000 years. Human emissions therefore act on geological timescales.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Marsh, G. P. (1864), &lt;i&gt;Man and Nature; or, Physical Geography as Modified by Human Action&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;In slide 1 among the precursors.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://gutenberg.org/ebooks/37957&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Gutenberg, free text&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;A founding text of environmentalism and of the geography of human impact. It was translated into Italian in 1872 and influenced Stoppani.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Stoppani, A. (1873), &lt;i&gt;Corso di geologia&lt;/i&gt; and the “anthropozoic era”&lt;/h4&gt;&lt;p&gt;In slide 1: humans as a “new telluric force”.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Antonio_Stoppani&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Antonio Stoppani&lt;/a&gt; · &lt;a href=&quot;https://www4.ti.ch/fileadmin/DT/temi/mcsn/Monte_San_Giorgio/documentazione/Stockar_-_2020_-_L_era_in_cui_l_uomo_domina_la_terra.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stockar 2020, “L&#x27;era in cui l&#x27;uomo domina la terra”&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;An Italian precursor of the idea of the Anthropocene. The term already appears in 1867–1873 and never entered the official geological time scale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vernadsky, V. I. (1926), &lt;i&gt;The Biosphere&lt;/i&gt;; Teilhard de Chardin, P. &amp;amp; Le Roy, É., &lt;i&gt;noösphere&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;In slide 1: the biosphere and the “sphere of thought”.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Noosphere&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Noosphere&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;The concept emerged from exchanges among the three scholars in Paris in the 1920s. For Vernadsky it is a geological idea, for Teilhard a theological one. Sources disagree on who coined the term.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lyell, C. (1833) and the International Geological Congress in Bologna (1885)&lt;/h4&gt;&lt;p&gt;In slide 1 for the origin of the name Holocene.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.britannica.com/science/Holocene-Epoch&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica, Holocene Epoch&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Specifies that Lyell proposed “Recent” and that “Holocene” dates from 1867 and was presented in Bologna in 1885.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lussault, M., &lt;i&gt;L&#x27;Homme spatial&lt;/i&gt; (2007), &lt;i&gt;L&#x27;Avènement du monde&lt;/i&gt; (2013), &lt;i&gt;Hyper-lieux&lt;/i&gt; (2017), Seuil&lt;/h4&gt;&lt;p&gt;In slides 5–6: the model of the Urbanocene (2022) and the book covers.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://espacestemps.net/articles/homme-spatial-prend-places/?pdf=28628&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EspacesTemps on &lt;i&gt;L&#x27;Homme spatial&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.letemps.ch/culture/une-habitation-humaine-planete&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps on &lt;i&gt;L&#x27;Avènement du monde&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.letemps.ch/suisse/arpenter-geneve-recherche-hyperlieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps on &lt;i&gt;Hyper-lieux&lt;/i&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;These are the theoretical references of the lecture: space as a social construction, inhabiting the Earth, the hyper-places of mondialization.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lussault and the “urbanocène”&lt;/h4&gt;&lt;p&gt;In slide 4: “Anthropocene could be considered as an Urbanocene”.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://live-global-metro-studies.pantheon.berkeley.edu/events/michel-lussault-could-anthropocene-be-urbanocene/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UC Berkeley, “Could Anthropocene be Urbanocene?”&lt;/a&gt; · &lt;a href=&quot;https://metropolitics.org/IMG/pdf/met-devisme-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Metropolitics, review of &lt;i&gt;Cohabitons!&lt;/i&gt; (2024)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Explains why urbanization would be the real driver of global change.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lévy, J. &amp;amp; Lussault, M. (eds.), &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Not cited in the slides, but it is the source of the concepts of space, spatiality and inhabiting (slide 10).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://revistaseug.ugr.es/index.php/cuadgeo/article/view/1790&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in &lt;i&gt;Cuadernos Geográficos&lt;/i&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;The reference dictionary of French-language social geography (Belin, 2003; new ed. 2013).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Turco, A., theory of territorialisation&lt;/h4&gt;&lt;p&gt;Not cited in the slides; the probable source of the triad denomination, reification, structuration (slides 11–12).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://web.unica.it/static/resources/cms/documents/1.0.CattedraTerritorio_Territorializzazione.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Cagliari, “Territorializzazione”&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Defines territory as a social artifact produced by three territorialising acts.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IUGS / ICS (2024), decision on the Anthropocene&lt;/h4&gt;&lt;p&gt;Not in the slides: an update on the state of the debate.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Vienna, statement&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;The Anthropocene is not a formal geological epoch, but it remains a central concept for the human and environmental sciences.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
/* tabs */
document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(t){
  var bs=t.querySelectorAll(&#x27;:scope&gt;.tablist button&#x27;),ps=t.querySelectorAll(&#x27;:scope&gt;.panel&#x27;);
  bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    bs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===b)});
    ps.forEach(function(p){p.hidden=p.dataset.p!==b.dataset.t});
  })});
});
/* quiz */
document.querySelectorAll(&#x27;.q&#x27;).forEach(function(q){
  var ok=+q.dataset.ok,bs=q.querySelectorAll(&#x27;.opts button&#x27;);
  bs.forEach(function(b,i){b.addEventListener(&#x27;click&#x27;,function(){
    bs.forEach(function(x,j){x.disabled=true;if(j===ok)x.classList.add(&#x27;right&#x27;)});
    if(i!==ok)b.classList.add(&#x27;wrong&#x27;);q.classList.add(&#x27;done&#x27;);
  })});
  var r=q.querySelector(&#x27;.retry&#x27;);if(r)r.addEventListener(&#x27;click&#x27;,function(){
    bs.forEach(function(x){x.disabled=false;x.classList.remove(&#x27;right&#x27;,&#x27;wrong&#x27;)});q.classList.remove(&#x27;done&#x27;);
  });
});
/* steppers */
document.querySelectorAll(&#x27;[data-steps]&#x27;).forEach(function(s){
  var st=s.querySelectorAll(&#x27;.step&#x27;),n=st.length,rg=s.querySelector(&#x27;input[type=range]&#x27;),pv=s.querySelector(&#x27;.prev&#x27;),nx=s.querySelector(&#x27;.next&#x27;),c=0;
  function go(i){c=Math.max(0,Math.min(n-1,i));
    st.forEach(function(e,k){e.classList.toggle(&#x27;cur&#x27;,k===c)});
    s.querySelectorAll(&#x27;[data-lv]&#x27;).forEach(function(e){var l=+e.dataset.lv;e.classList.toggle(&#x27;on&#x27;,l&lt;=c);e.classList.toggle(&#x27;now&#x27;,l===c)});
    if(rg)rg.value=c;if(pv)pv.disabled=c===0;if(nx)nx.disabled=c===n-1;}
  if(rg){rg.max=n-1;rg.addEventListener(&#x27;input&#x27;,function(){go(+rg.value)})}
  if(pv)pv.addEventListener(&#x27;click&#x27;,function(){go(c-1)});
  if(nx)nx.addEventListener(&#x27;click&#x27;,function(){go(c+1)});
  go(0);
});
/* clickable svg nodes + chips with info panels */
document.querySelectorAll(&#x27;[data-info-group]&#x27;).forEach(function(g){
  var out=document.getElementById(g.dataset.infoGroup),items=g.querySelectorAll(&#x27;[data-k]&#x27;),tpl=g.querySelectorAll(&#x27;template[data-for]&#x27;);
  var map={};tpl.forEach(function(t){map[t.dataset.for]=t.innerHTML});
  function pick(el){items.forEach(function(x){var m=x.dataset.k===el.dataset.k;x.classList.toggle(&#x27;sel&#x27;,m);x.classList.toggle(&#x27;on&#x27;,m)});
    if(out)out.innerHTML=map[el.dataset.k]||&#x27;&#x27;;
    var mk=g.querySelectorAll(&#x27;[data-mark]&#x27;);mk.forEach(function(m){m.style.opacity=m.dataset.mark===el.dataset.k?1:.25});}
  items.forEach(function(el){
    el.addEventListener(&#x27;click&#x27;,function(){pick(el)});
    el.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();pick(el)}});
  });
  if(items[0])pick(items[0]);
});
/* toggles (areal/network) */
document.querySelectorAll(&#x27;[data-toggle]&#x27;).forEach(function(w){
  var svg=w.querySelector(&#x27;svg&#x27;),bs=w.querySelectorAll(&#x27;[data-mode]&#x27;);
  bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b)});
    w.querySelectorAll(&#x27;[data-show]&#x27;).forEach(function(e){e.style.display=e.dataset.show===b.dataset.mode?&#x27;&#x27;:&#x27;none&#x27;});
  })});
  if(bs[0])bs[0].click();
});
/* Great Acceleration chart */
var D={
 co2:{n:&#x27;CO₂&#x27;,u:&#x27;ppm&#x27;,z:false,p:[[1750,277],[1800,282],[1850,285],[1900,296],[1950,311],[1975,331],[2000,369],[2010,389]]},
 ch4:{n:&#x27;Methane&#x27;,u:&#x27;ppb&#x27;,z:false,p:[[1750,700],[1800,720],[1850,790],[1900,880],[1950,1130],[1975,1480],[2000,1750],[2010,1780]]},
 pop:{n:&#x27;Population&#x27;,u:&#x27;billion&#x27;,z:true,p:[[1750,.77],[1800,.98],[1850,1.26],[1900,1.65],[1950,2.5],[1975,4.1],[2000,6.1],[2010,6.9]]},
 urb:{n:&#x27;Urban population&#x27;,u:&#x27;billion&#x27;,z:true,p:[[1750,.05],[1800,.07],[1850,.1],[1900,.22],[1950,.75],[1975,1.5],[2000,2.85],[2010,3.5]]},
 gdp:{n:&#x27;Real GDP&#x27;,u:&#x27;trillion US$&#x27;,z:true,p:[[1750,.3],[1800,.4],[1850,.7],[1900,2],[1950,7],[1975,22],[2000,47],[2010,63]]},
 en:{n:&#x27;Primary energy&#x27;,u:&#x27;EJ&#x27;,z:true,p:[[1750,20],[1800,22],[1850,25],[1900,45],[1950,100],[1975,280],[2000,420],[2010,530]]},
 dam:{n:&#x27;Large dams&#x27;,u:&#x27;thousand&#x27;,z:true,p:[[1750,0],[1800,0],[1850,.1],[1900,.5],[1950,5.5],[1975,22],[2000,31],[2010,32]]},
 tfl:{n:&#x27;Tropical forest loss&#x27;,u:&#x27;% area&#x27;,z:true,p:[[1750,1],[1800,2],[1850,3.5],[1900,7],[1950,16],[1975,21],[2000,25],[2010,28]]}
};
var pick=document.getElementById(&#x27;gaPick&#x27;),svg=document.getElementById(&#x27;gaChart&#x27;);
if(pick&amp;&amp;svg){
 var yr=document.getElementById(&#x27;gaYear&#x27;),cur=&#x27;co2&#x27;,NS=&#x27;http://www.w3.org/2000/svg&#x27;;
 function f(p,y){for(var i=0;i&lt;p.length-1;i++){if(y&lt;=p[i+1][0]){var a=p[i],b=p[i+1];return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0])}}return p[p.length-1][1]}
 function fmt(v){return v&gt;=100?Math.round(v).toLocaleString(&#x27;en-GB&#x27;):v&gt;=10?v.toFixed(1):v.toFixed(2)}
 Object.keys(D).forEach(function(k){var b=document.createElement(&#x27;button&#x27;);b.textContent=D[k].n;b.className=&#x27;chip&#x27;;b.dataset.k=k;
  b.addEventListener(&#x27;click&#x27;,function(){cur=k;draw()});pick.appendChild(b)});
 function draw(){
  var d=D[cur],Y=+yr.value,x0=56,x1=620,y0=260,y1=20;
  var vals=d.p.map(function(q){return q[1]}),mx=Math.max.apply(0,vals),mn=d.z?0:Math.min.apply(0,vals);
  var pad=(mx-mn)*.06;mx+=pad;if(!d.z)mn-=pad;
  function X(y){return x0+(y-1750)/(260)*(x1-x0)}function V(v){return y0-(v-mn)/(mx-mn)*(y0-y1)}
  var full=&#x27;&#x27;,part=&#x27;&#x27;;for(var y=1750;y&lt;=2010;y+=5){var pt=X(y).toFixed(1)+&#x27;,&#x27;+V(f(d.p,y)).toFixed(1);full+=(y===1750?&#x27;M&#x27;:&#x27;L&#x27;)+pt;if(y&lt;=Y)part+=(y===1750?&#x27;M&#x27;:&#x27;L&#x27;)+pt}
  var area=part+&#x27;L&#x27;+X(Y).toFixed(1)+&#x27;,&#x27;+y0+&#x27;L&#x27;+x0+&#x27;,&#x27;+y0+&#x27;Z&#x27;;
  var h=&#x27;&lt;rect x=&quot;&#x27;+x0+&#x27;&quot; y=&quot;&#x27;+y1+&#x27;&quot; width=&quot;&#x27;+(x1-x0)+&#x27;&quot; height=&quot;&#x27;+(y0-y1)+&#x27;&quot; class=&quot;f-card&quot;/&gt;&#x27;;
  for(var t=1750;t&lt;=2000;t+=50)h+=&#x27;&lt;line x1=&quot;&#x27;+X(t)+&#x27;&quot; x2=&quot;&#x27;+X(t)+&#x27;&quot; y1=&quot;&#x27;+y1+&#x27;&quot; y2=&quot;&#x27;+y0+&#x27;&quot; class=&quot;s-rule&quot;/&gt;&lt;text x=&quot;&#x27;+X(t)+&#x27;&quot; y=&quot;&#x27;+(y0+18)+&#x27;&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+t+&#x27;&lt;/text&gt;&#x27;;
  for(var i=0;i&lt;=4;i++){var vv=mn+(mx-mn)*i/4;h+=&#x27;&lt;text x=&quot;&#x27;+(x0-6)+&#x27;&quot; y=&quot;&#x27;+(V(vv)+4)+&#x27;&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; class=&quot;f-muted&quot; style=&quot;fill:var(--muted)&quot;&gt;&#x27;+fmt(vv)+&#x27;&lt;/text&gt;&#x27;}
  h+=&#x27;&lt;line x1=&quot;&#x27;+X(1950)+&#x27;&quot; x2=&quot;&#x27;+X(1950)+&#x27;&quot; y1=&quot;&#x27;+y1+&#x27;&quot; y2=&quot;&#x27;+y0+&#x27;&quot; stroke-dasharray=&quot;4 4&quot; class=&quot;s-ink&quot; stroke-width=&quot;1.4&quot;/&gt;&#x27;;
  h+=&#x27;&lt;path d=&quot;&#x27;+area+&#x27;&quot; class=&quot;t85&quot; opacity=&quot;.9&quot;/&gt;&lt;path d=&quot;&#x27;+full+&#x27;&quot; fill=&quot;none&quot; class=&quot;s-rule&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;&#x27;+part+&#x27;&quot; fill=&quot;none&quot; class=&quot;sd85&quot; stroke-width=&quot;3&quot;/&gt;&#x27;;
  h+=&#x27;&lt;circle cx=&quot;&#x27;+X(Y)+&#x27;&quot; cy=&quot;&#x27;+V(f(d.p,Y))+&#x27;&quot; r=&quot;6&quot; class=&quot;f-acc&quot;/&gt;&#x27;;
  h+=&#x27;&lt;text x=&quot;&#x27;+(x0+8)+&#x27;&quot; y=&quot;&#x27;+(y1+20)+&#x27;&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;&#x27;+d.n+&#x27; &lt;tspan font-weight=&quot;400&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;(&#x27;+d.u+&#x27;)&lt;/tspan&gt;&lt;/text&gt;&#x27;;
  h+=&#x27;&lt;text x=&quot;&#x27;+(X(1950)+5)+&#x27;&quot; y=&quot;&#x27;+(y0-6)+&#x27;&quot; font-size=&quot;11&quot;&gt;1950&lt;/text&gt;&#x27;;
  svg.innerHTML=h;
  document.getElementById(&#x27;gaYearOut&#x27;).textContent=Y;
  var v=f(d.p,Y),v0=d.p[0][1],v1=d.p[d.p.length-1][1];
  document.getElementById(&#x27;gaVal&#x27;).textContent=fmt(v)+&#x27; &#x27;+d.u;
  document.getElementById(&#x27;gaX&#x27;).textContent=v0&gt;0?&#x27;×&#x27;+fmt(v/v0):&#x27;from ~0&#x27;;
  document.getElementById(&#x27;gaShare&#x27;).textContent=Math.round((v1-f(d.p,1950))/(v1-v0)*100)+&#x27;%&#x27;;
  pick.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.classList.toggle(&#x27;on&#x27;,b.dataset.k===cur)});
 }
 yr.addEventListener(&#x27;input&#x27;,draw);draw();
}
})();
&lt;/script&gt;
