&lt;h1&gt;From the &lt;em&gt;Anthropocene&lt;/em&gt; to the &lt;em&gt;Urbanocene&lt;/em&gt;: inhabiting and territorialising a networked world&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Human beings have become a geological force; growth explodes after 1950; the driving force is urbanization. Reading this world requires networks, flows, inhabitants and territories.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;13 slides · &lt;em&gt;Week two.pdf&lt;/em&gt;&lt;/span&gt;&lt;span&gt;8 parts · self-checks at the end of each part&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot; style=&quot;--h:250;margin-top:22px;font-size:.92rem&quot;&gt;
&lt;b&gt;How to read this page.&lt;/b&gt; The main text explains and expands on the slides (&lt;span class=&quot;slide&quot;&gt;slide n&lt;/span&gt; indicates which slide a piece of content comes from). Parts marked &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; come from web research and include the link. Technical terms are kept in English, as in the course.
The other files in the &lt;code&gt;corso/&lt;/code&gt; folder could not be accessed in this session (their contents could not be listed), so there are no links to other lectures: compare this material yourself with the syllabus and the other weeks.

&lt;a href=&quot;#s5&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;410&quot; y=&quot;410&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;18&quot;&gt;Inhabiting&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;space · spatiality · inhabitants&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
&lt;a href=&quot;#s6&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;660&quot; y=&quot;410&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;785&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;17&quot;&gt;socio-territorial systems&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Territorialisation: 3 acts&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
&lt;a href=&quot;#s7&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;410&quot; width=&quot;320&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t25 sd25&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;18&quot;&gt;Cases: Venice · Poland&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Middle East · Osaka&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

&lt;!-- S1 --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part&quot; style=&quot;--h:25&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 1 · slide 1&lt;/div&gt;
&lt;h2&gt;Anthropocene: when humankind becomes a geological force&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 1&lt;/span&gt; “Reading and discussing…”: the slide reproduces the full text of a short article. It is &lt;b&gt;Paul J. Crutzen &amp;amp; Eugene F. Stoermer, “The ‘Anthropocene’”&lt;/b&gt;, &lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt; 41, May 2000, pp. 17–18 &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; (identified via the &lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry&lt;/a&gt;; the slide gives neither authors nor title).&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Anthropocene&lt;/b&gt; — from &lt;i&gt;anthropos&lt;/i&gt;, “human being”, and &lt;i&gt;kainos&lt;/i&gt;, “new/recent”: the name proposed for the current geological epoch, in which human activities are so large that they alter climate, atmosphere, soils, oceans and the biosphere on a global scale. The article proposes it “to emphasize the central role of mankind in geology and ecology”.&lt;/div&gt;

&lt;h3&gt;First of all: what is a geological “epoch”?&lt;/h3&gt;
&lt;p&gt;The slides take this for granted. Geologists divide Earth&#x27;s history into nested units, recognisable in layers of rock and sediment: &lt;b&gt;eon › era › period › epoch › age&lt;/b&gt;. We live in the Phanerozoic eon, Cenozoic era, Quaternary period, &lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt; epoch.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Hierarchical scale of geological time down to the Holocene&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;740&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t250&quot;/&gt;&lt;text x=&quot;20&quot; y=&quot;28&quot;&gt;Eon · Phanerozoic (from 541 million years ago)&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;42&quot; width=&quot;500&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t150&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;60&quot;&gt;Era · Cenozoic (66 Ma)&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;74&quot; width=&quot;250&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t85&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;92&quot;&gt;Period · Quaternary (2.58 Ma)&lt;/text&gt;
&lt;rect x=&quot;650&quot; y=&quot;106&quot; width=&quot;100&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;d25&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Holocene&lt;/text&gt;
&lt;text x=&quot;640&quot; y=&quot;126&quot; text-anchor=&quot;end&quot; class=&quot;f-muted&quot; style=&quot;fill:var(--muted)&quot;&gt;epoch · last ~11,700 years →&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Diagram not to scale. Reference dates from the International Chronostratigraphic Chart, added for orientation.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;The &lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt; (“Recent Whole”, i.e. “entirely recent”) is the post-glacial epoch of the last 10–12 thousand years: the relatively stable climate in which agriculture, cities and writing systems emerged. Proposing the &lt;span class=&quot;tech&quot;&gt;Anthropocene&lt;/span&gt; means claiming that this stability has ended &lt;i&gt;because of us&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; According to the &lt;a href=&quot;https://www.britannica.com/science/Holocene-Epoch&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Encyclopaedia Britannica&lt;/a&gt;, in 1833 Lyell proposed the name &lt;i&gt;Recent&lt;/i&gt;; the term &lt;i&gt;Holocene&lt;/i&gt; was reportedly proposed in 1867 and presented at the International Geological Congress in Bologna in 1885. The article in the slides instead attributes the name to Lyell (“seems to have been proposed”): the word “seems” itself signals the uncertainty.&lt;/div&gt;

&lt;h3&gt;A genealogy of the idea&lt;/h3&gt;
&lt;p&gt;Crutzen and Stoermer insist that the idea of humans as a geological force is not new. Open the milestones:&lt;/p&gt;
&lt;ol class=&quot;tl&quot;&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1833 / 1885&lt;/span&gt;Lyell, Bologna Congress&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;The name of the post-glacial epoch, the &lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt;, is born and adopted by the International Geological Congress in Bologna (1885).&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1864&lt;/span&gt;G. P. Marsh, &lt;i&gt;Man and Nature&lt;/i&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;The American diplomat and scholar documents how deforestation, irrigation and land reclamation modify physical geography. Reprinted as &lt;i&gt;The Earth as Modified by Human Action&lt;/i&gt;. A founding text of environmentalism.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1873&lt;/span&gt;A. Stoppani, “anthropozoic era”&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;The Italian geologist describes human activity as “a new telluric force which in power and universality may be compared to the greater forces of earth” and speaks of an &lt;span class=&quot;tech&quot;&gt;anthropozoic era&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1924&lt;/span&gt;Teilhard de Chardin &amp;amp; É. Le Roy, “noösphere”&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;They coin &lt;span class=&quot;tech&quot;&gt;noösphere&lt;/span&gt;, the “sphere of thought”: the world of human thought which, through the brain and technology, shapes its own future and its own environment.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1926&lt;/span&gt;V. I. Vernadsky, &lt;i&gt;The Biosphere&lt;/i&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;The Russian geologist recognises the growing power of humankind as part of the &lt;span class=&quot;tech&quot;&gt;biosphere&lt;/span&gt; (the planet&#x27;s living envelope): evolution proceeds “towards increasing consciousness and thought, and forms having greater and greater influence on their surroundings”.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details open&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;2000&lt;/span&gt;Crutzen &amp;amp; Stoermer, “Anthropocene”&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;They propose the term for the current epoch. Crutzen is an atmospheric chemist (Nobel Prize 1995 for his work on ozone), Stoermer a freshwater biologist.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;/ol&gt;

&lt;h3&gt;The evidence: how heavy is the human footprint?&lt;/h3&gt;
&lt;p&gt;The article lists measurable impacts. Click a card for an explanation of the terms.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;×10&lt;/b&gt;&lt;small&gt;population over 3 centuries, to 6 billion; cattle to 1.4 billion&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Roughly one cow per average family. Urbanization has increased tenfold in the past century.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;30–50%&lt;/b&gt;&lt;small&gt;of the land surface transformed by humans&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Figure taken from Vitousek et al. (1997): cropland, pasture, cities, roads.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;≥ 2×&lt;/b&gt;&lt;small&gt;anthropogenic SO₂ compared with natural emissions&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;About 160 Tg/year of sulphur dioxide from coal and oil. &lt;b&gt;Tg&lt;/b&gt; = teragram = one million tonnes. Natural sources are mainly dimethyl sulphide emitted by the oceans.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;&amp;gt; natural&lt;/b&gt;&lt;small&gt;nitrogen fixed industrially for fertilizers&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;More nitrogen is fixed synthetically (an industrial process that converts atmospheric N₂ into fertilizer) than by all terrestrial ecosystems. NO from combustion also exceeds natural inputs and produces &lt;span class=&quot;tech&quot;&gt;photochemical ozone&lt;/span&gt; (“smog”, ground-level ozone formed by light-driven reactions).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;&amp;gt; 50%&lt;/b&gt;&lt;small&gt;of accessible fresh water used by humankind&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Irrigation, industry, cities.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;×1000–10,000&lt;/b&gt;&lt;small&gt;extinction rate in tropical rainforests&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Compared with the natural “background” rate.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;CO₂ +30% · CH₄ +100%&lt;/b&gt;&lt;small&gt;greenhouse gases in the atmosphere&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tech&quot;&gt;Greenhouse gases&lt;/span&gt;: gases that trap the heat emitted by the Earth. Carbon dioxide (CO₂) and methane (CH₄) are the main anthropogenic ones.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;hole&lt;/b&gt;&lt;small&gt;in the Antarctic ozone layer caused by CFCs&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Chlorofluorocarbons are not toxic, but they destroy the stratospheric ozone that protects us from UV radiation. Without international regulation (the Montreal Protocol, 1987, which the slide does not mention) they would have destroyed much of the ozone layer.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;−50%&lt;/b&gt;&lt;small&gt;of the world&#x27;s mangroves&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Coastal wetlands have been converted (aquaculture, urbanization).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;25–35%&lt;/b&gt;&lt;small&gt;of ocean primary production removed by fisheries&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tech&quot;&gt;Primary production&lt;/span&gt;: the biomass produced by photosynthesis (phytoplankton), the base of the food chain. Over 25% in &lt;span class=&quot;tech&quot;&gt;upwelling&lt;/span&gt; zones (where nutrient-rich deep waters rise to the surface) and 35% on temperate continental shelves.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;p&gt;Lake sediments also record these effects, even in places far from pollution sources. And according to Berger and Loutre, because of CO₂ emissions the climate may depart from its natural behaviour for the next &lt;b&gt;50,000 years&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;When does it begin?&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;a&quot;&gt;Late 18th century&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;b&quot;&gt;The whole Holocene&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;c&quot;&gt;From 1950&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d&quot;&gt;And today?&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;Crutzen and Stoermer&#x27;s proposal.&lt;/b&gt; Dating the beginning is “somewhat arbitrary”, but they choose the second half of the 18th century because:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;ice cores&lt;/b&gt; (air bubbles trapped in the ice) show the rise in CO₂ and CH₄ from that time onwards;&lt;/li&gt;&lt;li&gt;it coincides with &lt;b&gt;James Watt&#x27;s steam engine&lt;/b&gt; (1784), the symbol of the onset of the Industrial Revolution and of the massive use of fossil fuels.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;b&quot; hidden&gt;&lt;p&gt;Some, the authors note, would include the &lt;b&gt;entire Holocene&lt;/b&gt;: with agriculture, deforestation and animal husbandry, human impact begins thousands of years ago. The risk is that Anthropocene and Holocene become the same thing.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;Slide 2 shows that almost all curves surge after &lt;b&gt;1950&lt;/b&gt;: this is the &lt;a href=&quot;#s2&quot;&gt;Great Acceleration&lt;/a&gt;. The Anthropocene Working Group later proposed precisely the mid-twentieth century as the starting point.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;d&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In March 2024 the Subcommission on Quaternary Stratigraphy rejected the proposal to make the Anthropocene a formal epoch (beginning in 1950, with its “golden spike” in the sediments of Crawford Lake, Canada), and the International Union of Geological Sciences (IUGS) confirmed the decision. For the IUGS, however, the term remains a valuable descriptor of human–environment interactions (&lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Vienna, statement&lt;/a&gt;; &lt;a href=&quot;https://climateandcapitalism.com/2024/03/21/top-geology-body-denies-appeal-rejects-anthropocene-proposal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate &amp;amp; Capitalism&lt;/a&gt;). Officially, then, we still live in the Holocene: in the course the term is used as an interpretive concept.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Why do Crutzen and Stoermer place the start of the Anthropocene in the late 18th century?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Because it marks the beginning of agriculture&lt;/button&gt;&lt;button&gt;Because of the first nuclear explosion&lt;/button&gt;&lt;button&gt;Because ice cores show the rise in CO₂ and CH₄ from then on, coinciding with Watt&#x27;s engine&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Agriculture points to the whole Holocene, atomic bombs to 1945–50. The authors choose the global effects that are “clearly noticeable” over the last two centuries.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Who first spoke of an “anthropozoic era”?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Antonio Stoppani, 1873&lt;/button&gt;&lt;button&gt;Vladimir Vernadsky, 1926&lt;/button&gt;&lt;button&gt;George P. Marsh, 1864&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Stoppani; Marsh wrote &lt;i&gt;Man and Nature&lt;/i&gt;, Vernadsky &lt;i&gt;The Biosphere&lt;/i&gt;; the term &lt;i&gt;noösphere&lt;/i&gt; is due to Teilhard de Chardin and Le Roy.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: in what sense are humans a “geological” force and not merely an “environmental” one?&lt;/summary&gt;&lt;div&gt;Because their effects are inscribed in the planet&#x27;s archives (ice, lake sediments, the chemistry of the atmosphere and oceans), are global and will last for tens of thousands of years: like an eruption or a glaciation, not like local damage.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 2 · slides 2–3&lt;/div&gt;
&lt;h2&gt;Great Acceleration: 24 curves, a single turning point&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slides 2–3&lt;/span&gt; Will Steffen, Wendy Broadgate, Lisa Deutsch, Owen Gaffney, Cornelia Ludwig, “The trajectory of the Anthropocene: The Great Acceleration”, &lt;i&gt;The Anthropocene Review&lt;/i&gt;, 2015, vol. 2, no. 1, pp. 81–98, Sage.&lt;/p&gt;
&lt;p&gt;Steffen&#x27;s group compiled 24 time series from 1750 to 2010. Twelve measure society (&lt;span class=&quot;tech&quot;&gt;socio-economic trends&lt;/span&gt;), twelve the state of the planet (&lt;span class=&quot;tech&quot;&gt;Earth system trends&lt;/span&gt;, the Earth system: atmosphere, oceans, soils and biosphere taken together). In every graph a dashed line marks &lt;b&gt;1950&lt;/b&gt;: from there almost all the curves turn vertical. This is the &lt;span class=&quot;tech&quot;&gt;Great Acceleration&lt;/span&gt;.&lt;/p&gt;

&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;se&quot;&gt;Socio-economic trends (slide 3)&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;es&quot;&gt;Earth system trends (slide 2)&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;se&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Population&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Real GDP&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Foreign direct investment&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Urban population&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Primary energy use&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Fertilizer consumption&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Large dams&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Water use&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Paper production&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Transportation&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Telecommunications&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;International tourism&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Real GDP&lt;/b&gt;: gross domestic product adjusted for inflation. &lt;b&gt;Foreign direct investment&lt;/b&gt;: investment by firms in foreign countries, a measure of economic globalization. &lt;b&gt;Primary energy&lt;/b&gt;: energy in the form in which it is extracted (coal, oil, gas, hydro…), in exajoules (EJ, 10¹⁸ joules). Some series begin only after 1950 (international tourism, telephones, vehicles): they are almost invisible before then.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;es&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Carbon dioxide&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Nitrous oxide&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Methane&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Stratospheric ozone&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Surface temperature&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ocean acidification&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Marine fish capture&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Shrimp aquaculture&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Nitrogen to coastal zone&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Tropical forest loss&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Domesticated land&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Terrestrial biosphere degradation&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;ppm/ppb&lt;/b&gt;: parts per million/billion, the concentration of a gas. &lt;b&gt;Ocean acidification&lt;/b&gt;: the ocean absorbs CO₂ and becomes more acidic (hydrogen ion concentration increases). &lt;b&gt;Nitrogen to coastal zone&lt;/b&gt;: fertilizer nitrogen that ends up in the sea. &lt;b&gt;Terrestrial biosphere degradation&lt;/b&gt;: loss of mean species abundance. &lt;b&gt;Surface temperature&lt;/b&gt;: anomaly relative to a reference mean, in °C.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Explore the curves&lt;/h3&gt;
&lt;p&gt;Choose an indicator and move the year slider. The readout below shows how much it has grown and what share of the total 1750–2010 growth occurred &lt;i&gt;after&lt;/i&gt; 1950.&lt;/p&gt;
&lt;div class=&quot;chartbox&quot;&gt;
&lt;div class=&quot;tablist&quot; id=&quot;gaPick&quot; style=&quot;margin:0 0 10px&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;gaChart&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Interactive chart of the Great Acceleration&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot; style=&quot;display:flex;gap:10px;align-items:center;margin-top:6px&quot;&gt;&lt;label for=&quot;gaYear&quot; style=&quot;font-size:.9rem&quot;&gt;Year&lt;/label&gt;&lt;input id=&quot;gaYear&quot; type=&quot;range&quot; min=&quot;1750&quot; max=&quot;2010&quot; step=&quot;5&quot; value=&quot;1950&quot; style=&quot;flex:1&quot;&gt;&lt;output id=&quot;gaYearOut&quot; style=&quot;font:600 1.1rem var(--serif);min-width:3em&quot;&gt;1950&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;small&gt;value in the year&lt;/small&gt;&lt;b id=&quot;gaVal&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;relative to 1750&lt;/small&gt;&lt;b id=&quot;gaX&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;share of 1750–2010 growth occurring after 1950&lt;/small&gt;&lt;b id=&quot;gaShare&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:10px 0 0&quot;&gt;&lt;b&gt;Approximate values, read by eye&lt;/b&gt; from the graphs in slides 2–3 and linearly interpolated: they serve to show the shape of the curves, not to be quoted as figures.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;box&quot;&gt;
&lt;p&gt;&lt;b&gt;How to read the two panels together.&lt;/b&gt; The social curves (energy, fertilizers, transport) are the &lt;i&gt;causes&lt;/i&gt;; the Earth system curves (CO₂, nitrogen in the sea, forest loss) are the &lt;i&gt;effects&lt;/i&gt;. Their temporal coincidence around 1950 is the strongest argument that the Anthropocene is not a hypothesis but a measurable trajectory.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The 2015 article updates the graphs published in 2004 (to 2010 instead of 2000) and, where data allow, splits the series into OECD countries, emerging economies and the rest of the world: after 1950 population grows mainly outside the OECD, while GDP remains concentrated in OECD countries. Global averages therefore conceal sharp inequalities (&lt;a href=&quot;https://journals.sagepub.com/doi/10.1177/2053019614564785&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sage, DOI 10.1177/2053019614564785&lt;/a&gt;).&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;What does the dashed line in all 24 graphs indicate?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Watt&#x27;s steam engine&lt;/button&gt;&lt;button&gt;1950, the beginning of the Great Acceleration&lt;/button&gt;&lt;button&gt;2000, the year of Crutzen&#x27;s article&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;1950: after that date almost all curves surge.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Which of these is an &lt;i&gt;Earth system trend&lt;/i&gt; rather than a &lt;i&gt;socio-economic trend&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Large dams&lt;/button&gt;&lt;button&gt;Fertilizer consumption&lt;/button&gt;&lt;button&gt;Nitrogen to coastal zone&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Dams and fertilizers are human activities (causes); nitrogen reaching the sea is a change in the Earth system (effect).&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Try again&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: why do the tourism, telephone and vehicle series start only after 1950?&lt;/summary&gt;&lt;div&gt;Because before then these phenomena were negligible or not measured on a global scale: it is precisely post-war mondialization (Part 4) that turns them into mass phenomena.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section id=&quot;s3&quot; class=&quot;part&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Part 3 · slides 4–6&lt;/div&gt;
&lt;h2&gt;Urbanocene: the human imprint is an urban imprint&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 4&lt;/span&gt; “What is fueling the Global Change and explaining the entry into the Anthropocene? Urbanization.”&lt;/p&gt;
&lt;p&gt;The slides go one step further than Crutzen and Steffen. It is not enough to say “humankind”: &lt;b&gt;the driver of &lt;span class=&quot;tech&quot;&gt;Global Change&lt;/span&gt;&lt;/b&gt; (global change in climate, ecosystems and biogeochemical cycles) &lt;b&gt;is urbanization&lt;/b&gt;. Three claims in sequence:&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;1 · Cause&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;Urbanization fuels Global Change and explains the entry into the Anthropocene.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;2 · Imprint&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;The &lt;span class=&quot;tech&quot;&gt;human imprint&lt;/span&gt; is in fact an &lt;span class=&quot;tech&quot;&gt;urban imprint&lt;/span&gt;: human impact passes through cities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;3 · Name&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;The Anthropocene “could be considered as” an &lt;span class=&quot;tech&quot;&gt;Urbanocene&lt;/span&gt;, the epoch of the urban.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why cities in particular? The reasoning the slides take for granted&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Look again at the graphs in Part 2: &lt;i&gt;urban population&lt;/i&gt; rises from about 0.75 to 3.5 billion between 1950 and 2010; energy, transport, telecommunications, the concrete of dams, paper, and fertilizers to feed those who do not farm all serve to keep urban systems running. Even “rural” land becomes the hinterland of cities: fields, mines, reservoirs, landfills.&lt;/p&gt;
&lt;p&gt;Urbanization here does not simply mean “more people in cities” (a demographic fact) but the spread of an urban way of life, made of mobility, consumption and networks, that reaches everywhere.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The French geographer &lt;b&gt;Michel Lussault&lt;/b&gt; (ENS de Lyon, founder of the École urbaine de Lyon) argues that the Anthropocene turning point coincides with the onset of the planet&#x27;s massive urbanization, so that “the Anthropocene would be an urbanocene” (&lt;a href=&quot;https://live-global-metro-studies.pantheon.berkeley.edu/events/michel-lussault-could-anthropocene-be-urbanocene/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UC Berkeley, Global Metropolitan Studies, “Could Anthropocene be Urbanocene?”&lt;/a&gt;). In his book &lt;i&gt;Cohabitons!&lt;/i&gt; (Seuil, 2024) he describes the urbanocene as a new condition of life produced by the generalised urbanization of human inhabiting (&lt;a href=&quot;https://metropolitics.org/IMG/pdf/met-devisme-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in Metropolitics&lt;/a&gt;).&lt;/div&gt;

&lt;h3&gt;How to tackle the challenges of the Urbanocene: Lussault&#x27;s model (2022)&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 5&lt;/span&gt; “How to Tackle Global/Local Challenges of Urbanocene?” · Michel Lussault, 2022.&lt;/p&gt;
&lt;p&gt;The diagram is made of concentric shapes. At the centre is &lt;b&gt;spatiality&lt;/b&gt; (how we act in space, see &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;). Around it, a terracotta diamond with 4 qualities of the &lt;b&gt;Livable Urban Local System&lt;/b&gt;. Outside, an ellipse with 4 goals of the &lt;b&gt;Robust, Sober &amp;amp; Fair Urban System&lt;/b&gt; at the &lt;b&gt;Global&lt;/b&gt; scale. Everything rests on the &lt;i&gt;bio-physical milieu&lt;/i&gt;. &lt;b&gt;Click the nodes&lt;/b&gt;.&lt;/p&gt;

&lt;g class=&quot;hot&quot; data-k=&quot;ue&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Urban ecosystem&quot;&gt;&lt;circle cx=&quot;320&quot; cy=&quot;368&quot; r=&quot;40&quot; class=&quot;f-card s-ink&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;Urban&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;379&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;ecosystem&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hot&quot; data-k=&quot;sc&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Social and cultural diversity&quot;&gt;&lt;circle cx=&quot;220&quot; cy=&quot;280&quot; r=&quot;40&quot; class=&quot;f-card s-ink&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;270&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;Social and&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;cultural&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;diversity&lt;/text&gt;&lt;/g&gt;
