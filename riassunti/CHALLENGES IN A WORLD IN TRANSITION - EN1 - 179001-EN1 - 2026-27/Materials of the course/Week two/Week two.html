&lt;h1&gt;Dall&#x27;&lt;em&gt;Anthropocene&lt;/em&gt; all&#x27;&lt;em&gt;Urbanocene&lt;/em&gt;: abitare e territorializzare un mondo in rete&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Gli esseri umani sono diventati una forza geologica; la crescita esplode dopo il 1950; il motore è l&#x27;urbanizzazione. Per leggere questo mondo servono reti, flussi, abitanti e territori.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;13 slide · &lt;em&gt;Week two.pdf&lt;/em&gt;&lt;/span&gt;&lt;span&gt;8 parti · autoverifiche in fondo a ogni parte&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot; style=&quot;--h:250;margin-top:22px;font-size:.92rem&quot;&gt;
&lt;b&gt;Come leggere questa pagina.&lt;/b&gt; Il testo normale spiega e completa le slide (&lt;span class=&quot;slide&quot;&gt;slide n&lt;/span&gt; indica da quale slide viene un contenuto). Le parti con &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; vengono da ricerche web e hanno il link. I termini tecnici restano in inglese, come nel corso.
Gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non erano consultabili in questa sessione (non è stato possibile elencarne il contenuto), quindi non ci sono collegamenti ad altre lezioni: confronta tu con il programma e le altre settimane.

&lt;a href=&quot;#s5&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;410&quot; y=&quot;410&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;18&quot;&gt;Inhabiting&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;space · spatiality · abitanti&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
&lt;a href=&quot;#s6&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;660&quot; y=&quot;410&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;785&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;17&quot;&gt;socio-territorial systems&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Territorialisation: 3 atti&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
&lt;a href=&quot;#s7&quot;&gt;&lt;g class=&quot;hot&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;410&quot; width=&quot;320&quot; height=&quot;70&quot; rx=&quot;14&quot; class=&quot;t25 sd25&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;18&quot;&gt;Casi: Venice · Poland&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;463&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Middle East · Osaka&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

&lt;!-- S1 --&gt;
&lt;section id=&quot;s1&quot; class=&quot;part&quot; style=&quot;--h:25&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 1 · slide 1&lt;/div&gt;
&lt;h2&gt;Anthropocene: quando l&#x27;umanità diventa una forza geologica&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 1&lt;/span&gt; «Reading and discussing…»: la slide riporta il testo integrale di un breve articolo. È &lt;b&gt;Paul J. Crutzen &amp;amp; Eugene F. Stoermer, “The ‘Anthropocene’”&lt;/b&gt;, &lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt; 41, maggio 2000, pp. 17–18 &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; (identificazione tramite &lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry&lt;/a&gt;; la slide non riporta autori e titolo).&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Anthropocene&lt;/b&gt; — da &lt;i&gt;anthropos&lt;/i&gt;, “essere umano”, e &lt;i&gt;kainos&lt;/i&gt;, “nuovo/recente”: nome proposto per l&#x27;epoca geologica attuale, in cui le attività umane sono tanto grandi da modificare clima, atmosfera, suoli, oceani e biosfera a scala globale. L&#x27;articolo lo propone per «sottolineare il ruolo centrale dell&#x27;umanità in geologia ed ecologia».&lt;/div&gt;

&lt;h3&gt;Prima di tutto: che cos&#x27;è un&#x27;“epoca” geologica?&lt;/h3&gt;
&lt;p&gt;Le slide lo danno per scontato. I geologi dividono la storia della Terra in unità annidate, riconoscibili negli strati di roccia e sedimento: &lt;b&gt;eon › era › periodo › epoca › età&lt;/b&gt;. Noi viviamo nell&#x27;eon Fanerozoico, era Cenozoica, periodo Quaternario, epoca &lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Scala gerarchica del tempo geologico fino all&#x27;Holocene&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;740&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t250&quot;/&gt;&lt;text x=&quot;20&quot; y=&quot;28&quot;&gt;Eon · Phanerozoic (da 541 milioni di anni fa)&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;42&quot; width=&quot;500&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t150&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;60&quot;&gt;Era · Cenozoic (66 Ma)&lt;/text&gt;
&lt;rect x=&quot;500&quot; y=&quot;74&quot; width=&quot;250&quot; height=&quot;26&quot; rx=&quot;6&quot; class=&quot;t85&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;92&quot;&gt;Period · Quaternary (2,58 Ma)&lt;/text&gt;
&lt;rect x=&quot;650&quot; y=&quot;106&quot; width=&quot;100&quot; height=&quot;30&quot; rx=&quot;6&quot; class=&quot;d25&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Holocene&lt;/text&gt;
&lt;text x=&quot;640&quot; y=&quot;126&quot; text-anchor=&quot;end&quot; class=&quot;f-muted&quot; style=&quot;fill:var(--muted)&quot;&gt;epoca · ultimi ~11 700 anni →&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Schema non in scala. Date di riferimento della scala cronostratigrafica internazionale, aggiunte per orientarsi.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;L&#x27;&lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt; (“Recent Whole”, “interamente recente”) è l&#x27;epoca post-glaciale degli ultimi 10–12 mila anni: il clima relativamente stabile in cui sono nate agricoltura, città e scritture. Proporre l&#x27;&lt;span class=&quot;tech&quot;&gt;Anthropocene&lt;/span&gt; significa dire che quella stabilità è finita &lt;i&gt;per causa nostra&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Secondo l&#x27;&lt;a href=&quot;https://www.britannica.com/science/Holocene-Epoch&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Encyclopaedia Britannica&lt;/a&gt;, nel 1833 Lyell propose il nome &lt;i&gt;Recent&lt;/i&gt;; il termine &lt;i&gt;Holocene&lt;/i&gt; sarebbe stato proposto nel 1867 e presentato al Congresso geologico internazionale di Bologna nel 1885. L&#x27;articolo nelle slide attribuisce invece il nome a Lyell («seems to have been proposed»): il «seems» stesso segnala l&#x27;incertezza.&lt;/div&gt;

&lt;h3&gt;Una genealogia dell&#x27;idea&lt;/h3&gt;
&lt;p&gt;Crutzen e Stoermer insistono: l&#x27;idea che l&#x27;uomo sia una forza geologica non è nuova. Apri le tappe:&lt;/p&gt;
&lt;ol class=&quot;tl&quot;&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1833 / 1885&lt;/span&gt;Lyell, Congresso di Bologna&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Nasce il nome dell&#x27;epoca post-glaciale, l&#x27;&lt;span class=&quot;tech&quot;&gt;Holocene&lt;/span&gt;, adottato dall&#x27;International Geological Congress di Bologna (1885).&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1864&lt;/span&gt;G. P. Marsh, &lt;i&gt;Man and Nature&lt;/i&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Il diplomatico e studioso americano documenta come deforestazione, irrigazione, bonifiche modificano la geografia fisica. Ristampato come &lt;i&gt;The Earth as Modified by Human Action&lt;/i&gt;. Testo fondativo dell&#x27;ambientalismo.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1873&lt;/span&gt;A. Stoppani, «anthropozoic era»&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Il geologo italiano definisce l&#x27;attività umana «una nuova forza tellurica che in potenza e universalità può essere paragonata alle maggiori forze della Terra» e parla di &lt;span class=&quot;tech&quot;&gt;anthropozoic era&lt;/span&gt;, era “antropozoica”.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1924&lt;/span&gt;Teilhard de Chardin &amp;amp; É. Le Roy, «noösphere»&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Coniano &lt;span class=&quot;tech&quot;&gt;noösphere&lt;/span&gt;, “sfera del pensiero”: il mondo del pensiero umano che, grazie a cervello e tecnologia, plasma il proprio futuro e il proprio ambiente.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;1926&lt;/span&gt;V. I. Vernadsky, &lt;i&gt;The Biosphere&lt;/i&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Il geologo russo riconosce il crescente potere dell&#x27;umanità come parte della &lt;span class=&quot;tech&quot;&gt;biosphere&lt;/span&gt; (l&#x27;involucro vivente del pianeta): l&#x27;evoluzione va «verso una coscienza e un pensiero crescenti, e forme con un&#x27;influenza sempre maggiore sul loro ambiente».&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;li&gt;&lt;details open&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;y&quot;&gt;2000&lt;/span&gt;Crutzen &amp;amp; Stoermer, «Anthropocene»&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Propongono il termine per l&#x27;epoca attuale. Crutzen è chimico dell&#x27;atmosfera (Nobel 1995 per gli studi sull&#x27;ozono), Stoermer biologo delle acque dolci.&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;
&lt;/ol&gt;

&lt;h3&gt;Le prove: quanto pesa l&#x27;impronta umana&lt;/h3&gt;
&lt;p&gt;L&#x27;articolo elenca impatti misurabili. Clicca una scheda per la spiegazione dei termini.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;×10&lt;/b&gt;&lt;small&gt;popolazione in 3 secoli, a 6 miliardi; bovini a 1,4 miliardi&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Circa una mucca per famiglia media. L&#x27;urbanizzazione è cresciuta di dieci volte nell&#x27;ultimo secolo.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;30–50%&lt;/b&gt;&lt;small&gt;della superficie terrestre trasformata dall&#x27;uomo&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Dato preso da Vitousek et al. (1997): coltivi, pascoli, città, strade.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;≥ 2×&lt;/b&gt;&lt;small&gt;SO₂ umano rispetto alle emissioni naturali&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Circa 160 Tg/anno di anidride solforosa da carbone e petrolio. &lt;b&gt;Tg&lt;/b&gt; = teragrammo = un milione di tonnellate. Le fonti naturali sono soprattutto il dimetil-solfuro emesso dagli oceani.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;&amp;gt; naturale&lt;/b&gt;&lt;small&gt;azoto fissato dall&#x27;industria per i fertilizzanti&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Più azoto è fissato sinteticamente (processo industriale che trasforma N₂ atmosferico in fertilizzante) che da tutti gli ecosistemi terrestri. Anche l&#x27;NO da combustione supera gli apporti naturali e produce &lt;span class=&quot;tech&quot;&gt;photochemical ozone&lt;/span&gt; (“smog”, ozono che si forma al suolo per reazioni attivate dalla luce).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;&amp;gt; 50%&lt;/b&gt;&lt;small&gt;dell&#x27;acqua dolce accessibile usata dall&#x27;umanità&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Irrigazione, industria, città.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;×1000–10 000&lt;/b&gt;&lt;small&gt;tasso di estinzione nelle foreste pluviali tropicali&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Rispetto al tasso “di fondo” naturale.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;CO₂ +30% · CH₄ +100%&lt;/b&gt;&lt;small&gt;gas serra in atmosfera&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tech&quot;&gt;Greenhouse gases&lt;/span&gt;: gas che trattengono il calore emesso dalla Terra. Anidride carbonica (CO₂) e metano (CH₄) sono i principali di origine umana.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;buco&lt;/b&gt;&lt;small&gt;dell&#x27;ozono antartico dovuto ai CFC&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;I clorofluorocarburi non sono tossici, ma distruggono l&#x27;ozono stratosferico che ci protegge dagli UV. Senza regolazione internazionale (il Protocollo di Montreal, 1987, che la slide non nomina) avrebbero distrutto gran parte dello strato di ozono.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;−50%&lt;/b&gt;&lt;small&gt;mangrovie nel mondo&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;Le zone umide costiere sono state trasformate (acquacoltura, urbanizzazione).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;stat&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;b&gt;25–35%&lt;/b&gt;&lt;small&gt;della produzione primaria oceanica prelevata dalla pesca&lt;/small&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tech&quot;&gt;Primary production&lt;/span&gt;: la biomassa prodotta dalla fotosintesi (fitoplancton), base della catena alimentare. Oltre il 25% nelle zone di &lt;span class=&quot;tech&quot;&gt;upwelling&lt;/span&gt; (dove risalgono acque profonde ricche di nutrienti) e il 35% sulle piattaforme continentali temperate.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;p&gt;Anche i sedimenti dei laghi registrano questi effetti, perfino in luoghi lontani dalle fonti di inquinamento. E secondo Berger e Loutre il clima, per le emissioni di CO₂, potrebbe allontanarsi dal comportamento naturale per i prossimi &lt;b&gt;50 000 anni&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;Quando comincia?&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;a&quot;&gt;Fine &#x27;700&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;b&quot;&gt;Tutto l&#x27;Holocene&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;c&quot;&gt;Dal 1950&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d&quot;&gt;E oggi?&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;a&quot;&gt;&lt;p&gt;&lt;b&gt;La proposta di Crutzen e Stoermer.&lt;/b&gt; Datare l&#x27;inizio è «somewhat arbitrary», ma scelgono la seconda metà del XVIII secolo perché:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;i &lt;b&gt;carotaggi glaciali&lt;/b&gt; (bolle d&#x27;aria intrappolate nel ghiaccio) mostrano da allora l&#x27;aumento di CO₂ e CH₄;&lt;/li&gt;&lt;li&gt;coincide con la &lt;b&gt;macchina a vapore di James Watt&lt;/b&gt; (1784), simbolo dell&#x27;avvio della rivoluzione industriale e dell&#x27;uso massiccio di combustibili fossili.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;b&quot; hidden&gt;&lt;p&gt;Alcuni, ricordano gli autori, vorrebbero includere l&#x27;&lt;b&gt;intero Holocene&lt;/b&gt;: con agricoltura, disboscamento e allevamento l&#x27;impatto umano comincia migliaia di anni fa. Il rischio è che Anthropocene e Holocene diventino la stessa cosa.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;La slide 2 mostra che quasi tutte le curve si impennano dopo il &lt;b&gt;1950&lt;/b&gt;: è la &lt;a href=&quot;#s2&quot;&gt;Great Acceleration&lt;/a&gt;. Il Working Group sull&#x27;Anthropocene ha poi proposto proprio la metà del Novecento come inizio.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; data-p=&quot;d&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nel marzo 2024 la Subcommission on Quaternary Stratigraphy ha respinto la proposta di rendere l&#x27;Anthropocene un&#x27;epoca formale (inizio 1950, “chiodo d&#x27;oro” nei sedimenti del Crawford Lake, in Canada), e l&#x27;International Union of Geological Sciences (IUGS) ha confermato. Il termine resta però, per la IUGS, un descrittore prezioso delle interazioni uomo-ambiente (&lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Vienna, statement&lt;/a&gt;; &lt;a href=&quot;https://climateandcapitalism.com/2024/03/21/top-geology-body-denies-appeal-rejects-anthropocene-proposal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate &amp;amp; Capitalism&lt;/a&gt;). Ufficialmente, quindi, viviamo ancora nell&#x27;Holocene: nel corso il termine si usa come concetto interpretativo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Perché Crutzen e Stoermer fanno iniziare l&#x27;Anthropocene alla fine del XVIII secolo?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Perché è l&#x27;inizio dell&#x27;agricoltura&lt;/button&gt;&lt;button&gt;Per la prima esplosione nucleare&lt;/button&gt;&lt;button&gt;Perché i carotaggi glaciali mostrano da allora l&#x27;aumento di CO₂ e CH₄, in coincidenza con la macchina di Watt&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;L&#x27;agricoltura rimanda all&#x27;intero Holocene, le bombe atomiche al 1945–50. Gli autori scelgono gli effetti globali «chiaramente visibili» negli ultimi due secoli.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Chi parlò per primo di «anthropozoic era»?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Antonio Stoppani, 1873&lt;/button&gt;&lt;button&gt;Vladimir Vernadsky, 1926&lt;/button&gt;&lt;button&gt;George P. Marsh, 1864&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Stoppani; Marsh scrisse &lt;i&gt;Man and Nature&lt;/i&gt;, Vernadsky la &lt;i&gt;Biosphere&lt;/i&gt;; il termine &lt;i&gt;noösphere&lt;/i&gt; è di Teilhard de Chardin e Le Roy.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: in che senso l&#x27;uomo è una forza “geologica” e non solo “ambientale”?&lt;/summary&gt;&lt;div&gt;Perché i suoi effetti si iscrivono negli archivi del pianeta (ghiacci, sedimenti lacustri, chimica dell&#x27;atmosfera e degli oceani), sono globali e dureranno decine di migliaia di anni: come un&#x27;eruzione o una glaciazione, non come un danno locale.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S2 --&gt;
&lt;section id=&quot;s2&quot; class=&quot;part&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 2 · slide 2–3&lt;/div&gt;
&lt;h2&gt;Great Acceleration: 24 curve, una sola svolta&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 2–3&lt;/span&gt; Will Steffen, Wendy Broadgate, Lisa Deutsch, Owen Gaffney, Cornelia Ludwig, «The trajectory of the Anthropocene: The Great Acceleration», &lt;i&gt;The Anthropocene Review&lt;/i&gt;, 2015, vol. 2, n. 1, pp. 81–98, Sage.&lt;/p&gt;
&lt;p&gt;Il gruppo di Steffen ha raccolto 24 serie storiche dal 1750 al 2010. Dodici misurano la società (&lt;span class=&quot;tech&quot;&gt;socio-economic trends&lt;/span&gt;), dodici lo stato del pianeta (&lt;span class=&quot;tech&quot;&gt;Earth system trends&lt;/span&gt;, il sistema Terra: atmosfera, oceani, suoli e biosfera insieme). In tutti i grafici una linea tratteggiata segna il &lt;b&gt;1950&lt;/b&gt;: da lì quasi tutte le curve diventano verticali. È la &lt;span class=&quot;tech&quot;&gt;Great Acceleration&lt;/span&gt;, “grande accelerazione”.&lt;/p&gt;

&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;se&quot;&gt;Socio-economic trends (slide 3)&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;es&quot;&gt;Earth system trends (slide 2)&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;se&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Population&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Real GDP&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Foreign direct investment&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Urban population&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Primary energy use&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Fertilizer consumption&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Large dams&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Water use&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Paper production&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Transportation&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Telecommunications&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;International tourism&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Real GDP&lt;/b&gt;: prodotto interno lordo depurato dall&#x27;inflazione. &lt;b&gt;Foreign direct investment&lt;/b&gt;: investimenti di imprese in paesi esteri, misura della globalizzazione economica. &lt;b&gt;Primary energy&lt;/b&gt;: energia nella forma in cui si estrae (carbone, petrolio, gas, idro…), in exajoule (EJ, 10¹⁸ joule). Alcune serie cominciano solo dopo il 1950 (turismo internazionale, telefoni, veicoli): sono quasi invisibili prima.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;es&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Carbon dioxide&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Nitrous oxide&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Methane&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Stratospheric ozone&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Surface temperature&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ocean acidification&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Marine fish capture&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Shrimp aquaculture&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Nitrogen to coastal zone&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Tropical forest loss&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Domesticated land&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Terrestrial biosphere degradation&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;ppm/ppb&lt;/b&gt;: parti per milione/miliardo, concentrazione di un gas. &lt;b&gt;Ocean acidification&lt;/b&gt;: l&#x27;oceano assorbe CO₂ e diventa più acido (aumentano gli ioni idrogeno). &lt;b&gt;Nitrogen to coastal zone&lt;/b&gt;: azoto dei fertilizzanti che finisce in mare. &lt;b&gt;Terrestrial biosphere degradation&lt;/b&gt;: perdita di abbondanza media delle specie. &lt;b&gt;Surface temperature&lt;/b&gt;: anomalia rispetto a una media di riferimento, in °C.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Esplora le curve&lt;/h3&gt;
&lt;p&gt;Scegli un indicatore e sposta il cursore degli anni. La lettura in basso dice quanto è cresciuto e quale parte della crescita totale 1750–2010 è avvenuta &lt;i&gt;dopo&lt;/i&gt; il 1950.&lt;/p&gt;
&lt;div class=&quot;chartbox&quot;&gt;
&lt;div class=&quot;tablist&quot; id=&quot;gaPick&quot; style=&quot;margin:0 0 10px&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;gaChart&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico interattivo della Great Acceleration&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot; style=&quot;display:flex;gap:10px;align-items:center;margin-top:6px&quot;&gt;&lt;label for=&quot;gaYear&quot; style=&quot;font-size:.9rem&quot;&gt;Anno&lt;/label&gt;&lt;input id=&quot;gaYear&quot; type=&quot;range&quot; min=&quot;1750&quot; max=&quot;2010&quot; step=&quot;5&quot; value=&quot;1950&quot; style=&quot;flex:1&quot;&gt;&lt;output id=&quot;gaYearOut&quot; style=&quot;font:600 1.1rem var(--serif);min-width:3em&quot;&gt;1950&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;small&gt;valore nell&#x27;anno&lt;/small&gt;&lt;b id=&quot;gaVal&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;rispetto al 1750&lt;/small&gt;&lt;b id=&quot;gaX&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;crescita 1750–2010 avvenuta dopo il 1950&lt;/small&gt;&lt;b id=&quot;gaShare&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.8rem;color:var(--muted);margin:10px 0 0&quot;&gt;Valori &lt;b&gt;approssimati, letti a occhio&lt;/b&gt; dai grafici delle slide 2–3 e interpolati linearmente: servono a vedere la forma delle curve, non a citare cifre.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;box&quot;&gt;
&lt;p&gt;&lt;b&gt;Come si leggono insieme le due tavole.&lt;/b&gt; Le curve sociali (energia, fertilizzanti, trasporti) sono le &lt;i&gt;cause&lt;/i&gt;; quelle del sistema Terra (CO₂, azoto in mare, foreste perse) sono gli &lt;i&gt;effetti&lt;/i&gt;. La coincidenza temporale attorno al 1950 è l&#x27;argomento più forte per dire che l&#x27;Anthropocene non è un&#x27;ipotesi ma una traiettoria misurabile.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;articolo del 2015 aggiorna i grafici pubblicati nel 2004 (fino al 2010 invece che al 2000) e, dove i dati lo permettono, divide le serie tra paesi OCSE, economie emergenti e resto del mondo: dopo il 1950 la popolazione cresce soprattutto fuori dall&#x27;OCSE, mentre il PIL resta concentrato nei paesi OCSE. Le medie globali nascondono quindi forti diseguaglianze (&lt;a href=&quot;https://journals.sagepub.com/doi/10.1177/2053019614564785&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sage, DOI 10.1177/2053019614564785&lt;/a&gt;).&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Che cosa indica la linea tratteggiata in tutti i 24 grafici?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;La macchina a vapore di Watt&lt;/button&gt;&lt;button&gt;Il 1950, inizio della Great Acceleration&lt;/button&gt;&lt;button&gt;Il 2000, anno dell&#x27;articolo di Crutzen&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Il 1950: dopo quella data quasi tutte le curve si impennano.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Quale di questi è un &lt;i&gt;Earth system trend&lt;/i&gt; e non un &lt;i&gt;socio-economic trend&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Large dams&lt;/button&gt;&lt;button&gt;Fertilizer consumption&lt;/button&gt;&lt;button&gt;Nitrogen to coastal zone&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Dighe e fertilizzanti sono attività umane (cause); l&#x27;azoto che arriva in mare è una modifica del sistema Terra (effetto).&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: perché le serie di turismo, telefonia e veicoli partono solo dopo il 1950?&lt;/summary&gt;&lt;div&gt;Perché prima i fenomeni erano trascurabili o non misurati su scala mondiale: è proprio la mondializzazione del dopoguerra (Parte 4) a crearli come fenomeni di massa.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S3 --&gt;
&lt;section id=&quot;s3&quot; class=&quot;part&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 3 · slide 4–6&lt;/div&gt;
&lt;h2&gt;Urbanocene: l&#x27;impronta umana è un&#x27;impronta urbana&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 4&lt;/span&gt; «What is fueling the Global Change and explaining the entry into the Anthropocene? Urbanization.»&lt;/p&gt;
&lt;p&gt;Le slide fanno un passo in più rispetto a Crutzen e Steffen. Non basta dire “l&#x27;umanità”: &lt;b&gt;il motore del &lt;span class=&quot;tech&quot;&gt;Global Change&lt;/span&gt;&lt;/b&gt; (il cambiamento globale di clima, ecosistemi e cicli biogeochimici) &lt;b&gt;è l&#x27;urbanizzazione&lt;/b&gt;. Tre affermazioni in sequenza:&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;1 · Causa&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;L&#x27;urbanizzazione alimenta il Global Change e spiega l&#x27;ingresso nell&#x27;Anthropocene.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;2 · Impronta&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;Lo &lt;span class=&quot;tech&quot;&gt;human imprint&lt;/span&gt; è in realtà un &lt;span class=&quot;tech&quot;&gt;urban imprint&lt;/span&gt;: l&#x27;impatto umano passa per le città.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;3 · Nome&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0&quot;&gt;L&#x27;Anthropocene «could be considered as» un &lt;span class=&quot;tech&quot;&gt;Urbanocene&lt;/span&gt;, l&#x27;epoca dell&#x27;urbano.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché proprio le città? Il ragionamento che le slide danno per scontato&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Rileggi i grafici della Parte 2: &lt;i&gt;urban population&lt;/i&gt; passa da circa 0,75 a 3,5 miliardi tra 1950 e 2010; energia, trasporti, telecomunicazioni, cemento delle dighe, carta, fertilizzanti per nutrire chi non coltiva servono a far funzionare sistemi urbani. Anche il territorio “rurale” diventa retroterra delle città: campi, miniere, bacini idrici, discariche.&lt;/p&gt;
&lt;p&gt;Urbanizzazione qui non vuol dire solo “più gente in città” (dato demografico) ma diffusione di un modo di vivere urbano, fatto di mobilità, consumi e reti, che arriva ovunque.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il geografo francese &lt;b&gt;Michel Lussault&lt;/b&gt; (ENS de Lyon, fondatore dell&#x27;École urbaine de Lyon) sostiene che la svolta dell&#x27;Anthropocene coincide con l&#x27;inizio dell&#x27;urbanizzazione massiccia del pianeta, per cui «l&#x27;Anthropocene sarebbe un urbanocene» (&lt;a href=&quot;https://live-global-metro-studies.pantheon.berkeley.edu/events/michel-lussault-could-anthropocene-be-urbanocene/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UC Berkeley, Global Metropolitan Studies, «Could Anthropocene be Urbanocene?»&lt;/a&gt;). Nel libro &lt;i&gt;Cohabitons!&lt;/i&gt; (Seuil, 2024) descrive l&#x27;urbanocene come una nuova condizione di vita prodotta dall&#x27;urbanizzazione generalizzata dell&#x27;abitare umano (&lt;a href=&quot;https://metropolitics.org/IMG/pdf/met-devisme-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su Metropolitics&lt;/a&gt;).&lt;/div&gt;

&lt;h3&gt;Come affrontare le sfide dell&#x27;Urbanocene: il modello di Lussault (2022)&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 5&lt;/span&gt; «How to Tackle Global/Local Challenges of Urbanocene?» · Michel Lussault, 2022.&lt;/p&gt;
&lt;p&gt;Lo schema è fatto di cerchi concentrici. Al centro, la &lt;b&gt;spatiality&lt;/b&gt; (come agiamo nello spazio, vedi &lt;a href=&quot;#s5&quot;&gt;Parte 5&lt;/a&gt;). Intorno, un rombo terracotta di 4 qualità del &lt;b&gt;Livable Urban Local System&lt;/b&gt; (sistema urbano locale vivibile). Fuori, un&#x27;ellisse di 4 obiettivi del &lt;b&gt;Robust, Sober &amp;amp; Fair Urban System&lt;/b&gt; a scala &lt;b&gt;Global&lt;/b&gt; (sistema urbano robusto, sobrio e giusto). Tutto poggia sul &lt;i&gt;bio-physical milieu&lt;/i&gt;. &lt;b&gt;Clicca i nodi&lt;/b&gt;.&lt;/p&gt;

&lt;/svg&gt;

&lt;/figure&gt;
&lt;div id=&quot;luInfo&quot; class=&quot;panel info&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;template data-for=&quot;sh&quot;&gt;&lt;p&gt;&lt;b&gt;Sustainability &amp;amp; Health&lt;/b&gt; · obiettivo globale. &lt;span class=&quot;tech&quot;&gt;Sustainability&lt;/span&gt;: soddisfare i bisogni di oggi senza compromettere quelli futuri. Qui è legata alla salute: un ambiente urbano degradato fa ammalare. È connessa al nodo locale &lt;i&gt;Accessibility &amp;amp; Hospitality&lt;/i&gt;.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ef&quot;&gt;&lt;p&gt;&lt;b&gt;Efficiency&lt;/b&gt; · obiettivo globale: ottenere di più con meno energia, suolo e materia. È l&#x27;idea di “sobrietà” dell&#x27;anello esterno, e trova la sua versione locale nella &lt;i&gt;Circular economy&lt;/i&gt;.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;dj&quot;&gt;&lt;p&gt;&lt;b&gt;Democracy &amp;amp; Spatial justice&lt;/b&gt; · obiettivo globale. &lt;span class=&quot;tech&quot;&gt;Spatial justice&lt;/span&gt;: equa distribuzione nello spazio di risorse, servizi, rischi e possibilità di decidere. Chi abita vicino a una discarica o lontano dai trasporti subisce un&#x27;ingiustizia spaziale. Si collega all&#x27;&lt;i&gt;Urban ecosystem&lt;/i&gt;: aria, verde e acqua sono beni da distribuire in modo giusto.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;vr&quot;&gt;&lt;p&gt;&lt;b&gt;Vulnerability &amp;amp; Resilience&lt;/b&gt; · obiettivo globale. &lt;span class=&quot;tech&quot;&gt;Vulnerability&lt;/span&gt;: quanto un sistema può essere danneggiato da un evento (alluvione, ondata di calore). &lt;span class=&quot;tech&quot;&gt;Resilience&lt;/span&gt;: la capacità di assorbire lo shock e riorganizzarsi. Si lega alla &lt;i&gt;Social and cultural diversity&lt;/i&gt;: società diverse e connesse reagiscono meglio.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ah&quot;&gt;&lt;p&gt;&lt;b&gt;Accessibility &amp;amp; Hospitality&lt;/b&gt; · qualità locale. Città dove tutti possono arrivare e muoversi (accessibilità) e dove chi arriva, migranti e visitatori compresi, è accolto (ospitalità). Sta sul lato &lt;b&gt;SPACE&lt;/b&gt; del rombo.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ce&quot;&gt;&lt;p&gt;&lt;b&gt;Circular economy&lt;/b&gt; · qualità locale. &lt;span class=&quot;tech&quot;&gt;Circular economy&lt;/span&gt;: economia che riusa, ripara e ricicla invece del modello lineare “estrai, produci, butta”. Riduce i flussi di materia che la città importa ed esporta.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;ue&quot;&gt;&lt;p&gt;&lt;b&gt;Urban ecosystem&lt;/b&gt; · qualità locale. La città vista come ecosistema: suolo, acqua, alberi, animali e microclima, non solo edifici. Sta sopra il &lt;b&gt;bio-physical milieu&lt;/b&gt;, l&#x27;ambiente fisico e biologico su cui tutto poggia.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;sc&quot;&gt;&lt;p&gt;&lt;b&gt;Social and cultural diversity&lt;/b&gt; · qualità locale. La convivenza di gruppi, età, culture e redditi diversi. È una risorsa per vivibilità e resilienza, contro segregazione e &lt;span class=&quot;tech&quot;&gt;gentrification&lt;/span&gt; (vedi &lt;a href=&quot;#s7&quot;&gt;casi&lt;/a&gt;).&lt;/p&gt;&lt;/template&gt;
&lt;div class=&quot;tablist&quot; style=&quot;margin-top:12px&quot; aria-label=&quot;Scegli un nodo&quot;&gt;
&lt;button class=&quot;chip&quot; data-k=&quot;sh&quot;&gt;Sustainability&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ef&quot;&gt;Efficiency&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;dj&quot;&gt;Democracy&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;vr&quot;&gt;Resilience&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ah&quot;&gt;Accessibility&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ce&quot;&gt;Circular economy&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;ue&quot;&gt;Urban ecosystem&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;sc&quot;&gt;Diversity&lt;/button&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Le quattro azioni negli angoli della slide&lt;/h4&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Spatial diplomacies&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Inventare nuove diplomazie spaziali e geopolitiche (“gepolicies”) tra agenti umani e &lt;i&gt;non umani&lt;/i&gt;: fiumi, animali, clima entrano nella politica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Spatial caring&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Prendersi cura dei luoghi, dei territori e dell&#x27;intera Terra.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Empowerment&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Promuovere responsabilità, impegno sociale e politico, e &lt;span class=&quot;tech&quot;&gt;empowerment&lt;/span&gt; (dare potere e capacità d&#x27;azione) degli &lt;span class=&quot;tech&quot;&gt;stakeholders&lt;/span&gt;, i portatori di interesse.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Design &amp;amp; planning&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Inventare un nuovo design sostenibile e una pianificazione qualitativa degli spazi urbani a ogni scala.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Tre libri di Michel Lussault&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 6&lt;/span&gt; Copertine di tre volumi editi da Seuil, collana «La couleur des idées».&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;l1&quot;&gt;L&#x27;Homme spatial&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;l2&quot;&gt;L&#x27;Avènement du monde&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;l3&quot;&gt;Hyper-lieux&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l1&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;L&#x27;Homme spatial. La construction sociale de l&#x27;espace humain&lt;/i&gt;&lt;/b&gt; (2007). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Lo spazio è una costruzione sociale: gli esseri umani sono “spaziali”, agiscono sempre gestendo distanze, luoghi e limiti. Base teorica dei concetti di &lt;a href=&quot;#s5&quot;&gt;space e spatiality&lt;/a&gt;. (&lt;a href=&quot;https://espacestemps.net/articles/homme-spatial-prend-places/?pdf=28628&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su EspacesTemps.net&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l2&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;L&#x27;Avènement du monde. Essai sur l&#x27;habitation humaine de la Terre&lt;/i&gt;&lt;/b&gt; (2013). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il &lt;i&gt;Monde&lt;/i&gt; (con la maiuscola) come nuova realtà: l&#x27;umanità abita ormai la Terra intera come un unico spazio. Lussault ne colloca l&#x27;emergenza nel dopoguerra, anche grazie all&#x27;esplorazione spaziale che ci ha fatto vedere il pianeta come un tutto (la Terra sulla copertina). Legato a &lt;a href=&quot;#s4&quot;&gt;mondialization&lt;/a&gt; e &lt;a href=&quot;#s5&quot;&gt;inhabiting&lt;/a&gt;. (&lt;a href=&quot;https://www.letemps.ch/culture/une-habitation-humaine-planete&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;l3&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;Hyper-lieux. Les nouvelles géographies de la mondialisation&lt;/i&gt;&lt;/b&gt; (2017). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Gli &lt;span class=&quot;tech&quot;&gt;hyper-lieux&lt;/span&gt; (iper-luoghi) sono luoghi intensamente connessi alla scala mondiale (aeroporti, centri commerciali, piazze-simbolo; in copertina Dubai), dove si incrociano flussi di persone, oggetti e informazioni. Il concetto contesta l&#x27;idea che la globalizzazione renda lo spazio tutto uguale. Sono gli &lt;span class=&quot;tech&quot;&gt;urban nodes&lt;/span&gt; della &lt;a href=&quot;#s4&quot;&gt;Parte 4&lt;/a&gt;. (&lt;a href=&quot;https://www.letemps.ch/suisse/arpenter-geneve-recherche-hyperlieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps&lt;/a&gt;)&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Che cosa significa dire che lo «human imprint» è un «urban imprint»?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Che solo chi vive in città inquina&lt;/button&gt;&lt;button&gt;Che l&#x27;impatto umano sul pianeta passa soprattutto per i sistemi urbani e per ciò che consumano&lt;/button&gt;&lt;button&gt;Che le città occupano la maggior parte della superficie terrestre&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Le città occupano poca superficie, ma organizzano i flussi di energia, materia e persone che trasformano tutto il pianeta.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Nello schema di Lussault, che cosa sta al centro?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Efficiency&lt;/button&gt;&lt;button&gt;Bio-physical milieu&lt;/button&gt;&lt;button&gt;Spatiality&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Al centro c&#x27;è la spatiality, cioè le pratiche spaziali degli attori; il bio-physical milieu sta alla base e l&#x27;efficiency è uno dei 4 obiettivi globali.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: abbina ogni qualità locale al suo obiettivo globale&lt;/summary&gt;&lt;div&gt;Accessibility &amp;amp; Hospitality → Sustainability &amp;amp; Health; Circular economy → Efficiency; Urban ecosystem → Democracy &amp;amp; Spatial justice; Social and cultural diversity → Vulnerability &amp;amp; Resilience (secondo la disposizione delle frecce nella slide).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 4 · slide 7–9&lt;/div&gt;
&lt;h2&gt;Reading the world in the process of Mondialization&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Mondialization&lt;/b&gt; (fr. &lt;i&gt;mondialisation&lt;/i&gt;) — il processo per cui il mondo diventa un unico spazio di relazioni. Nella geografia francofona si distingue spesso dalla &lt;i&gt;globalization&lt;/i&gt; in senso economico: la mondializzazione riguarda anche persone, culture, informazioni, immaginari. È la “fabbricazione del Mondo” di cui scrive Lussault.&lt;/div&gt;

&lt;h3&gt;Movimento: mobility and networks at local and global scales&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 8&lt;/span&gt; Globe → exchanges/fluxes → MOVEMENT → urban nodes → socio-territorial systems.&lt;/p&gt;
&lt;p&gt;Scorri i passi per seguire lo schema.&lt;/p&gt;
&lt;div data-steps&gt;
&lt;svg viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;Schema: dal globo ai flussi, ai nodi urbani, ai sistemi socio-territoriali&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;d250&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;0&quot;&gt;&lt;rect x=&quot;250&quot; y=&quot;12&quot; width=&quot;140&quot; height=&quot;48&quot; rx=&quot;8&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;GLOBE&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;42&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;mondialisation&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;1&quot;&gt;&lt;line x1=&quot;320&quot; y1=&quot;62&quot; x2=&quot;320&quot; y2=&quot;96&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;exchanges / fluxes&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;700&quot;&gt;MOVEMENT&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;2&quot; font-size=&quot;14&quot;&gt;
