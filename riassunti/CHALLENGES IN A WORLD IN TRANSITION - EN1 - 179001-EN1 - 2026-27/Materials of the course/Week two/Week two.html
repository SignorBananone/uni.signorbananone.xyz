&lt;rect x=&quot;45&quot; y=&quot;190&quot; width=&quot;90&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;trade&lt;/text&gt;
&lt;rect x=&quot;170&quot; y=&quot;215&quot; width=&quot;120&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot;&gt;information&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;190&quot; width=&quot;110&quot; height=&quot;30&quot; rx=&quot;5&quot; class=&quot;f-card s-ink&quot;/&gt;&lt;text x=&quot;545&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;objects&lt;/text&gt;
&lt;ellipse cx=&quot;400&quot; cy=&quot;230&quot; rx=&quot;60&quot; ry=&quot;26&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;people&lt;/text&gt;
&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;3&quot;&gt;&lt;path d=&quot;M90 222 C 60 300, 260 300, 330 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M545 222 C 600 290, 480 300, 470 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;path d=&quot;M230 247 C 220 290, 300 300, 330 300&quot; fill=&quot;none&quot; class=&quot;sd250&quot; stroke-dasharray=&quot;5 5&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;400&quot; y1=&quot;258&quot; x2=&quot;400&quot; y2=&quot;284&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;320&quot; y=&quot;286&quot; width=&quot;160&quot; height=&quot;36&quot; rx=&quot;6&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;309&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;URBAN NODES&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;4&quot;&gt;&lt;line x1=&quot;400&quot; y1=&quot;324&quot; x2=&quot;400&quot; y2=&quot;350&quot; class=&quot;sd250&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;170&quot; y=&quot;352&quot; width=&quot;460&quot; height=&quot;38&quot; rx=&quot;6&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Creating changes in &lt;tspan font-weight=&quot;700&quot;&gt;socio-territorial systems&lt;/tspan&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Indietro&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Passo&quot;&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti ›&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;1 · Globe.&lt;/b&gt; La mondializzazione agisce sul pianeta intero: il mondo diventa un unico sistema. La freccia curva della slide indica un processo continuo, che si autoalimenta.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;2 · Movement.&lt;/b&gt; La mondializzazione si manifesta come &lt;span class=&quot;tech&quot;&gt;exchanges/fluxes&lt;/span&gt;: scambi e flussi. Il mondo si legge attraverso ciò che si muove, non attraverso ciò che sta fermo.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;3 · Quattro flussi.&lt;/b&gt; &lt;b&gt;Trade&lt;/b&gt; (commercio di merci e servizi), &lt;b&gt;information&lt;/b&gt; (dati, media, finanza), &lt;b&gt;objects&lt;/b&gt; (cose che circolano: container, rifiuti, specie invasive), &lt;b&gt;people&lt;/b&gt; (migranti, turisti, pendolari). La slide cerchia &lt;b&gt;people&lt;/b&gt;: per questo corso il flusso centrale sono le persone, che abitano i luoghi (&lt;a href=&quot;#s5&quot;&gt;Parte 5&lt;/a&gt;).&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;4 · Urban nodes.&lt;/b&gt; Tutti i flussi convergono nelle città, che funzionano come nodi di una rete: porti, aeroporti, centri finanziari, quartieri dove i migranti arrivano. Le linee tratteggiate dicono che anche commercio, informazione e oggetti passano dai nodi urbani.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;5 · Socio-territorial systems.&lt;/b&gt; I flussi che entrano nei nodi trasformano i sistemi socio-territoriali: l&#x27;insieme di società, istituzioni e spazio organizzato di un luogo. Esempio: il turismo internazionale cambia gli abitanti, i prezzi delle case, gli usi del centro storico (Venezia, &lt;a href=&quot;#s7&quot;&gt;Parte 7&lt;/a&gt;).&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Dall&#x27;&lt;span class=&quot;tech&quot;&gt;areal approach&lt;/span&gt; al &lt;span class=&quot;tech&quot;&gt;networks approach&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 9&lt;/span&gt; «The mondialization process: SPACE from areal approach to NETWORKS approach» → «NETWORK of urban nodes».&lt;/p&gt;
&lt;p&gt;Un cambio di sguardo sullo spazio. Prova a passare dall&#x27;uno all&#x27;altro:&lt;/p&gt;
&lt;div data-toggle&gt;
&lt;div class=&quot;tablist&quot; style=&quot;margin-bottom:10px&quot;&gt;&lt;button class=&quot;chip&quot; data-mode=&quot;area&quot;&gt;Areal approach&lt;/button&gt;&lt;button class=&quot;chip&quot; data-mode=&quot;net&quot;&gt;Networks approach&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra approccio areale e reticolare&quot;&gt;
&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;640&quot; height=&quot;300&quot; rx=&quot;14&quot; class=&quot;f-card&quot;/&gt;
&lt;g data-show=&quot;area&quot;&gt;
&lt;path d=&quot;M20 30 L250 20 L270 140 L180 170 L30 150Z&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M250 20 L460 30 L440 150 L270 140Z&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M460 30 L620 40 L610 180 L440 150Z&quot; class=&quot;t25 sd25&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M30 150 L180 170 L270 140 L300 280 L20 280Z&quot; class=&quot;t250 sd250&quot; stroke-width=&quot;2&quot;/&gt;
&lt;path d=&quot;M270 140 L440 150 L610 180 L620 280 L300 280Z&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;140&quot; y=&quot;95&quot;&gt;regione A&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;90&quot;&gt;regione B&lt;/text&gt;&lt;text x=&quot;535&quot; y=&quot;110&quot;&gt;regione C&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;225&quot;&gt;regione D&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;225&quot;&gt;regione E&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;g data-show=&quot;net&quot;&gt;
&lt;g fill=&quot;none&quot; stroke-width=&quot;1.6&quot; class=&quot;sd85&quot;&gt;&lt;path d=&quot;M110 200 Q 230 40 330 120&quot;/&gt;&lt;path d=&quot;M110 200 Q 300 260 470 210&quot;/&gt;&lt;path d=&quot;M330 120 Q 400 30 540 90&quot;/&gt;&lt;path d=&quot;M330 120 Q 420 200 470 210&quot;/&gt;&lt;path d=&quot;M540 90 Q 560 160 470 210&quot;/&gt;&lt;path d=&quot;M110 200 Q 300 0 540 90&quot;/&gt;&lt;path d=&quot;M200 90 Q 260 70 330 120&quot;/&gt;&lt;/g&gt;
&lt;g class=&quot;d250&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;200&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;330&quot; cy=&quot;120&quot; r=&quot;26&quot;/&gt;&lt;circle cx=&quot;540&quot; cy=&quot;90&quot; r=&quot;20&quot;/&gt;&lt;circle cx=&quot;470&quot; cy=&quot;210&quot; r=&quot;18&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;90&quot; r=&quot;11&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;110&quot; y=&quot;240&quot;&gt;partenza&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;164&quot;&gt;transito (hub)&lt;/text&gt;&lt;text x=&quot;540&quot; y=&quot;128&quot;&gt;arrivo&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;245&quot;&gt;arrivo&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;40&quot;&gt;paths&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;320&quot; y=&quot;285&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-muted&quot; style=&quot;fill:var(--muted)&quot;&gt;tra un nodo e l&#x27;altro lo spazio quasi “sparisce”: conta la connessione, non la contiguità&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot; data-show=&quot;area&quot;&gt;&lt;b&gt;Areal approach&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Lo spazio come mosaico di &lt;i&gt;aree&lt;/i&gt; contigue e delimitate (regioni, stati, zone): ciò che conta è il confine, la vicinanza, l&#x27;omogeneità interna. Metrica topografica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-show=&quot;net&quot;&gt;&lt;b&gt;Networks approach&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;Lo spazio come &lt;i&gt;rete&lt;/i&gt; di nodi (le città) legati da flussi. Due città lontane ma ben connesse sono “più vicine” di due villaggi confinanti. Metrica topologica: conta chi è collegato a chi.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Nella rete si distinguono quattro elementi, indicati dalle frecce della slide 9:&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Elemento&lt;/th&gt;&lt;th&gt;Che cos&#x27;è&lt;/th&gt;&lt;th&gt;Esempio&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of departure&lt;/b&gt;&lt;/td&gt;&lt;td&gt;luoghi da cui partono i flussi&lt;/td&gt;&lt;td&gt;la città d&#x27;origine di un migrante&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of transition&lt;/b&gt;&lt;/td&gt;&lt;td&gt;luoghi di passaggio, sosta, smistamento&lt;/td&gt;&lt;td&gt;un aeroporto-hub, un campo profughi, un porto di trasbordo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Places of arrival&lt;/b&gt;&lt;/td&gt;&lt;td&gt;destinazioni dove i flussi si fermano e si insediano&lt;/td&gt;&lt;td&gt;un quartiere d&#x27;arrivo in una metropoli, una località turistica&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Paths&lt;/b&gt;&lt;/td&gt;&lt;td&gt;i percorsi che legano i luoghi&lt;/td&gt;&lt;td&gt;rotte aeree, cavi sottomarini, rotte migratorie&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Il risultato è un &lt;b&gt;NETWORK of urban nodes&lt;/b&gt;: il locale (le macchie blu sulla semisfera della slide) è sempre collegato al globale (gli archi gialli). Ogni luogo va letto insieme alle sue connessioni.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Nel networks approach, due città sono “vicine” quando…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;sono ben collegate da flussi, anche se lontane in chilometri&lt;/button&gt;&lt;button&gt;confinano&lt;/button&gt;&lt;button&gt;appartengono alla stessa regione amministrativa&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Nella rete la distanza si misura in connessioni (topologia), non in contiguità (topografia).&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Quale flusso la slide 8 mette in evidenza con il cerchio?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Trade&lt;/button&gt;&lt;button&gt;Information&lt;/button&gt;&lt;button&gt;People&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;People: sono le persone a collegare la mondializzazione ai temi dell&#x27;abitare.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: un grande aeroporto è luogo di partenza, transito o arrivo?&lt;/summary&gt;&lt;div&gt;Dipende dal flusso: può essere tutte e tre le cose. Per questo i nodi urbani sono complessi: lo stesso luogo ha ruoli diversi per persone diverse.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S5 --&gt;
&lt;section id=&quot;s5&quot; class=&quot;part&quot; style=&quot;--h:150&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 5 · slide 10&lt;/div&gt;
&lt;h2&gt;Inhabiting: una teoria sociale dello spazio&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 10&lt;/span&gt; «INHABITING – A social theory of space».&lt;/p&gt;
&lt;p&gt;Tre definizioni da sapere a memoria, ognuna più “attiva” della precedente:&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Space&lt;/b&gt; — &lt;i&gt;the environmental dimension of social actions&lt;/i&gt;: la dimensione ambientale delle azioni sociali. Ogni azione avviene da qualche parte, con distanze, luoghi, oggetti. Lo spazio non è un contenitore vuoto ma una dimensione della società.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Spatiality&lt;/b&gt; — &lt;i&gt;spatial component of social action&lt;/i&gt;: la componente spaziale dell&#x27;azione sociale, cioè ciò che gli attori &lt;i&gt;fanno&lt;/i&gt; con lo spazio: scegliere un percorso, evitare un quartiere, segnare un confine, avvicinarsi.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inhabiting&lt;/b&gt; — &lt;i&gt;interactive relation between social actors and space&lt;/i&gt;: la relazione interattiva tra attori sociali e spazio. Abitare non è solo “avere casa”: è il rapporto a doppio senso per cui le persone trasformano lo spazio e lo spazio condiziona le persone.&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Relazione interattiva tra attori sociali e spazio&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;d150&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;45&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Social actors&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;abitanti, istituzioni…&lt;/text&gt;
&lt;rect x=&quot;430&quot; y=&quot;45&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;40&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Space&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;luoghi, distanze, oggetti&lt;/text&gt;
&lt;path d=&quot;M215 70 Q 320 20 425 70&quot; fill=&quot;none&quot; class=&quot;sd150&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;spatiality: agiscono, nominano, costruiscono&lt;/text&gt;
&lt;path d=&quot;M425 102 Q 320 152 215 102&quot; fill=&quot;none&quot; class=&quot;sd150&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;lo spazio offre e limita possibilità&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-family=&quot;var(--serif)&quot; font-style=&quot;italic&quot;&gt;inhabiting&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;

&lt;h3&gt;Chi sono gli &lt;span class=&quot;tech&quot;&gt;inhabitants&lt;/span&gt;?&lt;/h3&gt;
&lt;p&gt;Dalla relazione dell&#x27;abitare discendono gli &lt;b&gt;abitanti&lt;/b&gt;: non solo i residenti. La slide li distingue &lt;b&gt;«by the way they stay in a place or move»&lt;/b&gt;, cioè per il modo in cui restano o si muovono. Clicca un tipo:&lt;/p&gt;
&lt;div data-info-group=&quot;whoInfo&quot;&gt;
&lt;div class=&quot;tablist&quot;&gt;
&lt;button class=&quot;chip&quot; data-k=&quot;res&quot;&gt;Residents&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;com&quot;&gt;Commuters&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;mig&quot;&gt;Migrants&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;tou&quot;&gt;Tourists&lt;/button&gt;&lt;button class=&quot;chip&quot; data-k=&quot;vis&quot;&gt;Visitors&lt;/button&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:14px 0 6px&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 110&quot; role=&quot;img&quot; aria-label=&quot;Scala dal restare al muoversi&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;55&quot; x2=&quot;600&quot; y2=&quot;55&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot; style=&quot;stroke:var(--muted)&quot;/&gt;
&lt;text x=&quot;40&quot; y=&quot;95&quot; font-size=&quot;12.5&quot;&gt;restano a lungo&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;95&quot; font-size=&quot;12.5&quot; text-anchor=&quot;end&quot;&gt;passano, tornano, si muovono&lt;/text&gt;
&lt;g data-mark=&quot;res&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d150&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;residents&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;mig&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;migrants&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;com&quot;&gt;&lt;circle cx=&quot;350&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d250&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;commuters&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;tou&quot;&gt;&lt;circle cx=&quot;460&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;d25&quot;/&gt;&lt;text x=&quot;460&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;tourists&lt;/text&gt;&lt;/g&gt;
&lt;g data-mark=&quot;vis&quot;&gt;&lt;circle cx=&quot;570&quot; cy=&quot;55&quot; r=&quot;12&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;visitors&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Posizioni indicative, per ragionare: nella realtà i profili si sovrappongono.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div id=&quot;whoInfo&quot; class=&quot;panel info&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;template data-for=&quot;res&quot;&gt;&lt;p&gt;&lt;b&gt;Residents&lt;/b&gt; · vivono stabilmente nel luogo: ci dormono, votano, pagano le tasse locali. Sono gli abitanti “classici”, ma oggi non più gli unici.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;com&quot;&gt;&lt;p&gt;&lt;b&gt;Commuters&lt;/b&gt; · pendolari: abitano un luogo e ne usano un altro ogni giorno (lavoro, studio). Abitano due luoghi a ritmo quotidiano, e una città li conta solo di giorno.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;mig&quot;&gt;&lt;p&gt;&lt;b&gt;Migrants&lt;/b&gt; · si spostano per stabilirsi altrove, per un periodo lungo o per sempre. Collegano luogo di partenza e di arrivo (Parte 4) e spesso abitano “tra” due luoghi.&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;tou&quot;&gt;&lt;p&gt;&lt;b&gt;Tourists&lt;/b&gt; · restano poco (almeno una notte), per svago. Pochi giorni, ma in numero enorme: possono cambiare un centro storico (&lt;a href=&quot;#s7&quot;&gt;overtourism a Venezia&lt;/a&gt;).&lt;/p&gt;&lt;/template&gt;
&lt;template data-for=&quot;vis&quot;&gt;&lt;p&gt;&lt;b&gt;Visitors&lt;/b&gt; · passano per motivi vari (affari, visita a parenti, escursione in giornata), anche senza pernottare. Il “…” della slide ricorda che la lista è aperta: city users, studenti fuori sede, lavoratori stagionali…&lt;/p&gt;&lt;/template&gt;
&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;b&gt;Other criteria.&lt;/b&gt; Gli abitanti si distinguono anche per &lt;span class=&quot;tag&quot;&gt;age&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;gender&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;profession&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;ethnicity&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;…&lt;/span&gt;. Incrociando mobilità e criteri sociali emergono bisogni diversi, spesso in conflitto: un anziano residente e un giovane turista non chiedono la stessa città. Proprio questi conflitti compaiono nei &lt;a href=&quot;#s7&quot;&gt;casi&lt;/a&gt; (ageing, different needs from inhabitants).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La triade space / spatiality / inhabiting (&lt;i&gt;espace, spatialité, habiter&lt;/i&gt;) riprende la geografia sociale francofona di Jacques Lévy e Michel Lussault, che nel &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt; (Belin, 2003; nuova ed. 2013) trattano l&#x27;abitare come relazione tra gli esseri umani e lo spazio e la spatialité come oggetto centrale (&lt;a href=&quot;https://www.usherbrooke.ca/dep-com/actualites/nouvelles/details/42022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Université de Sherbrooke, su “habiter”&lt;/a&gt;; &lt;a href=&quot;https://www.espacestemps.net/articles/une-geographie-dialogique/?output=pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su EspacesTemps.net&lt;/a&gt;).&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Qual è la differenza tra &lt;i&gt;space&lt;/i&gt; e &lt;i&gt;spatiality&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Sono sinonimi&lt;/button&gt;&lt;button&gt;Space è la dimensione ambientale delle azioni sociali; spatiality è la componente spaziale dell&#x27;azione, ciò che gli attori fanno con lo spazio&lt;/button&gt;&lt;button&gt;Space riguarda le città, spatiality le campagne&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Space è la dimensione, spatiality è l&#x27;agire spaziale degli attori.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Con quale criterio principale la slide distingue residents, commuters, migrants, tourists e visitors?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Il modo in cui restano in un luogo o si muovono&lt;/button&gt;&lt;button&gt;Il reddito&lt;/button&gt;&lt;button&gt;La nazionalità&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;«By the way they stay in a place or move»; età, genere, professione ed etnia sono «other criteria».&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: perché “abitare” non coincide con “risiedere”?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;abitare è una relazione con lo spazio che hanno anche pendolari, turisti e migranti. Una città è abitata da chi la usa, non solo da chi è iscritto all&#x27;anagrafe.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S6 --&gt;
&lt;section id=&quot;s6&quot; class=&quot;part&quot; style=&quot;--h:85&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 6 · slide 11–12&lt;/div&gt;
&lt;h2&gt;Process of territorialisation: come lo spazio diventa territorio&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 11–12&lt;/span&gt; Denomination, reification, structuration; modello a strati «Nature → Territory».&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Territory&lt;/b&gt; e &lt;b&gt;territorialisation&lt;/b&gt; — lo &lt;i&gt;spazio&lt;/i&gt; diventa &lt;i&gt;territorio&lt;/i&gt; quando una società se ne appropria: gli dà nomi, lo trasforma materialmente, lo organizza con istituzioni. La &lt;span class=&quot;tech&quot;&gt;territorialisation&lt;/span&gt; è il processo con cui questo avviene; il territorio è quindi un prodotto sociale, non un dato naturale.&lt;/div&gt;
&lt;p&gt;Le tre frecce della slide 11 sono tre &lt;b&gt;atti territorializzanti&lt;/b&gt;, dal più simbolico al più organizzativo:&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Denomination&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Symbolic appropriation&lt;/i&gt;: appropriazione simbolica, dare nomi e significati sociali. Chiamare una montagna “sacra”, un quartiere “Chinatown”.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Reification&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Practical transformation&lt;/i&gt;: trasformazione pratica, modificare l&#x27;ambiente o costruire nuovi &lt;i&gt;artifacts&lt;/i&gt; (manufatti): canali, campi, strade, case.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;Structuration&lt;/b&gt;&lt;p style=&quot;margin:.3em 0 0;font-size:.94rem&quot;&gt;&lt;i&gt;Functional organisation&lt;/i&gt;: organizzazione funzionale, creare strutture con istituzioni specifiche: comuni, consorzi, autorità portuali, piani regolatori.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Costruisci il territorio strato per strato&lt;/h3&gt;
&lt;p&gt;Il modello della slide 12 è una scatola a piani. Si parte dalla &lt;b&gt;nature&lt;/b&gt; e si sale. A sinistra c&#x27;è che cosa produce ogni atto, a destra la forma che prende nel territorio.&lt;/p&gt;
&lt;div data-steps&gt;
&lt;svg viewBox=&quot;0 0 640 420&quot; role=&quot;img&quot; aria-label=&quot;Modello a strati della territorializzazione&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;0&quot;&gt;&lt;polygon points=&quot;190,350 440,350 490,310 240,310&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,350 440,350 440,390 190,390&quot; class=&quot;t150 sd150&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; font-family=&quot;var(--serif)&quot;&gt;NATURE&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;1&quot;&gt;&lt;polygon points=&quot;190,290 440,290 490,250 240,250&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,290 440,290 440,320 190,320&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;311&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;DENOMINATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;306&quot; text-anchor=&quot;end&quot;&gt;Symbols&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;290&quot;&gt;Designators /&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;306&quot;&gt;place-names&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;2&quot;&gt;&lt;polygon points=&quot;190,215 440,215 490,175 240,175&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,215 440,215 440,245 190,245&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;236&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;REIFICATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;232&quot; text-anchor=&quot;end&quot;&gt;Practices&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;225&quot;&gt;Materiality&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;3&quot;&gt;&lt;polygon points=&quot;190,140 440,140 490,100 240,100&quot; class=&quot;t85 sd85&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;190,140 440,140 440,170 190,170&quot; class=&quot;d85&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;161&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;STRUCTURATION&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;157&quot; text-anchor=&quot;end&quot;&gt;Structures&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;140&quot;&gt;Operational&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;156&quot;&gt;contexts&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;lv&quot; data-lv=&quot;4&quot;&gt;&lt;rect x=&quot;190&quot; y=&quot;40&quot; width=&quot;250&quot; height=&quot;350&quot; fill=&quot;none&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polyline points=&quot;440,40 490,10 490,350 440,390&quot; fill=&quot;none&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;line x1=&quot;190&quot; y1=&quot;40&quot; x2=&quot;240&quot; y2=&quot;10&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;line x1=&quot;240&quot; y1=&quot;10&quot; x2=&quot;490&quot; y2=&quot;10&quot; class=&quot;sd25&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;22&quot; font-weight=&quot;700&quot; font-family=&quot;var(--serif)&quot; letter-spacing=&quot;.25em&quot; class=&quot;d25&quot;&gt;TERRITORY&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;‹ Giù&lt;/button&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; value=&quot;0&quot; aria-label=&quot;Strato&quot;&gt;&lt;button class=&quot;btn next&quot;&gt;Su ›&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;0 · Nature.&lt;/b&gt; Il punto di partenza: un ambiente fisico (una laguna, una pianura, una baia) prima dell&#x27;intervento sociale. Non ancora territorio, solo spazio naturale.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;1 · Denomination → Symbols → place-names.&lt;/b&gt; Si danno nomi (toponimi, i nomi di luogo) e significati. Il risultato concreto sono i &lt;span class=&quot;tech&quot;&gt;designators&lt;/span&gt;, i “designatori”: nomi, confini disegnati sulle mappe, simboli che dicono “questo luogo è così”.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;2 · Reification → Practices → materiality.&lt;/b&gt; Le pratiche trasformano fisicamente lo spazio: si scavano canali, si arano campi, si costruiscono case e porti. Il territorio acquista una &lt;i&gt;materiality&lt;/i&gt;, una consistenza materiale.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;3 · Structuration → Structures → operational contexts.&lt;/b&gt; Si creano istituzioni e regole (proprietà, amministrazioni, piani) che organizzano funzioni e usi. Il territorio diventa &lt;i&gt;operational context&lt;/i&gt;, cioè un contesto in cui si agisce secondo regole.&lt;/div&gt;
&lt;div class=&quot;step box&quot;&gt;&lt;b&gt;4 · Territory.&lt;/b&gt; Il territorio è l&#x27;intera scatola: i tre strati sovrapposti alla natura, sempre in movimento, perché nomi, manufatti e istituzioni cambiano. La scritta verticale TERRITORY attraversa tutti i livelli.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;&lt;span class=&quot;tech&quot;&gt;Territorialisation logic&lt;/span&gt;: self-centered o external?&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;sc&quot;&gt;Self-centered&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;ex&quot;&gt;External&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;sc&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Logica autocentrata.&lt;/b&gt; Gli atti territorializzanti sono decisi dalla comunità che abita il luogo, secondo i propri bisogni e valori: chi nomina, costruisce e organizza è chi ci vive.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;ex&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Logica esterna&lt;/b&gt; (eterocentrata). Nomi, trasformazioni e istituzioni vengono imposti da attori esterni: un potere coloniale, uno stato centrale, investitori globali, flussi turistici. Nel mondo mondializzato (Parte 4) è sempre più frequente: i flussi che arrivano nei nodi urbani portano con sé logiche esterne.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Esempio guidato: la laguna di Venezia&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Denomination&lt;/b&gt;: “la Serenissima”, i nomi di sestieri e calli, l&#x27;immagine di “città romantica” venduta nel mondo. &lt;b&gt;Reification&lt;/b&gt;: palificazioni, canali, deviazione dei fiumi, il sistema di dighe mobili MOSE. &lt;b&gt;Structuration&lt;/b&gt;: la Repubblica, oggi il Comune, l&#x27;Autorità per la laguna, l&#x27;UNESCO. Molti atti recenti seguono una logica &lt;i&gt;esterna&lt;/i&gt; (turismo globale). &lt;i&gt;Esempio aggiunto per questo riassunto, non presente nelle slide.&lt;/i&gt;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; La triade &lt;i&gt;denominazione, reificazione, strutturazione&lt;/i&gt; è associata al geografo italiano &lt;b&gt;Angelo Turco&lt;/b&gt;, per il quale il territorio è un artefatto sociale prodotto dall&#x27;azione umana, costruito gradualmente (teoria geografica della complessità, 1988; &lt;i&gt;Configurazioni della territorialità&lt;/i&gt;, 2010). Le slide non citano l&#x27;autore. Vedi &lt;a href=&quot;https://web.unica.it/static/resources/cms/documents/1.0.CattedraTerritorio_Territorializzazione.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Cagliari, «Territorializzazione»&lt;/a&gt; e la &lt;a href=&quot;https://gh.copernicus.org/articles/70/89/2015/gh-70-89-2015.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;discussione in &lt;i&gt;Geographica Helvetica&lt;/i&gt;&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 6&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;Costruire una diga e bonificare una palude è un atto di…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Denomination&lt;/button&gt;&lt;button&gt;Structuration&lt;/button&gt;&lt;button&gt;Reification&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;È una trasformazione pratica e materiale, quindi reification.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Che cosa sta, nel modello, accanto a &lt;i&gt;structuration&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Structures (a sinistra) e operational contexts (a destra)&lt;/button&gt;&lt;button&gt;Symbols e place-names&lt;/button&gt;&lt;button&gt;Practices e materiality&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Symbols/place-names vanno con denomination, practices/materiality con reification.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Rinominare in inglese le vie di una città per renderla “più attraente” per gli investitori stranieri segue una logica…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Self-centered&lt;/button&gt;&lt;button&gt;External&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;È una denomination guidata da attori e bisogni esterni alla comunità locale.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- S7 --&gt;
&lt;section id=&quot;s7&quot; class=&quot;part&quot; style=&quot;--h:25&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Parte 7 · slide 13&lt;/div&gt;
&lt;h2&gt;Quattro luoghi, gli stessi concetti&lt;/h2&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;slide&quot;&gt;slide 13&lt;/span&gt; Venice · Poland · Middle East · Osaka, ciascuno con parole chiave. Sembra la sintesi di una discussione in aula (forse lavori di gruppo): la slide dà solo le parole, le spiegazioni sotto sono una lettura proposta per collegarle ai concetti della lezione.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;ve&quot;&gt;Venice&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;po&quot;&gt;Poland&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;me&quot;&gt;Middle East&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;os&quot;&gt;Osaka&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;ve&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Climate change&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Overtourism&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Different needs from inhabitants&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Gentrification&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Structuration&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Climate change&lt;/b&gt;: acqua alta e innalzamento del mare, un esempio locale degli effetti globali dell&#x27;&lt;a href=&quot;#s1&quot;&gt;Anthropocene&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Overtourism&lt;/b&gt;: un flusso di &lt;i&gt;people&lt;/i&gt; così intenso da superare ciò che il luogo può sostenere (&lt;a href=&quot;#s4&quot;&gt;Parte 4&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Different needs from inhabitants&lt;/b&gt;: residenti, pendolari e turisti chiedono cose diverse (&lt;a href=&quot;#s5&quot;&gt;Parte 5&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Gentrification&lt;/b&gt;: arrivano abitanti o usi più ricchi (affitti brevi, seconde case), i prezzi salgono e gli abitanti originari se ne vanno.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Structuration&lt;/b&gt;: la questione chiave è istituzionale, cioè chi governa e con quali regole i flussi.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;po&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Seasonality&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ageing&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Climate change&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Denomination&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Seasonality&lt;/b&gt;: la popolazione presente cambia con le stagioni (turismo, lavoro agricolo), quindi gli abitanti variano nel tempo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ageing&lt;/b&gt;: invecchiamento della popolazione e quindi bisogni diversi (criterio &lt;i&gt;age&lt;/i&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Climate change&lt;/b&gt;: ancora la scala globale che entra nel locale.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Denomination&lt;/b&gt;: l&#x27;atto chiave è simbolico, cioè come i luoghi vengono nominati, rinominati e rappresentati (in un paese con confini e nomi cambiati più volte nella storia).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;me&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Ethnical and gender division&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Unequal distribution of resources&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Different external processes of territorialisation&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Ethnical and gender division&lt;/b&gt;: lo spazio è diviso secondo gli &lt;i&gt;other criteria&lt;/i&gt; della slide 10 (ethnicity, gender), quindi l&#x27;accesso ai luoghi non è uguale per tutti.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Unequal distribution of resources&lt;/b&gt;: acqua, terra ed energia distribuite in modo diseguale, cioè un problema di &lt;i&gt;spatial justice&lt;/i&gt; (&lt;a href=&quot;#s3&quot;&gt;Parte 3&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Different external processes of territorialisation&lt;/b&gt;: confini, nomi e infrastrutture imposti da attori esterni (logica &lt;i&gt;external&lt;/i&gt;, &lt;a href=&quot;#s6&quot;&gt;Parte 6&lt;/a&gt;), spesso in competizione tra loro.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-p=&quot;os&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;tag&quot;&gt;Water level&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Ageing&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;Denomination&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Water level&lt;/b&gt;: città costiera e di delta, esposta a innalzamento del mare, mareggiate e subsidenza, quindi un tema di &lt;i&gt;vulnerability &amp;amp; resilience&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ageing&lt;/b&gt;: il Giappone è una delle società più anziane al mondo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Denomination&lt;/b&gt;: come la città costruisce e comunica la propria identità e i propri nomi di luogo.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Vista d&#x27;insieme&lt;/h3&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Tema&lt;/th&gt;&lt;th&gt;Venice&lt;/th&gt;&lt;th&gt;Poland&lt;/th&gt;&lt;th&gt;Middle East&lt;/th&gt;&lt;th&gt;Osaka&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Clima / acqua&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Ageing&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;●&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Flussi di persone&lt;/td&gt;&lt;td&gt;● overtourism&lt;/td&gt;&lt;td&gt;● seasonality&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Diseguaglianze&lt;/td&gt;&lt;td&gt;● gentrification&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;● risorse, etnia, genere&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Atto di territorialisation&lt;/td&gt;&lt;td&gt;structuration&lt;/td&gt;&lt;td&gt;denomination&lt;/td&gt;&lt;td&gt;external processes&lt;/td&gt;&lt;td&gt;denomination&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Lo schema mostra il senso della lezione: le sfide globali dell&#x27;&lt;a href=&quot;#s3&quot;&gt;Urbanocene&lt;/a&gt; (clima, flussi, invecchiamento) arrivano sempre &lt;i&gt;in un luogo&lt;/i&gt;, filtrate dal suo modo di abitare e territorializzare.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;
&lt;h3&gt;Autoverifica · Parte 7&lt;/h3&gt;
&lt;div class=&quot;q&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Quali due casi condividono sia &lt;i&gt;ageing&lt;/i&gt; sia &lt;i&gt;denomination&lt;/i&gt;?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Venice e Middle East&lt;/button&gt;&lt;button&gt;Poland e Osaka&lt;/button&gt;&lt;button&gt;Venice e Osaka&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot;&gt;Poland e Osaka; Poland aggiunge seasonality e climate change, Osaka water level.&lt;/p&gt;&lt;button class=&quot;retry&quot;&gt;Riprova&lt;/button&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Esercizio: scegli una città che conosci e compila la sua riga&lt;/summary&gt;&lt;div&gt;Rispondi a quattro domande. Quali flussi (trade, information, objects, people) la attraversano? Chi sono i suoi abitanti (residents, commuters, migrants, tourists…)? Quale atto di territorialisation è oggi decisivo, e con logica self-centered o external? Quale obiettivo del modello di Lussault è più a rischio?&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- FONTI --&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot; style=&quot;--h:250&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;num&quot;&gt;Per approfondire&lt;/div&gt;
&lt;h2&gt;Autori, studi e testi citati nelle slide&lt;/h2&gt;
&lt;p&gt;Ogni scheda indica cosa compare nelle slide e aggiunge informazioni &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; trovate con ricerca web, con il link. Verifica sempre i dati bibliografici su un catalogo di biblioteca.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crutzen, P. J. &amp;amp; Stoermer, E. F. (2000), «The “Anthropocene”»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;IGBP Global Change Newsletter&lt;/i&gt; 41, pp. 17–18. Nelle slide: testo integrale (slide 1).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.mpic.de/3864697/the-anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Max Planck Institute for Chemistry, testo&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;È l&#x27;articolo che ha lanciato il termine nel dibattito scientifico: breve, leggibile, da leggere per intero.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Steffen, W., Broadgate, W., Deutsch, L., Gaffney, O. &amp;amp; Ludwig, C. (2015), «The trajectory of the Anthropocene: The Great Acceleration»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;The Anthropocene Review&lt;/i&gt; 2(1), pp. 81–98. DOI 10.1177/2053019614564785. Nelle slide: i 24 grafici (slide 2–3).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://journals.sagepub.com/doi/10.1177/2053019614564785&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sage&lt;/a&gt; · &lt;a href=&quot;https://openresearch-repository.anu.edu.au/bitstream/1885/66463/8/01_Steffen_GREAT%20ACCELERATION_2015.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF nel repository ANU&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Aggiorna i grafici del 2004 fino al 2010 e distingue OCSE, paesi emergenti e resto del mondo. Utile per discutere chi causa davvero l&#x27;accelerazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vitousek, P. M., Mooney, H. A., Lubchenco, J. &amp;amp; Melillo, J. M. (1997), «Human Domination of Earth&#x27;s Ecosystems»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Science&lt;/i&gt; 277(5325), pp. 494–499. Citato nella slide 1 per il dato 30–50% di suolo trasformato.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://doi.org/10.1126/science.277.5325.494&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI 10.1126/science.277.5325.494&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Tra i testi più citati sull&#x27;impatto umano: suolo, CO₂, ciclo dell&#x27;azoto, acqua, estinzioni. Conclude che viviamo su un «pianeta dominato dall&#x27;uomo».&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Berger, A. &amp;amp; Loutre, M.-F. (2002), «An Exceptionally Long Interglacial Ahead?»&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Science&lt;/i&gt; 297, pp. 1287–1288. Nella slide 1 per l&#x27;orizzonte dei 50 000 anni.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://dial.uclouvain.be/pr/boreal/fr/object/boreal%3A9224&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda UCLouvain&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/spr/climat/v46y2000i1d10.1023_a1005559827189.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo collegato in &lt;i&gt;Climatic Change&lt;/i&gt; (2000)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Mostra con modelli climatici che l&#x27;interglaciale attuale potrebbe durare ~50 000 anni. Le emissioni umane agiscono quindi su tempi geologici.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Marsh, G. P. (1864), &lt;i&gt;Man and Nature; or, Physical Geography as Modified by Human Action&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Nella slide 1 tra i precursori.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://gutenberg.org/ebooks/37957&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Gutenberg, testo libero&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Testo fondativo dell&#x27;ambientalismo e della geografia dell&#x27;impatto umano. Fu tradotto in italiano nel 1872 e influenzò Stoppani.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Stoppani, A. (1873), &lt;i&gt;Corso di geologia&lt;/i&gt; e l&#x27;«era antropozoica»&lt;/h4&gt;&lt;p&gt;Nella slide 1: l&#x27;uomo come «nuova forza tellurica».&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Antonio_Stoppani&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Antonio Stoppani&lt;/a&gt; · &lt;a href=&quot;https://www4.ti.ch/fileadmin/DT/temi/mcsn/Monte_San_Giorgio/documentazione/Stockar_-_2020_-_L_era_in_cui_l_uomo_domina_la_terra.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stockar 2020, «L&#x27;era in cui l&#x27;uomo domina la terra»&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Precursore italiano dell&#x27;idea di Anthropocene. Il termine compare già negli anni 1867–1873 e non entrò mai nella scala geologica ufficiale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Vernadsky, V. I. (1926), &lt;i&gt;The Biosphere&lt;/i&gt;; Teilhard de Chardin, P. &amp;amp; Le Roy, É., &lt;i&gt;noösphere&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Nella slide 1: la biosfera e la «sfera del pensiero».&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Noosphere&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Noosphere&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Il concetto nasce dagli scambi parigini degli anni &#x27;20 tra i tre studiosi. Per Vernadsky è un&#x27;idea geologica, per Teilhard teologica. Le fonti non concordano su chi abbia coniato il termine.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lyell, C. (1833) e il Congresso geologico internazionale di Bologna (1885)&lt;/h4&gt;&lt;p&gt;Nella slide 1 per l&#x27;origine del nome Holocene.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.britannica.com/science/Holocene-Epoch&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica, Holocene Epoch&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Precisa che Lyell propose «Recent» e che «Holocene» risale al 1867, presentato a Bologna nel 1885.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lussault, M., &lt;i&gt;L&#x27;Homme spatial&lt;/i&gt; (2007), &lt;i&gt;L&#x27;Avènement du monde&lt;/i&gt; (2013), &lt;i&gt;Hyper-lieux&lt;/i&gt; (2017), Seuil&lt;/h4&gt;&lt;p&gt;Nelle slide 5–6: modello sull&#x27;Urbanocene (2022) e copertine.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://espacestemps.net/articles/homme-spatial-prend-places/?pdf=28628&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EspacesTemps su &lt;i&gt;L&#x27;Homme spatial&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.letemps.ch/culture/une-habitation-humaine-planete&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps su &lt;i&gt;L&#x27;Avènement du monde&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.letemps.ch/suisse/arpenter-geneve-recherche-hyperlieux&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Le Temps su &lt;i&gt;Hyper-lieux&lt;/i&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Sono i riferimenti teorici della lezione: spazio come costruzione sociale, abitare la Terra, iper-luoghi della mondializzazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lussault e l&#x27;«urbanocène»&lt;/h4&gt;&lt;p&gt;Nella slide 4: «Anthropocene could be considered as an Urbanocene».&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://live-global-metro-studies.pantheon.berkeley.edu/events/michel-lussault-could-anthropocene-be-urbanocene/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UC Berkeley, «Could Anthropocene be Urbanocene?»&lt;/a&gt; · &lt;a href=&quot;https://metropolitics.org/IMG/pdf/met-devisme-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Metropolitics, recensione di &lt;i&gt;Cohabitons!&lt;/i&gt; (2024)&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Spiega perché l&#x27;urbanizzazione sarebbe il vero motore del cambiamento globale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Lévy, J. &amp;amp; Lussault, M. (dir.), &lt;i&gt;Dictionnaire de la géographie et de l&#x27;espace des sociétés&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Non citato nelle slide, ma è la fonte dei concetti space, spatiality, inhabiting (slide 10).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://revistaseug.ugr.es/index.php/cuadgeo/article/view/1790&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su &lt;i&gt;Cuadernos Geográficos&lt;/i&gt;&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Il dizionario di riferimento della geografia sociale francofona (Belin, 2003; nuova ed. 2013).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Turco, A., teoria della territorializzazione&lt;/h4&gt;&lt;p&gt;Non citato nelle slide; fonte probabile della triade denomination, reification, structuration (slide 11–12).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://web.unica.it/static/resources/cms/documents/1.0.CattedraTerritorio_Territorializzazione.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Cagliari, «Territorializzazione»&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;Definisce il territorio come artefatto sociale prodotto da tre atti territorializzanti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IUGS / ICS (2024), decisione sull&#x27;Anthropocene&lt;/h4&gt;&lt;p&gt;Non nelle slide: aggiornamento sullo stato del dibattito.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Vienna, statement&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why2&quot;&gt;L&#x27;Anthropocene non è un&#x27;epoca geologica formale, ma resta un concetto centrale per le scienze umane e ambientali.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
