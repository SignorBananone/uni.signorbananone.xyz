&lt;main&gt;
&lt;!-- ===================== 1. QUADRO ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Il quadro · slide 1–3&lt;/div&gt;&lt;h2&gt;Una transizione che cambia le regole del potere&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«The transition is changing the conditions under which political power operates.» &lt;span class=&quot;src&quot;&gt;slide 1&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;La &lt;b class=&quot;t&quot;&gt;sustainability transition&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(transizione di sostenibilità: il passaggio, lungo decenni, da sistemi energetici, produttivi e alimentari basati su fonti fossili e sfruttamento lineare a sistemi a basse emissioni e più equi)&lt;/span&gt; non è un fatto solo tecnico. Cambia &lt;i&gt;dove&lt;/i&gt; stanno le risorse che contano, &lt;i&gt;chi&lt;/i&gt; le controlla e &lt;i&gt;quali&lt;/i&gt; paesi diventano dipendenti da altri. Per questo la lezione la legge con la lente della &lt;b class=&quot;t&quot;&gt;geopolitics&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(lo studio di come territorio, risorse e posizione geografica plasmano il potere tra Stati e attori)&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;I quattro driver del cambiamento &lt;span class=&quot;src&quot;&gt;slide 1&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Climate&lt;/div&gt;&lt;h4&gt;Temperature in aumento, loss and damage&lt;/h4&gt;&lt;p&gt;Il riscaldamento produce impatti fisici. &lt;b class=&quot;t&quot;&gt;Loss and damage&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(perdite e danni: gli impatti che né la mitigazione né l&#x27;adattamento sono riusciti a evitare, come terre sommerse o raccolti distrutti)&lt;/span&gt; è diventato anche una categoria negoziale. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Resources&lt;/div&gt;&lt;h4&gt;Acqua, cibo, minerali, energia&lt;/h4&gt;&lt;p&gt;Le risorse di base diventano più scarse o più contese; la transizione ne fa emergere di nuove (litio, cobalto, terre rare).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Technology&lt;/div&gt;&lt;h4&gt;AI, dati, infrastrutture digitali&lt;/h4&gt;&lt;p&gt;Il digitale serve a monitorare il pianeta, ma è anche infrastruttura strategica e strumento di intelligence (vedi il caso Artico).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Power&lt;/div&gt;&lt;h4&gt;Nuove dipendenze e nuove alleanze&lt;/h4&gt;&lt;p&gt;Chi controlla minerali, tecnologie e rotte acquista leva; nascono coalizioni nuove (es. paesi andini sui minerali).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Un rapporto &lt;i&gt;mutually constitutive&lt;/i&gt; &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;«Geopolitics shapes the path of sustainability transitions. Sustainability transitions reshape geopolitics.» &lt;b class=&quot;t&quot;&gt;Mutually constitutive&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(che si costituiscono a vicenda: nessuno dei due termini è solo causa o solo effetto)&lt;/span&gt; significa che le forze geopolitiche decidono velocità e forma della transizione, e la transizione a sua volta ridisegna le forze geopolitiche. Passa il mouse o tocca le voci per vedere esempi.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Security priorities&lt;/b&gt;&lt;br&gt;Se la difesa assorbe bilancio e attenzione, la finanza per il clima può ridursi (sez. 8).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Territory&lt;/b&gt;&lt;br&gt;Chi sta a monte di un fiume controlla l&#x27;acqua di chi sta a valle (sez. 6).&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;g2&quot; hidden&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Decarbonisation&lt;/b&gt;&lt;br&gt;Sposta la dipendenza da petrolio e gas a litio, cobalto, terre rare e capacità di raffinazione (sez. 4 e 9).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Climate finance&lt;/b&gt;&lt;br&gt;Diventa terreno di negoziato tra Nord e Sud del mondo: chi paga adattamento e loss and damage (sez. 7).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Planetary equity&lt;/b&gt;&lt;br&gt;Le rivendicazioni di equità danno voce diplomatica a Stati piccoli ma molto esposti (sez. 7).&lt;/div&gt;

&lt;p class=&quot;cap&quot;&gt;Esempi costruiti collegando le voci della slide 2 ai casi della lezione. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The central tension: perché la transizione diventa politica &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;claim&quot;&gt;«Every transformation creates winners, losers and new dependencies.»&lt;/p&gt;
&lt;div class=&quot;stepper dim&quot; data-steps&gt;
&lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Tre fasi: vecchio sistema, transizione, effetti politici&quot; style=&quot;width:100%;height:auto&quot;&gt;
&lt;g data-k=&quot;0&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-slatebg&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-slate&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Old system&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;fossil fuel incumbency&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;1&quot;&gt;&lt;rect x=&quot;270&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-sagebg&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-sage&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Transition&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;renewables &amp;amp; electrification&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;2&quot;&gt;&lt;rect x=&quot;530&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-ochre&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Political effects&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;competition · conflict · cooperation&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M234 60h30M494 60h30&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Old system&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b class=&quot;t&quot;&gt;Fossil fuel incumbency&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(il potere degli “incumbent”, cioè attori già dominanti: compagnie e Stati produttori di petrolio, gas, carbone, con interessi a rallentare il cambiamento)&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Established trade routes&lt;/b&gt;: oleodotti, rotte delle petroliere, stretti strategici.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Concentrated power&lt;/b&gt;: pochi produttori, molta rendita.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Transition&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Renewables and electrification&lt;/b&gt;: sole, vento, auto elettriche, pompe di calore.&lt;/li&gt;&lt;li&gt;&lt;b&gt;New minerals and infrastructure&lt;/b&gt;: batterie, reti, accumuli, cavi sottomarini.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Faster technological change&lt;/b&gt;: cicli d&#x27;innovazione più rapidi, vantaggi che si spostano velocemente.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Political effects&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Resource competition&lt;/b&gt;: corsa ai minerali critici e alle rotte (sez. 3, 4, 9).&lt;/li&gt;&lt;li&gt;&lt;b class=&quot;t&quot;&gt;Distributional conflict&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(conflitto distributivo: lotta su chi sostiene i costi e chi incassa i benefici)&lt;/span&gt;: regioni carbonifere, comunità minerarie, Paesi esportatori di fossili.&lt;/li&gt;&lt;li&gt;&lt;b&gt;New forms of cooperation&lt;/b&gt;: accordi sull&#x27;acqua, alleanze tra produttori, fondi per il clima.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;Il punto: la transizione non elimina i rapporti di forza, li sposta. È la tesi che torna in ogni caso di studio.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · il quadro&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Che cosa significa che geopolitica e transizione sono “mutually constitutive”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che si influenzano in entrambe le direzioni: le forze geopolitiche (territorio, sanzioni, alleanze, priorità di sicurezza) determinano il percorso della transizione, e la transizione (decarbonizzazione, finanza climatica, equità) ridisegna gli equilibri geopolitici. Nessuna delle due è solo causa.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Perché ogni trasformazione diventa politica, secondo la slide 3?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché crea vincitori, perdenti e nuove dipendenze. Passando da un sistema fossile con potere concentrato a uno basato su rinnovabili e nuovi minerali, si generano competizione per le risorse, conflitti distributivi e nuove forme di cooperazione.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Cita i quattro driver della slide 1 con un esempio ciascuno.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Climate (aumento delle temperature, loss and damage); Resources (acqua, cibo, minerali, energia); Technology (AI, dati, infrastrutture digitali); Power (nuove dipendenze e nuove alleanze).&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 2. MAR ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;mar&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Concetti chiave · slide 4&lt;/div&gt;&lt;h2&gt;Mitigation, adaptation, resilience&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Sono i &lt;b&gt;tre pilastri dell&#x27;azione climatica globale&lt;/b&gt;. Insieme formano un quadro completo: la &lt;i&gt;mitigation&lt;/i&gt; agisce sulle &lt;b&gt;cause&lt;/b&gt;, l&#x27;&lt;i&gt;adaptation&lt;/i&gt; sugli &lt;b&gt;impatti immediati&lt;/b&gt;, la &lt;i&gt;resilience&lt;/i&gt; prepara i sistemi a &lt;b&gt;resistere e riprendersi&lt;/b&gt; dagli shock. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;m&quot;&gt;Mitigation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;a&quot;&gt;Adaptation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;r&quot;&gt;Resilience&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;m&quot;&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Attack the root cause&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Mitigation&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(mitigazione)&lt;/span&gt;: ridurre o prevenire l&#x27;emissione di gas serra.&lt;/p&gt;&lt;p&gt;Esempi: rinnovabili, efficienza energetica, trasporto marittimo a basse emissioni, sequestro del carbonio nell&#x27;oceano (slide 7).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Domanda guida&lt;/div&gt;&lt;p&gt;«Come evitiamo che il problema peggiori?» Agisce su scala globale e su tempi lunghi: i benefici arrivano a tutti, anche a chi non ha contribuito, il che crea incentivi a lasciar fare agli altri (&lt;i&gt;free riding&lt;/i&gt;). &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;a&quot; hidden&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Adjust systems and behaviours&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Adaptation&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(adattamento)&lt;/span&gt;: modificare sistemi e comportamenti per convivere con i cambiamenti climatici attuali e futuri.&lt;/p&gt;&lt;p&gt;Esempi: protezione delle coste, pesca sostenibile (slide 7), migrazione come strategia di diversificazione (slide 12).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Domanda guida&lt;/div&gt;&lt;p&gt;«Come conviviamo con ciò che è già in atto?» È locale e i benefici restano soprattutto a chi la fa, ma costa: i Paesi più esposti spesso sono i meno ricchi (caso piccole isole). &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;r&quot; hidden&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Build the overall capacity&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Resilience&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(resilienza)&lt;/span&gt;: la capacità complessiva di un sistema di assorbire gli shock, ridurre al minimo i danni e riprendersi in fretta.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Domanda guida&lt;/div&gt;&lt;p&gt;«Quando arriva lo shock, quanto cadiamo e quanto in fretta ci rialziamo?» È una proprietà del sistema (istituzioni, reti, comunità, finanza), non un singolo intervento. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Laboratorio: i tre pilastri su uno shock climatico&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Il grafico mostra il “livello di funzionamento” di un sistema (es. una città costiera) prima e dopo uno shock. Muovi i cursori: &lt;b&gt;mitigation&lt;/b&gt; riduce l&#x27;intensità dello shock, &lt;b&gt;adaptation&lt;/b&gt; riduce quanto il sistema ne risente, &lt;b&gt;resilience&lt;/b&gt; accelera la ripresa e limita i danni permanenti. L&#x27;area colorata è la perdita cumulata.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;resil&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 270&quot; role=&quot;img&quot; aria-label=&quot;Curva di funzionamento di un sistema prima e dopo uno shock&quot;&gt;
&lt;line x1=&quot;50&quot; y1=&quot;230&quot; x2=&quot;620&quot; y2=&quot;230&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;230&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:1.5&quot;/&gt;
&lt;line x1=&quot;50&quot; y1=&quot;50&quot; x2=&quot;620&quot; y2=&quot;50&quot; style=&quot;stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1&quot;/&gt;
&lt;text x=&quot;56&quot; y=&quot;44&quot; class=&quot;s-mut&quot; style=&quot;font-size:11px&quot;&gt;livello pre-shock&lt;/text&gt;
&lt;text x=&quot;335&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:12px&quot;&gt;tempo →&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;140&quot; class=&quot;s-mut&quot; style=&quot;font-size:12px&quot; transform=&quot;rotate(-90 20 140)&quot; text-anchor=&quot;middle&quot;&gt;funzionamento&lt;/text&gt;
&lt;path id=&quot;rArea&quot; style=&quot;fill:var(--accent);opacity:.18&quot;/&gt;
&lt;path id=&quot;rLine&quot; fill=&quot;none&quot; style=&quot;stroke:var(--accent);stroke-width:3;stroke-linejoin:round&quot;/&gt;
&lt;line x1=&quot;164&quot; y1=&quot;30&quot; x2=&quot;164&quot; y2=&quot;230&quot; style=&quot;stroke:var(--brick);stroke-width:1.5;stroke-dasharray:2 3&quot;/&gt;&lt;text x=&quot;168&quot; y=&quot;34&quot; class=&quot;f-brick&quot; style=&quot;font-size:12px;font-weight:600&quot;&gt;shock&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctl slate&quot;&gt;&lt;label for=&quot;sM&quot;&gt;Mitigation&lt;/label&gt;&lt;input id=&quot;sM&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oM&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl sage&quot;&gt;&lt;label for=&quot;sA&quot;&gt;Adaptation&lt;/label&gt;&lt;input id=&quot;sA&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oA&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl ochre&quot;&gt;&lt;label for=&quot;sR&quot;&gt;Resilience&lt;/label&gt;&lt;input id=&quot;sR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oR&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;Caduta massima&lt;b id=&quot;rDrop&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Tempo di ripresa&lt;b id=&quot;rTime&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Danno permanente&lt;b id=&quot;rPerm&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Perdita cumulata&lt;b id=&quot;rLoss&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Modello illustrativo costruito per lo studio, non dati reali. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Le definizioni ufficiali dell&#x27;IPCC&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il glossario dell&#x27;IPCC (AR6) definisce la &lt;i&gt;mitigation&lt;/i&gt; come «un intervento umano per ridurre le emissioni o potenziare i pozzi di assorbimento dei gas serra» e l&#x27;&lt;i&gt;adaptation&lt;/i&gt;, nei sistemi umani, come «il processo di aggiustamento al clima attuale o atteso e ai suoi effetti, per moderare i danni o sfruttare le opportunità». Per la &lt;i&gt;resilience&lt;/i&gt; il glossario parla della capacità dei sistemi sociali, economici ed ecologici di far fronte a un evento pericoloso riorganizzandosi in modo da mantenere funzioni, identità e struttura essenziali. &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ipcc.ch/report/ar6/wg2/chapter/annex-ii/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPCC AR6 WGII, Annex II: Glossary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · tre pilastri&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Una diga costiera contro le mareggiate è mitigation o adaptation?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Adaptation: non riduce le emissioni, ma adegua il sistema agli impatti (innalzamento del mare, tempeste). Nella slide 7 corrisponde a “Strengthening coastal protection”.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Qual è la differenza tra adaptation e resilience?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;L&#x27;adaptation è un insieme di aggiustamenti specifici per convivere con impatti noti; la resilience è la capacità complessiva del sistema di assorbire shock (anche imprevisti), limitare i danni e riprendersi in fretta. L&#x27;adattamento contribuisce alla resilienza, ma non la esaurisce.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Perché la mitigation è più esposta al problema del free riding rispetto all&#x27;adaptation?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché la riduzione delle emissioni produce un beneficio globale che va a tutti, anche a chi non paga; i benefici dell&#x27;adattamento restano invece in gran parte a chi lo realizza.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 3. ARTICO ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;artico&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 1 · Northern Europe and the Arctic · slide 5–9&lt;/div&gt;&lt;h2&gt;L&#x27;Artico, uno spazio strategico che cambia&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Dalla slide 5 la lezione passa ai &lt;b&gt;case studies across the world&lt;/b&gt;: «the same transition looks different from different places». La stessa transizione, vista da luoghi diversi, produce problemi diversi. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;claim&quot;&gt;«Environmental change opens new routes and new security questions.» &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;What changes&lt;/div&gt;&lt;ul&gt;&lt;li&gt;La perdita di ghiaccio marino (&lt;b class=&quot;t&quot;&gt;sea-ice loss&lt;/b&gt;) cambia &lt;b&gt;accesso, mobilità e monitoraggio&lt;/b&gt;: rotte e giacimenti prima irraggiungibili diventano accessibili.&lt;/li&gt;&lt;li&gt;Le infrastrutture offshore (piattaforme, cavi, gasdotti) diventano insieme &lt;b&gt;asset economici&lt;/b&gt; e &lt;b&gt;questioni di sicurezza&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Geopolitical dilemma&lt;/div&gt;&lt;p&gt;La digitalizzazione migliora l&#x27;osservazione ambientale (satelliti, sensori, modelli) ma collega i sistemi di monitoraggio alle priorità di &lt;b&gt;intelligence e difesa&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;È un caso di tecnologia &lt;b class=&quot;t&quot;&gt;dual-use&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(a duplice uso: la stessa infrastruttura serve scopi civili e militari)&lt;/span&gt;. Chi raccoglie i dati sul ghiaccio vede anche le navi. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Ocean climate change: impatti e soluzioni &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;La slide riprende uno schema che mette al centro &lt;i&gt;ocean climate change + AI&lt;/i&gt;: in alto gli &lt;b&gt;impatti&lt;/b&gt;, divisi tra proprietà fisiche dell&#x27;oceano ed ecosistemi marini; in basso le &lt;b&gt;soluzioni&lt;/b&gt;, divise tra mitigation e adaptation. Tocca un impatto per leggerne il significato.&lt;/p&gt;

&lt;text x=&quot;500&quot; y=&quot;80&quot; class=&quot;f-sage&quot; style=&quot;font:600 13px var(--sans);letter-spacing:.08em&quot;&gt;MARINE ECOSYSTEMS&lt;/text&gt;

&lt;g data-i=&quot;1&quot; class=&quot;slate&quot;&gt;&lt;line x1=&quot;380&quot; y1=&quot;230&quot; x2=&quot;190&quot; y2=&quot;128&quot; class=&quot;st-rule&quot;/&gt;&lt;circle cx=&quot;190&quot; cy=&quot;128&quot; r=&quot;34&quot; class=&quot;s-cbg st-c&quot; style=&quot;stroke-width:2&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font-size:11.5px&quot;&gt;Warming&lt;/text&gt;&lt;/g&gt;

&lt;/g&gt;&lt;/svg&gt;
&lt;div class=&quot;note&quot; id=&quot;oceanTxt&quot; aria-live=&quot;polite&quot;&gt;Tocca un cerchio.&lt;/div&gt;
&lt;figcaption&gt;Ricostruzione dello schema della slide 7; le spiegazioni dei singoli impatti sono aggiunte didattiche. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h4&gt;Gioco di classificazione: mitigation o adaptation?&lt;/h4&gt;
&lt;p class=&quot;cap&quot;&gt;Le cinque soluzioni della slide 7. Scegli la categoria per ciascuna.&lt;/p&gt;
&lt;div class=&quot;grid&quot; id=&quot;sortGame&quot;&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Developing ocean-based renewable energy&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Advancing low-carbon maritime transportation&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Enhancing ocean carbon sequestration&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;A&quot;&gt;&lt;b&gt;Strengthening coastal protection&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;A&quot;&gt;&lt;b&gt;Improving sustainable fisheries&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;E le comunità indigene? &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;La mappa della slide 8 mostra gli &lt;b&gt;otto Stati artici&lt;/b&gt; (Canada, Danimarca con la Groenlandia, Finlandia, Islanda, Norvegia, Federazione Russa, Svezia, Stati Uniti) e, sopra, decine di &lt;b&gt;comunità indigene artiche&lt;/b&gt;. La domanda della slide, «What about Indigenous communities?», sposta il discorso: le rotte e le risorse sono contese tra Stati, ma i territori sono abitati da popoli (Inuit, Sámi, Aleut, Gwich&#x27;in e altri) per i quali il ghiaccio è casa, caccia e cultura.&lt;/p&gt;
&lt;p&gt;Il punto collega l&#x27;Artico alla domanda di fondo della lezione: &lt;b&gt;chi definisce la sicurezza&lt;/b&gt;, gli Stati soltanto o anche le persone e gli ecosistemi? (slide 14)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna.&lt;/b&gt; Nell&#x27;Arctic Council, il principale forum regionale, sei organizzazioni indigene hanno lo status di &lt;i&gt;Permanent Participants&lt;/i&gt;: possono intervenire e devono essere consultate, ma non votano nelle riunioni ministeriali, riservate agli otto Stati. &lt;a href=&quot;https://hillnotes.ca/2022/06/14/the-arctic-council-the-involvement-of-indigenous-peoples/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HillNotes, Library of Parliament (Canada)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Una rotta migliore? &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;La slide confronta le distanze medie &lt;b&gt;Shanghai → Amburgo&lt;/b&gt; (grafico dell&#x27;International Sustainable Development Observatory): via Capo di Buona Speranza, via Canale di Suez e via &lt;b class=&quot;t&quot;&gt;Northern Sea Route (NSR)&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(Rotta del Mare del Nord: il passaggio lungo la costa artica russa tra lo Stretto di Bering e il Mare di Barents)&lt;/span&gt;. Regola la velocità della nave e i ritardi tipici della rotta artica per vedere quanto conviene davvero.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;route&quot;&gt;
&lt;svg viewBox=&quot;0 0 660 190&quot; role=&quot;img&quot; aria-label=&quot;Barre di confronto tra le tre rotte in giorni di navigazione&quot;&gt;
&lt;g id=&quot;rtBars&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;kn&quot;&gt;Velocità della nave (nodi)&lt;/label&gt;&lt;input id=&quot;kn&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;22&quot; value=&quot;14&quot;&gt;&lt;output id=&quot;okn&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dl&quot;&gt;Ritardi NSR: ghiaccio, scorta rompighiaccio, attese (giorni)&lt;/label&gt;&lt;input id=&quot;dl&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;15&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;odl&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;Risparmio NSR vs Suez&lt;b id=&quot;sv&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Distanza in meno vs Suez&lt;b&gt;−4.750 km&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Distanze dalla slide 9: Cape 25.500 km, Suez 20.500 km, NSR 15.750 km. Giorni = km ÷ (nodi × 1,852 × 24). I ritardi sono un parametro didattico. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Perché la rotta “più corta” non è automaticamente la migliore&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Stagionalità&lt;/b&gt;: la NSR è percorribile senza grandi rompighiaccio soprattutto in estate-autunno; il resto dell&#x27;anno serve una scorta.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Rischio e costi&lt;/b&gt;: assicurazioni più care, navi con classe ghiaccio, pochi porti di soccorso, rischio di sversamenti in un ecosistema fragile.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Geopolitica&lt;/b&gt;: la rotta corre in acque sotto controllo russo, che ne regola transito e scorte: dopo il 2022 il suo uso è legato alle sanzioni e alle scelte di Mosca.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Paradosso climatico&lt;/b&gt;: la rotta si apre &lt;i&gt;perché&lt;/i&gt; il ghiaccio si scioglie; usarla di più significa più traffico ed emissioni proprio dove il riscaldamento è più rapido.&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt; Le distanze variano a seconda delle fonti e dei porti considerati: Wikipedia indica per Shanghai–Amburgo circa 14.000 miglia nautiche via Capo, 10.800 via Suez e 7.300 via NSR. &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Northern_Sea_Route&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Northern Sea Route&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Artico&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Perché le infrastrutture offshore artiche sono insieme “economic assets” e “security concerns”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché generano valore (energia, dati, commercio), ma proprio per questo sono bersagli e punti vulnerabili; con l&#x27;accesso reso più facile dalla perdita di ghiaccio, aumentano sia lo sfruttamento sia la competizione militare per proteggerle o controllarle.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Qual è il dilemma della digitalizzazione nell&#x27;Artico?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;I sistemi digitali migliorano l&#x27;osservazione ambientale, ma li collegano a intelligence e difesa: la stessa infrastruttura di monitoraggio è dual-use, quindi la cooperazione scientifica rischia di diventare terreno di sicurezza.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Di quanto è più corta la NSR rispetto a Suez secondo la slide 9, e perché questo non basta a renderla conveniente?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Di 4.750 km (15.750 contro 20.500). Non basta perché contano stagionalità del ghiaccio, scorte e attese, assicurazioni, infrastrutture di soccorso, il controllo russo della rotta e i rischi ambientali.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 4. LITIO ===================== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;litio&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 2 · Lithium and the green transition · slide 10–11&lt;/div&gt;&lt;h2&gt;Sud America, la frontiera dei minerali&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«Clean technologies can reproduce unequal resource relations.» &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;Le tecnologie pulite possono riprodurre gli stessi rapporti diseguali dell&#x27;economia fossile: chi estrae resta in fondo alla catena del valore, chi raffina e produce tecnologia incassa la maggior parte del valore. Scorri la catena in quattro passi.&lt;/p&gt;
&lt;div class=&quot;stepper dim&quot; data-steps&gt;
&lt;svg viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Catena in quattro passi: domanda, estrazione, valore, giustizia&quot; style=&quot;width:100%;height:auto&quot;&gt;
&lt;line x1=&quot;70&quot; y1=&quot;45&quot; x2=&quot;690&quot; y2=&quot;45&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:4&quot;/&gt;
&lt;g data-k=&quot;0&quot;&gt;&lt;circle cx=&quot;90&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;1&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Demand&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;1&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Extraction&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;2&quot;&gt;&lt;circle cx=&quot;490&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Value&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;3&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Justice&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Demand: batterie ed elettrificazione&lt;/h4&gt;&lt;p&gt;Auto elettriche e accumuli stazionari fanno crescere la domanda di litio. La domanda nasce soprattutto in Cina, Europa e Nord America, lontano dai luoghi di estrazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Extraction: territori, acqua e lavoro&lt;/h4&gt;&lt;p&gt;Gran parte del litio sudamericano si trova nelle saline andine ad alta quota, il cosiddetto &lt;b class=&quot;t&quot;&gt;lithium triangle&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(triangolo del litio: Argentina, Bolivia e Cile)&lt;/span&gt;. Spesso si estrae facendo evaporare salamoie in vasche: un processo che consuma acqua in zone aride, dove vivono comunità indigene e agricole. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Value: chi controlla raffinazione e tecnologia?&lt;/h4&gt;&lt;p&gt;Il valore si concentra a valle: chimica di raffinazione, celle, batterie, brevetti. Se il Paese produttore esporta solo materia grezza, resta dipendente. È lo stesso schema della sezione 9: &lt;i&gt;strategic power moves along the supply chain&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Justice: il rischio di un nuovo green colonialism&lt;/h4&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Green colonialism&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(colonialismo verde: quando la decarbonizzazione del Nord si regge sull&#x27;estrazione a basso valore aggiunto nel Sud, scaricando lì costi ambientali e sociali)&lt;/span&gt;. Il termine richiama la storia coloniale dell&#x27;estrazione in America Latina.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;«The energy transition shifts dependency from fossil fuels to critical minerals and processing capacity.» &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;La risposta regionale: cooperare sui minerali strategici &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;Dalla slide (Mining Frontier)&lt;/div&gt;&lt;p&gt;Cile, Argentina, Bolivia e Perù hanno firmato una dichiarazione congiunta per approfondire la cooperazione regionale sui minerali strategici, con &lt;b&gt;rame e litio&lt;/b&gt; al centro. Vogliono rafforzare la loro &lt;b&gt;posizione collettiva come fornitori affidabili&lt;/b&gt; nelle catene globali.&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;Lettura: è il passo “Power” della slide 1 (new alliances) visto dal lato dei produttori: unirsi per contrattare meglio e salire nella catena del valore. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna.&lt;/b&gt; La dichiarazione è stata firmata a Santiago il 28 agosto 2026. Prevede cooperazione su esplorazione geologica, politiche minerarie, quadri regolatori e formazione, e la ricerca di sostegno da organismi multilaterali. Gli analisti notano che &lt;b&gt;non è vincolante&lt;/b&gt;: niente obiettivi comuni di produzione, permessi unificati o fondi stanziati. &lt;a href=&quot;https://www.kitco.com/news/off-the-wire/2026-08-28/four-south-american-nations-sign-strategic-minerals-pact&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reuters via Kitco&lt;/a&gt; · &lt;a href=&quot;https://www.miningfrontier.com/news/south-american-nations-deepen-cooperation-on-strategic-minerals/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mining Frontier (link della slide)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · litio&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Che cosa vuol dire che le tecnologie pulite possono “riprodurre relazioni diseguali”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che la domanda di minerali per batterie può ricreare lo schema estrattivo: i Paesi produttori forniscono materia grezza e sopportano i costi su territorio, acqua e lavoro, mentre raffinazione, tecnologia e valore restano altrove. Il rischio è un “green colonialism”.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Verso che cosa si sposta la dipendenza nella transizione energetica?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Dai combustibili fossili ai minerali critici e alla capacità di lavorazione (processing capacity): non basta avere la miniera, conta controllare la raffinazione.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Perché Cile, Argentina, Bolivia e Perù cooperano, e quale limite ha il loro accordo?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Per rafforzare la loro posizione collettiva come fornitori affidabili di rame e litio. Il limite (fonte esterna): è una dichiarazione non vincolante, senza obiettivi comuni né fondi.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 5. AFRICA ===================== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;africa&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 3 · Migration and sustainability · slide 12–13&lt;/div&gt;&lt;h2&gt;Africa: climate mobility e sviluppo&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«Mobility can be both an adaptation strategy and a source of vulnerability.» &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Climate mobility&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(mobilità climatica: gli spostamenti di persone legati a impatti climatici improvvisi, come alluvioni, o lenti, come siccità e desertificazione; include migrazione volontaria, sfollamento forzato e ricollocazione pianificata)&lt;/span&gt;. Il caso mostra che lo stesso movimento può ridurre il rischio o aumentarlo, a seconda di come viene governato.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Observed tension&lt;/div&gt;&lt;ul&gt;&lt;li&gt;La variabilità climatica colpisce i mezzi di sussistenza (&lt;i&gt;livelihoods&lt;/i&gt;), soprattutto agricoltura e pastorizia.&lt;/li&gt;&lt;li&gt;La migrazione può diversificare il reddito e ridurre l&#x27;esposizione (rimesse, lavoro stagionale).&lt;/li&gt;&lt;li&gt;Le politiche trattano spesso migrazione e sostenibilità &lt;b&gt;separatamente&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Governance opportunity&lt;/div&gt;&lt;p&gt;Integrare la migrazione nella pianificazione di adattamento e sviluppo può trasformare il movimento in una &lt;b&gt;risorsa per la resilienza&lt;/b&gt;, invece di inquadrarlo solo come &lt;b&gt;rischio per la sicurezza&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;mob&quot;&gt;
&lt;div class=&quot;chips&quot; style=&quot;margin-bottom:.6rem&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-mob=&quot;sep&quot;&gt;Politiche separate&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-mob=&quot;int&quot;&gt;Politiche integrate&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 760 260&quot; role=&quot;img&quot; aria-label=&quot;Percorsi della mobilità climatica verso vulnerabilità o resilienza&quot;&gt;

&lt;h3&gt;L&#x27;Africa Climate Mobility Initiative (ACMI) &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;Secondo la slide, l&#x27;&lt;b&gt;ACMI&lt;/b&gt; è una collaborazione tra &lt;b&gt;Commissione dell&#x27;Unione Africana&lt;/b&gt;, &lt;b&gt;UNDP&lt;/b&gt;, &lt;b&gt;UNFCCC&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(la Convenzione quadro ONU sui cambiamenti climatici)&lt;/span&gt;, &lt;b&gt;IOM&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(Organizzazione internazionale per le migrazioni)&lt;/span&gt; e &lt;b&gt;Banca Mondiale&lt;/b&gt;. Mira a creare slancio politico e un&#x27;agenda comune sulla mobilità climatica in Africa, e a sostenere capacità di attuazione e partenariati.&lt;/p&gt;&lt;p&gt;In due anni ha prodotto ricerche e modelli, consultato esperti africani e internazionali e costituito una &lt;b&gt;Community of Practice&lt;/b&gt; per valorizzare la mobilità climatica nel continente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna.&lt;/b&gt; Il rapporto principale dell&#x27;ACMI, &lt;i&gt;African Shifts&lt;/i&gt; (presentato prima della COP27 in Egitto, 2022), analizza come la vulnerabilità climatica orienta oggi le decisioni di spostamento e costruisce scenari fino al 2050; la stampa ne ha ripreso la stima di &lt;b&gt;fino a 113 milioni&lt;/b&gt; di persone che potrebbero spostarsi all&#x27;interno dell&#x27;Africa entro il 2050. Propone un&#x27;agenda d&#x27;azione in otto punti per il 2023–2030. &lt;a href=&quot;https://preventionweb.net/quick/76346&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb (UNDRR)&lt;/a&gt; · &lt;a href=&quot;https://theconversation.com/climate-change-will-force-up-to-113m-people-to-relocate-within-africa-by-2050-new-report-193633&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Conversation&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Africa&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;In che senso la mobilità è sia adaptation sia vulnerability?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;È adattamento quando diversifica il reddito (rimesse, lavoro altrove) e riduce l&#x27;esposizione di chi resta; è vulnerabilità quando diventa sfollamento forzato, verso luoghi a loro volta rischiosi o senza tutele.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Qual è l&#x27;errore di governance indicato dalla slide 12?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Trattare migrazione e sostenibilità separatamente e inquadrare la migrazione solo come rischio di sicurezza. L&#x27;opportunità è integrarla nella pianificazione di adattamento e sviluppo.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Quali organizzazioni compongono l&#x27;ACMI?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Commissione dell&#x27;Unione Africana, UNDP, UNFCCC, IOM e Banca Mondiale.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;


&lt;!-- ===================== 6. ACQUA ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;acqua&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 4 · Water agreements · slide 14–15&lt;/div&gt;&lt;h2&gt;Asia meridionale: l&#x27;acqua oltre i confini&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«Water agreements connect cooperation, conflict and justice.» &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Resource&lt;/div&gt;&lt;p&gt;I fiumi attraversano i confini politici: sono risorse &lt;b class=&quot;t&quot;&gt;transboundary&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(transfrontaliere)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Risk&lt;/div&gt;&lt;p&gt;Il cambiamento climatico aumenta incertezza ed esposizione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Power&lt;/div&gt;&lt;p&gt;Le posizioni &lt;b class=&quot;t&quot;&gt;upstream&lt;/b&gt; e &lt;b class=&quot;t&quot;&gt;downstream&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(a monte e a valle)&lt;/span&gt; sono diseguali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Peace&lt;/div&gt;&lt;p&gt;Le istituzioni possono gestire le tensioni &lt;b&gt;quando includono le comunità colpite&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;«The key question is who gets to define security: states alone, or people and ecosystems as well?» &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa “chi definisce la sicurezza”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nella visione classica, la &lt;b class=&quot;t&quot;&gt;security&lt;/b&gt; è &lt;i&gt;state security&lt;/i&gt;: difesa dei confini e degli interessi nazionali. La domanda della slide apre a concezioni più larghe, come la &lt;b class=&quot;t&quot;&gt;human security&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(sicurezza delle persone: acqua, cibo, salute, mezzi di vita)&lt;/span&gt; e la sicurezza ecologica (integrità degli ecosistemi). Un accordo idrico pensato solo tra governi può garantire “sicurezza” a uno Stato e lasciare senza acqua un villaggio del delta. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;I grandi bacini &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;L&#x27;Asia meridionale condivide sistemi fluviali vitali (&lt;b&gt;Indo, Gange, Brahmaputra&lt;/b&gt;) da cui dipende oltre un miliardo di persone, sotto forte stress per cambiamento climatico, crescita demografica e tensioni politiche.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;Indus Basin&lt;/div&gt;&lt;p&gt;Attraversa Cina, Afghanistan, India e Pakistan. È regolato in parte dallo storico &lt;b&gt;Indus Waters Treaty&lt;/b&gt; del 1960.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;Ganges-Brahmaputra-Meghna (GBM) Basin&lt;/div&gt;&lt;p&gt;Si estende tra Nepal, Bhutan, India, Cina e Bangladesh. Oltre &lt;b&gt;750 milioni&lt;/b&gt; di persone dipendono direttamente da queste acque condivise.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs style=&quot;margin-top:1rem&quot;&gt;
&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;w1&quot;&gt;Climate change&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;w2&quot;&gt;Geopolitical rivalries&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;w3&quot;&gt;Data gaps&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w1&quot;&gt;&lt;p&gt;La rapida fusione dei ghiacciai himalayani provoca alluvioni estreme, monsoni che si spostano e, nel lungo periodo, scarsità d&#x27;acqua. Prima i ghiacciai rilasciano più acqua, poi, quando si riducono, sempre meno: è il cosiddetto &lt;b class=&quot;t&quot;&gt;peak water&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(picco idrico)&lt;/span&gt;. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w2&quot; hidden&gt;&lt;p&gt;Una profonda sfiducia tra i Paesi rivieraschi (&lt;i&gt;riparian nations&lt;/i&gt;) impedisce accordi inclusivi a livello di bacino, che comprendano anche potenze a monte come la Cina.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w3&quot; hidden&gt;&lt;p&gt;La scarsa condivisione di dati idrologici accurati ostacola la preparazione ai disastri e una distribuzione equa dell&#x27;acqua. Il dato idrologico diventa esso stesso una risorsa di potere: chi sta a monte sa prima. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Laboratorio: monte e valle&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Un fiume glaciale attraversa due Paesi. Decidi quanta acqua trattiene il Paese a monte, la stagione e la fase dei ghiacciai: guarda che cosa arriva a valle.&lt;/p&gt;

&lt;div class=&quot;chips&quot; style=&quot;margin:.4rem 0&quot;&gt;&lt;span class=&quot;cap&quot; style=&quot;margin:0 .4rem 0 0&quot;&gt;Stagione:&lt;/span&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-sea=&quot;1&quot;&gt;Monsone&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-sea=&quot;0.4&quot;&gt;Stagione secca&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;cap&quot; style=&quot;margin:0 .4rem 0 0&quot;&gt;Ghiacciai:&lt;/span&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-gl=&quot;1&quot;&gt;Oggi&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gl=&quot;1.25&quot;&gt;Picco di fusione&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gl=&quot;0.7&quot;&gt;Ghiacciai ridotti&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; id=&quot;rvTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Modello illustrativo, non dati idrologici reali. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna · Indus Waters Treaty.&lt;/b&gt; Firmato nel 1960 tra India e Pakistan dopo nove anni di negoziati con la mediazione della Banca Mondiale (anch&#x27;essa firmataria): assegna i fiumi orientali (Ravi, Beas, Sutlej) all&#x27;India e quelli occidentali (Indo, Jhelum, Chenab) al Pakistan, con una Permanent Indus Commission e tre livelli di risoluzione delle controversie (commissione, esperto neutrale, corte arbitrale). &lt;a href=&quot;https://www.worldbank.org/en/region/sar/brief/fact-sheet-the-indus-waters-treaty-1960-and-the-world-bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, fact sheet&lt;/a&gt;. Nell&#x27;aprile 2025, dopo l&#x27;attentato di Pahalgam, l&#x27;India ha dichiarato il trattato &lt;i&gt;in abeyance&lt;/i&gt; (sospeso), mossa che il Pakistan contesta come illegale. &lt;a href=&quot;https://www.isas.nus.edu.sg/papers/after-pahalgam-is-the-indus-waters-treaty-doomed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISAS, National University of Singapore&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · acqua&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Elenca le quattro dimensioni della slide 14 sugli accordi idrici.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Resource (i fiumi attraversano i confini), Risk (il clima aumenta incertezza ed esposizione), Power (monte e valle sono posizioni diseguali), Peace (le istituzioni gestiscono le tensioni se includono le comunità colpite).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Quali sono le tre sfide chiave dei bacini sud-asiatici?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Climate change (fusione glaciale, alluvioni, monsoni instabili, scarsità), geopolitical rivalries (sfiducia che impedisce accordi a scala di bacino con potenze a monte come la Cina), data gaps (poca condivisione di dati idrologici).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Perché un accordo “tra Stati” può non bastare a garantire sicurezza?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché la sicurezza dello Stato non coincide con quella delle persone e degli ecosistemi: se le comunità colpite non sono incluse, la distribuzione può restare ingiusta e le tensioni locali irrisolte. È la domanda chiave della slide 14.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 7. ISOLE ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;isole&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 5 · Oceans and climate justice · slide 16–17&lt;/div&gt;&lt;h2&gt;Piccoli Stati insulari: esposizione senza leva&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«Those most exposed to climate impacts often have the least influence over global emissions.» &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;È il nucleo della &lt;b class=&quot;t&quot;&gt;climate justice&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(giustizia climatica: chi ha causato meno il problema ne subisce di più gli effetti, e chiede che responsabilità e costi siano ripartiti di conseguenza)&lt;/span&gt;. &lt;b class=&quot;t&quot;&gt;Leverage&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(leva: potere negoziale)&lt;/span&gt; è ciò che manca: questi Stati non possono ridurre le emissioni globali da soli, perché le loro sono minime.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 220&quot; role=&quot;img&quot; aria-label=&quot;Bilancia sbilanciata: esposizione pesante, leva leggera&quot;&gt;
&lt;polygon points=&quot;350,190 325,215 375,215&quot; class=&quot;f-slate&quot;/&gt;
&lt;g transform=&quot;rotate(-12 350 190)&quot;&gt;
&lt;line x1=&quot;110&quot; y1=&quot;190&quot; x2=&quot;590&quot; y2=&quot;190&quot; class=&quot;st-ink&quot; style=&quot;stroke-width:5;stroke-linecap:round&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;120&quot; width=&quot;170&quot; height=&quot;66&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 15px var(--sans)&quot;&gt;ESPOSIZIONE&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-size:12px&quot;&gt;mare, tempeste, coste&lt;/text&gt;
&lt;rect x=&quot;450&quot; y=&quot;160&quot; width=&quot;110&quot; height=&quot;26&quot; rx=&quot;8&quot; class=&quot;f-sagebg&quot; style=&quot;stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; class=&quot;f-sage&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;LEVA&lt;/text&gt;
&lt;/g&gt;
