&lt;/svg&gt;
&lt;figcaption&gt;Schema didattico. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card fill brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Exposure&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Innalzamento del livello del mare&lt;/li&gt;&lt;li&gt;Tempeste&lt;/li&gt;&lt;li&gt;Rischio urbano e costiero&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Voice&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Governance degli oceani&lt;/li&gt;&lt;li&gt;Diplomazia climatica&lt;/li&gt;&lt;li&gt;Rivendicazioni di equità&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;La “voce” è la loro forma di potere: autorità morale e coalizioni nei negoziati ONU. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Finance&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Costi di adattamento&lt;/li&gt;&lt;li&gt;Loss and damage&lt;/li&gt;&lt;li&gt;Accesso alle risorse&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Chi sono: la mappa della slide 17 &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;La mappa distingue quattro categorie di isole. Apri ciascuna voce.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Small Island Developing States (SIDS)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I &lt;b class=&quot;t&quot;&gt;SIDS&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(piccoli Stati insulari in via di sviluppo)&lt;/span&gt; sono un gruppo riconosciuto dall&#x27;ONU di Paesi accomunati da vulnerabilità simili: territori piccoli, economie poco diversificate, dipendenza da importazioni, forte esposizione climatica. Sono concentrati nei Caraibi, nel Pacifico e tra Atlantico e Oceano Indiano.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La lista UN-OHRLLS comprende 39 Stati membri ONU e 18 membri associati (territori non sovrani). &lt;a href=&quot;https://www.un.org/ohrlls/content/list-sids&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN-OHRLLS, List of SIDS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Sub-national Island Jurisdictions (SNIJ)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Isole con forme di autogoverno ma &lt;b&gt;parte di uno Stato più grande&lt;/b&gt; (es. regioni o territori autonomi). Hanno esposizione da piccola isola ma nessuna voce autonoma nei negoziati internazionali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;SNIJ riconosciute come SIDS&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Giurisdizioni sub-nazionali che l&#x27;ONU (UN-OHRLLS) conta comunque tra i SIDS, spesso come membri associati delle commissioni regionali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dependent islands&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Isole dipendenti da uno Stato esterno, senza autogoverno pieno. Sulla mappa sono molte nel Nord Atlantico e nel Nord Europa.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna · il fondo per Loss and Damage.&lt;/b&gt; Il &lt;i&gt;Fund for responding to Loss and Damage&lt;/i&gt; è stato deciso alla COP27 (2022) e reso operativo alla COP28 (2023): sostiene i Paesi in via di sviluppo vulnerabili per perdite economiche e non economiche dovute a eventi estremi e a eventi lenti (come l&#x27;innalzamento del mare). Nella fase iniziale il segretariato è ospitato dalla Banca Mondiale. &lt;a href=&quot;https://unfccc.int/establishing-a-dedicated-fund-for-loss-and-damage&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNFCCC&lt;/a&gt; · &lt;a href=&quot;https://climatefundsupdate.org/the-funds/fund-for-responding-to-loss-and-damage/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate Funds Update&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · piccole isole&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Che cosa significa “exposure without leverage”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che i piccoli Stati insulari sono tra i più esposti (mare, tempeste, coste) ma hanno pochissima influenza sulle emissioni globali, e quindi poco potere per ridurre la causa del loro rischio.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Quali sono i tre assi della slide 16 e quale rappresenta la loro forma di potere?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Exposure, Voice, Finance. La “Voice” (ocean governance, climate diplomacy, claims for equity) è il loro strumento di influenza.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Differenza tra SIDS e SNIJ?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;I SIDS sono (in gran parte) Stati sovrani riconosciuti dall&#x27;ONU come gruppo vulnerabile; le SNIJ sono isole autonome ma parte di uno Stato più grande. Alcune SNIJ sono comunque riconosciute come SIDS.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 8. EUROPA ===================== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;europa&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 6 · Security priorities · slide 18&lt;/div&gt;&lt;h2&gt;L&#x27;Europa dopo l&#x27;invasione russa dell&#x27;Ucraina&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«War changes the political space available for long-term climate action.» &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Defence&lt;/div&gt;&lt;p&gt;Più spesa militare e ritorno della sicurezza territoriale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Energy&lt;/div&gt;&lt;p&gt;La sicurezza degli approvvigionamenti &lt;b&gt;accelera&lt;/b&gt; diversificazione e transizione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Climate&lt;/div&gt;&lt;p&gt;Rischio di perdere attenzione e risorse per le agende di lungo periodo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Nexus&lt;/div&gt;&lt;p&gt;La politica di sicurezza include sempre più il cambiamento ambientale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot; style=&quot;margin-top:1rem&quot;&gt;Il caso mostra due effetti opposti della stessa guerra: la ricerca di indipendenza dal gas russo &lt;b&gt;spinge&lt;/b&gt; le rinnovabili (energia prodotta in casa = sicurezza), mentre la competizione per bilancio e attenzione politica &lt;b&gt;frena&lt;/b&gt; l&#x27;agenda climatica di lungo periodo. Il &lt;b class=&quot;t&quot;&gt;security-climate nexus&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(nesso sicurezza-clima: il riconoscimento che clima e sicurezza si influenzano)&lt;/span&gt; è il tentativo di tenere insieme le due cose. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;eu&quot;&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;thr&quot;&gt;Pressione della minaccia militare&lt;/label&gt;&lt;input id=&quot;thr&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;othr&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Quattro barre che cambiano con la pressione militare&quot;&gt;&lt;g id=&quot;euBars&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Modello qualitativo per visualizzare la slide 18: le direzioni vengono dalla slide, le intensità sono inventate a scopo didattico. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Europa&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Perché la guerra può accelerare e insieme frenare la transizione?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Accelera perché la sicurezza energetica spinge a diversificare dal gas russo e a produrre energia rinnovabile in casa; frena perché difesa e urgenze di breve periodo sottraggono attenzione e risorse alle agende climatiche di lungo periodo.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Che cosa indica la voce “Nexus” della slide 18?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che la politica di sicurezza include sempre più il cambiamento ambientale: clima e sicurezza non sono più agende separate.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;


&lt;!-- ===================== 9. CRM ===================== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;crm&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;9&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 7 · Energy systems · slide 19–20&lt;/div&gt;&lt;h2&gt;Critical raw materials: una nuova mappa della dipendenza&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«The green transition does not eliminate geopolitics. It changes the geography of strategic resources.» &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Critical raw materials (CRMs)&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(materie prime critiche: materiali economicamente importanti con un alto rischio di approvvigionamento, perché la produzione è concentrata in pochi Paesi o difficilmente sostituibile)&lt;/span&gt;. La slide confronta tre generazioni di dipendenza.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;h4&gt;Oil and gas&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Legacy dependence&lt;/div&gt;&lt;p&gt;Oleodotti, trasporto marittimo, Stati produttori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;h4&gt;Lithium, cobalt, rare earths&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Emerging dependence&lt;/div&gt;&lt;p&gt;Regioni minerarie, raffinazione e tecnologia.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;h4&gt;Renewables&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Infrastructure dependence&lt;/div&gt;&lt;p&gt;Manifattura, reti e accumuli.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Catena di fornitura: estrazione, lavorazione, manifattura, impiego&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g style=&quot;font:600 14px var(--sans)&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;73&quot; class=&quot;s-ink&quot;&gt;Estrazione&lt;/text&gt;
&lt;rect x=&quot;200&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Lavorazione&lt;/text&gt;&lt;text x=&quot;280&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;raffinazione&lt;/text&gt;
&lt;rect x=&quot;390&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Manifattura&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;celle, pannelli, magneti&lt;/text&gt;
&lt;rect x=&quot;580&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;665&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Impiego&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;reti, accumuli&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M172 68h24M362 68h24M552 68h24&quot; style=&quot;stroke:var(--ochre);stroke-width:2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;path d=&quot;M90 112 Q380 150 665 112&quot; fill=&quot;none&quot; style=&quot;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4&quot;/&gt;
&lt;text x=&quot;380&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font:italic 15px var(--serif)&quot;&gt;«Strategic power moves along the supply chain, not only at the mine or well.»&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Il potere può stare in ogni anello: chi controlla la raffinazione o la manifattura può condizionare anche chi possiede la miniera. Schema didattico sulla frase della slide 19.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Chi fornisce l&#x27;UE, e con quale governance &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;La mappa della slide 20 mostra i principali fornitori dell&#x27;UE di CRMs (2023) e il loro &lt;b&gt;livello di governance&lt;/b&gt;, misurato come media dei sei &lt;b class=&quot;t&quot;&gt;Worldwide Governance Indicators&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(indicatori della Banca Mondiale: voice and accountability, stabilità politica e assenza di violenza, efficacia del governo, qualità della regolazione, stato di diritto, controllo della corruzione)&lt;/span&gt; del 2021. Filtra per governance e per fase.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;crmFig&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;crmGov&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-v=&quot;all&quot;&gt;Tutti&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;high&quot;&gt;Alta (1,25–2,5)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;med&quot;&gt;Media (0,1–1,24)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;low&quot;&gt;Bassa (−1,24–0)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;vlow&quot;&gt;Molto bassa (−1,25 – −2,5)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;crmPh&quot; style=&quot;margin-top:.4rem&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-v=&quot;all&quot;&gt;Tutte le fasi&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;E&quot;&gt;Estrazione&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;P&quot;&gt;Lavorazione&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; id=&quot;crmSum&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;bars&quot; id=&quot;crmBars&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Dati trascritti dalla mappa della slide 20: percentuale = quota delle forniture UE; ** = quota della produzione mondiale. Corsivo sulla mappa = fase di estrazione, tondo = fase di lavorazione: l&#x27;attribuzione della fase è ricostruita a vista, verifica sulla slide. Colori: &lt;span style=&quot;color:var(--sage)&quot;&gt;■&lt;/span&gt; alta, &lt;span style=&quot;color:var(--ochre)&quot;&gt;■&lt;/span&gt; media, &lt;span style=&quot;color:var(--accent)&quot;&gt;■&lt;/span&gt; bassa, &lt;span style=&quot;color:var(--brick)&quot;&gt;■&lt;/span&gt; molto bassa.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Come leggerla.&lt;/b&gt; La Cina compare con 11 materiali, spesso nella fase di lavorazione (100% delle terre rare pesanti, 97% del magnesio, 71% del gallio): è la prova concreta che il potere sta nella raffinazione. Molti fornitori hanno governance bassa o molto bassa (la RDC per il cobalto), quindi il rischio di approvvigionamento è anche politico. Il Cile (litio, 79%) collega questa mappa alla sezione 4. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna · Critical Raw Materials Act.&lt;/b&gt; Il regolamento UE approvato dal Consiglio nel marzo 2024 distingue una lista di &lt;b&gt;materie prime strategiche&lt;/b&gt; (per tecnologie verdi, digitali, difesa e spazio) e una lista più ampia di &lt;b&gt;34 materie prime critiche&lt;/b&gt;, con l&#x27;obiettivo di diversificare le forniture e rafforzare estrazione, lavorazione e riciclo in Europa. &lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/critical-raw-materials/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consiglio dell&#x27;UE, infografica&lt;/a&gt; · &lt;a href=&quot;https://twobirds.com/en/insights/2024/france/le-critical-raw-materials-act-approuve-par-le-conseil-europeen&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bird &amp;amp; Bird&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · materie prime&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Distingui legacy, emerging e infrastructure dependence.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Legacy: petrolio e gas (oleodotti, navi, Stati produttori). Emerging: litio, cobalto, terre rare (regioni minerarie, raffinazione, tecnologia). Infrastructure: rinnovabili (manifattura, reti, accumuli).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Che cosa significa che il potere si muove “lungo la catena di fornitura”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che la leva strategica non sta solo dove si trova la risorsa (miniera o pozzo) ma in ogni anello che è difficile sostituire: raffinazione, componenti, manifattura, reti. Esempio: la Cina domina la lavorazione di molti CRMs anche quando non li estrae.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Perché la slide 20 incrocia fornitori e indicatori di governance?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché il rischio di approvvigionamento dipende anche dalla stabilità politica, dallo stato di diritto e dalla corruzione dei Paesi fornitori: dipendere da fornitori con governance bassa aumenta il rischio di interruzioni, pressioni politiche e problemi etici (lavoro, ambiente).&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 10. CIBO ===================== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;cibo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 8 · Agri-food systems · slide 21–22&lt;/div&gt;&lt;h2&gt;Food security: priorità in conflitto&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;«Food systems sit at the intersection of human needs, trade and planetary limits.» &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Food security&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(sicurezza alimentare: la condizione in cui tutte le persone hanno in ogni momento accesso fisico ed economico a cibo sufficiente, sicuro e nutriente; non va confusa con &lt;i&gt;food safety&lt;/i&gt;, la sicurezza igienica degli alimenti)&lt;/span&gt;. La slide la scompone in tre dimensioni in tensione.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card fill slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Access&lt;/div&gt;&lt;p&gt;Prezzi accessibili e disponibilità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Production&lt;/div&gt;&lt;p&gt;Terra, acqua ed ecosistemi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Security&lt;/div&gt;&lt;p&gt;Commercio, conflitti e dipendenza strategica.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;«Policies that improve one dimension can create pressure in another. The challenge is to govern the system as a whole.» &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Laboratorio: scegli una politica, guarda i trade-off&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;food&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;foodBtns&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot; id=&quot;foodOut&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; id=&quot;foodTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Esempi didattici per esercitarsi sul principio della slide 21; gli effetti sono tendenze qualitative, non stime. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;L&#x27;indice globale e l&#x27;impatto della guerra &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;La mappa a sinistra della slide (Statista su dati Economist Intelligence Unit) riporta i punteggi del &lt;b&gt;Global Food Security Index 2022&lt;/b&gt;: l&#x27;indice misura accessibilità economica, disponibilità, qualità e sicurezza, sostenibilità e adattamento del cibo, con &lt;b&gt;68 indicatori in 113 Paesi&lt;/b&gt;. I punteggi più alti sono in Nord America, Europa e Australia; i più bassi soprattutto nell&#x27;Africa subsahariana.&lt;/p&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;Fonte esterna.&lt;/b&gt; Nell&#x27;edizione 2022 la Finlandia è prima, seguita da Irlanda e Norvegia; Siria, Haiti e Yemen sono in fondo. L&#x27;indice registra un peggioramento globale della sicurezza alimentare per il terzo anno consecutivo. L&#x27;indice è curato da Economist Impact con il sostegno di Corteva. &lt;a href=&quot;https://www.corteva.com/our-impact/global-food-security-index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Corteva, GFSI&lt;/a&gt; · &lt;a href=&quot;https://agriland.ie/farming-news/ireland-ranks-second-in-global-food-security-index-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Agriland&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;p&gt;A destra, lo schema &lt;b&gt;“War&#x27;s impact on the food security pillars”&lt;/b&gt; applica i quattro pilastri classici agli effetti di una guerra. Apri i pilastri:&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Availability · disponibilità&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Fertilizer crisis, supply shortage, trade ban: se un grande esportatore di grano o fertilizzanti è in guerra, cala l&#x27;offerta mondiale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Accessibility · accesso&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Market disruption, price hike, high inflation: il cibo c&#x27;è, ma costa troppo per le famiglie povere.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Utilization · utilizzo&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dietary diversity, undernourishment, low productivity: diete più povere, malnutrizione, meno capacità di lavoro.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stability · stabilità&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Higher energy prices, rising interest rates, political turmoil: le prime tre dimensioni diventano instabili nel tempo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La definizione del World Food Summit (1996) e i quattro pilastri (availability, access, utilization, stability) sono spiegati nella guida FAO: &lt;a href=&quot;https://fao.org/4/al936e/al936e00.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FAO, An Introduction to the Basic Concepts of Food Security&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · cibo&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Quali tre dimensioni della food security propone la slide 21?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Access (affordability and availability), Production (land, water, ecosystems), Security (trade, conflict, strategic dependence).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Fai un esempio di politica che migliora una dimensione e ne peggiora un&#x27;altra.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Un divieto di esportazione abbassa i prezzi interni (Access) ma riduce l&#x27;offerta mondiale e la fiducia commerciale, danneggiando i Paesi importatori (Security). Oppure: espandere i terreni coltivati aumenta la produzione ma consuma ecosistemi e acqua.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Su quale pilastro agiscono i prezzi più alti dell&#x27;energia secondo lo schema della slide 22?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Sulla Stability, insieme all&#x27;aumento dei tassi d&#x27;interesse e all&#x27;instabilità politica.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== SINTESI ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;∑&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Sintesi trasversale&lt;/div&gt;&lt;h2&gt;Otto luoghi, una stessa logica&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Ogni caso applica la tesi della slide 3: la transizione crea &lt;b&gt;vincitori, perdenti e nuove dipendenze&lt;/b&gt;. La tabella li mette a confronto. &lt;span class=&quot;src ctx&quot;&gt;spiegazione&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Caso&lt;/th&gt;&lt;th&gt;Risorsa in gioco&lt;/th&gt;&lt;th&gt;Tensione&lt;/th&gt;&lt;th&gt;Leva di governance&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#artico&quot;&gt;Artico&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Rotte, giacimenti, dati&lt;/td&gt;&lt;td&gt;Accesso economico vs sicurezza; Stati vs popoli indigeni&lt;/td&gt;&lt;td&gt;Monitoraggio condiviso, inclusione indigena&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#litio&quot;&gt;Sud America&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Litio, rame&lt;/td&gt;&lt;td&gt;Estrazione locale vs valore altrove&lt;/td&gt;&lt;td&gt;Cooperazione tra produttori, lavorazione in loco&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#africa&quot;&gt;Africa&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Mezzi di sussistenza, mobilità&lt;/td&gt;&lt;td&gt;Mobilità come adattamento o come vulnerabilità&lt;/td&gt;&lt;td&gt;Integrare migrazione e adattamento&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#acqua&quot;&gt;Asia meridionale&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Acqua glaciale e fluviale&lt;/td&gt;&lt;td&gt;Monte vs valle; sfiducia e dati mancanti&lt;/td&gt;&lt;td&gt;Trattati di bacino inclusivi, condivisione dati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#isole&quot;&gt;Piccole isole&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Coste, territorio stesso&lt;/td&gt;&lt;td&gt;Massima esposizione, minima leva&lt;/td&gt;&lt;td&gt;Voce diplomatica, finanza per adattamento e loss and damage&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#europa&quot;&gt;Europa&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Energia, bilancio pubblico&lt;/td&gt;&lt;td&gt;Sicurezza immediata vs clima di lungo periodo&lt;/td&gt;&lt;td&gt;Nexus sicurezza-clima, diversificazione&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#crm&quot;&gt;Materie prime&lt;/a&gt;&lt;/td&gt;&lt;td&gt;CRMs, raffinazione&lt;/td&gt;&lt;td&gt;Dipendenza da pochi fornitori, spesso con governance debole&lt;/td&gt;&lt;td&gt;Diversificazione, regole UE, riciclo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#cibo&quot;&gt;Cibo&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Terra, acqua, commercio&lt;/td&gt;&lt;td&gt;Accesso vs produzione vs sicurezza&lt;/td&gt;&lt;td&gt;Governare il sistema nel suo insieme&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot; style=&quot;margin-top:1.2rem&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;1&lt;/div&gt;&lt;p&gt;La transizione &lt;b&gt;non elimina la geopolitica&lt;/b&gt;: ne cambia la geografia (slide 19).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;2&lt;/div&gt;&lt;p&gt;Il potere si sposta &lt;b&gt;lungo le catene del valore&lt;/b&gt; e nelle tecnologie, non solo sulle risorse fisiche.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;&lt;p&gt;Chi è più esposto ha spesso &lt;b&gt;meno voce&lt;/b&gt;: la giustizia è parte della transizione, non un&#x27;aggiunta.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;4&lt;/div&gt;&lt;p&gt;La domanda di fondo: &lt;b&gt;chi definisce la sicurezza?&lt;/b&gt; Stati, persone, ecosistemi (slide 14).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica finale · collegare i casi&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Quale caso illustra meglio “exposure without leverage”, e quale “strategic power moves along the supply chain”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Il primo: i piccoli Stati insulari (slide 16). Il secondo: le materie prime critiche (slide 19), con il caso del litio come esempio regionale.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Collega la domanda “chi definisce la sicurezza?” ad almeno tre casi.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Asia meridionale (Stati vs comunità dei bacini); Artico (Stati e difesa vs comunità indigene); Africa (migrazione vista come rischio di sicurezza vs risorsa per la resilienza); Europa (sicurezza militare vs sicurezza climatica).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Come si collegano il caso del litio e la mappa dei CRMs?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Il Cile compare nella slide 20 come fornitore del 79% del litio all&#x27;UE: è il lato “emerging dependence” della slide 19. Entrambi i casi mostrano che la dipendenza passa dai fossili ai minerali e alla capacità di lavorazione.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Classifica come mitigation, adaptation o resilience: (a) rinnovabili offshore; (b) migrazione stagionale pianificata; (c) un sistema di allerta precoce condiviso su un bacino fluviale.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;(a) mitigation; (b) adaptation; (c) rafforza la resilience (e l&#x27;adattamento): migliora la capacità di assorbire lo shock e riprendersi, e risponde al problema dei “data gaps” della slide 15.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== PER APPROFONDIRE ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne · ricerca web&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Studi, testi, norme e siti citati nelle slide o necessari a capirle. Tutto ciò che segue è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;: i dati vengono dalle pagine linkate, non dalle slide. Ogni scheda dice cosa contiene la fonte e perché conta per la lezione.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 7&lt;/div&gt;&lt;h4&gt;Offshore Technology: il declino del ghiaccio artico&lt;/h4&gt;&lt;p&gt;Articolo costruito sulle opinioni di Ola M. Johannessen, fondatore del Nansen Environmental and Remote Sensing Center (NERSC) di Bergen: per l&#x27;industria offshore capire il ghiaccio marino è decisivo, il ghiaccio più sottile non vuol dire meno rischi e gli iceberg minacciano installazioni e condotte nel Mare di Barents. Cita dati NOAA: a settembre 2012 il ghiaccio artico era circa il 54% sotto il livello del 1980.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra come lo scioglimento trasformi l&#x27;Artico in spazio economico e insieme rischioso (slide 6).&lt;/p&gt;&lt;a href=&quot;https://www.offshore-technology.com/features/feature-arctic-sea-ice-decline-climate-change-nersc/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;offshore-technology.com&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 9&lt;/div&gt;&lt;h4&gt;Northern Sea Route&lt;/h4&gt;&lt;p&gt;Voce enciclopedica con storia, regime giuridico e tabelle di confronto delle distanze: Shanghai–Amburgo circa 14.000 miglia nautiche via Capo, 10.800 via Suez, 7.300 via NSR (valori diversi da quelli della slide perché dipendono da porti e percorsi).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: permette di verificare il grafico ISDO della slide, di cui non ho trovato la fonte originale online.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Northern_Sea_Route&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt; · &lt;a href=&quot;https://www.iims.org.uk/northern-sea-route/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIMS&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 8&lt;/div&gt;&lt;h4&gt;Arctic Council e popoli indigeni&lt;/h4&gt;&lt;p&gt;Nota della Biblioteca del Parlamento canadese sul ruolo delle sei organizzazioni indigene “Permanent Participants” dell&#x27;Arctic Council: partecipano e vengono consultate, ma non votano.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: risponde alla domanda della slide 8, «What about Indigenous communities?».&lt;/p&gt;&lt;a href=&quot;https://hillnotes.ca/2022/06/14/the-arctic-council-the-involvement-of-indigenous-peoples/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HillNotes (Library of Parliament)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 11&lt;/div&gt;&lt;h4&gt;Dichiarazione andina sui minerali strategici&lt;/h4&gt;&lt;p&gt;Cile, Argentina, Bolivia e Perù hanno firmato a Santiago (28 agosto 2026) una dichiarazione su esplorazione, politiche minerarie, regolazione e formazione, centrata su rame e litio. Non è vincolante e non prevede obiettivi comuni né fondi.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: esempio concreto di “new alliances” tra Paesi produttori (slide 1 e 10).&lt;/p&gt;&lt;a href=&quot;https://www.miningfrontier.com/news/south-american-nations-deepen-cooperation-on-strategic-minerals/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mining Frontier&lt;/a&gt; · &lt;a href=&quot;https://www.kitco.com/news/off-the-wire/2026-08-28/four-south-american-nations-sign-strategic-minerals-pact&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reuters via Kitco&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 13&lt;/div&gt;&lt;h4&gt;Africa Climate Mobility Initiative: &lt;i&gt;African Shifts&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Rapporto dell&#x27;ACMI (Commissione UA, Banca Mondiale, UNDP, IOM, UNFCCC) presentato prima della COP27: analizza come la vulnerabilità climatica orienta oggi la mobilità, costruisce scenari al 2050 (fino a 113 milioni di spostamenti interni secondo la stampa) e propone un&#x27;agenda in otto punti per il 2023–2030. Modelli realizzati con il CIESIN della Columbia University e il Mixed Migration Centre.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base empirica dell&#x27;idea di migrazione come adattamento (slide 12).&lt;/p&gt;&lt;a href=&quot;https://preventionweb.net/quick/76346&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb&lt;/a&gt; · &lt;a href=&quot;https://ciesin.columbia.edu/news/new-report-posits-potential-mobility-africa-climate-impacts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CIESIN&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 15&lt;/div&gt;&lt;h4&gt;Indus Waters Treaty (1960)&lt;/h4&gt;&lt;p&gt;Scheda della Banca Mondiale: ripartizione dei fiumi orientali all&#x27;India e occidentali al Pakistan, Permanent Indus Commission, tre livelli di risoluzione delle controversie; ruolo della Banca “limitato e procedurale”. Per la sospensione indiana del 2025 vedi l&#x27;analisi dell&#x27;ISAS.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: il trattato idrico più citato come esempio di cooperazione tra rivali, oggi sotto pressione.&lt;/p&gt;&lt;a href=&quot;https://www.worldbank.org/en/region/sar/brief/fact-sheet-the-indus-waters-treaty-1960-and-the-world-bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank&lt;/a&gt; · &lt;a href=&quot;https://www.isas.nus.edu.sg/papers/after-pahalgam-is-the-indus-waters-treaty-doomed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISAS NUS&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 15&lt;/div&gt;&lt;h4&gt;Ganges Water Treaty (1996)&lt;/h4&gt;&lt;p&gt;Accordo India–Bangladesh sulla ripartizione delle acque del Gange alla diga di Farakka nella stagione secca, firmato per 30 anni (scadenza a fine 2026). Critiche: esclude il Nepal a monte e non adotta un approccio di bacino.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: esempio di asimmetria monte–valle nel bacino GBM.&lt;/p&gt;&lt;a href=&quot;https://lpr.adb.org/resource/treaty-between-bangladesh-and-india-sharing-ganges-water-farakka&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Asian Development Bank, Law and Policy Reform&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 17&lt;/div&gt;&lt;h4&gt;UN-OHRLLS, lista dei SIDS&lt;/h4&gt;&lt;p&gt;L&#x27;ufficio ONU per i Paesi meno sviluppati, senza sbocco al mare e piccoli Stati insulari elenca 39 SIDS membri ONU e 18 membri associati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della categoria “SNIJ recognised as SIDS” nella mappa.&lt;/p&gt;&lt;a href=&quot;https://www.un.org/ohrlls/content/list-sids&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;un.org/ohrlls&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 1 e 16&lt;/div&gt;&lt;h4&gt;Fund for responding to Loss and Damage&lt;/h4&gt;&lt;p&gt;Fondo deciso alla COP27 (2022) e operativo dalla COP28 (2023), per aiutare i Paesi vulnerabili a rispondere a perdite economiche e non economiche; segretariato ospitato inizialmente dalla Banca Mondiale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: traduce in istituzione la voce “Finance: loss and damage” dei piccoli Stati insulari.&lt;/p&gt;&lt;a href=&quot;https://unfccc.int/establishing-a-dedicated-fund-for-loss-and-damage&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNFCCC&lt;/a&gt; · &lt;a href=&quot;https://climatefundsupdate.org/the-funds/fund-for-responding-to-loss-and-damage/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate Funds Update&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 19–20&lt;/div&gt;&lt;h4&gt;EU Critical Raw Materials Act&lt;/h4&gt;&lt;p&gt;Regolamento UE (approvato dal Consiglio a marzo 2024) che definisce materie prime strategiche e 34 materie prime critiche e punta a diversificare le forniture e rafforzare estrazione, lavorazione e riciclo nell&#x27;UE. L&#x27;infografica del Consiglio mostra che la Cina è il principale fornitore globale e dell&#x27;UE per la maggioranza delle CRMs.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la risposta normativa europea alla “nuova mappa della dipendenza”.&lt;/p&gt;&lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/critical-raw-materials/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consiglio dell&#x27;UE&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 20&lt;/div&gt;&lt;h4&gt;Worldwide Governance Indicators&lt;/h4&gt;&lt;p&gt;Progetto della Banca Mondiale (Kaufmann e Kraay) che dal 1996 misura sei dimensioni della governance in oltre 200 economie, aggregando sondaggi ed esperti con margini d&#x27;errore espliciti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: sono la base della scala di colori “level of governance” della mappa dei fornitori.&lt;/p&gt;&lt;a href=&quot;https://www.library.hbs.edu/Citations/Worldwide-Governance-Indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School Library&lt;/a&gt; · &lt;a href=&quot;https://openknowledge.worldbank.org/entities/publication/ef42ce25-be5a-52ce-93f4-defcb47966ab/full&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, Governance Matters&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Citato a slide 22&lt;/div&gt;&lt;h4&gt;Global Food Security Index 2022&lt;/h4&gt;&lt;p&gt;Indice di Economist Impact (sostenuto da Corteva): 113 Paesi, 68 indicatori su accessibilità economica, disponibilità, qualità e sicurezza, sostenibilità e adattamento. Nel 2022 primi Finlandia, Irlanda, Norvegia; terzo anno di peggioramento globale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte della mappa Statista nella slide 22.&lt;/p&gt;&lt;a href=&quot;https://www.corteva.com/our-impact/global-food-security-index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Corteva&lt;/a&gt; · &lt;a href=&quot;https://agriland.ie/farming-news/ireland-ranks-second-in-global-food-security-index-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Agriland&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 22&lt;/div&gt;&lt;h4&gt;FAO: i concetti base della food security&lt;/h4&gt;&lt;p&gt;Guida FAO che riporta la definizione del World Food Summit del 1996 e spiega i quattro pilastri: availability, access, utilization, stability.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la cornice teorica dello schema “War&#x27;s impact on the food security pillars”.&lt;/p&gt;&lt;a href=&quot;https://fao.org/4/al936e/al936e00.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FAO (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Collegato a slide 4&lt;/div&gt;&lt;h4&gt;IPCC AR6, glossario&lt;/h4&gt;&lt;p&gt;Glossario del Sixth Assessment Report (Working Group II) con le definizioni ufficiali di mitigation, adaptation e resilience usate nei negoziati e nella letteratura scientifica.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fissa il lessico dei “tre pilastri” della slide 4.&lt;/p&gt;&lt;a href=&quot;https://www.ipcc.ch/report/ar6/wg2/chapter/annex-ii/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ipcc.ch&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:1rem&quot;&gt;Non rintracciati online con certezza: lo schema “Ocean climate change + AI” della slide 7 (la slide riporta solo il link a Offshore Technology) e il grafico ISDO delle rotte della slide 9 (fonti dichiarate: Ballast Markets, Fluent Cargo, Cryopolitics, Arctic Today, Trans.info).&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p class=&quot;sig&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;p&gt;Fonte principale: &lt;code&gt;corso/Materials of the course/Week Three/Week Three.pdf&lt;/code&gt;. Le parti segnate “fonte esterna” vengono dal web e sono distinte dal contenuto delle slide; le parti “spiegazione” sono integrazioni didattiche, e i grafici interattivi sono modelli illustrativi.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;
