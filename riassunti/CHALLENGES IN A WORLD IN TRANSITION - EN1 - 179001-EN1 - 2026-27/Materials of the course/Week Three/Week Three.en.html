&lt;!-- ===================== 1. QUADRO ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;The framework · slides 1–3&lt;/div&gt;&lt;h2&gt;A transition that changes the rules of power&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“The transition is changing the conditions under which political power operates.” &lt;span class=&quot;src&quot;&gt;slide 1&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;The &lt;b class=&quot;t&quot;&gt;sustainability transition&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the decades-long shift from energy, production and food systems based on fossil fuels and linear exploitation to low-emission, more equitable systems)&lt;/span&gt; is not merely a technical matter. It changes &lt;i&gt;where&lt;/i&gt; the resources that matter are located, &lt;i&gt;who&lt;/i&gt; controls them and &lt;i&gt;which&lt;/i&gt; countries become dependent on others. This is why the lecture examines it through the lens of &lt;b class=&quot;t&quot;&gt;geopolitics&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the study of how territory, resources and geographical position shape power among states and other actors)&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;The four drivers of change &lt;span class=&quot;src&quot;&gt;slide 1&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Climate&lt;/div&gt;&lt;h4&gt;Rising temperatures, loss and damage&lt;/h4&gt;&lt;p&gt;Warming produces physical impacts. &lt;b class=&quot;t&quot;&gt;Loss and damage&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the impacts that neither mitigation nor adaptation has managed to avoid, such as submerged land or destroyed harvests)&lt;/span&gt; has also become a negotiating category. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Resources&lt;/div&gt;&lt;h4&gt;Water, food, minerals, energy&lt;/h4&gt;&lt;p&gt;Basic resources become scarcer or more contested; the transition brings new ones to the fore (lithium, cobalt, rare earths).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Technology&lt;/div&gt;&lt;h4&gt;AI, data, digital infrastructure&lt;/h4&gt;&lt;p&gt;Digital technology is used to monitor the planet, but it is also strategic infrastructure and an intelligence tool (see the Arctic case).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Power&lt;/div&gt;&lt;h4&gt;New dependencies and new alliances&lt;/h4&gt;&lt;p&gt;Whoever controls minerals, technologies and routes gains leverage; new coalitions emerge (e.g. Andean countries on minerals).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;A &lt;i&gt;mutually constitutive&lt;/i&gt; relationship &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;“Geopolitics shapes the path of sustainability transitions. Sustainability transitions reshape geopolitics.” &lt;b class=&quot;t&quot;&gt;Mutually constitutive&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(each constitutes the other: neither term is solely cause or solely effect)&lt;/span&gt; means that geopolitical forces determine the speed and shape of the transition, and the transition in turn reshapes geopolitical forces. Hover over or tap the items to see examples.&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;

&lt;text x=&quot;615&quot; y=&quot;100&quot;&gt;Decarbonisation&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;145&quot;&gt;Circular economy&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;190&quot;&gt;Food &amp;amp; water governance&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;235&quot;&gt;Climate finance&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;280&quot;&gt;Planetary equity&lt;/text&gt;&lt;/g&gt;

&lt;text x=&quot;380&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;f-terra&quot; style=&quot;font:600 15px var(--sans)&quot;&gt;⇄&lt;/text&gt;

&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Trade and sanctions&lt;/b&gt;&lt;br&gt;The break with Russian gas pushes the EU to diversify and accelerate renewables (sec. 8).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Security priorities&lt;/b&gt;&lt;br&gt;If defence absorbs budgets and attention, climate finance may shrink (sec. 8).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Territory&lt;/b&gt;&lt;br&gt;Upstream states on a river control the water of downstream states (sec. 6).&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;g2&quot; hidden&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Decarbonisation&lt;/b&gt;&lt;br&gt;Shifts dependence from oil and gas to lithium, cobalt, rare earths and refining capacity (sec. 4 and 9).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Climate finance&lt;/b&gt;&lt;br&gt;Becomes a site of negotiation between the Global North and South: who pays for adaptation and loss and damage (sec. 7).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Planetary equity&lt;/b&gt;&lt;br&gt;Equity claims give a diplomatic voice to small but highly exposed states (sec. 7).&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The central tension: why the transition becomes political &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;claim&quot;&gt;“Every transformation creates winners, losers and new dependencies.”&lt;/p&gt;
&lt;div class=&quot;stepper dim&quot; data-steps&gt;
&lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Three stages: old system, transition, political effects&quot; style=&quot;width:100%;height:auto&quot;&gt;
&lt;g data-k=&quot;0&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-slatebg&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-slate&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Old system&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;fossil fuel incumbency&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;1&quot;&gt;&lt;rect x=&quot;270&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-sagebg&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-sage&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Transition&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;renewables &amp;amp; electrification&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;2&quot;&gt;&lt;rect x=&quot;530&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;12&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; class=&quot;f-ochre&quot; style=&quot;font:600 18px var(--serif)&quot;&gt;Political effects&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:13px&quot;&gt;competition · conflict · cooperation&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M234 60h30M494 60h30&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Old system&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b class=&quot;t&quot;&gt;Fossil fuel incumbency&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the power of “incumbents”, i.e. already dominant actors: oil, gas and coal companies and producer states, with an interest in slowing change)&lt;/span&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Established trade routes&lt;/b&gt;: pipelines, tanker routes, strategic straits.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Concentrated power&lt;/b&gt;: few producers, high rents.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Transition&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Renewables and electrification&lt;/b&gt;: solar, wind, electric vehicles, heat pumps.&lt;/li&gt;&lt;li&gt;&lt;b&gt;New minerals and infrastructure&lt;/b&gt;: batteries, grids, storage, submarine cables.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Faster technological change&lt;/b&gt;: shorter innovation cycles, rapidly shifting advantages.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Political effects&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Resource competition&lt;/b&gt;: the race for critical minerals and routes (sec. 3, 4, 9).&lt;/li&gt;&lt;li&gt;&lt;b class=&quot;t&quot;&gt;Distributional conflict&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(struggle over who bears the costs and who reaps the benefits)&lt;/span&gt;: coal regions, mining communities, fossil-fuel-exporting countries.&lt;/li&gt;&lt;li&gt;&lt;b&gt;New forms of cooperation&lt;/b&gt;: water agreements, producer alliances, climate funds.&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;The key point: the transition does not eliminate power relations, it shifts them. This argument recurs in every case study.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · the framework&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;What does it mean that geopolitics and the transition are “mutually constitutive”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That they influence each other in both directions: geopolitical forces (territory, sanctions, alliances, security priorities) determine the path of the transition, and the transition (decarbonisation, climate finance, equity) reshapes geopolitical balances. Neither is solely the cause.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;According to slide 3, why does every transformation become political?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because it creates winners, losers and new dependencies. Moving from a fossil-based system with concentrated power to one based on renewables and new minerals generates resource competition, distributional conflicts and new forms of cooperation.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Name the four drivers on slide 1, with one example each.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Climate (rising temperatures, loss and damage); Resources (water, food, minerals, energy); Technology (AI, data, digital infrastructure); Power (new dependencies and new alliances).&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 2. MAR ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;mar&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Key concepts · slide 4&lt;/div&gt;&lt;h2&gt;Mitigation, adaptation, resilience&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;These are the &lt;b&gt;three pillars of global climate action&lt;/b&gt;. Together they form a comprehensive framework: &lt;i&gt;mitigation&lt;/i&gt; addresses the &lt;b&gt;causes&lt;/b&gt;, &lt;i&gt;adaptation&lt;/i&gt; the &lt;b&gt;immediate impacts&lt;/b&gt;, and &lt;i&gt;resilience&lt;/i&gt; prepares systems to &lt;b&gt;withstand and recover&lt;/b&gt; from shocks. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;m&quot;&gt;Mitigation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;a&quot;&gt;Adaptation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;r&quot;&gt;Resilience&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;m&quot;&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Attack the root cause&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Mitigation&lt;/b&gt;: reducing or preventing greenhouse gas emissions.&lt;/p&gt;&lt;p&gt;Examples: renewables, energy efficiency, low-emission shipping, ocean carbon sequestration (slide 7).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Guiding question&lt;/div&gt;&lt;p&gt;“How do we stop the problem from getting worse?” It operates at a global scale and over long time horizons: the benefits reach everyone, including those who did not contribute, which creates incentives to let others do the work (&lt;i&gt;free riding&lt;/i&gt;). &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;a&quot; hidden&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Adjust systems and behaviours&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Adaptation&lt;/b&gt;: modifying systems and behaviours to cope with current and future climate change.&lt;/p&gt;&lt;p&gt;Examples: coastal protection, sustainable fisheries (slide 7), migration as a diversification strategy (slide 12).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Guiding question&lt;/div&gt;&lt;p&gt;“How do we live with what is already happening?” It is local and its benefits accrue mainly to those who undertake it, but it is costly: the most exposed countries are often the least wealthy (small islands case). &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;r&quot; hidden&gt;&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Build the overall capacity&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Resilience&lt;/b&gt;: the overall capacity of a system to absorb shocks, minimise damage and recover quickly.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Guiding question&lt;/div&gt;&lt;p&gt;“When the shock hits, how far do we fall and how quickly do we get back up?” It is a property of the system (institutions, networks, communities, finance), not a single intervention. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Lab: the three pillars applied to a climate shock&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The chart shows the “level of functioning” of a system (e.g. a coastal city) before and after a shock. Move the sliders: &lt;b&gt;mitigation&lt;/b&gt; reduces the intensity of the shock, &lt;b&gt;adaptation&lt;/b&gt; reduces how much the system is affected by it, &lt;b&gt;resilience&lt;/b&gt; speeds up recovery and limits permanent damage. The shaded area is the cumulative loss.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;resil&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 270&quot; role=&quot;img&quot; aria-label=&quot;Functioning curve of a system before and after a shock&quot;&gt;
&lt;line x1=&quot;50&quot; y1=&quot;230&quot; x2=&quot;620&quot; y2=&quot;230&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;230&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:1.5&quot;/&gt;
&lt;line x1=&quot;50&quot; y1=&quot;50&quot; x2=&quot;620&quot; y2=&quot;50&quot; style=&quot;stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1&quot;/&gt;
&lt;text x=&quot;56&quot; y=&quot;44&quot; class=&quot;s-mut&quot; style=&quot;font-size:11px&quot;&gt;pre-shock level&lt;/text&gt;
&lt;text x=&quot;335&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font-size:12px&quot;&gt;time →&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;140&quot; class=&quot;s-mut&quot; style=&quot;font-size:12px&quot; transform=&quot;rotate(-90 20 140)&quot; text-anchor=&quot;middle&quot;&gt;functioning&lt;/text&gt;
&lt;path id=&quot;rArea&quot; style=&quot;fill:var(--accent);opacity:.18&quot;/&gt;
&lt;path id=&quot;rLine&quot; fill=&quot;none&quot; style=&quot;stroke:var(--accent);stroke-width:3;stroke-linejoin:round&quot;/&gt;
&lt;line x1=&quot;164&quot; y1=&quot;30&quot; x2=&quot;164&quot; y2=&quot;230&quot; style=&quot;stroke:var(--brick);stroke-width:1.5;stroke-dasharray:2 3&quot;/&gt;&lt;text x=&quot;168&quot; y=&quot;34&quot; class=&quot;f-brick&quot; style=&quot;font-size:12px;font-weight:600&quot;&gt;shock&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctl slate&quot;&gt;&lt;label for=&quot;sM&quot;&gt;Mitigation&lt;/label&gt;&lt;input id=&quot;sM&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oM&quot;&gt;&lt;/output&gt;&lt;/div&gt;

&lt;div class=&quot;ctl ochre&quot;&gt;&lt;label for=&quot;sR&quot;&gt;Resilience&lt;/label&gt;&lt;input id=&quot;sR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oR&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;Maximum drop&lt;b id=&quot;rDrop&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Recovery time&lt;b id=&quot;rTime&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Permanent damage&lt;b id=&quot;rPerm&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Cumulative loss&lt;b id=&quot;rLoss&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Illustrative model built for study purposes, not real data. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;The official IPCC definitions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The IPCC glossary (AR6) defines &lt;i&gt;mitigation&lt;/i&gt; as “a human intervention to reduce emissions or enhance the sinks of greenhouse gases” and &lt;i&gt;adaptation&lt;/i&gt;, in human systems, as “the process of adjustment to actual or expected climate and its effects, in order to moderate harm or exploit beneficial opportunities”. For &lt;i&gt;resilience&lt;/i&gt;, the glossary refers to the capacity of social, economic and ecological systems to cope with a hazardous event by responding or reorganising in ways that maintain their essential function, identity and structure. &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ipcc.ch/report/ar6/wg2/chapter/annex-ii/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPCC AR6 WGII, Annex II: Glossary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · three pillars&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Is a coastal barrier against storm surges mitigation or adaptation?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Adaptation: it does not reduce emissions, but adjusts the system to the impacts (sea level rise, storms). On slide 7 it corresponds to “Strengthening coastal protection”.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What is the difference between adaptation and resilience?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Adaptation is a set of specific adjustments for coping with known impacts; resilience is the overall capacity of the system to absorb shocks (including unforeseen ones), limit damage and recover quickly. Adaptation contributes to resilience but does not exhaust it.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Why is mitigation more exposed to the free-riding problem than adaptation?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because emission reductions produce a global benefit that reaches everyone, including those who do not pay; the benefits of adaptation, by contrast, accrue largely to those who carry it out.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 3. ARTICO ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;artico&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 1 · Northern Europe and the Arctic · slides 5–9&lt;/div&gt;&lt;h2&gt;The Arctic, a changing strategic space&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;From slide 5 onwards the lecture turns to &lt;b&gt;case studies across the world&lt;/b&gt;: “the same transition looks different from different places”. The same transition, seen from different places, produces different problems. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;claim&quot;&gt;“Environmental change opens new routes and new security questions.” &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;What changes&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;b class=&quot;t&quot;&gt;Sea-ice loss&lt;/b&gt; changes &lt;b&gt;access, mobility and monitoring&lt;/b&gt;: previously unreachable routes and deposits become accessible.&lt;/li&gt;&lt;li&gt;Offshore infrastructure (platforms, cables, pipelines) becomes both &lt;b&gt;economic assets&lt;/b&gt; and &lt;b&gt;security concerns&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Geopolitical dilemma&lt;/div&gt;&lt;p&gt;Digitalisation improves environmental observation (satellites, sensors, models) but links monitoring systems to &lt;b&gt;intelligence and defence&lt;/b&gt; priorities.&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;This is a case of &lt;b class=&quot;t&quot;&gt;dual-use&lt;/b&gt; technology &lt;span class=&quot;gl&quot;&gt;(the same infrastructure serves both civilian and military purposes)&lt;/span&gt;. Whoever collects data on the ice also sees the ships. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Sorting game: mitigation or adaptation?&lt;/h4&gt;
&lt;p class=&quot;cap&quot;&gt;The five solutions on slide 7. Choose the category for each one.&lt;/p&gt;
&lt;div class=&quot;grid&quot; id=&quot;sortGame&quot;&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Developing ocean-based renewable energy&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Advancing low-carbon maritime transportation&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;M&quot;&gt;&lt;b&gt;Enhancing ocean carbon sequestration&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;A&quot;&gt;&lt;b&gt;Strengthening coastal protection&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-ans=&quot;A&quot;&gt;&lt;b&gt;Improving sustainable fisheries&lt;/b&gt;&lt;div class=&quot;chips&quot; style=&quot;margin-top:.5rem&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;M&quot;&gt;Mitigation&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-g=&quot;A&quot;&gt;Adaptation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb cap&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;What about Indigenous communities? &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;The map on slide 8 shows the &lt;b&gt;eight Arctic states&lt;/b&gt; (Canada, Denmark with Greenland, Finland, Iceland, Norway, the Russian Federation, Sweden, the United States) and, overlaid, dozens of &lt;b&gt;Arctic Indigenous communities&lt;/b&gt;. The slide&#x27;s question, “What about Indigenous communities?”, shifts the discussion: routes and resources are contested between states, but the territories are inhabited by peoples (Inuit, Sámi, Aleut, Gwich&#x27;in and others) for whom the ice is home, hunting ground and culture.&lt;/p&gt;
&lt;p&gt;This point connects the Arctic to the lecture&#x27;s underlying question: &lt;b&gt;who defines security&lt;/b&gt;, states alone or also people and ecosystems? (slide 14)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source.&lt;/b&gt; In the Arctic Council, the main regional forum, six Indigenous organisations hold the status of &lt;i&gt;Permanent Participants&lt;/i&gt;: they can take the floor and must be consulted, but they do not vote at ministerial meetings, which are reserved for the eight states. &lt;a href=&quot;https://hillnotes.ca/2022/06/14/the-arctic-council-the-involvement-of-indigenous-peoples/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HillNotes, Library of Parliament (Canada)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;A better route? &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The slide compares average distances from &lt;b&gt;Shanghai → Hamburg&lt;/b&gt; (chart from the International Sustainable Development Observatory): via the Cape of Good Hope, via the Suez Canal and via the &lt;b class=&quot;t&quot;&gt;Northern Sea Route (NSR)&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the passage along Russia&#x27;s Arctic coast between the Bering Strait and the Barents Sea)&lt;/span&gt;. Adjust the ship&#x27;s speed and the typical delays on the Arctic route to see how advantageous it really is.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;route&quot;&gt;
&lt;svg viewBox=&quot;0 0 660 190&quot; role=&quot;img&quot; aria-label=&quot;Bars comparing the three routes in days of sailing&quot;&gt;
&lt;g id=&quot;rtBars&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;kn&quot;&gt;Ship speed (knots)&lt;/label&gt;&lt;input id=&quot;kn&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;22&quot; value=&quot;14&quot;&gt;&lt;output id=&quot;okn&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;dl&quot;&gt;NSR delays: ice, icebreaker escort, waiting (days)&lt;/label&gt;&lt;input id=&quot;dl&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;15&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;odl&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot;&gt;&lt;div&gt;NSR saving vs Suez&lt;b id=&quot;sv&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Distance saved vs Suez&lt;b&gt;−4,750 km&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Distances from slide 9: Cape 25,500 km, Suez 20,500 km, NSR 15,750 km. Days = km ÷ (knots × 1.852 × 24). The delays are a teaching parameter. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Why the “shortest” route is not automatically the best&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Seasonality&lt;/b&gt;: the NSR is navigable without heavy icebreakers mainly in summer and autumn; for the rest of the year an escort is required.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Risk and costs&lt;/b&gt;: higher insurance premiums, ice-class vessels, few ports of refuge, risk of spills in a fragile ecosystem.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Geopolitics&lt;/b&gt;: the route runs through waters under Russian control, which regulates transit and escorts: since 2022 its use has been tied to sanctions and to Moscow&#x27;s decisions.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Climate paradox&lt;/b&gt;: the route opens up &lt;i&gt;because&lt;/i&gt; the ice is melting; using it more means more traffic and emissions precisely where warming is fastest.&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt; Distances vary depending on the sources and ports considered: Wikipedia gives, for Shanghai–Hamburg, roughly 14,000 nautical miles via the Cape, 10,800 via Suez and 7,300 via the NSR. &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://en.wikipedia.org/wiki/Northern_Sea_Route&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Northern Sea Route&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Arctic&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Why is Arctic offshore infrastructure both “economic assets” and “security concerns”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because it generates value (energy, data, trade), but for precisely that reason it represents targets and points of vulnerability; as sea-ice loss makes access easier, both exploitation and military competition to protect or control it increase.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What is the digitalisation dilemma in the Arctic?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Digital systems improve environmental observation, but they become linked to intelligence and defence: the same monitoring infrastructure is dual-use, so scientific cooperation risks becoming a security domain.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How much shorter is the NSR than Suez according to slide 9, and why is this not enough to make it advantageous?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;By 4,750 km (15,750 versus 20,500). It is not enough because ice seasonality, escorts and waiting times, insurance, rescue infrastructure, Russian control of the route and environmental risks all matter.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 4. LITIO ===================== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;litio&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 2 · Lithium and the green transition · slides 10–11&lt;/div&gt;&lt;h2&gt;South America, the mineral frontier&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“Clean technologies can reproduce unequal resource relations.” &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;Clean technologies can reproduce the same unequal relations as the fossil economy: those who extract remain at the bottom of the value chain, while those who refine and produce technology capture most of the value. Step through the chain in four stages.&lt;/p&gt;
&lt;div class=&quot;stepper dim&quot; data-steps&gt;
&lt;svg viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Four-step chain: demand, extraction, value, justice&quot; style=&quot;width:100%;height:auto&quot;&gt;
&lt;line x1=&quot;70&quot; y1=&quot;45&quot; x2=&quot;690&quot; y2=&quot;45&quot; class=&quot;st-rule&quot; style=&quot;stroke-width:4&quot;/&gt;
&lt;g data-k=&quot;0&quot;&gt;&lt;circle cx=&quot;90&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-slate&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;1&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Demand&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;1&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-sage&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;290&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Extraction&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;2&quot;&gt;&lt;circle cx=&quot;490&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-ochre&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Value&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;3&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;45&quot; r=&quot;28&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 18px var(--sans)&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 14px var(--sans)&quot;&gt;Justice&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Demand: batteries and electrification&lt;/h4&gt;&lt;p&gt;Electric vehicles and stationary storage drive up demand for lithium. Demand arises mainly in China, Europe and North America, far from the sites of extraction.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Extraction: territories, water and labour&lt;/h4&gt;&lt;p&gt;Much of South America&#x27;s lithium lies in high-altitude Andean salt flats, the so-called &lt;b class=&quot;t&quot;&gt;lithium triangle&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(Argentina, Bolivia and Chile)&lt;/span&gt;. It is often extracted by evaporating brines in ponds: a process that consumes water in arid areas inhabited by Indigenous and farming communities. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Value: who controls refining and technology?&lt;/h4&gt;&lt;p&gt;Value is concentrated downstream: refining chemistry, cells, batteries, patents. If the producer country exports only raw material, it remains dependent. This is the same pattern as in section 9: &lt;i&gt;strategic power moves along the supply chain&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Justice: the risk of a new green colonialism&lt;/h4&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Green colonialism&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(when the decarbonisation of the North rests on low-value-added extraction in the South, offloading environmental and social costs there)&lt;/span&gt;. The term evokes the colonial history of extraction in Latin America.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;“The energy transition shifts dependency from fossil fuels to critical minerals and processing capacity.” &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The regional response: cooperating on strategic minerals &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;From the slide (Mining Frontier)&lt;/div&gt;&lt;p&gt;Chile, Argentina, Bolivia and Peru have signed a joint declaration to deepen regional cooperation on strategic minerals, with &lt;b&gt;copper and lithium&lt;/b&gt; at its core. They aim to strengthen their &lt;b&gt;collective position as reliable suppliers&lt;/b&gt; in global supply chains.&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;Interpretation: this is the “Power” driver from slide 1 (new alliances) seen from the producers&#x27; side: joining forces to bargain more effectively and move up the value chain. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source.&lt;/b&gt; The declaration was signed in Santiago on 28 August 2026. It provides for cooperation on geological exploration, mining policy, regulatory frameworks and training, and for seeking support from multilateral bodies. Analysts note that it is &lt;b&gt;non-binding&lt;/b&gt;: no common production targets, unified permits or allocated funds. &lt;a href=&quot;https://www.kitco.com/news/off-the-wire/2026-08-28/four-south-american-nations-sign-strategic-minerals-pact&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reuters via Kitco&lt;/a&gt; · &lt;a href=&quot;https://www.miningfrontier.com/news/south-american-nations-deepen-cooperation-on-strategic-minerals/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mining Frontier (link from the slide)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · lithium&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;What does it mean that clean technologies can “reproduce unequal relations”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That demand for battery minerals can recreate the extractive pattern: producer countries supply raw material and bear the costs to land, water and labour, while refining, technology and value remain elsewhere. The risk is “green colonialism”.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Towards what does dependency shift in the energy transition?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;From fossil fuels to critical minerals and processing capacity: owning the mine is not enough; what matters is controlling refining.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Why are Chile, Argentina, Bolivia and Peru cooperating, and what is the limitation of their agreement?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;To strengthen their collective position as reliable suppliers of copper and lithium. The limitation (external source): it is a non-binding declaration, with no common targets or funds.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 5. AFRICA ===================== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;africa&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 3 · Migration and sustainability · slides 12–13&lt;/div&gt;&lt;h2&gt;Africa: climate mobility and development&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“Mobility can be both an adaptation strategy and a source of vulnerability.” &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Climate mobility&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(movements of people linked to sudden-onset climate impacts, such as floods, or slow-onset ones, such as drought and desertification; it includes voluntary migration, forced displacement and planned relocation)&lt;/span&gt;. The case shows that the same movement can reduce or increase risk, depending on how it is governed.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Observed tension&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Climate variability affects &lt;i&gt;livelihoods&lt;/i&gt;, especially agriculture and pastoralism.&lt;/li&gt;&lt;li&gt;Migration can diversify income and reduce exposure (remittances, seasonal work).&lt;/li&gt;&lt;li&gt;Policies often treat migration and sustainability &lt;b&gt;separately&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Governance opportunity&lt;/div&gt;&lt;p&gt;Integrating migration into adaptation and development planning can turn movement into a &lt;b&gt;resource for resilience&lt;/b&gt;, rather than framing it solely as a &lt;b&gt;security risk&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;mob&quot;&gt;
&lt;div class=&quot;chips&quot; style=&quot;margin-bottom:.6rem&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-mob=&quot;sep&quot;&gt;Separate policies&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-mob=&quot;int&quot;&gt;Integrated policies&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 760 260&quot; role=&quot;img&quot; aria-label=&quot;Climate mobility pathways towards vulnerability or resilience&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;100&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-slatebg&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Climate&lt;/text&gt;&lt;text x=&quot;85&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;variability&lt;/text&gt;
&lt;rect x=&quot;200&quot; y=&quot;100&quot; width=&quot;150&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;Livelihoods&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;under stress&lt;/text&gt;
&lt;rect x=&quot;390&quot; y=&quot;100&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;30&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 14px var(--sans)&quot;&gt;Mobility&lt;/text&gt;
&lt;path d=&quot;M160 130h36M350 130h36&quot; style=&quot;stroke:var(--muted);stroke-width:2&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;g id=&quot;pathRes&quot;&gt;&lt;path d=&quot;M510 115 Q540 55 570 55&quot; fill=&quot;none&quot; style=&quot;stroke:var(--sage);stroke-width:4&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;575&quot; y=&quot;20&quot; width=&quot;175&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-sagebg&quot;/&gt;&lt;text x=&quot;662&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; class=&quot;f-sage&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;ADAPTATION&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font-size:12px&quot;&gt;remittances, diversified income,&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font-size:12px&quot;&gt;reduced exposure&lt;/text&gt;&lt;/g&gt;
&lt;g id=&quot;pathVul&quot;&gt;&lt;path d=&quot;M510 145 Q540 205 570 205&quot; fill=&quot;none&quot; style=&quot;stroke:var(--brick);stroke-width:4&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;rect x=&quot;575&quot; y=&quot;160&quot; width=&quot;175&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;f-brickbg&quot;/&gt;&lt;text x=&quot;662&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; class=&quot;f-brick&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;VULNERABILITY&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;204&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font-size:12px&quot;&gt;displacement, informal&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font-size:12px&quot;&gt;settlements, new exposure&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;note&quot; id=&quot;mobTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Teaching diagram adapted from slide 12. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;The Africa Climate Mobility Initiative (ACMI) &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;According to the slide, the &lt;b&gt;ACMI&lt;/b&gt; is a collaboration between the &lt;b&gt;African Union Commission&lt;/b&gt;, &lt;b&gt;UNDP&lt;/b&gt;, &lt;b&gt;UNFCCC&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the UN Framework Convention on Climate Change)&lt;/span&gt;, &lt;b&gt;IOM&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(International Organization for Migration)&lt;/span&gt; and the &lt;b&gt;World Bank&lt;/b&gt;. It aims to build political momentum and a common agenda on climate mobility in Africa, and to support implementation capacity and partnerships.&lt;/p&gt;&lt;p&gt;Over two years it has produced research and models, consulted African and international experts and established a &lt;b&gt;Community of Practice&lt;/b&gt; to harness climate mobility across the continent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source.&lt;/b&gt; The ACMI&#x27;s flagship report, &lt;i&gt;African Shifts&lt;/i&gt; (launched ahead of COP27 in Egypt, 2022), analyses how climate vulnerability currently shapes decisions to move and builds scenarios up to 2050; the press picked up its estimate that &lt;b&gt;up to 113 million&lt;/b&gt; people could move within Africa by 2050. It proposes an eight-point action agenda for 2023–2030. &lt;a href=&quot;https://preventionweb.net/quick/76346&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb (UNDRR)&lt;/a&gt; · &lt;a href=&quot;https://theconversation.com/climate-change-will-force-up-to-113m-people-to-relocate-within-africa-by-2050-new-report-193633&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Conversation&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Africa&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;In what sense is mobility both adaptation and vulnerability?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It is adaptation when it diversifies income (remittances, work elsewhere) and reduces the exposure of those who stay; it is vulnerability when it becomes forced displacement to places that are themselves risky or lack protection.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What governance mistake does slide 12 identify?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Treating migration and sustainability separately and framing migration solely as a security risk. The opportunity lies in integrating it into adaptation and development planning.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Which organisations make up the ACMI?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The African Union Commission, UNDP, UNFCCC, IOM and the World Bank.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;


&lt;!-- ===================== 6. ACQUA ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;acqua&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 4 · Water agreements · slides 14–15&lt;/div&gt;&lt;h2&gt;South Asia: water across borders&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“Water agreements connect cooperation, conflict and justice.” &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Resource&lt;/div&gt;&lt;p&gt;Rivers cross political borders: they are &lt;b class=&quot;t&quot;&gt;transboundary&lt;/b&gt; resources.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Risk&lt;/div&gt;&lt;p&gt;Climate change increases uncertainty and exposure.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Power&lt;/div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;Upstream&lt;/b&gt; and &lt;b class=&quot;t&quot;&gt;downstream&lt;/b&gt; positions are unequal.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Peace&lt;/div&gt;&lt;p&gt;Institutions can manage tensions &lt;b&gt;when they include affected communities&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;“The key question is who gets to define security: states alone, or people and ecosystems as well?” &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;What “who defines security” means&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In the classical view, &lt;b class=&quot;t&quot;&gt;security&lt;/b&gt; means &lt;i&gt;state security&lt;/i&gt;: the defence of borders and national interests. The slide&#x27;s question opens the way to broader conceptions, such as &lt;b class=&quot;t&quot;&gt;human security&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the security of people: water, food, health, livelihoods)&lt;/span&gt; and ecological security (the integrity of ecosystems). A water agreement designed solely between governments may guarantee “security” for a state while leaving a delta village without water. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;The major basins &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;South Asia shares vital river systems (&lt;b&gt;Indus, Ganges, Brahmaputra&lt;/b&gt;) on which more than a billion people depend, and which are under severe stress from climate change, population growth and political tensions.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;Indus Basin&lt;/div&gt;&lt;p&gt;It spans China, Afghanistan, India and Pakistan. It is partly governed by the historic 1960 &lt;b&gt;Indus Waters Treaty&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill&quot;&gt;&lt;div class=&quot;label&quot;&gt;Ganges-Brahmaputra-Meghna (GBM) Basin&lt;/div&gt;&lt;p&gt;It extends across Nepal, Bhutan, India, China and Bangladesh. More than &lt;b&gt;750 million&lt;/b&gt; people depend directly on these shared waters.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs style=&quot;margin-top:1rem&quot;&gt;
&lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;w1&quot;&gt;Climate change&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;w2&quot;&gt;Geopolitical rivalries&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;w3&quot;&gt;Data gaps&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w1&quot;&gt;&lt;p&gt;The rapid melting of Himalayan glaciers causes extreme floods, shifting monsoons and, in the long term, water scarcity. At first the glaciers release more water, then, as they shrink, less and less: this is known as &lt;b class=&quot;t&quot;&gt;peak water&lt;/b&gt;. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w2&quot; hidden&gt;&lt;p&gt;Deep mistrust between &lt;i&gt;riparian nations&lt;/i&gt; prevents inclusive basin-wide agreements that would also involve upstream powers such as China.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; data-p=&quot;w3&quot; hidden&gt;&lt;p&gt;Poor sharing of accurate hydrological data hampers disaster preparedness and equitable water allocation. Hydrological data itself becomes a source of power: those upstream know first. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Lab: upstream and downstream&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;A glacier-fed river flows through two countries. Decide how much water the upstream country retains, the season and the glacier phase: see what reaches downstream.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;river&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;River flowing from an upstream country to a downstream country, with a dam&quot;&gt;

&lt;line x1=&quot;350&quot; y1=&quot;10&quot; x2=&quot;350&quot; y2=&quot;220&quot; style=&quot;stroke:var(--muted);stroke-dasharray:6 5&quot;/&gt;
&lt;text x=&quot;175&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font:600 12px var(--sans);letter-spacing:.1em&quot;&gt;UPSTREAM COUNTRY&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font:600 12px var(--sans);letter-spacing:.1em&quot;&gt;DOWNSTREAM COUNTRY&lt;/text&gt;

&lt;rect x=&quot;296&quot; y=&quot;118&quot; width=&quot;14&quot; height=&quot;44&quot; rx=&quot;2&quot; class=&quot;f-brick&quot;/&gt;&lt;text x=&quot;303&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; class=&quot;f-brick&quot; style=&quot;font:600 11px var(--sans)&quot;&gt;dam&lt;/text&gt;
&lt;text id=&quot;rvLbl&quot; x=&quot;560&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; class=&quot;s-ink&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;&lt;/text&gt;
&lt;/svg&gt;
