&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;cap&quot; style=&quot;margin:0 .4rem 0 0&quot;&gt;Glaciers:&lt;/span&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-gl=&quot;1&quot;&gt;Today&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gl=&quot;1.25&quot;&gt;Peak melt&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gl=&quot;0.7&quot;&gt;Shrunken glaciers&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; id=&quot;rvTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Illustrative model, not real hydrological data. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source · Indus Waters Treaty.&lt;/b&gt; Signed in 1960 between India and Pakistan after nine years of negotiations mediated by the World Bank (itself a signatory): it allocates the eastern rivers (Ravi, Beas, Sutlej) to India and the western rivers (Indus, Jhelum, Chenab) to Pakistan, with a Permanent Indus Commission and three tiers of dispute resolution (commission, neutral expert, court of arbitration). &lt;a href=&quot;https://www.worldbank.org/en/region/sar/brief/fact-sheet-the-indus-waters-treaty-1960-and-the-world-bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, fact sheet&lt;/a&gt;. In April 2025, following the Pahalgam attack, India declared the treaty &lt;i&gt;in abeyance&lt;/i&gt;, a move that Pakistan contests as illegal. &lt;a href=&quot;https://www.isas.nus.edu.sg/papers/after-pahalgam-is-the-indus-waters-treaty-doomed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISAS, National University of Singapore&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · water&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;List the four dimensions of water agreements on slide 14.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Resource (rivers cross borders), Risk (climate increases uncertainty and exposure), Power (upstream and downstream are unequal positions), Peace (institutions manage tensions if they include affected communities).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What are the three key challenges facing South Asian basins?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Climate change (glacial melt, floods, unstable monsoons, scarcity), geopolitical rivalries (mistrust preventing basin-wide agreements with upstream powers such as China), data gaps (limited sharing of hydrological data).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Why might an agreement “between states” not be enough to guarantee security?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because state security does not coincide with the security of people and ecosystems: if affected communities are not included, allocation may remain unjust and local tensions unresolved. This is the key question of slide 14.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 7. ISOLE ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;isole&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 5 · Oceans and climate justice · slides 16–17&lt;/div&gt;&lt;h2&gt;Small island states: exposure without leverage&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“Those most exposed to climate impacts often have the least influence over global emissions.” &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;This is the core of &lt;b class=&quot;t&quot;&gt;climate justice&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(those who contributed least to the problem suffer its effects most, and demand that responsibilities and costs be allocated accordingly)&lt;/span&gt;. &lt;b class=&quot;t&quot;&gt;Leverage&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(bargaining power)&lt;/span&gt; is what is missing: these states cannot reduce global emissions on their own, because theirs are minimal.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 220&quot; role=&quot;img&quot; aria-label=&quot;Unbalanced scale: heavy exposure, light leverage&quot;&gt;
&lt;polygon points=&quot;350,190 325,215 375,215&quot; class=&quot;f-slate&quot;/&gt;
&lt;g transform=&quot;rotate(-12 350 190)&quot;&gt;
&lt;line x1=&quot;110&quot; y1=&quot;190&quot; x2=&quot;590&quot; y2=&quot;190&quot; class=&quot;st-ink&quot; style=&quot;stroke-width:5;stroke-linecap:round&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;120&quot; width=&quot;170&quot; height=&quot;66&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font:600 15px var(--sans)&quot;&gt;EXPOSURE&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-size:12px&quot;&gt;sea, storms, coasts&lt;/text&gt;
&lt;rect x=&quot;450&quot; y=&quot;160&quot; width=&quot;110&quot; height=&quot;26&quot; rx=&quot;8&quot; class=&quot;f-sagebg&quot; style=&quot;stroke:var(--sage)&quot;/&gt;&lt;text x=&quot;505&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; class=&quot;f-sage&quot; style=&quot;font:600 13px var(--sans)&quot;&gt;LEVERAGE&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font:italic 15px var(--serif)&quot;&gt;exposure without leverage&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Teaching diagram. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card fill brick&quot;&gt;&lt;div class=&quot;label&quot;&gt;Exposure&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Sea level rise&lt;/li&gt;&lt;li&gt;Storms&lt;/li&gt;&lt;li&gt;Urban and coastal risk&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Voice&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Ocean governance&lt;/li&gt;&lt;li&gt;Climate diplomacy&lt;/li&gt;&lt;li&gt;Claims for equity&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;“Voice” is their form of power: moral authority and coalitions in UN negotiations. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Finance&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Adaptation costs&lt;/li&gt;&lt;li&gt;Loss and damage&lt;/li&gt;&lt;li&gt;Access to resources&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Who they are: the map on slide 17 &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The map distinguishes four categories of islands. Open each entry.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Small Island Developing States (SIDS)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;b class=&quot;t&quot;&gt;SIDS&lt;/b&gt; are a UN-recognised group of countries sharing similar vulnerabilities: small territories, poorly diversified economies, dependence on imports, high climate exposure. They are concentrated in the Caribbean, the Pacific and the Atlantic and Indian Oceans.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The UN-OHRLLS list comprises 39 UN member states and 18 associate members (non-sovereign territories). &lt;a href=&quot;https://www.un.org/ohrlls/content/list-sids&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN-OHRLLS, List of SIDS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Sub-national Island Jurisdictions (SNIJ)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Islands with forms of self-government that are nonetheless &lt;b&gt;part of a larger state&lt;/b&gt; (e.g. autonomous regions or territories). They face small-island exposure but have no independent voice in international negotiations.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;SNIJ recognised as SIDS&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sub-national jurisdictions that the UN (UN-OHRLLS) nevertheless counts among the SIDS, often as associate members of the regional commissions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dependent islands&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Islands dependent on an external state, without full self-government. On the map, many are in the North Atlantic and Northern Europe.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source · the Loss and Damage fund.&lt;/b&gt; The &lt;i&gt;Fund for responding to Loss and Damage&lt;/i&gt; was agreed at COP27 (2022) and operationalised at COP28 (2023): it supports vulnerable developing countries in addressing economic and non-economic losses caused by extreme events and slow-onset events (such as sea level rise). In its initial phase the secretariat is hosted by the World Bank. &lt;a href=&quot;https://unfccc.int/establishing-a-dedicated-fund-for-loss-and-damage&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNFCCC&lt;/a&gt; · &lt;a href=&quot;https://climatefundsupdate.org/the-funds/fund-for-responding-to-loss-and-damage/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate Funds Update&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · small islands&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;What does “exposure without leverage” mean?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That small island states are among the most exposed (sea, storms, coasts) but have very little influence over global emissions, and therefore little power to reduce the cause of their risk.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What are the three axes on slide 16, and which one represents their form of power?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Exposure, Voice, Finance. “Voice” (ocean governance, climate diplomacy, claims for equity) is their instrument of influence.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What is the difference between SIDS and SNIJ?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;SIDS are (for the most part) sovereign states recognised by the UN as a vulnerable group; SNIJ are autonomous islands that form part of a larger state. Some SNIJ are nevertheless recognised as SIDS.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 8. EUROPA ===================== --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;europa&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 6 · Security priorities · slide 18&lt;/div&gt;&lt;h2&gt;Europe after Russia&#x27;s invasion of Ukraine&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“War changes the political space available for long-term climate action.” &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Defence&lt;/div&gt;&lt;p&gt;Higher military spending and the return of territorial security.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Energy&lt;/div&gt;&lt;p&gt;Security of supply &lt;b&gt;accelerates&lt;/b&gt; diversification and the transition.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Climate&lt;/div&gt;&lt;p&gt;Risk of losing attention and resources for long-term agendas.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;label&quot;&gt;Nexus&lt;/div&gt;&lt;p&gt;Security policy increasingly incorporates environmental change.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot; style=&quot;margin-top:1rem&quot;&gt;The case shows two opposing effects of the same war: the pursuit of independence from Russian gas &lt;b&gt;drives&lt;/b&gt; renewables (domestically produced energy = security), while competition for budgets and political attention &lt;b&gt;slows&lt;/b&gt; the long-term climate agenda. The &lt;b class=&quot;t&quot;&gt;security-climate nexus&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the recognition that climate and security influence each other)&lt;/span&gt; is the attempt to hold the two together. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;eu&quot;&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;thr&quot;&gt;Military threat pressure&lt;/label&gt;&lt;input id=&quot;thr&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;othr&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 210&quot; role=&quot;img&quot; aria-label=&quot;Four bars that change with military pressure&quot;&gt;&lt;g id=&quot;euBars&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;figcaption&gt;Qualitative model visualising slide 18: the directions come from the slide, the magnitudes are invented for teaching purposes. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Europe&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Why can war both accelerate and slow down the transition?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It accelerates it because energy security encourages diversification away from Russian gas and domestic renewable energy production; it slows it because defence and short-term emergencies divert attention and resources from long-term climate agendas.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What does the “Nexus” item on slide 18 indicate?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That security policy increasingly incorporates environmental change: climate and security are no longer separate agendas.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;


&lt;!-- ===================== 9. CRM ===================== --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;crm&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;9&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 7 · Energy systems · slides 19–20&lt;/div&gt;&lt;h2&gt;Critical raw materials: a new map of dependence&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“The green transition does not eliminate geopolitics. It changes the geography of strategic resources.” &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Critical raw materials (CRMs)&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(economically important materials with a high supply risk, because production is concentrated in a few countries or they are hard to substitute)&lt;/span&gt;. The slide compares three generations of dependence.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card top slate&quot;&gt;&lt;h4&gt;Oil and gas&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Legacy dependence&lt;/div&gt;&lt;p&gt;Pipelines, shipping, producer states.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top sage&quot;&gt;&lt;h4&gt;Lithium, cobalt, rare earths&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Emerging dependence&lt;/div&gt;&lt;p&gt;Mining regions, refining and technology.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top ochre&quot;&gt;&lt;h4&gt;Renewables&lt;/h4&gt;&lt;div class=&quot;label&quot;&gt;Infrastructure dependence&lt;/div&gt;&lt;p&gt;Manufacturing, grids and storage.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Supply chain: extraction, processing, manufacturing, deployment&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g style=&quot;font:600 14px var(--sans)&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;73&quot; class=&quot;s-ink&quot;&gt;Extraction&lt;/text&gt;
&lt;rect x=&quot;200&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Processing&lt;/text&gt;&lt;text x=&quot;280&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;refining&lt;/text&gt;
&lt;rect x=&quot;390&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Manufacturing&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;cells, panels, magnets&lt;/text&gt;
&lt;rect x=&quot;580&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-ochrebg&quot;/&gt;&lt;text x=&quot;665&quot; y=&quot;66&quot; class=&quot;s-ink&quot;&gt;Deployment&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;84&quot; class=&quot;s-mut&quot; style=&quot;font-weight:400;font-size:12px&quot;&gt;grids, storage&lt;/text&gt;&lt;/g&gt;
&lt;path d=&quot;M172 68h24M362 68h24M552 68h24&quot; style=&quot;stroke:var(--ochre);stroke-width:2.5&quot; marker-end=&quot;url(#ar3)&quot;/&gt;
&lt;path d=&quot;M90 112 Q380 150 665 112&quot; fill=&quot;none&quot; style=&quot;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4&quot;/&gt;
&lt;text x=&quot;380&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; class=&quot;s-mut&quot; style=&quot;font:italic 15px var(--serif)&quot;&gt;“Strategic power moves along the supply chain, not only at the mine or well.”&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Power can reside in any link: whoever controls refining or manufacturing can also exert influence over whoever owns the mine. Teaching diagram based on the statement on slide 19.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Who supplies the EU, and with what governance &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The map on slide 20 shows the EU&#x27;s main CRM suppliers (2023) and their &lt;b&gt;governance level&lt;/b&gt;, measured as the average of the six 2021 &lt;b class=&quot;t&quot;&gt;Worldwide Governance Indicators&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(World Bank indicators: voice and accountability, political stability and absence of violence, government effectiveness, regulatory quality, rule of law, control of corruption)&lt;/span&gt;. Filter by governance and by stage.&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;crmFig&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;crmGov&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-v=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;high&quot;&gt;High (1.25–2.5)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;med&quot;&gt;Medium (0.1–1.24)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;low&quot;&gt;Low (−1.24–0)&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;vlow&quot;&gt;Very low (−1.25 – −2.5)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;crmPh&quot; style=&quot;margin-top:.4rem&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; data-v=&quot;all&quot;&gt;All stages&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;E&quot;&gt;Extraction&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;P&quot;&gt;Processing&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; id=&quot;crmSum&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;bars&quot; id=&quot;crmBars&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Data transcribed from the map on slide 20: percentage = share of EU supply; ** = share of global production. Italics on the map = extraction stage, roman = processing stage: the stage attribution has been reconstructed visually, so check it against the slide. Colours: &lt;span style=&quot;color:var(--sage)&quot;&gt;■&lt;/span&gt; high, &lt;span style=&quot;color:var(--ochre)&quot;&gt;■&lt;/span&gt; medium, &lt;span style=&quot;color:var(--accent)&quot;&gt;■&lt;/span&gt; low, &lt;span style=&quot;color:var(--brick)&quot;&gt;■&lt;/span&gt; very low.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;How to read it.&lt;/b&gt; China appears with 11 materials, often at the processing stage (100% of heavy rare earths, 97% of magnesium, 71% of gallium): concrete evidence that power lies in refining. Many suppliers have low or very low governance (the DRC for cobalt), so supply risk is also political. Chile (lithium, 79%) links this map to section 4. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source · Critical Raw Materials Act.&lt;/b&gt; The EU regulation approved by the Council in March 2024 distinguishes a list of &lt;b&gt;strategic raw materials&lt;/b&gt; (for green, digital, defence and space technologies) and a broader list of &lt;b&gt;34 critical raw materials&lt;/b&gt;, with the aim of diversifying supply and strengthening extraction, processing and recycling in Europe. &lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/critical-raw-materials/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of the EU, infographic&lt;/a&gt; · &lt;a href=&quot;https://twobirds.com/en/insights/2024/france/le-critical-raw-materials-act-approuve-par-le-conseil-europeen&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bird &amp;amp; Bird&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · raw materials&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Distinguish between legacy, emerging and infrastructure dependence.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Legacy: oil and gas (pipelines, shipping, producer states). Emerging: lithium, cobalt, rare earths (mining regions, refining, technology). Infrastructure: renewables (manufacturing, grids, storage).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What does it mean that power moves “along the supply chain”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That strategic leverage lies not only where the resource is located (mine or well) but at every link that is hard to substitute: refining, components, manufacturing, grids. Example: China dominates the processing of many CRMs even when it does not extract them.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Why does slide 20 cross-reference suppliers with governance indicators?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because supply risk also depends on the political stability, rule of law and corruption levels of supplier countries: relying on suppliers with low governance increases the risk of disruptions, political pressure and ethical problems (labour, environment).&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== 10. CIBO ===================== --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;cibo&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Case study 8 · Agri-food systems · slides 21–22&lt;/div&gt;&lt;h2&gt;Food security: competing priorities&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;claim&quot;&gt;“Food systems sit at the intersection of human needs, trade and planetary limits.” &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b class=&quot;t&quot;&gt;Food security&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(the condition in which all people at all times have physical and economic access to sufficient, safe and nutritious food; not to be confused with &lt;i&gt;food safety&lt;/i&gt;, the hygienic safety of food)&lt;/span&gt;. The slide breaks it down into three dimensions in tension with one another.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card fill slate&quot;&gt;&lt;div class=&quot;label&quot;&gt;Access&lt;/div&gt;&lt;p&gt;Affordability and availability.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Production&lt;/div&gt;&lt;p&gt;Land, water and ecosystems.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card fill ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Security&lt;/div&gt;&lt;p&gt;Trade, conflict and strategic dependence.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;claim&quot; style=&quot;font-size:1.1rem&quot;&gt;“Policies that improve one dimension can create pressure in another. The challenge is to govern the system as a whole.” &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Lab: choose a policy, see the trade-offs&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;food&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;foodBtns&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot; id=&quot;foodOut&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; id=&quot;foodTxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Teaching examples for practising the principle on slide 21; the effects are qualitative tendencies, not estimates. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;The global index and the impact of war &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;&lt;p&gt;The map on the left of the slide (Statista, based on Economist Intelligence Unit data) shows the scores of the &lt;b&gt;Global Food Security Index 2022&lt;/b&gt;: the index measures the affordability, availability, quality and safety, and sustainability and adaptation of food, using &lt;b&gt;68 indicators across 113 countries&lt;/b&gt;. The highest scores are in North America, Europe and Australia; the lowest are mainly in sub-Saharan Africa.&lt;/p&gt;
&lt;div class=&quot;ext-box&quot;&gt;&lt;b&gt;External source.&lt;/b&gt; In the 2022 edition Finland ranks first, followed by Ireland and Norway; Syria, Haiti and Yemen are at the bottom. The index records a global deterioration in food security for the third consecutive year. The index is produced by Economist Impact with the support of Corteva. &lt;a href=&quot;https://www.corteva.com/our-impact/global-food-security-index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Corteva, GFSI&lt;/a&gt; · &lt;a href=&quot;https://agriland.ie/farming-news/ireland-ranks-second-in-global-food-security-index-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Agriland&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;p&gt;On the right, the diagram &lt;b&gt;“War&#x27;s impact on the food security pillars”&lt;/b&gt; applies the four classic pillars to the effects of a war. Open the pillars:&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Availability&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Fertilizer crisis, supply shortage, trade ban: if a major exporter of grain or fertilisers is at war, global supply falls.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Accessibility&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Market disruption, price hike, high inflation: food is available, but it is too expensive for poor households.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Utilization&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dietary diversity, undernourishment, low productivity: poorer diets, malnutrition, reduced capacity to work.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stability&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Higher energy prices, rising interest rates, political turmoil: the first three dimensions become unstable over time.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The World Food Summit (1996) definition and the four pillars (availability, access, utilization, stability) are explained in the FAO guide: &lt;a href=&quot;https://fao.org/4/al936e/al936e00.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FAO, An Introduction to the Basic Concepts of Food Security&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · food&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Which three dimensions of food security does slide 21 propose?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Access (affordability and availability), Production (land, water, ecosystems), Security (trade, conflict, strategic dependence).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Give an example of a policy that improves one dimension and worsens another.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;An export ban lowers domestic prices (Access) but reduces global supply and trust in trade, harming importing countries (Security). Alternatively: expanding cultivated land increases production but consumes ecosystems and water.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;According to the diagram on slide 22, which pillar do higher energy prices affect?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Stability, together with rising interest rates and political turmoil.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== SINTESI ===================== --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;sintesi&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;∑&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Cross-cutting synthesis&lt;/div&gt;&lt;h2&gt;Eight places, one logic&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Each case applies the argument of slide 3: the transition creates &lt;b&gt;winners, losers and new dependencies&lt;/b&gt;. The table compares them. &lt;span class=&quot;src ctx&quot;&gt;explanation&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;Resource at stake&lt;/th&gt;&lt;th&gt;Tension&lt;/th&gt;&lt;th&gt;Governance lever&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#artico&quot;&gt;Arctic&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Routes, deposits, data&lt;/td&gt;&lt;td&gt;Economic access vs security; states vs Indigenous peoples&lt;/td&gt;&lt;td&gt;Shared monitoring, Indigenous inclusion&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#litio&quot;&gt;South America&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Lithium, copper&lt;/td&gt;&lt;td&gt;Local extraction vs value captured elsewhere&lt;/td&gt;&lt;td&gt;Producer cooperation, local processing&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#africa&quot;&gt;Africa&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Livelihoods, mobility&lt;/td&gt;&lt;td&gt;Mobility as adaptation or as vulnerability&lt;/td&gt;&lt;td&gt;Integrating migration and adaptation&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#acqua&quot;&gt;South Asia&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Glacial and river water&lt;/td&gt;&lt;td&gt;Upstream vs downstream; mistrust and missing data&lt;/td&gt;&lt;td&gt;Inclusive basin treaties, data sharing&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#isole&quot;&gt;Small islands&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Coasts, territory itself&lt;/td&gt;&lt;td&gt;Maximum exposure, minimal leverage&lt;/td&gt;&lt;td&gt;Diplomatic voice, finance for adaptation and loss and damage&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#europa&quot;&gt;Europe&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Energy, public budgets&lt;/td&gt;&lt;td&gt;Immediate security vs long-term climate&lt;/td&gt;&lt;td&gt;Security-climate nexus, diversification&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#crm&quot;&gt;Raw materials&lt;/a&gt;&lt;/td&gt;&lt;td&gt;CRMs, refining&lt;/td&gt;&lt;td&gt;Dependence on a few suppliers, often with weak governance&lt;/td&gt;&lt;td&gt;Diversification, EU rules, recycling&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;a href=&quot;#cibo&quot;&gt;Food&lt;/a&gt;&lt;/td&gt;&lt;td&gt;Land, water, trade&lt;/td&gt;&lt;td&gt;Access vs production vs security&lt;/td&gt;&lt;td&gt;Governing the system as a whole&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot; style=&quot;margin-top:1.2rem&quot;&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;1&lt;/div&gt;&lt;p&gt;The transition &lt;b&gt;does not eliminate geopolitics&lt;/b&gt;: it changes its geography (slide 19).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;2&lt;/div&gt;&lt;p&gt;Power shifts &lt;b&gt;along value chains&lt;/b&gt; and into technologies, not only onto physical resources.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;&lt;p&gt;Those most exposed often have &lt;b&gt;the least voice&lt;/b&gt;: justice is part of the transition, not an add-on.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card top&quot;&gt;&lt;div class=&quot;big&quot;&gt;4&lt;/div&gt;&lt;p&gt;The underlying question: &lt;b&gt;who defines security?&lt;/b&gt; States, people, ecosystems (slide 14).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Final self-check · connecting the cases&lt;/h4&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Which case best illustrates “exposure without leverage”, and which “strategic power moves along the supply chain”?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The first: small island states (slide 16). The second: critical raw materials (slide 19), with the lithium case as a regional example.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Link the question “who defines security?” to at least three cases.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;South Asia (states vs basin communities); Arctic (states and defence vs Indigenous communities); Africa (migration seen as a security risk vs a resource for resilience); Europe (military security vs climate security).&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How are the lithium case and the CRM map connected?&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Chile appears on slide 20 as the supplier of 79% of the EU&#x27;s lithium: this is the “emerging dependence” side of slide 19. Both cases show that dependence is shifting from fossil fuels to minerals and processing capacity.&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Classify as mitigation, adaptation or resilience: (a) offshore renewables; (b) planned seasonal migration; (c) a shared early warning system for a river basin.&lt;/p&gt;&lt;button class=&quot;btn reveal&quot; type=&quot;button&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;(a) mitigation; (b) adaptation; (c) strengthens resilience (and adaptation): it improves the capacity to absorb the shock and recover, and addresses the “data gaps” problem on slide 15.&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ===================== PER APPROFONDIRE ===================== --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;External sources · web research&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Studies, texts, regulations and websites cited in the slides or needed to understand them. Everything below is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;: the data come from the linked pages, not from the slides. Each entry states what the source contains and why it matters for the lecture.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 7&lt;/div&gt;&lt;h4&gt;Offshore Technology: the decline of Arctic sea ice&lt;/h4&gt;&lt;p&gt;An article built on the views of Ola M. Johannessen, founder of the Nansen Environmental and Remote Sensing Center (NERSC) in Bergen: for the offshore industry, understanding sea ice is crucial, thinner ice does not mean lower risk, and icebergs threaten installations and pipelines in the Barents Sea. It cites NOAA data: in September 2012 Arctic sea ice was about 54% below its 1980 level.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows how melting turns the Arctic into a space that is both economic and risky (slide 6).&lt;/p&gt;&lt;a href=&quot;https://www.offshore-technology.com/features/feature-arctic-sea-ice-decline-climate-change-nersc/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;offshore-technology.com&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slide 9&lt;/div&gt;&lt;h4&gt;Northern Sea Route&lt;/h4&gt;&lt;p&gt;Encyclopaedia entry covering history, legal regime and distance comparison tables: Shanghai–Hamburg roughly 14,000 nautical miles via the Cape, 10,800 via Suez, 7,300 via the NSR (values differ from those on the slide because they depend on ports and routes).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it makes it possible to check the ISDO chart on the slide, whose original source I could not find online.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Northern_Sea_Route&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt; · &lt;a href=&quot;https://www.iims.org.uk/northern-sea-route/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIMS&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slide 8&lt;/div&gt;&lt;h4&gt;The Arctic Council and Indigenous peoples&lt;/h4&gt;&lt;p&gt;A note from the Library of Parliament of Canada on the role of the six Indigenous “Permanent Participant” organisations in the Arctic Council: they participate and are consulted, but do not vote.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it answers the question on slide 8, “What about Indigenous communities?”.&lt;/p&gt;&lt;a href=&quot;https://hillnotes.ca/2022/06/14/the-arctic-council-the-involvement-of-indigenous-peoples/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HillNotes (Library of Parliament)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 11&lt;/div&gt;&lt;h4&gt;Andean declaration on strategic minerals&lt;/h4&gt;&lt;p&gt;Chile, Argentina, Bolivia and Peru signed in Santiago (28 August 2026) a declaration on exploration, mining policy, regulation and training, centred on copper and lithium. It is non-binding and sets no common targets or funds.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: a concrete example of “new alliances” among producer countries (slides 1 and 10).&lt;/p&gt;&lt;a href=&quot;https://www.miningfrontier.com/news/south-american-nations-deepen-cooperation-on-strategic-minerals/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Mining Frontier&lt;/a&gt; · &lt;a href=&quot;https://www.kitco.com/news/off-the-wire/2026-08-28/four-south-american-nations-sign-strategic-minerals-pact&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reuters via Kitco&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 13&lt;/div&gt;&lt;h4&gt;Africa Climate Mobility Initiative: &lt;i&gt;African Shifts&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;ACMI report (AU Commission, World Bank, UNDP, IOM, UNFCCC) launched ahead of COP27: it analyses how climate vulnerability currently shapes mobility, builds scenarios to 2050 (up to 113 million internal movements according to the press) and proposes an eight-point agenda for 2023–2030. Models developed with Columbia University&#x27;s CIESIN and the Mixed Migration Centre.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the empirical basis for the idea of migration as adaptation (slide 12).&lt;/p&gt;&lt;a href=&quot;https://preventionweb.net/quick/76346&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb&lt;/a&gt; · &lt;a href=&quot;https://ciesin.columbia.edu/news/new-report-posits-potential-mobility-africa-climate-impacts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CIESIN&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 15&lt;/div&gt;&lt;h4&gt;Indus Waters Treaty (1960)&lt;/h4&gt;&lt;p&gt;World Bank fact sheet: allocation of the eastern rivers to India and the western rivers to Pakistan, Permanent Indus Commission, three tiers of dispute resolution; the Bank&#x27;s role is “limited and procedural”. For India&#x27;s 2025 suspension, see the ISAS analysis.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: the water treaty most often cited as an example of cooperation between rivals, now under pressure.&lt;/p&gt;&lt;a href=&quot;https://www.worldbank.org/en/region/sar/brief/fact-sheet-the-indus-waters-treaty-1960-and-the-world-bank&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank&lt;/a&gt; · &lt;a href=&quot;https://www.isas.nus.edu.sg/papers/after-pahalgam-is-the-indus-waters-treaty-doomed&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISAS NUS&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slide 15&lt;/div&gt;&lt;h4&gt;Ganges Water Treaty (1996)&lt;/h4&gt;&lt;p&gt;India–Bangladesh agreement on sharing the Ganges waters at the Farakka Barrage during the dry season, signed for 30 years (expiring at the end of 2026). Criticisms: it excludes upstream Nepal and does not adopt a basin-wide approach.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: an example of upstream–downstream asymmetry in the GBM basin.&lt;/p&gt;&lt;a href=&quot;https://lpr.adb.org/resource/treaty-between-bangladesh-and-india-sharing-ganges-water-farakka&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Asian Development Bank, Law and Policy Reform&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 17&lt;/div&gt;&lt;h4&gt;UN-OHRLLS, list of SIDS&lt;/h4&gt;&lt;p&gt;The UN Office for the Least Developed Countries, Landlocked Developing Countries and Small Island Developing States lists 39 SIDS that are UN members and 18 associate members.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the “SNIJ recognised as SIDS” category on the map.&lt;/p&gt;&lt;a href=&quot;https://www.un.org/ohrlls/content/list-sids&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;un.org/ohrlls&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slides 1 and 16&lt;/div&gt;&lt;h4&gt;Fund for responding to Loss and Damage&lt;/h4&gt;&lt;p&gt;A fund agreed at COP27 (2022) and operational since COP28 (2023), to help vulnerable countries respond to economic and non-economic losses; its secretariat is initially hosted by the World Bank.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it institutionalises the “Finance: loss and damage” item for small island states.&lt;/p&gt;&lt;a href=&quot;https://unfccc.int/establishing-a-dedicated-fund-for-loss-and-damage&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNFCCC&lt;/a&gt; · &lt;a href=&quot;https://climatefundsupdate.org/the-funds/fund-for-responding-to-loss-and-damage/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Climate Funds Update&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slides 19–20&lt;/div&gt;&lt;h4&gt;EU Critical Raw Materials Act&lt;/h4&gt;&lt;p&gt;EU regulation (approved by the Council in March 2024) that defines strategic raw materials and 34 critical raw materials and aims to diversify supply and strengthen extraction, processing and recycling within the EU. The Council&#x27;s infographic shows that China is the main global and EU supplier for the majority of CRMs.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the European regulatory response to the “new map of dependence”.&lt;/p&gt;&lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/critical-raw-materials/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of the EU&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref ochre&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 20&lt;/div&gt;&lt;h4&gt;Worldwide Governance Indicators&lt;/h4&gt;&lt;p&gt;A World Bank project (Kaufmann and Kraay) that since 1996 has measured six dimensions of governance in over 200 economies, aggregating surveys and expert assessments with explicit margins of error.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: they underpin the “level of governance” colour scale on the supplier map.&lt;/p&gt;&lt;a href=&quot;https://www.library.hbs.edu/Citations/Worldwide-Governance-Indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Business School Library&lt;/a&gt; · &lt;a href=&quot;https://openknowledge.worldbank.org/entities/publication/ef42ce25-be5a-52ce-93f4-defcb47966ab/full&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, Governance Matters&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Cited on slide 22&lt;/div&gt;&lt;h4&gt;Global Food Security Index 2022&lt;/h4&gt;&lt;p&gt;An index by Economist Impact (supported by Corteva): 113 countries, 68 indicators on affordability, availability, quality and safety, and sustainability and adaptation. In 2022 Finland, Ireland and Norway ranked top; the third year of global deterioration.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the Statista map on slide 22.&lt;/p&gt;&lt;a href=&quot;https://www.corteva.com/our-impact/global-food-security-index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Corteva&lt;/a&gt; · &lt;a href=&quot;https://agriland.ie/farming-news/ireland-ranks-second-in-global-food-security-index-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Agriland&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref sage&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slide 22&lt;/div&gt;&lt;h4&gt;FAO: the basic concepts of food security&lt;/h4&gt;&lt;p&gt;FAO guide that gives the 1996 World Food Summit definition and explains the four pillars: availability, access, utilization, stability.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the theoretical framework for the diagram “War&#x27;s impact on the food security pillars”.&lt;/p&gt;&lt;a href=&quot;https://fao.org/4/al936e/al936e00.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FAO (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;div class=&quot;label&quot;&gt;Related to slide 4&lt;/div&gt;&lt;h4&gt;IPCC AR6, glossary&lt;/h4&gt;&lt;p&gt;Glossary of the Sixth Assessment Report (Working Group II) with the official definitions of mitigation, adaptation and resilience used in negotiations and in the scientific literature.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it fixes the vocabulary of the “three pillars” on slide 4.&lt;/p&gt;&lt;a href=&quot;https://www.ipcc.ch/report/ar6/wg2/chapter/annex-ii/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ipcc.ch&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:1rem&quot;&gt;Not traced online with certainty: the “Ocean climate change + AI” diagram on slide 7 (the slide only gives the link to Offshore Technology) and the ISDO route chart on slide 9 (stated sources: Ballast Markets, Fluent Cargo, Cryopolitics, Arctic Today, Trans.info).&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
