  &lt;div class=&quot;kicker&quot;&gt;Case study 9 · Nature and political authority&lt;/div&gt;
  &lt;h2&gt;Biodiversità: la conservazione è anche una questione di potere&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 14&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Who defines valuable nature, and who bears the costs of protecting it?”&lt;/p&gt;
    &lt;p&gt;Quattro dimensioni: &lt;em&gt;protected areas and land governance&lt;/em&gt; · &lt;em&gt;Indigenous and local knowledge&lt;/em&gt; · &lt;em&gt;food systems and biodiversity&lt;/em&gt; · &lt;em&gt;North-South relations&lt;/em&gt;.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;“A sustainability policy can protect ecosystems while still reproducing unequal control over land and resources.”&lt;/strong&gt; Il compito politico è collegare la tutela della biodiversità con &lt;em&gt;rights, livelihoods and legitimacy&lt;/em&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;La domanda della slide contiene due domande distinte, ed è utile tenerle separate:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Chi definisce cosa vale?&lt;/h4&gt;&lt;p&gt;Scegliere &lt;em&gt;quale&lt;/em&gt; natura proteggere (una foresta primaria, una specie simbolo, un paesaggio agricolo tradizionale) non è un dato scientifico neutro: dipende da chi ha l&#x27;autorità di produrre mappe, classificazioni e priorità. È il tema della &lt;dfn&gt;political authority&lt;/dfn&gt; (autorità politica): il potere riconosciuto di prendere decisioni vincolanti per altri.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Chi paga i costi?&lt;/h4&gt;&lt;p&gt;Un&#x27;area protetta genera benefici spesso globali (clima, specie, immagine) e costi spesso locali: limiti al pascolo, alla pesca, alla raccolta, a volte allo spostamento di intere comunità. Se chi paga non è chi decide, la conservazione diventa una &lt;em&gt;redistribuzione&lt;/em&gt; di risorse, non solo una tutela.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le quattro dimensioni, una per linguetta&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Protected areas&lt;/button&gt;&lt;button&gt;Indigenous knowledge&lt;/button&gt;&lt;button&gt;Food systems&lt;/button&gt;&lt;button&gt;North-South&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;
      &lt;p&gt;Una &lt;dfn&gt;protected area&lt;/dfn&gt; (area protetta) è uno spazio geografico delimitato e gestito, per legge o con altri mezzi efficaci, allo scopo di conservare la natura nel lungo periodo. La &lt;dfn&gt;land governance&lt;/dfn&gt; (governo della terra) è l&#x27;insieme di regole, istituzioni e rapporti di forza che stabiliscono chi può usare, possedere, trasferire e controllare la terra.&lt;/p&gt;
      &lt;p&gt;Il punto della slide: un&#x27;area protetta è sempre anche una decisione di &lt;em&gt;land governance&lt;/em&gt;. Tracciare un confine sulla mappa significa stabilire chi entra, chi resta fuori, chi controlla.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;La &lt;dfn&gt;Indigenous and local knowledge&lt;/dfn&gt; (conoscenza indigena e locale) è il sapere accumulato e trasmesso tra generazioni da comunità che vivono un territorio: stagionalità, specie, usi del fuoco e dell&#x27;acqua, regole di prelievo. Non è “folklore”: spesso è il motivo per cui un ecosistema è arrivato in buono stato fino a oggi.&lt;/p&gt;
      &lt;p&gt;Il problema politico è &lt;em&gt;quale sapere conta&lt;/em&gt; nelle decisioni: quello degli esperti esterni e delle agenzie, o anche quello di chi abita il luogo? Il tema torna nel &lt;a href=&quot;#indig&quot;&gt;case study 12&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Biodiversità e &lt;dfn&gt;food systems&lt;/dfn&gt; (sistemi alimentari: tutto ciò che va dalla produzione al consumo del cibo) sono legati in due direzioni: l&#x27;agricoltura è uno dei principali motori di perdita di habitat, ma la diversità di colture, razze e paesaggi agricoli è a sua volta biodiversità, e la sicurezza alimentare dipende da impollinatori, suoli, acqua.&lt;/p&gt;
      &lt;p&gt;Proteggere un&#x27;area può ridurre l&#x27;accesso di chi ci produce cibo; non proteggerla può distruggere la base del cibo futuro. È qui che &lt;em&gt;livelihoods&lt;/em&gt; (mezzi di sussistenza) e conservazione si scontrano o si alleano.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Le &lt;dfn&gt;North-South relations&lt;/dfn&gt; (relazioni Nord-Sud: tra paesi ad alto reddito e paesi del Sud globale) entrano perché gran parte della biodiversità terrestre si trova nel Sud globale, mentre gran parte dei finanziamenti, delle ONG e delle agende di conservazione nasce nel Nord. Chi finanzia tende a definire le priorità.&lt;/p&gt;
      &lt;p&gt;Domanda tipica d&#x27;esame: è giusto chiedere ai paesi del Sud di rinunciare a usare le proprie risorse per un beneficio globale, dopo che il Nord ha già trasformato i propri territori?&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La mappa delle aree protette&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide successiva&quot;&gt;
    &lt;p&gt;Mappa mondiale delle &lt;em&gt;terrestrial protected areas&lt;/em&gt; (verde) e &lt;em&gt;marine and coastal protected areas&lt;/em&gt; (blu). Fonte indicata: UNEP-WCMC e IUCN (2021), &lt;em&gt;Protected Planet: The World Database on Protected Areas (WDPA) and World Database on Other Effective Area-Based Conservation Measures (WD-OECM)&lt;/em&gt;, luglio 2021, protectedplanet.net. Loghi: UN Environment Programme WCMC, IUCN, WCPA.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Come leggere la mappa con lo sguardo della lezione (osservazioni sulla figura, non dati misurati):&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Le aree terrestri sono fitte in Amazzonia, Africa orientale e australe, Europa; la Groenlandia nord-orientale è coperta da un unico grande parco.&lt;/li&gt;
    &lt;li&gt;Molte aree marine sono enormi cerchi o poligoni attorno a isole remote nel Pacifico, nell&#x27;Atlantico meridionale e nell&#x27;Oceano Indiano: superfici vastissime, spesso poco abitate e amministrate da stati lontani. È facile “fare numero” in ettari lì, più difficile dove vive gente.&lt;/li&gt;
    &lt;li&gt;La mappa mostra &lt;em&gt;dove&lt;/em&gt; c&#x27;è protezione, non &lt;em&gt;chi&lt;/em&gt; la governa né &lt;em&gt;quanto&lt;/em&gt; sia efficace: due aree dello stesso verde possono avere regimi di potere opposti.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Una &lt;dfn&gt;OECM&lt;/dfn&gt; (&lt;span class=&quot;term&quot;&gt;other effective area-based conservation measure&lt;/span&gt;) è un&#x27;area che conserva efficacemente la natura pur non essendo formalmente un&#x27;area protetta: per esempio un territorio gestito da una comunità o una zona militare interdetta. La categoria è nata proprio per riconoscere forme di conservazione non statali.&lt;/p&gt;

  &lt;h3&gt;Esplora: chi governa l&#x27;area protetta?&lt;/h3&gt;
  &lt;p&gt;La stessa area, sulla mappa sempre verde, può essere governata in modi molto diversi. Sposta il cursore.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;govR&quot;&gt;Tipo di governance: &lt;span class=&quot;out&quot; id=&quot;govN&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;govR&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;govBars&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;govT&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;ext small&quot;&gt;I quattro tipi di governance (A governo, B condivisa, C privata, D popoli indigeni e comunità locali) sono le categorie usate dall&#x27;IUCN e registrate nel WDPA: &lt;a href=&quot;https://www.protectedplanet.net&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;protectedplanet.net&lt;/a&gt;. Le barre sono una lettura qualitativa didattica, non misure.&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var T=[[&#x27;A · Governance by government&#x27;,&#x27;Lo stato (ministero, agenzia parchi) decide e gestisce. Vantaggi: risorse, continuità, base legale forte. Rischio tipico: la cosiddetta “fortress conservation”, cioè proteggere escludendo le popolazioni residenti.&#x27;,[90,30,30]],
      [&#x27;B · Shared governance&#x27;,&#x27;Decisioni prese insieme da stato, comunità, a volte ONG (co-gestione). Più legittimità, ma servono veri poteri condivisi e non solo “consultazioni”.&#x27;,[65,60,55]],
      [&#x27;C · Private governance&#x27;,&#x27;Proprietari privati, fondazioni o imprese. Può essere molto efficace e rapida; il rischio è che la protezione segua la proprietà e il mercato più che i diritti di chi abita.&#x27;,[55,25,35]],
      [&#x27;D · Indigenous peoples and local communities&#x27;,&#x27;La comunità decide secondo proprie istituzioni (in inglese ICCAs, “territori di vita”). Legittimità e conoscenza locale alte; spesso manca il riconoscimento legale e il sostegno finanziario.&#x27;,[30,90,80]]];
    var L=[&#x27;Controllo statale&#x27;,&#x27;Voce locale&#x27;,&#x27;Legittimità percepita&#x27;];
    var r=document.getElementById(&#x27;govR&#x27;),g=document.getElementById(&#x27;govBars&#x27;);
    function draw(){var t=T[+r.value];document.getElementById(&#x27;govN&#x27;).textContent=t[0];document.getElementById(&#x27;govT&#x27;).textContent=t[1];
      g.innerHTML=t[2].map(function(v,i){var y=10+i*36;return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+L[i]+&#x27;&lt;/text&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+(v*4)+&#x27;&quot; height=&quot;24&quot; rx=&quot;4&quot; fill=&quot;var(--sal)&quot; style=&quot;transition:width .3s&quot;/&gt;&#x27;}).join(&#x27;&#x27;);}
    r.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;details&gt;&lt;summary&gt;Ciò che la slide dà per scontato: “fortress conservation” e giustizia ambientale&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Con &lt;span class=&quot;term&quot;&gt;fortress conservation&lt;/span&gt; (conservazione-fortezza) si indica il modello storico, nato con i grandi parchi nazionali, in cui la natura si protegge recintandola e allontanando chi ci viveva. Ha prodotto sfollamenti e conflitti, soprattutto in Africa e Asia. La slide non usa il termine, ma la frase “protect ecosystems while still reproducing unequal control over land” descrive esattamente questo rischio.&lt;/p&gt;
    &lt;p&gt;Da qui le tre parole chiave della slide: &lt;em&gt;rights&lt;/em&gt; (diritti su terra e risorse), &lt;em&gt;livelihoods&lt;/em&gt; (mezzi di vita), &lt;em&gt;legitimacy&lt;/em&gt; (le regole sono accettate come giuste da chi le subisce). Una politica di conservazione è sostenibile politicamente solo se tiene insieme tutte e tre.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;ext&quot;&gt;
    &lt;p&gt;&lt;strong&gt;Contesto: l&#x27;obiettivo “30x30”.&lt;/strong&gt; Il &lt;em&gt;Kunming-Montreal Global Biodiversity Framework&lt;/em&gt; (2022), Target 3, chiede di conservare almeno il 30% delle aree terrestri, delle acque interne e delle aree marine e costiere entro il 2030, riconoscendo anche i territori indigeni e tradizionali e i diritti delle comunità. Un&#x27;analisi dell&#x27;IIED osserva che l&#x27;attuazione è disomogenea e che servono riconoscimenti legali dei diritti collettivi sulla terra. Fonti: &lt;a href=&quot;https://www.iucn.org/sites/default/files/2023-09/30x30-target-framework.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IUCN, 30x30 target framework&lt;/a&gt;; &lt;a href=&quot;https://www.iied.org/achieving-30x30-vital-role-indigenous-traditional-territories-rights-governance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIED, Achieving 30x30&lt;/a&gt;. Non è citato nelle slide, ma è lo sfondo normativo in cui si colloca la domanda “chi paga?”.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Case study 9&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Perché una politica di conservazione può essere “sostenibile” e allo stesso tempo ingiusta?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Perché può tutelare l&#x27;ecosistema ma riprodurre &lt;em&gt;unequal control over land and resources&lt;/em&gt;: chi decide (stati, finanziatori, spesso del Nord) non coincide con chi sopporta i costi (comunità locali che perdono accesso a terra, pesca, raccolta).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Cosa mostra e cosa &lt;em&gt;non&lt;/em&gt; mostra la mappa WDPA?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Mostra la distribuzione di aree protette terrestri e marine (UNEP-WCMC e IUCN, 2021). Non mostra chi le governa, se sono efficaci, né quali diritti abbiano le popolazioni che ci vivono.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Quali tre elementi la slide chiede di collegare alla tutela della biodiversità?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Rights, livelihoods and legitimacy&lt;/em&gt;: diritti, mezzi di sussistenza, legittimità.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sla&quot; id=&quot;ai&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 10 · Technology and power&lt;/div&gt;
  &lt;h2&gt;L&#x27;AI e l&#x27;environmental governance gap&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 15&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“AI is both an infrastructure challenge and a governance challenge.”&lt;/p&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;INPUTS&lt;/th&gt;&lt;td&gt;Data, minerals, energy and water&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;SYSTEMS&lt;/th&gt;&lt;td&gt;Data centres, models and supply chains&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;EFFECTS&lt;/th&gt;&lt;td&gt;Environmental monitoring, decision-making and surveillance&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;GOVERNANCE&lt;/th&gt;&lt;td&gt;Who sets rules and who is accountable?&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;p&gt;&lt;strong&gt;“The geopolitics of AI sits under the hype: infrastructures, standards, data and unequal capacity.”&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;Un &lt;dfn&gt;governance gap&lt;/dfn&gt; (vuoto di governance) è la distanza tra ciò che una tecnologia già fa nel mondo e la capacità delle istituzioni di stabilire regole, controlli e responsabilità su di essa. “Environmental” qui ha due sensi: l&#x27;AI ha un impatto ambientale (consuma energia, acqua, minerali) e viene usata per governare l&#x27;ambiente (monitoraggio, previsioni, gestione di reti).&lt;/p&gt;

  &lt;h3&gt;Le quattro catene dell&#x27;AI, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Inputs&lt;/span&gt;
      &lt;h4&gt;Data, minerals, energy and water&lt;/h4&gt;
      &lt;p&gt;L&#x27;AI sembra immateriale, ma poggia su risorse fisiche: dati (spesso raccolti da persone che non ne controllano l&#x27;uso), &lt;em&gt;minerals&lt;/em&gt; per i chip e l&#x27;hardware (rame, litio, terre rare, gallio…), elettricità per addestrare e far girare i modelli, acqua per raffreddare i data centre.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Lettura politica:&lt;/strong&gt; chi controlla miniere, raffinazione, reti elettriche e bacini idrici controlla un pezzo dell&#x27;AI. È lo stesso tema delle &lt;em&gt;new dependencies&lt;/em&gt; della sintesi finale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Systems&lt;/span&gt;
      &lt;h4&gt;Data centres, models and supply chains&lt;/h4&gt;
      &lt;p&gt;I &lt;em&gt;data centres&lt;/em&gt; (centri di elaborazione dati) sono infrastrutture concentrate in pochi paesi e in poche imprese; i &lt;em&gt;models&lt;/em&gt; sono addestrati da pochi attori con enormi capitali; le &lt;em&gt;supply chains&lt;/em&gt; (catene di fornitura) dei chip attraversano molti stati, con passaggi critici in pochissimi luoghi.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Lettura politica:&lt;/strong&gt; concentrazione = potere e vulnerabilità. Un blocco all&#x27;export o un conflitto in un nodo della catena si propaga a tutto il sistema.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Effects&lt;/span&gt;
      &lt;h4&gt;Environmental monitoring, decision-making and surveillance&lt;/h4&gt;
      &lt;p&gt;Gli stessi strumenti hanno effetti ambivalenti: l&#x27;AI aiuta a vedere deforestazione, incendi, emissioni, siccità (&lt;em&gt;monitoring&lt;/em&gt;); supporta o sostituisce decisioni su reti idriche ed energetiche (&lt;em&gt;decision-making&lt;/em&gt;); ma può anche servire a controllare persone e territori (&lt;em&gt;surveillance&lt;/em&gt;, sorveglianza).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Lettura politica:&lt;/strong&gt; la stessa immagine satellitare può proteggere una foresta o identificare chi vi abita senza titolo legale (collegamento con il &lt;a href=&quot;#bio&quot;&gt;caso 9&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Governance&lt;/span&gt;
      &lt;h4&gt;Who sets rules and who is accountable?&lt;/h4&gt;
      &lt;p&gt;Chi scrive le regole (stati, unioni regionali, imprese tramite standard tecnici, organismi internazionali)? E chi risponde quando un sistema sbaglia? La &lt;dfn&gt;accountability&lt;/dfn&gt; (rendicontabilità: dover rendere conto e subire conseguenze) è il punto più debole: tra sviluppatore, fornitore, utilizzatore pubblico e operatore la responsabilità si diluisce.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Lettura politica:&lt;/strong&gt; &lt;em&gt;standards&lt;/em&gt; e &lt;em&gt;unequal capacity&lt;/em&gt;: chi fissa gli standard tecnici esporta le proprie regole; chi non ha capacità tecniche e finanziarie le subisce.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;L&#x27;immagine AIGN: quando le macchine acquistano autorità&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 4 (immagine)&quot;&gt;
    &lt;p&gt;Copertina di &lt;em&gt;AI Governance Newsletter · Issue #35&lt;/em&gt;, Patrick Upmann, 22 settembre 2026: &lt;strong&gt;“The AI Governance Gap — When Machines Gain Authority Over Critical Systems”&lt;/strong&gt;. Sottotitolo: da un workshop di ricerca sostenuto dalla NATO in Armenia alla sfida globale di governare l&#x27;AI autonoma nelle &lt;em&gt;critical infrastructures&lt;/em&gt;. Al centro un ciclo: &lt;em&gt;Detect · Assess · Recommend · Act · Account&lt;/em&gt;. In basso: &lt;em&gt;Secure infrastructure · Govern authority · Strengthen accountability · Enable evidence · Build a safer tomorrow&lt;/em&gt;. Ai lati: “Human responsibility remains essential” e “Intelligence is not permission”. Sullo sfondo: diga, rete elettrica, pale eoliche, città, aeroporto, ferrovia.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Le &lt;dfn&gt;critical infrastructures&lt;/dfn&gt; (infrastrutture critiche) sono i sistemi la cui interruzione colpisce la sicurezza e la vita di una società: energia, acqua, trasporti, telecomunicazioni, sanità. Clicca le fasi del ciclo per capire dove si apre il &lt;em&gt;gap&lt;/em&gt;.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 560 380&quot; aria-label=&quot;Ciclo Detect, Assess, Recommend, Act, Account&quot;&gt;
    &lt;circle cx=&quot;280&quot; cy=&quot;190&quot; r=&quot;120&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;10&quot;/&gt;
    &lt;text x=&quot;280&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;“Intelligence is&lt;/text&gt;
    &lt;text x=&quot;280&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;not permission”&lt;/text&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;
      &lt;g data-info=&quot;Il sistema rileva un&#x27;anomalia (es. un calo di pressione in una rete idrica, un picco di domanda elettrica). È il campo in cui l&#x27;AI è più utile e meno controversa.&quot; data-title=&quot;Detect&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;280&quot; cy=&quot;70&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;Detect&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;Valuta la gravità e le cause. Qui entrano i dati di addestramento: se sono parziali, la valutazione può sottostimare i rischi per alcune aree o gruppi.&quot; data-title=&quot;Assess&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;394&quot; cy=&quot;153&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;394&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot;&gt;Assess&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;Propone un&#x27;azione. Finché un essere umano sceglie, l&#x27;autorità resta umana; ma se nessuno ha tempo o competenze per contraddire la macchina, la raccomandazione diventa di fatto una decisione.&quot; data-title=&quot;Recommend&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;350&quot; cy=&quot;287&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot;&gt;Recommend&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;Il sistema agisce da solo (apre una paratoia, stacca un carico). È il passaggio in cui la macchina “guadagna autorità”: il cuore del governance gap. “Intelligence is not permission”: saper agire non equivale ad avere il diritto di farlo.&quot; data-title=&quot;Act&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;287&quot; r=&quot;40&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot;&gt;Act&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;Qualcuno deve rendere conto dell&#x27;azione: tracciabilità (enable evidence), responsabilità chiara (strengthen accountability), possibilità di ricorso. Se questa fase manca, il ciclo resta aperto e nessuno è responsabile.&quot; data-title=&quot;Account&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;166&quot; cy=&quot;153&quot; r=&quot;40&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;166&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot;&gt;Account&lt;/text&gt;&lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption id=&quot;cycOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Clicca una fase del ciclo.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Grafico: perché si apre il gap&lt;/h3&gt;
  &lt;p&gt;Modello didattico (non dati reali): la capacità tecnologica cresce in modo continuo e accelerato; le regole si aggiornano “a gradini”, con un ritardo. L&#x27;area colorata è il &lt;em&gt;governance gap&lt;/em&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; id=&quot;gapSvg&quot; aria-label=&quot;Grafico del governance gap&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;580&quot; y2=&quot;260&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;260&quot; stroke=&quot;var(--muted)&quot;/&gt;
      &lt;text x=&quot;315&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;tempo (anni)&lt;/text&gt;
      &lt;text x=&quot;18&quot; y=&quot;140&quot; font-size=&quot;13&quot; transform=&quot;rotate(-90 18 140)&quot; text-anchor=&quot;middle&quot;&gt;capacità / copertura&lt;/text&gt;
      &lt;path id=&quot;gapArea&quot; fill=&quot;var(--bri)&quot; fill-opacity=&quot;.22&quot;/&gt;
      &lt;path id=&quot;gapTech&quot; fill=&quot;none&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;path id=&quot;gapRule&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g font-size=&quot;13&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;30&quot; width=&quot;14&quot; height=&quot;4&quot; fill=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;36&quot;&gt;tecnologia&lt;/text&gt;
      &lt;rect x=&quot;70&quot; y=&quot;50&quot; width=&quot;14&quot; height=&quot;4&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;56&quot;&gt;regole e istituzioni&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;label class=&quot;rl&quot; for=&quot;gapG&quot;&gt;Velocità della tecnologia: &lt;span class=&quot;out&quot; id=&quot;gapGo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;gapG&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;gapL&quot;&gt;Ritardo istituzionale tra un aggiornamento delle regole e l&#x27;altro: &lt;span class=&quot;out&quot; id=&quot;gapLo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;gapL&quot; min=&quot;1&quot; max=&quot;6&quot; value=&quot;3&quot;&gt;
    &lt;p&gt;Gap medio (indice): &lt;span class=&quot;out&quot; id=&quot;gapV&quot;&gt;&lt;/span&gt;. &lt;span class=&quot;muted small&quot;&gt;Prova: con ritardo minimo il gap quasi scompare, con tecnologia veloce si allarga anche se le istituzioni “lavorano”.&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var g=document.getElementById(&#x27;gapG&#x27;),l=document.getElementById(&#x27;gapL&#x27;);
    function draw(){var k=.12+(+g.value)*.035,L=+l.value,N=20,max=Math.exp(k*N)-1,pts=[],rp=[],sum=0;
      function T(t){return (Math.exp(k*t)-1)/max}
      function X(t){return 50+t*26.5}function Y(v){return 260-v*230}
      for(var i=0;i&lt;=200;i++){var t=i/10,rr=T(Math.max(0,Math.floor(t/L)*L-L));
        pts.push(X(t)+&#x27;,&#x27;+Y(T(t)));rp.push(X(t)+&#x27;,&#x27;+Y(rr));sum+=T(t)-rr;}
      document.getElementById(&#x27;gapTech&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+pts.join(&#x27; L&#x27;));
      document.getElementById(&#x27;gapRule&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+rp.join(&#x27; L&#x27;));
      document.getElementById(&#x27;gapArea&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+pts.join(&#x27; L&#x27;)+&#x27; L&#x27;+rp.slice().reverse().join(&#x27; L&#x27;)+&#x27; Z&#x27;);
      document.getElementById(&#x27;gapGo&#x27;).textContent=[&#x27;&#x27;,&#x27;molto lenta&#x27;,&#x27;lenta&#x27;,&#x27;lenta&#x27;,&#x27;moderata&#x27;,&#x27;moderata&#x27;,&#x27;sostenuta&#x27;,&#x27;sostenuta&#x27;,&#x27;rapida&#x27;,&#x27;rapida&#x27;,&#x27;esplosiva&#x27;][g.value];
      document.getElementById(&#x27;gapLo&#x27;).textContent=L+(L&gt;1?&#x27; anni&#x27;:&#x27; anno&#x27;);
      document.getElementById(&#x27;gapV&#x27;).textContent=Math.round(sum/201*100);}
    g.addEventListener(&#x27;input&#x27;,draw);l.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;details&gt;&lt;summary&gt;Ciò che la slide dà per scontato: “geopolitics under the hype”&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;L&#x27;&lt;em&gt;hype&lt;/em&gt; (entusiasmo mediatico) parla di modelli sempre più intelligenti. La slide sposta lo sguardo sotto: &lt;strong&gt;infrastructures&lt;/strong&gt; (chi possiede data centre, reti, chip), &lt;strong&gt;standards&lt;/strong&gt; (chi definisce le norme tecniche e quindi cosa è “sicuro” o “conforme”), &lt;strong&gt;data&lt;/strong&gt; (chi raccoglie e possiede i dati), &lt;strong&gt;unequal capacity&lt;/strong&gt; (molti paesi non hanno risorse per sviluppare, verificare o regolare l&#x27;AI). È geopolitica nel senso pieno: competizione tra stati e blocchi per il controllo di risorse e regole.&lt;/p&gt;
    &lt;p&gt;Esempio di regolazione (non citato nelle slide): l&#x27;Unione europea ha adottato l&#x27;&lt;em&gt;AI Act&lt;/em&gt;, Regolamento (UE) 2024/1689, che classifica i sistemi per livello di rischio e tratta come “ad alto rischio” anche quelli usati nella gestione di infrastrutture critiche. Testo: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2024/1689/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; &lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Case study 10&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. In che senso l&#x27;AI è una “infrastructure challenge”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Perché dipende da input materiali (dati, minerali, energia, acqua) e da sistemi fisici concentrati (data centre, catene di fornitura): chi li controlla ha potere, chi ne dipende è vulnerabile.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Cosa significa “Intelligence is not permission”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Che la capacità tecnica di un sistema di agire su un&#x27;infrastruttura critica non gli conferisce legittimità a farlo: l&#x27;autorità e la responsabilità devono restare attribuite a esseri umani e istituzioni che ne rispondono (&lt;em&gt;Human responsibility remains essential&lt;/em&gt;).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Elenca i quattro elementi della “geopolitics of AI” secondo la slide.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Infrastructures, standards, data, unequal capacity.&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part och&quot; id=&quot;digital&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 11 · Cyberspace and digital identity&lt;/div&gt;
  &lt;h2&gt;Spazi digitali: regolare oltre i confini&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 16&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Digital systems cross borders faster than political institutions can regulate them.”&lt;/p&gt;
    &lt;div class=&quot;grid g2&quot;&gt;
      &lt;div&gt;&lt;strong&gt;The problem.&lt;/strong&gt; Digital personas move across jurisdictions. Platforms, states and users do not share the same rules or responsibilities.&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;The geopolitical question.&lt;/strong&gt; Can transnational regulation protect rights while preserving room for democratic governance and technological innovation?&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;“Data Sovereignty refers to the set of obligations and rights established by a series of conventions, rules and laws on the ownership, access, processing and storage of personal data.”&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;I concetti chiave&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Digital persona&lt;/h4&gt;&lt;p&gt;L&#x27;identità digitale di una persona: account, profili, dati di navigazione, pagamenti, posizione. Non sta in un posto solo: viene copiata e trattata in server di paesi diversi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jurisdiction&lt;/h4&gt;&lt;p&gt;La &lt;dfn&gt;jurisdiction&lt;/dfn&gt; (giurisdizione) è l&#x27;ambito territoriale in cui un&#x27;autorità può fare e applicare le leggi. Nel digitale si sovrappongono la giurisdizione dell&#x27;utente, della sede dell&#x27;impresa e del luogo in cui stanno i server.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Transnational regulation&lt;/h4&gt;&lt;p&gt;Regole che valgono oltre i confini di uno stato: accordi internazionali, norme regionali (come quelle UE) o leggi nazionali con effetto extraterritoriale, cioè applicate anche a imprese straniere che trattano dati di residenti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Data sovereignty&lt;/h4&gt;&lt;p&gt;Nella definizione della slide è un &lt;em&gt;insieme di obblighi e diritti&lt;/em&gt; su quattro operazioni: &lt;em&gt;ownership&lt;/em&gt; (proprietà), &lt;em&gt;access&lt;/em&gt; (accesso), &lt;em&gt;processing&lt;/em&gt; (trattamento), &lt;em&gt;storage&lt;/em&gt; (conservazione) dei dati personali. Non è solo “lo stato controlla i dati”: è chi ha diritti e chi ha doveri su ciascuna operazione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il viaggio di un dato, passo per passo&lt;/h3&gt;
  &lt;p&gt;Esempio ipotetico costruito per capire “digital personas move across jurisdictions”.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 640 170&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Utente&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Italia&lt;/text&gt;
      &lt;rect x=&quot;175&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Piattaforma&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;sede: paese X&lt;/text&gt;
      &lt;rect x=&quot;340&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Data centre&lt;/text&gt;&lt;text x=&quot;405&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;paese Y&lt;/text&gt;
      &lt;rect x=&quot;505&quot; y=&quot;40&quot; width=&quot;125&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot;/&gt;&lt;text x=&quot;567&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Fornitore AI&lt;/text&gt;&lt;text x=&quot;567&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;paese Z&lt;/text&gt;
    &lt;/g&gt;
    &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M140,75 L172,75&quot;/&gt;&lt;path d=&quot;M305,75 L337,75&quot;/&gt;&lt;path d=&quot;M470,75 L502,75&quot;/&gt;&lt;/g&gt;
    &lt;text x=&quot;320&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;4 luoghi · almeno 4 ordinamenti giuridici · chi è responsabile?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Utente&lt;/span&gt;&lt;p&gt;Una studentessa in Italia carica foto e messaggi su un social network. Per lei valgono le leggi italiane ed europee sulla protezione dei dati: ha diritti di accesso, rettifica, cancellazione. Ma non sa dove finiscano fisicamente i suoi dati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Piattaforma&lt;/span&gt;&lt;p&gt;L&#x27;impresa ha sede in un altro paese, con altre regole e altri obblighi verso le autorità locali (che possono chiedere accesso ai dati per motivi di sicurezza). Le regole della piattaforma (termini d&#x27;uso) sono un terzo livello, privato, che si sovrappone alle leggi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Data centre&lt;/span&gt;&lt;p&gt;I dati sono conservati (&lt;em&gt;storage&lt;/em&gt;) in un terzo paese, magari per costi energetici o di raffreddamento (collegamento con gli &lt;em&gt;inputs&lt;/em&gt; del &lt;a href=&quot;#ai&quot;&gt;caso 10&lt;/a&gt;). Alcuni stati impongono la &lt;em&gt;data localisation&lt;/em&gt;, cioè che i dati dei propri cittadini restino sul territorio nazionale: è una forma “dura” di sovranità dei dati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Trattamento&lt;/span&gt;&lt;p&gt;I dati vengono usati (&lt;em&gt;processing&lt;/em&gt;) per addestrare un modello da un fornitore in un quarto paese. Se qualcosa va storto (profilazione, fuga di dati), quale autorità interviene? Ecco il problema della slide: “platforms, states and users do not share the same rules or responsibilities”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La mappa delle leggi sulla protezione dei dati&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide successiva&quot;&gt;
    &lt;p&gt;Mappa “Data Protection Laws around the world”, fonte © 2023 DLA Piper. Legenda circolare “Regulation &amp;amp; Enforcement” con quattro livelli: &lt;em&gt;Heavy&lt;/em&gt; (rosso), &lt;em&gt;Robust&lt;/em&gt; (arancio), &lt;em&gt;Moderate&lt;/em&gt; (giallo), &lt;em&gt;Limited&lt;/em&gt; (verde acqua); in grigio i paesi senza dati.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;La classificazione combina due cose diverse: quanto è severa la legge (&lt;em&gt;regulation&lt;/em&gt;) e quanto viene fatta rispettare (&lt;em&gt;enforcement&lt;/em&gt;, applicazione effettiva con controlli e sanzioni). Leggi forti senza enforcement contano poco.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Heavy&lt;/button&gt;&lt;button&gt;Robust&lt;/button&gt;&lt;button&gt;Moderate&lt;/button&gt;&lt;button&gt;Limited&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;Regole estese e applicate con forza. Sulla mappa 2023 appaiono in rosso, tra gli altri, Stati Uniti, Canada, Messico, gran parte dell&#x27;Unione europea, Regno Unito, Cina, Corea del Sud e Australia.&lt;/p&gt;&lt;p&gt;Nota: sistemi molto diversi tra loro (UE, USA, Cina) finiscono nella stessa categoria. “Heavy” misura l&#x27;intensità, non il modello politico: in un caso prevale la tutela dell&#x27;individuo, in un altro il controllo statale sui dati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Regolazione solida con enforcement un po&#x27; meno intenso. Sulla mappa: ad esempio Argentina, Giappone, Nuova Zelanda, Indonesia, Egitto, alcuni stati del Sud-est asiatico.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Leggi presenti ma meno complete o applicate in modo discontinuo. Sulla mappa: ad esempio Russia, Brasile, molti paesi dell&#x27;Africa subsahariana e del Golfo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Regolazione minima o recente, poca applicazione. Sulla mappa: ad esempio India, varie repubbliche dell&#x27;Asia centrale, parti dell&#x27;Africa orientale e australe, alcuni paesi andini.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Le attribuzioni paese per paese sono lette dalla figura 2023 e vanno verificate sulla mappa aggiornata di DLA Piper (vedi &lt;a href=&quot;#refs&quot;&gt;Per approfondire&lt;/a&gt;): le leggi cambiano spesso.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il trilemma della domanda geopolitica&lt;/h3&gt;
  &lt;p&gt;La domanda della slide chiede di tenere insieme tre obiettivi che tirano in direzioni diverse:&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 520 300&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;polygon points=&quot;260,30 470,260 50,260&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;260&quot; y=&quot;22&quot;&gt;Protect rights&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;285&quot;&gt;Technological innovation&lt;/text&gt;
      &lt;text x=&quot;55&quot; y=&quot;285&quot;&gt;Democratic governance&lt;/text&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;
      &lt;text x=&quot;400&quot; y=&quot;140&quot; style=&quot;fill:var(--muted)&quot;&gt;regole troppo rigide&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;156&quot; style=&quot;fill:var(--muted)&quot;&gt;frenano l&#x27;innovazione&lt;/text&gt;
      &lt;text x=&quot;115&quot; y=&quot;140&quot; style=&quot;fill:var(--muted)&quot;&gt;regole decise fuori&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;156&quot; style=&quot;fill:var(--muted)&quot;&gt;dai parlamenti nazionali&lt;/text&gt;
      &lt;text x=&quot;260&quot; y=&quot;240&quot; style=&quot;fill:var(--muted)&quot;&gt;innovazione veloce che sfugge al controllo democratico&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;260&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;transnational regulation?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Schema interpretativo (non nelle slide): ogni lato del triangolo è una tensione tra due obiettivi.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Esempio di regolazione transnazionale.&lt;/strong&gt; Il Regolamento generale sulla protezione dei dati dell&#x27;UE (GDPR, Regolamento (UE) 2016/679) si applica anche a imprese fuori dall&#x27;UE che trattano dati di persone che si trovano nell&#x27;UE: è l&#x27;esempio classico di norma regionale con effetti extraterritoriali. Non è citato nelle slide. Testo: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2016/679/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Case study 11&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Quali quattro operazioni sui dati compaiono nella definizione di data sovereignty?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Ownership, access, processing, storage&lt;/em&gt; (proprietà, accesso, trattamento, conservazione) dei dati personali, regolate da convenzioni, regole e leggi che stabiliscono obblighi e diritti.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Perché nella mappa DLA Piper conta sia “regulation” sia “enforcement”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Perché una legge può essere severa sulla carta ma non applicata: il livello reale di protezione dipende dalla combinazione di regole e capacità/volontà di farle rispettare.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Qual è il “problem” della slide in una frase?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Le identità digitali attraversano più giurisdizioni, e piattaforme, stati e utenti non condividono le stesse regole né le stesse responsabilità: i sistemi digitali attraversano i confini più in fretta di quanto le istituzioni riescano a regolarli.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part bri&quot; id=&quot;indig&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 12 · Planetary equity&lt;/div&gt;
  &lt;h2&gt;Prospettive indigene: un&#x27;altra idea di sostenibilità&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 18&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Sustainability changes when the object of governance is not only the economy, but relationships among people, land and non-human life.”&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;: local and intergenerational knowledge · &lt;strong&gt;Authority&lt;/strong&gt;: community-led decision-making · &lt;strong&gt;Justice&lt;/strong&gt;: recognition of rights and histories · &lt;strong&gt;Resilience&lt;/strong&gt;: adaptation rooted in place.&lt;/p&gt;
    &lt;p&gt;&lt;em&gt;“Planetary equity requires more than adding local voices to existing institutions. It can require changing the institutions themselves.”&lt;/em&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;La &lt;dfn&gt;planetary equity&lt;/dfn&gt; (equità planetaria) è l&#x27;idea che la giustizia ambientale vada pensata a scala globale e tra generazioni: chi ha causato i problemi, chi ne subisce gli effetti, chi ha voce nelle soluzioni. La slide sposta l&#x27;&lt;em&gt;oggetto della governance&lt;/em&gt;: non si governa solo “l&#x27;economia” (crescita, produzione, emissioni) ma le &lt;strong&gt;relazioni&lt;/strong&gt; tra persone, terra e vita non umana.&lt;/p&gt;

  &lt;div class=&quot;grid g4&quot;&gt;
    &lt;div class=&quot;card sal&quot;&gt;&lt;h4&gt;Knowledge&lt;/h4&gt;&lt;p&gt;Sapere locale e intergenerazionale: osservazioni accumulate per secoli su un luogo preciso, trasmesse oralmente e nella pratica.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card sla&quot;&gt;&lt;h4&gt;Authority&lt;/h4&gt;&lt;p&gt;Decisioni prese dalla comunità (&lt;em&gt;community-led&lt;/em&gt;), non solo “consultata” da altri.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card och&quot;&gt;&lt;h4&gt;Justice&lt;/h4&gt;&lt;p&gt;Riconoscere diritti &lt;em&gt;e&lt;/em&gt; storie: espropri, colonizzazione, esclusioni passate pesano sulle scelte di oggi.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Resilience&lt;/h4&gt;&lt;p&gt;Capacità di adattarsi radicata nel luogo (&lt;em&gt;rooted in place&lt;/em&gt;), non soluzioni standard importate.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details open&gt;&lt;summary&gt;“Adding voices” o “changing institutions”? La differenza chiave&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Aggiungere voci locali&lt;/th&gt;&lt;th&gt;Cambiare le istituzioni&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Chi decide&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;L&#x27;istituzione esistente, dopo aver ascoltato&lt;/td&gt;&lt;td&gt;Anche la comunità, con poteri propri&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Sapere&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Il sapere locale è un “input” tra tanti&lt;/td&gt;&lt;td&gt;Il sapere locale è una base riconosciuta per la decisione&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Esempio&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Consultazione pubblica sul piano di un parco&lt;/td&gt;&lt;td&gt;Co-gestione o gestione indigena con diritto di veto o consenso&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Rischio&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Partecipazione di facciata (&lt;em&gt;tokenism&lt;/em&gt;)&lt;/td&gt;&lt;td&gt;Conflitti di competenza con lo stato, tempi lunghi&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;L&#x27;Indigenous Systems Framework&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 8 (figura)&quot;&gt;
    &lt;p&gt;“Indigenous Systems Framework — Analytical Lenses for Interpreting Indigenous Systems”. Fonte: Humanculture / Stephanie Zabriskie. Al centro: &lt;em&gt;Indigenous Systems of Life&lt;/em&gt; con cinque valori: &lt;em&gt;Relationality, Kinship Responsibility, Spiritual Relationship to Land, Intergenerational Responsibility, Reciprocity&lt;/em&gt;. Attorno, otto lenti analitiche. A destra: &lt;strong&gt;Legitimacy versus Legality → Empowerment&lt;/strong&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Clicca un elemento della ruota per una spiegazione. Il cerchio interno indica i &lt;em&gt;valori&lt;/em&gt; che tengono insieme il sistema; l&#x27;anello esterno indica gli &lt;em&gt;ambiti&lt;/em&gt; in cui osservarli (le “lenti” con cui analizzare un caso concreto).&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 460 460&quot; class=&quot;wheel&quot; id=&quot;wheel&quot; aria-label=&quot;Ruota dell&#x27;Indigenous Systems Framework&quot;&gt;&lt;/svg&gt;
  &lt;figcaption id=&quot;wheelOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Clicca un settore o un valore.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;script&gt;
  (function(){
    var outer=[[&#x27;Governance &amp; Decision-Making&#x27;,&#x27;come la comunità prende decisioni collettive, con quali istituzioni (consigli, anziani, assemblee) e con quale legittimità.&#x27;],
      [&#x27;Ecological Stewardship&#x27;,&#x27;la cura attiva dell\&#x27;ecosistema: non lasciare la natura “intatta”, ma gestirla con regole di prelievo, fuoco, rotazione.&#x27;],
      [&#x27;Land &amp; Resource Systems&#x27;,&#x27;regimi di accesso e uso della terra, spesso collettivi e consuetudinari, che il diritto statale non sempre riconosce.&#x27;],
      [&#x27;Knowledge &amp; Learning&#x27;,&#x27;come il sapere viene prodotto e trasmesso: oralità, pratica, apprendistato tra generazioni.&#x27;],
      [&#x27;Livelihood &amp; Production&#x27;,&#x27;i mezzi di sussistenza: pastorizia, agricoltura, pesca, raccolta, artigianato. Legame con i food systems del caso 9.&#x27;],
      [&#x27;Climate Adaptation&#x27;,&#x27;strategie per adattarsi a siccità, alluvioni, cambi stagionali, basate su osservazione locale di lungo periodo.&#x27;],
      [&#x27;Cultural Continuity&#x27;,&#x27;lingua, riti, memoria: la cultura come infrastruttura sociale che rende possibili le altre funzioni.&#x27;],
      [&#x27;Health &amp; Wellbeing&#x27;,&#x27;salute intesa in modo ampio, legata al territorio, al cibo, alle relazioni comunitarie.&#x27;]];
    var inner=[[&#x27;Relationality&#x27;,&#x27;tutto è definito dalle relazioni (persone, terra, specie), non da individui isolati.&#x27;],
      [&#x27;Kinship Responsibility&#x27;,&#x27;obblighi verso la parentela, estesa anche a terra e non-umani: la natura come parente, non come risorsa.&#x27;],
      [&#x27;Spiritual Relationship to Land&#x27;,&#x27;la terra ha un valore spirituale e identitario, non solo economico: per questo non è sempre “compensabile” con denaro.&#x27;],
      [&#x27;Intergenerational Responsibility&#x27;,&#x27;le decisioni rispondono anche alle generazioni future e a quelle passate.&#x27;],
      [&#x27;Reciprocity&#x27;,&#x27;prendere implica restituire: un principio di scambio equilibrato con la comunità e con l\&#x27;ambiente.&#x27;]];
    var s=&#x27;&#x27;,cx=230,cy=230,R1=220,R0=140,n=outer.length;
    function p(r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
    outer.forEach(function(o,i){var a0=-Math.PI/2-Math.PI/4+i*2*Math.PI/n+.01,a1=a0+2*Math.PI/n-.02,
      A=p(R1,a0),B=p(R1,a1),C=p(R0,a1),D=p(R0,a0),m=(a0+a1)/2,T=p((R1+R0)/2,m),
      h=[150,165,180,210,230,200,175,155][i],L=[48,44,40,42,44,46,50,52][i];
      s+=&#x27;&lt;g data-title=&quot;&#x27;+o[0]+&#x27;&quot; data-info=&quot;&#x27;+o[1].replace(/&quot;/g,&#x27;&amp;quot;&#x27;)+&#x27;&quot; data-target=&quot;wheelOut&quot;&gt;&lt;path d=&quot;M&#x27;+A+&#x27; A&#x27;+R1+&#x27;,&#x27;+R1+&#x27; 0 0 1 &#x27;+B+&#x27; L&#x27;+C+&#x27; A&#x27;+R0+&#x27;,&#x27;+R0+&#x27; 0 0 0 &#x27;+D+&#x27; Z&quot; fill=&quot;oklch(&#x27;+L+&#x27;% 0.07 &#x27;+h+&#x27;)&quot;/&gt;&#x27;;
      var w=o[0].split(&#x27; &amp; &#x27;);s+=&#x27;&lt;text text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:#fff;pointer-events:none&quot;&gt;&#x27;;
      w.forEach(function(t,j){s+=&#x27;&lt;tspan x=&quot;&#x27;+T[0]+&#x27;&quot; y=&quot;&#x27;+(T[1]+(j-(w.length-1)/2)*15+4)+&#x27;&quot;&gt;&#x27;+t+(j&lt;w.length-1?&#x27; &amp;amp;&#x27;:&#x27;&#x27;)+&#x27;&lt;/tspan&gt;&#x27;});s+=&#x27;&lt;/text&gt;&lt;/g&gt;&#x27;;});
    s+=&#x27;&lt;circle cx=&quot;230&quot; cy=&quot;230&quot; r=&quot;134&quot; fill=&quot;oklch(58% 0.11 75)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:#fff&quot;&gt;Indigenous&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;243&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:#fff&quot;&gt;Systems of Life&lt;/text&gt;&#x27;;
    inner.forEach(function(o,i){var a=-Math.PI/2+i*2*Math.PI/5,c=p(88,a),w=o[0].split(&#x27; &#x27;);
      s+=&#x27;&lt;g data-title=&quot;&#x27;+o[0]+&#x27;&quot; data-info=&quot;&#x27;+o[1].replace(/&quot;/g,&#x27;&amp;quot;&#x27;)+&#x27;&quot; data-target=&quot;wheelOut&quot;&gt;&lt;circle class=&quot;seg&quot; cx=&quot;&#x27;+c[0]+&#x27;&quot; cy=&quot;&#x27;+c[1]+&#x27;&quot; r=&quot;38&quot; fill=&quot;oklch(36% 0.06 60)&quot;/&gt;&lt;text text-anchor=&quot;middle&quot; font-size=&quot;10&quot; style=&quot;fill:#fff;pointer-events:none&quot;&gt;&#x27;;
      var lines=w.length&gt;2?[w.slice(0,Math.ceil(w.length/2)).join(&#x27; &#x27;),w.slice(Math.ceil(w.length/2)).join(&#x27; &#x27;)]:w;
      lines.forEach(function(t,j){s+=&#x27;&lt;tspan x=&quot;&#x27;+c[0]+&#x27;&quot; y=&quot;&#x27;+(c[1]+(j-(lines.length-1)/2)*12+3)+&#x27;&quot;&gt;&#x27;+t+&#x27;&lt;/tspan&gt;&#x27;});s+=&#x27;&lt;/text&gt;&lt;/g&gt;&#x27;;});
    document.getElementById(&#x27;wheel&#x27;).innerHTML=s;
  })();
  &lt;/script&gt;

  &lt;h3&gt;Legitimacy versus legality → empowerment&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Legality&lt;/button&gt;&lt;button&gt;Legitimacy&lt;/button&gt;&lt;button&gt;Empowerment&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;La &lt;dfn&gt;legality&lt;/dfn&gt; (legalità) è la conformità al diritto formale dello stato: titoli di proprietà, concessioni, autorizzazioni. Una miniera o un parco possono essere perfettamente legali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;La &lt;dfn&gt;legitimacy&lt;/dfn&gt; (legittimità) è il riconoscimento che un potere o una regola sono giusti da parte di chi li subisce. Una comunità può governare un territorio da secoli con piena legittimità ma senza titolo legale; al contrario una concessione legale può essere percepita come illegittima.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;L&#x27;&lt;dfn&gt;empowerment&lt;/dfn&gt; (rafforzamento del potere di agire) è la freccia della slide: colmare la distanza tra legittimità e legalità dando alle comunità diritti, risorse e voce effettiva, cioè trasformando una legittimità di fatto in un potere riconosciuto. È il passaggio da “aggiungere voci” a “cambiare le istituzioni”.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 600 170&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;circle cx=&quot;210&quot; cy=&quot;80&quot; r=&quot;70&quot; fill=&quot;var(--sla)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--sla)&quot;/&gt;
    &lt;circle cx=&quot;330&quot; cy=&quot;80&quot; r=&quot;70&quot; fill=&quot;var(--bri)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--bri)&quot;/&gt;
    &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;84&quot;&gt;Legality&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;84&quot;&gt;Legitimacy&lt;/text&gt;
    &lt;text x=&quot;270&quot; y=&quot;78&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;regole&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;93&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;accettate&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M440,80 L500,80&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;text x=&quot;545&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--acc)&quot;&gt;Empowerment&lt;/text&gt;
    &lt;text x=&quot;270&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;L&#x27;obiettivo è allargare la zona in cui le regole sono sia legali sia legittime&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Norma di riferimento.&lt;/strong&gt; La &lt;em&gt;United Nations Declaration on the Rights of Indigenous Peoples&lt;/em&gt; (UNDRIP), adottata dall&#x27;Assemblea generale con la risoluzione 61/295 del 13 settembre 2007, prevede il &lt;em&gt;free, prior and informed consent&lt;/em&gt; (FPIC, consenso libero, preventivo e informato) per esempio prima di trasferimenti dalle terre (art. 10) e di misure legislative che riguardano i popoli indigeni (art. 19). È lo strumento giuridico più vicino all&#x27;idea di trasformare legittimità in legalità. Non è citata nelle slide. Testo: &lt;a href=&quot;https://www.justice.gc.ca/eng/declaration/decl_doc.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;riproduzione integrale (Department of Justice Canada)&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Case study 12&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Cosa cambia quando l&#x27;“oggetto della governance” non è solo l&#x27;economia?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Si governano le relazioni tra persone, terra e vita non umana: diventano centrali conoscenza locale, autorità comunitaria, giustizia (diritti e storie) e resilienza radicata nel luogo, non solo crescita ed efficienza.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Perché “aggiungere voci locali” può non bastare?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Perché se le istituzioni restano le stesse, chi decide resta lo stesso: la partecipazione rischia di essere consultiva o di facciata. La &lt;em&gt;planetary equity&lt;/em&gt; può richiedere di cambiare le istituzioni (poteri, regole, sedi decisionali).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Fai un esempio di situazione legale ma non legittima.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Una concessione mineraria o un&#x27;area protetta istituite secondo la legge statale su un territorio che una comunità governa da generazioni senza titolo formale e senza averle approvate.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part acc&quot; id=&quot;synth&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Cross-case synthesis&lt;/div&gt;
  &lt;h2&gt;Cosa hanno in comune i casi&lt;/h2&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 20&quot;&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Transitions redistribute power&lt;/strong&gt; — New infrastructures and resources create new dependencies&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Scale matters&lt;/strong&gt; — Local impacts are tied to global markets and institutions&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Justice is geopolitical&lt;/strong&gt; — Distribution of costs and benefits shapes cooperation&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Institutions lag behind change&lt;/strong&gt; — Rules remain fragmented while systems are connected&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Security is expanding&lt;/strong&gt; — Environmental change enters defence, finance and technology policy&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
  &lt;p&gt;Una &lt;dfn&gt;transition&lt;/dfn&gt; (transizione) è il passaggio da un sistema a un altro: energetica, digitale, ecologica. La tesi della lezione è che nessuna transizione è neutra: sposta potere, crea vincitori e perdenti. Clicca una cella per vedere come ogni principio si applica a ciascun caso.&lt;/p&gt;

  &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;matrix&quot;&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;9 · Biodiversità&lt;/th&gt;&lt;th&gt;10 · AI&lt;/th&gt;&lt;th&gt;11 · Digitale&lt;/th&gt;&lt;th&gt;12 · Indigeni&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;1 · Power&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Biodiversità&quot; data-info=&quot;Chi istituisce un&#x27;area protetta acquisisce controllo sul territorio; le comunità possono diventare dipendenti da agenzie o finanziatori esterni.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × AI&quot; data-info=&quot;Data centre, chip e minerali critici creano nuove dipendenze da pochi paesi e imprese.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Digitale&quot; data-info=&quot;Le piattaforme diventano attori quasi-statali: fissano regole (termini d&#x27;uso) per miliardi di persone.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Indigeni&quot; data-info=&quot;La transizione verde (es. miniere per batterie, nuovi parchi) può spostare potere lontano dalle comunità, oppure, con l&#x27;empowerment, verso di loro.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;2 · Scale&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Biodiversità&quot; data-info=&quot;Un obiettivo globale (es. 30% di aree protette) si traduce in confini concreti in villaggi specifici; i mercati globali del cibo spingono la conversione di habitat locali.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × AI&quot; data-info=&quot;Un modello addestrato altrove decide su una rete idrica locale; l&#x27;acqua usata da un data centre è sottratta a un bacino locale.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Digitale&quot; data-info=&quot;Il dato di un singolo utente circola su scala globale tra giurisdizioni diverse.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Indigeni&quot; data-info=&quot;La resilienza è “rooted in place”, ma le pressioni (clima, mercati, concessioni) arrivano da scala globale.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;3 · Justice&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Biodiversità&quot; data-info=&quot;Benefici globali, costi locali: la domanda “who bears the costs?” è il cuore del caso.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × AI&quot; data-info=&quot;Unequal capacity: chi non ha infrastrutture e competenze subisce standard decisi da altri.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Digitale&quot; data-info=&quot;La protezione dei dati varia da heavy a limited: lo stesso diritto vale molto o poco a seconda di dove si vive.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Indigeni&quot; data-info=&quot;Recognition of rights and histories: la giustizia include la riparazione delle esclusioni passate.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;4 · Lag&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Biodiversità&quot; data-info=&quot;Regimi di tutela frammentati per stato, mentre specie, fiumi e oceani sono connessi.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × AI&quot; data-info=&quot;Il governance gap: la tecnologia agisce già su infrastrutture critiche, le regole arrivano dopo.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Digitale&quot; data-info=&quot;“Digital systems cross borders faster than political institutions can regulate them.”&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Indigeni&quot; data-info=&quot;Le istituzioni statali non riconoscono forme di governo consuetudinarie: legittimità senza legalità.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;5 · Security&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Biodiversità&quot; data-info=&quot;Sicurezza alimentare e controllo delle risorse naturali diventano questioni strategiche.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × AI&quot; data-info=&quot;AI nelle infrastrutture critiche: tema di difesa (l&#x27;immagine AIGN cita un workshop sostenuto dalla NATO).&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Digitale&quot; data-info=&quot;Sovranità dei dati e localizzazione come strumenti di sicurezza nazionale.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Indigeni&quot; data-info=&quot;Sicurezza intesa come resilienza delle comunità a clima e pressioni esterne, non solo come difesa militare.&quot;&gt;vedi&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;mxOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Clicca una cella “vedi”.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;Le celle sono applicazioni ragionate dei principi ai casi, scritte per lo studio: la slide elenca solo i cinque principi.&lt;/p&gt;

  &lt;details&gt;&lt;summary&gt;Ciò che la slide dà per scontato: “security is expanding”&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Nella tradizione delle relazioni internazionali la &lt;em&gt;security&lt;/em&gt; era soprattutto militare. Il quinto punto descrive un allargamento: clima, risorse, tecnologia e finanza vengono trattati come questioni di sicurezza. Il rischio, discusso in letteratura come &lt;span class=&quot;term&quot;&gt;securitisation&lt;/span&gt; (securitizzazione: presentare un tema come minaccia esistenziale per giustificare misure straordinarie), è che l&#x27;ambiente venga gestito con logiche di emergenza e di difesa, riducendo trasparenza e partecipazione.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Sintesi&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Ricostruisci i cinque principi con la loro spiegazione.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Transitions redistribute power (nuove dipendenze) · Scale matters (locale legato a globale) · Justice is geopolitical (distribuzione di costi e benefici condiziona la cooperazione) · Institutions lag behind change (regole frammentate, sistemi connessi) · Security is expanding (l&#x27;ambiente entra in difesa, finanza, tecnologia).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Applica “institutions lag behind change” al caso 11.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;I dati attraversano giurisdizioni in tempo reale, mentre le leggi sulla protezione dei dati restano nazionali o regionali e molto diverse tra loro (mappa DLA Piper): regole frammentate, sistema connesso.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part acc&quot; id=&quot;coop&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;From diagnosis to collective action&lt;/div&gt;
  &lt;h2&gt;Il cooperation problem&lt;/h2&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 21&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Global challenges create shared exposure, but political incentives remain uneven.”&lt;/p&gt;
    &lt;div class=&quot;grid g2&quot;&gt;
      &lt;div&gt;&lt;strong&gt;WHY COOPERATION IS DIFFICULT&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Shared risks&lt;/li&gt;&lt;li&gt;Unequal responsibility&lt;/li&gt;&lt;li&gt;Different capacities&lt;/li&gt;&lt;li&gt;Competing time horizons&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;WHY COOPERATION REMAINS NECESSARY&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Fragmented institutions&lt;/li&gt;&lt;li&gt;Strategic rivalry&lt;/li&gt;&lt;li&gt;Short-term political pressure&lt;/li&gt;&lt;li&gt;Weak accountability&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;strong&gt;Attenzione alla lettura.&lt;/strong&gt; Così come sono impaginate, le due colonne sembrano poco coerenti con i titoli: &lt;em&gt;fragmented institutions&lt;/em&gt;, &lt;em&gt;strategic rivalry&lt;/em&gt;, &lt;em&gt;short-term pressure&lt;/em&gt; e &lt;em&gt;weak accountability&lt;/em&gt; sono tipicamente &lt;em&gt;ostacoli&lt;/em&gt; alla cooperazione, mentre i &lt;em&gt;shared risks&lt;/em&gt; sono la ragione per cui cooperare è necessario. È possibile che le etichette siano invertite o che la slide vada letta in modo più sottile (vedi sotto). Verificalo con il docente o con gli appunti della lezione.&lt;/div&gt;

  &lt;p&gt;&lt;dfn&gt;Collective action&lt;/dfn&gt; (azione collettiva) indica le situazioni in cui un risultato utile a tutti richiede il contributo di molti, ma ciascuno ha un incentivo a lasciare che contribuiscano gli altri (&lt;span class=&quot;term&quot;&gt;free riding&lt;/span&gt;, “viaggiare a sbafo”). Clima e biodiversità sono &lt;span class=&quot;term&quot;&gt;global public goods&lt;/span&gt; (beni pubblici globali): nessuno può essere escluso dai benefici, quindi pagare i costi conviene poco al singolo.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Shared exposure&lt;/button&gt;&lt;button&gt;Uneven incentives&lt;/button&gt;&lt;button&gt;Una lettura delle due colonne&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;Tutti sono esposti (&lt;em&gt;shared risks&lt;/em&gt;): ondate di calore, perdita di biodiversità, attacchi a infrastrutture digitali. Ma esposizione condivisa non significa uguale: i più poveri sono più vulnerabili.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Gli incentivi politici sono disuguali: &lt;em&gt;unequal responsibility&lt;/em&gt; (chi ha emesso o sfruttato di più), &lt;em&gt;different capacities&lt;/em&gt; (chi può pagare e innovare), &lt;em&gt;competing time horizons&lt;/em&gt; (i governi rispondono a cicli elettorali di pochi anni, i problemi ambientali si sviluppano su decenni).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Si può leggere la colonna di destra così: proprio perché le istituzioni sono frammentate, la rivalità è strategica, la politica è di breve periodo e l&#x27;accountability è debole, &lt;em&gt;nessun attore può risolvere da solo&lt;/em&gt; i problemi; quindi la cooperazione resta necessaria. La colonna di sinistra spiega perché è difficile: rischi condivisi ma responsabilità, capacità e orizzonti diversi rendono difficile accordarsi su chi fa cosa. È una lettura possibile, non indicata esplicitamente dalla slide.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Simulatore: il dilemma del bene pubblico&lt;/h3&gt;
  &lt;p&gt;Modello didattico classico (&lt;span class=&quot;term&quot;&gt;public goods game&lt;/span&gt;), non tratto dalle slide. Dieci paesi; chi coopera paga un costo; la somma dei contributi viene moltiplicata (il beneficio collettivo) e divisa tra &lt;em&gt;tutti&lt;/em&gt;, anche chi non ha pagato.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgK&quot;&gt;Paesi che cooperano: &lt;span class=&quot;out&quot; id=&quot;pgKo&quot;&gt;&lt;/span&gt; su 10&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgK&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgC&quot;&gt;Costo della cooperazione per paese: &lt;span class=&quot;out&quot; id=&quot;pgCo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgC&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgR&quot;&gt;Moltiplicatore del beneficio collettivo: &lt;span class=&quot;out&quot; id=&quot;pgRo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgR&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;.5&quot; value=&quot;3&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 190&quot; aria-label=&quot;Guadagni di chi coopera, di chi non coopera e del gruppo&quot;&gt;&lt;g id=&quot;pgBars&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;p id=&quot;pgTxt&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var k=document.getElementById(&#x27;pgK&#x27;),c=document.getElementById(&#x27;pgC&#x27;),r=document.getElementById(&#x27;pgR&#x27;),N=10;
    function draw(){var K=+k.value,C=+c.value,R=+r.value,share=K*C*R/N,coop=share-C,free=share,tot=K*coop+(N-K)*free,totAll=N*(C*R-C);
      document.getElementById(&#x27;pgKo&#x27;).textContent=K;document.getElementById(&#x27;pgCo&#x27;).textContent=C;document.getElementById(&#x27;pgRo&#x27;).textContent=&#x27;×&#x27;+R;
      var rows=[[&#x27;Chi coopera&#x27;,K?coop:null,&#x27;var(--sal)&#x27;],[&#x27;Chi non coopera&#x27;,K&lt;N?free:null,&#x27;var(--bri)&#x27;],[&#x27;Media del gruppo&#x27;,tot/N,&#x27;var(--sla)&#x27;],[&#x27;Media se tutti cooperano&#x27;,totAll/N,&#x27;var(--acc)&#x27;]];
      var mx=Math.max(10,Math.abs(totAll/N),free,Math.abs(coop)),z=330,s=230/mx;
      document.getElementById(&#x27;pgBars&#x27;).innerHTML=&#x27;&lt;line x1=&quot;&#x27;+z+&#x27;&quot; y1=&quot;0&quot; x2=&quot;&#x27;+z+&#x27;&quot; y2=&quot;180&quot; stroke=&quot;var(--muted)&quot;/&gt;&#x27;+rows.map(function(o,i){var y=10+i*44,v=o[1];
        if(v===null)return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+o[0]+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(z+8)+&#x27;&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;nessuno&lt;/text&gt;&#x27;;
        var w=Math.abs(v)*s,x=v&lt;0?z-w:z;
        return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+o[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;28&quot; rx=&quot;4&quot; fill=&quot;&#x27;+o[2]+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(v&lt;0?x-6:x+w+6)+&#x27;&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;13&quot; text-anchor=&quot;&#x27;+(v&lt;0?&#x27;end&#x27;:&#x27;start&#x27;)+&#x27;&quot;&gt;&#x27;+(Math.round(v*10)/10)+&#x27;&lt;/text&gt;&#x27;}).join(&#x27;&#x27;);
      var t;if(R&lt;=1)t=&#x27;Con moltiplicatore ≤ 1 cooperare non crea valore: nessun dilemma, semplicemente non conviene.&#x27;;
      else if(R&gt;=N)t=&#x27;Con moltiplicatore ≥ 10 ogni paese recupera più di quanto paga: cooperare conviene anche individualmente, il problema sparisce.&#x27;;
      else t=&#x27;Dilemma: chi non coopera guadagna sempre &#x27;+C+&#x27; in più di chi coopera, quindi ciascuno è tentato di non contribuire; ma se tutti cooperano ognuno ottiene &#x27;+(Math.round(totAll/N*10)/10)+&#x27;, più che in qualsiasi altra situazione. Ecco perché “shared exposure” non basta: gli incentivi individuali restano disallineati.&#x27;;
      document.getElementById(&#x27;pgTxt&#x27;).textContent=t;}
    [k,c,r].forEach(function(e){e.addEventListener(&#x27;input&#x27;,draw)});draw();
  })();
  &lt;/script&gt;
  &lt;p&gt;Collegamento con la slide: &lt;em&gt;unequal responsibility&lt;/em&gt; e &lt;em&gt;different capacities&lt;/em&gt; significano che nella realtà i costi non sono uguali per tutti (un paese povero paga relativamente di più); &lt;em&gt;competing time horizons&lt;/em&gt; significa che il beneficio arriva tra decenni, il costo subito. Entrambi peggiorano il dilemma del modello.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Cooperation problem&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Spiega “shared exposure, uneven incentives”.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Tutti sono esposti ai rischi globali, ma i costi dell&#x27;azione, le responsabilità storiche, le capacità e gli orizzonti temporali dei governi sono diversi: gli incentivi politici a cooperare non sono distribuiti in modo uguale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Cosa sono i “competing time horizons”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Il contrasto tra i tempi della politica (cicli elettorali, pressioni di breve periodo) e i tempi lunghi dei problemi ambientali e tecnologici, i cui benefici della prevenzione arrivano dopo anni.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;question&quot; style=&quot;background:var(--ink);color:var(--paper)&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--paper);opacity:.7&quot;&gt;Challenges in a world in transition · la domanda centrale&lt;/div&gt;
