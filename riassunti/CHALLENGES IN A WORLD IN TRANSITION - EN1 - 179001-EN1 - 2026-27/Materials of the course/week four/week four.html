  &lt;p class=&quot;lead&quot; style=&quot;font-size:clamp(1.4rem,3.2vw,2rem)&quot;&gt;“How can societies redesign &lt;strong&gt;power&lt;/strong&gt;, &lt;strong&gt;institutions&lt;/strong&gt; and &lt;strong&gt;security&lt;/strong&gt; so that sustainability becomes a &lt;strong&gt;shared capacity&lt;/strong&gt; rather than a new source of &lt;strong&gt;inequality&lt;/strong&gt;?”&lt;/p&gt;
  &lt;p style=&quot;opacity:.85&quot;&gt;La slide dice che la domanda è &lt;em&gt;political&lt;/em&gt;: non tecnica. Tre leve da ridisegnare, ciascuna già vista nei casi:&lt;/p&gt;
  &lt;div class=&quot;grid g4&quot; style=&quot;color:var(--ink)&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Power&lt;/h4&gt;&lt;p&gt;Chi controlla terra, dati, infrastrutture (casi 9, 10, 11).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Institutions&lt;/h4&gt;&lt;p&gt;Regole che inseguono sistemi connessi; cambiare le istituzioni, non solo aggiungere voci (casi 11, 12).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Security&lt;/h4&gt;&lt;p&gt;Un concetto che si allarga: da difesa militare a resilienza di comunità e infrastrutture (caso 10, sintesi).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shared capacity&lt;/h4&gt;&lt;p&gt;La sostenibilità come capacità di tutti di adattarsi e decidere, non come privilegio di chi ha risorse.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part och&quot; id=&quot;group&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Laboratorio&lt;/div&gt;
  &lt;h2&gt;Group work: dai casi a un territorio&lt;/h2&gt;
  &lt;p&gt;Le ultime slide passano dalla teoria al lavoro di gruppo: scegliere un luogo concreto (un &lt;dfn&gt;territorial patch&lt;/dfn&gt;, “ritaglio” o porzione di territorio da analizzare) e leggerlo con le categorie della lezione. Le slide chiamano lo sfondo comune &lt;dfn&gt;Anthropocene&lt;/dfn&gt; (Antropocene: l&#x27;epoca in cui le attività umane sono la principale forza che trasforma il sistema Terra).&lt;/p&gt;

  &lt;h3&gt;La struttura del lavoro, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;Main points of group work&quot;&gt;I sei punti sono riportati nei passi qui sotto, con un suggerimento su come usare la lezione in ciascuno.&lt;/div&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Introduction&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Reminding the title and explain your vision/position.&lt;/em&gt; Dichiarate titolo e tesi. Suggerimento: formulate la tesi come risposta alla domanda centrale (chi guadagna e chi perde potere nella transizione del vostro territorio?).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Territorial analysis of the chosen patch&lt;/h4&gt;&lt;p&gt;Geografia fisica, uso del suolo, risorse, ecosistemi, aree protette. Strumento utile: la mappa del WDPA vista nel &lt;a href=&quot;#bio&quot;&gt;caso 9&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Socio-economic analysis of the patch&lt;/h4&gt;&lt;p&gt;Popolazione, attività produttive, redditi, lavoro, dipendenza da mercati globali (principio &lt;em&gt;scale matters&lt;/em&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;h4&gt;Analysis of social actors involved in the patch&lt;/h4&gt;&lt;p&gt;Chi sono gli attori (stato, imprese, comunità locali e indigene, ONG, organismi internazionali, piattaforme)? Che potere, interessi e legittimità hanno? Utile la distinzione &lt;em&gt;legitimacy vs legality&lt;/em&gt; del &lt;a href=&quot;#indig&quot;&gt;caso 12&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5&lt;/span&gt;&lt;h4&gt;Global challenges and the perception of the landscape: pollution and mobility&lt;/h4&gt;&lt;p&gt;Collegate il luogo a sfide globali, con attenzione a inquinamento e mobilità (di persone, merci, capitali), e a come gli abitanti &lt;em&gt;percepiscono&lt;/em&gt; il paesaggio che cambia.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;6&lt;/span&gt;&lt;h4&gt;Conclusion&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Summarise the problems and envisage solutions.&lt;/em&gt; Riassumete i problemi e proponete soluzioni: usate il &lt;a href=&quot;#coop&quot;&gt;cooperation problem&lt;/a&gt; per spiegare perché le soluzioni richiedono azione collettiva e quali attori devono cooperare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Esempi dalle slide&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Esempi dell&#x27;anno scorso&lt;/button&gt;&lt;button&gt;Brainstorming per gruppi&lt;/button&gt;&lt;button&gt;Luoghi e sfide&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Main challenges in the Anthropocene&quot;&gt;“Examples of last year!”: Group 1 &lt;strong&gt;Fast fashion&lt;/strong&gt; · Group 2 &lt;strong&gt;Gold extraction Asanti region&lt;/strong&gt; · Group 3 &lt;strong&gt;Impact of Olympic Games&lt;/strong&gt; · Group 4 &lt;strong&gt;Lagos urban laboratory of global challenges&lt;/strong&gt;.&lt;/div&gt;
      &lt;p&gt;Si nota il tipo di tema atteso: una filiera globale (moda), un&#x27;attività estrattiva in una regione precisa (oro nella regione Ashanti del Ghana), un grande evento, una metropoli come “laboratorio”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Group work · Brainstorming&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Group 1&lt;/strong&gt; — Global challenge: rischi del settore fast fashion (es. Shein), basse condizioni di lavoro. Territorial patch (da definire): Cina.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Group 2&lt;/strong&gt; — Global challenge: sovrasfruttamento delle risorse, danno ambientale, alto costo della vita. Territorial patch (da definire): Ghana.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Group 3&lt;/strong&gt; — Global challenge: basse condizioni di lavoro nei distretti industriali, riscaldamento globale. Territorial patch (da definire): India.&lt;/p&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot;&gt;La slide contiene foto degli studenti: qui sono omesse.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Brainstorming · Examples of places and their challenges&quot;&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Luogo&lt;/th&gt;&lt;th&gt;Impatti&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Greenland&lt;/td&gt;&lt;td&gt;Politici; ambientali: scioglimento dei ghiacci; sociali: sistema di vita indigeno&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Malesia&lt;/td&gt;&lt;td&gt;Politici, sociali, ambientali&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cyprus&lt;/td&gt;&lt;td&gt;Politici (“two countries”); divisione religiosa; ambientali: sfruttamento delle risorse per l&#x27;energia&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Australia&lt;/td&gt;&lt;td&gt;Sociali: popoli indigeni, migrazione; ambientali&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot;&gt;La tabella originale ha anche una colonna con i nomi degli studenti, qui omessa.&lt;/p&gt;
      &lt;p&gt;Prova: la Groenlandia tocca quasi tutti i casi della lezione (biodiversità e grandi aree protette, prospettive indigene, minerali critici per la tecnologia, sicurezza che si allarga all&#x27;Artico).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Anthropocene, una precisazione.&lt;/strong&gt; Nel marzo 2024 la Subcommission on Quaternary Stratigraphy ha respinto la proposta di inserire l&#x27;Antropocene come epoca formale nella scala dei tempi geologici, decisione confermata dall&#x27;International Union of Geological Sciences (IUGS), che ha però definito il termine un descrittore prezioso dell&#x27;impatto umano sul sistema Terra. Nelle scienze sociali e in questo corso resta quindi un concetto interpretativo, non un&#x27;unità geologica ufficiale. Fonti: &lt;a href=&quot;https://en.wikipedia.org/wiki/Anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Anthropocene&lt;/a&gt;; &lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Vienna, statement on the IUGS decision&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Group work&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Elenca i sei punti del lavoro di gruppo.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Introduction · Territorial analysis · Socio-economic analysis · Analysis of social actors · Global challenges and perception of the landscape (pollution and mobility) · Conclusion (problemi e soluzioni).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Scegli uno dei luoghi del brainstorming e collega a esso due principi della sintesi.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Mostra risposta&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Esempio, Groenlandia: &lt;em&gt;transitions redistribute power&lt;/em&gt; (la fusione dei ghiacci e i minerali critici attirano interessi esterni e creano nuove dipendenze); &lt;em&gt;security is expanding&lt;/em&gt; (il cambiamento ambientale dell&#x27;Artico entra nelle politiche di difesa). Ma molte altre combinazioni sono valide.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Fonti citate nelle slide e contesto&lt;/h2&gt;
  &lt;p&gt;Tutte le schede qui sotto sono &lt;strong&gt;fonti esterne&lt;/strong&gt;: dati e link trovati con ricerca web (ottobre 2026). Le prime quattro sono citate nelle slide; le altre sono contesto utile, non citato.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;h3&gt;Citate nelle slide&lt;/h3&gt;
    &lt;article&gt;&lt;h4&gt;UNEP-WCMC e IUCN — Protected Planet / World Database on Protected Areas (WDPA)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Il WDPA è un progetto congiunto di UNEP e IUCN, compilato e gestito dallo UNEP World Conservation Monitoring Centre insieme alla IUCN World Commission on Protected Areas (WCPA). È il più completo database mondiale di aree protette terrestri e marine; si consulta e scarica dal sito Protected Planet ed è aggiornato mensilmente. Secondo Wikipedia, nella versione allargata (World Database on Protected and Conserved Areas) a maggio 2026 conteneva oltre 312.000 aree protette e circa 7.400 OECM. &lt;strong&gt;Perché conta:&lt;/strong&gt; è la fonte della mappa del caso 9 e la base con cui si misurano obiettivi come il 30x30; registra anche il tipo di governance di ogni area.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.protectedplanet.net&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;protectedplanet.net&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/World_Database_on_Protected_Areas&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, World Database on Protected Areas&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;DLA Piper — Data Protection Laws of the World&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Guida e mappa interattiva pubblicata dallo studio legale DLA Piper: per ogni paese riporta la legge sulla protezione dei dati, le definizioni, l&#x27;autorità competente, e classifica regolazione ed enforcement in quattro livelli (Heavy, Robust, Moderate, Limited). L&#x27;edizione 2025, la quattordicesima, copre oltre 160 giurisdizioni (la slide usa la mappa 2023). &lt;strong&gt;Perché conta:&lt;/strong&gt; permette di confrontare paese per paese la frammentazione delle regole sui dati del caso 11; è una fonte professionale, non un atto ufficiale, e va usata come panoramica.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.dlapiperdataprotection.com&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dlapiperdataprotection.com&lt;/a&gt; · &lt;a href=&quot;https://iapp.org/resources/article/dla-piper-data-protection-laws-of-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda IAPP&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;AIGN, Artificial Intelligence Governance Network — Patrick Upmann, newsletter sull&#x27;AI Governance Gap&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; AIGN è una rete dedicata a etica, governance e regolazione dell&#x27;AI, fondata da Patrick Upmann, che cura anche un podcast. La ricerca ha trovato una serie di uscite intitolate “The AI Governance Gap Brief” con temi come &lt;em&gt;Accountability Gap&lt;/em&gt;, &lt;em&gt;Evidence Gap&lt;/em&gt;, &lt;em&gt;Machine Authority Gap&lt;/em&gt;; il numero #35 citato nella slide non è stato trovato direttamente online, quindi il suo contenuto è riportato solo come appare nell&#x27;immagine. &lt;strong&gt;Perché conta:&lt;/strong&gt; è un esempio di dibattito professionale (non accademico) sul controllo umano dell&#x27;AI nelle infrastrutture critiche.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://music.amazon.de/podcasts/f228df12-7ad1-497b-b474-0e2ee8e1c502/aign-artificial-intelligence-governance-network&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AIGN Podcast&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Humanculture — Indigenous Systems Framework (Stephanie Zabriskie)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Humanculture è un&#x27;organizzazione non profit, nata come Maasai Water Project con comunità pastorali Maasai in Tanzania, che sostiene la gestione della terra e la resilienza attraverso sistemi di governance e conoscenza indigeni in aree esposte a siccità e degrado del suolo, in Africa, Americhe e Asia; gestisce la piattaforma IndigenousSystems.org. Non è stato trovato online un documento intitolato esattamente “Indigenous Systems Framework”: la figura della slide va presa come schema analitico proposto dall&#x27;organizzazione. &lt;strong&gt;Perché conta:&lt;/strong&gt; offre le “lenti” per analizzare un sistema indigeno nel caso 12 e nel group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.unccd.int/cso/humanculture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda UNCCD su Humanculture&lt;/a&gt; · &lt;a href=&quot;https://www.preventionweb.net/organization/humanculture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

    &lt;h3&gt;Contesto utile (non citato nelle slide)&lt;/h3&gt;
    &lt;article&gt;&lt;h4&gt;Kunming-Montreal Global Biodiversity Framework, Target 3 (“30x30”)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Obiettivo di conservare almeno il 30% di terre, acque interne e aree marine e costiere entro il 2030, con governance equa e riconoscimento dei territori indigeni e tradizionali. &lt;strong&gt;Perché conta:&lt;/strong&gt; traduce la domanda “who bears the costs?” in un obiettivo globale con conseguenze locali.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.iucn.org/sites/default/files/2023-09/30x30-target-framework.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IUCN, 30x30 target framework (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.iied.org/achieving-30x30-vital-role-indigenous-traditional-territories-rights-governance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIED&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;UN Declaration on the Rights of Indigenous Peoples (UNDRIP, 2007)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Risoluzione 61/295 dell&#x27;Assemblea generale ONU; stabilisce tra l&#x27;altro il principio del consenso libero, preventivo e informato. &lt;strong&gt;Perché conta:&lt;/strong&gt; è il riferimento normativo per il passaggio da legittimità a legalità del caso 12.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.justice.gc.ca/eng/declaration/decl_doc.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo integrale (Justice Canada)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Regolamenti UE: GDPR (2016/679) e AI Act (2024/1689)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Due esempi di regolazione regionale con effetti oltre i confini dell&#x27;UE, rispettivamente su dati personali e sistemi di AI. &lt;strong&gt;Perché contano:&lt;/strong&gt; mostrano concretamente la “transnational regulation” dei casi 10 e 11.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2016/679/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GDPR su EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2024/1689/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AI Act su EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;La decisione IUGS sull&#x27;Antropocene (2024)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;fonte esterna&lt;/span&gt; Rifiuto della formalizzazione dell&#x27;Antropocene come epoca geologica, con riconoscimento del valore descrittivo del termine. &lt;strong&gt;Perché conta:&lt;/strong&gt; chiarisce lo statuto del concetto usato nel titolo del group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Università di Vienna&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Le parti marcate “Dalle slide” riportano il contenuto del PDF &lt;code&gt;week four.pdf&lt;/code&gt;; le parti marcate “Fonte esterna” vengono da ricerche web (link indicati); il resto è spiegazione didattica aggiunta. Grafici con cursori = modelli illustrativi, non dati reali.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

    bs.forEach(function(b,i){b.setAttribute(&#x27;role&#x27;,&#x27;tab&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,&#x27;false&#x27;)});ps.forEach(function(p){p.classList.remove(&#x27;on&#x27;)});

    function go(k){i=Math.max(0,Math.min(st.length-1,k));st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j===i)});n.textContent=(i+1)+&#x27; / &#x27;+st.length;}

    s.querySelector(&#x27;.next&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i+1)});

  document.querySelectorAll(&#x27;.q button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){

  });
  window.__init&amp;&amp;window.__init.forEach(function(f){f()});
