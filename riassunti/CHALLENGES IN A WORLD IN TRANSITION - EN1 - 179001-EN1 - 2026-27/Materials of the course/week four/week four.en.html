  &lt;p class=&quot;lead&quot; style=&quot;font-size:clamp(1.4rem,3.2vw,2rem)&quot;&gt;“How can societies redesign &lt;strong&gt;power&lt;/strong&gt;, &lt;strong&gt;institutions&lt;/strong&gt; and &lt;strong&gt;security&lt;/strong&gt; so that sustainability becomes a &lt;strong&gt;shared capacity&lt;/strong&gt; rather than a new source of &lt;strong&gt;inequality&lt;/strong&gt;?”&lt;/p&gt;
  &lt;p style=&quot;opacity:.85&quot;&gt;The slide states that the question is &lt;em&gt;political&lt;/em&gt;, not technical. Three levers to be redesigned, each already encountered in the cases:&lt;/p&gt;
  &lt;div class=&quot;grid g4&quot; style=&quot;color:var(--ink)&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Power&lt;/h4&gt;&lt;p&gt;Who controls land, data and infrastructures (cases 9, 10, 11).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Institutions&lt;/h4&gt;&lt;p&gt;Rules that lag behind connected systems; changing institutions, not just adding voices (cases 11, 12).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Security&lt;/h4&gt;&lt;p&gt;An expanding concept: from military defence to the resilience of communities and infrastructures (case 10, synthesis).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Shared capacity&lt;/h4&gt;&lt;p&gt;Sustainability as everyone&#x27;s capacity to adapt and decide, not as a privilege of those with resources.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part och&quot; id=&quot;group&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Workshop&lt;/div&gt;
  &lt;h2&gt;Group work: from the cases to a territory&lt;/h2&gt;
  &lt;p&gt;The final slides move from theory to group work: choose a concrete place (a &lt;dfn&gt;territorial patch&lt;/dfn&gt;, a portion of territory to be analysed) and read it through the categories of the lecture. The slides call the common background the &lt;dfn&gt;Anthropocene&lt;/dfn&gt; (the epoch in which human activities are the main force transforming the Earth system).&lt;/p&gt;

  &lt;h3&gt;The structure of the work, step by step&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;Main points of group work&quot;&gt;The six points are set out in the steps below, with a suggestion on how to use the lecture in each one.&lt;/div&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt;&lt;h4&gt;Introduction&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Reminding the title and explain your vision/position.&lt;/em&gt; State your title and thesis. Suggestion: frame the thesis as an answer to the central question (who gains and who loses power in the transition of your territory?).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt;&lt;h4&gt;Territorial analysis of the chosen patch&lt;/h4&gt;&lt;p&gt;Physical geography, land use, resources, ecosystems, protected areas. A useful tool: the WDPA map discussed in &lt;a href=&quot;#bio&quot;&gt;case 9&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt;&lt;h4&gt;Socio-economic analysis of the patch&lt;/h4&gt;&lt;p&gt;Population, productive activities, income, employment, dependence on global markets (the &lt;em&gt;scale matters&lt;/em&gt; principle).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt;&lt;h4&gt;Analysis of social actors involved in the patch&lt;/h4&gt;&lt;p&gt;Who are the actors (state, companies, local and Indigenous communities, NGOs, international bodies, platforms)? What power, interests and legitimacy do they have? The &lt;em&gt;legitimacy vs legality&lt;/em&gt; distinction from &lt;a href=&quot;#indig&quot;&gt;case 12&lt;/a&gt; is useful here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;5&lt;/span&gt;&lt;h4&gt;Global challenges and the perception of the landscape: pollution and mobility&lt;/h4&gt;&lt;p&gt;Link the place to global challenges, with attention to pollution and mobility (of people, goods and capital), and to how residents &lt;em&gt;perceive&lt;/em&gt; the changing landscape.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;6&lt;/span&gt;&lt;h4&gt;Conclusion&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Summarise the problems and envisage solutions.&lt;/em&gt; Summarise the problems and propose solutions: use the &lt;a href=&quot;#coop&quot;&gt;cooperation problem&lt;/a&gt; to explain why solutions require collective action and which actors need to cooperate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Examples from the slides&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Last year&#x27;s examples&lt;/button&gt;&lt;button&gt;Group brainstorming&lt;/button&gt;&lt;button&gt;Places and challenges&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Main challenges in the Anthropocene&quot;&gt;“Examples of last year!”: Group 1 &lt;strong&gt;Fast fashion&lt;/strong&gt; · Group 2 &lt;strong&gt;Gold extraction Asanti region&lt;/strong&gt; · Group 3 &lt;strong&gt;Impact of Olympic Games&lt;/strong&gt; · Group 4 &lt;strong&gt;Lagos urban laboratory of global challenges&lt;/strong&gt;.&lt;/div&gt;
      &lt;p&gt;Note the kind of topic expected: a global supply chain (fashion), an extractive activity in a specific region (gold in Ghana&#x27;s Ashanti region), a major event, a metropolis as a “laboratory”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Group work · Brainstorming&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Group 1&lt;/strong&gt; — Global challenge: risks of the fast fashion sector (e.g. Shein), poor working conditions. Territorial patch (to be defined): China.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Group 2&lt;/strong&gt; — Global challenge: overexploitation of resources, environmental damage, high cost of living. Territorial patch (to be defined): Ghana.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Group 3&lt;/strong&gt; — Global challenge: poor working conditions in industrial districts, global warming. Territorial patch (to be defined): India.&lt;/p&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot;&gt;The slide contains photos of the students: they are omitted here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;slide&quot; data-p=&quot;Brainstorming · Examples of places and their challenges&quot;&gt;
      &lt;table&gt;&lt;tr&gt;&lt;th&gt;Place&lt;/th&gt;&lt;th&gt;Impacts&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Greenland&lt;/td&gt;&lt;td&gt;Political; environmental: melting ice; social: Indigenous way of life&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Malaysia&lt;/td&gt;&lt;td&gt;Political, social, environmental&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Cyprus&lt;/td&gt;&lt;td&gt;Political (“two countries”); religious division; environmental: exploitation of resources for energy&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Australia&lt;/td&gt;&lt;td&gt;Social: Indigenous peoples, migration; environmental&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small muted&quot;&gt;The original table also has a column with the students&#x27; names, omitted here.&lt;/p&gt;
      &lt;p&gt;Try it: Greenland touches on almost every case in the lecture (biodiversity and large protected areas, Indigenous perspectives, critical minerals for technology, security expanding into the Arctic).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Anthropocene: a clarification.&lt;/strong&gt; In March 2024 the Subcommission on Quaternary Stratigraphy rejected the proposal to include the Anthropocene as a formal epoch in the geological time scale, a decision confirmed by the International Union of Geological Sciences (IUGS), which nonetheless described the term as an invaluable descriptor of human impact on the Earth system. In the social sciences and in this course it therefore remains an interpretive concept, not an official geological unit. Sources: &lt;a href=&quot;https://en.wikipedia.org/wiki/Anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, Anthropocene&lt;/a&gt;; &lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Vienna, statement on the IUGS decision&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Group work&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. List the six points of the group work.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Introduction · Territorial analysis · Socio-economic analysis · Analysis of social actors · Global challenges and perception of the landscape (pollution and mobility) · Conclusion (problems and solutions).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Choose one of the places from the brainstorming and link two principles from the synthesis to it.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Example, Greenland: &lt;em&gt;transitions redistribute power&lt;/em&gt; (melting ice and critical minerals attract external interests and create new dependencies); &lt;em&gt;security is expanding&lt;/em&gt; (environmental change in the Arctic enters defence policy). Many other combinations are valid.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;refs&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Sources cited in the slides and context&lt;/h2&gt;
  &lt;p&gt;All the entries below are &lt;strong&gt;external sources&lt;/strong&gt;: data and links found through web searches (October 2026). The first four are cited in the slides; the others provide useful context and are not cited.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;h3&gt;Cited in the slides&lt;/h3&gt;
    &lt;article&gt;&lt;h4&gt;UNEP-WCMC and IUCN — Protected Planet / World Database on Protected Areas (WDPA)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; The WDPA is a joint project of UNEP and IUCN, compiled and managed by the UNEP World Conservation Monitoring Centre together with the IUCN World Commission on Protected Areas (WCPA). It is the most comprehensive global database of terrestrial and marine protected areas; it can be consulted and downloaded from the Protected Planet website and is updated monthly. According to Wikipedia, in its expanded version (World Database on Protected and Conserved Areas) it contained, as of May 2026, more than 312,000 protected areas and around 7,400 OECMs. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the source of the map in case 9 and the basis on which targets such as 30x30 are measured; it also records the governance type of each area.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.protectedplanet.net&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;protectedplanet.net&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/World_Database_on_Protected_Areas&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia, World Database on Protected Areas&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;DLA Piper — Data Protection Laws of the World&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; A guide and interactive map published by the law firm DLA Piper: for each country it reports the data protection law, definitions and competent authority, and classifies regulation and enforcement into four levels (Heavy, Robust, Moderate, Limited). The 2025 edition, the fourteenth, covers more than 160 jurisdictions (the slide uses the 2023 map). &lt;strong&gt;Why it matters:&lt;/strong&gt; it allows a country-by-country comparison of the fragmentation of data rules discussed in case 11; it is a professional source, not an official instrument, and should be used as an overview.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.dlapiperdataprotection.com&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dlapiperdataprotection.com&lt;/a&gt; · &lt;a href=&quot;https://iapp.org/resources/article/dla-piper-data-protection-laws-of-the-world&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAPP entry&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;AIGN, Artificial Intelligence Governance Network — Patrick Upmann, newsletter on the AI Governance Gap&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; AIGN is a network devoted to AI ethics, governance and regulation, founded by Patrick Upmann, who also hosts a podcast. The search found a series of issues titled “The AI Governance Gap Brief” on topics such as &lt;em&gt;Accountability Gap&lt;/em&gt;, &lt;em&gt;Evidence Gap&lt;/em&gt; and &lt;em&gt;Machine Authority Gap&lt;/em&gt;; issue #35, cited in the slide, could not be found directly online, so its content is reported only as it appears in the image. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is an example of professional (not academic) debate on human control of AI in critical infrastructures.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://music.amazon.de/podcasts/f228df12-7ad1-497b-b474-0e2ee8e1c502/aign-artificial-intelligence-governance-network&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AIGN Podcast&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;Humanculture — Indigenous Systems Framework (Stephanie Zabriskie)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; Humanculture is a non-profit organisation, founded as the Maasai Water Project with Maasai pastoralist communities in Tanzania, which supports land stewardship and resilience through Indigenous governance and knowledge systems in areas exposed to drought and land degradation in Africa, the Americas and Asia; it runs the IndigenousSystems.org platform. No document titled exactly “Indigenous Systems Framework” was found online: the figure in the slide should be taken as an analytical framework proposed by the organisation. &lt;strong&gt;Why it matters:&lt;/strong&gt; it provides the “lenses” for analysing an Indigenous system in case 12 and in the group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.unccd.int/cso/humanculture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNCCD profile of Humanculture&lt;/a&gt; · &lt;a href=&quot;https://www.preventionweb.net/organization/humanculture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;

    &lt;h3&gt;Useful context (not cited in the slides)&lt;/h3&gt;
    &lt;article&gt;&lt;h4&gt;Kunming-Montreal Global Biodiversity Framework, Target 3 (“30x30”)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; The target of conserving at least 30% of land, inland waters and marine and coastal areas by 2030, with equitable governance and recognition of Indigenous and traditional territories. &lt;strong&gt;Why it matters:&lt;/strong&gt; it translates the question “who bears the costs?” into a global target with local consequences.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.iucn.org/sites/default/files/2023-09/30x30-target-framework.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IUCN, 30x30 target framework (PDF)&lt;/a&gt; · &lt;a href=&quot;https://www.iied.org/achieving-30x30-vital-role-indigenous-traditional-territories-rights-governance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIED&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;UN Declaration on the Rights of Indigenous Peoples (UNDRIP, 2007)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; UN General Assembly resolution 61/295; among other things, it establishes the principle of free, prior and informed consent. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the normative reference point for the shift from legitimacy to legality in case 12.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.justice.gc.ca/eng/declaration/decl_doc.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Full text (Justice Canada)&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;EU regulations: GDPR (2016/679) and AI Act (2024/1689)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; Two examples of regional regulation with effects beyond the EU&#x27;s borders, on personal data and AI systems respectively. &lt;strong&gt;Why they matter:&lt;/strong&gt; they provide concrete illustrations of the “transnational regulation” discussed in cases 10 and 11.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2016/679/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GDPR on EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2024/1689/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AI Act on EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
    &lt;article&gt;&lt;h4&gt;The IUGS decision on the Anthropocene (2024)&lt;/h4&gt;
      &lt;p&gt;&lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt; Rejection of the formalisation of the Anthropocene as a geological epoch, with recognition of the descriptive value of the term. &lt;strong&gt;Why it matters:&lt;/strong&gt; it clarifies the status of the concept used in the title of the group work.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://anthropocene.univie.ac.at/news/detailansicht/statement-on-the-iugs-anthropocene-decision&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Vienna&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Anthropocene&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;The parts marked “From the slides” report the content of the PDF &lt;code&gt;week four.pdf&lt;/code&gt;; the parts marked “External source” come from web searches (links provided); everything else is added explanatory material. Charts with sliders = illustrative models, not real data.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var bs=t.querySelectorAll(&#x27;.tabbar button&#x27;),ps=t.querySelectorAll(&#x27;.panel&#x27;);
    bs.forEach(function(b,i){b.setAttribute(&#x27;role&#x27;,&#x27;tab&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,&#x27;false&#x27;)});ps.forEach(function(p){p.classList.remove(&#x27;on&#x27;)});
      b.setAttribute(&#x27;aria-selected&#x27;,&#x27;true&#x27;);ps[i].classList.add(&#x27;on&#x27;);});});
  });
  // steps
  document.querySelectorAll(&#x27;.steps&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),n=s.querySelector(&#x27;.n&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;))});
    function go(k){i=Math.max(0,Math.min(st.length-1,k));st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});
      dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.classList.toggle(&#x27;on&#x27;,j===i)});n.textContent=(i+1)+&#x27; / &#x27;+st.length;}
    s.querySelector(&#x27;.prev&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i-1)});
    s.querySelector(&#x27;.next&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i+1)});
    go(0);
  });
  // self-assessment
  document.querySelectorAll(&#x27;.q button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    var q=b.closest(&#x27;.q&#x27;);q.classList.toggle(&#x27;open&#x27;);b.textContent=q.classList.contains(&#x27;open&#x27;)?&#x27;Hide answer&#x27;:&#x27;Show answer&#x27;;});});
  // clickable info panels (wheel, cycle, matrix)
  document.querySelectorAll(&#x27;[data-info]&#x27;).forEach(function(el){
    function show(){var o=document.getElementById(el.getAttribute(&#x27;data-target&#x27;));if(!o)return;
      o.innerHTML=&#x27;&lt;strong&gt;&#x27;+el.getAttribute(&#x27;data-title&#x27;)+&#x27;&lt;/strong&gt; — &#x27;+el.getAttribute(&#x27;data-info&#x27;);
      document.querySelectorAll(&#x27;[data-target=&quot;&#x27;+el.getAttribute(&#x27;data-target&#x27;)+&#x27;&quot;]&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;)});el.classList.add(&#x27;on&#x27;);}
    el.addEventListener(&#x27;click&#x27;,show);el.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);
    el.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();show();}});
  });
  window.__init&amp;&amp;window.__init.forEach(function(f){f()});
})();
&lt;/script&gt;
