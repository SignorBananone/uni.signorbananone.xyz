  &lt;h1&gt;Challenges in a world in transition&lt;/h1&gt;
  &lt;p class=&quot;lead&quot;&gt;Biodiversity, artificial intelligence, digital spaces and Indigenous perspectives: four case studies for a single political question. &lt;em&gt;How can societies redesign power, institutions and security so that sustainability becomes a shared capacity rather than a new source of inequality?&lt;/em&gt;&lt;/p&gt;
  &lt;p class=&quot;muted small&quot;&gt;The lecture file (15 pages) contains &lt;span class=&quot;term&quot;&gt;case studies&lt;/span&gt; 9–12, a &lt;span class=&quot;term&quot;&gt;cross-case synthesis&lt;/span&gt;, the &lt;span class=&quot;term&quot;&gt;cooperation problem&lt;/span&gt;, the concluding question and the guidelines for the &lt;span class=&quot;term&quot;&gt;group work&lt;/span&gt;. The numbering of the slides (14–21) and of the cases (from 9 onwards) suggests that cases 1–8 belong to earlier lectures. I was unable to consult the other files in the &lt;code&gt;corso/&lt;/code&gt; folder (none of them could be opened with the available tools): the links to other lectures below are therefore only hypotheses, flagged as such.&lt;/p&gt;

&lt;section class=&quot;part sal&quot; id=&quot;bio&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 9 · Nature and political authority&lt;/div&gt;
  &lt;h2&gt;Biodiversity: conservation is also a question of power&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 14&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Who defines valuable nature, and who bears the costs of protecting it?”&lt;/p&gt;
    &lt;p&gt;Four dimensions: &lt;em&gt;protected areas and land governance&lt;/em&gt; · &lt;em&gt;Indigenous and local knowledge&lt;/em&gt; · &lt;em&gt;food systems and biodiversity&lt;/em&gt; · &lt;em&gt;North-South relations&lt;/em&gt;.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;“A sustainability policy can protect ecosystems while still reproducing unequal control over land and resources.”&lt;/strong&gt; The political task is to connect biodiversity protection with &lt;em&gt;rights, livelihoods and legitimacy&lt;/em&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;The question on the slide actually contains two distinct questions, and it is useful to keep them apart:&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Who defines what is valuable?&lt;/h4&gt;&lt;p&gt;Choosing &lt;em&gt;which&lt;/em&gt; nature to protect (a primary forest, a flagship species, a traditional agricultural landscape) is not a neutral scientific fact: it depends on who has the authority to produce maps, classifications and priorities. This is the issue of &lt;dfn&gt;political authority&lt;/dfn&gt;: the recognised power to make decisions that are binding on others.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Who bears the costs?&lt;/h4&gt;&lt;p&gt;A protected area often generates global benefits (climate, species, reputation) and local costs: restrictions on grazing, fishing and gathering, sometimes the displacement of entire communities. If those who pay are not those who decide, conservation becomes a &lt;em&gt;redistribution&lt;/em&gt; of resources, not merely a form of protection.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The four dimensions, one per tab&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Protected areas&lt;/button&gt;&lt;button&gt;Indigenous knowledge&lt;/button&gt;&lt;button&gt;Food systems&lt;/button&gt;&lt;button&gt;North-South&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;
      &lt;p&gt;A &lt;dfn&gt;protected area&lt;/dfn&gt; is a clearly defined geographical space, managed through legal or other effective means, to achieve the long-term conservation of nature. &lt;dfn&gt;Land governance&lt;/dfn&gt; is the set of rules, institutions and power relations that determine who can use, own, transfer and control land.&lt;/p&gt;
      &lt;p&gt;The point of the slide: a protected area is always also a land governance decision. Drawing a boundary on a map means deciding who gets in, who stays out and who is in control.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;dfn&gt;Indigenous and local knowledge&lt;/dfn&gt; is the knowledge accumulated and passed down across generations by communities living in a territory: seasonality, species, uses of fire and water, harvesting rules. It is not “folklore”: it is often the reason why an ecosystem has survived in good condition to this day.&lt;/p&gt;
      &lt;p&gt;The political problem is &lt;em&gt;which knowledge counts&lt;/em&gt; in decision-making: only that of external experts and agencies, or also that of the people who live in the place? The theme returns in &lt;a href=&quot;#indig&quot;&gt;case study 12&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Biodiversity and &lt;dfn&gt;food systems&lt;/dfn&gt; (everything from food production to consumption) are linked in two directions: agriculture is one of the main drivers of habitat loss, but the diversity of crops, breeds and agricultural landscapes is itself biodiversity, and food security depends on pollinators, soils and water.&lt;/p&gt;
      &lt;p&gt;Protecting an area may reduce access for those who produce food there; failing to protect it may destroy the basis of future food supply. This is where &lt;em&gt;livelihoods&lt;/em&gt; and conservation either clash or ally.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;&lt;dfn&gt;North-South relations&lt;/dfn&gt; (relations between high-income countries and countries of the Global South) matter because much of the world&#x27;s terrestrial biodiversity is located in the Global South, while much of the funding, NGOs and conservation agendas originates in the North. Those who fund tend to set the priorities.&lt;/p&gt;
      &lt;p&gt;Typical exam question: is it fair to ask countries of the South to forgo the use of their own resources for a global benefit, after the North has already transformed its own territories?&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The map of protected areas&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;next slide&quot;&gt;
    &lt;p&gt;World map of &lt;em&gt;terrestrial protected areas&lt;/em&gt; (green) and &lt;em&gt;marine and coastal protected areas&lt;/em&gt; (blue). Stated source: UNEP-WCMC and IUCN (2021), &lt;em&gt;Protected Planet: The World Database on Protected Areas (WDPA) and World Database on Other Effective Area-Based Conservation Measures (WD-OECM)&lt;/em&gt;, July 2021, protectedplanet.net. Logos: UN Environment Programme WCMC, IUCN, WCPA.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;How to read the map through the lens of the lecture (observations on the figure, not measured data):&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Terrestrial areas are dense in Amazonia, Eastern and Southern Africa and Europe; north-eastern Greenland is covered by a single large park.&lt;/li&gt;
    &lt;li&gt;Many marine areas are huge circles or polygons around remote islands in the Pacific, the South Atlantic and the Indian Ocean: vast surfaces, often sparsely inhabited and administered by distant states. It is easy to “make up the numbers” in hectares there, harder where people live.&lt;/li&gt;
    &lt;li&gt;The map shows &lt;em&gt;where&lt;/em&gt; protection exists, not &lt;em&gt;who&lt;/em&gt; governs it or &lt;em&gt;how&lt;/em&gt; effective it is: two areas in the same shade of green may have opposite power regimes.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;An &lt;dfn&gt;OECM&lt;/dfn&gt; (&lt;span class=&quot;term&quot;&gt;other effective area-based conservation measure&lt;/span&gt;) is an area that effectively conserves nature without being formally designated as a protected area: for example, a community-managed territory or a restricted military zone. The category was created precisely to recognise non-state forms of conservation.&lt;/p&gt;

  &lt;h3&gt;Explore: who governs the protected area?&lt;/h3&gt;
  &lt;p&gt;The same area, always green on the map, can be governed in very different ways. Move the slider.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;govR&quot;&gt;Governance type: &lt;span class=&quot;out&quot; id=&quot;govN&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;govR&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;govBars&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;govT&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;ext small&quot;&gt;The four governance types (A government, B shared, C private, D Indigenous peoples and local communities) are the categories used by the IUCN and recorded in the WDPA: &lt;a href=&quot;https://www.protectedplanet.net&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;protectedplanet.net&lt;/a&gt;. The bars are a qualitative teaching interpretation, not measurements.&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var T=[[&#x27;A · Governance by government&#x27;,&#x27;The state (ministry, parks agency) decides and manages. Advantages: resources, continuity, a strong legal basis. Typical risk: so-called “fortress conservation”, i.e. protecting nature by excluding resident populations.&#x27;,[90,30,30]],
      [&#x27;B · Shared governance&#x27;,&#x27;Decisions taken jointly by the state, communities and sometimes NGOs (co-management). Greater legitimacy, but it requires genuinely shared powers, not mere “consultation”.&#x27;,[65,60,55]],
      [&#x27;C · Private governance&#x27;,&#x27;Private landowners, foundations or companies. It can be highly effective and fast; the risk is that protection follows property and the market rather than the rights of residents.&#x27;,[55,25,35]],
      [&#x27;D · Indigenous peoples and local communities&#x27;,&#x27;The community decides through its own institutions (ICCAs, “territories of life”). High legitimacy and local knowledge; legal recognition and financial support are often lacking.&#x27;,[30,90,80]]];
    var L=[&#x27;State control&#x27;,&#x27;Local voice&#x27;,&#x27;Perceived legitimacy&#x27;];
    var r=document.getElementById(&#x27;govR&#x27;),g=document.getElementById(&#x27;govBars&#x27;);
    function draw(){var t=T[+r.value];document.getElementById(&#x27;govN&#x27;).textContent=t[0];document.getElementById(&#x27;govT&#x27;).textContent=t[1];
      g.innerHTML=t[2].map(function(v,i){var y=10+i*36;return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+L[i]+&#x27;&lt;/text&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+(v*4)+&#x27;&quot; height=&quot;24&quot; rx=&quot;4&quot; fill=&quot;var(--sal)&quot; style=&quot;transition:width .3s&quot;/&gt;&#x27;}).join(&#x27;&#x27;);}
    r.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;details&gt;&lt;summary&gt;What the slide takes for granted: “fortress conservation” and environmental justice&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Fortress conservation&lt;/span&gt; refers to the historical model, born with the great national parks, in which nature is protected by fencing it off and removing those who lived there. It has produced displacement and conflict, especially in Africa and Asia. The slide does not use the term, but the phrase “protect ecosystems while still reproducing unequal control over land” describes exactly this risk.&lt;/p&gt;
    &lt;p&gt;Hence the three keywords of the slide: &lt;em&gt;rights&lt;/em&gt; (rights to land and resources), &lt;em&gt;livelihoods&lt;/em&gt; (means of subsistence), &lt;em&gt;legitimacy&lt;/em&gt; (rules are accepted as fair by those subject to them). A conservation policy is politically sustainable only if it holds all three together.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;ext&quot;&gt;
    &lt;p&gt;&lt;strong&gt;Context: the “30x30” target.&lt;/strong&gt; The &lt;em&gt;Kunming-Montreal Global Biodiversity Framework&lt;/em&gt; (2022), Target 3, calls for the conservation of at least 30% of terrestrial areas, inland waters and marine and coastal areas by 2030, while also recognising Indigenous and traditional territories and the rights of communities. An IIED analysis observes that implementation is uneven and that legal recognition of collective land rights is needed. Sources: &lt;a href=&quot;https://www.iucn.org/sites/default/files/2023-09/30x30-target-framework.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IUCN, 30x30 target framework&lt;/a&gt;; &lt;a href=&quot;https://www.iied.org/achieving-30x30-vital-role-indigenous-traditional-territories-rights-governance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IIED, Achieving 30x30&lt;/a&gt;. It is not cited in the slides, but it is the normative background to the question “who pays?”.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Case study 9&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Why can a conservation policy be “sustainable” and unjust at the same time?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Because it can protect the ecosystem while reproducing &lt;em&gt;unequal control over land and resources&lt;/em&gt;: those who decide (states, funders, often from the North) are not those who bear the costs (local communities that lose access to land, fishing, gathering).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What does the WDPA map show, and what does it &lt;em&gt;not&lt;/em&gt; show?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;It shows the distribution of terrestrial and marine protected areas (UNEP-WCMC and IUCN, 2021). It does not show who governs them, whether they are effective, or what rights the people living in them have.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Which three elements does the slide ask us to connect to biodiversity protection?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Rights, livelihoods and legitimacy&lt;/em&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part sla&quot; id=&quot;ai&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 10 · Technology and power&lt;/div&gt;
  &lt;h2&gt;AI and the environmental governance gap&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 15&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“AI is both an infrastructure challenge and a governance challenge.”&lt;/p&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;INPUTS&lt;/th&gt;&lt;td&gt;Data, minerals, energy and water&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;SYSTEMS&lt;/th&gt;&lt;td&gt;Data centres, models and supply chains&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;EFFECTS&lt;/th&gt;&lt;td&gt;Environmental monitoring, decision-making and surveillance&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;GOVERNANCE&lt;/th&gt;&lt;td&gt;Who sets rules and who is accountable?&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
    &lt;p&gt;&lt;strong&gt;“The geopolitics of AI sits under the hype: infrastructures, standards, data and unequal capacity.”&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;A &lt;dfn&gt;governance gap&lt;/dfn&gt; is the distance between what a technology already does in the world and the capacity of institutions to establish rules, oversight and accountability for it. “Environmental” has two meanings here: AI has an environmental impact (it consumes energy, water and minerals) and it is used to govern the environment (monitoring, forecasting, network management).&lt;/p&gt;

  &lt;h3&gt;The four links in the AI chain, step by step&lt;/h3&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · Inputs&lt;/span&gt;
      &lt;h4&gt;Data, minerals, energy and water&lt;/h4&gt;
      &lt;p&gt;AI appears immaterial, but it rests on physical resources: data (often collected from people who do not control how it is used), &lt;em&gt;minerals&lt;/em&gt; for chips and hardware (copper, lithium, rare earths, gallium…), electricity to train and run models, and water to cool data centres.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Political reading:&lt;/strong&gt; whoever controls mines, refining, power grids and water basins controls part of AI. This is the same theme as the &lt;em&gt;new dependencies&lt;/em&gt; in the final synthesis.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Systems&lt;/span&gt;
      &lt;h4&gt;Data centres, models and supply chains&lt;/h4&gt;
      &lt;p&gt;&lt;em&gt;Data centres&lt;/em&gt; are infrastructures concentrated in a few countries and a few companies; &lt;em&gt;models&lt;/em&gt; are trained by a small number of actors with enormous capital; chip &lt;em&gt;supply chains&lt;/em&gt; cross many states, with critical stages in very few places.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Political reading:&lt;/strong&gt; concentration = power and vulnerability. An export ban or a conflict at one node of the chain propagates through the entire system.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Effects&lt;/span&gt;
      &lt;h4&gt;Environmental monitoring, decision-making and surveillance&lt;/h4&gt;
      &lt;p&gt;The same tools have ambivalent effects: AI helps detect deforestation, fires, emissions and droughts (&lt;em&gt;monitoring&lt;/em&gt;); it supports or replaces decisions on water and energy networks (&lt;em&gt;decision-making&lt;/em&gt;); but it can also be used to control people and territories (&lt;em&gt;surveillance&lt;/em&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Political reading:&lt;/strong&gt; the same satellite image can protect a forest or identify those who live there without legal title (link to &lt;a href=&quot;#bio&quot;&gt;case 9&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Governance&lt;/span&gt;
      &lt;h4&gt;Who sets rules and who is accountable?&lt;/h4&gt;
      &lt;p&gt;Who writes the rules (states, regional unions, companies through technical standards, international bodies)? And who answers when a system fails? &lt;dfn&gt;Accountability&lt;/dfn&gt; (having to give account and face consequences) is the weakest point: responsibility becomes diluted among developer, provider, public user and operator.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Political reading:&lt;/strong&gt; &lt;em&gt;standards&lt;/em&gt; and &lt;em&gt;unequal capacity&lt;/em&gt;: those who set technical standards export their own rules; those who lack technical and financial capacity have them imposed.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The AIGN image: when machines gain authority&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 4 (image)&quot;&gt;
    &lt;p&gt;Cover of &lt;em&gt;AI Governance Newsletter · Issue #35&lt;/em&gt;, Patrick Upmann, 22 September 2026: &lt;strong&gt;“The AI Governance Gap — When Machines Gain Authority Over Critical Systems”&lt;/strong&gt;. Subtitle: from a NATO-supported research workshop in Armenia to the global challenge of governing autonomous AI in &lt;em&gt;critical infrastructures&lt;/em&gt;. At the centre, a cycle: &lt;em&gt;Detect · Assess · Recommend · Act · Account&lt;/em&gt;. At the bottom: &lt;em&gt;Secure infrastructure · Govern authority · Strengthen accountability · Enable evidence · Build a safer tomorrow&lt;/em&gt;. On the sides: “Human responsibility remains essential” and “Intelligence is not permission”. In the background: a dam, a power grid, wind turbines, a city, an airport, a railway.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;dfn&gt;Critical infrastructures&lt;/dfn&gt; are the systems whose disruption affects the security and life of a society: energy, water, transport, telecommunications, healthcare. Click the stages of the cycle to see where the &lt;em&gt;gap&lt;/em&gt; opens up.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 560 380&quot; aria-label=&quot;Detect, Assess, Recommend, Act, Account cycle&quot;&gt;
    &lt;circle cx=&quot;280&quot; cy=&quot;190&quot; r=&quot;120&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;10&quot;/&gt;
    &lt;text x=&quot;280&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;“Intelligence is&lt;/text&gt;
    &lt;text x=&quot;280&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;not permission”&lt;/text&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;
      &lt;g data-info=&quot;The system detects an anomaly (e.g. a pressure drop in a water network, a peak in electricity demand). This is the area in which AI is most useful and least controversial.&quot; data-title=&quot;Detect&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;280&quot; cy=&quot;70&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot;&gt;Detect&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;It assesses severity and causes. This is where training data comes in: if it is partial, the assessment may underestimate risks for certain areas or groups.&quot; data-title=&quot;Assess&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;394&quot; cy=&quot;153&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;394&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot;&gt;Assess&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;It proposes an action. As long as a human being chooses, authority remains human; but if nobody has the time or expertise to contradict the machine, the recommendation becomes a de facto decision.&quot; data-title=&quot;Recommend&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;350&quot; cy=&quot;287&quot; r=&quot;40&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot;&gt;Recommend&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;The system acts on its own (opens a sluice gate, sheds a load). This is the step in which the machine “gains authority”: the core of the governance gap. “Intelligence is not permission”: being able to act is not the same as having the right to do so.&quot; data-title=&quot;Act&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;287&quot; r=&quot;40&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot;&gt;Act&lt;/text&gt;&lt;/g&gt;
      &lt;g data-info=&quot;Someone must be accountable for the action: traceability (enable evidence), clear responsibility (strengthen accountability), the possibility of redress. If this stage is missing, the cycle remains open and nobody is responsible.&quot; data-title=&quot;Account&quot; data-target=&quot;cycOut&quot;&gt;&lt;circle cx=&quot;166&quot; cy=&quot;153&quot; r=&quot;40&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;166&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot;&gt;Account&lt;/text&gt;&lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption id=&quot;cycOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Click a stage of the cycle.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Chart: why the gap opens up&lt;/h3&gt;
  &lt;p&gt;Teaching model (not real data): technological capacity grows continuously and at an accelerating rate; rules are updated “in steps”, with a delay. The shaded area is the &lt;em&gt;governance gap&lt;/em&gt;.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; id=&quot;gapSvg&quot; aria-label=&quot;Governance gap chart&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;580&quot; y2=&quot;260&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;260&quot; stroke=&quot;var(--muted)&quot;/&gt;
      &lt;text x=&quot;315&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;time (years)&lt;/text&gt;
      &lt;text x=&quot;18&quot; y=&quot;140&quot; font-size=&quot;13&quot; transform=&quot;rotate(-90 18 140)&quot; text-anchor=&quot;middle&quot;&gt;capacity / coverage&lt;/text&gt;
      &lt;path id=&quot;gapArea&quot; fill=&quot;var(--bri)&quot; fill-opacity=&quot;.22&quot;/&gt;
      &lt;path id=&quot;gapTech&quot; fill=&quot;none&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;path id=&quot;gapRule&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g font-size=&quot;13&quot;&gt;&lt;rect x=&quot;70&quot; y=&quot;30&quot; width=&quot;14&quot; height=&quot;4&quot; fill=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;36&quot;&gt;technology&lt;/text&gt;
      &lt;rect x=&quot;70&quot; y=&quot;50&quot; width=&quot;14&quot; height=&quot;4&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;56&quot;&gt;rules and institutions&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;label class=&quot;rl&quot; for=&quot;gapG&quot;&gt;Speed of technology: &lt;span class=&quot;out&quot; id=&quot;gapGo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;gapG&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;gapL&quot;&gt;Institutional lag between one rule update and the next: &lt;span class=&quot;out&quot; id=&quot;gapLo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;gapL&quot; min=&quot;1&quot; max=&quot;6&quot; value=&quot;3&quot;&gt;
    &lt;p&gt;Average gap (index): &lt;span class=&quot;out&quot; id=&quot;gapV&quot;&gt;&lt;/span&gt;. &lt;span class=&quot;muted small&quot;&gt;Try it: with minimal lag the gap almost disappears; with fast technology it widens even when institutions “are doing their job”.&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var g=document.getElementById(&#x27;gapG&#x27;),l=document.getElementById(&#x27;gapL&#x27;);
    function draw(){var k=.12+(+g.value)*.035,L=+l.value,N=20,max=Math.exp(k*N)-1,pts=[],rp=[],sum=0;
      function T(t){return (Math.exp(k*t)-1)/max}
      function X(t){return 50+t*26.5}function Y(v){return 260-v*230}
      for(var i=0;i&lt;=200;i++){var t=i/10,rr=T(Math.max(0,Math.floor(t/L)*L-L));
        pts.push(X(t)+&#x27;,&#x27;+Y(T(t)));rp.push(X(t)+&#x27;,&#x27;+Y(rr));sum+=T(t)-rr;}
      document.getElementById(&#x27;gapTech&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+pts.join(&#x27; L&#x27;));
      document.getElementById(&#x27;gapRule&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+rp.join(&#x27; L&#x27;));
      document.getElementById(&#x27;gapArea&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+pts.join(&#x27; L&#x27;)+&#x27; L&#x27;+rp.slice().reverse().join(&#x27; L&#x27;)+&#x27; Z&#x27;);
      document.getElementById(&#x27;gapGo&#x27;).textContent=[&#x27;&#x27;,&#x27;very slow&#x27;,&#x27;slow&#x27;,&#x27;slow&#x27;,&#x27;moderate&#x27;,&#x27;moderate&#x27;,&#x27;sustained&#x27;,&#x27;sustained&#x27;,&#x27;rapid&#x27;,&#x27;rapid&#x27;,&#x27;explosive&#x27;][g.value];
      document.getElementById(&#x27;gapLo&#x27;).textContent=L+(L&gt;1?&#x27; years&#x27;:&#x27; year&#x27;);
      document.getElementById(&#x27;gapV&#x27;).textContent=Math.round(sum/201*100);}
    g.addEventListener(&#x27;input&#x27;,draw);l.addEventListener(&#x27;input&#x27;,draw);draw();
  })();
  &lt;/script&gt;

  &lt;details&gt;&lt;summary&gt;What the slide takes for granted: “geopolitics under the hype”&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;The &lt;em&gt;hype&lt;/em&gt; (media enthusiasm) is about ever more intelligent models. The slide shifts our attention to what lies beneath: &lt;strong&gt;infrastructures&lt;/strong&gt; (who owns data centres, networks, chips), &lt;strong&gt;standards&lt;/strong&gt; (who defines technical norms and therefore what counts as “safe” or “compliant”), &lt;strong&gt;data&lt;/strong&gt; (who collects and owns data), &lt;strong&gt;unequal capacity&lt;/strong&gt; (many countries lack the resources to develop, audit or regulate AI). This is geopolitics in the full sense: competition among states and blocs for control over resources and rules.&lt;/p&gt;
    &lt;p&gt;An example of regulation (not cited in the slides): the European Union has adopted the &lt;em&gt;AI Act&lt;/em&gt;, Regulation (EU) 2024/1689, which classifies systems by level of risk and treats as “high-risk” also those used in the management of critical infrastructures. Text: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2024/1689/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; &lt;span class=&quot;pill&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Case study 10&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. In what sense is AI an “infrastructure challenge”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Because it depends on material inputs (data, minerals, energy, water) and on concentrated physical systems (data centres, supply chains): those who control them hold power, those who depend on them are vulnerable.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What does “Intelligence is not permission” mean?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;That a system&#x27;s technical capacity to act on a critical infrastructure does not confer the legitimacy to do so: authority and responsibility must remain with human beings and institutions that are accountable for it (&lt;em&gt;Human responsibility remains essential&lt;/em&gt;).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. List the four elements of the “geopolitics of AI” according to the slide.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Infrastructures, standards, data, unequal capacity.&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part och&quot; id=&quot;digital&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 11 · Cyberspace and digital identity&lt;/div&gt;
  &lt;h2&gt;Digital spaces: regulating across borders&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 16&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Digital systems cross borders faster than political institutions can regulate them.”&lt;/p&gt;
    &lt;div class=&quot;grid g2&quot;&gt;
      &lt;div&gt;&lt;strong&gt;The problem.&lt;/strong&gt; Digital personas move across jurisdictions. Platforms, states and users do not share the same rules or responsibilities.&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;The geopolitical question.&lt;/strong&gt; Can transnational regulation protect rights while preserving room for democratic governance and technological innovation?&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;“Data Sovereignty refers to the set of obligations and rights established by a series of conventions, rules and laws on the ownership, access, processing and storage of personal data.”&lt;/strong&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Key concepts&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Digital persona&lt;/h4&gt;&lt;p&gt;A person&#x27;s digital identity: accounts, profiles, browsing data, payments, location. It does not reside in a single place: it is copied and processed on servers in different countries.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jurisdiction&lt;/h4&gt;&lt;p&gt;&lt;dfn&gt;Jurisdiction&lt;/dfn&gt; is the territorial scope within which an authority can make and enforce laws. In the digital sphere, the jurisdictions of the user, of the company&#x27;s headquarters and of the location of the servers overlap.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Transnational regulation&lt;/h4&gt;&lt;p&gt;Rules that apply beyond the borders of a single state: international agreements, regional norms (such as those of the EU) or national laws with extraterritorial effect, i.e. applied also to foreign companies processing the data of residents.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Data sovereignty&lt;/h4&gt;&lt;p&gt;In the slide&#x27;s definition, it is a &lt;em&gt;set of obligations and rights&lt;/em&gt; covering four operations on personal data: &lt;em&gt;ownership&lt;/em&gt;, &lt;em&gt;access&lt;/em&gt;, &lt;em&gt;processing&lt;/em&gt; and &lt;em&gt;storage&lt;/em&gt;. It is not simply “the state controls data”: it is about who has rights and who has duties for each operation.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The journey of a piece of data, step by step&lt;/h3&gt;
  &lt;p&gt;A hypothetical example constructed to illustrate “digital personas move across jurisdictions”.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 640 170&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;User&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Italy&lt;/text&gt;
      &lt;rect x=&quot;175&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Platform&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;HQ: country X&lt;/text&gt;
      &lt;rect x=&quot;340&quot; y=&quot;40&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;405&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Data centre&lt;/text&gt;&lt;text x=&quot;405&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;country Y&lt;/text&gt;
      &lt;rect x=&quot;505&quot; y=&quot;40&quot; width=&quot;125&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot;/&gt;&lt;text x=&quot;567&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;AI provider&lt;/text&gt;&lt;text x=&quot;567&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;country Z&lt;/text&gt;
    &lt;/g&gt;
    &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M140,75 L172,75&quot;/&gt;&lt;path d=&quot;M305,75 L337,75&quot;/&gt;&lt;path d=&quot;M470,75 L502,75&quot;/&gt;&lt;/g&gt;
    &lt;text x=&quot;320&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;4 places · at least 4 legal systems · who is responsible?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · User&lt;/span&gt;&lt;p&gt;A student in Italy uploads photos and messages to a social network. Italian and European data protection laws apply to her: she has rights of access, rectification and erasure. But she does not know where her data physically ends up.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;2 · Platform&lt;/span&gt;&lt;p&gt;The company is headquartered in another country, with different rules and different obligations towards local authorities (which may request access to data for security reasons). The platform&#x27;s rules (terms of service) are a third, private layer that overlaps with the law.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;3 · Data centre&lt;/span&gt;&lt;p&gt;The data is stored (&lt;em&gt;storage&lt;/em&gt;) in a third country, perhaps because of energy or cooling costs (link to the &lt;em&gt;inputs&lt;/em&gt; in &lt;a href=&quot;#ai&quot;&gt;case 10&lt;/a&gt;). Some states impose &lt;em&gt;data localisation&lt;/em&gt;, i.e. the requirement that their citizens&#x27; data remain on national territory: a “hard” form of data sovereignty.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;4 · Processing&lt;/span&gt;&lt;p&gt;The data is used (&lt;em&gt;processing&lt;/em&gt;) to train a model by a provider in a fourth country. If something goes wrong (profiling, a data breach), which authority steps in? This is the problem on the slide: “platforms, states and users do not share the same rules or responsibilities”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;b next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n small muted&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The map of data protection laws&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;next slide&quot;&gt;
    &lt;p&gt;Map “Data Protection Laws around the world”, source © 2023 DLA Piper. Circular legend “Regulation &amp;amp; Enforcement” with four levels: &lt;em&gt;Heavy&lt;/em&gt; (red), &lt;em&gt;Robust&lt;/em&gt; (orange), &lt;em&gt;Moderate&lt;/em&gt; (yellow), &lt;em&gt;Limited&lt;/em&gt; (teal); countries without data in grey.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;The classification combines two different things: how strict the law is (&lt;em&gt;regulation&lt;/em&gt;) and how far it is actually enforced (&lt;em&gt;enforcement&lt;/em&gt;, i.e. effective application through inspections and sanctions). Strong laws without enforcement count for little.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Heavy&lt;/button&gt;&lt;button&gt;Robust&lt;/button&gt;&lt;button&gt;Moderate&lt;/button&gt;&lt;button&gt;Limited&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;Extensive rules, strongly enforced. On the 2023 map, those shown in red include the United States, Canada, Mexico, most of the European Union, the United Kingdom, China, South Korea and Australia.&lt;/p&gt;&lt;p&gt;Note: very different systems (EU, USA, China) end up in the same category. “Heavy” measures intensity, not the political model: in one case the protection of the individual prevails, in another state control over data.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Solid regulation with somewhat less intense enforcement. On the map: for example Argentina, Japan, New Zealand, Indonesia, Egypt, some Southeast Asian states.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Laws exist but are less comprehensive or unevenly enforced. On the map: for example Russia, Brazil, many countries in sub-Saharan Africa and the Gulf.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Minimal or recent regulation, little enforcement. On the map: for example India, several Central Asian republics, parts of Eastern and Southern Africa, some Andean countries.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;The country-by-country assignments are read from the 2023 figure and should be checked against DLA Piper&#x27;s updated map (see &lt;a href=&quot;#refs&quot;&gt;Further reading&lt;/a&gt;): laws change frequently.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The trilemma of the geopolitical question&lt;/h3&gt;
  &lt;p&gt;The question on the slide asks us to reconcile three objectives that pull in different directions:&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 520 300&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;polygon points=&quot;260,30 470,260 50,260&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;260&quot; y=&quot;22&quot;&gt;Protect rights&lt;/text&gt;
      &lt;text x=&quot;470&quot; y=&quot;285&quot;&gt;Technological innovation&lt;/text&gt;
      &lt;text x=&quot;55&quot; y=&quot;285&quot;&gt;Democratic governance&lt;/text&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--muted)&quot;&gt;
      &lt;text x=&quot;400&quot; y=&quot;140&quot; style=&quot;fill:var(--muted)&quot;&gt;overly rigid rules&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;156&quot; style=&quot;fill:var(--muted)&quot;&gt;hold back innovation&lt;/text&gt;
      &lt;text x=&quot;115&quot; y=&quot;140&quot; style=&quot;fill:var(--muted)&quot;&gt;rules decided outside&lt;/text&gt;&lt;text x=&quot;115&quot; y=&quot;156&quot; style=&quot;fill:var(--muted)&quot;&gt;national parliaments&lt;/text&gt;
      &lt;text x=&quot;260&quot; y=&quot;240&quot; style=&quot;fill:var(--muted)&quot;&gt;fast innovation that escapes democratic control&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;260&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-family=&quot;Newsreader,serif&quot;&gt;transnational regulation?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Interpretive diagram (not in the slides): each side of the triangle is a tension between two objectives.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;An example of transnational regulation.&lt;/strong&gt; The EU General Data Protection Regulation (GDPR, Regulation (EU) 2016/679) also applies to companies outside the EU that process data of people located in the EU: it is the classic example of a regional norm with extraterritorial effects. It is not cited in the slides. Text: &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2016/679/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Case study 11&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Which four operations on data appear in the definition of data sovereignty?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;&lt;em&gt;Ownership, access, processing, storage&lt;/em&gt; of personal data, governed by conventions, rules and laws that establish obligations and rights.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Why do both “regulation” and “enforcement” matter in the DLA Piper map?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Because a law may be strict on paper but not applied: the actual level of protection depends on the combination of rules and the capacity/willingness to enforce them.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. What is the slide&#x27;s “problem” in one sentence?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Digital identities cross multiple jurisdictions, and platforms, states and users do not share the same rules or the same responsibilities: digital systems cross borders faster than institutions can regulate them.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part bri&quot; id=&quot;indig&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Case study 12 · Planetary equity&lt;/div&gt;
  &lt;h2&gt;Indigenous perspectives: another idea of sustainability&lt;/h2&gt;

  &lt;div class=&quot;slide&quot; data-p=&quot;slide 18&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Sustainability changes when the object of governance is not only the economy, but relationships among people, land and non-human life.”&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;: local and intergenerational knowledge · &lt;strong&gt;Authority&lt;/strong&gt;: community-led decision-making · &lt;strong&gt;Justice&lt;/strong&gt;: recognition of rights and histories · &lt;strong&gt;Resilience&lt;/strong&gt;: adaptation rooted in place.&lt;/p&gt;
    &lt;p&gt;&lt;em&gt;“Planetary equity requires more than adding local voices to existing institutions. It can require changing the institutions themselves.”&lt;/em&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;&lt;dfn&gt;Planetary equity&lt;/dfn&gt; is the idea that environmental justice must be conceived on a global scale and across generations: who caused the problems, who suffers their effects, who has a voice in the solutions. The slide shifts the &lt;em&gt;object of governance&lt;/em&gt;: what is governed is not only “the economy” (growth, production, emissions) but the &lt;strong&gt;relationships&lt;/strong&gt; among people, land and non-human life.&lt;/p&gt;

  &lt;div class=&quot;grid g4&quot;&gt;
    &lt;div class=&quot;card sal&quot;&gt;&lt;h4&gt;Knowledge&lt;/h4&gt;&lt;p&gt;Local and intergenerational knowledge: observations accumulated over centuries about a specific place, transmitted orally and through practice.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card sla&quot;&gt;&lt;h4&gt;Authority&lt;/h4&gt;&lt;p&gt;Decisions taken by the community (&lt;em&gt;community-led&lt;/em&gt;), not merely “consulted” by others.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card och&quot;&gt;&lt;h4&gt;Justice&lt;/h4&gt;&lt;p&gt;Recognising rights &lt;em&gt;and&lt;/em&gt; histories: past expropriation, colonisation and exclusion weigh on today&#x27;s choices.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Resilience&lt;/h4&gt;&lt;p&gt;Adaptive capacity &lt;em&gt;rooted in place&lt;/em&gt;, not imported standard solutions.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;details open&gt;&lt;summary&gt;“Adding voices” or “changing institutions”? The key difference&lt;/summary&gt;&lt;div&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Adding local voices&lt;/th&gt;&lt;th&gt;Changing institutions&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Who decides&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;The existing institution, after listening&lt;/td&gt;&lt;td&gt;The community too, with its own powers&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Local knowledge is one “input” among many&lt;/td&gt;&lt;td&gt;Local knowledge is a recognised basis for decision-making&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Public consultation on a park management plan&lt;/td&gt;&lt;td&gt;Co-management or Indigenous management with a right of veto or consent&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Risk&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Token participation (&lt;em&gt;tokenism&lt;/em&gt;)&lt;/td&gt;&lt;td&gt;Jurisdictional conflicts with the state, lengthy processes&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The Indigenous Systems Framework&lt;/h3&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 8 (figure)&quot;&gt;
    &lt;p&gt;“Indigenous Systems Framework — Analytical Lenses for Interpreting Indigenous Systems”. Source: Humanculture / Stephanie Zabriskie. At the centre: &lt;em&gt;Indigenous Systems of Life&lt;/em&gt; with five values: &lt;em&gt;Relationality, Kinship Responsibility, Spiritual Relationship to Land, Intergenerational Responsibility, Reciprocity&lt;/em&gt;. Around it, eight analytical lenses. On the right: &lt;strong&gt;Legitimacy versus Legality → Empowerment&lt;/strong&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Click an element of the wheel for an explanation. The inner circle shows the &lt;em&gt;values&lt;/em&gt; that hold the system together; the outer ring shows the &lt;em&gt;domains&lt;/em&gt; in which to observe them (the “lenses” through which to analyse a concrete case).&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 460 460&quot; class=&quot;wheel&quot; id=&quot;wheel&quot; aria-label=&quot;Indigenous Systems Framework wheel&quot;&gt;&lt;/svg&gt;
  &lt;figcaption id=&quot;wheelOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Click a sector or a value.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;script&gt;
  (function(){
    var outer=[[&#x27;Governance &amp; Decision-Making&#x27;,&#x27;how the community makes collective decisions, through which institutions (councils, elders, assemblies) and with what legitimacy.&#x27;],
      [&#x27;Ecological Stewardship&#x27;,&#x27;active care of the ecosystem: not leaving nature “untouched”, but managing it through rules on harvesting, fire and rotation.&#x27;],
      [&#x27;Land &amp; Resource Systems&#x27;,&#x27;regimes of access to and use of land, often collective and customary, which state law does not always recognise.&#x27;],
      [&#x27;Knowledge &amp; Learning&#x27;,&#x27;how knowledge is produced and transmitted: orality, practice, apprenticeship across generations.&#x27;],
      [&#x27;Livelihood &amp; Production&#x27;,&#x27;means of subsistence: pastoralism, agriculture, fishing, gathering, crafts. Linked to the food systems of case 9.&#x27;],
      [&#x27;Climate Adaptation&#x27;,&#x27;strategies for adapting to droughts, floods and seasonal changes, based on long-term local observation.&#x27;],
      [&#x27;Cultural Continuity&#x27;,&#x27;language, rituals, memory: culture as the social infrastructure that makes the other functions possible.&#x27;],
      [&#x27;Health &amp; Wellbeing&#x27;,&#x27;health understood in a broad sense, tied to the territory, to food and to community relationships.&#x27;]];
    var inner=[[&#x27;Relationality&#x27;,&#x27;everything is defined by relationships (people, land, species), not by isolated individuals.&#x27;],
      [&#x27;Kinship Responsibility&#x27;,&#x27;obligations towards kin, extended also to land and non-humans: nature as a relative, not as a resource.&#x27;],
      [&#x27;Spiritual Relationship to Land&#x27;,&#x27;land has spiritual and identity value, not only economic value: this is why it cannot always be “compensated” with money.&#x27;],
      [&#x27;Intergenerational Responsibility&#x27;,&#x27;decisions are answerable to future and past generations as well.&#x27;],
      [&#x27;Reciprocity&#x27;,&#x27;taking implies giving back: a principle of balanced exchange with the community and with the environment.&#x27;]];
    var s=&#x27;&#x27;,cx=230,cy=230,R1=220,R0=140,n=outer.length;
    function p(r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
    outer.forEach(function(o,i){var a0=-Math.PI/2-Math.PI/4+i*2*Math.PI/n+.01,a1=a0+2*Math.PI/n-.02,
      A=p(R1,a0),B=p(R1,a1),C=p(R0,a1),D=p(R0,a0),m=(a0+a1)/2,T=p((R1+R0)/2,m),
      h=[150,165,180,210,230,200,175,155][i],L=[48,44,40,42,44,46,50,52][i];
      s+=&#x27;&lt;g data-title=&quot;&#x27;+o[0]+&#x27;&quot; data-info=&quot;&#x27;+o[1].replace(/&quot;/g,&#x27;&amp;quot;&#x27;)+&#x27;&quot; data-target=&quot;wheelOut&quot;&gt;&lt;path d=&quot;M&#x27;+A+&#x27; A&#x27;+R1+&#x27;,&#x27;+R1+&#x27; 0 0 1 &#x27;+B+&#x27; L&#x27;+C+&#x27; A&#x27;+R0+&#x27;,&#x27;+R0+&#x27; 0 0 0 &#x27;+D+&#x27; Z&quot; fill=&quot;oklch(&#x27;+L+&#x27;% 0.07 &#x27;+h+&#x27;)&quot;/&gt;&#x27;;
      var w=o[0].split(&#x27; &amp; &#x27;);s+=&#x27;&lt;text text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:#fff;pointer-events:none&quot;&gt;&#x27;;
      w.forEach(function(t,j){s+=&#x27;&lt;tspan x=&quot;&#x27;+T[0]+&#x27;&quot; y=&quot;&#x27;+(T[1]+(j-(w.length-1)/2)*15+4)+&#x27;&quot;&gt;&#x27;+t+(j&lt;w.length-1?&#x27; &amp;amp;&#x27;:&#x27;&#x27;)+&#x27;&lt;/tspan&gt;&#x27;});s+=&#x27;&lt;/text&gt;&lt;/g&gt;&#x27;;});
    s+=&#x27;&lt;circle cx=&quot;230&quot; cy=&quot;230&quot; r=&quot;134&quot; fill=&quot;oklch(58% 0.11 75)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;225&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:#fff&quot;&gt;Indigenous&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;243&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; style=&quot;fill:#fff&quot;&gt;Systems of Life&lt;/text&gt;&#x27;;
    inner.forEach(function(o,i){var a=-Math.PI/2+i*2*Math.PI/5,c=p(88,a),w=o[0].split(&#x27; &#x27;);
      s+=&#x27;&lt;g data-title=&quot;&#x27;+o[0]+&#x27;&quot; data-info=&quot;&#x27;+o[1].replace(/&quot;/g,&#x27;&amp;quot;&#x27;)+&#x27;&quot; data-target=&quot;wheelOut&quot;&gt;&lt;circle class=&quot;seg&quot; cx=&quot;&#x27;+c[0]+&#x27;&quot; cy=&quot;&#x27;+c[1]+&#x27;&quot; r=&quot;38&quot; fill=&quot;oklch(36% 0.06 60)&quot;/&gt;&lt;text text-anchor=&quot;middle&quot; font-size=&quot;10&quot; style=&quot;fill:#fff;pointer-events:none&quot;&gt;&#x27;;
      var lines=w.length&gt;2?[w.slice(0,Math.ceil(w.length/2)).join(&#x27; &#x27;),w.slice(Math.ceil(w.length/2)).join(&#x27; &#x27;)]:w;
      lines.forEach(function(t,j){s+=&#x27;&lt;tspan x=&quot;&#x27;+c[0]+&#x27;&quot; y=&quot;&#x27;+(c[1]+(j-(lines.length-1)/2)*12+3)+&#x27;&quot;&gt;&#x27;+t+&#x27;&lt;/tspan&gt;&#x27;});s+=&#x27;&lt;/text&gt;&lt;/g&gt;&#x27;;});
    document.getElementById(&#x27;wheel&#x27;).innerHTML=s;
  })();
  &lt;/script&gt;

  &lt;h3&gt;Legitimacy versus legality → empowerment&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Legality&lt;/button&gt;&lt;button&gt;Legitimacy&lt;/button&gt;&lt;button&gt;Empowerment&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;&lt;dfn&gt;Legality&lt;/dfn&gt; is conformity with the formal law of the state: property titles, concessions, permits. A mine or a park can be perfectly legal.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;dfn&gt;Legitimacy&lt;/dfn&gt; is the recognition, by those subject to a power or a rule, that it is just. A community may have governed a territory for centuries with full legitimacy but without legal title; conversely, a legal concession may be perceived as illegitimate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;dfn&gt;Empowerment&lt;/dfn&gt; (strengthening the capacity to act) is the arrow on the slide: closing the distance between legitimacy and legality by giving communities rights, resources and an effective voice, i.e. transforming de facto legitimacy into recognised power. It is the shift from “adding voices” to “changing institutions”.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 600 170&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;circle cx=&quot;210&quot; cy=&quot;80&quot; r=&quot;70&quot; fill=&quot;var(--sla)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--sla)&quot;/&gt;
    &lt;circle cx=&quot;330&quot; cy=&quot;80&quot; r=&quot;70&quot; fill=&quot;var(--bri)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--bri)&quot;/&gt;
    &lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;84&quot;&gt;Legality&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;84&quot;&gt;Legitimacy&lt;/text&gt;
    &lt;text x=&quot;270&quot; y=&quot;78&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;accepted&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;93&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;rules&lt;/text&gt;&lt;/g&gt;
    &lt;path d=&quot;M440,80 L500,80&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;text x=&quot;545&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--acc)&quot;&gt;Empowerment&lt;/text&gt;
    &lt;text x=&quot;270&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--muted)&quot;&gt;The aim is to widen the zone in which rules are both legal and legitimate&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;ext&quot;&gt;&lt;p&gt;&lt;strong&gt;Reference instrument.&lt;/strong&gt; The &lt;em&gt;United Nations Declaration on the Rights of Indigenous Peoples&lt;/em&gt; (UNDRIP), adopted by the General Assembly in resolution 61/295 of 13 September 2007, provides for &lt;em&gt;free, prior and informed consent&lt;/em&gt; (FPIC), for example before relocation from their lands (art. 10) and before legislative measures affecting Indigenous peoples (art. 19). It is the legal instrument closest to the idea of transforming legitimacy into legality. It is not cited in the slides. Text: &lt;a href=&quot;https://www.justice.gc.ca/eng/declaration/decl_doc.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;full text (Department of Justice Canada)&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Case study 12&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. What changes when the “object of governance” is not only the economy?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;What is governed are the relationships among people, land and non-human life: local knowledge, community authority, justice (rights and histories) and place-based resilience become central, not just growth and efficiency.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Why may “adding local voices” not be enough?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Because if institutions remain the same, those who decide remain the same: participation risks being merely consultative or tokenistic. &lt;em&gt;Planetary equity&lt;/em&gt; may require changing the institutions themselves (powers, rules, decision-making venues).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Give an example of a situation that is legal but not legitimate.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;A mining concession or a protected area established under state law on a territory that a community has governed for generations without formal title and without having approved it.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part acc&quot; id=&quot;synth&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Cross-case synthesis&lt;/div&gt;
  &lt;h2&gt;What the cases have in common&lt;/h2&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 20&quot;&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Transitions redistribute power&lt;/strong&gt; — New infrastructures and resources create new dependencies&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Scale matters&lt;/strong&gt; — Local impacts are tied to global markets and institutions&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Justice is geopolitical&lt;/strong&gt; — Distribution of costs and benefits shapes cooperation&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Institutions lag behind change&lt;/strong&gt; — Rules remain fragmented while systems are connected&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Security is expanding&lt;/strong&gt; — Environmental change enters defence, finance and technology policy&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
  &lt;p&gt;A &lt;dfn&gt;transition&lt;/dfn&gt; is the shift from one system to another: energy, digital, ecological. The lecture&#x27;s thesis is that no transition is neutral: it shifts power and creates winners and losers. Click a cell to see how each principle applies to each case.&lt;/p&gt;

  &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;matrix&quot;&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;9 · Biodiversity&lt;/th&gt;&lt;th&gt;10 · AI&lt;/th&gt;&lt;th&gt;11 · Digital&lt;/th&gt;&lt;th&gt;12 · Indigenous&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;1 · Power&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Biodiversity&quot; data-info=&quot;Whoever establishes a protected area acquires control over the territory; communities may become dependent on external agencies or funders.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × AI&quot; data-info=&quot;Data centres, chips and critical minerals create new dependencies on a few countries and companies.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Digital&quot; data-info=&quot;Platforms become quasi-state actors: they set rules (terms of service) for billions of people.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Power × Indigenous&quot; data-info=&quot;The green transition (e.g. mines for batteries, new parks) can shift power away from communities or, through empowerment, towards them.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;2 · Scale&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Biodiversity&quot; data-info=&quot;A global target (e.g. 30% protected areas) translates into concrete boundaries in specific villages; global food markets drive the conversion of local habitats.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × AI&quot; data-info=&quot;A model trained elsewhere makes decisions about a local water network; the water used by a data centre is taken from a local basin.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Digital&quot; data-info=&quot;A single user&#x27;s data circulates on a global scale across different jurisdictions.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Scale × Indigenous&quot; data-info=&quot;Resilience is “rooted in place”, but the pressures (climate, markets, concessions) come from the global scale.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;3 · Justice&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Biodiversity&quot; data-info=&quot;Global benefits, local costs: the question “who bears the costs?” is at the heart of the case.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × AI&quot; data-info=&quot;Unequal capacity: those without infrastructure and expertise are subject to standards decided by others.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Digital&quot; data-info=&quot;Data protection ranges from heavy to limited: the same right is worth a lot or very little depending on where one lives.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Justice × Indigenous&quot; data-info=&quot;Recognition of rights and histories: justice includes redress for past exclusions.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;4 · Lag&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Biodiversity&quot; data-info=&quot;Protection regimes are fragmented by state, while species, rivers and oceans are connected.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × AI&quot; data-info=&quot;The governance gap: technology already acts on critical infrastructures, the rules come later.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Digital&quot; data-info=&quot;“Digital systems cross borders faster than political institutions can regulate them.”&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Lag × Indigenous&quot; data-info=&quot;State institutions do not recognise customary forms of governance: legitimacy without legality.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;th class=&quot;rh&quot;&gt;5 · Security&lt;/th&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Biodiversity&quot; data-info=&quot;Food security and control over natural resources become strategic issues.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × AI&quot; data-info=&quot;AI in critical infrastructures: a defence issue (the AIGN image mentions a NATO-supported workshop).&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Digital&quot; data-info=&quot;Data sovereignty and localisation as instruments of national security.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;
      &lt;td&gt;&lt;button data-target=&quot;mxOut&quot; data-title=&quot;Security × Indigenous&quot; data-info=&quot;Security understood as community resilience to climate and external pressures, not only as military defence.&quot;&gt;view&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p id=&quot;mxOut&quot; class=&quot;box&quot; style=&quot;font-size:.95rem&quot;&gt;Click a “view” cell.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;The cells are reasoned applications of the principles to the cases, written for study purposes: the slide lists only the five principles.&lt;/p&gt;

  &lt;details&gt;&lt;summary&gt;What the slide takes for granted: “security is expanding”&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;In the tradition of International Relations, &lt;em&gt;security&lt;/em&gt; was primarily military. The fifth point describes a broadening: climate, resources, technology and finance are treated as security issues. The risk, discussed in the literature as &lt;span class=&quot;term&quot;&gt;securitisation&lt;/span&gt; (presenting an issue as an existential threat in order to justify extraordinary measures), is that the environment comes to be managed through the logic of emergency and defence, reducing transparency and participation.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Synthesis&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Reconstruct the five principles with their explanations.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Transitions redistribute power (new dependencies) · Scale matters (local tied to global) · Justice is geopolitical (the distribution of costs and benefits shapes cooperation) · Institutions lag behind change (fragmented rules, connected systems) · Security is expanding (the environment enters defence, finance and technology policy).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Apply “institutions lag behind change” to case 11.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Data crosses jurisdictions in real time, while data protection laws remain national or regional and differ widely from one another (DLA Piper map): fragmented rules, connected system.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part acc&quot; id=&quot;coop&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;From diagnosis to collective action&lt;/div&gt;
  &lt;h2&gt;The cooperation problem&lt;/h2&gt;
  &lt;div class=&quot;slide&quot; data-p=&quot;slide 21&quot;&gt;
    &lt;p class=&quot;lead&quot; style=&quot;margin-top:0&quot;&gt;“Global challenges create shared exposure, but political incentives remain uneven.”&lt;/p&gt;
    &lt;div class=&quot;grid g2&quot;&gt;
      &lt;div&gt;&lt;strong&gt;WHY COOPERATION IS DIFFICULT&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Shared risks&lt;/li&gt;&lt;li&gt;Unequal responsibility&lt;/li&gt;&lt;li&gt;Different capacities&lt;/li&gt;&lt;li&gt;Competing time horizons&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;WHY COOPERATION REMAINS NECESSARY&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Fragmented institutions&lt;/li&gt;&lt;li&gt;Strategic rivalry&lt;/li&gt;&lt;li&gt;Short-term political pressure&lt;/li&gt;&lt;li&gt;Weak accountability&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;strong&gt;A note on reading this slide.&lt;/strong&gt; As laid out, the two columns seem somewhat inconsistent with their headings: &lt;em&gt;fragmented institutions&lt;/em&gt;, &lt;em&gt;strategic rivalry&lt;/em&gt;, &lt;em&gt;short-term pressure&lt;/em&gt; and &lt;em&gt;weak accountability&lt;/em&gt; are typically &lt;em&gt;obstacles&lt;/em&gt; to cooperation, whereas &lt;em&gt;shared risks&lt;/em&gt; are the reason why cooperation is necessary. The labels may have been swapped, or the slide may call for a subtler reading (see below). Check with the lecturer or with your lecture notes.&lt;/div&gt;

  &lt;p&gt;&lt;dfn&gt;Collective action&lt;/dfn&gt; refers to situations in which an outcome beneficial to all requires the contribution of many, but each actor has an incentive to let others contribute (&lt;span class=&quot;term&quot;&gt;free riding&lt;/span&gt;). Climate and biodiversity are &lt;span class=&quot;term&quot;&gt;global public goods&lt;/span&gt;: no one can be excluded from the benefits, so paying the costs offers little advantage to any single actor.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tabbar&quot;&gt;&lt;button aria-selected=&quot;true&quot;&gt;Shared exposure&lt;/button&gt;&lt;button&gt;Uneven incentives&lt;/button&gt;&lt;button&gt;One reading of the two columns&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel on&quot;&gt;&lt;p&gt;Everyone is exposed (&lt;em&gt;shared risks&lt;/em&gt;): heatwaves, biodiversity loss, attacks on digital infrastructures. But shared exposure does not mean equal exposure: the poorest are the most vulnerable.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Political incentives are uneven: &lt;em&gt;unequal responsibility&lt;/em&gt; (who has emitted or exploited the most), &lt;em&gt;different capacities&lt;/em&gt; (who can pay and innovate), &lt;em&gt;competing time horizons&lt;/em&gt; (governments respond to electoral cycles of a few years, while environmental problems unfold over decades).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;The right-hand column can be read as follows: precisely because institutions are fragmented, rivalry is strategic, politics is short-term and accountability is weak, &lt;em&gt;no actor can solve&lt;/em&gt; the problems alone; therefore cooperation remains necessary. The left-hand column explains why it is difficult: shared risks but different responsibilities, capacities and horizons make it hard to agree on who does what. This is one possible reading, not one explicitly given by the slide.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Simulator: the public goods dilemma&lt;/h3&gt;
  &lt;p&gt;A classic teaching model (&lt;span class=&quot;term&quot;&gt;public goods game&lt;/span&gt;), not taken from the slides. Ten countries; those who cooperate pay a cost; the sum of the contributions is multiplied (the collective benefit) and divided among &lt;em&gt;all&lt;/em&gt;, including those who did not pay.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgK&quot;&gt;Cooperating countries: &lt;span class=&quot;out&quot; id=&quot;pgKo&quot;&gt;&lt;/span&gt; out of 10&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgK&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgC&quot;&gt;Cost of cooperation per country: &lt;span class=&quot;out&quot; id=&quot;pgCo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgC&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;
    &lt;label class=&quot;rl&quot; for=&quot;pgR&quot;&gt;Collective benefit multiplier: &lt;span class=&quot;out&quot; id=&quot;pgRo&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;pgR&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;.5&quot; value=&quot;3&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 190&quot; aria-label=&quot;Payoffs of cooperators, non-cooperators and the group&quot;&gt;&lt;g id=&quot;pgBars&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;p id=&quot;pgTxt&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (function(){
    var k=document.getElementById(&#x27;pgK&#x27;),c=document.getElementById(&#x27;pgC&#x27;),r=document.getElementById(&#x27;pgR&#x27;),N=10;
    function draw(){var K=+k.value,C=+c.value,R=+r.value,share=K*C*R/N,coop=share-C,free=share,tot=K*coop+(N-K)*free,totAll=N*(C*R-C);
      document.getElementById(&#x27;pgKo&#x27;).textContent=K;document.getElementById(&#x27;pgCo&#x27;).textContent=C;document.getElementById(&#x27;pgRo&#x27;).textContent=&#x27;×&#x27;+R;
      var rows=[[&#x27;Cooperators&#x27;,K?coop:null,&#x27;var(--sal)&#x27;],[&#x27;Non-cooperators&#x27;,K&lt;N?free:null,&#x27;var(--bri)&#x27;],[&#x27;Group average&#x27;,tot/N,&#x27;var(--sla)&#x27;],[&#x27;Average if all cooperate&#x27;,totAll/N,&#x27;var(--acc)&#x27;]];
      var mx=Math.max(10,Math.abs(totAll/N),free,Math.abs(coop)),z=330,s=230/mx;
      document.getElementById(&#x27;pgBars&#x27;).innerHTML=&#x27;&lt;line x1=&quot;&#x27;+z+&#x27;&quot; y1=&quot;0&quot; x2=&quot;&#x27;+z+&#x27;&quot; y2=&quot;180&quot; stroke=&quot;var(--muted)&quot;/&gt;&#x27;+rows.map(function(o,i){var y=10+i*44,v=o[1];
        if(v===null)return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+o[0]+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(z+8)+&#x27;&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;13&quot; style=&quot;fill:var(--muted)&quot;&gt;none&lt;/text&gt;&#x27;;
        var w=Math.abs(v)*s,x=v&lt;0?z-w:z;
        return &#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;14&quot;&gt;&#x27;+o[0]+&#x27;&lt;/text&gt;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;28&quot; rx=&quot;4&quot; fill=&quot;&#x27;+o[2]+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(v&lt;0?x-6:x+w+6)+&#x27;&quot; y=&quot;&#x27;+(y+20)+&#x27;&quot; font-size=&quot;13&quot; text-anchor=&quot;&#x27;+(v&lt;0?&#x27;end&#x27;:&#x27;start&#x27;)+&#x27;&quot;&gt;&#x27;+(Math.round(v*10)/10)+&#x27;&lt;/text&gt;&#x27;}).join(&#x27;&#x27;);
      var t;if(R&lt;=1)t=&#x27;With a multiplier ≤ 1, cooperation creates no value: there is no dilemma, it simply does not pay.&#x27;;
      else if(R&gt;=N)t=&#x27;With a multiplier ≥ 10, each country recovers more than it pays: cooperation pays off even individually, and the problem disappears.&#x27;;
      else t=&#x27;Dilemma: non-cooperators always earn &#x27;+C+&#x27; more than cooperators, so each is tempted not to contribute; yet if everyone cooperates, each obtains &#x27;+(Math.round(totAll/N*10)/10)+&#x27;, more than in any other situation. This is why “shared exposure” is not enough: individual incentives remain misaligned.&#x27;;
      document.getElementById(&#x27;pgTxt&#x27;).textContent=t;}
    [k,c,r].forEach(function(e){e.addEventListener(&#x27;input&#x27;,draw)});draw();
  })();
  &lt;/script&gt;
  &lt;p&gt;Link to the slide: &lt;em&gt;unequal responsibility&lt;/em&gt; and &lt;em&gt;different capacities&lt;/em&gt; mean that in reality costs are not equal for everyone (a poor country pays relatively more); &lt;em&gt;competing time horizons&lt;/em&gt; means that the benefit arrives decades later, while the cost is immediate. Both worsen the dilemma in the model.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment · Cooperation problem&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Explain “shared exposure, uneven incentives”.&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;Everyone is exposed to global risks, but the costs of action, historical responsibilities, capacities and governments&#x27; time horizons differ: political incentives to cooperate are not evenly distributed.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What are “competing time horizons”?&lt;/p&gt;&lt;button class=&quot;b&quot;&gt;Show answer&lt;/button&gt;
      &lt;div class=&quot;ans&quot;&gt;The contrast between the timescales of politics (electoral cycles, short-term pressures) and the long timescales of environmental and technological problems, where the benefits of prevention only materialise years later.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;question&quot; style=&quot;background:var(--ink);color:var(--paper)&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--paper);opacity:.7&quot;&gt;Challenges in a world in transition · the central question&lt;/div&gt;
