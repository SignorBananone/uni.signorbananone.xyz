      &lt;ul&gt;

        &lt;li&gt;&lt;b&gt;Intersectionality&lt;/b&gt;: memberships (gender, ethnicity, class, age…) intersect, and their effects add up or multiply. It reappears here in the COVID-19 case and in &lt;em&gt;cumulative discrimination&lt;/em&gt;.&lt;/li&gt;

&lt;!-- ============ PART 1 ============ --&gt;
&lt;section id=&quot;p1&quot; class=&quot;part p-sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Part 1 · Stratification&lt;/div&gt;
    &lt;h2&gt;How individuals and groups are ranked&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;The starting question of slide 3: &lt;em&gt;“How do we rank individuals (or groups) in society?”&lt;/em&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social stratification&lt;/b&gt;: society is organised as a series of superimposed strata, that is, hierarchical positions that give unequal access to valued resources such as income, wealth, prestige and power. Like the layers of a rock, they are stable, but not immobile.&lt;/div&gt;

  &lt;h3 id=&quot;s-class&quot;&gt;Social class and social status &lt;span class=&quot;slides&quot;&gt;slide 3&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;To rank people, the course uses two criteria: &lt;span class=&quot;term&quot;&gt;social class&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;social status&lt;/span&gt;. In the working definition of the slides, social class is a &lt;b&gt;hierarchy based on occupation&lt;/b&gt;, that is, on a person&#x27;s profession or position in employment.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Marx &amp;amp; Engels&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Class vs status&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Why occupation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;For &lt;b&gt;Marx and Engels&lt;/b&gt; the decisive classes were two: the &lt;span class=&quot;term&quot;&gt;capitalists&lt;/span&gt; and the &lt;span class=&quot;term&quot;&gt;laborers&lt;/span&gt; (wage workers). Industrialisation brought with it an unequal distribution: on one side, wealthy entrepreneurs who own factories and machines, i.e. &lt;em&gt;capital&lt;/em&gt;; on the other, workers who labor for a low income. This is why capitalists occupy more advantageous class positions.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 270&quot; role=&quot;img&quot; aria-label=&quot;Marx&#x27;s two-class model&quot;&gt;
          &lt;rect x=&quot;170&quot; y=&quot;14&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;cb cs&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Capitalists&lt;/text&gt;
          &lt;text x=&quot;280&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;own the capital: factories, machines&lt;/text&gt;
          &lt;rect x=&quot;40&quot; y=&quot;170&quot; width=&quot;480&quot; height=&quot;86&quot; rx=&quot;10&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Laborers&lt;/text&gt;
          &lt;text x=&quot;280&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;own only their own labor&lt;/text&gt;
          &lt;g class=&quot;c&quot;&gt;
            &lt;circle cx=&quot;110&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;140&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;170&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;230&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;330&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;360&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;390&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;450&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;
          &lt;/g&gt;
          &lt;path d=&quot;M215 166 V92&quot; class=&quot;inks&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;
          &lt;path d=&quot;M345 92 V166&quot; class=&quot;acs&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
          &lt;text x=&quot;205&quot; y=&quot;132&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot;&gt;labor&lt;/text&gt;
          &lt;text x=&quot;355&quot; y=&quot;132&quot; font-size=&quot;13&quot; class=&quot;ac&quot;&gt;low wages&lt;/text&gt;
          &lt;text x=&quot;400&quot; y=&quot;54&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;→ profit&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Few owners of capital, many workers: the value produced by labor flows upward to those who own the means of production, while those at the bottom receive low wages.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt;The slides name &lt;em&gt;social class&lt;/em&gt; and &lt;em&gt;social status&lt;/em&gt; without defining the latter. The classic sociological distinction, which goes back to Max Weber, is as follows:&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social class&lt;/h4&gt;&lt;b&gt;Economic&lt;/b&gt; position: it depends on what you own and what work you do (occupation, income, property). It concerns the &lt;em&gt;life chances&lt;/em&gt; that the market offers you.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social status&lt;/h4&gt;Position of &lt;b&gt;prestige&lt;/b&gt;: how much honour and respect society accords to a group or a lifestyle. A priest or a teacher may enjoy high status on a middle income.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;The two scales often coincide, but not always: the nouveau riche may hold a high class position while their prestige remains contested.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Why &lt;span class=&quot;term&quot;&gt;occupation&lt;/span&gt; in particular? Because in modern societies work is the main channel through which income, security, prestige and social networks are obtained. For this reason, a person&#x27;s occupation is a good summary of their position. Work returns in Part 4: &lt;em&gt;human capital&lt;/em&gt; serves precisely to secure a better position in the &lt;em&gt;labor market&lt;/em&gt;.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;Internal link within the lecture: social class (slide 3) → human capital and job outcomes (slide 17).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-income&quot;&gt;Income and wealth: the social ladder of money &lt;span class=&quot;slides&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Individuals and groups can be arranged along a hierarchy, a &lt;em&gt;social ladder&lt;/em&gt;, chiefly on the basis of &lt;span class=&quot;term&quot;&gt;income&lt;/span&gt; and &lt;span class=&quot;term&quot;&gt;wealth&lt;/span&gt;. Slide 4 poses the key question: &lt;em&gt;how stratified is a society with respect to this valued good?&lt;/em&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Income&lt;/h4&gt;A &lt;b&gt;flow&lt;/b&gt;: what comes in over a period of time (salaries, pensions, rents received, interest). It is measured “per year”.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Wealth&lt;/h4&gt;A &lt;b&gt;stock&lt;/b&gt;: what you own at a given moment (home, savings, shares) minus debts. It accumulates and is inherited.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt;Wealth is generally distributed far more unequally than income, because it accumulates over time and passes from one generation to the next. This is a direct link to the &lt;em&gt;intergenerational transmission&lt;/em&gt; discussed in Part 3.&lt;/p&gt;

  &lt;h3 id=&quot;s-gini&quot;&gt;The Gini coefficient &lt;span class=&quot;slides&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;Gini coefficient&lt;/span&gt; summarises in a single number &lt;b&gt;the overall stratification&lt;/b&gt; of a society.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;0 = perfect equality&lt;/h4&gt;Everyone in the country has the same income (or the same wealth).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;100 = maximum inequality&lt;/h4&gt;All income (or all wealth) is in the hands of a single person.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;How is it calculated? The slides do not say, but it helps in understanding it. People are lined up from poorest to richest and the &lt;span class=&quot;term&quot;&gt;Lorenz curve&lt;/span&gt; is drawn: for each share of the population, starting from the bottom, it shows what share of total income that group holds. If everyone had the same income, the curve would coincide with the diagonal.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;G = A ⁄ (A + B) = 2A &amp;nbsp; &lt;span class=&quot;small muted&quot;&gt;(× 100 for the 0–100 scale)&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;A is the area between the diagonal and the Lorenz curve; A + B is the whole triangle below the diagonal, whose area is ½. The more the curve “bows”, the larger A becomes and the higher the Gini.&lt;/p&gt;

  &lt;figure&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:0;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 320&quot; role=&quot;img&quot; aria-label=&quot;Interactive Lorenz curve&quot;&gt;
        &lt;rect x=&quot;30&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;260&quot; fill=&quot;none&quot; class=&quot;rl&quot; stroke-width=&quot;1&quot;/&gt;
        &lt;polygon id=&quot;larea&quot; class=&quot;cb&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;290&quot; x2=&quot;290&quot; y2=&quot;30&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;polyline id=&quot;lcurve&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle id=&quot;lpt&quot; r=&quot;5&quot; class=&quot;ac&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;cumulative % of population (poorest first) →&lt;/text&gt;
        &lt;text x=&quot;14&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot; transform=&quot;rotate(-90 14 160)&quot;&gt;cumulative % of income →&lt;/text&gt;
        &lt;text x=&quot;200&quot; y=&quot;110&quot; font-size=&quot;11&quot; class=&quot;mut&quot; transform=&quot;rotate(-45 200 110)&quot;&gt;perfect equality&lt;/text&gt;
        &lt;text id=&quot;lA&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; class=&quot;c&quot;&gt;A&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;p style=&quot;margin-top:0&quot;&gt;&lt;b&gt;Try it yourself.&lt;/b&gt; A simplified society with two groups: the rich (at the top) and everyone else. Within each group, everyone has the same income.&lt;/p&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lp&quot;&gt;Share of population that is “rich”&lt;/label&gt;&lt;input id=&quot;lp&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;50&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;lpo&quot;&gt;10%&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ls&quot;&gt;Share of income it holds&lt;/label&gt;&lt;input id=&quot;ls&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;lso&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;readout&quot;&gt;&lt;span class=&quot;big&quot; id=&quot;lg&quot;&gt;30&lt;/span&gt; &lt;span&gt;Gini&lt;/span&gt;&lt;br&gt;&lt;span id=&quot;ltxt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;With two internally homogeneous groups, the Gini reduces to &lt;b&gt;G = s − p&lt;/b&gt;, i.e. the income share of the rich minus their population share. With the example from slide 6 (10% hold 40% of income) the result is &lt;b&gt;30&lt;/b&gt;. In reality, differences within groups raise the value.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Income stratification around the world &lt;span class=&quot;slides&quot;&gt;slide 7&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The table on slide 7 (source: World Bank, 2017b) compares income Gini coefficients across countries. Filter by continent or sort the values.&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;btns&quot; id=&quot;gfilt&quot;&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;true&quot; data-r=&quot;all&quot;&gt;All&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;North America&quot;&gt;North America&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;South America&quot;&gt;South America&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Asia&quot;&gt;Asia&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Africa&quot;&gt;Africa&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Europe&quot;&gt;Europe&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Oceania&quot;&gt;Oceania&lt;/button&gt;
      &lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;true&quot; id=&quot;gsort&quot;&gt;Sort by value&lt;/button&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;gchart&quot; viewBox=&quot;0 0 640 100&quot; role=&quot;img&quot; aria-label=&quot;Gini coefficient by country&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Data from slide 7 (World Bank, 2017b). The year in brackets varies from country to country, so the comparison is only indicative. Dashed line: 30, the value of the “10% with 40%” example.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;At the extremes&lt;/h4&gt;South Africa &lt;b&gt;63.0&lt;/b&gt;, the most unequal in the table, still marked by the legacy of apartheid. Denmark &lt;b&gt;28.2&lt;/b&gt;, the most egalitarian.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Europe&lt;/h4&gt;Europe is tightly clustered between 28 and 38. Italy (&lt;b&gt;35.4&lt;/b&gt;) is more unequal than Germany, France and the Nordic countries, and less unequal than Russia and the United States.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The Americas&lt;/h4&gt;Brazil &lt;b&gt;51.3&lt;/b&gt;, Mexico 43.4, United States 41.5: among rich countries, the US stands out for its inequality.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;According to the slides, what is the social class hierarchy based on?&lt;/summary&gt;&lt;div&gt;On &lt;b&gt;occupation&lt;/b&gt;, i.e. position in employment. For Marx and Engels the fundamental division was between those who own capital (capitalists) and those who sell their labor for a low income (laborers).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between income and wealth?&lt;/summary&gt;&lt;div&gt;Income is a flow (what comes in over a period). Wealth is a stock (what one owns at a given moment, net of debts). Wealth accumulates and is inherited.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What do a Gini of 0 and a Gini of 100 mean?&lt;/summary&gt;&lt;div&gt;0: everyone has the same income or wealth. 100: everything is in the hands of a single person. The coefficient summarises the overall stratification of a society.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the two-group society, the richest 20% hold 50% of income. What is the Gini?&lt;/summary&gt;&lt;div&gt;G = s − p = 50 − 20 = &lt;b&gt;30&lt;/b&gt;. Check it with the sliders above.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;South Africa 63.0 and Denmark 28.2: how would you interpret the difference?&lt;/summary&gt;&lt;div&gt;In South Africa income is far more concentrated at the top: the Lorenz curve lies very far from the diagonal and the rungs of the “social ladder” are very far apart. In Denmark the distances are much smaller.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PART 2 ============ --&gt;
&lt;section id=&quot;p2&quot; class=&quot;part p-ocher&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Part 2 · Why it matters&lt;/div&gt;
    &lt;h2&gt;The consequences of inequality&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Stratification is not merely a matter of numbers: slides 8–10 show its effects on democracy, health and social life, and how disadvantages accumulate in a crisis.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-rich&quot;&gt;Super rich and democracy &lt;span class=&quot;slides&quot;&gt;slide 8&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;When wealth is highly concentrated, so is the capacity to influence politics. The slide discusses the influence of &lt;em&gt;tech &amp;amp; billionaires&lt;/em&gt; (major technology entrepreneurs and billionaires) on politics and democracy. The recent example is the New York City mayoral election: the groups that funded the campaign against Zohran Mamdani, who was subsequently elected mayor.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;The three largest donors against Mamdani&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;Top three donors (millions of dollars)&lt;/text&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;56&quot;&gt;Michael Bloomberg&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;72&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;financial services&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;42&quot; width=&quot;370&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;548&quot; y=&quot;61&quot; font-weight=&quot;700&quot;&gt;13.3&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;104&quot;&gt;Lauder Family&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;120&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;cosmetics industry&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;90&quot; width=&quot;72&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;109&quot; font-weight=&quot;700&quot;&gt;2.6&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;152&quot;&gt;Joe Gebbia&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;168&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;Airbnb co-founder&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;138&quot; width=&quot;56&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;234&quot; y=&quot;157&quot; font-weight=&quot;700&quot;&gt;2.0&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Figures from slide 8 (stated source: TIME article, see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;). The list continues (“more…”).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The sociological point&lt;/b&gt;: democracy rests on “one person, one vote”, but the resources needed to make oneself heard (funding campaigns, advertising, lobby groups) follow the distribution of wealth. Strong economic stratification risks turning into stratification of &lt;b&gt;political power&lt;/b&gt;.&lt;/div&gt;

  &lt;h3 id=&quot;s-health&quot;&gt;Health and social problems are worse in more unequal countries &lt;span class=&quot;slides&quot;&gt;slide 9&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The graph by &lt;b&gt;Wilkinson &amp;amp; Pickett (2009)&lt;/b&gt; plots the &lt;em&gt;income inequality&lt;/em&gt; of a number of rich countries on the horizontal axis and an &lt;span class=&quot;term&quot;&gt;index of health and social problems&lt;/span&gt; (a composite index) on the vertical axis. Click a point to see its name.&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;pill&quot; id=&quot;wpline&quot; aria-pressed=&quot;true&quot;&gt;Trend line&lt;/button&gt;&lt;button class=&quot;pill&quot; id=&quot;wplab&quot; aria-pressed=&quot;false&quot;&gt;Show all names&lt;/button&gt;&lt;/div&gt;
    &lt;svg id=&quot;wp&quot; viewBox=&quot;60 120 720 590&quot; role=&quot;img&quot; aria-label=&quot;Scatter plot: inequality and social problems&quot;&gt;
      &lt;line x1=&quot;95&quot; y1=&quot;130&quot; x2=&quot;95&quot; y2=&quot;650&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;line x1=&quot;95&quot; y1=&quot;650&quot; x2=&quot;740&quot; y2=&quot;650&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;text x=&quot;88&quot; y=&quot;152&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;worse&lt;/text&gt;
      &lt;text x=&quot;88&quot; y=&quot;642&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;better&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;675&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;low&lt;/text&gt;
      &lt;text x=&quot;735&quot; y=&quot;675&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;high&lt;/text&gt;
      &lt;text x=&quot;420&quot; y=&quot;700&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;Income inequality →&lt;/text&gt;
      &lt;text x=&quot;72&quot; y=&quot;400&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; transform=&quot;rotate(-90 72 400)&quot;&gt;Index of health and social problems →&lt;/text&gt;
      &lt;line id=&quot;wptrend&quot; x1=&quot;133&quot; y1=&quot;588&quot; x2=&quot;697&quot; y2=&quot;190&quot; class=&quot;acs&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g id=&quot;wppts&quot;&gt;&lt;/g&gt;
      &lt;text id=&quot;wpname&quot; x=&quot;110&quot; y=&quot;180&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot; class=&quot;ac&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Positions reconstructed by hand from the graph on slide 9, and therefore approximate. Original source: Wilkinson &amp;amp; Pickett, 2009.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h4&gt;What goes into the index&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;Life expectancy · maths &amp;amp; literacy · infant mortality · homicides · imprisonment · teenage births · trust · obesity · mental illness, including drug and alcohol addiction · &lt;b&gt;social mobility&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h4&gt;How to read it&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;The most unequal countries (USA, Portugal, UK) sit in the top right, the most egalitarian ones (Japan, the Nordic countries) in the bottom left. The positive slope indicates that &lt;b&gt;more inequality goes together with more problems&lt;/b&gt;, and not only for the poor: society as a whole fares worse.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Caution: correlation does not imply causation&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;The graph shows a &lt;em&gt;correlation&lt;/em&gt; (the two phenomena vary together); on its own it does not prove that inequality &lt;em&gt;causes&lt;/em&gt; the problems. Third variables, such as history, welfare systems or culture, may be at play.&lt;/p&gt;
    &lt;p class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;The authors hypothesise that inequality erodes trust and increases anxiety and illness. The book also drew strong criticism, to which the authors responded in a chapter added to the 2010 edition. In 2024 the Equality Trust updated the data in the report &lt;em&gt;The Spirit Level at 15&lt;/em&gt;. — &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;equalitytrust.org.uk&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;p class=&quot;note&quot;&gt;Note the connection: &lt;b&gt;social mobility&lt;/b&gt; is one of the components of the index. More stratified societies also tend to be those with less movement, which is the topic of Part 3.&lt;/p&gt;

  &lt;h3 id=&quot;s-covid&quot;&gt;Intersection of global inequalities: the case of COVID-19 &lt;span class=&quot;slides&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The slide presents a DW video, &lt;em&gt;“COVID-19 has worsened economic inequality”&lt;/em&gt; (&lt;a href=&quot;https://www.youtube.com/watch?v=rx--hD2fHCE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=rx--hD2fHCE&lt;/a&gt;). The slide title recalls the &lt;span class=&quot;term&quot;&gt;intersectionality&lt;/span&gt; of the previous lecture: a crisis does not affect everyone in the same way, because disadvantages overlap.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram of disadvantages&quot;&gt;
      &lt;circle cx=&quot;230&quot; cy=&quot;120&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;circle cx=&quot;370&quot; cy=&quot;120&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;210&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;text x=&quot;185&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Low income&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;few savings&lt;/text&gt;
      &lt;text x=&quot;415&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;On-site work&lt;/text&gt;
      &lt;text x=&quot;415&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;no remote working&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;270&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Health and housing&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;287&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;overcrowding, illness&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; class=&quot;ac&quot;&gt;highest&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; class=&quot;ac&quot;&gt;risk&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Explanatory diagram: those at the intersection of several disadvantages (income, type of work, housing and health conditions, often also linked to ethnicity and gender) were hit much harder by the pandemic, and the gap widened.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the New York City mayoral election an example of stratification?&lt;/summary&gt;&lt;div&gt;Because it shows how concentrated wealth becomes a capacity to influence politics: a few very wealthy donors (Bloomberg $13.3 million, the Lauder family 2.6, Gebbia 2) funded groups opposing a candidate. Economic inequality translates into inequality of influence.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is on the two axes of the Wilkinson &amp;amp; Pickett graph, and what relationship emerges?&lt;/summary&gt;&lt;div&gt;X axis: income inequality. Y axis: an index of health and social problems (life expectancy, infant mortality, homicides, imprisonment, obesity, mental health, trust, social mobility…). The relationship is positive: more unequal countries have more problems.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Can we conclude from the graph that inequality causes social problems?&lt;/summary&gt;&lt;div&gt;Not on its own: it is a cross-country correlation. Claims of causality require further studies and controls for other variables. The authors propose mechanisms (trust, status anxiety), but this interpretation is debated.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does intersectionality have to do with COVID-19?&lt;/summary&gt;&lt;div&gt;Disadvantages accumulate: those who were poor, did jobs that could not be done from home, lived in overcrowded housing or already had health problems were hit hardest. The crisis thus amplified existing inequalities.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PART 3 ============ --&gt;
&lt;section id=&quot;p3&quot; class=&quot;part p-slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Part 3 · Social mobility&lt;/div&gt;
    &lt;h2&gt;Not only where you are, but whether you can move&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Slides 11–15. Social inequality concerns not only stratification but also the &lt;b&gt;opportunity to move between social positions&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social mobility&lt;/b&gt;: the movement of individuals or groups from one social position to another. It can be &lt;em&gt;upward&lt;/em&gt; or &lt;em&gt;downward&lt;/em&gt;.&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Stratification and mobility as two dimensions&quot;&gt;
      &lt;text x=&quot;140&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Stratification&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;how far apart are the rungs?&lt;/text&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;3&quot;&gt;&lt;line x1=&quot;90&quot; y1=&quot;50&quot; x2=&quot;90&quot; y2=&quot;215&quot;/&gt;&lt;line x1=&quot;190&quot; y1=&quot;50&quot; x2=&quot;190&quot; y2=&quot;215&quot;/&gt;&lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;90&quot; y1=&quot;70&quot; x2=&quot;190&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;160&quot; x2=&quot;190&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;190&quot; x2=&quot;190&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;210&quot; x2=&quot;190&quot; y2=&quot;210&quot;/&gt;&lt;/g&gt;
      &lt;path d=&quot;M205 72 V158&quot; class=&quot;acs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;120&quot; font-size=&quot;12&quot; class=&quot;ac&quot;&gt;distance&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Mobility&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;can people move?&lt;/text&gt;
      &lt;path d=&quot;M340 210 L540 60&quot; class=&quot;cs&quot; stroke-width=&quot;16&quot; stroke-linecap=&quot;round&quot; opacity=&quot;.25&quot;/&gt;
      &lt;path d=&quot;M360 190 L430 138&quot; class=&quot;acs&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;path d=&quot;M520 75 L460 120&quot; class=&quot;inks&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;215&quot; font-size=&quot;12&quot;&gt;upward&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;75&quot; font-size=&quot;12&quot;&gt;downward&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Slide 11 uses the image of the escalators in a shopping centre: the staircase tells you how far apart the floors are (stratification), the escalator whether and how easily one can go up or down (mobility).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;s-intra&quot;&gt;Intergenerational and intragenerational &lt;span class=&quot;slides&quot;&gt;slides 12–13&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 200&quot; role=&quot;img&quot; aria-label=&quot;Tree: social inequality, mobility, two subdimensions&quot;&gt;
        &lt;rect x=&quot;90&quot; y=&quot;8&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Social inequality&lt;/text&gt;
        &lt;path d=&quot;M160 42 V72&quot; class=&quot;cs&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ah)&quot;/&gt;
        &lt;rect x=&quot;90&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Mobility&lt;/text&gt;
        &lt;path d=&quot;M160 110 V130 H75 V150 M160 130 H245 V150&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;2.5&quot;/&gt;
        &lt;rect x=&quot;5&quot; y=&quot;154&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Intergenerational&lt;/text&gt;
        &lt;rect x=&quot;175&quot; y=&quot;154&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Intragenerational&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Reconstruction of the diagram on slide 13.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;Mobility has two &lt;em&gt;subdimensions&lt;/em&gt;, which differ in &lt;b&gt;whom or what&lt;/b&gt; a person&#x27;s position is compared with:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Inter&lt;/b&gt;generational = &lt;em&gt;between&lt;/em&gt; generations: parents and children compared.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Intra&lt;/b&gt;generational = &lt;em&gt;within&lt;/em&gt; a generation: the same person over the course of their life.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Intergenerational&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Intragenerational&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Intergenerational mobility&lt;/span&gt;: change in social position &lt;b&gt;between parents and children&lt;/b&gt;. As examples of measures, the slides cite &lt;em&gt;occupational status&lt;/em&gt;, &lt;em&gt;wealth&lt;/em&gt; and even &lt;em&gt;life expectancy&lt;/em&gt;.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Comparison between parent and daughter&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;20&quot; x2=&quot;40&quot; y2=&quot;150&quot; class=&quot;rl&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;34&quot; y=&quot;28&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;high&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;150&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;low&lt;/text&gt;
          &lt;circle cx=&quot;150&quot; cy=&quot;125&quot; r=&quot;14&quot; class=&quot;inks&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Parent: factory worker&lt;/text&gt;
          &lt;circle cx=&quot;410&quot; cy=&quot;45&quot; r=&quot;14&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Daughter: doctor&lt;/text&gt;
          &lt;path d=&quot;M170 118 Q 290 40 390 48&quot; fill=&quot;none&quot; class=&quot;acs&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;ac&quot;&gt;upward intergenerational&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Example: the son or daughter of a factory worker who becomes a doctor. If children&#x27;s positions depend little on their parents&#x27; positions, intergenerational mobility is high.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Intragenerational mobility&lt;/span&gt;: change in social position &lt;b&gt;over the life course&lt;/b&gt; of the same person.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Career over the life course&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;145&quot; x2=&quot;540&quot; y2=&quot;145&quot; class=&quot;rl&quot; stroke-width=&quot;2&quot;/&gt;

          &lt;text x=&quot;60&quot; y=&quot;113&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;internship&lt;/text&gt;
          &lt;text x=&quot;160&quot; y=&quot;98&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;clerk&lt;/text&gt;

        &lt;/svg&gt;
        &lt;figcaption&gt;A real career alternates rises (promotions, qualifications) and falls (job loss, illness, crises): all of this is intragenerational mobility.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-lift&quot;&gt;How can the “social lift” work? &lt;span class=&quot;slides&quot;&gt;slides 14–15&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;social lift&lt;/span&gt; works if a person has &lt;b&gt;resources&lt;/b&gt; and &lt;b&gt;access to opportunities&lt;/b&gt;. Slide 14 names two key mechanisms: the &lt;em&gt;ascription/achievement&lt;/em&gt; pair and &lt;em&gt;intergenerational transmission&lt;/em&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Ascription&lt;/h4&gt;Characteristics &lt;b&gt;fixed at birth&lt;/b&gt;, such as family background (but also gender, ethnicity, place of birth). These are &lt;em&gt;ascribed&lt;/em&gt; characteristics: you neither choose nor earn them.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Achievement&lt;/h4&gt;&lt;b&gt;Personal effort, skills, talent, performance&lt;/b&gt;. These are &lt;em&gt;achieved&lt;/em&gt; characteristics, what a person accomplishes.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;A society in which final position depends mainly on achievement is &lt;b&gt;open&lt;/b&gt; (meritocratic). If it depends mainly on ascription, it is &lt;b&gt;closed&lt;/b&gt;: in the extreme case, a caste society.&lt;/p&gt;

  &lt;figure&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Simulator: how much does birth matter?&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Person A is born into an affluent family (background 85/100) and has average talent (50). Person B is born into a modest family (background 20/100). Choose B&#x27;s talent and how much ascription counts in this society.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mw&quot;&gt;Weight of ascription&lt;/label&gt;&lt;input id=&quot;mw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;mwo&quot;&gt;60%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mt&quot;&gt;B&#x27;s talent and effort&lt;/label&gt;&lt;input id=&quot;mt&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;mto&quot;&gt;80&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 110&quot; role=&quot;img&quot; aria-label=&quot;Social position attained by A and B&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;34&quot; font-size=&quot;13&quot;&gt;A · affluent family&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;18&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;cb&quot;/&gt;
      &lt;rect id=&quot;mbA&quot; x=&quot;150&quot; y=&quot;18&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;inks&quot; fill=&quot;var(--muted)&quot;/&gt;
      &lt;text id=&quot;mvA&quot; y=&quot;35&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;78&quot; font-size=&quot;13&quot;&gt;B · modest family&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;cb&quot;/&gt;
      &lt;rect id=&quot;mbB&quot; x=&quot;150&quot; y=&quot;62&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;
      &lt;text id=&quot;mvB&quot; y=&quot;79&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;150&quot; y=&quot;106&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;social position attained (0–100) = weight × background + (1 − weight) × talent&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot; id=&quot;mmsg&quot;&gt;&lt;/div&gt;
    &lt;figcaption&gt;A toy model to fix the idea, not an empirical result.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h4&gt;Intergenerational transmission&lt;/h4&gt;
  &lt;p&gt;Ascription does not work by magic: it operates through concrete channels by which families &lt;b&gt;pass on advantages (or disadvantages)&lt;/b&gt; to their children. This is &lt;span class=&quot;term&quot;&gt;intergenerational transmission&lt;/span&gt;, and it is the bridge to Part 4: what is transmitted is precisely &lt;em&gt;resources&lt;/em&gt;.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Flow of intergenerational transmission&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;120&quot; rx=&quot;12&quot; class=&quot;cb&quot;/&gt;
      &lt;text x=&quot;85&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Parents&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;economic capital&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;human capital&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;social capital&lt;/text&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;215&quot; y=&quot;14&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;inheritance, housing, financial help&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;62&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;investment in education&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;110&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;networks and contacts&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;158&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;health, lifestyles, aspirations&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M160 100 L215 29&quot;/&gt;&lt;path d=&quot;M160 100 L215 77&quot;/&gt;&lt;path d=&quot;M160 100 L215 125&quot;/&gt;&lt;path d=&quot;M160 100 L215 173&quot;/&gt;
      &lt;path d=&quot;M405 29 L470 100&quot;/&gt;&lt;path d=&quot;M405 77 L470 100&quot;/&gt;&lt;path d=&quot;M405 125 L470 100&quot;/&gt;&lt;path d=&quot;M405 173 L470 100&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;470&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;120&quot; rx=&quot;12&quot; class=&quot;c&quot;/&gt;
      &lt;text x=&quot;550&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Children&lt;/text&gt;
      &lt;text x=&quot;550&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;starting point&lt;/text&gt;
      &lt;text x=&quot;550&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;and opportunities&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Illustrative channels (my own addition: the slides only cite the keyword). The stronger these channels are, the more children&#x27;s positions “copy” those of their parents and the lower intergenerational mobility is.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot;&gt;Beware of a pitfall: achievement is not entirely “free” either. An educational qualification is a personal achievement, but the probability of earning a degree depends heavily on family background. Ascription and achievement are intertwined.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why do the slides say that social inequality is not “only” stratification?&lt;/summary&gt;&lt;div&gt;Because the possibility of moving between positions also matters. Two societies with the same Gini can be very different if in one people easily move up and down while in the other position is inherited.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A woman starts as a cashier and by age 45 manages a supermarket. What type of mobility is this?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Intragenerational&lt;/b&gt;, upward: it is a change of position over the life course of the same person.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The father was a farm labourer, the son is an engineer. What type of mobility is this? Which indicators would you use to measure it?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Intergenerational&lt;/b&gt; upward. Indicators cited in the slides: occupational status, wealth, life expectancy.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Classify as ascription or achievement: family background, university degree, gender, language skills, musical talent.&lt;/summary&gt;&lt;div&gt;Ascription: family background, gender (fixed at birth). Achievement: university degree, language skills, musical talent and performance (effort, skills, talent, performance). Remember, however, that opportunities for achievement depend partly on ascription.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is intergenerational transmission and why does it hinder mobility?&lt;/summary&gt;&lt;div&gt;It is the transfer of resources (economic, cultural and educational, relational) from parents to children. If it is strong, children&#x27;s destination depends mainly on their family&#x27;s starting point: the social lift gets stuck.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PART 4 ============ --&gt;
&lt;section id=&quot;p4&quot; class=&quot;part p-brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Part 4 · Resources&lt;/div&gt;
    &lt;h2&gt;What lifts people up (or holds them down): forms of capital&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Slides 16–20. The resources that explain positions and mobility.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;a href=&quot;#s-human&quot; class=&quot;card&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Human capital&lt;/h4&gt;“What you can do”.&lt;/a&gt;
    &lt;a href=&quot;#s-social&quot; class=&quot;card&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Social capital&lt;/h4&gt;“Who you know”.&lt;/a&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(Economic capital)&lt;/h4&gt;Money and assets: the income and wealth of Part 1. The slide puts it in brackets because it has already been covered and because the lecture focuses on the other two resources.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-human&quot;&gt;Human capital &lt;span class=&quot;slides&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Human capital&lt;/b&gt;: people&#x27;s knowledge and skills &lt;b&gt;insofar as they are relevant to the labor market&lt;/b&gt;.&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 620 180&quot; role=&quot;img&quot; aria-label=&quot;Components of human capital and job outcomes&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;12&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;37&quot; text-anchor=&quot;middle&quot;&gt;Education&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot;&gt;Work experience&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;128&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot;&gt;Health&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M160 32 L240 90&quot;/&gt;&lt;path d=&quot;M160 90 L240 90&quot;/&gt;&lt;path d=&quot;M160 148 L240 90&quot;/&gt;&lt;/g&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;90&quot; r=&quot;58&quot; class=&quot;c&quot;/&gt;
      &lt;text x=&quot;300&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Human&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;capital&lt;/text&gt;
      &lt;path d=&quot;M362 90 H440&quot; class=&quot;inks&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;rect x=&quot;445&quot; y=&quot;50&quot; width=&quot;165&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;527&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Job outcomes&lt;/text&gt;
      &lt;text x=&quot;527&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;wages, employment,&lt;/text&gt;
      &lt;text x=&quot;527&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;class position&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The higher one&#x27;s human capital, the better one&#x27;s position in the labor market (&lt;em&gt;human capital and job outcomes&lt;/em&gt;). And since social class is based on occupation (Part 1), human capital is a driver of mobility.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;small&quot;&gt;Why “capital”? &lt;span class=&quot;badge b-int&quot;&gt;supplement&lt;/span&gt;Because, like a machine in a factory, it is built through an investment (years of study, training, health care) that yields returns over time in the form of higher wages. The idea was systematised by the economist Gary Becker (see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;).&lt;/p&gt;

  &lt;h3 id=&quot;s-social&quot;&gt;Social capital &lt;span class=&quot;slides&quot;&gt;slides 18–19&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social capital&lt;/b&gt;: the potential of individuals to &lt;b&gt;secure benefits and solve problems through membership in social networks&lt;/b&gt;.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 250&quot; role=&quot;img&quot; aria-label=&quot;The three dimensions of social capital&quot;&gt;
        &lt;polygon points=&quot;160,40 40,215 280,215&quot; class=&quot;cb cs&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;40&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Networks&lt;/text&gt;
        &lt;circle cx=&quot;45&quot; cy=&quot;210&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Trust&lt;/text&gt;
        &lt;circle cx=&quot;275&quot; cy=&quot;210&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Resources&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-family=&quot;Newsreader,serif&quot; font-size=&quot;18&quot; font-style=&quot;italic&quot;&gt;social capital&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;Three dimensions:&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;b&gt;Interconnected networks&lt;/b&gt;: networks of relationships between individuals and groups (&lt;em&gt;social ties&lt;/em&gt; or &lt;em&gt;social participation&lt;/em&gt;).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Trust&lt;/b&gt;: the level of trust that characterises these ties.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Resources or benefits&lt;/b&gt;: resources or benefits obtained and transferred through ties and participation.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;There is no &lt;b&gt;single&lt;/b&gt; theory of social capital, but rather a &lt;span class=&quot;term&quot;&gt;social capital paradigm&lt;/span&gt;: a family of theories sharing some common ideas.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Networks have value&lt;/h4&gt;Relationships are a resource, like money or skills.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Networks matter for certain outcomes&lt;/h4&gt;Who you know affects what you obtain.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · Outcomes can vary&lt;/h4&gt;Well-being, opportunities, trust, health.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Granovetter: weak ties&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Putnam: public good&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Mark Granovetter&lt;/b&gt;, &lt;em&gt;The Strength of Weak Ties&lt;/em&gt;. &lt;span class=&quot;term&quot;&gt;Strong ties&lt;/span&gt; (family, close friends) connect people who see each other often and know the same things. &lt;span class=&quot;term&quot;&gt;Weak ties&lt;/span&gt; (acquaintances, former colleagues) act as a &lt;em&gt;bridge&lt;/em&gt; to other social circles and therefore bring &lt;b&gt;new information&lt;/b&gt;, for instance about a job. Follow the steps:&lt;/p&gt;
      &lt;div data-stepper=&quot;gran&quot;&gt;
        &lt;svg id=&quot;gran&quot; viewBox=&quot;0 0 600 285&quot; role=&quot;img&quot; aria-label=&quot;Network with strong ties and one weak tie&quot;&gt;
          &lt;ellipse class=&quot;cl ca&quot; cx=&quot;140&quot; cy=&quot;140&quot; rx=&quot;125&quot; ry=&quot;110&quot;/&gt;
          &lt;ellipse class=&quot;cl cb2&quot; cx=&quot;455&quot; cy=&quot;140&quot; rx=&quot;125&quot; ry=&quot;110&quot;/&gt;
          &lt;g class=&quot;sa&quot;&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;80&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;80&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;80&quot; x2=&quot;200&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;80&quot; x2=&quot;80&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;200&quot; y1=&quot;80&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;200&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;
          &lt;/g&gt;
          &lt;g class=&quot;sb&quot;&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;375&quot; y1=&quot;140&quot; x2=&quot;445&quot; y2=&quot;70&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;375&quot; y1=&quot;140&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;445&quot; y1=&quot;70&quot; x2=&quot;525&quot; y2=&quot;100&quot;/&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;525&quot; y1=&quot;100&quot; x2=&quot;515&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;515&quot; y1=&quot;200&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;445&quot; y1=&quot;70&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;
          &lt;/g&gt;
          &lt;line class=&quot;weak&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;375&quot; y2=&quot;140&quot;/&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;80&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;80&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;80&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;
          &lt;circle class=&quot;you&quot; cx=&quot;140&quot; cy=&quot;140&quot; r=&quot;14&quot;/&gt;
          &lt;circle class=&quot;ack&quot; cx=&quot;375&quot; cy=&quot;140&quot; r=&quot;12&quot;/&gt;
          &lt;circle cx=&quot;445&quot; cy=&quot;70&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;515&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;435&quot; cy=&quot;210&quot; r=&quot;11&quot;/&gt;
          &lt;circle class=&quot;job&quot; cx=&quot;525&quot; cy=&quot;100&quot; r=&quot;14&quot;/&gt;
          &lt;text x=&quot;140&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;You&lt;/text&gt;
          &lt;text x=&quot;375&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;acquaintance&lt;/text&gt;
          &lt;text x=&quot;525&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;job offer&lt;/text&gt;
          &lt;text x=&quot;140&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;your close friends&lt;/text&gt;
          &lt;text x=&quot;455&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;another social circle&lt;/text&gt;
          &lt;text x=&quot;258&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;weak tie&lt;/text&gt;
          &lt;text class=&quot;msg ac&quot; x=&quot;300&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;New information arrives through the bridge&lt;/text&gt;
        &lt;/svg&gt;
        &lt;ol class=&quot;steps&quot;&gt;
          &lt;li&gt;&lt;b&gt;Strong ties.&lt;/b&gt; In your group everyone knows each other and meets often. Support is strong, but information circulates redundantly: you all know the same things.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Weak tie.&lt;/b&gt; There is someone you rarely see, an acquaintance. It is a weak tie, but it is the only bridge to another circle.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Another world.&lt;/b&gt; In the acquaintance&#x27;s circle, information circulates that nobody in your group has, such as a job offer.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;The strength of the weak tie.&lt;/b&gt; The information reaches you through the weak tie. Granovetter observed that people who had found a job through personal contacts generally saw those contacts only occasionally or rarely.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button data-dir=&quot;-1&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;stepcount&quot;&gt;&lt;/span&gt;&lt;button data-dir=&quot;1&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;The finding about contacts seen “occasionally or rarely” comes from the study of job seekers reported in the 1973 article; see Further reading.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Robert Putnam&lt;/b&gt; (spelled “Putnman” in the slides) conceives of social capital as a &lt;span class=&quot;term&quot;&gt;public good&lt;/span&gt;: the amount of &lt;b&gt;participatory potential, civic orientation and trust in others&lt;/b&gt; available to cities, states or nations.&lt;/p&gt;
      &lt;p&gt;The level of analysis shifts: what matters is no longer how “rich in relationships” an individual is, but how rich a &lt;b&gt;community&lt;/b&gt; is. A public good benefits everyone, including those who do not contribute, like a safe public square or the trust that makes exchanges easy.&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;In &lt;em&gt;Bowling Alone&lt;/em&gt; (2000) Putnam documents the decline of civic participation in the US and links it to effects on democracy, health and quality of life. He also distinguishes &lt;em&gt;bonding&lt;/em&gt; social capital, which ties similar people together, from &lt;em&gt;bridging&lt;/em&gt; social capital, which connects different groups and is very close to the idea of weak ties. — &lt;a href=&quot;https://archives.evergreen.edu/webpages/curricular/2003-2004/artofplace/BowlingAloneStudyGuideI_II.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;study guide, Evergreen State College&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Granovetter&lt;/th&gt;&lt;th&gt;Putnam&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Level&lt;/td&gt;&lt;td&gt;Individual: a person&#x27;s networks&lt;/td&gt;&lt;td&gt;Collective: cities, states, nations&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Nature&lt;/td&gt;&lt;td&gt;Private resource (it finds me a job)&lt;/td&gt;&lt;td&gt;Public good (benefits everyone)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Key ingredient&lt;/td&gt;&lt;td&gt;Network structure (weak ties as bridges)&lt;/td&gt;&lt;td&gt;Civic participation and trust&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Typical outcome&lt;/td&gt;&lt;td&gt;Opportunities, mobility&lt;/td&gt;&lt;td&gt;Democracy, well-being, trust&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-group&quot;&gt;Group belonging, social capital, discrimination &lt;span class=&quot;slides&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Scholars explain inequalities in terms of resources. To recap:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What you can do&lt;/h4&gt;Human capital&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Who you know&lt;/h4&gt;Social capital&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Who you belong to&lt;/h4&gt;&lt;em&gt;Group membership&lt;/em&gt;: age, gender, ethnic group, religion…&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Group affiliation&lt;/b&gt; is a resource (the group provides networks and support), but it can also be a &lt;b&gt;barrier&lt;/b&gt;: &lt;em&gt;discrimination&lt;/em&gt; on the basis of membership.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Labor market discrimination&lt;/b&gt;: employers&#x27; decisions &lt;b&gt;not based on human capital characteristics&lt;/b&gt;. With equal education, experience and health, a person is treated differently because of the group they belong to.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In-group favoritism&lt;/h4&gt;The tendency to favour members of one&#x27;s own group (&lt;em&gt;in-group&lt;/em&gt;) over those outside it (&lt;em&gt;out-group&lt;/em&gt;). Labor market discrimination is closely linked to it: it often stems not from open hostility but from a preference for those who “resemble me”.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cumulative discrimination&lt;/h4&gt;Small disadvantages at successive stages (screening, hiring, wages, career) &lt;b&gt;add up&lt;/b&gt; and produce a large final gap. See the diagram below.&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure data-stepper=&quot;disc&quot;&gt;
    &lt;svg id=&quot;disc&quot; viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Cumulative discrimination by stage&quot;&gt;&lt;/svg&gt;
    &lt;ol class=&quot;steps&quot;&gt;
      &lt;li&gt;&lt;b&gt;Starting point.&lt;/b&gt; Two candidates with &lt;b&gt;the same human capital&lt;/b&gt;: outline = in-group, filled = out-group. Both at 100.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;CV screening.&lt;/b&gt; With identical CVs, the out-group receives fewer callbacks: 82 opportunities out of 100 remain.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Interview.&lt;/b&gt; The recruiter&#x27;s in-group favoritism cuts further: 70.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Starting salary.&lt;/b&gt; Those who are hired start on a lower salary: 62.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Promotion.&lt;/b&gt; Each disadvantage builds on the previous one: in the end the out-group is at roughly half. This is &lt;em&gt;cumulative discrimination&lt;/em&gt;.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button data-dir=&quot;-1&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;stepcount&quot;&gt;&lt;/span&gt;&lt;button data-dir=&quot;1&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;figcaption&gt;Made-up numbers to illustrate the mechanism: they are not data from the slides or from any study.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot;&gt;Connection: cumulative discrimination is the “over time” version of the intersectionality discussed in the previous lecture, which instead concerns the intersection of multiple memberships. Both explain why disadvantages accumulate rather than remaining isolated, as in the COVID-19 case in Part 2.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Define human capital and name its three components.&lt;/summary&gt;&lt;div&gt;People&#x27;s knowledge and skills insofar as they are relevant to the labor market. Components: education, work experience, health. The higher it is, the better the job outcomes.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three dimensions of social capital?&lt;/summary&gt;&lt;div&gt;Interconnected networks (ties and participation), trust (trust within ties), resources/benefits (what is obtained and transferred through ties).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why, according to Granovetter, are weak ties “strong”?&lt;/summary&gt;&lt;div&gt;Because they act as bridges to circles other than one&#x27;s own and bring non-redundant information (for example, job offers). Strong ties connect people who already know the same things.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How does Putnam&#x27;s approach differ from Granovetter&#x27;s?&lt;/summary&gt;&lt;div&gt;Putnam sees social capital as a public good of a collectivity (participation, civic orientation, trust in cities or nations). Granovetter looks at individuals&#x27; networks and their structure.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why can group membership be both a resource and a barrier?&lt;/summary&gt;&lt;div&gt;The group provides networks, support and identity (resource), but it exposes members to discrimination by decision-makers who favour their own in-group (barrier).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is labor market discrimination and what makes it “cumulative”?&lt;/summary&gt;&lt;div&gt;It consists of employers&#x27; decisions not based on human capital. It is cumulative because the disadvantages at the various stages (screening, hiring, wages, promotion) add up over time, producing large final differences from small initial ones.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FURTHER READING ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot; style=&quot;--c:var(--accent)&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Resources&lt;/div&gt;
    &lt;h2&gt;Further reading&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Authors, studies and websites cited in the slides. The descriptions below come from web searches and are &lt;b&gt;external sources&lt;/b&gt;, distinct from the content of the slides.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Marx &amp;amp; Engels — &lt;em&gt;Manifesto of the Communist Party&lt;/em&gt; (1848)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.marxists.org/archive/marx/works/1848/communist-manifesto&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;marxists.org — full text (English translation by S. Moore with Engels, 1888)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Written as the programme of the Communist League and published in London in 1848. The first chapter, “Bourgeois and Proletarians”, is the classic source of the two-class division recalled on slide 3. It is the starting point for any discussion of social class.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Bank — Gini index (indicator SI.POV.GINI)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://data.worldbank.org/indicator/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;data.worldbank.org/indicator/SI.POV.GINI&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The source of the data on slide 7 (World Bank, 2017b), with updated values for almost every country. It is based on household surveys. In the metadata the World Bank warns that two different Lorenz curves can yield the same Gini and that the data are not perfectly comparable across countries and years. It is useful for seeing how the values in the table have changed.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;R. Wilkinson &amp;amp; K. Pickett — &lt;em&gt;The Spirit Level&lt;/em&gt; (2009)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust — The Spirit Level&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The book from which the graph on slide 9 is taken. It builds an index of health and social problems for 21 rich countries and finds a strong correlation with income inequality, replicated with the UNICEF index of child well-being and across US states. It has been widely debated and criticised. In 2024 the Equality Trust updated its data with &lt;em&gt;The Spirit Level at 15&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;TIME — article on the billionaires opposing Zohran Mamdani&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://time.com/7331119/zohran-mamdani-billionaires-ackman-bloomberg/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;time.com/7331119/zohran-mamdani-billionaires-ackman-bloomberg&lt;/a&gt; (link given on slide 8) · context: &lt;a href=&quot;https://fortune.com/2025/11/06/zohran-mamdani-billionaires-now-offering-help-jamie-dimon-bill-ackman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fortune, 6 Nov 2025&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The source of the figures on slide 8. According to press reports (Fortune, citing Forbes), several billionaires spent a combined total of more than $22 million supporting Mamdani&#x27;s opponents, and some then offered to cooperate after his victory. It serves as a concrete case of the link between concentration of wealth and political influence. Figures vary slightly between outlets: check against the original article.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;DW — “COVID-19 has worsened economic inequality” (video)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=rx--hD2fHCE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=rx--hD2fHCE&lt;/a&gt; (link given on slide 10)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;A Deutsche Welle report on the rise in economic inequality during the pandemic. The web search did not find a DW page with this exact title, so watch the video directly. It is useful as a concrete example of how disadvantages accumulate.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;M. Granovetter — “The Strength of Weak Ties”, &lt;em&gt;American Journal of Sociology&lt;/em&gt; 78(6), 1973, pp. 1360–1380&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.jstor.org/stable/2776392&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;JSTOR 2776392&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The article links the strength of ties to the overlap between friendship networks and examines the consequences for the diffusion of information, mobility opportunities and community organisation. It is supported by a survey of job seekers. It is among the most cited social science articles of all time and is the reference for slide 18.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;R. D. Putnam — &lt;em&gt;Bowling Alone&lt;/em&gt; (2000)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://archives.evergreen.edu/webpages/curricular/2003-2004/artofplace/BowlingAloneStudyGuideI_II.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;study guide (Evergreen State College)&lt;/a&gt; · &lt;a href=&quot;https://www.blinkist.com/books/bowling-alone-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary of key concepts&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Putnam&#x27;s best-known work on the decline of civic participation and social capital in the United States. It introduces the bonding/bridging distinction and presents social capital as a collective resource linked to democracy, health and quality of life, i.e. the public-good view of slide 18. The links are secondary materials: use the book for exact quotations.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;G. S. Becker — &lt;em&gt;Human Capital&lt;/em&gt; (NBER, 1964)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;badge b-int&quot;&gt;not cited in the slides&lt;/span&gt;&lt;a href=&quot;https://openlibrary.org/books/OL5907598M&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open Library — book record&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The classic text of human capital theory: it treats education and training as investments, similar to firms&#x27; investments in machinery. The slides do not cite it, but it is the standard reference for the definition on slide 17.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
