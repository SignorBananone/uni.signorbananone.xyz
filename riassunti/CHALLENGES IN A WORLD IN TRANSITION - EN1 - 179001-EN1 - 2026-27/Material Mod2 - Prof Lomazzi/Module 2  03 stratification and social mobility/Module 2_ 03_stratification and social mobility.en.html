  function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}

  /* tabs */
  document.querySelectorAll(&quot;[data-tabs]&quot;).forEach(function(box){
    var tabs=box.querySelectorAll(&quot;:scope &gt; .tablist [role=tab]&quot;);
    var panels=box.querySelectorAll(&quot;:scope &gt; .tabpanel&quot;);
    tabs.forEach(function(t,i){
      t.addEventListener(&quot;click&quot;,function(){
        tabs.forEach(function(x,j){x.setAttribute(&quot;aria-selected&quot;,j===i?&quot;true&quot;:&quot;false&quot;);panels[j].hidden=j!==i;});
      });
    });
  });

  /* Gini data (slide 7, World Bank 2017b) */
  var G=[[&quot;United States&quot;,&quot;North America&quot;,41.5,2016],[&quot;Canada&quot;,&quot;North America&quot;,34.0,2013],[&quot;Mexico&quot;,&quot;North America&quot;,43.4,2016],
    [&quot;Argentina&quot;,&quot;South America&quot;,42.4,2016],[&quot;Brazil&quot;,&quot;South America&quot;,51.3,2015],
    [&quot;China&quot;,&quot;Asia&quot;,42.2,2012],[&quot;India&quot;,&quot;Asia&quot;,35.1,2011],[&quot;Indonesia&quot;,&quot;Asia&quot;,39.5,2013],[&quot;Japan&quot;,&quot;Asia&quot;,32.1,2008],[&quot;Pakistan&quot;,&quot;Asia&quot;,33.5,2015],
    [&quot;Nigeria&quot;,&quot;Africa&quot;,43.0,2009],[&quot;Egypt&quot;,&quot;Africa&quot;,31.8,2015],[&quot;South Africa&quot;,&quot;Africa&quot;,63.0,2014],
    [&quot;Denmark&quot;,&quot;Europe&quot;,28.2,2015],[&quot;France&quot;,&quot;Europe&quot;,32.7,2015],[&quot;Germany&quot;,&quot;Europe&quot;,31.7,2015],[&quot;United Kingdom&quot;,&quot;Europe&quot;,33.2,2015],[&quot;Italy&quot;,&quot;Europe&quot;,35.4,2015],[&quot;Russia&quot;,&quot;Europe&quot;,37.7,2015],[&quot;Sweden&quot;,&quot;Europe&quot;,29.2,2015],
    [&quot;Australia&quot;,&quot;Oceania&quot;,34.7,2010]];

  /* Lorenz */
  var lp=$(&quot;lp&quot;),ls=$(&quot;ls&quot;);
  function X(x){return 30+260*x;} function Y(y){return 290-260*y;}
  function lorenz(){
    var p=+lp.value/100,s=+ls.value/100;
    if(s&lt;p){s=p;ls.value=lp.value;}
    var px=X(1-p),py=Y(1-s);
    $(&quot;lcurve&quot;).setAttribute(&quot;points&quot;,X(0)+&quot;,&quot;+Y(0)+&quot; &quot;+px+&quot;,&quot;+py+&quot; &quot;+X(1)+&quot;,&quot;+Y(1));
    $(&quot;larea&quot;).setAttribute(&quot;points&quot;,X(0)+&quot;,&quot;+Y(0)+&quot; &quot;+X(1)+&quot;,&quot;+Y(1)+&quot; &quot;+px+&quot;,&quot;+py);
    $(&quot;lpt&quot;).setAttribute(&quot;cx&quot;,px);$(&quot;lpt&quot;).setAttribute(&quot;cy&quot;,py);
    var lA=$(&quot;lA&quot;);lA.setAttribute(&quot;x&quot;,(X(0)+X(1)+px)/3-4);lA.setAttribute(&quot;y&quot;,(Y(0)+Y(1)+py)/3+5);
    var g=Math.round((s-p)*100);
    $(&quot;lpo&quot;).textContent=Math.round(p*100)+&quot;%&quot;;$(&quot;lso&quot;).textContent=Math.round(s*100)+&quot;%&quot;;
    $(&quot;lg&quot;).textContent=g;
    var best=G[0];G.forEach(function(c){if(Math.abs(c[2]-g)&lt;Math.abs(best[2]-g))best=c;});
    $(&quot;ltxt&quot;).textContent=&quot;The richest &quot;+Math.round(p*100)+&quot;% hold &quot;+Math.round(s*100)+&quot;% of income; the remaining &quot;+Math.round((1-p)*100)+&quot;% share &quot;+Math.round((1-s)*100)+&quot;%. &quot;+
      (g&lt;=1?&quot;No inequality: the curve coincides with the diagonal.&quot;:&quot;Closest country from slide 7: &quot;+best[0]+&quot; (&quot;+best[2]+&quot;).&quot;);
  }
  if(lp){lp.addEventListener(&quot;input&quot;,lorenz);ls.addEventListener(&quot;input&quot;,lorenz);lorenz();}

  /* Gini chart */
  var region=&quot;all&quot;,byVal=true;
  function gchart(){
    var svg=$(&quot;gchart&quot;);if(!svg)return;
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    var d=G.filter(function(c){return region===&quot;all&quot;||c[1]===region;}).slice();
    if(byVal)d.sort(function(a,b){return b[2]-a[2];});
    var rh=24,top=10,L=140,W=440,max=70,h=top+d.length*rh+26;
    svg.setAttribute(&quot;viewBox&quot;,&quot;0 0 640 &quot;+h);
    [0,20,40,60].forEach(function(v){
      var x=L+W*v/max;
      svg.appendChild(el(&quot;line&quot;,{x1:x,y1:top-4,x2:x,y2:h-20,&quot;class&quot;:&quot;rl&quot;,&quot;stroke-width&quot;:1}));
      svg.appendChild(el(&quot;text&quot;,{x:x,y:h-4,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,&quot;class&quot;:&quot;mut&quot;},v));
    });
    var x30=L+W*30/max;
    svg.appendChild(el(&quot;line&quot;,{x1:x30,y1:top-4,x2:x30,y2:h-20,&quot;class&quot;:&quot;acs&quot;,&quot;stroke-width&quot;:1.2,&quot;stroke-dasharray&quot;:&quot;4 4&quot;}));
    d.forEach(function(c,i){
      var y=top+i*rh,it=c[0]===&quot;Italy&quot;;
      svg.appendChild(el(&quot;text&quot;,{x:L-8,y:y+15,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:13,&quot;font-weight&quot;:it?700:400},c[0]));
      var r=el(&quot;rect&quot;,{x:L,y:y+3,width:W*c[2]/max,height:rh-8,rx:3,&quot;class&quot;:it?&quot;ac&quot;:&quot;c&quot;});
      r.appendChild(el(&quot;title&quot;,{},c[0]+&quot;: &quot;+c[2]+&quot; (&quot;+c[3]+&quot;)&quot;));
      svg.appendChild(r);
      svg.appendChild(el(&quot;text&quot;,{x:L+W*c[2]/max+6,y:y+15,&quot;font-size&quot;:12},c[2].toFixed(1)+&quot;  ·  &quot;+c[3]));
    });
  }
  var gf=$(&quot;gfilt&quot;);
  if(gf){
    gf.querySelectorAll(&quot;[data-r]&quot;).forEach(function(b){
      b.addEventListener(&quot;click&quot;,function(){
        region=b.getAttribute(&quot;data-r&quot;);
        gf.querySelectorAll(&quot;[data-r]&quot;).forEach(function(x){x.setAttribute(&quot;aria-pressed&quot;,x===b?&quot;true&quot;:&quot;false&quot;);});
        gchart();
      });
    });
    $(&quot;gsort&quot;).addEventListener(&quot;click&quot;,function(){byVal=!byVal;this.setAttribute(&quot;aria-pressed&quot;,byVal?&quot;true&quot;:&quot;false&quot;);gchart();});
    gchart();
  }

  /* Wilkinson &amp; Pickett scatter (approx. from slide 9) */
  var WP=[[&quot;USA&quot;,595,155],[&quot;Portugal&quot;,545,277],[&quot;UK&quot;,470,333],[&quot;Greece&quot;,383,392],[&quot;Ireland&quot;,370,410],[&quot;New Zealand&quot;,437,405],[&quot;France&quot;,329,439],
    [&quot;Australia&quot;,455,437],[&quot;Austria&quot;,259,445],[&quot;Germany&quot;,293,455],[&quot;Canada&quot;,332,457],[&quot;Italy&quot;,424,464],[&quot;Denmark&quot;,212,474],[&quot;Belgium&quot;,239,480],
    [&quot;Spain&quot;,324,490],[&quot;Switzerland&quot;,342,514],[&quot;Finland&quot;,160,509],[&quot;Netherlands&quot;,302,521],[&quot;Norway&quot;,172,538],[&quot;Sweden&quot;,180,567],[&quot;Japan&quot;,134,630]];
  var pts=$(&quot;wppts&quot;);
  if(pts){
    var labs=[];
    WP.forEach(function(p){
      var c=el(&quot;circle&quot;,{cx:p[1],cy:p[2],r:8,tabindex:0});
      c.appendChild(el(&quot;title&quot;,{},p[0]));
      var t=el(&quot;text&quot;,{x:p[1]+12,y:p[2]+5,&quot;class&quot;:&quot;lab&quot;,visibility:&quot;hidden&quot;},p[0]);labs.push(t);
      function sel(){pts.querySelectorAll(&quot;circle&quot;).forEach(function(x){x.classList.remove(&quot;sel&quot;);});c.classList.add(&quot;sel&quot;);$(&quot;wpname&quot;).textContent=p[0];}
      c.addEventListener(&quot;click&quot;,sel);c.addEventListener(&quot;mouseenter&quot;,sel);c.addEventListener(&quot;focus&quot;,sel);
      pts.appendChild(c);pts.appendChild(t);
    });
    $(&quot;wplab&quot;).addEventListener(&quot;click&quot;,function(){var on=this.getAttribute(&quot;aria-pressed&quot;)!==&quot;true&quot;;this.setAttribute(&quot;aria-pressed&quot;,on);labs.forEach(function(t){t.setAttribute(&quot;visibility&quot;,on?&quot;visible&quot;:&quot;hidden&quot;);});});
    $(&quot;wpline&quot;).addEventListener(&quot;click&quot;,function(){var on=this.getAttribute(&quot;aria-pressed&quot;)!==&quot;true&quot;;this.setAttribute(&quot;aria-pressed&quot;,on);$(&quot;wptrend&quot;).style.display=on?&quot;&quot;:&quot;none&quot;;});
  }

  /* mobility simulator */
  var mw=$(&quot;mw&quot;),mt=$(&quot;mt&quot;);
  function mob(){
    var w=+mw.value/100,tb=+mt.value;
    var a=w*85+(1-w)*50,b=w*20+(1-w)*tb;
    $(&quot;mwo&quot;).textContent=mw.value+&quot;%&quot;;$(&quot;mto&quot;).textContent=tb;
    $(&quot;mbA&quot;).setAttribute(&quot;width&quot;,a*4);$(&quot;mbB&quot;).setAttribute(&quot;width&quot;,b*4);
    $(&quot;mvA&quot;).textContent=Math.round(a);$(&quot;mvB&quot;).textContent=Math.round(b);
    $(&quot;mvA&quot;).setAttribute(&quot;x&quot;,150+a*4+6);$(&quot;mvB&quot;).setAttribute(&quot;x&quot;,150+b*4+6);
    var msg;
    if(Math.abs(a-b)&lt;3)msg=&quot;They end up at almost the same point.&quot;;
    else if(b&gt;a)msg=&quot;The person from a modest family overtakes the one born at the top: achievement prevails and the society is open.&quot;;
    else msg=&quot;The person born at the top stays ahead&quot;+(tb&gt;50?&quot; despite having less talent&quot;:&quot;&quot;)+&quot;: ascription prevails and the society is closed.&quot;;
    $(&quot;mmsg&quot;).textContent=msg;
  }
  if(mw){mw.addEventListener(&quot;input&quot;,mob);mt.addEventListener(&quot;input&quot;,mob);mob();}

  /* cumulative discrimination */
  var DS=[&quot;Same human capital&quot;,&quot;CV screening&quot;,&quot;Interview&quot;,&quot;Starting salary&quot;,&quot;Promotion&quot;];
  var DIN=[100,100,100,100,100],DOUT=[100,82,70,62,52];
  function discInit(){
    var svg=$(&quot;disc&quot;);if(!svg)return;
    DS.forEach(function(s,i){
      var x=20+i*118;
      svg.appendChild(el(&quot;rect&quot;,{x:x,y:200-DIN[i]*1.6,width:40,height:DIN[i]*1.6,&quot;class&quot;:&quot;inks dbar&quot;,fill:&quot;none&quot;,&quot;stroke-width&quot;:2,&quot;data-i&quot;:i}));
      svg.appendChild(el(&quot;rect&quot;,{x:x+46,y:200-DOUT[i]*1.6,width:40,height:DOUT[i]*1.6,&quot;class&quot;:&quot;c dbar&quot;,&quot;data-i&quot;:i}));
      svg.appendChild(el(&quot;text&quot;,{x:x+66,y:195-DOUT[i]*1.6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12,&quot;font-weight&quot;:700,&quot;class&quot;:&quot;dbar&quot;,&quot;data-i&quot;:i},DOUT[i]));
      svg.appendChild(el(&quot;text&quot;,{x:x+43,y:220,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11.5},s));
    });
  }
  function disc(step){
    var svg=$(&quot;disc&quot;);if(!svg)return;
    svg.querySelectorAll(&quot;.dbar&quot;).forEach(function(r){r.style.opacity=(+r.getAttribute(&quot;data-i&quot;)&lt;step)?1:.1;});
  }
  discInit();

  /* steppers */
  var CB={disc:disc};
  document.querySelectorAll(&quot;[data-stepper]&quot;).forEach(function(box){
    var items=box.querySelectorAll(&quot;.steps li&quot;),i=0,name=box.getAttribute(&quot;data-stepper&quot;);
    var prev=box.querySelector(&quot;[data-dir=&#x27;-1&#x27;]&quot;),next=box.querySelector(&quot;[data-dir=&#x27;1&#x27;]&quot;),cnt=box.querySelector(&quot;.stepcount&quot;);
    function show(){
      items.forEach(function(li,j){li.classList.toggle(&quot;on&quot;,j===i);});
      box.setAttribute(&quot;data-step&quot;,i+1);
      prev.disabled=i===0;next.disabled=i===items.length-1;
      cnt.textContent=&quot;Step &quot;+(i+1)+&quot; of &quot;+items.length;
      if(CB[name])CB[name](i+1);
    }
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;items.length-1){i++;show();}});
    show();
  });
})();
&lt;/script&gt;
