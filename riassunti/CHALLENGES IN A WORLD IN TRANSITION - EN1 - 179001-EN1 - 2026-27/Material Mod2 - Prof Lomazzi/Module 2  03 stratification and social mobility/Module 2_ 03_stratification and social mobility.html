    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://time.com/7331119/zohran-mamdani-billionaires-ackman-bloomberg/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;time.com/7331119/zohran-mamdani-billionaires-ackman-bloomberg&lt;/a&gt; (link indicato nella slide 8) · contesto: &lt;a href=&quot;https://fortune.com/2025/11/06/zohran-mamdani-billionaires-now-offering-help-jamie-dimon-bill-ackman&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fortune, 6/11/2025&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;È la fonte delle cifre della slide 8. Secondo la stampa (Fortune, che cita Forbes), più miliardari hanno speso complessivamente oltre 22 milioni di dollari per sostenere gli avversari di Mamdani, e alcuni hanno poi offerto collaborazione dopo la sua vittoria. Conta come caso concreto del legame tra concentrazione della wealth e influenza politica. Le cifre variano un po&#x27; tra le testate: verifica sull&#x27;articolo originale.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;DW — “COVID-19 has worsened economic inequality” (video)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=rx--hD2fHCE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=rx--hD2fHCE&lt;/a&gt; (link indicato nella slide 10)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Servizio di Deutsche Welle sull&#x27;aumento delle disuguaglianze economiche durante la pandemia. La ricerca web non ha trovato una scheda DW con questo titolo esatto, quindi guarda direttamente il video. È utile come esempio concreto di come gli svantaggi si sommano.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;M. Granovetter — “The Strength of Weak Ties”, &lt;em&gt;American Journal of Sociology&lt;/em&gt; 78(6), 1973, pp. 1360–1380&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.jstor.org/stable/2776392&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;JSTOR 2776392&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;L&#x27;articolo collega la forza dei legami alla sovrapposizione tra reti di amicizia e ne studia le conseguenze per la diffusione delle informazioni, le opportunità di mobilità e l&#x27;organizzazione delle comunità. È supportato da un&#x27;indagine su chi cercava lavoro. È tra gli articoli di scienze sociali più citati di sempre ed è il riferimento della slide 18.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;R. D. Putnam — &lt;em&gt;Bowling Alone&lt;/em&gt; (2000)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://archives.evergreen.edu/webpages/curricular/2003-2004/artofplace/BowlingAloneStudyGuideI_II.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;guida allo studio (Evergreen State College)&lt;/a&gt; · &lt;a href=&quot;https://www.blinkist.com/books/bowling-alone-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi dei concetti chiave&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;È l&#x27;opera più nota di Putnam sul declino della partecipazione civica e del social capital negli Stati Uniti. Introduce la distinzione bonding/bridging e mostra il social capital come risorsa collettiva legata a democrazia, salute e qualità della vita, cioè la visione da public good della slide 18. I link sono materiali secondari: per le citazioni esatte usa il libro.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;G. S. Becker — &lt;em&gt;Human Capital&lt;/em&gt; (NBER, 1964)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;badge b-int&quot;&gt;non citato nelle slide&lt;/span&gt;&lt;a href=&quot;https://openlibrary.org/books/OL5907598M&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open Library — scheda del libro&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;È il testo classico della teoria dello human capital: tratta l&#x27;istruzione e la formazione come investimenti, simili a quelli delle imprese in macchinari. Le slide non lo citano, ma è il riferimento standard per la definizione della slide 17.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;

  /* Gini data (slide 7, World Bank 2017b) */
  var G=[[&quot;United States&quot;,&quot;North America&quot;,41.5,2016],[&quot;Canada&quot;,&quot;North America&quot;,34.0,2013],[&quot;Mexico&quot;,&quot;North America&quot;,43.4,2016],

      (g&lt;=1?&quot;Nessuna disuguaglianza: la curva coincide con la diagonale.&quot;:&quot;Paese della slide 7 più vicino: &quot;+best[0]+&quot; (&quot;+best[2]+&quot;).&quot;);
  }
  if(lp){lp.addEventListener(&quot;input&quot;,lorenz);ls.addEventListener(&quot;input&quot;,lorenz);lorenz();}

  /* Gini chart */
  var region=&quot;all&quot;,byVal=true;

    var rh=24,top=10,L=140,W=440,max=70,h=top+d.length*rh+26;

      svg.appendChild(el(&quot;line&quot;,{x1:x,y1:top-4,x2:x,y2:h-20,&quot;class&quot;:&quot;rl&quot;,&quot;stroke-width&quot;:1}));
      svg.appendChild(el(&quot;text&quot;,{x:x,y:h-4,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:11,&quot;class&quot;:&quot;mut&quot;},v));
    });
    var x30=L+W*30/max;
    svg.appendChild(el(&quot;line&quot;,{x1:x30,y1:top-4,x2:x30,y2:h-20,&quot;class&quot;:&quot;acs&quot;,&quot;stroke-width&quot;:1.2,&quot;stroke-dasharray&quot;:&quot;4 4&quot;}));
    d.forEach(function(c,i){
      var y=top+i*rh,it=c[0]===&quot;Italy&quot;;
      svg.appendChild(el(&quot;text&quot;,{x:L-8,y:y+15,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:13,&quot;font-weight&quot;:it?700:400},c[0]));
      var r=el(&quot;rect&quot;,{x:L,y:y+3,width:W*c[2]/max,height:rh-8,rx:3,&quot;class&quot;:it?&quot;ac&quot;:&quot;c&quot;});
      r.appendChild(el(&quot;title&quot;,{},c[0]+&quot;: &quot;+c[2]+&quot; (&quot;+c[3]+&quot;)&quot;));
      svg.appendChild(r);
      svg.appendChild(el(&quot;text&quot;,{x:L+W*c[2]/max+6,y:y+15,&quot;font-size&quot;:12},c[2].toFixed(1)+&quot;  ·  &quot;+c[3]));
    });
  }
  var gf=$(&quot;gfilt&quot;);

    $(&quot;gsort&quot;).addEventListener(&quot;click&quot;,function(){byVal=!byVal;this.setAttribute(&quot;aria-pressed&quot;,byVal?&quot;true&quot;:&quot;false&quot;);gchart();});
    gchart();
  }

  /* Wilkinson &amp; Pickett scatter (approx. from slide 9) */
  var WP=[[&quot;USA&quot;,595,155],[&quot;Portugal&quot;,545,277],[&quot;UK&quot;,470,333],[&quot;Greece&quot;,383,392],[&quot;Ireland&quot;,370,410],[&quot;New Zealand&quot;,437,405],[&quot;France&quot;,329,439],
    [&quot;Australia&quot;,455,437],[&quot;Austria&quot;,259,445],[&quot;Germany&quot;,293,455],[&quot;Canada&quot;,332,457],[&quot;Italy&quot;,424,464],[&quot;Denmark&quot;,212,474],[&quot;Belgium&quot;,239,480],
    [&quot;Spain&quot;,324,490],[&quot;Switzerland&quot;,342,514],[&quot;Finland&quot;,160,509],[&quot;Netherlands&quot;,302,521],[&quot;Norway&quot;,172,538],[&quot;Sweden&quot;,180,567],[&quot;Japan&quot;,134,630]];
  var pts=$(&quot;wppts&quot;);

    var labs=[];

    $(&quot;wpline&quot;).addEventListener(&quot;click&quot;,function(){var on=this.getAttribute(&quot;aria-pressed&quot;)!==&quot;true&quot;;this.setAttribute(&quot;aria-pressed&quot;,on);$(&quot;wptrend&quot;).style.display=on?&quot;&quot;:&quot;none&quot;;});

  /* mobility simulator */
  var mw=$(&quot;mw&quot;),mt=$(&quot;mt&quot;);

    var w=+mw.value/100,tb=+mt.value;

  /* cumulative discrimination */
  var DS=[&quot;Stesso human capital&quot;,&quot;CV screening&quot;,&quot;Colloquio&quot;,&quot;Salario d&#x27;ingresso&quot;,&quot;Promozione&quot;];
  var DIN=[100,100,100,100,100],DOUT=[100,82,70,62,52];

    DS.forEach(function(s,i){

      svg.appendChild(el(&quot;rect&quot;,{x:x,y:200-DIN[i]*1.6,width:40,height:DIN[i]*1.6,&quot;class&quot;:&quot;inks dbar&quot;,fill:&quot;none&quot;,&quot;stroke-width&quot;:2,&quot;data-i&quot;:i}));
      svg.appendChild(el(&quot;rect&quot;,{x:x+46,y:200-DOUT[i]*1.6,width:40,height:DOUT[i]*1.6,&quot;class&quot;:&quot;c dbar&quot;,&quot;data-i&quot;:i}));
      svg.appendChild(el(&quot;text&quot;,{x:x+66,y:195-DOUT[i]*1.6,&quot;text-anchor&quot;:&quot;middle&quot;,&quot;font-size&quot;:12,&quot;font-weight&quot;:700,&quot;class&quot;:&quot;dbar&quot;,&quot;data-i&quot;:i},DOUT[i]));

  function disc(step){
    var svg=$(&quot;disc&quot;);if(!svg)return;
    svg.querySelectorAll(&quot;.dbar&quot;).forEach(function(r){r.style.opacity=(+r.getAttribute(&quot;data-i&quot;)&lt;step)?1:.1;});

  discInit();

  /* steppers */
  var CB={disc:disc};
  document.querySelectorAll(&quot;[data-stepper]&quot;).forEach(function(box){
    var items=box.querySelectorAll(&quot;.steps li&quot;),i=0,name=box.getAttribute(&quot;data-stepper&quot;);
    var prev=box.querySelector(&quot;[data-dir=&#x27;-1&#x27;]&quot;),next=box.querySelector(&quot;[data-dir=&#x27;1&#x27;]&quot;),cnt=box.querySelector(&quot;.stepcount&quot;);
    function show(){
      items.forEach(function(li,j){li.classList.toggle(&quot;on&quot;,j===i);});
      box.setAttribute(&quot;data-step&quot;,i+1);
      prev.disabled=i===0;next.disabled=i===items.length-1;
      cnt.textContent=&quot;Passo &quot;+(i+1)+&quot; di &quot;+items.length;
      if(CB[name])CB[name](i+1);
    }
    prev.addEventListener(&quot;click&quot;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&quot;click&quot;,function(){if(i&lt;items.length-1){i++;show();}});
    show();
  });
})();
