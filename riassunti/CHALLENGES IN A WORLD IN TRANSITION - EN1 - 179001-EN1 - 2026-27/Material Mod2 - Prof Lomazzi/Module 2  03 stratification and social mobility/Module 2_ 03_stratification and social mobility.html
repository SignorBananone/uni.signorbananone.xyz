    &lt;summary&gt;Dove eravamo rimasti: la lezione precedente (slide 2)&lt;/summary&gt;
    &lt;div&gt;
      &lt;p&gt;La slide 2 riassume la lezione precedente, di cui questa è la continuazione:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Differences and inequalities&lt;/b&gt;: una &lt;em&gt;difference&lt;/em&gt; (differenza) diventa &lt;em&gt;inequality&lt;/em&gt; (disuguaglianza) quando si traduce in accesso diseguale a risorse e opportunità di valore.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Intersectionality&lt;/b&gt; (intersezionalità): le appartenenze (genere, etnia, classe, età…) si incrociano e i loro effetti si sommano o si moltiplicano. La ritroverai qui nel caso COVID-19 e nella &lt;em&gt;cumulative discrimination&lt;/em&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Stratification&lt;/b&gt; (social class e social status): ripresa e approfondita qui sotto.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Global inequalities&lt;/b&gt;: l&#x27;esempio dei &lt;em&gt;powerful passports&lt;/em&gt;, cioè i passaporti che permettono di viaggiare senza visto in molti più Paesi di altri.&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;note&quot;&gt;Le brevi spiegazioni di questi punti sono un mio richiamo: in questa lezione la slide riporta solo i titoli. Non sono riuscito a consultare gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt;, quindi per i dettagli fai riferimento alle slide della lezione precedente.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE 1 ============ --&gt;
&lt;section id=&quot;p1&quot; class=&quot;part p-sage&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Parte 1 · Stratification&lt;/div&gt;
    &lt;h2&gt;Come si ordinano individui e gruppi&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;La domanda di partenza della slide 3: &lt;em&gt;“How do we rank individuals (or groups) in society?”&lt;/em&gt; Come mettiamo in ordine individui (o gruppi) in una società?&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social stratification&lt;/b&gt; (stratificazione sociale): la società è organizzata come una serie di strati sovrapposti, cioè posizioni gerarchiche che danno accesso diverso a risorse di valore come reddito, ricchezza, prestigio e potere. Come gli strati di una roccia, sono stabili, ma non immobili.&lt;/div&gt;

  &lt;h3 id=&quot;s-class&quot;&gt;Social class e social status &lt;span class=&quot;slides&quot;&gt;slide 3&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Per mettere in ordine le persone il corso usa due criteri: la &lt;span class=&quot;term&quot;&gt;social class&lt;/span&gt; (classe sociale) e lo &lt;span class=&quot;term&quot;&gt;social status&lt;/span&gt; (status sociale). Nella definizione di lavoro delle slide, la social class è una &lt;b&gt;gerarchia basata sull&#x27;occupation&lt;/b&gt;, cioè sulla professione o posizione lavorativa.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Marx &amp;amp; Engels&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Class vs status&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Perché l&#x27;occupation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Per &lt;b&gt;Marx ed Engels&lt;/b&gt; le classi decisive erano due: i &lt;span class=&quot;term&quot;&gt;capitalists&lt;/span&gt; (capitalisti) e i &lt;span class=&quot;term&quot;&gt;laborers&lt;/span&gt; (lavoratori salariati). L&#x27;industrializzazione ha portato con sé una distribuzione diseguale: da una parte i ricchi imprenditori che possiedono fabbriche e macchine, cioè il &lt;em&gt;capital&lt;/em&gt;, dall&#x27;altra i lavoratori che lavorano per un reddito basso. Per questo i capitalisti occupano posizioni di classe più favorevoli.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 270&quot; role=&quot;img&quot; aria-label=&quot;Schema a due classi di Marx&quot;&gt;
          &lt;rect x=&quot;170&quot; y=&quot;14&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; class=&quot;cb cs&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Capitalists&lt;/text&gt;
          &lt;text x=&quot;280&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;possiedono il capital: fabbriche, macchine&lt;/text&gt;
          &lt;rect x=&quot;40&quot; y=&quot;170&quot; width=&quot;480&quot; height=&quot;86&quot; rx=&quot;10&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Laborers&lt;/text&gt;
          &lt;text x=&quot;280&quot; y=&quot;218&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;13&quot;&gt;possiedono solo il proprio lavoro&lt;/text&gt;
          &lt;g class=&quot;c&quot;&gt;
            &lt;circle cx=&quot;110&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;140&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;170&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;230&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;330&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;360&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;390&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;450&quot; cy=&quot;236&quot; r=&quot;6&quot;/&gt;
          &lt;/g&gt;
          &lt;path d=&quot;M215 166 V92&quot; class=&quot;inks&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;
          &lt;path d=&quot;M345 92 V166&quot; class=&quot;acs&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
          &lt;text x=&quot;205&quot; y=&quot;132&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot;&gt;lavoro&lt;/text&gt;
          &lt;text x=&quot;355&quot; y=&quot;132&quot; font-size=&quot;13&quot; class=&quot;ac&quot;&gt;salario basso&lt;/text&gt;
          &lt;text x=&quot;400&quot; y=&quot;54&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;→ profitto&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Pochi proprietari del capitale, molti lavoratori: il valore prodotto dal lavoro sale verso chi possiede i mezzi di produzione, mentre in basso arriva un salario basso.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt;Le slide nominano &lt;em&gt;social class&lt;/em&gt; e &lt;em&gt;social status&lt;/em&gt; senza definire il secondo. La distinzione classica della sociologia, che risale a Max Weber, è questa:&lt;/p&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social class&lt;/h4&gt;Posizione &lt;b&gt;economica&lt;/b&gt;: dipende da cosa possiedi e da che lavoro fai (occupation, reddito, proprietà). Riguarda le &lt;em&gt;life chances&lt;/em&gt; (le possibilità di vita) che il mercato ti offre.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Social status&lt;/h4&gt;Posizione di &lt;b&gt;prestigio&lt;/b&gt;: quanto onore e rispetto la società riconosce a un gruppo o a uno stile di vita. Un sacerdote o un insegnante possono avere uno status alto con un reddito medio.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Le due scale spesso coincidono, ma non sempre: un nuovo ricco può avere una classe alta e un prestigio contestato.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;Perché proprio l&#x27;&lt;span class=&quot;term&quot;&gt;occupation&lt;/span&gt;? Perché nelle società moderne il lavoro è il canale principale attraverso cui arrivano reddito, sicurezza, prestigio e reti sociali. Per questo la professione è un buon riassunto della posizione di una persona. Ritroverai il lavoro nella Parte 4: lo &lt;em&gt;human capital&lt;/em&gt; serve proprio a ottenere una migliore posizione nel &lt;em&gt;labor market&lt;/em&gt; (mercato del lavoro).&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;Collegamento interno alla lezione: social class (slide 3) → human capital e job outcomes (slide 17).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-income&quot;&gt;Income e wealth: la scala sociale del denaro &lt;span class=&quot;slides&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Individui e gruppi si possono disporre su una gerarchia, una &lt;em&gt;social ladder&lt;/em&gt; (scala sociale), soprattutto in base a &lt;span class=&quot;term&quot;&gt;income&lt;/span&gt; e &lt;span class=&quot;term&quot;&gt;wealth&lt;/span&gt;. La slide 4 pone la domanda chiave: &lt;em&gt;quanto è stratificata una società rispetto a questo bene di valore?&lt;/em&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Income = reddito&lt;/h4&gt;È un &lt;b&gt;flusso&lt;/b&gt;: ciò che entra in un periodo di tempo (stipendi, pensioni, affitti incassati, interessi). Si misura “all&#x27;anno”.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Wealth = ricchezza, patrimonio&lt;/h4&gt;È uno &lt;b&gt;stock&lt;/b&gt;: ciò che possiedi in un dato momento (casa, risparmi, azioni) meno i debiti. Si accumula e si eredita.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;&lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt;In genere la wealth è distribuita in modo molto più diseguale dell&#x27;income, perché si accumula nel tempo e passa da una generazione all&#x27;altra. È un legame diretto con l&#x27;&lt;em&gt;intergenerational transmission&lt;/em&gt; della Parte 3.&lt;/p&gt;

  &lt;h3 id=&quot;s-gini&quot;&gt;Il Gini coefficient &lt;span class=&quot;slides&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;term&quot;&gt;Gini coefficient&lt;/span&gt; (coefficiente di Gini) riassume in un solo numero &lt;b&gt;la stratificazione complessiva&lt;/b&gt; di una società.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;0 = uguaglianza perfetta&lt;/h4&gt;Tutti nel Paese hanno lo stesso income (o la stessa wealth).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;100 = disuguaglianza massima&lt;/h4&gt;Tutto l&#x27;income (o tutta la wealth) è nelle mani di una sola persona.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Come si calcola? Le slide non lo dicono, ma serve per capirlo. Si mettono le persone in fila dalla più povera alla più ricca e si disegna la &lt;span class=&quot;term&quot;&gt;Lorenz curve&lt;/span&gt; (curva di Lorenz): per ogni quota di popolazione, dal basso, mostra quale quota del reddito totale possiede. Se tutti avessero lo stesso reddito, la curva coinciderebbe con la diagonale.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;G = A ⁄ (A + B) = 2A &amp;nbsp; &lt;span class=&quot;small muted&quot;&gt;(× 100 per la scala 0–100)&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;A è l&#x27;area tra la diagonale e la curva di Lorenz; A + B è tutto il triangolo sotto la diagonale, che vale ½. Più la curva “si incurva”, più A cresce e più alto è il Gini.&lt;/p&gt;

  &lt;figure&gt;
    &lt;div class=&quot;grid2&quot; style=&quot;margin:0;align-items:center&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 320&quot; role=&quot;img&quot; aria-label=&quot;Curva di Lorenz interattiva&quot;&gt;
        &lt;rect x=&quot;30&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;260&quot; fill=&quot;none&quot; class=&quot;rl&quot; stroke-width=&quot;1&quot;/&gt;
        &lt;polygon id=&quot;larea&quot; class=&quot;cb&quot;/&gt;
        &lt;line x1=&quot;30&quot; y1=&quot;290&quot; x2=&quot;290&quot; y2=&quot;30&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;polyline id=&quot;lcurve&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle id=&quot;lpt&quot; r=&quot;5&quot; class=&quot;ac&quot;/&gt;
        &lt;text x=&quot;160&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;% cumulata della popolazione (dal più povero) →&lt;/text&gt;
        &lt;text x=&quot;14&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot; transform=&quot;rotate(-90 14 160)&quot;&gt;% cumulata del reddito →&lt;/text&gt;
        &lt;text x=&quot;200&quot; y=&quot;110&quot; font-size=&quot;11&quot; class=&quot;mut&quot; transform=&quot;rotate(-45 200 110)&quot;&gt;uguaglianza perfetta&lt;/text&gt;
        &lt;text id=&quot;lA&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; class=&quot;c&quot;&gt;A&lt;/text&gt;
      &lt;/svg&gt;
      &lt;div&gt;
        &lt;p style=&quot;margin-top:0&quot;&gt;&lt;b&gt;Prova tu.&lt;/b&gt; Una società semplificata con due gruppi: i ricchi (in alto) e tutti gli altri. Dentro ciascun gruppo tutti hanno lo stesso reddito.&lt;/p&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;lp&quot;&gt;Quota di popolazione “ricca”&lt;/label&gt;&lt;input id=&quot;lp&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;50&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;lpo&quot;&gt;10%&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ls&quot;&gt;Quota del reddito che possiede&lt;/label&gt;&lt;input id=&quot;ls&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;lso&quot;&gt;40%&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;readout&quot;&gt;&lt;span class=&quot;big&quot; id=&quot;lg&quot;&gt;30&lt;/span&gt; &lt;span&gt;Gini&lt;/span&gt;&lt;br&gt;&lt;span id=&quot;ltxt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;figcaption&gt;Con due gruppi interni omogenei il Gini si riduce a &lt;b&gt;G = s − p&lt;/b&gt;, cioè quota di reddito dei ricchi meno la loro quota di popolazione. Con l&#x27;esempio della slide 6 (il 10% ha il 40% del reddito) si ottiene &lt;b&gt;30&lt;/b&gt;. Nella realtà le differenze dentro i gruppi alzano il valore.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Income stratification nel mondo &lt;span class=&quot;slides&quot;&gt;slide 7&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La tabella della slide 7 (fonte: World Bank, 2017b) confronta il Gini del reddito in diversi Paesi. Filtra per continente oppure ordina i valori.&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;btns&quot; id=&quot;gfilt&quot;&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;true&quot; data-r=&quot;all&quot;&gt;Tutti&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;North America&quot;&gt;North America&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;South America&quot;&gt;South America&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Asia&quot;&gt;Asia&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Africa&quot;&gt;Africa&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Europe&quot;&gt;Europe&lt;/button&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;false&quot; data-r=&quot;Oceania&quot;&gt;Oceania&lt;/button&gt;
      &lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;
      &lt;button class=&quot;pill&quot; aria-pressed=&quot;true&quot; id=&quot;gsort&quot;&gt;Ordina per valore&lt;/button&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;gchart&quot; viewBox=&quot;0 0 640 100&quot; role=&quot;img&quot; aria-label=&quot;Gini coefficient per Paese&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Dati della slide 7 (World Bank, 2017b). L&#x27;anno tra parentesi cambia da Paese a Paese, quindi il confronto è indicativo. Linea tratteggiata: 30, il valore dell&#x27;esempio “10% con il 40%”.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Agli estremi&lt;/h4&gt;Sudafrica &lt;b&gt;63.0&lt;/b&gt;, il più diseguale della tabella, ancora segnato dall&#x27;eredità dell&#x27;apartheid. Danimarca &lt;b&gt;28.2&lt;/b&gt;, il più egualitario.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;L&#x27;Europa&lt;/h4&gt;L&#x27;Europa è compatta tra 28 e 38. L&#x27;Italia (&lt;b&gt;35.4&lt;/b&gt;) è più diseguale di Germania, Francia e paesi nordici e meno di Russia e Stati Uniti.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Le Americhe&lt;/h4&gt;Brasile &lt;b&gt;51.3&lt;/b&gt;, Messico 43.4, Stati Uniti 41.5: tra i Paesi ricchi gli USA spiccano per disuguaglianza.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Secondo le slide, su cosa si basa la gerarchia della social class?&lt;/summary&gt;&lt;div&gt;Sull&#x27;&lt;b&gt;occupation&lt;/b&gt;, cioè la posizione lavorativa. Per Marx ed Engels la divisione fondamentale era tra chi possiede il capitale (capitalists) e chi vende il proprio lavoro per un reddito basso (laborers).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra income e wealth?&lt;/summary&gt;&lt;div&gt;L&#x27;income è un flusso (quanto entra in un periodo). La wealth è uno stock (quanto si possiede in un momento, al netto dei debiti). La wealth si accumula e si eredita.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa significano un Gini pari a 0 e uno pari a 100?&lt;/summary&gt;&lt;div&gt;0: tutti hanno lo stesso reddito o la stessa ricchezza. 100: tutto è nelle mani di una sola persona. Il coefficiente riassume la stratificazione complessiva di una società.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nella società a due gruppi, il 20% più ricco ha il 50% del reddito. Quanto vale il Gini?&lt;/summary&gt;&lt;div&gt;G = s − p = 50 − 20 = &lt;b&gt;30&lt;/b&gt;. Verificalo con i cursori qui sopra.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Sudafrica 63.0 e Danimarca 28.2: come leggeresti la differenza?&lt;/summary&gt;&lt;div&gt;In Sudafrica il reddito è molto più concentrato al vertice: la Lorenz curve è molto lontana dalla diagonale e la “scala sociale” ha gradini molto distanti. In Danimarca le distanze sono molto più ridotte.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE 2 ============ --&gt;
&lt;section id=&quot;p2&quot; class=&quot;part p-ocher&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Parte 2 · Perché conta&lt;/div&gt;
    &lt;h2&gt;Le conseguenze della disuguaglianza&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;La stratificazione non è solo una questione di numeri: le slide 8–10 mostrano effetti sulla democrazia, sulla salute e sulla vita sociale, e il modo in cui gli svantaggi si sommano in una crisi.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-rich&quot;&gt;Super rich and democracy &lt;span class=&quot;slides&quot;&gt;slide 8&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Quando la ricchezza è molto concentrata, si concentra anche la capacità di influenzare la politica. La slide parla dell&#x27;influenza dei &lt;em&gt;tech &amp;amp; billionaires&lt;/em&gt; (grandi imprenditori tecnologici e miliardari) sulla politica e sulla democrazia. L&#x27;esempio recente è l&#x27;elezione del sindaco di New York: i gruppi che hanno finanziato la campagna contro Zohran Mamdani, poi eletto sindaco.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 170&quot; role=&quot;img&quot; aria-label=&quot;I tre principali donatori contro Mamdani&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;18&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;I primi tre donatori (milioni di dollari)&lt;/text&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;56&quot;&gt;Michael Bloomberg&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;72&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;financial services&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;42&quot; width=&quot;370&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;548&quot; y=&quot;61&quot; font-weight=&quot;700&quot;&gt;13.3&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;104&quot;&gt;Lauder Family&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;120&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;cosmetics industry&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;90&quot; width=&quot;72&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;109&quot; font-weight=&quot;700&quot;&gt;2.6&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;152&quot;&gt;Joe Gebbia&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;168&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;co-founder di Airbnb&lt;/text&gt;
        &lt;rect x=&quot;170&quot; y=&quot;138&quot; width=&quot;56&quot; height=&quot;26&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;234&quot; y=&quot;157&quot; font-weight=&quot;700&quot;&gt;2.0&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Cifre della slide 8 (fonte indicata: articolo di TIME, vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;). La lista prosegue (“more…”).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il punto sociologico&lt;/b&gt;: in democrazia vale “una testa, un voto”, ma le risorse per farsi sentire (finanziare campagne, pubblicità, gruppi di pressione) seguono la distribuzione della wealth. Una stratificazione economica forte rischia di trasformarsi in stratificazione del &lt;b&gt;potere politico&lt;/b&gt;.&lt;/div&gt;

  &lt;h3 id=&quot;s-health&quot;&gt;Health and social problems are worse in more unequal countries &lt;span class=&quot;slides&quot;&gt;slide 9&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il grafico di &lt;b&gt;Wilkinson &amp;amp; Pickett (2009)&lt;/b&gt; mette sull&#x27;asse orizzontale l&#x27;&lt;em&gt;income inequality&lt;/em&gt; di alcuni Paesi ricchi e su quello verticale un &lt;span class=&quot;term&quot;&gt;index of health and social problems&lt;/span&gt; (indice composito di problemi sanitari e sociali). Clicca un punto per leggerne il nome.&lt;/p&gt;
  &lt;figure&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;pill&quot; id=&quot;wpline&quot; aria-pressed=&quot;true&quot;&gt;Retta di tendenza&lt;/button&gt;&lt;button class=&quot;pill&quot; id=&quot;wplab&quot; aria-pressed=&quot;false&quot;&gt;Mostra tutti i nomi&lt;/button&gt;&lt;/div&gt;
    &lt;svg id=&quot;wp&quot; viewBox=&quot;60 120 720 590&quot; role=&quot;img&quot; aria-label=&quot;Diagramma a dispersione: disuguaglianza e problemi sociali&quot;&gt;
      &lt;line x1=&quot;95&quot; y1=&quot;130&quot; x2=&quot;95&quot; y2=&quot;650&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;line x1=&quot;95&quot; y1=&quot;650&quot; x2=&quot;740&quot; y2=&quot;650&quot; class=&quot;inks&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;text x=&quot;88&quot; y=&quot;152&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;peggio&lt;/text&gt;
      &lt;text x=&quot;88&quot; y=&quot;642&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;meglio&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;675&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;bassa&lt;/text&gt;
      &lt;text x=&quot;735&quot; y=&quot;675&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; class=&quot;mut&quot;&gt;alta&lt;/text&gt;
      &lt;text x=&quot;420&quot; y=&quot;700&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot;&gt;Income inequality →&lt;/text&gt;
      &lt;text x=&quot;72&quot; y=&quot;400&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; transform=&quot;rotate(-90 72 400)&quot;&gt;Index of health and social problems →&lt;/text&gt;
      &lt;line id=&quot;wptrend&quot; x1=&quot;133&quot; y1=&quot;588&quot; x2=&quot;697&quot; y2=&quot;190&quot; class=&quot;acs&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;g id=&quot;wppts&quot;&gt;&lt;/g&gt;
      &lt;text id=&quot;wpname&quot; x=&quot;110&quot; y=&quot;180&quot; font-size=&quot;20&quot; font-weight=&quot;600&quot; class=&quot;ac&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Posizioni ricostruite a mano dal grafico della slide 9, quindi approssimate. Fonte originale: Wilkinson &amp;amp; Pickett, 2009.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;h4&gt;Cosa entra nell&#x27;indice&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;Life expectancy (speranza di vita) · maths &amp;amp; literacy (competenze di matematica e lettura) · infant mortality (mortalità infantile) · homicides · imprisonment (incarcerazione) · teenage births (gravidanze adolescenziali) · trust (fiducia) · obesity · mental illness, incluse le dipendenze da droghe e alcol · &lt;b&gt;social mobility&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;h4&gt;Come leggerlo&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;I Paesi più diseguali (USA, Portogallo, Regno Unito) stanno in alto a destra, quelli più egualitari (Giappone, paesi nordici) in basso a sinistra. La pendenza positiva indica che &lt;b&gt;più disuguaglianza va insieme a più problemi&lt;/b&gt;, e non solo per i poveri: è la società nel suo insieme a stare peggio.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Attenzione: correlazione non vuol dire causalità&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Il grafico mostra una &lt;em&gt;correlation&lt;/em&gt; (i due fenomeni variano insieme), non prova da solo che la disuguaglianza &lt;em&gt;causi&lt;/em&gt; i problemi. Potrebbero esserci terze variabili, come la storia, il welfare o la cultura.&lt;/p&gt;
    &lt;p class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;Gli autori ipotizzano che la disuguaglianza eroda la fiducia e aumenti ansia e malattia. Il libro ha avuto anche forti critiche, alle quali gli autori hanno risposto in un capitolo aggiunto all&#x27;edizione del 2010. Nel 2024 la Equality Trust ha aggiornato i dati nel rapporto &lt;em&gt;The Spirit Level at 15&lt;/em&gt;. — &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;equalitytrust.org.uk&lt;/a&gt;&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;p class=&quot;note&quot;&gt;Nota il collegamento: la &lt;b&gt;social mobility&lt;/b&gt; è una delle componenti dell&#x27;indice. Le società più stratificate tendono anche a essere quelle in cui ci si muove meno, ed è il tema della Parte 3.&lt;/p&gt;

  &lt;h3 id=&quot;s-covid&quot;&gt;Intersection of global inequalities: il caso COVID-19 &lt;span class=&quot;slides&quot;&gt;slide 10&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La slide propone un video di DW, &lt;em&gt;“COVID-19 has worsened economic inequality”&lt;/em&gt; (&lt;a href=&quot;https://www.youtube.com/watch?v=rx--hD2fHCE&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=rx--hD2fHCE&lt;/a&gt;). Il titolo della slide richiama l&#x27;&lt;span class=&quot;term&quot;&gt;intersectionality&lt;/span&gt; della lezione precedente: una crisi non colpisce tutti allo stesso modo, perché gli svantaggi si sovrappongono.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 300&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn degli svantaggi&quot;&gt;
      &lt;circle cx=&quot;230&quot; cy=&quot;120&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;circle cx=&quot;370&quot; cy=&quot;120&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;210&quot; r=&quot;95&quot; class=&quot;c&quot; fill-opacity=&quot;.18&quot;/&gt;
      &lt;text x=&quot;185&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Basso income&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;pochi risparmi&lt;/text&gt;
      &lt;text x=&quot;415&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Lavoro “in presenza”&lt;/text&gt;
      &lt;text x=&quot;415&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;niente smart working&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;270&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Salute e casa&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;287&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;sovraffollamento, malattie&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; class=&quot;ac&quot;&gt;rischio&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; class=&quot;ac&quot;&gt;massimo&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Schema esplicativo: chi si trova all&#x27;incrocio di più svantaggi (reddito, tipo di lavoro, condizioni abitative e di salute, spesso legati anche a etnia e genere) ha subito la pandemia in modo molto più duro, e il divario si è allargato.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;elezione del sindaco di New York è un esempio di stratificazione?&lt;/summary&gt;&lt;div&gt;Perché mostra come la concentrazione di wealth diventi capacità di influenzare la politica: pochi donatori molto ricchi (Bloomberg 13.3 milioni di $, famiglia Lauder 2.6, Gebbia 2) hanno finanziato gruppi contrari a un candidato. La disuguaglianza economica si traduce in disuguaglianza di influenza.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa c&#x27;è sui due assi del grafico di Wilkinson &amp;amp; Pickett, e quale relazione emerge?&lt;/summary&gt;&lt;div&gt;Asse X: income inequality. Asse Y: un indice di problemi sanitari e sociali (speranza di vita, mortalità infantile, omicidi, carcerazione, obesità, salute mentale, fiducia, social mobility…). La relazione è positiva: i Paesi più diseguali hanno più problemi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Si può concludere dal grafico che la disuguaglianza causa i problemi sociali?&lt;/summary&gt;&lt;div&gt;Non da solo: è una correlazione tra Paesi. Per parlare di causalità servono altri studi e il controllo di altre variabili. Gli autori propongono dei meccanismi (fiducia, ansia da status), ma questa interpretazione è discussa.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa c&#x27;entra l&#x27;intersectionality con il COVID-19?&lt;/summary&gt;&lt;div&gt;Gli svantaggi si sommano: chi era povero, faceva un lavoro non svolgibile da casa, viveva in case affollate o aveva già problemi di salute è stato colpito di più. La crisi ha così amplificato le disuguaglianze esistenti.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE 3 ============ --&gt;
&lt;section id=&quot;p3&quot; class=&quot;part p-slate&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Parte 3 · Social mobility&lt;/div&gt;
    &lt;h2&gt;Non solo dove sei, ma se puoi muoverti&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Slide 11–15. La social inequality non riguarda solo la stratificazione, ma anche l&#x27;&lt;b&gt;opportunità di spostarsi tra posizioni sociali&lt;/b&gt;.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social mobility&lt;/b&gt; (mobilità sociale): il movimento di individui o gruppi da una posizione sociale a un&#x27;altra. Può essere &lt;em&gt;upward&lt;/em&gt; (verso l&#x27;alto) o &lt;em&gt;downward&lt;/em&gt; (verso il basso).&lt;/div&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Stratificazione e mobilità come due dimensioni&quot;&gt;
      &lt;text x=&quot;140&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Stratification&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;quanto distano i gradini?&lt;/text&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;3&quot;&gt;&lt;line x1=&quot;90&quot; y1=&quot;50&quot; x2=&quot;90&quot; y2=&quot;215&quot;/&gt;&lt;line x1=&quot;190&quot; y1=&quot;50&quot; x2=&quot;190&quot; y2=&quot;215&quot;/&gt;&lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;90&quot; y1=&quot;70&quot; x2=&quot;190&quot; y2=&quot;70&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;160&quot; x2=&quot;190&quot; y2=&quot;160&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;190&quot; x2=&quot;190&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;90&quot; y1=&quot;210&quot; x2=&quot;190&quot; y2=&quot;210&quot;/&gt;&lt;/g&gt;
      &lt;path d=&quot;M205 72 V158&quot; class=&quot;acs&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;120&quot; font-size=&quot;12&quot; class=&quot;ac&quot;&gt;distanza&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Mobility&lt;/text&gt;
      &lt;text x=&quot;440&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;ci si può spostare?&lt;/text&gt;
      &lt;path d=&quot;M340 210 L540 60&quot; class=&quot;cs&quot; stroke-width=&quot;16&quot; stroke-linecap=&quot;round&quot; opacity=&quot;.25&quot;/&gt;
      &lt;path d=&quot;M360 190 L430 138&quot; class=&quot;acs&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
      &lt;path d=&quot;M520 75 L460 120&quot; class=&quot;inks&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;text x=&quot;380&quot; y=&quot;215&quot; font-size=&quot;12&quot;&gt;upward&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;75&quot; font-size=&quot;12&quot;&gt;downward&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;La slide 11 usa l&#x27;immagine delle scale mobili di un centro commerciale: la scala dice quanto sono lontani i piani (stratificazione), la scala mobile se e quanto facilmente si sale o si scende (mobilità).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;s-intra&quot;&gt;Intergenerational e intragenerational &lt;span class=&quot;slides&quot;&gt;slide 12–13&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 200&quot; role=&quot;img&quot; aria-label=&quot;Albero: social inequality, mobility, due sottodimensioni&quot;&gt;
        &lt;rect x=&quot;90&quot; y=&quot;8&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Social inequality&lt;/text&gt;
        &lt;path d=&quot;M160 42 V72&quot; class=&quot;cs&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ah)&quot;/&gt;
        &lt;rect x=&quot;90&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Mobility&lt;/text&gt;
        &lt;path d=&quot;M160 110 V130 H75 V150 M160 130 H245 V150&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;2.5&quot;/&gt;
        &lt;rect x=&quot;5&quot; y=&quot;154&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Intergenerational&lt;/text&gt;
        &lt;rect x=&quot;175&quot; y=&quot;154&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Intragenerational&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Ricostruzione dello schema della slide 13.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;La mobility ha due &lt;em&gt;subdimensions&lt;/em&gt; (sottodimensioni), che si distinguono per &lt;b&gt;con chi o con cosa&lt;/b&gt; si confronta la posizione di una persona:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Inter&lt;/b&gt;generational = &lt;em&gt;tra&lt;/em&gt; generazioni: genitori e figli a confronto.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Intra&lt;/b&gt;generational = &lt;em&gt;dentro&lt;/em&gt; una generazione: la stessa persona nel corso della vita.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Intergenerational&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Intragenerational&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Intergenerational mobility&lt;/span&gt;: cambiamento della posizione sociale &lt;b&gt;tra genitori e figli&lt;/b&gt;. Le slide citano come esempi di misura l&#x27;&lt;em&gt;occupational status&lt;/em&gt; (status occupazionale), la &lt;em&gt;wealth&lt;/em&gt; e perfino la &lt;em&gt;life expectancy&lt;/em&gt; (speranza di vita).&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra genitore e figlia&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;20&quot; x2=&quot;40&quot; y2=&quot;150&quot; class=&quot;rl&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;34&quot; y=&quot;28&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;alto&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;150&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;basso&lt;/text&gt;
          &lt;circle cx=&quot;150&quot; cy=&quot;125&quot; r=&quot;14&quot; class=&quot;inks&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Genitore: operaio&lt;/text&gt;
          &lt;circle cx=&quot;410&quot; cy=&quot;45&quot; r=&quot;14&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Figlia: medico&lt;/text&gt;
          &lt;path d=&quot;M170 118 Q 290 40 390 48&quot; fill=&quot;none&quot; class=&quot;acs&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
          &lt;text x=&quot;280&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;ac&quot;&gt;upward intergenerational&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Esempio: il figlio o la figlia di un operaio che diventa medico. Se la posizione dei figli dipende poco da quella dei genitori, la mobilità intergenerazionale è alta.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Intragenerational mobility&lt;/span&gt;: cambiamento della posizione sociale &lt;b&gt;nel corso della vita&lt;/b&gt; (&lt;em&gt;life course&lt;/em&gt;) della stessa persona.&lt;/p&gt;
      &lt;figure&gt;
        &lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Carriera nel corso della vita&quot;&gt;
          &lt;line x1=&quot;40&quot; y1=&quot;145&quot; x2=&quot;540&quot; y2=&quot;145&quot; class=&quot;rl&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;text x=&quot;540&quot; y=&quot;163&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;età →&lt;/text&gt;
          &lt;polyline points=&quot;60,125 160,110 260,70 360,55 450,95 520,90&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;g class=&quot;c&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;125&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;260&quot; cy=&quot;70&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;360&quot; cy=&quot;55&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;450&quot; cy=&quot;95&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
          &lt;text x=&quot;60&quot; y=&quot;113&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;stage&lt;/text&gt;
          &lt;text x=&quot;160&quot; y=&quot;98&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;impiegata&lt;/text&gt;
          &lt;text x=&quot;260&quot; y=&quot;58&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;laurea serale → quadro&lt;/text&gt;
          &lt;text x=&quot;360&quot; y=&quot;43&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;dirigente&lt;/text&gt;
          &lt;text x=&quot;450&quot; y=&quot;118&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; class=&quot;ac&quot;&gt;licenziamento&lt;/text&gt;
        &lt;/svg&gt;
        &lt;figcaption&gt;Una carriera reale alterna salite (promozioni, titoli di studio) e discese (perdita del lavoro, malattia, crisi): tutto ciò è mobilità intragenerazionale.&lt;/figcaption&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-lift&quot;&gt;Come può funzionare il “social lift”? &lt;span class=&quot;slides&quot;&gt;slide 14–15&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il &lt;span class=&quot;term&quot;&gt;social lift&lt;/span&gt; (ascensore sociale) funziona se una persona ha &lt;b&gt;resources&lt;/b&gt; (risorse) e &lt;b&gt;access to opportunities&lt;/b&gt; (accesso alle opportunità). La slide 14 nomina due meccanismi chiave: la coppia &lt;em&gt;ascription/achievement&lt;/em&gt; e la &lt;em&gt;intergenerational transmission&lt;/em&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Ascription&lt;/h4&gt;Caratteristiche &lt;b&gt;fissate alla nascita&lt;/b&gt;, come l&#x27;origine familiare (ma anche genere, etnia, luogo di nascita). In italiano si parla di caratteristiche &lt;em&gt;ascritte&lt;/em&gt;: non le scegli e non le guadagni.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Achievement&lt;/h4&gt;&lt;b&gt;Sforzo personale, competenze, talento, rendimento&lt;/b&gt; (&lt;em&gt;performance&lt;/em&gt;). In italiano si parla di caratteristiche &lt;em&gt;acquisite&lt;/em&gt;, ciò che una persona realizza.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Una società in cui la posizione finale dipende soprattutto dall&#x27;achievement è &lt;b&gt;aperta&lt;/b&gt; (meritocratica). Se dipende soprattutto dall&#x27;ascription è &lt;b&gt;chiusa&lt;/b&gt;: al limite, una società di caste.&lt;/p&gt;

  &lt;figure&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Simulatore: quanto pesa la nascita?&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Persona A nasce in una famiglia agiata (origine 85/100) e ha talento medio (50). Persona B nasce in una famiglia modesta (origine 20/100). Scegli il talento di B e quanto conta l&#x27;ascription in questa società.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mw&quot;&gt;Peso dell&#x27;ascription&lt;/label&gt;&lt;input id=&quot;mw&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;mwo&quot;&gt;60%&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;mt&quot;&gt;Talento e impegno di B&lt;/label&gt;&lt;input id=&quot;mt&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;mto&quot;&gt;80&lt;/output&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 600 110&quot; role=&quot;img&quot; aria-label=&quot;Posizione sociale raggiunta da A e B&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;34&quot; font-size=&quot;13&quot;&gt;A · famiglia agiata&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;18&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;cb&quot;/&gt;
      &lt;rect id=&quot;mbA&quot; x=&quot;150&quot; y=&quot;18&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;inks&quot; fill=&quot;var(--muted)&quot;/&gt;
      &lt;text id=&quot;mvA&quot; y=&quot;35&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;0&quot; y=&quot;78&quot; font-size=&quot;13&quot;&gt;B · famiglia modesta&lt;/text&gt;
      &lt;rect x=&quot;150&quot; y=&quot;62&quot; width=&quot;400&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;cb&quot;/&gt;
      &lt;rect id=&quot;mbB&quot; x=&quot;150&quot; y=&quot;62&quot; height=&quot;24&quot; rx=&quot;4&quot; class=&quot;c&quot;/&gt;
      &lt;text id=&quot;mvB&quot; y=&quot;79&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;&lt;/text&gt;
      &lt;text x=&quot;150&quot; y=&quot;106&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;posizione sociale raggiunta (0–100) = peso × origine + (1 − peso) × talento&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;readout&quot; id=&quot;mmsg&quot;&gt;&lt;/div&gt;
    &lt;figcaption&gt;Modello giocattolo per fissare l&#x27;idea, non un risultato empirico.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h4&gt;Intergenerational transmission&lt;/h4&gt;
  &lt;p&gt;L&#x27;ascription non agisce per magia: passa attraverso canali concreti con cui le famiglie &lt;b&gt;trasmettono vantaggi (o svantaggi)&lt;/b&gt; ai figli. È l&#x27;&lt;span class=&quot;term&quot;&gt;intergenerational transmission&lt;/span&gt;, ed è il ponte con la Parte 4: ciò che si trasmette sono proprio le &lt;em&gt;resources&lt;/em&gt;.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;Flusso della trasmissione intergenerazionale&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;120&quot; rx=&quot;12&quot; class=&quot;cb&quot;/&gt;
      &lt;text x=&quot;85&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Genitori&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;economic capital&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;human capital&lt;/text&gt;
      &lt;text x=&quot;85&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;social capital&lt;/text&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;215&quot; y=&quot;14&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;eredità, case, aiuti economici&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;62&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;investimento in istruzione&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;110&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;reti e conoscenze&lt;/text&gt;
        &lt;rect x=&quot;215&quot; y=&quot;158&quot; width=&quot;190&quot; height=&quot;30&quot; rx=&quot;15&quot; fill=&quot;none&quot; class=&quot;cs&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;salute, stili di vita, aspirazioni&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M160 100 L215 29&quot;/&gt;&lt;path d=&quot;M160 100 L215 77&quot;/&gt;&lt;path d=&quot;M160 100 L215 125&quot;/&gt;&lt;path d=&quot;M160 100 L215 173&quot;/&gt;
      &lt;path d=&quot;M405 29 L470 100&quot;/&gt;&lt;path d=&quot;M405 77 L470 100&quot;/&gt;&lt;path d=&quot;M405 125 L470 100&quot;/&gt;&lt;path d=&quot;M405 173 L470 100&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;470&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;120&quot; rx=&quot;12&quot; class=&quot;c&quot;/&gt;
      &lt;text x=&quot;550&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Figli&lt;/text&gt;
      &lt;text x=&quot;550&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;punto di partenza&lt;/text&gt;
      &lt;text x=&quot;550&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;e opportunità&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Canali esemplificativi (mia integrazione: le slide citano solo la parola chiave). Più questi canali sono forti, più la posizione dei figli “copia” quella dei genitori e meno c&#x27;è mobilità intergenerazionale.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot;&gt;Attenzione a una trappola: anche l&#x27;achievement non è del tutto “libero”. Il titolo di studio è un merito personale, ma le probabilità di laurearsi dipendono molto dalla famiglia d&#x27;origine. Ascription e achievement si intrecciano.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché le slide dicono che la social inequality non è “solo” stratificazione?&lt;/summary&gt;&lt;div&gt;Perché conta anche la possibilità di muoversi tra le posizioni. Due società con lo stesso Gini possono essere molto diverse se in una si sale e si scende facilmente e nell&#x27;altra la posizione si eredita.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una donna inizia come cassiera e a 45 anni dirige un supermercato. Che mobilità è?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Intragenerational&lt;/b&gt;, verso l&#x27;alto: è un cambiamento di posizione nel corso della vita della stessa persona.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Il padre era bracciante, il figlio è ingegnere. Che mobilità è? Con quali indicatori la misureresti?&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Intergenerational&lt;/b&gt; upward. Indicatori citati nelle slide: occupational status, wealth, life expectancy.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Classifica come ascription o achievement: origine familiare, laurea, genere, competenze linguistiche, talento musicale.&lt;/summary&gt;&lt;div&gt;Ascription: origine familiare, genere (fissati alla nascita). Achievement: laurea, competenze linguistiche, talento e rendimento musicale (sforzo, skills, talento, performance). Ricorda però che le occasioni di achievement dipendono in parte dall&#x27;ascription.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cos&#x27;è l&#x27;intergenerational transmission e perché frena la mobilità?&lt;/summary&gt;&lt;div&gt;È il passaggio di risorse (economiche, culturali e di istruzione, relazionali) dai genitori ai figli. Se è forte, il punto di arrivo dei figli dipende soprattutto dal punto di partenza della famiglia: l&#x27;ascensore sociale si blocca.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PARTE 4 ============ --&gt;
&lt;section id=&quot;p4&quot; class=&quot;part p-brick&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Parte 4 · Resources&lt;/div&gt;
    &lt;h2&gt;Ciò che fa salire (o tiene giù): i capitali&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Slide 16–20. Le risorse che spiegano posizioni e mobilità.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;a href=&quot;#s-human&quot; class=&quot;card&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Human capital&lt;/h4&gt;“What you can do”: ciò che sai fare.&lt;/a&gt;
    &lt;a href=&quot;#s-social&quot; class=&quot;card&quot; style=&quot;text-decoration:none;color:inherit&quot;&gt;&lt;h4&gt;Social capital&lt;/h4&gt;“Who you know”: chi conosci.&lt;/a&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(Economic capital)&lt;/h4&gt;Denaro e beni: income e wealth della Parte 1. La slide lo mette tra parentesi perché è già stato trattato e perché la lezione si concentra sulle altre due risorse.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-human&quot;&gt;Human capital &lt;span class=&quot;slides&quot;&gt;slide 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Human capital&lt;/b&gt; (capitale umano): le conoscenze e le competenze delle persone &lt;b&gt;nella misura in cui sono rilevanti per il labor market&lt;/b&gt;.&lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 620 180&quot; role=&quot;img&quot; aria-label=&quot;Componenti del capitale umano e risultati sul lavoro&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;12&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;37&quot; text-anchor=&quot;middle&quot;&gt;Education&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot;&gt;Work experience&lt;/text&gt;
        &lt;rect x=&quot;10&quot; y=&quot;128&quot; width=&quot;150&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;cb&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot;&gt;Health&lt;/text&gt;
      &lt;/g&gt;
      &lt;g class=&quot;cs&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M160 32 L240 90&quot;/&gt;&lt;path d=&quot;M160 90 L240 90&quot;/&gt;&lt;path d=&quot;M160 148 L240 90&quot;/&gt;&lt;/g&gt;
      &lt;circle cx=&quot;300&quot; cy=&quot;90&quot; r=&quot;58&quot; class=&quot;c&quot;/&gt;
      &lt;text x=&quot;300&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Human&lt;/text&gt;
      &lt;text x=&quot;300&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;capital&lt;/text&gt;
      &lt;path d=&quot;M362 90 H440&quot; class=&quot;inks&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#ah)&quot;/&gt;
      &lt;rect x=&quot;445&quot; y=&quot;50&quot; width=&quot;165&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;none&quot; class=&quot;cs&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;527&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Job outcomes&lt;/text&gt;
      &lt;text x=&quot;527&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;salario, occupazione,&lt;/text&gt;
      &lt;text x=&quot;527&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;posizione di classe&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Più alto è lo human capital, migliore è la posizione nel mercato del lavoro (&lt;em&gt;human capital and job outcomes&lt;/em&gt;). E poiché la social class si basa sull&#x27;occupation (Parte 1), lo human capital è un motore della mobilità.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;small&quot;&gt;Perché “capitale”? &lt;span class=&quot;badge b-int&quot;&gt;integrazione&lt;/span&gt;Perché, come una macchina in una fabbrica, si costruisce con un investimento (anni di studio, formazione, cure) che poi rende nel tempo, sotto forma di salario più alto. L&#x27;idea è stata sistematizzata dall&#x27;economista Gary Becker (vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/p&gt;

  &lt;h3 id=&quot;s-social&quot;&gt;Social capital &lt;span class=&quot;slides&quot;&gt;slide 18–19&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social capital&lt;/b&gt; (capitale sociale): il potenziale degli individui di &lt;b&gt;ottenere benefici e risolvere problemi grazie all&#x27;appartenenza a reti sociali&lt;/b&gt;.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 320 250&quot; role=&quot;img&quot; aria-label=&quot;Le tre dimensioni del capitale sociale&quot;&gt;
        &lt;polygon points=&quot;160,40 40,215 280,215&quot; class=&quot;cb cs&quot; stroke-width=&quot;2&quot;/&gt;
        &lt;circle cx=&quot;160&quot; cy=&quot;40&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Networks&lt;/text&gt;
        &lt;circle cx=&quot;45&quot; cy=&quot;210&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Trust&lt;/text&gt;
        &lt;circle cx=&quot;275&quot; cy=&quot;210&quot; r=&quot;30&quot; class=&quot;c&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Resources&lt;/text&gt;
        &lt;text x=&quot;160&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-family=&quot;Newsreader,serif&quot; font-size=&quot;18&quot; font-style=&quot;italic&quot;&gt;social capital&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p&gt;Tre dimensioni:&lt;/p&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;b&gt;Interconnected networks&lt;/b&gt;: reti di relazioni tra individui e gruppi (&lt;em&gt;social ties&lt;/em&gt;, legami sociali, o &lt;em&gt;social participation&lt;/em&gt;, partecipazione sociale).&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Trust&lt;/b&gt;: il livello di fiducia che caratterizza questi legami.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Resources or benefits&lt;/b&gt;: risorse o benefici ottenuti e trasferiti grazie ai legami e alla partecipazione.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;p&gt;Non esiste &lt;b&gt;una&lt;/b&gt; teoria del social capital, ma un &lt;span class=&quot;term&quot;&gt;social capital paradigm&lt;/span&gt;: una famiglia di teorie con alcune idee in comune.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Le reti hanno valore&lt;/h4&gt;Le relazioni sono una risorsa, come il denaro o le competenze.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Le reti contano per certi esiti&lt;/h4&gt;Chi conosci incide su ciò che ottieni.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · Gli esiti possono variare&lt;/h4&gt;Well-being (benessere), opportunities, trust, health.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Granovetter: weak ties&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Putnam: public good&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Mark Granovetter&lt;/b&gt;, &lt;em&gt;The Strength of Weak Ties&lt;/em&gt; (“la forza dei legami deboli”). I &lt;span class=&quot;term&quot;&gt;strong ties&lt;/span&gt; (legami forti: famiglia, amici stretti) uniscono persone che si frequentano spesso e conoscono le stesse cose. I &lt;span class=&quot;term&quot;&gt;weak ties&lt;/span&gt; (legami deboli: conoscenti, ex colleghi) fanno da &lt;em&gt;bridge&lt;/em&gt; (ponte) verso altri ambienti, e quindi portano &lt;b&gt;informazioni nuove&lt;/b&gt;, per esempio su un lavoro. Segui i passi:&lt;/p&gt;
      &lt;div data-stepper=&quot;gran&quot;&gt;
        &lt;svg id=&quot;gran&quot; viewBox=&quot;0 0 600 285&quot; role=&quot;img&quot; aria-label=&quot;Rete con legami forti e un legame debole&quot;&gt;
          &lt;ellipse class=&quot;cl ca&quot; cx=&quot;140&quot; cy=&quot;140&quot; rx=&quot;125&quot; ry=&quot;110&quot;/&gt;
          &lt;ellipse class=&quot;cl cb2&quot; cx=&quot;455&quot; cy=&quot;140&quot; rx=&quot;125&quot; ry=&quot;110&quot;/&gt;
          &lt;g class=&quot;sa&quot;&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;80&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;80&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;80&quot; x2=&quot;200&quot; y2=&quot;80&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;80&quot; x2=&quot;80&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;200&quot; y1=&quot;80&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;80&quot; y1=&quot;200&quot; x2=&quot;200&quot; y2=&quot;200&quot;/&gt;
          &lt;/g&gt;
          &lt;g class=&quot;sb&quot;&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;375&quot; y1=&quot;140&quot; x2=&quot;445&quot; y2=&quot;70&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;375&quot; y1=&quot;140&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;445&quot; y1=&quot;70&quot; x2=&quot;525&quot; y2=&quot;100&quot;/&gt;
            &lt;line class=&quot;strong&quot; x1=&quot;525&quot; y1=&quot;100&quot; x2=&quot;515&quot; y2=&quot;200&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;515&quot; y1=&quot;200&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;&lt;line class=&quot;strong&quot; x1=&quot;445&quot; y1=&quot;70&quot; x2=&quot;435&quot; y2=&quot;210&quot;/&gt;
          &lt;/g&gt;
          &lt;line class=&quot;weak&quot; x1=&quot;140&quot; y1=&quot;140&quot; x2=&quot;375&quot; y2=&quot;140&quot;/&gt;
          &lt;circle cx=&quot;80&quot; cy=&quot;80&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;80&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;80&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;
          &lt;circle class=&quot;you&quot; cx=&quot;140&quot; cy=&quot;140&quot; r=&quot;14&quot;/&gt;
          &lt;circle class=&quot;ack&quot; cx=&quot;375&quot; cy=&quot;140&quot; r=&quot;12&quot;/&gt;
          &lt;circle cx=&quot;445&quot; cy=&quot;70&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;515&quot; cy=&quot;200&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;435&quot; cy=&quot;210&quot; r=&quot;11&quot;/&gt;
          &lt;circle class=&quot;job&quot; cx=&quot;525&quot; cy=&quot;100&quot; r=&quot;14&quot;/&gt;
          &lt;text x=&quot;140&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Tu&lt;/text&gt;
          &lt;text x=&quot;375&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;conoscente&lt;/text&gt;
          &lt;text x=&quot;525&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;offerta di lavoro&lt;/text&gt;
          &lt;text x=&quot;140&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;i tuoi amici stretti&lt;/text&gt;
          &lt;text x=&quot;455&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;un altro ambiente&lt;/text&gt;
          &lt;text x=&quot;258&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;weak tie&lt;/text&gt;
          &lt;text class=&quot;msg ac&quot; x=&quot;300&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;L&#x27;informazione nuova arriva attraverso il bridge&lt;/text&gt;
        &lt;/svg&gt;
        &lt;ol class=&quot;steps&quot;&gt;
          &lt;li&gt;&lt;b&gt;Strong ties.&lt;/b&gt; Nel tuo gruppo tutti si conoscono e si frequentano spesso. Il sostegno è forte, ma le informazioni circolano ridondanti: sapete tutti le stesse cose.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Weak tie.&lt;/b&gt; C&#x27;è una persona che vedi di rado, un conoscente. È un legame debole, ma è l&#x27;unico ponte verso un&#x27;altra cerchia.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Un altro mondo.&lt;/b&gt; Nella cerchia del conoscente circolano informazioni che nel tuo gruppo nessuno ha, come un&#x27;offerta di lavoro.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;La forza del legame debole.&lt;/b&gt; L&#x27;informazione arriva a te attraverso il weak tie. Granovetter ha osservato che chi aveva trovato lavoro tramite contatti personali li vedeva in genere solo di tanto in tanto o raramente.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button data-dir=&quot;-1&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;stepcount&quot;&gt;&lt;/span&gt;&lt;button data-dir=&quot;1&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;small muted&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;Il dato sui contatti visti “occasionally or rarely” viene dallo studio sui job seekers riportato nell&#x27;articolo del 1973; vedi Per approfondire.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Robert Putnam&lt;/b&gt; (le slide scrivono “Putnman”) intende il social capital come un &lt;span class=&quot;term&quot;&gt;public good&lt;/span&gt; (bene pubblico): la quantità di &lt;b&gt;potenziale partecipativo, orientamento civico e fiducia negli altri&lt;/b&gt; disponibile a città, stati o nazioni.&lt;/p&gt;
      &lt;p&gt;Il livello cambia: non conta più quanto è “ricco di relazioni” un individuo, ma quanto lo è una &lt;b&gt;comunità&lt;/b&gt;. Un bene pubblico avvantaggia tutti, anche chi non contribuisce, come una piazza sicura o la fiducia che rende facili gli scambi.&lt;/p&gt;
      &lt;p class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;In &lt;em&gt;Bowling Alone&lt;/em&gt; (2000) Putnam documenta il declino della partecipazione civica negli USA e lo collega a effetti su democrazia, salute e qualità della vita. Distingue anche il &lt;em&gt;bonding&lt;/em&gt; social capital, che lega persone simili, dal &lt;em&gt;bridging&lt;/em&gt; social capital, che collega gruppi diversi, molto vicino all&#x27;idea dei weak ties. — &lt;a href=&quot;https://archives.evergreen.edu/webpages/curricular/2003-2004/artofplace/BowlingAloneStudyGuideI_II.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;study guide, Evergreen State College&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Granovetter&lt;/th&gt;&lt;th&gt;Putnam&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Livello&lt;/td&gt;&lt;td&gt;Individuale: le reti di una persona&lt;/td&gt;&lt;td&gt;Collettivo: città, stati, nazioni&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Natura&lt;/td&gt;&lt;td&gt;Risorsa privata (mi trova lavoro)&lt;/td&gt;&lt;td&gt;Public good (avvantaggia tutti)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Ingrediente chiave&lt;/td&gt;&lt;td&gt;Struttura della rete (weak ties come ponti)&lt;/td&gt;&lt;td&gt;Partecipazione civica e trust&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Esito tipico&lt;/td&gt;&lt;td&gt;Opportunities, mobilità&lt;/td&gt;&lt;td&gt;Democrazia, benessere, fiducia&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;s-group&quot;&gt;Group belonging, social capital, discrimination &lt;span class=&quot;slides&quot;&gt;slide 20&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Gli studiosi spiegano le disuguaglianze in base alle risorse. Ricapitolando:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What you can do&lt;/h4&gt;Human capital&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Who you know&lt;/h4&gt;Social capital&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Who you belong to&lt;/h4&gt;&lt;em&gt;Group membership&lt;/em&gt; (appartenenza di gruppo): età, genere, gruppo etnico, religione…&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La &lt;b&gt;group affiliation&lt;/b&gt; è una risorsa (il gruppo offre reti e sostegno), ma può anche essere una &lt;b&gt;barrier&lt;/b&gt; (barriera): la &lt;em&gt;discrimination&lt;/em&gt; sulla base dell&#x27;appartenenza.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Labor market discrimination&lt;/b&gt; (discriminazione nel mercato del lavoro): decisioni dei datori di lavoro &lt;b&gt;non basate sulle caratteristiche di human capital&lt;/b&gt;. A parità di istruzione, esperienza e salute, una persona viene trattata diversamente per il gruppo a cui appartiene.&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In-group favoritism&lt;/h4&gt;La tendenza a favorire chi appartiene al proprio gruppo (&lt;em&gt;in-group&lt;/em&gt;) rispetto a chi ne è fuori (&lt;em&gt;out-group&lt;/em&gt;). La discriminazione nel lavoro vi è strettamente legata: spesso non nasce da ostilità aperta, ma dalla preferenza per chi “mi somiglia”.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cumulative discrimination&lt;/h4&gt;Piccoli svantaggi in tappe successive (selezione, assunzione, salario, carriera) si &lt;b&gt;sommano&lt;/b&gt; e producono un divario finale grande. Guarda lo schema qui sotto.&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure data-stepper=&quot;disc&quot;&gt;
    &lt;svg id=&quot;disc&quot; viewBox=&quot;0 0 600 230&quot; role=&quot;img&quot; aria-label=&quot;Discriminazione cumulativa per tappe&quot;&gt;&lt;/svg&gt;
    &lt;ol class=&quot;steps&quot;&gt;
      &lt;li&gt;&lt;b&gt;Partenza.&lt;/b&gt; Due candidati con &lt;b&gt;lo stesso human capital&lt;/b&gt;: contorno = in-group, pieno = out-group. Entrambi a 100.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;CV screening.&lt;/b&gt; A parità di curriculum, l&#x27;out-group riceve meno chiamate: restano 82 opportunità su 100.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Colloquio.&lt;/b&gt; L&#x27;in-group favoritism del selezionatore taglia ancora: 70.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Salario d&#x27;ingresso.&lt;/b&gt; Chi viene assunto parte con uno stipendio più basso: 62.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Promozione.&lt;/b&gt; Ogni svantaggio si appoggia al precedente: alla fine l&#x27;out-group è a circa metà. Ecco la &lt;em&gt;cumulative discrimination&lt;/em&gt;.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button data-dir=&quot;-1&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;stepcount&quot;&gt;&lt;/span&gt;&lt;button data-dir=&quot;1&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;figcaption&gt;Numeri inventati per illustrare il meccanismo: non sono dati delle slide né di uno studio.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p class=&quot;note&quot;&gt;Collegamento: la cumulative discrimination è la versione “nel tempo” dell&#x27;intersectionality della lezione precedente, che invece riguarda l&#x27;incrocio di più appartenenze. Entrambe spiegano perché gli svantaggi si sommano anziché restare isolati, come nel caso COVID-19 della Parte 2.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Definisci lo human capital e indicane le tre componenti.&lt;/summary&gt;&lt;div&gt;Conoscenze e competenze delle persone, in quanto rilevanti per il labor market. Componenti: education, work experience, health. Più alto è, migliori sono i job outcomes.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre dimensioni del social capital?&lt;/summary&gt;&lt;div&gt;Interconnected networks (legami e partecipazione), trust (fiducia nei legami), resources/benefits (ciò che si ottiene e si trasferisce grazie ai legami).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché, secondo Granovetter, i legami deboli sono “forti”?&lt;/summary&gt;&lt;div&gt;Perché fanno da ponte verso cerchie diverse dalla propria e portano informazioni non ridondanti (per esempio offerte di lavoro). I legami forti uniscono persone che sanno già le stesse cose.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In cosa si differenzia l&#x27;approccio di Putnam da quello di Granovetter?&lt;/summary&gt;&lt;div&gt;Putnam vede il social capital come public good di una collettività (partecipazione, orientamento civico, fiducia di città o nazioni). Granovetter guarda alle reti dell&#x27;individuo e alla loro struttura.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la group membership può essere insieme risorsa e barriera?&lt;/summary&gt;&lt;div&gt;Il gruppo dà reti, sostegno e identità (risorsa), ma espone alla discriminazione da parte di chi ha potere decisionale e favorisce il proprio in-group (barriera).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cos&#x27;è la labor market discrimination e cosa la rende “cumulative”?&lt;/summary&gt;&lt;div&gt;Sono decisioni dei datori di lavoro non basate sullo human capital. È cumulativa perché gli svantaggi delle varie tappe (selezione, assunzione, salario, promozione) si sommano nel tempo, producendo grandi differenze finali da piccole differenze iniziali.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PER APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot; style=&quot;--c:var(--accent)&quot;&gt;
    &lt;div class=&quot;num&quot;&gt;Risorse&lt;/div&gt;
    &lt;h2&gt;Per approfondire&lt;/h2&gt;
    &lt;p class=&quot;muted&quot;&gt;Autori, studi e siti citati nelle slide. Le descrizioni qui sotto vengono da ricerche web e sono &lt;b&gt;fonti esterne&lt;/b&gt;, distinte dal contenuto delle slide.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Marx &amp;amp; Engels — &lt;em&gt;Manifesto of the Communist Party&lt;/em&gt; (1848)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.marxists.org/archive/marx/works/1848/communist-manifesto&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;marxists.org — testo integrale (trad. inglese di S. Moore con Engels, 1888)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Scritto come programma della Communist League e pubblicato a Londra nel 1848. Il primo capitolo, “Bourgeois and Proletarians”, è la fonte classica della divisione in due classi richiamata nella slide 3. È il punto di partenza di ogni discussione sulla social class.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Bank — Gini index (indicatore SI.POV.GINI)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://data.worldbank.org/indicator/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;data.worldbank.org/indicator/SI.POV.GINI&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;È la fonte dei dati della slide 7 (World Bank, 2017b), con valori aggiornati per quasi tutti i Paesi. Si basa su indagini sulle famiglie. Nei metadati la Banca Mondiale avverte che due Lorenz curve diverse possono dare lo stesso Gini e che i dati non sono perfettamente confrontabili tra Paesi e anni. È utile per vedere come sono cambiati i valori della tabella.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;R. Wilkinson &amp;amp; K. Pickett — &lt;em&gt;The Spirit Level&lt;/em&gt; (2009)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust — The Spirit Level&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;È il libro da cui viene il grafico della slide 9. Costruisce un indice di problemi sanitari e sociali per 21 Paesi ricchi e trova una forte correlazione con la disuguaglianza dei redditi, replicata anche con l&#x27;indice UNICEF del benessere dei bambini e sugli stati USA. È stato molto discusso e criticato. Nel 2024 la Equality Trust ne ha aggiornato i dati con &lt;em&gt;The Spirit Level at 15&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;TIME — articolo sui miliardari contro Zohran Mamdani&lt;/h4&gt;
