    &lt;a href=&quot;#s3&quot;&gt;&lt;g class=&quot;node&quot;&gt;&lt;rect x=&quot;650&quot; y=&quot;350&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;fab sa&quot;/&gt;&lt;text x=&quot;765&quot; y=&quot;377&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot; class=&quot;fa&quot;&gt;Global inequalities&lt;/text&gt;&lt;text x=&quot;765&quot; y=&quot;396&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;Preston curve · passport index&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

    &lt;a href=&quot;#s5&quot;&gt;&lt;g class=&quot;node&quot;&gt;&lt;rect x=&quot;640&quot; y=&quot;440&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;ftb st&quot;/&gt;&lt;text x=&quot;785&quot; y=&quot;467&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot; class=&quot;ft&quot;&gt;Health &amp;amp; social problems&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;486&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;Wilkinson &amp;amp; Pickett: worse where more unequal&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;div class=&quot;card&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;b&gt;Where we are coming from.&lt;/b&gt; The previous lecture (slide 2) introduced the module, the &lt;span class=&quot;en&quot;&gt;sociological perspective&lt;/span&gt; (viewing individual facts as the outcome of social structures) and the &lt;span class=&quot;en&quot;&gt;SDGs&lt;/span&gt; — the UN &lt;i&gt;Sustainable Development Goals&lt;/i&gt; — with the idea that “development” is not only economic growth and that inequalities are a crucial issue. This lecture opens the topic in three blocks (slide 3): &lt;i&gt;differences and inequalities&lt;/i&gt;, &lt;i&gt;stratification and mobility&lt;/i&gt;, &lt;i&gt;global inequalities&lt;/i&gt;.
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part p-salvia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 1 &lt;span class=&quot;slides&quot;&gt;· slides 4–9&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Differences and inequalities&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Every society is made up of different people. The sociological problem is not difference as such, but &lt;b&gt;what society does with it&lt;/b&gt;: when a difference becomes grounds for unequal treatment, an inequality arises.&lt;/p&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Social differences&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The slides start from an open list (slide 4): &lt;i&gt;age, gender, socio‑economic status, race, ethnic belonging, religious denomination&lt;/i&gt;… followed by a “cloud” of more than twenty dimensions (slide 8). The title of slide 8 highlights in red the final &lt;b&gt;s&lt;/b&gt; of &lt;i&gt;Difference&lt;b style=&quot;color:var(--acc)&quot;&gt;s&lt;/b&gt; &amp;amp; Inequalitie&lt;b style=&quot;color:var(--acc)&quot;&gt;s&lt;/b&gt;&lt;/i&gt;: inequalities are &lt;b&gt;plural&lt;/b&gt; and multidimensional, and cannot be reduced to income alone.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;Try grouping the dimensions of slide 8 according to the three types of &lt;i&gt;factors&lt;/i&gt; on slide 12 (the grouping is proposed by this summary, not by the slides; some items belong to more than one group).&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot; id=&quot;dimbtn&quot;&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-k=&quot;all&quot;&gt;All&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-k=&quot;e&quot;&gt;Economic&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-k=&quot;c&quot;&gt;Socio‑cultural&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-k=&quot;p&quot;&gt;Political&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-k=&quot;b&quot;&gt;Body and health&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;dims&quot; style=&quot;display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem&quot;&gt;
    &lt;span data-k=&quot;b&quot;&gt;ability&lt;/span&gt;&lt;span data-k=&quot;b&quot;&gt;mental health&lt;/span&gt;&lt;span data-k=&quot;b c&quot;&gt;race&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;gender identity&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;personality&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;gender expression&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;appearance&lt;/span&gt;&lt;span data-k=&quot;b&quot;&gt;fertility&lt;/span&gt;&lt;span data-k=&quot;b&quot;&gt;age&lt;/span&gt;&lt;span data-k=&quot;c p&quot;&gt;nationality&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;culture&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;language&lt;/span&gt;&lt;span data-k=&quot;p&quot;&gt;political affiliation&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;sexual orientation&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;hobbies&lt;/span&gt;&lt;span data-k=&quot;b&quot;&gt;physical health&lt;/span&gt;&lt;span data-k=&quot;e&quot;&gt;occupation&lt;/span&gt;&lt;span data-k=&quot;e c&quot;&gt;education&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;ethnicity&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;religion&lt;/span&gt;&lt;span data-k=&quot;e&quot;&gt;class&lt;/span&gt;&lt;span data-k=&quot;e&quot;&gt;location&lt;/span&gt;&lt;span data-k=&quot;c&quot;&gt;marital status&lt;/span&gt;
  &lt;/div&gt;

  &lt;h3&gt;Are they the same? When difference becomes inequality&lt;/h3&gt;
  &lt;p&gt;Slide 5 asks two questions: &lt;i&gt;are the same?&lt;/i&gt; — no — and &lt;i&gt;when do social differences become inequalities?&lt;/i&gt; The answer (slide 6) rests on two definitions.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inequality&lt;/b&gt;&lt;br&gt;&lt;i&gt;unequal treatment on the bases of social differences&lt;/i&gt;: unequal treatment grounded in a social difference. It is a &lt;b&gt;fact&lt;/b&gt;: it can be observed and measured.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discrimination&lt;/b&gt;&lt;br&gt;a person is treated differently, or excluded from an opportunity or a service, &lt;b&gt;without justification&lt;/b&gt;. Here an &lt;b&gt;evaluation&lt;/b&gt; comes in: we recognise that the unequal treatment is &lt;i&gt;unfair&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;From difference to discrimination&quot;&gt;
      &lt;defs&gt;&lt;marker id=&quot;a1&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; class=&quot;fs&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
      &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;14&quot; class=&quot;fcard ss&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;125&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fs&quot;&gt;Difference&lt;/text&gt;
      &lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fi&quot;&gt;e.g. age, gender, ethnicity&lt;/text&gt;
      &lt;text x=&quot;125&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;descriptive, neutral&lt;/text&gt;
      &lt;rect x=&quot;335&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;14&quot; class=&quot;fsb ss&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fs&quot;&gt;Inequality&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fi&quot;&gt;unequal treatment&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;observable fact&lt;/text&gt;
      &lt;rect x=&quot;660&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;14&quot; class=&quot;fs&quot;/&gt;
      &lt;text x=&quot;775&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fp&quot;&gt;Discrimination&lt;/text&gt;
      &lt;text x=&quot;775&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fp&quot;&gt;… without justification&lt;/text&gt;
      &lt;text x=&quot;775&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;judgement: it is unfair&lt;/text&gt;
      &lt;path d=&quot;M245,80 L328,80&quot; class=&quot;ss&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a1)&quot;/&gt;
      &lt;path d=&quot;M570,80 L653,80&quot; class=&quot;ss&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a1)&quot;/&gt;
      &lt;text x=&quot;287&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;society&lt;/text&gt;&lt;text x=&quot;287&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;builds on it&lt;/text&gt;
      &lt;text x=&quot;612&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;normative&lt;/text&gt;&lt;text x=&quot;612&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;evaluation&lt;/text&gt;

    &lt;figcaption&gt;Summary diagram of slides 5–6. Example: an elderly woman who cannot book a medical appointment because the service is app‑only → a difference (age) that produces unequal treatment; if there is no reasonable alternative, we judge it to be discrimination.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;How differences are treated, and with what consequences&lt;/h3&gt;
  &lt;p&gt;Slide 7 lists four “wrong” ways of treating differences, each with its own effect. Step through them: they are in increasing order of severity.&lt;/p&gt;
  &lt;div class=&quot;steps&quot; data-hook=&quot;treatHook&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 120&quot; style=&quot;width:100%;height:auto&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;treatbars&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · &lt;span class=&quot;en&quot;&gt;Differences are not recognized&lt;/span&gt; → potential is lost&lt;/h4&gt;&lt;p&gt;If a society does not “see” differences (languages, skills, cultures), it wastes &lt;b&gt;social capital&lt;/b&gt; — the resources that arise from diverse networks, relationships and knowledge — and the &lt;i&gt;potentialities&lt;/i&gt; for economic, cultural and social development.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;E.g. migrants’ qualifications are not recognised → doctors end up working as warehouse staff.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · &lt;span class=&quot;en&quot;&gt;Differences are not considered&lt;/span&gt; → inequalities are amplified&lt;/h4&gt;&lt;p&gt;Policies, services and practices designed for an “average” user risk &lt;b&gt;amplifying&lt;/b&gt; existing inequalities: those who are already disadvantaged find them harder to access.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;E.g. a public call that requires a digital identity (SPID) and a digital signature penalises people with fewer digital skills.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · &lt;span class=&quot;en&quot;&gt;Differences become source of inequality&lt;/span&gt; → segregation&lt;/h4&gt;&lt;p&gt;Difference becomes a criterion for separation: processes of &lt;b&gt;segregation&lt;/b&gt; (separate neighbourhoods, schools, labour markets) that limit individual and social development.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · &lt;span class=&quot;en&quot;&gt;The right to difference is denied&lt;/span&gt; → violence&lt;/h4&gt;&lt;p&gt;When the right to difference and the &lt;b&gt;dignity&lt;/b&gt; of differences are denied, the extreme outcome is violence. The example in the slides is &lt;b&gt;GBV&lt;/b&gt; (&lt;i&gt;gender‑based violence&lt;/i&gt;: violence directed against a person because of their gender).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;window.treatHook=function(i){var g=document.getElementById(&quot;treatbars&quot;);if(!g)return;var L=[&quot;not recognised&quot;,&quot;not considered&quot;,&quot;source of inequality&quot;,&quot;right denied&quot;],R=[&quot;social capital lost&quot;,&quot;inequalities amplified&quot;,&quot;segregation&quot;,&quot;violence (GBV)&quot;],h=&quot;&quot;;for(var k=0;k&lt;4;k++){var x=10+k*222,on=k&lt;=i;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+(70-k*18)+&#x27;&quot; width=&quot;210&quot; height=&quot;&#x27;+(40+k*18)+&#x27;&quot; rx=&quot;8&quot; class=&quot;&#x27;+(on?&quot;fs&quot;:&quot;fsb&quot;)+&#x27;&quot; fill-opacity=&quot;&#x27;+(k===i?1:on?.45:1)+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(x+105)+&#x27;&quot; y=&quot;&#x27;+(60-k*18)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;&#x27;+L[k]+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(x+105)+&#x27;&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; class=&quot;&#x27;+(k===i?&quot;fp&quot;:&quot;fi&quot;)+&#x27;&quot;&gt;&#x27;+R[k]+&#x27;&lt;/text&gt;&#x27;}g.innerHTML=h};&lt;/script&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Intersectionality&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Differences do not operate one at a time: each person stands at the &lt;b&gt;intersection&lt;/b&gt; of several dimensions (gender, &lt;i&gt;race/ethnicity&lt;/i&gt;, class, abilities, nationality, sexual orientation — the six in the diagram on slide 9, an image by &lt;i&gt;First Book&lt;/i&gt;). Intersectionality is the perspective that studies how these axes &lt;b&gt;combine&lt;/b&gt; to produce specific forms of advantage or disadvantage that remain invisible when looking at one axis at a time.&lt;/p&gt;

        &lt;g font-size=&quot;12.5&quot; font-weight=&quot;600&quot; class=&quot;fi&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;80&quot; y=&quot;95&quot;&gt;Gender&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;30&quot;&gt;Race / Ethnicity&lt;/text&gt;&lt;text x=&quot;282&quot; y=&quot;95&quot;&gt;Class&lt;/text&gt;
          &lt;text x=&quot;290&quot; y=&quot;245&quot;&gt;Nationality&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;305&quot;&gt;Sexual orientation&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;245&quot;&gt;Abilities&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p class=&quot;small muted&quot;&gt;Switch on the axes that apply to an imaginary person and watch the centre “darken”:&lt;/p&gt;
      &lt;div class=&quot;btnrow&quot; id=&quot;ixbtn&quot;&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-a=&quot;g&quot;&gt;Gender&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;r&quot;&gt;Race/Ethnicity&lt;/button&gt;

      &lt;/div&gt;
      &lt;div class=&quot;card&quot; id=&quot;ixout&quot; style=&quot;min-height:7.5rem&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ext&quot;&gt;The term was coined by the legal scholar &lt;b&gt;Kimberlé Crenshaw&lt;/b&gt; in 1989 (“Demarginalizing the Intersection of Race and Sex”, &lt;i&gt;University of Chicago Legal Forum&lt;/i&gt;): she showed that US courts failed to recognise the discrimination experienced by Black women because they assessed it either as racial only or as gender‑based only. &lt;a href=&quot;https://scholarship.law.columbia.edu/faculty_scholarship/3007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Columbia Law Scholarship&lt;/a&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Are social difference and social inequality synonyms?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;No. A difference is a characteristic (age, gender…); inequality exists when &lt;i&gt;unequal treatment&lt;/i&gt; is based on that difference.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What does the concept of discrimination add to that of inequality?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;A value judgement: the different treatment or the exclusion from an opportunity/service occurs &lt;b&gt;without justification&lt;/b&gt;, and we therefore recognise it as unfair.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Can a “one size fits all” policy increase inequalities?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Yes: this is the case of &lt;i&gt;differences not considered&lt;/i&gt; (slide 7). If they ignore initial differences, policies and services risk amplifying existing inequalities.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. According to slide 7, what is the most serious consequence of denying the right to difference?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Violence; the example is GBV, &lt;i&gt;gender‑based violence&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. Why is an intersectional perspective needed?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because axes of difference combine: the position of a migrant woman with a disability is not the sum of “woman” + “migrant” + “disabled” analysed separately. A single‑axis analysis risks overlooking precisely those who stand at the intersections.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part p-ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 2 &lt;span class=&quot;slides&quot;&gt;· slides 10–12, 15&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Stratification, mobility, resources&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Sociology studies inequality along three lines of research. The core of the lecture is the first: &lt;span class=&quot;en&quot;&gt;stratification&lt;/span&gt;, i.e. how people are arranged in “layers” with respect to &lt;span class=&quot;en&quot;&gt;valuable goods&lt;/span&gt; such as well‑being, living standards and health.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Inequality: three main research topics&quot;&gt;
      &lt;rect x=&quot;350&quot; y=&quot;10&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fo&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot; class=&quot;fp&quot;&gt;Inequality&lt;/text&gt;
      &lt;path d=&quot;M450,60 V95 M150,95 H750 M150,95 V125 M450,95 V125 M750,95 V125&quot; class=&quot;so&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
      &lt;g text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;45&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Stratification&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;unequal distribution&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;of valuable goods&lt;/text&gt;
        &lt;rect x=&quot;345&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Mobility&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;movement from one position&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;to another in the system&lt;/text&gt;
        &lt;rect x=&quot;645&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Resources&lt;/text&gt;
        &lt;text x=&quot;750&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;capital, opportunities, power&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;to realise one’s goals&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Redrawn from slide 10.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Stratification&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Mobility&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Resources&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Stratification&lt;/b&gt; = &lt;i&gt;unequal distribution of valued goods&lt;/i&gt;. The term comes from geology: just as rocks are deposited in superimposed layers, society has groups “above” and “below”. Studying it means &lt;b&gt;comparing and ranking&lt;/b&gt; (&lt;i&gt;comparing, ranking&lt;/i&gt;, slide 15) individuals, groups or countries according to how much of something valuable they possess.&lt;/p&gt;
      &lt;p&gt;Guiding question: &lt;i&gt;who gets what, how much, and why?&lt;/i&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Mobility&lt;/b&gt; (social mobility) = &lt;i&gt;movement of people from one position to another in the stratification system&lt;/i&gt;. If stratification is a snapshot, mobility is the film: it shows whether positions are open or closed.&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;Classic distinctions that the slides take for granted: &lt;b&gt;intergenerational&lt;/b&gt; (children vs parents) and &lt;b&gt;intragenerational&lt;/b&gt; (over the life course of the same person); &lt;b&gt;upward / downward&lt;/b&gt; and &lt;b&gt;horizontal&lt;/b&gt; (a change of position at the same level). Try them below.&lt;/div&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;svg viewBox=&quot;0 0 300 250&quot; id=&quot;ladder&quot; role=&quot;img&quot; aria-label=&quot;Social ladder and mobility&quot;&gt;
          &lt;defs&gt;&lt;marker id=&quot;a2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; class=&quot;ft&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
          &lt;g class=&quot;so&quot; stroke-width=&quot;3&quot;&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;10&quot; x2=&quot;200&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
          &lt;g class=&quot;so&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;40&quot; y1=&quot;40&quot; x2=&quot;200&quot; y2=&quot;40&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;90&quot; x2=&quot;200&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;140&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;200&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;235&quot; x2=&quot;200&quot; y2=&quot;235&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;11&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;210&quot; y=&quot;44&quot;&gt;high&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;239&quot;&gt;low&lt;/text&gt;&lt;/g&gt;
          &lt;g id=&quot;ladfig&quot;&gt;&lt;/g&gt;
        &lt;/svg&gt;
        &lt;div&gt;
          &lt;div class=&quot;btnrow&quot; id=&quot;ladbtn&quot;&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;0&quot;&gt;Intergenerational ↑&lt;/button&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-s=&quot;1&quot;&gt;Intragenerational ↓&lt;/button&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-s=&quot;2&quot;&gt;Horizontal&lt;/button&gt;
          &lt;/div&gt;
          &lt;p id=&quot;ladtxt&quot; class=&quot;card small&quot;&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;script&gt;(function(){var S=[[[70,190,&quot;parent&quot;],[160,90,&quot;daughter&quot;],&quot;The father was an unskilled worker; his daughter becomes a teacher. Upward intergenerational mobility: the children’s destination position is compared with the parents’ origin position.&quot;],[[80,90,&quot;at 30&quot;],[160,190,&quot;at 50&quot;],&quot;An office clerk loses their job in a crisis and finds new work as a cleaner. Downward intragenerational mobility: the position of the same person changes over the course of their career.&quot;],[[80,140,&quot;before&quot;],[160,140,&quot;after&quot;],&quot;A cashier becomes an office clerk with similar income and prestige: she changes job but not “stratum”. Horizontal mobility.&quot;]];var g=document.getElementById(&quot;ladfig&quot;),t=document.getElementById(&quot;ladtxt&quot;),b=document.querySelectorAll(&quot;#ladbtn button&quot;);function d(i){var s=S[i],h=&quot;&quot;;[s[0],s[1]].forEach(function(p,k){h+=&#x27;&lt;circle cx=&quot;&#x27;+p[0]+&#x27;&quot; cy=&quot;&#x27;+(p[1]-14)+&#x27;&quot; r=&quot;9&quot; class=&quot;&#x27;+(k?&quot;ft&quot;:&quot;fo&quot;)+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+p[0]+&#x27;&quot; y=&quot;&#x27;+(p[1]-28)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;&#x27;+p[2]+&#x27;&lt;/text&gt;&#x27;});h+=&#x27;&lt;path d=&quot;M&#x27;+(s[0][0]+12)+&#x27;,&#x27;+(s[0][1]-14)+&#x27; Q120,&#x27;+((s[0][1]+s[1][1])/2-30)+&#x27; &#x27;+(s[1][0]-12)+&#x27;,&#x27;+(s[1][1]-14)+&#x27;&quot; fill=&quot;none&quot; class=&quot;st&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a2)&quot;/&gt;&#x27;;g.innerHTML=h;t.textContent=s[2];b.forEach(function(x,j){x.setAttribute(&quot;aria-pressed&quot;,j===i?&quot;true&quot;:&quot;false&quot;)})}b.forEach(function(x,j){x.addEventListener(&quot;click&quot;,function(){d(j)})});d(0)})();&lt;/script&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Resources&lt;/b&gt; = &lt;i&gt;capital, opportunities, and power one can use to realize one’s goals&lt;/i&gt;. They are what enables people to move (mobility) and to occupy a given position (stratification).&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;Sociology often distinguishes between &lt;b&gt;economic&lt;/b&gt; capital (income, assets), &lt;b&gt;cultural&lt;/b&gt; capital (education, qualifications, knowledge) and &lt;b&gt;social&lt;/b&gt; capital (networks of relationships): the distinction comes from Pierre Bourdieu. It matches the &lt;i&gt;economic, political, cultural and symbolic&lt;/i&gt; resources mentioned in the definition of stratification (slide 11).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Differentiation&lt;/span&gt; vs &lt;span class=&quot;en&quot;&gt;stratification&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Differentiation&lt;/b&gt;&lt;br&gt;the process by which the parts of a community take on different social identities in terms of &lt;b&gt;function, authority and power&lt;/b&gt;. It describes a &lt;i&gt;division&lt;/i&gt; of roles.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stratification&lt;/b&gt;&lt;br&gt;the distribution of individuals or groups along a &lt;b&gt;scale&lt;/b&gt; of distinct social positions, according to their possession of &lt;b&gt;economic, political, cultural and symbolic&lt;/b&gt; resources. It describes a &lt;i&gt;hierarchy&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Horizontal differentiation and vertical stratification&quot;&gt;
      &lt;text x=&quot;210&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Differentiation: “different”&lt;/text&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;farmer&lt;/text&gt;
        &lt;rect x=&quot;120&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;artisan&lt;/text&gt;
        &lt;rect x=&quot;220&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;priest&lt;/text&gt;
        &lt;rect x=&quot;320&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;362&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;warrior&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;210&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;roles side by side&lt;/text&gt;
      &lt;path d=&quot;M440,100 H500&quot; class=&quot;so&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a1)&quot;/&gt;
      &lt;text x=&quot;470&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;+ resources&lt;/text&gt;
      &lt;text x=&quot;690&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Stratification: “above / below”&lt;/text&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;630&quot; y=&quot;32&quot; width=&quot;120&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;54&quot; class=&quot;fp&quot;&gt;priest · warrior&lt;/text&gt;
        &lt;rect x=&quot;590&quot; y=&quot;72&quot; width=&quot;200&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot; fill-opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;94&quot; class=&quot;fp&quot;&gt;artisan&lt;/text&gt;
        &lt;rect x=&quot;545&quot; y=&quot;112&quot; width=&quot;290&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot; fill-opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;134&quot; class=&quot;fi&quot;&gt;farmer&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;690&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;roles ranked by resources held&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Illustrative example (not from the slides): differentiation divides tasks, stratification ranks them.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Factors and levels&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Factors of differentiation / inequality&lt;/h4&gt;&lt;p&gt;(slide 12)&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Economic factors&lt;/b&gt; — income, wealth, occupation&lt;/li&gt;&lt;li&gt;&lt;b&gt;Socio‑cultural factors&lt;/b&gt; — education, ethnicity, religion, gender, status&lt;/li&gt;&lt;li&gt;&lt;b&gt;Political factors&lt;/b&gt; — citizenship, rights, access to power&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;small muted&quot;&gt;The examples after the dashes are a supplement added by this summary.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Two levels of stratification&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Between‑country&lt;/b&gt;: national averages are compared, e.g. average living standards in Burundi and in France.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Within‑country&lt;/b&gt;: the distribution of valuable goods is compared across social groups in the same country, grouped by age, gender, socio‑economic status…&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Between and within&quot;&gt;
      &lt;text x=&quot;225&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fa&quot;&gt;Between‑country → Part 3&lt;/text&gt;
      &lt;rect x=&quot;70&quot; y=&quot;120&quot; width=&quot;110&quot; height=&quot;40&quot; rx=&quot;6&quot; class=&quot;fab sa&quot;/&gt;&lt;rect x=&quot;270&quot; y=&quot;40&quot; width=&quot;110&quot; height=&quot;120&quot; rx=&quot;6&quot; class=&quot;fa&quot;/&gt;
      &lt;text x=&quot;125&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;Burundi (average)&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;France (average)&lt;/text&gt;
      &lt;text x=&quot;675&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fma&quot;&gt;Within‑country → Parts 4–5&lt;/text&gt;
      &lt;g class=&quot;fma&quot;&gt;&lt;rect x=&quot;500&quot; y=&quot;130&quot; width=&quot;60&quot; height=&quot;30&quot; rx=&quot;4&quot; fill-opacity=&quot;.35&quot;/&gt;&lt;rect x=&quot;570&quot; y=&quot;110&quot; width=&quot;60&quot; height=&quot;50&quot; rx=&quot;4&quot; fill-opacity=&quot;.5&quot;/&gt;&lt;rect x=&quot;640&quot; y=&quot;90&quot; width=&quot;60&quot; height=&quot;70&quot; rx=&quot;4&quot; fill-opacity=&quot;.65&quot;/&gt;&lt;rect x=&quot;710&quot; y=&quot;70&quot; width=&quot;60&quot; height=&quot;90&quot; rx=&quot;4&quot; fill-opacity=&quot;.8&quot;/&gt;&lt;rect x=&quot;780&quot; y=&quot;35&quot; width=&quot;60&quot; height=&quot;125&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;670&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;groups within the same country (class, gender, age…)&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. What are the three main research topics on inequality?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Stratification (unequal distribution of valuable goods), mobility (movement between positions), resources (capital, opportunities and power to achieve one’s goals).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What is the difference between differentiation and stratification?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Differentiation is the process by which the parts of a community take on different identities in terms of function, authority and power; stratification places individuals/groups on a hierarchical scale according to the economic, political, cultural and symbolic resources they possess.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Is comparing the life expectancy of manual workers and doctors in Italy between‑ or within‑country stratification?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Within‑country: different groups within the same country. Comparing Italy and Niger would be between‑country.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. What is meant by valuable goods in the slides?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Goods that people value: well‑being, living standards, health — and, more generally, income, wealth, prestige, opportunities.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part p-ardesia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 3 &lt;span class=&quot;slides&quot;&gt;· slides 13–14, 22–25&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Inequalities between countries&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;“&lt;i&gt;Where you are born makes a lot of difference for your well‑being, living standards, health&lt;/i&gt;”: place of birth is perhaps the most powerful factor of inequality, and nobody chooses it.&lt;/p&gt;

  &lt;h3&gt;Very rich and very poor countries&lt;/h3&gt;
  &lt;p&gt;Slide 13 compares three indicators. Before reading it, three terms:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;GDP per capita, PPP&lt;/b&gt;&lt;br&gt;&lt;i&gt;Gross Domestic Product&lt;/i&gt; divided by the population, at &lt;i&gt;Purchasing Power Parity&lt;/i&gt;: adjusted for the cost of living, so that one dollar “buys” the same quantity of goods everywhere.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Life expectancy at birth&lt;/b&gt;&lt;br&gt;the average number of years a newborn would live if current mortality rates remained constant.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Happiness score&lt;/b&gt;&lt;br&gt;the 2015‑2017 average (0‑10 scale) of people’s evaluation of their own lives, from the &lt;i&gt;World Happiness Report&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Country&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;GDP p.c. PPP 2017 ($)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Life exp. 2017&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Happiness 2015‑17&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Ireland&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;76,744&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;81.4&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Switzerland&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,307&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;83.5&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.5&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Norway&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;62,182&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;82.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.6&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;United States&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;59,927&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;79.5&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6.9&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Iceland · Netherlands · Denmark · Austria · Germany&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52–55k&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80.7–83.1&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.0–7.6&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;muted&quot; style=&quot;text-align:center&quot;&gt;…&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ethiopia · Uganda · Madagascar&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,558–1,903&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;60.5–66.3&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.8–4.4&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Liberia · Mozambique · Niger · Congo DR&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;889–1,285&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;56.1–63.8&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.5–4.4&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Burundi&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;735&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;57.9&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.9&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Central African Republic&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;727&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;52.9&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.1&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Source in the slides: Helliwell, Layard &amp;amp; Sachs 2018; World Bank 2017a; World Population Review 2017. Some rows are grouped here for brevity.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;×105&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Ireland’s GDP per capita compared with the Central African Republic (76,744 / 727)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;28.5 years&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;less life expectancy in the Central African Republic (52.9) than in Ireland (81.4)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;4.7 points&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;of happiness out of 10 between Norway/Denmark (7.6) and Burundi (2.9)&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;Preston curve&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The Preston curve relates the &lt;b&gt;GDP per capita&lt;/b&gt; (x‑axis) and the &lt;b&gt;life expectancy&lt;/b&gt; (y‑axis) of the world’s countries. Its shape is &lt;b&gt;concave&lt;/b&gt;: it rises very steeply among poor countries and flattens out among rich ones. The slides use it as visual evidence that &lt;i&gt;the world is unequal&lt;/i&gt;.&lt;/p&gt;
  &lt;figure id=&quot;preston&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 320&quot; role=&quot;img&quot; aria-label=&quot;Interactive Preston curve&quot;&gt;
      &lt;g class=&quot;sr&quot; stroke-width=&quot;1&quot;&gt;
        &lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;30&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;92.5&quot; y2=&quot;92.5&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;155&quot; y2=&quot;155&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;217.5&quot; y2=&quot;217.5&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;280&quot; y2=&quot;280&quot;/&gt;
      &lt;/g&gt;
      &lt;g font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;end&quot;&gt;&lt;text x=&quot;52&quot; y=&quot;34&quot;&gt;90&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;96&quot;&gt;80&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;159&quot;&gt;70&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;221&quot;&gt;60&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;284&quot;&gt;50&lt;/text&gt;&lt;/g&gt;
      &lt;g font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;298&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;137&quot; y=&quot;298&quot;&gt;20k&lt;/text&gt;&lt;text x=&quot;214&quot; y=&quot;298&quot;&gt;40k&lt;/text&gt;&lt;text x=&quot;291&quot; y=&quot;298&quot;&gt;60k&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;298&quot;&gt;80k&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;298&quot;&gt;100k&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;298&quot;&gt;120k&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;310&quot; y=&quot;316&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;GDP per capita, PPP ($)&lt;/text&gt;
      &lt;text x=&quot;16&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot; transform=&quot;rotate(-90 16 155)&quot;&gt;Life expectancy (years)&lt;/text&gt;
      &lt;path id=&quot;prcurve&quot; fill=&quot;none&quot; class=&quot;si&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;g id=&quot;prpts&quot;&gt;&lt;/g&gt;
      &lt;line id=&quot;prv&quot; y1=&quot;280&quot; class=&quot;sa&quot; stroke-dasharray=&quot;3 3&quot;/&gt;
      &lt;line id=&quot;prtan&quot; class=&quot;st&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle id=&quot;prdot&quot; r=&quot;7&quot; class=&quot;ft&quot;/&gt;
    &lt;/svg&gt;
    &lt;input type=&quot;range&quot; id=&quot;prslider&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;20&quot; aria-label=&quot;GDP per capita&quot;&gt;
    &lt;div class=&quot;readout&quot;&gt;&lt;span&gt;GDP p.c.: &lt;b id=&quot;prg&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;life expectancy (on the curve): &lt;b id=&quot;prl&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;effect of +$1,000: &lt;b id=&quot;prm&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;figcaption&gt;Move the slider. The blue dots are the 18 countries from slide 13 (hover for the data); the black line is an illustrative logarithmic curve fitted to the shape of the chart on slide 14, not an official estimate. The orange segment is the slope: watch how it flattens.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Why is the curve concave?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;In poor countries a little extra income buys things that save lives immediately: food, clean water, vaccines, basic healthcare. In rich countries those needs are already met and each additional dollar “buys” fewer and fewer years. This is the principle of &lt;b&gt;diminishing returns&lt;/b&gt;.&lt;/p&gt;
    &lt;p&gt;Implication for stratification: &lt;b&gt;redistributing&lt;/b&gt; resources from rich to poor (between countries or within a country) can raise overall average health, because what those at the top lose is small compared with what those at the bottom gain.&lt;/p&gt;
    &lt;p&gt;The points off the curve are also interesting: the USA (79.5 years with almost $60,000) lies &lt;i&gt;below&lt;/i&gt; the curve compared with poorer European countries. This leads us to Part 5: how income is distributed matters too.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;ext&quot;&gt;Samuel H. Preston published the curve in 1975 (“The changing relation between mortality and level of economic development”, &lt;i&gt;Population Studies&lt;/i&gt;). He observed that the curve shifts &lt;b&gt;upwards&lt;/b&gt; over time: at the same income level people live longer thanks to medical and public‑health progress; by his estimates only a small part of the rise in life expectancy between the 1930s and the 1960s is explained by income growth. Preston presented it as an association, not a causal relationship. The article was reprinted in the &lt;i&gt;Bulletin of the WHO&lt;/i&gt; (2003). &lt;a href=&quot;https://scielosp.org/article/bwho/2003.v81n11/831-832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bulletin of the WHO, “Public health classic”&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;How powerful is your passport?&lt;/h3&gt;
  &lt;p&gt;Citizenship is an &lt;span class=&quot;en&quot;&gt;ascribed status&lt;/span&gt; (assigned at birth, not achieved) that mediates highly unequal access to living standards, security and opportunities (slide 21, see &lt;a href=&quot;#s4&quot;&gt;Part 4&lt;/a&gt;). The passport is its most tangible measure.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Henley Passport Index&lt;/b&gt;&lt;br&gt;ranks all the world’s passports by the &lt;b&gt;number of destinations&lt;/b&gt; that can be reached without a visa obtained in advance. It is based on data from IATA (&lt;i&gt;International Air Transport Association&lt;/i&gt;; the slide says “Authority”).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Henley Passport Power score&lt;/b&gt;&lt;br&gt;combines the index with World Bank GDP data: how much of the world economy is accessible visa‑free. It shows &lt;b&gt;growing economic inequality&lt;/b&gt; between countries.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;The weakest (slide 25)&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Nigeria&lt;/b&gt;: 44 destinations (20% of the world), equal to just &lt;b&gt;1.5% of global GDP&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Afghanistan&lt;/b&gt;: last in the Power score, 24 countries and less than 1% of world GDP.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Iraq&lt;/b&gt; (29) and &lt;b&gt;Syria&lt;/b&gt; (26).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;These citizens are &lt;i&gt;shut out of many opportunities for economic mobility and growth&lt;/i&gt;: excluded from opportunities for study, work and trade.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 350&quot; id=&quot;passbars&quot; role=&quot;img&quot; aria-label=&quot;Visa-free destinations by passport&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Destinations accessible visa‑free. Data from slides 24–25 (2026 ranking); the orange US bar comes from the external CNN source cited on slide 24.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;October 2025: for the first time in 20 years the &lt;b&gt;United States dropped out of the top 10&lt;/b&gt; of the Henley Index, falling to 12th place alongside Malaysia with 180 destinations. Among the causes: Brazil reintroduced visas for US citizens owing to a lack of reciprocity, and China’s new visa exemptions do not include the USA. &lt;a href=&quot;https://ktvz.com/entertainment/cnn-style/2025/10/14/us-drops-out-of-worlds-most-powerful-passport-top-10-list-for-the-first-time/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CNN (via KTVZ)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Index methodology: for each destination a passport scores 1 if no visa is required or if a visa on arrival, an entry permit or an electronic travel authorisation (ETA) is sufficient; it scores 0 if a visa or an e‑Visa must be obtained before departure. It covers 199 passports and 227 destinations and is updated monthly. &lt;a href=&quot;https://www.henleyglobal.com/passport-index/methodology&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Henley &amp;amp; Partners · Methodology&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. What does GDP per capita PPP measure, and why is PPP used?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;GDP per inhabitant adjusted for purchasing power parity: it takes into account different price levels across countries, so that incomes become comparable in terms of the goods they can actually buy.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Describe the shape of the Preston curve and its implication.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It is concave: life expectancy rises sharply with income in poor countries and only slightly in rich ones (diminishing returns). The same increase in income is therefore “worth” many more years of life in a poor country.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Why is citizenship an example of ascribed status?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because it is received at birth (by place or descent), without merit or choice, and yet it strongly conditions access to living standards, security and mobility, as the passport index shows.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. What does the Passport Power score add to a simple count of destinations?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It weights destinations by their GDP (World Bank data): it counts not only how many countries you can visit, but how much of the world economy is accessible to you. E.g. Nigeria: 44 countries but only 1.5% of global GDP.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part p-mattone&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 4 &lt;span class=&quot;slides&quot;&gt;· slides 16–21&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;en&quot;&gt;Social class&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;social status&lt;/span&gt;&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;How do we rank individuals and groups within a society? With two complementary tools: &lt;b&gt;class&lt;/b&gt;, a hierarchy based on &lt;i&gt;occupation&lt;/i&gt;, and &lt;b&gt;status&lt;/b&gt;, a hierarchy of prestige and respect.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Marx &amp;amp; Engels&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Erikson &amp;amp; Goldthorpe&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;
          &lt;p&gt;In the industrialising nineteenth century, &lt;b&gt;Karl Marx and Friedrich Engels&lt;/b&gt; see &lt;b&gt;two classes&lt;/b&gt;: the &lt;span class=&quot;en&quot;&gt;capitalists&lt;/span&gt;, who own factories and machines (&lt;i&gt;capital&lt;/i&gt;, the means of production), and the &lt;span class=&quot;en&quot;&gt;laborers&lt;/span&gt;, who work for them in exchange for low wages.&lt;/p&gt;
          &lt;p&gt;Industrialisation goes hand in hand with a highly unequal distribution: capitalists hold more favourable class positions. The criterion is &lt;b&gt;ownership&lt;/b&gt;: do you own the means of production or not?&lt;/p&gt;
        &lt;/div&gt;
        &lt;svg viewBox=&quot;0 0 300 220&quot; role=&quot;img&quot; aria-label=&quot;Two-class model&quot;&gt;
          &lt;rect x=&quot;70&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;55&quot; rx=&quot;10&quot; class=&quot;fma&quot;/&gt;
          &lt;text x=&quot;150&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;fp&quot;&gt;Capitalists&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fp&quot;&gt;own the capital&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;145&quot; width=&quot;260&quot; height=&quot;55&quot; rx=&quot;10&quot; class=&quot;fmab sma&quot;/&gt;
          &lt;text x=&quot;150&quot; y=&quot;169&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;fma&quot;&gt;Laborers&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;sell their labour&lt;/text&gt;
          &lt;path d=&quot;M110,140 V82&quot; class=&quot;sma&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a1)&quot;/&gt;&lt;text x=&quot;104&quot; y=&quot;115&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;labour&lt;/text&gt;
          &lt;path d=&quot;M190,82 V140&quot; class=&quot;sma&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a1)&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;115&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;low wages&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Robert Erikson and John Goldthorpe&lt;/b&gt; propose &lt;b&gt;many classes&lt;/b&gt;, defined as &lt;i&gt;aggregates of social positions identified in terms of relationships within labor markets and production units&lt;/i&gt;: sets of positions defined by relations in the labour market and in production units (are you an employee or an employer? with what contract, autonomy, career prospects?).&lt;/p&gt;
      &lt;p&gt;Here &lt;b&gt;occupation&lt;/b&gt; is the key to accessing valuable goods. Hence the conclusion of slide 17: &lt;b&gt;social class is associated with well‑being, living standards and health&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;The scheme is known as &lt;b&gt;EGP&lt;/b&gt; (Erikson‑Goldthorpe‑Portocarero) and, in its extended version, distinguishes about ten classes: from the &lt;i&gt;service class&lt;/i&gt; (professionals and managers) to routine non‑manual employees, small proprietors, skilled and unskilled manual workers, and agricultural workers. It is the most widely used scheme in Europe for mobility research.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Marx &amp;amp; Engels&lt;/th&gt;&lt;th&gt;Erikson &amp;amp; Goldthorpe&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Number of classes&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;many&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Criterion&lt;/td&gt;&lt;td&gt;ownership of the means of production&lt;/td&gt;&lt;td&gt;relations in the labour market and in production units (occupation)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Context&lt;/td&gt;&lt;td&gt;early industrialisation&lt;/td&gt;&lt;td&gt;advanced industrial societies, large middle class&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Use&lt;/td&gt;&lt;td&gt;explaining conflict and exploitation&lt;/td&gt;&lt;td&gt;measuring inequalities and mobility&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Class shows in the length of life&lt;/h3&gt;
  &lt;p&gt;England and Wales, 1997‑99 (slide 18): life expectancy falls steadily as one moves down the ladder of occupational classes, for both men and women.&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot; id=&quot;lebtn&quot;&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-m=&quot;m&quot;&gt;Males&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-m=&quot;f&quot;&gt;Females&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-m=&quot;b&quot;&gt;Both&lt;/button&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 285&quot; id=&quot;lebars&quot; role=&quot;img&quot; aria-label=&quot;Life expectancy by social class&quot;&gt;&lt;/svg&gt;
    &lt;figcaption id=&quot;legap&quot;&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Example occupations for each class&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Professional&lt;/b&gt;: doctors, engineers · &lt;b&gt;Managerial &amp;amp; technical / intermediate&lt;/b&gt;: managers, school teachers · &lt;b&gt;Skilled non‑manual&lt;/b&gt;: clerks, cashiers · &lt;b&gt;Skilled manual&lt;/b&gt;: plumbers, electricians · &lt;b&gt;Partly skilled&lt;/b&gt;: warehousemen, security guards · &lt;b&gt;Unskilled&lt;/b&gt;: cleaners, messengers.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;The gradient is “stepped”: there is not just a gap between the poorest and everyone else; every step counts. &lt;i&gt;Unskilled&lt;/i&gt; women (77.1) live almost as long as &lt;i&gt;professional&lt;/i&gt; men (78.5): gender and class act together, an example of intersection.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Social status&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Class does not capture every basis of stratification. &lt;b&gt;Status&lt;/b&gt; is also needed:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social status&lt;/b&gt;&lt;br&gt;a &lt;b&gt;subjective ranking&lt;/b&gt; of individuals or groups in terms of &lt;i&gt;honor, esteem and respect&lt;/i&gt;. It can be based on ethnic groups, education, age, (gender): e.g. the idea that “white people have more prestige than Black people” or that “men should be more respected than women”.&lt;/div&gt;
  &lt;div class=&quot;extra&quot;&gt;The class/status distinction goes back to &lt;b&gt;Max Weber&lt;/b&gt;: class concerns market position, status concerns recognised social prestige. The slides apply it without naming him.&lt;/div&gt;

  &lt;h4&gt;&lt;span class=&quot;en&quot;&gt;Occupational prestige&lt;/span&gt;: the USA in 1989&lt;/h4&gt;
  &lt;p&gt;A measurable form of status is occupational prestige, obtained by asking samples of people to rate occupations on a scale (here 0‑100).&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 300&quot; id=&quot;prestbars&quot; role=&quot;img&quot; aria-label=&quot;Prestige score top 5 and lowest 5&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Top‑5 and lowest‑5 from slide 20. Source in the slides: Nakao &amp;amp; Treas, 1994.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Keiko Nakao and Judith Treas, “Updating Occupational Prestige and Socioeconomic Scores: How the New Measures Measure Up”, &lt;i&gt;Sociological Methodology&lt;/i&gt; 24 (1994): 1‑72. In the 1989 &lt;i&gt;General Social Survey&lt;/i&gt; respondents placed occupations on a 9‑rung “ladder” of &lt;i&gt;social standing&lt;/i&gt;; the ratings were converted into 0‑100 scores. &lt;a href=&quot;https://usa.ipums.org/usa-action/variables/PRENT&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPUMS USA · variable PRENT&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Status and &lt;span class=&quot;en&quot;&gt;development outcomes&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Status is not just “reputation”: it is a &lt;b&gt;mechanism&lt;/b&gt; that reproduces and structures inequality (slide 21). Open the panels:&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;In the labour market and in education&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Class or ethnic classifications filter access to jobs in &lt;span class=&quot;en&quot;&gt;segmented labour markets&lt;/span&gt; (labour markets divided into segments — good and bad jobs — between which it is hard to move), to social networks and to opportunities in the education system.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Between countries&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The &lt;b&gt;status of countries&lt;/b&gt; as &lt;i&gt;developed&lt;/i&gt; or &lt;i&gt;developing&lt;/i&gt; can translate into unequal access to positions in international organisations.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;For global elites&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Access to top positions in transnational corporations allows &lt;i&gt;global economic elites&lt;/i&gt; to stabilise their class position.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Citizenship&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“&lt;i&gt;Very importantly&lt;/i&gt;”: national citizenship is an &lt;b&gt;ascribed status&lt;/b&gt; that mediates highly unequal access to living standards, security and much else. → See the &lt;a href=&quot;#s3&quot;&gt;passport index&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. According to the slides, what is social class based on?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It is a hierarchy based on occupation (for Marx and Engels, more precisely on whether or not one owns capital).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. How do Marx‑Engels and Erikson‑Goldthorpe differ?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Marx and Engels see two classes (capitalists and labourers) defined by ownership; Erikson and Goldthorpe see many classes defined by relations in the labour market and in production units, with occupation as the key to accessing valuable goods.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. How large is the life‑expectancy gap between professional and unskilled (UK 1997‑99)?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;7.4 years for men (78.5 vs 71.1) and 5.7 for women (82.8 vs 77.1).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. What is status and why is it “subjective”?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It is a ranking by honour, esteem and respect. It is subjective because it depends on the judgements and beliefs shared in a society (e.g. occupational prestige, ethnic or gender stereotypes), not on a measurable material resource such as income.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. Give an example of how status produces unequal development outcomes.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;E.g. citizenship (an ascribed status) determines freedom of movement and therefore access to work and study abroad; or ethnic classifications that filter access to segmented labour markets.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 5 &lt;span class=&quot;slides&quot;&gt;· slides 26–32&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;en&quot;&gt;Income&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;wealth&lt;/span&gt;: how steep is the ladder?&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Individuals and groups can be ranked on a &lt;span class=&quot;en&quot;&gt;social ladder&lt;/span&gt; above all with respect to income and wealth. The question on slide 26 is: &lt;i&gt;what is the degree of stratification&lt;/i&gt; with respect to this good?&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Income&lt;/b&gt;&lt;br&gt;a &lt;b&gt;flow&lt;/b&gt;: what comes in over a period (wages, pensions, rents, interest).&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Wealth&lt;/b&gt;&lt;br&gt;a &lt;b&gt;stock&lt;/b&gt;: what one owns at a given moment (homes, savings, shares, businesses, minus debts). It is usually far more concentrated than income.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Flow/stock distinction: a supplement added by this summary; the slides use the two terms together.&lt;/p&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;Gini coefficient&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Gini coefficient&lt;/b&gt;&lt;br&gt;summarises in a single number the &lt;b&gt;overall stratification&lt;/b&gt; of income or wealth in a society. Range &lt;b&gt;0 – 100&lt;/b&gt;: &lt;b&gt;0&lt;/b&gt; = everyone has the same income; &lt;b&gt;100&lt;/b&gt; = everything is in the hands of a single person.&lt;/div&gt;
  &lt;p&gt;To understand where the number comes from you need the &lt;span class=&quot;en&quot;&gt;Lorenz curve&lt;/span&gt;: people are lined up from poorest to richest and, for each share of the population, the curve plots the share of total income it holds. Under perfect equality the curve is the diagonal; the more the curve “sags” downwards, the greater the inequality.&lt;/p&gt;
  &lt;div class=&quot;def&quot; style=&quot;font-family:var(--serif);font-size:1.1rem&quot;&gt;G = &lt;span style=&quot;display:inline-block;text-align:center;vertical-align:middle&quot;&gt;&lt;span style=&quot;display:block;border-bottom:1px solid currentColor;padding:0 .3rem&quot;&gt;area between the diagonal and the Lorenz curve&lt;/span&gt;&lt;span style=&quot;display:block;padding:0 .3rem&quot;&gt;total area under the diagonal&lt;/span&gt;&lt;/span&gt; × 100&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 340 320&quot; id=&quot;lorenz&quot; role=&quot;img&quot; aria-label=&quot;Interactive Lorenz curve&quot;&gt;
        &lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;260&quot; class=&quot;fcard sr&quot;/&gt;
        &lt;path id=&quot;lzarea&quot; class=&quot;ft&quot; fill-opacity=&quot;.22&quot;/&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;310&quot; y2=&quot;20&quot; class=&quot;sm&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;path id=&quot;lzcurve&quot; fill=&quot;none&quot; class=&quot;st&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle id=&quot;lzmk&quot; r=&quot;5&quot; class=&quot;ft&quot;/&gt;
        &lt;text x=&quot;180&quot; y=&quot;305&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;fi&quot;&gt;cumulative share of population (poorest first) →&lt;/text&gt;
        &lt;text x=&quot;20&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;fi&quot; transform=&quot;rotate(-90 20 150)&quot;&gt;cumulative share of income →&lt;/text&gt;
        &lt;text x=&quot;200&quot; y=&quot;110&quot; font-size=&quot;11&quot; class=&quot;fm&quot; transform=&quot;rotate(-45 200 110)&quot;&gt;perfect equality&lt;/text&gt;
        &lt;g font-size=&quot;10&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;46&quot; y=&quot;292&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;label for=&quot;lzk&quot; class=&quot;small&quot;&gt;Income concentration&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;lzk&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;
      &lt;div class=&quot;readout&quot;&gt;&lt;span&gt;Gini &lt;b id=&quot;lzg&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;the richest 10% holds &lt;b id=&quot;lzt&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;the poorest half holds &lt;b id=&quot;lzb&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;p class=&quot;card small&quot;&gt;Order of magnitude: &lt;span id=&quot;lzref&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;The example on slide 27 — &lt;i&gt;10% of the population holds 40% of total income&lt;/i&gt; — indicates income stratification: under an equal distribution that 10% would hold 10%. The orange dot is the curve at the 90th percentile: the vertical distance between there and 100% is the share of the richest 10%. In the toy model, reaching 40% requires a very high Gini; real curves, which “bend” mostly at the top, get there with lower Gini values.&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;Toy model: curve L(p) = p&lt;sup&gt;k&lt;/sup&gt;, for which G = (k−1)/(k+1). Real curves have different shapes.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Income stratification&lt;/span&gt; around the world&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 470&quot; id=&quot;ginibars&quot; role=&quot;img&quot; aria-label=&quot;Gini coefficients by country&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Gini coefficients from slide 28 (World Bank 2017b), sorted. Survey years range from 2008 to 2016 (e.g. Italy 35.4 in 2015, South Africa 63.0 in 2014). Northern Europe is at the bottom, Latin America and South Africa at the top, the USA above all the large European countries.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;In the World Bank database (series &lt;i&gt;SI.POV.GINI&lt;/i&gt;) the Gini is calculated from household surveys and may refer to income or to consumption expenditure; cross‑country comparisons should therefore be made with caution, and national Gini values cannot be added up to obtain a regional or global Gini. &lt;a href=&quot;https://databank.worldbank.org/metadataglossary/jobs/series/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank · Metadata glossary&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;At the top of the ladder: the world’s richest&lt;/h3&gt;
  &lt;p&gt;Slides 29‑30 show the two Forbes 2025 top‑10 lists, separated by men and women: a way of showing the extreme stratification of &lt;b&gt;wealth&lt;/b&gt; and, at the same time, the &lt;b&gt;gender gap&lt;/b&gt; even at the very top.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 720 310&quot; id=&quot;billbars&quot; role=&quot;img&quot; aria-label=&quot;Net worth of top 10 men and women&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;&lt;span style=&quot;color:var(--ardesia)&quot;&gt;■&lt;/span&gt; top‑10 men · &lt;span style=&quot;color:var(--mattone)&quot;&gt;■&lt;/span&gt; top‑10 women, by rank (billions of $). &lt;span id=&quot;billsum&quot;&gt;&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Check against the material.&lt;/b&gt; The slides give net worth “&lt;i&gt;as of April 7, 2025&lt;/i&gt;”, but according to Forbes the reference date for the 2025 list is &lt;b&gt;March&lt;/b&gt; 7, 2025 (&lt;a href=&quot;https://www.forbes.com.au/news/billionaires/forbes-worlds-billionaires-list-2025-the-top-200/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Forbes Australia&lt;/a&gt;, external source). In the women’s table, moreover, Françoise Bettencourt Meyers (L’Oréal) is &lt;b&gt;French&lt;/b&gt; and Marilyn Simons is &lt;b&gt;American&lt;/b&gt;, not “United States” and “Spain” as written: probably typos. Check on &lt;a href=&quot;https://www.forbes.com/billionaires/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;forbes.com/billionaires&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;one percent&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Within‑country stratification of income and wealth in contemporary societies is highly &lt;b&gt;skewed&lt;/b&gt;: much of it is in the hands of the &lt;b&gt;top 1%&lt;/b&gt;. Scholars call this phenomenon “&lt;i&gt;the one percent&lt;/i&gt;”.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;100 people, one with half the wealth&quot;&gt;
      &lt;g id=&quot;onepct&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;100 squares = 100 people. In the suggested documentary, 1% of Americans control “nearly half” of the country’s wealth: the filled square owns about as much as the other 99 combined.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;script&gt;(function(){var g=document.getElementById(&quot;onepct&quot;),h=&quot;&quot;;for(var i=0;i&lt;100;i++){var x=10+(i%25)*23,y=10+Math.floor(i/25)*26;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;18&quot; height=&quot;20&quot; rx=&quot;3&quot; class=&quot;&#x27;+(i===0?&quot;ft&quot;:&quot;ftb st&quot;)+&#x27;&quot;/&gt;&#x27;}g.innerHTML=h})();&lt;/script&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Suggested documentary: &lt;i&gt;The One Percent&lt;/i&gt; (2006)&lt;/h4&gt;&lt;p&gt;About 80 minutes; the director &lt;b&gt;Jamie Johnson&lt;/b&gt;, a 27‑year‑old heir to the Johnson &amp;amp; Johnson fortune (and director of &lt;i&gt;Born Rich&lt;/i&gt;, HBO 2003), explores the political, moral and emotional reasons that allow a small percentage of Americans to control nearly half of the wealth of the United States. Interviews with Nicole Buffett, Bill Gates Sr., Adnan Khashoggi, Milton Friedman, Robert Reich, Ralph Nader. Link in the slides: &lt;a href=&quot;https://www.youtube.com/watch?v=IK35cxb3rkA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Why it matters: &lt;span class=&quot;en&quot;&gt;health and social problems are worse in more unequal countries&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The last slide closes the argument: among rich countries, those with &lt;b&gt;greater income inequality&lt;/b&gt; have a worse &lt;b&gt;index of health and social problems&lt;/b&gt; (Wilkinson &amp;amp; Pickett, 2009). What matters is not only how rich a country is, but &lt;b&gt;how&lt;/b&gt; its wealth is distributed.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 600 380&quot; role=&quot;img&quot; aria-label=&quot;Index of health and social problems against income inequality&quot; id=&quot;spirit&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;20&quot; x2=&quot;40&quot; y2=&quot;345&quot; class=&quot;sm&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;345&quot; x2=&quot;570&quot; y2=&quot;345&quot; class=&quot;sm&quot;/&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;307&quot; x2=&quot;522&quot; y2=&quot;60&quot; class=&quot;si&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;36&quot; y=&quot;28&quot; text-anchor=&quot;end&quot;&gt;Worse&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;342&quot; text-anchor=&quot;end&quot;&gt;Better&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;362&quot;&gt;Low&lt;/text&gt;&lt;text x=&quot;568&quot; y=&quot;362&quot; text-anchor=&quot;end&quot;&gt;High&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;300&quot; y=&quot;375&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;Income inequality →&lt;/text&gt;
        &lt;g class=&quot;fa&quot; id=&quot;sppts&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p class=&quot;small muted&quot;&gt;Tap a point to see the country. Positions estimated by eye from the chart on slide 32.&lt;/p&gt;
      &lt;p class=&quot;card&quot; id=&quot;spout&quot;&gt;—&lt;/p&gt;
      &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;What the index contains&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Life expectancy · maths &amp;amp; literacy · infant mortality · homicides · imprisonment · teenage births · trust · obesity · mental illness (incl. drug and alcohol addiction) · social mobility.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Note the last item: where the ladder is steeper it is also harder to climb. Stratification and mobility are linked.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
