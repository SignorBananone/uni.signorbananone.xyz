  &lt;script&gt;(function(){var P=[[&quot;USA&quot;,440,39],[&quot;Portugal&quot;,400,114],[&quot;UK&quot;,340,149],[&quot;Greece&quot;,270,186],[&quot;Ireland&quot;,260,197],[&quot;New Zealand&quot;,314,194],[&quot;France&quot;,227,215],[&quot;Australia&quot;,328,213],[&quot;Austria&quot;,171,218],[&quot;Germany&quot;,198,225],[&quot;Canada&quot;,230,226],[&quot;Italy&quot;,303,230],[&quot;Denmark&quot;,134,237],[&quot;Belgium&quot;,155,240],[&quot;Spain&quot;,223,246],[&quot;Switzerland&quot;,238,261],[&quot;Finland&quot;,92,258],[&quot;Netherlands&quot;,206,266],[&quot;Norway&quot;,102,277],[&quot;Sweden&quot;,108,294],[&quot;Japan&quot;,71,333]],g=document.getElementById(&quot;sppts&quot;),o=document.getElementById(&quot;spout&quot;),ns=&quot;http://www.w3.org/2000/svg&quot;;P.forEach(function(p){var c=document.createElementNS(ns,&quot;circle&quot;);c.setAttribute(&quot;cx&quot;,p[1]);c.setAttribute(&quot;cy&quot;,p[2]);c.setAttribute(&quot;r&quot;,p[0]===&quot;Italy&quot;?8:6.5);c.setAttribute(&quot;class&quot;,p[0]===&quot;Italy&quot;?&quot;ft&quot;:&quot;fa&quot;);c.style.cursor=&quot;pointer&quot;;c.setAttribute(&quot;tabindex&quot;,&quot;0&quot;);var t=document.createElementNS(ns,&quot;title&quot;);t.textContent=p[0];c.appendChild(t);function s(){var hi=p[2]&lt;(307-(p[1]-70)*247/452);o.innerHTML=&quot;&lt;b&gt;&quot;+p[0]+&quot;&lt;/b&gt;: &quot;+(p[1]&lt;180?&quot;low&quot;:p[1]&lt;300?&quot;medium&quot;:&quot;high&quot;)+&quot; inequality; problems &quot;+(hi?&quot;&lt;b&gt;above&lt;/b&gt;&quot;:&quot;&lt;b&gt;below&lt;/b&gt;&quot;)+&quot; what the regression line predicts.&quot;}c.addEventListener(&quot;click&quot;,s);c.addEventListener(&quot;focus&quot;,s);g.appendChild(c)});var lb=document.createElementNS(ns,&quot;g&quot;);lb.setAttribute(&quot;font-size&quot;,&quot;11&quot;);lb.setAttribute(&quot;class&quot;,&quot;fi&quot;);[[&quot;USA&quot;,450,43],[&quot;Japan&quot;,81,337],[&quot;Sweden&quot;,118,298],[&quot;Portugal&quot;,410,118],[&quot;UK&quot;,350,153],[&quot;Italy&quot;,314,234]].forEach(function(l){var t=document.createElementNS(ns,&quot;text&quot;);t.setAttribute(&quot;x&quot;,l[1]);t.setAttribute(&quot;y&quot;,l[2]);t.textContent=l[0];lb.appendChild(t)});g.parentNode.appendChild(lb)})();&lt;/script&gt;
  &lt;div class=&quot;ext&quot;&gt;Richard Wilkinson and Kate Pickett, &lt;i&gt;The Spirit Level: Why Equality is Better for Everyone&lt;/i&gt; (2009). The index combines the indicators for 21 rich countries; the authors replicated the result with UNICEF data on child well‑being and with US states. The book has been criticised (the causal link is debated) and the 2010 edition adds a chapter responding to critics; in 2024 the Equality Trust published the update “The Spirit Level at 15”. &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. What do a Gini of 0 and a Gini of 100 mean?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;0: everyone has the same income/wealth. 100: everything is in the hands of a single person.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Which country in the table has the highest Gini and which the lowest? And Italy?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Highest: South Africa (63.0). Lowest: Denmark (28.2). Italy: 35.4, more unequal than France, Germany and the UK but less so than the USA (41.5).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. “10% of the population holds 40% of income”: why does this indicate stratification?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because under an equal distribution that 10% would hold 10% of income: holding 40% means having four times its “share”, so the Lorenz curve moves away from the diagonal.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. What is the difference between income and wealth?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Income is a flow (earnings over a period), wealth is a stock (assets owned). Wealth is generally more concentrated.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. What does the Wilkinson &amp;amp; Pickett chart show, and why does it complement the Preston curve?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That among rich countries health and social problems (life expectancy, homicides, obesity, trust, mobility…) are worse where income inequality is greater. The Preston curve shows that beyond a certain threshold average income adds little: at that point distribution matters more.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, studies, data and websites cited in the slides&lt;/h2&gt;
  &lt;p&gt;Each card shows the slide on which the reference appears. Descriptions and links come from web searches: they are &lt;b&gt;external sources&lt;/b&gt;, not lecture content.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Marx &amp;amp; Engels — &lt;i&gt;Manifesto of the Communist Party&lt;/i&gt; (1848)&lt;/h4&gt;&lt;p&gt;The text in which history is read as “the history of class struggles” and the modern era as a division into two hostile camps, bourgeoisie and proletariat. It is the basis of the two‑class model on slide 16.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 16 · &lt;a href=&quot;https://www.marxists.org/archive/marx/works/1848/communist-manifesto/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Marxists Internet Archive (full text)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Erikson &amp;amp; Goldthorpe — &lt;i&gt;The Constant Flux&lt;/i&gt; (1992)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;A Study of Class Mobility in Industrial Societies&lt;/i&gt;, Clarendon Press (Oxford). A major comparative study of class mobility in industrial countries, built on the occupational class scheme of slide 17; a classic of stratification and mobility research.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 17 · &lt;a href=&quot;https://catalog.hathitrust.org/Record/002533920&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HathiTrust (catalogue record)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Samuel H. Preston (1975) — the Preston curve&lt;/h4&gt;&lt;p&gt;“The changing relation between mortality and level of economic development”, &lt;i&gt;Population Studies&lt;/i&gt;. Shows the concave income–life expectancy relationship and its upward shift over time, which he attributes mainly to medical progress. Reprinted with commentary in the &lt;i&gt;Bulletin of the WHO&lt;/i&gt; 81(11), 2003.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 14 · &lt;a href=&quot;https://scielosp.org/article/bwho/2003.v81n11/831-832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bulletin of the WHO — Public health classic&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Helliwell, Layard &amp;amp; Sachs — &lt;i&gt;World Happiness Report 2018&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Ranks 156 countries by happiness (life evaluations, Gallup surveys 2015‑2017) and 117 by the happiness of immigrants, the central theme of that edition. It is the source of the &lt;i&gt;Happiness score&lt;/i&gt; column on slide 13.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 13 · &lt;a href=&quot;https://worldhappiness.report/blog/finland-wins-double-gold-in-world-happiness-report-2018/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Happiness Report&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;World Bank — World Development Indicators and Gini index&lt;/h4&gt;&lt;p&gt;The slides cite World Bank 2017a (GDP, life expectancy) and 2017b (Gini). The &lt;i&gt;SI.POV.GINI&lt;/i&gt; indicator is calculated from household surveys (income or consumption) as the area between the Lorenz curve and the line of equality; it is now published in the Poverty and Inequality Platform.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slides 13, 14, 23, 28 · &lt;a href=&quot;https://databank.worldbank.org/metadataglossary/jobs/series/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank DataBank — Gini metadata&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;World Population Review&lt;/h4&gt;&lt;p&gt;A popular demographic data website that compiles figures from sources such as the UN, the World Bank and censuses, and produces its own projections. Useful for quick look‑ups; for citation it is better to trace back to the primary source indicated on each page.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slides 13–14 · &lt;a href=&quot;https://worldpopulationreview.com/about&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldpopulationreview.com — About&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Nakao &amp;amp; Treas (1994) — occupational prestige&lt;/h4&gt;&lt;p&gt;“Updating Occupational Prestige and Socioeconomic Scores: How the New Measures Measure Up”, &lt;i&gt;Sociological Methodology&lt;/i&gt; 24: 1‑72. Prestige scores 0‑100 from the 1989 General Social Survey, still used in IPUMS data and in work on socio‑economic indices.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 20 · &lt;a href=&quot;https://usa.ipums.org/usa-action/variables/PRENT&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPUMS USA — PRENT&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Henley Passport Index&lt;/h4&gt;&lt;p&gt;Monthly ranking of 199 passports across 227 destinations, based on IATA data and in‑house research; 1 point for each destination not requiring a visa in advance. Produced by a private citizenship advisory firm: it is an index, not an official statistic.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slides 23–25 · &lt;a href=&quot;https://www.henleyglobal.com/passport-index/ranking&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ranking&lt;/a&gt; · &lt;a href=&quot;https://www.henleyglobal.com/passport-index/methodology&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Methodology&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;CNN (14 Oct. 2025) — US out of the top 10&lt;/h4&gt;&lt;p&gt;Article by Maureen O’Hare: the USA falls to 12th place (tied with Malaysia, 180 destinations), the first time in the index’s 20 years; the lack of reciprocity weighs on it (only 46 nationalities can enter the USA visa‑free).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 24 · &lt;a href=&quot;https://edition.cnn.com/2025/10/14/travel/travel-news-most-powerful-passports&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CNN&lt;/a&gt; · &lt;a href=&quot;https://skift.com/2025/10/14/us-passport-power-historic-low/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Skift&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Forbes — World’s Billionaires 2025&lt;/h4&gt;&lt;p&gt;Annual list of people with an estimated net worth of ≥ $1 billion: in 2025, 3,028 people worth $16.1 trillion in total, with values as of March 7, 2025. There is also a real‑time ranking, so figures change from day to day.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slides 29–30 · &lt;a href=&quot;https://www.forbes.com/billionaires/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;forbes.com/billionaires&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;&lt;i&gt;The One Percent&lt;/i&gt; (2006), Jamie Johnson&lt;/h4&gt;&lt;p&gt;Documentary premiered at the Tribeca Film Festival and broadcast by HBO (&lt;i&gt;America Undercover&lt;/i&gt; series). The director interviews economists, politicians and his own family about the wealth gap in the USA.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 31 · &lt;a href=&quot;https://en.wikipedia.org/wiki/The_One_Percent_(film)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=IK35cxb3rkA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube (link from the slides)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Wilkinson &amp;amp; Pickett — &lt;i&gt;The Spirit Level&lt;/i&gt; (2009)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Why Equality is Better for Everyone&lt;/i&gt;. Correlation between income inequality and an index of 10‑11 health and social problems in 21 rich countries. Highly influential and much debated; updated in 2024 (“The Spirit Level at 15”).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 32 · &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Kimberlé Crenshaw (1989) — intersectionality&lt;/h4&gt;&lt;p&gt;“Demarginalizing the Intersection of Race and Sex”, &lt;i&gt;University of Chicago Legal Forum&lt;/i&gt;: the article that introduces the concept, criticising the “single‑axis” analysis of anti‑discrimination law. It is not cited in the slides (which only show a diagram credited to &lt;i&gt;First Book&lt;/i&gt;), but it is the original reference.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Related to slide 9 · &lt;a href=&quot;https://scholarship.law.columbia.edu/faculty_scholarship/3007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Columbia Law Scholarship Archive&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;UN — SDG 10 &lt;i&gt;Reduced inequalities&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;“Reduce inequality within and among countries”: 10 targets for 2030, including income growth of the bottom 40% above the national average (10.1), the inclusion of all irrespective of age, sex, disability, ethnicity, religion or status (10.2) and a greater voice for developing countries in international institutions (10.6). It links this lecture to the previous one (slide 2).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Related to slides 2, 21 · &lt;a href=&quot;https://ourworldindata.org/sdgs/reduced-inequalities&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data — SDG 10 tracker&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot; style=&quot;margin-top:1.2rem&quot;&gt;The table on life expectancy by class in England and Wales (slide 18) gives no source on the slide. Time series of this kind are published by the ONS (“Trends in life expectancy by social class”); I could not find the exact 1997‑99 table online.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

  /* Lorenz / Gini */

    var lsl=$(&quot;#lzk&quot;);
    function lu(){var t=+lsl.value/100,k=1+t*t*14,c=&quot;&quot;,a=&quot;M&quot;+P(0,0)+&quot;L&quot;+P(1,1);
      for(var i=0;i&lt;=60;i++){var p=i/60;c+=(i?&quot;L&quot;:&quot;M&quot;)+P(p,Math.pow(p,k))}
      for(var j=60;j&gt;=0;j--){var q=j/60;a+=&quot;L&quot;+P(q,Math.pow(q,k))}
      $(&quot;#lzcurve&quot;).setAttribute(&quot;d&quot;,c);$(&quot;#lzarea&quot;).setAttribute(&quot;d&quot;,a+&quot;Z&quot;);
      var gini=(k-1)/(k+1)*100,top=(1-Math.pow(.9,k))*100,bot=Math.pow(.5,k)*100;
      $(&quot;#lzg&quot;).textContent=gini.toFixed(0);$(&quot;#lzt&quot;).textContent=top.toFixed(0)+&quot;%&quot;;$(&quot;#lzb&quot;).textContent=bot.toFixed(0)+&quot;%&quot;;

      $(&quot;#lzref&quot;).textContent=ref;
      var mk=$(&quot;#lzmk&quot;),yy=Math.pow(.9,k);mk.setAttribute(&quot;cx&quot;,ox+.9*S);mk.setAttribute(&quot;cy&quot;,oy+S-yy*S);}
    lsl.addEventListener(&quot;input&quot;,lu);lu();
  }

  /* Gini bars */

  }

  /* billionaires */
  var bb=$(&quot;#billbars&quot;);
