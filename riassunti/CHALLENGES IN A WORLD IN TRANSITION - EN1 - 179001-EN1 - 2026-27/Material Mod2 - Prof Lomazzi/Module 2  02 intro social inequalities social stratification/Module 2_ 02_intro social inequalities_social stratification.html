  &lt;div class=&quot;card&quot; style=&quot;margin-top:1rem&quot;&gt;
    &lt;b&gt;Da dove arriviamo.&lt;/b&gt; La lezione precedente (slide 2) aveva introdotto il modulo, la &lt;span class=&quot;en&quot;&gt;sociological perspective&lt;/span&gt; (guardare i fatti individuali come effetto di strutture sociali) e gli &lt;span class=&quot;en&quot;&gt;SDGs&lt;/span&gt; — i &lt;i&gt;Sustainable Development Goals&lt;/i&gt; dell’ONU — con l’idea che lo “sviluppo” non è solo crescita economica e che le disuguaglianze sono un nodo cruciale. Questa lezione apre il tema in tre blocchi (slide 3): &lt;i&gt;differences and inequalities&lt;/i&gt;, &lt;i&gt;stratification and mobility&lt;/i&gt;, &lt;i&gt;global inequalities&lt;/i&gt;.
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;s1&quot; class=&quot;part p-salvia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Parte 1 &lt;span class=&quot;slides&quot;&gt;· slide 4–9&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Differenze e disuguaglianze&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Ogni società è fatta di persone diverse. Il problema sociologico non è la differenza in sé, ma &lt;b&gt;che cosa la società ne fa&lt;/b&gt;: quando una differenza diventa motivo di trattamento ineguale, nasce una disuguaglianza.&lt;/p&gt;

  &lt;h3&gt;Le &lt;span class=&quot;en&quot;&gt;social differences&lt;/span&gt; (differenze sociali)&lt;/h3&gt;
  &lt;p&gt;Le slide partono da un elenco aperto (slide 4): &lt;i&gt;age, gender, socio‑economic status, race, ethnic belonging, religious denomination&lt;/i&gt;… e poi una “nuvola” di oltre venti dimensioni (slide 8). Il titolo della slide 8 evidenzia in rosso la &lt;b&gt;s&lt;/b&gt; finale di &lt;i&gt;Difference&lt;b style=&quot;color:var(--acc)&quot;&gt;s&lt;/b&gt; &amp;amp; Inequalitie&lt;b style=&quot;color:var(--acc)&quot;&gt;s&lt;/b&gt;&lt;/i&gt;: le disuguaglianze sono &lt;b&gt;al plurale&lt;/b&gt;, multidimensionali, non riducibili al solo reddito.&lt;/p&gt;
  &lt;p class=&quot;small muted&quot;&gt;Prova a raggruppare le dimensioni della slide 8 secondo i tre tipi di &lt;i&gt;factors&lt;/i&gt; della slide 12 (raggruppamento proposto da questo riassunto, non dalle slide: alcune voci stanno in più gruppi).&lt;/p&gt;

  &lt;h3&gt;Sono la stessa cosa? Quando la differenza diventa disuguaglianza&lt;/h3&gt;
  &lt;p&gt;La slide 5 pone due domande: &lt;i&gt;are the same?&lt;/i&gt; — no — e &lt;i&gt;when do social differences become inequalities?&lt;/i&gt; La risposta (slide 6) passa per due definizioni.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inequality&lt;/b&gt; (disuguaglianza)&lt;br&gt;&lt;i&gt;unequal treatment on the bases of social differences&lt;/i&gt;: un trattamento ineguale che ha come base una differenza sociale. È un &lt;b&gt;fatto&lt;/b&gt;: si osserva e si misura.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Discrimination&lt;/b&gt; (discriminazione)&lt;br&gt;una persona è trattata diversamente, o esclusa da un’opportunità o da un servizio, &lt;b&gt;senza giustificazione&lt;/b&gt;. Qui entra una &lt;b&gt;valutazione&lt;/b&gt;: riconosciamo che quel trattamento ineguale è ingiusto (&lt;i&gt;unfair&lt;/i&gt;).&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Da differenza a discriminazione&quot;&gt;

      &lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fi&quot;&gt;es. età, genere, etnia&lt;/text&gt;

      &lt;rect x=&quot;335&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;14&quot; class=&quot;fsb ss&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fs&quot;&gt;Inequality&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fi&quot;&gt;trattamento ineguale&lt;/text&gt;
      &lt;text x=&quot;450&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;fatto osservabile&lt;/text&gt;

      &lt;text x=&quot;775&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;fp&quot;&gt;… senza giustificazione&lt;/text&gt;
      &lt;text x=&quot;775&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;giudizio: è ingiusto&lt;/text&gt;

  &lt;h3&gt;Come si trattano le differenze, e con quali conseguenze&lt;/h3&gt;
  &lt;p&gt;La slide 7 mette in fila quattro modi “sbagliati” di trattare le differenze, ciascuno con il suo effetto. Scorri i passi: sono in ordine crescente di gravità.&lt;/p&gt;
  &lt;div class=&quot;steps&quot; data-hook=&quot;treatHook&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 120&quot; style=&quot;width:100%;height:auto&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g id=&quot;treatbars&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · &lt;span class=&quot;en&quot;&gt;Differences are not recognized&lt;/span&gt; → si perde potenziale&lt;/h4&gt;&lt;p&gt;Se una società non “vede” le differenze (lingue, competenze, culture), spreca &lt;b&gt;social capital&lt;/b&gt; — il capitale sociale, cioè le risorse che nascono da reti, relazioni e saperi diversi — e le &lt;i&gt;potentialities&lt;/i&gt; per lo sviluppo economico, culturale e sociale.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Es.: titoli di studio di migranti non riconosciuti → medici che fanno i magazzinieri.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · &lt;span class=&quot;en&quot;&gt;Differences are not considered&lt;/span&gt; → si amplificano le disuguaglianze&lt;/h4&gt;&lt;p&gt;Politiche, servizi e pratiche pensati per un utente “medio” rischiano di &lt;b&gt;amplificare&lt;/b&gt; le disuguaglianze esistenti: chi è già svantaggiato fa più fatica ad accedervi.&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;Es.: un bando che richiede SPID e firma digitale penalizza chi ha meno competenze digitali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · &lt;span class=&quot;en&quot;&gt;Differences become source of inequality&lt;/span&gt; → segregazione&lt;/h4&gt;&lt;p&gt;La differenza diventa criterio di separazione: processi di &lt;b&gt;segregation&lt;/b&gt; (quartieri, scuole, mercati del lavoro separati) che limitano lo sviluppo individuale e sociale.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · &lt;span class=&quot;en&quot;&gt;The right to difference is denied&lt;/span&gt; → violenza&lt;/h4&gt;&lt;p&gt;Quando si nega il diritto alla differenza e la &lt;b&gt;dignità&lt;/b&gt; delle differenze, l’esito estremo è la violenza. L’esempio delle slide è la &lt;b&gt;GBV&lt;/b&gt; (&lt;i&gt;gender‑based violence&lt;/i&gt;, violenza di genere: violenza diretta contro una persona a causa del suo genere).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Intersectionality&lt;/span&gt; (intersezionalità)&lt;/h3&gt;
  &lt;p&gt;Le differenze non agiscono una alla volta: ogni persona sta all’&lt;b&gt;incrocio&lt;/b&gt; di più dimensioni (genere, &lt;i&gt;race/ethnicity&lt;/i&gt;, classe, abilità, nazionalità, orientamento sessuale — le sei del diagramma della slide 9, immagine di &lt;i&gt;First Book&lt;/i&gt;). L’intersezionalità è lo sguardo che studia come questi assi si &lt;b&gt;combinano&lt;/b&gt; producendo forme specifiche di vantaggio o svantaggio, che non si vedono guardando un asse alla volta.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; id=&quot;ix&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 360 340&quot; role=&quot;img&quot; aria-label=&quot;Diagramma dell&#x27;intersezionalità&quot;&gt;

          &lt;circle id=&quot;ix-s&quot; cx=&quot;180&quot; cy=&quot;228&quot; r=&quot;85&quot; class=&quot;fs ss&quot;/&gt;
          &lt;circle id=&quot;ix-a&quot; cx=&quot;130&quot; cy=&quot;200&quot; r=&quot;85&quot; class=&quot;fa sa&quot;/&gt;
        &lt;/g&gt;
        &lt;circle id=&quot;ixcore&quot; cx=&quot;180&quot; cy=&quot;160&quot; r=&quot;44&quot; class=&quot;fi&quot;/&gt;
        &lt;text x=&quot;180&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; font-weight=&quot;700&quot; class=&quot;fp&quot;&gt;INTERSECTIONALITY&lt;/text&gt;
        &lt;g font-size=&quot;12.5&quot; font-weight=&quot;600&quot; class=&quot;fi&quot; text-anchor=&quot;middle&quot;&gt;
          &lt;text x=&quot;80&quot; y=&quot;95&quot;&gt;Gender&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;30&quot;&gt;Race / Ethnicity&lt;/text&gt;&lt;text x=&quot;282&quot; y=&quot;95&quot;&gt;Class&lt;/text&gt;
          &lt;text x=&quot;290&quot; y=&quot;245&quot;&gt;Nationality&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;305&quot;&gt;Sexual orientation&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;245&quot;&gt;Abilities&lt;/text&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p class=&quot;small muted&quot;&gt;Accendi gli assi che riguardano una persona immaginaria e guarda come si “scurisce” il centro:&lt;/p&gt;
      &lt;div class=&quot;btnrow&quot; id=&quot;ixbtn&quot;&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-a=&quot;g&quot;&gt;Gender&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;r&quot;&gt;Race/Ethnicity&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;c&quot;&gt;Class&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;n&quot;&gt;Nationality&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;s&quot;&gt;Sexual orientation&lt;/button&gt;
        &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-a=&quot;a&quot;&gt;Abilities&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot; id=&quot;ixout&quot; style=&quot;min-height:7.5rem&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ext&quot;&gt;Il termine è stato coniato dalla giurista &lt;b&gt;Kimberlé Crenshaw&lt;/b&gt; nel 1989 (“Demarginalizing the Intersection of Race and Sex”, &lt;i&gt;University of Chicago Legal Forum&lt;/i&gt;): mostrava che i tribunali USA non riconoscevano la discriminazione subita dalle donne nere perché la valutavano o come solo razziale o come solo di genere. &lt;a href=&quot;https://scholarship.law.columbia.edu/faculty_scholarship/3007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Columbia Law Scholarship&lt;/a&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 1&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Differenza sociale e disuguaglianza sociale sono sinonimi?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;No. La differenza è una caratteristica (età, genere…); la disuguaglianza c’è quando su quella differenza si basa un &lt;i&gt;unequal treatment&lt;/i&gt;, un trattamento ineguale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Che cosa aggiunge il concetto di discrimination rispetto a inequality?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Un giudizio di valore: il trattamento diverso o l’esclusione da un’opportunità/servizio avviene &lt;b&gt;senza giustificazione&lt;/b&gt;, e quindi lo riconosciamo come ingiusto.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Una politica pensata “uguale per tutti” può aumentare le disuguaglianze?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Sì: è il caso delle &lt;i&gt;differences not considered&lt;/i&gt; (slide 7). Se ignora le differenze di partenza, policy e servizi rischiano di amplificare le disuguaglianze esistenti.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Qual è la conseguenza più grave della negazione del diritto alla differenza, secondo la slide 7?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La violenza; l’esempio è la GBV, &lt;i&gt;gender‑based violence&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. Perché serve uno sguardo intersezionale?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché gli assi di differenza si combinano: la posizione di una donna migrante con disabilità non è la somma di “donna” + “migrante” + “disabile” analizzati separatamente. Un’analisi a un solo asse rischia di non vedere proprio chi sta agli incroci.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part p-ocra&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Parte 2 &lt;span class=&quot;slides&quot;&gt;· slide 10–12, 15&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Stratificazione, mobilità, risorse&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;La sociologia studia la disuguaglianza lungo tre filoni di ricerca. Il cuore della lezione è il primo: la &lt;span class=&quot;en&quot;&gt;stratification&lt;/span&gt;, cioè come le persone si dispongono “a strati” rispetto ai &lt;span class=&quot;en&quot;&gt;valuable goods&lt;/span&gt; — i beni di valore come benessere, tenore di vita, salute.&lt;/p&gt;

  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Inequality: three main research topics&quot;&gt;
      &lt;rect x=&quot;350&quot; y=&quot;10&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fo&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;600&quot; class=&quot;fp&quot;&gt;Inequality&lt;/text&gt;
      &lt;path d=&quot;M450,60 V95 M150,95 H750 M150,95 V125 M450,95 V125 M750,95 V125&quot; class=&quot;so&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
      &lt;g text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;45&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Stratification&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;distribuzione ineguale&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;dei valuable goods&lt;/text&gt;
        &lt;rect x=&quot;345&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Mobility&lt;/text&gt;
        &lt;text x=&quot;450&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;movimento da una posizione&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;a un’altra nel sistema&lt;/text&gt;
        &lt;rect x=&quot;645&quot; y=&quot;125&quot; width=&quot;210&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;157&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Resources&lt;/text&gt;
        &lt;text x=&quot;750&quot; y=&quot;198&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;capitale, opportunità, potere&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;214&quot; font-size=&quot;12.5&quot; class=&quot;fi&quot;&gt;per realizzare i propri scopi&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Ridisegnato dalla slide 10.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Stratification&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Mobility&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Resources&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Stratification&lt;/b&gt; = &lt;i&gt;unequal distribution of valued goods&lt;/i&gt;. Il termine viene dalla geologia: come le rocce si depositano in strati sovrapposti, così la società ha gruppi “sopra” e “sotto”. Studiarla vuol dire &lt;b&gt;confrontare e ordinare&lt;/b&gt; (&lt;i&gt;comparing, ranking&lt;/i&gt;, slide 15) individui, gruppi o paesi rispetto a quanto possiedono di qualcosa che ha valore.&lt;/p&gt;
      &lt;p&gt;Domanda guida: &lt;i&gt;chi ha cosa, quanto, e perché?&lt;/i&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Mobility&lt;/b&gt; (mobilità sociale) = &lt;i&gt;movement of people from one position to another in the stratification system&lt;/i&gt;. Se la stratificazione è una fotografia, la mobilità è il film: mostra se le posizioni sono aperte o bloccate.&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;Distinzioni classiche che le slide danno per scontate: &lt;b&gt;intergenerational&lt;/b&gt; (figli vs genitori) e &lt;b&gt;intragenerational&lt;/b&gt; (nel corso della vita della stessa persona); &lt;b&gt;upward / downward&lt;/b&gt; (verso l’alto o il basso) e &lt;b&gt;horizontal&lt;/b&gt; (cambio di posizione allo stesso livello). Prova qui sotto.&lt;/div&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;svg viewBox=&quot;0 0 300 250&quot; id=&quot;ladder&quot; role=&quot;img&quot; aria-label=&quot;Scala sociale e mobilità&quot;&gt;
          &lt;defs&gt;&lt;marker id=&quot;a2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; class=&quot;ft&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
          &lt;g class=&quot;so&quot; stroke-width=&quot;3&quot;&gt;&lt;line x1=&quot;40&quot; y1=&quot;10&quot; x2=&quot;40&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;200&quot; y1=&quot;10&quot; x2=&quot;200&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
          &lt;g class=&quot;so&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;40&quot; y1=&quot;40&quot; x2=&quot;200&quot; y2=&quot;40&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;90&quot; x2=&quot;200&quot; y2=&quot;90&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;140&quot; x2=&quot;200&quot; y2=&quot;140&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;190&quot; x2=&quot;200&quot; y2=&quot;190&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;235&quot; x2=&quot;200&quot; y2=&quot;235&quot;/&gt;&lt;/g&gt;
          &lt;g font-size=&quot;11&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;210&quot; y=&quot;44&quot;&gt;alto&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;239&quot;&gt;basso&lt;/text&gt;&lt;/g&gt;
          &lt;g id=&quot;ladfig&quot;&gt;&lt;/g&gt;
        &lt;/svg&gt;
        &lt;div&gt;
          &lt;div class=&quot;btnrow&quot; id=&quot;ladbtn&quot;&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-s=&quot;0&quot;&gt;Intergenerational ↑&lt;/button&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-s=&quot;1&quot;&gt;Intragenerational ↓&lt;/button&gt;
            &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-s=&quot;2&quot;&gt;Horizontal&lt;/button&gt;
          &lt;/div&gt;
          &lt;p id=&quot;ladtxt&quot; class=&quot;card small&quot;&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;script&gt;(function(){var S=[[[70,190,&quot;genitore&quot;],[160,90,&quot;figlia&quot;],&quot;Il padre era operaio non qualificato; la figlia diventa insegnante. Mobilità intergenerazionale ascendente: si confronta la posizione di arrivo dei figli con quella d’origine dei genitori.&quot;],[[80,90,&quot;a 30 anni&quot;],[160,190,&quot;a 50 anni&quot;],&quot;Un impiegato perde il lavoro in una crisi e si ricolloca come addetto alle pulizie. Mobilità intragenerazionale discendente: cambia la posizione della stessa persona nel corso della carriera.&quot;],[[80,140,&quot;prima&quot;],[160,140,&quot;dopo&quot;],&quot;Una cassiera diventa impiegata d’ufficio con reddito e prestigio simili: cambia lavoro ma non “strato”. Mobilità orizzontale.&quot;]];var g=document.getElementById(&quot;ladfig&quot;),t=document.getElementById(&quot;ladtxt&quot;),b=document.querySelectorAll(&quot;#ladbtn button&quot;);function d(i){var s=S[i],h=&quot;&quot;;[s[0],s[1]].forEach(function(p,k){h+=&#x27;&lt;circle cx=&quot;&#x27;+p[0]+&#x27;&quot; cy=&quot;&#x27;+(p[1]-14)+&#x27;&quot; r=&quot;9&quot; class=&quot;&#x27;+(k?&quot;ft&quot;:&quot;fo&quot;)+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+p[0]+&#x27;&quot; y=&quot;&#x27;+(p[1]-28)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;&#x27;+p[2]+&#x27;&lt;/text&gt;&#x27;});h+=&#x27;&lt;path d=&quot;M&#x27;+(s[0][0]+12)+&#x27;,&#x27;+(s[0][1]-14)+&#x27; Q120,&#x27;+((s[0][1]+s[1][1])/2-30)+&#x27; &#x27;+(s[1][0]-12)+&#x27;,&#x27;+(s[1][1]-14)+&#x27;&quot; fill=&quot;none&quot; class=&quot;st&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a2)&quot;/&gt;&#x27;;g.innerHTML=h;t.textContent=s[2];b.forEach(function(x,j){x.setAttribute(&quot;aria-pressed&quot;,j===i?&quot;true&quot;:&quot;false&quot;)})}b.forEach(function(x,j){x.addEventListener(&quot;click&quot;,function(){d(j)})});d(0)})();&lt;/script&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Resources&lt;/b&gt; = &lt;i&gt;capital, opportunities, and power one can use to realize one’s goals&lt;/i&gt;. Sono ciò che permette di muoversi (mobilità) e di occupare una certa posizione (stratificazione).&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;In sociologia si distingue spesso fra capitale &lt;b&gt;economico&lt;/b&gt; (reddito, patrimonio), &lt;b&gt;culturale&lt;/b&gt; (istruzione, titoli, saperi) e &lt;b&gt;sociale&lt;/b&gt; (reti di relazioni): la distinzione è di Pierre Bourdieu. Combacia con le risorse &lt;i&gt;economic, political, cultural and symbolic&lt;/i&gt; citate nella definizione di stratificazione (slide 11).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Differentiation&lt;/span&gt; vs &lt;span class=&quot;en&quot;&gt;stratification&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Differentiation&lt;/b&gt;&lt;br&gt;il processo per cui le parti di una comunità assumono identità sociali diverse in termini di &lt;b&gt;function, authority and power&lt;/b&gt; (funzione, autorità, potere). Descrive una &lt;i&gt;divisione&lt;/i&gt; dei ruoli.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Stratification&lt;/b&gt;&lt;br&gt;la distribuzione di individui o gruppi su una &lt;b&gt;scala&lt;/b&gt; di posizioni sociali distinte, in base al possesso di risorse &lt;b&gt;economic, political, cultural and symbolic&lt;/b&gt;. Descrive una &lt;i&gt;gerarchia&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Differenziazione orizzontale e stratificazione verticale&quot;&gt;
      &lt;text x=&quot;210&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Differentiation: “diversi”&lt;/text&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;agricoltore&lt;/text&gt;
        &lt;rect x=&quot;120&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;artigiano&lt;/text&gt;
        &lt;rect x=&quot;220&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;sacerdote&lt;/text&gt;
        &lt;rect x=&quot;320&quot; y=&quot;70&quot; width=&quot;85&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fob so&quot;/&gt;&lt;text x=&quot;362&quot; y=&quot;105&quot; class=&quot;fi&quot;&gt;guerriero&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;210&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;ruoli affiancati&lt;/text&gt;
      &lt;path d=&quot;M440,100 H500&quot; class=&quot;so&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#a1)&quot;/&gt;
      &lt;text x=&quot;470&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fm&quot;&gt;+ risorse&lt;/text&gt;
      &lt;text x=&quot;690&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fo&quot;&gt;Stratification: “sopra / sotto”&lt;/text&gt;
      &lt;g text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;
        &lt;rect x=&quot;630&quot; y=&quot;32&quot; width=&quot;120&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;54&quot; class=&quot;fp&quot;&gt;sacerdote · guerriero&lt;/text&gt;
        &lt;rect x=&quot;590&quot; y=&quot;72&quot; width=&quot;200&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot; fill-opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;94&quot; class=&quot;fp&quot;&gt;artigiano&lt;/text&gt;
        &lt;rect x=&quot;545&quot; y=&quot;112&quot; width=&quot;290&quot; height=&quot;34&quot; rx=&quot;6&quot; class=&quot;fo&quot; fill-opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;134&quot; class=&quot;fi&quot;&gt;agricoltore&lt;/text&gt;
      &lt;/g&gt;
      &lt;text x=&quot;690&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fm&quot;&gt;ruoli ordinati per risorse possedute&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Esempio illustrativo (non dalle slide): la differenziazione divide i compiti, la stratificazione li mette in classifica.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Fattori e livelli&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Factors of differentiation / inequality&lt;/h4&gt;&lt;p&gt;(slide 12)&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Economic factors&lt;/b&gt; — reddito, patrimonio, occupazione&lt;/li&gt;&lt;li&gt;&lt;b&gt;Socio‑cultural factors&lt;/b&gt; — istruzione, etnia, religione, genere, status&lt;/li&gt;&lt;li&gt;&lt;b&gt;Political factors&lt;/b&gt; — cittadinanza, diritti, accesso al potere&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;small muted&quot;&gt;Gli esempi tra trattini sono un’integrazione del riassunto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Due livelli di stratificazione&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Between‑country&lt;/b&gt; (fra paesi): si confrontano medie nazionali, es. il tenore di vita medio in Burundi e in Francia.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Within‑country&lt;/b&gt; (dentro un paese): si confronta la distribuzione dei valuable goods fra gruppi sociali dello stesso paese, raggruppati per età, genere, status socio‑economico…&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 190&quot; role=&quot;img&quot; aria-label=&quot;Between e within&quot;&gt;
      &lt;text x=&quot;225&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fa&quot;&gt;Between‑country → Parte 3&lt;/text&gt;

      &lt;text x=&quot;675&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; class=&quot;fma&quot;&gt;Within‑country → Parti 4–5&lt;/text&gt;

      &lt;text x=&quot;670&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;gruppi dello stesso paese (classe, genere, età…)&lt;/text&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 2&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Quali sono i tre main research topics sulla disuguaglianza?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Stratification (distribuzione ineguale dei beni di valore), mobility (movimento fra posizioni), resources (capitale, opportunità e potere per raggiungere i propri scopi).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Differenza fra differentiation e stratification?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La differenziazione è il processo per cui le parti di una comunità assumono identità diverse per funzione, autorità e potere; la stratificazione dispone individui/gruppi su una scala gerarchica in base alle risorse economiche, politiche, culturali e simboliche possedute.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Confrontare l’aspettativa di vita di operai e medici in Italia è stratificazione between o within?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Within‑country: gruppi diversi dentro lo stesso paese. Confrontare Italia e Niger sarebbe between‑country.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Cosa si intende per valuable goods nelle slide?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;I beni che hanno valore per le persone: well‑being (benessere), living standards (tenore di vita), health (salute) — e, più in generale, reddito, ricchezza, prestigio, opportunità.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part p-ardesia&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Parte 3 &lt;span class=&quot;slides&quot;&gt;· slide 13–14, 22–25&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Disuguaglianze fra paesi&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;“&lt;i&gt;Where you are born makes a lot of difference for your well‑being, living standards, health&lt;/i&gt;”: il luogo di nascita è forse il più potente fattore di disuguaglianza, e nessuno lo sceglie.&lt;/p&gt;

  &lt;h3&gt;Paesi molto ricchi e molto poveri&lt;/h3&gt;
  &lt;p&gt;La slide 13 confronta tre indicatori. Prima di leggerla, tre termini:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;GDP per capita, PPP&lt;/b&gt;&lt;br&gt;PIL (&lt;i&gt;Gross Domestic Product&lt;/i&gt;) diviso per gli abitanti, a &lt;i&gt;Purchasing Power Parity&lt;/i&gt; (parità di potere d’acquisto): corretto per il costo della vita, così 1 dollaro “compra” la stessa quantità di beni ovunque.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Life expectancy at birth&lt;/b&gt;&lt;br&gt;speranza di vita alla nascita: quanti anni vivrebbe in media un neonato se restassero costanti i tassi di mortalità attuali.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Happiness score&lt;/b&gt;&lt;br&gt;media 2015‑2017 (scala 0‑10) della valutazione che le persone danno della propria vita, dal &lt;i&gt;World Happiness Report&lt;/i&gt;.&lt;/div&gt;
  &lt;/div&gt;

      &lt;tr&gt;&lt;td&gt;Switzerland&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,307&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;83.5&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.5&lt;/td&gt;&lt;/tr&gt;

  &lt;p class=&quot;small muted&quot;&gt;Fonte nelle slide: Helliwell, Layard &amp;amp; Sachs 2018; World Bank 2017a; World Population Review 2017. Alcune righe sono raggruppate qui per brevità.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;×105&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;il PIL pro capite dell’Irlanda rispetto alla Repubblica Centrafricana (76.744 / 727)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;28,5 anni&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;di vita attesa in meno fra la Repubblica Centrafricana (52,9) e l’Irlanda (81,4)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;big&quot;&gt;4,7 punti&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;di felicità su 10 fra Norvegia/Danimarca (7,6) e Burundi (2,9)&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;Preston curve&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La curva di Preston mette in relazione il &lt;b&gt;GDP per capita&lt;/b&gt; (asse x) e la &lt;b&gt;life expectancy&lt;/b&gt; (asse y) dei paesi del mondo. La forma è &lt;b&gt;concava&lt;/b&gt;: sale ripidissima tra i paesi poveri e si appiattisce tra i ricchi. Le slide la usano come prova visiva che &lt;i&gt;the world is unequal&lt;/i&gt;.&lt;/p&gt;
  &lt;figure id=&quot;preston&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 320&quot; role=&quot;img&quot; aria-label=&quot;Preston curve interattiva&quot;&gt;
      &lt;g class=&quot;sr&quot; stroke-width=&quot;1&quot;&gt;
        &lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;30&quot; y2=&quot;30&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;92.5&quot; y2=&quot;92.5&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;155&quot; y2=&quot;155&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;217.5&quot; y2=&quot;217.5&quot;/&gt;&lt;line x1=&quot;60&quot; x2=&quot;560&quot; y1=&quot;280&quot; y2=&quot;280&quot;/&gt;
      &lt;/g&gt;

      &lt;g font-size=&quot;11&quot; class=&quot;fm&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;298&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;137&quot; y=&quot;298&quot;&gt;20k&lt;/text&gt;&lt;text x=&quot;214&quot; y=&quot;298&quot;&gt;40k&lt;/text&gt;&lt;text x=&quot;291&quot; y=&quot;298&quot;&gt;60k&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;298&quot;&gt;80k&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;298&quot;&gt;100k&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;298&quot;&gt;120k&lt;/text&gt;&lt;/g&gt;

      &lt;text x=&quot;16&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot; transform=&quot;rotate(-90 16 155)&quot;&gt;Life expectancy (anni)&lt;/text&gt;
      &lt;path id=&quot;prcurve&quot; fill=&quot;none&quot; class=&quot;si&quot; stroke-width=&quot;2.5&quot;/&gt;
